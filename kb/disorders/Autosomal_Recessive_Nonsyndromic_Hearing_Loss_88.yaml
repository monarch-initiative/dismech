phenotypes:
- name: Prelingual Mixed Hearing Impairment
  category: Ear
  description: >-
    The defining feature. Pure-tone audiometry in family PKDF468 shows severe-to-profound
    mixed loss - elevated bone conduction thresholds with an additional air-bone gap -
    present before speech acquisition. Individual V:5 had a large conductive component in
    both ears.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Mixed hearing impairment
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  notes: >-
    OBLIGATE because the paper states it of the affected individuals of the family as a
    group, and because a nonsyndromic deafness locus is ascertained through the hearing loss,
    so no unaffected homozygote could have been reported. The published denominator is one
    family; audiograms are shown for two individuals, V:2 and V:5. "Prelingual" is the
    paper's own term, taken from family history rather than from newborn screening.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss."
    explanation: Onset, severity and audiometric type in one clause.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The family history revealed that the onset of hearing loss was pre-lingual, with no clear vestibular impairment among the deaf individuals."
    explanation: >-
      The onset statement and its source - family history - together with the negative
      vestibular finding that accompanies it.
- name: Sensorineural Hearing Impairment
  category: Ear
  description: >-
    The bone-conduction component of the loss, which is what the hair-bundle mechanism
    explains. In individual V:2 bone conduction thresholds slope from mild down into the
    severe range on the right and are near-normal at low frequencies on the left.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    Curated as a separate phenotype from the mixed loss above because the two are different
    claims: that the audiogram is mixed, and that part of it is cochlear. Only the second is
    the one the pathograph accounts for. Denominator is the two individuals with published
    audiograms.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual V:2 exhibited severe-to-profound mixed hearing loss, with bone conduction thresholds for the right ear displaying a mild downward slope to the severe hearing loss range."
    explanation: >-
      Elevated bone-conduction thresholds in a named individual, which is the audiometric
      definition of a sensorineural component.
- name: Conductive Hearing Impairment
  category: Ear
  description: >-
    An air-bone gap accompanies the sensorineural loss in the affected individuals, and in
    individual V:5 it is described as large in both ears. No middle-ear pathology,
    tympanometry or imaging is reported, and nothing in the ELMOD3 mechanism as currently
    understood predicts a conductive component.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  notes: >-
    FREQUENT rather than OBLIGATE: the audiometric statement is made of the affected
    individuals as a group and of V:5 specifically, but the size of the gap is described for
    only one of the two published audiograms, so the numerator that can be defended is 2 of
    2 individuals with audiograms within a single family. Deliberately unwired from the
    pathograph - see the open discussion dfnb88_conductive_component_unexplained. Wiring it
    to the cochlear chain would assert a mechanism nobody has proposed, and temporal-bone CT
    in two affected members found a normally aerated middle ear, so there is no structural
    lesion to wire it to either.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The audiograms of individual V:5 revealed bilateral severe-to-profound mixed hearing loss, with a large conductive component in both ears."
    explanation: The conductive component, its laterality and its size, in the one individual for whom it is quantified in words.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists and none can be constructed. DFNB88 rests on one large
    consanguineous Pakistani family, PKDF468, reported in 2013; a second biallelic ELMOD3
    loss has been reported as a contiguous-gene deletion in a boy with additional
    neurodevelopmental features, which is not the same entity. There is no cohort denominator
    anywhere in the literature for this locus.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing coupled with homozygosity mapping was used to identify a transition mutation (c.794T>C; p.Leu265Ser) in ELMOD3 at the DFNB88 locus that is associated with nonsyndromic deafness in a large Pakistani family, PKDF468."
    explanation: The single family that is the entire published denominator.
genetic:
- name: ELMOD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ELMOD3
    term:
      id: hgnc:26158
      label: ELMOD3
  notes: >-
    ELMOD3 (HGNC:26158, "ELMO domain containing 3") is at 2p11.2. The HGNC record lists
    DFNB88 among its previous symbols, alongside RBM29 and RBED1, which is worth knowing when
    reading older literature. Human ELMOD3 has seven alternatively spliced isoforms; isoform
    A encodes 391 residues, and exons 7 to 11 encode the 164-residue ELMO/CED12 domain that
    carries the p.Leu265Ser substitution.

    ELMOD3 also causes autosomal dominant nonsyndromic hearing loss. A five-generation
    Chinese family with late-onset progressive deafness segregates a heterozygous c.512A>G
    (p.His171Arg) allele, which destabilises the protein and mislocalises it. That is a
    different entity with a different MONDO term and is not curated here; it is relevant
    because it means a heterozygous ELMOD3 variant in a patient is not automatically a
    carrier finding, and because the two inheritance modes are one of the things the
    knockout mouse does not reproduce.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To further confirm that the p.Leu265Ser allele of ELMOD3 is the only mutation that was associated with hearing loss at the DFNB88 locus, we sequenced the coding, non-coding, and approximately 75 bp flanking sequences of the exon-intron boundaries of all the known candidate genes present within the linkage region in two affected individuals of family PKDF468."
    explanation: >-
      How the other genes in the interval were excluded, which is what makes ELMOD3 the
      causal gene rather than a candidate within a linkage region.
  - reference: PMID:29713870
    reference_title: "ELMOD3, a novel causative gene, associated with human autosomal dominant nonsyndromic and progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "novel missense variant, c.512A>G (p.His171Arg) in exon 8 of the ELMO domain-containing 3 (ELMOD3) gene, was identified as a causative variant in this family affected by late-onset and progressive ADNSHL."
    explanation: >-
      The dominant ELMOD3 entity, recorded so that this entry's recessive scope is explicit.
      INDIRECT because the finding is about a different disease and bears on DFNB88 only
      through the shared gene.
diagnosis:
- name: ELMOD3 sequencing in unexplained prelingual recessive hearing loss
  description: >-
    DFNB88 was solved by exome sequencing after linkage, at a time when ELMOD3 was on no
    hearing-loss panel; the family had already been excluded against short tandem repeat
    markers for 74 known recessive deafness loci. The practical point for a clinical
    laboratory is that a heterozygous ELMOD3 variant cannot be dismissed as a carrier
    finding, because the gene also has a dominant entity, and that the DFNB88 locus interval
    overlaps the dominant locus DFNA43 - so the two are easily conflated in older records
    even though ELMOD3 lies outside the reported DFNA43 interval and was excluded in the
    original DFNA43 family.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We initially observed that deafness in family PKDF468 did not co-segregate with short tandem repeat (STR) markers for 74 of the reported recessive nonsyndromic deafness loci"
    explanation: >-
      The exclusion of the known loci, which is what made a novel locus the working
      hypothesis.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although, ELMOD3 is located outside the reported linkage interval of DFNA43"
    explanation: >-
      The relationship between the recessive and dominant loci at 2p, which is the specific
      confusion this diagnostic note exists to prevent.
- name: Temporal-bone computed tomography
  description: >-
    CT of the temporal bones was performed on two affected individuals and a normal-hearing
    sibling in the defining family. It is recorded because its result is a negative one that
    constrains the interpretation of the audiogram: the middle ear, mastoid and external
    canals were normal, so the air-bone gap in this family has no imaged structural
    explanation. The one incidental finding was a slightly narrow right internal auditory
    canal in one patient, unilateral and medial to the conductive mechanism.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT scan of individual V:2 revealed all three semicircular and internal auditory canals were intact on both sides."
    explanation: The inner-ear anatomy in the more completely scanned patient.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging of individual V:11 demonstrated a slightly narrow appearing internal auditory canal on the right side only."
    explanation: >-
      The only positive imaging finding in the series, recorded with its laterality because
      a unilateral narrow canal cannot explain a bilateral loss.
treatments:
- name: Hearing Amplification and Audiological Rehabilitation
  description: >-
    No treatment is reported for any member of family PKDF468 and nothing gene-directed
    exists. Amplification and audiological rehabilitation are curated as the management that
    the severity and prelingual onset indicate; they substitute external gain for a failing
    cochlea and do not act on the ELMOD3 mechanism.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification and audiological rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Cochlear Sensory Transduction Failure
    treatment_effect: BYPASSES
    description: >-
      Amplification raises the signal reaching a cochlea whose transduction and amplification
      are failing. It does not restore stereocilia architecture.
  notes: >-
    Deliberately uncited at treatment level. The defining paper reports no management for any
    affected individual, and no subsequent paper reports treatment of a DFNB88 patient, so
    there is no source that could be quoted for this treatment *in this disease*. It is
    curated because it is the intervention the audiogram indicates, and the absence of a
    citation is the honest record of that. Cochlear implantation is not curated: it would be
    a reasonable option for severe-to-profound loss, but no DFNB88 patient has been reported
    to have received one, and the mixed audiogram with a large conductive component is
    exactly the situation in which the implant decision is not straightforward.
- name: Genetic Counselling and Cascade Testing
  description: >-
    Recessive counselling with a 25 percent sibling recurrence risk in a consanguineous
    family. The gene's dominant entity complicates the carrier conversation: a heterozygous
    ELMOD3 variant is not automatically benign, and the counselling has to distinguish the
    known recessive allele in the family from an incidental heterozygous finding.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a double horizontal line connecting parents represents a consanguineous marriage"
    explanation: >-
      The family structure counselling acts on, from the pedigree legend of the defining
      family.
animal_models:
- name: Elmod3 constitutive knockout mouse
  species: Mouse
  genotype: Elmod3 exon 6 frameshift null allele, homozygous, on C57BL/6
  publication: PMID:31628468
  genes:
  - preferred_term: ELMOD3
    term:
      id: hgnc:26158
      label: ELMOD3
  description: >-
    A CRISPR/Cas9 null generated by a 277 bp deletion at exon 6, producing a premature stop
    at residue 149; ELMOD3 protein is undetectable in the homozygous cochlea. This model
    carries essentially all of the mechanism downstream of the GAP defect in this entry.
    Heterozygotes have normal thresholds, so it models the recessive entity rather than the
    dominant one.
  modeled_mechanisms:
  - target: Disorganized Stereociliary Actin Cytoskeleton
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Phalloidin signal is much weaker throughout the knockout cochlea, most markedly in hair
      cells, and stereocilia formation and maturation are already delayed at postnatal day 1.
    limitations: >-
      The mouse is a complete null and the human allele is a missense change that leaves the
      protein in place; a null and a catalytically dead protein need not have the same
      cellular consequence, particularly for a protein that also has a localisation function.
      No human cochlear tissue has been examined, so the actin phenotype is assumed rather
      than shown in the disease.
    readouts:
    - name: Cochlear F-actin content by phalloidin staining
      target: Disorganized Stereociliary Actin Cytoskeleton
      direction: DECREASED
      interpretation: >-
        Reduced phalloidin signal across hair cells, supporting cells, spiral ganglion and
        spiral ligament in the knockout compared with wild type.
      evidence:
      - reference: PMID:31628468
        reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These results indicated a reduction of F-actin cytoskeleton formation in Elmod3 KO mice and therefore suggested that Elmod3 is required for the proper organization of F-actin networks."
        explanation: The measurement and the direction of change.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our finding associates Elmod3 deficiencies with stereocilia dysmorphologies and reveals that they might play roles in the actin cytoskeleton dynamics in cochlear hair cells, and thus relate to hearing impairment."
      explanation: Why this model is treated as informative for the actin node.
  - target: Inner Hair Cell Stereocilia Shortening and Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Inner hair cell stereocilia are significantly shortened at two months and by five
      months show noticeable degeneration, with a few inner hair cells lacking bundles
      entirely.
    limitations: >-
      The human bundle has never been examined, so the correspondence is between a mouse
      structural phenotype and a human audiogram. The direction is also the opposite of the
      paralogue Elmod1 knockout, in which stereocilia elongate, so the bundle consequence of
      losing an ELMOD protein is not generic and should not be transferred between them.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The deafness associated with the mutation may be caused by cochlear hair cells dysfunction, which manifests with shortening and fusion of inner hair cells stereocilia and progressive degeneration of outer hair cells stereocilia."
      explanation: The bundle phenotype this link is cited for.
  - target: Cochlear Sensory Transduction Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse goes deaf, which is the right outcome, but on a completely different schedule
      from the humans: thresholds are normal at one month, shift from two months, and worsen
      to five months.
    limitations: >-
      The affected members of family PKDF468 are deaf before they learn to speak, to a
      severe-to-profound degree, while the knockout has normal hearing for its first two
      months and then develops a moderate loss. The mouse also has a purely sensorineural
      phenotype and the humans have mixed audiograms. Both are recorded as an open
      human-model mismatch.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The conductive component of the human audiogram has no counterpart in the model. The
        mouse work measures auditory brainstem response and otoacoustic emission thresholds,
        both of which report cochlear function, and no middle-ear measurement is made.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Onset differs by the whole of development: prelingual in the humans, postnatal month
        two in the mouse. The knockout paper raises gene dosage as a candidate explanation
        for the species difference, since only homozygous mice are affected while ELMOD3
        causes dominant as well as recessive deafness in people.
    evidence:
    - reference: PMID:31628468
      reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that Elmod3−/− mice exhibited significant HL beginning at the age of 2 months and progressed with age."
      explanation: >-
        The model's hearing phenotype and its timing, which is what this link is cited for
        and also what diverges from the human course.
discussions:
- discussion_id: dfnb88_onset_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Cochlear Sensory Transduction Failure"
  - "animal_models#Mouse"
  prompt: >-
    Why is the Elmod3 knockout mouse a normal-hearing animal for two months and then a
    progressively deaf one, when the affected members of family PKDF468 are deaf before they
    speak?
  rationale: >-
    Filed as a mismatch rather than a knowledge gap because both observations were made and
    they disagree.

    The mouse is unambiguous. Auditory brainstem response thresholds are indistinguishable
    from wild type at one month, shift at two months, and worsen through five. Bundle
    morphology at postnatal day 14 is indistinguishable from wild type by scanning electron
    microscopy. The whole mouse account is one of a bundle that is built and then fails.

    The humans do not fit it. The onset is prelingual by family history and the loss is
    severe-to-profound, which is a disease established before speech acquisition rather than
    one that arrives in adulthood.

    Three explanations are available and none has been tested. The human allele is a missense
    change in the ELMO domain while the mouse is a frameshift null, so the two are not the
    same lesion and a dead-but-present protein could be worse than an absent one if ELMOD3
    also localises other components. Cochlear maturation timing differs - the mouse cochlea
    matures postnatally and the human cochlea before birth - so a mouse deficit appearing at
    two months could correspond to a human deficit appearing in utero, which would make the
    two the same lesion on different clocks. Or gene dosage genuinely differs between the
    species, which is what the knockout authors propose, pointing out that ELMOD3
    heterozygotes are affected in one human family while heterozygous mice are not.

    Why it matters for reading this entry: everything between the GAP defect and the
    audiogram is mouse. If the human lesion turns out to be developmental rather than a
    maintenance failure, the bundle findings would survive but their placement in time would
    not.
  evidence:
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although mutations in ELMOD3 genes have been associated with progressive HL in humans and mice, the pattern of inheritance difference between the two species may suggest that ELMOD3 gene dosage may have a more significant effect in humans compared with mice."
    explanation: >-
      The knockout authors' own statement of a species difference, and the dosage explanation
      they offer for it.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss."
    explanation: The human half of the mismatch.
- discussion_id: dfnb88_conductive_component_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "phenotypes#Conductive Hearing Impairment"
  prompt: >-
    What produces the conductive component of the DFNB88 audiogram, and is it part of the
    disease at all?
  rationale: >-
    The audiograms in family PKDF468 are of mixed loss, and in individual V:5 the conductive
    component is described as large in both ears. Nothing in the ELMOD3 mechanism predicts
    it: the protein localises to hair cell stereocilia, kinocilia and cuticular plate, the
    knockout mouse phenotype is entirely cochlear, and neither paper proposes a middle-ear
    role.

    Imaging has been done and it does not account for the gap. The defining paper performed
    temporal-bone computed tomography on two affected individuals and a normal-hearing
    sibling: the middle ear and mastoid were well aerated bilaterally in both patients, the
    external auditory canals were normal, and the only asymmetry was a slightly narrow right
    internal auditory canal in one of them - which is medial to the conductive mechanism and
    would not produce an air-bone gap. So a gross middle-ear or ossicular malformation is
    excluded for these two patients.

    What has not been done is the functional middle-ear assessment. No tympanometry, acoustic
    reflex, or wideband immittance result is reported for anyone in the family. That leaves
    three live possibilities that the published data cannot separate: a functional middle-ear
    abnormality with normal CT anatomy, such as effusion or ossicular fixation too subtle to
    image; an independently segregating or acquired middle-ear disease in a large
    consanguineous family in a setting where chronic otitis media is common; or a masking or
    bone-conduction calibration artefact, which is a known hazard when measuring bone
    thresholds in severe-to-profound loss, where the transducer's output ceiling is reached.

    It matters for two reasons. If the conductive component is real and part of DFNB88, the
    entity is not purely a hair-bundle disease and the pathograph here is incomplete. And if
    it is not, then the MONDO and OMIM descriptions of DFNB88 as nonsyndromic sensorineural
    deafness are right and the audiometric type recorded in this entry overstates the
    cochlear claim. The phenotype is therefore curated and deliberately left unwired.
  proposed_experiments:
  - experiment_id: dfnb88_middle_ear_assessment
    name: Middle-ear assessment in a new DFNB88 family
    description: >-
      Tympanometry, acoustic reflexes and wideband immittance in homozygous ELMOD3
      individuals, with bone-conduction masking and transducer output limits documented,
      in any newly ascertained family. Temporal-bone CT has already been done in the
      defining family and was normal, so the missing measurement is functional rather than
      anatomical.
    would_support:
    - "phenotypes#Conductive Hearing Impairment"
    supporting_outcome:
    - >-
      Abnormal tympanometry or acoustic reflexes in homozygotes, absent in heterozygous
      relatives, would establish the conductive component as part of the disease.
    refuting_outcome:
    - >-
      Normal tympanometry and normal acoustic reflexes in homozygotes with a persistent
      air-bone gap, alongside the already-normal CT, would point to a masking or
      bone-conduction calibration artefact rather than to middle-ear disease.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The audiograms of individual V:5 revealed bilateral severe-to-profound mixed hearing loss, with a large conductive component in both ears."
    explanation: The observation that the gap exists and is large.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The middle ear and mastoid appeared well-aerated bilaterally."
    explanation: >-
      Refutes a gross middle-ear malformation as the source of the air-bone gap in the
      individual with the more complete scan, which is what narrows the open question to the
      functional and artefactual explanations.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To determine the temporal bone malformation, we performed computed tomography (CT) scans of two affected (V:2 and V:11) along with a normal hearing sibling (V:7)."
    explanation: >-
      What imaging was actually done and in whom, which is the denominator behind the
      statement that the anatomical question has been answered and the functional one has
      not.
external_assertions:
- name: OMIM deafness, autosomal recessive 88 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:615429
  url: https://omim.org/entry/615429
  description: >-
    The OMIM phenotype record for DFNB88. Recorded here rather than under mappings because
    the DiseaseMappings class carries only ICD-10-CM, ICD-11, MONDO and NCIT slots. The OMIM
    identifier is the cross-reference MONDO:0014182 itself carries.
notes: >-
  Scope decision: curated as a DISEASE, standalone. One gene, one proximal molecular lesion -
  loss of ARL2 GAP activity - and one clinical picture in one family. It is not a subtype of
  any curated dismech entry; its MONDO parent MONDO:0019588 (hearing loss, autosomal
  recessive) is an ontology grouping of dozens of unrelated DFNB loci and is not a dismech
  entry. dismech already curates many individual DFNA/DFNB loci as standalone per-gene
  entries and this follows that pattern. The stub is deleted by this change.

  ELMOD3 was clear across kb/disorders/ before this entry, so nothing here overlaps existing
  coverage. The gene symbol was confirmed against the HGNC REST API rather than from memory:
  HGNC:26158 is ELMOD3, "ELMO domain containing 3", with previous symbols RBM29, RBED1 and
  DFNB88 and alias FLJ21977. That last previous symbol is a real trap - a paper or database
  row referring to "DFNB88" as a gene symbol means ELMOD3.

  What is deliberately not curated, and what was searched before concluding so. There is no
  biochemical or histopathology block: no patient tissue has been published for this entity.
  There is no imaging_findings block either, but that is a different call - temporal-bone CT
  has been reported and it is curated, under diagnosis rather than as an imaging finding,
  because what it establishes is the absence of a finding. There is no datasets block - a GEO DataSets search for
  ELMOD3 returns ten records, all mouse neurogenesis splicing screens and an Elmod3 knockdown
  in N2A neuroblastoma cells, none of them cochlear and none of them about this disease; that
  is the gene-only search trap rather than coverage. No clinical trial is curated: a
  ClinicalTrials.gov API query returns zero studies for "ELMOD3" and zero for "DFNB88". No
  environmental factor is curated - no published noise-exposure or ototoxin interaction was
  found for this gene. Cochlear implantation is argued against in the treatment notes.
  The dominant ELMOD3 entity (a five-generation Chinese family with c.512A>G p.His171Arg) is
  a different MONDO concept and is not curated here; it is described in the genetic notes
  because it changes how a heterozygous ELMOD3 finding should be read.

  On the patient-derived iPSC line (PMID:37708136). It is listed in the top-level references
  and is not curated as an experimental model. The line carries the heterozygous c.512A>G
  dominant allele, not the DFNB88 recessive allele, and its read-out is a transcriptome of
  undifferentiated iPSCs rather than of hair cells - so attaching it to a node in this entry
  would attribute to DFNB88 a measurement made on a different allele in a different entity.

  On the second biallelic ELMOD3 case (PMID:30284680). The homozygous 2p11.2 deletion is
  cited in the inheritance block as INDIRECT support for biallelic ELMOD3 loss causing
  hearing impairment, and nowhere else. It removes CAPG and SH2D6 as well, and the boy has
  autism and intellectual disability, which the authors attribute to CAPG. Treating it as a
  DFNB88 case would import a neurodevelopmental phenotype into a nonsyndromic entity.

  On the deep-research report.
  research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_88-deep-research-falcon.md is
  committed with this entry. It was gated before being read for content, because the Named
  Entity Confusion risk here is high - "DFNB88" is also a previous HGNC symbol for ELMOD3
  itself. It passes: just preflight-dr reports ELMOD3 as the top gene at 53 mentions against
  11 for the next token, and the report names the right family (PKDF468, 3 mentions) and the
  right allele (Leu265Ser, 16). Its seven references all resolved, with a confabulation rate
  of zero, and all thirteen ontology terms it suggested resolved through OLS. The one term
  flagged as misnamed is the template's own "if available" placeholder against
  MONDO:0014182, not a report claim.

  Nothing in this entry was taken from it. Every claim here was already sourced from the
  reference cache before the report ran, and the terms were resolved independently. Its
  contribution was three confirmations: that the temporal-bone CT result is what constrains
  the conductive question - which it reaches independently and states as such; that no
  DFNB88-specific trial or therapy exists in its searched sources; and that no
  DFNB88-specific omics dataset exists. It also surfaced two leads not used here: a second
  dominant ELMOD3 allele, c.640G>A p.(Gly214Ser), cited to a 2025 medRxiv preprint, which
  belongs to the dominant entity rather than to DFNB88; and a category-level Pakistani
  prevalence figure of under 2 percent for genes outside the thirteen commonest, which is
  about a category and not about this gene. Its ciliary-trafficking paragraph is attributed
  to the iPSC paper, which did not report that work, so that attribution should not be
  carried forward.

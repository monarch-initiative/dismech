      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss.
      explanation: The clinical outcome of the mechanism in the defining family.
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    description: The sensorineural component of the human mixed hearing loss is consistent with the cochlear mechanism; the conductive component remains unexplained.
    evidence:
    - reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Pure-tone bone and air-conduction audiometry revealed severe-to-profound mixed (conductive and sensorineural) hearing loss in the affected individuals of family PKDF468
      explanation: Bone-conduction thresholds are elevated, which is what makes part of this loss sensorineural rather than purely conductive.
  evidence:
  - reference: PMID:31628468
    reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: Our finding associates Elmod3 deficiencies with stereocilia dysmorphologies and reveals that they might play roles in the actin cytoskeleton dynamics in cochlear hair cells, and thus relate to hearing impairment.
    explanation: The knockout paper's own statement of the link between the bundle lesion and hearing. INDIRECT because it is a mouse and the authors hedge the mechanistic claim.
  notes: The available data do not demonstrate spiral ganglion degeneration or substantial hair-cell death, so conformance to the combined death/degeneration nodes of the sensorineural_hair_cell_loss module is not asserted. Mouse ABR and DPOAE abnormalities support hearing dysfunction but do not by themselves establish a purely sensorineural phenotype.
- name: Reduced Primary Cilium Formation
  biological_scale: CELLULAR
  role: mediator
  mechanism_confidence: PROVISIONAL
  description: CRISPR disruption of Elmod3 in immortalized mouse embryonic fibroblasts reduces the fraction of ciliated cells after serum starvation. Normal CEP164 recruitment and CP110 removal place the observed defect after early ciliogenesis licensing. This is a candidate ELMOD3 function relevant to developing hair-cell kinocilia, not a demonstrated DFNB88 cochlear lesion.
  evidence:
  - reference: PMID:34818063
    reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that ciliation was strongly decreased in Elmod1 and Elmod3 single KO MEFs, with <10% of cells on average having a cilium after 24 hr of serum starvation, compared with >60% in WT controls
    explanation: A direct cell-model ciliation measurement; neither human DFNB88 nor cochlear cilia were measured.
- name: Altered Ciliary Cargo Localization
  biological_scale: CELLULAR
  role: mediator
  mechanism_confidence: PROVISIONAL
  description: Elmod3-deficient fibroblasts show depletion of ARL13B, ARL3 and INPP5E from remaining cilia. IFT88, IFT140 and GLI3 localization is preserved, indicating selective cargo effects rather than a universal transport failure. These results have not been reproduced in DFNB88 patient cells or cochlear hair cells.
  evidence:
  - reference: PMID:34818063
    reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We also discovered changes in the ciliary content of at least three proteins in cells lacking ELMOD1 and/or ELMOD3: ARL13B, ARL3, and INPP5E.'
    explanation: Selective loss of ciliary cargo is a direct cell-model observation, not evidence of a human multisystem ciliopathy.
- name: Golgi Accumulation of Ciliary Cargo
  biological_scale: CELLULAR
  role: mediator
  mechanism_confidence: PROVISIONAL
  description: INPP5E and IFT140 accumulate at the Golgi in Elmod3-deficient fibroblasts. INPP5E accumulation is more prominent after 24 than 72 hours of serum starvation, and its detection depends on fixation conditions. Delayed export is proposed; ciliary IFT140 localization remains preserved despite its increased Golgi pool.
  evidence:
  - reference: PMID:34818063
    reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, the presence of INPP5E at the Golgi is evident in well over half of all Elmod1, Elmod3, and DKO cell lines after 24 h of serum starvation
    explanation: Direct Golgi localization result in serum-starved fibroblasts. The effect waned at later times.
phenotypes:
- name: Prelingual Mixed Hearing Impairment
  category: Ear
  description: The defining feature. Pure-tone audiometry in family PKDF468 shows severe-to-profound mixed loss - elevated bone conduction thresholds with an additional air-bone gap - present before speech acquisition. Individual V:5 had a large conductive component in both ears.
  phenotype_term:
    preferred_term: Mixed hearing impairment
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  notes: Audiograms were published for V:2 and V:5 within one family. Prelingual onset was obtained from family history rather than newborn screening. The available ascertainment does not establish a population frequency for mixed loss or a longitudinal human progression pattern.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss.
    explanation: Onset, severity and audiometric type in one clause.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The family history revealed that the onset of hearing loss was pre-lingual, with no clear vestibular impairment among the deaf individuals.
    explanation: The onset statement and its source - family history - together with the negative vestibular finding that accompanies it.
- name: Sensorineural Hearing Impairment
  category: Ear
  description: The bone-conduction component of the loss, which is what the hair-bundle mechanism explains. In individual V:2 bone conduction thresholds slope from mild down into the severe range on the right and are near-normal at low frequencies on the left.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: Elevated bone-conduction thresholds establish a sensorineural component in the published audiograms. The severity of the combined air-conduction loss should not be assigned to the sensorineural component alone.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individual V:2 exhibited severe-to-profound mixed hearing loss, with bone conduction thresholds for the right ear displaying a mild downward slope to the severe hearing loss range.
    explanation: Elevated bone-conduction thresholds in a named individual, which is the audiometric definition of a sensorineural component.
- name: Conductive Hearing Impairment
  category: Ear
  description: An air-bone gap accompanies the sensorineural hearing loss; individual V:5 has a large conductive component in both ears. Temporal-bone CT was reported for V:2 and V:11, with well-aerated middle ears and mastoids. Functional middle-ear measurements were not reported, and the conductive contribution is not explained by the proposed hair-bundle mechanism.
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  notes: The observation comes from one ascertained family and does not support a disease-wide frequency band. The patient with the specifically described large bilateral gap, V:5, was not one of the two affected individuals examined by CT. Preserved aeration does not exclude all ossicular or other conductive disorders.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The audiograms of individual V:5 revealed bilateral severe-to-profound mixed hearing loss, with a large conductive component in both ears.
    explanation: The conductive component, its laterality and its size, in the one individual for whom it is quantified in words.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: The defining 2013 report describes one consanguineous Pakistani family. It does not provide a population denominator or prevalence estimate. The separate homozygous ELMOD3/CAPG/SH2D6 deletion report describes a possible contiguous-gene syndrome and is not pooled with isolated DFNB88.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing coupled with homozygosity mapping was used to identify a transition mutation (c.794T>C; p.Leu265Ser) in ELMOD3 at the DFNB88 locus that is associated with nonsyndromic deafness in a large Pakistani family, PKDF468.
    explanation: An ascertained family establishes the clinical association, not population prevalence.
genetic:
- name: ELMOD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ELMOD3
    term:
      id: hgnc:26158
      label: ELMOD3
  notes: The recessive p.Leu265Ser allele affects the ELMO domain. A separate heterozygous p.His171Arg allele was reported with late-onset progressive dominant hearing loss; interpretation of a heterozygous ELMOD3 finding must therefore be variant-specific. The homozygous deletion of ELMOD3 together with CAPG and SH2D6 is supportive gene-level evidence but does not isolate the contribution of ELMOD3 to the additional neurodevelopmental features.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To further confirm that the p.Leu265Ser allele of ELMOD3 is the only mutation that was associated with hearing loss at the DFNB88 locus, we sequenced the coding, non-coding, and approximately 75 bp flanking sequences of the exon-intron boundaries of all the known candidate genes present within the linkage region in two affected individuals of family PKDF468.
    explanation: Sequencing other interval genes supported ELMOD3 prioritization; segregation and variant-specific functional findings together support the association, without excluding every possible linked regulatory change.
  - reference: PMID:29713870
    reference_title: ELMOD3, a novel causative gene, associated with human autosomal dominant nonsyndromic and progressive hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: novel missense variant, c.512A>G (p.His171Arg) in exon 8 of the ELMO domain-containing 3 (ELMOD3) gene, was identified as a causative variant in this family affected by late-onset and progressive ADNSHL.
    explanation: The dominant ELMOD3 entity, recorded so that this entry's recessive scope is explicit. INDIRECT because the finding is about a different disease and bears on DFNB88 only through the shared gene.
  variants:
  - name: NM_032213.4:c.794T>C (p.Leu265Ser)
    description: Homozygous missense allele segregating with prelingual hearing impairment in PKDF468. The numbering uses the transcript in the original report. Functional assays show markedly reduced ARL2 GAP activity and impaired subcellular targeting, while weak F-actin co-sedimentation is preserved. The fully penetrant recessive linkage model was an analytical assumption, not a measured penetrance estimate.
    evidence:
    - reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Exome sequencing coupled with homozygosity mapping was used to identify a transition mutation (c.794T>C; p.Leu265Ser) in ELMOD3 at the DFNB88 locus that is associated with nonsyndromic deafness in a large Pakistani family, PKDF468.
      explanation: Segregation, positional evidence and functional experiments support the reported recessive allele; no modern ACMG classification is inferred.
diagnosis:
- name: Molecular diagnosis and variant interpretation
  description: Molecular evaluation of recessive prelingual hearing loss can include a multigene panel or genomic testing with ELMOD3 analysis. Interpretation requires phenotype, inheritance, segregation and variant-level evidence; a variant of uncertain significance does not confirm DFNB88. The original family was solved by linkage and exome sequencing after excluding known loci. Dominant ELMOD3-associated hearing loss must be distinguished from recessive DFNB88.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We initially observed that deafness in family PKDF468 did not co-segregate with short tandem repeat (STR) markers for 74 of the reported recessive nonsyndromic deafness loci
    explanation: The exclusion of the known loci, which is what made a novel locus the working hypothesis.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although, ELMOD3 is located outside the reported linkage interval of DFNA43
    explanation: The relationship between the recessive and dominant loci at 2p, which is the specific confusion this diagnostic note exists to prevent.

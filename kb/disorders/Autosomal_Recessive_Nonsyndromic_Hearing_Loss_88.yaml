inheritance:
- name: Autosomal recessive
  description: >-
    The defining family is consanguineous, and the affected individuals are homozygous for
    c.794T>C (p.Leu265Ser); linkage under a fully penetrant recessive model with a disease
    allele frequency of 0.001 gave a maximum two-point LOD score of 4.74 at marker D2S2333.
    Heterozygous relatives hear normally. A separate homozygous 2p11.2 deletion removing
    ELMOD3 together with CAPG and SH2D6 has since been reported in a boy with hearing
    impairment alongside autism and intellectual disability, which supports biallelic ELMOD3
    loss as a cause of hearing impairment but is a contiguous-gene deletion rather than a
    DFNB88 family.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing coupled with homozygosity mapping was used to identify a transition mutation (c.794T>C; p.Leu265Ser) in ELMOD3 at the DFNB88 locus that is associated with nonsyndromic deafness in a large Pakistani family, PKDF468."
    explanation: >-
      The gene, the allele, the locus and the recessive study design in one sentence.
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haplotype analysis revealed a 0.91 Mb linkage interval that was delimited by the markers D2S1387 and D2S2232"
    explanation: >-
      The homozygous interval on 2p11.2 that defines DFNB88, from the genome-wide linkage
      scan.
  - reference: PMID:30284680
    reference_title: "Homozygous 2p11.2 deletion supports the implication of ELMOD3 in hearing loss and reveals the potential association of CAPG with ASD/ID etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "we identified a rare homozygous deletion in 2p11.2 region that affects ELMOD3, CAPG, and SH2D6 genes in a boy with ASD, intellectual disability (ID), and hearing impairment (HI)"
    explanation: >-
      A second, independent biallelic ELMOD3 loss with hearing impairment. Graded INDIRECT
      because the deletion removes two further genes, so it supports the recessive model for
      the gene without being a DFNB88 observation.
pathophysiology:
- name: ELMOD3 Biallelic Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two copies of the c.794T>C (p.Leu265Ser) allele, which substitutes serine for a leucine
    that is conserved across species and that lies inside the ELMO/CED12 domain. The
    substitution is present in every ELMO-domain-containing isoform of ELMOD3, so it is not
    escaped by alternative splicing. The protein is still made - what is lost is what the
    ELMO domain does.
  genes:
  - preferred_term: ELMOD3
    term:
      id: hgnc:26158
      label: ELMOD3
  genetic_context:
    genes:
    - preferred_term: ELMOD3
      term:
        id: hgnc:26158
        label: ELMOD3
    allele_type: missense variant in the ELMO/CED12 domain
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of ARL2 GTPase-Activating Activity
    causal_link_type: DIRECT
    description: >-
      The disease allele sits in the ELMO domain, which is the domain that carries the GAP
      activity, and recombinant protein bearing it has no measurable activity against ARL2.
    evidence:
    - reference: PMID:24039609
      reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, recombinant human GST-ELMOD3 exhibited GTPase activating protein (GAP) activity against the Arl2 GTPase, which was completely abolished by the p.Leu265Ser mutation."
      explanation: >-
        The allele and the loss of activity measured on the same recombinant protein, which
        is what makes this edge a direct one rather than an inference from domain position.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.794T>C transition mutation is predicted to result in the substitution of serine for a highly conserved leucine in all of the ELMO domain-containing isoforms of ELMOD3"
    explanation: >-
      The consequence of the allele at protein level and the reason no isoform escapes it.
- name: Loss of ARL2 GTPase-Activating Activity
  biological_scale: MOLECULAR
  role: mediator
  mechanism_confidence: ESTABLISHED
  description: >-
    ELMOD3 is a GTPase-activating protein for ARL2, an ARF-family GTPase. The p.Leu265Ser
    protein retains no or almost no activity in vitro. In the mouse cochlea ARL2 protein
    itself is less abundant when Elmod3 is absent, from postnatal day 7 onwards, so the
    consequence in tissue is not only a slower GTP-hydrolysis cycle but a smaller ARL2 pool.
  molecular_functions:
  - preferred_term: ARL2 GTPase-activating protein activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005096
      label: GTPase activator activity
  downstream:
  - target: Disorganized Stereociliary Actin Cytoskeleton
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a lost GAP activity to a disordered actin cytoskeleton is the weakest
      link in this chain and is curated as such. What is measured is that ELMOD3 localises
      with actin and that the disease allele abolishes that localisation, and separately that
      the knockout cochlea has less F-actin. The intermediate - which ARF-family GTPase acts
      on which actin regulator - is the paper's own speculation.
    evidence:
    - reference: PMID:24039609
      reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Fluorescently tagged ELMOD3 co-localized with the actin cytoskeleton in MDCK cells and actin-based microvilli of LLC-PK1-CL4 epithelial cells. The p.Leu265Ser mutation in the ELMO domain impaired each of these activities."
      explanation: >-
        The disease allele breaks the association with actin in a heterologous cell system.
        INDIRECT because the cells are not hair cells and the read-out is localisation rather
        than bundle architecture.
  evidence:
  - reference: PMID:24039609
    reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our in vitro experiment revealed that ELMOD3 harboring the p.Leu265Ser mutation, unlike ELMOD3, has no or few GAP activity against Arl2."
    explanation: The state of this node in the patient allele, measured directly.
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Loss of Elmod3 and reduction in ARL2 expression level are likely responsible for the altered hair bundle morphology observed in Elmod3"
    explanation: >-
      The authors' summary of the ARL2 arm in the knockout cochlea. Graded INDIRECT: it is a
      mouse, and the sentence is the paper's interpretation of its own western blot and
      immunohistochemistry rather than a measurement.
  notes: >-
    ELMOD3 is described as a comparatively weak ARL2 GAP, and the knockout paper raises that
    as a possible reason its mouse phenotype is moderate. This entry does not adopt that as a
    mechanism - it is an explanation offered for an inter-species discrepancy, not a measured
    property of the human disease.
- name: ELMOD3 Localisation to Cochlear Hair Cell Stereocilia
  biological_scale: CELLULAR
  role: context
  mechanism_confidence: ESTABLISHED
  description: >-
    Where the protein is, in rodent inner ear, and the reason the disease is cochlear and not
    vestibular. ELMOD3 immunoreactivity is in the stereocilia, kinocilia and cuticular plate
    of developing cochlear hair cells, more intense in inner than in outer hair cells. In the
    saccule, utricle and ampulla the antibody labels hair cell and supporting cell bodies but
    not the hair bundles.
  cell_types:

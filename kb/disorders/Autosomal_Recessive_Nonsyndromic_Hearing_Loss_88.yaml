    supports: SUPPORT
    evidence_source: OTHER
    snippet: The identification of variant(s) of ... uncertain significance ... cannot be used to confirm or rule out the diagnosis.
    explanation: A VUS is not a confirmed molecular diagnosis.
- name: Temporal-bone computed tomography
  description: Temporal-bone CT in V:2 and V:11, with normal-hearing sibling V:7 as a comparison, showed well-aerated middle ears and mastoids. V:11 had a slightly narrow right internal auditory canal. These findings do not explain the mixed audiograms or exclude every functional or subtle structural cause of an air-bone gap. V:5, whose large bilateral gap is specifically described, was not among those scanned.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CT scan of individual V:2 revealed all three semicircular and internal auditory canals were intact on both sides.
    explanation: The inner-ear anatomy in the more completely scanned patient.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Imaging of individual V:11 demonstrated a slightly narrow appearing internal auditory canal on the right side only.
    explanation: The only positive imaging finding in the series, recorded with its laterality because a unilateral narrow canal cannot explain a bilateral loss.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To determine the temporal bone malformation, we performed computed tomography (CT) scans of two affected (V:2 and V:11) along with a normal hearing sibling (V:7).
    explanation: Identifies the imaged individuals, avoiding conflation with V:5.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The middle ear and mastoid appeared well-aerated bilaterally.
    explanation: Preserved aeration is a limited negative finding, not exclusion of all conductive pathology.
- name: Audiological and vestibular assessment
  description: Air- and bone-conduction audiometry establishes the mixed hearing phenotype and distinguishes its conductive and sensorineural components. The defining family had no clear vestibular impairment on history and Romberg/tandem-gait examination; this is not equivalent to a comprehensive vestibular laboratory assessment.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pure-tone bone and air-conduction audiometry revealed severe-to-profound mixed (conductive and sensorineural) hearing loss in the affected individuals of family PKDF468
    explanation: Both audiometric modalities were used.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The family history revealed that the onset of hearing loss was pre-lingual, with no clear vestibular impairment among the deaf individuals.
    explanation: The reported absence of clear vestibular symptoms does not establish normality on every vestibular test.
treatments:
- name: Hearing Aid Amplification
  description: Individualized hearing-aid fitting and audiological follow-up may improve access to sound when residual hearing permits useful benefit. This is general hearing-loss care; the retrieved DFNB88 reports do not establish a disease-specific response rate. The conductive contribution requires assessment alongside the sensorineural component.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hearing aids (sound amplification), ... customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General hearing-loss care supports individualized amplification; this is indirect guidance for DFNB88 rather than a reported treatment outcome.
- name: Cochlear Implantation
  description: Cochlear-implant candidacy assessment is appropriate for selected individuals with severe-to-profound sensorineural impairment and insufficient aided benefit. Evaluation should characterize the mixed loss and relevant auditory anatomy. General hearing-loss guidance supports considering implantation; the retrieved DFNB88 literature does not report implant outcomes or establish genotype-specific efficacy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cochlear implantation can be considered in children with severe-to-profound hearing loss who are older than age nine months.
    explanation: General guidance supports considering implantation after clinical assessment; this is not a DFNB88-specific efficacy claim.
    directness: INDIRECT
  target_mechanisms:
  - target: Cochlear Sensory Transduction Failure
    treatment_effect: BYPASSES
    description: Implantation can bypass impaired hair-cell transduction by stimulating the auditory nerve; individual suitability and outcomes require assessment.
- name: Genetic Counseling
  description: Counseling addresses recessive inheritance, variant interpretation, segregation testing and reproductive options. When both parents carry the relevant recessive pathogenic allele, each pregnancy has a 25% chance of an affected child. Consanguinity alone does not establish that risk. Dominant ELMOD3-associated alleles require separate interpretation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be ... heterozygous ... autosomal recessive ... hearing loss-related ... pathogenic variant ... has at conception a 25% chance of having hearing loss
    explanation: The recurrence calculation is conditional on confirmed parental carrier genotypes, not merely a consanguineous pedigree.
- name: Speech, Language and Communication Support
  description: Early, individualized speech, language, educational and communication support accompanies audiological management. D/deaf and hard-of-hearing community resources should be adapted to the child and family. This is general hearing-loss care, with no DFNB88-specific intervention trial implied.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A speech-language therapist as well as a neuropsychologist/psychologist for children with hearing loss provides access to resources within the community to aid in speech and language and D/deaf and hard of hearing (DHH) identity development.
    explanation: General hearing-loss guidance supports communication services; no disease-specific treatment outcome is asserted.
animal_models:
- name: Elmod3 constitutive knockout mouse
  species: Mouse
  genotype: Elmod3 exon 6 frameshift null allele, homozygous, on C57BL/6
  publication: PMID:31628468
  genes:
  - preferred_term: ELMOD3
    term:
      id: hgnc:26158
      label: ELMOD3
  description: A constitutive 277-bp exon-6 deletion introduces a premature stop at residue 149; ELMOD3 protein was undetectable in homozygous cochlea. ABR thresholds were normal at one month and elevated from two months, worsening at five months. Heterozygotes tested at two months had normal thresholds; this does not exclude later effects or model every dominant human allele.
  modeled_mechanisms:
  - target: Disorganized Stereociliary Actin Cytoskeleton
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Phalloidin signal is much weaker throughout the knockout cochlea, most markedly in hair cells, and stereocilia formation and maturation are already delayed at postnatal day 1.
    limitations: The mouse null and human missense allele are distinct. Recombinant p.Leu265Ser protein is stable in the tested expression system, but patient hair-cell abundance was not measured. Mouse phalloidin abnormalities do not directly establish human bundle actin pathology.
    readouts:
    - name: Cochlear F-actin content by phalloidin staining
      target: Disorganized Stereociliary Actin Cytoskeleton
      direction: DECREASED
      interpretation: Reduced phalloidin signal across hair cells, supporting cells, spiral ganglion and spiral ligament in the knockout compared with wild type.
      evidence:
      - reference: PMID:31628468
        reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These results indicated a reduction of F-actin cytoskeleton formation in Elmod3 KO mice and therefore suggested that Elmod3 is required for the proper organization of F-actin networks.
        explanation: The measurement and the direction of change.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Our finding associates Elmod3 deficiencies with stereocilia dysmorphologies and reveals that they might play roles in the actin cytoskeleton dynamics in cochlear hair cells, and thus relate to hearing impairment.
      explanation: Why this model is treated as informative for the actin node.
  - target: Inner Hair Cell Stereocilia Shortening and Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Inner hair cell stereocilia are significantly shortened at two months and by five months show noticeable degeneration, with a few inner hair cells lacking bundles entirely.
    limitations: The human bundle has never been examined, so the correspondence is between a mouse structural phenotype and a human audiogram. The direction is also the opposite of the paralogue Elmod1 knockout, in which stereocilia elongate, so the bundle consequence of losing an ELMOD protein is not generic and should not be transferred between them.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: stereocilia of IHCs were significantly shortened in Elmod3−/− mice compared with the WT littermates
      explanation: Scanning electron microscopy directly documents inner-hair-cell bundle shortening at two months.
  - target: Cochlear Sensory Transduction Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: 'The mouse goes deaf, which is the right outcome, but on a completely different schedule from the humans: thresholds are normal at one month, shift from two months, and worsen to five months.'
    limitations: PKDF468 has prelingual severe-to-profound mixed hearing impairment, whereas null mice have normal ABR thresholds at one month and elevated thresholds from two months. ABR/DPOAE tests without dedicated middle-ear assessment cannot establish that the mouse phenotype is purely sensorineural.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: The human air-bone gap has not been adequately assessed in the mouse. ABR and DPOAE thresholds were measured, but no dedicated functional middle-ear assessment was reported.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Reported onset differs between the prelingual human phenotype and threshold elevation from mouse postnatal month two. Species, genetic background and missense-versus-null effects are not separated by this comparison.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We found that Elmod3−/− mice exhibited significant HL beginning at the age of 2 months and progressed with age.
      explanation: The model's hearing phenotype and its timing, which is what this link is cited for and also what diverges from the human course.
  - target: Reduced Cochlear ARL2 Abundance
    relationship: MEASURES
    fidelity: LOW
    description: Elmod3-null cochleae show reduced ARL2 protein by early postnatal immunoblotting and reduced immunolabeling in cochlear cells. This is a change in protein abundance, not a measurement of ARL2 activation or GTP hydrolysis. Whether restoring ARL2 rescues hearing or bundle structure remains unknown.
    limitations: A mouse null observation; contribution of this specific change to hearing loss and correspondence to human p.Leu265Ser have not been established.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Western blotting assays of ARL2 protein expression level in postnatal 7 days mice cochlea of WT mice and Elmod3−/− mice. Expression level of ARL2 protein in Elmod3−/− mice were reduced compared with WT mice
      explanation: The figure legend directly reports reduced protein abundance at postnatal day seven, distinct from GAP catalytic activity.
  - target: Outer Hair Cell Stereocilia Degeneration
    relationship: MEASURES
    fidelity: LOW
    description: Elmod3-null mice have more missing outer-hair-cell bundles than age-matched wild-type mice at five months; surviving bundles show looser stereociliary connections. The structural finding is distinguished from the functional inference of impaired cochlear amplification.
    limitations: A mouse null observation; contribution of this specific change to hearing loss and correspondence to human p.Leu265Ser have not been established.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: stereocilia of OHCs were missing in both Elmod3−/− and WT mice with an increased frequency of losses in Elmod3−/− mice compared with WT mice
      explanation: The outer hair cell bundle loss, measured against wild-type littermates of the same age so that ordinary age-related loss is controlled for. INDIRECT because it is a mouse.
  - target: Impaired Cochlear Amplification
    relationship: MEASURES
    fidelity: LOW
    description: DPOAE thresholds rise from two months in Elmod3-null mice and worsen with age, consistent with impaired outer-hair-cell-dependent amplification. DPOAEs also depend on sound transmission through the middle ear; these measurements alone do not exclude a conductive contribution.
    limitations: A mouse null observation; contribution of this specific change to hearing loss and correspondence to human p.Leu265Ser have not been established.
    evidence:
    - reference: PMID:31628468
      reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: the shifting of DPOAE thresholds indicated the reduction of the force coupled into the cochlear amplifier by OHCs motility
      explanation: DPOAE threshold shifts support impaired cochlear amplification, without directly measuring outer-hair-cell force.
      directness: INDIRECT
discussions:
- discussion_id: dfnb88_onset_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cochlear Sensory Transduction Failure
  - animal_models#Elmod3 constitutive knockout mouse
  prompt: Why is hearing impairment prelingual in PKDF468, whereas the Elmod3-null mouse has normal measured thresholds at one month and elevated thresholds from two months?
  rationale: The human missense allele and mouse constitutive null are different perturbations studied in different species. The mouse has early postnatal F-actin and bundle-development abnormalities, broadly normal day-14 scanning electron microscopy, and subsequent bundle degeneration. The evidence therefore does not establish a purely adult maintenance defect. A p.Leu265Ser knock-in and developmental functional measurements could distinguish allele-specific effects from species or background effects. No conversion of mouse age to human prenatal timing is established, and dominant human p.His171Arg results should not be used as a direct explanation of recessive DFNB88.
  evidence:
  - reference: PMID:31628468
    reference_title: Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that Elmod3−/− mice exhibited significant HL beginning at the age of 2 months and progressed with age.
    explanation: The model's hearing phenotype and its timing, which is what this link is cited for and also what diverges from the human course.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss.
    explanation: The human half of the mismatch.
- discussion_id: dfnb88_conductive_component_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Conductive Hearing Impairment
  prompt: What produces the conductive component of the DFNB88 audiogram, and is it part of the disease at all?
  rationale: Mixed audiograms are reported in PKDF468, including a large bilateral conductive component in V:5. CT in V:2 and V:11 showed preserved middle-ear/mastoid aeration, but V:5 was not scanned and functional middle-ear testing was not reported. These findings leave the cause of the air-bone gap unresolved. Neither cochlear localization nor ABR/DPOAE measurements in mice establish the absence of a conductive mechanism. Replication in unrelated families with comprehensive audiological assessment is needed before attributing the gap specifically to ELMOD3.
  proposed_experiments:
  - experiment_id: dfnb88_middle_ear_assessment
    name: Middle-ear assessment in a new DFNB88 family
    description: In molecularly established DFNB88, repeat masked air- and bone-conduction audiometry with documented output limits, tympanometry, acoustic reflexes and other indicated assessments. Compare affected and unaffected relatives and, where possible, unrelated families; interpret imaging and functional measurements together.
    would_support:
    - phenotypes#Conductive Hearing Impairment
    supporting_outcome:
    - A reproducible conductive deficit that segregates with biallelic ELMOD3 variants across independent families would support a disease association, while requiring exclusion of other causes.
    refuting_outcome:
    - Disappearance of the air-bone gap with technically adequate repeat testing would argue against the initial conductive finding. Normal tympanometry or reflexes alone would not prove a measurement artefact.
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The audiograms of individual V:5 revealed bilateral severe-to-profound mixed hearing loss, with a large conductive component in both ears.
    explanation: The observation that the gap exists and is large.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The middle ear and mastoid appeared well-aerated bilaterally.
    explanation: The preserved aeration constrains interpretation but does not exclude every conductive disorder.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To determine the temporal bone malformation, we performed computed tomography (CT) scans of two affected (V:2 and V:11) along with a normal hearing sibling (V:7).
    explanation: CT examined V:2 and V:11, not the V:5 patient with the specifically described large bilateral gap.
external_assertions:
- name: OMIM deafness, autosomal recessive 88 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:615429
  url: https://omim.org/entry/615429
  description: OMIM phenotype record for autosomal recessive deafness 88.
notes: 'This entry covers recessive DFNB88. Dominant p.His171Arg-associated hearing loss and its patient-derived iPSC study (PMID:37708136) are distinct: the latter analyzed undifferentiated iPSC transcriptomes, not DFNB88 hair cells or physiological ion transport. Its enrichment of sensory-development and potassium-transport transcripts does not establish those mechanisms in recessive disease. The ELMOD3/CAPG/SH2D6 deletion report describes a possible contiguous-gene syndrome; attribution of its neurodevelopmental findings to an individual gene remains uncertain. Fibroblast ciliogenesis and cargo-trafficking findings are included as provisional gene-level mechanisms without asserting a human multisystem ciliopathy or a demonstrated causal link to cochlear injury. No DFNB88-specific treatment efficacy or population prevalence is established by the sources used here.'
experimental_models:
- name: p.Leu265Ser expression in cochlear explants
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: P2 C57BL/6J mouse organ-of-Corti explants
  publication: PMID:24039609
  description: Organotypic cochlear explants transfected with wild-type or p.Leu265Ser GFP-ELMOD3 reveal variant-specific failure of stereociliary targeting.
  modeled_mechanisms:
  - target: Impaired ELMOD3 Targeting to Stereocilia
    relationship: MEASURES
    fidelity: MODERATE
    description: Tagged patient-variant protein remains predominantly cytosolic rather than concentrating in stereocilia.
    limitations: Cultured mouse tissue with overexpressed human protein; not endogenous patient protein, an in-vivo knock-in, or a hearing-rescue experiment.
    evidence:
    - reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Mouse organ of Corti hair cell that was transfected with GFP-ELMOD3 (p.Leu265Ser). No concentration and only negligible fluorescence is observed in the stereocilia
      explanation: Direct variant-specific targeting experiment in cultured mouse cochlear tissue; overexpression is not an in-vivo knock-in.
- name: Recombinant ELMOD3 GAP and localization assays
  experimental_model_type: CELL_LINE
  cell_source: HEK293T expression for protein purification; CL4 and MDCK epithelial cells for localization
  publication: PMID:24039609
  description: Recombinant wild-type and patient-variant ELMOD3 were compared in ARL2 GAP assays and epithelial-cell localization experiments. Cytochalasin-D disruption and recovery indicate actin-dependent localization; weak F-actin co-sedimentation is not reduced by p.Leu265Ser.
  modeled_mechanisms:
  - target: Loss of ARL2 GTPase-Activating Activity
    relationship: MEASURES
    fidelity: MODERATE
    description: Purified mutant protein has activity at the assay floor.
    limitations: Recombinant activity does not identify the physiological inner-ear substrate or quantify mutant activity in patient tissue.
    evidence:
    - reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Thus, we can safely conclude that the point mutant has at least a 10-fold lower specific activity than the wild-type protein, but it might be completely inactive as an Arl2 GAP.
      explanation: The full-text result sets a lower bound on activity loss; mutant activity was at the assay floor and indistinguishable from GST alone.
  - target: Impaired ELMOD3 Targeting to Stereocilia
    relationship: MEASURES
    fidelity: LOW
    description: CL4 microvilli and MDCK membrane localization are impaired by the patient variant.
    limitations: Non-hair-cell overexpression models cannot reproduce the architecture or function of the cochlear bundle.
    evidence:
    - reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Fluorescently tagged ELMOD3 co-localized with the actin cytoskeleton in MDCK cells and actin-based microvilli of LLC-PK1-CL4 epithelial cells. The p.Leu265Ser mutation in the ELMO domain impaired each of these activities.
      explanation: Variant-dependent mislocalization in heterologous epithelial cells.
- name: Elmod3-disrupted mouse embryonic fibroblasts
  experimental_model_type: CELL_LINE
  cell_source: Immortalized mouse embryonic fibroblasts with CRISPR-disrupted Elmod3
  publication: PMID:34818063
  description: Multiple predicted-null clones show reduced ciliation, selective ciliary cargo depletion and Golgi cargo accumulation. Multiple clones and re-expression support specificity, but the authors could not confirm endogenous protein absence with available antibodies. Gross F-actin organization and several other cellular structures were preserved, so the fibroblast results should not be equated with the cochlear actin phenotype.
  modeled_mechanisms:
  - target: Reduced Primary Cilium Formation
    relationship: MEASURES
    fidelity: LOW
    description: CRISPR disruption of Elmod3 in immortalized mouse embryonic fibroblasts reduces the fraction of ciliated cells after serum starvation. Normal CEP164 recruitment and CP110 removal place the observed defect after early ciliogenesis licensing. This is a candidate ELMOD3 function relevant to developing hair-cell kinocilia, not a demonstrated DFNB88 cochlear lesion.
    limitations: Fibroblasts with predicted-null alleles, not hair cells carrying p.Leu265Ser. The relation of these findings to human hearing loss is provisional.
    evidence:
    - reference: PMID:34818063
      reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found that ciliation was strongly decreased in Elmod1 and Elmod3 single KO MEFs, with <10% of cells on average having a cilium after 24 hr of serum starvation, compared with >60% in WT controls
      explanation: A direct cell-model ciliation measurement; neither human DFNB88 nor cochlear cilia were measured.
  - target: Altered Ciliary Cargo Localization
    relationship: MEASURES
    fidelity: LOW
    description: Elmod3-deficient fibroblasts show depletion of ARL13B, ARL3 and INPP5E from remaining cilia. IFT88, IFT140 and GLI3 localization is preserved, indicating selective cargo effects rather than a universal transport failure. These results have not been reproduced in DFNB88 patient cells or cochlear hair cells.
    limitations: Fibroblasts with predicted-null alleles, not hair cells carrying p.Leu265Ser. The relation of these findings to human hearing loss is provisional.
    evidence:
    - reference: PMID:34818063
      reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'We also discovered changes in the ciliary content of at least three proteins in cells lacking ELMOD1 and/or ELMOD3: ARL13B, ARL3, and INPP5E.'
      explanation: Selective loss of ciliary cargo is a direct cell-model observation, not evidence of a human multisystem ciliopathy.
  - target: Golgi Accumulation of Ciliary Cargo
    relationship: MEASURES
    fidelity: LOW
    description: INPP5E and IFT140 accumulate at the Golgi in Elmod3-deficient fibroblasts. INPP5E accumulation is more prominent after 24 than 72 hours of serum starvation, and its detection depends on fixation conditions. Delayed export is proposed; ciliary IFT140 localization remains preserved despite its increased Golgi pool.
    limitations: Fibroblasts with predicted-null alleles, not hair cells carrying p.Leu265Ser. The relation of these findings to human hearing loss is provisional.
    evidence:
    - reference: PMID:34818063
      reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In contrast, the presence of INPP5E at the Golgi is evident in well over half of all Elmod1, Elmod3, and DKO cell lines after 24 h of serum starvation
      explanation: Direct Golgi localization result in serum-starved fibroblasts. The effect waned at later times.
  - target: Reduced Primary Cilium Formation
    relationship: RESCUES
    fidelity: LOW
    description: Fast-cycling ARL3 or ARL16 restores ciliation toward wild-type levels; ARF1 and ARF5 constructs do not.
    limitations: Overexpression rescue in fibroblasts does not demonstrate direct substrate specificity, rescue of hearing, or clinical efficacy.
    evidence:
    - reference: PMID:34818063
      reference_title: The ARF GAPs ELMOD1 and ELMOD3 act at the Golgi and cilia to regulate ciliogenesis and ciliary protein traffic.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Expression of either activated ARL3-myc or ARL16-myc restored ciliation percentages near WT levels
      explanation: Fast-cycling ARL3 or ARL16 bypasses the ciliation defect in transfected fibroblasts; this does not identify a direct GAP substrate or establish therapy.
  notes: The published correction (PMID:35612986; PMC9561853) replaces duplicated double-knockout images in Figure 4E for the serum-containing condition; text, legend and conclusions were unchanged. The cell-model findings remain separate from the cochlear disease mechanism.

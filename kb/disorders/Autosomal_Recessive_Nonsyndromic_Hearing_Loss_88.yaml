inheritance:
- name: Autosomal recessive
  description: The defining consanguineous family segregates homozygous c.794T>C (p.Leu265Ser) with hearing loss; heterozygous relatives were reported to hear normally. Linkage used a fully penetrant recessive model and a disease-allele frequency of 0.001, yielding a maximum LOD score of 4.74. Those model inputs are not population allele-frequency or penetrance estimates. A separate homozygous deletion involving ELMOD3, CAPG and SH2D6 supports biallelic gene involvement in hearing loss but is not an isolated DFNB88 family.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing coupled with homozygosity mapping was used to identify a transition mutation (c.794T>C; p.Leu265Ser) in ELMOD3 at the DFNB88 locus that is associated with nonsyndromic deafness in a large Pakistani family, PKDF468.
    explanation: The gene, the allele, the locus and the recessive study design in one sentence.
  - reference: PMID:24039609
    reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: haplotype analysis revealed a 0.91 Mb linkage interval that was delimited by the markers D2S1387 and D2S2232
    explanation: The homozygous interval on 2p11.2 that defines DFNB88, from the genome-wide linkage scan.
  - reference: PMID:30284680
    reference_title: Homozygous 2p11.2 deletion supports the implication of ELMOD3 in hearing loss and reveals the potential association of CAPG with ASD/ID etiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: we identified a rare homozygous deletion in 2p11.2 region that affects ELMOD3, CAPG, and SH2D6 genes in a boy with ASD, intellectual disability (ID), and hearing impairment (HI)
    explanation: A second, independent biallelic ELMOD3 loss with hearing impairment. Graded INDIRECT because the deletion removes two further genes, so it supports the recessive model for the gene without being a DFNB88 observation.
pathophysiology:
- name: ELMOD3 Biallelic Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: Homozygous c.794T>C (p.Leu265Ser; NM_032213.4 in the original report) affects a conserved residue in the ELMO domain and segregates with hearing loss in PKDF468. The substitution is predicted in all ELMO-domain-containing isoforms described in that study. Recombinant mutant protein had expression and purification yields similar to wild type; this does not establish its abundance in patient hair cells. Leukocyte cDNA assays found no aberrant splicing in the tested exon intervals.

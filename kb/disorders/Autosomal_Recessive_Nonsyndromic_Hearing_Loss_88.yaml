name: Autosomal Recessive Nonsyndromic Hearing Loss 88
category: Mendelian
creation_date: "2026-09-17T00:00:00Z"
synonyms:
- DFNB88
- deafness, autosomal recessive 88
- autosomal recessive deafness 88
- autosomal recessive nonsyndromic deafness caused by mutation in ELMOD3
- ELMOD3 autosomal recessive nonsyndromic deafness
description: >-
  DFNB88 is prelingual, severe-to-profound, bilateral hearing loss caused by biallelic
  variants in ELMOD3. It is defined by a single large consanguineous Pakistani family,
  PKDF468, in which a homozygous missense change in the ELMO domain segregates with
  deafness.

  Two things make this entity worth curating separately from the other stereocilia genes
  around it. The first is the biochemistry. ELMOD3 had no known enzymatic activity when the
  family was solved; the same paper that mapped the locus showed that recombinant ELMOD3 is
  a GTPase-activating protein for the ARF-family GTPase ARL2, and that the disease allele
  abolishes that activity. So the lesion is a specific, measured loss of an enzymatic activity
  rather than an inferred loss of a structural protein, and it was assayed on the patient's
  own allele rather than on a null.

  The second is where in the bundle it acts. ELMOD3 immunoreactivity in rodent cochlea sits
  in the stereocilia, kinocilia and cuticular plate of hair cells, and is stronger in inner
  than outer hair cells; in the vestibular end organs the protein is in the hair cell bodies
  but not in the hair bundles. That asymmetry is the structural correlate of a clinical
  observation the family makes independently - the affected individuals are deaf and their
  balance is normal.

  The mechanism downstream of the GAP defect comes almost entirely from a constitutive mouse
  knockout, and it is an actin-cytoskeleton story: F-actin staining across the cochlea is
  reduced, inner hair cell stereocilia shorten and fuse, outer hair cell stereocilia
  progressively degenerate, distortion-product otoacoustic emission thresholds rise, and ARL2
  protein itself is less abundant in the mutant cochlea.

  Two disagreements are recorded rather than smoothed over. The mouse hears normally for two
  months and then deteriorates; the humans in family PKDF468 are deaf before they speak. And
  the human audiograms are of *mixed* loss, with a large conductive component in both ears of
  one individual, which no part of the hair-bundle mechanism explains - and which temporal-bone
  CT in two affected members does not explain either, since the middle ear and mastoid were
  well aerated bilaterally. Both are curated as open discussions.

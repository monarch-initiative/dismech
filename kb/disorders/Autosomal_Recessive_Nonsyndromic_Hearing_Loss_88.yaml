    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A multigene hearing loss panel ... can often identify the cause of genetic hearing loss while limiting identification of pathogenic variants and variants of ... uncertain significance ... in genes that are irrelevant to the underlying
    explanation: General genetic hearing-loss diagnostic guidance, applied to an ELMOD3 differential.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/

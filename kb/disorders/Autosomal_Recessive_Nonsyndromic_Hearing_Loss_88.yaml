    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Prelingual Mixed Hearing Impairment
    causal_link_type: DIRECT
    description: >-
      The sensorineural component of the audiogram. The conductive component is not explained
      by this node and is curated as an open question.
    evidence:
    - reference: PMID:24039609
      reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees of mixed hearing loss."
      explanation: The clinical outcome of the mechanism in the defining family.
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    description: >-
      The bone-conduction component of the loss in the affected individuals, and the whole of
      the phenotype in the knockout mouse.
    evidence:
    - reference: PMID:24039609
      reference_title: "An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with hearing impairment in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pure-tone bone and air-conduction audiometry revealed severe-to-profound mixed (conductive and sensorineural) hearing loss in the affected individuals of family PKDF468"
      explanation: >-
        Bone-conduction thresholds are elevated, which is what makes part of this loss
        sensorineural rather than purely conductive.
  evidence:
  - reference: PMID:31628468
    reference_title: "Elmod3 knockout leads to progressive hearing loss and abnormalities in cochlear hair cell stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our finding associates Elmod3 deficiencies with stereocilia dysmorphologies and reveals that they might play roles in the actin cytoskeleton dynamics in cochlear hair cells, and thus relate to hearing impairment."
    explanation: >-
      The knockout paper's own statement of the link between the bundle lesion and hearing.
      INDIRECT because it is a mouse and the authors hedge the mechanistic claim.
  notes: >-
    Conformance is declared at this node only. The module's "Hair Cell Mechanotransduction

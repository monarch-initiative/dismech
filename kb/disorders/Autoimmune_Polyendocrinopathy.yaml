  action_category: THERAPEUTIC
  description: >-
    Replace hormones according to each confirmed gland failure, including
    glucocorticoid/mineralocorticoid, thyroid hormone, insulin, calcium/active
    vitamin D or parathyroid hormone strategies, and sex-steroid replacement as
    appropriate. Replacement treats the endocrine consequence; it does not
    restore immune tolerance or prevent every future component.
  treatment_term:
    preferred_term: hormone modifying therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
  target_phenotypes:
  - preferred_term: Adrenal Insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  - preferred_term: Hashimoto Thyroiditis
    term:
      id: HP:0000872
      label: Hashimoto thyroiditis
  - preferred_term: Type 1 Diabetes Mellitus
    term:
      id: HP:0100651

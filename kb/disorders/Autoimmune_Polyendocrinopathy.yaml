    term:
      id: CL:0000145
      label: professional antigen presenting cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
    modifier: ABNORMAL
  - preferred_term: peripheral T cell tolerance induction
    term:
      id: GO:0002458
      label: peripheral T cell tolerance induction
    modifier: DECREASED
  evidence:
  - reference: PMID:23159534
    reference_title: Polyglandular autoimmune syndrome type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For PAS II, susceptibility genes are known which increase the risk for
      developing autoimmune disorders, but must not be causative. These are
      certain HLA genes, the cytotoxic T-lymphocyte antigen (CTLA-4) gene, and
      the protein tyrosine phosphatase non-receptor type 22 (PTPN22) genes
    explanation: This identifies the loci while explicitly limiting them to non-causative susceptibility.
  - reference: PMID:23159534
    reference_title: Polyglandular autoimmune syndrome type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic susceptibility is necessary but not sufficient to produce the
      disorder. This is illustrated by the lack of 100% concordance of disease
      in identical twins.
    explanation: This supports a multifactorial rather than deterministic genetic model.
  downstream:
  - target: Organ-Specific Autoreactive T-Cell Effector Injury
    causal_link_type: UNKNOWN
    description: >-
      Susceptibility loci lower the threshold for organ-specific cellular
      autoimmunity, but the intervening sequence and effect sizes vary by
      component disease.
    evidence:
    - reference: PMID:23159534
      reference_title: Polyglandular autoimmune syndrome type II.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The nature of PAS has been based on the presence of lymphocyte
        infiltration in the affected gland, organ-specific antibodies in the
        serum, cellular immune defects and an association with the human
        leucocyte antigen (HLA) DR/DQ genes or immune response genes.
      explanation: This associates HLA/immune-response genes with glandular lymphocyte infiltration but does not resolve a uniform causal chain.
- name: Organ-Specific Autoreactive T-Cell Effector Injury
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Autoreactive CD4 and CD8 T cells recognize tissue-restricted endocrine
    antigens and mediate lymphocytic gland injury. Direct human epitope evidence
    is strongest for 21-hydroxylase-reactive CD8 T cells in autoimmune adrenal
    insufficiency. Across the broader umbrella, autoantibodies track the same
    organ-specific loss of tolerance but should not be modeled generically as
    the destructive effector.
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000794
      label: CD8-positive, alpha-beta cytotoxic T cell
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:20685079
    reference_title: "21-Hydroxylase epitopes are targeted by CD8 T cells in autoimmune Addison's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it is presumed that autoreactive T cells, rather than antibodies,
      are the main effectors of adrenal gland destruction
    explanation: This directly corrects a generic autoantibody-mediated tissue-destruction model.
  - reference: PMID:20685079
    reference_title: "21-Hydroxylase epitopes are targeted by CD8 T cells in autoimmune Addison's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blocking experiments identified IFNγ-producing cells as CD8 T lymphocytes,
      with two peptides frequently recognized in HLA-B8+ patients and a third
      one targeted in HLA-B35+ subjects.
    explanation: Human epitope mapping identifies adrenal-antigen-reactive CD8 T cells.
  downstream:
  - target: Adrenal Insufficiency
    causal_link_type: DIRECT
    description: CD8 T-cell recognition of adrenal 21-hydroxylase accompanies autoimmune adrenal-cortex destruction.
    evidence:
    - reference: PMID:20685079
      reference_title: "21-Hydroxylase epitopes are targeted by CD8 T cells in autoimmune Addison's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        circulating EPLARLEL-specific CD8 T cells were detected at significant
        frequencies in HLA-B8+ patients but not in controls by HLA tetramer staining.
      explanation: Disease-specific circulating CD8 T cells recognize a 21-hydroxylase epitope in affected patients.
  - target: Hashimoto Thyroiditis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Thyroid-directed cellular autoimmunity can produce autoimmune thyroiditis in APS.
    evidence:
    - reference: PMID:35690244
      reference_title: "Autoimmune polyendocrine syndrome type 1: Clinical manifestations, pathogenetic features, and management approach."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        APS-1 is often accompanied by hypogonadism, type 1 diabetes, autoimmune
        thyroiditis, vitiligo, alopecia, asplenia, pneumonitis, gastritis,
        pernicious anemia, and intestinal dysfunction, nephritis, and hepatitis.
      explanation: The review supports thyroiditis as an APS manifestation; the exact effector sequence is not resolved for every subtype.
  - target: Type 1 Diabetes Mellitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Islet-directed cellular autoimmunity can eliminate insulin-producing beta-cell function.
    evidence:
    - reference: PMID:33958142
      reference_title: Autoinmune polyendocrinopathy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL

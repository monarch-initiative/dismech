biochemical:
- name: Organ-specific endocrine autoantibodies
  presence: PRESENT
  notes: >-
    Antibodies such as adrenal cortex/21-hydroxylase, thyroid, or islet
    autoantibodies can confirm an autoimmune context and identify risk for a
    future component disease. Their presence is not equivalent to established
    gland failure, and they are modeled as biomarkers rather than generic agents
    of tissue destruction.
  readouts:
  - target: Organ-Specific Autoreactive T-Cell Effector Injury
    relationship: CORRELATES_WITH
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Organ-specific autoantibodies support loss of tolerance to the corresponding
      tissue, but the antibody signal does not by itself establish functional failure.
    evidence:
    - reference: PMID:23159534
      reference_title: Polyglandular autoimmune syndrome type II.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Autoantibodies to the various endocrine and non-endocrine tissues not
        only offer a diagnostic clue to the autoimmune nature of diseases
      explanation: This directly supports their diagnostic biomarker role.
  - target: Organ-Specific Autoreactive T-Cell Effector Injury
    relationship: PREDICTS
    direction: PRESENT_ABSENT
    endpoint_context: PROGNOSTIC
    interpretation: >-
      In an at-risk patient, a component-specific autoantibody may precede
      clinical endocrine failure, with predictive value depending on antigen,
      age, titer, and functional testing.
    evidence:
    - reference: PMID:12050123
      reference_title: "Autoimmune adrenal insufficiency and autoimmune polyendocrine syndromes: autoantibodies, autoantigens, and their applicability in diagnosis and disease prediction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the course of natural history of autoimmune AD, the presence of
        adrenal cortex and/or steroid 21-hydroxylase autoantibodies identified
        patients at risk to develop AD.
      explanation: This supports a predictive, not necessarily destructive, role for adrenal autoantibodies.
  evidence:
  - reference: PMID:20685079
    reference_title: "21-Hydroxylase epitopes are targeted by CD8 T cells in autoimmune Addison's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In autoimmune adrenal deficiency, autoantibodies target the 21-hydroxylase
      (21OH) protein. However, it is presumed that autoreactive T cells, rather
      than antibodies, are the main effectors of adrenal gland destruction
    explanation: This is the evidence boundary underlying biomarker rather than generic effector modeling.
- name: APS-1 neutralizing Th17-cytokine autoantibodies
  presence: PRESENT
  notes: >-
    Anti-IL-17A, anti-IL-17F, and anti-IL-22 antibodies are APS-1-associated
    biomarkers with a mechanistically distinct relationship to impaired
    antifungal defense. They should not be generalized to adult types 2-4.
  readouts:
  - target: Neutralizing Th17-Cytokine Autoantibodies and Mucosal Antifungal Failure
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Neutralizing anti-IL-17F/IL-22 activity reports the APS-1 mucosal
      antifungal-failure mechanism, especially in a patient with CMC.
    evidence:
    - reference: PMID:20123959
      reference_title: Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The autoantibodies preceded the CMC in all informative cases.
      explanation: Temporal precedence supports a mechanistic biomarker interpretation.
  evidence:
  - reference: PMID:20123959
    reference_title: Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our multicenter survey revealed neutralizing autoantibodies against IL-17A
      (41%), IL-17F (75%), and/ or IL-22 (91%) in >150 APECED patients,
      especially those with CMC.
    explanation: This supports the APS-1 anti-cytokine biomarker profile.
diagnosis:
- name: Clinical assessment of component diseases
  description: >-
    Establish the component endocrine diagnoses and determine whether at least
    two failures are autoimmune. Clinical pattern, age at onset, candidiasis,
    non-endocrine autoimmunity, treatment exposures, and family history guide
    classification; a traditional APS label is not a substitute for confirming
    each gland's functional state.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Two autoimmune-induced endocrine failures support the umbrella diagnosis;
    the component pattern and genetic context determine the subtype assignment.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune polyglandular diseases (APD) are defined as the presence of two
      autoimmune -induced endocrine failures.
    explanation: This supplies the operational syndrome-level threshold.
- name: Longitudinal endocrine functional testing
  description: >-
    Measure hormone, electrolyte, glucose, and related gland-function markers
    according to the patient's current components and risks. Repeat testing is
    necessary because new endocrine failure can appear after a variable interval.
  diagnosis_term:
    preferred_term: circulating hormone measurement
    term:
      id: NCIT:C74742
      label: Hormone Measurement
  results: >-
    Functional deficiency or stimulation-test failure establishes a component
    endocrinopathy; normal testing at one time point does not end surveillance.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This requires that patients at risk be regularly screened for subclinical
      endocrinopathies prior to clinical manifestation.
    explanation: This supports repeated functional screening before overt disease.
- name: Component-specific autoantibody testing
  description: >-
    Measure organ-specific autoantibodies to support autoimmune attribution and
    risk stratification. Interpret results with symptoms and gland-function tests;
    antibody positivity alone is not equivalent to destructive endocrine failure.
  diagnosis_term:
    preferred_term: antibody titer measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    A positive component-specific autoantibody supports autoimmune disease or
    future risk, with performance dependent on the antigen and clinical context.
  evidence:
  - reference: PMID:33958142
    reference_title: Autoinmune polyendocrinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the determination of autoantibodies can be useful to predict the risk of
      disease manifestation and to confirm the autoimmune disease in some cases.
    explanation: This explicitly supports both predictive and confirmatory use with qualified certainty.
- name: AIRE molecular genetic testing for suspected APS-1
  description: >-
    Sequence AIRE when early onset, candidiasis, hypoparathyroidism, adrenal
    insufficiency, or other features suggest APS-1. If clinical suspicion remains
    high after conventional exon/splice testing, methods capable of detecting
    deep intronic or structural variants may be required.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Biallelic pathogenic AIRE variants confirm APS-1; a negative conventional
    panel does not exclude deep intronic disease.
  evidence:
  - reference: PMID:35690244
    reference_title: "Autoimmune polyendocrine syndrome type 1: Clinical manifestations, pathogenetic features, and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Analysis of the AIRE gene is the main diagnostic method for early detection of APS-1
    explanation: This supports AIRE analysis in the APS-1 diagnostic pathway.
  - reference: PMID:39292801
    reference_title: A deep intronic splice-altering AIRE variant causes APECED syndrome through antisense oligonucleotide-targetable pseudoexon inclusion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified 17 patients (16%) from 14 kindreds lacking biallelic AIRE
      variants in exons or flanking intronic regions
    explanation: This demonstrates the limitation of conventional exon and flanking-intron testing in a clinically diagnosed cohort.
differential_diagnoses:
- name: IPEX syndrome
  description: >-
    IPEX can present in infancy with systemic autoimmunity, enteropathy, eczema,
    and endocrine disease, especially type 1 diabetes. Male sex, severe early
    enteropathy/dermatitis, regulatory-T-cell abnormalities, and a hemizygous
    FOXP3 variant distinguish it from traditional APS-1 or adult APS.
  disease_term:
    preferred_term: immune dysregulation-polyendocrinopathy-enteropathy-X-linked syndrome
    term:
      id: MONDO:0010580
      label: immune dysregulation-polyendocrinopathy-enteropathy-X-linked syndrome
  distinguishing_features:
  - Usually begins in the first year of life in an affected male.
  - Enteropathy and eczematous dermatitis accompany endocrinopathy.
  - A hemizygous pathogenic FOXP3 variant establishes the X-linked diagnosis.
  evidence:
  - reference: PMID:20301297
    reference_title: IPEX Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IPEX (immune dysregulation, polyendocrinopathy, enteropathy, X-linked)
      syndrome is characterized by systemic autoimmunity, typically beginning in
      the first year of life, which includes the triad of enteropathy
      (manifesting as malabsorption and watery diarrhea), endocrinopathy (most
      commonly type 1 insulin-dependent diabetes mellitus), and eczematous dermatitis.
    explanation: This defines the early clinical pattern that distinguishes IPEX.
- name: Multiple endocrine neoplasia type 2
  description: >-
    MEN2 produces multiple endocrine abnormalities through neoplasia rather than
    multiglandular autoimmunity. Medullary thyroid carcinoma and pheochromocytoma,
    autosomal dominant inheritance, and a pathogenic RET variant favor MEN2.
  disease_term:
    preferred_term: multiple endocrine neoplasia type 2
    term:
      id: MONDO:0019003
      label: multiple endocrine neoplasia type 2
  distinguishing_features:
  - Endocrine tumors rather than autoimmune gland failure dominate.
  - Medullary thyroid carcinoma with pheochromocytoma is characteristic.
  - Pathogenic RET variants confer autosomal dominant disease.
  evidence:
  - reference: PMID:11786689
    reference_title: Multiple endocrine neoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN2 is characterized by medullary thyroid carcinoma (MTC) in association with phaeochromocytoma.
    explanation: This states the neoplastic combination separating MEN2 from autoimmune polyendocrinopathy.
- name: Immune checkpoint inhibitor-induced APS-2-like endocrinopathy
  description: >-
    Cancer immunotherapy can produce two or more immune-related endocrine
    failures that resemble APS-2. The temporal relationship to checkpoint
    inhibition and its acquired adverse-event context distinguish this from
    spontaneous familial or polygenic APS, while the same emergencies still
    require prompt recognition.
  distinguishing_features:
  - Begins during or after CTLA-4, PD-1, or PD-L1 checkpoint-inhibitor exposure.
  - Is an acquired immune-related adverse event rather than an inherited syndrome.
  - Diabetic ketoacidosis or adrenal crisis may be the presenting emergency.
  evidence:
  - reference: PMID:32905579
    reference_title: "ICPis-Induced Autoimmune Polyendocrine Syndrome Type 2: A Review of the Literature and a Protocol for Optimal Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we provide an overview of all published and reported cases (n = 30) of ICPis-induced APS-2.
    explanation: This establishes a documented acquired APS-2-like treatment complication.
- name: Isolated autoimmune endocrinopathy
  description: >-
    A single autoimmune endocrine disease does not yet meet the umbrella
    definition. It may remain isolated or represent an incomplete stage before a
    second component appears, so longitudinal surveillance is more appropriate
    than premature syndrome assignment.
  distinguishing_features:
  - Only one autoimmune-induced endocrine failure is currently established.
  - A second gland must be confirmed before the umbrella definition is met.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune polyglandular diseases (APD) are defined as the presence of two
      autoimmune -induced endocrine failures.
    explanation: The two-failure definition distinguishes isolated disease from the umbrella syndrome.
treatments:

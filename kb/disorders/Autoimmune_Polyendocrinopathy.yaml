name: Autoimmune Polyendocrinopathy
creation_date: "2026-05-12T18:00:00Z"
category: Autoimmune
synonyms:
- Autoimmune polyendocrine syndrome
- APS
- Polyglandular autoimmune syndrome
- Autoimmune polyglandular disease
description: >-
  Autoimmune polyendocrinopathy is an umbrella for syndromes in which at least
  two endocrine glands develop autoimmune failure, often with non-endocrine
  autoimmunity. This entry retains the traditional MONDO-linked types 1-4 while
  making their unequal biology explicit: type 1 (APS-1/APECED) is a monogenic
  AIRE-deficiency disorder, whereas adult types 2-4 are clinical combinations
  with polygenic immune susceptibility. Organ-specific autoantibodies are
  clinically useful diagnostic and predictive markers, but autoreactive T cells
  rather than the antibodies are considered the principal tissue-damaging
  effectors in well-studied endocrine components. Detailed APS-1 phenotyping is
  curated separately in Autoimmune_Polyendocrine_Syndrome_Type_1.yaml; this file
  emphasizes shared mechanisms, classification boundaries, surveillance, and
  cross-subtype evidence.
disease_term:
  preferred_term: autoimmune polyendocrinopathy
  term:
    id: MONDO:0017278
    label: autoimmune polyendocrinopathy
parents:
- Autoimmune disorder of endocrine system
- Polyendocrinopathy
definitions:
- name: Clinical umbrella definition
  definition_type: CASE_DEFINITION
  description: >-
    Autoimmune polyglandular disease is defined clinically by two
    autoimmune-induced endocrine failures. Individual type definitions then
    depend on the component diseases and, for APS-1, the monogenic context.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune polyglandular diseases (APD) are defined as the presence of two
      autoimmune -induced endocrine failures.
    explanation: This review states the disease-level clinical definition used for the umbrella entry.
has_subtypes:
- name: Type 1
  display_name: Type 1 (APS-1/APECED)
  description: >-
    Monogenic, usually childhood-onset autoimmune polyendocrinopathy caused by
    biallelic AIRE deficiency. Chronic mucocutaneous candidiasis,
    hypoparathyroidism, and adrenal insufficiency form the classic triad. A
    separate disease entry contains the detailed APECED phenotype and management
    model; here APS-1 is retained to connect it to the broader umbrella.
  subtype_term:
    preferred_term: autoimmune polyendocrine syndrome type 1
    term:
      id: MONDO:0009411
      label: autoimmune polyendocrine syndrome type 1
  evidence:
  - reference: PMID:33958142
    reference_title: Autoinmune polyendocrinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      APS type 1 presents with hypoparathyroidism, mucocutaneous candidiasis and
      Addison's disease. It is caused by AutoImmune Regulator (AIRE) gene mutation.
    explanation: The review defines the classic APS-1 component diseases and AIRE basis.
- name: Type 2
  display_name: Type 2 (Schmidt syndrome)
  description: >-
    Adult/polygenic syndrome centered on primary adrenal insufficiency with
    autoimmune thyroid disease and/or type 1 diabetes. HLA and immune-regulatory
    alleles modify risk but are not sufficient causes.
  subtype_term:
    preferred_term: autoimmune polyendocrinopathy type 2
    term:
      id: MONDO:0010012
      label: autoimmune polyendocrinopathy type 2
  evidence:
  - reference: PMID:33958142
    reference_title: Autoinmune polyendocrinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPA type 2 presents with Addison's disease, type 1 diabetes, or autoimmune
      thyroid disease. Multiple genes have been implicated, including those of
      the class II major histocompatibility complex.
    explanation: This supports the component-disease and polygenic framing of type 2.
- name: Type 3
  display_name: Type 3
  description: >-
    Autoimmune thyroid disease with another autoimmune disorder, excluding
    Addison disease and hypoparathyroidism under the traditional classification.
    It is a clinical-combination category rather than a single established
    molecular etiology.
  subtype_term:
    preferred_term: autoimmune polyendocrinopathy type 3
    term:
      id: MONDO:0016422
      label: autoimmune polyendocrinopathy type 3
  evidence:
  - reference: PMID:33958142
    reference_title: Autoinmune polyendocrinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPA type 3 is characterized by autoimmune thyroid disease and other
      autoimmune disease, excluding Addison's disease and hypoparathyroidism, 4
      genes have been implicated and confer susceptibility.
    explanation: This states the traditional inclusion and exclusion boundary for type 3.
- name: Type 4
  display_name: Type 4
  description: >-
    A residual traditional category for combinations of autoimmune endocrine
    disease not assigned to types 1-3. Its boundaries depend on the classification
    system and should not be interpreted as a unified mechanism.
  subtype_term:
    preferred_term: autoimmune polyendocrinopathy type 4
    term:
      id: MONDO:0016423
      label: autoimmune polyendocrinopathy type 4
  evidence:
  - reference: PMID:12050123
    reference_title: "Autoimmune adrenal insufficiency and autoimmune polyendocrine syndromes: autoantibodies, autoantigens, and their applicability in diagnosis and disease prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune AD presented in four forms: as APS type 1 (13% of the patients),
      APS type 2 (41%), APS type 4 (5%), and isolated AD (41%).
    explanation: This clinical series documents use of the type 4 category without implying a distinct molecular cause.
progression:
- phase: First autoimmune endocrinopathy
  notes: >-
    A patient may initially have one clinically evident autoimmune endocrine
    failure and only later satisfy the umbrella definition when another gland is
    affected. The interval is variable and an incomplete presentation should not
    be assumed to be stable.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regarding the time interval between manifestation of first and further
      endocrinopathies, regular and long-term follow-up is warranted.
    explanation: The review explicitly describes temporal separation between the first and subsequent endocrinopathies.
- phase: Long-term accumulation and surveillance
  notes: >-
    Additional endocrine or non-endocrine autoimmune manifestations may emerge
    over prolonged follow-up. Surveillance is therefore longitudinal and tailored
    to subtype, existing component disease, symptoms, and family risk.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This requires that patients at risk be regularly screened for subclinical
      endocrinopathies prior to clinical manifestation.
    explanation: This supports surveillance before another component becomes clinically overt.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden ranges from controlled hormone deficiencies to acute adrenal crisis,
    diabetic ketoacidosis, hypocalcemic emergencies, chronic infection, and
    multiorgan autoimmunity. Lifelong replacement, surveillance, and coordination
    across specialties are common, and psychosocial burden extends to affected
    families. The broad umbrella prevents a single frequency or severity estimate
    from representing every subtype.
  evidence:
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With respect to the significant morbidity and potential mortality of APD,
      the diagnostic objective is to detect APD at an early stage
    explanation: This directly supports clinically important morbidity and potential mortality.
  - reference: PMID:31606344
    reference_title: Autoimmune polyglandular diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Quality of life and psychosocial status are poor in APD patients and involved relatives.
    explanation: This supports patient and family quality-of-life burden.
pathophysiology:
- name: AIRE-Dependent Central Tolerance Failure
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In APS-1, biallelic AIRE deficiency reduces thymic display of
    tissue-restricted self-antigens by medullary thymic epithelial cells. Failed
    negative selection permits self-reactive T cells to leave the thymus and
    seed a lifelong multiorgan autoimmune repertoire. This initiating lesion is
    specific to type 1 and is not generalized to adult polygenic types 2-4.
  genes:
  - preferred_term: AIRE
    term:
      id: hgnc:360
      label: AIRE
  cell_types:
  - preferred_term: medullary thymic epithelial cell
    term:
      id: CL:0002365
      label: medullary thymic epithelial cell
  biological_processes:
  - preferred_term: central T cell tolerance induction
    term:
      id: GO:0002512
      label: central T cell tolerance induction
    modifier: DECREASED
  - preferred_term: negative T cell selection
    term:
      id: GO:0043383
      label: negative T cell selection
    modifier: DECREASED
  evidence:
  - reference: PMID:12376594
    reference_title: Projection of an immunological self shadow within the thymus by the aire protein.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aire-deficient thymic medullary epithelial cells showed a specific
      reduction in ectopic transcription of genes encoding peripheral antigens.
    explanation: This establishes AIRE-dependent peripheral-antigen expression in medullary thymic epithelial cells.
  - reference: PMID:38810185
    reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In APS-1, self-reactive T cells escape thymic negative selection,
      infiltrate organs, and drive autoimmune injury.
    explanation: This connects AIRE deficiency to failed negative selection and organ-infiltrating self-reactive T cells in APS-1.
  downstream:
  - target: Organ-Specific Autoreactive T-Cell Effector Injury
    causal_link_type: DIRECT
    description: Escaped self-reactive T cells infiltrate endocrine and non-endocrine target organs.
    evidence:
    - reference: PMID:38810185
      reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In APS-1, self-reactive T cells escape thymic negative selection,
        infiltrate organs, and drive autoimmune injury.
      explanation: The study states the source-to-effector sequence represented by this edge.
  - target: APS-1 Interferon-γ–JAK-STAT Effector Program
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Escape and organ recruitment of AIRE-dependent self-reactive T cells
    description: >-
      In APS-1, AIRE deficiency permits the T-cell compartment that generates an
      excessive multiorgan interferon-γ response.
    evidence:
    - reference: PMID:38810185
      reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings indicate that APS-1, which is caused by AIRE deficiency, is
        characterized by excessive, multiorgan interferon-γ–mediated responses.
      explanation: This supports an AIRE-deficiency-to-interferon program mediated by the escaped T-cell repertoire.
- name: Polygenic HLA and Immune-Regulatory Susceptibility
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Adult autoimmune polyendocrinopathy, especially type 2, is associated with
    HLA class II and immune-regulatory susceptibility loci including HLA-DRB1,
    CTLA4, and PTPN22. These alleles alter the probability of organ-specific
    autoimmunity but neither define a single pathway nor cause the syndrome by
    themselves; environmental and other genetic factors remain necessary.
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  - preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  - preferred_term: PTPN22
    term:
      id: hgnc:9652
      label: PTPN22
  cell_types:

      id: HP:0000135
      label: Hypogonadism
  evidence:
  - reference: PMID:34790633
    reference_title: Autoimmune Polyendocrinopathy-Candidiasis-Ectodermal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goals of replacement treatment include the prevention of hypocalcemic crises
    explanation: The APS-1 management review supports consequence-directed replacement for hypoparathyroidism.
  - reference: PMID:34790633
    reference_title: Autoimmune Polyendocrinopathy-Candidiasis-Ectodermal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      optimal pubertal development and growth in patients with hypogonadism
    explanation: This supports timely replacement for autoimmune gonadal failure.
- name: Adrenal Stress Dosing and Emergency Preparedness
  action_category: THERAPEUTIC
  description: >-
    Patients with adrenal insufficiency require stress-dose education, access to
    injectable hydrocortisone, and medical-alert identification to reduce risk
    during febrile illness, procedures, vomiting, or other physiologic stress.
  treatment_term:
    preferred_term: adrenal hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_phenotypes:
  - preferred_term: Adrenal Insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  evidence:
  - reference: PMID:34790633
    reference_title: Autoimmune Polyendocrinopathy-Candidiasis-Ectodermal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

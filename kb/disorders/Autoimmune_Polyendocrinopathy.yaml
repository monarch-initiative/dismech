discussions:
- discussion_id: autoimmune_polyendocrinopathy_classification_boundary
  prompt: >-
    Should autoimmune polyendocrinopathy continue to use the traditional types
    1-4 as one classification, or should monogenic immune-dysregulation syndromes
    such as IPEX be integrated as peer APS types?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - has_subtypes#Type 1
  - has_subtypes#Type 2
  - has_subtypes#Type 3
  - has_subtypes#Type 4
  rationale: >-
    The traditional four-type scheme is embedded in MONDO and adult endocrine
    literature, but newer pediatric reviews use a three-group framework of
    APS-1, APS-2, and IPEX. These groupings mix molecular etiologies and clinical
    combinations, so subtype counts are classification-dependent rather than a
    settled natural taxonomy.
  evidence:
  - reference: PMID:36980146
    reference_title: Autoimmune Polyendocrine Syndromes in the Pediatric Age.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three types of APSs are reported, including both monogenic and
      multifactorial, heterogeneous disorders.
    explanation: This recent review explicitly uses a three-type pediatric framework.
  - reference: PMID:33958142
    reference_title: Autoinmune polyendocrinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPA type 3 is characterized by autoimmune thyroid disease and other
      autoimmune disease, excluding Addison's disease and hypoparathyroidism
    explanation: This review documents continued use of the traditional type 3 category.
- discussion_id: organ_autoantibody_biomarker_vs_effector
  prompt: >-
    For each component endocrinopathy, which autoantibodies are predictive or
    diagnostic biomarkers, and which—if any—directly mediate tissue injury rather
    than marking a T-cell-driven response?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - biochemical#Organ-specific endocrine autoantibodies
  - pathophysiology#Organ-Specific Autoreactive T-Cell Effector Injury
  rationale: >-
    Collapsing all autoantibodies into one destructive mechanism overstates
    evidence and obscures the functionally distinct APS-1 anti-cytokine
    antibodies. Antigen-, organ-, and stage-specific longitudinal studies are
    needed to separate prediction from effector causality.
  proposed_experiments:
  - experiment_id: exp_aps_component_antibody_tcell_longitudinal
    name: Prospective paired autoantibody and autoreactive T-cell study
    description: >-
      Enroll antibody-positive patients before gland failure and repeatedly
      measure antibody titer/function, antigen-specific CD4/CD8 repertoires,
      gland-function tests, and clinical conversion. Test whether antibody
      changes add causal or predictive information beyond T-cell responses.
    experiment_type:
      preferred_term: prospective longitudinal immune-phenotyping study
    decision_criterion: >-
      Distinguish biomarkers that only correlate with conversion from antibodies
      whose functional activity independently precedes and predicts tissue injury.
  evidence:
  - reference: PMID:20685079
    reference_title: "21-Hydroxylase epitopes are targeted by CD8 T cells in autoimmune Addison's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it is presumed that autoreactive T cells, rather than antibodies,
      are the main effectors of adrenal gland destruction
    explanation: This supplies the adrenal example motivating the distinction.
  - reference: PMID:23159534
    reference_title: Polyglandular autoimmune syndrome type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoantibodies to the various endocrine and non-endocrine tissues not only
      offer a diagnostic clue to the autoimmune nature of diseases but also can
      be used to identify asymptomatic individuals who are at risk
    explanation: This supports diagnostic and predictive utility without claiming direct injury.
- discussion_id: aps1_interferon_trial_and_cross_subtype_generalizability
  prompt: >-
    Does interferon-γ/JAK-STAT inhibition provide durable, safe, controlled
    benefit across APS-1 manifestations, and does the same effector program apply
    to polygenic adult APS types 2-4?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#APS-1 Interferon-γ–JAK-STAT Effector Program
  - treatments#Ruxolitinib for Severe APS-1 Autoimmune Manifestations
  rationale: >-
    Causal mouse perturbations and a five-patient human pilot are compelling but
    cannot define long-term safety, comparative efficacy, organ-specific response,
    or applicability beyond AIRE deficiency.
  proposed_experiments:
  - experiment_id: exp_controlled_aps1_ifng_jak_trial
    name: Controlled APS-1 interferon-pathway trial with adult APS comparator profiling
    description: >-
      Randomize manifestation-defined APS-1 participants to interferon-γ or JAK
      pathway blockade versus control, with prespecified clinical endpoints,
      infection monitoring, tissue IFN-γ/pSTAT1/CXCL9 pharmacodynamics, and
      long-term follow-up. Profile the same pathway in untreated APS-2/3 cohorts
      without assuming treatment eligibility.
    experiment_type:
      preferred_term: randomized mechanistic clinical trial
    decision_criterion: >-
      Confirm clinically meaningful benefit with an on-target tissue response and
      acceptable safety, then determine whether adult APS shares the baseline
      pathway signature.
  evidence:
  - reference: PMID:38810185
    reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: JAK inhibition with ruxolitinib in five patients showed promising results.
    explanation: The small pilot size and qualified conclusion define the evidence gap.
- discussion_id: aire_mouse_human_phenotype_mismatch
  prompt: >-
    Which APS-1 mechanisms and organ phenotypes are faithfully reproduced by the
    Aire-null mouse, and which human manifestations require rat, organoid, or
    patient-tissue models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#AIRE-Dependent Central Tolerance Failure
  - animal_models#Aire-/- knockout mouse
  rationale: >-
    Aire-null mice establish central-tolerance and interferon-effector biology,
    but the model incompletely reproduces human APECED's organ distribution and
    clinical phenotype. Translational conclusions should therefore be separated
    into conserved mechanism versus model-specific disease expression.
  proposed_experiments:
  - experiment_id: exp_aire_cross_species_multiorgan_atlas
    name: Cross-species AIRE-deficiency multiorgan immune atlas
    description: >-
      Generate matched single-cell and spatial immune profiles from Aire-null
      mouse and rat target organs and available human APS-1 biopsies, with common
      antigen-specific T-cell, interferon, and tissue-injury readouts.
    experiment_type:
      preferred_term: cross-species single-cell and spatial profiling
    decision_criterion: >-
      Identify conserved cell states and causal pathways separately from
      species-specific organ tropism and manifestations.
  evidence:
  - reference: PMID:33729987
    reference_title: AIRE deficiency, from preclinical models to human APECED disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, these murine models poorly recapitulate all phenotypic aspects of human APECED.
    explanation: The review explicitly identifies incomplete human-phenotype fidelity of the mouse models.
- discussion_id: adult_aps_trials_and_public_omics_gap
  prompt: >-
    Can a longitudinal adult APS type 2-4 cohort provide current natural-history,
    trial-readiness, and public multi-omic resources comparable to emerging APS-1 studies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Type 2
  - has_subtypes#Type 3
  - has_subtypes#Type 4
  - datasets#geo:GSE225460
  - datasets#geo:GSE243061
  rationale: >-
    Exact registry and GEO audits on 2026-07-21 found active interventional work
    concentrated on APS-1 manifestations and the selected public transcriptomic
    datasets concentrated on APS-1. The one selected APS-2 registry is
    observational and had stale status verification. This limits cross-subtype
    mechanism comparison and adult trial design.
  proposed_experiments:
  - experiment_id: exp_adult_aps_longitudinal_multiomic_cohort
    name: Longitudinal adult APS type 2-4 natural-history and multi-omic cohort
    description: >-
      Recruit well-phenotyped type 2-4 participants and at-risk relatives across
      centers; collect serial gland-function, autoantibody, antigen-specific
      T-cell, genotype, transcriptome, and outcome data under a public
      controlled-access data plan.
    experiment_type:
      preferred_term: longitudinal multi-omic natural-history study
    decision_criterion: >-
      Define reproducible molecular endotypes and prospective conversion markers
      that can support adult APS prevention or mechanism-directed trials.
  evidence:
  - reference: clinicaltrials:NCT05578105
    reference_title: Prevalence and Genetic Alternation of Autoimmune Polyglandular Syndrome Type II in Taiwan
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we will observe the epidemiology, clinical characteristics,
      and genetic variants of APS II in Taiwan.
    explanation: This is observational rather than an adult APS intervention trial.
  - reference: PMID:38632993
    reference_title: Single cell characterization of blood and expanded regulatory T cells in autoimmune polyendocrine syndrome type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have used single cell transcriptomics to characterize regulatory T
      cells (Tregs) sorted directly from blood and from in vitro expanded Tregs
      in APS-1 patients compared to healthy controls.
    explanation: The selected public single-cell resource is specifically APS-1, illustrating the subtype imbalance.

review_notes: >-
  Re-review preserved the legacy updated_date and treated MONDO:0017278 as an
  umbrella rather than duplicating the separate APS-1/APECED entry. It retained
  four MONDO-linked traditional subtypes while recording the competing
  three-group pediatric classification. The central mechanistic correction was
  to model organ-specific autoantibodies chiefly as diagnostic/predictive
  biomarkers and autoreactive T cells as tissue-damaging effectors; neutralizing
  APS-1 Th17-cytokine antibodies remain a distinct functional mechanism. Trial
  and GEO searches were audited on 2026-07-21: selected active intervention
  trials were APS-1 manifestation-specific, the selected APS-2 study was
  observational with stale status verification, and public mechanistic
  transcriptomic datasets were APS-1-heavy. Ruxolitinib is therefore explicitly
  investigational, based on a five-patient pilot and ongoing phase 2 work. No
  umbrella-wide phenotype frequencies, deterministic adult-APS genetic claims,
  or syndrome-wide disease-modifying treatment claims are made.

- name: APS-1 Interferon-γ–JAK-STAT Effector Program
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    APS-1 tissues show excessive T-cell-derived interferon-γ with downstream
    STAT1 phosphorylation and CXCL9 expression. Genetic loss of Ifng or JAK1/2
    blockade in Aire-deficient mice prevented infiltration and tissue damage,
    and five patients improved during ruxolitinib treatment. This is a strong
    emerging APS-1 mechanism, not yet a syndrome-wide mechanism for types 2-4
    or proof of established long-term clinical efficacy.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000794
      label: CD8-positive, alpha-beta cytotoxic T cell
  biological_processes:
  - preferred_term: type II interferon-mediated signaling pathway
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:38810185
    reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with APS-1 had enhanced interferon-γ responses in blood and in all
      examined autoimmunity-affected tissues.
    explanation: This demonstrates a multiorgan interferon-γ signature in people with APS-1.
  - reference: PMID:38810185
    reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ifng ablation or ruxolitinib-induced JAK-STAT blockade in Aire-/- mice
      normalized interferon-γ responses and averted T-cell infiltration and
      damage in organs.
    explanation: Genetic and pharmacologic perturbations establish interferon signaling as causal in the Aire-deficient mouse.
  downstream:
  - target: Organ-Specific Autoreactive T-Cell Effector Injury
    causal_link_type: DIRECT
    description: Excessive interferon-γ–JAK-STAT signaling sustains organ infiltration and tissue injury in APS-1 models.
    evidence:
    - reference: PMID:38810185
      reference_title: The Role of Interferon-γ in Autoimmune Polyendocrine Syndrome Type 1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ifng ablation or ruxolitinib-induced JAK-STAT blockade in Aire-/- mice
        normalized interferon-γ responses and averted T-cell infiltration and
        damage in organs.
      explanation: Dual perturbation supports the interferon-program-to-tissue-injury edge in the model.
- name: Neutralizing Th17-Cytokine Autoantibodies and Mucosal Antifungal Failure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In APS-1, neutralizing autoantibodies against IL-17A, IL-17F, and IL-22 can
    reduce Th17-associated mucosal antifungal defense. Unlike organ-specific
    endocrine autoantibodies, these anti-cytokine antibodies have a plausible
    functional role in chronic mucocutaneous candidiasis and are kept as a
    subtype-specific causal mechanism.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  evidence:
  - reference: PMID:20123959
    reference_title: Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our multicenter survey revealed neutralizing autoantibodies against IL-17A
      (41%), IL-17F (75%), and/ or IL-22 (91%) in >150 APECED patients,
      especially those with CMC.
    explanation: This large multicenter series identifies neutralizing Th17-cytokine autoantibodies in APS-1, enriched with CMC.
  downstream:
  - target: Chronic Mucocutaneous Candidiasis
    causal_link_type: DIRECT
    description: Neutralization of IL-17F and IL-22 compromises mucosal defense against Candida.
    evidence:
    - reference: PMID:20123959
      reference_title: Chronic mucocutaneous candidiasis in APECED or thymoma patients correlates with autoimmunity to Th17-associated cytokines.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We conclude that IL-22 and IL-17F are key natural defenders against CMC
        and that the immunodeficiency underlying CMC in both patient groups has
        an autoimmune basis.
      explanation: This directly supports loss of Th17-cytokine function as the autoimmune basis of CMC.

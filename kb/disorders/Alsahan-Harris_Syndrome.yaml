  - target: Photoreceptor Connecting Cilium Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The TBC1D32 ciliary lesion disrupts retinal differentiation, connecting
      cilium integrity, and outer-segment trafficking in photoreceptors.

genetic:
- name: TBC1D32 (BROMI) Variants
  association: Causative
  gene_term:
    preferred_term: TBC1D32
    term:
      id: hgnc:21485
      label: TBC1D32
  notes: >-
    Biallelic (homozygous or compound heterozygous) variants in TBC1D32 (6q22),
    historically named BROMI or C6orf170, cause Alsahan-Harris syndrome
    (OMIM:621307). TBC1D32/BROMI functions with CCRK/CDK20 and ICK/CILK1 to
    regulate IFT turnaround at the ciliary tip and cilium-dependent Hedgehog
    signaling. Reported loss-of-function alleles include frameshift and
    splice-site variants; RNA analysis of recent splice variants demonstrated
    exon skipping with premature truncation. The human TBC1D32-related
    ciliopathy was first reported in the 2014 OFD-IX series (PMID:24285566),
    confirmed by Alsahan and Alkuraya (PMID:32573025), and expanded by Harris
    et al. (PMID:36826837).
  evidence:
  - reference: PMID:32060556
    reference_title: Loss-of-Function Variants in TBC1D32 Underlie Syndromic Hypopituitarism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic TBC1D32 variants underlie syndromic hypopituitarism
    explanation: >-
      The dedicated loss-of-function series directly establishes the biallelic
      TBC1D32 gene-disease relationship.
  - reference: PMID:36826837
    reference_title: "Diagnosis of TBC1D32-associated conditions: Expanding the phenotypic spectrum of a complex ciliopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe seven unpublished probands with rare likely pathogenic
      variants or variants of uncertain significance that segregate with
      recessive disease in TBC1D32
    explanation: >-
      The largest clinical expansion adds seven probands with TBC1D32 variants
      segregating with recessive disease across the phenotypic spectrum.
  - reference: PMID:35609210
    reference_title: "BROMI/TBC1D32 together with CCRK/CDK20 and FAM149B1/JBTS36 contributes to intraflagellar transport turnaround involving ICK/CILK1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in BROMI, CCRK, and ICK in humans cause ciliopathies
    explanation: >-
      The cell-biology paper summarizes the prior human disease association as
      background; dedicated clinical series provide the primary relationship.
  - reference: PMID:40702307
    reference_title: "Expanding the clinical and molecular spectrum of TBC1D32-related ciliopathy: case reports and literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA analysis revealed exon skipping, leading to frameshift and premature
      protein truncation.
    explanation: >-
      Functional RNA analysis establishes a loss-of-function consequence for
      the newly reported splice-site variants.

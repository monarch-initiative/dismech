differential_diagnoses:
- name: SCLT1-related Orofaciodigital Syndrome Type IX
  description: >-
    SCLT1-related disease can present with the same severe OFD-IX combination of
    midline cleft, microcephaly, ocular malformation, polydactyly, pituitary
    abnormality, and congenital heart disease.
  distinguishing_features:
  - Molecular testing identifies biallelic pathogenic variants in SCLT1 rather than TBC1D32.
  - The overlapping clinical presentation alone does not establish the causal gene.
  evidence:
  - reference: PMID:24285566
    reference_title: Ciliary genes TBC1D32/C6orf170 and SCLT1 are mutated in patients with OFD type IX.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have identified two simplex cases with a severe ciliopathy phenotype
      consistent with oro-facio-digital syndrome type IX featuring midline
      cleft, microcephaly, and colobomatous microphathalmia/anophthalmia. In
      addition, there was variable presence of polydactyly, absent pituitary,
      and congenital heart disease. The autozygome of each index harbored a
      single novel truncating variant as revealed by exome sequencing, and the
      affected genes (SCLT1 and TBC1D32/C6orf170) have established roles in
      centrosomal biology and ciliogenesis.
    explanation: >-
      The discovery paper identifies both genes in phenotypically overlapping
      simplex OFD-IX cases, making SCLT1-related disease the closest molecular
      differential.

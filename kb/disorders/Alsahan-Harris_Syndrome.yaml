discussions:
- discussion_id: tbc1d32_multisystem_mechanism_model_fidelity
  prompt: >-
    Do the knockout-cell, Xenopus, and retinal-organoid mechanisms reproduce the
    tissue-specific consequences of patient TBC1D32 alleles across the complete
    human syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#TBC1D32/BROMI Ciliary Trafficking and IFT Turnaround Defect
  - pathophysiology#Impaired Hedgehog Signal Transduction
  rationale: >-
    IFT-turnaround evidence is dominated by engineered knockout cells and the
    Hedgehog inference partly relies on CCRK-knockout experiments. Patient-derived
    retinal models provide strong tissue-specific support, but no single model
    currently recapitulates the craniofacial, pituitary, retinal, auditory, and
    prenatal manifestations together.
  proposed_experiments:
  - experiment_id: exp_tbc1d32_isogenic_ift_rescue
    name: Isogenic patient-allele IFT-turnaround and rescue study
    description: >-
      Introduce representative patient loss-of-function and splice alleles into
      isogenic human ciliated-cell models and compare IFT turnaround, ciliary-tip
      cargo accumulation, and wild-type rescue.
  - experiment_id: exp_tbc1d32_developmental_hedgehog_response
    name: Patient-allele Hedgehog-response study in developmental cell models
    description: >-
      Test GLI processing and Hedgehog target-gene responses in patient-derived
      hypothalamic-pituitary and craniofacial developmental models.
  - experiment_id: exp_tbc1d32_cross_organoid_allelic_series
    name: Cross-organoid TBC1D32 allelic series
    description: >-
      Compare allele-specific phenotypes across retinal, pituitary, and
      craniofacial organoids.
  evidence:
  - reference: PMID:35609210
    reference_title: BROMI/TBC1D32 together with CCRK/CDK20 and FAM149B1/JBTS36 contributes to intraflagellar transport turnaround involving ICK/CILK1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ciliary defects observed in CCRK-knockout (KO), BROMI-KO, and FAM149B1-KO
      cells, including abnormally long cilia and accumulation of the IFT
      machinery and ICK at the ciliary tip, resembled one another
    explanation: >-
      The key IFT-turnaround evidence uses engineered knockout cells rather than
      the diverse patient alleles.
  - reference: PMID:37768732
    reference_title: TBC1D32 variants disrupt retinal ciliogenesis and cause retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      our results suggested photoreceptor differentiation defects, including
      connecting cilium anomalies, that resulted in impaired trafficking to the
      outer segment in cones and rods
    explanation: >-
      Patient-derived retinal organoids support one organ-specific arm but do
      not establish fidelity for the whole multisystem disorder.
- discussion_id: tbc1d32_emerging_feature_penetrance
  prompt: >-
    Are sensorineural hearing loss and oculomotor nerve palsy recurrent features
    of TBC1D32-related ciliopathy, and what are their penetrance and allelic basis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Hearing loss and oculomotor palsy were proposed from recent individual or
    very small case expansions. The available literature is too sparse to infer
    frequency, causality for every allele, or a shared tissue mechanism.
  proposed_experiments:
  - experiment_id: exp_tbc1d32_registry_audiology_oculomotor
    name: Registry-based audiology and ocular-motility phenotyping
    description: >-
      Perform standardized audiology and ocular-motility phenotyping in an
      international TBC1D32 registry.
  - experiment_id: exp_tbc1d32_emerging_feature_alleles
    name: Functional testing of emerging-feature alleles
    description: >-
      Test segregation and functional splice effects for alleles observed with
      the emerging features.
  evidence:
  - reference: PMID:40319332
    reference_title: Two novel mutations in TBC1D32 add complexity to the oro-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results suggest that SNHL may represent a new clinical feature associated with this gene.
    explanation: The authors explicitly frame sensorineural hearing loss as a proposed new feature.
  - reference: PMID:40702307
    reference_title: "Expanding the clinical and molecular spectrum of TBC1D32-related ciliopathy: case reports and literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we propose oculomotor nerve palsy as an extended clinical feature of this
      disorder.
    explanation: The 2025 case expansion explicitly presents oculomotor palsy as proposed rather than established.
notes: >-
  Gene synonymy: TBC1D32 is also known historically as BROMI and C6orf170;
  these names are used interchangeably across the cited mechanistic literature.
  Disease/nomenclature: the TBC1D32-related oral-facial-digital syndrome has
  been designated OFD-IX (oral-facial-digital syndrome type IX). Eponym
  provenance: the name Alsahan-Harris syndrome derives from the 2020 Alsahan
  and Alkuraya confirmation report (PMID:32573025) and Harris et al.'s 2023
  phenotypic-spectrum expansion (PMID:36826837). The original human association
  was reported earlier in the 2014 TBC1D32/SCLT1 OFD-IX discovery series
  (PMID:24285566). The Alsahan brief report has no PubMed abstract text and is
  therefore cited here only as nomenclature provenance, not as an evidence
  snippet. The literature remains a small set of families and case reports;
  phenotype frequencies, genotype-phenotype correlations, natural history, and
  disease-specific management evidence are not established. This is a
  TBC1D32-specific ciliopathy and must not be conflated with other
  oral-facial-digital syndromes, including OFD I caused by OFD1 and OFD17
  caused by INTU, or with SCLT1-related OFD-IX.

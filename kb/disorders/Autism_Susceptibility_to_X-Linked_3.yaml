    reference_title: "MECP2 Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 disorders are inherited in an X-linked manner. More than 99% are simplex cases"
    explanation: GeneReviews establishes X-linked inheritance and the predominantly de novo (simplex) occurrence of MECP2 pathogenic variants.
pathophysiology:
- name: MECP2 Sequence and Regulatory Variation
  biological_scale: MOLECULAR
  description: >
    The AUTSX3 susceptibility is anchored on variation at the X-linked MECP2
    gene that falls short of the classic Rett-causing loss-of-function
    threshold: rare de novo mutations in autistic females, a non-lethal
    missense change in an autistic male, and an excess of conserved 3'-UTR
    variants that alter transcript stability. These alleles broaden the MECP2
    phenotypic spectrum beyond Rett syndrome and severe neonatal encephalopathy
    toward autism.

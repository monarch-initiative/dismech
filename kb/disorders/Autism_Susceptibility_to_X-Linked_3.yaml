- discussion_id: gap_autsx3_evidence_robustness
  prompt: >-
    Which MECP2 coding or regulatory variants reproducibly increase autism risk,
    with what penetrance and sex-specific effect?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Function-Altering MECP2 Coding or Cis-Regulatory Variation
  - pathophysiology#Reduced or Altered MeCP2 Activity
  rationale: >-
    Historical association studies were small and pre-GWAS. Modern results are
    informative but do not collapse into one claim: the 2025 XWAS did not
    nominate MECP2 as a common-variant locus; the 2026 trio analysis supports a
    female-specific coding de novo burden; the 2025 functional screen shows that
    only some ASD-catalogued missense variants lose function; and the 2026
    cis-regulatory study is a preprint with two functional candidates. Large
    independent cohorts with allele-level segregation, penetrance, and phenotype
    data remain necessary. Reduced MeCP2 expression in a small postmortem autism
    cohort is relevant context but is non-specific across several
    neurodevelopmental disorders and does not establish an AUTSX3 causal node.
    Intellectual disability and absent speech therefore remain deliberately
    disconnected from the pathograph: both derive from one p.Gly206Ala carrier
    whose variant causality was not established.
  evidence:
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "which cause Rett syndrome (RTT), have been found in male and female autistic subjects without, however, a causal relation having unequivocally been established."
    explanation: The historical study explicitly acknowledges uncertain causality.
  - reference: PMID:39706197
    reference_title: Chromosome X-wide common variant association study in autism spectrum disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed 418,652 X chromosome variants, identifying 59 associated with ASD"
    explanation: Large modern common-variant evidence whose nominated genes did not include MECP2.
  - reference: PMID:42032772
    reference_title: Sex-aware genome-wide assessment of de novo variants in autism across coding and noncoding regions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "I analyzed DNVs in > 41,000 parent–child sequenced trios from three ASD family-based cohorts"
    explanation: Establishes the scale of the modern sex-aware coding de novo analysis.
  - reference: PMID:42146591
    reference_title: A massively parallel reporter assay of MECP2 cis-regulatory elements reveals genetic candidates for male-biased autism.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These findings suggest noncoding MECP2 variants can cause non-syndromic, male-biased autism"
    explanation: Emerging direct regulatory evidence, explicitly retained at preprint/partial strength.
  - reference: PMID:17486179
    reference_title: Reduced MeCP2 expression is frequent in autism frontal cortex and correlates with aberrant MECP2 promoter methylation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant reduction in MeCP2 expression compared to age-matched controls was found in 11/14 autism (79%), 9/9 RTT (100%), 4/4 Angelman syndrome (100%), 3/4 Prader-Willi syndrome (75%), 3/5 Down syndrome (60%), and 2/2 attention deficit hyperactivity disorder (100%) frontal cortex samples."
    explanation: The broad cross-disorder finding is relevant to dosage plausibility but is not specific evidence for AUTSX3 or for a variant-mediated causal path.
  posed_by: codex
  posed_date: "2026-08-05T00:00:00Z"
- discussion_id: mismatch_autsx3_mecp2_loss_models
  prompt: >-
    Do conditional or null Mecp2 models of Rett-spectrum loss reproduce the
    molecular and circuit effects of subtle AUTSX3-associated human variants?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Synaptic and GABAergic Neuron Function
  rationale: >-
    The GABAergic conditional knockout establishes consequences of substantial
    cell-type-specific MeCP2 loss, while AUTSX3 proposes heterogeneous, often
    hypomorphic coding or regulatory alleles. The model is biologically relevant
    but may exaggerate dose, use a different cell-type distribution, and model
    Rett-like rather than nonsyndromic autism phenotypes.
  proposed_experiments:
  - experiment_id: exp_autsx3_isogenic_human_neuron_variant_series
    name: Isogenic human-neuron AUTSX3 variant series
    description: >-
      Introduce the candidate coding and cis-regulatory variants individually
      into the same human induced-pluripotent-stem-cell background, quantify
      allele-specific MECP2 expression and protein function, and compare
      excitatory and inhibitory neuron maturation with corrected isogenic lines.
    readouts:
    - name: Allele-specific MECP2 expression
      target: pathophysiology#Reduced or Altered MeCP2 Activity
    - name: Inhibitory synaptic function
      target: pathophysiology#Altered Synaptic and GABAergic Neuron Function
  evidence:
  - reference: PMID:21068835
    reference_title: Dysfunction in GABA signalling mediates autism-like stereotypies and Rett syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking Mecp2 from GABA (γ-aminobutyric acid)-releasing neurons recapitulate numerous Rett syndrome and autistic features"
    explanation: The available circuit evidence comes from a conditional knockout with Rett-spectrum features.
  posed_by: codex
  posed_date: "2026-08-05T00:00:00Z"

    snippet: "MeCP2 selectively binds CpG dinucleotides in the mammalian genome and mediates transcriptional repression through interaction with histone deacetylase and the corepressor SIN3A"
    explanation: Establishes MeCP2's methyl-CpG-dependent transcriptional-repressor function that partial deficits disrupt.
  - reference: PMID:9620804
    reference_title: "Transcriptional repression by the methyl-CpG-binding protein MeCP2 involves a histone deacetylase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that a region of MeCP2 that localizes with the TRD associates with a corepressor complex containing the transcriptional repressor mSin3A and histone deacetylases."
    explanation: Primary biochemical source establishing the MeCP2 transcriptional-repression domain association with the mSin3A/histone-deacetylase corepressor complex.
  - reference: PMID:18511691
    reference_title: "MeCP2, a key contributor to neurological disease, activates and represses transcription."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies suggest that MeCP2 regulates the expression of a wide range of genes in the hypothalamus and that it can function as both an activator and a repressor of transcription."
    explanation: Shows MeCP2 acts as both activator and repressor over many neuronal genes, so a dosage change broadly perturbs neuronal transcription.
- name: Impaired Synaptic Maturation and Neurodevelopment
  biological_scale: TISSUE
  description: >
    Convergent dysregulation of MeCP2-dependent gene expression impairs
    activity-dependent synaptic maturation and, in model systems, the function
    of GABAergic (inhibitory) neurons — perturbing the excitatory/inhibitory
    balance of developing cortical circuits. Mouse studies deleting Mecp2 from
    GABAergic neurons recapitulate autistic and Rett-like features, providing a
    mechanistic link (in animal models) from MeCP2 dosage sensitivity to
    autistic behavior, intellectual disability, and language impairment across
    the MECP2 spectrum.

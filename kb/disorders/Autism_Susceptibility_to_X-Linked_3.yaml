    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Synaptic Maturation and Neurodevelopment
    description: Altered MeCP2-dependent transcription disrupts activity-dependent synapse development and neuronal maturation.
  evidence:
  - reference: PMID:10508514
    reference_title: "Rett syndrome is caused by mutations in X-linked MECP2, encoding methyl-CpG-binding protein 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MeCP2 selectively binds CpG dinucleotides in the mammalian genome and mediates transcriptional repression through interaction with histone deacetylase and the corepressor SIN3A"
    explanation: Establishes MeCP2's methyl-CpG-dependent transcriptional-repressor function that partial deficits disrupt.
  - reference: PMID:18511691
    reference_title: "MeCP2, a key contributor to neurological disease, activates and represses transcription."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies suggest that MeCP2 regulates the expression of a wide range of genes in the hypothalamus and that it can function as both an activator and a repressor of transcription."
    explanation: Shows MeCP2 acts as both activator and repressor over many neuronal genes, so a dosage change broadly perturbs neuronal transcription.
- name: Impaired Synaptic Maturation and Neurodevelopment
  biological_scale: TISSUE
  description: >
    Convergent dysregulation of MeCP2-dependent gene expression impairs
    activity-dependent synaptic maturation and the excitatory/inhibitory
    balance of developing cortical circuits. This is the shared downstream
    mechanism connecting MECP2 dosage sensitivity to autistic behavior,
    intellectual disability, and language impairment across the MECP2 spectrum.
  cell_types:

    reference_title: "Reduced MeCP2 expression is frequent in autism frontal cortex and correlates with aberrant MECP2 promoter methylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that both genetic and epigenetic defects lead to reduced MeCP2 expression and may be important in the complex etiology of autism."
    explanation: Frames reduced MeCP2 as a contributor to the complex, developmentally converging etiology of autism.

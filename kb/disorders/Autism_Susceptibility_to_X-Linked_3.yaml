discussions:
- discussion_id: gap_autsx3_nosologic_status
  prompt: >-
    Does AUTSX3 (OMIM 300496) delineate a discrete clinical entity with its own
    natural history, phenotype spectrum, prevalence, and diagnostic criteria, or
    is it best treated as a legacy nosologic label for the autism-predominant,
    non-lethal end of the continuous MECP2-related disorder spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MECP2 Sequence and Regulatory Variation
  rationale: >-
    MECP2-related phenotypes form a continuum — from classic Rett syndrome and
    severe male neonatal encephalopathy to PPM-X, nonsyndromic intellectual
    disability, and autistic features — rather than crisply separated diseases.
    AUTSX3 was defined historically from case series and association studies of
    MECP2 variants in autistic individuals, and contemporary literature tends to
    subsume such cases under broader "MECP2-related disorders." The gathered
    deep-research evidence did not identify a consistent standalone natural
    history, phenotype spectrum, prevalence, or diagnostic criteria specific to
    AUTSX3. A practical curation consequence is that Rett syndrome prevalence,
    survival, and treatment data must NOT be transferred to AUTSX3.
  evidence:
  - reference: PMID:20301670
    reference_title: "MECP2 Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the spectrum in males ranges from severe neonatal encephalopathy to pyramidal signs, parkinsonism, and macroorchidism (PPM-X) syndrome to severe syndromic/nonsyndromic intellectual disability"
    explanation: GeneReviews documents a continuous male MECP2 phenotypic spectrum, into which AUTSX3-type autism/intellectual-disability presentations fall rather than forming a discrete entity.
  - reference: PMID:17427193
    reference_title: "MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supporting the notion that MECP2 mutations underlie several neurodevelopmental disorders."
    explanation: Frames MECP2 as underlying several overlapping neurodevelopmental phenotypes, consistent with AUTSX3 being a label within a broader spectrum rather than an isolated disease.
  posed_by: claude-code
  posed_date: "2026-07-31T00:00:00Z"
  notes: >-
    Raised from the falcon (Edison) deep-research synthesis, which flagged AUTSX3
    as a sparse/historical label within the wider MECP2-related disorder
    spectrum.
- discussion_id: gap_autsx3_evidence_robustness
  prompt: >-
    How robust is the evidence that MECP2 is an autism-susceptibility locus,
    given that the association rests on small, pre-GWAS candidate-gene studies
    without modern large-cohort replication?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MECP2 Sequence and Regulatory Variation
  rationale: >-
    The MECP2-autism-susceptibility association is carried by underpowered
    candidate-gene studies: Shibayama 2004 (n=24 autism cases; PMID:15211631),
    Loat 2008 (219 families, transmission-disequilibrium P=0.009; PMID:19125863),
    and Coutinho 2007 (a single novel missense variant in 172 patients, framed as
    contributing "although very rarely"; PMID:17427193). The source authors
    themselves hedge, and Carney 2003 (PMID:12770674) reads its MECP2-positive
    autistic females as "variable expression in the Rett disorder phenotype"
    rather than evidence for a distinct susceptibility entity. Crucially, this
    pre-GWAS candidate-gene evidence base has not been corroborated by modern
    large-cohort autism sequencing/GWAS as an independent common-variant
    susceptibility signal at MECP2. The evidence items in this entry are marked
    SUPPORT for the specific factual observations they report (variants exist in
    the cohorts), not for a settled population-level susceptibility claim.
  evidence:
  - reference: PMID:17427193
    reference_title: "MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that MECP2 can play a role in autism etiology, although very rarely, supporting the notion that MECP2 mutations underlie several neurodevelopmental disorders."
    explanation: The authors themselves qualify the MECP2-autism contribution as very rare, underscoring the thin, non-replicated evidence base.
  - reference: PMID:12770674
    reference_title: "Identification of MeCP2 mutations in a series of females with autistic disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These data provide additional evidence of variable expression in the Rett disorder phenotype"
    explanation: Carney interprets its MECP2-positive autistic females as variable Rett expression rather than a distinct autism-susceptibility entity — a counterweight to a strong standalone-susceptibility reading.
  posed_by: claude-code
  posed_date: "2026-07-31T00:00:00Z"
  notes: >-
    Raised in response to pre-PR/PR review flagging that the susceptibility
    claim rests on small pre-GWAS candidate-gene studies without large-cohort
    replication.

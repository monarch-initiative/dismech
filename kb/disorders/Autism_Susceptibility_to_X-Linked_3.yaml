name: Autism, Susceptibility to, X-Linked 3
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Autism, susceptibility to, X-linked 3 (AUTSX3; OMIM 300496) is an X-linked
  autism-susceptibility phenotype attributed to variation at the MECP2 locus
  (Xq28), the same gene whose loss-of-function pathogenic variants cause classic
  Rett syndrome and whose overexpression causes MECP2 duplication syndrome.
  AUTSX3 captures the milder, non-lethal end of the MECP2 phenotypic spectrum:
  rare MECP2 coding mutations identified in autistic males (who escape the
  neonatal-lethal encephalopathy seen with severe loss-of-function alleles) and
  in mildly affected females, conserved 3'-UTR and regulatory variants that
  alter MECP2 transcript dosage, epigenetically reduced MeCP2 expression in
  autism cortex, and common-variant haplotype association with autism
  spectrum disorder. Because neuronal function is exquisitely sensitive to
  MeCP2 dosage, subtle reductions or dysregulation of MeCP2 — short of the
  threshold that produces Rett syndrome — are proposed to increase autism
  susceptibility by perturbing activity-dependent neuronal gene-expression
  programs and synaptic maturation.
category: Complex

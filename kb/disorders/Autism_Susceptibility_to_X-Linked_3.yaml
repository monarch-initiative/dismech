inheritance:
- name: X-linked inheritance
  description: >-
    MECP2 is X-linked (Xq28), and MECP2 disorders are inherited in an X-linked
    manner. In the AUTSX3 susceptibility context, rare coding mutations arise
    largely de novo, while regulatory/3'-UTR variants and common susceptibility
    haplotypes may be maternally transmitted. Males are hemizygous; mildly
    affected carrier females can be minimally symptomatic owing to favorable
    skewing of X-chromosome inactivation.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance

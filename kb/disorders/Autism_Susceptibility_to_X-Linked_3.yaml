inheritance:
- name: X-linked inheritance
  description: >-
    MECP2 is X-linked (Xq28), and MECP2 disorders are inherited in an X-linked
    manner. In the AUTSX3 susceptibility context, rare coding mutations arise
    largely de novo, while regulatory/3'-UTR variants and common susceptibility
    haplotypes may be maternally transmitted. Males are hemizygous; mildly
    affected carrier females can be minimally symptomatic owing to favorable
    skewing of X-chromosome inactivation.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:20301670
    reference_title: "MECP2 Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 disorders are inherited in an X-linked manner. More than 99% are simplex cases"
    explanation: GeneReviews establishes X-linked inheritance and the predominantly de novo (simplex) occurrence of MECP2 pathogenic variants.
pathophysiology:
- name: MECP2 Sequence and Regulatory Variation
  biological_scale: MOLECULAR
  description: >
    The AUTSX3 susceptibility is anchored on variation at the X-linked MECP2
    gene that falls short of the classic Rett-causing loss-of-function
    threshold: rare de novo missense mutations in autistic females, a non-lethal
    missense change in an autistic male, and an excess of conserved 3'-UTR
    variants that alter transcript stability. These alleles broaden the MECP2
    phenotypic spectrum beyond Rett syndrome and severe neonatal encephalopathy
    toward autism.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  molecular_functions:
  - preferred_term: methyl-CpG binding
    term:
      id: GO:0008327
      label: methyl-CpG binding
    modifier: DECREASED
  downstream:
  - target: Reduced or Dysregulated MeCP2 Dosage
    description: MECP2 coding, regulatory, and 3'-UTR variation reduces or destabilizes functional MeCP2 in neurons.
  evidence:
  - reference: PMID:12770674
    reference_title: "Identification of MeCP2 mutations in a series of females with autistic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two autistic disorder females were found to have de novo mutations in the MeCP2 gene."
    explanation: Identifies de novo MECP2 mutations in females diagnosed with autistic disorder, seeding the MECP2-autism susceptibility association.
  - reference: PMID:15211631
    reference_title: "MECP2 structural and 3'-UTR variants in schizophrenia, autism and other psychiatric diseases: a possible association with autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A higher frequency of missense and 3'-UTR variants was found in autism."
    explanation: Shows an excess of MECP2 coding and 3'-UTR variants in autism, extending the mutational spectrum beyond Rett syndrome.
  - reference: PMID:17427193
    reference_title: "MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel missense change, c.617G > C (p.G206A), was present in one autistic male with severe mental retardation and absence of language, and segregates in his maternal family."
    explanation: Documents a non-lethal MECP2 missense change in an autistic male, illustrating a phenotype distinct from severe neonatal encephalopathy.
- name: Reduced or Dysregulated MeCP2 Dosage
  biological_scale: CELLULAR
  description: >
    Neuronal MeCP2 abundance is tightly regulated, and autism brain frequently
    shows reduced MeCP2 expression. Conserved 3'-UTR variants lower MECP2 mRNA
    levels, and increased MECP2 promoter methylation in male frontal cortex
    correlates with reduced MeCP2 protein. Both genetic and epigenetic routes
    converge on a partial MeCP2 deficit below the Rett threshold.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  downstream:
  - target: Dysregulated Neuronal Gene Expression
    description: Reduced or dysregulated MeCP2 alters its methyl-CpG-dependent transcriptional control of neuronal target genes.
  evidence:
  - reference: PMID:17486179
    reference_title: "Reduced MeCP2 expression is frequent in autism frontal cortex and correlates with aberrant MECP2 promoter methylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant reduction in MeCP2 expression compared to age-matched controls was found in 11/14 autism (79%)"
    explanation: Demonstrates frequent reduction of MeCP2 expression in autism frontal cortex.
  - reference: PMID:17486179
    reference_title: "Reduced MeCP2 expression is frequent in autism frontal cortex and correlates with aberrant MECP2 promoter methylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A more frequent occurrence was significantly increased MECP2 promoter methylation in autism male frontal cortex compared to controls."
    explanation: Links epigenetic MECP2 promoter hypermethylation to reduced MeCP2 in autism brain, an expression-level (non-coding) route to the deficit.
  - reference: PMID:17427193
    reference_title: "MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mRNA levels measured in four patients with 3'UTR conserved changes were below the control range, suggesting an alteration in the stability of the transcripts."
    explanation: Shows conserved 3'-UTR variants lower MECP2 transcript levels, a dosage-reducing mechanism.
- name: Dysregulated Neuronal Gene Expression
  biological_scale: CELLULAR
  description: >
    MeCP2 binds methylated CpG dinucleotides and functions as both a
    transcriptional repressor (via histone deacetylase/SIN3A corepressor
    complexes) and an activator, regulating a wide range of neuronal genes.
    Partial loss or dysregulation of MeCP2 shifts these activity-dependent
    gene-expression programs, providing the molecular bridge from MECP2
    variation to altered neuronal maturation.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

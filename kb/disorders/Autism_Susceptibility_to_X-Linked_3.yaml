name: Autism, Susceptibility to, X-Linked 3
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Autism, susceptibility to, X-linked 3 (AUTSX3; OMIM 300496) is a historical
  susceptibility label linking autism to MECP2 at Xq28. It is not a
  well-delineated Mendelian syndrome and has no validated AUTSX3-specific
  diagnostic criteria, phenotype frequencies, natural history, prevalence,
  prognosis, biomarker, treatment, or clinical trial. The evidence comprises
  rare MECP2 variants observed in autistic individuals, small pre-GWAS
  candidate-gene studies, and newer variant-functional and large-cohort studies.
  These sources support an emerging model in which some hypomorphic coding or
  cis-regulatory variants alter MeCP2 dosage or function, but they do not justify
  treating every MECP2 variant, reduced MeCP2 expression in an autism cohort, or
  the clinical features of Rett syndrome as AUTSX3. Contemporary classification
  should instead use the individual's phenotype and variant mechanism to
  distinguish autism susceptibility from Rett syndrome, PPM-X syndrome, severe
  male MECP2 encephalopathy, and MECP2 duplication syndrome.
category: Complex
disease_term:
  preferred_term: autism, susceptibility to, X-linked 3
  term:
    id: MONDO:0010342
    label: autism, susceptibility to, X-linked 3
parents:
- Autism Spectrum Disorder
inheritance:
- name: X-linked susceptibility locus
  description: >-
    MECP2 lies on Xq28, so individual alleles at this locus are transmitted on
    the X chromosome. AUTSX3 itself is a susceptibility label rather than a
    proven, fully penetrant Mendelian disorder: penetrance, recurrence risk, and
    sex-specific expressivity have not been established for the heterogeneous
    coding and regulatory variants grouped under this name. GeneReviews'
    X-linked inheritance statement applies to established pathogenic MECP2
    disorders and is therefore only partial support for this broader historical
    label.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 disorders are inherited in an X-linked manner."
    explanation: >-
      Establishes the chromosomal inheritance of pathogenic MECP2 disorders but
      does not establish penetrance or recurrence risk for AUTSX3 susceptibility
      alleles.
mechanistic_hypotheses:
- hypothesis_group_id: hypomorphic_mecp2_autism_susceptibility
  hypothesis_label: Hypomorphic MECP2 coding or cis-regulatory variation as an autism susceptibility mechanism
  status: EMERGING
  description: >-
    Some coding or cis-regulatory MECP2 variants may produce a partial change in
    MeCP2 abundance or function that is milder than classic Rett-causing loss of
    function and contributes to autism. Historical support came from small
    candidate-gene cohorts and a family transmission study. A 2026 preprint
    provides direct human-neuron reporter-assay evidence for two noncoding
    variants, but a 2025 X-chromosome-wide common-variant study did not nominate
    MECP2 among its associated loci, and a 2026 analysis of more than 41,000
    trios found MECP2 coding de novo burden to be female-specific. The model is
    therefore plausible and newly testable, but neither canonical nor a basis
    for assuming that all reported variants are causal.
  evidence:
  - reference: PMID:19125863
    reference_title: Methyl-CpG-binding protein 2 polymorphisms and vulnerability to autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "has provided evidence for significant association (P = 0.009) for a three-marker SNP haplotype of MECP2 with autism/autism spectrum disorders"
    explanation: Historical family-based association evidence for the susceptibility model.
  - reference: PMID:42146591
    reference_title: A massively parallel reporter assay of MECP2 cis-regulatory elements reveals genetic candidates for male-biased autism.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We identified two noncoding variants that change CRE activity, each with a male-biased phenotype."
    explanation: >-
      Directly supports functional cis-regulatory candidates, but the source is a
      preprint and does not establish population penetrance or a discrete AUTSX3
      syndrome.
  - reference: PMID:39706197
    reference_title: Chromosome X-wide common variant association study in autism spectrum disorder.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "17 of which yielded association with ASD (GRPR, AP1S2, DDX53, HDAC8, PCDH19, PTCHD1, PCDH11X, PTCHD1-AS, DMD, SYAP1, CNKSR2, GLRA2, OFD1, CDKL5, GPRASP2, NXF5, and SH3KBP1)."
    explanation: >-
      In a much larger common-variant X-chromosome study, MECP2 was not among the
      associated genes. This is indirect negative evidence against generalizing
      the earlier small haplotype result, not a direct refutation of rare or
      regulatory MECP2 effects.
pathophysiology:
- name: Function-Altering MECP2 Coding or Cis-Regulatory Variation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The AUTSX3 literature reports heterogeneous candidate alleles: de novo
    coding variants in autistic females, a segregating p.Gly206Ala missense
    variant in an autistic male, conserved 3'-UTR variants, and newer noncoding
    cis-regulatory candidates. Observation in an autistic individual is not by
    itself proof of causality, and functional effects are variant-specific.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  downstream:
  - target: Reduced or Altered MeCP2 Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - hypomorphic_mecp2_autism_susceptibility
    description: >-
      A subset of coding or regulatory variants can reduce transcript abundance,
      protein stability, or another MeCP2 function; the direction cannot be
      assumed for an untested variant.
  evidence:
  - reference: PMID:12770674
    reference_title: Identification of MeCP2 mutations in a series of females with autistic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two autistic disorder females were found to have de novo mutations in the MeCP2 gene."
    explanation: Supports the observation of de novo MECP2 variants in two autistic females, not a distinct syndrome or proven variant mechanism.
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 15 novel variants, not found in controls: one missense, two intronic, and 12 in the 3'UTR (seven in conserved nucleotides)."
    explanation: Defines the heterogeneous variant classes observed in the Portuguese autism cohort.
  - reference: PMID:42032772
    reference_title: Sex-aware genome-wide assessment of de novo variants in autism across coding and noncoding regions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three genes that were specific to females, for significance, including TAOK1, MECP2, and DDX3X within a variant class."
    explanation: >-
      Modern large-cohort evidence supports MECP2 coding de novo burden in
      autistic females; it does not support a simple male-specific AUTSX3 model.
- name: Reduced or Altered MeCP2 Activity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Functional effects differ by allele. Conserved 3'-UTR changes in four
    patients were associated with low MECP2 mRNA; a 2026 human-neuron reporter
    assay found a promoter candidate that reduced expression; and a 2025
    yeast/Drosophila screen classified four of nine ASD-catalogued missense
    variants as loss of function while five retained function.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  molecular_functions:
  - preferred_term: methyl-CpG binding
    term:
      id: GO:0008327
      label: methyl-CpG binding
    modifier: DYSREGULATED
  downstream:
  - target: Dysregulated Neuronal Gene Expression
    causal_link_type: DIRECT
    hypothesis_groups:
    - hypomorphic_mecp2_autism_susceptibility
    description: Altered MeCP2 abundance or function can perturb its transcriptional-regulatory activity.
  evidence:
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mRNA levels measured in four patients with 3'UTR conserved changes were below the control range, suggesting an alteration in the stability of the transcripts."
    explanation: Variant-associated transcript evidence for a dosage-reducing mechanism in four patients.
  - reference: PMID:42146591
    reference_title: A massively parallel reporter assay of MECP2 cis-regulatory elements reveals genetic candidates for male-biased autism.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "One of these, a promoter variant, disrupts NFY binding and reduces MECP2 expression by ~30%, a magnitude that produces autism-like phenotypes in mice."
    explanation: Human-neuron reporter-assay evidence from a 2026 preprint; clinical causality remains provisional.
  - reference: PMID:40546018
    reference_title: Revealing function-altering MECP2 mutations in individuals with autism spectrum disorder using yeast and Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data predict that four ASD variants are loss of function and five are functional."
    explanation: Demonstrates variant-specific functional heterogeneity and prevents treating every ASD-catalogued MECP2 missense variant as loss of function.
- name: Dysregulated Neuronal Gene Expression
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    MeCP2 binds methylated DNA and participates in both transcriptional
    repression and activation. Altering MeCP2 activity can therefore change
    broad neuronal expression programs, but the specific transcriptional
    program connecting AUTSX3 candidate variants to autism has not been defined
    in human brain.
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  downstream:
  - target: Altered Synaptic and GABAergic Neuron Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - hypomorphic_mecp2_autism_susceptibility
    description: Model systems suggest that transcriptional dysregulation perturbs synaptic maturation and inhibitory-neuron function.
  evidence:
  - reference: PMID:9620804
    reference_title: Transcriptional repression by the methyl-CpG-binding protein MeCP2 involves a histone deacetylase complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that a region of MeCP2 that localizes with the TRD associates with a corepressor complex containing the transcriptional repressor mSin3A and histone deacetylases."
    explanation: Establishes a core MeCP2 transcriptional-repression mechanism in vitro.
  - reference: PMID:18511691
    reference_title: MeCP2, a key contributor to neurological disease, activates and represses transcription.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies suggest that MeCP2 regulates the expression of a wide range of genes in the hypothalamus and that it can function as both an activator and a repressor of transcription."
    explanation: Mouse evidence that MeCP2 has broad bidirectional transcriptional effects.
- name: Altered Synaptic and GABAergic Neuron Function
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Conditional Mecp2 deletion in mouse GABA-releasing neurons reduces
    inhibitory signaling and produces repetitive and other Rett/autism-like
    behaviors. This establishes a plausible circuit route for major MeCP2 loss,
    not a demonstrated human AUTSX3 mechanism for hypomorphic alleles.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: DYSREGULATED
  downstream:
  - target: Autistic Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - hypomorphic_mecp2_autism_susceptibility
    description: The model-system circuit phenotype is hypothesized to contribute to autistic behavior in carriers of function-altering MECP2 alleles.
  evidence:
  - reference: PMID:21068835
    reference_title: Dysfunction in GABA signalling mediates autism-like stereotypies and Rett syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate that MeCP2 is critical for normal function of GABA-releasing neurons and that subtle dysfunction of GABAergic neurons contributes to numerous neuropsychiatric phenotypes."
    explanation: Model-organism evidence for the GABAergic branch; human AUTSX3 translation remains unproven.
phenotypes:
- name: Autistic Behavior
  description: >-
    Autism is the defining phenotype of the susceptibility label. The evidence
    does not establish an AUTSX3-specific onset, severity distribution, or
    frequency, and individual MECP2-positive cases may meet criteria for a
    better-defined MECP2 disorder.
  phenotype_term:
    preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  evidence:
  - reference: PMID:19125863
    reference_title: Methyl-CpG-binding protein 2 polymorphisms and vulnerability to autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that one or more functional variants of MECP2 existing at significant frequencies in the population may confer increased risk of autism/autism spectrum disorders"
    explanation: Historical susceptibility association, retained with the evidence-balance caveats in the mechanistic hypothesis.
  - reference: PMID:15211631
    reference_title: "MECP2 structural and 3'-UTR variants in schizophrenia, autism and other psychiatric diseases: a possible association with autism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations suggest that a possible association between MECP2 mutations and autism may warrant further study."
    explanation: The source itself frames the association as provisional.
- name: Intellectual Disability
  description: >-
    Severe intellectual disability was reported in the single autistic male
    carrying p.Gly206Ala. Because causal attribution of that segregating variant
    was not established, this is a variant-specific observation rather than an
    AUTSX3 frequency or severity claim.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "was present in one autistic male with severe mental retardation and absence of language"
    explanation: Single-carrier, variant-specific phenotype evidence with uncertain causal attribution.
- name: Absent Speech
  description: >-
    Absence of language was reported in the same p.Gly206Ala carrier. It is not
    established as a general AUTSX3 feature and no disease-level frequency is
    assigned.
  phenotype_term:
    preferred_term: Absent speech
    term:
      id: HP:0001344
      label: Absent speech
  evidence:
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "was present in one autistic male with severe mental retardation and absence of language"
    explanation: Single-carrier, variant-specific phenotype evidence with uncertain causal attribution.
genetic:
- name: MECP2
  gene_term:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    MECP2 is the MONDO-linked susceptibility gene, but gene validity is
    phenotype-dependent. Its established role in MECP2 disorders does not by
    itself validate AUTSX3 as a separate disorder. Historical AUTSX3 evidence
    rests on small candidate-gene studies; modern evidence supports
    female-biased coding de novo burden and emerging, variant-specific
    cis-regulatory mechanisms.
    Variant classification must therefore be performed individually and should
    not use the AUTSX3 label to upgrade a variant of uncertain significance.
  evidence:
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that MECP2 can play a role in autism etiology, although very rarely, supporting the notion that MECP2 mutations underlie several neurodevelopmental disorders."
    explanation: Supports a rare contribution while explicitly limiting its scope.
  - reference: PMID:42032772
    reference_title: Sex-aware genome-wide assessment of de novo variants in autism across coding and noncoding regions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct comparisons of DNVs in males and females revealed MECP2 as the only exome-wide significant gene"
    explanation: Large-cohort evidence for sex-dependent MECP2 coding de novo burden in autism cohorts.
  - reference: PMID:39706197
    reference_title: Chromosome X-wide common variant association study in autism spectrum disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we conducted an X-chromosome-wide association study (XWAS) using whole-genome sequencing data from 6,873 individuals with ASD (82% males) across Autism Speaks MSSNG, Simons Simplex Collection (SSC), and Simons Powering Autism Research (SPARK), alongside 8,981 population controls (43% males)."
    explanation: Provides the scale of the modern common-variant study that did not nominate MECP2 among its associated genes.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No AUTSX3-specific prevalence, incidence, penetrance, carrier frequency, sex
    ratio, ancestry distribution, or geographic distribution was identified in
    literature reviewed through 2026-08-05. Autism and Rett syndrome rates must
    not be substituted for this historical susceptibility label.
diagnosis:
- name: Phenotype-led genomic testing and MECP2 variant interpretation
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    AUTSX3 has no standalone clinical or molecular diagnostic criteria. In an
    autistic individual with developmental impairment, genomic testing may
    identify an MECP2 variant, but diagnosis requires variant-level
    interpretation and comparison with established MECP2 disorders. A catalogued
    or functionally altered variant does not automatically define AUTSX3 or prove
    that it caused autism.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a MECP2 disorder is established by molecular genetic testing"
    explanation: Supports testing for established MECP2 disorders, not a validated AUTSX3-specific test.
differential_diagnoses:
- name: Rett syndrome
  disease_term:
    preferred_term: Rett syndrome
    term:
      id: MONDO:0010726
      label: Rett syndrome
  description: >-
    Rett syndrome is the definitive MECP2 loss-of-function relationship and has
    a characteristic regression phenotype, primarily in females. An autistic
    presentation with a pathogenic MECP2 variant may represent atypical Rett
    syndrome rather than AUTSX3; Rett natural history, prevalence, and treatment
    evidence must not be transferred without the Rett phenotype.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of MECP2-related phenotypes in females ranges from classic Rett syndrome to variant Rett syndrome with a broader clinical phenotype (either milder or more severe than classic Rett syndrome) to mild learning disabilities"
    explanation: Establishes the broad female MECP2 spectrum that can overlap an autism-predominant presentation.
- name: PPM-X syndrome
  disease_term:
    preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
    term:
      id: MONDO:0010235
      label: X-linked intellectual disability-psychosis-macroorchidism syndrome
  description: >-
    PPM-X is a distinct, variant-specific MECP2 disorder, classically associated
    with p.Ala140Val and intellectual disability, pyramidal/parkinsonian signs,
    psychosis, and macroorchidism. It should be used when that syndromic and
    allelic pattern is present rather than relabeling it AUTSX3.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the spectrum in males ranges from severe neonatal encephalopathy to pyramidal signs, parkinsonism, and macroorchidism (PPM-X) syndrome to severe syndromic/nonsyndromic intellectual disability"
    explanation: Distinguishes recognized male MECP2 phenotypes from the historical AUTSX3 label.
- name: Severe neonatal-onset encephalopathy with microcephaly
  disease_term:
    preferred_term: severe neonatal-onset encephalopathy with microcephaly
    term:
      id: MONDO:0010397
      label: severe neonatal-onset encephalopathy with microcephaly
  description: >-
    Hemizygous males with severe pathogenic MECP2 loss-of-function variants may
    have a relentless neonatal encephalopathy rather than isolated autism
    susceptibility. This is an established severe male MECP2 disorder and must
    not be interpreted as the expected course of AUTSX3.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is characterized by a relentless clinical course"
    explanation: Defines the severe male MECP2 differential and its contrasting course.
- name: MECP2 duplication syndrome
  disease_term:
    preferred_term: MECP2 duplication syndrome
    term:
      id: MONDO:0010283
      label: syndromic X-linked intellectual disability Lubs type
  description: >-
    MECP2 copy-number gain causes a distinct dosage-gain syndrome, predominantly
    in males, that can include autistic features. A duplication is not evidence
    for the proposed hypomorphic AUTSX3 mechanism.
  evidence:
  - reference: PMID:20425814
    reference_title: The MECP2 duplication syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 duplication syndrome is 100% penetrant in affected males and is associated with infantile hypotonia, severe to profound mental retardation, autism or autistic features, poor speech development, recurrent infections, epilepsy, progressive spasticity, and, in some cases, developmental regression."
    explanation: Human clinical review establishing the distinct dosage-gain syndrome and its overlapping autistic features.
treatments:
- name: Phenotype-Directed Multidisciplinary Support
  description: >-
    There is no AUTSX3-specific or genotype-corrective treatment. Support should
    be directed to the individual's diagnosed autism, communication,
    developmental, educational, behavioral, and other clinical needs. The cited
    GeneReviews recommendation is group-level MECP2 guidance and does not support
    importing Rett-specific drugs, surveillance schedules, or treatment effects
    into AUTSX3. GeneReviews' risperidone, melatonin, and QT-prolonging-drug
    guidance is not retained as an AUTSX3 recommendation because the direct
    literature does not establish agitation, sleep disturbance, prolonged QTc,
    or another AUTSX3-specific indication; those decisions belong to the
    individual's actual clinical diagnosis and findings.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is mainly symptomatic and focuses on optimizing the individual's abilities using a multidisciplinary approach that should also include psychosocial support for family members."
    explanation: Group-level supportive-care guidance for MECP2 disorders; no AUTSX3-specific efficacy evidence exists.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Conditional Mecp2 deletion in GABA-releasing neurons
  category: Conditional knockout
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  associated_phenotypes:
  - Repetitive behavior
  - Reduced inhibitory synaptic signaling
  - Rett-like neurologic features
  description: >-
    This conditional knockout supports a GABAergic contribution to phenotypes of
    major MeCP2 deficiency. It is a Rett-spectrum model, not an allele-matched
    AUTSX3 model, and therefore cannot establish that subtle human coding or
    regulatory variants use the same mechanism.
  evidence:
  - reference: PMID:21068835
    reference_title: Dysfunction in GABA signalling mediates autism-like stereotypies and Rett syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that mice lacking Mecp2 from GABA (γ-aminobutyric acid)-releasing neurons recapitulate numerous Rett syndrome and autistic features, including repetitive behaviours."
    explanation: Defines the model and the phenotype it reproduces.
- species: Fruit fly (Drosophila melanogaster)
  genotype: Transgenic functional assays of nine ASD-catalogued human MECP2 missense variants
  category: Transgenic variant screen
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  associated_phenotypes:
  - Variant-specific loss of function
  - Protein destabilization
  description: >-
    Drosophila and budding-yeast assays calibrated with pathogenic and benign
    controls separated four predicted loss-of-function variants from five
    functionally retained variants. The system is useful for variant triage but
    lacks mammalian DNA methylation and does not establish human penetrance or
    an AUTSX3 phenotype.
  evidence:
  - reference: PMID:40546018
    reference_title: Revealing function-altering MECP2 mutations in individuals with autism spectrum disorder using yeast and Drosophila.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To assess these nine variants as risk alleles for ASD, we developed MECP2 variant functional assays using budding yeast and Drosophila."
    explanation: Establishes the variant-screening model systems and their intended use.
discussions:
- discussion_id: gap_autsx3_nosologic_status
  prompt: >-
    Does AUTSX3 delineate a reproducible clinical entity, or should it remain a
    legacy susceptibility label within the broader MECP2-related disorder
    spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Function-Altering MECP2 Coding or Cis-Regulatory Variation
  rationale: >-
    The direct literature does not define a consistent AUTSX3 phenotype beyond
    autism, and individual reports overlap Rett-spectrum or
    intellectual-disability presentations. No AUTSX3-specific frequency, natural-history,
    epidemiology, diagnostic, biomarker, management, trial, or prognosis data
    were identified through 2026-08-05. Rett and MECP2-duplication data are
    comparators, not substitutes.
  evidence:
  - reference: PMID:12770674
    reference_title: Identification of MeCP2 mutations in a series of females with autistic disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These data provide additional evidence of variable expression in the Rett disorder phenotype"
    explanation: The authors interpreted their autistic female cases as variable Rett expression rather than a new discrete syndrome.
  - reference: PMID:17427193
    reference_title: MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients.
    supports: PARTIAL

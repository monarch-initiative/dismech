genetic:
- name: MECP2
  gene_term:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    MECP2 (Xq28) encodes methyl-CpG-binding protein 2. In AUTSX3 the gene acts
    as an autism-susceptibility locus through rare non-lethal coding mutations,
    conserved 3'-UTR/regulatory variants that reduce transcript dosage,
    epigenetic promoter hypermethylation reducing expression, and common
    haplotype association — distinct from the classic loss-of-function alleles
    that cause Rett syndrome. Evidence caveat: the susceptibility association
    derives from small pre-GWAS candidate-gene studies (Shibayama 2004 n=24,
    Loat 2008 TDT P=0.009, Coutinho 2007 1 variant/172) without modern
    large-cohort replication; see discussion gap_autsx3_evidence_robustness.
  evidence:
  - reference: PMID:19125863
    reference_title: "Methyl-CpG-binding protein 2 polymorphisms and vulnerability to autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "has provided evidence for significant association (P = 0.009) for a three-marker SNP haplotype of MECP2 with autism/autism spectrum disorders"
    explanation: Transmission-disequilibrium evidence for a MECP2 haplotype associated with autism supports MECP2 as a susceptibility locus.
  - reference: PMID:17427193
    reference_title: "MECP2 coding sequence and 3'UTR variation in 172 unrelated autistic patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that MECP2 can play a role in autism etiology, although very rarely, supporting the notion that MECP2 mutations underlie several neurodevelopmental disorders."
    explanation: Concludes MECP2 contributes rarely to autism etiology, consistent with a susceptibility locus.

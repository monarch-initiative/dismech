inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Affected individuals in both reported consanguineous families are homozygous for truncating
    FYB1 variants; parents and tested unaffected siblings are heterozygous carriers with normal
    hematologic indices.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25876182
    reference_title: Deleterious mutation in the FYB gene is associated with congenital autosomal recessive
      small-platelet thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied a previously reported family of five children from two consanguineous sibships of
      Arab Christian descent affected with a novel autosomal recessive bleeding disorder with
      small-platelet thrombocytopenia.
    explanation: Describes the autosomal recessive pattern in the first FYB-defined family.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected the 4 parents were heterozygous for the variant and all the non-affected siblings
      for whom we had samples (marked as arrows in Figure 1A) were also heterozygous for the variant.
    explanation: >-
      Segregation in the Iraqi family: homozygous affected children, heterozygous unaffected parents
      and siblings.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hematologic investigations of all carriers showed normal results.
    explanation: Heterozygous carriers are hematologically unaffected, consistent with recessive inheritance.
pathophysiology:
- name: Biallelic FYB1 Truncating Variants
  description: >-
    Homozygous nonsense (c.393G>A) or frameshift (c.1385_1386del, p.Tyr462*) variants in FYB1 were
    identified in the two reported consanguineous families; both are predicted to abolish ADAP.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: FYB1
      term:
        id: hgnc:4036
        label: FYB1
  evidence:
  - reference: PMID:25876182
    reference_title: Deleterious mutation in the FYB gene is associated with congenital autosomal recessive
      small-platelet thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a homozygous deleterious nonsense mutation, c.393G>A, in FYB.
    explanation: Homozygous nonsense allele in the Arab Christian family.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a 2 bp deletion which introduces a stop codon in the FYB gene (NM_001465.3:c.1385_1386del:
      p.(Tyr462*))
    explanation: Homozygous frameshift allele in the Iraqi family.
  downstream:

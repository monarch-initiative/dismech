name: Thrombocytopenia 3
creation_date: "2026-10-13T10:00:00Z"
category: Mendelian
synonyms:
- THC3
- CARST
- congenital autosomal recessive small-platelet thrombocytopenia
- FYB1-related thrombocytopenia
description: >-
  Thrombocytopenia 3 (THC3), also called congenital autosomal recessive small-platelet
  thrombocytopenia (CARST), is an inherited platelet disorder caused by biallelic loss-of-function
  variants in FYB1, which encodes the hematopoietic adaptor protein ADAP. Affected children from
  two consanguineous families, one Arab Christian family studied in Israel and one family from
  Northern Iraq, presented in early childhood with isolated thrombocytopenia, small platelets,
  petechiae, epistaxis and mucosal bleeding, without immune defects, unusual infections or growth
  abnormalities. Patient platelets show abnormal basal activation markers, blunted responses to ADP
  and reduced pseudopodium formation. In ADAP-deficient mice, megakaryocytes fail to activate beta1
  integrins, form podosomes and polarize their demarcation membrane system, and release
  (pro)platelet-like particles ectopically into the marrow rather than into sinusoids; platelets
  are also cleared faster by macrophages. ADAP-deficient platelets additionally show defective
  inside-out activation of integrin alphaIIb-beta3 and unstable thrombus formation under shear,
  which may add a platelet-function component to the bleeding tendency.

diagnosis:
- name: Blood count and platelet size
  description: >-
    Isolated thrombocytopenia with low mean platelet volume and normal other lineages in a child of
    consanguineous parents, without eczema or recurrent infection, points to this disorder;
    Wiskott-Aldrich syndrome and X-linked thrombocytopenia are the main small-platelet differentials.
  evidence:
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two syndromes with thrombocytopenia and low MPV, Wiskott-Aldrich syndrome (OMIM 301000) and
      X-linked thrombocytopenia (OMIM 313900) were not considered in the differential diagnosis for
      this family because of absence of eczema and repeated infection and because both sexes are
      affected pointing more to an autosomal recessive mode of inheritance.
    explanation: Clinical features used to separate the disorder from WAS/XLT.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: None of the patients had immune defects, unusual infections or growth abnormalities
    explanation: The disorder is non-syndromic and lacks immunodeficiency.
- name: Bone marrow aspiration
  description: >-
    Marrow findings have differed between families: a reduced percentage of mature megakaryocytes in
    one, normal megakaryocyte numbers in the other.
  diagnosis_term:
    preferred_term: bone marrow aspiration
    term:
      id: NCIT:C15644
      label: Bone Marrow Aspiration
  evidence:
  - reference: PMID:25876182
    reference_title: Deleterious mutation in the FYB gene is associated with congenital autosomal recessive
      small-platelet thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A reduced percentage of mature megakaryocytes was found in the bone marrow.
    explanation: Marrow finding in the Arab Christian family.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Aspiration showed active BM with normal number of megakaryocytes.
    explanation: Normal megakaryocyte number in the Iraqi proband.
- name: Platelet function testing
  description: >-
    Flow cytometry shows raised basal P-selectin and PAC-1 with reduced increments after ADP; scanning
    electron microscopy shows reduced pseudopodium formation.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:25876182
    reference_title: Deleterious mutation in the FYB gene is associated with congenital autosomal recessive
      small-platelet thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients' platelets showed increased basal expression of P-selectin and PAC-1, and reduced
      increments of activation markers after stimulation with ADP, as detected by flow cytometry
    explanation: Flow cytometric platelet activation profile.
- name: FYB1 sequencing
  description: >-
    The diagnosis is confirmed by biallelic FYB1 variants; exome sequencing with homozygosity mapping
    identified both reported alleles, and FYB1 analysis is recommended in the work-up of inherited
    thrombocytopenia.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25876182
    reference_title: Deleterious mutation in the FYB gene is associated with congenital autosomal recessive
      small-platelet thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is suggested that mutation analysis of this gene be included in the diagnosis of inherited
      thrombocytopenia.
    explanation: Recommends FYB1 testing for inherited thrombocytopenia.
  - reference: PMID:25516138
    reference_title: 'Recessive thrombocytopenia likely due to a homozygous pathogenic variant in the
      FYB gene: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing may become a first diagnostic tool to identify the molecular basis of undiagnosed
      familial IT.
    explanation: Exome sequencing identified the causal variant in the Iraqi family.

animal_models:
- name: Constitutive Adap knockout mouse
  species: Mouse
  genotype: Adap-/- (Fyb knockout)
  genes:
  - preferred_term: FYB1
    term:
      id: hgnc:4036
      label: FYB1
  description: >-
    Constitutive ADAP-deficient mice have moderate thrombocytopenia with small platelets, shortened
    platelet survival, ectopic proplatelet release in the marrow, defective alphaIIb-beta3 activation,
    unstable thrombi and increased rebleeding.
  publication: PMID:29950291
  evidence:
  - reference: PMID:29950291
    reference_title: ADAP deficiency impairs megakaryocyte polarization with ectopic proplatelet release
      and causes microthrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that Adap-/- mice display several characteristics of human CARST, with moderate
      thrombocytopenia and smaller-sized platelets.
    explanation: The knockout reproduces the human microthrombocytopenia.
  modeled_mechanisms:
  - target: Ectopic Proplatelet Release into the Bone Marrow Compartment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The constitutive knockout shows ectopic (pro)platelet release with small platelets.
    limitations: >-
      Ectopic release has been imaged only in mice; human marrow has been examined by aspiration,
      which cannot show where proplatelets are released. ADAP is also absent from T, NK and myeloid
      cells in this model.
    evidence:
    - reference: PMID:29950291
      reference_title: ADAP deficiency impairs megakaryocyte polarization with ectopic proplatelet release
        and causes microthrombocytopenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Whole-sternum 3-dimensional confocal imaging and intravital 2-photon microscopy revealed altered
        morphology of ADAP-deficient MKs with signs of fragmentation and ectopic release of
        (pro)platelet-like particles into the BM compartment.
      explanation: Supports the model as informative for the platelet-production node.
  - target: Unstable Platelet Thrombus Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Knockout mice form unstable arterial thrombi and rebleed from tail wounds.
    limitations: >-
      Thrombus stability under shear has not been measured in patient platelets, and the knockout
      platelet count is itself reduced.
    evidence:
    - reference: PMID:19996090
      reference_title: Role for ADAP in shear flow-induced platelet mechanotransduction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: ADAP(-/-) mouse platelets, unlike ADAP+/+ platelets, formed unstable thrombi in response
        to carotid artery injury.
      explanation: In vivo thrombus instability in the knockout.
- name: Megakaryocyte-restricted Adap knockout mouse
  species: Mouse
  genotype: Adap fl/fl PF4-Cre
  genes:
  - preferred_term: FYB1
    term:
      id: hgnc:4036
      label: FYB1
  description: >-
    Deletion of ADAP restricted to the megakaryocyte lineage produces thrombocytopenia with fewer and
    smaller platelets and ectopic platelet release, showing that the production defect is
    megakaryocyte-intrinsic; platelets also show reduced CLEC-2-induced integrin activation.
  publication: PMID:30833485
  evidence:
  - reference: PMID:30833485
    reference_title: Characterization of Mice with a Platelet-Specific Deletion of the Adapter Molecule
      ADAP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ADAPfl/fl PF4-Cretg mice showed thrombocytopenia in combination with reduced plasma levels of PF4
      and transforming growth factor β1 (TGF-β1).
    explanation: Lineage-restricted deletion is sufficient for thrombocytopenia.
  modeled_mechanisms:
  - target: Ectopic Proplatelet Release into the Bone Marrow Compartment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Megakaryocyte-restricted deletion reproduces ectopic release and small platelets.
    limitations: Mouse megakaryocytes; ectopic release is not yet documented in patient marrow.
    evidence:
    - reference: PMID:29950291
      reference_title: ADAP deficiency impairs megakaryocyte polarization with ectopic proplatelet release
        and causes microthrombocytopenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MK-/platelet-specific ADAP-deficient mice (PF4-cre) also produced fewer and smaller-sized
        platelets and released platelets ectopically.
      explanation: The lineage-restricted model reproduces the production defect.
  - target: Impaired Platelet Integrin AlphaIIb-Beta3 Inside-Out Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Platelets show diminished alphaIIb-beta3 activation after CLEC-2 stimulation.
    limitations: Agonist panels differ from those tested in patient platelets, where ADP was used.
    evidence:
    - reference: PMID:30833485
      reference_title: Characterization of Mice with a Platelet-Specific Deletion of the Adapter Molecule
        ADAP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In vitro, platelets from these mice revealed reduced P-selectin expression, lower levels of
        TGF-β1 release, diminished integrin αIIbβ3 activation, and decreased fibrinogen binding after
        stimulation with podoplanin, the ligand of C-type lectin-like receptor 2 (CLEC-2).
      explanation: Supports the model for the platelet integrin activation node.

    receptor-driven patterning: the cerebellum and posterior fossa, the
    cardiac septa and outflow tract, and the craniofacial skeleton. The cell
    types listed below belong to the cerebellar arm only and do not apply to
    the cardiac or craniofacial arms this node also feeds; they sit here
    because no separate cerebellar node has been split out.

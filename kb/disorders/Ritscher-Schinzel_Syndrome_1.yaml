inheritance:
- name: Autosomal recessive
  description: >-
    RSS1 segregates as an autosomal recessive trait. Affected individuals carry
    biallelic WASHC5 variants, either homozygous (as in the northern Manitoba
    First Nations founder cohort) or compound heterozygous.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31971710
    reference_title: "Ritscher-Schinzel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WASHC5-related RSS is inherited in an autosomal recessive manner;
      CCDC22-related RSS is inherited in an X-linked manner.
    explanation: >-
      Names the inheritance mode for the WASHC5 form specifically and
      distinguishes it from the X-linked CCDC22 form, so the attribution to RSS1
      is genotype-specific rather than inferred from a form-agnostic statement.
  - reference: PMID:31971710
    reference_title: "Ritscher-Schinzel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of
      being affected, a 50% chance of being an asymptomatic carrier, and a 25%
      chance of being unaffected and not a carrier.
    explanation: >-
      Gives the sibling recurrence risks that follow from autosomal recessive
      inheritance, which is the operative counselling figure for RSS1.

prevalence:
- population: Worldwide, molecularly confirmed cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only 17 individuals with a molecular diagnosis of Ritscher-Schinzel syndrome
    of any form had been reported as of 2021, of which the WASHC5 subset is
    smaller still. A founder cluster exists in a First Nations community in
    northern Manitoba, so the case count is geographically concentrated rather
    than uniformly distributed. No population-based rate has been estimated, and
    none is asserted here.
  evidence:
  - reference: PMID:34020006
    reference_title: "Expansion of the CCDC22 associated Ritscher-Schinzel/3C syndrome and review of the literature: Should the minimal diagnostic criteria be revised?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 17 individuals with a molecular diagnosis are reported.
    explanation: >-
      Gives the total molecularly confirmed case count across the syndrome,
      which is the basis for the ULTRA_RARE band. The count spans all genetic
      forms rather than WASHC5 alone, so it is an upper bound for RSS1.

diagnosis:
- name: Molecular genetic testing of WASHC5
  description: >-
    The diagnosis is established in a proband with suggestive clinical findings
    by identifying biallelic pathogenic WASHC5 variants. Because the syndrome is
    genetically heterogeneous and clinically overlapping across its forms,
    exome, genome, or a multigene panel covering the WASH and Commander pathway
    genes is the practical route.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31971710
    reference_title: "Ritscher-Schinzel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Ritscher-Schinzel syndrome is established in a proband
      with suggestive clinical findings, including characteristic dysmorphic
      facial features, and/or by the identification of biallelic pathogenic
      variants in WASHC5 in a male or female or a hemizygous pathogenic variant
      in CCDC22 in a male by molecular genetic testing
    explanation: >-
      States the diagnostic criterion, and names biallelic WASHC5 variants in
      either sex as the molecular finding that establishes the RSS1 form.

- name: Clinical minimal diagnostic criteria
  description: >-
    Before molecular testing, the diagnosis rested on a proposed clinical
    triad of cardiac malformation other than isolated patent ductus arteriosus,
    posterior fossa malformation, and characteristic dysmorphic features. These
    criteria are not met by every patient with a molecular diagnosis, so they
    are useful for raising suspicion rather than for excluding the diagnosis.
  notes: >-
    The cited paper numbers the genetic forms the opposite way round to OMIM,
    MONDO and GeneReviews: it calls the CCDC22 form RTSCS1 and the WASHC5 form
    RTSCS2, while its own text correctly pairs CCDC22 with X-linked and WASHC5
    with autosomal recessive inheritance. This entry follows the standard
    numbering, in which RTSCS1 is the WASHC5 form (OMIM 220210). The paper is
    cited here only for the syndrome-level diagnostic criteria and the case
    count, neither of which depends on the numbering.
  evidence:
  - reference: PMID:34020006
    reference_title: "Expansion of the CCDC22 associated Ritscher-Schinzel/3C syndrome and review of the literature: Should the minimal diagnostic criteria be revised?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      minimal diagnostic criteria has been proposed for the syndrome: Cardiac
      malformations (other than isolated patent ductus arteriosis), fossa
      posterior malformations, and certain dysmorphic features.
    explanation: >-
      States the proposed clinical criteria for the syndrome as a whole.
  - reference: PMID:34020006
    reference_title: "Expansion of the CCDC22 associated Ritscher-Schinzel/3C syndrome and review of the literature: Should the minimal diagnostic criteria be revised?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, those criteria are not present in all patients.
    explanation: >-
      The same paper reports that the criteria fail on some molecularly
      confirmed patients, which is why they cannot be used to rule the diagnosis
      out. This supports rather than contradicts the entry: the description
      already states the criteria are not met by every patient and are for
      raising suspicion rather than excluding the diagnosis, so the quote
      confirms the claim as written.

- name: Metacarpophalangeal pattern profile on hand radiographs
  description: >-
    Hand radiographs show a consistent wavy metacarpal phalangeal profile.
    GeneReviews treats this as a characteristic finding, so it functions as a
    clinical pointer toward the diagnosis rather than a confirmatory test.
  evidence:
  - reference: PMID:31971710
    reference_title: "Ritscher-Schinzel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals also typically have a characteristic metacarpal
      phalangeal profile showing a consistent wavy pattern on hand radiographs.
    explanation: >-
      GeneReviews describes the radiographic hand pattern as typical and
      characteristic, which is what makes it diagnostically useful.

progression:
- phase: Life-threatening complications
  notes: >-
    Mortality in this syndrome is driven principally by the cardiac
    malformations. Pulmonary hypertension with prolonged respiratory failure has
    also been reported in a preterm infant, so cardiorespiratory status is the
    dominant determinant of early outcome.
  evidence:
  - reference: PMID:23072186
    reference_title: "A preterm infant with prolonged respiratory problems due to Ritscher-Schinzel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life threatening features of this syndrome are generally associated with
      cardiac abnormalities.
    explanation: >-
      Identifies the cardiac malformations as the main threat to survival, which
      is what makes cardiology the priority in management.
  - reference: PMID:23072186
    reference_title: "A preterm infant with prolonged respiratory problems due to Ritscher-Schinzel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here present prolonged respiratory problems due to pulmonary
      hypertension in a preterm baby with Ritscher-Schinzel syndrome.
    explanation: >-
      A single case report of pulmonary hypertension causing prolonged
      respiratory failure. One patient, so it establishes the complication can
      occur rather than how often it does.

pathophysiology:
- name: WASHC5 Hypomorphic Loss of Function
  description: >-
    Biallelic WASHC5 (KIAA0196) variants reduce the abundance of functional
    strumpellin. The founder variant identified in the northern Manitoba First
    Nations cohort is a splice-site change that shifts the relative abundance of
    KIAA0196 transcripts and leaves approximately 40% of normal strumpellin
    protein. Disease alleles are hypomorphic rather than complete nulls,
    consistent with embryonic lethality of the homozygous murine knockout.
  biological_scale: MOLECULAR
  downstream:
  - target: WASH Regulatory Complex Destabilisation
    causal_link_type: DIRECT
    description: >-
      Strumpellin is one of five obligate subunits of the WASH regulatory
      complex, so reducing it lowers the abundance of the assembled complex.
    evidence:
    - reference: PMID:26572744
      reference_title: "The spectrum of KIAA0196 variants, and characterization of a murine knockout: implications for the mutational mechanism in hereditary spastic paraplegia type SPG8."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mRNA expression of genes encoding other SHRC members was unaltered,
        while there was evidence for reduced SHRC abundance at protein level
      explanation: >-
        Loss of the strumpellin gene product lowers the abundance of the
        assembled WASH regulatory complex without changing transcription of the
        other subunits, establishing that the molecular lesion propagates to the
        complex.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      The recurrent First Nations allele is a homozygous splice-site variant
      associated with an approximately eightfold change in the relative amount
      of the KIAA0196 transcript lacking exon 27 and a 60% reduction in
      strumpellin protein. Compound heterozygous WASHC5 alleles have been
      reported in a separate family.
  evidence:
  - reference: PMID:24065355
    reference_title: "A novel mutation in KIAA0196: identification of a gene involved in Ritscher-Schinzel/3C syndrome in a First Nations cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight patients were homozygous for a novel splice site mutation in
      KIAA0196. RNA analysis revealed an approximate eightfold reduction in the
      relative amount of a KIAA0196 transcript lacking exon 27. A 60% reduction
      in the amount of strumpellin protein was observed on western blot.
    explanation: >-
      The founding genetic study demonstrates the causal WASHC5 variant and
      quantifies the residual strumpellin, establishing the lesion as a partial
      rather than complete loss of function.
  - reference: PMID:26572744
    reference_title: "The spectrum of KIAA0196 variants, and characterization of a murine knockout: implications for the mutational mechanism in hereditary spastic paraplegia type SPG8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Homozygous but not heterozygous mice showed early embryonic lethality.
    explanation: >-
      Complete loss of the murine orthologue is lethal before birth, so viable
      human RSS1 genotypes must retain partial strumpellin function. This
      supports the hypomorphic-allele claim by inference from the null
      phenotype rather than by direct measurement in patients.

- name: WASH Regulatory Complex Destabilisation
  description: >-
    Reduced strumpellin lowers the abundance of the assembled pentameric WASH
    regulatory complex on the endosomal membrane. The complex is the endosomal
    member of the WASP family and is the dedicated Arp2/3 activator at this
    compartment. It reaches the endosome by the unstructured tail of its FAM21
    subunit binding retromer VPS35, an interaction that is both necessary and
    sufficient for the targeting, so the complex acts specifically where
    retromer is selecting cargo. This retromer-dependent recruitment is what
    makes the WASH route distinct from the SNX17-dependent Commander route that
    fails in the CCDC22 and VPS35L forms of the syndrome.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Endosomal Branched Actin Nucleation
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: DECREASED
  evidence:
  - reference: PMID:20498093
    reference_title: "WASH and WAVE actin regulators of the Wiskott-Aldrich syndrome protein (WASP) family are controlled by analogous structurally related complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that WASH functions in cells within a 500 kDa core complex
      containing Strumpellin, FAM21, KIAA1033 (SWIP), and CCDC53.
    explanation: >-
      Names strumpellin as one of five obligate subunits of the WASH core
      complex, which is why reducing it compromises the whole assembly rather
      than only one of its activities.
  - reference: PMID:22070227
    reference_title: "Recruitment of the endosomal WASH complex is mediated by the extended 'tail' of Fam21 binding to the retromer protein Vps35."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the retromer-WASH complex interaction occurs through the long unstructured
      'tail' domain of the WASH complex-Fam21 protein binding to Vps35, an
      interaction that is necessary and sufficient to target the WASH complex to
      endosomes
    explanation: >-
      Establishes how the complex is delivered to the endosomal membrane, which
      is what makes its abundance rate-limiting for endosomal actin rather than
      for actin generally.
  - reference: PMID:30061306
    reference_title: "Expression of N471D strumpellin leads to defects in the endolysosomal system."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Real-time PCR analyses revealed no transcriptional changes in WASH complex
      subunits in Str- cells, but western blots showed a twofold decrease in the
      SWIP subunit.
    explanation: >-
      An independent demonstration, in a second organism, that losing
      strumpellin lowers another WASH subunit at protein level without changing
      its transcription. It replicates the post-transcriptional
      complex-destabilisation mechanism in Dictyostelium rather than mouse, so
      it supports this node across species rather than in an RSS1 context.

- name: Impaired Endosomal Branched Actin Nucleation
  description: >-
    With less WASH complex on the endosome, Arp2/3-dependent branched actin
    networks fail to form at the required density on the endosomal surface.
    These actin patches provide the force and the membrane subdomain
    organisation needed for tubule formation and scission.
  biological_scale: CELLULAR
  downstream:
  - target: Defective Endosomal Tubule Fission and Cargo Retrieval
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20714399
      reference_title: "Evolutionary conservation of the WASH complex, an actin polymerization machine involved in endosomal fission."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This activity of WASH favors, in collaboration with dynamin, the fission
        of transport intermediates from endosomes, and hence regulates
        endosomal trafficking of several cargos.
      explanation: >-
        Directly asserts that the branched actin generated by WASH is what
        drives fission of transport carriers, which is the causal step from
        impaired actin nucleation to failed cargo retrieval.
  biological_processes:
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
    modifier: DECREASED
  evidence:
  - reference: PMID:31911435
    reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      We uncovered a decrease in CAV1 protein abundance as well as endosomal
      fission defects resulting from pathogenic SPG8 mutations.
    explanation: >-
      Measured for SPG8 alleles, which are heterozygous missense variants in the
      same gene causing a different, dominantly inherited disease rather than
      RSS1. It supports this node by inference: any strumpellin variant that
      produces endosomal fission defects shows the actin-dependent endosomal
      step depends on strumpellin dose or integrity. It is not a measurement in
      an RSS1 genotype.

- name: Defective Endosomal Tubule Fission and Cargo Retrieval
  description: >-
    Integral membrane cargo that should be captured into recycling tubules and
    returned to the surface is instead retained in the endosome and delivered to
    the lysosome for degradation. The WASH complex protects cargo from that
    default degradative fate through its endosomal actin activity.
  biological_scale: CELLULAR
  downstream:
  - target: Reduced Cell-Surface Cargo Receptor Density
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31911435
      reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we demonstrated that the WASH complex maintained CAV1 and integrin
        protein amounts by inhibiting their lysosomal degradation through its
        endosomal actin nucleation activity
      explanation: >-
        States the causal mechanism by which failed retrieval lowers the
        available pool of specific surface cargo proteins.
  biological_processes:
  - preferred_term: endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: DECREASED
  - preferred_term: endosome organization
    term:
      id: GO:0007032
      label: endosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:23085491
    reference_title: "The hereditary spastic paraplegia protein strumpellin: characterisation in neurons and of the effect of disease mutations on WASH complex assembly and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that strumpellin is not required for normal transferrin receptor
      traffic, but is required for the correct subcellular distribution of the
      β-2-adrenergic receptor.
    explanation: >-
      Demonstrates that strumpellin loss selectively disturbs the trafficking of
      particular cargo rather than bulk recycling: transferrin receptor traffic
      is unaffected while the beta-2-adrenergic receptor is mislocalised. The
      measurement was made in the context of SPG8, so it supports cargo
      selectivity as a property of strumpellin loss, not the tissue distribution
      of RSS1.

- name: Reduced Cell-Surface Cargo Receptor Density
  description: >-
    The steady-state surface pool of WASH-dependent cargo, including caveolin-1
    and integrins, falls. Because these cargoes mediate cell adhesion,
    migration, and developmental signalling, their depletion is the point at
    which a housekeeping trafficking defect becomes a developmental one.
  biological_scale: CELLULAR
  downstream:
  - target: Impaired Integrin-Mediated Cell Adhesion
    causal_link_type: DIRECT
    description: >-
      Loss of strumpellin lowers the surface pool of integrin, which is the
      adhesion receptor itself, so the adhesion defect follows directly from the
      recycling defect.
    evidence:
    - reference: PMID:37308549
      reference_title: "The WASH-complex subunit Strumpellin regulates integrin αIIbβ3 trafficking in murine platelets."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that Strumpellin-deficient murine platelets display an
        approximately 20% reduction in integrin alphaIIbbeta3 surface
        expression.
      explanation: >-
        Quantifies the loss of surface integrin caused by strumpellin deficiency
        in a primary cell type from an animal, which is the causal step from
        failed recycling to reduced adhesion receptor availability. This is the
        only in vivo cargo-trafficking measurement in the literature made
        against strumpellin loss rather than against an SPG8 allele, so it
        carries the edge without the SPG8 inference step the other evidence
        needs.
  - target: Reduced Neuronal Dendritic Arborisation and Synaptogenesis
    causal_link_type: DIRECT
  - target: LDL Receptor Mislocalisation and Degradation
    causal_link_type: DIRECT
  - target: Impaired Lysosomal Enzyme Delivery
    causal_link_type: DIRECT
  - target: Multisystem Developmental Malformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  biological_processes:
  - preferred_term: receptor recycling
    term:
      id: GO:0001881
      label: receptor recycling
    modifier: DECREASED
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:31911435
    reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, the interaction of strumpellin with CAV1 stimulated integrin
      recycling, thereby promoting cell adhesion.
    explanation: >-
      Identifies the specific cargo whose surface recycling depends on
      strumpellin and the adhesive function that depends on it.

- name: Impaired Integrin-Mediated Cell Adhesion
  description: >-
    Loss of surface integrin and caveolin-1 impairs integrin-mediated adhesion.
    Adhesion is the general-cell consequence of the recycling defect and is the
    plausible substrate for the morphogenetic failures, since cardiac septation
    and neural crest migration both depend on adhesive cell behaviour.
  biological_scale: CELLULAR
  downstream:
  - target: Multisystem Developmental Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  biological_processes:
  - preferred_term: cell adhesion mediated by integrin
    term:
      id: GO:0033627
      label: cell adhesion mediated by integrin
    modifier: DECREASED
  evidence:
  - reference: PMID:37308549
    reference_title: "The WASH-complex subunit Strumpellin regulates integrin αIIbβ3 trafficking in murine platelets."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While exposure of the internal alphaIIbbeta3 pool after platelet
      activation was unaffected, the uptake of the alphaIIbbeta3 ligand
      fibrinogen was delayed.
    explanation: >-
      Shows the functional consequence is specifically in ligand engagement
      rather than in the internal receptor store, which localises the defect to
      the surface-delivery step this node describes.
  - reference: PMID:31911435
    reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      SPG8-associated missense mutations in strumpellin did not rescue endosomal
      tubulation defects, reduction in CAV1 protein abundance, or
      integrin-mediated cell adhesion in strumpellin-deficient cells.
    explanation: >-
      Tested with SPG8 missense alleles, not RSS1 alleles, so it bears on this
      node only by inference from the shared gene. Note that the rescue result
      is contested: two other groups report that SPG8 variants behave like
      wild-type in WASH complex assays, so this item is curated alongside the
      REFUTE item below rather than as a settled finding.
  - reference: PMID:37392480
    reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Compared with the wild-type, strumpellin mutants N471D or V626F identified
      in patients with SPG8 exhibited no differences in rescuing the defects.
    explanation: >-
      Directly contradicts the non-rescue result quoted immediately above: here
      the same class of SPG8 missense alleles rescued as well as wild-type
      protein. Both are recorded because the literature does not resolve them,
      and because the disagreement is itself the reason SPG8 findings cannot be
      carried across to RSS1 without qualification. Neither result was obtained
      in an RSS1 genotype.

- name: Reduced Neuronal Dendritic Arborisation and Synaptogenesis
  description: >-
    Strumpellin depletion in cortical neurons reduces dendritic arborisation and
    synapse formation with loss of dendritic F-actin clusters, and produces a
    motor coordination deficit in vivo. This is the cellular substrate of the
    gait and neurodevelopmental phenotypes, and is a separate consequence of the
    recycling defect from the adhesion node above.
  biological_scale: CELLULAR
  downstream:
  - target: Gait ataxia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: dendrite development
    term:
      id: GO:0016358
      label: dendrite development
    modifier: DECREASED
  - preferred_term: synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:37392480
    reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Strumpellin knockdown using shRNA attenuated dendritic arborization and
      synapse formation in cultured cortical neurons, and this effect was
      rescued by wild-type strumpellin expression.
    explanation: >-
      Rescue by wild-type strumpellin establishes that the dendritic and
      synaptic deficit is caused by strumpellin loss specifically.
  - reference: PMID:37392480
    reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Administration of a lentivirus containing a strumpellin-targeting short
      hairpin RNA (shRNA) to cortical motor neurons lead to abnormal motor
      coordination in mice.
    explanation: >-
      Shows the cellular deficit has a whole-animal motor consequence, which is
      what connects this node to the gait phenotype.

- name: LDL Receptor Mislocalisation and Degradation
  description: >-
    One named cargo arm of the recycling defect. Without WASH-dependent
    retrieval the LDL receptor is mislocalised and routed to the lysosome
    instead of back to the hepatocyte surface, lowering LDL uptake and raising
    circulating cholesterol. This is the mechanism behind the
    hypercholesterolaemia recorded as a phenotype of the syndrome, and it is
    the one cargo whose loss has a directly measurable clinical readout.

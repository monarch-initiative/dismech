animal_models:
- name: Washc5 constitutive knockout mouse
  species: Mouse
  genotype: E430025E21Rik (Washc5) deletion-based knockout, homozygous and heterozygous
  description: >-
    A deletion-based null allele of the murine WASHC5 orthologue. Homozygous
    null embryos die early, which is why this model does not recapitulate a
    viable RSS1 phenotype and instead bounds the tolerable degree of strumpellin
    loss.
  publication: PMID:26572744
  evidence:
  - reference: PMID:26572744
    reference_title: "The spectrum of KIAA0196 variants, and characterization of a murine knockout: implications for the mutational mechanism in hereditary spastic paraplegia type SPG8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated a deletion-based knockout allele for E430025E21Rik, i.e. the
      murine homologue of KIAA0196.
    explanation: >-
      Documents the construction of the model and identifies the targeted gene
      as the murine orthologue of the human disease gene.
  modeled_mechanisms:
  - target: WASHC5 Hypomorphic Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete ablation of the orthologue is not a model of the hypomorphic
      human genotype; it is lethal before the malformations of interest can
      form.
    limitations: >-
      The knockout is a null allele, whereas RSS1 alleles are hypomorphic and
      retain roughly 40% of strumpellin. Homozygous embryonic lethality means no
      craniofacial, cerebellar, or cardiac phenotype can be scored, and
      heterozygotes showed no relevant phenotype. The study was designed to
      probe the dominant SPG8 mechanism rather than recessive RSS1, so its
      negative findings bear on RSS1 only through the dose-response
      relationship. A knock-in of a patient hypomorphic allele would be required.
    evidence:
    - reference: PMID:26572744
      reference_title: "The spectrum of KIAA0196 variants, and characterization of a murine knockout: implications for the mutational mechanism in hereditary spastic paraplegia type SPG8."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We did, however, neither observe HSP-related in vivo and ex vivo
        phenotypes, nor alterations affecting endosomal, lysosomal, or
        autophagic compartments.
      explanation: >-
        The surviving heterozygous animals showed no trafficking or neurological
        phenotype, so the model does not reproduce the human disease mechanism
        at either dose.

- name: N471D Washc5 knock-in mouse
  species: Mouse
  genotype: Washc5 N471D knock-in, heterozygous and homozygous
  description: >-
    The only viable engineered Washc5 allele. Homozygotes survive and show mild
    dilated cardiomyopathy, decreased acoustic startle reactivity, thinner eye
    lenses, altered clinical chemistry and haematology, and gait instability.
    N471D is an SPG8 allele, not an RSS1 allele, and the model reproduces
    neither disease cleanly.
  publication: PMID:34312900
  evidence:
  - reference: PMID:34312900
    reference_title: "N471D WASH complex subunit strumpellin knock-in mice display mild motor and cardiac abnormalities and BPTF and KLHL11 dysregulation in brain tissue."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated heterozygous and homozygous N471D Washc5 knock-in mice and
      subjected them to a comprehensive clinical, morphological and laboratory
      parameter screen, and gait analyses.
    explanation: >-
      Documents the construction and the breadth of phenotyping, which is what
      makes the model's negative result for the RSS1 triad informative rather
      than merely unexamined.
  modeled_mechanisms:
  - target: WASHC5 Hypomorphic Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A viable Washc5 point mutant that nonetheless does not model the RSS1
      lesion, because the allele is the dominant SPG8 one and complex abundance
      is unchanged.
    limitations: >-
      N471D causes dominant SPG8, not recessive RSS1, and the study reports it
      does not produce a typical SPG8 phenotype either. Mechanistically it is
      the wrong lesion for this entry: WASHC5-related interaction partners and
      complexes showed unchanged abundance in these animals, whereas RSS1 acts
      through reduced strumpellin and therefore reduced WASH complex abundance.
      The cardiac and ocular findings are suggestive but were not characterised
      as the RSS1 malformations, and no cerebellar or craniofacial malformation
      was reported. A knock-in of a patient RSS1 hypomorphic allele is what the
      question needs.
    evidence:
    - reference: PMID:34312900
      reference_title: "N471D WASH complex subunit strumpellin knock-in mice display mild motor and cardiac abnormalities and BPTF and KLHL11 dysregulation in brain tissue."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        WASHC5-related protein interaction partners and complexes showed no
        change in abundancies.
      explanation: >-
        Complex abundance is unchanged in this model, which is precisely the
        variable RSS1 acts through, so the model cannot inform the RSS1
        mechanism even where its organ findings overlap.
    readouts:
    - name: Left ventricular function
      target: WASHC5 Hypomorphic Loss of Function
      direction: ALTERED
      interpretation: >-
        Mild dilated cardiomyopathy in homozygotes. Recorded because cardiac
        involvement is part of the human triad, but this is an SPG8 allele and
        the lesion is not the RSS1 septation defect.
      evidence:
      - reference: PMID:34312900
        reference_title: "N471D WASH complex subunit strumpellin knock-in mice display mild motor and cardiac abnormalities and BPTF and KLHL11 dysregulation in brain tissue."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Homozygous N471D Washc5 knock-in mice showed mild dilated
          cardiomyopathy, decreased acoustic startle reactivity, thinner eye
          lenses, increased alkaline phosphatase and potassium levels and
          increased white blood cell counts.
        explanation: >-
          Reports the multi-organ findings in the homozygous knock-in.

- name: Strumpellin shRNA knockdown cortical neuron model
  species: Mouse
  genotype: Lentiviral strumpellin-targeting shRNA in cortical motor neurons
  description: >-
    Acute knockdown of strumpellin in cortical motor neurons, producing a motor
    coordination deficit in vivo with reduced dendritic arborisation, synapse
    formation, and dendritic F-actin in culture.
  publication: PMID:37392480
  evidence:
  - reference: PMID:37392480
    reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we examined the role of strumpellin in the regulation of
      structural plasticity of cortical neurons involved in gait coordination.
    explanation: >-
      Establishes what the model was built to interrogate, which is the basis
      for treating it as informative about strumpellin loss in neurons.
  modeled_mechanisms:
  - target: Reduced Neuronal Dendritic Arborisation and Synaptogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cellular consequence of reduced strumpellin dose in
      neurons, with rescue by wild-type protein establishing specificity.
    limitations: >-
      Acute postnatal knockdown in a targeted neuronal population is not the
      constitutive biallelic hypomorphism of RSS1, and the readouts are gait
      coordination and dendritic morphology rather than the cerebellar, cardiac,
      or craniofacial malformations that define the syndrome. The study frames
      the model around SPG8 rather than RSS1.
    readouts:
    - name: Dendritic arborisation and synapse number in cultured cortical neurons
      target: Reduced Neuronal Dendritic Arborisation and Synaptogenesis
      direction: DECREASED
      interpretation: >-
        Structural correlate of reduced WASH-dependent actin activity in
        neurons.
      evidence:
      - reference: PMID:37392480
        reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Strumpellin knockdown using shRNA attenuated dendritic arborization
          and synapse formation in cultured cortical neurons
        explanation: >-
          Reports the measurement and its direction.
    - name: Dendritic F-actin cluster number
      target: Reduced Neuronal Dendritic Arborisation and Synaptogenesis
      direction: DECREASED
      interpretation: >-
        Direct readout of the actin-polymerisation defect predicted by loss of
        the WASH complex.
      evidence:
      - reference: PMID:37392480
        reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the number of F-actin clusters in neuronal dendrites was decreased by
          strumpellin knockdown and rescued by strumpellin expression
        explanation: >-
          Quantifies the actin phenotype and demonstrates rescue by wild-type
          strumpellin.
    evidence:
    - reference: PMID:37392480
      reference_title: "Strumpellin/WASHC5 regulates the structural plasticity of cortical neurons involved in gait coordination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Administration of a lentivirus containing a strumpellin-targeting short
        hairpin RNA (shRNA) to cortical motor neurons lead to abnormal motor
        coordination in mice.
      explanation: >-
        Establishes that reducing strumpellin in neurons produces a motor
        phenotype in vivo, which is what makes the model informative for the
        neuronal node.

discussions:
- discussion_id: rss1_no_viable_washc5_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    A viable Washc5 knock-in mouse exists, but it carries N471D, an allele that
    causes dominant SPG8 rather than recessive RSS1, and it does not reproduce
    the RSS1 triad. Would a knock-in of an RSS1 hypomorphic allele, at the
    roughly 40% strumpellin dose seen in patients, develop the cerebellar,
    cardiac, and craniofacial malformations?
  attaches_to:
  - pathophysiology#WASHC5 Hypomorphic Loss of Function
  - animal_models#Washc5 constitutive knockout mouse
  - animal_models#N471D Washc5 knock-in mouse
  rationale: >-
    Two Washc5 alleles have been engineered in mouse and neither is an RSS1
    allele, so the mismatch is about which allele was modelled rather than about
    an absence of models. The knockout is a clean deletion: homozygotes die
    before organogenesis can be scored and heterozygotes sit above the disease
    threshold with no phenotype, so neither dose is the disease. The N471D
    knock-in is viable as a homozygote and does produce mild multi-organ
    findings, including dilated cardiomyopathy, thinner eye lenses and gait
    instability, but N471D is the dominant SPG8 allele and the authors report it
    does not give a typical SPG8 phenotype either. It is also mechanistically
    the wrong kind of lesion: the same study found WASHC5 interaction partners
    and complexes at unchanged abundance in these animals, whereas RSS1 acts
    through reduced strumpellin and hence reduced WASH complex abundance.
    So no published model occupies the RSS1 window, and every in vivo statement
    about RSS1 organogenesis still rests on inference from human imaging and
    from cellular work in non-developmental systems. The tissue-selectivity
    question below cannot be addressed experimentally until that changes.
  evidence:
  - reference: PMID:34312900
    reference_title: "N471D WASH complex subunit strumpellin knock-in mice display mild motor and cardiac abnormalities and BPTF and KLHL11 dysregulation in brain tissue."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While biallelic ablation of Washc5 was prenatally lethal, expression of
      N471D mutated WASHC5 led to several mild clinical and laboratory parameter
      abnormalities, but not to a typical SPG8 phenotype.
    explanation: >-
      Establishes that the one viable engineered allele is N471D and that it
      fails to reproduce even the disease it was built for, which is what makes
      the absence of an RSS1-allele model the operative gap.
  proposed_experiments:
  - experiment_id: rss1_hypomorphic_knockin
    name: Patient-allele Washc5 hypomorphic knock-in mouse
    description: >-
      Introduce the founder splice-site allele, or an equivalent allele titrated
      to leave roughly 40% strumpellin, into the mouse germline and
      phenotype homozygotes for posterior fossa, cardiac septal, and
      craniofacial development, with strumpellin quantified by western blot to
      confirm the intended dose.
    readouts:
    - name: Cerebellar vermis and posterior fossa morphology
      target: phenotypes#Cerebellar vermis hypoplasia
      direction: DECREASED
      interpretation: >-
        Vermian hypoplasia in a viable hypomorph would establish that partial
        strumpellin loss is sufficient for the cerebellar malformation.
    - name: Cardiac septation
      target: phenotypes#Congenital heart defect
      direction: ALTERED
      interpretation: >-
        Septal defects in the same animals would tie the cardiac arm of the
        triad to the same dose.
    would_support:
    - pathophysiology#WASHC5 Hypomorphic Loss of Function
    supporting_outcome:
    - >-
      Homozygous hypomorphs survive to term with vermian hypoplasia and septal
      defects, at a strumpellin level comparable to the patient cohort.
    would_refute:
    - pathophysiology#WASHC5 Hypomorphic Loss of Function
    refuting_outcome:
    - >-
      Homozygous hypomorphs are either normal or embryonic-lethal at every dose
      that can be engineered, which would mean the human phenotype depends on
      something other than strumpellin dose alone.

- discussion_id: rss1_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Strumpellin is ubiquitously expressed and the WASH complex serves endosomal
    recycling in every cell, so why do the malformations concentrate in the
    cerebellum, the cardiac septa, and the craniofacial skeleton rather than
    appearing as a uniform multi-organ defect?
  attaches_to:
  - pathophysiology#Multisystem Developmental Malformation
  - pathophysiology#Reduced Cell-Surface Cargo Receptor Density
  rationale: >-
    Two observations make this sharper than the usual tissue-selectivity
    question. Strumpellin loss does not disturb bulk recycling: transferrin
    receptor traffic is normal while the beta-2-adrenergic receptor is
    mislocalised, so the defect is already cargo-selective at the cell level.
    And in the Commander-related forms of the syndrome, cell-surface proteomics
    showed that the reduction in surface cargo is itself tissue-specific. Which
    WASH-dependent cargoes are rate-limiting in cerebellar, cardiac, and neural
    crest development is unknown, and answering it would explain why one
    housekeeping defect produces this particular triad.
  evidence:
  - reference: PMID:40601774
    reference_title: "Ritscher-Schinzel syndrome can be characterized as an endosomal recyclinopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      through cell surface proteomics, that this reduces tissue-specific
      presentation of cell surface integral membrane proteins essential for
      kidney, bone, and brain development
    explanation: >-
      Establishes that the surface-cargo deficit is tissue-specific in
      Ritscher-Schinzel syndrome, which is what frames the gap. The measurement
      was made on Commander subunits rather than on WASHC5, so it bears on the
      RSS1 node by inference from the shared recycling pathway.


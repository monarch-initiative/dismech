- name: Impaired Lysosomal Enzyme Delivery
  description: >-
    A second cargo arm. Failure of endosomal tubule fission also disrupts
    sorting of the mannose 6-phosphate receptor, which is what delivers acid
    hydrolases to the lysosome, so lysosomal enzyme trafficking and lysosomal
    morphology are both disturbed. The M6PR mis-sorting step itself was
    measured for loss of spastin and IST1, the proteins that drive fission at
    ER-endosome contacts; strumpellin-deficient cells were shown to share the
    downstream lysosomal abnormalities rather than to be the system in which
    the receptor defect was demonstrated. This arm has no established clinical
    correlate in RSS1 and is curated as a mechanistic consequence rather than
    as an explanation for any listed phenotype.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endosome organization
    term:
      id: GO:0007032
      label: endosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:28389476
    reference_title: "Defects in ER-endosome contacts impact lysosome function in hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      similar lysosomal abnormalities were seen in cellular models lacking the
      WASH complex component strumpellin or the ER morphogen REEP1
    explanation: >-
      Reports the lysosomal consequence for strumpellin-deficient cells
      specifically. Note the quote establishes that those cells share the
      lysosomal abnormality, not that M6PR sorting was measured in them: the
      receptor step was demonstrated for spastin and IST1 loss in the same
      paper. The study also frames the finding around hereditary spastic
      paraplegia and axonopathy rather than RSS1, so it supports this node
      through the shared molecular lesion rather than by measurement in an RSS1
      context.

- name: Multisystem Developmental Malformation

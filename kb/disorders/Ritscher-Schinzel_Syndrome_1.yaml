name: Ritscher-Schinzel Syndrome 1
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Ritscher-Schinzel syndrome 1 (RSS1, RTSCS1) is the autosomal recessive,
  WASHC5-related form of Ritscher-Schinzel (3C, cranio-cerebello-cardiac)
  syndrome and was the first molecularly defined cause of the condition. It is
  characterised by the 3C triad of distinctive craniofacial dysmorphism,
  cerebellar malformation (Dandy-Walker malformation and cerebellar vermis
  hypoplasia), and congenital cardiovascular malformation, together with
  developmental delay, intellectual disability, and ataxic gait. WASHC5 encodes
  strumpellin, a core subunit of the pentameric WASH regulatory complex (SHRC),
  which activates Arp2/3-mediated branched actin polymerisation on the
  endosomal membrane and thereby drives the tubulation and fission events that
  retrieve integral membrane cargo away from lysosomal degradation and return it
  to the cell surface. RSS1 therefore sits mechanistically alongside the
  Commander/CCC-related forms (RSS2/RSS3) as a disorder of endosomal
  retrieval-and-recycling, but acts through the actin-generating WASH complex
  rather than through the SNX17-dependent Commander cargo-selection machinery.
  Disease alleles are hypomorphic rather than null: complete loss of the murine
  orthologue is embryonic lethal, and the recurrent First Nations splice variant
  leaves roughly 40% of residual strumpellin. WASHC5 is allelic with autosomal
  dominant hereditary spastic paraplegia type SPG8.

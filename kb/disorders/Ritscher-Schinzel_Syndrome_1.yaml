genetic:
- name: WASHC5
  notes: >-
    WASHC5 (formerly KIAA0196) at 8q24.13 encodes strumpellin, a core subunit of
    the pentameric WASH regulatory complex. Biallelic hypomorphic variants cause
    RSS1. The gene is allelic with autosomal dominant hereditary spastic
    paraplegia type SPG8, where heterozygous missense variants act through a
    different mechanism.
  gene_term:
    preferred_term: WASHC5
    term:
      id: hgnc:28984
      label: WASHC5
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:24065355
    reference_title: "A novel mutation in KIAA0196: identification of a gene involved in Ritscher-Schinzel/3C syndrome in a First Nations cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a mutation in KIAA0196 as the cause of the form of RSS
      characterised in our cohort.
    explanation: >-
      Establishes WASHC5/KIAA0196 as the causal gene for this form of
      Ritscher-Schinzel syndrome.
  - reference: PMID:36130690
    reference_title: "Expanding the pre- and postnatal phenotype of WASHC5 and CCDC22 -related Ritscher-Schinzel syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first two genes described were the autosomal recessive inherited gene
      WASHC5 associated with Ritscher-Schinzel syndrome 1 (RTSCS1), and CCDC22,
      an X-linked recessive gene causing Ritscher-Schinzel syndrome 2 (RTSCS2).
    explanation: >-
      States explicitly that WASHC5 is the gene of Ritscher-Schinzel syndrome 1,
      which is the entity this entry describes.


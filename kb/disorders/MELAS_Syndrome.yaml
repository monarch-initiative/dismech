    explanation: Registration record establishing the cognitive primary endpoint of the randomized sonlicromanol crossover trial in m.3243A>G carriers.
- name: NCT06451757
  phase: PHASE_III
  status: RECRUITING
  description: >-
    KHENERFIN: randomized, double-blind, placebo-controlled pivotal trial of
    sonlicromanol over 52 weeks in adults with a genetically confirmed
    m.3243A>G variant, with fatigue and physical function as primary outcomes.
    Enrolls by genotype rather than by MELAS syndrome label.
  evidence:
  - reference: clinicaltrials:NCT06451757
    reference_title: "A Phase III, Randomised, Double-blind, Placebo-controlled, Parallel-group, Pivotal Trial to Assess the Efficacy and Safety of Sonlicromanol in Adult Subjects With a Genetically Confirmed Mitochondrial DNA tRNALeu(UUR) m.3243A>G Variant"
    supports: SUPPORT

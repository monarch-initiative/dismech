- category: Ophthalmologic
  name: Mitochondrial retinal dystrophy
  description: >-
    Retinal dystrophy is an ocular source of visual loss distinct from cortical
    visual impairment. In a 29-person m.3243A>G carrier cohort, four grades
    ranged from fine pigment changes visible on autofluorescence, through macular
    pigment deposits, to extrafoveal chorioretinal atrophy and finally foveal
    atrophy with marked visual-acuity loss. Retinal abnormalities affected 25
    carriers; this is not a MELAS-specific prevalence estimate. Grade correlated
    with age and visual acuity, without an observed correlation with heteroplasmy
    or overall disease involvement. Variable or absent systemic features can
    obscure recognition of the mitochondrial retinal disorder.
  phenotype_term:
    preferred_term: Mitochondrial retinal dystrophy (pigmentary macular pattern dystrophy)
    term:
      id: HP:0000556
      label: Retinal dystrophy
  context: m.3243A>G carriers, including those without a full MELAS phenotype
  evidence:
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five of the 29 mutation carriers (86%) had retinal abnormalities that could be classified into 4 grades."
    explanation: Quantifies retinal involvement in a systematically examined m.3243A>G carrier cohort.
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The grade of mitochondrial retinal dystrophy correlated significantly with both age (r = -0.483, P = 0.008) and visual acuity (r = -0.614, P < 0.001), whereas no correlation was observed with heteroplasmy level or overall disease involvement."
    explanation: Shows retinal severity is uncoupled from heteroplasmy and from systemic disease burden.
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients (21%) had grade 1 retinal dystrophy with fine pigment
      abnormalities that were clearly visible with FAF and fluorescein angiography.
      Eleven patients (38%) had grade 2 abnormalities that were characterized by
      yellowish or mildly pigmented deposits in the early stage; in advanced grade
      2, these pigment changes encompassed the entire macula and often encircled
      the optic disc. Six patients (21%) had grade 3 disease in which profound
      chorioretinal atrophy was present outside the fovea. Two patients (7%) with
      retinal abnormalities had grade 4 disease, in which the fovea was affected by
      atrophy, with marked loss of visual acuity.
    explanation: >-
      Defines the four anatomical grades in the carrier cohort, without
      transferring its frequency to clinically defined MELAS.
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.

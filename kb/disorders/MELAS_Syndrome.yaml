      label: maternally-inherited diabetes and deafness
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      MIDD is the other major clinical syndrome produced by m.3243A>G, and the
      two are repeatedly contrasted in this entry - MIDD accounts for roughly

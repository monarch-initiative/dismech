      snippet: These mutations impair mitochondrial oxidative phosphorylation, leading to systemic manifestations, including stroke-like episodes, lactic acidosis, seizures, muscle weakness, and progressive neurodegeneration [3].
      explanation: The MELAS review links oxidative phosphorylation failure to muscle weakness.
  - target: Mitochondrial myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Energy failure in skeletal muscle contributes to mitochondrial myopathy.
    evidence:
    - reference: PMID:26095523

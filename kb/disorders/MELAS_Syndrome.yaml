mechanistic_hypotheses:
- hypothesis_group_id: canonical_wobble_translation_failure
  hypothesis_label: Canonical wobble-modification and mitochondrial translation-failure model
  status: CANONICAL
  description: >-
    The molecular half of MELAS pathogenesis is not in dispute. Pathogenic
    MT-TL1 variants strip the taurine-containing modification from the wobble
    uridine of tRNA-Leu(UUR), degrading codon-anticodon pairing (UUG more than
    UUA) and impairing synthesis of the mtDNA-encoded respiratory-chain
    subunits. Complex I is the most affected, and clinical expression requires
    mutant heteroplasmy above a tissue threshold. Everything downstream of the
    resulting energy failure - specifically, how it produces a discrete
    stroke-like episode - is where the competing accounts below begin.
  evidence:
  - reference: PMID:16181098
    reference_title: "Pathogenesis of stroke-like episodes in MELAS: analysis of neurovascular cellular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Crucial molecular mechanism includes the lack of taurine modification at the wobble uridine of mutant transfer RNAsLeu(UUR) resulting in defective translation of cognate codons due to a defect in codon-anticodon interaction."
    explanation: States the molecular mechanism that both competing stroke-like-episode hypotheses take as their shared starting point.
  - reference: PMID:37988592
    reference_title: Penetrance and expressivity of mitochondrial variants in a large clinically unselected population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multi-system disease risk and penetrance of diabetes, deafness and heart failure greatly increased with m.3243A>G level ≥ 10%."
    explanation: Population-scale support for the heteroplasmy-threshold component of the canonical model.
- hypothesis_group_id: ischemic_vascular_angiopathy
  hypothesis_label: Ischemic vascular ("mitochondrial angiopathy") model of stroke-like episodes
  status: ALTERNATIVE
  description: >-
    The older account holds that stroke-like episodes are ischemic events
    caused by mitochondrial angiopathy: proliferation of mitochondria in the
    smooth muscle and endothelium of cerebral small vessels, compounded by
    reduced nitric oxide availability, impairs microvascular perfusion. The
    model is what motivates L-arginine and L-citrulline therapy and the newer
    soluble guanylate cyclase stimulators, and the muscle-biopsy finding of
    strongly SDH-reactive vessels is real. Its difficulty is that acute lesions
    show focal hyperperfusion and elevated apparent diffusion coefficient
    rather than the hypoperfusion and restricted diffusion of ischemia, and
    they cross vascular territories.
  evidence:
  - reference: PMID:16181098
    reference_title: "Pathogenesis of stroke-like episodes in MELAS: analysis of neurovascular cellular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of stroke-like episodes in mitochondrial encephalopathy, myopathy, lactic acidosis and stroke-like episodes (MELAS) is not fully understood although two main theories have been proposed; ischemic vascular hypothesis caused by \"mitochondrial angiopathy\" and generalized cytopathic hypothesis caused by \"mitochondrial cytopathy\"."
    explanation: Names the ischemic vascular hypothesis as one of the two standing accounts and records that neither is settled.
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Energy deficiency can also stimulate mitochondrial proliferation in the smooth muscle and endothelial cells of small blood vessels leading to angiopathy and impaired blood perfusion in the microvasculature of several organs."
    explanation: States the angiopathy mechanism on which the vascular model rests.
  - reference: PMID:12297560
    reference_title: Neuronal hyperexcitability in stroke-like episodes of MELAS syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In seven of nine episodes focal cortical hyperperfusion was seen in SPECT studies."
    explanation: Focal hyperperfusion over the acute lesion is the opposite of what a primarily ischemic mechanism predicts.
- hypothesis_group_id: neuronal_hyperexcitability
  hypothesis_label: Non-ischemic neuronal-hyperexcitability model of stroke-like episodes
  status: EMERGING
  description: >-
    The competing account treats the stroke-like episode as a non-ischemic
    neurovascular event. Focal neuronal hyperexcitability develops where energy
    supply cannot meet demand; the resulting epileptic activity depolarizes
    adjacent neurons and propagates the lesion into contiguous cortex, while
    increased capillary permeability - on a background of mitochondrial
    angiopathy - produces the characteristic cortical vasogenic edema and,
    ultimately, laminar necrosis. It accounts for the EEG discharges,
    hyperperfusion, elevated ADC, contiguous spread, and posterior predilection
    that the vascular model does not, and it implies that aggressive seizure
    control, rather than vasodilation, is the therapeutic priority. Note that
    the two models are not mutually exclusive: this one still requires the
    capillary angiopathy of the vascular model as its substrate.
  evidence:
  - reference: PMID:16181098
    reference_title: "Pathogenesis of stroke-like episodes in MELAS: analysis of neurovascular cellular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the clinical observations, we speculate that stroke-like episodes appear to be non-ischemic neurovascular events; once neuronal hyperexcitability developed in a localized brain region as a result from either mitochondrial dysfunction in the capillary endothelial cells, or in neurons or astrocytes, epileptic activities may depolarize the adjacent neurons leading to propagation of epileptic activities in the surrounding cortex."
    explanation: The primary statement of the non-ischemic neurovascular model, including its initiating step and propagation mechanism.
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of stroke-like episodes should focus on aggressive seizure management and treatment for concomitant complications such as intestinal pseudo-obstruction."
    explanation: Shows the therapeutic consequence that follows from adopting the hyperexcitability model over the vascular one.
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the precise pathophysiology is still unclear, one possible hypothesis for these episodes is a neuronal hyperexcitability theory, including neuron-astrocyte uncoupling."
    explanation: A recent review presenting hyperexcitability as a leading but still unproven hypothesis, and adding neuron-astrocyte uncoupling as a proposed variant.

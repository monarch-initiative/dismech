    explanation: >-
      GeneReviews lists learning disability among the common manifestations of
      MELAS.
- category: Cardiac
  name: Cardiomyopathy
  description: >-
    Cardiomyopathy and cardiac conduction defects occur in MELAS, reflecting
    energy failure in cardiac tissue.
  phenotype_term:
    preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ptosis, cardiomyopathy, cardiac conduction defects, nephropathy, and
      migraine headache are treated in the standard manner.
    explanation: >-
      GeneReviews documents cardiomyopathy and cardiac conduction defects as
      manifestations of MELAS requiring standard management.
- category: Ophthalmologic
  name: Cortical visual impairment
  description: Visual impairment, including hemianopia or cortical blindness following occipital stroke-like episodes.
  phenotype_term:
    preferred_term: Hemianopia
    term:
      id: HP:0012377
      label: Hemianopia
  evidence:
  - reference: PMID:31693521
    reference_title: Arginine therapy in mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the sudden, transient, and recurrent development of stroke-resembling
      symptoms (headache, nausea/vomiting, visual disturbance/visual field
      abnormalities, seizures, and impaired consciousness: ictus)
    explanation: >-
      Visual field abnormalities (e.g., hemianopia) commonly accompany
      occipital stroke-like episodes in MELAS.
- category: Neurologic
  name: Focal-onset seizures
  description: >-
    Focal seizures are near-universal in MELAS with epilepsy and are the
    dominant semiology, though generalized seizures also occur in about a
    third. There is no MELAS-specific seizure semiology or EEG signature, so
    epilepsy alone never makes the diagnosis; what it does do is mark the
    cortical hyperexcitability that the current mechanistic model puts at the
    start of a stroke-like episode. Earlier seizure onset predicts
    drug-resistant epilepsy and more severe organ involvement.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:27671241
    reference_title: "Epilepsy Characteristics and Clinical Outcome in Patients With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-Like Episodes (MELAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal seizures occurred in 21 of 22 subjects (95.5%), whereas generalized seizures developed in seven of 22 subjects (31.8%)."
    explanation: Quantifies focal versus generalized seizure frequency in a pediatric m.3243A>G MELAS cohort with epilepsy.
  - reference: PMID:27671241
    reference_title: "Epilepsy Characteristics and Clinical Outcome in Patients With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-Like Episodes (MELAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subgroup with earlier seizure onset presented significantly earlier and showed significantly higher rates of drug-resistant epilepsy compared with the late onset group"
    explanation: Establishes earlier seizure onset as a predictor of drug resistance.
- category: Neurologic
  name: Status epilepticus
  description: >-
    Status epilepticus is not merely a complication of MELAS epilepsy but one
    of its two leading proximate causes of death, alongside the acute
    stroke-like episode itself. This is the clinical reason aggressive seizure
    control is treated as the priority during an episode.
  phenotype_term:
    preferred_term: Status epilepticus
    term:
      id: HP:0002133
      label: Status epilepticus
  evidence:
  - reference: PMID:29406897
    reference_title: Survival analysis of a cohort of Chinese patients with mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes (MELAS) based on clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An acute stroke-like episode and/or status epilepticus were the predominant causes of death (42.9%)."
    explanation: Identifies status epilepticus as a leading cause of death in a followed MELAS cohort.
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients died from stroke-like episodes, with status epilepticus being the clinical manifestation prior to death."
    explanation: Independent cohort confirming status epilepticus as the terminal manifestation in most MELAS deaths.
- category: Neurologic
  name: Dementia and progressive cognitive decline
  description: >-
    Cognitive decline in MELAS has two components that should not be
    conflated: stepwise loss following each stroke-like episode, and a slowly
    progressive interictal deterioration in brain function. Together they
    produce dementia in survivors of recurrent episodes.
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  evidence:
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive brain atrophy and dementia are the sequalae of recurrent stroke-like episode, and the underlying genotype in part predicts prognosis."
    explanation: Establishes dementia as the long-term neurological outcome of recurrent stroke-like episodes.
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a multi-system disorder with a wide range of manifestations, characterized by recurrent stroke-like episodes, progressive intellectual decline, and dementia"
    explanation: Lists progressive intellectual decline and dementia among the defining manifestations.
- category: Neurologic
  name: Cerebral atrophy
  description: >-
    Brain atrophy accumulates between as well as during episodes, tracking the
    slowly progressive component of the encephalopathy rather than any single
    lesion.
  phenotype_term:
    preferred_term: Cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(8) brain dysfunction and atrophy are slowly progressive"
    explanation: Documents progressive brain atrophy as a listed feature of the MELAS course.
- category: Ophthalmologic
  name: Cortical (cerebral) visual impairment
  description: >-
    Occipital cortex is the predilection site for stroke-like lesions, so
    visual field loss and cortical blindness are among the most characteristic
    deficits. Cortical blindness is significantly more frequent in the
    adult-onset form than in the juvenile form.
  phenotype_term:
    preferred_term: Cerebral visual impairment
    term:
      id: HP:0100704
      label: Cerebral visual impairment
  evidence:
  - reference: PMID:21443929
    reference_title: "MELAS: a nationwide prospective cohort study of 96 patients in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hearing loss, cortical blindness and diabetes mellitus were significantly more frequent in the adult form"
    explanation: Nationwide cohort data placing cortical blindness in the adult-onset MELAS phenotype.
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal-onset seizures, encephalopathy, and visual disturbances are prominent findings associated with stroke-like episodes, with a predilection for the posterior cerebral cortex."
    explanation: Links the visual deficits to the posterior-cortex predilection of stroke-like lesions.
- category: Ophthalmologic
  name: Mitochondrial retinal dystrophy
  description: >-
    A pigmentary macular dystrophy distinct from the cortical visual loss above
    and easily mistaken for an unrelated retinal disease. It is graded 1-4 from
    fine pigment change visible only on autofluorescence, through macular
    pigment deposits encircling the disc, to chorioretinal atrophy and finally
    foveal involvement with visual-acuity loss. Grade correlates with age and
    visual acuity but not with heteroplasmy level or overall systemic disease
    severity - one of several places where heteroplasmy fails to predict
    organ-level outcome.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Mitochondrial retinal dystrophy (pigmentary macular pattern dystrophy)
    term:
      id: HP:0000556
      label: Retinal dystrophy
  context: m.3243A>G carriers, including those without a full MELAS phenotype
  evidence:
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five of the 29 mutation carriers (86%) had retinal abnormalities that could be classified into 4 grades."
    explanation: Quantifies retinal involvement in a systematically examined m.3243A>G carrier cohort.
  - reference: PMID:23806424
    reference_title: Mitochondrial retinal dystrophy associated with the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The grade of mitochondrial retinal dystrophy correlated significantly with both age (r = -0.483, P = 0.008) and visual acuity (r = -0.614, P < 0.001), whereas no correlation was observed with heteroplasmy level or overall disease involvement."
    explanation: Shows retinal severity is uncoupled from heteroplasmy and from systemic disease burden.
- category: Ophthalmologic
  name: Progressive external ophthalmoplegia
  description: >-
    Ocular myopathy is part of the m.3243A>G spectrum and overlaps MELAS in a
    minority of patients; in the UK cohort PEO appeared both as a MELAS/CPEO
    overlap and as an isolated presentation of the same variant.
  phenotype_term:
    preferred_term: Progressive external ophthalmoplegia
    term:
      id: HP:0000590
      label: Progressive external ophthalmoplegia
  context: m.3243A>G carriers; overlap phenotype rather than a core MELAS feature
  evidence:
  - reference: PMID:23355809
    reference_title: "The UK MRC Mitochondrial Disease Patient Cohort Study: clinical phenotypes associated with the m.3243A>G mutation--implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10% of patients exhibited a classical MELAS phenotype, 30% had MIDD, 6% MELAS/MIDD, 2% MELAS/chronic PEO (CPEO) and 5% MIDD/CPEO overlap syndromes."
    explanation: Quantifies the MELAS/CPEO overlap within the m.3243A>G phenotypic spectrum.
- category: Ophthalmologic
  name: Ptosis
  description: Eyelid ptosis, part of the ocular myopathy of MELAS, managed by standard means.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ptosis, cardiomyopathy, cardiac conduction defects, nephropathy, and migraine headache are treated in the standard manner."
    explanation: GeneReviews lists ptosis among the MELAS manifestations requiring standard management.
- category: Renal
  name: Nephropathy with proteinuria
  description: >-
    Renal involvement is under-recognized in MELAS and typically presents as
    subnephrotic proteinuria with progressive loss of kidney function. Focal
    segmental glomerulosclerosis is the biopsy pattern usually described in
    m.3243A>G kidney disease; because it is indistinguishable on histology from
    idiopathic FSGS, patients risk being given ineffective immunosuppression
    before the mitochondrial cause is recognized.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:38355238
    reference_title: Renal manifestations in adults with mitochondrial disease from the mtDNA m.3243A>G pathogenic variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Not frequently reported, renal involvement in these diseases is probably underestimated, yet it increases morbidity. It generally manifests as subnephrotic proteinuria and progressive deterioration of kidney function."
    explanation: Characterizes the renal phenotype of m.3243A>G disease and notes it is probably under-ascertained.
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ptosis, cardiomyopathy, cardiac conduction defects, nephropathy, and migraine headache are treated in the standard manner."
    explanation: GeneReviews lists nephropathy among the MELAS manifestations requiring standard management.
- category: Gastrointestinal
  name: Intestinal pseudo-obstruction
  description: >-
    Chronic intestinal pseudo-obstruction presents with abdominal distension,
    nausea, vomiting, and pain from failed propulsive activity, mimicking
    mechanical obstruction. It is better known in MNGIE but occurs in MELAS,
    particularly with m.3243A>G, and can be the presenting problem years before
    a neurological diagnosis is made. It is not an incidental comorbidity:
    reviews recommend treating it as part of stroke-like-episode management,
    since the resulting catabolic and nutritional stress can precipitate
    neurological decompensation.
  phenotype_term:
    preferred_term: Intestinal pseudo-obstruction
    term:
      id: HP:0004389
      label: Intestinal pseudo-obstruction
  evidence:
  - reference: PMID:30766507
    reference_title: "Can Intestinal Pseudo-Obstruction Drive Recurrent Stroke-Like Episodes in Late-Onset MELAS Syndrome? A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intestinal pseudo-obstruction (IPO) is most commonly observed in mitochondrial neurogastrointestinal encephalomyopathy (MNGIE), although this symptom can also affect patients with MELAS syndrome (5), particularly those with the m.3243A>G mutation; however, IPO remains an underrecognized condition."
    explanation: Documents intestinal pseudo-obstruction as an under-recognized m.3243A>G MELAS manifestation.
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of stroke-like episodes should focus on aggressive seizure management and treatment for concomitant complications such as intestinal pseudo-obstruction."
    explanation: Places pseudo-obstruction inside stroke-like-episode management rather than treating it as a separate problem.
- category: Cardiac
  name: Hypertrophic cardiomyopathy
  description: >-
    Myocardial disease is the commonest form of cardiac involvement in
    m.3243A>G carriers - considerably more common than arrhythmia or conduction
    disease - and ranges from myocardial thickening and hypertrophic
    cardiomyopathy through fibrosis and noncompaction to systolic dysfunction
    and heart failure. Asymptomatic carriers usually do not develop it.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myocardial abnormalities include myocardial thickening, hypertrophic cardiomyopathy, dilated cardiomyopathy, noncompaction, myocardial fibrosis, systolic dysfunction, heart failure, or arterial hypertension."
    explanation: Enumerates the myocardial phenotypes reported in m.3243A>G carriers.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myocardial abnormalities are much more frequent than arrhythmias or conduction defects."
    explanation: Establishes the relative frequency of myocardial versus electrical cardiac involvement.
- category: Cardiac
  name: Wolff-Parkinson-White syndrome and conduction defects
  description: >-
    Pre-excitation and bundle branch block are the conduction abnormalities
    described in m.3243A>G carriers, alongside supraventricular and ventricular
    arrhythmias and reports of sudden cardiac death. Systematic cardiac
    screening of all carriers, symptomatic or not, is recommended.
  phenotype_term:
    preferred_term: Wolff-Parkinson-White syndrome
    term:
      id: HP:0001716
      label: Wolff-Parkinson-White syndrome
  evidence:
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conduction defects in this group of patients include Wolff-Parkinson-White syndrome and left/right bundle branch block."
    explanation: Names the specific conduction abnormalities reported with m.3243A>G.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arrhythmias reported in m.3243A>G carriers include paroxysmal supraventricular or ventricular arrhythmias, including sinus tachycardia, atrial fibrillation and nonsustained ventricular tachycardia, and sudden cardiac death."
    explanation: Documents the arrhythmia spectrum including sudden cardiac death.
- category: Hematologic
  name: Anemia
  description: >-
    Anemia is common enough in MELAS to act as an independent predictor of
    mortality and correlates inversely with disability scores. It is more
    plausibly a marker of systemic disease severity than an independent cause
    of death, but it is cheap to measure and, unlike heteroplasmy, actually
    tracks outcome.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariate analysis, severe lactate elevation (OR = 7.279, 95% CI 1.102-48.086, p = 0.039) and anemia (OR = 0.137, 95% CI 0.021-0.908, p = 0.039) were identified as independent predictors of mortality."
    explanation: Identifies anemia as an independent mortality predictor in a long-followed MELAS cohort.
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, hemoglobin levels were negatively correlated with MRS scores (r = -0.375, p = 0.015)."
    explanation: Links lower hemoglobin to greater disability on the modified Rankin Scale.
- category: Neurologic
  name: Hemiparesis and aphasia
  description: >-
    The acute focal deficits of a stroke-like episode. Because the lesion
    respects cortical rather than arterial boundaries and tends to be partly
    reversible, the deficit pattern often does not fit a single vascular
    syndrome - which is precisely what should prompt the diagnosis rather than
    an ischemic-stroke pathway.
  phenotype_term:
    preferred_term: Hemiparesis
    term:
      id: HP:0001269
      label: Hemiparesis
  evidence:
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stroke-like episodes in MELAS have the following features: (1) symptoms are neurolocalized according to lesion site; (2) epileptic seizures are often present; (3) lesion distribution is inconsistent with vascular territory"
    explanation: Establishes that focal deficits follow lesion site rather than vascular territory.
histopathology:
- name: Ragged-red fibers on modified Gomori trichrome
  description: >-
    Subsarcolemmal aggregates of proliferating abnormal mitochondria in
    skeletal muscle, the classic morphological signature of a mitochondrial
    myopathy. Present in about three quarters of biopsied MELAS patients, so a
    negative biopsy does not exclude the diagnosis.
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ragged-red fibers (RRF) were observed in 29 patients (74.4%), and SDH strongly reactive blood vessels (SSV) were observed in 28 patients (71.8%)."
    explanation: Quantifies ragged-red fiber yield in a cohort where every patient underwent muscle biopsy.
- name: Strongly SDH-reactive blood vessels with preserved cytochrome c oxidase activity
  description: >-
    Intramuscular arterioles stain darkly for succinate dehydrogenase,
    reflecting the mitochondrial proliferation in vascular smooth muscle that
    gives the "mitochondrial angiopathy" hypothesis its histological footing.
    The discriminating detail is the COX result: SSV in MELAS retain normal
    cytochrome c oxidase activity, whereas the morphologically identical
    vessels in MERRF are COX-negative. The same lesion therefore carries a
    different enzymatic meaning in the two diseases, and SSV alone should not
    be read as a MELAS-specific finding.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:8384773
    reference_title: Cytochrome c oxidase activity is deficient in blood vessels of patients with myoclonus epilepsy with ragged-red fibers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, SSV in muscle biopsies from patients with mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes (MELAS) had normal CCO activity as shown by light and electron microscopy."
    explanation: Establishes the MELAS-versus-MERRF distinction in the enzyme histochemistry of strongly SDH-reactive vessels.
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SDH strongly reactive blood vessels (SSV) were observed in 28 patients (71.8%)"
    explanation: Quantifies SSV yield on muscle biopsy in a MELAS cohort.
- name: Cortical laminar necrosis with intracortical gyral microhemorrhage
  description: >-
    The neuropathological correlate of the stroke-like lesion: neuronal loss in
    a laminar or pseudo-laminar cortical distribution, with petechial gyral
    microhemorrhages confirmed at autopsy and matched in life by subacute
    T1-hyperintense cortical signal.
  evidence:
  - reference: PMID:12297560
    reference_title: Neuronal hyperexcitability in stroke-like episodes of MELAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fat-suppression MRI confirmed intracortical gyral hemorrhage in one episode. Petechial gyral microhemorrhages were also pathologically confirmed in the autopsy of another patient."
    explanation: Pathological confirmation of intracortical microhemorrhage within a stroke-like lesion.
imaging_findings:
- name: Cortical T2/FLAIR hyperintensity crossing vascular territories
  modality: MRI
  description: >-
    The defining imaging finding. Lesions favour posterior (occipital,
    parietal, temporal) cortex, do not conform to an arterial territory, extend
    into contiguous cortex over weeks to months, and are often at least partly
    reversible - a combination no arterial infarct produces.
  diagnostic: true
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the stroke-like episodes neuroimaging shows increased T2-weighted signal areas that do not correspond to the classic vascular distribution (hence the term \"stroke-like\")."
    explanation: The reference statement of the non-vascular-territory imaging pattern.
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(4) lesions are common in the posterior brain regions; (5) lesions continuously develop in adjacent sites over several weeks or months; (6) neurological symptoms and stroke-like lesions tend to be reversible, as presented on magnetic resonance imaging"
    explanation: Adds the posterior predilection, contiguous extension, and reversibility that complete the imaging signature.
- name: Elevated apparent diffusion coefficient within the acute lesion
  modality: MRI
  description: >-
    Acute stroke-like lesions typically show normal-to-elevated ADC, consistent
    with vasogenic rather than cytotoxic edema, and this has been used to
    separate them from ischemic infarcts. The rule is not absolute: diffusion
    restriction is reported within the same lesions, so restricted diffusion
    does not exclude MELAS.
  diagnostic: false
  evidence:
  - reference: PMID:18289816
    reference_title: Serial brain imaging analysis of stroke-like episodes in MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the temporal lobe lesion, the apparent diffusion coefficient (ADC) at 44 days after onset was higher (average: 1.219x10(-3)mm2/s) than that in a normal region (average: 0.796x10(-3)mm2/s)."
    explanation: Quantitative demonstration of elevated ADC within a stroke-like lesion.
  - reference: PMID:23177587
    reference_title: "[Conventional and diffusion-weighted magnetic resonance imaging and proton spectroscopy in MELAS]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Both MRI that were performed during those episodes of stroke-like lesion revealed areas of diffusion restriction, coexisting areas of high ADC."
    explanation: Qualifies the elevated-ADC rule by documenting coexisting restricted diffusion in the same lesions.
- name: Lactate peak on proton MR spectroscopy
  modality: MRI
  description: >-
    A lactate doublet with reduced N-acetylaspartate within the lesion, and
    frequently a lactate peak in normal-appearing brain as well - which makes
    MRS informative even where conventional sequences are unremarkable. The
    lesional peak falls as the lesion resolves.
  diagnostic: true
  evidence:
  - reference: PMID:18289816
    reference_title: Serial brain imaging analysis of stroke-like episodes in MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(1)H-MRS of the left parietal lobe lesion at the same day showed a decrease in N-acetylaspartate/(creatine+phosphocreatine) (NAA/Cr) (0.43) and a peak in lactate. 1H-MRS of the contralateral side at the same day showed NAA/Cr (1.57) and no peak in lactate."
    explanation: Shows the lesional lactate peak with reduced NAA against an unaffected contralateral control.
  - reference: PMID:23177587
    reference_title: "[Conventional and diffusion-weighted magnetic resonance imaging and proton spectroscopy in MELAS]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proton spectroscopy showed the presence of lactate and reduction of N-acetyl aspartate peak in stroke-like lesion and the presence of lactate in apparently spared brain."
    explanation: Documents lactate in normal-appearing brain as well as within the lesion.
- name: Focal cortical hyperperfusion during the acute episode
  modality: SPECT
  description: >-
    Perfusion imaging over an acute stroke-like lesion shows focal
    hyperperfusion, not the hypoperfusion an ischemic mechanism predicts. This
    is one of the strongest single arguments against the purely vascular model
    of the stroke-like episode.
  evidence:
  - reference: PMID:12297560
    reference_title: Neuronal hyperexcitability in stroke-like episodes of MELAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In seven of nine episodes focal cortical hyperperfusion was seen in SPECT studies."
    explanation: Direct perfusion evidence contradicting an ischemic mechanism for the acute lesion.
  - reference: PMID:18289816
    reference_title: Serial brain imaging analysis of stroke-like episodes in MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perfusion imaging at onset showed high intensity in bilateral occipital lobes, which indicated hyperperfusion in stroke-like lesions."
    explanation: Independent MR perfusion confirmation of lesional hyperperfusion.
- name: Cerebral atrophy
  modality: MRI
  imaging_finding_term:
    preferred_term: Cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
  description: >-
    Progressive brain atrophy accumulating across the disease course, the
    imaging correlate of the interictal cognitive decline.
  evidence:
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(8) brain dysfunction and atrophy are slowly progressive"
    explanation: Documents progressive atrophy as part of the MELAS imaging course.
biochemical:
- name: Blood lactate
  presence: Elevated
  context: >-
    The "LA" of the acronym. Beyond diagnosis, the degree of elevation carries
    prognostic weight: severe hyperlactatemia is an independent predictor of
    mortality and correlates with disability scores.
  biomarker_term:
    preferred_term: Lactic Acid Measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  reference_ranges:
  - unit: mmol/L
    upper_bound: 2.0
    population: MELAS cohort thresholds for mild versus severe hyperlactatemia
    notes: >-
      Thresholds as operationalized in the cited prognostic cohort; the upper
      limit of normal is assay- and laboratory-dependent.
    evidence:
    - reference: PMID:39697439
      reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mild hyperlactatemia was defined as a blood lactate level greater than the upper limit of the normal range (>2 mmol/L), while severe hyperlactatemia was defined as a blood lactate level greater than twice the upper limit of the normal range (>4 mmol/L)."
      explanation: Defines the mild and severe blood-lactate bands used in the prognostic analysis.
    interpretation_bands:
    - name: Normal
      upper_bound: 2.0
      unit: mmol/L
      abnormal_flag: NORMAL
    - name: Mild hyperlactatemia
      lower_bound: 2.0
      upper_bound: 4.0
      unit: mmol/L
      abnormal_flag: HIGH
      severity: MILD
    - name: Severe hyperlactatemia
      lower_bound: 4.0
      unit: mmol/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: >-
        Independently associated with mortality in MELAS and correlated with
        modified Rankin Scale disability.
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactic acidemia is very common and muscle biopsies typically show ragged red fibers."
    explanation: Establishes lactic acidemia as a very common finding in MELAS.
  - reference: PMID:39697439
    reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a positive correlation between lactic acid levels and MRS scores (r = 0.460, p = 0.003)."
    explanation: Links the magnitude of lactate elevation to disability, supporting its prognostic use.
- name: Cerebrospinal fluid lactate
  presence: Elevated
  context: >-
    CSF lactate can be raised when blood lactate is normal, so a normal serum
    value does not exclude MELAS. Proton MR spectroscopy detects the same
    signal non-invasively, including in normal-appearing brain.
  biomarker_term:
    preferred_term: Lactic Acid Measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  reference_ranges:
  - unit: mmol/L
    upper_bound: 2.2
    population: MELAS cohort thresholds for mild versus severe CSF lactate elevation
    notes: Thresholds as operationalized in the cited prognostic cohort.
    evidence:
    - reference: PMID:39697439
      reference_title: "Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Similarly, mild elevation in cerebrospinal fluid (CSF) lactate was defined as a level exceeding the upper normal limit (>2.2 mmol/L), and severe elevation was defined as a level exceeding two times the upper normal limit (>4.4 mmol/L)."
      explanation: Defines the CSF lactate bands used in the prognostic analysis.
    interpretation_bands:
    - name: Normal
      upper_bound: 2.2
      unit: mmol/L
      abnormal_flag: NORMAL
    - name: Mild elevation
      lower_bound: 2.2
      upper_bound: 4.4
      unit: mmol/L
      abnormal_flag: HIGH
      severity: MILD
    - name: Severe elevation
      lower_bound: 4.4
      unit: mmol/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
  evidence:
  - reference: PMID:23177587
    reference_title: "[Conventional and diffusion-weighted magnetic resonance imaging and proton spectroscopy in MELAS]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proton spectroscopy showed the presence of lactate and reduction of N-acetyl aspartate peak in stroke-like lesion and the presence of lactate in apparently spared brain."
    explanation: Demonstrates elevated brain lactate detectable by spectroscopy even outside the visible lesion.
- name: Growth differentiation factor 15 (GDF-15)
  presence: Elevated
  context: >-
    A circulating marker of mitochondrial disease rather than of MELAS
    specifically. In head-to-head meta-analysis GDF-15 outperforms FGF-21 on
    every diagnostic metric, which makes it the better first-line serum screen
    when a mitochondrial disorder is suspected.
  specificity: Mitochondrial disease as a class; not specific to MELAS
  biomarker_term:
    preferred_term: Growth Differentiation Factor 15 Measurement
    term:
      id: NCIT:C181406
      label: Growth Differentiation Factor 15 Measurement
  evidence:
  - reference: PMID:32585080
    reference_title: "Accuracy of FGF-21 and GDF-15 for the diagnosis of mitochondrial disorders: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled sensitivity, specificity, DOR and SROC of FGF-21 were 0.71 (95% CI 0.53, 0.84), 0.88(95% CI 0.82, 0.93), 18 (95% CI 6, 54), 0.90 (95% CI 0.87, 0.92), respectively, which were lower than GDF-15 values; 0.83 (95% CI 0.65, 0.92), 0.92 (95% CI 0.84, 0.96), 52 (95% CI 13, 205), 0.94 (95% CI 0.92, 0.96)."
    explanation: Meta-analytic diagnostic performance of GDF-15 against FGF-21 for mitochondrial disease.
- name: Fibroblast growth factor 21 (FGF-21)
  presence: Elevated
  context: >-
    Useful for diagnosis but poor for monitoring. In adult m.3243A>G carriers
    FGF-21 correlates only moderately with cross-sectional disease severity and
    showed no correlation with disease progression over two years, so it does
    not substitute for clinical scoring as a longitudinal endpoint.
  specificity: Mitochondrial disease as a class; not specific to MELAS
  biomarker_term:
    preferred_term: Fibroblast Growth Factor 21 Measurement
    term:
      id: NCIT:C112280
      label: Fibroblast Growth Factor 21 Measurement
  evidence:
  - reference: PMID:24907231
    reference_title: "Serum FGF21 levels in adult m.3243A>G carriers: clinical implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis revealed a moderate, significant correlation between FGF21 concentration and disease severity (r = 0.49; p = <0.001)."
    explanation: Establishes only a moderate cross-sectional relationship with severity in m.3243A>G carriers.
  - reference: PMID:24907231
    reference_title: "Serum FGF21 levels in adult m.3243A>G carriers: clinical implications."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeated measurements following 25 subjects for 2 years revealed no significant correlation between FGF21 concentration and disease progression."
    explanation: Refutes the use of FGF-21 as a longitudinal progression marker in this population.
genetic:
- name: MT-TL1 m.3243A>G
  gene_term:
    preferred_term: MT-TL1
    term:
      id: hgnc:7490
      label: MT-TL1
  association: >-
    The m.3243A>G point mutation in MT-TL1 (mitochondrial tRNA-Leu(UUR)) is the
    most common cause of MELAS, found in roughly 80% of patients. Disease
    expression depends on the heteroplasmy level of mutant mtDNA.
  subtype: MT-TL1 m.3243A>G
  inheritance:
  - name: Mitochondrial inheritance
    inheritance_term:
      preferred_term: Mitochondrial inheritance
      term:
        id: HP:0001427
        label: Mitochondrial inheritance
    evidence:
    - reference: PMID:24846800
      reference_title: "Detection rates and phenotypic spectrum of m.3243A>G in the MT-TL1 gene: a molecular diagnostic laboratory perspective."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        factors including random mitochondrial segregation and consequent
        variable tissue heteroplasmy are recognised to contribute to a much
        broader phenotypic spectrum associated with the MT-TL1 m.3243A>G
        mutation
      explanation: >-
        Supports maternal mitochondrial inheritance with heteroplasmy-dependent,
        variable phenotypic expression of the m.3243A>G mutation.
    - reference: PMID:37988592
      reference_title: Penetrance and expressivity of mitochondrial variants in a large clinically unselected population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Multi-system disease risk and penetrance of diabetes, deafness and
        heart failure greatly increased with m.3243A>G level ≥ 10%.
      explanation: >-
        UK Biobank data quantifying the heteroplasmy threshold effect: penetrance
        of multisystem disease rises sharply once m.3243A>G heteroplasmy reaches
        ≥10%.
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The m.3243A>G pathogenic variant in the mitochondrial gene MT-TL1 is
      present in approximately 80% of individuals with MELAS.
    explanation: >-
      GeneReviews establishes m.3243A>G in MT-TL1 as the most common cause of
      MELAS (~80% of cases).
  - reference: PMID:2102678
    reference_title: A mutation in the tRNA(Leu)(UUR) gene associated with the MELAS subgroup of mitochondrial encephalomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was present in 26 out of 31 independent MELAS patients and 1
      out of 29 CPEO patients, but absent in the 5 MERRF and 50 controls tested.
    explanation: >-
      Original genotyping data establishing the m.3243A>G variant as
      MELAS-specific.
  - reference: PMID:39118480
    reference_title: "The clinical and genetic spectrum of mitochondrial diseases in China: A multicenter retrospective cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial DNA (mtDNA) mutations were prevalent (87.4%), with m.3243A>G being the most common locus (48.7%)."
    explanation: Independent multicentre confirmation that m.3243A>G is the single commonest mitochondrial-disease locus, in a cohort where MELAS was the predominant phenotype.
- name: MT-ND5 and other mitochondrial-gene variants
  gene_term:
    preferred_term: MT-ND5
    term:
      id: hgnc:7461
      label: MT-ND5
  association: >-
    A minority of MELAS cases are caused by variants outside MT-TL1, including
    the complex I subunit genes MT-ND1, MT-ND5, and MT-ND6. These behave
    differently from the tRNA genotype: because they hit complex I structural
    subunits directly rather than through a translation defect, they are
    enriched in MELAS/Leigh overlap presentations, where m.13513G>A in MT-ND5
    is the commonest single variant. Genotype should therefore be read as a
    partial predictor of which end of the MELAS-Leigh spectrum a patient sits
    on, not merely as a footnote to the m.3243A>G majority.
  subtype: MT-ND5 and other genes
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in MT-TL1 or other mtDNA genes, particularly MT-ND5,
      can also cause this disorder.
    explanation: >-
      GeneReviews documents MT-ND5 and other mtDNA genes as additional causes of
      MELAS beyond the common MT-TL1 m.3243A>G variant.
  - reference: PMID:34025555
    reference_title: "MELAS/LS Overlap Syndrome Associated With Mitochondrial DNA Mutations: Clinical, Genetic, and Radiological Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen patients were identified with MTND mutations, among which m.13513G>A mutation in the MT-ND5 gene was the most common."
    explanation: Identifies MT-ND5 m.13513G>A as the leading variant in MELAS/Leigh overlap, the presentation most enriched for complex I subunit genotypes.
  - reference: PMID:34025555
    reference_title: "MELAS/LS Overlap Syndrome Associated With Mitochondrial DNA Mutations: Clinical, Genetic, and Radiological Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas mutations in polypeptide-coding genes, including subunits 1, 5, and 6 of complex I (MT-ND1, MT-ND5, and MT-ND6), have also been identified in MELAS"
    explanation: Names the full set of complex I subunit genes reported as non-MT-TL1 causes of MELAS.
treatments:
- name: L-arginine therapy
  description: >-
    Intravenous L-arginine in the acute phase and oral supplementation for
    prophylaxis aims to restore nitric oxide availability and improve
    endothelial function, reducing the frequency and severity of stroke-like
    episodes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-arginine
      term:
        id: CHEBI:16467
        label: L-arginine
  target_mechanisms:
  - target: Mitochondrial angiopathy and NO deficiency
    treatment_effect: RESTORES
    description: >-
      L-arginine, a nitric oxide precursor, aims to restore nitric oxide
      availability and improve endothelial function at the angiopathy node,
      reducing the frequency and severity of stroke-like episodes.
    evidence:
    - reference: PMID:31693521
      reference_title: Arginine therapy in mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MELAS is associated with endothelial dysfunction by decreased plasma L-arginine, nitric oxide (NO), and cyclic guanosine monophosphate."
      explanation: Names the NO-deficient endothelial node that arginine supplementation is intended to correct.
  evidence:
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unblinded studies showed that l-arginine therapy improves stroke-like
      episode symptoms and decreases the frequency and severity of these
      episodes.
    explanation: >-
      Supports L-arginine as a therapy that reduces stroke-like episode
      frequency and severity in MELAS.
  - reference: PMID:31693521
    reference_title: Arginine therapy in mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the systematic administration of L-arginine to patients with MELAS
      significantly improved the survival curve of patients compared with
      natural history.
    explanation: >-
      Clinical trial follow-up data supporting survival benefit of systematic
      L-arginine therapy in MELAS.
- name: Taurine supplementation
  description: >-
    Oral taurine supplementation aims to restore taurine modification of the
    wobble uridine of mutant mitochondrial tRNA-Leu(UUR), improving codon
    decoding and reducing stroke-like episode recurrence. Unusually for MELAS,
    this is a therapy aimed at the proximal molecular lesion rather than at a
    downstream consequence.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Taurine wobble-modification deficiency of tRNA-Leu(UUR)
    treatment_effect: RESTORES
    description: >-
      Supplying taurine is intended to restore the 5-taurinomethyluridine
      modification at the anticodon wobble position, correcting the
      codon-specific decoding defect at its source.
    evidence:
    - reference: PMID:29666206
      reference_title: "Taurine supplementation for prevention of stroke-like episodes in MELAS: a multicentre, open-label, 52-week phase III trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a taurine modification defect at the first anticodon nucleotide of mitochondrial tRNALeu(UUR), resulting in failure to decode codons accurately"
      explanation: States the molecular target that taurine supplementation is designed to correct.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: taurine
      term:
        id: CHEBI:15891
        label: taurine
  evidence:
  - reference: PMID:29666206
    reference_title: "Taurine supplementation for prevention of stroke-like episodes in MELAS: a multicentre, open-label, 52-week phase III trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taurine reduced the annual relapse rate of stroke-like episodes from 2.22
      to 0.72 (P=0.001).
    explanation: >-
      A multicentre phase III trial showing high-dose taurine significantly
      reduced stroke-like episode recurrence in MELAS.
  - reference: PMID:29666206
    reference_title: "Taurine supplementation for prevention of stroke-like episodes in MELAS: a multicentre, open-label, 52-week phase III trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a taurine modification defect at the first anticodon nucleotide of
      mitochondrial tRNALeu(UUR), resulting in failure to decode codons
      accurately
    explanation: >-
      Provides the molecular rationale: taurine restores wobble-uridine
      modification of mutant tRNA-Leu(UUR), improving codon decoding.
- name: Citrulline supplementation
  description: >-
    Oral citrulline, a nitric oxide precursor, increases arginine availability
    and nitric oxide production. Stable-isotope studies suggest citrulline may be
    a more effective NO precursor than arginine in MELAS.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-citrulline
      term:
        id: CHEBI:16349
        label: L-citrulline
  target_mechanisms:
  - target: Mitochondrial angiopathy and NO deficiency
    treatment_effect: RESTORES
    description: >-
      Citrulline increases intracellular arginine availability and nitric oxide
      synthesis, targeting the NO-deficient endothelial dysfunction at the
      angiopathy node.
    evidence:
    - reference: PMID:26851065
      reference_title: Impaired nitric oxide production in children with MELAS syndrome and the effect of arginine and citrulline supplementation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The greater effect of citrulline in increasing NO production is due to its greater ability to increase arginine availability particularly in the intracellular compartment in which NO synthesis takes place."
      explanation: Stable-isotope evidence that citrulline raises NO production at the intracellular site where NO synthase acts.
  evidence:
  - reference: PMID:26851065
    reference_title: Impaired nitric oxide production in children with MELAS syndrome and the effect of arginine and citrulline supplementation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greater effect of citrulline in increasing NO production is due to its
      greater ability to increase arginine availability particularly in the
      intracellular compartment in which NO synthesis takes place.
    explanation: >-
      Stable-isotope study showing citrulline increases NO production more
      effectively than arginine in children with MELAS, supporting it as a NO
      precursor therapy.
- name: Supportive mitochondrial disease management
  description: >-
    Supportive care including antiseizure medications, management of diabetes
    and hearing loss, avoidance of mitochondrial toxins, and mitochondrial
    cofactor supplementation (e.g., coenzyme Q10, L-carnitine).
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management is largely symptomatic and should involve a multidisciplinary
      team.
    explanation: >-
      Supports symptomatic, multidisciplinary supportive management as the
      mainstay of MELAS care.
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, carnitine and coenzyme Q10 are commonly used in MELAS
      syndrome without proven efficacy.
    explanation: >-
      Supports common use of carnitine and coenzyme Q10 cofactors, while noting
      their efficacy is unproven (hence PARTIAL).
- name: Aggressive antiseizure therapy
  description: >-
    Under the neuronal-hyperexcitability model, seizure control is not merely
    symptomatic management but treatment aimed at the mechanism that initiates
    and propagates the stroke-like lesion. Epilepsy in MELAS is typically drug
    resistant, yet most patients achieve substantial seizure reduction with
    combinations of two or more antiseizure medications. Valproic acid is
    specifically avoided as a mitochondrial toxin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_mechanisms:
  - target: Neuronal hyperexcitability and propagating epileptic activity
    treatment_effect: INHIBITS
    description: >-
      Suppressing epileptiform activity is intended to interrupt the
      depolarization cascade that spreads the cortical lesion into adjacent
      cortex.
    evidence:
    - reference: PMID:36813321
      reference_title: Stroke-like episodes in adult mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The management of stroke-like episodes should focus on aggressive seizure management and treatment for concomitant complications such as intestinal pseudo-obstruction."
      explanation: Places seizure suppression at the centre of stroke-like-episode management, which follows from the hyperexcitability model.
  evidence:
  - reference: PMID:27671241
    reference_title: "Epilepsy Characteristics and Clinical Outcome in Patients With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-Like Episodes (MELAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty of 22 subjects (90.9%) achieved partial to complete reduction of clinical seizures for more than one year with a combination of more than two antiepileptic drugs."
    explanation: Quantifies achievable seizure control with multi-drug antiseizure therapy in MELAS.
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial toxins, including aminoglycoside antibiotics, linezolid, cigarettes, and alcohol; valproic acid for seizure treatment; metformin because of its propensity to cause lactic acidosis; dichloroacetate (DCA) because of increased risk for peripheral neuropathy."
    explanation: Records the constraint that valproic acid must be avoided when choosing antiseizure medication in MELAS.
- name: Soluble guanylate cyclase stimulation (investigational)
  description: >-
    Zagociguat and the earlier IW-6463 are CNS-penetrant stimulators of soluble
    guanylate cyclase, the receptor for nitric oxide. They act one step
    downstream of the arginine and citrulline strategy: rather than supplying
    more NO precursor, they amplify signalling through the NO-cGMP axis whose
    failure defines the endothelial-dysfunction node. Both have been taken into
    MELAS-specific trials; neither is approved, and the IW-6463 study was
    terminated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zagociguat
      term:
        id: NCIT:C188581
        label: Zagociguat
    - preferred_term: soluble guanylate cyclase stimulator
      term:
        id: NCIT:C210759
        label: Soluble Guanylate Cyclase Stimulator
  target_mechanisms:
  - target: Mitochondrial angiopathy and NO deficiency
    treatment_effect: RESTORES
    description: >-
      Direct stimulation of soluble guanylate cyclase is intended to restore
      cGMP signalling in cerebral microvasculature where nitric oxide
      availability is reduced.
    evidence:
    - reference: PMID:31693521
      reference_title: Arginine therapy in mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MELAS is associated with endothelial dysfunction by decreased plasma L-arginine, nitric oxide (NO), and cyclic guanosine monophosphate."
      explanation: Documents the reduced cGMP that soluble guanylate cyclase stimulation is designed to raise.
  evidence:
  - reference: clinicaltrials:NCT06402123
    reference_title: "Phase 2b Randomized, Double-blind, Placebo-controlled Crossover Study Evaluating the Efficacy and Safety of Zagociguat in Participants With MELAS (PRIZM)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRIZM is a Phase 2b randomized, double-blind, placebo-controlled, 3-treatment, 2-period, crossover study evaluating the efficacy and safety of oral zagociguat 15 and 30 mg vs. placebo when administered daily for 12 weeks in participants with genetically and phenotypically defined MELAS."
    explanation: A completed randomized placebo-controlled MELAS-specific trial of a soluble guanylate cyclase stimulator.
  - reference: clinicaltrials:NCT04475549
    reference_title: "A Phase 2a Safety, Tolerability, Pharmacokinetic, and Pharmacodynamic Study in Individuals With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-like Episodes (MELAS)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a single-arm study to evaluate safety and tolerability of oral IW-6463 in adults diagnosed with MELAS."
    explanation: The earlier single-arm MELAS study of the same mechanism, which was terminated.
inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    MELAS is maternally inherited through the mitochondrial genome. Clinical
    expression depends on the heteroplasmy level of mutant mtDNA, with a
    threshold effect.
  evidence:
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial encephalomyopathy, lactic acidosis, and stroke-like
      episodes (MELAS) syndrome is one of the most frequent maternally inherited
      mitochondrial disorders.
    explanation: >-
      Establishes MELAS as a maternally inherited mitochondrial disorder.
  - reference: PMID:2102678
    reference_title: A mutation in the tRNA(Leu)(UUR) gene associated with the MELAS subgroup of mitochondrial encephalomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Southern blot analysis confirmed that the mutant DNA always coexists with
      the wild-type DNA
    explanation: >-
      Documents heteroplasmy (coexistence of mutant and wild-type mtDNA), the
      basis for the threshold effect in MELAS.
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A man with a mtDNA pathogenic variant cannot transmit the variant to any
      of his offspring.
    explanation: >-
      GeneReviews genetic counseling: paternal mtDNA is not transmitted, so an
      affected father carries no recurrence risk for his children. This is the
      asymmetry that distinguishes mitochondrial from autosomal inheritance.
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A woman with a mtDNA pathogenic variant (whether symptomatic or
      asymptomatic) transmits the variant to all of her offspring.
    explanation: >-
      GeneReviews genetic counseling: maternal transmission is obligate for
      every child regardless of the mother's own symptom status, because
      transmission and clinical expression are decoupled by heteroplasmy.
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      because the mutational load in tissues sampled prenatally may shift in
      utero or after birth as a result of random mitotic segregation,
      prediction of the phenotype from prenatal studies cannot be made with
      certainty.
    explanation: >-
      GeneReviews genetic counseling: prenatal and preimplantation testing can
      establish the variant but not the phenotype, because random mitotic
      segregation keeps the heteroplasmy level measured prenatally from
      predicting the level in later tissues. This is the counseling-level
      consequence of the same threshold effect modeled in the pathograph.
clinical_trials:
- name: NCT06402123
  phase: PHASE_II
  status: COMPLETED
  description: >-
    PRIZM: randomized, double-blind, placebo-controlled crossover trial of oral
    zagociguat, a soluble guanylate cyclase stimulator, in genetically and
    phenotypically defined MELAS. Tests the NO-cGMP arm of the vascular
    hypothesis one step downstream of arginine and citrulline.
  evidence:
  - reference: clinicaltrials:NCT06402123
    reference_title: "Phase 2b Randomized, Double-blind, Placebo-controlled Crossover Study Evaluating the Efficacy and Safety of Zagociguat in Participants With MELAS (PRIZM)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRIZM is a Phase 2b randomized, double-blind, placebo-controlled, 3-treatment, 2-period, crossover study evaluating the efficacy and safety of oral zagociguat 15 and 30 mg vs. placebo when administered daily for 12 weeks in participants with genetically and phenotypically defined MELAS."
    explanation: Registration record establishing design, comparator, and MELAS-specific population.
- name: NCT04475549
  phase: PHASE_II
  status: TERMINATED
  description: >-
    Single-arm safety, tolerability, pharmacokinetic and pharmacodynamic study
    of the CNS-penetrant soluble guanylate cyclase stimulator IW-6463 in adults
    with MELAS. Terminated.
  evidence:
  - reference: clinicaltrials:NCT04475549
    reference_title: "A Phase 2a Safety, Tolerability, Pharmacokinetic, and Pharmacodynamic Study in Individuals With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-like Episodes (MELAS)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a single-arm study to evaluate safety and tolerability of oral IW-6463 in adults diagnosed with MELAS."
    explanation: Registration record for the earlier, uncontrolled trial of the same mechanism.
- name: NCT03952234
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Dose-finding and safety study of L-citrulline in adults with MELAS,
    intended to establish a dose for a later efficacy trial of nitric oxide
    repletion.
  evidence:
  - reference: clinicaltrials:NCT03952234
    reference_title: "Phase-1, Dose Finding and Safety Study on L- Citrulline Treatment of Nitric Oxide Deficiency in MELAS"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main purpose of this study is to determine the safest maximum dose of an amino acid, citrulline, which will be used as potential treatment for adult patients with a disorder of energy metabolism called Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-like episodes (MELAS)."
    explanation: Establishes that citrulline dosing in MELAS was still at the dose-finding stage, before any efficacy trial.
- name: NCT01339494
  status: COMPLETED
  description: >-
    Stable-isotope study of arginine flux and nitric oxide production in MELAS,

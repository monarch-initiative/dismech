has_subtypes:
- name: MT-TL1 m.3243A>G
  display_name: MT-TL1 m.3243A>G (classic MELAS)
  description: >-
    The most common form, caused by the m.3243A>G transition in MT-TL1
    (mitochondrial tRNA-Leu(UUR)), accounting for roughly 80% of MELAS cases.
  evidence:
  - reference: PMID:20301411
    reference_title: MELAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The m.3243A>G pathogenic variant in the mitochondrial gene MT-TL1 is
      present in approximately 80% of individuals with MELAS.
    explanation: Establishes m.3243A>G as the majority genotype defining this subtype.
- name: Other MT-TL1 variants
  display_name: Other MT-TL1 (tRNA-Leu(UUR)) variants
  description: >-
    A minority of MELAS cases caused by non-3243 pathogenic variants in MT-TL1,
    most notably m.3271T>C, which also impair tRNA-Leu(UUR) function through
    the same loss of the wobble taurine modification.
  evidence:
  - reference: PMID:17132941
    reference_title: Human mitochondrial diseases associated with tRNA wobble modification deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mt tRNA(Leu(UUR)) with either the MELAS 3243 or 3271 mutation"
    explanation: Confirms that the 3271 variant shares the wobble-modification defect of the common 3243 variant.
- name: MT-ND5 and other genes
  display_name: MT-ND5 and other mitochondrial-gene MELAS
  description: >-
    MELAS-spectrum disease caused by variants outside MT-TL1, particularly in
    the complex I subunit genes MT-ND1, MT-ND5, and MT-ND6, and occasionally
    other mitochondrial tRNA or protein-coding genes. These genotypes attack
    complex I directly rather than through a translation defect and are
    enriched in MELAS/Leigh overlap presentations.
  evidence:
  - reference: PMID:34025555
    reference_title: "MELAS/LS Overlap Syndrome Associated With Mitochondrial DNA Mutations: Clinical, Genetic, and Radiological Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas mutations in polypeptide-coding genes, including subunits 1, 5, and 6 of complex I (MT-ND1, MT-ND5, and MT-ND6), have also been identified in MELAS"
    explanation: Names the complex I subunit genes that define this non-MT-TL1 subtype.
prevalence:
- population: Adults in Southwest Finland (2022, m.3243A>G-related disease)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.2
  percentage: 4.2/100,000
  evidence:
  - reference: PMID:38361968
    reference_title: "Incidence and prevalence of mtDNA-related adult mitochondrial disease in Southwest Finland, 2009-2022: an observational, population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of adult mtDNA disease associated with m.3243A>G was
      4.2/100 000 (95% CI, 2.5 to 6.7)
    explanation: >-
      Population-based prevalence of adult m.3243A>G-related mitochondrial
      disease, the genotype underlying most MELAS.
  notes: >-
    m.3243A>G underlies multiple overlapping clinical syndromes (MELAS, MIDD),
    so this figure reflects the broader m.3243A>G disease population rather than
    classic MELAS specifically.
- population: Japan (nationwide prospective cohort, clinically defined MELAS)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.18
  rate_low: 0.02
  rate_high: 0.34
  notes: >-
    Prevalence of clinically defined MELAS (Japanese diagnostic criteria) in the
    total Japanese population, an order of magnitude below the prevalence of
    m.3243A>G-related disease as a whole because most carriers never meet full
    MELAS criteria.
  evidence:
  - reference: PMID:21443929
    reference_title: "MELAS: a nationwide prospective cohort study of 96 patients in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the prevalence of MELAS was 0.18 (95%CI, 0.02-0.34)/100,000 in the total population"
    explanation: Nationwide prospective cohort estimate for clinically defined MELAS specifically, rather than for all m.3243A>G carriers.
- population: General population (m.3243A>G carrier frequency)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 250.0
  notes: >-
    Carrier frequency of the causal variant, not of MELAS. Most m.3243A>G
    carriers have MIDD, an oligosymptomatic phenotype, or no symptoms at all;
    the gap between this figure and the MELAS prevalence above is the measure of
    incomplete penetrance for the full syndrome.
  evidence:
  - reference: PMID:23355809
    reference_title: "The UK MRC Mitochondrial Disease Patient Cohort Study: clinical phenotypes associated with the m.3243A>G mutation--implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Population-based studies suggest the m.3243A>G mutation in MTTL1 is the most common disease-causing mtDNA mutation, with a carrier rate of 1 in 400 people."
    explanation: Establishes the population carrier rate of the causal variant, which greatly exceeds the prevalence of the MELAS syndrome itself.
progression:
- phase: Juvenile-onset form
  age_range: Onset before ~18 years
  notes: >-
    Short stature is significantly more frequent in the juvenile form, and
    juvenile onset carries a substantially higher risk of death than adult
    onset. Earlier seizure onset also predicts drug-resistant epilepsy.
  evidence:
  - reference: PMID:21443929
    reference_title: "MELAS: a nationwide prospective cohort study of 96 patients in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to a Kaplan-Meier analysis, the juvenile form was associated with a higher risk of death than the adult form (hazard ratio, 3.29; 95%CI, 1.32-8.20; p=0.0105)."
    explanation: Quantifies the survival difference between the juvenile and adult forms in a nationwide prospective cohort.
- phase: Adult-onset form
  age_range: Onset in adulthood
  notes: >-
    Hearing loss, cortical blindness, and diabetes mellitus are significantly
    more frequent in the adult form than in the juvenile form.
  evidence:
  - reference: PMID:21443929
    reference_title: "MELAS: a nationwide prospective cohort study of 96 patients in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short stature was significantly more frequent in the juvenile form, whereas hearing loss, cortical blindness and diabetes mellitus were significantly more frequent in the adult form."
    explanation: Separates the two natural-history subgroups by their differentiating manifestations.
- phase: Late-onset presentation (after age 40)
  age_range: Onset after 40 years
  notes: >-
    A small minority present after age 40 and typically follow a less aggressive
    course, though the late-onset course is not uniformly benign.
  evidence:
  - reference: PMID:30766507
    reference_title: "Can Intestinal Pseudo-Obstruction Drive Recurrent Stroke-Like Episodes in Late-Onset MELAS Syndrome? A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although childhood is the typical age of onset, a small fraction (1-6%) of individuals manifest the disease after 40 years of age and usually have a less aggressive disease course."
    explanation: Documents the frequency and general course of late-onset MELAS.
- phase: Rapid degenerative decline in the first five years after onset
  duration: 5 years from onset
  notes: >-
    Disease-rating-scale scores rise steeply within five years of onset in both
    the juvenile and adult forms, so the early years after the first
    stroke-like episode carry most of the accumulating disability.
  evidence:
  - reference: PMID:21443929
    reference_title: "MELAS: a nationwide prospective cohort study of 96 patients in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the Japanese mitochondrial disease rating scale, MELAS patients showed rapidly increasing scores (mean±standard deviation, 12.8±8.7) within 5years from onset of the disease."
    explanation: Quantifies the rate of degenerative progression in the first five years.
- phase: Accumulated disability and death
  notes: >-
    Acute stroke-like episodes and status epilepticus are the leading causes of
    death, and survival declines mainly in the first dozen years after onset.
    Progressive brain atrophy and dementia are the sequelae of recurrent
    stroke-like episodes in survivors.
  evidence:
  - reference: PMID:29406897
    reference_title: Survival analysis of a cohort of Chinese patients with mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes (MELAS) based on clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 121 subjects who successfully completed the follow-up, 28 subjects died (mortality rate 23.1%). An acute stroke-like episode and/or status epilepticus were the predominant causes of death (42.9%)."
    explanation: Cohort mortality rate and the dominant proximate causes of death.
  - reference: PMID:29406897
    reference_title: Survival analysis of a cohort of Chinese patients with mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes (MELAS) based on clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the surviving patients (n=93), 39.8% (37/93) required assistance in daily life (mRS scores 3-5). The mRS scores were inversely correlated with the age of onset"
    explanation: Quantifies residual disability among survivors and its inverse relation to age at onset.
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive brain atrophy and dementia are the sequalae of recurrent stroke-like episode, and the underlying genotype in part predicts prognosis."
    explanation: Identifies the long-term neurological endpoint of recurrent stroke-like episodes.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    MELAS combines a high mortality rate with severe residual disability among
    survivors. Roughly a quarter of a followed cohort died, mostly from acute
    stroke-like episodes or status epilepticus, and about 40% of survivors
    needed help with daily life. Epilepsy is typically drug-resistant, and
    recurrent stroke-like episodes leave progressive brain atrophy and dementia.
    No disease-modifying therapy is established.
  evidence:
  - reference: PMID:29406897
    reference_title: Survival analysis of a cohort of Chinese patients with mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes (MELAS) based on clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MELAS had high mortality and morbidity in this cohort of Chinese patients."
    explanation: Direct statement of the mortality and morbidity burden in a followed cohort.
  - reference: PMID:27671241
    reference_title: "Epilepsy Characteristics and Clinical Outcome in Patients With Mitochondrial Encephalomyopathy, Lactic Acidosis, and Stroke-Like Episodes (MELAS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy in this population is drug resistant, but a certain degree of clinical seizure reduction was achievable with antiepileptic drugs, with more favorable outcomes than historically expected."
    explanation: Establishes drug-resistant epilepsy as a major contributor to burden, while noting partial treatability.
pathophysiology:
- name: Taurine wobble-modification deficiency of tRNA-Leu(UUR)
  biological_scale: MOLECULAR
  description: >-
    The pathogenic MT-TL1 variants abolish the normal taurine-containing
    modification (5-taurinomethyluridine) at the anticodon wobble position of
    mitochondrial tRNA-Leu(UUR). This is the proximal molecular lesion: the
    unmodified anticodon can no longer form a correct codon-anticodon pair,
    and the resulting decoding failure is codon-specific rather than a uniform
    loss of leucine incorporation. The same defect is the rationale for taurine
    supplementation.
  genes:
  - preferred_term: MT-TL1
    term:
      id: hgnc:7490
      label: MT-TL1
  biological_processes:
  - preferred_term: tRNA wobble uridine modification
    modifier: DECREASED
    term:
      id: GO:0002098
      label: tRNA wobble uridine modification
  evidence:
  - reference: PMID:15893315
    reference_title: Wobble modification deficiency in mutant tRNAs in patients with mitochondrial diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mt tRNA(Leu(UUR)) with a MELAS A3243G mutation and mt tRNA(Lys) with a MERRF A8344G mutation derived from HeLa background cybrid cells are deficient in normal taurine-containing modifications"
    explanation: Identifies the specific chemical modification that is absent from mutant tRNA-Leu(UUR) in MELAS.
  - reference: PMID:15893315
    reference_title: Wobble modification deficiency in mutant tRNAs in patients with mitochondrial diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report here wobble modification deficiencies of mutant mt tRNAs from cybrid cells with different nuclear backgrounds, as well as from patient tissues."
    explanation: Shows the modification defect is not an artefact of one cybrid nuclear background and is present in patient tissue.
  downstream:
  - target: Mitochondrial tRNA-Leu(UUR) translation defect
    causal_link_type: DIRECT
    description: >-
      Loss of the wobble taurine modification degrades codon-anticodon pairing,
      with UUG decoding affected more severely than UUA, so mitochondrial
      translation fails in a codon-biased way.
    evidence:
    - reference: PMID:17132941
      reference_title: Human mitochondrial diseases associated with tRNA wobble modification deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the translational activity of MELAS mt tRNA(Leu(UUR)) lacking wobble modification is more depressed in decoding of UUG codon than UUA codon"
      explanation: Establishes that the decoding defect is codon-specific, which is what distinguishes MELAS from a generic translation failure.
- name: Mitochondrial tRNA-Leu(UUR) translation defect
  biological_scale: MOLECULAR
  description: >-
    The m.3243A>G variant in MT-TL1 disrupts the structure and aminoacylation
    of mitochondrial tRNA-Leu(UUR), impairing mitochondrial protein synthesis
    (translation) of the mtDNA-encoded respiratory chain subunits.
  genes:
  - preferred_term: MT-TL1
    term:
      id: hgnc:7490
      label: MT-TL1
  biological_processes:
  - preferred_term: tRNA aminoacylation for protein translation
    modifier: DECREASED
    term:
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:2102678
    reference_title: A mutation in the tRNA(Leu)(UUR) gene associated with the MELAS subgroup of mitochondrial encephalomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report an A-to-G transition mutation at nucleotide pair 3,243 in
      the dihydrouridine loop of mitochondrial tRNA(Leu)(UUR) that is specific
      to patients with MELAS.
    explanation: >-
      The foundational paper identifying the m.3243A>G transition in
      mitochondrial tRNA-Leu(UUR) (MT-TL1) as the MELAS-specific lesion.
  - reference: PMID:23392880
    reference_title: Taurine deficiency and MELAS are closely related syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These mutations reduce both the aminoacylation of tRNA(Leu(UUR)) and a
      posttranslational modification in the wobble position of tRNA(Leu(UUR)).
      Both changes result in reduced transcription of mitochondria-encoded
      proteins
    explanation: >-
      Directly supports the mechanism that MT-TL1 mutations impair tRNA
      aminoacylation and wobble modification, reducing mitochondrial protein
      synthesis.
  downstream:
  - target: Oxidative phosphorylation deficiency
    causal_link_type: DIRECT
    description: >-
      Defective synthesis of mtDNA-encoded subunits reduces assembly and
      activity of the respiratory chain complexes, especially complex I.
    evidence:
    - reference: PMID:23392880
      reference_title: Taurine deficiency and MELAS are closely related syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both changes result in reduced transcription of mitochondria-encoded
        proteins
      explanation: Links the tRNA defect to reduced production of the mtDNA-encoded respiratory chain subunits.
- name: Oxidative phosphorylation deficiency
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Impaired mitochondrial translation reduces the abundance and activity of
    respiratory chain complexes, lowering ATP synthesis through oxidative
    phosphorylation. The defect becomes clinically apparent above a heteroplasmy
    threshold of mutant mtDNA.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: aerobic respiration
    modifier: DECREASED
    term:
      id: GO:0009060
      label: aerobic respiration
  evidence:
  - reference: PMID:26851065
    reference_title: Impaired nitric oxide production in children with MELAS syndrome and the effect of arginine and citrulline supplementation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenesis of this syndrome is not fully understood and believed to
      result from several interacting mechanisms including impaired
      mitochondrial energy production, microvasculature angiopathy, and nitric
      oxide (NO) deficiency.
    explanation: >-
      Establishes impaired mitochondrial energy production (OXPHOS deficiency)
      as a core pathogenic mechanism of MELAS.
  downstream:
  - target: Cellular energy failure and lactic acidosis
    causal_link_type: DIRECT
    description: >-
      Reduced ATP synthesis forces a shift to anaerobic glycolysis, raising
      lactate, and starves high-energy-demand tissues (brain, muscle, vascular
      endothelium and smooth muscle).
    evidence:
    - reference: PMID:26095523
      reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The inability of dysfunctional mitochondria to generate sufficient energy
        to meet the needs of various organs results in the multi-organ
        dysfunction observed in MELAS syndrome.
      explanation: States the link from respiratory-chain failure to energy shortfall in high-demand organs.
  - target: Complex I-predominant deficiency and neuronal mitophagy
    causal_link_type: DIRECT
    description: >-
      The respiratory-chain deficit is not distributed evenly across the
      complexes or across cell types; complex I is disproportionately affected,
      and in neurons the deficient complex is actively cleared by mitophagy.
- name: Complex I-predominant deficiency and neuronal mitophagy
  biological_scale: CELLULAR
  description: >-
    The respiratory-chain deficit produced by defective mitochondrial
    translation is not uniform. Complex I, whose subunits are the most
    dependent on mtDNA-encoded synthesis, is disproportionately affected, and
    the pattern of deficiency differs between cell types derived from the same
    patient. In differentiated neurons, complex I specifically is sequestered
    into PINK1/Parkin-positive autophagosomes, so active mitophagy - not only
    failed assembly - contributes to the neuronal deficit. This is the
    mechanistic reason why one heteroplasmic variant produces a
    neuron-weighted, rather than uniformly systemic, disease.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  biological_processes:
  - preferred_term: autophagy of mitochondrion
    modifier: INCREASED
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:24003133
    reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Induced pluripotent stem cell-derived neurons and various tissues derived from teratomas manifested cell-type specific respiratory chain (RC) deficiency patterns. Similar to MELAS patient tissues, complex I defect predominated."
    explanation: Shows the complex I predominance and its cell-type dependence in a patient-derived m.3243A>G model, matching patient tissue.
  - reference: PMID:24003133
    reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon neuronal differentiation, complex I specifically was sequestered in perinuclear PTEN-induced putative kinase 1 (PINK1) and Parkin-positive autophagosomes, suggesting active degradation through mitophagy."
    explanation: Direct evidence for selective mitophagic clearance of complex I in neurons as a component of the neuronal deficit.
  downstream:
  - target: Cellular energy failure and lactic acidosis
    causal_link_type: DIRECT
    description: >-
      Selective loss of complex I lowers NADH oxidation and ATP output most
      severely in the neuronal populations that can least tolerate it.
- name: Cellular energy failure and lactic acidosis
  biological_scale: CELLULAR
  description: >-
    OXPHOS deficiency drives a compensatory increase in anaerobic glycolysis,
    producing elevated blood and CSF lactate. Energy failure preferentially
    affects metabolically demanding tissues, underlying encephalopathy,
    myopathy, and endocrine dysfunction.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: generation of precursor metabolites and energy
    modifier: DECREASED
    term:
      id: GO:0006091
      label: generation of precursor metabolites and energy
  evidence:
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inability of dysfunctional mitochondria to generate sufficient energy
      to meet the needs of various organs results in the multi-organ
      dysfunction observed in MELAS syndrome.
    explanation: >-
      Supports cellular energy failure in high-demand tissues as the link
      between OXPHOS deficiency and the multisystem phenotype.
  downstream:
  - target: Mitochondrial angiopathy and NO deficiency
    causal_link_type: DIRECT
    description: >-
      Energy failure in cerebral small-vessel endothelium and smooth muscle
      drives mitochondrial angiopathy and impaired nitric oxide availability.
    hypothesis_groups:
    - ischemic_vascular_angiopathy
    evidence:
    - reference: PMID:26095523
      reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Energy deficiency can also stimulate mitochondrial proliferation in the
        smooth muscle and endothelial cells of small blood vessels leading to
        angiopathy and impaired blood perfusion in the microvasculature of
        several organs.
      explanation: Direct statement of the causal step from energy deficiency to small-vessel angiopathy.
  - target: Neuronal hyperexcitability and propagating epileptic activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the non-ischemic model, a mismatch between the energy demanded by an
      active cortical neuronal population and the ATP that a defective
      respiratory chain can supply renders those neurons hyperexcitable. What
      converts this chronic vulnerability into a discrete episode is not known.

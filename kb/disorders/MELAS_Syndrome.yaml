  - reference: clinicaltrials:NCT06013397
    reference_title: "Clinical Trial of Ketogenic Diet in the Treatment of Mitochondrial Encephalomyopathy With Lactic Acidosis and Stroke-like Episodes(MELAS)"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The goal of this clinical trial is to evaluate the effectiveness of ketogenic diet in patients with MELAS syndrome."
    explanation: Registration record establishing that ketogenic-diet efficacy in MELAS remains an open, untested question.
- name: NCT01532791
  status: RECRUITING
  description: >-
    Natural-history study of known m.3243A>G carriers together with their
    maternal relatives, enrolled regardless of carrier status, with paternal
    relatives as controls. The design is what makes it relevant here: it
    ascertains through the family rather than through a neurology clinic, so it
    can in principle measure organ involvement in carriers who would never
    present to a mitochondrial-disease service.
  evidence:
  - reference: clinicaltrials:NCT01532791
    reference_title: "Mitochondrial Encephalomyopathies and Mental Retardation: Investigations of Clinical Syndromes Associated With MtDNA Point Mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and their maternal relatives (carrier status not a requirement for participation). Paternal relatives will serve as controls."
    explanation: Family-based rather than clinic-based ascertainment, the sampling frame needed to estimate organ involvement without neurology-referral bias.
- name: NCT05554835
  status: RECRUITING
  description: >-
    Global mitochondrial disease registry harmonizing prior national
    registries, intended to support natural-history description, outcome-measure
    definition, and trial readiness.
  evidence:
  - reference: clinicaltrials:NCT05554835
    reference_title: Global Mitochondrial Registry to Define Natural History and Outcome Measures to Achieve Definite Trial Readiness for Mitochondrial Disorders
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provision of a global registry for mitochondrial disorders to harmonize previous national registries, enable world-wide participation and facilitate natural history studies, definition of outcome measures and conduction of clinical trials"
    explanation: The registry infrastructure that both the ascertainment gap and the absent trial-ready outcome measure depend on.
differential_diagnoses:
- name: Acute ischemic stroke
  description: >-
    The default misdiagnosis, and the one with therapeutic consequences.
    Separating them rests on lesion distribution that crosses arterial
    territories, posterior predilection, contiguous spread over weeks,
    accompanying seizures, elevated rather than restricted diffusion, focal
    hyperperfusion rather than hypoperfusion, and a lactate peak on
    spectroscopy.
  distinguishing_features:
  - Lesion distribution inconsistent with a vascular territory
  - Progressive spread into adjacent cortex over weeks to months
  - Focal cortical hyperperfusion rather than hypoperfusion
  - Lactate peak on proton MR spectroscopy, including in normal-appearing brain
  - Frequent accompanying focal-onset seizures
  evidence:
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes (MELAS) is a disease that should be considered as a differential diagnosis to acute ischemic stroke taking into account its onset pattern and neurological symptoms, which are similar to those of an ischemic stroke."
    explanation: States the differential explicitly and the reason the two are confused.
- name: MERRF (myoclonic epilepsy with ragged-red fibers)
  description: >-
    Shares ragged-red fibers and strongly SDH-reactive vessels on muscle
    biopsy, so morphology alone does not separate them. The enzyme
    histochemistry does: SSV are cytochrome c oxidase deficient in MERRF and
    COX-normal in MELAS. Overlap syndromes carrying both phenotypes are
    described.
  distinguishing_features:
  - Cytochrome c oxidase activity absent from SSV in MERRF, preserved in MELAS
  - Myoclonus rather than stroke-like episodes as the cardinal feature
  - m.8344A>G in MT-TK rather than m.3243A>G in MT-TL1
  evidence:
  - reference: PMID:8384773
    reference_title: Cytochrome c oxidase activity is deficient in blood vessels of patients with myoclonus epilepsy with ragged-red fibers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of the intramuscular blood vessels in muscle biopsies from five patients with myoclonus epilepsy with ragged-fibers (MERRF) who had a point mutation in mitochondrial DNA at the tRNALys region were darkly stained with succinate dehydrogenase (SDH) stain, showing the morphologic characteristics of strongly SDH-reactive blood vessels (SSV), but they had no cytochrome c oxidase (CCO) activity."
    explanation: Establishes the COX-activity criterion that distinguishes MERRF from MELAS vascular pathology.
- name: Leigh syndrome
  description: >-
    Bilateral symmetrical basal ganglia, thalamic, and brainstem lesions define
    Leigh syndrome, whereas MELAS lesions are cortical and asymmetric.
    MELAS/Leigh overlap is a recognized entity and is enriched for complex I
    subunit variants, particularly MT-ND5 m.13513G>A rather than MT-TL1
    m.3243A>G.
  distinguishing_features:
  - Bilateral symmetrical basal ganglia and brainstem lesions rather than asymmetric cortical lesions
  - Ataxia, spastic paraplegia, and bulbar palsy as leading features
  - Enriched for MT-ND (complex I subunit) variants in overlap cases
  evidence:
  - reference: PMID:34025555
    reference_title: "MELAS/LS Overlap Syndrome Associated With Mitochondrial DNA Mutations: Clinical, Genetic, and Radiological Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen patients were identified with MTND mutations, among which m.13513G>A mutation in the MT-ND5 gene was the most common."
    explanation: Shows the genotype shift toward complex I subunit genes in MELAS/Leigh overlap.
  - reference: PMID:34025555
    reference_title: "MELAS/LS Overlap Syndrome Associated With Mitochondrial DNA Mutations: Clinical, Genetic, and Radiological Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As for the clinical hallmarks of LS, the top three most common symptoms were ataxia, spastic paraplegia, and bulbar palsy."
    explanation: Names the Leigh-syndrome features that separate it clinically from core MELAS.
synonyms:
- MELAS
- Mitochondrial encephalomyopathy, lactic acidosis, and stroke-like episodes
- Mitochondrial myopathy, encephalopathy, lactic acidosis, and stroke-like episodes
experimental_models:
- name: m.3243A>G patient iPSC-derived neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells reprogrammed from m.3243A>G patients, then
    differentiated to neurons and to teratoma-derived tissues. The model exists
    because the mitochondrial genome cannot be edited by transgenic methods, so
    patient cells are the only route to a human m.3243A>G system. Its
    distinctive result is that respiratory-chain deficiency is cell-type
    specific from one shared genotype, with complex I predominating as it does
    in patient tissue, and that neurons additionally clear complex I by
    mitophagy.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:24003133
  modeled_mechanisms:
  - target: Complex I-predominant deficiency and neuronal mitophagy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the complex I-predominant respiratory-chain defect seen in
      MELAS patient tissue and adds the neuron-specific mitophagic clearance
      step.
    limitations: >-
      Heteroplasmy segregates bimodally toward homoplasmy during
      reprogramming, so the clone's mutant load is not the patient's tissue
      load; the model is a cultured neuron rather than cortex, and it cannot
      reproduce a stroke-like episode, which requires vasculature, seizure
      activity, and an intact cortical network.
    readouts:
    - name: Respiratory chain complex I deficiency
      target: Complex I-predominant deficiency and neuronal mitophagy
      direction: DECREASED
      interpretation: Matches the complex I predominance observed in MELAS patient tissues.
      evidence:
      - reference: PMID:24003133
        reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Induced pluripotent stem cell-derived neurons and various tissues derived from teratomas manifested cell-type specific respiratory chain (RC) deficiency patterns. Similar to MELAS patient tissues, complex I defect predominated."
        explanation: The measurement establishing complex I predominance in the model and its correspondence to patient tissue.
    - name: Perinuclear PINK1/Parkin-positive autophagosomal sequestration of complex I
      target: Complex I-predominant deficiency and neuronal mitophagy
      direction: INCREASED
      interpretation: Indicates active mitophagic degradation of complex I on neuronal differentiation.
      evidence:
      - reference: PMID:24003133
        reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Upon neuronal differentiation, complex I specifically was sequestered in perinuclear PTEN-induced putative kinase 1 (PINK1) and Parkin-positive autophagosomes, suggesting active degradation through mitophagy."
        explanation: The imaging readout supporting selective mitophagy of complex I in neurons.
    evidence:
    - reference: PMID:24003133
      reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data show that cellular context actively modifies RC deficiency manifestation in MELAS and that autophagy is a significant component of neuronal MELAS pathogenesis."
      explanation: The authors' own statement that the model is informative for neuronal MELAS pathogenesis.
  notes: >-
    A second use of MELAS iPSC-derived neurons is as a recipient in
    mitochondrial-transfer experiments, where donated mitochondria from
    purified mesenchymal stem cells restored membrane potential, ATP and ROS
    production, calcium storage, and oxygen consumption rate.
  evidence:
  - reference: PMID:38139018
    reference_title: MELAS-Derived Neurons Functionally Improve by Mitochondrial Transfer from Highly Purified Mesenchymal Stem Cells (REC).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, utilizing induced pluripotent stem cells (iPSC), we differentiated neurons with impaired mitochondrial function from patients with MELAS."
    explanation: Independent derivation of MELAS iPSC neurons with an impaired-mitochondrial-function phenotype, used as a therapeutic testbed.
datasets:
- accession: geo:GSE202747
  title: Non-random distribution of mitochondrial m.3243A>G heteroplasmy in human retina and its impact on cellular phenotype
  description: >-
    Single-cell RNA-seq, mitochondrial single-cell ATAC-seq, and multimodal
    single-cell sequencing of retina and choroid from a MELAS donor eye and
    healthy controls, measuring per-cell m.3243A>G heteroplasmy alongside
    transcriptome and chromatin state. SuperSeries; the scRNA, scATAC, and
    multiome SubSeries are GSE202735, GSE202746, and GSE202886 and should not
    be curated separately.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MULTI_OMICS
  sample_count: 36
  publication: PMID:37289546
  notes: >-
    The most directly informative public dataset for the genotype-phenotype
    gap, because it measures heteroplasmy inside a tissue at single-cell
    resolution rather than in an accessible surrogate. Also bears on the
    stroke-like-episode mechanism controversy: in this tissue the
    neuroectoderm-derived neural cells carried a high mutant fraction while the
    mesoderm-derived choroidal vasculature was near-homoplasmic wild-type,
    which is the opposite of what a primarily vascular pathogenesis would
    predict. One donor eye, and retina is not cortex, so it is a lead rather
    than a settled answer.
  evidence:
  - reference: PMID:37289546
    reference_title: Multimodal single-cell analysis of nonrandom heteroplasmy distribution in human retinal mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All neuroectoderm-derived neural cells exhibited a high percentage of the mutant variant. However, a subset of mesoderm-derived lineage, namely the vasculature of the choroid, was near homoplasmic for the WT allele."
    explanation: Shows heteroplasmy partitions non-randomly by cell lineage within one tissue, which is a candidate explanation for organ-level phenotype variation that bulk heteroplasmy cannot capture.
- accession: geo:GSE56158
  title: Transcriptomic analysis of human cybrid cell lines harboring increasing levels of the mitochondrial DNA (mtDNA) 3243A>G mutation
  description: >-
    RNA-seq of isogenic somatic-cell cybrids spanning the complete range of
    m.3243A>G heteroplasmy, with paired cellular phenotyping, designed to test
    how continuous variation in mutant load maps onto discrete clinical
    syndromes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 8
  publication: PMID:25192935
  notes: >-
    Addresses the genotype-phenotype gap from the opposite direction to the
    retina data: one nuclear background, heteroplasmy varied experimentally.
    Its result - that the nucleus has only a few discrete states available - is
    a mechanistic proposal for why a continuous variable produces named
    syndromes. Cybrids are an immortalized non-neural cell line, so the
    thresholds are not directly transferable to patient tissue.
  evidence:
  - reference: PMID:25192935
    reference_title: Progressive increase in mtDNA 3243A>G heteroplasmy causes abrupt transcriptional reprogramming.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Small increases in mutant mtDNAs caused relatively modest defects in oxidative capacity but resulted in sharp transitions in cellular phenotype and gene expression."
    explanation: Demonstrates threshold-like transcriptional switching rather than a graded response, which is the shape a mechanism must have to turn continuous heteroplasmy into discrete syndromes.
  - reference: PMID:25192935
    reference_title: Progressive increase in mtDNA 3243A>G heteroplasmy causes abrupt transcriptional reprogramming.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a major factor in the phenotypic variation in heteroplasmic mtDNA mutations is the limited number of states that the nucleus can acquire in response to progressive changes in mitochondrial retrograde signaling"
    explanation: States the proposed explanation for genotype-phenotype discordance that this dataset was generated to test.
- accession: geo:GSE129091
  title: Quantitative variation in m.3243A>G mutation produce discrete changes in energy metabolism
  description: >-
    Expression profiling of cells carrying low versus high m.3243A>G mutation
    load against wild type, paired with bioenergetic, biogenesis, and
    fuel-catabolism assays, framed explicitly around the MELAS-versus-MIDD
    divergence.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 12
  publication: PMID:30962477
  notes: >-
    Directly targets the question the entry records as open - why the same
    variant yields MELAS at high load and MIDD at low load - and reports that
    the transcriptional signatures are similar while the functional states
    diverge, which argues against expression profiling alone resolving the gap.
  evidence:
  - reference: PMID:30962477
    reference_title: Quantitative Variation in m.3243A > G Mutation Produce Discrete Changes in Energy Metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "despite striking similarities in the energy metabolic gene expression signature, the mitochondrial bioenergetics, biogenesis and fuel catabolic functions are distinct in cells harboring low or high levels of the m.3243 A > G mutation compared to wild type cells"
    explanation: Shows the low-load and high-load states differ functionally while looking alike transcriptionally, a caution for biomarker work that relies on expression signatures.
- accession: geo:GSE14882
  title: Expression data from human blood from MELAS patients and controls
  description: >-
    Affymetrix whole-blood transcriptomes from ten MELAS patients and controls,
    analysed with regulatory- and protein-interaction-network methods to look
    for master regulators and disease-modifying genes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 16
  publication: PMID:21708074
  notes: >-
    One of the few MELAS datasets from an accessible tissue, so it is the
    natural starting point for the prognostic-biomarker gap. It also reports
    correlations between expression change, mutant load, and clinical
    characteristics, which is the genotype-phenotype question in a blood
    sample. Ten patients and a 2011 array platform limit what can be asked of
    it; treat it as a hypothesis source, not a validation set.
  evidence:
  - reference: PMID:21708074
    reference_title: Whole blood genome-wide expression profiling and network analysis suggest MELAS master regulators.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Correlation analyses of gene alterations and clinico-genetic data detected significant correlations between A3243G-induced nuclear gene expression changes and mutant mtDNA load as well as disease characteristics."
    explanation: Establishes that an accessible-tissue transcriptome tracks both mutant load and clinical features, the property a prognostic biomarker would need.
- accession: geo:GSE324301
  title: Mitochondrial DNA heteroplasmy drives cortical neuronal disturbances in human organoids harbouring the common m.3243A>G mutation
  description: >-
    Single-cell RNA-seq of human iPSC-derived cerebral organoid slices carrying
    m.3243A>G at varying heteroplasmy, generated as a cortical model because no
    animal carries the mutation. Reports heteroplasmy-dependent transcriptional
    shifts and preferential impairment of deep-layer neurons with axonal
    degeneration and apoptosis, compared against MELAS brain autopsy.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 7
  notes: >-
    The most direct public response to the human-model-mismatch gap recorded in
    this entry: a model with cortical architecture, which iPSC-derived neuron
    monocultures lack, validated against patient brain tissue. It still cannot
    produce a stroke-like episode - organoid slices have no vasculature and no
    seizure activity - so it addresses neuronal vulnerability rather than the
    episode itself. Deposited 2026 with no linked publication at the time of
    curation, so nothing here is attributed to a peer-reviewed report.
- accession: pride:PXD058785
  title: Metabolic remodelling in hiPSC-derived myofibres carrying the m.3243A>G mutation
  description: >-
    Proteomic, phosphoproteomic, and metabolomic profiling of hiPSC-derived
    muscle fibres carrying variable m.3243A>G heteroplasmy, with membrane
    potential and oxygen consumption measured against mutant load.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: PROTEOMICS
  notes: >-
    Extends the model set beyond neurons to the tissue that produces the
    myopathy, and is heteroplasmy-graded, so it speaks to both the
    human-model-mismatch and genotype-phenotype gaps. No linked publication in
    the repository record at the time of curation.
- accession: geo:GSE61390
  title: Genetic Correction and Metabolic Rescue of Pluripotent Cells from Patients with mtDNA
  description: >-
    Transcriptomes from iPSC lines derived from a MELAS patient with
    heteroplasmic m.3243A>G and from a Leigh syndrome patient, used to evaluate
    generating genetically corrected pluripotent cells as a therapeutic
    strategy.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 43
  publication: PMID:26176921
  notes: >-
    Relevant to the human-model-mismatch gap for a specific reason: it exploits

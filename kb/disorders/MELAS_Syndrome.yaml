- name: Neuronal hyperexcitability and propagating epileptic activity
  biological_scale: CELLULAR
  description: >-
    In the non-ischemic model of the stroke-like episode, focal neuronal
    hyperexcitability arises in a cortical region where mitochondrial
    dysfunction - in neurons, astrocytes, or capillary endothelium - has left
    energy supply unable to meet demand. The resulting epileptic activity
    depolarizes adjacent neurons, which is how a stroke-like lesion spreads
    into contiguous cortex over days to weeks instead of appearing at once in a
    fixed arterial territory. Focal epileptiform discharges and focal cortical
    hyperperfusion, not hypoperfusion, are recorded over the acute lesion.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to measure nitric oxide in individuals with MELAS and see if giving arginine or citrulline will increase the formation of nitric oxide."
    explanation: Registration record for the NO-flux study underpinning arginine and citrulline therapy in MELAS.
- name: NCT04165239
  phase: PHASE_II
  status: COMPLETED
  description: >-
    KHENERGYZE: double-blind, randomized, placebo-controlled three-way

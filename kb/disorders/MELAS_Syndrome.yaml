    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial toxins, including aminoglycoside antibiotics, linezolid,
      cigarettes, and alcohol; valproic acid for seizure treatment; metformin
      because of its propensity to cause lactic acidosis; dichloroacetate (DCA)
      because of increased risk for peripheral neuropathy.
    explanation: >-
      GeneReviews lists agents and circumstances to avoid in MELAS, including
      aminoglycosides, linezolid, valproic acid, metformin, dichloroacetate,
      cigarettes, and alcohol.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Primary clinical home. The defining manifestation is a paroxysmal
      neurological event, and epilepsy, encephalopathy, and progressive
      cognitive decline dominate the course and the causes of death.
    evidence:
    - reference: PMID:36813321
      reference_title: Stroke-like episodes in adult mitochondrial disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stroke-like episode is a paroxysmal neurological manifestation which affects a specific group of patients with mitochondrial disease."
      explanation: Characterizes the cardinal feature of MELAS as a neurological manifestation, supporting the neurologic Part as its primary home.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Second Part for the inheritance axis. Maternal mitochondrial
      transmission with heteroplasmy-dependent expression is a recurring
      theme Harrison's covers separately from any organ system.
    evidence:
    - reference: PMID:26095523
      reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mitochondrial encephalomyopathy, lactic acidosis, and stroke-like
        episodes (MELAS) syndrome is one of the most frequent maternally
        inherited mitochondrial disorders.
      explanation: Establishes MELAS as a maternally inherited mitochondrial disorder, the axis this Part covers.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Third Part for the metabolic and endocrine axis: lactic acidosis is a
      metabolic emergency in its own right, and diabetes is a curated
      phenotype here and the dominant presentation of the same variant in
      its MIDD form.
    evidence:
    - reference: PMID:26095523
      reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MELAS syndrome is a multi-organ disease with broad manifestations
        including stroke-like episodes, dementia, epilepsy, lactic acidemia,
        myopathy, recurrent headaches, hearing impairment, diabetes, and short
        stature.
      explanation: Lists lactic acidemia and diabetes among the core manifestations, supporting the metabolic/endocrine Part alongside the neurologic one.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Primary mitochondrial disease: the causal lesion is in the
      mitochondrial genome and the proximate defect is in mitochondrial
      translation and oxidative phosphorylation.
  icimd_category:
  - classification_value: mtdna_encoded_trna_rrna
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      mtDNA-encoded tRNA and rRNA genes" under category 6, "Mitochondrial
      DNA-related disorders". Covers the MT-TL1 genotypes - m.3243A>G and
      m.3271T>C - that account for the large majority of MELAS.
  - classification_value: mtdna_encoded_respiratory_chain_proteins
    notes: >-
      Second ICIMD group for the minority of MELAS caused by variants in the
      mtDNA protein-coding complex I subunits MT-ND1, MT-ND5, and MT-ND6,
      curated here as the "MT-ND5 and other genes" subtype. The entry
      genuinely spans both groups because the two genotype classes reach the
      same syndrome by different molecular routes - a translation defect
      versus a structural subunit defect.

      causal variant rather than a parent and a subtype. relatedMatch also
      correctly leaves MIDD in the curation queue as a disease still owed its
      own entry.
discussions:
- discussion_id: melas_sle_ischemic_versus_hyperexcitable
  prompt: >-
    Is the stroke-like episode an ischemic event caused by mitochondrial
    angiopathy, or a non-ischemic neurovascular event initiated by neuronal
    hyperexcitability?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Mitochondrial angiopathy and NO deficiency
  - pathophysiology#Neuronal hyperexcitability and propagating epileptic activity
  - mechanistic_hypotheses#ischemic_vascular_angiopathy
  - mechanistic_hypotheses#neuronal_hyperexcitability
  - datasets#geo:GSE127478
  - datasets#geo:GSE154825
  - datasets#geo:GSE165953
  - datasets#geo:GSE202747
  rationale: >-
    This is the central unresolved question in MELAS and it is not academic: the two models point at different treatments. The vascular model motivates nitric-oxide repletion (arginine, citrulline, soluble guanylate cyclase stimulators); the hyperexcitability model makes aggressive seizure control the priority. The imaging and electrophysiology favour the non-ischemic account - lesions cross vascular territories, ADC is typically elevated, perfusion is focally increased rather than decreased, and epileptiform discharges are recorded over the acute lesion. But the vascular findings are not artefacts either: strongly SDH-reactive vessels are present on muscle biopsy in about 70% of patients, plasma arginine, NO and cGMP are reduced, and diffusion restriction does occur inside some lesions. One proposed synthesis is that capillary angiopathy supplies a leaky substrate on which epileptic activity produces cortical vasogenic edema. This remains a hypothesis; neither the necessity of both components
    nor their causal order is established.

    Public data now let both arms be interrogated in isogenic human cells, which is new. On the vascular side GSE127478 shows m.3243A>G endothelium is cell-autonomously dysfunctional, pro-inflammatory, and pro-atherogenic. On the neuronal side GSE154825 records network-level electrical activity alongside transcriptome and finds reduced presynaptic gene expression plus non-cell-autonomous changes in co-cultured astrocytes, which is the neuron-astrocyte uncoupling variant made measurable; GSE165953 supplies a heteroplasmy-scaled glutamate mechanism confirmed in MELAS post-mortem brain. One dataset cuts against the vascular arm: in GSE202747 the choroidal vasculature of a MELAS eye was near-homoplasmic wild-type while the neural lineages carried a high mutant fraction. That is one donor and one tissue, and retina is not cortex, so it is a lead rather than a refutation - but a vascular hypothesis does need the vessels to carry the mutation.
  evidence:
  - reference: PMID:16181098
    reference_title: "Pathogenesis of stroke-like episodes in MELAS: analysis of neurovascular cellular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of stroke-like episodes in mitochondrial encephalopathy, myopathy, lactic acidosis and stroke-like episodes (MELAS) is not fully understood although two main theories have been proposed; ischemic vascular hypothesis caused by \"mitochondrial angiopathy\" and generalized cytopathic hypothesis caused by \"mitochondrial cytopathy\"."
    explanation: States the controversy in the terms in which the field frames it.
  - reference: PMID:34118021
    reference_title: "Clinical features, pathogenesis, and management of stroke-like episodes due to MELAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the precise pathophysiology is still unclear, one possible hypothesis for these episodes is a neuronal hyperexcitability theory, including neuron-astrocyte uncoupling."
    explanation: Confirms that as of recent review the mechanism remains unsettled.
- discussion_id: melas_episode_trigger_gap
  prompt: >-
    What converts the chronic, constant energy deficit of MELAS into a discrete
    stroke-like episode at a particular time and a particular cortical site?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal hyperexcitability and propagating epileptic activity
  - pathophysiology#Stroke-like episodes
  - datasets#geo:GSE27545
  rationale: >-
    The heteroplasmy load and the respiratory-chain defect are present
    continuously, yet stroke-like episodes are paroxysmal, recur at
    unpredictable intervals, and favour posterior cortex. Nothing in the
    current models explains the timing or the site selection. The 2002 study
    that established the hyperexcitability mechanism said so explicitly and the
    gap has not closed since. Until it does, prophylaxis cannot be targeted at
    the trigger, only at the substrate, and trials are forced to use episode
    counts over long windows as their endpoint.

    A survey of public repositories found no dataset that addresses the timing
    question, and that absence is structural rather than an oversight: every
    public MELAS dataset is a cross-sectional snapshot of cells or post-mortem
    tissue, and an episode is a transition in a living cortex. The closest
    available is GSE27545, which proposes a self-aggravating
    RXRA-ROS-JNK-PGC1alpha retrograde loop - a candidate account of why a fixed
    mtDNA lesion produces progressive rather than static dysfunction, though
    not of why deterioration is punctuated by discrete episodes. Closing this
    gap needs prospective human monitoring, not another omics deposit.
  proposed_experiments:
  - experiment_id: melas_prospective_prodrome_monitoring
    name: Prospective multimodal monitoring across the transition into a stroke-like episode
    description: >-
      Follow a cohort of m.3243A>G carriers with recurrent episodes using
      longitudinal EEG, MR spectroscopy and perfusion imaging at fixed
      intervals and at symptom onset, to determine whether measurable
      hyperexcitability, lactate accumulation, or perfusion change precedes the
      clinical episode and by how long.
    would_support:
    - pathophysiology#Neuronal hyperexcitability and propagating epileptic activity
    supporting_outcome:
    - >-
      Epileptiform activity or a rising regional lactate signal appears in the
      subsequently affected cortex before the clinical deficit, identifying a
      prodromal window and a treatable initiating step.
    refuting_outcome:
    - >-
      No electrophysiological or metabolic change precedes the deficit, placing
      the initiating event outside cortical excitability and outside current
      monitoring reach.
  evidence:
  - reference: PMID:12297560
    reference_title: Neuronal hyperexcitability in stroke-like episodes of MELAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The episodic nature of stroke-like episodes is unexplained."
    explanation: The authors of the founding hyperexcitability study state this gap directly.
- discussion_id: melas_genotype_phenotype_gap
  prompt: >-
    Why does one variant, m.3243A>G, produce MELAS in some carriers, MIDD or
    isolated deafness in others, and nothing at all in a further group?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#MT-TL1 m.3243A>G
  - inheritance#Mitochondrial inheritance
  - datasets#geo:GSE202747
  - datasets#geo:GSE56158
  - datasets#geo:GSE129091
  - datasets#geo:GSE85549
  - datasets#massive:MSV000088237
  - datasets#geo:GSE1462
  rationale: >-
    Only about 10% of m.3243A>G carriers in a systematically phenotyped cohort
    had classical MELAS, while 30% had MIDD, 28% had a combination fitting no
    recognized syndrome, and 9% were asymptomatic. Heteroplasmy level is the
    conventional explanation, but measured heteroplasmy explains far less than
    it is credited with: it did not correlate with disease severity in
    leukocytes or urinary epithelial cells, and it did not correlate with the
    grade of retinal dystrophy either. Tissue-specific segregation, nuclear
    genetic background, mtDNA copy number, and age are all candidate modifiers,
    and none has been shown to account for the variance. This is what makes
    genetic counselling and prognosis in m.3243A>G families so weak.

    Four public datasets attached here attack the gap from different angles and
    are worth reading against each other. GSE202747 measures heteroplasmy per
    cell in a human MELAS tissue and finds it partitions by developmental
    lineage rather than randomly, which would make any single bulk measurement
    a poor proxy. GSE56158 varies heteroplasmy experimentally in one nuclear
    background and finds sharp transcriptional transitions rather than a
    gradient, offering a mechanism by which a continuous variable yields named
    syndromes. GSE129091 compares low against high load directly on the
    MELAS-versus-MIDD axis and reports that the two look alike
    transcriptionally while differing functionally. GSE85549 moves the question
    from heteroplasmy to allele, comparing the MELAS m.3243A>G lesion against
    the myopathy-causing m.3302A>G in the same gene. MSV000088237 extends the
    allele question outside MT-TL1 entirely, profiling fibroblasts from a
    patient with the complex I subunit variant m.14453G>A. GSE1462 is the only
    one that holds genotype constant and varies phenotype in patients - four
    PEO against four MELAS, all m.3243A>G, all muscle - and its authors read
    the difference as support for nuclear background as the modifier. That is
    the right experimental design for this gap, at a sample size and on a 2005
    platform that cannot settle it.
  evidence:
  - reference: PMID:23355809
    reference_title: "The UK MRC Mitochondrial Disease Patient Cohort Study: clinical phenotypes associated with the m.3243A>G mutation--implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "28% of patients demonstrated a panoply of clinical features, which were not consistent with any of the classical syndromes associated with the m.3243A>G mutation. 9% of individuals harbouring the mutation were clinically asymptomatic."
    explanation: Quantifies how poorly the classical syndrome labels partition the m.3243A>G carrier population.
  - reference: PMID:24907231
    reference_title: "Serum FGF21 levels in adult m.3243A>G carriers: clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant correlations were found between disease severity and the heteroplasmy percentage determined in urinary epithelial cells or the heteroplasmy percentage determined in leukocytes."
    explanation: Shows that accessible-tissue heteroplasmy does not explain severity, leaving the modifier question open.
- discussion_id: melas_prognostic_biomarker_gap
  prompt: >-
    Is there any accessible biomarker that predicts the course of m.3243A>G
    disease in an individual patient?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Fibroblast growth factor 21 (FGF-21)
  - biochemical#Blood lactate
  - genetic#MT-TL1 m.3243A>G
  - datasets#geo:GSE89066
  - datasets#geo:GSE14882
  - datasets#geo:GSE165953
  - datasets#geo:GSE113300
  rationale: >-
    The two obvious candidates both fail. Urinary epithelial cell heteroplasmy,
    widely used in cohort studies to index genotype against severity, varies by
    more than 20 percentage points between samples taken from the same patient
    within a fortnight, so it should not be used prognostically at all. FGF-21
    correlates only moderately with cross-sectional severity and not at all
    with progression over two years. What is left is crude and non-specific:
    severe lactate elevation and anemia predict mortality. A trial-ready
    surrogate endpoint for MELAS therefore does not currently exist, which is
    part of why efficacy trials must run for a year on clinical outcomes.

    The attached datasets are the accessible-tissue starting points, and their
    limits are as informative as their content. GSE14882 is whole blood from
    ten MELAS patients with expression changes correlated to mutant load and
    clinical features - the right design, at a sample size and on an array
    platform that cannot support validation. GSE165953 nominates glutamate as a
    biomarker and, unusually, confirms the dysregulation in MELAS post-mortem
    brain. GSE113300 profiles miRNAs, the class most likely to survive in
    plasma, but does so in a homoplasmic cybrid rather than in patients.
    GSE89066 is the closest to a proper biomarker study - 20 patients against
    20 controls, independent validation, and a serum miRNA benchmarked against
    lactate - but its endpoint is diagnosis, not prognosis. No public MELAS
    dataset currently pairs a candidate marker with longitudinal clinical
    outcome, which is precisely the study FGF-21 failed.
  evidence:
  - reference: PMID:30516030
    reference_title: Intra-patient variability of heteroplasmy levels in urinary epithelial cells in carriers of the m.3243A>G mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heteroplasmy levels of UEC in carriers of the m.3243A>G mutation have a significant day-to-day variation. The interpretation of a correlation between heteroplasmy levels in urine and disease severity is therefore not reliable."
    explanation: Disqualifies urinary heteroplasmy as a prognostic measure on reproducibility grounds.
  - reference: PMID:24907231
    reference_title: "Serum FGF21 levels in adult m.3243A>G carriers: clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measuring FGF21 concentration had little added value in monitoring and predicting the disease course in this specific patient group."
    explanation: Disqualifies FGF-21 as a monitoring biomarker in m.3243A>G carriers.
- discussion_id: melas_arginine_evidence_gap
  prompt: >-
    Does L-arginine actually prevent or shorten stroke-like episodes, or is its
    widespread use resting on uncontrolled data?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#L-arginine therapy
  - mechanistic_hypotheses#ischemic_vascular_angiopathy
  - datasets#massive:MSV000088237
  rationale: >-
    L-arginine is standard practice in many centres for both acute and
    prophylactic use, and the supporting data are real but uncontrolled: the
    efficacy studies were unblinded, and the survival comparison was against
    natural history rather than a randomized control arm. A 2023 review states
    flatly that there is no robust evidence of efficacy in either setting. This
    matters more than a generic call for better trials, because the newer
    soluble guanylate cyclase stimulators target the same NO-cGMP axis: if the
    axis is not the operative mechanism of the stroke-like episode, a whole
    therapeutic programme is aimed at the wrong node. Contrast taurine, whose
    prevention claim rests on a prospective multicentre phase III trial.

    One public dataset speaks to the rationale rather than the efficacy
    question, and is worth separating from it. MSV000088237 reports
    downregulated arginine biosynthesis via blocked argininosuccinate synthase
    in MELAS patient fibroblasts - a cell-intrinsic route to arginine
    deficiency, not merely the reduced plasma arginine the therapy was built
    on. That strengthens the mechanistic case for supplying arginine while
    leaving the clinical question exactly where it was: no dataset can
    substitute for the randomized trial that has never been run.
  evidence:
  - reference: PMID:36813321
    reference_title: Stroke-like episodes in adult mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no robust evidence to prove the efficacy of l-arginine for both acute and prophylactic settings."
    explanation: Explicit statement that the evidence base for the most widely used MELAS therapy is inadequate.
  - reference: PMID:26095523
    reference_title: "MELAS syndrome: Clinical manifestations, pathogenesis, and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unblinded studies showed that l-arginine therapy improves stroke-like episode symptoms and decreases the frequency and severity of these episodes."
    explanation: The supporting evidence, with its uncontrolled design stated in the source itself.
- discussion_id: melas_human_model_mismatch
  prompt: >-
    Can any available model system reproduce a stroke-like episode, or is the
    defining feature of MELAS accessible only in patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - experimental_models#m.3243A>G patient iPSC-derived neurons
  - pathophysiology#Neuronal hyperexcitability and propagating epileptic activity
  - pathophysiology#Cortical laminar necrosis and progressive lesion spread
  - datasets#geo:GSE324301
  - datasets#pride:PXD058785
  - datasets#geo:GSE61390
  rationale: >-
    MELAS has no faithful animal model, and the reason is structural rather
    than incidental: the mitochondrial genome cannot be edited with transgenic
    technology, so a targeted m.3243A>G animal cannot be made the way a nuclear
    knock-in can. The nearest attempt reached mouse ES cells carrying an
    orthologous tRNA-Leu(UUR) mutation with respiration defects, explicitly
    framed as a step toward a future model rather than a model itself. Patient
    iPSC-derived neurons are the best available human system and do reproduce
    the complex I-predominant deficiency, but they cannot produce a stroke-like
    episode, which needs cortex, vasculature, and seizure activity together;
    and heteroplasmy segregates toward homoplasmy during reprogramming, so
    clonal mutant load is not patient tissue load. Cultured patient cells often
    fail to manifest a phenotype at all. Consequently every mechanistic claim
    about the stroke-like episode itself rests on human imaging,
    electrophysiology, and autopsy - which is precisely why the controversy
    above has stayed open for two decades.

    The public model datasets attached here show the workaround maturing rather
    than the gap closing. GSE324301 is a cerebral organoid slice model with
    cortical architecture, generated explicitly because no animal carries the
    mutation, and its deep-layer neuron degeneration was checked against MELAS
    brain autopsy - a real advance on neuron monoculture. PXD058785 extends the
    approach to skeletal muscle with graded heteroplasmy. GSE61390 turns the
    reprogramming bottleneck into an asset by deriving isogenic corrected
    lines. What none has is vasculature plus network seizure activity plus
    cortex in one system, so the stroke-like episode itself remains unmodelled.
  evidence:
  - reference: PMID:25416367
    reference_title: Induced pluripotent stem cell-derived models for mtDNA diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Targeted modification of the mitochondrial genome has not succeeded with the current transgenic technologies. Furthermore, readily available cultured patient cells often do not manifest the disease phenotype."
    explanation: >-
      States both halves of the modelling problem for mtDNA disease - no
      transgenic route, and weak phenotypes in patient cells.
  - reference: PMID:26381171
    reference_title: Mouse somatic mutation orthologous to MELAS A3302G mutation in the mitochondrial tRNA(Leu(UUR)) gene confers respiration defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the ES cells harboring A2748G mtDNA may be useful for generation of transmitochondrial mice harboring A2748G mtDNA as potential disease models of MELAS"
    explanation: The nearest available rodent work is framed as a precursor to a future model, confirming that no such mouse yet exists.
  - reference: PMID:24003133
    reference_title: Tissue- and cell-type-specific manifestations of heteroplasmic mtDNA 3243A>G mutation in human induced pluripotent stem cell-derived disease model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During reprogramming, heteroplasmic mtDNA showed bimodal segregation toward homoplasmy, with concomitant changes in mtDNA organization, mimicking mtDNA bottleneck during epiblast specification."
    explanation: Documents the heteroplasmy shift during reprogramming that limits how directly iPSC clones represent patient tissue.
- discussion_id: melas_renal_gi_ascertainment_gap
  prompt: >-
    How much of the MELAS phenotype outside the nervous system is genuinely
    absent versus simply not looked for?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Proteinuria
  - phenotypes#Intestinal pseudo-obstruction
  - phenotypes#Hypertrophic cardiomyopathy
  - clinical_trials#NCT01532791
  - clinical_trials#NCT05554835
  rationale: >-
    Three organ systems are described in their own literatures as
    under-recognized in m.3243A>G disease. Renal involvement is called probably
    underestimated; oligosymptomatic and kidney-limited m.3243A>G presentations
    can be difficult to recognize. Intestinal pseudo-obstruction is
    under-recognized and can be the presenting problem. Cardiac involvement has
    rarely been studied prospectively, which the reviewers themselves offer as
    the reason its reported incidence looks lower than expected. GeneReviews
    provides syndrome-level frequency intervals for cardiomyopathy, conduction
    abnormalities, and nephropathy. The 2025 cardiac study supplies a
    right-bundle-branch-block denominator among 11 clinical MELAS participants,
    but participation from 30 contacted patients was limited by severity and
    deaths. Neither those results nor the GeneReviews intervals close the
    separate ascertainment gap in unselected m.3243A>G carriers. This is the one
    gap in the entry that omics deposits cannot close, because it is a sampling
    problem rather than a mechanistic one - and a survey of public repositories
    bore that out, returning no dataset that changes the denominator. The
    relevant public resources are instead the two natural-history efforts
    attached here: NCT01532791, which recruits through maternal relatives of
    known carriers regardless of their own carrier status and uses paternal
    relatives as controls, and NCT05554835, which harmonizes national registries
    into a global cohort. A related class-level resource, Metabolomics Workbench
    study ST003924, profiles urinary metabolites in genetically confirmed
    paediatric primary mitochondrial disorders with an explicitly renal framing,
    but its sample factors record only the disease-class label, so MELAS cases
    cannot be identified within it and it is deliberately not curated as a MELAS
    dataset here.
  evidence:
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac involvement in m.3243A>G carriers has been only rarely systematically studied, which is perhaps why the incidence of cardiac diseases in MELAS is lower than would be expected."
    explanation: The reviewers attribute the low reported cardiac incidence to ascertainment rather than to biology.
  - reference: PMID:38355238
    reference_title: Renal manifestations in adults with mitochondrial disease from the mtDNA m.3243A>G pathogenic variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Not frequently reported, renal involvement in these diseases is probably underestimated, yet it increases morbidity."
    explanation: States the same ascertainment problem for the kidney.
- discussion_id: melas_phenotype_mechanistic_resolution
  prompt: Which tissue-specific mechanisms explain the remaining clinical manifestations in clinically defined MELAS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Migraine-like headaches
  - phenotypes#Short stature
  - phenotypes#Learning disability
  - phenotypes#Progressive external ophthalmoplegia
  - phenotypes#Ptosis
  - phenotypes#Wolff-Parkinson-White syndrome
  - phenotypes#Anemia
  - phenotypes#Cerebellar atrophy
  - phenotypes#Basal ganglia calcification
  - phenotypes#Cardiac conduction abnormality
  - phenotypes#Ataxia
  - phenotypes#Right bundle branch block
  rationale: >-
    The remaining clinical gaps have distinct evidence limitations. GeneReviews
    supports migraine as a possible trigger of stroke-like episodes, now
    represented in that direction; it does not establish the cause of migraine or
    a reverse cortical-injury-to-migraine relation. Short stature and learning
    disability are documented clinically, but the reviewed sources do not
    identify a phenotype-specific causal relation from the curated mechanisms;
    learning disability is not interchangeable with acquired dementia. The
    m.3243A>G cohort documents MELAS/PEO overlap without establishing the causal
    sequence from generalized myopathy to extraocular dysfunction. The ptosis
    case provides occurrence evidence, including a prior myasthenia diagnosis,
    without establishing eyelid-muscle pathogenesis. Broad conduction
    abnormalities, right bundle branch block, and Wolff-Parkinson-White syndrome
    are documented, but the reviewed sources do not establish their causal route
    from the curated myocardial remodeling mechanism or explain how mitochondrial
    dysfunction produces an accessory conduction pathway. The anemia cohort
    explicitly leaves dietary and other contributors unresolved. The imaging
    study documents cerebellar atrophy and basal ganglia calcification but does
    not establish their causal route from the cortical stroke-like lesion
    mechanism. Its suggestion of dystrophic calcification does not identify the
    initiating injury. Lactate, ragged-red fibers, and focal epileptiform EEG
    discharges are linked separately as observational readouts. GeneReviews
    documents ataxia without assigning it to the cortical injury mechanism or
    establishing that the imaged cerebellar atrophy causes it. The cardiac review
    supports a qualified remodeling-to-arrhythmia relation, now represented, but
    the right bundle branch block case is not causally assigned to that
    remodeling route by the observational cohort. These gaps concern causal
    attribution, not a requirement to identify every intermediate step.
  evidence:
  - reference: PMID:39697439
    reference_title: 'Long-term prognostic factors and outcomes in mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes: a clinical and biochemical marker analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study found that 30.8% of patients exhibited anemia, a slightly higher proportion than expected, potentially influenced by patient selection criteria, though dietary or other factors affecting hemoglobin levels could not be ruled out.
    explanation: The authors explicitly leave the causes of anemia unresolved.
  - reference: PMID:23355809
    reference_title: "The UK MRC Mitochondrial Disease Patient Cohort Study: clinical phenotypes associated with the m.3243A>G mutation--implications for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10% of patients exhibited a classical MELAS phenotype, 30% had MIDD, 6% MELAS/MIDD, 2% MELAS/chronic PEO (CPEO) and 5% MIDD/CPEO overlap syndromes."
    explanation: Quantifies the MELAS/CPEO overlap within the m.3243A>G phenotypic spectrum.
  - reference: PMID:28242802
    reference_title: Uncommon mutation in mitochondrial encephalomyopathy, lactic acidosis and stroke-like episodes (MELAS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The latter observation is interesting in the context of our patient who presented with bilateral ptosis at the age of 6 years which was misdiagnosed as myasthaenia gravis.
    explanation: The case was subsequently diagnosed with MT-ND5 m.13513G>A MELAS; this supports occurrence, not a general frequency or a proven eyelid-muscle mechanism.
  - reference: PMID:36685235
    reference_title: 'Mitochondrial encephalomyopathy with lactic acidosis and stroke-like episodes with an MT-TL1 m.3243A>G point mutation: Neuroradiological features and their implications for underlying pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bilateral basal ganglia calcifications were found in 6 of 9 (67%) patients who underwent CT.
    explanation: Documents calcification in the selected CT subgroup, not an unselected MELAS population.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1233/
    reference_title: MELAS - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the form of recurrent attacks of severe pulsatile headaches with frequent vomiting are typical in individuals with MELAS and can precipitate stroke-like episodes.
    explanation: >-
      Supports the outgoing trigger relation; it does not identify the cause of
      migraine.
- discussion_id: melas_cardiac_carrier_scope
  prompt: Which cardiac findings reported across m.3243A>G carriers can be assigned specifically to clinically defined MELAS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Cardiac conduction abnormality
  - phenotypes#Wolff-Parkinson-White syndrome
  - phenotypes#Cardiomyopathy
  - phenotypes#Hypertrophic cardiomyopathy
  - phenotypes#Arrhythmia
  - phenotypes#Right bundle branch block
  rationale: >-
    The systematic cardiac review pools m.3243A>G carriers with MELAS, MIDD,
    MERRF, Leigh syndrome, and MELAS/KSS overlap. It reports left and right
    bundle branch block, supraventricular and ventricular arrhythmias, sinus
    tachycardia, atrial fibrillation, nonsustained ventricular tachycardia, and
    sudden cardiac death. Its myocardial spectrum includes thickening,
    hypertrophic and dilated cardiomyopathy, noncompaction, fibrosis, systolic
    dysfunction, heart failure, and arterial hypertension; myocardial
    abnormalities are reported more often than arrhythmias or conduction defects.
    These observations remain relevant to cardiac assessment, but the review
    abstract does not assign each manifestation or its frequency to a MELAS
    subgroup. GeneReviews independently supports MELAS cardiomyopathy, broad
    conduction abnormalities, and WPW, and recommends ECG and echocardiographic
    surveillance. Independent clinical MELAS evidence does establish right bundle
    branch block in a selected 11-patient cohort and non-sustained atrial
    tachycardia in a case report; these are now represented using those sources.
    The clinical review also describes atrial fibrillation and ventricular
    tachycardia and proposes conduction-pathway mitochondrial dysfunction, while
    the cardiac cohort review describes a remodeling-to-rhythm-disorder route.
    Sudden cardiac death and left bundle branch block remain carrier-spectrum
    observations here because the reviewed primary reports do not establish those
    outcomes in their MELAS patients. Prophylactic device recommendations are not
    evidence that a sudden-death event occurred.
  evidence:
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The m.3243A>G variant may manifest phenotypically as mitochondrial
      encephalopathy, lactic acidosis, and stroke-like episodes (MELAS), maternally
      inherited diabetes and deafness (MIDD), myoclonic epilepsy with ragged red
      fiber (MERRF), Leigh syndrome, or MELAS/KSS (Kearns-Sayre syndrome) overlap.
    explanation: >-
      Defines the pooled syndromic scope of the carrier review.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myocardial abnormalities include myocardial thickening, hypertrophic
      cardiomyopathy, dilated cardiomyopathy, noncompaction, myocardial fibrosis,
      systolic dysfunction, heart failure, or arterial hypertension.
    explanation: >-
      Preserves the reported myocardial spectrum at carrier-population scope.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arrhythmias reported in m.3243A>G carriers include paroxysmal
      supraventricular or ventricular arrhythmias, including sinus tachycardia,
      atrial fibrillation and nonsustained ventricular tachycardia, and sudden
      cardiac death.
    explanation: >-
      Preserves clinically relevant arrhythmia and sudden-death reports without
      transferring them to a MELAS subgroup that the abstract does not identify.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conduction defects in this group of patients include Wolff-Parkinson-White
      syndrome and left/right bundle branch block.
    explanation: >-
      Preserves bundle branch block as a carrier-spectrum observation; the
      antecedent population is all reviewed m.3243A>G carriers.
  - reference: PMID:30128910
    reference_title: The heart in m.3243A>G carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myocardial abnormalities are much more frequent than arrhythmias or
      conduction defects.
    explanation: >-
      This comparison applies to the review population; it is not a MELAS-specific
      frequency estimate.
  - reference: PMID:26937404
    reference_title: Arrhythmia as a cardiac manifestation in MELAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, this is the unique case of a 44-year old female with a genetic
      diagnosis of MELAS syndrome with the associated cardiac manifestations of
      left ventricular hypertrophy and atrial tachycardia.
    explanation: >-
      Provides independent clinical MELAS arrhythmia evidence.

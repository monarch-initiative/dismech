diagnosis:
- name: Rickettsial qPCR on blood or cutaneous lesions
  description: >-
    Real-time PCR on early blood or cutaneous-lesion specimens can detect
    rickettsial DNA, with R. australis-specific assays available in reference
    laboratory panels.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: A positive PCR from blood, eschar swab, or biopsy supports early molecular confirmation.
  evidence:
  - reference: PMID:22092999
    reference_title: Widespread use of real-time PCR for rickettsial diagnosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We retained sets of primers and probes to detect spotted fever group
      Rickettsia, typhus group Rickettsia,Rickettsia conorii,Rickettsia
      slovaca,Rickettsia africae and Rickettsia australis
    explanation: >-
      The molecular-diagnostics evaluation included a validated R. australis
      real-time PCR primer/probe set in its routine rickettsial panel.
  - reference: PMID:31587667
    reference_title: "Diagnosis of spotted fever group Rickettsia infections: the Asian perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is likely that the best strategy is to use a real-time quantitative
      polymerase chain reaction (qPCR) and immunofluorescence assay in tandem.
    explanation: >-
      The diagnostic review supports pairing early qPCR with serology to span
      the time windows of nucleic-acid and antibody detection.

- name: Indirect immunofluorescence assay serology
  description: >-
    Serology is needed to separate QTT from clinically overlapping Australian
    rickettsioses, although antibody results are often retrospective because
    acute samples can be negative before seroconversion.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: A compatible illness plus rickettsial antibody rise supports retrospective confirmation.
  evidence:
  - reference: PMID:1962102
    reference_title: Spotted fever group rickettsial infections in Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because clinical features overlap, serologic tests are necessary to
      distinguish QTT from other endemic Australian rickettsial diseases (scrub
      and murine typhus).
    explanation: >-
      The Australian review identifies serology as necessary for distinguishing
      QTT from scrub typhus and murine typhus in the same region.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line empiric therapy for suspected tick-borne
    rickettsial disease, including Queensland tick typhus, because it inhibits
    the rickettsial 30S ribosomal subunit and reaches the host-cell cytosol
    where R. australis resides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Doxycycline blocks rickettsial protein synthesis at the 30S ribosomal subunit.
  - target: Intracytosolic Rickettsia australis Niche
    treatment_effect: BYPASSES
    description: Doxycycline can reach the cytosolic rickettsial compartment.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      QTT is a tick-borne rickettsial disease, so this CDC first-line treatment
      recommendation covers empiric therapy for suspected QTT.
  - reference: PMID:33075531
    reference_title: "Prompt defervescence after initiation of treatment for rickettsial infections - time to dispense with the dogma?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant proportion of patients with confirmed scrub typhus and QTT
      will remain febrile for >48 hours after appropriate anti-rickettsial
      therapy.
    explanation: >-
      The tropical Australia cohort cautions that delayed defervescence after
      appropriate therapy can occur in confirmed QTT and does not by itself
      exclude the diagnosis.

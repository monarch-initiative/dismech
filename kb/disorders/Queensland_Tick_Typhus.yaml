transmission:
- name: Ixodes tick bite inoculation
  description: >-
    R. australis is transmitted to humans by the hard ticks Ixodes holocyclus
    and Ixodes tasmani in eastern Australia.
  evidence:
  - reference: PMID:1962102
    reference_title: Spotted fever group rickettsial infections in Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two tick vectors of R. australis have been identified: Ixodes holocyclus and Ixodes tasmani."
    explanation: >-
      The Australian spotted-fever review names the two confirmed vectors of the
      etiologic agent of Queensland tick typhus.

epidemiology:
- name: Eastern coastal Australian tick exposure
  description: >-
    Queensland tick typhus follows exposure to tick habitat along the eastern
    Australian coast, spanning tropical Queensland and temperate southeastern
    coastal regions.
  factors:
  - eastern Australia tick exposure
  - Ixodes tick exposure
  evidence:
  - reference: PMID:1962102
    reference_title: Spotted fever group rickettsial infections in Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, available serologic, epidemiologic, and clinical data suggest
      that QTT is not confined to the area in which R. australis was first
      isolated (Queensland); rather, it occurs along a 3,200-km span of eastern
      coastal Australia, from tropical to temperate climates.
    explanation: >-
      The review places QTT along the eastern Australian coastline rather than
      limiting it to Queensland.

pathophysiology:
- name: Ixodes-Borne Rickettsia australis Inoculation
  role: trigger
  description: >-
    Infected I. holocyclus or I. tasmani ticks inoculate R. australis into the
    dermis during a blood meal, initiating a localized cutaneous rickettsial
    infection at the bite site.
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:1962102
    reference_title: Spotted fever group rickettsial infections in Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only two tick vectors of R. australis have been identified: Ixodes holocyclus and Ixodes tasmani."
    explanation: >-
      The confirmed tick vectors define the arthropod route that deposits R.
      australis into skin.
  downstream:
  - target: Dermal Macrophage Rickettsia australis Infection
    causal_link_type: DIRECT
    description: Tick inoculation exposes dermal phagocytes to R. australis.

- name: Dermal Macrophage Rickettsia australis Infection
  role: primary_infection
  description: >-
    After tick inoculation, rickettsiae infect dermal mononuclear phagocytes.
    Mouse R. australis infection shows that macrophages are an early permissive
    niche, and the broader rickettsial sequence carries organisms from these
    skin cells through draining lymphatics before hematogenous endothelial
    seeding.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30297526
    reference_title: Atg5 Supports Rickettsia australis Infection in Macrophages In Vitro and In Vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Macrophages are one of the initial targets for rickettsiae after
      inoculation by ticks.
    explanation: >-
      The R. australis mouse and macrophage study identifies macrophages as
      early host cells after tick inoculation.
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsiae then spread via lymphatic vessels to the regional lymph nodes
      as has been observed vividly in the lymphangitis associated with R.
      sibirica mongolitimoniae infection
    explanation: >-
      The rickettsial pathogenesis review supports lymphatic spread from the
      inoculation site toward draining nodes as a conserved transition between
      dermal infection and systemic spread.
  downstream:
  - target: Rickettsial Endothelial Infection and Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsiae disseminate from the skin to the systemic microvasculature.
  - target: Eschar
    causal_link_type: DIRECT
    description: Local inoculation-site infection produces a necrotic eschar.
  - target: Regional Lymphadenopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Drainage from the inoculation site enlarges regional lymph nodes.

- name: Rickettsial Endothelial Infection and Vasculitis
  role: vascular_response
  description: >-
    Disseminated R. australis is inferred, like pathogenic Rickettsia species
    generally, to infect microvascular endothelial cells and provoke the
    endothelial inflammation, loss of vascular integrity, and permeability
    defect called rickettsial vasculitis.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now well established that a majority of sequelae associated with
      human rickettsioses are the outcome of the pathogen's affinity for
      endothelium lining the blood vessels, the consequences of which are
      vascular inflammation, insult to vascular integrity and compromised
      vascular permeability, collectively termed 'Rickettsial vasculitis'.
    explanation: >-
      This conserved rickettsial mechanism accounts for the rash and systemic
      manifestations after R. australis leaves the inoculation site.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic endothelial infection and inflammation produce fever.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic infection produces headache as part of the acute febrile syndrome.
  - target: Vesicular Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous rickettsial vasculitis produces the variable vesicular rash.

- name: TLR4-ASC-MyD88 Rickettsia australis Innate Control
  description: >-
    TLR4-dependent ASC inflammasome activation and MyD88-dependent dendritic-cell
    instruction promote IL-1 beta, IL-18, IL-6, IL-12, and IFN-gamma responses
    that restrict R. australis growth in macrophages and infected tissues.
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
  - preferred_term: innate immune response
    term:
      id: GO:0045087
      label: innate immune response
  evidence:
  - reference: PMID:32014896
    reference_title: Activation of ASC Inflammasome Driven by Toll-Like Receptor 4 Contributes to Host Immunity against Rickettsial Infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, these observations indicate that activation of ASC
      inflammasome, most likely driven by interaction of TLR4 with rickettsial
      LPS, contributes to host protective immunity against R. australis
    explanation: >-
      R. australis mouse experiments place TLR4-driven ASC inflammasome
      activation in the protective innate response.
  - reference: PMID:26755162
    reference_title: MyD88 Mediates Instructive Signaling in Dendritic Cells and Protective Inflammatory Response during Rickettsial Infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, our results suggest that MyD88 signaling mediates
      instructive signals in DCs and secretion of IL-1β and type 1 immune
      cytokines, which may account for the protective inflammatory response
      during rickettsial infection.
    explanation: >-
      R. australis-infected MyD88 knockout mice and dendritic cells support
      MyD88 as an instructive upstream signal for type 1 protective immunity.
  downstream:
  - target: CD8 T Cell Rickettsia australis Clearance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Innate cytokines help prime the adaptive response to infected cells.

- name: CD8 T Cell Rickettsia australis Clearance
  description: >-
    MHC class I-restricted CD8 cytotoxic T lymphocytes use perforin-dependent
    effector activity to clear R. australis from infected macrophages and
    endothelial cells in mice, providing a model for the adaptive immune arm that
    restrains human disease severity.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  evidence:
  - reference: PMID:11179362
    reference_title: Critical role of cytotoxic T lymphocytes in immune clearance of rickettsial infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that CTL activity was more critical to recovery
      from rickettsial infection than were the effects of IFN-gamma.
    explanation: >-
      The study used R. australis infection of MHC class I, IFN-gamma, and
      perforin knockout mice to rank CD8 cytotoxicity as the key clearance arm.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    R. australis, like other bacteria, depends on 70S ribosomal translation of
    its mRNA; doxycycline binds the 30S ribosomal subunit and blocks bacterial
    protein synthesis.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence for the bacterial ribosome as the conserved antibiotic
      target class for tetracyclines such as doxycycline.

- name: Intracytosolic Rickettsia australis Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Rickettsia species reside free in the host-cell cytosol and exploit host
    metabolites, so effective Queensland tick typhus therapy must reach the
    intracellular bacterial compartment.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many necessary
      components via transport mechanisms instead of maintaining genes for
      synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche for pathogenic Rickettsia
      species, including R. australis.


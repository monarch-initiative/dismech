references:
- reference: PMID:1962102
  title: Spotted fever group rickettsial infections in Australia.
  found_in:
  - Queensland_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      Queensland tick typhus is a usually mild Rickettsia australis infection
      with eschars, regional lymphadenopathy, occasional vesicular rash,
      Ixodes holocyclus and Ixodes tasmani tick vectors, and serologic overlap
      with other Australian rickettsioses.
    supporting_text: >-
      More than four decades ago, Rickettsia australis was discovered to be the
      etiologic agent of Queensland tick typhus (QTT)
- reference: PMID:19327117
  title: Host-cell interactions with pathogenic Rickettsia species.
  found_in:
  - Queensland_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      Endothelial tropism, vascular inflammation, loss of vascular integrity,
      and increased permeability are conserved pathogenic features of spotted
      fever and typhus group rickettsioses.
    supporting_text: >-
      the consequences of which are vascular inflammation, insult to vascular
      integrity and compromised vascular permeability, collectively termed
      'Rickettsial vasculitis'
- reference: PMID:11179362
  title: Critical role of cytotoxic T lymphocytes in immune clearance of rickettsial infection.
  found_in:
  - Queensland_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      R. australis mouse experiments identify MHC class I-restricted,
      perforin-dependent CD8 T cells as decisive for rickettsial clearance.
    supporting_text: >-
      These results indicate that CTL activity was more critical to recovery
      from rickettsial infection than were the effects of IFN-gamma.

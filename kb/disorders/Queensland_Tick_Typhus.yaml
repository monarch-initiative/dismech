name: Queensland Tick Typhus
creation_date: "2026-09-25T12:20:56Z"
updated_date: "2026-09-25T12:20:56Z"
category: Infectious Disease
description: >-
  Queensland tick typhus is an acute tick-borne rickettsiosis caused by the
  obligately intracellular bacterium Rickettsia australis in eastern coastal
  Australia. Ixodes ticks inoculate the organism into skin, where early
  infection of dermal macrophages creates an eschar and draining-node
  lymphadenopathy before hematogenous spread reaches the microvascular
  endothelium. The resulting rickettsial vasculitis accounts for the fever and
  vesicular or maculopapular rash that distinguish Queensland tick typhus within
  the spotted-fever rickettsioses.

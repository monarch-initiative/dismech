name: Asbestosis
creation_date: "2026-07-16T00:00:00Z"
category: Respiratory Disease
parents:
- Respiratory Disease
- Lung Disease
- Pneumoconiosis
disease_term:
  preferred_term: asbestosis
  term:
    id: MONDO:0016466
    label: asbestosis
description: >-
  Asbestosis is a chronic, diffuse interstitial pulmonary fibrosis caused by the
  inhalation and retention of asbestos mineral fibers. It is a dose-dependent
  pneumoconiosis with a long latency (typically 15-40 years from first exposure)
  in which biopersistent fibers deposited in the distal airways and alveoli
  provoke sustained oxidative injury, chronic inflammation, and progressive,
  irreversible lower-zone-predominant fibrosis. Asbestosis denotes the
  parenchymal fibrosis specifically and is distinct from the other
  asbestos-related diseases (benign pleural plaques and effusions, diffuse
  pleural thickening, lung carcinoma, and malignant mesothelioma), which arise by
  overlapping but separable mechanisms.
synonyms:
- asbestos pneumoconiosis
- asbestos dust pneumoconiosis
- pulmonary asbestosis
prevalence:
- population: Global
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    The Global Burden of Disease 2019 analysis estimated 36,339 incident cases
    worldwide in 2019. A denominator-based global incidence rate was not quoted
    in the abstract, so no normalized rate is asserted here. Burden is strongly
    heterogeneous by country and reflects historical exposure and surveillance.
  evidence:
  - reference: PMID:37591378
    reference_title: "Global, regional, and national burden of asbestosis from 1990 to 2019 and the implications for prevention and control."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Globally, 36,339 incident cases of asbestosis, led to 3572 deaths and 71,225 disability adjusted life years (DALYs) in 2019."
    explanation: GBD 2019 modeling provides disease-specific global annual burden estimates.
progression:
- phase: Latent interval
  age_range: Adult onset, usually more than 20 years after first exposure
  duration: Usually more than 20 years from first exposure to symptoms
  notes: The latency is exposure-to-clinical-disease time, not an incubation period.
  evidence:
  - reference: PMID:20196674
    reference_title: "Pathology of asbestosis- An update of the diagnostic criteria: Report of the asbestosis committee of the college of american pathologists and pulmonary pathology society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinically, the disease usually progresses slowly, with a typical latent period of more than 20 years from first exposure to onset of symptoms."
    explanation: Consensus pathology review supports the characteristic long latency and slow tempo.
- phase: Established fibrotic disease
  duration: Chronic and variably progressive
  notes: >-
    More than 20% of one follow-up cohort met its progressive-disease threshold;
    this cohort-specific result is not treated as a universal frequency.
  evidence:
  - reference: PMID:31226624
    reference_title: "The natural course of lung function decline in asbestos exposed subjects with pleural plaques and asbestosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 20% of our cohort have a progressive disease with an annual loss of FVC > -100 ml."
    explanation: Longitudinal pulmonary-function data identify a progressive subgroup.
- phase: Long-term outcome
  duration: Median estimated survival 124 months in one 100-patient referral cohort
  notes: >-
    Survival estimates are cohort- and severity-dependent and must not be read as
    a universal life expectancy. Lower DLCO, older age, higher composite
    physiologic index, and higher GAP stage predicted worse survival.
  evidence:
  - reference: PMID:33637623
    reference_title: "Survival of patients with asbestosis can be assessed by risk-predicting models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median estimated survival of the patients was 124 months, that is, 171 months in GAP stage I, 50 months in stage II and 21 months in stage III (p<0.001)."
    explanation: Provides severity-stratified survival estimates from a defined clinical cohort.
  - reference: PMID:41612278
    reference_title: "Distinct comorbidity profiles and outcomes in asbestosis versus idiopathic pulmonary fibrosis: a 6-year prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality in asbestosis was associated with lung cancer, pulmonary hypertension (PH), and atrial fibrillation, whereas in IPF, it was linked to FVC < 80% and PH."
    explanation: A prospective cohort identifies complication-specific mortality associations through 2022 follow-up.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Established disease is irreversible and may cause progressive exertional
    limitation, oxygen dependence, pulmonary hypertension, respiratory failure,
    and excess mortality, although individual tempo varies substantially.
  evidence:
  - reference: PMID:33637623
    reference_title: "Survival of patients with asbestosis can be assessed by risk-predicting models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CPI, DLCO% predicted, age at baseline and GAP stage were significant predictors of mortality (all p values under 0.001)."
    explanation: Physiologic severity and age materially stratify mortality risk.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
  ilo_disease_category:
  - classification_value: pneumoconiosis_from_fibrogenic_mineral_dust
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 2.1.1
      "Pneumoconioses caused by fibrogenic mineral dust (silicosis,
      anthraco-silicosis, asbestosis)" — asbestosis is named in the item text.
      Asbestosis is the parenchymal fibrosis specifically; the asbestos-related
      malignancies take ILO section 3 items instead (see Malignant_Mesothelioma),
      which is the orthogonality between the ILO's organ-system and cancer
      sections rather than a contradiction.
  eu_occupational_category:
  - classification_value: asbestosis
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC as amended), Annex I item 301.21 "Asbestosis". The European
      schedule separates asbestosis (301.21) from silicosis (301.11) where the
      ILO list folds both into item 2.1.1.
environmental:
- name: Occupational asbestos inhalation
  exposure_term:
    preferred_term: exposure to asbestos
    term:
      id: ECTO:9000033
      label: exposure to asbestos
  environment_context:
    preferred_term: asbestos dust
    term:
      id: ENVO:02000106
      label: asbestos dust
  chemicals:
  - asbestos
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
      notes: >-
        Inhalation of airborne fibres is the route for asbestosis. Ingestion is
        the route implicated in the gastrointestinal cancers the European
        schedule added to its suspected list in 2025 (Annex II 2.309-2.311).
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        ATSDR chronic duration (365 days and longer). Asbestosis is
        dose-dependent on cumulative fibre burden with a 15-40 year latency.
    iarc_carcinogen_group:
      classification_value: GROUP_1
      notes: >-
        IARC classifies all forms of asbestos as Group 1, carcinogenic to
        humans. Recorded on the exposure because it is a property of the agent:
        asbestosis is a fibrosis, not a cancer, and the Group 1 listing refers
        to the malignant outcomes of the same exposure (lung cancer,
        mesothelioma, laryngeal and ovarian cancer).
    ghs_health_hazard_class:
    - classification_value: CARCINOGENICITY
    - classification_value: STOT_REPEATED_EXPOSURE
      notes: >-
        The fibrotic lung injury of asbestosis is target-organ toxicity from
        repeated exposure, distinct from the carcinogenicity classification.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  description: >-
    Inhalation of airborne asbestos fibers during mining, milling, shipbuilding,
    insulation, construction, brake-lining, and textile work is the dominant
    exposure route. Both amphibole fibers (crocidolite, amosite) and, to a lesser
    fibrogenic degree, serpentine chrysotile can cause asbestosis; long, thin,
    biopersistent amphibole fibers are the most fibrogenic. Risk is
    dose-dependent (cumulative fiber burden) and paraoccupational/household and
    environmental exposures also occur.
  evidence:
  - reference: PMID:29772681
    reference_title: "Global Asbestos Disaster"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first identified disease was asbestosis, a type of incurable pneumoconiosis caused by asbestos dust and fibres."
    explanation: Establishes asbestosis as an incurable pneumoconiosis caused by inhaled asbestos dust and fibers.
  - reference: PMID:36630203
    reference_title: "Asbestos-associated pulmonary disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "asbestos-related pulmonary complications include asbestosis, pleural plaques, diffuse pleural thickening, benign asbestos-related pleural effusions and malignant pleural mesothelioma"
    explanation: >-
      Places asbestosis within, and distinct from, the broader spectrum of
      asbestos-related pulmonary and pleural diseases, supporting the scope
      boundary stated in the description.
  - reference: PMID:38577971
    reference_title: "The asbestos-asbestosis exposure-response relationship: a cohort study of the general working population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found increasing incidence rate ratios (IRR) of asbestosis with increasing cumulative asbestos exposure with a fully adjusted IRR per 1 f/ml-years of 1.18"
    explanation: >-
      A large Danish general-working-population cohort demonstrates a
      dose-dependent exposure-response relationship between cumulative asbestos
      exposure and incident asbestosis.
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asbestosis, defined as diffuse pulmonary fibrosis caused by inhalation of asbestos fibers, occurs after heavy exposures to asbestos dust over several decades."
    explanation: >-
      Modern clinicopathological series confirms the definition (diffuse
      pulmonary fibrosis from inhaled asbestos) and the multi-decade
      heavy-exposure requirement.
  influences_mechanisms:
  - target: Biopersistent asbestos fiber deposition
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhalation of airborne fibers is what delivers them to the distal
      airspaces, so the retained biopersistent fiber burden scales with
      cumulative occupational exposure.
    evidence:
    - reference: PMID:38577971
      reference_title: "The asbestos-asbestosis exposure-response relationship: a cohort study of the general working population"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found increasing incidence rate ratios (IRR) of asbestosis with increasing cumulative asbestos exposure with a fully adjusted IRR per 1 f/ml-years of 1.18"
      explanation: >-
        Disease incidence rises with cumulative fiber-years of exposure, the
        dose-response expected if inhaled exposure is what builds the retained
        fiber burden that initiates injury.
pathophysiology:
- name: Biopersistent asbestos fiber deposition
  biological_scale: TISSUE
  description: >-
    Inhaled asbestos fibers with a high length-to-width (aspect) ratio deposit at
    alveolar duct bifurcations and in the distal airspaces. Amphibole fibers
    (crocidolite, amosite) are cleared poorly and are retained for decades
    (biopersistence); over time host cells encase retained fibers in an
    iron-protein coat, forming ferruginous asbestos bodies. This retained,
    biopersistent fiber burden is the injurious insult that initiates the disease.
  conforms_to: "fibrotic_response#Tissue Injury"
  role: trigger
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: alveolar type I epithelial cell
    term:
      id: CL:0002062
      label: pulmonary alveolar type 1 cell
  - preferred_term: alveolar type II epithelial cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:37569765
    reference_title: "Asbestos and Iron"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An inability to clear asbestos from the lower respiratory tract initiates a host process of iron biomineralization (i.e., asbestos body formation)."
    explanation: >-
      Supports biopersistence of retained fibers and iron-coated asbestos body
      formation as the hallmark of failed clearance.
  downstream:
  - target: Frustrated phagocytosis of asbestos fibers
- name: Frustrated phagocytosis of asbestos fibers
  biological_scale: CELLULAR
  description: >-
    Alveolar macrophages attempt to engulf the deposited fibers, but long fibers
    physically cannot be fully internalized. This "frustrated phagocytosis"
    leaves macrophages persistently activated and unable to clear the fiber,
    with leakage of lysosomal contents at the incomplete phagosome.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: frustrated phagocytosis of asbestos fibers
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37894824
    reference_title: "Distinct Pro-Inflammatory Mechanisms Elicited by Short and Long Amosite Asbestos Fibers in Macrophages"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the response to LFA was elicited by a multifactorial ignition system involving the macrophage receptor with collagenous structure (SR-A6 or MARCO), reactive oxygen species (ROS) cascade, and TLR4"
    explanation: >-
      In macrophage cultures, non-internalizable long amosite fibers trigger a
      distinct MARCO/ROS/TLR4 response, the signature of frustrated phagocytosis
      of long fibers.
  downstream:
  - target: Iron-catalyzed reactive oxygen species generation
- name: Iron-catalyzed reactive oxygen species generation
  biological_scale: MOLECULAR
  description: >-
    Iron adsorbed onto the fiber surface (and within asbestos bodies) plus
    macrophage superoxide produced at the phagosome membrane drive Fenton-type
    generation of hydroxyl radicals. The resulting reactive oxygen species
    directly injure alveolar epithelial DNA and membranes and activate
    redox-sensitive signaling.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: alveolar type I epithelial cell
    term:
      id: CL:0002062
      label: pulmonary alveolar type 1 cell
  biological_processes:
  - preferred_term: reactive oxygen species generation
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:37569765
    reference_title: "Asbestos and Iron"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Host cells attempt to mobilize the metal sequestered by the fiber surface by producing superoxide at the phagosome membrane."
    explanation: >-
      Supports macrophage superoxide (reactive oxygen species) generation at the
      fiber-laden phagosome as the proximal oxidative-injury mechanism.
  downstream:
  - target: NLRP3 inflammasome activation
- name: NLRP3 inflammasome activation
  biological_scale: CELLULAR
  description: >-
    Asbestos fibers activate the NLRP3 inflammasome in alveolar macrophages,
    driving caspase-1-dependent maturation and release of IL-1beta and IL-18.
    Fiber-generated reactive oxygen species and lysosomal destabilization are
    upstream triggers of this sterile inflammasome response.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  evidence:
  - reference: PMID:21800904
    reference_title: "Long, needle-like carbon nanotubes and asbestos activate the NLRP3 inflammasome through a similar mechanism"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the NLRP3 inflammasome was essential for long, needle-like CNT and asbestos-induced IL-1β secretion"
    explanation: >-
      In human primary macrophages, asbestos-induced IL-1beta secretion requires
      the NLRP3 inflammasome.
  downstream:
  - target: Chronic sterile alveolitis
- name: Chronic sterile alveolitis
  biological_scale: TISSUE
  description: >-
    IL-1beta and IL-18 amplify recruitment and activation of macrophages and
    neutrophils in the distal lung, initiating a sterile inflammatory response
    that promotes the fibrotic program. Established histologic asbestosis may
    show little active inflammation, so this node represents the mediator phase
    rather than persistent inflammatory infiltrates in every case.
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:37569765
    reference_title: "Asbestos and Iron"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "activates kinases and transcription factors, which are associated with the release of mediators coordinating both inflammatory and fibrotic responses"
    explanation: >-
      Links the fiber-triggered cellular response to mediators that coordinate the
      inflammatory alveolitis and its transition to fibrosis.
  downstream:
  - target: Pro-fibrotic mediator release
- name: Pro-fibrotic mediator release
  biological_scale: CELLULAR
  description: >-
    Activated macrophages and injured epithelial cells release pro-fibrotic
    growth factors - chiefly TGF-beta, plus PDGF, IGF-1, and fibronectin - that
    shift the chronic inflammatory response toward tissue remodeling. This
    mediator surge is the bridge from inflammation to mesenchymal activation.
    TGF-beta is the mediator with direct experimental support here: forced
    pulmonary TGF-beta1 expression is by itself sufficient to produce
    fibroproliferative lung disease. The accompanying PDGF, IGF-1, and
    fibronectin claims are drawn from the wider fibrosis literature and are not
    separately evidenced in this entry.
  role: driver
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: transforming growth factor beta production
    term:
      id: GO:0071604
      label: transforming growth factor beta production
    modifier: INCREASED
  evidence:
  - reference: PMID:12444030
    reference_title: "Susceptibility to asbestos-induced and transforming growth factor-beta1-induced fibroproliferative lung disease in two strains of mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both strains of mice were treated intratracheally with an adenovirus vector (AdV), which transduces expression of active transforming growth factor (TGF)-beta(1) in the lungs, producing fibroproliferative lung disease"
    explanation: "Pulmonary TGF-beta1 expression alone produces fibroproliferative lung disease in mice, supporting TGF-beta release as the mediator bridging inflammation to the fibrotic response."
  - reference: PMID:37569765
    reference_title: Asbestos and Iron.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "activates kinases and transcription factors, which are associated with the release of mediators coordinating both inflammatory and fibrotic responses"
    explanation: "Review places mediator release downstream of the fiber-triggered cell response and upstream of the coordinated inflammatory and fibrotic programs. Evidence source OTHER (review)."
  - reference: PMID:23463177
    reference_title: "Altered functions of alveolar macrophages and NK cells involved in asbestos-related diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure to asbestos caused rat AM to exhibit high production of transforming growth factor-beta (TGF-β) with prolonged survival in the absence of other cells"
    explanation: Asbestos-exposed rat alveolar macrophages directly produced high TGF-beta.
  downstream:
  - target: Myofibroblast differentiation
- name: Myofibroblast differentiation
  biological_scale: CELLULAR
  description: >-
    TGF-beta recruits fibroblasts to the injured interstitium and drives their
    differentiation into contractile, matrix-secreting alpha-SMA-positive
    myofibroblasts. This mesenchymal activation is the proximate cellular driver
    of matrix accumulation.
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  role: driver
  cell_types:
  - preferred_term: lung fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: fibroblast migration
    term:
      id: GO:0010761
      label: fibroblast migration
    modifier: INCREASED
  - preferred_term: TGF-beta receptor signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  - preferred_term: myofibroblast differentiation
    term:
      id: GO:0036446
      label: myofibroblast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:12444030
    reference_title: "Susceptibility to asbestos-induced and transforming growth factor-beta1-induced fibroproliferative lung disease in two strains of mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both strains of mice were treated intratracheally with an adenovirus vector (AdV), which transduces expression of active transforming growth factor (TGF)-beta(1) in the lungs, producing fibroproliferative lung disease"
    explanation: >-
      In a mouse model, lung TGF-beta1 expression is sufficient to produce
      fibroproliferative lung disease, supporting TGF-beta-driven
      fibroblast-to-myofibroblast activation.
  downstream:
  - target: Excessive extracellular matrix deposition
- name: Excessive extracellular matrix deposition
  biological_scale: TISSUE
  description: >-
    Activated myofibroblasts deposit excess type I collagen and other matrix
    components in the alveolar walls and interstitium, beginning around
    respiratory bronchioles and extending into the alveolar interstitium. The
    accumulated matrix is what makes asbestosis a diffuse fibrosing parenchymal
    disease; the specific collagen subtype and the bronchiolocentric starting
    point are drawn from the wider pathology literature rather than from a
    source curated in this entry.
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  role: driver
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asbestosis, defined as diffuse pulmonary fibrosis caused by inhalation of asbestos fibers, occurs after heavy exposures to asbestos dust over several decades."
    explanation: "Diffuse pulmonary fibrosis - the accumulated matrix this node deposits - is the defining lesion in a 102-case clinicopathological series."
  - reference: PMID:32553000
    reference_title: Asbestos-related diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deposition in the lung parenchyma results in an inflammatory/progressively fibrotic response, with impaired gas exchange and reduced lung compliance ('asbestosis')"
    explanation: "Review links parenchymal fiber deposition to the progressive fibrotic (matrix-accumulating) response that defines asbestosis. Evidence source OTHER (review)."
  - reference: PMID:3004226
    reference_title: "Crocidolite-induced pulmonary fibrosis in mice. Cytokinetic and biochemical studies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased collagen levels were largely due to stimulation of peribronchial fibroblasts."
    explanation: A mouse crocidolite-instillation model links fibroblast stimulation to increased pulmonary collagen.
  downstream:
  - target: Interstitial fibrosis and architectural distortion
- name: Interstitial fibrosis and architectural distortion
  biological_scale: TISSUE
  description: >-
    Accumulating matrix thickens the air-blood barrier and produces
    lower-zone-predominant interstitial fibrosis, progressively obliterating
    normal alveolar architecture with honeycombing in advanced disease. This is
    the defining parenchymal lesion of asbestosis.
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  role: outcome
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asbestosis, defined as diffuse pulmonary fibrosis caused by inhalation of asbestos fibers, occurs after heavy exposures to asbestos dust over several decades."
    explanation: >-
      Confirms diffuse interstitial pulmonary fibrosis as the defining structural
      lesion of asbestosis.
  downstream:
  - target: Restrictive ventilatory failure
  - target: Diffuse interstitial pulmonary fibrosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38192052
      reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Asbestosis, defined as diffuse pulmonary fibrosis caused by inhalation of asbestos fibers, occurs after heavy exposures to asbestos dust over several decades."
      explanation: The defining tissue lesion directly reports as the pulmonary-fibrosis phenotype.
  - target: Inspiratory crackles
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Abrupt opening of fibrotic distal airways during late inspiration
    evidence:
    - reference: PMID:464386
      reference_title: "Absence of synergism between exposure to asbestos and cigarette smoking in asbestosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "bilateral fine crackles, clubbing, dyspnea, radiographic abnormality, decreased forced vital capacity, and decreased single-breath diffusing capacity of the lung for CO"
      explanation: Bilateral fine crackles are a documented manifestation of the fibrotic lung lesion.
- name: Restrictive ventilatory failure
  biological_scale: ORGANISM
  description: >-
    Loss of lung compliance and impaired gas exchange from the interstitial
    fibrosis produce a restrictive ventilatory defect with reduced diffusing
    capacity and chronic hypoxemia, progressing in advanced disease to pulmonary
    hypertension, cor pulmonale, and respiratory failure.
  role: outcome
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:32553000
    reference_title: "Asbestos-related diseases"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deposition in the lung parenchyma results in an inflammatory/progressively fibrotic response, with impaired gas exchange and reduced lung compliance ('asbestosis')"
    explanation: >-
      Confirms the terminal physiologic outcome: impaired gas exchange and reduced
      lung compliance (restrictive physiology).
  downstream:
  - target: Exertional dyspnea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced compliance, impaired diffusion, and exertional gas-exchange limitation

    modifier: INCREASED
  evidence:
  - reference: PMID:12444030
    reference_title: "Susceptibility to asbestos-induced and transforming growth factor-beta1-induced fibroproliferative lung disease in two strains of mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "both strains of mice were treated intratracheally with an adenovirus vector (AdV), which transduces expression of active transforming growth factor (TGF)-beta(1) in the lungs, producing fibroproliferative lung disease"
    explanation: >-
      In a mouse model, lung TGF-beta1 expression is sufficient to produce
      fibroproliferative lung disease, supporting TGF-beta-driven
      fibroblast-to-myofibroblast activation.
  downstream:
  - target: Excessive extracellular matrix deposition
- name: Excessive extracellular matrix deposition
  description: >-
    Activated myofibroblasts deposit excess type I collagen and other matrix
    components in the alveolar walls and interstitium, beginning around
    respiratory bronchioles and extending into the alveolar interstitium.
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  role: driver
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  downstream:
  - target: Interstitial fibrosis and architectural distortion
- name: Interstitial fibrosis and architectural distortion
  description: >-
    Accumulating matrix thickens the air-blood barrier and produces
    lower-zone-predominant interstitial fibrosis, progressively obliterating
    normal alveolar architecture with honeycombing in advanced disease. This is
    the defining parenchymal lesion of asbestosis.
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  role: outcome

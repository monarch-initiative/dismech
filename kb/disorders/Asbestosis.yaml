histopathology:
- name: Diffuse interstitial fibrosis with asbestos (ferruginous) bodies
  description: >-
    The diagnostic histologic lesion is diffuse interstitial fibrosis in the
    appropriate anatomic distribution together with identifiable asbestos
    (ferruginous) bodies - golden-brown, beaded, iron-protein-coated fibers - or
    a documented elevated lung fiber burden. Amphibole fibers (especially
    amosite) predominate in fiber-burden analyses, and pleural plaques commonly
    coexist as a marker of exposure.
  diagnostic: true
  evidence:
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung fiber burden analysis was performed in 34 cases, with amosite being the predominant fiber type."
    explanation: >-
      Amphibole (amosite) fibers predominate in the retained lung fiber burden of
      pathologically confirmed asbestosis cases.
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pleural plaque was present in 94% of cases."
    explanation: >-
      Pleural plaques frequently coexist with parenchymal asbestosis as a marker
      of prior asbestos exposure, though they are a separate lesion.
genetic:
- name: GSTM1
  gene_term:
    preferred_term: GSTM1
    term:
      id: hgnc:4632
      label: GSTM1
  association: >-
    Homozygous GSTM1 (glutathione S-transferase mu-1) deletion / null genotype
    has been proposed as a gene-environment susceptibility modifier for
    nonmalignant asbestos-related disease, plausibly by reducing detoxification
    of fiber-generated reactive electrophiles and oxidants. The evidence is
    conflicting: an early cross-sectional study found increased risk, whereas a
    later, larger nested case-control study found no GSTM1 association.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:8000297
    reference_title: "Inherited glutathione-S-transferase deficiency is a risk factor for pulmonary asbestosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals genetically deficient in GST-mu were significantly more likely to have radiographic evidence of nonmalignant asbestos-related disease than those who were not deficient"
    explanation: >-
      In asbestos-exposed carpenters, homozygous GSTM1 deletion was associated
      with more radiographic nonmalignant asbestos-related disease, supporting
      GSTM1 null as a susceptibility modifier.
  - reference: PMID:17563610
    reference_title: "Glutathione S-transferases GSTM1 and GSTT1 polymorphisms and asbestosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "but not with GSTM1-null genotype (OR=1.01, CI 0.71-1.43)"
    explanation: >-
      A larger nested case-control study found no association between the
      GSTM1-null genotype and asbestosis, conflicting with the earlier report.
  notes: >-
    GSTM1 encodes a phase II detoxification enzyme; roughly half of individuals
    of European ancestry carry a homozygous deletion. Its role in asbestosis
    susceptibility remains unsettled.
- name: GSTT1
  gene_term:
    preferred_term: GSTT1
    term:
      id: hgnc:4641
      label: GSTT1
  association: >-
    In a nested case-control study, the GSTT1 (glutathione S-transferase
    theta-1) null genotype was associated with a reduced risk of asbestosis (a
    protective effect), independent of cumulative exposure.
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17563610
    reference_title: "Glutathione S-transferases GSTM1 and GSTT1 polymorphisms and asbestosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GSTT1 gene deletion might have a protective effect on the development of asbestosis"
    explanation: >-
      The study concluded that the GSTT1-null genotype may protect against the
      development of asbestosis.
  notes: >-
    A gene-environment interaction; the protective association was reported
    independent of cumulative asbestos exposure, smoking, sex, and age.
treatments:
- name: Smoking cessation
  description: >-
    Smoking cessation is strongly advised because tobacco smoke and asbestos act
    multiplicatively to increase lung cancer risk and accelerate functional
    decline.
  treatment_term:
    preferred_term: smoking cessation
    term:
      id: MAXO:0002001
      label: tobacco consumption avoidance
  evidence:
  - reference: PMID:32553000
    reference_title: "Asbestos-related diseases"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bronchogenic carcinoma risk from asbestos exposure is dose-dependent and multiplies the risk attributable to tobacco smoking."
    explanation: >-
      The multiplicative interaction between asbestos and tobacco on lung cancer
      risk is the rationale for prioritizing smoking cessation in asbestos-exposed
      patients.
- name: Supplemental oxygen therapy
  description: Long-term oxygen for chronic hypoxemia in advanced disease.
  treatment_term:
    preferred_term: supplemental oxygen therapy
    term:
      id: MAXO:0000066
      label: supplemental oxygen therapy
- name: Pulmonary rehabilitation
  description: >-
    Structured exercise and education to improve exertional capacity and quality
    of life.
  treatment_term:
    preferred_term: pulmonary rehabilitation
    term:
      id: NCIT:C157966
      label: Pulmonary Rehabilitation
  evidence:
  - reference: PMID:32053838
    reference_title: "[Sustainability in Outpatient Pulmonary Rehabilitation in Patients with Asbestosis - Results of an 8-Year Follow Up]"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific exercise therapy and sports are able to mobilize physical reserves of performance and induce an increasing quality of life as well as a higher resilience in activities of daily living"
    explanation: >-
      An 8-year follow-up of outpatient pulmonary rehabilitation in asbestosis
      patients shows exercise therapy improves quality of life and daily-living
      resilience despite the irreversible restrictive disease.
- name: Lung transplantation
  description: Considered in selected patients with end-stage fibrosis.
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: MAXO:0010039
      label: organ transplantation
- name: Removal from ongoing asbestos exposure
  description: >-
    Ending further asbestos exposure is a cardinal management step. Because
    asbestosis risk is dose-dependent on cumulative fiber burden, halting
    additional exposure limits further accrual of injurious fiber load. It does
    not reverse established fibrosis (retained fibers are biopersistent), so it
    is preventive of progression rather than curative.
  evidence:
  - reference: PMID:38577971
    reference_title: "The asbestos-asbestosis exposure-response relationship: a cohort study of the general working population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found increasing incidence rate ratios (IRR) of asbestosis with increasing cumulative asbestos exposure with a fully adjusted IRR per 1 f/ml-years of 1.18"
    explanation: >-
      The dose-dependent cumulative-exposure relationship is the rationale for
      removal from further asbestos exposure to limit additional risk.
- name: Vaccination
  description: >-
    Influenza and pneumococcal vaccination are recommended supportive measures
    to reduce respiratory infections that can precipitate acute decompensation
    in chronic fibrotic lung disease.
  treatment_term:
    preferred_term: vaccination
    term:
      id: MAXO:0001017
      label: vaccination

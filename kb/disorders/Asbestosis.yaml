    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asbestosis, defined as diffuse pulmonary fibrosis caused by inhalation of asbestos fibers, occurs after heavy exposures to asbestos dust over several decades."
    explanation: >-
      Confirms diffuse interstitial pulmonary fibrosis as the defining structural
      lesion of asbestosis.
  downstream:
  - target: Restrictive ventilatory failure
- name: Restrictive ventilatory failure
  description: >-
    Loss of lung compliance and impaired gas exchange from the interstitial
    fibrosis produce a restrictive ventilatory defect with reduced diffusing
    capacity and chronic hypoxemia, progressing in advanced disease to pulmonary
    hypertension, cor pulmonale, and respiratory failure.
  role: outcome
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:32553000
    reference_title: "Asbestos-related diseases"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deposition in the lung parenchyma results in an inflammatory/progressively fibrotic response, with impaired gas exchange and reduced lung compliance ('asbestosis')"
    explanation: >-
      Confirms the terminal physiologic outcome: impaired gas exchange and reduced
      lung compliance (restrictive physiology).

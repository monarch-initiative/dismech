- discussion_id: mismatch_asbestosis_bolus_and_short_term_models
  prompt: How faithfully do bolus-instilled and short-duration rodent asbestos models reproduce chronic human fiber retention and decades-long asbestosis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biopersistent asbestos fiber deposition
  - pathophysiology#Excessive extracellular matrix deposition
  rationale: >-

histopathology:
- name: Diffuse interstitial fibrosis with asbestos (ferruginous) bodies
  description: >-
    The diagnostic histologic lesion is diffuse interstitial fibrosis in the
    appropriate anatomic distribution together with identifiable asbestos
    (ferruginous) bodies - golden-brown, beaded, iron-protein-coated fibers - or
    a documented elevated lung fiber burden. Amphibole fibers (especially
    amosite) predominate in fiber-burden analyses, and pleural plaques commonly
    coexist as a marker of exposure.
  diagnostic: true
  evidence:
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung fiber burden analysis was performed in 34 cases, with amosite being the predominant fiber type."
    explanation: >-
      Amphibole (amosite) fibers predominate in the retained lung fiber burden of
      pathologically confirmed asbestosis cases.
  - reference: PMID:38192052
    reference_title: "The diagnosis of asbestosis in the 21(st) century: a clinicopathological correlation of 102 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pleural plaque was present in 94% of cases."
    explanation: >-
      Pleural plaques frequently coexist with parenchymal asbestosis as a marker
      of prior asbestos exposure, though they are a separate lesion.
diagnosis:
- name: Exposure history and high-resolution chest CT correlation
  description: >-
    Diagnosis requires a credible asbestos exposure with appropriate latency,
    compatible bilateral basal/subpleural fibrosis on HRCT, and exclusion of a
    better explanation. Pleural plaques support prior exposure but are neither
    necessary nor sufficient for parenchymal asbestosis.
  diagnosis_term:
    preferred_term: High-resolution chest computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Basal/subpleural interstitial fibrosis; subpleural dots, short subpleural
    lines, and parenchymal bands favor asbestosis over idiopathic pulmonary fibrosis.
  evidence:
  - reference: PMID:26901505
    reference_title: "The comparison of high-resolution computed tomography findings in asbestosis and idiopathic pulmonary fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On multivariate analysis, HRCT features that distinguished asbestosis from IPF were subpleural lines at a distance of less than 5 mm from the inner chest wall, subpleural dots and parenchymal bands."
    explanation: Comparative imaging study identifies HRCT features useful in the principal differential.
- name: Pulmonary function testing
  description: >-
    Spirometry, lung volumes, and DLCO establish physiologic impairment and
    provide longitudinal severity/progression measures; they support but do not
    establish asbestos causation.
  diagnosis_term:
    preferred_term: Pulmonary Function Test
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  results: Restriction, reduced forced vital capacity, and reduced diffusing capacity.
  evidence:
  - reference: PMID:464386
    reference_title: "Absence of synergism between exposure to asbestos and cigarette smoking in asbestosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral fine crackles, clubbing, dyspnea, radiographic abnormality, decreased forced vital capacity, and decreased single-breath diffusing capacity of the lung for CO"
    explanation: Standardized worker examinations document the characteristic functional abnormalities.
- name: Lung biopsy and quantitative fiber burden when noninvasive evaluation is indeterminate
  description: >-
    Tissue is not routinely required, but in disputed or atypical cases the
    combination of appropriate interstitial fibrosis and excess asbestos bodies
    or quantitative fiber burden can establish pathologic attribution.
  diagnosis_term:
    preferred_term: Lung Biopsy
    term:
      id: NCIT:C51748
      label: Lung Biopsy
  results: Appropriate fibrosis plus evidence of excess pulmonary asbestos burden.
  evidence:
  - reference: PMID:20196674
    reference_title: "Pathology of asbestosis- An update of the diagnostic criteria: Report of the asbestosis committee of the college of american pathologists and pulmonary pathology society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two or more asbestos bodies per square centimeter of a 5- mu m-thick lung section, in combination with interstitial fibrosis of the appropriate pattern, are indicative of asbestosis."
    explanation: Consensus pathology criteria define a tissue asbestos-body threshold with compatible fibrosis.
differential_diagnoses:
- name: Idiopathic pulmonary fibrosis
  disease_term:
    preferred_term: idiopathic pulmonary fibrosis
    term:
      id: MONDO:0800504
      label: idiopathic pulmonary fibrosis
  description: Both disorders can show basal, subpleural fibrosis with a UIP-like pattern.
  distinguishing_features:
  - >-
    A credible high cumulative asbestos exposure, pleural fibrosis/plaques,
    asbestos bodies or elevated lung fiber burden, and subpleural dots/lines or
    parenchymal bands favor asbestosis. Fibroblastic foci and active inflammation
    are more characteristic of IPF.
  evidence:
  - reference: PMID:20196674
    reference_title: "Pathology of asbestosis- An update of the diagnostic criteria: Report of the asbestosis committee of the college of american pathologists and pulmonary pathology society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pulmonary fibrosis of asbestosis is interstitial and has a basal subpleural distribution, similar to that seen in idiopathic pulmonary fibrosis, which is the principal differential diagnosis."
    explanation: Consensus review explicitly identifies IPF as the principal differential.
- name: Mixed dust pneumoconiosis and smoking-related respiratory bronchiolitis
  disease_term:
    preferred_term: mixed dust pneumoconiosis
  description: Early centriacinar/peribronchiolar fibrosis overlaps with mixed-dust and smoking-related lesions.
  distinguishing_features:
  - >-
    Fibrosis confined to bronchiolar walls is insufficient for asbestosis;
    diffuse acinar extension plus evidence of excess asbestos burden is required.
  evidence:
  - reference: PMID:20196674
    reference_title: "Pathology of asbestosis- An update of the diagnostic criteria: Report of the asbestosis committee of the college of american pathologists and pulmonary pathology society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibrosis limited to the walls of the bronchioles does not represent asbestosis."
    explanation: Consensus criteria prevent overcalling nonspecific bronchiolar fibrosis as asbestosis.
genetic:
- name: GSTM1
  gene_term:
    preferred_term: GSTM1
    term:
      id: hgnc:4632
      label: GSTM1
  association: >-
    Homozygous GSTM1 (glutathione S-transferase mu-1) deletion / null genotype
    has been proposed as a gene-environment susceptibility modifier for
    nonmalignant asbestos-related disease, plausibly by reducing detoxification
    of fiber-generated reactive electrophiles and oxidants. The evidence is
    conflicting: an early cross-sectional study found increased risk, whereas a
    later, larger nested case-control study found no GSTM1 association.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:8000297
    reference_title: "Inherited glutathione-S-transferase deficiency is a risk factor for pulmonary asbestosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals genetically deficient in GST-mu were significantly more likely to have radiographic evidence of nonmalignant asbestos-related disease than those who were not deficient"
    explanation: >-
      In asbestos-exposed carpenters, homozygous GSTM1 deletion was associated
      with radiographic nonmalignant asbestos-related disease, but the snippet
      does not isolate pathologically confirmed asbestosis and later evidence
      was null; it therefore only partially supports an asbestosis modifier.
  - reference: PMID:17563610
    reference_title: "Glutathione S-transferases GSTM1 and GSTT1 polymorphisms and asbestosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "but not with GSTM1-null genotype (OR=1.01, CI 0.71-1.43)"
    explanation: >-
      A larger nested case-control study found no association between the
      GSTM1-null genotype and asbestosis, conflicting with the earlier report.
  notes: >-
    GSTM1 encodes a phase II detoxification enzyme; roughly half of individuals
    of European ancestry carry a homozygous deletion. Its role in asbestosis
    susceptibility remains unsettled.
- name: GSTT1
  gene_term:
    preferred_term: GSTT1
    term:
      id: hgnc:4641
      label: GSTT1
  association: >-
    In a nested case-control study, the GSTT1 (glutathione S-transferase
    theta-1) null genotype was associated with a reduced risk of asbestosis (a
    protective effect), independent of cumulative exposure.
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17563610
    reference_title: "Glutathione S-transferases GSTM1 and GSTT1 polymorphisms and asbestosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GSTT1 gene deletion might have a protective effect on the development of asbestosis"
    explanation: >-
      The study concluded that the GSTT1-null genotype may protect against the
      development of asbestosis.
  notes: >-
    A gene-environment interaction; the protective association was reported
    independent of cumulative asbestos exposure, smoking, sex, and age.
treatments:
- name: Smoking cessation
  description: >-
    Smoking cessation is strongly advised because tobacco smoke and asbestos act
    multiplicatively to increase lung cancer risk.
  treatment_term:
    preferred_term: smoking cessation
    term:
      id: NCIT:C15372
      label: Smoking Cessation Intervention
  evidence:
  - reference: PMID:32553000
    reference_title: "Asbestos-related diseases"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bronchogenic carcinoma risk from asbestos exposure is dose-dependent and multiplies the risk attributable to tobacco smoking."
    explanation: >-
      The multiplicative interaction between asbestos and tobacco on lung cancer
      risk is the rationale for prioritizing smoking cessation in asbestos-exposed
      patients.
- name: Supplemental oxygen therapy
  description: Long-term oxygen for chronic hypoxemia in advanced disease.
  treatment_term:
    preferred_term: supplemental oxygen therapy
    term:
      id: NCIT:C94624
      label: Oxygen Therapy
  evidence:
  - reference: PMID:32553000
    reference_title: Asbestos-related diseases.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "causing progressive dyspnoea and respiratory failure for which only palliation is indicated"
    explanation: "Supports palliative/supportive management (of which supplemental oxygen is a component) as the available approach for progressive dyspnoea and respiratory failure. Marked PARTIAL: the review does not name oxygen therapy specifically. Evidence source OTHER (review)."
- name: Pulmonary rehabilitation
  description: >-
    Structured exercise and education to improve exertional capacity and quality
    of life.
  treatment_term:
    preferred_term: pulmonary rehabilitation
    term:
      id: NCIT:C157966
      label: Pulmonary Rehabilitation
  evidence:
  - reference: PMID:32053838
    reference_title: "[Sustainability in Outpatient Pulmonary Rehabilitation in Patients with Asbestosis - Results of an 8-Year Follow Up]"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific exercise therapy and sports are able to mobilize physical reserves of performance and induce an increasing quality of life as well as a higher resilience in activities of daily living"
    explanation: >-
      An 8-year follow-up of outpatient pulmonary rehabilitation in asbestosis
      patients shows exercise therapy improves quality of life and daily-living
      resilience despite the irreversible restrictive disease.
- name: Lung transplantation
  description: Considered in selected patients with end-stage fibrosis.
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
- name: Removal from ongoing asbestos exposure
  description: >-
    Ending further asbestos exposure is a cardinal management step. Because
    asbestosis risk is dose-dependent on cumulative fiber burden, halting
    additional exposure limits further accrual of injurious fiber load. It does
    not reverse established fibrosis (retained fibers are biopersistent), so it
    is preventive of progression rather than curative.
  evidence:
  - reference: PMID:38577971
    reference_title: "The asbestos-asbestosis exposure-response relationship: a cohort study of the general working population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found increasing incidence rate ratios (IRR) of asbestosis with increasing cumulative asbestos exposure with a fully adjusted IRR per 1 f/ml-years of 1.18"
    explanation: >-
      The dose-dependent cumulative-exposure relationship is the rationale for
      removal from further asbestos exposure to limit additional risk.
- name: Vaccination
  description: >-
    Influenza and pneumococcal vaccination are recommended supportive measures
    to reduce respiratory infections that can precipitate acute decompensation
    in chronic fibrotic lung disease.
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
- name: Pirfenidone
  description: >-
    Investigational antifibrotic therapy for progressive asbestosis. A
    10-patient prospective safety study found acceptable tolerability but no
    significant change in hospital PFTs, and a later real-world
    analysis found only modest, statistically non-significant changes in FVC and
    DLCO decline. It is not established disease-modifying standard therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pirfenidone
      term:
        id: CHEBI:32016
        label: pirfenidone
  evidence:
  - reference: PMID:35643466
    reference_title: "Safety and tolerability of pirfenidone in asbestosis: a prospective multicenter study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant changes in hospital pulmonary function (forced vital capacity (FVC), diffusion capacity of the lung for carbon monoxide (DLCO), 6 min walking test or patient-reported outcomes measures before and after start of pirfenidone were found."
    explanation: Small prospective study supports feasibility and safety but not established efficacy.
  - reference: PMID:41438854
    reference_title: "The effect of pirfenidone on disease progression in asbestosis patients: a real-world Dutch cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings based on asbestosis patients treated between 2004 and 2024 reveal a modest reduction in the rate of FVC decline (mean (95% CI) difference 7.0 (-5.8-19.7) mL·month-1, p=0.22) and D LCO decline (0.11% (-0.19-0.41%), p=0.30) after starting pirfenidone"
    explanation: Real-world before/after estimates are compatible with modest benefit but are imprecise and non-significant.
animal_models:
- species: Rat (Rattus norvegicus)
  category: Induced inhalation model
  description: >-
    Brief aerosolized chrysotile exposure produces deposition at first alveolar
    duct bifurcations, macrophage accumulation, TGF-beta localization, and early
    fibronectin/alpha-smooth-muscle-actin-positive fibrogenic lesions. It models
    early spatial events but compresses decades of human latency.
  associated_phenotypes:
  - Pulmonary interstitial fibrosis
  evidence:
  - reference: PMID:8027525
    reference_title: "Distribution of transforming growth factor-beta 1, fibronectin, and smooth muscle actin in asbestos-induced pulmonary fibrosis in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These sites, the first alveolar duct bifurcations, are where the fibers are initially deposited and where macrophages first accumulate."
    explanation: Defines the spatially resolved rat inhalation model and its earliest cellular events.
- species: Mouse (Mus musculus)
  category: Induced intratracheal instillation model
  description: >-
    Intratracheal crocidolite causes epithelial injury, sustained alveolar
    macrophage accumulation, fibroblast stimulation, and increased collagen over
    a 20-week course. Bolus instillation does not reproduce human aerosol dose,
    fiber clearance, or latency.
  associated_phenotypes:
  - Pulmonary interstitial fibrosis
  evidence:
  - reference: PMID:3004226
    reference_title: "Crocidolite-induced pulmonary fibrosis in mice. Cytokinetic and biochemical studies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The lesions were induced by intratracheal instillation of 1 mg crocidolite asbestos in mice, which were killed up to 20 weeks thereafter"
    explanation: Establishes the induced mouse model, exposure method, dose, and study duration.
experimental_models:
- name: Asbestos-exposed macrophage culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Murine macrophages
  culture_system: In-vitro fiber exposure
  description: >-
    Macrophage cultures expose cells to defined fiber lengths to resolve
    phagocytosis, ROS, TLR4/MARCO signaling, inflammasome activation, cytokine
    release, and death programs. The model lacks epithelial-mesenchymal and
    clearance dynamics of the intact human lung.
  modeled_mechanisms:
  - target: Frustrated phagocytosis of asbestos fibers
    description: Resolves fiber-length-dependent uptake failure and macrophage signaling.
    evidence:
    - reference: PMID:37894824
      reference_title: "Distinct Pro-Inflammatory Mechanisms Elicited by Short and Long Amosite Asbestos Fibers in Macrophages"
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "macrophage responses to non-internalizable LFA were associated with tumor necrosis factor alpha (TNF-α) release, caspase-3 and -7 activation, and apoptosis"
      explanation: Long fibers were non-internalizable and elicited macrophage signaling, supporting uptake failure without explicitly naming frustrated phagocytosis.
  - target: NLRP3 inflammasome activation
    description: Measures inflammasome-dependent cytokine release after fiber exposure.
    evidence:
    - reference: PMID:37894824
      reference_title: "Distinct Pro-Inflammatory Mechanisms Elicited by Short and Long Amosite Asbestos Fibers in Macrophages"
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "SFA internalization resulted in pyroptotic-related immunogenic cell death (ICD) characterized by the release of the pro-inflammatory damage signal (DAMP) IL-1α after inflammasome activation and gasdermin D (GSDMD)-pore formation."
      explanation: Short-fiber internalization activated an inflammasome and pyroptotic signaling, but the abstract does not identify NLRP3 specifically.
  publication: PMID:37894824
  evidence:
  - reference: PMID:37894824
    reference_title: "Distinct Pro-Inflammatory Mechanisms Elicited by Short and Long Amosite Asbestos Fibers in Macrophages"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the response to LFA was elicited by a multifactorial ignition system involving the macrophage receptor with collagenous structure (SR-A6 or MARCO), reactive oxygen species (ROS) cascade, and TLR4"
    explanation: Defines the long-fiber macrophage signaling phenotype reproduced in vitro.

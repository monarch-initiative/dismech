animal_models:
- name: Dhrs3 exon 1 knockout mouse
  species: Mouse
  genotype: Dhrs3-/- (exon 1 deletion)
  publication: PMID:24005908
  description: >-
    Global Dhrs3-null mice raise embryonic RA by about 40% and die in late
    gestation with septal and outflow tract heart defects, cleft palate,
    cervical vertebral fusion, porous parietal bones and coronal suture
    narrowing. Restricting maternal dietary vitamin A over successive
    generations rescues the cardiac defects and allows survival to adulthood.
  modeled_mechanisms:
  - target: Excess Retinoic Acid Synthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Embryonic RA is raised to a degree comparable with the plasma RA rise
      in patients.
    evidence:
    - reference: PMID:40519748
      reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the proportionate increases in plasma RA in the 2 patients are comparable to the mouse observations"
      explanation: Compares the mouse and patient RA rise directly.
  - target: Cardiac Septation Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The mouse is a complete null, while patients carry hypomorphic alleles;
      the mouse defects (VSD, absent atrial septation, double-outlet right
      ventricle) are more severe than the mainly atrial septal defects in
      patients.
    evidence:
    - reference: PMID:24005908
      reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All of the 5 E14.5 Dhrs3−/− embryos examined displayed cardiac malformations"
      explanation: Cardiac malformations in every null embryo examined.
  - target: Coronal Suture Osteogenic Acceleration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Null embryos die before birth, so only coronal suture narrowing and, in
      one of six embryos, bone growth across the suture can be observed;
      established craniosynostosis cannot be assessed.
    evidence:
    - reference: PMID:40519748
      reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, although Dhrs3−/− mice fail to survive to birth, their phenotypes are consistent with excess RA signaling and presage the pathogenic onset of craniosynostosis"
      explanation: >-
        The authors present the mouse suture findings as the onset of
        craniosynostosis, not the full phenotype.

discussions:
- discussion_id: dhrs3_gene_environment_threshold
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does dietary vitamin A availability decide whether a hypomorphic DHRS3
    genotype produces craniosynostosis-scoliosis syndrome?
  rationale: >-
    Three further homozygous missense variants reduce DHRS3 activity and raise
    plasma RA yet were not judged pathogenic, and the family with the mildest
    RA rise came from a population with low vitamin A status. In mice the
    Dhrs3-null phenotype is prevented by maternal vitamin A restriction. A
    dietary threshold would make penetrance depend on maternal retinoid intake,
    which has not been measured in any affected pregnancy.
  attaches_to:
  - pathophysiology#Excess Retinoic Acid Synthesis
  - genetic#DHRS3
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, interaction with environmental availability of retinoids may affect the baseline level of RA present in different individuals; therefore, the threshold for pathogenicity of variants could differ between individuals (gene-environment interaction)."
    explanation: The authors raise the gene-environment threshold as untested.
  - reference: PMID:29806219
    reference_title: "Alterations in retinoic acid signaling affect the development of the mouse coronary vasculature."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In fact, feeding dams a VAD diet for three successive generations, allowed us to bypass the embryonic lethality associated with the Dhrs3-deficiency to obtain viable Dhrs3−/− pups that survived into adulthood"
    explanation: Maternal diet modulates the Dhrs3-null phenotype in mice.
- discussion_id: dhrs3_scoliosis_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the scoliosis in DHRS3 deficiency caused by congenital vertebral
    malformation, as the cervical fusions of Dhrs3-null mice would suggest?
  rationale: >-
    Scoliosis is present in every reported patient, but the report gives no
    spinal imaging, and the mouse vertebral finding (C1-C2 fusion) is at a
    different level from the patients' thoracolumbar curves. The edge from the
    axial patterning node to scoliosis is therefore an analogy, not an
    observation.
  attaches_to:
  - pathophysiology#Axial Skeletal Patterning Defect
  - phenotypes#Thoracolumbar scoliosis


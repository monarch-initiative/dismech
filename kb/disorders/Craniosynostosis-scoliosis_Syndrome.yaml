name: Craniosynostosis-Scoliosis Syndrome
creation_date: "2026-10-30T23:00:32Z"
category: Mendelian
description: >-
  An autosomal recessive retinoic acid embryopathy caused by biallelic
  hypomorphic variants in DHRS3, which encodes the retinaldehyde reductase that
  converts retinaldehyde back to retinol and so limits all-trans retinoic acid
  synthesis during embryogenesis. The five affected individuals from three
  families described to date share unilateral or bilateral coronal
  craniosynostosis, scoliosis, congenital heart disease (mostly atrial septal
  defects), hypertelorism and a facial gestalt reminiscent of Saethre-Chotzen
  syndrome, with mild neurodevelopmental involvement and hearing impairment in
  several. Affected individuals have reduced plasma retinol and elevated plasma
  retinoic acid, matching the retinoid profile and the cardiac, vertebral and
  coronal-suture anomalies of Dhrs3-null mouse embryos.
synonyms:
- DHRS3 deficiency
- short-chain dehydrogenase/reductase 3 deficiency
disease_term:
  preferred_term: craniosynostosis-scoliosis syndrome
  term:
    id: MONDO:0980974
    label: craniosynostosis-scoliosis syndrome
parents:
- Syndromic Craniosynostosis
- Retinoic Acid Embryopathy
notes: >-
  The disease rests on a single multi-family report (PMID:40519748). Of the
  five homozygous DHRS3 variants assessed there, only the promoter/5'-UTR
  deletion (family 1) and p.(Val171Met) (families 3 and 4) were classified
  pathogenic; p.(Val110Ile) and p.(Gly115Asp) were judged likely benign and
  p.(Glu244Gln) a variant of uncertain significance despite each reducing
  enzyme activity, so the phenotype here is drawn from the five individuals
  carrying the two pathogenic alleles only. No GeneReviews chapter names this
  disease (just check-genereviews, offline Bookshelf index). No disease-specific
  treatment has been reported, so the entry carries no treatments section.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All affected individuals are homozygous for a DHRS3 variant, most born to
    consanguineous parents, and heterozygous relatives are unaffected.
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We define a novel developmental syndrome associated with biallelic hypomorphic variants in DHRS3"
    explanation: >-
      Defines the syndrome as caused by biallelic (homozygous) DHRS3 variants.
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The siblings both presented with a combination of unilateral or bilateral coronal craniosynostosis, atrial septal defect, and thoracolumbar scoliosis, suggesting a shared autosomal recessive basis to their disorder."
    explanation: >-
      Affected siblings of first-cousin parents in the index family, consistent
      with autosomal recessive inheritance.

pathophysiology:
- name: DHRS3 Retinaldehyde Reductase Deficiency
  description: >-
    Biallelic hypomorphic DHRS3 variants reduce the NADPH-dependent reduction of
    all-trans retinaldehyde to retinol. The index-family deletion removes the
    promoter and part of the 5'-UTR and leaves 2-10% residual transcript; the
    p.(Val171Met) substitution destabilises the Rossmann fold and reduces
    catalytic activity. Complete loss is not seen in patients, and complete
    loss in mice is lethal before birth.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    gene:
      preferred_term: DHRS3
      term:
        id: hgnc:17693
        label: DHRS3
  genes:
  - preferred_term: DHRS3
    term:
      id: hgnc:17693
      label: DHRS3
  molecular_functions:
  - preferred_term: retinaldehyde reductase activity
    term:
      id: GO:0052650
      label: all-trans-retinol dehydrogenase (NADP+) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcription of DHRS3 in whole blood cells from 2 homozygotes for the promoter/5'-untranslated region deletion was 90% to 98% reduced."
    explanation: >-
      Patient blood shows the index deletion severely reduces DHRS3 expression.
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells transfected with a DHRS3-Val171Met construct exhibited reduced retinaldehyde reduction capacity compared with wild-type, yielding reduced retinol and elevated RA"
    explanation: >-
      HEK293 expression assay shows the second pathogenic allele reduces DHRS3
      retinaldehyde reductase activity.
  downstream:
  - target: Excess Retinoic Acid Synthesis
    description: >-
      Without DHRS3 returning retinaldehyde to retinol, more retinaldehyde is
      irreversibly oxidised to all-trans retinoic acid.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24005908
      reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lack of DHRS3 leads to a 40% increase in the levels of ATRA and a 60% and 55% decrease in the levels of retinol and retinyl esters, respectively"
      explanation: >-
        Dhrs3-null mouse embryos directly show that loss of the enzyme raises
        retinoic acid and lowers retinol.
  - target: Reduced circulating vitamin A
    description: >-
      Less retinaldehyde is reduced back to retinol, lowering retinol and
      retinyl ester levels.
    causal_link_type: DIRECT

- name: Excess Retinoic Acid Synthesis
  description: >-
    Elevated all-trans retinoic acid (RA) formation. Patients homozygous for the
    pathogenic alleles have plasma RA 72-151% above unaffected relatives, above
    the family-specific upper limit, and Dhrs3-null mouse embryos carry about 40%
    more RA than wild-type littermates. The magnitude depends on dietary
    vitamin A, which supplies the retinol precursor.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: all-trans retinoic acid
    term:
      id: CHEBI:15367
      label: all-trans-retinoic acid
    modifier: INCREASED
  biological_processes:
  - preferred_term: retinoic acid biosynthetic process
    term:
      id: GO:0002138
      label: retinoic acid biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "plasma from homozygous patients had significantly reduced retinol and elevated RA (exceeding the normal range), compared with controls and heterozygous relatives."
    explanation: >-
      Direct measurement of elevated retinoic acid in patient plasma.
  - reference: PMID:24005908
    reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate that the reduction of retinaldehyde by DHRS3 is critical for preventing formation of excess ATRA during embryonic development."
    explanation: >-
      Establishes DHRS3 as a brake on embryonic retinoic acid formation.
  downstream:
  - target: Increased Retinoic Acid Receptor Signaling
    description: >-
      Excess RA activates RAR/RXR heterodimers and alters transcription of RA
      target genes in the embryo.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24005908
      reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Excess ATRA also leads to alterations (40-80%) in the expression of several developmentally important ATRA target genes."
      explanation: >-
        Shows the RA excess in Dhrs3-null embryos changes RA target-gene
        expression.

- name: Increased Retinoic Acid Receptor Signaling
  description: >-
    Elevated RAR/RXR-dependent transcription in embryonic tissues, the common
    effector of retinoic acid embryopathy. Dhrs3 is expressed predominantly in
    the dura mater and one osteogenic cluster of the developing coronal suture,
    and RA signalling in the calvaria concentrates either side of the coronal
    sutures.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:24005908
    reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, Dhrs3-deficient mice have disrupted retinoid homeostasis, resulting in alterations in RAR/RXR-based signaling."
    explanation: >-
      Dhrs3 loss alters RAR/RXR signalling in vivo.
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Xgal (blue) staining of a representative E18.5 RARE-lacZ mouse skull provides direct visualization of RA signaling in the calvaria, concentrated in the medial and ventral regions of the frontal and parietal bones on either side of the coronal sutures"
    explanation: >-
      Places RA signalling at the coronal suture, the suture that fuses in
      patients.
  downstream:
  - target: Coronal Suture Osteogenic Acceleration
    description: >-
      Excess RA signalling at the coronal suture promotes premature osteogenic
      differentiation of suture mesenchyme.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20134361
      reference_title: "Retinoic acid enhances osteogenesis in cranial suture-derived mesenchymal cells: potential mechanisms of retinoid-induced craniosynostosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Retinoic acid represses proliferation and enhances osteogenic differentiation of suture-derived mesenchymal cells."
      explanation: >-
        Exogenous RA drives osteogenic differentiation of mouse suture
        mesenchymal cells in culture, the cellular step between RA excess and
        suture fusion.
    - reference: PMID:30392121
      reference_title: "PLGA-based control release of Noggin blocks the premature fusion of cranial sutures caused by retinoic acid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As expected, the posterior frontal suture was found to fuse prematurely in the atRA subcutaneous injection mouse model."
      explanation: >-
        Excess RA given in vivo causes premature cranial suture fusion in mice.
    - reference: PMID:42604930
      reference_title: "Temporally regulated FGFR2-retinoic acid signaling mediates dura mater-suture mesenchyme interactions to prevent craniosynostosis in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "This leads to increased retinoic acid synthesis, premature osteogenic differentiation of GLI1+ progenitors, and coronal suture craniosynostosis."
      explanation: >-
        In Fgfr2IIIc mice increased RA synthesis in dura mater and suture
        mesenchyme drives premature osteogenic differentiation and coronal
        craniosynostosis. The RA excess there has a different upstream cause,
        so this supports the RA-to-osteogenesis step only by inference.
    - reference: PMID:22019272
      reference_title: "Craniosynostosis and multiple skeletal anomalies in humans and zebrafish result from a defect in the localized degradation of retinoic acid."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "craniosynostosis is induced by a defect in osteoblastic differentiation"
      explanation: >-
        In the CYP26B1 retinoic acid excess disorder, zebrafish and mouse
        analyses attribute craniosynostosis to altered osteoblast
        differentiation, a parallel RA-excess route to suture fusion.
  - target: Cardiac Septation Defect
    description: >-
      Excess RA during heart development disrupts atrial and ventricular
      septation and outflow tract formation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29806219
      reference_title: "Alterations in retinoic acid signaling affect the development of the mouse coronary vasculature."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, our data suggest that the cardiac developmental defects resulting from genetic deletion of Dhrs3 are chiefly caused by increased formation of RA."
      explanation: >-
        Maternal vitamin A restriction rescues the cardiac defects of
        Dhrs3-null embryos, showing they are caused by excess RA.
  - target: Axial Skeletal Patterning Defect
    description: >-
      Excess RA signalling disturbs vertebral development.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Coronal Suture Osteogenic Acceleration
  conforms_to: "cranial_suture_premature_fusion#Cranial Suture Osteogenic Acceleration"
  description: >-
    Premature osteogenic differentiation and bone formation at the coronal
    suture. In RA-exposed suture mesenchyme this runs through BMP-SMAD1/5/9
    activation, which Noggin can block. Dhrs3-null mouse embryos die before birth, but at E17.5 they already
    show coronal suture narrowing and, in one of six embryos, bone growth across
    the suture.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  locations:
  - preferred_term: coronal suture
    term:
      id: UBERON:0002489
      label: coronal suture
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:30392121
    reference_title: "PLGA-based control release of Noggin blocks the premature fusion of cranial sutures caused by retinoic acid."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Moreover, BMP signal pathway was found to be activated by atRA, as seen from increased expression of BMPR-2 and pSMAD1/5/9."
    explanation: >-
      In mouse suture mesenchymal cells exposed to RA, BMP signalling is
      activated, and Noggin blocks RA-enhanced osteogenesis. Shown for
      exogenous RA, not for DHRS3 loss.
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed frequent unilateral (left sided) narrowing of the coronal suture (asterisk) in E17.5 Dhrs3−/− embryos compared with Dhrs3+/+ (Figures 7G-J) and in 1 case, considerable bone growth across the coronal suture (arrow) (n = 1/6)."
    explanation: >-
      Dhrs3-null embryos show early coronal suture narrowing and bone bridging,
      the precursor of coronal synostosis.
  downstream:
  - target: Premature Coronal Suture Fusion
    description: >-
      Excess osteogenesis at the coronal suture closes it prematurely.
    causal_link_type: DIRECT

- name: Premature Coronal Suture Fusion
  conforms_to: "cranial_suture_premature_fusion#Premature Cranial Suture Fusion and Craniosynostosis"
  description: >-
    Unilateral or bilateral premature bony fusion of the coronal suture, seen in
    all five individuals homozygous for the pathogenic alleles.
  biological_scale: TISSUE
  locations:
  - preferred_term: coronal suture
    term:
      id: UBERON:0002489
      label: coronal suture
  biological_processes:
  - preferred_term: cranial suture morphogenesis
    term:
      id: GO:0060363
      label: cranial suture morphogenesis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five homozygotes from 3 families (1 family segregating a deletion of the promoter and 5'-untranslated region of DHRS3, the other 2 a missense variant p.(Val171Met)), manifested a congruent phenotype, including coronal craniosynostosis"
    explanation: >-
      Coronal craniosynostosis is the defining cranial feature in patients.
  downstream:
  - target: Coronal craniosynostosis
    causal_link_type: DIRECT

- name: Cardiac Septation Defect
  description: >-
    Defective septation of the developing heart. Dhrs3-null mouse embryos have
    membranous ventricular septal defects, absent atrial septation and
    double-outlet right ventricle; patients mainly have atrial septal defects.
  biological_scale: TISSUE
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: cardiac septum morphogenesis
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:24005908
    reference_title: "The retinaldehyde reductase DHRS3 is essential for preventing the formation of excess retinoic acid during embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consequently, Dhrs3 ablation results in heart septation defects, both VSD and ASD, and defects in the outflow tract formation, DORV, and are nonviable."
    explanation: >-
      Dhrs3-null embryos have atrial and ventricular septal defects.
  downstream:
  - target: Atrial septal defect
    causal_link_type: DIRECT
  - target: Congenital heart disease
    causal_link_type: DIRECT

- name: Axial Skeletal Patterning Defect
  description: >-
    Abnormal vertebral development. Dhrs3-null mouse embryos show fusion of the
    first two cervical vertebrae, a classic sign of RA excess. Whether the
    scoliosis seen in every patient arises from comparable vertebral
    malformation has not been reported; the edge to scoliosis is inferred from
    the parallel the authors draw between the human and mouse phenotypes.
  biological_scale: TISSUE
  locations:
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  biological_processes:
  - preferred_term: skeletal system development
    term:
      id: GO:0001501
      label: skeletal system development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40519748
    reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unilateral or bilateral fusion of the first 2 cervical vertebrae, which was observed in every Dhrs3−/− embryo examined (n = 6), is a classic feature of excessive RA signaling."
    explanation: >-
      Vertebral fusion in every Dhrs3-null embryo examined.
  downstream:
  - target: Thoracolumbar scoliosis
    causal_link_type: UNKNOWN
    description: >-
      Proposed by analogy with the mouse vertebral phenotype; spinal imaging of
      patients has not been reported.
    evidence:
    - reference: PMID:40519748
      reference_title: "Identification and characterization of short-chain dehydrogenase/reductase 3 (DHRS3) deficiency, a retinoic acid embryopathy of humans."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These malformations mirror the pattern previously observed in the Dhrs3−/− null mouse"
      explanation: >-
        The authors relate the patients' craniosynostosis, septal defects and
        scoliosis to the mouse phenotype, which includes vertebral fusion; the
        link to scoliosis is by analogy.


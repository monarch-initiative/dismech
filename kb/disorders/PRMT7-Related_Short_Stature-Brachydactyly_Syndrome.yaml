      label: PRMT7
  relationship_type: CAUSATIVE
  notes: >
    PRMT7 (16q22.1) encodes protein arginine methyltransferase 7, a type III
    arginine monomethyltransferase. Biallelic loss-of-function variants
    (homozygous or compound heterozygous) cause SBIDDS.
  evidence:
  - reference: PMID:36399134
    reference_title: "Biallelic PRMT7 pathogenic variants are associated with a recognizable syndromic neurodevelopmental disorder with short stature, obesity, and craniofacial and digital abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic pathogenic PRMT7 variants have previously been associated \nwith a syndromic neurodevelopmental disorder characterized by short stature, \nbrachydactyly, intellectual developmental disability, and seizures"
    explanation: >
      Establishes biallelic PRMT7 variants as the cause of the SBIDDS
      neurodevelopmental syndrome.
  - reference: PMID:28902392
    reference_title: "Expanding the clinical and molecular spectrum of PRMT7 mutations: 3 additional patients and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "causing a novel intellectual disability \nsyndrome, known as SBIDDS syndrome (Short Stature, Brachydactyly, Intellectual \nDevelopmental Disability, and Seizures)"
    explanation: >
      Names the PRMT7-associated entity SBIDDS and its defining feature set.
pathophysiology:
- name: Loss of PRMT7 Arginine Methyltransferase Function
  biological_scale: MOLECULAR
  description: >
    PRMT7 catalyzes monomethylation of arginine residues on multiple protein
    substrates. Biallelic loss-of-function variants abolish PRMT7
    methyltransferase activity, dysregulating downstream developmental and
    metabolic programs.
  genes:
  - preferred_term: PRMT7
    term:
      id: hgnc:25557
      label: PRMT7
  molecular_functions:
  - preferred_term: protein-arginine omega-N monomethyltransferase activity
    term:
      id: GO:0035241
      label: protein-arginine omega-N monomethyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Muscle Oxidative Metabolism and Energy Expenditure
  - target: Growth Hormone / IGF-I Axis Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The molecular pathway from PRMT7 loss to impaired GH/IGF-I signaling is
      not established; the endocrine impairment is attributed to the disorder
      on clinical grounds (GH deficiency and low IGF-I documented in affected
      twins with biallelic PRMT7 variants).
    evidence:
    - reference: PMID:36348013
      reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "our findings expand the knowledge \nabout the endocrine manifestations associated with PRMT7 pathogenetic variants, \nincluding GH deficiency and rGH response"
      explanation: >
        Attributes GH deficiency to PRMT7 pathogenic variants as an endocrine
        manifestation of the disorder; the association is clinical, without a
        demonstrated intermediate mechanism.
  - target: Brachydactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Biallelic loss of PRMT7 function causes the digital skeletal shortening:
      Prmt7-null mice recapitulate shortened metatarsal bones and reduced body
      size, but the intermediate chondro-osseous mechanism has not been
      established in humans.
    evidence:
    - reference: PMID:36348013
      reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In murine models,PRMT7-null mice showed reduced body size and shortened metatarsal bones"
      explanation: >
        Knockout mice recapitulate the metatarsal shortening that corresponds
        to the human brachydactyly (3rd-5th metacarpal/metatarsal shortening),
        supporting a causal link from PRMT7 loss to the digital phenotype;
        quoted verbatim from the cached full text, including its missing
        space, and reporting murine data reviewed within a clinical paper.
  evidence:
  - reference: PMID:36399134
    reference_title: "Biallelic PRMT7 pathogenic variants are associated with a recognizable syndromic neurodevelopmental disorder with short stature, obesity, and craniofacial and digital abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein arginine methyltransferase 7 (PRMT7) is a member of a family of \nenzymes that catalyzes the methylation of arginine residues on several protein \nsubstrates"
    explanation: >
      Establishes PRMT7 as an arginine methyltransferase, the enzymatic function
      lost in disease.
- name: Reduced Muscle Oxidative Metabolism and Energy Expenditure
  biological_scale: ORGANISM
  description: >
    In Prmt7-knockout mice, loss of PRMT7 reduces skeletal-muscle oxidative
    metabolism and energy expenditure (via a p38MAPK/ATF2/PGC-1alpha axis),
    contributing to age-related obesity. This model-organism mechanism is
    proposed to underlie the obesity component of the human disorder; it has
    not been directly demonstrated in patients.
  downstream:
  - target: Obesity
    causal_link_type: DIRECT
    description: >-
      Decreased energy expenditure produces a positive energy balance that
      drives weight gain; in the knockout mouse this manifests as exacerbated
      age-related obesity, paralleling the later-onset obesity seen in a
      subset of patients. Not directly demonstrated in patients.
    evidence:
    - reference: PMID:27207521
      reference_title: "Prmt7 Deficiency Causes Reduced Skeletal Muscle Oxidative Metabolism and Age-Related Obesity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Prmt7(-/-) \nmice exhibit decreased energy expenditure, which might contribute to the \nexacerbated age-related obesity of Prmt7(-/-) mice"
      explanation: >
        The mouse model links decreased energy expenditure to age-related
        obesity; the extrapolation to the human obesity phenotype is a
        model-based inference, hence INDIRECT.
  evidence:
  - reference: PMID:27207521
    reference_title: "Prmt7 Deficiency Causes Reduced Skeletal Muscle Oxidative Metabolism and Age-Related Obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Prmt7(-/-) \nmice exhibit decreased energy expenditure, which might contribute to the \nexacerbated age-related obesity of Prmt7(-/-) mice"
    explanation: >
      Mouse Prmt7 knockout shows decreased energy expenditure and age-related
      obesity, a candidate mechanism for the human obesity phenotype.
- name: Growth Hormone / IGF-I Axis Impairment
  biological_scale: ORGANISM
  description: >
    Endocrine assessment of affected dizygotic twins revealed growth hormone
    deficiency on stimulation testing in one twin and low IGF-I concentrations
    in both, and both showed a good height response to recombinant GH. A
    variable GH/IGF-I axis defect is therefore proposed as one contributor to
    the growth impairment of the syndrome, within a growth disorder of
    multifactorial origin; it is documented in a single twin pair and is not
    established across the patient population.
  evidence:
  - reference: PMID:36348013
    reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Twin A we found an insufficient response to GH stimulation tests, confirming the presence of GHD"
    explanation: >
      Documents growth hormone deficiency on formal stimulation testing in an
      affected individual.
  - reference: PMID:36348013
    reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both twins had low concentrations of IGF-I, thus supporting a possible underlying role of GH/IGF-I axis impairment of variable entity"
    explanation: >
      Low IGF-I in both twins supports a GH/IGF-I axis impairment of variable
      severity as a disease process in this disorder.
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
    description: >-
      A variable GH/IGF-I axis defect contributes to the growth impairment;
      the paper is explicit that endocrine involvement is only one aspect of a
      multifactorial growth disorder, so this edge is contributory rather than
      the sole explanation of short stature.
    evidence:
    - reference: PMID:36348013
      reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Indeed, the striking height gain observed in our patients over the two-year rGH treatment is highly suggestive of a possible role of GH/IGF-I axis alterations as contributors of growth impairment"
      explanation: >
        The causal contribution is inferred from treatment response (height
        gain on rGH) rather than from a direct mechanistic demonstration,
        hence INDIRECT.
  - target: Growth hormone deficiency
    causal_link_type: DIRECT
    description: >-
      The axis impairment manifests clinically as an insufficient response to
      growth hormone stimulation testing, documented in one affected twin.
    evidence:
    - reference: PMID:36348013
      reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In Twin A we found an insufficient response to GH stimulation tests, confirming the presence of GHD"
      explanation: >
        Directly documents the GH-deficiency phenotype as the clinical
        manifestation of the axis impairment.

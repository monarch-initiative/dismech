treatments:
- name: Recombinant Growth Hormone Therapy
  description: >
    Recombinant human growth hormone (rGH) has produced short-term height gain
    in PRMT7-related short stature, including in an affected twin with documented
    GH deficiency and one with an appropriate GH response — the first evidence of
    rGH response in this disorder.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Growth Hormone / IGF-I Axis Impairment
    treatment_effect: RESTORES
    description: >-
      Recombinant GH replaces or pharmacologically augments deficient GH/IGF-I
      signaling; both twins (one GH-deficient, one GH-sufficient but born SGA)
      showed height gain on treatment.
    evidence:
    - reference: PMID:36348013
      reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both showed a satisfactory short-term response to treatment with height gain (∆HT) of +0.52 SDS (Twin A) and +0.88 SDS (Twin B) during the first year"
      explanation: >
        Height response to rGH in both affected twins supports the GH/IGF-I
        axis as the mechanism this treatment acts on.
  evidence:
  - reference: PMID:36348013
    reference_title: "Short stature in PRMT7 Mutations: first evidence of response to growth hormone treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both started rGH, albeit at different dosages according to the underlying diagnosis"
    explanation: >
      Two affected twins were treated with recombinant growth hormone (rGH),
      documenting the first evidence of rGH use/response in SBIDDS.
discussions:
- discussion_id: gap_prmt7_neurodevelopmental_mechanism
  prompt: >-
    Through which substrates and in which neural cell types does loss of PRMT7
    arginine monomethylation produce the intellectual disability, hypotonia,
    seizures, and microcephaly of SBIDDS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Developmental delay / intellectual disability
  - phenotypes#Hypotonia
  - phenotypes#Seizures
  - phenotypes#Microcephaly
  rationale: >-
    The neurodevelopmental core of the syndrome has no established human
    mechanism. Model-system leads exist — PRMT7 methylation of the NALCN
    channel regulating neuronal excitability in mouse dentate granule neurons,
    and chromatin/histone-substrate regulation of developmental gene
    expression — but none has been validated in patient-derived tissue, and no
    patient biomarker links PRMT7 loss to a specific neural process. Causal
    edges from the molecular lesion to these phenotypes are therefore not
    asserted rather than manufactured from model extrapolation.
- discussion_id: gap_prmt7_craniofacial_sensory_mechanism
  prompt: >-
    What mechanism links biallelic PRMT7 loss of function to the craniofacial
    gestalt and to the sensory findings (strabismus, nystagmus, hearing loss)
    of SBIDDS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Facial dysmorphism
  - phenotypes#Epicanthus
  - phenotypes#Esotropia
  - phenotypes#Broad forehead
  - phenotypes#Sparse eyebrows
  - phenotypes#Hypertelorism
  - phenotypes#Depressed nasal bridge
  - phenotypes#Thin vermilion border
  - phenotypes#Strabismus
  - phenotypes#Nystagmus
  - phenotypes#Hearing loss
  rationale: >-
    The distinctive facial morphology and the recurrent ocular and auditory
    findings are documented clinically but have no proposed molecular or
    developmental mechanism in the literature; a 2024 preprint implicating
    PRMT7 in PTEN-mediated osteogenesis with craniofacial abnormalities in
    conditional knockout mice is provisional model evidence and is not yet a
    basis for causal edges to human craniofacial or sensory phenotypes.

    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic (homozygous or compound heterozygous) loss-of-function PRMT7
    variants cause the disorder; reported in multiple consanguineous families.
  evidence:
  - reference: PMID:28902392
    reference_title: "Expanding the clinical and molecular spectrum of PRMT7 mutations: 3 additional patients and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on 3 additional patients from \n2 consanguineous families with severe/moderate intellectual disability, short \nstature, brachydactyly and dysmorphisms"
    explanation: >
      Homozygous PRMT7 variants in affected members of consanguineous families,
      consistent with autosomal recessive inheritance.

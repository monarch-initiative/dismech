name: PRMT7-Related Short Stature-Brachydactyly Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- short stature-brachydactyly-obesity-global developmental delay syndrome
- short stature, brachydactyly, intellectual developmental disability, and seizures
- SBIDDS
- PRMT7-related neurodevelopmental disorder
description: >
  PRMT7-related short stature-brachydactyly syndrome (SBIDDS) is a rare
  autosomal recessive syndromic neurodevelopmental disorder caused by biallelic
  loss-of-function variants in PRMT7, which encodes protein arginine
  methyltransferase 7 — a type III enzyme that monomethylates arginine residues
  on histone and non-histone substrates. The recognizable phenotype combines
  short stature, brachydactyly (an acromelic/digital abnormality), global
  developmental delay / intellectual disability, hypotonia, distinct
  craniofacial dysmorphism, and variable obesity, seizures, eye abnormalities
  and hearing loss. The short stature/brachydactyly presentation has been
  regarded as a phenocopy of pseudohypoparathyroidism. Recombinant growth
  hormone has produced short-term height gain in affected individuals.
disease_term:
  preferred_term: short stature-brachydactyly-obesity-global developmental delay syndrome
  term:

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published. The
    disorder is known from individual reports and a multi-center cohort of 51
    affected individuals from 39 families. Ascertainment is genotype-first, so
    case counts are not a population rate.
inheritance:

discussions:
- discussion_id: cytopenia_and_vasculitis_mechanism_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Thrombocytopenia
  - phenotypes#Anemia
  - phenotypes#Neutropenia
  - phenotypes#Vasculitis
  prompt: >-
    Are the cytopenias of dimerization-defective IKAROS disease autoimmune,
    marrow-intrinsic, or both, and what drives the vasculitis seen in some
    carriers?
  rationale: >-
    The founding cohort reported thrombocytopenia, anemia and neutropenia, some
    as Evans syndrome, which points to autoimmune destruction. IKAROS also
    regulates myeloid, megakaryocyte and erythroid differentiation, so impaired
    production is equally plausible. No study has separated the two in carriers
    of this allele class, so the cytopenia phenotypes carry no causal edge. The
    same holds for the ANCA-negative vasculitis and its pulmonary complications
    in the M494Vfs*86 family, whose immune mechanism has not been studied.
  evidence:
  - reference: PMID:32845957
    reference_title: "Germline IKAROS dimerization haploinsufficiency causes hematologic cytopenias and malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Index patients presented with hematologic disease consisting of cytopenias (thrombocytopenia, anemia, neutropenia)/Evans syndrome and malignancies (T-cell acute lymphoblastic leukemia, Burkitt lymphoma)."
    explanation: Reports the cytopenias without assigning a mechanism.
  - reference: PMID:38320737
    reference_title: "IKAROS gain of function disease: Allogeneic hematopoietic cell transplantation experience and expanded clinical phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "IKAROS mostly negatively regulates the gene transcription machinery during lymphocyte as well as myeloid, megakaryocyte, and erythroid differentiation."
    explanation: Source for the role of IKAROS in myeloid, megakaryocyte and erythroid differentiation.
- discussion_id: no_dimerization_defective_model
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#IKAROS Dimerization Haploinsufficiency
  prompt: >-
    Does a heterozygous ZF5/ZF6 variant reproduce the human disease in an
    animal model?
  rationale: >-
    The mechanism rests on overexpression assays of variant proteins and on
    patient-cell protein measurements. A PubMed search for (Ikzf1 OR Ikaros)
    AND (knock-in OR knockin) AND (dimerization OR "zinc finger 6" OR "zinc
    finger 5" OR C-terminal) AND mice, run on 2026-10-15, returned no records,
    so the step from reduced dimer dosage to cytopenia, lymphoid malignancy
    and B-cell deficiency is inferred from patients alone.

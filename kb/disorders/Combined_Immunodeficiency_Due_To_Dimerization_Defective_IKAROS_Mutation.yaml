genetic:
- name: IKZF1
  gene_term:
    preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Disease-causing variants map to ZF5 and ZF6 (the C-terminal dimerization
    domain). Not every ZF5/ZF6 missense variant is deleterious: in a
    systematic functional screen only some patient variants in this domain
    impaired dimerization, so a variant here needs functional testing before
    it is called causal.
  evidence:
  - reference: ORPHA:695172
    reference_title: "Combined immunodeficiency due to dimerization defective IKAROS mutation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IKZF1 | IKAROS family zinc finger 1 | hgnc:13176 | Disease-causing germline mutation(s) in"
    explanation: Orphanet gene-disease association row.
  - reference: PMID:32845957
    reference_title: "Germline IKAROS dimerization haploinsufficiency causes hematologic cytopenias and malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe 4 germline heterozygous IKAROS variants affecting its C-terminal dimerization domain, via haploinsufficiency, in 4 unrelated families"
    explanation: Founding report establishing germline dimerization-domain IKZF1 variants as causal.
  - reference: PMID:41380100
    reference_title: "Systematic functional validation of IKAROS variants from patients and laboratory-generated mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among the missense variants in the dimerization domain, including C467W and L470F in ZF5, M494V, Q500R, R502W, and E513Q in ZF6, only C467W showed a complete dimerization defect"
    explanation: >-
      Shows that patient-detected ZF5/ZF6 missense variants range from complete
      to no dimerization defect, which is the basis for the caveat in notes.
  variants:
  - name: IKZF1 p.Y503*
    description: >-
      ZF6 nonsense variant segregating in a family with B-cell acute
      lymphoblastic leukemia, recurrent infections and specific antibody
      deficiency, with three asymptomatic carriers. The mutant protein is
      unstable, dimerizes only residually, fails pericentromeric targeting and
      is poorly SUMOylated, without a dominant-negative effect on wild-type
      IKAROS.
    evidence:
    - reference: PMID:40024461

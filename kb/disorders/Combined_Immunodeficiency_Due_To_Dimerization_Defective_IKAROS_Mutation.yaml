- name: IKAROS Dimerization Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    The mutant allele contributes few or no functional IKAROS dimers. The mutant
    protein loses pericentromeric heterochromatin targeting, binds DNA
    abnormally and fails to recruit the NuRD complex, so it cannot repress
    IKAROS target genes. It does not prevent the wild-type protein from
    reaching pericentromeric heterochromatin, so the net effect is a
    half-dose of IKAROS activity rather than dominant interference.
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  biological_processes:
  - preferred_term: IKAROS-mediated transcriptional repression
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:41380100
    reference_title: "Systematic functional validation of IKAROS variants from patients and laboratory-generated mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, our data demonstrate that mutants with severe homodimerization defects are accompanied by a range of heterodimerization impairments, faulty pericentromeric targeting and transcriptional repression."
    explanation: >-
      Alanine-scanning of ZF5 and ZF6 links loss of dimerization to loss of
      pericentromeric targeting and transcriptional repression.
  - reference: PMID:32845957
    reference_title: "Germline IKAROS dimerization haploinsufficiency causes hematologic cytopenias and malignancies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These dimerization defective mutants disrupt homo- and heterodimerization in a complete or partial manner, but they do not affect the wild-type allele function."
    explanation: Wild-type allele function is preserved, which makes the mechanism haploinsufficient.
  - reference: PMID:40024461
    reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In co-transfection experiments, cells expressing both WT and Y503*, the Y503* mutant maintained its diffuse staining pattern but not interfering with the PC-HC localization of the WT IKAROS, ruling out a dominant negative effect"
    explanation: Co-transfection excludes a dominant-negative effect for a ZF6 allele.
  - reference: PMID:32845957
    reference_title: "Germline IKAROS dimerization haploinsufficiency causes hematologic cytopenias and malignancies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "they alter key mechanisms of IKAROS gene regulation, including sumoylation, protein stability, and the recruitment of the nucleosome remodeling and deacetylase complex; none affected in N-terminal DNA binding defects"
    explanation: Source for the loss of NuRD recruitment.
  - reference: PMID:10970879
    reference_title: "Targeting of Ikaros to pericentromeric heterochromatin by direct DNA binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rather, targeting was dependent on the amino-terminal DNA-binding zinc finger domain and carboxy-terminal dimerization domain of Ikaros."
    explanation: >-
      Domain-deletion experiments in fibroblasts showing that the C-terminal
      dimerization domain is needed for pericentromeric targeting, which is
      why a dimerization lesion also costs targeting.

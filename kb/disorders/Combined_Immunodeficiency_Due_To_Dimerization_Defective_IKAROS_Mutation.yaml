notes: >-
  No GeneReviews chapter covers this disease. The disease name follows MONDO
  and Orphanet, but most reported index patients presented with hematologic
  cytopenias or lymphoid malignancy rather than with a classical combined
  immunodeficiency, and several mutation carriers were asymptomatic. The
  immunodeficiency and vasculitis phenotypes come from two families carrying
  ZF6 truncating alleles (p.Y503* and p.M494Vfs*86). Y503* was shown to impair
  dimerization; M494Vfs*86 is placed in this allele class by its ZF6 location,
  because its mutant protein could not be reconstructed and was never tested
  in a dimerization assay. The authors of that series describe both as
  protein-instability haploinsufficiency arising in the dimerization domain.

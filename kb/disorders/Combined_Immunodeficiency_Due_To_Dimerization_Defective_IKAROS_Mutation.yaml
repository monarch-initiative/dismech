      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In co-transfection experiments, cells expressing both WT and Y503*, the Y503* mutant maintained its diffuse staining pattern but not interfering with the PC-HC localization of the WT IKAROS, ruling out a dominant negative effect"
      explanation: Establishes the haploinsufficient rather than dominant-negative action of this ZF6 allele.
  - name: IKZF1 p.M494Vfs*86
    description: >-
      ZF6 frameshift variant in a family with ANCA-negative vasculitis, B-cell
      lymphopenia, low IgG and poor vaccine responses, and one asymptomatic
      carrier. Mutant protein was undetectable and total IKAROS reduced in
      patient cells. The frameshift could not be reconstructed as a construct,
      so it was not tested for dimerization; it is assigned to this allele
      class by its ZF6 location.
    evidence:
    - reference: PMID:40024461
      reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant proteins from the M494fs and Y503* variants were not detected."
      explanation: >-
        Immunoblots of patient PBMC and EBV-transformed B cells show no mutant
        protein for either ZF6 allele.
    - reference: PMID:40024461
      reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "only the D22N and Y503* mutants were generated and tested"
      explanation: Records that M494Vfs*86 was not reconstructed for functional assays.
pathophysiology:
- name: IKZF1 Dimerization Domain Variant Disrupts IKAROS Dimerization
  biological_scale: MOLECULAR
  description: >-
    IKAROS uses its four N-terminal zinc fingers to bind DNA and its two
    C-terminal zinc fingers (ZF5 and ZF6) to form homodimers and heterodimers
    with HELIOS, AIOLOS and EOS. Germline heterozygous variants in ZF5 or ZF6
    abolish or reduce both homo- and heterodimerization of the mutant protein.
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  molecular_functions:
  - preferred_term: IKAROS homodimerization
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: DECREASED
  - preferred_term: IKAROS heterodimerization with HELIOS, AIOLOS and EOS
    term:
      id: GO:0046982
      label: protein heterodimerization activity
    modifier: DECREASED
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:32845957
    reference_title: "Germline IKAROS dimerization haploinsufficiency causes hematologic cytopenias and malignancies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These dimerization defective mutants disrupt homo- and heterodimerization in a complete or partial manner, but they do not affect the wild-type allele function."
    explanation: >-
      Defines the molecular lesion of the allele class. Graded IN_VITRO because
      dimerization was measured in assays of the variant proteins.
  - reference: PMID:40024461
    reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As observed with the impaired homodimerization, mutant Y503* was unable to fully heterodimerize with WT HELIOS, AIOLOS and EOS."
    explanation: Confirms loss of heterodimerization with all three family partners for a ZF6 truncating allele.
  downstream:
  - target: Reduced IKAROS Protein Stability and SUMOylation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dimerization loss and instability are reported together. The authors
      propose that a mutant unable to dimerize is exposed to degradation, but
      whether the first causes the second, or the lesion destabilizes the
      protein directly, has not been tested.
    evidence:
    - reference: PMID:40024461
      reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As previously reported, IKZF1 deleterious variants impacting the dimerization domain are associated with defective homo- and heterodimerization, as well as abnormal DNA binding, PC-HC localization, SUMOylation, and reduced protein stability."
      explanation: >-
        Reports dimerization, SUMOylation and stability defects together in
        dimerization-domain variants, without ordering them.
    - reference: PMID:40024461
      reference_title: "IKAROS protein stability is regulated by its early N-terminal region and C-terminal dimerization domain."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The inability to form functional oligomers or homodimers may expose mutant IKAROS to rapid degradation pathways"
      explanation: The authors' proposed causal ordering, stated as a hypothesis.
  - target: IKAROS Dimerization Haploinsufficiency
    causal_link_type: DIRECT
- name: Reduced IKAROS Protein Stability and SUMOylation
  biological_scale: MOLECULAR
  description: >-
    Dimerization-defective IKAROS is poorly SUMOylated and degraded faster than
    wild-type protein. In patient cells the mutant protein is undetectable even
    though the mutant transcript is present at normal levels, and total IKAROS
    protein is reduced to about half.

- name: C-Terminal MMADHC Null Alleles
  subtypes:
  - cblD-MMA/HC
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: MMADHC
    term:
      id: hgnc:25221
      label: MMADHC
  genetic_context:
    variant_origin: GERMLINE
    allele_type: nonsense or frameshift across the C-terminus (p.Y140-R250)
    genomic_contexts:
    - coding sequence
    allelic_hit_role: BIALLELIC_INACTIVATION
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Loss of both functions. The longer the C-terminal truncation the more complete the
      loss: beyond twenty residues the cellular phenotype is combined, shorter ones give
      the isolated-homocystinuria picture.
  description: >-
    Premature stops across the C-terminus remove the C-terminal domain from every
    product, so neither arm is served and both coenzymes are deficient.
  downstream:
  - target: Loss of Mitochondrial Cobalamin Routing
    causal_link_type: DIRECT
  - target: Loss of Cytosolic Cobalamin Routing to Methionine Synthase
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24722857
    reference_title: Characterization of functional domains of the cblD (MMADHC) gene product.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: 'Previously we have shown that in cblD patients three types of MMADHC mutations
      exist: 1) null mutations N-terminal to Met116 cause isolated methylmalonic aciduria
      (cblD-MMA) due to AdoCbl deficiency; 2) null mutations across the C-terminus (p.Y140-R250)
      cause combined methylmalonic aciduria and homocystinuria (cblD-MMA/HC) due to AdoCbl
      and MeCbl deficiency; 3) missense mutations in a conserved C-terminal region (p.D246-L259)
      cause isolated homocystinuria (cblD-HC) due to MeCbl deficiency.'
    explanation: States the full position-to-phenotype map, including this allele class,
      as the authors' prior result that the paper builds on.
  - reference: PMID:22156578
    reference_title: "Molecular mechanisms leading to three different phenotypes in the cblD defect of intracellular cobalamin metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In cblD-MMA/HC cells, improving mitochondrial targeting of MMADHC clearly
      increased the formation of adenosylcobalamin (AdoCbl) with a concomitant decrease
      in MeCbl formation.
    explanation: In cells from this form, shifting MMADHC toward mitochondria trades one
      coenzyme for the other, consistent with one protein serving both arms.
- name: Loss of Mitochondrial Cobalamin Routing
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MMADHC normally sends part of the processed cobalamin into mitochondria for
    adenosylcobalamin synthesis. When that function is lost, MMAB is not supplied. That
    MMADHC is needed for this step is established; how it hands cobalamin on inside the
    organelle is not (see the cbld_mitochondrial_function_unknown discussion).
  biological_processes:
  - preferred_term: cobalamin metabolic process
    modifier: DECREASED
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Adenosylcobalamin Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23270877
    reference_title: "Subcellular location of MMACHC and MMADHC, two human proteins central to intracellular vitamin B(12) metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that MMACHC is cytoplasmic while MMADHC is both mitochondrial and cytoplasmic
    explanation: Immunofluorescence and subcellular fractionation place MMADHC in
      mitochondria as well as cytosol. This grounds the compartment, not a mechanism.
- name: Loss of Cytosolic Cobalamin Routing to Methionine Synthase
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In the cytosol MMADHC takes cobalamin from MMACHC and passes it toward methionine
    synthase. When that function is lost, methylcobalamin is not made.
  biological_processes:
  - preferred_term: cobalamin metabolic process
    modifier: DECREASED
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  downstream:
  - target: Methylcobalamin Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42709793
    reference_title: Mitochondrial depolarization stabilizes the vitamin B(12) chaperone MMADHC in the cytosol to increase MTR activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cytosol-stabilized MMADHC increases MTR levels and activity.
    explanation: Raising cytosolic MMADHC raises methionine synthase activity, linking the
      cytosolic pool of the protein to this arm.
- name: Adenosylcobalamin Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The mitochondrial coenzyme is not made, so methylmalonyl-CoA mutase has no cofactor.
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    modifier: DECREASED
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
  downstream:
  - target: Methylmalonic Acid Accumulation
    causal_link_type: DIRECT
- name: Methylcobalamin Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The cytosolic coenzyme is not made, so methionine synthase cannot remethylate
    homocysteine to methionine.
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  molecular_functions:
  - preferred_term: methionine synthase activity
    modifier: DECREASED
    term:
      id: GO:0008705
      label: methionine synthase activity
  downstream:
  - target: Homocysteine Accumulation and Methionine Deficit
    causal_link_type: DIRECT
- name: Methylmalonic Acid Accumulation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Methylmalonyl-CoA and methylmalonate build up, with the metabolic decompensation risk
    of an organic acidemia during catabolic stress.
  downstream:
  - target: Methylmalonic Aciduria
    causal_link_type: DIRECT
    description: >-
      Accumulated methylmalonate is excreted in urine, the marker of the
      mitochondrial arm.
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Methylmalonate and propionate pathway intermediates are toxic to mitochondrial
      energy metabolism, but the step from metabolite to the specific neurological lesion
      is not established.
- name: Homocysteine Accumulation and Methionine Deficit
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Homocysteine rises while methionine and therefore S-adenosylmethionine fall, so
    methylation-dependent processes and one-carbon metabolism are both impaired.
  downstream:
  - target: Homocystinuria
    causal_link_type: DIRECT
    description: >-
      Accumulated homocysteine spills into plasma and urine, the marker of the
      cytosolic arm.
  - target: Impaired One-Carbon Metabolism in Erythroid Precursors
    causal_link_type: DIRECT
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed to homocysteine neurotoxicity together with loss of SAM-dependent
      methylation needed for myelination, but not resolved to a single step.
- name: Impaired One-Carbon Metabolism in Erythroid Precursors
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Blocked remethylation traps folate and impairs thymidylate and purine synthesis, so
    DNA synthesis in erythroid precursors lags nuclear maturation - the mechanism shared
    with the other remethylation disorders.
  downstream:
  - target: Megaloblastic Anemia
    causal_link_type: DIRECT
- name: Megaloblastic Anemia
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Macrocytic anemia with megaloblastic marrow changes, restricted to the forms in which
    the homocysteine arm is affected.
- name: Neurologic Injury
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Developmental delay, cognitive deficits and seizures. PROVISIONAL because both arms
    are implicated and the entry does not claim to resolve which metabolite does the
    damage in any individual patient.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Seizures
    causal_link_type: DIRECT

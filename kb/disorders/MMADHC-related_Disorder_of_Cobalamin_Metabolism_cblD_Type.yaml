pathophysiology:
- name: N-Terminal MMADHC Null Alleles
  subtypes:
  - cblD-MMA
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: MMADHC
    term:
      id: hgnc:25221
      label: MMADHC
  genetic_context:
    variant_origin: GERMLINE
    allele_type: nonsense or frameshift N-terminal to Met116
    genomic_contexts:
    - coding sequence
    allelic_hit_role: BIALLELIC_INACTIVATION
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Loss of function of the mitochondrial arm only. Translation reinitiates at a
      downstream methionine, and the N-terminally truncated product still supports
      methylcobalamin synthesis, so this is a region-selective loss rather than absence
      of the protein.
  description: >-
    Premature stops early in the coding sequence remove the N-terminal segment, between
    Met62 and Met116, that adenosylcobalamin synthesis needs. Reinitiation downstream
    yields a shorter protein that keeps the cytosolic function, which is why these
    patients have isolated methylmalonic aciduria.
  downstream:
  - target: Loss of Mitochondrial Cobalamin Routing
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22156578
    reference_title: "Molecular mechanisms leading to three different phenotypes in the cblD defect of intracellular cobalamin metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, our data indicate that the sequence after Met116 is sufficient for MeCbl synthesis, whereas the additional sequence between Met62 and Met116 is required for AdoCbl synthesis."
    explanation: Localises the adenosylcobalamin requirement to the N-terminal segment
      that these alleles remove, and shows the remainder is enough for methylcobalamin.
  - reference: PMID:22156578
    reference_title: "Molecular mechanisms leading to three different phenotypes in the cblD defect of intracellular cobalamin metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Accordingly, western blot studies reveal proteins of the size expected from
      the stop codon position with subsequent reinitiation of translation.
    explanation: Shows the reinitiated, N-terminally truncated protein is actually made,
      which is what spares the cytosolic arm.

genetic:
- name: MMADHC
  gene_term:
    preferred_term: MMADHC
    term:
      id: hgnc:25221
      label: MMADHC
  relationship_type: CAUSATIVE
  notes: >-
    The domain-to-phenotype correlation is the defining feature of this gene, and it is
    graded rather than binary: beyond the three discrete classes, C-terminal truncations
    longer than 20 residues behave like the combined phenotype while shorter ones behave
    like isolated homocystinuria, so truncation length acts as a rheostat between them.
  evidence:
  - reference: PMID:18385497
    reference_title: Gene identification for the cblD defect of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cblD gene was localized to human chromosome 2q23.2, and a candidate gene,
      designated MMADHC (methylmalonic aciduria, cblD type, and homocystinuria), was identified
      in this region.
    explanation: The gene identification and its location.
  - reference: PMID:24722857
    reference_title: Characterization of functional domains of the cblD (MMADHC) gene product.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Testing 20 mutations (15 missense and five C-terminal truncations) across
      p.P154-S287 revealed the presence of a region (p.R197-D226) responsible for MeCbl
      synthesis
    explanation: Refines the C-terminal region required for the cytosolic arm by
      systematic mutagenesis in patient fibroblasts.

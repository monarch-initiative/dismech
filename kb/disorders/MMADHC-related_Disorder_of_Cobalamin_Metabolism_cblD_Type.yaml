treatments:
- name: Parenteral Hydroxocobalamin
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The mainstay. Supplying cobalamin in excess can drive residual flux through whichever
    arm retains partial function; it is given by injection because the defect is in
    intracellular handling rather than absorption.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

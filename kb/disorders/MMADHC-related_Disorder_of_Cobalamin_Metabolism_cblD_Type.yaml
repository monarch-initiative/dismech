  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The mainstay. Supplying cobalamin in excess can drive residual flux through whichever
    arm retains partial function; it is given by injection because the defect is in
    intracellular handling rather than absorption.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Failure of Cobalamin Branch-Point Trafficking
    treatment_effect: MODULATES
    description: >-
      Raises substrate availability at a trafficking step that is impaired rather than
      absent; it does not restore MMADHC function.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Early institution of injectable hydroxocobalamin improves survival and may
      reduce but not completely prevent primary manifestations.
    explanation: GeneReviews states both the benefit and its limit, which is why the link

name: MMADHC-related Disorder of Cobalamin Metabolism, cblD Type
creation_date: "2026-08-27T06:05:00Z"
category: Mendelian
description: >-
  cblD is the complementation group that broke the assumption that one gene defect in
  cobalamin metabolism gives one biochemical phenotype. MMADHC encodes the protein that
  sits at the branch point of intracellular B12 trafficking: after MMACHC strips the
  upper axial ligand from incoming cobalamin, MMADHC directs the product either into
  mitochondria, where it becomes adenosylcobalamin for methylmalonyl-CoA mutase, or
  keeps it in the cytosol, where it becomes methylcobalamin for methionine synthase.

  Because the protein is the switch rather than either destination, where a variant
  falls within it determines which arm fails. N-terminal null alleles abolish the
  mitochondrial route and give isolated methylmalonic aciduria. Null alleles across the
  C-terminus abolish both and give the combined picture originally described. Missense
  alleles in a narrow conserved C-terminal segment spare adenosylcobalamin synthesis and
  give isolated homocystinuria. One gene therefore produces three biochemical diseases
  that were, before MMADHC was cloned, assigned to different disorders entirely - and
  the cblD-variant patients were initially recognised precisely because their cells
  complemented the mutant classes their biochemistry resembled.

  The clinical consequences follow the biochemistry: the homocysteine-affected forms
  carry megaloblastic anemia and the thrombotic and endothelial complications of
  hyperhomocysteinemia, while the methylmalonate-predominant form carries the metabolic
  decompensation risk of an organic acidemia. Treatment is directed at whichever arm is
  broken, which is why establishing the biochemical form matters as much as establishing
  the gene.

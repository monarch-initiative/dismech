has_subtypes:
- name: cblD-MMA
  display_name: cblD-variant 2, isolated methylmalonic aciduria
  description: >-
    Null alleles N-terminal to Met116. The mitochondrial arm fails, so adenosylcobalamin
    is not made and methylmalonate accumulates; homocysteine handling is spared.
- name: cblD-HC
  display_name: cblD-variant 1, isolated homocystinuria
  description: >-
    Missense alleles in a conserved C-terminal segment. The cytosolic arm fails, so
    methylcobalamin is not made and homocysteine accumulates; adenosylcobalamin synthesis
    is preserved.
- name: cblD-MMA/HC
  display_name: Classic combined cblD
  description: >-
    Null alleles across the C-terminus. Both arms fail - the presentation of the original
    sibling pair in whom cblD was defined.
pathophysiology:
- name: Biallelic MMADHC Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Variants in MMADHC, whose position within the coding sequence determines which
    downstream arm is lost.
  downstream:
  - target: Failure of Cobalamin Branch-Point Trafficking
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18385497
    reference_title: Gene identification for the cblD defect of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transfection of wild-type MMADHC rescued the cellular phenotype, and the
      functional importance of mutant alleles was shown by means of transfection with
      mutant constructs.
    explanation: The rescue experiment establishing MMADHC as the cblD gene; IN_VITRO
      because it is transfection into patient fibroblasts.
- name: Failure of Cobalamin Branch-Point Trafficking
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MMADHC normally partitions processed cobalamin between the mitochondrial and
    cytosolic routes. Losing it removes the switch, and which destination goes unserved
    depends on which part of the protein the variant disrupts.
  biological_processes:
  - preferred_term: cobalamin metabolic process
    modifier: DECREASED
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  downstream:
  - target: Adenosylcobalamin Deficiency
    causal_link_type: DIRECT
    description: >-
      Occurs when the disrupted region is the N-terminal, mitochondrially directed part
      of the protein, or when C-terminal truncation removes both functions.
  - target: Methylcobalamin Deficiency
    causal_link_type: DIRECT
    description: >-
      Occurs when the disrupted region is the conserved C-terminal segment required for
      the cytosolic route.
  evidence:
  - reference: PMID:24722857
    reference_title: Characterization of functional domains of the cblD (MMADHC) gene product.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Previously we have shown that in cblD patients three types of MMADHC mutations
      exist: 1) null mutations N-terminal to Met116 cause isolated methylmalonic aciduria
      (cblD-MMA) due to AdoCbl deficiency; 2) null mutations across the C-terminus (p.Y140-R250)
      cause combined methylmalonic aciduria and homocystinuria (cblD-MMA/HC) due to AdoCbl
      and MeCbl deficiency; 3) missense mutations in a conserved C-terminal region (p.D246-L259)
      cause isolated homocystinuria (cblD-HC) due to MeCbl deficiency.'
    explanation: States the complete domain-to-phenotype map that this entry is organised
      around.
- name: Adenosylcobalamin Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The mitochondrial coenzyme is not made, so methylmalonyl-CoA mutase has no cofactor.
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    modifier: DECREASED
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
  downstream:
  - target: Methylmalonic Acid Accumulation
    causal_link_type: DIRECT
- name: Methylcobalamin Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The cytosolic coenzyme is not made, so methionine synthase cannot remethylate
    homocysteine to methionine.
  molecular_functions:
  - preferred_term: methionine synthase activity
    modifier: DECREASED
    term:
      id: GO:0008705
      label: methionine synthase activity
  downstream:
  - target: Homocysteine Accumulation and Methionine Deficit
    causal_link_type: DIRECT
- name: Methylmalonic Acid Accumulation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Methylmalonyl-CoA and methylmalonate build up, with the metabolic decompensation risk
    of an organic acidemia during catabolic stress.
  downstream:
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Methylmalonate and propionate pathway intermediates are toxic to mitochondrial
      energy metabolism, but the step from metabolite to the specific neurological lesion
      is not established.
- name: Homocysteine Accumulation and Methionine Deficit
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Homocysteine rises while methionine and therefore S-adenosylmethionine fall, so
    methylation-dependent processes and one-carbon metabolism are both impaired.
  downstream:
  - target: Impaired One-Carbon Metabolism in Erythroid Precursors
    causal_link_type: DIRECT
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed to homocysteine neurotoxicity together with loss of SAM-dependent
      methylation needed for myelination, but not resolved to a single step.
- name: Impaired One-Carbon Metabolism in Erythroid Precursors
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Blocked remethylation traps folate and impairs thymidylate and purine synthesis, so
    DNA synthesis in erythroid precursors lags nuclear maturation - the mechanism shared
    with the other remethylation disorders.
  downstream:
  - target: Megaloblastic Anemia
    causal_link_type: DIRECT
- name: Megaloblastic Anemia
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Macrocytic anemia with megaloblastic marrow changes, restricted to the forms in which
    the homocysteine arm is affected.
- name: Neurologic Injury
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Developmental delay, cognitive deficits and seizures. PROVISIONAL because both arms
    are implicated and the entry does not claim to resolve which metabolite does the
    damage in any individual patient.

  relationship_type: CAUSATIVE
  notes: >-
    The domain-to-phenotype correlation is the defining feature of this gene, and it is
    graded rather than binary: beyond the three discrete classes, C-terminal truncations
    longer than 20 residues behave like the combined phenotype while shorter ones behave
    like isolated homocystinuria, so truncation length acts as a rheostat between them.
  evidence:

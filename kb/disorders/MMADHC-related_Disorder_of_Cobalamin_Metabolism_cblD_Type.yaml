notes: >-
  Scope. This entry covers the MMADHC/cblD complementation group as a whole, including
  all three biochemical forms, because they are one gene acting through one branch point
  and separating them into three entries would fragment a mechanism that is best read
  together. The three forms are curated as has_subtypes. The pathograph starts from one
  node per allele class (N-terminal null, C-terminal missense, C-terminal null), each
  tagged with its subtype and wired only to the compartment it disables, so the
  position-to-arm map is carried by the edges rather than by prose. The biochemical
  phenotypes use the multivalued subtypes slot because each spans an isolated form and
  the combined form. The entry name follows the MMACHC/cblC entry already in the KB.

  MONDO anchoring. The entry is anchored on MONDO:0100463, the gene-level cblD class whose
  definition covers methylmalonic aciduria, homocystinuria or both. Its three children
  bind the subtypes: MONDO:0010185 (OMIM:277410) the combined form, MONDO:0700297
  (OMIM:620952) isolated homocystinuria, and MONDO:0700298 (OMIM:620953) isolated
  methylmalonic aciduria. MONDO:0700297 sits under homocystinuria without methylmalonic
  aciduria and MONDO:0700298 under methylmalonic acidemia rather than under
  MONDO:0100463. MONDO also holds Orphanet-derived classes for the two isolated forms,
  MONDO:0017683 (cblDv1) and MONDO:0017685 (cblDv2), as children of MONDO:0100463 with
  no link to the OMIM-derived pair; they are recorded as narrowMatch mappings.

  Differential. The Named Entity Confusion preflight flagged MMACHC (cblC) at 25% of
  MMADHC mentions in the research report, which is a real warning rather than a false
  positive: cblC is the adjacent step in the same pathway, the prototype of the group,
  and far more common. Sections of the report describing cblC were used only to
  characterise the pathway context and the differential, never as evidence for cblD
  claims, and no cblC-specific finding is cited here as a cblD finding.

  GeneReviews. PMID:20301503 covers the whole family of intracellular cobalamin
  disorders rather than cblD alone, and is explicit that cblC is its worked prototype.
  The phenotype items quoting its clinical description carry directness INDIRECT for
  that reason - the sentence describes cblC, and is cited for the shared mechanism rather
  than as a cblD observation.

  Gene identifier. The research report gave HGNC:26275 for MMADHC; the correct
  identifier is hgnc:25221, verified against the ontology before use.

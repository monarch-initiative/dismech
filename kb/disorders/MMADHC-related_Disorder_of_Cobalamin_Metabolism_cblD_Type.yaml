        label: hydroxocobalamin
  target_mechanisms:
  - target: Loss of Mitochondrial Cobalamin Routing
    treatment_effect: MODULATES
    description: >-
      Raises substrate availability at a routing step that is impaired rather than
      absent; it does not restore MMADHC function.
  - target: Loss of Cytosolic Cobalamin Routing to Methionine Synthase
    treatment_effect: MODULATES
    description: >-
      As for the mitochondrial arm, excess cobalamin can drive residual flux; it does not
      restore MMADHC function.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Early institution of injectable hydroxocobalamin improves survival and may
      reduce but not completely prevent primary manifestations.
    explanation: GeneReviews states both the benefit and its limit, which is why the link
      is MODULATES rather than RESTORES.
- name: Betaine
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Provides an alternative, methionine-synthase-independent route for remethylating
    homocysteine, so it addresses the cytosolic arm specifically. Relevant to the
    homocysteine-affected forms and not to isolated cblD-MMA.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betaine
      term:
        id: CHEBI:17750
        label: glycine betaine
  target_mechanisms:
  - target: Homocysteine Accumulation and Methionine Deficit
    treatment_effect: BYPASSES
    description: >-
      Routes around the blocked methionine synthase step rather than repairing it.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Long-term management focuses on improving the metabolic derangement by lowering
      plasma tHcy and MMA concentrations and maintaining plasma methionine concentrations
      within the normal range.
    explanation: GeneReviews states the biochemical targets that betaine and hydroxocobalamin
      are titrated against.
- name: Avoidance of Catabolic Stress and Nitrous Oxide
  therapeutic_modality: OTHER
  description: >-
    Prolonged fasting and dehydration precipitate decompensation in the methylmalonate-affected
    forms. Nitrous oxide is singled out because it irreversibly oxidises the cobalamin
    cofactor of methionine synthase, so it attacks the same step the disease already
    impairs - a routine anesthetic that is specifically hazardous here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Methylmalonic Acid Accumulation
    treatment_effect: MODULATES
    description: >-
      Avoiding catabolism limits substrate flux into the blocked pathway; it does not
      alter the block.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Agents/circumstances to avoid: Prolonged fasting (longer than overnight
      without dextrose-containing intravenous fluids); dietary protein intake below the
      recommended dietary allowance for age or more than that prescribed by a metabolic
      specialist; methionine restriction including use of medical foods that do not contain
      methionine; and the anesthetic nitrous oxide.'
    explanation: GeneReviews lists the circumstances and agents to avoid, including
      nitrous oxide.
discussions:
- discussion_id: cbld_one_gene_three_biochemical_diseases
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#N-Terminal MMADHC Null Alleles
  - pathophysiology#C-Terminal MMADHC Missense Alleles
  - pathophysiology#C-Terminal MMADHC Null Alleles
  - genetic#MMADHC
  prompt: Why does one gene produce three different biochemical diseases?
  rationale: >-
    Most inborn errors of metabolism give one metabolite signature because the affected
    protein does one job. MMADHC gives three because its job is to choose between two
    destinations, so a variant can remove one destination, the other, or both depending
    on where it falls.

    The evidence for this being a real domain effect rather than a description after the
    fact is that it was predicted and then tested. Systematic mutagenesis across
    p.P154-S287 in patient fibroblasts located a discrete region required for
    methylcobalamin synthesis, and truncations of graded length produced graded
    phenotypes between the isolated and combined pictures. That converts the three
    clinical classes from a taxonomy into a map of one protein.

    The history is worth keeping too: the cblD-variant patients were originally
    identified because their cells complemented cblE, cblG, cblA and cblB reference
    lines - that is, they behaved biochemically like those disorders while belonging
    genetically to none of them. Complementation analysis found the branch point before
    anyone knew what the gene was.
  evidence:
  - reference: PMID:15292234
    reference_title: The cblD defect causes either isolated or combined deficiency of
      methylcobalamin and adenosylcobalamin synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings indicate heterogeneity within the previously defined cblD mutant
      class and point to further complexity of intracellular cobalamin metabolism.
    explanation: The conclusion that split cblD into biochemical variants, drawn from
      complementation studies in cultured fibroblasts.
  - reference: PMID:24722857
    reference_title: Characterization of functional domains of the cblD (MMADHC) gene product.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, C-terminal truncation of more than 20 amino acids resulted in a
      cblD-MMA/HC like cellular phenotype, while truncation of between ten and 20 amino
      acids resulted in a cblD-HC like cellular phenotype.
    explanation: The graded truncation-length effect, quoted in full - the length of the
      truncation, not just its presence, selects between the combined and isolated-HC
      phenotypes.
- discussion_id: cbld_mitochondrial_function_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Mitochondrial Cobalamin Routing
  - pathophysiology#Adenosylcobalamin Deficiency
  prompt: What does MMADHC do inside mitochondria, and what sets its split between the
    two compartments?
  rationale: >-
    The evidence for a mitochondrial role is strong on necessity and location and weak on
    mechanism. Necessity: N-terminal null alleles abolish adenosylcobalamin synthesis
    while sparing methylcobalamin synthesis, and strengthening MMADHC's mitochondrial
    leader sequence shifts cofactor from the methylcobalamin to the adenosylcobalamin
    pool. Location: fractionation and immunofluorescence find the protein in both
    mitochondria and cytosol. Mechanism: every characterised MMADHC partner is cytosolic
    (MMACHC, methionine synthase and its reductase), and no interaction with the
    mitochondrial adenosyltransferase MMAB or the GTPase MMAA has been reported, so how
    cobalamin reaches MMAB after MMADHC enters the mitochondrion is not known.

    The determinant of the split is equally open. Mitochondrial membrane potential is
    one input: MMADHC is short-lived, collapse of the proton motive force stabilises it
    in the cytosol and raises methionine synthase activity, and LONP1 inhibition instead
    accumulates it inside mitochondria. That makes mitochondrial import, and LONP1-dependent
    turnover inside the organelle, candidate regulators of the split, but these results
    come from cell lines under pharmacological or mtDNA-depletion stress, not from cblD
    patient cells.
  evidence:
  - reference: PMID:23270877
    reference_title: "Subcellular location of MMACHC and MMADHC, two human proteins central to intracellular vitamin B(12) metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The factors that determine the distribution of MMADHC between the cytoplasm
      and mitochondria remain unknown.
    explanation: The authors who established the dual localisation state the open question
      directly.
  - reference: PMID:42709793
    reference_title: Mitochondrial depolarization stabilizes the vitamin B(12) chaperone MMADHC in the cytosol to increase MTR activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: MMADHC accumulates in mitochondria with LONP1 inhibition but in the cytosol
      upon PMF collapse, likely due to mitochondrial import failure.
    explanation: Identifies import and LONP1-dependent turnover as candidate controls of
      the compartmental split, in cultured cells.
  - reference: PMID:42709793
    reference_title: Mitochondrial depolarization stabilizes the vitamin B(12) chaperone MMADHC in the cytosol to increase MTR activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cytosol-stabilized MMADHC increases MTR levels and activity.
    explanation: Shows that shifting MMADHC toward the cytosol raises flux through the
      cytosolic arm, the converse of the mitochondrial-targeting result in cblD-MMA/HC cells.
- discussion_id: cbld_ptc_readthrough
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  - pathophysiology#N-Terminal MMADHC Null Alleles
  - pathophysiology#C-Terminal MMADHC Null Alleles
  prompt: Could premature termination codon readthrough restore MMADHC in patients?
  rationale: >-
    Most disease-associated MMADHC alleles create premature termination codons, which
    makes the gene a candidate for translational readthrough - forcing the ribosome past
    the stop codon to produce full-length protein. This has been shown for MMADHC in
    cells, with the effect depending on which specific PTC is present.

    Two things keep this a gap rather than a treatment. It has not been tested in
    patients, and the compounds used to induce readthrough in the published work are
    aminoglycosides, whose own toxicity is the subject of a separate disease entry in
    this knowledge base - a carrier of an MT-RNR1 variant given an aminoglycoside for
    readthrough would be at risk of exactly the ototoxicity that entry describes. Any
    clinical development would have to reckon with that, which is a reason to record the
    lead here rather than to present it as a prospect.
  evidence:
  - reference: PMID:33552904
    reference_title: 'MMADHC premature termination codons in the pathogenesis of cobalamin
      D disorder: Potential of translational readthrough reconstitution.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Aminoglycoside compounds induced translational PTC readthrough of MMADHC truncated
      variants, allowing the biosynthesis of full-length MMADHC in a PTC-specific manner.
    explanation: The cell-based result behind the lead, including its allele-specificity.
  - reference: PMID:33552904
    reference_title: 'MMADHC premature termination codons in the pathogenesis of cobalamin
      D disorder: Potential of translational readthrough reconstitution.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results suggest that translational PTC readthrough-based interventions
      could complement current therapies for cblD patients carrying specific MMADHC PTC
      mutations.
    directness: INDIRECT
    explanation: The authors frame this as a suggestion for future intervention rather
      than a demonstrated clinical benefit.

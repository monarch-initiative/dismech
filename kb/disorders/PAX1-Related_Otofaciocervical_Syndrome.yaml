name: PAX1-Related Otofaciocervical Syndrome
creation_date: "2026-08-29T00:00:00Z"
description: >-
  PAX1-related otofaciocervical syndrome (otofaciocervical syndrome type 2,
  OTFCS2) is an autosomal recessive disorder caused by biallelic
  loss-of-function variants in PAX1, a paired-box transcription factor expressed
  during development of the sclerotome, pharyngeal pouches, thymus and
  parathyroid glands. The constant features are craniofacial dysmorphism with
  low-set cup-shaped ears and preauricular pits, hearing loss, shoulder girdle
  anomalies (sloping shoulders, winged and hypoplastic scapulae), vertebral
  anomalies and mild intellectual disability with delayed language.

  The distinguishing feature relative to every other otofaciocervical phenotype
  is thymic: PAX1 is required for human thymic epithelial development, so
  biallelic null alleles produce thymic aplasia or hypoplasia and a syndromic
  form of severe combined immunodeficiency. This has a direct therapeutic
  consequence — the block is in the thymic stroma rather than the haematopoietic
  compartment, so affected patients fail to reconstitute T cells after
  allogeneic haematopoietic stem cell transplantation even when donor engraftment
  succeeds. Immunological severity varies across reported families, and at least
  one biallelic truncating genotype has been reported without immunodeficiency,
  so an immune phenotype should not be assumed from genotype alone.
category: Mendelian
parents:
- hereditary disease
- Inborn Errors of Immunity
synonyms:
- OTFCS2
- otofaciocervical syndrome 2
- otofaciocervical syndrome type 2
- PAX1 deficiency

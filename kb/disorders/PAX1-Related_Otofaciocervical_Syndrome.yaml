genetic:
- name: PAX1
  gene_term:
    preferred_term: PAX1
    term:
      id: hgnc:8615
      label: PAX1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic PAX1 variants cause otofaciocervical syndrome type 2. Reported
    alleles include the hypofunctional paired-box missense p.G166V, nonsense
    alleles and frameshift insertions. PAX1 lies at 20p11.22 and encodes a
    534-amino-acid paired-box transcription factor whose conserved 128-residue
    paired domain carries the DNA-binding activity.
  evidence:
  - reference: PMID:23851939
    reference_title: A hypofunctional PAX1 mutation causes autosomal recessively inherited otofaciocervical syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Filtering for variants with a percentage of alternate reads ≥ 90 % and a
      coverage of at least five reads identified only a single novel homozygous
      variant, c.497G>T, located in PAX1 that co-segregated with the disease in
      the family.
    explanation: >-
      Cosegregation of the homozygous PAX1 variant in a large consanguineous
      family establishes causality.
  - reference: PMID:32111619
    reference_title: PAX1 is essential for development and function of the human thymus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified rare biallelic PAX1 rare variants in all patients.
    explanation: >-
      Confirms biallelic PAX1 variants across an independent six-patient cohort.

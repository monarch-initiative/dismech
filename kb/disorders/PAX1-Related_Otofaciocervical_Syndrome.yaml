inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    OTFCS2 is autosomal recessive, with homozygous variants in consanguineous
    families and confirmed heterozygous carrier parents. This is the point of
    departure from the EYA1-related otofaciocervical phenotype, which is
    autosomal dominant.
  evidence:
  - reference: PMID:37924468
    reference_title: A Novel Truncating Mutation in PAX1 Gene Causes Otofaciocervical Syndrome Without Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel homozygous variant c.1212dup (p.Gly405Argfs*51) in the PAX1 gene
      was identified by whole exome sequencing (WES), and family segregation
      confirmed the heterozygous status of the mutation in the parents using the
      Sanger sequencing.
    explanation: >-
      Homozygosity in the proband with heterozygous parents establishes
      autosomal recessive inheritance.
  - reference: PMID:37924468
    reference_title: A Novel Truncating Mutation in PAX1 Gene Causes Otofaciocervical Syndrome Without Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otofaciocervical syndrome (OTFCS) is a rare genetic disorder of both
      autosomal recessive and autosomal dominant patterns of inheritance. It is
      caused by biallelic or monoallelic mutations in PAX1 or EYA1 genes,
      respectively.
    explanation: >-
      States the inheritance split between the PAX1 and EYA1 forms, which is the
      basis for curating them separately.
pathophysiology:
- name: Loss of PAX1 Transcription Factor Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic PAX1 variants abolish or reduce the DNA-binding and transcriptional
    activity of a paired-box transcription factor. Both mechanisms are
    documented: hypofunctional missense alleles in the conserved paired-box
    domain reduce transactivation of PAX1 target promoters, while frameshift and
    nonsense alleles remove the protein. PAX1 sits within the PAX-SIX-EYA-DACH
    network that also contains EYA1 and SIX1, which is why the PAX1 and EYA1
    disorders share a branchial-arch phenotype despite differing in inheritance
    and in the thymic component.
  genes:
  - preferred_term: PAX1
    term:
      id: hgnc:8615
      label: PAX1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: PAX1-mediated repression of canonical Wnt signaling
    term:
      id: GO:0090090
      label: negative regulation of canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:23851939
    reference_title: A hypofunctional PAX1 mutation causes autosomal recessively inherited otofaciocervical syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed a significantly reduced transactivation in HEK293T cells
      overexpressing Pax1(G157V) in comparison to Pax1(WT) expressing cells,
      indicating a reduced DNA-binding affinity of the mutant protein.
    explanation: >-
      Functional assay showing the missense allele is hypofunctional at the
      level of DNA binding and transactivation.
  - reference: PMID:23851939
    reference_title: A hypofunctional PAX1 mutation causes autosomal recessively inherited otofaciocervical syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, our results show that the strategy of pooling DNA is a
      powerful, cost-effective application for WES in consanguineous families
      and establish PAX1 as a new disease-causing gene for OFCS and as part of
      the EYA-DACH-SIX-PAX network, important in early embryogenesis.
    explanation: >-
      Establishes PAX1 causality and places it in the PAX-SIX-EYA-DACH network
      shared with EYA1.
  - reference: PMID:32111619
    reference_title: PAX1 is essential for development and function of the human thymus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that these mutant PAX1 proteins have an altered
      conformation and flexibility of the paired box domain and reduced
      transcriptional activity.
    explanation: >-
      Independently confirms reduced transcriptional activity across a further
      set of patient alleles.
  - reference: PMID:38664733
    reference_title: PAX1 represses canonical Wnt signaling pathway and plays dual roles during endoderm differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanically, PAX1 competes with SUMO E3 ligase PIASy to bind to TCF7L2,
      thus perturbing TCF7L2 SUMOylation level, further reducing its
      transcriptional activity and protein stability.
    explanation: >-
      Identifies the molecular mechanism by which PAX1 acts, competition with
      PIASy for TCF7L2 binding, which is what the disease alleles disrupt.
  - reference: PMID:38664733
    reference_title: PAX1 represses canonical Wnt signaling pathway and plays dual roles during endoderm differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, our data show PAX1 mutations found in SCID patients
      significantly compromise the suppressing ability of PAX1 on Wnt signaling.
    explanation: >-
      Connects the patient alleles specifically to loss of Wnt repression,
      making this the proximate molecular defect.
  downstream:
  - target: Impaired Pharyngeal Pouch and Thymic Epithelial Development
    causal_link_type: DIRECT
    description: >-
      PAX1 directly drives the transcriptional programme of pharyngeal
      pouch-derived tissue, of which the thymic epithelium is the principal
      product.
    evidence:
    - reference: PMID:32111619
      reference_title: PAX1 is essential for development and function of the human thymus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We generated patient-derived induced pluripotent stem cells and
        differentiated them into thymic epithelial progenitor cells and found
        that they have an altered transcriptional profile, including for genes
        involved in the development of the thymus and other tissues derived from
        pharyngeal pouches.
      explanation: >-
        Patient-derived cells show the transcriptional consequence directly in
        the relevant lineage.
  - target: Impaired Sclerotome-Derived Skeletal Patterning
    causal_link_type: DIRECT
    description: >-
      PAX1 is expressed in the sclerotome and is required for vertebral column
      and shoulder girdle patterning, the non-immune half of the phenotype.
    evidence:
    - reference: PMID:37924468
      reference_title: A Novel Truncating Mutation in PAX1 Gene Causes Otofaciocervical Syndrome Without Immunodeficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PAX1 encodes a transcription factor protein specifically expressed
        during the development of the skeleton, thymus, and parathyroid glands
      explanation: >-
        States the expression domains that partition the phenotype into skeletal
        and thymic components.
- name: Impaired Pharyngeal Pouch and Thymic Epithelial Development
  biological_scale: TISSUE
  description: >-
    Failure of the PAX1-dependent transcriptional programme in the third
    pharyngeal pouch produces thymic aplasia or hypoplasia. The lesion is in the
    thymic epithelial stroma, not in the haematopoietic progenitors that would
    normally seed it.
  cell_types:
  - preferred_term: thymic epithelial cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  biological_processes:

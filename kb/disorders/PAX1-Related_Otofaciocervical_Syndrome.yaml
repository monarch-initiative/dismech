    reference_title: A Novel Truncating Mutation in PAX1 Gene Causes Otofaciocervical Syndrome Without Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only fourteen affected individuals with OTFCS2 from six different
      families have been documented.
    explanation: >-
      Gives the reported case count supporting the ultra-rare band.
experimental_models:
- name: Patient-derived iPSC thymic epithelial progenitor cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells reprogrammed from OTFCS2 patients and
    differentiated into thymic epithelial progenitor cells, allowing the
    transcriptional consequence of biallelic PAX1 loss to be read out directly
    in the affected human lineage.
  publication: PMID:32111619
  modeled_mechanisms:
  - target: Impaired Pharyngeal Pouch and Thymic Epithelial Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Human, patient-genotype cells differentiated into the exact lineage whose
      failure causes the immunodeficiency.
    limitations: >-
      Thymic epithelial progenitor cells in culture lack the three-dimensional
      thymic architecture and the haematopoietic crosstalk required for actual
      thymopoiesis, so the model reports a transcriptional phenotype rather than
      a functional T cell developmental defect.
    readouts:
    - name: Thymic epithelial progenitor transcriptional profile
      target: Impaired Pharyngeal Pouch and Thymic Epithelial Development
      direction: ALTERED
      interpretation: >-
        Altered expression of thymus and pharyngeal pouch developmental genes,
        the molecular correlate of the thymic aplasia.
      evidence:
      - reference: PMID:32111619
        reference_title: PAX1 is essential for development and function of the human thymus.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We generated patient-derived induced pluripotent stem cells and
          differentiated them into thymic epithelial progenitor cells and found
          that they have an altered transcriptional profile, including for genes
          involved in the development of the thymus and other tissues derived
          from pharyngeal pouches.
        explanation: >-
          Reports the transcriptional measurement behind this readout.
    evidence:
    - reference: PMID:32111619
      reference_title: PAX1 is essential for development and function of the human thymus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrated that these mutant PAX1 proteins have an altered
        conformation and flexibility of the paired box domain and reduced
        transcriptional activity.
      explanation: >-
        Supports the model as informative for the transcriptional defect
        upstream of thymic epithelial failure.
treatments:
- name: Cultured Thymus Tissue Transplantation
  description: >-
    Transplantation of cultured allogeneic thymus tissue supplies the epithelial
    niche that PAX1-deficient patients lack, and is the rational corrective
    therapy for the immunodeficiency. Reported PAX1-deficient patients recovered
    T cell immunity substantially better after thymus transplantation than after
    allogeneic HSCT. This is the same approach used for congenital athymia in
    complete DiGeorge syndrome and FOXN1 deficiency.
  treatment_term:
    preferred_term: cultured thymus tissue transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Failure of Thymic T Cell Development
    description: >-
      Replaces the missing thymic epithelial niche so that the patient's own
      normal haematopoietic progenitors can complete T cell development.
    evidence:
    - reference: PMID:37689091
      reference_title: Expanding the clinical and immunological phenotypes of PAX1-deficient SCID and CID patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hematopoietic stem cell transplantation resulted in poor immune
        reconstitution with absent naïve T cells, contrasting with the superior
        recovery of T cell immunity after thymus transplantation.
      explanation: >-
        Directly contrasts the two interventions against the same node and
        establishes thymus transplantation as the one that works.
  evidence:
  - reference: PMID:37689091
    reference_title: Expanding the clinical and immunological phenotypes of PAX1-deficient SCID and CID patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corrective treatment was required in 4/6 patients.
    explanation: >-
      Establishes that corrective immune therapy is needed in the majority of
      reported patients.
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT has been attempted for the immunodeficiency but does not
    restore T cell immunity in PAX1 deficiency, because the block is in the
    thymic epithelial niche rather than in the haematopoietic progenitors.
    Reported patients failed T cell reconstitution despite successful donor
    engraftment. Recorded here as a documented therapeutic failure, which is
    itself clinically actionable.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  evidence:
  - reference: PMID:32111619
    reference_title: PAX1 is essential for development and function of the human thymus.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated the molecular and cellular basis of severe combined
      immunodeficiency (SCID) in six patients with otofaciocervical syndrome
      type 2 who failed to attain T cell reconstitution after allogeneic
      hematopoietic stem cell transplantation, despite successful engraftment in
      three of them.
    explanation: >-
      Refutes HSCT as effective therapy for the T cell defect in this disease;
      graded REFUTE because the outcome measured was failure of the intervention
      to achieve its goal.
differential_diagnoses:
- name: EYA1-related branchiootorenal spectrum, including EYA1-related otofaciocervical syndrome
  description: >-
    The other otofaciocervical phenotype. It is autosomal dominant, EYA1-related,
    lacks the thymic and immunological features, and a 2025 integrated analysis
    of all published EYA1-related cases concluded it forms a single continuum
    with branchiootorenal spectrum disorder rather than a separate entity. It is
    curated in dismech as kb/disorders/EYA1-Related_Branchiootorenal_Spectrum.yaml.
  evidence:
  - reference: PMID:41300719
    reference_title: "Otofaciocervical Syndrome and Its Overlap with Branchiootorenal Spectrum: An Integrated Literature Analysis of EYA1-Related Disorders, Including a Novel Case with an 8q13.2q13.3 Deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that BORSD and OTFCS constitute a single EYA1-related
      diagnostic continuum.
    explanation: >-
      States the conclusion that the EYA1-related otofaciocervical phenotype is
      not a separate entity from branchiootorenal spectrum disorder.
  - reference: PMID:41300719
    reference_title: "Otofaciocervical Syndrome and Its Overlap with Branchiootorenal Spectrum: An Integrated Literature Analysis of EYA1-Related Disorders, Including a Novel Case with an 8q13.2q13.3 Deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucially, all reported OTFCS patients with EYA1 variants had renal
      anomalies, a feature previously considered a hallmark of BORSD.
    explanation: >-
      Removes the renal-sparing criterion that had been used to separate the
      EYA1 otofaciocervical phenotype from branchiootorenal spectrum disorder.
- name: 22q11.2 deletion syndrome
  description: >-
    The other major cause of thymic hypoplasia with pharyngeal-arch dysmorphism
    and T cell deficiency. Distinguished by conotruncal cardiac defects,
    hypocalcaemia from parathyroid hypoplasia, and the deletion itself; it is
    not associated with the shoulder girdle anomalies of otofaciocervical
    syndrome.
notes: >-
  Scope decision, and it departs from the stub. The stub proposed lumping the
  two numbered otofaciocervical forms into one entry on the grounds that both
  sit on the EYA1-SIX1-PAX1 branchial developmental axis. Curating against the
  literature does not support that packaging:

  - The EYA1 form is autosomal dominant, and a 2025 integrated analysis of every
    published EYA1-related case concluded it and branchiootorenal spectrum
    disorder are one diagnostic continuum (PMID:41300719), notably because all
    reported EYA1 otofaciocervical patients had renal anomalies. dismech already
    curates that continuum as EYA1-Related_Branchiootorenal_Spectrum.yaml, where
    MONDO:0008163 is recorded as a differential.
  - The PAX1 form is autosomal recessive and adds thymic aplasia and a syndromic
    SCID that the EYA1 form does not have.

  Lumping them would have produced one entry carrying two mechanisms with
  opposite inheritance, which is the pattern the curation guidance warns against.
  So this entry is scoped to the PAX1 form at MONDO:0014254, and the EYA1 form is
  recorded as a differential pointing at the existing entry. The parent term
  MONDO:0008163 is deliberately not claimed by any single disorder entry.

  A further nuance worth preserving: PAX1 has also been reported in Klippel-Feil
  syndrome and oculo-auriculo-vertebral syndrome, so PAX1 is not
  otofaciocervical-specific. Those phenotypes are out of scope for this entry.

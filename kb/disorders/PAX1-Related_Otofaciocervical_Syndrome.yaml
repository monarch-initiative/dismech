    term:
      id: GO:0048538
      label: thymus development
    modifier: DECREASED
  - preferred_term: pharyngeal system development
    term:
      id: GO:0060037
      label: pharyngeal system development
    modifier: DECREASED
  evidence:
  - reference: PMID:28657137
    reference_title: A novel PAX1 null homozygous mutation in autosomal recessive otofaciocervical syndrome associated with severe combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mouse model strongly supports the hypothesis that PAX1 depletion in
      our patients caused thymus aplasia responsible for SCID.
    explanation: >-
      Attributes the immunodeficiency to thymic aplasia rather than an intrinsic
      lymphocyte defect.
  downstream:
  - target: Failure of Thymic T Cell Development
    causal_link_type: DIRECT
    description: >-
      Without thymic epithelium there is no niche for T cell development, so
      T cells fail to mature regardless of progenitor availability.
    evidence:
    - reference: PMID:32111619
      reference_title: PAX1 is essential for development and function of the human thymus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results identify biallelic, loss-of-function PAX1 mutations as the
        cause of a syndromic form of SCID due to altered thymus development.
      explanation: >-
        States the causal chain from PAX1 loss through thymus development to
        SCID.
- name: Failure of Thymic T Cell Development
  biological_scale: ORGANISM
  description: >-
    Absent or severely reduced T cell output producing a syndromic severe
    combined immunodeficiency. The stromal locus of the defect is
    therapeutically decisive: allogeneic haematopoietic stem cell
    transplantation supplies progenitors but not the epithelial niche they
    require, so T cell reconstitution fails even after successful engraftment.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  evidence:
  - reference: PMID:32111619
    reference_title: PAX1 is essential for development and function of the human thymus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated the molecular and cellular basis of severe combined
      immunodeficiency (SCID) in six patients with otofaciocervical syndrome
      type 2 who failed to attain T cell reconstitution after allogeneic
      hematopoietic stem cell transplantation, despite successful engraftment in
      three of them.
    explanation: >-
      The engraftment-without-reconstitution result is the direct clinical
      demonstration that the defect is stromal rather than haematopoietic.
  - reference: PMID:37689091
    reference_title: Expanding the clinical and immunological phenotypes of PAX1-deficient SCID and CID patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Normal ex vivo differentiation of PAX1-deficient CD34+ cells into mature T
      cells demonstrated the absence of a hematopoietic cell-intrinsic defect.
    explanation: >-
      Directly excludes a haematopoietic-intrinsic defect by showing patient
      CD34+ cells differentiate normally outside the patient's thymus, which
      localises the lesion to the stroma.
  notes: >-
    Immunological severity is variable across reported families and is not
    predictable from genotype: a biallelic truncating PAX1 variant has been
    reported in a patient without immunodeficiency. Do not infer SCID from a
    PAX1 genotype alone.
- name: Impaired Sclerotome-Derived Skeletal Patterning
  biological_scale: TISSUE
  description: >-
    Loss of PAX1 in the sclerotome disrupts vertebral column and shoulder girdle
    development, producing the vertebral anomalies, sloping shoulders and
    winged, hypoplastic scapulae that give the syndrome its name.
  biological_processes:
  - preferred_term: somite development
    term:
      id: GO:0061053
      label: somite development
    modifier: DECREASED
  evidence:
  - reference: PMID:37924468
    reference_title: A Novel Truncating Mutation in PAX1 Gene Causes Otofaciocervical Syndrome Without Immunodeficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Experimentally, mice with PAX1 deficiency showed vertebral column
      anomalies and different degrees of thymic hypoplasia
    explanation: >-
      The mouse phenotype pairs vertebral and thymic involvement, matching the

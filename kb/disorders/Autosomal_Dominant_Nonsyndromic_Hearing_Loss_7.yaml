      data. Curated deliberately so the node is not read as a settled postdevelopmental
      maintenance claim.
- name: Cochlear Hair Cell Apoptosis
  description: >-
    A candidate cellular endpoint, supported only in a cell line so far. In HEI-OC1
    auditory cells, the C-terminal domain of LMX1A was shown to be important for mediating
    apoptosis, and cells carrying the heterozygous frameshift variant upregulated several
    hearing-loss-associated genes at the transcript level. This is included because it is
    the only cellular death mechanism yet proposed for DFNA7, and flagged as in vitro
    because no human or mouse cochlear histology exists for a heterozygous LMX1A allele.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlea auditory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  downstream:
  - target: Progressive Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36519758
    reference_title: "A novel frameshift variant of LMX1A that leads to autosomal dominant non-syndromic sensorineural hearing loss: functional characterization of the C-terminal domain in LMX1A."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Furthermore, apoptosis assays suggested that the C-terminal domain of the LMX1A was important for mediating apoptosis in the cochlear hair cells."
    explanation: >-
      Graded PARTIAL because the assay establishes a domain requirement in a cell line,
      not that hair cell apoptosis occurs in DFNA7 patients.
  - reference: PMID:36519758
    reference_title: "A novel frameshift variant of LMX1A that leads to autosomal dominant non-syndromic sensorineural hearing loss: functional characterization of the C-terminal domain in LMX1A."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We also found that the embryonic cells carrying with the heterozygous variant significantly expressed several upregulated HL-associated genes at transcriptional level."
    explanation: >-
      A transcriptional consequence of the heterozygous allele in cells; supportive of a
      cell-autonomous effect but not of apoptosis in patient tissue.

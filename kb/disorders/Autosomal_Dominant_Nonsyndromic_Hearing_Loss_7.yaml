    explanation: A second aided individual in the same family, at the severe end of the range, which is what makes amplification the standing management rather than a single case.
- name: Cochlear Implantation
  description: Cochlear implantation may be considered for severe-to-profound hearing loss with insufficient benefit from amplification. The reported LMX1A patient SB727 underwent unilateral implantation after left-ear deterioration and improved speech perception at three and six months. This one-patient experience cannot guarantee long-term outcome or preservation of every neural component in all carriers.

    reference_title: Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: recommend screening for HI in subjects with mono-allelic loss of LMX1A.
    explanation: 'The reverse direction of ascertainment, and the practically useful one: someone found to have lost one LMX1A copy for another reason, such as a chromosomal deletion, should have their hearing checked.'

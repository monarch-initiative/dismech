treatments:
- name: Hearing Amplification
  description: Fit and adjust hearing aids according to ear-specific thresholds and communication needs. Reported LMX1A patients have used bilateral aids, including a child with reported improvement in speech perception. Benefit and timing require individual assessment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  evidence:

- name: Distinguish recessive LMX1A-related hearing loss
  description: A homozygous p.Ile369Thr variant was reported in a consanguineous Pakistani family with severe-to-profound hearing loss. Its predicted structural interactions do not establish the same mechanism as dominant alleles. In the 2026 INS-promoter assay it retained wild-type-like activity. Evaluate zygosity, segregation and the clinical context separately.

inheritance:
- name: Autosomal dominant
  description: Heterozygous pathogenic LMX1A variants segregate through multiple generations; de novo variants also occur. Expressivity varies substantially within families. A heterozygous parent can transmit the variant to half of offspring, but this does not predict age at onset or severity.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:

genetic:
- name: LMX1A
  notes: >-
    LMX1A encodes a LIM-homeodomain transcription factor with two N-terminal LIM domains
    that mediate protein-protein interactions, a central homeodomain that binds DNA, and a
    C-terminal region required for the protein-DNA interaction and for interaction with
    the LIM2 domain. Disease alleles are distributed across all three regions. Val241 in
    the homeodomain has now been hit by at least two different substitutions in unrelated
    families, which has been suggested as a possible mutational hotspot.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  case_fractions:
  - population: Korean hearing loss probands undergoing exome sequencing
    case_fraction_percent: 0.7
    cohort_size: 728
    notes: >-
      Five DFNA7 families among 728 probands sequenced regardless of audiological
      phenotype. This is a share of an ascertained hearing loss cohort, not a population
      prevalence, and it is the only quantitative figure available for how often LMX1A
      explains hereditary hearing loss.
    evidence:
    - reference: PMID:35711095
      reference_title: "Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five LMX1A -associated DFNA7 families (approximately 0.7%), the pedigrees of whom indicated autosomal-dominant hearing loss, were identified, and segregation was studied using Sanger sequencing."
      explanation: The yield figure and its denominator.
    - reference: PMID:35711095
      reference_title: "Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among 728 probands of which genomic DNA went through exome sequencing regardless of any specific audiologic phenotypes, probands for which exome sequencing was performed and a causative LMX1A variant was found were all included."
      explanation: >-
        The ascertainment, which matters for interpreting the fraction: probands were
        sequenced regardless of audiological phenotype, so the denominator is not enriched
        for the asymmetric presentation LMX1A causes.
  evidence:
  - reference: PMID:42253511
    reference_title: "A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the LIM-homeodomain transcription factor LMX1A represent a rare yet critical etiology for autosomal dominant nonsyndromic hearing loss 7 (DFNA7) and less frequently, its autosomal recessive counterpart (ARNSHL)."
    explanation: The gene-disease relationship, and the existence of a recessive counterpart.
  - reference: PMID:41078281
    reference_title: "A Novel Missense Variant in LMX1A Leads to Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Other pathogenic missense variants have previously been reported at the same Val241 site, suggesting that this location may be a hotspot for pathogenic variants contributing to NSHL, although further research is needed."
    explanation: >-
      Graded PARTIAL because the authors explicitly hedge the hotspot claim; two
      substitutions at one residue is suggestive, not established.
  - reference: PMID:35711095
    reference_title: "Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, Arg208*-induced premature termination of translation destroyed the structure of the LMX1A protein, including the DNA-binding homeodomain, and p.Gln297Thrfs*41 led to the loss of the C-terminal helix involved in LIM2 domain interaction."
    explanation: >-
      The structural consequences of the truncating alleles, which is why alleles across
      the whole gene converge on reduced dosage.
  - reference: PMID:29971487
    reference_title: "A variant in LMX1A causes autosomal recessive severe-to-profound hearing impairment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that LMX1A is involved in both human autosomal recessive and dominant sensorineural hearing impairment."
    explanation: >-
      Graded PARTIAL because it establishes something about the gene rather than about
      DFNA7: LMX1A is not exclusively dominant, so a homozygous LMX1A finding does not by
      itself place a family in this entry.
- name: LMX1A homozygous C-terminal missense allele
  notes: >-
    Recorded to keep the boundary of this entry explicit. A homozygous p.Ile369Thr variant
    was reported in a consanguineous Pakistani family with autosomal recessive
    severe-to-profound hearing impairment. Mechanistically it is informative for DFNA7
    because the substituted residue interacts with homeodomain residue Val241, the same
    residue mutated in dominant disease, but the resulting phenotype is a separate MONDO
    concept and is not curated in this entry.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  evidence:
  - reference: PMID:29971487
    reference_title: "A variant in LMX1A causes autosomal recessive severe-to-profound hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Ile369Thr variant disrupts several C-terminal and homeodomain residue interactions, including an interaction with homeodomain residue p.Val241 that was previously found to be involved in autosomal dominant progressive HI."
    explanation: >-
      The structural link between the recessive C-terminal allele and the dominant
      homeodomain residue, which is why the two inheritance modes are not unrelated
      accidents of the same gene.
diagnosis:
- name: Consider LMX1A when dominant hearing loss is asymmetric
  description: >-
    DFNA7 is reached by gene-panel or exome sequencing rather than by any specific
    audiological test, but asymmetry is a usable prompt. Asymmetric thresholds in a
    dominant pedigree would ordinarily suggest an acquired or structural cause; in this
    disorder they are the rule. Imaging is typically normal, so a normal CT does not
    argue against the diagnosis, and in one severely affected proband high-resolution
    imaging showed bilateral cochlear aperture stenosis, so an abnormal scan does not
    argue against it either.
  evidence:
  - reference: PMID:35711095
    reference_title: "Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we suggest that LMX1A is one of the candidate genes which, if altered, could be associated with dominantly inherited asymmetric hearing loss."
    explanation: The authors' explicit diagnostic recommendation.
  - reference: PMID:42253511
    reference_title: "A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "High-resolution imaging revealed bilateral cochlear aperture stenosis (CAS) in the severely affected proband."
    explanation: >-
      Graded PARTIAL: a single severely affected proband with an imaging abnormality, in a
      disorder otherwise characterised by normal scans. Recorded so a curator does not
      treat normal imaging as an entry criterion.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids, fitted to the audiogram. There is no disease-modifying therapy for
    DFNA7. Asymmetric thresholds complicate fitting in a way they do not for symmetric
    dominant forms, and the wide intrafamilial variability means timing has to be
    individual rather than inherited from an affected parent's course.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  notes: >-
    No NCIT clinical-action term exists for hearing-aid fitting that is reachable from
    NCIT:C25218, so treatment_term is deliberately left unbound with a free-text
    preferred_term.

    No DFNA7-specific report of cochlear implantation or of speech-language rehabilitation
    was found, so neither is curated here even though both are standard in severe
    nonsyndromic hearing loss generally. This is a scoping decision, not an omission.
  evidence:
  - reference: PMID:29754270
    reference_title: "Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unraveling the causes and pathomechanisms of progressive disorders is essential for the development of therapeutic strategies."
    explanation: >-
      Graded PARTIAL and included only to record that the literature frames DFNA7 as
      currently untreated at the level of mechanism; it does not attest amplification use
      in a specific patient, which no reviewed report documents.
- name: Genetic Counselling with Audiologic Surveillance
  description: >-
    Counselling carries an unusual amount of weight here. Onset within a single family
    spans infancy to mid-adulthood on one allele, so an at-risk child cannot be reassured
    by a mildly affected parent, and a de novo allele has been documented, so an isolated
    case does not exclude the gene. Serial audiometry rather than a single normal test is
    what detects the progressive component.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42253511
    reference_title: "A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations exhibited significant intrafamilial phenotypic variability, with hearing loss (HL) severity ranging from mild to profound, and onset varying from infancy to mid-adulthood."
    explanation: The intrafamilial spread that makes prediction from a relative's course unsafe.
  - reference: PMID:29754270
    reference_title: "Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One variant, c.721G > C (p.Val241Leu), occurred de novo and is predicted to affect the homeodomain of LMX1A, which is essential for DNA binding."
    explanation: Documented de novo occurrence, which is what makes a negative family history uninformative.
animal_models:
- name: Lmx1a mutanlallemand and Belly Spot and Deafness mice
  species: Mouse
  genotype: Lmx1a mtl and Lmx1a bsd, homozygous
  publication: PMID:23226461
  description: >-
    Two spontaneous Lmx1a alleles: mtl, a 3' splice-site point mutation in exon 4 producing
    a truncated protein affecting the homeodomain, and bsd, a genomic deletion removing
    exon 3 and truncating within the LIM2 domain. Both reduce Lmx1a transcript levels.
    Homozygotes are deaf by auditory brainstem response, circle and toss their heads, and
    lack endolymphatic ducts and semicircular canals with short cochlear ducts. Hmx2/3 and
    Pax2 expression are down-regulated, placing Lmx1a upstream of those factors in early
    inner ear morphogenesis.
  genes:
  - preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  modeled_mechanisms:
  - target: Reduced Transactivation of LMX1A Target Genes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      These alleles establish in vivo what the human reporter assays measure in vitro:
      truncating Lmx1a lesions reduce transcript levels and reduce expression of
      downstream targets. That is the node being modelled, and it is modelled well.
    limitations: >-
      The relationship to DFNA7 stops there. Both alleles are recessive in the mouse.
      Heterozygous and wild-type littermates have normal hearing, so this system contains
      no animal in the genetic state that causes human DFNA7. The homozygous phenotype is
      a gross developmental malformation of the membranous labyrinth, which is precisely
      what human heterozygotes do not have on imaging. Reading these mice as a model of
      DFNA7 would invert the disease mechanism from maintenance failure to failed
      morphogenesis.
    readouts:
    - name: Hmx2/Hmx3 and Pax2 expression in the developing otocyst
      target: Reduced Transactivation of LMX1A Target Genes
      direction: DECREASED
      interpretation: >-
        Downstream transcriptional targets fall when Lmx1a is truncated, the in vivo
        counterpart of the reduced transactivation measured for human alleles.
      evidence:
      - reference: PMID:23226461
        reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hmx2/3 and Pax2 expression are also down-regulated in mtl and bsd mutants, suggesting a role of Lmx1a upstream of these transcription factors in early inner ear morphogenesis."
        explanation: The measured transcriptional consequence of Lmx1a truncation in vivo.
    - name: Auditory brainstem response by genotype
      target: Reduced Transactivation of LMX1A Target Genes
      direction: UNCHANGED
      interpretation: >-
        Deliberately recorded as unchanged, because the informative result here is the
        negative one: heterozygotes hear normally, so mouse Lmx1a dosage does not
        reproduce the human dominant phenotype.
      evidence:
      - reference: PMID:23226461
        reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The analysis of auditory brainstem responses (ABR) showed that mtl and bsd homozygotes are deaf, whereas heterozygous and wildtype littermates have normal hearing."
        explanation: >-
          The genotype-phenotype split in the mouse, which is the basis for treating the
          model as informative about the gene rather than about the dominant disease.
    evidence:
    - reference: PMID:23226461
      reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both mutations lead to a truncated LMX1A protein affecting the homeodomain (mtl) or LIM2-domain (bsd), which is critical for LMX1A protein function."
      explanation: >-
        The molecular lesions, which are of the same structural classes as human DFNA7
        alleles and so make the model informative for the transcriptional node.
  - target: Impaired Maintenance of Cochleovestibular Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse does not reproduce the human maintenance failure. Instead of an
      anatomically normal ear that deteriorates, homozygotes have an ear that was never
      built correctly, and heterozygotes have no phenotype at all.
    limitations: >-
      Recessive lethality of the phenotype for modelling purposes: there is no mouse
      genotype corresponding to a human DFNA7 patient. The homozygous lesion is
      morphogenetic and prenatal, evident on paint-filled inner ears at E16.5, whereas
      human DFNA7 hearing loss frequently begins in adolescence or adulthood on an ear
      that imaging calls normal. Any inference from these mice about whether adult LMX1A
      restoration could help is therefore unsupported.
    evidence:
    - reference: PMID:23226461
      reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Paint-filled inner ears at E16.5 revealed that mtl and bsd homozygotes lack endolymphatic ducts and semicircular canals and have short cochlear ducts."
      explanation: >-
        A prenatal structural absence of major labyrinthine components, which is not the
        human DFNA7 lesion and refutes reading this model as one of postdevelopmental
        maintenance.
    - reference: PMID:23226461
      reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "The analysis of auditory brainstem responses (ABR) showed that mtl and bsd homozygotes are deaf, whereas heterozygous and wildtype littermates have normal hearing."
      explanation: >-
        Mouse heterozygotes are unaffected, so the genetic state that defines DFNA7
        produces no auditory phenotype in this species.
  evidence:
  - reference: PMID:23226461
    reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The characterization of these two new Lmx1a alleles highlights the critical role of this gene in the development of the cochlea and vestibular system."
    explanation: The authors' own summary of what these alleles establish.
- name: Lmx1a dreher null mouse
  species: Mouse
  genotype: Lmx1a dreher, homozygous functional null
  publication: PMID:19540218
  description: >-
    The classical Lmx1a functional null. Homozygotes lack the endolymphatic duct and have
    a poorly developed membranous labyrinth. The more informative finding is that the
    three primary otic fates are still specified but their boundaries are violated, with
    an expanded neurogenic domain and ectopic vestibular-like hair cells in the cochlear
    duct, which is what makes Lmx1a a selector gene rather than a differentiation factor.
    Later work on the same allele showed the stria vascularis fails to form: marginal and
    intermediate cell markers are absent, prospective intermediate cells migrate and then
    disappear, and no endocochlear potential is generated.
  genes:
  - preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  modeled_mechanisms:
  - target: LMX1A Haploinsufficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Included because it is the model most often cited when LMX1A is discussed, and
      because being explicit about what it does not show is more useful than omitting it.
      The dreher null defines the gene's developmental job comprehensively. It does not
      model a heterozygous dosage reduction.
    limitations: >-
      Complete homozygous loss of function, against a human disease of one remaining
      functional allele. The phenotypes are of a kind absent from human DFNA7: no
      endocochlear potential, absent stria vascularis marker expression, ectopic
      vestibular-like hair cells in the cochlear duct. Quantitatively and qualitatively
      this is a different lesion, and citing it as the DFNA7 mechanism would overstate
      what heterozygous human alleles do.
    readouts:
    - name: Endocochlear potential
      target: LMX1A Haploinsufficiency
      direction: ABOLISHED
      interpretation: >-
        Complete Lmx1a loss abolishes the endocochlear potential. No comparable
        measurement exists for a heterozygous allele in any species.
      evidence:
      - reference: PMID:40109362
        reference_title: "Lmx1a is essential for marginal cell differentiation and stria vascularis formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, in the absence of Lmx1a expression, no endocochlear potential is observed."
        explanation: The functional endpoint of strial failure in the homozygous null.
    - name: Stria vascularis marker expression
      target: LMX1A Haploinsufficiency
      direction: DECREASED
      interpretation: >-
        Marginal and intermediate cell identity markers are absent, showing that Lmx1a is
        required for strial cell differentiation and not only for gross morphogenesis.
      evidence:
      - reference: PMID:40109362
        reference_title: "Lmx1a is essential for marginal cell differentiation and stria vascularis formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the absence of Lmx1a, we observe a lack of proteins specific to the stria vascularis, such as BSND and KCNQ1 in marginal cells and CD44 in intermediate cells."
        explanation: The cell-type-specific molecular readout of strial failure.
    evidence:
    - reference: PMID:19540218
      reference_title: "Lmx1a maintains proper neurogenic, sensory, and non-sensory domains in the mammalian inner ear."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "In an Lmx1a functional null mutant, dreher (dr(J)/dr(J)), the inner ears lack a non-sensory structure, the endolymphatic duct, and the membranous labyrinth is poorly developed."
      explanation: >-
        A structural developmental phenotype absent from human DFNA7, which is why the
        null is recorded as failing to recapitulate the human heterozygous mechanism.
  evidence:
  - reference: PMID:19540218
    reference_title: "Lmx1a maintains proper neurogenic, sensory, and non-sensory domains in the mammalian inner ear."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, aberrant and ectopic sensory organs are observed; most striking among these is vestibular-like hair cells located in the cochlear duct."
    explanation: >-
      The boundary-violation phenotype that establishes Lmx1a's selector-gene role, and
      the clearest illustration of how different the null is from the human disease.
  - reference: PMID:40109362
    reference_title: "Lmx1a is essential for marginal cell differentiation and stria vascularis formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The transcription factor Lmx1a is widely expressed during early inner ear development, and mice lacking Lmx1a expression exhibit fusion of cochlear and vestibular hair cells and fail to form the ductus reuniens and the endolymphatic sac."
    explanation: The developmental scope of Lmx1a loss in the null, summarised by the same group.
discussions:
- discussion_id: lmx1a_dominant_model_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Every Lmx1a animal model of hearing loss is a homozygous null with a malformed inner
    ear, while DFNA7 is a heterozygous, anatomically normal ear that deteriorates. Does
    mouse Lmx1a heterozygosity really produce no auditory phenotype, or has it never been
    looked for with sufficiently sensitive or sufficiently aged measurements?
  attaches_to:
  - pathophysiology#Impaired Maintenance of Cochleovestibular Function
  - animal_models#Mouse
  rationale: >-
    This is the central translational problem for DFNA7 and it is a mismatch rather than
    an absence of evidence. Three independent Lmx1a alleles have been characterised in
    mice and all report that heterozygotes hear normally, so the negative result is
    reproducible. But the reported ABR comparisons are made in young animals in studies
    designed around the homozygous phenotype, whereas the human disease is late-onset and
    progressive and in some individuals does not declare itself until mid-adulthood. A
    mouse tested at a few weeks old is not the right test of a phenotype whose human
    equivalent takes decades.

    The consequence is that the mechanistic claim this entry rests on, that one LMX1A copy
    builds an ear but cannot maintain it, has never been tested in an animal. So the
    competing developmental explanation offered in the original human description, that
    imaging-invisible developmental abnormalities set up later decline, remains equally
    live. Aged heterozygous Lmx1a mice with serial ABR and DPOAE, and cochlear histology
    at the end of that series, would separate the two, and a knock-in of a human
    homeodomain allele would be a stronger test than heterozygous null because human
    alleles include missense substitutions with residual activity rather than clean
    deletions.
  evidence:
  - reference: PMID:23226461
    reference_title: "Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of Lmx1a causing severe cochlear and vestibular defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The analysis of auditory brainstem responses (ABR) showed that mtl and bsd homozygotes are deaf, whereas heterozygous and wildtype littermates have normal hearing."
    explanation: >-
      The mismatch itself: the genotype that causes human DFNA7 causes no measured
      auditory phenotype in the mouse.
  - reference: PMID:29754270
    reference_title: "Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although Lmx1a mouse mutants demonstrate neurological, skeletal, pigmentation and reproductive system abnormalities, no syndromic features were present in the participating subjects of either family."
    explanation: >-
      The mismatch extends beyond the ear. Mouse Lmx1a mutants are syndromic across
      several organ systems; human LMX1A heterozygotes are not, so mouse extra-auditory
      phenotypes should not be used to predict human ones.
  - reference: PMID:29754270
    reference_title: "Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Alternatively, minor cochleovestibular developmental abnormalities could eventually lead to the progressive phenotype seen in the families."
    explanation: >-
      The competing developmental explanation that the missing animal experiment would
      test, stated by the authors as an explicit alternative to the maintenance reading.
  proposed_experiments:
  - experiment_id: exp_dfna7_aged_heterozygous_lmx1a_abr
    name: Aged heterozygous Lmx1a mouse auditory phenotyping
    description: >-
      Serial ABR and DPOAE in heterozygous Lmx1a mice through to old age, with cochlear
      and vestibular histology at endpoint, compared against wild-type littermates.
      Powered for a progressive threshold shift rather than for a categorical deaf or
      hearing call.
    would_support:
    - pathophysiology#Impaired Maintenance of Cochleovestibular Function
    supporting_outcome:
    - >-
      Heterozygotes show normal thresholds in early adulthood and a progressive
      age-dependent threshold elevation with hair cell or strial degeneration on
      endpoint histology.
    would_refute:
    - pathophysiology#Impaired Maintenance of Cochleovestibular Function
    refuting_outcome:
    - >-
      Heterozygotes remain audiometrically and histologically indistinguishable from
      wild-type littermates into old age, which would place the human mechanism outside
      simple mouse gene dosage and favour either the subtle-developmental explanation or
      a human-specific requirement.
- discussion_id: lmx1a_asymmetry_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is DFNA7 hearing loss asymmetric? What makes a cell-autonomous transcription
    factor dosage deficit, present equally in both ears, produce different thresholds on
    the two sides?
  attaches_to:
  - phenotypes#Asymmetric Sensorineural Hearing Loss
  - pathophysiology#Impaired Maintenance of Cochleovestibular Function
  rationale: >-
    Asymmetry is the most distinctive clinical feature of DFNA7 and nothing in the curated
    mechanism explains it. A germline heterozygous variant is present in both cochleae at
    the same dosage, so a purely dose-dependent maintenance failure predicts symmetric
    decline. Asymmetry implies that the deficit is permissive rather than deterministic,
    with something stochastic or environmental deciding how fast each ear declines, but
    what that something is has not been investigated.

    This is not idle. If a second, modifiable factor determines which ear declines first,
    it is a therapeutic target that the transcription factor itself is not; and if
    asymmetry is instead stochastic clonal drift in a maintenance process, that argues
    the window for intervention is set per ear rather than per patient. Nobody has
    reported longitudinal audiometry designed to distinguish these, nor tested whether the
    more-affected ear is predicted by noise history, otologic history or side dominance.
  evidence:
  - reference: PMID:35711095
    reference_title: "Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important to note that asymmetric hearing loss was identified in all probands and most affected individuals, although the extent of asymmetry varied."
    explanation: >-
      Establishes the phenomenon as near-universal in the series while explicitly noting
      that its degree varies, which is the variability the gap is about.
  - reference: PMID:42253511
    reference_title: "A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations exhibited significant intrafamilial phenotypic variability, with hearing loss (HL) severity ranging from mild to profound, and onset varying from infancy to mid-adulthood."
    explanation: >-
      Between-individual variability on one allele within one family, the same puzzle as
      between-ear asymmetry seen at a different scale, and equally unexplained by dosage.
- discussion_id: dfna7_locus_to_gene_assignment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the founding Norwegian DFNA7 family actually carry an LMX1A variant? The locus
    and the gene were established 22 years apart in different populations, and no report
    connects them in the original pedigree.
  attaches_to:
  - disease#Autosomal Dominant Nonsyndromic Hearing Loss 7
  - genetic#LMX1A
  rationale: >-
    DFNA7 is a locus name, not a gene name. It was defined in 1996 by linkage in a large
    Norwegian family with progressive high-tone hearing loss to a 22 cM interval between
    D1S104 and D1S466 on 1q21-q23, and the paper noted that the region contained several
    attractive candidate genes. MONDO's definition of MONDO:0011074 still describes the
    material basis as variation in that chromosome region rather than as a gene.

    LMX1A lies at 1q23.3, inside the interval, and heterozygous LMX1A variants were shown
    to cause dominant progressive hearing impairment in 2018 in two unrelated Dutch
    families. Every subsequent family in the literature is an independent LMX1A family. But
    no published report identifies an LMX1A variant in the Norwegian pedigree, so the
    equation of the locus with the gene rests on positional plausibility plus replication
    in other families rather than on solving the founding one.

    Two things follow. First, the phenotype MONDO attributes to DFNA7 is the Norwegian
    family's progressive high-tone loss, whereas the phenotype the LMX1A literature
    describes is progressive asymmetric loss across frequencies with vestibular
    involvement in about half of cases. Those are not obviously the same description, and
    if they are not the same disease the label is doing two jobs. Second, the interval is
    large and gene-dense, so an alternative gene in 1q21-q23 accounting for the Norwegian
    family is not excluded by anything published.

    This is recorded rather than resolved because it does not change how the entry is
    curated: everything in the pathograph below comes from molecularly confirmed LMX1A
    families. It changes what the entry's name should be taken to guarantee.
  evidence:
  - reference: PMID:8842739
    reference_title: "Identification of a new locus for autosomal dominant non-syndromic hearing impairment (DFNA7) in a large Norwegian family."
    supports: SUPPORT

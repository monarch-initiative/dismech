genetic:
- name: LMX1A
  notes: 'LMX1A encodes a LIM-homeodomain transcription factor. Pathogenic dominant variants affect LIM, homeodomain and C-terminal regions. The 2026 c.405delT report uses NM_177398.4 and predicts p.Phe135LeufsTer3. Variant-specific classifications matter: p.Gln240Arg remained a VUS in the 2022 report and p.Val241Ala was reported as a VUS in the 2026 father–son report. Multiple substitutions at Val241 do not by themselves establish a mutational hotspot. The recessive p.Ile369Thr family is an allelic boundary, not evidence for recessive inheritance of DFNA7.'
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  case_fractions:
  - population: Korean hearing loss probands undergoing exome sequencing
    case_fraction_percent: 0.7
    cohort_size: 728

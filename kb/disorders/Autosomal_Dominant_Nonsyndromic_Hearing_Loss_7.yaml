pathophysiology:
- name: LMX1A Haploinsufficiency
  description: >-
    A single functional LMX1A allele remains. The reported alleles are heterogeneous in
    kind, including homeodomain missense substitutions that weaken DNA binding, nonsense
    alleles that remove the homeodomain entirely, and C-terminal frameshifts that delete
    the helix mediating LIM2-domain interaction. What unites them is the direction of the
    effect on protein dosage rather than any shared structural lesion.

    That this is dosage insufficiency and not interference by the mutant protein has been
    tested directly. Plasmid titration and Actinomycin D transcript-chase experiments
    corroborated haploinsufficiency and excluded a dominant-negative effect, and an
    earlier study reached the same conclusion for a de novo homeodomain allele. The
    distinction matters therapeutically: a haploinsufficiency mechanism is in principle
    addressable by raising expression of the remaining allele, whereas a dominant-negative
    one is not.
  biological_scale: MOLECULAR

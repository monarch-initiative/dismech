    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the LMX1a homeobox domain employed its α3 helix and an N-terminal loop to achieve specific target recognition.
    explanation: Crystal structures concern WNT1/PITX3 promoter DNA. Their relevance to hearing alleles is mechanistic support, not identification of the cochlear regulon.
    directness: INDIRECT
- name: Impaired Strial Differentiation
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: Homozygous Lmx1a functional-null mice fail to establish normal marginal/intermediate strial layers. This demonstrates a developmental strial requirement in that model. A corresponding differentiation defect in human heterozygotes is hypothetical. Disappearance of cochlear melanoblast labeling was observed, but cell death versus altered recruitment or migration was not resolved by lineage tracing.
  evidence:
  - reference: PMID:40109362
    reference_title: Lmx1a is essential for marginal cell differentiation and stria vascularis formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we observe a lack of proteins specific to the stria vascularis, such as BSND and KCNQ1 in marginal cells and CD44 in intermediate cells.
    explanation: Strial differentiation-marker loss in the homozygous model.
    directness: INDIRECT
  downstream:
  - target: Reduced Endocochlear Potential
    causal_link_type: DIRECT
    description: Defective strial formation accompanies failure to establish the normal endocochlear potential in the homozygous mouse; the human branch remains hypothetical.
- name: Reduced Endocochlear Potential
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: Homozygous functional-null mice have endocochlear potentials below 6 mV at P12 and P21. Whether subtler strial physiology mediates dominant human hearing loss remains hypothetical. The 2025 experiment includes wild-type, heterozygous and homozygous animals, so absence of heterozygote measurements cannot be claimed.
  evidence:
  - reference: PMID:40109362
    reference_title: Lmx1a is essential for marginal cell differentiation and stria vascularis formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we measured the EP at P12 (during development) and P21 (mature EP) and confirmed a total absence of EP remained at less than 6-mV
    explanation: The source calls EP absent but reports a residual measurement below 6 mV, not exact mathematical zero.
    directness: INDIRECT
  downstream:
  - target: Cochleovestibular Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The null-model physiology suggests a candidate auditory mechanism; mediation in human heterozygotes is untested.
- name: Cochleovestibular Dysfunction
  description: Heterozygous LMX1A disease can impair cochlear and vestibular function through pathways that remain incompletely resolved. An ongoing maintenance requirement and subtle developmental defects are plausible and may coexist. Congenital cases and cochlear-aperture stenosis in one 2026 proband prevent a universal postdevelopmental-only model. Lmx1a expression becomes restricted to nonsensory epithelia during ear development, so a mature hair-cell-autonomous transcriptional defect should not be assumed. Clinical imaging and progression alone do not distinguish the alternatives.
  biological_scale: TISSUE

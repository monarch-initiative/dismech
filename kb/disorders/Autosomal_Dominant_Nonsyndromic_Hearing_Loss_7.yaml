- name: Reduced Transactivation of LMX1A Target Genes
  description: Several dominant LMX1A variants reduce reporter transactivation. The 2026 HEK293 assay used an INS-promoter luciferase construct and found reduced activity for five dominant variants, whereas recessive p.Ile369Thr retained wild-type-like activity. These assays do not identify native auditory targets. Homeodomain and C-terminal changes can impair protein–DNA interaction; a structural study of WNT1/PITX3 promoter recognition and neuronal cells supplies additional noncochlear evidence. A proposed activity–severity correlation from a small allele comparison is not a validated predictor of individual prognosis, especially given wide intrafamilial variability.
  biological_scale: MOLECULAR

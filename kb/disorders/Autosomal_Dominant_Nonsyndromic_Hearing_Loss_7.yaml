- name: Asymmetric Sensorineural Hearing Loss
  category: Auditory
  description: Hearing thresholds differ appreciably between the two ears. This was found in all probands and most affected individuals of a five-family DFNA7 series, and is unusual enough for a dominant nonsyndromic form that the authors proposed LMX1A as a candidate gene to consider specifically when asymmetric dominant hearing loss is encountered.

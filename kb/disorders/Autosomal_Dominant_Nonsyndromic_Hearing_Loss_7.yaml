    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The intervening auditory transcriptional program and affected cell populations are incompletely resolved.
  evidence:
  - reference: PMID:35711095
    reference_title: 'Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Compared with the wild-type protein, all mutant LMX1A proteins had significantly reduced transactivation efficiency, indicating that the ability to elicit transcription of the downstream target genes of LMX1A was severely compromised.
    explanation: Reduced transactivation in the tested variants, including p.Gln240Arg, which remained a VUS in that publication; an assay effect alone does not establish pathogenicity.
  - reference: PMID:32840933
    reference_title: Novel genotype-phenotype correlation of functionally characterized LMX1A variants linked to sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Resultantly, p.Arg199Gly manifesting the most severe NSHL showed the biggest reduction of transcriptional activity in contrast with moderately reduced activity of p.Cys97Ser and p.Val241Leu associated with less severe progressive NSHL, proposing a genotype-phenotype correlation.
    explanation: A proposed correlation across a small allele comparison; clinical severity is not a calibrated dose-response and varies within families.
  - reference: PMID:35254497
    reference_title: Update on CD164 and LMX1A genes to strengthen their causative role in autosomal dominant hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: and one family with a novel variant in LMX1A (c.686C>A; p.(Ala229Asp)) that impairs its transcriptional activity
    explanation: A further allele independently shown to impair transcriptional activity.
  - reference: PMID:36519758
    reference_title: 'A novel frameshift variant of LMX1A that leads to autosomal dominant non-syndromic sensorineural hearing loss: functional characterization of the C-terminal domain in LMX1A.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, electrophoresis mobility shift assay and luciferase assays have shown that the highly conserved C-terminal domain (amino acid 306-382) of the LMX1A was required for regulating the protein-DNA interaction and transactivation in vitro.
    explanation: The assay supports a C-terminal contribution to DNA interaction and transactivation; it does not make every distal variant pathogenic.
  - reference: PMID:42253511
    reference_title: A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Luciferase reporter assays showing reduced transactivation by LMX1A mutants relative to WT, p.Ile369Thr retains WT‐like activity.
    explanation: Figure 6 distinguishes the recessive allele from the tested dominant variants in this reporter assay.

name: Autosomal Dominant Nonsyndromic Hearing Loss 7
category: Mendelian
creation_date: "2026-08-28T00:00:00Z"
synonyms:
- DFNA7
- autosomal dominant nonsyndromic deafness 7
- autosomal dominant nonsyndromic deafness type 7
- autosomal dominant deafness 7
- deafness, autosomal dominant 7
- LMX1A-related autosomal dominant nonsyndromic hearing loss
description: >-
  DFNA7 is the dominant, hearing-only phenotype produced by heterozygous variants in
  LMX1A, a LIM-homeodomain transcription factor. The gene is best known from mouse
  developmental genetics, where it acts as a selector gene that partitions the otic
  vesicle into neural, sensory and non-sensory territory and is required to build the
  endolymphatic duct, the semicircular canals and the stria vascularis.

  The point that organises this entry is that the human dominant disease is not a milder
  version of that developmental catastrophe. Homozygous null mice have grossly malformed
  inner ears and no endocochlear potential; heterozygous mice hear normally. Human
  heterozygotes, by contrast, are born with anatomically normal cochleae on imaging and
  then lose hearing over years or decades. The Dutch families in which DFNA7 was
  established were explicit about the inference this forces: one wild-type copy of LMX1A
  appears to be enough to build the ear but not enough to keep it working. Whatever
  DFNA7 is, it is a maintenance failure sitting downstream of a developmental
  transcription factor, and the mouse null is a model of the gene's job rather than a
  model of the disease.

  The molecular mechanism is haploinsufficiency, and this has been tested rather than
  assumed. Reporter assays across the reported allelic series show reduced transactivation
  for missense, nonsense and frameshift alleles alike; plasmid titration and transcript
  stability chase experiments specifically excluded a dominant-negative effect. Severity
  tracks the size of the transcriptional deficit, with the most transcriptionally damaging
  allele reported so far found in the one subject with congenital severe-to-profound
  deafness.

  Two clinical features recur often enough to be worth knowing at the bedside. Hearing
  loss in DFNA7 is characteristically asymmetric between the two ears, unusually so for a
  dominant nonsyndromic form, and roughly half of affected individuals have measurable
  vestibular dysfunction whether or not they complain of it. Intrafamilial variability is
  wide: within single families, onset ranges from infancy to mid-adulthood and severity
  from mild to profound on the same allele, so a mildly affected parent gives little
  prognostic information about an affected child.

  LMX1A is not exclusively dominant. A homozygous C-terminal missense variant has been
  reported in a consanguineous Pakistani family with severe-to-profound recessive hearing
  impairment, so the gene spans both inheritance modes. MONDO carries no separate term for
  that recessive phenotype, so it is curated here as a second inheritance block and a
  second genetic entry rather than being left uncovered.

  One caveat about the identity of this entry. DFNA7 is a locus, defined in 1996 by
  linkage in a large Norwegian family to a 22 cM interval on 1q21-q23, and MONDO's
  definition still reflects that: it names the material basis as variation in the
  chromosome region rather than as a gene. LMX1A sits at 1q23.3, inside that interval,
  but it was tied to dominant hearing loss 22 years later in unrelated Dutch families, and
  no report identifies an LMX1A variant in the founding Norwegian pedigree. The
  gene-to-locus assignment therefore rests on positional plausibility plus independent
  families, not on solving the original family.

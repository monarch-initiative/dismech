  publication: PMID:23226461
  description: Spontaneous functional-null alleles produce severe congenital cochleovestibular malformations and deafness in homozygotes. ABR comparisons include approximately six-week-old mice and sixteen-week-old complementation offspring. Whole-embryo E10.5 RNA for Hmx2/3 and Pax2 was reduced, but early otic Hmx3/Pax2 protein patterns were similar; the authors caution that RNA changes may arise outside the ear or secondarily to malformed structures. These are not demonstrated direct auditory transcriptional targets.

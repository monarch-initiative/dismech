    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also provide further evidence for haploinsufficiency as the pathogenic mechanism underlying LMX1A-related ADHL."
    explanation: A third independent group reaching the same mechanistic conclusion.
- name: Reduced Transactivation of LMX1A Target Genes
  description: >-
    LMX1A is a DNA-binding transcription factor, and every disease allele assayed so far
    reduces its ability to drive transcription of downstream targets in reporter systems.
    The structural routes differ. Homeodomain missense substitutions attenuate the
    protein-DNA interaction; a premature stop destroys the protein including the
    homeodomain; a C-terminal frameshift removes a helix required for LIM2-domain
    interaction and for protein-DNA binding, without triggering nonsense-mediated decay.

    The quantitative version of this node is what gives DFNA7 its genotype-phenotype
    correlation: the allele with the largest measured loss of transcriptional activity is
    the one found in congenital severe-to-profound deafness, while alleles with only
    moderately reduced activity are associated with later-onset progressive loss.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  downstream:
  - target: Impaired Maintenance of Cochleovestibular Function
    causal_link_type: DIRECT
  - target: Cochlear Hair Cell Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:

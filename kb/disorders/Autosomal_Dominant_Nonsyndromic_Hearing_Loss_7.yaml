diagnosis:
- name: Molecular diagnosis with clinical and vestibular assessment
  description: Consider LMX1A within hearing-loss multigene panels or genomic testing for dominant sensorineural loss, whether symmetric or asymmetric. Interpret sequence variants using segregation, phenotype and variant-specific evidence; a VUS is not diagnostic. Audiology defines each ear’s severity and progression, and vestibular evaluation can identify deficits even without reported vertigo. Normal imaging is compatible with the diagnosis; bilateral cochlear-aperture stenosis was reported in one severely affected proband, with imaging unavailable for other affected relatives. This does not establish a universal malformation or proven structural mediator.
  evidence:
  - reference: PMID:35711095
    reference_title: 'Novel Molecular Genetic Etiology of Asymmetric Hearing Loss: Autosomal-Dominant LMX1A Variants.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For the first time, we suggest that LMX1A is one of the candidate genes which, if altered, could be associated with dominantly inherited asymmetric hearing loss.
    explanation: The authors' explicit diagnostic recommendation.
  - reference: PMID:42253511
    reference_title: A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-resolution imaging revealed bilateral cochlear aperture stenosis (CAS) in the severely affected proband.
    explanation: One proband had bilateral cochlear-aperture stenosis; its prevalence and relationship to the allele remain uncertain.

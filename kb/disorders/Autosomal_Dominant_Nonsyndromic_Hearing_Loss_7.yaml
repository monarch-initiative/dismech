      lesion in human heterozygotes.
  - reference: PMID:29754270
    reference_title: "Heterozygous missense variants of LMX1A lead to nonsyndromic hearing impairment and vestibular dysfunction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL

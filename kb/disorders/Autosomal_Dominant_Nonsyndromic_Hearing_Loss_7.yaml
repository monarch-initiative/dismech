- name: Autosomal recessive
  description: >-
    A second, much rarer inheritance mode for the same gene. A homozygous C-terminal
    missense variant, p.Ile369Thr, was reported in a consanguineous Pakistani family with
    severe-to-profound hearing impairment. It is curated inside this entry rather than
    separately because MONDO has no distinct term for an LMX1A-related recessive
    nonsyndromic hearing loss, and because the two modes are mechanistically continuous:
    the recessive C-terminal residue interacts with homeodomain residue Val241, which is
    itself mutated in dominant families.

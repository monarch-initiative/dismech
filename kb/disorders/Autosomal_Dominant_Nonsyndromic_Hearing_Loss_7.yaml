pathophysiology:
- name: LMX1A Haploinsufficiency
  description: Dominant disease alleles reduce functional LMX1A activity through heterogeneous lesions, including impaired DNA binding, truncation and, for p.Phe135LeufsTer3, faster decay of transfected mutant RNA. Functional insufficiency does not mean every missense variant lowers protein abundance. Reporter titration favors haploinsufficiency for the tested alleles but does not exclude every alternative effect in native cochlear cells. The 2026 Actinomycin D assay measures RNA stability in transfected HEI-OC1 cells; the authors interpret this as nonsense-mediated decay, without directly testing the surveillance pathway in patient cochlear tissue. No augmentation treatment is established by these experiments.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LMX1A
    term:
      id: hgnc:6653
      label: LMX1A
  downstream:
  - target: Reduced Transactivation of LMX1A Target Genes
    causal_link_type: DIRECT
  evidence:

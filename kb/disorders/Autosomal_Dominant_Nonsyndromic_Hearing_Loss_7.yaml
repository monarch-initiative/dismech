    reference_title: A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in DFNA7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, plasmid titration experiments and Actinomycin D chase assays functionally corroborated the haploinsufficiency mechanism and excluded the dominant-negative effect.
    explanation: The authors’ mechanistic interpretation of plasmid titration and RNA-decay assays for p.Phe135LeufsTer3; conclusions are bounded by the transfected cell systems and tested allele.
  - reference: PMID:32840933
    reference_title: Novel genotype-phenotype correlation of functionally characterized LMX1A variants linked to sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further, our dominant LMX1A variant exerted pathogenic effects via haploinsufficiency rather than dominant-negative effect.
    explanation: Functional study of p.Arg199Gly favored haploinsufficiency; this does not establish identical behavior for every allele.
  - reference: PMID:35254497
    reference_title: Update on CD164 and LMX1A genes to strengthen their causative role in autosomal dominant hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also provide further evidence for haploinsufficiency as the pathogenic mechanism underlying LMX1A-related ADHL.
    explanation: Additional functional evidence for p.Ala229Asp; overlapping investigators and similar reporter approaches do not constitute three fully independent model systems.
  genetic_context:

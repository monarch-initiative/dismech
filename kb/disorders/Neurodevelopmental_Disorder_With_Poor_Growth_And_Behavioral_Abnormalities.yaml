    P4-ATPase. Reported disease alleles are nonsense variants and canonical
    splice-site variants, homozygous or compound heterozygous.
  notes: >-
    Heterozygous de novo ATP9A variants are reported in a dominant
    intellectual disability presentation (PMID:40226306) and in schizophrenia
    (PMID:42757772); those are outside this recessive entry.

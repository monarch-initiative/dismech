name: Neurodevelopmental Disorder With Poor Growth And Behavioral Abnormalities
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
description: >-
  Neurodevelopmental disorder with poor growth and behavioral abnormalities
  (NEDGBA, OMIM 620242) is an autosomal recessive disorder caused by biallelic
  truncating or splice-site variants in ATP9A. ATP9A encodes a class II
  (P4B) P4-ATPase, a CDC50-independent phospholipid flippase found in early
  and recycling endosomes and the trans-Golgi network, and is expressed mainly
  in the brain. Affected children have global developmental delay,
  intellectual disability ranging from mild to severe, motor and speech delay,
  hypotonia, and behavioral abnormalities that include attention deficit
  hyperactivity disorder, aggression, and autistic features with stereotypies.
  Several have postnatal (secondary) microcephaly, failure to thrive with short
  stature, and feeding problems such as gastroesophageal reflux and vomiting;
  seizures are reported in a minority. Patient fibroblasts show near-absent
  ATP9A mRNA. In cell and mouse studies, ATP9A loss impairs recycling from
  endosomes to the plasma membrane and damages neurite morphology and synaptic
  transmission.
notes: >-
  The entry is anchored on MONDO:0859377 (OMIM 620242) and ATP9A (hgnc:13540).
  MONDO defines the entity by biallelic ATP9A variants; about ten affected
  individuals from seven families had been reported by 2025 (PMID:34764295,
  PMID:34379057, PMID:36604604, PMID:40226306). Because the published cohorts
  are small and summary counts across them do not share a denominator, no
  frequency band is recorded on any phenotype.

  Heterozygous de novo ATP9A missense variants have been reported in
  individuals with intellectual disability, epilepsy and behavioral problems
  but usually without failure to thrive (PMID:40226306), and heterozygous de
  novo truncating or splice-altering ATP9A variants in two individuals with
  schizophrenia or schizoaffective disorder (PMID:42757772). These dominant
  presentations have no MONDO term of their own at the time of writing. They
  are not folded into this recessive entry: their phenotypes, alleles and
  proposed mechanism (dominant interference with dendritic spine maturation)
  are kept out of the phenotype and pathophysiology sections, and the
  dominant-negative claim is not curated here.

  A homozygous ATP9A missense variant, p.(Arg364Thr), has been reported in a
  girl with microcephaly and cognitive impairment (PMID:41604004), classified
  by its authors as a variant of uncertain significance; it is not curated as
  a disease allele.

  No GeneReviews chapter covers this disorder (Bookshelf index of 2026-09-10).

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ATP9A variants, homozygous in consanguineous families and
    compound heterozygous in others.
  evidence:
  - reference: PMID:34379057
    reference_title: "Biallelic truncating variants in ATP9A cause a novel neurodevelopmental disorder involving postnatal microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In aggregate, our findings show that pathogenic variants in ATP9A cause a novel autosomal recessive neurodevelopmental disorder with POM."
    explanation: Two consanguineous families with homozygous ATP9A truncating variants establish recessive inheritance.
  - reference: PMID:36604604
    reference_title: "ATP9A deficiency causes ADHD and aberrant endosomal recycling via modulating RAB5 and RAB11 activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report two independent families in which the nonsense mutations c.433C>T/c.658C>T/c.983G>A (p. Arg145*/p. Arg220*/p. Trp328*) in ATP9A (NM_006045.3) cause autosomal recessive hypotonia, intellectual disability (ID) and attention deficit hyperactivity disorder (ADHD)."
    explanation: Two further families, one compound heterozygous and one homozygous, with recessive inheritance.
pathophysiology:
- name: Biallelic ATP9A Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both ATP9A alleles carry nonsense, frameshift-causing or canonical
    splice-site variants. In patient fibroblasts ATP9A mRNA falls to a few
    percent of control levels, consistent with nonsense-mediated decay, so
    little or no ATP9A flippase is made. ATP9A is a P4-ATPase whose ATPase
    activity is stimulated by negatively charged phospholipids such as
    phosphatidylserine and phosphoinositides.
  genes:
  - preferred_term: ATP9A
    term:
      id: hgnc:13540
      label: ATP9A
  molecular_functions:
  - preferred_term: ATPase-coupled phospholipid translocation (flippase) activity
    term:
      id: GO:0140326
      label: ATPase-coupled intramembrane lipid carrier activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:34379057
    reference_title: "Biallelic truncating variants in ATP9A cause a novel neurodevelopmental disorder involving postnatal microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, both variants resulted in almost absent ATP9A mRNA expression in both affected individuals."
    explanation: Patient fibroblasts with a homozygous nonsense or splice variant have almost no ATP9A mRNA.
  - reference: PMID:34379057
    reference_title: "Biallelic truncating variants in ATP9A cause a novel neurodevelopmental disorder involving postnatal microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Direct sequencing of RT-PCR amplicons confirmed the loss of this splice site affected by the variant c.642+1G>A, resulting in skipping of exon 7 (figure 2A)."
    explanation: The splice allele skips exon 7, which is predicted to cause a frameshift.
  - reference: PMID:40876594
    reference_title: "A unique gating mechanism revealed by the cryo-EM structure of monomeric ATP9A flippase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP9A shows an ATPase activity that is significantly increased by the addition of phospholipids that retain the overall negative charge, including phosphatidylserine, phosphatidylinositol, and its phosphorylated species, compared with other electroneutral phospholipids."
    explanation: Purified human ATP9A is a lipid-stimulated P4-ATPase, the activity the biallelic truncating alleles remove.
  downstream:
  - target: Impaired Endosome-to-Plasma Membrane Recycling
    causal_link_type: DIRECT
    description: >-
      Without ATP9A, cargo that should return from early and recycling
      endosomes to the plasma membrane is delayed and accumulates in
      endosomes.
    evidence:
    - reference: PMID:27733620
      reference_title: "The phospholipid flippase ATP9A is required for the recycling pathway from the endosomes to the plasma membrane."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Depletion of ATP9A delayed the recycling of transferrin from endosomes to the plasma membrane, although it did not affect the morphology of endosomal structures."
      explanation: ATP9A knockdown in HeLa cells slows transferrin recycling.
  - target: Increased Extracellular Vesicle Release
    causal_link_type: DIRECT
    description: >-
      Knockdown of ATP9A increases release of extracellular vesicles,
      including exosomes, from human hepatoma cells.
    evidence:
    - reference: PMID:30947313
      reference_title: "The P4-ATPase ATP9A is a novel determinant of exosome release."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that knockdown of ATP9A expression in human hepatoma cells resulted in a significant increase in EV release that was independent of caspase-3 activation."
      explanation: ATP9A depletion increases EV release in HepG2 cells.
  - target: Impaired Wntless Sorting and Wnt Secretion
    causal_link_type: DIRECT
    description: >-
      Loss of the ATP9A orthologue TAT-5 in C. elegans sends Wntless to
      lysosomes instead of recycling it, and reduces Wnt signaling.
    evidence:
    - reference: PMID:30213940
      reference_title: "SNX3-retromer requires an evolutionary conserved MON2:DOPEY2:ATP9A complex to mediate Wntless sorting and Wnt secretion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo suppression of Ce-mon-2, Ce-pad-1 or Ce-tat-5 (respective MON2, DOPEY2 and ATP9A orthologues) phenocopy a loss of SNX3-retromer function, leading to enhanced lysosomal degradation of Wntless and a Wnt phenotype."
      explanation: Worm orthologue knockdown causes Wntless degradation and a Wnt phenotype.
- name: Impaired Wntless Sorting and Wnt Secretion
  biological_scale: CELLULAR
  description: >-
    ATP9A forms a conserved complex with MON2 and DOPEY2 that associates with
    SNX3-retromer, which retrieves the Wnt cargo receptor Wntless from
    endosomes. In C. elegans, loss of the ATP9A orthologue degrades Wntless
    and perturbs Wnt signaling. Whether Wnt secretion is reduced in patient
    neurons, and whether this contributes to the human phenotype, has not been
    tested.
  biological_processes:
  - preferred_term: Wnt protein secretion
    term:
      id: GO:0061355
      label: Wnt protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:30213940
    reference_title: "SNX3-retromer requires an evolutionary conserved MON2:DOPEY2:ATP9A complex to mediate Wntless sorting and Wnt secretion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we demonstrate the essential role of SNX3-retromer assembly for Wntless transport and report that SNX3 associates with an evolutionary conserved endosome-associated membrane re-modelling complex composed of MON2, DOPEY2 and the putative aminophospholipid translocase, ATP9A."
    explanation: ATP9A is part of the MON2-DOPEY2 complex that associates with SNX3-retromer.
  - reference: PMID:30213940
    reference_title: "SNX3-retromer requires an evolutionary conserved MON2:DOPEY2:ATP9A complex to mediate Wntless sorting and Wnt secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo suppression of Ce-mon-2, Ce-pad-1 or Ce-tat-5 (respective MON2, DOPEY2 and ATP9A orthologues) phenocopy a loss of SNX3-retromer function, leading to enhanced lysosomal degradation of Wntless and a Wnt phenotype."
    explanation: Worm orthologue loss reduces Wntless and Wnt signaling.
- name: Impaired Endosome-to-Plasma Membrane Recycling
  biological_scale: CELLULAR
  description: >-
    ATP9A sits in phosphatidylserine-positive early and recycling endosomes.
    Its depletion delays transferrin recycling and traps the glucose
    transporter GLUT1 in endosomes, while early-to-late endosomal transport
    and retrograde transport to the Golgi are spared. In neuronal cells and
    mouse brain, ATP9A loss lowers the active GTP-bound forms of RAB5 and
    RAB11, and patient truncating mutants mislocalize.
  biological_processes:
  - preferred_term: endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: DECREASED
  evidence:
  - reference: PMID:27733620
    reference_title: "The phospholipid flippase ATP9A is required for the recycling pathway from the endosomes to the plasma membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, depletion of ATP9A caused accumulation of glucose transporter 1 in endosomes, probably by inhibiting their recycling."
    explanation: GLUT1 accumulates in endosomes after ATP9A depletion in HeLa cells.
  - reference: PMID:36604604
    reference_title: "ATP9A deficiency causes ADHD and aberrant endosomal recycling via modulating RAB5 and RAB11 activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, ATP9A pathogenic mutants have aberrant subcellular localization and cause abnormal endosomal recycling."
    explanation: Patient truncating mutants mislocalize and disturb endosomal recycling in cells.
  - reference: PMID:36604604
    reference_title: "ATP9A deficiency causes ADHD and aberrant endosomal recycling via modulating RAB5 and RAB11 activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It mainly localizes to endosomes and plays a pivotal role in endosomal recycling pathway by modulating small GTPase RAB5 and RAB11 activation."
    explanation: Links ATP9A to RAB5 and RAB11 activation in the recycling pathway.
  downstream:
  - target: Neurite Morphology and Synaptic Transmission Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors propose that disturbed RAB5- and RAB11-dependent recycling
      underlies the neurite and synaptic defects of ATP9A-deficient neurons;
      the causal step between the two has not been tested directly.
- name: Increased Extracellular Vesicle Release
  biological_scale: CELLULAR
  description: >-
    ATP9A restrains exosome release from multivesicular bodies in cultured
    human cells. Whether this contributes to the neurodevelopmental phenotype
    is not known.
  biological_processes:
  - preferred_term: exosomal secretion
    term:
      id: GO:1990182
      label: exosomal secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:30947313
    reference_title: "The P4-ATPase ATP9A is a novel determinant of exosome release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pharmacological blocking of exosome release in ATP9A knockdown cells did significantly reduce the total number of EVs."
    explanation: The excess vesicles released after ATP9A knockdown are largely exosomes.
- name: Neurite Morphology and Synaptic Transmission Defects
  biological_scale: CELLULAR
  description: >-
    Atp9a null mice have abnormal neurite morphology and impaired synaptic
    transmission in the primary motor cortex and hippocampus, and ATP9A
    knockdown in cultured neurons causes neurite fracture, retraction and
    beading and reduces the number of dendrites per neuron.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron projection maintenance
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:36604604
    reference_title: "ATP9A deficiency causes ADHD and aberrant endosomal recycling via modulating RAB5 and RAB11 activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abnormal neurite morphology and impaired synaptic transmission are found in the primary motor cortex and hippocampus of the Atp9a null mice."
    explanation: Neurite and synaptic defects in the Atp9a knockout mouse brain.
  - reference: PMID:36604604
    reference_title: "ATP9A deficiency causes ADHD and aberrant endosomal recycling via modulating RAB5 and RAB11 activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP9A is also required for maintaining neuronal neurite morphology and the viability of neural cells in vitro."
    explanation: Knockdown in cultured neurons damages neurites.
  - reference: PMID:40226306
    reference_title: "Heterozygous Missense Variants in the ATPase Phospholipid Transporting 9A Gene, ATP9A, Alter Dendritic Spine Maturation and Cause Dominantly Inherited Nonsyndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "They induced a decreased expression of ATP9A, affecting the neuronal arborization by decreasing the number of dendrites per neuron."
    explanation: shRNA knockdown, used to mimic the nonsense alleles, reduces dendrite number in primary neurons.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed basis of the cognitive impairment; Atp9a null mice have hippocampus-dependent learning and memory deficits.
  - target: Attention deficit hyperactivity disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed basis of the hyperactivity; Atp9a null mice show hyperkinetic movements.

- name: Failure of NADPH Oxidase Assembly
  biological_scale: CELLULAR
  description: >-
    The mechanism predicts this step: p67phox requires RacGTP binding to
    undergo the conformational change that lets it engage NOX2, so without
    membrane-targeted RAC2-GTP the oxidase should not assemble.

    How far it is realised in a patient is not settled, and the evidence points
    both ways. The proband's nitroblue tetrazolium test was normal, which is a
    direct human measurement against a complete oxidative-burst failure. In the
    null mouse the result is compartment-dependent: superoxide production was
    significantly reduced in bone-marrow neutrophils but normal in activated
    peritoneal exudate neutrophils. So a reduced respiratory burst is expected
    from the biochemistry and partly seen in the mouse, rather than
    demonstrated in these patients.
  biological_processes:
  - preferred_term: superoxide anion generation
    modifier: DECREASED
    term:
      id: GO:0042554
      label: superoxide anion generation
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:30723080
    reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "RAC2, through interactions with reduced NAD phosphate oxidase component p67 phox, activates neutrophil superoxide production"
    explanation: The oxidase branch of RAC2's effector repertoire.
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her neutrophil markers and the nitrobluetetrazolium (NBT) test were normal"
    explanation: >-
      The only oxidative-burst measurement in an IMD73C patient, and it was
      normal. Recorded as REFUTE because it contradicts a complete failure of
      oxidase assembly, which is what the mechanism predicts.
  - reference: PMID:10072071
    reference_title: "Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is characterized by abnormalities in neutrophil function and host defense."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Superoxide production by rac2-/- bone marrow neutrophils was significantly reduced compared to wild type, but it was normal in activated peritoneal exudate neutrophils."
    explanation: >-
      The null mouse reduces superoxide in one neutrophil compartment and not
      in another, which is why this node is described as partly realised rather
      than as an abolished burst.
  downstream:
  - target: Neutrophil Effector Failure
    causal_link_type: DIRECT

animal_models:
- name: Rac2-null mouse
  species: Mouse
  genotype: Rac2 homozygous null
  publication: PMID:10072071
  genes:
  - preferred_term: Rac2
    term:
      id: MGI:97846
      label: Rac2
  description: >-
    The genotype matches the human disease: a constitutional biallelic null in
    a haematopoietic-restricted gene. It dissects the migration branch in
    detail, separating chemotaxis, shear-dependent capture and F-actin
    generation, and shows that the baseline defect becomes lethal only on
    pathogen challenge.
  modeled_mechanisms:
  - target: Failure of Lamellipodium Formation and Directed Migration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Chemotaxis, L-selectin-mediated capture under shear and F-actin
      generation are all defective, which is a finer dissection of this node
      than the single chemotaxis assay available in the patients.
    limitations: >-
      The mouse does not reproduce the glomerulonephritis, coagulopathy or
      endocrine features of the human siblings, so the immune-dysregulation arm
      of the disease has no counterpart in it.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The renal, coagulation and endocrine features reported in both human
        patients are absent from this model. That is part of why their
        attribution to RAC2 loss remains unresolved.
    evidence:
    - reference: PMID:10072071
      reference_title: "Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is characterized by abnormalities in neutrophil function and host defense."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "rac2-/- neutrophils displayed significant defects in chemotaxis, in shear-dependent L-selectin-mediated capture on the endothelial substrate Glycam-1, and in both F-actin generation and p38 and, unexpectedly, p42/p44 MAP kinase activation induced by chemoattractants"
      explanation: The dissected migration defect measured in the null mouse.
    readouts:
    - name: Neutrophil chemotaxis and shear-dependent capture
      target: Failure of Lamellipodium Formation and Directed Migration
      direction: DECREASED
      interpretation: Direct cellular correlate of the node, in the matching genotype.
      evidence:
      - reference: PMID:10072071
        reference_title: "Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is characterized by abnormalities in neutrophil function and host defense."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "rac2-/- neutrophils displayed significant defects in chemotaxis"
        explanation: The measured chemotactic defect behind this readout.
differential_diagnoses:
- name: Common variable immunodeficiency
  description: >-
    The label both siblings carried for years, and the differential this
    disease is most likely to hide behind. Hypogammaglobulinemia, B lymphopenia
    and recurrent sinopulmonary infection with bronchiectasis are shared; what
    separates them is the neutrophil chemotaxis defect and the abnormal granule
    morphology, neither of which is sought in a routine CVID workup.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report the first patients with a homozygous loss of function mutation in the RAC2 gene, presenting with clinical features of common variable immunodeficiency."
    explanation: The CVID presentation, stated in the report's own opening sentence.
- name: Neutrophil Immunodeficiency Syndrome
  description: >-
    The dominant-negative arm of RAC2 disease, caused by the p.Asp57Asn allele.
    It presents in the neonatal period with severe soft-tissue infection and
    absent pus, because a dominant-negative protein impairs RAC1 as well as
    RAC2. The recessive null spares RAC1 and presents far later and far more
    mildly.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "This may be explained by the fact that the previously reported cases involved expression of a DN protein, which affected the GTPase activity not only of RAC2, but also of RAC1, the other major RAC GTPase expressed in human neutrophils"
    explanation: The mechanistic basis the original authors give for the difference between the two arms.
- name: Immunodeficiency 73B
  description: >-
    The dominant-activating arm of RAC2 disease. Constitutively active alleles
    cause a combined immunodeficiency with lymphopenia; holding the switch on
    is not the same lesion as removing it, and the two produce different
    diseases.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Our patients illustrate that different types of mutations in a given gene may be associated with vastly different clinical phenotypes"
    explanation: >-
      The allele-class principle that separates the three RAC2 diseases. This
      report predates the dominant-activating arm's description, so it states
      the principle rather than naming that disease.

- name: Neutrophil Effector Failure
  biological_scale: ORGANISM
  description: >-
    A neutrophil that does not reach the site of infection, and whose killing
    capacity is predicted to be reduced without being demonstrated in these
    patients: the migration defect was measured directly, while the proband's
    oxidative burst tested normal by NBT. Unlike the dominant-negative arm of
    RAC2 disease, this does not present catastrophically in the neonatal
    period.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Finally a chemotactic defect was observed in the neutrophils derived from the affected brother"
    explanation: >-
      The measured functional defect. That it is what drives the clinical
      infection burden is an inference from the two branches above.
  downstream:

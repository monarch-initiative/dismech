- name: Absence of RAC2 Protein Uncompensated by RAC1
  biological_scale: MOLECULAR
  description: >-
    No RAC2 protein in haematopoietic cells. The co-expressed ubiquitous
    paralogue RAC1 does not substitute, because RAC2 supplies the great
    majority of the Rac pool in the neutrophil. This is also the point at which
    the recessive null differs from the dominant-negative allele, which impairs
    RAC1 as well and so produces a more severe neonatal disease.
  molecular_functions:

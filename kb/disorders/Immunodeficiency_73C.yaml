- name: Immune Dysregulation
  biological_scale: ORGANISM
  description: >-
    Glomerulonephritis, factor XI deficiency, urticaria and multiple hormone
    abnormalities of possible autoimmune basis were present in both siblings.
    Both glomerulonephritides were post-streptococcal with a raised
    anti-streptolysin O titre, and the original authors suggest they may be
    secondary to the infection burden rather than to the genotype; a sequela
    edge from the recurrent infections records that alternative route. This is
    the least supported step in the chain: no mechanistic study connects RAC2 loss to
    renal, coagulation or endocrine pathology, the Rac2-null mouse does not
    reproduce it, and the original authors themselves suggest some of these
    features may be secondary to infection or autoimmunity rather than directly
    attributable.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "In addition, the patients suffered from glomerulonephritis, coagulopathy, multiple hormone deficiencies potentially on the autoimmune basis and abnormalities of neutrophil granules."
    explanation: >-
      Reports the features in both patients. The authors' own "potentially"
      marks the attribution as unsettled, and no mechanism links them to RAC2.
  downstream:

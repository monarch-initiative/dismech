classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency combining an antibody deficiency with a
      neutrophil functional defect.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian single-gene disorder caused by biallelic loss-of-function
      RAC2 alleles.
  iuis_category:
    classification_value: predominantly antibody deficiency
    notes: >-
      IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970),
      Table 3 "Predominantly antibody deficiencies", row "RAC2 deficiency
      RAC2 AR 602049", associated features low IgG, IgA and IgM with low or
      normal B cells and reduced antibody.

      RAC2 is printed in three different IUIS 2022 tables as three distinct
      diseases, and two of the three rows are both printed as "RAC2
      deficiency", so the discriminator for this entry is the inheritance
      column: this is the AR row in Table 3. The AD LOF row in Table 5
      (Congenital defects of phagocyte number or function, MIM 608203) is
      Neutrophil_Immunodeficiency_Syndrome, and the AD GOF row in Table 1 is
      Immunodeficiency_73B.
notes: >-
  Entry shape. This completes an allele-class split the knowledge base has
  already made twice for this gene: Neutrophil_Immunodeficiency_Syndrome is the
  dominant-negative arm and Immunodeficiency_73B the dominant-activating arm.
  ClinGen records the same decision for RAC2, stating that it found differences
  in molecular mechanism, inheritance pattern and phenotypic variability and
  split the gene into three disease entities.

  MONDO's placement of this term under MONDO:0017855, T-B- severe combined
  immunodeficiency, does not fit the reported patients and is not reproduced in
  this entry's parents. Both siblings had low but not absent B cells, survived
  well beyond infancy, and were managed for years as common variable
  immunodeficiency. The second MONDO parent, RAC2-related combined
  immunodeficiency-bronchiectasis-cancer-predisposing syndrome, is a better
  fit. This disagreement is a candidate MONDO term request rather than a
  curation error here.

  No GeneReviews chapter covers this disease or RAC2.

  Every frequency in this entry would have a denominator of two, so none is
  recorded. The HPO annotation of OMIM:618987 derives entirely from the same
  two siblings. A second nonsense proband is counted in ClinGen's curation from
  PMID:31130284, a large consanguineous-population exome series whose abstract
  carries no RAC2 phenotype detail; it is not a second phenotyped patient.

  The 54-patient international RAC2 cohort (PMID:38194689) reports 15 novel
  missense alleles "including one present only in homozygosity". Its abstract
  does not say which disease arm that allele belongs to, so whether it is a
  recessive hypomorph belonging here or a homozygous gain-of-function allele is
  unresolved and it is not counted toward this entry.

  Content in the deep-research report that is the provider's own computation
  rather than a published finding is not carried here as evidence: the GTEx
  tissue-specificity index comparing RAC2 with RAC1, the gnomAD carrier
  frequency and the derived birth-prevalence and consanguinity-multiplier
  figures, the STRING partner tables, and a count of how many IMD73C features
  the Rac2-null mouse matches against other inborn-error-of-immunity models.
  The report's NCIT treatment bindings were largely wrong - its own term
  validation flagged NCIT:C564, C265, C1322, C15417, C15632 and C15271 as
  naming unrelated concepts - so every term here was re-derived from OLS.

  `just preflight-dr` reported a gene-identifier mismatch, "HGNC:9802 beside
  C3". It is a false positive: "C3" is part of RAC2's full name, Ras-related C3
  botulinum toxin substrate 2, and hgnc:9802 is RAC2.

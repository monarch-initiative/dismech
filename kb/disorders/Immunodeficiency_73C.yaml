    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report the first patients with a homozygous loss of function mutation in the RAC2 gene, presenting with clinical features of common variable immunodeficiency."
    explanation: Establishes the homozygous loss-of-function genotype that defines this arm of RAC2 disease.
genetic:
- name: RAC2
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RAC2
    term:
      id: hgnc:9802
      label: RAC2
  relationship_type: CAUSATIVE
  notes: >-
    relationship_type overstates the evidence tier, deliberately and in line
    with the rest of this knowledge base. The schema glosses CAUSATIVE as a
    Definitive or Strong gene-disease relationship and ClinGen rates RAC2 for
    this disease Moderate, on two nonsense variants in two probands from two
    publications with supporting functional and model-organism work. RISK_FACTOR
    would be worse than imprecise: the schema defines it for variants neither
    necessary nor sufficient to cause disease, which is the opposite of a
    biallelic null in a recessive Mendelian condition. The tier is copied from
    ClinGen below and carries the caveat; `just check-gene-validity` reports
    this as `overstated` and does not gate on it.

    Two nonsense probands are reported. The clinical picture comes from the two
    siblings homozygous for NM_002872.5:c.167G>A, p.Trp56Ter; ClinGen's
    curation includes a second nonsense variant in a further proband from a
    large consanguineous-population exome series (PMID:31130284), whose
    abstract carries no RAC2 phenotype detail, so it adds a genotype rather
    than a clinical description. The premature termination codon sits far enough upstream of the
    final exon-exon junction for nonsense-mediated decay to be predicted, and
    any escaping product would be 55 of 192 residues, lacking Switch II, the
    guanine-contact motifs, the NADPH oxidase insert region and the CAAX
    prenylation signal. Transfection of the patient allele produced no
    detectable RAC2 protein.

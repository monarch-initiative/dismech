diagnosis:
- name: Neutrophil function testing with sequencing
  description: >-
    The disease is reached by sequencing, because its clinical picture is that
    of common variable immunodeficiency and both patients carried that label
    for years. What distinguishes it once suspected is the neutrophil: a
    chemotaxis assay and electron microscopy of granule morphology are
    abnormal, while the nitroblue tetrazolium test was normal in the proband,
    so a normal oxidative-burst screen does not exclude it.
  evidence:
  - reference: PMID:25512081
    reference_title: "RAC2 loss-of-function mutation in 2 siblings with characteristics of common variable immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her neutrophil markers and the nitrobluetetrazolium (NBT) test were normal"
    explanation: >-
      A normal NBT in the proband, which is why an oxidative-burst screen alone
      does not exclude this disease.

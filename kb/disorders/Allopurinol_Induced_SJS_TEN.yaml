histopathology:
- name: Full-thickness epidermal necrosis with dermo-epidermal separation
  finding_term:
    preferred_term: Full-thickness epidermal necrosis
    term:
      id: NCIT:C36184
      label: Necrosis
  description: >-
    Confluent epidermal necrosis separates the epidermis from the dermis, providing
    the tissue-level correlate of clinical detachment.
  evidence:
  - reference: PMID:28133001
    reference_title: "A Review of the Pathogenesis of Toxic Epidermal Necrolysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Total epidermal necrosis separates the epidermis from the dermis.
    explanation: >-
      The review directly describes the defining tissue lesion and plane of
      separation.
diagnosis:
- name: Clinical SJS/TEN spectrum classification with skin-biopsy histopathology
  description: >-
    Diagnose epidermal necrolysis by clinical assessment together with compatible
    histopathology, and classify extent as SJS (<10% detached body surface area),
    overlap (10-30%), or TEN (>30%).
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:29188475
    reference_title: "Current Perspectives on Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The difference between SJS, SJS/TEN overlap, and TEN is defined by the
      degree of skin detachment: SJS is defined as skin involvement of < 10%, TEN
      is defined as skin involvement of > 30%, and SJS/TEN overlap as 10-30% skin
      involvement. The diagnosis of different degrees of epidermal necrolysis is
      based on the clinical assessment in conjunction with the corresponding
      histopathology.
    explanation: >-
      This directly supports both the spectrum thresholds and the combined
      clinical-histopathologic diagnostic approach.
- name: ALDEN culprit-drug causality assessment
  description: >-
    Apply the Algorithm of Drug Causality for Epidermal Necrolysis (ALDEN) to
    assess whether allopurinol is the culprit rather than inferring attribution
    from exposure alone.
  diagnosis_term:
    preferred_term: drug causality assessment
  evidence:
  - reference: PMID:20375998
    reference_title: "ALDEN, an algorithm for assessment of drug causality in Stevens-Johnson Syndrome and toxic epidermal necrolysis: comparison with case-control analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Being more sensitive than a general method, ALDEN, which correlates well
      with case-control analysis results, can be considered a reference tool in
      SJS/TEN.
    explanation: >-
      The validation study supports ALDEN as a reference method for assigning
      culprit-drug causality in SJS/TEN.
- name: SCORTEN severity and prognosis assessment
  description: >-
    Use the Severity-of-Illness Score for Toxic Epidermal Necrolysis (SCORTEN) to
    assess SJS/TEN severity and prognosis after diagnosis.
  diagnosis_term:
    preferred_term: SCORTEN severity score
  evidence:
  - reference: PMID:29188475
    reference_title: "Current Perspectives on Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      severity-of-illness score for toxic epidermal necrolysis (SCORTEN) is
      available for SJS/TEN severity assessment.
    explanation: >-
      The clinical review explicitly identifies SCORTEN for severity assessment
      across the SJS/TEN spectrum.
treatments:
- name: Causative drug withdrawal and supportive care
  description: >-
    Immediate withdrawal of allopurinol and multidisciplinary supportive care
    (often in an ICU or burn unit) are the cornerstone of management.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35437717
    reference_title: "Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis in the Era of Systems Medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      immediate withdrawal of causative agents, and critical multidisciplinary
      supportive care are key management of SJS/TEN
    explanation: >-
      Identifies causative-drug withdrawal and supportive care as key management
      of SJS/TEN. Evidence source is OTHER because this is a review article.
- name: HLA-B*58:01 pre-prescription screening
  description: >-
    Genotyping for HLA-B*58:01 before allopurinol in high-risk populations to
    avoid the drug in carriers and prevent SCAR.
  treatment_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26399967
    reference_title: "Use of HLA-B*58:01 genotyping to prevent allopurinol induced severe cutaneous adverse reactions in Taiwan: national prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prospective screening of the HLA-B*58:01 allele, coupled with an alternative
      drug treatment for carriers, significantly decreased the incidence of
      allopurinol induced SCARs in Taiwanese medical centres.
    explanation: >-
      A national prospective cohort provides direct clinical evidence that
      pre-prescription screening plus allopurinol avoidance in carriers prevents
      allopurinol-induced SCAR in Han Chinese patients.
  - reference: PMID:25047754
    reference_title: "Cost-effectiveness analysis of HLA-B5801 genotyping in the treatment of gout patients with chronic renal insufficiency in Korea."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent American College of Rheumatology guidelines recommend that, prior to
      treatment with allopurinol, the HLA-B5801 genotype of gout patients at high
      risk for SCARs, including Korean patients with chronic renal insufficiency,
      should be determined.
    explanation: >-
      Supports HLA-B*58:01 pre-prescription genotyping as a guideline-recommended
      preventive strategy. Evidence source is OTHER because this is a
      cost-effectiveness modeling study.
experimental_models:
- name: Oxypurinol-stimulated patient PBMC model
  description: >-
    In-vitro oxypurinol stimulation of peripheral blood mononuclear cells from
    resolved allopurinol-induced SJS/TEN cases models the drug-reactive CD8 T-cell
    response and its oligoclonal TCR repertoire.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  conditions:
  - resolved allopurinol-induced SJS/TEN
  - oxypurinol exposure
  cell_source: Peripheral blood mononuclear cells from resolved cases and drug-naïve donors
  culture_system: In-vitro drug stimulation with paired alpha-beta TCR repertoire analysis
  publication: PMID:37452515
  modeled_mechanisms:
  - target: Oxypurinol-HLA class I interaction with HLA-B*58:01 susceptibility
    description: Models the labile oxypurinol interaction with peptide/HLA complexes.
    evidence:
    - reference: PMID:37452515
      reference_title: "The allopurinol metabolite, oxypurinol, drives oligoclonal expansions of drug-reactive T cells in resolved hypersensitivity cases and drug-naïve healthy donors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        this response supported the pharmacological interaction with immune
        receptors (p-i) concept by showcasing (i) the labile metabolite
        interaction with peptide/HLA complexes
      explanation: >-
        The experiment directly models the oxypurinol-peptide/HLA interaction.
  - target: Drug-specific cytotoxic T-cell activation
    description: Models oxypurinol-driven CD8 T-cell activation and clonal expansion.
    evidence:
    - reference: PMID:37452515
      reference_title: "The allopurinol metabolite, oxypurinol, drives oligoclonal expansions of drug-reactive T cells in resolved hypersensitivity cases and drug-naïve healthy donors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        OXP is the driver of CD8+ T cell-mediated responses
      explanation: >-
        The experiment directly supports the modeled T-cell activation response.
  evidence:
  - reference: PMID:37452515
    reference_title: "The allopurinol metabolite, oxypurinol, drives oligoclonal expansions of drug-reactive T cells in resolved hypersensitivity cases and drug-naïve healthy donors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Examination of paired OXP-induced αβTCR repertoires highlighted an
      oligoclonal and private clonotypic profile in both resolved ALP-induced
      SJS/TEN cases and drug-naïve healthy donors.
    explanation: >-
      This describes the principal clonotypic finding of the primary-cell model.
review_notes: >-
  Publication-readiness review (2026-08-04): the generic SJS/TEN Falcon research
  artifact and current literature were cross-checked against this drug-specific
  entry. The 2025 US association with HLA-A*34:02 was reviewed but not promoted to
  a separate genetic assertion because it derives from only 16 mixed SJS/TEN and
  DRESS cases and needs phenotype-specific replication. Recent all-cause SJS/TEN
  single-cell studies were not promoted because they do not establish an
  allopurinol-specific mechanism; no allopurinol-specific interventional trial or
  validated animal/computational disease model was identified. Generic acute
  immunomodulatory management, including systemic steroids, IVIG, cyclosporine,
  and TNF inhibition, is curated in the parent Stevens-Johnson_Syndrome entry and
  is not duplicated here; culprit-drug withdrawal and supportive care are retained
  because they directly apply to allopurinol attribution. Oxcarbazepine-series
  frequency snippets were removed from the phenotype section rather than
  generalized to allopurinol cases.

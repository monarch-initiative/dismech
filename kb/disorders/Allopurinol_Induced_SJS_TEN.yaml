name: Allopurinol-Induced Stevens-Johnson Syndrome/Toxic Epidermal Necrolysis
creation_date: "2026-06-24T00:00:00Z"
category: Complex
categories:
- Treatment-Related Disorder
- Cutaneous Toxicity
- Adverse Drug Reaction
synonyms:
- allopurinol-induced SJS/TEN
- allopurinol-induced severe cutaneous adverse reaction
- allopurinol SCAR
description: >-
  Allopurinol is a frequent cause of severe cutaneous adverse reactions (SCARs),
  including Stevens-Johnson syndrome and toxic epidermal necrolysis (SJS/TEN). The
  reaction is a T-cell-mediated, type IV hypersensitivity for which HLA-B*58:01 is
  a strong but incomplete risk marker. Oxypurinol can interact labilely with
  peptide/HLA complexes and activate drug-reactive cytotoxic T cells without
  intracellular antigen processing; the resulting effector response kills
  keratinocytes and produces epidermal necrolysis and detachment. This entry
  conforms to the conserved drug hypersensitivity (SCAR) mechanism module.
parents:
- Skin Disease
- Iatrogenic condition

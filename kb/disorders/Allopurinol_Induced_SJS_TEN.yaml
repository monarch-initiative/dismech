environmental:
- name: Allopurinol exposure
  influences_mechanisms:
  - target: Oxypurinol-HLA class I interaction with HLA-B*58:01 susceptibility
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Allopurinol itself is not the antigenic species. It is metabolized to
      oxypurinol, which is what engages peptide-HLA complexes at the cell
      surface, so the prescribed exposure reaches this node through its
      metabolite.
    evidence:
    - reference: PMID:15743917
      reference_title: "HLA-B*5801 allele as a genetic marker for severe cutaneous adverse reactions caused by allopurinol."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Allopurinol, a commonly prescribed medication for gout and hyperuricemia, is a frequent cause of severe cutaneous adverse reactions (SCAR), which include the drug hypersensitivity syndrome, Stevens-Johnson syndrome, and toxic epidermal necrolysis."
      explanation: >-
        Establishes therapeutic allopurinol as a frequent cause of severe
        cutaneous adverse reactions including Stevens-Johnson syndrome and
        toxic epidermal necrolysis, the reaction this pathway produces.
  description: >-
    Therapeutic exposure to allopurinol (for gout/hyperuricemia) is the
    precipitating exposure. In EuroSCAR, risk was concentrated in the first eight
    weeks and was higher at daily doses of at least 200 mg.
  evidence:
  - reference: PMID:15743917
    reference_title: "HLA-B*5801 allele as a genetic marker for severe cutaneous adverse reactions caused by allopurinol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allopurinol, a commonly prescribed medication for gout and hyperuricemia,
      is a frequent cause of severe cutaneous adverse reactions (SCAR), which
      include the drug hypersensitivity syndrome, Stevens-Johnson syndrome, and
      toxic epidermal necrolysis.
    explanation: >-
      Establishes allopurinol as a frequent cause of SCAR including SJS/TEN, the
      exposure that precipitates this disease.
  - reference: PMID:17919772
    reference_title: "Allopurinol is the most common cause of Stevens-Johnson syndrome and toxic epidermal necrolysis in Europe and Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Daily doses equal to or greater than 200 mg were associated with a higher
      risk (adjusted odds ratio = 36, 95% confidence interval: 17-76) than lower
      doses (adjusted odds ratio = 3.0, 95% confidence interval: 1.1-8.4). The
      risk was restricted to short-term use (<or=8 weeks).
    explanation: >-
      The multinational EuroSCAR case-control study supports the dose association
      and the early treatment-risk window specifically for allopurinol-associated
      SJS/TEN.
- name: Renal impairment
  influences_mechanisms:
  - target: Reduced renal oxypurinol clearance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Impaired renal function is the direct cause of the delayed oxypurinol
      clearance this node describes, sustaining the higher metabolite
      concentrations that drive the concentration-dependent T-cell response.
    evidence:
    - reference: PMID:25115449
      reference_title: "Insights into the poor prognosis of allopurinol-induced severe cutaneous adverse reactions: the impact of renal insufficiency, high plasma levels of oxypurinol and granulysin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Poor renal function was significantly associated with the delayed clearance of plasma oxypurinol, and increased the risk of allopurinol-SCAR (p<0.001, OR (95% CI) 8.0 (3.9 to 17)). Sustained high levels of oxypurinol after allopurinol withdrawal correlated with the poor prognosis of allopurinol-SCAR."
      explanation: >-
        Ties poor renal function directly to delayed plasma oxypurinol
        clearance and to an eightfold increased risk of allopurinol-induced
        severe cutaneous adverse reactions.
  description: >-
    Poor renal function delays oxypurinol clearance, increasing exposure to the
    metabolite that drives the dose-dependent T-cell response and worsening
    prognosis in allopurinol-SCAR, including SJS/TEN.
  evidence:
  - reference: PMID:25115449
    reference_title: "Insights into the poor prognosis of allopurinol-induced severe cutaneous adverse reactions: the impact of renal insufficiency, high plasma levels of oxypurinol and granulysin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Poor renal function was significantly associated with the delayed clearance
      of plasma oxypurinol, and increased the risk of allopurinol-SCAR (p<0.001,
      OR (95% CI) 8.0 (3.9 to 17)). Sustained high levels of oxypurinol after
      allopurinol withdrawal correlated with the poor prognosis of
      allopurinol-SCAR.
    explanation: >-
      A prospective cohort directly links renal impairment to delayed oxypurinol
      clearance, increased allopurinol-SCAR risk, and worse prognosis.
pathophysiology:
- name: Oxypurinol-HLA class I interaction with HLA-B*58:01 susceptibility
  conforms_to: "drug_hypersensitivity_scar#HLA-Restricted Drug Presentation to Drug-Specific T Cells"
  description: >-
    Oxypurinol forms a labile interaction with peptide/HLA complexes at the cell
    surface and can activate drug-reactive T cells without intracellular antigen
    processing. HLA-B*58:01 strongly favors this response but is not required in
    every affected patient.

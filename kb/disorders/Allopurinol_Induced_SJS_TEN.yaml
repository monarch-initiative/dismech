genetic:
- name: HLA-B*58:01 pharmacogenomic susceptibility
  gene_term:
    preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  association: HLA-B*58:01 strongly predisposes to allopurinol-induced SCAR (SJS/TEN)
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    HLA-B*58:01 is a clinically actionable pharmacogenomic risk allele, but its
    sensitivity varies across populations and a negative result does not exclude
    risk. The 2025 US study included only 16 adjudicated allopurinol-SCAR cases
    and combined SJS/TEN with DRESS, so its additional HLA-A*34:02 association
    requires replication before being modeled as an established SJS/TEN risk
    factor here.
  variants:
  - name: HLA-B*58:01
    description: >-
      Class I HLA allele present in essentially all allopurinol-SCAR patients in
      the index Han Chinese case-control study; the restricting element for
      drug-specific T-cell recognition.
    evidence:
    - reference: PMID:15743917
      reference_title: "HLA-B*5801 allele as a genetic marker for severe cutaneous adverse reactions caused by allopurinol."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The HLA-B*5801 allele was present in all (100%) 51 patients with
        allopurinol-SCAR, but only in 20 (15%) of 135 tolerant patients
      explanation: >-
        The index Han Chinese case-control study directly supports the stated
        population-specific allele observation.
  evidence:
  - reference: PMID:15743917
    reference_title: "HLA-B*5801 allele as a genetic marker for severe cutaneous adverse reactions caused by allopurinol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The HLA-B*5801 allele was present in all (100%) 51 patients with
      allopurinol-SCAR, but only in 20 (15%) of 135 tolerant patients
    explanation: >-
      Human case-control data establish HLA-B*58:01 as a strong genetic risk
      factor for allopurinol-induced SCAR.
  - reference: PMID:25047754
    reference_title: "Cost-effectiveness analysis of HLA-B5801 genotyping in the treatment of gout patients with chronic renal insufficiency in Korea."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the HLA-B5801 allele and renal impairment are strongly associated with
      SCARs
    explanation: >-
      Confirms the HLA-B*58:01 association (and renal impairment as a cofactor)
      with allopurinol SCAR. Evidence source is OTHER because this is a
      cost-effectiveness modeling study.
  - reference: PMID:41160012
    reference_title: "HLA-B*58:01 and Risk of Allopurinol-Induced Severe Cutaneous Adverse Reactions in the US."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      although HLA-B*58:01 was found to be associated with allopurinol-induced
      SCARs, generalizing findings from previous studies, the allele was absent
      in more than one-third of the patient cohort and is therefore an incomplete
      indicator of risk.
    explanation: >-
      This small, mixed-phenotype US cohort confirms association while qualifying
      HLA-B*58:01 as an incomplete predictor across heterogeneous populations.

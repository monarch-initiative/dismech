    reference_title: "Aminoacylase 1 deficiency associated with autistic behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the patients reported so far have presented with rather heterogeneous neurologic symptoms"
    explanation: Establishes the heterogeneous neurological presentation of the reported patient population.

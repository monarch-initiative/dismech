pathophysiology:
- name: Aminoacylase 1 Loss of Function
  description: >
    Biallelic recessive loss-of-function or missense variants in ACY1 abolish or
    markedly reduce the activity of aminoacylase 1, a zinc-binding metalloenzyme
    that hydrolyzes N-acetyl amino acids into the free amino acid and acetate.
    Enzyme deficiency is demonstrable in patient-derived (EBV-transformed)
    lymphoblasts and reproduced by expression of mutant ACY1 in HEK293 cells,
    where most disease-associated mutations cause a nearly complete loss of
    enzyme function. This blocks the deacetylation/recycling step of amino-acid
    metabolism performed by the enzyme.
  biological_processes:
  - preferred_term: N-acetyl amino acid hydrolysis in amino acid metabolism
    term:
      id: GO:0006520
      label: amino acid metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:16465618
    reference_title: "Mutations in ACY1, the gene encoding aminoacylase 1, cause a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aminoacylase 1 (ACY1; EC 3.5.14) is the most abundant of the aminoacylases, a"
    explanation: Identifies aminoacylase 1 as the most abundant aminoacylase, the enzyme lost in this disorder.
  - reference: PMID:21414403
    reference_title: "The molecular basis of aminoacylase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aminoacylase 1 is a zinc-binding enzyme which hydrolyzes N-acetyl amino acids"
    explanation: Defines the enzyme as a zinc-binding hydrolase acting on N-acetyl amino acids, the reaction lost on deficiency.
  - reference: PMID:21414403
    reference_title: "The molecular basis of aminoacylase 1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Most mutations resulted in a nearly complete loss of enzyme function"
    explanation: HEK293 expression of disease-associated ACY1 variants shows most cause near-complete loss of enzyme activity.
  downstream:
  - target: Accumulation and Urinary Excretion of N-Acetylated Amino Acids
    causal_link_type: DIRECT
    description: >
      Failure to deacetylate N-acetyl amino acids leaves them to accumulate and
      be excreted in the urine.
- name: Accumulation and Urinary Excretion of N-Acetylated Amino Acids
  description: >
    Because the deacetylation step is blocked, N-acetylated amino acids
    accumulate and are excreted in the urine, producing the biochemical
    signature of the disease: a specific profile of ~11 N-acetylated amino acids
    on urine GC-MS/NMR (N-acetyl derivatives of methionine, glutamate, alanine,
    glycine, leucine, isoleucine, valine, serine, plus N-acetylglutamine and
    N-acetylasparagine). Notably, one study found no increase of N-acetylated
    amino acids in cerebrospinal fluid, leaving the consequences for brain
    metabolism unresolved.
  biological_processes:
  - preferred_term: accumulation of N-acetyl amino acids
    term:
      id: GO:0006520
      label: amino acid metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:16465618
    reference_title: "Mutations in ACY1, the gene encoding aminoacylase 1, cause a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased urinary excretion of several N-acetylated amino acids"
    explanation: The enzyme defect produces increased urinary excretion of N-acetylated amino acids, the biochemical hallmark.
  - reference: PMID:17516490
    reference_title: "NMR spectroscopy of aminoacylase 1 deficiency, a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A typical profile with 11 accumulating N-acetylated amino acids was observed in urine from the patients"
    explanation: Defines the specific 11-metabolite urinary N-acetylated amino acid profile.
  - reference: PMID:17516490
    reference_title: "NMR spectroscopy of aminoacylase 1 deficiency, a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found no evidence of an increased concentration of N-acetylated amino acids in the cerebrospinal fluid from one patient"
    explanation: The absence of CSF accumulation leaves the consequences for brain metabolism unresolved.
  downstream:
  - target: Heterogeneous Neurological Manifestations of Uncertain Causality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Most ascertained patients have neurological findings, but whether the
      biochemical defect causes them is unresolved.
- name: Heterogeneous Neurological Manifestations of Uncertain Causality
  description: >
    Most individuals ascertained with ACY1 deficiency have presented with
    heterogeneous, nonspecific neurological symptoms, and the disorder is
    thought to be underdiagnosed. However, because ACY1 has been evolutionarily
    conserved and is expressed in the CNS, a role in CNS function or development
    is conceivable but has not been demonstrated, and ascertainment through
    urine metabolic screening means it remains unresolved whether ACY1
    deficiency is a true metabolic disease with pleiotropic clinical expression
    or a biochemical variant. This node is intentionally curated as a mechanism
    of uncertain causality (see the attached knowledge gap).

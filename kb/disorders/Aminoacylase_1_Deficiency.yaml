- name: Heterogeneous Neurological Manifestations of Uncertain Causality
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >
    Most individuals ascertained with ACY1 deficiency have presented with
    heterogeneous, nonspecific neurological symptoms, and the disorder is
    thought to be underdiagnosed. However, because ACY1 has been evolutionarily
    conserved and is expressed in the CNS, a role in CNS function or development
    is conceivable but has not been demonstrated, and ascertainment through
    urine metabolic screening means it remains unresolved whether ACY1
    deficiency is a true metabolic disease with pleiotropic clinical expression
    or a biochemical variant. This node is intentionally curated as a mechanism
    of uncertain causality (see the attached knowledge gap).
  evidence:

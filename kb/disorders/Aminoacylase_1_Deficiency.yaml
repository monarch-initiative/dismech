genetic:
- name: ACY1 pathogenic variants
  gene_term:
    preferred_term: ACY1
    term:
      id: hgnc:177
      label: ACY1
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:16465618
      reference_title: "Mutations in ACY1, the gene encoding aminoacylase 1, cause a novel inborn error of metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutation analysis uncovered recessive loss-of-function or missense ACY1 mutations in all four individuals affected"
      explanation: Recessive ACY1 mutations in all four affected individuals establish autosomal recessive inheritance.
  features: >
    Biallelic ACY1 variants cause aminoacylase 1 deficiency. A recurrent
    missense variant, c.1057C>T (p.Arg353Cys), is seen homozygously in several
    unrelated patients; it was also detected heterozygously in 5/161 controls,
    and protein-expression studies confirmed that the mutant protein had lost
    catalytic activity. Additional loss-of-function and missense variants have
    been reported, and expression of most disease-associated variants in HEK293
    cells shows a near-complete loss of enzyme activity.
  evidence:
  - reference: PMID:16274666
    reference_title: "Aminoacylase I deficiency: a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous c.1057 C>T transition, predicting a p.Arg353Cys substitution"
    explanation: Identifies the recurrent homozygous ACY1 c.1057C>T (p.Arg353Cys) variant as causal.
  - reference: PMID:16274666
    reference_title: "Aminoacylase I deficiency: a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutant protein had lost catalytic activity"
    explanation: Protein-expression studies confirm loss of catalytic activity of the mutant enzyme, establishing pathogenicity.

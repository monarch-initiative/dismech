discussions:
- discussion_id: gap_acy1_clinical_significance
  prompt: >-
    Is aminoacylase 1 deficiency a true metabolic disease that causally produces
    its reported neurological phenotypes (psychomotor delay, hypotonia, febrile
    seizures, intellectual disability, autism, dystonia), or is the enzyme
    defect largely a benign biochemical variant whose clinical associations
    reflect ascertainment bias from urine metabolic screening?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterogeneous Neurological Manifestations of Uncertain Causality
  - pathophysiology#Accumulation and Urinary Excretion of N-Acetylated Amino Acids
  rationale: >-
    The enzymatic and biochemical basis of aminoacylase 1 deficiency is well
    established: biallelic ACY1 loss-of-function variants abolish hydrolysis of
    N-acetyl amino acids and produce a specific urinary N-acetylated amino acid
    profile. What remains unresolved is the causal link between this defect and
    clinical disease. Most affected individuals were ascertained through urine
    metabolic screening rather than a defining clinical phenotype, the reported
    neurological findings are heterogeneous and nonspecific, one original subject
    had normal clinical findings, one report found no increase of N-acetylated
    amino acids in cerebrospinal fluid, and at least one affected adult was
    cognitively normal. The authors of the defining studies explicitly could not
    state whether ACY1 deficiency has pathogenic significance with pleiotropic
    clinical expression or is simply a biochemical variant. Resolving this bears
    directly on genetic counseling, newborn/metabolic screening interpretation,
    and whether the condition should be treated as a disease.
  evidence:
  - reference: PMID:20480396
    reference_title: "Aminoacylase 1 deficiency associated with autistic behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is not clear whether ACY1 deficiency represents a true metabolic disease
      with a causal relationship between the enzyme defect and the clinical
      phenotype or merely a biochemical abnormality
    explanation: The clinical-significance uncertainty is stated directly by the case-report authors.
  - reference: PMID:38234346
    reference_title: "Aminoacylase 1 deficiency: case report on three affected siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its clinical manifestations are highly variable, ranging from severe neurological symptoms to being asymptomatic."
    explanation: Recent case literature confirms that clinical variability and asymptomatic disease remain central limitations.
  proposed_experiments:
  - experiment_id: exp_acy1_unbiased_cohort_penetrance
    name: Ascertainment-unbiased penetrance of ACY1 biallelic loss of function
    description: >-
      Estimate the neurodevelopmental phenotype rate among individuals with
      biallelic ACY1 loss-of-function genotypes identified in large,
      phenotype-agnostic sequencing biobanks (rather than metabolic-screening
      cohorts), comparing against matched controls to test whether the genotype
      is associated with neurological disease independent of ascertainment bias.
  - experiment_id: exp_acy1_cns_model
    name: CNS consequences of ACY1 loss in a neural model system
    description: >-
      Use ACY1-null human iPSC-derived neurons/organoids and/or an animal model
      to test whether loss of aminoacylase 1 perturbs neuronal metabolism,
      development, or function, given that ACY1 is expressed in the CNS but no
      accumulation of N-acetylated amino acids was detected in patient CSF.
- discussion_id: gap_acy1_mitochondrial_model_translation
  prompt: >-
    Do N-acetylglutamate and N-acetylmethionine reach concentrations in human
    brain that impair mitochondrial energy metabolism, as they do in exposed
    developing-rat brain mitochondrial preparations?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Mitochondrial Brain Energy Impairment
  - pathophysiology#Accumulation and Urinary Excretion of N-Acetylated Amino Acids
  rationale: >-
    Experimental evidence now identifies a plausible bioenergetic mechanism,
    but the preparation was outside an intact organism and did not establish
    metabolite exposure in human brain. The only reported patient CSF
    measurement found no increased N-acetylated amino acids, so translating the
    experimental effect to human neurological disease requires exposure and
    target-engagement evidence.
  evidence:
  - reference: PMID:37871522
    reference_title: "N-Acetylglutamate and N-acetylmethionine compromise mitochondrial bioenergetics homeostasis and glutamate oxidation in brain of developing rats: Potential implications for the pathogenesis of ACY1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the in vitro effects of N-acetylglutamate (NAG) and N-acetylmethionine
      (NAM), major metabolites accumulating in ACY1 deficiency
    explanation: Establishes that the mechanistic evidence comes from in-vitro metabolite exposure.
  - reference: PMID:17516490
    reference_title: "NMR spectroscopy of aminoacylase 1 deficiency, a novel inborn error of metabolism."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found no evidence of an increased concentration of N-acetylated amino
      acids in the cerebrospinal fluid from one patient
    explanation: A single human CSF observation weighs against assuming CNS exposure, although it is not decisive.
  proposed_experiments:
  - experiment_id: exp_acy1_human_cns_exposure_response
    name: Human CNS exposure-response validation
    description: >-
      Quantify N-acetylated amino acids in paired plasma and CSF from molecularly
      confirmed cases and test patient-derived neuronal or organoid mitochondrial

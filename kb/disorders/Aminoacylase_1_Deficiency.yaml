name: Aminoacylase 1 Deficiency
category: Mendelian
creation_date: "2026-07-07T00:00:00Z"
synonyms:
- ACY1 deficiency
- ACY1D
- Aminoacylase I deficiency
- N-acyl-L-amino acid amidohydrolase deficiency
- Deficiency of the aminoacylase-1 enzyme
description: >
  Aminoacylase 1 deficiency (ACY1D) is a rare autosomal recessive inborn error
  of metabolism caused by biallelic loss-of-function variants in ACY1, the gene
  encoding aminoacylase 1 — an abundant cytosolic zinc-binding metalloenzyme
  (EC 3.5.1.14) that hydrolyzes N-acetylated amino acids into the free amino
  acid and acetate. Loss of enzyme activity does not produce the toxic-metabolite
  intoxication seen in classic organic acidurias; instead it causes a
  characteristic accumulation and urinary excretion of N-acetylated amino acids
  (a specific profile of ~11 metabolites, most prominently the N-acetyl
  derivatives of methionine, glutamate, alanine, glycine, leucine, isoleucine,
  valine, and serine) that is detected on urine organic-acid GC-MS or NMR. It
  was first reported in 2005 and defined genetically in 2006. Most ascertained
  individuals have presented with heterogeneous, nonspecific neurological
  findings (psychomotor/developmental delay, muscular hypotonia, febrile
  seizures, intellectual disability, autistic behavior, and — in individual
  cases — cerebellar vermis atrophy, syringomyelia, or generalized dystonia),
  but because most cases were ascertained through targeted urine metabolic
  screening, the clinical significance and penetrance of the biochemical defect
  remain debated and it is considered underdiagnosed. dismech curates the enzyme
  defect and its biochemical signature as established, while explicitly framing
  the causal link to a uniform clinical phenotype as an open knowledge gap.

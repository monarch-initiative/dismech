- name: Accumulation and Urinary Excretion of N-Acetylated Amino Acids
  biological_scale: MOLECULAR
  description: >
    Because the deacetylation step is blocked, N-acetylated amino acids
    accumulate and are excreted in the urine, producing the biochemical
    signature of the disease: a specific profile of ~11 N-acetylated amino acids
    on urine GC-MS/NMR (N-acetyl derivatives of methionine, glutamate, alanine,
    glycine, threonine, leucine, isoleucine, valine, serine, plus
    N-acetylglutamine and N-acetylasparagine). Notably, one study found no increase of N-acetylated
    amino acids in cerebrospinal fluid, leaving the consequences for brain
    metabolism unresolved.
  biological_processes:
  - preferred_term: deacetylation of N-acetylated amino acids
    term:
      id: GO:0042219
      label: modified amino acid catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:16465618
    reference_title: "Mutations in ACY1, the gene encoding aminoacylase 1, cause a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased urinary excretion of several N-acetylated amino acids"
    explanation: The enzyme defect produces increased urinary excretion of N-acetylated amino acids, the biochemical hallmark.
  - reference: PMID:17516490
    reference_title: "NMR spectroscopy of aminoacylase 1 deficiency, a novel inborn error of metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A typical profile with 11 accumulating N-acetylated amino acids was observed in urine from the patients"
    explanation: Defines the specific 11-metabolite urinary N-acetylated amino acid profile.
  - reference: PMID:17516490

treatments:
- name: Supportive Care and Metabolic Follow-up
  description: >
    No specific or curative therapy exists for aminoacylase 1 deficiency.
    Management is supportive and directed at the individual neurological
    manifestations (e.g., developmental support, seizure management,
    symptomatic treatment of dystonia), with metabolic follow-up; the debated
    clinical significance of the biochemical defect argues for careful,
    individualized assessment rather than a fixed treatment protocol.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
discussions:
- discussion_id: gap_acy1_clinical_significance
  prompt: >-
    Is aminoacylase 1 deficiency a true metabolic disease that causally produces
    its reported neurological phenotypes (psychomotor delay, hypotonia, febrile
    seizures, intellectual disability, autism, dystonia), or is the enzyme
    defect largely a benign biochemical variant whose clinical associations
    reflect ascertainment bias from urine metabolic screening?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterogeneous Neurological Manifestations of Uncertain Causality
  - pathophysiology#Accumulation and Urinary Excretion of N-Acetylated Amino Acids
  rationale: >-
    The enzymatic and biochemical basis of aminoacylase 1 deficiency is well
    established: biallelic ACY1 loss-of-function variants abolish hydrolysis of
    N-acetyl amino acids and produce a specific urinary N-acetylated amino acid
    profile. What remains unresolved is the causal link between this defect and
    clinical disease. Most affected individuals were ascertained through urine
    metabolic screening rather than a defining clinical phenotype, the reported
    neurological findings are heterogeneous and nonspecific, one original subject
    had normal clinical findings, one report found no increase of N-acetylated
    amino acids in cerebrospinal fluid, and at least one affected adult was
    cognitively normal. The authors of the defining studies explicitly could not
    state whether ACY1 deficiency has pathogenic significance with pleiotropic
    clinical expression or is simply a biochemical variant. Resolving this bears
    directly on genetic counseling, newborn/metabolic screening interpretation,
    and whether the condition should be treated as a disease.
  proposed_experiments:
  - experiment_id: exp_acy1_unbiased_cohort_penetrance
    name: Ascertainment-unbiased penetrance of ACY1 biallelic loss of function
    description: >-
      Estimate the neurodevelopmental phenotype rate among individuals with
      biallelic ACY1 loss-of-function genotypes identified in large,
      phenotype-agnostic sequencing biobanks (rather than metabolic-screening
      cohorts), comparing against matched controls to test whether the genotype
      is associated with neurological disease independent of ascertainment bias.
  - experiment_id: exp_acy1_cns_model
    name: CNS consequences of ACY1 loss in a neural model system
    description: >-
      Use ACY1-null human iPSC-derived neurons/organoids and/or an animal model
      to test whether loss of aminoacylase 1 perturbs neuronal metabolism,
      development, or function, given that ACY1 is expressed in the CNS but no
      accumulation of N-acetylated amino acids was detected in patient CSF.

mechanistic_hypotheses:
- hypothesis_group_id: n_acetyl_mitochondrial_bioenergetic_hypothesis
  hypothesis_label: N-acetylated amino-acid mitochondrial bioenergetic toxicity
  status: EMERGING
  description: >-
    Accumulating N-acetylglutamate and N-acetylmethionine may impair neuronal
    mitochondrial respiratory-chain and glutamate-dehydrogenase activities and
    reduce ATP synthesis, providing a candidate link from the biochemical defect
    to neurological findings. The evidence is limited to in-vitro exposure of
    developing-rat brain mitochondrial preparations; human CSF accumulation was
    not detected in the one patient tested.
  evidence:
  - reference: PMID:37871522
    reference_title: "N-Acetylglutamate and N-acetylmethionine compromise mitochondrial bioenergetics homeostasis and glutamate oxidation in brain of developing rats: Potential implications for the pathogenesis of ACY1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, NAG and NAM strongly decreased mitochondrial ATP synthesis."
    explanation: Directly supports mitochondrial ATP impairment in the experimental preparation, but not in human brain.
- hypothesis_group_id: acy1_auditory_hair_cell_hypothesis
  hypothesis_label: ACY1-dependent auditory hair-cell development
  status: EMERGING
  description: >-
    ACY1 loss may impair auditory hair-cell development and function. This model
    is supported by a single human candidate case and by morpholino knockdown and
    rescue in zebrafish, but the gene-hearing-loss relationship requires
    unrelated human cases and independent replication.
  evidence:
  - reference: PMID:42322530
    reference_title: "A Splice-Site Variant in ACY1 Associated with Congenital Hearing Loss: Clinical, Biochemical, and Zebrafish Functional Evidence."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A zebrafish model with morpholino-mediated acy1 knockdown revealed a
      significant reduction in hair cells and impaired auditory function,
      which were effectively rescued by wild-type but not mutant human ACY1 mRNA.
    explanation: In-vivo knockdown and allele-specific rescue support the candidate auditory mechanism, with morpholino and cross-species limitations.
  - reference: PMID:42322530
    reference_title: "A Splice-Site Variant in ACY1 Associated with Congenital Hearing Loss: Clinical, Biochemical, and Zebrafish Functional Evidence."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous splicing variant, c.1063-1G>A, in ACY1 as a plausible candidate
      variant in a 5-year-old girl with congenital hearing loss and normal
      developmental milestones over a 4-year follow-up
    explanation: Supplies the single human observation while retaining the authors' candidate-level wording.
pathophysiology:
- name: Aminoacylase 1 Enzyme Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic loss-of-function or missense variants in ACY1 abolish
    or reduce the activity of aminoacylase 1, a zinc-binding metalloenzyme
    that hydrolyzes N-acetyl amino acids into the free amino acid and acetate.
    Enzyme deficiency is demonstrable in patient-derived (EBV-transformed)
    lymphoblasts and reproduced by expression of mutant ACY1 in HEK293 cells,
    where most disease-associated mutations cause a nearly complete loss of
    enzyme function. This blocks the deacetylation/recycling step of amino-acid
    metabolism performed by the enzyme.

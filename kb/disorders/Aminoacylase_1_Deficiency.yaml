      snippet: "Mutation analysis uncovered recessive loss-of-function or missense ACY1 mutations in all four individuals affected"
      explanation: Recessive ACY1 mutations in all four affected individuals establish autosomal recessive inheritance.
  features: >
    Biallelic ACY1 variants cause aminoacylase 1 deficiency. A recurrent
    missense variant, c.1057C>T (p.Arg353Cys), is seen homozygously in multiple
    unrelated patients; it was also detected heterozygously in 5/161 controls,
    and protein-expression studies confirmed that the mutant protein had lost
    catalytic activity. Additional loss-of-function and missense variants have
    been reported, and expression of most disease-associated variants in HEK293
    cells shows a near-complete loss of enzyme activity.

- name: Conjunctival Lymphatic and Regional Nodal Spread
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Unlike the uvea, the conjunctiva has a rich lymphatic network. Conjunctival
    melanoma therefore metastasises first and predominantly to the regional
    (preauricular, submandibular, cervical) lymph nodes, with distant spread to
    lung, liver and brain occurring later. Regional nodal metastasis is a
    substantial contributor to conjunctival melanoma mortality; specific nodal
    and disease-specific-mortality rates are not asserted here because no
    quotable figure could be verified against a cached source (see notes).
    This lymphatic-first route is the direct
    mechanistic opposite of uveal melanoma's lymphatic-free, liver-dominant
    haematogenous route, and it is why sentinel-node assessment is relevant in
    conjunctival but not uveal disease.
  locations:
  - preferred_term: conjunctiva
    term:

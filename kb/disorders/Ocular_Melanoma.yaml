- name: Secondary Splicing/Translation-Factor Driver Stratification
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: ESTABLISHED
  description: >-
    In disomy-3 tumours, which rarely metastasise, the secondary driver is
    instead a hotspot mutation in the splicing factor SF3B1 (predominantly
    Arg625, altering RNA splicing genome-wide) or an N-terminal in-frame
    mutation in the translation-initiation factor EIF1AX. Both are essentially
    mutually exclusive with BAP1 loss. SF3B1 mutation marks intermediate risk
    with characteristically late relapse; EIF1AX mutation marks the lowest-risk
    class. Together with BAP1 these three genes define the prognostic
    stratification that governs surveillance intensity after successful local
    treatment.

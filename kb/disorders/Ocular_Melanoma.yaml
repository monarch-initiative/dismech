      \ \nnumber, 2015-003153-18.)."
    explanation: Identifies the NCT registration for the pivotal tebentafusp trial.
  - reference: clinicaltrials:NCT03070392
    reference_title: A Phase II Randomized, Open-label, Multi-center Study of the Safety
      and Efficacy of IMCgp100 Compared With Investigator Choice in HLA-A*0201 Positive
      Patients With Previously Untreated Advanced Uveal Melanoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To evaluate the overall survival of HLA-A\\*0201 positive adult patients
      with previously untreated advanced UM receiving IMCgp100 compared to Investigator's
      Choice of dacarbazine, ipilimumab, or pembrolizumab.
    explanation: ClinicalTrials.gov record giving the trial's overall-survival primary
      objective and the checkpoint-inhibitor comparator arm.

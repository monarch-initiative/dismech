      \ via hematogenous \nspread, in the absence of lymphatic drainage of the eye."
    explanation: Directly sources this entry's hinge claim - that the eye lacks
      lymphatic drainage, so uveal melanoma disseminates haematogenously - which is
      what distinguishes the uveal from the conjunctival arm.
  downstream:
  - target: Hepatic Metastatic Colonisation
    description: >-
      Circulating uveal melanoma cells preferentially arrest, survive and
      colonise the hepatic sinusoidal niche.

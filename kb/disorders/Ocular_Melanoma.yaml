        clinical outcome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 90% of cases the liver is the first site of \nmetastasis, however\
        \ the mechanisms underlying this hepatic tropism have not been \nelucidated."

      plexus of the eye and is biologically distinct from cutaneous melanoma by characteristic
      cytogenetic alterations4 and a very strong propensity to metastasize to the
      liver5.
    explanation: Documents the strong hepatic metastatic propensity that this dissemination
      node feeds.

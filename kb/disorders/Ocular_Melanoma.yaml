      melanoma with BAP1/SF3B1/EIF1AX prognostic stratification.
- name: Choroidal Melanoma
  description: >-
    Uveal melanoma of the choroid, the commonest site (approximately 90% of
    uveal melanomas). Typically presents as a pigmented dome-shaped or
    collar-button subretinal mass with exudative retinal detachment, or is
    found incidentally on routine fundus examination.
  subtype_term:
    preferred_term: malignant choroid melanoma
    term:
      id: MONDO:0003878
      label: malignant choroid melanoma
  locations:
  - preferred_term: optic choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  evidence:
  - reference: PMID:19667335
    reference_title: Metastasis of uveal melanoma millimeter-by-millimeter in 8033
      consecutive eyes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 7256 eyes with choroidal melanoma, the mean tumor \nthickness was\
      \ 5.5 mm and metastasis occurred in 8%, 15%, and 25% at 3, 5, and 10 \nyears,\
      \ respectively."
    explanation: Choroidal melanoma accounted for 7256 of 8033 uveal melanoma eyes in
      this series (about 90%), the site predominance asserted here, with its associated
      metastasis rates.
- name: Ciliary Body Melanoma
  description: >-
    Uveal melanoma arising in the ciliary body. Uncommon (roughly 6-7% of uveal
    melanomas) but adversely prognostic because it is detected late and
    ciliary-body involvement is itself an adverse AJCC staging feature.
  subtype_term:
    preferred_term: malignant ciliary body melanoma
    term:
      id: MONDO:0003912
      label: malignant ciliary body melanoma
  locations:
  - preferred_term: ciliary body
    term:
      id: UBERON:0001775
      label: ciliary body
  evidence:
  - reference: PMID:19667335
    reference_title: Metastasis of uveal melanoma millimeter-by-millimeter in 8033
      consecutive eyes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 492 eyes with ciliary body melanoma, the mean tumor \nthickness\
      \ was 6.6 mm and metastasis occurred in 12%, 19%, and 33% at 3, 5, and \n10 years,\
      \ respectively."
    explanation: Ciliary body melanoma was 492 of 8033 eyes (about 6%) and carried
      markedly higher metastasis rates than choroidal or iris melanoma, supporting both
      the frequency and the adverse-prognosis claims made here.
- name: Iris Melanoma
  description: >-
    Uveal melanoma arising in the iris, the least common uveal site (roughly
    3%). Presents one to two decades earlier than posterior uveal melanoma
    and is usually visible as an enlarging pigmented iris lesion, sometimes
    with heterochromia, corectopia or secondary glaucoma; prognosis is
    generally favourable because of early detection and smaller tumour size.
  subtype_term:
    preferred_term: iris melanoma
    term:
      id: MONDO:0004064
      label: iris melanoma
  locations:
  - preferred_term: iris
    term:
      id: UBERON:0001769
      label: iris
  evidence:
  - reference: PMID:19667335
    reference_title: Metastasis of uveal melanoma millimeter-by-millimeter in 8033
      consecutive eyes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 285 eyes with iris melanoma, the mean tumor thickness was \n2.7\
      \ mm and metastasis occurred in 0.5%, 4%, and 7% at 3, 5, and 10 years, \nrespectively."
    explanation: Iris melanoma was 285 of 8033 eyes (about 3.5%), the smallest and
      thinnest tumours with by far the lowest metastasis rates, supporting the rarity
      and favourable prognosis asserted here.
- name: Conjunctival Melanoma
  display_name: Conjunctival Melanoma (ocular-surface/mucosal)
  description: >-
    Melanoma of the conjunctival epithelium, most often bulbar and near the
    limbus. This is NOT a uveal melanoma and must not be conflated with one:
    it is an ocular-surface mucosal melanoma whose driver landscape (BRAF,
    NRAS, NF1, TERT promoter, UV signature) resembles cutaneous rather than
    uveal melanoma, it usually arises from a conjunctival melanocytic
    intraepithelial precursor lesion, and it spreads first through conjunctival
    lymphatics to regional nodes rather than by the liver-dominant
    haematogenous route of uveal disease. Incidence is roughly 1 per million
    per year and rising.
  subtype_term:
    preferred_term: malignant conjunctival melanoma
    term:
      id: MONDO:0002096
      label: malignant conjunctival melanoma
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  genes:
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  evidence:
  - reference: PMID:41097064
    reference_title: 'Ocular Melanoma: A Comprehensive Review with a Focus on Molecular
      Biology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, conjunctival and\neyelid melanoma exhibits greater molecular\
      \ similarity to cutaneous melanoma,\ncommonly involving BRAF, NRAS, NF1, and\
      \ TERT promoter mutations."
    explanation: Directly supports treating conjunctival melanoma as a molecularly
      distinct, cutaneous-like arm of ocular melanoma rather than a uveal subtype.
  - reference: PMID:34015548
    reference_title: 'Conjunctival melanoma: New insights in tumour genetics and immunology,
      leading to new therapeutic options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CoM is characterized by mutations that have also been identified in\
      \ \ncutaneous melanoma, e.g. in BRAF, NRAS and TERT. These mutations are distinct\
      \ \nfrom the mutations found in uveal melanoma (UM), affecting genes such as\
      \ GNAQ, \nGNA11, and BAP1."
    explanation: Explicitly contrasts the conjunctival and uveal driver landscapes,
      justifying the split modelled here.


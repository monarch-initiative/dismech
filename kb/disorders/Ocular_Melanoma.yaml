- name: UV-Associated BRAF/NRAS/NF1 Driver Activation
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: ESTABLISHED
  description: >-
    Conjunctival melanoma is driven by the mutation spectrum of cutaneous, not
    uveal, melanoma: activating BRAF (commonly V600E) and NRAS (commonly Q61)
    mutations, NF1 loss, and TERT promoter mutations, on a UV-signature
    mutational background. GNAQ, GNA11 and BAP1 - the defining uveal genes -
    are not the drivers here. The practical corollary is that BRAF/MEK-targeted
    therapy and PD-1 blockade, which fail in uveal melanoma, are the rational
    (if still evidence-thin) systemic options in conjunctival melanoma. This
    node is the reason the two arms must be curated separately.

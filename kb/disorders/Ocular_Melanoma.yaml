name: Ocular Melanoma
creation_date: '2026-08-01T05:30:00Z'
description: >-
  Ocular melanoma is a malignant melanocytic neoplasm arising from the
  structures of the eye or ocular adnexa. It is not one homogeneous disease:
  the dominant form is uveal melanoma (choroid, ciliary body, iris), the
  commonest primary intraocular malignancy of adults, while conjunctival
  melanoma is a much rarer ocular-surface (mucosal) melanoma that is
  biologically distinct. Uveal melanoma is initiated by near-mutually-exclusive
  activating mutations in the Gq/G11 alpha subunits GNAQ and GNA11 (and, in
  wild-type tumours, CYSLTR2 or PLCB4), which drive constitutive
  PLC-beta/PKC/MAPK signalling and Hippo-independent YAP activation. Prognosis
  is stratified by a secondary driver acquired later in tumour evolution:
  BAP1 loss with monosomy 3 confers high metastatic risk, SF3B1 mutation an
  intermediate or late risk, and EIF1AX mutation a low risk. Roughly half of
  uveal melanoma patients ultimately metastasise, almost exclusively via a
  haematogenous, hepatotropic route, and metastatic disease is largely
  refractory to immune-checkpoint blockade because the tumour mutational
  burden is low. Tebentafusp, a gp100 x CD3 ImmTAC bispecific, is the first
  agent to improve overall survival in metastatic disease but is restricted to
  HLA-A*02:01-positive patients. Conjunctival melanoma, by contrast, resembles
  cutaneous melanoma (BRAF, NRAS, NF1 and TERT promoter mutations, UV
  signature), usually arises from a conjunctival melanocytic intraepithelial
  precursor, and spreads first to regional lymph nodes.
categories:
- Ocular Malignancy
- Oncogene-Driven Cancer
category: Cancer
synonyms:
- eye melanoma
- melanoma of the eye
- intraocular melanoma
parents:
- ocular cancer
- melanoma

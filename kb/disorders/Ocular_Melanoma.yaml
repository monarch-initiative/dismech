has_subtypes:
- name: Uveal Melanoma
  display_name: Uveal Melanoma (choroid, ciliary body, iris)
  description: >-
    Melanoma of the uveal tract, accounting for the large majority of ocular
    melanomas and for essentially all primary intraocular melanoma in adults.
    Initiated by GNAQ/GNA11 (or CYSLTR2/PLCB4) activating mutations, stratified
    prognostically by BAP1/SF3B1/EIF1AX status and chromosome 3/8q copy number,
    and characterised by haematogenous liver-dominant metastasis. Curated in
    depth as its own dismech entry (Uveal_Melanoma).
  subtype_term:
    preferred_term: uveal melanoma
    term:
      id: MONDO:0006486
      label: uveal melanoma
  children:
  - Choroidal Melanoma
  - Ciliary Body Melanoma
  - Iris Melanoma
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  genes:
  - preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  - preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  - preferred_term: BAP1
    term:
      id: hgnc:950
      label: BAP1
  evidence:
  - reference: PMID:41097064
    reference_title: 'Ocular Melanoma: A Comprehensive Review with a Focus on Molecular
      Biology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uveal melanoma is predominantly driven by mutations in GNAQ and GNA11,\

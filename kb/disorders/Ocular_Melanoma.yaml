  description: >-
    Blurred or reduced vision occurs when the tumour involves the macula, causes
    exudation or retinal detachment, or obstructs the visual axis. Up to about
    30% of uveal melanomas are asymptomatic at diagnosis and are found on
    routine examination, so acuity loss is common but not universal.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-four patients (49%) presented with blurred vision."
    explanation: Blurred vision (decreased visual acuity) was the commonest presenting
      symptom, in 49% of an enucleation cohort - supporting the FREQUENT frequency band
      assigned here.
- category: Ocular
  name: Visual Field Defect
  frequency: OCCASIONAL
  description: >-
    A field defect - classically described by patients as a "shadow" in the
    field of vision - corresponding to the tumour location and the extent of
    any associated exudative retinal detachment. Reported as the presenting
    symptom in about a quarter of patients, and notable because an isolated
    field shadow correlates with vasculogenic mimicry and worse prognosis.
  phenotype_term:
    preferred_term: Visual field defect
    term:
      id: HP:0001123
      label: Visual field defect
  evidence:
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "18 (26%) with \na shadow in the visual field"
    explanation: Quantifies a visual-field shadow as the presenting symptom in 26% of
      an enucleation cohort, supporting the OCCASIONAL (5-29%) frequency band assigned
      here.
- category: Ocular
  name: Exudative Retinal Detachment
  description: >-
    Serous separation of the neurosensory retina caused by exudation from the
    surface of a choroidal melanoma. It is a classic accompanying sign of
    choroidal melanoma and a common route to vision loss.
  phenotype_term:
    preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  evidence:
  - reference: PMID:19667335
    reference_title: Metastasis of uveal melanoma millimeter-by-millimeter in 8033
      consecutive eyes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical factors predictive of metastasis by multivariate analysis included\
      \ increasing patient age, ciliary \nbody location, increasing tumor diameter,\
      \ increasing tumor thickness, having a \nbrown tumor, and the presence of subretinal\
      \ fluid, intraocular hemorrhage, or \nextraocular extension."
    explanation: Subretinal fluid - the exudative retinal detachment described by this
      phenotype - is documented as a recognised clinical feature of uveal melanoma in
      an 8033-eye series, and is independently predictive of metastasis.
- category: Ocular
  name: Photopsia
  frequency: OCCASIONAL
  description: >-
    Perceived flashes of light arising from vitreoretinal traction and
    detachment at the tumour-retina interface. Photopsia and floaters together
    accounted for the presenting symptom in about 10% of one enucleation
    cohort.
  phenotype_term:
    preferred_term: Photopsia
    term:
      id: HP:0030786
      label: Photopsia
  evidence:
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "7 (10%) with \nphotopsia and/or floaters"
    explanation: Quantifies photopsia (reported jointly with floaters) as the presenting
      symptom in 10% of patients, supporting the OCCASIONAL frequency band.
- category: Ocular
  name: Vitreous Floaters
  frequency: OCCASIONAL
  description: >-
    Floaters from tumour-associated vitreous cells, dispersed pigment, or
    vitreous haemorrhage. Reported jointly with photopsia in about 10% of
    patients at presentation.
  phenotype_term:
    preferred_term: Vitreous floaters
    term:
      id: HP:0100832
      label: Vitreous floaters
  evidence:
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "7 (10%) with \nphotopsia and/or floaters"
    explanation: Quantifies floaters (reported jointly with photopsia) as the presenting
      symptom in 10% of patients, supporting the OCCASIONAL frequency band.
- category: Ocular
  name: Secondary Glaucoma
  frequency: OCCASIONAL
  description: >-
    Raised intraocular pressure from anterior-segment tumour involvement, angle
    infiltration, or neovascularisation. Most relevant to iris and ciliary-body
    melanoma.
  phenotype_term:
    preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
- category: Ocular
  name: Ocular Pain
  frequency: OCCASIONAL
  description: >-
    Pain from a large intraocular tumour, secondary glaucoma, or extrascleral
    extension; a common indication for enucleation in a blind painful eye.
  phenotype_term:
    preferred_term: Ocular pain
    term:
      id: HP:0200026
      label: Ocular pain
- category: Systemic
  name: Hepatic Metastasis
  frequency: FREQUENT
  description: >-
    Metastatic melanoma deposits in the liver. Roughly half of uveal melanoma
    patients develop metastases and the liver is the dominant site in around
    90%, typically detected on surveillance imaging rather than by symptoms or
    by abnormal liver function tests, which cannot exclude hepatic metastasis.
  phenotype_term:
    preferred_term: Neoplasm of the liver
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:
  - reference: PMID:35227015
    reference_title: Liver metastasis in uveal melanoma - treatment options and clinical
      outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite \nimprovements in the treatment of primary tumours, approximately\
      \ 50% of patients \nwith UM will develop metastases. In 90% of cases the liver\
      \ is the first site of \nmetastasis"
    explanation: Documents that about half of uveal melanoma patients metastasise and
      that the liver is the first site in 90%, the hepatotropic pattern this phenotype
      records.

histopathology:
- name: Melanocytic Neoplasm
  finding_term:
    preferred_term: Melanocytic Neoplasm
    term:
      id: NCIT:C7058
      label: Melanocytic Neoplasm
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    All ocular melanomas are melanocytic neoplasms. Diagnosis is supported by
    immunohistochemistry for melanocytic markers (SOX10, S100, Melan-A/MART1,
    HMB45); nuclear BAP1 immunostaining is additionally used in uveal melanoma
    as a surrogate for BAP1 inactivation and hence metastatic risk.
  evidence:
  - reference: PMID:41097064
    reference_title: 'Ocular Melanoma: A Comprehensive Review with a Focus on Molecular
      Biology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although sharing some \nhistopathological features with cutaneous melanoma,\
      \ these tumours are \ncharacterized by distinct molecular and biological profiles\
      \ with direct \nimplications for prognosis and treatment."
    explanation: Confirms ocular melanomas are histopathologically melanocytic tumours
      while being molecularly distinct from cutaneous melanoma.
- name: Epithelioid Cell Morphology
  finding_term:
    preferred_term: uveal epithelioid cell melanoma
    term:
      id: NCIT:C35780
      label: Uveal Epithelioid Cell Melanoma
  diagnostic: false
  subtype: Uveal Melanoma
  description: >-
    Uveal melanomas are classified by cell type as spindle, mixed or
    epithelioid. Epithelioid morphology - large cells with abundant cytoplasm,
    prominent nucleoli and distinct cell borders - is strongly adverse, tracks
    with BAP1 loss and monosomy 3, and is one of the classic histological
    predictors of metastasis.
  evidence:
  - reference: PMID:12601021
    reference_title: 'Monosomy 3 in uveal melanoma: correlation with clinical and histologic
      predictors of survival.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monosomy 3 was associated with epithelioid cells \n(chi(2) test, P <\
      \ 0.001), PAS-positive loops (chi(2), P = 0.001), LBD \n(Mann-Whitney test, P\
      \ = 0.002), CB involvement (chi(2) test, P = 0.008), and \nmetastasis-related\
      \ death (log rank analysis, P = 0.0003)."
    explanation: Names epithelioid cytomorphology directly and ties it statistically
      to monosomy 3 and to metastasis-related death - exactly the association claimed
      here.
  - reference: PMID:12601021
    reference_title: 'Monosomy 3 in uveal melanoma: correlation with clinical and histologic
      predictors of survival.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of monosomy 3 is predictable \nonly in patients who have\
      \ small, spindle-cell tumors."
    explanation: The converse observation - spindle-cell morphology marks the
      favourable, disomy-3 end of the cell-type spectrum described here.

genetic:
- name: GNAQ
  gene_term:
    preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating somatic driver mutation (Q209, less often R183)
  subtype: Uveal Melanoma
  notes: >-
    Initiating oncogenic driver of uveal melanoma, mutated in roughly 45% of
    primary tumours and mutually exclusive with GNA11. Q209L/Q209P abolish
    intrinsic GTPase activity, locking Gq alpha in its active GTP-bound state.
  evidence:
  - reference: PMID:19078957
    reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
      naevi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report frequent somatic mutations in the heterotrimeric G \n\
      protein alpha-subunit, GNAQ, in blue naevi (83%) and ocular melanoma of the\
      \ uvea \n(46%)."
    explanation: Reports the somatic GNAQ mutation frequency in uveal ocular melanoma.
- name: GNA11
  gene_term:
    preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating somatic driver mutation (Q209, less often R183)
  subtype: Uveal Melanoma
  notes: >-
    Paralogue of GNAQ and functionally equivalent driver, mutated in about 32%
    of primary uveal melanomas but 57% of uveal melanoma metastases - the
    enrichment in metastases is the inverse of GNAQ and suggests GNA11-mutant
    tumours are the more aggressive of the two.
  evidence:
  - reference: PMID:21083380
    reference_title: Mutations in GNA11 in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations affecting Q209 in GNA11 were present in 7% of blue nevi, 32%\
      \ of \nprimary uveal melanomas, and 57% of uveal melanoma metastases."
    explanation: Gives the GNA11 mutation frequencies in primary and metastatic uveal
      melanoma described in the notes.
- name: BAP1
  gene_term:
    preferred_term: BAP1
    term:
      id: hgnc:950
      label: BAP1
  relationship_type: SOMATIC_DRIVER
  variant_origin: GERMLINE_AND_SOMATIC
  association: Tumour suppressor loss (biallelic, usually with monosomy 3)
  subtype: Uveal Melanoma
  notes: >-
    The dominant prognostic gene in uveal melanoma. Somatic inactivation with
    monosomy 3 defines the class-2, high-metastatic-risk phenotype. A minority
    of patients carry a germline BAP1 pathogenic variant, constituting BAP1
    tumour-predisposition syndrome (uveal melanoma, mesothelioma, cutaneous
    melanoma, clear-cell renal carcinoma), which warrants genetic counselling
    and cascade testing.
  evidence:
  - reference: PMID:21051595
    reference_title: Frequent mutation of BAP1 in metastasizing uveal melanomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One tumor harbored a frameshift mutation that was germline in origin,\
      \ thus \nrepresenting a susceptibility allele."
    explanation: Documents both the somatic and the germline (susceptibility) origin
      of BAP1 inactivation recorded here.
- name: SF3B1
  gene_term:
    preferred_term: SF3B1
    term:
      id: hgnc:10768
      label: SF3B1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Hotspot splicing-factor mutation (predominantly Arg625)
  subtype: Uveal Melanoma
  notes: >-
    Occurs in roughly 20-25% of uveal melanomas, largely in disomy-3 tumours,
    and marks an intermediate-risk class characterised by late relapse.
  evidence:
  - reference: PMID:23313955
    reference_title: Recurrent mutations at codon 625 of the splicing factor SF3B1
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, uveal melanoma is among a small group of \ncancers associated\
      \ with SF3B1 mutations, and these mutations denote a distinct \nmolecular subset\
      \ of uveal melanomas."
    explanation: Establishes SF3B1 mutation as defining a distinct molecular subset
      of uveal melanoma.
- name: EIF1AX
  gene_term:
    preferred_term: EIF1AX
    term:
      id: hgnc:3250
      label: EIF1AX
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: N-terminal in-frame translation-initiation-factor mutation
  subtype: Uveal Melanoma
  notes: >-
    Marks the lowest-risk uveal melanoma class; nearly always found in disomy-3
    tumours and essentially mutually exclusive with BAP1 loss.
  evidence:
  - reference: PMID:23793026
    reference_title: Exome sequencing identifies recurrent somatic mutations in EIF1AX
      and SF3B1 in uveal melanoma with disomy 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted resequencing showed that 24 of 31 tumors with disomy 3 (77%)\
      \ had mutations in \neither EIF1AX (15; 48%) or SF3B1 (9; 29%)."
    explanation: Quantifies EIF1AX mutation within the disomy-3, low-risk class.
- name: CYSLTR2
  gene_term:
    preferred_term: CYSLTR2
    term:
      id: hgnc:18274
      label: CYSLTR2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating receptor mutation (p.Leu129Gln) in GNAQ/GNA11-wild-type
    tumours
  subtype: Uveal Melanoma
  notes: >-
    Alternative initiating driver in roughly 2-4% of uveal melanomas, acting one
    step upstream of Gq by constitutively activating the cysteinyl leukotriene
    receptor 2 that couples to it.
  evidence:
  - reference: PMID:27089179
    reference_title: Recurrent activating mutations of G-protein-coupled receptor CYSLTR2
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed genomics data from 136 uveal \nmelanoma samples and found\
      \ a recurrent mutation in CYSLTR2 (cysteinyl \nleukotriene receptor 2) encoding\
      \ a p.Leu129Gln substitution in 4 of 9 samples \nthat lacked mutations in GNAQ,\
      \ GNA11, and PLCB4 but in 0 of 127 samples that \nharbored mutations in these\
      \ genes."
    explanation: The discovery paper, giving the exact p.Leu129Gln substitution, the
      restriction to GNAQ/GNA11/PLCB4-wild-type tumours, and the mutual exclusivity
      asserted here.
  - reference: PMID:27089179
    reference_title: Recurrent activating mutations of G-protein-coupled receptor CYSLTR2
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Leu129Gln CysLT2R mutant protein \nconstitutively activates endogenous\
      \ Gαq and is unresponsive to stimulation by \nleukotriene."
    explanation: Establishes the activating, receptor-level mechanism acting upstream
      of Gq that this entry describes.
- name: PLCB4
  gene_term:
    preferred_term: PLCB4
    term:
      id: hgnc:9059
      label: PLCB4
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating mutation (p.Asp630Tyr) in GNAQ/GNA11-wild-type tumours
  subtype: Uveal Melanoma
  notes: >-
    Rare (about 2.5%) initiating driver acting immediately downstream of Gq, at
    the phospholipase C-beta step; mutually exclusive with GNAQ/GNA11 and
    CYSLTR2 mutations.
  evidence:
  - reference: PMID:26683228
    reference_title: Deep sequencing of uveal melanoma identifies a recurrent mutation
      in PLCB4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a recurrent mutation in PLCB4 (c.G1888T, p.D630Y, NM_000933),\
      \ which was \nvalidated using Sanger sequencing."
    explanation: The discovery paper, giving the exact p.Asp630Tyr hotspot asserted
      here.
  - reference: PMID:26683228
    reference_title: Deep sequencing of uveal melanoma identifies a recurrent mutation
      in PLCB4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLCB4 p.D630Y mutations are mutually exclusive with \nmutations in GNA11\
      \ and GNAQ, consistent with PLCB4 being the canonical \ndownstream target of\
      \ the former gene products."
    explanation: Establishes both the mutual exclusivity with GNAQ/GNA11 and PLCB4's
      position immediately downstream of Gq, exactly as described here.
- name: BRAF
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating somatic driver mutation (V600E) in conjunctival melanoma
  subtype: Conjunctival Melanoma
  notes: >-
    Present in roughly a quarter to a third of conjunctival melanomas and
    essentially absent from uveal melanoma. Associated with recurrence and
    systemic dissemination, and the rationale for BRAF/MEK-directed therapy in
    unresectable conjunctival disease.
  evidence:
  - reference: PMID:35544941
    reference_title: 'BRAF and NRAS prognostic values in conjunctival melanoma: analysis
      and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRAF V600E \nmutation was observed in three biopsies (25%), similar\
      \ to NRAS Q61X (25%). \nRecurrences occurred in all patients with positive BRAF\
      \ or NRAS mutation"
    explanation: Reports BRAF V600E frequency and its association with recurrence
      in a conjunctival melanoma series.
- name: NRAS
  gene_term:
    preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating somatic driver mutation (Q61) in conjunctival melanoma
  subtype: Conjunctival Melanoma
  notes: >-
    Present in a similar fraction of conjunctival melanomas to BRAF and, like
    BRAF, associated with recurrence and systemic dissemination. NRAS-mutant
    conjunctival melanoma may carry the greater metastatic risk of the two.
  evidence:
  - reference: PMID:35544941
    reference_title: 'BRAF and NRAS prognostic values in conjunctival melanoma: analysis
      and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRAF and NRAS mutations may be risk factors for recurrence and \nshorter\
      \ survival in conjunctival melanoma, which would make these patients \ncandidates\
      \ for targeted therapies"
    explanation: Supports NRAS as an adverse prognostic driver and a targeted-therapy
      indication in conjunctival melanoma.
- name: NF1
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Loss-of-function mutation in conjunctival melanoma (cutaneous-like
    triple-wild-type arm)
  subtype: Conjunctival Melanoma
  notes: >-
    Completes the cutaneous-melanoma-style BRAF/NRAS/NF1 driver trichotomy in
    conjunctival melanoma. NF1 loss de-represses RAS and activates MAPK
    signalling in BRAF/NRAS-wild-type tumours.
  evidence:
  - reference: PMID:41097064
    reference_title: 'Ocular Melanoma: A Comprehensive Review with a Focus on Molecular
      Biology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: commonly involving BRAF, NRAS, NF1, and TERT promoter mutations.
    explanation: Names NF1 among the recurrent conjunctival melanoma drivers.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Promoter mutation (UV-signature) in conjunctival melanoma
  subtype: Conjunctival Melanoma
  notes: >-
    TERT promoter mutations reactivate telomerase and are a UV-signature
    hallmark shared with cutaneous melanoma; they are not a feature of uveal
    melanoma.
  evidence:
  - reference: PMID:34015548
    reference_title: 'Conjunctival melanoma: New insights in tumour genetics and immunology,
      leading to new therapeutic options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CoM is characterized by mutations that have also been identified in\
      \ \ncutaneous melanoma, e.g. in BRAF, NRAS and TERT."
    explanation: Names TERT among the cutaneous-like conjunctival melanoma mutations.
  - reference: PMID:34071371
    reference_title: Molecular Genetics of Conjunctival Melanoma and Prognostic Value
      of TERT Promoter Mutation Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TERT promoter mutations were most common (54%), but BRAF (46%), NRAS\
      \ (21%), BAP1 \n(18%), PTEN (14%), c-KIT (7%), and SF3B1 (4%) mutations were\
      \ also observed. No \nmutations in GNAQ, GNA11, and EIF1AX were found."
    explanation: The single strongest statement of this entry's central divergence
      thesis - conjunctival melanoma carries the cutaneous driver set and, critically,
      NO mutations in GNAQ, GNA11 or EIF1AX, the genes that define the uveal arm.

inheritance:
- name: BAP1 Tumor Predisposition Syndrome (germline BAP1)
  description: >-
    Most ocular melanoma is sporadic, but a minority of uveal melanoma arises in
    BAP1 tumour predisposition syndrome, an autosomal dominant cancer
    predisposition caused by a heterozygous germline BAP1 pathogenic variant.
    Uveal melanoma is its commonest associated cancer, ahead of malignant
    mesothelioma, cutaneous melanoma and renal cell carcinoma, and BAP1-related
    uveal melanoma behaves as an aggressive class-2 tumour. Germline testing is
    warranted for young-onset, bilateral or multifocal disease, or a personal or
    family history of the syndrome's other tumours; carriers need annual dilated
    eye examinations from age 11-18 years.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BAP1 tumor predisposition syndrome (BAP1-TPDS) is \nassociated with an\
      \ increased risk for a specific skin lesion, BAP1-inactivated \nmelanocytic tumors\
      \ (BIMT; formerly called atypical Spitz tumors), and the \nfollowing cancers,\
      \ in descending order of frequency: uveal (eye) melanoma (UM), \nmalignant mesothelioma\
      \ (MMe), cutaneous melanoma (CM), renal cell carcinoma"
    explanation: GeneReviews establishes uveal melanoma as the commonest cancer of
      BAP1-TPDS and the syndrome's tumour spectrum.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of BAP1-TPDS is established in a proband by \nidentification\
      \ of a heterozygous germline pathogenic variant in BAP1 on \nmolecular genetic\
      \ testing."
    explanation: Confirms the heterozygous germline mechanism underlying the autosomal
      dominant inheritance asserted here.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The penetrance, natural history, \nlife-time cancer risk for carriers,\
      \ and frequencies of BAP1-associated tumors \nare yet to be fully determined."
    explanation: Supports recording penetrance as INCOMPLETE/undetermined rather than
      asserting a figure.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GENETIC COUNSELING: BAP1-TPDS is inherited in an autosomal dominant manner.\
      \ Most \nindividuals diagnosed with BAP1-TPDS have an affected parent (an affected\
      \ parent \nmay have BAP1-related tumors that differ from those of the proband).\
      \ Some \nindividuals have BAP1-TPDS as the result of a de novo pathogenic variant."
    explanation: GeneReviews Genetic Counseling section establishing the autosomal
      dominant mode, the usual affected parent, and the de novo route asserted here.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each \nchild of an individual with BAP1-TPDS has a 50% chance of inheriting\
      \ the BAP1 \npathogenic variant."
    explanation: The 50% transmission risk that underpins the cascade-testing
      recommendation described here.

environmental:
- name: Ultraviolet Radiation Exposure
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  influences_mechanisms:
  - target: UV-Associated BRAF/NRAS/NF1 Driver Activation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Pointed only at the conjunctival arm, and this restraint is the whole
      point of the link. This entry warns explicitly that the ultraviolet role
      differs between the two ocular compartments and should not be flattened
      into a single claim: the conjunctiva is a sun-exposed surface carrying
      cutaneous-type drivers, while the choroid is sun-shielded and its
      dominant driver site shows no ultraviolet signature. No edge is drawn
      into the uveal arm for that reason, even though one of the cited items
      reports an ultraviolet-type signature at a minority uveal site. Every
      item here is partial, which is worth stating rather than leaving to the
      grades: no source available to this entry attributes conjunctival
      melanoma to ultraviolet light in unhedged terms. The directness of the
      link rests on the node naming ultraviolet exposure in its own title, not
      on the strength of any single sentence.
    evidence:
    - reference: PMID:41097064
      reference_title: "Ocular Melanoma: A Comprehensive Review with a Focus on Molecular Biology."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Conversely, conjunctival and eyelid melanoma exhibits greater molecular similarity to cutaneous melanoma, commonly involving BRAF, NRAS, NF1, and TERT promoter mutations."
      explanation: >-
        Reports that conjunctival melanoma resembles cutaneous melanoma
        molecularly, commonly involving BRAF, NRAS, NF1 and TERT promoter
        mutations. That driver set is this node, but the sentence never
        mentions ultraviolet light, so it establishes what the node contains
        and not that this exposure produces it.
    - reference: PMID:29802540
      reference_title: "Conjunctival Melanoma - Epidemiological Trends and Features."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In recent decades the incidence of uveal melanoma has been relatively stable whilst conjunctival and cutaneous melanoma have shown increasing incidence which may be connected to the result of environmental exposure to ultraviolet light."
      explanation: >-
        The one sentence available that attributes conjunctival melanoma to
        ultraviolet exposure rather than describing its drivers. It carries
        the asymmetry this entry insists on as well, holding uveal incidence
        stable while conjunctival incidence rises. Partial because the
        attribution is hedged as may be connected, which is the strongest
        wording any source here offers.
    - reference: PMID:21083380
      reference_title: "Mutations in GNA11 in uveal melanoma."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "These alterations are characteristic mutational patterns induced by ultraviolet light23,24 and are found with markedly increased frequency in cutaneous melanomas arising on sun-exposed skin."
      explanation: >-
        Identifies the alterations as mutational patterns induced by
        ultraviolet light and enriched in sun-exposed cutaneous melanoma. It
        supplies the ultraviolet attribution, but at a minority uveal site
        rather than in the conjunctival tumours this link concerns.
  presence: PRESENT
  description: >-
    Ultraviolet exposure is a credible aetiological factor for conjunctival
    melanoma, which is an ocular-surface tumour carrying a UV mutational
    signature and cutaneous-type drivers. Its role in posterior uveal melanoma
    is far weaker and contested: the choroid is sun-shielded, uveal melanoma has
    a low mutational burden without a dominant UV signature, and the R183
    mutations that do show C-to-T transitions are a small minority of drivers.
    This asymmetry should not be flattened into a single "UV causes ocular
    melanoma" claim.
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:21083380
    reference_title: Mutations in GNA11 in uveal melanoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These alterations are characteristic mutational patterns induced by\
      \ \nultraviolet light23,24 and are found with markedly increased frequency in\
      \ \ncutaneous melanomas arising on sun-exposed skin."
    explanation: Shows a UV-type signature at the minority R183 site in uveal melanoma
      while the dominant Q209 site lacks it, supporting the partial and site-restricted
      UV contribution described here.
  - reference: PMID:41097064
    reference_title: 'Ocular Melanoma: A Comprehensive Review with a Focus on Molecular
      Biology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, conjunctival and\neyelid melanoma exhibits greater molecular\
      \ similarity to cutaneous melanoma,\ncommonly involving BRAF, NRAS, NF1, and\
      \ TERT promoter mutations."
    explanation: The cutaneous-like driver landscape of conjunctival melanoma is the
      molecular correlate of its UV aetiology.
- name: Arc Welding Exposure
  exposure_term:
    preferred_term: exposure to welding fume
    term:
      id: ECTO:7000129
      label: exposure to welding fume
  influences_mechanisms:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The weakest of the three links in this entry, and graded to say so. The
      only available evidence is a GeneReviews prevention line addressed to
      carriers of a germline predisposition, not a general-population effect
      estimate, and this entry's own description records the association as
      reported rather than established. The link is drawn because avoidance
      advice is actionable in that population, not because a route to the node
      is known.
    evidence:
    - reference: PMID:27748099
      reference_title: "BAP1 Tumor Predisposition Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Prevention of primary manifestations: UM: avoid arc-welding."
      explanation: >-
        GeneReviews names arc welding as an exposure to avoid for primary
        prevention in carriers of the predisposition syndrome. A
        recommendation for a defined group, with no effect estimate and no
        mechanism.
  presence: PRESENT
  description: >-
    Occupational arc-welding exposure is a reported but not firmly established
    risk association for uveal melanoma. It is included here because GeneReviews
    lists avoidance of arc welding as an explicit primary-prevention measure for
    germline BAP1 carriers, making it actionable in that population even though
    causality in the general population remains uncertain.
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of primary manifestations: UM: avoid arc-welding."
    explanation: GeneReviews Agents/Circumstances to Avoid guidance naming arc welding
      as a uveal melanoma exposure to avoid in BAP1-TPDS.
- name: Oculodermal Melanocytosis (Nevus of Ota)
  influences_mechanisms:
  - target: Gq/G11 Alpha Subunit Activating Mutation
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Recorded as direct because the lesion already carries the node's own
      mutation: the cited study identifies the same G-protein alpha subunit
      gene in nevus of Ota and in uveal melanoma and calls it the genetic link
      between them. Recorded as predisposing rather than triggering because
      the same sentence puts progression at about one in four hundred, so
      sharing the initiating lesion is a long way from developing the tumour.
    evidence:
    - reference: PMID:19078957
      reference_title: "Frequent somatic mutations of GNAQ in uveal melanoma and blue naevi."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings identify GNAQ as a genetic link between nevus of Ota and uveal melanoma and help explain why nevi of Ota are a risk factor for uveal melanoma7. The risk is small, as only about 1 in 400 nevi of Ota progress to uveal melanoma"
      explanation: >-
        Names the shared gene as the genetic link between the naevus and the
        melanoma, which is this node, and quantifies the small absolute
        progression risk in the same breath.
  presence: PRESENT
  description: >-
    Congenital oculodermal melanocytosis is an established host risk factor for
    uveal melanoma. It shares the same initiating lesion - nevus of Ota carries
    somatic GNAQ mutations - providing a genetic link between the benign
    melanocytic proliferation and the malignancy that occasionally arises in it.
    Absolute risk remains low (of the order of 1 in 400).
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:19078957
    reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
      naevi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings identify GNAQ as a genetic link between nevus of Ota and
      uveal melanoma and help explain why nevi of Ota are a risk factor for uveal
      melanoma7. The risk is small, as only about 1 in 400 nevi of Ota progress to
      uveal melanoma
    explanation: Directly establishes nevus of Ota as a uveal melanoma risk factor
      and quantifies the small absolute risk.

treatments:
- name: Plaque Brachytherapy
  description: >-
    Episcleral radioactive plaque (typically iodine-125 or ruthenium-106)
    sutured over the tumour base. The globe-preserving first-line local therapy
    for most small and medium uveal melanomas, achieving high local control.
    Radiation retinopathy, maculopathy, optic neuropathy, cataract and
    neovascular glaucoma are the principal late toxicities. Local control does
    not reduce metastatic risk, because dissemination generally predates
    treatment.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: episcleral plaque brachytherapy
    term:
      id: NCIT:C15195
      label: Brachytherapy
  target_mechanisms:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    treatment_effect: INHIBITS
    description: >-
      Ionising radiation delivered to the tumour base ablates the transformed
      uveal melanocyte clone while preserving the globe.
  evidence:
  - reference: PMID:29765944
    reference_title: 'Uveal Melanoma: 5-Year Update on Incidence, Treatment, and Survival
      (SEER 1973-2013).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A corresponding increase \nwas observed in radiation as primary treatment\
      \ selection (1.3% from 1973 to 1975 \nvs. 68.3% from 2012 to 2013)."
    explanation: Documents radiotherapy displacing surgery as the primary local treatment
      for uveal melanoma in the United States.
  notes: >-
    The SEER analysis also shows that this shift to globe-preserving radiation
    did not improve five-year relative survival, which is the clearest available
    demonstration that local therapy choice does not alter metastatic outcome.
- name: Proton Beam Radiotherapy
  description: >-
    Charged-particle external-beam radiotherapy delivering a sharply conformal
    dose via the Bragg peak. Used for tumours unsuitable for plaque
    brachytherapy - large tumours, juxtapapillary or macular locations - with
    comparable local control.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: proton beam radiation therapy
    term:
      id: NCIT:C66897
      label: Proton Beam Radiation Therapy
  target_mechanisms:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    treatment_effect: INHIBITS
    description: >-
      Conformal charged-particle irradiation ablates the intraocular tumour with
      a steep dose fall-off that spares adjacent critical ocular structures.
  evidence:
  - reference: PMID:39456591
    reference_title: Proton Therapy in Uveal Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proton therapy offers significant \nadvantages for thicker uveal melanomas\
      \ (over 8 mm) due to its unique physical \nproperties, including a rapid dose\
      \ fall-off that protects critical structures \nlike the retina and optic nerve."
    explanation: Documents the Bragg-peak dose fall-off and the specific indication
      for thicker tumours and optic-nerve proximity described in this treatment.
- name: Enucleation
  description: >-
    Surgical removal of the globe. Reserved for very large tumours, extensive
    ciliary-body or optic-nerve involvement, extrascleral extension, or a blind
    painful eye. Excellent local control at the cost of the eye, and - as the
    SEER-era data show - without a corresponding survival advantage over
    globe-preserving radiotherapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: eye enucleation
    term:
      id: NCIT:C198837
      label: Eye Enucleation
  target_mechanisms:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    treatment_effect: INHIBITS
    description: >-
      Removal of the globe physically eliminates the intraocular tumour.
  evidence:
  - reference: PMID:29765944
    reference_title: 'Uveal Melanoma: 5-Year Update on Incidence, Treatment, and Survival
      (SEER 1973-2013).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a decline in patients treated with surgery alone \n(94.2%\
      \ from 1973 to 1975 vs. 24.7% from 2012 to 2013)."
    explanation: Documents the historical role of enucleation and its decline as globe-preserving
      options matured.
- name: Tebentafusp
  description: >-
    A gp100 x CD3 bispecific ImmTAC (immune-mobilising monoclonal T-cell
    receptor against cancer): an affinity-enhanced soluble T-cell receptor that
    binds the gp100 peptide-HLA-A*02:01 complex on melanoma cells, fused to an
    anti-CD3 arm that recruits polyclonal T cells to kill them. The first and
    only systemic agent with a randomised overall-survival benefit in metastatic
    uveal melanoma, sustained at three years. Restricted to HLA-A*02:01-positive
    patients (roughly half). Toxicity is dominated by early, self-limiting
    cytokine-mediated events and by on-target attack on normal melanocytes -
    rash in 83%, pyrexia in 76%, pruritus in 70% - but discontinuation for
    toxicity is rare (2%).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tebentafusp
      term:
        id: NCIT:C94208
        label: Tebentafusp
  target_mechanisms:
  - target: gp100-Directed T-Cell Redirection
    treatment_effect: ACTIVATES
    description: >-
      Tebentafusp is the agent that instantiates this mechanism, bridging the
      gp100-HLA-A*02:01 complex on tumour cells to CD3 on polyclonal T cells.
  - target: Hepatic Metastatic Colonisation
    treatment_effect: INHIBITS
    description: >-
      Redirected T-cell killing of gp100-positive metastatic deposits is the
      route by which tebentafusp prolongs survival in liver-dominant disease.
  evidence:
  - reference: PMID:34551229
    reference_title: Overall Survival Benefit with Tebentafusp in Metastatic Uveal
      Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: Treatment with tebentafusp resulted in longer overall survival\
      \ than \nthe control therapy among previously untreated patients with metastatic\
      \ uveal \nmelanoma."
    explanation: The pivotal randomised phase 3 conclusion establishing tebentafusp's
      survival benefit.
  - reference: PMID:37870955
    reference_title: Three-Year Overall Survival with Tebentafusp in Metastatic Uveal
      Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common treatment-related adverse events of any grade in the\
      \ tebentafusp group were rash (83%), pyrexia (76%), pruritus \n(70%), and hypotension\
      \ (38%)."
    explanation: Documents the characteristic toxicity profile described here.
- name: Immune Checkpoint Blockade
  description: >-
    Anti-PD-1 (pembrolizumab, nivolumab) and anti-CTLA-4 (ipilimumab)
    antibodies, alone or combined. Included here specifically to record a
    negative result: despite transforming cutaneous melanoma, checkpoint
    blockade has only marginal activity in metastatic uveal melanoma, because
    the tumour's low mutational burden yields few neoantigens and the ocular
    microenvironment is immune-privileged. It remains a fallback when
    tebentafusp is unavailable or the patient is not HLA-A*02:01-positive, and
    is a more rational option in conjunctival melanoma, whose immunobiology
    resembles cutaneous melanoma.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
    - preferred_term: ipilimumab
      term:
        id: NCIT:C2654
        label: Ipilimumab
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
  target_mechanisms:
  - target: Low Tumour Mutational Burden and Checkpoint Refractoriness
    treatment_effect: MODULATES
    description: >-
      Checkpoint blockade acts on this node but is largely defeated by it:
      relieving PD-1/CTLA-4 inhibition cannot generate a response when few
      neoantigens are presented in the first place.
  evidence:
  - reference: PMID:34551229
    reference_title: Overall Survival Benefit with Tebentafusp in Metastatic Uveal
      Melanoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this open-label, phase 3 trial, we randomly assigned previously untreated\
      \ HLA-A*02:01-positive patients with metastatic uveal melanoma in a 2:1 \nratio\
      \ to receive tebentafusp (tebentafusp group) or the investigator's choice of\
      \ \ntherapy with single-agent pembrolizumab, ipilimumab, or dacarbazine (control\
      \ \ngroup)"
    explanation: Checkpoint inhibitors constituted the comparator arm that tebentafusp
      outperformed, quantifying their limited benefit in metastatic uveal melanoma.
  - reference: PMID:34015548
    reference_title: 'Conjunctival melanoma: New insights in tumour genetics and immunology,
      leading to new therapeutic options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While immunotherapy is currently sparsely effective in \nintraocular\
      \ tumours such as UM, the similarities between CoM and cutaneous \nmelanoma\
      \ (including in their immunological tumour micro environment) provide \nhope\
      \ for the application of immunotherapy in CoM"
    explanation: Directly supports both halves of this treatment's framing - checkpoint
      blockade is sparsely effective in uveal disease but rational in conjunctival
      melanoma.
- name: Wide Local Excision with Adjuvant Cryotherapy
  description: >-
    The standard local treatment for conjunctival melanoma: a "no-touch"
    complete excision with wide margins and careful specimen orientation,
    combined with cryotherapy to the conjunctival margins to eradicate residual
    atypical intraepithelial melanocytes. Adjuvant topical mitomycin C or
    interferon, plaque or proton radiotherapy, and - for orbital invasion -
    exenteration are added according to margin status, multifocality and depth
    of invasion. Recurrence remains common because the precursor lesion is a
    field rather than a discrete mass.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: excision with adjuvant margin cryosurgery
    term:
      id: NCIT:C15215
      label: Cryosurgery
  target_mechanisms:
  - target: Conjunctival Melanocytic Intraepithelial Neoplasia
    treatment_effect: INHIBITS
    description: >-
      Margin cryotherapy ablates residual atypical intraepithelial melanocytes,
      addressing the precursor field that drives recurrence.
  - target: UV-Associated BRAF/NRAS/NF1 Driver Activation
    treatment_effect: INHIBITS
    description: >-
      Complete no-touch excision physically removes the invasive driver-mutant
      clone.
  evidence:
  - reference: PMID:39335093
    reference_title: 'Conjunctival Melanoma: A Clinical Review and Update.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to its rarity, there is limited \nevidence for diagnosis and management;\
      \ hence, there is no standardised treatment \nand not all cases are referred\
      \ to a specialised ocular oncology centre."
    explanation: Records the important caveat that conjunctival melanoma management
      is not standardised and rests on limited evidence, which is why this treatment
      is curated as PARTIAL.
- name: Percutaneous Hepatic Perfusion with Melphalan
  description: >-
    Liver-directed regional chemotherapy: melphalan is infused into the hepatic
    artery while hepatic venous effluent is captured and filtered
    extracorporeally, delivering a hepatic dose far above what systemic
    administration would tolerate. This is the therapeutic answer to the
    hepatotropism modelled in this entry - the liver is the dominant and often
    only metastatic site, so treating it regionally is disease-appropriate rather
    than palliative. In a randomised study against best alternative care, all
    efficacy endpoints favoured melphalan/hepatic delivery system, though the
    trial converted to a single-arm design because of slow accrual and its
    comparative analyses are therefore exploratory. Other liver-directed options
    used in practice include resection or ablation of oligometastatic disease,
    and chemo-, radio- or immunoembolization.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: percutaneous hepatic perfusion
    term:
      id: NCIT:C148433
      label: Percutaneous Hepatic Perfusion
    therapeutic_agent:
    - preferred_term: melphalan
      term:
        id: CHEBI:28876
        label: melphalan
  target_mechanisms:
  - target: Hepatic Metastatic Colonisation
    treatment_effect: INHIBITS
    description: >-
      Regional high-dose chemotherapy is delivered to the hepatic niche in which
      metastatic uveal melanoma colonises and grows.
  evidence:
  - reference: PMID:40192993
    reference_title: An Open-label, Randomized Study of Melphalan/Hepatic Delivery System
      Versus Best Alternative Care in Patients with Unresectable Metastatic Uveal Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Melphalan/Hepatic Delivery System (Melphalan/HDS) is a drug/medical device\
      \ combination used for \nliver-directed treatment of unresectable mUM patients."
    explanation: Identifies the liver-directed modality curated here and its indication
      in unresectable metastatic uveal melanoma.
  - reference: PMID:40192993
    reference_title: An Open-label, Randomized Study of Melphalan/Hepatic Delivery System
      Versus Best Alternative Care in Patients with Unresectable Metastatic Uveal Melanoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Exploratory analyses of \nefficacy endpoints showed numerical differences\
      \ consistently favoring the \nMelphalan/HDS arm versus BAC (median overall survival:\
      \ 18.5 vs. 14.5 months; \nmedian progression-free survival: 9.1 vs. 3.3 months;\
      \ objective response rate: \n27.5% vs. 9.4%; and disease control rate: 80.0% vs.\
      \ 46.9%)."
    explanation: Gives the efficacy signal. Marked PARTIAL because the trial was
      amended to a single-arm design and the authors themselves designate these
      comparisons exploratory rather than confirmatory.
  notes: >-
    Only percutaneous hepatic perfusion is curated as a discrete treatment because
    it is the liver-directed modality with randomised comparative data. Resection
    or ablation of oligometastatic disease, chemoembolization, radioembolization
    and immunoembolization are all used in practice but are supported here only by
    the deep-research narrative, so they are described rather than asserted.
- name: BAP1 Carrier Ocular Surveillance and Genetic Counselling
  description: >-
    For individuals with a germline BAP1 pathogenic variant, GeneReviews
    recommends annual dilated eye examination from age 11-18 years (or puberty)
    with referral to an ocular oncologist for any pigmented lesion, alongside
    cascade genetic testing of at-risk relatives once a familial variant is
    known. Because BAP1-related uveal melanoma behaves like a class-2 /
    monosomy-3 tumour, treatment of a detected tumour should follow the more
    aggressive pathway rather than being de-escalated for early detection.
    This is a surveillance and counselling intervention, not a mechanism-directed
    therapy, so it deliberately carries no target_mechanisms link.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UM: \nannual dilated eye examinations beginning at age 11-18 years or\
      \ at puberty with \nreferral to ocular oncologist for any pigmented lesions."
    explanation: GeneReviews surveillance recommendation for uveal melanoma in BAP1
      carriers, as described here.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UM treatment should be the same as the more \naggressive class 2 or monosomy\
      \ 3 tumors because of the increased aggressiveness \nof BAP1-related UM."
    explanation: GeneReviews management guidance that BAP1-related uveal melanoma be
      treated as aggressive class-2 disease, exactly as stated here.
  - reference: PMID:27748099
    reference_title: BAP1 Tumor Predisposition Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once a germline BAP1 pathogenic variant has been identified \nin an affected\
      \ family member, predictive testing for at-risk family members and \nprenatal and\
      \ preimplantation genetic testing are possible."
    explanation: Supports the cascade-testing component of this intervention.
- name: Darovasertib
  description: >-
    An oral selective protein kinase C inhibitor targeting the PKC node
    immediately downstream of mutant Gq/G11 - the most direct available
    pharmacological attack on the initiating lesion of uveal melanoma. In
    phase 2 neoadjuvant/adjuvant evaluation for localised disease
    (NCT05907954), with endpoints including tumour shrinkage, conversion from
    enucleation to radiation, and metastasis-free survival. Investigational;
    not standard of care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: darovasertib
      term:
        id: NCIT:C124796
        label: Darovasertib
  target_mechanisms:
  - target: PLC-beta/PKC/MAPK Cascade Activation
    treatment_effect: INHIBITS
    description: >-
      Selective PKC inhibition interrupts the cascade at the step immediately
      downstream of the constitutively active Gq/G11 alpha subunit.
  evidence:
  - reference: clinicaltrials:NCT05907954
    reference_title: (Neo)Adjuvant IDE196 (Darovasertib) in Patients With Localized
      Ocular Melanoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neoadjuvant/adjuvant IDE196 (darovasertib) in patients with primary uveal
      melanoma
    explanation: Names darovasertib specifically and its neoadjuvant/adjuvant use in
      primary uveal melanoma, replacing an earlier generic pathway-inhibitor quote
      that did not mention the drug.

clinical_trials:
- name: NCT03070392
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    IMCgp100-202: randomised open-label phase 3 trial of tebentafusp versus
    investigator's choice (pembrolizumab, ipilimumab or dacarbazine) in
    previously untreated HLA-A*02:01-positive metastatic uveal melanoma. The
    trial that established the first overall-survival benefit in this disease.
    Curated as PHASE_III on the strength of the NEJM report ("In this open-label,
    phase 3 trial"); note that the ClinicalTrials.gov registered title still reads
    "A Phase II Randomized, Open-label, Multi-center Study", a legacy of an earlier
    protocol version.
  target_phenotypes:
  - preferred_term: Uveal melanoma
    term:
      id: HP:0007716
      label: Uveal melanoma
  - preferred_term: Neoplasm of the liver
    term:
      id: HP:0002896
      label: Neoplasm of the liver
  evidence:

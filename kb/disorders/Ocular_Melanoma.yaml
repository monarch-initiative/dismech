pathophysiology:
- name: Gq/G11 Alpha Subunit Activating Mutation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion of uveal melanoma is a somatic activating mutation in
    the heterotrimeric G-protein alpha subunits GNAQ or GNA11, occurring almost
    always at Q209 (in the Ras-like domain, the residue essential for GTP
    hydrolysis) and less often at R183. Loss of intrinsic GTPase activity locks
    the alpha subunit in its GTP-bound, constitutively active state, turning it
    into a dominant-acting oncogene. GNAQ and GNA11 mutations are mutually
    exclusive and together account for roughly 83% of primary uveal melanomas;
    the rare GNAQ/GNA11-wild-type tumours instead carry activating CYSLTR2
    p.Leu129 or PLCB4 p.Asp630 mutations, which enter the same pathway one step
    above or below. These are early events, present already in benign uveal
    naevi, and are not themselves prognostic.
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  cell_types:
  - preferred_term: choroidal melanocyte
    term:
      id: CL:4030000
      label: choroidal melanocyte
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  biological_processes:
  - preferred_term: phospholipase C-activating G protein-coupled receptor signaling
      pathway
    modifier: INCREASED
    term:
      id: GO:0007200
      label: phospholipase C-activating G protein-coupled receptor signaling pathway
  genes:
  - preferred_term: GNAQ
    term:
      id: hgnc:4390
      label: GNAQ
  - preferred_term: GNA11
    term:
      id: hgnc:4379
      label: GNA11
  - preferred_term: CYSLTR2
    term:
      id: hgnc:18274
      label: CYSLTR2
  - preferred_term: PLCB4
    term:
      id: hgnc:9059
      label: PLCB4
  evidence:
  - reference: PMID:19078957
    reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
      naevi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations occur exclusively in codon 209 in the Ras-like domain\
      \ and \nresult in constitutive activation, turning GNAQ into a dominant acting\
      \ oncogene."
    explanation: Establishes the Q209 mechanism (loss of GTP hydrolysis) and the dominant
      oncogene status of mutant GNAQ.
  - reference: PMID:21083380
    reference_title: Mutations in GNA11 in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the uveal melanomas we analyzed, 83% had somatic mutations in \n\
      GNAQ or GNA11. Constitutive activation of the pathway involving these two genes\
      \ \nappears to be a major contributor to the development of uveal melanoma."
    explanation: Quantifies the combined GNAQ/GNA11 mutation burden and identifies
      constitutive pathway activation as the major initiating contributor.
  downstream:
  - target: PLC-beta/PKC/MAPK Cascade Activation
    description: >-
      Active Gq/G11 stimulates phospholipase C-beta, releasing diacylglycerol
      that activates protein kinase C and thence the RAF-MEK-ERK cascade.
    evidence:
    - reference: PMID:19078957
      reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
        naevi.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Signaling pathways downstream of GNAQ include activation of protein\
        \ kinase C family members via the release of diacylglycerol (DAG) by phospholipase\
        \ Cβ."
      explanation: States the Gq to PLC-beta to DAG to PKC arm of the cascade that
        this edge asserts.
  - target: Hippo-Independent YAP Activation
    description: >-
      Gq alpha additionally signals through a Trio-Rho/Rac circuit to activate
      the transcriptional coactivator YAP, in parallel with and independently of
      the PLC-beta arm.
    evidence:
    - reference: PMID:24882515
      reference_title: Hippo-independent activation of YAP by the GNAQ uveal melanoma
        oncogene through a trio-regulated rho GTPase signaling circuitry.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that Gαq stimulates YAP through a \nTrio-Rho/Rac signaling\
        \ circuitry promoting actin polymerization, independently of \nphospholipase\
        \ Cβ and the canonical Hippo pathway."
      explanation: Directly supports a PLC-beta-independent, Hippo-independent Gq-to-YAP
        edge.

- name: PLC-beta/PKC/MAPK Cascade Activation
  biological_scale: MOLECULAR
  role: central_effector
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
  mechanism_confidence: ESTABLISHED
  description: >-
    Constitutively GTP-bound Gq/G11 activates phospholipase C-beta, generating
    diacylglycerol that activates protein kinase C, which in turn engages the
    RAF-MEK-ERK cascade (with RASGRP3 as an important uveal-melanoma-specific
    link) and the PI3K-AKT-mTOR axis. This is the growth-factor-independent
    mitogenic output of the initiating lesion. Critically, uveal melanomas
    achieve MAPK activation without BRAF or NRAS mutation, which is the
    mechanistic reason cutaneous-melanoma BRAF-directed therapy is inapplicable
    to uveal disease and the rationale for PKC inhibitors such as darovasertib.
  cell_types:
  - preferred_term: choroidal melanocyte
    term:
      id: CL:4030000
      label: choroidal melanocyte
  biological_processes:
  - preferred_term: protein kinase C signaling
    modifier: INCREASED
    term:
      id: GO:0070528
      label: protein kinase C signaling
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  evidence:
  - reference: PMID:19078957
    reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
      naevi.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Uveal melanomas display MAP-kinase activation15, but none of the uveal\
      \ melanomas we examined in our study showed mutations in BRAF or NRAS"
    explanation: Establishes that uveal melanoma has MAPK activation despite lacking
      the BRAF/NRAS mutations that drive cutaneous melanoma, i.e. an alternative route
      into the same cascade.
  downstream:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    description: >-
      Sustained ERK signalling drives cell-cycle entry and anchorage-independent
      growth of uveal melanocytes.
    evidence:
    - reference: PMID:19078957
      reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
        naevi.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In addition, GNAQ knock-down in OMM1.3 cells causes a substantial\
        \ decrease in cell number (Figure 3b), loss of anchorage independent growth\
        \ (Figure 3c) and a marked increase in sub-G0/G1 population (Figure 3d) as\
        \ compared to control cells."
      explanation: Loss-of-function knockdown reverses proliferation and anchorage-independent
        growth, showing the cascade is required for the transformed phenotype.

- name: Hippo-Independent YAP Activation
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  description: >-
    In parallel with the PKC/MAPK arm, oncogenic Gq alpha activates the
    Hippo-pathway transcriptional coactivator YAP through a Trio-Rho/Rac
    GTPase circuit that promotes actin polymerisation. This activation is
    independent of both phospholipase C-beta and the canonical Hippo kinase
    cascade, and Gq-driven uveal melanoma cell growth is YAP-dependent -
    making YAP/TAZ a distinct therapeutic node from the MAPK arm.
  cell_types:
  - preferred_term: choroidal melanocyte
    term:
      id: CL:4030000
      label: choroidal melanocyte
  biological_processes:
  - preferred_term: Rho protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007266
      label: Rho protein signal transduction
  - preferred_term: actin cytoskeleton organization
    modifier: INCREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:24882515
    reference_title: Hippo-independent activation of YAP by the GNAQ uveal melanoma
      oncogene through a trio-regulated rho GTPase signaling circuitry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we show that Gαq promotes the YAP-dependent growth of uveal\
      \ \nmelanoma cells, thereby identifying YAP as a suitable therapeutic target\
      \ in uveal \nmelanoma, a GNAQ/GNA11-initiated human malignancy."
    explanation: Establishes YAP dependence of Gq-driven uveal melanoma growth and
      its status as a therapeutic node.
  downstream:
  - target: Uveal Melanocyte Transformation and Intraocular Tumour Growth
    description: >-
      YAP-dependent transcriptional programmes contribute to the growth of
      Gq-driven uveal melanoma cells alongside the MAPK arm.
    evidence:
    - reference: PMID:24882515
      reference_title: Hippo-independent activation of YAP by the GNAQ uveal melanoma
        oncogene through a trio-regulated rho GTPase signaling circuitry.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, we show that Gαq promotes the YAP-dependent growth of\
        \ uveal \nmelanoma cells"
      explanation: Directly asserts the YAP-to-growth edge in uveal melanoma cells.

- name: Uveal Melanocyte Transformation and Intraocular Tumour Growth
  biological_scale: TISSUE
  role: central_effector
  conforms_to: sustaining_proliferative_signaling#Growth-Factor-Independent Proliferation
  mechanism_confidence: ESTABLISHED
  description: >-
    Convergent PKC/MAPK and YAP signalling transforms a uveal melanocyte into a
    growth-factor-independent clone that expands as an intraocular mass, most
    often in the choroid (about 90%), less often the ciliary body (about 6-7%) or
    iris (about 3%). Expansion under the retina produces exudation and
    secondary retinal detachment; anterior tumours can distort the iris and
    obstruct aqueous outflow. Because the globe is a closed, non-distensible
    compartment, growth is symptomatic disproportionately early relative to
    tumour bulk - yet up to about 30% of tumours are still asymptomatic at
    diagnosis and are found on routine fundoscopy.
  locations:
  - preferred_term: uvea
    term:
      id: UBERON:0001768
      label: uvea
  cell_types:
  - preferred_term: choroidal melanocyte
    term:
      id: CL:4030000
      label: choroidal melanocyte
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:39200222
    reference_title: 'Uveal Melanoma: Comprehensive Review of Its Pathophysiology,
      Diagnosis, Treatment, and Future Perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Uveal melanoma (UM) is the most common intraocular malignancy in adults.
    explanation: Confirms the intraocular tumour that this node describes is the commonest
      adult intraocular malignancy.
  downstream:
  - target: Uveal Melanoma
    description: >-
      The expanding transformed uveal melanocyte clone is the intraocular
      melanoma itself.
  - target: Reduced Visual Acuity
    description: >-
      Tumour involvement of the macula, exudation, or obstruction of the visual
      axis reduces acuity.
    evidence:
    - reference: PMID:34775516
      reference_title: Vasculogenic mimicry correlates to presenting symptoms and
        mortality in uveal melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thirty-four patients (49%) presented with blurred vision."
      explanation: Blurred vision was the commonest presenting symptom of the intraocular
        tumour, supporting this tumour-growth-to-acuity-loss edge.
  - target: Visual Field Defect
    description: >-
      A tumour mass and its associated serous retinal detachment produce a field
      defect corresponding to the involved retinal sector.
    evidence:
    - reference: PMID:34775516
      reference_title: Vasculogenic mimicry correlates to presenting symptoms and
        mortality in uveal melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In multivariate regression, retinal detachment (RD), presence of VM,\
        \ and PAS density ≥ median were independent predictors of a shadow"
      explanation: Retinal detachment was an independent predictor of the visual-field
        shadow, directly supporting this tumour-and-detachment to field-defect edge.
  - target: Exudative Retinal Detachment
    description: >-
      Subretinal exudation from the tumour surface separates the neurosensory
      retina from the retinal pigment epithelium.
    evidence:
    - reference: PMID:19667335
      reference_title: Metastasis of uveal melanoma millimeter-by-millimeter in 8033
        consecutive eyes.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the presence of subretinal\
        \ fluid, intraocular hemorrhage, or \nextraocular extension"
      explanation: Subretinal fluid is documented as a tumour-associated clinical finding
        in this 8033-eye series, supporting the tumour-to-exudative-detachment edge.
  - target: Photopsia
    description: >-
      Mechanical traction and detachment at the tumour-retina interface produce
      perceived flashes of light.
    evidence:
    - reference: PMID:34775516
      reference_title: Vasculogenic mimicry correlates to presenting symptoms and
        mortality in uveal melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "7 (10%) with \nphotopsia and/or floaters"
      explanation: Photopsia was a documented presenting symptom of the intraocular
        tumour in 10% of patients, supporting this edge.
  - target: Vitreous Floaters
    description: >-
      Tumour-associated vitreous cells, pigment dispersion, or haemorrhage are
      perceived as floaters.
    evidence:
    - reference: PMID:34775516
      reference_title: Vasculogenic mimicry correlates to presenting symptoms and
        mortality in uveal melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "7 (10%) with \nphotopsia and/or floaters"
      explanation: Floaters were a documented presenting symptom of the intraocular
        tumour in 10% of patients, supporting this edge.
  - target: Secondary Glaucoma
    description: >-
      Anterior (iris/ciliary body) tumours and neovascularisation obstruct
      aqueous outflow and raise intraocular pressure.
  - target: Ocular Pain
    description: >-
      Large tumours, secondary glaucoma and anterior-segment involvement cause
      ocular pain.
  - target: BAP1 Loss with Monosomy 3
    description: >-
      The established tumour clone is the substrate on which the later,
      prognosis-determining secondary driver event is acquired.
  - target: Secondary Splicing/Translation-Factor Driver Stratification
    description: >-
      Disomy-3 tumour clones instead acquire SF3B1 or EIF1AX mutations, defining
      the intermediate- and low-risk molecular classes.

- name: BAP1 Loss with Monosomy 3
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: ESTABLISHED
  description: >-
    The single strongest determinant of metastatic risk in uveal melanoma is
    biallelic inactivation of BAP1, a nuclear deubiquitinase acting in chromatin
    regulation and the DNA-damage response, on chromosome 3p21.1. Inactivation
    typically combines a somatic truncating or ubiquitin-hydrolase-domain
    mutation on one allele with loss of the other chromosome 3 (monosomy 3).
    Integrative TCGA analysis showed that BAP1 loss follows monosomy 3 in the
    evolutionary sequence and imposes a globally distinct DNA methylation state,
    defining the class-2 / poor-prognosis phenotype with epithelioid morphology
    and early metastasis. A minority of patients carry a germline BAP1 variant
    (BAP1 tumour-predisposition syndrome), which also raises risk of
    mesothelioma, cutaneous melanoma and clear-cell renal carcinoma.

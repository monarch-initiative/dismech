diagnosis:
- name: Ophthalmic examination and ocular ultrasonography
  description: >-
    Uveal melanoma is usually diagnosed clinically by an ocular oncologist,
    without biopsy, on dilated fundus examination (slit-lamp examination for
    anterior tumours) combined with A- and B-scan ultrasonography. Ultrasound is
    the workhorse: melanoma is characteristically low-reflective and acoustically
    "hollow", which separates it from the high-reflectivity of choroidal
    haemangioma and metastasis. Optical coherence tomography and fundus
    autofluorescence add subretinal-fluid and lipofuscin detail that discriminate
    a small melanoma from a naevus.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  results: >-
    A dome-shaped or collar-button pigmented choroidal mass with low internal
    reflectivity, acoustic hollowness and subretinal fluid supports uveal melanoma.
  evidence:
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumor \neye had also been examined with slit lamp biomicroscopy,\
      \ \nultrasonography, and fundus photography."
    explanation: Documents the actual diagnostic work-up used in a uveal melanoma
      cohort - slit-lamp biomicroscopy, ultrasonography and fundus photography - which
      is precisely the modality set curated here.
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumor's api-\ncal thickness, largest basal diameter (LBD), and location\
      \ in \nthe choroid had been noted."
    explanation: Confirms that tumour thickness, largest basal diameter and choroidal
      location are the measurements this examination yields - the parameters that drive
      staging and the naevus-versus-melanoma distinction.
- name: Prognostic molecular and cytogenetic testing
  description: >-
    Fine-needle aspiration or resection tissue is used for prognostication rather
    than for diagnosis. Chromosome 3, 8q and 6p status is assessed by FISH, SNP
    array, MLPA or NGS, with sequencing of BAP1, SF3B1 and EIF1AX. This is what
    assigns a tumour to the high-risk (monosomy 3 / BAP1-null / class 2),
    intermediate (SF3B1) or low-risk (disomy 3 / EIF1AX / class 1) group that the
    pathophysiology section models, and it sets hepatic surveillance intensity.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Monosomy 3 with BAP1 loss indicates high metastatic risk; disomy 3 with
    EIF1AX mutation indicates low risk; SF3B1 mutation indicates intermediate risk
    with characteristically late relapse.
  evidence:
  - reference: PMID:28810145
    reference_title: Integrative Analysis Identifies Four Molecular and Clinical Subsets
      in Uveal Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive multiplatform analysis of 80 uveal melanomas (UM) identifies\
      \ four \nmolecularly distinct, clinically relevant subtypes: two associated with\
      \ \npoor-prognosis monosomy 3 (M3) and two with better-prognosis disomy 3 (D3)."
    explanation: Establishes the chromosome-3-anchored molecular classification that
      this test assigns.
  - reference: PMID:23793026
    reference_title: Exome sequencing identifies recurrent somatic mutations in EIF1AX
      and SF3B1 in uveal melanoma with disomy 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were infrequent (2/35; \n5.7%) in uveal melanomas with monosomy\
      \ 3, which are associated with poor \nprognosis."
    explanation: Supports the mutual near-exclusivity of the SF3B1/EIF1AX and monosomy-3
      groups that makes this a discriminating prognostic test.
- name: Melanocytic immunohistochemistry and nuclear BAP1 staining
  description: >-
    On biopsy or enucleation specimens, melanocytic lineage is confirmed with
    SOX10, S100, Melan-A/MART1 and HMB45. Loss of nuclear BAP1 immunostaining is
    used as an inexpensive surrogate for BAP1 inactivation and therefore for
    high metastatic risk, and it is also the key discriminator against
    non-melanocytic ocular-surface lesions such as ocular surface squamous
    neoplasia.
  diagnosis_term:
    preferred_term: immunohistochemical test
    term:
      id: NCIT:C51944
      label: Immunohistochemical Test
  results: >-
    Positive melanocytic markers confirm melanoma; loss of nuclear BAP1 staining
    indicates a BAP1-inactivated, high-risk tumour.
  evidence:
  - reference: PMID:21051595
    reference_title: Frequent mutation of BAP1 in metastasizing uveal melanomas.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivating somatic mutations were identified in the gene encoding \
      BRCA1-associated protein 1 (BAP1) on chromosome 3p21.1 in 26 of 31 (84%) \
      metastasizing tumors"
    explanation: Establishes BAP1 inactivation as the marker that nuclear BAP1
      immunostaining is used to detect; the immunohistochemical surrogate itself is
      described rather than separately evidenced, hence PARTIAL.
- name: Hepatic metastatic surveillance imaging
  description: >-
    Because roughly half of uveal melanoma patients metastasise, almost always to
    the liver, and because local control does not change that risk, risk-adapted
    hepatic imaging (ultrasound, CT or MRI) is performed indefinitely after
    treatment, with interval set by the molecular risk group. A clinically
    important negative: normal liver function tests do NOT exclude hepatic
    metastasis and must not be used as a substitute for imaging.
  diagnosis_term:
    preferred_term: diagnostic imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  results: >-
    Detection of hepatic lesions on surveillance imaging establishes metastatic
    disease, typically before symptoms and often with normal liver chemistry.
  evidence:
  - reference: PMID:37628989
    reference_title: Genetic and Epigenetic Features of Uveal Melanoma-An Overview and
      Clinical Implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, the absence of rising LFT values cannot lead to the exclusion\
      \ of liver metastases."
    explanation: Sources the clinically important negative recorded here - normal liver
      function tests cannot rule out hepatic metastasis.
  - reference: PMID:34775516
    reference_title: Vasculogenic mimicry correlates to presenting symptoms and mortality
      in uveal melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The metastasis screen-\ning of the liver was then repeated by ultrasonography\
      \ or by \nCT semi-annually for a 5-year period after diagnosis."
    explanation: Documents a real hepatic surveillance protocol - repeat liver
      ultrasonography or CT at six-monthly intervals - matching the risk-adapted
      imaging described here.

differential_diagnoses:
- name: Choroidal Naevus
  description: >-
    A benign choroidal melanocytic lesion, orders of magnitude commoner than
    choroidal melanoma and the single most frequent lesion to be distinguished
    from it. Naevi and melanomas share the same GNAQ/GNA11 initiating mutation,
    so the distinction is not molecular but clinical and morphological.
  distinguishing_features:
  - Flat or minimally elevated (under about 2 mm thickness) and under about 5 mm
    in basal diameter, whereas melanoma is thicker and larger
  - No subretinal fluid, orange lipofuscin pigment, or symptoms; each of these
    features shifts the diagnosis toward melanoma
  - Stable on serial imaging - documented growth is the decisive discriminator
  - Overlying drusen or a surrounding halo favour a naevus; ultrasonographic
    acoustic hollowness favours melanoma
  evidence:
  - reference: PMID:19078957
    reference_title: Frequent somatic mutations of GNAQ in uveal melanoma and blue
      naevi.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our experiments, GNAQ behaves similar to the oncogenes, BRAF and NRAS,
      in that its mutation is insufficient for full progression to melanoma.
    explanation: Explains why the naevus/melanoma distinction cannot be made on the
      shared GNAQ driver alone and must rest on clinical and morphological features.
  notes: >-
    Deliberately left with NO bound disease_term. MONDO has no distinct
    "choroidal naevus" class at the time of curation, and the nearest ocular
    melanocytic-naevus concept - nevus of Ota / oculodermal melanocytosis
    (MONDO:0016984) - is a periorbital-dermal and scleral melanocytosis, not a
    choroidal naevus; binding it here would be semantically wrong. Per the
    dismech review convention, no term is preferable to a misleading one. A
    dedicated choroidal-naevus MONDO term is a candidate new-term request.
    Nevus of Ota is separately (and correctly) curated in this entry as a uveal
    melanoma risk factor under environmental.
- name: Choroidal Haemangioma
  description: >-
    A benign vascular choroidal tumour that can mimic an amelanotic choroidal
    melanoma, presenting with an elevated subretinal mass and exudative
    detachment.
  distinguishing_features:
  - Orange-red colour rather than pigmented
  - High internal reflectivity on A-scan ultrasonography, whereas melanoma is
    characteristically low-reflective and acoustically hollow
  - Early intense hyperfluorescence with late washout on indocyanine-green
    angiography
  - Diffuse (rather than circumscribed) choroidal haemangioma suggests
    Sturge-Weber syndrome
  disease_term:
    preferred_term: hemangioma of choroid
    term:
      id: MONDO:0021542
      label: hemangioma of choroid
- name: Choroidal Metastasis
  description: >-
    Metastatic carcinoma to the choroid is actually the commonest intraocular
    malignancy overall - commoner than primary uveal melanoma - most often from
    breast or lung primaries, and must be excluded before treating a presumed
    primary melanoma.
  distinguishing_features:
  - Creamy-yellow and plateau-shaped rather than pigmented and dome or
    collar-button shaped
  - Frequently multifocal and bilateral, whereas uveal melanoma is almost always
    unilateral and unifocal
  - Usually accompanied by a known extraocular primary tumour and systemic
    disease
  - High internal reflectivity on ultrasonography
  disease_term:
    preferred_term: metastatic malignant neoplasm in the eye
    term:
      id: MONDO:0044913
      label: metastatic malignant neoplasm in the eye
- name: Retinoblastoma
  description: >-
    The commonest primary intraocular malignancy of childhood, and the key
    age-based differential for an intraocular mass. Arises from the retina via
    biallelic RB1 inactivation, not from melanocytes.
  distinguishing_features:
  - Presents in early childhood, about 95% before age 5, versus adult onset for
    uveal melanoma
  - Arises in the retina and is non-pigmented
  - Characteristic intralesional calcification on ultrasound or CT, which uveal
    melanoma does not show
  - Leukocoria or strabismus as presenting signs
  - Definitive on RB1 genetics and on histology (Flexner-Wintersteiner rosettes)
  disease_term:
    preferred_term: retinoblastoma
    term:
      id: MONDO:0008380
      label: retinoblastoma
  evidence:
  - reference: PMID:39200222
    reference_title: 'Uveal Melanoma: Comprehensive Review of Its Pathophysiology,
      Diagnosis, Treatment, and Future Perspectives.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Uveal melanoma (UM) is the most common intraocular malignancy in adults.
    explanation: The qualifier "in adults" is the axis on which retinoblastoma, the
      commonest paediatric intraocular malignancy, is separated from uveal melanoma.
- name: Conjunctival Naevus
  description: >-
    A benign conjunctival melanocytic lesion, and the principal differential for
    a pigmented conjunctival spot. Common, usually juxtalimbal, and typically
    present since childhood or adolescence.
  distinguishing_features:
  - Characteristically contains clear intralesional cysts
  - Mobile over the underlying sclera, whereas melanoma may be fixed
  - Stable in size and pigmentation over years; new adult-onset pigmentation or
    documented growth favours melanoma
  - Confined to the bulbar conjunctiva; palpebral or forniceal involvement
    favours melanoma and warrants excisional biopsy
  - Absence of feeder vessels and of surrounding flat diffuse pigmentation
  disease_term:
    preferred_term: conjunctival nevus
    term:
      id: MONDO:0006172
      label: conjunctival nevus
- name: Ocular Surface Squamous Neoplasia
  description: >-
    The main non-melanocytic differential for a limbal ocular-surface mass,
    spanning conjunctival intraepithelial neoplasia to invasive squamous cell
    carcinoma. Shares the UV-exposed limbal niche and the risk-factor profile
    (UV, fair skin, older age, immunosuppression, HPV) with conjunctival
    melanoma.
  distinguishing_features:
  - Gelatinous, papilliform or leukoplakic pink-to-white appearance rather than
    a pigmented lesion
  - Prominent feeder vessels at the limbus
  - Amelanotic conjunctival melanoma can look very similar and is a recognised
    source of misdiagnosis, so clinical appearance alone is not sufficient
  - Histology with melanocytic immunohistochemistry (SOX10, Melan-A, HMB45) is
    definitive
  disease_term:
    preferred_term: ocular surface squamous neoplasia
    term:
      id: MONDO:0971056
      label: ocular surface squamous neoplasia
  evidence:
  - reference: PMID:39335093
    reference_title: 'Conjunctival Melanoma: A Clinical Review and Update.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Co-M is often \nmisdiagnosed or overlooked, leading to vision loss either\
      \ from the destructive \neffects of the tumour or side effects of therapy"
    explanation: Confirms that conjunctival melanoma is frequently misdiagnosed, which
      is why the ocular-surface differential is clinically important.

classifications:
  icdo_morphology:
    classification_value: Melanoma
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY

notes: >-
  Scope and relationship to sibling entries. This entry is the umbrella
  (root-with-subtypes) node for ocular melanoma. The uveal arm is curated in
  greater depth in the separate Uveal_Melanoma entry (MONDO:0006486), which
  declares this entry as a parent; the material here is deliberately organised
  around what the umbrella adds - the uveal-versus-conjunctival contrast, the
  driver-to-prognosis chain, the hepatotropic dissemination mechanism, and the
  checkpoint-refractory/ImmTAC therapeutic logic.

  Module conformance decisions. Conformance is declared against
  sustaining_proliferative_signaling (all three module nodes: the GNAQ/GNA11
  lesion as the oncogenic growth-signal lesion, the PLC-beta/PKC/MAPK cascade as
  constitutive mitogenic pathway activation, and uveal melanocyte transformation
  as growth-factor-independent proliferation) and against
  invasion_and_metastasis at its Circulatory Survival and Extravasation and
  Metastatic Colonization nodes, which is where uveal melanoma's lymphatic-free
  haematogenous route and hepatic-niche colonisation genuinely sit.

  Conformance to immune_checkpoint_blockade is deliberately NOT declared. That
  module models adaptive immune resistance in which an anti-tumour T-cell
  response drives PD-L1 upregulation and exhaustion - a mechanism whose
  therapeutic corollary is that checkpoint inhibition works. Uveal melanoma is
  the opposite case: the tumour mutational burden is low, few neoantigens are
  presented, checkpoint blockade is largely ineffective, and the therapeutic
  solution (tebentafusp) works precisely by bypassing neoantigen-dependent
  recognition. Declaring that conformance would assert the wrong mechanism.
  Conformance to genome_instability_mutation is likewise withheld: uveal
  melanoma is a low-mutational-burden cancer whose progression is driven by a
  small number of specific chromosomal events (monosomy 3, 8q gain) rather than
  by a mutator phenotype.

  Curation caveats. HPO has no dedicated conjunctival melanoma class, so the
  conjunctival presenting lesion is coded to the generic HP:0000502 and disease
  identity is carried by the MONDO:0002096 subtype binding. MONDO likewise has
  no distinct choroidal naevus class, so the choroidal-naevus differential is
  deliberately left with NO bound disease_term - the nearest concept, nevus of
  Ota (MONDO:0016984), is a periorbital-dermal and scleral melanocytosis rather
  than a choroidal naevus, and binding it would be misleading. A dedicated
  choroidal-naevus MONDO term is a reasonable new-term request. Nevus of Ota is
  separately and correctly curated here as a uveal melanoma risk factor under
  environmental. Cytogenetic events
  (monosomy 3, 8q gain, 6p gain) and the DecisionDx-UM gene-expression-profile
  classes are described in prose but are not curated as structured genetic items
  because they are chromosomal and transcriptional, not gene-level, assertions.


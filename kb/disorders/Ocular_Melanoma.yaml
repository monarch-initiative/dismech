      \ \nratio for death, 0.68; 95% confidence interval, 0.54 to 0.87)."
    explanation: Confirms the survival benefit is durable at three years.

- name: Conjunctival Melanocytic Intraepithelial Neoplasia
  biological_scale: TISSUE
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The conjunctival arm of ocular melanoma begins in a fundamentally different
    compartment - the stratified squamous/mucosal epithelium of the conjunctival
    surface, which is UV-exposed and lymphatic-bearing. Most conjunctival
    melanomas arise from a precursor field of atypical intraepithelial
    melanocytic proliferation (conjunctival melanocytic intraepithelial lesion,
    formerly primary acquired melanosis with atypia); a minority arise in a
    pre-existing naevus or de novo. Because the precursor is a diffuse field
    rather than a discrete mass, incomplete excision leaves residual atypical
    epithelium and drives the high (roughly a third to a half) local recurrence
    rate that dominates conjunctival melanoma morbidity.

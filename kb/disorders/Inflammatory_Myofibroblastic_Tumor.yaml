treatments:
- name: Surgical Resection
  description: >-
    Complete surgical resection is the treatment of choice for localized,
    resectable IMT.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Myofibroblastic Proliferation and Inflammatory Recruitment
    treatment_effect: INHIBITS
    description: Complete surgical excision removes the proliferating myofibroblastic mass and associated inflammatory infiltrate.
  evidence:
  - reference: PMID:34244015
    reference_title: "Inflammatory myofibroblastic tumor: molecular landscape, targeted therapeutics, and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete \nsurgical resection is the treatment of choice when feasible."
    explanation: >-
      Surgical resection is the established first-line therapy for resectable
      IMT.
  - reference: PMID:15602716
    reference_title: "Pediatric inflammatory myofibroblastic tumor: anaplastic lymphoma kinase (ALK) expression and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognosis was improved with ALK expression and complete surgical resection."
    explanation: >-
      Demonstrates that complete surgical resection improves clinical prognosis in pediatric IMT.
- name: Crizotinib (ALK/ROS1 Inhibitor)
  description: >-
    Crizotinib, an ALK and ROS1 tyrosine kinase inhibitor, produces objective
    responses in patients with unresectable or advanced ALK-positive (and
    ROS1-rearranged) IMT, and is used in the targeted-therapy setting.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: crizotinib
      term:
        id: CHEBI:64310
        label: crizotinib
  target_mechanisms:
  - target: Constitutive Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: Crizotinib competitively inhibits the ATP-binding pocket of constitutively active ALK and ROS1 fusion kinases.
  evidence:
  - reference: PMID:29286567
    reference_title: "Crizotinib in ALK(+) inflammatory myofibroblastic tumors-Current experience and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As about 50% of IMT and 100% of EIMS contain activating rearrangements of the \nanaplastic lymphoma kinase (ALK) gene, targeted kinase inhibition of ALK by \ncompounds such as crizotinib is a potential treatment option."
    explanation: >-
      Establishes the rationale for ALK inhibition with crizotinib in
      ALK-positive IMT/EIMS.
  - reference: PMID:29286567
    reference_title: "Crizotinib in ALK(+) inflammatory myofibroblastic tumors-Current experience and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a \nliterature review and analyzed a total of 30 patients with IMT/EIMS treated with \ncrizotinib. A total of 12 patients achieved complete or partial remission."
    explanation: >-
      Reports objective clinical responses (complete/partial remission) to
      crizotinib in a pooled IMT/EIMS cohort.
  - reference: PMID:32915420
    reference_title: "A novel LRRFIP1-ALK fusion in inflammatory myofibroblastic tumor of hip and response to crizotinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Crizotinib, an ALK inhibitor, was effective in the treatment of this \npatient"
    explanation: >-
      Case-level evidence of crizotinib efficacy in ALK-fusion IMT (LRRFIP1-ALK).
- name: Next-Generation ALK Inhibitors (Alectinib, Ceritinib)
  description: >-
    Second-generation ALK inhibitors (alectinib, ceritinib) are used
    sequentially in ALK-positive IMT, particularly after crizotinib resistance.
    Ceritinib can re-induce responses in tumors that develop secondary ALK
    kinase-domain mutations conferring resistance to earlier-generation
    inhibitors.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alectinib
      term:
        id: CHEBI:90936
        label: alectinib
    - preferred_term: ceritinib
      term:
        id: CHEBI:78432
        label: ceritinib
  target_mechanisms:
  - target: Acquired Resistance to Kinase Inhibition
    treatment_effect: INHIBITS
    description: Next-generation ALK inhibitors overcome secondary ALK kinase-domain resistance mutations emerging after earlier-generation TKI therapy.
  - target: Constitutive Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: Potently inhibits constitutive ALK fusion tyrosine kinase signaling.
  evidence:
  - reference: PMID:33116613
    reference_title: "Efficacy and Resistance of ALK Inhibitors in Two Inflammatory Myofibroblastic Tumor Patients with ALK Fusions Assessed by Whole Exome and RNA Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Guided by this result, a newer ALK inhibitor, ceritinib was \nprescribed. The patient was able to achieve a partial response (PR) and is in \ngood condition as of the manuscript date."
    explanation: >-
      Documents sequential use of next-generation ALK inhibitors in ALK-fusion
      IMT, with ceritinib achieving a partial response after alectinib
      resistance driven by a secondary ALK kinase-domain mutation.

notes: >-
  ICD-O morphology (icdo_morphology) is omitted from classifications because
  inflammatory myofibroblastic tumor is classified in ICD-O as an intermediate,
  rarely metastasizing myofibroblastic neoplasm (8825/1) rather than a fully
  malignant sarcoma (/3), and the schema's icdo_morphology enum does not
  provide a separate intermediate myofibroblastic tumor value. Epithelioid
  inflammatory myofibroblastic sarcoma (EIMS), recorded as the EIMS subtype, is
  an aggressive variant in which RANBP2-ALK fusions with characteristic nuclear
  membranous ALK staining are described; RRBP1-ALK fusions, with cytoplasmic
  ALK staining and perinuclear accentuation, have also been found
  (PMID:27874193). ALK-negative status has been
  associated with worse outcomes in some pediatric series (PMID:15602716),
  although molecular subclassification with ROS1/NTRK/RET/PDGFRB testing now
  reclassifies many former "ALK-negative" tumors as kinase-fusion-driven and
  potentially targetable.


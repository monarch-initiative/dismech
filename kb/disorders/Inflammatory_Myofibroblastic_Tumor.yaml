has_subtypes:
- name: ALK-Positive
  display_name: ALK-rearranged IMT
  description: >-
    The most common molecular subtype (~50% of IMTs), defined by clonal
    rearrangements of the anaplastic lymphoma kinase (ALK) gene on chromosome
    2p23 fused to diverse partner genes (e.g., TPM3, TPM4, CLTC, DCTN1, RANBP2).
    Tumors are typically positive for ALK by immunohistochemistry and respond to
    ALK inhibitors such as crizotinib.
  evidence:
  - reference: PMID:34244015
    reference_title: "Inflammatory myofibroblastic tumor: molecular landscape, targeted therapeutics, and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half of IMTs harbor anaplastic lymphoma kinase (ALK) gene rearrangements, and fusions involving ROS1, PDGFRβ, RET and NTRK have also been described."
    explanation: Establishes ALK-rearranged IMT as the most common molecular subtype (~50% of cases).
- name: ROS1-Fusion
  display_name: ROS1-rearranged IMT
  description: >-
    A subtype of ALK-negative IMT driven by rearrangements of the ROS1 receptor
    tyrosine kinase gene (e.g., YWHAE-ROS1, TFG-ROS1). ROS1
    immunohistochemistry correlates with ROS1 rearrangement and these tumors are
    candidates for ROS1-directed inhibitors (crizotinib, entrectinib).
  evidence:
  - reference: PMID:25612511
    reference_title: "Expression of ROS1 predicts ROS1 gene rearrangement in inflammatory myofibroblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of ROS1 correlates with ROS1 gene rearrangement in inflammatory myofibroblastic tumor."
    explanation: Defines ROS1-rearranged IMT as a distinct molecular subtype identifiable by ROS1 immunohistochemistry.
- name: NTRK-Fusion
  display_name: NTRK-rearranged IMT
  description: >-
    A rare ALK-negative subtype driven by fusions of the neurotrophic tyrosine
    receptor kinase genes (NTRK1/NTRK3), targetable with TRK inhibitors
    (larotrectinib, entrectinib).
  evidence:
  - reference: PMID:34244015
    reference_title: "Inflammatory myofibroblastic tumor: molecular landscape, targeted therapeutics, and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fusions involving ROS1, PDGFRβ, RET and NTRK have also been described."
    explanation: Documents NTRK gene fusions as a distinct molecular subtype among ALK-negative IMTs.
- name: ALK-Negative
  display_name: ALK-negative / kinase-fusion-negative IMT
  description: >-
    IMTs lacking ALK rearrangement. A proportion harbor alternative kinase
    fusions (ROS1, NTRK, RET, PDGFRB), while the molecular pathogenesis of the
    remainder is incompletely understood. ALK-negative status has historically
    been associated with a less favorable prognosis in some series.
  evidence:
  - reference: PMID:15602716
    reference_title: "Pediatric inflammatory myofibroblastic tumor: anaplastic lymphoma kinase (ALK) expression and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the incomplete resection patients, those that were ALK-positive lived, and those that were ALK-negative did not."
    explanation: In a pediatric series of eight IMT patients, among the four patients with incomplete surgical resection, those with ALK-negative tumors died of disease whereas those with ALK-positive tumors survived.
- name: EIMS
  display_name: Epithelioid Inflammatory Myofibroblastic Sarcoma
  classification: histological
  subtype_term:
    preferred_term: epithelioid inflammatory myofibroblastic sarcoma
    term:
      id: MONDO:0850127
      label: epithelioid inflammatory myofibroblastic sarcoma
  description: >-
    An ALK-rearranged variant of IMT, defined by epithelioid morphology and a
    nuclear membrane or perinuclear pattern of ALK immunostaining. The case
    series that proposed the name characterized these tumors as a distinctive
    intra-abdominal sarcoma with a predilection for male patients, and chose
    the name to convey both their malignant behavior and their close
    relationship with IMT. In that series FISH
    detected ALK gene rearrangement, and RT-PCR found a RANBP2-ALK fusion in
    the cases tested. In a later small series, ALK staining differed by fusion
    partner: tumors with RANBP2-ALK showed nuclear membranous staining, whereas
    tumors with RRBP1-ALK, a recurrent fusion in EIMS, showed cytoplasmic
    staining with perinuclear accentuation. Small case series report that EIMS
    pursues an aggressive course with rapid local recurrences, and a review
    pooling the reported cases concluded that it behaves more aggressively
    than conventional IMT. It is a histological variant within ALK-rearranged
    IMT, so it overlaps the ALK-Positive subtype rather than forming a separate
    fusion class.
  evidence:
  - reference: PMID:21164297
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: An aggressive intra-abdominal variant of inflammatory myofibroblastic tumor with nuclear membrane or perinuclear ALK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "In summary, the epithelioid variant of IMT with nuclear membrane or perinuclear ALK is a distinctive intra-abdominal sarcoma with a predilection for male patients."
    explanation: >-
      Summing up their own patient series, the authors characterize the
      epithelioid variant of IMT with nuclear membrane or perinuclear ALK
      immunostaining as a distinctive intra-abdominal sarcoma. The epithelioid
      morphology and the ALK staining pattern are what define the variant; the
      intra-abdominal site describes the tumors of this series, all of which
      were intra-abdominal, and is not part of the definition. The closing
      sentence of the same abstract proposes the name epithelioid inflammatory
      myofibroblastic sarcoma.
  - reference: PMID:21164297
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: An aggressive intra-abdominal variant of inflammatory myofibroblastic tumor with nuclear membrane or perinuclear ALK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'We propose the designation "epithelioid inflammatory myofibroblastic sarcoma" to convey both the malignant behavior of these tumors and their close relationship with IMT.'
    explanation: >-
      The authors of the series propose the name epithelioid inflammatory
      myofibroblastic sarcoma for the tumors they describe, chosen to convey
      both the tumors' malignant behavior and their close relationship with
      IMT. The sentence supports the subtype's name and its tie to IMT; it does
      not itself state the ALK staining pattern or the tumor site.
  - reference: PMID:21164297
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: An aggressive intra-abdominal variant of inflammatory myofibroblastic tumor with nuclear membrane or perinuclear ALK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Fluorescence in situ hybridization was positive for ALK gene rearrangement in 9 cases, and in 3 cases tested, a RANBP2-ALK fusion was detected by reverse transcription polymerase chain reaction."
    explanation: >-
      Primary result of the case series that proposed the name epithelioid
      inflammatory myofibroblastic sarcoma: FISH detected ALK gene
      rearrangement in tumors of the series, and RT-PCR detected a RANBP2-ALK
      fusion in the cases tested, supporting the subtype's description as
      ALK-rearranged. The abstract does not say how many cases underwent
      FISH, so the quote does not show that every tumor in the series was
      rearranged, or that every EIMS carries RANBP2-ALK.
  - reference: PMID:27460384
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: a clinicopathological, immunohistochemical and molecular cytogenetic analysis of five additional cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "All 21 cases tested by FISH so far showed positive signal of ALK translocation."
    explanation: >-
      In its review of the literature, this case series pools the reported
      EIMS that had been tested by FISH, its own cases and previously
      published ones, and all of them showed an ALK translocation. This
      supports describing EIMS as an ALK-rearranged variant of IMT, for the
      cases tested up to that review. The pool includes the patients of the
      series that proposed the name, so this item is not independent of the
      PMID:21164297 FISH item.
  - reference: PMID:27874193
    reference_title: "ALK oncoproteins in atypical inflammatory myofibroblastic tumours: novel RRBP1-ALK fusions in epithelioid inflammatory myofibroblastic sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The epithelioid inflammatory myofibroblastic sarcoma with RRBP1-ALK fusion had cytoplasmic ALK expression with perinuclear accentuation, different from the nuclear membranous ALK localization in epithelioid inflammatory myofibroblastic sarcomas with RANBP2-ALK fusions. Evaluation of three additional uncharacterized epithelioid inflammatory myofibroblastic sarcomas with ALK cytoplasmic/perinuclear-accentuation expression demonstrated RRBP1-ALK fusion in two cases."
    explanation: >-
      In this series of patients' tumors, the EIMS carrying RRBP1-ALK showed
      cytoplasmic ALK staining with perinuclear accentuation, unlike the
      nuclear membranous staining of EIMS carrying RANBP2-ALK. Of three
      further EIMS with the cytoplasmic/perinuclear pattern, two carried
      RRBP1-ALK, so the fusion recurs in EIMS. The abstract does not report
      the fusion in the third, so in this small series the pattern went with
      RRBP1-ALK without being shown to be a perfect marker for it.
  - reference: PMID:21164297
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: An aggressive intra-abdominal variant of inflammatory myofibroblastic tumor with nuclear membrane or perinuclear ALK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "These tumors pursue an aggressive course with rapid local recurrences and are frequently fatal."
    explanation: >-
      In the closing summary of the abstract of the case series that proposed
      the name epithelioid inflammatory myofibroblastic sarcoma, "these tumors"
      are the epithelioid variant of IMT with nuclear membrane or perinuclear
      ALK. From the follow-up of its own patients, the paper concludes that
      they pursue an aggressive course with rapid local recurrences, which
      directly supports that part of the description. The quoted sentence
      does not itself compare EIMS with conventional IMT; the PMID:27460384
      item carries that comparison.
  - reference: PMID:27460384
    reference_title: "Epithelioid inflammatory myofibroblastic sarcoma: a clinicopathological, immunohistochemical and molecular cytogenetic analysis of five additional cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "The data indicate that EIMS pursues a more aggressive biologic behavior than the usual IMT."
    explanation: >-
      This case series and literature review pools the authors' own EIMS cases
      with previously reported ones. It concludes that EIMS behaves more
      aggressively than usual (conventional) IMT, because its local recurrence
      and distant metastasis rates are markedly higher than those of
      conventional IMT. This states the comparative part of the claim
      outright. The pooled cases include the patients of the series that
      proposed the name, so this item is not independent of the PMID:21164297
      items.

pathophysiology:
- name: Clonal Receptor Tyrosine Kinase Gene Rearrangement
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    A defining initiating event in roughly half of IMTs is a clonal chromosomal
    rearrangement of the ALK receptor tyrosine kinase gene at 2p23, fusing the
    ALK kinase domain to an N-terminal partner gene (e.g., TPM3, TPM4, CLTC,
    DCTN1, RANBP2). Analogous rearrangements involving ROS1, NTRK1/3, RET, and
    PDGFRB occur in ALK-negative cases. The fusion partner drives constitutive
    expression and oligomerization of the chimeric kinase.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  gene_products:
  - preferred_term: ALK tyrosine kinase receptor
    term:
      id: NCIT:C27032
      label: ALK Tyrosine Kinase Receptor
  evidence:
  - reference: PMID:34244015
    reference_title: "Inflammatory myofibroblastic tumor: molecular landscape, targeted therapeutics, and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately \nhalf of IMTs harbor anaplastic lymphoma kinase (ALK) gene rearrangements, and \nfusions involving ROS1, PDGFRβ, RET and NTRK have also been described."
    explanation: >-
      Establishes that ~50% of IMTs are driven by ALK rearrangements, with
      ROS1, PDGFRB, RET, and NTRK fusions defining the additional molecular
      subtypes modeled in has_subtypes.
  - reference: PMID:27874193
    reference_title: "ALK oncoproteins in atypical inflammatory myofibroblastic tumours: novel RRBP1-ALK fusions in epithelioid inflammatory myofibroblastic sarcoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "each of which had ALK genomic perturbations."
    explanation: >-
      Mass-spectrometry characterization of multiple ALK fusion oncoproteins
      (TPM3/4-ALK, DCTN1-ALK, RANBP2-ALK, RRBP1-ALK) confirms the chimeric
      kinase as the constitutively activated driver.
  downstream:
  - target: Constitutive Tyrosine Kinase Activation
    description: >-
      The fusion partner mediates ligand-independent oligomerization and
      constitutive activation of the chimeric ALK/ROS1/NTRK kinase domain.

- name: Constitutive Tyrosine Kinase Activation
  description: >-
    The fusion oncoprotein exhibits ligand-independent, constitutive tyrosine
    kinase activity. The chimeric kinase autophosphorylates and activates
    downstream proliferative and survival signaling cascades (RAS-MAPK,
    PI3K-AKT, JAK-STAT), driving oncogenic transformation of the myofibroblast.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  molecular_functions:
  - preferred_term: protein tyrosine kinase activity
    modifier: INCREASED
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  biological_processes:
  - preferred_term: receptor tyrosine kinase signaling
    modifier: INCREASED
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  evidence:
  - reference: PMID:27874193
    reference_title: "ALK oncoproteins in atypical inflammatory myofibroblastic tumours: novel RRBP1-ALK fusions in epithelioid inflammatory myofibroblastic sarcoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ALK oncogenic activation mechanisms were characterized in four conventional \nspindle-cell inflammatory myofibroblastic tumours (IMT) and five atypical IMT, \neach of which had ALK genomic perturbations."
    explanation: >-
      Demonstrates that the ALK genomic rearrangements in IMT result in
      oncogenic kinase activation, the central pathophysiologic mechanism.
  downstream:
  - target: Myofibroblastic Proliferation and Inflammatory Recruitment
    description: >-
      Constitutive kinase signaling drives clonal myofibroblastic proliferation
      and an associated inflammatory microenvironment.

- name: Myofibroblastic Proliferation and Inflammatory Recruitment
  description: >-
    Constitutive kinase signaling drives clonal proliferation of neoplastic
    myofibroblasts arranged in fascicles, accompanied by recruitment of a dense
    polymorphous inflammatory infiltrate (plasma cells, lymphocytes,
    eosinophils). The resulting mass is locally infiltrative with a propensity
    for recurrence; rare cases metastasize.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: cell proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:25612511
    reference_title: "Expression of ROS1 predicts ROS1 gene rearrangement in inflammatory myofibroblastic tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inflammatory myofibroblastic tumor is a distinctive, rarely metastasizing \nmesenchymal neoplasm composed of fascicles of spindle cells with a prominent \ninflammatory infiltrate."
    explanation: >-
      Confirms the defining histologic combination of proliferating spindle
      (myofibroblastic) cells in fascicles with a prominent inflammatory
      infiltrate.
  downstream:
  - target: Acquired Resistance to Kinase Inhibition
    description: >-
      Under selective pressure of targeted ALK/ROS1 inhibition, residual tumor
      cells acquire resistance, driving relapse of the proliferative process.
  - target: Soft Tissue / Visceral Mass
    description: Clonal myofibroblastic proliferation and dense inflammatory cell recruitment form a mass lesion.
  - target: Fever
    description: Cytokines released by the tumor-associated inflammatory infiltrate produce constitutional fever.
  - target: Anemia
    description: Chronic tumor-associated inflammation induces anemia of inflammation.
  - target: Thrombocytosis
    description: Systemic inflammatory signaling from the tumor microenvironment stimulates reactive thrombocytosis.
  - target: Elevated Erythrocyte Sedimentation Rate
    description: Acute-phase reactant production driven by the tumor inflammatory infiltrate elevates ESR.
  - target: Hypergammaglobulinemia
    description: Abundant infiltrating plasma cells within the tumor stroma drive polyclonal hypergammaglobulinemia.
  - target: Leukocytosis
    description: Systemic inflammatory recruitment associated with IMT produces peripheral leukocytosis.

- name: Acquired Resistance to Kinase Inhibition
  description: >-
    In patients treated with ALK (or ROS1) tyrosine kinase inhibitors, acquired
    resistance commonly emerges through secondary mutations in the ALK kinase
    domain (e.g., L1196M, G1202R, I1171N, G1269A) that impair drug binding, or
    through compensatory activation of bypass signaling pathways (e.g., EGFR,
    PDGFRB, MAPK, SHH). This limits the durability of targeted therapy and
    motivates sequential next-generation inhibitors and repeat molecular
    profiling at relapse.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: receptor tyrosine kinase signaling
    modifier: INCREASED
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence:
  - reference: PMID:33116613
    reference_title: "Efficacy and Resistance of ALK Inhibitors in Two Inflammatory Myofibroblastic Tumor Patients with ALK Fusions Assessed by Whole Exome and RNA Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired resistance to ALK inhibitors is often accompanied by three types of secondary mutations in the ALK kinase domain."
    explanation: >-
      Documents secondary ALK kinase-domain mutations as a recurrent mechanism
      of acquired resistance to ALK inhibitors in ALK-fusion IMT.
  - reference: PMID:33116613
    reference_title: "Efficacy and Resistance of ALK Inhibitors in Two Inflammatory Myofibroblastic Tumor Patients with ALK Fusions Assessed by Whole Exome and RNA Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compensatory activation of bypass pathways is the basic principle of this type of resistance."
    explanation: >-
      Documents bypass-pathway (ALK-independent) signaling as a second principal
      mechanism of acquired resistance to ALK inhibitors in IMT.

histopathology:

genetic:
- name: SIM1
  gene_term:
    preferred_term: SIM1
    term:
      id: hgnc:10882
      label: SIM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: One contributor to obesity in SIM1-containing deletions. Strong loss-of-function intragenic variants support the gene assignment, but not all missense variants are damaging and obesity severity is incompletely penetrant. An intrafamilial odds ratio from selected variant carriers is not deletion-syndrome penetrance.
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Except for patients no. 14 and 15, all patients had deletions that included the SIM1 gene.
    explanation: SIM1 involvement is determined by deletion boundaries; it is absent from two intervals in this cohort.
  - reference: PMID:23778136
    reference_title: Loss-of-function mutations in SIM1 contribute to obesity and Prader-Willi-like features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We found a strong loss-of-function effect of p.T46R, p.H323Y, and p.T714A mutations on SIM1 transcriptional activity with both ARNT and ARNT2
    explanation: Reporter assays establish variant-specific loss of transactivation in engineered human cells, not hypothalamic histology in deletion carriers.
  - reference: PMID:23778136
    reference_title: Loss-of-function mutations in SIM1 contribute to obesity and Prader-Willi-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Therefore, mutation of SIM1 is not always responsible for a fully penetrant form of obesity.
    explanation: The study reports variable effects and variable clinical expression.
- name: POU3F2
  gene_term:
    preferred_term: POU3F2
    term:
      id: hgnc:9215
      label: POU3F2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: A supported contributor to neurodevelopmental impairment and obesity susceptibility in SIM1-sparing deletions. The overlapping 350-kb region also includes FBXL4; subsequent intragenic truncating and missense variants strengthen POU3F2 attribution. Functional effects are variant-specific. The separate monogenic cohort is not used to assign every finding or a frequency to chromosome-deletion carriers.
  evidence:
  - reference: PMID:35581197
    reference_title: Clinical course of a Japanese patient with developmental delay linked to a small 6q16.1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The six families described in the report by Kasher et al. had the deletion of the POU3F2 and FBXL4 genes, although the deletion size was different in each family
    explanation: Identifies both genes in the overlapping interval; these are not POU3F2-only deletions.
  - reference: PMID:37207645
    reference_title: Monoallelic intragenic POU3F2 variants lead to neurodevelopmental delay and hyperphagic obesity, confirming the gene's candidacy in 6q16.1 deletions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In an international collaboration, we identified ultra-rare truncating and missense variants in another ten individuals sharing autism spectrum disorder, NDD, and adolescent-onset obesity.
    explanation: Intragenic variants independently strengthen POU3F2 attribution; this is a separate monogenic cohort, not a deletion-syndrome frequency estimate.
  - reference: PMID:37207645
    reference_title: Monoallelic intragenic POU3F2 variants lead to neurodevelopmental delay and hyperphagic obesity, confirming the gene's candidacy in 6q16.1 deletions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Except for a variant leading to early truncation of the protein, identified variants showed adequate nuclear translocation but overall disturbed DNA-binding ability and promotor activation.
    explanation: Functional summary from the available abstract of the intragenic-variant study. Effects differ by variant and are not measurements in deletion-carrier hypothalamus.
- name: EPHA7
  gene_term:
    preferred_term: EPHA7
    term:
      id: hgnc:3390
      label: EPHA7
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: Partial or complete deletions support an incompletely penetrant neurodevelopmental susceptibility locus. Most deletions in the 2021 series were inherited, often from unaffected parents. A more severe case also had Williams-Beuren syndrome, and another had a larger deletion involving ZNF292; these are not clean EPHA7-only phenotypes.
  evidence:
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had tiny deletions involving only EPHA7, suggesting a critical role of EPHA7 in a neurodevelopmental disability phenotype.
    explanation: Single-gene deletions strengthen the locus association but the authors describe a susceptibility effect with incomplete penetrance.
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The deletions were inherited in nine out of 12 patients, suggesting variable expressivity and incomplete penetrance.
    explanation: The selected cohort supports variable expression; it does not estimate population penetrance.
  - reference: url:https://pure.rug.nl/ws/files/175928539/cge.14017.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Most deletions were inherited (9/12) from unaffected parent suggesting that haploinsufficiency of EPHA7 could act as a risk factor for NDD with variable expressivity and incomplete penetrance.
    explanation: Discussion qualifies the risk-locus interpretation; family A had an affected father with a history of cranial concussion.

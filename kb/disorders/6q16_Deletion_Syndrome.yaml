      explanation: Reporter assays establish variant-specific loss of transactivation in engineered human cells, not hypothalamic histology in deletion carriers.
histopathology:
- name: Cerebral and cerebellar neuronal ectopia
  description: Autopsy of one fetus with a large 14-Mb 6q16.1-q21 deletion identified ectopic neurons and abnormal nuclear organization. This prenatal case is not representative of all surviving deletion carriers, and the findings cannot be assigned to SIM1 alone.
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Microscopic examination of the brain evidenced fusion of the anterior caudate nucleus and putamen (Figure 1c), multiple ectopic neurons in the white matter (Figure 1d) and ectopic Purkinje cells in the internal granular layer of the cerebellum (Figure 1e).
    explanation: Direct fetal neuropathology from one large deletion, distinct from the mostly normal available MRI observations in living patients.
  notes: 'Needs term / NTR: mixed cerebral and cerebellar neuronal ectopia is retained descriptively; no generic tumor histology term is applied.'
differential_diagnoses:
- name: Prader-Willi Syndrome
  description: Hypotonia, developmental impairment and later hyperphagic obesity can overlap, while the causative chromosome lesion differs.
  distinguishing_features:
  - Molecular testing distinguishes 15q11-q13 imprinting abnormalities from a 6q16 copy-number loss.
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Prader–Willi syndrome (PWS, MIM 176270) is an imprinting disease caused by paternal deletions, maternal uniparental disomy or imprinting anomalies in the 15q11.2q13 region.
    explanation: Background establishes the distinct molecular basis.
- name: 6q14.1-q15 deletion syndrome
  description: Adjacent proximal deletions can also produce developmental delay and obesity. Their clinical overlap is a differential consideration, not direct evidence for the mechanism or phenotype frequencies of 6q16 deletions.
  evidence:
  - reference: PMID:21045960
    reference_title: Interstitial Deletions at 6q14.1-q15 Associated with Obesity, Developmental Delay and a Distinct Clinical Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here we report on 2 patients with interstitial deletions at 6q14.1-q15 presenting with obesity and symptoms strikingly similar to those reported for deletions involving the SIM1 gene despite not having a deletion of this gene.
    explanation: Keeps the neighboring interval outside the 6q16 causal graph.
- name: Monogenic SIM1- or POU3F2-related neurodevelopmental obesity
  description: Intragenic variants can produce overlapping obesity and developmental phenotypes without a chromosome deletion. Gene-specific assays and sequencing are distinct from demonstration of a 6q16 CNV.
  evidence:
  - reference: PMID:37207645
    reference_title: Monoallelic intragenic POU3F2 variants lead to neurodevelopmental delay and hyperphagic obesity, confirming the gene's candidacy in 6q16.1 deletions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In an international collaboration, we identified ultra-rare truncating and missense variants in another ten individuals sharing autism spectrum disorder, NDD, and adolescent-onset obesity.
    explanation: Intragenic variants independently strengthen POU3F2 attribution; this is a separate monogenic cohort, not a deletion-syndrome frequency estimate.
  - reference: PMID:23778136
    reference_title: Loss-of-function mutations in SIM1 contribute to obesity and Prader-Willi-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: if chromosomes 15q11 and 6q16 are found not to contain abnormalities, then SIM1 sequencing and subsequent molecular characterization should be performed
    explanation: The authors suggest an intragenic differential after chromosome testing.

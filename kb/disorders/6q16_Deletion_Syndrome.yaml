- name: POU3F2-Dependent Oxytocin Expression in Zebrafish
  description: Morpholino and mutant zebrafish experiments place pou3f2 downstream of sim1 in regulation of oxytocin expression in the neuroendocrine preoptic area. This is an experimental pathway branch; a corresponding oxytocin deficiency or neuron-loss mechanism has not been established in human 6q16 deletion carriers.
  role: mechanism
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:26833329
    reference_title: Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Using morpholino and mutant zebrafish models, we show that POU3F2 lies downstream of SIM1 and controls oxytocin expression in the hypothalamic neuroendocrine preoptic area.
    explanation: Experimental pathway ordering and oxytocin-expression readout in zebrafish. The available abstract does not establish human neuron loss, circulating oxytocin deficiency or obesity rescue.

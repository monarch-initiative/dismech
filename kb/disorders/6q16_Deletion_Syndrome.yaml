  culture_system: Stable single-copy wild-type or mutant SIM1 expression with ARNT or ARNT2 and a luciferase reporter
  publication: PMID:23778136
  description: Eight substitutions were compared using a defined single insertion site. Three showed strong loss of transactivation with both partners; other substitutions had mild, absent or partner-dependent gain-of-function effects.
  modeled_mechanisms:

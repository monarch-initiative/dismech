    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Microarray analyses showed overlapping 6q deletions, extending from 92 138 719 bp to 108 227 875 bp (hg19).
    explanation: The cohort includes variable overlapping intervals; these coordinates describe the combined span, not a recurrent deletion.

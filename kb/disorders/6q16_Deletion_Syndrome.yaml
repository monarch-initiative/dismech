- discussion_id: del6q16_interval_and_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: How do gene content, age and additional genetic findings modify the phenotype?
  rationale: Intervals vary and some reported patients carry additional CNVs or large deletions. The 2015 series has inconsistent obesity totals between narrative and tables and includes a fetus among SIM1 deletions; the quoted 8/13 is not used as a penetrance estimate. The EPHA7 cohort includes unaffected transmitting parents and two severe cases with substantial alternative genetic contributions. These sources support qualitative variability rather than disease-wide frequency bands.
  attaches_to:
  - pathophysiology#Heterozygous 6q16 Deletion
  - genetic#EPHA7
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: only 8 of 13 patients with SIM1 deletion exhibited obesity, in agreement with incomplete penetrance of SIM1 haploinsufficiency.
    explanation: The authors interpret variable obesity as incomplete penetrance. The cohort includes a fetus and the tables have discrepant obesity totals, so this quoted count is not used as a penetrance estimate.
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had tiny deletions involving only EPHA7, suggesting a critical role of EPHA7 in a neurodevelopmental disability phenotype.
    explanation: Single-gene deletions strengthen the locus association but the authors describe a susceptibility effect with incomplete penetrance.
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The deletions were inherited in nine out of 12 patients, suggesting variable expressivity and incomplete penetrance.
    explanation: The selected cohort supports variable expression; it does not estimate population penetrance.
review_notes: Reviewed the matching Perplexity report and citation audit against original clinical and experimental sources. Expanded disease-specific clinical coverage from the 2015 deletion series, the 2022 SIM1-sparing case and the 2021 EPHA7 cohort. Read full available reports, including actual generated full text for the SIM1 functional study and the deletion cohort; POU3F2 2016 and 2023 caches remain abstract-only after sanctioned retrieval attempts, so fine experimental details and gene-specific treatment claims are not inferred. Removed unsupported frequency bands, POU3F2-only deletion language, assumed human neuronal or oxytocin deficiency, and adjacent-interval evidence from the causal model. Full-text table findings retain patient and additional-CNV limitations. No disease-specific trial efficacy was established by the reviewed sources.
progression:
- phase: Variable developmental and growth trajectories
  notes: Developmental difficulties can present in infancy, while hyperphagia and obesity may emerge later. Neither an obligatory early obesity phase nor a uniform progressive neurological course is established. A child with a POU3F2-containing deletion remained nonobese at five years despite persistent language delay.
  evidence:
  - reference: PMID:35581197
    reference_title: Clinical course of a Japanese patient with developmental delay linked to a small 6q16.1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: At the age of 5 years and 1 month, she could not speak two-word sentences, her body weight was 15.7 kg (−0.8 SD), and her body height was 101.7 cm (−1.1 SD).
    explanation: A longitudinal observation documenting persistent developmental impairment without obesity at this age.
- phase: Possible later pituitary deficiency
  notes: A single SIM1-containing deletion case developed hypopituitarism in childhood or adolescence despite unremarkable infant endocrine testing. Normal early testing did not exclude later deficiency in that patient.
  evidence:
  - reference: PMID:24038875
    reference_title: Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi syndrome-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Detailed endocrine evaluation of the propositus during childhood and adolescence revealed hypopituitarism, though initial endocrine evaluations during infancy were unremarkable.
    explanation: One SIM1-containing deletion case developed later endocrine deficits; this does not establish a universal or obligatory consequence.

name: 6q16 Deletion Syndrome
creation_date: "2026-09-01T13:40:08Z"
category: Genetic
parents:
- Contiguous Gene Deletion Syndrome
- Syndromic Obesity
disease_term:
  preferred_term: 6q16 deletion syndrome
  term:
    id: MONDO:0015749
    label: 6q16 deletion syndrome
synonyms:
- proximal interstitial 6q deletion
- Prader-Willi-like syndrome due to 6q16 deletion
description: >-
  6q16 deletion syndrome is an interstitial deletion presenting as a
  Prader-Willi-like picture: infantile hypotonia followed by hyperphagia and
  early-onset obesity, with developmental delay and intellectual disability. The
  mechanism usually given is haploinsufficiency of SIM1, a transcription factor
  required for development of the paraventricular hypothalamus and therefore for
  the melanocortin arm of energy balance, and that attribution is well supported:
  loss-of-function SIM1 point mutations produce severe obesity with
  Prader-Willi-like features on their own, so the gene is sufficient without a
  deletion. The entry nevertheless declines to model the syndrome as SIM1
  haploinsufficiency and nothing else, for two reasons visible in the same
  literature. A ~350 kb critical region at 6q16.1 that does not contain SIM1 but
  does contain POU3F2 produces overlapping developmental delay and obesity
  susceptibility, and POU3F2 turns out to sit downstream of SIM1 in the same
  hypothalamic pathway. And deletions adjacent to the region, sparing SIM1
  entirely, produce a strikingly similar phenotype. So the deletion is modelled
  as removing a dosage-sensitive hypothalamic developmental pathway of which SIM1
  is the best-characterised member, not as a single-gene disorder wearing a
  cytogenetic name.
pathophysiology:
- name: Interstitial Deletion of Dosage-Sensitive Genes at Proximal 6q
  description: >-
    The lesion is a heterozygous interstitial deletion of proximal 6q, usually de
    novo, whose extent varies between patients. That variability is the reason
    the syndrome resists a single-gene account: different deletions remove
    different combinations of dosage-sensitive genes, and the resulting
    phenotypes overlap without being identical. SIM1 at 6q16.3 is the gene most
    often invoked, and a separate ~350 kb critical region at 6q16.1 containing
    POU3F2 accounts for a smaller-deletion phenotype.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SIM1
    term:
      id: hgnc:10882
      label: SIM1
  - preferred_term: POU3F2
    term:
      id: hgnc:9215
      label: POU3F2
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the deletions revealed a ∼350 kb critical region on chromosome
      6q16.1 that encompasses a gene for proneuronal transcription factor POU3F2,
      which is important for hypothalamic development and function.
    explanation: >-
      Establishes a second critical region within proximal 6q, which is the basis
      for modelling this node as multi-genic rather than as SIM1 alone.
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6q16.1 deletions segregated with the phenotype in multiplex families
      and were shown to be de novo in four families
    explanation: >-
      Documents both segregation and the frequent de novo origin recorded in this
      node.
  downstream:
  - target: Loss of SIM1-Dependent Paraventricular Hypothalamic Development
    causal_link_type: DIRECT
    description: >-
      Deletions extending to 6q16.3 remove one copy of SIM1.
  - target: Loss of POU3F2-Dependent Hypothalamic Neuroendocrine Output
    causal_link_type: DIRECT
    description: >-
      Deletions covering the 6q16.1 critical region remove one copy of POU3F2,
      whether or not SIM1 is involved.
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The deletion removes neurodevelopmental transcription factors, and the
      delay is present even in the smallest POU3F2-only deletions, so it is
      drawn from the deletion itself rather than from either hypothalamic arm.
      Marked indirect because which of the deleted genes produces the delay, and
      through what developmental step, is exactly the open question this entry
      records in discussions.
- name: Loss of SIM1-Dependent Paraventricular Hypothalamic Development
  description: >-
    SIM1 is a transcription factor required for development of the
    paraventricular nucleus of the hypothalamus, the structure through which
    melanocortin signalling acts on appetite. Halving its dose degrades that
    development. The strongest evidence that this step alone is sufficient comes
    from outside the deletion syndrome: sequencing SIM1 in obesity cohorts found
    rare variants whose loss-of-function severity in a transcriptional assay
    tracked the obesity risk they conferred within families - a rare instance
    where the functional grading and the family risk were measured on the same
    variants.
  role: mechanism
  biological_scale: CELLULAR
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  evidence:
  - reference: PMID:23778136
    reference_title: >-
      Loss-of-function mutations in SIM1 contribute to obesity and
      Prader-Willi-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three mutations showed strong loss-of-function effects (p.T46R, p.H323Y,
      and p.T714A) and were associated with high intra-family risk for obesity,
      while the variants with mild or no effects on SIM1 activity were not
      associated with obesity within families.
    explanation: >-
      Couples measured loss of transcriptional activity to family obesity risk
      variant by variant, which is what makes this a dose-dependent mechanism
      rather than an association with the gene.
  - reference: PMID:23778136
    reference_title: >-
      Loss-of-function mutations in SIM1 contribute to obesity and
      Prader-Willi-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sim1 haploinsufficiency in mice induces hyperphagic obesity and
      developmental abnormalities of the brain.
    explanation: >-
      The animal-model counterpart, establishing that halving Sim1 dose is
      sufficient for the phenotype in mice.
  downstream:
  - target: Dysregulated Hypothalamic Control of Energy Balance
    causal_link_type: DIRECT
    description: >-
      A maldeveloped paraventricular nucleus cannot transduce melanocortin
      signalling into satiety.
  - target: Hypopituitarism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SIM1 is implicated in neuroendocrine lineage development, which has been
      proposed as the route to anterior pituitary deficiency; the intermediate
      steps are not established.
- name: Loss of POU3F2-Dependent Hypothalamic Neuroendocrine Output
  description: >-
    POU3F2 is a proneuronal transcription factor important for hypothalamic
    development, and zebrafish work places it downstream of SIM1 in the same
    pathway, controlling oxytocin expression in the neuroendocrine preoptic area.
    That ordering is what makes the two critical regions coherent rather than
    coincidental: deleting either gene interrupts the same axis at a different
    point, which is why the small POU3F2-only deletions reproduce the obesity and
    developmental phenotype without touching SIM1.
  role: mechanism
  biological_scale: CELLULAR
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  chemical_entities:
  - preferred_term: oxytocin
    modifier: DECREASED
    term:
      id: CHEBI:7872
      label: oxytocin
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using morpholino and mutant zebrafish models, we show that POU3F2 lies
      downstream of SIM1 and controls oxytocin expression in the hypothalamic
      neuroendocrine preoptic area.
    explanation: >-
      Establishes the epistatic ordering of the two genes and the specific
      neuroendocrine output affected, which is the claim of this node.
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that this finding is consistent with the expression patterns of
      POU3F2 and related genes in the human brain.
    explanation: >-
      The human bridge for the zebrafish result. Marked INDIRECT because
      consistency of expression pattern is an inference step, not a demonstration
      of the same epistasis in humans.
  downstream:
  - target: Dysregulated Hypothalamic Control of Energy Balance
    causal_link_type: DIRECT
    description: >-
      Loss of the downstream limb of the same hypothalamic axis converges on the
      same energy-balance failure.
- name: Dysregulated Hypothalamic Control of Energy Balance
  description: >-
    The convergence point. The leptin to melanocortin to SIM1 axis is the pathway
    dysregulated across several monogenic obesity syndromes, and interrupting it
    at either the SIM1 or the POU3F2 step leaves appetite unrestrained. The
    clinical expression is hyperphagia and susceptibility to obesity rather than
    obesity as an inevitability - the deletion sets a predisposition that
    environment can amplify or blunt, which is why the phenotype is variable even
    within a family carrying the same deletion.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The leptin > melanocortin > SIM1 pathway is dysregulated in multiple
      monogenic human obesity syndromes but its downstream targets are still
      unknown.
    explanation: >-
      Names the pathway this node represents and states, in the same sentence,
      that its downstream targets were unknown - which is the gap the POU3F2
      result addresses.
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a disorder of variable developmental delay, intellectual
      disability, and susceptibility to obesity and hyperphagia
    explanation: >-
      Characterises the outcome as susceptibility rather than as obligate
      obesity, which is the distinction this node's description turns on.
  downstream:
  - target: Polyphagia
    causal_link_type: DIRECT
    description: >-
      Loss of satiety signalling through the paraventricular nucleus.
  - target: Obesity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Obesity follows from sustained hyperphagia; the intervening energy balance
      is omitted here.
- name: Impaired Neurodevelopment
  description: >-
    Developmental delay and intellectual disability are as consistent a part of
    the syndrome as the obesity and are not secondary to it. Both SIM1 and POU3F2
    are neurodevelopmental transcription factors, and the delay is present in
    patients whose deletion is small enough to be POU3F2-only, so it is not
    simply a marker of how much chromosome has been lost.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In ten individuals from six families, with overlapping 6q16.1 deletions, we
      describe a disorder of variable developmental delay, intellectual
      disability, and susceptibility to obesity and hyperphagia.
    explanation: >-
      Reports the delay and intellectual disability in the small-deletion cohort,
      which is what establishes them as part of the core phenotype.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
    description: >-
      The clinical expression in infancy and early childhood.
  - target: Intellectual disability
    causal_link_type: DIRECT
    description: >-
      The expression once cognitive testing is possible.
phenotypes:
- name: Polyphagia
  category: Behavioral
  description: >-
    Hyperphagia is the behavioural core of the Prader-Willi-like resemblance and
    is what drives the obesity, rather than the obesity being a separate
    metabolic phenomenon.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hyperphagia
    term:
      id: HP:0002591
      label: Polyphagia
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a disorder of variable developmental delay, intellectual
      disability, and susceptibility to obesity and hyperphagia
    explanation: >-
      Names hyperphagia as part of the described disorder.
- name: Obesity
  category: Metabolic
  description: >-
    Early-onset and often severe. Described as a susceptibility rather than an
    obligate feature, which matters clinically because it means the outcome is
    partly modifiable.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  evidence:
  - reference: PMID:23778136
    reference_title: >-
      Loss-of-function mutations in SIM1 contribute to obesity and
      Prader-Willi-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, abnormalities in chromosome 6q16, a region that includes SIM1,
      were reported in obese children with a Prader-Willi-like syndrome
    explanation: >-
      Ties obesity to the 6q16 deletion specifically, in the Prader-Willi-like
      clinical context this entry describes.
- name: Hypotonia
  category: Neurological
  description: >-
    Infantile hypotonia is part of the Prader-Willi-like resemblance and
    typically precedes the hyperphagia. The evidence available here is about
    proximal 6q deletion patients as a group rather than about the 6q16 deletion
    specifically, which is why it is recorded at OCCASIONAL with INDIRECT
    evidence rather than asserted as a defining feature.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Infantile hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:19664229
    reference_title: >-
      Microdeletion of 6q16.1 encompassing EPHA7 in a child with mild
      neurological abnormalities and dysmorphic features: case report.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reported 6q deletion patients show a high incidence of mental retardation,
      ear anomalies, hypotonia, and postnatal growth retardation.
    explanation: >-
      Reports hypotonia among the recurring features of 6q deletion patients.
      Marked INDIRECT because the statement is about 6q deletions as a class, not
      about the 6q16 interval this entry is scoped to.
- name: Global developmental delay
  category: Neurological
  description: >-
    Variable in degree, and present even with the smallest deletions, which is
    what argues against reading it as a non-specific consequence of a large
    contiguous-gene loss.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a disorder of variable developmental delay, intellectual disability, and
      susceptibility to obesity and hyperphagia
    explanation: >-
      States developmental delay and its variability as part of the described
      disorder.
- name: Intellectual disability
  category: Neurological
  description: >-
    Reported across the described families, with degree varying alongside the
    developmental delay.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was dramatic phenotypic overlap among affected individuals who were
      independently ascertained without bias from clinical features
    explanation: >-
      Supports the consistency of the phenotype across families and, importantly,
      that the overlap was not produced by selecting patients on those features.
- name: Hypopituitarism
  category: Endocrine
  description: >-
    Reported in a patient with a SIM1-containing interstitial 6q deletion, and
    notable for being absent on endocrine testing in infancy and appearing only
    in later childhood and adolescence. That timing is the practical point: a
    normal early endocrine screen does not exclude it.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hypopituitarism
    term:
      id: HP:0040075
      label: Hypopituitarism
  evidence:
  - reference: PMID:24038875
    reference_title: >-
      Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi
      syndrome-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed endocrine evaluation of the propositus during childhood and
      adolescence revealed hypopituitarism, though initial endocrine evaluations
      during infancy were unremarkable.
    explanation: >-
      Records both the finding and the age dependence that makes early screening
      unreliable for it.
  notes: >-
    This rests on a single reported patient. Frequency is recorded as OCCASIONAL
    on that basis, and the authors themselves frame it as a possibility to be
    looked for rather than an established feature.
- name: Short stature
  category: Growth
  description: >-
    Raised as a possible consequence of the pituitary involvement rather than as
    an independent skeletal feature, which is why it is grouped with the
    endocrine phenotype here.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:24038875
    reference_title: >-
      Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi
      syndrome-like features.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient raises the possibility that hypopituitarism may be part of the
      phenotype, especially short stature, caused by interstitial 6q deletion.
    explanation: >-
      Marked INDIRECT because the authors state short stature as a possibility
      raised by one patient, not as an established feature of the syndrome.
genetic:
- name: SIM1
  notes: >-
    The gene most often invoked for this syndrome, at 6q16.3. Loss-of-function
    point mutations produce severe obesity with Prader-Willi-like features
    without any deletion, so SIM1 haploinsufficiency is sufficient for a large
    part of the phenotype. That does not make it the whole explanation for the
    deletion syndrome; see the discussion on deletion extent.
  gene_term:
    preferred_term: SIM1
    term:
      id: hgnc:10882
      label: SIM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23778136
    reference_title: >-
      Loss-of-function mutations in SIM1 contribute to obesity and
      Prader-Willi-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our genetic and functional studies demonstrate a firm link between SIM1
      loss of function and severe obesity associated with, or independent of,
      Prader-Willi-like features.
    explanation: >-
      The authors' summary claim of a demonstrated genetic and functional link.
- name: POU3F2
  notes: >-
    At 6q16.1, within a ~350 kb critical region defined by deletions that do not
    include SIM1. Zebrafish work places it downstream of SIM1, controlling
    oxytocin expression in the neuroendocrine preoptic area, so the two genes
    interrupt one axis at different points rather than acting independently.
  gene_term:
    preferred_term: POU3F2
    term:
      id: hgnc:9215
      label: POU3F2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the deletions revealed a ∼350 kb critical region on chromosome
      6q16.1 that encompasses a gene for proneuronal transcription factor POU3F2,
      which is important for hypothalamic development and function.
    explanation: >-
      Defines the critical region and the gene it contains, which is what makes
      POU3F2 causative rather than merely deleted.
inheritance:
- name: Autosomal dominant, usually de novo
  description: >-
    A heterozygous deletion, de novo in most reported patients but demonstrably
    transmitted in multiplex families where it segregated with the phenotype.
    Both facts matter clinically: recurrence risk is low for most parents, and
    familial cases exist and should be looked for.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26833329
    reference_title: >-
      Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity
      and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6q16.1 deletions segregated with the phenotype in multiplex families
      and were shown to be de novo in four families
    explanation: >-
      Records both the segregation in families and the de novo origin in others,
      which is exactly the mixed picture this entry describes.
diagnosis:
- name: Chromosomal microarray
  description: >-
    The diagnostic test, since the lesion is a submicroscopic copy-number change
    of variable extent. Array CGH is what defined the deletion boundaries in the
    reported series and is what allows the deletion to be sized, which the entry
    treats as clinically relevant rather than incidental.
  evidence:
  - reference: PMID:21045960
    reference_title: >-
      Interstitial Deletions at 6q14.1-q15 Associated with Obesity, Developmental
      Delay and a Distinct Clinical Phenotype.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array comparative genomic hybridisation was used to diagnose 2 children
      with obesity and developmental delay
    explanation: >-
      Shows array CGH as the diagnostic modality for this class of proximal 6q
      deletion.
- name: Longitudinal endocrine evaluation
  description: >-
    Recommended specifically because the pituitary phenotype can be absent in
    infancy and appear later, so a single early assessment is not sufficient to
    exclude it.
  evidence:
  - reference: PMID:24038875
    reference_title: >-
      Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi
      syndrome-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that detailed endocrine evaluation and longitudinal endocrine
      follow up be performed in individuals with proximal interstitial 6q
      deletion involving SIM1
    explanation: >-
      The authors' explicit recommendation, which is the substance of this
      diagnostic entry.
treatments:
- name: Hormone Replacement for Pituitary Deficiency
  description: >-
    Where hypopituitarism is found, replacing the deficient hormones is the
    intervention. Its value depends entirely on detecting the deficiency, which
    is why it is paired with longitudinal endocrine surveillance rather than
    offered on the basis of the deletion alone.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  evidence:
  - reference: PMID:24038875
    reference_title: >-
      Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi
      syndrome-like features.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early identification of endocrine abnormalities can improve clinical
      outcome by allowing timely introduction of hormone replacement therapy.
    explanation: >-
      States the intervention and ties its benefit to the timing of detection.
  target_mechanisms:
  - target: Hypopituitarism
    treatment_effect: BYPASSES
    description: >-
      Replacement supplies the missing hormone downstream of the developmental
      defect; it does nothing to the hypothalamic lesion itself.
    evidence:
    - reference: PMID:24038875
      reference_title: >-
        Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and
        Prader-Willi syndrome-like features.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Early identification of endocrine abnormalities can improve clinical
        outcome by allowing timely introduction of hormone replacement therapy.
      explanation: >-
        Supports the therapeutic role. Marked INDIRECT because outcome
        improvement is asserted rather than measured against a comparator.
  notes: >-
    No disease-modifying treatment exists for the deletion. This entry lists only
    what the cited literature supports; weight management is standard care for
    the obesity but was not supported by an evidence-quality statement in the
    sources used here, so it is not listed as a curated treatment.
differential_diagnoses:
- name: Prader-Willi syndrome
  description: >-
    The disorder this one imitates, and the reason the label "Prader-Willi-like"
    persists. Distinguished by 15q11-q13 methylation testing; the resemblance is
    phenotypic convergence on hypothalamic dysfunction, not shared genetics.
- name: 6q14.1-q15 deletion syndrome
  description: >-
    An adjacent proximal 6q deletion that produces obesity and developmental
    delay strikingly similar to the SIM1-containing deletions while sparing SIM1
    entirely. Its existence is the main reason this entry does not model 6q16
    deletion as SIM1 haploinsufficiency alone.
- name: MC4R-related obesity
  description: >-
    Hyperphagic early-onset obesity from a defect in the same melanocortin axis,
    but without the developmental delay and intellectual disability.
discussions:
- discussion_id: del6q16_which_genes_drive_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which genes in proximal 6q are responsible for which components of the
    phenotype, and how much of the syndrome does SIM1 haploinsufficiency actually
    account for?
  rationale: >-
    SIM1 is the standard attribution and is well supported: its loss-of-function
    point mutations produce severe obesity with Prader-Willi-like features on
    their own. But two findings resist a SIM1-only model. A ~350 kb critical
    region at 6q16.1 containing POU3F2 and not SIM1 produces overlapping
    developmental delay and obesity susceptibility, and deletions at the adjacent
    6q14.1-q15 interval sparing SIM1 entirely produce a strikingly similar
    phenotype. Whether that reflects several independent dosage-sensitive genes,
    one pathway interruptible at several points, or a regulatory landscape whose
    disruption matters more than gene content, is not resolved by anything
    reviewed here. It is a practical question, not a taxonomic one: it determines
    whether deletion size should be expected to predict severity.
  attaches_to:
  - pathophysiology#Interstitial Deletion of Dosage-Sensitive Genes at Proximal 6q
  - genetic#SIM1
  - genetic#POU3F2
  evidence:
  - reference: PMID:21045960
    reference_title: >-
      Interstitial Deletions at 6q14.1-q15 Associated with Obesity, Developmental
      Delay and a Distinct Clinical Phenotype.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on 2 patients with interstitial deletions at 6q14.1-q15
      presenting with obesity and symptoms strikingly similar to those reported
      for deletions involving the SIM1 gene despite not having a deletion of this
      gene.
    explanation: >-
      A SIM1-sparing deletion reproducing the phenotype, which is the specific
      observation that makes a SIM1-only account insufficient.
  - reference: PMID:19664229
    reference_title: >-
      Microdeletion of 6q16.1 encompassing EPHA7 in a child with mild
      neurological abnormalities and dysmorphic features: case report.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that deletion of EPHA7 plays a role in the neurologic
      and dysmorphic features, including developmental delay, hypotonia, and ear
      malformations, observed in some 6q deletion patients.
    explanation: >-
      Proposes a third dosage-sensitive gene at 6q16.1, distinct from both SIM1
      and POU3F2, as a contributor to the neurodevelopmental features. Marked
      INDIRECT because it is a single case report proposing a role rather than
      demonstrating one, but it is directly on the question of how many genes are
      involved.
notes: >-
  Curated from a Perplexity deep-research report used as a lead only. The report
  carried validation frontmatter reporting 7 of 7 references resolved with a
  confabulation rate of 0.0, but it cites 18 sources, so 7 is the number the
  validator could check rather than a clean bill for the citation list; 5 of
  those 7 were judged on topic, and one entry in the list is the bare string
  "ACMG/AMP". Its term validation was more informative: 8 of 20 checked labels
  named a different term than the report claimed, so its CURIEs were not reused
  and every binding here was resolved through OAK. Every reference retained was
  resolved to a PMID, fetched into references_cache, and quoted from the fetched
  text.
review_notes: >-
  The entry deliberately does not model this as SIM1 haploinsufficiency under a
  cytogenetic name, even though that is the usual shorthand. Two published
  observations block it: a POU3F2-containing critical region at 6q16.1 that
  excludes SIM1, and SIM1-sparing deletions at the adjacent 6q14.1-q15 interval
  producing a similar phenotype. Both are cited, and the unresolved question of
  gene-to-phenotype attribution is recorded as a discussion rather than being
  settled silently in favour of the conventional answer.

name: 6q16 Deletion Syndrome
creation_date: '2026-09-01T13:40:08Z'
category: Genetic
parents:
- Contiguous Gene Deletion Syndrome
- Syndromic Obesity
disease_term:
  preferred_term: 6q16 deletion syndrome
  term:
    id: MONDO:0015749
    label: 6q16 deletion syndrome
synonyms:
- proximal interstitial 6q deletion
- Prader-Willi-like syndrome due to 6q16 deletion
description: 6q16 deletion syndrome comprises overlapping heterozygous chromosome deletions with variable developmental delay, intellectual disability, behavioral features and growth abnormalities. Some intervals confer susceptibility to hyperphagia and obesity. SIM1-containing 6q16.2-q16.3 deletions and SIM1-sparing, POU3F2-containing 6q16.1 deletions provide distinct genetic routes to an overlapping Prader-Willi-like phenotype; obesity is not obligatory. More proximal EPHA7-containing 6q16.1 deletions principally support neurodevelopmental susceptibility. Gene content, age and additional genetic findings limit prediction from the cytogenetic label alone. Endocrine deficiency has been reported in a SIM1-containing deletion and can emerge after normal infant testing.
has_subtypes:
- name: SIM1-containing 6q16.2-q16.3 deletions
  description: Intervals including SIM1 are associated with variable obesity and neurodevelopmental findings. These are gene-content groups rather than uniform recurrent rearrangements.
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Except for patients no. 14 and 15, all patients had deletions that included the SIM1 gene.
    explanation: SIM1 involvement is determined by deletion boundaries; it is absent from two intervals in this cohort.
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: only 8 of 13 patients with SIM1 deletion exhibited obesity, in agreement with incomplete penetrance of SIM1 haploinsufficiency.
    explanation: The authors interpret variable obesity as incomplete penetrance. The cohort includes a fetus and the tables have discrepant obesity totals, so this quoted count is not used as a penetrance estimate.
- name: SIM1-sparing POU3F2-containing 6q16.1 deletions
  description: Small overlapping intervals include POU3F2 and FBXL4 while sparing SIM1. Developmental impairment and later hyperphagia or obesity overlap the SIM1-associated phenotype, but individual children can remain nonobese.
  evidence:
  - reference: PMID:26833329
    reference_title: Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In ten individuals from six families, with overlapping 6q16.1 deletions, we describe a disorder of variable developmental delay, intellectual disability, and susceptibility to obesity and hyperphagia.
    explanation: Clinical overlap occurs in SIM1-sparing deletions; the cellular route from gene dosage to development and appetite remains incompletely resolved.
  - reference: PMID:35581197
    reference_title: Clinical course of a Japanese patient with developmental delay linked to a small 6q16.1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The six families described in the report by Kasher et al. had the deletion of the POU3F2 and FBXL4 genes, although the deletion size was different in each family
    explanation: Identifies both genes in the overlapping interval; these are not POU3F2-only deletions.
- name: EPHA7-containing proximal 6q16.1 deletions
  description: More proximal intervals, including deletions restricted to EPHA7, are associated with neurodevelopmental susceptibility with incomplete penetrance. Their clinical findings are not automatically attributable to the SIM1/POU3F2 appetite pathway.
  evidence:
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Four patients had tiny deletions involving only EPHA7, suggesting a critical role of EPHA7 in a neurodevelopmental disability phenotype.
    explanation: Single-gene deletions strengthen the locus association but the authors describe a susceptibility effect with incomplete penetrance.
  - reference: PMID:34176129
    reference_title: EPHA7 haploinsufficiency is associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The deletions were inherited in nine out of 12 patients, suggesting variable expressivity and incomplete penetrance.
    explanation: The selected cohort supports variable expression; it does not estimate population penetrance.
pathophysiology:
- name: Heterozygous 6q16 Deletion
  description: A variable interstitial deletion removes one copy of the genes within its specific boundaries. No single gene is deleted in every interval represented here; de novo and inherited events occur.

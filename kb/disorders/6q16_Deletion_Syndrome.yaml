- discussion_id: del6q16_human_model_bridge
  kind: HUMAN_MODEL_MISMATCH
  prompt: Which experimentally identified transcriptional and neuroendocrine effects occur in human deletion carriers?
  rationale: SIM1 reporter loss, POU3F2 variant effects and zebrafish oxytocin-expression regulation support biological hypotheses. None establishes universal human paraventricular neuron loss, circulating oxytocin deficiency or a single causal route from the deletion to obesity and developmental impairment.

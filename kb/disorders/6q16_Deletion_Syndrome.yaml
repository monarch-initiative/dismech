- name: Zebrafish sim1-pou3f2 neuroendocrine pathway models
  species: Zebrafish
  publication: PMID:26833329
  description: Morpholino and mutant zebrafish experiments test the relationship between sim1, pou3f2 and preoptic oxytocin expression. The available abstract supports pathway ordering but does not report a human deletion model, clinical obesity rescue or a complete deletion-specific mechanism.

diagnosis:
- name: Chromosomal microarray and deletion-boundary assessment
  description: Chromosomal microarray establishes the copy-number loss and identifies whether SIM1, POU3F2, EPHA7 or other genes are involved. Additional CNVs or chromosome rearrangements can affect interpretation.
  evidence:
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Microarray studies were done in all 15 patients.
    explanation: The disease-specific series used array analysis in every participant.
  - reference: PMID:25351778
    reference_title: Incomplete penetrance and phenotypic variability of 6q16 deletions including SIM1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: FISH was performed using chromosomal preparations according to standard protocols to confirm the 6q deletions characterised by microarray.
    explanation: Documents orthogonal confirmation.
- name: Parental testing
  description: Determine whether the deletion is de novo or inherited, and interpret recurrence and expression in the family rather than assuming every deletion is sporadic.
  evidence:
  - reference: PMID:26833329
    reference_title: Small 6q16.1 Deletions Encompassing POU3F2 Cause Susceptibility to Obesity and Variable Developmental Delay with Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The 6q16.1 deletions segregated with the phenotype in multiplex families and were shown to be de novo in four families
    explanation: Documents both familial transmission and de novo occurrence.
- name: Exome-based copy-number analysis
  description: Validated copy-number analysis of trio exome data identified a 780-kb SIM1-sparing deletion after normal G-banding in one child. A normal conventional karyotype does not exclude a submicroscopic deletion.
  evidence:
  - reference: PMID:35581197
    reference_title: Clinical course of a Japanese patient with developmental delay linked to a small 6q16.1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Exome sequencing data were analyzed using the eXome Hidden Markov Model (XHMM) and modified Nord’s method
    explanation: Case-specific diagnostic approach.
- name: Longitudinal endocrine evaluation
  description: Authors of the SIM1-containing deletion case recommend detailed endocrine assessment and follow-up because hypopituitarism appeared after unremarkable infant testing. The report does not establish an evidence-based universal interval for surveillance.
  evidence:
  - reference: PMID:24038875
    reference_title: Endocrine phenotype of 6q16.1-q21 deletion involving SIM1 and Prader-Willi syndrome-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we suggest that detailed endocrine evaluation and longitudinal endocrine follow up be performed in individuals with proximal interstitial 6q deletion involving SIM1
    explanation: Explicit case-report recommendation.
- name: Growth and appetite follow-up
  description: Monitor growth and emerging hyperphagia or obesity, including in initially nonobese children with a POU3F2-containing deletion. This is a clinical follow-up recommendation; prevention efficacy and a universal schedule were not established.
  evidence:
  - reference: PMID:35581197
    reference_title: Clinical course of a Japanese patient with developmental delay linked to a small 6q16.1 deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thus, we need to pay attention to her symptoms of obesity.
    explanation: Case-report recommendation prompted by age-dependent obesity in previously reported patients.

- name: Reduced POU3F2 Gene Dosage
  description: SIM1-sparing 6q16.1 deletions remove one POU3F2 copy together with FBXL4 and, depending on their extent, additional genes. Subsequent intragenic-variant evidence strengthens POU3F2 as a contributor without making the whole chromosomal disorder monogenic.
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

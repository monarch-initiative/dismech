progression:
- phase: Neonatal and infantile presentation
  age_range: Neonatal period through infancy
  notes: >-
    Orphadata assigns neonatal onset. Hypotonia may be present at birth, and
    oromotor dysfunction with poor sucking, chewing, or swallowing is common in
    neonates and infants, sometimes requiring tube feeding.
  evidence:

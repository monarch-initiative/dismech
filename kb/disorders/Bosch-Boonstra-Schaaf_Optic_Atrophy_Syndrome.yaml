review_notes: >-
  The 2026 re-review expanded the original two-node pathograph into an
  allele-aware model that distinguishes established NR2F1 functional
  insufficiency from possible variant-specific dominant-negative effects and
  retains mouse neuronal mitochondrial dysfunction as a provisional branch.
  Every pathograph edge now has a causal-link classification and direct
  evidence, and all represented phenotypes are connected. Current Orphadata
  records supply the exact MONDO mapping, neonatal onset, phenotype frequencies,
  and the class-only prevalence estimate; the conflicting GeneReviews
  prevalence range is retained rather than silently reconciled. The review also
  adds structured progression, high but variable clinical burden, molecular
  diagnosis, two explicit differentials, multisystem supportive management,
  GSE106302 and GSE228566, and open questions about allele mechanism, prevalence,
  lifelong visual stability, and model-to-human mitochondrial translation.
  ClinicalTrials.gov API queries for the disease name, NR2F1-related
  neurodevelopmental disorder, and NR2F1 were checked on 2026-07-24 and returned
  no disease-specific studies, so clinical_trials remains empty. No
  disease-modifying treatment is established. The D2P audit was used to flag
  external phenotype assertions; central source-backed findings were added, but
  granular rows without precise cached human evidence were not bulk-imported.
  The bundled deep-research report was used only to discover sources; all
  included claims were checked against direct cached publications or structured
  source records.

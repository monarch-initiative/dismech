name: Bosch-Boonstra-Schaaf Optic Atrophy Syndrome
creation_date: "2026-06-04T00:00:00Z"
synonyms:
- BBSOAS
- Optic atrophy-intellectual disability syndrome
- NR2F1-related neurodevelopmental disorder
description: >-
  Bosch-Boonstra-Schaaf optic atrophy syndrome (BBSOAS) is a rare autosomal
  dominant neurodevelopmental disorder caused by pathogenic NR2F1 variants or
  deletions. NR2F1 (COUP-TFI) is a nuclear-receptor transcription factor
  essential for neural and ocular development. Gene deletion and
  loss-of-function variants cause haploinsufficiency, while some DNA-binding
  domain variants may additionally act through a dominant-negative mechanism.
  The variable phenotype combines developmental delay or intellectual
  disability with optic atrophy, optic nerve hypoplasia and/or cerebral visual
  impairment; hypotonia, epilepsy, autistic features, feeding or oromotor
  dysfunction, and hearing impairment occur in subsets. Available longitudinal
  data favor an early developmental, generally non-progressive visual disorder.
category: Mendelian
parents:
- hereditary disease
- autosomal dominant syndromic intellectual disability

- name: Optic nerve glial imbalance
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Nr2f1-deficient mouse optic nerves show an imbalance between oligodendrocytes
    and astrocytes. This model-defined glial phenotype provides a distinct
    potential arm of optic-nerve pathology, but has not been established in
    human BBSOAS tissue.
  evidence:
  - reference: DOI:10.15252/emmm.201910291
    reference_title: "Mouse Nr2f1 haploinsufficiency unveils new pathological mechanisms of a human optic atrophy syndrome"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably,Nr2f1-deficient optic nerves develop an imbalance between oligodendrocytes and astrocytes leading to postnatal hypomyelination and astrogliosis.
    explanation: >-
      This is direct model-organism evidence for an optic-nerve glial imbalance,
      not evidence that the same cellular imbalance has been measured in people.
  downstream:
  - target: Postnatal optic nerve hypomyelination
    causal_link_type: DIRECT
  - target: Optic nerve astrogliosis
    causal_link_type: DIRECT
- name: Postnatal optic nerve hypomyelination
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Nr2f1-haploinsufficient mouse optic nerves undergo postnatal hypomyelination,
    a model phenotype that can be chemically rescued early in life. Its causal
    contribution and treatment responsiveness in human BBSOAS remain unknown.
  evidence:
  - reference: DOI:10.15252/emmm.201910291
    reference_title: "Mouse Nr2f1 haploinsufficiency unveils new pathological mechanisms of a human optic atrophy syndrome"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, some of these clinical features, such the optic nerve hypomyelination, could be rescued by chemical drug treatment in early postnatal life.
    explanation: >-
      The mouse study demonstrates a preclinical early-postnatal chemical-rescue
      signal for optic-nerve hypomyelination, without establishing a human therapy.
  downstream:
  - target: Optic atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Optic nerve astrogliosis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-

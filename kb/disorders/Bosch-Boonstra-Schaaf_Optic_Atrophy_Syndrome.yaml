diagnosis:
- name: Clinical and imaging recognition
  description: >-
    BBSOAS should be considered when developmental delay or intellectual
    disability co-occurs with optic atrophy, optic nerve hypoplasia, cerebral
    visual impairment, hypotonia, speech difficulty, seizures, feeding
    difficulty, or behavioral manifestations. Thin corpus callosum and
    hypoplastic optic nerves or chiasm on MRI are strongly suggestive, but no
    consensus clinical diagnostic criteria or pathognomonic feature exists.
  presence: A compatible neurodevelopmental, visual, and brain-imaging pattern prompts NR2F1 testing.

    explanation: GeneReviews defines the early feeding and oromotor course.
- phase: Neurodevelopmental and visual recognition
  age_range: Infancy through early childhood
  notes: >-
    Developmental and speech delays emerge as milestones are missed. Visual
    impairment is usually recognized in early childhood after nystagmus,
    strabismus, poor fixation, or neurodevelopmental concerns prompt
    ophthalmologic assessment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK587319/?report=printable
    reference_title: "NR2F1-Related Neurodevelopmental Disorder - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is usually detected in early childhood when they are examined following
      referrals for evaluation of nystagmus, strabismus, poor fixation, and/or
      concerns about neurodevelopmental progress.
    explanation: GeneReviews directly describes the typical recognition window.
- phase: Longitudinal visual and neurologic course
  age_range: Childhood through adulthood
  notes: >-
    Available cohort follow-up supports congenital, generally non-progressive
    visual impairment rather than the progressive retinal-ganglion-cell loss
    typical of several other inherited optic neuropathies. Data on progression
    of behavior and other neurologic findings, and on adult natural history,
    remain limited.
  evidence:

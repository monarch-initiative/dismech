discussions:
- discussion_id: bbsoas_variant_mechanism
  prompt: >-
    Which NR2F1 alleles act as simple loss-of-function variants and which exert
    clinically meaningful dominant-negative or other altered-protein effects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#NR2F1
  - pathophysiology#NR2F1 functional insufficiency and variant-specific dominant-negative effects
  rationale: >-
    Haploinsufficiency is established for deletions and many loss-of-function
    alleles. DNA-binding-domain variants may act dominant negatively and show a
    more severe cohort-level phenotype, but available series are small and the
    effect cannot be generalized to every missense or truncating allele.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK587319/?report=printable
    reference_title: "NR2F1-Related Neurodevelopmental Disorder - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preliminary genotype-phenotype correlations based on published reports to date suggest
    explanation: GeneReviews explicitly labels the genotype-phenotype correlation preliminary.
- discussion_id: bbsoas_prevalence_discrepancy
  prompt: >-
    What is the true population prevalence of BBSOAS, and why do current
    Orphadata and literature estimates differ by at least an order of magnitude?
  kind: CONTROVERSY
  status: OPEN
  rationale: >-
    Orphadata provides a class-only estimate below one per million, whereas
    GeneReviews cites approximately one per 100,000 to one per 250,000.
    Underdiagnosis, different denominators, and reuse of early case counts may
    contribute, but no population-based study resolves the discrepancy.
  evidence:

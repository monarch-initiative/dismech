- name: Neuronal mitochondrial network dysregulation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In mouse models, Nr2f1 loss reduces mitochondrial mass, fragments the
    mitochondrial network, and downregulates mitochondrial proteins in newborn
    neurons. This is a plausible secondary contributor to impaired neuronal
    survival and integration, but it has not yet been demonstrated in human
    BBSOAS neural tissue.
  cell_types:

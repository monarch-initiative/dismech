genetic:
- name: NR2F1
  association: Pathogenic loss-of-function and variant-specific dominant-negative effects
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NR2F1
    term:
      id: hgnc:7975
      label: NR2F1
  notes: >-
    BBSOAS is caused by heterozygous NR2F1 sequence variants or deletions.
    Whole-gene deletion and many truncating or loss-of-function alleles produce
    haploinsufficiency. DNA-binding-domain missense variants can exert an
    additional dominant-negative effect and are associated with more severe
    neurodevelopmental manifestations, but genotype-phenotype correlations
    remain preliminary and should not be treated as deterministic. Additional
    missense variants outside the canonical DBD have been reported, including
    p.Phe110Leu, found in patients with early-onset developmental and epileptic
    encephalopathy.
  evidence:
  - reference: PMID:32275123
    reference_title: "Phenotypic expansion of Bosch-Boonstra-Schaaf optic atrophy syndrome and further evidence for genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bosch-Boonstra-Schaaf Optic Atrophy Syndrome (BBSOAS) is an autosomal
      dominant neurodevelopmental disorder caused by loss-of-function variants
      in NR2F1
    explanation: Establishes NR2F1 loss-of-function variants as the genetic cause of BBSOAS.
  - reference: PMID:32275123
    reference_title: "Phenotypic expansion of Bosch-Boonstra-Schaaf optic atrophy syndrome and further evidence for genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we provide additional evidence for genotype-phenotype correlations,
      specifically supporting a more severe phenotype associated with DBD
      variants.
    explanation: Supports the genotype-phenotype correlation that DNA-binding domain variants confer a more severe phenotype.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK587319/?report=printable
    reference_title: "NR2F1-Related Neurodevelopmental Disorder - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency due to either gene deletion or loss-of-function
      variants. Single-nucleotide variants in the DNA-binding domain may cause a
      dominant-negative effect.
    explanation: >-
      GeneReviews distinguishes the main loss-of-function mechanism from the
      variant-class-specific dominant-negative possibility.
  - reference: PMID:42606787
    reference_title: "A de novo NR2F1 c.330 C > A variant in Bosch-Boonstra-Schaaf optic atrophy syndrome presenting with early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband was a 14.5-month-old female who presented with early-onset
      neurological symptoms, including severe hypotonia, global developmental
      delay, drug-resistant seizures, bilateral optic atrophy, hearing loss, and
      structural brain anomalies.
    explanation: >-
      Case report documents a de novo NR2F1 p.Phe110Leu missense variant
      (c.330C>A) classified as likely pathogenic in a patient with early-onset
      BBSOAS presenting as developmental and epileptic encephalopathy with
      drug-resistant seizures, expanding the genotypic and phenotypic spectrum.

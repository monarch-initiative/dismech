clinical_burden:
  burden_level: HIGH
  rationale: >-
    BBSOAS commonly produces lifelong intellectual or developmental disability
    together with visual impairment. Epilepsy, feeding or swallowing
    dysfunction, hypotonia, autism-spectrum manifestations, hearing impairment,
    and mobility or communication needs create substantial multidisciplinary
    care and surveillance burden in many individuals. Severity is highly
    variable, and a HIGH disease-level burden does not imply severe expression
    in every affected person.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK587319/?report=printable
    reference_title: "NR2F1-Related Neurodevelopmental Disorder - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NR2F1-related neurodevelopmental disorder (NR2F1-NDD) is characterized by
      developmental delay / intellectual disability (ranging from profound to
      mild) and is commonly associated with hypotonia, visual impairment (due to
      optic nerve abnormalities and/or cerebral visual impairment), epilepsy,
      and behavioral manifestations
    explanation: >-
      The core and recurrent multisystem manifestations support substantial
      lifelong functional and care needs while documenting wide severity.

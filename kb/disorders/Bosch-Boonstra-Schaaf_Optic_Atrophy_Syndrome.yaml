animal_models:
- species: Mouse
  genotype: Nr2f1 heterozygous knockout (Nr2f1+/-)
  description: >-
    A heterozygous Nr2f1 knockout mouse recapitulates the dosage-sensitive
    genetics of BBSOAS (caused by heterozygous NR2F1 variants) and reproduces
    core neurological phenotypes, including altered learning/memory, hearing
    defects, neonatal hypotonia, and decreased hippocampal volume, together with
    impaired hippocampal synaptic plasticity.
  genes:
  - preferred_term: Nr2f1
    term:
      id: hgnc:7975
      label: NR2F1
  associated_phenotypes:
  - Hypotonia
  - Hearing impairment
  - Impaired learning and memory
  evidence:
  - reference: PMID:31600777
    reference_title: "Nr2f1 heterozygous knockout mice recapitulate neurological phenotypes of Bosch-Boonstra-Schaaf optic atrophy syndrome and show impaired hippocampal synaptic plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we investigated a heterozygous knockout mouse model and found that this
      model recapitulates some of the neurological phenotypes of BBSOAS,
      including altered learning/memory, hearing defects, neonatal hypotonia and
      decreased hippocampal volume.
    explanation: >-
      The Nr2f1+/- mouse recapitulates core BBSOAS neurological phenotypes,
      supporting NR2F1 haploinsufficiency as the disease mechanism.
- species: Mouse
  genotype: Nr2f1 mutant
  description: >-
    Nr2f1 mutant mice display abnormal retinogenesis with decreased retinal
    ganglion cell density and disrupted retinal ganglion cell axonal guidance
    from the neural retina into the optic stalk, recapitulating the optic nerve
    hypoplasia seen in BBSOAS and supporting a developmental origin of the visual
    defect.
  genes:
  - preferred_term: Nr2f1
    term:
      id: hgnc:7975
      label: NR2F1
  associated_phenotypes:
  - Optic nerve hypoplasia
  evidence:
  - reference: PMID:34466801
    reference_title: "Pathogenic NR2F1 variants cause a developmental ocular phenotype recapitulated in a mutant mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Abnormal retinogenesis in early stages of development was observed in
      Nr2f1 mutant mice with decreased retinal ganglion cell density and
      disruption of retinal ganglion cell axonal guidance from the neural retina
      into the optic stalk, accounting for the development of optic nerve
      hypoplasia.
    explanation: >-
      Nr2f1 mutant mice recapitulate the ocular phenotype, supporting a
      developmental origin of the optic nerve hypoplasia seen in BBSOAS.
- species: Mouse
  genotype: >-
    Conditional Nr2f1 loss in the adult hippocampal neurogenic niche and
    heterozygous Nr2f1 loss in a BBSOAS model
  description: >-
    Nr2f1 loss reduces mitochondrial mass, fragments mitochondria, and lowers
    key mitochondrial proteins in newborn neurons; heterozygous mice also show
    dysregulated nuclear-encoded mitochondrial genes and proteins in brain.
  genes:
  - preferred_term: Nr2f1
    term:
      id: hgnc:7975
      label: NR2F1
  associated_phenotypes:
  - Reduced mitochondrial mass
  - Mitochondrial fragmentation
  - Impaired newborn-neuron survival and integration
  evidence:
  - reference: PMID:37260288
    reference_title: "NR2F1 shapes mitochondria in the mouse brain, providing new insights into Bosch-Boonstra-Schaaf optic atrophy syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      conditional NR2F1 loss of function within the adult mouse hippocampal
      neurogenic niche results in a reduced mitochondrial mass associated with
      mitochondrial fragmentation and downregulation of key mitochondrial
      proteins in newborn neurons
    explanation: >-
      The mouse study directly defines the provisional mitochondrial branch of
      the BBSOAS pathograph.

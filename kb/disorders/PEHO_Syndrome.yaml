    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with PEHO syndrome and those with other progressive, degenerative
      cerebellar diseases had lower levels of CSF IGF-1 than the controls with
      other neurologic diseases.
    explanation: Low CSF IGF-1 in eight clinically defined PEHO patients.
- name: Elevated CSF nitrate and nitrite
  presence: Increased
  notes: >-
    CSF nitric oxide metabolites are markedly raised in PEHO and, to a lesser
    degree, PEHO-like patients. The finding is not specific and was measured
    before genetic diagnosis was available.
  evidence:
  - reference: PMID:10840402
    reference_title: "Markedly elevated nitrate/nitrite levels in the cerebrospinal fluid of children with progressive encephalopathy with edema, hypsarrhythmia, and optic atrophy (PEHO syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NNx levels were markedly higher in both PEHO (mean, 48 microM; p <
      0.001) and PEHO-like (22 microM; p < 0.003) patients as compared with the
      controls (6 microM)
    explanation: Reports the CSF nitrate/nitrite elevation.
genetic:
- name: ZNHIT3
  association: Biallelic pathogenic variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ZNHIT3
    term:
      id: hgnc:12309
      label: ZNHIT3
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    ClinGen has no gene-disease validity record for ZNHIT3, so no validity tier
    is recorded. Non-Finnish cohorts of clinically defined PEHO and PEHO-like
    patients carried no ZNHIT3 variants, so ZNHIT3 explains the Finnish founder
    disease and rare compound heterozygotes rather than the wider clinical
    phenotype. Complete Znhit3 loss arrests mouse development at the morula
    stage (PMID:40178020), which suggests that the reported human genotypes
    retain partial ZNHIT3 function.
  variants:
  - name: c.92C>T p.(Ser31Leu)
    description: >-
      Finnish founder missense variant in the zinc finger HIT domain
      (NM_004773.3), homozygous in the Finnish patients and found in trans with
      a second variant in the first non-Finnish patient. It is the most frequent
      ZNHIT3 variant in Finnish population data.
    evidence:
    - reference: PMID:28335020
      reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a homozygous missense substitution of leucine for serine at codon 31 in
        ZNHIT3 was identified as the primary cause of PEHO syndrome
      explanation: Establishes p.Ser31Leu as the founder cause.
    - reference: PMID:28899015
      reference_title: "The phenotypic and molecular spectrum of PEHO syndrome and PEHO-like disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the p.Ser31Leu variant represents the most frequent single nucleotide
        polymorphism in ZNHIT3 (rs148890852), being carried by 30 (of a total
        of 39) subjects from a cohort of 3298 Finnish individuals
      explanation: Population data show Finnish enrichment of the founder allele.
  - name: c.41G>T p.(Cys14Phe)
    description: >-
      Missense variant at a conserved zinc finger HIT domain residue, found in
      trans with p.Ser31Leu in an Estonian patient meeting all PEHO criteria.
    evidence:
    - reference: PMID:31048081
      reference_title: "PEHO syndrome caused by compound heterozygote variants in ZNHIT3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified biallelic missense variants in ZNHIT3 gene: the c.92C > T
        p.(Ser31Leu) variant (NM_004773.3), which is described previously as
        causing PEHO syndrome and the second novel variant c.41G > T
        p.(Cys14Phe).
      explanation: Reports the compound heterozygous genotype.
  - name: c.40T>C p.(Cys14Arg) and c.251_254delAAGA
    description: >-
      Compound heterozygous variants in two sibling fetuses with isolated
      hydrops; the missense destabilizes ZNHIT3 and the deletion yields a stable
      protein lacking the snoRNP-assembly domain.
    evidence:
    - reference: PMID:39252897
      reference_title: "New ZNHIT3 Variants Disrupting snoRNP Assembly Cause Prenatal PEHO Syndrome with Isolated Hydrops."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The c.40T>C p.Cys14Arg variant originated from the father, while the
        c.251_254delAAGA variant was of maternal origin.
      explanation: Reports the fetal compound heterozygous genotype; medRxiv preprint.
  evidence:
  - reference: PMID:28335020
    reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous missense substitution of leucine for serine at codon 31 in
      ZNHIT3 was identified as the primary cause of PEHO syndrome
    explanation: Gene discovery in Finnish families.
  - reference: PMID:31048081
    reference_title: "PEHO syndrome caused by compound heterozygote variants in ZNHIT3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ZNHIT3-associated PEHO syndrome exists outside of the Finnish population."
    explanation: Replication in a non-Finnish patient.

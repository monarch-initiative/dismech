pathophysiology:
- name: ZNHIT3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ZNHIT3 missense variants in the zinc finger HIT domain (p.Ser31Leu,
    p.Cys14Phe, p.Cys14Arg) destabilize the protein, and a frameshift allele
    removes the C-terminal region needed for snoRNP biogenesis. Zebrafish
    rescue experiments show that the founder missense allele acts by loss of
    function.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ZNHIT3
    term:
      id: hgnc:12309
      label: ZNHIT3
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  evidence:
  - reference: PMID:28335020
    reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous missense substitution of leucine for serine at codon 31 in
      ZNHIT3 was identified as the primary cause of PEHO syndrome
    explanation: >-
      Homozygosity mapping and sequencing in Finnish families identify ZNHIT3
      p.Ser31Leu as the causal variant.
  - reference: PMID:28335020
    reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of cell lines with ZNHIT3 expression vectors showed that the
      PEHO syndrome mutant protein is unstable.
    explanation: >-
      Cell-line expression shows the founder missense protein is unstable.
  - reference: PMID:28335020
    reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These phenotypes are rescued by wild-type, but not mutant human ZNHIT3
      mRNA, suggesting that the patient missense substitution causes disease
      through a loss-of-function mechanism.
    explanation: >-
      Failure of mutant mRNA to rescue zebrafish znhit3 deficiency supports a
      loss-of-function mechanism.
  - reference: PMID:39252897
    reference_title: "New ZNHIT3 Variants Disrupting snoRNP Assembly Cause Prenatal PEHO Syndrome with Isolated Hydrops."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the c.40T>C p.Cys14Arg variation behaves similarly to the previously
      described PEHO-associated ZNHIT3 variants that destabilize the protein
    explanation: >-
      Cell-culture studies of a further missense allele show the same protein
      destabilization; this source is a medRxiv preprint.
  downstream:
  - target: Box C/D snoRNP Assembly Defect
    causal_link_type: DIRECT
    description: >-
      ZNHIT3 (yeast Hit1) is required for box C/D snoRNP formation, so loss of
      the protein lowers box C/D snoRNA levels.
    evidence:
    - reference: PMID:35843310
      reference_title: "Studies of mutations of assembly factor Hit1 in budding yeast suggest translation defects as the molecular basis for PEHO syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that missense mutations modeling those found in PEHO syndrome
        patients cause a decrease in steady-state Hit1 protein levels, a
        significant reduction of box C/D snoRNA levels
      explanation: >-
        Yeast Hit1 carrying the patient missense changes is depleted and box C/D
        snoRNAs fall, linking the variant to snoRNP failure.
    - reference: PMID:39252897
      reference_title: "New ZNHIT3 Variants Disrupting snoRNP Assembly Cause Prenatal PEHO Syndrome with Isolated Hydrops."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        both variations lead to a marked decrease in specific box C/D snoRNA
        levels, reduced rRNA levels and cellular translation
      explanation: >-
        Human cell models of two patient alleles show reduced box C/D snoRNA
        levels; this source is a medRxiv preprint.
  - target: Peripheral edema
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      znhit3 knockdown and genome editing in zebrafish reproduce edema, but the
      route from ZNHIT3 loss to edema is not known.
    evidence:
    - reference: PMID:28335020
      reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both knockdown and genome editing of znhit3 in zebrafish embryos
        recapitulate the patients' cerebellar defects, microcephaly and oedema.
      explanation: >-
        Zebrafish znhit3 loss reproduces edema, supporting a gene-to-edema link
        with unknown intermediates.
  - target: Progressive microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      znhit3 loss in zebrafish reproduces microcephaly; in patients head

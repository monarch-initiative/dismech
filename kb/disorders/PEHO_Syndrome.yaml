discussions:
- discussion_id: gap_peho_extracerebellar_mechanisms
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of a ubiquitous snoRNP assembly factor produce the selective
    pattern of PEHO syndrome: optic nerve atrophy, edema and therapy-resistant
    infantile spasms, in addition to cerebellar granule neuron loss?
  attaches_to:
  - pathophysiology#Optic Nerve Degeneration
  - phenotypes#Peripheral edema
  - phenotypes#Infantile spasms
  rationale: >-
    The ribosome biogenesis and p53/p21 chain is established for cerebellar
    granule cell progenitors in yeast, cell and mouse models, but no study has
    examined retinal ganglion cells or the optic nerve, the cause of edema
    (reproduced in zebrafish) or the cortical basis of the epileptic
    encephalopathy. It is also unknown whether specific hypomethylated rRNA
    sites, rather than a global translation deficit, explain the tissue
    selectivity.
  proposed_experiments:
  - experiment_id: exp_peho_retina_p53
    name: Retinal and optic nerve analysis in Znhit3 conditional mice
    description: >-
      Delete Znhit3 in retinal progenitors or ganglion cells and test for
      optic nerve atrophy, nucleolar stress and rescue by p53/p21 inhibition.
  - experiment_id: exp_peho_ribomethseq_neurons
    name: Site-specific rRNA methylation in patient-derived neural cells
    description: >-
      Map rRNA 2'-O-methylation and ribosome profiles in ZNHIT3 p.Ser31Leu
      iPSC-derived cerebellar and cortical neurons to identify which
      hypomethylated sites and translated mRNAs differ by cell type.
  evidence:
  - reference: PMID:28335020
    reference_title: "ZNHIT3 is defective in PEHO syndrome, a severe encephalopathy with cerebellar granule neuron loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      imply that establishment of its spatiotemporal interaction targets will
      be the basis for developing therapeutic approaches and for improved
      understanding of cerebellar development
    explanation: >-
      The discovery report names the downstream targets as an open question.

- name: Box C/D snoRNP Assembly Defect
  biological_scale: MOLECULAR
  description: >-
    ZNHIT3 is a nucleolar assembly factor for box C/D snoRNPs (core proteins
    SNU13, NOP56, NOP58 and fibrillarin). Pathogenic ZNHIT3 alleles reduce box
    C/D snoRNA levels in yeast and human cell models.

name: ZNHIT3-Related PEHO Syndrome
creation_date: "2026-10-31T08:57:26Z"
category: Mendelian
description: >-
  PEHO syndrome (progressive encephalopathy with edema, hypsarrhythmia and
  optic atrophy) is an autosomal recessive infantile neurodegenerative disorder
  caused by biallelic ZNHIT3 variants, most often homozygosity for the Finnish
  founder missense variant p.Ser31Leu. Affected infants are abnormal from birth,
  with profound hypotonia, absent or early-lost visual fixation, infantile
  spasms with therapy-resistant hypsarrhythmia, arrest of psychomotor
  development, transient or persistent facial and limb edema, progressive
  microcephaly and optic atrophy. Neuroimaging and neuropathology show early
  progressive brain atrophy accentuated in the cerebellum and brainstem, with
  almost total loss of cerebellar granule neurons and atrophic optic nerves.
  ZNHIT3 is an assembly factor for box C/D small nucleolar ribonucleoproteins;
  the pathogenic missense proteins are unstable, and loss of ZNHIT3 function
  lowers box C/D snoRNA levels, disturbs rRNA processing and 2'-O-methylation
  and reduces translation. In the developing cerebellum this causes nucleolar
  stress with p53/p21 activation and loss of granule cell progenitors.
synonyms:
- PEHO syndrome
- ZNHIT3-associated PEHO syndrome
- Progressive encephalopathy with edema, hypsarrhythmia and optic atrophy
- Progressive encephalopathy-optic atrophy syndrome
- Infantile cerebello-optic atrophy
notes: >-
  The entry is restricted to the ZNHIT3 disease bound by MONDO:0009841 and
  OMIM:260565. The clinical PEHO and PEHO-like phenotype is also reached by
  pathogenic variants in other genes (KIF1A, CCDC88A, PRUNE1, RARS2 and others),
  which are recorded as differential diagnoses rather than as subtypes. The
  name follows the gene-disease form "ZNHIT3-associated PEHO syndrome" used in
  primary reports (PMID:31048081, PMID:35843310). No GeneReviews or StatPearls
  chapter covers PEHO syndrome or ZNHIT3. Treatment is supportive; no
  disease-modifying therapy has been tested in patients.

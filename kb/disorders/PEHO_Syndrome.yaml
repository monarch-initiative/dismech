    reference_title: "Studies of mutations of assembly factor Hit1 in budding yeast suggest translation defects as the molecular basis for PEHO syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies of the human zinc finger HIT-type containing protein 3 homolog in
      budding yeast (Hit1) revealed that this protein is critical for formation
      of small nucleolar ribonucleoprotein complexes that are required for rRNA
      processing and 2'-O-methylation.
    explanation: >-
      The yeast homolog is required for snoRNP formation.

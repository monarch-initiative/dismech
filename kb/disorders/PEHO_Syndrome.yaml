- name: Reduced CSF insulin-like growth factor 1
  presence: Decreased
  notes: >-
    CSF IGF-1 is lower in clinically defined PEHO syndrome than in neurological
    controls and separates PEHO from PEHO-like patients. The study predates
    gene testing, so the cohort was defined by clinical and radiological
    criteria.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      ZNHIT3 (zinc finger HIT type containing protein 3) is an evolutionarily
      conserved protein required for ribosome biogenesis by mediating the
      assembly of small nucleolar RNAs (snoRNAs) of class C/D into
      ribonucleoprotein complexes (snoRNPs).
    explanation: >-
      Defines the normal ZNHIT3 role in box C/D snoRNP assembly; medRxiv
      preprint.

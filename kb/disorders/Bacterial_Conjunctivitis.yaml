name: Bacterial Conjunctivitis
creation_date: "2026-11-04T00:00:00Z"
description: >-
  Bacterial conjunctivitis is an acquired ocular-surface infection in which
  extracellular pyogenic bacteria such as Haemophilus influenzae, Streptococcus
  pneumoniae, Moraxella catarrhalis, and Staphylococcus aureus are inoculated
  onto the conjunctiva, adhere to conjunctival epithelium, induce antimicrobial
  epithelial responses, and cause an acute mucopurulent conjunctivitis.
category: Infectious Disease
disease_term:
  preferred_term: bacterial conjunctivitis
  term:
    id: MONDO:0006668
    label: bacterial conjunctivitis
parents:
- Conjunctivitis
- Bacterial infectious disease
- Eye infectious disorder
synonyms:
- Bacterial pink eye
- Acute bacterial conjunctivitis
has_subtypes:
- name: Gonococcal conjunctivitis
  classification: etiologic_species_and_transmission
  curated_in: Gonococcal_Conjunctivitis
  subtype_term:
    preferred_term: gonococcal conjunctivitis
    term:
      id: MONDO:0015455
      label: gonococcal conjunctivitis
  description: >-
    N. gonorrhoeae conjunctival infection is curated separately because
    sexually transmitted or perinatal inoculation, hyperacute purulence,
    epithelial invasion, and urgent systemic ceftriaxone therapy make it
    mechanistically and clinically distinct from routine acute bacterial
    conjunctivitis.
- name: Inclusion conjunctivitis
  classification: etiologic_species_and_chronicity
  curated_in: Inclusion_Conjunctivitis
  subtype_term:
    preferred_term: inclusion conjunctivitis
    term:
      id: MONDO:0005808
      label: inclusion conjunctivitis
  description: >-
    Oculogenital C. trachomatis serovar D-K disease is curated separately
    because intracellular chlamydial inclusions, follicular subacute or chronic
    conjunctivitis, genital and birth-canal reservoirs, and systemic macrolide
    or tetracycline therapy distinguish it from routine extracellular acute
    bacterial conjunctivitis.
infectious_agent:
- name: Haemophilus influenzae
  description: >-
    H. influenzae is a Gram-negative respiratory coccobacillus that is one of
    the main bacterial conjunctivitis pathogens in adults and children and was
    the only organism significantly associated with pediatric acute
    conjunctivitis in a 2025 PCR case-control study.
  infectious_agent_term:
    preferred_term: Haemophilus influenzae
    term:
      id: NCBITaxon:727
      label: Haemophilus influenzae
  evidence:
  - reference: PMID:22348418
    reference_title: Bacterial conjunctivitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main bacterial pathogens are Haemophilus influenzae and Streptococcus
      pneumoniae in adults and children, and Moraxella catarrhalis in children.
    explanation: >-
      Identifies H. influenzae as a main bacterial conjunctivitis pathogen in a
      Clinical Evidence systematic review.
  - reference: PMID:39428088
    reference_title: Etiology and Outcomes of Acute Infectious Conjunctivitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      only detection of Haemophilus influenzae was associated with
      conjunctivitis (aOR 4.59, 95% CI 2.86, 7.37)
    explanation: >-
      Links H. influenzae PCR positivity to pediatric conjunctivitis in a
      multicenter case-control cohort.
- name: Streptococcus pneumoniae
  description: >-
    S. pneumoniae is an encapsulated Gram-positive respiratory coccus that is
    among the main bacterial conjunctivitis pathogens in children and adults.
  infectious_agent_term:
    preferred_term: Streptococcus pneumoniae
    term:
      id: NCBITaxon:1313
      label: Streptococcus pneumoniae
  evidence:
  - reference: PMID:22348418
    reference_title: Bacterial conjunctivitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main bacterial pathogens are Haemophilus influenzae and Streptococcus
      pneumoniae in adults and children, and Moraxella catarrhalis in children.
    explanation: >-
      Identifies S. pneumoniae as a main bacterial conjunctivitis pathogen in a
      Clinical Evidence systematic review.
- name: Moraxella catarrhalis
  description: >-
    M. catarrhalis is a Gram-negative respiratory diplococcus that contributes
    to childhood bacterial conjunctivitis.
  infectious_agent_term:
    preferred_term: Moraxella catarrhalis
    term:
      id: NCBITaxon:480
      label: Moraxella catarrhalis
  evidence:
  - reference: PMID:22348418
    reference_title: Bacterial conjunctivitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main bacterial pathogens are Haemophilus influenzae and Streptococcus
      pneumoniae in adults and children, and Moraxella catarrhalis in children.
    explanation: >-
      Identifies M. catarrhalis as a childhood bacterial conjunctivitis
      pathogen in a Clinical Evidence systematic review.
- name: Staphylococcus aureus
  description: >-
    S. aureus is a Gram-positive coccus that can cause ocular-surface infection
    and is a recurrent neonatal ophthalmia pathogen in hospital-based series.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:41062949
    reference_title: "Predictors of Chlamydia trachomatis conjunctivitis in neonates: a 10-Year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 797 neonates were included; 140 (17.5%) tested positive for
      Chlamydia trachomatis followed by Staphylococcus aureus (10.2%) and MRSA
      (4.1%)
    explanation: >-
      Documents S. aureus and MRSA among organisms detected in neonatal
      ophthalmia at a tertiary pediatric eye center.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Direct ocular inoculation
  description: >-
    Extracellular bacterial pathogens reach the conjunctival sac by direct
    ocular inoculation from respiratory or ocular secretions, hand-to-eye
    transfer, or contaminated fomites.
pathophysiology:
- name: Conjunctival bacterial inoculation
  role: trigger
  biological_scale: TISSUE
  description: >-
    Bacteria are deposited on the exposed conjunctival mucosal surface.
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  downstream:
  - target: Conjunctival epithelial adhesion and innate response
    causal_link_type: DIRECT
    description: >-
      Deposited organisms attach to the ocular surface and are sensed by
      conjunctival epithelial innate antimicrobial programs.
- name: Conjunctival epithelial adhesion and innate response
  biological_scale: CELLULAR
  description: >-
    Ocular-surface bacteria interact with conjunctival epithelial cells whose
    beta-defensin antimicrobial program is constitutively present and inducible
    by S. aureus products.
  cell_types:
  - preferred_term: conjunctival epithelial cell
    term:
      id: CL:1000432
      label: conjunctival epithelial cell
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    modifier: INCREASED
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  - preferred_term: antimicrobial humoral response
    modifier: INCREASED
    term:
      id: GO:0019730
      label: antimicrobial humoral response
  evidence:
  - reference: PMID:20526610
    reference_title: "Roles of human beta-defensins in innate immune defense at the ocular surface: arming and alarming corneal and conjunctival epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      hBD1, -2, -3 and -4 are constitutively expressed in conjunctival
      epithelial cells and also partly in cornea.
    explanation: >-
      Places beta-defensin antimicrobial peptides in conjunctival epithelial
      cells, the ocular surface that routine bacterial conjunctivitis infects.
  - reference: PMID:20526610
    reference_title: "Roles of human beta-defensins in innate immune defense at the ocular surface: arming and alarming corneal and conjunctival epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Staphylococcus aureus increases both hBD2 and hBD3 production in corneal
      and conjunctival epithelial cells.
    explanation: >-
      Demonstrates that S. aureus products induce conjunctival epithelial
      beta-defensins in vitro.
  downstream:
  - target: Purulent conjunctival inflammation
    causal_link_type: DIRECT
    description: >-
      Bacterial adhesion and host epithelial sensing elicit conjunctival
      inflammation and mucopurulent exudate.
- name: Purulent conjunctival inflammation
  biological_scale: TISSUE
  description: >-
    Acute conjunctival inflammation produces redness, ocular irritation, and
    purulent discharge.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:39428088
    reference_title: Etiology and Outcomes of Acute Infectious Conjunctivitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Purulent discharge was associated with H influenzae (aOR 2.47, 95% CI
      1.23, 5.01) and occurred in 92 (77%) cases in which H influenzae was
      detected
    explanation: >-
      Supports purulent discharge as a common conjunctival inflammatory sign
      when H. influenzae is detected in pediatric conjunctivitis.
  downstream:
  - target: Conjunctival hyperemia
    causal_link_type: DIRECT
    description: Inflamed conjunctival vessels produce red-eye hyperemia.
  - target: Purulent eye discharge
    causal_link_type: DIRECT
    description: Mucopurulent conjunctival exudate drains as purulent eye discharge.
progression:
- phase: Acute self-limited conjunctivitis
  notes: >-
    Typical childhood acute infectious conjunctivitis improves or resolves over
    the first week in most cases, independent of ophthalmic antibiotic use.
  evidence:
  - reference: PMID:39428088
    reference_title: Etiology and Outcomes of Acute Infectious Conjunctivitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Improvement (186, 96%) and resolution (166, 86%) were observed by day 5
      for most children and did not differ on the basis of ophthalmic antibiotic
      use.
    explanation: >-
      Documents the short acute course of pediatric acute infectious
      conjunctivitis in a PCR-tested cohort.
phenotypes:
- name: Conjunctival hyperemia
  category: Ophthalmologic
  frequency: FREQUENT
  description: Conjunctival inflammation reddens the ocular surface.
  phenotype_term:
    preferred_term: Conjunctival hyperemia
    term:
      id: HP:0030953
      label: Conjunctival hyperemia
  evidence:
  - reference: PMID:41062949
    reference_title: "Predictors of Chlamydia trachomatis conjunctivitis in neonates: a 10-Year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additional significant predictors included eyelid swelling (OR = 3.04,
      95% CI: 1.58-5.83, p < .001) and conjunctival redness (OR = 2.73, 95% CI:
      1.73-4.29, p < .001).
    explanation: >-
      Reports conjunctival redness in culture- and PCR-tested neonatal
      conjunctivitis.
- name: Purulent eye discharge
  category: Ophthalmologic
  frequency: FREQUENT
  description: Acute bacterial conjunctivitis can produce mucopurulent or purulent ocular discharge.
  phenotype_term:
    preferred_term: Purulent eye discharge
    term:
      id: HP:0034427
      label: Purulent eye discharge
  evidence:
  - reference: PMID:15201195
    reference_title: "Predicting bacterial cause in infectious conjunctivitis: cohort study on informativeness of combinations of signs and symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      184 adults presenting with a red eye and either (muco)purulent discharge
      or glued eyelid(s), not wearing contact lenses.
    explanation: >-
      The diagnostic cohort enrolled adults with acute infectious
      conjunctivitis presenting with mucopurulent discharge or glued eyelids.
  - reference: PMID:39428088
    reference_title: Etiology and Outcomes of Acute Infectious Conjunctivitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Purulent discharge was associated with H influenzae (aOR 2.47, 95% CI
      1.23, 5.01) and occurred in 92 (77%) cases in which H influenzae was
      detected
    explanation: >-
      Supports purulent discharge as a frequent finding in H. influenzae-positive
      pediatric conjunctivitis.
diagnosis:
- name: Clinical bacterial-conjunctivitis prediction rule
  description: >-
    Adult acute infectious conjunctivitis can be clinically triaged with a
    three-question rule: early-morning glued eyes increase the probability of a
    bacterial cause, whereas itch and prior conjunctivitis lower it.
  evidence:
  - reference: PMID:15201195
    reference_title: "Predicting bacterial cause in infectious conjunctivitis: cohort study on informativeness of combinations of signs and symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Logistic regression analysis showed optimal diagnostic discrimination for
      the combination of early morning glued eye(s), itch, and a history of
      conjunctivitis.
    explanation: >-
      Identifies the three symptoms used in the bacterial-cause prediction rule
      for acute infectious conjunctivitis.
  - reference: PMID:15201195
    reference_title: "Predicting bacterial cause in infectious conjunctivitis: cohort study on informativeness of combinations of signs and symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The overall prevalence of bacterial involvement of 32% could be lowered
      to 4% or raised to 77%, depending on the pattern of index test results.
    explanation: >-
      Quantifies how the three-symptom rule changes the post-test probability of
      a bacterial origin.
treatments:
- name: Topical antibiotic therapy
  description: >-
    Topical antibiotics modestly increase clinical recovery and microbiologic
    cure in acute bacterial conjunctivitis, but high spontaneous recovery makes
    delayed prescribing an antibiotic-stewardship option for routine primary
    care cases.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Purulent conjunctival inflammation
    treatment_effect: INHIBITS
    description: >-
      Ophthalmic antibiotics reduce viable surface bacteria, shortening the
      bacterial inflammatory stimulus.
  evidence:
  - reference: PMID:37482371
    reference_title: "Antibiotics Versus Placebo for Acute Bacterial Conjunctivitis: Findings From a Cochrane Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      antibiotics may increase clinical recovery by 26% (risk ratio [RR]: 1.26;
      95% confidence interval [CI]: 1.09-1.46) at the end of therapy
    explanation: >-
      A Cochrane systematic review found a modest clinical-recovery benefit for
      topical antibiotics in acute bacterial conjunctivitis.
  - reference: PMID:16847013
    reference_title: A randomised controlled trial of management strategies for acute infective conjunctivitis in general practice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Delayed prescribing of antibiotics is probably the most appropriate
      strategy for managing acute conjunctivitis in primary care.
    explanation: >-
      Supports delayed topical-antibiotic prescribing as a stewardship strategy
      in routine primary-care acute conjunctivitis.
review_notes: >-
  Deliberately lumped. This entry keeps the common acute extracellular pyogenic
  forms caused by Haemophilus influenzae, Streptococcus pneumoniae, Moraxella
  catarrhalis, Staphylococcus aureus, and adjacent routine acute bacterial
  agents together. It deliberately leaves Neisseria gonorrhoeae and Chlamydia
  trachomatis conjunctival infections in Gonococcal_Conjunctivitis and
  Inclusion_Conjunctivitis because hyperacute gonococcal invasion,
  intracellular chlamydial replication, sexual or perinatal exposure, systemic
  first-line therapy, and chronic trachomatous scarring differ by organism.

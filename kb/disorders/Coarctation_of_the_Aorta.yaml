- name: Accelerated Atherosclerosis and Late Cardiovascular Mortality
  biological_scale: ORGANISM
  description: >
    Repaired coarctation patients accumulate coronary artery disease, coronary
    and aortic calcium, stroke, and peripheral arterial disease earlier than
    expected, and late cardiovascular mortality remains high. This is the
    endpoint that makes the entry's framing necessary: it is not a complication
    of the operation, it is what the arteriopathy does over decades while the
    repaired anatomy looks normal. The burden is growing in absolute terms as the
    adult congenital heart disease population expands and ages.

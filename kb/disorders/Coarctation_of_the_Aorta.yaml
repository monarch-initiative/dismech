- name: Persistent Hypertension After Anatomic Repair
  biological_scale: ORGANISM
  description: >
    Hypertension recurs or persists in a large fraction of patients despite a
    technically successful repair and no residual gradient - 58.5% at two years
    in a series repaired predominantly under one month of age. It is the
    convergence point of three upstream processes that repair does not touch:
    neurohormonal priming, the diffuse arteriopathy, and autonomic dysregulation.
    Patients with normal clinic pressures may still be hypertensive on ambulatory
    monitoring, so the phenotype is systematically under-detected by the
    measurement most clinics use.

mechanistic_hypotheses:
- hypothesis_group_id: ductal_tissue_migration
  hypothesis_label: Ectopic ductal tissue constriction
  status: CANONICAL
  description: >
    Contractile tissue of ductus arteriosus type extends ectopically into the
    aortic isthmus; when the ductus constricts after birth, the ectopic tissue
    contracts with it and draws in the aortic wall. This is the traditional
    account and explains the juxtaductal location of the shelf and the timing of
    neonatal decompensation at ductal closure. It predicts that the narrowing is
    an active, tissue-intrinsic constriction rather than a growth failure. The
    PRDM6 association - a smooth-muscle-specific transcription factor causal for
    patent ductus arteriosus and reported in patients who also have coarctation -
    is the most direct contemporary support for a shared ductal/aortic
    smooth-muscle lesion, though it falls short of demonstrating the ectopic
    tissue itself.
  evidence:
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      localized stenosis is related to abnormal distribution of the ductal tissue
      to the descending aorta and post-natal constriction of the ductus
      arteriosus.
    explanation: >-
      States this hypothesis in the terms curated here, as the account of the
      localized stenosis component specifically.
  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in PRDM6, which encodes a smooth-muscle-cell-specific
      transcription factor, have now been etiologically associated with
      non-syndromic PDA.
    explanation: >-
      Supports a shared smooth-muscle-identity lesion linking the ductus and the
      aortic phenotype. Graded PARTIAL because it does not demonstrate ectopic
      ductal tissue in the isthmus.
- hypothesis_group_id: reduced_fetal_flow
  hypothesis_label: Reduced fetal isthmic flow
  status: ALTERNATIVE
  description: >
    Any fetal lesion diverting blood from the ascending aorta and arch reduces
    antegrade flow through the isthmus, which then fails to grow. This predicts
    exactly the clustering that is observed - coarctation with bicuspid or
    stenotic aortic valve, with ventricular septal defect, with arch or
    descending aortic hypoplasia - and predicts that isolated coarctation should
    be the exception rather than the rule. It is the same reasoning applied to
    hypoplastic left heart syndrome, and it shares that debate's central
    difficulty: the association is compatible with reduced flow causing the
    hypoplasia and with a shared developmental lesion causing both.
  evidence:
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ischemic hypoplasia results from prenatal decrease of blood flow to the
      ascending aorta
    explanation: >-
      States this hypothesis in the terms curated here, as the account of the
      hypoplastic component specifically.
  - reference: PMID:24418111
    reference_title: "Variants in the NOTCH1 gene in patients with aortic coarctation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in approximately half of the cases, it was combined with hypoplasia of the
      aortic arch or descending aorta.
    explanation: >-
      Documents the coexisting arch and descending aortic hypoplasia that the
      flow account predicts.
  - reference: PMID:33432820
    reference_title: "Genetic Etiology of Left-Sided Obstructive Heart Lesions: A Story in Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      only 16.2% of patients with CoA have isolated disease, whereas the majority
      have concomitant cardiac defects.
    explanation: >-
      The population-level prediction of this hypothesis, quantified: if
      coarctation arises because some other lesion diverted fetal flow, isolated
      coarctation should be the exception. It is - by a factor of five. Evidence
      source is OTHER because this is a narrative review.

- name: Fixed Aortic Obstruction and Pressure Gradient
  biological_scale: ORGANISM
  description: >
    The narrowed isthmus imposes a fixed resistance between the proximal and
    distal aorta, producing systolic hypertension in the arms and head with
    reduced pulse and perfusion pressure below the lesion. The gradient is the
    proximate cause of the classic examination findings and the substrate for
    everything downstream, but it is also the only part of the disease that
    surgery reliably removes.
  locations:
  - preferred_term: thoracic aorta
    term:
      id: UBERON:0001515
      label: thoracic aorta
  biological_processes:

discussions:
- discussion_id: coa_morphogenesis_ductal_vs_flow
  kind: CONTROVERSY
  attaches_to:
  - "pathophysiology#Ectopic Ductal Tissue at the Aortic Isthmus"
  - "pathophysiology#Reduced Antegrade Flow Through the Fetal Aortic Isthmus"
  prompt: >
    Does the isthmic narrowing arise from constriction of ectopic ductal tissue,
    from failure of an underperfused isthmus to grow, or from both in different
    patients?
  rationale: >
    The two accounts predict different things about what repair can achieve. If
    the lesion is an active constriction of misplaced ductal muscle, the aorta
    proximal and distal to it may be structurally normal and complete excision
    should be curative. If the isthmus failed to grow because it was
    underperfused, the whole left-heart-and-arch complex is developmentally
    abnormal and the narrowing is one visible part of a larger lesion. The
    persistence of hypertension and arteriopathy after technically perfect repair
    is easier to reconcile with the second, but does not settle it, because a
    shared genetic program could produce both the ductal-tissue anomaly and the
    arterial wall abnormality independently. Contemporary genetics is
    uncomfortable for a clean separation: PRDM6 is a smooth-muscle-identity gene
    implicated in the ductal lesion, while MYH6 and NOTCH1 sit in the
    outflow-tract program that the flow account invokes.
  evidence:
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ischemic hypoplasia results from prenatal decrease of blood flow to the
      ascending aorta, and localized stenosis is related to abnormal distribution
      of the ductal tissue to the descending aorta and post-natal constriction of
      the ductus arteriosus.
    explanation: >-
      The clearest statement that both accounts are needed - one for the
      hypoplastic component and one for the localized stenosis. Graded PARTIAL
      because the authors present it explicitly as a working hypothesis
      compatible with their angiographic findings, not as a demonstrated
      morphogenesis.
  proposed_experiments:
  - experiment_id: exp_coa_isthmic_flow_fetal_imaging
    name: Prospective fetal flow measurement in isthmic narrowing
    description: >-
      Serially quantify antegrade isthmic flow by fetal echocardiography in
      pregnancies at risk of coarctation, and relate flow trajectory to postnatal
      isthmic dimensions and to the presence of a discrete posterior shelf. A
      shelf appearing in fetuses with preserved isthmic flow would support the
      ductal-tissue account; progressive isthmic hypoplasia tracking with falling
      flow would support the growth-failure account.
  - experiment_id: exp_coa_resected_segment_histology_genotype
    name: Histologic and transcriptional characterization of resected coarctation segments by genotype
    description: >-
      Characterize resected coarctation segments for ductal-type smooth muscle
      markers and compare across genotype strata (PRDM6, MYH6, NOTCH1 variant
      carriers versus non-carriers). Enrichment of ductal-type tissue in PRDM6
      carriers specifically would connect the genetic and morphogenetic accounts
      rather than leaving them as parallel narratives.
- discussion_id: coa_arteriopathy_intrinsic_vs_acquired
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Diffuse Arteriopathy of the Pre-Coarctation Vasculature"
  prompt: >
    Is the arteriopathy of the pre-coarctation vasculature developmentally
    intrinsic, or acquired from years of exposure to elevated proximal pressure?
  rationale: >
    This determines whether earlier repair can prevent it or only limit it. The
    evidence points both ways. Abnormality of the endothelium-independent
    nitrate response argues for a structural, and plausibly intrinsic, wall
    defect rather than a purely functional consequence of hypertension. But the
    same abnormalities are documented in patients repaired in the first months of
    life and followed for decades, so exposure duration was already minimal and
    the abnormality persisted - which is consistent with an intrinsic defect and
    equally consistent with an irreversible early insult. No study has compared
    pre-coarctation arterial structure in fetuses or neonates before any
    significant pressure exposure has occurred.
  proposed_experiments:
  - experiment_id: exp_coa_neonatal_arterial_wall_before_exposure
    name: Arterial wall characterization in neonates before significant pressure exposure
    description: >-
      Measure proximal arterial stiffness and endothelium-dependent and
      -independent function in neonates with prenatally diagnosed coarctation
      before repair and before prolonged hypertensive exposure, comparing with
      matched controls. Abnormality already present at this point would establish
      the arteriopathy as intrinsic rather than acquired.
- discussion_id: coa_atherogenesis_module_conformance
  kind: CURATION_TODO
  attaches_to:
  - "pathophysiology#Accelerated Atherosclerosis and Late Cardiovascular Mortality"
  prompt: >
    Should the accelerated-atherosclerosis node declare conformance to the
    `atherogenesis` module?
  rationale: >
    Mechanistically it very likely should. The module's core chain is apoB
    lipoprotein retention at a dysfunctional endothelium, foam-cell formation,
    and smooth-muscle-cell fibrofatty plaque assembly, and repaired coarctation
    supplies exactly the endothelial dysfunction and hypertensive substrate that
    chain begins from. What is missing is evidence: the source cited here is a
    review reporting the prevalence of atherosclerotic sequelae in this
    population, which establishes that plaques accumulate faster, not that they
    are assembled by the module's mechanism in these patients specifically.
    Declaring conformance on that basis would assert mechanism from epidemiology.
    Left as an explicit curation task rather than a silent omission.
inheritance:
- name: Multifactorial (polygenic) inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >
    Coarctation sits within the left-sided obstructive lesion spectrum, which is
    clearly heritable - nonsyndromic defects recur in families and carry a high
    sibling recurrence risk - without following a Mendelian pattern. The
    currently accepted genes for this spectrum explain only 10-20% of patients,
    and the emerging picture is combinatorial: common and rare variants acting
    together. That is why the three genes curated below are all typed
    SUSCEPTIBILITY rather than causative, despite NOTCH1 and MYH6 being
    well-replicated associations.
  evidence:
  - reference: PMID:33432820
    reference_title: "Genetic Etiology of Left-Sided Obstructive Heart Lesions: A Story in Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      nonsyndromic defects are often observed in multiple family members and
      associated with high sibling recurrence risk. This clear evidence for a
      heritable basis has driven a lengthy search for disease-causing variants
    explanation: >-
      Establishes familial recurrence and a heritable basis for the left-sided
      obstructive lesion spectrum that includes coarctation.
  - reference: PMID:33432820
    reference_title: "Genetic Etiology of Left-Sided Obstructive Heart Lesions: A Story in Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the currently accepted LSOL-associated genes explain only 10% to 20% of
      patients. Further, the combinatorial effects of common and rare variants as
      a cause of LSOLs are emerging.
    explanation: >-
      Quantifies the unexplained majority and supports a combinatorial rather
      than Mendelian architecture, which is what justifies a polygenic record.
      Evidence source is OTHER because this is a narrative review, matching how
      the other review cited in this entry is classified.
  - reference: PMID:33432820
    reference_title: "Genetic Etiology of Left-Sided Obstructive Heart Lesions: A Story in Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The risk of CHD varies by the proband's defect but is higher than the
      general population with prevalence in first‐degree relatives of 19% for
      HLHS, 9% for CoA, and 1% for transposition of the great arteries.
    explanation: >-
      Quantifies familial aggregation stratified by proband defect. Note what the
      9% figure does and does not measure: it is the prevalence of *any*
      congenital heart defect among first-degree relatives of a coarctation
      proband, not recurrence of coarctation itself. That distinction matters
      here rather than being pedantic - a familial excess of heterogeneous
      left-sided lesions is what a shared developmental program predicts, and is
      weaker evidence for a coarctation-specific recurrence risk than the raw
      number suggests. Evidence source is OTHER because this is a narrative
      review.
  - reference: PMID:33432820
    reference_title: "Genetic Etiology of Left-Sided Obstructive Heart Lesions: A Story in Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Family studies demonstrate a heritable factor for CoA; however,
      ascertaining the genetics of CoA is difficult because only 16.2% of
      patients with CoA have isolated disease, whereas the majority have
      concomitant cardiac defects.
    explanation: >-
      Coarctation-specific heritability, plus the methodological caveat that
      makes its genetics hard to resolve. The 16.2%-isolated figure does double
      duty: it is also the strongest population-level observation favouring the
      reduced-fetal-flow account, which predicts exactly this clustering with
      other left-heart lesions. Evidence source is OTHER because this is a
      narrative review.
diagnosis:
- name: Four-Limb Blood Pressure Gradient
  description: >
    The bedside finding that makes the diagnosis: a systolic pressure difference
    between upper and lower limbs, with diminished or delayed femoral pulses.
    It is also the finding most often not looked for - a severe coarctation can
    sit behind two decades of "poorly controlled hypertension" until someone
    compares an arm with a leg.
  diagnosis_term:
    preferred_term: blood pressure measurement
    term:
      id: NCIT:C167233
      label: Blood Pressure Measurement
  evidence:
  - reference: PMID:40671984
    reference_title: "Hypertension Secondary to Severe Aortic Coarctation in an Adult Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiovascular evaluation was prompted by a 25 mmHg systolic blood
      pressure difference between the left upper limb (165/90 mmHg) and the left
      lower limb (140/85 mmHg), along with an interscapular systolic murmur,
      during trauma admission, suggesting coarctation.
    explanation: >-
      Documents the upper-to-lower limb gradient and interscapular murmur
      prompting the diagnosis, in a patient hypertensive for 24 years
      beforehand.
- name: Transthoracic Echocardiography
  description: >
    First-line imaging, which localizes the obstruction and quantifies its
    severity by the transisthmic gradient, while also assessing the associated
    intracardiac lesions - above all the bicuspid aortic valve present in more
    than half of cases.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:40671984
    reference_title: "Hypertension Secondary to Severe Aortic Coarctation in an Adult Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transthoracic echocardiography (TTE) showed no intracardiac deformity and
      demonstrated a peak-to-peak gradient of 60 mmHg across the aortic isthmus.
    explanation: >-
      Documents echocardiographic quantification of the isthmic gradient and
      exclusion of associated intracardiac lesions.
- name: CT Angiography
  description: >
    Cross-sectional angiography defines the anatomy that determines the repair
    strategy - the length and minimal diameter of the narrowed segment, its
    distance from the left subclavian artery, and the extent of the collateral
    network.
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  evidence:
  - reference: PMID:40671984
    reference_title: "Hypertension Secondary to Severe Aortic Coarctation in an Adult Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CT angiography (CTA) confirmed a severe coarctation, with a minimal
      luminal diameter of 3 mm, located 38 mm distal to the left subclavian
      artery, and extensive collateral circulation via intercostal and internal
      mammary arteries.
    explanation: >-
      Documents the anatomic detail CT angiography supplies and that it drove a
      staged endovascular approach in this case.

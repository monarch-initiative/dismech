- name: Renin-Angiotensin System Activation
  biological_scale: ORGANISM
  description: >
    The kidneys sit downstream of the coarctation and sense the reduced
    perfusion pressure as volume depletion, activating the renin-angiotensin
    system and raising systemic pressure further - a feedback loop that cannot
    correct the sensed deficit because the obstruction, not volume status, is
    what limits renal perfusion. Renin activation is present preoperatively and
    is not merely a response to the residual gradient: the preoperative renin
    concentration independently predicts hypertension two years after successful
    repair, which is why this node feeds the persistent-hypertension arm and not
    only the acute one.
  locations:
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  biological_processes:
  - preferred_term: renin-angiotensin regulation of aldosterone production
    term:
      id: GO:0002018
      label: renin-angiotensin regulation of aldosterone production
    modifier: INCREASED
  - preferred_term: positive regulation of vasoconstriction
    term:

  - reference: PMID:38071433
    reference_title: "Patent ductus arteriosus and coarctation of the aorta in association with PRDM6 variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in PRDM6, which encodes a smooth-muscle-cell-specific
      transcription factor, have now been etiologically associated with
      non-syndromic PDA.
    explanation: >-
      Establishes PRDM6 as a smooth-muscle transcription factor causal for patent
      ductus arteriosus. Graded PARTIAL for coarctation specifically, since the
      report describes three patients with both lesions rather than an
      established coarctation gene.
  - reference: PMID:23825392
    reference_title: "Bicuspid aortic valve and aortic coarctation are linked to deletion of the X chromosome short arm in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bicuspid aortic valves (BAV) were found in 52/152 (34%) 45,X study subjects
      and aortic coarctation (COA) in 19/152 (12.5%).
    explanation: >-
      Quantifies the coarctation and bicuspid-valve burden in Turner syndrome by
      cardiac MRI, supporting an Xp dosage contribution.
  downstream:
  - target: Reduced Antegrade Flow Through the Fetal Aortic Isthmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disruption of the shared outflow-tract program produces the valve and arch

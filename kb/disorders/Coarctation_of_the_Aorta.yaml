      dampened sympathetic baroreflex function (-2.2±2.1 vs. -7.0±5.6
      bursts/100heartbeats·mm·Hg-1, p=0.007), normal cardiac baroreflex function
    explanation: >-
      Supports selective impairment of the sympathetic baroreflex limb, quoting
      it alongside the preserved cardiac baroreflex measured in the same
      patients. The dissociation is the point: a global autonomic lesion would
      have impaired both.
  downstream:

animal_models:
- name: Rat suprarenal aortic banding model
  species: Rattus norvegicus
  genotype: Wild-type Sprague-Dawley rat with surgical abdominal aortic banding above the renal arteries
  category: Induced (surgical) coarctation model
  publication: PMID:16280280
  modeled_mechanisms:
  - target: Renin-Angiotensin System Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Banding above the renal arteries places the kidneys in the low-pressure
      compartment, reproducing the renal hypoperfusion that drives renin release
      in human coarctation. This is the mechanism the model exists to isolate.
    evidence:
    - reference: PMID:16280280
      reference_title: "Hypertension induced by aortic coarctation above the renal arteries is associated with immune cell infiltration of the kidneys."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        renal hypoperfusion and the consequent activation of renin-angiotensin
        system may mediate this process by promoting local induction of
        chemoattractant and inflammatory cytokines.
      explanation: >-
        States the renal-hypoperfusion to renin-angiotensin sequence directly,
        which is the node this link claims the model recapitulates. Evidence
        source is MODEL_ORGANISM because this is a rat surgical model.
  - target: Fixed Aortic Obstruction and Pressure Gradient
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The obstruction is surgical and abdominal, not a juxtaductal isthmic
      lesion. It reproduces the haemodynamic geometry - severe hypertension
      proximal, normotension distal - while saying nothing about how the human
      narrowing forms. Neither curated morphogenetic hypothesis is testable in
      this model.
    description: >-
      A fixed aortic obstruction with the kidneys distal to it, matching the
      human pressure distribution.
    evidence:
    - reference: PMID:16280280
      reference_title: "Hypertension induced by aortic coarctation above the renal arteries is associated with immune cell infiltration of the kidneys."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        abdominal aorta coarctation (banding) above renal arteries, which causes
        severe HTN proximal but not distal to coarctation.
      explanation: >-
        Confirms the haemodynamic geometry is reproduced - severe hypertension
        proximal, normotension distal. Graded PARTIAL because the obstruction is
        surgical and abdominal rather than a juxtaductal isthmic lesion, so the
        pressure distribution matches while the lesion does not. Evidence source
        is MODEL_ORGANISM because this is a rat surgical model.
  - target: Diffuse Arteriopathy of the Pre-Coarctation Vasculature
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      An acutely banded normal aorta has no developmental arteriopathy. Since the
      persistence of hypertension after repair in patients is attributed largely
      to that intrinsic vascular abnormality, this model cannot address the
      entry's central claim - and recording that explicitly is the point of
      including the link.
    description: >-
      Recorded as a negative link so the model is not read as validating the
      systemic-arteriopathy arm of this entry.
    evidence:
    - reference: PMID:16280280
      reference_title: "Hypertension induced by aortic coarctation above the renal arteries is associated with immune cell infiltration of the kidneys."
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sprague-Dawley rats with abdominal aorta coarctation (banding) above
        renal arteries, which causes severe HTN proximal but not distal to
        coarctation.
      explanation: >-
        Substantiates the negative claim by establishing what the model actually
        is: an acute surgical band applied to a wild-type vessel. There is no
        developmental arteriopathy to recapitulate and none is reported anywhere
        in the paper, which is why the grading is NO_EVIDENCE rather than REFUTE
        - the study does not test the question, and absence of a finding in a
        study that never looked is not a refutation. Evidence source is
        MODEL_ORGANISM because this is a rat surgical model.
  description: >
    Surgical banding of the abdominal aorta above the renal arteries reproduces
    the defining haemodynamic geometry of human coarctation: severe hypertension
    proximal to the obstruction, with the kidneys sitting distal to it. That is
    precisely the arrangement that drives renin-angiotensin activation in
    patients, and it is why this model bears on the renin node of this entry.
    Its limit is equally clear and worth stating: the band is surgical, so the
    model recapitulates the consequence of the obstruction and says nothing about
    either competing account of how the isthmus narrows. It is not a model of
    coarctation morphogenesis and should not be cited as one.
  evidence:
  - reference: PMID:16280280
    reference_title: "Hypertension induced by aortic coarctation above the renal arteries is associated with immune cell infiltration of the kidneys."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We studied activation of peripheral blood leukocytes and cellular
      infiltration in the kidneys of Sprague-Dawley rats with abdominal aorta
      coarctation (banding) above renal arteries, which causes severe HTN
      proximal but not distal to coarctation.
    explanation: >-
      Establishes the model and confirms it reproduces the
      proximal-hypertension, distal-normotension geometry of human coarctation.
      Evidence source is MODEL_ORGANISM because this is a rat surgical model.

- name: Diffuse Arteriopathy of the Pre-Coarctation Vasculature
  biological_scale: TISSUE
  description: >
    The arteries proximal to the coarctation are intrinsically abnormal, not
    merely exposed to high pressure. In repaired patients both
    endothelium-dependent flow-mediated dilation and the response to the
    endothelium-independent smooth muscle dilator glyceryl trinitrate are
    reduced, and pulse wave velocity is increased - the second of those is the
    decisive observation, because a purely endothelial defect would spare the
    nitrate response. Arterial stiffness and endothelial dysfunction persist
    decades after early repair. This node is the reason coarctation is a systemic
    disease rather than a segmental one.

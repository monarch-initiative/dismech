- name: Ductal-Dependent Systemic Perfusion in Critical Coarctation
  biological_scale: ORGANISM
  description: >
    In the most severe form, the neonate is well while the ductus arteriosus is
    open because systemic flow below the coarctation is supplied right-to-left
    across it. Ductal closure in the first days of life abruptly removes that
    supply, producing shock, acidosis, and heart failure. The presentation is
    therefore timed by ductal physiology rather than by the anatomy, and it is
    reversible in the short term by reopening the ductus pharmacologically.
  locations:
  - preferred_term: ductus arteriosus
    term:
      id: UBERON:0005440
      label: ductus arteriosus
  evidence:
  - reference: PMID:10771966
    reference_title: "Prostaglandin E1: first stage palliation in neonates with congenital cardiac defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lesions with ductus dependent systemic blood flow e.g. critical aortic
      stenosis, coarctation of aorta, interruption of aortic arch
    explanation: >-
      Classifies coarctation explicitly among the lesions with ductus-dependent
      systemic blood flow, the claim of this node.
- name: Left Ventricular Pressure Overload and Hypertrophy
  biological_scale: TISSUE
  description: >
    The left ventricle hypertrophies against the elevated afterload. Ventricular
    mass in repaired coarctation tracks ambulatory rather than clinic blood
    pressure, and the relationship is steeper than in healthy controls - the same
    daytime pressure buys more hypertrophy in a coarctation patient. Left
    ventricular mass is itself a predictor of late morbidity and mortality, so
    this node is not merely a marker of load.

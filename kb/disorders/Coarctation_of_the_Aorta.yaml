- name: Collateral Arterial Development
  biological_scale: TISSUE
  description: >
    Over months to years, flow bypasses the obstruction through enlarging
    intercostal, internal thoracic, and subscapular arteries. Collateralization is
    protective - it maintains distal perfusion and can render an anatomically
    severe coarctation clinically silent into adulthood - and is simultaneously
    the reason presentation is so often delayed until hypertension or a
    complication supervenes. The enlarged intercostal arteries erode the inferior
    rib margins, producing the classical radiographic notching.
  locations:
  - preferred_term: thoracic aorta
    term:
      id: UBERON:0001515
      label: thoracic aorta
  cell_types:
  - preferred_term: arterial endothelial cell
    term:
      id: CL:0000115

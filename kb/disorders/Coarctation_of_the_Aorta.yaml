    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coarctation of the aorta (CoA) accounts for 4-8% of congenital heart
      defects (CHDs)
    explanation: >-
      Direct statement of the lesion's share of congenital heart disease.
- name: Coarctation and bicuspid aortic valve in Turner syndrome
  description: >
    In non-mosaic 45,X Turner syndrome assessed by cardiac MRI, aortic
    coarctation was present in 12.5% and bicuspid aortic valve in 34%.
  evidence:
  - reference: PMID:23825392
    reference_title: "Bicuspid aortic valve and aortic coarctation are linked to deletion of the X chromosome short arm in Turner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bicuspid aortic valves (BAV) were found in 52/152 (34%) 45,X study subjects

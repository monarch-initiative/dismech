name: Coarctation of the Aorta
creation_date: "2026-08-10T13:40:00Z"
category: Congenital
disease_term:
  preferred_term: aorta coarctation
  term:
    id: MONDO:0007345
    label: aorta coarctation
description: >
  A congenital narrowing of the thoracic aorta, characteristically at the isthmus
  adjacent to the ductus arteriosus, accounting for roughly 5-8% of congenital
  heart disease. It is the most surgically satisfying of the congenital heart
  lesions and the most misleading. The obstruction can be excised or dilated, the
  gradient abolished, and the anatomy made to look normal - and yet the majority
  of patients are hypertensive again within a few years, and late cardiovascular
  mortality stays high.
  The reason is that the narrowing is a local expression of a diffuse
  arteriopathy, not the disease itself. The pre-coarctation vessels are
  structurally abnormal - stiffer, with impaired endothelium-dependent and
  endothelium-independent dilation - and remain so after the obstruction is
  relieved. Sympathetic outflow is elevated and the baroreflex is blunted; the
  renin-angiotensin system is primed before any operation, and the preoperative
  renin concentration predicts hypertension years later. What the surgeon removes
  is the segment. What persists is the vascular phenotype, which then drives
  accelerated atherosclerosis, coronary disease, stroke, and premature death.
  Coarctation is therefore best modeled as a systemic arterial disease with a
  focal anatomic signature, and the entry is organized so that the post-repair
  arm is not a complication of treatment but the natural history that treatment
  fails to interrupt.
synonyms:
- aortic coarctation
- CoA
- coarctation of aorta
notes: >
  Two competing accounts of how the isthmus narrows are curated as explicit
  `mechanistic_hypotheses` rather than blended into one causal chain, because the
  literature has not settled between them and the difference has consequences for
  what a "successful" repair should be expected to achieve. The ductal-tissue
  hypothesis holds that ectopic contractile ductal tissue encircling the isthmus
  constricts as the ductus closes; the reduced-fetal-flow hypothesis holds that
  diminished antegrade flow through the isthmus in fetal life leaves it
  hypoplastic. They are not mutually exclusive: the 1982 angiographic study that
  anchors both trigger nodes proposes them together as a two-component account -
  ischemic hypoplasia of the isthmus from reduced prenatal flow, plus a localized
  stenosis from misplaced ductal tissue. They are nonetheless kept as separate
  hypothesis groups rather than merged, because a given patient may have one
  component without the other: in that series 88% had an isthmus narrower than
  age-matched controls, but 11% had no localized stenosis at all.

  No module conformance is declared. Accelerated atherosclerosis after repair
  looks like a candidate for `atherogenesis`, and mechanistically it probably is
  - but the cited source is a review that surveys prevalence of atherosclerotic
  sequelae in repaired coarctation, not a study demonstrating the module's
  required apoB-retention -> foam cell -> smooth-muscle-cell fibrofatty-plaque
  chain in this population. Declaring conformance would assert the mechanism on
  the strength of an epidemiological association. Recorded here so a future
  curator with primary evidence can add it deliberately rather than discovering
  the omission looked accidental.

  The 1976 family study (PMID:1018301) surfaced in deep research is not cited:
  its abstract could not be verified to support a specific curated claim, and the
  heritability point is carried instead by the Icelandic genome-wide association
  study, which quantifies it.
pathophysiology:
- name: Ectopic Ductal Tissue at the Aortic Isthmus
  biological_scale: TISSUE
  role: trigger
  description: >
    On the ductal-tissue account, contractile smooth muscle of ductus arteriosus
    type extends ectopically into the wall of the aortic isthmus. When the ductus
    constricts and closes after birth, this ectopic tissue contracts with it,
    drawing the posterior aortic wall inward as a shelf. The account explains the
    characteristic juxtaductal location of the narrowing and the timing of
    neonatal decompensation, which follows ductal closure rather than birth.
  locations:
  - preferred_term: thoracic aorta
    term:
      id: UBERON:0001515
      label: thoracic aorta
  - preferred_term: ductus arteriosus
    term:
      id: UBERON:0005440
      label: ductus arteriosus
  cell_types:
  - preferred_term: aortic smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      localized stenosis is related to abnormal distribution of the ductal tissue
      to the descending aorta and post-natal constriction of the ductus
      arteriosus.
    explanation: >-
      States the ductal-tissue account as the authors' working hypothesis for the
      localized stenosis component, derived from angiographic morphology.
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The anterior ostium to the descending aorta was obstructed by constricted
      ductus arteriosus in some infants with COA.
    explanation: >-
      Direct angiographic observation of the constricted ductus obstructing the
      descending aortic ostium, the anatomic event this node asserts.
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Localized stenosis at the distal end of isthmus was present in 89%, and
      absent in 11% (4 cases).
    explanation: >-
      Quantifies how often a discrete localized stenosis is present, and
      establishes that a minority of cases lack it - the subgroup in which the
      ductal-tissue account cannot be the whole story.
  downstream:
  - target: Fixed Aortic Obstruction and Pressure Gradient
    causal_link_type: DIRECT
    description: >-
      Contraction of the ectopic ductal tissue narrows the isthmic lumen.
    hypothesis_groups:
    - ductal_tissue_migration
- name: Reduced Antegrade Flow Through the Fetal Aortic Isthmus
  biological_scale: TISSUE
  role: trigger
  description: >
    On the flow account, any fetal lesion that diverts blood away from the
    ascending aorta and arch - a bicuspid or stenotic aortic valve, a ventricular
    septal defect shunting left to right, a small left ventricle - reduces
    antegrade flow through the isthmus, and the underperfused segment fails to
    grow. This predicts what is observed: coarctation clusters with other
    left-heart obstructive lesions rather than occurring in isolation, is
    combined with bicuspid aortic valve in more than half of cases, and coexists
    with arch or descending aortic hypoplasia in about half.
  locations:
  - preferred_term: thoracic aorta
    term:
      id: UBERON:0001515
      label: thoracic aorta
  biological_processes:
  - preferred_term: aorta development
    term:
      id: GO:0035904
      label: aorta development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24418111
    reference_title: "Variants in the NOTCH1 gene in patients with aortic coarctation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In more than half of the cases, coarctation was combined with bicuspid
      aortic valve, and in approximately half of the cases, it was combined with
      hypoplasia of the aortic arch or descending aorta.
    explanation: >-
      Documents the co-occurrence with bicuspid valve and arch hypoplasia that
      the reduced-flow account predicts, in a consecutive clinical series.
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ischemic hypoplasia results from prenatal decrease of blood flow to the
      ascending aorta
    explanation: >-
      States the reduced-fetal-flow account as the authors' working hypothesis
      for the hypoplastic component, in the same angiographic study that proposes
      the ductal-tissue account for the localized stenosis.
  - reference: PMID:7057615
    reference_title: "Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In COA, the isthmus was narrower than the controls in 88% of the cases
    explanation: >-
      Quantifies isthmic hypoplasia against age-matched controls, the
      morphologic claim of this node.
  downstream:
  - target: Fixed Aortic Obstruction and Pressure Gradient
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      An isthmus that did not grow adequately in fetal life presents after birth
      as a fixed narrowing.
    hypothesis_groups:
    - reduced_fetal_flow
- name: Left Ventricular Outflow Tract Developmental Program Disruption
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Coarctation is highly heritable and sits within a genetically shared spectrum
    of left ventricular outflow tract malformations. NOTCH1 variants recur across
    bicuspid aortic valve, aortic aneurysm, hypoplastic left heart, and
    coarctation. A rare MYH6 missense variant carried by around a fifth of
    Icelandic coarctation cases associates with coarctation and with bicuspid
    valve. PRDM6, a smooth-muscle-specific transcription factor already
    implicated in patent ductus arteriosus, links the ductal and aortic lesions
    at the level of smooth muscle identity - the same cell type the ductal-tissue
    hypothesis invokes. Loss of one X chromosome short arm in Turner syndrome
    reproduces the bicuspid-valve/coarctation pair, localizing a dosage-sensitive
    contribution to Xp.
  genes:
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  - preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  - preferred_term: PRDM6
    term:
      id: hgnc:9350
      label: PRDM6
  evidence:
  - reference: PMID:29590334
    reference_title: "A rare missense mutation in MYH6 associates with non-syndromic coarctation of the aorta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 20% of individuals with CoA in Iceland carry this mutation.
      We show that p.Arg721Trp also associates with other CHDs, in particular
      bicuspid aortic valve.
    explanation: >-
      Quantifies a single MYH6 variant's contribution to coarctation in a
      population-based genome-wide study and links it to the bicuspid valve.
  - reference: PMID:29590334
    reference_title: "A rare missense mutation in MYH6 associates with non-syndromic coarctation of the aorta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is increasingly recognized as a highly heritable condition.
    explanation: >-
      Supports the heritability claim underpinning a developmental-genetic
      trigger node.
  - reference: PMID:24418111
    reference_title: "Variants in the NOTCH1 gene in patients with aortic coarctation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the R1279H substitution in the NOTCH1 gene is
      significantly overrepresented in patients with aortic coarctation
    explanation: >-
      Supports a NOTCH1 contribution, graded PARTIAL because this is a single

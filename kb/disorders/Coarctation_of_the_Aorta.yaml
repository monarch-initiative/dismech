    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CT angiography (CTA) confirmed a severe coarctation, with a minimal
      luminal diameter of 3 mm, located 38 mm distal to the left subclavian
      artery, and extensive collateral circulation via intercostal and internal
      mammary arteries.
    explanation: >-
      Documents the intercostal and internal mammary collateral network in a
      severe coarctation, the vessels this node asserts enlarge.
  - reference: PMID:40671984

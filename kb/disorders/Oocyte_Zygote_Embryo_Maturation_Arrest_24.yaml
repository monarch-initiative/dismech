diagnosis:
- name: Genetic testing after recurrent preimplantation embryo arrest
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility gene panel including the tubulin
    genes can be considered for women with recurrent preimplantation embryo
    arrest after assisted reproduction. Biallelic TUBA1C variants should be
    confirmed by segregation.
  evidence:
  - reference: PMID:39209701
    reference_title: Biallelic variants in α-tubulin isotypes cause female infertility characterised as recurrent preimplantation embryo arrest.
    supports: SUPPORT

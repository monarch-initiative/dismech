- name: Biallelic TUBA1C Truncating Variants
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Two homozygous truncating variants in TUBA1C, a nonsense allele
    (p.Gln358Ter) and a frameshift allele (p.Asp444Metfs*42), were identified in
    women with recurrent preimplantation embryo arrest. TUBA1C encodes an
    alpha-tubulin isotype; alpha/beta-tubulin heterodimers polymerise to form the
    microtubules of the meiotic and mitotic spindle.

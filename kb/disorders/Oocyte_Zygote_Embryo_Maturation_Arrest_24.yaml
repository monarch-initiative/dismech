- name: Spindle Assembly Defect
  biological_scale: CELLULAR
  description: >-
    The TUBA1C variants cause spindle assembly defects. Because alpha/beta
    tubulin heterodimers build the spindle microtubules, loss of an alpha-tubulin
    isotype disrupts formation of a normal bipolar spindle in the oocyte and
    early embryo.
  biological_processes:
  - preferred_term: spindle assembly

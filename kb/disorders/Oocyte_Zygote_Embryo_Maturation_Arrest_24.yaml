    explanation: The disorder was identified by exome sequencing of an RPEA cohort.
treatments:
- name: Donor-oocyte in vitro fertilization
  action_category: THERAPEUTIC
  description: >-
    No corrective or curative therapy exists. Because the defect is intrinsic to
    the affected woman's own oocytes and early embryos, standard IVF/ICSI with
    autologous oocytes fails through recurrent arrest, and donor-oocyte IVF is
    the principal route to pregnancy. Recorded as the clinical management option;
    the defining report does not describe a treatment, so no outcome evidence is
    cited here.
  treatment_term:
    preferred_term: donor-oocyte in vitro fertilization
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
discussions:
- discussion_id: tuba1c_downstream_mechanism_inferred
  prompt: >-
    Beyond the demonstrated spindle assembly defect, are the downstream steps of
    the TUBA1C mechanism — depletion of the assembly-competent alpha/beta-tubulin
    dimer pool and consequent chromosome mis-segregation — actually established
    for TUBA1C, or only inferred from the better-characterised beta-tubulin gene
    TUBB8?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Spindle Assembly Defect
  - pathophysiology#Recurrent Preimplantation Embryo Developmental Arrest
  rationale: >-
    The only TUBA1C-specific functional readout in the defining study is that the
    variants cause spindle assembly defects. The transcriptomic analysis of
    arrested embryos — the work that examined spindle organisation, chromosome
    segregation and mRNA decay — was performed on embryos carrying TUBA4A
    variants, not TUBA1C. The dimer-depletion and chromosome-mis-segregation
    steps are therefore drawn by analogy to the alpha/beta-tubulin heterodimer
    biology established for TUBB8, and no TUBA1C animal or cell model has been
    reported. The chain to embryo arrest should be read as inferred below the
    spindle-defect node.
  evidence:
  - reference: PMID:39209701
    reference_title: Biallelic variants in α-tubulin isotypes cause female infertility characterised as recurrent preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we characterised changes in the human arrested embryo
      transcriptome carrying TUBA4A variants, with a particular focus on spindle
      organisation, chromosome segregation and mRNA decay.
    explanation: >-
      The downstream transcriptomic and chromosome-segregation characterisation
      was done on TUBA4A-variant embryos, so the equivalent steps for TUBA1C are
      inferred rather than directly shown.

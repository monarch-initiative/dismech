      label: spindle assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:39209701
    reference_title: Biallelic variants in α-tubulin isotypes cause female infertility characterised as recurrent preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These variants cause varying degrees of spindle assembly defects.
    explanation: >-
      In vitro functional analysis attributes spindle assembly defects to the
      identified tubulin variants.
  downstream:
  - target: Recurrent Preimplantation Embryo Developmental Arrest
    description: >-
      A defective spindle cannot support the chromosome segregation of early
      cleavage divisions, so embryos arrest before the blastocyst stage.
- name: Recurrent Preimplantation Embryo Developmental Arrest
  biological_scale: ORGANISM
  description: >-
    Fertilised embryos arrest during the preimplantation cleavage divisions and
    do not reach the blastocyst stage, the defining clinical presentation of this
    disorder.
  evidence:
  - reference: PMID:39209701

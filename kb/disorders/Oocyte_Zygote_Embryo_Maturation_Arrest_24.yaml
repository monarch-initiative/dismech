    TUBA1C encodes an alpha-tubulin isotype. Two homozygous truncating variants
    were reported in women with recurrent preimplantation embryo arrest, the
    report that defined TUBA1C as a novel genetic marker for this phenotype.
    TUBA4A, reported in the same study, is the separate numbered entity
    oocyte/zygote/embryo maturation arrest 23 (MONDO:0979231), not curated here.

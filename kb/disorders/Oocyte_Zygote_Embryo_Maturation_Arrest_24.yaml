name: Oocyte/Zygote/Embryo Maturation Arrest 24
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte/zygote/embryo maturation arrest 24
  term:
    id: MONDO:0979232
    label: oocyte/zygote/embryo maturation arrest 24
synonyms:
- oocyte/zygote/embryo maturation arrest 24
- OZEMA24
- oocyte maturation defect 24
- OOMD24
- TUBA1C-related female infertility
- TUBA1C-related recurrent preimplantation embryo arrest
description: >-
  Oocyte/zygote/embryo maturation arrest 24 (OZEMA24) is an autosomal-recessive
  form of primary female infertility caused by biallelic variants in TUBA1C, one
  of the alpha-tubulin isotype genes. Affected women present with recurrent
  preimplantation embryo developmental arrest (RPEA) during assisted reproductive
  technology: oocytes are retrieved and may fertilize, but the resulting embryos
  arrest before reaching the blastocyst stage, so no transferable embryo is
  obtained. The disease was defined by whole-exome sequencing of an RPEA cohort,
  in which two homozygous truncating TUBA1C variants (p.Gln358Ter and
  p.Asp444Metfs*42) were identified. Alpha-tubulin and beta-tubulin heterodimers
  are the building blocks of the microtubule spindle; the beta-tubulin isotype
  gene TUBB8 is an established cause of oocyte meiotic arrest and RPEA, whereas
  the alpha-tubulin isotypes were poorly studied in preimplantation development
  before this report. The TUBA1C variants cause spindle assembly defects, which
  are the proposed basis of the embryonic arrest.
parents:
- hereditary disease
- female reproductive system disease

  species: Mus musculus
  genotype: Surf1−/−
  background: B6D2F1/J (C57BL/6J × DBA2)
  publication: PMID:24911525
  description: >-
    The viable truncated-Surf1 model was studied in male mice aged 5–7 months for heart and skeletal-muscle energetics.

- name: Investigational SURF1 Gene Addition
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  description: >-
    Preclinical SURF1 gene addition has been studied in the Leigh disease context. Lower-expression JeTI AAV9 constructs
    improve selected mouse COX readouts, but human CMT4K benefit has not been established by these experiments.
    The original CBh construct caused multi-tissue toxicity in rats; the revised design had no adverse histology
    in a small four-week rat experiment. This limited result does not establish long-term human safety. The reported
    exercise-lactate change with JeTI was not statistically significant against untreated knockout animals (p=0.0609).
  evidence:
  - reference: PMID:40893166
    reference_title: Improved AAV9-based gene therapy design for SURF1-related Leigh syndrome with minimal toxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: AAV9/JeTI-hSURF1v2 significantly increased cerebrum COX activity compared with the KO + vehicle group (p = 0.0497) of the mice treated at PND10 but not at PND28.
    explanation: >-
      Selected biochemical efficacy depends on treatment timing.
    directness: INDIRECT
  - reference: PMID:40893166
    reference_title: Improved AAV9-based gene therapy design for SURF1-related Leigh syndrome with minimal toxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Signs of cytotoxicities were identified in spinal cord, dorsal root ganglia (DRG), the tibial and sciatic nerves, and heart and liver tissues at all doses tested.
    explanation: >-
      Original CBh vector toxicity in wild-type rats.
    directness: INDIRECT
  - reference: PMID:40893166
    reference_title: Improved AAV9-based gene therapy design for SURF1-related Leigh syndrome with minimal toxicity.

name: Charcot-Marie-Tooth Disease Type 4K
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4K (CMT4K) is an autosomal recessive
  demyelinating peripheral neuropathy caused by biallelic variants in SURF1,
  which encodes an assembly factor for mitochondrial respiratory chain complex
  IV (cytochrome c oxidase). It is unusual among the CMT4 subtypes: the other
  members of that series arise from loss of Schwann-cell myelin-maintenance
  genes, whereas CMT4K is an oxidative phosphorylation disorder whose leading
  manifestation happens to be peripheral nerve. Patients present with severe
  childhood-onset demyelinating neuropathy with markedly slowed motor
  conduction, accompanied by lactic acidosis, and may later develop cerebellar
  ataxia and putaminal or periaqueductal brain lesions — features that overlap
  the Leigh syndrome caused by the same gene. The distinguishing molecular
  observation is that complex IV remains partially functional in muscle and
  fibroblasts, which is the current explanation for why these patients present
  as neuropathy rather than as fulminant Leigh encephalopathy.

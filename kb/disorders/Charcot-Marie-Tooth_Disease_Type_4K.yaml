- name: Aberrant SURF1 Splicing
  biological_scale: MOLECULAR
  description: >-
    Homozygous c.107-2A>G disrupts the intron-2 acceptor of the source transcript NM_003172.3. Proband fibroblast
    cDNA contained exon-skipping and cryptic-acceptor products without a normally spliced transcript. Premature
    termination codons were identified; nonsense-mediated decay and degradation of truncated protein were proposed
    rather than directly measured.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The c.107-2A>G, affecting the invariant AG dinucleotide at the acceptor splice site in intron 2, results either in exon skipping or in the use of preexisting but weaker cryptic acceptor sites.
    explanation: >-
      RT-PCR and sequencing of cloned proband fibroblast products identified abnormal splice junctions.
  genetic_context:
    gene:
      preferred_term: SURF1
      term:
        id: hgnc:11474
        label: SURF1
    zygosity: HOMOZYGOUS
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    functional_impact_category: LOSS_OF_FUNCTION
    description: c.107-2A>G at the intron-2 splice acceptor; functional studies in one proband.
  downstream:
  - target: SURF1 Protein Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal transcripts accompany absent detectable protein; the relative contributions of RNA decay and protein
      degradation were not experimentally separated.
- name: SURF1 Protein Deficiency
  biological_scale: MOLECULAR
  description: >-
    SURF1 protein was undetectable with monoclonal and polyclonal antibodies in mitochondria-enriched fibroblast
    preparations from the homozygous c.107-2A>G proband. These results establish protein deficiency in the assayed
    cells, not a Schwann-cell-specific expression defect.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: no specific immunoreactive band was detected using either a monoclonal (figure 3A) or a polyclonal antibody (not shown) against SURF1, confirming the virtual absence of SURF1 protein in the proband.
    explanation: >-
      Western blot result in the CMT4K proband fibroblasts.
  downstream:
  - target: Reduced Complex IV Assembly
    causal_link_type: DIRECT
    description: >-
      SURF1 deficiency compromises the efficient assembly of complex IV. Residual holoenzyme is detectable despite
      absent SURF1.
- name: Reduced Complex IV Assembly
  biological_scale: MOLECULAR
  description: >-
    Blue-native electrophoresis in the CMT4K proband fibroblasts showed markedly reduced fully assembled cytochrome
    c oxidase, with residual signal at 18% of control by MTCO1 and 8% by COX4 detection. No subassembly species
    were detected in that experiment. Accumulated intermediates in other SURF1-deficient cell lines are broader
    mechanistic context and must not be attributed to this patient.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the proband's fibroblasts, fully assembled COX was markedly reduced compared with the mean value from 2 controls, using both MTCO1 (18%) and COX4 (8%) antibodies, with no evidence of subassembly species.
    explanation: >-
      Direct assembly assay in one CMT4K fibroblast line, compared with two controls.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  downstream:
  - target: Reduced Complex IV Activity
    causal_link_type: DIRECT
    description: >-
      Lower assembled complex IV abundance accompanies reduced COX enzymatic activity in the proband.
- name: Reduced Complex IV Activity
  biological_scale: MOLECULAR
  description: >-
    Isolated COX deficiency was measured in muscle and cultured fibroblasts of the index proband, retaining 18%
    and 26% of mean control activity, respectively. His sister and the unrelated patient declined these biopsies.
    Residual activity is also reported in SURF1-related Leigh syndrome; neither these values nor absent SURF1 protein
    establish why peripheral neuropathy predominates.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Spectrophotometric analysis of the MRC complexes demonstrated an isolated defect of COX activity, with 18% of the mean control values (table 2). The activity of the citrate synthase was normal.
    explanation: >-
      Muscle-biopsy enzyme activity from the single tested CMT4K proband.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In cultured fibroblasts, an isolated COX deficiency was also detected, with 26% of the mean control values.
    explanation: >-
      Cultured fibroblasts from the same proband; this is a second assay, not a second patient.
  downstream:
  - target: Peripheral Nerve Demyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Respiratory-chain dysfunction is associated with the neuropathy, but the route from COX deficiency to myelin
      injury is unresolved; Schwann-cell ATP failure was not measured.
  - target: Peripheral Axonal Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Axonal loss accompanies the COX-deficient neuropathy; its timing relative to demyelination and cellular mechanism
      remain uncertain.
  - target: Systemic Lactate Elevation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced oxidative phosphorylation provides a biochemical rationale for elevated lactate, but the relevant
      tissue fluxes were not measured in these patients.
  - target: Decreased Complex IV Activity
    causal_link_type: DIRECT
    description: >-
      The biochemical defect is the measured phenotype.
- name: Peripheral Nerve Demyelination
  biological_scale: TISSUE
  description: >-
    Very slow motor conduction in the three original patients supports demyelinating neuropathy. The proband nerve
    biopsy showed hypomyelinated fibers and onion bulb formation. A primary Schwann-cell energy deficit has not
    been directly demonstrated.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Superficial peroneal nerve biopsy revealed axonal loss and hypomyelinated fibers, consistent with severe chronic demyelinating neuropathy (figure 1, B and C).
    explanation: >-
      Direct nerve histology in the index proband.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The precise molecular mechanisms linking MRC dysfunction to axonal loss and demyelination have yet to be determined, although studies on CMT-causing genes encoding mitochondrial molecules such as GDAP1, MFN2, and MRS2 suggest that perturbed axonal transport, impaired energy production, and/or defective mitochondrial Mg2+ homeostasis may be involved.29,30
    explanation: >-
      The authors explicitly identify the link between respiratory-chain dysfunction and demyelination as unresolved.
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  downstream:
  - target: Demyelinating Peripheral Neuropathy
    causal_link_type: DIRECT
    description: >-
      Clinical and electrophysiologic manifestation of nerve myelin pathology.
  - target: Decreased Motor Nerve Conduction Velocity
    causal_link_type: DIRECT
    description: >-
      Myelin dysfunction slows saltatory conduction.
- name: Peripheral Axonal Loss
  biological_scale: TISSUE
  description: >-
    Axonal loss and degeneration were documented alongside myelin abnormalities in the index proband nerve biopsy.
    This does not establish a temporal sequence in which demyelination necessarily precedes axonal injury.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Superficial peroneal nerve biopsy revealed axonal loss and hypomyelinated fibers, consistent with severe chronic demyelinating neuropathy (figure 1, B and C).
    explanation: >-
      Direct evidence of axonal loss in the biopsied nerve.
  downstream:
  - target: Distal Muscle Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Motor axonal injury can contribute to distal denervation and wasting; motor-unit loss was not separately quantified.
  - target: Distal Sensory Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sensory axonal dysfunction can contribute to lower-limb sensory loss; subtype-specific fiber loss was not
      measured.
- name: Systemic Lactate Elevation
  biological_scale: ORGANISM
  description: >-
    Fasting resting lactate was elevated in all three original patients: 3.3, 2.9 and 2.5 mmol/L against a laboratory
    upper limit of 1.8 mmol/L. The paper calls this lactic acidosis; blood pH was not reported in the patient narratives.
    Lactate elevation is a clue to mitochondrial involvement, not an exclusive discriminator among CMT subtypes.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Under fasting conditions, lactic acidosis was observed at rest (3.3 mmol/L; normal <1.8).
    explanation: >-
      Index proband measurement.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Under fasting conditions, lactic acidosis was observed at rest (2.9 mmol/L; normal <1.8).
    explanation: >-
      Affected sister measurement.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Under fasting conditions, elevated plasma lactate was present at rest (2.5 mmol/L; normal <1.8).
    explanation: >-
      Unrelated patient measurement.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: DIRECT
    description: >-
      Clinical biochemical finding described as lactic acidosis in the original series.

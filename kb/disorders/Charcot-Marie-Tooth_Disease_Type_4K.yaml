name: Charcot-Marie-Tooth Disease Type 4K
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4K (CMT4K) is an autosomal recessive demyelinating sensorimotor neuropathy caused
  by biallelic SURF1 variants. SURF1 encodes an assembly factor for mitochondrial respiratory chain complex IV (cytochrome
  c oxidase). The original three patients from two families presented in childhood with marked conduction slowing,
  distal muscle wasting, sensory loss, areflexia and elevated lactate. Hearing loss, nystagmus, kyphoscoliosis,
  brain MRI abnormalities and later cerebellar ataxia occurred in different combinations. In the one biochemically
  investigated patient, absent SURF1 protein accompanied reduced but residual complex IV assembly and activity.
  Residual activity also occurs in SURF1-related Leigh syndrome and does not explain or reliably distinguish the
  neuropathy-predominant presentation. The basis of this clinical variability remains unresolved.

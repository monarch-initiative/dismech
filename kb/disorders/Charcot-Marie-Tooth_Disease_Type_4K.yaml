    reduced. Mitochondrial biogenesis markers increased in both tissues; UPRmt markers increased principally in
    muscle and Nrf2/HO-1 in heart. Basal and exercise lactate increased and endurance declined. These adaptations
    do not demonstrate a compensatory mechanism in human CMT4K nerve.

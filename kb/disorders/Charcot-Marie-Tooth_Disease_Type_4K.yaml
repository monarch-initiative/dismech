inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic SURF1 variants are required. The index family was consanguineous
    with a homozygous splice-site variant; a further patient carried two
    additional SURF1 variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe 2 patients from a consanguineous family with demyelinating autosomal recessive CMT disease (CMT4) associated with the homozygous splice site mutation c.107-2A>G in the SURF1 gene, encoding an assembly factor of the mitochondrial respiratory chain complex IV."
    explanation: >-
      Homozygous variant in a consanguineous pedigree establishes autosomal
      recessive inheritance.
pathophysiology:
- name: SURF1 Loss and Impaired Complex IV Assembly
  biological_scale: MOLECULAR
  description: >-
    Biallelic SURF1 variants abolish the SURF1 assembly factor for cytochrome c
    oxidase. The index splice-site variant produced no normally spliced
    transcript and no SURF1 protein. Critically, complex IV activity was only
    partially reduced in muscle and fibroblasts rather than abolished.
  genetic_context:
    gene:
      preferred_term: SURF1
      term:
        id: hgnc:11474
        label: SURF1
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: Mitochondrial Respiratory Chain Complex IV Assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.107-2A>G mutation produced no normally spliced transcript, leading to SURF1 absence. However, complex IV remained partially functional in muscle and fibroblasts."
    explanation: >-
      Documents complete loss of SURF1 protein alongside only partial loss of
      complex IV function — the observation that separates CMT4K from
      SURF1-related Leigh syndrome.
  - reference: PMID:26804654
    reference_title: Tissue- and species-specific differences in cytochrome c oxidase assembly induced by SURF1 defects.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The crucial differences observed are an accumulation of abundant COX1 assembly intermediates, low content of COX monomer and preferential recruitment of COX into I-III2-IVn SCs in SURF1 patient fibroblasts"
    explanation: >-
      Characterizes how SURF1 loss perturbs COX assembly in human patient
      fibroblasts. Graded PARTIAL because it is measured in fibroblasts, not in
      peripheral nerve, so it constrains rather than establishes the
      tissue-selectivity argument this entry makes.
  downstream:
  - target: Schwann Cell Energy Failure and Demyelination
    description: >-
      Reduced oxidative phosphorylation capacity in the peripheral nerve
      compromises myelin maintenance, producing a demyelinating neuropathy.
  - target: Delayed Basal Ganglia and Brainstem Injury
    description: >-
      The same complex IV deficit injures energy-demanding CNS grey matter,
      but years later than the nerve involvement in these patients.
  - target: Systemic Lactic Acidosis
    description: >-
      Impaired terminal oxidation shifts pyruvate toward lactate, producing the
      lactic acidosis seen in all reported patients.
- name: Schwann Cell Energy Failure and Demyelination
  biological_scale: CELLULAR
  description: >-
    Energy failure in myelinating Schwann cells produces severe demyelination
    with motor nerve conduction velocities below 25 m/s. The specific step by
    which reduced complex IV capacity injures the myelinating Schwann cell has
    not been demonstrated directly in this disease.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: Myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 3 patients with SURF1-associated CMT4 presented with severe childhood-onset neuropathy, motor nerve conduction velocities <25 m/s, and lactic acidosis."
    explanation: >-
      Conduction velocities under 25 m/s establish the demyelinating character
      of the neuropathy.
  - reference: PMID:23829769
    reference_title: "SURF1 deficiency: a multi-centre natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral neuropathy was present in 13/16 (81%) (demyelinating 7/16, axonal 2/16)."
    explanation: >-
      A 44-patient multi-centre natural history cohort of SURF1 deficiency finds
      peripheral neuropathy in 81% of those assessed, demyelinating in most.
      This reframes the nerve involvement as a majority feature of SURF1
      deficiency rather than a peculiarity of the three CMT4K probands.
  downstream:
  - target: Severe Childhood-Onset Demyelinating Neuropathy
    description: >-
      Loss of myelin integrity manifests clinically as early, severe motor and
      sensory neuropathy.
- name: Delayed Basal Ganglia and Brainstem Injury
  biological_scale: TISSUE
  description: >-
    Complex IV deficiency also injures the putamen and periaqueductal grey —
    the lesion distribution of Leigh syndrome — but in CMT4K this appears years
    after the presenting polyneuropathy rather than as the initial event. This
    node is the mechanistic bridge between CMT4K and SURF1-related Leigh
    syndrome, and why the two are the same molecular defect with different
    tempo.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had brain MRI abnormalities, including putaminal and periaqueductal lesions, and developed cerebellar ataxia years after polyneuropathy."
    explanation: >-
      Documents the CNS lesion distribution and its delayed onset relative to
      the neuropathy.
  downstream:
  - target: Cerebellar Ataxia
    description: >-
      Progressive CNS grey-matter injury manifests as cerebellar ataxia
      developing years after the neuropathy.
  - target: Putaminal and Periaqueductal Lesions
    description: >-
      The injury is visible on brain MRI as putaminal and periaqueductal
      lesions.
- name: Systemic Lactic Acidosis
  biological_scale: ORGANISM
  description: >-
    Reduced terminal oxidation raises systemic lactate. Lactic acidosis is the
    metabolic clue that distinguishes CMT4K from the other CMT4 subtypes at the
    bedside.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 3 patients with SURF1-associated CMT4 presented with severe childhood-onset neuropathy, motor nerve conduction velocities <25 m/s, and lactic acidosis."
    explanation: >-
      Lactic acidosis observed in all three patients, reported as a result
      rather than inferred from the authors' screening recommendation.
- name: Severe Childhood-Onset Demyelinating Neuropathy
  biological_scale: ORGANISM
  description: >-
    The defining clinical presentation: severe demyelinating polyneuropathy
    beginning in childhood, which may be followed years later by central
    nervous system involvement.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 3 patients with SURF1-associated CMT4 presented with severe childhood-onset neuropathy, motor nerve conduction velocities <25 m/s, and lactic acidosis."
    explanation: >-
      All three reported patients presented in childhood with severe
      demyelinating neuropathy, which is the claim this node makes.

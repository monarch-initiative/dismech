diagnosis:
- name: Nerve conduction studies with lactate and SURF1 sequencing
  description: >-
    The authors' own screening recommendation: consider SURF1 in childhood-onset
    severe demyelinating neuropathy accompanied by lactic acidosis, brain MRI
    abnormalities, or later cerebellar ataxia.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SURF1 should be systematically screened in patients with childhood-onset severe demyelinating neuropathy and additional features such as lactic acidosis, brain MRI abnormalities, and cerebellar ataxia developing years after polyneuropathy."
    explanation: >-
      States the diagnostic trigger for SURF1 testing. This sentence is a
      diagnostic recommendation and belongs here rather than as evidence for a
      pathophysiology node.
- name: Broader Genomic Testing for Unresolved Neuropathy
  description: >-
    The original study prioritizes SURF1 testing when severe early demyelinating neuropathy accompanies lactate
    elevation or central signs. General CMT guidance also supports exome or genome sequencing after initial gene
    testing is unrevealing. Panel content and variant types detected vary; an unrevealing CMT panel should not be
    assumed to have excluded SURF1.

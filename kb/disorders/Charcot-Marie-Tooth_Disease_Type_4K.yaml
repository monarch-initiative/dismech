differential_diagnoses:
- name: SURF1-Related Leigh Syndrome
  description: >-
    SURF1-related Leigh syndrome and neuropathy-predominant CMT4K overlap molecularly and clinically. The distinction
    concerns the presenting features and disease course, not absent versus residual COX activity. Both can have
    elevated lactate, peripheral neuropathy and brain lesions. A normal early MRI or a neuropathy-leading presentation
    does not define a separate molecular mechanism. Adult-onset SURF1-related Leigh syndrome has also been reported;
    age alone does not define the distinction.
  evidence:
  - reference: PMID:23829769
    reference_title: "SURF1 deficiency: a multi-centre natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging demonstrated lesions characteristic of LS in 28/33 (85%) and atypical findings in 3/33 (9%)."
    explanation: >-
      In the SURF1 natural history cohort, Leigh-characteristic neuroimaging is
      the majority finding, against which the neuropathy-leading CMT4K
      presentation is the contrast.
  - reference: PMID:36599233
    reference_title: "Natural History of SURF1 Deficiency: A Retrospective Chart Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brainstem is frequently involved with the medulla and midbrain being the most common sites."
    explanation: >-
      Characterizes the brainstem-predominant lesion distribution of the wider
      SURF1 deficiency spectrum against which CMT4K is distinguished.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients with SURF1-associated LS show severely reduced COX activity in muscle and fibroblasts (5%–21% of normal values).
    explanation: >-
      The primary CMT4K paper explicitly describes residual activity in SURF1-associated Leigh syndrome, refuting
      the former binary biochemical distinction.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: several disorders, e.g., SURF1-related LSS and PDHA1-related LSS, have been associated with a continuous spectrum of disease ranging from LSS to isolated features including peripheral neuropathy (Charcot-Marie-Tooth disease) and episodic dystonia.
    explanation: >-
      GeneReviews places peripheral-neuropathy presentations within a continuous SURF1 disease spectrum.
  - reference: DOI:10.1155/crnm/7611187
    reference_title: "Adult‐Onset Leigh Syndrome due to\n                    <i>SURF1</i>\n                    Mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a mild very late adult‐onset LS revealed in a 36‐year‐old man who presented with diplopia and walking difficulties.
    explanation: >-
      The final 2026 publication classifies the newer adult case as Leigh syndrome, rather than adding a fourth
      case to the original childhood demyelinating CMT4K series.
    directness: INDIRECT
- name: Other CMT4 Subtypes
  description: >-
    Other recessive demyelinating CMT disorders can resemble CMT4K clinically and electrophysiologically. Their
    mechanisms are heterogeneous: GDAP1 is itself a mitochondrial protein. Lactate elevation or central signs justify
    broader investigation, but neither feature should be asserted to exclude all other CMT subtypes.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GDAP1, the most frequent genetic cause for CMT4, encodes a protein anchored to the mitochondrial outer membrane, thus demonstrating that mitochondrial disorders may manifest with demyelinating polyneuropathy as the predominant feature.
    explanation: >-
      The primary discussion explicitly provides another mitochondrial cause of CMT4; its historical frequency ranking
      is not adopted here.
discussions:
- discussion_id: cmt4k_why_nerve_predominant
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Complex IV Activity
  prompt: Why do some individuals with biallelic SURF1 variants develop neuropathy-predominant disease rather than an early Leigh encephalopathy?
  rationale: >-
    The original study measured absent SURF1 and residual COX in one CMT4K fibroblast line; residual COX also occurs
    in Leigh syndrome. The same splice-site allele has appeared in both clinical contexts. Compensatory genetic
    or epigenetic mechanisms were proposed, but nerve tissue bioenergetics, a cell-specific causal route and a genotype-based
    rule were not established.
- discussion_id: cmt4k_model_translation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Complex IV Activity
  prompt: Which model readouts predict peripheral nerve benefit from SURF1 restoration?
  rationale: >-
    SURF1-deficient mouse lines differ substantially in survival, COX deficit and stress responses. Human and mouse
    fibroblasts also differ in assembly-intermediate turnover and supercomplex incorporation. Biochemical rescue
    in the 2025 gene-therapy study does not establish correction of demyelinating neuropathy; treatment-related
    rat toxicity demonstrates that tolerated mouse exposure does not alone establish translational safety.
  evidence:
  - reference: PMID:40893166
    reference_title: Improved AAV9-based gene therapy design for SURF1-related Leigh syndrome with minimal toxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the current animal model makes it difficult to determine whether the number of cells we are targeting with the current therapy is enough to provide any neurological benefits.
    explanation: >-
      The authors identify the unresolved link from biochemical rescue to neurological benefit.
    directness: INDIRECT
notes: >-
  Patient-level CMT4K observations here derive principally from three individuals in two families in the 2013 study.
  The complete article supplies phenotype, MRI, segregation and assay details that the abstract compresses. Broader
  SURF1 natural-history series and GeneReviews inform the overlapping Leigh spectrum and general care; their frequencies
  and survival estimates are not CMT4K estimates. Phenotype frequency bands are omitted because the small selected
  case series and current Orphanet definition do not provide reliable population frequency estimates. The two tissues
  assayed for COX came from one patient. The biologic basis of peripheral-nerve predominance remains unresolved.

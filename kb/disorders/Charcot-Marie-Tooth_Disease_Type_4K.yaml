differential_diagnoses:
- name: SURF1-Related Leigh Syndrome
  description: >-
    The same gene produces a severe infantile encephalopathy. dismech curates
    it separately as SURF1-Related Leigh Syndrome. Both share brainstem and
    basal-ganglia MRI lesions and lactic acidosis; CMT4K is distinguished by a
    presenting demyelinating neuropathy and by only partial loss of complex IV
    function.
  evidence:
  - reference: PMID:23829769
    reference_title: "SURF1 deficiency: a multi-centre natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging demonstrated lesions characteristic of LS in 28/33 (85%) and atypical findings in 3/33 (9%)."
    explanation: >-
      In the SURF1 natural history cohort, Leigh-characteristic neuroimaging is
      the majority finding, against which the neuropathy-leading CMT4K
      presentation is the contrast.
  - reference: PMID:36599233
    reference_title: "Natural History of SURF1 Deficiency: A Retrospective Chart Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brainstem is frequently involved with the medulla and midbrain being the most common sites."
    explanation: >-
      Characterizes the brainstem-predominant lesion distribution of the wider
      SURF1 deficiency spectrum against which CMT4K is distinguished.
- name: Other CMT4 Subtypes
  description: >-
    CMT4A/B1/B2/C/D/F/J are demyelinating autosomal recessive neuropathies from
    Schwann-cell gene loss, without lactic acidosis or central lesions. dismech
    curates them as has_subtypes entries on Charcot-Marie-Tooth Disease Type 4.
discussions:
- discussion_id: cmt4k_why_nerve_predominant
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#SURF1 Loss and Impaired Complex IV Assembly
  prompt: >-
    Why does complete SURF1 loss produce a peripheral-nerve-predominant
    phenotype in some individuals and infantile Leigh encephalopathy in others?
  rationale: >-
    PMID:24027061 shows SURF1 protein is entirely absent yet complex IV remains
    partially functional in muscle and fibroblasts, and proposes this as the
    explanation. The residual activity was not measured in peripheral nerve,
    and no genotype-based rule separating the two presentations has been
    established, so the causal step from partial complex IV function to nerve
    tropism remains inferred rather than demonstrated.
- discussion_id: cmt4k_entry_vs_subtype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Charcot-Marie-Tooth Disease Type 4K
  prompt: >-
    Should CMT4K be a standalone Disease entry, or a has_subtypes entry on
    Charcot-Marie-Tooth Disease Type 4 alongside 4A-4J?
  rationale: >-
    MONDO gives CMT4K two parents — Charcot-Marie-Tooth disease type 4 and
    mitochondrial oxidative phosphorylation disorder — and dismech's CMT4 entry
    handles every other subtype inline, so a has_subtypes entry there was the
    default.

    An earlier version of this rationale argued that CMT4's pathophysiology
    nodes are uniformly Schwann-cell myelin-gene loss and so could not host a
    mitochondrial mechanism. That was wrong, and is corrected here: CMT4's first
    pathophysiology node is "GDAP1 Mitochondrial Dynamics Defect", and the
    entry's architecture is per-gene upstream nodes converging on a shared
    "Demyelination and Secondary Axonal Loss" terminal node. A SURF1 complex IV
    node would fit that structure without strain.

    The actual argument for a standalone entry is precedent plus clinical
    envelope. dismech already curates gene-level standalone entries for this
    exact family — SURF1-Related Leigh Syndrome, and the SCO1-, SCO2-, PET100-,
    PET117-, TACO1-, COX8A- and FASTKD5-Related COX Deficiency entries — and
    CMT4K's lactic acidosis and basal-ganglia lesions put it outside the CMT4
    clinical envelope, which no other CMT4 subtype leaves. A curator weighting
    nosological consistency over that precedent could still reasonably fold it
    in.
notes: >-
  The CMT4K-specific evidence rests on PMID:24027061, which reports three
  patients from two families. The 5% case fraction comes from a single referral
  series of 41 genetically unexplained CMT4 families and should not be read as
  a population estimate.

  An earlier version of this note claimed no natural-history data were found.
  That was too broad: it was true of CMT4K as a named entity but false of SURF1
  deficiency, for which PMID:23829769 is a 44-patient multi-centre cohort
  reporting peripheral neuropathy in 81% of those assessed. That figure is now
  curated. Read it carefully — it is the neuropathy frequency in SURF1
  deficiency generally, not the frequency of the CMT4K presentation, in which
  neuropathy is the leading rather than an accompanying feature. The distinction
  matters and no cohort has quantified the CMT4K presentation itself.

  The two GeneReviews references are tagged but carry no evidence item. Their
  cached PubMed records are purpose-statement stubs with no minable clinical
  text, so quoting them would mean inventing a snippet; they are recorded as
  provenance for the two disease families this entry sits between.

  No treatment or prevalence data specific to CMT4K were found. The treatments
  curated here are the supportive measures shared with the other CMT4 subtypes,
  not CMT4K-specific evidence.

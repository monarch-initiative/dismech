genetic:
- name: SURF1
  gene_term:
    preferred_term: SURF1
    term:
      id: hgnc:11474
      label: SURF1
  relationship_type: CAUSATIVE
  notes: >-
    The original series identified a homozygous splice-site variant in two siblings and a compound heterozygous
    missense/frameshift pair in an unrelated patient. Functional studies were limited to the splice-site proband.
    The same c.107-2A>G allele has also been reported in trans with another allele in Leigh syndrome; genotype alone
    does not establish a neuropathy-only course.
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found SURF1 mutations in 5% of families (2/41) presenting with CMT4."
    explanation: >-
      Quantifies the SURF1 contribution to genetically unexplained CMT4.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband and his sister harbored a homozygous change in SURF1 gene, the recently reported A to G substitution (c.107-2A>G), abolishing the invariable consensus AG splice acceptor site of intron 2 (figure 1F).8
    explanation: >-
      Homozygous genotype.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The patient was compound heterozygous for 2 SURF1 variants: i) a previously reported missense change c.574C>T, resulting in the substitution of the arginine residue at codon 192 with a tryptophan (p.Arg192Trp)9; and ii) a novel deletion (c.799_800del). The patient inherited the c.574C>T from her mother and the c.799_800del from her father.'
    explanation: >-
      Compound heterozygous genotype.
  case_fractions:
  - population: Genetically unresolved CMT4 referral families in the original study
    case_fraction_percent: 5.0
    cohort_size: 41
    notes: >-
      Two of 41 families, comprising the index family and 40 screened families. This is an enriched referral series,
      not a population prevalence or the fraction of all CMT4 caused by SURF1. The screening panel was not uniform:
      PMP22, MPZ and GJB1 had been analyzed in all 40 additional patients, while GDAP1, MTMR2, PRX and SH3TC2 had
      been screened in 20.
    evidence:
    - reference: PMID:24027061
      reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found SURF1 mutations in 5% of families (2/41) presenting with CMT4."
      explanation: >-
        Source of the 2/41 case fraction.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
      reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: PMP22, MPZ, and GJB1 had been previously analyzed in all 40 patients. In addition, GDAP1, MTMR2, PRX, and SH3TC2 genes had been screened in 20 patients.
      explanation: >-
        Methods establish the incomplete and nonuniform prior gene-screening scope.
  variants:
  - name: NM_003172.3:c.107-2A>G
    gene:
      preferred_term: SURF1
      term:
        id: hgnc:11474
        label: SURF1
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    description: >-
      Homozygous intron-2 acceptor variant in the original siblings. Proband fibroblasts showed aberrant splicing
      and absent detectable SURF1. The transcript accession is the one used in the primary study.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
      reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The c.107-2A>G, affecting the invariant AG dinucleotide at the acceptor splice site in intron 2, results either in exon skipping or in the use of preexisting but weaker cryptic acceptor sites.
      explanation: >-
        Experimentally demonstrated splice defect in one patient fibroblast line.
  - name: c.574C>T (p.Arg192Trp)
    gene:
      preferred_term: SURF1
      term:
        id: hgnc:11474
        label: SURF1
    variant_type: single nucleotide variant
    genomic_contexts:
    - coding sequence
    description: >-
      Maternal missense allele in trans with c.799_800del in the unrelated patient. Pathogenicity predictions and
      prior reporting were described; functional samples from this patient were unavailable.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
      reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The patient was compound heterozygous for 2 SURF1 variants: i) a previously reported missense change c.574C>T, resulting in the substitution of the arginine residue at codon 192 with a tryptophan (p.Arg192Trp)9; and ii) a novel deletion (c.799_800del). The patient inherited the c.574C>T from her mother and the c.799_800del from her father.'
      explanation: >-
        Patient genotype and parental segregation.
  - name: c.799_800del (p.Leu267GlufsX24)
    gene:
      preferred_term: SURF1
      term:
        id: hgnc:11474
        label: SURF1
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    description: >-
      Paternal two-base deletion in trans with c.574C>T; the paper predicts a frameshift and abnormal C terminus.
      Protein fate was not measured in this patient.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
      reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The c.799_800del is predicted to produce a truncated protein (p.Leu267GlufsX24) with an abnormal C-terminus.
      explanation: >-
        Predicted consequence, not a directly measured protein result.

inheritance:
- name: Autosomal Recessive
  description: >-
    The original affected siblings were homozygous for c.107-2A>G. An unrelated patient inherited c.574C>T (p.Arg192Trp)
    from her mother and c.799_800del from her father, establishing the reported compound heterozygous configuration.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband and his sister harbored a homozygous change in SURF1 gene, the recently reported A to G substitution (c.107-2A>G), abolishing the invariable consensus AG splice acceptor site of intron 2 (figure 1F).8
    explanation: >-
      Homozygous splice-site variant in affected siblings from a consanguineous family.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The patient was compound heterozygous for 2 SURF1 variants: i) a previously reported missense change c.574C>T, resulting in the substitution of the arginine residue at codon 192 with a tryptophan (p.Arg192Trp)9; and ii) a novel deletion (c.799_800del). The patient inherited the c.574C>T from her mother and the c.799_800del from her father.'
    explanation: >-
      Parental segregation documents the two variants in trans in the unrelated patient.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      Autosomal-recessive CMT counseling; conditional on both parents carrying the familial causal alleles.
    directness: INDIRECT
pathophysiology:
- name: Biallelic SURF1 Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous splice-site and compound heterozygous missense/frameshift variants cause the reported CMT4K presentations.
    Functional effects were investigated in fibroblasts from the c.107-2A>G proband; absent protein is not experimentally
    established for every CMT4K allele.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband and his sister harbored a homozygous change in SURF1 gene, the recently reported A to G substitution (c.107-2A>G), abolishing the invariable consensus AG splice acceptor site of intron 2 (figure 1F).8
    explanation: >-
      Splice-site genotype of the index family.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3888171/
    reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The patient was compound heterozygous for 2 SURF1 variants: i) a previously reported missense change c.574C>T, resulting in the substitution of the arginine residue at codon 192 with a tryptophan (p.Arg192Trp)9; and ii) a novel deletion (c.799_800del). The patient inherited the c.574C>T from her mother and the c.799_800del from her father.'
    explanation: >-
      Distinct compound heterozygous genotype in the second family.

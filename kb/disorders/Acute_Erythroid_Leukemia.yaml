notes: >-
  Classification of this entity has changed substantially and remains
  actively debated; see the `definitions` and `discussions` blocks. In brief:
  FAB/WHO 2001-2008 recognized two subtypes by erythroid/blast percentage
  alone (M6a erythroid/myeloid and M6b pure erythroid); WHO 2016 eliminated
  M6a as a distinct AML entity, reclassifying most such cases as MDS, AML-MR,
  or AML/MDS-NOS by blast percentage; WHO-HAEM5 (2022) retains and renames
  M6b as the current, TP53-centered AEL/pure erythroid leukemia entity used
  as the primary scope of this file; and the ICC (2022) instead folds pure
  erythroid leukemia into a broader "AML with mutated TP53" category rather
  than keeping a separately named erythroid entity. A comprehensive genomic
  study (Iacobucci et al., PMID:30926971) argues the WHO 2016 reclassification
  of the erythroid/myeloid category was not well supported by mutational
  data, so this boundary should be read as unsettled rather than as a fixed
  fact. Curators extending this entry should not assume any single historical
  source's "AEL" or "M6" definition is interchangeable with the current
  WHO-HAEM5 scope used here.

name: Acute Erythroid Leukemia
creation_date: "2026-08-26T00:00:00Z"
description: >-
  Acute erythroid leukemia (AEL, MONDO:0017858; historically FAB M6) is a rare
  acute myeloid leukemia subtype defined by a predominant, maturation-arrested
  erythroid population with marked dyserythropoiesis. Classification has moved
  substantially and is scoped narrowly here. WHO-HAEM5 (2022) restricts AEL to
  what was previously called pure erythroid leukemia: erythroid predominance
  (usually >=80% of bone marrow elements) of which >=30% are proerythroblasts,
  with a high prevalence of biallelic TP53 alterations; the diagnosis
  supersedes AML with myelodysplasia-related changes (AML-MR). The ICC (2022)
  reaches a closely related but not identical position, folding pure erythroid
  leukemia into the broader "AML with mutated TP53" category rather than
  keeping a separate erythroid-defined entity. Both classifications retired
  the older, broader "erythroleukemia" (myeloid/erythroid, FAB M6a) category,
  which lacked a reproducible blast-count-independent biological definition
  and is now diagnosed as MDS, AML-MR, or AML/MDS not otherwise specified
  depending on blast percentage and genetics. This entry is scoped to the
  current, TP53-centered AEL/pure erythroid leukemia concept; see `notes` and
  the classification `discussions` entry for the reclassification history and
  the ongoing genomic-versus-morphologic debate over where the boundary
  belongs.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Molecularly Defined Cancer
parents:
- acute myeloid leukemia
disease_term:
  preferred_term: acute erythroid leukemia
  term:
    id: MONDO:0017858
    label: acute erythroid leukemia
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:35732831
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Acute erythroid leukaemia (AEL) (previously pure erythroid leukaemia,
        an acceptable related term in this edition) is a distinct AML type
        characterized by neoplastic proliferation of erythroid cells with
        features of maturation arrest and high prevalence of biallelic TP53
        alterations.
      explanation: >-
        WHO-HAEM5 places AEL as a distinct type within the AML family,
        supporting placement in Harrison's oncology/hematology Part.
  icdo_morphology:
    classification_value: Leukemia
    evidence:
    - reference: PMID:35732831
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The diagnosis of AEL supersedes AML-MR.
      explanation: >-
        WHO-HAEM5 confirms AEL as a leukemia (not a myelodysplastic) diagnosis
        that takes precedence over the AML-MR category when its criteria are
        met.
definitions:
- name: WHO-HAEM5 acute erythroid leukaemia definition
  definition_type: DIAGNOSTIC_CRITERIA
  scope: WHO Classification of Haematolymphoid Tumours, fifth edition
  description: >-
    WHO-HAEM5 restricts AEL to erythroid-predominant marrow (usually >=80% of
    bone marrow elements) of which >=30% are proerythroblasts, and underscores
    the central role of biallelic TP53 alterations. AEL cases with somewhat
    lower erythroid percentage sharing the same clinicopathologic features are
    still recognized. The diagnosis supersedes AML-MR when its criteria are
    met.
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic criteria include erythroid predominance, usually >=80% of
      bone marrow elements, of which >=30% are proerythroblasts (or
      pronormoblasts).
    explanation: WHO-HAEM5 states the defining marrow-percentage criteria for AEL.
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The central role that biallelic TP53 mutations play in this aggressive
      AML type is underscored
    explanation: WHO-HAEM5 emphasizes biallelic TP53 alteration as central to the entity.
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of AEL supersedes AML-MR.
    explanation: WHO-HAEM5 states the diagnostic precedence of AEL over AML-MR.
- name: ICC AML with mutated TP53 definition (pure erythroid leukemia arm)
  definition_type: DIAGNOSTIC_CRITERIA
  scope: International Consensus Classification 2022
  description: >-
    The ICC does not retain a separately named erythroid-defined entity.
    Instead it folds pure erythroid leukemia into the broader "AML with
    mutated TP53" category, unified by TP53 mutation status rather than
    lineage percentage. This is a materially different classification
    boundary from WHO-HAEM5, not merely a naming difference.
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      By contrast, the 2022 International Consensus Classification (ICC)
      includes PEL under a broader category of "acute myeloid leukemia with
      mutated TP53".
    explanation: >-
      A dedicated PEL case series states the ICC's differing classification
      boundary relative to WHO.
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pure erythroid leukemia (PEL), also known as acute erythroid leukemia
      (AEL), is recognized as a distinct morphologic entity by both the 2016
      and 2022 World Health Organization (WHO) classification system.
    explanation: Confirms WHO's continued recognition of a distinct morphologic entity across editions, contrasted with the ICC's TP53-unified approach.
- name: Retired FAB/WHO 2008-2016 erythroid/myeloid (M6a) category
  definition_type: DIAGNOSTIC_CRITERIA
  scope: Historical FAB and WHO 2001/2008 classification (superseded)
  description: >-
    The FAB classification and WHO 2001/2008 editions recognized two AEL
    subtypes by erythroid/blast percentage alone: "M6a" (erythroid/myeloid,
    >=50% erythroid cells plus >=20% blasts among non-erythroid cells) and
    "M6b" (pure erythroid, >=80% erythroid precursors). WHO 2016 eliminated
    M6a as an AML entity, reclassifying most such cases as MDS, AML-MR, or
    AML/MDS not otherwise specified based on blast percentage rather than
    biology; M6b was retained, renamed pure erythroid leukemia, and is the
    direct ancestor of the current WHO-HAEM5 AEL definition. This history is
    recorded here so the historical FAB "M6" label is not read as
    interchangeable with the current, much narrower AEL concept.
  evidence:
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      "M6a" cases had at least 50% erythroid cells and at least 20% blasts of
      non-erythroid cells in bone marrow.
    explanation: States the historical FAB/WHO 2008 M6a erythroid/myeloid criteria.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      M6a was merged into a hybrid subtype of myelodysplasia and AML
      (specifically, "myelodysplastic syndrome (MDS) or AML, not otherwise
      specified (NOS) (non-erythroid subtype)" based on the percentage of
      blasts in the bone marrow rather than biological or genetic features.
    explanation: Documents the WHO 2016 reclassification of the erythroid/myeloid category into MDS/AML-NOS by blast percentage.
  - reference: PMID:37246017
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since the first recognition of an erythroid-predominant hematologic
      malignancy in the early 20th century, AEL has gone through a turnstile
      of changing definitions and nomenclature, including eritoleucemia,
      erythremic myelosis, AML-M6 and pure erythroid leukemia.
    explanation: A dedicated history review documents the succession of names and definitions culminating in the current entity.
discussions:
- discussion_id: ael-classification-boundary-controversy
  kind: CONTROVERSY
  prompt: >-
    Should AEL/pure erythroid leukemia be defined by erythroid lineage
    percentage and morphology (the WHO-HAEM5 approach) or unified with other
    TP53-mutated AML/MDS by genomic profile alone (the position argued by
    Iacobucci et al. and reflected in part by the ICC)?
  status: OPEN
  rationale: >-
    A comprehensive genomic comparison of AEL against non-erythroid AML and
    MDS found that the mutational spectrum of AEL is statistically distinct
    from both, arguing against collapsing AEL into either category on
    genomic grounds even though TP53 mutation is common to all three. This
    directly contests the WHO 2016 blast-percentage-driven reclassification
    of the erythroid/myeloid (M6a) category into MDS, and is in tension with
    the ICC's decision to fold pure erythroid leukemia into a TP53-unified
    AML category rather than keep a distinct erythroid entity.
  attaches_to:
  - "pathophysiology#Biallelic TP53 Inactivation"
  evidence:
  - reference: PMID:30926971
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, mutational prevalence varies significantly between the three
      major subtypes of myeloid neoplasms (AEL, non-erythroid AML and MDS) in
      both children and adults, suggesting the recent reclassification of
      many AEL case as MDS or AML is unfounded from a mutational perspective.
    explanation: >-
      A large genomic cohort argues the mutational spectrum of AEL is
      distinguishable from MDS and non-erythroid AML, contesting the
      blast-percentage-only rationale for the WHO 2016 reclassification of
      the erythroid/myeloid category. Marked PARTIAL because this is one
      cohort's argument, not a settled resolution, and the current WHO-HAEM5
      and ICC positions differ from it in different directions.
  notes: >-
    Recorded so this entry does not silently pick one classification vintage
    as though the boundary were settled; see the `definitions` block for the
    WHO-HAEM5, ICC, and retired FAB/WHO 2001-2016 positions.
pathophysiology:
- name: Biallelic TP53 Inactivation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    Nearly all AEL/pure erythroid leukemia cases carry biallelic TP53
    alteration, most commonly a missense mutation plus deletion or
    copy-neutral loss of heterozygosity of the second allele, or two
    independent clonal TP53 mutations. This is the dominant recurrent lesion
    in the disease and, per WHO-HAEM5, is central to its current diagnostic
    definition.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  gene_products:
  - preferred_term: Cellular Tumor Antigen p53
    term:
      id: NCIT:C17387
      label: Cellular Tumor Antigen p53
  biological_processes:
  - preferred_term: Signal Transduction by p53 Class Mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: DECREASED
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases expressed biallelic TP53 alterations, including TP53
      deletion/single TP53 mutation (68%), two TP53 mutations (29%) or two
      TP53 deletions (3%); additional mutations were infrequent.
    explanation: >-
      A 41-case Mayo Clinic series found universal biallelic TP53 alteration
      in pure erythroid leukemia, with a breakdown of the allelic patterns.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but one of the TP53-mutated cases exhibited alterations of both
      alleles, as two clonal sequence mutations (28.0% of mutated cases), a
      mutation and DNA copy-neutral loss of heterozygosity (29.0%), or
      mutation and deletion of the other allele (39%)
    explanation: >-
      An independent genomic cohort corroborates near-universal biallelic
      TP53 alteration among TP53-mutated AEL cases and details the three
      allelic patterns.
  - reference: PMID:35636055
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure erythroid leukemia (PEL) is a rare acute leukemia with a dismal
      prognosis. TP53 mutations are a dominant feature of PEL
    explanation: >-
      A dedicated TP53-in-PEL study states TP53 mutation as the dominant
      genomic feature of the disease.
  - reference: PMID:35636055
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The TP53 mutation, commonly missense, was present in the dominant clone in all cases.
    explanation: TP53 mutation is clonally dominant, consistent with it being the founding/driving lesion rather than a subclonal passenger.
  downstream:
  - target: Loss of p53-Dependent Checkpoint and Apoptotic Control
    causal_link_type: DIRECT
    description: >-
      Biallelic loss disables the p53-dependent surveillance that would
      otherwise arrest, senesce, or eliminate cells with damaged or unstable
      genomes.
- name: Loss of p53-Dependent Checkpoint and Apoptotic Control
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    With p53 function disabled by biallelic TP53 alteration, the erythroid
    progenitor clone loses the checkpoint and apoptotic responses that would
    normally restrain proliferation of a genomically damaged or unstable
    cell, permitting continued division and accumulation of further genomic
    lesions.
  biological_processes:
  - preferred_term: Negative Regulation of Cell Cycle
    term:
      id: GO:0045786
      label: negative regulation of cell cycle
    modifier: DECREASED
  - preferred_term: Negative Regulation of Apoptotic Process
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36735909
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TP53R248Q does not affect erythroid differentiation but provides
      self-renewal and survival potential, mostly via downregulation of known
      TP53 targets.
    explanation: >-
      A mouse model directly separates the TP53-mutant contribution (survival
      and self-renewal, i.e., checkpoint/apoptosis evasion) from the
      differentiation-arrest contribution of a cooperating lesion.
  downstream:
  - target: Chromothripsis and Complex or Monosomal Karyotype
    causal_link_type: DIRECT
    description: >-
      Loss of p53-dependent genome surveillance permits gross structural
      genomic catastrophes, including chromothripsis, to persist and be
      clonally propagated rather than triggering arrest or death.
- name: Chromothripsis and Complex or Monosomal Karyotype
  biological_scale: MOLECULAR
  role: effector
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    AEL/pure erythroid leukemia is characterized by extensive karyotypic
    complexity, including a high rate of chromothripsis (massive, single-event
    chromosome shattering and reassembly) that is significantly enriched in
    TP53-mutated cases relative to MDS and non-erythroid AML. Karyotype is
    complex in essentially all cases and monosomal in the large majority, with
    deletions in 5q and 7q, monosomy 5/7, trisomy 8, and 17p13 abnormalities
    (the region containing TP53 itself) among the most common recurrent
    findings.
  biological_processes:
  - preferred_term: DNA Repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Karyotype was complex in all cases and monosomal in 90%.
    explanation: The Mayo Clinic series reports near-universal complex/monosomal karyotype in pure erythroid leukemia.
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the setting of AEL, deletions in 5q and 7q, monosomy 5 and 7, and
      trisomy 8 are the most common abnormalities detected
    explanation: A dedicated AEL review lists the specific recurrent cytogenetic abnormalities within the complex karyotype.
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a karyotypic abnormality that may be present on chromosome 17 (17p13)
      has been linked to the p53 loss of function described in a significant
      percentage of AEL patients
    explanation: Directly connects the recurrent 17p13 cytogenetic abnormality to the TP53 loss-of-function driver modeled upstream in this pathograph.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of chromothripsis, a massive shattering and reassembly of
      chromosomes
    explanation: Defines chromothripsis, the structural-instability phenomenon found recurrently in AEL.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was observed only in adults TP53-mutated cases and was associated
      with very poor cytogenetic risk
    explanation: >-
      Chromothripsis in this cohort occurred specifically in TP53-mutated
      adult AEL and tracked with very poor cytogenetic risk, linking the
      trigger lesion to this downstream instability phenotype.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic alterations of TP53 through sequence or structural
      alterations are a hallmark of a subset of AEL in adults.
    explanation: Directly ties biallelic TP53 alteration to the structural genomic instability phenotype as a hallmark of the disease.
  downstream:
  - target: EPOR/JAK2/STAT5 Signaling Amplification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - focal chromosomal gain/amplification generated by chromosomal instability
    description: >-
      The same structural instability recurrently generates focal
      gains/amplifications of the EPOR and JAK2 loci, disproportionately in
      TP53-mutated, erythroid-predominant (pure erythroid leukemia) cases.
    evidence:
    - reference: PMID:35839275
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we found a high frequency of gains and amplifications involving
        EPOR/JAK2 in TP53-mutated cases, particularly those having >80%
        erythroblasts designated as pure erythroid leukemia
      explanation: >-
        A large sequencing cohort links TP53-mutated, structurally unstable
        AEL genomes to recurrent EPOR/JAK2 amplification, especially in the
        pure erythroid (>=80% erythroblast) phenotype.
- name: EPOR/JAK2/STAT5 Signaling Amplification
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    A genetically distinct subset of TP53-mutated AEL, enriched for the pure
    erythroid phenotype, carries focal gains or amplifications of EPOR and/or
    JAK2 (sometimes with activating point mutations in either gene),
    resulting in enhanced STAT5 pathway activation. This erythropoietin-axis
    signaling amplification is a proliferative driver largely specific to
    AEL among TP53-mutated myeloid neoplasms and confers even worse prognosis
    than TP53 mutation alone.
  genes:
  - preferred_term: EPOR
    term:
      id: hgnc:3416
      label: EPOR
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  biological_processes:
  - preferred_term: Erythropoietin-Mediated Signaling Pathway
    term:
      id: GO:0038162
      label: erythropoietin-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to activation of the STAT5 pathway, a common feature across
      all AEL cases, these AEL cases exhibited enhanced cell proliferation
      and heme metabolism and often showed high sensitivity to ruxolitinib in
      vitro and in xenograft models, highlighting a potential role of JAK2
      inhibition in therapeutics of AEL.
    explanation: >-
      Directly links EPOR/JAK2 lesions to enhanced STAT5 signaling, cell
      proliferation, and heme-metabolism activity in this subgroup, and to a
      JAK2-inhibitor-sensitive phenotype.
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases were frequently accompanied by gains and amplifications of
      ERG/ETS2 and associated with a very poor prognosis, even compared with
      other TP53-mutated AEL.
    explanation: >-
      Establishes that the EPOR/JAK2-amplified subgroup is a prognostically
      distinct, worse-outcome subset within TP53-mutated AEL.
  downstream:
  - target: Erythroid Maturation Arrest at the Proerythroblast Stage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - enhanced STAT5-driven proliferative signaling in an already
      differentiation-restricted erythroid clone
    description: >-
      Amplified erythropoietin-axis signaling drives proliferation of a
      clonal erythroid population that is concurrently blocked from terminal
      differentiation by cooperating lesions, favoring expansion of arrested
      proerythroblasts rather than mature erythroid progeny.
- name: Erythroid Maturation Arrest at the Proerythroblast Stage
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The defining cellular phenotype of AEL is a block in erythroid
    differentiation at the proerythroblast stage. Mechanistic modeling shows
    that a cooperating lesion (the pediatric NFIA-ETO2 fusion is the best
    characterized example) can impair terminal erythroid differentiation by
    shifting occupancy of erythroid regulatory elements from GATA-motif to
    ETS-motif-containing target genes, repressing the terminal
    differentiation program; this differentiation block cooperates with,
    rather than requires, the TP53-mutant clone's separately conferred
    survival and self-renewal advantage.
  cell_types:
  - preferred_term: proerythroblast
    term:
      id: CL:0000547
      label: proerythroblast
  genes:
  - preferred_term: GATA1
    term:
      id: hgnc:4170
      label: GATA1
  biological_processes:
  - preferred_term: Erythrocyte Differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:36735909
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NFIA-ETO2 interferes with erythroid differentiation by preferentially
      binding and repressing erythroid genes that contain NFI binding sites
      and/or are decorated by ETO2, resulting in a activity shift from GATA-
      to ETS-motif-containing target genes.
    explanation: >-
      Direct mechanistic evidence in a mouse erythroblast model for how a
      cooperating fusion lesion produces a differentiation-arrest program
      through transcriptional-motif redistribution away from the erythroid
      GATA program.
  - reference: PMID:36735909
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in the presence of 1 of the most prevalent erythroleukemia-associated
      mutations, TP53R248Q, expression of NFIA-ETO2 resulted in aberrant
      clonogenic activity and induced a fully penetrant transplantable
      PEL-like disease in mice.
    explanation: >-
      Shows the maturation-arrest lesion cooperates with mutant TP53 to
      produce a fully penetrant pure-erythroid-leukemia-like disease,
      supporting the causal link modeled here between the two upstream
      pathophysiology arms and this differentiation-arrest node.
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent AEL patient transcriptomic data show alterations of transcription
      or downstream signaling factors that mediate GATA1 activity in more
      than 25% of the cases
    explanation: >-
      A dedicated AEL review reports that dysregulation of GATA1 or its
      transcriptional-complex partners is found in over a quarter of cases,
      generalizing the maturation-arrest mechanism beyond the single
      NFIA-ETO2 example.
  downstream:
  - target: Proerythroblast Accumulation and Marrow Replacement
    causal_link_type: DIRECT
    description: >-
      Cells blocked at the proerythroblast stage cannot exit the
      proliferative compartment through terminal differentiation, so the
      arrested population accumulates in the marrow.
- name: Proerythroblast Accumulation and Marrow Replacement
  biological_scale: TISSUE
  role: effector
  description: >-
    Arrested, immature proerythroblasts progressively expand and replace
    normal trilineage marrow elements, establishing the overt leukemic
    marrow. De novo AEL and AEL arising after MDS or MDS/MPN share this
    prominent proerythroblast-proliferation morphology, and the arrested
    proerythroblast population itself contributes to treatment resistance.
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  cell_types:
  - preferred_term: proerythroblast
    term:
      id: CL:0000547
      label: proerythroblast
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Proerythroblast have been shown to play an important role in treatment
      resistance and poor prognosis in AML patients
    explanation: >-
      WHO-HAEM5 states that proerythroblast burden itself contributes to
      treatment resistance and poor prognosis, supporting this node as a
      clinically consequential accumulation rather than a passive
      bystander population.
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PEL was primary in 14 cases, therapy-related in 14, secondary in 12, and undetermined in one.
    explanation: >-
      Documents that this end-stage marrow-replacement phenotype arises
      through multiple clinical routes (de novo, therapy-related, and
      secondary to a prior hematologic disorder), consistent with a shared
      downstream mechanism reached from different upstream contexts.
  downstream:
  - target: Leukemia
    causal_link_type: DIRECT
    description: >-
      Marrow replacement by a clonal, maturation-arrested erythroid
      population constitutes the overt acute leukemia phenotype.
  - target: Suppression of Normal Hematopoiesis
    causal_link_type: DIRECT
    description: >-
      Expansion of the leukemic proerythroblast compartment crowds out and
      impairs production of normal erythroid, myeloid, and megakaryocytic
      progeny.
- name: Suppression of Normal Hematopoiesis
  biological_scale: TISSUE
  role: consequence
  description: >-
    The leukemic marrow environment suppresses normal trilineage
    hematopoiesis, producing the pancytopenia (anemia, thrombocytopenia,
    neutropenia) that dominates the clinical presentation and drives
    infectious and bleeding complications.
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AEL is characterized by proliferation of erythroid and myeloid blast
      cells in the bone marrow and is associated with a poor prognosis
    explanation: >-
      States the marrow-based, proliferative-blast character of AEL that
      underlies subsequent normal-hematopoiesis suppression.
  downstream:
  - target: Anemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - suppression of residual normal erythropoiesis by the leukemic clone
    description: Reduced normal erythroid output lowers circulating red-cell mass.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - suppression of normal megakaryocytic output
    description: Reduced normal megakaryocytic output lowers the platelet count.
  - target: Neutropenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - suppression of normal granulocytic output
    description: Reduced normal granulocytic output lowers the mature neutrophil count.
histopathology:
- name: Proerythroblast-Predominant Marrow with Marked Dyserythropoiesis
  finding_term:
    preferred_term: Pure Erythroid Leukemia
    term:
      id: NCIT:C7467
      label: Pure Erythroid Leukemia
  diagnostic: true
  description: >-
    Bone marrow shows erythroid predominance (usually >=80% of marrow
    elements) of which >=30% are proerythroblasts/pronormoblasts, with
    marked dyserythropoiesis (nuclear budding, multinucleation, megaloblastoid
    change) that can be difficult to distinguish morphologically from severe
    reactive dyserythropoiesis.
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic criteria include erythroid predominance, usually >=80% of
      bone marrow elements, of which >=30% are proerythroblasts (or
      pronormoblasts).
    explanation: WHO-HAEM5 states the diagnostic marrow morphology criteria.
phenotypes:
- category: Hematologic
  name: Leukemia
  description: >-
    Clonal proliferation of maturation-arrested leukemic proerythroblasts in
    the bone marrow, with or without circulating blasts.
  phenotype_term:
    preferred_term: Leukemia
    term:
      id: HP:0001909
      label: Leukemia
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute erythroid leukaemia (AEL) (previously pure erythroid leukaemia,
      an acceptable related term in this edition) is a distinct AML type
      characterized by neoplastic proliferation of erythroid cells with
      features of maturation arrest and high prevalence of biallelic TP53
      alterations.
    explanation: WHO-HAEM5 establishes AEL as a distinct AML/leukemia entity.
- category: Hematologic
  name: Erythroid Dysplasia
  description: >-
    Marked dysplastic change in the erythroid lineage, including nuclear
    budding, multinucleation, and megaloblastoid features, is a hallmark
    morphologic finding.
  phenotype_term:
    preferred_term: Erythroid dysplasia
    term:
      id: HP:0031688
      label: Erythroid dysplasia
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      De novo AEL and cases that arise following MDS or MDS/MPN
    explanation: >-
      WHO-HAEM5 groups de novo and secondary AEL together as sharing the same
      distinctive dysplastic erythroid morphology.
- category: Hematologic
  name: Anemia
  description: >-
    Suppression of normal erythropoiesis by the leukemic marrow reduces
    circulating red-cell mass.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:37246017
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It is now well-documented that true AEL, which is characterized
      primarily by immature erythroid proliferation, often harbors highly
      complex cytogenetic changes and multiple, deleterious TP53 mutations.
    explanation: >-
      Establishes the marrow-replacing erythroid-proliferative disease
      process that produces anemia through suppression of normal
      erythropoiesis; the review does not itself quantify anemia frequency.
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Marrow replacement suppresses normal megakaryocytic output, reducing the
    platelet count.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  context: AML-wide marrow-failure phenotype rather than an AEL-specific frequency estimate.
  evidence:
  - reference: PMID:30926971
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AEL is characterized by proliferation of erythroid and myeloid blast
      cells in the bone marrow and is associated with a poor prognosis
    explanation: >-
      Supports marrow-replacement pathophysiology consistent with
      thrombocytopenia without an AEL-specific quantitative frequency.
- category: Hematologic
  name: Neutropenia
  description: >-
    Marrow replacement suppresses normal granulocytic output, reducing the
    mature neutrophil count and increasing infection risk.
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  context: AML-wide marrow-failure phenotype rather than an AEL-specific frequency estimate.
  evidence:
  - reference: PMID:30926971
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AEL is characterized by proliferation of erythroid and myeloid blast
      cells in the bone marrow and is associated with a poor prognosis
    explanation: >-
      Supports marrow-replacement pathophysiology consistent with
      neutropenia without an AEL-specific quantitative frequency.
genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Central, near-universal somatic driver lesion; biallelic alteration is characteristic of the disease
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  variants:
  - name: Biallelic TP53 alteration (mutation plus deletion/LOH, or two mutations)
    description: >-
      Biallelic TP53 alteration occurs through one of three patterns: a
      single missense/nonsense mutation combined with deletion of the other
      allele, a single mutation combined with copy-neutral loss of
      heterozygosity, or two independent clonal mutations. Missense
      mutations predominate and are most often in the DNA-binding domain.
    gene:
      preferred_term: TP53
      term:
        id: hgnc:11998
        label: TP53
    type: biallelic_alteration
    functional_effects:
    - function: p53-dependent checkpoint and apoptotic signaling
      description: >-
        Biallelic loss-of-function alteration abolishes p53-dependent
        surveillance of genomic damage.
      type: loss of function
    evidence:
    - reference: PMID:30926971
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All but one of the TP53-mutated cases exhibited alterations of both
        alleles, as two clonal sequence mutations (28.0% of mutated cases), a
        mutation and DNA copy-neutral loss of heterozygosity (29.0%), or
        mutation and deletion of the other allele (39%)
      explanation: Establishes the three recurrent biallelic-alteration patterns and their relative frequency.
  case_fractions:
  - population: Mayo Clinic pure erythroid leukemia case series
    case_fraction_percent: 100.0
    cohort_size: 41
    notes: >-
      All 41 cases in this series carried biallelic TP53 alteration; this is
      a case-series fraction among patients already diagnosed with pure
      erythroid leukemia, not a general-population or all-AML frequency.
    evidence:
    - reference: PMID:36323674
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All cases expressed biallelic TP53 alterations, including TP53
        deletion/single TP53 mutation (68%), two TP53 mutations (29%) or two
        TP53 deletions (3%); additional mutations were infrequent.
      explanation: States the 100% biallelic TP53 alteration rate in this cohort with the allelic-pattern breakdown.
  review_notes: >-
    TP53 alteration in this disease is essentially always biallelic; a
    single heterozygous TP53 mutation without a second hit is atypical for
    AEL/pure erythroid leukemia as currently defined and should prompt
    reconsideration of the diagnosis or search for a cryptic second hit
    (structural variation, LOH).
- name: EPOR
  gene_term:
    preferred_term: EPOR
    term:
      id: hgnc:3416
      label: EPOR
  association: Recurrent focal amplification defining a poor-prognosis, pure-erythroid-phenotype subset of TP53-mutated AEL
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found a high frequency of gains and amplifications involving
      EPOR/JAK2 in TP53-mutated cases, particularly those having >80%
      erythroblasts designated as pure erythroid leukemia
    explanation: Establishes EPOR amplification as a recurrent cooperating lesion enriched in the pure-erythroid, TP53-mutated subgroup.
  review_notes: >-
    EPOR/JAK2 co-amplification defines a subgroup with in vitro and xenograft
    sensitivity to the JAK inhibitor ruxolitinib; this is preclinical model
    evidence, not an established clinical treatment indication.
- name: JAK2
  gene_term:
    preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  association: Recurrent focal amplification, and occasional activating mutation, cooperating with TP53 loss and EPOR amplification
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases were frequently accompanied by gains and amplifications of
      ERG/ETS2 and associated with a very poor prognosis, even compared with
      other TP53-mutated AEL.
    explanation: Establishes the JAK2/EPOR-amplified subgroup as prognostically distinct within TP53-mutated AEL.
- name: GATA1
  gene_term:
    preferred_term: GATA1
    term:
      id: hgnc:4170
      label: GATA1
  association: Recurrent dysregulation of the GATA1 transcriptional complex, either directly or via its interacting partners, underlying the erythroid maturation arrest
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  case_fractions:
  - population: AEL patient transcriptomic cohorts
    case_fraction_percent: 25.0
    notes: >-
      "More than 25%" is a lower-bound estimate reported by a review
      synthesizing transcriptomic data across AEL cohorts; it captures
      dysregulation of GATA1 activity itself or of its direct transcriptional
      partners/interactors (e.g., ERG, ETO2, SKI, SPI1), not GATA1 coding
      mutation alone.
    evidence:
    - reference: PMID:38892446
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Recent AEL patient transcriptomic data show alterations of
        transcription or downstream signaling factors that mediate GATA1
        activity in more than 25% of the cases
      explanation: States the case fraction with dysregulated GATA1-complex activity.
  evidence:
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ectopic expression of these physical or functional interactors of the
      GATA1 transcriptional complexes (ERG, ETO2, SKI, and SPI1) in murine
      erythroid progenitors resulted in decreased chromatin accessibility at
      GATA1-binding sites and promoted proliferation with the immature
      phenotype
    explanation: >-
      A review of mouse-model data shows that ectopic expression of GATA1
      transcriptional-complex interactors reduces accessibility at
      GATA1-binding sites and drives an immature, proliferative erythroid
      phenotype, mechanistically supporting GATA1-complex disruption as a
      route to the maturation-arrest node.
  review_notes: >-
    GATA1 itself is only rarely directly mutated or fused (e.g., MYB-GATA1)
    in AEL; the more common route to erythroid maturation arrest is
    dysregulation of its transcriptional-complex partners (ERG, ETO2, SKI,
    SPI1, FLI1) rather than a GATA1 coding lesion, per the same review.
differential_diagnoses:
- name: Erythroid Hyperplasia in Megaloblastic Anemia
  disease_term:
    preferred_term: megaloblastic anemia
    term:
      id: MONDO:0001700
      label: megaloblastic anemia
  description: >-
    Severe vitamin B12 or folate deficiency produces marked erythroid
    hyperplasia with megaloblastic, sometimes strikingly atypical, erythroid
    precursors that can superficially resemble the dysplastic proerythroblast
    proliferation of AEL. Unlike AEL, this is a reactive, non-clonal process
    driven by ineffective erythropoiesis and intramedullary destruction of
    defective erythroid precursors, and it resolves with B12/folate
    repletion rather than requiring leukemia-directed therapy.
  distinguishing_features:
  - >-
    Megaloblastic marrow lacks biallelic TP53 alteration and complex/monosomal
    karyotype, unlike AEL/pure erythroid leukemia.
  - >-
    Erythroid precursors show classic megaloblastic nuclear-cytoplasmic
    asynchrony rather than the proerythroblast-predominant dysplasia of AEL.
  - >-
    Low serum B12/folate, elevated methylmalonic acid and/or homocysteine,
    and rapid, complete hematologic resolution with vitamin repletion confirm
    the diagnosis.
  evidence:
  - reference: PMID:19094231
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concurrent hemolysis in patients with vitamin B12 deficiency is a
      well-recognized phenomenon and has been attributed to intramedullary
      destruction of erythrocytes (ineffective erythropoiesis).
    explanation: >-
      Supports the reactive, ineffective-erythropoiesis basis of the
      erythroid hyperplasia seen in B12 deficiency, distinguishing its
      mechanism from the clonal, TP53-driven proliferation of AEL.
- name: Congenital Dyserythropoietic Anemia
  disease_term:
    preferred_term: congenital dyserythropoietic anemia
    term:
      id: MONDO:0019403
      label: congenital dyserythropoietic anemia
  description: >-
    The congenital dyserythropoietic anemias (CDAs) are inherited disorders
    of erythroid differentiation/proliferation that produce dysplastic
    erythroid precursors (multinuclearity, internuclear chromatin bridging)
    and ineffective erythropoiesis, morphologically overlapping with the
    dyserythropoiesis of AEL but arising from germline variants rather than
    an acquired, TP53-driven clonal leukemic process.
  distinguishing_features:
  - >-
    CDA presents from infancy/childhood with a chronic, non-progressive
    course and a specific germline genetic cause (e.g., CDAN1, SEC23B, KLF1),
    without biallelic TP53 alteration, complex karyotype, or blast excess.
  - >-
    CDA shows characteristic ultrastructural findings (e.g., binuclearity,
    chromatin bridges, or a spongy heterochromatin pattern depending on
    type), whereas AEL shows leukemic proerythroblast-predominant dysplasia.
  - >-
    AEL is acquired, typically presents in older adults, and carries the
    TP53/cytogenetic abnormalities characteristic of clonal leukemia.
  evidence:
  - reference: PMID:32702750
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital dyserythropoietic anemias (CDAs) are a heterogeneous group
      of inherited anemias that affect the normal differentiation-proliferation
      pathways of the erythroid lineage.
    explanation: Defines CDA as an inherited erythroid differentiation disorder, the key distinction from acquired, clonal AEL.
  - reference: PMID:32702750
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They belong to the wide group of ineffective erythropoiesis conditions
      that mainly result in monolinear cytopenia.
    explanation: Characterizes CDA as an ineffective-erythropoiesis, monolinear-cytopenia disorder rather than a leukemic marrow-replacement process.
- name: Myelodysplastic Syndrome with Erythroid Predominance
  disease_term:
    preferred_term: myelodysplastic syndrome
    term:
      id: MONDO:0018881
      label: myelodysplastic syndrome
  description: >-
    Myelodysplastic syndrome can present with marked erythroid hyperplasia
    and dysplasia, and this is precisely the diagnostic space the retired
    "erythroid/myeloid" (M6a) AEL category was reclassified into under WHO
    2016: cases with erythroid predominance but blast counts and biology
    below the current AEL threshold are now diagnosed as MDS rather than AEL.
  distinguishing_features:
  - >-
    Diagnosis turns on the current WHO-HAEM5 blast/proerythroblast thresholds
    (AEL requires marked erythroid predominance with >=30% proerythroblasts).
  - >-
    Biallelic TP53 alteration with complex/monosomal karyotype favors
    AEL/pure erythroid leukemia, while lower blast counts, non-TP53
    MDS-typical mutations (e.g., SF3B1, ASXL1), and a more indolent course
    favor MDS.
  - >-
    The ICC's TP53-unified "AML with mutated TP53" category and the ongoing
    genomic-versus-morphologic classification debate (see `discussions`)
    mean this boundary is actively contested rather than fixed.
  evidence:
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M6a was merged into a hybrid subtype of myelodysplasia and AML
      (specifically, "myelodysplastic syndrome (MDS) or AML, not otherwise
      specified (NOS) (non-erythroid subtype)" based on the percentage of
      blasts in the bone marrow rather than biological or genetic features.
    explanation: Documents the specific reclassification of erythroid-predominant, lower-blast cases into MDS/AML-NOS.
  - reference: PMID:30926971
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MDS-associated mutations such as SF3B1 and
      ASXL1 were less frequent in AEL compared to MDS
    explanation: Provides a molecular distinguishing feature (relative depletion of classic MDS-driver mutations in AEL) supporting differentiation from MDS.
treatments:
- name: Hypomethylating Agent Plus Venetoclax
  description: >-
    Combination therapy with a hypomethylating agent (azacitidine or
    decitabine) and the BCL-2 inhibitor venetoclax is the most commonly used
    regimen in reported AEL/pure erythroid leukemia series, reflecting its
    broader use in TP53-mutated and older/unfit AML. Reported outcomes remain
    poor: in one series no responses or allogeneic transplants were achieved
    regardless of regimen.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azacitidine
      term:
        id: CHEBI:2038
        label: 5-azacytidine
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment details were available in 29 patients: hypomethylating agent
      (HMA) alone (n = 5), HMA + venetoclax (n = 12), intensive chemotherapy
      (n = 4), supportive care/other (n = 8)
    explanation: Documents HMA + venetoclax as the most frequently used regimen among treated patients in this series.
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no responses or allogeneic stem cell transplants were documented, and
      all patients died at a median 1.8 months (range 0.2-9.3).
    explanation: >-
      Reports the outcome across all treatment approaches in this series,
      establishing that current regimens are largely ineffective rather than
      overstating any single regimen's benefit.
- name: Intensive Cytarabine-Based Chemotherapy
  description: >-
    Intensive induction chemotherapy analogous to standard AML regimens is
    used in a minority of patients, generally younger or fitter ones, but
    has not been shown to produce durable responses in reported AEL/pure
    erythroid leukemia series.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment details were available in 29 patients: hypomethylating agent
      (HMA) alone (n = 5), HMA + venetoclax (n = 12), intensive chemotherapy
      (n = 4), supportive care/other (n = 8)
    explanation: Documents intensive chemotherapy as one of the treatment approaches used, though in a minority of patients.
  - reference: PMID:38892446
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The objective response rate (ORR) was 72%, according to the ELN
      criteria. Complete response (CR) occurred in 79 patients (66%), partial
      response (PR) in 7 (6%), stable disease (SD) in 16 (13%), and primary
      disease progression (PPD) in 17 (14%).
    explanation: >-
      A 217-patient multinational cohort reports substantial response rates
      to intensive chemotherapy; marked PARTIAL because this cohort applied
      older, less stringent AEL definitions and so overlaps what would now be
      classified as MDS or other AML, per the same review.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    Allogeneic hematopoietic cell transplantation (allo-HCT), typically as
    consolidation after remission induction, is the only treatment approach
    reported to be potentially curative in AEL/pure erythroid leukemia.
    Achieving the deep remission required to proceed to transplant is itself
    a major challenge in this TP53-driven, chemoresistant disease, so only a
    minority of patients reach transplant.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  evidence:
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic bone marrow transplantation (AlloBMT) is the only
      potentially curative approach for AEL, but it requires deep remission
      of the disease, which is rarely achieved in these patients
    explanation: States that allo-HCT is the only potentially curative approach, and names the deep-remission requirement that limits how many patients reach it.
  - reference: PMID:38892446
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median OS of AlloBMT recipients was 89 months, compared to 5 months
      for those who did not undergo AlloBMT
    explanation: >-
      Reports a large survival benefit for patients who reach transplant
      versus those who do not, in a cohort study cited by this review; this
      is a selected-population comparison (transplant eligibility itself
      correlates with fitness and remission depth) rather than a randomized
      estimate of transplant's isolated effect.
- name: Investigational JAK Inhibition in EPOR/JAK2-Amplified Disease
  description: >-
    In preclinical models, AEL cases with EPOR and/or JAK2 gain/amplification
    show high sensitivity to the JAK1/2 inhibitor ruxolitinib in vitro and in
    patient-derived xenografts, suggesting a targeted therapeutic strategy
    for this molecularly defined subgroup. This is model-system evidence and
    has not been established as a standard clinical treatment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: EPOR/JAK2/STAT5 Signaling Amplification
    treatment_effect: INHIBITS
    description: >-
      Ruxolitinib inhibits JAK1/2 kinase activity, blocking the amplified
      EPOR/JAK2-driven STAT5 signaling that this subgroup depends on.
  evidence:
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Their frequent response to ruxolitinib in patient-derived xenograft and
      cell culture models highlights a possible therapeutic role of JAK2
      inhibition for erythroleukemia with EPOR/JAK2-involving lesions.
    explanation: >-
      States the preclinical (patient-derived xenograft and cell culture)
      basis for JAK2 inhibition as a possible targeted approach in this
      genomically defined subgroup; evidence_source is MODEL_ORGANISM because
      the response data are from xenograft and cell-line models, not treated
      patients.
- name: Best Supportive Care
  description: >-
    Given the dismal response to available regimens, many patients,
    particularly those unfit for intensive or hypomethylating-agent-based
    therapy, are managed with supportive care (transfusion support,
    infection prophylaxis/treatment) alone.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment details were available in 29 patients: hypomethylating agent
      (HMA) alone (n = 5), HMA + venetoclax (n = 12), intensive chemotherapy
      (n = 4), supportive care/other (n = 8)
    explanation: Documents supportive care/other as a treatment approach used in nearly a third of treated patients in this series.
prevalence:
- population: Reported AML case series (AEL as a proportion of all AML)
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    AEL/pure erythroid leukemia accounts for approximately 0.5% to 1.5% of
    all AML cases in reported series; this is a proportion of diagnosed AML,
    not a general-population prevalence rate, so no rate_per_100000 is given.
  evidence:
  - reference: PMID:35839275
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      acute erythroid leukemia (AEL) represents a rare subtype of acute
      myeloid leukemia (AML), accounting for 0.5% to 1.5% of AML cases
    explanation: States the proportion of AML cases represented by AEL.
progression:
- phase: Diagnosis and TP53/Cytogenetic Risk Assessment
  notes: >-
    Diagnosis requires marrow morphology meeting the current WHO-HAEM5
    erythroid-predominance/proerythroblast threshold plus TP53 mutation
    testing and karyotype, since biallelic TP53 alteration and
    complex/monosomal karyotype are near-universal and central to both
    diagnosis and prognosis. EPOR/JAK2 status may further stratify a
    molecularly distinct, especially poor-prognosis subgroup.
  evidence:
  - reference: PMID:35732831
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The central role that biallelic TP53 mutations play in this aggressive
      AML type is underscored
    explanation: WHO-HAEM5 places TP53 status at the center of the diagnostic and prognostic framework for this disease.
- phase: Rapid Clinical Decline Despite Treatment
  notes: >-
    Reported outcomes are extremely poor overall. A 41-case, entirely
    TP53-biallelic Mayo Clinic series treated across the modern HMA/HMA
    plus venetoclax/intensive-chemotherapy/supportive-care spectrum saw no
    responses or transplants and a median survival of 1.8 months. A larger,
    more heterogeneous 217-patient multinational cohort using older
    definitions reported a longer median overall survival, and the small
    subset of patients who reached allogeneic transplant fared
    substantially better than those who did not (see the Allogeneic
    Hematopoietic Cell Transplantation treatment entry) - underscoring that
    reaching deep remission and transplant, not any single drug regimen, is
    the main outcome-modifying factor identified so far.
  evidence:
  - reference: PMID:36323674
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no responses or allogeneic stem cell transplants were documented, and
      all patients died at a median 1.8 months (range 0.2-9.3).
    explanation: Documents the extremely poor outcome across treatment approaches in this series.
  - reference: PMID:37246017
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These cytogenetic and molecular characteristics render current

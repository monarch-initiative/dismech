- name: Failure of Mitoribosomal Small Subunit Assembly
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The small subunit fails to form. Three measurements agree: the other small-subunit proteins
    MRPS5, MRPS18B and MRPS28 fall with MRPS2 while the large-subunit proteins MRPL37 and MRPL44
    do not; the 12S rRNA that the small subunit is built around falls while 16S rRNA does not;
    and complexome profiling finds no fully assembled small subunit.

    The roughly 300 kDa early subassembly containing MRPS16, MRPS17, MRPS18B, MRPS22, MRPS26,
    MRPS27 and MRPS34 survives in patient cells, at reduced level. That observation is what
    places MRPS2 late in the assembly pathway, and it is the mechanistic basis for the severity
    hypothesis recorded in this entry's discussions.

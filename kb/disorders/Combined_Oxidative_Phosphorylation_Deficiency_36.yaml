inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Both 2018 families are biallelic and parental heterozygosity was confirmed by segregation in
    each. The Austrian patient is compound heterozygous for two missense alleles inherited one
    from each parent; the Tunisian patient is homozygous for a third missense allele with both
    parents heterozygous. MRPS2 is nuclear-encoded and autosomal, so despite the mitochondrial
    biochemistry this is a nuclear recessive disease with a 25 percent sibling recurrence risk
    and no maternal transmission.

- name: Recurrent Vomiting with Poor Appetite
  category: Gastrointestinal
  description: >-
    More than two years of recurrent vomiting with poor appetite was the presenting complaint of
    the 2022 patient, and the reason she was admitted. It matters because it is how her
    hypoglycaemia was produced: reduced intake rather than a documented fast.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Recurrent vomiting
    term:
      id: HP:0002013
      label: Vomiting
    temporality: RECURRENT
  notes: >-
    1 of 4 published patients. Recorded because it changes what the fasting-avoidance advice in

pathophysiology:
- name: Biallelic MRPS2 Missense Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Four missense alleles are known across three genotyped families. The Austrian patient is
    compound heterozygous for c.328C>T, p.Arg110Cys and c.340G>A, p.Asp114Asn; the Tunisian
    patient is homozygous for c.413G>A, p.Arg138His; the Chinese patient is homozygous for
    c.412C>G, p.Arg138Gly. The 2018 alleles change residues conserved across species, were
    predicted damaging by at least two of three in-silico tools, and appear in gnomAD only as
    very rare heterozygotes.

    The fourth allele is the interesting one. c.412C>G and c.413G>A are adjacent nucleotides of
    the same codon, so two unrelated families — one Tunisian, one Chinese — independently carry
    substitutions of the same arginine, to histidine in one and to glycine in the other. Two
    independent hits at one residue in a series of three genotyped families is a stronger
    statement about which part of the protein matters than any single allele makes, and it is a
    statement no in-silico predictor supplied.

    Two things are worth keeping separate here. That the alleles are rare and conserved is a
    prediction; that they are pathogenic is a measurement, made by the lentiviral complementation
    experiment recorded further down this chain. This entry treats the second as the basis for
    the LOSS_OF_FUNCTION call, not the first.

    The positions of the residues within the assembled subunit also differ between the families,
    and the founding authors use that difference to explain a quantitative difference in the
    biochemistry: Arg110 and Asp114 face the 12S rRNA and contact several other proteins, while
    Arg138 sits near the surface of the small subunit, and 12S rRNA loss was correspondingly
    deeper in the compound heterozygote.

- name: Fasting Hypoglycaemia
  category: Metabolism
  description: >-
    Episodic hypoglycaemia provoked by an overnight or twelve-hour fast, and in the second
    patient by intercurrent illness with poor oral intake. This is the feature that makes the
    disease dangerous between crises and the one that generates a management rule: avoid
    prolonged fasting, and treat illness as a risk period.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fasting hypoglycaemia
    term:
      id: HP:0001943
      label: Hypoglycemia
    temporality: RECURRENT
  notes: >-
    3 of 4 published patients — both 2018 patients and the 2022 patient. The 2024 abstract does
    not mention glucose. The 2022 patient's presentation differs in a way worth noting: her
    hypoglycaemia came with two years of recurrent vomiting and poor appetite rather than with a
    documented fast, so the trigger there is reduced intake rather than fasting duration.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Medical history was marked by several acute episodes of hypoglycemia after an overnight or a 12-hr fasting since the age of 18 months, especially when these episodes coincided with illness and poor oral intake, which associated with lactic acidosis."
    explanation: >-
      The fasting duration that provokes it, the age of onset, the illness trigger, and the
      coupling to lactic acidosis — everything the management advice rests on.
  - reference: PMID:34991560
    reference_title: "Hypoglycemia with lactic acidosis caused by a new MRPS2 gene mutation in a Chinese girl: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Blood glucose was 1.2–2.5 mmol/L when she was hospitalized."
    explanation: >-
      The measured glucose range in the third patient — the only numerical hypoglycaemia values
      published for this disease.
- name: Lactic Acidaemia
  category: Metabolism
  description: >-
    Repeatedly raised blood lactate, severe in the first patient (above 8 mmol/L against a
    reference of under 2) and mild in the second (2.2 to 3.8 mmol/L), rising to 5 mmol/L under a
    provoked fast. Urinary lactate was also raised in the second patient.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Lactic acidaemia
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  notes: >-
    3 of 4 published patients. Bound to the circulating-lactate term rather than HP:0003128
    Lactic acidosis, even though the 2022 patient has a measured acidosis (pH 7.224, bicarbonate
    4.3 mmol/L, base excess minus 24): the two 2018 patients have raised lactate without a
    reported pH, so the term that covers the whole series is the concentration one. The 2022
    patient's acidosis is recorded in her evidence item rather than by changing the binding.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "repetitive elevated lactate levels (>8 mmol/L; reference values < 2 mmol/L)"

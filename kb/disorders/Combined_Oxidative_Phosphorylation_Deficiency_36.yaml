- name: Hyperalaninaemia
  category: Metabolism
  description: >-
    Serum alanine up to 850 μmol/L against a reference of 99 to 350 in the first patient. Alanine
    rises with pyruvate through transamination, so it is a marker of the same block that raises
    lactate rather than an independent amino-acid disorder.
  frequency: OCCASIONAL
  phenotype_term:

  downstream:
  - target: Anaerobic Redirection of Pyruvate and Accumulation of Krebs-Cycle Intermediates
    causal_link_type: DIRECT
    description: >-
      A respiratory chain that cannot reoxidise NADH forces pyruvate to lactate and backs up the
      Krebs cycle, which is the standard biochemical consequence and the one the patients' lactate
      and 2-oxoglutarate measurements report.
  - target: Failure of Fasting Metabolic Adaptation
    causal_link_type: DIRECT
    description: >-
      Gluconeogenesis and fatty-acid oxidation are the most ATP-demanding parts of the hepatic
      fasting response, so a hepatic OXPHOS deficit shows itself first as an inability to hold
      blood glucose through a fast.
  - target: Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cochlea is among the tissues most vulnerable to a respiratory-chain deficit, and
      sensorineural hearing loss is a recurring feature across mitoribosomal-protein disease. No
      cochlear measurement exists in any MRPS2 patient, so this edge is the general
      organ-vulnerability argument applied to this entity, not a finding about it.
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Both 2018 patients have developmental delay with normal brain MRI, which is the pattern
      expected from a diffuse energetic deficit rather than from a structural malformation. The
      step from OXPHOS deficiency to the cognitive phenotype is not measured in this disease.
  - target: Exercise Intolerance and Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Skeletal muscle in the second patient carries a complex IV deficiency, and his exertional
      myalgia and lower-limb weakness are the clinical expression expected from it. The
      attribution is clinical rather than measured.
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Liver in both patients carries a multiple-complex deficiency, and the first patient's
      transaminases run three- to four-fold high. Hepatocyte injury from an energetic deficit is
      the usual reading, but no liver histology or mechanism study exists here.
  - target: Failure to Thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth is the first thing an infant gives up when ATP supply is short, and failure to
      thrive is near-universal across the mitoribosomal-protein disorders. In this entity it is
      reported in one patient of four, so the edge asserts the general relationship rather than
      anything measured in MRPS2 disease.
- name: Anaerobic Redirection of Pyruvate and Accumulation of Krebs-Cycle Intermediates
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    A respiratory chain that cannot reoxidise NADH leaves pyruvate to be reduced to lactate and
    leaves the Krebs cycle backed up behind its NAD-dependent dehydrogenases. In these patients
    that shows as raised blood lactate, raised serum alanine — the transamination product of the
    pyruvate that accumulates with it — and increased urinary excretion of 2-oxoglutarate, with
    a trace of succinate.

    2-oxoglutarate is the more informative of the two urinary findings, because its dehydrogenase
    is NAD-dependent and it is the intermediate the founding authors single out as part of the

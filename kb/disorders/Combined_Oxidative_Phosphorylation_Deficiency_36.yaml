- name: Combined Deficiency of OXPHOS Complexes I and IV
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In fibroblasts, complexes I and IV are reduced, complex III and the nucleus-encoded complex
    II are not, and complex V is present at normal amount but with subcomplexes that do not occur
    in control cells. In tissue the picture is broader: multiple complexes are deficient in liver
    and muscle in the first patient, and in liver and fibroblasts with an isolated complex IV
    deficiency in muscle in the second.

    That discrepancy between fibroblast and tissue, and between the two patients' muscle, is
    worth stating rather than smoothing over. It means a normal muscle respiratory-chain panel
    does not exclude the diagnosis, and it is the reason the entity is named for a combined
    deficiency even though any single biopsy may show something narrower.

    This is the convergence point of the entry. Every systemic feature below is downstream of
    this node.

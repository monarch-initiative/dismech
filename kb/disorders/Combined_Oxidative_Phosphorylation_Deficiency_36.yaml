- name: Destabilization of the MRPS2 Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MRPS2 is one of roughly thirty nucleus-encoded proteins of the 28S small subunit of the
    mitochondrial ribosome. It spans all three domains of that subunit and contacts seven other
    small-subunit proteins, which is the structural argument the founding authors give for
    treating its role as scaffolding rather than catalytic.

    The bacterial orthologue bS2 has a translation-initiation function that depends on the
    Shine-Dalgarno sequence. Mitochondrial mRNAs have no Shine-Dalgarno sequence, so that
    function has most likely been lost, and what remains is structural. This matters for reading
    the phenotype: the defect downstream is a failure to build the subunit, not a failure to
    initiate on particular messages.

- name: Failure of Fasting Metabolic Adaptation
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Both 2018 patients become hypoglycaemic on fasting, and in the second patient a formal
    fasting test reproduced it with a simultaneous rise in lactate to 5 mmol/L and increased
    2-oxoglutarate excretion. The coupling of hypoglycaemia to hyperlactataemia within one
    provoked test is what identifies the defect as a failure of energy-dependent hepatic
    adaptation rather than, say, hyperinsulinism, where lactate would not rise.

    Graded PROVISIONAL rather than ESTABLISHED because no measurement of gluconeogenic flux or
    of hepatic ATP exists in any MRPS2 patient. What is established is the clinical coupling;
    the hepatocyte-level explanation is inferred from the liver OXPHOS deficiency measured in
    the same patients.
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A clinical fasting test showed hypoglycemia with hyperlactatemia (5 mmol/L) and slightly increased excretion of 2-oxoglutarate"
    explanation: >-
      The provoked test that couples the hypoglycaemia to the lactate rise, which is the
      observation this node rests on.
  downstream:
  - target: Fasting Hypoglycaemia
    causal_link_type: DIRECT
phenotypes:
- name: Sensorineural Hearing Loss
  category: Nervous System
  description: >-
    Present in all four published patients and the feature with the most therapeutic consequence.
    In the first patient it was progressive, recognised at three years, and treated first with a
    hearing aid and then with bilateral cochlear implants; in the second it was severe and
    recognised at two years, and treated with a hearing aid; in the third it was recognised at
    four years and treated with bilateral cochlear implants. In all three of those, speech
    development improved markedly after correction — which is the single most actionable fact in
    this entry.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing loss
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    4 of 4 published patients. VERY_FREQUENT rather than OBLIGATE: universal in the series, but a
    denominator of four cannot carry an obligate claim. The general sensorineural term is bound
    rather than a congenital one, because in every patient the loss was recognised between two
    and four years and described as progressive in the first rather than present at birth.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "At the age of 3 years, she had developed progressive sensorineural hearing loss, which required the use of a hearing aid and was corrected with bilateral cochlea implants. After this correction, both her speech and development improved markedly."
    explanation: >-
      Onset, progression and the response to implantation in the first patient — the evidence
      behind both this phenotype and the cochlear-implantation treatment entry.
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Speech development was delayed as a result of severe sensorineural deafness at the age of 2 years, necessitating the use of a hearing aid."
    explanation: The second patient's hearing loss, its severity and its age of recognition.
  - reference: PMID:34991560
    reference_title: "Hypoglycemia with lactic acidosis caused by a new MRPS2 gene mutation in a Chinese girl: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

- name: Cholelithiasis with Chronic Cholecystitis
  category: Gastrointestinal
  description: >-
    Gallbladder calculi from chronic cholecystitis with erosion and bile reflux in the 2022
    patient, at four years and nine months, treated by laparoscopic cholecystectomy. Gallstones
    at that age are unusual enough to be worth recording even from a single case.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Gallbladder calculi with chronic cholecystitis
    term:
      id: HP:0001081
      label: Cholelithiasis
  notes: >-
    1 of 4 published patients, and new to the phenotype in 2022. Whether it belongs to the
    disease at all is open: it is a single instance, no mechanism links MRPS2 to biliary
    physiology, and childhood gallstones have many causes including the haemolysis this patient
    was not reported to have. It is recorded because a feature that appears once in a series of
    four is exactly what a fifth report would confirm or dismiss, and it cannot be confirmed if
    nobody wrote it down.
  evidence:
  - reference: PMID:34991560
    reference_title: "Hypoglycemia with lactic acidosis caused by a new MRPS2 gene mutation in a Chinese girl: a case report."

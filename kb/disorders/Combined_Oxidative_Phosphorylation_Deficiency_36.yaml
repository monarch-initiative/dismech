name: Combined Oxidative Phosphorylation Deficiency 36
category: Mendelian
creation_date: "2026-09-22T00:00:00Z"
synonyms:
- COXPD36
- combined oxidative phosphorylation deficiency type 36
- MRPS2 deficiency
- MRPS2-related mitochondrial disease
- mitochondrial ribosomal protein S2 deficiency
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 36
  term:
    id: MONDO:0054781
    label: combined oxidative phosphorylation deficiency 36
description: >-
  COXPD36 is the combined oxidative phosphorylation deficiency caused by biallelic variants in
  MRPS2, which encodes a structural protein of the small subunit of the mitochondrial ribosome.
  Four patients in four unrelated families have been published: two in the 2018 report that
  defined the entity, one in 2022 and one in 2024.

  The mechanism is a mitochondrial translation defect, and the chain from allele to biochemistry
  was worked out in full in the founding paper rather than inferred. Patient fibroblasts carry
  less MRPS2 protein; the other small-subunit proteins MRPS5, MRPS18B and MRPS28 fall with it
  while the large-subunit proteins do not; 12S rRNA falls while 16S rRNA does not; complexome
  profiling shows fully assembled small subunits are hardly detectable while large subunits are
  normal; pulse labelling shows a generalised failure to translate the mtDNA-encoded
  polypeptides; and blue-native PAGE shows reduced complexes I and IV with complex II, which is
  entirely nucleus-encoded, untouched. Re-expressing wild-type MRPS2 by lentivirus reverses the
  translation and assembly phenotypes. Each step of that sequence is a measurement in patient
  cells, which is unusual for an entity this small.

  Clinically the recognisable triad is sensorineural hearing loss, fasting hypoglycaemia and
  lactic acidaemia, with developmental delay. All four patients have the hearing loss, and three
  of the four have both hypoglycaemia and raised lactate. The founding authors argue the combination is
  specific enough to point at a mitoribosomal defect before sequencing, and add wrinkled skin as
  the discriminating extra feature — present in one of their two patients, and otherwise reported
  in mitoribosomal disease only as redundant neck skin with MRPS22 and MRPS16 variants.

  What sets COXPD36 apart from most of the numbered COXPD series is severity rather than
  mechanism. Roughly a third of patients with mitoribosomal-protein disease die before the age of
  one; both 2018 patients were alive at eleven, and the hearing loss responded to cochlear
  implantation and to hearing aids well enough that speech development recovered. The founding
  authors offer an explanation that is testable rather than decorative: MRPS2 joins the small
  subunit late, after the roughly 300 kDa core subassembly containing MRPS22 and MRPS16 has
  formed, and that subassembly is still present in patient cells. A late-assembling subunit is
  a less catastrophic thing to lose than an early one. That is a hypothesis about the whole
  series, not a fact about this entity, and it is recorded here as such.

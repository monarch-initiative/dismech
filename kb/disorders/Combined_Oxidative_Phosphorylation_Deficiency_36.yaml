    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "who shows particular features which have not yet been reported: initial microcephaly, joint hypermobility and autistic features"
    explanation: The feature as listed by the 2024 authors, with their own novelty claim attached.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four patients in four unrelated families: two in the 2018 report that defined the entity —
    one of Austrian and one of Tunisian origin — one Chinese patient in 2022, and one in 2024.
    No population estimate exists and none can be constructed: all were ascertained through
    diagnostic sequencing of an unexplained metabolic or mitochondrial phenotype, so the
    denominator is unknown by construction.

    prevalence_class is the numeric floor tier and rate_per_100000 is left unset, because no rate
    has ever been reported and computing one from four cases would be inventing a figure.
  evidence:
  - reference: PMID:38029925
    reference_title: "New description of an MRPS2 homozygous patient: Further features to help expend the phenotype."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Mutated mito-ribosomal protein S2 (MRPS2) was already described in only three subjects"
    explanation: >-
      The size of the literature as counted by the most recent report — three prior subjects,
      which with the 2024 patient makes four. The third prior subject is the 2022 Chinese
      patient, which is the one the 2024 authors describe as having a less severe phenotype.
progression:
- phase: Infantile presentation
  notes: >-
    The first patient presented from birth with wrinkled skin and minor dysmorphism, then failure
    to thrive in the first year and psychomotor delay. The second presented later — recurrent
    hypoglycaemia from eighteen months, walking at twenty-two months — and was not investigated
    for hypoglycaemia until six years. The 2022 patient is the clearest case of the same delay:
    hearing loss at four, gallstones at four and nine months, two years of vomiting, and a
    genetic test only at six and a half, ordered because the cause of the hypoglycaemia was
    unknown. That gap between first symptom and investigation is the diagnostic delay this
    entity's stub was nominated for.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Subject 2, a boy, presented with fasting hypoglycemia at the age of 6 years."
    explanation: >-
      Age at presentation in the second patient, against an eighteen-month age of first
      hypoglycaemic episode recorded elsewhere in the same paragraph.
- phase: Survival into the second decade with treated hearing loss
  notes: >-
    Both 2018 patients were alive at eleven years at the time of report, with hearing corrected
    and speech recovered, and the 2022 patient was seven at last follow-up. No death is reported
    in this entity, and nobody developed the hepatic or renal failure that kills patients with
    some other mitoribosomal-protein defects. Against a series in which about a third of
    mitoribosomal-disease patients die before one year, this is the mild end of the group — and
    the reason this entity's prognosis should not be quoted from the mitoribosomal literature at
    large.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most subjects presented in the neonatal period, and about one-third of the subjects died before the age of 1 year."
    explanation: >-
      The mortality of the mitoribosomal-protein group as a whole, which is the comparison that
      makes this entity's survival notable. Graded REVIEW_SYNTHESIS because it is the authors'
      tabulation of twenty-two previously published patients from other groups, and INDIRECT
      because it bears on this entity only by contrast.
genetic:
- name: MRPS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The single causal gene. Four missense alleles in three genotyped families, two of them
    substitutions of the same arginine at codon 138 in unrelated populations. Causality rests on
    lentiviral complementation with wild-type MRPS2 in the two 2018 patients' fibroblasts rather
    than on segregation and prediction alone; the 2022 and 2024 alleles have no functional data
    and inherit their pathogenicity from the gene-disease relationship the 2018 work established.
  gene_term:
    preferred_term: MRPS2
    term:
      id: hgnc:14495
      label: MRPS2
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Cumulatively, our complementation experiments confirm the pathogenicity of MRPS2 mutations."
    explanation: >-
      The authors' own statement of what establishes causality here, and the reason this entry
      grades the gene-disease relationship on function rather than on prediction.
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Consistent with these observations, mitochondrial translation was partially restored in both subject cell lines complemented with wild-type MRPS2 (Figure 6B), as was the assembly of OXPHOS complexes I and IV (Figure 6C)."
    explanation: >-
      The rescue itself, in both patients' cells. Note the restoration is partial rather than
      complete, which the entry states rather than rounding up.
diagnosis:
- name: Respiratory-chain enzymology in liver, muscle and fibroblasts
  description: >-
    Measurement of OXPHOS complex activities is what identifies the biochemical class of the
    disease. It should be read with the tissue discrepancy in mind: the first patient showed
    multiple complex deficiencies in liver, muscle and fibroblasts, while the second showed
    multiple deficiencies in liver and fibroblasts but an isolated complex IV deficiency in
    muscle. A single muscle panel can therefore look like an isolated complex IV disorder in a
    patient who has a combined one.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Measurements of OXPHOS complex activities showed a decrease in multiple complexes in liver and fibroblasts and a complex IV deficiency in muscle."
    explanation: The tissue discrepancy this diagnostic caution rests on, in the patient who shows it.
- name: Exome sequencing
  description: >-
    Both 2018 diagnoses were made by exome sequencing, and in each the filtering converged on a
    single candidate gene. The 2024 patient was also identified by sequencing. There is no
    biochemical test specific to MRPS2; enzymology localises the defect to mitochondrial
    translation and sequencing names the gene.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Exome sequencing was performed to identify pathogenic variants underlying the disease in both subjects"
    explanation: The diagnostic route used in both founding cases.
- name: Transferrin and apolipoprotein-CIII isoelectric focusing
  presence: ABSENT
  description: >-
    Glycosylation screening was normal in the first patient. This is recorded as a negative
    because the differential for an infant with wrinkled skin, developmental delay and raised
    transaminases includes the congenital disorders of glycosylation, and a normal screen is what
    removes them.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Glycosylation screening (transferrin and apolipoprotein-CIII isoelectric focusing) was unremarkable."
    explanation: The negative screen in the first patient.
experimental_models:
- name: MRPS2-complemented patient fibroblast lines
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from both 2018 patients, transduced with a lentivirus expressing either
    wild-type MRPS2 or GFP as a negative control. This is the model that establishes causality in
    this disease, and it is a rescue rather than a knockdown, so it tests the patients' own
    alleles rather than a constructed one.
  modeled_mechanisms:
  - target: Inhibition of Mitochondrial Translation
    relationship: RESCUES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Re-expressing wild-type MRPS2 partially restores mitochondrial translation in both
      patients' cells, and restores assembly of complexes I and IV.
    limitations: >-
      The restoration is partial rather than complete, and the readouts are steady-state
      abundance and pulse-labelled synthesis rather than respiratory flux or ATP output. A
      fibroblast is also not the cochlea, the liver or the brain, so the model speaks to the
      molecular step and not to any clinical feature.
    readouts:
    - name: Pulse-labelled mitochondrial translation products
      target: Inhibition of Mitochondrial Translation
      direction: RESTORED
      interpretation: >-
        Synthesis of mtDNA-encoded polypeptides recovers when wild-type MRPS2 is supplied, which
        is what makes the translation defect attributable to the MRPS2 alleles.
      evidence:
      - reference: PMID:29576219
        reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: "Pulse labeling of mitochondrial translation products demonstrates that the presence of wild-type MRPS2 partially restores mitochondrial translation in S1 and S2 fibroblasts."
        explanation: The measurement, with the authors' own qualifier that the restoration is partial.
    evidence:
    - reference: PMID:29576219
      reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "To demonstrate the disease-causing nature of MRPS2 mutations, we carried out functional complementation experiments by generating control, S1, and S2 cell lines stably expressing either green fluorescent protein (GFP) as a negative control or wild-type MRPS2"
      explanation: >-
        The design of the model, including the GFP control arm that makes the rescue
        interpretable.
  notes: >-
    Overexpressing MRPS2 in control cells had no negative effect on translation or OXPHOS
    assembly, which is the dose control for the rescue arm and is worth knowing for anyone
    considering gene-replacement approaches in this pathway.
treatments:
- name: Cochlear Implantation and Hearing Amplification
  therapeutic_modality: SURGERY
  description: >-
    The first patient's progressive hearing loss was managed with a hearing aid and then with
    bilateral cochlear implants, after which her speech and general development improved
    markedly; the second patient's severe deafness was managed with a hearing aid, again with
    improvement in speech. In a disease with no disease-modifying therapy this is the
    intervention that changes the trajectory, and it is the reason hearing assessment belongs in
    the initial work-up rather than being deferred until speech delay is noticed.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Sensorineural Hearing Loss
    description: >-
      The implant bypasses the cochlear lesion rather than correcting it. It addresses the
      phenotype and leaves the OXPHOS deficiency that produced it untouched, which is why it is
      recorded against the phenotype and not against a pathophysiology node.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "which required the use of a hearing aid and was corrected with bilateral cochlea implants. After this correction, both her speech and development improved markedly."
    explanation: >-
      The intervention and the outcome in the first patient. Two patients is not a trial, and
      this entry claims no more than the two reported courses.
- name: Avoidance of Prolonged Fasting
  therapeutic_modality: BEHAVIORAL
  description: >-
    The second patient's hypoglycaemic episodes followed overnight or twelve-hour fasts and were
    worse when illness reduced oral intake. No formal regimen has been published for this
    disease, so what is recorded here is the management implication of the reported trigger
    rather than a trialled intervention: fasts of that length are the exposure, and intercurrent
    illness is the risk period.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Failure of Fasting Metabolic Adaptation
    description: >-
      Removing the fast removes the demand the hepatic adaptation cannot meet. The underlying
      OXPHOS deficiency is unchanged.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "several acute episodes of hypoglycemia after an overnight or a 12-hr fasting since the age of 18 months, especially when these episodes coincided with illness and poor oral intake"
    explanation: >-
      The trigger, quoted as the basis for the avoidance advice. Graded INDIRECT because the
      source documents the provocation and not the benefit of avoiding it — no one has tested
      the intervention.
- name: Carbohydrate Administration for Acute Hypoglycaemia
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The 2022 patient's hypoglycaemia and lactic acidosis both improved on sugary liquid with
    supportive treatment, and her appetite recovered as glucose normalised. It is the only
    treatment in this disease with a reported response, and the response includes the lactate —
    which is not obvious, since giving glucose to a patient who cannot oxidise pyruvate could
    reasonably be expected to raise it.

    It is also not a cure, and the entry does not present it as one: the same patient's
    hypoglycaemia recurred and she was admitted repeatedly.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucose
      term:
        id: CHEBI:17234
        label: glucose
  target_mechanisms:
  - target: Fasting Hypoglycaemia
    description: >-
      Exogenous carbohydrate substitutes for the hepatic glucose output the patient cannot
      generate. It corrects the consequence and leaves the OXPHOS deficiency producing it
      untouched, which is why the hypoglycaemia recurs.
  evidence:
  - reference: PMID:34991560
    reference_title: "Hypoglycemia with lactic acidosis caused by a new MRPS2 gene mutation in a Chinese girl: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Hypoglycemia and lactic acidosis improved after the administration of sugary liquid and supportive treatments."
    explanation: >-
      The only treatment response reported in this disease, and the fact that the lactate
      improved with the glucose rather than worsening.
  - reference: PMID:34991560
    reference_title: "Hypoglycemia with lactic acidosis caused by a new MRPS2 gene mutation in a Chinese girl: a case report."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her condition improved after the administration of sugary liquid and supportive treatments. However, her hypoglycemia was recurring."
    explanation: >-
      Graded REFUTE against any reading of this as durable control. The same sentence that
      reports the response reports the recurrence, and a treatment section that quoted only the
      first clause would be selecting.
  notes: >-
    No published treatment trial, cohort or disease-specific guideline exists for MRPS2 disease.
    Management follows the symptom-based standards for primary mitochondrial disease generally —
    the Mitochondrial Medicine Society recommendations and their national adaptations — because
    there is nothing more specific to follow, and those standards are explicit that treatment
    guidance in this field is symptom-based rather than mechanism-based.

    This entry deliberately does not carry the generic mitochondrial cofactor cocktail: no source
    reports it being given to any MRPS2 patient or having any effect, and listing it would be
    importing a habit from the wider mitochondrial literature rather than curating this disease.

discussions:
- discussion_id: copd36_cochlear_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a generalised mitochondrial translation defect produce hearing loss as its most
    consistent and earliest-recognised feature, when the cochlea is not where the biochemistry
    was measured?
  rationale: >-
    Hearing loss is the only feature present in all three published patients and the only one
    with an effective intervention, yet the entire mechanistic chain in this entry is measured in
    fibroblasts, liver and muscle. No cochlear tissue, no auditory-nerve measurement and no
    animal model of MRPS2 deficiency exists. The edge from the OXPHOS node to the hearing
    phenotype is therefore carried as INDIRECT_UNKNOWN_INTERMEDIATES, and is an argument from
    organ vulnerability across the mitoribosomal group rather than a finding about MRPS2.

    This matters beyond bookkeeping. Cochlear implantation works in these patients, which implies
    the lesion is at the hair cell or before the spiral ganglion rather than central — but that
    inference from a therapeutic response is the only evidence about the site of the lesion that
    this literature contains.
  attaches_to:
  - phenotypes#Sensorineural Hearing Loss
  - pathophysiology#Combined Deficiency of OXPHOS Complexes I and IV
- discussion_id: copd36_late_assembly_severity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does the position of a mitoribosomal protein in the assembly pathway predict how severe the
    resulting disease is?
  rationale: >-
    The founding authors propose that variants in subunits that join late produce milder disease
    than variants in subunits that join early, and offer MRPS2 as their case: the roughly 300 kDa
    early subassembly containing MRPS22 and MRPS16 is still present in patient cells, and these
    patients were alive at eleven where about a third of the mitoribosomal-disease series died
    before one year.

    Recorded as an open question rather than as mechanism because it is a hypothesis about the
    whole mitoribosomal group, testable across it, and the authors state plainly that the order
    of steps in mitoribosomal assembly is not known. A single mild entity is consistent with the
    hypothesis and does not establish it; the comparison that would is an assembly-order ranking
    against outcome across all the MRPS and MRPL disorders, which nobody has published.
  attaches_to:
  - pathophysiology#Failure of Mitoribosomal Small Subunit Assembly
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Despite recent advances in elucidating the structure of the mammalian mitoribosome,3 the order of steps in the assembly process of the mitochondrial ribosome remains elusive."
    explanation: >-
      The authors' own statement of the gap that keeps this a hypothesis — the assembly order the
      proposal depends on is not established.
- discussion_id: copd36_connective_tissue
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the wrinkled skin of the first 2018 patient and the joint hypermobility of the 2024
    patient two expressions of one connective-tissue involvement, or two unrelated findings in a
    series of three?
  rationale: >-
    Each feature is reported once, in a different patient, by a different group, six years apart,
    and neither report mentions the other finding. The founding paper argues at length that
    wrinkled skin is the discriminating feature of the entity and compares it with the cutis laxa
    syndromes, which are themselves connective-tissue disorders with laxity at the joints. That
    makes the pairing suggestive.

    It is not more than suggestive. With three patients, one instance each of two loosely related
    findings is exactly what chance produces, and there is no dermal or fibroblast matrix
    measurement in either patient — the fibroblasts in this literature were used for
    mitochondrial assays, not for collagen or elastin. Resolving it needs a fourth patient
    examined for both, or a matrix assay on the fibroblast lines that already exist.
  attaches_to:
  - phenotypes#Excessive Wrinkled Skin
  - phenotypes#Joint Hypermobility
notes: >-
  Patient count. Four published patients, one per family: the two in PMID:29576219 (2018), the
  Chinese girl in PMID:34991560 (2022), and the patient in PMID:38029925 (2024). The 2024
  authors' count of three prior subjects is consistent with this — the "less severe phenotype"
  they refer to is the 2022 patient.

  That third report was found by the openscientist deep-research run committed alongside this
  entry, not by the curator. A direct PubMed search on the gene symbol and on the disease name
  returned only the 2018 and 2024 papers; the 2022 case report is titled for the presenting
  problem rather than for the entity and did not surface. Without it this entry would have
  carried three patients, would have recorded the 2024 count as an unresolved discrepancy, and
  would have been missing the gallstones, the recurrent vomiting, the only published glucose
  values, the only reported treatment response, and the second substitution at Arg138.

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index (snapshot 2026-09-10). No chapter names this
  disease, MRPS2, or any of this entry's synonyms, which is expected for an entity with four
  published patients.

  Functional evidence is not evenly distributed across the series and the entry does not average
  it. Everything mechanistic here — the protein destabilisation, the assembly failure, the rRNA
  loss, the translation defect, the complex I and IV deficiency, the rescue — comes from the two
  2018 patients. The 2022 and 2024 alleles were called on novelty, segregation and phenotype
  match, with no cell work at all. A reader should take the mechanism as established for the
  disease and the specific pathogenicity of the two later alleles as inherited from it.

  Treatment scope. Nothing here is disease-modifying. Cochlear implantation, carbohydrate for
  acute hypoglycaemia and fasting avoidance are recorded because each is documented in a
  reported patient; only the first two have a reported outcome.

  Why complex III is spared in fibroblasts. Complex III contains exactly one mtDNA-encoded
  subunit where complexes I and IV contain seven and three, so a partial translation defect
  depletes it least. The founding paper reports the observation and does not offer this
  explanation, so it is recorded here as a reading rather than in the pathophysiology chain.

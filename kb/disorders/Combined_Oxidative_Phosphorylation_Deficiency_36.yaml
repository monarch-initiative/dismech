- name: Developmental Delay and Intellectual Disability
  category: Nervous System
  description: >-
    Psychomotor delay in the first patient, most pronounced in the motor domain, with a formal
    assessment at five years and ten months giving a developmental level of two years and six
    months; moderate intellectual disability in the second patient at eleven years. Brain MRI was
    normal in both, at three years and in adulthood respectively.

    The normal imaging matters. It separates this entity from the mitoribosomal disorders that
    present with structural brain abnormality or Leigh syndrome, and it is part of the argument
    that the neurological phenotype here is energetic rather than malformative.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    3 of 4 published patients — both 2018 patients and the 2022 patient, with the 2024 patient
    adding autistic features. The 2022 patient is the informative one for scope: her language was
    retarded while her motor development was normal, so the delay is not uniformly global across
    the series and this binding is the term that covers the 2018 patients rather than all four.
    Speech delay in every patient who has it was attributed by the reporting authors to the
    hearing loss and improved once that was corrected, which is why it is recorded under hearing
    loss rather than as a separate phenotype.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her last formal developmental assessment at the age of 5 years and 10 months showed an average developmental state of 2 years and 6 months of age."
    explanation: The quantified delay in the first patient.
  - reference: PMID:29576219

    explanation: The presenting complaint, its duration, and its coincidence with the hypoglycaemia.
  sequelae:
  - target: Fasting Hypoglycaemia
    description: >-
      Two years of vomiting and poor appetite is a sustained reduction in substrate intake, which
      in a patient who cannot sustain hepatic gluconeogenesis is the same exposure as a fast. In
      the 2022 patient the hypoglycaemia and the vomiting were recorded together and both
      resolved with glucose.
- name: Excessive Wrinkled Skin
  category: Integumentary
  description: >-
    Skin wrinkling present from birth in the first patient, most pronounced on the abdomen and
    hands. The founding authors treat this as the discriminating feature of the phenotype: skin
    findings in mitoribosomal disease have otherwise been limited to redundant neck skin with
    MRPS22 and MRPS16 variants, and the combination of wrinkled skin with hearing impairment is
    what distinguishes this from the cutis laxa syndromes it otherwise resembles.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Wrinkled skin of the abdomen and hands, present from birth
    term:
      id: HP:0007392
      label: Excessive wrinkled skin
  notes: >-
    1 of 4 published patients; the second 2018 patient is explicitly recorded as having no skin
    involvement, the 2022 patient's physical examination is reported as revealing no abnormal
    findings, and the 2024 abstract does not mention skin. So this is a variable feature with
    high diagnostic value when present and no negative predictive value when absent — which is
    worth stating because the founding paper's framing could be read as making it a requirement.
  evidence:
  - reference: PMID:29576219
    reference_title: "Bi-allelic Mutations in the Mitochondrial Ribosomal Protein MRPS2 Cause Sensorineural Hearing Loss, Hypoglycemia, and Multiple OXPHOS Complex Deficiencies."
    supports: SUPPORT

- name: Impaired BMP/TGF-beta vascular signaling
  description: >-
    Germline defects centered on BMPR2 and related pathway components reduce
    protective BMP/TGF-beta signaling in pulmonary vascular cells, creating the
    upstream disease trigger for HPAH. Five of this entry's genes act within this
    axis and are bound here: BMPR2 as the type II receptor, GDF2 as a BMP ligand
    gene, SMAD9 as a downstream transcriptional effector, and ACVRL1 and ENG as
    the ALK1/endoglin receptor pair. A germline lesion at any of these steps
    lowers pathway output at this node.

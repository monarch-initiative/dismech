datasets:
- accession: ega:EGAS00001003123
  title: Heritable pulmonary arterial hypertension in a large Iberian family
  description: Data from a study of a large Iberian family (n=65 subjects, 5 generations) affected by pulmonary arterial hypertension (PAH) and segregating with the BMPR2 missense mutation p.Arg491Gln (rs137852749, c.1472G>A). PAH is a rare disease characterized by an abnormal rise in mean pulmonary arterial pressure (> or equal to 25 mmHg at rest), which, in turn, leads to a progressive increase in pulmonary vascular resistance and ultimately to death, due to right ventricular failure. Heritable PAH has an overall prevalence below 1 case per million adults and is defined by either the presence of a known genetic defect linked to the disease or a positive family history.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:30894412
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Heritable Pulmonary Arterial Hypertension"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000001275
  title: Heritable pulmonary arterial hypertension - new genetic findings and environmental triggers
  description: Whole exome sequencing data were analysed for a total of 13 family members of five heritable pulmonary arterial hypertension (HPAH) families to identify a disease causing variant. In a first step, variants only present in affected family members and absent in healthy relatives of the respective family were selected. Subsequently, due to incomplete penetrance of genes in PAH, the analysis was extended to variants present both in affected and healthy individuals. Heterozygous variants were primarily investigated followed by homozygous, compound heterozygous, and bi-allelic variants of interest. This study led to the identification of rare deleterious variants in three out of five families.

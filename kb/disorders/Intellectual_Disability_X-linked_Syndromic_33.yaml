inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >
    TAF1 maps to Xq13.1 and the syndrome manifests in hemizygous males, with
    variants arising de novo or inherited from an unaffected carrier mother.
    Heterozygous carrier females are typically asymptomatic in association with
    completely skewed X-chromosome inactivation toward the non-mutant
    chromosome, although symptomatic females carrying TAF1 variants have also
    been reported.
  evidence:
  - reference: PMID:26637982
    reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe an X-linked genetic syndrome associated with mutations in TAF1 and manifesting with global developmental delay, intellectual disability (ID), characteristic facial dysmorphology, generalized hypotonia, and variable neurologic features, all in male individuals."
    explanation: The original description establishes X-linked transmission with disease manifest in males.
  - reference: PMID:31341187
    reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected males presented with intellectual disability and dysmorphic features, while heterozygous females were asymptomatic and had completely skewed X-chromosome inactivation."
    explanation: A five-generation pedigree showing male-limited expression with skewed XCI in asymptomatic carrier females, the pattern that makes the inheritance recessive in practice.
  - reference: PMID:26637982
    reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simultaneous studies using diverse strategies led to the identification of nine families with overlapping clinical presentations and affected by de novo or maternally inherited single-nucleotide changes."
    explanation: Documents both de novo and maternally inherited origins of the causal single-nucleotide changes.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    No population-based prevalence estimate exists. Ascertainment is entirely
    from published case series: the original report described eleven families,
    and a subsequent genotype-first study added 27 further families, of which
    pathogenicity could be confidently assigned in only a subset. The count of
    published families, not a rate, is the available occurrence measure.
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial study reported eleven families, and the syndrome was defined as presenting early in life with hypotonia, facial dysmorphia, and developmental delay that evolved into intellectual disability (ID) and/or autism spectrum disorder (ASD). We have now identified an additional 27 families through a genotype-first approach."
    explanation: Establishes that occurrence is documented as a count of published families rather than any population rate.
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this panoply of tools implemented, we were able to ascribe pathogenicity with confidence to only eleven of the identified de novo missense rare variant alleles, with nine in males and two in females."
    explanation: Qualifies the case count — many candidate variants in the series could not be confidently called pathogenic, so the literature total overstates confirmed cases.

progression:
- phase: Infantile presentation and evolution to intellectual disability
  notes: >
    The syndrome presents early in life with hypotonia, facial dysmorphia, and
    developmental delay, which evolve into a later diagnosis of intellectual
    disability, autism spectrum disorder, or both. Delayed speech and language
    development is common.
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the syndrome was defined as presenting early in life with hypotonia, facial dysmorphia, and developmental delay that evolved into intellectual disability (ID) and/or autism spectrum disorder (ASD)"
    explanation: States the temporal course from infantile hypotonia and delay to the later cognitive/behavioral diagnosis.
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of this cohort presented with hypotonia and DD during infancy, followed by later diagnoses of ID and/or ASD. Delayed speech and language development were common."
    explanation: Confirms the same sequence in the expanded 27-family cohort.


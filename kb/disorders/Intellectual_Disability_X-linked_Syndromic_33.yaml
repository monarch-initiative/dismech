description: >
  Intellectual disability, X-linked, syndromic 33 (MRXS33; TAF1 intellectual
  disability syndrome) is an X-linked neurodevelopmental disorder of affected
  males caused by germline variants in TAF1, which encodes the largest subunit
  of the general transcription factor TFIID. Affected boys present early with
  generalized hypotonia, global developmental delay, and characteristic facial
  dysmorphology, evolving into intellectual disability and/or autism spectrum
  disorder; a broadened allelic series adds brain morphological abnormalities,
  seizures, hearing loss, and heart malformations. Reported disease alleles are
  predominantly missense, with a start-loss variant, a splice-site variant, and
  two locus duplications also described. Complete TAF1 loss is embryonic-lethal
  in mouse and zebrafish, and no hemizygous null alleles of the canonical
  coding isoform are seen in population databases, so the disorder is best
  understood as a hypomorphic, dosage- and activity-sensitive lesion of the RNA
  polymerase II preinitiation machinery rather than a null. Two families with large Xq13.1 duplications involving
  TAF1 overlap the missense phenotype but additionally show severe progressive
  neurodegeneration.

  MRXS33 is allelic to, and clinically distinct from, X-linked
  dystonia-parkinsonism (XDP, curated separately in this knowledge base). XDP
  arises from a Filipino founder SINE-VNTR-Alu retrotransposon insertion in
  intron 32 of TAF1 and is an adult-onset neurodegenerative movement disorder
  with neostriatal neuronal loss; MRXS33 arises from coding missense variants
  (or locus duplication) and is a congenital neurodevelopmental syndrome. The
  two share a gene and a broad theme of TAF1 transcriptional dysregulation, but
  differ in lesion class, age of onset, neuroanatomical target, and clinical
  syndrome.


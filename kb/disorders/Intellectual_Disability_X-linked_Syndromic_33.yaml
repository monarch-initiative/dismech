    label: intellectual disability, X-linked, syndromic 33
parents:
- X-linked syndromic intellectual disability
- multiple congenital anomalies/dysmorphic syndrome-intellectual disability
synonyms:
- MRXS33
- TAF1 intellectual disability syndrome
- TAF1/MRXS33 intellectual disability syndrome

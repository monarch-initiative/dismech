    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, we propose that functional TAF1 is essential for embryonic development and specifically neurodevelopmental processes."
    explanation: The zebrafish knockout study's conclusion that TAF1 function is specifically required for neurodevelopment.
  - reference: PMID:32714589
    reference_title: "A novel variant in TAF1 affects gene expression and is associated with X-linked TAF1 intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "further extends our knowledge of a potential link between TAF1 deficiency and defects in neuronal cell function"
    explanation: States the link between TAF1 deficiency and neuronal cell dysfunction at the hedging level the source supports.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Impaired neurodevelopment is the presumed route to the clinical

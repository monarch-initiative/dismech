genetic:
- name: TAF1
  gene_term:
    preferred_term: TAF1
    term:
      id: hgnc:11535
      label: TAF1
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
    evidence:
    - reference: PMID:31341187
      reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we present a five-generation family affected with X-linked intellectual disability that co-segregated with a TAF1 c.3568C>T, p.(Arg1190Cys) variant"
      explanation: Demonstrates X-linked co-segregation of a TAF1 variant with the intellectual disability phenotype.
  notes: >
    TAF1 lies at Xq13.1 and encodes the largest subunit of TFIID, a protein of
    roughly 1,870-1,890 amino acids depending on the isoform and source cited.
    Disease alleles are overwhelmingly missense and are distributed across the
    protein, including the TAF1-TAF7 interaction domain and the tandem
    C-terminal bromodomains. A translation-initiation-codon (start-loss)
    variant, one splice-site variant, and two large Xq13.1 duplications have
    also been reported, so "missense" describes the dominant class rather than
    the whole allelic spectrum. The absence of hemizygous loss-of-function
    alleles in population databases - a statement both sources qualify to the
    canonical protein-coding isoform - together with embryonic lethality of
    null alleles in mouse and zebrafish, indicates that complete loss of TAF1
    is not viable and that disease alleles retain partial function. Assigning pathogenicity to individual TAF1 missense variants is
    difficult: the gene is very large, it is X-linked, and a substantial
    fraction of candidate variants in the largest series could not be confidently
    classified.
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the large size of the gene (1,893 amino acids), and the fact that TATA-box binding protein-associated factor 1 (TAF1) is centrally involved in global RNA polymerase II (pol II) transcription"
    explanation: Gives the size and central transcriptional role that make variant interpretation hard. Note this source's 1,893 figure differs from the 1,873 given by the TAF1 review (PMID:39323550); the notes therefore state a range rather than pick one.
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It also illustrates the challenges for determining the pathogenicity of inherited missense variants, particularly for genes mapping to chromosome X."
    explanation: Records the variant-interpretation difficulty that qualifies every reported TAF1 missense allele.
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The TAF1 gene is located on the X chromosome (Xq13.1); thus, in males, there is only one copy, and in females, there are two, one of which undergoes X inactivation to maintain the same dosage in both sexes"
    explanation: Establishes the chromosomal location and dosage context underlying the X-linked inheritance.
  - reference: PMID:25644381
    reference_title: "X-exome sequencing of 405 unresolved families identifies seven novel intellectual disability genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "potentially deleterious variants in 2 novel candidate XLID genes (CDK16 and TAF1)"
    explanation: The X-exome study that first flagged TAF1 as a candidate X-linked intellectual disability gene.
  variants:
  - name: TAF1 c.3568C>T p.(Arg1190Cys)
    description: >
      Missense variant in the RAP74-interacting domain, co-segregating with
      X-linked intellectual disability across a five-generation family.
    evidence:
    - reference: PMID:31341187
      reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we present a five-generation family affected with X-linked intellectual disability that co-segregated with a TAF1 c.3568C>T, p.(Arg1190Cys) variant"
      explanation: Reports the variant and its co-segregation with disease.
  - name: TAF1 c.4735A>G p.Ser1600Gly
    description: >
      Missense variant in the second bromodomain identified by combined genome
      and transcriptome sequencing in a proband with cerebellar hypoplasia; the
      carrier mother showed 90:10 skewed X-chromosome inactivation.
    evidence:
    - reference: PMID:32714589
      reference_title: "A novel variant in TAF1 affects gene expression and is associated with X-linked TAF1 intellectual disability syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By combining genome sequence data with transcriptomic data, a probable candidate variant, p.Ser1600Gly, emerged in TAF1."
      explanation: Reports identification of the variant in the proband.
    - reference: PMID:32714589
      reference_title: "A novel variant in TAF1 affects gene expression and is associated with X-linked TAF1 intellectual disability syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the RNA-seq data revealed a 90:10 extremely skewed X-chromosome inactivation (XCI) in the mother"
      explanation: Documents the skewed XCI in the carrier mother that accompanies this variant.
  - name: TAF1 c.1A>C p.(Met1?)
    description: >
      Translation-initiation-codon variant found in the original Abidi syndrome
      family, whose lymphoblasts show reduced RAP74 phosphorylation.
    evidence:
    - reference: PMID:42548218
      reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A single base substitution that alters the translation initiation codon of TAF1, c.1A>C (p.Met1?), was found in affected males from the original Abidi syndrome family by X-exome sequencing."
      explanation: Reports the variant and the family in which it segregates.
  - name: TAF1 c.4286A>C p.(Gln1429Pro)
    description: >
      C-terminal domain missense variant identified in a second X-linked
      intellectual disability family, also associated with reduced RAP74
      phosphorylation.
    evidence:
    - reference: PMID:42548218
      reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A missense variant in the C-terminal domain of TAF1, c.4286A>C (p.Gln1429Pro), was identified in another XLID family including three males with intellectual disability and variable somatic features using the same approach."
      explanation: Reports the variant and the family in which it was identified.

diagnosis:
- name: Exome or genome sequencing with segregation analysis
  description: >
    Affected males are typically ascertained through exome or genome
    sequencing performed for idiopathic developmental delay or intellectual
    disability. Because TAF1 is large, X-linked, and tolerant of many benign
    missense changes, a candidate variant requires familial segregation
    analysis and clinical phenotyping before pathogenicity can be assigned;
    in the largest series only a minority of candidate variants could be
    confidently classified. Skewed X-chromosome inactivation in the carrier
    mother is a supporting observation.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >
    Identification of a hemizygous TAF1 variant in an affected male, supported
    by segregation with the phenotype in the family.
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants were identified using exome sequencing (ES) or genome sequencing (GS) primarily through clinical diagnostic testing."
    explanation: States the diagnostic modality by which the cohort was ascertained.
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial segregation analysis, clinical phenotyping, and bioinformatics were capitalized on to assess potential variant pathogenicity"
    explanation: Describes the interpretive steps required beyond sequencing itself.
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals were initially referred to clinics for the investigation of idiopathic-DD and/or ID."
    explanation: Records the clinical indication that leads to testing.

treatments:
- name: Supportive and Developmental Care
  description: >
    No disease-modifying therapy exists for TAF1-related disorders. Management
    is supportive and developmental — early intervention, physical, speech, and
    occupational therapies directed at the delay, hypotonia, and gait
    disturbance — together with surveillance for the seizure, hearing, and
    cardiac features documented in the expanded allelic series.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive and developmental care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, there are no successful treatments for these TAF1 disorders."
    explanation: Establishes the absence of disease-modifying therapy, which is why management is supportive.
- name: Genetic Counseling
  description: >
    Genetic counseling addresses the X-linked recurrence risk and carrier
    status. Carrier mothers are typically asymptomatic with completely skewed
    X-chromosome inactivation, so a normal maternal phenotype does not exclude
    carrier status; symptomatic female carriers have also been reported.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31341187
    reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected males presented with intellectual disability and dysmorphic features, while heterozygous females were asymptomatic and had completely skewed X-chromosome inactivation."
    explanation: Establishes the asymptomatic-carrier-female biology that makes counseling and carrier testing necessary; the paper reports the genetics, not the counseling intervention, hence INDIRECT.
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "many female cases are asymptomatic and were identified due to their relationship with affected male family members"
    explanation: Confirms that carrier females are found through the family rather than by their own presentation, which is the counseling-relevant point.

animal_models:
- name: Taf1 knockout mouse
  species: Mouse
  genotype: Ubiquitous Taf1 knockout (conditional cre-lox allele)
  publication: PMID:38804708
  description: >
    The first ubiquitous Taf1 knockout mouse, generated from a validated
    conditional cre-lox allele. Deletion is embryonically lethal in males;
    heterozygous females show increased weight and reduced movement but no
    gross brain differences.
  modeled_mechanisms:
  - target: TAF1 Hypomorphic Missense Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >
      A complete null does not model the human hypomorphic disease lesion:
      male nulls die in utero rather than developing a neurodevelopmental
      syndrome, and heterozygous females escape the lesion through skewed X
      inactivation. The link is pointed at the lesion node rather than at the
      downstream transcription node because a null unquestionably perturbs
      TFIID-dependent transcription — what it fails to reproduce is the
      partial-function allele the human disease actually carries.
    limitations: >-
      Male hemizygous knockout is embryonically lethal, so the genotype that
      corresponds to the human affected male produces no live phenotype to
      compare. Heterozygous females show extreme skewing toward the non-mutant
      chromosome, with no differences in gross brain structure, overall
      expression, or protein localisation, so they do not model the male
      syndrome either. Human disease alleles are missense and hypomorphic, not
      null.
    evidence:
    - reference: PMID:38804708
      reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We discovered that Taf1 deletion in male mice was embryonically lethal, which may explain why no null variants have been identified in humans."
      explanation: The lethality is precisely why this model cannot reproduce the human neurodevelopmental mechanism in the corresponding genotype.
    - reference: PMID:38804708
      reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the brains of Taf1 heterozygous female mice, no differences were found in gross structure, overall expression and protein localisation, suggesting extreme skewed X inactivation towards the non-mutant chromosome."
      explanation: The surviving heterozygous genotype shows no brain phenotype, confirming that neither available genotype recapitulates the human mechanism.
    readouts:
    - name: Body weight and locomotor activity in heterozygous females
      target: TAF1 Hypomorphic Missense Variants
      direction: ALTERED
      interpretation: >
        The only phenotype the surviving genotype yields is a weight and
        movement change, interpreted by the authors as a small subset of
        neurons being affected — far short of the human syndrome.
      evidence:
      - reference: PMID:38804708
        reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "these female mice exhibited a significant increase in weight, weight with age, and reduced movement, suggesting that a small subset of neurons was negatively impacted by Taf1 loss"
        explanation: Reports the measured weight and movement changes in heterozygous females.
- name: taf1 knockout zebrafish
  species: Zebrafish
  genotype: Complete taf1 knockout
  publication: PMID:31341187
  description: >
    The first complete knockout of the TAF1 orthologue in zebrafish. The model
    establishes that intact taf1 is required for embryonic development and
    that its loss preferentially dysregulates neurodevelopmental gene sets.
  modeled_mechanisms:
  - target: Dysregulated Neurodevelopmental Transcriptional Program
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      Complete loss of taf1 perturbs the transcriptional program and reveals
      enrichment for neurodevelopmental genes, supporting the specificity of
      the transcriptional lesion for neurodevelopment.
    limitations: >-
      A complete null in zebrafish is lethal during embryonic development,
      whereas human disease alleles are hypomorphic missense variants in
      surviving males, so the model perturbs the mechanism rather than
      reproducing the disease state.
    evidence:
    - reference: PMID:31341187
      reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We investigated the role of TAF1 and its association to neurodevelopment by creating the first complete knockout model of the TAF1 orthologue in zebrafish."
      explanation: Establishes the model and its purpose as a perturbation of TAF1 function.
    readouts:
    - name: Neurodevelopmental gene enrichment in knockout transcriptome
      target: Dysregulated Neurodevelopmental Transcriptional Program
      direction: ALTERED
      interpretation: >
        Loss of taf1 shifts the transcriptome specifically toward
        neurodevelopmental gene sets, which is the model's central support for
        the transcriptional node.
      evidence:
      - reference: PMID:31341187
        reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Transcriptome analysis of taf1 zebrafish knockout revealed enrichment for genes associated with neurodevelopmental processes."
        explanation: Reports the transcriptomic measurement behind this readout.
  - target: TAF1 Hypomorphic Missense Variants
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      The model provides the organismal evidence that complete TAF1 loss is
      not viable, which is the basis for interpreting human disease alleles as
      hypomorphic rather than null.
    limitations: >-
      Embryonic lethality in zebrafish is evidence about the null state, not
      about any specific human missense allele's residual activity.
    evidence:
    - reference: PMID:31341187
      reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A crucial function of human TAF1 during embryogenesis can be inferred from the model, demonstrating that intact taf1 is essential for embryonic development."
      explanation: Supplies the essentiality result that constrains the human allelic spectrum to hypomorphs.
- name: CRISPR/Cas9 TAF1-edited rat
  species: Rat
  genotype: Somatic brain TAF1 deletion by lentiviral CRISPR/Cas9 (gRNA-TAF1, intracerebroventricular)
  publication: PMID:31344492
  description: >
    A somatic brain transgenesis model in which TAF1 is deleted in the
    postnatal rat brain by intracerebroventricular delivery of lentiviral
    CRISPR/Cas9. It was developed specifically because embryonic mouse
    knockouts of TAF1 had failed, and it produces behavioral deficits with
    cerebellar Purkinje cell pathology.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >
      TAF1 deletion in the developing rat brain produces Purkinje cell
      hypoplasia and loss with reduced CaV3.1 expression and associated motor
      deficits — the observations that define this node.
    limitations: >-
      The lesion is a somatic postnatal deletion delivered to part of the
      brain, not a germline hypomorphic missense allele present from
      conception, and no human MRXS33 neuropathology exists against which to
      check the Purkinje finding.
    evidence:
    - reference: PMID:31344492
      reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report the development and characterization of a novel animal model for TAF1 ID syndrome in which the TAF1 gene is deleted in embryonic rats using clustered regularly interspaced short palindromic repeats (CRISPR) associated protein 9 (Cas9) technology and somatic brain transgenesis mediated by lentiviral transduction."
      explanation: Establishes the model as purpose-built for TAF1 ID syndrome, supporting its use as informative for this node.
    readouts:
    - name: Purkinje cell number and cerebellar morphology
      target: Cerebellar Purkinje Cell Loss
      direction: DECREASED
      interpretation: Direct histopathological correlate of the Purkinje cell loss node.
      evidence:
      - reference: PMID:31344492
        reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Deletion of TAF1 lead to a hypoplasia and loss of the Purkinje cells."
        explanation: Reports the histological measurement behind this readout.
    - name: CaV3.1 T-type calcium channel expression
      target: Cerebellar Purkinje Cell Loss
      direction: DECREASED
      interpretation: >
        Reduced presynaptic CaV3.1 is the channel-level change the authors link
        to irregular cerebellar output in this model.
      evidence:
      - reference: PMID:31344492
        reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Immunostaining revealed a reduction in the expression of the CaV3.1 T-type calcium channel."
        explanation: Reports the immunostaining measurement behind this readout.
    - name: Behavioral response to the T-type calcium channel enhancer SAK3
      target: Cerebellar Purkinje Cell Loss
      direction: RESTORED
      interpretation: >
        Pharmacological rescue in the same model. SAK3 is a preclinical tool
        compound in rats; it is not a treatment for the human disease and is
        deliberately not curated in the treatments section.
      evidence:
      - reference: PMID:32622085
        reference_title: "The investigation of the T-type calcium channel enhancer SAK3 in an animal model of TAF1 intellectual disability syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Oral administration of SAK3 (0.25 mg/kg, p.o.) significantly rescued the behavior abnormalities in beam walking test and open field test caused by TAF1 gene editing."
        explanation: Reports the behavioral rescue measurement in the TAF1-edited rat.
      - reference: PMID:32622085
        reference_title: "The investigation of the T-type calcium channel enhancer SAK3 in an animal model of TAF1 intellectual disability syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SAK3 protected the Purkinje and granule cells from apoptosis induced by TAF-1 gene editing."
        explanation: Ties the rescue specifically to the Purkinje cell population this node names.

differential_diagnoses:
- name: X-linked dystonia-parkinsonism
  description: >
    The other TAF1 disease, and the key allelic differential. XDP is caused by
    a Filipino founder SINE-VNTR-Alu retrotransposon insertion in intron 32 of
    TAF1 — a non-coding lesion — and presents in adulthood as a progressive
    dystonia-parkinsonism with neostriatal degeneration. MRXS33 is caused by
    coding missense variants (or Xq13.1 duplication) and presents congenitally
    as a neurodevelopmental syndrome. Both are X-linked and both involve TAF1
    transcriptional dysregulation, so gene-level testing alone does not
    distinguish them; the lesion class does.
  disease_term:
    preferred_term: X-linked dystonia-parkinsonism
    term:
      id: MONDO:0010747
      label: X-linked dystonia-parkinsonism
  distinguishing_features:
  - Lesion class - intronic SVA retrotransposon insertion in XDP versus coding missense variant or Xq13.1 duplication in MRXS33
  - Age at onset - adult in XDP versus congenital/infantile in MRXS33
  - Filipino founder ancestry with a single shared haplotype in XDP
  - Progressive movement disorder with neostriatal degeneration in XDP versus developmental delay with facial dysmorphism in MRXS33
  evidence:
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TAF1 missense variants in human males cause X-linked intellectual disability, a neurodevelopmental disorder, and TAF1 is dysregulated in X-linked dystonia-parkinsonism, a neurodegenerative disorder."
    explanation: States the allelic relationship and the neurodevelopmental versus neurodegenerative contrast that separates the two entities.
  - reference: PMID:32622085
    reference_title: "The investigation of the T-type calcium channel enhancer SAK3 in an animal model of TAF1 intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A non-coding 2.6 kb insertion of a SINE-VNTR-Alu (SVA)-type retrotransposon in intron 32 of TAF1 causes the neurological disorder X-linked dystonia-parkinsonism (XDP; OMIM: 313650). XDP is a progressive neurodegenerative disorder characterized by involuntary movements (dystonia), most often developing in adult life in combination with Parkinsonism"
    explanation: Specifies the distinct XDP lesion and its adult-onset movement-disorder presentation.
- name: TAF-subunit TAFopathies
  description: >
    Pathogenic variants in other components of the TAF/TFIID complex — TBP,
    TAF2, and TAF6 — produce an overlapping syndrome of intellectual
    disability with craniofacial and cardiac anomalies, collectively termed
    TAFopathy. These share the general-transcription-machinery mechanism with
    TAF1 disease and overlap clinically, so the differential is resolved by
    which subunit carries the variant rather than by phenotype.
  distinguishing_features:
  - Which TFIID subunit carries the variant on sequencing
  - TAF1 disease is X-linked and male-limited in practice, whereas the other TAFopathies are autosomal
  evidence:
  - reference: PMID:37746814
    reference_title: "Deletion of taf1 and taf5 in zebrafish capitulate cardiac and craniofacial abnormalities associated with TAFopathies through perturbations in metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This syndrome has been termed as a TAFopathy and includes mutations in TATA binding protein (TBP), TAF1, TAF2, and TAF6."
    explanation: Names the TAFopathy group and its member genes, establishing the differential. Graded OTHER because this is the zebrafish study's background framing rather than its own human data.

mechanistic_hypotheses:
- hypothesis_group_id: rap74_phosphorylation_route
  hypothesis_label: Reduced RAP74 phosphorylation as the route from TAF1 variant to transcriptional dysfunction
  status: EMERGING
  description: >
    Patient lymphoblasts carrying two independent pathogenic TAF1 variants show
    reduced phosphorylation of RAP74. The authors advance this as a potential
    mechanism connecting the variants to transcriptional dysfunction. Two
    things keep it a hypothesis rather than a curated step. No study has shown
    the phosphorylation deficit is necessary or sufficient for the
    neurodevelopmental phenotype; and the mechanism the authors propose depends
    on TAF1 itself being the kinase, an activity a 2024 review reports could
    not be confirmed in recent TFIID/TAF1 studies, with much of the original
    work retracted. The measured phosphorylation change stands; its attribution
    to a TAF1 kinase activity does not.
  evidence:
  - reference: PMID:42548218
    reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study expands the phenotypic spectrum of TAF1-related XLID and implicates reduced RAP74 phosphorylation as a potential mechanism."
    explanation: The source's own framing as a potential mechanism is what this hypothesis group records.
  - reference: PMID:39323550
    reference_title: "The roles of TAF1 in neuroscience and beyond."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "These studies could not be reproduced by others and much of the related work by Sauer et al. has been retracted"
    explanation: Undercuts the kinase premise the proposed mechanism rests on, which is why this group is EMERGING rather than a curated causal step.
- hypothesis_group_id: cerebellar_purkinje_route
  hypothesis_label: Cerebellar Purkinje cell loss as the substrate of the motor phenotype
  status: EMERGING
  description: >
    A CRISPR-edited rat model shows that TAF1 deletion in the developing brain
    causes Purkinje cell hypoplasia and loss with reduced CaV3.1 expression,
    and that pharmacological enhancement of T-type calcium channels rescues
    both the cells and the behavior. Whether cerebellar Purkinje pathology is
    the substrate of gait disturbance in human MRXS33 is untested: no human
    neuropathology has been reported, and brain MRI is normal in some affected
    males.
  evidence:
  - reference: PMID:31344492
    reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abnormal motor symptoms in TAF1-edited rats were associated with irregular cerebellar output caused by changes in the intrinsic activity of the Purkinje cells due to loss of pre-synaptic CaV3.1."
    explanation: Supplies the model-level mechanism the hypothesis proposes to extend to humans.
  - reference: PMID:31344492
    reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "How these mutations cause dysmorphology, hypotonia, intellectual and motor defects is unknown."
    explanation: The same paper states that the route from mutation to motor defect is unknown, which is why this remains a hypothesis rather than a curated causal chain.

discussions:
- discussion_id: taf1_models_are_null_human_disease_is_hypomorphic
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Every TAF1 animal model uses a null or somatic-deletion lesion, while human
    MRXS33 is caused by germline hypomorphic missense variants. Does any
    existing model report on the mechanism of the human missense disease?
  attaches_to:
  - pathophysiology#TAF1 Hypomorphic Missense Variants
  - pathophysiology#Cerebellar Purkinje Cell Loss
  rationale: >
    The mismatch is structural, not incidental. Complete TAF1 loss is
    embryonically lethal in both mouse and zebrafish, so the genotype that
    corresponds to an affected human male cannot be studied in those systems at
    all; the rat model circumvents lethality only by deleting TAF1 somatically
    in the postnatal brain, which is a different lesion in a different
    developmental window. Consequently the cerebellar Purkinje pathology that
    the rat model contributes — the entry's only cellular account of the motor
    phenotype — rests on a lesion class the human disease does not have, and no
    human neuropathology exists to check it against. Brain MRI is reported
    normal in at least one affected male, which is at least consistent with the
    cerebellar route not being universal.
  evidence:
  - reference: PMID:31344492
    reference_title: "TAF1-gene editing alters the morphology and function of the cerebellum and cerebral cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mouse models which have embryonically targeted TAF1 have failed, possibly due to TAF1 being essential for viability, preferentially expressed in early brain development, and intolerant of mutation."
    explanation: States why germline mammalian models of TAF1 are unavailable, which is the origin of the mismatch.
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We discovered that Taf1 deletion in male mice was embryonically lethal, which may explain why no null variants have been identified in humans."
    explanation: Confirms the lethality of the null genotype in the mammalian model, closing off the direct comparison to affected human males.

notes: >
  Curation scope decisions. No `conforms_to` module target was declared. The
  closest candidate, `epigenetic_machinery_neurodevelopmental_dysregulation`,
  explicitly scopes itself to the machinery that maintains chromatin state
  (writers, erasers, remodelers, readers) and excludes transcriptional lesions
  that are not chromatin-machinery lesions. TAF1 is a subunit of the general
  transcription factor TFIID acting at the RNA polymerase II preinitiation
  complex, and the literature groups it with the TAFopathies (TBP, TAF1, TAF2,
  TAF6) rather than with the chromatinopathies. No TFIID or
  general-transcription-machinery module exists in `kb/modules/` at the time of
  writing; one covering the TAFopathies would be the natural home for this
  mechanism.

  SAK3, a T-type calcium channel enhancer that rescues behavior and Purkinje
  cell survival in the TAF1-edited rat, is deliberately curated as a readout on
  that animal model rather than as a `treatments` entry. It has been tested only
  in rats and is not a human therapy.

  No GeneReviews chapter exists for TAF1 intellectual disability syndrome. A
  PubMed search for TAF1 plus GeneReviews returns only the X-linked
  dystonia-parkinsonism chapter (PMID:20301662), which covers the allelic XDP
  disorder and not MRXS33, so no GeneReviews phenotype baseline was available
  for this entry. Note that `just tag-references` auto-inserted that XDP
  chapter into this entry's top-level `references:` block during curation; it
  was removed, because this entry cites it nowhere and it describes a different
  disease. Do not re-add it on a later tagging sweep.

  One frequently cited case report, PMID:30805980 (Okamoto et al., male
  siblings with a novel TAF1 mutation), was fetched but its cache carries no
  retrievable body text, so no snippet could be quoted from it and it is not
  cited here.

  Known gaps left for a follow-up round, recorded so they are not mistaken for
  oversights. Hypoplasia of the corpus callosum, microcephaly, and chronic
  otitis media are reported at appreciable frequency across the published
  series but are curated here only through the general "Abnormal brain
  morphology" phenotype or not at all; each needs its own phenotype entry with
  a quotable frequency. The congenital heart malformation frequency band is
  left as OCCASIONAL on the strength of the "less common features" sentence,
  but a dedicated study (PMID:32396742, Morton et al., congenital heart defects
  due to TAF1 missense variants) reports a much higher proportion in
  damaging-missense carriers; that cache has no retrievable body text, so the
  conflict is recorded here rather than resolved. Treatments are curated as a
  single supportive-care entry plus genetic counseling; the component
  interventions (cardiac repair, antiseizure medication, hearing and strabismus
  management, feeding therapy) are not individually sourced. No treatment
  carries target_mechanisms, so treatments do not join the pathograph.

      snippet: "the TAF1 variant may impair neuronal differentiation and cell proliferation"
      explanation: Connects the TAF1 variant to the cellular differentiation defect in the hedged terms the source uses; the step from the expression program to differentiation is not itself measured.
- name: Impaired Neuronal Differentiation and Neurodevelopment
  role: intermediate
  biological_scale: CELLULAR
  description: >
    Neuronal differentiation and proliferation are impaired in TAF1-variant
    neuronal cells, and intact taf1 is required for embryonic development with

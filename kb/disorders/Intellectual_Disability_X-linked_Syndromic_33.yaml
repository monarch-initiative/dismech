    snippet: "Two additional families harboring large duplications involving TAF1 were also found to share phenotypic overlap with the probands harboring single-nucleotide changes, but they also demonstrated a severe neurodegeneration phenotype."
    explanation: Directly reports the severe neurodegeneration phenotype specific to the duplication families.
  - reference: PMID:38804708
    reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Only two unrelated families carried gene duplications including TAF1 (and surrounding genes at Xq13.1), resulting in a severe progressive neurodegenerative phenotype, but with few common clinical features to cases with missense variants"
    explanation: Confirms the duplication-specific progressive neurodegeneration and notes its limited clinical overlap with the missense cases.

pathophysiology:
- name: TAF1 Hypomorphic Missense Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Germline missense variants across the TAF1 coding sequence are the
    predominant disease lesion. Reported alleles are almost exclusively
    missense, and hemizygous or homozygous loss-of-function alleles are absent
    from population databases, which together with embryonic lethality of null
    alleles in mouse and zebrafish indicates that surviving disease alleles are
    hypomorphic rather than null.
  genes:
  - preferred_term: TAF1
    term:
      id: hgnc:11535
      label: TAF1
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only missense variants have been found; the lack of hemi- and homozygous loss-of-function variants in the protein coding part of the canonical TAF1 isoform in human population databases suggests that the complete loss of TAF1 may be embryonic-lethal."
    explanation: Establishes both the missense-only allelic spectrum and the inference that complete loss is not compatible with life, which is what makes the disease alleles hypomorphic.
  - reference: PMID:26637982
    reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that mutations in TAF1 play a critical role in the development of this X-linked ID syndrome."
    explanation: The original series' conclusion that TAF1 mutation is causal for the syndrome.
  downstream:
  - target: Reduced RAP74 Phosphorylation in Patient Cells
    causal_link_type: DIRECT
    description: >
      Patient-derived lymphoblasts carrying the causal variants show reduced
      RAP74 phosphorylation. The variant-to-phosphorylation observation is
      direct; the mechanism connecting them is not settled (see the node).
    evidence:
    - reference: PMID:42548218
      reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Lymphoblasts carrying either the p.Met1? or the p.Gln1429Pro variants from probands in these two families were studied using a phosphorylation-specific antibody and found to have reduced phosphorylation of RAP74."
      explanation: Patient-derived lymphoblasts carrying the causal variants directly show the reduced phosphorylation, linking variant to kinase defect.
  - target: TFIID-Dependent Transcription Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      TAF1 is the largest subunit of TFIID and directs assembly of the RNA
      polymerase II preinitiation complex, so a hypomorphic TAF1 is presumed to
      degrade that function. No cited study measures preinitiation complex
      assembly or TFIID function in patient material, so this edge rests on
      TAF1's known normal role rather than on a measured defect.
    evidence:
    - reference: PMID:31646703
      reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "TAF1 encodes the largest subunit of the basal transcription factor II D (TFIID), which directs the assembly of the pol II preinitiation complex"
      explanation: Establishes TAF1's normal role in preinitiation complex assembly; the inference that a hypomorphic allele impairs it is an added step this quote does not itself make.
- name: TAF1 Locus Duplication
  role: trigger
  biological_scale: MOLECULAR
  description: >
    A second, distinct initiating lesion: large duplications at Xq13.1
    encompassing TAF1 and neighboring genes. These families overlap the
    missense phenotype but add severe progressive neurodegeneration, so the
    duplication is modeled as its own trigger rather than as a variant class
    of the missense lesion.
  genes:
  - preferred_term: TAF1
    term:
      id: hgnc:11535
      label: TAF1
  evidence:
  - reference: PMID:26637982
    reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two additional families harboring large duplications involving TAF1 were also found to share phenotypic overlap with the probands harboring single-nucleotide changes, but they also demonstrated a severe neurodegeneration phenotype."
    explanation: Identifies the duplication lesion and its distinct additional phenotype.
  downstream:
  - target: Progressive neurodegeneration in TAF1 duplication
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The duplication families show severe progressive neurodegeneration, but
      the duplications span genes beyond TAF1 and no intervening mechanism has
      been established, so the route from duplication to neurodegeneration is
      recorded as unresolved.
    evidence:
    - reference: PMID:38804708
      reference_title: "Taf1 knockout is lethal in embryonic male mice and heterozygous females show weight and movement disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Only two unrelated families carried gene duplications including TAF1 (and surrounding genes at Xq13.1), resulting in a severe progressive neurodegenerative phenotype, but with few common clinical features to cases with missense variants"
      explanation: Reports the duplication-to-neurodegeneration association while noting the duplications include surrounding genes, which is why the intermediates are treated as unknown.
  - target: TFIID-Dependent Transcription Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Increased TAF1 dosage is presumed to perturb the same TFIID-dependent
      transcriptional function that the missense alleles impair, but no direct
      measurement of TFIID function in duplication carriers has been reported.
    evidence:
    - reference: PMID:26637982
      reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two additional families harboring large duplications involving TAF1 were also found to share phenotypic overlap with the probands harboring single-nucleotide changes"
      explanation: The shared phenotypic overlap is the basis for convergence on a common transcriptional mechanism; the mechanism itself is not directly demonstrated in these families.
- name: Reduced RAP74 Phosphorylation in Patient Cells
  role: intermediate
  biological_scale: MOLECULAR
  description: >
    Lymphoblasts from probands carrying two independent pathogenic TAF1
    variants show reduced phosphorylation of RNA polymerase II-associated
    protein 74 (RAP74). The curated observation here is that measured
    reduction in RAP74 phosphorylation, not the identity of the responsible
    kinase. PMID:42548218 attributes the activity to TAF1's own N- and
    C-terminal serine/threonine kinase domains, but a 2024 TAF1 review reports
    that the enzymatic activities historically attributed to TAF1 — kinase
    among them — could not be confirmed in recent TFIID/TAF1 studies and that
    much of the underlying work has been retracted. This node therefore does
    not bind a TAF1 kinase molecular function, and the route onward to
    transcriptional dysfunction is hypothesis-scoped.
  evidence:
  - reference: PMID:42548218
    reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The N- and C-terminal domains of TAF1 are known to possess a serine/threonine kinase activity that selectively phosphorylates RNA polymerase II-associated protein 74 (RAP74)."
    explanation: The source of the attributed TAF1 kinase activity, recorded here as the claim this paper makes rather than as established fact - see the REFUTE item below.
  - reference: PMID:39323550
    reference_title: "The roles of TAF1 in neuroscience and beyond."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "several enzymatic activities have been attributed to TAF1 in the past, which could not be confirmed in recent TFIID and/or TAF1 studies. These include kinase, histone acetylation and ubiquitination activities"
    explanation: Contradicts the premise that TAF1 itself is the kinase acting on RAP74, which is why this node curates the measured phosphorylation change rather than a TAF1 kinase activity.
  - reference: PMID:42548218
    reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study expands the phenotypic spectrum of TAF1-related XLID and implicates reduced RAP74 phosphorylation as a potential mechanism."
    explanation: States the authors' mechanistic inference, while its hedged wording is why this node is not treated as an established step.
  downstream:
  - target: TFIID-Dependent Transcription Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      RAP74 is a subunit of TFIIF, a general transcription factor that acts in
      preinitiation complex assembly as well as elongation, so reduced
      phosphorylation is proposed to feed into the general transcription
      defect. The cited study frames this as a potential mechanism rather than
      a demonstrated route.
    hypothesis_groups:
    - rap74_phosphorylation_route
    evidence:
    - reference: PMID:42548218
      reference_title: "Abidi Syndrome and Another Family With X-Linked Intellectual Disability Have TAF1 Variants and Reduced Phosphorylation of RNA Polymerase II Associated Protein 74."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "implicates reduced RAP74 phosphorylation as a potential mechanism"
      explanation: The source explicitly labels this a potential mechanism, which is what the hypothesis-scoped edge records.
- name: TFIID-Dependent Transcription Dysfunction
  role: intermediate
  biological_scale: MOLECULAR
  description: >
    TAF1 is the largest subunit of TFIID, which with TATA-binding protein and
    the other TBP-associated factors nucleates the RNA polymerase II
    preinitiation complex at essentially all pol II promoters. A TAF1 lesion
    therefore perturbs a general transcription function rather than a single
    target pathway. The node is tagged DYSREGULATED rather than DECREASED
    because it has two upstream lesions pushing in opposite directions —
    hypomorphic missense alleles reducing TAF1 function and Xq13.1
    duplications increasing TAF1 dosage — and because no study has measured
    preinitiation complex assembly in patient material in either direction.
  biological_processes:
  - preferred_term: RNA polymerase II preinitiation complex assembly
    term:
      id: GO:0051123
      label: RNA polymerase II preinitiation complex assembly
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:31646703
    reference_title: "Missense variants in TAF1 and developmental phenotypes: challenges of determining pathogenicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TAF1 encodes the largest subunit of the basal transcription factor II D (TFIID), which directs the assembly of the pol II preinitiation complex (Papai, Weil, & Schultz, 2011) and is likely required for all pol II gene promoters"
    explanation: Establishes TAF1's role in preinitiation complex assembly and the generality of that requirement.
  - reference: PMID:39323550
    reference_title: "The roles of TAF1 in neuroscience and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TAF1 is best known for being part of a protein complex with TBP and other TAFs, forming the basal transcription factor IID (TFIID), which is an essential component of the RNA pol II initiation complex"
    explanation: A dedicated TAF1 review confirming the same molecular role.
  downstream:
  - target: Dysregulated Neurodevelopmental Transcriptional Program
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Downstream gene sets are shifted in TAF1-lesioned material — genes
      regulated by E-box proteins in a patient family, genes associated with
      neurodevelopmental processes in a taf1-null zebrafish. Neither study
      measured TFIID function itself, so attributing the transcriptional shift
      specifically to impaired TFIID is an inference rather than a measured
      link; the patient study reports the signature as associated with the
      phenotype.
    evidence:
    - reference: PMID:26637982
      reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Functional analysis with RNA-seq for one of the families suggested that the phenotype is associated with downregulation of a set of genes notably enriched with genes regulated by E-box proteins."
      explanation: Patient RNA-seq links the TAF1 lesion to a specific downstream transcriptional signature.
    - reference: PMID:31341187
      reference_title: "TAF1, associated with intellectual disability in humans, is essential for embryogenesis and regulates neurodevelopmental processes in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transcriptome analysis of taf1 zebrafish knockout revealed enrichment for genes associated with neurodevelopmental processes."
      explanation: An orthogonal, whole-organism demonstration that loss of taf1 dysregulates specifically neurodevelopmental gene sets.
- name: Dysregulated Neurodevelopmental Transcriptional Program
  role: intermediate
  biological_scale: MOLECULAR
  description: >
    The transcriptional consequence of impaired TFIID function is
    preferentially felt in neurodevelopmental gene sets. Patient RNA-seq shows
    downregulation of E-box-regulated genes; taf1-null zebrafish transcriptomes
    are enriched for neurodevelopmental genes; and TAF1-deficient neuronal
    cells show differential expression of neuronal ion channel genes.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26637982
    reference_title: "TAF1 Variants Are Associated with Dysmorphic Features, Intellectual Disability, and Neurological Manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the phenotype is associated with downregulation of a set of genes notably enriched with genes regulated by E-box proteins"
    explanation: Names the specific transcriptional signature observed in a patient family.
  - reference: PMID:32714589
    reference_title: "A novel variant in TAF1 affects gene expression and is associated with X-linked TAF1 intellectual disability syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results showed that neuronal ion channel genes were differentially expressed between TAF1 deletion and TAF1 variant p.Ser1600Gly cells, when compared with their respective controls, and that the TAF1 variant may impair neuronal differentiation and cell proliferation."
    explanation: Shows in a neuronal cell model that both TAF1 deletion and the patient variant shift neuronal gene expression.
  downstream:

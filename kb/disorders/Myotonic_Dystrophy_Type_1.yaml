- name: SIX5/DMPK Locus Effects in Lens
  description: >
    The DM1 CTG repeat lies near SIX5, and repeat-associated local chromatin or
    transcriptional effects can reduce SIX5 dosage. Mouse Six5 loss produces
    progressive ocular cataracts, supporting a parallel lens branch in addition
    to toxic RNA spliceopathy.
  evidence:
  - reference: PMID:10802668
    reference_title: "Heterozygous loss of Six5 in mice is sufficient to cause ocular cataracts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate that the rate and severity of cataract formation is inversely related to Six5 dosage and is temporally progressive."
    explanation: Six5 dosage model supports a cataract mechanism connected to the DMPK/SIX5 locus.
  - reference: PMID:17101631
    reference_title: "Increased SK3 expression in DM1 lens cells leads to impaired growth through a greater calcium-induced fragility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "real-time PCR analysis showed reduced SIX5 expression and increased expression of the Ca(2+)-activated K(+) channel SK3 in the DM1 cells"
    explanation: >-
      Human counterpart to the mouse Six5 dosage data. Lens epithelial cell
      lines derived from DM1 cataracts carry large repeat expansions, reduced
      SIX5, and raised SK3, and both the excess calcium-stimulated potassium
      efflux and the excess cell death are blocked by the SK inhibitor apamin.
      SIX5 reduction is measured rather than manipulated here, so the
      SIX5-to-opacity step remains inferred.
  downstream:
  - target: Cataracts

- accession: ega:EGAS00001005830
  title: Full blood mRNA sequencing of myotonic dystrophy type 1 patients after cognitive behavioural therapy
  description: Myotonic dystrophy type 1 (DM1) is an incurable multisystem disease caused by a CTG-repeat expansion in the DM1 protein kinase (DMPK) gene. The OPTIMISTIC clinical trial demonstrated positive and heterogenous effects of cognitive behavioral therapy (CBT) on the capacity for activity and social participations in DM1 patients. Here, we performed mRNA sequencing of full blood for 27 patients of the OPTIMISTIC cohort before and after the CBT intervention. We identified 608 genes for which their expression was significantly associated with the disease causing CTG-repeat expansion, as well as with 1176 genes significantly associated with the average clinical response towards the intervention.

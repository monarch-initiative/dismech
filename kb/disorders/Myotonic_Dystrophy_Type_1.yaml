    reference_title: "Activation of the innate immune response and interferon signalling in myotonic dystrophy type 1 and type 2 cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The upregulated genes in DM1 and DM2 were highly enriched in both interferon-regulated genes (IRGs) and genes associated with the response to dsRNA and the innate immune response."
    explanation: >-
      Array profiling of human DM1 and DM2 cataract lens samples against non-DM

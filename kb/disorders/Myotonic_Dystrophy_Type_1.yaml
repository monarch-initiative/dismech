  evidence:
  - reference: PMID:12351998
    reference_title: "Myotonic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both types of myotonic dystrophy the expanded repeat is transcribed and the RNA produced from the mutant allele is retained in nuclear inclusions. Recent studies suggest that the mutant RNA has a toxic effect on muscle fibers by interfering with the essential functions of the myonucleus, such as RNA processing."
    explanation: Confirms the toxic RNA gain-of-function mechanism in myotonic dystrophy.
  - reference: PMID:15065017
    reference_title: "Myotonic dystrophy: RNA pathogenesis comes into focus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the clinical features common to both diseases are caused by a gain-of-function RNA mechanism in which the CUG and CCUG repeats alter cellular function, including alternative splicing of various genes."
    explanation: Supports the toxic RNA gain-of-function mechanism and its connection to altered splicing.
  - reference: PMID:40238630
    reference_title: "DM1 repeat-expanded RNAs confer RNA toxicity as individual nuclear-retained RNAs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, these observations argue that the persistence of nuclear-retained CUG RNAs, independent of higher-order RNA assemblies, titrates MBNL1 and contributes to disease progression."
    explanation: >-
      Quantitative imaging in a patient-derived myotube model relocates the
      toxic species from the visible focus to the individual nuclear-retained
      transcript, which is why this node is framed around nuclear retention
      rather than focus formation.
  downstream:
  - target: Splicing Factor Imbalance and Fetal Spliceopathy
    causal_link_type: DIRECT
    description: Nuclear-retained CUG RNA titrates MBNL proteins and shifts the CELF1/MBNL balance, producing widespread developmental splice reversion.
  - target: Splicing-Independent Progressive Cardiac Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained expression of a repeat-length-stable CUG RNA drives progressive
      cardiac disease while MBNL-dependent splicing stays static, so at least
      one intermediate on this branch is not the spliceopathy and is not yet
      identified.
  - target: Satellite Cell Premature Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - A cellular stress attributable to the expanded repeat drives p16 accumulation; the step linking retained CUG RNA to p16 induction is uncharacterized.
    description: Large CTG expansions push DM1 muscle precursor cells into p16-dependent premature senescence rather than replicative exhaustion.
  - target: dsRNA-Triggered Innate Immune Activation in Lens
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Repeat-containing transcripts accumulate as double-stranded RNA in DM cells
      and DM1 and DM2 lens tissue carries an interferon and dsRNA-response
      signature, but the sensor and the path to opacity are not established.
- name: Splicing Factor Imbalance and Fetal Spliceopathy
  description: >
    Expanded CUG RNA sequesters MBNL family proteins in nuclear foci and is
    accompanied by increased CELF1/CUGBP1 activity in affected tissues. The
    resulting loss of adult MBNL activity and CELF1/MBNL imbalance causes
    fetal-pattern alternative splicing across skeletal muscle, heart, endocrine,
    and CNS transcripts.
  cell_types:
  - preferred_term: skeletal muscle cell

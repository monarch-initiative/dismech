  evidence:
  - reference: PMID:18974556
    reference_title: "Myotonic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutant RNA sequesters MBNL1, a splice regulator protein and depletes MBNL1 from the nucleoplasm. Loss of MBNL1 results in altered splicing of ClC-1 mRNA."
    explanation: Describes the MBNL1 depletion mechanism that drives DM1 spliceopathy.
  - reference: PMID:27063795
    reference_title: "Splicing misregulation of SCN5A contributes to cardiac-conduction delay and heart arrhythmia in myotonic dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of DM involves a RNA gain-of-function mechanism caused by expression of mutant RNAs containing hundred to thousands of CUG or CCUG repeats that interfere with the splicing of other pre-mRNAs through dysfunction of two classes of RNA-binding proteins."
    explanation: Supports the broader spliceopathy mechanism downstream of expanded repeat RNA.
  - reference: PMID:19223393
    reference_title: "Transcriptional and post-transcriptional impact of toxic RNA in myotonic dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that the majority of changes induced by CUG(exp) RNA in skeletal muscle can be explained by reduced activity of Mbnl1, including many changes that are secondary to myotonia."
    explanation: >-
      Transcriptome-wide comparison of CUG-expansion transgenic, Mbnl1 knockout,
      and Clcn1 null mice quantifies how much of the DM1 expression signature
      the MBNL1 arm accounts for. The same study qualifies the node: the effects
      are mediated mainly but not entirely through Mbnl1, with transcription and
      mRNA decay also contributing.
  - reference: PMID:17936705
    reference_title: "Increased steady-state levels of CUGBP1 in myotonic dystrophy 1 are due to PKC-mediated hyperphosphorylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Activation of PKC is required for CUGBP1 hyperphosphorylation in DM1 cells, and PKCalpha and betaII directly phosphorylate CUGBP1 in vitro."
    explanation: >-
      Supplies the mechanism for the CELF1/CUGBP1 arm this node asserts:
      CUG-repeat RNA expression raises steady-state CUGBP1 by PKC-mediated
      hyperphosphorylation and protein stabilization, not by transcriptional
      induction.
  - reference: PMID:21400563
    reference_title: "Alternative splicing dysregulation secondary to skeletal muscle regeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, CELF1 was elevated in nuclei of mature myofibers of the DM1 model, consistent with a primary effect of pathogenic RNA expression."
    explanation: >-
      Distinguishes the DM1 CELF1 elevation from the DM1-like splicing changes
      that also appear in four non-DM1 dystrophy models and two myotoxin injury
      models. There the changes track regenerating fibers; only in the DM1 model
      is CELF1 raised in mature myofibers, which is what makes it a primary
      consequence of the toxic RNA rather than a regeneration artifact.

- name: SCN5A Splicing Shift and Cardiac Excitability Loss
  description: >
    In DM1 heart tissue, MBNL-dependent spliceopathy shifts SCN5A from the adult
    exon 6B isoform toward the fetal exon 6A isoform. The resulting Nav1.5
    channel has reduced excitability, providing a mutation-to-cardiac conduction
    defect branch in the pathograph. This branch contributes but is not
    sufficient: forcing the adult exon 6B isoform in a CUG960 DM1 heart model
    leaves conduction delay and structural change unimproved, so DM1 cardiac
    disease is not the sum of this splicing defect. See the
    Splicing-Independent Progressive Cardiac Pathology node for the parallel
    arm, and the dm1_nonsplicing_cardiac_progression discussion for what remains
    unresolved.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:27063795
    reference_title: "Splicing misregulation of SCN5A contributes to cardiac-conduction delay and heart arrhythmia in myotonic dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using RNA sequencing, here we identify novel splicing alterations in DM heart samples, including a switch from adult exon 6B towards fetal exon 6A in the cardiac sodium channel, SCN5A."
    explanation: Human heart RNA-seq identifies the SCN5A splice shift.
  - reference: PMID:39126705
    reference_title: "Rescue of Scn5a mis-splicing does not improve the structural and functional heart defects of a DM1 heart mouse model."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that correction Scn5a mis-splicing does not improve the DM1 heart conduction delays and structural changes induced by CUG repeat RNA expression."
    explanation: >-
      Refutes the sufficiency of this branch, not its existence. Mice
      engineered to lack Scn5a exon 6A, and so locked onto the adult exon 6B
      isoform, were crossed into the CUG960 DM1 heart model and showed no
      improvement in conduction delay or structural change. The splice shift is
      real and contributes, but correcting it alone rescues nothing.
  downstream:
  - target: Cardiac Conduction Defects
    causal_link_type: DIRECT
    description: >-
      Reduced excitability of the fetal SCN5A/Nav1.5 isoform contributes to
      conduction delay and arrhythmia, but is not sufficient for the DM1 cardiac
      phenotype: forcing the adult isoform in a DM1 heart model does not correct
      conduction delay or structural change.

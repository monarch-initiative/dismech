    description: DMPK/SIX5 locus effects provide a mutation-to-lens opacity path.
- name: Splicing-Independent Progressive Cardiac Pathology
  biological_scale: TISSUE
  description: >
    Cardiac disease in DM1 worsens over time through a route that does not run
    through the MBNL-dependent spliceopathy. In an inducible heart-specific
    model expressing a stable, interrupted 960-CUG-repeat RNA — a design that
    holds repeat length fixed and so excludes somatic expansion — sustained
    expression produced progressive cardiac enlargement, contractile
    dysfunction, conduction delay, myocardial fibrosis, and reduced survival
    while MBNL-dependent splicing defects stayed static. Suppressing the
    transgene rescued the cardiac abnormalities, but reversibility fell with
    longer exposure, implying a component that accumulates rather than simply
    tracking the current RNA burden. The intermediate steps between persistent
    nuclear CUG RNA and fibrotic and contractile failure are not identified.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:41855125
    reference_title: "Progressive cardiac phenotypes and reduced reversibility from long-term CUGexp RNA expression in a DM1 mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sustained CUGexp RNA expression caused progressive cardiac enlargement, contractile dysfunction, conduction delay, myocardial fibrosis, and reduced survival, while MBNL-dependent splicing defects remained static, consistent with the stable repeat length."
    explanation: >-
      Dissociates cardiac progression from both spliceopathy severity and
      somatic repeat expansion, since repeat length is fixed by the transgene
      and the splicing readouts do not move while the phenotype worsens.
  - reference: PMID:41855125
    reference_title: "Progressive cardiac phenotypes and reduced reversibility from long-term CUGexp RNA expression in a DM1 mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Suppression of CUGexp RNA expression rescued cardiac abnormalities, but reversibility declined with longer exposure to the toxic RNA."
    explanation: >-
      Establishes that the branch is driven by ongoing CUG RNA expression and
      is reversible early, while the loss of reversibility with duration is what
      marks it as progressive rather than a steady-state deficit.
  - reference: PMID:39126705
    reference_title: "Rescue of Scn5a mis-splicing does not improve the structural and functional heart defects of a DM1 heart mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that correction Scn5a mis-splicing does not improve the DM1 heart conduction delays and structural changes induced by CUG repeat RNA expression."
    explanation: >-
      The complementary argument for this node: the best-characterized cardiac
      splicing defect can be fully corrected without benefit, so a
      splicing-independent arm is required to account for the phenotype.
  downstream:
  - target: Cardiac Conduction Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progressive structural remodeling and myocardial fibrosis accompany
      conduction delay in this model; the intermediate steps from persistent CUG
      RNA to remodeling are unidentified.
- name: Satellite Cell Premature Senescence
  biological_scale: CELLULAR
  description: >
    DM1 muscle precursor cells carrying large CTG expansions stop dividing early
    not because they have used up their replicative capacity but because they
    enter premature senescence. p16 accumulates abnormally, and abolishing p16
    activity overcomes the early growth arrest and restores extended
    proliferation; accelerated telomere shortening, which is also present, does
    not account for the p16 induction. Because the reserve is arrested rather
    than exhausted, this is a candidate contributor to impaired regeneration and
    atrophy in large-expansion DM1 that is separable from the spliceopathy.
  cell_types:
  - preferred_term: skeletal muscle satellite cell
    term:
      id: CL:0000594
      label: skeletal muscle satellite cell
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:19246640
    reference_title: "Large CTG repeats trigger p16-dependent premature senescence in myotonic dystrophy type 1 muscle precursor cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that an abnormal accumulation of p16 is responsible for this defect because the abolition of p16 activity overcomes early growth arrest and restores an extended proliferative capacity."
    explanation: >-
      The p16 removal experiment is what makes this causal rather than
      correlative in cultured DM1 muscle precursor cells. The upstream link from
      the expanded repeat to p16 accumulation is described only as a cellular
      stress and remains uncharacterized, and the connection to muscle wasting
      in vivo is proposed rather than shown.
  downstream:
  - target: Progressive Muscle Weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Arrest of the satellite cell reserve is proposed to impair regeneration after fiber damage, but the in vivo step has not been demonstrated in DM1 muscle.
    description: Premature senescence of the muscle precursor pool is a candidate contributor to the progressive wasting and atrophy of large-expansion DM1.
- name: dsRNA-Triggered Innate Immune Activation in Lens
  biological_scale: TISSUE
  description: >
    Transcription of the expanded repeat produces double-stranded RNA in DM
    cells, and lens tissue from DM1 and DM2 cataracts carries a shared
    transcriptional signature dominated by interferon-regulated genes and
    dsRNA-response genes, with 83 percent of dysregulated genes common to the
    two diseases. This is a candidate lens mechanism sitting outside the
    MBNL1/CELF1 splicing axis. It is an expression association in surgical
    specimens: no perturbation was performed, there is no MBNL1 comparison arm,
    and the signature has not been shown to precede or cause opacity, so its
    weight relative to the SIX5 locus branch is unresolved.

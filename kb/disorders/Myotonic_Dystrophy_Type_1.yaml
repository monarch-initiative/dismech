discussions:
- discussion_id: dm1_nonsplicing_cardiac_progression
  prompt: >-
    What carries DM1 cardiac disease forward when repeat length is fixed and
    MBNL-dependent splicing is static — and can any splicing-directed therapy
    halt it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Splicing-Independent Progressive Cardiac Pathology
  - pathophysiology#SCN5A Splicing Shift and Cardiac Excitability Loss
  - phenotypes#Cardiac Conduction Defects
  rationale: >-
    Cardiac disease is a leading cause of death in DM1, and two independent
    mouse results say the splicing account of it is incomplete. Correcting the
    best-characterized cardiac splicing defect rescues nothing, and a
    repeat-length-stable model progresses to fibrosis, contractile failure, and
    death with splicing readouts unchanged. Whatever mediates that progression
    is unidentified, which means the current generation of splicing-directed and
    repeat-directed therapies has no established mechanism of action against the
    phenotype that kills patients. Candidate intermediates raised but not tested
    include reduced SCN5A expression as distinct from mis-splicing, fibrotic
    signaling, and cumulative cardiomyocyte loss.
  proposed_experiments:
  - experiment_id: dm1_cardiac_multiplex_splice_correction
    name: Multiplex cardiac splice correction versus total CUG RNA reduction
    description: >-
      In a DM1 heart model, correct the top cardiac MBNL-dependent splicing
      events together using multiplexed splice-switching oligonucleotides, and
      compare against DMPK knockdown that removes the CUG RNA itself. Read out
      conduction, chamber dimensions, contractile function, fibrosis, and
      survival, stratified by duration of prior CUG RNA exposure.
    would_support:
    - pathophysiology#Splicing-Independent Progressive Cardiac Pathology
    would_refute:
    - pathophysiology#SCN5A Splicing Shift and Cardiac Excitability Loss
    supporting_outcome:
    - >-
        Comprehensive splicing correction leaves fibrosis, remodeling, and
        survival substantially worse than CUG RNA removal does, showing a
        splicing-independent arm carries the progressive phenotype.
    refuting_outcome:
    - >-
        Multiplex splicing correction matches CUG RNA removal on every cardiac
        endpoint, showing that the cardiac phenotype is after all the sum of
        MBNL-dependent splicing defects and that the single-target rescue failure
        only reflected the insufficiency of correcting SCN5A alone.
  evidence:
  - reference: PMID:39126705
    reference_title: "Rescue of Scn5a mis-splicing does not improve the structural and functional heart defects of a DM1 heart mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed that correction Scn5a mis-splicing does not improve the DM1 heart conduction delays and structural changes induced by CUG repeat RNA expression."
    explanation: Establishes that the gap is real by showing a complete single-target splicing rescue with no cardiac benefit.
  - reference: PMID:41855125
    reference_title: "Progressive cardiac phenotypes and reduced reversibility from long-term CUGexp RNA expression in a DM1 mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sustained CUGexp RNA expression caused progressive cardiac enlargement, contractile dysfunction, conduction delay, myocardial fibrosis, and reduced survival, while MBNL-dependent splicing defects remained static, consistent with the stable repeat length."
    explanation: Separates cardiac progression from both spliceopathy severity and somatic expansion, leaving the mediating step unaccounted for.
- discussion_id: dm1_cataract_mechanism_hierarchy
  prompt: >-
    In the DM1 lens, how much of cataract formation is MBNL1-dependent
    spliceopathy, how much is SIX5 dosage acting through SK3, and how much is
    dsRNA-triggered innate immune activation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#dsRNA-Triggered Innate Immune Activation in Lens
  - pathophysiology#SIX5/DMPK Locus Effects in Lens
  - phenotypes#Cataracts
  rationale: >-
    Cataract is near-universal in DM1 and the entry now carries two candidate
    lens mechanisms that are neither ranked nor mutually exclusive, alongside
    the splicing axis that explains the rest of the disease. Each rests on
    evidence of a different kind and none is decisive: the SIX5 branch has a
    mouse dosage series plus human lens cell lines in which SIX5 is measured but
    not manipulated, and the innate-immune branch has an expression signature in
    surgical specimens with no perturbation and no MBNL1 comparison arm. Because
    the lens is accessible and both DM1 and DM2 share the immune signature, this
    is an unusually tractable place to test whether repeat-RNA diseases have one
    mechanism hierarchy or tissue-specific ones.
  proposed_experiments:
  - experiment_id: dm1_lens_mechanism_decomposition
    name: Selective restoration and blockade in DM1 lens models
    description: >-
      In DM1 lens organoids or conditional knockout mice, run four arms:
      restore MBNL1 alone, restore SIX5 alone, block interferon signaling alone,
      and combine all three. Read out lens epithelial cell density, viability
      under calcium challenge, the interferon-regulated gene signature, and
      transparency.
    would_support:
    - pathophysiology#dsRNA-Triggered Innate Immune Activation in Lens
    would_refute:
    - pathophysiology#SIX5/DMPK Locus Effects in Lens
    supporting_outcome:
    - >-
        Interferon blockade alone preserves epithelial cell density and
        transparency to a degree that SIX5 restoration does not, establishing the
        innate-immune arm as the dominant lens mechanism.
    refuting_outcome:
    - >-
        SIX5 restoration alone rescues transparency while interferon blockade
        leaves it unchanged, showing the immune signature is a bystander
        consequence rather than a cataract mechanism.
  evidence:
  - reference: PMID:22062891
    reference_title: "Activation of the innate immune response and interferon signalling in myotonic dystrophy type 1 and type 2 cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high proportion, 83% in DM1 and 75% in DM2, of the significantly disregulated genes were shared by both forms of the disease, suggesting a common mechanism."
    explanation: >-
      The DM1/DM2 overlap is what makes the innate-immune branch a candidate
      independent of the DMPK locus, and so a genuine competitor to the SIX5
      explanation rather than a restatement of it.
  - reference: PMID:17101631
    reference_title: "Increased SK3 expression in DM1 lens cells leads to impaired growth through a greater calcium-induced fragility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Since both the hyper-stimulation of K(+) efflux and cell death were reduced by the highly specific SK inhibitor apamin, we suggest that increased expression of SK3 has a critical role in the increased Ca(2+)-induced fragility in DM1 cells."
    explanation: >-
      Gives the competing branch a pharmacologically demonstrated effector in
      human DM1 lens cells, which is why the relative contributions cannot be
      settled from the existing data.
- discussion_id: dm1_congenital_multigene_dosage_fidelity
  prompt: >-
    Does congenital DM1 in humans arise through reduced dosage of DMPK, SIX5,
    MBNL1, and DMWD together, as the mouse multigene heterozygote model implies,
    or does the mouse model reach the same phenotype by a route the single
    expanded human allele does not take?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#DMPK CTG Repeat Expansion
  - pathophysiology#SIX5/DMPK Locus Effects in Lens
  rationale: >-
    The mouse genetics are clean: triple heterozygous Dmpk, Six5 and Mbnl1
    mutants show adult-onset DM1 phenotypes, and adding Dmwd yields quadruple
    heterozygotes recapitulating much of congenital DM1. But the construct is
    four engineered null alleles, whereas a human congenital DM1 patient has one
    expanded repeat and no null alleles at all. The experiment therefore shows
    that combined dosage reduction is sufficient to produce the phenotype, not
    that it is what happens in patients. The distinction matters for therapy: if
    congenital severity is dosage-driven at neighbouring loci, then removing or
    silencing the toxic RNA would not address it, whereas if it is repeat-driven
    through chromatin change at the locus, it would.
  evidence:
  - reference: PMID:31853004
    reference_title: "Dosage effect of multiple genes accounts for multisystem disorder of myotonic dystrophy type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The triple heterozygous mutant mice exhibit adult-onset DM1 phenotypes. With the additional mutation in Dmwd, the quadruple heterozygous mutant mice recapitulate many major manifestations in congenital DM1."
    explanation: >-
      Records the model result whose translational validity is the open
      question. The authors demonstrate sufficiency of combined dosage reduction
      in mouse; no human congenital DM1 tissue has been shown to reproduce this
      dosage pattern.
- discussion_id: dm1_mbnl1_restoration_threshold
  prompt: >-
    How much MBNL1 activity has to be restored, in each affected tissue, before
    splicing correction translates into clinical benefit?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Splicing Factor Imbalance and Fetal Spliceopathy
  - mechanistic_hypotheses#canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model
  - treatments#DMPK-Targeting Antisense Oligonucleotide (Investigational)
  rationale: >-
    Restoring MBNL1 reverses myotonia and adult splicing in poly(CUG) mice, but
    the experiments that establish this use a single delivered dose and report
    an outcome, not a dose-response curve. No published work defines the
    fraction of normal MBNL1 activity that has to be recovered before a given
    tissue crosses back into a functional range, and the threshold is unlikely
    to be the same in skeletal muscle, heart, lens, and brain. That number is
    the therapeutic window for every approach in this class, and its absence is
    why the phase 1/2a DMPK ASO result — muscle exposure below the level
    predicted to reduce the target — could not be read as either a mechanism
    failure or a dosing failure.
  evidence:
  - reference: PMID:16864772
    reference_title: "Reversal of RNA missplicing and myotonia after muscleblind overexpression in a mouse poly(CUG) model for myotonic dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Myotonia reversal occurs concurrently with restoration of the normal adult-splicing patterns of four pre-mRNAs that are misspliced during postnatal development in DM muscle."
    explanation: >-
      Establishes that restoration works and that splicing correction tracks the
      functional readout, which is what makes the missing quantitative threshold
      the actionable gap rather than the qualitative question.

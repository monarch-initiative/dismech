- name: DMPK-Targeting Antisense Oligonucleotide (Investigational)
  description: >-
    Baliforsen (ISIS 598769) is an antisense oligonucleotide directed at DMPK
    mRNA, intended to lower the toxic CUG-repeat transcript at its source rather
    than treat a downstream symptom. It is investigational, not approved. In the
    completed multicentre, randomised, placebo-controlled phase 1/2a
    dose-escalation trial (NCT02312011, 48 dosed adults across five dose levels)
    it was generally well tolerated, with injection-site reactions, headache,
    contusion, and nausea the common adverse events and one case of transient
    thrombocytopenia. Muscle drug concentration rose with dose but stayed below
    the level predicted to achieve substantial target reduction, so this trial
    established tolerability and exposure without demonstrating target
    engagement. It should therefore not be cited as therapeutic corroboration of
    the RNA-toxicity mechanism; delivery to muscle is the limiting problem.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: DMPK
      term:
        id: hgnc:2933
        label: DMPK
    target_transcript: DMPK mRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baliforsen
  evidence:
  - reference: PMID:36804094
    reference_title: "Antisense oligonucleotide targeting DMPK in patients with myotonic dystrophy type 1: a multicentre, randomised, dose-escalation, placebo-controlled, phase 1/2a trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baliforsen was generally well tolerated. However, skeletal muscle drug concentrations were below levels predicted to achieve substantial target reduction."
    explanation: >-
      The trial's own interpretation, and the reason this entry is worded as
      tolerability without target engagement. Reaching predicted target
      reduction was the pharmacodynamic precondition for testing the mechanism,
      and it was not met.
  target_mechanisms:
  - target: Toxic CUG RNA Nuclear Foci
    treatment_effect: INHIBITS
    description: >-
      The ASO is designed to recruit RNase H1 to DMPK transcripts and reduce the
      nuclear-retained CUG-repeat RNA burden that titrates MBNL1. Whether the
      dosing achieved in this trial reduced that burden in muscle was not
      established.
    evidence:
    - reference: PMID:36804094
      reference_title: "Antisense oligonucleotide targeting DMPK in patients with myotonic dystrophy type 1: a multicentre, randomised, dose-escalation, placebo-controlled, phase 1/2a trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results support the further investigation of ASOs as a therapeutic approach for myotonic dystrophy type 1, but suggest improved drug delivery to muscle is needed."
      explanation: >-
        Supports the target rationale while marking the link as unproven in
        humans: the trialists conclude the approach is worth pursuing and that
        muscle delivery, not target choice, is what needs to improve.

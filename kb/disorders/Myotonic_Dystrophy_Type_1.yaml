mechanistic_hypotheses:
- hypothesis_group_id: canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model
  hypothesis_label: Canonical DMPK CTG Expansion / RNA Toxicity / Splicing Dysregulation Model
  status: CANONICAL
  description: >-
    Myotonic dystrophy type 1 (DM1) is caused by CTG-trinucleotide repeat expansion (>50 repeats; severe
    congenital >1000) in the 3' UTR of DMPK on 19q13.3. Expanded CUG-repeat RNA transcripts form nuclear
    foci that sequester MBNL1 (muscleblind-like 1) splicing factor and induce aberrant upregulation of
    CELF1, producing dysregulated alternative splicing of >100 developmentally regulated transcripts
    (e.g., CLCN1, INSR, SCN5A, BIN1). Mis-splicing reverts adult-tissue isoforms toward embryonic
    patterns, producing myotonia (CLCN1), insulin resistance (INSR), cardiac conduction defects (SCN5A),
    muscle weakness and atrophy, cataracts, frontal balding, hypogonadism, and characteristic CNS
    involvement. CTG repeat instability drives intergenerational anticipation. MBNL transgenic rescue,
    CUG-ASO therapy, and small-molecule MBNL/CELF1 normalizers corroborate the RNA-toxicity / splicing-
    dysregulation axis as the canonical pathogenic mechanism.
  notes: >-
    Retained as CANONICAL with tissue-specific
    qualifications. The 2026 openscientist hypothesis-search
    report
    (kb/hypotheses/Myotonic_Dystrophy_Type_1/canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model)
    finds STRONGLY SUPPORTED. Three independent genetic proofs
    establish the central CUG-RNA / MBNL1-sequestration axis:
    (1) MBNL1 knockout mice recapitulate DM1 phenotypes including
    cardiac pathology and embryonic splice-isoform persistence;
    (2) AAV-mediated MBNL1 overexpression rescues myotonia and
    corrects splicing in poly(CUG) mice; (3) CRISPR-Cas9 deletion
    of expanded CTG repeats eliminates nuclear RNA foci and
    corrects spliceopathy. Global transcriptomics confirm most
    CUG-expansion RNA effects in skeletal muscle are explained
    by reduced MBNL1 activity. Four tissue-specific
    qualifications: (1) cardiac pathology is multifactorial —
    SCN5A mis-splicing rescue does not correct conduction delays
    or structural defects, and prolonged CUG-RNA expression
    drives progressive cardiac disease even when splicing
    defects remain static; (2) cataracts involve dsRNA-triggered
    innate immune activation and SIX5 haploinsufficiency rather
    than pure MBNL1/CELF1 spliceopathy; (3) congenital DM1
    requires a multigene dosage model incorporating DMPK, SIX5,
    MBNL1, and DMWD; (4) the pathogenic landscape extends
    beyond spliceopathy to include miRNA dysregulation, RAN
    translation of toxic homopolymeric peptides (Gln, Ala, Ser),
    disrupted signaling cascades (PKC, GSK-3β, mTOR), satellite
    cell senescence, and bidirectional transcription at the DM1
    locus. CUG-ASO and MBNL/CELF1 normalizer trials remain
    consistent with the canonical RNA-toxicity axis. One
    qualification on that last point: the completed phase 1/2a
    DMPK-targeting ASO trial established tolerability but
    reported skeletal muscle drug concentrations below the level
    predicted to achieve substantial target reduction, so it has
    not yet tested the RNA-toxicity axis therapeutically and
    should not be cited as corroborating it.
  evidence:
  - reference: PMID:31326502
    reference_title: "Molecular genetics of congenital myotonic dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myotonic Dystrophy type 1 (DM1) is a neuromuscular disease showing strong genetic anticipation, and is caused by the expansion of a CTG repeat tract in the 3'-UTR of the DMPK gene."
    explanation: >
      Existing canonical mechanism citation in the dismech
      knowledge base, used as the seed for the hypothesis-search
      deep-research run.
  - reference: PMID:31253581
    reference_title: "Genome Editing of Expanded CTG Repeats within the Human DMPK Gene Reduces Nuclear RNA Foci in the Muscle of DM1 Mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Co-expression of SaCas9 and selected pairs of single-guide RNAs (sgRNAs) in cultured DM1 patient-derived muscle line cells carrying 2,600 CTG repeats resulted in targeted DNA deletion, ribonucleoprotein foci disappearance, and correction of splicing abnormalities in various transcripts."
    explanation: >-
      DNA-level sufficiency test of the canonical axis: excising the expanded
      repeat from the DMPK locus in patient-derived muscle cells abolishes the
      ribonucleoprotein foci and corrects the spliceopathy, so the repeat is the
      upstream cause of both.
  - reference: PMID:16864772
    reference_title: "Reversal of RNA missplicing and myotonia after muscleblind overexpression in a mouse poly(CUG) model for myotonic dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "overexpression of Mbnl1 in vivo mediated by transduction of skeletal muscle with a recombinant adeno-associated viral vector rescues disease-associated muscle hyperexcitability, or myotonia, in the HSA(LR) poly(CUG) mouse model for DM"
    explanation: >-
      The gain-of-function half of the bidirectional genetic proof: restoring
      MBNL1 in the presence of an unchanged CUG-repeat burden reverses myotonia
      and adult splicing patterns, which places MBNL1 titration on the causal
      path rather than beside it.
pathophysiology:
- name: DMPK CTG Repeat Expansion
  description: >
    DM1 begins with an unstable CTG trinucleotide repeat expansion in the
    3'-untranslated region of DMPK. The repeat-expansion allele is germline,
    autosomal dominant, and becomes more unstable across generations and across
    tissues, providing the initiating mutation for downstream RNA toxicity.
  genes:
  - preferred_term: DMPK
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:31326502
    reference_title: "Molecular genetics of congenital myotonic dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myotonic Dystrophy type 1 (DM1) is a neuromuscular disease showing strong genetic anticipation, and is caused by the expansion of a CTG repeat tract in the 3'-UTR of the DMPK gene."
    explanation: Establishes the causal repeat expansion and anticipation.
  - reference: PMID:15065017
    reference_title: "Myotonic dystrophy: RNA pathogenesis comes into focus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In 1992, the mutation responsible for DM1 was identified as a CTG expansion located in the 3' untranslated region of the dystrophia myotonica-protein kinase gene (DMPK)."
    explanation: Review-level evidence confirms the initiating DMPK 3'-UTR CTG expansion.
  downstream:
  - target: Somatic CTG Repeat Expansion (DMPK)
    causal_link_type: DIRECT
    description: The germline expanded allele is further expanded somatically across the lifespan and across tissues by aberrant mismatch repair.
  - target: Toxic CUG RNA Nuclear Foci
    causal_link_type: DIRECT
    description: The expanded DMPK allele is transcribed into CUG repeat-containing RNA that accumulates in nuclear foci.
  - target: SIX5/DMPK Locus Effects in Lens
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeat expansion near SIX5 may alter local chromatin and SIX5 transcription.
    description: The repeat expansion sits adjacent to SIX5, supporting a parallel locus-dosage branch for cataract susceptibility.
- name: Somatic CTG Repeat Expansion (DMPK)
  conforms_to: "mismatch_repair_driven_repeat_instability#Somatic Repeat Expansion in Post-Mitotic Cells"
  biological_scale: TISSUE
  description: >
    Beyond the inherited germline expansion, the DMPK CTG repeat continues to
    expand somatically throughout life, driven by aberrant DNA mismatch repair
    (the MutSβ/MSH3 complex licenses expansion; FAN1 is protective). Somatic
    expansion is progressive with age and tissue-specific — largest in the most
    clinically affected tissues such as skeletal muscle — and its rate, set by the
    expression balance of DNA-repair modifiers, tracks disease severity and age of
    onset. This ongoing somatic expansion continually raises the expanded-CUG RNA
    burden that drives the downstream RNA-toxicity cascade.
  genes:
  - preferred_term: DMPK
    term:
      id: hgnc:2933
      label: DMPK
  - preferred_term: MSH3
    term:
      id: hgnc:7326
      label: MSH3
  - preferred_term: FAN1
    term:
      id: hgnc:29170
      label: FAN1
  biological_processes:
  - preferred_term: mismatch repair
    term:
      id: GO:0006298
      label: mismatch repair
    modifier: DYSREGULATED
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:11809728
    reference_title: >-
      Somatic expansion behaviour of the (CTG)n repeat in myotonic dystrophy
      knock-in mice is differentially affected by Msh3 and Msh6 mismatch-repair
      proteins.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Introducing the (CTG)84 allele into an Msh3-deficient background completely blocked the somatic repeat instability."
    explanation: >-
      DM1 knock-in mice show that Msh3 (the MutSβ partner) is required for all
      somatic CTG expansion — the CTG-class instance of the module's aberrant-MMR
      mechanism.
  - reference: PMID:42419013
    reference_title: >-
      Tissue-specific CTG•CAG expansion rate and disease severity are modified by
      DNA repair genes expression levels in myotonic dystrophy type 1 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher FAN1 expression was associated with reduced somatic expansion and later onset."
    explanation: >-
      In DM1 patients the DNA-repair modifier FAN1 is protective — higher
      expression means less somatic expansion and later onset — mirroring the
      module's FAN1-protective arm and the somatic-expansion→onset link.
  downstream:
  - target: Toxic CUG RNA Nuclear Foci
    causal_link_type: DIRECT
    description: >
      Ongoing somatic CTG expansion increases the expanded-CUG RNA burden that
      accumulates in nuclear foci, intensifying the RNA-toxicity cascade.
- name: Toxic CUG RNA Nuclear Foci
  description: >
    The expanded DMPK repeat is transcribed into CUG repeat-containing RNA that
    is retained in the nucleus and recruits RNA-binding proteins that normally
    regulate adult splicing programs. Nuclear retention, rather than the
    higher-order focus itself, is the toxic state: quantitative imaging in
    patient-derived myotubes shows that most objects scored as "foci" are single
    RNA molecules, and that these individual nuclear-retained transcripts
    titrate MBNL1. Multimeric foci arise from transcriptional bursting,
    dissociate over time, and depend on MBNL proteins for their own assembly, so
    they are better read as a marker of the retained-RNA burden than as the
    pathogenic species.

name: Erythrokeratodermia Variabilis
creation_date: '2026-04-14T05:27:49Z'
category: Mendelian
description: >-
  Erythrokeratodermia variabilis (EKV), also called erythrokeratodermia
  variabilis et progressiva (EKVP) or Mendes da Costa disease, is a rare
  connexin-associated disorder of cornification. The disease is defined by
  transient figurate erythematous patches together with fixed hyperkeratotic
  plaques, often begins at birth or during infancy, and may be accompanied by
  palmoplantar keratoderma. Most reported families show autosomal dominant
  inheritance with incomplete penetrance, although recessive transmission has
  also been described. The disease root is subdivided into a numbered EKVP
  series, and only its first three members are connexinopathies: GJB3 (EKVP1),
  GJB4 (EKVP2) and GJA1 (EKVP3) encode epidermal connexins whose dysfunction
  perturbs keratinocyte gap-junction communication and epidermal homeostasis.
  The remaining four subtypes are not connexin diseases. KDSR (EKVP4) is an
  enzyme of the ceramide synthesis pathway, KRT83 (EKVP5) a hair keratin
  allelic with dominant monilethrix, TRPM4 (EKVP6) a calcium-activated cation
  channel acting by gain of function, and PERP (EKVP7) a desmosomal component
  that also causes Olmsted syndrome through a different allele class. The first
  three of those four were reported as progressive symmetric erythrokeratoderma
  and PERP as widespread erythrokeratoderma, so a reader looking for the classic
  Mendes da Costa picture of migratory patches should read EKVP1 to EKVP3. All
  seven converge on abnormal epidermal homeostasis and keratinization.
synonyms:
- erythrokeratodermia variabilis et progressiva
- Mendes da Costa disease

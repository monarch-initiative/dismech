  MONDO:0033010, EKVP2 MONDO:0033012, EKVP3 MONDO:0033013, EKVP4
  MONDO:0033014, EKVP5 MONDO:0033015, EKVP6 MONDO:0032801, EKVP7
  MONDO:0030941. Every one of these is a hierarchical descendant of
  MONDO:0017851 and carries exactly one RO:0004003 gene edge, read from OLS4 in
  September 2026.

  The series is lumped here rather than split into seven entries because MONDO
  files all seven under this root and because all seven converge on the same
  terminal node. That said, the split within it is real and is recorded in each
  subtype's description: EKVP1 to EKVP3 are connexin gap-junction diseases with
  the migratory-patch picture, while EKVP4 to EKVP7 are non-connexin - three of
  them reported as progressive symmetric erythrokeratoderma and PERP as
  widespread erythrokeratoderma. A reader looking for classic Mendes da Costa
  disease should read EKVP1 to EKVP3.

  The published distinction between GJA1-related EKV skin disease and
  oculodentodigital dysplasia is preserved, as is the parallel case of PERP,
  where a C-terminal heterozygous truncation causes Olmsted syndrome rather
  than erythrokeratoderma.

  MONDO:0018853 transgrediens et progrediens palmoplantar keratoderma is the
  eighth hierarchical descendant of this root. It carries no RO:0004003 gene
  edge and no numbered EKVP identity, so it is outside the gene-defined series
  this entry models and is not curated here.

  Orphanet could not be consulted for this entry: references_cache holds no
  ORPHA record for erythrokeratodermia variabilis, and populating one requires
  the gitignored Orphadata bulk XML. The StatPearls chapter (PMID:31082124,
  NBK541080) is listed in the references block for orientation but is not used
  as evidence anywhere in this entry: StatPearls is a point-of-care reference
  and is never a curation baseline in this repository. No GeneReviews chapter
  exists for this disease, confirmed against the committed Bookshelf index via
  just check-genereviews.

      id: hgnc:4285
      label: GJB3
  evidence:
  - reference: PMID:9843209
    reference_title: "Mutations in the human connexin gene GJB3 cause erythrokeratodermia variabilis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected heterozygous missense mutations in GJB3 in four EKV families"
    explanation: >-
      Establishes GJB3 as the gene of the first numbered EKVP subtype in four
      independent families.
- name: EKVP2
  display_name: EKVP2 (GJB4 / connexin 30.3)
  classification: gene
  description: >-
    Connexin-30.3 form, found by sequencing GJB4 in EKV families without a
    detectable GJB3 mutation. Two GJB4 mutations were associated with rapidly
    changing erythematous patches with prominent, circinate or gyrate borders
    in affected children but not in adults.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 2
    term:
      id: MONDO:0033012
      label: erythrokeratodermia variabilis et progressiva 2
  genes:
  - preferred_term: GJB4
    term:
      id: hgnc:4286
      label: GJB4
  evidence:
  - reference: PMID:12648223
    reference_title: "Genetic heterogeneity in erythrokeratodermia variabilis: novel mutations in the connexin gene GJB4 (Cx30.3) and genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed six distinct missense mutations in five families and a sporadic case of erythrokeratodermia variabilis, all of which were not found in controls."
    explanation: >-
      Establishes GJB4 as a second connexin gene of the EKVP series in families
      screened because they carried no GJB3 mutation.
  - reference: PMID:12648223
    reference_title: "Genetic heterogeneity in erythrokeratodermia variabilis: novel mutations in the connexin gene GJB4 (Cx30.3) and genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two mutations (T85P, F137L) were associated with the occurrence of rapidly changing erythematous patches with prominent, circinate, or gyrate borders in affected children but not in adults, supporting the notion that this feature is specific to Cx30.3 defects."
    explanation: >-
      Source for the circinate-border feature stated in this subtype's
      description, including that it was seen in children and not adults.
- name: EKVP3
  display_name: EKVP3 (GJA1 / connexin 43)
  classification: gene
  description: >-
    Connexin-43 form, caused by de novo dominant GJA1 missense mutations. The
    skin disease is reported as distinct from the limited cutaneous findings
    rarely seen in oculodentodigital dysplasia, which dominant GJA1 mutations
    also cause.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 3
    term:
      id: MONDO:0033013
      label: erythrokeratodermia variabilis et progressiva 3
  genes:
  - preferred_term: GJA1
    term:
      id: hgnc:4274
      label: GJA1
  evidence:
  - reference: PMID:25398053
    reference_title: "Dominant De Novo Mutations in GJA1 Cause Erythrokeratodermia Variabilis et Progressiva, without Features of Oculodentodigital Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using exome sequencing, we show that de novo missense mutations in GJA1 (gap junction protein alpha 1) cause EKVP."
    explanation: >-
      Establishes GJA1 as the third connexin gene of the EKVP series.
- name: EKVP4
  display_name: EKVP4 (KDSR-related, recessive)
  classification: gene
  description: >-
    Recessive ceramide-synthesis form caused by biallelic KDSR mutations. The
    reported phenotype sits in the progressive symmetric erythrokeratoderma
    spectrum rather than the migratory-patch picture of the connexin subtypes:
    severe lesions of thick scaly skin on the face and genitals, and
    thickened, red and scaly skin on the hands and feet. Systemic isotretinoin
    achieved nearly complete resolution in the two probands in whom it was
    applied.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 4
    term:
      id: MONDO:0033014
      label: erythrokeratodermia variabilis et progressiva 4
  genes:
  - preferred_term: KDSR
    term:
      id: hgnc:4021
      label: KDSR
  evidence:
  - reference: PMID:28575652
    reference_title: "Mutations in KDSR Cause Recessive Progressive Symmetric Erythrokeratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that mutations in KDSR (3-ketodihydrosphingosine reductase), encoding an enzyme in the ceramide synthesis pathway, lead to a previously undescribed recessive Mendelian disorder in the progressive symmetric erythrokeratoderma spectrum"
    explanation: >-
      Establishes biallelic KDSR mutation as a recessive cause in the
      erythrokeratoderma spectrum, and names the affected enzymatic step.
  - reference: PMID:28575652
    reference_title: "Mutations in KDSR Cause Recessive Progressive Symmetric Erythrokeratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is characterized by severe lesions of thick scaly skin on the face and genitals and thickened, red, and scaly skin on the hands and feet."
    explanation: >-
      Source for the lesion distribution given in this subtype's description.
  - reference: PMID:28575652
    reference_title: "Mutations in KDSR Cause Recessive Progressive Symmetric Erythrokeratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic isotretinoin therapy has achieved nearly complete resolution in the two probands in whom it has been applied, consistent with the effects of retinoic acid on alternative pathways for ceramide generation."
    explanation: >-
      Source for the isotretinoin response noted in this subtype's description,
      including how many probands were treated.
- name: EKVP5
  display_name: EKVP5 (KRT83-related, recessive)
  classification: gene
  description: >-
    Recessive form attributed to a homozygous KRT83 frameshift deletion in one
    large Pakistani kindred, presenting as progressive symmetric
    erythrokeratoderma. KRT83 is a hair keratin, and heterozygous KRT83
    missense substitutions cause dominant monilethrix, so the two diseases are
    reported as allelic.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 5
    term:
      id: MONDO:0033015
      label: erythrokeratodermia variabilis et progressiva 5
  genes:
  - preferred_term: KRT83
    term:
      id: hgnc:6460
      label: KRT83
  evidence:
  - reference: PMID:27965375
    reference_title: "Recessive progressive symmetric erythrokeratoderma results from a homozygous loss-of-function mutation of KRT83 and is allelic with dominant monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autozygosity mapping and exome sequencing identified a homozygous frameshift deletion (c.811delA; p.Ser271fs) in KRT83, which co-segregated with the PSEK phenotype in the family and which is expected to abolish keratin 83, a type II keratin of hair and skin."
    explanation: >-
      The single reported kindred establishing KRT83 as a recessive
      erythrokeratoderma gene, and the basis for calling the allele a predicted
      null rather than a demonstrated one.
  - reference: PMID:27965375
    reference_title: "Recessive progressive symmetric erythrokeratoderma results from a homozygous loss-of-function mutation of KRT83 and is allelic with dominant monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that at least some cases of autosomal recessive PSEK and autosomal dominant monilethrix are allelic, respectively resulting from loss-of-function and missense mutations in the KRT83 gene."
    explanation: >-
      Source for the allelism with monilethrix stated in this subtype's
      description.
- name: EKVP6
  display_name: EKVP6 (TRPM4-related, dominant)
  classification: gene
  description: >-
    Dominant channelopathy form. Two missense mutations in the S6 transmembrane
    domain of TRPM4, found in three separate families with progressive
    symmetric erythrokeratodermia, make the channel hyperactive rather than
    abolishing it, so this is the one EKVP subtype whose reported mechanism is
    a gain of function.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 6
    term:
      id: MONDO:0032801
      label: erythrokeratodermia variabilis et progressiva 6
  genes:
  - preferred_term: TRPM4
    term:
      id: hgnc:17993
      label: TRPM4
  evidence:
  - reference: PMID:30528822
    reference_title: "Gain-of-Function Mutations in TRPM4 Activation Gate Cause Progressive Symmetric Erythrokeratodermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three separate families with progressive symmetric erythrokeratodermia, we identified two missense mutations (c.3099C>G and c.3119T>C) that produce p.Ile1033Met and p.Ile1040Thr, both of which are located in the S6 transmembrane domain of the TRPM4 protein."
    explanation: >-
      Establishes TRPM4 as an EKVP-series gene, gives the number of families,
      and locates both alleles in the S6 domain as this description states.
- name: EKVP7
  display_name: EKVP7 (PERP-related, recessive)
  classification: gene
  description: >-
    Recessive desmosomal form. Homozygosity for an N-terminal PERP truncation
    ablates expression and causes widespread erythrokeratoderma. The same gene
    causes Olmsted syndrome when a C-terminal truncation is heterozygous, and
    the reporting authors propose that the two PERP diseases have distinct
    pathobiology rather than differing only in severity.
  subtype_term:
    preferred_term: erythrokeratodermia variabilis et progressiva 7
    term:
      id: MONDO:0030941
      label: erythrokeratodermia variabilis et progressiva 7
  genes:
  - preferred_term: PERP
    term:
      id: hgnc:17637
      label: PERP
  evidence:
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for an N-terminal truncation ablates expression and causes widespread erythrokeratoderma, with expansion of epidermal differentiation markers."
    explanation: >-
      Establishes biallelic PERP loss of expression as a cause of widespread
      erythrokeratoderma, which is the EKVP7 phenotype.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for a C-terminal truncation, which produces a protein that appears to be unstably incorporated into desmosomes, causes Olmsted syndrome with severe periorificial and palmoplantar keratoderma in multiple unrelated kindreds."
    explanation: >-
      Source for the statement that a different PERP allele class causes Olmsted
      syndrome, which is why EKVP7 is not the only PERP disease.

environmental:
- name: Psychological Stress
  exposure_term:
    preferred_term: psychological stress
    term:
      id: XCO:0001265
      label: stress
  notes: Major trigger for symptoms
  evidence:
  - reference: PMID:25339801
    reference_title: "Impact of psychological stress on irritable bowel syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cause symptom flare-ups or exaggeration in IBS"
    explanation: "Review of the stress-IBS relationship, attributing flares to stress-induced neuro-endocrine-immune changes acting on the gut-brain axis. OTHER because the quoted sentence is a mechanistic synthesis rather than a reported measurement."
- name: Dietary Triggers
  notes: FODMAPs, gluten in some patients
  evidence:
  - reference: PMID:28846594
    reference_title: "Low-FODMAP Diet Improves Irritable Bowel Syndrome Symptoms: A Meta-Analysis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the patients receiving a low-FODMAP diet experienced a statistically significant pain and bloating reduction compared with those receiving a traditional diet"
    explanation: "Meta-analysis of randomized trials supporting the FODMAP half of this annotation. PARTIAL: the gluten claim is not evidenced here, and the review notes it remains undemonstrated whether a low-FODMAP diet beats conventional IBS diets long term."
- name: Gastroenteritis
  notes: Post-infectious IBS
  evidence:
  - reference: PMID:22024145
    reference_title: "The incidence and risk factors of post-infectious irritable bowel syndrome: a meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The odds of developing IBS are increased after acute gastrointestinal infection"
    explanation: "Meta-analysis of ten studies giving a pooled OR of 6.03 for IBS after acute gastroenteritis, the post-infectious mechanism this annotation names."
- name: Antibiotics
  notes: Associated with increased IBS risk (IRR 1.3), especially after
    gastrointestinal infection; microbiome disruption is the proposed mechanism
  evidence:
  - reference: PMID:41860116
    reference_title: "Antibiotic Use During Gastrointestinal Infections Increases the Risk of Developing Irritable Bowel Syndrome: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotic use is associated with increased risk of developing IBS, especially after gastrointestinal infections"
    explanation: "Meta-analysis of 31 studies (422,350 patients), IRR 1.3. PARTIAL, and the note was rewritten: the meta-analysis measures risk, not the microbiome mechanism the note previously asserted, and its authors flag heterogeneity above 90% as limiting the result."
- name: Early Life Stress
  exposure_term:
    preferred_term: psychological stress
    term:
      id: XCO:0001265
      label: stress
  notes: May predispose to IBS
  evidence:
  - reference: PMID:38783444
    reference_title: "Evaluating the association of childhood sexual abuse with the development of irritable bowel syndrome later in life: A systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratio, indicating the association between childhood sexual abuse and irritable bowel syndrome, was 1.87"
    explanation: "Systematic review of 7 studies (3,156 subjects) for one specific early-life exposure."
  - reference: PMID:35086857
    reference_title: "Meta-analysis and systematic review of the association between adverse childhood events and irritable bowel syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "found the association between ACEs and IBS to be uncertain given the considerable heterogeneity"
    explanation: "Deliberately paired with the citation above: across 15 studies and 272,686 participants the broader adverse-childhood-experience association is uncertain, with I2 = 93.58% and significant publication bias. This is why the annotation says 'may predispose' rather than asserting the link."
treatments:
- name: Dietary Modification
  description: Low FODMAP diet effective in many patients.
  evidence:
  - reference: PMID:24076059
    reference_title: "A diet low in FODMAPs reduces symptoms of irritable bowel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a controlled, cross-over study of patients with IBS, a diet low
      in FODMAPs effectively reduced functional gastrointestinal symptoms."
    explanation: Randomized cross-over trial evidence that a low-FODMAP diet reduces
      IBS symptoms, supporting it as a first-line dietary intervention.
- name: Soluble Fiber (Psyllium)
  description: >-
    Supplementation with soluble fiber (psyllium/ispaghula husk) as a first-line
    treatment to improve global symptoms and abdominal pain in IBS. Unlike
    insoluble fiber (bran), soluble psyllium provides adequate symptom relief and
    is recommended by guidelines as a bulking agent for IBS.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:19713235
    reference_title: "Soluble or insoluble fibre in irritable bowel syndrome in primary
      care? Randomised placebo controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psyllium offers benefits in patients with irritable bowel syndrome
      in primary care."
    explanation: Primary-care randomised controlled trial showing that soluble fiber
      (psyllium), unlike insoluble bran, gives adequate symptom relief in adult IBS.
  - reference: PPR:PPR1275071
    reference_title: "Randomized Placebo-Controlled Trial of Psyllium Fiber in Functional
      Abdominal Pain Disorders in Children"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 12-week trial of psyllium fiber improves pain in most and gives sustained
      relief in three-fourths of children with FAP-NOS and IBS."
    explanation: >-
      Pediatric randomised placebo-controlled trial (non-peer-reviewed preprint;
      corroborating the adult primary-care RCT) reporting that psyllium fiber
      improves and sustains pain relief in children with IBS and functional
      abdominal pain.
- name: Antispasmodics
  description: Dicyclomine, hyoscyamine for pain and cramping.
  evidence:
  - reference: PMID:40307155
    reference_title: "Pharmacologic treatment of irritable bowel syndrome. Position statement of the Asociación Mexicana de Gastroenterología, 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Antispasmodics (alone or combined) are used as first-line therapy for pain management, whereas antidiarrheals, such as loperamide, are used for reducing diarrhea in diarrhea-predominant IBS (IBS-D) and laxatives are used for constipation in constipation-predominant IBS (IBS-C)."
    explanation: The guideline positions antispasmodics, alone or combined, as first-line therapy for pain management in irritable bowel syndrome.
- name: Loperamide
  description: For diarrhea-predominant IBS.
  evidence:
  - reference: PMID:40307155
    reference_title: "Pharmacologic treatment of irritable bowel syndrome. Position statement of the Asociación Mexicana de Gastroenterología, 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Antispasmodics (alone or combined) are used as first-line therapy for pain management, whereas antidiarrheals, such as loperamide, are used for reducing diarrhea in diarrhea-predominant IBS (IBS-D) and laxatives are used for constipation in constipation-predominant IBS (IBS-C)."
    explanation: The guideline positions antidiarrheals such as loperamide as therapy for reducing diarrhea in diarrhea-predominant IBS.
- name: Linaclotide
  description: Guanylate cyclase agonist for IBS-C.
  evidence:
  - reference: PMID:22986437
    reference_title: "Linaclotide for irritable bowel syndrome with constipation: a 26-week,
      randomized, double-blind, placebo-controlled trial to evaluate efficacy and safety."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linaclotide 290 μg once daily significantly improved abdominal and
      bowel symptoms associated with IBS-C over 26 weeks of treatment."
    explanation: Phase 3 RCT demonstrating linaclotide efficacy for abdominal and
      bowel symptoms in IBS-C.
- name: Rifaximin
  description: Non-absorbable antibiotic for IBS-D with bloating.
  evidence:
  - reference: PMID:21208106
    reference_title: "Rifaximin therapy for patients with irritable bowel syndrome without constipation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients who had IBS without constipation, treatment with
      rifaximin for 2 weeks provided significant relief of IBS symptoms, bloating,
      abdominal pain, and loose or watery stools."
    explanation: The TARGET phase 3 trials show the minimally absorbed antibiotic
      rifaximin relieves global IBS symptoms and bloating in non-constipated IBS.
- name: Tricyclic Antidepressants
  description: Low-dose for pain modulation.
  evidence:
  - reference: PMID:24935275
    reference_title: "Effect of antidepressants and psychological therapies, including hypnotherapy,
      in irritable bowel syndrome: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with similar treatment effects for both tricyclic
      antidepressants and selective serotonin reuptake inhibitors."
    explanation: Meta-analysis of RCTs demonstrating that tricyclic antidepressants
      are an effective treatment for IBS.
- name: SSRIs
  description: For patients with comorbid anxiety/depression.
  evidence:
  - reference: PMID:24935275
    reference_title: "Effect of antidepressants and psychological therapies, including hypnotherapy,
      in irritable bowel syndrome: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with similar treatment effects for both tricyclic
      antidepressants and selective serotonin reuptake inhibitors."
    explanation: The same meta-analysis found selective serotonin reuptake inhibitors
      to have treatment effects comparable to tricyclic antidepressants in IBS.
- name: Probiotics
  description: May help some patients.
  evidence:
  - reference: PMID:19091823
    reference_title: "The efficacy of probiotics in the treatment of irritable bowel syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probiotics appear to be efficacious in IBS, but the magnitude of
      benefit and the most effective species and strain are uncertain."
    explanation: Systematic review of RCTs indicating probiotics are efficacious in
      IBS, while the optimal strain remains uncertain.
- name: Antihistamines
  description: >
    H1 receptor antagonists for mast cell-mediated symptoms. Mast cell
    mediators including histamine contribute to visceral hypersensitivity
    and abdominal pain in IBS. Antihistamines are emerging as a
    barrier-restoration strategy targeting mast cell dysfunction.
  evidence:
  - reference: PMID:42413530
    reference_title: "Barrier restoration as a therapeutic strategy for disorders of gut-brain interaction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "novel therapeutics, including antihistamines, mast cell stabilisers,
      protease inhibitors, secretagogues, and guanylate cyclase C agonists"
    explanation: Recent review identifies antihistamines as novel therapeutic
      agents for barrier restoration in disorders of gut-brain interaction.
- name: Mast Cell Stabilizers
  description: >
    Agents that prevent mast cell degranulation and release of mediators
    (histamine, tryptase) that excite visceral sensory neurons. Elevated
    mast cell activation is a key driver of symptoms in a subset of IBS
    patients, making stabilizers a rational barrier-protective approach.
  evidence:

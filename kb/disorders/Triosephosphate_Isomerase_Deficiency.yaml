name: Triosephosphate Isomerase Deficiency
category: Mendelian
creation_date: "2026-07-08T00:00:00Z"
synonyms:
- TPI deficiency
- TPI Df
- TPID
- Triose phosphate-isomerase deficiency
- Hemolytic anemia due to triosephosphate isomerase deficiency
- TPI1-related triosephosphate isomerase deficiency
description: >-
  Triosephosphate isomerase deficiency is an autosomal-recessive multisystem
  glycolytic disorder caused by biallelic pathogenic variants in TPI1. Its
  classical clinical combination is congenital or early-onset chronic hemolytic
  anemia with variably progressive neurologic and neuromuscular dysfunction;
  hypotonia, muscle weakness and wasting, movement abnormalities, recurrent
  infections, respiratory failure, and occasional cardiomyopathy broaden the
  phenotype. The recurrent p.Glu105Asp variant (historically called E104D when
  the initiator methionine was omitted) disrupts dimer stability despite
  retaining near-normal catalytic activity in purified protein. Other alleles
  can impair catalysis, stability, or both. Human-cell and animal studies
  therefore support variant-specific protein instability and tissue-dependent
  TPI abundance as important determinants, while low catalytic activity alone is
  insufficient to produce disease in a mouse model. Erythrocyte DHAP
  accumulation and methylglyoxal/glycation-redox abnormalities are measured in
  affected people, but their causal contribution to neurodegeneration remains
  unresolved. There is no proven disease-modifying therapy; management is
  supportive and tailored to hematologic, respiratory, nutritional, and
  neuromuscular needs.

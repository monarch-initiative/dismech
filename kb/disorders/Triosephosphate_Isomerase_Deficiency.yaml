pathophysiology:
- name: Triosephosphate Isomerase Loss of Function and Dimer Destabilization
  description: >
    Biallelic pathogenic variants in TPI1 reduce the activity of triosephosphate
    isomerase, the enzyme that equilibrates the triose phosphates
    (dihydroxyacetone phosphate and glyceraldehyde-3-phosphate) produced by
    aldolase in glycolysis. The enzyme is catalytically active only as a
    homodimer; the disease-causing mutations decrease catalytic activity and/or
    cause dissociation of the dimer into inactive monomers, rather than acting as
    simple null alleles. The recurrent Glu104Asp (E104D) missense substitution is
    by far the most common allele. This is the systemic root lesion of the
    disorder, feeding both a distinctive neurotoxic (methylglyoxal) arm and the
    erythrocyte glycolytic-failure arm of the conserved hemolytic-anemia module.
  biological_processes:
  - preferred_term: reduced glycolytic triose phosphate interconversion
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: DECREASED
  evidence:
  - reference: PMID:19786097
    reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme is a stable homodimer, which is catalytically active only in its dimeric form."
    explanation: Establishes that TPI is active only as a homodimer, the structural basis for dimer-destabilizing disease mutations.
  - reference: PMID:19786097
    reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutations result in decrease in the catalytic activity and/or the dissociation of the dimers into inactive monomers"
    explanation: Defines the disease-specific molecular lesion — reduced catalytic activity and/or dimer dissociation into inactive monomers.
  - reference: PMID:17424909
    reference_title: "Triosephosphate isomerase deficiency: facts and doubts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most abundant mutation is a Glu104Asp missense mutation that is found in homozygotes and compound heterozygotes."
    explanation: Identifies Glu104Asp as the most common pathogenic allele, seen in homozygous and compound-heterozygous states.
  downstream:
  - target: Dihydroxyacetone Phosphate Accumulation and Methylglyoxal Toxicity
    causal_link_type: DIRECT
    description: >
      Reduced TPI activity causes the upstream substrate dihydroxyacetone
      phosphate to accumulate and undergo chemical conversion to toxic
      methylglyoxal.
  - target: Erythrocyte Glycolytic Impairment
    causal_link_type: DIRECT
    description: >
      In the erythrocyte, which depends on glycolysis for ATP, the TPI block
      reduces red-cell metabolic integrity.
- name: Dihydroxyacetone Phosphate Accumulation and Methylglyoxal Toxicity
  description: >
    Although impaired TPI activity does not, at the system level, abolish energy
    metabolism, it causes accumulation of dihydroxyacetone phosphate (DHAP)
    proximal to the enzymatic block. DHAP is chemically converted to the highly
    reactive dicarbonyl methylglyoxal, which in turn drives the formation of
    advanced glycation end products. This toxic-metabolite mechanism is the
    disease-specific arm that distinguishes TPI deficiency from other glycolytic
    enzymopathies and is implicated in its progressive neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: methylglyoxal formation from accumulated DHAP
    term:
      id: GO:0019242
      label: methylglyoxal biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:19786097
    reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it results in accumulation of dihydroxyacetone phosphate followed by its chemical conversion into the toxic methylglyoxal, leading to the formation of advanced glycation end products"
    explanation: Directly supports DHAP accumulation and its conversion to toxic methylglyoxal with advanced glycation end-product formation.
  - reference: PMID:19786097
    reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The impairment of TPI activity apparently does not affect the energy metabolism at system level"
    explanation: Clarifies that the pathology is driven by toxic-metabolite accumulation rather than by a global energy-metabolism failure.
  downstream:
  - target: Progressive Neurological and Neuromuscular Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Chronic methylglyoxal/AGE toxicity and mutant-TPI aggregation are
      implicated in the progressive neurodegeneration characteristic of the
      disease.
- name: Erythrocyte Glycolytic Impairment
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity"
  description: >
    The mature erythrocyte lacks mitochondria and relies on glycolysis for ATP,
    so the TPI block reduces erythrocyte metabolic integrity. This is the
    disease-specific lesion that maps onto the generic entry point of the
    conserved hemolytic-anemia module.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: impaired erythrocyte glycolysis
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: DECREASED
  evidence:
  - reference: PMID:12023819
    reference_title: "Triosephosphate isomerase deficiency: a neurodegenerative misfolding disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "triosephosphate isomerase (TPI) deficiency is the only one in which haemolytic anaemia is coupled with progressive, severe neurological disorder"
    explanation: Establishes that TPI deficiency, among glycolytic enzyme deficiencies, uniquely couples hemolytic anemia with progressive neurological disease.
  downstream:
  - target: Premature Erythrocyte Destruction
    causal_link_type: DIRECT
    description: >
      Metabolically compromised erythrocytes are prematurely removed from the
      circulation, shortening red-cell lifespan.
- name: Premature Erythrocyte Destruction
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >
    The metabolically compromised erythrocytes are prematurely destroyed,
    shortening red-cell lifespan and producing the chronic nonspherocytic
    hemolytic anemia; splenic pathology is seen in the murine model of the
    disease.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:36405628
    reference_title: "Murine model of triosephosphate isomerase deficiency with anemia and severe neuromuscular dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hemolytic anemia, pathological changes in spleen, and decreased body weight"
    explanation: In the Tpi1 E105D/null mouse model, hemolytic anemia and splenic pathology recapitulate the premature red-cell destruction of the human disease.
  downstream:
  - target: Chronic Hemolytic Anemia
    causal_link_type: DIRECT
    description: >
      Shortened erythrocyte survival produces the chronic hemolytic anemia.
- name: Chronic Hemolytic Anemia
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Hemolytic Anemia"
  description: >
    The net hematologic result is a chronic nonspherocytic hemolytic anemia — the
    disease-specific terminal state of the conserved hemolytic-anemia module and
    one half of the defining TPI-deficiency phenotype.
  biological_processes:
  - preferred_term: abnormal erythrocyte homeostasis
    term:
      id: GO:0034101
      label: erythrocyte homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21215915
    reference_title: "Triosephosphate isomerase deficiency: a patient with Val231Met mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by hemolytic anemia, neurodegeneration, and recurrent bacterial infections"
    explanation: Documents chronic hemolytic anemia as a core feature of the clinical triad of TPI deficiency.
- name: Progressive Neurological and Neuromuscular Degeneration
  description: >
    The distinctive extra-hematologic arm of the disease is a progressive
    neurological and neuromuscular degeneration — spasticity, dystonia, tremor,
    and motor deterioration — that, together with recurrent infections and
    cardiomyopathy, drives the frequently fatal early-childhood course. This arm
    sets TPI deficiency apart from all other glycolytic enzymopathies.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:17424909
    reference_title: "Triosephosphate isomerase deficiency: facts and doubts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is associated with progressive neurological dysfunction and frequently with childhood death"
    explanation: Establishes the progressive neurological dysfunction and frequent childhood death that distinguish TPI deficiency.
  - reference: PMID:36405628
    reference_title: "Murine model of triosephosphate isomerase deficiency with anemia and severe neuromuscular dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "postural abnormalities consistent with extensive neuromuscular dysfunction"
    explanation: The murine model recapitulates the neuromuscular degeneration of the human disease.

review_notes: >-
  Identity was reviewed as one TPI1 allelic-spectrum disorder: MONDO:0014221,
  OMIM:615512, ORPHA:868, and autosomal-recessive TPI1 disease are concordant.
  Severe and attenuated genotypes were not split because they do not represent
  separate exact MONDO disease identities. Current p.Glu105Asp numbering is used;
  E104D is retained only as the documented historical name. The prior graph's
  low-flux/ATP-failure and established methylglyoxal-neurotoxicity claims were
  corrected: patient erythrocyte modeling shows increased flux with compensated
  energy state, while human methylglyoxal/glycation evidence remains associative.
  Reviews are typed OTHER rather than HUMAN_CLINICAL unless a claim comes from a
  directly reported case. All clinical phenotypes are linked to the pathograph,
  and TPI1 is wired at the molecular trigger. The positive E105D/null mouse,
  stable low-activity negative mouse, fly, and human fibroblast model are retained
  with explicit fidelity limits. No dedicated GeneReviews chapter was found.
  Dataset discovery returned only GENE_ONLY candidates GSE268772 (mouse lung
  endothelial regeneration), GSE120262 (mouse microbiome/m6A study), and GSE8983
  (Geobacter omcB study); none is disease-specific, so `datasets` is explicitly
  empty. No curative treatment is established, and preclinical stabilization,
  diet, transplant, enzyme, and gene-therapy approaches are not promoted to
  standard care.

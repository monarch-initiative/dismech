  prevalence_class: ULTRA_RARE
  notes: >
    One of the rarest glycolytic enzymopathies; only a small number of families
    have been reported worldwide (curator summary). The cited source characterizes
    the disorder as rare and autosomal recessive.
  evidence:
  - reference: PMID:21215915

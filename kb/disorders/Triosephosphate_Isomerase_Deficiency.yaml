name: Triosephosphate Isomerase Deficiency
category: Mendelian
creation_date: "2026-07-08T00:00:00Z"
synonyms:
- TPI deficiency
- TPID
- Triose phosphate-isomerase deficiency
- Hemolytic anemia due to triosephosphate isomerase deficiency
- TPI1-related triosephosphate isomerase deficiency
description: >
  Triosephosphate isomerase (TPI) deficiency is a severe, autosomal-recessive
  multisystem inborn error of glycolytic metabolism caused by biallelic
  loss-of-function variants in TPI1. It is unique among the glycolytic
  enzymopathies: it is the only one in which chronic hemolytic anemia is coupled
  with progressive neurological/neuromuscular degeneration, and it is frequently
  fatal in early childhood. TPI catalyzes the rapid interconversion of the two
  triose phosphates produced by aldolase in glycolysis — dihydroxyacetone
  phosphate (DHAP) and glyceraldehyde-3-phosphate — a metabolic cross-road that
  also connects glycolysis to the pentose phosphate pathway, the
  glycerol-3-phosphate shuttle, and lipid metabolism. The enzyme is catalytically
  active only as a homodimer; most disease-causing mutations (the recurrent
  Glu104Asp/E104D missense change being by far the most common) destabilize the
  dimer, reducing catalytic activity and/or driving dissociation into inactive
  monomers rather than abolishing energy metabolism outright. The distinctive
  neurotoxic arm arises because impaired TPI activity causes DHAP to accumulate
  and undergo chemical conversion into the toxic dicarbonyl methylglyoxal, a
  precursor of advanced glycation end products. In the mature erythrocyte — which
  lacks mitochondria and depends on glycolysis — the glycolytic block shortens
  red-cell survival and produces chronic nonspherocytic hemolytic anemia.
  Patients typically present in infancy or early childhood with hemolytic anemia,
  progressive spasticity/dystonia and neuromuscular deterioration, recurrent
  bacterial infections, and cardiomyopathy, and most die in childhood. There is
  currently no established disease-modifying therapy; management is supportive.

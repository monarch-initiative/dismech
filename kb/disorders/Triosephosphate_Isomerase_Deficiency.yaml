genetic:
- name: Biallelic TPI1 pathogenic variants
  gene_term:
    preferred_term: TPI1
    term:
      id: hgnc:12009
      label: TPI1
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:40897044
      reference_title: "TPI deficiency: A case report and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TPI deficiency (TPI Df; MIM# 615512) is an autosomal recessive disorder due
        to biallelic pathogenic variants in TPI1.
      explanation: Establishes autosomal-recessive biallelic causation.
  features: >-
    Disease-causing genotypes are biallelic and include homozygous and
    compound-heterozygous combinations. The common p.Glu105Asp allele is called E104D in
    older structural literature because the historical numbering omitted the
    initiator methionine. Alleles differ in their effects on catalysis, dimer
    stability, protein turnover, and clinical severity; the entry is retained as
    one allelic spectrum rather than split by severity.
  evidence:
  - reference: PMID:35315486
    reference_title: Itavastatin and resveratrol increase triosephosphate isomerase protein in a newly identified variant of TPI deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Note: The classical convention for numbering TPI amino acids does not
      include the start methionine. Thus, E105D is also known as E104D in some
      previously published papers.
    explanation: Resolves current versus historical numbering of the common allele.
  - reference: PMID:10916682
    reference_title: "Triosephosphate isomerase deficiency: historical perspectives and molecular aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All kindreds that have been studied with the predominant Glu104Asp mutation
      are linked by a common haplotype, indicating descent from a common ancestor.
    explanation: Documents the founder haplotype of the common historically numbered allele.

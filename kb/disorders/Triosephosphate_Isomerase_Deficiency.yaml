    explanation: Supports the rare, autosomal-recessive characterization underlying the ultra-rare band.
treatments:
- name: Supportive and Symptomatic Management
  description: >
    There is currently no established disease-modifying therapy for TPI
    deficiency; care is supportive and symptomatic — red-cell transfusion for
    anemia, prompt treatment of infections, and multidisciplinary neuromuscular
    and cardiac supportive care. A mammalian (murine) model has recently been
    developed to enable mechanistic study and preclinical testing of emerging
    treatments.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:36405628
    reference_title: "Murine model of triosephosphate isomerase deficiency with anemia and severe neuromuscular dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a rare, aggressive genetic disease that typically affects young children and currently has no established treatment"
    explanation: Documents that TPI deficiency currently has no established (disease-modifying) treatment, so management is supportive.

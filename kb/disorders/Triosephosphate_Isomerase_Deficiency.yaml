    modifier: DECREASED
  evidence:
  - reference: PMID:35315486
    reference_title: Itavastatin and resveratrol increase triosephosphate isomerase protein in a newly identified variant of TPI deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blots using patient fibroblasts demonstrated reduced TPI in patient
      cells compared with wild-type levels
    explanation: Patient-derived cells directly demonstrate reduced steady-state TPI abundance.
  - reference: PMID:41153421
    reference_title: "Newly Identified TPI Deficiency Treatments Function for Novel Disease-Causing Allele, TPI1(R5G)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, since there is an ~90% decrease in TPI protein relative to control
      fibroblasts, these data demonstrate that the novel TPIR5G mutant protein
      has pathogenic consequences that significantly decrease either its
      expression or stability, lowering steady-state protein levels.
    explanation: >-
      A second patient genotype couples near-normal purified catalytic activity
      to markedly reduced steady-state TPI abundance in patient fibroblasts.
  - reference: PMID:31111503
    reference_title: Low catalytic activity is insufficient to induce disease pathology in triosephosphate isomerase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, without the stability defect that affects TPI activity in a
      tissue-specific manner, a strong decline in TPI catalytic activity is not
      sufficient to explain the pathological onset of TPI deficiency.
    explanation: >-
      The negative mouse model distinguishes instability/tissue abundance from
      catalytic loss alone.
  downstream:
  - target: Progressive Central and Neuromuscular Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tpi_stability_tissue_abundance_model
    description: >-
      Low or unstable TPI protein is associated with the severe neuromuscular
      phenotype, but the intervening human neural, synaptic, and muscle events
      are not established.
    evidence:
    - reference: PMID:40897044
      reference_title: "TPI deficiency: A case report and review of the literature."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Tpi1-deficient mice with a p.Glu105Asp/null genotype recapitulate the
        life-limiting neuromuscular phenotype seen in humans, but the exact
        pathomechanism remains unclear.
      explanation: >-
        Genotype-matched disease and model phenotypes support the association
        while the source explicitly leaves the mechanistic bridge unresolved.

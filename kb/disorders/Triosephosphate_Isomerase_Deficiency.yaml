discussions:
- discussion_id: gap_tpi_human_neuromuscular_causal_bridge
  prompt: >-
    Which variant- and tissue-dependent event is causally necessary for human
    neurologic and neuromuscular disease: loss of stable TPI protein,
    DHAP-methylglyoxal/glycation-redox stress, proteostasis/aggregation, synaptic or
    neuromuscular-junction dysfunction, or a combination?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
  - pathophysiology#Candidate Methylglyoxal, Glycation, and Redox Neurotoxic Stress
  - pathophysiology#Progressive Central and Neuromuscular Dysfunction
  rationale: >-
    Genotype-matched brothers can differ neurologically; a stable low-activity
    mouse remains well; methylglyoxal evidence is associative and blood-based;
    and the positive mouse reveals several candidate tissue lesions. Resolving
    causal necessity is essential for choosing between protein stabilization,
    metabolic detoxification, and neural or muscle-directed therapies.
  evidence:
  - reference: PMID:17424909
    reference_title: "Triosephosphate isomerase deficiency: facts and doubts."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two germ-line identical Hungarian compound heterozygote brothers with
      distinct phenotypes question the exclusive role of the inherited mutations
      in the etiology of neurodegeneration.
    explanation: Human phenotypic discordance shows that genotype alone does not resolve the neural mechanism.
  - reference: PMID:12023819
    reference_title: "Triosephosphate isomerase deficiency: a neurodegenerative misfolding disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the mutations of TPI explain in themselves neither the severe decrease in
      the enzyme activity characteristic of TPI deficiency nor the enhanced
      ability of the mutant enzyme from haemolysate of the propositus to associate
      with subcellular particles.
    explanation: The misfolding literature itself identifies unexplained steps beyond the variants.
  - reference: PMID:40897044
    reference_title: "TPI deficiency: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tpi1-deficient mice with a p.Glu105Asp/null genotype recapitulate the
      life-limiting neuromuscular phenotype seen in humans, but the exact
      pathomechanism remains unclear.
    explanation: A current review explicitly identifies the exact pathomechanism as unresolved.
  proposed_experiments:
  - experiment_id: tpi_isogenic_human_motor_unit_mechanism_dissection
    name: Isogenic human motor-unit mechanism dissection
    description: >-
      Generate genotype-corrected and p.Glu105Asp/null isogenic human iPSC motor
      neurons co-cultured with skeletal muscle. Independently restore TPI protein
      stability or modulate methylglyoxal detoxification, then measure TPI
      abundance and turnover, DHAP/MG/AGE-redox markers, neuronal survival,
      synaptic release, NMJ transmission, and muscle contraction over time.
    readouts:
    - name: TPI abundance, turnover, and tissue threshold
      target: pathophysiology#Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
    - name: Methylglyoxal/glycation-redox burden
      target: pathophysiology#Candidate Methylglyoxal, Glycation, and Redox Neurotoxic Stress
    - name: Motor-neuron, NMJ, and muscle functional rescue
      target: pathophysiology#Progressive Central and Neuromuscular Dysfunction
    decision_criterion: >-
      A perturbation that rescues neural/NMJ/muscle function while selectively
      normalizing one candidate arm would support causal necessity; dissociation
      of biomarkers from functional rescue would argue against that arm as the
      primary driver.
    would_support:
    - pathophysiology#Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
    - pathophysiology#Candidate Methylglyoxal, Glycation, and Redox Neurotoxic Stress
    - pathophysiology#Progressive Central and Neuromuscular Dysfunction
- discussion_id: mismatch_tpi_models_to_human_motor_system
  prompt: >-
    How faithfully do the E105D/null mouse, sugarkill fly, stable low-activity
    mouse, and patient fibroblast reproduce the cell-type-specific mechanisms of
    human embryonic and childhood motor-system disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Tpi1 p.Glu105Asp/null mouse
  - animal_models#Stable low-activity Tpi1 p.Ile170Val mouse
  - animal_models#sugarkill TPI-mutant fly
  - experimental_models#TPI p.Gln181Pro/p.Glu105Asp patient-fibroblast stability model
  - pathophysiology#Progressive Central and Neuromuscular Dysfunction
  rationale: >-
    The positive mouse has a compressed lethal course and a compound genotype,
    the negative mouse deliberately lacks the stability defect, the fly lacks
    mammalian erythrocyte and respiratory physiology, and fibroblasts do not
    model motor neurons or muscle. Cross-model agreement generates candidates
    but cannot by itself establish the corresponding human cellular mechanism.
  evidence:
  - reference: PMID:39127839
    reference_title: Neuromuscular dysfunction and pathogenesis in triosephosphate isomerase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      An additional limitation is the lack of spinal cord analysis. It is
      possible that there are structural defects and denervation occurring
      between upper and lower motor neurons within the spinal cord, that these
      studies would have missed.
    explanation: The positive mouse study explicitly identifies an unexamined motor-system compartment.
  - reference: PMID:35315486
    reference_title: Itavastatin and resveratrol increase triosephosphate isomerase protein in a newly identified variant of TPI deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, the patient fibroblast studies presented here are important,
      but studies with nervous tissues are needed to better elucidate the basis
      of the apparent genetic complementation.
    explanation: The human-cell study explicitly limits fibroblast-to-neural extrapolation.
  proposed_experiments:
  - experiment_id: tpi_cross_model_human_neural_concordance
    name: Cross-model human neural concordance study
    description: >-
      Compare matched longitudinal proteomic, metabolomic, and functional
      signatures across human isogenic motor neurons/muscle, E105D/null mouse
      brain-spinal cord-NMJ-muscle, stable I170V mouse, and sugarkill fly, using
      prespecified orthologous endpoints and genotype rescue controls.
    readouts:
    - name: Cross-species concordance of neural, NMJ, and muscle signatures
      target: pathophysiology#Progressive Central and Neuromuscular Dysfunction
    decision_criterion: >-
      Reproducible directionally concordant signatures that normalize after
      genotype correction in human cells would increase model fidelity;
      model-specific signatures absent from human cells would constrain extrapolation.
    would_support:
    - pathophysiology#Progressive Central and Neuromuscular Dysfunction

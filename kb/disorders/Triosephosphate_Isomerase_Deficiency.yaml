      homozygosity, and mouse tissue thresholds may differ from humans.
    evidence:
    - reference: PMID:36405628
      reference_title: Murine model of triosephosphate isomerase deficiency with anemia and severe neuromuscular dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There is a ∼95% reduction in TPI protein levels in Tpi1 E105D/null animals
        compared to wild-type littermates, consistent with decreased TPI protein stability
      explanation: Directly supports severe protein loss in the model.

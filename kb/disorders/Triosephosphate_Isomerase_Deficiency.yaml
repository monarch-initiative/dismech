prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The exact incidence is unknown; a 2023 review reported fewer than 50
    clinically affected people in the literature and described the disorder as
    ultra-rare. Underdiagnosis is plausible because erythrocyte TPI activity is
    not routinely assayed and can be confounded by transfusion.
  evidence:
  - reference: PMID:37323194
    reference_title: "Triosephosphate Isomerase Deficiency: E105D Mutation in Unrelated Patients and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fewer than 50 clinically affected patients have been described in the literature to date.
    explanation: Supports the literature-case scale underlying the ultra-rare classification.
diagnosis:
- name: Erythrocyte TPI enzyme activity assay
  description: >-
    Reduced erythrocyte TPI activity supports the biochemical diagnosis in a
    compatible congenital nonspherocytic hemolytic anemia. Interpretation must
    account for recent red-cell transfusion, which can raise measured activity
    toward normal; molecular confirmation is therefore important.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  markers: Erythrocyte triosephosphate isomerase activity
  results: Reduced erythrocyte TPI activity supports TPI deficiency.
  evidence:
  - reference: PMID:11196750
    reference_title: "Triosephosphate isomerase deficiency with elevated sweat chloride test: report of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A search for a red cell enzyme deficiency revealed that the red cell
      triosephosphate isomerase (TPI) activity was low.
    explanation: Demonstrates biochemical detection of reduced red-cell TPI activity.
  - reference: PMID:37323194
    reference_title: "Triosephosphate Isomerase Deficiency: E105D Mutation in Unrelated Patients and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It should also be noted that in patients who are frequently transfused with
      erythrocyte suspensions, the TPI activity might be within the normal range.
    explanation: Defines the important transfusion-related false-negative limitation.
- name: Molecular confirmation of biallelic TPI1 variants
  description: >-
    Identification of two pathogenic or likely pathogenic TPI1 variants in trans
    confirms the molecular diagnosis and can resolve cases in which enzyme
    testing is unavailable or confounded by transfusion.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: Biallelic pathogenic or likely pathogenic TPI1 variants
  results: Pathogenic or likely pathogenic TPI1 variants on both alleles support the diagnosis.
  evidence:
  - reference: PMID:40981120
    reference_title: "Challenges in the Diagnosis and Management of Triosephosphate Isomerase Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, trio whole-exome sequencing (WES) was performed, including
      analysis of the mitochondrial genome, revealing two heterozygous missense
      variants in the TPI1 gene, in trans, both classified as likely pathogenic
    explanation: Directly documents molecular confirmation with two variants in trans.
treatments:
- name: Supportive Multidisciplinary Management
  description: >-
    No proven disease-modifying therapy is available. Care is individualized and
    may include transfusion support for severe anemia, respiratory support,
    feeding assistance, and physical, occupational, or speech rehabilitation.
    Experimental enzyme replacement, gene therapy, bone-marrow transplantation,
    metabolic diets, and small-molecule stabilizers are not represented as
    established human treatments.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40981120
    reference_title: "Challenges in the Diagnosis and Management of Triosephosphate Isomerase Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a severe paediatric condition without specific treatment, TPI
      deficiency requires primarily supportive care, such as feeding by
      nasogastric tube or gastrostomy and respiratory support.
    explanation: Directly supports supportive feeding and respiratory management.
  - reference: PMID:40981120
    reference_title: "Challenges in the Diagnosis and Management of Triosephosphate Isomerase Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her medical history is significant for neonatal jaundice, needing
      phototherapy and a prior hospital admission at 2 months of age due to
      Respiratory Syncytial Virus (RSV) bronchiolitis and anaemia (haemoglobin
      6.5 g/dL), requiring blood transfusion support.
    explanation: Documents transfusion support for severe anemia in an affected infant.
  - reference: PMID:40981120
    reference_title: "Challenges in the Diagnosis and Management of Triosephosphate Isomerase Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She has maintained physical medicine and rehabilitation therapy (3 times
      per week), which has been integral in addressing her motor and
      developmental needs. She also has Speech Therapy once weekly and
      Occupational Therapy once weekly.
    explanation: Documents ongoing multidisciplinary rehabilitation in an affected child.
  - reference: PMID:40897044
    reference_title: "TPI deficiency: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While there are no proven therapies available at this time, we hope this
      review will lead the discussion to consider future therapeutic options.
    explanation: Bounds all disease-modifying approaches as unproven.
animal_models:
- name: Tpi1 p.Glu105Asp/null mouse
  species: Mus musculus
  genotype: Compound heterozygous Tpi1 E105D and frameshift-null alleles
  genes:
  - preferred_term: TPI1
    term:
      id: hgnc:12009
      label: TPI1
  publication: PMID:36405628
  description: >-
    This mammalian model carries the common human disease allele in trans with a
    null allele. It has markedly reduced TPI protein, shortened survival,
    hemolytic anemia, splenic pathology, and progressive neuromuscular
    dysfunction; later work identified brain, neuromuscular-junction, muscle,
    cardiac, and vascular abnormalities.

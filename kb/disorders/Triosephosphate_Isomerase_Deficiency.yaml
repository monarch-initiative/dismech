genetic:
- name: TPI1 pathogenic variants
  gene_term:
    preferred_term: TPI1
    term:
      id: hgnc:12009
      label: TPI1
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:19786097
      reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TPI deficiency is an autosomal recessive multisystem genetic disease"
      explanation: States that TPI deficiency is inherited in an autosomal-recessive manner.
  features: >
    Biallelic (homozygous or compound-heterozygous) TPI1 variants cause the
    disease. The recurrent Glu104Asp (E104D) missense substitution is the most
    common allele and, in studied kindreds, is carried on a shared haplotype
    consistent with descent from a common ancestor. Most pathogenic variants act
    by destabilizing the catalytically active homodimer rather than as simple
    null alleles, giving a spectrum of residual activity.
  evidence:
  - reference: PMID:17424909
    reference_title: "Triosephosphate isomerase deficiency: facts and doubts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most abundant mutation is a Glu104Asp missense mutation that is found in homozygotes and compound heterozygotes."
    explanation: Establishes Glu104Asp as the most common pathogenic allele in homozygous and compound-heterozygous states.
  - reference: PMID:10916682
    reference_title: "Triosephosphate isomerase deficiency: historical perspectives and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All kindreds that have been studied with the predominant Glu104Asp mutation are linked by a common haplotype, indicating descent from a common ancestor."
    explanation: Documents the shared founder haplotype of the predominant Glu104Asp allele.

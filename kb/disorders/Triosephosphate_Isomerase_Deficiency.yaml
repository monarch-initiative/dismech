- name: Stable low-activity Tpi1 p.Ile170Val mouse
  species: Mus musculus
  genotype: Homozygous Tpi1 I170V catalytic-site variant on a C57BL/6J background
  genes:
  - preferred_term: TPI1
    term:
      id: hgnc:12009
      label: TPI1
  publication: PMID:31111503
  description: >-
    This critical negative model retains approximately 13-15% TPI activity across
    tissues but preserves dimer stability and protein abundance. Despite altered
    metabolites, it does not develop anemia, neurologic, neuromuscular, immune,
    respiratory, or cardiac disease, demonstrating that low catalysis alone is
    insufficient.
  modeled_mechanisms:
  - target: Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: The catalytic variant deliberately preserves protein stability and lacks tissue-selective loss.
    limitations: >-
      It is a falsification model for low catalytic activity, not a genetic model
      of the common destabilizing human allele.
    evidence:
    - reference: PMID:31111503
      reference_title: Low catalytic activity is insufficient to induce disease pathology in triosephosphate isomerase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While monitoring protein expression levels revealed no evidence for
        protein instability, metabolite quantification indicated that glycolysis
        is affected by the active site mutation.
      explanation: Directly establishes the intended stability/activity separation.
  - target: Progressive Central and Neuromuscular Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: The mice lack the neurologic and neuromuscular phenotype despite severe catalytic reduction.
    limitations: >-
      This stable catalytic-site allele is not a genetic match for destabilizing

mechanistic_hypotheses:
- hypothesis_group_id: tpi_stability_tissue_abundance_model
  hypothesis_label: Variant-specific stability and tissue-abundance model
  status: EMERGING
  description: >-
    Pathogenicity and clinical severity depend more strongly on mutant-protein
    instability and tissue-dependent steady-state TPI abundance than on reduced
    catalytic activity alone. This model is supported by human structural and
    fibroblast data and by a stable low-activity mouse that does not develop the
    disease, but the tissue-specific bridge to human neuromuscular injury is not
    fully resolved.
  evidence:
  - reference: PMID:31111503
    reference_title: Low catalytic activity is insufficient to induce disease pathology in triosephosphate isomerase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, without the stability defect that affects TPI activity in a
      tissue-specific manner, a strong decline in TPI catalytic activity is not
      sufficient to explain the pathological onset of TPI deficiency.
    explanation: >-
      The stable I170V mouse separates catalytic loss from instability and
      falsifies a simple low-activity-only mechanism.
  - reference: PMID:35315486
    reference_title: Itavastatin and resveratrol increase triosephosphate isomerase protein in a newly identified variant of TPI deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data suggest that impaired stability, and not catalytic activity, is
      a better predictor of TPI Df severity.
    explanation: >-
      Human variant and patient-fibroblast data support the stability/abundance
      model while retaining it as a predictor rather than a complete mechanism.
- hypothesis_group_id: tpi_methylglyoxal_glycation_stress_model
  hypothesis_label: DHAP-methylglyoxal/glycation-redox neurotoxicity model
  status: ALTERNATIVE
  description: >-
    Accumulated DHAP can form methylglyoxal, advanced glycation products, and
    oxidative or nitrosative stress. These abnormalities are demonstrated in
    blood from one phenotypically discordant family, but a causal neural-tissue
    pathway has not been shown.
  evidence:
  - reference: PMID:14559119
    reference_title: Increased formation of methylglyoxal and protein glycation, oxidation and nitrosation in triosephosphate isomerase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The increased derangement of MG metabolism and associated glycation,
      oxidative and nitrosative stress in the propositus may be linked to
      neurodegenerative process in triosephosphate isomerase deficiency.
    explanation: >-
      The source itself uses associative language, so it supports an alternative
      hypothesis rather than an established causal arm.
pathophysiology:
- name: Variant-Specific TPI1 Dysfunction
  description: >-
    Biallelic pathogenic TPI1 variants impair the steady-state function of
    triosephosphate isomerase through variant-specific combinations of altered
    catalysis, dimer formation, thermal stability, and protein turnover. The
    common p.Glu105Asp variant is structurally destabilizing even though purified
    mutant enzyme can retain normal catalytic activity; reduced enzyme activity
    alone is therefore not treated as the complete disease mechanism.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: TPI1
    term:
      id: hgnc:12009
      label: TPI1
  molecular_functions:
  - preferred_term: triose-phosphate isomerase activity
    term:
      id: GO:0004807
      label: triose-phosphate isomerase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40897044
    reference_title: "TPI deficiency: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TPI deficiency (TPI Df; MIM# 615512) is an autosomal recessive disorder due
      to biallelic pathogenic variants in TPI1.
    explanation: Establishes the biallelic TPI1 disease trigger and exact disease identity.
  - reference: PMID:18562316
    reference_title: "Structural basis of human triosephosphate isomerase deficiency: mutation E104D is related to alterations of a conserved water network at the dimer interface."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that the purified, recombinant mutant enzyme E104D, while
      exhibiting normal catalytic activity, shows impairments in the formation
      of active dimers and low thermostability and monomerizes under conditions
      in which the wild type retains its dimeric form.
    explanation: >-
      Direct structural and biochemical evidence shows why the common allele
      cannot be represented as a simple catalytic null.
  - reference: PMID:19786097
    reference_title: "Triosephosphate isomerase deficiency: new insights into an enigmatic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the mutations result in decrease in the catalytic activity and/or the
      dissociation of the dimers into inactive monomers
    explanation: >-
      The review supports the variant-dependent combination of reduced catalysis
      and dimer disruption represented at the root.
  downstream:
  - target: Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
    causal_link_type: DIRECT
    hypothesis_groups:
    - tpi_stability_tissue_abundance_model
    description: >-
      Destabilizing variants reduce dimer formation or accelerate protein
      turnover, lowering steady-state TPI abundance in a tissue- and
      allele-dependent manner.
    evidence:
    - reference: PMID:18562316
      reference_title: "Structural basis of human triosephosphate isomerase deficiency: mutation E104D is related to alterations of a conserved water network at the dimer interface."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show that the purified, recombinant mutant enzyme E104D, while
        exhibiting normal catalytic activity, shows impairments in the formation
        of active dimers and low thermostability and monomerizes under conditions
        in which the wild type retains its dimeric form.
      explanation: The common variant directly impairs dimer formation and stability.
  - target: Erythrocyte Triose-Phosphate Imbalance and Reduced Integrity
    causal_link_type: DIRECT
    description: >-
      Reduced TPI function in patient erythrocytes produces marked DHAP
      accumulation and altered glycolytic steady state without a generalized
      collapse of cellular energy charge.
    evidence:
    - reference: PMID:16086671
      reference_title: "Triosephosphate isomerase deficiency: consequences of an inherited mutation at mRNA, protein and metabolic levels."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results showed that the flux was 2.5-fold higher and the
        concentration of DHAP (dihydroxyacetone phosphate) and fructose
        1,6-bisphosphate increased 40- and 5-fold respectively in the
        erythrocytes of the patient compared with the control.
      explanation: >-
        Patient erythrocyte modeling directly supports the disease-specific
        metabolic imbalance and corrects the prior claim of reduced glycolytic flux.
  - target: Recurrent Infection Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recurrent infections are a reproducible clinical association, but whether
      they arise from anemia, immune-cell TPI biology, respiratory weakness, or
      another route is unknown.
    evidence:
    - reference: PMID:39127839
      reference_title: Neuromuscular dysfunction and pathogenesis in triosephosphate isomerase deficiency.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Often, patients experience recurrent infections throughout their
        lifespan, the basis of which is unknown but may be related to the severe
        anemia patients experience
      explanation: >-
        The source supports the clinical association and explicitly identifies
        its causal basis as unresolved.
  - target: Variable Cardiac Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiomyopathy is reported in the clinical spectrum, but its route from
      TPI1 dysfunction and its genotype dependence remain unresolved.
    evidence:
    - reference: PMID:37323194
      reference_title: "Triosephosphate Isomerase Deficiency: E105D Mutation in Unrelated Patients and Review of the Literature."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Chronic haemolytic anaemia, increased susceptibility to infections,
        cardiomyopathy, neurodegeneration, and death in early childhood are the
        clinical findings of triosephosphate isomerase (TPI) deficiency, which is
        an ultra-rare disorder.
      explanation: >-
        The clinical review includes cardiomyopathy in the spectrum but does not
        resolve a causal pathway or imply that it is universal.
- name: Reduced TPI Dimer Stability and Tissue-Dependent Protein Abundance
  description: >-
    Destabilizing variants reduce formation or persistence of functional TPI
    dimers and can lower steady-state protein abundance. Patient fibroblasts and
    structurally matched models support this lesion, while a stable catalytic
    mutant with similarly low activity does not produce disease. Tissue-specific
    abundance is therefore a leading, but incomplete, explanation for clinical
    severity.
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: TPI1
    term:

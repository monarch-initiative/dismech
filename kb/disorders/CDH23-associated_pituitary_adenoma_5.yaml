    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological examination was repeated from a deeper biopsy of the right nasal septum (Vomer) and confirmed the diagnosis of a lactotroph PA"
    explanation: >-
      The biopsy confirmed a lactotroph adenoma in the patient later found to carry a heterozygous CDH23 variant (p.Ala874Asp, classified as a VUS).

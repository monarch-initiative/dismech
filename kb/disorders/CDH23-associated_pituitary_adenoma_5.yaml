- name: Prolactinoma
  description: >-
    A lactotroph (prolactin-secreting) adenoma reported in a single patient with
    a novel heterozygous CDH23 variant of uncertain significance. This is one
    case report without segregation or functional data, so it is not an
    established feature of the disease. In this patient the tumour was an
    infiltrative giant prolactinoma involving the sellar, suprasellar and
    parasellar regions, skull base and nasopharynx; the same paper notes that
    tumours in the 2017 CDH23 carriers were smaller and less invasive, so this
    size is a single-case observation.
  phenotype_term:
    preferred_term: Prolactinoma
    term:
      id: HP:0006767

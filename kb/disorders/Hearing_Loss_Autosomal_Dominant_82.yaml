    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing in hearing impaired index cases of Dutch and Polish origins revealed five novel heterozygous (predicted to be) loss-of-function variants of ATP2B2."
    explanation: >-
      The allele class that defines DFNA82, and the authors' own hedge - predicted to be -
      about loss of function not having been measured for each variant.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two variants, c.1963G>T (p.Glu655*) and c.955delG (p.Ala319fs), occurred de novo."
    explanation: >-
      The two de novo alleles, which are what make this a monogenic claim rather than an
      association in families where a second variant might be segregating unseen.
- name: Impaired Calcium Extrusion from Stereocilia
  description: >-
    PMCA2 is the pump that gets calcium out of a hair cell stereocilium. It sits in the
    stereocilia membrane of inner and outer hair cells and in the basolateral wall, it is
    the primary route for clearing the calcium that enters through the transduction channel,
    and it also supplies calcium to the endolymph on the other side of the membrane - so one
    pump maintains both the low intracellular concentration and part of the extracellular
    one. Losing it therefore has two consequences pointing in opposite directions across the
    same membrane, and the mouse data show both: intracellular dysregulation inside the
    bundle, and measurably reduced endolymph calcium.

    Human DFNA82 alleles are heterozygous, so what is lost is roughly half the pump rather
    than all of it. No measurement of PMCA2 activity or of endolymph composition has been
    made in a patient, and none can be; this node's mechanism is mouse throughout.
  biological_scale: CELLULAR
  cell_types:

    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP2B2 encodes the PMCA2 Ca2+ pump that plays an important role in maintaining ion homeostasis in hair cells among others by extrusion of Ca2+ from the stereocilia to the endolymph."
    explanation: The pump's job, stated by the paper that defined the human disease.
  - reference: PMID:23792079
    reference_title: "A new Atp2b2 deafwaddler allele, dfw(i5), interacts strongly with Cdh23 and other auditory modifiers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The plasma membrane Ca2+ ATPase 2 (PMCA2), encoded by the Atp2b2 gene, is the primary mechanism for clearance of Ca2+ from auditory stereocilia, keeping intracellular levels low, and also contributes to maintaining adequate levels of extracellular Ca2+ in the endolymph."
    explanation: >-
      The dual role on the two sides of the stereocilia membrane, which is why this node has
      two downstream edges rather than one.
  - reference: PMID:23792079
    reference_title: "A new Atp2b2 deafwaddler allele, dfw(i5), interacts strongly with Cdh23 and other auditory modifiers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of auditory function in PMCA2 mutants can be attributed to dysregulation of intracellular Ca2+ inside the stereocilia bundles."
    explanation: The intracellular arm, attributed by the authors as the primary auditory lesion.
  - reference: PMID:15357414
    reference_title: "Low endolymph calcium concentrations in deafwaddler2J mice suggest that PMCA2 contributes to endolymph calcium maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "First, using immunocytochemistry, we demonstrated that PMCA2 is present in control mice inner and outer hair cell stereocilia where it could pump calcium into the endolymph and that PMCA2 is absent in dfw2J stereocilia."
    explanation: >-
      The localisation and its loss in a mutant, which is the anatomical basis for the whole
      node.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five variants affected the (predicted) \northolog of the w/a isoform of PMCA2, which is the pre-"
    explanation: >-
      Isoform specificity, and the reason this is a cochlear disease rather than a systemic
      calcium-handling one: ATP2B2 is alternatively spliced, and all five DFNA82 alleles fall
      in the isoform that is the predominant calcium pump of hair cells and localises to
      stereocilia. Quoted across the PDF cache's line break, which is why it stops mid-word;
      the sentence continues to name that isoform the predominant Ca2+-ATPase in rodent hair
      cells.
- name: Reduced Endolymph Calcium
  description: >-
    The extracellular consequence, measured directly in deafwaddler mice with an aspirating
    microelectrode and a calcium-sensitive dye: endolymph calcium is significantly lower
    than in controls. This matters beyond ionic housekeeping because extracellular calcium
    is required for the rigidity of cadherin 23 in the stereocilia tip link, which is the
    mechanistic bridge to the ATP2B2-CDH23 interaction and the reason a pump defect and an
    adhesion-molecule defect converge on the same structure.

    Whether this arm contributes to human DFNA82 is not known. Endolymph cannot be sampled
    in a patient, and the measurement was made in homozygous mutants, not heterozygotes.

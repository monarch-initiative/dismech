name: Hearing Loss Autosomal Dominant 82
category: Mendelian
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- DFNA82
- deafness, autosomal dominant 82
- ATP2B2-related autosomal dominant nonsyndromic hearing loss
- PMCA2-related hearing loss
description: >-
  DFNA82 is autosomal dominant nonsyndromic hearing loss caused by heterozygous
  loss-of-function variants in ATP2B2, which encodes PMCA2 - the plasma-membrane calcium
  pump that clears Ca2+ out of hair cell stereocilia and helps hold the endolymph's own
  calcium concentration where it needs to be. The clinical picture is tight for a
  nonsyndromic deafness entity: children pass newborn hearing screening, a steeply
  downsloping high-frequency loss is picked up between about three and six years, it
  progresses rapidly, and balance is normal on formal vestibular testing.

  The reason this entry exists as a separate disease, rather than as a note on somebody
  else's, is a distinction that took fourteen years to establish and is easy to erase. For
  most of that time ATP2B2 was known in human hearing loss only as a *modifier*: a
  hypofunctional missense variant, p.Val586Met, that made CDH23-related deafness worse in
  three of five siblings and appeared to aggravate hearing loss from a MYO6 mutation and
  from noise in two unrelated people. That is a real finding and it is not this disease.
  DFNA82 is the monogenic entity defined by heterozygous *truncating and splice-site*
  ATP2B2 alleles - nonsense, frameshift and canonical splice-donor changes, two of them de
  novo - in people whose CDH23 was sequenced and found not to explain the phenotype. A
  citation about digenic ATP2B2/CDH23 modification is evidence for the modifier claim and
  says nothing about DFNA82.

  A third ATP2B2 entity has to be kept apart from both. De novo missense changes and
  frameshifts in the penultimate exon cause a neurodevelopmental and movement disorder with
  dystonia, ataxia, intellectual disability, autistic features and seizures, and in cell
  assays those alleles produce a mixture of loss- and gain-of-function effects on calcium
  handling. Same gene, different allele class, different disease.

  The mouse work is unusually good and it came first. Deafwaddler was the original allele,
  and there are now several independent lines - spontaneous, ENU-induced and null - which
  agree that heterozygotes have progressive, high-frequency-first hearing loss and
  homozygotes are profoundly deaf with vestibular dysfunction. That heterozygous mouse
  phenotype is the closest animal counterpart of a human dominant disease this repository
  curates for the ear, and the human authors used it as their prior. It also carries the
  clearest warning about reading mechanism off sequence: the Oblivion allele sits in a
  transmembrane domain, where mutations were expected to prevent the pump reaching the
  membrane, and the protein turned out to be trafficked correctly and simply to pump badly.

    explanation: The size and origin of the founding series, which is the whole basis for the band.
progression:
- phase: Presymptomatic
  age_range: birth to about 3 years
  notes: >-
    Hearing is good enough at birth to pass newborn screening. A passed screen therefore
    does not exclude DFNA82, which is the practical consequence of this phase and the reason
    it is curated rather than left implicit.
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After normal newborn hearing screening, a rapidly progressive high-frequency hearing impairment was diagnosed at the age of about 3-6 years."
    explanation: The normal screen and the interval before diagnosis.
- phase: Rapid progression
  age_range: about 3 to 6 years onwards
  notes: >-
    Diagnosis falls in the preschool and early school years and the loss then progresses,
    steeply downsloping across the audiogram, reaching profound in the worst-affected
    subjects. The rate has been measured: an age-related typical audiogram over ages 10 to
    70 gives an average annual threshold deterioration of 0.5 dB/year at low frequencies,
    1.1 dB/year at middle frequencies and 0.7 dB/year at high frequencies.

    Note what that does and does not say. The deterioration is fastest in the *middle*
    frequencies, not the high ones, even though the loss starts high-frequency-weighted and
    the audiogram is downsloping. Onset configuration and rate of decline are different
    quantities here, and this entry should not be read as claiming the high frequencies also
    decline fastest. Audiograms below age 10 were excluded from the calculation as
    unreliable, so the rate describes the established disease rather than its first years.
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average annual \nthreshold deterioration (ATD) for the ages 10–70 was 0.5 \ndB/year for the low frequencies (250–500Hz), 1.1 db/y for \nmiddle frequencies (1–2 kHz) and 0.7 dB/year for the high \nfrequencies (4–8 kHz)."
    explanation: >-
      The measured rate of decline, per frequency band. This is the number the entry
      previously said had not been published; it is in the full text of the paper this PR
      caches, and the middle-frequency figure is the fastest of the three.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "mice heterozygous for loss-of-function defects display a rapidly progressive high-frequency hearing impairment"
    explanation: >-
      The mouse course the human one was compared against. Graded MODEL_ORGANISM because the
      sentence reports mouse data, and INDIRECT because it is prior work summarised in a
      human paper's abstract rather than a measurement of these patients.
diagnosis:
- name: ATP2B2 on dominant hearing loss panels, read together with CDH23
  description: >-
    DFNA82 is reached by exome sequencing or a dominant hearing loss panel containing
    ATP2B2. The clinical shape that should prompt it is specific: a passed newborn screen, a
    steeply downsloping high-frequency loss diagnosed in the preschool years, rapid
    progression, and normal balance.

    Interpretation has a step most genes do not need. Because ATP2B2 also acts as a
    severity modifier, finding a variant is not the end of the analysis: the founding study
    sequenced CDH23 in every index case and evaluated all rare variants in it before
    concluding the ATP2B2 allele was the monogenic cause. A heterozygous ATP2B2 missense
    variant found alongside CDH23 variants is a different situation from a heterozygous
    ATP2B2 truncating variant found alone, and the report should say which one it is.
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a digenic inheritance pattern of hearing impairment has been reported for heterozygous missense variants of ATP2B2 and CDH23, our findings indicate a monogenic cause of hearing impairment in cases with loss-of-function variants of ATP2B2."
    explanation: >-
      Why the interpretation step exists: the same gene supports two different genetic
      claims and the allele class decides which one applies.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After normal newborn hearing screening, a rapidly progressive high-frequency hearing impairment was diagnosed at the age of about 3-6 years."
    explanation: The clinical trigger for testing.
treatments:
- name: Genetic Counselling with Serial Audiometry from Infancy
  description: >-
    Counselling for a dominant condition with a 50 percent transmission risk, and scheduled
    audiometry starting well before school age. The surveillance recommendation is forced by
    the natural history rather than being generic: newborn screening is passed, diagnosis
    currently happens at three to six years, and the loss is rapidly progressive once it
    begins, so a child known to carry a familial ATP2B2 truncating allele needs testing on a
    schedule rather than on parental concern. Two of the five index cases arose de novo,
    which means unaffected parents do not exclude the diagnosis in a child.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After normal newborn hearing screening, a rapidly progressive high-frequency hearing impairment was diagnosed at the age of about 3-6 years."
    explanation: >-
      The interval between a normal screen and diagnosis, which is the window scheduled
      audiometry exists to shorten.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two variants, c.1963G>T (p.Glu655*) and c.955delG (p.Ala319fs), occurred de novo."
    explanation: >-
      Why an unremarkable family history does not lower the prior: two of five alleles were
      new events.
  notes: >-
    No ATP2B2-specific pharmacological treatment has been reported, and no DFNA82-specific
    clinical trial was identified. Hearing amplification and cochlear implantation are
    standard in progressive severe sensorineural hearing loss but no DFNA82-specific outcome
    data exist, so neither is curated here as a treatment - a scoping decision, not a
    judgement that they are inappropriate. Allele-specific gene editing is not curated as a
    treatment either: the work is preclinical, in a mouse missense allele rather than a
    human truncating one, and is recorded under animal_models with its limitations.
animal_models:
- name: Deafwaddler mouse
  species: Mouse
  genotype: Atp2b2 dfw (G to S substitution) and dfw2J (2 bp deletion, frameshift), homozygous
  publication: PMID:9697703
  description: >-
    The founding model and the reason ATP2B2 was ever a candidate deafness gene. Deafwaddler
    is a spontaneous recessive mutant that is deaf and unbalanced; the original allele is a
    glycine-to-serine substitution at a conserved position and the second, dfw2J, is a two
    base pair deletion predicting a truncated protein, with no detectable protein in the
    cochlea. PMCA2 localises to stereocilia and the basolateral wall of hair cells in
    wild-type mice and is absent in dfw2J. A later study on the same allele measured
    endolymph calcium directly and found it significantly reduced.
  genes:
  - preferred_term: ATP2B2
    term:
      id: hgnc:815
      label: ATP2B2
  modeled_mechanisms:
  - target: Impaired Calcium Extrusion from Stereocilia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Where the mechanism was established. PMCA2 protein was localised to stereocilia and
      shown to be absent in the mutant, which is the observation the whole calcium-clearance
      model is built on and which no human material can provide.
    limitations: >-
      Homozygous, and the human disease is heterozygous - so this line models complete pump
      loss rather than half of it, and it carries a vestibular phenotype the patients do not
      have. The dfw allele is a missense change and dfw2J a frameshift, neither of which is
      one of the five human alleles.
    readouts:
    - name: PMCA2 immunolocalisation in hair cells
      target: Impaired Calcium Extrusion from Stereocilia
      direction: ABOLISHED
      interpretation: >-
        The pump is present in wild-type stereocilia and undetectable in the mutant, which
        establishes both where it works and that the allele removes it.
      evidence:
      - reference: PMID:9697703
        reference_title: "Mutations in a plasma membrane Ca2+-ATPase gene cause deafness in deafwaddler mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the cochlea, the protein Atp2b2 is localized to stereocilia and the basolateral wall of hair cells in wild-type mice, but is not detected in dfw2J mice."
        explanation: The immunolocalisation measurement behind this readout.
    - name: Endolymph calcium concentration
      target: Impaired Calcium Extrusion from Stereocilia
      direction: DECREASED
      interpretation: >-
        Endolymph calcium falls when the pump is gone, confirming that PMCA2 supplies it
        rather than only clearing calcium from the cell.
      evidence:
      - reference: PMID:15357414
        reference_title: "Low endolymph calcium concentrations in deafwaddler2J mice suggest that PMCA2 contributes to endolymph calcium maintenance."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Second, using an aspirating microelectrode and calcium-sensitive fluorescent dye, we found that dfw2J mice endolymph calcium concentrations are significantly lower than those of control mice."
        explanation: The direct electrochemical measurement behind this readout.
    evidence:
    - reference: PMID:9697703
      reference_title: "Mutations in a plasma membrane Ca2+-ATPase gene cause deafness in deafwaddler mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This indicates that mutation of Atp2b2 may cause deafness and imbalance by affecting sensory transduction in stereocilia as well as neurotransmitter release from the basolateral membrane."
      explanation: >-
        The mechanism the founding study proposed, including the basolateral arm that the
        human entry does not curate because no human evidence bears on it.
- name: Oblivion mouse
  species: Mouse
  genotype: Atp2b2 Obl, ENU-induced p.Ser877Phe in transmembrane domain 6, heterozygous and homozygous
  publication: PMID:18974863
  description: >-
    The best model of the human dominant phenotype, because the informative animal here is
    the heterozygote. Obl/+ mice show increasing hearing impairment from postnatal day 20 to
    90, with hair cell degeneration progressing from cochlear base to apex behind the
    functional loss. Obl/Obl mice are small, severely vestibular by two weeks and deaf from
    birth.

    The allele also carries a lesson about inferring mechanism from position. It sits in a
    transmembrane domain, where such mutations were generally believed to prevent the pump
    reaching the plasma membrane; the protein was in fact correctly targeted and had simply
    lost much of its non-stimulated calcium-exporting ability.

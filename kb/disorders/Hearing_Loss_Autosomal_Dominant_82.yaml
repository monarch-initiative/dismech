  - preferred_term: ATP2B2
    term:
      id: hgnc:815
      label: ATP2B2
  modeled_mechanisms:
  - target: Outer Hair Cell Dysfunction and Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A heterozygous mouse with progressive, high-frequency-first hearing loss and a
      base-to-apex gradient of hair cell degeneration - the same dose, the same direction and
      the same spatial pattern as the human disease. That combination is rare among deafness
      models, most of which are recessive nulls standing in for dominant human conditions.
    limitations: >-
      A missense allele that produces a badly working pump, against human alleles that
      truncate the protein or destroy a splice site; whether a hypomorphic pump and a missing
      one fail the same way has not been tested. Homozygotes have a severe vestibular
      phenotype absent from patients, so the model must be read at the heterozygous dose
      only. The human course runs over years and the mouse over about ten weeks.
    readouts:

        evidence_source: MODEL_ORGANISM
        snippet: "Obl/+ mutants showed increasing hearing impairment from post-natal day (P)20 to P90, and loss of auditory function was followed by a corresponding base to apex progression of hair cell degeneration."
        explanation: The functional time course and the histological gradient that follows it.
    - name: Non-stimulated calcium export by the mutant pump
      target: Outer Hair Cell Dysfunction and Degeneration
      direction: DECREASED
      interpretation: >-
        The pump reaches the membrane but exports less calcium, so the lesion is catalytic

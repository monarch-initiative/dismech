    explanation: The direct measurement, in the only preparation where it can be made.
  - reference: PMID:23792079
    reference_title: "A new Atp2b2 deafwaddler allele, dfw(i5), interacts strongly with Cdh23 and other auditory modifiers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, extracellular Ca2+ ions surrounding the stereocilia are also required for rigidity of cadherin 23, a component of the stereocilia tip-link encoded by the Cdh23 gene."
    explanation: >-
      Why lowered endolymph calcium is a mechanical problem for the bundle and not only a
      chemical one.
- name: Outer Hair Cell Dysfunction and Degeneration
  description: >-
    Hair cells fail and are then lost, and the pattern is spatial: degeneration runs from
    the cochlear base towards the apex, which is the anatomical counterpart of a hearing
    loss that starts at high frequencies. In the Oblivion heterozygote, loss of auditory
    function precedes and is followed by that base-to-apex progression of hair cell
    degeneration; in the homozygote, basal-turn hair cells are completely degenerate while
    apical ones look normal.

    ATP2B2 is described as an outer hair cell gene in the gene-editing literature, and the
    rescue experiment in the Oblivion mouse is scored on outer hair cell survival and
    function, which is the strongest reason to name that cell type on this node.
  biological_scale: CELLULAR

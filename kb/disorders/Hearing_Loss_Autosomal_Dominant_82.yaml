phenotypes:
- name: Rapidly Progressive High-Frequency Hearing Impairment
  category: Auditory
  description: >-
    The defining phenotype, and unusually consistent. Newborn hearing screening is passed;
    a bilateral, symmetric, sensorineural loss is diagnosed at about three to six years;
    audiogram configurations are steeply downsloping; and the loss progresses rapidly.
    Severity across the reported subjects ranges from mild to profound. One subject reported
    onset at 55 years, which is the single exception in the series and had no audiometry
    before age 64. There is no evidence of retrocochlear pathology and no structural inner
    ear abnormality on imaging.
  phenotype_term:
    preferred_term: Progressive high-frequency sensorineural hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After normal newborn hearing screening, a rapidly progressive high-frequency hearing impairment was diagnosed at the age of about 3-6 years."
    explanation: >-
      The whole clinical shape in one sentence: passed screening, high-frequency, rapidly
      progressive, preschool diagnosis.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence for retrocochlear pathology or structural inner ear abnormalities."
    explanation: >-
      The negative findings that place the lesion in the cochlea rather than the nerve or
      the bony labyrinth.
- name: Tinnitus
  category: Auditory
  frequency: OCCASIONAL
  description: >-
    Two of the eleven affected subjects in the founding series reported tinnitus, both in
    the same family. That is 18 percent, which falls in the 5 to 29 percent band. It is
    curated because it is a symptom patients report and the entry would otherwise describe
    the disease purely in threshold terms, but the denominator is eleven people from five
    families and no series has looked for it systematically.
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects III.3 and IV.2 of \nfamily W18-0139 reported complaints of tinnitus."
    explanation: >-
      The two subjects and the count behind the band. Both are in one family, which is why
      the band is recorded rather than a rate.
- name: Normal Vestibular Function
  category: Vestibular
  frequency: EXCLUDED
  description: >-
    There is no vestibular syndrome in DFNA82, and the negative is an examined one - but the
    paper's abstract states it more strongly than its own results section does, and this
    record follows the results section.

    What was actually found: vestibular history from all subjects and extensive testing of
    at least one affected subject in every family but one revealed only minor vestibular
    abnormalities. Two subjects did report vestibular complaints, and in both the cause was
    identifiable and unrelated to the genotype - benign paroxysmal positional vertigo in one,
    perilymph leakage after cholesteatoma surgery in the other. Testing was incomplete in
    places: saccular function could not be measured in three ears and utricular function in
    one, and one family was not tested at all.

    Recorded here because the mouse diverges sharply - homozygous Oblivion mice have severe
    vestibular dysfunction by two weeks, and deafwaddler is named for its gait - so an entry
    that imported the animal phenotype wholesale would predict a balance disorder these
    patients do not have. The resolution is allele dose: the human alleles are heterozygous
    and the florid mouse vestibular phenotype belongs to homozygotes.

    `frequency: EXCLUDED` carries the absence, because that is what the HPOA exporter reads
    to emit a NOT-qualified row; `modifier: ABSENT` alone documents intent and is not
    consulted. Neither slot asserts a rate. EXCLUDED remains the right call - minor
    abnormalities with attributable causes are not a vestibular phenotype - but it is a
    judgement on incomplete testing rather than a clean negative, which is why the detail is
    written out here.

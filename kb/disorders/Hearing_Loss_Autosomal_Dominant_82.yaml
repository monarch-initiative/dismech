inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous loss-of-function ATP2B2 alleles. Three segregated through families with a
    dominant hearing loss pattern; two arose de novo in isolated index cases, which is what
    rules out an inherited second locus as the explanation in those two families and is the
    strongest single argument that one damaged ATP2B2 copy is sufficient.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three variants c.397+1G>A (p.?), c.1998C>A (p.Cys666*), and c.2329C>T (p.Arg777*), were identified in families with an autosomal dominant inheritance pattern of hearing impairment."
    explanation: The three inherited alleles and the pedigree pattern they segregate with.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two variants, c.1963G>T (p.Glu655*) and c.955delG (p.Ala319fs), occurred de novo."
    explanation: >-
      The two de novo alleles. A de novo truncating variant in an affected child of
      unaffected parents is the observation that makes single-copy loss sufficient rather
      than merely associated.
mechanistic_hypotheses:
- hypothesis_group_id: monogenic_pmca2_haploinsufficiency
  hypothesis_label: Monogenic haploinsufficiency for PMCA2 in outer hair cells
  status: CANONICAL
  description: >-
    One truncating or splice-disrupting ATP2B2 allele leaves too little functional PMCA2 to
    clear calcium from the stereocilia of outer hair cells, and hearing fails from the high
    frequencies down. This is the model the disease entity is defined by. It is supported
    in humans by two de novo truncating alleles and by segregation of three more, with
    CDH23 sequenced and excluded in the index cases; and in mice by several independent
    heterozygous lines, each showing progressive high-frequency-first loss.
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a digenic inheritance pattern of hearing impairment has been reported for heterozygous missense variants of ATP2B2 and CDH23, our findings indicate a monogenic cause of hearing impairment in cases with loss-of-function variants of ATP2B2."
    explanation: >-
      The authors' explicit separation of the monogenic entity from the digenic mechanism,
      stated as the conclusion of the study that established DFNA82.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A causal association with disease is further \nstrengthened by a pLI score of 1.00 reported for ATP2B2."
    explanation: >-
      The constraint argument for dosage sensitivity: a pLI of 1.00 means the gene is
      extremely intolerant of losing one functional copy, which is what a haploinsufficiency
      model requires. Graded COMPUTATIONAL because pLI is a population-genetic prediction
      rather than a measurement in these patients.
  - reference: PMID:23826306
    reference_title: "Two ENU-induced alleles of Atp2b2 cause deafness in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mice homozygous for these mutations display profound hearing loss. Heterozygotes display mild to moderate, progressive hearing loss."
    explanation: >-
      Independent ENU alleles reproducing the dose relationship the model predicts.
      Indirect with respect to the human disease: these are mouse missense alleles, not the
      truncating human ones.
- hypothesis_group_id: cdh23_modifier_interaction
  hypothesis_label: ATP2B2 as a modifier of hearing loss caused by other genes
  status: ALTERNATIVE
  description: >-
    A separate and genuine role for ATP2B2 that this entry deliberately does not curate as
    DFNA82. A hypofunctional missense variant, p.Val586Met, was associated with worse
    hearing in three of five siblings homozygous for a CDH23 mutation, and with increased
    loss in two unrelated people whose deafness came from a MYO6 mutation and from noise.
    The mouse counterpart is well characterised: extracellular calcium is needed for the
    rigidity of cadherin 23 in the tip link, and Atp2b2 and Cdh23 alleles interact in a
    dose- and frequency-dependent way.

    It is recorded here as ALTERNATIVE not because it is doubtful - it is well supported -
    but because it is a claim about a different genotype. The modifier evidence is missense
    and hypofunctional, the DFNA82 evidence is truncating and de novo, and treating a
    citation about one as evidence for the other is the specific error this entry is
    written to prevent.

    One thing the founding study is careful about and this entry should be too: rare CDH23
    variants co-occurred with the ATP2B2 allele in all five index cases. The authors argue
    each of them down - intronic and predicted not to affect splicing, synonymous, benign or
    common in population data, failing to co-segregate - and conclude monogenic causation.
    But they also state that a modifying effect of those CDH23 variants cannot be excluded.
    Monogenic causation and a superimposed modifier are not mutually exclusive claims, and
    this entry asserts the first without denying the second.
  evidence:
  - reference: PMID:15829536
    reference_title: "Modification of human hearing loss by plasma-membrane calcium pump PMCA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic evaluation revealed that a homozygous mutation in CDH23 (which encodes cadherin 23) caused the hearing loss in all five siblings and that a heterozygous, hypofunctional variant (V586M) in plasma-membrane calcium pump PMCA2, which is encoded by ATP2B2, was associated with increased loss in the three severely affected siblings."
    explanation: >-
      The founding modifier observation. Note what causes the deafness in these siblings:
      CDH23, in all five. The ATP2B2 variant changes severity, and the sentence says so.
  - reference: PMID:23792079
    reference_title: "A new Atp2b2 deafwaddler allele, dfw(i5), interacts strongly with Cdh23 and other auditory modifiers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, extracellular Ca2+ ions surrounding the stereocilia are also required for rigidity of cadherin 23, a component of the stereocilia tip-link encoded by the Cdh23 gene."
    explanation: >-
      The biochemical reason the two genes interact at all, which is what makes the modifier
      effect mechanistic rather than statistical.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to now ATP2B2 has only been reported as a modifier, or in a digenic mechanism with CDH23 for hearing impairment in humans."
    explanation: >-
      Graded NO_EVIDENCE with respect to DFNA82: the sentence describes the state of the
      literature before this study and bears on the modifier claim, not on whether
      heterozygous ATP2B2 loss of function causes hearing loss on its own.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although rare CDH23 variants co-\noccurred with ATP2B2 variants in all five index cases, our \nfindings indicate that mono-allelic loss-of-function variants \nof ATP2B2 are the underlying cause of HI."
    explanation: >-
      Both halves of the finding, and the second half is the one that is easy to drop: rare
      CDH23 variants were present alongside the ATP2B2 allele in every one of the five index
      cases. The authors argue them down individually and conclude monogenic causation, which
      is the claim this entry curates.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We cannot exclude a modifying effect of the CDH23  \nvariants on HI in the affected subjects in our study, as has \nbeen reported for mouse mutants of Atp2b2"
    explanation: >-
      The authors' own residual hedge, and the reason the modifier mechanism is kept as a
      named ALTERNATIVE hypothesis rather than dismissed. Monogenic causation and a
      superimposed CDH23 modifying effect are not mutually exclusive, and the study rules out
      the first reading of those variants without ruling out the second.
pathophysiology:
- name: ATP2B2 Heterozygous Loss of Function
  description: >-
    A single truncating or splice-disrupting ATP2B2 allele. The five reported human alleles
    are two nonsense changes, a frameshift, a further nonsense change and a canonical
    splice-donor variant; two arose de novo. This allele class is the definition of the
    entity and separates it from both of the other ATP2B2 phenotypes - the p.Val586Met
    hypofunctional missense modifier of CDH23-related deafness, and the de novo missense and
    penultimate-exon frameshift alleles that cause a neurodevelopmental and movement
    disorder.

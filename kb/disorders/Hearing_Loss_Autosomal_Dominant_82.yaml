- name: Atp2b2 Oblivion mouse treated with CRISPR-Cas9 ribonucleoprotein
  species: Mouse
  genotype: Atp2b2 Obl/+ treated with liposome-delivered Cas9 ribonucleoprotein targeting the Obl allele
  publication: PMID:37582836
  description: >-
    Allele-specific gene editing in a dominant deafness model. Liposome-mediated in vivo
    delivery of Cas9 ribonucleoprotein specifically edits the Oblivion allele, producing
    large deletions across the locus and indels; outer hair cell survival and function
    improve and hearing recovers. The same study extends the approach to a double-dominant
    mouse carrying both the Tmc1 Beethoven and the Atp2b2 Oblivion mutations, where
    targeting both yields partial recovery.
  genes:
  - preferred_term: ATP2B2
    term:
      id: hgnc:815
      label: ATP2B2
  modeled_mechanisms:
  - target: Outer Hair Cell Dysfunction and Degeneration
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The forward test: disable the mutant allele and the cells survive and work. That is a
      stronger argument for outer hair cell PMCA2 dysfunction being the operative lesion
      than the correlation between the allele and the phenotype.
    limitations: >-
      The strategy is allele-specific disruption, which suits a mouse missense allele that
      makes a bad pump. Four of the five human DFNA82 alleles already truncate the protein
      and the fifth destroys a splice donor, so there is nothing dominant left to cut out -
      destroying a null allele achieves nothing, and if the human disease is
      haploinsufficiency the correct strategy is the opposite one, adding a functional copy.
      Nothing in this study addresses that, and no human ATP2B2 allele has been edited. The
      digenic arm is a mouse carrying two engineered dominant mutations, not a model of
      ATP2B2-CDH23 modification in patients.
    readouts:
    - name: Outer hair cell survival and function after editing
      target: Outer Hair Cell Dysfunction and Degeneration
      direction: RESTORED
      interpretation: >-
        Cells that would have degenerated survive and function, and hearing recovers, tying
        the auditory outcome to the outer hair cell population.
      evidence:
      - reference: PMID:37582836
        reference_title: "Treatment of monogenic and digenic dominant genetic hearing loss by CRISPR-Cas9 ribonucleoprotein delivery in vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vivo genome editing promotes outer hair cell survival and restores their function, leading to hearing recovery."
        explanation: The rescue measurement behind this readout.
    evidence:
    - reference: PMID:37582836
      reference_title: "Treatment of monogenic and digenic dominant genetic hearing loss by CRISPR-Cas9 ribonucleoprotein delivery in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using a mouse model Atp2b2Obl/+, with a dominant hearing loss mutation (Oblivion), we show that liposome-mediated in vivo delivery of CRISPR-Cas9 ribonucleoprotein complexes leads to specific editing of the Obl allele."
      explanation: >-
        The intervention and the genotype it was applied to, which is the heterozygous dose
        relevant to a human dominant disease.
discussions:
- discussion_id: atp2b2_allele_class_determines_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    ATP2B2 carries three human phenotypes - a monogenic dominant deafness, a severity
    modifier for deafness caused by other genes, and a neurodevelopmental movement disorder.
    Does allele class fully determine which one a person gets?
  attaches_to:
  - genetic#ATP2B2
  - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
  - mechanistic_hypotheses#cdh23_modifier_interaction
  rationale: >-
    The current mapping is clean enough to write down and not clean enough to rely on.
    Truncating and splice-site heterozygotes get DFNA82. The hypofunctional missense
    p.Val586Met acts as a modifier. De novo missense changes, and frameshifts in the
    penultimate exon, cause the neurodevelopmental disorder. Three allele classes, three
    phenotypes.

    Two things spoil the tidiness. The neurodevelopmental series includes frameshift alleles
    - in the penultimate exon, where escape from nonsense-mediated decay would leave a
    truncated protein behind rather than removing it - so "frameshift" alone does not
    predict the phenotype, and position within the gene is doing work that nobody has
    characterised. And some of those individuals have hearing loss as well as the movement
    and cognitive features, so the phenotypes are not disjoint. Meanwhile the cell assays on
    the neurodevelopmental alleles found both loss- and gain-of-function effects on calcium
    handling, which is a different molecular behaviour from the simple dosage reduction
    DFNA82 is assumed to involve - and that assumption has never been tested, because no
    DFNA82 allele has been assayed for pump function at all.

    The question matters for reporting rather than for biology alone. A laboratory finding a
    novel heterozygous ATP2B2 variant in a child with isolated hearing loss has to decide
    which of three literatures applies, and the deciding features - truncating versus
    missense, de novo versus inherited, position relative to the last exon - are currently
    a pattern observed across two small series rather than a rule anyone has validated.
  evidence:
  - reference: PMID:37675773
    reference_title: "ATP2B2 de novo variants as a cause of variable neurodevelopmental disorders that feature dystonia, ataxia, intellectual disability, behavioral symptoms, and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The alleles comprised 5 missense substitutions that affected evolutionarily conserved sites and 2 frameshift variants in the penultimate exon."
    explanation: >-
      The allele composition of the neurodevelopmental series, including the two frameshifts
      whose position is what stops "truncating means DFNA82" from being a rule.
  - reference: PMID:37675773
    reference_title: "ATP2B2 de novo variants as a cause of variable neurodevelopmental disorders that feature dystonia, ataxia, intellectual disability, behavioral symptoms, and seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cell-based studies, all variants caused significant alterations in cytosolic calcium handling with both loss- and gain-of-function effects."
    explanation: >-
      The molecular contrast with the dosage model assumed for DFNA82, and the reason the
      two cannot be treated as the same lesion at different severities.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing in hearing impaired index cases of Dutch and Polish origins revealed five novel heterozygous (predicted to be) loss-of-function variants of ATP2B2."
    explanation: >-
      The DFNA82 allele class, with the authors' hedge - predicted to be - that is exactly
      the untested assumption this gap names.
  proposed_experiments:
  - experiment_id: exp_dfna82_pump_function_by_allele_class
    name: Calcium-handling assay across all reported ATP2B2 disease alleles
    description: >-
      Express each reported human ATP2B2 allele - the five DFNA82 truncating and splice
      alleles, the p.Val586Met modifier, and the neurodevelopmental missense and
      penultimate-exon frameshift alleles - in a common cell background, and measure protein
      level, plasma-membrane targeting, basal and stimulated calcium export, and resting
      cytosolic calcium, with wild-type and empty vector controls. Include a transcript-level
      assay of nonsense-mediated decay for every truncating allele, since whether a truncated
      protein persists is the variable that distinguishes the two frameshift classes.
    would_support:
    - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
    supporting_outcome:
    - >-
      DFNA82 alleles produce no detectable protein and no export activity while the
      neurodevelopmental alleles produce mistargeted or mixed-function protein, which would
      make simple dosage the DFNA82 mechanism and give laboratories a functional criterion
      to sort a novel variant by.
    would_refute:
    - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
    refuting_outcome:
    - >-
      One or more DFNA82 alleles escape nonsense-mediated decay and produce a protein with
      altered rather than absent activity, which would mean DFNA82 is not haploinsufficiency
      either, would place it on the same spectrum as the neurodevelopmental alleles, and
      would make allele-specific silencing rather than gene addition the rational therapy.
- discussion_id: atp2b2_editing_strategy_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Allele-specific CRISPR editing restores hearing in Oblivion mice, whose mutation makes a
    defective pump. Four of five human DFNA82 alleles already truncate PMCA2. What would
    editing accomplish in a patient?
  attaches_to:
  - animal_models#Atp2b2 Oblivion mouse treated with CRISPR-Cas9 ribonucleoprotein
  - pathophysiology#ATP2B2 Heterozygous Loss of Function
  rationale: >-
    The Oblivion rescue is a real technical achievement and it is aimed at the wrong lesion
    for this disease. Allele-specific disruption works when the mutant allele is actively
    harmful - a dominant-negative or gain-of-function protein whose removal helps. Oblivion
    fits: the pump is trafficked normally and pumps badly, so a mutant PMCA2 is sitting in
    the membrane doing a poor job, and cutting it out is a coherent intervention.

    DFNA82 alleles are nonsense, frameshift and splice-donor changes. If they behave as the
    authors predict, the mutant allele contributes nothing and there is nothing to disable.
    Editing it would move the patient from one functional copy to one functional copy. The
    intervention that follows from haploinsufficiency is the opposite one - supply a working
    copy - and that has not been attempted for ATP2B2 in any system.

    So the model and the disease agree on the phenotype and disagree on the therapeutic
    logic, which is a more specific mismatch than the usual species caveat and one that
    could send a translational programme in the wrong direction. Resolving it needs the
    functional assay proposed in the allele-class gap above, plus a mouse carrying a human
    truncating allele rather than Oblivion.

    A smaller mismatch sits alongside. The study's digenic arm is a mouse engineered to
    carry two dominant deafness mutations, Tmc1 Beethoven and Atp2b2 Oblivion. That is a
    demonstration that two alleles can be edited at once; it is not a model of the
    ATP2B2-CDH23 modifier interaction seen in patients, where the ATP2B2 contribution is a
    hypofunctional missense variant modifying a recessive CDH23 deafness. The word digenic
    covers both situations and they are not the same thing.
  evidence:
  - reference: PMID:37582836
    reference_title: "Treatment of monogenic and digenic dominant genetic hearing loss by CRISPR-Cas9 ribonucleoprotein delivery in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Large deletions encompassing the Obl locus and indels were identified as the result of editing."
    explanation: >-
      What the intervention does: it destroys the mutant allele. That is only useful if the
      mutant allele is doing harm.
  - reference: PMID:18974863
    reference_title: "The novel mouse mutation Oblivion inactivates the PMCA2 pump and causes progressive hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, analyses of hair cells in cultured utricular maculae of Obl/Obl mice and of the mutant Obl pump in model cells showed that the protein was correctly targeted to the plasma membrane."
    explanation: >-
      Why the Oblivion allele is a sensible editing target: a defective pump is present in
      the membrane. Human truncating alleles are not expected to leave one there.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three variants c.397+1G>A (p.?), c.1998C>A (p.Cys666*), and c.2329C>T (p.Arg777*), were identified in families with an autosomal dominant inheritance pattern of hearing impairment."
    explanation: >-
      The human allele class - two nonsense changes and a canonical splice-donor variant -
      which is what leaves no defective protein for an editing strategy to remove.
  - reference: PMID:37582836
    reference_title: "Treatment of monogenic and digenic dominant genetic hearing loss by CRISPR-Cas9 ribonucleoprotein delivery in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that in a double-dominant mutant mouse model, in which the Tmc1 Beethoven mutation and the Atp2b2 Oblivion mutation cause digenic genetic hearing loss, Cas9/sgRNA delivery targeting both mutations leads to partial hearing recovery."
    explanation: >-
      The digenic arm as the study defines it: two engineered dominant mutations. Recorded
      here so it is not read as bearing on the ATP2B2-CDH23 modifier interaction, which is a
      different genetic situation entirely.

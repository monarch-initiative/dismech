genetic:
- name: ATP2B2
  notes: >-
    ATP2B2 on 3p25.3 encodes PMCA2, one of four plasma-membrane calcium ATPases. In the ear
    it is the resident calcium pump of hair cell stereocilia; it is also expressed in
    cerebellar Purkinje cells and in lactating mammary epithelium, and the gene uses
    tissue-specific first exons, with cochlear hair cell expression carried by the alpha
    transcript.

    Three distinct human phenotypes are attributed to this gene and they correspond to three
    allele classes, which is the single most important thing to keep straight about it:

    Heterozygous truncating and splice-site alleles cause DFNA82, the isolated rapidly
    progressive high-frequency hearing loss this entry curates. A heterozygous hypofunctional
    missense allele, p.Val586Met, acts as a modifier that worsens hearing loss caused by
    something else - CDH23, MYO6, or noise. And de novo missense changes, plus frameshifts in
    the penultimate exon, cause a neurodevelopmental and movement disorder with dystonia,
    ataxia, intellectual disability, autistic features and seizures; in cell assays those
    alleles alter cytosolic calcium handling with both loss- and gain-of-function effects,
    which is a different molecular behaviour from simple haploinsufficiency.

    The neurodevelopmental series includes individuals with hearing loss alongside the
    movement and cognitive features, so the two are not cleanly separable by phenotype in
    every case; they are separable by allele class and by whether the presentation is
    isolated.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ATP2B2
    term:
      id: hgnc:815
      label: ATP2B2
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a digenic inheritance pattern of hearing impairment has been reported for heterozygous missense variants of ATP2B2 and CDH23, our findings indicate a monogenic cause of hearing impairment in cases with loss-of-function variants of ATP2B2."
    explanation: >-
      The allele-class distinction between DFNA82 and the digenic mechanism, in the words of
      the study that drew it.
  - reference: PMID:37675773
    reference_title: "ATP2B2 de novo variants as a cause of variable neurodevelopmental disorders that feature dystonia, ataxia, intellectual disability, behavioral symptoms, and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike described patients with hearing loss, the individuals displayed a spectrum of neurological abnormalities, ranging from ataxia with dystonic features to complex neurodevelopmental manifestations with intellectual disability, autism, and seizures."
    explanation: >-
      The third ATP2B2 phenotype, and the authors' own contrast with the hearing loss
      patients. This is the entity a reader must not merge into DFNA82.
  - reference: PMID:37675773
    reference_title: "ATP2B2 de novo variants as a cause of variable neurodevelopmental disorders that feature dystonia, ataxia, intellectual disability, behavioral symptoms, and seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cell-based studies, all variants caused significant alterations in cytosolic calcium handling with both loss- and gain-of-function effects."
    explanation: >-
      The molecular difference between the neurodevelopmental alleles and the DFNA82 ones:
      mixed loss and gain of function, not simple loss.
  - reference: PMID:15829536
    reference_title: "Modification of human hearing loss by plasma-membrane calcium pump PMCA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "V586M was detected in two unrelated persons with increased sensorineural hearing loss, in the other caused by a mutation in MYO6 (which encodes myosin VI) in one and by noise exposure, suggesting that this variant may modify the severity of sensorineural hearing loss caused by a variety of factors."
    explanation: >-
      The modifier allele acting on causes other than CDH23, which is what makes it a
      general severity modifier rather than a partner in one digenic pair.

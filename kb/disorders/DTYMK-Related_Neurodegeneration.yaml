progression:
- phase: Neonatal and early infantile presentation
  age_range: Birth to about 3 months
  notes: >-
    Head circumference is at or near the normal range at birth and there are no
    dysmorphic features. What is present instead is nonspecific: hypotonia,
    feeding failure requiring nasogastric support, and absent visual tracking.
    A neonatal MRI may show only slight underdevelopment of the caudate and
    frontal cortex, so this phase is easily mistaken for a static
    encephalopathy.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth, no apparent dysmorphic features were observed in both children.
    explanation: >-
      Establishes the unremarkable appearance at birth that makes early
      recognition difficult.
- phase: Infantile decline
  age_range: About 3 months to 2 years
  notes: >-
    The features that define the disorder all emerge in this window: head
    circumference falls away from the centiles toward minus 7 SD, tone converts
    from hypotonia to spasticity, seizures begin, no developmental milestone is
    gained, and serial imaging shows the cerebral hemispheres and basal ganglia
    atrophying. This is the phase in which the disorder becomes recognisably
    neurodegenerative rather than static.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      growth retardation, puffy body, seizures, failure to reach developmental
      milestones, microcephaly and severe, progressive atrophy of the cerebral
      hemispheres and basal ganglia
    explanation: >-
      Lists the features that became apparent after birth in both individuals of
      the founding series.
- phase: Terminal
  age_range: Second to third year of life in the individuals with reported outcomes
  notes: >-
    Both individuals in PMID:34918187 died after an intercurrent respiratory
    illness: individual I at 18 months from cardiopulmonary arrest during a
    respiratory illness, and individual II at 32 months from pneumonia followed
    by coma.

    Mortality is deliberately NOT carried as a phenotype frequency band. Outcome
    is reported for only 2 of the 5 published individuals, both fatal; the
    PMID:40696808 case was alive at report and PMID:31271740 states no outcome,
    so a mortality proportion cannot be computed. Separately, HP:0003819 "Death
    in childhood" sits under Clinical modifier rather than Phenotypic
    abnormality and is therefore not a valid phenotype_term in this schema, so
    this progression record is the correct home for the observation. The same
    reasoning and the same HPO limitation are recorded in
    SNIP1-Related_Neurodevelopmental_Disorder.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Died at age 18 months Died at age 32 months
    explanation: >-
      The Table 1 outcome row for the two individuals. The run-on wording is an
      artefact of the two-column table being extracted as a single line.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 32 months, the boy developed a pneumonia followed by coma
      and death.
    explanation: >-
      Documents the terminal event in individual II.
genetic:
- name: DTYMK
  gene_term:
    preferred_term: DTYMK
    term:
      id: hgnc:3061
      label: DTYMK
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    DTYMK sits at chromosome 2q37.3 and encodes dTMPK (deoxythymidylate kinase,
    thymidylate kinase, TMPK), a 212-residue cytosolic nucleoside monophosphate
    kinase. PMID:34918187 identifies its P-loop motif at residues 13-21, a
    DR(Y/H) motif at residues 96-98 and a LID domain at residues 135-150.
    Notably, neither disease variant lies within any of these named domains,
    which the authors state explicitly, so the near-total loss of activity in
    patient fibroblasts is not explained by direct disruption of a catalytic
    motif. Gene identity was verified against the MONDO gene-association
    relation `RO:0004003 HGNC:3061 ! DTYMK` on MONDO:0859241.

    A separate transcript-level point worth recording: PMID:34918187 uses
    NM_012145.3 and PMID:40696808 uses NM_012145.4 for the same c.242C>T
    p.Pro81Leu allele. The version differs, the variant does not.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified loss-of-function of DTYMK as the cause of a severe
      postnatal neurodegenerative disease and highlight the essential nature of
      dTTP synthesis in the maintenance of genome stability and neuronal
      survival
    explanation: >-
      The definitive gene-disease statement, supported in the same paper by
      patient enzymology and an independent animal model.
  - reference: PMID:31271740
    reference_title: "Deoxythymidylate kinase, DTYMK, is a novel gene for mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      have been diagnosed to harbor two heterozygous variants in trans in the
      DTYMK gene of the thymidine biosynthesis pathway
    explanation: >-
      The first report implicating DTYMK in human disease, in an independent
      family.
  - reference: PMID:38621447
    reference_title: "DTYMK is an essential gene in mice and heterozygosity does not cause neural tube defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dtymk-/- mice were confirmed to be embryonic lethal before E12.5, and
      Dtymk+/- mice on all three experimental diets did not show the presence of
      open neural tube defects, spina bifida or exencephaly.
    explanation: >-
      Establishes recessive essentiality rather than haploinsufficiency: total
      loss is embryonic lethal, one copy is enough. This is consistent with the
      human disease being caused by hypomorphic biallelic missense alleles
      rather than by biallelic nulls, and with the unaffected status of carrier
      parents.
  variants:
  - name: NM_012145.3:c.242C>T (p.Pro81Leu)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      The recurrent allele. Homozygous in the Egyptian individual II of
      PMID:34918187 and in the Mexican case of PMID:40696808, and inherited from
      the father in the compound heterozygous Dutch individual I. It substitutes
      a moderately conserved amino acid at a highly conserved nucleotide (phyloP
      5.29). In silico prediction is discordant: SIFT called it tolerated,
      PolyPhen-2 possibly damaging, MutationTaster disease-causing. In gnomAD as
      accessed by PMID:34918187 in May 2021 it appeared once, heterozygous only.
      The functional evidence, not the prediction, is what establishes
      pathogenicity.
    evidence:
    - reference: PMID:40696808
      reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic analysis identified a homozygous missense variant in DTYMK
        (NM_012145.4:c.242C>T; p.Pro81Leu).
      explanation: >-
        Names the allele in its homozygous state in the third independent
        family.
    - reference: PMID:34918187
      reference_title: "DTYMK is essential for genome integrity and neuronal survival."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Variant, protein Maternal: p.Asp128Asn; Paternal: p.Pro81Leu p.Pro81Leu
      explanation: >-
        The Table 1 protein-variant row, showing p.Pro81Leu as the paternal
        allele in individual I and homozygous in individual II. The run-on
        wording is an artefact of two-column table extraction.
  - name: NM_012145.3:c.382G>A (p.Asp128Asn)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      The maternal allele in the compound heterozygous Dutch individual I of
      PMID:34918187. It changes an amino acid conserved as far as Saccharomyces
      cerevisiae at a highly conserved nucleotide (phyloP 5.61). SIFT called it
      tolerated; MutationTaster and PolyPhen-2 called it disease-causing and
      probably damaging. Reported four times in gnomAD as accessed in May 2021,
      never homozygous.
    evidence:
    - reference: PMID:34918187
      reference_title: "DTYMK is essential for genome integrity and neuronal survival."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Variant, protein Maternal: p.Asp128Asn; Paternal: p.Pro81Leu p.Pro81Leu
      explanation: >-
        The Table 1 protein-variant row identifying p.Asp128Asn as the maternal
        allele in individual I.
    - reference: PMID:34918187
      reference_title: "DTYMK is essential for genome integrity and neuronal survival."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This variant is known to gnomAD and appears 4 times with a MAF of
        0.00001591, but only in a heterozygous state
      explanation: >-
        Documents the population-frequency argument for pathogenicity: the
        allele is vanishingly rare and has never been observed homozygous, which
        is the expectation for a recessive disease allele. The parallel
        conservation argument (the residue is conserved as far as Saccharomyces
        cerevisiae) is stated in this variant's description but is not quoted,
        because that sentence is broken across a line-break hyphen in the cached
        PDF extraction.
  - name: p.Ala99Thr
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      A third patient missense allele, characterised biochemically alongside
      p.Pro81Leu and p.Asp128Asn. Like them it converts the enzyme to a monomer
      with reduced substrate affinity and catalytic efficiency.

      Which patient carries this allele is deliberately NOT asserted.
      PMID:34926941 states that four variants have been identified in human
      patients without assigning them to individuals, and the only two families
      whose genotypes are individually published (PMID:34918187,
      PMID:40696808) carry p.Pro81Leu and p.Asp128Asn. It is therefore likely
      that p.Ala99Thr and the frameshift belong to the two siblings of
      PMID:31271740, whose specific variants are not named in the cached
      abstract, but that is an inference from elimination and is recorded here
      as such rather than curated as fact. Resolving it requires the Clin Chim
      Acta full text, which is not open-access and was not obtained for this
      entry.
    evidence:
    - reference: PMID:34926941
      reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four TMPK variants (P81L, A99T, D128N, and a frameshift) have been
        identified in human patients who suffered from severe neurodegenerative
        diseases.
      explanation: >-
        Names the complete set of four patient alleles known at the time,
        including this one, without assigning them to individuals.
  - name: DTYMK frameshift allele (position not specified in cached sources)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      A frameshift allele reported among the four patient variants
      characterised by PMID:34926941. The cached sources for this entry name it
      only as a frameshift; no cDNA or protein coordinate is given in any text
      quoted here, so none is asserted.

      This variant record intentionally carries no HGVS name. The deep-research
      report for this entry proposed c.287_320del p.Asp96fs on the basis of a
      ClinVar lookup, and that may well be correct, but ClinVar was not
      independently queried during this curation and no cached reference states
      that coordinate. Naming it here would be asserting an identifier this
      entry cannot support. A curator with ClinVar access should complete this
      record.
    evidence:

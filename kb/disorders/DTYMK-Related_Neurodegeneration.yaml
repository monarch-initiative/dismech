      snippet: >-
        Four TMPK variants (P81L, A99T, D128N, and a frameshift) have been
        identified in human patients who suffered from severe neurodegenerative
        diseases.
      explanation: >-
        The only statement in any cached source that a frameshift allele exists
        in this patient population.
diagnosis:
- name: Molecular diagnosis by exome sequencing
  description: >-
    All three published families were diagnosed by exome sequencing. There is no
    clinically distinctive gestalt and no abnormal metabolite: extensive
    metabolic work-up was normal in every individual in whom it was performed,
    including urinary organic acids, purines and pyrimidines, plasma amino
    acids, acylcarnitines, very-long-chain fatty acids, lactate and CSF amino
    acids. Molecular testing therefore establishes the diagnosis rather than
    confirming a biochemical suspicion.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evaluation, neuroimaging studies, and genetic analysis using WES
      followed by Sanger sequencing were performed.
    explanation: >-
      States the diagnostic route actually used in the fifth reported case,
      exome sequencing with Sanger confirmation.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive metabolic investigations were performed
    explanation: >-
      Supports the claim that biochemical investigation was tried and was not
      what made the diagnosis in individual I; the paragraph that follows this
      sentence lists the normal results.
- name: dTMPK enzyme activity assay in cultured fibroblasts
  description: >-
    Direct measurement of dTMP kinase activity in cultured skin fibroblasts is
    the functional confirmation of a candidate DTYMK genotype. In PMID:34918187
    the affected individual had 0.62 pmol/min/mg protein against 43.65 and 31.08
    in the heterozygous mother and father. The assay is a research method, not a
    clinical service, and requires a skin biopsy.
  diagnosis_term:
    preferred_term: dTMP kinase enzyme activity assay in cultured fibroblasts
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dTMPK enzyme activity of the individual is significantly lower than those
      of the parents
    explanation: >-
      Shows the assay discriminates an affected biallelic individual from
      heterozygous carriers, which is what makes it useful for variant
      interpretation.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cells of affected individuals, dTMPK enzyme activity was minimal, along
      with impaired DNA replication.
    explanation: >-
      Confirms that the biochemical readout in patient cells is a near-complete
      loss of activity.
- name: Brain MRI showing progressive cerebral and basal ganglia atrophy
  description: >-
    Serial imaging is what makes the disorder recognisable as neurodegenerative.
    The characteristic sequence is a near-normal or only mildly abnormal
    neonatal scan followed within months by severe hemispheric and basal ganglia
    atrophy with ventricular and subarachnoid enlargement, while the thalamus,
    brainstem and cerebellum look comparatively preserved. A single scan can be
    mistaken for a static encephalopathy; two scans cannot.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI at 6 months of age showed dramatic atrophy of the cerebral
      hemispheres with severe enlargement of the lateral ventricles and
      subarachnoid spaces
    explanation: >-
      Documents the imaging appearance at the age at which it becomes
      unmistakable.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with severe underdevelopment of the putamen
    explanation: >-
      The neonatal scan at 3 weeks in individual I showed only slight
      underdevelopment of the caudate and frontal cortex, with the putamen the
      one structure already severely affected. That focal early finding is the
      diagnostically useful part: the neonatal scan is otherwise close to normal
      and gives no hint of the devastation visible three months later. The
      sentence opening is not quoted because the cached PDF extraction
      hyphenates "underdevelopment" across a line break.
treatments:
- name: Supportive and symptomatic management
  action_category: THERAPEUTIC
  description: >-
    No disease-modifying therapy exists and none has been trialled. Reported
    management has been entirely symptomatic: nasogastric feeding for poor
    feeding, anti-seizure medication (phenobarbital in individual I,
    carbamazepine in individual II), and blood transfusion for the anaemia in
    individual II. Both individuals with reported outcomes nonetheless died in
    early childhood after intercurrent infection.
  notes: >-
    The DTYMK inhibitors developed in the oncology literature are conceptually
    contraindicated in a loss-of-function disorder and are deliberately not
    curated. Deoxynucleoside substrate-enhancement therapy is curated
    separately below, with its mechanistic caveat, because unlike the inhibitors
    it is genuinely on the table.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She developed recurrent febrile seizures with flat trace EEG at 6 months
      of age which were successfully treated with phenobarbital.
    explanation: >-
      Documents symptomatic anti-seizure treatment and its effect in individual
      I. It is the only treatment response reported anywhere in this literature.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutrition with naso-gastric tube was needed and well tolerated.
    explanation: >-
      Documents the feeding intervention used for the early feeding failure.
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further functional studies are needed to elucidate the mechanisms linking
      DTYMK dysfunction to neurodegeneration.
    explanation: >-
      The most recent report still frames the mechanism as incompletely
      understood, which is the state of play that precludes any targeted
      therapy.
- name: Deoxycytidine plus deoxythymidine substrate-enhancement therapy (investigational)
  action_category: THERAPEUTIC
  description: >-
    An open-label phase II trial of oral deoxycytidine plus deoxythymidine for
    mitochondrial DNA depletion disorders lists DTYMK among its eligible
    genotypes. This is the only interventional study anywhere that names DTYMK.
    No result specific to a DTYMK-mutant participant has been published, and no
    DTYMK patient is known to have been enrolled.
  notes: >-
    This is curated as an investigational eligibility, NOT as an evidenced
    treatment, and the mechanistic caveat is the point of the entry. Substrate
    enhancement with deoxythymidine works in TK2 deficiency because TK2 performs
    the FIRST salvage step, so supplying thymidine downstream of the defective
    kinase restores flux. In DTYMK deficiency the block is at dTMP to dTDP,
    which is DOWNSTREAM of where supplemental thymidine enters the pathway.
    Supplying more thymidine therefore adds substrate proximal to the block and
    has no obvious route to restoring dTTP. Supplemental deoxycytidine could in
    principle relieve pyrimidine pool imbalance, but that is speculation.
    Additionally, the trial's rationale is mtDNA depletion, and mtDNA depletion
    has never been demonstrated in a DTYMK patient (see the
    dtymk-mtdna-depletion mechanistic hypothesis). The inclusion of DTYMK in the
    eligibility list appears to follow from the 2019 paper's title rather than
    from demonstrated mtDNA depletion. Nothing here should be read as a
    recommendation.

    The trial record is quoted from the cached ClinicalTrials.gov summary at
    references_cache/clinicaltrials_NCT04802707.md, which already existed in
    this repository and was not created for this entry.
  evidence:
  - reference: clinicaltrials:NCT04802707
    reference_title: "A Phase II, Monocenter, Single Arm Study To Assess The Safety and Efficacy Of Combination Deoxycytidine and Deoxythymidine For Mitochondrial Depletion Disorders"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The subjects included are children (0-18Y), with positive MDS diagnosis
      and express mutations in one of the following genes: POLG, POLG2, C10orf2,
      RRM2B, MPV17, SUCLA2, SUCLG1, FBXL4, DTYMK.
    explanation: >-
      Documents that DTYMK is an eligible genotype for this deoxynucleoside
      trial. Curated as PARTIAL because eligibility is not efficacy and the
      trial's mitochondrial rationale is itself contested for this gene.
differential_diagnoses:
- name: Aicardi-Goutieres syndrome
  disease_term:
    preferred_term: Aicardi-Goutieres syndrome
    term:
      id: MONDO:0018866
      label: Aicardi-Goutieres syndrome
  description: >-
    The closest clinical and mechanistic mimic, and the comparison the primary
    paper itself draws. AGS also presents with progressive microcephaly,
    psychomotor retardation, white matter destruction, brain atrophy and death
    in early childhood, and at the mechanistic level both disorders are
    characterised by elevated ribonucleotide incorporation into genomic DNA -
    in AGS because RNase H2 cannot excise them, in DTYMK deficiency because the
    dTTP shortage causes them to be inserted in the first place.
  distinguishing_features:
  - >-
    Molecular: AGS is genetically heterogeneous (RNASEH2A/B/C, TREX1, SAMHD1,
    ADAR, IFIH1 and others) and is a type 1 interferonopathy; DTYMK deficiency
    is a single-gene nucleotide-biosynthesis defect with no interferon
    signature reported.
  - >-
    Imaging and laboratory: intracranial calcification and CSF lymphocytosis are
    characteristic of AGS and are not reported in DTYMK deficiency. Systemic
    features of AGS such as thrombocytopenia and hepatosplenomegaly are also
    absent.
  - >-
    Directionality of the ribonucleotide defect: in AGS, ribonucleotides
    accumulate because ribonucleotide excision repair fails. In DTYMK
    deficiency they accumulate because the replication machinery substitutes
    them for the missing deoxynucleotide. The shared readout has opposite
    upstream causes.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      White matter destruction and brain atrophy are shared phenotypic features
      of AGS and DTYMK deficiency.
    explanation: >-
      The primary paper's own statement of the clinical overlap that makes AGS
      the leading differential.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at the mechanistic level, AGS and DTYMK deficiency are similar as both are
      characterized by elevated ribonucleotide incorporation in the genome
    explanation: >-
      Establishes the shared mechanistic readout, which is why the two are
      confusable at the level of pathophysiology and not only at the bedside.
- name: CAD-related developmental and epileptic encephalopathy 50
  disease_term:
    preferred_term: developmental and epileptic encephalopathy 50 (CAD-related)
    term:
      id: MONDO:0014647
      label: developmental and epileptic encephalopathy, 50
  description: >-
    The other neurodegenerative disorder of the dTTP pathway, caused by
    biallelic CAD variants (HGNC:1424, verified by OAK on MONDO:0014647). CAD
    performs the first steps of de novo pyrimidine synthesis, several enzymatic
    steps upstream of dTMPK. Like DTYMK deficiency it is autosomal recessive,
    progressive, neurodegenerative, and begins in the first months or years of
    life with early-onset seizures and developmental regression; it also
    features anaemia.
  distinguishing_features:
  - >-
    Molecular: CAD (HGNC:1424, MONDO:0014647) versus DTYMK (HGNC:3061,
    MONDO:0859241). Different genes, different MONDO entities.
  - >-
    Position in the pathway: CAD acts at the entry to de novo pyrimidine
    synthesis, so its loss can in principle be bypassed by the salvage pathway.
    DTYMK sits downstream of the point where de novo and salvage converge, so
    its loss cannot be bypassed at all. This is the reason uridine
    supplementation is a rational therapy in CAD deficiency and is not one here.
  - >-
    Anaemia type: DEE50 features normocytic anaemia, whereas the one DTYMK
    individual with anaemia had microcytic hypochromic indices.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another human neurodegenerative disease, linked to dTTP metabolism and
      caused by pathogenic variants in CAD
    explanation: >-
      The primary paper names the CAD disorder as the comparator within the same
      metabolic pathway.
- name: TYMP-related mitochondrial neurogastrointestinal encephalomyopathy (MNGIE)
  disease_term:
    preferred_term: MNGIE (TYMP-related, MTDPS1)
    term:
      id: MONDO:0011283
      label: mitochondrial DNA depletion syndrome 1
  description: >-
    The third dTTP-pathway disorder named by the primary paper, caused by
    biallelic TYMP variants (HGNC:3148, verified by OAK on MONDO:0011283).
    Thymidine phosphorylase loss causes thymidine and dTTP to ACCUMULATE, which
    produces a dNTP pool imbalance and mtDNA depletion. This is the mirror image
    of DTYMK deficiency, where dTTP is depleted.
  distinguishing_features:
  - >-
    Molecular: TYMP (HGNC:3148, MONDO:0011283) versus DTYMK (HGNC:3061,
    MONDO:0859241).
  - >-
    Direction of the metabolic lesion: thymidine and dTTP accumulate in MNGIE
    and are depleted in DTYMK deficiency, so plasma thymidine and deoxyuridine
    are diagnostically elevated in MNGIE and are not a feature here.
  - >-
    Clinical: MNGIE is a multisystem disorder dominated by gastrointestinal
    dysmotility, cachexia, ptosis and ophthalmoplegia, peripheral neuropathy and
    leukoencephalopathy, typically with onset in the second or third decade.
    DTYMK deficiency is an infantile brain-restricted degeneration with no
    gastrointestinal or neuromuscular signature reported.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thymidine phosphorylase (TP) deficiency causes MNGIE
    explanation: >-
      The primary paper names MNGIE as the thymidine-pathway comparator.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When accumulation of dTTP occurs, dNTP pool imbalance is promoted, leading
      to mtDNA depletion
    explanation: >-
      States the accumulation-driven mechanism of MNGIE, which is the opposite
      of the depletion-driven mechanism curated for DTYMK deficiency.
mechanistic_hypotheses:
- hypothesis_group_id: dtymk-nuclear-genome-instability
  hypothesis_label: Nuclear genome instability from dTTP depletion
  status: CANONICAL
  description: >-
    The accepted model. Loss of dTMPK collapses the dTTP pool, which impairs
    nuclear DNA replication, drives ribonucleotide misincorporation into genomic
    DNA, and leaves DNA damage unrepaired. Neurons and oligodendrocytes die by
    apoptosis and the brain atrophies postnatally. This model is supported by
    patient enzymology, patient fibroblast replication assays and an independent
    zebrafish knockout.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified loss-of-function of DTYMK as the cause of a severe
      postnatal neurodegenerative disease and highlight the essential nature of
      dTTP synthesis in the maintenance of genome stability and neuronal
      survival
    explanation: >-
      The authors' own statement of the canonical model.
- hypothesis_group_id: dtymk-mtdna-depletion
  hypothesis_label: Mitochondrial DNA depletion
  status: ALTERNATIVE
  description: >-
    The original 2019 proposal was that DTYMK belongs to the mitochondrial DNA
    depletion syndrome gene set, on the basis of an in silico inference of mtDNA
    depletion in the more severely affected of two siblings. The 2022 study
    tested this directly in patient fibroblasts and found normal mtDNA copy
    number, no mtDNA deletions on long-range PCR, and normal respiratory chain
    complex I-V activities, alongside normal lactate and alanine in its own two
    individuals. The hypothesis is nevertheless kept as ALTERNATIVE rather than
    DEPRECATED for two reasons. First, the 2022 authors themselves state the
    caveat that fibroblast or blood mtDNA copy number is not representative of
    affected tissue and that they had no muscle biopsy. Second, and more
    substantively, the 2021 enzymology paper showed that in the same patient
    fibroblasts the loss of TMPK activity is COMPLETE in mitochondria and only
    near-complete in cytosol, which is a positive biochemical reason to keep a
    mitochondrial arm on the table.
  notes: >-
    This is the single most consequential disagreement in the DTYMK literature,
    and it matters for curation as well as for biology: the 2019 paper's title
    calls DTYMK a mitochondrial DNA depletion syndrome gene, so any curator
    reading titles alone would classify this disease into the wrong mechanism
    class. Conversely, a curator reading only the 2022 paper would discard the
    mitochondrial arm entirely and miss that DTYMK is a listed eligible genotype
    in an active deoxynucleoside trial for mitochondrial depletion disorders
    (clinicaltrials:NCT04802707, curated under treatments). The evidence list
    below deliberately carries the original claim, the original authors' own
    hedge, the disconfirming experiment with supports REFUTE, and the
    compartment finding that partially rehabilitates it, so the disagreement is
    visible in the data rather than resolved silently in prose.

    An earlier revision of this entry set this hypothesis to DEPRECATED. That
    was wrong, and specifically it was wrong because it had been written before
    PMID:34926941 was read. The status is corrected to ALTERNATIVE here.
  evidence:
  - reference: PMID:31271740
    reference_title: "Deoxythymidylate kinase, DTYMK, is a novel gene for mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Mitochondrial DNA depletion has been demonstrated in silico in the more
      severe sibling.
    explanation: >-
      The original claim, and its own abstract makes clear the evidence was in
      silico rather than measured.
  - reference: PMID:31271740
    reference_title: "Deoxythymidylate kinase, DTYMK, is a novel gene for mitochondrial DNA depletion syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DTYMK may be the missing link in the mitochondrial nucleotide salvage
      pathway but further characterization and additional evidence would be
      needed.
    explanation: >-
      The original authors' own hedge, which the later disconfirmation should be
      read against.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, we find no significant indications of mitochondrial
      dysfunction in fibroblasts of individual I.
    explanation: >-
      Direct experimental disconfirmation in patient-derived cells, covering
      mtDNA copy number, mtDNA integrity and respiratory chain function.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They predicted mitochondrial depletion in one of the affected
      individuals, but functional data to support a mitochondrial defect was not
      provided
    explanation: >-
      The 2022 authors' explicit characterisation of the evidentiary status of
      the 2019 claim.
  - reference: PMID:34926941
    reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      the P81L and D128N mutations led to a complete loss of TMPK activity in
      mitochondria and extremely low and unstable TMPK activity in cytosol
    explanation: >-
      A compartment-resolved measurement in the same patient fibroblasts showing
      the mitochondrial loss is total. This is a biochemical reason to keep the
      mitochondrial arm open, but it is curated as PARTIAL because loss of
      mitochondrial TMPK activity is not the same claim as mtDNA depletion, and
      this paper does not measure mtDNA.
discussions:
- discussion_id: dtymk-mtdna-controversy
  prompt: >-
    Is DTYMK deficiency a mitochondrial DNA depletion syndrome, as its first
    description asserted, or a nuclear genome instability disorder?
  kind: CONTROVERSY
  status: OPEN
  rationale: >-
    PMID:31271740 titles DTYMK a novel gene for mitochondrial DNA depletion
    syndrome on the basis of an in silico inference. PMID:34918187 measured
    mtDNA copy number, mtDNA integrity and respiratory chain activity in patient
    fibroblasts and found all normal, and instead demonstrated a nuclear
    phenotype: impaired DNA replication, ribonucleotide misincorporation and a
    persistent DNA damage response. The question is not fully closed because the
    2022 authors concede that fibroblast mtDNA copy number does not represent
    affected tissue and that muscle would be needed to settle it.
  proposed_experiments:
  - experiment_id: exp_dtymk_mtdna_affected_tissue
    name: mtDNA copy number in affected tissue rather than fibroblasts
    description: >-
      Measure mtDNA copy number in post-mortem brain and in skeletal muscle from
      an affected individual, the tissues in which depletion would actually
      matter. PMID:34918187 explicitly states that fibroblast and blood copy
      number is not representative and that muscle is required, so this is the
      experiment its own authors nominate.
  - experiment_id: exp_dtymk_dntp_pool_in_neurons
    name: Direct dNTP pool measurement in patient-derived neurons
    description: >-
      Quantify the dNTP pool, including dTTP, directly in patient-derived
      neurons or cerebral organoids. Existing measurements were made in
      fibroblasts and whole zebrafish larvae and were normal; the cell type that
      actually dies has never been assayed.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unfortunately, we do not have access to muscle tissue of the described
      individuals.
    explanation: >-
      The 2022 authors state that the tissue in which mtDNA depletion could
      actually have been assessed was unavailable to them, which is why their
      negative fibroblast result does not formally close the question. Their
      fuller statement of the caveat, that fibroblast and blood copy number is
      not representative of affected tissue, is broken across a line-break
      hyphen in the cached PDF extraction and so is paraphrased in this
      discussion's rationale rather than quoted.
- discussion_id: dtymk-zebrafish-eye-mismatch
  prompt: >-
    How much weight should the dtymk zebrafish eye phenotype carry for the human
    disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    The dtymk knockout zebrafish has small, deformed eyes lacking four of the
    six retinal layers, plus absent Meckel's cartilage. Neither human individual
    had a structural eye abnormality; their visual deficit was central, and
    formal ophthalmologic examination in individual II was normal. The model
    reproduces the microcephaly, neuronal apoptosis and early lethality
    faithfully, so it is a good model of the neurodegeneration, but its ocular
    and craniofacial readouts should not be back-projected onto the human
    phenotype. This matters for curation because it would be easy to add
    microphthalmia and a jaw anomaly to the human entry on the strength of a
    persuasive figure.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A notable difference between the human phenotype and the dtymk-deficient
      zebrafish model is the degree in which eye development is affected.
    explanation: >-
      The authors flag the human-model divergence themselves.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the eyes were morphologically normal in both individuals.
    explanation: >-
      Establishes that the human eye is structurally normal, which is the basis
      for excluding the ocular terms from the phenotype list.
- discussion_id: dtymk-viability-paradox
  prompt: >-
    How is any cell viable when the only route to dTTP is blocked?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    dTMPK sits downstream of the convergence of the de novo and salvage
    pathways, so a complete block should abolish dTTP entirely and be
    incompatible with life. Affected individuals nonetheless survived 18 and 32
    months; patient fibroblasts still cycle and in one study proliferated at a
    normal rate; and measured dTTP levels in both patient fibroblasts and mutant
    zebrafish were normal. The primary authors call this remarkable without
    explaining it and state that a compensatory pathway remains to be proven.
    Two candidate explanations have been advanced and one has been excluded.
    CMPK2 (UMP-CMP kinase 2, sometimes called TMPK2) was considered and rejected
    by PMID:34918187 on the grounds that it cannot use dTMP as a substrate. An
    unidentified TMPK-like activity remains open: PMID:35346037 reports a
    TMPK-like enzyme in zebrafish at later developmental stages with similar
    biochemical properties to Dtymk but not recognised by the Dtymk antibody,
    and PMID:34926941 independently infers a hitherto unknown compensatory
    TMPK-like enzyme from the normal proliferation of patient fibroblasts.
    Whether a human counterpart exists is unknown. Resolving this would also
    explain why the brain is selectively vulnerable, since a compensating enzyme
    with restricted expression is one of the two hypotheses PMID:34918187 offers
    for the tissue selectivity.
  proposed_experiments:
  - experiment_id: exp_dtymk_identify_compensatory_tmpk
    name: Biochemical identification of the compensatory TMPK-like activity
    description: >-
      Identify the postulated compensatory TMPK-like activity in human tissue,
      and test whether its expression is low in forebrain-derived structures.
      A compensating enzyme with restricted expression is one of the two
      explanations PMID:34918187 offers for why the brain is selectively
      vulnerable, so this experiment would resolve the compensation gap and the
      tissue-selectivity question at once.
  - experiment_id: exp_dtymk_residual_activity_ultrasensitive
    name: Ultrasensitive residual-activity assay of the patient alleles
    description: >-
      Determine the residual catalytic activity of recombinant p.Pro81Leu and
      p.Asp128Asn dTMPK with an assay sensitive well below the 0.62
      pmol/min/mg floor reported in patient fibroblasts, to test whether
      survival is explained by sub-detection-threshold residual activity rather
      than by a separate compensating enzyme.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

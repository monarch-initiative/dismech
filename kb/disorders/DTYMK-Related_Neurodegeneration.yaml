  notes: >-
    A single transfusion episode in one of five published individuals. Whether
    the anaemia is mechanistically part of the disease (a plausible consequence
    of a dTTP-supply defect in a proliferative lineage) or an incidental
    nutritional iron deficiency is not resolved by any cached reference; see the
    Hypochromic Microcytic Anemia phenotype entry, which records that

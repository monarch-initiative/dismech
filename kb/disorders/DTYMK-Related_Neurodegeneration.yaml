diagnosis:
- name: Molecular diagnosis by exome sequencing
  description: >-
    All three published families were diagnosed by exome sequencing. There is no
    clinically distinctive gestalt and no abnormal metabolite: extensive
    metabolic work-up was normal in every individual in whom it was performed,
    including urinary organic acids, purines and pyrimidines, plasma amino
    acids, acylcarnitines, very-long-chain fatty acids, lactate and CSF amino
    acids. Molecular testing therefore establishes the diagnosis rather than
    confirming a biochemical suspicion.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evaluation, neuroimaging studies, and genetic analysis using WES
      followed by Sanger sequencing were performed.
    explanation: >-
      States the diagnostic route actually used in the fifth reported case,
      exome sequencing with Sanger confirmation.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive metabolic investigations were performed
    explanation: >-
      Supports the claim that biochemical investigation was tried and was not
      what made the diagnosis in individual I; the paragraph that follows this
      sentence lists the normal results.
- name: dTMPK enzyme activity assay in cultured fibroblasts
  description: >-
    Direct measurement of dTMP kinase activity in cultured skin fibroblasts is
    the functional confirmation of a candidate DTYMK genotype. In PMID:34918187
    the affected individual had 0.62 pmol/min/mg protein against 43.65 and 31.08
    in the heterozygous mother and father. The assay is a research method, not a
    clinical service, and requires a skin biopsy.
  diagnosis_term:
    preferred_term: dTMP kinase enzyme activity assay in cultured fibroblasts
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dTMPK enzyme activity of the individual is significantly lower than those
      of the parents
    explanation: >-
      Shows the assay discriminates an affected biallelic individual from
      heterozygous carriers, which is what makes it useful for variant
      interpretation.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cells of affected individuals, dTMPK enzyme activity was minimal, along
      with impaired DNA replication.
    explanation: >-
      Confirms that the biochemical readout in patient cells is a near-complete
      loss of activity.
- name: Brain MRI showing progressive cerebral and basal ganglia atrophy
  description: >-
    Serial imaging is what makes the disorder recognisable as neurodegenerative.
    The characteristic sequence is a near-normal or only mildly abnormal
    neonatal scan followed within months by severe hemispheric and basal ganglia
    atrophy with ventricular and subarachnoid enlargement, while the thalamus,
    brainstem and cerebellum look comparatively preserved. A single scan can be
    mistaken for a static encephalopathy; two scans cannot.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI at 6 months of age showed dramatic atrophy of the cerebral
      hemispheres with severe enlargement of the lateral ventricles and
      subarachnoid spaces
    explanation: >-
      Documents the imaging appearance at the age at which it becomes
      unmistakable.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with severe underdevelopment of the putamen
    explanation: >-
      The neonatal scan at 3 weeks in individual I showed only slight
      underdevelopment of the caudate and frontal cortex, with the putamen the
      one structure already severely affected. That focal early finding is the
      diagnostically useful part: the neonatal scan is otherwise close to normal
      and gives no hint of the devastation visible three months later. The
      sentence opening is not quoted because the cached PDF extraction
      hyphenates "underdevelopment" across a line break.
biochemical:
- name: Deficient dTMPK activity in cultured fibroblasts
  presence: ABNORMAL
  context: >-
    An in vitro dTMPK assay on cultured skin fibroblasts from family I of
    PMID:34918187 gave 0.62 pmol/min/mg protein in the affected individual
    against 43.65 in the heterozygous mother and 31.08 in the heterozygous
    father, that is roughly 1.4 to 2.0 per cent of parental activity. The same
    assay in the zebrafish model gave 1.80 pmol/min/mg in mutant larvae against
    38.55 in siblings and 41.43 in unrelated wildtype larvae.
  readouts:
  - target: Loss of dTMP Kinase Catalytic Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The assay is a direct measurement of the enzymatic step the disease
      abolishes, so a near-zero value in a biallelic individual with clearly
      detectable activity in both carriers is the functional confirmation of a
      candidate genotype.
  notes: >-
    A research assay, not a clinical service, and it requires a skin biopsy. The
    numbers come from ONE family: n = 1 affected, 2 carriers, so there is no
    reference interval and no `reference_ranges` block is asserted. The
    heterozygous parents' values differ from each other by about 30 per cent
    with no stated measurement error, which is why no carrier range is claimed
    either. The zebrafish figures are recorded here because they are the same
    assay run as an internal control on the model, not as human data; the
    corresponding evidence item is tagged MODEL_ORGANISM.

    Quoting note: the sentence reporting the maternal value breaks the word
    "measured" across a line in the cached PDF extraction, so the quotable
    fragment stops before it.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts of the parents, dTMPK activity was readily detectable.
    explanation: >-
      Establishes the carrier baseline against which the affected value is
      interpreted.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the mother, an activity of 43.65 pmol/min/mg protein
    explanation: >-
      The maternal carrier value.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas the cells of the father showed lower activity: 31.08 pmol/min/mg
      protein.
    explanation: >-
      The paternal carrier value.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      was hardly detectable: 0.62 pmol/min/mg protein.
    explanation: >-
      The affected individual's value. The subject of the sentence is quoted
      separately above because the cached PDF extraction breaks "individual"
      across a line at this point.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dtymk mutant embryos on the other hand had barely detectable activity:
      1.80 pmol/min/mg protein.
    explanation: >-
      The same assay in the zebrafish model, included because it shows the human
      result is reproduced in an independent system rather than being an assay
      artefact.
- name: Normal routine metabolic work-up
  presence: NORMAL
  context: >-
    A normal biochemical screen is diagnostically load-bearing in this disorder
    rather than merely unremarkable. Glucose, lactate, ammonia, biotinidase,
    creatine kinase, acylcarnitines, amino acids, very long-chain fatty acids
    and urinary organic acids were all normal in individual II of PMID:34918187,
    and extensive metabolic investigation in individual I was likewise
    unrevealing. The corollary is that no first-line metabolic panel will raise
    this diagnosis and that a normal screen does not exclude it.
  readouts:
  - target: Block of Canonical dTTP Biosynthetic Flux
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Read together with the separately curated finding that steady-state dTTP
      pools are normal, the normal metabolic screen is what forces the
      mechanistic claim to be about FLUX rather than about a measurable
      metabolite abnormality. There is no analyte to test for.
  notes: >-
    Curated as a normal finding on purpose. This is the biochemical counterpart
    of the diagnosis section's statement that molecular testing establishes the
    diagnosis rather than confirming a biochemical suspicion. Denominator: the
    itemised panel is reported for individual II only; individual I is covered
    by a general statement that extensive metabolic investigations were
    performed. No purine/pyrimidine or dNTP-panel result is quoted here because
    the dTTP measurement is curated on the pathophysiology node it constrains.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic work-up including glucose, lactate, ammonia, biotinidase,
      creatine kinase, acylcarnitines, amino acids, very long-chain fatty acids
      and urinary organic acids profile were all normal.
    explanation: >-
      The itemised normal panel in individual II.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive metabolic investigations were performed
    explanation: >-
      Documents that biochemical investigation was undertaken in individual I
      and did not make the diagnosis.
histopathology:
- name: Global neuronal loss with sparing of dentate nucleus and brainstem
  description: >-
    Autopsy of individual I in PMID:34918187 showed severe atrophy of the
    neocortex, cerebral white matter and basal ganglia with massive neuronal
    dropout, while the brainstem, cerebellar dentate nucleus and the gross size
    of the cerebellum were preserved. The sparing pattern is the diagnostically
    informative part: this is not a uniform encephaloclastic process but a
    selective one that leaves specific structures intact, matching the imaging
    observation that brainstem and cerebellum look comparatively normal on MRI.
  diagnostic: true
  notes: >-
    No finding_term is bound. The HistopathologyFindingTerm binding admits only
    NCIT terms reachable from the Histopathology Result branch (NCIT:C83490)
    plus a handful of HP rosette terms, and OAK searches of the NCIT
    Morphologic Finding branch on 2026-08-01 returned no term for neuronal loss
    or for a regional sparing pattern (candidates audited and rejected:
    NCIT:C50774 Tissue Degeneration and NCIT:C120874 Degeneration and Atrophy,
    both too generic to carry the sparing claim, which is the whole point of
    this record). The corresponding clinical phenotype is separately bound to
    HP:0002529 in the phenotypes section.

    Neuropathology exists for exactly ONE of the five published individuals, so
    no frequency is asserted for any entry in this section.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gross neuropathological examination showed severe atrophy of the
      neocortex,
    explanation: >-
      Opening of the gross neuropathology description. The sentence continues
      "cerebral white matter and basal ganglia", which cannot be quoted
      contiguously because the cached PDF extraction breaks "matter" across a
      line.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with normal size of brainstem and cerebellum
    explanation: >-
      The gross sparing of brainstem and cerebellum, in the same sentence.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only sparing the dentate nucleus and brain stem.
    explanation: >-
      The authors' own summary of the sparing pattern. The clause preceding this
      one is not quoted because the extraction breaks "massive" across a line.
- name: Anisomorphic astrogliosis of the cerebral cortex
  description: >-
    The cortex of individual I showed intense anisomorphic astrogliosis with
    only a minimal degree of vascular proliferation, and reactive gliosis was
    also present in the neostriatum and thalamus alongside neuronal loss.
  finding_term:
    preferred_term: anisomorphic astrogliosis
    term:
      id: NCIT:C26783
      label: Gliosis
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intense anisomorphic astrogliosis
    explanation: >-
      The cortical gliosis finding.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      show loss of neurons and reactive gliosis.
    explanation: >-
      The same reaction in the neostriatum and thalamus.
- name: Oligodendrocyte loss by apoptosis with paucity of myelin
  description: >-
    Deep periventricular white matter showed loss of oligodendrocytes with
    moderate microglial activation; the more peripheral hemispheric white matter
    showed massive ameboid microglial activation, lack of myelin and loss of
    oligodendrocytes by apoptosis, with paucity of myelin throughout the
    hemispheres and capsules. Caspase-3 was among the stains used. This is the
    histological evidence that the oligodendroglial arm of the disease is
    apoptotic rather than purely hypomyelinating.
  finding_term:
    preferred_term: apoptotic loss of oligodendrocytes
    term:
      id: NCIT:C176399
      label: Increased Apoptosis
  notes: >-
    The myelin and microglial components of this finding have no bindable term
    in the NCIT Histopathology Result branch (NCIT:C117277 Demyelination was
    audited on 2026-08-01 and is NOT reachable from NCIT:C83490 or NCIT:C35867,
    so it cannot be used here), so the record is bound to the apoptosis finding
    and the rest is carried in the description.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and loss of oligodendrocytes by apoptosis
    explanation: >-
      The apoptotic mechanism of oligodendrocyte loss.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      spheric white matter shows massive activation of microglia with ameboid
      morphology
    explanation: >-
      The microglial reaction in peripheral white matter. The quote starts
      mid-word because the cached PDF extraction breaks "hemispheric" across a
      line immediately before it.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      show paucity of myelin throughout the cerebral hemispheres and capsules
    explanation: >-
      The myelin deficit, on whole mounts of the cerebral hemispheres.
- name: Cerebellar granular and Purkinje cell layer neuronal loss
  description: >-
    Microscopy of a cerebellum that was of normal gross size, and that had
    looked normal on MRI, nevertheless showed loss of neurons in the granular
    and Purkinje cell layers with a moderate Bergmann glial reaction. The
    cerebellum is therefore involved microscopically even where imaging and
    gross examination suggest it is spared, which is a caution against reading
    normal cerebellar imaging as normal cerebellum.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      shows loss of neurons in the granular and Purkinje cell layer
    explanation: >-
      The cerebellar microscopic finding.
treatments:
- name: Supportive and symptomatic management
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy exists and none has been trialled. All reported
    management has been symptomatic and is curated as separate atomic entries
    below: anti-seizure pharmacotherapy, nasogastric tube feeding, and blood
    transfusion for the anaemia in individual II, with genetic counselling
    recorded as a non-therapeutic action. Both individuals with reported
    outcomes nonetheless died in early childhood after intercurrent infection.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    This entry is the umbrella statement that management is supportive only; the
    individual interventions are curated one per entry below rather than bundled
    here. No cached reference for this entry uses the words "supportive care",
    "palliative" or "multidisciplinary" — literal case-insensitive searches for
    `supportiv`, `palliat`, `symptomatic`, `multidisciplinary`, `no cure`,
    `no specific`, `no effective` and `no disease-modif` across
    references_cache/PMID_34918187.md, PMID_40696808.md, PMID_31271740.md and
    PMID_34926941.md on 2026-08-01 all returned zero hits. The NCIT:C15747
    binding is therefore a curatorial roll-up of the individually evidenced
    symptomatic interventions, not a quoted characterisation, and no separate
    "multidisciplinary/palliative care" treatment entry has been created because
    nothing in the cached literature would support one.

    The DTYMK inhibitors developed in the oncology literature are conceptually
    contraindicated in a loss-of-function disorder and are deliberately not
    curated. Deoxynucleoside substrate-enhancement therapy is curated
    separately below, with its mechanistic caveat, because unlike the inhibitors
    it is genuinely on the table.
  evidence:
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further functional studies are needed to elucidate the mechanisms linking
      DTYMK dysfunction to neurodegeneration.
    explanation: >-
      The most recent report still frames the mechanism as incompletely
      understood, which is the state of play that precludes any targeted
      therapy.
- name: Anti-seizure pharmacotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Both individuals in PMID:34918187 received an anti-seizure drug: individual
    I was treated with phenobarbital for recurrent febrile seizures at 6 months,
    reported as successful, and individual II was treated with carbamazepine for
    severe myoclonic jerks at 15 months, with no response stated. These are the
    only two anti-seizure agents named anywhere in the DTYMK literature and the
    phenobarbital response is the only treatment response reported for this
    disease.
  treatment_term:
    preferred_term: anti-seizure pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Myoclonic seizure
    term:
      id: HP:0032794
      label: Myoclonic seizure
  notes: >-
    Two agents used in two children in one case report. This is a record of what
    was done, not a treatment recommendation, and no comparative or sequential
    data exist. The deep-research artefact for this entry raises the concern
    that carbamazepine can exacerbate myoclonic seizures; that pharmacological
    claim appears in NO cached reference for this entry and is recorded here as
    an unsourced caveat rather than curated as fact. What the cached text does
    establish is only that a clinician chose carbamazepine for individual II's
    myoclonic jerks and that no response was reported.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She developed recurrent febrile seizures with flat trace EEG at 6 months
      of age which were successfully treated with phenobarbital.
    explanation: >-
      Documents symptomatic anti-seizure treatment and its effect in individual
      I. It is the only treatment response reported anywhere in this literature.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He developed severe myoclonic jerks at 15 months of age, which were
      treated with carbamazepine.
    explanation: >-
      Documents carbamazepine use for individual II's myoclonic seizures.
      Curated as PARTIAL because the sentence records only that the drug was
      given; unlike the phenobarbital sentence it makes no claim about seizure
      control, so it supports the intervention but not any efficacy.
- name: Nasogastric tube feeding
  action_category: THERAPEUTIC
  description: >-
    Individual I of PMID:34918187 required nasogastric tube feeding for the
    early feeding failure and tolerated it well. This is the only nutritional
    intervention reported in the DTYMK literature.
  treatment_term:
    preferred_term: nasogastric tube feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  notes: >-
    No therapeutic_modality is asserted. Enteral tube feeding is not one of the
    platforms in TherapeuticModalityEnum, and CLAUDE.md explicitly warns against
    mechanically tagging nutritional-support actions as BEHAVIORAL. NCIT:C93322
    Enteral Tube Feeding was chosen over the broader NCIT:C15433 Nutritional
    Support because the cached text names the route (naso-gastric tube)
    specifically; both are reachable from NCIT:C25218, verified with OAK on
    2026-08-01.
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nutrition with naso-gastric tube was needed and well tolerated.
    explanation: >-
      Documents the feeding intervention used for the early feeding failure.
- name: Blood transfusion for anaemia
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Individual II of PMID:34918187 was admitted at 7 months with fever and
    vomiting, was found to have severe anaemia, and was treated with blood
    transfusion. Repeated later testing continued to show microcytic hypochromic
    anaemia, so the transfusion addressed an episode rather than the underlying
    haematological abnormality.
  treatment_term:

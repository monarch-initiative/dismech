name: DTYMK-Related Neurodegeneration
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  Childhood-onset neurodegeneration with progressive microcephaly (CONPM,
  MIM 619847) is an ultra-rare autosomal recessive disorder caused by biallelic
  variants in DTYMK, which encodes deoxythymidylate kinase (dTMPK, also called
  thymidylate kinase or TMPK). dTMPK catalyses the phosphorylation of dTMP to
  dTDP, the penultimate step in dTTP biosynthesis and the single point at which
  the de novo and salvage routes to dTTP converge, which makes the enzyme the
  bottleneck of the whole pathway. Affected children are born without
  malformations and with a head circumference in or near the normal range, then
  fail to make any developmental progress, develop severe and progressively
  worsening microcephaly, seizures, growth failure and a movement disorder that
  evolves from neonatal hypotonia to spasticity, and show dramatic postnatal
  atrophy of the cerebral hemispheres and basal ganglia while the brainstem is
  relatively spared. Death has occurred in the second or third year of life in
  the individuals with reported outcomes. The proximate mechanism is restriction
  of the dTTP pool available for nuclear DNA replication and repair, with
  consequent impaired DNA replication, elevated ribonucleotide misincorporation
  into genomic DNA, an abnormal DNA damage response, and apoptotic loss of
  neurons and oligodendrocytes.
notes: >-
  Named-entity-confusion guardrail. This entry is anchored strictly on
  MONDO:0859241 / OMIM:619847 / DTYMK (HGNC:3061). The anchor was confirmed
  before any curation by running `uv run runoak -i sqlite:obo:mondo relationships
  --direction up MONDO:0859241` and reading the returned line
  `MONDO:0859241 RO:0004003 HGNC:3061 ... DTYMK`, and by
  `uv run runoak -i sqlite:obo:mondo mappings MONDO:0859241`, which returns
  OMIM:619847, UMLS:C5676972, MEDGEN:1801540 and GARD:0027309 and no ORPHA code.
  Every DTYMK-disease source cited here names DTYMK or its zebrafish orthologue
  `dtymk` in its title. There is one deliberate exception, added on review:
  PMID:35111754, an autosomal-recessive-primary-microcephaly review, is cited
  ONLY in the MCPH differential-diagnosis entry and only for statements about
  MCPH. It makes no claim about DTYMK and is not evidence for anything in this
  entry other than the comparator.

  The dominant confusable literature for this gene is oncology, not another
  Mendelian disorder. A PubMed search for `DTYMK[tiab] OR dTMPK[tiab] OR
  "thymidylate kinase"[tiab]` run on 2026-08-01 returns a set in which the great
  majority of recent records are cancer-biology or antimicrobial
  drug-design papers in which DTYMK is OVEREXPRESSED and its INHIBITION is the
  proposed therapy - the mechanistic opposite of this recessive
  loss-of-function disorder. None of those papers is cited here, and no
  DTYMK inhibitor is curated as a treatment. Restricting that search to
  clinical terms and reading the titles leaves only four papers that concern
  human DTYMK disease or its animal model: PMID:31271740, PMID:34918187,
  PMID:35346037 and PMID:40696808. All four are cited. To the best of this
  search, that is the entire disease literature.

  Contrast entities were each verified with OAK rather than typed from memory.
  Aicardi-Goutieres syndrome is MONDO:0018866 (label confirmed by
  `runoak -i sqlite:obo:mondo relationships --direction up MONDO:0018866`, which
  also shows it is a type 1 interferonopathy of childhood and a leukodystrophy).
  The MNGIE differential is bound to MONDO:0011283 `mitochondrial DNA depletion
  syndrome 1`, whose OAK relationships include `RO:0004003 HGNC:3148 ! TYMP`;
  the parent grouping term MONDO:0017575 carries no gene relation, so the
  gene-bearing child term was used. The CAD differential is bound to
  MONDO:0014647 `developmental and epileptic encephalopathy, 50`, whose OAK
  relationships include `RO:0004003 HGNC:1424 ! CAD`. The entry's own MONDO
  superclass, MONDO:0024237 `inherited neurodegenerative disorder`, is
  deliberately NOT listed as a differential.

  Onset discipline. The disease label says "childhood-onset", but the HPO
  CHILDHOOD onset category (HP:0011463) is bounded at 1 to 5 years and the
  reported ages do not fit it. In PMID:34918187 individual I was hypotonic at
  birth, needed nasogastric feeding from day 3, and had seizures at 6 months;
  individual II had a head noted to be small at birth and no visual tracking in
  the first months of life. Structured onset is therefore recorded as INFANTILE
  where a first-year age is documented, and the disease-name mismatch is called
  out rather than propagated. The one individual who does fit a childhood-onset
  description is the 2-year-old in PMID:40696808, and only because that is the
  age at ascertainment, not the age at onset.

  Frequency discipline. Only five affected individuals have been published: two
  siblings in PMID:31271740, two unrelated children in PMID:34918187, and one
  child in PMID:40696808 (which states its case is the fifth reported). Bands
  are asserted only for features documented in every individual for whom the
  feature is reported, and every band carries its explicit numerator and
  denominator in the phenotype's `notes:`. Where the denominator is a subset
  (for example only the three individuals with published neuroimaging), that
  subset is named. Features seen in a single individual - the anaemia and raised
  transaminases, the micropenis and undescended testes - carry no band at all,
  because 1 of 5 on a total series of five is not a frequency estimate.

  GeneReviews. No GeneReviews chapter exists. Three PubMed E-utilities searches
  were run on 2026-08-01 and all three returned zero results: `DTYMK
  GeneReviews[All Fields]`, `thymidylate kinase GeneReviews[All Fields]` and
  `childhood-onset neurodegeneration with progressive microcephaly
  GeneReviews[All Fields]`.

  Structured sources unavailable, and in this case also absent upstream. Two
  things were checked rather than assumed. (1) Orphanet: EBI OLS4 searches of
  ORDO for `DTYMK` and for `childhood-onset neurodegeneration with progressive
  microcephaly` were run on 2026-08-01 and both returned `numFound: 0`, and
  MONDO:0859241 itself carries no ORPHA cross-reference. There is therefore no
  ORPHA code to cite, not merely an uncachable one. Independently,
  `data/orphadata/` in this working tree contains only a MANIFEST.yaml stub with
  no bulk data and the sha256 refresh is a known blocker (#7234, #7539, #7199,
  #7522), so no ORPHA record could have been generated regardless. (2) ClinGen:
  `data/clingen/` likewise contains only a MANIFEST.yaml stub, and a request to
  `https://search.clinicalgenome.org/api/curations/gene/DTYMK` on 2026-08-01
  returned an HTML page rather than a curation record, so no ClinGen
  gene-disease validity, dosage or actionability assertion could be retrieved or
  cited. The gene-disease relationship is supported here entirely by primary
  literature. This is a genuine gap, not a claim that no ClinGen curation exists.

  Full text versus abstract. PMID:34918187 and PMID:35346037 are cached as
  open-access full text, so several snippets in this entry are taken from their
  bodies (the clinical descriptions of individuals I and II, Table 1 rows, the
  enzyme-activity and EdU results, and the discussion paragraphs on
  Aicardi-Goutieres syndrome, MNGIE and DEE50) rather than from their abstracts.
  Snippets from PMID:31271740, PMID:34926941, PMID:38621447 and PMID:40696808
  are abstract-only, because those are abstract-only caches; the full-text
  fetch for PMID:34926941 and PMID:38621447 returned HTTP 403. A few snippets
  from the PMID:34918187 full text begin or end mid-word, because the cached
  PDF extraction hyphenates across line breaks; those are quoted exactly as
  cached and the truncation is flagged in the relevant explanation rather than
  silently repaired.

  Deep research provenance. `just research-disorder claude_code
  DTYMK-Related_Neurodegeneration` was run on 2026-08-01 (928 seconds, 5 web
  searches, 61 turns, 21 citations, models claude-haiku-4-5 and
  claude-opus-5[1m]); the report is at
  research/DTYMK-Related_Neurodegeneration-deep-research-claude_code.md. Its NEC
  profile was checked before use: DTYMK occurs 102 times with word-boundary
  matching against a next-highest of 5 (TK2), and every hit read in context
  refers to the gene. Three of the report's findings materially corrected an
  earlier draft of this entry and are worth naming, because each was an error
  the draft would have shipped. (1) The draft marked the dTTP chemical as
  DECREASED; the report pointed to a full-text passage showing measured dTTP
  levels are NORMAL, so the node was reframed as a block of flux. (2) The draft
  marked the mtDNA-depletion hypothesis DEPRECATED; the report surfaced
  PMID:34926941, which shows mitochondrial TMPK activity loss is complete, so
  the status was corrected to ALTERNATIVE. (3) The draft asserted in a treatment
  note that no source proposes nucleoside supplementation; the report identified
  clinicaltrials:NCT04802707, which lists DTYMK as an eligible genotype, so that
  false-absence claim was removed and the trial is now curated with its
  mechanistic caveat.

  Report content deliberately NOT curated. The report states elevated lactate
  (2/2) and hyperalaninemia (1/2) in the PMID:31271740 siblings, and gives
  prenatal details (breech presentation, small for gestational age) and a
  laryngomalacia mention. None of these appears in any cached reference
  available here, so none is curated. It also proposes a specific variant
  pairing for the PMID:31271740 siblings and a ClinVar coordinate for the
  frameshift allele; both are flagged in the report itself as requiring
  verification against a full text that was not obtained, and both are recorded
  in this entry as explicitly uncurated inferences rather than as facts. Kinetic
  constants from Table 2 of PMID:34926941 are not curated because only the
  abstract is cached. The report's suggested gnomAD constraint metrics were not
  retrievable in its own session and are not asserted here.

  Review response (PR #7783, 2026-08-01). Changes made in response to review, so
  the record shows what moved and what did not. (1) The single bundled
  "Supportive and symptomatic management" treatment was split into five atomic
  entries - the umbrella, anti-seizure pharmacotherapy, nasogastric tube
  feeding, blood transfusion and genetic counselling - and every one now carries
  an NCIT `treatment_term` verified with OAK and confirmed reachable from
  NCIT:C25218, with CHEBI therapeutic agents on the two drug entries. (2) The
  visual-impairment phenotype was retermed from HP:0000505 to HP:0100704
  Cerebral visual impairment, which is what the existing snippets actually
  support. (3) A `biochemical:` section now carries the fibroblast dTMPK numbers
  and the diagnostically load-bearing NORMAL metabolic screen; a
  `histopathology:` section carries the autopsy findings including the sparing
  pattern; a `clinical_trials:` entry makes NCT04802707 queryable as a trial.
  (4) An MCPH differential was added. (5) Three evidence classifications were
  corrected: the zebrafish paper's background sentence about human microcephaly
  is now OTHER rather than HUMAN_CLINICAL; the normal-dTTP measurement on the
  flux node is now PARTIAL rather than REFUTE, because it refutes pool depletion
  and the node claims a flux block; and an explanation that said the causal link
  was "curated as PROBABLE" - a value that is not in the enum - was rewritten to
  name the actual value.

  Declined on review, with reasons. No "multidisciplinary supportive/palliative
  care" treatment entry was created: literal case-insensitive searches for
  `supportiv`, `palliat`, `symptomatic`, `multidisciplinary`, `no cure`, `no
  specific`, `no effective` and `no disease-modif` across the four cached
  disease references on 2026-08-01 returned zero hits, so there is no quotable
  basis for one, and inventing it would be exactly the unsourced padding this
  entry has otherwise avoided. Nutritional-support and deoxynucleoside entries
  were NOT bound to NCIT:C15433 Nutritional Support as the research artefact
  suggested: NCIT:C93322 Enteral Tube Feeding is more specific and matches the
  quoted route, and the deoxynucleoside trial is pharmacotherapy rather than
  nutrition. No frequency band was added anywhere in the new sections;
  neuropathology exists for one of five individuals and the enzyme assay for one
  family, so no denominator supports a band.
disease_term:
  preferred_term: childhood-onset neurodegeneration with progressive microcephaly
  term:
    id: MONDO:0859241
    label: neurodegeneration, childhood-onset, with progressive microcephaly
parents:
- Inherited Neurodegenerative Disorder
- Inborn Error of Pyrimidine Metabolism
synonyms:
- CONPM
- childhood-onset neurodegeneration with progressive microcephaly
- DTYMK deficiency
- deoxythymidylate kinase deficiency
- thymidylate kinase (dTMPK) deficiency
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The clinical burden is almost entirely neurological: progressive
      microcephaly, absent neurodevelopment, seizures, spasticity and
      radiologically and pathologically confirmed cerebral and basal ganglia
      atrophy.
    evidence:
    - reference: PMID:40696808
      reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This ultra-rare condition is characterized by progressive neurological
        regression, epilepsy, severe microcephaly, and global cerebral atrophy.
      explanation: >-
        States in one sentence that the defining features of the disorder are
        neurological, supporting a neurologic chapter assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive Mendelian disorder identified and
      diagnosed by exome sequencing.
    evidence:
    - reference: PMID:40696808
      reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Childhood-onset neurodegeneration with progressive microcephaly (CONPM)
        is a rare autosomal recessive disorder caused by pathogenic variants in
        the DTYMK gene.
      explanation: >-
        Names the entity, its autosomal recessive Mendelian basis and its causal
        gene in a single sentence.
  icimd_category:
  - classification_value: pyrimidine_metabolism
    notes: >-
      dTMP and dTTP are pyrimidine deoxynucleotides, and dTMPK acts on the dTMP
      to dTDP step, so the defect sits in pyrimidine nucleotide metabolism. This
      matches the way MONDO classifies the two other dTTP-pathway disorders that
      PMID:34918187 uses as comparators: both MONDO:0011283 (TYMP, MNGIE) and
      MONDO:0014647 (CAD, DEE50) are subclasses of MONDO:0019238 `inborn
      disorder of pyrimidine metabolism`. MONDO:0859241 itself is not currently
      placed under that grouping term, so this classification is a curatorial
      judgement rather than an inherited MONDO assertion.
    evidence:
    - reference: PMID:34918187
      reference_title: "DTYMK is essential for genome integrity and neuronal survival."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This makes dTMPK the bottleneck for dTTP biosynthesis
      explanation: >-
        Places the enzymatic defect squarely in the biosynthesis of a pyrimidine
        deoxynucleotide triphosphate.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging DTYMK alleles. Of the three published
    families, one is a consanguineous Egyptian family with a homozygous
    missense allele, one is a non-consanguineous Dutch family with compound
    heterozygous missense alleles, and one is a Hong Kong family with two
    variants in trans; the fifth reported individual is homozygous. Carrier
    parents are clinically unaffected but have measurably reduced dTMPK
    activity in fibroblasts. Recurrence risk for siblings of a proband is 25
    percent, and carrier testing plus genetic counselling are indicated for
    at-risk relatives.
  evidence:
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood-onset neurodegeneration with progressive microcephaly (CONPM) is
      a rare autosomal recessive disorder caused by pathogenic variants in the
      DTYMK gene.
    explanation: >-
      States the autosomal recessive mode of inheritance for the entity.
  - reference: PMID:31271740
    reference_title: "Deoxythymidylate kinase, DTYMK, is a novel gene for mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      have been diagnosed to harbor two heterozygous variants in trans in the
      DTYMK gene of the thymidine biosynthesis pathway
    explanation: >-
      Documents the biallelic (two variants in trans) requirement in the first
      reported family.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence study exists and no Orphanet prevalence class
    is available to adopt, because no ORPHA entity for this disorder exists (EBI
    OLS4 ORDO searches for `DTYMK` and for the disease name both returned
    numFound 0 on 2026-08-01, and MONDO:0859241 carries no ORPHA
    cross-reference). The published case count is therefore the only defensible
    measure. PMID:40696808, published in 2025, states that only four cases had
    been reported before its own, which it describes as the fifth. Those four
    resolve to the two siblings of PMID:31271740 and the two unrelated children
    of PMID:34918187, giving a cumulative published total of five individuals
    worldwide. That count places the disorder in the ultra-rare tier. Note that
    the five-case total is the arithmetic of adding the earlier series to the
    2025 report; the number five is stated by PMID:40696808, but the
    attribution of the earlier four to those two specific papers is a curatorial
    reconciliation, not a statement read off that paper.
  evidence:
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only four cases have been reported in the literature to date.
    explanation: >-
      Gives the published worldwide case count immediately before this paper's
      own case, supporting an ultra-rare classification based on cases in the
      literature.
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This paper's objective is to describe the fifth globally reported case of
      CONPM and the first documented in a Mexican patient
    explanation: >-
      Establishes the cumulative total of five published individuals and the
      paper's own position in that series.
pathophysiology:
- name: Biallelic Damaging DTYMK Variants
  biological_scale: MOLECULAR
  description: >-
    The disorder is initiated by inheritance of two damaging DTYMK alleles. The
    published allelic spectrum is entirely missense: p.Pro81Leu (recurrent, seen
    homozygously in an Egyptian family and in a Mexican family and in trans in a
    Dutch family) and p.Asp128Asn. Neither residue lies in a named functional
    domain of dTMPK, yet fibroblasts from a compound heterozygote have almost no
    measurable enzyme activity, so these alleles behave functionally as severe
    hypomorphs or nulls.
  genes:
  - preferred_term: DTYMK
    term:
      id: hgnc:3061
      label: DTYMK
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two unrelated children with bi-allelic variants in
      DTYMK, encoding dTMPK, which catalyzes the penultimate step in dTTP
      biosynthesis.
    explanation: >-
      Establishes biallelic DTYMK alleles as the initiating lesion and names the
      enzymatic step affected.
  - reference: PMID:40696808
    reference_title: "Childhood-Onset Neurodegeneration With Progressive Microcephaly (CONPM) due to a DTYMK Homozygous Pathogenic Variant: Outlining the Phenotype of an Ultra-Rare Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis identified a homozygous missense variant in DTYMK
      (NM_012145.4:c.242C>T; p.Pro81Leu).
    explanation: >-
      Independent replication of the same recurrent missense allele in a third
      unrelated family.
  downstream:
  - target: Loss of dTMPK Homodimerization
    description: >-
      The missense substitutions destabilise the obligate homodimer.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34926941
      reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast, all mutants were present as monomers with dramatically
        reduced substrate binding affinity and catalytic efficiencies.
      explanation: >-
        Establishes the specific structural mechanism by which the patient
        alleles inactivate the enzyme.
  - target: Loss of dTMP Kinase Catalytic Activity
    description: >-
      The patient alleles leave the cell with almost no dTMP kinase activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34918187
      reference_title: "DTYMK is essential for genome integrity and neuronal survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In cells of affected individuals, dTMPK enzyme activity was minimal,
        along with impaired DNA replication.
      explanation: >-
        Directly links the patient genotype to loss of the enzyme activity in
        patient-derived cells.
- name: Loss of dTMPK Homodimerization
  biological_scale: MOLECULAR
  description: >-
    Wild-type dTMPK works as a homodimer. None of the substituted residues
    contacts the substrate directly; instead each substitution destabilises the
    dimer, so the purified mutant proteins run as monomers with drastically
    reduced substrate affinity and catalytic efficiency. The mechanism of
    inactivation is therefore structural rather than active-site, which is why
    in silico substrate-contact reasoning called two of these alleles tolerated.
  genes:
  - preferred_term: DTYMK
    term:
      id: hgnc:3061
      label: DTYMK
  molecular_functions:
  - preferred_term: protein homodimerization activity
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34926941
    reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The wild-type TMPK mainly exists as a dimer with high substrate binding
      affinity
    explanation: >-
      Establishes that the functional form of the enzyme is a dimer, which is
      what the disease alleles disrupt.
  - reference: PMID:34926941
    reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Based on the human TMPK structure, none of the mutated amino acids
      interacted directly with the substrates.
    explanation: >-
      Confirms the substitutions act structurally rather than by blocking
      substrate binding, which is the distinguishing feature of this mechanism.
  downstream:
  - target: Loss of dTMP Kinase Catalytic Activity
    description: >-
      Monomeric dTMPK is catalytically crippled.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34926941
      reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TMPK mutations identified in patients represent loss of function
        mutations
      explanation: >-
        The authors' summary of the functional consequence of the dimerization
        defect.
- name: Loss of dTMP Kinase Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    dTMPK phosphorylates dTMP to dTDP. Because the de novo route (dUMP to dTMP
    via thymidylate synthase) and the salvage route (thymidine to dTMP via
    thymidine kinase) both converge on dTMP, dTMPK is the single obligatory
    enzyme downstream of that convergence and is therefore the bottleneck for
    the entire dTTP supply. In fibroblasts of the compound heterozygous
    individual, activity was 0.62 pmol/min/mg protein against 43.65 and 31.08 in
    the heterozygous mother and father respectively. The loss is not uniform
    across compartments: in patient fibroblasts carrying P81L and D128N,
    mitochondrial TMPK activity was completely absent while cytosolic activity
    was extremely low and unstable. That compartment asymmetry is the strongest
    remaining argument for a mitochondrial contribution to the phenotype.
  genes:
  - preferred_term: DTYMK
    term:
      id: hgnc:3061
      label: DTYMK
  molecular_functions:
  - preferred_term: dTMP kinase activity
    term:
      id: GO:0004798
      label: dTMP kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This makes dTMPK the bottleneck for dTTP biosynthesis
    explanation: >-
      States why loss of this one enzyme cannot be bypassed by the alternative
      pathway.
  - reference: PMID:34918187
    reference_title: "DTYMK is essential for genome integrity and neuronal survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dTMPK enzyme activity of the individual is significantly lower than those
      of the parents
    explanation: >-
      Quantifies the enzymatic deficit in patient fibroblasts against
      heterozygous parental controls.
  - reference: PMID:34926941
    reference_title: "Biochemical Characterizations of Human TMPK Mutations Identified in Patients with Severe Microcephaly: Single Amino Acid Substitutions Impair Dimerization and Abolish Their Catalytic Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the P81L and D128N mutations led to a complete loss of TMPK activity in
      mitochondria and extremely low and unstable TMPK activity in cytosol
    explanation: >-
      Establishes the compartment asymmetry of the enzymatic loss in patient
      fibroblasts: total in mitochondria, near-total in cytosol.
  - reference: PMID:35346037
    reference_title: "Differential expression of enzymes in thymidylate biosynthesis in zebrafish at different developmental stages: implications for dtymk mutation-caused neurodegenerative disorders."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TMPK and TK activities are prominent in the cytosol of embryos, larvae and
      adult fish and brain contains the highest TMPK activity.

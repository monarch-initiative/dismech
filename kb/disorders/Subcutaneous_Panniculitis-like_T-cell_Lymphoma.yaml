phenotypes:
- category: Integument
  name: Subcutaneous Nodules and Plaques
  description: >-
    Multiple, usually painless subcutaneous nodules and plaques, preferentially
    on the legs and trunk. They are the presenting complaint in nearly all
    patients and are routinely mistaken for a benign panniculitis, cellulitis
    or erythema nodosum, which is the main source of diagnostic delay.
  phenotype_term:
    preferred_term: Subcutaneous nodule
    term:
      id: HP:0001482
      label: Subcutaneous nodule
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:30126736
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: Clinical features, therapeutic approach, and outcome in a case series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with multiple nodular or plaque-like lesions preferentially affecting the legs and/or trunk."
    explanation: >-
      Describes the lesion morphology and distribution recorded here.
  - reference: PMID:35509196
    reference_title: "The pathophysiology and current treatments for the subcutaneous panniculitis-like T cell lymphoma: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTCL is usually presented clinically as painless subcutaneous and erythematous nodules over the trunk or extremities."
    explanation: >-
      Confirms that the nodules are characteristically painless, which is part
      of why they are initially dismissed.
- category: Integument
  name: Lobular Panniculitis
  description: >-
    Inflammation of the subcutaneous fat lobule, which is simultaneously the
    clinical presentation and the histologic substrate of the disease. In some
    HAVCR2-mutant paediatric patients the biopsy shows panniculitis without
    sufficient evidence of lymphoma.
  phenotype_term:

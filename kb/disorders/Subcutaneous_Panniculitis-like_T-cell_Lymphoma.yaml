discussions:
- discussion_id: sptcl_neoplastic_vs_inflammatory
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is HAVCR2-mutant subcutaneous panniculitis-like T-cell lymphoma a lymphoma,
    or an inherited autoinflammatory disease that produces a clonal
    lymphocytic infiltrate?
  attaches_to:
  - pathophysiology#Clonal Cytotoxic Alpha-Beta T-cell Expansion
  rationale: >-
    Several observations sit uneasily with a neoplastic model. Immunosuppression
    outperforms cytotoxic chemotherapy; JAK inhibition produces rapid remission
    in genotyped patients who failed chemotherapy; some HAVCR2-mutant children
    have panniculitis without histologic evidence of lymphoma at all; and a
    patient has been described with two clonally unrelated episodes, which is
    hard to reconcile with a single transformed clone. The authors of two of
    these reports say the neoplastic nature of the condition is in question. The
    KB models this as a lymphoma entry because that is its classification and
    because clonal T-cell receptor rearrangement is a diagnostic criterion, but
    the mechanism nodes here deliberately place the germline immune lesion
    upstream of the clone rather than the reverse.
  evidence:
  - reference: PMID:32271897
    reference_title: "Efficacy of ruxolitinib in subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supporting rationale for ruxolitinib use, not more aggressive treatment, in this context, questioning this condition’s neoplastic nature."
    explanation: >-
      States the question explicitly on the basis of the treatment response.
  - reference: PMID:37062931
    reference_title: "Efficacy of ruxolitinib for HAVCR2 mutation-associated hemophagocytic lymphohistiocytosis and panniculitis manifestations in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The excellent efficacy of ruxolitinib highlights this disease as an inflammatory condition instead of neoplastic nature and indicates novel agents targeting key inflammatory pathways as an encouraging approach for this disease entity."
    explanation: >-
      An independent group drawing the same inference from the ruxolitinib
      response.
  - reference: PMID:32285995
    reference_title: "TIM-3 deficiency presenting with two clonally unrelated episodes of mesenteric and subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that mesenteric fatty tissue localization of SPTCL can be the presenting manifestation of TIM-3 deficiency, that this condition predisposes to recurrent lymphoma, and that flow cytometry is a possible screening tool."
    explanation: >-
      Two clonally unrelated episodes in one patient argue for a predisposing
      immune defect rather than a single transformed clone.
- discussion_id: sptcl_havcr2_wildtype_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What drives the HAVCR2 wild-type cases, which are roughly half of an
    unselected cohort?
  attaches_to:
  - pathophysiology#Germline TIM-3 Loss of Function
  rationale: >-
    The mechanism recorded in this entry starts from germline HAVCR2 loss of
    function, but about half of patients in an unselected national cohort have
    no HAVCR2 variant. Mutations in UNC13D, PIAS3 and KMT2D are reported more
    often in those cases, and CCR4 is upregulated in them, but no unifying
    mechanism has been established. The entry therefore has no upstream node
    for the wild-type group.
  evidence:
  - reference: PMID:34535012
    reference_title: "Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in UNC13D, PIAS3, and KMT2D were more frequent in HAVCR2WT SPTCLs."
    explanation: >-
      Names the candidate lesions that distinguish the wild-type group without
      establishing a mechanism for it.
notes: >-
  Entity scope: this entry covers the alpha/beta phenotype only, following the
  2008 EORTC decision to restrict the term SPTCL to that entity. Primary
  cutaneous gamma-delta T-cell lymphoma is recorded as a differential
  diagnosis, not as a subtype.

  Frequency figures in this entry are strongly ascertainment-dependent and the
  cohorts are not interchangeable. HAVCR2 carrier fraction ranges from about
  51% in an unselected Korean national cohort to about 86% in a Thai paediatric
  series; HLH frequency ranges from 17% in the adult-weighted EORTC series to
  68% in that same paediatric series. Both extremes are recorded with their
  cohort so that neither is read as the disease-wide number.

  No prevalence rate is recorded because none has been published; the only
  quantitative anchor is SPTCL's share of non-Hodgkin lymphoma diagnoses.

  Most of the reference cache added alongside this entry comes from the
  deep-research run's own citation-validation pass rather than from curation.
  Those files are committed because the report that cites them is committed;
  they are not evidence for anything in the entry.

histopathology:
- name: Adipocyte rimming by atypical lymphoid cells
  description: >-
    Atypical lymphoid cells encircling individual adipocytes within the
    subcutaneous fat lobule. This is the defining diagnostic finding and is
    assessed on a deep incisional or excisional biopsy rather than a
    superficial punch.
  diagnostic: true
  evidence:
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathological hallmark of SPTCL is an adipocyte rimming by atypical lymphoid cells expressing CD3, CD8, T-cell intracytoplasmic antigen 1 (TIA-1) and T-cell receptor β F1 (BF1)."
    explanation: >-
      States the hallmark finding and the accompanying immunophenotype.
- name: Ki-67 hotspots among rimming CD8-positive T cells
  description: >-
    Foci of high proliferative activity within the CD8-positive rimming
    infiltrate. Their presence separates SPTCL from lupus erythematosus
    panniculitis on a four-stain panel, and their absence argues against
    lymphoma.
  diagnostic: true
  evidence:
  - reference: PMID:26796503
    reference_title: "Useful Parameters for Distinguishing Subcutaneous Panniculitis-like T-Cell Lymphoma From Lupus Erythematosus Panniculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ki-67 hotspots were not identified in LEP, thus aiding the distinction of SPTCL from LEP."
    explanation: >-
      Establishes the discriminatory value of the finding against the principal
      histologic mimic.
diagnosis:
- name: Deep skin biopsy with immunophenotyping
  description: >-
    Diagnosis rests on a deep biopsy showing lobular panniculitis with adipocyte
    rimming, plus an immunohistochemical panel establishing the CD3-positive,
    CD4-negative, CD8-positive, CD56-negative, betaF1-positive cytotoxic
    phenotype. Demonstrating a clonal T-cell receptor rearrangement supports the
    diagnosis.
  evidence:
  - reference: PMID:30126736
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: Clinical features, therapeutic approach, and outcome in a case series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathology typically showed a lobular panniculitis with individual adipocytes surrounded by atypical lymphocytes, usually with a CD3+, CD4-, CD8+, CD56-, TIA1 cytotoxic granule associated RNA binding protein 1-positive phenotype and high proliferation rate."
    explanation: >-
      Sets out the histologic and immunophenotypic criteria used in practice.
- name: Germline HAVCR2 sequencing
  description: >-
    Sequencing of HAVCR2 exon 2 covers the three recurrent alleles and is
    increasingly performed at diagnosis, particularly in children and in
    patients with HLH, because a positive result changes surveillance, family
    counselling and - if transplantation is considered - donor selection.
    Reduced TIM-3 surface expression by flow cytometry has been proposed as a
    screening test.
  evidence:
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The designed primer could cover pathogenic HAVCR2 variants of p.Y82C, p.I97M and p.T101I."
    explanation: >-
      Confirms that exon 2 sequencing captures all three recurrent alleles.
  - reference: PMID:32285995
    reference_title: "TIM-3 deficiency presenting with two clonally unrelated episodes of mesenteric and subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that mesenteric fatty tissue localization of SPTCL can be the presenting manifestation of TIM-3 deficiency, that this condition predisposes to recurrent lymphoma, and that flow cytometry is a possible screening tool."
    explanation: >-
      Supports flow cytometry as a screening approach and documents the
      recurrence risk that motivates genotyping.
- name: FDG PET/CT for staging and response assessment
  description: >-
    Used to define the extent of subcutaneous disease, look for extracutaneous
    involvement and follow treatment response.
  evidence:
  - reference: PMID:35509196
    reference_title: "The pathophysiology and current treatments for the subcutaneous panniculitis-like T cell lymphoma: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Positron emission tomography scan is utilized for disease staging and treatment follow-up."
    explanation: >-
      States the role of PET in staging and follow-up for this disease.
differential_diagnoses:
- name: Lupus erythematosus panniculitis
  description: >-
    The principal histologic mimic. The two overlap clinically and
    histologically and can coexist in the same patient, but SPTCL carries the
    risk of HLH and so the distinction matters. Molecular profiling separates
    them, and overlapping cases cluster with lupus panniculitis rather than
    with SPTCL.
  distinguishing_features:
  - Ki-67 hotspots enriched in atypical CD8-positive T cells are present in SPTCL and absent in lupus panniculitis
  - Clonal T-cell receptor rearrangement favours SPTCL
  - Gene expression profiling separates the two entities, with overlap cases resembling lupus panniculitis
  evidence:
  - reference: PMID:26796503
    reference_title: "Useful Parameters for Distinguishing Subcutaneous Panniculitis-like T-Cell Lymphoma From Lupus Erythematosus Panniculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphocyte atypia combined with adipocyte rimming of CD8+ T cells within Ki-67 hotspots was also highly specific for the diagnosis of SPTCL."
    explanation: >-
      Provides the specific histologic combination that discriminates the two.
  - reference: PMID:33966586
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma, lupus erythematosus profundus, and overlapping cases: molecular characterization through the study of 208 genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene expression unsupervised analysis of the samples differentiated SPTCL from LEP samples. Most overlapping cases were clustered with LEP cases."
    explanation: >-
      Molecular evidence that the entities are separable and that overlap cases
      behave like lupus panniculitis.
- name: Primary cutaneous gamma-delta T-cell lymphoma
  description: >-
    Formerly grouped with SPTCL under a single label. It carries a gamma/delta
    rather than alpha/beta receptor, frequently involves the epidermis and
    ulcerates, and has a far worse outcome irrespective of treatment. Separating
    the two on betaF1 and TCR-delta staining is the reason the term SPTCL is now
    restricted to the alpha/beta entity.
  distinguishing_features:
  - CD4-negative, CD8-negative, CD56 variable, betaF1-negative phenotype
  - Frequent epidermal or dermal involvement and ulceration rather than disease confined to the subcutis
  - 5-year overall survival of 11% versus 82% for the alpha/beta entity
  evidence:
  - reference: PMID:17934071
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: definition, classification, and prognostic factors: an EORTC Cutaneous Lymphoma Group Study of 83 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTL-GDs often showed (epi)dermal involvement and/or ulceration, a CD4-, CD8-, CD56+/-, betaF1- T-cell phenotype, and poor prognosis (5-year OS: 11%), irrespective of the presence of HPS or type of treatment."
    explanation: >-
      Gives the phenotype, distribution and outcome that separate the
      gamma/delta entity.
  - reference: PMID:17934071
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: definition, classification, and prognostic factors: an EORTC Cutaneous Lymphoma Group Study of 83 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that SPTL-AB and SPTL-GD are distinct entities, and justify that the term SPTL should further be used only for SPTL-AB."
    explanation: >-
      The nomenclature decision that makes this a differential rather than a
      subtype.
treatments:
- name: Corticosteroid-based Immunosuppressive Therapy
  description: >-
    Systemic corticosteroids alone or combined with low-dose methotrexate or
    cyclosporine A. This is now the usual first-line choice for uncomplicated
    cutaneous disease, and gives high complete response rates without the
    toxicity of anthracycline-based chemotherapy. Corticosteroid monotherapy
    relapses more often than corticosteroids combined with another
    immunoregulatory agent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: cyclosporin A
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Unrestrained Innate Immune Activation
    description: >-
      Broad suppression of cytokine production and lymphocyte activation, which
      is why an immunosuppressive rather than cytotoxic strategy works in a
      disease driven by loss of an inhibitory checkpoint.
  evidence:
  - reference: PMID:30126736
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: Clinical features, therapeutic approach, and outcome in a case series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral steroids alone or in combination with low-dose methotrexate or cyclosporine A were the most common initial treatment, achieving a complete response in 85% of the treated patients."
    explanation: >-
      Gives the regimen and the complete response rate recorded here.
  - reference: PMID:37840116
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma associated with hemophagocytic lymphohistiocytosis: a systematic review of 63 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The corticosteroid monotherapy experienced a higher recurrence rate than the corticosteroids plus other immunoregulatory agents therapy (66.7 vs. 0.0%, p = 0.029)."
    explanation: >-
      Supports combining corticosteroids with a second immunoregulatory agent
      rather than using steroids alone.
- name: Multiagent Chemotherapy
  description: >-
    Anthracycline-based combination chemotherapy, historically the default and
    now reserved for patients presenting with HLH or progressing on
    immunosuppression. In a paediatric comparison it achieved a numerically
    higher durable complete remission rate than immunosuppressive therapy but at
    the cost of more adverse events, and the difference in remission rate was
    not significant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:39538229
    reference_title: "Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Durable complete remission (CR) was achieved in 71.4% and 50.0% after first-line chemotherapy and IST, respectively (P=0.45); however, chemotherapy tended to increase any AEs compared to IST (57.1% vs. 12.5%; P=0.07)."
    explanation: >-
      Reports the efficacy and toxicity trade-off between chemotherapy and
      immunosuppression without establishing superiority of either.
  - reference: PMID:15368328
    reference_title: "Immunophenotypic and molecular features, clinical outcomes, treatments, and prognostic factors associated with subcutaneous panniculitis-like T-cell lymphoma: a systematic analysis of 156 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anthracycline-based chemotherapy regimens were the most commonly used and most effective systemic treatment options, producing long-term CR in approximately 30% of patients."
    explanation: >-
      Documents the historical role and the durable remission rate of
      anthracycline-based regimens.
- name: Ruxolitinib
  description: >-
    A JAK1/JAK2 inhibitor. Its use follows directly from the mechanism: TIM-3
    loss drives cytokine-mediated inflammation and HAVCR2-mutant tumours are
    transcriptionally enriched for IL6-JAK-STAT3 signalling. Reported responses
    in HAVCR2-mutant children have been rapid and durable after corticosteroids,
    other immunosuppressants and chemotherapy had all failed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Clonal Cytotoxic Alpha-Beta T-cell Expansion
    description: >-
      Blocks the JAK-STAT signalling program enriched in HAVCR2 p.Tyr82Cys
      tumours.
  - target: Macrophage Hyperactivation and Hemophagocytosis
    description: >-
      Suppresses the cytokine signalling that sustains the hemophagocytic
      syndrome.
  evidence:
  - reference: PMID:37062931
    reference_title: "Efficacy of ruxolitinib for HAVCR2 mutation-associated hemophagocytic lymphohistiocytosis and panniculitis manifestations in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients initially received corticosteroids, immunosuppressants or chemotherapy, achieving unfavourable responses. Strikingly, they responded well to ruxolitinib targeting inflammatory cytokines, allowing rapid disease resolution and/or long-term maintenance of remission."
    explanation: >-
      Reports responses to ruxolitinib after failure of conventional therapy in
      genotyped patients.
  - reference: PMID:32271897
    reference_title: "Efficacy of ruxolitinib in subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First evidence of ruxolitinib efficacy for subcutaneous panniculitis-like T-cell lymphoma with hemophagocytic lymphohistiocytosis."
    explanation: >-
      The first report of ruxolitinib activity in this indication.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Reserved for refractory or relapsed disease, particularly HLH-complicated
    disease. Because the predisposing HAVCR2 variant is germline, donor genotype
    matters: a relapse has been reported after a sibling-identical transplant
    from a donor who turned out to carry the same homozygous HAVCR2 mutation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:37840116
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma associated with hemophagocytic lymphohistiocytosis: a systematic review of 63 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifteen patients, including 5 with relapsed/refractory SPTCL-HLH, responded well and survived after receiving SCT."
    explanation: >-
      Supports transplantation as an effective option in refractory disease.
  - reference: PMID:37840116
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma associated with hemophagocytic lymphohistiocytosis: a systematic review of 63 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One case who received a sibling-identical SCT relapsed. Further analysis revealed a homozygous HAVCR2 mutation with the donor."
    explanation: >-
      Documents the germline-genotype pitfall in related-donor selection.
- name: Radiation Therapy
  description: >-
    Skin-directed radiotherapy for localised or solitary lesions, avoiding
    systemic exposure in patients whose disease is anatomically limited.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:15368328
    reference_title: "Immunophenotypic and molecular features, clinical outcomes, treatments, and prognostic factors associated with subcutaneous panniculitis-like T-cell lymphoma: a systematic analysis of 156 patients reported in the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors performed a systematic analysis of all patients with SPTCL reported on in the English-language medical literature, with emphasis on specific clinical features, experiences involving the use of radiotherapy and systemic agents, and prognostic factors predictive of treatment response and clinical outcome."
    explanation: >-

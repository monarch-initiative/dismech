      of NHL rather than as a population rate.
epidemiology:
- name: Female predominance
  description: >-
    A consistent female excess across independent cohorts: a female-to-male
    ratio of 1.7 in a European multicentre series and 69.8% women in a Korean
    national cohort. Two unrelated populations agreeing on roughly 70% female
    makes this a first-order feature of the disease rather than a cohort
    artefact, and it is one of the things that distinguishes SPTCL from most
    peripheral T-cell lymphomas.
  evidence:
  - reference: PMID:30126736
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: Clinical features, therapeutic approach, and outcome in a case series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The female-to-male ratio was 1.7. The median age at diagnosis was 46.5 years."
    explanation: >-
      Gives the sex ratio and median age in a European multicentre series.
  - reference: PMID:34535012
    reference_title: "Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at diagnosis was 32 years (range, 8-74 years), and 37 (69.8%) patients were women."
    explanation: >-
      Independent confirmation of the female excess in a Korean national cohort,
      with a younger median age.
- name: Age at diagnosis
  description: >-
    Median age at diagnosis differs markedly between cohorts - 46.5 years in a
    European series against 32 years in a Korean national cohort - and the
    difference tracks HAVCR2 genotype rather than geography alone, since the
    p.Tyr82Cys allele is associated with younger onset and is far commoner in
    East Asian populations. The reported range spans childhood to old age.
  minimum_value: 8.0
  maximum_value: 74.0
  unit: years
  notes: >-
    The range recorded here is the Korean national cohort's, which is the only
    one of the cited series to report one explicitly.
  evidence:
  - reference: PMID:34535012
    reference_title: "Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at diagnosis was 32 years (range, 8-74 years), and 37 (69.8%) patients were women."
    explanation: >-
      Gives the median and range recorded here.
  - reference: PMID:34535012
    reference_title: "Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HAVCR2Y82C was associated with younger age (P = .001), development of hemophagocytic lymphohistiocytosis or hemophagocytic lymphohistiocytosis-like systemic illness (P < .001), and short relapse-free survival (RFS) (P = .023)."
    explanation: >-
      Supports attributing the between-cohort age difference to genotype rather
      than to geography alone.
progression:
- phase: Indolent relapsing cutaneous disease
  notes: >-
    Most patients follow a chronic, relapsing course confined to the subcutis
    with an excellent survival. In the EORTC series the alpha/beta phenotype
    was generally confined to the subcutis and had a 5-year overall survival of
    82%.
  evidence:
  - reference: PMID:17934071
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: definition, classification, and prognostic factors: an EORTC Cutaneous Lymphoma Group Study of 83 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTL-ABs were generally confined to the subcutis, had a CD4-, CD8+, CD56-, betaF1+ phenotype, were uncommonly associated with a hemophagocytic syndrome (HPS; 17%), and had a favorable prognosis (5-year overall survival [OS]: 82%)."
    explanation: >-
      Establishes both the indolent course and the baseline survival figure for
      the alpha/beta entity.
  - reference: PMID:30126736
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: Clinical features, therapeutic approach, and outcome in a case series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5-year disease-specific survival rate was 85.7%."
    explanation: >-
      An independent multicentre series reporting concordant 5-year survival.
- phase: Hemophagocytic lymphohistiocytosis
  notes: >-
    A minority of patients develop HLH, either at presentation or during the
    course of cutaneous disease. This is the single dominant adverse prognostic
    event and drives most disease-related mortality.
  evidence:
  - reference: PMID:17934071
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma: definition, classification, and prognostic factors: an EORTC Cutaneous Lymphoma Group Study of 83 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTL-AB patients without HPS had a significantly better survival than patients with HPS (5-year OS: 91% vs 46%; P<.001)."
    explanation: >-
      Quantifies the survival penalty imposed by hemophagocytic syndrome.
  - reference: PMID:15368328
    reference_title: "Immunophenotypic and molecular features, clinical outcomes, treatments, and prognostic factors associated with subcutaneous panniculitis-like T-cell lymphoma: a systematic analysis of 156 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of HPS at diagnosis and expression of the gamma/delta T-cell receptor (TCR) by tumor cells were associated with poor survival, whereas age was not."
    explanation: >-
      Identifies hemophagocytic syndrome as an adverse prognostic factor
      independent of age in a pooled literature analysis.
pathophysiology:
- name: Germline TIM-3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline missense variants in HAVCR2 substitute conserved residues in the
    extracellular immunoglobulin variable-like domain of TIM-3. The variant
    proteins misfold and never reach the plasma membrane, so the inhibitory
    receptor is functionally absent from the surface of T cells and of the
    myeloid cells that normally use it to damp innate activation. The
    geographic split between the two commonest alleles - p.Tyr82Cys on an East
    Asian and Polynesian founder haplotype, p.Ile97Met in European-ancestry
    patients - is a strong argument that these are ancestral, not somatic,
    lesions.

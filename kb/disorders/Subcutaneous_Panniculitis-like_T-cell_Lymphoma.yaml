  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based incidence estimate exists. The only quantitative
    anchor in the literature is SPTCL's share of non-Hodgkin lymphoma
    diagnoses, which is consistently reported as under 1%.
  evidence:
  - reference: PMID:39538229
    reference_title: "Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subcutaneous panniculitis-like T-cell lymphoma (SPTCL) is a distinctive subtype of T-cell non-Hodgkin lymphoma (NHL), accounting for <1% of all NHL cases worldwide"
    explanation: >-

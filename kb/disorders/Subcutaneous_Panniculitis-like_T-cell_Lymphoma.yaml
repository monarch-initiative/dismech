genetic:
- name: HAVCR2
  gene_term:
    preferred_term: HAVCR2
    term:
      id: hgnc:18437
      label: HAVCR2
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  frequency: >-
    Reported in roughly 50% to 86% of patients depending on cohort ancestry and
    on whether the series is enriched for paediatric or HLH-complicated
    disease.
  notes: >-
    HAVCR2 encodes TIM-3, an inhibitory checkpoint receptor on T cells and
    innate immune cells. Germline loss-of-function missense alleles are the
    only recurrent genetic lesion established in SPTCL. Three recurrent
    substitutions are reported - p.Tyr82Cys, p.Ile97Met and p.Thr101Ile - all
    in the extracellular immunoglobulin variable-like domain.
  case_fractions:
  - population: Korean nationwide SPTCL cohort
    case_fraction_percent: 51.0
    cohort_size: 49
    notes: Patients with an evaluable HAVCR2 genotype carried p.Tyr82Cys.
    evidence:
    - reference: PMID:34535012
      reference_title: "Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 49 patients with available HAVCR2 status, 25 (51.0%) were HAVCR2Y82C."
      explanation: >-
        Quantifies the p.Tyr82Cys share in an unselected Korean national
        cohort.
  - population: Japanese SPTCL cohort
    case_fraction_percent: 79.3
    cohort_size: 29
    notes: >-
      Germline HAVCR2 mutations in 23 of 29 patients in an integrated analysis
      of Japanese and publicly available exome data. A third independent cohort
      on the entry's central axis; the Japanese arm contributed by this study
      itself is small.
    evidence:
    - reference: PMID:39288772
      reference_title: "Genetic profiles and clinical features in subcutaneous panniculitis-like T-cell lymphomas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified 138 somatic mutations in skin tumors of 24 patients and HAVCR2 germline mutations in 23 of 29 patients."
      explanation: >-
        Gives the carrier fraction in a third independent cohort.
    - reference: PMID:39288772
      reference_title: "Genetic profiles and clinical features in subcutaneous panniculitis-like T-cell lymphomas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HAVCR2 p.Tyr82Cys mutations were identified in four of six Japanese patients."
      explanation: >-
        Records the p.Tyr82Cys share in the study's own Japanese arm, which is
        small enough that the figure is fragile.
  - population: Thai SPTCL cohort aged 20 years or younger
    case_fraction_percent: 86.4
    cohort_size: 22
    notes: >-
      Any germline HAVCR2 mutation, homozygous in 77.3% and heterozygous in
      9.1%, across the 22 patients aged 20 years or younger enrolled from six
      Thai centres.
    evidence:
    - reference: PMID:39538229
      reference_title: "Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents."
      supports: SUPPORT

inheritance:
- name: Autosomal recessive predisposition via germline HAVCR2
  description: >-
    Most patients are clinically sporadic, but the HAVCR2 predisposition
    behaves recessively: homozygous or compound heterozygous genotypes carry
    the highest risk of the HLH-complicated phenotype, while heterozygous
    carriage confers a smaller but measurable increase in risk. Genotype is
    germline, so it is present in non-tumor tissue and is relevant to family
    counselling and to donor selection for transplantation.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30792187
    reference_title: "Frequent germline mutations of HAVCR2 in sporadic subcutaneous panniculitis-like T-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, individuals harboring biallelic HAVCR2 (TIM3) germline mutations were highly susceptible to sporadic SPTCL, which was also associated with clonal somatic mutations."
    explanation: >-
      States the biallelic germline requirement for the predisposition while
      noting that affected individuals are clinically sporadic.
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using IPD from the present and the other three eligible cohorts (N=127), male sex, heterozygous and homozygous/compound heterozygous HAVCR2 mutations were associated with HLH by the adjusted odds ratio of 2.93 (95% confidence interval [CI]: 1.22-7.06), 4.77 (95% CI: 1.05-21.63) and 8.48 (95% CI: 2.98-24.10), respectively."
    explanation: >-
      Qualifies a strictly recessive model: heterozygous carriage also raises
      HLH risk, though less than a biallelic genotype does.
prevalence:
- population: Worldwide

name: Subcutaneous Panniculitis-like T-cell Lymphoma
creation_date: "2026-08-29T15:30:00Z"
category: Cancer
categories:
- Hematologic Malignancy
- T-cell Neoplasm
- Cutaneous Lymphoma
synonyms:
- SPTCL
- subcutaneous panniculitic T-cell lymphoma
- T-CELL LYMPHOMA, SUBCUTANEOUS PANNICULITIS-LIKE
- subcutaneous panniculitis-like T-cell lymphoma, Alpha/Beta type
- SPTL-AB
description: >-
  Subcutaneous panniculitis-like T-cell lymphoma (SPTCL) is a rare primary
  cutaneous lymphoma in which clonal cytotoxic CD8-positive alpha/beta T cells
  infiltrate the subcutaneous fat lobule and rim individual adipocytes,
  producing nodules and plaques that mimic an inflammatory panniculitis. Since
  the 2008 EORTC classification study the term has been restricted to the
  alpha/beta phenotype; the gamma/delta counterpart is a separate, far more
  aggressive entity. SPTCL is unusual among lymphomas in having a defined
  germline predisposition: loss-of-function missense variants in HAVCR2, which
  encodes the inhibitory checkpoint receptor TIM-3, are found in a large
  fraction of cases and abolish TIM-3 surface expression, releasing a brake on
  innate immune activation. The resulting hyperinflammatory state explains the
  disease's defining complication, hemophagocytic lymphohistiocytosis (HLH),
  which is the dominant adverse prognostic factor. Outcome is otherwise good
  and immunosuppressive rather than cytotoxic therapy is now generally
  preferred first line, which - together with the striking responses to
  JAK inhibition seen in HAVCR2-mutant disease - has led several groups to
  question how much of the HAVCR2-mutant phenotype is neoplastic at all.

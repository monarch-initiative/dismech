- name: Clonal Cytotoxic Alpha-Beta T-cell Expansion
  biological_scale: CELLULAR
  description: >-
    A clonal population of CD3-positive, CD4-negative, CD8-positive,
    CD56-negative, betaF1-positive cytotoxic T cells expands and homes to
    subcutaneous fat. Cooperating somatic mutations in epigenetic regulators
    and signal transducers accompany the germline lesion. In HAVCR2 p.Tyr82Cys
    tumours the transcriptional program is enriched for IL6-JAK-STAT3 and for
    TNF signalling via NF-kappaB, which is the stated rationale for JAK
    inhibition.

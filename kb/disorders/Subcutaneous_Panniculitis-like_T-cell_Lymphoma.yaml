      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant encoding p.Tyr82Cys TIM-3 occurs on a potential founder chromosome in patients with East Asian and Polynesian ancestry, while p.Ile97Met TIM-3 occurs in patients with European ancestry."
      explanation: >-
        Establishes the founder origin and ancestry distribution of this

- category: Neoplasm
  name: Hemophagocytic Lymphohistiocytosis
  description: >-
    A systemic hyperinflammatory syndrome complicating a substantial minority
    of cases, defined by the HLH-2004 criteria. It is the dominant adverse
    prognostic factor and the main cause of disease-related death. Reported
    frequency varies widely with the population studied - about 17% in the
    adult-weighted EORTC series, about two thirds in a paediatric cohort
    selected for HAVCR2 sequencing.

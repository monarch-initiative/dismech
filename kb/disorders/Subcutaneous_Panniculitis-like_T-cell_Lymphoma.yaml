      snippet: "86.4% harbored germline HAVCR2 mutation, either homozygous (77.3%) or heterozygous (9.1%) p.Y82C variant, while 68.2% developed HLH/HLH-like systemic illnesses."
      explanation: >-
        Gives the much higher carrier fraction in a paediatric series, showing
        the ascertainment dependence of this number.
  evidence:
  - reference: PMID:30792187
    reference_title: "Frequent germline mutations of HAVCR2 in sporadic subcutaneous panniculitis-like T-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with a recent report, germline mutations in HAVCR2, encoding T-cell immunoglobulin mucin 3 (TIM3), were identified in 11 of 13 (85%) cases."
    explanation: >-
      Independent replication of the HAVCR2 association in an Asian cohort.
  variants:
  - name: HAVCR2 c.245A>G p.Tyr82Cys
    description: >-
      The commonest reported allele, carried on a probable founder chromosome

      commonest genotype reported is homozygous p.Tyr82Cys.
  evidence:
  - reference: PMID:30374066
    reference_title: "Germline HAVCR2 mutations altering TIM-3 characterize subcutaneous panniculitis-like T cell lymphomas with hemophagocytic lymphohistiocytic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify in ~60% of SPTCL cases germline, loss-of-function, missense variants altering highly conserved residues of TIM-3, c.245A>G (p.Tyr82Cys) and c.291A>G (p.Ile97Met), each with specific geographic distribution."
    explanation: >-
      The discovery cohort establishing germline loss-of-function HAVCR2
      variants as a defining lesion in a majority of cases.
  - reference: PMID:30374066
    reference_title: "Germline HAVCR2 mutations altering TIM-3 characterize subcutaneous panniculitis-like T cell lymphomas with hemophagocytic lymphohistiocytic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both variants induce protein misfolding and abrogate TIM-3's plasma membrane expression, leading to persistent immune activation and increased production of inflammatory cytokines, including tumor necrosis factor-α and interleukin-1β, promoting HLH and SPTCL."
    explanation: >-
      Functional work in the same paper showing the molecular consequence -
      misfolding and loss of surface TIM-3 - that makes this a loss-of-function
      node.
  - reference: PMID:30792187
    reference_title: "Frequent germline mutations of HAVCR2 in sporadic subcutaneous panniculitis-like T-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients harbored homozygous p.Y82C mutations, and 1 showed compound heterozygous mutations (p.Y82C and p.T101I)."
    explanation: >-
      Documents the biallelic genotypes that define this node's genetic
      context.
  downstream:
  - target: Unrestrained Innate Immune Activation
    description: >-
      Absent surface TIM-3 removes an inhibitory input on macrophages and
      dendritic cells, lowering the threshold for innate activation.
- name: Unrestrained Innate Immune Activation
  biological_scale: CELLULAR
  description: >-
    With TIM-3 missing from the cell surface, myeloid cells sustain innate
    signalling that would normally be terminated. The measured consequence in
    patient material is persistent immune activation with excess production of
    inflammatory cytokines, notably TNF and interleukin-1 beta. Inflammasome
    assembly is the proposed proximal route to interleukin-1 family cytokine
    release; that step is inferred from TIM-3 biology rather than demonstrated
    directly in SPTCL tissue, and is recorded here at lower confidence than the
    cytokine measurements themselves.

- accession: massive:MSV000092401
  title: LCMSMS Quantitation of HILIC Enriched N glycopeptides derived from low abundance serum glycoproteins in patients with Narcolepsy Type I
  description: Glycoproteomics analysis is always challenging because of low abundance and complex site-specific heterogeneity. Glycoproteins are involved in various biological processes such as cell signaling, adhesion, and cell cell communication and may serve as potential biomarkers when analyzing different diseases. Here, we study glycoproteins in Narcolepsy Type I disease, a variant of narcolepsy characterized by cataplexy the sudden onset of muscle weakness usually caused by strong emotions. There is currently no cure for this life-altering disease.

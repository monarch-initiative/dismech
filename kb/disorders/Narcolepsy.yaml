- accession: geo:GSE21592
  title: Genome-wide gene expression profiling of human narcolepsy
  description: 'Study objectives: The objectives of this study was perform the global gene expression profiling aimed at identifying differentially expressed genes in the circulating lympho-monocytes of NRLCP patients affected by Narcolepsy with Cataplexy (NRLCP). Based on the tight association to the HLA-DQB1*0602 haplotype in caucasians, it could be hypotesized an immunological dysregulation underlying the pathogenesis of the disease. Design: 10 NRLCP patients with 10 healthy controls were compared. Total RNA isolated from blood specimens was analyzed using microarray technology followed by statistical data analysis to detect genome-wide differential gene expression between patients and controls.'

- accession: ega:EGAS00001004886
  title: mRNA and T cell receptor sequencing of patients with Pandemrix-associated narcolepsy type 1
  description: Increased risk of Narcolepsy type 1 (NT1) was reported among children and adolescents vaccinated with AS03-adjuvanted pandemic influenza A vaccine (H1N1; Pandemrix®). We hypothesized that viral T cell epitope(s) in Pandemrix mimicked self-epitope(s), and that recognition of these cross-reactive epitopes contributed to disease-specific autoimmunity. We demonstrate that pediatric, Pandemrix-associated NT1 patients had enhanced T-cell immunity against dominant T-cell epitopes of Pandemrix vaccine viral proteins neuraminidase (NA) and nucleoprotein (NP), and also responded against a self-epitope in brain-expressed protein-O-mannosyltransferase 1 (POMT1).

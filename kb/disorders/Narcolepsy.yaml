environmental:
- name: H1N1 Infection
  exposure_term:
    preferred_term: viral exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  notes: Increased risk after 2009 pandemic. Evidenced independently of vaccination
    by a Chinese post-pandemic series, in which almost no patient had been vaccinated.
  evidence:
  - reference: PMID:21866560
    reference_title: "Narcolepsy onset is seasonal and increased following the 2009 H1N1 pandemic in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a 3-fold increase in narcolepsy onset following the 2009 H1N1 winter influenza pandemic. The increase is unlikely to be explained by increased vaccination, as only 8 of 142 (5.6%) patients recalled receiving an H1N1 vaccination"
    explanation: "Retrospective analysis of onset in 629 Beijing patients, 86 percent of them children. Because vaccination was rare in this sample, it separates the infection exposure from the vaccine exposure curated below."
- name: Pandemrix Vaccine
  notes: Associated with increased narcolepsy risk in Europe after the 2009 pandemic
    vaccination campaign. The magnitude is drawn from observational studies whose
    methodological limitations are contested; both the estimate and the
    manufacturer-affiliated critique of it are cited, and they disagree.
  evidence:
  - reference: PMID:29855798
    reference_title: "Narcolepsy Associated with Pandemrix Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the risk of narcolepsy was increased 5- to 14-fold in children and adolescents and 2- to 7-fold in adults"
    explanation: "Reports the magnitude of the association between the AS03-adjuvanted pandemic vaccine and incident narcolepsy across European studies."
  - reference: PMID:26379011
    reference_title: "Pandemrix™ and narcolepsy: A critical appraisal of the observational studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "significant methodological limitations of the studies have not been fully addressed and raise questions about the reported risk estimates"
    explanation: "Cited deliberately alongside the risk estimate as the dissenting reading of the same twelve European studies. Provenance matters here and is not neutral: the authors are staff and contractors of GSK Vaccines, the manufacturer of Pandemrix, together with a pharmacovigilance consultancy, so this is the manufacturer-affiliated critique rather than independent scrutiny. The two cited sources genuinely disagree - PMID:29855798 concedes that confounding and diagnostic bias may influence some studies but judges it unlikely they explain the increased incidence across every country where Pandemrix was used. The dispute is recorded here rather than resolved."
- name: Streptococcal Infection
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: Possible trigger in some cases
  evidence:

name: Narcolepsy
creation_date: '2025-12-19T14:27:56Z'
description: >-
  Narcolepsy is a chronic neurological sleep disorder characterized by excessive
  daytime sleepiness and dysregulation of rapid eye movement (REM) sleep. Type 1
  narcolepsy results from selective loss of hypothalamic
  orexin/hypocretin-producing neurons, presumed autoimmune in origin, and presents with cataplexy;
  type 2 lacks cataplexy and preserves orexin levels. Associated features include
  sleep paralysis, hypnagogic hallucinations, and fragmented nocturnal sleep.
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
disease_term:
  preferred_term: narcolepsy
  term:
    id: MONDO:0021107
    label: narcolepsy
has_subtypes:
- name: Narcolepsy Type 1
  description: With cataplexy and orexin/hypocretin deficiency.
  evidence:
  - reference: DOI:10.1111/jsr.14277
    reference_title: Narcolepsy and rapid eye movement sleep
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      The disease is nowadays distinguished as narcolepsy type 1 and type 2.
    explanation: >
      The deep-research report surfaced this 2024 review as current support for
      the NT1/NT2 subtype split.
- name: Narcolepsy Type 2
  description: Without cataplexy, normal or near-normal orexin levels.
  evidence:
  - reference: DOI:10.1111/jsr.14277
    reference_title: Narcolepsy and rapid eye movement sleep
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Conversely, the causes of narcolepsy type 2, where cataplexy and orexin
      deficiency are absent, remain unknown.
    explanation: >
      This directly supports the NT2 definition used in the subtype assertion.
pathophysiology:
- name: Orexin/Hypocretin Deficiency
  description: >
    Loss of orexin-producing neurons in the lateral hypothalamus removes the
    signal that normally holds the sleep-wake switch in a stable position.
    Postmortem series show an 85-95% reduction in orexin neuron number, and the
    loss is cell-type-selective: the intermingled melanin-concentrating hormone
    neurons are spared, which excludes a nonspecific hypothalamic lesion. Because
    the population is small and unreplaced, the deficit is permanent, and it is
    detectable in life as low or undetectable CSF hypocretin-1.
    Scoped to Narcolepsy Type 1: CSF hypocretin-1 is normal or intermediate in
    most patients with Type 2, which is why this node - and its conformance to
    the orexin module's trigger - applies to the Type 1 subtype only.
  role: trigger
  biological_scale: CELLULAR
  subtypes:
  - Narcolepsy Type 1
  conforms_to: "orexin_arousal_instability#Loss of Hypothalamic Orexin (Hypocretin) Signal"
  downstream:
  - target: Sleep-Wake State Instability
    description: >-
      Loss of the orexin signal removes excitatory drive to the ascending arousal
      nuclei, so the sleep-wake switch can no longer be held stable and flips at
      inappropriate times in both directions.
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: Orexin Neuron
    term:
      id: CL:0011109
      label: hypocretin-secreting neuron
  biological_processes:
  - preferred_term: Sleep-Wake Regulation
    term:
      id: GO:0042745
      label: circadian sleep/wake cycle
  evidence:
  - reference: PMID:25728441
    reference_title: "Hypocretin (orexin) biology and the pathophysiology of narcolepsy with cataplexy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Narcolepsy with cataplexy is caused by hypocretin deficiency owing to destruction of most of the hypocretin-producing neurons in the hypothalamus."
    explanation: Landmark review establishes hypocretin neuron loss as the cause of narcolepsy with cataplexy.
- name: Autoimmune Destruction
  description: >
    Strong HLA-DQB1*06:02 association suggests autoimmune etiology. T-cell
    mediated destruction of hypocretin neurons is the leading hypothesis.
    Environmental triggers (infections, H1N1 vaccination) may initiate
    the autoimmune response in genetically susceptible individuals. Direct
    cellular evidence has since been obtained: hypocretin-specific CD4+ T cells
    are detectable in patients and not in controls, and hypocretin-specific CD8+
    T cells are found in blood and cerebrospinal fluid.
  role: trigger
  biological_scale: CELLULAR
  subtypes:
  - Narcolepsy Type 1
  downstream:
  - target: Orexin/Hypocretin Deficiency
    description: >-
      Immune-mediated destruction of the orexin-producing neurons is the route by
      which the orexin signal is lost in Type 1 narcolepsy.
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: Autoimmune Response
    term:
      id: GO:0002460
      label: adaptive immune response based on somatic recombination of immune receptors built from immunoglobulin superfamily domains
  evidence:
  - reference: PMID:25728441
    reference_title: "Hypocretin (orexin) biology and the pathophysiology of narcolepsy with cataplexy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The hypothesis that a targeted immune-mediated or autoimmune attack causes the specific degeneration of hypocretin neurons arose mainly through the discovery of genetic associations, first with the HLA-DQB1*06:02 allele and then with the T-cell receptor α locus."
    explanation: Genetic associations with HLA and TCR loci strongly support autoimmune etiology.
  - reference: PMID:32227223
    reference_title: "Narcolepsy type 1: what have we learned from immunology?"
    supports: SUPPORT
    snippet: "Narcolepsy type 1 is hypothesized to be an autoimmune disease targeting the hypocretin/orexin neurons in the hypothalamus. Ample genetic and epidemiological evidence points in the direction of a pathogenesis involving the immune system"
    explanation: Recent review summarizing that genetic and epidemiological evidence supports autoimmune pathogenesis.
  - reference: PMID:38077397
    reference_title: "The transcriptomics profiling of blood CD4 and CD8 T-cells in narcolepsy type I."
    supports: SUPPORT
    snippet: "Narcolepsy Type I (NT1) is a rare, life-long sleep disorder arising as a consequence of the extensive destruction of orexin-producing hypothalamic neurons. The mechanisms involved in the destruction of orexin neurons are not yet elucidated but the association of narcolepsy with environmental triggers and genetic susceptibility (strong association with the HLA, TCRs and other immunologically-relevant loci) implicates an immuno-pathological process."
    explanation: Transcriptomic study confirms the immunological basis and T-cell involvement in narcolepsy pathogenesis.
- name: Sleep-Wake State Instability
  description: >-
    The rate-limiting step, and the node that makes sense of the disorder's
    apparent paradox. Loss of orexinergic stabilisation does not abolish any
    single behavioural state; it makes every state transition too easy.
    Wakefulness fragments into involuntary sleep episodes, and nocturnal sleep
    fragments into frequent awakenings - which is why these patients are
    simultaneously excessively sleepy by day and poor sleepers by night, an
    observation a simple "insufficient wake drive" account does not predict.
    Unlike the trigger nodes above, this node is not scoped to Type 1: Type 2
    patients show the same state instability without a demonstrated orexin
    deficit, which is precisely why the module places its conformance bar at the
    trigger rather than here.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "orexin_arousal_instability#Sleep-Wake State Instability"
  biological_processes:
  - preferred_term: sleep-wake cycle state transition
    term:
      id: GO:0022410
      label: circadian sleep/wake cycle process
    modifier: ABNORMAL
  - preferred_term: regulation of the sleep-wake cycle
    term:
      id: GO:0042749
      label: regulation of circadian sleep/wake cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:10481909
    reference_title: "Narcolepsy in orexin knockout mice: molecular genetics of sleep regulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that orexin regulates sleep/wakefulness states
    explanation: >-
      Names the function lost at this node - regulation of behavioural state
      rather than production of wakefulness - which is the distinction that makes
      the day-night paradox coherent.
  - reference: PMID:10458611
    reference_title: The sleep disorder canine narcolepsy is caused by a mutation in the hypocretin (orexin) receptor 2 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is characterized by daytime sleepiness, cataplexy, and striking
      transitions from wakefulness into rapid eye movement (REM) sleep.
    explanation: >-
      Describes the instability phenotype as abrupt inappropriate state
      transitions, which is the readout this node encodes.
  downstream:
  - target: Dissociated Intrusion of REM Sleep Components
    description: >-
      An unstable switch permits REM sleep to be entered directly from
      wakefulness and permits individual REM components to appear in isolation.
    causal_link_type: DIRECT
- name: Dissociated Intrusion of REM Sleep Components
  description: >-
    REM sleep is normally an all-or-none package: EEG desynchronisation, rapid
    eye movements, dreaming, and skeletal muscle atonia arrive together. State
    instability lets the package come apart, so single components appear at the
    wrong time and without the others. Muscle atonia intruding into full
    wakefulness is cataplexy; atonia persisting into waking consciousness at a
    state boundary is sleep paralysis; dream imagery without sleep is hypnagogic
    hallucination; and the whole state entered directly from wake is a
    sleep-onset REM period. This node is what distinguishes orexin-driven
    hypersomnolence from every other cause of sleepiness, and is the reason the
    multiple sleep latency test counts sleep-onset REM periods rather than only
    measuring sleep latency.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "orexin_arousal_instability#Dissociated Intrusion of REM Sleep Components into Wakefulness"
  biological_processes:
  - preferred_term: REM sleep
    term:
      id: GO:0042747
      label: circadian sleep/wake cycle, REM sleep
    modifier: ABNORMAL
  notes: >-
    The atonia machinery whose intrusion produces cataplexy is the same pontine
    circuit modelled in rem_sleep_atonia_control_failure, where it fails in the
    opposite direction - atonia absent during REM sleep rather than present
    during wakefulness. Narcolepsy type 1 can show both, and REM sleep behaviour
    disorder is a recognised association. This entry does not declare conformance
    to that module, because it curates no polysomnographic finding of REM sleep
    without atonia, which is that module's stated entry requirement.
  evidence:
  - reference: PMID:10481909
    reference_title: "Narcolepsy in orexin knockout mice: molecular genetics of sleep regulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a disorder characterized primarily by rapid eye movement (REM) sleep
      dysregulation
    explanation: >-
      Identifies REM dysregulation as the defining downstream consequence of
      orexin loss, which is what this node models.
  - reference: PMID:10458611
    reference_title: The sleep disorder canine narcolepsy is caused by a mutation in the hypocretin (orexin) receptor 2 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This result identifies hypocretins as major sleep-modulating
      neurotransmitters
    explanation: >-
      Places the REM-dissociation phenotype downstream of hypocretin
      neurotransmission rather than treating it as an independent finding.

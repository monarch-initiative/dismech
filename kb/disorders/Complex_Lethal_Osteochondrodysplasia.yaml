differential_diagnoses:
- name: Osteogenesis imperfecta, perinatal lethal
  disease_term:
    preferred_term: osteogenesis imperfecta type 2
    term:
      id: MONDO:0008147
      label: osteogenesis imperfecta type 2
  description: >-
    Perinatal-lethal brittle bone disease, usually from COL1A1 or COL1A2
    variants. The original TAPT1 fetuses were first diagnosed this way.
  distinguishing_features:
  - Brain, lung and kidney malformations in TAPT1 disease
  - Biallelic TAPT1 rather than type I collagen variants
  evidence:
  - reference: PMID:37292039
    reference_title: "TAPT1-at the crossroads of extracellular matrix and signaling in Osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The first fetuses harboring TAPT1 mutations were initially diagnosed with lethal features of OI (Symoens et al, 2015)."
    explanation: Lethal OI is the main clinical mimic.
diagnosis:
- name: TAPT1 genetic testing
  description: >-
    Exome or genome sequencing identifies biallelic TAPT1 variants. In the
    allelic osteogenesis imperfecta with neonatal progeroid features, a deep
    intronic protein-null allele was missed by exome sequencing and found only
    by RNA sequencing, so RNA studies can help when exome results are
    negative.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36652330
    reference_title: "A progeroid syndrome caused by a deep intronic variant in TAPT1 is revealed by RNA/SI-NET sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By integrating homozygosity mapping and RNA-seq, we delineated a deep intronic TAPT1 mutation (c.1237-52 G>A) that segregated with the disease."
    explanation: RNA sequencing found a TAPT1 variant exome sequencing missed, in the allelic osteogenesis imperfecta presentation.
discussions:
- discussion_id: oclsbg_tapt1_localization
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Mislocalization of TAPT1 from the Centrosome
  - pathophysiology#Loss of TAPT1-SUCO Protection of Newly Synthesized Proteins
  prompt: >-
    Does TAPT1 act at the centrosome and ciliary basal body, in the
    endoplasmic reticulum, or in both?
  rationale: >-
    The gene-discovery study found TAPT1 at the centrosome and basal body and
    tied the disease to defective ciliogenesis. Later fibroblast
    fractionation found TAPT1 enriched in a combined mitochondria/ER/Golgi
    fraction, both mouse knockout studies place it in the ER, and a surviving
    TAPT1 patient's fibroblasts formed cilia normally. Protein-null patient
    fibroblasts showed no major ER morphology defect or ER stress. Which
    location carries the bone phenotype decides whether this is mainly a
    ciliopathy or a secretory-pathway disorder.
- discussion_id: oclsbg_allele_severity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic TAPT1 Variants
  - pathophysiology#Altered BMP-SMAD1/5 Signaling
  prompt: >-
    Why do partial loss-of-function TAPT1 alleles cause fetal death when a
    protein-null allele causes osteogenesis imperfecta with survival into
    childhood?
  rationale: >-
    The lethal alleles are described as hypomorphic, yet the null allele is
    milder, which inverts the usual dosage expectation. One cell study found
    the lethal alleles act as gain of function on SMAD1 degradation, which
    would explain the inversion. Only a handful of families have been
    reported, so genetic background and ascertainment cannot be excluded.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  No GeneReviews or StatPearls chapter covers this disorder. Only two families with the lethal form are described in the abstract-level
  literature, so phenotype frequencies are those of the defining features and
  no prevalence is recorded. The full Symoens et al. (2015) paper is not open
  access in the reference cache, and the specific brain, lung and kidney
  anomalies are not named in its abstract, hence the coarse phenotype
  bindings. No treatment beyond prenatal diagnosis and perinatal care is
  described, so no treatment block is recorded.

animal_models:
- name: tapt1b morpholino knockdown zebrafish
  species: Zebrafish
  genotype: tapt1b morpholino knockdown
  publication: PMID:26365339
  description: >-
    Morpholino knockdown of the zebrafish TAPT1 orthologue tapt1b, used in the
    founding report to test the developmental consequences of TAPT1 loss.
  modeled_mechanisms:
  - target: Aberrant Chondrocyte and Neural Crest Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the cartilage/neural-crest differentiation defect and delayed
      ossification expected from TAPT1 loss.
    limitations: >-
      A transient morpholino knockdown rather than a germline loss-of-function
      mutant, so off-target and incomplete-knockdown effects cannot be excluded;
      zebrafish craniofacial cartilage development is not a direct model of the
      human endochondral and membranous skeleton.
    readouts:
    - name: Craniofacial cartilage morphology and ossification
      target: Aberrant Chondrocyte and Neural Crest Differentiation
      direction: DECREASED
      interpretation: Severe craniofacial cartilage malformation with delayed ossification.
      evidence:
      - reference: PMID:26365339
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Knockdown of tapt1b in zebrafish induces severe craniofacial cartilage malformations and delayed ossification, which is shown to be associated with aberrant differentiation of cranial neural crest cells."
        explanation: Reports the craniofacial cartilage and ossification readout in the knockdown.
    evidence:
    - reference: PMID:26365339
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of tapt1b in zebrafish induces severe craniofacial cartilage malformations and delayed ossification, which is shown to be associated with aberrant differentiation of cranial neural crest cells."
      explanation: Supports treating the tapt1b knockdown as informative for the differentiation node.

discussions:
- discussion_id: tapt1_lesion_to_hypomineralization_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism do the TAPT1 loss-of-function defects (disrupted
    ciliogenesis, Golgi trafficking, and dysregulated BMP-SMAD1/5 signaling)
    produce the in-utero generalized skeletal hypomineralization and fractures
    seen in affected fetuses?
  rationale: >-
    The founding report establishes the cellular defects (mislocalization, Golgi
    disruption, failed ciliogenesis) but does not state how they cause bone
    hypomineralization. A later mechanistic study shows TAPT1 loss amplifies
    BMP-SMAD1/5 signaling and boosts osteogenic differentiation in murine
    mesenchymal and myoblast cell lines, which is directionally opposite to the
    clinical hypomineralization, so the path from the molecular/cellular lesion
    to the tissue-level mineralization defect is unresolved.
  attaches_to:
  - pathophysiology#Dysregulated BMP-SMAD1/5 Signaling
  - pathophysiology#Skeletal Hypomineralization and Delayed Ossification
  status: OPEN
  posed_by: "dismech curation (claim #16098)"


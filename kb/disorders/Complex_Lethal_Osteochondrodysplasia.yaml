- name: Altered BMP-SMAD1/5 Signaling
  description: >-
    In cell lines TAPT1 restrains BMP signaling by bringing SMAD1/5 to the
    SMURF1 ubiquitin ligase for proteasomal degradation. Two lethal
    osteochondrodysplasia alleles increased this activity on SMAD1, which
    would lower BMP output in bone-forming cells. This conflicts with the
    partial loss-of-function reading of the same alleles and has not been
    tested in patient tissue.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

name: Complex Lethal Osteochondrodysplasia
creation_date: "2026-10-30T23:40:00Z"
category: Mendelian
synonyms:
- Complex lethal osteochondrodysplasia, Symoens-Barnes-Gistelinck type
- TAPT1-related osteochondrodysplasia
disease_term:
  preferred_term: complex lethal osteochondrodysplasia
  term:
    id: MONDO:0014821
    label: complex lethal osteochondrodysplasia
description: >-
  A fetal-lethal, autosomal recessive osteochondrodysplasia caused by biallelic
  loss-of-function variants in TAPT1 (transmembrane anterior posterior
  transformation 1). The syndrome sits at the clinical overlap between lethal
  skeletal dysplasias and ciliopathies: severe generalized skeletal
  hypomineralization with intra-uterine fractures is combined with congenital
  developmental anomalies of the brain, lungs, and kidneys. TAPT1 normally
  localizes to the centrosome/ciliary basal body; loss of function mislocalizes
  the protein to the cytoplasm and disrupts Golgi morphology, intracellular
  trafficking, and primary cilium formation, producing a combined
  skeletal-dysplasia/ciliopathy phenotype.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The causal TAPT1 variants are biallelic, consistent with autosomal
    recessive inheritance (OMIM 616897). The cached abstract does not state the
    mode of inheritance in words, so the evidence below supports the
    gene-disease link, and the recessive mode is inferred from the biallelic
    variant findings.
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that TAPT1 mutations underlie a complex congenital syndrome, showing clinical overlap between lethal skeletal dysplasias and ciliopathies."
    explanation: Establishes TAPT1 as the causal gene; the autosomal recessive mode is inferred from the biallelic nature of the variants rather than stated in this abstract.

genetic:
- name: TAPT1
  gene_term:
    preferred_term: TAPT1
    term:
      id: hgnc:26887
      label: TAPT1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic loss-of-function variants in TAPT1, which encodes the
    evolutionarily conserved transmembrane anterior posterior transformation 1
    protein. TAPT1 was first implicated in murine axial skeletal patterning; its
    loss in humans produces this complex lethal osteochondrodysplasia.
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The evolutionarily conserved transmembrane anterior posterior transformation 1 protein, encoded by TAPT1, is involved in murine axial skeletal patterning, but its cellular function remains unknown."
    explanation: Identifies the gene and its prior association with skeletal patterning.

pathophysiology:
- name: TAPT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function TAPT1 variants abolish normal TAPT1 function.
  genes:
  - preferred_term: TAPT1
    term:
      id: hgnc:26887
      label: TAPT1
  downstream:
  - target: TAPT1 Mislocalization and Disrupted Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26365339
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "whereas defective TAPT1 mislocalizes to the cytoplasm and disrupts Golgi morphology and trafficking and normal primary cilium formation"
      explanation: Loss of normal TAPT1 directly causes its mislocalization and the downstream trafficking/cilium defects.
  - target: Dysregulated BMP-SMAD1/5 Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36370851
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TAPT1 inhibits BMP signaling and destabilizes the SMAD1/5 protein by facilitating its interaction with SMURF1 E3 ubiquitin ligase, which leads to SMAD1/5 proteasomal degradation"
      explanation: Because wild-type TAPT1 restrains BMP signaling by destabilizing SMAD1/5, its loss directly derepresses this pathway.
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We establish that wild-type TAPT1 localizes to the centrosome and/or ciliary basal body"
    explanation: Establishes the normal localization that loss of function disrupts.

- name: TAPT1 Mislocalization and Disrupted Trafficking
  biological_scale: CELLULAR
  description: >-
    Defective TAPT1 mislocalizes from the centrosome/ciliary basal body to the
    cytoplasm, disrupting Golgi morphology and intracellular trafficking and
    preventing normal primary cilium formation.
  biological_processes:
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  - preferred_term: protein transport
    modifier: ABNORMAL
    term:
      id: GO:0015031
      label: protein transport
  downstream:
  - target: Aberrant Chondrocyte and Neural Crest Differentiation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disrupts Golgi morphology and trafficking and normal primary cilium formation"
    explanation: Documents the cellular trafficking and ciliary defect.

- name: Aberrant Chondrocyte and Neural Crest Differentiation
  biological_scale: CELLULAR
  description: >-
    Disrupted ciliary and trafficking function impairs differentiation of
    cartilage and cranial neural crest lineages, as shown by tapt1b knockdown in
    zebrafish causing craniofacial cartilage malformation and delayed
    ossification associated with aberrant cranial neural crest differentiation.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    modifier: ABNORMAL
    term:
      id: GO:0001755
      label: neural crest cell migration
  downstream:
  - target: Skeletal Hypomineralization and Delayed Ossification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockdown of tapt1b in zebrafish induces severe craniofacial cartilage malformations and delayed ossification, which is shown to be associated with aberrant differentiation of cranial neural crest cells."
    explanation: Model-organism evidence linking TAPT1 loss to aberrant cartilage/neural-crest differentiation and delayed ossification.

- name: Dysregulated BMP-SMAD1/5 Signaling
  biological_scale: MOLECULAR
  description: >-
    TAPT1 normally restrains BMP signaling by promoting SMURF1-mediated
    ubiquitination and proteasomal degradation of SMAD1/5. Loss of TAPT1
    stabilizes SMAD1/5 and amplifies BMP signaling; in TAPT1-deficient
    mesenchymal and myoblast cell lines this boosts osteogenic
    differentiation, and a subset of patient TAPT1 alleles behaves as
    gain-of-function on SMAD1 protein levels.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: SMAD protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  evidence:
  - reference: PMID:36370851
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TAPT1-deficient murine C2C12 myoblasts or C3H/10T1/2 mesenchymal stem cells exhibit elevated SMAD1/5/9 protein levels, which amplifies BMP activation"
    explanation: Demonstrates that TAPT1 loss elevates SMAD1/5/9 and amplifies BMP signaling in mesenchymal and myoblast lines.
  - reference: PMID:36370851
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a subset of TAPT1 mutations identified in humans with lethal skeletal dysplasia exhibited gain-of-function activity on SMAD1 protein levels"
    explanation: Links the SMAD1/5 dysregulation mechanism to pathogenic human TAPT1 alleles.


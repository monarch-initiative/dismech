    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Our six new patients carry a complete loss‐of‐function mutation resulting in a protein‐null allele, whereas both prior studies showed partial loss‐of‐function mutations including missense and in‐frame exon 6 and exon 10 skipping (Symoens et al, 2015; Patel et al, 2017)."
    explanation: Characterizes the original lethal alleles as partial loss of function.

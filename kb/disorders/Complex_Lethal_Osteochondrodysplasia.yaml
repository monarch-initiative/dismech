    reference_title: "TAPT1 interacts with SUCO to maintain the homeostasis of newly synthesized proteins and brain development in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanically, we reveal that TAPT1 interacts with SUCO in the endoplasmic reticulum to maintain newly synthesized proteins, including those important for brain development."
    explanation: TAPT1-SUCO function in the ER in the knockout mouse.
  downstream:
  - target: Golgi Disruption and Impaired Secretory Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41379998

- name: Loss of TAPT1-SUCO Protection of Newly Synthesized Proteins
  description: >-
    In mouse brain and cultured cells TAPT1 sits in the endoplasmic reticulum
    and binds SUCO. The complex keeps newly synthesized proteins from being
    treated as misfolded and degraded by ER-associated degradation. Without it,
    protein degradation is overactive and ER-to-Golgi transport slows.
    Biallelic SUCO variants also cause a skeletal dysplasia. This node is
    drawn from knockout mice and cells, not patient tissue.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum

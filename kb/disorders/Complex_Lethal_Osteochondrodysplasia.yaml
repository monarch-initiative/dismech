name: Complex Lethal Osteochondrodysplasia
creation_date: "2026-10-30T23:50:00Z"
category: Mendelian
synonyms:
- Complex lethal osteochondrodysplasia, Symoens-Barnes-Gistelinck type
- OCLSBG
- TAPT1-related lethal osteochondrodysplasia
description: >-
  Complex lethal osteochondrodysplasia (Symoens-Barnes-Gistelinck type) is an
  autosomal recessive, fetal-lethal skeletal dysplasia caused by biallelic
  TAPT1 variants. It was described in two consanguineous families whose
  fetuses had severe hypomineralization of the whole skeleton with
  intrauterine fractures, together with malformations of the brain, lungs and
  kidneys. The fetuses were first thought to have lethal osteogenesis
  imperfecta, and the disorder overlaps clinically with both lethal skeletal
  dysplasias and ciliopathies. TAPT1 is a conserved multi-pass transmembrane
  protein. In patient fibroblasts the mutant protein leaves the centrosome
  and ciliary basal body, disturbs Golgi morphology and secretory trafficking,
  delays procollagen secretion and impairs primary cilium formation. Mouse
  studies place TAPT1 in the endoplasmic reticulum, where it partners SUCO to
  protect newly made proteins from degradation. The disease-causing alleles
  are thought to be partial loss of function. A protein-null TAPT1 allele
  causes osteogenesis imperfecta with neonatal progeroid features and survival
  into childhood, homozygous p.Leu108Trp causes osteogenesis imperfecta
  compatible with adult life, and other alleles cause early-onset cataract. There is no
  specific treatment.

- name: Mislocalization of TAPT1 from the Centrosome
  description: >-
    Wild-type TAPT1 was found at the centrosome and ciliary basal body in
    fibroblasts, and the disease alleles redistributed it to the cytoplasm.
    Later fractionation found it in a combined mitochondria/ER/Golgi fraction
    and mouse studies place it in the endoplasmic reticulum, so where the
    protein normally acts is not settled.

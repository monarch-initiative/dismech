pathophysiology:
- name: Biallelic Hypomorphic TAPT1 Variants
  description: >-
    The original families carried a homozygous missense variant, p.Asp353Val,
    and a homozygous splice variant causing in-frame skipping of exon 10. Both
    are thought to leave partial TAPT1 function, in contrast with the
    protein-null allele that causes osteogenesis imperfecta with neonatal
    progeroid features and survival into childhood.

name: Complex Lethal Osteochondrodysplasia
creation_date: "2026-10-30T23:40:00Z"
category: Mendelian
synonyms:
- Complex lethal osteochondrodysplasia, Symoens-Barnes-Gistelinck type
- TAPT1-related osteochondrodysplasia
disease_term:
  preferred_term: complex lethal osteochondrodysplasia
  term:
    id: MONDO:0014821
    label: complex lethal osteochondrodysplasia
description: >-
  A fetal-lethal, autosomal recessive osteochondrodysplasia caused by biallelic
  loss-of-function variants in TAPT1 (transmembrane anterior posterior
  transformation 1). The syndrome sits at the clinical overlap between lethal
  skeletal dysplasias and ciliopathies: severe generalized skeletal
  hypomineralization with intra-uterine fractures is combined with congenital
  developmental anomalies of the brain, lungs, and kidneys. TAPT1 normally
  localizes to the centrosome/ciliary basal body; loss of function mislocalizes
  the protein to the cytoplasm and disrupts Golgi morphology, intracellular
  trafficking, and primary cilium formation, producing a combined
  skeletal-dysplasia/ciliopathy phenotype.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The causal TAPT1 variants are biallelic, consistent with autosomal
    recessive inheritance (OMIM 616897). The cached abstract does not state the
    mode of inheritance in words, so the evidence below supports the
    gene-disease link, and the recessive mode is inferred from the biallelic
    variant findings.
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that TAPT1 mutations underlie a complex congenital syndrome, showing clinical overlap between lethal skeletal dysplasias and ciliopathies."
    explanation: Establishes TAPT1 as the causal gene; the autosomal recessive mode is inferred from the biallelic nature of the variants rather than stated in this abstract.

genetic:
- name: TAPT1
  gene_term:
    preferred_term: TAPT1
    term:
      id: hgnc:26887
      label: TAPT1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic loss-of-function variants in TAPT1, which encodes the
    evolutionarily conserved transmembrane anterior posterior transformation 1
    protein. TAPT1 was first implicated in murine axial skeletal patterning; its
    loss in humans produces this complex lethal osteochondrodysplasia.
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The evolutionarily conserved transmembrane anterior posterior transformation 1 protein, encoded by TAPT1, is involved in murine axial skeletal patterning, but its cellular function remains unknown."
    explanation: Identifies the gene and its prior association with skeletal patterning.

pathophysiology:
- name: TAPT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function TAPT1 variants abolish normal TAPT1 function.
  genes:
  - preferred_term: TAPT1
    term:
      id: hgnc:26887
      label: TAPT1
  downstream:
  - target: TAPT1 Mislocalization and Disrupted Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26365339
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "whereas defective TAPT1 mislocalizes to the cytoplasm and disrupts Golgi morphology and trafficking and normal primary cilium formation"
      explanation: Loss of normal TAPT1 directly causes its mislocalization and the downstream trafficking/cilium defects.
  - target: Dysregulated BMP-SMAD1/5 Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36370851
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TAPT1 inhibits BMP signaling and destabilizes the SMAD1/5 protein by facilitating its interaction with SMURF1 E3 ubiquitin ligase, which leads to SMAD1/5 proteasomal degradation"
      explanation: Because wild-type TAPT1 restrains BMP signaling by destabilizing SMAD1/5, its loss directly derepresses this pathway.
  - target: Disrupted HOXC8-Dependent Axial Skeletal Patterning
    causal_link_type: DIRECT
  - target: Impaired Collagen Fibril Assembly
    causal_link_type: DIRECT
  - target: Surfactant and ABCA3 Dysregulation
    causal_link_type: DIRECT
  - target: SUCO-Dependent Proteostasis Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We establish that wild-type TAPT1 localizes to the centrosome and/or ciliary basal body"
    explanation: Establishes the normal localization that loss of function disrupts.

- name: TAPT1 Mislocalization and Disrupted Trafficking
  biological_scale: CELLULAR
  description: >-
    Defective TAPT1 mislocalizes from the centrosome/ciliary basal body to the
    cytoplasm, disrupting Golgi morphology and intracellular trafficking and
    preventing normal primary cilium formation.
  biological_processes:
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  - preferred_term: protein transport
    modifier: ABNORMAL
    term:
      id: GO:0015031
      label: protein transport
  downstream:
  - target: Aberrant Chondrocyte and Neural Crest Differentiation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disrupts Golgi morphology and trafficking and normal primary cilium formation"
    explanation: Documents the cellular trafficking and ciliary defect.

- name: Aberrant Chondrocyte and Neural Crest Differentiation
  biological_scale: CELLULAR
  description: >-
    Disrupted ciliary and trafficking function impairs differentiation of
    cartilage and cranial neural crest lineages, as shown by tapt1b knockdown in
    zebrafish causing craniofacial cartilage malformation and delayed
    ossification associated with aberrant cranial neural crest differentiation.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    modifier: ABNORMAL
    term:
      id: GO:0001755
      label: neural crest cell migration
  downstream:
  - target: Skeletal Hypomineralization and Delayed Ossification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26365339
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockdown of tapt1b in zebrafish induces severe craniofacial cartilage malformations and delayed ossification, which is shown to be associated with aberrant differentiation of cranial neural crest cells."
    explanation: Model-organism evidence linking TAPT1 loss to aberrant cartilage/neural-crest differentiation and delayed ossification.

- name: Dysregulated BMP-SMAD1/5 Signaling
  biological_scale: MOLECULAR
  description: >-
    TAPT1 normally restrains BMP signaling by promoting SMURF1-mediated
    ubiquitination and proteasomal degradation of SMAD1/5. Loss of TAPT1
    stabilizes SMAD1/5 and amplifies BMP signaling; in TAPT1-deficient
    mesenchymal and myoblast cell lines this boosts osteogenic
    differentiation, and a subset of patient TAPT1 alleles behaves as
    gain-of-function on SMAD1 protein levels.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: SMAD protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  evidence:
  - reference: PMID:36370851
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TAPT1-deficient murine C2C12 myoblasts or C3H/10T1/2 mesenchymal stem cells exhibit elevated SMAD1/5/9 protein levels, which amplifies BMP activation"
    explanation: Demonstrates that TAPT1 loss elevates SMAD1/5/9 and amplifies BMP signaling in mesenchymal and myoblast lines.
  - reference: PMID:36370851
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a subset of TAPT1 mutations identified in humans with lethal skeletal dysplasia exhibited gain-of-function activity on SMAD1 protein levels"
    explanation: Links the SMAD1/5 dysregulation mechanism to pathogenic human TAPT1 alleles.

- name: Disrupted HOXC8-Dependent Axial Skeletal Patterning
  biological_scale: TISSUE
  description: >-
    TAPT1 acts in the axial skeletal patterning program downstream of HOXC8;
    in mouse, Tapt1 mutation produces homeotic vertebral transformation,
    implicating the developmental program that shapes the axial skeleton in the
    human skeletal dysplasia. The human skeletal consequence is inferred from
    the mouse phenotype.
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    modifier: ABNORMAL
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  - preferred_term: skeletal system development
    modifier: ABNORMAL
    term:
      id: GO:0001501
      label: skeletal system development
  downstream:
  - target: Skeletal Hypomineralization and Delayed Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17151244
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We speculate that TAPT1 is a downstream effector of HOXC8 that may act by transducing or transmitting extracellular information required for axial skeletal patterning during development."
    explanation: Places TAPT1 in the HOXC8 axial skeletal patterning program; the mouse readout is homeotic vertebral transformation.
  - reference: PMID:17151244
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "L5Jcs1 homozygotes exhibit posterior-to-anterior transformations of the vertebral column midsection, similar to mice deficient for Hoxc8 and Hoxc9."
    explanation: The axial homeotic transformation produced by Tapt1 loss in mouse.

- name: Impaired Collagen Fibril Assembly
  biological_scale: MOLECULAR
  description: >-
    TAPT1 dysfunction disrupts collagen type I secretion and extracellular
    fibril assembly, the overlap with osteogenesis imperfecta biology.
    Symoens et al. already noted delayed collagen secretion in the lethal
    fetuses; Etich et al. showed in patient fibroblasts that secreted collagen
    fails to assemble into normal banded fibrils.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Multiple prenatal fractures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:37292039
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "secreted collagen was not able to assemble into banded fibrils"
    explanation: Patient-fibroblast electron microscopy showing defective collagen fibril assembly, the bone-fragility mechanism shared with OI.
  - reference: PMID:37292039
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we propose that mutations in TAPT1 can cause OI of variable severity through impaired collagen fibril formation and deregulation of bone turnover"
    explanation: States the collagen-assembly mechanism linking TAPT1 loss to bone fragility.

- name: Surfactant and ABCA3 Dysregulation
  biological_scale: CELLULAR
  description: >-
    ER-resident TAPT1 regulates autophagy-lysosomal degradation of the
    surfactant lipid transporter ABCA3. In mouse, Tapt1 deletion raises ABCA3
    turnover, reducing surfactant lipids and lamellar-body formation and
    causing neonatal atelectasis — the mechanistic candidate for the entry's
    pulmonary anomalies. Demonstrated in mouse; inferred for the human lung
    phenotype.
  cell_types:
  - preferred_term: pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: surfactant homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0043129
      label: surfactant homeostasis
  downstream:
  - target: Congenital lung anomalies
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:42401210
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TAPT1 interacts with the ATP-binding cassette transporter A3 (ABCA3), thereby regulating autophagy-lysosomal degradation of ABCA3. ABCA3 insufficiency reduces surfactant lipids, leading to defective lamellar body formation and surfactant production."
    explanation: Establishes the ABCA3/surfactant mechanism for the pulmonary phenotype in the mouse.
  - reference: PMID:42401210
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tapt1 deletion causes neonatal lethality due to atelectasis-induced respiratory distress"
    explanation: The pulmonary outcome of TAPT1 loss in the mouse.

- name: SUCO-Dependent Proteostasis Failure
  biological_scale: CELLULAR
  description: >-
    ER-resident TAPT1 forms a complex with SUCO that maintains the homeostasis
    of newly synthesized proteins. In mouse, brain-specific Tapt1 loss impairs
    neural progenitor proliferation and differentiation and dendritic/synaptic
    development — the mechanistic candidate for the entry's brain anomalies.
    Demonstrated in mouse; inferred for the human brain phenotype.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: ABNORMAL
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  downstream:
  - target: Congenital brain anomalies
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41379998
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TAPT1 interacts with SUCO in the endoplasmic reticulum to maintain newly synthesized proteins, including those important for brain development"
    explanation: Establishes the TAPT1-SUCO proteostasis mechanism for the brain phenotype in the mouse.
  - reference: PMID:41379998
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the brains of Tapt1 conditional knockout mice exhibit severe neurodevelopmental defects, including impaired proliferation and differentiation of neural progenitor cells and defects in dendritic and synaptic development, leading to severe microcephaly, motor dysfunction, and early death"
    explanation: The neurodevelopmental outcome of brain-specific TAPT1 loss in the mouse.


genetic:
- name: TAPT1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TAPT1
    term:
      id: hgnc:26887
      label: TAPT1
  notes: >-
    Lethal-form alleles: homozygous p.Asp353Val and a homozygous splice
    variant causing in-frame exon 10 skipping. Other TAPT1 alleles cause
    milder disorders that MONDO does not yet name separately: a deep intronic
    protein-null allele (c.1237-52G>A) with osteogenesis imperfecta and
    neonatal progeroid features (PMID:36652330), homozygous p.Leu108Trp with
    survivable osteogenesis imperfecta type III (PMID:37292039), and
    truncating alleles with early-onset cataract with or without skeletal
    involvement (PMID:27878435, PMID:36697720). No ClinGen gene-disease
    validity record for TAPT1 is in the reference cache.
  evidence:
  - reference: PMID:26365339
    reference_title: "Genetic Defects in TAPT1 Disrupt Ciliogenesis and Cause a Complex Lethal Osteochondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that TAPT1 mutations underlie a complex congenital syndrome, showing clinical overlap between lethal skeletal dysplasias and ciliopathies."
    explanation: Gene discovery.
  - reference: PMID:37292039
    reference_title: "TAPT1-at the crossroads of extracellular matrix and signaling in Osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The impact of the identified mutations ranges from partial to complete loss‐of‐function most likely causing the phenotypic variability from early lethal to survivable disease manifestation."
    explanation: Places the lethal form at one end of an allelic TAPT1 spectrum.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous WARS1 missense variants segregate with the neuropathy in
    multi-generation pedigrees. The recurrent p.His257Arg allele was found in
    two Taiwanese pedigrees of different ancestries and one Belgian family, and
    p.Asp314Gly co-segregated across three generations of a Chinese family.
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exome sequencing revealed a heterozygous mutation, c.770A > G (p.His257Arg), in the cytoplasmic tryptophanyl-tRNA synthetase (TrpRS) gene (WARS) that co-segregates with the neuropathy in the family."
    explanation: >-
      Establishes heterozygous transmission with co-segregation in an autosomal
      dominant pedigree.
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a novel heterozygous variant c.941A>G (p.Asp314Gly) of WARS in an index patient from an autosomal dominant dHMN family including five affected members over three generations."
    explanation: >-
      Independent family confirming dominant inheritance with a second allele.
pathophysiology:
- name: WARS1 Heterozygous Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous missense allele in WARS1, encoding cytoplasmic
    tryptophanyl-tRNA synthetase. The recurrent p.His257Arg allele was
    identified across three unrelated pedigrees from two continents;
    p.Asp314Gly is a second, independently ascertained allele associated with a
    milder, later-onset phenotype. Both lie in the catalytic body of the enzyme.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified the same mutation in another Taiwanese distal hereditary motor neuropathy pedigree with different ancestries and one additional Belgian distal hereditary motor neuropathy family of Caucasian origin"
    explanation: >-
      Establishes p.His257Arg as recurrent across unrelated pedigrees, which is
      what raised it above a private family variant.
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant completely co-segregates with the dHMN phenotype in the family, and it was classified as likely pathogenic according to the American College of Medical Genetics and Genomics standards and guidelines."
    explanation: >-
      Second allele, independently classified against ACMG criteria.
  downstream:
  - target: Dominant-Negative Loss of TrpRS Aminoacylation Activity
    causal_link_type: DIRECT
    description: >-
      The mutant subunit reduces aminoacylation activity of the enzyme beyond
      what one inactive copy would predict, i.e. it acts on the wild-type
      product rather than merely failing to contribute.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell transfection studies demonstrated a dominant-negative effect of the p.His257Arg mutation on aminoacylation activity of TrpRS, which subsequently compromised protein synthesis and reduced cell viability."
      explanation: >-
        States the dominant-negative effect on the canonical enzymatic activity
        directly.
  - target: Potentiated Angiostatic TrpRS-VE-Cadherin Interaction
    causal_link_type: DIRECT
    description: >-
      The same variant enhances a non-enzymatic activity of TrpRS, so the allele
      is not only subtractive. This is the arm that makes dHMN9 more than a
      translation-capacity disorder.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Further in vitro analyses showed that the WARS mutation could potentiate the angiostatic activities of TrpRS by enhancing its interaction with vascular endothelial-cadherin."
      explanation: >-
        Directly reports potentiation of the non-canonical angiostatic function
        by the disease variant.
- name: Dominant-Negative Loss of TrpRS Aminoacylation Activity
  biological_scale: MOLECULAR
  description: >-
    Charging of tRNA-Trp with tryptophan by cytoplasmic TrpRS is reduced. This
    is the canonical, housekeeping arm of the mechanism.
  molecular_functions:
  - preferred_term: tryptophan-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004830
      label: tryptophan-tRNA ligase activity
  biological_processes:
  - preferred_term: tryptophanyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006436
      label: tryptophanyl-tRNA aminoacylation
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell transfection studies demonstrated a dominant-negative effect of the p.His257Arg mutation on aminoacylation activity of TrpRS, which subsequently compromised protein synthesis and reduced cell viability."
    explanation: >-
      Names the reduced activity and its immediate consequence.
  downstream:
  - target: Reduced Global Protein Synthesis
    causal_link_type: DIRECT
    description: >-
      Reduced supply of charged tRNA-Trp limits elongation of any transcript
      containing tryptophan codons.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which subsequently compromised protein synthesis and reduced cell viability"
      explanation: >-
        Links the aminoacylation defect to translational output in the same
        experiment.
- name: Potentiated Angiostatic TrpRS-VE-Cadherin Interaction
  biological_scale: MOLECULAR
  description: >-
    Vertebrate TrpRS carries an N-terminal extension whose proteolytic removal
    yields the T2-TrpRS fragment, an angiostatic cytokine that acts
    extracellularly by binding vascular endothelial-cadherin (VE-cadherin). The
    full-length enzyme is inactive for this function. The dHMN9 variant enhances
    that interaction. Whether the relevant consequence in motor axons is
    vascular or a direct effect on the neuron is not established.
  molecular_functions:
  - preferred_term: cell adhesion molecule binding
    modifier: INCREASED
    term:
      id: GO:0050839
      label: cell adhesion molecule binding
  biological_processes:
  - preferred_term: negative regulation of angiogenesis
    modifier: INCREASED
    term:
      id: GO:0016525
      label: negative regulation of angiogenesis
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further in vitro analyses showed that the WARS mutation could potentiate the angiostatic activities of TrpRS by enhancing its interaction with vascular endothelial-cadherin."
    explanation: >-
      The disease-variant claim this node rests on.
  - reference: PMID:28910573
    reference_title: "An alternative conformation of human TrpRS suggests a role of zinc in activating non-enzymatic function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteolytic removal of the N-terminal 93 amino acids gives rise to T2-TrpRS, which has potent anti-angiogenic activity mediated through its extracellular interaction with VE-cadherin."
    explanation: >-
      Establishes the normal fragment biology that the disease variant acts on.
  - reference: PMID:33837705
    reference_title: "Non-canonical functions of human cytoplasmic tyrosyl-, tryptophanyl- and other aminoacyl-tRNA synthetases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the core catalytic domains of human TyrRS and TrpRS function as angiogenic and angiostatic factors, respectively, whereas the full-length forms are inactive for this function"
    explanation: >-
      Confirms that the angiostatic activity is a property of the cleaved
      fragment, not of full-length TrpRS.
  downstream:
  - target: Impaired Neurite Outgrowth and Neurite Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed second route to the neurite phenotype, alongside the translation
      arm. The published experiments establish that the variant both potentiates
      the angiostatic interaction and damages neurites, but do not show that the
      first causes the second.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Taken together, these findings establish WARS as a gene whose mutations may cause distal hereditary motor neuropathy and alter canonical and non-canonical functions of TrpRS."
      explanation: >-
        Supports that both functions are altered by the variant; graded PARTIAL
        because the causal step from the non-canonical arm to neurite damage is
        not demonstrated.
- name: Reduced Global Protein Synthesis
  biological_scale: CELLULAR
  description: >-
    Translational output falls and cell viability is reduced. Motor neurons,
    with the largest axonal biosynthetic burden of any cell, are proposed to be
    the least tolerant of this.
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which subsequently compromised protein synthesis and reduced cell viability"
    explanation: >-
      Direct statement of reduced protein synthesis and viability.
  downstream:
  - target: Impaired Neurite Outgrowth and Neurite Degeneration
    causal_link_type: DIRECT
    description: >-
      Reduced biosynthetic capacity is the proposed proximate cause of failure
      to build and maintain neurites.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "His257Arg TrpRS also inhibited neurite outgrowth and led to neurite degeneration in the neuronal cell lines and rat motor neurons."
      explanation: >-
        Reports the neurite phenotype produced by the same variant in the same
        study.
- name: Impaired Neurite Outgrowth and Neurite Degeneration
  biological_scale: CELLULAR
  description: >-
    Mutant TrpRS both prevents neurites from extending and causes established
    neurites to break down, in neuronal cell lines and in primary rat motor
    neurons. This is the most proximate cellular readout available for dHMN9;
    no human neuronal model has been reported.
  biological_processes:
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "His257Arg TrpRS also inhibited neurite outgrowth and led to neurite degeneration in the neuronal cell lines and rat motor neurons."
    explanation: >-
      Both halves of this node - outgrowth failure and degeneration - are stated
      in one sentence of the source.
  downstream:
  - target: Length-Dependent Motor Axonal Degeneration
    causal_link_type: DIRECT
    description: >-
      Cellular neurite failure scaled to the whole organism produces the
      length-dependent axonal pattern seen on nerve conduction studies.
    evidence:
    - reference: PMID:31069783
      reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical features included juvenile to adult onset (15-23 years), distal wasting and weakness, minimal sensory disturbance and length-dependent motor axonal degeneration with CMT examination score ranging from 6 to 10."
      explanation: >-
        Documents length-dependent motor axonal degeneration in WARS1-variant
        patients.
- name: Length-Dependent Motor Axonal Degeneration
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    Distal degeneration of the longest motor axons, sparing sensory fibres in
    most reported patients. Electrophysiology shows a motor axonal pattern.
    Conformance is asserted for the axonal-degeneration node only; the module's
    demyelinating arm is not part of the dHMN9 phenotype. Annotated with
    *neuron projection maintenance* rather than the *neuron projection
    development* term used on the upstream cellular node. GO has no term for
    axon degeneration (the peripheral_axonal_degeneration module works around
    the same gap), and failure to maintain an already-formed axon is the closer
    reading for this node than failure to build one.
  biological_processes:
  - preferred_term: neuron projection maintenance
    modifier: DECREASED
    term:
      id: GO:1990535
      label: neuron projection maintenance
  evidence:
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "length-dependent motor axonal degeneration with CMT examination score ranging from 6 to 10"
    explanation: >-
      Names the length-dependent motor axonal pattern in affected individuals.
  downstream:
  - target: Distal muscle weakness
    causal_link_type: DIRECT
    description: >-
      Denervation of distal muscles by degenerating motor axons produces the
      presenting weakness.
    evidence:
    - reference: PMID:28369220
      reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Distal hereditary motor neuropathy is a heterogeneous group of inherited neuropathies characterized by distal limb muscle weakness and atrophy."
      explanation: >-
        States the defining clinical consequence of the axonopathy.
  - target: Distal amyotrophy
    causal_link_type: DIRECT
    description: >-
      Chronic denervation produces distal muscle wasting.
    evidence:
    - reference: PMID:31069783
      reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "distal wasting and weakness, minimal sensory disturbance"
      explanation: >-
        Reports distal wasting alongside the weakness in WARS1-variant patients.

genetic:
- name: WARS1
  features: >-
    Cytoplasmic tryptophanyl-tRNA synthetase. Heterozygous missense variants
    cause dHMN9; biallelic variants cause a separate recessive
    neurodevelopmental syndrome. WARS1 sits in the group of aminoacyl-tRNA
    synthetase genes (with GARS1, AARS1, HARS1, YARS1) in which dominant
    variants cause peripheral neuropathy.
  gene_term:
    preferred_term: WARS1
    term:
      id: hgnc:12729
      label: WARS1
  notes: >-
    A third allele, p.Phe138Tyr (c.413T>A), is reported in a further Chinese
    family in the letter-and-reply pair PMID:31321409 / PMID:31321406. It is
    named here without an evidence item because both references cache with no
    abstract text, so there is no quotable finding - see the entry-level notes.
    Recorded so a curator with full-text access knows the allelic series is
    larger than the two variants evidenced above.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these findings establish WARS as a gene whose mutations may cause distal hereditary motor neuropathy and alter canonical and non-canonical functions of TrpRS."
    explanation: >-
      The gene-disease assertion, in the study's own words.
  - reference: PMID:35815345
    reference_title: "Biallelic variants in WARS1 cause a highly variable neurodevelopmental syndrome and implicate a critical exon for normal auditory function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in tryptophanyl-tRNA synthetase 1 (WARS1) cause autosomal dominantly inherited distal hereditary motor neuropathy and Charcot-Marie-Tooth disease."
    explanation: >-
      Independent restatement of the dominant WARS1-dHMN relationship by a group
      studying the recessive disorder.
diagnosis:
- name: Nerve conduction studies and EMG
  description: >-
    Electrophysiology establishes the length-dependent motor axonal pattern
    that places a patient in the dHMN group, graded in the reported families by
    CMT examination score.
  notes: >-
    The discriminator most often quoted for dHMN - preserved sensory nerve
    action potentials with normal conduction velocities, separating it from
    CMT2 and CMT1 - is deliberately not curated here. It appears in the full
    text of the sources but in no abstract cached for this entry, so it has no
    verifiable snippet. Add it when a source stating it is cited; do not infer
    it from the "minimal sensory disturbance" quotes, which describe symptoms
    rather than nerve conduction.
  diagnosis_term:
    preferred_term: electrodiagnostic study
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "length-dependent motor axonal degeneration with CMT examination score ranging from 6 to 10"
    explanation: >-
      The electrophysiological and clinical grading actually reported in a
      WARS1-variant family.
- name: WARS1 sequencing within a dHMN/CMT gene panel
  description: >-
    dHMN9 is not separable from the other aminoacyl-tRNA synthetase
    neuropathies at the bedside, so molecular testing is the confirmatory step.
    Both reported families were found by sequencing WARS1 in cohorts of dHMN
    and CMT patients already unsolved by standard testing, which is the
    practical context in which this gene is examined.
  diagnosis_term:
    preferred_term: molecular genetic analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed Sanger sequencing of the coding and untranslated region (UTR) regions of WARS in 160 unresolved dHMN and Charcot-Marie-Tooth (CMT) index patients"
    explanation: >-
      Documents the testing route and the population in which it is applied.
  - reference: PMID:34813128
    reference_title: "Variants of aminoacyl-tRNA synthetase genes in Charcot-Marie-Tooth disease: A Korean cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing was applied to 710 CMT patients who were negative for PMP22 duplication."
    explanation: >-
      The broader-panel route by which WARS1 variants are found in practice,
      after the common CMT1A duplication is excluded.
differential_diagnoses:
- name: WARS1-related autosomal recessive neurodevelopmental syndrome
  description: >-
    The other WARS1 disease. Biallelic WARS1 variants produce a variable
    neurodevelopmental syndrome, not a neuropathy. Same gene, opposite
    inheritance, and a phenotype that does not overlap dHMN9.
  disease_term:
    preferred_term: WARS1-related neurodevelopmental disorder
    term:
      id: MONDO:0957218
      label: neurodevelopmental disorder with microcephaly and speech delay, with or without brain abnormalities
  distinguishing_features:
  - Biallelic (compound heterozygous or homozygous) rather than heterozygous.
  - Developmental delay, intellectual disability, hearing impairment and microcephaly rather than a length-dependent motor neuropathy.
  - Onset in infancy or early childhood rather than the juvenile-to-adult onset of dHMN9.
  evidence:
  - reference: PMID:35815345
    reference_title: "Biallelic variants in WARS1 cause a highly variable neurodevelopmental syndrome and implicate a critical exon for normal auditory function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present three affected individuals from two families with biallelic variants (p.Met1? and p.(Asp419Asn)) in WARS1, showing varying severities of developmental delay and intellectual disability."
    explanation: >-
      Establishes the biallelic phenotype as developmental rather than
      neuropathic.
  - reference: PMID:35815345
    reference_title: "Biallelic variants in WARS1 cause a highly variable neurodevelopmental syndrome and implicate a critical exon for normal auditory function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing impairment and microcephaly, as well as abnormalities of the brain, skeletal system, movement/gait, and behavior were variable features."
    explanation: >-
      Enumerates features absent from dHMN9.
- name: Distal hereditary motor neuronopathy, autosomal recessive 9 (COQ7)
  description: >-
    The most consequential differential for this entry, and the one most likely
    to be confused with it on paper. OMIM assigned the number 9 twice in the
    motor neuronopathy series: HMND9 (this entry) is WARS1, autosomal dominant,
    OMIM:617721; HMNR9 is COQ7, autosomal recessive, OMIM:620402. Same digit,
    different gene, different inheritance, and a completely different mechanism
    - COQ7 encodes an enzyme of coenzyme Q10 biosynthesis, so its dHMN is a
    mitochondrial bioenergetic disease rather than a translational one. The
    distinction is not academic: COQ7-related dHMN is potentially treatable by
    coenzyme Q10 supplementation, and no such option exists for WARS1 dHMN9.
  disease_term:
    preferred_term: distal hereditary motor neuronopathy, autosomal recessive 9
    term:
      id: MONDO:0957874
      label: neuronopathy, distal hereditary motor, autosomal recessive 9
  distinguishing_features:
  - Biallelic COQ7 variants and recessive transmission, versus a single heterozygous WARS1 allele transmitted dominantly.
  - Mitochondrial coenzyme Q10 biosynthesis defect, versus a cytoplasmic tRNA-charging and TrpRS-moonlighting defect.
  - A blood biomarker exists - 6-demethoxycoenzyme Q10 accumulates in patient plasma - whereas no serum biomarker is described for WARS1 dHMN9.
  - Potentially treatable with coenzyme Q10 or the precursor 2,4-dihydroxybenzoic acid; WARS1 dHMN9 has no disease-modifying therapy.
  evidence:
  - reference: PMID:36454683
    reference_title: "Homozygous COQ7 mutation: a new cause of potentially treatable distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, we have identified the first example of recessive distal hereditary motor neuropathy caused by a homozygous variation in the COQ7 gene, which should thus be included in the gene panels used to diagnose peripheral inherited neuropathies."
    explanation: >-
      Establishes COQ7 as a distinct recessive cause of dHMN that a diagnostic
      panel must separate from WARS1.
  - reference: PMID:36454683
    reference_title: "Homozygous COQ7 mutation: a new cause of potentially treatable distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Normal coenzyme Q10 and 6-demethoxycoenzyme Q10 levels were restored in vitro by using the coenzyme Q10 precursor 2,4-dihydroxybenzoic acid, thus bypassing the COQ7 requirement."
    explanation: >-
      The basis for the treatability contrast that makes this differential
      clinically urgent rather than merely nomenclatural.
  - reference: PMID:36454683
    reference_title: "Homozygous COQ7 mutation: a new cause of potentially treatable distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, 6-demethoxycoenzyme Q10 accumulation in the blood can be used to confirm the pathogenic nature of the mutation."
    explanation: >-
      Names the blood biomarker that discriminates the COQ7 form.
- name: Other aminoacyl-tRNA synthetase neuropathies (GARS1, AARS1, HARS1, YARS1)
  description: >-
    Dominant variants in several other cytoplasmic ARS genes cause axonal CMT2
    or dHMN that is clinically indistinguishable from dHMN9 at the bedside. The
    distinction is molecular. GARS1 is the most common and has its own
    GeneReviews chapter.
  distinguishing_features:
  - Different gene; the clinical separation between these entities is not reliable without sequencing.
  - GARS1 variants classically give the dHMN-V / CMT2D phenotype with prominent hand-first involvement.
  - Collectively ARS variants are an uncommon cause - 1.22% of one 710-family Korean CMT cohort.
  evidence:
  - reference: PMID:34813128
    reference_title: "Variants of aminoacyl-tRNA synthetase genes in Charcot-Marie-Tooth disease: A Korean cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 12 disease-causing variants (from 13 families) in GARS1, AARS1, HARS1, WARS1, and YARS1 genes."
    explanation: >-
      Places WARS1 among the ARS neuropathy genes that must be discriminated by
      sequencing.
  - reference: PMID:34813128
    reference_title: "Variants of aminoacyl-tRNA synthetase genes in Charcot-Marie-Tooth disease: A Korean cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of overall ARS gene mutations was 1.22% among all independent patients diagnosed with CMT and 1.83% in patients negative for PMP22 duplication."
    explanation: >-
      Quantifies how uncommon the whole ARS group is within CMT.
  - reference: PMID:33381078
    reference_title: "Genetic and Clinical Features in 24 Chinese Distal Hereditary Motor Neuropathy Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two novel heterozygous mutations in GARS, c.373G>C (p.E125Q) and c.1015G>A (p.G339R), were identified and corresponded to the typical dHMN-V phenotype."
    explanation: >-
      Documents the GARS1 dHMN-V phenotype as the nearest ARS differential.
prevalence:
- population: Chinese mainland dHMN and CMT index patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One WARS1 family (p.Asp314Gly) was found by targeted Sanger sequencing of
    WARS across 160 unresolved dHMN and CMT index patients. This is a
    gene-detection yield in a selected, already-unsolved cohort, not a
    population prevalence, and no population estimate for dHMN9 has been
    published.
  evidence:
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed Sanger sequencing of the coding and untranslated region (UTR) regions of WARS in 160 unresolved dHMN and Charcot-Marie-Tooth (CMT) index patients"
    explanation: >-
      Gives the denominator behind the single family detected.
- population: Taiwanese, Australian, European and Korean inherited neuropathy pedigrees
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The discovery study screened 79 additional Taiwanese pedigrees plus 163
    index cases from Australian, European and Korean dHMN families and found the
    recurrent p.His257Arg allele in two of them. Again a detection yield in
    selected pedigrees, not a prevalence.
  evidence:
  - reference: PMID:28369220
    reference_title: "A recurrent WARS mutation is a novel cause of autosomal dominant distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analyses of WARS in an additional 79 Taiwanese pedigrees with inherited neuropathies and 163 index cases from Australian, European, and Korean distal hereditary motor neuropathy families identified the same mutation in another Taiwanese distal hereditary motor neuropathy pedigree with different ancestries and one additional Belgian distal hereditary motor neuropathy family of Caucasian origin"
    explanation: >-
      States both the screening denominator and the number of families found.
discussions:
- discussion_id: wars1_which_arm_drives_axonal_loss
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does dHMN9 axonal degeneration arise from the dominant-negative loss of
    tryptophanyl-tRNA charging, from the potentiated angiostatic
    TrpRS-VE-cadherin interaction, or from both acting together?
  attaches_to:
  - "pathophysiology#Dominant-Negative Loss of TrpRS Aminoacylation Activity"
  - "pathophysiology#Potentiated Angiostatic TrpRS-VE-Cadherin Interaction"
  - "pathophysiology#Impaired Neurite Outgrowth and Neurite Degeneration"
  rationale: >-
    The discovery study demonstrated both effects of p.His257Arg and reported
    the neurite phenotype, but did not separate the two. This matters beyond
    bookkeeping: the two arms imply different therapeutic targets, and they
    imply different explanations for the cell-type specificity. A pure
    charging-capacity defect has to explain why only the longest motor axons
    fail when every cell needs tryptophanyl-tRNA; the angiostatic arm offers an
    alternative in which the relevant target is not the ribosome at all. The
    same unresolved question runs through the wider ARS-neuropathy field, where
    for GARS1 the dominant view has moved away from simple charging loss.
  proposed_experiments:
  - experiment_id: wars1_separation_of_function_alleles
    name: Separation-of-function WARS1 alleles in motor neurons
    description: >-
      Express WARS1 alleles that dissociate the two activities - one that
      reduces aminoacylation without enhancing VE-cadherin binding, and one that
      enhances VE-cadherin binding with intact aminoacylation - in human
      iPSC-derived motor neurons, and score neurite outgrowth and degeneration
      for each.
    readouts:
    - name: Neurite length and degeneration index
      target: Impaired Neurite Outgrowth and Neurite Degeneration
      direction: DECREASED
      interpretation: >-
        If only the charging-deficient allele damages neurites, the
        non-canonical arm is not required; if only the VE-cadherin-enhancing
        allele does, the charging arm is not sufficient.
  - experiment_id: wars1_tryptophan_supplementation_rescue
    name: Tryptophan supplementation rescue
    description: >-
      Test whether raising tryptophan availability rescues the neurite
      phenotype. Rescue would argue that the limiting step is charging capacity;
      failure to rescue would point at the non-canonical arm.
    readouts:
    - name: Neurite outgrowth after tryptophan supplementation
      target: Impaired Neurite Outgrowth and Neurite Degeneration
      direction: RESTORED
      interpretation: >-
        Restoration implicates the aminoacylation arm as rate-limiting.
- discussion_id: wars1_no_human_neuronal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the neurite findings in immortalised neuronal cell lines and primary rat
    motor neurons predict what the p.His257Arg allele does in human motor
    neurons at their true axonal length?
  attaches_to:
  - "pathophysiology#Impaired Neurite Outgrowth and Neurite Degeneration"
  rationale: >-
    Every cellular result curated for this entry comes from transfected cell
    lines or rat motor neurons; no human neuronal model, patient-derived iPSC
    line, or animal model of dHMN9 has been reported. The mismatch is
    mechanistically pointed rather than generic, because the disease's defining
    feature is length dependence: a cultured rat motor neuron extends neurites
    orders of magnitude shorter than the human axons that actually fail, so the
    assay cannot in principle test the property that defines the phenotype.
    Over-expression of the mutant subunit in transfection also sets a
    stoichiometry between mutant and wild-type TrpRS that need not match the
    heterozygous state.
  proposed_experiments:
  - experiment_id: wars1_ipsc_motor_neuron_long_axon
    name: Patient-derived iPSC motor neurons with isogenic controls
    description: >-
      Derive motor neurons from p.His257Arg carriers with CRISPR-corrected
      isogenic controls, cultured in microfluidic devices that permit long
      axonal compartments, and measure distal axon maintenance over time.
    readouts:
    - name: Distal axon survival in long-axon microfluidic culture
      target: Impaired Neurite Outgrowth and Neurite Degeneration
      direction: DECREASED
      interpretation: >-
        Length-dependent loss in the patient line but not the isogenic control
        would reproduce the defining clinical property in a human system.
notes: >-
  Scope and lump/split: dHMN9 is kept as its own entry rather than folded into
  Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant because the WARS1
  mechanism curated here - a two-armed canonical/non-canonical effect of a
  single allele - is specific to this gene and is not represented in the
  generic autosomal dominant entry, whose pathophysiology is written around
  proteostasis and axonal transport.

  ClinGen: the ClinGen Charcot-Marie-Tooth Disease Gene Curation Expert Panel
  classifies the WARS1 gene-disease relationship as *Limited*, keyed on the
  generic term MONDO:0018894 (distal hereditary motor neuropathy) rather than
  on MONDO:0060585, with assertion id
  CGGV:assertion_93643521-0988-4c4b-b458-988044cfad6f-2026-08-08T160000.000Z
  and a 2026-08-08 classification date. This is deliberately *not* cited as a
  CGGV: evidence item, because that assertion postdates the ClinGen snapshot
  pinned in data/clingen/MANIFEST.yaml - `just clingen-refresh` fails with a
  checksum mismatch against the pinned sha256, so no cache file for it can be
  built without re-pinning the manifest, which would change the provenance of
  all 3337 cached CGGV records and does not belong in a curation PR. Recorded
  here so the classification is visible and the drift is actionable
  separately. A Limited rating is worth a curator's attention: it reflects the
  small number of reported families, and it is consistent with, not
  contradicted by, the evidence curated above.

  The "type 9" collision, and how it was caught. `just preflight-dr` returned
  WARN on the deep-research report for this entry: WARS1 was mentioned 37 times
  but COQ7 19 times (51%), and the report's OMIM set included 620402, which is
  HMNR9/COQ7 rather than this entry's 617721. On inspection the report was
  *not* confused - it opens with its own nomenclature note separating HMND9
  (WARS1, dominant, MONDO:0060585) from HMNR9 (COQ7, recessive,
  MONDO:0957874) and confines COQ7 to explicitly labelled contrast
  subsections. So this was a true-positive warning on a clean report, and the
  correct response was to exclude the COQ7 sections rather than discard the
  report. The collision is now curated as a differential diagnosis so the next
  curator meets it in the entry rather than rediscovering it. Note that
  MONDO:0958129 (COQ7-related distal hereditary motor neuropathy) is a third,
  overlapping term for the same COQ7 concept; MONDO:0957874 was chosen for the
  differential because it carries the OMIM:620402 xref and the COQ7
  RO:0004003 relation.

  Prevalence context. No prevalence figure exists for dHMN9 itself. For
  order-of-magnitude only, PMID:36454683 states that "The prevalence of dHMN is
  around 2 per 100 000 individuals" - that is the whole dHMN group across all
  15+ known genes, of which WARS1 is one of the rarest, so it must not be read
  as an estimate for this entry and is deliberately not curated as a
  `prevalence` record here.

  Ontology-term note. The deep-research report suggested HP:0009053 for
  "Distal muscle weakness". HP:0009053 is a real term but means *Distal lower
  limb muscle weakness*; the correct term for the general phenotype, which in
  dHMN9 involves hands as well as feet, is HP:0002460. The report's suggestion
  was checked against OAK rather than copied.

  Phenotypes deliberately absent. Gait difficulty (HP:0002355) and foot drop
  (HP:0009027) are real dHMN features and are named in this entry's
  deep-research report, but no abstract cached here mentions either - the
  closest available quotes say only "distal limb muscle weakness and atrophy"
  and "distal wasting and weakness". Adding them would attach a phenotype to a
  snippet that does not state it. They should be added when a source naming
  them is cited, not inferred from the class-level quotes above.

  This entry is a member of the `Distal_Hereditary_Motor_Neuropathies` grouping
  and satisfies both of its NECESSARY criteria; if either the phenotype set
  here or those criteria change, re-run `just check-groupings` on that file.

  Not cited, and why. PMID:31321409 and PMID:31321406 are a
  letter-and-reply pair on a further Chinese WARS1 dHMN family; both cache with
  no abstract text at all, so there is no quotable finding and, per the
  evidence SOP, a title is not a finding. They are recorded here as leads for a
  curator with full-text access. PMID:32048780 and PMID:36278300 surfaced in
  WARS1 searches but are about dexamethasone biomarkers and about AARS1
  respectively, and were discarded.

  Residue numbering caution. PMID:28910573 reports that an H130R substitution
  in T2-TrpRS mimics the zinc-bound conformation and increases VE-cadherin
  binding affinity more than 50-fold - functionally the same direction as the
  disease allele. It is a different residue from the disease-causing His257,
  and this entry does not assert that they are the same position or act by the
  same structural route; the paper is cited only for the normal T2-TrpRS /
  VE-cadherin biology.

  No GeneReviews chapter exists for WARS1 or for dHMN9 (PubMed search for
  "WARS1 GeneReviews[All Fields]" returns nothing). The nearest chapters are
  GARS1-Associated Axonal Neuropathy (PMID:20301420) and the Charcot-Marie-Tooth
  Hereditary Neuropathy Overview (PMID:20301532), both fetched during curation
  as comparators but not cited, since neither states anything about WARS1.

  No treatments block: no disease-modifying or symptomatic therapy specific to
  dHMN9 has been reported. Management is the generic supportive care of a distal
  motor neuropathy (orthoses, physiotherapy, foot care), which is not curated
  here rather than asserted without a WARS1-specific source.

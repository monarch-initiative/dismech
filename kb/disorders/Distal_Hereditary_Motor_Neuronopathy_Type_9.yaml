name: Distal Hereditary Motor Neuronopathy Type 9
creation_date: "2026-08-22T14:00:00Z"
category: Genetic
description: >
  Distal hereditary motor neuronopathy type 9 (dHMN9, HMN9) is an autosomal
  dominant, length-dependent lower motor neuron disorder caused by heterozygous
  missense variants in WARS1, the gene encoding cytoplasmic tryptophanyl-tRNA
  synthetase (TrpRS). Affected individuals develop progressive distal limb
  weakness and wasting with a length-dependent motor axonal pattern on nerve
  conduction. Onset was juvenile to adult (15-23 years) in the p.Asp314Gly
  family, which the reporting authors characterised as the milder, later-onset
  end; onset for the recurrent p.His257Arg allele is not stated in the
  discovery abstract. Sensory involvement is discussed below - it is minimal or
  absent by the definition of dHMN and in the p.Asp314Gly family, but a Korean
  cohort reported the opposite for its WARS1-variant patients.

  WARS1 is one of several aminoacyl-tRNA synthetase (ARS) genes in which
  heterozygous variants cause dominant peripheral neuropathy - the group also
  includes GARS1, AARS1, HARS1 and YARS1 - and dHMN9 shares with them the
  puzzle that a housekeeping enzyme expressed in every cell produces a disorder
  restricted to the longest motor axons. The mechanism curated here is
  deliberately two-armed rather than a single loss of enzyme activity. The
  recurrent p.His257Arg variant acts as a *dominant negative* on TrpRS
  aminoacylation, reducing global protein synthesis and cell viability; but the
  same variant also *potentiates* a non-canonical activity of TrpRS, enhancing
  the interaction of its angiostatic fragment with vascular endothelial-cadherin.
  The same study showed that mutant TrpRS inhibits neurite outgrowth and causes
  neurite degeneration in neuronal cell lines and rat motor neurons. It did not,
  however, establish which of the two arms produces that neurite damage - both
  were demonstrated for the same allele, but neither was shown to cause the
  neurite phenotype to the exclusion of the other. That is recorded here as an
  open knowledge gap rather than resolved in favour of the more familiar
  loss-of-charging story.

  dHMN9 must be kept distinct from the *biallelic* WARS1 disorder: recessive
  WARS1 variants cause a variable neurodevelopmental syndrome with developmental
  delay, intellectual disability, hearing impairment and microcephaly
  (MONDO:0957218), which shares the gene but not the phenotype, the inheritance
  pattern, or the proposed mechanism.

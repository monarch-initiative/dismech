- category: Neurologic
  name: Motor axonal neuropathy
  description: >-
    Nerve conduction studies show a length-dependent motor axonal pattern.
    This is what separates dHMN from demyelinating CMT1 and, together with
    preserved sensory responses, from axonal CMT2.
  phenotype_term:
    preferred_term: Motor axonal neuropathy
    term:
      id: HP:0007002
      label: Motor axonal neuropathy
  evidence:
  - reference: PMID:31069783
    reference_title: "A novel WARS mutation (p.Asp314Gly) identified in a Chinese distal hereditary motor neuropathy family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "length-dependent motor axonal degeneration with CMT examination score ranging from 6 to 10"
    explanation: >-
      Reports the motor axonal, length-dependent electrophysiological pattern.
- category: Neurologic
  name: Sensory involvement in a subset
  description: >-
    dHMN is defined by minimal or absent sensory abnormalities, and the WARS1
    families reported as dHMN fit that definition. A Korean CMT cohort found the
    opposite for its WARS1-variant patients, in whom sensory involvement was
    present. The pure-motor boundary is therefore not clean for WARS1, and this
    phenotype is curated to record the discrepancy rather than to assert that
    sensory loss is typical.
  phenotype_term:

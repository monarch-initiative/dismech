name: Methylmalonic Aciduria and Homocystinuria cblL Type
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- MAHCL
- cblL
- THAP11-related disorder of intracellular cobalamin metabolism
- methylmalonic aciduria and homocystinuria, cblL type
description: >-
  MAHCL is a disorder of intracellular cobalamin metabolism caused by biallelic THAP11
  variants. It is the second of the cobalamin complementation groups whose lesion is
  transcriptional rather than enzymatic: THAP11 and HCFC1 form the complex that drives
  MMACHC expression, so losing THAP11 function starves the cell of the cobalamin
  chaperone without touching the MMACHC gene itself. The result is a cblC phenocopy in a
  patient whose MMACHC sequence is normal.

  One patient has been reported, homozygous for THAP11 p.Phe80Leu. Everything in this
  entry is therefore either from that report, from the functional work that followed it in
  cell lines and model organisms, or from the better-characterised cblX and cblC disorders
  that share the pathway downstream of MMACHC. The entry marks which is which.

  Two things about the name are worth stating up front, because both are misleading.
  First, the MONDO label carries a typo, `cb1L` with the digit one; the ontology term is
  bound as-is because that is the canonical label, and every other field spells it cblL.
  Second, the OMIM clinical synopsis for the single reported patient records mild
  methylmalonic aciduria *without* homocystinuria, so the disorder is named for a
  biochemical pairing that its one described case did not fully show. That is not a
  contradiction to hide: it is the strongest available hint that the transcriptional
  disorders may sit differently on the cblC biochemical spectrum than the enzymatic ones,
  and it is recorded as a knowledge gap.

  The relationship to cblX is the other thing to get right. cblX is X-linked and caused by
  hemizygous HCFC1 variants; MAHCL is autosomal recessive and caused by biallelic THAP11
  variants. They converge on the same complex and produce overlapping biochemistry, which
  is why the literature and GeneReviews still describe THAP11 as a "cblX-like" gene. They
  are not the same disease and cannot be counselled as one.

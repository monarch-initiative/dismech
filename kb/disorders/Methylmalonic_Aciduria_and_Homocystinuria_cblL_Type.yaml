external_assertions:
- name: OMIM methylmalonic aciduria and homocystinuria, cblL type record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:620940
  description: >-
    OMIM entry for MAHCL. Its clinical synopsis is the source for the statement that the
    single reported patient had mild methylmalonic aciduria without homocystinuria, which
    is not stated in the abstract of the primary report and therefore carries no quoted
    evidence item in this entry.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic THAP11 variants. The one reported patient, of Moroccan parentage, was
    homozygous for c.240C>G p.Phe80Leu. This is the axis on which MAHCL separates from
    cblX, which is X-linked and hemizygous for HCFC1, and GeneReviews lists THAP11 among
    the genes in which biallelic variants confirm the diagnosis.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced THAP11 by Sanger sequencing and discovered a potentially pathogenic, homozygous variant, c.240C > G (p.Phe80Leu)."
    explanation: >-
      The homozygous state of the only reported allele, which is what makes the inheritance
      autosomal recessive rather than X-linked.
pathophysiology:
- name: Biallelic THAP11 p.Phe80Leu
  description: >-
    A homozygous missense change in the THAP domain, the zinc-finger DNA-binding module
    shared across the twelve human THAP proteins. The variant was found after MMACHC and
    HCFC1 had been sequenced and excluded in a patient whose clinical and biochemical
    picture overlapped cblX, so the gene was reached by elimination plus a mechanistic
    hypothesis rather than by an unbiased screen.

    p.Phe80Leu is the only reported MAHCL allele. No second family, no null allele, and no
    allelic series exist, so nothing is known about whether other THAP11 variants would
    give the same disease.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  downstream:
  - target: Reduced THAP11 Occupancy of the MMACHC Promoter
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient who presented with clinical and biochemical phenotypic features that overlap cblX, but who does not have any mutations in either MMACHC or HCFC1."
    explanation: >-
      How the gene was reached, and why the case is a cblX phenocopy rather than a cblX
      case: the two genes that were already known to cause this picture were excluded first.
- name: Reduced THAP11 Occupancy of the MMACHC Promoter
  description: >-
    The step that turns a transcription factor variant into a metabolic disease, and the
    one place in this entry where the causal claim is directly measured rather than
    inferred. In HEK-293 cells the F80L protein bound a subset of THAP11 target promoters
    less well than wild type, and the MMACHC promoter was among the strongly affected
    ones. Binding was selectively rather than globally impaired, which matters: a
    transcription factor that had simply stopped working everywhere would not explain a
    disease whose dominant biochemical signature is a single pathway.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  downstream:
  - target: Reduced MMACHC Expression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31905202
      reference_title: "THAP11F80L cobalamin disorder-associated mutation reveals normal and pathogenic THAP11 functions in gene expression and cell proliferation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In particular, THAP11F80L exhibited a strong effect on association with the MMACHC promoter and led to a decrease in MMACHC gene transcription, suggesting that the THAP11F80L mutation is directly responsible for the observed cobalamin disorder."
      explanation: >-
        Evidence for this specific edge rather than for either node: the same experiment
        measures reduced promoter association and the resulting fall in transcription, and
        the authors draw the causal link explicitly.
  evidence:
  - reference: PMID:31905202
    reference_title: "THAP11F80L cobalamin disorder-associated mutation reveals normal and pathogenic THAP11 functions in gene expression and cell proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that THAP11F80L selectively affected promoter binding by THAP11, having more deleterious effects on a subset of THAP11 targets, and resulting in altered patterns of gene expression."
    explanation: >-
      The selectivity of the binding defect, which is what allows a general transcription
      factor variant to produce a pathway-specific disease.
- name: Reduced MMACHC Expression
  description: >-
    MMACHC transcription falls even though the MMACHC gene is intact. This is the same
    lesion cblX produces through HCFC1, and the two were shown to converge here: HCFC1 and
    THAP11 act as a complex on the MMACHC promoter, and knocking down either one reduces
    MMACHC message.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MMACHC
    term:
      id: hgnc:24525
      label: MMACHC
  downstream:
  - target: Loss of Cytosolic Cobalamin Processing
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCFC1 regulates cobalamin metabolism via the regulation of MMACHC expression through its interaction with THAP11, a THAP domain-containing transcription factor."
    explanation: >-
      The regulatory axis itself, stated in the report that identified the THAP11 patient.
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe reduction in MMACHC mRNA and protein within subject fibroblast lines suggested a role for HCFC1 in transcriptional regulation of MMACHC, which was further supported by the identification of consensus HCFC1 binding sites in MMACHC."
    explanation: >-
      The measurement of reduced MMACHC message and protein in patient fibroblasts. Graded
      as evidence for the pathway rather than for MAHCL: these are cblX patients with HCFC1
      variants, not the THAP11 patient, so it establishes what the complex does and not what
      this disease does.
  - reference: PMID:35013307
    reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Since HCFC1/RONIN jointly regulate MMACHC, patients with mutations in these factors suffer from reduced MMACHC expression and exhibit a cblC-like disease."
    explanation: >-
      States the joint regulation and the phenocopy relationship that the whole entry turns
      on. RONIN is the alternative name for THAP11.
- name: Loss of Cytosolic Cobalamin Processing
  description: >-
    MMACHC is the cytosolic chaperone that processes incoming cobalamin, removing the upper
    axial ligand from cyanocobalamin, methylcobalamin and adenosylcobalamin so the cofactor
    can be routed onward. Without enough of it, dietary and therapeutic cobalamin cannot be
    converted into the two active forms the cell needs.

    This node and everything below it are inherited from cblC biology rather than measured
    in a MAHCL patient. That is a legitimate inference, because the complementation
    behaviour and biochemistry of the transcriptional disorders match cblC, but it is an
    inference and the entry does not present it otherwise.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: cobalamin metabolic process
    term:
      id: GO:0009235
      label: cobalamin metabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  chemical_entities:
  - preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  downstream:
  - target: Combined Methylmalonyl-CoA Mutase and Methionine Synthase Cofactor Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31905202
    reference_title: "THAP11F80L cobalamin disorder-associated mutation reveals normal and pathogenic THAP11 functions in gene expression and cell proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cobalamin disorder is an inborn vitamin deficiency characterized by neurodevelopmental abnormalities, most often owing to biallelic mutations in the MMACHC gene, whose gene product MMACHC is a key enzyme in the cobalamin (vitamin B12) metabolic pathway."
    explanation: >-
      MMACHC's position in the pathway, which is what makes reduced MMACHC expression a
      metabolic lesion rather than merely a transcriptional observation.
- name: Combined Methylmalonyl-CoA Mutase and Methionine Synthase Cofactor Deficiency
  description: >-
    Because MMACHC sits upstream of the branch point, losing it starves both downstream
    enzymes at once: methylmalonyl-CoA mutase loses adenosylcobalamin and methionine
    synthase loses methylcobalamin. That dual failure is what makes the cblC-type disorders
    "combined", and it is why the biochemical signature is methylmalonic acid plus
    homocysteine rather than either alone.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  chemical_entities:
  - preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
    modifier: INCREASED
  - preferred_term: homocysteine
    term:
      id: CHEBI:17230
      label: homocysteine
    modifier: INCREASED
  downstream:
  - target: Methylmalonic aciduria
    causal_link_type: DIRECT
  - target: Severe global developmental impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in cobalamin metabolism lead to disorders characterized by the accumulation of methylmalonic acid and/or homocysteine in blood and urine."
    explanation: >-
      The shared biochemical consequence of the cobalamin disorders. Note the "and/or",
      which is the literature's own acknowledgement that the pairing is not obligate, and
      which bears on the knowledge gap about this disease's name.
- name: Impaired Neural Precursor Proliferation and Differentiation
  description: >-
    A parallel branch, and the reason MAHCL is not simply a metabolic disease with a
    neurological complication. THAP11 loss in zebrafish impairs proliferation and
    differentiation of neural precursors, and separately abolishes Meckel's cartilage and
    the pharyngeal cartilages, which is a developmental phenotype that no amount of
    cobalamin deficiency explains. Mouse work on Hcfc1 and Ronin found the same complex
    regulating ribosome protein genes, with phenotypes attributed to deregulated ribosome
    biogenesis rather than to the metabolic block.

    Whether this branch contributes to the human phenotype is unknown, because there is one
    patient and no craniofacial or ribosomal assessment was reported for them.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Severe global developmental impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Plausible on the model data and unmeasured in the single patient. The alternative,
      that the developmental impairment is entirely secondary to the cobalamin block, is
      equally unmeasured.
  evidence:
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Functional analysis in the developing zebrafish embryo demonstrated that both THAP11 and HCFC1 regulate the proliferation and differentiation of neural precursors, suggesting important roles in normal brain development."
    explanation: The neural developmental role, measured in zebrafish.
  - reference: PMID:35013307
    reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition to exhibiting loss of Mmachc, metabolic perturbations, and developmental defects previously observed in cblC, we uncovered reduced expression of target genes that encode ribosome protein subunits."
    explanation: >-
      The second, non-metabolic arm of the same transcriptional lesion, found in mouse
      models of both genes.
phenotypes:
- name: Methylmalonic aciduria
  category: Biochemical
  description: >-
    Mild methylmalonic aciduria was recorded in the single reported patient. It is milder
    than in classical cblC, and the OMIM clinical synopsis for this disorder notes it
    occurred without homocystinuria, which is unusual for a disorder in this group.
  phenotype_term:
    preferred_term: Methylmalonic aciduria
    term:
      id: HP:0012120
      label: Methylmalonic aciduria
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total
      homocysteine (tHcy) level are the mainstays of biochemical testing.
    explanation: >-
      The biochemical test that defines this phenotype in the cobalamin disorders.
      Deliberately not cited as evidence that this patient's level was raised, which the
      cached abstract does not state.
- name: Severe global developmental impairment
  category: Neurological
  description: >-
    Profoundly impaired neurodevelopment with seizures. The phenotype was described as
    overlapping cblX, and cblX itself is characterised by intractable epilepsy and profound
    neurocognitive impairment that is more severe than in early-onset cblC. Whether MAHCL
    tracks cblX or cblC in severity is not established from one patient.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common phenotype of severe neurological symptoms including intractable epilepsy and profound neurocognitive impairment, along with variable biochemical manifestations, was observed in all affected subjects compared to individuals with early-onset cblC."
    explanation: >-
      The neurological severity of the transcriptional cobalamin disorders, measured in the
      cblX cohort. Cited for the comparison class rather than for this disease, because the
      MAHCL patient's phenotype is only described as overlapping cblX.
- name: Seizures
  category: Neurological
  description: >-
    Reported in the single MAHCL patient and characteristic of cblX, the disorder MAHCL
    phenocopies. Intractable epilepsy is the neurological feature that most distinguishes
    the transcriptional cobalamin disorders from enzymatic cblC.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common phenotype of severe neurological symptoms including intractable epilepsy and profound neurocognitive impairment, along with variable biochemical manifestations, was observed in all affected subjects compared to individuals with early-onset cblC."
    explanation: >-
      Establishes epilepsy as the characteristic neurological feature of this group. Same
      caveat as above: measured in cblX subjects.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One reported patient, of Moroccan parentage, homozygous for THAP11 p.Phe80Leu. No
    second family, no carrier frequency, and no prevalence estimate exists. The disorder
    was reached by exclusion in a patient who looked like cblX, so the reported count
    depends on how often anyone sequences THAP11 after MMACHC and HCFC1 come back negative.
  evidence:
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient who presented with clinical and biochemical phenotypic features that overlap cblX, but who does not have any mutations in either MMACHC or HCFC1."
    explanation: >-
      The whole reported literature is this one patient, and the sentence also records the
      exclusion-based route by which the disorder is found, which is what limits the count.
genetic:
- name: THAP11
  notes: >-
    The causal gene, also known as RONIN. It encodes a THAP-domain zinc-finger
    transcription factor that partners with HCFC1. Note the HGNC identifier: THAP11 is
    hgnc:23194. hgnc:20856 is THAP1, a different THAP-family gene that causes DYT6 dystonia
    and has nothing to do with cobalamin metabolism. The deep-research report for this
    entry offered hgnc:20856 for THAP11, and because HGNC is on the term validator's skip
    list nothing in the pipeline would have caught it.
  gene_term:
    preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which
      can show a cblC complementation class).
    explanation: >-
      GeneReviews lists THAP11 among the genes in which biallelic pathogenic variants
      confirm a diagnosis of a disorder of intracellular cobalamin metabolism, under the
      older "cblX-like" designation that predates the cblL name.
- name: MMACHC
  notes: >-
    Not mutated in this disease. It is listed here because it is the gene whose expression
    the lesion reduces, and because a reader who sees cblC biochemistry with a normal
    MMACHC sequence needs the entry to say why.
  gene_term:
    preferred_term: MMACHC
    term:
      id: hgnc:24525
      label: MMACHC
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:35013307
    reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recently, mutations in the transcriptional regulators HCFC1 and RONIN (THAP11) were shown to result in cellular phenocopies of cblC."
    explanation: >-
      Why MMACHC belongs in this entry at all: the disease is a phenocopy of MMACHC
      deficiency produced without an MMACHC variant. relationship_type is UNKNOWN rather
      than CAUSATIVE because the schema has no value for "target of the causal lesion, not
      itself mutated".
- name: HCFC1
  notes: >-
    The partner gene. Hemizygous HCFC1 variants cause cblX, the X-linked disorder that
    MAHCL phenocopies through the same complex. Recorded here as a differential rather than
    as a MAHCL gene.
  gene_term:
    preferred_term: HCFC1
    term:
      id: hgnc:4839
      label: HCFC1
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify the genetic basis of an X-linked form of combined methylmalonic acidemia and hyperhomocysteinemia, designated cblX."
    explanation: >-
      Establishes cblX as a separate X-linked entity, which is the distinction this entry
      has to hold against.
diagnosis:
- name: Biochemical testing followed by sequencing after MMACHC and HCFC1 are excluded
  description: >-
    Biochemical testing comes first for the group: methylmalonic acid in urine and blood
    together with plasma total homocysteine. Confirmation is molecular, and GeneReviews
    lists THAP11 among the genes in which biallelic variants confirm a diagnosis of a
    disorder of intracellular cobalamin metabolism.

    Two things make cblL harder to reach than that summary suggests. The index patient was
    found only after MMACHC and HCFC1 had been sequenced and excluded, so THAP11 is reached
    by exclusion rather than as a first-line test unless the panel already contains it.
    And the biochemistry that would trigger the workup may not be the expected pairing: the
    OMIM clinical synopsis for that patient records methylmalonic aciduria without
    homocystinuria, so a result showing isolated methylmalonic aciduria should not be taken
    to exclude this group. That second point is a single-patient observation and is
    recorded here as a caution rather than as a rule; see the naming discussion.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total
      homocysteine (tHcy) level are the mainstays of biochemical testing.
    explanation: The first-line biochemical tests for this disease group.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which
      can show a cblC complementation class).
    explanation: >-
      THAP11's place in the confirmatory gene list, under the older cblX-like designation.
  - reference: PMID:28449119
    reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient who presented with clinical and biochemical phenotypic features that overlap cblX, but who does not have any mutations in either MMACHC or HCFC1."
    explanation: >-
      The exclusion sequence by which the only reported patient was diagnosed, which is
      what makes THAP11 a second-pass rather than first-line test in practice.
animal_models:
- name: thap11-depleted zebrafish embryo
  species: Zebrafish
  genotype: thap11 loss of function
  publication: PMID:28449119
  description: >-
    The functional model in the founding report. Loss of THAP11 impairs neural precursor
    proliferation and differentiation and abolishes Meckel's cartilage, the ceratohyal and
    all ceratobranchial cartilages, mirroring the craniofacial phenotype the same group had
    previously shown for HCFC1.
  genes:
  - preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  modeled_mechanisms:
  - target: Impaired Neural Precursor Proliferation and Differentiation
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The only in vivo evidence that THAP11 has a developmental role beyond the metabolic
      one.
    limitations: >-
      Depletion rather than the patient's missense allele, so it tests gene requirement and
      not variant effect, and the patient's F80L protein is known from cell work to retain
      partial and selective function. The craniofacial phenotype has no reported human
      counterpart: the single MAHCL patient was not described with cartilage or craniofacial
      anomalies, which may mean the fish overstates the lesion or simply that nobody looked.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The manipulated quantity is thap11 gene dosage reduced to near zero. The disease's
        quantity is a homozygous missense protein that binds a subset of its normal targets,
        including MMACHC, less well. Selective partial loss and complete depletion are
        different lesions, and the cell work exists precisely because they are.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Meckel's cartilage and the ceratobranchial series are pharyngeal arch derivatives
        with no direct human equivalents at the structures scored, so the craniofacial
        readout cannot be matched to a human phenotype even in principle.
    evidence:
    - reference: PMID:28449119
      reference_title: "Mutations in THAP11 cause an inborn error of cobalamin metabolism and developmental abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The loss of THAP11 in zebrafish embryos results in craniofacial abnormalities including the complete loss of Meckel's cartilage, the ceratohyal, and all of the ceratobranchial cartilages."
      explanation: The developmental phenotype this model contributes.
- name: Hcfc1 and Ronin mouse models
  species: Mouse
  genotype: Hcfc1 and Ronin (Thap11) mutant alleles
  publication: PMID:35013307
  description: >-
    Mouse models of both members of the complex, made to ask what else the transcriptional
    lesion deregulates. They reproduce loss of Mmachc, the metabolic perturbation and the
    developmental defects known from cblC, and additionally show reduced expression of
    ribosome protein genes with phenotypes attributed to disturbed ribosome biogenesis.
  genes:
  - preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  - preferred_term: HCFC1
    term:
      id: hgnc:4839
      label: HCFC1
  modeled_mechanisms:
  - target: Reduced MMACHC Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Confirms in a whole animal that disrupting either member of the complex lowers Mmachc
      expression, which is the central claim of this entry's mechanism.
    limitations: >-
      The alleles are mouse mutants of both genes rather than a knock-in of the human
      p.Phe80Leu, so the model establishes the regulatory relationship rather than this
      patient's lesion.
    evidence:
    - reference: PMID:35013307
      reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Since HCFC1/RONIN jointly regulate MMACHC, patients with mutations in these factors suffer from reduced MMACHC expression and exhibit a cblC-like disease."
      explanation: The regulatory relationship the model was built to test.
  - target: Impaired Neural Precursor Proliferation and Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Extends the developmental branch from cartilage in fish to ribosome biogenesis in
      mouse, and reframes the syndrome as part cobalamin disorder and part ribosomopathy.
    limitations: >-
      No ribosomal or bone marrow phenotype has been sought in the single human MAHCL
      patient, so the ribosomopathy component is a mouse finding awaiting a human test. It
      is also derived largely from Hcfc1 rather than Ronin alleles in places, so the split
      between the two genes' contributions is not resolved.
    evidence:
    - reference: PMID:35013307
      reference_title: "Mutations in Hcfc1 and Ronin result in an inborn error of cobalamin metabolism and ribosomopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings identify HCFC1/RONIN as transcriptional regulators of ribosome biogenesis during development and their mutation results in complex syndromes exhibiting aspects of both cblC and ribosomopathies."
      explanation: The dual-syndrome conclusion this link records.
treatments:
- name: Parenteral Hydroxocobalamin
  description: >-
    The mainstay of treatment across the disorders of intracellular cobalamin metabolism,
    given parenterally. No treatment response has been reported for a MAHCL patient, so
    this is the management of the group the disease belongs to rather than an established
    therapy for it. Whether raising cobalamin availability helps when the lesion is a
    shortage of the chaperone that processes it is a real mechanistic question, not a
    formality.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Loss of Cytosolic Cobalamin Processing
    description: >-
      Increasing substrate availability to a reduced pool of MMACHC chaperone. It does not
      act on the transcriptional lesion, and nothing reported for MAHCL does.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Critically ill individuals must be stabilized, preferably in consultation with a
      metabolic specialist, by treating acidosis, reversing catabolism, and initiating
      parenteral hydroxocobalamin.
    explanation: >-
      The GeneReviews acute management recommendation for this disease group. Cited as
      group management, not as evidence of benefit in MAHCL, for which none exists.
discussions:
- discussion_id: mahcl_named_for_a_pairing_its_only_patient_lacked
  kind: KNOWLEDGE_GAP
  prompt: >-
    The disorder is called methylmalonic aciduria and homocystinuria, but the OMIM clinical
    synopsis for its single reported patient records mild methylmalonic aciduria without
    homocystinuria. Is MAHCL genuinely a combined disorder?
  attaches_to:
  - phenotypes#Methylmalonic aciduria
  - pathophysiology#Combined Methylmalonyl-CoA Mutase and Methionine Synthase Cofactor Deficiency
  rationale: >-
    This matters because the biochemical pairing is what places a patient in this disease
    group in the first place. A newborn screen or a metabolic workup that finds isolated
    methylmalonic aciduria will not generate a differential that includes the cobalamin
    complementation groups, and the one MAHCL patient described so far would have looked
    like that.

    Three readings are open and one patient cannot separate them. The mechanism might be
    quantitative: partial, selective loss of MMACHC transcription could reduce
    adenosylcobalamin enough to raise methylmalonic acid while leaving methylcobalamin
    adequate for methionine synthase, which would predict an isolated or
    methylmalonic-predominant picture as characteristic of the transcriptional disorders
    rather than as an exception. It might be developmental, with the biochemistry sampled
    at an age or a treatment state that masked the homocysteine rise. Or the single patient
    might simply be atypical.

    The literature is already hedged here in a way worth noticing: the standard description
    of the cobalamin disorders speaks of methylmalonic acid "and/or" homocysteine. Naming
    this entity for both, in the same act as recording a patient who had one, is a
    nosological decision made by OMIM rather than a finding.

    A second reported patient with a full biochemical profile would settle it. There is
    currently nothing else that would.
  evidence:
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in cobalamin metabolism lead to disorders characterized by the accumulation of methylmalonic acid and/or homocysteine in blood and urine."
    explanation: >-
      The literature's own "and/or", which shows the pairing is not treated as obligate even
      within the group this disorder is named after.
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common phenotype of severe neurological symptoms including intractable epilepsy and profound neurocognitive impairment, along with variable biochemical manifestations, was observed in all affected subjects compared to individuals with early-onset cblC."
    explanation: >-
      Biochemical variability was already reported as a feature of the transcriptional
      cobalamin disorders in the cblX cohort, which makes the MAHCL observation less of an
      outlier than it looks.
- discussion_id: mahcl_versus_cblx_entity_boundary
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is cblL a distinct disease from cblX, or the autosomal recessive arm of one disorder of
    the HCFC1-THAP11 complex?
  attaches_to:
  - disease#Methylmalonic Aciduria and Homocystinuria cblL Type
  - genetic#HCFC1
  - genetic#THAP11
  rationale: >-
    The two are separated by inheritance and gene and joined by mechanism, and the
    literature has not settled which of those should decide. GeneReviews still calls THAP11
    "cblX-like" rather than giving it its own complementation letter, and clinical gene
    panels list THAP11 and ZNF143 together under that label; OMIM has since given it a
    separate number and the cblL name.

    This entry follows OMIM and curates cblL separately, for two reasons that are about the
    knowledge base rather than about nosology. First, inheritance differs, and an entry that
    merged an X-linked hemizygous disorder with an autosomal recessive one could not carry a
    coherent inheritance block or support correct recurrence-risk counselling. Second, the
    surrounding entries already work this way: cblC, cblD, cblE and cblG each have their own
    entry rather than being subtypes of a cobalamin grouping.

    One consequence should be flagged for a curator rather than silently absorbed.
    `kb/disorders/Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport.yaml` describes
    THAP11 inside its cblX subtype as a "cblX-like form", which was accurate when written
    and is now superseded by this entry. Reconciling that description is a separate edit to
    a shared file and is deliberately not bundled into this PR.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which
      can show a cblC complementation class).
    explanation: >-
      GeneReviews' own framing, which places THAP11 in the biallelic list while still naming
      it after cblX. Both halves of the tension in one line.
  - reference: PMID:24011988
    reference_title: "An X-linked cobalamin disorder caused by mutations in transcriptional coregulator HCFC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify the genetic basis of an X-linked form of combined methylmalonic acidemia and hyperhomocysteinemia, designated cblX."
    explanation: The X-linked inheritance of cblX, which is the axis of separation.
- discussion_id: mahcl_single_patient_evidence_base
  kind: KNOWLEDGE_GAP
  prompt: >-
    One patient, one allele, and no reported treatment outcome. How much of this entry is
    about MAHCL rather than about the pathway it sits on?
  attaches_to:
  - genetic#THAP11
  - treatments#
  rationale: >-
    Worth stating explicitly because the entry looks better evidenced than the disease is.
    The molecular mechanism is genuinely well supported: promoter binding and transcription
    were measured directly for the patient's own allele in HEK-293 cells, and the regulatory
    relationship is confirmed in mouse and zebrafish. That is more functional evidence than
    many single-patient disorders have.

    What is missing is everything patient-facing. There is no second family, so penetrance,
    expressivity and allelic spectrum are unknown and no genotype-phenotype statement is
    possible. There is no reported treatment response, so the hydroxocobalamin entry in this
    file is group management applied by inference. And there is a specific mechanistic reason
    not to assume it transfers: in enzymatic cblC the chaperone is present but defective,
    whereas here it is scarce but normal, and it is not obvious that saturating a reduced
    pool of functional chaperone behaves like saturating a normal pool of defective one.

    The single most useful thing anyone could add to this entry is a second reported patient.
  evidence:
  - reference: PMID:31905202
    reference_title: "THAP11F80L cobalamin disorder-associated mutation reveals normal and pathogenic THAP11 functions in gene expression and cell proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HEK-293 cells bearing a THAP11 mutation identified in a patient suffering from cobalamin disorder (THAP11F80L) were viable although proliferated more slowly."
    explanation: >-
      The functional work that does exist, done on the patient's own allele, which is the
      part of this entry that is not inherited from the pathway.

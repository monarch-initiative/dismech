  description: >-
    Profound sensorineural hearing loss is the defining and, so far as the reported families
    go, the only clinical feature of DFNB31. The Tunisian kindred is described as congenital
    and profound; the review summarising the published patients records profound
    sensorineural loss with normal vision as what distinguishes DFNB31 from allelic USH2D.
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  notes: >-
    No frequency band is recorded. Profound hearing loss is the ascertainment criterion for
    every reported DFNB31 family, so any band computed from those reports would restate the
    inclusion criterion rather than measure penetrance.
  evidence:
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2D patients have moderate sensorineural hearing loss and RP, while DFNB31 patients have profound sensorineural hearing loss and normal vision."
    explanation: States the DFNB31 auditory phenotype and its severity.
  - reference: PMID:15841483
    reference_title: Identification of a novel frameshift mutation in the DFNB31/WHRN gene in a Tunisian consanguineous family with hereditary non-syndromic recessive hearing loss.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a consanguineous Tunisian family segregating congenital profound ARNSHL"
    explanation: Primary report of congenital profound loss in a DFNB31-linked family.
- category: Auditory
  name: Congenital Onset of Hearing Loss
  description: >-
    The loss is present at birth in the family where onset is reported. Only the Tunisian
    kindred is explicitly described as congenital; the other reports do not state onset, so
    this is recorded as a feature of the disease as reported rather than as an established
    universal.
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  notes: >-
    Denominator is one family. No frequency band, for the same reason as the phenotype
    above.
  evidence:
  - reference: PMID:15841483
    reference_title: Identification of a novel frameshift mutation in the DFNB31/WHRN gene in a Tunisian consanguineous family with hereditary non-syndromic recessive hearing loss.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a consanguineous Tunisian family segregating congenital profound ARNSHL"
    explanation: The one report that states onset describes it as congenital.
genetic:
- name: WHRN variants
  gene_term:
    preferred_term: WHRN
    term:
      id: hgnc:16361
      label: WHRN
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  features: >-
    WHRN lies at 9q32 and encodes whirlin. The DFNB31 alleles reported so far are truncating
    and lie in the C-terminal half of the protein - R778X in exon 10 and the exon 11
    frameshift G808DfsX11 - while the alleles reported in Usher syndrome type 2D lie in the
    long-isoform-specific N terminus. That positional split is the proposed explanation for
    why one gene produces a syndromic and a non-syndromic disease, and it is a proposal from
    a handful of clinical reports rather than a validated rule. One reported nonsyndromic
    case complicates it: a homozygous missense change at residue 207, inside the
    long-isoform-specific region, in a consanguineous Moroccan patient with severe hearing
    loss. Whether that patient's retina was assessed is not stated in the source read here.
  evidence:
  - reference: PMID:17171570
    reference_title: "A novel gene for Usher syndrome type 2: mutations in the long isoform of whirlin are associated with retinitis pigmentosa and sensorineural hearing loss."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "While mutations in the C-terminal half of whirlin have previously been reported in non-syndromic deafness (DFNB31), both alterations identified in our USH2 family affect the long protein isoform."
    explanation: States the positional contrast between the DFNB31 and USH2D allele sets.
  - reference: PMID:17171570
    reference_title: "A novel gene for Usher syndrome type 2: mutations in the long isoform of whirlin are associated with retinitis pigmentosa and sensorineural hearing loss."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that mutations causing Usher syndrome are probably restricted to exons 1-6 that are specific for the long isoform and probably crucial for retinal function."
    explanation: >-
      The genotype-phenotype proposal itself. Graded INDIRECT because the authors offer it
      as a hypothesis from two alleles in one family plus the prior DFNB31 reports.
  - reference: PMID:37924449
    reference_title: Novel pathogenic WHRN variant causing hearing loss in a moroccan family.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in a consanguineous Moroccan patient with severe hearing loss identified a single homozygous mutation"
    explanation: >-
      A homozygous WHRN variant at residue 207 - inside the region the positional rule
      assigns to Usher syndrome - reported in hearing loss. Recorded as a complication of
      that rule, and graded INDIRECT because the source does not report an ophthalmological
      assessment that would settle whether the case is syndromic.

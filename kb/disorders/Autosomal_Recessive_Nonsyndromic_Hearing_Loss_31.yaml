name: Autosomal Recessive Nonsyndromic Hearing Loss 31
category: Mendelian
creation_date: "2026-09-16T00:00:00Z"
synonyms:
- DFNB31
- Deafness, autosomal recessive 31
- Autosomal recessive nonsyndromic deafness 31
- WHRN-associated nonsyndromic hearing loss
- Autosomal recessive nonsyndromic deafness caused by mutation in WHRN
description: >-
  DFNB31 is nonsyndromic sensorineural hearing loss caused by biallelic variants in WHRN,
  which encodes whirlin - a PDZ-domain scaffold protein at the tips of hair-cell stereocilia.
  It was identified through the whirler mouse, a spontaneous mutant that does not respond to
  sound and whose hair cells carry abnormally short stereocilia; transgene correction and
  mutation analysis identified whirlin, and the same gene was shown to underlie the human
  DFNB31 locus.

  The mechanism is a failure of stereocilia elongation and bundle organization rather than a
  defect in the mechanotransduction channel itself. Whirlin sits at the stereocilium tip, the
  site of actin polymerization, where it forms a complex with EPS8 that sets stereocilium
  length; its appearance and fade-out across the rows of a growing bundle is graded, and
  removing it leaves the bundle short and disordered. The transduction apparatus is not
  the lesion - the structure it needs is.

  What makes this entry more than a per-locus record is that the same gene also causes Usher
  syndrome type 2D, and the two are allelic. Clinically they are clearly different: DFNB31
  patients have profound hearing loss and normal vision, while USH2D patients have moderate
  hearing loss with retinitis pigmentosa. WHRN has two major isoforms, a long form encoded by
  exons 1-13 and a short form from exons 6-13 that lacks the N-terminal PDZ1 and PDZ2 domains.
  The reported human alleles line up with that split - the DFNB31 alleles fall in the
  C-terminal half, the USH2D alleles in the long-isoform-specific N terminus - and the
  proposal that mutations causing Usher syndrome are restricted to the long-isoform-specific
  exons is the mechanistic account of why one gene gives a syndromic and a non-syndromic
  disease. It remains a proposal drawn from a small number of clinical reports, not a
  validated rule, and at least one reported nonsyndromic case carries a missense variant
  inside the N-terminal region the rule would assign to Usher syndrome.

  DFNB31 is rare even among recessive nonsyndromic hearing loss. The Tunisian study that
  reported the second family screened 62 further unrelated ARNSHL families and found no
  linkage to the locus at all.

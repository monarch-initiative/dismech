pathophysiology:
- name: Biallelic WHRN Loss of Function
  description: >-
    Biallelic WHRN variants remove or truncate whirlin, a PDZ-domain scaffold with two
    N-terminal PDZ domains, a proline-rich region and a C-terminal PDZ. The gene has two
    major isoforms - a long form encoded by exons 1-13 and a short form from exons 6-13
    lacking PDZ1 and PDZ2 - and the alleles reported in DFNB31 sit in the C-terminal half,
    so both isoforms lose their C-terminal PDZ. The first DFNB31 allele described is the
    exon 10 nonsense change R778X; a frameshift in exon 11, G808DfsX11, was reported next.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: WHRN
    term:
      id: hgnc:16361
      label: WHRN
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Nonsense and frameshift alleles in the C-terminal half of the protein, reported
      homozygously in consanguineous families.
  downstream:
  - target: Loss of Whirlin from the Stereocilia Tip Complex
    description: >-
      The truncated protein cannot serve as the tip scaffold; in the whirler mouse, which
      ablates both major isoforms, the tip pool is what is missing.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12833159
    reference_title: "Defects in whirlin, a PDZ domain molecule involved in stereocilia elongation, cause deafness in the whirler mouse and families with DFNB31."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene encoding whirlin also underlies the human autosomal recessive deafness locus DFNB31."
    explanation: Establishes WHRN as the DFNB31 gene in humans.
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The first WHRN mutation identified in DFNB31 patients is a cysteine to threonine substitution in exon 10, which changes the arginine codon to a stop codon (R778X)"
    explanation: >-
      Names the founding DFNB31 allele and its position in the C-terminal half. Quoted from
      a review summarising the primary reports rather than from a primary report, hence
      REVIEW_SYNTHESIS.
- name: Loss of Whirlin from the Stereocilia Tip Complex
  description: >-
    Whirlin localizes to the tips of stereocilia, and its expression there is dynamic rather
    than static: it appears and fades out in an ordered sequence across the rows of the
    growing bundle, fading from inner hair cells before outer hair cells. At the tip the
    short isoform binds EPS8, and the pair are required together for normal length
    regulation. Losing whirlin therefore removes the scaffold that assembles the
    actin-regulatory machinery at the one place in the stereocilium where the actin core
    grows.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  cellular_components:
  - preferred_term: stereocilium tip
    term:
      id: GO:0032426
      label: stereocilium tip
  downstream:
  - target: Failure of Stereocilia Elongation and Bundle Organization
    description: >-
      Without the tip scaffold the actin core is not elongated to its programmed length and
      the graded row heights are not established.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15590699
    reference_title: Mutant analysis reveals whirlin as a dynamic organizer in the growing hair cell stereocilium.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that whirlin localizes at the tips of stereocilia."
    explanation: Places whirlin at the stereocilium tip, which is where the lesion acts.
  - reference: PMID:27117407
    reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "WHRN-S interacts with EPS8, and both are required at stereocilia tips for normal length regulation."
    explanation: Identifies the tip complex whose loss produces the short-stereocilia phenotype.
- name: Failure of Stereocilia Elongation and Bundle Organization
  description: >-
    Hair bundles in whirlin-null mice are built from abnormally short stereocilia, in both
    inner and outer hair cells. The defect is in elongation and maintenance of the actin
    core and in the organization of the bundle, not in the presence of the stereocilia
    themselves. The isoforms divide the work: a mouse expressing the short isoform but not
    the long one keeps inner hair cell bundles close to normal and loses outer hair cell
    bundle morphology, organization and function, so the long isoform is doing something
    the short one does not - its localization midway along the shorter stereocilia
    coincides with the inter-stereociliary links.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  cellular_components:
  - preferred_term: stereocilium bundle
    term:
      id: GO:0032421
      label: stereocilium bundle
  biological_processes:
  - preferred_term: stereocilia elongation by actin polymerization
    modifier: DECREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  - preferred_term: auditory hair cell stereocilium organization
    modifier: ABNORMAL
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  - preferred_term: stereocilium maintenance
    modifier: DECREASED
    term:
      id: GO:0120045
      label: stereocilium maintenance
  downstream:
  - target: Hair Bundle Mechanotransduction Failure
    description: >-
      A bundle of short, ungraded stereocilia cannot deflect and gate as a bundle of graded
      ones does, so sound no longer produces a normal receptor response.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of graded stereocilia row heights
    - loss of the inter-stereociliary link geometry that couples the rows, so tip-link
      tension is not developed normally on deflection
  - target: Congenital Onset of Hearing Loss
    description: >-
      The bundle defect is developmental - the stereocilia never reach their programmed
      length - so the deficit is present from birth rather than acquired, which is how the
      one family with a reported onset is described.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of hair bundle maturation during cochlear development
  evidence:
  - reference: PMID:12833159
    reference_title: "Defects in whirlin, a PDZ domain molecule involved in stereocilia elongation, cause deafness in the whirler mouse and families with DFNB31."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "detailed ultrastructural analysis of sensory hair cells in the organ of Corti of the inner ear indicates that the whirler gene encodes a protein involved in the elongation and maintenance of stereocilia in both inner hair cells (IHCs) and outer hair cells (OHCs)"
    explanation: Ultrastructural demonstration that the lesion is one of stereocilia elongation and maintenance.
  - reference: PMID:12833159
    reference_title: "Defects in whirlin, a PDZ domain molecule involved in stereocilia elongation, cause deafness in the whirler mouse and families with DFNB31."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "this novel PDZ domain-containing molecule acts as an organizer of submembranous molecular complexes that control the coordinated actin polymerization and membrane growth of stereocilia"
    explanation: >-
      The authors' mechanistic account of how whirlin controls elongation. Graded INDIRECT
      because it is offered as a suggestion from the phenotype rather than a measurement.
  - reference: PMID:27117407
    reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Lack of both isoforms causes abnormally short stereocilia and profound deafness and vestibular dysfunction."
    explanation: Links complete whirlin loss to short stereocilia and to profound deafness in the mouse.
  - reference: PMID:27117407
    reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "WHRN-S expression, however, is sufficient to maintain stereocilia bundle morphology and function in a subset of hair cells, resulting in some auditory response and no overt vestibular dysfunction."
    explanation: >-
      Shows the two isoforms are not interchangeable, and that retaining the short isoform
      alone converts profound deafness into a milder loss in the mouse.
- name: Hair Bundle Mechanotransduction Failure
  description: >-
    With short, disordered bundles the hair cell cannot convert sound-induced deflection
    into a receptor potential, and the cochlea does not transmit. The transduction
    machinery itself is not the lesion in DFNB31 - the bundle architecture it depends on
    is - which is why the deficit is sensorineural and cochlear rather than retrocochlear.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: detection of mechanical stimulus involved in hearing
    modifier: DECREASED
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
  downstream:
  - target: Profound Sensorineural Hearing Impairment
    description: >-
      The clinical endpoint of the chain: a cochlear sensory deficit at the severe end of
      the range.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27117407
    reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "While the Whrnwi/wi mutant is profoundly deaf and exhibits circling and headbobbing behavior, we found that the Whrntm1b mutant shows only moderate to severe hearing loss"
    explanation: >-
      Ties bundle state to auditory outcome across two mouse alleles. INDIRECT for the human
      claim because the measured outcome is murine auditory function.
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2D patients have moderate sensorineural hearing loss and RP, while DFNB31 patients have profound sensorineural hearing loss and normal vision."
    explanation: The human endpoint, and the contrast with the allelic syndromic disease.

- Nonsyndromic Hearing Loss
notes: >-
  Identifiers. OMIM #607084 (DFNB31) is the OMIM key for this concept, and WHRN is
  hgnc:16361 at 9q32. They are recorded in prose because the schema's `mappings` block
  carries `mondo_mappings` only and has no slot for an OMIM identifier.

  Scope, and the entity next door. This entry is the non-syndromic disease only. WHRN also
  causes Usher syndrome type 2D, which is curated in `Usher_Syndrome.yaml` as a WHRN
  subtype; the allelic relationship between the two is curated here because it is what
  explains the DFNB31 phenotype, but USH2D itself is not re-curated. The other WHRN
  neighbour in the KB, `Autosomal_Recessive_Nonsyndromic_Hearing_Loss_48`, is a CIB2 entry
  that mentions whirlin only in mechanism prose and argues that CIB2's stereocilia role is
  not exercised through whirlin; it is not coverage of this disease.

  Evidence base and its shape. The human evidence for DFNB31 is thin, and worth stating
  plainly: the founding report (PMID:12833159) names the human locus but is largely a mouse
  paper, the second family (PMID:15841483) is one consanguineous Tunisian kindred, and a
  third (PMID:37924449) is one consanguineous Moroccan patient. The allele list this entry
  quotes - R778X in exon 10, G808DfsX11 in exon 11 - comes from a review (PMID:30831381)
  summarising those primary reports, and is graded `REVIEW_SYNTHESIS` accordingly. No
  frequency bands are recorded on the phenotypes, because with three reported families
  every band would be computed from an ascertainment criterion rather than from a cohort.

  Mechanism evidence is mouse and cell biology throughout, and is graded that way. Whirlin's
  tip localization and its dynamic gradation across stereocilia rows (PMID:15590699), the
  isoform-specific localization and the WHRN-S/EPS8 length-regulation complex
  (PMID:27117407), and the AAV8 rescue (PMID:26307667) are all mouse work. None of it is
  used as the sole support for a human phenotype.

  Two things this entry deliberately does not assert. First, it does not claim that DFNB31
  patients have been shown to have normal retinas by examination. The review states that
  DFNB31 patients have normal vision, and that is recorded as written, but no source read
  here reports a systematic ophthalmological assessment of a DFNB31 cohort. Second, it does
  not resolve vestibular involvement. The whirler mouse circles and head-bobs, and the
  double-isoform-null mouse has overt vestibular dysfunction, while the review records that
  none of the published WHRN patients self-reported a vestibular deficit - self-report, not
  testing. That disagreement is recorded as a HUMAN_MODEL_MISMATCH discussion rather than
  resolved.

  Bilaterality and progression are not curated. Neither "bilateral" nor a progression course
  is described for DFNB31 in the references read here. Recessive cochlear disease is
  bilateral in expectation, but expectation is not a source, so `HP:0008619` is not bound.

  Deep research. A Falcon deep-research report is committed alongside this entry. The query
  was seeded with a disambiguated disease name ("DFNB31 WHRN whirlin-related autosomal
  recessive nonsyndromic hearing loss") rather than the bare numbered locus name, because
  numbered loci are where providers substitute a different disease. It came back on topic:
  `just preflight-dr` passed against MONDO:0011767 with WHRN mentioned 66 times and the
  correct OMIM number (607084) present, and its own reference validation resolved 9 of 9
  citations with a confabulation rate of 0. It was used as a lead source only - every
  snippet in this entry is anchored to a PMID fetched into `references_cache/` and read
  directly - and it did not change any conclusion drawn from the primary literature.

  The report states that the AAV8 rescue restored stereocilia morphology but did **not**
  improve hearing, and that treating adult mice did not restore stereocilia at all. The
  first half is confirmed by the whirlin isoform review (PMID:30831381), which is cached in
  full and is cited on the AAV8 model's readout; the same review reports that posterior
  semicircular canal delivery partially improved hearing and balance, so the negative result
  is route-specific. The adult-treatment claim is attributed to the gene-therapy paper's full
  text, which is not cached (its abstract and DOI record do not contain it), so it is not
  asserted here.

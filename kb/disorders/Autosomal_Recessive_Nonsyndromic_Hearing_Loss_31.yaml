          label: Cochlear Implant
  description: >-
    The standard intervention for congenital profound sensorineural hearing loss. The
    mechanism supports it in principle: the lesion is in the hair bundle, upstream of the
    spiral ganglion an implant stimulates, and no cochlear malformation is described in
    this disease. No outcome data exist for DFNB31 patients specifically.
  target_mechanisms:
  - target: Hair Bundle Mechanotransduction Failure
    treatment_effect: BYPASSES
    description: Bypasses the failed transduction step by stimulating the auditory nerve directly.
  notes: >-
    Carries no evidence item deliberately. The published WHRN literature reports no implant
    outcomes, and the rationale above is this entry's inference from the mechanism, labelled
    as such. The treatment term is the generic surgical action; NCIT:C157820 names the
    device rather than a clinical action and is not reachable from NCIT:C25218, so it is
    attached as a qualifier instead.
- name: Early Identification and Habilitation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: auditory habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    Where the loss is congenital and profound, the modifiable outcome is spoken-language
    development and the modifier is how early it is identified and habilitated. Newborn
    hearing screening detects it.
  notes: >-
    No evidence item. This is general practice for congenital profound deafness, not a
    DFNB31 finding.
animal_models:
- name: Whirler mouse (Whrn wi/wi)
  species: Mouse
  genotype: Whrn wi/wi - spontaneous deletion removing most of exons 6-10, ablating both major whirlin isoforms
  publication: PMID:12833159
  description: >-
    The spontaneous mutant through which the gene was found. Whirler mice do not respond to
    sound and their inner and outer hair cells carry abnormally short stereocilia. Because
    the deletion removes both major isoforms, the model is the null end of the WHRN allelic
    series rather than a copy of any particular human allele.
  modeled_mechanisms:
  - target: Failure of Stereocilia Elongation and Bundle Organization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Ultrastructural analysis of the organ of Corti in this mutant is the primary evidence
      that whirlin is required for stereocilia elongation and maintenance.
    limitations: >-
      The whirler deletion sits in the 3' region shared by both isoforms, which is where the
      human DFNB31 alleles fall, so it matches them in position; but it removes both
      isoforms outright rather than truncating them, so it may be more severe than the
      human lesion. The mutant also
      circles and head-bobs, a vestibular phenotype not reported in DFNB31 patients.
    readouts:
    - name: Stereocilia length in inner and outer hair cells
      target: Failure of Stereocilia Elongation and Bundle Organization
      direction: DECREASED
      interpretation: Short stereocilia in both hair cell types is the structural correlate of this node.
      evidence:
      - reference: PMID:12833159
        reference_title: "Defects in whirlin, a PDZ domain molecule involved in stereocilia elongation, cause deafness in the whirler mouse and families with DFNB31."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "detailed ultrastructural analysis of sensory hair cells in the organ of Corti of the inner ear indicates that the whirler gene encodes a protein involved in the elongation and maintenance of stereocilia in both inner hair cells (IHCs) and outer hair cells (OHCs)"
        explanation: The ultrastructural measurement behind this readout.
  evidence:
  - reference: PMID:12833159
    reference_title: "Defects in whirlin, a PDZ domain molecule involved in stereocilia elongation, cause deafness in the whirler mouse and families with DFNB31."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The whirler mouse mutant (wi) does not respond to sound stimuli"
    explanation: Establishes the model's auditory phenotype.
- name: Whrn tm1b long-isoform-null mouse
  species: Mouse
  genotype: Whrn tm1b(KOMP)Wtsi homozygote - exon 4 deleted, expresses WHRN-S but not WHRN-L
  publication: PMID:27117407
  description: >-
    The isoform-dissecting model. Retaining the short isoform alone leaves inner hair cell
    bundles close to normal, damages outer hair cell bundles, and produces moderate to
    severe rather than profound hearing loss with no overt vestibular dysfunction. It is
    the experimental basis for the proposal that isoform-specific loss explains the
    difference between DFNB31 and USH2D.
  modeled_mechanisms:
  - target: Failure of Stereocilia Elongation and Bundle Organization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces bundle disorganization, but only in outer hair cells, and with a milder
      auditory outcome than DFNB31.
    limitations: >-
      This allele is the inverse of the human DFNB31 genotype: it removes the long isoform
      and spares the short one, whereas the reported DFNB31 alleles truncate the C terminus
      shared by both. It models the allelic contrast rather than the human disease.
    readouts:
    - name: Outer hair cell bundle morphology and function
      target: Failure of Stereocilia Elongation and Bundle Organization
      direction: ALTERED
      interpretation: Isoform-restricted bundle damage, sparing inner hair cells.
      evidence:
      - reference: PMID:27117407
        reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "WHRN-S expression, however, is sufficient to maintain stereocilia bundle morphology and function in a subset of hair cells, resulting in some auditory response and no overt vestibular dysfunction."
        explanation: The bundle and auditory readout in this allele.
- name: AAV8-whirlin gene transfer in whirler mice
  species: Mouse
  genotype: Whrn wi/wi treated with AAV8 carrying wild-type whirlin cDNA by neonatal round-window injection
  publication: PMID:26307667
  description: >-
    A rescue experiment rather than a disease model: delivering wild-type whirlin cDNA to
    neonatal whirler cochleas restored normal stereocilia length and bundle architecture in
    infected hair cells and increased inner hair cell survival relative to the untreated
    contralateral ear.
  modeled_mechanisms:
  - target: Failure of Stereocilia Elongation and Bundle Organization
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Restoring whirlin restores the bundle, which is the strongest available evidence that
      the bundle phenotype is a direct consequence of whirlin loss rather than a downstream
      or developmental side effect.
    limitations: >-
      Neonatal delivery in a mouse with a double-isoform-null allele. Round-window delivery
      partially lengthened inner but not outer hair cell stereocilia and did not restore
      hearing, so this experiment is a structural rescue without a functional one. That
      negative result is specific to the route: a later study delivering the same construct
      through the posterior semicircular canal reached more cochlear hair cells and partially
      improved both auditory and vestibular function. The claim that treating adult mice did
      not restore stereocilia comes from the deep-research report's reading of full text
      that could not be fetched and is not asserted here.
    readouts:
    - name: Stereocilia length and bundle architecture after transduction
      target: Failure of Stereocilia Elongation and Bundle Organization
      direction: RESTORED
      interpretation: Structural rescue in transduced hair cells.
      evidence:
      - reference: PMID:26307667
        reference_title: Gene Therapy Restores Hair Cell Stereocilia Morphology in Inner Ears of Deaf Whirler Mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "whirlin expression was detected in infected hair cells (IHCs), and normal stereocilia length and bundle architecture were restored"
        explanation: The structural rescue readout.
    - name: Hearing after round-window delivery
      target: Failure of Stereocilia Elongation and Bundle Organization
      direction: UNCHANGED
      interpretation: >-
        Hearing loss was not restored despite partial stereocilia lengthening in inner hair
        cells, so the structural rescue did not carry through to function by this route.
      evidence:
      - reference: PMID:30831381
        reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
        supports: SUPPORT
        quote_role: REVIEW_SYNTHESIS
        evidence_source: MODEL_ORGANISM
        snippet: "The cochlear round window delivery partially increases the stereocilia length in IHCs but not OHCs, and hearing loss in Whrnwi mice is not restored (Chien et al., 2015)."
        explanation: >-
          The review's summary of the functional outcome of this experiment, which the
          primary paper's abstract does not report.
    evidence:
    - reference: PMID:30831381
      reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: MODEL_ORGANISM
      snippet: "Posterior semicircular canal delivery of AAV-FL-whirlin was found to increase the stereociliary length in utricular hair cells as well as cochlear inner hair cells, and partially improve both the vestibular and auditory function of Whrnwi mice (Isgrig et al., 2017)."
      explanation: >-
        A different delivery route partially restored function, so the round-window
        negative result reflects the route rather than a limit of whirlin replacement.
  evidence:
  - reference: PMID:26307667
    reference_title: Gene Therapy Restores Hair Cell Stereocilia Morphology in Inner Ears of Deaf Whirler Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wild-type whirlin cDNA was delivered via adeno-associated virus (AAV8) by injection through the round window of the cochleas in neonatal whirler mice."
    explanation: Describes the delivery route and construct.
differential_diagnoses:
- name: Usher syndrome type 2D
  description: >-
    The allelic syndromic disease, caused by variants in the same gene. It is the
    differential that matters here, because the distinction is not made on the audiogram
    alone: USH2D hearing loss is moderate rather than profound, and the discriminating
    feature is retinitis pigmentosa, which begins around the second decade. A child with
    WHRN-related hearing loss and a variant in the long-isoform-specific N terminus is
    therefore a candidate for retinal surveillance rather than a settled DFNB31 diagnosis.
  evidence:
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "USH2D patients have moderate sensorineural hearing loss and RP, while DFNB31 patients have profound sensorineural hearing loss and normal vision."
    explanation: The clinical discriminator between the two WHRN diseases.
  - reference: PMID:17171570
    reference_title: "A novel gene for Usher syndrome type 2: mutations in the long isoform of whirlin are associated with retinitis pigmentosa and sensorineural hearing loss."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "this is the first case of USH2 that is allelic to non-syndromic deafness"
    explanation: Establishes that the two WHRN diseases are allelic, which is why this differential exists at all.
discussions:
- discussion_id: dfnb31_vestibular_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Whirlin-null mice have overt vestibular dysfunction and no published WHRN patient
    reports a vestibular deficit. Is human DFNB31 genuinely vestibular-sparing, or has
    vestibular function never been tested?
  attaches_to:
  - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
  rationale: >-
    Whirlin is expressed in vestibular hair cells as well as cochlear ones, and the same
    stereocilia machinery builds both bundles, so a vestibular phenotype is what the
    mechanism predicts. The whirler mouse circles and head-bobs, and the mouse lacking both
    isoforms has profound deafness with vestibular dysfunction. Against that, the review
    summarising the published WHRN patients records that none of them self-reported a
    vestibular deficit - which is a statement about what patients volunteered, not about
    what testing showed. Whether DFNB31 spares the human vestibular system, or whether the
    deficit is present and compensated or simply unmeasured, changes what should be offered
    clinically: vestibular assessment and balance habilitation in a deaf child are not
    routine unless a deficit is suspected.
  proposed_experiments:
  - experiment_id: exp_dfnb31_formal_vestibular_testing
    name: Formal vestibular testing of a DFNB31 cohort
    description: >-
      Vestibular-evoked myogenic potentials, caloric testing and video head impulse testing
      in genotyped DFNB31 patients, with age-matched controls, rather than symptom
      questionnaires.
    would_support:
    - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
    supporting_outcome:
    - Measurable vestibular hypofunction in DFNB31 patients would show that the murine
      phenotype translates and that the absence of self-reported symptoms reflects
      compensation rather than sparing.
    would_refute:
    - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
    refuting_outcome:
    - Normal vestibular function on formal testing would establish a real
      cochlear-restricted phenotype in humans and make the mouse a poor model for this
      aspect of the disease.
  evidence:
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "None of these aforementioned patients self-reported any vestibular deficits."
    explanation: The human side of the mismatch, and the reason it is weak - self-report, not testing.
  - reference: PMID:30831381
    reference_title: "Usher syndrome and non-syndromic deafness: Functions of different whirlin isoforms in the cochlea, vestibular organs, and retina."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "However, both Whrnneo and Whrnwi mice show similar severe to profound loss of linear vestibular evoked potential (VsEP) responses."
    explanation: >-
      On objective testing both mouse alleles lose otolith responses, including the one
      without overt balance behaviour, so a deficit can be present where behaviour misses it.
      That is the case for formal testing rather than self-report in patients.
  - reference: PMID:27117407
    reference_title: Alternative Splice Forms Influence Functions of Whirlin in Mechanosensory Hair Cell Stereocilia.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Lack of both isoforms causes abnormally short stereocilia and profound deafness and vestibular dysfunction."
    explanation: The murine side of the mismatch.
- discussion_id: dfnb31_isoform_position_genotype_phenotype_rule
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the 5' / 3' positional rule - long-isoform-specific N-terminal alleles give Usher
    syndrome type 2D, C-terminal alleles give non-syndromic DFNB31 - actually a rule, or a
    pattern in a handful of families?
  attaches_to:
  - genetic#WHRN variants
  rationale: >-
    The rule is the entry's mechanistic account of why one gene gives two diseases, and it
    is doing real clinical work: it is what would decide whether a WHRN-positive deaf child
    is put under retinal surveillance. But it rests on two alleles in one German USH2 family
    set against the DFNB31 alleles known in 2007, and its authors stated it as a proposal.
    One later nonsyndromic report carries a homozygous missense change at residue 207, inside
    the long-isoform-specific region, without a reported retinal assessment. Until a
    genotype-stratified cohort with ophthalmological follow-up exists, the rule should not be
    used to withhold retinal surveillance.
  proposed_experiments:
  - experiment_id: exp_dfnb31_genotype_stratified_retinal_followup
    name: Genotype-stratified retinal follow-up of WHRN-positive hearing loss
    description: >-
      Assemble WHRN biallelic cases from hearing loss cohorts, classify alleles by whether
      they affect the long-isoform-specific exons, and follow retinal function
      longitudinally into the third decade.
    would_support:
    - genetic#WHRN variants
    supporting_outcome:
    - Retinitis pigmentosa confined to carriers of long-isoform-specific alleles would turn
      the proposal into a usable clinical rule.
    would_refute:
    - genetic#WHRN variants
    refuting_outcome:
    - Retinal degeneration in carriers of C-terminal alleles, or its absence in carriers of
      N-terminal ones, would show that isoform position does not determine the syndromic
      boundary.
  evidence:
  - reference: PMID:17171570
    reference_title: "A novel gene for Usher syndrome type 2: mutations in the long isoform of whirlin are associated with retinitis pigmentosa and sensorineural hearing loss."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that mutations causing Usher syndrome are probably restricted to exons 1-6 that are specific for the long isoform and probably crucial for retinal function."
    explanation: The proposal, in the authors' own hedged wording.

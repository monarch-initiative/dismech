    term:
      id: GO:0005921
      label: gap junction
  downstream:
  - target: Impaired Potassium Spatial Buffering
    causal_link_type: DIRECT
  - target: CNS Hypomyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microglial Activation and White Matter Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:18094232
    reference_title: "Two distinct heterotypic channels mediate gap junction coupling between astrocyte and oligodendrocyte connexins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, Cx47 mutants that cause Pelizaeus-Merzbacher-like disease do not efficiently form functional channels with Cx43, indicating that disrupted Cx47/Cx43 channels cause this disease."
    explanation: Identifies the heterotypic oligodendrocyte-astrocyte channel as the one the patient mutants lose.
  - reference: PMID:21750683
    reference_title: "Pathologic and phenotypic alterations in a mouse expressing a connexin47 missense mutation that causes Pelizaeus-Merzbacher-like disease in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "10-15-day-old homozygous Cx47M282T and Cx47 null mice revealed a more than 80% reduction in the number of cells participating in glial networks after biocytin injections into oligodendrocytes in sections of corpus callosum."
    explanation: In vivo loss of glial network coupling with a patient-derived allele.
- name: Impaired Potassium Spatial Buffering
  description: >-
    Oligodendrocyte connexins take part, with the astrocytic K+ channel Kir4.1,
    in clearing the K+ released by active axons. Without them, myelin develops
    vacuoles whose size and number track axonal activity. Shown in mice lacking
    both oligodendrocyte connexins; how much this contributes in human HLD2 is
    not established.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: potassium ion homeostasis
    modifier: DECREASED
    term:
      id: GO:0055075
      label: potassium ion homeostasis
  downstream:
  - target: CNS Hypomyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Activity-dependent myelin vacuolation contributes to the unstable sheath.
  evidence:
  - reference: PMID:17065440
    reference_title: "Genetic and physiological evidence that oligodendrocyte gap junctions contribute to spatial buffering of potassium released during neuronal activity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The size and number of myelin vacuoles was dramatically increased when axonal activity was increased, by either a natural stimulus (eye opening) or pharmacological treatment."
    explanation: >-
      Activity dependence of the myelin lesion in Cx32/Cx47 double-knockout
      mice. INDIRECT because the genotype also removes Cx32.
  - reference: PMID:17065440
    reference_title: "Genetic and physiological evidence that oligodendrocyte gap junctions contribute to spatial buffering of potassium released during neuronal activity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these results implicate oligodendrocytes and their connexins as having critical roles in the buffering of K+ released during neuronal activity."
    explanation: The authors' conclusion tying the connexins to K+ buffering.
- name: Microglial Activation and White Matter Inflammation
  description: >-
    In mice lacking both oligodendrocyte connexins, the affected cerebellum
    shows activated microglia and astrocytes and infiltrating T and B cells,
    alongside reduced expression of myelin-lipid synthesis genes. Human
    neuropathology to confirm this arm is not available.
  conforms_to: "cns_myelin_failure#Microglial Injury and Reactive Gliosis"
  biological_scale: TISSUE
  cell_types:
  - preferred_term: microglial cell
    term:

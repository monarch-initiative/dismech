  evidence:
  - reference: PMID:26051537
    reference_title: "Activated immune response in an inherited leukodystrophy disease caused by the loss of oligodendrocyte gap junctions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In accord, immunostaining showed T- and B-cells in the cerebella of mutant mice as well as activated microglia and astrocytes."
    explanation: Immune and glial activation in the double-knockout model.
- name: CNS Hypomyelination
  description: >-
    The tissue-level lesion: CNS myelin is deficient from the start, seen on
    MRI as diffuse hypomyelination. In mice the lesion appears as vacuolated
    myelinated fibres with Cx47 loss alone and as thin or absent sheaths when
    Cx32 is also removed.
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"

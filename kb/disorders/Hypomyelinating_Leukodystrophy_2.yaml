    snippet: "These studies provide new insight into a potential element of toxic gain of function underlying the mechanism of PMLD1"
    explanation: The authors frame the apoptotic activation as a candidate toxic gain-of-function mechanism, with their hedge kept.
  - reference: PMID:12843301
    reference_title: "Connexins are critical for normal myelination in the CNS."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "animals lacking both connexins die by postnatal week 6 from profound abnormalities in central myelin, characterized by thin or absent myelin sheaths, vacuolation, enlarged periaxonal collars, oligodendrocyte cell death, and axonal loss."
    explanation: >-
      Oligodendrocyte death in the double-knockout mouse. INDIRECT because the
      genotype removes Cx32 as well as Cx47.
- name: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
  description: >-
    Oligodendrocytes couple to astrocytes through heterotypic Cx47/Cx43 and
    Cx32/Cx30 channels. PMLD1 mutants fail to form functional channels with
    astrocytic Cx43, and a knock-in mouse carrying the orthologue of human
    M283T loses most glial network coupling in the corpus callosum, as Cx47-null
    mice do. Loss of this panglial network, rather than of Cx47 protein as
    such, is the proposed core of the disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  molecular_functions:

genetic:
- name: GJC2
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GJC2
    term:
      id: hgnc:17494
      label: GJC2
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_9bb53a46-83ae-4585-9b6b-c8f1aad1c4ab-2025-03-12T160000.000Z
    evidence:
    - reference: CGGV:assertion_9bb53a46-83ae-4585-9b6b-c8f1aad1c4ab-2025-03-12T160000.000Z
      reference_title: "GJC2 / hypomyelinating leukodystrophy 2 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "GJC2 | HGNC:17494 | hypomyelinating leukodystrophy 2 | MONDO:0012125 | AR | Definitive"
      explanation: ClinGen classifies GJC2 as definitively causing HLD2, autosomal recessive.
  notes: >-
    Encodes connexin-47. Written GJA12 in older literature. Coding variants of
    all classes and a recurrent promoter variant are reported. Biallelic GJC2
    variants also cause spastic paraplegia 44, and heterozygous variants are
    reported in hereditary lymphedema; neither is part of this entry.
  evidence:
  - reference: PMID:29276893
    reference_title: "Pelizaeus-Merzbacher-Like Disease 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PMLD1 is established in a proband with suggestive clinical and neuroimaging findings and identification of biallelic pathogenic variants in GJC2 on molecular genetic testing."
    explanation: GeneReviews defines the disease by biallelic GJC2 variants.
  - reference: CGGV:assertion_9bb53a46-83ae-4585-9b6b-c8f1aad1c4ab-2025-03-12T160000.000Z
    reference_title: "GJC2 / hypomyelinating leukodystrophy 2 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GJC2 | HGNC:17494 | hypomyelinating leukodystrophy 2 | MONDO:0012125 | AR | Definitive"
    explanation: ClinGen classifies GJC2 as definitively causing HLD2, autosomal recessive.
  variants:
  - name: c.-167A>G (promoter)
    description: >-
      Homozygous variant in the noncoding exon 1 promoter at a SOX10 binding
      site. A founder variant in families of Pakistani origin, estimated to
      account for about 29% of reported GJC2-PMLD patients. It is missed by
      sequencing that covers only the coding exon.
    evidence:
    - reference: PMID:21959080
      reference_title: "Promoter mutation is a common variant in GJC2-associated Pelizaeus-Merzbacher-like disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This promoter mutation has only recently been reported in GJC2-PMLD but it has been postulated to affect the binding of the transcription factor SOX10 and appears to be a prevalent mutation, accounting for ~29% of reported patients with GJC2-PMLD."
      explanation: Frequency and proposed mechanism of the promoter variant.
  - name: p.M283T
    description: >-
      ER-retained missense allele that forms no functional channels and
      activates the UPR in primary oligodendrocytes; its mouse orthologue
      (M282T) is the knock-in model.
    evidence:
    - reference: PMID:21750683
      reference_title: "Pathologic and phenotypic alterations in a mouse expressing a connexin47 missense mutation that causes Pelizaeus-Merzbacher-like disease in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results strongly suggest that PMLD1 is caused by the loss of Cx47 channel function that results in impaired panglial coupling in white matter tissue."
      explanation: Knock-in evidence that this allele acts through loss of panglial coupling.
diagnosis:
- name: Brain MRI and GJC2 Sequencing Including the Promoter
  description: >-
    Diagnosis rests on a PMD-like clinical picture with hypomyelination on MRI
    and biallelic GJC2 variants. Testing should include the noncoding exon 1,
    where the common promoter variant lies.
  evidence:
  - reference: PMID:29276893
    reference_title: "Pelizaeus-Merzbacher-Like Disease 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PMLD1 is established in a proband with suggestive clinical and neuroimaging findings and identification of biallelic pathogenic variants in GJC2 on molecular genetic testing."
    explanation: GeneReviews diagnostic criteria.
  - reference: PMID:21959080
    reference_title: "Promoter mutation is a common variant in GJC2-associated Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that diagnostic screening of GJC2 should include sequence analysis of the non-coding exon 1, as well as the coding regions to avoid misdiagnosis or diagnostic delay in suspected PMLD."
    explanation: Why promoter sequencing must be included.
- name: Brainstem Auditory Evoked Potentials to Separate GJC2 from PLP1 Disease
  description: >-
    PMD and GJC2 disease are hard to tell apart clinically and on MRI.
    Brainstem auditory evoked potential waves III-V are absent in PMD but
    usually recordable in GJC2 disease, which helps choose which gene to test
    first.
  evidence:
  - reference: PMID:20513814
    reference_title: "Clinical neurophysiology in GJA12-related hypomyelination vs Pelizaeus-Merzbacher disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In brainstem auditory EP, waves III-V were absent in all patients with PMD, but clearly recordable in 11 of 13 investigations in 8 patients with PMLD."
    explanation: The discriminating neurophysiological result.
treatments:
- name: Supportive Care
  description: >-
    No disease-modifying treatment exists. Care is multidisciplinary and
    supportive: nutrition and swallowing support, management of spasticity,
    ataxia, seizures and movement disorders, communication support, and
    surveillance of hips and spine.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Spasticity
    description: Addresses consequences only; nothing available acts on the coupling defect.
  evidence:
  - reference: PMID:29276893
    reference_title: "Pelizaeus-Merzbacher-Like Disease 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date no definite treatment is available; treatment is mainly supportive"
    explanation: GeneReviews states that management is supportive.
- name: Genetic Counseling
  description: >-
    Counseling for autosomal recessive inheritance, carrier testing of
    relatives, and prenatal or preimplantation testing once both familial
    variants are known.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29276893
    reference_title: "Pelizaeus-Merzbacher-Like Disease 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the GJC2 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives, prenatal testing for a pregnancy at increased risk, and preimplantation genetic testing are possible."
    explanation: GeneReviews counseling and reproductive testing options.
- name: Oligodendrocyte-Targeted AAV-GJC2 Gene Therapy (preclinical)
  description: >-
    Not available to patients. A single intracerebral injection of an AAV
    vector expressing Cx47 from the myelin basic protein promoter, given on
    postnatal day 10 to Cx32/Cx47 double-knockout mice, restored
    oligodendrocyte gap-junction coupling, improved motor performance and
    prolonged survival.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    description: Replaces Cx47 in oligodendrocytes and re-establishes gap-junction connectivity.
  evidence:
  - reference: PMID:28100454
    reference_title: "Gene therapy targeting oligodendrocytes provides therapeutic benefit in a leukodystrophy model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Application of this oligodendrocyte-targeted somatic gene therapy at postnatal Day 10 in groups of double knockout mice, a well characterized model of hypomyelinating leukodystrophy-2, resulted in significant improvement in motor performance and coordination at 1 month of age in treated compared to mock-treated mice, as well as prolonged survival."
    explanation: Preclinical efficacy in the double-knockout model.
animal_models:
- name: Cx32/Cx47 double-knockout mouse
  species: Mouse
  genotype: Gjb1 null; Gjc2 null
  publication: PMID:12843301
  modeled_mechanisms:
  - target: CNS Hypomyelination
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Removes Cx32 as well as Cx47; mice lacking Cx47 alone are nearly
      normal, so the severity depends on losing a second connexin that human
      HLD2 patients retain.
    evidence:
    - reference: PMID:12843301
      reference_title: "Connexins are critical for normal myelination in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "animals lacking both connexins die by postnatal week 6 from profound abnormalities in central myelin, characterized by thin or absent myelin sheaths, vacuolation, enlarged periaxonal collars, oligodendrocyte cell death, and axonal loss."
      explanation: The double knockout produces severe CNS myelin failure.
- name: Cx47 M282T knock-in mouse
  species: Mouse
  genotype: Gjc2 M282T homozygous (orthologue of human p.M283T)
  publication: PMID:21750683
  modeled_mechanisms:
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Carries a patient-derived allele and loses most glial network coupling.
    evidence:
    - reference: PMID:21750683
      reference_title: "Pathologic and phenotypic alterations in a mouse expressing a connexin47 missense mutation that causes Pelizaeus-Merzbacher-like disease in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "10-15-day-old homozygous Cx47M282T and Cx47 null mice revealed a more than 80% reduction in the number of cells participating in glial networks after biocytin injections into oligodendrocytes in sections of corpus callosum."
      explanation: Direct measurement of coupling loss with the patient allele.
  - target: CNS Hypomyelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Adult knock-in mice show no substantial myelin change unless Cx32 is
      also removed, whereas patients have lifelong hypomyelination.
    evidence:
    - reference: PMID:21750683
      reference_title: "Pathologic and phenotypic alterations in a mouse expressing a connexin47 missense mutation that causes Pelizaeus-Merzbacher-like disease in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult mCx47M282T expressing mice did not show substantial myelin alterations"
      explanation: The single-allele mouse does not reproduce the human myelin lesion.
- name: Toy Poodle GJC2 frameshift hypomyelinating leukodystrophy
  species: Dog
  genotype: GJC2 c.920_933del homozygous
  publication: PMID:42543680
  modeled_mechanisms:
  - target: CNS Hypomyelination
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Naturally occurring canine GJC2 disease with white matter vacuolation and demyelination.
    limitations: >-
      Six affected dogs, all euthanized young; no functional or longitudinal
      data yet.
    evidence:
    - reference: PMID:42543680
      reference_title: "Gap junction protein gamma 2 (GJC2) gene frameshift deletion in Toy Poodles with hypomyelinating leukodystrophy resembling human Pelizaeus-Merzbacher-like disease 1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Subsequent histopathological examination revealed vacuolar changes and demyelination in the cerebral and cerebellar white matter, leading to a diagnosis of HLD."
      explanation: Neuropathology in the spontaneous canine model.

name: Hypomyelinating Leukodystrophy 2
creation_date: "2026-10-16T00:00:00Z"
category: Genetic
synonyms:
- Pelizaeus-Merzbacher-like disease 1
- PMLD1
- HLD2
- GJC2 leukodystrophy
- Pelizaeus-Merzbacher-like disease due to GJC2 mutation
parents:
- Leukodystrophy
disease_term:
  preferred_term: hypomyelinating leukodystrophy 2
  term:
    id: MONDO:0012125
    label: leukodystrophy, hypomyelinating, 2
description: >-
  Autosomal recessive hypomyelinating leukodystrophy caused by biallelic GJC2
  variants. GJC2 encodes connexin-47 (Cx47), the gap-junction protein that
  couples oligodendrocytes to astrocytes (through Cx47/Cx43 channels) and to
  each other. The disease is the autosomal recessive phenocopy of
  Pelizaeus-Merzbacher disease: nystagmus beginning in the neonatal or
  early-infantile period, hypotonia that evolves into spasticity, cerebellar
  signs in childhood, and diffuse CNS hypomyelination on MRI, usually with
  normal cognition or mild intellectual disability and a slowly progressive
  course.

  Two mechanisms are documented for the same protein. Most coding alleles
  abolish channel function, and several (p.P87S, p.Y269D, p.M283T) are also
  retained in the endoplasmic reticulum, where in primary oligodendrocytes they
  switch on the unfolded protein response and apoptotic pathways. A recurrent
  promoter variant (c.-167A>G) instead removes a SOX10 binding site and lowers
  GJC2 transcription. The milder allelic disorder, spastic paraplegia 44, is
  curated separately.
notes: >-
  The gene is written GJA12 (connexin 46.6) in the founding 2004 report and in
  other literature before the HGNC renaming. A large fraction of PMD-like
  hypomyelination with a normal PLP1 locus is not explained by GJC2 either;
  "Pelizaeus-Merzbacher-like disease" in the older literature is a phenotype
  label that also covers other genes (for example AIMP1), and only the GJC2
  form is this entry.

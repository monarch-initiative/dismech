      or to truncating alleles.
  evidence:
  - reference: PMID:15192806
    reference_title: "Mutations in the gene encoding gap junction protein alpha 12 (connexin 46.6) cause Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three of six families with PMLD, we detected five different GJA12 mutations, including missense, nonsense, and frameshift mutations."
    explanation: The founding gene discovery, in human families.
  - reference: PMID:17344063
    reference_title: "Loss-of-function GJA12/Connexin47 mutations cause Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dual whole-cell patch clamping of transfected Neuro2A cells demonstrated that none of the mutants formed functional channels, in contrast to wild type Cx47."
    explanation: Shows directly that three patient missense alleles are channel-dead.
  - reference: PMID:20695017
    reference_title: "Disrupted SOX10 regulation of GJC2 transcription causes Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functionally, this mutation completely abolished the SOX10 binding and attenuated GJC2 promoter activity."
    explanation: Establishes the transcriptional route to loss of function for the promoter variant.
- name: Connexin-47 ER Retention and Unfolded Protein Response
  description: >-
    Several PMLD1 missense proteins are retained in the endoplasmic reticulum
    instead of reaching the plasma membrane. In primary oligodendrocytes, three
    such mutants activate the unfolded protein response and apoptotic pathways,
    a toxic gain of function on top of channel loss. The milder SPG44 allele
    p.I33M traffics normally and activates neither, which is one measured
    difference between the severe and mild ends of the GJC2 spectrum.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  downstream:
  - target: Oligodendrocyte Apoptosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35276347
    reference_title: "Activation of the unfolded protein response by Connexin47 mutations associated with Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that when expressed in primary OLs, three PMLD1 associated mutants (p.P87S, p.Y269D and p.M283T) show ER retention of Cx47 and evidence of activation of the cellular stress (unfolded protein response, UPR) and apoptotic pathways."
    explanation: Primary-oligodendrocyte evidence for ER retention and UPR activation.
  - reference: PMID:20442743
    reference_title: "Pelizaeus-Merzbacher-like disease is caused not only by a loss of connexin47 function but also by a hemichannel dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutants T265A and A98G_V99insT were retained in the ER, T398I formed gap junctional plaques at the plasma membrane, and G149S showed both, structures at the plasma membrane and ER localization."
    explanation: >-
      ER retention is allele-specific; one mutant reaches the membrane, which
      is why this branch does not cover every allele.
- name: Oligodendrocyte Apoptosis
  description: >-
    Death of oligodendrocytes downstream of ER stress in cells carrying
    ER-retained mutants, and in the Cx32/Cx47 double-knockout mouse, where
    restoring Cx47 to oligodendrocytes reduces it.
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"

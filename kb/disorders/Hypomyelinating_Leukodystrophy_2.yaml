    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopic analysis of CNS white matter in Cx47-deficient mice revealed a conspicuous vacuolation of nerve fibers, particularly at the site of the optic nerve where axons are first contacted by oligodendrocytes and myelination starts."
    explanation: Myelin pathology attributable to Cx47 loss alone.
- name: Peripheral Nerve Myelin Involvement
  description: >-
    Unlike in mice, GJC2 is transcribed in human peripheral nerve, and some
    patients have slowed nerve conduction consistent with a mild demyelinating
    neuropathy. It is a minority finding (2 of 10 patients in one
    neurophysiology series).
  biological_scale: TISSUE
  downstream:
  - target: Demyelinating peripheral neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15192806
    reference_title: "Mutations in the gene encoding gap junction protein alpha 12 (connexin 46.6) cause Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results are in accordance with the electrophysiological finding of reduced motor and sensory nerve conduction velocities in patients with PMLD, which argues for a demyelinating neuropathy."
    explanation: Human peripheral nerve conduction findings.

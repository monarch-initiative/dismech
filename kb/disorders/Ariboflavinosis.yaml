- name: Intestinal Slc52a3 conditional knockout mouse
  species: Mouse
  genotype: Intestine-specific Slc52a3 (RFVT-3) deletion, Cre/Lox
  publication: PMID:26660539
  description: >-
    Loss of the apical intestinal riboflavin transporter makes all mice riboflavin deficient, with growth retardation,
    premature death in about two-thirds and intestinal oxidative stress, all corrected by pharmacological riboflavin.
    Models failed absorption rather than low intake.
  modeled_mechanisms:
  - target: Systemic Riboflavin Insufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Genetic transporter loss, closer to SLC52A3 riboflavin transporter deficiency than to dietary deficiency, and more
      severe than typical human nutritional depletion.
    evidence:
    - reference: PMID:26660539
      reference_title: Conditional (intestinal-specific) knockout of the riboflavin transporter-3 (RFVT-3) impairs riboflavin absorption.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All RFVT-3 cKO mice were found to be RF deficient and showed a significant growth and development retardation"
      explanation: Failed absorption produces systemic riboflavin deficiency.
- name: Riboflavin-deficient gestating sows
  species: Pig
  genotype: Commercial organic sows on feed with 1.25 mg/kg riboflavin
  publication: PMID:37143142
  description: >-
    Naturally occurring deficiency on two organic farms caused premature farrowing, stillbirth and 60-100% intra-litter
    mortality, which stopped after B-complex supplementation one month before farrowing.
  modeled_mechanisms:
  - target: Systemic Riboflavin Insufficiency
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    limitations: >-
      Diagnosis was ex juvantibus from feed analysis and response to a B-complex supplement; the reproductive phenotype
      has no documented counterpart in human nutritional deficiency.
    evidence:
    - reference: PMID:37143142
      reference_title: Premature farrowing and stillbirths in two organic sow farms due to riboflavin deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Riboflavin levels were very low specifically 1.25 mg/kg of diet (3.75 mg/kg of diet is the NRC minimum recommended level)."
      explanation: Naturally occurring dietary riboflavin deficiency in pigs.

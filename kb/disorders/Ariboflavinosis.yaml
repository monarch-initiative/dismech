biochemical:
- name: Erythrocyte glutathione reductase activation coefficient
  presence: INCREASED
  context: >-
    Ratio of FAD-stimulated to basal red-cell glutathione reductase activity; higher values mean lower riboflavin status.
    Commonly used cut-offs are 1.26 or below optimal, 1.27-1.39 suboptimal and 1.40 or above deficient, but methods
    and thresholds are not fully standardized. The assay is insensitive in G6PD deficiency, where erythrocyte
    pyridoxamine phosphate oxidase activity has been proposed as an alternative.
  evidence:
  - reference: PMID:37988268
    reference_title: Protocol for measuring erythrocyte glutathione reductase activity coefficient to assess riboflavin status.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The activity coefficient of erythrocyte glutathione reductase (EGRAC), a FAD-dependent enzyme, is a biomarker of riboflavin status."
    explanation: EGRAC is the functional biomarker of riboflavin status.
  - reference: PMID:36264281
    reference_title: "Vitamin B-6 and riboflavin, their metabolic interaction, and relationship with MTHFR genotype in adults aged 18-102 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to suboptimal (EGRac: 1.27-1.39), to deficient (EGRac"
    explanation: Gives the suboptimal EGRAC band used to stage riboflavin status.
  - reference: PMID:19740970
    reference_title: "Erythrocyte pyridoxamine phosphate oxidase activity: a potential biomarker of riboflavin status?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, this assay is insensitive to poor riboflavin status in subjects with glucose-6-phosphate dehydrogenase (G6PD) deficiency."
    explanation: States the G6PD limitation of the EGRAC assay.
  reference_ranges:
  - population: adults
    notes: EGRAC is a dimensionless ratio and has no LOINC code in the term cache.
    interpretation_bands:
    - name: Optimal
      upper_bound: 1.27
      abnormal_flag: NORMAL
    - name: Suboptimal
      lower_bound: 1.27
      upper_bound: 1.4
      abnormal_flag: HIGH
      severity: MILD
    - name: Deficient
      lower_bound: 1.4
      abnormal_flag: HIGH
      severity: MODERATE
    evidence:
    - reference: PMID:36264281
      reference_title: "Vitamin B-6 and riboflavin, their metabolic interaction, and relationship with MTHFR genotype in adults aged 18-102 years."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "to suboptimal (EGRac: 1.27-1.39), to deficient (EGRac"
      explanation: Source of the three EGRAC status categories.
environmental:
- name: Inadequate dietary riboflavin intake
  description: >-
    Diets low in milk and dairy products, meat, fish and dark-green vegetables. Milk and dairy are the main source in
    Western diets.
  exposure_term:
    preferred_term: low riboflavin intake
    modifier: DECREASED
    term:
      id: ECTO:0900137
      label: exposure to riboflavin via ingestion
  evidence:
  - reference: PMID:6493112
    reference_title: Riboflavin status of adolescents in southern China. Average intake of riboflavin and clinical findings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings were consistent with the low intake of riboflavin."
    explanation: Clinical signs in adolescents matched an average intake of 0.45 mg/day.
  - reference: PMID:12791609
    reference_title: Riboflavin (vitamin B-2) and health.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Riboflavin is unique among the water-soluble vitamins in that milk and dairy products make the greatest contribution to its intake in Western diets."

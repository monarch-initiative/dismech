    reference_title: "Impact of the MTHFR C677T polymorphism on one-carbon metabolites: Evidence from a randomised trial of riboflavin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In response to riboflavin, SAM (P = 0.008) and cystathionine (P = 0.045) concentrations increased, with no responses in other one-carbon metabolites observed."
    explanation: Randomized riboflavin supplementation raised S-adenosylmethionine in MTHFR 677TT adults.
  downstream:
  - target: Hyperhomocystinemia
    causal_link_type: DIRECT
    description: Reduced MTHFR flux limits homocysteine remethylation.
    evidence:

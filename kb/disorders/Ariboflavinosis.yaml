genetic:
- name: MTHFR
  gene_term:
    preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  relationship_type: MODIFIER
  notes: >-
    Not a cause of ariboflavinosis. Homozygosity for the common MTHFR c.665C>T (historically 677C>T, rs1801133)
    variant makes one-carbon metabolism, plasma pyridoxal 5'-phosphate and blood pressure more sensitive to low
    riboflavin status.
  evidence:
  - reference: PMID:36264281
    reference_title: "Vitamin B-6 and riboflavin, their metabolic interaction, and relationship with MTHFR genotype in adults aged 18-102 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest that riboflavin may be the limiting nutrient for maintaining vitamin B-6 status, particularly in individuals with the MTHFR 677TT genotype"
    explanation: The metabolic effect of low riboflavin status is greatest in MTHFR 677TT carriers.
  - reference: PMID:23608654
    reference_title: "Blood pressure in treated hypertensive individuals with the MTHFR 677TT genotype is responsive to intervention with riboflavin: findings of a targeted randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these results show that riboflavin supplementation targeted at hypertensive individuals with the MTHFR 677TT genotype can decrease BP more effectively than treatment with current antihypertensive drugs only"
    explanation: Genotype-specific blood pressure response to riboflavin.
treatments:
- name: Oral Riboflavin Supplementation
  description: >-
    Oral riboflavin corrects biochemical deficiency and the mucocutaneous signs; scrotal lesions resolved within three to
    six days on 15 mg/day, with tongue and lip signs resolving more slowly. In marginally deficient young women 2-4 mg/day
    for 8 weeks improved riboflavin status and hemoglobin. Coexisting B-vitamin deficiencies are common, so B-complex
    preparations are often used.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  target_mechanisms:
  - target: Systemic Riboflavin Insufficiency
    description: Restores riboflavin supply and flavocoenzyme saturation.
  evidence:
  - reference: PMID:6493112
    reference_title: Riboflavin status of adolescents in southern China. Average intake of riboflavin and clinical findings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scrotal lesions resolved within three to six days after the oral administration of riboflavin (15 mg/day); the resolution of tongue and lip signs progressed more slowly."
    explanation: Clinical signs resolved with oral riboflavin.
  - reference: PMID:21525198
    reference_title: Correcting a marginal riboflavin deficiency improves hematologic status in young women in the United Kingdom (RIBOFEM).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of a riboflavin supplement for 8 wk elicited a significant improvement in riboflavin status with a dose response (P < 0.0001)."
    explanation: Randomized trial showing dose-responsive correction of biochemical deficiency.
  - reference: PMID:21525198
    reference_title: Correcting a marginal riboflavin deficiency improves hematologic status in young women in the United Kingdom (RIBOFEM).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women in the lowest tertile of riboflavin status at baseline (EGRAC >1.65) showed a significantly greater increase in hemoglobin status in response to the supplement than did women in the first and second tertiles (P < 0.01)."
    explanation: Hemoglobin benefit was largest in the most deficient women.
  - reference: PMID:465434
    reference_title: Relationship between biochemical and clinical indices of B-vitamin deficiency. A study in rural school boys.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with B-complex vitamins (containing 4 mg riboflavin and 10 mg pyridoxine) daily for 1 month produced significant reduction in the prevalence of glossitis but had no effect on angular stomatitis."
    explanation: >-
      B-complex containing riboflavin reduced glossitis but did not clear angular stomatitis in one month, so not every
      oral sign responds to riboflavin.
animal_models:
- name: Dietary riboflavin-deficient rat
  species: Rat
  genotype: Wild-type F344, riboflavin-free or low-riboflavin diet
  publication: PMID:32458157
  description: >-
    Male F344 rats fed 0 or 0.06 mg/kg riboflavin develop ariboflavinosis and esophageal epithelial atrophy, reversed by
    riboflavin replenishment.
  modeled_mechanisms:
  - target: Mucocutaneous Epithelial Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    limitations: >-
      The abstract does not describe which signs constituted ariboflavinosis in the rats, and the esophageal atrophy has
      no established human counterpart.
    evidence:
    - reference: PMID:32458157
      reference_title: Dietary riboflavin deficiency induces ariboflavinosis and esophageal epithelial atrophy in association with modification of gut microbiota in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Riboflavin deficiency induced ariboflavinosis (R0.06 46.7%; R0 72%) and esophageal epithelial atrophy (R0.06 40%; R0 44%) in rats"
      explanation: Dietary deficiency induces epithelial lesions in rats.
- name: Diet-induced riboflavin-deficient mouse
  species: Mouse
  genotype: Wild-type, riboflavin-deficient diet
  publication: PMID:35738087
  description: >-
    Dietary riboflavin deficiency reduces retinal function and causes structural change in neural retina and retinal
    pigment epithelium, preceded by oxidative stress and lipid dysregulation; some changes persist after supplementation.
  modeled_mechanisms:
  - target: Cellular Oxidative Stress
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      Retinal dysfunction has not been documented in human nutritional ariboflavinosis, and the degree of depletion
      exceeds most human dietary exposure.
    evidence:
    - reference: PMID:35738087
      reference_title: Riboflavin deficiency leads to irreversible cellular changes in the RPE and disrupts retinal function through alterations in cellular metabolic homeostasis.
      supports: SUPPORT

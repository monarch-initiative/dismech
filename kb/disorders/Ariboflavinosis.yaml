      quote_role: REVIEW_SYNTHESIS
      snippet: "These cofactors are required by flavoproteins such as succinate dehydrogenase (Complex II), which participate in both the citric acid cycle and the mitochondrial electron transport chain, enabling adenosine triphosphate (ATP) production"

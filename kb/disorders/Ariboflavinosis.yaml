name: Ariboflavinosis
creation_date: "2026-10-16T11:45:41Z"
category: Nutritional
description: >-
  Acquired riboflavin (vitamin B2) deficiency. Riboflavin is the precursor of the flavocoenzymes flavin mononucleotide
  (FMN) and flavin adenine dinucleotide (FAD), and humans depend on a continuing dietary supply. Low intake (diets poor
  in milk, dairy, meat and fortified foods), malabsorption, chronic alcohol use and loss of riboflavin from parenteral
  nutrition lower systemic riboflavin, and with it FMN and FAD saturation of flavoproteins. The best characterized
  consequence is undersaturation of the FAD-dependent erythrocyte glutathione reductase, which is the basis of the
  diagnostic activation coefficient (EGRAC). Flavin depletion also limits FMN-dependent pyridoxal 5'-phosphate
  synthesis, the FAD-dependent folate enzyme MTHFR, mitochondrial energy metabolism and iron handling. Clinically
  severe deficiency, now largely confined to low-income settings, presents with cheilosis, angular stomatitis, magenta
  glossitis, seborrheic and scrotal dermatitis, occasional corneal vascularization and a normocytic anemia that can
  show erythroid hypoplasia. Biochemical deficiency without clinical signs is common worldwide, including in
  high-income countries. Signs resolve with oral riboflavin.
disease_term:
  preferred_term: ariboflavinosis
  term:
    id: MONDO:0004573
    label: ariboflavinosis
synonyms:
- riboflavin deficiency
- vitamin B2 deficiency
parents:
- Nutritional Deficiency Disease
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
references:
- reference: PMID:29262062
  title: Riboflavin Deficiency.
  tags:
  - StatPearls
notes: >-
  Scope is acquired (nutritional) riboflavin deficiency. Inherited disorders that lower flavin availability are separate
  entries with their own genes and are differentials rather than subtypes: riboflavin transporter deficiency
  (Brown-Vialetto-Van Laere syndrome, biallelic SLC52A2 or SLC52A3), riboflavin-responsive multiple acyl-CoA
  dehydrogenase deficiency (ETFDH, FLAD1), maternal riboflavin deficiency due to SLC52A1 (MONDO:0014013, the only MONDO
  child of this term) and hereditary glutathione reductase deficiency (GSR), in which red-cell glutathione reductase
  activity is not restored by FAD or riboflavin. MONDO also places this term under hereditary disease; there is no
  causative gene for the acquired condition. Most published prevalence figures measure biochemical deficiency (EGRAC
  at or above 1.40) rather than clinical ariboflavinosis, and clinical signs are rarely seen in isolation from other
  B-vitamin deficiencies, so per-sign frequencies among patients are not available.
pathophysiology:
- name: Systemic Riboflavin Insufficiency
  biological_scale: ORGANISM
  description: >-
    Riboflavin intake or absorption falls below requirement, so tissue riboflavin is depleted. Biochemical depletion
    appears within days of dietary deprivation because body stores are small.
  chemical_entities:
  - preferred_term: riboflavin
    term:
      id: CHEBI:17015
      label: riboflavin
    modifier: DECREASED
  evidence:
  - reference: PMID:12791609
    reference_title: Riboflavin (vitamin B-2) and health.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Biochemical signs of depletion arise within only a few days of dietary deprivation."
    explanation: Review stating that dietary deprivation depletes riboflavin status within days.
  - reference: PMID:41735095
    reference_title: Riboflavin Deficiency Is Highly Prevalent in Females and Children across High and Low/Middle Income Countries Worldwide.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Irish females, biomarker status declined progressively(P < 0.002) with decreasing quintiles of dietary riboflavin intakes"
    explanation: Population data showing riboflavin biomarker status falls with lower dietary intake.
  downstream:
  - target: FMN and FAD Cofactor Depletion
    causal_link_type: DIRECT
    description: Riboflavin is the only precursor of FMN and FAD, which are formed inside cells.
    evidence:
    - reference: PMID:29093349
      reference_title: Riboflavin Transporters RFVT/SLC52A Mediate Translocation of Riboflavin, Rather than FMN or FAD, across Plasma Membrane.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results strongly suggest that riboflavin, rather than FMN or FAD, passes through plasma membranes via hRFVTs."
      explanation: >-
        In transfected human cells only free riboflavin crosses the membrane, so intracellular FMN and FAD depend on the
        riboflavin supply.
- name: FMN and FAD Cofactor Depletion
  biological_scale: MOLECULAR
  description: >-
    Less riboflavin is converted by riboflavin kinase and FAD synthase into FMN and FAD, so flavoproteins that need these
    cofactors are left partly unsaturated. This affects enzymes of energy metabolism, antioxidant defence and the
    metabolism of vitamin B6, folate and niacin.
  chemical_entities:
  - preferred_term: FAD
    term:
      id: CHEBI:16238
      label: FAD
    modifier: DECREASED
  biological_processes:
  - preferred_term: FAD biosynthetic process
    term:
      id: GO:0006747
      label: FAD biosynthetic process
    modifier: DECREASED
  - preferred_term: FMN biosynthetic process
    term:
      id: GO:0009398
      label: FMN biosynthetic process
    modifier: DECREASED
  evidence:

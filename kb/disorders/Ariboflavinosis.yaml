- name: Reduced MTHFR Activity
  biological_scale: MOLECULAR
  description: >-
    Methylenetetrahydrofolate reductase uses FAD as its cofactor. The common thermolabile 677TT variant loses FAD more
    readily, so low riboflavin status impairs one-carbon metabolism mainly in TT homozygotes; riboflavin supplementation
    raises S-adenosylmethionine in this genotype.
  genes:
  - preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  molecular_functions:
  - preferred_term: methylenetetrahydrofolate reductase activity
    term:
      id: GO:0004489
      label: methylenetetrahydrofolate reductase [NAD(P)H] activity
    modifier: DECREASED

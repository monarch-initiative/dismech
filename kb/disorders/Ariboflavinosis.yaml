- name: Erythrocyte Glutathione Reductase FAD Undersaturation
  biological_scale: MOLECULAR
  description: >-
    The glutathione reductase apoenzyme in red cells is incompletely saturated with FAD, so basal activity is low and
    rises when FAD is added in vitro. The ratio of stimulated to basal activity (EGRAC) is the functional biomarker of
    riboflavin status. Activity is restored by riboflavin in vivo, which separates this acquired state from hereditary
    glutathione reductase deficiency.
  genes:
  - preferred_term: GSR
    term:
      id: hgnc:4623
      label: GSR
  molecular_functions:
  - preferred_term: glutathione reductase activity
    term:
      id: GO:0004362
      label: glutathione-disulfide reductase (NADPH) activity
    modifier: DECREASED
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:5794396
    reference_title: "Glutathione reductase: stimulation in normal subjects by riboflavin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of stimulation in vitro by flavin-adenine dinucleotide and in vivo by riboflavin was inversely proportional to dietary intake of riboflavin."
    explanation: Red-cell glutathione reductase undersaturation with FAD tracks low dietary riboflavin.
  downstream:
  - target: Reduced erythrocyte glutathione reductase activity
    causal_link_type: DIRECT
    description: Undersaturated enzyme gives low basal activity and a raised activation coefficient.
    evidence:
    - reference: PMID:5794396
      reference_title: "Glutathione reductase: stimulation in normal subjects by riboflavin supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stimulation of glutathione reductase activity of red cells of normal subjects occurred when they were given 5 milligrams of riboflavin daily for 8 days."
      explanation: Red-cell activity rises with riboflavin, showing that low activity reflected limited riboflavin.
  - target: Cellular Oxidative Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of flavin-dependent antioxidant capacity is followed by oxidative stress in animal models; the contribution of
      glutathione reductase specifically has not been isolated.
    evidence:
    - reference: PMID:37603429
      reference_title: Causes and Clinical Sequelae of Riboflavin Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "plays fundamental roles in energy metabolism, cellular antioxidant potential"
      explanation: Review attributes a role in cellular antioxidant potential to the flavocoenzymes.

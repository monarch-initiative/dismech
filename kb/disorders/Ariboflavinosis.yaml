    reference_title: Causes and Clinical Sequelae of Riboflavin Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Riboflavin, in its cofactor forms flavin adenine dinucleotide (FAD) and flavin mononucleotide (FMN), plays fundamental roles in energy metabolism, cellular antioxidant potential, and metabolic interactions with other micronutrients, including iron, vitamin B6, and folate."
    explanation: Review naming FMN and FAD as the active forms and the processes that depend on them.
  - reference: PMID:29093349
    reference_title: Riboflavin Transporters RFVT/SLC52A Mediate Translocation of Riboflavin, Rather than FMN or FAD, across Plasma Membrane.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FMN and FAD concentrations are regulated by riboflavin kinase and FAD synthase"
    explanation: Intracellular FMN and FAD are synthesized from riboflavin by riboflavin kinase and FAD synthase.

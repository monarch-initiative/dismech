      reference_title: Riboflavin supplementation and biomarkers of cardiovascular disease in the elderly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "In this elderly group, we found that 10 mg/day oral riboflavin supplementation lowered plasma homocysteine concentrations in subjects with low riboflavin status."
      explanation: Homocysteine fell when low riboflavin status was corrected, implying that low status had raised it.
  - target: Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In MTHFR 677TT homozygotes, raising riboflavin status lowers systolic blood pressure; the link between one-carbon
      metabolism and blood pressure is not established.
    evidence:
    - reference: PMID:23608654
      reference_title: "Blood pressure in treated hypertensive individuals with the MTHFR 677TT genotype is responsive to intervention with riboflavin: findings of a targeted randomized trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Correspondingly, an overall treatment effect of 5.6±2.6 mm Hg (P=0.033) in systolic BP was observed"

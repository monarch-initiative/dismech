      Independent cohort-derived group-level prevalence estimate.
diagnosis:
- name: Electromyography
  description: >-
    Chronic neurogenic change on EMG - high-amplitude, long-duration polyphasic
    motor units - is the finding on which a diagnosis of neuronopathy rests.
    Note that HSPB8 is among the genes in which a mixed neurogenic and myopathic
    EMG pattern has been documented, so a myopathic component does not exclude
    the diagnosis.
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:36445400
    reference_title: "Early onset hereditary neuronopathies: an update on non-5q motor neuron diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cornerstone upon which a diagnosis of neuronopathy is pursued is the finding of chronic neurogenic changes on EMG, namely high-amplitude polyphasic motor units of long duration."
    explanation: >-
      States the EMG finding that anchors a neuronopathy diagnosis.
  - reference: PMID:36445400
    reference_title: "Early onset hereditary neuronopathies: an update on non-5q motor neuron diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the finding of mixed neurogenic and myopathic EMG pattern (documented in BICD2, HSPB1, HSPB8, VWA1, GNE, AGRN and ACTA1)"
    explanation: >-
      Names HSPB8 among the genes showing a mixed neurogenic and myopathic
      pattern, which is why that pattern does not exclude this diagnosis.
- name: Nerve Conduction Studies
  description: >-
    Motor nerve conduction shows a motor axonal pattern while sensory responses
    are preserved, which is what separates dHMN from the sensorimotor axonal
    Charcot-Marie-Tooth neuropathies.
  diagnosis_term:
    preferred_term: nerve conduction study
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:22028385
    reference_title: "The distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distal hereditary motor neuropathies (dHMN) comprise a heterogeneous group of diseases that share the common feature of a length-dependent predominantly motor neuropathy."
    explanation: >-
      Supports the motor half of the pattern - a length-dependent, predominantly
      motor neuropathy - that this study is used to establish.
  - reference: PMID:36445400
    reference_title: "Early onset hereditary neuronopathies: an update on non-5q motor neuron diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "slowly progressive length-dependent distal muscle weakness and atrophy, without sensory involvement"
    explanation: >-
      Supports the sensory half of the claim, which the preceding item does not
      reach: the absence of sensory involvement is what makes preserved sensory
      responses the expected finding.
- name: Multigene Panel Sequencing
  description: >-
    Molecular confirmation is by sequencing of the HMN gene panel. More than
    thirty genes are associated with HMN and most cases remain genetically
    unsolved, so a negative panel does not exclude the clinical diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38702287
    reference_title: "Distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than thirty genes are currently associated with HMNs, but around 60 to 70% of cases of dHMN remain uncharacterized genetically."
    explanation: >-
      Supports both the panel approach and the caveat that a negative result
      leaves the clinical diagnosis standing.
treatments:
- name: Supportive and Rehabilitative Care
  description: >-
    There is no disease-modifying therapy for dHMN2A. Management is supportive:
    physiotherapy, orthotic management of foot drop, and maintenance of mobility
    and function. This entry records the treatment category rather than a
    specific validated regimen because no trial evidence exists for this subtype
    in the sources curated here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
- name: Physical Therapy
  description: >-
    Exercise and stretching to preserve range of movement and delay contracture
    in the distal limbs.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
- name: Genetic Counseling
  description: >-
    Counseling for an autosomal dominant disorder with a 50% recurrence risk for
    the offspring of an affected individual, and predictive testing where the
    familial HSPB8 variant is known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
animal_models:
- name: Hspb8 Lys141Asn Knock-In Mouse
  species: Mouse
  genotype: Hspb8 c.421A>G (p.Lys141Asn) homozygous
  description: >-
    Transgenic mouse model carrying the human HSPB8 K141N founding variant.
    Homozygous mice show motor neuropathy phenotypes that mimic the human disease.
  modeled_mechanisms:
  - target: Length-Dependent Distal Motor Axon Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The knockin mouse model requires homozygosity to manifest disease, whereas
      the human disease is dominant and manifests in the heterozygous state. This
      represents a difference in genetic dosage requirement between the mouse model
      and the human condition.
  publication: PMID:39972648
  evidence:
  - reference: PMID:39972648
    reference_title: "RNA Interference Targeting Small Heat Shock Protein B8 Failed to Improve Distal Hereditary Motor Neuropathy in the Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used human induced pluripotent stem cells and the Hspb8 knock-in mouse model."
    explanation: >-
      Establishes the existence and use of the Hspb8 knock-in mouse model in the
      study.

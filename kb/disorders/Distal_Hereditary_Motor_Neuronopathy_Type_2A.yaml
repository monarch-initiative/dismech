name: Distal Hereditary Motor Neuronopathy Type 2A
creation_date: "2026-09-06T00:40:00Z"
category: Mendelian
synonyms:
- dHMN2A
- HMN2A
- neuronopathy, distal hereditary motor, type IIA
- HSPB8 neuronopathy, distal hereditary motor
- distal spinal muscular atrophy type 2A
description: >-
  Distal hereditary motor neuronopathy type 2A is an autosomal dominant,
  predominantly pure motor axonal neuropathy caused by heterozygous variants in
  HSPB8, which encodes the small heat shock protein HSPB8 (also called HSP22).
  Like the rest of the distal hereditary motor neuropathies, it produces slowly
  progressive, length-dependent distal limb weakness and wasting with little or
  no sensory involvement, and it is separated from axonal Charcot-Marie-Tooth
  disease clinically and electrophysiologically rather than by gene, since HSPB8
  is one of the genes reported on both sides of that boundary.

  Onset spans a wider range than the classic adolescent-to-adult dHMN picture.
  The HSPB8 form can present at birth with talipes and congenital hip dysplasia,
  followed by delayed acquisition of walking and then a comparatively mild
  course - a congenital presentation that distinguishes it from the allelic
  HSPB1 disease, in which none has been described. Deep tendon reflexes may be
  brisk rather than depressed, which is worth knowing for a disorder otherwise
  classified as a pure lower motor neuron neuropathy: it puts juvenile
  amyotrophic lateral sclerosis and hereditary spastic paraplegia into the
  differential.

  What distinguishes dHMN2A mechanistically is where the causal variants sit and
  what the protein normally does. The founding variants, K141N and K141E, target
  a single hot-spot lysine in the alpha-crystallin domain — the residue that is
  essential to the structural and functional integrity of the small heat shock
  protein alphaA-crystallin, and whose mutation in other small heat shock
  proteins causes other human disorders. HSPB8's day job is proteostatic: with
  the co-chaperone BAG3 it forms the sub-complex at the base of
  chaperone-assisted selective autophagy (CASA), the pathway that hands damaged
  and misfolded clients to Hsc70, has them ubiquitinated by CHIP, and routes
  them to autophagosomes via p62. So the hot-spot variants are curated here as a
  proteostasis lesion, and specifically as a toxic gain of function rather than
  a loss of a chaperone: they bind the partner small heat shock protein HSPB1
  more tightly than wild type does, and they promote intracellular aggregate
  formation in cultured cells. Both are acquired behaviours, which a null allele
  would not produce.

  Two limits on that chain are recorded deliberately. The step from aggregate
  formation to the degeneration of the longest motor axons is asserted by the
  field as the general dHMN mechanism class (protein misfolding and inclusion
  body formation) rather than demonstrated for K141 HSPB8 specifically in the
  sources curated here, and it is left as an uncited edge for that reason.
  Second, the CASA machinery itself is characterised in muscle and in
  BAG3-mutant cell models; that the same complex is the relevant one in the
  distal motor axon is an inference from the shared complex, not a measurement
  in patient motor neurons.

  Three nodes declare conformance to mechanism modules. The axon-degeneration
  node conforms to `peripheral_axonal_degeneration#Distal Axonal Degeneration
  and Demyelination`, as the three sibling dHMN entries do, but note that dHMN2A
  is a pure motor axonopathy: the module node's myelination and Schwann-cell
  annotations describe the demyelinating half of that node and are deliberately
  not copied here.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous HSPB8 missense variants segregate with the neuropathy. The
    founding report identified K141N in two pedigrees with distal hereditary
    motor neuropathy type II linked to chromosome 12q24.3 and K141E in two
    further families.
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two pedigrees with distal hereditary motor neuropathy type II linked to chromosome 12q24.3, we identified the same mutation (K141N) in small heat-shock 22-kDa protein 8 (encoded by HSPB8; also called HSP22)."
    explanation: >-
      Establishes the gene and the pedigree-based segregation that define this
      dominantly inherited subtype.
genetic:
- name: HSPB8
  gene_term:
    preferred_term: HSPB8
    term:
      id: hgnc:30171
      label: HSPB8
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous missense variants at the K141 hot-spot residue in the
    alpha-crystallin domain of HSPB8. K141N was found in two dHMN type II
    pedigrees and K141E in two smaller families; the same residue is essential to
    the structural and functional integrity of alphaA-crystallin, and its
    mutation in other small heat shock proteins produces other human disorders.
  variants:
  - name: K141N
    description: >-
      Missense substitution of the hot-spot lysine at codon 141 in the
      alpha-crystallin domain, found in two dHMN type II pedigrees linked to
      12q24.3.
  - name: K141E
    description: >-
      Second missense substitution at the same codon, found in two smaller
      families.
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a second mutation (K141E) in two smaller families. Both mutations target the same amino acid, which is essential to the structural and functional integrity of the small heat-shock protein alphaA-crystallin."
    explanation: >-
      Names the second allele at the same codon and states why that residue
      matters structurally, supporting a hot-spot rather than a scattered
      loss-of-function variant spectrum.
  - reference: PMID:22028385
    reference_title: "The distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative genes have implicated proteins with diverse functions such as protein misfolding (HSPB1, HSPB8, BSCL2), RNA metabolism (IGHMBP2, SETX, GARS), axonal transport (HSPB1, DYNC1H1, DCTN1) and cation-channel dysfunction (ATP7A and TRPV4) in motor-nerve disease."
    explanation: >-
      Places HSPB8 in the protein-misfolding class of dHMN genes, which is the
      mechanistic class this entry curates.
pathophysiology:
- name: HSPB8 Alpha-Crystallin Domain Hot-Spot Variant
  description: >-
    Heterozygous missense substitution of the K141 lysine in the alpha-crystallin
    domain of HSPB8. The two reported founding alleles, K141N and K141E, change
    the same positively charged residue, which is required for the structural and
    functional integrity of small heat shock proteins of this family.
  biological_scale: MOLECULAR
  downstream:
  - target: Increased HSPB8-HSPB1 Chaperone Binding
    causal_link_type: DIRECT
    description: >-
      The substituted residue changes how mutant HSPB8 engages its partner small
      heat shock protein.
    evidence:
    - reference: PMID:15122253
      reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Coimmunoprecipitation experiments showed greater binding of both HSPB8 mutants to the interacting partner HSPB1."
      explanation: >-
        Directly measures the altered interaction as a consequence of the two
        hot-spot substitutions, which is the edge asserted here.
  molecular_functions:
  - preferred_term: HSPB8 chaperone client handling
    term:
      id: GO:0044183
      label: protein folding chaperone
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    description: >-
      Curated as a toxic gain of function rather than haploinsufficiency. The
      mutant protein binds its partner small heat shock protein more avidly than
      wild type and drives aggregate formation, which is an acquired behaviour
      rather than an absent one; a null allele would not explain either
      observation.
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This positively charged residue, when mutated in other small heat-shock proteins, results in various human disorders."
    explanation: >-
      Supports treating the K141 position, rather than HSPB8 dosage generally, as
      the lesion this entry starts from.
  - reference: PMID:39972648
    reference_title: "RNA Interference Targeting Small Heat Shock Protein B8 Failed to Improve Distal Hereditary Motor Neuropathy in the Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing mutant Hspb8 (Lys141Asn) mimic the human disease, whereas mice lacking Hspb8 show no overt phenotype."
    explanation: >-
      Directly demonstrates that a null allele does not recapitulate the disease,
      supporting the gain-of-function interpretation over haploinsufficiency. The
      heterozygous K141N knockin model reproduces the human phenotype while the
      knockour does not.
- name: Increased HSPB8-HSPB1 Chaperone Binding
  description: >-
    Both K141 mutants coimmunoprecipitate more of the partner small heat shock
    protein HSPB1 than wild-type HSPB8 does, indicating an abnormally avid rather
    than an absent chaperone interaction.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Chaperone-Assisted Selective Autophagy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated as the mechanistic link between the altered small heat shock
      protein interaction and the CASA pathway that HSPB8 serves. The sources
      here establish HSPB8's role in that pathway and the mutants' altered
      binding; they do not measure CASA flux in K141 HSPB8 motor neurons, so the
      edge is marked indirect.
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coimmunoprecipitation experiments showed greater binding of both HSPB8 mutants to the interacting partner HSPB1."
    explanation: >-
      The measurement that defines this node.
- name: Impaired Chaperone-Assisted Selective Autophagy
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  description: >-
    HSPB8 works with the co-chaperone BAG3 as the sub-complex at the base of
    chaperone-assisted selective autophagy (CASA), which disposes of damaged and
    misfolded clients through Hsc70, the ubiquitin ligase CHIP and the autophagy
    adaptor p62. Disturbance of this complex is the proteostatic failure curated
    as the cellular lesion of dHMN2A. Note that the CASA machinery is
    characterised in muscle and in BAG3-mutant cell models rather than in
    K141-HSPB8 motor neurons.
  biological_scale: CELLULAR
  downstream:
  - target: Intracellular Protein Aggregate Formation
    causal_link_type: DIRECT
    description: >-
      Failure to clear misfolded clients leaves them to accumulate as aggregates.
    evidence:
    - reference: PMID:32472079
      reference_title: "BAG3 Pro209 mutants associated with myopathy and neuropathy relocate chaperones of the CASA-complex to aggresomes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mutant BAG3 trapped ubiquitinylated client proteins at the aggresome, preventing their efficient clearance"
      explanation: >-
        Shows the same CASA sub-complex failing to clear its ubiquitinated
        clients and those clients accumulating, which is the step this edge
        asserts. The lesion measured is in BAG3 rather than HSPB8, so this is
        support for the pathway step, not for the HSPB8 allele.
  biological_processes:
  - preferred_term: chaperone-assisted selective autophagy
    term:
      id: GO:0061684
      label: chaperone-mediated autophagy
    modifier: DECREASED
  - preferred_term: autophagic clearance of CASA clients
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  - preferred_term: protein ubiquitination by CHIP during CASA
    term:
      id: GO:0016567
      label: protein ubiquitination
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  evidence:
  - reference: PMID:20060297
    reference_title: "Chaperone-assisted selective autophagy is essential for muscle maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Stv and its mammalian ortholog BAG-3 coordinate the activity of Hsc70 and the small heat shock protein HspB8 during disposal that is initiated by the chaperone-associated ubiquitin ligase CHIP and the autophagic ubiquitin adaptor p62."
    explanation: >-
      Establishes HSPB8's normal role in the CASA pathway, which is what a
      hot-spot variant in that protein puts at risk.
  - reference: PMID:32472079
    reference_title: "BAG3 Pro209 mutants associated with myopathy and neuropathy relocate chaperones of the CASA-complex to aggresomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BAG3-HSPB8 is a sub-complex at the basis of a larger protein complex, known as the chaperone-assisted-selective-autophagy (CASA) complex."
    explanation: >-
      Names HSPB8 and BAG3 as the core of the CASA complex, supporting the
      identity of the pathway curated at this node.
- name: Intracellular Protein Aggregate Formation
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Expression of mutant HSPB8 promotes formation of intracellular aggregates in
    cultured cells. Protein aggregation and inclusion body formation is one of
    the recurring pathogenic mechanisms of the distal hereditary motor
    neuropathies as a group.
  biological_scale: CELLULAR
  downstream:
  - target: Length-Dependent Distal Motor Axon Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The sources curated here assert protein aggregation and inclusion body
      formation as a pathogenic mechanism of dHMN as a class. Cell-based evidence
      shows that K141 HSPB8 expression causes neurite degeneration in motor neurons
      with specificity to that cell type.
    evidence:
    - reference: PMID:20538880
      reference_title: "Mutant HSPB8 causes motor neuron-specific neurite degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In motor neurons, expression of both HSPB8 K141N and K141E mutations clearly resulted in neurite degeneration, as manifested by a reduction in number of neurites per cell, as well as in a reduction in average length of the neurites."
      explanation: >-
        Directly measures the consequence of K141 HSPB8 expression in motor neurons
        as neurite degeneration, supporting the pathway from the variant to the
        axonal lesion.
    - reference: PMID:20538880
      reference_title: "Mutant HSPB8 causes motor neuron-specific neurite degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While overt in motor neurons, these phenotypes were only very mildly present in sensory neurons and completely absent in cortical neurons."
      explanation: >-
        Demonstrates the cell-type selectivity of the degeneration phenotype,
        which is what motivates the length-dependence and selective motor neuron
        vulnerability of dHMN as a group.
  biological_processes:
  - preferred_term: cellular response to heat
    term:
      id: GO:0034605
      label: cellular response to heat
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of mutant HSPB8 in cultured cells promoted formation of intracellular aggregates."
    explanation: >-
      Directly demonstrates aggregate formation as a consequence of the causal
      variants.
  - reference: PMID:21902652
    reference_title: "Molecular genetics and mechanisms of disease in distal hereditary motor neuropathies: insights directing future genetic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include disruption of axonal transport, RNA processing defects, protein aggregation and inclusion body formation, disrupted calcium channel activity, and loss of neuroprotective signalling."
    explanation: >-
      Places protein aggregation among the established pathogenic mechanisms of
      dHMN, supporting the node's relevance to this disease group rather than
      only to a transfected cell line.
- name: Length-Dependent Distal Motor Axon Degeneration
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    Degeneration of the distal portions of the longest lower motor neuron axons,
    which is the lesion shared across the distal hereditary motor neuropathies
    and the reason weakness begins in the feet and progresses proximally.
  biological_scale: TISSUE
  downstream:
  - target: Distal muscle weakness
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36445400
      reference_title: "Early onset hereditary neuronopathies: an update on non-5q motor neuron diseases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hereditary motor neuropathies (HMN) were first defined as a group of neuromuscular disorders characterized by lower motor neuron dysfunction, slowly progressive length-dependent distal muscle weakness and atrophy, without sensory involvement."
      explanation: >-
        States lower motor neuron dysfunction and length-dependent distal
        weakness as one clinical entity, which is the edge drawn here.
  - target: Distal amyotrophy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15122253
      reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Distal hereditary motor neuropathies are pure motor disorders of the peripheral nervous system resulting in severe atrophy and wasting of distal limb muscles."
      explanation: >-
        Attributes the distal muscle atrophy to the motor neuropathy itself.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  cellular_components:
  - preferred_term: distal motor axon
    term:
      id: GO:0030424
      label: axon
  evidence:
  - reference: PMID:22028385
    reference_title: "The distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distal hereditary motor neuropathies (dHMN) comprise a heterogeneous group of diseases that share the common feature of a length-dependent predominantly motor neuropathy."
    explanation: >-
      Supports the length-dependent, predominantly motor character of the lesion
      curated at this node.

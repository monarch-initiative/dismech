  title: Integrated genomic, transcriptomic and metabolomic analysis reveals MDH2 mutation-induced metabolic disorder in recurrent focal segmental glomerulosclerosis
  description: Focal segmental glomerulosclerosis (FSGS) has an over 30% risk of recurrence after kidney transplantation (Ktx) and is associated with an extremely high risk of graft loss. However, mechanisms remain largely unclear. Thus, this study identifies novel genes related to the recurrence of FSGS (rFSGS). Whole genome-wide sequencing and next-generation RNA sequencing were used to identify the candidate mutant genes associated with rFSGS in peripheral blood mononuclear cells (PBMCs) from patients with biopsy-confirmed rFSGS after KTx.

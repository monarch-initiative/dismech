- name: FSGS7
  display_name: Focal segmental glomerulosclerosis 7 (PAX2)
  subtype_term:
    preferred_term: focal segmental glomerulosclerosis 7
    term:
      id: MONDO:0014451
      label: focal segmental glomerulosclerosis 7
  description: >-
    Autosomal dominant, adult-onset FSGS caused by heterozygous variants in the
    PAX2 transcription factor, arising without the overt extrarenal features of

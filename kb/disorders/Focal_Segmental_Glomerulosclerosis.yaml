    as a developmental transcription factor rather than on podocyte structure.
    The papillorenal (renal-coloboma) phenotype of PAX2 is curated in
    Renal_Coloboma_Syndrome; only the isolated adult-onset FSGS claim is made
    here.
  genes:
  - preferred_term: PAX2

  genes:
  - preferred_term: INF2
    term:
      id: hgnc:23791
      label: INF2
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:20023659
    reference_title: "Mutations in the formin gene INF2 cause focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we detected nine independent nonconservative missense mutations in INF2, which encodes a member of the formin family of actin-regulating proteins. These mutations, all within the diaphanous inhibitory domain of INF2, segregate with FSGS in 11 unrelated families and alter highly conserved amino acid residues."
    explanation: Establishes INF2 as the cause of dominant FSGS across 11 families, the concept MONDO curates as
      FSGS5.
- name: FSGS6
  display_name: Focal segmental glomerulosclerosis 6 (MYO1E)
  subtype_term:
    preferred_term: focal segmental glomerulosclerosis 6
    term:
      id: MONDO:0013589
      label: focal segmental glomerulosclerosis 6
  description: >-
    Autosomal recessive, childhood-onset, glucocorticoid-resistant FSGS caused by
    biallelic variants in MYO1E, a non-muscle class I myosin of the podocyte.
    Unlike the dominant actin-regulator subtypes, affected individuals are
    homozygous, and electron microscopy showed thickening and disorganisation of
    the glomerular basement membrane.
  genes:
  - preferred_term: MYO1E
    term:
      id: hgnc:7599
      label: MYO1E
  inheritance:
  - name: Autosomal recessive
  evidence:

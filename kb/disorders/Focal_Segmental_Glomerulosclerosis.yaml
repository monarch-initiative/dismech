- accession: massive:MSV000097297
  title: Pathogenesis of focal segmental glomerulosclerosis and minimal change disease
  description: Podocyte injury is the hallmark of both focal segmental glomerulosclerosis (FSGS) and minimal change disease (MCD) and is ultimately reflected in foot process effacement proteinuria. Triggers and pathogenic pathways leading to podocyte cytoskeleton rearrangements are however incompletely explained. Here, we aimed to contribute to the understanding of these pathways using tissue bottom-up proteomic profiling of laser capture micro dissected glomeruli from MCD and FSGS.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Focal Segmental Glomerulosclerosis"). Retrieved 2026-08-02.
notes: >-
  The `has_subtypes` list deliberately carries two axes, as the ADCA-I entry does.
  The first five rows are the clinicopathologic and etiologic classification
  (primary, secondary, genetic, collapsing, tip lesion) that clinical practice
  uses; the seven FSGS1-FSGS9 rows are the gene-defined members of MONDO's
  numbered series, and the Genetic FSGS row lists them as `children` so the
  relationship between the two axes is explicit rather than implied.

  MONDO's numbered series is not subtree-complete under this entry's term, and
  that is the main finding of the 2026-09-25 descendant enumeration. An OLS4 query
  for hierarchical descendants of MONDO:0100313 returns ten terms: the seven
  numbered FSGS concepts curated above, plus inherited focal segmental
  glomerulosclerosis (MONDO:0005363), primary focal segmental glomerulosclerosis
  (MONDO:0100324) and HIV-associated nephropathy (MONDO:0005798). The numbered
  terms all hang off MONDO:0005363 rather than off the root, which is why a
  root-keyed comparison can miss them. FSGS3 (CD2AP, MONDO:0011917) and FSGS4
  (APOL1, MONDO:0012931) are absent from that descendant set altogether: MONDO
  files both under inherited disease susceptibility (MONDO:0020573) with a
  `predisposes towards` relation to inherited FSGS. Both are recorded in
  `mappings.mondo_mappings` as related matches and their genes are curated in the
  `genetic` section with SUSCEPTIBILITY and RISK_FACTOR relationships, not as
  subtype rows. MONDO's placement and dismech's judgement agree here.

  HIV-associated nephropathy (MONDO:0005798) is a descendant of MONDO:0005363 in
  MONDO but is not given a subtype row: it is a viral nephropathy with its own
  aetiology, the acquired and collapsing patterns are already covered by the
  Secondary FSGS and Collapsing FSGS rows, and it has no causal gene edge of its
  own. MONDO classifying an infectious nephropathy as a form of *inherited*
  FSGS is a candidate upstream report.

  Claims left to the entries that own them: the papillorenal (renal-coloboma)
  phenotype of PAX2 is curated in Renal_Coloboma_Syndrome; the INF2 phenotype
  combining FSGS with Charcot-Marie-Tooth neuropathy is a separate MONDO concept
  (MONDO:0013758) and ClinGen curates INF2 as Definitive against that, not against
  FSGS; the NPHS1 and PLCE1 congenital and type-3 nephrotic syndromes, the COL4A3,
  COL4A4 and COL4A5 Alport phenotypes, the LMX1B nail-patella phenotype and the
  WT1 Denys-Drash phenotype all have their own entries or MONDO concepts and are
  not curated as FSGS subtypes here, even though several of them can show an FSGS
  lesion.

  ClinGen's Glomerulopathy Gene Curation Expert Panel has curated far fewer of
  these genes than the literature covers. Against the root term MONDO:0100313 it
  records only FAT1 (Strong) and SYNPO (Limited); against the numbered concepts it
  records PAX2-FSGS7, CRB2-FSGS9, CD2AP-FSGS3 and APOL1-FSGS4 as Definitive and
  CD2AP-inherited FSGS as Moderate. It has no assertion for ACTN4, TRPC6, MYO1E or
  ANLN against any FSGS concept, so the causal claims for those four rest on the
  cited primary literature. Read from the ClinGen Gene-Disease Validity download of
  2026-09-25.

  FAT1 and SYNPO are the two curated genes that reach no pathophysiology node.
  Their only evidence on this entry is the ClinGen validity row, which states the
  classification but not a mechanism, so wiring them would need literature this
  pass did not cover.

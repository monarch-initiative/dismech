    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, exome sequencing in members of an index family with dominant FSGS revealed a nonconservative, disease-segregating variant in the PAX2 transcription factor gene.
    explanation: Identifies the segregating PAX2 variant in the index dominant-FSGS family.
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

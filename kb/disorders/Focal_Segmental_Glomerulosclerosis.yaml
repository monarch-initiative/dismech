    reference_title: MYO1E mutations and childhood familial focal segmental glomerulosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two mutations (A159P and Y695X) in MYO1E, which encodes a nonmuscle class I myosin, myosin 1E (Myo1E).
    explanation: Identifies the two MYO1E alleles behind this subtype.
  - reference: PMID:21756023
    reference_title: MYO1E mutations and childhood familial focal segmental glomerulosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYO1E mutations are associated with childhood-onset, glucocorticoid-resistant focal segmental glomerulosclerosis.

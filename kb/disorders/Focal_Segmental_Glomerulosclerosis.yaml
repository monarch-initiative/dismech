name: Focal Segmental Glomerulosclerosis
creation_date: "2026-04-13T17:56:50Z"
category: Complex
description: >
  Focal segmental glomerulosclerosis (FSGS) is a histopathologic pattern of
  podocyte-driven glomerular injury rather than a single molecularly uniform
  disease. The broad MONDO root term encompasses primary, monogenic,
  maladaptive/secondary, viral, drug-associated, and collapsing forms that
  converge on proteinuria, segmental glomerular scarring, and progressive
  kidney dysfunction. The gene section below therefore highlights representative
  monogenic FSGS subsets rather than implying that the entire heterogeneous
  root is explained by a single-gene mechanism.

  The gene-defined subtypes fall into four mechanistic groups rather than one.
  ACTN4, INF2 and ANLN act on the podocyte actin cytoskeleton and MYO1E is a
  podocyte class I myosin; NPHS2, CRB2 and CD2AP act at the slit diaphragm and
  podocyte apico-basal polarity; TRPC6 is a podocyte cation channel; and PAX2 is
  a developmental transcription factor, the only gene here whose lesion is
  transcriptional. APOL1 is a common recessive risk genotype rather than a
  Mendelian cause and reaches the podocyte through monovalent cation flux.
disease_term:
  preferred_term: Focal Segmental Glomerulosclerosis
  term:
    id: MONDO:0100313
    label: focal segmental glomerulosclerosis
parents:
- Glomerular Diseases
- Nephrotic Syndrome
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0011917
      label: focal segmental glomerulosclerosis 3, susceptibility to
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      A member of MONDO's numbered focal segmental glomerulosclerosis series by
      label, but not a subclass of focal segmental glomerulosclerosis in MONDO:
      it is a child of inherited disease susceptibility (MONDO:0020573) with a
      `predisposes towards` relation to inherited focal segmental
      glomerulosclerosis. Recorded as a related match, not a narrow one, because
      it denotes a susceptibility rather than a narrower disease; the CD2AP
      relationship itself is curated in the `genetic` section as SUSCEPTIBILITY.
  - term:
      id: MONDO:0012931
      label: focal segmental glomerulosclerosis 4, susceptibility to
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      As for focal segmental glomerulosclerosis 3, this is a susceptibility
      concept that `predisposes towards` inherited focal segmental
      glomerulosclerosis rather than a subclass of it. The APOL1 relationship is
      curated in the `genetic` section as RISK_FACTOR.

has_subtypes:
- name: Primary FSGS
  subtype_term:
    preferred_term: primary focal segmental glomerulosclerosis
    term:
      id: MONDO:0100324
      label: primary focal segmental glomerulosclerosis
  description: >
    Idiopathic or presumed immune-mediated FSGS with no clear adaptive,
    infectious, drug-related, or inherited driver. Circulating permeability
    factors and podocyte-directed autoantibodies are implicated, and
    post-transplant recurrence risk is highest in this subtype.
- name: Secondary FSGS
  description: >
    FSGS arising as an acquired or maladaptive response to another stressor,
    such as obesity, reduced nephron mass, reflux nephropathy, drugs, or
    viral infection.
- name: Genetic FSGS
  subtype_term:
    preferred_term: inherited focal segmental glomerulosclerosis
    term:
      id: MONDO:0005363
      label: inherited focal segmental glomerulosclerosis
  description: >
    Monogenic or syndromic FSGS caused by variants affecting podocyte
    structure, slit diaphragm integrity, or glomerular development.
    Recurrence after kidney transplantation is usually lower than in primary
    FSGS, but is not uniformly zero across all genetic etiologies.
    MONDO:0005363 is the term that actually parents the numbered
    "focal segmental glomerulosclerosis N" series, which is listed below as
    children of this row.
  children:
  - FSGS1
  - FSGS2
  - FSGS5
  - FSGS6
  - FSGS7
  - FSGS8
  - FSGS9
- name: Collapsing FSGS
  description: >
    Severe morphologic variant with segmental or global collapse of the
    glomerular tuft and marked podocyte hypertrophy/hyperplasia. Often occurs
    in the setting of viral infection, interferon exposure, or other intense
    podocyte stressors.

- name: Tip Lesion Variant FSGS
  description: >
    Morphologic variant characterized by adhesion of the tuft to Bowman's capsule
    at the tip of a glomerular lobe. Can occur in both primary and secondary FSGS,
    including in association with autoimmune systemic diseases such as relapsing
    polychondritis. May respond well to corticosteroid therapy.

- name: FSGS1
  display_name: Focal segmental glomerulosclerosis 1 (ACTN4)
  subtype_term:
    preferred_term: focal segmental glomerulosclerosis 1
    term:
      id: MONDO:0011303
      label: focal segmental glomerulosclerosis 1
  description: >-
    Autosomal dominant FSGS caused by missense variants in ACTN4, encoding the
    actin-filament crosslinking protein alpha-actinin-4. The mutant protein binds
    F-actin more tightly than wild type, so the lesion is at the podocyte actin
    cytoskeleton. MONDO also files this concept under familial idiopathic
    steroid-resistant nephrotic syndrome.
  genes:
  - preferred_term: ACTN4
    term:
      id: hgnc:166
      label: ACTN4
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:10700177
    reference_title: "Mutations in ACTN4, encoding alpha-actinin-4, cause familial focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present evidence implicating mutations in the gene encoding alpha-actinin-4 (ACTN4; ref. 2), an actin-filament crosslinking protein, as the cause of disease in three families with an autosomal dominant form of FSGS."
    explanation: Establishes ACTN4 as the cause of dominant familial FSGS, the concept MONDO curates as FSGS1.
- name: FSGS2
  display_name: Focal segmental glomerulosclerosis 2 (TRPC6)
  subtype_term:
    preferred_term: focal segmental glomerulosclerosis 2
    term:
      id: MONDO:0011390
      label: focal segmental glomerulosclerosis 2
  description: >-
    Autosomal dominant FSGS caused by gain-of-function missense variants in
    TRPC6, a cation channel highly expressed in podocytes, which increase
    podocyte calcium influx.
  genes:
  - preferred_term: TRPC6
    term:
      id: hgnc:12338
      label: TRPC6
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:15879175
    reference_title: "A mutation in the TRPC6 cation channel causes familial focal segmental glomerulosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that a large family with hereditary FSGS carries a missense mutation in the TRPC6 gene on chromosome 11q, encoding the ion-channel protein transient receptor potential cation channel 6 (TRPC6)."
    explanation: Establishes TRPC6 as the cause of hereditary FSGS, the concept MONDO curates as FSGS2.
- name: FSGS5
  display_name: Focal segmental glomerulosclerosis 5 (INF2)
  subtype_term:
    preferred_term: focal segmental glomerulosclerosis 5
    term:
      id: MONDO:0013191
      label: focal segmental glomerulosclerosis 5
  description: >-
    Autosomal dominant FSGS caused by missense variants clustered in the
    diaphanous inhibitory domain of INF2, a formin-family actin regulator. The
    separate INF2 phenotype combining FSGS with Charcot-Marie-Tooth neuropathy is
    curated by MONDO as Charcot-Marie-Tooth disease dominant intermediate E
    (MONDO:0013758), which is the concept ClinGen's Charcot-Marie-Tooth panel
    classifies as Definitive for INF2; no claim about that phenotype is made on

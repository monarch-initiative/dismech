- name: MYO1E
  association: Causative in monogenic FSGS
  relationship_type: CAUSATIVE
  subtype: FSGS6
  gene_term:
    preferred_term: MYO1E
    term:
      id: hgnc:7599
      label: MYO1E
  inheritance:
  - name: Autosomal recessive
  notes: >-
    Biallelic MYO1E variants cause childhood-onset, glucocorticoid-resistant
    FSGS. MYO1E is a non-muscle class I myosin normally expressed in glomerular
    podocytes; the A159P allele mislocalises in transfected cells and the Y695X
    allele removes the calmodulin-binding and tail domains. The ClinGen
    Gene-Disease Validity download of 2026-09-25 contains no MYO1E assertion.
  evidence:
  - reference: PMID:21756023
    reference_title: MYO1E mutations and childhood familial focal segmental glomerulosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations in MYO1E segregated with focal segmental glomerulosclerosis in two independent pedigrees (the index family and Family 2). Patients were homozygous for the mutations and did not have a response to glucocorticoid therapy.
    explanation: Establishes recessive segregation in two independent pedigrees and the steroid-resistant course.
  - reference: PMID:21756023
    reference_title: MYO1E mutations and childhood familial focal segmental glomerulosclerosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection studies revealed abnormal subcellular localization and function of the A159P-Myo1E mutant.
    explanation: Functional support that the A159P allele is deleterious.

- name: PAX2
  association: Causative in adult-onset dominant FSGS without extrarenal features
  relationship_type: CAUSATIVE
  subtype: FSGS7
  gene_term:
    preferred_term: PAX2
    term:
      id: hgnc:8616
      label: PAX2
  inheritance:
  - name: Autosomal dominant
  notes: >-
    PAX2 is a developmental transcription factor, so this is the one gene on this
    entry whose FSGS mechanism is transcriptional rather than structural. The
    reported FSGS-associated variants perturb DNA binding and transactivation or
    increase repressor activity. ClinGen's Glomerulopathy Gene Curation Expert
    Panel classifies PAX2-FSGS7 (MONDO:0014451) as Definitive with autosomal
    dominant inheritance, read from the Gene-Disease Validity download of
    2026-09-25. The papillorenal syndrome phenotype of PAX2 is curated in
    Renal_Coloboma_Syndrome and is not claimed here.
  evidence:
  - reference: PMID:24676634
    reference_title: Mutations in PAX2 associate with adult-onset FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing in probands of a familial FSGS cohort revealed seven rare and private heterozygous single nucleotide substitutions (4% of individuals).
    explanation: Quantifies the share of a familial FSGS cohort carrying rare heterozygous PAX2 variants.

- name: ANLN
  association: Causative in monogenic FSGS
  relationship_type: CAUSATIVE
  subtype: FSGS8
  gene_term:
    preferred_term: ANLN
    term:
      id: hgnc:14082
      label: ANLN
  inheritance:
  - name: Autosomal dominant
  notes: >-
    ANLN encodes anillin, an F-actin binding protein, so this subtype belongs to
    the podocyte actin-cytoskeleton group alongside ACTN4 and INF2. Anillin is
    upregulated in podocytes in FSGS biopsies. The ClinGen Gene-Disease Validity
    download of 2026-09-25 contains no ANLN assertion.
  evidence:
  - reference: PMID:24676636
    reference_title: Mutations in the gene that encodes the F-actin binding protein anillin cause FSGS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a combination of genome-wide linkage studies and whole-exome sequencing in a kindred with familial FSGS, we identified a missense mutation R431C in anillin (ANLN), an F-actin binding cell cycle gene, as a cause of FSGS.
    explanation: Establishes ANLN as a cause of familial FSGS and names the protein's actin-binding role.

- name: CRB2
  association: Causative in recessive podocytopathy presenting as steroid-resistant nephrotic syndrome with FSGS
  relationship_type: CAUSATIVE
  subtype: FSGS9
  gene_term:
    preferred_term: CRB2
    term:
      id: hgnc:18688
      label: CRB2
  inheritance:
  - name: Autosomal recessive
  notes: >-
    CRB2 is a conserved regulator of epithelial apico-basal polarity, and the
    mechanism is loss of podocyte polarity rather than a primary
    actin-cytoskeleton defect. The defining report frames the phenotype as
    steroid-resistant nephrotic syndrome; MONDO curates the concept as focal
    segmental glomerulosclerosis 9, and ClinGen's Glomerulopathy Gene Curation
    Expert Panel classifies CRB2-MONDO:0014539 as Definitive with autosomal
    recessive inheritance, read from the Gene-Disease Validity download of
    2026-09-25.
  evidence:
  - reference: PMID:25557779
    reference_title: Defects of CRB2 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By homozygosity mapping and whole exome sequencing, we here identify recessive mutations in Crumbs homolog 2 (CRB2) in four different families affected by SRNS.
    explanation: Establishes recessive CRB2 variants in four families as the cause of this subtype.
  - reference: PMID:25557779
    reference_title: Defects of CRB2 cause steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By characterization of a loss-of-function mutation in zebrafish crb2b, we now show that zebrafish crb2b is required for podocyte foot process arborization, slit diaphragm formation, and proper nephrin trafficking.
    explanation: Zebrafish loss of function supplies the mechanism by which CRB2 loss damages the podocyte.

- name: APOL1
  association: Recessive risk genotype, not a Mendelian FSGS subtype
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: APOL1
    term:
      id: hgnc:618
      label: APOL1
  notes: >-
    Two APOL1 renal-risk alleles raise FSGS risk substantially in people of
    recent African ancestry, but the genotype is common in that population and
    most carriers never develop kidney disease, so this is a susceptibility
    relationship rather than a Mendelian cause. MONDO models it the same way:
    "focal segmental glomerulosclerosis 4, susceptibility to" (MONDO:0012931) is
    a child of inherited disease susceptibility with a `predisposes towards`
    relation to inherited FSGS, not a subclass of focal segmental
    glomerulosclerosis, and is deliberately not given a `has_subtypes` row on
    this entry. ClinGen's Glomerulopathy Gene Curation Expert Panel classifies
    APOL1-MONDO:0012931 as Definitive with autosomal recessive inheritance, read
    from the Gene-Disease Validity download of 2026-09-25; that classification is
    about the susceptibility concept, not about a monogenic FSGS.
  evidence:
  - reference: PMID:21997394
    reference_title: APOL1 genetic variants in focal segmental glomerulosclerosis and HIV-associated nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a recessive model, APOL1 variants conferred seventeenfold higher odds (95% CI 11 to 26) for focal segmental glomerulosclerosis (FSGS) and twenty-nine-fold higher odds (95% CI 13 to 68) for HIV-associated nephropathy (HIVAN).
    explanation: Quantifies the recessive risk effect that makes this a risk genotype rather than a Mendelian cause.

- name: CD2AP
  association: Susceptibility allele reported in idiopathic FSGS; haploinsufficiency modeled in mice
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CD2AP
    term:
      id: hgnc:14258
      label: CD2AP
  notes: >-
    CD2AP links nephrin and podocin at the slit diaphragm, and CD2AP-null mice
    develop congenital nephrotic syndrome. The human claim rests on
    single-allele-ablating variants found in 2 of 30 African-American patients
    with idiopathic FSGS, and the accompanying Lancet commentary states plainly
    that the association could be accidental. MONDO models the concept as "focal
    segmental glomerulosclerosis 3, susceptibility to" (MONDO:0011917), a child
    of inherited disease susceptibility that `predisposes towards` inherited
    FSGS rather than a subclass of FSGS, so it gets no `has_subtypes` row here.
    ClinGen's Glomerulopathy Gene Curation Expert Panel classifies
    CD2AP-MONDO:0011917 as Definitive (autosomal recessive) and CD2AP-inherited
    FSGS (MONDO:0005363) as only Moderate (autosomal dominant), read from the
    Gene-Disease Validity download of 2026-09-25; the split between those two
    classifications is why this record is SUSCEPTIBILITY rather than CAUSATIVE.
  evidence:
  - reference: PMID:14643126
    reference_title: CD2-associated protein and glomerular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These researchers found that 2 of 30 African-American patients with idiopathic focal segmental glomerulosclerosis had a CD2AP mutation that ablated expression of one allele.
    explanation: The whole of the original human genetic evidence for CD2AP in FSGS; this commentary restates the
      primary report rather than producing the finding.
  - reference: PMID:14643126
    reference_title: CD2-associated protein and glomerular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Further studies should address the normal distribution of the CD2AP heterozygous mutation in different ethnic populations, because the association with human idiopathic focal segmental glomerulosclerosis could be accidental.
    explanation: The commentary's own caution about the CD2AP-FSGS association, which is why this is recorded as
      a susceptibility rather than a causative relationship.

- name: Basal Ganglia and Brainstem Neuronal Injury
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The striatum, globus pallidus, substantia nigra and brainstem are the
    structures most consistently damaged, giving the bilateral symmetrical
    signal change that defines the Leigh pattern on MRI. Neuropathology in the
    fatal case showed neuronal loss with Purkinje cell depletion. This is the
    lesion that produces the movement disorder, and it is where the disease is
    least recoverable.
  evidence:
  - reference: PMID:37861028
    reference_title: "Combined Oxidative Phosphorylation Deficiency Type-13 with Perinatal
      Presentation: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral and symmetrical lesions in globi pallidi, compatible with
      Leigh"
    explanation: Documents the bilateral symmetrical basal ganglia lesion in a genetically
      confirmed patient.
  - reference: PMID:33812062
    reference_title: "Crystallographic modeling of the PNPT1:c.1453A>G variant as a
      cause of mitochondrial dysfunction and autosomal recessive deafness; expanding
      the neuroimaging and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "delayed myelination during infancy, progressive basal ganglia atrophy,

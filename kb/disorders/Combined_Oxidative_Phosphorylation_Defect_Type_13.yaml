name: Combined Oxidative Phosphorylation Defect Type 13
creation_date: "2026-09-02T13:40:00Z"
category: Mendelian
disease_term:
  preferred_term: Combined oxidative phosphorylation defect type 13
  term:
    id: MONDO:0013977
    label: combined oxidative phosphorylation defect type 13
parents:
- Mitochondrial Disease
synonyms:
- COXPD13
- combined oxidative phosphorylation deficiency 13
- combined oxidative phosphorylation deficiency type 13
- PNPT1 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in PNPT1
description: >-
  Combined oxidative phosphorylation defect type 13 (COXPD13, OMIM 614932) is an
  autosomal recessive mitochondrial disease caused by biallelic variants in
  PNPT1, which encodes polyribonucleotide nucleotidyltransferase 1 - the
  mitochondrial polynucleotide phosphorylase, PNPase. PNPase is a homotrimeric
  3'-5' phosphorolytic exoribonuclease. It sits predominantly in the
  mitochondrial intermembrane space, where it is required for targeting a set of
  small nuclear-encoded RNAs into the organelle, and a fraction of it reaches the
  matrix, where it partners the helicase SUV3 in the mitochondrial RNA
  degradosome.

  The disease-causing alleles are hypomorphic missense substitutions, and several
  of them break the trimer: a patient allele can leave PNPase as a catalytically
  crippled dimer, or lock the enzyme in a conformation that cannot process RNA.
  Because a functional PNPase is needed both to import small RNAs and to process
  and clear mitochondrial transcripts, losing it degrades mitochondrial gene
  expression from two directions at once. Mitochondrial translation slows, and
  the respiratory-chain complexes that depend on mtDNA-encoded subunits -
  complexes I, III and IV, and in some tissues V - fall together, while complex
  II, built entirely from nuclear-encoded subunits, is relatively spared. That is
  the "combined" of the name.

  Clinically this is an infantile encephalomyopathy: hypotonia, a hyperkinetic
  movement disorder (choreoathetosis and dystonia), developmental delay or
  regression, seizures, sensorineural hearing loss, and visual impairment, with
  elevated lactate as an inconstant biochemical clue. Neuroimaging most often
  shows bilateral basal ganglia lesions in a Leigh pattern, but delayed
  myelination, leukoencephalopathy and a normal MRI have all been reported.
  Severity ranges from a static severe encephalopathy through progressive Leigh
  syndrome with death in early childhood to adult survivors. About fifteen to
  twenty-four patients had been reported worldwide by the most recent counts.

  A second mechanism has been demonstrated in PNPT1 deficiency and is not simply
  a byproduct: failing degradosome function lets mitochondrial double-stranded
  RNA accumulate and escape into the cytosol, where MDA5 sensing drives a type I
  interferon response. Some PNPT1 patients therefore present as an
  Aicardi-Goutieres-like interferonopathy with cystic leukoencephalopathy. How
  much of the classical COXPD13 phenotype the interferon arm contributes is not
  settled, and is recorded here as an open question rather than asserted.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported COXPD13 patient carries two PNPT1 alleles - homozygous
    missense substitutions in consanguineous families, or compound heterozygous
    pairs in outbred ones, with each parent heterozygous for one allele. No
    patient with a biallelic null genotype has been described, and constitutive
    Pnpt1 knockout is embryonic lethal in the mouse, so living patients are
    expected to retain residual PNPase function.

    Note that heterozygous PNPT1 variants are not silent: truncating alleles in
    the S1 domain cause dominantly inherited spinocerebellar ataxia type 25, a
    separate entity from this recessive disease.
  evidence:
  - reference: PMID:23084291
    reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
      impairs RNA import into mitochondria and causes respiratory-chain deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in two siblings, born to consanguineous parents, with
      severe encephalomyopathy, choreoathetotic movements, and combined respiratory-chain
      defects allowed us to identify a homozygous PNPT1 missense mutation (c.1160A>G)"
    explanation: The founding report, showing homozygosity for a PNPT1 missense allele
      in affected siblings of consanguineous parents.
  - reference: PMID:31752325
    reference_title: "Clinical Spectrum and Functional Consequences Associated with
      Bi-Allelic Pathogenic PNPT1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic pathogenic PNPT1 variants cause heterogeneous clinical phenotypes
      affecting multiple organs without any established genotype-phenotype correlations."
    explanation: States the biallelic requirement across the whole reported cohort,
      and that genotype does not predict phenotype.
genetic:
- name: PNPT1
  gene_term:
    preferred_term: PNPT1
    term:
      id: hgnc:23166
      label: PNPT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    PNPT1 encodes the human polynucleotide phosphorylase, a 3'-5' phosphorolytic
    exoribonuclease whose catalytically active form is a trimer. Each protomer
    carries two RNase PH domains joined by an alpha-helical domain plus KH and S1
    RNA-binding domains, and an N-terminal targeting sequence directs the protein
    to mitochondria. Disease alleles are missense and act by several distinct
    structural routes rather than by simple loss of expression.

    PNPT1 is unusual among mitochondrial disease genes in carrying three separate
    inherited phenotypes on different allele classes. Biallelic hypomorphic
    missense alleles cause this disease (COXPD13, OMIM 614932). A distinct
    biallelic allele, p.Glu475Gly, was reported in a Moroccan family with
    autosomal recessive nonsyndromic hearing impairment, DFNB70 (OMIM 614934) -
    curated separately, though long-term follow-up of one such family found the
    "isolated" deafness later evolving into multisystem neurodegeneration, so the
    two may be ends of one spectrum rather than distinct entities. Heterozygous
    truncating and splice variants in the S1 domain cause dominant spinocerebellar
    ataxia type 25, a third and clearly separate entity.
  variants:
  - name: "PNPT1 c.1160A>G (p.Gln387Arg)"
    description: >-
      The founding homozygous allele, reported in two siblings of consanguineous
      Moroccan parents with severe encephalomyopathy and choreoathetosis. It
      abolishes the PNPase trimer in patient fibroblasts. Structural work later
      showed that this substitution and p.Glu475Gly both break the
      protomer-protomer interface, so the enzyme assembles as a catalytically
      poor dimer rather than failing to assemble at all.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23084291
      reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
        impairs RNA import into mitochondria and causes respiratory-chain deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Blue-native polyacrylamide gel electrophoresis showed that no PNPase
        complex could be detected in subject fibroblasts, confirming that the substitution
        encoded by c.1160A>G disrupts the trimerization of the protein."
      explanation: Demonstrates that the founding allele destroys assembly of the
        PNPase trimer in patient cells.
    - reference: PMID:40996428
      reference_title: "Human polynucleotide phosphorylase in mitochondrial RNA metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Other disease-associated hPNPase variants with single amino acid substitutions,
        Q387R and E475G, disrupt the protomer-protomer interface within the trimer,
        resulting in the formation of dimers rather than the catalytically active
        trimers."
      explanation: Resolves the structural consequence of this allele - a defective
        dimer, not an absence of oligomer.
  - name: "PNPT1 c.760C>A / c.1528G>C (p.Gln254Lys / p.Ala510Pro)"
    description: >-
      Compound heterozygous alleles in two brothers from a non-consanguineous
      family with severe axonal neuropathy, optic atrophy, intellectual
      disability and auditory neuropathy. Patient fibroblasts had markedly
      reduced PNPT1 message and protein and no detectable PNPase complex, and
      expression of wild-type PNPT1 rescued complex I and IV activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27759031
      reference_title: "Whole-exome sequencing identifies novel variants in PNPT1
        causing oxidative phosphorylation defects and severe multisystem disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sanger sequencing confirmed the presence of both variants in the affected
        boys (S1 and S2) and their parents were each heterozygous for one or other
        of the variants"
      explanation: Confirms that the two alleles are in trans and segregate with disease
        - both affected boys carry both, and each unaffected parent carries only one.
  - name: "PNPT1 c.1399C>T (p.Pro467Ser)"
    description: >-
      Homozygous allele in a patient whose presentation was an
      Aicardi-Goutieres-like interferonopathy with early-onset encephalopathy,
      neurodevelopmental regression, secondary microcephaly and white-matter
      hyperintensities, with a persistently elevated interferon score.
      Structurally it lies in an RNase PH2 loop near the S1 domain and favours
      the enzyme's open conformation, impairing RNA degradation without
      disrupting the trimer.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33158637
      reference_title: "PNPT1 mutations may cause Aicardi-Goutières-Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified a novel homozygous missense variant (c.1399C > T, p.Pro467Ser)
        in PNPT1"
      explanation: Names the allele in the interferonopathy-presenting patient.
    - reference: PMID:40996428
      reference_title: "Human polynucleotide phosphorylase in mitochondrial RNA metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Disease-associated mutations such as P467S and G499R, although located
        distantly from the RNA-binding site, were found to favour the open conformation
        of the enzyme."
      explanation: Gives the structural mechanism of this allele, distinct from the
        trimer-interface alleles.
  - name: "PNPT1 c.1453A>G (p.Met485Val)"
    description: >-
      Homozygous allele in a 34-month-old boy with global developmental delay,
      hypotonia, hearing impairment, chorea and dystonia, whose imaging added
      delayed myelination, progressive basal ganglia atrophy and brainstem
      signal change. Crystallographic modelling placed the substitution at the
      protein's active site.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33812062
      reference_title: "Crystallographic modeling of the PNPT1:c.1453A>G variant as
        a cause of mitochondrial dysfunction and autosomal recessive deafness; expanding
        the neuroimaging and clinical features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mitochondrial genome sequencing and whole-exome sequencing (WES) were
        performed and a variant in PNPT1:c.1453A>G; p. (Met485Val) was identified."
      explanation: Names the allele identified in this patient.
  - name: "PNPT1 c.1033A>G (p.Lys345Glu)"
    description: >-
      Homozygous allele in the first reported Chinese patient, a boy with
      multiorgan involvement, white-matter change, epilepsy, global
      developmental delay, growth retardation and visual and auditory
      impairment. Pathogenicity here rests on structural prediction rather than
      on a functional assay, which is weaker than the evidence behind the
      earlier alleles.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:40115456
      reference_title: "A novel polyribonucleotide nucleotidyltransferase 1 (PNPT1)
        gene variant potentially associated with combined oxidative phosphorylation
        deficiency 13: case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "whole-exome sequencing (WES) revealed a homozygous mutation, c.1033A>G
        (p.K345E), in the PNPT1 gene"
      explanation: Names the allele in the index Chinese patient.
  evidence:
  - reference: PMID:30244537
    reference_title: "Is PNPT1-related hearing loss ever non-syndromic? Whole exome
      sequencing of adult siblings expands the natural history of PNPT1-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PNPT1 is a mitochondrial RNA transport protein that has been linked
      to two discrete phenotypes, namely isolated sensorineural hearing loss (OMIM
      614934) and combined oxidative phosphorylation deficiency (OMIM 614932)."
    explanation: Establishes the two recessive PNPT1 entities and the OMIM numbers
      that separate them, which is what keeps DFNB70 out of this entry.
  - reference: PMID:35411967
    reference_title: "Heterozygous PNPT1 Variants Cause Spinocerebellar Ataxia Type
      25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies PNPT1 as a new SCA gene, responsible for SCA25,
      and highlights biological links between alterations of mtRNA trafficking, interferonopathies
      and ataxia."
    explanation: Documents the third, dominantly inherited PNPT1 entity, which is
      the reason zygosity and allele class have to be checked before a PNPT1 variant
      is read as COXPD13.
pathophysiology:
- name: Biallelic PNPT1 Hypomorphic Variants
  biological_scale: MOLECULAR
  role: initiator
  mechanism_confidence: ESTABLISHED
  description: >-
    Two hypomorphic PNPT1 missense alleles reduce the amount or the function of
    mitochondrial polynucleotide phosphorylase. Reported patient alleles do this
    by more than one route - some destroy or distort the protomer interface,
    some lock the enzyme in a non-productive conformation, some sit at the active
    site, and some also reduce steady-state message and protein. Complete loss is
    not represented among patients, because constitutive Pnpt1 knockout is
    embryonic lethal in the mouse.
  genetic_context:
    genes:
    - preferred_term: PNPT1
      term:
        id: hgnc:23166
        label: PNPT1
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline missense variants retaining
      residual PNPase activity.
  locations:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:23084291
    reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
      impairs RNA import into mitochondria and causes respiratory-chain deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PNPase is predominantly localized in the mitochondrial intermembrane
      space and is implicated in RNA targeting to human mitochondria."
    explanation: Establishes the subcellular location and the RNA-targeting role of
      the affected protein.
  - reference: PMID:40996428
    reference_title: "Human polynucleotide phosphorylase in mitochondrial RNA metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In humans, PNPase (hPNPase) is located in mitochondria, where it plays
      a role in mitochondrial RNA (mtRNA) metabolism, thereby regulating mitochondrial
      function and the overall cell fitness."
    explanation: Review statement of the gene product's mitochondrial RNA-metabolism
      role, which is the function the disease alleles degrade.
  downstream:
  - target: Loss of Functional PNPase Assembly and Catalysis
    causal_link_type: DIRECT
    description: >-
      The missense substitutions act on the protein itself - on how the trimer
      assembles, how the S1 domains move, or on the active site.

- name: Loss of Functional PNPase Assembly and Catalysis
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: ESTABLISHED
  description: >-
    PNPase is catalytically active only as a trimer, with the active site inside
    the toroidal core the six RNase PH domains build between them, so the disease
    alleles converge on the same functional endpoint by different structural
    routes. Blue-native gels of fibroblasts from the founding patient found no
    PNPase complex at all; the same was true of the Australian siblings'
    fibroblasts. Structural work refined that picture: p.Gln387Arg and
    p.Glu475Gly do not simply prevent oligomerisation, they force a dimer whose
    KH and S1 domains can no longer engage RNA. Not every allele works this way -
    the Leigh-syndrome alleles left the trimer intact and instead disabled RNA
    processing directly, so trimer integrity is not a reliable functional
    screen.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  molecular_functions:
  - preferred_term: polyribonucleotide nucleotidyltransferase activity
    term:
      id: GO:0004654
      label: polyribonucleotide nucleotidyltransferase activity
    modifier: DECREASED
  - preferred_term: 3'-5' RNA exonuclease activity
    term:
      id: GO:0000175
      label: 3'-5'-RNA exonuclease activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The PNPase complex was found to be totally absent in patient S1 fibroblast
      samples, suggesting that these variants severely impair the assembly of the complex"
    explanation: Independent replication, in a second family, of the assembly defect
      first shown for the founding allele.
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The trimerization of PNPase is essential for the RNA processing and transportation
      function of PNPase protein"
    explanation: States why the assembly defect matters - both downstream branches
      of the mechanism require the trimer.
  - reference: PMID:28645153
    reference_title: "Defective mitochondrial RNA processing due to PNPT1 variants
      causes Leigh syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The PNPase trimer formation was not affected, but specific RNA processing
      intermediates derived from mitochondrial transcripts of the ND6 subunit of Complex
      I, as well as small mRNA fragments, accumulated in the subject's myoblasts."
    explanation: Supports the loss-of-catalysis half of this node while contradicting
      the trimer-disruption route, which is why the node states that trimer integrity
      is not a reliable functional screen. Marked INDIRECT because the catalytic loss
      is inferred from the accumulated substrates rather than assayed directly.
  downstream:
  - target: Impaired Import of Small Noncoding RNAs into Mitochondria
    causal_link_type: DIRECT
    description: >-
      PNPase is one of very few known components of the mammalian mitochondrial
      RNA-import machinery, and the hypofunctional protein imports less.
    evidence:
    - reference: PMID:23084290
      reference_title: "A mutation in PNPT1, encoding mitochondrial-RNA-import protein
        PNPase, causes hereditary hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the identified mutation results in a hypofunctional protein leading
        to disturbed PNPase trimerization and impaired mitochondrial RNA import"
      explanation: Directly connects the protein-level defect to the import defect
        in the same experimental series.
  - target: Defective Mitochondrial RNA Processing and Turnover
    causal_link_type: DIRECT
    description: >-
      In the matrix, PNPase is the ribonuclease half of the degradosome, so a
      crippled enzyme leaves transcripts unprocessed and degradation
      intermediates uncleared.

- name: Impaired Import of Small Noncoding RNAs into Mitochondria
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: PROVISIONAL
  description: >-
    Mammalian mitochondria import a small set of nuclear-encoded noncoding RNAs -
    5S rRNA, the RNase MRP and RNase P RNAs, some tRNAs and miRNAs - and PNPase
    is one of the few identified components of that route. Fibroblasts from the
    founding patient imported significantly less 5S rRNA and MRP-related RNA, and
    fibroblasts from the Japanese siblings imported less RNase P RNA. Both
    defects were corrected by re-expressing wild-type PNPT1.

    Confidence is PROVISIONAL rather than ESTABLISHED because how much of the
    disease runs through this branch is genuinely contested. The Leigh-syndrome
    patient's alleles impaired RNA processing with the trimer intact, and the
    authors of that study note that the role and location of PNPase within human
    mitochondria remain controversial.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: RNA import into mitochondrion
    term:
      id: GO:0035927
      label: RNA import into mitochondrion
    modifier: DECREASED
  evidence:
  - reference: PMID:23084291
    reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
      impairs RNA import into mitochondria and causes respiratory-chain deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By RNA hybridization experiments, we observed a significant decrease
      in 5S rRNA and MRP-related RNA import into mitochondria in fibroblasts of affected
      subject 1."
    explanation: The direct measurement of reduced import in patient cells.
  - reference: PMID:28594066
    reference_title: "Novel biallelic mutations in the PNPT1 gene encoding a mitochondrial-RNA-import
      protein PNPase cause delayed myelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analyses of skin fibroblasts from the patient showed that PNPase expression
      was markedly decreased and that import of the small RNA RNaseP into mitochondria
      was impaired."
    explanation: Independent replication of the import defect in a second family,
      with a different imported RNA species.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      The imported species feed mitochondrial gene expression - 5S rRNA has been
      proposed as a mitoribosomal component and RNase P RNA is needed for tRNA
      maturation - so under-supplying them limits translation.
    evidence:
    - reference: PMID:23084291
      reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
        impairs RNA import into mitochondria and causes respiratory-chain deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, overexpression of the wild-type PNPT1 cDNA in fibroblasts
        of subject 1 induced an increase in 5S rRNA import in mitochondria and rescued
        the mitochondrial-translation deficiency."
      explanation: A rescue experiment tying the two nodes together in the same cells
        - restoring import restored translation, which is what makes this an edge
        rather than a coincidence.

- name: Defective Mitochondrial RNA Processing and Turnover
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: ESTABLISHED
  description: >-
    In the matrix, PNPase partners the ATP-dependent helicase SUV3 as the
    mitochondrial RNA degradosome, which processes polycistronic transcripts and
    clears degradation intermediates. In patient cells this fails visibly:
    unprocessed intermediates from the ND6 region of the mitochondrial genome and
    small mRNA fragments accumulate in myoblasts, and unprocessed transcripts
    accumulate in fibroblasts. This is the branch of the mechanism that is
    directly measurable in patients, and it is more sensitive than downstream
    respiratory-chain enzymology.
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  biological_processes:
  - preferred_term: mitochondrial mRNA processing
    term:
      id: GO:0090615
      label: mitochondrial mRNA processing
    modifier: DECREASED
  - preferred_term: mitochondrial RNA catabolic process
    term:
      id: GO:0000957
      label: mitochondrial RNA catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:28645153
    reference_title: "Defective mitochondrial RNA processing due to PNPT1 variants
      causes Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our evidence indicates that PNPase activity is essential for the correct
      maturation of the ND6 transcripts, and likely for the efficient removal of degradation
      intermediates."
    explanation: States the processing and clearance functions that fail, as concluded
      from the patient myoblast experiments.
  - reference: PMID:31752325
    reference_title: "Clinical Spectrum and Functional Consequences Associated with
      Bi-Allelic Pathogenic PNPT1 Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts showed an accumulation of mitochondrial unprocessed
      PNPT1 transcripts"
    explanation: Replicates the processing defect in patient fibroblasts across the
      largest reported cohort.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Transcripts that are never correctly matured cannot be translated, so the
      processing defect throttles mitochondrial protein synthesis independently
      of the import branch.
  - target: Mitochondrial Double-Stranded RNA Accumulation and Cytosolic Escape
    causal_link_type: DIRECT
    description: >-
      Bidirectional transcription of the mitochondrial genome generates
      complementary transcripts; the degradosome is what normally keeps the
      resulting duplexes from persisting.
    evidence:
    - reference: PMID:30046113
      reference_title: "Mitochondrial double-stranded RNA triggers antiviral signalling
        in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of either enzyme results in massive accumulation of mitochondrial
        double-stranded RNA that escapes into the cytoplasm in a PNPase-dependent manner."
      explanation: Establishes the causal step from degradosome loss to double-stranded
        RNA accumulation and escape.

- name: Impaired Mitochondrial Translation
  biological_scale: MOLECULAR
  role: driver
  mechanism_confidence: ESTABLISHED
  description: >-
    Mitochondria translate thirteen proteins of their own, all subunits of the
    respiratory chain, on a dedicated ribosome. Degrading the RNA supply to that
    apparatus - whether by failing to import the small RNAs it needs or by
    failing to mature its transcripts - slows synthesis of all thirteen together
    rather than any one selectively. The defect has been measured directly in
    patient cells twice, as a reduced translation rate in the founding patient's
    fibroblasts and as a one-third fall in total mitochondrial protein synthesis
    in the Australian siblings'.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:23084291
    reference_title: "Mutation in PNPT1, which encodes a polyribonucleotide nucleotidyltransferase,
      impairs RNA import into mitochondria and causes respiratory-chain deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, we found a reproducible decrease in the rate of mitochondrial
      translation in her fibroblasts."
    explanation: Direct measurement of the translation defect in patient fibroblasts.
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Enzyme activity of CI and CIV was clearly reduced in patient fibroblasts
      compared with controls along with a 33% reduction in total mitochondrial protein
      synthesis."
    explanation: Quantifies the translation defect and shows it alongside the respiratory-chain
      consequence in the same cells.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      The thirteen mtDNA-encoded products are distributed across complexes I,
      III, IV and V, so under-supplying them makes those complexes fail together.

- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Complexes I, III, IV and V each contain mtDNA-encoded subunits and are
    reduced together; complex II, built entirely from nuclear-encoded subunits,
    is relatively spared. In the Australian siblings' fibroblasts, complexes I,
    III and IV were reduced while complexes II and V were not, and complex I and
    IV enzyme activity fell by roughly half. In the Leigh-syndrome patient the
    deficit was strongly tissue-dependent - I, III and IV in cortex, I and IV in
    cerebellum and basal ganglia, complex IV alone in liver, and only a mild
    complex IV reduction in muscle.

    Two cautions belong with this node rather than in a footnote. First,
    conventional spectrophotometric respiratory-chain enzymology can be entirely
    normal in a genetically confirmed patient, in both muscle and fibroblasts, so
    a normal assay does not exclude the diagnosis. Second, PNPase's RNA-processing
    function is the more sensitive readout - a point that matters for variant
    interpretation, not just for diagnosis.

    Conformance note: this node conforms to the module's central bioenergetic
    node in its bioenergetic-decline arm only. The module's upstream node,
    age-related mitochondrial damage and mtDNA mutation, does not apply to a
    primary nuclear-gene RNA-metabolism defect, and the module's
    reactive-oxygen-species arm is not evidenced in COXPD13 patients, so
    conformance is declared here and nowhere else in this entry.

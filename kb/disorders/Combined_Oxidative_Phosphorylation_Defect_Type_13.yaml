- name: Cochlear Hair Cell and Auditory Neuron Dysfunction
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The cochlea is the tissue with the clearest evidence that PNPase is required
    locally rather than affected incidentally. PNPase is strongly expressed in
    the sensory hair cells and auditory ganglion neurons of the murine cochlea,
    and hair-cell-specific knockout in the mouse causes progressive hearing loss.
    In humans, one PNPT1 allele class causes hearing loss with nothing else
    attached for decades, which is the strongest available statement that this
    tissue is selectively vulnerable rather than merely one of many.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:23084290
    reference_title: "A mutation in PNPT1, encoding mitochondrial-RNA-import protein

    explanation: The authors' conclusion that this machinery is specifically required
      for hearing, which is the selectivity claim this node makes.
  downstream:
  - target: Sensorineural hearing loss
    causal_link_type: DIRECT

- name: Impaired Myelination and White Matter Injury
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Two siblings with biallelic PNPT1 variants presented with delayed myelination
    rather than with a Leigh pattern, and delayed myelination was also seen in
    the patient with the p.Met485Val allele. White-matter change is common in the
    imaging series. Confidence is PROVISIONAL rather than ESTABLISHED because the
    white matter is reached by two different routes in this disease - the
    bioenergetic one drawn here, and the interferon route that produces cystic
    leukoencephalopathy - and no study has separated their contributions in a
    single patient.

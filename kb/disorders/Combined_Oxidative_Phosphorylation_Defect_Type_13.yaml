biochemical:
- name: Plasma lactate
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  frequency: OCCASIONAL
  notes: >-
    Usually mildly to moderately elevated when abnormal, and normal in some
    genetically confirmed patients. It is a prompt to look for a mitochondrial
    disorder, not a screen that can exclude one.
  evidence:
  - reference: PMID:40115456
    reference_title: "A novel polyribonucleotide nucleotidyltransferase 1 (PNPT1)
      gene variant potentially associated with combined oxidative phosphorylation deficiency
      13: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient also showed elevated lactate levels in the plasma."
    explanation: Documents the raised plasma lactate in a confirmed patient.
- name: CSF lactate
  biomarker_term:
    preferred_term: Increased CSF lactate
    term:
      id: HP:0002490
      label: Increased CSF lactate
  notes: >-
    Reported both elevated and normal. A normal CSF lactate does not exclude the
    diagnosis - it was normal, along with blood lactate and muscle respiratory
    chain enzymology, in the Australian siblings.
  evidence:
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "blood and CSF lactate, and muscle respiratory chain enzyme assays were
      all normal"
    explanation: Recorded as REFUTE against reading raised CSF lactate as a reliable
      marker in this disease; the marker is listed precisely because its negative
      result is uninformative.
- name: Blood interferon signature
  frequency: OCCASIONAL
  notes: >-
    An elevated type I interferon score in peripheral blood, measured as
    interferon-stimulated gene expression. It is the only biomarker that reads
    out the second arm of the mechanism rather than the respiratory-chain arm,
    and it is not part of routine mitochondrial-disease workup - which is the
    argument for ordering it when the imaging looks interferonopathic. No
    ontology term is bound because no HPO or LOINC term for an interferon
    signature score was identified.
  evidence:
  - reference: PMID:31752325
    reference_title: "Clinical Spectrum and Functional Consequences Associated with
      Bi-Allelic Pathogenic PNPT1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while blood showed an increased interferon response"
    explanation: Reports the raised blood interferon response in biallelic PNPT1 patients.
      Quoted as the blood half of the sentence only, since the fibroblast half of the
      same sentence is an in-vitro finding and belongs to a different evidence item.
  - reference: PMID:33158637
    reference_title: "PNPT1 mutations may cause Aicardi-Goutières-Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal assessment of the interferon signature showed a massively
      elevated interferon score and chronic type I interferon-mediated autoinflammation."
    explanation: Shows the signature is sustained rather than a single abnormal measurement.
animal_models:
- name: Pnpt1 knockout mouse embryonic fibroblasts and conditional hair-cell knockout
  species: Mouse
  genotype: Pnpt1 knockout (MEF clones) and Atoh1-Cre conditional deletion in cochlear
    hair cells
  publication: PMID:30024931
  description: >-
    The only reported mammalian model of PNPase loss. Constitutive knockout is
    embryonic lethal, so the work uses knockout mouse embryonic fibroblasts
    adapted to respiratory deficiency and a hair-cell-restricted conditional
    deletion. The hair-cell arm reproduces the human auditory phenotype directly;
    the fibroblast arm reproduces the bioenergetic failure but adds a lesion -
    complete mtDNA loss - that is not a feature of the human hypomorphic disease.
  evidence:
  - reference: PMID:30024931
    reference_title: "PNPase knockout results in mtDNA loss and an altered metabolic
      gene expression program."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we established PNPase knockout (PKO) systems by first shifting culture
      conditions to enable cell growth with defective respiration"
    explanation: Describes how the model was built, and why - complete PNPase loss
      is not tolerated without first adapting the cells to respiratory deficiency,
      which is the constraint that shapes what this model can and cannot say.
  modeled_mechanisms:
  - target: Cochlear Hair Cell and Auditory Neuron Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Deleting Pnpt1 in cochlear hair cells produces progressive hearing loss,
      which the authors relate directly to the human PNPT1 hearing phenotype.
    limitations: >-
      A complete knockout restricted to one cell type, whereas patients carry
      hypomorphic alleles expressed everywhere - so the model isolates the
      cochlear contribution but cannot say whether human hearing loss is
      hair-cell-autonomous. The relevant human comparator is also the allelic
      DFNB70 deafness phenotype rather than COXPD13 itself, in which hearing loss
      is one feature among many.
    readouts:
    - name: Progressive hearing loss in hair-cell knockout mice
      target: Cochlear Hair Cell and Auditory Neuron Dysfunction
      direction: DECREASED
      interpretation: >-
        Auditory function declines over time after hair-cell-restricted Pnpt1
        deletion, the animal counterpart of the human sensorineural loss.
      evidence:
      - reference: PMID:30024931
        reference_title: "PNPase knockout results in mtDNA loss and an altered metabolic
          gene expression program."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PKO in mouse inner ear hair cells caused progressive hearing loss
          that parallels human familial hearing loss previously linked to mutations
          in PNPase."
        explanation: Reports the auditory phenotype and the authors' own mapping of
          it onto the human disease.
    evidence:
    - reference: PMID:30024931
      reference_title: "PNPase knockout results in mtDNA loss and an altered metabolic
        gene expression program."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "consistent with previous studies detailing causative PNPase mutations
        in delayed myelination, hearing loss, encephalomyopathy, and chorioretinal
        defects in humans"
      explanation: The authors place their model against the human PNPT1 phenotypes,
        which is what supports treating it as informative for this node.
  - target: Cellular Energy Failure in High-Demand Tissues
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Knockout fibroblasts are respiration-deficient and grow slowly, with a
      transcriptional profile resembling mtDNA-deleted rho-zero cells.
    limitations: >-
      Fidelity is LOW because the model reaches the energy deficit by a different
      route than the disease does. Complete PNPase loss caused mitochondrial DNA
      to be lost outright, whereas the Leigh-syndrome patient's mtDNA abundance
      was normal and the proximal defect was post-transcriptional RNA metabolism.
      A null model of an essential gene is a loss-of-function boundary, not a
      genotype-matched model of a hypomorphic human allele.
    readouts:
    - name: Biomass accumulation rate of knockout fibroblasts
      target: Cellular Energy Failure in High-Demand Tissues
      direction: DECREASED
      interpretation: >-
        A quantitative growth readout of the respiratory deficiency, standing in
        for the ATP deficit measured in patient fibroblasts.
      evidence:
      - reference: PMID:30024931
        reference_title: "PNPase knockout results in mtDNA loss and an altered metabolic
          gene expression program."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We quantified the normalized biomass accumulation rate of PKO clones
          at 1.7%"
        explanation: The quantitative growth deficit of the knockout cells, below
          the parental control rate.
    evidence:
    - reference: PMID:30024931
      reference_title: "PNPase knockout results in mtDNA loss and an altered metabolic
        gene expression program."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, PKO established in mouse embryonic fibroblasts (MEFs)
        resulted in the loss of mitochondrial DNA (mtDNA)."
      explanation: The finding that makes the model informative about PNPase loss
        and simultaneously limits its fidelity to the human disease, where mtDNA is
        preserved. Marked INDIRECT because the energy failure is inferred from mtDNA
        loss and the rho-zero-like profile rather than measured as such.
diagnosis:
- name: Trio exome or genome sequencing including PNPT1
  description: >-
    Molecular diagnosis is the route in practice, and every published case was
    made this way. A panel restricted to Leigh-syndrome or encephalopathy genes
    can miss the presentations that begin as axonal neuropathy, delayed
    myelination, or an interferonopathy, so a broad nuclear mitochondrial-disease
    panel or exome with parental segregation is the safer test. Zygosity and
    allele class must be read carefully: biallelic missense means COXPD13, while
    a heterozygous truncating or splice allele in the S1 domain means SCA25.
  evidence:
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data emphasise the value of WES even in patients with apparently
      normal results of OXPHOS respiratory chain enzymology"
    explanation: The explicit argument for sequencing first in this disease, made
      by the authors of the family whose enzymology was normal.
- name: Functional assay of mitochondrial RNA processing
  description: >-
    For a novel or uncertain allele, the informative assay is the RNA one -
    Northern blot or RNA sequencing for unprocessed mitochondrial transcripts and
    degradation intermediates - not respiratory-chain enzymology. This is not a
    preference but a measured difference in sensitivity, and it inverts the usual
    mitochondrial-disease workup order. Complementation with wild-type PNPT1 in
    patient cells is the confirmatory step used in three separate families.
  evidence:
  - reference: PMID:31752325
    reference_title: "Clinical Spectrum and Functional Consequences Associated with
      Bi-Allelic Pathogenic PNPT1 Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that functional analyses of the RNA processing function
      of PNPase are more sensitive than testing downstream defects in oxidative phosphorylation
      (OXPHPOS) enzyme activities."
    explanation: States the sensitivity ordering directly. The typographical error
      in the abbreviation is the source's own and is quoted as it stands.
  - reference: PMID:28645153
    reference_title: "Defective mitochondrial RNA processing due to PNPT1 variants
      causes Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of the wild type PNPT1 in the subject's myoblasts functionally
      complemented the defects, and the pathogenicity was further supported by structural
      predictions and protein and RNA analyses."
    explanation: The complementation step that converts a candidate allele into a
      demonstrated cause.
- name: Interferon signature in blood
  description: >-
    An interferon score is worth adding when imaging shows cystic
    leukoencephalopathy or the picture suggests Aicardi-Goutieres syndrome. It is
    not a mitochondrial-disease test and would not otherwise be ordered, which is
    why the recommendation is explicit in the literature rather than implied.
  evidence:
  - reference: PMID:33158637
    reference_title: "PNPT1 mutations may cause Aicardi-Goutières-Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We highlight the clinical value of assessing the interferon signature
      in children with encephalopathy of unknown origin"
    explanation: The recommendation this diagnostic entry records.
differential_diagnoses:
- name: SUPV3L1-related leukodystrophy
  description: >-
    SUPV3L1 encodes SUV3, the helicase half of the same mitochondrial degradosome
    that PNPase completes. Biallelic loss-of-function variants cause a variable
    leukodystrophy with neurodevelopmental impairment, microcephaly and
    spasticity, and an increased blood interferon signature - the same
    combination of features, reached through the partner protein.
  distinguishing_features:
  - >-
    Not separable by mechanism or by interferon signature; the distinction is
    molecular, and a panel covering both halves of the degradosome is the
    practical answer.
  evidence:
  - reference: PMID:42466401
    reference_title: "Biallelic variants in SUPV3L1 cause a variable leukodystrophy
      due to impaired mitochondrial degradosome function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mitochondrial dsRNA degradosome complex is formed by PNPT1 and SUPV3L1."
    explanation: Establishes that the two genes encode the two halves of one complex,
      which is why their diseases converge.
- name: Aicardi-Goutieres syndrome and other type I interferonopathies
  description: >-
    AGS is diagnosed clinically from early-onset encephalopathy with basal
    ganglia calcification or white-matter change plus laboratory evidence of type
    I interferon activation - a description a PNPT1 patient can satisfy
    completely. RNASET2 deficiency produces near-identical cystic
    leukoencephalopathy. Congenital CMV infection is the non-genetic mimic of the
    same imaging.
  distinguishing_features:
  - >-
    Cannot be excluded on interferon score or imaging; PNPT1 has to be on the
    gene list. The published recommendation is that every patient with an AGS
    phenotype be screened for PNPT1.
  evidence:
  - reference: PMID:33158637
    reference_title: "PNPT1 mutations may cause Aicardi-Goutières-Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest all patients presenting with a phenotype of AGS should be screened
      for mutations in PNPT1"
    explanation: The recommendation that makes this differential actionable rather
      than academic.
- name: PNPT1-related nonsyndromic hearing loss (DFNB70)
  description: >-
    The allelic recessive deafness phenotype, OMIM 614934, carried on a distinct
    PNPT1 allele and curated as a separate entity. The separation is not
    watertight: adult siblings originally diagnosed with isolated congenital
    sensorineural hearing loss went on in their forties to develop ataxia,
    dystonia and cognitive decline, and later optic atrophy, spasticity and
    incontinence.
  distinguishing_features:
  - >-
    Isolated hearing loss with no neurological features and normal development
    suggests DFNB70 rather than COXPD13, but the distinction may be a matter of
    age at assessment rather than of entity.
  evidence:
  - reference: PMID:30244537
    reference_title: "Is PNPT1-related hearing loss ever non-syndromic? Whole exome
      sequencing of adult siblings expands the natural history of PNPT1-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The natural history of the condition in this family may suggest that
      the individuals previously reported as having isolated SNHL may be at risk of
      developing multisystem disease in late adulthood, and that PNPT1-related disorders
      may constitute a spectrum rather than distinct phenotypes."
    explanation: The evidence that the two OMIM entities may be one spectrum, which
      is the caution this differential carries.
- name: Spinocerebellar ataxia type 25 (heterozygous PNPT1)
  description: >-
    A dominant, adult- or childhood-onset sensory and cerebellar ataxia caused by
    heterozygous truncating and splice PNPT1 variants in the S1 domain. It shares
    the elevated type I interferon response with the recessive disease, so a
    PNPT1 variant plus an interferon signature does not by itself point to
    COXPD13.
  distinguishing_features:
  - >-
    Zygosity and allele class decide it. One truncating or splice allele in the
    S1 domain with a dominant family history is SCA25; two hypomorphic missense
    alleles with recessive segregation are COXPD13.
  - >-
    Onset and course differ - a slowly evolving ataxic ganglionopathy rather than
    an infantile encephalomyopathy.
  evidence:
  - reference: PMID:35411967
    reference_title: "Heterozygous PNPT1 Variants Cause Spinocerebellar Ataxia Type
      25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both nonsense and splice heterozygous variants result in premature stop
      codons, all located in the S1-domain of PNPase."
    explanation: Defines the allele class and location that separate SCA25 from the
      recessive missense disease.
treatments:
- name: Supportive multidisciplinary mitochondrial care
  description: >-
    No disease-modifying therapy exists for COXPD13 and no interventional trial
    has been run. Management is supportive - seizure control, nutritional and
    feeding support, developmental therapies, hearing and vision support, and
    surveillance - together with avoidance of the metabolic stressors that
    destabilise mitochondrial disease generally, such as prolonged fasting,
    dehydration, fever and untreated infection. That last part is extrapolated
    from mitochondrial medicine at large, not from evidence in this disease.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    Left without an evidence item. No cited source reports an outcome of
    supportive care in a COXPD13 patient, and the practice is not in dispute; an
    evidence item here would attach a citation to a claim no paper actually
    makes.
- name: Antiseizure pharmacotherapy
  description: >-
    Seizures and infantile spasms are treated conventionally. The one reported
    experience is discouraging and worth recording: adrenocorticotropic hormone
    was ineffective for infantile spasms in the Chinese patient, and levetiracetam
    and topiramate were started instead. That is a single patient, so it is a
    data point rather than guidance.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40115456
    reference_title: "A novel polyribonucleotide nucleotidyltransferase 1 (PNPT1)
      gene variant potentially associated with combined oxidative phosphorylation deficiency
      13: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient treatment with adrenocorticotropic hormones proved ineffective,
      prompting the initiation of oral antiepileptic therapy with levetiracetam and
      topiramate."
    explanation: Reports the treatment given and one negative result. It supports
      the existence of this management step, not its efficacy - no outcome is given
      for the drugs that replaced the hormone.
- name: Genetic counselling and reproductive options
  description: >-
    Autosomal recessive inheritance gives a one-in-four recurrence risk per
    pregnancy for carrier couples. Preimplantation genetic diagnosis has been
    used successfully after a molecular diagnosis in this disease.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results enabled the parents of these two boys to proceed to pregnancy
      planning using preimplantation genetic diagnosis"
    explanation: Documents the reproductive use to which a molecular diagnosis was
      put in a reported family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Counts differ by how the phenotypic boundary is drawn. A 2019 study captured
    all 17 patients then in the literature and added 7 new ones, for 24 across
    the biallelic PNPT1 spectrum including the hearing-loss families; a 2025
    review counted about 15 cases of COXPD13 specifically. No population
    prevalence or incidence estimate exists, and none is derivable from case
    counts.
  evidence:
  - reference: PMID:31752325
    reference_title: "Clinical Spectrum and Functional Consequences Associated with
      Bi-Allelic Pathogenic PNPT1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we captured detailed clinical and molecular phenotypes of all 17 patients
      reported in the literature, plus seven new patients, including a 78-year-old
      male with the longest reported survival."
    explanation: Gives the reported cohort size for biallelic PNPT1 disease and the
      upper end of survival.
  - reference: PMID:40115456
    reference_title: "A novel polyribonucleotide nucleotidyltransferase 1 (PNPT1)
      gene variant potentially associated with combined oxidative phosphorylation deficiency
      13: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While 15 cases have been reported globally, none have been documented
      in China."
    explanation: The narrower, COXPD13-specific case count from the most recent review.
progression:
- phase: Neonatal or infantile onset
  age_range: birth to 12 months
  notes: >-
    Onset is usually in the first year, from the first hours of life in the
    perinatal case to around nine months. Presenting signs are reduced
    spontaneous movement, irritability, hypotonia, feeding difficulty, dystonia
    or developmental delay.
  evidence:
  - reference: PMID:37861028
    reference_title: "Combined Oxidative Phosphorylation Deficiency Type-13 with Perinatal
      Presentation: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As far as we know, this is the first reported case of PNPT1 mutation
      with onset in the perinatal period."
    explanation: Establishes the earliest reported onset and marks it as exceptional.
- phase: Progressive Leigh-syndrome course
  age_range: 1 month to early childhood
  notes: >-
    The severe end - rapid neurological deterioration with seizures and basal
    ganglia injury, ending in death. The best-characterised example manifested at
    one month and died at 2.4 years.
  evidence:
  - reference: PMID:28645153
    reference_title: "Defective mitochondrial RNA processing due to PNPT1 variants
      causes Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied the exome of a child manifesting with Leigh syndrome at one
      month of age and progressing to death by the age of 2.4 years"
    explanation: Documents the age of onset and age at death in the fatal Leigh presentation.
- phase: Late-onset multisystem neurodegeneration after isolated hearing loss
  age_range: fifth decade onward
  notes: >-
    The opposite extreme, and the reason survival in this disease cannot be
    summarised by the infantile cases. Siblings with congenital sensorineural
    hearing loss and nothing else developed ataxia, dystonia and cognitive
    decline in their forties, then optic atrophy, spasticity and incontinence in
    their fifties and sixties. A 78-year-old man is the longest reported survivor
    with biallelic PNPT1 variants.
  evidence:
  - reference: PMID:30244537
    reference_title: "Is PNPT1-related hearing loss ever non-syndromic? Whole exome
      sequencing of adult siblings expands the natural history of PNPT1-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Now in their 50s and 60s, all have developed the additional features
      of optic nerve atrophy, spasticity, and incontinence."
    explanation: Documents the late multisystem course in adults with biallelic PNPT1
      variants.
discussions:
- discussion_id: interferon_arm_contribution_unquantified
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How much of the COXPD13 phenotype is caused by the type I interferon response
    to cytosolic mitochondrial double-stranded RNA, as opposed to the
    respiratory-chain deficiency?
  attaches_to:
  - pathophysiology#Type I Interferon Activation
  - pathophysiology#Mitochondrial Double-Stranded RNA Accumulation and Cytosolic Escape
  rationale: >-
    Both arms are demonstrated. Cytosolic mitochondrial double-stranded RNA and
    interferon-stimulated gene upregulation have been shown in PNPT1 patients
    themselves, one patient met criteria for Aicardi-Goutieres syndrome, and two
    unrelated patients had interferonopathy-pattern cystic leukoencephalopathy.
    The respiratory-chain arm is equally well demonstrated.

    What nobody has done is measure both in the same patients and relate them to
    which features those patients have. So it is not known whether the interferon
    response is a parallel disease mechanism, a modifier of severity, or a marker
    with little phenotypic consequence in patients whose presentation is
    encephalomyopathic rather than interferonopathic. This matters practically:
    if the interferon arm is causal in some patients, JAK inhibition - used in
    other interferonopathies - would be a rational thing to test, and nothing in
    the respiratory-chain model suggests any therapy at all. The entry types the
    interferon node as a modifier for now, which is the weakest claim consistent
    with the evidence.
- discussion_id: rna_import_versus_processing_contribution
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the disease driven mainly by failed import of small nuclear-encoded RNAs
    into mitochondria, or by failed processing and turnover of mitochondrial
    transcripts?
  attaches_to:
  - pathophysiology#Impaired Import of Small Noncoding RNAs into Mitochondria
  - pathophysiology#Defective Mitochondrial RNA Processing and Turnover
  rationale: >-
    The two founding 2012 papers framed the disease as an RNA-import defect, and
    measured reduced import of 5S rRNA, MRP RNA and RNase P RNA in patient
    fibroblasts, with rescue on re-expression. The 2017 Leigh-syndrome study
    reached the same disease by a different route: those alleles left the trimer
    intact, accumulated unprocessed ND6 transcripts, and the authors noted
    explicitly that the role and location of PNPase within human mitochondria
    remain contested.

    The entry draws both branches because both are measured, and converges them
    on mitochondrial translation. But if one branch dominates, the other is
    carrying weight it has not earned, and no study has yet dissected an
    import-specific from a processing-specific allele in the same system. A
    separation-of-function allele series would settle it.
- discussion_id: complex_v_sparing_inconsistent
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is complex V reduced in COXPD13, as a mitochondrial translation defect would
    predict, or spared alongside complex II?
  attaches_to:
  - pathophysiology#Combined Respiratory Chain Complex Deficiency
  rationale: >-
    Complex V contains two mtDNA-encoded subunits, so a general mitochondrial
    translation defect predicts it should fall with complexes I, III and IV. In
    the one patient study that measured all five, it did not: complexes II and V
    were both unchanged while I, III and IV were reduced. Complex II sparing is
    expected and mechanistically explained; complex V sparing is not.

    Only one family has been assayed this way, and the assay was steady-state
    subunit protein rather than enzyme activity, so this may be an artefact of
    method or of tissue. It is recorded because the standard summary of this
    disease class - complexes I, III, IV and V down with II spared - does not
    match the only complete measurement available in this gene, and a curator
    should not propagate the summary as if it had been observed here.
- discussion_id: genotype_phenotype_unresolved
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What determines whether biallelic PNPT1 variants produce isolated congenital
    deafness, static severe encephalopathy, fatal infantile Leigh syndrome, or an
    interferonopathy?
  attaches_to:
  - pathophysiology#Biallelic PNPT1 Hypomorphic Variants
  rationale: >-
    The clinical range is extreme - from a patient dead at 2.4 years to a
    78-year-old survivor - and the study that assembled the whole reported cohort
    concluded that no genotype-phenotype correlation is established. The obvious
    hypothesis is that residual PNPase activity sets severity and that different
    structural defects preferentially disable different functions: the
    trimer-interface alleles, the conformation-restricting alleles and the
    active-site alleles could plausibly break import, processing and
    double-stranded RNA clearance in different proportions.

    Nothing has tested this. No study has related a measured residual activity to
    a clinical outcome, and modifier genes have not been sought. Until that is
    done the entry cannot say why the same gene gives such different diseases,
    and the phenotype frequencies recorded here should be read as observations
    across a two-dozen-patient literature rather than as properties of the
    disease.
notes: >-
  Entity identity. MONDO:0013977 is combined oxidative phosphorylation defect
  type 13, cross-referenced to OMIM:614932, with PNPT1 as its causal gene. The
  numbered COXPD series is keyed to different nuclear genes of mitochondrial
  biogenesis, translation and RNA metabolism, so the number says nothing about
  mechanism; this is the PNPase one. The KB already curates numbered COXPD leaves
  as standalone entries rather than as subtypes of a general term - see
  Combined_Oxidative_Phosphorylation_Defect_Type_4 (TUFM),
  Combined_Oxidative_Phosphorylation_Defect_Type_21 (TARS2) and
  Combined_Oxidative_Phosphorylation_Defect_Type_26 (TRMT5) - and this entry
  follows that practice.

  Three PNPT1 diseases, deliberately kept apart. PNPT1 carries this recessive
  combined-OXPHOS disease (OMIM 614932), the recessive nonsyndromic deafness
  DFNB70 (OMIM 614934), and the dominant spinocerebellar ataxia SCA25. Only the
  first is curated here. The DFNB70 boundary is genuinely soft - one family's
  isolated deafness became multisystem neurodegeneration in the fifth decade -
  and that is recorded under differential_diagnoses rather than resolved, because
  merging the entities would discard the OMIM distinction on the strength of one
  family. SCA25 is a firmer separation: different zygosity, different allele
  class, different domain, different inheritance.

  Two mechanisms, one enzyme. This entry draws the mechanism as two branches from
  a single molecular lesion - the respiratory-chain branch through impaired
  mitochondrial translation, and the innate-immune branch through cytosolic
  mitochondrial double-stranded RNA. Both are evidenced in patients, not only in
  knockdown cells. Their relative contribution is not known and is recorded as an
  open question rather than settled by fiat; the interferon node is typed as a
  modifier, which is the weakest claim the evidence supports.

  No module conformance beyond one node. kb/modules/mitochondrial_dysfunction.yaml
  is the aging-hallmark module, and only its central bioenergetic node applies to
  a primary nuclear-gene RNA-metabolism defect, so conformance is declared there
  and nowhere else. kb/modules/innate_antiviral_interferon_response.yaml was
  considered for the interferon node and rejected - that module's nodes are about
  pathogen sensing and viral restriction, and this is sterile self-RNA sensing
  with no virus. A mitochondrial-translation module and a sterile-interferonopathy
  module would both fit this disease; neither exists, and the same gap was noted
  by the sibling COXPD21 and COXPD26 entries.

  GeneReviews. A PubMed search for a GeneReviews chapter covering PNPT1 or
  combined oxidative phosphorylation deficiency 13 returns nothing, which is
  expected for an entity of this size. Recorded so the absence reads as a checked
  negative.

  Evidence base. Eleven primary sources - the two 2012 founding papers, four
  later case reports, the 2019 cohort study that assembled the whole reported
  literature, the neuroimaging series, the mechanistic double-stranded RNA study,
  a 2025 structural review, and the mouse knockout study. Case counts and
  phenotype frequencies come from a literature of roughly two dozen patients, so
  the frequency bands here are observations rather than estimates. There is no
  treatment evidence at all, and the treatments section says so explicitly rather
  than implying options that do not exist.

  Deep research. A falcon (Edison) run for this entry is committed under
  research/. It passed just preflight-dr against MONDO:0013977 with PNPT1
  mentioned 50 times and the OMIM number agreeing, and its citation and term
  validation were clean - the four mislabelled terms in its frontmatter are the
  validator reading a table's commentary column as a term label, not real
  mis-bindings. It cites by author-year key rather than by PMID, so its leads
  were resolved through DOI and PubMed lookup before use; the Shimada mouse model
  came from it, and its tissue-by-tissue enzymology summary and ordered causal
  chain shaped the pathophysiology. Every quoted snippet in this entry was taken
  from the cached source, not from the report.

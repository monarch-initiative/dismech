- name: Mitochondrial Double-Stranded RNA Accumulation and Cytosolic Escape
  biological_scale: CELLULAR
  role: driver
  mechanism_confidence: PROVISIONAL
  description: >-
    Bidirectional transcription of the compact circular mitochondrial genome
    generates overlapping complementary transcripts capable of forming long
    duplexes. The SUV3-PNPase degradosome normally keeps this species highly
    unstable. When PNPase is lost the duplexes accumulate and escape into the
    cytosol - and, notably, that escape is itself PNPase-dependent, so the enzyme
    has a dual role in preventing both formation and release. This has been shown
    in patients carrying hypomorphic PNPT1 mutations, not only in knockdown
    cells. Confidence is PROVISIONAL because it is the accumulation, not its
    contribution to the patients' clinical features, that has been demonstrated.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:30046113
    reference_title: "Mitochondrial double-stranded RNA triggers antiviral signalling
      in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients carrying hypomorphic mutations in the gene PNPT1, which encodes
      PNPase, display mitochondrial double-stranded RNA accumulation coupled with upregulation
      of interferon-stimulated genes and other markers of immune activation"
    explanation: The observation in PNPT1 patients themselves, which is what makes
      this branch part of the disease rather than only a cell-biology finding.
  - reference: PMID:33199448
    reference_title: "Heterogeneity of PNPT1 neuroimaging: mitochondriopathy, interferonopathy
      or both?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PNPT1 (polynucleotide phosphorylase) is a mitochondrial protein involved
      in RNA processing where it has a dual role in the import of small RNAs into mitochondria
      and in preventing the formation and release of mitochondrial double-stranded
      RNA into the cytoplasm."
    explanation: States the dual role that makes this node a second, parallel consequence
      of the same enzymatic defect.
  downstream:
  - target: Type I Interferon Activation
    causal_link_type: DIRECT
    description: >-
      Cytosolic double-stranded RNA is read by MDA5 as a viral signature.
    evidence:
    - reference: PMID:30046113
      reference_title: "Mitochondrial double-stranded RNA triggers antiviral signalling
        in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This process engages an MDA5-driven antiviral signalling pathway that
        triggers a type I interferon response."
      explanation: Names the sensor and the pathway that carries this edge.

- name: Type I Interferon Activation
  biological_scale: ORGANISM
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Some patients with biallelic PNPT1 variants have a chronically elevated
    interferon signature in blood, and at least one presented as
    Aicardi-Goutieres syndrome with a massively elevated interferon score on
    longitudinal assessment. Two unrelated patients in a neuroimaging series had
    cystic leukoencephalopathy resembling RNASET2 deficiency, Aicardi-Goutieres
    syndrome or congenital CMV - imaging that is characteristic of an
    interferonopathy rather than of a respiratory-chain disorder.

    This node is deliberately typed as a modifier and not as an obligatory step.
    The interferon response is documented in PNPT1 deficiency and plainly
    dominates some presentations; what has not been shown is how much it
    contributes to the encephalopathy of a typical COXPD13 patient. See the
    corresponding entry under discussions.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:33158637
    reference_title: "PNPT1 mutations may cause Aicardi-Goutières-Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal assessment of the interferon signature showed a massively
      elevated interferon score and chronic type I interferon-mediated autoinflammation."
    explanation: Documents sustained interferon activation in a PNPT1 patient, measured
      over time rather than once.
  downstream:
  - target: Cystic Leukoencephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediates are unknown. The association rests on imaging resembling
      other interferonopathies in two unrelated patients, not on a demonstrated
      interferon-to-white-matter mechanism in this disease.
    evidence:
    - reference: PMID:33199448
      reference_title: "Heterogeneity of PNPT1 neuroimaging: mitochondriopathy, interferonopathy
        or both?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly, two unrelated patients exhibited cystic leukoencephalopathy
        resembling RNASET2-deficient patients, patients with Aicardi-Goutières syndrome
        (AGS) or congenital CMV infection."
      explanation: Marked INDIRECT because the finding is a radiological resemblance
        across diseases sharing interferon activation, which supports the edge by
        analogy rather than by demonstrating the step.

- name: Cellular Energy Failure in High-Demand Tissues
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With several respiratory complexes under-assembled, cells cannot meet their
    ATP demand oxidatively and lean on glycolysis. Tissues differ in how much
    slack they have, and the disease's organ selectivity follows that gradient:
    the basal ganglia and brainstem, cerebral white matter, the cochlea, the
    optic pathway and skeletal muscle are the ones that fail. The
    tissue-by-tissue enzymology in the Leigh-syndrome autopsy makes the gradient
    explicit rather than assumed.
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:28594066
    reference_title: "Novel biallelic mutations in the PNPT1 gene encoding a mitochondrial-RNA-import
      protein PNPase cause delayed myelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exogenous expression of wild-type PNPT1, but not mutants, rescued ATP
      production in patient skin fibroblasts, suggesting the pathogenicity of the identified
      mutations."
    explanation: Shows the energy deficit itself in patient cells, and that it is
      PNPase-dependent - the mutant constructs did not rescue it.
  downstream:
  - target: Lactate Accumulation
    causal_link_type: DIRECT
    description: >-
      Glycolytic compensation converts accumulating pyruvate to lactate.
  - target: Basal Ganglia and Brainstem Neuronal Injury
    causal_link_type: DIRECT
  - target: Cochlear Hair Cell and Auditory Neuron Dysfunction
    causal_link_type: DIRECT
  - target: Impaired Myelination and White Matter Injury
    causal_link_type: DIRECT

- name: Lactate Accumulation
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Lactate produced by glycolytic compensation raises plasma and sometimes CSF
    lactate. In this disease the elevation is a clue rather than a criterion: it
    is often only mild, and it was entirely normal in blood, CSF and muscle
    enzymology in one genetically confirmed family.
  evidence:
  - reference: PMID:40115456
    reference_title: "A novel polyribonucleotide nucleotidyltransferase 1 (PNPT1)
      gene variant potentially associated with combined oxidative phosphorylation deficiency
      13: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient also showed elevated lactate levels in the plasma."
    explanation: Documents the raised plasma lactate in a genetically confirmed patient.
  - reference: PMID:27759031
    reference_title: "Whole-exome sequencing identifies novel variants in PNPT1 causing
      oxidative phosphorylation defects and severe multisystem disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "blood and CSF lactate, and muscle respiratory chain enzyme assays were

    modifier: DECREASED
  evidence:
  - reference: PMID:34819353
    reference_title: "A trivalent nucleosome interaction by PHIP/BRWD2 is disrupted in neurodevelopmental disorders and cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using semisynthetic nucleosomes with defined histone post-translational
      modifications, we characterize PHIPs BD1 and BD2 as respective readers of
      H3K14ac and H4K12ac, and identify human disease-associated mutations in each
      domain and the intervening linker region that likely disrupt chromatin binding.
    explanation: >-
      Assigns the specific acetyl-lysine marks read by each bromodomain and localizes
      disease variants to those reader modules.
  - reference: PMID:34819353
    reference_title: "A trivalent nucleosome interaction by PHIP/BRWD2 is disrupted in neurodevelopmental disorders and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the PHIP/BRWD2 chromatin regulator cause the human
      neurodevelopmental disorder Chung-Jansen syndrome
    explanation: >-
      Frames PHIP explicitly as a chromatin regulator and ties it to this disorder.
  downstream:
  - target: Failure of CRL4 Substrate-Receptor Recruitment to Chromatin
    causal_link_type: DIRECT
    hypothesis_groups:
    - chromatin_reader_crl4_recruitment
    evidence:
    - reference: PMID:34819353
      reference_title: "A trivalent nucleosome interaction by PHIP/BRWD2 is disrupted in neurodevelopmental disorders and cancer."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we demonstrate that PHIP is a chromatin-associated CRL4 ubiquitin ligase
        substrate receptor and is required for CRL4 recruitment to chromatin.
      explanation: >-
        The chromatin-reading step is what licenses CRL4 recruitment, so losing the
        former directly impairs the latter.

- name: Failure of CRL4 Substrate-Receptor Recruitment to Chromatin
  description: >-
    PHIP (as DCAF14) is one of several substrate receptors of the
    CUL4-DDB1 (CRL4) E3 ubiquitin ligase, and it is specifically the
    chromatin-associated one - PHIP is required for CRL4 to be recruited to
    chromatin at all. Reduced PHIP dose therefore removes chromatin-localized CRL4
    activity, with consequences for ubiquitin-dependent turnover of chromatin
    substrates and for chromatin-templated transcription. The clinical corroboration
    of this node is the phenotypic overlap of PHIP loss with CUL4B deficiency, which
    likewise causes intellectual disability with central obesity and dysmorphism.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

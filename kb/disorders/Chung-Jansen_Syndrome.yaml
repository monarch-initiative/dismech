    reference_title: "Chung-Jansen Syndrome with obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a child with the syndrome who also had hypothyroidism and renal
      involvement in form of small kidneys on one side.
    explanation: >-
      Documents hypothyroidism in a molecularly confirmed child.
  - reference: PMID:42355777
    reference_title: "Chung-Jansen Syndrome in a Young Woman with a PHIP Variant: Severe Obesity, Intellectual Disability, and Endocrine Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory investigations documented subclinical primary hypothyroidism of
      autoimmune origin
    explanation: >-
      An independent adult case with autoimmune subclinical primary hypothyroidism.

- category: Metabolic
  name: Impaired Glucose Tolerance with Hyperinsulinism
  description: >-
    Obesity-associated dysglycaemia. In the one CHUJANS patient given a systematic
    endocrine workup, impaired glucose tolerance with hyperinsulinism was found
    alongside severe obesity. Single-case evidence only; no frequency asserted.
  phenotype_term:
    preferred_term: Impaired glucose tolerance
    term:
      id: HP:0040270
      label: Impaired glucose tolerance
  evidence:
  - reference: PMID:42355777
    reference_title: "Chung-Jansen Syndrome in a Young Woman with a PHIP Variant: Severe Obesity, Intellectual Disability, and Endocrine Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      impaired glucose tolerance with associated hyperinsulinism
    explanation: >-
      Documents dysglycaemia with hyperinsulinism in a molecularly confirmed patient
      with severe obesity.

- category: Endocrine
  name: Oligomenorrhea
  description: >-
    Oligomenorrhoea was the presenting complaint in a young woman with severe obesity
    and CHUJANS, and was worked up as a polycystic-ovarian-type endocrine picture
    (reported as polyendocrine metabolic ovarian syndrome). The bound term is the
    menstrual finding actually documented rather than an ovarian-morphology term,
    since no ovarian morphology is reported. As with the other endocrine findings
    this rests on a single detailed workup and is curated to motivate
    reproductive-endocrine assessment, not as an established disease feature.
  phenotype_term:
    preferred_term: Oligomenorrhea
    term:
      id: HP:0000876
      label: Oligomenorrhea
  evidence:
  - reference: PMID:42355777
    reference_title: "Chung-Jansen Syndrome in a Young Woman with a PHIP Variant: Severe Obesity, Intellectual Disability, and Endocrine Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      referred to our centre for evaluation of oligomenorrhea in the context of
      severe obesity
    explanation: >-
      Documents oligomenorrhoea as the presenting endocrine complaint in a
      molecularly confirmed CHUJANS patient.
  - reference: PMID:42355777
    reference_title: "Chung-Jansen Syndrome in a Young Woman with a PHIP Variant: Severe Obesity, Intellectual Disability, and Endocrine Abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      polyendocrine metabolic ovarian syndrome (PMOS, previously known as PCOS)
    explanation: >-
      The endocrine diagnosis reached; PARTIAL because the report does not state
      ovarian morphology, so no morphology term is bound.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Cumulative published case counts rather than a population rate. No validated
    population prevalence or incidence figure exists for Chung-Jansen syndrome. A
    2022 systematic literature review counted 35 patients with unique
    protein-affecting PHIP variants; the 2022 European cohort added 23 individuals
    and the 2024 natural-history study reported 47, with partial overlap between
    series, so the reported total is on the order of one hundred individuals rather
    than a precisely enumerable figure. Orphanet has a record (ORPHA:589905) but no
    Orphadata prevalence row is available in this repository's cache and the
    Orphadata refresh is currently failing a manifest checksum, so no Orphanet
    epidemiology class is quoted. PHIP alterations are described as a rare cause of
    developmental delay / intellectual disability, and the disorder is regarded as
    underdiagnosed because mildly affected transmitting parents are frequently
    recognized only retrospectively.
  evidence:
  - reference: PMID:34773373
    reference_title: "PHIP gene variants with protein modeling, interactions, and clinical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following a systematic literature review, 35 patients are reported to have
      unique PHIP variants impacting the encoded protein product.
    explanation: >-
      Gives a cumulative published case count of 35 as of the 2022 review.
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report phenotypes and genotypes of 47 individuals with likely
      pathogenic/pathogenic PHIP variants.
    explanation: >-
      The largest single reported series, 47 individuals.
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, PHIP alterations appear to be a rare cause of DD/ID.
    explanation: >-
      Directly supports the ULTRA_RARE qualitative band and the framing as a rare
      cause of DD/ID.

genetic:
- name: PHIP Pathogenic Variants
  gene_term:
    preferred_term: PHIP
    term:
      id: hgnc:15673
      label: PHIP
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PHIP lies at 6q14.1. Reported pathogenic alleles are heterozygous and span
    nonsense, frameshift, splice-site, and missense substitutions plus intragenic,
    whole-gene, and contiguous deletions; the 2022 European cohort used NM_017934.7
    as the reference transcript. There is no mutational hotspot, and the facial
    gestalt does not discriminate variant class, so genotype-based prognostication is
    not currently possible. The locus produces more than one protein product
    (PHIP/DCAF14 and NDRP) and the genotype-phenotype evidence assigns causality to
    loss of PHIP/DCAF14. Contiguous deletions extending beyond PHIP can blend in
    features attributable to co-deleted neighbouring genes, and dual molecular
    diagnoses have been reported (one patient carried pathogenic variants in both
    PHIP and CLCN4), so an atypically severe presentation warrants looking beyond the
    PHIP allele rather than assuming expressivity.
  evidence:
  - reference: PMID:29209020
    reference_title: "A genotype-first approach identifies an intellectual disability-overweight syndrome caused by PHIP haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amongst these, PHIP was shown to have an enrichment of disruptive mutations in
      the individuals with ID (5 out of 3,275).
    explanation: >-
      The statistical gene-level enrichment in an intellectual-disability cohort that
      established PHIP as an ID gene.
  - reference: PMID:31167805
    reference_title: "Clinical and genetic characterization of individuals with predicted deleterious PHIP variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an additional 10 individuals with pleckstrin homology
      domain-interacting protein (PHIP)-predicted deleterious variants (four
      frameshift, three missense, two nonsense, and one splice site; six of which are
      confirmed de novo).
    explanation: >-
      Enumerates the variant classes and the de novo proportion in an independent
      series.
  - reference: PMID:41383545
    reference_title: "Comorbidity of Attention Deficit Hyperactivity Disorder (ADHD) and Chung-Jansen Syndrome: Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole Exome Sequencing revealed pathogenic mutations in both the PHIP and CLCN4
      genes.
    explanation: >-
      Supports the dual-diagnosis caveat in the notes: an atypically severe
      presentation was explained by a second pathogenic locus, not by PHIP
      expressivity alone.

diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    Diagnosis is molecular. The facial gestalt is suggestive but not pathognomonic,
    intellectual disability is often mild, and obesity is neither congenital nor
    obligatory, so CHUJANS is normally identified by trio exome or genome sequencing
    performed for developmental delay rather than by targeted testing. PHIP should be
    on neurodevelopmental and syndromic-obesity panels. Trio (rather than
    proband-only) testing matters disproportionately here because a meaningful
    minority of alleles are inherited from a parent whose own mild learning,
    behavioral, or weight phenotype is recognized only in retrospect.
  diagnosis_term:
    preferred_term: trio exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    A heterozygous pathogenic or likely pathogenic PHIP variant establishes the
    diagnosis.
  evidence:
  - reference: PMID:27900362
    reference_title: "De novo PHIP-predicted deleterious variants are associated with developmental delay, intellectual disability, obesity, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing, we have identified novel de novo heterozygous
      pleckstrin homology domain-interacting protein (PHIP) variants that are
      predicted to be deleterious
    explanation: >-
      Whole-exome sequencing is the route by which the founding cases were
      identified.
  - reference: PMID:39437749
    reference_title: "Novel Insights: A Novel PHIP Variant in a Family with Severe Early-Onset Obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening for PHIP variants should be included in genetic testing in patients
      with severe early-onset obesity.
    explanation: >-
      Supports including PHIP on syndromic-obesity testing as well as
      neurodevelopmental testing.

- name: Copy-number analysis by chromosomal microarray or exome CNV calling
  description: >-
    Sequence-level analysis alone will miss a real fraction of cases. Intragenic,
    whole-gene, and contiguous 6q14.1 deletions encompassing PHIP are an established
    route to the phenotype, and microdeletions including PHIP were part of the
    original evidence that the mechanism is loss of function. Copy-number analysis
    should therefore run in parallel with sequencing, with qPCR or FISH used to
    confirm a detected deletion and test parental segregation.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    A heterozygous deletion involving PHIP establishes the diagnosis; a deletion
    extending well beyond PHIP predicts additional features from co-deleted genes.
  evidence:
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      technologies such as exome sequencing or array analyses have led to the
      identification of distinct types of alterations of PHIP
    explanation: >-
      Array analysis sits alongside exome sequencing as a primary detection method.
  - reference: PMID:27900362
    reference_title: "De novo PHIP-predicted deleterious variants are associated with developmental delay, intellectual disability, obesity, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with microdeletions of 6q14.1, including PHIP, have a similar
      phenotype of developmental delay, intellectual disability, hypotonia, and
      obesity
    explanation: >-
      Establishes deletions at 6q14.1 as a route to the same phenotype.

- name: DNA methylation episignature testing
  description: >-
    A specific and sensitive DNA methylation episignature for Chung-Jansen syndrome
    has been defined on Infinium Methylation EPIC arrays from patient blood. Its
    practical role is variant interpretation: it can reclassify PHIP variants of
    uncertain significance and can be deployed within a multiclass episignature
    classifier. Because the CHUJANS signature partially overlaps those of DDB1- and
    PHF6-related disorders, a combined signature for the three has also been
    developed, which means an episignature result should be read as evidence about
    this functional group rather than as a fully orthogonal single-gene test.
  diagnosis_term:
    preferred_term: DNA methylation episignature analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    A positive Chung-Jansen episignature supports pathogenicity of a PHIP variant of
    uncertain significance.
  evidence:
  - reference: PMID:38787418
    reference_title: "The detection of a strong episignature for Chung-Jansen syndrome, partially overlapping with Borjeson-Forssman-Lehmann and White-Kernohan syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These newly defined episignatures can be used as part of a multiclass
      episignature classifier for screening of affected individuals with rare
      disorders and interpretation of genetic variants of unknown clinical
      significance
    explanation: >-
      States the intended diagnostic application, VUS interpretation within a
      multiclass classifier.

- name: Polysomnography for suspected sleep-disordered breathing
  description: >-
    Sleep complaints are frequent in CHUJANS but had never been objectively
    characterized until an adult case underwent overnight polysomnography and was
    found to have severe REM-predominant obstructive sleep apnea. Polysomnography is
    therefore indicated when sleep-disordered breathing is suspected, particularly in
    individuals with obesity, rather than attributing all sleep problems to the
    behavioral phenotype.
  diagnosis_term:
    preferred_term: polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  results: >-
    An elevated apnea-hypopnea index establishes obstructive sleep apnea and
    indicates positive-airway-pressure therapy.
  evidence:
  - reference: PMID:41751879
    reference_title: "Sleep-Disordered Breathing in Chung-Jansen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite frequent reports of sleep problems, systematic evaluation of
      sleep-disordered breathing has been limited.
    explanation: >-
      Identifies the diagnostic gap that polysomnography addresses.

treatments:
- name: Multidisciplinary Developmental and Supportive Care
  description: >-
    There is no disease-modifying or PHIP-targeted therapy. Management is
    symptomatic, developmental, and anticipatory: early-intervention services,
    individualized educational support, therapy for hypotonia and motor delay,
    feeding and gastrointestinal support, ophthalmological assessment, and
    coordinated behavioral-health care. The distinctive planning message from the
    natural-history data is that the burden shifts with age - weight and mood
    problems become more prominent after childhood - so care should be structured for
    the life course rather than front-loaded into the preschool years.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings provide additional natural history data for Chung-Jansen syndrome
      and provide opportunities for early intervention of healthy eating habits and
      awareness of developing mood and behavioral challenges over the life course.
    explanation: >-
      The cohort's own framing of management as early intervention plus life-course
      awareness.
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay

- name: Speech and Language Therapy
  description: >-
    Speech and language therapy addresses the delayed speech milestones that are a
    common early feature and a frequent reason for referral.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:41383545
    reference_title: "Comorbidity of Attention Deficit Hyperactivity Disorder (ADHD) and Chung-Jansen Syndrome: Case Report and Review of Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although clinical presentations vary, behavioral problems and delayed motor and
      speech milestones are common.
    explanation: >-
      Establishes the speech-delay indication; PARTIAL because no CHUJANS-specific
      speech-therapy outcome study exists.
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development

- name: Physical Therapy
  description: >-
    Physiotherapy targets the hypotonia, motor delay, and balance/coordination
    difficulty that affect the large majority of individuals. The rationale is the
    documented motor phenotype; no CHUJANS-specific rehabilitation trial exists.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other common symptoms were hypotonia (78.7%)
    explanation: >-
      Documents the indication (hypotonia in ~79%); PARTIAL because the therapy
      itself is not evaluated in the source.
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia

- name: Occupational Therapy
  description: >-
    Occupational therapy addresses fine-motor and daily-living function. It is
    curated separately from physiotherapy because the adaptive-functioning data give
    it its own indication: daily-living-skills percentiles were low across the
    cohort, and socialisation scores were low in every individual assessed, so the
    functional deficit is not reducible to the motor phenotype physiotherapy
    addresses.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:31167805
    reference_title: "Clinical and genetic characterization of individuals with predicted deleterious PHIP variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      age-adjusted percentiles varied in communication (1%-42%; average:11.8%,
      median: 8%) and daily living skills (1%-50%; average: 12.6%, median 4%)
    explanation: >-
      Quantifies the daily-living-skills deficit that occupational therapy targets;
      PARTIAL because the therapy itself is not evaluated in the source.
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay

- name: Early Dietary and Weight-Management Intervention
  description: >-
    Because overweight and obesity emerge over time rather than being present from
    birth and become more prevalent after age 12, the natural-history data argue for
    establishing healthy eating habits early - before weight problems appear - rather
    than treating obesity reactively. This is the one management recommendation that
    follows directly from the syndrome's own mechanistic and longitudinal data
    (reduced POMC-melanocortin satiety signaling with age-dependent weight gain), and
    it is preventive in intent.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provide opportunities for early intervention of healthy eating habits
    explanation: >-
      The explicit dietary-intervention recommendation from the natural-history
      cohort.
  target_phenotypes:
  - preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  target_mechanisms:
  - target: Obesity and Overweight
    treatment_effect: INHIBITS
    description: >-
      Behavioral energy-balance management does not correct the upstream melanocortin
      deficit; it opposes the downstream weight outcome by constraining energy
      intake. The edge therefore targets the weight node rather than the
      satiety-signaling node, where an INHIBITS edge would read backwards.

- name: Continuous Positive Airway Pressure for Obstructive Sleep Apnea
  description: >-
    In the one CHUJANS patient with polysomnographically confirmed severe
    REM-predominant obstructive sleep apnea, CPAP improved respiratory and sleep
    quality indices and was well tolerated - which matters because tolerance of
    positive-airway-pressure therapy cannot be assumed in a population with
    intellectual disability. Evidence is a single case.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: continuous positive airway pressure
    term:
      id: NCIT:C124040
      label: Continuous Positive Airway Pressure
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:41751879
    reference_title: "Sleep-Disordered Breathing in Chung-Jansen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with continuous positive airway pressure improved respiratory and
      sleep quality indices and was well tolerated.
    explanation: >-
      Direct outcome evidence for CPAP in a molecularly confirmed CHUJANS patient.
  target_phenotypes:
  - preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea

- name: Longitudinal Behavioral-Health, Weight, and Urorenal Surveillance
  description: >-
    Three surveillance streams are specifically indicated by the CHUJANS literature
    rather than by generic syndromic practice: mood and behavior into adolescence and
    adulthood, because depression is significantly more frequent after age 12; BMI
    over time, because obesity emerges and increases with age; and urorenogenital
    evaluation, because CAKUT is a variably expressive part of the spectrum that was
    missed in the original delineation. Endocrine assessment (thyroid function,
    glucose tolerance, reproductive endocrine status) has also been proposed on the
    basis of a detailed adult workup. Recorded with the generic NCIT disease-screening
    action because NCIT has no clinical-intervention term for longitudinal
    surveillance.
  action_category: SCREENING
  treatment_term:
    preferred_term: complication surveillance
    term:
      id: NCIT:C15419
      label: Disease Screening
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      awareness of developing mood and behavioral challenges over the life course
    explanation: >-
      Supports the behavioral-health surveillance stream.
  - reference: PMID:39156152
    reference_title: "Pathogenic PHIP Variants are Variably Associated With CAKUT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, patients with CHUJANS should be clinically evaluated for
      urorenogenital manifestations.
    explanation: >-
      Supports the urorenal surveillance stream.
  - reference: PMID:42355777
    reference_title: "Chung-Jansen Syndrome in a Young Woman with a PHIP Variant: Severe Obesity, Intellectual Disability, and Endocrine Abnormalities."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case suggests the inclusion of comprehensive endocrine evaluations in
      future studies on patients with Chung-Jansen syndrome, in order to support
      endocrine work-up and facilitate early identification and appropriate
      management of potentially treatable alterations.
    explanation: >-
      Proposes endocrine surveillance; PARTIAL because it is a single-case
      recommendation framed as a suggestion for future study.

- name: Genetic Counseling and Parental Testing
  description: >-
    Counseling must cover the 50% transmission risk for an affected heterozygote and,
    more subtly, the fact that a clinically unremarkable parent may nonetheless carry
    the variant - inherited alleles from mildly affected parents are well documented,
    and severity cannot be predicted from genotype. Parental testing is therefore not
    optional bookkeeping but the step that determines recurrence risk and identifies
    previously undiagnosed relatives.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      outlines the importance of a thorough clinical evaluation combined with genetic
      analyses for accurate diagnosis and counselling
    explanation: >-
      The cohort's explicit counseling recommendation, grounded in the observed
      inherited cases.
  - reference: PMID:39437749
    reference_title: "Novel Insights: A Novel PHIP Variant in a Family with Severe Early-Onset Obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our finding expands the spectrum of disease-causing variants in PHIP and
      demonstrates variable intrafamilial clinical expressivity and severity.
    explanation: >-
      Documents the intrafamilial variability that counseling must convey.

clinical_trials:
- name: NCT01238250
  description: >-
    Simons Searchlight, an international online observational registry that collects
    medical, behavioral, learning, and developmental data plus biospecimens from
    families with rare genetic variants causing neurodevelopmental disorders. It is
    the main real-world data-collection route available to CHUJANS families and the
    most concrete existing mechanism for overcoming the small-cohort problem in this
    disorder. It is observational and does not test any treatment.
  evidence:
  - reference: clinicaltrials:NCT01238250
    reference_title: "Online Study of People Who Have Genetic Changes and Features of Autism: Simons Searchlight"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Simons Searchlight is an observational, online, international research program
      for families with rare genetic variants that cause neurodevelopmental disorders
      and may be associated with autism.
    explanation: >-
      Confirms the registry's design and scope. Support is PARTIAL because the cached
      ClinicalTrials.gov record describes eligibility generically as rare genetic
      variants that cause neurodevelopmental disorders and does not itself name PHIP,
      so PHIP-specific eligibility is not verifiable from this record.

differential_diagnoses:
- name: Prader-Willi syndrome
  description: >-
    The archetypal intellectual-disability-plus-obesity syndrome and the first
    differential a clinician will reach for. Discriminators favouring Prader-Willi
    are neonatal hypotonia with failure to thrive followed by a distinct hyperphagic
    phase, hypogonadism, short stature, and the 15q11-q13 imprinting mechanism.
    Objective facial phenotyping separates the two: PHIP patients differ
    significantly from the average Prader-Willi face.
  disease_term:
    preferred_term: Prader-Willi syndrome
    term:
      id: MONDO:0008300
      label: Prader-Willi syndrome
  evidence:
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      show a significant difference to the average face of healthy individuals as
      well as to individuals with Prader-Willi syndrome (PWS, OMIM #176270)
    explanation: >-
      GestaltMatcher analysis explicitly separates the CHUJANS facial gestalt from
      Prader-Willi.

- name: X-linked intellectual disability, Cabezas type (CUL4B)
  description: >-
    Mechanistically the closest neighbour: CUL4B is the cullin scaffold of the very
    CRL4 ligase for which PHIP is a substrate receptor, and CUL4B deficiency causes
    intellectual disability with central obesity, muscle wasting, and dysmorphism -
    an overlap that was itself used as an argument that PHIP acts through the
    ubiquitin ligase pathway. Discriminators are the X-linked inheritance and male
    predominance of the CUL4B disorder; facial phenotyping also separates the two.
  disease_term:
    preferred_term: Cabezas syndrome
    term:
      id: MONDO:0010306
      label: X-linked intellectual disability, Cabezas type
  evidence:
  - reference: PMID:27900362
    reference_title: "De novo PHIP-predicted deleterious variants are associated with developmental delay, intellectual disability, obesity, and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CUL4B deficiency has been associated with intellectual disability, central
      obesity, muscle wasting, and dysmorphic features.
    explanation: >-
      States the overlapping CUL4B phenotype that makes it a differential and a
      mechanistic neighbour.
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      or with a CUL4B-alteration (Intellectual developmental disorder, X-linked,
      syndromic, Cabezas type, OMIM #300354)
    explanation: >-
      Facial phenotyping separates CHUJANS from the CUL4B disorder.

- name: Cornelia de Lange syndrome
  description: >-
    The prominent/full eyebrows with synophrys, anteverted nares, and long philtrum
    make CHUJANS a genuine phenocopy of the CdLS facial gestalt, and at least one
    family was worked up as CdLS - with an initially negative CdLS-focused exome
    reanalysis - before the PHIP variant was found. Discriminators favouring CdLS are
    upper-limb reduction defects, marked growth restriction, hirsutism, and
    cohesin-complex genes. The published recommendation is to include PHIP in
    CdLS-spectrum gene analysis.
  disease_term:
    preferred_term: Cornelia de Lange syndrome
    term:
      id: MONDO:0016033
      label: Cornelia de Lange syndrome
  evidence:
  - reference: PMID:36843271
    reference_title: "Chung-Jansen syndrome can mimic Cornelia de Lange syndrome: Another player among chromatinopathies?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHUJANS shows a significant overlap with the CdLS spectrum, with specific
      regard to facial gestalt.
    explanation: >-
      Establishes the facial overlap that drives the diagnostic confusion.
  - reference: PMID:36843271
    reference_title: "Chung-Jansen syndrome can mimic Cornelia de Lange syndrome: Another player among chromatinopathies?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest to include PHIP among genes routinely analyzed in patients belonging
      to the CdLS spectrum
    explanation: >-
      The practical testing recommendation that follows from the overlap.

- name: Borjeson-Forssman-Lehmann syndrome (PHF6)
  description: >-
    An X-linked intellectual disability syndrome with obesity that is both a clinical
    and a molecular neighbour: its DNA methylation episignature partially overlaps
    that of CHUJANS, and a combined episignature covering both disorders (plus
    White-Kernohan syndrome) has been developed. This overlap is not coincidence -
    PHF6, like PHIP, is a chromatin-associated protein - which is precisely why an
    episignature result should be interpreted as evidence about this functional group
    rather than as a single-gene readout.
  disease_term:
    preferred_term: Borjeson-Forssman-Lehmann syndrome
    term:
      id: MONDO:0010537
      label: Borjeson-Forssman-Lehmann syndrome
  evidence:
  - reference: PMID:38787418
    reference_title: "The detection of a strong episignature for Chung-Jansen syndrome, partially overlapping with Borjeson-Forssman-Lehmann and White-Kernohan syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Börjeson-Forssman-Lehmann syndrome (caused by variants in PHF6 gene)
    explanation: >-
      Named as one of the two functionally related, clinically partially overlapping
      disorders sharing methylation-profile similarity with CHUJANS.

- name: White-Kernohan syndrome (DDB1)
  description: >-
    Caused by variants in DDB1, the CRL4 adaptor that PHIP itself docks onto as a
    substrate receptor - so this is the most direct pathway-level differential in the
    set. It shares a partially overlapping methylation episignature with CHUJANS, and
    the two are handled together in the combined episignature classifier.
  disease_term:
    preferred_term: White-Kernohan syndrome
    term:
      id: MONDO:0859169
      label: White-Kernohan syndrome
  evidence:
  - reference: PMID:38787418
    reference_title: "The detection of a strong episignature for Chung-Jansen syndrome, partially overlapping with Borjeson-Forssman-Lehmann and White-Kernohan syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      White-Kernohan syndrome (caused by variants in DDB1 gene)
    explanation: >-
      Named as the other functionally related disorder sharing an overlapping
      episignature; DDB1 is the CRL4 adaptor PHIP works through.

- name: Pitt-Hopkins syndrome (TCF4)
  description: >-
    Not a classical CHUJANS differential, but added because a child whose
    craniofacial phenotype and Face2Gene analysis both suggested a
    Pitt-Hopkins-like condition was found instead to carry a novel PHIP variant,
    expanding the recognized phenotypic spectrum. The lesson is that facial-analysis
    software pointing away from CHUJANS does not exclude it.
  disease_term:
    preferred_term: Pitt-Hopkins syndrome
    term:
      id: MONDO:0012589
      label: Pitt-Hopkins syndrome
  evidence:
  - reference: PMID:39594970
    reference_title: "Broadening the PHIP-Associated Neurodevelopmental Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The unusual clinical presentation of this novel patient resembles a PTHS-like
      condition. However, a novel variant in PHIP has been unexpectedly detected,
      expanding the phenotypic spectrum of CHUJANS.
    explanation: >-
      Documents the PTHS-like presentation resolved as CHUJANS.

discussions:
- discussion_id: chujans_pomc_mechanism_cell_context
  prompt: >-
    Does the demonstration that nuclear PHIP enhances POMC transcription, and that
    disease variants repress it, hold in human hypothalamic POMC neurons - the cells
    where the mechanism must operate for it to explain the obesity phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Repressed POMC Transcription
  - pathophysiology#Impaired Central Melanocortin Satiety Signaling
  rationale: >-
    The POMC branch is the best-developed mechanistic account of any CHUJANS feature,
    but it rests on cell-based reporter and localization experiments rather than on
    human hypothalamic neurons, and the clinical phenotype it purports to explain is
    not fully penetrant - roughly 44% of individuals in the largest cohort are
    neither obese nor overweight. Two failure modes are therefore live: the effect
    could be real but quantitatively insufficient on its own, requiring modifiers to
    produce obesity; or it could be a property of the assay context. Either way the
    inference from a transfected-cell reporter to arcuate POMC neuron biology is
    currently unbridged, and the entry's mechanism_confidence values for this arm
    (PROVISIONAL, not ESTABLISHED) reflect that.
  proposed_experiments:
  - experiment_id: exp_chujans_ipsc_hypothalamic_pomc
    name: PHIP allelic series in human iPSC-derived hypothalamic POMC neurons
    description: >-
      In an isogenic human iPSC background, build a PHIP allelic series (heterozygous
      null, plus heterozygous patient truncating and missense alleles) and
      differentiate to arcuate-like hypothalamic
      cultures containing POMC neurons. Read out POMC transcript and peptide levels,
      leptin responsiveness, PHIP occupancy at the POMC locus, and the local
      chromatin marks PHIP reads (H3K4me3, H3K14ac, H4K12ac). This tests, at
      human-matched zygosity and in the correct cell type, whether the reporter
      finding reproduces and whether it is chromatin-reading-dependent.
    experiment_type:
      preferred_term: isogenic allelic-series loss-of-function experiment

- discussion_id: chujans_chromatin_reader_to_neurodevelopment_gap
  prompt: >-
    Which genes and regulatory elements lose PHIP-dependent chromatin reading and
    CRL4 recruitment in the developing human brain, and how does that produce the
    specific CHUJANS neurodevelopmental and behavioral phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of CRL4 Substrate-Receptor Recruitment to Chromatin
  - pathophysiology#Disrupted Neurodevelopmental Gene Expression Program
  rationale: >-
    The molecular top of the pathograph is unusually well resolved for a
    chromatinopathy - the reader domains, their histone marks, the CRL4 recruitment
    step, and a patient-level methylation episignature are all established - and the
    clinical bottom is well characterized across three cohorts. The middle is empty.
    No CHUJANS-specific patient neuron, brain organoid, or brain transcriptomic
    dataset exists, so no mis-regulated target gene has been identified, and the
    episignature's differentially methylated loci have not been connected to
    neurodevelopmental effector genes. This is why the neurodevelopmental node in
    this entry is tagged HYPOTHETICAL despite the phenotype itself being certain: the
    uncertainty is about the route, not the destination.
  proposed_experiments:
  - experiment_id: exp_chujans_chip_and_transcriptome_neurons
    name: PHIP and CRL4 chromatin occupancy plus transcriptome in PHIP-haploinsufficient human neurons
    description: >-
      Map PHIP and CUL4/DDB1 occupancy genome-wide (CUT&RUN or ChIP-seq) in wild-type
      versus PHIP-haploinsufficient human iPSC-derived cortical neurons and
      progenitors, alongside RNA-seq, ATAC-seq, and profiling of H3K4me3, H3K14ac,
      and H4K12ac. Intersect sites of lost PHIP/CRL4 occupancy with differentially
      expressed genes and with the differentially methylated loci that define the
      blood episignature, to identify candidate effector genes bridging the reader
      defect and the neurodevelopmental phenotype.
    experiment_type:
      preferred_term: chromatin occupancy and transcriptome profiling

- discussion_id: chujans_replication_instability_clinical_consequence
  prompt: >-
    Does the replication-fork protection defect caused by CHUJANS PHIP/DCAF14
    variants produce any measurable clinical consequence - genome instability, cancer
    predisposition, or a contribution to the neurodevelopmental phenotype - in
    affected individuals?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Replication Fork Destabilization Under Replication Stress
  rationale: >-
    Two patient missense alleles demonstrably impair replication fork progression and
    stalled-fork protection, and the authors explicitly predict
    replication-associated genome instability in the syndrome. But that prediction
    has never been tested in patients: no CHUJANS cohort has been screened for
    chromosomal instability, no cancer incidence data exist, and the tested alleles
    are two missense variants rather than the truncating alleles that dominate the
    reported spectrum. PHIP expression alterations are separately linked to cancer,
    which makes the question non-trivial rather than academic. Until it is answered,
    this arm cannot be given a clinical downstream and no surveillance recommendation
    can be justified from it.
  proposed_experiments:
  - experiment_id: exp_chujans_patient_genome_instability
    name: Genome-instability and neoplasia assessment in a CHUJANS cohort
    description: >-
      In patient-derived lymphoblastoid or fibroblast lines spanning truncating,
      deletion, and missense PHIP alleles, measure baseline and induced chromosomal
      instability (micronucleus formation, chromosome aberrations, replication-stress
      markers, DNA fiber fork progression) against controls. In parallel, assemble
      cancer and neoplasia incidence from an international CHUJANS registry cohort
      (for example via Simons Searchlight) to determine whether the in vitro defect
      has any epidemiological correlate.
    experiment_type:
      preferred_term: patient-derived cell genome instability assay

- discussion_id: chujans_population_prevalence_unknown
  prompt: >-
    What is the true population prevalence of Chung-Jansen syndrome, and how much of
    the apparent rarity is underdiagnosis of mildly affected individuals?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PHIP Haploinsufficiency
  rationale: >-
    No validated prevalence or incidence estimate exists; only cumulative published
    case counts on the order of one hundred individuals. Two features make the
    published count a likely underestimate rather than a reasonable proxy: alleles
    are repeatedly inherited from parents whose learning, behavioral, or weight
    phenotype was recognized only after their child was diagnosed, and the cardinal
    features (mild learning difficulty, ADHD, anxiety, overweight) are individually
    common and unlikely to trigger genetic testing in isolation. Reliable
    denominators would come from unbiased population-scale sequencing rather than
    from further clinically ascertained cohorts.
  proposed_experiments:
  - experiment_id: exp_chujans_biobank_prevalence
    name: Population-scale PHIP loss-of-function ascertainment with reverse phenotyping
    description: >-
      Query large unselected biobank and population sequencing resources for
      high-confidence PHIP loss-of-function alleles, then reverse-phenotype carriers
      for cognitive, behavioral, anthropometric, and urorenal traits. This yields both
      a genotype-first prevalence estimate and a penetrance estimate for each cardinal
      feature that is not distorted by clinical ascertainment.
    experiment_type:
      preferred_term: genotype-first population cohort study

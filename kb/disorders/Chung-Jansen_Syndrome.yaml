      It is characterized by developmental delay, intellectual disability, behavioral
      disturbances including autism spectrum disorder and attention deficit
      hyperactivity disorder, obesity, and distinct facial dysmorphism such as
      synophrys and an upturned nose.
    explanation: >-
      A dedicated case report and review confirming ADHD as a characteristic
      behavioral manifestation.


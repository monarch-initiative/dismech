- category: Genitourinary
  name: Congenital Anomalies of the Kidney and Urinary Tract
  frequency: OCCASIONAL
  description: >-
    Urorenogenital malformation is a genuine but variably expressive part of the
    CHUJANS spectrum, recovered only when CHUJANS and CAKUT cohorts were
    cross-interrogated. Reported anomalies include hypoplastic kidney. The reported
    frequency range (5-35%) is wide because ascertainment differs sharply between
    neurodevelopmental and nephrology cohorts; the conservative OCCASIONAL band is
    assigned on the lower, neurodevelopmental-cohort end. The bound term is the
    urinary-system abnormality rather than a renal-morphology term, because CAKUT and

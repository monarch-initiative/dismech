    reference_title: "Sleep-Disordered Breathing in Chung-Jansen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overnight polysomnography revealed a severe rapid eye movement-predominant
      obstructive sleep apnea syndrome with an apnea-hypopnea index of 31.9 events
      per hour
    explanation: >-
      Objective polysomnographic documentation of severe OSA in a molecularly
      confirmed patient.
  - reference: PMID:41751879

  - reference: PMID:33867250
    reference_title: "Chung-Jansen Syndrome with obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a child with the syndrome who also had hypothyroidism and renal
      involvement in form of small kidneys on one side.
    explanation: >-
      An independent case with unilateral small kidney, an example of the renal
      anomaly spectrum.


  - reference: PMID:39156152
    reference_title: "Pathogenic PHIP Variants are Variably Associated With CAKUT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, patients with CHUJANS should be clinically evaluated for

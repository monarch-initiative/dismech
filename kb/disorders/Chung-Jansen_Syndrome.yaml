name: Chung-Jansen Syndrome
creation_date: "2026-08-01T18:45:00Z"
synonyms:
- CHUJANS
- PHIP-associated Chung-Jansen syndrome
- PHIP-related behavioral problems-intellectual disability-obesity-dysmorphic features syndrome
- Developmental delay, intellectual disability, obesity, and dysmorphic features
- DIDOD syndrome
- BIDOD syndrome
- PHIP haploinsufficiency syndrome
- Intellectual disability-overweight syndrome
description: >-
  Chung-Jansen syndrome (CHUJANS; OMIM #617991) is a rare autosomal dominant
  neurodevelopmental disorder caused by heterozygous loss-of-function variants in
  PHIP. PHIP is not a chromatin writer or eraser but a multivalent chromatin
  reader: it binds the nucleosome through a trivalent module - an H3K4-methyl
  binding Tudor domain plus two bromodomains that read H3K14ac (BD1) and H4K12ac
  (BD2) - and, so bound, serves as the chromatin-associated substrate receptor
  (DCAF14) that recruits the CRL4 ubiquitin ligase to chromatin. Disease-associated
  variants fall in each of these reader domains and in the intervening linker,
  placing CHUJANS squarely in the chromatinopathy / epigenetic-machinery class of
  neurodevelopmental disorders rather than among generic NDD genes. Consistent with
  that placement, affected individuals carry a specific and sensitive DNA
  methylation episignature that partially overlaps the episignatures of two other
  functionally related disorders in the same axis, Borjeson-Forssman-Lehmann
  syndrome (PHF6) and White-Kernohan syndrome (DDB1, the CRL4 adaptor PHIP works
  through). The clinical core is developmental delay with mild-to-moderate learning
  disability or intellectual disability, behavioral and psychiatric problems
  (prominently ADHD, anxiety, and later depression), a recognizable craniofacial
  gestalt (large ears/earlobes, prominent eyebrows and synophrys, anteverted nares,
  long philtrum), hypotonia, and childhood- to puberty-onset overweight or obesity.
  Obesity is the best-explained feature mechanistically: nuclear PHIP directly
  enhances transcription of POMC, and disease-associated variants repress it,
  connecting PHIP dosage to central leptin-melanocortin satiety signaling. A
  separate arm of PHIP/DCAF14 biology - replication fork protection under
  replication stress - is also disrupted by patient variants. Expressivity is wide:
  a substantial minority of alleles are inherited from a mildly affected parent, and
  obesity is not obligatory.
category: Mendelian

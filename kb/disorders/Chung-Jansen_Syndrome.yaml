  description: >-
    Reduced POMC-derived melanocortin tone weakens the central satiety signal
    downstream of leptin, biasing energy balance toward positive. Clinically this
    manifests as overweight or obesity that is not usually present at birth but
    emerges between early childhood and puberty and becomes more prevalent with age -
    so a normal weight in a young child does not exclude the diagnosis or predict a
    normal adult weight.

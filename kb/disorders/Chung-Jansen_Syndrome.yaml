    Chung-Jansen syndrome for the first time, in an adult with intellectual
    disability in whom severe REM-predominant OSA prompted the syndromic workup that
    made the molecular diagnosis. Because sleep complaints are frequent but had never
    been objectively characterized, the reported case supports proactive OSA
    screening, particularly in individuals with obesity. No frequency band is
    asserted - this is a single case, not a prevalence estimate.
  phenotype_term:
    preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea

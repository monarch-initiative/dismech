notes: >-
  Naming. The file and entry use "Chung-Jansen Syndrome", the eponym in universal
  clinical and literature use (it is an EXACT synonym of MONDO:0035133, sourced from
  both OMIM:617991 and Orphanet:589905, and is the title term of essentially every
  cohort paper since 2022). The MONDO primary label is the long descriptive
  "PHIP-related behavioral problems-intellectual disability-obesity-dysmorphic
  features syndrome"; that string is retained verbatim as the bound term.label and
  as a synonym, but is not usable as a display name. Earlier literature also used
  the acronyms DIDOD and BIDOD.

  GeneReviews. No GeneReviews chapter exists for Chung-Jansen syndrome or PHIP
  (PubMed searches for "Chung-Jansen GeneReviews" and "PHIP gene GeneReviews"
  returned zero records on 2026-08-01). The phenotype baseline for this entry is
  therefore the primary cohort literature: Jansen 2018 (n=23), Kampmeier 2022
  (n=23), and Sudnawa 2024 (n=47, the largest and most quantitative).

  Prevalence. Orphanet has a record (ORPHA:589905) but no Orphadata-derived
  prevalence row is available in this repository's cache and the Orphadata refresh is
  currently broken on a manifest checksum, so only a qualitative literature-based
  band is recorded.

  Numbers not carried over. The Edison deep-research report quoted several figures
  from Marenne et al. full text (burden-test odds ratio and p-value, the specific
  dominant-negative variant list, the nuclear-to-cytoplasmic ratio p-value, and mouse
  Phip-null growth/survival data) that are not present in the cached abstract. Those
  were deliberately excluded from both snippets and prose rather than asserted from
  an unverifiable source.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PHIP variants act dominantly through haploinsufficiency. Most
    probands carry de novo alleles, but a consistent minority are inherited from a
    mildly affected parent, and multigenerational segregation has been documented -
    so a normal-appearing parent should not be assumed to be a non-carrier without
    testing. Penetrance for the neurodevelopmental core appears high; penetrance for
    obesity specifically is incomplete.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:37961033
    reference_title: "Clinical phenotypes of individuals with Chung-Jansen syndrome across age groups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were de novo in 61.7%, unknown inheritance in 29.8%, and inherited in
      8.5%.
    explanation: >-
      Quantifies the de novo versus inherited split in the largest reported cohort.
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Follow-up investigations (e.g. Sanger sequencing, qPCR or
      Fluorescence-in-situ-Hybridization) and segregation analysis showed either de
      novo occurrence or inheritance from an also (mildly) affected parent.
    explanation: >-
      Documents both de novo origin and transmission from a mildly affected parent in
      the same European cohort.
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fact that some variants were inherited from a mildly affected parent
      further illustrates the variability of the associated phenotype
    explanation: >-
      Directly supports the VARIABLE expressivity assignment.
  - reference: PMID:39437749
    reference_title: "Novel Insights: A Novel PHIP Variant in a Family with Severe Early-Onset Obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further genetic testing in family members revealed segregation of the same PHIP
      variant in the brother and mother, who both presented with severe childhood
      obesity and developmental delay or learning difficulties.
    explanation: >-
      A three-member family with the same allele demonstrates dominant vertical
      transmission and intrafamilial variability.

mechanistic_hypotheses:
- hypothesis_group_id: chromatin_reader_crl4_recruitment
  hypothesis_label: Trivalent Chromatin Reading and CRL4 Recruitment Failure Branch
  status: CANONICAL
  description: >-
    The canonical molecular lesion is loss of PHIP's activity as a multivalent
    chromatin reader. PHIP engages the nucleosome through three coordinated reader
    surfaces - a Tudor domain reading H3K4 methylation, BD1 reading H3K14ac, and BD2
    reading H4K12ac - and it is this chromatin engagement that allows PHIP to act as
    the substrate receptor recruiting the CRL4 ubiquitin ligase to chromatin.
    Disease-associated PHIP variants map into each reader domain and into the linker
    between them, and are predicted to disrupt chromatin binding. This is the branch
    that makes CHUJANS a chromatinopathy rather than a generic NDD, and it is
    corroborated at the patient level by the disorder's DNA methylation episignature
    and by that signature's overlap with the PHF6 and DDB1 disorders.
  evidence:
  - reference: PMID:34819353
    reference_title: "A trivalent nucleosome interaction by PHIP/BRWD2 is disrupted in neurodevelopmental disorders and cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PHIP binds to chromatin through a trivalent reader domain consisting of a
      H3K4-methyl binding Tudor domain and two bromodomains (BD1 and BD2).
    explanation: >-
      Defines the trivalent reader architecture that this hypothesis branch is built
      on.
- hypothesis_group_id: pomc_melanocortin_repression
  hypothesis_label: POMC Repression / Central Melanocortin Branch
  status: EMERGING
  description: >-
    The obesity arm has its own, mechanistically distinct and comparatively
    well-developed model: nuclear PHIP directly enhances transcription of POMC, the
    precursor of the anorexigenic melanocortin peptides, and obesity-associated PHIP
    variants repress POMC transcription - linking PHIP dosage to central
    leptin-melanocortin satiety signaling. The status is EMERGING rather than
    CANONICAL because the demonstration is cell-based rather than in human
    hypothalamic POMC neurons, and because obesity is not fully penetrant in
    CHUJANS. This branch is not a competitor to the chromatin-reader branch; it is
    plausibly a tissue-specific readout of the same transcriptional-coactivator
    deficit, but that connection has not been shown directly.
  evidence:
  - reference: PMID:32492392
    reference_title: "Exome Sequencing Identifies Genes and Gene Sets Contributing to Severe Childhood Obesity, Linking PHIP Variants to Repressed POMC Transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cells, we found that nuclear PHIP (pleckstrin homology domain interacting
      protein) directly enhances transcription of pro-opiomelanocortin (POMC), a
      neuropeptide that suppresses appetite. Obesity-associated PHIP variants
      repressed POMC transcription.
    explanation: >-
      The primary functional result underpinning this branch, and the explicit basis
      for its IN_VITRO evidence tag.
- hypothesis_group_id: replication_stress_genome_integrity
  hypothesis_label: Replication Fork Protection / Genome Integrity Branch
  status: EMERGING
  description: >-
    Full-length PHIP is also DCAF14, a replication stress response protein. Two
    CHUJANS missense variants in different functional elements (the WD40 repeat
    domain and the pleckstrin-homology-binding region) both cause defective
    replication fork progression under replication stress and fail to complete DNA
    replication after genotoxic insult. Whether this replication-associated genome
    instability contributes to the clinical phenotype - as opposed to being a
    parallel consequence of the same protein loss - is unresolved; no
    CHUJANS-specific cancer predisposition or chromosome-instability clinical
    phenotype has been established.
  evidence:
  - reference: PMID:35863899
    reference_title: "PHIP variants associated with Chung-Jansen syndrome disrupt replication fork stability and genome integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using DNA fiber assays, we reveal that cells expressing either variant exhibit
      defective replication fork progression in conditions of replication stress.
    explanation: >-
      Establishes the replication-stress defect for patient-derived CHUJANS alleles.

pathophysiology:
- name: Heterozygous PHIP Loss-of-Function Variation
  description: >-
    The initiating lesion is a heterozygous, usually germline PHIP variant at 6q14.1.
    The allelic spectrum is broad and shows no clustering hotspot: nonsense and
    frameshift truncations, splice variants, missense substitutions, and intragenic,
    whole-gene, or contiguous deletions extending into adjacent genomic regions are
    all reported. Larger deletions can produce a blended phenotype because
    neighbouring genes are co-deleted.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: PHIP
    term:
      id: hgnc:15673
      label: PHIP
  evidence:
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including, truncating variants, missense substitutions, splice variants and
      large deletions encompassing portions of the gene or the entire gene as well as
      adjacent genomic regions
    explanation: >-
      Enumerates the reported allelic classes, including structural alleles.
  - reference: PMID:31167805
    reference_title: "Clinical and genetic characterization of individuals with predicted deleterious PHIP variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation spectrum is diverse, and there is no clustering of mutations
      across the protein.
    explanation: >-
      Establishes the absence of a mutational hotspot, which is why the entry models
      dosage loss rather than a domain-restricted allele class.
  downstream:
  - target: PHIP Haploinsufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27900362
      reference_title: "De novo PHIP-predicted deleterious variants are associated with developmental delay, intellectual disability, obesity, and dysmorphic features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with microdeletions of 6q14.1, including PHIP, have a similar
        phenotype of developmental delay, intellectual disability, hypotonia, and
        obesity, suggesting that the phenotype of our patients is a result of
        loss-of-function mutations.
      explanation: >-
        The convergence of point alleles and whole-gene deletions on one phenotype is
        the classic argument that the operative consequence is loss of function.

- name: PHIP Haploinsufficiency
  description: >-
    Loss of one functional PHIP allele halves the dose of the chromatin-reader /
    CRL4 substrate receptor. Haploinsufficiency, not a gain of function, is the
    accepted mechanism, and the genotype-phenotype analysis that delineated the
    syndrome assigned the causal isoform specifically to PHIP/DCAF14 rather than to
    the alternative NDRP product of the same locus. The same locus additionally
    encodes a protein implicated in IGF-1 signalling, so PHIP dosage loss is not
    confined to the nuclear chromatin arm.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: PHIP
    term:
      id: hgnc:15673
      label: PHIP
  evidence:
  - reference: PMID:29209020
    reference_title: "A genotype-first approach identifies an intellectual disability-overweight syndrome caused by PHIP haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed genotype-phenotype analysis points towards haploinsufficiency of
      PHIP/DCAF14, and not NDRP, as the underlying cause of the phenotype.
    explanation: >-
      Assigns haploinsufficiency, and specifically the PHIP/DCAF14 isoform, as the
      disease mechanism.
  - reference: PMID:39156152
    reference_title: "Pathogenic PHIP Variants are Variably Associated With CAKUT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neurodevelopmental disorder Chung-Jansen syndrome (CHUJANS) is caused by

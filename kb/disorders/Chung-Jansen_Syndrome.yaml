    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      weight problems (13/23)
    explanation: >-
      13/23 (57%) in an independent European cohort, concordant with the FREQUENT
      band.
  - reference: PMID:31167805
    reference_title: "Clinical and genetic characterization of individuals with predicted deleterious PHIP variants."

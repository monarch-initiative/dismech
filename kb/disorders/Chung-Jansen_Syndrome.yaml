        Links the E3-ubiquitination arm to neurodevelopmental processes; support is
        PARTIAL because no patient-neuron transcriptomic dataset resolves the
        intervening steps.

- name: Chung-Jansen DNA Methylation Episignature
  description: >-
    Affected individuals carry a specific and sensitive genome-wide DNA methylation
    signature detectable on Infinium Methylation EPIC arrays. Two things make this
    more than a diagnostic convenience. First, it is direct patient-level (not
    cell-line) evidence that PHIP haploinsufficiency perturbs the epigenome, which is
    the prediction of the chromatin-reader model. Second, the CHUJANS signature
    partially overlaps those of White-Kernohan syndrome (DDB1 - the very CRL4 adaptor
    that PHIP docks onto) and Borjeson-Forssman-Lehmann syndrome (PHF6, another
    chromatin-associated NDD protein), so the shared episignature independently
    recovers the functional relationship rather than merely the clinical resemblance.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:38787418
    reference_title: "The detection of a strong episignature for Chung-Jansen syndrome, partially overlapping with Borjeson-Forssman-Lehmann and White-Kernohan syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed the DNAm profiles of affected individuals with pathogenic and
      likely pathogenic PHIP variants with Infinium Methylation EPIC arrays and
      report a specific and sensitive DNAm episignature biomarker for Chung-Jansen
      syndrome.
    explanation: >-
      Establishes the existence and diagnostic character of the episignature in
      patients.
  - reference: PMID:38787418
    reference_title: "The detection of a strong episignature for Chung-Jansen syndrome, partially overlapping with Borjeson-Forssman-Lehmann and White-Kernohan syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed similarities between the methylation profile of Chung-Jansen
      syndrome and that of functionally related and clinically partially overlapping
      genetic disorders, White-Kernohan syndrome (caused by variants in DDB1 gene)
      and Börjeson-Forssman-Lehmann syndrome (caused by variants in PHF6 gene)
    explanation: >-
      The cross-disorder overlap with DDB1 and PHF6 disorders is the evidence that
      the signature reflects shared chromatin-machinery pathophysiology.

- name: Replication Fork Destabilization Under Replication Stress
  description: >-
    A mechanistically separate consequence of PHIP/DCAF14 loss. Two CHUJANS missense
    variants located in different functional elements of DCAF14 - one in the WD40
    repeat domain, one in the pleckstrin-homology-binding region - both cause
    defective replication fork progression under replication stress and both fail to
    complete DNA replication after genotoxic exposure, implicating DCAF14 in the
    protection of stalled forks. The authors accordingly predict
    replication-associated genome instability in CHUJANS. Note that this is a
    prediction: no clinical instability phenotype (cancer predisposition, chromosome
    breakage) has been demonstrated in CHUJANS patients, so this node is modelled as
    a cellular defect without a curated clinical consequence.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: replication fork processing
    term:
      id: GO:0031297
      label: replication fork processing
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35863899
    reference_title: "PHIP variants associated with Chung-Jansen syndrome disrupt replication fork stability and genome integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The variants p.D488V and p.E963G occur in different functional elements of
      DCAF14- WD40 repeat domain and pleckstrin homology-binding region (PBR),
      respectively.
    explanation: >-
      Identifies the two patient alleles tested and their domain locations.
  - reference: PMID:35863899
    reference_title: "PHIP variants associated with Chung-Jansen syndrome disrupt replication fork stability and genome integrity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, unlike wild type DCAF14, both variants fail to accomplish DNA
      replication after exposure to genotoxic stress indicating a critical role of
      DCAF14 in protecting stalled replication forks.
    explanation: >-
      Demonstrates the stalled-fork protection defect for both patient variants.
  - reference: PMID:35863899
    reference_title: "PHIP variants associated with Chung-Jansen syndrome disrupt replication fork stability and genome integrity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Thus, we have identified replication defects associated with CJS variants and
      predict replication-associated genome instability with CJS syndrome.
    explanation: >-
      The genome-instability consequence in patients is explicitly framed by the
      authors as a prediction, which is why this node is HYPOTHETICAL and has no
      curated clinical downstream.

- name: Repressed POMC Transcription
  description: >-
    PHIP has nuclear and cytoplasmic pools, and it is the nuclear pool that acts on
    POMC. Nuclear PHIP directly enhances transcription of pro-opiomelanocortin, the
    precursor from which the anorexigenic melanocortin peptides are cleaved, and
    obesity-associated PHIP variants repress that transcription. The physiological
    setting is the hypothalamic arcuate POMC neuron, the first-order anorexigenic
    node of the leptin-melanocortin pathway; the experimental demonstration, however,
    was in cells rather than in human hypothalamic neurons, which is the principal
    limitation of this arm.

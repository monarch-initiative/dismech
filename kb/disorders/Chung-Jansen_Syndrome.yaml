- name: Impaired Trivalent Nucleosome Reading by the PHIP Tudor-Bromodomain Module
  description: >-
    PHIP is a BRD/BRWD-family multivalent chromatin reader. Semisynthetic nucleosomes
    with defined histone modifications show that its three reader surfaces are
    non-redundant and combinatorial: a Tudor domain reads H3K4 methylation, the first
    bromodomain (BD1) reads acetylated H3K14, and the second bromodomain (BD2) reads
    acetylated H4K12. Because CHUJANS variants occur in each of these domains and in
    the linker that positions them relative to one another, the primary molecular
    defect is failure to engage appropriately marked nucleosomes - a reading defect,
    not a writing or erasing defect. Note the epistemic split within this node: the
    reader architecture and its mark specificities are measured biochemistry, whereas
    the impairment of that reading by patient alleles is inferred from variant
    location and is described by the source as likely rather than demonstrated -
    hence PROVISIONAL rather than ESTABLISHED confidence.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: H3K4-methyl binding Tudor domain reader activity
    term:
      id: GO:0140002
      label: histone H3K4me3 reader activity
    modifier: DECREASED
  - preferred_term: PHIP bromodomain 1 (BD1) reading of H3K14ac
    term:
      id: GO:0140015
      label: histone H3K14ac reader activity
    modifier: DECREASED
  - preferred_term: PHIP bromodomain 2 (BD2) reading of H4K12ac
    term:

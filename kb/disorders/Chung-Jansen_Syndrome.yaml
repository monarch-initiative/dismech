      screening recommendation.

- category: Metabolic
  name: Obesity and Overweight
  frequency: FREQUENT
  description: >-
    Overweight or obesity affects a slight majority of individuals and is the feature
    that gave the syndrome its historical acronyms (DIDOD, BIDOD, ID-overweight
    syndrome). Crucially it is neither congenital nor obligatory: it emerges between
    early childhood and puberty, becomes more prevalent in the over-12 age group, and
    is absent in a sizeable minority - one independent cohort explicitly reported a
    lower obesity frequency than earlier series. Weight should therefore not be used
    as a gatekeeping criterion for testing.
  phenotype_term:
    preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
    clinical_course: PROGRESSIVE
  evidence:

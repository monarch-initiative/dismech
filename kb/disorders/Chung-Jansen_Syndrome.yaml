        controls, we identified three genes (PHIP, DGKI, and ZMYM4) with an excess
        burden of very rare predicted deleterious variants in cases.
      explanation: >-
        Human-genetic evidence that rare deleterious PHIP variants are enriched in
        severe obesity, connecting the pathway to the clinical outcome.

- name: Disrupted Neurodevelopmental Gene Expression Program
  description: >-
    The route from chromatin-reading failure to the neurodevelopmental phenotype is
    the least resolved segment of the CHUJANS pathograph. PHIP's isoforms are
    implicated in neurodevelopmental processes including neuronal differentiation,
    and the clinical output (global developmental delay, learning disability or
    intellectual disability, speech delay, hypotonia, and a behavioral/psychiatric
    profile) is highly consistent across cohorts. What is missing is any
    CHUJANS-specific patient-neuron, organoid, or brain transcriptomic dataset
    identifying the mis-regulated target genes, so the node is curated as a named but
    mechanistically unresolved intermediate rather than as an established pathway.

    the kidney; the genital component of that trait is curated separately as
    cryptorchidism.
  phenotype_term:
    preferred_term: Congenital anomaly of the kidney and urinary tract
    term:
      id: HP:0000079
      label: Abnormality of the urinary system
  evidence:

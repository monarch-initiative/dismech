- name: Disrupted PHIP-Dependent Kidney and Urinary Tract Development
  description: >-
    A distinct developmental arm outside the CNS. Prenatal expression studies in
    murine and human renal tissue support a role for PHIP in normal kidney and
    urinary tract development, and systematic ascertainment across CHUJANS and CAKUT
    cohorts recovered a urorenogenital trait in a substantial minority of individuals.
    The trait is variably expressive, which is why urorenal anomalies were missed in
    the original delineation and why the recommendation is now bidirectional:
    evaluate CHUJANS patients for urorenogenital malformation, and consider PHIP in
    syndromic CAKUT.

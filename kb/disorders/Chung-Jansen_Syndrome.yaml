        Individuals in this cohort frequently had a history of developmental delay
        (85.1%), attention-deficit/hyperactivity disorder (51.1%), anxiety (46.8%),
        depression (27.7%), and sleep difficulties (42.6%).
      explanation: >-
        The most frequent manifestations in the largest natural-history cohort are
        neurodevelopmental and neuropsychiatric.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chung-Jansen Syndrome is a recently identified obesity syndrome, characteristic
      clinical features of which are global developmental delay, intellectual
      disability, obesity and dysmorphism (DIDOD).
    explanation: >-
      Frames the disorder as a syndromic obesity and gives the DIDOD acronym.

- category: Craniofacial
  name: Craniofacial Dysmorphism
  frequency: VERY_FREQUENT
  description: >-
    A recognizable facial gestalt comprising large ears and earlobes, prominent
    eyebrows (often with synophrys), anteverted nares/upturned nose, and a long
    philtrum. It was present in every individual in the European cohort. Objective
    facial phenotyping with GestaltMatcher separates PHIP patients from healthy
    controls and from Prader-Willi and CUL4B-related syndromes, but cannot separate
    PHIP variant classes from one another - so the gestalt supports recognition, not
    genotype prediction, and never substitutes for molecular testing.
  phenotype_term:
    preferred_term: Characteristic facial gestalt
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characteristic craniofacial features (i.e. large ears/earlobes, prominent
      eyebrows, anteverted nares and long philtrum (23/23))
    explanation: >-
      23/23 (100%) supports the VERY_FREQUENT band. Note that the 100% denominator is
      for the aggregate gestalt, which is why this band is bound to the aggregate
      facial-shape term; the individual components are each far less frequent and
      carry their own, lower bands below.
  - reference: PMID:36726590
    reference_title: "PHIP-associated Chung-Jansen syndrome: Report of 23 new individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we could establish that PHIP patients are indistinguishable based on the type
      of PHIP alteration (e.g. missense, loss-of-function, splice site) but show a
      significant difference to the average face of healthy individuals as well as to
      individuals with Prader-Willi syndrome (PWS, OMIM #176270) or with a
      CUL4B-alteration
    explanation: >-
      Quantifies both the discriminative power of the gestalt against key
      differentials and its inability to predict variant class.


    explanation: A second independent report of a de novo SMS mutation causing SRS.
  - reference: PMID:23805436
    reference_title: "Snyder-Robinson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'If the mother of the proband has an SMS pathogenic variant, the chance of
      transmitting it in each pregnancy is 50%: males who inherit the pathogenic variant
      will be affected; females who inherit the pathogenic variant will be heterozygotes'
    explanation: GeneReviews states the 50% per-pregnancy transmission risk from a carrier
      mother and the sex-specific outcome, the defining recurrence pattern of X-linked
      recessive inheritance.
  - reference: PMID:23805436
    reference_title: "Snyder-Robinson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Affected males are not known to reproduce.
    explanation: Absence of male reproduction excludes male-to-female obligate-carrier
      transmission, so affected males do not propagate the variant.
  - reference: PMID:34667072
    reference_title: "Maternal mosaicism for a missense variant in the SMS gene that causes Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although Sanger sequencing confirmed the de novo status in our proband,
      polymerase chain reaction (PCR) and deep targeted resequencing to ∼84,000×-175,000×
      depth revealed that the variant is present in blood from the unaffected mother at
      ∼3% variant allele frequency.'
    explanation: Demonstrates low-level maternal mosaicism for a pathogenic SMS variant that
      standard Sanger sequencing had classified as de novo, establishing that an apparently
      de novo SRS variant can carry a recurrence risk and that deep resequencing of the
      mother may be warranted before counselling.
  - reference: PMID:34667072
    reference_title: "Maternal mosaicism for a missense variant in the SMS gene that causes Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings thus provided a long-sought diagnosis for the family while
      highlighting the role of parental mosaicism in severe genetic disorders.
    explanation: The authors' own framing of the counselling implication of parental
      mosaicism in this disorder.

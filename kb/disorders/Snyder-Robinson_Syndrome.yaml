inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: 'Only affected males have been reported; heterozygous females have not shown
    features of SRS to date. Transmission is usually from a carrier mother, but de novo
    SMS variants are also documented, so an unaffected maternal genotype does not exclude
    the diagnosis. An apparently de novo variant is not necessarily de novo: low-level
    maternal somatic/germline mosaicism has been demonstrated in SRS, in one family at
    ~3% variant allele frequency in maternal blood - a level below the detection limit of
    Sanger sequencing, which had reported the variant as de novo. This materially raises
    the recurrence risk above the population baseline quoted for a true de novo event, so
    deep targeted resequencing of the mother should be considered before counselling a
    family that recurrence risk is negligible.

    '
  evidence:
  - reference: PMID:23805436
    reference_title: "Snyder-Robinson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: To date, only affected males have been reported.
    explanation: GeneReviews states that the disorder manifests only in hemizygous males,
      consistent with X-linked recessive inheritance.

- name: Impaired Osteoblastic Bone Matrix Mineralisation
  description: 'The skeletal arm of SRS is a formation defect rather than a resorptive
    one. Bone histopathology in affected brothers showed profound depletion of both
    osteoblasts and osteoclasts with absent trabecular meshwork, low bone volume and
    a thin cortex, and patient-derived bone marrow stromal cells failed to mineralise
    on osteogenic differentiation. Silencing SMS in human MSCs reproduces the defect
    in vitro and in vivo, and in the SMS G56S mouse dynamic histomorphometry identifies
    a reduced bone formation rate as the main cause of the low bone mass. Excess spermidine
    is itself sufficient to suppress mineralisation, and inhibiting the upstream enzyme
    ornithine decarboxylase with DFMO rescues it.

    '

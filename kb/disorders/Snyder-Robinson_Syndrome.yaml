- name: Elevated Spermidine to Spermine Ratio
  description: 'Spermine falls and spermidine rises in patient lymphocytes, lymphoblasts
    and fibroblasts, producing an exaggerated spermidine:spermine ratio that is the
    biochemical hallmark of SRS and that broadly tracks symptom severity. Ornithine

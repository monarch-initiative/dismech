- name: Abnormal retinal pigmentation
  category: Ophthalmologic
  description: 'Retinal pigmentary change was documented in both propositi of the NIH
    series, one of whom had frank retinitis pigmentosa on ophthalmologic examination. It
    had not been recorded in any previously reported SRS patient, so it sits at the
    uncommon end of the phenotype. This is also the human counterpart of the retinal degeneration
    seen in the Drosophila dSms model, which the pathograph otherwise leaves without a
    human endpoint.

    '
  phenotype_term:
    preferred_term: Retinal pigmentary changes
    term:
      id: HP:0007703
      label: Abnormal retinal pigmentation
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:25888122
    reference_title: "Impaired osteoblast and osteoclast function characterize the osteoporosis of Snyder - Robinson syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: the propositi manifested retinal pigmentary changes, recurrent episodes of
      hyper- and hypoglycemia, nephrocalcinosis, renal cysts, and frequent respiratory
      infections.
    explanation: Documents retinal pigmentary changes in two affected brothers as an
      extension of the recognised phenotype. Support is partial because the finding is
      reported in a single sibship rather than established across the disorder.
  - reference: PMID:25888122
    reference_title: "Impaired osteoblast and osteoclast function characterize the osteoporosis of Snyder - Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Retinal pigment changes 0/13 + + Hypo-/Hyper-glycemia 1/13 + +
    explanation: Consecutive rows of Table 1 ("Comparison of clinical features of all reported
      SRS patients"). The retinal row reads "0/13 + +" - retinal pigment change had not been
      reported in any of the 13 previously assessed patients, but the two trailing "+" marks
      are the table's separate columns for this report's own propositi II-1 and II-3, both of
      whom are positive. The count over every patient the table tabulates is therefore
      2/15 = 13.3%, which falls in the OCCASIONAL band (5-29%), not VERY_RARE.

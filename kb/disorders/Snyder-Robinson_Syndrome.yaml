- name: Excessive Spermidine Catabolism and Oxidative Stress
  description: 'Because spermidine cannot be converted to spermine it is instead routed
    through spermidine/spermine N1-acetyltransferase 1 (SAT1) and polyamine oxidase.
    This back-conversion generates hydrogen peroxide and reactive aldehydes, imposing
    oxidative stress and depleting acetyl-CoA. In Drosophila SRS models and in patient
    cells these toxic by-products damage lysosomes and mitochondria; enhancing antioxidant
    activity genetically or pharmacologically suppresses the oxidative stress.

    '

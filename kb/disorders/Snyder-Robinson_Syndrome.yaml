biochemical:
- name: Elevated spermidine to spermine ratio
  notes: 'The spermidine:spermine ratio measured in cultured fibroblasts, lymphocytes
    or lymphoblasts is the biochemical hallmark of SRS and is used to confirm the diagnosis
    alongside molecular testing. The magnitude of the elevation broadly correlates
    with symptom severity.

    '
  biomarker_term:
    preferred_term: spermidine
    term:
      id: CHEBI:16610
      label: spermidine
    modifier: INCREASED
  presence: PRESENT
  specificity: Highly specific for spermine synthase deficiency; no other human disorder
    is known to produce this pattern.
  evidence:
  - reference: PMID:37702369
    reference_title: "Difluoromethylornithine rebalances aberrant polyamine ratios in Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Reduced SMS activity causes spermidine accumulation while spermine levels
      are reduced. The resulting exaggerated spermidine:spermine ratio is a biochemical
      hallmark of SRS that tends to correlate with symptom severity.'
    explanation: Establishes the ratio as the biochemical hallmark and its correlation
      with severity.
  - reference: PMID:33186760
    reference_title: "Digestive involvement in a severe form of Snyder-Robinson syndrome: Possible expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A novel p.(Gly203Asp) variant was found at the hemizygous state in the two
      boys, and an elevated Spermidine/Spermine ratio confirmed the diagnosis of Snyder-Robinson
      syndrome.
    explanation: Demonstrates diagnostic use of the elevated ratio in confirmed patients.
- name: Elevated plasma N8-acetylspermidine
  biomarker_term:
    preferred_term: N(8)-acetylspermidine
    term:
      id: CHEBI:27911
      label: N(8)-acetylspermidine
    modifier: INCREASED
  presence: PRESENT
  notes: 'Untargeted plasma metabolomics in twin boys with epileptic encephalopathy
    identified markedly elevated N(8)-acetylspermidine, verified in a third genetically
    confirmed patient, as a candidate plasma biomarker for SRS accessible without a
    cell culture assay.

    '
  evidence:
  - reference: PMID:26174906
    reference_title: "N(8)-acetylspermidine as a potential plasma biomarker for Snyder-Robinson syndrome identified by clinical metabolomics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Untargeted plasma metabolome analysis revealed significantly elevated levels
      of N(8)-acetylspermidine, a precursor derivative of spermine biosynthesis, as a
      potential novel plasma biomarker for SRS.
    explanation: Reports the elevated plasma analyte and its proposed biomarker role in
      SRS.
genetic:
- name: SMS
  gene_term:
    preferred_term: SMS
    term:
      id: hgnc:11123
      label: SMS
  association: CAUSAL
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: 'SMS at Xp22.11 encodes spermine synthase. Hemizygous loss-of-function
    variants cause Snyder-Robinson syndrome. Nearly all reported pathogenic variants
    are hypomorphic missense changes retaining partial activity; a single complete
    loss-of-function frameshift allele (Met303Lysfs*) produced a severe phenotype with
    multiple malformations and death at four months, supporting a genotype-severity
    correlation. Several missense variants outside the active site act by destabilising
    the protein or abolishing obligate homodimer formation.

    '
  evidence:
  - reference: PMID:41410504
    reference_title: "Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Snyder-Robinson syndrome results from hemizygous loss-of-function variants
      in the spermine synthase (SMS) gene, resulting in decreased or complete loss of
      spermine synthase enzyme activity.
    explanation: Establishes the gene-disease relationship and the loss-of-function mechanism.
  - reference: PMID:31580924
    reference_title: "The complete loss of function of the SMS gene results in a severe form of Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we describe the first complete LoF variant, Met303Lysfs*, in a male patient
      with a severe form of Snyder-Robinson syndrome.
    explanation: Documents the single reported complete loss-of-function allele and its
      severe phenotype, underpinning the genotype-severity correlation.
  - reference: PMID:26761001
    reference_title: "Revealing the Effects of Missense Mutations Causing Snyder-Robinson Syndrome on the Stability and Dimerization of Spermine Synthase."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: In silico modeling predicted that all studied mutations in this work destabilize
      SpmSyn and some of them abolish homo-dimer formation.
    explanation: Supports protein destabilisation and loss of dimerisation as the mechanism
      for non-active-site missense variants.
diagnosis:
- name: Molecular genetic testing of SMS
  description: 'The diagnosis is established in a male proband by identification of
    a hemizygous loss-of-function SMS pathogenic variant. Biochemical confirmation
    uses the elevated spermidine:spermine ratio in cultured cells; elevated plasma
    N(8)-acetylspermidine has been proposed as a less invasive supporting marker.

    '
  evidence:
  - reference: PMID:23805436
    reference_title: "Snyder-Robinson Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of SRS is established in a male proband with a hemizygous loss-of-function
      SMS pathogenic variant identified by molecular genetic testing.
    explanation: GeneReviews states the diagnostic criterion for SRS.
differential_diagnoses:
- name: Osteogenesis imperfecta
  description: 'SRS presents with early-onset osteoporosis and recurrent low-trauma
    fractures and has been misdiagnosed as osteogenesis imperfecta for years before
    molecular testing established the correct diagnosis.

    '
  evidence:
  - reference: PMID:34741636
    reference_title: "Snyder-Robinson syndrome: differential diagnosis of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a novel case of Snyder-Robinson syndrome, caused by a de novo mutation
      and first misdiagnosed with osteogenesis imperfecta.
    explanation: Documents a case initially misdiagnosed as osteogenesis imperfecta, establishing
      the differential.

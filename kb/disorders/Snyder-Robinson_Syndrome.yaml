- name: Difluoromethylornithine (DFMO, eflornithine) — investigational
  description: 'DFMO, an FDA-approved ornithine decarboxylase inhibitor, rebalances
    the spermidine:spermine ratio in SRS patient cells by reducing spermidine biosynthesis,
    stimulating residual conversion of spermidine to spermine in hypomorphic cells,
    and inducing uptake of exogenous spermine. It extends lifespan in the Drosophila
    SRS model and rescues the mineralisation defect of polyamine-loaded human stromal
    cells. This is preclinical only; DFMO is profoundly toxic in the spermine synthase-deficient
    Gy mouse, which suffers catastrophic loss of motor function and death within days,
    so translation requires caution.

    '
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eflornithine (DFMO)
      term:
        id: CHEBI:41948
        label: eflornithine
  target_mechanisms:
  - target: Elevated Spermidine to Spermine Ratio
    treatment_effect: INHIBITS
    description: DFMO inhibits ornithine decarboxylase upstream of the block, lowering
      spermidine synthesis and so correcting the exaggerated spermidine:spermine ratio
      rather than replacing the missing enzyme.
    evidence:
    - reference: PMID:37702369
      reference_title: "Difluoromethylornithine rebalances aberrant polyamine ratios in Snyder-Robinson syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Here we report the repurposing of 2-difluoromethylornithine (DFMO), an
        FDA-approved inhibitor of polyamine biosynthesis, in rebalancing spermidine:spermine
        ratios in SRS patient cells.'
      explanation: Directly demonstrates that DFMO acts on the elevated spermidine-to-spermine
        ratio node in patient-derived cells.
  evidence:
  - reference: PMID:37702369
    reference_title: "Difluoromethylornithine rebalances aberrant polyamine ratios in Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Here we report the repurposing of 2-difluoromethylornithine (DFMO), an FDA-approved
      inhibitor of polyamine biosynthesis, in rebalancing spermidine:spermine ratios in
      SRS patient cells.'
    explanation: Demonstrates correction of the defining biochemical abnormality in patient-derived
      cells.
  - reference: PMID:38473716
    reference_title: "Effects of Spermine Synthase Deficiency in Mesenchymal Stromal Cells Are Rescued by Upstream Inhibition of Ornithine Decarboxylase."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: 'inhibition of polyamine synthesis with DFMO rescues most, but not all of these
      defects'
    explanation: Rescue of the skeletal cellular phenotype by upstream polyamine-synthesis
      inhibition is explicitly incomplete in the source, so support is partial.
  - reference: PMID:19001365
    reference_title: "Spermine synthase deficiency leads to deafness and a profound sensitivity to alpha-difluoromethylornithine."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: Within 2-3 days of exposure to DFMO in the drinking water, the Gy mice suffered
      a catastrophic loss of motor function resulting in death within 5 days.
    explanation: Counterweight evidence, a severe toxicity of DFMO specific to spermine
      synthase deficiency in vivo, which argues against uncritical translation of the in
      vitro rescue.
- name: Phenylbutyrate — investigational
  description: 'Phenylbutyrate, an FDA-approved drug, down-regulates the rate-limiting
    spermidine catabolic enzyme SAT1, reduces production of toxic catabolic metabolites
    and preserves acetyl-CoA. It restored mitochondrial and autolysosomal function
    and extended lifespan in the Drosophila SRS model, ameliorated autolysosome dysfunction
    in SRS patient fibroblasts, and partially restored metabolic flexibility in 29
    patient lymphoblastoid lines. Preclinical only.

    '
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenylbutyrate (PBA)
      term:
        id: CHEBI:41500
        label: 4-phenylbutyric acid
  target_mechanisms:
  - target: Excessive Spermidine Catabolism and Oxidative Stress
    treatment_effect: INHIBITS
    description: Phenylbutyrate down-regulates SAT1, the rate-limiting enzyme of the
      spermidine back-conversion route, throttling the catabolic overflow that generates
      the toxic metabolites.
    evidence:
    - reference: PMID:35801587
      reference_title: "Phenylbutyrate modulates polyamine acetylase and ameliorates Snyder-Robinson syndrome in a Drosophila model and patient cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We further explored the mechanism of drug action and found that PBA downregulates
        the first and rate-limiting spermidine catabolic enzyme spermidine/spermine N1-acetyltransferase
        1 (SAT1), reduces the production of toxic metabolites, and inhibits the reduction
        of the substrate acetyl-CoA.
      explanation: Identifies SAT1 down-regulation as the mechanism by which phenylbutyrate
        acts on the excessive-spermidine-catabolism node.
  evidence:
  - reference: PMID:35801587
    reference_title: "Phenylbutyrate modulates polyamine acetylase and ameliorates Snyder-Robinson syndrome in a Drosophila model and patient cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: PBA treatment significantly restored the function of mitochondria and autolysosomes
      and extended life span in vivo in the Drosophila SRS model.
    explanation: Demonstrates rescue of the organelle phenotypes and of survival in the
      fly SRS model.
  - reference: PMID:35801587
    reference_title: "Phenylbutyrate modulates polyamine acetylase and ameliorates Snyder-Robinson syndrome in a Drosophila model and patient cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We further explored the mechanism of drug action and found that PBA downregulates
      the first and rate-limiting spermidine catabolic enzyme spermidine/spermine N1-acetyltransferase
      1 (SAT1), reduces the production of toxic metabolites, and inhibits the reduction
      of the substrate acetyl-CoA.
    explanation: Establishes SAT1 down-regulation as the mechanism by which phenylbutyrate
      addresses the catabolic-overflow node.
  - reference: PMID:42250346
    reference_title: "Metabolic alterations in Snyder-Robinson syndrome lymphoblasts are ameliorated by phenylbutyrate treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Treatment with phenylbutyrate (PBA), previously shown to modulate polyamine
      catabolism, partially restored metabolic flexibility and normalized several impaired
      nutrient pathways.
    explanation: Independent patient-cell evidence that phenylbutyrate partially corrects
      the bioenergetic phenotype.
animal_models:
- species: Mouse
  genotype: Sms G56S knock-in
  description: 'A knock-in mouse carrying the Sms G56S missense variant lacks SMS protein
    and shows an increased spermidine/spermine ratio, failure to thrive, short stature,
    reduced bone density, impaired learning, increased anxiety, reduced mobility and
    reduced total and regional brain volumes, with impaired mitochondrial oxidative
    phosphorylation in cortex and fibroblasts. It is the current preclinical model
    for SRS therapeutic development.

    '
  evidence:
  - reference: PMID:38463005
    reference_title: "Impaired polyamine metabolism causes behavioral and neuroanatomical defects in a mouse model of Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Collectively, our study establishes the suitability of the G56S mice as a
      preclinical model for SRS and provides a set of molecular and functional outcome
      measures that can be used to evaluate therapeutic interventions for SRS.
    explanation: Establishes the G56S mouse as the validated preclinical model for SRS.
- species: Mouse
  genotype: Gyro (Gy), X-chromosomal deletion inactivating SpmS and Phex
  description: 'The Gy mouse carries an X-chromosomal deletion inactivating both SpmS
    and the neighbouring Phex gene. It is profoundly hearing impaired with near-complete
    loss of the endocochlear potential, rescued by a spermine synthase transgene, and
    is catastrophically sensitive to DFMO. Because the deletion also removes Phex,
    skeletal findings in this model are confounded by X-linked hypophosphataemia.

    '
  evidence:
  - reference: PMID:39331754
    reference_title: "Inactivation of spermine synthase in mice causes osteopenia due to reduced osteoblast activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Since the impact of a murine SMS deficiency has so far only been analyzed
      in Gy mice, where a large genomic deletion also includes the neighboring Phex gene,
      there is only limited knowledge about the potential role of SMS in bone cell regulation.
    explanation: States the Phex confound that limits interpretation of skeletal phenotypes
      in the Gy model, motivating the newer G56S mouse.
- species: Drosophila melanogaster
  genotype: dSms loss of function
  description: 'Loss of dSms in Drosophila recapitulates the polyamine imbalance of
    SRS and causes survival defects, synaptic and retinal degeneration, lysosomal defects
    and oxidative stress. It is the model in which both DFMO and phenylbutyrate rescue
    were first demonstrated.

    '
  evidence:
  - reference: PMID:29097652
    reference_title: "Spermine synthase deficiency causes lysosomal dysfunction and oxidative stress in models of Snyder-Robinson syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here we show that loss of dSms in Drosophila recapitulates the pathological
      polyamine imbalance of SRS and causes survival defects and synaptic degeneration.
    explanation: Establishes the Drosophila model and the phenotypes it reproduces.
notes: 'Two mechanistic threads are deliberately recorded with restraint. First, the
  ion-channel arm rests on an explicitly hypothetical proposal in the original human
  description plus mouse cochlear physiology; no human electrophysiological study
  of Kir channel function in SRS exists. Second, the skeletal arm declares conformance
  to the osteoporosis module only at the impaired-formation and net-bone-loss nodes.
  It deliberately does NOT conform to `osteoporosis_bone_resorption#Increased Osteoclastic
  Bone Resorption`, because bone histopathology in SRS shows osteoclasts to be depleted
  rather than increased and dynamic histomorphometry in the SMS mouse attributes the
  low bone mass to a reduced bone formation rate; asserting the resorptive node would
  contradict the primary evidence.

  '

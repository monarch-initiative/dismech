- name: Speech abnormality
  category: Neurologic
  description: 'Speech is abnormal in essentially every reported affected male, ranging
    from nasal and dysarthric speech at the milder end to absent vocalisation in the most
    severely affected. This is the primary, best-quantified speech claim; the hypernasal
    quality below is the specific sub-phenotype.

    '
  phenotype_term:
    preferred_term: Speech abnormality
    term:
      id: HP:0002167
      label: Abnormal speech pattern
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:25888122
    reference_title: "Impaired osteoblast and osteoclast function characterize the osteoporosis of Snyder - Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Speech abnormalities 15/15 + ** + ** Diminished body bulk 15/15 + +
    explanation: Consecutive rows of Table 1 ("Comparison of clinical features of all reported
      SRS patients"); the first records speech abnormalities in 15 of 15 reported patients. 15/15 = 100%, which
      maps by default to OBLIGATE; the band is deliberately set one tier lower at
      VERY_FREQUENT (80-99%) because a 15-patient literature tabulation is too small a
      denominator to assert complete penetrance across the disorder, per the "departing
      from the default mapping" provision of docs/frequency-evidence-guidelines.md.
  - reference: PMID:25888122
    reference_title: "Impaired osteoblast and osteoclast function characterize the osteoporosis of Snyder - Robinson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical features of SRS include intellectual disability, dysmorphic facies,

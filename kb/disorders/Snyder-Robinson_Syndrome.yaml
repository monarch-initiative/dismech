description: 'Snyder-Robinson syndrome (SRS) is an X-linked recessive syndromic intellectual
  disability caused by hemizygous loss-of-function variants in SMS, the gene encoding
  spermine synthase. It is the only known human disorder of spermine synthase deficiency
  and was the first recognised inborn error of polyamine metabolism. Loss of spermine
  synthase activity depletes spermine and causes spermidine to accumulate, so that
  an exaggerated spermidine:spermine ratio becomes the biochemical hallmark of the
  disease and broadly correlates with clinical severity. Affected males show early
  hypotonia and low muscle mass with an asthenic (thin) habitus, developmental delay
  evolving to mild-to-profound intellectual disability, early-onset osteoporosis with
  low-trauma fractures, progressive kyphoscoliosis, seizures, facial asymmetry and
  other facial dysmorphism, unsteady or broad-based gait, and abnormal (often nasal,
  dysarthric) speech. Nonspecific kidney findings, and in severe alleles hearing loss,
  failure to thrive and premature death, are also reported. Mechanistically the altered
  polyamine pool drives excessive spermidine catabolism with generation of reactive
  oxygen species and toxic aldehydes, lysosomal and mitochondrial dysfunction, loss
  of polyamine-dependent modulation of inward-rectifier potassium channels in excitable
  tissue, and a cell-autonomous failure of osteoblastic bone matrix mineralisation.
  MONDO classifies SRS both as an X-linked syndromic intellectual disability and as
  a disorder of polyamine metabolism.

  '

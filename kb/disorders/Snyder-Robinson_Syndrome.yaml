- name: Loss of Polyamine-Dependent Ion Channel Modulation
  description: 'Spermine is the dominant endogenous polycation that blocks and gates
    inward-rectifier potassium channels and modulates glutamate receptors, so spermine
    depletion removes a physiological control on excitable membranes. This was the
    mechanism originally proposed to connect the polyamine defect to the cognitive
    phenotype of SRS, and in the spermine synthase-deficient Gy mouse the loss of the
    endocochlear potential and of vestibular function is attributed to defective polyamine
    regulation of Kir channels. Note that the direct human evidence is inferential
    rather than electrophysiological.

    '

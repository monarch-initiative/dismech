animal_models:
- name: Chuk (Ikka) knockout mouse
  species: Mouse
  genotype: Chuk-/- (IKK-alpha null)
  publication: PMID:10195895
  description: >-
    Targeted disruption of the gene encoding IKK-alpha. Knockout mice die
    perinatally, with severely impaired limb outgrowth and hyperproliferative,
    poorly differentiated epidermis. Two independent knockout lines were
    reported in 1999 (PMID:10195895, PMID:10195896).
  evidence:
  - reference: PMID:10195895
    reference_title: "Limb and skin abnormalities in mice lacking IKKalpha."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IKKalpha-deficient mice died perinatally. In IKKalpha-deficient fetuses, limb outgrowth was severely impaired despite unaffected skeletal development."
    explanation: Perinatal lethality and limb phenotype of the knockout.
  modeled_mechanisms:
  - target: Failed Epidermal Keratinocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The knockout epidermis is hyperproliferative and fails to differentiate.
    limitations: >-
      The knockout dies perinatally, whereas the human disease is fatal in
      utero; the mouse abstracts do not report an omphalocele or the cranial
      cyst seen in the human fetuses.
    evidence:
    - reference: PMID:10195895
      reference_title: "Limb and skin abnormalities in mice lacking IKKalpha."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The epidermal cells in IKKalpha-deficient fetuses were highly proliferative with dysregulated epidermal differentiation."
      explanation: The epidermal defect in the knockout fetus.

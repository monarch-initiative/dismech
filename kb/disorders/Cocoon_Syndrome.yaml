discussions:
- discussion_id: two_fetus_evidence_base
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#CHUK
  - pathophysiology#Failed Epidermal Keratinocyte Differentiation
  prompt: >-
    Is the human Cocoon phenotype, and its epidermal mechanism, confirmed beyond
    the two fetuses of the defining report?
  rationale: >-
    The molecular human evidence is two affected fetuses, and the
    epidermis-first mechanism comes from mouse genetics. Additional molecularly
    confirmed cases, with fetal skin histology compared against the IKK-alpha
    knockout, would show whether the human disease follows the same epidermal
    route.
  evidence:
  - reference: PMID:20961246
    reference_title: "Mutant CHUK and severe fetal encasement malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A point mutation in two affected fetuses led to the loss of the conserved helix–loop–helix ubiquitous kinase (CHUK), also known as IκB kinase α."
    explanation: The human evidence base is two fetuses.

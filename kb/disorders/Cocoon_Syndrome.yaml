name: Cocoon Syndrome
creation_date: "2026-10-23T15:00:00Z"
category: Mendelian
synonyms:
- fetal encasement syndrome
- foetal encasement syndrome
- severe fetal encasement malformation
description: >-
  Cocoon syndrome (fetal encasement syndrome) is a lethal autosomal recessive
  malformation syndrome of embryogenesis caused by loss of CHUK, which encodes
  IKK-alpha (IkappaB kinase alpha). Affected fetuses have a severely malformed
  face, an omphalocele, and immobile, hypoplastic limbs that are bound to the
  trunk and encased under a transparent, membrane-like skin, so that the limbs
  look absent. The molecularly confirmed human evidence is two affected fetuses
  carrying a CHUK point mutation that removed the protein.

  The mechanism is inferred mainly from mice lacking IKK-alpha. Their epidermis
  fails to complete keratinocyte differentiation, a function of IKK-alpha that
  does not need its kinase activity. Restoring IKK-alpha in the epidermis alone
  corrects both the skin and the skeleton, so the limb, skeletal and craniofacial
  defects follow from the epidermal failure rather than from a defect in bone or
  cartilage; one identified signalling change is derepression of FGF8 in
  limb-bud ectoderm. Cocoon syndrome is the most severe end of a CHUK allelic
  series that also includes Bartsocas-Papas syndrome 2 and a kinase-domain
  immunodeficiency with ectodermal features.
disease_term:
  preferred_term: cocoon syndrome
  term:
    id: MONDO:0013334
    label: cocoon syndrome
parents:
- lethal fetal malformation syndrome
notes: >-
  Curated as its own Disease, with the allelic CHUK disorders as differential
  diagnoses rather than subtypes. Cocoon syndrome has been described as an
  extreme form of Bartsocas-Papas syndrome (PMID:25691407), but MONDO keeps
  cocoon syndrome (MONDO:0013334) and Bartsocas-Papas syndrome 2 (MONDO:0859154)
  as separate classes; a CHUK-spectrum Grouping would be the place to unite them.
  The only ClinGen gene-disease validity record for CHUK in
  cache/clingen/gene_validity.csv is for Bartsocas-Papas syndrome 2 (Moderate,
  AR, CGGV:assertion_c75e589b-683e-4b4f-b2f5-59e1eadf42d1-2024-06-07T170000.000Z),
  a different MONDO disease, so no gene_disease_validity tier is recorded here.
  The specific variant and the fetal skin histology are reported only in the
  full text of PMID:20961246, which is not in references_cache (abstract only),
  so they are not stated in this entry. Not to be confused with abdominal cocoon
  syndrome (sclerosing encapsulating peritonitis), an unrelated acquired
  peritoneal disorder with the same name. `just check-genereviews` reports no
  GeneReviews chapter (Bookshelf index 2026-09-10).

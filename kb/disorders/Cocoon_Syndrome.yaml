  species: Mouse
  genotype: Chuk-/- with an epidermal-specific Ikka transgene
  publication: PMID:15071597
  description: >-
    IKK-alpha-deficient mice in which IKK-alpha is restored only in basal
    epidermal keratinocytes. Epidermal differentiation and skeletal morphology
    are normal, which places the skeletal defect downstream of the epidermis.
  evidence:

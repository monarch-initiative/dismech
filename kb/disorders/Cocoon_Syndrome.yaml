    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an autosomal recessive lethal syndrome characterized by multiple fetal malformations"
    explanation: States the inheritance mode in the defining report.
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "homozygous mutations in RIPK4 or CHUK (IKKA) cause the more severe Bartsocas-Papas syndrome (BPS) and Cocoon syndrome, respectively"
    explanation: States that Cocoon syndrome is caused by homozygous CHUK mutations.
pathophysiology:
- name: Biallelic CHUK Loss of Function
  description: >-
    The initiating lesion. A homozygous CHUK point mutation in the affected
    fetuses led to loss of IKK-alpha, a subunit of the IkappaB kinase complex.
    Because the protein is absent, its kinase activity is lost and is bound
    below; the downstream epidermal effect, however, depends on a
    kinase-independent activity of IKK-alpha (PMID:15071597), so the kinase
    term records what is lost, not the route to the phenotype.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: CHUK
    term:
      id: hgnc:1974
      label: CHUK
  molecular_functions:
  - preferred_term: IKK-alpha kinase activity (lost with the protein)
    term:
      id: GO:0008384
      label: IkappaB kinase activity
    modifier: DECREASED
  downstream:
  - target: Failed Epidermal Keratinocyte Differentiation
    causal_link_type: DIRECT
    description: >-
      IKK-alpha is required for embryonic keratinocytes to complete terminal
      differentiation. Shown in mice; the human report states the same role
      for CHUK.
    evidence:
    - reference: PMID:15071597
      reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "a kinase-independent activity is required for epidermal keratinocyte differentiation"
      explanation: >-
        States that IKK-alpha is needed for keratinocyte differentiation, and
        that this need does not depend on its kinase activity.
    - reference: PMID:20961246
      reference_title: "Mutant CHUK and severe fetal encasement malformation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "CHUK has an essential role in the development of skin epidermis and its derivatives, along with various other morphogenetic events."
      explanation: >-
        The human report's statement of the same role. INDIRECT because it
        states the gene's role rather than describing the fetal epidermis.
  evidence:
  - reference: PMID:20961246
    reference_title: "Mutant CHUK and severe fetal encasement malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A point mutation in two affected fetuses led to the loss of the conserved helix–loop–helix ubiquitous kinase (CHUK), also known as IκB kinase α."
    explanation: Loss of CHUK protein in both affected fetuses.
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "homozygous mutations in RIPK4 or CHUK (IKKA) cause the more severe Bartsocas-Papas syndrome (BPS) and Cocoon syndrome, respectively"
    explanation: Supports the homozygous genotype.
  - reference: PMID:39812688
    reference_title: "Mutations disrupting the kinase domain of IKKα lead to immunodeficiency and immune dysregulation in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The absence of IKKα causes fetal encasement syndrome in humans, fatal in utero"
    explanation: Places complete absence of IKK-alpha at the lethal end of the CHUK allelic series.
- name: Failed Epidermal Keratinocyte Differentiation
  description: >-
    Without IKK-alpha, embryonic epidermal keratinocytes keep proliferating and
    do not complete terminal differentiation. The requirement is met by a
    kinase-independent activity of IKK-alpha, and mice lacking IKK-alpha still
    activate the IKK complex and degrade IkappaB in response to inflammatory
    stimuli, so the defect is not a general failure of cytokine-induced
    NF-kappaB activation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  downstream:
  - target: Abnormal Membrane-like Encasing Skin
    causal_link_type: DIRECT
    description: >-
      Undifferentiated epidermis cannot form a normal skin, leaving the thin,
      membrane-like covering that binds the limbs.
    evidence:
    - reference: PMID:20961246
      reference_title: "Mutant CHUK and severe fetal encasement malformation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "CHUK has an essential role in the development of skin epidermis and its derivatives, along with various other morphogenetic events."
      explanation: >-
        Links CHUK to epidermal development in the human report. INDIRECT
        because it states the gene's role rather than describing the fetal skin.
  - target: Disrupted Epidermal-Mesodermal Signaling
    causal_link_type: DIRECT
    description: >-
      Differentiating epidermis signals to underlying mesoderm. When
      differentiation fails, that signalling is disturbed. The rescue experiment
      locates the defect in the epidermis; that it acts through disturbed
      epidermal-mesodermal interaction is the authors' interpretation.
    evidence:
    - reference: PMID:15071597
      reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking IKK-alpha in all cell types including bone and cartilage, but not in basal epidermal keratinocytes, exhibit normal epidermal differentiation and skeletal morphology."
      explanation: >-
        The epidermis-specific rescue places the skeletal defect downstream of
        the epidermis. INDIRECT because it shows where the defect lies, not the
        signalling step itself.
  evidence:
  - reference: PMID:10195895
    reference_title: "Limb and skin abnormalities in mice lacking IKKalpha."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The epidermal cells in IKKalpha-deficient fetuses were highly proliferative with dysregulated epidermal differentiation."
    explanation: Epidermal phenotype of the knockout fetus.
  - reference: PMID:10195896
    reference_title: "Abnormal morphogenesis but intact IKK activation in mice lacking the IKKalpha subunit of IkappaB kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IKKalpha was not required for activation of IKK and degradation of IkappaB by proinflammatory stimuli. Instead, loss of IKKalpha interfered with multiple morphogenetic events, including limb and skeletal patterning and proliferation and differentiation of epidermal keratinocytes."
    explanation: >-
      Separates the morphogenetic and epidermal defects from cytokine-induced
      NF-kappaB activation, which was intact.
- name: Abnormal Membrane-like Encasing Skin
  description: >-
    The skin over the limbs is transparent and membrane-like, lacks adnexal
    structures on the outer aspect of the limbs, and encases the limbs against
    the trunk.
  biological_scale: TISSUE
  downstream:
  - target: Transparent Membrane-like Skin
    causal_link_type: DIRECT
    description: The abnormal skin is itself the transparent covering.
    evidence:
    - reference: ORPHA:465824
      reference_title: "Fetal encasement syndrome"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "encased under an abnormal, transparent, membrane-like skin"
      explanation: Orphanet description of the encasing skin.
  - target: Absent Skin Adnexa Over the Limbs
    causal_link_type: DIRECT

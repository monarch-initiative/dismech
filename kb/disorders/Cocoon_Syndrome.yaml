    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We tested this hypothesis by introducing an epidermal-specific Ikka (also known as Chuk) transgene into IKK-alpha-deficient mice."
    explanation: The rescue design.

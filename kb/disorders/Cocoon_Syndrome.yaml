  evidence:
  - reference: ORPHA:465824
    reference_title: "Fetal encasement syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "immotile, hypoplastic limbs encased under an abnormal, transparent, membrane-like skin"
    explanation: Orphanet definition of the encasing skin.
- name: Disrupted Epidermal-Mesodermal Signaling
  description: >-
    In IKK-alpha-deficient mice, failed epidermal differentiation is proposed to
    disturb the signalling between epidermis and mesoderm that shapes the
    skeleton. One identified component is loss of repression of FGF family
    members such as FGF8, whose expression is raised in limb-bud ectoderm.
  biological_scale: TISSUE
  downstream:
  - target: Failed Limb, Skeletal and Craniofacial Morphogenesis
    causal_link_type: DIRECT
    description: >-
      Mesodermally derived skeletal elements need a differentiating epidermis to
      form normally.
    evidence:
    - reference: PMID:15071597
      reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, epidermal differentiation is required for proper morphogenesis of mesodermally derived skeletal elements."
      explanation: The conclusion of the epidermis-specific rescue experiment.
  evidence:
  - reference: PMID:15071597
    reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One way by which IKK-alpha controls skeletal and craniofacial morphogenesis is by repressing expression of fibroblast growth factor (FGF) family members, such as FGF8, whose expression is specifically elevated in the limb bud ectoderm of IKK-alpha-deficient mice."
    explanation: Identifies FGF8 derepression in limb-bud ectoderm as one signalling change.
- name: Failed Limb, Skeletal and Craniofacial Morphogenesis
  description: >-
    Limb outgrowth, skeletal patterning and craniofacial morphogenesis fail,
    producing hypoplastic limbs, underdeveloped muscles and bones and the
    severely malformed face. In one knockout line limb outgrowth was impaired
    while skeletal elements themselves developed, so the limb defect is chiefly
    a failure of outgrowth.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: limb morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: DECREASED
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: DECREASED
  downstream:
  - target: Limb Hypoplasia
    causal_link_type: DIRECT
    description: Failed limb outgrowth leaves hypoplastic limbs.
    evidence:
    - reference: PMID:10195895
      reference_title: "Limb and skin abnormalities in mice lacking IKKalpha."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In IKKalpha-deficient fetuses, limb outgrowth was severely impaired despite unaffected skeletal development."
      explanation: Limb outgrowth failure in the knockout fetus.
  - target: Abnormal Facial Shape
    causal_link_type: DIRECT
    description: Failed craniofacial morphogenesis produces the malformed face.
    evidence:
    - reference: PMID:15071597
      reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition to failed epidermal differentiation, IKK-alpha-deficient mice exhibit abnormal skeletal and craniofacial morphogenesis."
      explanation: Craniofacial morphogenesis is abnormal in the knockout.
  evidence:
  - reference: PMID:15071597
    reference_title: "IkappaB kinase-alpha acts in the epidermis to control skeletal and craniofacial morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition to failed epidermal differentiation, IKK-alpha-deficient mice exhibit abnormal skeletal and craniofacial morphogenesis."
    explanation: Skeletal and craniofacial morphogenesis are abnormal in the knockout.
  - reference: PMID:10195896
    reference_title: "Abnormal morphogenesis but intact IKK activation in mice lacking the IKKalpha subunit of IkappaB kinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of IKKalpha interfered with multiple morphogenetic events, including limb and skeletal patterning"
    explanation: Limb and skeletal patterning are disrupted.
  - reference: PMID:10195895
    reference_title: "Limb and skin abnormalities in mice lacking IKKalpha."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In IKKalpha-deficient fetuses, limb outgrowth was severely impaired despite unaffected skeletal development."
    explanation: Limb outgrowth fails; the skeletal elements themselves form.

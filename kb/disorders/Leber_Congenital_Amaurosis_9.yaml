    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, all individuals with NMNAT1 mutations also have macular colobomas, which are severe degenerative entities of the central retina (fovea) devoid of tissue and photoreceptors."
    explanation: Macular colobomas in every NMNAT1 patient of eight families.
  - reference: PMID:22842227

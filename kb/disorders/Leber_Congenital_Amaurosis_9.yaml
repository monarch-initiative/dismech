phenotypes:
- name: Severely Reduced Visual Acuity
  category: Ophthalmological
  frequency: VERY_FREQUENT
  description: >-
    Severe visual loss from infancy, the defining feature of LCA. In a pooled
    series of 125 patients, 92.9% had onset in the first year and 89% had
    visual acuity of 0.05 or lower. A minority of families present later with
    cone-rod dystrophy or retinitis pigmentosa.
  phenotype_term:
    preferred_term: Severely reduced visual acuity
    term:
      id: HP:0001141
      label: Severely reduced visual acuity
  evidence:
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition to the typical LCA phenotype of nystagmus, severe loss of vision and abnormal electroretinogram (ERG)"
    explanation: Severe visual loss in NMNAT1 patients.
  - reference: PMID:34837036
    reference_title: Clinical features and genetic spectrum of NMNAT1-associated retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "92.9% patients showed onset of disease in the first year after birth, and 89.0% patients showed visual acuity of 0.05 or lower"
    explanation: Pooled frequency of infantile onset and severe acuity loss (125 patients, 99 families).

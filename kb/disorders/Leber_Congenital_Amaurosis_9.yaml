inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous or compound heterozygous NMNAT1 variants. The common p.Glu257Lys
    allele is a founder variant on a shared European haplotype, and is a weak
    hypomorph that is usually pathogenic only in trans with a more severe allele.
  evidence:
  - reference: PMID:22842229
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis with early-onset severe macular and optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound heterozygous and homozygous NMNAT1 mutations cause severe neonatal neurodegeneration of the central retina and early-onset optic atrophy in 22 unrelated individuals"
    explanation: Biallelic genotypes in 22 unrelated patients establish recessive inheritance.
  - reference: PMID:22842227
    reference_title: NMNAT1 mutations cause Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation segregated with disease in the kindred, including in three other children with LCA."
    explanation: Homozygous p.Val9Met segregates with LCA in a consanguineous kindred.
pathophysiology:
- name: NMNAT1 Hypomorphic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense, nonsense and splice variants reduce NMNAT1 catalytic
    activity and, for some alleles such as p.Glu257Lys, destabilize folding and
    cause cytoplasmic aggregation of the normally nuclear enzyme. Red blood
    cells of a p.Glu257Lys homozygote had lower NAD than his heterozygous
    mother.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: NMNAT1
    term:
      id: hgnc:17877
      label: NMNAT1
  molecular_functions:
  - preferred_term: nicotinamide-nucleotide adenylyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0000309
      label: nicotinamide-nucleotide adenylyltransferase activity
  evidence:
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays of the proteins encoded by the mutant alleles identified in our study showed that the mutations reduce the enzymatic activity of NMNAT1 in NAD biosynthesis and affect protein folding."
    explanation: Recombinant mutant proteins have reduced NAD-synthetic activity and folding defects.
  - reference: PMID:22842227
    reference_title: NMNAT1 mutations cause Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies showed that the p.Val9Met alteration decreased NMNAT1 enzyme activity."
    explanation: Independent enzymatic confirmation for the p.Val9Met allele.
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversely, we observed strong staining of NMNAT1 p.Glu257Lys outside the cell nucleus in the cytoplasm"
    explanation: The common mutant protein mislocalizes to the cytoplasm.
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed significantly lower concentrations of NAD in the affected individual, who is homozygous for the mutation encoding the p.Glu257Lys variant, compared to his heterozygous mother, suggesting reduced enzymatic function of the mutant NMNAT1 protein"
    explanation: Measured in red blood cells, so it shows lower NAD in a patient outside the retina.
  downstream:
  - target: Retina-Selective Nuclear NAD+ Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33709122
      reference_title: Mutant Nmnat1 leads to a retina-specific decrease of NAD+ accompanied by increased poly(ADP-ribose) in a mouse model of NMNAT1-associated retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Measurements by liquid chromatography with tandem mass spectrometry showed an early and sustained decrease of NAD+ in mutant retinas that was not observed in other tissues."
      explanation: The patient allele lowers NAD+ in retina specifically in the V9M mouse.
  - target: SARM1 NADase Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown with complete adult deletion of Nmnat1, not with patient alleles.
    evidence:
    - reference: PMID:33107823
      reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "loss of NMNAT1 activates the NADase SARM1, the central executioner of axon degeneration, to trigger photoreceptor death and vision loss"
      directness: INDIRECT
      explanation: >-
        Adult conditional Nmnat1 deletion activates SARM1 in photoreceptors;
        extension to hypomorphic patient alleles is an inference.
- name: Retina-Selective Nuclear NAD+ Depletion
  biological_scale: MOLECULAR
  description: >-
    NMNAT1 is ubiquitously expressed, yet in the Nmnat1 p.V9M mouse NAD+ falls
    early and persistently in retina but not in other tissues, which is the
    best current explanation for the retina-restricted phenotype.
  biological_processes:
  - preferred_term: nuclear NAD+ biosynthesis
    modifier: DECREASED
    term:
      id: GO:0009435
      label: NAD+ biosynthetic process
  evidence:
  - reference: PMID:33709122
    reference_title: Mutant Nmnat1 leads to a retina-specific decrease of NAD+ accompanied by increased poly(ADP-ribose) in a mouse model of NMNAT1-associated retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Measurements by liquid chromatography with tandem mass spectrometry showed an early and sustained decrease of NAD+ in mutant retinas that was not observed in other tissues."
    explanation: Retina-specific NAD+ loss in the V9M mouse.
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals with biallelic NMNAT1 mutations had severe LCA but normal physical and mental health."
    explanation: Patients have no extra-ocular disease, the clinical fact this node is meant to explain.
  downstream:
  - target: Photoreceptor Nuclear DNA Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Photoreceptor Nuclear DNA Damage
  biological_scale: CELLULAR
  description: >-
    Progressive nuclear DNA damage in photoreceptors, including 8-oxo-dG adducts
    and double-strand breaks. Whether the damage is oxidative is disputed
    between studies of the same V9M mouse (see evidence and notes).
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:41922335
    reference_title: "Oxidative DNA damage drives apoptotic photoreceptor loss in NMNAT1-associated inherited retinal degeneration: a therapeutic opportunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "reduced NMNAT1 enzyme function due to the p.V9M mutation leads to DNA damage in PRs, characterized by the progressive accumulation of the oxidative DNA adduct 8-oxo-dG in Nmnat1V9M/V9M mutant mice"
    explanation: Oxidative DNA adducts accumulate in mutant photoreceptors.
  - reference: PMID:34750622
    reference_title: Reduced nuclear NAD+ drives DNA damage and subsequent immune activation in the retina.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This was associated with elevated levels of DNA damage, PARP-mediated NAD+ consumption and migration of Iba1+/CD45+ microglia/macrophages to the subretinal space"
    explanation: DNA damage accompanies the nuclear NAD+ deficit.
  - reference: PMID:33709122
    reference_title: Mutant Nmnat1 leads to a retina-specific decrease of NAD+ accompanied by increased poly(ADP-ribose) in a mouse model of NMNAT1-associated retinal degeneration.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "we did not observe oxidative DNA damage, lipid peroxidation, or a low glutathione to oxidized glutathione ratio"
    explanation: >-
      An earlier study of the same model found no oxidative DNA damage,
      contradicting the oxidative part of this node.
  downstream:
  - target: Photoreceptor Apoptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41922335
      reference_title: "Oxidative DNA damage drives apoptotic photoreceptor loss in NMNAT1-associated inherited retinal degeneration: a therapeutic opportunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This DNA damage correlates with apoptosis-driven PR degeneration, as evidenced by caspase-9 activation and TUNEL staining in the PRs of the Nmnat1V9M/V9M mutant mice"
      explanation: DNA damage tracks with caspase-9-mediated photoreceptor apoptosis.
  - target: PARP Hyperactivation and Nuclear NAD+ Consumption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34750622
      reference_title: Reduced nuclear NAD+ drives DNA damage and subsequent immune activation in the retina.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This was associated with elevated levels of DNA damage, PARP-mediated NAD+ consumption and migration of Iba1+/CD45+ microglia/macrophages to the subretinal space"
      explanation: DNA damage is accompanied by PARP-mediated NAD+ consumption.
- name: PARP Hyperactivation and Nuclear NAD+ Consumption
  biological_scale: MOLECULAR
  description: >-
    PARP1 and seven other PARP family genes are upregulated, and
    poly(ADP-ribose) accumulates in photoreceptors, further consuming the
    already reduced nuclear NAD+ pool, a likely feed-forward loop. Nuclear
    sirtuin deacetylase activity is unchanged. PARP-dependent death
    (parthanatos) was not significantly activated in the V9M mouse, so PARP
    is not drawn as the executioner of photoreceptor death.
  genes:
  - preferred_term: PARP1
    term:
      id: hgnc:270
      label: PARP1
  biological_processes:
  - preferred_term: protein poly-ADP-ribosylation
    modifier: INCREASED
    term:
      id: GO:0070212
      label: protein poly-ADP-ribosylation
  evidence:
  - reference: PMID:33709122
    reference_title: Mutant Nmnat1 leads to a retina-specific decrease of NAD+ accompanied by increased poly(ADP-ribose) in a mouse model of NMNAT1-associated retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PARP activity was elevated during disease progression, as evidenced by overproduction of poly(ADP-ribose) (PAR) in photoreceptors, whereas histone deacetylation activity of nuclear sirtuins was not altered."
    explanation: PARP overactivity in photoreceptors of the V9M mouse.
  - reference: PMID:41922335
    reference_title: "Oxidative DNA damage drives apoptotic photoreceptor loss in NMNAT1-associated inherited retinal degeneration: a therapeutic opportunity."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "alternative cell death pathways such as necroptosis and parthanatos were not significantly activated"
    explanation: PARP-dependent cell death is not the main death route, limiting this node to NAD+ consumption.
  downstream:
  - target: Retina-Selective Nuclear NAD+ Depletion
    causal_link_type: DIRECT
    description: Feed-forward consumption of the already reduced nuclear NAD+ pool.
- name: SARM1 NADase Activation
  biological_scale: MOLECULAR
  description: >-
    Loss of NMNAT1 in adult mouse photoreceptors activates SARM1, the NADase
    that executes Wallerian axon degeneration. Sarm1 deletion rescues
    photoreceptor death, so inhibition of SARM1 is the essential photoreceptor
    function of NMNAT1 in this model. This was shown with conditional deletion
    in adults, not with patient alleles.
  genes:
  - preferred_term: SARM1
    term:
      id: hgnc:17074
      label: SARM1
  molecular_functions:
  - preferred_term: NAD+ nucleosidase activity
    modifier: INCREASED
    term:
      id: GO:0003953
      label: NAD+ nucleosidase activity
  evidence:
  - reference: PMID:33107823
    reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hence, the essential function of NMNAT1 in photoreceptors is to inhibit SARM1, highlighting an unexpected shared mechanism between axonal degeneration and photoreceptor neurodegeneration."
    explanation: SARM1 is the executioner downstream of NMNAT1 loss in photoreceptors.
  - reference: PMID:33107823
    reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results define a novel SARM1-dependent photoreceptor cell death pathway and identifies SARM1 as a therapeutic candidate for retinopathies."
    explanation: Sarm1 deletion rescue nominates SARM1 inhibition as a therapeutic approach; no inhibitor has been tested.
  downstream:
  - target: Photoreceptor Apoptosis
    causal_link_type: DIRECT
- name: Photoreceptor Apoptosis
  biological_scale: CELLULAR
  description: >-
    Photoreceptors are the cells that require NMNAT1: conditional deletion
    shows it is needed within photoreceptors, and restoring NMNAT1 in
    photoreceptors alone prevents degeneration. They die mainly by apoptosis;
    necroptosis and parthanatos were not significantly activated in the V9M
    mouse.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: apoptosis
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:33107823
    reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional deletion demonstrates that NMNAT1 is required within the photoreceptor."
    explanation: Establishes photoreceptors as the cell-autonomous site of disease.
  - reference: PMID:37214313
    reference_title: Expression of NMNAT1 in the photoreceptors is sufficient to prevent NMNAT1-associated retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified that treatments that drove NMNAT1 expression in the photoreceptors led to preservation of retinal morphology"
    explanation: Photoreceptor-restricted rescue localizes the defect to photoreceptors.
  downstream:
  - target: Retinal Degeneration
    causal_link_type: DIRECT
  - target: Subretinal Microglial and Macrophage Infiltration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Subretinal Microglial and Macrophage Infiltration
  biological_scale: TISSUE
  description: >-
    Iba1+/CD45+ microglia and macrophages migrate to the subretinal space as
    degeneration proceeds. Whether this is purely secondary or contributes to
    photoreceptor loss is not established.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglial cell activation
    modifier: INCREASED
    term:
      id: GO:0001774
      label: microglial cell activation
  evidence:
  - reference: PMID:34750622
    reference_title: Reduced nuclear NAD+ drives DNA damage and subsequent immune activation in the retina.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This was associated with elevated levels of DNA damage, PARP-mediated NAD+ consumption and migration of Iba1+/CD45+ microglia/macrophages to the subretinal space"
    explanation: Immune-cell infiltration accompanies degeneration in the V9M mouse.
- name: Retinal Degeneration
  biological_scale: TISSUE
  description: >-
    Early, severe and rapid degeneration of the fovea, producing an excavated
    macular lesion devoid of neuroretina (macular pseudocoloboma), with
    pan-retinal pigmentary change, vascular attenuation and optic atrophy.
    Mouse models show a rapidly progressive chorioretinal disease beginning
    with photoreceptor degeneration.
  evidence:
  - reference: PMID:27207593
    reference_title: Mouse Models of NMNAT1-Leber Congenital Amaurosis (LCA9) Recapitulate Key Features of the Human Disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous Nmnat1 mutant mice develop a rapidly progressing chorioretinal disease that begins with photoreceptor degeneration and includes attenuation of the retinal vasculature, optic atrophy, and retinal pigment epithelium loss."
    explanation: Mouse models reproduce the tissue-level retinal degeneration.
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that NMNAT1 mutations are associated with severe and rapid foveal degeneration."
    explanation: Human evidence for rapid central retinal degeneration.
  downstream:
  - target: Macular Pseudocoloboma
    causal_link_type: DIRECT
  - target: Optic Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Attenuated Retinal Vessels
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pigmentary Retinal Changes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Generalized Tapetoretinal Dystrophy
    causal_link_type: DIRECT
  - target: Extinguished or Severely Reduced Electroretinogram
    causal_link_type: DIRECT

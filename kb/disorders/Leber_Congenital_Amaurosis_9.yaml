genetic:
- name: NMNAT1
  gene_term:
    preferred_term: NMNAT1
    term:
      id: hgnc:17877
      label: NMNAT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    p.Glu257Lys (c.769G>A) is the most frequent allele in white patients and a
    European founder variant; p.Arg237Cys is the most frequent in Asian
    patients. Most causative variants (67.5%) are missense. p.Glu257Lys is a weak hypomorph with reduced penetrance when homozygous:
    homozygous knock-in mice have no phenotype, while E257K over a null allele
    causes photoreceptor degeneration. An Alu-mediated partial duplication of
    NMNAT1 causes a distinct syndromic disorder, SHILCA (MONDO:0031007), with
    skeletal dysplasia, hearing loss and intellectual disability in addition
    to LCA; that disorder is not included in this entry.
  evidence:
  - reference: PMID:22842231
    reference_title: Exome sequencing identifies NMNAT1 mutations as a cause of Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found NMNAT1 mutations in ten other individuals with LCA, all of whom carry the p.Glu257Lys variant."
    explanation: p.Glu257Lys is carried by every patient in this series.
  - reference: PMID:29674119
    reference_title: "NMNAT1 E257K variant, associated with Leber Congenital Amaurosis (LCA9), causes a mild retinal degeneration phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we propose that the E257K allele is a weak hypomorphic allele that has significantly reduced penetrance in the homozygous state"
    explanation: Knock-in mice define E257K as a weak hypomorph.
  - reference: PMID:34837036
    reference_title: Clinical features and genetic spectrum of NMNAT1-associated retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent variants in Caucasian and Asian population are p.E257K and p.R237C, respectively."
    explanation: Population-specific hotspot alleles.
animal_models:
- name: Nmnat1 p.V9M ENU mouse
  species: Mouse
  genotype: Nmnat1 V9M/V9M
  publication: PMID:27207593
  description: >-
    ENU-derived line carrying a patient missense allele. Develops rapidly
    progressive photoreceptor degeneration with an extinguished ERG, and is
    the principal model for mechanism and gene therapy studies.
  modeled_mechanisms:
  - target: Retinal Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Mice lack a fovea, so the defining macular pseudocoloboma cannot be
      modelled; degeneration is pan-retinal.
    evidence:
    - reference: PMID:27207593
      reference_title: Mouse Models of NMNAT1-Leber Congenital Amaurosis (LCA9) Recapitulate Key Features of the Human Disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both mouse models recapitulate key aspects of the human disease and confirm the pathogenicity of mutant NMNAT1."
      explanation: The patient allele reproduces the human retinal disease in mice.
  - target: Retina-Selective Nuclear NAD+ Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:33709122
      reference_title: Mutant Nmnat1 leads to a retina-specific decrease of NAD+ accompanied by increased poly(ADP-ribose) in a mouse model of NMNAT1-associated retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Measurements by liquid chromatography with tandem mass spectrometry showed an early and sustained decrease of NAD+ in mutant retinas that was not observed in other tissues."
      explanation: The model reproduces the tissue-selective NAD+ deficit.
- name: Nmnat1 conditional knockout mouse (adult deletion)
  species: Mouse
  genotype: Nmnat1 floxed, tamoxifen-inducible or photoreceptor-specific Cre
  publication: PMID:33107823
  description: >-
    Adult widespread or photoreceptor-specific deletion of Nmnat1, used to show
    selective photoreceptor loss and SARM1-dependent death.
  modeled_mechanisms:
  - target: SARM1 NADase Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Complete adult deletion rather than hypomorphic patient alleles, and
      disease onset is in adulthood rather than infancy.
    evidence:
    - reference: PMID:33107823
      reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "widespread NMNAT1 depletion in adult mice mirrors the human pathology, with selective loss of photoreceptors highlighting the exquisite vulnerability of these cells to NMNAT1 loss"
      explanation: Adult deletion reproduces selective photoreceptor loss.
treatments:
- name: AAV NMNAT1 Gene Augmentation (Preclinical)
  description: >-
    Subretinal self-complementary AAV carrying human NMNAT1 rescued retinal
    structure and function in the V9M mouse, provided it was given in a narrow
    early window; photoreceptor-restricted expression is sufficient. No human
    trial has been reported.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: NMNAT1 Hypomorphic Loss of Function
  evidence:
  - reference: PMID:32775493
    reference_title: Gene Therapy Preserves Retinal Structure and Function in a Mouse Model of NMNAT1-Associated Retinal Degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gene augmentation therapy, delivered by subretinal injection of adeno-associated virus (AAV) carrying a normal human copy of NMNAT1, rescued retinal structure and function."
    explanation: Proof of concept for gene augmentation in the mouse model.
- name: N-Acetylcysteine (Preclinical)
  description: >-
    The antioxidant N-acetylcysteine reduced oxidative DNA damage, immune
    responses and apoptosis and preserved cones in the V9M mouse. Preclinical
    only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetylcysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  target_mechanisms:
  - target: Photoreceptor Nuclear DNA Damage
  evidence:
  - reference: PMID:41922335
    reference_title: "Oxidative DNA damage drives apoptotic photoreceptor loss in NMNAT1-associated inherited retinal degeneration: a therapeutic opportunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with the antioxidant N-acetylcysteine (NAC) reduced oxidative DNA damage and retinal immune responses, mitigated apoptosis, and preserved cone PRs."
    explanation: Antioxidant protection in the mouse model.
notes: >-
  Phenotypic spectrum: in a pooled series of 129 families, 121 had LCA or
  early-onset severe retinal dystrophy, six cone-rod dystrophy and two
  retinitis pigmentosa. Families with truncating variants all had LCA, while
  the milder cone-rod dystrophy families carried biallelic missense variants
  (PMID:34837036). Two V9M mouse studies disagree on oxidative stress. One found no oxidative
  DNA damage, lipid peroxidation or glutathione change and attributed PARP
  activation to other causes (PMID:33709122); a later study found progressive
  8-oxo-dG accumulation and protection by N-acetylcysteine (PMID:41922335).
  The SARM1 mechanism (PMID:33107823) comes from adult conditional deletion
  rather than patient alleles; how the PARP and SARM1 routes relate is
  unresolved. Covered by the GeneReviews nonsyndromic LCA/EOSRD overview
  (PMID:30285347); there is no NMNAT1-specific chapter.

name: Leber Congenital Amaurosis 9
creation_date: "2026-09-23T14:00:00Z"
category: Mendelian
parents:
- Leber congenital amaurosis
- NMNAT1-related retinopathy
synonyms:
- LCA9
- NMNAT1 Leber congenital amaurosis
- NMNAT1-associated retinal degeneration
description: >-
  Leber congenital amaurosis 9 is an autosomal recessive, retina-restricted
  infantile blindness caused by biallelic hypomorphic variants in NMNAT1, the
  nuclear nicotinamide mononucleotide adenylyltransferase that regenerates the
  nuclear NAD+ pool in every nucleated cell. Despite the enzyme's ubiquity,
  patients have no disease outside the eye. In the p.V9M mouse, NAD+ falls in
  retina but not in other tissues, and photoreceptors are the cells that
  require NMNAT1. Mouse work links the NAD+ shortfall to photoreceptor DNA
  damage with secondary PARP activation, and complete NMNAT1 deletion
  activates the NADase SARM1; both end in apoptotic photoreceptor death with
  secondary microglial infiltration. Clinically it presents in
  infancy with nystagmus, severe visual loss and an extinguished
  electroretinogram, and is distinguished from other LCA forms by early
  degeneration of the central retina (macular pseudocoloboma) with optic
  atrophy, pigmentary change and attenuated retinal vessels.

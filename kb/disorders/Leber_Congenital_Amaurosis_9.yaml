- name: Macular Pseudocoloboma
  category: Ophthalmological
  frequency: VERY_FREQUENT
  description: >-
    The distinctive sign of NMNAT1-LCA: an excavated central lesion with a
    pigmented border and complete loss of foveal neural tissue. It is a
    degenerative lesion, not an optic-fissure coloboma, and has been
    misdiagnosed as congenital toxoplasmosis.
  phenotype_term:
    preferred_term: Macular pseudocoloboma (disciform macular atrophy)
    term:
      id: HP:0001116
      label: Macular pseudocoloboma
  evidence:

    Unlike the liver/kidney-restricted G6PC1 (glycogen storage disease Ia) and
    the largely haematopoietic phenotype of G6PT/SLC37A4 (GSD Ib), G6PC3 is
    ubiquitously expressed. Loss of the enzyme outside the marrow is the
    presumed basis of the extra-haematological features that distinguish
    G6PC3 deficiency from other severe congenital neutropenias: a prominent
    superficial venous pattern, congenital cardiac malformation (most often
    atrial septal defect), and urogenital anomalies. About three-quarters of
    reported patients are syndromic in this way. The step from ubiquitous
    enzyme loss to a specific developmental malformation is NOT mechanistically
    resolved (see the knowledge-gap discussion attached to this node); ER
    stress and increased apoptosis in non-myeloid cells such as fibroblasts is
    the leading, but unproven, explanation.

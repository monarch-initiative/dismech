pathophysiology:
- name: G6PC3 endoplasmic-reticulum phosphatase deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic G6PC3 variants reduce ubiquitous endoplasmic-reticulum
    glucose-6-phosphatase activity. In neutrophils, the critical repair defect
    is failure to dephosphorylate the glucose analog 1,5-AG6P.
  genes:
  - preferred_term: G6PC3
    term:
      id: hgnc:24861
      label: G6PC3
  molecular_functions:
  - preferred_term: glucose-6-phosphatase activity
    term:
      id: GO:0004346
      label: glucose-6-phosphatase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:19118303
    reference_title: "A syndrome with congenital neutropenia and mutations in G6PC3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of G6PC3, the candidate gene encoding glucose-6-phosphatase, catalytic subunit 3, revealed a homozygous missense mutation in exon 6 that abolished the enzymatic activity of glucose-6-phosphatase in all affected children in the two families.
    explanation: The original syndrome paper links G6PC3 variants to loss of glucose-6-phosphatase activity.
  downstream:
  - target: 1,5-AG6P accumulation and hexokinase inhibition
    description: >-
      G6PC3 normally collaborates with G6PT to destroy 1,5-AG6P; deficiency
      allows this glucose analog phosphate to accumulate and inhibit low-KM
      hexokinases.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30626647
      reference_title: "Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT and G6PC3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we demonstrate that G6PT and G6PC3 collaborate to destroy 1,5-anhydroglucitol-6-phosphate (1,5AG6P), a close structural analog of glucose-6-phosphate and an inhibitor of low-KM hexokinases
      explanation: Mechanistic experiments define the metabolite-repair substrate of G6PC3/G6PT.
  - target: Neutrophil glycosylation and oxidase dysfunction
    description: >-
      The same loss of ER glucose-6-phosphatase activity is accompanied by a
      major defect of neutrophil N- and O-glycosylation, including
      hypoglycosylation of the NADPH-oxidase component gp91phox. This is the
      second, parallel branch out of the primary enzyme defect. Whether it is a
      genuinely independent consequence of the ER-luminal lesion or is itself
      downstream of reduced glucose-6-phosphate availability starving
      nucleotide-sugar synthesis is unresolved (see discussion
      gap_g6pc3_glycosylation_vs_metabolite).
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced ER-luminal glucose-6-phosphate handling.
    - Impaired nucleotide-sugar availability for glycan assembly.
    - Truncated neutrophil N- and O-glycan structures.
    evidence:
    - reference: PMID:21385794
      reference_title: "G6PC3 mutations are associated with a major defect of glycosylation: a novel mechanism for neutrophil dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        hypo-glycosylation of gp91(phox), the electron-transporting component of the NADPH oxidase, in all of these patients.
      explanation: >-
        Links G6PC3 mutation directly to a neutrophil glycosylation defect in
        patients, establishing this branch as a consequence of the enzyme
        deficiency.
  - target: Ubiquitous G6PC3 loss in non-haematopoietic tissues
    description: >-
      G6PC3 is ubiquitously expressed, so the same biallelic loss-of-function
      that produces the neutrophil lesion is also present in cardiac, vascular,
      and urogenital tissue, where it underlies the extra-haematological
      features of the syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23758768
      reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        G6PC3 deficiency is characterized by severe congenital neutropenia,
        recurrent bacterial infections, intermittent thrombocytopenia in many
        patients, a prominent superficial venous pattern and a high incidence of
        congenital cardiac defects and uro-genital anomalies.
      explanation: >-
        Establishes that the same G6PC3 deficiency produces both the
        haematological and the extra-haematological arms of the disease.
- name: 1,5-AG6P accumulation and hexokinase inhibition
  biological_scale: MOLECULAR
  description: >-
    Granulocytes deficient in G6PC3 accumulate millimolar 1,5-AG6P, inhibiting
    hexokinase and reducing glucose utilization. This is especially damaging
    for neutrophils, which depend heavily on glycolysis for effector function.
    1,5-AG6P is made by glucose-phosphorylating enzymes from 1,5-anhydroglucitol
    (1,5-AG), an abundant blood polyol of dietary origin — so the toxic
    metabolite is continuously regenerated from the circulating pool, which is
    what makes lowering plasma 1,5-AG a tractable therapeutic target.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: hexokinase activity
    term:
      id: GO:0004396
      label: hexokinase activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: 1,5-anhydroglucitol-6-phosphate
    description: >-
      Nonclassical phosphorylated glucose analog; no CHEBI identifier was
      identified in the local adapter during WP-031 curation.
    modifier: INCREASED
  evidence:
  - reference: PMID:30626647
    reference_title: "Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT and G6PC3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Granulocytes from patients deficient in G6PC3 or G6PT accumulate 1,5AG6P to concentrations (~3 mM) that strongly inhibit hexokinase activity.
    explanation: Patient granulocyte data directly support 1,5-AG6P accumulation and hexokinase inhibition.
  - reference: PMID:35506446
    reference_title: "Successful use of empagliflozin to treat neutropenia in two G6PC3-deficient children: Impact of a mutation in SGLT5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      accumulation of 1,5-anhydroglucitol-6-phosphate (1,5-AG6P), an inhibitor of
      hexokinase made from 1,5-anhydroglucitol (1,5-AG), an abundant polyol
      present in blood
    explanation: >-
      Identifies the precursor of the toxic metabolite as the circulating
      dietary polyol 1,5-AG, which is the basis of the plasma-1,5-AG-lowering
      therapeutic strategy.
  downstream:
  - target: Neutrophil glycolytic block and energy deficit
    description: >-
      Hexokinase inhibition by 1,5-AG6P blocks the first committed step of
      glycolysis in cells that depend on it, so glucose utilization falls.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30626647
      reference_title: "Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT and G6PC3 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In a model of G6PC3-deficient mouse neutrophils, physiological concentrations of 1,5-anhydroglucitol caused massive accumulation of 1,5AG6P, a decrease in glucose utilization, and cell death.
      explanation: Mouse neutrophil experiments connect 1,5-anhydroglucitol exposure to 1,5-AG6P buildup and reduced glucose use.
  - target: Neutrophil functional defects
    description: >-
      1,5-AG6P accumulation decreases neutrophil glucose utilization and can
      cause neutrophil cell death.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30626647

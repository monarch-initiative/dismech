- name: G6PC3 sequencing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Biallelic pathogenic G6PC3 variants confirm the diagnosis. Because the
    disorder is clinically indistinguishable from other severe congenital
    neutropenias when nonsyndromic, G6PC3 should be included in any congenital
    neutropenia gene panel rather than tested only when syndromic features are
    present.
  evidence:
  - reference: PMID:23758768
    reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition can be diagnosed by sequencing the G6PC3 gene.
    explanation: >-
      The disease review names G6PC3 sequencing as the confirmatory diagnostic
      test.
  - reference: PMID:23298686
    reference_title: "G6PC3 mutations cause non-syndromic severe congenital neutropenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe four patients from three families with non-syndromic severe congenital neutropenia and identify four G6PC3 mutations as causative in these cases.
    explanation: >-
      Establishes that G6PC3 disease occurs without syndromic features, so
      absence of cardiac/venous/urogenital signs does not exclude it.
- name: Echocardiography and renal/pelvic ultrasound at diagnosis
  diagnosis_term:
    preferred_term: diagnostic imaging
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  description: >-
    Because congenital cardiac and urogenital malformations are frequent and
    often clinically silent, imaging of the heart and urinary tract is
    recommended in every suspected or confirmed case rather than only when
    symptoms prompt it.
  evidence:
  - reference: PMID:23758768
    reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiogram, renal and pelvic ultrasound scans should be performed in
      all cases of suspected or confirmed G6PC3 deficiency.
    explanation: >-
      The disease review makes this an explicit management recommendation at
      diagnosis.
treatments:
- name: Granulocyte colony-stimulating factor (G-CSF)
  description: >-
    Recombinant G-CSF is the established first-line therapy. It raises the
    neutrophil count, prevents infection, and improves quality of life. It does
    NOT address the upstream metabolic lesion: it drives residual granulopoiesis
    harder rather than removing the 1,5-AG6P hexokinase block, so neutrophil
    function and the IBD phenotype may remain impaired, and some patients fail
    to respond even at large doses.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: granulocyte colony-stimulating factor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant granulocyte colony-stimulating factor
      term:
        id: NCIT:C1287
        label: Recombinant Granulocyte Colony-Stimulating Factor
  target_phenotypes:
  - preferred_term: Severe congenital neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:23758768
    reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with G-CSF leads to improvement in neutrophil numbers, prevents
      infections and improves quality of life.
    explanation: >-
      The disease review states the established benefit of G-CSF in G6PC3
      deficiency.
  - reference: PMID:33259599
    reference_title: "Metabolic abnormalities in G6PC3-deficient human neutrophils result in severe functional defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Administration of granulocyte colony-stimulating factor (G-CSF) resolved
      the neutropenia and allowed for detailed evaluation of human neutrophil
      function.
    explanation: >-
      Support is PARTIAL: G-CSF corrected the neutrophil COUNT, but the same
      study went on to document severely impaired migration, ingestion,
      bactericidal activity, and superoxide generation in those G-CSF-restored
      neutrophils — i.e. the qualitative defect persists.
  notes: >-
    Some patients fail to respond to G-CSF even in large doses, and mildly
    affected patients may be managed with prophylactic antibiotics alone
    (PMID:23758768). G-CSF corrects the neutrophil count but not the
    qualitative defect, because it drives residual granulopoiesis harder
    rather than relieving the upstream 1,5-AG6P hexokinase block — which is
    also why it is not protein replacement (patients are not G-CSF deficient).
    therapeutic_modality is therefore OTHER; see issue #7457 for the enum gap.
- name: Empagliflozin (SGLT2 inhibitor) — substrate-reduction repurposing
  description: >-
    Empagliflozin, an SGLT2 inhibitor licensed for type 2 diabetes, is
    repurposed here as a substrate-reduction therapy. Blocking renal
    reabsorption of 1,5-anhydroglucitol lowers the plasma 1,5-AG pool, which in
    turn lowers intra-neutrophil 1,5-AG6P and relieves the hexokinase block —
    treating the mechanism rather than compensating for its output. This is the
    same repurposing that works in G6PT/SLC37A4 deficiency (glycogen storage
    disease type Ib), which shares the identical final metabolic lesion: G6PT
    and G6PC3 collaborate to destroy 1,5-AG6P, so loss of either produces the
    same accumulation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: empagliflozin
      term:
        id: CHEBI:82720
        label: empagliflozin
  target_mechanisms:
  - target: 1,5-AG6P accumulation and hexokinase inhibition
    treatment_effect: INHIBITS
    description: >-
      SGLT2 blockade increases urinary excretion of 1,5-anhydroglucitol,
      depleting the circulating precursor pool so that less 1,5-AG6P is formed
      inside neutrophils; measured neutrophil 1,5-AG6P falls and hexokinase
      inhibition is relieved.
  target_phenotypes:
  - preferred_term: Severe congenital neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  - preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:35506446
    reference_title: "Successful use of empagliflozin to treat neutropenia in two G6PC3-deficient children: Impact of a mutation in SGLT5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with the SGLT2-inhibitor empagliflozin decreased 1,5-AG in blood
      and 1,5-AG6P in neutrophils and improved (PT1) or normalized (PT2)
      neutrophil counts, allowing to stop GCSF.
    explanation: >-
      Direct demonstration in two G6PC3-deficient children that the drug lowers
      the causal metabolite and corrects the neutrophil count sufficiently to
      withdraw G-CSF.
  - reference: PMID:35838821
    reference_title: "SLGT2 Inhibitor Rescues Myelopoiesis in G6PC3 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant increase in all the hematopoietic cell lineages and
      substantial improvement in the quality of life was observed.
    explanation: >-
      An independent adult case treated with an SGLT2 inhibitor, showing benefit
      extending beyond the neutrophil lineage.
  - reference: PMID:32294159
    reference_title: "Treating neutropenia and neutrophil dysfunction in glycogen storage disease type Ib with an SGLT2 inhibitor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our discovery that accumulating 1,5-anhydroglucitol-6-phosphate (1,5AG6P)
      caused neutropenia in a glucose-6-phosphatase 3 (G6PC3)-deficient mouse
      model and in 2 rare diseases (GSD-Ib and G6PC3 deficiency) led us to
      repurpose the widely used antidiabetic drug empagliflozin
    explanation: >-
      Documents the shared 1,5-AG6P mechanism between GSD Ib and G6PC3
      deficiency that motivated the repurposing, and the original clinical proof
      of concept in GSD-Ib.
  notes: >-
    Off-label use. In the GSD-Ib series no symptomatic hypoglycaemia was
    observed. No dedicated randomised trial exists in G6PC3 deficiency; the
    evidence base is small treated case series.
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    Allogeneic HSCT replaces the G6PC3-deficient myeloid compartment and is
    curative for the haematological and gut-inflammatory disease. It is reserved
    for patients refractory to G-CSF, with G6PC3-associated IBD refractory to
    immune suppression, or with myelodysplastic/leukaemic transformation. It
    does not correct the non-haematopoietic features, since G6PC3 remains
    deficient in the recipient's other tissues.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Neutrophil functional defects
    treatment_effect: RESTORES
    description: >-
      Donor-derived neutrophils carry functional G6PC3, so the metabolic block,
      the functional defect, and the neutropenia are all corrected in the
      transplanted haematopoietic compartment.
  evidence:
  - reference: PMID:32930428
    reference_title: "Neutrophil dysfunction triggers inflammatory bowel disease in G6PC3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSCT led to normalization of neutrophil function and remission of
      gastrointestinal symptoms.
    explanation: >-
      Shows HSCT corrects the neutrophil functional defect, not only the count,
      and resolves the IBD phenotype that G-CSF failed to control.
  - reference: PMID:31157858
    reference_title: "Remission of Inflammatory Bowel Disease in Glucose-6-Phosphatase 3 Deficiency by Allogeneic Haematopoietic Stem Cell Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that HSCT resolves G6PC3-associated immunodeficiency and the
      Crohn's disease phenotype.
    explanation: >-
      An adult case confirming that HSCT resolves both the immunodeficiency and
      the monogenic Crohn phenotype despite G6PC3 also being expressed
      non-haematopoietically.
  notes: >-
    One French-registry patient who developed myelodysplasia and acute myeloid
    leukaemia at age 14 was cured by chemotherapy and HSCT (PMID:25491320).
- name: Antibacterial prophylaxis
  description: >-
    Mildly affected patients whose neutropenia does not reach the severe band
    may be managed with prophylactic antibiotics rather than G-CSF.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  target_phenotypes:
  - preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:23758768
    reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mildly affected patients can be managed with prophylactic antibiotics.
    explanation: >-
      The disease review endorses antibiotic prophylaxis as an alternative in
      mildly affected patients.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    94 patients reported worldwide in the decade after the 2009 gene discovery,
    from at least 14 countries on 4 continents, with 48% from Middle Eastern
    countries (consanguinity-enriched). No population-based prevalence estimate
    exists; the count-in-literature measure is used deliberately rather than a
    fabricated rate.
  evidence:
  - reference: PMID:34964150
    reference_title: "Severe congenital neutropenia due to G6PC3 deficiency: Case series of five patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With a total of 94 patients reported in the past decade
    explanation: >-
      Systematic literature review counting all reported cases from 2009 to
      2020.
- population: French Severe Congenital Neutropenia Registry
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Share of a severe-congenital-neutropenia population, not a general-population
    rate: 14 of 605 registry patients (2.3%) carried biallelic G6PC3 variants.
    Recorded as a genetic-share denominator for differential diagnosis rather
    than as disease occurrence.
  evidence:
  - reference: PMID:25491320
    reference_title: "Clinical spectrum and long-term follow-up of 14 cases with G6PC3 mutations from the French Severe Congenital Neutropenia Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 605 patients included in the French SCN registry, we identified 8
      pedigrees that included 14 patients with autosomal recessive G6PC3
      mutations.
    explanation: >-
      Gives the numerator and denominator for the G6PC3 share of a national
      severe-congenital-neutropenia registry.
discussions:
- discussion_id: gap_g6pc3_nonhaematological_mechanism
  prompt: >-
    By what mechanism does ubiquitous G6PC3 loss produce the specific
    developmental malformations of this syndrome — atrial septal defect,
    prominent superficial venous pattern, and urogenital anomalies — rather than
    a generalised multisystem phenotype, and does 1,5-AG6P accumulation
    contribute to them at all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ubiquitous G6PC3 loss in non-haematopoietic tissues
  rationale: >-
    The haematological arm of this disease is now mechanistically complete and
    pharmacologically actionable (1,5-AG6P to hexokinase to glycolysis to
    neutrophil death, reversed by lowering plasma 1,5-AG). The
    non-haematological arm is not. G6PC3 is ubiquitously expressed, yet the
    malformations are anatomically stereotyped, which a simple "enzyme missing
    everywhere" account does not explain. Nor is it known whether the
    developmental features share the 1,5-AG6P mechanism — a decisive question,
    because if they do, early substrate-reduction therapy might be
    disease-modifying beyond the marrow, whereas if they do not, empagliflozin
    and HSCT will both leave them untouched.
  proposed_experiments:
  - experiment_id: exp_g6pc3_metabolite_outside_granulocytes
    name: Does 1,5-AG6P accumulate outside the granulocyte lineage?
    description: >-
      Measure 1,5-AG6P concentration and glycolytic flux in G6PC3-deficient
      non-myeloid cells — patient dermal fibroblasts and iPSC-derived
      endothelial cells and cardiomyocytes — against isogenic corrected
      controls, to test whether the toxic metabolite accumulates in the tissues
      that carry the developmental malformations.
    experiment_type:
      preferred_term: targeted metabolomics and metabolic flux experiment
  - experiment_id: exp_g6pc3_mouse_developmental_phenotype
    name: Developmental phenotyping of G6PC3-knockout mice with early SGLT2 inhibition
    description: >-
      Determine whether G6PC3-knockout mice reproduce the cardiac, venous, and
      urogenital anomalies seen in patients, and whether maternal or
      early-postnatal SGLT2 inhibition alters their incidence or severity.
    experiment_type:
      preferred_term: model organism developmental phenotyping experiment
  - experiment_id: exp_g6pc3_treated_patient_rephenotyping
    name: Non-haematological outcomes in long-term-treated patients
    description: >-
      Systematically re-phenotype patients on long-term empagliflozin or after
      HSCT to establish whether either therapy modifies any non-haematological
      feature, which would discriminate a shared-metabolite mechanism from an
      independent developmental one.
    experiment_type:
      preferred_term: longitudinal clinical cohort study
  notes: >-
    The leading hypothesis in the literature is that ER stress and increased
    apoptosis in non-myeloid cells (patient fibroblasts show both) underlie the
    developmental features, but this has not been shown to cause a specific
    malformation.
- discussion_id: gap_g6pc3_sglt2_long_term_evidence
  prompt: >-
    Should SGLT2 inhibition replace G-CSF as first-line therapy in G6PC3
    deficiency, and what are the long-term safety and efficacy outcomes in
    children treated from early life?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#1,5-AG6P accumulation and hexokinase inhibition
  rationale: >-
    Empagliflozin acts on the causal metabolite while G-CSF only pushes residual
    granulopoiesis, and the published cases show G-CSF can be tapered or
    stopped. But the entire G6PC3 evidence base is a handful of treated patients
    followed for one to a few years, with no randomised comparison, no
    established paediatric dosing, and no long-term data on growth, bone, or
    renal outcomes of chronic SGLT2 inhibition begun in infancy. Response also
    appears to depend on the individual plasma 1,5-AG level, which varies with
    SGLT5 genotype and with diet, so a uniform first-line recommendation may not
    be appropriate.
  proposed_experiments:
  - experiment_id: exp_g6pc3_sglt2_registry_outcomes
    name: Prospective registry of SGLT2-inhibitor-treated G6PC3 and GSD-Ib patients
    description: >-
      A prospective multi-centre registry study with predefined ANC, infection,
      growth, bone, and renal endpoints, powered to detect long-term harm as
      well as benefit in children started on SGLT2 inhibition in early life.
    experiment_type:
      preferred_term: prospective clinical registry study
  - experiment_id: exp_g6pc3_sglt5_response_stratification
    name: Does baseline plasma 1,5-AG or SGLT5 genotype predict ANC response?
    description: >-
      Correlate pre-treatment plasma 1,5-AG concentration and SGLT5 genotype
      with the magnitude of ANC response to empagliflozin across treated
      patients, to test whether the therapy can be stratified.
    experiment_type:
      preferred_term: pharmacogenomic response-stratification study
- discussion_id: gap_g6pc3_glycosylation_vs_metabolite
  prompt: >-
    Is the neutrophil hypoglycosylation branch (truncated N-/O-glycans,
    gp91phox hypoglycosylation) a downstream consequence of the glycolytic block
    caused by 1,5-AG6P, or an independent parallel mechanism of neutrophil
    dysfunction?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Neutrophil glycosylation and oxidase dysfunction
  rationale: >-
    The glycosylation defect was described before the metabolite-repair
    mechanism was discovered and led to a proposal that G6PC3 deficiency be
    classed as a congenital disorder of glycosylation. Reduced
    glucose-6-phosphate availability could plausibly starve nucleotide-sugar
    synthesis, which would make glycosylation a downstream effect of the same
    lesion; alternatively the ER-luminal role of G6PC3 could affect
    glycosylation directly. The two models are not distinguished, and this entry
    currently models them as parallel branches converging on neutrophil
    dysfunction. The distinction is testable and clinically relevant, because
    substrate reduction should correct a downstream glycosylation defect but not
    an independent one.
  proposed_experiments:
  - experiment_id: exp_g6pc3_glycan_response_to_empagliflozin
    name: Neutrophil glycan profiling before and during SGLT2 inhibition
    description: >-
      Measure neutrophil N-/O-glycan profiles and gp91phox glycosylation in
      G6PC3-deficient patients before and during empagliflozin therapy; a
      correction under substrate reduction would place glycosylation downstream
      of the metabolite block rather than in a parallel branch.
    experiment_type:
      preferred_term: glycomics profiling experiment
  notes: >-
    The GSD-Ib SGLT2 series reported corrected protein glycosylation in 2 of 2
    patients tested under empagliflozin (PMID:32294159), which favours the
    downstream model, but this has not been replicated in G6PC3 deficiency.
notes: >-
  WP-031 placement decision: curate a G6PC3 Deficiency entry rather than only a
  Dursun syndrome entry because independent sources describe a broader G6PC3
  deficiency continuum, including nonsyndromic severe congenital neutropenia and
  syndromic disease with cardiac/urogenital/venous findings. The package code is
  12.2.07.01; the current ICIMD enum exposes the broader
  metabolite_proofreading value.


  MONDO re-anchoring (2026-07-31): the entry previously carried
  disease_term MONDO:0023124 (Dursun syndrome, Orphanet:178503), which is a
  NARROWER G6PC3 entity restricted to the familial pulmonary arterial
  hypertension / leukopenia / atrial septal defect presentation. The correct
  anchor for the full continuum curated here is MONDO:0012930, "autosomal
  recessive severe congenital neutropenia due to G6PC3 deficiency" (SCN4;
  OMIM:612541, Orphanet:331176, RO:0004003 to HGNC:24861 G6PC3). MONDO:0023124
  is retained under mappings as a skos:narrowMatch.


  Adjacent-disease guardrail (named-entity confusion): G6PC3 deficiency must not
  be conflated with G6PC1 deficiency (glycogen storage disease type Ia, von
  Gierke) or with SLC37A4/G6PT deficiency (GSD type Ib). All three affect
  glucose-6-phosphate handling, but they are distinct diseases with distinct
  genes. The relationship with GSD Ib is nonetheless real and mechanistically
  informative rather than incidental: G6PT and G6PC3 collaborate to destroy
  1,5-AG6P, so loss of either produces the same neutrophil metabolite
  accumulation, the same neutropenia and neutrophil dysfunction, and responds to
  the same SGLT2-inhibitor substrate-reduction therapy. GSD Ib additionally has
  the hepatic/renal glycogen-storage phenotype that G6PC3 deficiency lacks.


  Not curated for want of a verifiable quotable source, rather than because they
  are absent from the disease: growth retardation, endocrine abnormalities,
  minor facial dysmorphism, myelokathexis, lymphopenia, thymic hypoplasia, and
  the reported myelodysplasia/AML transformation (a single French-registry
  patient). These are listed in PMID:23758768 as parts of the extended spectrum
  and are candidates for a follow-up curation pass with per-feature evidence.

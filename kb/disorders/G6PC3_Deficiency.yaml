      explanation: Mouse neutrophil experiments connect 1,5-anhydroglucitol exposure to 1,5-AG6P buildup, reduced glucose use, and cell death.
- name: Neutrophil glycolytic block and energy deficit
  biological_scale: CELLULAR
  description: >-
    Myeloid-cell energy metabolism depends primarily on glycolysis, so
    hexokinase inhibition by accumulated 1,5-AG6P translates directly into an
    energy deficit in neutrophils and their bone-marrow precursors. This is the
    step that makes an otherwise ubiquitous enzyme defect present as a
    neutrophil-selective disease.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: granulocyte monocyte progenitor cell
    term:
      id: CL:0000557
      label: granulocyte monocyte progenitor cell

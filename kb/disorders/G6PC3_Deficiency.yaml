  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:35838821
    reference_title: "SLGT2 Inhibitor Rescues Myelopoiesis in G6PC3 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The energy metabolism of myeloid cells depends primarily on glycolysis.
    explanation: >-
      States the glycolytic dependence of myeloid cells that makes hexokinase
      inhibition selectively damaging to the neutrophil lineage. The cited
      publication is an investigator-initiated human study of an
      SGLT2-inhibitor-treated G6PC3 patient, hence HUMAN_CLINICAL, though this
      particular sentence is its framing of established myeloid physiology.
  - reference: PMID:33259599
    reference_title: "Metabolic abnormalities in G6PC3-deficient human neutrophils result in severe functional defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      demonstrated dramatic impairments in early glycolysis (hexose phosphate
      levels), hexosemonophosphate shunt (required for the generation of the
      NADPH), and the total adenylate pool
    explanation: >-
      Stable-isotope metabolomics in patient neutrophils confirms the glycolytic
      block and the resulting fall in the adenylate (energy) pool in human
      G6PC3 deficiency, not only in the mouse model.
  downstream:
  - target: Endoplasmic reticulum stress and increased myeloid apoptosis
    description: >-
      Impaired glucose flux lowers intracellular glucose and glucose-6-phosphate,
      provoking an endoplasmic-reticulum stress response and pro-apoptotic
      signalling in myeloid cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cytoplasmic glucose and glucose-6-phosphate.
    - PERK/BiP-mediated unfolded protein response.
    - GSK-3beta activation and Mcl-1 destabilization.
    evidence:
    - reference: PMID:23758768
      reference_title: "A clinical and molecular review of ubiquitous glucose-6-phosphatase deficiency caused by G6PC3 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        result in reduced enzyme activity, endoplasmic reticulum stress response,
        increased rates of apoptosis of affected cells and dysfunction of neutrophil
      explanation: >-
        The review links reduced G6PC3 enzyme activity to ER stress and
        increased apoptosis as the intermediate steps to neutrophil loss.
  - target: Neutrophil functional defects
    description: >-
      Neutrophil effector functions (chemotaxis, respiratory burst,
      bactericidal killing) are ATP- and NADPH-expensive and fail when
      glycolysis and the hexose monophosphate shunt are impaired.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33259599
      reference_title: "Metabolic abnormalities in G6PC3-deficient human neutrophils result in severe functional defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In human deficiency of G6PC3, metabolic defects resulting from the enzyme deficiency account for diverse neutrophil functional defects and present a major risk of infection.
      explanation: >-
        Attributes the functional defects of patient neutrophils to the
        metabolic lesion.
- name: Endoplasmic reticulum stress and increased myeloid apoptosis
  biological_scale: CELLULAR
  description: >-
    G6PC3-deficient neutrophils, myeloid progenitors, and fibroblasts show
    increased endoplasmic-reticulum stress, increased GSK-3beta activity, and
    increased susceptibility to apoptosis. Accelerated death of maturing
    granulocytic precursors is what converts a metabolic lesion into a
    quantitative neutropenia rather than a purely functional defect.

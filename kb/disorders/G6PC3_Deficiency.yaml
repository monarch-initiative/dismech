biochemical:
- name: Absolute neutrophil count
  presence: DECREASED
  context: >-
    The absolute neutrophil count (ANC) is the defining laboratory measurement
    of the disease. In G6PC3 deficiency the ANC is typically in the severe band
    (<500/uL) at diagnosis and may fluctuate only marginally, in contrast to the
    regular oscillation of cyclic neutropenia. It is also the response variable
    for both G-CSF and empagliflozin therapy.
  biomarker_term:
    preferred_term: absolute neutrophil count
  readouts:
  - target: Endoplasmic reticulum stress and increased myeloid apoptosis
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A falling ANC reports the net loss of maturing granulocytic precursors to
      apoptosis; ANC recovery is the standard endpoint for treatments aimed at
      the upstream metabolic lesion.
    evidence:
    - reference: PMID:25491320
      reference_title: "Clinical spectrum and long-term follow-up of 14 cases with G6PC3 mutations from the French Severe Congenital Neutropenia Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neutropenia was profound (<0.5 × 109/l) in almost all cases at diagnosis
        and could marginally fluctuate.
      explanation: >-
        Establishes the ANC as the primary quantitative disease readout and its
        typical severity at presentation.
  reference_ranges:
  - loinc_term:
      id: LOINC:751-8
      label: Neutrophils [#/volume] in Blood by Automated count
    lower_bound: 1500.0
    unit: cells/uL
    population: adults
    notes: >-
      One-sided interval: chronic neutropenia is diagnosed below 1,500/uL, so
      only a lower bound is given. Paediatric lower limits are age-dependent and
      lower in infancy and in individuals of African ancestry (benign ethnic
      neutropenia); this interval is the adult chronic-neutropenia threshold.
    evidence:
    - reference: PMID:30078793
      reference_title: "[Reference guide for adult chronic neutropenia]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        diagnosis of chronic neutropenia is based on recurrent or continuous
        neutropenia defined by absolute neutrophil count (ANC) less than
        1,500/µl for over three or more months
      explanation: >-
        Source for the 1,500/uL lower bound. Evidence source is OTHER because
        this is a consensus reference guide rather than a primary study.
    interpretation_bands:
    - name: Normal
      lower_bound: 1500.0
      unit: cells/uL
      abnormal_flag: NORMAL
      interpretation: ANC at or above 1,500/uL is not neutropenic.
    - name: Mild neutropenia
      lower_bound: 1000.0
      upper_bound: 1500.0
      unit: cells/uL
      abnormal_flag: LOW
      severity: MILD
      phenotype_term:
        preferred_term: Neutropenia
        term:
          id: HP:0001875
          label: Decreased total neutrophil count
      interpretation: >-
        Mild neutropenia; infection risk is close to background. Some G6PC3
        patients sit in this band and can be managed with prophylactic
        antibiotics alone.
    - name: Moderate neutropenia
      lower_bound: 500.0
      upper_bound: 1000.0
      unit: cells/uL
      abnormal_flag: LOW
      severity: MODERATE
      phenotype_term:
        preferred_term: Neutropenia
        term:
          id: HP:0001875
          label: Decreased total neutrophil count
      interpretation: Moderate neutropenia with intermediate infection risk.
    - name: Severe neutropenia
      upper_bound: 500.0
      unit: cells/uL
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
      phenotype_term:
        preferred_term: Severe congenital neutropenia
        term:
          id: HP:0001875
          label: Decreased total neutrophil count
      interpretation: >-
        Severe neutropenia; the band occupied by almost all G6PC3-deficient
        patients at diagnosis and the threshold at which severe pyogenic
        infection risk rises sharply and G-CSF is indicated.
  evidence:
  - reference: PMID:25491320
    reference_title: "Clinical spectrum and long-term follow-up of 14 cases with G6PC3 mutations from the French Severe Congenital Neutropenia Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neutropenia was profound (<0.5 × 109/l) in almost all cases at diagnosis
      and could marginally fluctuate.
    explanation: >-
      Long-term registry follow-up documents profound neutropenia at diagnosis
      in nearly all G6PC3 patients.
- name: 1,5-anhydroglucitol-6-phosphate
  presence: INCREASED
  context: >-
    1,5-AG6P is the nonclassical phosphorylated glucose analog that accumulates
    in G6PC3- or G6PT-deficient granulocytes and inhibits low-KM hexokinases.
  biomarker_term:
    preferred_term: 1,5-anhydroglucitol-6-phosphate
  readouts:
  - target: 1,5-AG6P accumulation and hexokinase inhibition
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased 1,5-AG6P reports the failed G6PC3/G6PT metabolite-repair reaction.
    evidence:
    - reference: PMID:30626647
      reference_title: "Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT and G6PC3 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Granulocytes from patients deficient in G6PC3 or G6PT accumulate 1,5AG6P to concentrations (~3 mM) that strongly inhibit hexokinase activity.
      explanation: Patient granulocyte data support 1,5-AG6P as the proximal biochemical readout.
  evidence:
  - reference: PMID:30626647
    reference_title: "Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT and G6PC3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Granulocytes from patients deficient in G6PC3 or G6PT accumulate 1,5AG6P to concentrations (~3 mM) that strongly inhibit hexokinase activity.
    explanation: Patient granulocyte data support increased 1,5-AG6P in G6PC3 deficiency.
- name: Plasma 1,5-anhydroglucitol
  presence: PRESENT
  context: >-
    1,5-Anhydroglucitol is an abundant, largely dietary blood polyol and the
    precursor from which the toxic 1,5-AG6P is generated intracellularly. Plasma
    1,5-AG is not itself abnormal in G6PC3 deficiency — it is the pharmacological
    handle: SGLT2 inhibition blocks its renal reabsorption, lowers the plasma
    pool, and thereby lowers neutrophil 1,5-AG6P. Interindividual variation in
    1,5-AG clearance (e.g. an SGLT5 variant) modifies disease severity.
  biomarker_term:
    preferred_term: 1,5-anhydroglucitol
  readouts:
  - target: 1,5-AG6P accumulation and hexokinase inhibition
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Plasma 1,5-AG is the upstream substrate pool; lowering it with an SGLT2
      inhibitor is the direct pharmacodynamic readout of the therapy and tracks
      the fall in neutrophil 1,5-AG6P.
    evidence:
    - reference: PMID:35506446
      reference_title: "Successful use of empagliflozin to treat neutropenia in two G6PC3-deficient children: Impact of a mutation in SGLT5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with the SGLT2-inhibitor empagliflozin decreased 1,5-AG in
        blood and 1,5-AG6P in neutrophils
      explanation: >-
        Demonstrates the plasma-1,5-AG to neutrophil-1,5-AG6P pharmacodynamic
        chain directly in G6PC3-deficient patients.
  evidence:
  - reference: PMID:35506446
    reference_title: "Successful use of empagliflozin to treat neutropenia in two G6PC3-deficient children: Impact of a mutation in SGLT5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which had low blood 1,5-AG levels and only required GCSF during severe
      infections
    explanation: >-
      Shows that a low endogenous plasma 1,5-AG level (here from an SGLT5
      missense variant increasing urinary clearance) attenuates the disease,
      confirming plasma 1,5-AG as a severity-determining variable.
- name: Neutrophil gp91phox hypoglycosylation
  presence: PRESENT
  context: >-
    Hypoglycosylation of gp91phox/NADPH oxidase is a CDG-like biochemical and
    cellular readout of G6PC3-related neutrophil dysfunction.
  readouts:
  - target: Neutrophil glycosylation and oxidase dysfunction
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: gp91phox hypoglycosylation reports the glycosylation branch of neutrophil dysfunction.
    evidence:
    - reference: PMID:21385794
      reference_title: "G6PC3 mutations are associated with a major defect of glycosylation: a novel mechanism for neutrophil dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        hypo-glycosylation of gp91(phox), the electron-transporting component of the NADPH oxidase, in all of these patients.
      explanation: Patient neutrophil glycomics support gp91phox hypoglycosylation as a mechanistic readout.
  evidence:
  - reference: PMID:21385794
    reference_title: "G6PC3 mutations are associated with a major defect of glycosylation: a novel mechanism for neutrophil dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This aberrant neutrophil glycosylation is predicted to have profound effects on the neutrophil function and merit designation of both syndromes as a new class of congenital disorders of glycosylation.
    explanation: The glycosylation paper supports classifying the glycan abnormality as a CDG-like mechanism.

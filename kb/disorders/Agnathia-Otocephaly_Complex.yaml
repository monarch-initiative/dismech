  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, two genes have been described in humans to be involved in this condition: OTX2 and PRRX1."

- name: Airway Obstruction and Perinatal Respiratory Failure
  description: >-
    The distorted upper airway produced by the absent mandible and oropharyngeal
    maldevelopment, together with associated forebrain/multisystem defects,
    can prevent establishment of a patent airway at birth and cause perinatal
    respiratory failure — the proximate cause of the usually lethal outcome.
    The same anatomy can make
    deglutition impossible, so the failure is aerodigestive as well as
    respiratory: impaired fetal swallowing produces polyhydramnios in utero, and
    coexisting pulmonary hypoplasia can be fatal even when an airway is
    successfully secured at delivery.
  biological_scale: ORGANISM
  role: consequence

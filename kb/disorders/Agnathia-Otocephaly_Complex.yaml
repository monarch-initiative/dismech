    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found defects in external, middle and inner ear, reduction or loss of skull bones, a reduced and sometimes cleft mandible, and limb abnormalities including postaxial polydactyly and bent zeugopods.
    explanation: Prx1/Prx2 double-mutant mice reproduce the reduced/cleft mandible and ear defects of the human first-arch malformation.
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: It was found that otx2 can interact genetically with pgap1, prrx1, and msx1 to exacerbate mandibular and midline defects during zebrafish development.
    explanation: Functional zebrafish evidence that otx2 interacts with prrx1 (and msx1) to worsen the mandibular and midline defects characteristic of the disorder.
  downstream:
  - target: Failed Ventrolateral Migration of the Ears
  - target: Airway Obstruction and Perinatal Respiratory Failure
- name: Failed Ventrolateral Migration of the Ears
  description: >-
    Normal lateral and upward migration of the developing external ears depends
    on the growth of the mandibular skeleton. When the mandible fails to form,
    the auricles remain in their ventromedial embryonic position and may fuse in
    the midline below the face — the melotia/synotia that gives otocephaly its
    name. Together with the mandibular defect this constitutes the serially
    homologous, multi-element first-arch craniofacial malformation.
  biological_scale: TISSUE
  role: consequence
  conforms_to: pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives

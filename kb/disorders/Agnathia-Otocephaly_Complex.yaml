      reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The ex-utero intrapartum treatment (EXIT) procedure is basically indicated for a fetus with a high risk of airway obstruction immediately after birth"
      explanation: >-
        The near-universal indication for EXIT in this complex reflects the

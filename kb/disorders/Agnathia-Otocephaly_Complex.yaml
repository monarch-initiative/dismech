- name: OTX2
  gene_term:
    preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  relationship_type: CAUSATIVE
  notes: >-
    OTX2 (orthodenticle homeobox 2), a known microphthalmia/anophthalmia locus,
    is the second established causal gene. OTX2 variants (point mutations and
    deletions) show incomplete penetrance and striking intrafamilial variability,
    and OTX2 mutations alone may not be sufficient — a second genetic hit is
    proposed. OTX2 accounted for 7 of the ~32 genetically tested patients in the
    2021 review. Lesions span frameshift and missense point mutations, small
    in-frame and out-of-frame deletions, and contiguous deletions of the whole
    locus detectable only by array-CGH.
  case_fractions:
  - population: Pooled cohort plus 1998-2019 literature review of genetically tested AOC patients
    case_fraction_percent: 21.9
    cohort_size: 32
    notes: >-
      7 of 32 genetically tested patients carried an OTX2 lesion: 6 of the 22
      literature patients plus 1 further array-CGH-detected deletion in the
      authors' own 10-patient cohort. Together with the 4 PRRX1 patients this
      gives the reported 11 of 32 (34%).
    evidence:
    - reference: PMID:32643087
      reference_title: Re-focusing on Agnathia-Otocephaly complex.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: Among those 22 patients, 6 were carrying mutation or deletion in the OTX2 gene and 4 in the PRRX1 gene.
      explanation: >-
        Gives the OTX2 count within the 22 genetically tested literature
        patients; PARTIAL because the denominator here is 22, not the pooled 32.
    - reference: PMID:32643087
      reference_title: Re-focusing on Agnathia-Otocephaly complex.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: array-CGH has allowed identifying a 107-kb deletion encompassing OTX2 responsible for the agnathia-otocephaly complex phenotype in 1 of them
      explanation: >-
        Supplies the seventh OTX2 patient, from the authors' own cohort, that
        brings the pooled OTX2 count to 7 of 32.
    - reference: PMID:32643087
      reference_title: Re-focusing on Agnathia-Otocephaly complex.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a total of 32 patients benefited from genetic testing, with only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1.
      explanation: Fixes the pooled denominator and the combined OTX2+PRRX1 solved count.
  evidence:
  - reference: PMID:22577225

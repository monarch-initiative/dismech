inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    An autosomal recessive pattern (the classic OMIM:202650 designation) rests on
    limited biallelic PRRX1 and consanguineous reports; the literature cautions
    that a consanguineous case does not make the disorder generally recessive.
    Most cases overall are sporadic. In at least one apparently recessive
    pedigree the true mechanism proved to be paternal germline mosaicism rather
    than autosomal recessive transmission, so recurrence-risk counselling
    requires care.
  evidence:
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Agnathia-otocephaly is a rare craniofacial malformation complex that is caused by de novo heterozygous and biallelic mutations in PRRX1 in two unrelated babies, respectively.
    explanation: >-
      Establishes that biallelic PRRX1 lesions have been reported alongside the
      de novo heterozygous mechanism.
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Results of SNP genotyping coupled with recurrence of this novel mutation in this family are consistent with a paternally derived germline mosaicism rather than autosomal recessive inheritance as predicted by the family history.
    explanation: >-
      Qualifies the recessive interpretation: familial recurrence can reflect
      germline mosaicism rather than true recessive inheritance.
- name: Autosomal dominant / de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  penetrance: INCOMPLETE
  description: >-
    OTX2-related disease is typically dominant, frequently de novo, with marked
    intrafamilial variability and incomplete penetrance (an unaffected parent may
    transmit the variant). The single reported SMAD3 case was also a de novo
    dominant-acting variant. This dominant/de novo mode coexists with the
    recessive PRRX1 form and the sporadic majority.
  evidence:
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the mutation was inherited from a microphthalmic mother
    explanation: Documents dominant transmission of an OTX2 variant from an affected (microphthalmic) parent to an otocephalic child, supporting the AD/variable-expressivity mode.
  - reference: PMID:36553536
    reference_title: Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most AOC cases are due to a de novo sporadic mutation.
    explanation: Supports a predominantly de novo heterozygous origin.
  - reference: PMID:36553536
    reference_title: Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AOC is characterized by a wide severity clinical spectrum even when occurring within the same family, ranging from a mild mandibular defect to an extreme facial aberration incompatible with life.
    explanation: Directly supports the VARIABLE expressivity qualifier.
  - reference: PMID:25589041
    reference_title: Agnathia-otocephaly complex and asymmetric velopharyngeal insufficiency due to an in-frame duplication in OTX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The same variant was also identified in the proband's clinically unaffected 38-year-old husband and their 9-year-old daughter, who presented with a small mandible, normal ears and velopharyngeal insufficiency due to a short hemi-palate.
    explanation: >-
      An obligate carrier who is clinically unaffected establishes the
      INCOMPLETE penetrance qualifier for this dominant mechanism.

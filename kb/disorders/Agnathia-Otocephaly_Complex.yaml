- name: Serially Homologous Craniofacial Malformation with Ventromedial Ear Displacement
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives"
  description: >-
    Because the mandible normally occupies the space between the developing
    external ears, its absence allows the first- and second-arch-derived
    auricles to migrate ventromedially and caudally toward the midline, where
    they may approximate or fuse (synotia). The recognizable gestalt is
    therefore a coordinated multi-element defect - agnathia plus abnormally
    located ears plus microstomia and aglossia - and the ear position is the
    key prenatal diagnostic sign.
  biological_processes:
  - preferred_term: face morphogenesis
    term:
      id: GO:0060325
      label: face morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: pharyngeal arch 2

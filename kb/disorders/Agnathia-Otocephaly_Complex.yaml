      series, supporting an occasional association.
progression:
- phase: Embryonic origin
  age_range: Gastrulation through first pharyngeal arch development
  notes: >-
    The lesion is established during early embryogenesis, when the rostral
    head is specified and the first pharyngeal arch is patterned. The
    malformation is structurally complete before birth and does not
    progress thereafter — what changes with time is the clinical
    consequence of the fixed anatomy.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agnathia-otocephaly is a rare and lethal anomaly affecting craniofacial
      structures derived from the first pharyngeal arch.
    explanation: >-
      Locates the origin of the anomaly in first-pharyngeal-arch derivatives,
      fixing the embryonic developmental window for this phase.
- phase: Prenatal recognition
  age_range: First trimester onward
  notes: >-
    Detectable by targeted ultrasound from the first trimester. Impaired
    fetal swallowing produces progressive polyhydramnios, which can itself
    precipitate preterm delivery.
  evidence:
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First-trimester ultrasound findings in 4 fetuses with
      agnathia-otocephaly complex are described.
    explanation: >-
      Documents first-trimester detectability, fixing the earliest point of
      clinical recognition.
- phase: Perinatal critical window and outcome
  age_range: Delivery through the neonatal period
  notes: >-
    Delivery is the decisive intervention point: upper-airway obstruction
    can be immediately fatal. Most affected pregnancies end in termination
    after prenatal diagnosis, stillbirth, or death within hours to days of
    birth. Survival beyond the neonatal period is exceptional and largely
    confined to isolated (non-holoprosencephalic) forms in which an airway
    is successfully secured; even then, coexisting pulmonary hypoplasia may
    be fatal.
  evidence:
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 6 cases, the parents opted for termination of pregnancy. The
      remaining case resulted in premature delivery at 26 weeks due to
      severe polyhydramnios and early neonatal death.
    explanation: >-
      All 7 analysed pregnancies ended in termination or early neonatal
      death, documenting the near-uniformly fatal outcome.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, milder variants of the isolated type of AOC have been
      reported as nonlethal.
    explanation: >-
      Establishes that the isolated form is not uniformly lethal, defining
      the exception to the otherwise fatal course.
pathophysiology:
- name: Anterior Patterning Transcription Factor Insufficiency
  description: >-
    The upstream lesion in molecularly solved cases is reduced or altered
    activity of a homeobox transcription factor governing rostral head
    patterning — most securely OTX2 (haploinsufficiency and altered-function
    in-frame variants) and, in a smaller subset, PRRX1. OTX2 is expressed
    across the presumptive fore- and midbrain from the earliest stages of
    head formation; PRRX1 is expressed in undifferentiated cranial neural
    crest and acts with PRRX2 and OTX2 to pattern the first pharyngeal arch.
    Because gene dosage rather than complete absence is the operative
    variable, the resulting phenotype is exquisitely sensitive to genetic
    background, which explains the extreme intrafamilial variability seen in
    humans.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
    modifier: ABNORMAL
  evidence:
  - reference: PMID:7590242
    reference_title: "Mouse Otx2 functions in the formation and patterning of rostral head."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Among these, Otx2 expression covers the entire fore- and midbrains and
      takes place earliest.
    explanation: >-
      Establishes the earliest and broadest rostral expression domain of
      Otx2, the substrate on which haploinsufficiency acts.
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants affecting function of OTX2 and PRRX1, which together regulate
      the neural crest cells and the patterning of the first pharyngeal arch
      as well as skeletal and limb development, were identified to be causal
      for the anomaly in a few patients.
    explanation: >-
      States the shared molecular function of the two established disease
      genes — regulation of neural crest and first-arch patterning.
  downstream:
  - target: Cranial Neural Crest and First Arch Ectomesenchyme Failure
    description: >-
      Loss of transcription-factor dosage removes the patterning input
      required for cranial neural crest to populate and pattern the first
      pharyngeal arch.
    evidence:
    - reference: PMID:32100971
      reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Variants affecting function of OTX2 and PRRX1, which together regulate
        the neural crest cells and the patterning of the first pharyngeal arch
        as well as skeletal and limb development, were identified to be causal
        for the anomaly in a few patients.
      explanation: >-
        Places the transcription factors directly upstream of neural crest
        regulation and first-arch patterning, which is the causal link this
        edge asserts.
- name: Cranial Neural Crest and First Arch Ectomesenchyme Failure
  description: >-
    Cranial neural crest cells fail to migrate into and/or to be correctly
    specified within the first (and to a lesser extent second) pharyngeal
    arch, and the mandibular prominences fail to grow. The conventional
    description is a defect of blastogenesis: failed mesenchymal migration
    of the maxillary prominence with atrophy of the mandibular prominences.
    Because the affected field is rostrally restricted, hyoid-arch
    derivatives can be spared while first-arch derivatives are devastated.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DECREASED
  - preferred_term: embryonic viscerocranium morphogenesis
    term:
      id: GO:0048703
      label: embryonic viscerocranium morphogenesis
    modifier: ABNORMAL
  locations:
  - preferred_term: pharyngeal arch 1
    term:
      id: UBERON:0004362
      label: pharyngeal arch 1
  evidence:
  - reference: PMID:20849990
    reference_title: "Current perspectives on the etiology of agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is a principal anomaly derived from the first pharyngeal arch as a
      consequence of failed mesenchymal migration of the maxillary
      prominence and atrophy in the development of the mandibular
      prominences.
    explanation: >-
      States the accepted cellular mechanism — failed mesenchymal migration
      and mandibular prominence atrophy — as the proximate cause of the
      malformation.
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is considered a defect of blastogenesis, resulting in the variable
      dysmorphogenesis of structures developing from the first pharyngeal
      arch derivatives or a failure of neural crest cells to migrate into
      the first and second pharyngeal arches
    explanation: >-
      Frames the disorder as a blastogenesis/neural-crest-migration defect
      of the first and second pharyngeal arches.
  - reference: PMID:7590242
    reference_title: "Mouse Otx2 functions in the formation and patterning of rostral head."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, heterozygous mutants displayed craniofacial malformations
      designated as otocephaly; affected structures appeared to correspond
      to the most posterior and most anterior domains of Otx expression
      where Otx1 is not expressed.
    explanation: >-
      Mouse Otx2 heterozygotes recapitulate otocephaly, and the affected
      structures map onto a spatially restricted rostral expression domain,
      supporting a regionally confined developmental field defect.
  downstream:
  - target: Mandibular Agenesis and Otocephalic Facial Configuration
    description: >-
      Atrophy of the mandibular prominences is the direct anatomical
      consequence of the failed first-arch mesenchymal contribution.
    evidence:
    - reference: PMID:20849990
      reference_title: Current perspectives on the etiology of agnathia-otocephaly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        as a consequence of failed mesenchymal migration of the maxillary
        prominence and atrophy in the development of the mandibular
        prominences
      explanation: >-
        States the causal sequence asserted by this edge: failed mesenchymal
        migration leads to atrophy of the mandibular prominences.
- name: Mandibular Agenesis and Otocephalic Facial Configuration
  description: >-
    Failure of the mandibular prominences to grow leaves Meckel's cartilage
    and the dentary/mandible absent or vestigial. The resulting collapse of
    lower facial height allows the ear primordia — which normally ascend as
    the mandible grows — to remain low and to converge ventromedially,
    producing melotia and, at the extreme, midline synotia. The oral
    aperture and tongue territory, which depend on the same first-arch
    mesenchyme, are correspondingly reduced or absent.
  biological_scale: TISSUE
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This severe anomaly of the first branchial arch is most often lethal.
    explanation: >-
      Identifies the anatomical level at which the developmental lesion is
      expressed — the first branchial arch — and its clinical consequence.
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found defects in external, middle and inner ear, reduction or loss
      of skull bones, a reduced and sometimes cleft mandible, and limb
      abnormalities including postaxial polydactyly and bent zeugopods.
    explanation: >-
      Prx1/Prx2 (PRRX1/PRRX2 orthologue) double mutants develop coupled
      mandibular and ear defects, the animal-model correlate of the coupled
      jaw-and-ear malformation that defines otocephaly.
  downstream:
  - target: Impaired Fetal Swallowing and Perinatal Airway Obstruction
    description: >-
      The fixed first-arch anatomy becomes clinically lethal at delivery
      through ventilatory failure.
    evidence:
    - reference: PMID:17438667
      reference_title: "Otocephaly: report of five new cases and a literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The malformation spectrum is essentially lethal, because of
        ventilatory problems, and represents a developmental field defect of
        blastogenesis primarily affecting thefirst branchial arch derivatives.
      explanation: >-
        Links the first-arch derivative defect to ventilatory failure, the
        causal step this edge asserts.
- name: Impaired Fetal Swallowing and Perinatal Airway Obstruction
  description: >-
    Prenatally, microstomia and oroglossal hypoplasia impair fetal
    swallowing and produce polyhydramnios. At delivery, the same anatomy —
    absent mandibular support, abnormal or absent tongue, tiny oral aperture
    — obstructs the upper airway and makes conventional intubation
    impossible, causing rapidly fatal respiratory failure unless an airway
    is secured at birth.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17438667
    reference_title: "Otocephaly: report of five new cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The malformation spectrum is essentially lethal, because of
      ventilatory problems, and represents a developmental field defect of
      blastogenesis primarily affecting thefirst branchial arch derivatives.
    explanation: >-
      Connects the first-arch field defect to ventilatory failure as the
      terminal event.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ex-utero intrapartum treatment (EXIT) procedure is basically
      indicated for a fetus with a high risk of airway obstruction
      immediately after birth
    explanation: >-
      Confirms that the clinical problem at delivery is anticipated critical
      airway obstruction, motivating EXIT-based management.
- name: Modifier-Dependent Variable Expressivity
  description: >-
    An identical primary lesion produces phenotypes ranging from mild
    isolated micrognathia to lethal agnathia with holoprosencephaly. In mice
    this is demonstrably attributable to unlinked modifier loci: Otx2
    heterozygotes on a C57BL/6 background lose the mandible while the same
    allele on a CBA background produces no visible defect at birth, and two
    modifier loci (Otmf2, Otmf18) have been mapped. Zebrafish
    trans-suppression experiments show otx2 interacts genetically with
    prrx1, msx1, and pgap1, and the observation that OTX2 loss of function
    is insufficient on its own has been formalized as a "second genetic hit"
    requirement. This oligogenic architecture is the leading explanation
    both for incomplete penetrance and for why roughly two-thirds of tested
    patients remain molecularly unexplained.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12183386
    reference_title: "Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      most of the offspring of Otx2 knock-out chimeras, which are equivalent
      to the F(1) of CBA and B6 strains, backcrossed with B6 females display
      reduction or loss of mandible, whereas those backcrossed with CBA
      females do not show noticeable phenotype at birth.
    explanation: >-
      Demonstrates that genetic background alone determines whether an
      identical Otx2 heterozygous lesion produces mandibular agenesis or no
      phenotype.
  - reference: PMID:12183386
    reference_title: "Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We identified one significant locus, Otmf18, between D18Mit68 and
      D18Mit120 on chromosomes 18, linked to the mandibular phenotype (LOD
      score 3.33).
    explanation: >-
      Maps a specific modifier locus controlling the mandibular phenotype,
      giving the modifier model concrete genetic support.
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It was found that otx2 can interact genetically with pgap1, prrx1, and
      msx1 to exacerbate mandibular and midline defects during zebrafish
      development.
    explanation: >-
      In vivo genetic-interaction data showing that otx2 dosage combines
      with other loci to determine mandibular and midline severity.
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of OTX2 involvement in otocephaly/dysgnathia in humans,
      even if loss of function mutations at this locus does not sufficiently
      explain the complex anatomical defects of these patients, suggests the
      requirement for a second genetic hit.
    explanation: >-
      States the two-hit/oligogenic interpretation explicitly for human
      OTX2-related otocephaly.
genetic:
- name: OTX2
  gene_term:
    preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  association: Causative
  features: >-
    Heterozygous OTX2 loss-of-function variants (frameshift, whole-gene and
    intragenic deletions) and altered-function in-frame duplications within
    the homeodomain cause agnathia-otocephaly. OTX2 was first implicated
    through a family in which two cousins with micro/anophthalmia each had
    offspring with otocephaly. Penetrance is markedly incomplete and
    expressivity extreme: the same c.271_273dupCAG p.(Gln91dup) allele
    produced lethal fetal agnathia-otocephaly in two pregnancies while an
    adult male carrier was clinically unaffected. OTX2 is the more
    frequently mutated of the two established genes.
  evidence:
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OTX2, a known microphthalmia locus, was screened in this family and a
      frameshifting mutation was found. The study subsequently identified in
      one unrelated otocephalic patient a sporadic OTX2 mutation.
    explanation: >-
      Original human genetic evidence implicating OTX2 in
      otocephaly-dysgnathia, both familial and sporadic.
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened 4 otocephalic cases for these 2 genes and identified OTX2
      mutations in 2 of them, thus confirming OTX2 is implicated in
      otocephaly.
    explanation: >-
      Independent replication confirming OTX2 as a disease gene for
      otocephaly-dysgnathia complex.
  - reference: PMID:36553536
    reference_title: "Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic analysis showed a novel 10 bp deletion mutation
      c.766_775delTTGGGTTTTA in the OTX2 gene, which has never been reported
      before, together with a missense variant c.778T>C in cis conformation.
    explanation: >-
      Documents a de novo OTX2 deletion in a prenatally diagnosed severe
      agnathia-otocephaly fetus, extending the allelic spectrum.
  - reference: PMID:25589041
    reference_title: "Agnathia-otocephaly complex and asymmetric velopharyngeal insufficiency due to an in-frame duplication in OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed in fetal DNA from one of these two
      offspring revealing a heterozygous duplication in OTX2:
      c.271_273dupCAG, p.(Gln91dup). This change leads to the insertion of a
      glutamine within the OTX2 homeodomain region, and is predicted to
      alter this signaling molecule's ability to interact with DNA.
    explanation: >-
      Establishes an altered-function homeodomain mechanism distinct from
      simple haploinsufficiency, and links it to DNA-binding impairment.
- name: PRRX1
  gene_term:
    preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  association: Causative
  features: >-
    PRRX1 encodes a paired-related homeobox transcriptional regulator
    expressed in undifferentiated cranial neural crest. Both de novo
    heterozygous and biallelic PRRX1 variants have been reported in
    agnathia-otocephaly. A poly-A tract in the gene is a mutational hotspot:
    a c.266_269dupAAAA frameshift arising by DNA replication slippage was
    shown by COS7 expression assays to cause loss of function, while the
    in-frame c.267_269dupAAA carried by the father did not. Within one
    family the same lesion produced both severe bilateral Pruzansky III
    retrognathia and full agnathia-otocephaly, defining a continuous
    craniofacial severity spectrum. PRRX1 accounts for fewer cases than
    OTX2.
  evidence:
  - reference: PMID:23444262
    reference_title: "Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agnathia-otocephaly is a rare craniofacial malformation complex that
      is caused by de novo heterozygous and biallelic mutations in PRRX1 in
      two unrelated babies, respectively.
    explanation: >-
      States that both heterozygous and biallelic PRRX1 mutation mechanisms
      have been documented in agnathia-otocephaly.
  - reference: PMID:23444262
    reference_title: "Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of both mutations in COS7 cells showed loss of function of
      the frame shift mutation only.
    explanation: >-
      Cell-based functional assay establishing loss of function as the
      mechanism for the pathogenic frameshift and distinguishing it from the
      benign in-frame variant.
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is expressed in undifferentiated human embryonic cranial neural crest
      cells and most abundantly in cardiac, skeletal, and smooth muscle
      tissues in adults
    explanation: >-
      Establishes PRRX1 expression in human embryonic cranial neural crest,
      the cell population whose failure produces the malformation.
- name: SMAD3
  gene_term:
    preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  association: Candidate
  features: >-
    A single fetus with severe agnathia-otocephaly plus
    cheilognathopalatoschisis, laryngeal hypoplasia, and fused lung lobes
    carried a de novo SMAD3 missense variant with reduced mRNA expression.
    SMAD3 is otherwise the Loeys-Dietz syndrome type 3 gene, whose
    craniofacial spectrum already includes mandibular hypoplasia and
    micro/retrognathia, so agnathia-otocephaly may represent the severe
    extreme of that spectrum. This is limited, unreplicated case-level
    evidence and should not be weighted as equivalent to OTX2 or PRRX1.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing detected a de novo SMAD3 missense variant in exon 6
      (c.860G>A) associated with decreased mRNA expression.
    explanation: >-
      Single-case exome evidence for SMAD3 involvement; supports a candidate
      rather than established gene-disease relationship pending replication.
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agnathia-otocephaly with or without associated anomalies may represent
      the severe end of a phenotypic spectrum related to variants in genes
      in the interacting SMAD/TGFB/BMP/SHH/FGF developmental pathways.
    explanation: >-
      Frames the mechanistic hypothesis linking SMAD/TGF-beta signalling to
      the first-arch phenotype.
- name: Molecularly unexplained cases
  features: >-
    In a combined cohort-plus-literature analysis of 32 patients who
    underwent genetic testing, only 11 (34%) carried a mutation or deletion
    in OTX2 or PRRX1. Screening of CNBP — nominated by a mouse model with
    mimicking mandibular and eye defects — was negative in 10 patients. The
    majority of agnathia-otocephaly therefore remains genetically
    unexplained, and additional loci, oligogenic combinations, or
    teratogenic causes are presumed.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, when compiling results from our cohort and the literature, a
      total of 32 patients benefited from genetic testing, with only 34%
      (11/32) of patients having a mutation in one of the two known genes,
      OTX2 or PRRX1.
    explanation: >-
      Quantifies the diagnostic yield of the two established genes and
      thereby the size of the unexplained fraction.
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although involved in first branchial arch defects, no mutation in the
      CNBP gene was found in this study.
    explanation: >-
      Negative result refuting CNBP — a strong mouse-model candidate — as a
      common cause of human agnathia-otocephaly.
  - reference: PMID:22198066
    reference_title: "Agnathia-otocephaly complex: a case report and examination of the OTX2 and PRRX1 genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis was performed after sequencing the entire coding
      regions of OTX2 and PRRX1 genes isolated from the proband and his
      parents. After thorough analysis, no DNA variations were detected.
      This suggests that mutations in different genes or environmental
      causes are responsible.
    explanation: >-
      A representative mutation-negative sporadic case, illustrating the
      unexplained majority.
environmental:
- name: Teratogenic exposures
  description: >-
    Teratogenic causes are recognized alongside genetic ones: a toxic cause
    was identified in 4 of 70 published cases in a systematic literature
    review. No individual exposure has a replicated, disease-specific effect
    estimate, so exposure history should be taken but individual causal
    attribution is not warranted on current evidence.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4 of the 70 cases described in the literature, a toxic cause was
      identified
    explanation: >-
      Quantifies the documented teratogenic fraction in the published
      literature.
  - reference: PMID:22198066
    reference_title: "Agnathia-otocephaly complex: a case report and examination of the OTX2 and PRRX1 genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etiologies have been linked to both genetic and teratogenic factors
      and to date, a definitive, commonly identifiable cause has not been
      recognized.
    explanation: >-
      Confirms teratogenic factors as a recognized etiologic category while
      noting no single agent is established.
diagnosis:
- name: Prenatal ultrasonography
  description: >-
    Targeted fetal ultrasound with midsagittal facial views is the primary
    diagnostic modality. Suspicious findings are an absent mandibular
    profile, microstomia, low ventromedial ears, abnormal tongue, and
    polyhydramnios. Diagnosis is achievable as early as the first trimester,
    which is decisive for counselling and delivery planning.
    Three-dimensional ultrasound, fetal MRI, and CT further define facial
    and airway anatomy.
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: MAXO:0000520
      label: fetal ultrasonography
  evidence:
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report highlights the important role of ultrasound in the
      identification of agnathia-otocephaly complex in the first trimester
      of pregnancy.
    explanation: >-
      Establishes first-trimester ultrasound as an effective diagnostic
      modality for the complex.
  - reference: PMID:20849990
    reference_title: "Current perspectives on the etiology of agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, two- and three-dimensional ultrasonography, computed
      tomography and magnetic resonance imaging technologies now offer
      significant improvements in refining the resolution of distinctive
      facial anomalies.
    explanation: >-
      Documents the multimodal imaging approach and its improvement of
      prenatal detection.
differential_diagnoses:
- name: Pierre Robin sequence and severe isolated micrognathia
  description: >-
    Shares mandibular hypoplasia and airway obstruction but the mandible is
    present and the ears are normally positioned rather than ventromedially
    displaced or fused.
  distinguishing_features:
  - Mandible present and hypoplastic rather than absent
  - No melotia or synotia
  - Tongue present
  - Glossoptosis with U-shaped cleft palate is the characteristic triad
- name: Treacher Collins syndrome and other mandibulofacial dysostoses
  description: >-
    Bilateral mandibular and zygomatic hypoplasia from a cranial neural
    crest deficiency, overlapping mechanistically with agnathia-otocephaly
    but distinct anatomically.
  distinguishing_features:
  - Symmetric malar and mandibular hypoplasia rather than complete agnathia
  - Downslanting palpebral fissures and lower-eyelid colobomas
  - Ears dysplastic but not ventromedially displaced or fused
  - TCOF1/POLR1 ribosomopathy mechanism
  evidence:
  - reference: PMID:40723430
    reference_title: "Facial Bone Defects Associated with Lateral Facial Clefts Tessier Type 6, 7 and 8 in Syndromic Neurocristopathies: A Detailed Micro-CT Analysis on Historical Museum Specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TCS specimen mainly showed an absence of the zygomatic bones and
      most of the lateral maxilla.
    explanation: >-
      Micro-CT of a Treacher Collins specimen localizes the bone defect to the
      zygoma and lateral maxilla, anatomically distinct from the mandibular
      agenesis that defines agnathia-otocephaly.
- name: Tetra-amelia syndrome
  description: >-
    Biallelic WNT3 or RSPO2 loss can produce near-isolated agnathia
    alongside limb absence; such cases are a distinct entity and should not
    be merged with classic agnathia-otocephaly complex.
  distinguishing_features:
  - Absence of all four limbs
  - Pulmonary hypoplasia accompanying the craniofacial defect
  - Autosomal recessive, often with consanguinity
  - Distinct causal genes (WNT3, RSPO2)
  evidence:
  - reference: PMID:40723430
    reference_title: "Facial Bone Defects Associated with Lateral Facial Clefts Tessier Type 6, 7 and 8 in Syndromic Neurocristopathies: A Detailed Micro-CT Analysis on Historical Museum Specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TETAMS specimen showed almost isolated agnathia.
    explanation: >-
      Micro-CT analysis of a tetra-amelia syndrome specimen documenting
      near-isolated agnathia, establishing tetra-amelia as an anatomic mimic
      that must be differentiated from classic agnathia-otocephaly.
- name: Holoprosencephaly spectrum disorders
  description: >-
    Severe midline forebrain and facial malformations (cyclopia, proboscis,
    premaxillary agenesis) overlap the agnathia-otocephaly facial spectrum
    and frequently co-occur with it.
  distinguishing_features:
  - Facial deficiency centred on the frontonasal and premaxillary field
  - Mandible formed, rather than a first-arch mandibular field defect
  - SHH, ZIC2, SIX3, and TGIF1 genetics
treatments:
- name: Ex-Utero Intrapartum Treatment (EXIT) with Tracheostomy
  description: >-
    For prenatally diagnosed cases in which live birth is planned, delivery
    with the EXIT procedure preserves uteroplacental gas exchange while an
    airway is secured, since conventional intubation is impossible with
    absent mandibular support and microstomia. Tracheostomy is the usual
    airway route. EXIT is not indicated for all cases — selection depends on
    whether the variant is the potentially survivable isolated
    (non-holoprosencephalic) form and on lung maturity; in a reported case
    tracheostomy was successfully completed but the neonate still died at 12
    hours from pulmonary hypoplasia. The indication for this invasive
    procedure must therefore be considered case by case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: airway management
    term:
      id: MAXO:0000500
      label: airway management
  evidence:
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tracheostomy was attempted for 16 min during EXIT and was completed 4
      min after delivery.
    explanation: >-
      Documents technical feasibility of securing an airway by tracheostomy
      under EXIT in a prenatally diagnosed agnathia-otocephaly fetus.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case was estimated as the milder variant, and the EXIT procedure
      was indicated; however, the neonate died of the hypoplastic lung. The
      evaluation methods of lung maturation are inconsistent, and the
      indication of the invasive EXIT procedure must be carefully
      considered.
    explanation: >-
      Tempers the intervention — a technically successful EXIT did not
      prevent death, and case selection for this invasive procedure remains
      unresolved.
  - reference: PMID:20849990
    reference_title: "Current perspectives on the etiology of agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients have poor prognoses and may succumb to death shortly
      after birth due to respiratory problems if appropriate airway
      management is not implemented
    explanation: >-
      Establishes airway management as the intervention that determines
      immediate perinatal survival.
- name: Genetic counselling and family testing
  description: >-
    Counselling requires variant- and family-specific interpretation rather
    than a syndrome-level recurrence figure, because the same disorder has
    been attributed to de novo dominant variants, inherited variants with
    incomplete penetrance, biallelic variants, and parental germline
    mosaicism. Parental testing is essential; exome sequencing has been used
    both to confirm the diagnosis and to inform subsequent reproductive
    decisions.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  evidence:
  - reference: PMID:25589041
    reference_title: "Agnathia-otocephaly complex and asymmetric velopharyngeal insufficiency due to an in-frame duplication in OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the utility of exome sequencing as a tool to confirm the diagnosis of
      agnathia-otocephaly and to inform the reproductive decisions of
      affected families is highlighted
    explanation: >-
      Directly supports molecular diagnosis as an input to reproductive
      counselling in affected families.
  - reference: PMID:23444262
    reference_title: "Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results of SNP genotyping coupled with recurrence of this novel
      mutation in this family are consistent with a paternally derived
      germline mosaicism rather than autosomal recessive inheritance as
      predicted by the family history.
    explanation: >-
      Shows that the correct recurrence-risk model can only be determined by
      molecular investigation, not from the pedigree pattern alone.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Otx2 heterozygous null
  category: Knockout
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  associated_phenotypes:
  - Otocephaly with reduction or loss of the mandible
  - Failure to form structures anterior to rhombomere 3 in homozygotes
  - Strain-dependent penetrance of the mandibular phenotype
  description: >-
    Otx2 heterozygous null mice develop craniofacial malformations
    explicitly designated otocephaly, with reduction or loss of the
    mandible; homozygous nulls fail to develop any structure anterior to
    rhombomere 3. The model reproduces the human disorder's core biology —
    dosage sensitivity of a rostral-head patterning gene — and additionally
    demonstrates strain-dependent modifier control, with two modifier loci
    (Otmf2, Otmf18) mapped. Limitations: species differences in craniofacial
    morphogenesis, and the model captures the OTX2 arm only, not the
    genetically unexplained majority of human cases.
  evidence:
  - reference: PMID:7590242
    reference_title: "Mouse Otx2 functions in the formation and patterning of rostral head."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The homozygous mutants did not develop structures anterior to
      rhombomere 3, indicating an essential role of Otx2 in the formation of
      the rostral head.
    explanation: >-
      Establishes the mouse Otx2 requirement for rostral head formation, the
      developmental context in which heterozygous otocephaly arises.
  - reference: PMID:12183386
    reference_title: "Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice heterozygous for the Otx2 mutation display a craniofacial
      malformation, known as otocephaly or agnathia-holoprosencephaly
      complex.
    explanation: >-
      Explicitly identifies the mouse heterozygous phenotype as the
      counterpart of the human agnathia-holoprosencephaly complex.
- species: Mouse (Mus musculus)
  genotype: Prx1/Prx2 (Prrx1/Prrx2) compound null
  category: Knockout
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  associated_phenotypes:
  - Reduced and sometimes cleft mandible
  - External, middle, and inner ear defects
  - Ectopic medial Fgf8 and Pax9 expression in the mandibular arch
  description: >-
    Mice lacking both Prx1 and Prx2 (orthologues of human PRRX1 and PRRX2)
    develop a reduced and sometimes cleft mandible together with external,
    middle, and inner ear defects, with ectopic medial Fgf8 and Pax9
    expression in the mandibular arch. This couples the two defining
    anatomical territories of otocephaly — jaw and ear — to a single
    paired-class homeobox deficiency, and implicates disrupted
    epithelio-mesenchymal signalling in the mandibular arch as the
    mechanism. Limitation: the compound Prx1/Prx2 null does not model the
    human single-gene PRRX1 lesion dose-for-dose.
  evidence:
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A single, or no incisor was present in the lower jaw, and ectopic
      expression of Fgf8 and Pax9 was found medially in the mandibular arch.
    explanation: >-
      Identifies the molecular readout (ectopic Fgf8/Pax9 in the mandibular
      arch) underlying the mandibular defect in Prx-deficient mice.
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results suggest a role for Prx genes in mediating
      epitheliomesenchymal interactions in inner ear and lower jaw.
    explanation: >-
      Assigns Prx (PRRX) genes a shared mechanistic role across the two
      structures — ear and lower jaw — that are jointly malformed in
      otocephaly.
- species: Zebrafish (Danio rerio)
  genotype: otx2 trans-suppression, alone and with pgap1, prrx1, msx1
  category: Knockdown
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  associated_phenotypes:
  - Aspects of the otocephaly phenotype
  - Exacerbated mandibular and midline defects on combinatorial suppression
  description: >-
    Trans-suppression of otx2 in zebrafish, alone and combined with
    suppression of pgap1, prrx1, and msx1, recapitulates aspects of the
    otocephaly phenotype and exacerbates mandibular and midline defects.
    The model provides the functional demonstration of the oligogenic
    second-hit architecture inferred from human pedigrees. Limitation: gene
    knockdown in a teleost is a distant model of the human first-arch
    lesion and cannot establish the specific human modifier alleles.
  evidence:
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with this notion, trans suppression of otx2 and other
      developmentally related genes recapitulate aspects of the otocephaly
      phenotype in zebrafish.
    explanation: >-
      Demonstrates in vivo recapitulation of the otocephaly phenotype by
      combinatorial gene suppression, supporting the second-hit model.
discussions:
- discussion_id: gap_aoc_unexplained_molecular_majority
  kind: KNOWLEDGE_GAP
  prompt: >-
    What explains the roughly two-thirds of agnathia-otocephaly cases that
    remain molecularly unexplained after OTX2 and PRRX1 testing?
  rationale: >-
    Only 11 of 32 systematically tested patients carried an OTX2 or PRRX1
    lesion, and the strongest mouse-derived candidate (CNBP) was excluded by
    direct sequencing. The unexplained fraction could reflect additional
    single genes, oligogenic combinations analogous to the zebrafish
    otx2/prrx1/msx1/pgap1 interactions, non-coding or structural variation
    invisible to Sanger sequencing and array-CGH, mosaicism, or teratogenic
    causes. Resolving this is the principal barrier to recurrence-risk
    counselling for most families.
  attaches_to:
  - pathophysiology#Modifier-Dependent Variable Expressivity
  - genetic#Molecularly unexplained cases
  proposed_experiments:
  - experiment_id: exp_aoc_trio_genome_sequencing
    name: Trio genome sequencing of Sanger- and array-negative probands
    description: >-
      Perform trio genome sequencing (rather than exome) on a multicentre
      cohort of Sanger- and array-negative agnathia-otocephaly probands, and
      analyse for non-coding regulatory variants at the OTX2 and PRRX1 loci,
      structural variants, and mosaicism.
  - experiment_id: exp_aoc_oligogenic_burden
    name: Oligogenic burden analysis of zebrafish-implicated interactors
    description: >-
      Test systematically whether rare variants in the zebrafish-implicated
      interactors (PRRX1, MSX1, PGAP1) co-occur with hypomorphic OTX2
      alleles more often than expected in probands versus unaffected
      carriers.
  evidence:
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, agnathia-otocephaly complex remains unexplained in the majority of
      the patients, which indicates that other factors might be involved.
    explanation: >-
      The systematic cohort-plus-literature review states the gap explicitly:
      most patients have no molecular explanation and additional factors must
      be operating.
- discussion_id: mismatch_aoc_cnbp_mouse_versus_human
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do CNBP mutations cause agnathia-otocephaly in humans, given that
    heterozygous Cnbp mutations in mice produce mandibular and eye defects
    that mimic the human complex?
  rationale: >-
    Cnbp heterozygous mice reproduce the human phenotype closely enough to
    make CNBP a leading candidate gene, yet direct Sanger sequencing of CNBP
    in 10 human agnathia-otocephaly patients found no mutation. Either the
    mouse phenotype does not translate to a human disease mechanism, or a
    compensatory mechanism exists in humans that is absent in mice. This is
    a mismatch between an informative model result and the human data, not
    an absence of evidence — and it matters because it determines whether
    CNBP belongs on diagnostic gene panels.
  attaches_to:
  - genetic#Molecularly unexplained cases
  proposed_experiments:
  - experiment_id: exp_aoc_cnbp_expanded_screen
    name: Expanded CNBP screen beyond coding Sanger sequencing
    description: >-
      Screen CNBP — including copy-number and regulatory regions, not only
      the coding sequence by Sanger — in a substantially larger
      international agnathia-otocephaly cohort before excluding it.
  - experiment_id: exp_aoc_cnbp_cross_species_redundancy
    name: Cross-species CNBP redundancy comparison in cranial neural crest
    description: >-
      Compare CNBP paralogue expression and functional redundancy in human
      versus mouse cranial neural crest to test the proposed human-specific
      compensation hypothesis directly.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that mutations in CNBP might not be involved in such
      phenotype in humans or that, unlike in mice, a compensatory effect
      might exist in humans.
    explanation: >-
      The authors themselves frame the negative human CNBP result as a
      possible human-versus-mouse compensation mismatch, which is the exact
      open question recorded here.

    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing detected a de novo SMAD3 missense variant in exon 6 (c.860G>A) associated with decreased mRNA expression.
    explanation: Reports the single-case de novo SMAD3 variant; evidence marked PARTIAL because the association rests on one patient and a proposed pathway mechanism.
- name: CRKL
  gene_term:
    preferred_term: CRKL
    term:
      id: hgnc:2363
      label: CRKL
  relationship_type: UNKNOWN
  notes: >-
    CRKL is a pathway-level candidate, not an established human disease gene for
    this complex. The mouse "snoopy" Crkl splice-site mutant reproduces
    micrognathia, pharyngeal occlusion, aglossia, and holoprosencephaly with
    altered retinoic acid and endothelin signalling. CRKL lies in the common
    22q11.2 deletion interval, so the finding also links first-arch dysgnathia
    to the 22q11.2 craniofacial phenotype. No human CRKL point lesion has been
    reported in agnathia-otocephaly.
  evidence:
  - reference: PMID:25565927
    reference_title: A mouse splice-site mutant and individuals with atypical chromosome 22q11.2 deletions demonstrate the crucial role for crkl in craniofacial and pharyngeal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The snoopy strain exhibits a variable phenotype that includes micrognathia, pharyngeal occlusion, aglossia and holoprosencephaly, and altered retinoic acid and endothelin signalling.
    explanation: >-
      The Crkl mutant mouse phenocopies the core first-arch and midline features
      of agnathia-otocephaly.
  - reference: PMID:25565927
    reference_title: A mouse splice-site mutant and individuals with atypical chromosome 22q11.2 deletions demonstrate the crucial role for crkl in craniofacial and pharyngeal development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Together, these features are reminiscent of malformations occurring in auriculocondylar syndrome and agnathia-otocephaly complex, 2 conditions not previously associated with the CRKL function.
    explanation: >-
      The authors themselves frame the link to agnathia-otocephaly as a new and
      unproven association, so this is PARTIAL rather than causal support.
- name: PGAP1
  gene_term:
    preferred_term: PGAP1
    term:
      id: hgnc:25712
      label: PGAP1
  relationship_type: UNKNOWN
  notes: >-
    PGAP1 (GPI inositol-deacylase) is a model-organism candidate, not an
    established human disease gene for this complex. Most Pgap1 knockout mice
    show otocephaly and die shortly after birth, and zebrafish trans-suppression
    places pgap1 in a genetic interaction with otx2 that worsens mandibular and
    midline defects. No human PGAP1 lesion has been reported in
    agnathia-otocephaly.
  evidence:
  - reference: PMID:17711852
    reference_title: PGAP1 knock-out mice show otocephaly and male infertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Most PGAP1 knock-out mice showed otocephaly, a developmental defect, and died right after birth.
    explanation: >-
      Establishes the mouse basis for PGAP1 candidacy: constitutive knockout
      recapitulates otocephaly with perinatal lethality.
  - reference: PMID:22577225
    reference_title: OTX2 mutations contribute to the otocephaly-dysgnathia complex.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: It was found that otx2 can interact genetically with pgap1, prrx1, and msx1 to exacerbate mandibular and midline defects during zebrafish development.
    explanation: >-
      Zebrafish data place pgap1 in a genetic interaction with otx2; PARTIAL
      because this is a model-organism interaction with no human counterpart
      yet.
- name: CNBP
  gene_term:
    preferred_term: CNBP
    term:
      id: hgnc:13164
      label: CNBP
  relationship_type: DISPUTED
  notes: >-
    CNBP was a strong candidate because heterozygous Cnbp mutations in mice
    produce mandibular and eye defects mimicking the human complex. Targeted
    screening of a 10-patient human cohort found no CNBP lesions, so a human
    role remains unsupported. See the
    `agotc_cnbp_human_model_mismatch` discussion for the unresolved
    translational question.
  evidence:
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mutations in Cnbp in mice are responsible for mandibular and eye defects mimicking the agnathia-otocephaly complex in humans and appear as a good candidate.
    explanation: Establishes the mouse basis for the CNBP candidacy.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Although involved in first branchial arch defects, no mutation in the CNBP gene was found in this study.
    explanation: >-
      Negative screening argues against CNBP as a common cause in this
      10-patient cohort but does not exclude a rare human association.
treatments:
- name: Genetic counseling
  description: >-
    Genetic counseling and, where indicated, molecular testing (OTX2, PRRX1,
    array-CGH/exome) support recurrence-risk assessment and reproductive
    decision-making for affected families, particularly given the autosomal
    recessive PRRX1 form and the variable-penetrance OTX2 form.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Results of SNP genotyping coupled with recurrence of this novel mutation in this family are consistent with a paternally derived germline mosaicism rather than autosomal recessive inheritance as predicted by the family history.
    explanation: >-
      Germline mosaicism can produce sibling recurrence despite apparently
      negative parental testing, which materially changes recurrence-risk
      counselling and must be addressed.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1.
    explanation: >-
      Quantifies the low diagnostic yield of current molecular testing that must
      be communicated during counselling.
- name: Perinatal palliative and supportive care
  description: >-
    Because the malformation is most often lethal owing to severe airway and
    multisystem anomalies, management may be palliative/supportive after
    prenatal diagnosis. An EXIT (ex utero intrapartum treatment)-to-airway
    strategy has been considered only in exceptional, anatomically feasible
    cases, supported by individual reports rather than response-rate studies.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This severe anomaly of the first branchial arch is most often lethal.
    explanation: Supports a palliative/supportive rather than curative management posture given the usually lethal course.
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: opted for termination of pregnancy
    explanation: >-
      Reflects the pregnancy-management pathway most families in a
      first-trimester diagnostic series chose, which is part of the
      palliative/supportive counselling arm.
- name: Airway management (including EXIT-to-airway)
  description: >-
    In the exceptional, anatomically feasible case where active neonatal
    intervention is chosen, a secured airway is the pivotal intervention: an
    EXIT (ex utero intrapartum treatment)-to-airway procedure or immediate
    surgical airway (tracheostomy) at delivery, planned by a multidisciplinary
    difficult-airway team. Evidence is limited to individual case reports rather
    than response-rate studies. EXIT delivers the fetus on placental support so
    that a surgical airway can be established before the umbilical circulation
    is interrupted; the indication must be weighed carefully, because EXIT is
    invasive and coexisting pulmonary hypoplasia can still be fatal after a
    technically successful tracheostomy.
  treatment_term:
    preferred_term: airway management (EXIT-to-airway)
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  notes: >-
    Reported experience is limited to individual EXIT/surgical-airway case
    reports without a citable quantitative response rate, so no outcome
    statistic is asserted; the attached evidence establishes the indication and
    its documented limits rather than efficacy. This entry is the umbrella
    delivery-planning strategy; the mechanism link to the airway-obstruction
    node is carried by the specific `Perinatal tracheostomy` treatment rather
    than duplicated here.
  evidence:
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ex-utero intrapartum treatment (EXIT) procedure is basically indicated for a fetus with a high risk of airway obstruction immediately after birth; it is not indicated for all AOC cases but is chosen to treat cases until the airway can be evaluated to achieve a better prognosis."
    explanation: States the indication for EXIT and its limits in this specific complex.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The evaluation methods of lung maturation are inconsistent, and the indication of the invasive EXIT procedure must be carefully considered.
    explanation: >-
      Documents the caveat that EXIT may not change outcome when pulmonary
      hypoplasia is present; PARTIAL because it qualifies rather than supports
      the intervention.
- name: Perinatal tracheostomy
  description: >-
    All four long-term survivors in one single-institution series received a
    perinatal surgical airway because severe mandibular and lingual anatomy can
    make conventional airway access impossible.
  treatment_term:
    preferred_term: tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Airway Obstruction and Perinatal Respiratory Failure
    treatment_effect: BYPASSES
    description: >-
      A tracheostomy bypasses the non-functional upper airway rather than
      correcting the underlying arch defect.
    evidence:
    - reference: PMID:26517463
      reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All four underwent perinatal tracheostomy and gastrostomy-tube placement.
      explanation: >-
        All four patients in this survivor series received a surgical airway;
        tracheostomy bypasses the airway-obstruction node.
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All four underwent perinatal tracheostomy and gastrostomy-tube placement.
    explanation: >-
      All patients in a 30-year single-institution series required a perinatal
      tracheostomy.
- name: Gastrostomy tube feeding
  description: >-
    All four long-term survivors in one series received gastrostomy-tube
    feeding; severe aglossia and absent oral musculature can leave deglutition
    impossible even after extensive mandibular reconstruction.
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Dysphagia
    treatment_effect: BYPASSES
    description: >-
      A gastrostomy delivers nutrition distal to the non-functional oropharynx
      rather than restoring swallowing, the enteral counterpart of the
      tracheostomy that bypasses the non-functional upper airway.
    evidence:
    - reference: PMID:26517463
      reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Although the lower-facial contour may be improved, and a stoma created, the lack of musculature make deglutition virtually impossible with current therapies.
      explanation: >-
        States that swallowing remains impossible with current therapies, so
        enteral access substitutes for rather than corrects deglutition.
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All four underwent perinatal tracheostomy and gastrostomy-tube placement.
    explanation: Documents gastrostomy placement in all four survivors in this series.
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the lower-facial contour may be improved, and a stoma created, the lack of musculature make deglutition virtually impossible with current therapies.
    explanation: Explains persistent dependence on enteral access in severe survivors.
- name: Staged mandibular reconstruction with bone grafting
  description: >-
    Autologous reconstruction of the absent mandible, staged by age: costal
    (rib) grafting between roughly ages 3 and 8, and free vascularized fibula
    transfer thereafter, increasingly with virtual surgical planning. In one
    four-patient longitudinal series, graft resorption or extrusion led to
    repeated grafting in every patient.
  treatment_term:
    preferred_term: mandibular reconstruction with autologous bone graft
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mandibular reconstruction was most successful with rib between ages 3 and 8, after which time, free fibula transfer was utilized.
    explanation: Establishes the age-staged autologous reconstruction strategy.
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Due to some resoprtion or extrusion, all patients underwent repeated bone grafting procedures.
    explanation: >-
      Documents the principal limitation of the approach; the source typo
      ("resoprtion") is preserved for exact quotation.
  - reference: PMID:36217223
    reference_title: Free Fibula Flap for the Treatment of Agnathia in a 10-Year-Old With Severe Agnathia-Otocephaly Complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To the authors' knowledge, this represents the first application of virtual surgical planning for mandibular reconstruction with a vascularized free fibula flap in a pediatric patient with severe agnathia-otocephaly complex.
    explanation: >-
      Documents virtual surgical planning with a vascularized free fibula flap
      as the contemporary refinement of staged reconstruction.
- name: Mandibular distraction osteogenesis
  description: >-
    Gradual lengthening of a hypoplastic mandible with an external distraction
    device, in staged protocols that may be preceded by submental tissue
    expansion to enlarge the soft-tissue envelope and mitigate skeletal relapse.
  treatment_term:
    preferred_term: mandibular distraction osteogenesis
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:31634311
    reference_title: "Surgical Approach in a Patient With Agnathia-Otocephaly Complex: Three-Stage Mandibular Distraction Protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 3-step mandibular distraction protocol the authors present in this study increased the length of the mandible by 20 mm, and nearly doubled the size of the patient's mandible from an initial volume of 3.62 cm to a post-operative volume of 6.89 cm.
    explanation: Quantifies the skeletal gain achieved by staged distraction.
- name: Oral commissuroplasty
  description: >-
    Surgical widening of the microstomic oral aperture, typically performed
    before age three and repeated as needed to permit oral hygiene.
  treatment_term:
    preferred_term: oral commissuroplasty
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Commissuroplasties were typically performed before 3 years of age and repeated as necessary to allow for oral hygiene.
    explanation: Documents the timing and indication for commissuroplasty.
diagnosis:
- name: Prenatal ultrasound and fetal MRI
  description: >-
    Most cases are detected prenatally or at birth by the characteristic
    craniofacial anatomy: an absent/severely hypoplastic mandible, abnormally
    low/medially displaced ears, microstomia, and often polyhydramnios from
    impaired fetal swallowing. 3D ultrasound and fetal MRI further clarify the
    airway, tongue, palate, ear position, and CNS anatomy.
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Agnathia-otocephaly complex is a rare condition characterized by mandibular hypoplasia or agnathia, ear anomalies (melotia/synotia) and microstomia with aglossia.
    explanation: The characteristic craniofacial anatomy (agnathia, ear anomalies, microstomia) is the basis of prenatal/postnatal recognition.
  - reference: PMID:30756395
    reference_title: "The location of the fetal ears: A hint for prenatal diagnosis of agnathia-otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The key to early diagnosis is careful assessment of the location of the fetal ears on 2D ultrasound examination.
    explanation: >-
      Identifies the specific sonographic manoeuvre — assessment of fetal ear
      location — that makes early detection possible.
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This report highlights the important role of ultrasound in the identification of agnathia-otocephaly complex in the first trimester of pregnancy.
    explanation: Supports first-trimester sonographic detectability.
  - reference: PMID:42256929
    reference_title: First Case Report of Agnathia-Otocephaly Complex Reported in Niger.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antenatal ultrasound is essential for early diagnosis, allowing appropriate counseling and management decisions in severe cases of AOC.
    explanation: >-
      The most recent disease-specific case report emphasizes prenatal
      ultrasound as the basis for early diagnosis and counseling.
  - reference: PMID:39697072
    reference_title: "Otocephaly Diagnosed Prenatally: A Case Study of a Rare Congenital Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the combination of two-dimensional and three-dimensional ultrasound was able to confirm the prenatal diagnosis of AOC.
    explanation: Documents confirmation of prenatal AOC using combined 2D and 3D ultrasound.
  - reference: PMID:20849990
    reference_title: Current perspectives on the etiology of agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: two- and three-dimensional ultrasonography, computed tomography and magnetic resonance imaging technologies now offer significant improvements in refining the resolution of distinctive facial anomalies.
    explanation: >-
      Supports the added value of 3D ultrasound, CT and MRI over 2D imaging for
      characterising the facial malformation.
  - reference: PMID:20849990
    reference_title: Current perspectives on the etiology of agnathia-otocephaly.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Difficulties persist in the prenatal diagnosis of agnathia-otocephalic patients.
    explanation: >-
      Qualifies the diagnostic picture: even with advanced imaging, prenatal
      recognition remains difficult.
- name: Molecular diagnosis (chromosomal microarray and sequencing)
  description: >-
    Molecular confirmation uses chromosomal microarray (array-CGH) plus targeted
    OTX2/PRRX1 sequencing or family-based exome sequencing. Notably, in the 2021
    10-patient cohort the only molecular diagnosis came from array-CGH (a 107-kb
    OTX2 deletion), not Sanger sequencing — underscoring the value of copy-number
    analysis.
  diagnosis_term:
    preferred_term: prenatal genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: array-CGH has allowed identifying a 107-kb deletion encompassing OTX2 responsible for the agnathia-otocephaly complex phenotype in 1 of them
    explanation: Documents that array-CGH (copy-number analysis) yielded the only molecular diagnosis in the cohort, supporting CMA as a key diagnostic arm.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In our 10 patients' cohort, no point mutation in the three tested genes was detected by Sanger sequencing, while array-CGH has allowed identifying a 107-kb deletion encompassing OTX2
    explanation: >-
      Demonstrates directly that copy-number analysis is required in addition to
      sequencing, since Sanger alone was uninformative in the whole cohort.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a total of 32 patients benefited from genetic testing, with only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1.
    explanation: Quantifies the diagnostic yield of current molecular testing.
  - reference: PMID:32100971
    reference_title: Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Family-based exome sequencing (ES) on a fetus with severe agnathia-otocephaly, cheilognathopalatoschisis, laryngeal hypoplasia, fused lung lobes and other organ abnormalities and mRNA expression analysis were performed.
    explanation: Documents family-based exome sequencing in a molecularly investigated AOC fetus.
differential_diagnoses:
- name: Treacher Collins syndrome
  description: Mandibulofacial dysostosis with malar/mandibular hypoplasia and ear anomalies.
  distinguishing_features:
  - Malar/mandibular hypoplasia without the complete agnathia of the complex
  - No ventromedial synotia
  - Symmetric hypoplasia of zygomatic bones, maxilla and mandible rather than mandibular aplasia
  - Lower eyelid abnormalities and downslanted palpebral fissures, absent in agnathia-otocephaly
  - Compatible with survival; conductive hearing loss is the dominant morbidity
  disease_term:
    preferred_term: Treacher Collins syndrome
    term:
      id: MONDO:0002457
      label: Treacher-Collins syndrome
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treacher Collins syndrome (TCS) is characterized by lower eyelid abnormalities, malar hypoplasia, downslanted palpebral fissures, and micro- or retrognathia due to symmetric hypoplasia of the zygomatic bones, maxilla, and mandible.
    explanation: >-
      The GeneReviews definition supplies the discriminating features: symmetric
      hypoplasia with orbital involvement rather than mandibular absence.
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: External ear anomalies include absent, small, malformed, and/or posteriorly rotated ears and atresia or stenosis of the external auditory canals.
    explanation: >-
      The auricular phenotype is dysplastic rather than ventromedially displaced
      or fused, which is the key sign separating it from otocephaly.
  - reference: PMID:40723430
    reference_title: "Facial Bone Defects Associated with Lateral Facial Clefts Tessier Type 6, 7 and 8 in Syndromic Neurocristopathies: A Detailed Micro-CT Analysis on Historical Museum Specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The TCS specimen mainly showed an absence of the zygomatic bones and most of the lateral maxilla.
    explanation: >-
      Micro-CT of a Treacher Collins specimen localises the bone deficit to the
      zygoma and lateral maxilla, anatomically distinct from the mandibular
      aplasia that defines this complex.
- name: Nager acrofacial dysostosis
  description: Acrofacial dysostosis combining mandibulofacial dysostosis with preaxial limb anomalies.
  distinguishing_features:
  - Preaxial (radial) limb involvement, absent in agnathia-otocephaly
  - No true agnathia or synotia
  disease_term:
    preferred_term: Nager acrofacial dysostosis
    term:
      id: MONDO:0007943
      label: Nager acrofacial dysostosis
- name: Auriculocondylar syndrome
  description: First- and second-arch patterning disorder (EDN1-EDNRA-DLX axis).
  distinguishing_features:
  - Mandibular condyle hypoplasia rather than complete agnathia (milder)
  - '"Question-mark" ear rather than ventromedial synotia'
  disease_term:
    preferred_term: auriculocondylar syndrome
    term:
      id: MONDO:0000107
      label: auriculocondylar syndrome
  evidence:
  - reference: PMID:28328130
    reference_title: Targeted molecular investigation in patients within the clinical spectrum of Auriculocondylar syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Auriculocondylar syndrome, mainly characterized by micrognathia, small mandibular condyle, and question mark ears, is a rare disease segregating in an autosomal dominant pattern in the majority of the families reported in the literature.
    explanation: >-
      Gives the discriminating triad; the ear anomaly is a question-mark ear,
      not the ventromedial displacement or fusion of otocephaly.
  - reference: PMID:28328130
    reference_title: Targeted molecular investigation in patients within the clinical spectrum of Auriculocondylar syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is caused by a developmental abnormality of the first and second pharyngeal arches
    explanation: >-
      Confirms the shared arch-patterning field, which is why this is the
      closest mechanistic differential rather than a coincidental look-alike.
- name: Hypomandibular faciocranial syndrome
  description: >-
    HFS shares the dysgnathia and oro-pharyngo-laryngeal abnormalities of the
    agnathia-otocephaly complex and can also present with situs inversus, which
    argues for pathogenic overlap between the two entities.
  distinguishing_features:
  - Craniosynostosis is present in HFS and absent in agnathia-otocephaly complex
  - Ears are normally positioned in HFS, whereas synotia/melotia characterise the complex
  - Holoprosencephaly can occur in the complex but is not a feature of HFS
  evidence:
  - reference: PMID:40079387
    reference_title: "Situs Inversus in an Infant With Hypomandibular Faciocranial Syndrome: Clinical Overlap With the Agnathia-Otocephaly Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The dysgnathia and oro-pharyngo-laryngeal abnormalities in HFS are virtually identical to those found in the agnathia-otocephaly complex (AOC), of which severe forms can include holoprosencephaly (HPE), synotia-melotia, and situs abnormalities, but not craniosynostosis.
    explanation: >-
      States both the overlap and the discriminating feature (craniosynostosis)
      between the two conditions.
  - reference: PMID:40079387
    reference_title: "Situs Inversus in an Infant With Hypomandibular Faciocranial Syndrome: Clinical Overlap With the Agnathia-Otocephaly Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HFS should be conceptualized as a form of dysgnathia (or AOC) that is distinguishable by a distinctive presence of craniosynostosis and an absence of anomalies in the brain and ears
    explanation: >-
      Proposes HFS as a delimited subset within the dysgnathia spectrum rather
      than an unrelated entity.
  notes: >-
    No MONDO term for hypomandibular faciocranial syndrome surfaced in the
    current ontology build, so no disease_term is bound.
- name: PRRX1-related craniosynostosis
  description: >-
    PRRX1 is also implicated in a much milder, incompletely penetrant
    craniosynostosis phenotype, so a PRRX1 variant on its own does not predict
    the agnathia-otocephaly presentation.
  distinguishing_features:
  - Craniosynostosis with incomplete penetrance rather than mandibular aplasia
  - No agnathia, synotia, or aglossia
  - Compatible with normal survival, unlike the usually lethal complex
  evidence:
  - reference: PMID:37154149
    reference_title: Pathogenic variants in the paired-related homeobox 1 gene (PRRX1) cause craniosynostosis with incomplete penetrance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathogenic variants were inherited from unaffected relatives in many instances, yielding a 12.5% penetrance estimate for craniosynostosis.
    explanation: >-
      Quantifies the low penetrance of the allelic PRRX1 craniosynostosis
      phenotype, which distinguishes it from the lethal, fully expressed
      first-arch aplasia of this complex.
  notes: >-
    Modelled as an allelic differential rather than a MONDO-bound disease
    entity; no dedicated MONDO term for PRRX1-related craniosynostosis was
    available in the current ontology build.
- name: Pierre Robin sequence
  description: Micrognathia with glossoptosis and cleft palate.
  distinguishing_features:
  - Mandible is present and hypoplastic rather than absent
  - Ears are normally positioned
  notes: >-
    No clean base "Pierre Robin sequence" MONDO term surfaced in the current
    ontology build (only compound syndromic terms), so no disease_term is bound.
- name: Tetra-amelia syndrome
  description: >-
    Biallelic WNT3 or RSPO2 loss can produce near-isolated agnathia alongside
    limb absence; such cases are a distinct entity and should not be absorbed
    into classic agnathia-otocephaly complex.
  distinguishing_features:
  - Absence of all four limbs
  - Pulmonary hypoplasia accompanying the craniofacial defect
  - Autosomal recessive, often with consanguinity
  - Distinct causal genes (WNT3, RSPO2) rather than PRRX1/OTX2
  disease_term:
    preferred_term: Tetra-amelia syndrome
    term:
      id: MONDO:0010110
      label: tetraamelia-multiple malformations syndrome
  evidence:
  - reference: PMID:40723430
    reference_title: "Facial Bone Defects Associated with Lateral Facial Clefts Tessier Type 6, 7 and 8 in Syndromic Neurocristopathies: A Detailed Micro-CT Analysis on Historical Museum Specimens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The TETAMS specimen showed almost isolated agnathia.
    explanation: >-
      Micro-CT analysis of a tetra-amelia specimen documents near-isolated
      agnathia, establishing tetra-amelia as an anatomic mimic that must be
      distinguished from the agnathia-otocephaly complex on the basis of the
      limb phenotype and genetics rather than the jaw defect itself.
- name: Holoprosencephaly spectrum disorders
  description: >-
    Severe midline forebrain and facial malformations (cyclopia, proboscis,
    premaxillary agenesis) overlap the agnathia-otocephaly facial spectrum and
    frequently co-occur with it. The discriminator is which developmental field
    is primarily affected: the rostral midline (holoprosencephaly) or the first
    pharyngeal arch (this complex).
  distinguishing_features:
  - Facial deficiency centred on the frontonasal and premaxillary field
  - Mandible formed, rather than a first-arch mandibular field defect
  - SHH, ZIC2, SIX3, and TGIF1 genetics rather than PRRX1/OTX2
  disease_term:
    preferred_term: Holoprosencephaly
    term:
      id: MONDO:0016296
      label: holoprosencephaly
  evidence:
  - reference: PMID:17438667
    reference_title: "Otocephaly: report of five new cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Holoprosencephaly is the most commonly identified association, but skeletal, genitourinary, and cardiovascular anomalies, and situs inversus have been reported.
    explanation: >-
      Holoprosencephaly is the single most frequent association rather than a
      separate diagnosis in most cases, which is precisely why the two are
      differentiated by primary field of involvement rather than treated as
      mutually exclusive.
- name: Cerebro-costo-mandibular syndrome
  description: >-
    Autosomal dominant SNRPB spliceosomopathy combining severe micrognathia
    with posterior rib gaps and a narrow thorax; a first-arch mimic that
    shares severe micrognathia with the complex and with Pierre Robin
    sequence.
  distinguishing_features:
  - Posterior rib gaps with abnormal costo-transverse articulation and a narrow thorax, not seen in agnathia-otocephaly complex
  - Severe micrognathia rather than true mandibular aplasia; no synotia/melotia
  - Autosomal dominant SNRPB spliceosomopathy, contrasting with the sporadic OTX2/PRRX1 mechanism of this complex
  - Compatible with survival to adulthood, unlike the usually lethal complex
  disease_term:
    preferred_term: Cerebro-costo-mandibular syndrome
    term:
      id: MONDO:0007301
      label: cerebrocostomandibular syndrome
  evidence:
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebro-Costo-Mandibular syndrome (CCMS) is a rare autosomal dominant condition comprising branchial arch-derivative malformations with striking rib-gaps.
    explanation: >-
      Establishes the defining rib-gap/thorax phenotype that discriminates this
      first-arch mimic from the mandibular aplasia of agnathia-otocephaly
      complex.
  - reference: PMID:26971886
    reference_title: "Cerebro-costo-mandibular syndrome: Clinical, radiological, and genetic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Severe micrognathia and reduced numbers of ribs with gaps are consistent findings.
    explanation: >-
      Confirms severe micrognathia, not agnathia, is the mandibular phenotype
      in CCMS.
- name: Oromandibular-limb hypogenesis syndrome (aglossia-adactylia / hypoglossia-hypodactyly spectrum)
  description: >-
    A spectrum of oral and limb hypogenesis (Hall types I-IV) combining
    hypoglossia/aglossia with variable-degree distal limb defects. The
    spectrum umbrella term is bound rather than the single Hanhart entity, to
    preserve the "spectrum" framing rather than narrowing to one subtype.
  distinguishing_features:
  - Tongue hypogenesis (hypoglossia/aglossia) is the primary defect, with the mandible hypoplastic rather than absent
  - Variable-degree distal limb hypogenesis (hypodactyly/oligodactyly), not seen in agnathia-otocephaly complex
  - Ears are normally positioned; no synotia/melotia
  - Not to be confused with Richner-Hanhart syndrome (MONDO:0010160, tyrosinemia type II), which shares the "Hanhart" eponym but is an unrelated metabolic disease
  disease_term:
    preferred_term: Oromandibular-limb hypogenesis syndrome
    term:
      id: MONDO:0017139
      label: oromandibular-limb hypogenesis syndrome
  evidence:
  - reference: PMID:23431477
    reference_title: "Oromandibular Limb Hypogenesis Syndrome Type IIB: Case Report of Hypoglossia-Hypodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The characteristic features of the syndrome are hypoglossia, limb anomalies of variable degree, and micrognathia of the mandible.
    explanation: >-
      Gives the discriminating triad (tongue defect, variable limb involvement,
      hypoplastic-not-absent mandible) that separates this spectrum from the
      mandibular aplasia of agnathia-otocephaly complex.
  - reference: PMID:42206110
    reference_title: "Oromandibular Limb Hypogenesis Syndrome Type IVB with Hypoglossia and Intraoral Band: A Case Report of a Rare Entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The group of anomalies that affect the tongue, maxilla, and mandible-with or without limb anomalies-comes under the umbrella of the oromandibular limb hypogenesis syndrome.
    explanation: >-
      Supports binding the spectrum umbrella term rather than a single Hall
      subtype, matching how the entry's other differentials are diagnosed at
      the level that preserves the relevant clinical distinction.
- name: Amniotic-band or teratogenic craniofacial disruption
  description: >-
    A non-genetic disruption mechanism (amniotic band constriction, or an
    identified teratogenic exposure) can produce a craniofacial phenotype
    overlapping agnathia-otocephaly complex. The craniofacial amniotic-band
    literature itself argues the dysmorphology is not explained by disruption
    alone and is most likely multifactorial, so this changes recurrence-risk
    counselling relative to a Mendelian first-arch defect without asserting a
    clean disruption-vs-malformation dichotomy.
  distinguishing_features:
  - Constriction rings, limb-reduction defects, or a documented teratogenic exposure, rather than an isolated PRRX1/OTX2-driven first-arch field defect
  - Sporadic occurrence, consistent with a disruption/teratogenic rather than Mendelian mechanism
  - Craniofacial amniotic band sequence is itself multifactorial rather than pure mechanical disruption, so overlap with this complex is a spectrum rather than a bright line
  disease_term:
    preferred_term: Amniotic band syndrome
    term:
      id: MONDO:0015167
      label: amniotic band syndrome
  evidence:
  - reference: PMID:31407870
    reference_title: "Case series: Amniotic band sequence with craniofacial abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Major craniofacial anomalies in patients with ABS is a rare clinical finding that cannot be completely explained on the basis of premature amniotic layer disruption alone.
    explanation: >-
      States the caveat that craniofacial ABS is not purely mechanical
      disruption, so the differential should not be framed as a clean
      disruption-vs-malformation dichotomy.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 4 of the 70 cases described in the literature, a toxic cause was identified
    explanation: >-
      Quantifies how often a non-genetic (teratogenic) cause is identified
      among reported agnathia-otocephaly complex cases, supporting a
      teratogenic-disruption differential alongside the genetic mechanism.
- name: Isolated severe micrognathia
  description: >-
    Severe micrognathia can occur in isolation, without the additional
    agnathia, synotia/melotia, or holoprosencephaly-spectrum features that
    define this complex. Marks the severity floor below which the complex
    should not be diagnosed.
  distinguishing_features:
  - Mandible present and hypoplastic rather than absent (agnathia)
  - No synotia/melotia or other complex-defining features
  - Operationally separated from the agnathia/otocephaly tier in large cohort classifications
  evidence:
  - reference: PMID:39140255
    reference_title: "Perinatal Airway Management Mandibular Anomalies: A National Inpatient Cohort Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: isolated retrognathia, isolated micrognathia, syndromic micrognathia, micrognathia plus cleft palate/cleft lip and palate, agnathia/micrognathia plus cervical auricle/otocephaly, and agnathia/micrognathia plus microstomia
    explanation: >-
      A national-cohort classification of mandibular anomalies operationally
      separates isolated micrognathia from the agnathia/otocephaly tier, which
      is the severity-floor boundary this differential encodes.
  notes: >-
    No MONDO term for isolated severe micrognathia surfaced in the current
    ontology build, so no disease_term is bound, following the Pierre Robin
    sequence pattern above.
progression:
- phase: Prenatal / perinatal
  age_range: Embryonic onset; presentation at prenatal diagnosis or birth
  notes: >-
    All defining manifestations are congenital, arising during first-trimester
    first-pharyngeal-arch development, and are anatomically fixed thereafter.
    There is no postnatal disease progression; the course culminates in
    termination after prenatal diagnosis, stillbirth, or neonatal death, with
    rare survivors representing milder spectrum disease.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder is almost always lethal.
    explanation: Supports the perinatally lethal natural history of the malformation.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Agnathia-otocephaly complex is almost always perinatally lethal.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder is almost always lethal.
    explanation: Directly supports the HIGH clinical burden (near-universal lethality).
animal_models:
- species: Mouse (Mus musculus)
  genotype: Prx1/Prx2 (Prrx1/Prrx2) compound-null mouse
  category: Knockout
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  associated_phenotypes:
  - Reduced and sometimes cleft mandible
  - External, middle, and inner ear defects
  - Reduction or loss of skull bones
  description: >-
    Prx1/Prx2 double-mutant mice reproduce the mandibular and ear defects of the
    human first-arch malformation, demonstrating the developmental role of the
    paired-related homeobox genes in lower jaw and ear formation.
  evidence:
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found defects in external, middle and inner ear, reduction or loss of skull bones, a reduced and sometimes cleft mandible, and limb abnormalities including postaxial polydactyly and bent zeugopods.
    explanation: Documents the mandibular and ear phenotypes of the Prx1/Prx2 compound-null mouse.
- species: Mouse (Mus musculus)
  genotype: MHox (Prrx1) homozygous loss-of-function
  category: Knockout
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  associated_phenotypes:
  - Loss or malformation of craniofacial skeletal structures
  - Perinatal lethality
  - Defective formation of chondrogenic and osteogenic precursors
  description: >-
    Homozygous MHox (Prrx1) null mice die shortly after birth with loss or
    malformation of craniofacial, limb, and vertebral skeletal elements derived
    from cranial neural crest, reflecting failure to form preskeletal
    condensations from undifferentiated mesenchyme. This single-gene model
    complements the Prx1/Prx2 compound-null by isolating the PRRX1 contribution.
  evidence:
  - reference: PMID:7758948
    reference_title: The paired-like homeo box gene MHox is required for early events of skeletogenesis in multiple lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice homozygous for a mutant MHox allele die soon after birth and exhibit defects of skeletogenesis, involving the loss or malformation of craniofacial, limb, and vertebral skeletal structures.
    explanation: >-
      Loss of the mouse PRRX1 orthologue causes craniofacial skeletal loss with
      perinatal lethality, the animal counterpart of the human lesion.
  - reference: PMID:7758948
    reference_title: The paired-like homeo box gene MHox is required for early events of skeletogenesis in multiple lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Analysis of the mutant phenotype during ontogeny demonstrated a defect in the formation and growth of chondrogenic and osteogenic precursors.
    explanation: Identifies the cellular step lost in the model.
- species: Mouse (Mus musculus)
  genotype: Otx2 heterozygous null
  background: C57BL/6 versus CBA
  category: Knockout
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  associated_phenotypes:
  - Otocephaly / agnathia-holoprosencephaly complex
  - Strain-dependent severity of the mandibular phenotype
  description: >-
    Otx2 heterozygous mice develop otocephaly whose severity depends on strain
    background; genome-wide scans mapped two modifier loci, Otmf2 (chromosome 2)
    and Otmf18 (chromosome 18), that account for the difference. This is the
    mechanistic model for the "second genetic hit" postulated alongside OTX2
    loss in humans.
  evidence:
  - reference: PMID:12183386
    reference_title: Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice heterozygous for the Otx2 mutation display a craniofacial malformation, known as otocephaly or agnathia-holoprosencephaly complex.
    explanation: >-
      Establishes the Otx2 heterozygous mouse as a direct model of the human
      complex.
  - reference: PMID:12183386
    reference_title: Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We identified one significant locus, Otmf18, between D18Mit68 and D18Mit120 on chromosomes 18, linked to the mandibular phenotype (LOD score 3.33).
    explanation: Maps a modifier locus underlying the strain-dependent severity.
  - reference: PMID:7590242
    reference_title: Mouse Otx2 functions in the formation and patterning of rostral head.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In contrast, heterozygous mutants displayed craniofacial malformations designated as otocephaly; affected structures appeared to correspond to the most posterior and most anterior domains of Otx expression where Otx1 is not expressed.
    explanation: >-
      The originating description of the model, independently establishing that
      Otx2 haploinsufficiency alone produces otocephaly and locating the
      affected structures within the Otx2 expression domain.
  - reference: PMID:7590242
    reference_title: Mouse Otx2 functions in the formation and patterning of rostral head.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The homozygous mutants did not develop structures anterior to rhombomere 3, indicating an essential role of Otx2 in the formation of the rostral head.
    explanation: >-
      The homozygous null establishes the dosage sensitivity that makes the
      heterozygote an informative model: complete loss abolishes the rostral
      head, so the human disorder sits on a gene-dosage continuum.
- species: Mouse (Mus musculus)
  genotype: Crkl "snoopy" splice-site mutant
  category: Spontaneous
  genes:
  - preferred_term: CRKL
    term:
      id: hgnc:2363
      label: CRKL
  associated_phenotypes:
  - Micrognathia
  - Pharyngeal occlusion
  - Aglossia
  - Holoprosencephaly
  description: >-
    A spontaneous Crkl splice-site mutation abolishing Crkl expression produces
    a variable first-arch and midline phenotype overlapping the human complex,
    with altered retinoic acid and endothelin signalling in the developing
    oropharyngeal complex. CRKL lies in the 22q11.2 deletion interval.
  evidence:
  - reference: PMID:25565927
    reference_title: A mouse splice-site mutant and individuals with atypical chromosome 22q11.2 deletions demonstrate the crucial role for crkl in craniofacial and pharyngeal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The snoopy strain exhibits a variable phenotype that includes micrognathia, pharyngeal occlusion, aglossia and holoprosencephaly, and altered retinoic acid and endothelin signalling.
    explanation: Documents the first-arch and midline phenotype of the Crkl mutant.
  - reference: PMID:25565927
    reference_title: A mouse splice-site mutant and individuals with atypical chromosome 22q11.2 deletions demonstrate the crucial role for crkl in craniofacial and pharyngeal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These analyses demonstrate the central role of Crkl in regulating signalling events in the developing oropharyngeal complex and its potential to contribute to dysmorphology.
    explanation: >-
      Positions Crkl as a signalling hub for the oropharyngeal developmental
      field disrupted in this complex.
- species: Mouse (Mus musculus)
  genotype: Pgap1 knockout
  category: Knockout
  genes:
  - preferred_term: PGAP1
    term:
      id: hgnc:25712
      label: PGAP1
  associated_phenotypes:
  - Otocephaly
  - Perinatal death
  description: >-
    Knockout of the GPI inositol-deacylase Pgap1 causes otocephaly with
    perinatal death in most mutants, implicating GPI-anchor remodelling in
    first-arch development.
  evidence:
  - reference: PMID:17711852
    reference_title: PGAP1 knock-out mice show otocephaly and male infertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Most PGAP1 knock-out mice showed otocephaly, a developmental defect, and died right after birth.
    explanation: >-
      Establishes otocephaly as the dominant developmental phenotype of Pgap1
      loss in mouse.
- species: Sheep (Ovis aries)
  genotype: OTX2 c.265C>T (p.Arg89*) de novo heterozygous nonsense
  category: Spontaneous
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  associated_phenotypes:
  - Microstomia
  - Agnathia
  - Aglossia
  - Synotia
  description: >-
    A stillborn Istrian Pramenka lamb with microstomia, agnathia, aglossia, and

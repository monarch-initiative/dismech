name: Agnathia-Otocephaly Complex
creation_date: "2026-07-31T00:14:05Z"
description: >-
  Agnathia-otocephaly complex (AOC; otocephaly, dysgnathia complex) is an
  extremely rare, usually lethal congenital malformation complex defined by
  absence or severe hypoplasia of the mandible together with ventromedial
  and caudal displacement of the external ears, which may fuse in the
  midline (melotia/synotia — the "otocephaly" appearance). Microstomia with
  microglossia or aglossia completes the core triad. The defect is a
  developmental field defect of blastogenesis affecting derivatives of the
  first pharyngeal (branchial) arch, arising from failed cranial neural
  crest contribution to and outgrowth of the mandibular prominences.
  Holoprosencephaly is the most commonly associated anomaly, and situs
  inversus, ocular anomalies, and cleft palate are also reported. Estimated
  incidence is less than 1 in 70,000 births. Most cases are sporadic;
  heterozygous variants in OTX2 and variants in PRRX1 together explain only
  about a third of molecularly tested cases, so the disorder remains
  genetically unexplained in the majority. Prognosis is poor — death
  typically results from perinatal upper-airway obstruction — although rare
  isolated (non-holoprosencephalic) variants have survived with planned
  airway management.
category: Congenital
parents:
- Congenital Disorder
- Craniofacial Malformation Syndrome

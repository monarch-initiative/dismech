inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  penetrance: INCOMPLETE
  description: >-
    Most molecularly solved cases carry a de novo heterozygous OTX2 or PRRX1
    lesion. Expressivity is strikingly variable even within a family, ranging
    from a mild mandibular defect to a lethal facial malformation, and an OTX2
    variant may be inherited from a mildly affected (microphthalmic) parent.
  evidence:
  - reference: PMID:36553536
    reference_title: Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most AOC cases are due to a de novo sporadic mutation."
    explanation: Supports a predominantly de novo heterozygous origin.
  - reference: PMID:36553536
    reference_title: Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AOC is characterized by a wide severity clinical spectrum even when occurring within the same family, ranging from a mild mandibular defect to an extreme facial aberration incompatible with life."
    explanation: Directly supports variable expressivity within families.
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one case, the mutation was inherited from a microphthalmic mother."
    explanation: >-
      Documents parental transmission of an OTX2 lesion with a much milder
      parental phenotype.
  - reference: PMID:25589041
    reference_title: Agnathia-otocephaly complex and asymmetric velopharyngeal insufficiency due to an in-frame duplication in OTX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same variant was also identified in the proband's clinically unaffected 38-year-old husband and their 9-year-old daughter, who presented with a small mandible, normal ears and velopharyngeal insufficiency due to a short hemi-palate."
    explanation: >-
      An obligate carrier who is clinically unaffected establishes incomplete
      penetrance for this dominant mechanism.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PRRX1 mutation has been reported as a cause of
    agnathia-otocephaly, alongside the de novo heterozygous mechanism. In at
    least one apparently recessive pedigree the true mechanism proved to be
    paternal germline mosaicism rather than autosomal recessive transmission,
    so recurrence risk counselling requires care.
  evidence:
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agnathia-otocephaly is a rare craniofacial malformation complex that is caused by de novo heterozygous and biallelic mutations in PRRX1 in two unrelated babies, respectively."
    explanation: >-
      Establishes that both heterozygous de novo and biallelic PRRX1 lesions
      have been reported.
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of SNP genotyping coupled with recurrence of this novel mutation in this family are consistent with a paternally derived germline mosaicism rather than autosomal recessive inheritance as predicted by the family history."
    explanation: >-
      Qualifies the recessive interpretation: familial recurrence can reflect
      germline mosaicism rather than true recessive inheritance.
pathophysiology:
- name: PRRX1 Homeobox Transcriptional Regulator Loss of Function
  biological_scale: MOLECULAR
  description: >-
    PRRX1 encodes a paired-related homeobox transcription factor expressed in
    undifferentiated human embryonic cranial neural crest cells. Frameshift
    lesions - including a replication-slippage duplication in a poly-A tract -
    abolish transcriptional activity, while an in-frame duplication of the same
    tract is tolerated, demonstrating that loss of the PRRX1 transcriptional
    output is the pathogenic event.
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  evidence:
  - reference: PMID:32100971
    reference_title: Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PRRX1 encodes a homeobox gene, which functions as transcriptional regulator"
    explanation: Identifies PRRX1 as a homeobox transcriptional regulator.
  - reference: PMID:32100971
    reference_title: Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is expressed in undifferentiated human embryonic cranial neural crest cells"
    explanation: >-
      Places PRRX1 expression in the cranial neural crest population that builds
      the first pharyngeal arch.
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of both mutations in COS7 cells showed loss of function of the frame shift mutation only."
    explanation: >-
      Cell-based expression assays demonstrate that the frameshift lesion, not
      the in-frame duplication, causes loss of PRRX1 function.
  - reference: PMID:21294718
    reference_title: PRRX1 is mutated in a fetus with agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRRX1 is mutated in a fetus with agnathia-otocephaly."
    explanation: >-
      The original report establishing PRRX1 as a disease gene for
      agnathia-otocephaly. Only the title is indexed for this record, so the
      quotation is taken from the title.
  - reference: PMID:7758948
    reference_title: The paired-like homeo box gene MHox is required for early events of skeletogenesis in multiple lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for a mutant MHox allele die soon after birth and exhibit defects of skeletogenesis, involving the loss or malformation of craniofacial, limb, and vertebral skeletal structures."
    explanation: >-
      Loss of the mouse orthologue (MHox/Prrx1) causes craniofacial skeletal
      loss with perinatal lethality, the animal counterpart of the human lesion.
  - reference: PMID:7758948
    reference_title: The paired-like homeo box gene MHox is required for early events of skeletogenesis in multiple lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The affected skeletal elements are derived from the cranial neural crest, as well as somitic and lateral mesoderm."
    explanation: >-
      Places the Prrx1-dependent skeletal elements in the cranial neural crest
      lineage that builds the first pharyngeal arch.
  downstream:
  - target: Cranial Neural Crest and First Pharyngeal Arch Program Failure
    description: >-
      Loss of PRRX1 transcriptional output disrupts the regulatory program that
      patterns cranial neural crest in the first pharyngeal arch.
    evidence:
    - reference: PMID:32100971
      reference_title: Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Variants affecting function of OTX2 and PRRX1, which together regulate the neural crest cells and the patterning of the first pharyngeal arch as well as skeletal and limb development, were identified to be causal for the anomaly in a few patients."
      explanation: >-
        States directly that the two confirmed disease genes act on the neural
        crest / first-arch patterning program named by the target node.
- name: OTX2 Loss of Function with a Requirement for a Second Genetic Hit
  biological_scale: MOLECULAR
  description: >-
    OTX2 encodes a homeobox transcription factor expressed in the developing
    head that, together with PRRX1, regulates neural crest and first-arch
    patterning. Frameshift, in-frame duplication, small deletion, and whole-gene
    deletion lesions all cause the complex, but OTX2 loss of function alone
    appears insufficient: penetrance is incomplete and a second genetic hit is
    postulated. Zebrafish trans-suppression experiments show otx2 interacting
    genetically with pgap1, prrx1, and msx1.
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22577225
    reference_title: OTX2 mutations contribute to the otocephaly-dysgnathia complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OTX2, a known microphthalmia locus, was screened in this family and a frameshifting mutation was found."
    explanation: The discovery of OTX2 lesions in an otocephaly pedigree.
  - reference: PMID:22577225
    reference_title: OTX2 mutations contribute to the otocephaly-dysgnathia complex.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of OTX2 involvement in otocephaly/dysgnathia in humans, even if loss of function mutations at this locus does not sufficiently explain the complex anatomical defects of these patients, suggests the requirement for a second genetic hit."
    explanation: >-
      Directly supports the two-hit model in which OTX2 haploinsufficiency alone
      is insufficient to produce the full malformation.
  - reference: PMID:22577225
    reference_title: OTX2 mutations contribute to the otocephaly-dysgnathia complex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It was found that otx2 can interact genetically with pgap1, prrx1, and msx1 to exacerbate mandibular and midline defects during zebrafish development."
    explanation: >-
      Zebrafish genetic interaction data support a multi-locus model converging
      on mandibular and midline patterning.
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 4 otocephalic cases for these 2 genes and identified OTX2 mutations in 2 of them, thus confirming OTX2 is implicated in otocephaly."
    explanation: Independent replication confirming OTX2 as a disease gene.
  - reference: PMID:12183386
    reference_title: Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The severity of the phenotype is dependent on the genetic background of a C57BL/6 (B6) strain"
    explanation: >-
      Otx2 heterozygous mice show strain-dependent severity, the model-organism
      demonstration that OTX2 haploinsufficiency alone is not deterministic.
  - reference: PMID:12183386
    reference_title: Genetic modifiers of otocephalic phenotypes in Otx2 heterozygous mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These two modifiers account for the distribution of the craniofacial malformations by the genetic effect between B6 and CBA strains."
    explanation: >-
      Two mapped modifier loci (Otmf2, Otmf18) supply a concrete genetic
      mechanism for the postulated second hit.
  - reference: PMID:31969185
    reference_title: A de novo variant in OTX2 in a lamb with otocephaly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The genetic findings were consistent with the diagnosis of the otocephaly and provide strong evidence that the identified loss-of-function variant is pathogenic due to OTX2 haploinsufficiency."
    explanation: >-
      A spontaneous ovine case independently supports OTX2 haploinsufficiency as

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A c.266_269dupAAAA frameshift mutation in the poly A tract in PRRX1 was identified in the proband while her father only had an inframe duplication (c.267_269dupAAA) of the adenosine trinucleotide residue.
    explanation: Characterizes the recurrent replication-slippage PRRX1 lesion.
  - reference: PMID:23444262

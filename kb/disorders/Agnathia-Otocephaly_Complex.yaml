name: Agnathia-Otocephaly Complex
creation_date: '2026-07-31T00:29:45Z'
synonyms:
- Otocephaly
- Otocephaly-dysgnathia complex
- Agnathia-holoprosencephaly-situs inversus syndrome
- Dysgnathia complex
- Agnathia-holoprosencephaly
- AGOTC
description: >-
  Agnathia-otocephaly complex (AGOTC) is an extremely rare and usually lethal
  congenital malformation of the first pharyngeal (branchial) arch, characterized
  by absence or severe hypoplasia of the mandible (agnathia), ventromedial
  displacement and midline fusion of the external ears below the face
  (melotia/synotia, "otocephaly"), microstomia, and hypoglossia or aglossia. It
  frequently associates with midline forebrain defects (holoprosencephaly),
  microphthalmia/anophthalmia, and situs inversus. The estimated incidence is
  less than 1 in 70,000 births, and most cases are sporadic. Two genes are
  established in humans — OTX2 and PRRX1 — but together they explain only about
  one third of molecularly tested cases, so the disorder is genetically
  heterogeneous and remains unexplained in the majority of patients. The
  condition is generally incompatible with postnatal survival because the
  mandibular and airway maldevelopment can preclude a patent airway.
category: Mendelian

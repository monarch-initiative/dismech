inheritance:
- name: Sporadic occurrence with autosomal dominant OTX2-related disease
  description: >-
    Most cases are sporadic and de novo. OTX2-related agnathia-otocephaly
    behaves as an autosomal dominant trait with markedly incomplete
    penetrance and variable expressivity: the identical OTX2 variant has
    been transmitted by clinically unaffected or only mildly affected
    carriers to fetuses with lethal agnathia-otocephaly. PRRX1-related
    recurrence has been attributed to both biallelic transmission and to
    parental germline mosaicism, so recurrence counselling must be
    variant- and family-specific rather than syndrome-label-based.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:36553536
    reference_title: "Agnathia-Otocephaly Complex Due to a De Novo Deletion in the OTX2 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOC is characterized by a wide severity clinical spectrum even when
      occurring within the same family, ranging from a mild mandibular
      defect to an extreme facial aberration incompatible with life. Most
      AOC cases are due to a de novo sporadic mutation.
    explanation: >-
      Establishes both the predominance of de novo sporadic occurrence and
      the extreme intrafamilial variability that underlies the incomplete
      penetrance seen in dominant OTX2-related disease.
  - reference: PMID:25589041
    reference_title: "Agnathia-otocephaly complex and asymmetric velopharyngeal insufficiency due to an in-frame duplication in OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same variant was also identified in the proband's clinically
      unaffected 38-year-old husband and their 9-year-old daughter, who
      presented with a small mandible, normal ears and velopharyngeal
      insufficiency due to a short hemi-palate.
    explanation: >-
      Documents transmission of a pathogenic OTX2 duplication from a
      clinically unaffected carrier to fetuses with lethal
      agnathia-otocephaly, directly demonstrating incomplete penetrance in
      a dominant pedigree.
- name: Parental germline mosaicism (PRRX1)
  description: >-
    Sibling recurrence of PRRX1-related agnathia-otocephaly in a
    non-consanguineous family was shown by SNP genotyping to reflect
    paternally derived germline mosaicism rather than autosomal recessive
    inheritance, despite a pedigree that superficially suggested recessive
    transmission. No `inheritance_term` is bound here because HPO's only
    mosaicism term (HP:0001442, "Typified by somatic mosaicism") describes
    somatic rather than germline mosaicism and would misrepresent the
    mechanism.
  evidence:
  - reference: PMID:23444262
    reference_title: "Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results of SNP genotyping coupled with recurrence of this novel
      mutation in this family are consistent with a paternally derived
      germline mosaicism rather than autosomal recessive inheritance as
      predicted by the family history.
    explanation: >-
      Direct genotyping evidence that sibling recurrence in this family was
      caused by parental germline mosaicism, a mechanism that changes
      recurrence-risk counselling relative to a recessive model.
phenotypes:
- category: Craniofacial
  name: Agnathia
  description: >-
    Absence or severe hypoplasia of the mandible — the defining lesion of
    the complex. Milder spectrum cases show severe micrognathia or
    retrognathia rather than complete agenesis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Mandibular aplasia
    term:
      id: HP:0009939
      label: Mandibular aplasia
  evidence:

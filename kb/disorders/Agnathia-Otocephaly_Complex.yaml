- name: PRRX1
  gene_term:
    preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  relationship_type: CAUSATIVE
  notes: >-
    PRRX1 (paired related homeobox 1) is one of the two established causal genes.
    Reported variants include frameshift and other loss-of-function alleles;
    a biallelic form has been reported in an affected infant. PRRX1 mutations
    were identified in 4 of the ~32 genetically tested
    patients compiled in the 2021 review. A recurrent frameshift arising by DNA
    replication slippage in a poly-A tract was transmitted through paternal
    germline mosaicism in one family; only frameshift lesions, not in-frame
    duplications of the same tract, abolish function in cell-based assays. PRRX1
    is also implicated in a much milder, incompletely penetrant craniosynostosis
    phenotype.
  case_fractions:
  - population: Pooled cohort plus 1998-2019 literature review of genetically tested AOC patients
    case_fraction_percent: 12.5
    cohort_size: 32
    notes: >-
      4 of 32 genetically tested patients carried a PRRX1 lesion; combined with
      the OTX2 patients this gives the reported 11 of 32 (34%) of tested
      patients with a molecular diagnosis.
    evidence:
    - reference: PMID:32643087
      reference_title: Re-focusing on Agnathia-Otocephaly complex.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Among those 22 patients, 6 were carrying mutation or deletion in the OTX2 gene and 4 in the PRRX1 gene.
      explanation: >-
        Gives the PRRX1 count within the 22 genetically tested literature
        patients; the authors' own 10-patient cohort contributed no further
        PRRX1 lesion, so 4 remains the numerator against the pooled denominator
        of 32.
  evidence:
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the orthodenticle homeobox 2 (OTX2) and paired related homeobox 1 (PRRX1) genes have recently been identified in some cases.
    explanation: Confirms PRRX1 (with OTX2) as an established causal gene for the otocephaly-dysgnathia complex.
  - reference: PMID:21294718
    reference_title: PRRX1 is mutated in a fetus with agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PRRX1 is mutated in a fetus with agnathia-otocephaly.
    explanation: >-
      The original report establishing PRRX1 as a disease gene. Only the title
      is indexed in PubMed for this record, so the quotation is taken from the
      title.
  - reference: PMID:23444262

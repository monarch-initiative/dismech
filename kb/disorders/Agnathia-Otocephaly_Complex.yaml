- name: Midline Forebrain Cleavage Failure
  biological_scale: TISSUE
  description: >-
    Agnathia-otocephaly frequently co-occurs with holoprosencephaly and other
    midline defects, reflecting shared dependence of first-arch patterning and
    forebrain cleavage on overlapping midline signalling (SHH, BMP, FGF)
    programs. Holoprosencephaly is the most commonly identified associated
    anomaly, and cyclopia has been reported in association with the complex.

- name: Neonatal Airway Obstruction and Aerodigestive Failure
  biological_scale: ORGANISM
  description: >-
    In utero, absence of the mandible and tongue impairs fetal swallowing and
    produces polyhydramnios. At birth the same anatomy makes the upper airway
    unsecurable by conventional means and deglutition impossible, so the
    complex is most often lethal. Accompanying pharyngeal, laryngeal, and
    pulmonary hypoplasia can cause fatal respiratory failure even when an
    airway is successfully established.
  locations:
  - preferred_term: pharyngeal arch
    term:
      id: UBERON:0002539
      label: pharyngeal arch
  evidence:
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This severe anomaly of the first branchial arch is most often lethal."
    explanation: Supports the lethal clinical outcome of the malformation.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this, the neonate died 12 h after delivery from severe respiratory failure and a tension pneumothorax caused by a hypoplastic lung."
    explanation: >-
      Illustrates that pulmonary hypoplasia can be fatal even after a successful
      EXIT-assisted tracheostomy.
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lack of musculature make deglutition virtually impossible with current therapies"
    explanation: >-
      Long-term follow-up confirms permanent aerodigestive failure even in
      survivors.
  downstream:
  - target: Neonatal respiratory distress
    evidence:

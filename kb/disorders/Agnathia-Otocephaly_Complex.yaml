    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agnathia-otocephaly complex (AOC) is a rare and usually lethal malformation typically characterized by hypoplasia or the absence of the mandible, ventromedial and caudal displacement of the ears with or without the fusion of the ears, a small oral aperture with or without a tongue hypoplasia."
    explanation: >-
      Describes the coordinated malformation bundle including ventromedial ear
      displacement and fusion.
  - reference: PMID:30756395
    reference_title: "The location of the fetal ears: A hint for prenatal diagnosis of agnathia-otocephaly complex."
    supports: SUPPORT

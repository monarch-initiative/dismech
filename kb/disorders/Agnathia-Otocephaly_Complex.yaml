notes: >-
  Long-term survival with a good quality of life is achievable at the milder
  ("nanognathia"/severe micrognathia) end of the spectrum: in a 30-year
  single-institution series of four patients with a mean 17-year follow-up, the
  eldest were in college and graduate education, although deglutition remained
  impossible. No GeneReviews chapter exists for agnathia-otocephaly complex.
  This entry was created in https://github.com/monarch-initiative/dismech/pull/7233
  and enriched in a follow-up augmentation that salvaged independently curated
  content from https://github.com/monarch-initiative/dismech/pull/7240; both
  curations used the committed Edison Scientific (falcon) deep
  research report in
  research/Agnathia-Otocephaly_Complex-deep-research-falcon.md, which passed the
  NEC preflight against MONDO:0008740 (PRRX1, OMIM:202650, synonyms "otocephaly"
  and "agnathia-holoprosencephaly-situs inversus syndrome"). Every PMID,
  snippet, and ontology term was independently verified against the cached
  abstracts and OAK before use.

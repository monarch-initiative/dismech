    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 7 fetuses presented with agnathia and 6 with ventrocaudal
      displacement of the ears (melotia/synotia).
    explanation: >-
      Agnathia was present in 7/7 fetuses in this first-trimester series,
      supporting it as an obligate, very frequent defining feature.
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agnathia-otocephaly complex is a rare condition characterized by
      mandibular hypoplasia or agnathia, ear anomalies (melotia/synotia) and
      microstomia with aglossia.
    explanation: >-
      Defines mandibular hypoplasia/agnathia as a cardinal diagnostic
      feature of the complex.
- category: Craniofacial
  name: Synotia and Ventromedial Auricular Malposition
  description: >-
    The shortened lower face leaves the external ears in an abnormally low,
    ventral, and medial position (melotia); at the severe end the auricles
    approach or fuse in the midline beneath the face (synotia), producing
    the "otocephaly" appearance. The abnormality is chiefly one of position
    — intrinsic auricular anatomy and hearing may be relatively preserved.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Synotia
    term:
      id: HP:0100663
      label: Synotia
  evidence:
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 7 fetuses presented with agnathia and 6 with ventrocaudal
      displacement of the ears (melotia/synotia).
    explanation: >-
      Ventrocaudal ear displacement was present in 6 of 7 fetuses,
      supporting a very frequent band for this feature.
  - reference: PMID:17438667
    reference_title: "Otocephaly: report of five new cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otocephaly, characterized by mandibular hypoplasia or agnathia,
      ventromedial auricular malposition (melotia) and/or auricular fusion
      (synotia), and microstomia with oroglossal hypoplasia or aglossia
    explanation: >-
      Defines melotia/synotia as a cardinal component of the malformation
      complex.
- category: Craniofacial
  name: Microstomia
  description: >-
    An abnormally small oral aperture, which both reflects the underlying
    first-arch deficiency and compounds airway access and feeding
    difficulty after birth.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Narrow mouth
    term:
      id: HP:0000160
      label: Narrow mouth
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by agnathia, microstomia, aglossia, and abnormally

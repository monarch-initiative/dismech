name: Agnathia-Otocephaly Complex
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Agnathia-otocephaly complex (AOC, otocephaly, dysgnathia complex) is an
  extremely rare and usually lethal congenital malformation of the first
  pharyngeal (branchial) arch. It is characterized by absence or severe
  hypoplasia of the mandible (agnathia), ventromedial and caudal displacement
  of the external ears with or without midline fusion (synotia/melotia), and
  microstomia with aglossia or microglossia. Holoprosencephaly is the most
  frequent associated anomaly; cyclopia, microphthalmia/anophthalmia, cleft
  palate, pharyngeal and laryngeal hypoplasia, and situs anomalies are also
  reported. Most cases are sporadic. Only OTX2 and PRRX1 are confirmed
  disease genes and together explain roughly a third of molecularly tested
  patients, so the disorder remains genetically unexplained in the majority.
category: Mendelian
parents:
- craniofacial malformation syndrome
- multiple congenital anomalies/dysmorphic syndrome
synonyms:
- otocephaly
- AGOTC
- agnathia-holoprosencephaly
- dysgnathia complex
- otocephaly-dysgnathia complex
- agnathia-holoprosencephaly-situs inversus syndrome

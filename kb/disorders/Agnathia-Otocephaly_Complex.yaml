    evidence_source: HUMAN_CLINICAL
    snippet: Agnathia-otocephaly is a rare, often lethal malformation characterized by absence or hypoplasia of the mandible, microstomia, hypoglossia/aglossia, and variable anterior midline fusion of the ears (melotia, synotia).
    explanation: Documents the anterior midline fusion of the ears (melotia/synotia) that accompanies the mandibular defect.
- name: Airway Obstruction and Perinatal Respiratory Failure
  description: >-
    The distorted upper airway produced by the absent mandible and oropharyngeal
    maldevelopment, together with associated forebrain/multisystem defects,
    precludes a patent airway at birth and causes perinatal respiratory failure —
    the proximate cause of the usually lethal outcome.
  biological_scale: ORGANISM

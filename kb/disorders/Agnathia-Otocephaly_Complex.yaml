- name: Midline Forebrain Cleavage Failure
  description: >-
    Agnathia-otocephaly frequently co-occurs with holoprosencephaly and other
    midline defects, reflecting the shared dependence of first-arch patterning
    and forebrain cleavage on overlapping midline signalling (SHH, BMP, FGF)
    programs. Holoprosencephaly is the most commonly identified associated
    anomaly, and cyclopia lies at the severe end of the same spectrum. The
    presence or absence of this arm separates the syndromic from the isolated
    form of the complex and is the dominant prognostic determinant.

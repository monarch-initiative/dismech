pathophysiology:
- name: PRRX1/OTX2 Loss of Function in First-Arch Neural Crest
  description: >-
    The two established causal genes, PRRX1 (paired related homeobox 1) and OTX2
    (orthodenticle homeobox 2), encode transcription factors that together
    regulate the cranial neural crest cells and the patterning of the first
    pharyngeal arch. The mandibular and hyoid arches build the facial skeleton,
    and most of their skeletal tissue differentiates from neural crest; loss of
    function of this program is the initiating lesion of agnathia-otocephaly. In
    mouse, the paired-related homeobox genes Prx1/Prx2 (PRRX1/PRRX2) mediate the
    epithelial-mesenchymal interactions that build the lower jaw and ear.
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation

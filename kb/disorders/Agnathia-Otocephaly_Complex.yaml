  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Variants affecting function of OTX2 and PRRX1, which together regulate the neural crest cells and the patterning of the first pharyngeal arch as well as skeletal and limb development, were identified to be causal for the anomaly in a few patients.
    explanation: Identifies OTX2 and PRRX1 as the causal transcription factors regulating first-pharyngeal-arch neural crest, the substrate of this trigger node.
  - reference: PMID:34299147
    reference_title: "The Mandibular and Hyoid Arches-From Molecular Patterning to Shaping Bone and Cartilage."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Although all three germ layers come together to assemble the pharyngeal arches, the majority of tissue within viscerocranial skeletal components differentiates from the neural crest.
    explanation: Establishes cranial neural crest as the origin of the facial (viscerocranial) skeleton disrupted in this disorder; evidence source OTHER as this is a developmental review.
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our results suggest a role for Prx genes in mediating epitheliomesenchymal interactions in inner ear and lower jaw.
    explanation: Establishes the developmental role of the paired-related homeobox (Prx/PRRX) genes in lower jaw and ear formation in mouse.
  downstream:
  - target: Failure of Mandibular Arch Skeletogenesis
- name: Failure of Mandibular Arch Skeletogenesis
  description: >-
    Loss of first-arch patterning and neural-crest skeletogenesis prevents
    formation of the mandible (agnathia) and its associated first-arch
    derivatives, producing hypoglossia/aglossia and microstomia. Mouse
    Prx1/Prx2 double mutants recapitulate this with a reduced and sometimes cleft
    mandible together with ear defects.
  biological_scale: TISSUE
  role: central_effector
  conforms_to: pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis

  evidence:
  - reference: PMID:31969185
    reference_title: A de novo variant in OTX2 in a lamb with otocephaly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: A stillborn male lamb of the Istrian Pramenka sheep breed showed several congenital craniofacial anomalies including microstomia, agnathia, aglossia, and synotia.
    explanation: Documents a spontaneous ovine phenocopy of the human malformation bundle.
  - reference: PMID:31969185
    reference_title: A de novo variant in OTX2 in a lamb with otocephaly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The genetic findings were consistent with the diagnosis of the otocephaly and provide strong evidence that the identified loss-of-function variant is pathogenic due to OTX2 haploinsufficiency.
    explanation: >-
      Independently supports OTX2 haploinsufficiency as the operative mechanism
      across species.
experimental_models:
- name: PRRX1-tdTomato reporter hPSC-derived limb-bud-like mesenchymal cells
  description: >-
    Human pluripotent stem cells carrying a PRRX1-tdTomato reporter can be
    selectively induced into expandable PRRX1-positive limb-bud-like mesenchymal
    cells with chondrogenic potential under xeno-free conditions. This is
    a tractable human system for functionalising PRRX1 variants
    and studying PRRX1-dependent mesenchymal condensation; it does not reproduce
    first-arch spatial patterning or airway anatomy, so it is a variant-function
    assay platform rather than a disease model.
  publication: PMID:34373601
  evidence:
  - reference: PMID:34373601
    reference_title: Induction and expansion of human PRRX1(+) limb-bud-like mesenchymal cells from pluripotent stem cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The cells, which proliferated stably and exhibited the potential to undergo chondrogenic differentiation, formed hyaline cartilaginous-like tissue commensurate to their PRRX1-expression levels.
    explanation: >-
      Demonstrates a PRRX1-dosage-dependent chondrogenic readout in human cells,
      the functional axis lost in PRRX1-related disease. PARTIAL because the
      system was not developed for, or validated against, agnathia-otocephaly.
environmental:
- name: Teratogenic and non-genetic exposures
  presence: Suspected
  effect: Temporally associated with sporadic cases; causality not established
  description: >-
    Reviews of the complex consistently list teratogenic alongside genetic
    causes, and isolated case reports have temporally associated the
    malformation with maternal drug exposures such as topical 1% salicylate.
    These are uncontrolled single-case observations; no exposure has been shown
    to cause the complex, and they are recorded as suspected associations rather
    than established teratogens.
  evidence:
  - reference: PMID:20849990
    reference_title: Current perspectives on the etiology of agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This complex disorder can be attributed to both genetic and teratogenic causes, in addition to other unidentifiable factors.
    explanation: >-
      An etiology review explicitly recognises a teratogenic contribution
      alongside genetic causes.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with etiologies linked to both genetic and teratogenic factors
    explanation: >-
      An independent cohort-plus-literature review makes the same dual-etiology
      statement.
  - reference: PMID:18049088
    reference_title: Agnathia-otocephaly complex in a fetus with maternal use of topical 1% salicylate.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Agnathia-otocephaly complex in a fetus with maternal use of topical 1% salicylate.
    explanation: >-
      A single case temporally associating the malformation with maternal
      topical salicylate. PubMed indexes only the title for this record, so the
      quotation is taken from the title; classified PARTIAL because a single
      uncontrolled observation cannot establish teratogenicity.
discussions:
- discussion_id: agotc_molecular_diagnostic_yield_gap
  prompt: >-
    What accounts for the ~66% of agnathia-otocephaly cases that remain
    molecularly unexplained after OTX2/PRRX1 testing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRRX1 Loss of Function
  - pathophysiology#OTX2 Loss of Function
  rationale: >-
    Together OTX2 and PRRX1 account for only about one third of genetically
    tested patients, so most cases remain molecularly unexplained and additional
    genetic (and teratogenic) factors are implicated.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a total of 32 patients benefited from genetic testing, with only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1.
    explanation: Quantifies that the two known genes explain only about a third of tested cases, defining the molecular-diagnostic gap.
- discussion_id: agotc_cnbp_human_model_mismatch
  prompt: >-
    Do CNBP mutations cause agnathia-otocephaly in humans, given that Cnbp
    heterozygous mice recapitulate the phenotype but human CNBP screening has
    been negative?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#First-Arch Neural Crest Patterning Failure
  rationale: >-
    Cnbp heterozygous mice reproduce the mandibular and eye defects of
    agnathia-otocephaly, making CNBP a strong candidate, yet Sanger screening of
    human cases found no CNBP variants. Whether this reflects true absence of
    human involvement or a species-specific compensatory effect is unresolved —
    the model shows the phenotype while the human translational validity is the
    open question.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mutations in Cnbp in mice are responsible for mandibular and eye defects mimicking the agnathia-otocephaly complex in humans and appear as a good candidate.
    explanation: Establishes that the mouse Cnbp model recapitulates the human phenotype (the model half of the mismatch).
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This suggests that mutations in CNBP might not be involved in such phenotype in humans or that, unlike in mice, a compensatory effect might exist in humans.
    explanation: States the negative human screening result and the unresolved translational question (the human half of the mismatch).

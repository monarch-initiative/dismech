genetic:
- name: PRRX1
  gene_term:
    preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  relationship_type: CAUSATIVE
  notes: >-
    PRRX1 (paired related homeobox 1) is one of the two established causal genes.
    Reported variants include frameshift and other loss-of-function alleles;
    biallelic variants segregate with autosomal recessive disease in some
    families. PRRX1 mutations were identified in 4 of the ~32 genetically tested
    patients compiled in the 2021 review.
  evidence:
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the orthodenticle homeobox 2 (OTX2) and paired related homeobox 1 (PRRX1) genes have recently been identified in some cases.
    explanation: Confirms PRRX1 (with OTX2) as an established causal gene for the otocephaly-dysgnathia complex.
- name: OTX2
  gene_term:
    preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  relationship_type: CAUSATIVE
  notes: >-
    OTX2 (orthodenticle homeobox 2), a known microphthalmia/anophthalmia locus,
    is the second established causal gene. OTX2 variants (point mutations and
    deletions) show incomplete penetrance and striking intrafamilial variability,
    and OTX2 mutations alone may not be sufficient — a second genetic hit is
    proposed. OTX2 accounted for 6 of the ~32 genetically tested patients in the
    2021 review.
  evidence:
  - reference: PMID:22577225
    reference_title: "OTX2 mutations contribute to the otocephaly-dysgnathia complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of OTX2 involvement in otocephaly/dysgnathia in humans, even if loss of function mutations at this locus does not sufficiently explain the complex anatomical defects of these patients, suggests the requirement for a second genetic hit.
    explanation: Establishes OTX2 as causal in humans while noting it is often insufficient alone, requiring a second genetic hit.
  - reference: PMID:24167467
    reference_title: "Otocephaly-Dysgnathia Complex: Description of Four Cases and Confirmation of the Role of OTX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We screened 4 otocephalic cases for these 2 genes and identified OTX2 mutations in 2 of them, thus confirming OTX2 is implicated in otocephaly.
    explanation: Independent confirmation of OTX2 mutations in otocephalic patients.
- name: SMAD3
  gene_term:
    preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  relationship_type: UNKNOWN
  notes: >-
    A de novo SMAD3 missense variant was reported in a single fetus with severe
    agnathia-otocephaly, proposing that the complex may represent the severe end
    of a phenotypic spectrum related to the interacting SMAD/TGFB/BMP/SHH/FGF
    pathways. This is a single-case, emerging association rather than an
    established gene. Typed UNKNOWN (not yet classified) rather than DISPUTED,
    because the association has not been contested or refuted in the literature —
    it is simply not yet independently replicated.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing detected a de novo SMAD3 missense variant in exon 6 (c.860G>A) associated with decreased mRNA expression.
    explanation: Reports the single-case de novo SMAD3 variant; evidence marked PARTIAL because the association rests on one patient and a proposed pathway mechanism.
treatments:
- name: Genetic counseling
  description: >-
    Genetic counseling and, where indicated, molecular testing (OTX2, PRRX1,
    array-CGH/exome) support recurrence-risk assessment and reproductive
    decision-making for affected families, particularly given the autosomal
    recessive PRRX1 form and the variable-penetrance OTX2 form.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  therapeutic_modality: BEHAVIORAL
- name: Perinatal palliative and supportive care
  description: >-
    Because the malformation is most often lethal owing to an unsalvageable
    airway, management is generally palliative/supportive perinatal care after
    prenatal diagnosis. An EXIT (ex utero intrapartum treatment)-to-airway
    strategy has been considered only in exceptional, anatomically feasible
    cases, supported by individual reports rather than response-rate studies.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This severe anomaly of the first branchial arch is most often lethal.
    explanation: Supports a palliative/supportive rather than curative management posture given the usually lethal course.
- name: Airway management (including EXIT-to-airway)
  description: >-
    In the exceptional, anatomically feasible case where active neonatal
    intervention is chosen, a secured airway is the pivotal intervention: an
    EXIT (ex utero intrapartum treatment)-to-airway procedure or immediate
    surgical airway (tracheostomy) at delivery, planned by a multidisciplinary
    difficult-airway team. Evidence is limited to individual case reports rather
    than response-rate studies.
  treatment_term:
    preferred_term: airway management
    term:
      id: MAXO:0000500
      label: airway management
  therapeutic_modality: SURGERY
  notes: >-
    No structured evidence item is attached deliberately: reported experience is
    limited to individual EXIT/surgical-airway case reports without a citable
    quantitative outcome, and no cached abstract supplies a verifiable snippet
    specific to airway management in this disorder.
diagnosis:
- name: Prenatal ultrasound and fetal MRI
  description: >-
    Most cases are detected prenatally or at birth by the characteristic
    craniofacial anatomy: an absent/severely hypoplastic mandible, abnormally
    low/medially displaced ears, microstomia, and often polyhydramnios from
    impaired fetal swallowing. 3D ultrasound and fetal MRI further clarify the
    airway, tongue, palate, ear position, and CNS anatomy.
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: MAXO:0000520
      label: fetal ultrasonography
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Agnathia-otocephaly complex is a rare condition characterized by mandibular hypoplasia or agnathia, ear anomalies (melotia/synotia) and microstomia with aglossia.
    explanation: The characteristic craniofacial anatomy (agnathia, ear anomalies, microstomia) is the basis of prenatal/postnatal recognition.
- name: Molecular diagnosis (chromosomal microarray and sequencing)
  description: >-
    Molecular confirmation uses chromosomal microarray (array-CGH) plus targeted
    OTX2/PRRX1 sequencing or trio exome/genome sequencing. Notably, in the 2021
    10-patient cohort the only molecular diagnosis came from array-CGH (a 107-kb
    OTX2 deletion), not Sanger sequencing — underscoring the value of copy-number
    analysis.
  diagnosis_term:
    preferred_term: prenatal genetic testing
    term:
      id: MAXO:0000529
      label: prenatal genetic testing
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: array-CGH has allowed identifying a 107-kb deletion encompassing OTX2 responsible for the agnathia-otocephaly complex phenotype in 1 of them
    explanation: Documents that array-CGH (copy-number analysis) yielded the only molecular diagnosis in the cohort, supporting CMA as a key diagnostic arm.
differential_diagnoses:
- name: Treacher Collins syndrome
  description: Mandibulofacial dysostosis with malar/mandibular hypoplasia and ear anomalies.
  distinguishing_features:
  - Malar/mandibular hypoplasia without the complete agnathia of the complex
  - No ventromedial synotia
  disease_term:
    preferred_term: Treacher Collins syndrome
    term:
      id: MONDO:0002457
      label: Treacher-Collins syndrome
- name: Nager acrofacial dysostosis
  description: Acrofacial dysostosis combining mandibulofacial dysostosis with preaxial limb anomalies.
  distinguishing_features:
  - Preaxial (radial) limb involvement, absent in agnathia-otocephaly
  - No true agnathia or synotia
  disease_term:
    preferred_term: Nager acrofacial dysostosis
    term:
      id: MONDO:0007943
      label: Nager acrofacial dysostosis
- name: Auriculocondylar syndrome
  description: First- and second-arch patterning disorder (EDN1-EDNRA-DLX axis).
  distinguishing_features:
  - Mandibular condyle hypoplasia rather than complete agnathia (milder)
  - '"Question-mark" ear rather than ventromedial synotia'
  disease_term:
    preferred_term: auriculocondylar syndrome
    term:
      id: MONDO:0000107
      label: auriculocondylar syndrome
- name: Pierre Robin sequence
  description: Micrognathia with glossoptosis and cleft palate.
  distinguishing_features:
  - Mandible is present and hypoplastic rather than absent
  - Ears are normally positioned
  notes: >-
    No clean base "Pierre Robin sequence" MONDO term surfaced in the current
    ontology build (only compound syndromic terms), so no disease_term is bound.
progression:
- phase: Prenatal / perinatal
  age_range: Embryonic onset; presentation at prenatal diagnosis or birth
  notes: >-
    All defining manifestations are congenital, arising during first-trimester
    first-pharyngeal-arch development, and are anatomically fixed thereafter.
    There is no postnatal disease progression; the course culminates in
    termination after prenatal diagnosis, stillbirth, or neonatal death, with
    rare survivors representing milder spectrum disease.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder is almost always lethal.
    explanation: Supports the perinatally lethal natural history of the malformation.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Agnathia-otocephaly complex is almost always perinatally lethal because a
    patent airway cannot be established; it is among the most severe possible
    outcomes for a congenital malformation.
  evidence:
  - reference: PMID:32100971
    reference_title: "Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder is almost always lethal.
    explanation: Directly supports the HIGH clinical burden (near-universal lethality).
animal_models:
- species: Mouse (Mus musculus)
  genotype: Prx1/Prx2 (Prrx1/Prrx2) compound-null mouse
  category: Knockout
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  associated_phenotypes:
  - Reduced and sometimes cleft mandible
  - External, middle, and inner ear defects
  - Reduction or loss of skull bones
  description: >-
    Prx1/Prx2 double-mutant mice reproduce the mandibular and ear defects of the
    human first-arch malformation, demonstrating the developmental role of the
    paired-related homeobox genes in lower jaw and ear formation.
  evidence:
  - reference: PMID:9729491
    reference_title: "Prx1 and Prx2 in skeletogenesis: roles in the craniofacial region, inner ear and limbs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found defects in external, middle and inner ear, reduction or loss of skull bones, a reduced and sometimes cleft mandible, and limb abnormalities including postaxial polydactyly and bent zeugopods.
    explanation: Documents the mandibular and ear phenotypes of the Prx1/Prx2 compound-null mouse.
discussions:
- discussion_id: agotc_molecular_diagnostic_yield_gap
  prompt: >-
    What accounts for the ~66% of agnathia-otocephaly cases that remain
    molecularly unexplained after OTX2/PRRX1 testing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRRX1/OTX2 Loss of Function in First-Arch Neural Crest
  rationale: >-
    Together OTX2 and PRRX1 account for only about one third of genetically
    tested patients, so most cases remain molecularly unexplained and additional
    genetic (and teratogenic) factors are implicated.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a total of 32 patients benefited from genetic testing, with only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1.
    explanation: Quantifies that the two known genes explain only about a third of tested cases, defining the molecular-diagnostic gap.
- discussion_id: agotc_cnbp_human_model_mismatch
  prompt: >-
    Do CNBP mutations cause agnathia-otocephaly in humans, given that Cnbp
    heterozygous mice recapitulate the phenotype but human CNBP screening has
    been negative?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#PRRX1/OTX2 Loss of Function in First-Arch Neural Crest
  rationale: >-
    Cnbp heterozygous mice reproduce the mandibular and eye defects of
    agnathia-otocephaly, making CNBP a strong candidate, yet Sanger screening of
    human cases found no CNBP variants. Whether this reflects true absence of
    human involvement or a species-specific compensatory effect is unresolved —
    the model shows the phenotype while the human translational validity is the
    open question.
  evidence:
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mutations in Cnbp in mice are responsible for mandibular and eye defects mimicking the agnathia-otocephaly complex in humans and appear as a good candidate.
    explanation: Establishes that the mouse Cnbp model recapitulates the human phenotype (the model half of the mismatch).
  - reference: PMID:32643087
    reference_title: "Re-focusing on Agnathia-Otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This suggests that mutations in CNBP might not be involved in such phenotype in humans or that, unlike in mice, a compensatory effect might exist in humans.
    explanation: States the negative human screening result and the unresolved translational question (the human half of the mismatch).

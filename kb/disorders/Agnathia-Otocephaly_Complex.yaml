    explanation: >-
      Patient-tissue qPCR demonstrates the functional consequence of the SMAD3
      variant on transcript level.
  - reference: PMID:32100971
    reference_title: Expanding the spectrum of SMAD3-related phenotypes to agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which play a key role in the development of craniofacial structures originating from the pharyngeal arches."
    explanation: >-
      Links the TGF-beta/BMP pathways transduced by SMAD3 to pharyngeal-arch

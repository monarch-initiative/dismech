    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of OTX2 involvement in otocephaly/dysgnathia in humans, even if loss of function mutations at this locus does not sufficiently explain the complex anatomical defects of these patients, suggests the requirement for a second genetic hit.

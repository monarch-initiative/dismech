- name: SMAD3 and TGF-beta/BMP Signaling Disruption
  biological_scale: MOLECULAR
  description: >-
    A de novo SMAD3 missense variant with demonstrated reduction in SMAD3 mRNA
    was identified in a fetus with severe agnathia-otocephaly. SMAD3 transduces
    TGF-beta and BMP signals that pattern pharyngeal-arch-derived craniofacial
    structures, placing agnathia-otocephaly at the severe end of a spectrum of
    phenotypes caused by lesions in the interacting SMAD/TGFB/BMP/SHH/FGF
    developmental network. This is a single-family observation and should be
    treated as an emerging rather than established disease-gene assignment.
  genes:
  - preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:32100971

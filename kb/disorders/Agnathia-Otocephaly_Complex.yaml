notes: >-
  Curation scope note. MONDO:0008740 carries the Orphanet definition of
  "agnathia-holoprosencephaly-situs inversus syndrome", which describes the
  most severe co-occurring presentation. This entry is curated at the level
  of the broader agnathia-otocephaly complex as used in the clinical
  genetics literature — the first-arch malformation complex itself — with
  holoprosencephaly and situs inversus modelled as frequent and occasional
  associated phenotypes respectively rather than as obligate criteria. That
  matches how the cited case series ascertain and report patients (for
  example holoprosencephaly in 4 of 7 fetuses, situs inversus in 1 of 5),
  and it keeps the potentially survivable "isolated" form inside the entry.

  Frequency bands are derived from small case series (7 fetuses in
  PMID:30171631, 5 in PMID:17438667) and are therefore coarse; publication
  bias toward severe prenatally diagnosed cases probably inflates the
  apparent frequency of holoprosencephaly relative to the milder isolated
  presentations that survive to postnatal ascertainment.

  Perinatal lethality is modelled under `progression` rather than as a
  phenotype: HPO's death terms (HP:0003811 Neonatal death and siblings) sit
  under Clinical modifier / Age of death, not under Phenotypic abnormality,
  and so are outside the PhenotypeTerm value set.

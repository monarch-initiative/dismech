    evidence_source: MODEL_ORGANISM
    snippet: "We identified one significant locus, Otmf18, between D18Mit68 and D18Mit120 on chromosomes 18, linked to the mandibular phenotype (LOD score 3.33)."
    explanation: Maps the first modifier locus underlying the strain-dependent severity.
- species: Mus musculus
  genotype: MHox (Prrx1) homozygous loss-of-function
  category: Genetic
  genes:
  - preferred_term: PRRX1
    term:
      id: hgnc:9142
      label: PRRX1
  description: >-
    Homozygous MHox (Prrx1) null mice die shortly after birth with loss or
    malformation of craniofacial, limb, and vertebral skeletal elements derived
    from cranial neural crest, reflecting failure to form preskeletal
    condensations from undifferentiated mesenchyme.
  evidence:
  - reference: PMID:7758948
    reference_title: The paired-like homeo box gene MHox is required for early events of skeletogenesis in multiple lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of the mutant phenotype during ontogeny demonstrated a defect in the formation and growth of chondrogenic and osteogenic precursors."
    explanation: >-
      Identifies the cellular step lost in the mouse model - formation of
      chondrogenic and osteogenic precursors from arch mesenchyme.
- species: Mus musculus
  genotype: Crkl "snoopy" splice-site mutant
  category: Genetic
  genes:
  - preferred_term: CRKL
    term:
      id: hgnc:2363
      label: CRKL
  description: >-
    A spontaneous Crkl splice-site mutation abolishing Crkl expression produces a
    variable first-arch and midline phenotype overlapping the human complex, with
    altered retinoic acid and endothelin signalling in the developing
    oropharyngeal complex.
  evidence:
  - reference: PMID:25565927
    reference_title: A mouse splice-site mutant and individuals with atypical chromosome 22q11.2 deletions demonstrate the crucial role for crkl in craniofacial and pharyngeal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These analyses demonstrate the central role of Crkl in regulating signalling events in the developing oropharyngeal complex and its potential to contribute to dysmorphology."
    explanation: >-
      Positions Crkl as a signalling hub for the oropharyngeal developmental
      field disrupted in this complex.
- species: Mus musculus
  genotype: Pgap1 knockout
  category: Genetic
  genes:
  - preferred_term: PGAP1
    term:
      id: hgnc:25712
      label: PGAP1
  description: >-
    Knockout of the GPI inositol-deacylase Pgap1 causes otocephaly with perinatal
    death in most mutants, implicating GPI-anchor remodelling in first-arch
    development.
  evidence:
  - reference: PMID:17711852
    reference_title: PGAP1 knock-out mice show otocephaly and male infertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Most PGAP1 knock-out mice showed otocephaly, a developmental defect, and died right after birth."
    explanation: >-
      Establishes otocephaly as the dominant developmental phenotype of Pgap1
      loss in mouse.
- species: Ovis aries
  genotype: OTX2 c.265C>T (p.Arg89*) de novo heterozygous nonsense
  category: Spontaneous
  genes:
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  description: >-
    A stillborn Istrian Pramenka lamb with microstomia, agnathia, aglossia, and
    synotia carried a de novo OTX2 nonsense variant truncating over 70% of the
    open reading frame; a naturally occurring cross-species counterpart of the
    human OTX2 mechanism.
  evidence:
  - reference: PMID:31969185
    reference_title: A de novo variant in OTX2 in a lamb with otocephaly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A stillborn male lamb of the Istrian Pramenka sheep breed showed several congenital craniofacial anomalies including microstomia, agnathia, aglossia, and synotia."
    explanation: >-
      Documents a spontaneous ovine phenocopy of the human malformation bundle.
experimental_models:
- name: PRRX1-tdTomato reporter hPSC-derived limb-bud-like mesenchymal cells
  description: >-
    Human pluripotent stem cells carrying a PRRX1-tdTomato reporter can be
    selectively induced into expandable PRRX1-positive limb-bud-like mesenchymal
    cells with chondrogenic potential under xeno-free conditions. This is
    currently the only tractable human system for functionalising PRRX1 variants
    and studying PRRX1-dependent mesenchymal condensation; it does not reproduce
    first-arch spatial patterning or airway anatomy, so it is a variant-function
    assay platform rather than a disease model.
  publication: PMID:34373601
  evidence:
  - reference: PMID:34373601
    reference_title: Induction and expansion of human PRRX1(+) limb-bud-like mesenchymal cells from pluripotent stem cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The cells, which proliferated stably and exhibited the potential to undergo chondrogenic differentiation, formed hyaline cartilaginous-like tissue commensurate to their PRRX1-expression levels."
    explanation: >-
      Demonstrates a PRRX1-dosage-dependent chondrogenic readout in human cells,
      the functional axis lost in PRRX1-related disease. PARTIAL because the
      system was not developed for, or validated against, agnathia-otocephaly.
diagnosis:
- name: Prenatal ultrasound assessment of fetal ear position
  description: >-
    Careful 2D sonographic assessment of the location of the fetal ears is the
    key early diagnostic manoeuvre; ventrocaudal, midline-approximated ears
    below an absent or severely hypoplastic mandible establish the diagnosis,
    often in the first trimester.
  evidence:
  - reference: PMID:30756395
    reference_title: "The location of the fetal ears: A hint for prenatal diagnosis of agnathia-otocephaly complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The key to early diagnosis is careful assessment of the location of the fetal ears on 2D ultrasound examination."
    explanation: Directly states the diagnostic approach.
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report highlights the important role of ultrasound in the identification of agnathia-otocephaly complex in the first trimester of pregnancy."
    explanation: Supports first-trimester sonographic detectability.
- name: Advanced fetal imaging (3D ultrasound, CT and MRI)
  description: >-
    Beyond 2D ultrasound, three-dimensional ultrasonography, computed tomography
    and magnetic resonance imaging refine the resolution of the facial anomalies
    and define tongue, pharyngeal and airway anatomy, which is what drives
    delivery and airway planning.
  evidence:
  - reference: PMID:20849990
    reference_title: Current perspectives on the etiology of agnathia-otocephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "two- and three-dimensional ultrasonography, computed tomography and magnetic resonance imaging technologies now offer significant improvements in refining the resolution of distinctive facial anomalies."
    explanation: >-
      States that advanced imaging materially improves prenatal characterisation
      of the facial malformation.
  - reference: PMID:20849990
    reference_title: Current perspectives on the etiology of agnathia-otocephaly.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Difficulties persist in the prenatal diagnosis of agnathia-otocephalic patients."
    explanation: >-
      Qualifies the diagnostic picture: even with advanced imaging, prenatal
      recognition remains difficult.
- name: Molecular testing of OTX2 and PRRX1 with copy-number analysis
  description: >-
    Sanger sequencing of OTX2 and PRRX1 combined with array-CGH. Sequencing
    alone misses contiguous deletions of the OTX2 locus, so copy-number analysis
    is required. Even with both, only about a third of tested patients receive a
    molecular diagnosis.
  evidence:
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our 10 patients' cohort, no point mutation in the three tested genes was detected by Sanger sequencing, while array-CGH has allowed identifying a 107-kb deletion encompassing OTX2"
    explanation: >-
      Demonstrates that copy-number analysis is required in addition to
      sequencing.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a total of 32 patients benefited from genetic testing, with only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1."
    explanation: Quantifies the diagnostic yield of current molecular testing.
treatments:
- name: Ex-Utero Intrapartum Treatment (EXIT) Procedure
  description: >-
    Delivery on placental support so that a surgical airway can be established
    before the umbilical circulation is interrupted. Indicated for fetuses at
    high risk of immediate postnatal airway obstruction, which includes most
    prenatally diagnosed agnathia-otocephaly. Indication must be weighed
    carefully: EXIT is invasive, and coexisting pulmonary hypoplasia can still
    be fatal after a technically successful tracheostomy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ex-utero intrapartum treatment (EXIT) procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ex-utero intrapartum treatment (EXIT) procedure is basically indicated for a fetus with a high risk of airway obstruction immediately after birth; it is not indicated for all AOC cases but is chosen to treat cases until the airway can be evaluated to achieve a better prognosis."
    explanation: States the indication and its limits in this specific complex.
  - reference: PMID:37165610
    reference_title: "Isolated Agnathia-Otocephaly Complex Diagnosed Prenatally for Ex-Utero Intrapartum Treatment: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The evaluation methods of lung maturation are inconsistent, and the indication of the invasive EXIT procedure must be carefully considered."
    explanation: >-
      Documents the caveat that EXIT may not change outcome when pulmonary
      hypoplasia is present.
- name: Perinatal Tracheostomy
  description: >-
    A surgical airway is required in essentially every survivor, because the
    absent mandible and tongue make the upper airway unsecurable by
    conventional means.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tracheostomy
    term:
      id: MAXO:0000504
      label: tracheostomy
  target_mechanisms:
  - target: Neonatal Airway Obstruction and Aerodigestive Failure
    treatment_effect: BYPASSES
    description: >-
      A tracheostomy bypasses the non-functional upper airway rather than
      correcting the underlying arch defect.
    evidence:
    - reference: PMID:26517463
      reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All four underwent perinatal tracheostomy and gastrostomy-tube placement."
      explanation: >-
        Every patient in this series required a surgical airway, confirming that
        tracheostomy is the intervention that addresses the airway-obstruction
        node.
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four underwent perinatal tracheostomy and gastrostomy-tube placement."
    explanation: >-
      All patients in a 30-year single-institution series required a perinatal
      tracheostomy.
- name: Gastrostomy Tube Feeding
  description: >-
    Enteral access is mandatory because aglossia and absent oral musculature
    make deglutition impossible; this remains true into adulthood even after
    extensive mandibular reconstruction.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: MAXO:0001346
      label: gastrostomy
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four underwent perinatal tracheostomy and gastrostomy-tube placement."
    explanation: Documents universal gastrostomy placement in survivors.
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the lower-facial contour may be improved, and a stoma created, the lack of musculature make deglutition virtually impossible with current therapies."
    explanation: Explains why enteral access remains permanently necessary.
- name: Staged Mandibular Reconstruction with Bone Grafting
  description: >-
    Autologous reconstruction of the absent mandible, staged by age: costal
    (rib) grafting between roughly ages 3 and 8, and free vascularized fibula
    transfer thereafter. Graft resorption or extrusion means repeated grafting
    procedures are the norm. Neck tissue expansion restores the lower third of
    the face and works best in the teenage years.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: mandibular reconstruction with autologous bone graft
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mandibular reconstruction was most successful with rib between ages 3 and 8, after which time, free fibula transfer was utilized."
    explanation: Establishes the age-staged autologous reconstruction strategy.
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to some resoprtion or extrusion, all patients underwent repeated bone grafting procedures."
    explanation: >-
      Documents the principal limitation of the approach; the source typo
      ("resoprtion") is preserved for exact quotation.
  - reference: PMID:36217223
    reference_title: Free Fibula Flap for the Treatment of Agnathia in a 10-Year-Old With Severe Agnathia-Otocephaly Complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To the authors' knowledge, this represents the first application of virtual surgical planning for mandibular reconstruction with a vascularized free fibula flap in a pediatric patient with severe agnathia-otocephaly complex."
    explanation: >-
      Documents virtual surgical planning combined with a vascularized free
      fibula flap as the contemporary refinement of staged reconstruction.
- name: Mandibular Distraction Osteogenesis
  description: >-
    Gradual lengthening of a hypoplastic mandible with an external distraction
    device, in staged protocols that may be preceded by submental tissue
    expansion to enlarge the soft-tissue envelope and mitigate skeletal relapse.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: mandibular distraction osteogenesis
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:31634311
    reference_title: "Surgical Approach in a Patient With Agnathia-Otocephaly Complex: Three-Stage Mandibular Distraction Protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3-step mandibular distraction protocol the authors present in this study increased the length of the mandible by 20 mm, and nearly doubled the size of the patient's mandible from an initial volume of 3.62 cm to a post-operative volume of 6.89 cm."
    explanation: Quantifies the skeletal gain achieved by staged distraction.
- name: Oral Commissuroplasty
  description: >-
    Surgical widening of the microstomic oral aperture, typically performed
    before age three and repeated as needed to permit oral hygiene.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: oral commissuroplasty
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:26517463
    reference_title: "Severe Agnathia-Otocephaly Complex: Surgical Management and Longitudinal Follow-up From Birth Through Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commissuroplasties were typically performed before 3 years of age and repeated as necessary to allow for oral hygiene."
    explanation: Documents the timing and indication for commissuroplasty.
- name: Genetic Counseling
  description: >-
    Counselling should cover the predominantly de novo origin of the disorder,
    the incomplete OTX2 penetrance and possible requirement for a second hit,
    the possibility of germline mosaicism producing sibling recurrence despite
    apparently negative parental testing, and the low (about one third)
    diagnostic yield of current molecular testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  evidence:
  - reference: PMID:23444262
    reference_title: Recurrent agnathia-otocephaly caused by DNA replication slippage in PRRX1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of SNP genotyping coupled with recurrence of this novel mutation in this family are consistent with a paternally derived germline mosaicism rather than autosomal recessive inheritance as predicted by the family history."
    explanation: >-
      Germline mosaicism materially changes recurrence-risk counselling and must
      be addressed.
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only 34% (11/32) of patients having a mutation in one of the two known genes, OTX2 or PRRX1."
    explanation: >-
      Quantifies the diagnostic yield that must be communicated during
      counselling.
- name: Palliative and Supportive Care
  description: >-
    Because the complex is most often lethal, palliative and supportive care -
    including counselling about pregnancy options after prenatal diagnosis - is
    a central management pathway. In a first-trimester diagnostic series most
    families opted for termination of pregnancy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: palliative care
    term:
      id: MAXO:0000021
      label: palliative care
  evidence:
  - reference: PMID:32643087
    reference_title: Re-focusing on Agnathia-Otocephaly complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This severe anomaly of the first branchial arch is most often lethal."
    explanation: Establishes the lethal prognosis motivating a palliative pathway.
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "opted for termination of pregnancy"
    explanation: >-
      Reflects the pregnancy-management pathway most families in this series
      chose after first-trimester diagnosis.
notes: >-
  Long-term survival with a good quality of life is achievable in the milder
  ("nanognathia"/severe micrognathia) end of the spectrum: in a 30-year
  single-institution series of four patients with a mean 17-year follow-up, the
  eldest were in college and graduate education. Deglutition, however, remained
  impossible. No GeneReviews chapter exists for agnathia-otocephaly complex
  (PubMed searched 2026-07; no results for "otocephaly GeneReviews" or
  "agnathia otocephaly GeneReviews"). Deep research was performed with the Edison
  Scientific (falcon) provider; the report is in
  research/Agnathia-Otocephaly_Complex-deep-research-falcon.md and passed the NEC
  preflight against MONDO:0008740 (PRRX1, OMIM:202650, synonyms "otocephaly" and
  "agnathia-holoprosencephaly-situs inversus syndrome"). Every PMID, snippet, and
  ontology term suggested by the report was independently verified before use;
  falcon's claim that no incidence estimate exists was not adopted because two
  independent primary sources give a directly quotable 1 in 70,000 birth
  incidence. The single falcon artifact is a summary table, not an image, so no
  evidence item carries an `images:` reference.

      Lists microstomia among the defining features of the complex.
- category: Craniofacial
  name: Aglossia or Microglossia
  description: >-
    Absence (aglossia) or marked hypoplasia (microglossia) of the tongue,
    part of the oroglossal hypogenesis that accompanies mandibular
    agenesis. Impaired fetal swallowing from this and the small oral
    aperture is the mechanism of the associated polyhydramnios.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Aglossia
    term:
      id: HP:0012730
      label: Aglossia
  evidence:
  - reference: PMID:20849990
    reference_title: "Current perspectives on the etiology of agnathia-otocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by microstomia (small mouth), aglossia (absence of the
      tongue), agnathia (absence of the lower jaw) and abnormally positioned
      ears
    explanation: >-
      Establishes aglossia as a core component of the agnathia-otocephaly
      phenotype.
- category: Neurological
  name: Holoprosencephaly
  description: >-
    Failure of the prosencephalon to divide into paired cerebral
    hemispheres. Holoprosencephaly is the single most commonly associated
    anomaly in agnathia-otocephaly and marks the more extensive failure of
    rostral midline patterning; its presence substantially worsens
    prognosis and largely distinguishes lethal from potentially survivable
    ("isolated") disease.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Holoprosencephaly
    term:
      id: HP:0001360
      label: Holoprosencephaly
  evidence:
  - reference: PMID:17438667
    reference_title: "Otocephaly: report of five new cases and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Holoprosencephaly is the most commonly identified association, but
      skeletal, genitourinary, and cardiovascular anomalies, and situs
      inversus have been reported.
    explanation: >-
      Identifies holoprosencephaly as the most frequent associated anomaly
      in a comprehensive literature review of otocephaly.
  - reference: PMID:30171631
    reference_title: "First-Trimester Diagnosis of Agnathia-Otocephaly Complex: A Series of 4 Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four fetuses had holoprosencephaly.
    explanation: >-
      Quantifies holoprosencephaly in 4 of 7 analysed fetuses (57%),
      supporting a FREQUENT (30-79%) frequency band.
- category: Ophthalmologic
  name: Microphthalmia or Anophthalmia
  description: >-
    Uni- or bilateral small or absent eyes. Ocular involvement links
    agnathia-otocephaly to the broader OTX2-related anophthalmia and

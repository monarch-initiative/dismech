    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing detected a de novo SMAD3 missense variant in exon 6"
    explanation: Reports the de novo SMAD3 lesion in an agnathia-otocephaly fetus.
  - reference: PMID:32100971

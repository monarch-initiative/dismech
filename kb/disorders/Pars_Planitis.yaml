    snippet: "Retinal fluorescein angiography (FA) is beneficial to show the activity of retinal vascular inflammation in pars planitis. FA is usually performed for two reasons in pars planitis: To assess the presence of cystoid macular edema and to examine retinal vasculature for signs of perivasculitis and retinal neovascularization."
    explanation: Fluorescein angiography is useful for documenting peripheral retinal vasculitis and cystoid macular edema in pars planitis.

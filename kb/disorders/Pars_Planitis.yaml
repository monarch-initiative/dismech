      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The most common symptoms at presentation are floaters and blurred vision. Donaldson et al reported blurred vision in 74% and floaters in 61% of cases at the time of diagnosis."
      explanation: Documents floaters as a frequent presenting symptom in pars planitis (61% in Donaldson et al.).
  - target: Blurred Vision

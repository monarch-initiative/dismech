name: Pars Planitis
creation_date: '2026-01-08T01:24:35Z'
description: >-
  Pars planitis is a chronic intermediate uveitis defined by inflammation
  centered on the pars plana and peripheral retina, where characteristic
  "snowbank" exudates and vitreous "snowball" opacities form. It is an
  idiopathic, presumed autoimmune process in which T cell-driven inflammation of
  the peripheral uvea and adjacent vitreous causes vascular leakage and cellular
  infiltration. The resulting chronic inflammation predisposes to cystoid macular
  edema, the principal cause of vision loss, along with cataract, epiretinal
  membrane, and peripheral retinal neovascularization, and it shows an
  association with multiple sclerosis.
category: Complex
synonyms:
- Idiopathic intermediate uveitis
parents:
- Inflammatory Disorder
- Ophthalmic Disorder
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:26438050
      reference_title: "Immunopathogenic Background of Pars Planitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical and histopathological findings suggest an autoimmune etiology, most likely as a reaction to endogenous antigen of unknown source, with T cells predominant in both vitreous and pars plana infiltrations."
      explanation: Establishes pars planitis as a T-cell predominant autoimmune inflammatory disorder.
inheritance:
- name: Multifactorial Susceptibility
  inheritance_term:
    preferred_term: Multifactorial inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >-
    Pars planitis arises sporadically with non-Mendelian multifactorial immunogenetic
    susceptibility involving HLA-DR2, HLA-DR15, HLA-B51, and HLA-DRB1*0802 haplotypes
    and other immune genes.
  evidence:
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Associations between pars planitis and HLA-DR2, -DR15, -B51 and -DRB1*0802 haplotypes have been described suggesting an immunogenetic predisposition."
    explanation: Documents HLA haplotype associations supporting immunogenetic susceptibility in pars planitis.
  - reference: PMID:26438050
    reference_title: "Immunopathogenic Background of Pars Planitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Snowbanks are formed as an effect of post inflammatory glial proliferation of fibrous astrocytes. There is also a genetic predisposition for pars planitis by human leukocyte antigen and several other genes."
    explanation: Confirms multifactorial genetic predisposition involving HLA and other genes in pars planitis.
prevalence:
- population: France and United States general population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_denominator: POPULATION_PER_YEAR
  rate_low: 1.4
  rate_high: 2.0
  notes: >-
    Annual incidence in population-based studies from France and the United States
    is 1.4 to 2.0 cases per 100,000 population per year. Within pediatric uveitis
    referral cohorts, pars planitis accounts for 5% to 26.7% of cases.
  evidence:
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incidence and prevalence of the disease show great variability according to geographic, genetic and referral patterns of the patients. Its yearly incidence has been reported to be 1.4 - 2 cases per 100,000 population in studies conducted in France and United States (US)."
    explanation: Reports annual incidence of 1.4 to 2 cases per 100,000 population per year in France and the United States.
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pars planitis is an idiopathic chronic intermediate uveitis which predominantly affects children and adolescents, and accounts for 5-26.7% of pediatric uveitis."
    explanation: Establishes the proportion of pediatric uveitis cases attributable to pars planitis across clinical series.
progression:
- phase: Onset
  age_range: Childhood to young adulthood (mean 6-10 years in pediatric series; 22.6 years in population-based series)
  notes: >-
    Predominantly affects children and adolescents, with occurrence highest at
    6 to 10 years of age and 85% of patients in pediatric referral series diagnosed
    at age 14 years or younger (mean symptom onset 6 years), whereas a 20-year
    population-based study reported a higher mean age at diagnosis of 22.6 years.
  evidence:
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rosenberg et al reported that the occurrence of pars planitis was highest in children 6 to 10 years of age."
    explanation: Documents the 6-to-10-year childhood peak occurrence window in pediatric series.
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Arellanes-Garcia et al showed that 85% of patients were 14 years of age or younger at diagnosis, and that the mean age when symptoms began, was 6 years."
    explanation: Defines the childhood and adolescent onset distribution in referral series.
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, Donaldson et al reported a higher mean age of 22.6 years in a 20-year population-based study on pars planitis."
    explanation: Captures the higher mean age at diagnosis observed in population-based ascertainment.
- phase: Chronic Relapsing or Smoldering Course
  notes: Approximately 10% have a self-limited course, 59% have a prolonged course with exacerbations, and 31% have a chronic smoldering course; cystoid macular edema develops at a mean interval of 5.7 years and epiretinal membrane at 7.9 years after onset.
  evidence:
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Smith et al reported that 10% of patients had a self-limited course, whereas 59% had a prolonged course with exacerbations and 31% had a chronic smoldering course with few episodes of exacerbations."
    explanation: Characterizes the natural history distribution across self-limited, relapsing, and chronic smoldering disease trajectories.
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is related to disease chronicity, with a reported interval of 5.7 years between disease onset and the development of cystoid macular edema."
    explanation: Quantifies the mean 5.7-year interval from disease onset to cystoid macular edema development.
  - reference: PMID:27051493
    reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Epiretinal membrane formation was found to be directly related to disease chronicity, and the mean interval between disease onset and epiretinal membrane formation was 7.9 years."
    explanation: Quantifies the mean 7.9-year interval from disease onset to epiretinal membrane formation.
has_subtypes:
- name: Idiopathic Pars Planitis
  description: Chronic intermediate uveitis with snowballs and snowbanks in the absence of an identifiable underlying systemic disease or infection.
  evidence:
  - reference: PMID:39360991
    reference_title: "Epidemiology of Intermediate Uveitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pars planitis is the term used for idiopathic intermediate uveitis that presents with snowballs and snowbanks."
    explanation: This represents the classic form of pars planitis where no underlying cause can be identified.
pathophysiology:
- name: Autoimmune T-Cell Predominant Inflammation
  description: Pars planitis shows a T cell-driven autoimmune response within the vitreous and pars plana.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: Adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
  locations:
  - preferred_term: Vitreous humor
    term:
      id: UBERON:0001797
      label: vitreous humor
  - preferred_term: Pars plana
    term:
      id: UBERON:0001775
      label: ciliary body
  downstream:
  - target: Vitreous Cell Infiltration
    causal_link_type: DIRECT
    description: T-cell predominant autoimmune activation drives cellular infiltration into the vitreous cavity.
    evidence:
    - reference: PMID:26438050
      reference_title: "Immunopathogenic Background of Pars Planitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical and histopathological findings suggest an autoimmune etiology, most likely as a reaction to endogenous antigen of unknown source, with T cells predominant in both vitreous and pars plana infiltrations."
      explanation: Demonstrates that T-cell predominant autoimmune inflammation directly populates the vitreous infiltrates.
  - target: Snowbank Formation at Pars Plana
    description: Chronic T-cell inflammation at the pars plana leads to post-inflammatory glial proliferation of fibrous astrocytes forming snowbanks.
    evidence:
    - reference: PMID:26438050
      reference_title: "Immunopathogenic Background of Pars Planitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinical and histopathological findings suggest an autoimmune etiology, most likely as a reaction to endogenous antigen of unknown source, with T cells predominant in both vitreous and pars plana infiltrations. T cells subsets play an important role as a memory-effector peripheral cell. Snowbanks are formed as an effect of post inflammatory glial proliferation of fibrous astrocytes."
      explanation: Links T-cell predominant pars plana inflammation to post-inflammatory glial proliferation that forms snowbanks.
  - target: Peripheral Retinal Vasculitis and Sheathing
    description: Intraocular inflammation in pars planitis is frequently accompanied by peripheral retinal vasculitis and venular sheathing.
    evidence:
    - reference: PMID:27051493
      reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Diffuse vitreous cells, haze, snowballs and snowbanks are typical findings of pars planitis. Peripheral retinal vasculitis, optic disc edema and anterior segment inflammation are other well-known findings."
      explanation: Documents peripheral retinal vasculitis as a characteristic inflammatory manifestation of pars planitis alongside vitreous and pars plana inflammation.
  - target: Optic Disc Swelling
    description: Intraocular inflammation in pars planitis frequently produces angiographic or clinical optic disc edema.
    evidence:
    - reference: PMID:27051493
      reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Optic disc edema is also common, found in around 70% of the cases when fluorescein angiography is performed."
      explanation: Documents optic disc edema as a frequent inflammatory manifestation in pars planitis.
  - target: Cataract
    description: Chronic intraocular inflammation in pars planitis frequently leads to complicated cataract formation.
    evidence:
    - reference: PMID:27051493
      reference_title: "Pars Planitis: Epidemiology, Clinical Characteristics, Management and Visual Prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the majority of studies, cataracts were the most frequent reported complication of pars planitis occurring at high rates ranging from 30.4% to 47.5%."
      explanation: Establishes cataract as the most frequent ocular complication of chronic pars planitis across clinical series.
  - target: Retinal Pigmentation Abnormality (Bone Spicules)
    description: Severe or prolonged intraocular inflammation in pars planitis can rarely be followed by progressive intraretinal bone-spicule pigmentation mimicking retinitis pigmentosa.
    evidence:
    - reference: PMID:30200907
      reference_title: "Progression of retinal pigmentation mimicking unilateral retinitis pigmentosa after bilateral pars planitis: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He was diagnosed with bilateral pars planitis. Progressive, intraretinal bone crepuscule pigmentation developed in his left retina during the following three months. An electroretinogram showed subnormal response only in the left eye, suggesting the diagnosis of unilateral pseudoRP."
      explanation: Demonstrates that bilateral pars planitis can be followed by secondary intraretinal bone-spicule pigmentation.
  evidence:
  - reference: PMID:26438050
    reference_title: "Immunopathogenic Background of Pars Planitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical and histopathological findings suggest an autoimmune etiology, most likely as a reaction to endogenous antigen of unknown source, with T cells predominant in both vitreous and pars plana infiltrations."
    explanation: Shows T-cell predominance in ocular infiltrates supporting autoimmune pathogenesis.
  - reference: PMID:37976519
    reference_title: "Pediatric Pars Planitis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pars planitis refers to the idiopathic subset of intermediate uveitis in which there is vitritis along with snowball or snowbank formation occurring in the absence of an associated infection or systemic disease. It is thought to be a T-cell mediated disease with a genetic predisposition."
    explanation: Confirms T-cell mediated immunopathogenesis and genetic susceptibility in pars planitis.

    snippet: "Chronic inflammation in pars planitis frequently causes cystoid macular edema. OCT is valuable in detecting macular edema and its sequelae such as cystoid changes, epiretinal membranes, macular hole and atrophy."
    explanation: OCT is the gold standard for detecting and monitoring cystoid macular edema, the most important complication of pars planitis.

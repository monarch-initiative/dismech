- name: Failed Chondrogenic Condensation and Joint Specification in the Distal Limb
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    GDF5 is expressed at sites of skeletal morphogenesis, particularly in the
    interzones that prefigure joints and in the condensations that prefigure
    individual skeletal elements. Without GDF5-BMPR1B signalling these
    condensations fail to form, segment, or separate correctly, which is why the
    phenotype is one of missing, fused and malformed elements rather than of
    uniformly short but well-formed bones.

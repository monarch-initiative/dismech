diagnosis:
- name: Radiographic Pattern Recognition
  description: >-
    The combination of severe distal-predominant limb malformation with a
    normal axial and craniofacial skeleton, in a child of consanguineous
    parents, is the pattern that directs testing to the GDF5/BMPR1B spectrum
    rather than to a generalised chondrodysplasia.
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic imaging revealed features typical of Grebe syndrome: severe
      shortening of the forearms with an acromesomelic pattern following a
      proximodistal gradient
    explanation: Radiographs established the clinical diagnosis before molecular confirmation in this case.
- name: Prenatal Sonographic Diagnosis
  description: >-
    The limb phenotype is severe enough to be recognised on second-trimester
    ultrasound, with the globular fingers and toes as the distinguishing
    feature. This matters for counselling in an at-risk sibship, and the
    prognostic point that goes with it is that the condition is not lethal and
    intelligence is normal.
  evidence:
  - reference: PMID:27677752
    reference_title: Grebe dysplasia - prenatal diagnosis based on rendered 3-D ultrasound images of fetal limbs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rendered 3-D ultrasound images of the fetal limbs, particularly of the
      characteristic tiny and globular-looking fingers and toes, were
      instrumental in accurately characterizing the phenotype prenatally.
    explanation: Documents prenatal recognition of the phenotype and the finding that carried the diagnosis.
  - reference: PMID:27677752
    reference_title: Grebe dysplasia - prenatal diagnosis based on rendered 3-D ultrasound images of fetal limbs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the severe skeletal deformities, the condition is not lethal and
      surviving individuals can have normal intelligence.
    explanation: >-
      The prognostic statement that accompanies a prenatal diagnosis and is
      central to counselling.
- name: Molecular Confirmation of Biallelic GDF5 Variants
  description: >-
    Sequencing GDF5 confirms the diagnosis and, because the GDF5 and BMPR1B
    phenotypes overlap, a negative GDF5 result should be followed by BMPR1B
    sequencing rather than closing the workup.
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genotype-phenotype correlation allowed not only confirmation of the
      clinical diagnosis but also appropriate genetic counselling to be offered
      to this family.
    explanation: Molecular confirmation is what converts the radiographic impression into a counselled diagnosis.
  - reference: PMID:39441036
    reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with du Pan acromesomelic dysplasia and polydactyly who do not

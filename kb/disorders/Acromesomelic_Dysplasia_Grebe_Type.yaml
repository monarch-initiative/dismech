  status: CANONICAL
  description: >-
    Truncating GDF5 alleles remove the ligand, GDF5-BMPR1B signalling falls to
    near zero in the distal limb, and the condensations that build the digits
    fail. This accounts for the families in which the causative allele is a
    frameshift and the heterozygous parents are unaffected, and it is the model
    that carries over directly to the BMPR1B disorders, where the receptor
    rather than the ligand is removed.
  evidence:
  - reference: PMID:12124730
    reference_title: Frameshift mutation in the cartilage-derived morphogenetic protein 1 (CDMP1) gene and severe acromesomelic chondrodysplasia resembling Grebe-type chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The truncated CDMP1 protein in these subjects is predicted to cause a
      total loss of its signaling function.
    explanation: A frameshift allele causing severe Grebe-type disease with unaffected carriers fits simple ligand loss.
- hypothesis_group_id: dominant_negative_bmp_sequestration
  hypothesis_label: Dominant-Negative BMP Sequestration Model
  status: ALTERNATIVE
  description: >-
    The archetypal Grebe missense allele does more than remove GDF5. The mutant
    protein is retained inside the cell and, because BMP family members
    dimerise, drags partner BMPs out of the secretory pathway with it, so the
    lesion is a broader withdrawal of BMP signalling than a GDF5 null produces.
    The clinical prediction that distinguishes the two models is carrier status:
    a null allele should leave heterozygotes unaffected, whereas a sequestering
    allele should give them a brachydactyly, and heterozygous brachydactyly is
    exactly what the reported families show. What has never been done is the
    comparison that would settle it, matching homozygous phenotype severity
    between a sequestering allele and a true null.

    A refinement worth noting is that the sequestration may not be a simple
    property of the mutant protein. For a prodomain GDF5 variant, inhibition of
    wild-type GDF5 secretion happened only when the latent TGF-beta binding
    proteins LTBP1 or LTBP2 were co-expressed. If the effect depends on the
    local abundance of such co-factors, dominant-negative penetrance is partly a
    property of the tissue environment rather than of the allele alone, which
    would be one way to explain why carriers of a single allele in one pedigree
    range from unaffected to frankly brachydactylous.
  evidence:
  - reference: PMID:9288098
    reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It produces a dominant negative effect by preventing the secretion of
      other, related BMP family members. We present evidence that this may occur
      through the formation of heterodimers.
    explanation: Establishes the sequestration mechanism that makes this allele more than a null.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with severe GTC associated with homozygosity, and with a wide phenotypic
      variability among heterozygous carriers, ranging from unaffected
      non-penetrant carriers, to classical BDC and to novel unclassified types
      of brachydactylies
    explanation: >-
      Carrier phenotypes vary within a single family carrying one frameshift
      allele, which complicates using carrier status alone to separate the two
      models.
  - reference: PMID:23812741
    reference_title: "Characterization of a novel missense mutation in the prodomain of GDF5, which underlies brachydactyly type C and mild Grebe type chondrodysplasia in a large Pakistani family."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we demonstrated that secretion of Wt-GDF5 was inhibited by the
      Mut-GDF5, but only when LTBP (LTBP1 or LTBP2) was co-expressed.
    explanation: >-
      Shows that dominant-negative inhibition of wild-type GDF5 secretion can be
      conditional on a co-factor. Support is partial because the allele tested is
      a prodomain variant, not the mature-domain cysteine substitution this group
      is built on.
  - reference: PMID:23812741
    reference_title: "Characterization of a novel missense mutation in the prodomain of GDF5, which underlies brachydactyly type C and mild Grebe type chondrodysplasia in a large Pakistani family."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      we suggest a novel model, where the dosage of secretory co-factors or
      stabilizing proteins like LTBP1 and LTBP2 in the microenvironment may
      affect the extent of GDF5 secretion and thereby function as modifiers in
      phenotypes caused by GDF5 mutations
    explanation: >-
      States the co-factor-modifier model, a candidate explanation for the
      carrier variability this entry records, offered by its authors as a
      proposal rather than a demonstrated mechanism.
- hypothesis_group_id: processing_failure_model
  hypothesis_label: Precursor-Processing Failure Model
  status: EMERGING
  description: >-
    A third allele class acts before either of the above: p.Arg377Trp sits in
    the RRKRR recognition motif at the proteolytic processing site, so the
    lesion is failure to mature the GDF5 precursor into active ligand rather
    than failure of the mature protein to fold, be secreted, or bind. The
    functional consequence has been inferred from the motif rather than
    measured, and no processing assay has been run on this allele.
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Arg377Trp mutation is located within the recognition motif at the
      processing site of GDF5 where the sequence RRKRR changes to WRKRR.
    explanation: >-
      Localises the allele to the processing motif. Support is partial because
      the pathogenic effect was established by in silico and structural
      prediction rather than by a processing assay.
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico and structural analyses predicted the p.Arg377Trp amino acid
      change to be pathogenic.
    explanation: Records that the evidence for this allele class is predictive rather than experimental.
  notes: >-
    The three groups describe different allele classes rather than competing
    accounts of one allele, and a single entry can only be explained by one of
    them. They are curated together because the clinical phenotype does not
    distinguish them, so the mechanism operating in any given family is read
    from the variant rather than from the radiographs.

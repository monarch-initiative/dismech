    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both genes encode members of the same pathway: The GDF5 ligand belongs to
      the bone morphogenetic protein (BMP) family and binds with a high affinity
      to the BMP receptor BMPR1B
    explanation: Establishes the ligand-receptor pair that this node represents.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic severity gradient of the clinically and radiologically
      related acromesomelic chondrodysplasia spectrum of skeletal disorders may
      be due to the extent of functional impairment of the ligand-receptor pair
      GDF5-BMPR1B.
    explanation: >-
      States the dose-dependent relationship between residual GDF5-BMPR1B

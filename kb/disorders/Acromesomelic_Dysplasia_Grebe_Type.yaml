      sequencing
    explanation: Supports escalating to BMPR1B when GDF5 sequencing is negative in an overlapping phenotype.
treatments:
- name: Genetic Counseling
  description: >-
    Counselling for an autosomal recessive disorder with a one-in-four
    recurrence risk in an affected sibship. It is not routine here: with the
    dominant-negative mature-domain alleles, heterozygous carriers are not
    reliably unaffected, and within a single pedigree carrier phenotypes have
    ranged from normal through classical brachydactyly type C to unclassified
    brachydactylies. Molecular confirmation of the family's allele is what makes
    the counselling accurate.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genotype-phenotype correlation allowed not only confirmation of the
      clinical diagnosis but also appropriate genetic counselling to be offered
      to this family.
    explanation: Documents genetic counselling as the management step that molecular confirmation enables.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a wide phenotypic variability among heterozygous carriers, ranging
      from unaffected non-penetrant carriers, to classical BDC and to novel
      unclassified types of brachydactylies
    explanation: >-
      Carrier phenotypes vary within one pedigree, which is what makes
      counselling for this disorder harder than a standard recessive
      recurrence-risk conversation.

name: Acromesomelic Dysplasia Grebe Type
synonyms:
- Grebe dysplasia
- Grebe chondrodysplasia
- Grebe dysplasia, GDF5-related
- Acromesomelic dysplasia 2A
- AMDG
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Grebe-type acromesomelic dysplasia is a severe autosomal recessive limb
  dysplasia caused by biallelic variants in GDF5 (formerly CDMP1), which encodes
  growth/differentiation factor 5, a bone morphogenetic protein family ligand
  that binds the type I BMP receptor BMPR1B with high affinity. Limb malformation
  follows a strict proximodistal severity gradient: the hands and feet are
  devastated while the femur and humerus are comparatively preserved, and the
  axial and craniofacial skeleton is spared. Fingers and toes are rudimentary or
  knob-like, with absent, fused, or malformed phalanges, metacarpals,
  metatarsals, carpals, and tarsals, and postaxial polydactyly occurs in some
  families. Two distinct molecular routes converge on this phenotype. Truncating
  alleles cause a simple loss of GDF5 signalling, whereas the classic
  mature-domain missense allele produces a protein that is retained inside the
  cell and, by heterodimerising with other BMP family members, blocks their
  secretion as well, a dominant-negative effect that explains the brachydactyly
  seen in heterozygous carriers. The Hunter-Thompson type, curated here as a
  subtype, is the allelic form in which the lower limbs and large joints bear the
  brunt of the disease; the 2023 ISDS nosology groups both under GDF5-related
  Grebe dysplasia.
disease_term:
  preferred_term: acromesomelic dysplasia, Grebe type
  term:
    id: MONDO:0008703
    label: acromesomelic dysplasia 2A
parents:
- Skeletal Dysplasia
has_subtypes:
- name: Grebe
  display_name: Grebe type (OMIM 200700)
  description: >-
    The severe classical form, with marked micromelia and a proximodistal
    severity gradient in which the distal parts are the most affected. It
    carries no `subtype_term` deliberately: this entry's own `disease_term` is
    MONDO:0008703, the Grebe concept, so binding the same class again here would
    make the disease a subtype of itself and duplicate the identifier on export.
    The subtype is listed as a named clinical presentation so that it and
    Hunter-Thompson can be referred to symmetrically.
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, Grebe type is a very rare skeletal dysplasia
      characterized by severe dwarfism with marked micromelia and deformation of
      the upper and lower limbs, with a proximodistal gradient of severity.
    explanation: Defines the classical Grebe presentation and its proximodistal gradient.
- name: Hunter-Thompson
  display_name: Hunter-Thompson type (OMIM 201250)
  subtype_term:
    preferred_term: acromesomelic dysplasia, Hunter-Thompson type
    term:
      id: MONDO:0008717
      label: acromesomelic dysplasia 2C, Hunter-Thompson type
  description: >-
    The allelic form in which the lower limbs are more severely affected than the
    upper, phalanges tend to be square, and joint dislocation is prominent. The
    2023 ISDS nosology folds it into GDF5-related Grebe dysplasia rather than
    listing it as a separate group-16 entity.
  evidence:
  - reference: PMID:8589725
    reference_title: A human chondrodysplasia due to a mutation in a TGF-beta superfamily member.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we now show that a mutation in hCDMP-1 is associated with a recessive human
      chondrodysplasia (acromesomelic chondrodysplasia, Hunter-Thompson type
    explanation: Establishes GDF5/CDMP1 as the cause of the Hunter-Thompson type.
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In AMDH the lower limbs are more severely affected, phalanges tend to
      square and there may be a single phalangeal bone in the fifth digit. Ankle
      dislocation is common and radial head dislocation may be present
    explanation: >-
      Supplies the radiographic pattern that distinguishes the Hunter-Thompson
      subtype. Graded OTHER because it is a differential-diagnosis summary in a
      paper about NPR2-related disease.
  - reference: PMID:26870132
    reference_title: "Recurrent mutation in CDMP1 in a family with Grebe chondrodysplasia: broadening the phenotypic manifestation of syndrome in Pakistani population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Hind-limbs were more severely affected than fore-limbs.
    explanation: >-
      A molecularly confirmed GDF5 family shows the lower-limb predominance that
      the Hunter-Thompson description emphasises, which is one reason the 2023
      nosology folds the two together rather than separating them.
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias"; listed as "Grebe
      dysplasia, GDF5-related", which the revision treats as covering both the
      Grebe (OMIM 200700) and Hunter-Thompson (OMIM 201250) types. This entry
      therefore carries the single group value even though it lumps two OMIM
      entities. The 2019 revision (PMID:31633310) placed Grebe dysplasia in the
      same group 16.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To date, four disease genes and seven distinct ACD subtypes with varying
        severity are recognised according to the 2023 revision of the nosology
        and classification of genetic skeletal disorders
      explanation: >-
        This is the sentence that ties the enumeration below to the 2023 ISDS
        nosology revision. It is quoted separately because the enumeration
        itself names diseases and OMIM numbers without repeating the nosology
        attribution, so on its own it would not support a group assignment.
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pathogenic GDF5 variants underlie the severe Grebe dysplasia (including
        Grebe (OMIM #200700) and Hunter-Thompson (OMIM #201250) types) and the
        milder du Pan dysplasia (OMIM #228900)
      explanation: >-
        A 2024 report enumerating the acromesomelic chondrodysplasia types of the
        2023 nosology revision states that the GDF5-related Grebe entity covers
        both the Grebe and Hunter-Thompson types.
prevalence:
- population: Consanguineous kindreds, predominantly South Asian, Middle Eastern and Brazilian
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. Published Grebe dysplasia is
    overwhelmingly reported as large consanguineous pedigrees, and the entity is
    characterised in the literature as very rare.
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, Grebe type is a very rare skeletal dysplasia
      characterized by severe dwarfism with marked micromelia
    explanation: Characterises the disorder as very rare.
  - reference: PMID:12124730
    reference_title: Frameshift mutation in the cartilage-derived morphogenetic protein 1 (CDMP1) gene and severe acromesomelic chondrodysplasia resembling Grebe-type chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a family with seven males and six females who inherited the
      disorder in an autosomal recessive fashion.
    explanation: Illustrates that the published case base consists of extended consanguineous families.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The full Grebe phenotype requires biallelic GDF5 variants. Heterozygous
    carriers are not unaffected in the general sense: with the dominant-negative
    mature-domain alleles they may show brachydactyly type C or an unclassified
    brachydactyly, and non-penetrant carriers also occur in the same pedigree.
  evidence:
  - reference: PMID:9288098
    reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chondrodysplasia Grebe type (CGT) is an autosomal recessive disorder
      characterized by severe limb shortening and dysmorphogenesis.
    explanation: States the recessive inheritance of the full Grebe phenotype.
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with severe GTC associated with homozygosity, and with a wide phenotypic
      variability among heterozygous carriers, ranging from unaffected
      non-penetrant carriers, to classical BDC and to novel unclassified types of
      brachydactylies
    explanation: >-
      A six-generation pedigree documents the dosage relationship between
      homozygous Grebe disease and heterozygous brachydactyly.
genetic:
- name: Biallelic GDF5 Variants
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported causative alleles include frameshift and other truncating variants
    in the mature region, and missense variants in the mature active domain.
    Missense alleles at the conserved cysteines or at the RRKRR processing
    recognition motif behave differently from truncating alleles: they yield a
    retained, dominant-negative protein rather than simple absence.
  evidence:
  - reference: PMID:12124730
    reference_title: Frameshift mutation in the cartilage-derived morphogenetic protein 1 (CDMP1) gene and severe acromesomelic chondrodysplasia resembling Grebe-type chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In affected subjects, an insertion of a C at nucleotide 297 of the coding
      sequence was discovered. This insertion produced a shift in the reading
      frame at amino acid residue 99, causing premature termination of the
      polypeptide six amino acids downstream.
    explanation: Documents a truncating GDF5 allele causing severe Grebe-type disease.
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Arg377Trp mutation is located within the recognition motif at the
      processing site of GDF5 where the sequence RRKRR changes to WRKRR.
    explanation: Documents a missense allele disrupting proteolytic processing of the GDF5 precursor.
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 34 mutations described in the CDMP1 gene, four different missense
      mutations have been associated with Grebe syndrome.
    explanation: Summarises the GDF5 allelic spectrum and the missense subset tied to the Grebe phenotype.
pathophysiology:
- name: Biallelic GDF5 Mature-Domain Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants on both GDF5 alleles disrupt the mature, secreted domain
    of the ligand. Truncating variants abolish the protein, while missense
    variants in the mature active domain or at the RRKRR processing motif yield a
    full-length but functionally defective product.
  genes:
  - preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  biological_processes:
  - preferred_term: Proteolytic maturation of the GDF5 precursor
    term:
      id: GO:0016485
      label: protein processing
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26275437
    reference_title: "Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation affecting the recognition motif at the processing site of GDF5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in the mature domain of GDF5 result in severe limb
      malformations such as the Grebe type or the Hunter-Thompson type of
      acromesomelic chondrodysplasia.
    explanation: Localises the causative alleles to the mature domain and ties them to both phenotypes curated here.
  downstream:
  - target: Failed Secretion of GDF5 and Dominant-Negative Sequestration of BMP Partners
    causal_link_type: DIRECT
    hypothesis_groups:
    - dominant_negative_bmp_sequestration
    - processing_failure_model
    description: >-
      The classic Grebe missense allele directly produces an unsecreted,
      inactive protein that also traps other BMP family members.
    evidence:
    - reference: PMID:9288098
      reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrate that the mutation results in a protein that is not
        secreted and is inactive in vitro.
      explanation: Functional assays show the mutant protein is neither secreted nor active.
  - target: Loss of GDF5-BMPR1B Signaling in the Developing Limb
    causal_link_type: DIRECT
    hypothesis_groups:
    - gdf5_null_loss_model
    description: >-
      Truncating alleles remove the ligand outright, directly eliminating
      GDF5 input to its receptor without any dominant-negative intermediate.
    evidence:
    - reference: PMID:12124730
      reference_title: Frameshift mutation in the cartilage-derived morphogenetic protein 1 (CDMP1) gene and severe acromesomelic chondrodysplasia resembling Grebe-type chondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The truncated CDMP1 protein in these subjects is predicted to cause a
        total loss of its signaling function.
      explanation: A frameshift allele is inferred to abolish GDF5 signalling directly.
- name: Failed Secretion of GDF5 and Dominant-Negative Sequestration of BMP Partners
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    The archetypal Grebe allele substitutes a tyrosine for the first of seven
    conserved cysteines of the mature active domain. The resulting protein is
    retained inside the cell, and because BMP family members dimerise, it drags
    related BMPs out of the secretory pathway with it. This is why the Grebe
    allele is more than a null: heterozygotes carry a brachydactyly phenotype
    that a simple loss-of-function allele would not produce.
  molecular_functions:
  - preferred_term: BMP receptor binding
    term:
      id: GO:0070700
      label: BMP receptor binding
    modifier: DECREASED
  - preferred_term: Heterodimerization with partner BMP ligands
    term:
      id: GO:0046982
      label: protein heterodimerization activity
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: Protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:9288098
    reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation substitutes a tyrosine for the first of seven highly
      conserved cysteine residues in the mature active domain of the protein.
    explanation: Identifies the specific residue change behind the dominant-negative Grebe allele.
  - reference: PMID:9288098
    reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It produces a dominant negative effect by preventing the secretion of
      other, related BMP family members. We present evidence that this may occur
      through the formation of heterodimers.
    explanation: Establishes heterodimer-mediated sequestration as the dominant-negative mechanism.
  downstream:
  - target: Loss of GDF5-BMPR1B Signaling in the Developing Limb
    causal_link_type: DIRECT
    description: >-
      Withdrawal of GDF5 and of its co-sequestered BMP partners from the
      extracellular space directly deprives BMPR1B of ligand.
    evidence:
    - reference: PMID:9288098
      reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        It produces a dominant negative effect by preventing the secretion of
        other, related BMP family members.
      explanation: Loss of secreted BMP ligands is the direct consequence for receptor signalling.
- name: Loss of GDF5-BMPR1B Signaling in the Developing Limb
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    GDF5 is a BMP-family ligand with high affinity for the type I receptor
    BMPR1B. This node is the shared central effector of the whole acromesomelic
    GDF5/BMPR1B spectrum: disabling the ligand and disabling the receptor produce
    overlapping disease, and the severity of the resulting phenotype tracks the
    degree of functional impairment of the ligand-receptor pair.

  description: >-
    The mild end of the same GDF5/BMPR1B spectrum, with fibular hypoplasia and
    complex brachydactyly but preserved stature and largely intact long bones.
  distinguishing_features:
  - Stature and the long bones are preserved in du Pan syndrome, whereas Grebe type causes severe dwarfism with absent or fused distal elements.
  - >-
      The distinction reflects residual signalling, with hypomorphic alleles
      giving du Pan and severe loss-of-function alleles giving Grebe.

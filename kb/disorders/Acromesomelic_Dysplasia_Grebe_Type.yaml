- name: Proximodistally Graded Appendicular Skeletal Malformation
  role: consequence
  biological_scale: TISSUE
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  description: >-
    The malformation is graded along the proximodistal axis and is repeated in
    both fore- and hindlimb autopods, the hallmark of a lesion in a limb
    patterning signal that is serially reused. Distal elements are the most
    severely affected, the axial and craniofacial skeleton is spared, and the
    graded pattern is the feature that separates this spectrum from generalised
    chondrodysplasias.

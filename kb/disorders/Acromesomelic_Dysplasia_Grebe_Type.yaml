- name: Brachydactyly Type C
  description: >-
    The heterozygous manifestation of GDF5 alleles in the same families. It is a
    differential in the sense that a carrier relative of a Grebe proband may
    present with isolated brachydactyly rather than being unaffected.
  distinguishing_features:
  - Brachydactyly type C arises in heterozygous carriers; the full Grebe phenotype requires homozygosity.
  evidence:
  - reference: PMID:33872773
    reference_title: "A GDF5 frameshift mutation segregating with Grebe type chondrodysplasia and brachydactyly type C+ in a 6 generations family: Clinical report and mini review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The family confirmed that both GTC and BDC are part of the GDF5 mutational
      spectrum, with severe GTC associated with homozygosity
    explanation: Establishes that both phenotypes arise from the same allele at different dosage.
discussions:
- discussion_id: no_disease_specific_management_literature
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    What supportive, orthopaedic and rehabilitative management actually benefits
    Grebe dysplasia?
  rationale: >-
    The treatments section is deliberately limited to genetic counselling, which
    is the one intervention the published literature for this disorder actually
    documents. Reconstructive and orthopaedic surgery, prosthetics, and
    physiotherapy are all plausible for a limb malformation of this severity and
    are presumably used in practice, but a search of the indexed literature
    returned no disease-specific management report for Grebe dysplasia to cite. Curating
    them from general skeletal-dysplasia practice would be inference, not
    evidence, so the gap is recorded rather than filled. A case series reporting
    functional outcomes after surgical or prosthetic management would close it.
- discussion_id: grebe_hunter_thompson_lumping
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the Grebe and Hunter-Thompson types reflect distinct GDF5 allele classes,
    or are they two descriptions of one continuum?
  rationale: >-
    The 2023 ISDS nosology folds Hunter-Thompson into GDF5-related Grebe
    dysplasia, and OMIM and MONDO keep them as separate entities. The published
    radiographic distinction is real (lower-limb predominance and joint
    dislocation in Hunter-Thompson), but no study has systematically related
    those features to allele class or residual signalling. This entry curates
    them as subtypes of one disease pending such a study.
  attaches_to:
  - has_subtypes#Grebe
  - has_subtypes#Hunter-Thompson
- discussion_id: dominant_negative_vs_null_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the dominant-negative Grebe missense allele produce a more severe
    homozygous phenotype than a GDF5 null allele?
  rationale: >-
    The mature-domain missense allele sequesters other BMP family members and so
    should remove more BMP signalling than a simple null, which predicts a more
    severe homozygous phenotype. Reported truncating alleles nonetheless produce
    severe Grebe-like disease, and no series has compared the two allele classes
    with matched phenotyping. Resolving this bears on genetic counselling for
    carriers, who are affected only with the dominant-negative alleles.
  attaches_to:
  - pathophysiology#Failed Secretion of GDF5 and Dominant-Negative Sequestration of BMP Partners
  - mechanistic_hypotheses#gdf5_null_loss_model
  - mechanistic_hypotheses#dominant_negative_bmp_sequestration
notes: >-
  Curated as part of a review of ISDS 2023 nosology group 16 (acromesomelic
  dysplasias). Hunter-Thompson type is curated here as a subtype rather than as
  its own entry because the 2023 revision treats "Grebe dysplasia, GDF5-related"
  as covering both OMIM 200700 and OMIM 201250; the separate MONDO term is
  retained on the subtype so the concept remains resolvable. No Orphanet
  structured record was cited: the pinned Orphadata snapshot in
  data/orphadata/MANIFEST.yaml no longer matches upstream, and re-pinning it
  would rewrite every ORPHA cache file in the repository.

    snippet: "We identified missense and nonsense mutations in the BMP4 gene in 1 of 30 cases of microform clefts, 2 of 87 cases with subepithelial defects in the orbicularis oris muscle (OOM), 5 of 968 cases of overt CL/P, and 0 of 529 controls."
    explanation: Defines the BMP4-associated cleft lip spectrum (OFC11) and its low per-case yield.
- name: OFC15
  display_name: Orofacial cleft 15 (DLX4-related)
  subtype_term:
    preferred_term: orofacial cleft 15
    term:
      id: MONDO:0014772
      label: orofacial cleft 15
  genes:
  - preferred_term: DLX4
    term:
      id: hgnc:2917
      label: DLX4
  description: >-
    Cleft lip and palate attributed to DLX4 haploinsufficiency, defined by a
    frameshift variant in one mother-son pair with bilateral CL/P. Sequencing of
    155 further patients with nonsyndromic clefts found no variants; a later
    Japanese target-capture study reported one patient with a homeodomain
    missense variant. The gene-disease relationship rests on very few families.
  evidence:
  - reference: PMID:25954033
    reference_title: "DLX4 is associated with orofacial clefting and abnormal jaw development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to study a patient with bilateral CL/P and identified a single nucleotide deletion in the patient and her similarly affected son"
    explanation: The founding family defining the DLX4-related cleft subtype.
  - reference: PMID:31337262
    reference_title: "Target Capture/Next-Generation Sequencing for Nonsyndromic Cleft Lip and Palate in the Japanese Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DLX4 missense mutation c.359C>T (Pro120Leu) was found in 1 Japanese patient with NSCL±P and was located in the homeodomain region."
    explanation: A second, independent DLX4 variant in a patient with nonsyndromic cleft lip with or without palate.

pathophysiology:
- name: Failure of Lip and Primary Palate Fusion
  description: >-
    During weeks 4-7 of development, cranial neural crest-derived mesenchyme
    populates the frontonasal prominence and paired maxillary prominences.
    Formation of the upper lip and primary palate requires the medial nasal
    prominences to merge with each other and with the maxillary prominences.
    Deficient neural crest cell migration, proliferation, or survival, or
    failure of epithelial seam breakdown at the sites of contact, prevents
    fusion and produces a cleft of the lip (with or without the alveolus),
    which may be unilateral or bilateral.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
  - preferred_term: primary palate development
    term:
      id: GO:1903929
      label: primary palate development
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:21331089
    reference_title: "Cleft lip and palate: understanding genetic and environmental influences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common forms of CLP involve disruption of tissue planes above the lip extending into the nares and/or the palate (hard and/or soft)"
    explanation: Describes the anatomical disruption of lip and palate structures that defines clefting.
- name: Failure of Secondary Palatal Shelf Elevation and Fusion
  description: >-
    Between weeks 6 and 9, the paired secondary palatal shelves grow vertically
    beside the tongue, elevate to a horizontal position above the descending
    tongue, grow toward the midline, and fuse. Fusion requires apposition of the
    medial edge epithelia, formation of a midline epithelial seam, and
    subsequent removal of the seam by epithelial apoptosis and/or
    epithelial-mesenchymal transition, allowing mesenchymal confluence.
    Disruption of shelf growth, delayed or failed elevation, impaired seam
    formation, or persistence of the medial edge epithelium yields a cleft of
    the secondary palate.
  cell_types:
  - preferred_term: palatal shelf mesenchyme (cranial neural crest-derived)
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: secondary palate development
    term:
      id: GO:0062009
      label: secondary palate development
  - preferred_term: epithelial cell apoptosis in palatal shelf fusion
    term:
      id: GO:1990134
      label: epithelial cell apoptotic process involved in palatal shelf morphogenesis
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
  evidence:
  - reference: PMID:22186724
    reference_title: "Palatogenesis: morphogenetic and molecular mechanisms of secondary palate development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the embryonic primary and secondary palatal shelves develop as outgrowths from the medial nasal and maxillary prominences, respectively, remodel and fuse to form the intact roof of the oral cavity."
    explanation: Describes the palatal shelf outgrowth, remodeling, and midline fusion whose failure produces cleft palate.
  - reference: PMID:7493021
    reference_title: "Transforming growth factor-beta 3 is required for secondary palate fusion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The defect appears to result from impaired adhesion of the apposing medial edge epithelia of the palatal shelves and subsequent elimination of the mid-line epithelial seam."
    explanation: Tgfb3-null mice show that failed medial edge epithelial adhesion and seam removal cause cleft palate, mechanistically linking this node to palatal fusion failure.
- name: Disruption of the Orofacial Developmental Gene Regulatory Network
  description: >-
    Lip and palate morphogenesis is governed by a conserved gene regulatory
    network in which transcription factors and signaling pathways (IRF6-GRHL3
    in the periderm/oral epithelium; SHH, BMP4, FGF, and WNT signaling; MSX1,
    FOXE1, PAX7, TP63) coordinate epithelial-mesenchymal interactions.
    Pathogenic variants and common risk alleles at these loci perturb the
    network, reducing the developmental robustness of fusion and increasing
    cleft susceptibility. IRF6 is the single most important locus, contributing
    to both syndromic (Van der Woude) and nonsyndromic clefting.
  gene:
    preferred_term: IRF6
    term:
      id: hgnc:6121
      label: IRF6
  cell_types:
  - preferred_term: oral periderm cell
    term:
      id: CL:0000078
      label: peridermal cell
  biological_processes:
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
  downstream:
  - target: Failure of Lip and Primary Palate Fusion
    causal_link_type: DIRECT
    description: >-
      Perturbation of the IRF6-GRHL3 periderm/epithelial network reduces the
      developmental robustness of medial nasal-maxillary prominence fusion,
      predisposing to cleft lip and primary palate.
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    causal_link_type: DIRECT
    description: >-
      The same epithelial gene regulatory network (and TGF-beta signaling)
      governs medial edge epithelial adhesion and seam removal, so its
      disruption predisposes to failed secondary palatal shelf fusion.
  evidence:
  - reference: PMID:18836445
    reference_title: "Disruption of an AP-2alpha binding site in an IRF6 enhancer is associated with cleft lip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A allele is significantly overtransmitted (P = 1 x 10(-11)) in families with NSCL/P, in particular those with cleft lip but not cleft palate."
    explanation: A common regulatory variant in an IRF6 enhancer perturbs the network and increases cleft-lip risk.
  - reference: PMID:18836445
    reference_title: "Disruption of an AP-2alpha binding site in an IRF6 enhancer is associated with cleft lip."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "expression analysis in the mouse localizes the enhancer activity to craniofacial and limb structures"
    explanation: In vivo mouse expression analysis places the IRF6 enhancer activity in developing craniofacial structures, supporting its role in the orofacial gene regulatory network.
  - reference: PMID:20436469
    reference_title: "A genome-wide association study of cleft lip with and without cleft palate identifies risk variants near MAFB and ABCA4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two previously identified regions (at chromosome 8q24 and IRF6) attained genome-wide significance"
    explanation: GWAS confirms multiple risk loci (8q24, IRF6, MAFB, ABCA4) contributing to the gene regulatory network underlying nonsyndromic CL/P.
- name: Orofacial Homeodomain Transcription Factor Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous loss-of-function variants in the homeobox transcription factor
    genes MSX1 and DLX4 reduce the dose of a sequence-specific transcriptional
    regulator expressed in the craniofacial mesenchyme. For DLX4 the founding
    frameshift allele failed to activate Dlx regulatory elements in a reporter
    assay, implying haploinsufficiency, and Dlx4 is expressed in the murine
    palatal shelf mesenchyme before palate closure. Reduced dose of these
    regulators is placed upstream of both lip and secondary palate fusion
    failure.
  genes:
  - preferred_term: MSX1
    term:
      id: hgnc:7391
      label: MSX1
  - preferred_term: DLX4
    term:
      id: hgnc:2917
      label: DLX4
  molecular_functions:
  - preferred_term: homeodomain DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  downstream:
  - target: Failure of Lip and Primary Palate Fusion
    causal_link_type: DIRECT
    description: >-
      Reduced MSX1 or DLX4 dose in the facial mesenchyme predisposes to cleft
      lip; both founding DLX4 patients had bilateral cleft lip and palate.
    evidence:
    - reference: PMID:25954033
      reference_title: "DLX4 is associated with orofacial clefting and abnormal jaw development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "We used exome sequencing to study a patient with bilateral CL/P and identified a single nucleotide deletion in the patient and her similarly affected son"
      explanation: A segregating DLX4 loss-of-function allele accompanies bilateral cleft lip and palate; the step from reduced transcription factor dose to failed fusion is inferred.
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    causal_link_type: DIRECT
    description: >-
      Dlx4 is expressed in the palatal shelf mesenchyme before closure, placing
      the reduced transcription factor dose in the tissue whose fusion fails.
    evidence:
    - reference: PMID:25954033
      reference_title: "DLX4 is associated with orofacial clefting and abnormal jaw development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In situ hybridization showed that Dlx4 was expressed in the mesenchyme of the murine palatal shelves at E12.5, prior to palate closure."
      explanation: Expression timing and location in mouse palatal shelves support a role for Dlx4 in secondary palate closure.
  evidence:
  - reference: PMID:25954033
    reference_title: "DLX4 is associated with orofacial clefting and abnormal jaw development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type human DLX4, but not mutant DLX4_c.546delG, could activate two murine Dlx conserved regulatory elements, implying that the mutation caused haploinsufficiency."
    explanation: Reporter assay showing the cleft-associated DLX4 allele loses transcriptional activation, supporting haploinsufficiency of a homeodomain transcription factor.
  - reference: PMID:12807959
    reference_title: "Complete sequencing shows a role for MSX1 in non-syndromic cleft lip and palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five different missense mutations in seven unrelated subjects with clefting are described."
    explanation: Recurrent MSX1 missense variants in unrelated clefting cases place MSX1 dosage in this node.
- name: Reduced Sumoylation of Palatogenesis Regulators
  biological_scale: MOLECULAR
  description: >-
    SUMO1 haploinsufficiency lowers the supply of the SUMO1 protein tag. The
    products of several cleft genes are sumoylated, and a Sumo1 hypomorphic
    allele interacts genetically with a loss-of-function allele at one of those
    loci, so reduced sumoylation is proposed to weaken a network of
    palatogenesis regulators. The human evidence is a single patient.
  genes:
  - preferred_term: SUMO1
    term:
      id: hgnc:12502
      label: SUMO1
  molecular_functions:
  - preferred_term: SUMO protein tag activity
    modifier: DECREASED
    term:
      id: GO:0031386
      label: protein tag activity
  downstream:
  - target: Failure of Lip and Primary Palate Fusion
    causal_link_type: DIRECT
    description: >-
      The index SUMO1-haploinsufficient patient had cleft lip and palate, and a
      Sumo1 hypomorphic mouse shows incompletely penetrant orofacial clefting.
    evidence:
    - reference: PMID:16990542
      reference_title: "SUMO1 haploinsufficiency leads to cleft lip and palate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mouse, we found that Sumo1 is expressed in the developing lip and palate and that a Sumo1 hypomorphic allele manifests an incompletely penetrant orofacial clefting phenotype."
      explanation: Reduced Sumo1 dose produces orofacial clefting in mouse, with expression in the developing lip.
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    causal_link_type: DIRECT
    description: >-
      Sumoylation of cleft gene products is proposed to define a network
      required for palatogenesis.
    evidence:
    - reference: PMID:16990542
      reference_title: "SUMO1 haploinsufficiency leads to cleft lip and palate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, sumoylation defines a network of genes important for palatogenesis."
      explanation: The authors' conclusion, drawn from the mouse expression, hypomorph and genetic-interaction data, links sumoylation to palate development.
  evidence:
  - reference: PMID:16990542
    reference_title: "SUMO1 haploinsufficiency leads to cleft lip and palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a patient with isolated cleft lip and palate and a balanced chromosomal translocation that disrupts the SUMO1 (small ubiquitin-related modifier) gene, resulting in haploinsufficiency."
    explanation: Human SUMO1 haploinsufficiency underlies the reduced-sumoylation node.
  - reference: PMID:16990542
    reference_title: "SUMO1 haploinsufficiency leads to cleft lip and palate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Products of several genes implicated in clefting are sumoylated, and the Sumo1 hypomorphic allele interacts genetically with a loss-of-function allele for one of these loci."
    explanation: Places SUMO1 upstream of other cleft genes through sumoylation of their products.
- name: Reduced BMP4 Signaling in Lip Development
  biological_scale: MOLECULAR
  description: >-
    Rare BMP4 missense and nonsense variants are associated with a cleft lip
    spectrum that extends from overt cleft lip to microform clefts and
    subepithelial defects of the orbicularis oris muscle. The functional effect
    of the individual variants on BMP4 signaling was not established in the
    source; reduced BMP4 ligand activity is the inferred mechanism, and the
    authors also raise a role for BMP4 in wound healing.
  genes:
  - preferred_term: BMP4
    term:
      id: hgnc:1071
      label: BMP4
  molecular_functions:
  - preferred_term: BMP4 ligand (cytokine) activity
    modifier: DECREASED
    term:
      id: GO:0005125
      label: cytokine activity
  downstream:
  - target: Failure of Lip and Primary Palate Fusion
    causal_link_type: DIRECT
    description: >-
      BMP4 variants are found across the cleft lip spectrum, including microform
      and subepithelial lip defects, and not in controls.
    evidence:
    - reference: PMID:19249007
      reference_title: "Mutations in BMP4 are associated with subepithelial, microform, and overt cleft lip."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "These results provide confirmation that microforms and subepithelial OOM defects are part of the spectrum of CL/P and should be considered during clinical evaluation of families with clefts."
      explanation: The association places BMP4 variants on the lip-fusion arm of the spectrum; the reduced-signaling step is inferred.
  evidence:
  - reference: PMID:19249007
    reference_title: "Mutations in BMP4 are associated with subepithelial, microform, and overt cleft lip."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified missense and nonsense mutations in the BMP4 gene in 1 of 30 cases of microform clefts, 2 of 87 cases with subepithelial defects in the orbicularis oris muscle (OOM), 5 of 968 cases of overt CL/P, and 0 of 529 controls."
    explanation: Rare BMP4 coding variants, including nonsense alleles, in cleft lip cases and none in controls.

phenotypes:
- category: Craniofacial
  name: Cleft lip
  description: >-
    A fissure of the upper lip resulting from failure of fusion of the medial
    nasal and maxillary prominences, ranging from a minor notch to a complete
    cleft extending into the nostril; may be unilateral or bilateral.
  phenotype_term:
    preferred_term: Cleft lip
    term:
      id: HP:0410030
      label: Cleft lip
  evidence:
  - reference: PMID:19747722
    reference_title: "Cleft lip and palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clefts of the lip and palate are generally divided into two groups, isolated cleft palate and cleft lip with or without cleft palate, representing a heterogeneous group of disorders affecting the lips and oral cavity."
    explanation: Defines cleft lip with or without cleft palate as a core clinical group.
- category: Craniofacial
  name: Cleft palate
  description: >-
    A midline opening in the roof of the mouth from failed fusion of the
    secondary palatal shelves, involving the hard and/or soft palate.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:19747722
    reference_title: "Cleft lip and palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clefts of the lip and palate are generally divided into two groups, isolated cleft palate and cleft lip with or without cleft palate, representing a heterogeneous group of disorders affecting the lips and oral cavity."
    explanation: Cleft palate is one of the two principal cleft groups.
- category: Feeding
  name: Feeding difficulties in infancy
  description: >-
    Impaired ability to generate suction and inefficient feeding due to the
    oronasal communication, a common early complication requiring specialized
    feeding techniques.
  phenotype_term:
    preferred_term: Feeding difficulties in infancy
    term:
      id: HP:0008872
      label: Feeding difficulties in infancy
  evidence:
  - reference: PMID:21331089
    reference_title: "Cleft lip and palate: understanding genetic and environmental influences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with CLP may experience problems with feeding, speaking, hearing and social integration"
    explanation: Feeding difficulty is a recognized complication of clefting.
- category: Otologic
  name: Otitis media
  description: >-
    Recurrent middle ear effusion, especially with cleft palate, due to
    dysfunction of the tensor veli palatini and Eustachian tube, commonly
    causing conductive hearing loss.
  phenotype_term:
    preferred_term: Otitis media
    term:
      id: HP:0000388
      label: Otitis media

experimental_models:
- name: Orofacial epithelial-mesenchymal microplate
  description: >-
    Micromachined 96-well microplate in which an epithelium is overlaid onto an
    extracellular matrix-embedded mesenchyme. SHH from the epithelium sets up a
    gradient of SHH-driven transcription in the mesenchyme, and small-molecule
    inhibitors of SHH secretion, matrix transport and mesenchymal sensing
    antagonize it. Cells are human fetal oral epithelial GMSM-K (SHH-null and
    SHH-overexpressing variants), mouse embryonic 3T3 Shh-Light2 mesenchyme and
    mouse cranial neural crest O9-1 mesenchyme.
  experimental_model_type: CO_CULTURE
  namo_type: namo:CoCulture
  cell_source: immortalized cell lines, human epithelial and mouse mesenchymal
  culture_system: static micromachined 96-well microplate, not perfused
  publication: PMID:33634122
  modeled_mechanisms:
  - target: Disruption of the Orofacial Developmental Gene Regulatory Network
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Chemical inhibition of the SHH pathway at secretion, transport and sensing
      steps perturbs epithelial-to-mesenchymal SHH signaling, one arm of the
      orofacial gene regulatory network.
    limitations: >-
      Signaling readouts only; the paper does not report lip or palate fusion or
      morphology, and the perturbation is a chemical exposure rather than a
      cleft-causing variant.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The responding mesenchyme is mouse (3T3 Shh-Light2 and O9-1); only the
        SHH-producing epithelium is human.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Pathway activity is lowered with small-molecule inhibitors rather than by
        a cleft-associated SHH pathway variant or the exposure that causes
        clefts.
    evidence:
    - reference: PMID:33634122
      reference_title: "A Microphysiological Approach to Evaluate Effectors of Intercellular Hedgehog Signaling in Development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Shh pathway activation was antagonized by small molecule inhibitors of epithelial secretory, extracellular matrix transport, and mesenchymal sensing targets"
      explanation: Shows the SHH axis of the orofacial network can be perturbed at several steps in this plate model.
    readouts:
    - name: SHH-driven transcription gradient in the mesenchyme
      target: Disruption of the Orofacial Developmental Gene Regulatory Network
      direction: DECREASED
      interpretation: Inhibitors of SHH secretion, transport and sensing reduce SHH-driven transcription.
      evidence:
      - reference: PMID:33634122
        reference_title: "A Microphysiological Approach to Evaluate Effectors of Intercellular Hedgehog Signaling in Development."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "SHH ligand produced from the epithelium generated a gradient of SHH-driven transcription in the adjacent mesenchyme, recapitulating the gradient of pathway activity observed in vivo."
        explanation: Reports the gradient measurement that the inhibitors then reduce.

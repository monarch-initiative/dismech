    term:
      id: hgnc:7391
      label: MSX1
  description: >-
    Orofacial clefting caused by heterozygous MSX1 variants. A population-based
    sequencing scan found potentially aetiological MSX1 variants in about 2% of
    clefting cases, and the source advises considering MSX1 especially where
    clefting cosegregates dominantly or with dental anomalies (tooth agenesis).
  evidence:
  - reference: PMID:12807959
    reference_title: "Complete sequencing shows a role for MSX1 in non-syndromic cleft lip and palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSX1 mutations are found in 2% of cases of clefting and should be considered for genetic counselling implications, particularly in those families in which autosomal dominant inheritance patterns or dental anomalies appear to be cosegregating with the clefting phenotype."
    explanation: Establishes MSX1 as a gene for a small Mendelian fraction of orofacial clefting, the defining gene of OFC5.

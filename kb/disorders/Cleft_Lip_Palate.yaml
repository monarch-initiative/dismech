environmental:
- name: Maternal Tobacco Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Failure of Lip and Primary Palate Fusion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking raises the risk of fusion failure by a moderate amount; most
      exposed pregnancies are unaffected, and no step between tobacco smoke
      and the fusing facial prominences is established here.
    evidence:
    - reference: PMID:15112010
      reference_title: "Tobacco smoking and oral clefts: a meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent, moderate and statistically significant associations were found between maternal smoking and cleft lip, with or without cleft palate (relative risk 1.34, 95% confidence interval 1.25-1.44) and between maternal smoking and cleft palate (relative risk 1.22, 95% confidence interval 1.10-1.35)."
      explanation: >-
        Reports consistent, moderate, statistically significant associations
        between maternal smoking and cleft lip with or without cleft palate,
        an association of modest effect size.
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same meta-analysis reports a separate, slightly smaller association
      with isolated cleft palate, so smoking raises risk at both orofacial
      fusion events rather than only at the lip and primary palate.
    evidence:
    - reference: PMID:15112010
      reference_title: "Tobacco smoking and oral clefts: a meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "and between maternal smoking and cleft palate (relative risk 1.22, 95% confidence interval 1.10-1.35)."
      explanation: >-
        Reports a relative risk of 1.22 for cleft palate specifically,
        distinguishing the secondary-palate arm from the cleft lip arm within
        the same analysis.
  description: >-
    Maternal cigarette smoking during the periconceptional period increases the
    risk of orofacial clefting in offspring, with a dose-response relationship.
  evidence:
  - reference: PMID:15112010
    reference_title: "Tobacco smoking and oral clefts: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent, moderate and statistically significant associations were found between maternal smoking and cleft lip, with or without cleft palate (relative risk 1.34, 95% confidence interval 1.25-1.44) and between maternal smoking and cleft palate (relative risk 1.22, 95% confidence interval 1.10-1.35)."
    explanation: Meta-analysis of 24 studies confirms maternal smoking raises the risk of both cleft lip +/- palate and cleft palate.
- name: Maternal Folate Status
  exposure_term:
    preferred_term: maternal folic acid supplementation exposure
    modifier: INCREASED
    term:
      id: ECTO:9000123
      label: exposure to folic acid
  influences_mechanisms:
  - target: Failure of Lip and Primary Palate Fusion
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Adequate periconceptional folate reduces the occurrence of fusion
      failure rather than causing it, so this exposure runs opposite in
      direction to the others in this entry.
    evidence:
    - reference: PMID:17259187
      reference_title: "Folic acid supplements and risk of facial clefts: national population based case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Folic acid supplementation during early pregnancy (> or =400 microg/day) was associated with a reduced risk of isolated cleft lip with or without cleft palate after adjustment for multivitamins, smoking, and other potential confounding factors"
      explanation: >-
        Folic acid supplementation in early pregnancy was associated with
        reduced risk of isolated cleft lip with or without cleft palate, a
        protective rather than causative association.
  description: >-
    Low maternal folate intake is associated with increased cleft risk;
    periconceptional folic acid supplementation may reduce risk.
  evidence:
  - reference: PMID:17259187
    reference_title: "Folic acid supplements and risk of facial clefts: national population based case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Folic acid supplementation during early pregnancy (> or =400 microg/day) was associated with a reduced risk of isolated cleft lip with or without cleft palate after adjustment for multivitamins, smoking, and other potential confounding factors"
    explanation: Population-based case-control study shows periconceptional folic acid supplementation reduces the risk of isolated cleft lip +/- palate.
- name: Maternal Alcohol Consumption
  exposure_term:
    preferred_term: maternal exposure to drinking alcohol
    term:
      id: ECTO:0300001
      label: exposure to drinking alcohol via maternal
  influences_mechanisms:
  - target: Failure of Lip and Primary Palate Fusion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heavy early-pregnancy drinking raises the risk of orofacial clefting.
      Graded as predisposing because the cited effect is a risk increase
      modified by genetic background rather than a deterministic teratogenic
      action.
    evidence:
    - reference: PMID:20810466
      reference_title: "Maternal alcohol consumption, alcohol metabolism genes, and the risk of oral clefts: a population-based case-control study in Norway, 1996-2001."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heavy maternal alcohol consumption during early pregnancy increases the risk of oral clefts, but little is known about how genetic variation in alcohol metabolism affects this association."
      explanation: >-
        Reports that heavy maternal alcohol consumption during early pregnancy
        increases the risk of oral clefts, while noting that the role of
        genetic variation is poorly understood.
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cited association is with oral clefts as a group, which covers the
      secondary palate as well as the lip, so the same risk is recorded at both
      fusion events without claiming a distinct effect size for each.
    evidence:
    - reference: PMID:20810466
      reference_title: "Maternal alcohol consumption, alcohol metabolism genes, and the risk of oral clefts: a population-based case-control study in Norway, 1996-2001."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heavy maternal alcohol consumption during early pregnancy increases the risk of oral clefts, but little is known about how genetic variation in alcohol metabolism affects this association."
      explanation: >-
        Reports increased risk of oral clefts as a group with heavy
        early-pregnancy drinking, a category that includes the secondary
        palate.
  description: >-
    Prenatal alcohol exposure is associated with increased risk of orofacial
    clefts.
  evidence:
  - reference: PMID:20810466
    reference_title: "Maternal alcohol consumption, alcohol metabolism genes, and the risk of oral clefts: a population-based case-control study in Norway, 1996-2001."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heavy maternal alcohol consumption during early pregnancy increases the risk of oral clefts, but little is known about how genetic variation in alcohol metabolism affects this association."
    explanation: Population-based case-control study links heavy early-pregnancy maternal alcohol consumption to increased oral cleft risk.
- name: Anticonvulsant Exposure
  exposure_term:
    preferred_term: anticonvulsant exposure
    term:
      id: ECTO:9001740
      label: exposure to anticonvulsant
  influences_mechanisms:
  - target: Failure of Secondary Palatal Shelf Elevation and Fusion
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      First-trimester valproate is an established human teratogen, which is
      why it is graded as initiating rather than merely raising risk, unlike
      the smoking and alcohol links in this entry. It targets the secondary
      palate because that is the cleft the cited cohort quantifies; lip and
      primary palate fusion is a separate embryological event. The step
      between drug exposure and the failing palatal shelves is not
      established.
    evidence:
    - reference: PMID:20558369
      reference_title: "Valproic acid monotherapy in pregnancy and major congenital malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "cleft palate, 5.2 (95% CI, 2.8 to 9.9); hypospadias, 4.8 (95% CI, 2.9 to 8.1)"
      explanation: >-
        Gives an adjusted odds ratio of 5.2 for cleft palate with
        first-trimester valproate monotherapy, a quantified effect on the
        secondary palate specifically rather than on orofacial clefting
        generally.
  description: >-
    In utero exposure to certain antiepileptic drugs, particularly valproate
    and phenytoin/topiramate, increases the risk of orofacial clefting.
  evidence:
  - reference: PMID:20558369
    reference_title: "Valproic acid monotherapy in pregnancy and major congenital malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of valproic acid monotherapy in the first trimester was associated with significantly increased risks of several congenital malformations, as compared with no use of antiepileptic drugs or with use of other antiepileptic drugs."
    explanation: First-trimester valproate monotherapy was significantly associated with several malformations, including cleft palate (odds ratio 5.2, 95% CI 2.8-9.9).


- name: Reduced PPCS Protein Stability
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    PPCS normally exists mainly as a dimer. Patient variants lower steady-state PPCS
    protein in fibroblasts, iPSCs, cardiac progenitors and cardiomyocytes, while
    transcript levels in iPSC-derived cells stay normal. This points to protein
    instability rather than reduced expression. Some alleles also impair
    dimerization. In one homozygous p.Tyr78His patient, skeletal-muscle RNA
    sequencing showed reduced PPCS expression, so transcript effects cannot be
    excluded for every allele.

notes: >-
  Evidence base: three clinical publications covering 12 patients in eight families.
  Iuso et al. 2018 (PMID:29754768) reported family A (one compound-heterozygous
  patient) and family B (four homozygous p.Glu233Val siblings). Lok et al. 2022
  (PMID:35616428) reported one compound-heterozygous infant. Zhang et al. 2025
  (PMID:40745475) added six patients in five families and re-reported family B as
  F6. The 2018 and 2025 papers share family B and must not be counted as
  independent cohorts. p.Glu233Val recurs in three families (B/F6, F3, F5); no
  haplotype analysis has been reported. The two 2018 texts number the deceased
  family B siblings differently (IV.5 in the text, IV.6 in Table 1); the
  segregation sentence also prints the variant as c.178A>T although c.698A>T is
  meant. ClinGen has not curated PPCS; PPCS appears in no cached CGGV record and
  not in kb/genes/ingest/clingen_gene_validity.tsv, so gene_disease_validity is
  left empty. Snippets
  from PMID:40745475 come from a PDF-extracted full text; wherever the extraction
  merged words (for example "intercurrentillness"), the snippet keeps the cached
  spelling. `just check-genereviews --online` result: NO_CHAPTER. No
  PPCS-specific GeneReviews chapter exists; the general Dilated Cardiomyopathy
  Overview was not used as a phenotype baseline because it does not cover PPCS.

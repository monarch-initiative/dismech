- name: Impaired Long-Chain Fatty Acid Oxidation
  biological_scale: MOLECULAR
  role: mechanism
  mechanism_confidence: PROVISIONAL
  description: >-
    Long-chain fatty-acid oxidation appears impaired, but the data point to two
    different sites. The 2018 dried-blood-spot profiles of the index patients showed
    low long-chain acylcarnitines (C16, C18) with a raised C0/(C16+C18) ratio,
    resembling CPT1 deficiency. That fits the authors' proposal that less cytosolic
    CoA means fewer activated long-chain acyl-CoAs. In contrast, the 2025 table
    records acylcarnitines as elevated in six patients. During crises F1:II and F4:II
    showed a VLCADD-like C14:1/C14:2 pattern, elevated long-chain acyl species and
    dicarboxylic aciduria, which suggests a block downstream of activation.
    Against a fixed systemic defect, the fasting respiratory quotient in two family B
    siblings was consistent with normal fat oxidation, and acylcarnitines were
    normal when patients were well. Acyl-CoA pools and fatty-acid flux have not been
    measured in patient cells or heart.
  biological_processes:
  - preferred_term: long-chain fatty acid metabolic process
    modifier: DECREASED
    term:
      id: GO:0001676

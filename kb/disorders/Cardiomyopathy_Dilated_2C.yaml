treatments:
- name: Pantethine supplementation
  description: >-
    Oral pantethine enters the CoA pathway downstream of PPCS and so bypasses the
    defective step. It has been given as compassionate treatment to four patients at
    about 10-24 mg/kg/day. Family B siblings started it as adolescents and adults
    after cardiac damage. One improved (EF 36% to 48%) and the other stayed stable;
    the 2018 authors saw no significant clinical improvement. F6:IV.1 died at 21 of
    SARS-CoV-2 complications after four years on pantethine, with cardiac function
    reported stable through the infection. F1:II has had no
    rhabdomyolysis since starting it and has low-normal LV function. F5:IV.1
    recovered full LV function, but she was also on a beta-blocker and ACE inhibitor
    and had an ICD. After starting pantethine, F1:II began excreting
    3-methylcrotonylglycine; he carries a homozygous MCCC1 variant of uncertain
    significance, and the significance of this is unclear. No controlled data exist, and every treated patient also
    received standard care, so benefit cannot be attributed to pantethine alone. In
    vitro, pantethine raises CoA in patient cells and partly rescues cardiomyocyte
    phenotypes. It also rescues viability in dPPCS hypomorph flies.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Cellular Coenzyme A Deficiency
    description: Pantethine supplies a substrate that enters CoA synthesis after the PPCS step.
  evidence:
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "CoA biosynthesis can occur with pantethine as a source independent from PPCS, suggesting pantethine as targeted treatment for the affected individuals still alive."
    explanation: The biochemical rationale.
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Addition of pantethine to the fly food indeed rescued the percentage of homozygous survivors to levels that can be expected based on Mendelian inheritance."
    explanation: Viability rescue in the Drosophila hypomorph. Cardiac rescue was not tested in flies.
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Compared to their baseline evaluations, both clinical and echocardiographic evaluations had shown individual IV.1 to experience a mild improvement in exertional dyspnea and an increase of ejection fraction (EF, using the Simpson mode) from 36% (at baseline) to 48% (at a recent visit); subject IV.4 remained stable, with symptoms of heart failure upon exertion and an EF of 45%."
    explanation: Outcomes in two treated siblings; uncontrolled.
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Our results thus far had not shown significant clinical improvement."
    explanation: The 2018 authors' own cautious assessment of early treatment in family B.
  - reference: PMID:40745475
    reference_title: Pantethine ameliorates dilated cardiomyopathy features in PPCS deficiency disorder in patients and cell line models.
    supports: SUPPORT

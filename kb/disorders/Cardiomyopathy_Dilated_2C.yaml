genetic:
- name: PPCS
  gene_term:
    preferred_term: PPCS
    term:
      id: hgnc:25686
      label: PPCS
  association: >-
    Causative biallelic hypomorphic variants (autosomal recessive). The evidence is
    12 patients in eight families from three reports. p.Glu233Val recurs in
    three families (B/F6 and F5 consanguineous, F3 not). Support comes from segregation, absence of
    the missense alleles from gnomAD, yeast complementation for the original
    alleles, reduced PPCS protein and CoA in patient cells, and a Drosophila
    hypomorph with cardiac dysfunction. ClinGen has not curated this gene-disease
    pair.
  variant_origin: GERMLINE
  notes: >-
    relationship_type is left unset because the schema defines CAUSATIVE as a
    Definitive or Strong relationship and no external body has classified PPCS
    for this disease. Reported alleles (NM_024664): c.698A>T p.Glu233Val (exon 3; homozygous in
    families B/F6, F3, F5), c.538G>C p.Ala180Pro, c.320_334del p.Pro107_Ala111del,
    c.613-3C>G, c.232T>C p.Tyr78His, c.317G>C p.Arg106Pro and c.59C>G p.Ala20Gly.
    Yeast complementation was positive for the original alleles but inconclusive
    for p.Tyr78His and p.Arg106Pro. For those two, pathogenicity rests on patient
    cell protein and CoA levels. The in-frame deletion appears 10 times in the
    heterozygous state in gnomAD.
  evidence:
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Exome sequencing in five individuals from two unrelated families presenting with dilated cardiomyopathy revealed biallelic mutations in PPCS, linking CoA synthesis with a cardiac phenotype."
    explanation: The index gene-disease report.
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.

- name: Cardiomyocyte Arrhythmogenicity
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Patient iPSC-derived cardiomyocytes show arrhythmic calcium events in 42-54% of
    cells. Engineered heart patches have a shortened effective refractory period and
    more arrhythmic events. Pantethine reduces both. These in vitro findings are a
    plausible substrate for the ventricular fibrillation and cardiac arrests seen in
    patients. The shortened refractory period in vitro does not mirror the QT
    prolongation seen in some patients, so this node is not linked to Prolonged QT
    Interval.

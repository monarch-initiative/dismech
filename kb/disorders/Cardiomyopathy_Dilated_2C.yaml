discussions:
- discussion_id: cmd2c_small_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How secure are the gene-disease relationship, the phenotype spectrum and the genotype-phenotype rule, given 12 patients in eight families?
  attaches_to:
  - genetic#PPCS
  - phenotypes#Hypotonia
  - phenotypes#Rhabdomyolysis
  rationale: >-
    The PPCS link rests on three clinical reports, and family B appears in two of
    them. Three of the families share the same p.Glu233Val allele. The causal case
    is coherent: segregation, patient-cell protein and CoA reduction with genetic
    rescue, yeast complementation and a fly hypomorph. ClinGen has not curated it.
    The proposed rule that exon 3 variants cause DCM only while exon 1 and 2
    variants add neuromuscular and metabolic disease is exploratory and based on
    n=12. Extracardiac features such as dysmorphism, cutis laxa and PAH come from
    single patients and may be coincidental.
  evidence:
  - reference: PMID:40745475
    reference_title: Pantethine ameliorates dilated cardiomyopathy features in PPCS deficiency disorder in patients and cell line models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "in contrast the p.Glu233Val variant leads to an isolated DCM presentation with variable expressivity, suggesting that different clinical presentations may be related to the position of the mutations within the gene."
    explanation: The genotype-phenotype hypothesis as stated.
  - reference: PMID:40745475
    reference_title: Pantethine ameliorates dilated cardiomyopathy features in PPCS deficiency disorder in patients and cell line models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Only by investigating the natural history of the disease in a larger patient cohort"
    explanation: The authors acknowledge that the cohort is too small.
  proposed_experiments:
  - experiment_id: exp_cmd2c_natural_history_registry
    name: Natural history registry with exome reanalysis
    description: >-
      Pool unsolved pediatric DCM and fatty-acid-oxidation-like crisis cases with
      normal ACADVL testing for PPCS reanalysis. Follow genotyped patients
      prospectively with standardized cardiac, neuromuscular and metabolic
      phenotyping to test the exon-based genotype-phenotype rule.
- discussion_id: cmd2c_cardiac_coa_and_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Why does a ubiquitous CoA-synthesis defect damage mainly the heart, and is cardiac CoA actually depleted in patients?
  attaches_to:
  - pathophysiology#Cellular Coenzyme A Deficiency
  - pathophysiology#Impaired Long-Chain Fatty Acid Oxidation
  - pathophysiology#Cardiomyocyte Energy Deficit
  rationale: >-
    CoA has been measured only in fibroblasts and iPSC-derived cells, never in
    patient or animal myocardium. The fatty-acid-activation and energy-deficit steps
    are inferred from acylcarnitines and from the authors' reasoning about
    cardiomyocyte metabolism. Fasting respiratory quotient in two patients showed
    normal whole-body fat oxidation. Proposed explanations include greater
    fatty-acid dependence of maturing cardiomyocytes, tissue-specific PPCS isoforms
    and cysteine toxicity; none has been tested.
  evidence:
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "However, considering the ubiquitous presence of the enzymatic PPCS activity, it remains unexplained why the brain and in general the other organs are not affected in PPCS-deficient individuals."
    explanation: The open question as the index authors stated it.
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In contrast to the neurodegenerative NBIA-related phenotypes associated with defects in PANK2 and COASY, PPCS-deficient individuals present with a clear dilated cardiomyopathy with a variable degree of severity and no neurodegeneration."
    explanation: The tissue-selectivity contrast with other CoA-pathway disorders.
  proposed_experiments:
  - experiment_id: exp_cmd2c_cardiomyocyte_acylcoa_flux
    name: Acyl-CoA profiling and fatty-acid flux in patient cardiomyocytes
    description: >-
      Measure free CoA, acetyl-CoA and long-chain acyl-CoA pools, and run
      13C-palmitate oxidation and Seahorse respirometry in day-60 patient and
      isogenic-corrected iPSC cardiomyocytes, with and without pantethine. Test
      whether the energy deficit precedes sarcomere disorganization.
- discussion_id: cmd2c_cysteine_toxicity_hypothesis
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: Does accumulation of L-cysteine, which PPCS would normally consume, contribute to cardiotoxicity in addition to CoA deficiency?
  attaches_to:
  - pathophysiology#Cellular Coenzyme A Deficiency
  rationale: >-
    The index authors raised the possibility that a toxic metabolite contributes,
    because dPPCS fly mutants are hypersensitive to cysteine. Cysteine has not been
    measured in patient cells or tissue. The incomplete rescue by pantethine is
    consistent with, but does not prove, a CoA-independent contribution.
  evidence:
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "We cannot exclude that cardiomyopathy in PPCS-deficient individuals is also due to the generation of toxic metabolites."
    explanation: The hypothesis as stated; it has not been tested.
- discussion_id: cmd2c_models_limits
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Do the available models capture the human disease well enough to support the cellular nodes of the mechanism?
  attaches_to:
  - pathophysiology#Cardiomyocyte Contractile Dysfunction
  - pathophysiology#Cardiomyocyte Arrhythmogenicity
  rationale: >-
    No mammalian Ppcs model exists. The fly hypomorph lowers expression rather than
    destabilizing the protein, and fly heart-tube kinematics are a loose proxy for
    DCM. The iPSC cardiomyocyte data come from two patient lines, one clone each,
    without isogenic controls, in immature cells. The cellular nodes are therefore
    PROVISIONAL, not ESTABLISHED.
  evidence:
  - reference: PMID:35397396
    reference_title: Generation of two human iPSC lines, HMGUi003-A and MRIi028-A, carrying pathogenic biallelic variants in the PPCS gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "PPCS-deficiency is a relatively new disease with unclear pathogenesis and no targeted therapy."
    explanation: States the mechanistic uncertainty the models were built to address.
  proposed_experiments:
  - experiment_id: exp_cmd2c_knockin_mouse
    name: Ppcs p.Glu233Val knock-in mouse
    description: >-
      Generate a homozygous knock-in of the recurrent human allele and measure
      cardiac CoA, acylcarnitines and echocardiographic function under fasting and
      infection-like stress, with and without dietary pantethine.

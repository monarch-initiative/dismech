animal_models:
- name: dPPCS1 hypomorphic Drosophila
  species: Drosophila melanogaster
  genotype: dPPCS1/dPPCS1 homozygous; P-element insertion in the 5' UTR of CG5629 that lowers dPPCS expression
  publication: PMID:29754768
  description: >-
    Homozygous hypomorphic dPPCS flies have reduced viability. Their pre-pupal hearts
    show higher heart rate and arrhythmia index, more wall shortening and shorter
    systolic length. Dietary pantethine rescues viability; vitamin B5 was used as a control.
    Null dPPCS alleles are lethal at the first larval instar. The allele is not a
    patient allele, and fly CoA levels were not reported in this study.
  modeled_mechanisms:
  - target: Cardiomyocyte Contractile Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Altered contraction parameters in the fly heart tube, which the authors take as analogous to dilated cardiomyopathy.
    limitations: >-
      The Drosophila heart is a tubular organ without chambers, so ejection fraction
      or dilation cannot be measured. The allele lowers dPPCS expression rather than
      reproducing a patient missense change. Cardiac function after pantethine was
      not reported.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Heart-tube kinematics in pre-pupae are a proxy for human ventricular systolic function.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: The expression-reducing P-element allele does not model the protein-destabilizing missense alleles in patients.
    evidence:
    - reference: PMID:29754768
      reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "With deeper inspection, dPPCS mutants presented with reduced viability, and moreover showed increased heart rate, increased arrhythmia index, reduced systolic function, and increased heart wall shortening, all manifestations indicative of dilate cardiomyopathy in fruit flies.31"
      explanation: The authors' reading of the fly cardiac phenotype.
    readouts:
    - name: Heart rate, arrhythmia index, wall shortening and systolic length
      target: Cardiomyocyte Contractile Dysfunction
      direction: ALTERED
      interpretation: Altered cardiac kinematics in homozygous hypomorphs compared with heterozygotes.
      evidence:
      - reference: PMID:29754768
        reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "In comparison with heterozygous dPPCS1 flies, homozygous dPPCS1 flies showed a significant increase in heart rate, heart wall shortening, and arrhythmia index and a decrease in systolic length (Figure 7)."
        explanation: The measurements behind this readout.
  - target: Cardiomyocyte Arrhythmogenicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Increased arrhythmia index in the fly heart.
    limitations: Arrhythmia index in a fly heart tube is not equivalent to ventricular arrhythmia in human myocardium.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Fly heart-tube rhythm irregularity is a proxy for human ventricular arrhythmia.
    evidence:
    - reference: PMID:29754768
      reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "In comparison with heterozygous dPPCS1 flies, homozygous dPPCS1 flies showed a significant increase in heart rate, heart wall shortening, and arrhythmia index and a decrease in systolic length (Figure 7)."
      explanation: Increased arrhythmia index in homozygotes.
  evidence:
  - reference: PMID:29754768
    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT

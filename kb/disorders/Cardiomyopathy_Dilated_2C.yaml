differential_diagnoses:
- name: Pantothenate kinase-associated neurodegeneration and COASY protein-associated neurodegeneration
  description: >-
    These other CoA-biosynthesis disorders cause neurodegeneration with brain iron
    accumulation and no cardiomyopathy. PPCS deficiency shows the opposite pattern:
    cardiomyopathy without brain iron accumulation.
  evidence:
  - reference: PMID:35397396
    reference_title: Generation of two human iPSC lines, HMGUi003-A and MRIi028-A, carrying pathogenic biallelic variants in the PPCS gene.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in PPCS cause autosomal-recessive dilated cardiomyopathy, often fatal, without apparent neurodegeneration, whereas pathogenic variants in PANK2 and COASY, two other genes involved in the CoA synthesis, cause Neurodegeneration with Brain Iron Accumulation (NBIA)."
    explanation: The contrast between the CoA-pathway disorders.
- name: Fatty acid oxidation disorders
  description: >-
    During crises, F1:II and F4:II had acylcarnitine and urine organic acid
    profiles suggesting VLCAD deficiency, and F1:II was first treated as VLCADD.
    Normal ACADVL testing should prompt PPCS analysis in a child with DCM and
    illness-triggered metabolic crises.
  evidence:
  - reference: PMID:40745475

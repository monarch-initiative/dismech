- name: Metabolic Decompensation During Catabolic Stress
  biological_scale: ORGANISM
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In several patients, intercurrent infection, fasting or poor feeding set off
    episodes of hypoglycemia, lactic acidosis, rhabdomyolysis, hyperammonemia or
    acute cardiac decompensation. Examples include viral upper respiratory infection
    in F1:II and CMV infection in F2:II.1. A mismatch between CoA-dependent energy
    metabolism and higher demand is a plausible explanation, but it has not been
    tested. The authors also suggest that antibiotics may disturb microbial
    production of CoA precursors; this idea is based on fruit-fly data.

name: Cardiomyopathy Dilated 2C
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cardiomyopathy, dilated, 2c
  term:
    id: MONDO:0032592
    label: cardiomyopathy, dilated, 2c
synonyms:
- CMD2C
- dilated cardiomyopathy 2C
- PPCS deficiency disorder
- PPCS DD
- PPCS-related dilated cardiomyopathy
- phosphopantothenoylcysteine synthetase deficiency
description: >-
  Cardiomyopathy, dilated, 2C (CMD2C; PPCS deficiency disorder) is an ultra-rare
  autosomal recessive cardiomyopathy caused by biallelic hypomorphic variants in
  PPCS. PPCS catalyzes the second step of de novo coenzyme A (CoA) biosynthesis
  from pantothenate (vitamin B5). Twelve patients from eight families have been
  reported (2018 index report of two families, a 2022 single case and a 2025 series).
  Presentation ranges from antenatal or neonatal onset to 21 years. Dilated
  cardiomyopathy is the constant feature and is often fatal in infancy or early
  childhood; ventricular arrhythmia and cardiac arrest occur in adolescents. Some
  genotypes, mostly with exon 1 or exon 2 variants, add hypotonia, myopathy,
  rhabdomyolysis and metabolic crises during intercurrent illness. Unlike PANK2- and
  COASY-related disease, there is no neurodegeneration with brain iron accumulation.
  Patient fibroblasts and iPSC-derived cardiomyocytes show reduced PPCS protein and
  reduced CoA. Patient cardiomyocytes and engineered heart patches show sarcomere
  disorganization, weak calcium transients, falling contractile force and
  arrhythmic events. The steps linking CoA deficiency to cardiomyocyte failure,
  including impaired fatty-acid activation and an energy deficit, are inferred, not
  measured. Pantethine bypasses the PPCS step and raises CoA in patient cells.
  Uncontrolled compassionate use in four patients was followed by stabilization or
  improvement alongside standard heart-failure care.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder
classifications:
  harrisons_chapter:

pathophysiology:
- name: Homozygous PPCS Missense Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Ten of the 12 patients are homozygous for a PPCS missense variant (NM_024664):
    p.Glu233Val in exon 3 (families B/F6, F3 and F5), or p.Tyr78His, p.Arg106Pro or
    p.Ala20Gly in exon 1 (families F1, F2 and F4). p.Glu233Val sits near the
    ATP-binding phosphate recognition site, close to the dimer interface.
    p.Arg106Pro lies in the dimerization region. p.Tyr78His and p.Ala20Gly
    destabilize helix packing near the catalytic site. No patient carries two
    loss-of-function alleles, which suggests that complete PPCS loss is not viable.
  genes:
  - preferred_term: PPCS
    term:
      id: hgnc:25686
      label: PPCS
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Partial loss of function is inferred from reduced but detectable protein and
      CoA in patient cells, and from the absence of biallelic null genotypes. Residual
      enzyme activity has not been measured in human tissue.

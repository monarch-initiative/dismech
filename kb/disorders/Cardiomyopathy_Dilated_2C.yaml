      label: Autosomal recessive inheritance
  description: >-
    Biallelic PPCS variants (homozygous, or compound heterozygous in trans) occur in
    all 12 reported patients. Full segregation was shown in consanguineous family B.
    Heterozygous parents and siblings in families B, F2 and F5 had no
    cardiomyopathy at screening. Seven of the 12 patients come from consanguineous
    families (F2, F4, F5 and the four affected siblings of family B/F6).

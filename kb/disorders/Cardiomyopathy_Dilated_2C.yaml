    reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Segregation analysis in all available family members confirmed full segregation, with all four affected siblings found to harbor the c.178A>T mutation in homozygous form, both parents and two of the four unaffected siblings (subjects IV.3 and IV.7) found to be heterozygous for the mutation, and the remaining two unaffected siblings (subjects IV.2 and IV.6) found to be wild-type."
    explanation: Full recessive segregation in the multiplex family. The source prints c.178A>T here, but the variant reported elsewhere in the paper for this family is c.698A>T.

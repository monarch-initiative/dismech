review_notes: >-
  This review uses the disease-defining 30-person clinical cohort and its
  patient-derived fibroblast and cerebral-organoid experiments. The abstract's
  phrase “36 cases” is not used as a clinical denominator because the full text
  explicitly catalogs 30 patients from 25 families. Frequency assignments are
  limited to explicit cohort counts or percentages. Causal edges are restricted
  to measured enzymatic, HA-synthesis, and organoid-proliferation relationships;
  human phenotypes remain unwired because the paper does not experimentally
  establish those downstream causal bridges. The zebrafish failure is retained
  as a model mismatch rather than presented as confirmatory evidence. No public
  disease-specific omics accession was identified in the article; source-data
  files are study supplements rather than a repository dataset. No matching
  GeneReviews chapter or repository deep-research artifact was found, and no
  disease-modifying treatment or disorder-specific clinical trial is established.

animal_models:
- name: Lamb2 null mouse
  species: Mouse
  genotype: Lamb2(-/-)
  publication: PMID:7670489
  description: >-
    Targeted null allele of the laminin beta2 gene. Mice develop massive
    proteinuria with a beta1-rich, disorganized GBM and abnormal neuromuscular
    junctions, modelling severe Pierson syndrome.
  modeled_mechanisms:
  - target: Disorganized Glomerular Basement Membrane
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The GBM retains laminin beta1 and is disorganized but intact, matching
      the composition change reported in patients.
    limitations: >-
      Mice die young, so chronic stages of the human disease are not modelled.
    evidence:
    - reference: PMID:16886065
      reference_title: "Proteinuria precedes podocyte abnormalities inLamb2-/- mice, implicating the glomerular basement membrane as an albumin barrier."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To investigate the GBM's role in glomerular filtration, we characterized GBM and overlying podocyte architecture in relation to development and progression of proteinuria in Lamb2-/- mice, which model Pierson syndrome, a rare congenital nephrotic syndrome."
      explanation: >-
        Used as the model of Pierson syndrome.
  - target: Glomerular Filtration Barrier Breakdown
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Early albuminuria and increased GBM ferritin permeability before foot
      process effacement.
    evidence:
    - reference: PMID:16886065
      reference_title: "Proteinuria precedes podocyte abnormalities inLamb2-/- mice, implicating the glomerular basement membrane as an albumin barrier."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GBM permeability to the electron-dense tracer ferritin was dramatically elevated in Lamb2-/- mice, even before widespread foot process effacement."
      explanation: >-
        Direct measurement of barrier failure.
  - target: Neuromuscular Junction Maldevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Aberrant differentiation of motor nerve terminals, matching the endplate
      lesion later seen in a patient biopsy.
    evidence:
    - reference: PMID:7885444
      reference_title: "Aberrant differentiation of neuromuscular junctions in mice lacking s-laminin/laminin beta 2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By generating and characterizing mice with a targeted mutation of the s-laminin gene, we show here that s-laminin regulates formation of motor nerve terminals."
      explanation: >-
        NMJ defect in the knockout.
- name: Lamb2 null mouse with podocyte laminin beta1 transgene
  species: Mouse
  genotype: Lamb2(-/-); podocyte-specific Lamb1 transgene
  publication: PMID:21876163
  description: >-
    Forced podocyte expression of laminin beta1 on the Lamb2 null background
    increases laminin-511 deposition in the GBM.
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Breakdown
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Podocyte laminin beta1 prevents nephrotic syndrome and extends lifespan,
      with less albuminuria at higher transgene expression.
    limitations: >-
      Supraphysiological transgene expression in mice; no means of raising
      LAMB1 in patients exists.
    evidence:
    - reference: PMID:21876163
      reference_title: "Forced expression of laminin beta1 in podocytes prevents nephrotic syndrome in mice lacking laminin beta2, a model for Pierson syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we generated several lines of Lamβ1 transgenic mice and used them to show that podocyte-specific Lamβ1 expression in Lamb2(-/-) mice abrogates the development of nephrotic syndrome, correlating with a greatly extended lifespan."
      explanation: >-
        Rescue of the filtration barrier.
- name: LAMB2 R246Q transgenic mouse
  species: Mouse
  genotype: Lamb2(-/-); rat R246Q-LAMB2 transgene
  publication: PMID:21511833
  description: >-
    Mutant rat laminin beta2 carrying the patient R246Q substitution replaces
    mouse laminin beta2 in the GBM.
  modeled_mechanisms:
  - target: Impaired Laminin-521 Secretion and Podocyte ER Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Proteinuria severity correlates inversely with mutant protein expression,
      consistent with a secretion defect.
    limitations: >-
      Transgene dosage, not the endogenous locus, sets the phenotype.
    evidence:
    - reference: PMID:21511833
      reference_title: "A missense LAMB2 mutation causes congenital nephrotic syndrome by impairing laminin secretion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vitro studies demonstrated that the R246Q mutation results in impaired secretion of laminin."
      explanation: >-
        Secretion defect of the missense protein.
- name: LAMB2 C321R transgenic mouse
  species: Mouse
  genotype: Lamb2(-/-); rat C321R-LAMB2 transgene
  publication: PMID:23723427
  description: >-
    Mutant rat laminin beta2 carrying the patient C321R substitution replaces
    mouse laminin beta2 in the GBM.
  modeled_mechanisms:
  - target: Impaired Laminin-521 Secretion and Podocyte ER Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Podocyte ER stress precedes proteinuria, which is attenuated but
      eventually progresses to renal failure.
    limitations: >-
      Transgene dosage, not the endogenous locus, sets the phenotype.
    evidence:
    - reference: PMID:23723427
      reference_title: "Laminin β2 gene missense mutation produces endoplasmic reticulum stress in podocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The C321R mutation caused defective secretion of laminin-521 from podocytes to the GBM accompanied by podocyte endoplasmic reticulum (ER) stress, likely resulting from protein misfolding."
      explanation: >-
        ER stress and secretion defect in vivo.
- name: Lamb2 Del44 mouse
  species: Mouse
  genotype: Lamb2 Del44 (44-amino-acid deletion in the LN domain)
  publication: PMID:32456966
  description: >-
    CRISPR-generated in-frame deletion in the laminin beta2 LN domain that
    reduces laminin polymerization; a long-lived model of chronic nephrotic
    syndrome.
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Breakdown
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Massive albuminuria with preserved kidney function for months, resembling
      the slower course of non-truncating human genotypes.
    limitations: >-
      The deletion arose by chance while modelling a human missense allele and
      does not correspond to a reported patient variant.
    evidence:
    - reference: PMID:32456966
      reference_title: "A deletion in the N-terminal polymerizing domain of laminin β2 is a new mouse model of chronic nephrotic syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Laminin heterotrimers containing LAMB2-Del44 exhibited a 90% reduction in polymerization in vitro that was partially rescued by type IV collagen and nidogen."
      explanation: >-
        The deletion impairs LN-domain polymerization.
    - reference: PMID:32456966
      reference_title: "A deletion in the N-terminal polymerizing domain of laminin β2 is a new mouse model of chronic nephrotic syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite the massive albuminuria, some Del44 mice survived for up to 15 months."
      explanation: >-
        Chronic course with barrier failure.

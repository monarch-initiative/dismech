- name: Impaired Laminin-521 Secretion and Podocyte ER Stress
  biological_scale: CELLULAR
  description: >-
    Some missense laminin beta2 proteins are poorly secreted from podocytes into
    the GBM. The C321R protein, which disrupts an invariant cysteine of the first
    EGF-like domain, is retained and causes podocyte endoplasmic reticulum
    stress with CHOP induction that precedes significant proteinuria. Shown in
    transgenic mice and cultured cells.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED

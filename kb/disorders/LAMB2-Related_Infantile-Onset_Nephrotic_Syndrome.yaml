  evidence:
  - reference: PMID:21511833
    reference_title: "A missense LAMB2 mutation causes congenital nephrotic syndrome by impairing laminin secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, these results suggest that the R246Q mutation causes nephrotic syndrome by impairing secretion of laminin-521 from podocytes into the GBM; however, increased expression of the mutant protein is able to overcome this secretion defect and improve glomerular permselectivity."
    explanation: >-
      Transgenic mice and cell studies show impaired secretion of the R246Q
      protein.
  - reference: PMID:23723427
    reference_title: "Laminin β2 gene missense mutation produces endoplasmic reticulum stress in podocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The C321R mutation caused defective secretion of laminin-521 from podocytes to the GBM accompanied by podocyte endoplasmic reticulum (ER) stress, likely resulting from protein misfolding."
    explanation: >-
      Transgenic mouse model of the C321R allele shows secretion defect and ER
      stress.
  - reference: PMID:23723427
    reference_title: "Laminin β2 gene missense mutation produces endoplasmic reticulum stress in podocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, ER stress preceded the onset of significant proteinuria and was manifested by induction of the ER-initiated apoptotic signal C/EBP homologous protein (CHOP), ER distention, and podocyte injury."
    explanation: >-
      ER stress is an early podocyte-intrinsic event in this allele.
  downstream:

- name: Hypoplasia of Ciliary and Pupillary Muscles
  biological_scale: TISSUE
  description: >-
    Laminin beta2 is most strongly expressed in the intraocular muscles, and its
    absence leaves the ciliary and pupillary muscles hypoplastic, producing
    fixed, narrow, non-reactive pupils (microcoria). Little residual laminin
    beta2 function appears to be enough for normal iris muscle development,
    which is why microcoria is largely confined to biallelic truncating
    genotypes.
  cell_types:
  - preferred_term: smooth muscle cell of sphincter of pupil
    term:
      id: CL:0002243
      label: smooth muscle cell of sphincter of pupil
  - preferred_term: ciliary muscle cell
    term:
      id: CL:1000443
      label: ciliary muscle cell

  - reference: PMID:15367484
    reference_title: "Human laminin beta2 deficiency causes congenital nephrosis with mesangial sclerosis and distinct eye abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By studying ocular laminin beta2 expression in unaffected controls, we detected the strongest expression in the intraocular muscles corresponding well to the characteristic hypoplasia of ciliary and pupillary muscles observed in patients."
    explanation: >-
      Links intraocular muscle expression to the muscle hypoplasia in patients.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This may suggest that only little residual function of laminin β2 is required for an apparently normal development and maintenance of the iris muscles."
    explanation: >-
      Explains why patients with a non-truncating allele usually lack
      microcoria.
  downstream:

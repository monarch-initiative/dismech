  preferred_term: LAMB2-Related Infantile-Onset Nephrotic Syndrome
  term:
    id: MONDO:0013621
    label: LAMB2-related infantile-onset nephrotic syndrome
synonyms:
- NPHS5
- nephrotic syndrome, type 5, with or without ocular abnormalities
- LAMB2-associated disease
- LAMB2-associated disorder
- LAMB2-related disorder

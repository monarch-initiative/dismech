diagnosis:
- name: LAMB2 molecular genetic testing
  description: >-
    Sequencing of all LAMB2 coding exons and flanking introns. Indicated in
    congenital or infantile nephrotic syndrome, especially with mesangial
    sclerosis or eye anomalies, in any child with congenital microcoria, and
    when NPHS1, NPHS2 and WT1 testing is negative. Genotype helps predict kidney
    prognosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:16912710
    reference_title: "Recessive missense mutations in LAMB2 expand the clinical spectrum of LAMB2-associated disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that mutational analysis in LAMB2 should be considered in congenital nephrotic syndrome, if no mutations are found in NPHS1, NPHS2, or WT1."
    explanation: >-
      Indication for LAMB2 testing.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of this gene may however still be justified in patients with congenital or infantile nephrosis, mesangial sclerosis on biopsy, and negative results upon testing for mutations in the genes NPHS1, NPHS2, WT1, and PLCE1."
    explanation: >-
      Testing strategy in isolated nephrosis.
  - reference: PMID:37705905
    reference_title: "Systematic Review of Clinical Characteristics and Genotype-Phenotype Correlation in LAMB2-Associated Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing is useful for predicting kidney prognosis."
    explanation: >-
      Prognostic value of genotype.
- name: Kidney biopsy
  description: >-
    Light microscopy typically shows diffuse mesangial sclerosis in congenital
    cases; FSGS, minimal change and mesangial proliferation are reported in
    later-onset cases.

    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 18 cases undergoing kidney biopsy, findings included focal segmental glomerulosclerosis in 10 cases, minimal change disease in 4 cases, diffuse mesangial sclerosis in 2 cases, IgM nephropathy in 1 case, and mesangial proliferation in 1 case."
    explanation: >-
      Biopsy findings across reported cases.
- name: Ophthalmological evaluation and follow-up
  description: >-
    Lifelong ophthalmological follow-up is needed because of the risk of
    retinal detachment even without congenital eye anomalies.
  evidence:
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, patients with a proven laminin β2 defect should receive careful ophthalmological follow-up, as they are obviously at high risk of retinal detachment even in the absence of significant congenital ocular anomalies."
    explanation: >-
      Rationale for ophthalmological surveillance.
treatments:
- name: Kidney transplantation
  description: >-
    The only long-term renal treatment; nephrotic syndrome has not been reported
    to recur in the graft, although long-term follow-up is limited.

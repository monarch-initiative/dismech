description: >-
  LAMB2-related infantile-onset nephrotic syndrome is the autosomal recessive
  spectrum of kidney disease caused by biallelic pathogenic variants in LAMB2,
  which encodes laminin beta2, the beta chain of laminin-521 (alpha5 beta2
  gamma1), the major laminin of the mature glomerular basement membrane (GBM),
  also present in the synaptic basal lamina of the neuromuscular junction, the
  intraocular muscles, the lens capsule and the retina. Its classic and most
  common presentation is Pierson syndrome (microcoria-congenital nephrosis
  syndrome): congenital nephrotic syndrome with diffuse mesangial sclerosis
  that progresses to kidney failure within the first year, fixed narrow pupils
  from hypoplastic ciliary and pupillary muscles, further ocular maldevelopment
  with a high risk of retinal detachment, and in many children hypotonia and
  psychomotor delay. Biallelic truncating variants act as null alleles and give
  the earliest onset and kidney failure, while missense and small in-frame
  variants, clustered in the laminin N-terminal (LN) domain, are associated with
  later onset of kidney disease, absence of neurologic abnormalities and absent
  or minor ocular changes, down to isolated nephrotic syndrome or asymptomatic
  proteinuria and hematuria. In the GBM, loss of laminin beta2 leaves a
  structurally intact but disorganized membrane in which laminin beta1 persists;
  in the null mouse albuminuria precedes podocyte foot process effacement,
  identifying the GBM itself as an albumin barrier. Some missense alleles also
  impair laminin-521 secretion and cause podocyte endoplasmic reticulum stress.
  A synaptic congenital myasthenic syndrome has been described in a long-term
  survivor with biallelic truncating variants. There is no specific therapy;
  renin-angiotensin system inhibition can reduce proteinuria in milder cases and
  kidney transplantation is the long-term renal treatment, without reported
  recurrence of nephrotic syndrome in the graft.
notes: >-
  MONDO:0013621 (OMIM 614199, nephrotic syndrome type 5 with or without ocular
  abnormalities) is the parent of Pierson syndrome (MONDO:0012184, OMIM 609049)
  in MONDO, so the whole LAMB2 nephropathy spectrum is curated here, with
  Pierson syndrome and isolated LAMB2 nephropathy as subtypes. The LAMB2
  synaptic congenital myasthenic syndrome reported by Maselli et al. occurred in
  a child who also had congenital nephrosis and microcoria, so it is represented
  here as part of the Pierson syndrome neuromuscular phenotype rather than as a
  separate entity; Congenital_Myasthenic_Syndrome lists LAMB2 among the synaptic
  CMS genes.
has_subtypes:
- name: Pierson syndrome
  display_name: Pierson syndrome (microcoria-congenital nephrosis syndrome)
  subtype_term:
    preferred_term: Pierson syndrome
    term:
      id: MONDO:0012184
      label: Pierson syndrome
  description: >-
    The classic oculorenal presentation: congenital nephrotic syndrome with
    diffuse mesangial sclerosis, microcoria and other ocular maldevelopment,
    usually with rapid progression to kidney failure. Typically caused by
    biallelic truncating variants, which lead to loss of laminin beta2
    expression.
  genes:
  - preferred_term: LAMB2
    term:
      id: hgnc:6487
      label: LAMB2
  evidence:
  - reference: PMID:15372515
    reference_title: "Congenital nephrosis, mesangial sclerosis, and distinct eye abnormalities with microcoria: an autosomal recessive syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that this syndrome should be designated microcoria-congenital nephrosis syndrome or Pierson syndrome."
    explanation: >-
      Clinical delineation and naming of the syndrome in two families.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding ocular manifestations, all patients harboring biallelic nonsense or frameshift mutations exhibited congenital microcoria in association with variable other eye abnormalities as reviewed previously (Bredrup et al., 2008), except for one unpublished case (patient 29.1)."
    explanation: >-
      Links biallelic truncating genotypes to the microcoria that defines this
      subtype.
- name: Isolated LAMB2 nephropathy
  display_name: Isolated or oligosymptomatic LAMB2 nephropathy
  description: >-
    Congenital or later-onset nephrotic syndrome, steroid-resistant nephrotic
    syndrome, or isolated proteinuria and hematuria without microcoria, with
    absent or minor ocular changes and without neurologic abnormalities. At
    least one allele is usually a missense, small in-frame or leaky splice
    variant, and kidney disease starts later and progresses more slowly than in
    Pierson syndrome. Patients without congenital eye anomalies remain at risk
    of later retinal detachment. Among patients with isolated nephrotic
    syndrome, LAMB2 variants are rare. No separate MONDO term exists for this
    form.
  genes:
  - preferred_term: LAMB2
    term:
      id: hgnc:6487
      label: LAMB2
  evidence:
  - reference: PMID:16912710
    reference_title: "Recessive missense mutations in LAMB2 expand the clinical spectrum of LAMB2-associated disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that the spectrum of LAMB2-associated disorders is broader than previously anticipated and includes congenital nephrotic syndrome without eye anomalies or with minor ocular changes different from those observed in Pierson syndrome."
    explanation: >-
      Original report of LAMB2 missense variants causing congenital nephrotic
      syndrome without the Pierson eye phenotype.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is an association of missense mutations and small in frame deletions with a higher mean age at onset of renal disease and with absence of neurologic abnormalities, thus suggesting that at least some of these may represent hypomorphic alleles."
    explanation: >-
      Genotype-phenotype review of 39 families distinguishing the milder
      missense-associated presentation.
  - reference: PMID:37705905
    reference_title: "Systematic Review of Clinical Characteristics and Genotype-Phenotype Correlation in LAMB2-Associated Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a few reports, some patients had isolated SRNS or proteinuria (i.e., without ocular or neuromuscular symptoms). These patients did not develop ESKD, and proteinuria responded to RAS-I treatment (Supplementary Table S3)."
    explanation: >-
      Systematic review documents an isolated renal form with a milder kidney
      course and treatment response.
  - reference: PMID:33476040
    reference_title: "An extremely mild clinical course in a case with LAMB2-associated nephritis diagnosed with next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the phenotypic spectrum of LAMB2-associated disorder is broader than expected, and cases with milder phenotypes such as isolated congenital or infantile nephrotic syndrome have also been reported."
    explanation: >-
      Case report placing isolated infantile nephrotic syndrome within the LAMB2
      spectrum.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generally, isolated NS is rarely caused by LAMB2 mutations (Hinkes et al., 2007)."
    explanation: >-
      Records that this presentation is uncommon among isolated nephrotic
      syndrome cohorts.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires homozygous or compound heterozygous LAMB2 variants;
    parental consanguinity is frequent in reported families.
  evidence:
  - reference: PMID:15372515
    reference_title: "Congenital nephrosis, mesangial sclerosis, and distinct eye abnormalities with microcoria: an autosomal recessive syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigrees of affected families with parental consanguinity support autosomal recessive inheritance."
    explanation: >-
      Pedigree evidence for recessive inheritance.
  - reference: PMID:15367484
    reference_title: "Human laminin beta2 deficiency causes congenital nephrosis with mesangial sclerosis and distinct eye abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the basis of homozygosity mapping to markers on chromosome 3p14-p22, we identified homozygous or compound heterozygous mutations of LAMB2 in patients from five unrelated families."
    explanation: >-
      Biallelic LAMB2 variants in affected individuals.
  - reference: PMID:37705905
    reference_title: "Systematic Review of Clinical Characteristics and Genotype-Phenotype Correlation in LAMB2-Associated Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is caused by variations in the LAMB2 gene, and the mode of inheritance is autosomal recessive."
    explanation: >-
      Systematic review statement of the inheritance mode.
pathophysiology:
- name: Biallelic LAMB2 Pathogenic Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous germline LAMB2 variants. Most are
    truncating (nonsense, frameshift, canonical splice) and distributed across
    the gene; these act as functional null alleles even when the truncation is
    near the C-terminus. Missense and small in-frame variants cluster in the LN
    domain that mediates laminin polymerization.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: LAMB2
    term:
      id: hgnc:6487

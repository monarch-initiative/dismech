    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephrectomy for the treatment of severe renal protein waste may be considered similar to the management of patients with Finnish type nephrosis (Holmberg et al., 1995), but it should be taken into account that ESRD, which usually occurs much earlier in patients with Pierson syndrome compared to Finnish type nephrosis, will spontaneously limit protein loss."
    explanation: >-
      Expert opinion on nephrectomy.

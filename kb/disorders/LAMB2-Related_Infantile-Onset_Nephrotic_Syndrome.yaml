- name: Ocular Maldevelopment of Lens, Cornea and Retina
  biological_scale: TISSUE
  description: >-
    Beyond the pupil, the eye shows complex maldevelopment including posterior
    lenticonus, cataract, enlarged corneas and retinal anomalies. High myopia
    develops in infancy and childhood, and retinal detachment and secondary
    glaucoma can occur even in patients without major congenital eye anomalies,
    leading to severe visual impairment.

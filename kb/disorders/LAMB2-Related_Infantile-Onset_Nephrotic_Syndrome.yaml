    causal_link_type: DIRECT
- name: Loss of Laminin-521 from Basement Membranes
  biological_scale: MOLECULAR
  description: >-
    Absence or reduction of laminin beta2, and hence of laminin-521, in the
    basement membranes where it is normally abundant: the GBM, the synaptic

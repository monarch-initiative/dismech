- name: Neuromuscular Junction Maldevelopment
  conforms_to: "neuromuscular_transmission_failure#Endplate Component Lesion"
  biological_scale: TISSUE
  description: >-
    Laminin beta2 is a muscle-derived component of the synaptic basal lamina
    that regulates differentiation of the motor nerve terminal. Its loss
    leaves small nerve terminals encased by Schwann cells, a widened primary
    synaptic cleft and simplified postsynaptic folds, as seen both in the null
    mouse and in a patient muscle biopsy.
  cell_types:

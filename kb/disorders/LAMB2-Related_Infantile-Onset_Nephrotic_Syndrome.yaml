- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    Many children with Pierson syndrome have psychomotor disability, and
    microcephaly can develop during the first year. Laminin beta2 deficiency in
    the central nervous system is proposed to contribute, but the mechanism is
    unknown, and some patients with presumed null genotypes develop normally.
  evidence:
  - reference: PMID:37705905
    reference_title: "Systematic Review of Clinical Characteristics and Genotype-Phenotype Correlation in LAMB2-Associated Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the fact that decreased laminin β2 expression at neuromuscular junction causes muscular hypotonia, these authors also suggest that laminin β2 is involved in the central nervous system and that decreased laminin β2 expression may cause psychomotor disabilities, although the detailed mechanism remains unknown."
    explanation: >-
      States the proposed but unproven CNS mechanism.
  - reference: PMID:15367484
    reference_title: "Human laminin beta2 deficiency causes congenital nephrosis with mesangial sclerosis and distinct eye abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we present first clinical evidence of severe impairment of vision and neurodevelopment due to LAMB2 defects."
    explanation: >-
      First report of neurodevelopmental impairment with LAMB2 defects.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, we are aware of several patients (case 21.1, 24.1, 29.1, 31.1, 32.1, and 35.1; Table 2) with either truncating or splice site mutations on each allele, who had a normal neurologic and cognitive development up to the age of 4–21 years (Bredrup et al., 2008; Choi et al., 2008; Wuhl et al., 2007)."
    explanation: >-
      Neurodevelopmental impairment is not invariant, even with presumed null
      genotypes.
  downstream:

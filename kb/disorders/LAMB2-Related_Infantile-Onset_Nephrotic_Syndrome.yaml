- name: Disorganized Glomerular Basement Membrane
  biological_scale: TISSUE
  description: >-
    Without laminin beta2 the GBM fails the developmental switch from
    laminin beta1 to beta2 and stays rich in beta1. It is ultrastructurally
    intact and contains normal collagenous components, but shows ectopic
    deposition of several laminins and mislocalized anionic sites. Laminin beta1
    is marginally increased but does not compensate.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: glomerular basement membrane development
    modifier: ABNORMAL
    term:
      id: GO:0032836
      label: glomerular basement membrane development
  evidence:
  - reference: PMID:7670489
    reference_title: "The renal glomerulus of mice lacking s-laminin/laminin beta 2: nephrosis despite molecular compensation by laminin beta 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutant mice that lack beta 2, the GBM remains rich in beta 1, suggesting that a feedback mechanism normally regulates GBM maturation."
    explanation: >-
      The Lamb2-null GBM retains the immature laminin beta1.
  - reference: PMID:16886065
    reference_title: "Proteinuria precedes podocyte abnormalities inLamb2-/- mice, implicating the glomerular basement membrane as an albumin barrier."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found ectopic deposition of several laminins and mislocalization of anionic sites in the GBM, which together suggest that the Lamb2-/- GBM is severely disorganized, although it is ultrastructurally intact."
    explanation: >-
      Characterizes the disorganized but intact GBM in the null mouse.
  - reference: PMID:21876163
    reference_title: "Forced expression of laminin beta1 in podocytes prevents nephrotic syndrome in mice lacking laminin beta2, a model for Pierson syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In both Pierson syndrome and the Lamb2(-/-) mouse model for this disease, laminin β1 (Lamβ1), a structurally similar homolog of Lamβ2, is marginally increased in the GBM, but it fails to fully compensate for the loss of Lamβ2, leading to the filtration barrier defects and nephrotic syndrome."
    explanation: >-
      States the same GBM composition change in patients and mice.
  downstream:
  - target: Glomerular Filtration Barrier Breakdown
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16886065
      reference_title: "Proteinuria precedes podocyte abnormalities inLamb2-/- mice, implicating the glomerular basement membrane as an albumin barrier."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GBM permeability to the electron-dense tracer ferritin was dramatically elevated in Lamb2-/- mice, even before widespread foot process effacement."
      explanation: >-
        The disorganized GBM is itself abnormally permeable.
- name: Glomerular Filtration Barrier Breakdown
  conforms_to: "nephrotic_podocyte_injury#Glomerular Filtration Barrier Breakdown"
  biological_scale: TISSUE
  description: >-
    The laminin beta2-deficient GBM loses permselectivity, so albumin crosses
    the barrier. Here the initiating defect is in the GBM rather than the
    podocyte: in the null mouse albuminuria appears shortly after birth, at
    least 7 days before foot process effacement, while slit diaphragm proteins
    are still normal.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: glomerular filtration
    modifier: ABNORMAL

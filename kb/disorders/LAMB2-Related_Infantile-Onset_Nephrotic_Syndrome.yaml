    modifier: DECREASED
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  evidence:
  - reference: PMID:15367484
    reference_title: "Human laminin beta2 deficiency causes congenital nephrosis with mesangial sclerosis and distinct eye abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most disease-associated alleles were truncating mutations."
    explanation: >-
      Truncating alleles predominate in the gene-discovery series.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although truncating mutations are distributed across the entire gene, missense mutations are clearly clustered in the N-terminal LN domain, which is important for intermolecular interactions."
    explanation: >-
      Distribution of the two allele classes.
  - reference: PMID:20556798
    reference_title: "Mutations in the human laminin beta2 (LAMB2) gene and the associated phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, all truncating mutations known to date likely represent functional null alleles."
    explanation: >-
      Truncating variants as null alleles.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, albuminuria was detectable shortly after birth and preceded podocyte foot process effacement and loss of slit diaphragms by at least 7 days."
    explanation: >-
      Barrier failure precedes podocyte changes in the null mouse.
  - reference: PMID:7670489

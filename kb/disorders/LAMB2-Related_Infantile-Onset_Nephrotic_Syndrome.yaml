    snippet: "Kidney transplantation is currently the only long-term renal treatment option. There is so far no evidence of recurrence of mesangial sclerosis in the transplant, but the number of successfully transplanted patients who could be monitored for a longer time is very small."
    explanation: >-
      Transplantation as the definitive renal treatment.

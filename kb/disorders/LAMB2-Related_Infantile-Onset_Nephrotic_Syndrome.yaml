    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By generating and characterizing mice with a targeted mutation of the s-laminin gene, we show here that s-laminin regulates formation of motor nerve terminals."
    explanation: >-
      Knockout establishes laminin beta2 as a regulator of nerve terminal

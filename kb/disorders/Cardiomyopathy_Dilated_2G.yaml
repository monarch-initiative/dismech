      snippet: Overall, the faster calcium release and reuptake kinetics of LMOD2 W398* cardiomyocytes provide a potential explanation for the decreased contraction time observed in these cells.
      explanation: Calcium handling is altered in mutant cultured cardiomyocytes; the upstream molecular cause remains unresolved.

pathophysiology:
- name: Biallelic LMOD2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMD2G is a homozygous loss-of-function variant in
    LMOD2, encoding the actin-binding protein leiomodin-2. The first reported allele
    was the nonsense change c.1193G>A (p.Trp398Ter). Because inheritance is
    recessive, affected neonates have no functional leiomodin-2 at all, which is why
    the phenotype is present from birth rather than developing over decades as in
    the dominant members of this series.

description: Dilated cardiomyopathy 2G (CMD2G) is an early-onset, predominantly cardiac disorder caused by biallelic LMOD2 variants. Homozygous and compound-heterozygous nonsense, frameshift, and splice-site variants impair leiomodin-2, a regulator of sarcomeric actin pointed-end elongation. Severe thin-filament shortening and reduced contractile force have been demonstrated in patient myocardium. Presentation ranges from fetal or neonatal cardiac dysfunction to symptomatic disease later in infancy; neonatal lethality is not universal, and several children have undergone heart transplantation. Transcript loss, residual mutant protein, calcium dysregulation, and actin-dependent transcriptional changes vary by allele and model. ClinGen classifies the autosomal recessive LMOD2-CMD2G relationship as Definitive.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Homozygous or compound-heterozygous pathogenic LMOD2 variants cause CMD2G. Confirm parental segregation before recurrence-risk counseling. Clinically unaffected heterozygous relatives have been reported, but adult biobank associations mean that lifelong absence of cardiac risk should not be assumed.
  evidence:
  - reference: CGGV:assertion_d19140d6-8200-4fce-9906-fdda527a4f7e-2026-03-04T170000.000Z
    reference_title: LMOD2 / cardiomyopathy, dilated, 2G (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: LMOD2 | HGNC:6648 | cardiomyopathy, dilated, 2G | MONDO:0030887 | AR | Definitive
    explanation: The March 2026 ClinGen assertion is specific to CMD2G and supports definitive recessive gene-disease validity.
  - reference: PMID:34888509
    reference_title: Early Death of 2 Siblings Related to Mutations in LMOD2, a Recently Discovered Cause of Neonatal Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a family with 2 neonatal deaths related to dilated cardiomyopathy (DCM) and compound heterozygous loss-of-function variants (c.1243_1244del, p.Leu415Valfs*108 and c.1537C > T, p.Arg513*) in Leiomodin 2 (LMOD2), a recently documented cause of early DCM.
    explanation: Two genetically confirmed siblings establish that disease is not restricted to homozygous variants.
prevalence:
- population: Published LMOD2-related cardiomyopathy cases through the 2023 report
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: The 2023 report described the seventh published patient. This is a dated literature count, not a population prevalence estimate or a current exhaustive census.
  evidence:
  - reference: PMID:37296576
    reference_title: Whole-Exome Sequencing Identifies Homozygote Nonsense Variants in LMOD2 Gene Causing Infantile Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The present case of infantile cardiomyopathy is the second report of p.W398* LMOD2, the fifth report in the homozygous loss of leiomodin 2 protein expression, and the seventh patient of LMOD2-related DCM.
    explanation: The explicit patient count supports rarity without inventing a population denominator.

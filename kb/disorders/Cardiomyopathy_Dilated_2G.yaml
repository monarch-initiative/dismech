phenotypes:
- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: Severe ventricular dilation and systolic dysfunction, usually early in life but not restricted to birth.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:35188328
    reference_title: LMOD2-related dilated cardiomyopathy presenting in late infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initial echocardiogram demonstrated dilated cardiomyopathy (LV diastolic dimension of 3.82 cm, Z-score 5.06) with severely depressed LV systolic function (ejection fraction or EF of 15%).
    explanation: Human imaging establishes dilation and systolic dysfunction in later infancy.
  - reference: PMID:35188328
    reference_title: LMOD2-related dilated cardiomyopathy presenting in late infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a third family with a child harboring a previously described homozygous frameshift variant, c.1243_1244delCT (p.L415Vfs*108) with DCM, presenting later in infancy at 9 months of age.
    explanation: The documented nine-month presentation contradicts an obligately neonatal onset.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because of rapid growth in children, expert cardiovascular assessment is recommended to assess left ventricular enlargement in the pediatric population.
    explanation: General DCM clinical baseline, not LMOD2-specific frequency evidence.
    quote_role: REVIEW_SYNTHESIS

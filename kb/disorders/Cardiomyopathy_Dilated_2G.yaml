- name: Dysregulated Thin-Filament Length
  biological_scale: MOLECULAR
  role: effector
  description: >-
    Leiomodin-2 nucleates and elongates actin at the pointed end of the sarcomeric
    thin filament, setting its length. Losing it dysregulates thin-filament length,
    which changes the extent of thin-thick filament overlap available for
    cross-bridge formation. This is a geometric lesion unique within the series: the
    motor, its calcium regulation, its scaffold and its quality-control machinery
    are all intact, but the filament they act on is built to the wrong specification.
    Patient-derived iPSC-cardiomyocytes and a mouse model carrying the homologous
    mutation both show this dysregulation.

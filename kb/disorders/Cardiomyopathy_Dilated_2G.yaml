genetic:
- name: LMOD2
  gene_term:
    preferred_term: LMOD2
    term:
      id: hgnc:6648
      label: LMOD2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: CGGV:assertion_d19140d6-8200-4fce-9906-fdda527a4f7e-2026-03-04T170000.000Z
    reference_title: LMOD2 / cardiomyopathy, dilated, 2G (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: LMOD2 | HGNC:6648 | cardiomyopathy, dilated, 2G | MONDO:0030887 | AR | Definitive
    explanation: The March 2026 ClinGen assertion is specific to CMD2G and supports definitive recessive gene-disease validity.
  - reference: PMID:34888509
    reference_title: Early Death of 2 Siblings Related to Mutations in LMOD2, a Recently Discovered Cause of Neonatal Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a family with 2 neonatal deaths related to dilated cardiomyopathy (DCM) and compound heterozygous loss-of-function variants (c.1243_1244del, p.Leu415Valfs*108 and c.1537C > T, p.Arg513*) in Leiomodin 2 (LMOD2), a recently documented cause of early DCM.
    explanation: Two genetically confirmed siblings establish that disease is not restricted to homozygous variants.
  - reference: PMID:31517052
    reference_title: 'Disruption of cardiac thin filament assembly arising from a mutation in LMOD2: A novel mechanism of neonatal dilated cardiomyopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing identified a biallelic homozygous nonsense variant (c.1193G > A, p.Trp398*) in a candidate gene LMOD2, which encodes Lmod2.
    explanation: Founding nonsense allele identified by exome sequencing.
  - reference: PMID:35082396
    reference_title: Neonatal-lethal dilated cardiomyopathy due to a homozygous LMOD2 donor splice-site variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing identified a homozygous LMOD2 variant in both siblings, (GRCh38)chr7:g.123656237G > A; NM_207163.2:c.273 + 1G > A, ablating the donor 5' splice-site of intron-1.
    explanation: The donor splice-site allele extends the loss-of-function spectrum.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d19140d6-8200-4fce-9906-fdda527a4f7e-2026-03-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_d19140d6-8200-4fce-9906-fdda527a4f7e-2026-03-04T170000.000Z
      reference_title: LMOD2 / cardiomyopathy, dilated, 2G (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: LMOD2 | HGNC:6648 | cardiomyopathy, dilated, 2G | MONDO:0030887 | AR | Definitive
      explanation: The March 2026 ClinGen assertion is specific to CMD2G and supports definitive recessive gene-disease validity.
  notes: Established alleles include c.1193G>A (p.Trp398Ter), c.1537C>T (p.Arg513Ter), c.1243_1244delCT (p.Leu415ValfsTer108), and c.273+1G>A. Homozygosity and compound heterozygosity are both documented. The Leu415 frameshift preserves more mutant protein in minigene assays than the two studied nonsense alleles. The same Trp398Ter allele has neonatal and four-month presentations, so onset cannot be inferred from genotype alone. No population penetrance estimate is established.

- name: Reduced Functional Leiomodin-2
  biological_scale: MOLECULAR
  description: Functional leiomodin-2 is markedly reduced. W398Ter patient myocardium had undetectable protein, while patient-derived cardiomyocytes and the homologous W405Ter mouse retained truncated protein. In minigene assays, Leu415ValfsTer108 did not significantly lower mutant protein abundance; this distinguishes loss of normal function from an invariant null state.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:31517052
    reference_title: 'Disruption of cardiac thin filament assembly arising from a mutation in LMOD2: A novel mechanism of neonatal dilated cardiomyopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Full-length or truncated Lmod2 was not detected in the LV of the proband’s explanted heart via Western blot analysis
    explanation: The W398Ter proband had undetectable protein in the explanted ventricle.
  - reference: PMID:39285234
    reference_title: Leiomodin 2 neonatal dilated cardiomyopathy mutation results in altered actin gene signatures and cardiomyocyte dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Immunoblot analysis confirmed LMOD2 W398* hiPSC-CMs express truncated LMOD2 protein
    explanation: The corresponding patient-derived cellular model retains truncated protein, so complete absence cannot be assumed in every system.
  - reference: PMID:38748723
    reference_title: Human disease-causing mutations result in loss of leiomodin 2 through nonsense-mediated mRNA decay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: while another unstudied mutation (p.V415fs*108) does not significantly decrease mutant protein levels.
    explanation: The source uses this abbreviated spelling for the Leu415ValfsTer108 frameshift discussed in the same paragraph. Its abundance differs from the nonsense alleles.

  biological_scale: MOLECULAR
  description: Nonsense-mediated decay lowers mature LMOD2 mRNA carrying W398Ter or Arg513Ter in intron-containing human constructs. Mature RNA falls while pre-mRNA is preserved, and translation inhibition or exon-junction-complex blockade increases mutant RNA/protein. This mechanism is experimentally established for these nonsense alleles; it is not a blanket explanation for all CMD2G variants.

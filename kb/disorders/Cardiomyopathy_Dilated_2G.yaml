  status: EMERGING
  description: Loss of normal LMOD2-mediated actin assembly may increase G-actin, reduce MRTFB nuclear localization, and suppress SRF target genes. Molecular and transcriptional observations support this model, but the causal sequence and contribution to human disease need intervention experiments.
  evidence:
  - reference: PMID:39285234

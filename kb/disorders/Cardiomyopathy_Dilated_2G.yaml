- name: Experimental LMOD2 replacement
  description: AAV delivery of full-length Lmod2 rescued structural and functional abnormalities in mouse models. This is preclinical evidence; efficacy, dosing, delivery safety, and durability in children have not been established by these experiments.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Reduced Functional Leiomodin-2
    description: Restores leiomodin-2 in the experimental system.
  evidence:
  - reference: PMID:26487682
    reference_title: Knockout of Lmod2 results in shorter thin filaments followed by dilated cardiomyopathy and juvenile lethality.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Introduction of GFP-Lmod2 via adeno-associated viral transduction elongates thin filaments and rescues structural and functional defects observed in Lmod2-KO mice, extending their lifespan to adulthood.
    explanation: Mouse rescue supports therapeutic research, not established patient care.
- name: Experimental steric blockade of LMOD2 nonsense-mediated decay
  description: LMOD2-directed steric-blocking oligonucleotides restored mutant transcript/protein in engineered HEK293-derived cells by blocking exon-junction-complex deposition. Rescue of cardiac function in patients or patient-derived cardiomyocytes was not shown. Restored truncated protein need not be fully functional.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  oligonucleotide_details:

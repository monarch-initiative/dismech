name: Dilated Cardiomyopathy 2G
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- CMD2G
- LMOD2 dilated cardiomyopathy
- cardiomyopathy, dilated, 2G
- leiomodin-2-related dilated cardiomyopathy
- LMOD2 neonatal dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 2G (CMD2G) is the LMOD2-related form of dilated
  cardiomyopathy, and the most severe member of the series curated here: a
  recessive, neonatal-onset disease that is frequently lethal in the first weeks to
  months of life. LMOD2 encodes leiomodin-2, an actin-binding protein that sets
  the length of the sarcomeric thin filament by nucleating and elongating actin
  from the pointed end. Thin-filament length is a determinant of the overlap
  between thin and thick filaments and therefore of how much force the sarcomere
  can generate at a given sarcomere length, so a leiomodin-2 defect degrades
  contraction by mis-specifying the geometry of the contractile apparatus rather
  than by damaging the motor, its regulation, or its scaffold. Disease is caused by
  homozygous biallelic variants; the first reported allele was the nonsense change
  p.Trp398Ter. Patient-derived iPSC-cardiomyocytes and a matched mouse model show
  dysregulated actin-thin filament lengths together with altered contractility and
  calcium handling. ClinGen classifies the LMOD2-dilated cardiomyopathy
  relationship as Definitive with autosomal recessive inheritance.

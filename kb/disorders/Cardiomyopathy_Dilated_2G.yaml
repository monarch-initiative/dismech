discussions:
- discussion_id: heterozygous_lmod2_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What cardiac risk do heterozygous LMOD2 truncating variants confer across the lifespan?
  attaches_to:
  - inheritance#Autosomal recessive
  - genetic#LMOD2
  rationale: Pediatric pedigrees include asymptomatic carriers with incomplete cardiac evaluation, whereas biobank analyses suggest an adult monoallelic association. These observations do not establish high-penetrance dominant CMD2G or a uniform surveillance interval.
  evidence:
  - reference: PMID:38666070
    reference_title: Exploring the complex spectrum of dominance and recessiveness in genetic cardiomyopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Several of these genes have monoallelic association with disease outcomes and cardiac traits in the UK Biobank, including LMOD2 and ALPK3 with dilated and hypertrophic CM, respectively.
    explanation: The association study warrants caution about assuming that every carrier is unaffected for life.
  - reference: PMID:35188328
    reference_title: LMOD2-related dilated cardiomyopathy presenting in late infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Evaluation by ECG and echocardiogram have not been performed on parents or carrier siblings.
    explanation: Absence of reported symptoms in this family does not establish normal cardiac testing.
- discussion_id: lmod2_model_severity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why does the homologous W405Ter mouse retain more protein and develop a milder course than severe human W398Ter cardiomyopathy?
  attaches_to:
  - pathophysiology#Reduced Functional Leiomodin-2
  - animal_models#Mouse
  rationale: Allele-matched mice, patient-derived cells, and explanted human myocardium differ in residual protein and disease timing. Differences in RNA surveillance, maturation, loading, and terminal disease remodeling may affect translation of rescue experiments.
  evidence:
  - reference: PMID:39285234
    reference_title: Leiomodin 2 neonatal dilated cardiomyopathy mutation results in altered actin gene signatures and cardiomyocyte dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Immunoblot analysis of LV tissue at P70 showed that mutant mice express truncated Lmod2 protein at approximately 45% of wild-type (full-length) Lmod2 levels
    explanation: The in vivo mouse allele retains substantial protein.
  - reference: PMID:31517052
    reference_title: 'Disruption of cardiac thin filament assembly arising from a mutation in LMOD2: A novel mechanism of neonatal dilated cardiomyopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Full-length or truncated Lmod2 was not detected in the LV of the proband’s explanted heart via Western blot analysis
    explanation: The W398Ter proband had undetectable protein in the explanted ventricle.

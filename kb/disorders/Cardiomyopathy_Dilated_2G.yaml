histopathology:
- name: Myofibrillar disarray and Z-disc abnormalities
  description: Patient myocardium can show disorganized myofibrils and widened or streamed Z-discs. Findings differ between cases and do not establish a generalized skeletal myopathy.
  evidence:
  - reference: PMID:31517052
    reference_title: 'Disruption of cardiac thin filament assembly arising from a mutation in LMOD2: A novel mechanism of neonatal dilated cardiomyopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Deconvolution immunofluorescence microscopy of LV cryosections from the patient’s heart revealed myofibrillar disarray and wide Z-discs
    explanation: Human myocardial ultrastructure supports sarcomeric architectural disturbance.
- name: Myocardial fibrosis
  description: Interstitial and subendocardial fibrosis occur in some severely affected hearts; the later-infantile frameshift case had only mild interstitial fibrosis and no significant endocardial fibrosis or myocardial disarray.
  evidence:
  - reference: PMID:31517052
    reference_title: 'Disruption of cardiac thin filament assembly arising from a mutation in LMOD2: A novel mechanism of neonatal dilated cardiomyopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Marked fibrosis (blue) is present throughout the subendocardium of both ventricles with patchy interstitial nonreplacement-type perimyocyte fibrosis
    explanation: Histological evidence from the founding patient.
  - reference: PMID:35188328
    reference_title: LMOD2-related dilated cardiomyopathy presenting in late infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Microscopic examination with H&E staining of both ventricles showed moderately hypertrophied myocytes with focal areas of mild interstitial fibrosis but no significant endocardial fibrosis or myocardial disarray.
    explanation: The later-infantile case establishes histological variability.

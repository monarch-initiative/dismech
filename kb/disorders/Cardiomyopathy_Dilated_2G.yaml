    target_gene:
      preferred_term: LMOD2
      term:
        id: hgnc:6648
        label: LMOD2
    target_transcript: LMOD2 exon-junction-complex binding region upstream of the exon 2-exon 3 junction
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
  target_mechanisms:
  - target: Nonsense-Mediated LMOD2 Transcript Decay
    description: Prevents recognition of selected premature-termination transcripts by the exon-junction-complex-dependent decay pathway.
  evidence:
  - reference: PMID:38748723
    reference_title: Human disease-causing mutations result in loss of leiomodin 2 through nonsense-mediated mRNA decay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, we generated steric-blocking oligonucleotides that obstruct deposition of the exon junction complex, preventing nonsense-mediated mRNA decay of mutant LMOD2 transcripts, thereby restoring mutant protein expression.
    explanation: Cell-based proof of concept for allele-selective transcript rescue.

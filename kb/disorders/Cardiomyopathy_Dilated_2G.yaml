    - reference: PMID:42477321
      reference_title: Leiomodin 2 is a processive pointed-end elongator of actin filaments.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Removal of the C-terminal WH2-containing region in this disease-associated variant results in a substantial reduction in elongation rate and processivity
      explanation: Single-filament experiments support impaired pointed-end polymerization for the W398Ter-related truncation.
  - target: Altered Cardiomyocyte Calcium Handling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Calcium transients are perturbed after loss of normal LMOD2; intermediate steps are unresolved.
    evidence:
    - reference: PMID:39285234
      reference_title: Leiomodin 2 neonatal dilated cardiomyopathy mutation results in altered actin gene signatures and cardiomyocyte dysfunction.
      supports: SUPPORT

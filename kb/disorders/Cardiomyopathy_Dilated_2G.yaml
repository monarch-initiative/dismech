notes: >-
  CMD2G is the LMOD2 member of the dilated cardiomyopathy series and carries
  ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  It is distinctive on two axes. Mechanistically, it is a *geometric* lesion: the
  motor, its calcium regulation, its Z-disc scaffold and its quality-control
  machinery are all intact, but leiomodin-2 sets sarcomeric thin-filament length,
  so its loss builds the filament to the wrong specification and degrades the
  thin-thick overlap available for force generation. Clinically, it is the severe
  recessive pole of the series - biallelic loss means the neonatal heart never has
  functional leiomodin-2, so there is no compensated phase and presentation is at
  birth, frequently lethal, in contrast to the adult-onset dominant members.

  Evidence-scope caveat: the mechanism nodes rest on patient-derived
  iPSC-cardiomyocytes plus a mouse model carrying the homologous mutation, both
  from a single study of the first reported allele (p.Trp398Ter). The evidence is
  strong for that allele in two systems including human cells, but the entity is
  ultra-rare and cohort-scale human data do not exist; the SRF-signaling arm in
  particular is curated as an observed accompaniment rather than an established
  causal step.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary LMOD2 cohort and pedigree literature
  cited throughout, principally PMID:39285234.

- name: cGAS-STING Activation by Undegraded Self DNA
  conforms_to: "cgas_sting_pathway_activation#Cytosolic DNA Accumulation and cGAS-Dependent cGAMP Synthesis"
  description: >-
    DNA that escapes lysosomal degradation is detected by cGAS, which synthesizes
    cGAMP and activates STING. This is the DNASE2-specific substitution at the
    module's entry node: the DNA reaches cGAS from a failed lysosomal digestion
    rather than from loss of a cytosolic nuclease such as TREX1. The route by
    which lysosomal DNA reaches cytosolic cGAS is not established in the cited
    sources. The pathway dependence is shown genetically in mice: cGAMP
    accumulates in DNase II-deficient tissues in a cGAS-dependent way, and
    deleting cGas or Sting rescues both the embryonic lethality and the
    arthritis.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:

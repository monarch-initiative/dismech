- name: STING-TBK1-Driven Proinflammatory Cytokine Production
  description: >-
    STING signaling also drives an interferon-independent proinflammatory cytokine
    arm. In patients the serum cytokine pattern overlaps that of STING
    gain-of-function disease, with raised TNF-alpha and variable IL-1beta and
    IL-6. Mouse work shows this arm runs through TBK1 recruitment to STING and
    NF-kB rather than through IRF3 and type I interferon: a STING mutant that
    cannot induce interferon still causes TNF- and IL-6-dependent polyarthritis.
    This arm is the likely driver of the deforming arthropathy.
  role: central_effector

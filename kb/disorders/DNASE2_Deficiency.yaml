treatments:
- name: JAK Inhibition (Ruxolitinib)
  description: >-
    JAK1/2 inhibition with ruxolitinib blocks the JAK-STAT signaling driven by
    type I interferon. It has been followed by clinical and laboratory
    improvement, including recovery of cytopenias, resolution of cholestasis and
    reduction of inflammation, in reported patients, including a preterm neonate.
    In the index study, ruxolitinib reduced STAT1 and STAT3 phosphorylation in
    patient cells in vitro.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Type I Interferon Overproduction and JAK-STAT Signaling
    description: Blocks JAK1/2 downstream of the type I interferon receptor, interrupting the interferon-driven signaling.
  evidence:
  - reference: PMID:42491852
    reference_title: "Severe Antenatal Presentation of a Novel Dnase2 Mutation in a Preterm Omani Neonate: Expanding the Clinical Spectrum of an Ultra-Rare Interferonopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "treatment with ruxolitinib in our patient resulted in marked clinical and laboratory improvement, supporting its role as a potentially disease-modifying therapy in Dnase2 deficiency"
    explanation: Clinical and laboratory improvement on ruxolitinib in the antenatal-onset case.
  - reference: PMID:29259162
    reference_title: "Type I interferon-mediated autoinflammation due to DNase II deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Increased phosphorylation of STAT1 and STAT3 observed in cultured lymphocytic-enriched fractions from F1:V-1 compared to a healthy control (HC), treated or not with the JAK1/2 inhibitor ruxolitinib."
    explanation: >-
      Ruxolitinib reduced STAT1/STAT3 phosphorylation in patient cells in vitro,
      the mechanistic rationale for JAK inhibition. Indirect because it is an
      ex vivo cellular readout rather than a clinical outcome.

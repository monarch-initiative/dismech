- name: Interferon-Driven Suppression of Fetal and Neonatal Erythropoiesis
  description: >-
    Type I interferon produced by DNA-laden macrophages acts on erythropoiesis.
    In DNase II-null mice interferon-beta from resident fetal liver macrophages
    causes a lethal anemia that is rescued by deleting the type I interferon
    receptor. In patients the neonatal anemia is non-regenerative with increased
    circulating erythroblasts and reticulocyte counts inappropriate for the
    hemoglobin, a picture of ineffective erythropoiesis, and recombinant
    interferon alpha increased apoptosis of cord-blood erythroid progenitors.

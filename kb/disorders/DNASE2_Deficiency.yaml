name: DNASE2 Deficiency
creation_date: '2026-10-14T12:36:44Z'
category: Mendelian
description: >-
  DNASE2 deficiency is an autosomal recessive type I interferonopathy caused by
  biallelic loss-of-function variants in DNASE2, which encodes deoxyribonuclease
  II, the acid endonuclease that digests DNA inside lysosomes. Macrophages rely on
  it to degrade the nuclei expelled by maturing erythroblasts and the chromatin of
  engulfed apoptotic cells. When it fails, undigested self DNA engages the
  cGAS-STING DNA-sensing pathway, and the result is constitutive type I interferon
  production with a high interferon-stimulated gene signature, plus an
  interferon-independent proinflammatory cytokine arm.

  The presentation is neonatal: severe non-regenerative anemia and thrombocytopenia
  needing transfusion, hepatosplenomegaly and cholestatic hepatitis, sometimes
  beginning before birth with fetal anemia and hydrops. In the published patients
  the neonatal cytopenias resolved over weeks to months and were followed in
  childhood by recurrent fevers, membranoproliferative glomerulonephritis with
  proteinuria, hepatic fibrosis, a deforming arthropathy with contractures,
  vasculitic and nodular skin lesions, chilblain-like lesions, lipodystrophy,
  anti-DNA autoantibodies and failure to thrive. Two of the three index patients
  had subcortical white matter lesions on MRI with learning difficulties. Fewer
  than fifteen patients are reported. JAK1/2 inhibition has
  been followed by clinical improvement in several of them.
synonyms:
- DNase II deficiency
- Autoinflammatory-pancytopenia syndrome
- Autoinflammatory-pancytopenia syndrome due to DNASE2 deficiency
- Type I interferonopathy due to DNase II deficiency

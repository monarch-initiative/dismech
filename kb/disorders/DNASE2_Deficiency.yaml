pathophysiology:
- name: Biallelic DNASE2 Loss of Function
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic DNASE2 variants abolish or sharply reduce the activity of DNase II,
    a lysosomal acid endonuclease. In the index families the missense and
    exon 4-skipping alleles left little or no measurable activity against plasmid
    DNA when expressed in HEK293T cells, and patient fibroblast lysates had
    markedly reduced activity that wild-type DNASE2 restored. This is the
    lysosomal-hydrolase substitution at the trigger node of the lysosomal
    substrate accumulation module; the stored substrate is DNA.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNASE2
    term:
      id: hgnc:2960
      label: DNASE2
  molecular_functions:
  - preferred_term: deoxyribonuclease II activity
    term:
      id: GO:0004531
      label: deoxyribonuclease II activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29259162
    reference_title: "Type I interferon-mediated autoinflammation due to DNase II deficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Expression in HEK293T cells of mutant constructs lacking exon 4, or with the c.347G>C (Gly116Ala) or the c.362A>T (Asp121Val) substitutions, was associated with reduced levels of DNase II activity against circularized plasmid DNA compared to controls"
    explanation: Recombinant expression of the patient alleles shows the loss of nuclease activity.

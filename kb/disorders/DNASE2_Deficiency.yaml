    snippet: "To date, only 6 patients have been reported, with clinical manifestations predominantly including congenital anemia, hepatosplenomegaly, and systemic inflammation"
    explanation: The reported patient total before the two cases this preprint adds.
animal_models:
- name: Dnase2 knockout mouse
  species: Mus musculus
  genotype: Dnase2-/- (constitutive null)
  publication: PMID:11375492
  description: >-
    Constitutive DNase II-null mice die in late embryogenesis or at birth from a
    severe anemia, because macrophages at the site of fetal liver definitive
    erythropoiesis cannot digest the nuclei expelled by erythroid precursors. The
    model reproduces the macrophage DNA accumulation and the lethal fetal anemia
    but not the full postnatal human syndrome, which is only seen once the
    embryonic lethality is bypassed.
  modeled_mechanisms:
  - target: Interferon-Driven Suppression of Fetal and Neonatal Erythropoiesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the type I interferon-dependent failure of definitive erythropoiesis.
    limitations: >-
      The mouse null is embryonic-lethal, so it models the fetal anemia rather
      than the resolving neonatal anemia and later multisystem disease of the
      hypomorphic human alleles.
    evidence:
    - reference: PMID:15568025
      reference_title: "Lethal anemia caused by interferon-beta produced in mouse embryos carrying undigested DNA."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "the inability to degrade DNA derived from erythroid precursors results in interferon-beta production that induces expression of a specific set of interferon-responsive genes associated with embryonic lethality in DNase II-deficient mice"
      explanation: The interferon-driven lethal anemia this node represents.
- name: Dnase2 Ifnar1 double-knockout mouse
  species: Mus musculus
  genotype: Dnase2-/- Ifnar1-/- (type I interferon receptor double knockout)
  publication: PMID:17066036
  description: >-
    Removing the type I interferon receptor rescues the embryonic lethality, and
    the surviving mice develop a chronic TNF-dependent polyarthritis resembling
    rheumatoid arthritis, with cytopenia, extramedullary hematopoiesis and liver
    fibrosis. This model captures the postnatal interferon-independent
    inflammatory arm, including the arthropathy.
  modeled_mechanisms:
  - target: STING-TBK1-Driven Proinflammatory Cytokine Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the TNF-driven inflammatory arthritis of the interferon-independent arm.
    limitations: >-
      The arthritis arm is studied with the interferon receptor deleted, so it
      models the interferon-independent cytokine route in isolation rather than
      the combined human disease in which interferon signaling is intact.
    evidence:
    - reference: PMID:17066036
      reference_title: "Chronic polyarthritis caused by mammalian DNA that escapes from degradation in macrophages."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "DNase II-/-IFN-IR-/- mice and mice with an induced deletion of the DNase II gene develop a chronic polyarthritis resembling human rheumatoid arthritis"
      explanation: The TNF-dependent polyarthritis this model contributes.
  - target: Hepatic Fibrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The double-knockout mouse reproduces the liver fibrosis seen in patients,
      together with cytopenia and extramedullary hematopoiesis.
    limitations: >-
      The interferon receptor is deleted in this model, so its liver fibrosis
      arises without type I interferon signaling, whereas the patients have an
      intact interferon response. The cited comparison does not report renal
      pathology, so the model is not linked to the glomerulonephritis node.
    evidence:
    - reference: PMID:31464028
      reference_title: "Role of Interferon-gamma-Producing Th1 Cells in a Murine Model of Type I Interferon-Independent Autoinflammation Resulting From DNase II Deficiency."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "many of the disease features found in DNase II-deficient patients were recapitulated, including cytopenia, extramedullary hematopoiesis, and liver fibrosis"
      explanation: The model reproduces the liver fibrosis of DNase II-deficient patients.
notes: >-
  Lump/split. This is a single leaf Disease entry for the DNASE2-defined type I
  interferonopathy (MONDO:0800132, OMIM:619858). MONDO places the term directly
  under hereditary disease with no disease children and one causal gene, and no
  other kb/ entry covers DNASE2, so a single-gene leaf entry is the right level.

  Mechanism and module conformance. DNase II acts in the lysosome, so the entry
  conforms to the first two nodes of the lysosomal substrate accumulation module
  (hydrolase deficiency, substrate accumulation) with DNA as the stored
  substrate, then diverges: the damage is driven by innate DNA sensing rather
  than storage cytotoxicity, so it does not conform to that module's downstream
  cytotoxicity nodes. From the accumulated DNA it conforms to the cGAS-STING
  pathway activation module at the sensing and TBK1-IRF3 nodes, which is the
  DNASE2-specific lysosomal substitution the module's notes anticipate (a nuclease
  no longer clears self DNA). The cGAS and STING dependence is established in
  mouse genetics (cGas or Sting deletion rescues both the embryonic lethality and
  the arthritis); the human patient data show the interferon signature and
  JAK-STAT activation but do not themselves prove the sensor, so the sensor edges
  carry mouse evidence and the interferon node carries human evidence.

  Two parallel inflammatory arms. The arthropathy and much of the systemic
  inflammation run through an interferon-independent STING-TBK1-NF-kB cytokine arm
  (TNF, IL-6), shown in mice by a STING mutant that cannot induce interferon but
  still causes TNF/IL-6-dependent arthritis, and the autoantibody arm depends on
  endosomal TLRs (Unc93b1) rather than STING. These are modeled as separate
  downstream routes from the accumulated DNA, not as consequences of the
  interferon node, so the entry does not overstate a single interferon mechanism.

  Deliberately uncited claims. The route by which lysosomal DNA reaches cytosolic
  cGAS is not resolved in the cited sources and is left as an open statement in the
  cGAS node description rather than asserted. The baricitinib reports (Hong et al.,
  PMID:31775019) are described in the literature but that paper has no fetchable
  abstract in the reference cache, so only ruxolitinib, which has verifiable
  quotes, is curated as a treatment; baricitinib is mentioned in prose only.

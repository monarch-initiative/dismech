    reference_title: Amniotic band syndrome and limb body wall complex in Europe 1980-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twinning was confirmed as a risk factor for both ABS and LBWC."
    explanation: The large EUROCAT analysis supports twinning as a risk factor.
- name: Prior uterine procedure
  presence: Candidate risk factor
  description: >-
    A small retrospective series found more prior uterine surgery among ABS
    pregnancies than controls. The association is recorded cautiously and does
    not establish causation.

    - reference: PMID:16707079
      reference_title: "Extremity amniotic band syndrome in fetal lamb. I: An experimental model of limb amputation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Four extremities showed a necrotic pattern and 4 an edema pattern."

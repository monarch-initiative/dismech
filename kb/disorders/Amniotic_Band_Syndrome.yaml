  role: consequence
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Compression from the rings may lead to edema"
    explanation: This supports distal fluid accumulation without resolving vessel-level detail.
  downstream:

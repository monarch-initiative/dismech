- name: Primary Vascular Disruption
  description: >-
    Fetopathologic observations propose a vascular disruption sequence for many
    encephaloceles and facial clefts occurring in fetuses with amniotic bands,
    with or without a broad cephalo-amniotic adhesion. This alternative is not
    treated as a downstream consequence of limb-band compression.
  role: trigger
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:1609831
    reference_title: "Constrictive amniotic bands, amniotic adhesions, and limb-body wall complex: discrete disruption sequences with pathogenetic overlap."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the craniofacial defects (encephaloceles and/or facial clefts) occurring in these fetuses are not caused by constrictive amniotic bands, but are the result of a vascular disruption sequence with or without cephalo-amniotic adhesion."
    explanation: Fetopathology supports a distinct vascular/adhesion route for these lesions.
  downstream:
  - target: Craniofacial cleft
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - vascular_disruption_adhesion_model
    description: The alternative vascular-disruption model includes facial clefts.

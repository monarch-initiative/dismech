progression:
- phase: Prenatal onset and disruption
  age_range: Antenatal
  notes: >-
    Timing influences the observed spectrum: early rupture was associated with
    multisystem defects and poor fetal outcome, whereas later rupture was
    predominantly associated with limb involvement.
  evidence:
  - reference: PMID:480028
    reference_title: "The amniotic band disruption complex: timing of amniotic rupture and variable spectra of consequent defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparison of 35 cases in which the timing of amniotic rupture could be estimated suggests that early amniotic rupture results in multiply affected infants who are frequently aborted or stillborn, whereas later rupture results primarily in limb involvement."
    explanation: The series directly supports a timing-dependent spectrum.
- phase: Clinical recognition
  age_range: Antenatal to neonatal
  notes: >-
    Structural abnormalities can be recognized prenatally, while constriction
    rings, edema, limb loss, and functional consequences are assessed at birth.
  evidence:
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Antenatal"
    explanation: Orphanet records antenatal onset.
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Neonatal"
    explanation: Orphanet also records neonatal onset.
mechanistic_hypotheses:
- hypothesis_group_id: extrinsic_amnion_rupture_model
  hypothesis_label: Extrinsic amnion-rupture and constriction model
  status: CANONICAL
  description: >-
    In prototypic band-positive ABS, amnion rupture or detachment exposes
    fibrous strands that tether and locally constrict fetal parts. Downstream
    mechanical deformation, venous-lymphatic obstruction, impaired distal
    perfusion, neural compromise, and tissue loss explain the limb-predominant
    spectrum. This model is canonical for that presentation, not universal
    across every case labeled ABS.
  evidence:
  - reference: PMID:480028
    reference_title: "The amniotic band disruption complex: timing of amniotic rupture and variable spectra of consequent defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amniotic rupture appeared to cause injury through three basic mechanisms: (1) interruption of normal morphogenesis; (2) crowing of fetal parts; and (3) disruption of previously differentiated structure."
    explanation: Human case synthesis supports rupture followed by timing-dependent injury.
  - reference: PMID:3345407
    reference_title: "The amniotic band disruption complex. The pathogenesis of congenital limb ring-constrictions; an experimental study in the foetal rat."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "This paper reports the findings of an experimental foetal rat study which has shown that it is possible to produce mild, moderate and severe limb ring-constrictions by simulating the ligature effect of amniotic bands."
    explanation: The fetal-rat ligature model supports the downstream mechanical step.
  - reference: PMID:3287248
    reference_title: "Amniotic band syndrome in monozygotic twins: prenatal diagnosis and pathogenesis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the paradoxical observations of discordance in monoamniotic and concordance in diamniotic twin gestations, fail to support an \"exogenous\" etiology for amniotic band syndrome."
    explanation: >-
      Twin observations refute a universal exogenous explanation, limiting this
      canonical graph to prototypic constrictive-band lesions.
- hypothesis_group_id: vascular_disruption_adhesion_model
  hypothesis_label: Primary vascular disruption with or without cephalo-amniotic adhesion
  status: ALTERNATIVE
  description: >-
    Fetopathologic evidence separates constrictive limb bands from many severe
    craniofacial lesions. In this alternative model, a primary vascular
    disruption produces encephaloceles or facial clefts, sometimes accompanied
    by broad adhesion of the disrupted fetal part to an intact amnion.
  evidence:
  - reference: PMID:1609831
    reference_title: "Constrictive amniotic bands, amniotic adhesions, and limb-body wall complex: discrete disruption sequences with pathogenetic overlap."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the craniofacial defects (encephaloceles and/or facial clefts) occurring in these fetuses are not caused by constrictive amniotic bands, but are the result of a vascular disruption sequence with or without cephalo-amniotic adhesion."
    explanation: Fetopathologic evaluation directly supports this alternative for craniofacial lesions.
pathophysiology:
- name: Amnion Rupture or Detachment
  description: >-
    Rupture or separation of the amnion is the proposed initiating event in the
    extrinsic model. It is provisional because rupture is not demonstrated in
    every case and ABS remains etiologically heterogeneous.
  role: trigger
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  evidence:
  - reference: PMID:480028
    reference_title: "The amniotic band disruption complex: timing of amniotic rupture and variable spectra of consequent defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amniotic rupture appeared to cause injury through three basic mechanisms"
    explanation: The human series supports rupture as an initiating event in this model.
  - reference: PMID:19180633
    reference_title: "Comparative study of clinical characteristics of amniotic rupture sequence with and without body wall defect: further evidence for separation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Amniotic rupture sequence (ARS) is a disruption sequence presenting with fibrous bands, possibly emerging as a result of amniotic tear in the first trimester of gestation."
    explanation: The registry paper explicitly qualifies the rupture origin as possible.
  downstream:
  - target: Fibrous Amniotic Strand Formation or Exposure
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Rupture or detachment can expose fibrous amniotic strands to fetal parts.
    evidence:
    - reference: PMID:19180633
      reference_title: "Comparative study of clinical characteristics of amniotic rupture sequence with and without body wall defect: further evidence for separation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Amniotic rupture sequence (ARS) is a disruption sequence presenting with fibrous bands, possibly emerging as a result of amniotic tear in the first trimester of gestation."
      explanation: This supports the proposed, but not universal, rupture-to-band link.
- name: Fibrous Amniotic Strand Formation or Exposure
  description: >-
    Fibrous strands in the amniotic cavity are the physical substrate of the
    extrinsic band-positive model. Their formation or exposure is provisional
    because fetal-placental bands are associated with, rather than present in,
    every clinically labeled case.
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  evidence:
  - reference: PMID:29756715
    reference_title: An update on amniotic bands sequence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "may be associated with fetalplacental fibrous bands."
    explanation: The review supports fibrous bands as an association rather than an invariant.
  downstream:
  - target: Fetal-Part Entanglement and Focal Tethering
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Contact between a fibrous strand and a fetal part can produce tethering or entanglement.
    evidence:
    - reference: PMID:31424867
      reference_title: Amniotic Band Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "the clinical consequences result from fetal parts becoming entangled in the amnion."
      explanation: The clinical review identifies entanglement as the proximal mechanical event.
- name: Fetal-Part Entanglement and Focal Tethering
  description: >-
    A limb, digit, craniofacial structure, or umbilical cord may become caught
    by a strand. The resulting focal tether transmits abnormal mechanical force
    and can progress to circumferential compression.
  role: central_effector
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31424867
    reference_title: Amniotic Band Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the clinical consequences result from fetal parts becoming entangled in the amnion."
    explanation: This review directly supports fetal-part entanglement.
  downstream:
  - target: Circumferential Tissue Compression
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: A tightening tether acts as a focal or circumferential ligature.
    evidence:
    - reference: PMID:3345407

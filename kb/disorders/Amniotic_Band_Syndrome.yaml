definitions:
- name: Evidence-calibrated clinical definition
  definition_type: OTHER
  description: >-
    A congenital disruption sequence ranging from localized limb constriction
    rings and distal tissue loss to severe early multisystem defects. Fibrous
    bands are characteristic when present, but they are not asserted as a
    universal initiating lesion.
  evidence:
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Constriction rings syndrome is a congenital limb malformation disorder with an extremely variable clinical presentation"
    explanation: Orphanet establishes the variable congenital limb presentation.
  - reference: PMID:480028
    reference_title: "The amniotic band disruption complex: timing of amniotic rupture and variable spectra of consequent defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects varied from simple digital band constrictions to major craniofacial and visceral defects; fetal death may also occur."
    explanation: A 79-patient series supports the broad disruption spectrum.
  - reference: PMID:29756715
    reference_title: An update on amniotic bands sequence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Amniotic bands sequence is a congenital disorder characterized by craniofacial, body wall, and limb anomalies that may be associated with fetalplacental fibrous bands."
    explanation: The review supports variable anatomy and avoids making bands universal.

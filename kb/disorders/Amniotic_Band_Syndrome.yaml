treatments:
- name: Fetoscopic amniotic band release
  description: >-
    Fetoscopic division is reserved for selected pregnancies with a threatened
    limb or umbilical cord and potentially salvageable distal tissue. It releases
    tethering and compression but carries substantial membrane-rupture and
    preterm-birth risk; small case series do not establish universal safety or
    benefit.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  target_mechanisms:
  - target: Fetal-Part Entanglement and Focal Tethering
    treatment_effect: INHIBITS
    description: Cutting the band directly removes the fetal tether.
    evidence:
    - reference: PMID:32951245
      reference_title: "Fetoscopic Release of Amniotic Band Syndrome: An Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "fetoscopic release of the amniotic bands in case of amniotic band syndrome is feasible with encouraging results in order to prevent amputation and dysfunction of the extremities."
      explanation: The case series supports release of the proximal mechanical tether.
  - target: Circumferential Tissue Compression
    treatment_effect: INHIBITS
    description: Band division relieves pressure and may restore distal perfusion.
    evidence:
    - reference: PMID:29756715
      reference_title: An update on amniotic bands sequence.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "release of the amniotic bands using fetoscopy with recovery of the involved distal limb perfusion"
      explanation: Perfusion recovery supports relief of compression.
  target_phenotypes:
  - preferred_term: Amniotic constriction ring
    term:
      id: HP:0009775
      label: Amniotic constriction ring
  - preferred_term: Intrauterine amputation
    term:
      id: HP:6001389
      label: Intrauterine amputation

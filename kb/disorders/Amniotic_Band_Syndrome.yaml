discussions:
- discussion_id: fetoscopic_selection_and_comparative_effectiveness
  prompt: >-
    Which prenatal Doppler and anatomical criteria identify fetuses for whom
    fetoscopic release improves survival or limb function enough to outweigh
    PPROM and preterm-birth risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distal Perfusion Compromise
  rationale: >-
    The largest synthesis includes only 37 treated cases from 17 heterogeneous
    reports. Pooled outcomes cannot separate treatment effect from selection and
    publication bias, and optimal selection criteria remain undefined.
  evidence:
  - reference: PMID:39080813
    reference_title: Fetoscopic Release of Amniotic Bands Based on the Evidence-A Systematic Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further studies are needed to determine the optimal criteria for selecting patients who can benefit from fetal surgery, considering that it is an intervention that is not free of perinatal complications."
    explanation: The systematic review explicitly identifies selection criteria and complications as unresolved.
- discussion_id: syndrome_boundary_and_initiating_etiology
  prompt: >-
    Which lesions labeled ABS arise from primary amnion rupture, and which arise
    from vascular disruption, cephalo-amniotic adhesion, or a different
    developmental process?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Amnion Rupture or Detachment
  - pathophysiology#Primary Vascular Disruption
  rationale: >-
    Constrictive limb bands, craniofacial adhesions, and LBWC overlap clinically
    but need not share one initiating mechanism; indiscriminate lumping would
    overextend the band-compression graph.
  evidence:
  - reference: PMID:1609831
    reference_title: "Constrictive amniotic bands, amniotic adhesions, and limb-body wall complex: discrete disruption sequences with pathogenetic overlap."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the concept that considers the 3 lesions in question as a single pathogenetic entity is erroneous"
    explanation: Fetopathology argues against one mechanism for all three lesion patterns.
- discussion_id: phenotype_binding_for_neural_and_cord_outcomes
  prompt: >-
    Which ontology-backed clinical phenotypes can accurately represent
    band-associated neural compromise and fetal consequences of umbilical-cord
    constriction without overgeneralizing sparse observations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Local Neural Compression
  - pathophysiology#Umbilical-Cord Constriction
  rationale: >-
    The structured source names neural compromise without specifying a clinical
    neuropathy, while the cord-outcome evidence is one fetal demise in a small,
    selected fetoscopy series. These observations do not yet justify a more
    specific disease-level phenotype binding.
  evidence:
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Compression from the rings may lead to edema, skeletal anomalies (e.g. fractures, foot deformities) and, infrequently, neural compromise."
    explanation: Orphanet describes neural compromise generically without naming a clinical neuropathy.
  - reference: PMID:24528986
    reference_title: Fetoscopic approach to amniotic band syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of these four did not have the band released and underwent fetal demise at 24 weeks."
    explanation: The small selected series supports the observed outcome but not a general disease-level phenotype assertion.

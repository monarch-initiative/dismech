name: Amniotic Band Syndrome
creation_date: "2026-05-07T06:23:00Z"
updated_date: "2026-05-07T06:23:00Z"
description: >-
  Amniotic band syndrome is a sporadic, heterogeneous congenital disruption
  sequence. In prototypic band-positive cases, amnion rupture or detachment is
  proposed to expose fibrous strands that tether or constrict fetal parts,
  producing rings, edema, deformation, impaired distal perfusion, tissue loss,
  or amputation. Earlier disruption can be associated with severe craniofacial
  or neural defects, but no single extrinsic mechanism explains every case and
  no universal genetic cause is established.
category: Congenital
disease_term:
  preferred_term: amniotic band syndrome
  term:
    id: MONDO:0015167
    label: amniotic band syndrome
parents:
- Skeletal dysplasia
- Dysostosis
synonyms:
- ABS
- Amniotic band sequence
- Amniotic deformity-adhesion-mutilation sequence
- Congenital constriction ring syndrome
- Congenital ring constrictions
- Constriction band syndrome
- Streeter dysplasia
notes: >-
  MONDO:0015167 lists Orphanet xrefs ORPHA:1034 and ORPHA:295000, but the local
  Orphadata snapshot contains the structured record as ORPHA:295000. This entry
  therefore uses ORPHA:295000 for Orphanet assertions. The canonical extrinsic
  rupture graph is deliberately restricted to prototypic band-positive cases;
  the intrinsic developmental and primary vascular proposals remain unlinked
  alternative hypotheses. Limb-body-wall complex is treated as a differential
  diagnosis rather than an ABS subtype because comparative registry evidence
  supports nosologic separation.

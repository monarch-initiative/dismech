      explanation: This supports the proposed, but not universal, rupture-to-band link.
  - target: Early Multisystem Developmental Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Early rupture can interrupt morphogenesis or disrupt differentiating structures.

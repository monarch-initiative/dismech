imaging_findings:
- name: Prenatal limb-disruption pattern
  modality: ULTRASOUND
  description: >-
    In a small prenatal series, fetal structural findings included syndactyly,
    limb amputation, talipes, a flexed knee, a constriction ring, umbilical-cord
    strangulation, and acrania. Structural abnormalities supported suspicion
    even when prenatal evidence of amnion rupture was absent.
  diagnostic: true
  evidence:
  - reference: PMID:24247024
    reference_title: "Revisiting amniotic band sequence: a wide spectrum of manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis of ABS was established prenatally based on fetal structural abnormalities."
    explanation: The clinical series directly supports structural-anomaly-based ultrasound diagnosis.
  - reference: PMID:24247024
    reference_title: "Revisiting amniotic band sequence: a wide spectrum of manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These abnormalities included: (1) upper limb defects: syndactyly, amputation at the level of phalanges or first metacarpal or forearm; (2) inferior extremities defects: tallus equinovarus and flexed knee, and constriction ring; (3) umbilical cord strangulation, and (4) acrania."
    explanation: This exact case-series list bounds the imaging description.
- name: Ultrasonic vestige at the distal amputated limb
  modality: ULTRASOUND
  description: >-
    A small distal vestige at an amputated limb may contribute to prenatal
    recognition, but it was observed in only three cases and is not asserted as
    sensitive or specific.
  diagnostic: true
  evidence:
  - reference: PMID:24735486
    reference_title: Prenatal diagnosis of amniotic band syndrome - risk factors and ultrasonic signs.
    supports: SUPPORT

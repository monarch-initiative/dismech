      explanation: Direct fetoscopic visualization supports cord involvement in selected cases.
- name: Circumferential Tissue Compression
  description: >-
    Circumferential band pressure creates the defining ring indentation and can
    obstruct distal fluid drainage, blood flow, or nerve integrity. This node
    represents mechanical compression, not a universal cause for band-negative
    cases.
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: ORPHA:295000
    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Compression from the rings may lead to edema, skeletal anomalies (e.g. fractures, foot deformities) and, infrequently, neural compromise."
    explanation: Orphanet directly links ring compression to tissue sequelae.
  - reference: PMID:3345407
    reference_title: "The amniotic band disruption complex. The pathogenesis of congenital limb ring-constrictions; an experimental study in the foetal rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Of these 36 foetuses, limb constriction rings were produced in 35 (97%), and an in utero limb amputation in one (3%)."
    explanation: The ligature model demonstrates rings and rare amputation after compression.
  downstream:

- name: Local Neural Compression
  description: >-
    Deep constriction rings can compromise local nerves. This is kept separate
    from perfusion failure because the available structured evidence establishes
    only that neural compromise can occur, not its frequency or relationship to
    tissue ischemia.
  role: consequence
  biological_scale: TISSUE

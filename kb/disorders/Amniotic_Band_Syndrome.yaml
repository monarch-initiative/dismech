  description: >-
    Fibrous strands in the amniotic cavity are the physical substrate of the
    extrinsic band-positive model. Their formation or exposure is provisional
    because fetal-placental bands are associated with, rather than present in,
    every clinically labeled case.
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  evidence:
  - reference: PMID:29756715
    reference_title: An update on amniotic bands sequence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "may be associated with fetalplacental fibrous bands."
    explanation: The review supports fibrous bands as an association rather than an invariant.
  downstream:
  - target: Fetal-Part Entanglement and Focal Tethering
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Contact between a fibrous strand and a fetal part can produce tethering or entanglement.

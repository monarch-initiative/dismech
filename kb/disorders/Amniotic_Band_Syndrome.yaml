    explanation: Orphanet directly supports infrequent neural compromise from ring compression.
- name: Ischemic Tissue Loss
  description: >-
    Irreversible distal injury can yield transverse terminal reduction or
    intrauterine amputation. The tissue-loss mechanism is strongly supported by
    mechanical modeling and clinical limb-reduction patterns, although not every
    limb defect follows this route.
  role: outcome
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:19180633
    reference_title: "Comparative study of clinical characteristics of amniotic rupture sequence with and without body wall defect: further evidence for separation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "minor and distal limb defects (phalangeal or digital amputation, pseudosyndactyly, constriction rings) predominated in the ARS-L group"
    explanation: Registry data document distal amputations in limb-predominant cases.
  downstream:
  - target: Transverse terminal limb defect
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Distal tissue loss produces a transverse terminal reduction pattern.
    evidence:

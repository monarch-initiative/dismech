  - reference: PMID:24735486
    reference_title: Prenatal diagnosis of amniotic band syndrome - risk factors and ultrasonic signs.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a significantly higher rate of prior uterine surgeries (p = 0.008) in patient with ABS compared to control."
    explanation: The ten-pregnancy study supports an association but is too small for a universal claim.
differential_diagnoses:
- name: Limb-body-wall complex
  disease_term:
    preferred_term: limb body wall complex
  description: >-
    Limb-body-wall complex overlaps ABS through limb and body-wall anomalies but
    has a different defect distribution and should not be encoded as an ABS
    subtype.
  distinguishing_features:
  - Minor distal amputations, pseudosyndactyly, and constriction rings favor limb-predominant amniotic rupture sequence.
  - Predominant abdominal and thoracic wall defects favor limb-body-wall complex.
  - A severe body-wall/attachment pattern should trigger reconsideration of the diagnostic label rather than automatic extension of the band-compression graph.
  evidence:
  - reference: PMID:19180633
    reference_title: "Comparative study of clinical characteristics of amniotic rupture sequence with and without body wall defect: further evidence for separation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our study contributes to the growing evidence that both ARS entities represent two nosologically distinct conditions."
    explanation: Comparative registry data support nosologic separation.
  - reference: PMID:36584346
    reference_title: Amniotic band syndrome and limb body wall complex in Europe 1980-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Limb anomalies and neural tube defects were commonly seen in ABS, whereas in LBWC abdominal and thoracic wall defects and limb anomalies were most prevalent."
    explanation: EUROCAT data support differing anomaly distributions.
  notes: >-
    The intended ontology concept is MONDO:0016528; the formal term binding is
    omitted because the current local DiseaseTerm dynamic enum rejects that
    concept despite its presence in the MONDO term cache.

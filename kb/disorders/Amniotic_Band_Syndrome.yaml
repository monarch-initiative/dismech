      explanation: Experimental ligature reproduces the graded compression phenotype.
  - target: Mechanical Deformation of Developing Limbs
    causal_link_type: DIRECT
    hypothesis_groups:
    - extrinsic_amnion_rupture_model
    description: Tethering and crowding alter fetal limb position and developing structure.

  description: >-
    Fetoscopic division is reserved for selected pregnancies with a threatened
    limb or umbilical cord and potentially salvageable distal tissue. It releases
    tethering and compression but carries substantial membrane-rupture and
    preterm-birth risk; the published evidence remains a heterogeneous collection
    of case reports and case series and does not establish comparative efficacy.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Fetal-Part Entanglement and Focal Tethering
    treatment_effect: INHIBITS
    description: Cutting the band directly removes the fetal tether.
    evidence:
    - reference: PMID:32951245
      reference_title: "Fetoscopic Release of Amniotic Band Syndrome: An Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "fetoscopic release of the amniotic bands in case of amniotic band syndrome is feasible with encouraging results in order to prevent amputation and dysfunction of the extremities."
      explanation: The case series supports release of the proximal mechanical tether.
  - target: Circumferential Tissue Compression
    treatment_effect: INHIBITS

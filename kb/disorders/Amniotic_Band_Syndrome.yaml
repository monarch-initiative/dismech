    reference_title: "Amniotic band syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Compression from the rings may lead to edema, skeletal anomalies (e.g. fractures, foot deformities) and, infrequently, neural compromise."
    explanation: Orphanet directly links ring compression to tissue sequelae.
  - reference: PMID:3345407
    reference_title: "The amniotic band disruption complex. The pathogenesis of congenital limb ring-constrictions; an experimental study in the foetal rat."

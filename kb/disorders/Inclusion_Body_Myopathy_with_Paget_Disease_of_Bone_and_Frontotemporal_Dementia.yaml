      snippet: "Muscle biopsies from patients II5 (family 1) and IV9 (family 2) showed atrophic fibers, central nuclei and rimmed vacuoles characteristic of IBM"
      explanation: Reports the rimmed-vacuole myopathy in the probands of both hnRNP families, which is the target of this edge.

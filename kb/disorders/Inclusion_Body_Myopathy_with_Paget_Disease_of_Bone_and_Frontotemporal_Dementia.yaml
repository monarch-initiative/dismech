- name: hnRNP prion-like domain fibril assembly
  description: >
    The disease variants in HNRNPA2B1 and HNRNPA1 lie in the glycine-rich
    prion-like domain that both paralogues carry. Wild-type hnRNPA2 and hnRNPA1
    already have an intrinsic tendency to self-assemble into fibrils; the variants
    strengthen a steric zipper motif inside that domain, which accelerates
    formation of self-seeding fibrils and lets them cross-seed polymerization of
    the wild-type protein. The proximal defect in the hnRNP forms of this disorder
    is therefore a gain of ordered self-assembly, not the loss of ubiquitin
    dependent segregase activity that drives the VCP form.
  genes:
  - preferred_term: HNRNPA2B1
    term:
      id: hgnc:5033
      label: HNRNPA2B1
  - preferred_term: HNRNPA1
    term:
      id: hgnc:5031
      label: HNRNPA1
  biological_processes:
  - preferred_term: prion-like domain self-seeding fibril polymerization
    modifier: INCREASED
    term:
      id: GO:0051258
      label: protein polymerization
  evidence:
  - reference: PMID:23455423
    reference_title: "Mutations in prion-like domains in hnRNPA2B1 and hnRNPA1 cause multisystem proteinopathy and ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type hnRNPA2 (the most abundant isoform of hnRNPA2B1) and hnRNPA1 show an intrinsic tendency to assemble into self-seeding fibrils, which is exacerbated by the disease mutations."
    explanation: Establishes that both proteins self-assemble into fibrils and that the disease variants increase that assembly, which is the state this node asserts.
  - reference: PMID:23455423
    reference_title: "Mutations in prion-like domains in hnRNPA2B1 and hnRNPA1 cause multisystem proteinopathy and ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, the pathogenic mutations strengthen a 'steric zipper' motif in the PrLD, which accelerates the formation of self-seeding fibrils that cross-seed polymerization of wild-type hnRNP."
    explanation: Names the steric zipper motif and the cross-seeding of wild-type protein stated in this node's description, and is the sentence supporting the protein polymerization binding. Graded IN_VITRO for the accelerated fibril formation and cross-seeding it asserts, which the paper measured on recombinant protein; the steric zipper motif itself was identified by a structure-based threading prediction in the same study.
  downstream:
  - target: hnRNP recruitment into stress granules and cytoplasmic inclusions
    causal_link_type: DIRECT
    description: Accelerated self-assembly is what drives the mutant protein out of the nucleus into granules and inclusions.
- name: hnRNP recruitment into stress granules and cytoplasmic inclusions
  description: >
    Mutant hnRNPA2 and hnRNPA1 are incorporated in excess into stress granules and
    form cytoplasmic inclusions. In the two reported families the corresponding
    human pathology is nuclear clearance of the affected hnRNP with cytoplasmic
    accumulation in a minority of muscle fibers, alongside TDP-43 pathology of the
    same kind seen in the VCP form and in sporadic inclusion body myositis. This is
    the point at which the hnRNP arm and the VCP arm of the disorder converge on a
    shared aggregate pathology.
  genes:
  - preferred_term: HNRNPA2B1
    term:
      id: hgnc:5033
      label: HNRNPA2B1
  - preferred_term: HNRNPA1
    term:
      id: hgnc:5031
      label: HNRNPA1
  biological_processes:
  - preferred_term: recruitment of hnRNP into cytoplasmic stress granules
    modifier: INCREASED
    term:
      id: GO:1903608
      label: protein localization to cytoplasmic stress granule
  cellular_components:
  - preferred_term: cytoplasmic stress granule
    term:
      id: GO:0010494
      label: cytoplasmic stress granule
  evidence:
  - reference: PMID:23455423
    reference_title: "Mutations in prion-like domains in hnRNPA2B1 and hnRNPA1 cause multisystem proteinopathy and ALS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, the disease mutations promote excess incorporation of hnRNPA2 and hnRNPA1 into stress granules and drive the formation of cytoplasmic inclusions in animal models that recapitulate the human pathology."
    explanation: Supports both the excess stress-granule incorporation and the cytoplasmic inclusion formation this node asserts. Graded MODEL_ORGANISM because the quoted sentence attributes the inclusion phenotype to animal models.
  - reference: PMID:23455423
    reference_title: "Mutations in prion-like domains in hnRNPA2B1 and hnRNPA1 cause multisystem proteinopathy and ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "analysis of muscle tissue from patient II5 (family 1) showed that hnRNPA2B1 cleared from many nuclei and accumulated in cytoplasmic inclusions in ~10% of fibers"
    explanation: The human counterpart of the model finding, quantifying nuclear clearance and cytoplasmic accumulation in patient muscle.
  downstream:
  - target: Rimmed-vacuole skeletal myopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Cytoplasmic hnRNP and TDP-43 inclusion pathology in skeletal muscle fibers.

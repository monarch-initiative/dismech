- name: HNRNPA2B1
  association: Disease-causing germline variants
  relationship_type: CAUSATIVE
  subtype: IBMPFD2
  gene_term:
    preferred_term: HNRNPA2B1
    term:
      id: hgnc:5033
      label: HNRNPA2B1
  features: >
    HNRNPA2B1 encodes heterogeneous nuclear ribonucleoprotein A2/B1, an RNA-binding
    protein whose glycine-rich C-terminal region is a prion-like domain. The
    reported disease variants are missense and lie within that domain, where they
    strengthen a steric zipper motif and accelerate self-seeding fibril assembly,
    so the mechanism is a gain of aggregation propensity rather than loss of the
    protein. ClinGen grades the relationship Moderate and lumps the reported
    amyotrophic lateral sclerosis presentations into the same disease entity, while
    splitting oculopharyngeal muscular dystrophy 2 out of it on both phenotype and
    variant class.
  evidence:
  - reference: ORPHA:52430
    reference_title: "Inclusion body myopathy with Paget disease of bone and frontotemporal dementia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HNRNPA2B1 | heterogeneous nuclear ribonucleoprotein A2/B1 | hgnc:5033 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists HNRNPA2B1 as a disease-causing gene.
  - reference: CGGV:assertion_1ffe711b-1ff6-4b11-b329-c0f820904764-2024-10-24T190000.000Z
    reference_title: "HNRNPA2B1 / inclusion body myopathy with early-onset Paget disease with or without frontotemporal dementia 2 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found no differences in molecular mechanism and inheritance pattern of amyotrophic lateral sclerosis and IBMPFD2."
    explanation: Source for the lumping decision stated in this row, and the reason ClinGen's HNRNPA2B1 assertion is keyed on the IBMPFD2 class rather than on amyotrophic lateral sclerosis.
  - reference: CGGV:assertion_1ffe711b-1ff6-4b11-b329-c0f820904764-2024-10-24T190000.000Z
    reference_title: "HNRNPA2B1 / inclusion body myopathy with early-onset Paget disease with or without frontotemporal dementia 2 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease entity oculopharyngeal muscular dystrophy 2 (MONDO:0958195) has been split from this curation for difference in phenotype (especially ptosis and eye movement paralysis) and a distinct difference in molecular mechanism (frameshift variants that create the same novel amino acid series at the C-terminus of the protein)."
    explanation: Source for the split stated in this row, and the reason the HNRNPA2B1 oculopharyngeal phenotype is not covered by this entry.
- name: HNRNPA1
  association: Disease-causing germline variants
  relationship_type: CAUSATIVE
  subtype: IBMPFD3
  gene_term:
    preferred_term: HNRNPA1
    term:
      id: hgnc:5031
      label: HNRNPA1
  features: >
    HNRNPA1 encodes heterogeneous nuclear ribonucleoprotein A1, the paralogue of
    HNRNPA2B1, and carries an equivalent glycine-rich prion-like domain. The
    variant reported in the second multisystem proteinopathy family substitutes
    valine for the same conserved aspartate that is altered in HNRNPA2B1, and a
    variant at that residue was also identified in one familial amyotrophic
    lateral sclerosis case, so the two genes converge on one mechanism at one
    position. ClinGen has no gene-disease validity assertion for HNRNPA1 against
    any inclusion body myopathy entity in the committed
    `cache/clingen/gene_validity.csv` snapshot, so the grade for this gene rests
    on GeneReviews and the primary report rather than on a ClinGen
    classification.
  evidence:

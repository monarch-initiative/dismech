- name: IBMPFD3
  display_name: IBMPFD3 / multisystem proteinopathy 3 (HNRNPA1)
  subtype_term:
    preferred_term: HNRNPA1-related inclusion body myopathy with Paget disease of bone and frontotemporal dementia
    term:
      id: MONDO:0014179
      label: inclusion body myopathy with early-onset Paget disease with or without
        frontotemporal dementia 3
  description: >-
    The HNRNPA1 form, identified in a second VCP-negative family by the same
    study that defined the HNRNPA2B1 form. The reported variant substitutes valine
    for the conserved aspartate at the equivalent position of the HNRNPA1
    prion-like domain, so the two subtypes share both the affected residue context
    and the aggregation mechanism. A variant at the same aspartate was also found
    in one dominantly inherited familial amyotrophic lateral sclerosis case.

diagnosis:
- name: Molecular genetic testing
  description: >
    Molecular confirmation is the definitive diagnostic test, using targeted
    familial variant testing or a multigene myopathy/proteinopathy panel that
    includes VCP, HNRNPA2B1, and HNRNPA1 when the phenotype is compatible.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Identification of a pathogenic disease-gene variant confirms the diagnosis.
  evidence:
  - reference: PMID:37026610
    reference_title: "Provisional practice recommendation for the management of myopathy in VCP-associated multisystem proteinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "single-variant testing in the case of a known familial VCP variant, or multi-gene panel sequencing in undifferentiated cases can be considered."
    explanation: Consensus practice recommendations support targeted VCP testing or multigene panel sequencing in undifferentiated cases.
  - reference: ORPHA:52430
    reference_title: "Inclusion body myopathy with Paget disease of bone and frontotemporal dementia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VCP | valosin containing protein | hgnc:12666 | Disease-causing germline mutation(s) in"
    explanation: Orphanet supports VCP inclusion on diagnostic testing panels for this disorder.
  - reference: ORPHA:52430
    reference_title: "Inclusion body myopathy with Paget disease of bone and frontotemporal dementia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HNRNPA2B1 | heterogeneous nuclear ribonucleoprotein A2/B1 | hgnc:5033 | Disease-causing germline mutation(s) in"
    explanation: Orphanet supports HNRNPA2B1 inclusion when testing the broader multisystem proteinopathy gene set.
  - reference: ORPHA:52430
    reference_title: "Inclusion body myopathy with Paget disease of bone and frontotemporal dementia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HNRNPA1 | heterogeneous nuclear ribonucleoprotein A1 | hgnc:5031 | Disease-causing germline mutation(s) in"
    explanation: Orphanet supports HNRNPA1 inclusion when testing the broader multisystem proteinopathy gene set.
- name: Muscle biopsy
  description: >
    Muscle biopsy is useful in diagnostically unresolved cases, especially when
    it shows rimmed vacuoles and related vacuolar myopathy.
  diagnosis_term:
    preferred_term: biopsy of muscle tissue
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  results: Rimmed vacuoles and vacuolar myopathy support the diagnosis in the right clinical context.
  evidence:
  - reference: PMID:37026610
    reference_title: "Provisional practice recommendation for the management of myopathy in VCP-associated multisystem proteinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Muscle biopsy is important in cases of diagnostic uncertainty or lack of a definitive pathogenic genetic variant"
    explanation: Practice recommendations support biopsy as an adjunct when genetic confirmation is unavailable or uncertain.
- name: Electrodiagnostic studies and muscle MRI
  description: >
    EMG/NCS and muscle MRI help characterize the myopathy pattern and rule out
    mimicking neuromuscular disorders.
  results: Myopathic EMG abnormalities and compatible muscle imaging support the neuromuscular phenotype.
  evidence:
  - reference: PMID:37026610
    reference_title: "Provisional practice recommendation for the management of myopathy in VCP-associated multisystem proteinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Electrodiagnostic studies and magnetic resonance imaging can also help rule out disease mimics."
    explanation: Practice recommendations include electrodiagnostics and MRI as supportive workup tools.
treatments:
- name: Supportive multidisciplinary care
  description: >
    No curative disease-modifying therapy is established for IBMPFD. Current
    care is supportive and multidisciplinary, with monitoring and symptomatic
    management of myopathy, respiratory compromise, bone disease, dementia, and
    cardiomyopathy as clinically indicated.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  - preferred_term: Weakness of muscles of respiration
    term:
      id: HP:0004347
      label: Weakness of muscles of respiration
  evidence:
  - reference: PMID:37026610
    reference_title: "Provisional practice recommendation for the management of myopathy in VCP-associated multisystem proteinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Standardized management of VCP myopathy will optimize patient care and help future research initiatives."
    explanation: Practice recommendations support standardized multidisciplinary supportive management.
  - reference: PMID:20301649
    reference_title: "Inclusion Body Myopathy with Paget Disease of Bone and/or Frontotemporal Dementia."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "physical therapy and stretching exercises to promote mobility and prevent contractures; mechanical aids (canes, walkers, orthotics, wheelchairs) for ambulation/mobility"
    explanation: GeneReviews names the specific mobility interventions that make up the musculoskeletal part of this supportive package.
  - reference: PMID:20301649
    reference_title: "Inclusion Body Myopathy with Paget Disease of Bone and/or Frontotemporal Dementia."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "echocardiogram and EKG to monitor for evidence of cardiomyopathy; pulmonary function studies; sleep study; alkaline phosphatase, skeletal x-rays and bone scans to monitor for PDB onset and effectiveness of therapy"
    explanation: GeneReviews names the surveillance this entry's monitoring claim rests on, across the cardiac, respiratory and bone arms.
- name: Bisphosphonate therapy for Paget disease of bone
  description: >
    Bisphosphonates are given for the pain and disability of the pagetic bone
    disease, which is the one organ manifestation of this disorder with an
    established pharmacological treatment. Alkaline phosphatase and bone imaging
    are used to follow the response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: Biphosphonate
      term:
        id: NCIT:C443
        label: Biphosphonate
  target_phenotypes:
  - preferred_term: Osteolysis
    term:
      id: HP:0002797
      label: Osteolysis
  - preferred_term: Hip pain
    term:
      id: HP:0030838
      label: Hip pain
  target_mechanisms:
  - target: Pagetic bone remodeling
    description: Bisphosphonates act on the accelerated osteoclastic bone turnover this node models, which is what relieves the pain and disability of the pagetic lesions.
  evidence:
  - reference: PMID:20301649
    reference_title: "Inclusion Body Myopathy with Paget Disease of Bone and/or Frontotemporal Dementia."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "bisphosphonates to relieve pain and disability from PDB"
    explanation: GeneReviews names bisphosphonates as the treatment for the pagetic bone disease, which is the indication and the target of this treatment.
- name: Genetic counseling
  description: >
    Genetic counseling is important for affected individuals and relatives
    because the disorder is autosomal dominant and may require predictive or
    cascade testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37026610
    reference_title: "Provisional practice recommendation for the management of myopathy in VCP-associated multisystem proteinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VCP myopathy has a heterogeneous clinical phenotype and should be considered in patients with limb-girdle muscular dystrophy phenotype, or any myopathy with an autosomal dominant pattern of inheritance."
    explanation: The autosomal dominant diagnostic context supports counseling and cascade-testing implications for relatives.
- name: AAV-mediated hBAG3 gene therapy (investigational)
  description: >
    Investigational, preclinical gene-replacement strategy. Systemic
    AAVrh74.tMCK-driven overexpression of human BAG3 (a co-chaperone that
    initiates the autophagy-lysosome pathway) was tested in the VCP-A232E mouse
    model of VCP-related hereditary inclusion body myositis. The rationale is to
    bypass the VCP proteostasis defect by upregulating autophagic flux and
    mitophagy, thereby clearing misfolded protein aggregates and restoring
    mitochondrial quality control. hBAG3 delivery improved motor function,
    reduced TDP-43-positive aggregates, and improved mitophagy/mitochondrial
    homeostasis markers. No clinical (human) data exist; this remains an early
    proof-of-concept therapeutic strategy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Defective ubiquitin-containing autophagosome maturation
    treatment_effect: RESTORES
    description: >
      hBAG3 overexpression upregulates the autophagy-lysosome pathway to
      compensate for the VCP-dependent autophagosome-maturation defect,
      increasing autophagic flux and clearing accumulated misfolded proteins.
    evidence:
    - reference: PMID:42423109
      reference_title: "AAV.hBAG3 Gene Therapy Improves Phenotype in a Valosin Containing Protein Mouse Model of Hereditary Inclusion Body Myositis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our aim was to ameliorate disease processes resulting from mitochondrial abnormalities and misfolded protein aggregation by upregulating the ALP through overexpression of human BAG3 (hBAG3)."
      explanation: The study targets the autophagy-lysosome pathway defect downstream of VCP dysfunction by BAG3-driven ALP upregulation.
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:42423109
    reference_title: "AAV.hBAG3 Gene Therapy Improves Phenotype in a Valosin Containing Protein Mouse Model of Hereditary Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hBAG3 treatment improved treadmill running distance and rotarod duration, reduced the number of TDP-43-positive aggregates, and decreased the number of fibers showing abnormalities in mitochondrial enzyme histochemistry, compared with the untreated cohort."
    explanation: Preclinical mouse-model evidence that AAV-hBAG3 gene therapy improves functional and histological outcomes; efficacy in humans is not established.

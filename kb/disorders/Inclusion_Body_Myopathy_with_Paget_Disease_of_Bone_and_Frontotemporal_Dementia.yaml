classifications:
  nih_research_priority:
  - classification_value: NIH_HT_89_cellular_quiescence_senescence_cell_death_in
    notes: Pathophysiology conforms to the loss of proteostasis module(s) — hallmark-of-aging mechanism(s) — making this entry a relevant model for NIH Highlighted Topic 89 (cellular quiescence, senescence, and cell death in aging and disease).
notes: >-
  The entry is the umbrella multisystem proteinopathy and its disease_term binding
  is exact: MONDO:0000507 asserts no causal gene and its definition is the
  multisystem syndrome, so the class and the entry denote the same concept. Its
  four MONDO children divide as follows. MONDO:0014178 and MONDO:0014179 are the
  HNRNPA2B1 and HNRNPA1 forms, each defined by MONDO as this disorder caused by
  variants in that gene, and are the IBMPFD2 and IBMPFD3 rows in `has_subtypes`.
  MONDO:0008178, the type 1 class, is the VCP form and is the disease_term of the
  separate kb/disorders/VCP-associated_Multisystem_Proteinopathy.yaml entry, so no
  subtype row here binds it and the VCP row in `genetic` carries no subtype
  foreign key; that VCP entry and this one overlap in scope, which is a standing
  lump-or-split question rather than something this pass resolved. MONDO:0850514,
  the ANXA11 class, is declined: its label names brain white matter abnormalities
  rather than Paget disease of bone or frontotemporal dementia, and ANXA11 is
  absent from the IBMPFD GeneReviews chapter's diagnostic gene set. It is queued as
  stubs/Inclusion_Body_Myopathy_And_Brain_White_Matter_Abnormalities.yaml, whose
  notes carry the full reasoning and record that ANXA11 already has a curated home
  as the ALS23 row of kb/disorders/Amyotrophic_Lateral_Sclerosis.yaml. Sources
  consulted for this pass: the GeneReviews chapter PMID:20301649, now tagged in
  `references`, which names HNRNPA1, HNRNPA2B1 and VCP as the diagnostic genes; the
  committed ClinGen snapshot cache/clingen/gene_validity.csv, which carries a
  Moderate HNRNPA2B1 assertion against MONDO:0014178 and a Definitive VCP assertion
  against MONDO:0000507 but no HNRNPA1 assertion against any inclusion body myopathy
  entity; the founding hnRNP report PMID:23455423; and the Orphanet record
  ORPHA:52430 already cited throughout.

    term:
      id: GO:0005776
      label: autophagosome
  evidence:
  - reference: PMID:20104022
    reference_title: "VCP/p97 is essential for maturation of ubiquitin-containing autophagosomes and this function is impaired by mutations that cause IBMPFD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that VCP is essential for autophagosome maturation."
    explanation: Cell-based experiments directly establish VCP as required for autophagosome maturation.
  - reference: PMID:20104022
    reference_title: "VCP/p97 is essential for maturation of ubiquitin-containing autophagosomes and this function is impaired by mutations that cause IBMPFD."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of disease-associated VCP mutants (R155H and A232E) also causes this autophagy defect."
    explanation: Disease-associated VCP alleles reproduce the autophagy defect in experimental cells.
  - reference: PMID:20410287

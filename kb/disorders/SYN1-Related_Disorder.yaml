        id: HP:0001417
        label: X-linked inheritance
  notes: A Q555X nonsense variant and proline-rich D-domain missense variants (A51G, A550T, T567A) have
    been reported; the D-domain is a substrate of multiple protein kinases regulating synapsin function.
  variants:
  - name: p.Gln555* (Q555X)
    description: Nonsense variant segregating in a large French-Canadian family with epilepsy and autism;
      impairs MAPK/Erk phosphorylation and neurite outgrowth.
    type: nonsense
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:21441247
    reference_title: SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic
      function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additional mutations in SYN1 (A51G, A550T and T567A) were found in 1.0 and 3.5% of French-Canadian
      individuals with autism and epilepsy, respectively.
    explanation: Defines the additional D-domain variant spectrum beyond the founding Q555X variant.
  - reference: PMID:14985377
    reference_title: Identification of a mutation in synapsin I, a synaptic vesicle protein, in a family
      with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Candidate gene analysis led to identification of a nonsense mutation in the gene encoding
      synapsin I that was present in all affected family members and female carriers and was not present
      in 287 control chromosomes.
    explanation: First linkage-based identification of SYN1 as the causal gene, in a four-generation
      family.
diagnosis:
- name: SYN1 Molecular Diagnosis
  description: Diagnosis is established by identifying a hemizygous (males) or heterozygous (females)
    pathogenic SYN1 loss-of-function variant in an individual with epilepsy and/or autism spectrum disorder.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant

pathophysiology:
- name: Synapsin-1 Loss of Function
  conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
  description: Synapsin-1 is a neuron-specific phosphoprotein that coats synaptic vesicles and anchors
    them to the actin cytoskeleton, holding them in the reserve pool and regulating their mobilization
    for release. Truncating variants (nonsense, frameshift, splice and start-loss) cause loss of function;
    missense variants in the B and proline-rich D domains alter the protein's activity, and the D-domain
    variants fail to rescue synapsin I knockout neurons.
  role: trigger
  biological_scale: MOLECULAR

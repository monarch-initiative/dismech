animal_models:
- name: Syn1 knockout mouse
  species: Mouse
  genotype: Syn1 null (synapsin I-deficient), generated by homologous recombination
  publication: PMID:7568108
  genes:
  - preferred_term: Syn1
    term:
      id: MGI:98460
      label: Syn1
  description: Synapsin I-deficient mice have dispersed synaptic vesicles at presynaptic terminals, reduced
    glutamate release, delayed recovery after high-frequency stimulation, and increased seizure susceptibility.
  modeled_mechanisms:
  - target: Impaired Synaptic Vesicle Clustering and Reserve Pool Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Presynaptic terminals lose their organized vesicle clusters.
    limitations: A complete null models the truncating variants; it does not model missense variants
      such as S79W that increase rather than reduce clustering.
    evidence:
    - reference: PMID:7568108
      reference_title: Impairment of synaptic vesicle clustering and of synaptic transmission, and increased
        seizure propensity, in synapsin I-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'densely packed vesicles were only present in a narrow rim at active zones, whereas the
        majority of vesicles were dispersed throughout the terminal area.'
      explanation: Ultrastructural evidence of the clustering defect in the knockout.
  - target: Excitation-Inhibition Imbalance and Network Hyperexcitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The knockout has an increased seizure response to electrical stimulation.
    limitations: Seizures were provoked by electrical stimulation; the model was not reported to have
      the water-triggered reflex seizures or the temporo-insular localization seen in patients.
    evidence:
    - reference: PMID:7568108
      reference_title: Impairment of synaptic vesicle clustering and of synaptic transmission, and increased
        seizure propensity, in synapsin I-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Finally, synapsin I-deficient mice exhibited a strikingly increased response to electrical
        stimulation, as measured by electrographic and behavioral seizures.
      explanation: In vivo evidence of increased seizure propensity.

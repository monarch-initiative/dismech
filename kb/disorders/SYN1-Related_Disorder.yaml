  evidence:
  - reference: PMID:28973667
    reference_title: A novel SYN1 missense mutation in non-syndromic X-linked intellectual disability
      affects synaptic vesicle life cycle, clustering and mobility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a missense mutation (c.236 C > G; p.S79W) in the SYN1 gene coding for synapsin
      I in the MRX50 family, affected by non-syndromic X-linked intellectual disability. Synapsin I is
      a neuronal phosphoprotein involved in the regulation of neurotransmitter release and neuronal development.
      Several mutations in SYN1 have been identified in patients affected by epilepsy and/or autism. The
      S79W mutation segregates with the disease in the MRX50 family and all affected members display intellectual
      disability as sole clinical manifestation.
    explanation: Demonstrates cosegregation of a pathogenic SYN1 missense variant with X-linked intellectual
      disability.
  - reference: PMID:36568968
    reference_title: The different clinical facets of SYN1-related neurodevelopmental disorders.

      value:
        preferred_term: SYN1
        term:
          id: hgnc:11494
          label: SYN1
  results: A pathogenic SYN1 loss-of-function variant establishes the diagnosis.
  evidence:
  - reference: PMID:21441247
    reference_title: SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic
      function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report a Q555X mutation in synapsin 1 (SYN1), an X-linked gene encoding for a neuron-specific
      phosphoprotein implicated in the regulation of neurotransmitter release and synaptogenesis.
    explanation: Molecular identification of a SYN1 variant established the disorder.
differential_diagnoses:
- name: Other synaptic vesicle cycle disorders
  description: Other synaptic vesicle cycle disorders (STXBP1, UNC13A, SNAP25, DNM1, SYT1) present with
    epilepsy and neurodevelopmental impairment; SYN1 disease is distinguished by X-linked inheritance
    and the prominent autism/epilepsy combination without a severe neonatal epileptic encephalopathy.
  distinguishing_features:
  - An X-linked SYN1 loss-of-function variant with focal epilepsy and autism favors this disorder.
  - A de novo variant in another vesicle-cycle gene favors that diagnosis.
treatments:
- name: Antiseizure Medication
  description: Epilepsy is managed with antiseizure medications, which improve seizures in several patients;
    pharmacoresistance is also reported. No drug has been shown to work better than others in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Excitation-Inhibition Imbalance and Network Hyperexcitability
    treatment_effect: INHIBITS
    description: Antiseizure medications suppress seizure generation by the hyperexcitable network; they
      do not correct the synapsin-1 defect.
  evidence:
  - reference: PMID:36568968
    reference_title: The different clinical facets of SYN1-related neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pharmacological treatment could successfully improve epilepsy in several patients. Pharmoresistance
      was reported in 11 individuals of our cohort.
    explanation: Reports both response and pharmacoresistance to antiseizure treatment in the largest
      series.
- name: Supportive and Behavioral Care
  description: Developmental, educational, and behavioral support address the autism and learning/behavioral
    components.

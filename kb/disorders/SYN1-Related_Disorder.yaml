  evidence:
  - reference: PMID:21441247
    reference_title: SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic
      function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: all the D-domain mutants failed in rescuing the impairment in the size and trafficking of
      synaptic vesicle pools, whereas the wild-type human SynI fully reverted the KO phenotype.
    explanation: Demonstrates that the disease variants impair synapsin-1's clustering/reserve-pool function
      on synaptic vesicle pools.
  - reference: PMID:28973667
    reference_title: A novel SYN1 missense mutation in non-syndromic X-linked intellectual disability
      affects synaptic vesicle life cycle, clustering and mobility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At the protein level, the S79W Synapsin I mutation is located in the region of the B-domain
      involved in recognition of highly curved membranes. Expression of human S79W Synapsin I in Syn1
      knockout hippocampal neurons causes aberrant accumulation of small clear vesicles in the soma, increased
      clustering of synaptic vesicles at presynaptic terminals and increased frequency of excitatory spontaneous
      release events. In addition, the presence of S79W Synapsin I strongly reduces the mobility of synaptic
      vesicles, with possible implications for the regulation of neurotransmitter release and synaptic
      plasticity.
    explanation: Directly grounds abnormal membrane curvature recognition and altered synaptic vesicle
      clustering/tethering and mobility caused by pathogenic SYN1 mutation.
  downstream:
  - target: Disturbed Neurotransmitter Release and Synaptic Homeostasis
    causal_link_type: DIRECT
    description: Impaired synapsin-1-mediated clustering and trafficking of synaptic vesicle pools directly
      disrupts neurotransmitter release and synaptic homeostasis.
    evidence:
    - reference: PMID:21441247
      reference_title: SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic
        function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: all the D-domain mutants failed in rescuing the impairment in the size and trafficking
        of synaptic vesicle pools, whereas the wild-type human SynI fully reverted the KO phenotype.
      explanation: Shows that mutant synapsin-1 fails to restore synaptic vesicle pool size and trafficking
        needed for normal neurotransmitter release.

- name: Disturbed Neurotransmitter Release and Synaptic Homeostasis
  conforms_to: synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit
  description: With the Q555X variant, inhibitory terminals have a smaller readily releasable pool and
    excitatory terminals a lower release probability, so evoked synchronous release falls while asynchronous
    release rises, more strongly at excitatory synapses. Short-term plasticity shifts in opposite directions
    at the two synapse types.

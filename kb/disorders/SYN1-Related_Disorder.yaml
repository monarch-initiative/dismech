    reference_title: "SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a Q555X mutation in synapsin 1 (SYN1), an X-linked gene
      encoding for a neuron-specific phosphoprotein implicated in the regulation of
      neurotransmitter release and synaptogenesis.
    explanation: >-
      Establishes the X-linked inheritance and the synapsin-1 gene product.
pathophysiology:
- name: Synapsin-1 Loss of Function and Impaired Vesicle Clustering
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    Synapsin-1 is a neuron-specific phosphoprotein that reversibly tethers synaptic
    vesicles to the actin cytoskeleton, clustering them into the reserve pool and
    regulating their mobilization for release. Loss-of-function variants (a Q555X
    nonsense variant and proline-rich D-domain missense variants) impair this
    function: in synapsin-1 knockout neurons the disease variants fail to rescue the
    reduced size and trafficking of synaptic vesicle pools, disturbing synaptic
    homeostasis.
  role: trigger
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle cycle
    term:
      id: GO:0099504
      label: synaptic vesicle cycle
    modifier: ABNORMAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:21441247
    reference_title: "SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      all the D-domain mutants failed in rescuing the impairment in the size and
      trafficking of synaptic vesicle pools, whereas the wild-type human SynI fully
      reverted the KO phenotype.
    explanation: >-
      Demonstrates that the disease variants impair synapsin-1's clustering/
      reserve-pool function on synaptic vesicle pools.
  downstream:
  - target: Disturbed Neurotransmitter Release and Synaptic Homeostasis
    causal_link_type: DIRECT
- name: Disturbed Neurotransmitter Release and Synaptic Homeostasis
  conforms_to: "synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit"
  description: >-
    Reduced reserve-pool vesicle availability and impaired mobilization dysregulate
    neurotransmitter release and disturb synaptic homeostasis. This imbalance in
    cortical synaptic transmission is proposed to underlie both the epilepsy and the
    autism spectrum phenotype of SYN1 disease.
  role: effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neurotransmitter secretion
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: ABNORMAL
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21441247
    reference_title: "SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results demonstrate that SYN1 is a novel predisposing gene to ASDs, in
      addition to epilepsy, and strengthen the hypothesis that a disturbance of
      synaptic homeostasis underlies the pathogenesis of both diseases.
    explanation: >-
      Links the synaptic-homeostasis disturbance to both the epilepsy and the
      autism phenotype.
  downstream:

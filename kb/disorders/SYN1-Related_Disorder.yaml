- name: Bathing-Triggered Reflex Seizures
  category: Neurological
  description: Reflex seizures triggered by showering or bathing, regardless of water temperature, are
    the most characteristic manifestation; towel rubbing, toothbrushing, nail clipping, haircutting, fever
    and watching others bathe are further triggers. Bathing epilepsy is distinguished from hot-water epilepsy,
    which is not caused by SYN1 variants.

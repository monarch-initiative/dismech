- name: Excitation-Inhibition Imbalance and Network Hyperexcitability
  description: Synapsin I deficiency increases spontaneous and evoked activity and synchronized bursting
    in cortical and hippocampal networks. In patients the hyperexcitable network is temporo-insular, consistent
    with focal seizures that are often triggered by bathing or other somatosensory stimuli. Why water
    contact recruits this network is not known.

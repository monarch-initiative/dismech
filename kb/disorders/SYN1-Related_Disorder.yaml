- name: Intellectual Disability
  category: Neurological
  description: X-linked intellectual disability reported in affected males with pathogenic SYN1 variants,
    occurring either with epilepsy and behavioral features or as non-syndromic intellectual disability.
    Early seizure onset is associated with more severe intellectual disability.
  frequency: FREQUENT

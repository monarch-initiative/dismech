    snippet: Here we report a Q555X mutation in synapsin 1 (SYN1), an X-linked gene encoding for a neuron-specific
      phosphoprotein implicated in the regulation of neurotransmitter release and synaptogenesis.
    explanation: Identifies a truncating SYN1 variant as the lesion and names the gene product's presynaptic
      role.
  - reference: PMID:36568968
    reference_title: The different clinical facets of SYN1-related neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The molecular spectrum of SYN1 variants is broad and encompasses truncating variants (frameshift,
      nonsense, splicing and start-loss variants) as well as non-truncating variants (missense substitutions
      and in-frame duplications).
    explanation: Defines the variant classes that produce the lesion across the largest reported series.
  - reference: PMID:28973667
    reference_title: A novel SYN1 missense mutation in non-syndromic X-linked intellectual disability
      affects synaptic vesicle life cycle, clustering and mobility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At the protein level, the S79W Synapsin I mutation is located in the region of the B-domain
      involved in recognition of highly curved membranes.
    explanation: Places a pathogenic missense variant in the vesicle-membrane-recognition region of
      the protein.
  downstream:
  - target: Impaired Synaptic Vesicle Clustering and Reserve Pool Maintenance
    causal_link_type: DIRECT
    description: Without functional synapsin-1, synaptic vesicles are not held in organized reserve-pool
      clusters and the size and trafficking of vesicle pools are reduced.
    evidence:
    - reference: PMID:21441247
      reference_title: SYN1 loss-of-function mutations in autism and partial epilepsy cause impaired synaptic
        function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: all the D-domain mutants failed in rescuing the impairment in the size and trafficking
        of synaptic vesicle pools, whereas the wild-type human SynI fully reverted the KO phenotype.
      explanation: Disease variants fail to restore vesicle-pool size and trafficking in knockout neurons,
        tying the lesion to the pool defect.
- name: Impaired Synaptic Vesicle Clustering and Reserve Pool Maintenance
  description: Loss of synapsin-1 disperses synaptic vesicles from their clusters at the presynaptic
    terminal and reduces the size and trafficking of the reserve pool. The S79W missense variant instead
    increases clustering and reduces vesicle mobility, so the clustering step is dysregulated rather than
    uniformly reduced across the variant spectrum.

pathophysiology:
- name: Synapsin-1 Loss of Function and Impaired Vesicle Clustering
  conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
  description: 'Synapsin-1 is a neuron-specific phosphoprotein that reversibly tethers synaptic vesicles
    to the actin cytoskeleton, clustering them into the reserve pool and regulating their mobilization
    for release. Loss-of-function variants (a Q555X nonsense variant and proline-rich D-domain missense
    variants) impair this function: in synapsin-1 knockout neurons the disease variants fail to rescue
    the reduced size and trafficking of synaptic vesicle pools, disturbing synaptic homeostasis.'
  role: trigger

name: SYN1-Related Neurodevelopmental Disorder
creation_date: '2026-07-06T00:00:00Z'
description: An X-linked neurodevelopmental disorder caused by loss-of-function variants in SYN1, which
  encodes synapsin-1, a neuron-specific presynaptic phosphoprotein that tethers synaptic vesicles into
  the reserve pool and regulates neurotransmitter release and synaptogenesis. Loss of synapsin-1 function
  reduces the size and trafficking of synaptic vesicle pools, disturbing synaptic homeostasis. Affected
  males (and some carrier females) present with epilepsy — characteristically focal (partial) — and autism
  spectrum disorder, with variable learning disabilities and behavioral problems. It represents the vesicle-clustering
  / reserve-pool arm of the synaptic vesicle cycle, upstream of the docking, priming, and fusion steps
  disrupted in the other synaptic vesicle cycle disorders.
category: Mendelian

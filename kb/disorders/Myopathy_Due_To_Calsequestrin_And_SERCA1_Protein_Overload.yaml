    reference_title: "A Calsequestrin-1 Mutation Associated with a Skeletal Muscle Disease Alters Sarcoplasmic Ca2+ Release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Electrophysiological recordings and sarcoplasmic Ca2+ measurements provide evidence for less Ca2+ release from the SR of mutated myotubes when compared to that of controls."
    explanation: Patient-derived myotubes release less calcium.

    snippet: "To date, seven pathogenic variants have been described, all dominant missense variants."
    explanation: Summarises the dominant inheritance of known alleles.
  - reference: PMID:38818562
    reference_title: "[Identification of a novel variant in a patient with Calsequestrin 1 related myopathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same variant was not found in his unaffected parents."
    explanation: A de novo occurrence.
progression:
- phase: Adult onset and slow progression
  notes: >-
    Symptoms usually begin in adulthood, often in the sixth decade, with exercise
    intolerance and myalgia. Weakness, when it develops, is mild to moderate and slowly
    progressive; some patients have only hyperCKaemia.
  evidence:
  - reference: PMID:30258016
    reference_title: "The clinical spectrum of CASQ1-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients usually presented in the sixth decade with exercise intolerance and myalgias and later developed mild to moderate, slowly progressive proximal weakness with quadriceps atrophy and scapular winging."
    explanation: Natural history in the largest cohort.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: Orphanet worldwide point-prevalence class below 1 in 1,000,000.
  evidence:
  - reference: ORPHA:88635
    reference_title: "Vacuolar myopathy with sarcoplasmic reticulum protein aggregates"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:16714317"
    explanation: Orphanet epidemiology table.
diagnosis:
- name: Muscle biopsy
  description: >-
    The vacuoles look empty on routine stains but stain for sarcoplasmic reticulum
    proteins, so immunostaining or electron microscopy of biopsy tissue helps recognise
    them. Patients whose only sign is hyperCKaemia may go undiagnosed
    without a biopsy.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:26136523
    reference_title: "A CASQ1 founder mutation in three Italian families with protein aggregate myopathy and hyperCKaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that CASQ1 mutations may remain undiagnosed if a muscle biopsy is not performed, and the condition could be more common than supposed."
    explanation: Authors stress the role of biopsy in recognising the disease.
- name: Genetic testing
  description: Exome or targeted sequencing identifies the heterozygous CASQ1 variant.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41699400
    reference_title: "Vacuolar myopathy caused by CASQ1 p.Asp244His: pathogenic evidence from two unrelated Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified an identical heterozygous CASQ1 variant, c.730G > C (p.Asp244His), located at a highly conserved residue."
    explanation: Exome sequencing established the diagnosis.
differential_diagnoses:
- name: STIM1- and ORAI1-related tubular aggregate myopathy
  description: >-
    Tubular aggregates also occur with gain-of-function STIM1 and ORAI1 variants and
    with PGAM2, SCN4A and ALG14 variants, so tubular aggregates on biopsy do not point
    to CASQ1 alone.
  evidence:
  - reference: PMID:34908252
    reference_title: "Genetic defects are common in myopathies with tubular aggregates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven index cases (33%) were found to have pathogenic variant or likely pathogenic variants in STIM1, ORAI1, PGAM2, SCN4A, CASQ1 and ALG14."
    explanation: Genetic heterogeneity of myopathies with tubular aggregates.
animal_models:
- name: Casq1 p.Asp244Gly knock-in mouse
  species: Mouse
  genotype: Casq1 D244G heterozygous knock-in
  publication: PMID:33786938
  description: >-
    Heterozygous knock-in mice develop a late, progressive fast-twitch myopathy with
    CASQ1 mislocalisation, reduced calcium release, ER stress and impaired clearance of
    aggregated proteins.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: ER stress markers rise in fast-twitch muscle of older mice.
    evidence:
    - reference: PMID:33786938
      reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, ER stress markers sXbp1, BiP, and CHOP were significantly elevated in the EDL muscle of 8-month-old DG compared to WT mice"
      explanation: Direct measurement in the model.
  - target: Reduced Sarcoplasmic Reticulum Calcium Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Junctional CASQ1 loss reduces calcium release in mouse fibres.
    evidence:
    - reference: PMID:33786938
      reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Decreased junctional CASQ1 reduces SR Ca2+ release."
      explanation: Direct measurement in the model.
  - target: Reduced Junctional CASQ1 Localisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Mutant CASQ1 partly leaves the junctional sarcoplasmic reticulum.
    evidence:
    - reference: PMID:33786938
      reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The DG mutation causes CASQ1 to partially dissociate from the junctional sarcoplasmic reticulum (SR) and accumulate in the endoplasmic reticulum (ER)."
      explanation: Direct observation in the model.
  - target: Fast-Twitch Muscle Fibre Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Late, progressive loss of fast-twitch force.
    limitations: >-
      Onset is after one year in mice; the human disease typically presents in the sixth
      decade, so the time course is compressed.
    evidence:
    - reference: PMID:33786938
      reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "display a progressive myopathy characterized by decreased activity, decreased ability of fast twitch muscles to generate force and low body weight after one year of age"
      explanation: Direct measurement in the model.
discussions:
- discussion_id: casq1_cardiac_involvement
  prompt: >-
    Are the subclinical cardiac abnormalities seen in some CASQ1 myopathy patients part
    of the disease, given that the heart expresses CASQ2 rather than CASQ1?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Myopathy Due To Calsequestrin And SERCA1 Protein Overload
  rationale: >-
    Three of 22 patients in the largest cohort had subclinical cardiac findings, but the
    report gives no mechanism, and a later literature review notes that cardiac
    insufficiency is rarely seen. No cardiac phenotype is recorded in this entry.
  evidence:
  - reference: PMID:30258016
    reference_title: "The clinical spectrum of CASQ1-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients presented subclinical cardiac abnormalities."
    explanation: The cohort report of cardiac findings.
  - reference: PMID:36514469
    reference_title: "CASQ1-related myopathy: The first report from China and the literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Despite experimental evidence suggesting that CASQ1 deficiency is causally related to malignant hyperthermia-like arrhythmia, respiratory and cardiac insufficiency have rarely appeared in CASQ1-related cases."
    explanation: Literature review finding cardiac involvement uncommon.
- discussion_id: casq1_calcium_versus_proteotoxic_drivers
  prompt: >-
    How much of the vacuolar myopathy is driven by reduced sarcoplasmic reticulum calcium
    release, and how much by ER stress and failed clearance of aggregated protein?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Sarcoplasmic Reticulum Calcium Release
  - pathophysiology#Endoplasmic Reticulum Stress and Unfolded Protein Response
  - pathophysiology#Impaired Clearance of Aggregated Proteins
  rationale: >-
    In the knock-in mouse both processes are present and appear to act through largely
    separate pathways, but their relative weight has not been tested, for example by
    relieving ER stress without changing calcium handling.
  evidence:
  - reference: PMID:33786938
    reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Differentiating between the contributions to the disease process of altered Ca2+ signaling and changes driven by ER stress and uncleared protein aggregates requires further study."
    explanation: The model's authors state the question as open.
references:
- reference: PMID:16714317
  title: "SERCA1 and calsequestrin storage myopathy: a new surplus protein myopathy."
  findings:
  - statement: First description of the disease as a surplus-protein myopathy with SERCA1 and calsequestrin inclusions, before CASQ1 was identified as the gene.

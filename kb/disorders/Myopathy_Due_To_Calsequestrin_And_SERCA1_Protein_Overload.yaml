- category: Musculoskeletal
  name: Distal upper limb weakness
  description: >-
    Reported in a single patient with the p.Val256Met allele, in whom weakness began in
    the distal upper limbs; this distribution is unusual for the disease.
  phenotype_term:
    preferred_term: Distal upper limb muscle weakness
    term:
      id: HP:0008959
      label: Distal upper limb muscle weakness
  evidence:
  - reference: PMID:36514469
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with a 12 years history of slowly progressive upper limb weakness, predominantly affecting distal muscles, which was uncommon comparing to other CASQ1-related patients"
    explanation: Single case report of a distal-predominant presentation.
- category: Musculoskeletal
  name: Fibrofatty replacement of muscle on MRI
  phenotype_term:
    preferred_term: Fatty replacement of skeletal muscle
    term:
      id: HP:0012548
      label: Fatty replacement of skeletal muscle
  evidence:
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle MRI (n = 11) showed a recurrent fibrofatty substitution pattern."
    explanation: Muscle imaging finding in the cohort.
- category: Musculoskeletal
  name: Sarcoplasmic reticulum protein inclusions in vacuoles
  description: >-
    Vacuoles in type II fibres contain inclusions of calsequestrin, SERCA1, RyR1 and
    other sarcoplasmic reticulum proteins. The vacuoles are empty on routine stains,
    so diagnosis needs a muscle biopsy with immunostaining or electron microscopy.
  subtype: Vacuolar aggregate type
  diagnostic: true
  phenotype_term:
    preferred_term: Muscle fiber cytoplasmatic inclusion bodies
    term:
      id: HP:0100303
      label: Muscle fiber cytoplasmatic inclusion bodies
  evidence:
  - reference: PMID:16714317
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sarcoplasmic or endoplasmic reticulum calcium 1 (SERCA1) ATPase and/or calsequestrin reactivity of inclusions, by immunohistochemistry, and the SERCA1- and calsequestrin-increased expression, by immunoblot, suggested that inclusions were constituted by an excess of proteins normally present in the terminal cisternae of sarcoplasmic reticulum."
    explanation: Immunohistochemistry and immunoblot of patient inclusions.
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle histopathology in patients with p.Asp244Gly showed vacuoles in type II fibers appearing empty in hematoxylin-eosin, Gomori, and nicotinamide adenine dinucleotide (NADH) tetrazolium reductase stains but strongly positive for sarcoplasmic reticulum proteins."
    explanation: Vacuoles stain for sarcoplasmic reticulum proteins despite appearing empty.
- category: Musculoskeletal
  name: Tubular aggregates in muscle fibres
  subtype: Tubular aggregate type
  diagnostic: true
  phenotype_term:
    preferred_term: Muscle fiber tubular inclusions
    term:
      id: HP:0100301
      label: Muscle fiber tubular inclusions
  evidence:
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The muscle histopathology of p.Gly103Asp mutation was different, showing also NADH-positive accumulation consistent with tubular aggregates."
    explanation: Tubular aggregates in the p.Gly103Asp patient.
  - reference: PMID:28895244
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the identification of three novel missense mutations in the calsequestrin-1 (CASQ1) gene in four patients with tubular aggregate myopathy."
    explanation: Patients with other CASQ1 alleles have tubular aggregate myopathy.
genetic:
- name: CASQ1
  gene_term:
    preferred_term: CASQ1
    term:
      id: hgnc:1512
      label: CASQ1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    CASQ1 encodes calsequestrin-1, the main calcium-binding protein of the skeletal
    muscle sarcoplasmic reticulum, expressed mainly in fast-twitch fibres. Reported
    pathogenic alleles are heterozygous and nearly all missense. No ClinGen
    gene-disease validity assertion for CASQ1 is cached in this repository.
  evidence:
  - reference: PMID:26136523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is due to the D244G heterozygous missense mutation in the CASQ1 gene"
    explanation: Linkage and exome sequencing in three families identify the causal CASQ1 variant.
  - reference: ORPHA:88635
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CASQ1 | calsequestrin 1 | hgnc:1512 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists CASQ1 as the disease-causing gene.
  variants:
  - name: p.Asp244Gly
    description: >-
      Italian founder allele in a high-affinity calcium-binding site; causes the
      vacuolar aggregate presentation and accounted for 21 of 22 patients in the
      largest cohort.
    evidence:
    - reference: PMID:26136523
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Investigation of microsatellite markers revealed a common haplotype in the three families indicating consanguinity and a founder effect."
      explanation: Shared haplotype indicates a founder allele.
    - reference: PMID:30258016
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Twenty-two CASQ1-mutated patients (12 families) were identified, 21 sharing the previously described founder mutation (p.Asp244Gly) and 1 with the p.Gly103Asp mutation."
      explanation: Shows how dominant the founder allele is in the Italian cohort.
  - name: p.Asp244His
    description: A second substitution at the same residue, reported in Chinese patients with the vacuolar presentation, including one de novo case.
    evidence:
    - reference: PMID:41699400
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing identified an identical heterozygous CASQ1 variant, c.730G > C (p.Asp244His), located at a highly conserved residue."
      explanation: Identifies p.Asp244His in two unrelated families.
    - reference: PMID:38818562
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The same variant was not found in his unaffected parents."
      explanation: The variant arose de novo in this patient.
  - name: p.Gly103Asp
    description: Tubular aggregate allele with reduced calcium-dependent polymerisation.
    evidence:
    - reference: PMID:28895244
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "showed a reduced Ca2+ -dependent aggregation for the CASQ1 protein containing p.Asp44Asn and p.Gly103Asp mutations"
      explanation: Functional defect of the allele.
  - name: p.Val256Met
    description: Reported in one patient with distal-predominant upper limb weakness and rare vacuoles.
    evidence:
    - reference: PMID:36514469
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Next-generation sequencing (NGS) analysis revealed a novel heterozygous mutation (c.766G > A, p.Val256Met) in CASQ1."
      explanation: Case report identifying the allele.
  - name: p.Gly383Alafs*39
    description: C-terminal frameshift that extends the protein; the extended protein aggregates in transfected cells.
    evidence:
    - reference: PMID:41313434
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell-transfection studies showed that the variant protein forms aggregates."
      explanation: Functional evidence for the frameshift allele.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous CASQ1 variants segregate as an autosomal dominant trait in families.
    De novo occurrence has been reported.
  evidence:
  - reference: PMID:26136523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 10 patients from three Italian families with autosomal dominant benign vacuolar myopathy and hyperCKaemia"
    explanation: Dominant segregation in three families.
  - reference: PMID:41313434
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, seven pathogenic variants have been described, all dominant missense variants."
    explanation: Summarises the dominant inheritance of known alleles.
progression:
- phase: Adult onset and slow progression
  notes: >-
    Symptoms usually begin in adulthood, often in the sixth decade, with exercise
    intolerance and myalgia. Weakness, when it develops, is mild to moderate and slowly
    progressive; some patients have only hyperCKaemia.
  evidence:
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients usually presented in the sixth decade with exercise intolerance and myalgias and later developed mild to moderate, slowly progressive proximal weakness with quadriceps atrophy and scapular winging."
    explanation: Natural history in the largest cohort.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: Orphanet worldwide point-prevalence class below 1 in 1,000,000.
  evidence:
  - reference: ORPHA:88635
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1 000 000 | Worldwide | Point prevalence | PMID:16714317"
    explanation: Orphanet epidemiology table.
diagnosis:
- name: Muscle biopsy
  description: >-
    The vacuoles look empty on routine stains, so the diagnosis can be missed unless
    biopsy tissue is immunostained for sarcoplasmic reticulum proteins or examined by
    electron microscopy. Patients whose only sign is hyperCKaemia may go undiagnosed
    without a biopsy.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:26136523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that CASQ1 mutations may remain undiagnosed if a muscle biopsy is not performed, and the condition could be more common than supposed."
    explanation: Authors stress the role of biopsy in recognising the disease.
- name: Genetic testing
  description: Exome or targeted sequencing identifies the heterozygous CASQ1 variant.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41699400
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified an identical heterozygous CASQ1 variant, c.730G > C (p.Asp244His), located at a highly conserved residue."
    explanation: Exome sequencing established the diagnosis.
differential_diagnoses:
- name: STIM1- and ORAI1-related tubular aggregate myopathy
  description: >-
    Tubular aggregates also occur with gain-of-function STIM1 and ORAI1 variants and
    with PGAM2, SCN4A and ALG14 variants, so tubular aggregates on biopsy do not point
    to CASQ1 alone.
  evidence:
  - reference: PMID:34908252
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven index cases (33%) were found to have pathogenic variant or likely pathogenic variants in STIM1, ORAI1, PGAM2, SCN4A, CASQ1 and ALG14."
    explanation: Genetic heterogeneity of myopathies with tubular aggregates.
animal_models:
- name: Casq1 p.Asp244Gly knock-in mouse
  species: Mouse
  genotype: Casq1 D244G heterozygous knock-in
  publication: PMID:33786938
  description: >-
    Heterozygous knock-in mice develop a late, progressive fast-twitch myopathy with
    CASQ1 mislocalisation, reduced calcium release, ER stress and impaired clearance of
    aggregated proteins.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: ER stress markers rise in fast-twitch muscle of older mice.
    evidence:
    - reference: PMID:33786938
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, ER stress markers sXbp1, BiP, and CHOP were significantly elevated in the EDL muscle of 8-month-old DG compared to WT mice"
      explanation: Direct measurement in the model.
  - target: Reduced Sarcoplasmic Reticulum Calcium Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Junctional CASQ1 loss reduces calcium release in mouse fibres.
    evidence:
    - reference: PMID:33786938
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Decreased junctional CASQ1 reduces SR Ca2+ release."
      explanation: Direct measurement in the model.
references:
- reference: PMID:16714317
  title: "SERCA1 and calsequestrin storage myopathy: a new surplus protein myopathy."
  findings:
  - statement: First description of the disease as a surplus-protein myopathy with SERCA1 and calsequestrin inclusions, before CASQ1 was identified as the gene.
- reference: PMID:25116801
  title: A mutation in the CASQ1 gene causes a vacuolar myopathy with accumulation of sarcoplasmic reticulum protein aggregates.
  findings:
  - statement: Identifies CASQ1 p.Asp244Gly and shows it impairs polymerisation and forms aggregate-filled SR vacuoles.
- reference: PMID:30258016
  title: The clinical spectrum of CASQ1-related myopathy.
  findings:
  - statement: Largest clinical cohort, 22 patients from 12 families.

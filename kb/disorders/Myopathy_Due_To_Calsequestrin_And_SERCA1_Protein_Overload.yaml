    reference_title: "Identification and characterization of three novel mutations in the CASQ1 gene in four patients with tubular aggregate myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of single muscle fibers of a patient carrying the p.Gly103Asp mutation showed a significant reduction in response to caffeine stimulation, compared with normal control fibers."
    explanation: Reduced caffeine-induced release in isolated fibres from a tubular aggregate patient, measured ex vivo.
  downstream:
  - target: Fast-Twitch Muscle Fibre Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27196359
      reference_title: "A Calsequestrin-1 Mutation Associated with a Skeletal Muscle Disease Alters Sarcoplasmic Ca2+ Release."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "points out defects in Ca2+ homeostasis within muscle fibers as a possible mechanism underlying muscle cramping, weakness and fatigue"
      explanation: The authors propose the calcium-release defect as a cause of the symptoms.
    - reference: PMID:33786938
      reference_title: "Pathological mechanisms of vacuolar aggregate myopathy arising from a Casq1 mutation."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Decreased Ca2+ release is probably not directly responsible for the decrease in force generation since force is not altered in young mice."

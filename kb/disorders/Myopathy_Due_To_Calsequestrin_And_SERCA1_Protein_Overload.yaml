      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "However, the decreased Ca2+ release could lead to decreased activation of Ca2+ regulated pathways, which could impact muscle function."
      explanation: The same authors allow an indirect route through calcium-regulated pathways.

name: Myopathy Due To Calsequestrin And SERCA1 Protein Overload
creation_date: "2026-10-15T17:45:00Z"
description: >-
  An autosomal dominant skeletal-muscle disorder caused by heterozygous CASQ1 variants
  that disturb the calcium-dependent polymerisation of calsequestrin-1, the main
  calcium buffer of the sarcoplasmic reticulum in fast-twitch fibres. Most patients
  carry the Italian founder allele p.Asp244Gly and show optically empty vacuoles in
  type II fibres that contain aggregated calsequestrin, SERCA1 and other sarcoplasmic
  reticulum proteins. A smaller group of alleles instead produces tubular aggregates.
  Presentation is usually in adulthood with exercise intolerance, myalgia, cramps,
  fatigue and raised creatine kinase, sometimes with no symptoms beyond hyperCKaemia,
  followed in some patients by slowly progressive proximal weakness with quadriceps
  atrophy and scapular winging.
category: Mendelian
synonyms:
- Vacuolar myopathy with CASQ1 aggregates
- VMCQA
- Vacuolar aggregate myopathy
- Vacuolar myopathy with sarcoplasmic reticulum protein aggregates
- CASQ1-related myopathy
- SERCA1 and calsequestrin storage myopathy
disease_term:
  preferred_term: myopathy due to calsequestrin and SERCA1 protein overload
  term:
    id: MONDO:0014546
    label: myopathy due to calsequestrin and SERCA1 protein overload
parents:
- Protein aggregate myopathy
- Hereditary skeletal muscle disorder
notes: >-
  MONDO:0014546 is the only MONDO concept for CASQ1-related muscle disease, so this
  entry covers both the vacuolar aggregate presentation and the CASQ1 tubular aggregate
  presentation, which are recorded as allelic subtypes. The two share a defect in
  calcium-dependent CASQ1 polymerisation but diverge downstream: the vacuolar alleles
  act through protein aggregation and ER stress, while the tubular aggregate alleles
  reduce calcium storage and weaken CASQ1 inhibition of store-operated calcium entry.
  No GeneReviews chapter exists for this disease. No disease-specific or supportive
  treatment has been evaluated in patients, so the entry has no treatments section.
  HPO has no term for non-rimmed, optically empty muscle-fibre vacuoles; the vacuolar
  inclusions are bound to HP:0100303 Muscle fiber cytoplasmatic inclusion bodies.
has_subtypes:
- name: Vacuolar aggregate type
  display_name: Vacuolar aggregate myopathy (CASQ1 p.Asp244Gly / p.Asp244His)
  description: >-
    The common presentation, caused by the Italian founder allele p.Asp244Gly and by
    p.Asp244His at the same residue. Muscle biopsy shows vacuoles in type II fibres
    that appear empty on routine stains but contain aggregated calsequestrin, SERCA1,
    RyR1 and other sarcoplasmic reticulum proteins.
  genes:
  - preferred_term: CASQ1
    term:
      id: hgnc:1512
      label: CASQ1
  evidence:
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle histopathology in patients with p.Asp244Gly showed vacuoles in type II fibers appearing empty in hematoxylin-eosin, Gomori, and nicotinamide adenine dinucleotide (NADH) tetrazolium reductase stains but strongly positive for sarcoplasmic reticulum proteins."
    explanation: Defines the vacuolar histopathology of the founder allele in the largest cohort.
  - reference: PMID:41699400
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies revealed typical optically empty vacuoles primarily in type II fibers."
    explanation: The p.Asp244His allele produces the same vacuolar picture.
- name: Tubular aggregate type
  display_name: CASQ1 tubular aggregate myopathy
  description: >-
    Caused by other CASQ1 missense alleles, including p.Asp44Asn, p.Gly103Asp and
    p.Ile385Thr. Muscle biopsy shows tubular aggregates. These alleles reduce calcium
    storage by calsequestrin and, for at least p.Asp44Asn and p.Ile385Thr, weaken its
    inhibition of store-operated calcium entry, a mechanism shared with the STIM1 and
    ORAI1 tubular aggregate myopathies.
  genes:
  - preferred_term: CASQ1
    term:
      id: hgnc:1512
      label: CASQ1
  evidence:
  - reference: PMID:28895244
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the identification of three novel missense mutations in the calsequestrin-1 (CASQ1) gene in four patients with tubular aggregate myopathy."
    explanation: Establishes CASQ1 tubular aggregate myopathy as an allelic presentation.
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The muscle histopathology of p.Gly103Asp mutation was different, showing also NADH-positive accumulation consistent with tubular aggregates."
    explanation: Contrasts the tubular aggregate histopathology of p.Gly103Asp with the vacuoles of p.Asp244Gly.
pathophysiology:
- name: Heterozygous CASQ1 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline CASQ1 variant alters calsequestrin-1. Reported alleles are
    almost all missense, at conserved residues; p.Asp244Gly sits in a high-affinity
    calcium-binding site. A C-terminal frameshift that extends the protein has also been
    reported.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  gene:
    preferred_term: CASQ1
    term:
      id: hgnc:1512
      label: CASQ1
  evidence:
  - reference: PMID:25116801
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation affects a conserved aspartic acid in position 244 (p.Asp244Gly) located in one of the high-affinity Ca(2+) -binding sites of CASQ1"
    explanation: Identifies the founder missense variant and its location in a calcium-binding site.
  - reference: PMID:41313434
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In silico analysis indicated that the variant results in protein extension, which was confirmed by western blotting of patient muscle."
    explanation: Shows a non-missense C-terminal extension allele in a second family.
  downstream:
  - target: Impaired Calcium-Dependent CASQ1 Polymerisation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25116801
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of the mutated CASQ1 protein in COS-7 cells showed a markedly reduced ability in forming elongated polymers"
      explanation: The p.Asp244Gly allele directly impairs polymer formation.
- name: Impaired Calcium-Dependent CASQ1 Polymerisation
  biological_scale: MOLECULAR
  description: >-
    Calsequestrin-1 normally binds calcium and assembles into polymers that buffer
    calcium in the terminal cisternae next to RyR1. Disease alleles change this
    behaviour in two directions. p.Asp244Gly loses calcium binding and aggregates
    abruptly instead of forming ordered polymers, while p.Asp44Asn and p.Gly103Asp show
    reduced calcium-dependent aggregation.
  molecular_functions:
  - preferred_term: calcium ion binding
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: calcium-dependent calsequestrin polymerisation
    term:
      id: GO:0051258
      label: protein polymerization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: sarcoplasmic reticulum lumen
    term:
      id: GO:0033018
      label: sarcoplasmic reticulum lumen
  evidence:
  - reference: PMID:26416891
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Equilibrium dialysis and turbidity measurements showed that D244G and, to a lesser extent, M87T partially lose Ca(2+) binding exhibited by wild type calsequestrin 1 at high Ca(2+) concentrations."
    explanation: Purified human p.Asp244Gly protein loses calcium binding.
  - reference: PMID:28895244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed a reduced Ca2+ -dependent aggregation for the CASQ1 protein containing p.Asp44Asn and p.Gly103Asp mutations and a slight increase in Ca2+ -dependent aggregation for the p.Ile385Thr"
    explanation: Tubular aggregate alleles also alter calcium-dependent polymerisation, in differing directions.
  downstream:
  - target: Aberrant CASQ1 Aggregation with SERCA1 and RyR1
    causal_link_type: DIRECT
    description: Applies to the vacuolar alleles.
    evidence:
    - reference: PMID:26416891
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "D244G aggregates abruptly and abnormally, a property that fully explains the protein inclusions that characterize its phenotype."
      explanation: Links the biophysical defect of the mutant protein to the inclusions seen in patients.
  - target: Reduced Junctional CASQ1 Localisation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Applies to p.Asp244Gly in the knock-in mouse.
  - target: Reduced Sarcoplasmic Reticulum Calcium Storage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Applies to the tubular aggregate alleles.
- name: Aberrant CASQ1 Aggregation with SERCA1 and RyR1
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  subtypes:
  - Vacuolar aggregate type
  description: >-
    Mutant calsequestrin-1 forms aggregates within the sarcoplasmic reticulum that
    also contain non-mutant proteins of the terminal cisternae, including SERCA1 and
    RyR1. Immunoblot shows increased SERCA1 and calsequestrin in patient muscle, which
    gives the disease its MONDO name. The aggregates co-localise with SQSTM1/p62.
  cell_types:
  - preferred_term: type II muscle fibre
    term:
      id: CL:0002212
      label: type II muscle cell
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  cellular_components:
  - preferred_term: terminal cisterna
    term:
      id: GO:0014802
      label: terminal cisterna
  evidence:
  - reference: PMID:16714317
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sarcoplasmic or endoplasmic reticulum calcium 1 (SERCA1) ATPase and/or calsequestrin reactivity of inclusions, by immunohistochemistry, and the SERCA1- and calsequestrin-increased expression, by immunoblot, suggested that inclusions were constituted by an excess of proteins normally present in the terminal cisternae of sarcoplasmic reticulum."
    explanation: The founding description of SERCA1 and calsequestrin overload in patient inclusions.
  - reference: PMID:27196359
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A strong co-immuno staining of both RyR1 and CASQ1 was also noted in the vacuoles of myotubes and muscle biopsies derived from patients."
    explanation: RyR1 co-accumulates with CASQ1 in patient vacuoles.
  - reference: PMID:41699400
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence revealed abnormal aggregation of CASQ1 protein around the edge of vacuoles, co-localized with SQSTM1/p62, and the endoplasmic reticulum (ER) stress marker PERK."
    explanation: The p.Asp244His allele produces CASQ1 aggregates with p62 in patient muscle.
  - reference: PMID:41699400
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro expression of the mutant CASQ1 in HeLa cells confirmed its aggregation tendency"
    explanation: Mutant protein aggregates when expressed in cells.
  downstream:
  - target: Sarcoplasmic Reticulum Vacuole Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25116801
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "both in cultured myotubes and in in vivo mouse fibers induced the formation of electron-dense SR vacuoles containing aggregates of the mutant CASQ1 protein that resemble those observed in muscle biopsies of patients"
      explanation: Expressing the mutant protein is sufficient to form aggregate-filled SR vacuoles.
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33786938
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data suggest that the mutant CASQ1 accumulates in the perinuclear ER, leading to UPR, ER stress, and eventually accumulation of aggregated proteins."
      explanation: Knock-in mouse data link mutant CASQ1 accumulation to the unfolded protein response.
- name: Sarcoplasmic Reticulum Vacuole Formation
  biological_scale: CELLULAR
  subtypes:
  - Vacuolar aggregate type
  description: >-
    Large vacuoles derived from the sarcoplasmic reticulum form mainly in type II
    fibres. They look empty on haematoxylin-eosin, Gomori trichrome and NADH stains but
    contain electron-dense material and stain strongly for sarcoplasmic reticulum
    proteins.
  cell_types:
  - preferred_term: type II muscle fibre
    term:
      id: CL:0002212
      label: type II muscle cell
  evidence:
  - reference: PMID:25116801
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light microscopy of muscle biopsies of all probands revealed, as a distinctive feature, the presence, mainly in type II fibers, of vacuoles that did not stain by routine histochemical analysis"
    explanation: Describes the vacuoles in patient biopsies and their type II predominance.
  downstream:
  - target: Sarcoplasmic reticulum protein inclusions in vacuoles
- name: Reduced Junctional CASQ1 Localisation
  biological_scale: CELLULAR
  subtypes:
  - Vacuolar aggregate type
  description: >-
    In heterozygous p.Asp244Gly knock-in mice, part of the mutant calsequestrin-1 leaves
    the junctional sarcoplasmic reticulum next to RyR1 and accumulates in the
    endoplasmic reticulum. Less calsequestrin is then available at the release site.
  cellular_components:
  - preferred_term: junctional sarcoplasmic reticulum membrane
    term:
      id: GO:0014701
      label: junctional sarcoplasmic reticulum membrane
  evidence:
  - reference: PMID:33786938
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The DG mutation causes CASQ1 to partially dissociate from the junctional sarcoplasmic reticulum (SR) and accumulate in the endoplasmic reticulum (ER)."
    explanation: Direct observation of mislocalisation in the knock-in mouse.
  downstream:
  - target: Reduced Sarcoplasmic Reticulum Calcium Release
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33786938
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Decreased junctional CASQ1 reduces SR Ca2+ release."
      explanation: States the causal link between mislocalisation and reduced release.
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Sarcoplasmic Reticulum Calcium Storage
  biological_scale: CELLULAR
  subtypes:
  - Tubular aggregate type
  description: >-
    Tubular aggregate alleles lower the amount of calcium that calsequestrin-1 can hold
    in the sarcoplasmic reticulum, measured both in non-muscle cells and in
    Casq1-knockout mouse fibres re-expressing the mutant proteins.
  biological_processes:
  - preferred_term: sarcoplasmic reticulum calcium ion transport
    term:
      id: GO:0070296
      label: sarcoplasmic reticulum calcium ion transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28895244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of CASQ1 mutations in eukaryotic cells revealed a reduced ability of all these CASQ1 mutants to store Ca2+"
    explanation: All three tubular aggregate alleles store less calcium.
  - reference: PMID:39126637
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of intracellular Ca2+ confirmed that CASQ1 mutants have impaired ability to store Ca2+and lose their ability to inhibit skeletal muscle SOCE"
    explanation: Confirms the storage defect in skeletal muscle fibres.
  downstream:
  - target: Reduced Sarcoplasmic Reticulum Calcium Release
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Loss of CASQ1 Inhibition of Store-Operated Calcium Entry
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Loss of CASQ1 Inhibition of Store-Operated Calcium Entry
  biological_scale: CELLULAR
  subtypes:
  - Tubular aggregate type
  description: >-
    Calsequestrin-1 binds STIM1 and STIM2 and restrains store-operated calcium entry.
    Tubular aggregate alleles lose this restraint. The vacuolar p.Asp244Gly allele does
    not appear to: knock-in mice carrying it show normal store-operated calcium entry,
    which is one reason the two presentations are modelled as separate branches.
  biological_processes:
  - preferred_term: negative regulation of store-operated calcium entry
    term:
      id: GO:0106128
      label: negative regulation of store-operated calcium entry
    modifier: DECREASED
  evidence:
  - reference: PMID:28895244
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a reduced inhibitory effect of p.Ile385Thr and p.Asp44Asn on store operated Ca2+ entry"
    explanation: Two tubular aggregate alleles weaken SOCE inhibition in cells.
  - reference: PMID:39126637
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, neither one of the CASQ1 mutants induced a significant SOCE inhibition, suggesting that, beyond altering Ca2+ binding, CASQ1 mutations also influence SOCE regulation"
    explanation: In mouse muscle fibres the tubular aggregate mutants fail to inhibit SOCE.
  - reference: PMID:39126637
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Interestingly, mice knock-in for the CASQ1Asp244Gly, the CASQ1 mutation identified in patients with vacuolar myopathy, did not display any difference in SOCE compared to wild type mice"
    explanation: >-
      Restricts this node to the tubular aggregate alleles: the vacuolar founder allele
      leaves SOCE unchanged in knock-in mice, so this evidence does not bear on the
      tubular aggregate claim itself.
  downstream:
  - target: Tubular Aggregate Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39126637
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "this is in agreement with the evidence that alterations in Ca2+entry due to mutations in either STIM1, ORAI1 or CASQ1 represents a hallmark of TAM"
      explanation: Places altered calcium entry as the common feature of tubular aggregate myopathy genes; the causal step to aggregate formation is inferred.
- name: Tubular Aggregate Formation
  biological_scale: CELLULAR
  subtypes:
  - Tubular aggregate type
  description: >-
    Densely packed membrane tubules derived from the sarcoplasmic reticulum accumulate
    in muscle fibres and react for NADH tetrazolium reductase.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:30258016
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The muscle histopathology of p.Gly103Asp mutation was different, showing also NADH-positive accumulation consistent with tubular aggregates."
    explanation: Tubular aggregates in a patient with a tubular aggregate allele.
  downstream:
  - target: Tubular aggregates in muscle fibres
- name: Endoplasmic Reticulum Stress and Unfolded Protein Response
  biological_scale: CELLULAR
  subtypes:
  - Vacuolar aggregate type
  description: >-
    Accumulating mutant calsequestrin-1 activates the unfolded protein response. In
    knock-in mice the markers sXbp1, BiP and CHOP rise in fast-twitch muscle by eight
    months of age, and patient muscle with p.Asp244His stains for the ER stress marker
    PERK around the vacuoles.
  cell_types:
  - preferred_term: type II muscle fibre
    term:
      id: CL:0002212
      label: type II muscle cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:33786938
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, ER stress markers sXbp1, BiP, and CHOP were significantly elevated in the EDL muscle of 8-month-old DG compared to WT mice"
    explanation: Measured ER stress in fast-twitch muscle of knock-in mice.
  - reference: PMID:41699400
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence revealed abnormal aggregation of CASQ1 protein around the edge of vacuoles, co-localized with SQSTM1/p62, and the endoplasmic reticulum (ER) stress marker PERK."
    explanation: An ER stress marker is present at the aggregates in patient muscle.
  downstream:
  - target: Impaired Clearance of Aggregated Proteins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Clearance of Aggregated Proteins
  biological_scale: CELLULAR
  subtypes:
  - Vacuolar aggregate type
  description: >-
    In older knock-in mice, mTORC1 signalling increases, autophagic flux falls and
    proteasomal clearance of aggregated proteins is inadequate, so insoluble
    ubiquitinated proteins and lysosomes accumulate. Younger mice clear the misfolded
    protein, which fits the late onset in patients.
  biological_processes:
  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:33786938
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Muscles from older DG mice display ER stress, ER expansion, increased mTOR signaling, inadequate clearance of aggregated proteins by the proteasomes, and elevation of protein aggregates and lysosomes."
    explanation: Summarises the age-dependent clearance failure in knock-in mice.
  - reference: PMID:33786938
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Activation of mTOR is also consistent with the decreased autophagic flux detected in 8-month-old mice."
    explanation: Reports the fall in autophagic flux.
  downstream:
  - target: Fast-Twitch Muscle Fibre Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33786938
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The subsequent maladaptive increase in protein synthesis and decreased protein aggregate clearance are likely to contribute to disease progression."
      explanation: The authors propose, rather than demonstrate, that clearance failure drives progression.

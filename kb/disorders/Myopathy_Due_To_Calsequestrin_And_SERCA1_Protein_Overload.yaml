    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "later developed mild to moderate, slowly progressive proximal weakness with quadriceps atrophy and scapular winging"
    explanation: Describes the later weakness in the cohort.
- category: Musculoskeletal
  name: Quadriceps atrophy
  phenotype_term:

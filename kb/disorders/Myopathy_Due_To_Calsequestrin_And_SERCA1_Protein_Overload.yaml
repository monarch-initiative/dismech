genetic:
- name: CASQ1
  gene_term:
    preferred_term: CASQ1
    term:
      id: hgnc:1512
      label: CASQ1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    CASQ1 encodes calsequestrin-1, the main calcium-binding protein of the skeletal
    muscle sarcoplasmic reticulum, expressed mainly in fast-twitch fibres. Reported
    pathogenic alleles are heterozygous and nearly all missense. No ClinGen
    gene-disease validity assertion for CASQ1 is cached in this repository.
  evidence:
  - reference: PMID:26136523
    reference_title: "A CASQ1 founder mutation in three Italian families with protein aggregate myopathy and hyperCKaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is due to the D244G heterozygous missense mutation in the CASQ1 gene"
    explanation: Linkage and exome sequencing in three families identify the causal CASQ1 variant.
  - reference: ORPHA:88635
    reference_title: "Vacuolar myopathy with sarcoplasmic reticulum protein aggregates"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CASQ1 | calsequestrin 1 | hgnc:1512 | Disease-causing germline mutation(s) in"
    explanation: Orphanet lists CASQ1 as the disease-causing gene.
  variants:
  - name: p.Asp244Gly
    description: >-
      Italian founder allele in a high-affinity calcium-binding site; causes the
      vacuolar aggregate presentation and accounted for 21 of 22 patients in the
      largest cohort.
    evidence:
    - reference: PMID:26136523
      reference_title: "A CASQ1 founder mutation in three Italian families with protein aggregate myopathy and hyperCKaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Investigation of microsatellite markers revealed a common haplotype in the three families indicating consanguinity and a founder effect."
      explanation: Shared haplotype indicates a founder allele.
    - reference: PMID:30258016
      reference_title: "The clinical spectrum of CASQ1-related myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Twenty-two CASQ1-mutated patients (12 families) were identified, 21 sharing the previously described founder mutation (p.Asp244Gly) and 1 with the p.Gly103Asp mutation."
      explanation: Shows how dominant the founder allele is in the Italian cohort.
  - name: p.Asp244His
    description: >-
      A second substitution at the same residue, reported in Chinese patients. Two
      unrelated families had the vacuolar presentation; a de novo patient had both
      tubular aggregates and vacuoles.
    evidence:
    - reference: PMID:41699400
      reference_title: "Vacuolar myopathy caused by CASQ1 p.Asp244His: pathogenic evidence from two unrelated Chinese families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing identified an identical heterozygous CASQ1 variant, c.730G > C (p.Asp244His), located at a highly conserved residue."
      explanation: Identifies p.Asp244His in two unrelated families.
    - reference: PMID:38818562
      reference_title: "[Identification of a novel variant in a patient with Calsequestrin 1 related myopathy]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The same variant was not found in his unaffected parents."
      explanation: The variant arose de novo in this patient.
    - reference: PMID:38818562
      reference_title: "[Identification of a novel variant in a patient with Calsequestrin 1 related myopathy]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To explore the genetic basis of a myopathic patient with pathological characteristics including tubular aggregates and vacuoles."
      explanation: The de novo p.Asp244His patient had mixed histology.
  - name: p.Gly103Asp
    description: Tubular aggregate allele with reduced calcium-dependent polymerisation.
    evidence:
    - reference: PMID:28895244
      reference_title: "Identification and characterization of three novel mutations in the CASQ1 gene in four patients with tubular aggregate myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "showed a reduced Ca2+ -dependent aggregation for the CASQ1 protein containing p.Asp44Asn and p.Gly103Asp mutations"

    snippet: "affected by a mild myopathy accompanied by one or more symptoms, including episodes of muscle cramping, reduced muscle strength, fatigue and elevated plasma creatine kinase (CK) levels"
    explanation: Cramping episodes are among the symptoms in the first genetically defined cohort.
- category: Musculoskeletal
  name: Fatigue
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:25116801
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation in the calsequestrin-1 gene (CASQ1) was found in a group of patients with a myopathy characterized by weakness, fatigue, and the presence of large vacuoles"
    explanation: Fatigue is part of the defining clinical picture.
- category: Musculoskeletal
  name: Proximal muscle weakness
  description: >-
    Mild to moderate, slowly progressive proximal weakness develops after the initial

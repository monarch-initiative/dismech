- name: Reduced Sarcoplasmic Reticulum Calcium Release
  biological_scale: CELLULAR
  description: >-
    Less calcium is released from the sarcoplasmic reticulum on stimulation. This is
    shown in patient-derived p.Asp244Gly myotubes and fibres, in a p.Gly103Asp patient
    fibre and in knock-in mice.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rarely, DGI is complicated by perihepatitis associated with gonococcal
      PID, endocarditis, or meningitis.
    explanation: >-
      Lists meningitis among the rare complications of disseminated gonococcal

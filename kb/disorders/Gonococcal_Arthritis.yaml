histopathology:
- name: Leukocytoclastic dermal lesion
  description: >-
    Skin biopsy of a disseminated gonococcal lesion shows a subepidermal bulla
    with neutrophils, extravasated erythrocytes, fibrin deposition in vessel
    walls, and leukocytoclasia - the small-vessel injury of gonococcal
    dermatitis.
  evidence:
  - reference: PMID:28329470
    reference_title: "Cutaneous manifestations of disseminated gonococcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsy revealed bulla with neutrophils,extravasated erythrocytes, fibrin
      deposits in the vesselwalls, and leukocytoclasia.
    explanation: >-
      Describes the histopathology of the cutaneous lesion of disseminated
      gonococcemia.
diagnosis:
- name: Synovial fluid culture and PCR
  description: >-
    Synovial fluid shows an inflammatory, neutrophil-rich profile. Culture of
    synovial fluid has a low yield because N. gonorrhoeae grows poorly, whereas
    nucleic acid amplification (PCR) of synovial fluid is more sensitive and
    faster; both should be obtained.
  measurements:
  - preferred_term: synovial fluid leukocyte count and differential
  evidence:
  - reference: PMID:42644224
    reference_title: "Clinical and biological features of gonococcal arthritis: a 20-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      blood and synovial fluid cultures lack diagnostic yield compared to
      synovial fluid PCR, while synovial fluid culture also shows delayed
      positivity compared with the latter.
    explanation: >-
      Documents the low culture yield and superior synovial fluid PCR that
      define the diagnostic approach.
- name: Blood culture
  description: >-
    Blood cultures may be positive in the bacteremic arthritis-dermatitis
    syndrome but are frequently negative, especially in purulent arthritis.
  evidence:
  - reference: PMID:42644224
    reference_title: "Clinical and biological features of gonococcal arthritis: a 20-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas blood cultures had a low rate of positivity (29%)"
    explanation: >-
      Quantifies the low blood-culture yield in gonococcal arthritis.
- name: Mucosal site culture and NAAT
  description: >-
    Because DGI often arises from an asymptomatic mucosal focus, nucleic acid
    amplification tests or cultures should be collected from all exposed
    urogenital and extragenital (pharyngeal, rectal) sites in addition to the
    disseminated sites.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If DGI is suspected, NAATs or culture specimens from all exposed
      urogenital and extragenital sites should be collected and processed, in
      addition to disseminated sites of infection (e.g., skin, synovial fluid,
      blood, or CSF).
    explanation: >-
      Establishes the requirement to sample mucosal sites and disseminated
      sites, including by NAAT.
differential_diagnoses:
- name: Non-gonococcal septic arthritis
  description: >-
    Other bacterial septic arthritides are distinguished by a higher synovial
    leukocyte count and the identity of the organism; gonococcal joints tend to
    have a lower synovial leukocyte count than non-gonococcal septic arthritis.
  evidence:
  - reference: PMID:42644224
    reference_title: "Clinical and biological features of gonococcal arthritis: a 20-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the total number of leucocytes tends to be lower in gonococcal septic
      arthritis than in non-gonococcal septic arthritis
    explanation: >-
      Supports distinguishing gonococcal from non-gonococcal septic arthritis
      by synovial leukocyte count.
- name: Reactive arthritis
  description: >-
    Reactive arthritis is a sterile inflammatory response without direct
    bacterial invasion of the joint; distinguishing it from true gonococcal
    arthritis matters because pathophysiology and management differ, and
    requires identifying the organism.
  evidence:
  - reference: PMID:42644224
    reference_title: "Clinical and biological features of gonococcal arthritis: a 20-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reactive arthritis represents a sterile inflammatory response without
      direct bacterial invasion of the joint, making it essential to
      distinguish these two entities
    explanation: >-
      Names reactive arthritis as the key differential and the basis for
      distinguishing it.
treatments:
- name: Parenteral ceftriaxone (IM or IV)
  description: >-
    First-line therapy is ceftriaxone 1 g intramuscularly or intravenously
    every 24 hours. When treating the arthritis-dermatitis syndrome, the
    provider can switch to an oral agent guided by susceptibility testing 24-48
    hours after substantial clinical improvement, for a total course of more
    than 7 days.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Gonococcal Bacteremia
    description: >-
      Ceftriaxone is bactericidal against N. gonorrhoeae, clearing the
      organism from the bloodstream and joints.
    evidence:
    - reference: PMID:34292926
      reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Recommended Regimen for Gonococcal-Related Arthritis and
        Arthritis-Dermatitis Syndrome

        Ceftriaxone 1 g IM or IV every 24 hours
      explanation: >-
        Establishes ceftriaxone as the recommended first-line regimen for
        gonococcal arthritis.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When treating for the arthritis-dermatitis syndrome, the provider can
      switch to an oral agent guided by antimicrobial susceptibility testing
      24–48 hours after substantial clinical improvement, for a total
      treatment course of >7 days.
    explanation: >-
      Supports the oral step-down and the total course of more than 7 days.
- name: Alternative parenteral cephalosporin (cefotaxime or ceftizoxime)
  description: >-
    The CDC alternative regimens for gonococcal arthritis and the
    arthritis-dermatitis syndrome are cefotaxime 1 g IV every 8 hours or
    ceftizoxime 1 g every 8 hours, with the same oral step-down guided by
    susceptibility testing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cefotaxime
      term:
        id: CHEBI:204928
        label: cefotaxime
    - preferred_term: ceftizoxime
      term:
        id: CHEBI:553473
        label: ceftizoxime
  target_mechanisms:
  - target: Gonococcal Bacteremia
    description: >-
      Like ceftriaxone, these cephalosporins are bactericidal against N.
      gonorrhoeae, clearing the organism from blood and joints.
    evidence:
    - reference: PMID:34292926
      reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Cefotaxime 1 g IV every 8 hours

        or

        Ceftizoxime 1 g every 8 hours
      explanation: >-
        Lists cefotaxime and ceftizoxime as the alternative regimens for
        gonococcal arthritis.
- name: Doxycycline for presumptive chlamydial coinfection
  description: >-
    If chlamydial infection has not been excluded, providers should also treat
    for chlamydia with doxycycline 100 mg orally twice daily for 7 days.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If chlamydial infection has not been excluded, providers should treat for
      chlamydia with doxycycline 100 mg orally 2 times/day for 7 days.
    explanation: >-
      Establishes adjunctive doxycycline for presumptive chlamydial coinfection.
- name: Joint drainage and surgical debridement
  description: >-
    Purulent synovial effusions require drainage; arthrotomy or arthroscopic
    debridement is used when the joint does not respond to antibiotics or is
    inaccessible to aspiration.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: joint drainage / surgical debridement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Neutrophilic Purulent Joint Infection
    description: >-
      Drainage and debridement remove the purulent focus from the infected
      joint.
    evidence:
    - reference: PMID:39175952
      reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        patients underwent surgeries including the arthrotomy or the
        arthroscopic debridement of the infected joints because of no response
        to antibiotic treatments or due to inaccessible arthrocentesis.
      explanation: >-
        Documents surgical joint drainage/debridement for purulent gonococcal
        arthritis not responding to antibiotics.
environmental:
- name: Terminal complement inhibitor therapy (eculizumab)
  description: >-
    Eculizumab, a monoclonal antibody that blocks C5 and prevents membrane
    attack complex formation, is an iatrogenic phenocopy of terminal complement
    deficiency and markedly raises the risk of disseminated, often blood-culture
    positive, gonococcal infection. Patients on eculizumab should be counselled
    about this risk and screened for sexually transmitted infections; if
    antibiotic prophylaxis is used, gonococcal resistance trends should guide
    the choice.
  influences_mechanisms:
  - target: Terminal Complement Pathway Deficiency and MAC Failure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      C5 blockade removes the membrane attack complex, reproducing the host
      susceptibility of terminal complement deficiency.
    evidence:
    - reference: PMID:30418536
      reference_title: "Disseminated Gonococcal Infections in Patients Receiving Eculizumab: A Case Series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eculizumab, a monoclonal antibody, inhibits terminal complement
        activation, which impairs the ability of the immune system to respond
        effectively to Neisseria infections.
      explanation: >-
        States the mechanism by which eculizumab predisposes to disseminated
        Neisseria infection.
  evidence:
  - reference: PMID:30418536
    reference_title: "Disseminated Gonococcal Infections in Patients Receiving Eculizumab: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients receiving eculizumab may be at higher risk for DGI than the
      general population.
    explanation: >-
      Establishes eculizumab as a recognized DGI risk factor.
  - reference: PMID:30418536
    reference_title: "Disseminated Gonococcal Infections in Patients Receiving Eculizumab: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prescribers are encouraged to educate patients receiving eculizumab on
      their risk for serious gonococcal infections and perform screening for
      sexually transmitted diseases (STDs)
    explanation: >-
      Records the recommended counselling and STI screening for patients on
      eculizumab.
  - reference: PMID:30418536
    reference_title: "Disseminated Gonococcal Infections in Patients Receiving Eculizumab: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If antimicrobial prophylaxis is used during eculizumab therapy,
      prescribers should consider trends in gonococcal antimicrobial
      susceptibility due to emerging resistance concerns.
    explanation: >-
      Caveat that meningococcal-type antibiotic prophylaxis on eculizumab may
      not cover resistant gonococci.
- name: Female sex, menstruation, and pregnancy
  description: >-
    About two-thirds of DGI cases occur in women, and menstruation and
    pregnancy are recognized risk factors for dissemination.
  influences_mechanisms:
  - target: Gonococcal Bacteremia
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Female sex, menstruation, and pregnancy favour dissemination of the
      organism into the bloodstream; the hormonal and complement mechanisms are
      not fully resolved.
    evidence:
    - reference: PMID:39035573
      reference_title: "A Meta-analysis to Quantify the Risk of Disseminated Gonococcal Infection With Porin B Serotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        About two-thirds of DGI cases occur in women; menstruation is a risk
        factor and symptoms happen within 7 days of menses in half of affected
        women.
      explanation: >-
        Quantifies female predominance and menstruation as DGI risk factors.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Risk factors for dissemination have included female sex, menstruation,
      pregnancy, and terminal complement deficiency
    explanation: >-
      Lists female sex, menstruation, and pregnancy among the recognized risk
      factors for dissemination.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Gonococcal arthritis is rarely fatal with treatment, but residual joint
    impairment is frequent: around 60% of patients have persistent articular
    symptoms at discharge and only a minority achieve full recovery, with some
    requiring joint replacement. Rare complications include osteomyelitis,
    endocarditis, and meningitis.
  evidence:
  - reference: PMID:35590115
    reference_title: "Gonococcal arthritis: case series of 58 hospital cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GA is rare but it is important to make an early diagnosis and treat
      promptly, as joint destruction may be important, leading to persistent
      symptoms after discharge.
    explanation: >-
      Establishes the morbidity of gonococcal arthritis as persistent joint
      damage rather than mortality.
prevalence:
- population: Gonococcal infections (proportion progressing to disseminated disease)
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    This is a conditional fraction of infected people who develop
    dissemination, not a population prevalence.
    Disseminated gonococcal infection, of which arthritis is the dominant
    manifestation, develops in 0.5-3% of gonococcal infections; gonococcal
    arthritis accounts for 30-90% of disseminated cases.
  evidence:
  - reference: PMID:41391238
    reference_title: "Epidemiology of gonococcal arthritis in Brittany - France (EpGAr study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonococcal infections are sexually-transmitted infections (STIs), which
      in 0.5-3 % of cases, can progress to disseminated infections (DGI).
    explanation: >-
      Gives the 0.5-3% dissemination fraction of gonococcal infection.
- population: Indigenous population, Top End, Northern Territory, Australia, 2010-2018
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 27.1
  rate_denominator: PERSON_YEARS
  notes: >-
    Incidence of proven and probable disseminated gonococcal infection in the
    Indigenous population during a regional gonorrhea epidemic. This is DGI
    incidence, not gonococcal arthritis incidence, although 88.7% of the
    cohort presented with purulent arthritis.
  evidence:
  - reference: PMID:31392956
    reference_title: "Characteristics and Impact of Disseminated Gonococcal Infection in the \"Top End\" of Australia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of proven and probable DGI in the Indigenous population was
      27.1 per 100,000 person-years, compared with 7.1 in the Top End
      population overall.
    explanation: >-
      Gives an incidence estimate of DGI in a high-incidence Indigenous
      Australian population.
progression:
- phase: Mucosal infection
  description: >-
    Asymptomatic or symptomatic gonococcal infection of a urogenital,
    pharyngeal, or rectal mucosal surface precedes dissemination.
- phase: Bacteremic dissemination
  description: >-
    Serum-resistant organisms enter the bloodstream, producing the systemic
    arthritis-dermatitis syndrome of migratory polyarthralgia, tenosynovitis,
    and pustular skin lesions, usually acutely in a young sexually active adult.
- phase: Localized purulent arthritis
  description: >-
    The illness can localize to a purulent mono- or oligoarticular septic
    arthritis with a culture-positive joint; untreated or delayed disease
    causes permanent joint damage.

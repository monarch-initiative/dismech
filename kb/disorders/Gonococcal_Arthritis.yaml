      Persistent articular symptoms in 60% at discharge document the frequent
      residual joint damage.
- name: Osteomyelitis
  category: Phenotype
  description: >-
    Osteomyelitis of an infected joint is an uncommon complication.
  phenotype_term:
    preferred_term: Osteomyelitis
    term:
      id: HP:0002754
      label: Osteomyelitis
  evidence:
  - reference: PMID:39175952
    reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications occurred in 2 of the 41 (4.8%) patients; 1 patient had
      osteomyelitis of the wrist, and the other had osteomyelitis of the hip
      and pyomyositis.
    explanation: >-
      Documents osteomyelitis as a complication of gonococcal joint infection.
- name: Endocarditis
  category: Phenotype
  description: >-
    Gonococcal endocarditis is a rare but severe complication of dissemination.
  phenotype_term:
    preferred_term: Endocarditis
    term:
      id: HP:0100584
      label: Endocarditis
  evidence:

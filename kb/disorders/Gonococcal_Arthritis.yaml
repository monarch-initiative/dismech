    snippet: >-
      Rarely, DGI is complicated by perihepatitis associated with gonococcal
      PID, endocarditis, or meningitis.
    explanation: >-
      Lists endocarditis among the rare complications of disseminated gonococcal
      infection.
- name: Meningitis

name: Gonococcal Arthritis
creation_date: "2026-11-27T00:25:29Z"
category: Infectious Disease
description: >-
  Gonococcal arthritis is the articular manifestation of disseminated
  gonococcal infection (DGI), the bacteremic spread of Neisseria gonorrhoeae
  from a usually asymptomatic mucosal focus. It presents as one of two
  overlapping syndromes: an arthritis-dermatitis syndrome - the classic triad
  of migratory polyarthralgia, tenosynovitis, and pustular dermatitis, often
  with sterile synovial fluid - or a purulent mono- or oligoarticular septic
  arthritis with a positive synovial fluid. Dissemination is driven by
  serum-resistant gonococcal strains, historically the PorB1A (Por1A) porin
  serovar, which bind the host complement regulator factor H and evade
  complement killing, and is favoured by host terminal complement deficiency,
  C5-inhibitor (eculizumab) therapy, female sex, menstruation, and pregnancy.
  First-line treatment is intravenous or intramuscular ceftriaxone with
  joint drainage for purulent effusions; residual articular impairment is
  common despite therapy.
synonyms:
- gonococcal infection of joint
- gonococcal arthritis-dermatitis syndrome
- gonococcal septic arthritis
- gonococcal synovitis and tenosynovitis
disease_term:
  preferred_term: gonococcal infection of joint
  term:
    id: MONDO:0041903
    label: gonococcal infection of joint
parents:
- Bacterial Infection
notes: >-
  This entry is the articular arm of disseminated gonococcal infection,
  promoted out of the Gonorrhea entry's "Haematogenous Dissemination" node;
  a pointer subtype with curated_in points here from Gonorrhea. The sibling
  MONDO term gonococcal synovitis and tenosynovitis (MONDO:0001720), a child
  of gonococcal infection of joint, is folded in here rather than curated
  separately, because tenosynovitis is one arm of the DGI triad and MONDO
  classes synovitis directly under this joint concept; it is recorded in
  synonyms. Gonococcal bursitis (MONDO:0001719) is a distinct, very rare
  focal musculoskeletal manifestation in a different structure (the bursa,
  not a joint or tendon sheath) and is left as its own uncurated concept.
  Phenotype frequencies vary widely between series and between the two DGI
  syndromes; the figures asserted here are taken from a 20-year Thai DGI
  cohort (PMID:39175952, n=41) and cross-checked against other series, with
  the source figure quoted in each phenotype's evidence.
review_notes: >-
  Deliberately lumped. The arthritis-dermatitis (bacteremic, often
  culture-negative) syndrome and the localized purulent septic arthritis are
  kept together in one entry rather than split into separate subtypes: the
  literature treats them as two ends of one clinical spectrum of the same
  organism and host-pathogen interaction, individual patients move between
  them, management is the same antibiotic with drainage added for purulent
  joints, and no source distinguishes them taxonomically or by a MONDO term.
  Gonococcal synovitis and tenosynovitis (MONDO:0001720) is folded in for the
  same reason: it is the tendon-sheath/synovial arm of the identical process,
  and MONDO places it directly under this joint concept.
infectious_agent:
- name: Neisseria gonorrhoeae
  description: >-
    A Gram-negative, oxidase-positive diplococcus and obligate human pathogen
    with no environmental or animal reservoir. Disseminating strains are
    historically of the PorB1A (Por1A) porin serovar and resist killing by
    normal human serum.
  infectious_agent_term:
    preferred_term: Neisseria gonorrhoeae
    term:
      id: NCBITaxon:485
      label: Neisseria gonorrhoeae
  evidence:
  - reference: PMID:32214085
    reference_title: "Notes from the Field: Ongoing Cluster of Highly Related Disseminated Gonococcal Infections - Southwest Michigan, 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Disseminated gonococcal infection is a rare, systemic complication of
      untreated gonorrhea that occurs after sexual transmission and through
      hematogenous spread of Neisseria gonorrhoeae to distant body sites
    explanation: >-
      Identifies N. gonorrhoeae as the agent reaching distant sites by
      hematogenous spread, the process underlying gonococcal arthritis.
transmission:
- name: Sexual mucosal acquisition with hematogenous spread
  description: >-
    The organism is acquired by sexual mucosal contact at a urogenital,
    pharyngeal, or rectal site, which is frequently asymptomatic, and reaches
    the joints and skin by bloodstream dissemination rather than by direct
    inoculation of the joint.
  evidence:
  - reference: PMID:32214085
    reference_title: "Notes from the Field: Ongoing Cluster of Highly Related Disseminated Gonococcal Infections - Southwest Michigan, 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Disseminated gonococcal infection usually manifests as arthritis,
      dermatitis, and tenosynovitis.
    explanation: >-
      States the arthritis/dermatitis/tenosynovitis manifestations that
      follow hematogenous spread.

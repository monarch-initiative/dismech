pathophysiology:
- name: Mucosal Gonococcal Colonization
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Neisseria gonorrhoeae colonizes a urogenital, pharyngeal, or rectal mucosal
    surface, often without local symptoms, establishing the reservoir from
    which bloodstream invasion occurs. Many disseminating strains cause minimal
    genital inflammation, so DGI is frequently diagnosed without a recognized
    preceding genital infection.
  downstream:
  - target: Gonococcal Serum Resistance and Complement Evasion
    causal_link_type: DIRECT
    description: >-
      Mucosal organisms that are serum-resistant can survive if they reach the
      bloodstream.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Certain strains of N. gonorrhoeae that cause DGI can cause minimal
      genital inflammation, and urogenital or anorectal infections are often
      asymptomatic among DGI patients.
    explanation: >-
      Supports an often-asymptomatic mucosal focus as the origin of
      disseminated disease.
- name: Gonococcal Serum Resistance and Complement Evasion
  biological_scale: MOLECULAR
  role: immune_evasion
  description: >-
    Disseminating gonococci, historically of the Por1A (PorB1A) porin serovar,
    bind the host alternative-pathway complement regulator factor H at a
    surface-exposed region of the porin, markedly reducing complement
    deposition and membrane-attack-complex killing. This stable serum
    resistance, independent of lipooligosaccharide sialylation, is the
    precondition for survival in blood.
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  downstream:
  - target: Gonococcal Bacteremia
    causal_link_type: DIRECT
    description: >-
      Complement evasion allows the organism to survive and expand in the
      bloodstream.
  evidence:
  - reference: PMID:9705949
    reference_title: "Binding of complement factor H to loop 5 of porin protein 1A: a molecular mechanism of serum resistance of nonsialylated Neisseria gonorrhoeae."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we demonstrate that Por1A bearing gonococcal strains bind more
      factor H, a critical downregulator of the alternative complement pathway,
      than their Por1B counterparts.
    explanation: >-
      Demonstrates factor H binding by Por1A strains as the molecular basis of
      their serum resistance.
  - reference: PMID:39035573
    reference_title: "A Meta-analysis to Quantify the Risk of Disseminated Gonococcal Infection With Porin B Serotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This meta-analysis shows that the odds of PorB1A strains to disseminate
      is 20.53 compared to PorB1B isolates.
    explanation: >-
      Quantifies the association between the PorB1A serotype and dissemination
      across the human literature.
- name: Terminal Complement Pathway Deficiency and MAC Failure
  biological_scale: MOLECULAR
  role: host_susceptibility
  description: >-
    Congenital deficiency of a terminal complement component (C5-C9), or
    pharmacologic blockade of C5 by eculizumab, removes the membrane attack
    complex that is the principal bactericidal defence against Neisseria. A
    host lacking MAC can be disseminated even by strains that are not strongly
    serum-resistant, which is why terminal complement deficiency and C5
    inhibitors are recognized DGI risk factors. The genes bound here are
    the terminal components C5-C9 named by the cited source; properdin (CFP)
    deficiency, an alternative-pathway defect also linked to neisserial
    infection, is not bound because no cited source here names it for DGI.
  genes:
  - preferred_term: C5
    term:
      id: hgnc:1331
      label: C5
  - preferred_term: C6
    term:
      id: hgnc:1339
      label: C6
  - preferred_term: C7
    term:
      id: hgnc:1346
      label: C7
  - preferred_term: C8A
    term:
      id: hgnc:1352
      label: C8A
  - preferred_term: C8B
    term:
      id: hgnc:1353
      label: C8B
  - preferred_term: C8G
    term:
      id: hgnc:1354
      label: C8G
  - preferred_term: C9
    term:
      id: hgnc:1358
      label: C9
  downstream:
  - target: Gonococcal Bacteremia
    causal_link_type: DIRECT
    description: >-
      Loss of the membrane attack complex permits bloodstream survival and
      dissemination of the organism.
  evidence:
  - reference: PMID:39035573
    reference_title: "A Meta-analysis to Quantify the Risk of Disseminated Gonococcal Infection With Porin B Serotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Congenital deficiencies of complement, especially the terminal
      complement components (C5-C9) that are involved in the assembly of
      bactericidal membrane attack complex, predispose to DGI
    explanation: >-
      States that terminal complement component deficiency predisposes to
      disseminated infection through loss of the membrane attack complex.
- name: Gonococcal Bacteremia
  biological_scale: ORGANISM
  description: >-
    Serum-resistant organisms enter and persist in the bloodstream
    (gonococcemia), seeding distant sites and producing the systemic features
    of disseminated infection.
  downstream:
  - target: Synovial and Tenosynovial Seeding
    causal_link_type: DIRECT
    description: >-
      Circulating gonococci and their products localize to the synovium and
      tendon sheaths.
  - target: Dermal Microvascular Immune Injury
    causal_link_type: DIRECT
    description: >-
      Circulating gonococci seed dermal vessels, producing the skin lesions of
      the triad.
  - target: Fever
    causal_link_type: DIRECT
    description: Bacteremia produces the systemic febrile response.
  - target: Chills
    causal_link_type: DIRECT
    description: Bacteremia produces rigors and chills.
  - target: Increased total leukocyte count
    causal_link_type: DIRECT
    description: The systemic bacteremic response drives peripheral leukocytosis.
  - target: Elevated circulating C-reactive protein concentration
    causal_link_type: DIRECT
    description: The acute-phase response to bacteremia elevates C-reactive protein.
  - target: Endocarditis
    causal_link_type: DIRECT
    description: Hematogenous seeding of the endocardium produces rare endocarditis.
  - target: Meningitis
    causal_link_type: DIRECT
    description: Hematogenous seeding of the meninges produces rare meningitis.
  evidence:
  - reference: PMID:39175952
    reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      the pathogen can invade into the bloodstream and spread to the other
      organs causing disseminated gonococcal infection (DGI) with the classic
      triad of arthralgia or arthritis, tenosynovitis, and dermatitis
    explanation: >-
      Describes bloodstream invasion and spread to other organs producing the
      DGI triad.
- name: Synovial and Tenosynovial Seeding
  biological_scale: TISSUE
  description: >-
    Bloodborne gonococci localize to the synovium and tendon sheaths, producing
    migratory polyarthralgia and the tenosynovitis characteristic of the
    arthritis-dermatitis syndrome.
  locations:
  - preferred_term: synovial membrane
    term:
      id: UBERON:0002018
      label: synovial membrane of synovial joint
  - preferred_term: tendon sheath
    term:
      id: UBERON:0000304
      label: tendon sheath
  downstream:
  - target: Arthralgia
    causal_link_type: DIRECT
    description: Synovial seeding produces migratory polyarthralgia.
  - target: Tenosynovitis
    causal_link_type: DIRECT
    description: Tendon-sheath seeding produces tenosynovitis.
  - target: Neutrophilic Purulent Joint Infection
    causal_link_type: DIRECT
    description: >-
      Viable organisms proliferating in a joint establish a purulent
      intra-articular infection.
  evidence:
  - reference: PMID:39175952
    reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features were fever (90.27%), arthritis (92.7%),
      tenosynovitis (63.4%), and genitourinary symptoms (29.3%).
    explanation: >-
      Documents arthritis and tenosynovitis as the dominant articular features
      in a DGI cohort.
- name: Neutrophilic Purulent Joint Infection
  biological_scale: TISSUE
  description: >-
    When viable organisms seed and proliferate within a joint, a neutrophilic
    purulent septic arthritis develops, usually mono- or oligoarticular, with
    an inflammatory synovial fluid rich in neutrophils. Sustained
    intra-articular infection can cause cartilage and joint destruction.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  downstream:
  - target: Arthritis
    causal_link_type: DIRECT
    description: Intra-articular infection produces arthritis.
  - target: Septic arthritis
    causal_link_type: DIRECT
    description: Purulent joint infection is a septic arthritis.
  - target: Progressive joint destruction
    causal_link_type: DIRECT
    description: >-
      Sustained or delayed-treated purulent arthritis causes permanent joint
      damage.
  - target: Osteomyelitis
    causal_link_type: DIRECT
    description: >-
      Contiguous spread from an infected joint produces osteomyelitis of the
      adjacent bone.
  evidence:
  - reference: PMID:42644224
    reference_title: "Clinical and biological features of gonococcal arthritis: a 20-year retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      synovial fluid analysis revealed an inflammatory profile, with a mean
      white blood cell count of 27,000 cells/mm³ (±14,000), a mean of 89%
      (±2.2) neutrophils
    explanation: >-
      Documents the neutrophil-rich inflammatory synovial fluid of gonococcal
      joint infection.
- name: Dermal Microvascular Immune Injury
  biological_scale: TISSUE
  description: >-
    Seeding of dermal vessels by gonococci, with local complement activation
    and small-vessel injury, produces the sparse pustular, vesiculopustular,
    hemorrhagic, or petechial acral skin lesions of the arthritis-dermatitis
    syndrome. Skin biopsy shows neutrophils, extravasated erythrocytes, and
    fibrin in vessel walls.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Skin rash
    causal_link_type: DIRECT
    description: Dermal seeding produces the dermatitis of the triad.
  - target: Pustule
    causal_link_type: DIRECT
    description: The characteristic lesions are pustular or vesiculopustular.
  - target: Petechiae
    causal_link_type: DIRECT
    description: Small-vessel injury produces petechial and hemorrhagic lesions.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Disseminated gonococcal infection (DGI) frequently results in petechial
      or pustular acral skin lesions, asymmetric polyarthralgia, tenosynovitis,
      or oligoarticular septic arthritis
    explanation: >-
      Describes the petechial/pustular acral skin lesions produced by dermal
      seeding.
phenotypes:
- name: Arthralgia
  category: Phenotype
  description: >-
    Migratory polyarthralgia is the most common and usually the earliest
    articular symptom of disseminated gonococcal infection.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Polyarthralgia (often migratory)
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:39175952
    reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      subjective fever, chills, joint pain, rash, and genitourinary symptoms
      (dysuria or discharge) were reported in 90.2%, 34.1%, 100%, 26.8%, and
      29.3% of the patients, respectively
    explanation: >-
      Joint pain was reported in 100% of the DGI cohort, supporting a
      very-frequent band for arthralgia.
- name: Arthritis
  category: Phenotype
  description: >-
    Arthritis, often oligoarticular and most commonly involving the wrists,
    ankles, and knees, is the defining articular manifestation.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Arthritis
    term:
      id: HP:0001369
      label: Arthritis
  evidence:
  - reference: PMID:39175952
    reference_title: "Disseminated gonococcal infection during two decades in the university hospital, Thailand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features were fever (90.27%), arthritis (92.7%),
      tenosynovitis (63.4%), and genitourinary symptoms (29.3%).
    explanation: >-
      Arthritis occurred in 92.7% of the cohort, supporting a very-frequent
      band.
- name: Septic arthritis
  category: Phenotype
  description: >-
    The purulent form of gonococcal arthritis is a true septic arthritis with a

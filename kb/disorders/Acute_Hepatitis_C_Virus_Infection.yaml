      quantifiable RNA), HCV treatment should be initiated without awaiting
      spontaneous resolution.
    explanation: The published AASLD-IDSA guidance directly supports the test-and-treat timing recommendation.
  notes: >-
    This entry captures treatment timing rather than a specific drug regimen.
    Regimen choice, contraindications, interactions, and jurisdiction-specific
    availability require consultation of current guidance.

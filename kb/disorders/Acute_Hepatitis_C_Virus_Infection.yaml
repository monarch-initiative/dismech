diagnosis:
- name: Combined HCV RNA and anti-HCV testing with evidence of recent acquisition
  description: >-
    Acute infection is best supported by HCV RNA during the antibody-negative
    window, documented anti-HCV seroconversion, de novo RNA detection, or RNA
    loss during untreated recovery. RNA or antibody at one time point cannot by
    itself reliably distinguish acute from chronic infection.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: >-
    Current HCV RNA plus a documented recent negative result, seroconversion, or
    compatible longitudinal course supports acute HCV.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, reliable diagnosis of acute hepatitis C usually requires testing at
      two time points demonstrating seroconversion to anti-HCV reactivity, de
      novo development of HCV RNA, or loss of HCV RNA during recovery.
    explanation: This directly supports longitudinal antibody/RNA evidence for recent infection.
- name: Serial HCV RNA assessment
  description: >-
    Repeat HCV RNA assessment is important when timing is uncertain because
    untreated viremia may fluctuate and a transient decline does not establish
    spontaneous clearance.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: >-
    Persistent, recurrent, or cleared RNA across serial measurements resolves
    uncertainty that remains after a single result.
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter group included a significant proportion of 'fluctuating'
      progressors (37.5%), in whom a fall followed by a rise (>1 log₁₀) in
      viraemia was observed.
    explanation: This directly supports serial rather than single-point interpretation of viremia, with the cohort context stated in progression.
- name: Combined HCV antibody and antigen immunoassay
  description: >-
    A fourth-generation antibody/antigen assay can shorten the diagnostic window
    but does not eliminate the need for nucleic-acid testing.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: MAXO:0000609
      label: serology testing
  results: Antibody/antigen reactivity is an early-detection adjunct and should be interpreted with HCV RNA testing.
  evidence:
  - reference: PMID:39283072
    reference_title: Comparison of a dual antibody and antigen HCV immunoassay to standard of care algorithmic testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourth generation HCV Duo Ab/Ag assay demonstrated comparable performance
      to SOC testing and shortens the diagnostic window but does not eliminate
      the need for NAAT in all patients.
    explanation: This diagnostic study directly supports the stated adjunctive role and limitation.
differential_diagnoses:
- name: Drug-induced liver injury
  disease_term:
    preferred_term: drug-induced liver injury
    term:
      id: MONDO:0005359
      label: drug-induced liver injury
  description: >-
    Drug-induced liver injury can closely mimic the hepatocellular presentation
    of acute HCV. Medication and supplement exposure, dechallenge, and formal
    causality assessment are interpreted alongside both anti-HCV and HCV RNA.
  distinguishing_features:
  - A compatible drug or supplement exposure and improvement after withdrawal favor drug-induced injury.
  - HCV RNA during an antibody-negative window or longitudinal seroconversion favors acute HCV.
  evidence:

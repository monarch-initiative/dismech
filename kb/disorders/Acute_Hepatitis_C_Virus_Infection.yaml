  role: therapeutic_vulnerability
  description: >-
    HCV NS3/4A is a virus-encoded serine protease complex that cleaves four
    defined junctions in the nonstructural region of the HCV polyprotein. This
    processing is essential for viral replication and produces active viral
    proteins, including NS3/4A itself. The active protease can also cleave host
    innate-sensing adaptors, a distinct downstream immune-evasion effect.

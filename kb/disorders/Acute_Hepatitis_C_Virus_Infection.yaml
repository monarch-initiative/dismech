prevalence:
- population: Global (all ages)
  notes: >-
    The Global Burden of Disease 2019 study estimated 6.2 million new (incident,
    i.e. acute) HCV infections worldwide in 2019, a 25.4% increase from 1990
    driven largely by population growth and aging.
  evidence:
  - reference: PMID:36935711
    reference_title: "The burden of hepatitis C virus in the world, China, India, and the United States from 1990 to 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was estimated that 6.2 million new HCV infections, 0.54 million
      HCV-related deaths, and 15.3 million DALYs worldwide in 2019, with an
      increase of 25.4, 59.1, and 43.6%, respectively, from 1990
    explanation: >-
      GBD 2019 burden estimate quantifying the global annual incidence of new
      (acute) HCV infections.
- population: Women of reproductive age (15-49 years)
  notes: >-
    GBD analysis restricted to reproductive-age women found that the global
    incidence of acute hepatitis C rose by 46.45% over 1990-2019, with the
    highest age-standardized incidence rates in low sociodemographic index regions.
  evidence:
  - reference: PMID:38638097
    reference_title: "Epidemiology of acute hepatitis C and hepatitis C virus-related cirrhosis in reproductive-age women, 1990-2019: An analysis of the Global Burden of Disease study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the 30 years, global incidences of AHC and HCV-related cirrhosis in
      reproductive-age women increased by 46.45 and 72.74%, respectively.
    explanation: >-
      GBD-based estimate of acute hepatitis C (AHC) incidence trends in the
      reproductive-age female population.

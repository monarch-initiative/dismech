- accession: geo:GSE65123
  title: Gene expression analysis during acute hepatitis C virus infection associates dendritic cell activation with viral clearance
  description: 'Background and Aims: Viral clearance during acute hepatitis C virus (HCV) infection is associated with the induction of potent antiviral T-cell responses. Since dendritic cells (DC) are essential in the activation of primary T-cell responses our goal was to analyze gene expression in DC from patients during acute HCV infection. Methods: By using microarrays, gene expression was compared in resting and activated peripheral blood plasmacytoid (pDC) and myeloid (mDC) DC from acute HCV resolving patients (AR) and from those who become chronically infected (ANR), as well as in HCV chronically infected patients (CHR) and healthy seronegative individuals (CTRL).'

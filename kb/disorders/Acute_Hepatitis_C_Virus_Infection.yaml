name: Acute Hepatitis C Virus Infection
creation_date: '2026-05-04T19:32:38Z'
description: >-
  Acute hepatitis C virus infection is the early phase after acquisition of
  hepatitis C virus (HCV), before either spontaneous viral clearance or
  persistent infection is established. The course is often clinically silent;
  symptomatic hepatitis can include jaundice, nausea, fatigue, anorexia, and
  elevated hepatic transaminases. Diagnosis requires both evidence of current
  infection and evidence that acquisition was recent because anti-HCV and HCV
  RNA results considered at a single time point do not reliably separate acute
  from chronic infection. Early direct-acting antiviral therapy can eradicate
  viremia and prevent chronic infection.
category: Infectious Disease
synonyms:

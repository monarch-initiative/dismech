      explanation: This directly supports the human association, while the edge description avoids asserting that association alone proves sufficiency.
  - target: Immune-associated hepatocellular injury
    description: Activated immune-cell populations track with biochemical hepatitis, but their causal contribution to hepatocyte killing remains unresolved.
    hypothesis_groups:

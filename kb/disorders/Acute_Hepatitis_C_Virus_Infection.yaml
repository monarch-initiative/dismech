    reference_title: "Hepatitis C Virus Entry: Protein Interactions and Fusion Determinants Governing Productive Hepatocyte Invasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The virus initially attaches to surface proteoglycans, lipid receptors
      such as the scavenger receptor BI (SR-BI), and to the tetraspanin CD81.
      After lateral translocation of virions to tight junctions, claudin-1
      (CLDN1) and occludin (OCLN) are essential for entry.
    explanation: This review directly supports the host-factor sequence in the entry node.

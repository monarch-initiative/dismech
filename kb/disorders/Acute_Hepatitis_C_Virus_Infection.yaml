discussions:
- discussion_id: human_validation_of_tfh1_helper_axis
  prompt: >-
    Does the liver-enriched PD-1-high ICOS-high Tfh1-like CD4 response observed
    in HCV-infected chimpanzees mark or mechanistically assist viral control in
    humans with acute HCV?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#HCV-specific adaptive immune response
  - pathophysiology#Spontaneous viral clearance
  rationale: >-
    The chimpanzee study temporally links the population to viral control,
    seroconversion, and hepatitis and shows enrichment in liver, but the source
    does not establish the same population or a causal helper function in
    humans. Human longitudinal sampling with matched blood and liver-proximal
    material is needed before promoting this refinement to the canonical model.
  evidence:
  - reference: PMID:40956619
    reference_title: "A liver-infiltrating CD4+ Tfh1 cell response predicts HCV control, hepatitis, and seroconversion during acute infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HCV-specific PD-1hiICOShi CD4+ Tfh1-like cells were enriched in liver,
      suggesting the potential for B and CD8+ T cell help at the site of virus
      replication.
    explanation: This is the model-organism observation whose human generalizability remains open.
- discussion_id: cell_specific_cause_of_acute_hcv_liver_injury
  prompt: >-
    Which immune-cell populations directly cause hepatocyte injury during acute
    HCV, and which are biomarkers or bystanders of the same inflammatory state?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Immune-associated hepatocellular injury
  - phenotypes#Elevated hepatic transaminases
  rationale: >-
    Human iNKT activation correlates with ALT, but the study explicitly cannot
    determine whether iNKT cells kill hepatocytes or respond to injury-related
    drivers. The pathograph therefore retains UNKNOWN causal directness rather
    than encoding a specific effector population as established.
  evidence:
  - reference: PMID:34905514
    reference_title: Peripheral blood iNKT cell activation correlates with liver damage during acute hepatitis C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the correlative nature of our study, we cannot distinguish whether
      iNKT cell activation contributes to hepatocyte killing or whether ALT
      elevation
    explanation: The authors directly identify the unresolved causal direction captured by this discussion.
- discussion_id: generalizable_predictors_of_spontaneous_clearance
  prompt: >-
    Which early virologic and immune measurements robustly predict spontaneous
    clearance across populations, coinfection states, and HCV genotypes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HCV-specific adaptive immune response
  - pathophysiology#Spontaneous viral clearance
  - progression#Spontaneous viral clearance
  rationale: >-
    Rapid viral-load decline and strong T-cell responses predicted clearance in
    an HIV-positive male cohort, while clearance proportions vary across
    cohorts. External validation is needed before these associations can be
    treated as universal decision rules.
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous clearance of acute HCV in HIV-positive men can be predicted by
      a rapid decline in viral load, high CD4 count, elevated bilirubin and ALT,
      and is associated with low viral diversity and strong T cell responses.
    explanation: This directly supports candidate predictors while the cohort restriction motivates the generalizability gap.
datasets:
- accession: geo:GSE119117
  title: Longitudinal transcriptomic characterization of the immune response to acute hepatitis C virus infection
  description: Most individuals exposed to hepatitis C virus (HCV) become persistently infected while a minority spontaneously eliminate the virus. Although early immune events influence infection outcome, the cellular composition, molecular effectors, and timeframe of the host response active shortly after viral exposure remain incompletely understood. Employing specimens collected from people who inject drugs (PWID) with high risk of HCV exposure, we utilized RNA-Seq to characterize immune function in peripheral blood before, during, and after acute HCV infection resulting in spontaneous resolution.

- accession: geo:GSE267834
  title: Hepatitis C Virus-induced Differential Transcriptional Traits in Host Cells After Persistent Infection Elimination by Direct-Acting Antivirals In Cell Culture
  description: Chronic hepatitis C virus infection (HCV) causes liver inflammation and fibrosis, leading to development of severe liver disease, such as cirrhosis or hepatocellular carcinoma (HCC). Approval of direct acting antiviral (DAA) drug combinations has revolutionized chronic HCV therapy, with virus eradication in >98% of the treated patients. The efficacy of these treatments is such that it is formally possible for cured patients to carry formerly infected cells that display irreversible transcriptional alterations directly caused by chronic HCV Infection.  # codespell:ignore-line

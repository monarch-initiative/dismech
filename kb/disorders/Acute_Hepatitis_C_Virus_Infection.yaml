    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that patients presenting with acute
      hepatocellular injury, even with features suggestive of DILI, should be
      tested for both anti-HCV and HCV RNA to reliably exclude acute HCV
      infection.
    explanation: This prospective DILI-network analysis directly supports distinguishing acute HCV from DILI using both tests.
- name: Other viral, autoimmune, and biliary causes of acute hepatocellular injury
  description: >-
    Hepatitis A, B, and E, autoimmune hepatitis, and biliary disease can produce
    an overlapping acute-hepatitis presentation and require cause-specific
    testing when HCV timing is uncertain.
  distinguishing_features:
  - Cause-specific viral testing distinguishes hepatitis A, B, or E.
  - Autoimmune evaluation and biliary imaging are guided by the presentation.
  - Longitudinal anti-HCV and HCV RNA results establish or weaken recent-HCV timing.
  evidence:

transmission:
- name: Parenteral and blood-borne acquisition
  description: >-
    Acute HCV is acquired through blood exposure. Important observed contexts
    include injection drug use and unsafe medical procedures.
  evidence:
  - reference: PMID:36800699
    reference_title: "Acute hepatitis C virus infection: clinical update and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People who have received unsafe medical procedures, used injection drugs,
      and lived with human immunodeficiency virus are reported to be most
      susceptible to acute HCV infection.
    explanation: This review identifies major human exposure contexts for acute HCV acquisition.
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The source of infection was mainly injection drug use in 17/30 (56.7) and
      medical procedures 6/30 (20%).
    explanation: This acute-HCV cohort documents injection drug use and medical procedures as observed acquisition sources.
environmental:
- name: Blood-exposure risk contexts
  description: >-
    Injection drug use and unsafe medical procedures increase the opportunity
    for blood-borne HCV acquisition; HIV coinfection identifies an important
    clinical risk context but is not itself a transmission route.
  evidence:
  - reference: PMID:36800699
    reference_title: "Acute hepatitis C virus infection: clinical update and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People who have received unsafe medical procedures, used injection drugs,
      and lived with human immunodeficiency virus are reported to be most
      susceptible to acute HCV infection.
    explanation: The source directly identifies these risk contexts while allowing HIV status to be distinguished from a route of transmission.
prevalence:
- population: Global (all ages)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    The Global Burden of Disease 2019 analysis estimated 6.2 million new HCV
    infections worldwide in 2019. This is an incidence estimate for newly
    acquired infection, not the prevalence of symptomatic acute hepatitis.
  evidence:
  - reference: PMID:36935711
    reference_title: "The burden of hepatitis C virus in the world, China, India, and the United States from 1990 to 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was estimated that 6.2 million new HCV infections, 0.54 million
      HCV-related deaths, and 15.3 million DALYs worldwide in 2019, with an
      increase of 25.4, 59.1, and 43.6%, respectively, from 1990
    explanation: This GBD analysis quantifies global incident HCV infection in 2019.
- population: Global women of reproductive age (15-49 years)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    In a GBD analysis restricted to reproductive-age women, global acute-HCV
    incidence increased by 46.45% from 1990 through 2019; this is a trend rather
    than an individual-level risk estimate.
  evidence:
  - reference: PMID:38638097
    reference_title: "Epidemiology of acute hepatitis C and hepatitis C virus-related cirrhosis in reproductive-age women, 1990-2019: An analysis of the Global Burden of Disease study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the 30 years, global incidences of AHC and HCV-related cirrhosis in
      reproductive-age women increased by 46.45 and 72.74%, respectively.
    explanation: This directly supports the acute-HCV incidence trend in the specified population.
progression:
- phase: Recent acquisition and early viremia
  duration: Up to six months before persistent infection is classified as chronic
  notes: >-
    Acute infection begins with recent HCV acquisition and detectable viremia.
    The six-month boundary is a clinical definition of chronicity rather than a
    claim that every untreated infection remains biologically unchanged until
    that time.
  evidence:
  - reference: PMID:39599853
    reference_title: "Acute Hepatitis C: Current Status and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 50-70% of individuals with recently acquired hepatitis C
      will develop a chronic infection, defined as the persistence of viremia
      for a period exceeding six months.
    explanation: This defines the recent-infection phase and the six-month chronicity boundary.
- phase: Clinically silent or symptomatic acute presentation
  notes: >-
    Many infections are not diagnosed during the acute phase because the course
    is predominantly asymptomatic. A minority present with clinically apparent
    hepatitis.
  evidence:
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Acute hepatitis C is rarely diagnosed due to its predominantly asymptomatic course.
    explanation: This directly supports clinically silent presentation as a major feature of the acute phase.
- phase: Spontaneous viral clearance
  notes: >-
    Clearance can occur without antiviral treatment. The observed proportion
    varies by cohort; one tertiary-center series reported clearance in 9 of 30
    patients and should not be treated as a universal population frequency.
  evidence:
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Totally, 9 patients (30%) experienced spontaneous viral eradication.
    explanation: This cohort directly documents untreated spontaneous clearance while the note limits generalization of its frequency.
- phase: Fluctuating viremia during unresolved infection
  notes: >-
    Serial viral loads can fall and then rise. The quantified 37.5% fluctuation
    estimate came from an HIV-1-positive male cohort and is retained only as
    evidence that a single decline does not establish clearance.
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter group included a significant proportion of 'fluctuating'
      progressors (37.5%), in whom a fall followed by a rise (>1 log₁₀) in
      viraemia was observed.
    explanation: This cohort directly demonstrates fluctuating viremia among patients who progressed.
- phase: Chronic HCV infection
  duration: More than six months of persistent viremia
  notes: >-
    Failure to clear HCV leads to persistent viremia and classification as
    chronic hepatitis C.
  evidence:
  - reference: PMID:39599853
    reference_title: "Acute Hepatitis C: Current Status and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 50-70% of individuals with recently acquired hepatitis C
      will develop a chronic infection, defined as the persistence of viremia
      for a period exceeding six months.
    explanation: This directly supports both the outcome frequency range and definition of chronicity.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_acute_hcv_clearance_persistence_model
  hypothesis_label: Host-virus response balance determines clearance or persistence
  status: CANONICAL
  description: >-
    Productive hepatocyte infection generates viremia and innate antiviral
    activation while HCV simultaneously suppresses interferon induction.
    Adaptive immune responses can accompany clearance, but ongoing immune
    responses and viral escape can coexist with persistence. Hepatocellular
    injury is immune-associated, although the contribution of individual cell
    populations is not fully resolved.
  evidence:
  - reference: PMID:25443342
    reference_title: Innate and adaptive immune responses in HCV infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Elimination of HCV during acute infection correlates with a rapid
      induction of innate, especially interferon (IFN) induced genes, and a
      delayed induction of adaptive immune responses.
    explanation: This review supports the canonical coordination of innate and adaptive responses in acute-HCV outcome.
- hypothesis_group_id: intrahepatic_tfh1_helper_refinement
  hypothesis_label: Intrahepatic Tfh1-like CD4 response as a helper axis for HCV control
  status: EMERGING
  description: >-
    A recent chimpanzee study proposes that liver-enriched HCV-specific
    PD-1-high ICOS-high Tfh1-like CD4 cells help B-cell and CD8-cell responses
    at the site of replication. This refines the general adaptive-response node
    but is not asserted as a confirmed human mechanism.
  evidence:
  - reference: PMID:40956619
    reference_title: "A liver-infiltrating CD4+ Tfh1 cell response predicts HCV control, hepatitis, and seroconversion during acute infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HCV-specific PD-1hiICOShi CD4+ Tfh1-like cells were enriched in liver,
      suggesting the potential for B and CD8+ T cell help at the site of virus
      replication.
    explanation: The chimpanzee study directly supports the proposed helper-cell refinement while not establishing it in humans.
pathophysiology:
- name: HCV attachment and hepatocyte entry
  description: >-
    HCV first attaches to cell-surface proteoglycans, SR-BI, and CD81, then uses
    the tight-junction proteins claudin-1 and occludin and clathrin-mediated
    endocytosis to enter human liver cells.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:31427285
    reference_title: "Hepatitis C Virus Entry: Protein Interactions and Fusion Determinants Governing Productive Hepatocyte Invasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The virus initially attaches to surface proteoglycans, lipid receptors
      such as the scavenger receptor BI (SR-BI), and to the tetraspanin CD81.
      After lateral translocation of virions to tight junctions, claudin-1
      (CLDN1) and occludin (OCLN) are essential for entry.
    explanation: This review directly supports the host-factor sequence in the entry node.
  downstream:
  - target: HCV genome replication and early viremia
    description: Productive hepatocyte entry permits intracellular infection followed by detectable circulating HCV RNA.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Endosomal fusion and release of the positive-sense viral RNA genome
    - Translation and membrane-associated genome replication
    evidence:
    - reference: PMID:31427285
      reference_title: "Hepatitis C Virus Entry: Protein Interactions and Fusion Determinants Governing Productive Hepatocyte Invasion."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Numerous host factors including proteins, lipids, and glycans promote
        productive uptake of HCV particles into human liver cells.
      explanation: Productive uptake supports the entry side of this edge; downstream viremia is independently evidenced at the target node.
- name: HCV genome replication and early viremia
  description: >-
    Productive acute infection is marked by circulating HCV RNA. In one
    tertiary-center cohort, RNA was detectable at presentation in 26 of 30
    patients; this cohort proportion is not assigned as a universal frequency.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HCV-ribonucleic acid (RNA) was detectable at presentation in 26 (86.7%) patients.
    explanation: This acute-HCV cohort directly documents early detectable viremia.
  downstream:
  - target: Interferon-driven innate and NK-cell activation
    description: Acute HCV infection is accompanied by a transient type-I-interferon-imprinted activated NK-cell population.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Viral RNA sensing and type I interferon induction
    evidence:
    - reference: PMID:41453396
      reference_title: Transient Interferon-Driven Natural Killer Cell Activation in Acute Hepatitis C.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At the transcriptomic level, we identified a subset of highly activated
        NK cells with a robust type I interferon imprint.
      explanation: Longitudinal human data directly support interferon-imprinted NK-cell activation during acute HCV.
  - target: NS3/4A-mediated innate immune evasion
    description: Viral NS3/4A protease activity in infected cells cleaves host innate-sensing adaptors and reduces interferon induction.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Translation and processing of the HCV polyprotein to active NS3/4A protease
    evidence:
    - reference: PMID:25443342
      reference_title: Innate and adaptive immune responses in HCV infections.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the HCV NS3/4A protease can efficiently cleave and inactivate two
        important signalling molecules in the sensory pathways that react to
        HCV pathogen-associated molecular patterns (PAMPs) to induce IFNs,
        i.e., the mitochondrial anti-viral signalling protein (MAVS) and the
        Toll-IL-1 receptor-domain-containing adaptor-inducing IFN-β (TRIF).
      explanation: This directly supports the viral-protease-to-innate-evasion mechanism.
  - target: Immune-associated hepatocellular injury
    description: >-
      Acute HCV viremia is associated with inflammatory immune activation and
      hepatocellular injury, but the exact direction and cell-specific causal
      contribution remain unresolved.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:34905514
      reference_title: Peripheral blood iNKT cell activation correlates with liver damage during acute hepatitis C.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Given the correlative nature of our study, we cannot distinguish whether
        iNKT cell activation contributes to hepatocyte killing or whether ALT
        elevation
      explanation: Human data support immune activation accompanying injury while explicitly requiring UNKNOWN causal directness.
- name: Interferon-driven innate and NK-cell activation
  description: >-
    During acute HCV, a highly activated NK-cell subset shows a strong type I
    interferon imprint and largely returns toward baseline after viral
    clearance.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell activation
    modifier: INCREASED
    term:
      id: GO:0030101
      label: natural killer cell activation
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:41453396
    reference_title: Transient Interferon-Driven Natural Killer Cell Activation in Acute Hepatitis C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, these data suggest an interferon-driven rise of an activated
      NK cell population during acute hepatitis C that is largely restored upon
      viral clearance.
    explanation: This directly supports the human innate-activation node and its resolution after clearance.
  downstream:
  - target: HCV-specific adaptive immune response
    description: >-
      Early interferon-associated innate activation precedes the later adaptive
      response associated with control or persistence, but the cited temporal
      pattern does not establish that NK-cell activation causes the adaptive
      response.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:25443342
      reference_title: Innate and adaptive immune responses in HCV infections.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Elimination of HCV during acute infection correlates with a rapid
        induction of innate, especially interferon (IFN) induced genes, and a
        delayed induction of adaptive immune responses.
      explanation: The review supports temporal ordering of the responses but does not establish a causal NK-cell-to-adaptive-response link.
- name: NS3/4A-mediated innate immune evasion
  description: >-
    HCV NS3/4A protease cleaves and inactivates MAVS and TRIF, blunting
    pathogen-sensing pathways that induce interferons. Viral escape mutations
    can additionally reduce antibody and T-cell recognition.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  genes:
  - preferred_term: MAVS
    term:
      id: hgnc:29233
      label: MAVS
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0039502
      label: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:25443342
    reference_title: Innate and adaptive immune responses in HCV infections.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the HCV NS3/4A protease can efficiently cleave and inactivate two
      important signalling molecules in the sensory pathways that react to HCV
      pathogen-associated molecular patterns (PAMPs) to induce IFNs, i.e., the
      mitochondrial anti-viral signalling protein (MAVS) and the Toll-IL-1
      receptor-domain-containing adaptor-inducing IFN-β (TRIF).
    explanation: This review directly supports the stated NS3/4A mechanism.
  - reference: PMID:25443342
    reference_title: Innate and adaptive immune responses in HCV infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Escape from adaptive immune responses can be achieved by emergence of
      viral escape mutations that avoid recognition by antibodies and T cells.
    explanation: This directly supports adaptive immune escape as an additional persistence mechanism.
  downstream:
  - target: Persistent HCV viremia
    description: >-
      Suppressed interferon induction and escape from immune recognition are
      proposed contributors to failure of viral clearance, but their specific
      causal contribution to persistence is not isolated by the cited review.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:25443342
      reference_title: Innate and adaptive immune responses in HCV infections.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        However, the majority of patients is unable to clear the virus and
        develops viral persistence in face of an ongoing innate and adaptive
        immune response.
      explanation: This supports persistence despite ongoing antiviral immunity but only partially supports attribution to the modeled evasion mechanisms.
- name: HCV-specific adaptive immune response
  description: >-
    Virus-specific T-cell responses emerge after the early innate response.
    Strong multispecific responses are associated with spontaneous clearance,
    whereas the recent liver-enriched Tfh1-like helper-cell refinement is based
    on chimpanzee data and remains unconfirmed in humans.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evolution to spontaneous clearance occurred in patients with low viral
      diversity in the presence of an early multispecific T cell response.
    explanation: This human cohort supports an association between early multispecific T-cell responses and clearance.
  - reference: PMID:40956619
    reference_title: "A liver-infiltrating CD4+ Tfh1 cell response predicts HCV control, hepatitis, and seroconversion during acute infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      circulating CD4+ T cells with high programmed cell death 1 (PD-1) and ICOS
      coexpression were temporally associated with onset of virus control,
      seroconversion, and hepatitis in HCV-infected chimpanzees.
    explanation: This supports the emerging Tfh1-like refinement in the chimpanzee model, not direct human confirmation.
  downstream:
  - target: Spontaneous viral clearance
    description: >-
      Early multispecific T-cell responses and low viral diversity are
      associated with untreated clearance, without establishing that the
      measured response is independently causal.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Three children in two families, in a single 2020 report, and no further patient in the
    literature to 2026. No population estimate exists and none could be made from an
    ascertainment that ran through a diagnostic exome in one family, a targeted
    complex I gene panel prompted by a muscle biopsy in the other, and GeneMatcher to
    connect them. ClinGen's 2023 curation, three years after the report, still describes it
    as the first and only report of the gene in mitochondrial disease. The prevalence_class
    is the numeric floor tier; no rate_per_100000 is given because none has been reported.

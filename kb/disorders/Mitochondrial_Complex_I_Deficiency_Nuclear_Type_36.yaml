      Definitive and is a fair reflection of a two-family series with strong functional data.
diagnosis:
- name: Complex I enzymology and nuclear gene sequencing, with GeneMatcher
  description: >-
    The two families reached the same diagnosis by different routes, and the contrast is
    instructive. In the Saudi family a commercial exome was done first and prioritised known
    disease genes, so the answer came only from whole genome sequencing. In the Moroccan
    family an isolated complex I defect on muscle biopsy came first and prompted a targeted
    panel of nuclear complex I genes. Neither family could have been solved alone: NDUFC2 was
    not a known disease gene, and the two were connected through GeneMatcher, which is what
    made a single unexplained variant into a gene-disease relationship. The authors note that
    NDUFC2 can now be screened as a candidate in genetically undiagnosed Leigh syndrome.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These two unrelated families were linked with the aid of GeneMatcher"
    explanation: >-
      The step without which neither family would have been solved, and the reason a
      single-family candidate gene is not a diagnosis.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition, NDUFC2 may now be screened as a candidate gene in genetically undiagnosed cases of Leigh syndrome"
    explanation: The diagnostic recommendation the paper makes for future cases.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmation of these variants as causative enables prenatal testing of a subsequent pregnancies in these families"
    explanation: >-
      What the molecular diagnosis changes for these families in practice, which is the
      concrete clinical value of the result.
experimental_models:
- name: Lentiviral NDUFC2 complementation of patient fibroblasts
  experimental_model_type: OTHER
  description: >-
    Fibroblasts from both index patients were transduced with wild-type NDUFC2 under a
    doxycycline-inducible lentiviral vector. Induction raised NDUFC2 itself and the complex
    I subunits NDUFB8, NDUFA9 and NDUFV1, and increased the amount of fully assembled
    complex I. The rescue was partial in both lines and more prominent in the missense
    patient than in the stop-loss patient.
  modeled_mechanisms:
  - target: Stalled Complex I Biogenesis
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type NDUFC2 to the patients' own cells restores assembly, which is the
      demonstration that the variants rather than something else in those genomes cause the
      stall.
    limitations: >-
      The rescue is partial in both lines and neither reaches control levels of assembled
      complex I, and the authors work through why: complex I is thought to assemble within
      24 hours and the induction ran for 72, so time is not the limitation, but the mutant
      protein or the aberrant subassemblies already present may interfere. The system is a
      cultured fibroblast, so it says nothing about brain; the third patient could not be
      tested at all for lack of material; and doxycycline-driven expression is
      non-physiological in level and timing.
    readouts:
    - name: Fully assembled complex I on blue native electrophoresis after induction
      target: Stalled Complex I Biogenesis
      direction: RESTORED
      interpretation: >-
        Assembled complex I increases with doxycycline induction relative to both uninduced
        and untransduced patient cells, without reaching control levels.
      evidence:
      - reference: PMID:32969598
        reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Further assessment of complex I assembly in the wild-type NDUFC2 transduced subject fibroblasts showed an increase in complex I assembly with doxycycline induction compared to the respective uninduced cell lines and the respective untransduced subject cell lines"
        explanation: The readout with both of its internal controls.
    - name: Steady-state levels of complex I subunits after induction
      target: Stalled Complex I Biogenesis
      direction: INCREASED
      interpretation: >-
        NDUFB8, NDUFA9 and NDUFV1 all rise with induction, so the rescue acts on the
        assembly of the whole enzyme rather than on NDUFC2 alone.
      evidence:
      - reference: PMID:32969598
        reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Doxycycline induction increased both NDUFC2 levels (and those of complex I subunits NDUFB8, NDUFA9 and NDUFV1) in transduced subject cell lines"
        explanation: The named subunits that respond, which is what makes this an assembly rescue.
    evidence:
    - reference: PMID:32969598
      reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Lentiviral transduction of subjects' fibroblasts with wild-type NDUFC2 cDNA increased complex I assembly supporting the association of the identified NDUFC2 variants with mitochondrial pathology."
      explanation: >-
        The authors' own statement of what the experiment establishes, in the terms they
        chose - support for association with pathology rather than a stronger claim.
- name: Patient fibroblast complexome profiling
  experimental_model_type: OTHER
  description: >-
    Mass-spectrometric complexome profiling of mitochondria from both index patients'
    fibroblasts against an age-matched control, which is where the module-level account of
    this disease comes from. It is the assay that identified which intermediates accumulate
    and which never appear.
  modeled_mechanisms:
  - target: Failure of ND1 and ND2 Module Assembly
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Complexome profiling is what resolves an assembly defect into a module-level map. It
      showed the loss of NDUFC2's associating subunits in the ND1 and ND2 modules, the
      independent survival of the ND4 module, and the complete absence of ND5 and N module
      intermediates.
    limitations: >-
      Cultured fibroblasts, not the affected tissue, and two patients. The readout is
      abundance across a gradient rather than a direct measurement of assembly order, so the
      assembly sequence is inferred by comparing the observed intermediates against a
      published model. The scaffold interpretation the authors draw from it is offered as a
      possibility rather than a conclusion.
    readouts:
    - name: Abundance of complex I module assembly intermediates
      target: Failure of ND1 and ND2 Module Assembly
      direction: ALTERED
      interpretation: >-
        ND1 and ND2 module subunits are lost, the ND4 module persists, and ND5 and N module
        intermediates are undetectable.
      evidence:
      - reference: PMID:32969598
        reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Complexome profiling of both subjects is consistent with this model, where loss of NDUFC2 causes concurrent loss of its associating subunits"
        explanation: The readout in the two patients studied.
    evidence:
    - reference: PMID:32969598
      reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "revealing aberrant assembly intermediates suggestive of stalled biogenesis of the complex I holoenzyme and indicating a crucial role for NDUFC2 in the assembly of the membrane arm of complex I, particularly the ND2 module"
      explanation: >-
        What the assay established, and the module it localised the defect to, which is what
        makes it informative for this node.
treatments:
- name: Ventriculoperitoneal Shunting for Acute Hydrocephalus
  description: >-
    The second patient developed acute hydrocephalus at five months, on a background of an
    antenatally detected Dandy-Walker malformation, and had an urgent ventriculoperitoneal
    shunt inserted. This is decompression of a structural complication, not treatment of the
    complex I defect, and it is the only surgical intervention reported in the series.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  notes: >-
    Reported for one of the three children, and the outcome of the procedure is not stated
    beyond his subsequent course, so no effectiveness claim is made. No target_mechanisms
    link is declared: the shunt addresses hydrocephalus, which is described within the
    Dandy-Walker phenotype rather than curated as a pathophysiology node, and inventing a
    node to receive the edge would assert a mechanism the paper does not.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain CT scan detected acute hydrocephalus with significant dilatation of the third and lateral ventricles. He underwent urgent ventriculoperitoneal shunt insertion."
    explanation: >-
      The intervention and the indication for it, in the one patient who required it.
- name: Nasogastric Tube Feeding for Unsafe Swallow
  description: >-
    The same patient developed recurrent chest infections and pulmonary aspiration, which
    were taken to indicate an unsafe swallow, and was placed on nasogastric tube feeding.
    Securing enteral nutrition and reducing aspiration risk is standard supportive
    management of a progressive Leigh syndrome course, and it is the only feeding
    intervention recorded in this series.
  treatment_term:
    preferred_term: nasogastric tube feeding
    term:
      id: NCIT:C91836
      label: Nasogastric Intubation
  notes: >-
    Bound to the NCIT procedure term for nasogastric intubation, which is the clinical action
    reachable from NCIT:C25218; the feeding route rather than the tube is what the slot can
    carry, and the specificity is kept in preferred_term. No therapeutic_modality value is
    given - the intervention is enteral nutrition delivered through an indwelling tube, which
    is neither cleanly DEVICE nor the dietary sense of BEHAVIORAL, and CLAUDE.md warns
    against tagging nutritional support BEHAVIORAL by reflex. He died of pneumonia with
    severe metabolic acidosis at three years, so the measure did not alter the outcome.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent chest infections and pulmonary aspirations suggested an unsafe swallow, and he was placed on nasogastric tube feeding."
    explanation: >-
      The feeding intervention and the clinical problem that prompted it.

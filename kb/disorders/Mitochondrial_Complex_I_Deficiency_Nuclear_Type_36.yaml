    explanation: >-
      An independent expert panel confirming, three years later, that the series had not
      grown. Graded OTHER because a curation narrative is an expert synthesis, not a study.
progression:
- phase: Infantile presentation
  notes: >-
    Onset is early and the presenting features differ between the three children: antenatal
    cardiac and cerebral abnormalities with lactate elevation from birth in one, vomiting and
    psychomotor delay in the first months in another, and delay first noticed at two years in
    the third. The one common thread is that all three were symptomatic within the first two
    years.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vomiting, failure to thrive, psychomotor delay and poor eye contact were reported from the first months of life."
    explanation: The earliest onset in the series.
- phase: Fatal course in two of three children
  notes: >-
    Two of the three died in early childhood. The second patient regressed after a
    respiratory infection at nineteen months and died of pneumonia with severe metabolic
    acidosis at three years; the third died at eight months after respiratory deterioration.
    The first was alive at six years at the time of the report, unable to stand without
    support or speak. Fatal-outcome content is recorded here rather than as a phenotype,
    since the relevant HPO term sits outside the phenotype enum. In both deaths the immediate
    cause was respiratory, which is the usual terminal event in Leigh syndrome and not
    specific to this gene.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He passed away at the age of 3 years as a consequence of pneumonia with associated severe metabolic acidosis."
    explanation: The second patient's death, with its immediate cause.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following severe respiratory deterioration, the subject died at 8 months of age."
    explanation: The third patient's death, the earliest in the series.
genetic:
- name: NDUFC2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NDUFC2
    term:
      id: hgnc:7706
      label: NDUFC2
  notes: >-
    NDUFC2 encodes NADH:ubiquinone oxidoreductase subunit C2, a small membrane subunit of
    the proton-pumping arm of complex I. Its structural position, in the ND2 module facing
    the intermembrane space with contacts to twelve other subunits across three modules, is
    the whole mechanism of this disease and is curated as its own pathophysiology node.

    Two traps for anyone extending this entry from the gene rather than from the disease,
    and both are easy to fall into because they dominate a naive literature search.

    First, NDUFC2 carries a large cardiovascular and complex-trait association literature -
    polymorphic variants and cardiac hypertrophy in human hypertension, autophagy and
    hypertension-related stroke, glucose metabolism in recombinant inbred mice, Mendelian
    randomisation studies of hyperuricaemia, psychiatric multi-omics, melanoma. None of it
    concerns this disease, and none of it is cited here. The gene is common-variant
    interesting and rare-variant interesting for entirely different reasons.

    Second, there is a separate HGNC entity, NDUFC2-KCTD14 (HGNC:42956), a readthrough
    transcript, and several association signals in this genomic region are reported against
    the readthrough rather than against NDUFC2 itself. The binding in this entry is
    hgnc:7706, the protein-coding gene, and a search that does not separate the two will
    conflate them.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study documents the first cases of mitochondrial disease caused by variants in the NDUFC2 gene."
    explanation: The gene-disease relationship as established, and its novelty at the time.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our results clearly demonstrate that lentiviral expression of wild-type NDUFC2 ameliorates the phenotype, leading not only to increased steady-state levels of complex I subunits, but of their incorporation into the holoenzyme"
    explanation: >-
      The complementation result that converts an association into a causal claim, and the
      two levels at which the rescue was measured.
  - reference: CGGV:assertion_ba9a01a8-3b86-420f-a7e8-a43898cab9fa-2023-12-18T050000.000Z
    reference_title: "NDUFC2 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is moderate evidence to support the relationship between NDUFC2 and primary mitochondrial disease."
    explanation: >-

    explanation: >-
      The limit on the homozygosity claim, in the paper's own words. It is why this block
      records molecular confirmation in two of the three children rather than all three.
pathophysiology:
- name: Biallelic NDUFC2 Variant
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of NDUFC2. Two alleles are known and each is homozygous in one
    family. The Saudi siblings carry c.346_*7del, a 22-nucleotide deletion that removes the
    stop codon and replaces the last four residues with a 21-residue extension,
    p.(His116_Arg119delins21). The Moroccan boy carries c.173A>T, p.(His58Leu), at a
    histidine conserved across species, with every in silico predictor calling it damaging.
    Neither allele class is present homozygously in population databases: gnomAD contains no
    homozygous loss-of-function NDUFC2 variant at all.
  genes:
  - preferred_term: NDUFC2
    term:
      id: hgnc:7706
      label: NDUFC2
  genetic_context:
    genes:
    - preferred_term: NDUFC2
      term:
        id: hgnc:7706
        label: NDUFC2
    allele_type: a homozygous stop-loss deletion and a homozygous missense variant at a conserved histidine
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Two consanguineous families. Homozygosity is molecularly confirmed in two of the three
      patients; the second Saudi sibling was not genotyped, because no DNA was available, and
      is presumed homozygous from parental segregation and a concordant phenotype. Only the
      two index subjects, one per family, had biochemical study.
    notes: >-
      LOSS_OF_FUNCTION is used, and the striking observation behind it is that the two very
      different alleles behave the same way. The paper states that the biochemical findings
      were similar for both subjects despite one carrying a missense change and the other a
      loss-of-function variant. A single conserved residue at a module interface therefore
      costs as much as losing the protein's terminus, which is why the block takes one value
      rather than distinguishing the alleles. The alleles are not indistinguishable at every
      level, though: the complexome profile resolves NDUFC2 abundance directly and finds none
      in the stop-loss subject against a scant amount in the missense subject, so the shared
      value records a shared functional outcome rather than an identical molecular lesion.

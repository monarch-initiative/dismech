name: Mitochondrial Complex I Deficiency, Nuclear Type 36
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- MC1DN36
- mitochondrial complex 1 deficiency, nuclear type 36
- NDUFC2-related mitochondrial complex I deficiency
- NDUFC2 deficiency
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 36
  term:
    id: MONDO:0030902
    label: mitochondrial complex I deficiency, nuclear type 36
description: >-
  MC1DN36 is the isolated complex I deficiency caused by biallelic variants in NDUFC2.
  Three children from two unrelated consanguineous families have been reported, all with
  Leigh syndrome, in a single 2020 paper; nothing has been published on the gene as a
  disease cause since.

  NDUFC2 is a small membrane subunit of the proton-pumping arm of complex I, assigned to
  the ND2 module and reaching into the intermembrane space, and it contacts twelve other
  subunits across three modules. That connectivity is what makes it a hub rather than a
  passenger, and complexome profiling of patient fibroblasts shows what happens when it is
  gone: the Q module forms, and then assembly stalls. The subunits NDUFC2 touches in the
  ND1 and ND2 modules are lost with it, no ND5 or N module intermediate appears at all, and
  the distal ND4 module is still detected - which is itself informative, because it means
  ND4 assembles independently while the proximal membrane modules do not. In one patient no
  fully assembled complex I could be detected at all.

  The functional consequence is graded but severe: 16 percent residual complex I activity
  in one patient's fibroblasts, 19 percent in the other's, and 48 percent in that patient's
  muscle, with severely reduced oxygen consumption in both cell lines. Lentiviral
  expression of wild-type NDUFC2 increased both the steady-state subunit levels and the
  amount of assembled holoenzyme, which is the experiment that makes the variants causal;
  the authors are explicit that the rescue was partial and that neither line reached
  control levels.

  A point about how the two alleles behave is worth making, because it is the opposite of
  what a genotype-phenotype reading would predict. One patient is homozygous for a
  stop-loss deletion and the other for a missense change at a conserved histidine, and the
  biochemistry in the two is similar. A single conserved residue at a module interface can
  therefore do as much damage as losing the protein's natural terminus.

  Two framings of the entity coexist in the literature and this entry keeps both visible.
  MONDO and OMIM file it in the nuclear complex I deficiency series, which is how it is
  named here; ClinGen's Mitochondrial Diseases expert panel curated NDUFC2 first against
  Leigh syndrome and then, applying its lumping framework, against primary mitochondrial
  disease as a single entity. The three patients themselves were all diagnosed with Leigh
  syndrome.

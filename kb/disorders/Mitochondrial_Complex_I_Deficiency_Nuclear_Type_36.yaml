    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data support successful formation of the Q module with subsequent assembly stalling due to failed incorporation of the ND1 subunit into the inner mitochondrial membrane."
    explanation: >-
      Where the assembly line stops, and the step at which it stops - which is what
      distinguishes a stall from a general failure to assemble.

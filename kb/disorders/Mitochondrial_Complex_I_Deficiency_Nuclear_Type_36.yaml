discussions:
- discussion_id: mc1dn36_two_alleles_same_biochemistry
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Biallelic NDUFC2 Variant"
  - "pathophysiology#Failure of ND1 and ND2 Module Assembly"
  prompt: >-
    Why does a single missense change at His58 cost as much as a stop-loss allele?
  rationale: >-
    The two families carry very different alleles and the biochemistry does not distinguish
    them, which the paper states plainly. One patient is homozygous for c.346_*7del, which
    removes the stop codon and replaces the last four residues with a 21-residue extension.
    The other is homozygous for p.(His58Leu), one substitution at a conserved histidine.
    Residual complex I activity was 16 and 19 percent respectively, oxygen consumption was
    severely reduced in both, and both showed the same module-level assembly failure.

    The authors' reading is that His58 matters for the assembly or stability of the ND2
    module itself, so losing it is functionally equivalent to losing the subunit. That is
    consistent with everything measured, and it is not the only possibility: the stop-loss
    extension might be tolerated better than a frank truncation would be, which would raise
    the missense allele to meet a less severe null rather than lowering the null to meet a
    severe missense. Residual NDUFC2 protein has in fact been measured, and it does not
    separate the two accounts as cleanly as it might have. The complexome profile resolves
    NDUFC2 abundance directly: none is detectable in the stop-loss patient, while a scant
    amount is detectable in the missense patient. So the two alleles are not identical at the
    protein level even though the assembly phenotype converges, and the missense subject
    retains a little protein that is nonetheless failing to sustain the ND2 module.

    It matters beyond this gene because it bears on how a missense variant in a small
    interface subunit should be interpreted when it is found in a new patient. If a single
    conserved interface residue routinely costs a whole module, then in silico conservation
    scores are doing more work in these genes than they usually are.

    What remains open is therefore not whether the missense protein is present - it is
    whether that scant His58Leu protein is assembly-incompetent at the ND2 interface or
    merely unstable and present below the level needed to nucleate the module. Those two
    predict the same abundance and different incorporation behaviour.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical investigations into the functional consequences of the identified NDUFC2 variants showed similar findings for both Subjects 1 and 3, despite one individual harbouring a homozygous missense variant involving a highly conserved residue and the other harbouring a homozygous loss-of-function variant."
    explanation: >-
      The observation itself, with the authors' own framing of it as a contrast worth
      remarking on.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The loss of the NDUFC2-containing ND2 module in Subject 3 asserts that the conserved His58 residue plays an important role in its assembly or stability."
    explanation: >-
      The authors' explanation, and the strength of claim they attach to it. It is an
      assertion from a module-level observation rather than a measurement of the protein.
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, there was no detectable NDUFC2 protein in Subject 1, whilst a scant amount was detectable in Subject 3 (Fig 4A, grey horizontal row); this correlated with the degree of complex I intermediates and supercomplexes detectable in each subject complexome."
    explanation: >-
      The direct measurement of residual NDUFC2 abundance in both patient lines. It shows
      the missense subject retains a little protein where the stop-loss subject retains
      none, so the shared assembly phenotype is not a shared protein-level phenotype.
  proposed_experiments:
  - experiment_id: exp_mc1dn36_ndufc2_protein_levels
    name: Test whether the residual His58Leu protein can incorporate into the ND2 module
    description: >-
      Abundance is already known - the complexome profile detects a scant amount of NDUFC2 in
      the missense patient and none in the stop-loss patient - so the open question is what
      that residual protein is doing. Express His58Leu NDUFC2 at a controlled level in a
      NDUFC2-null background and ask whether it incorporates into the ND2 module, by
      immunoprecipitation or by complexome profiling restricted to that module. A protein
      present but excluded from the module establishes an interface-binding defect; a protein
      that incorporates and is simply too scarce points to instability instead.
- discussion_id: mc1dn36_two_disease_framings
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - disease#
  prompt: >-
    Is this a complex I deficiency subtype or a Leigh syndrome gene, and does the difference
    matter?
  rationale: >-
    Both framings are in current use by authorities that are not disagreeing about any fact.

    MONDO and OMIM file the entity in the nuclear complex I deficiency series as type 36,
    which is the name this entry carries. ClinGen's Mitochondrial Diseases expert panel
    curated NDUFC2 first against Leigh syndrome spectrum in 2020, then re-curated it in 2023
    against primary mitochondrial disease, applying its lumping and splitting framework to
    fold the Leigh cases into a single gene-defined entity. The three published patients were
    all diagnosed with Leigh syndrome.

    So there are three names for one set of three children, and each is defensible: a
    biochemical classification, a clinical syndrome, and a gene-defined entity. This entry
    uses the MONDO name because that is what the knowledge base keys on, curates Leigh
    syndrome as an OBLIGATE phenotype because it is what all three patients had, and cites
    the ClinGen assertions for both of that panel's framings.

    Where the difference could matter is in retrieval rather than in biology. A clinician
    searching Leigh syndrome genes and a curator searching the MC1DN series should both find
    this entity, and a knowledge base that recorded only one framing would fail one of them.
    It also matters for how the disorder's boundaries will be drawn if a patient is reported
    who has NDUFC2 variants without Leigh syndrome - on the MONDO framing that patient still
    has MC1DN36, on the ClinGen framing they still have NDUFC2-related mitochondrial disease,
    and only the clinical framing would exclude them.

    Worth noting for the structural record: MONDO:0030902 has exactly one superclass,
    MONDO:0100223 mitochondrial complex I deficiency nuclear type, and is not placed under
    Leigh syndrome, so the ontology does not itself hold both framings.
  evidence:
  - reference: CGGV:assertion_ba9a01a8-3b86-420f-a7e8-a43898cab9fa-2023-12-18T050000.000Z
    reference_title: "NDUFC2 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, the NDUFC2 phenotype has been lumped into one disease entity according to the ClinGen Lumping and Splitting Framework."
    explanation: >-
      The expert panel stating its own lumping decision explicitly, which is the clearest
      available statement of the alternative framing.
  - reference: CGGV:assertion_3d819bce-43ed-45a3-a16b-74033d432272-2021-01-21T004055.963Z
    reference_title: "NDUFC2 / Leigh syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The relationship between NDUFC2 and Leigh syndrome spectrum was evaluated using the ClinGen Clinical Validity Framework as of November 23, 2020."
    explanation: The earlier framing, against the clinical syndrome rather than the gene-defined entity.
- discussion_id: mc1dn36_no_treatment_or_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying treatment to curate?
  rationale: >-
    No. Nothing disease-modifying exists for NDUFC2 deficiency, no treatment response is
    reported for any of the three patients, and no trial is registered for the gene or the
    disorder.

    What the treatments block does hold is the two supportive interventions the paper
    actually records, each in the same single patient: a ventriculoperitoneal shunt for
    acute hydrocephalus, and nasogastric tube feeding for an unsafe swallow. Both are
    directed at complications rather than at the complex I defect, neither is reported with
    an outcome, and the child died at three years. They are curated because they are
    documented facts about these patients, not because they constitute a management
    strategy. Intensive care during his respiratory crisis is described in the course rather
    than curated as a treatment, because the paper records it as a level of care rather than
    as an intervention with an indication.

    The lentiviral complementation is not a treatment. It is the experiment that established
    causality, it is curated under experimental_models with its limitations attached, and the
    authors present it as support for pathogenicity rather than as a therapeutic proposal.
    Reading it as gene therapy in prospect would be an inference the source does not make.

    Generic supportive management of Leigh syndrome, and the management recommendations in
    the GeneReviews Leigh syndrome spectrum chapter, are ready-made content that would look
    right here and are deliberately not imported. Doing so would assert of three NDUFC2
    patients an experience recorded only of other people with other genotypes.

    The one thing the diagnosis demonstrably changed for these families is recorded in the
    diagnosis block rather than here: it enabled prenatal testing in subsequent pregnancies,
    which the authors give as the concrete clinical value of the molecular result.
  evidence:
  - reference: PMID:32969598
    reference_title: "Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled biogenesis of complex I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmation of these variants as causative enables prenatal testing of a subsequent pregnancies in these families, demonstrating the clinical importance of providing a genetic diagnosis in mitochondrial disease cases"
    explanation: >-
      The one clinical consequence the authors claim for the diagnosis, which is
      reproductive rather than therapeutic.
notes: >-
  Scope decision: curated as a DISEASE, a standalone entry, consistent with the MC1DN types
  already in the knowledge base - 2, 6, 12, 23, 24, 31 and 34. MC1DN13 is referred to below
  as a sibling; at the time of writing it is an open pull request rather than a merged
  entry, so treat those comparisons as being with work in flight. The stub is deleted by
  this change.

  The Leigh question, checked for this term rather than assumed. MONDO:0030902 has exactly
  one superclass, MONDO:0100223 mitochondrial complex I deficiency nuclear type. MONDO does
  not place it under Leigh syndrome, so this does not become a has_subtypes entry on
  Leigh_Syndrome. That placement was checked against this MONDO term directly rather than
  carried over from how the question was resolved for another MC1DN type; there is no
  MC1DN1 entry in the knowledge base to appeal to. Separately, kb/disorders/Leigh_Syndrome.yaml
  does not bind NDUFC2: its genetic block binds NDUFS4, NDUFV1, SURF1, LRPPRC, MT-ATP6 and
  PDHA1. Both checks were run for this term independently of the sibling entry MC1DN13
  curated in the same session, and both came back the same way.

  Unlike MC1DN13, where the Leigh presentation occurred in one of four patients and the
  modal phenotype was a leukodystrophy, all three NDUFC2 patients had Leigh syndrome. So the
  tension between the MONDO naming and the clinical framing is a nomenclature question here
  rather than a phenotypic one, and it is set out in the discussion
  mc1dn36_two_disease_framings, which also records ClinGen's explicit lumping decision.

  On the Named Entity Confusion risk, which is real for this gene and was actively managed.
  NDUFC2 has a large cardiovascular and complex-trait association literature - hypertension
  and cardiac hypertrophy, hypertension-related stroke, glucose metabolism, Mendelian
  randomisation for hyperuricaemia, psychiatric multi-omics, melanoma - and there is a
  separate HGNC readthrough entity NDUFC2-KCTD14 (HGNC:42956) against which several regional
  association signals are reported. None of that literature is cited anywhere in this entry,
  the gene binding is hgnc:7706 rather than the readthrough, and the trap is written into the
  genetic notes so the next curator does not have to rediscover it.

  What is deliberately not curated. The treatments block holds only the two supportive
  interventions the source reports in one patient - a ventriculoperitoneal shunt and
  nasogastric feeding - and nothing disease-modifying, because nothing disease-modifying
  exists; the reasoning, including why generic Leigh syndrome management was not imported,
  is in mc1dn36_no_treatment_or_natural_history. There is no biochemical block: the complex I
  enzymology and the lactate are the disease's substantive measurements and are curated as
  phenotypes and pathophysiology nodes. There are no animal models and no clinical trials -
  none exists. Several individually reported findings are described in prose rather than
  bound as phenotypes because they occur once and are not obviously part of the disease:
  facial dysmorphic features, left hydronephrosis, non-paralytic strabismus, and the
  abnormal brainstem auditory and visual evoked potentials. The Dandy-Walker malformation and
  the ventricular septal defect are bound, because they are specific and consequential, but
  each carries a note saying it occurred in one child whose sibling with the same genotype
  did not have it.

  On GeneReviews. PMID:26425749, Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview, is
  the applicable chapter and is tagged in the top-level references block, following the
  sibling entries MC1DN2, MC1DN6, MC1DN23 and MC1DN34. It is deliberately not cited as
  evidence: its cached record carries the chapter header and author list and no clinical
  content, so any snippet from it would attest to the chapter's existence rather than to a
  fact about NDUFC2 disease.

  On the ClinGen records. Both CGGV assertions cited here were rebuilt during this curation
  rather than taken from the committed cache, because neither existed in it. Rebuilding
  surfaced the full Evidence summary narratives, which is where the lumping statement and
  the first-and-only-report statement come from; a csv-only rebuild would have produced the
  table row without them.

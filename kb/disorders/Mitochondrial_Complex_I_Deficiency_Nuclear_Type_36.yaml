- name: Failure of ND1 and ND2 Module Assembly
  biological_scale: MOLECULAR
  description: >-
    Losing NDUFC2 takes its neighbours with it. Complexome profiling of both index patients
    shows concurrent loss of the subunits NDUFC2 associates with, in the ND1 and ND2
    modules. The negative results are as informative as the positive ones: neither an ND5
    nor an N module intermediate was found at all, while the distal ND4 module was still
    detected - so the distal membrane module assembles independently while the two proximal
    ones do not. The authors read this as NDUFC2 possibly acting as a scaffold for ND1
    module formation.

  description: >-
    The cellular consequence, measured directly. High-resolution respirometry of intact
    cells shows severely decreased oxygen consumption in both patients' fibroblast lines.
    A cell that cannot oxidise NADH through complex I cannot maintain normal electron flux
    into the rest of the chain, and the shortfall shows as reduced respiration rather than
    as a compensated steady state.

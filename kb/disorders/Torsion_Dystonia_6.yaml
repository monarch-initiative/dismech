name: Torsion Dystonia 6
creation_date: "2026-09-12T13:20:00Z"
category: Mendelian
synonyms:
- DYT6
- DYT6 dystonia
- DYT-THAP1
- THAP1 dystonia
- dystonia 6, torsion
- primary torsion dystonia, mixed type
description: >-
  An autosomal dominant isolated dystonia with markedly reduced penetrance,
  caused by heterozygous variants in THAP1. It was the first dystonia attributed
  to a transcription factor, and that is still the defining fact about its
  mechanism: THAP1 is a THAP-domain zinc-finger DNA-binding protein, so the
  primary lesion is a failure of gene regulation rather than of a channel, an
  enzyme, or a structural protein.

  The chain that follows is unusually well characterised at its molecular end and
  unusually poorly closed at its clinical end, and this entry is built to show
  that asymmetry rather than to paper over it. Reduced THAP1 DNA binding and
  disrupted cofactor recruitment lead to broad transcriptional dysregulation,
  executed substantially through the SP1 and SP4 transcription factors and in a
  cell-type-dependent way. Downstream of that, patient-derived striatal medium
  spiny neurons show reduced GABA-A receptor alpha2 expression and decreased
  GABAergic transmission, which is a concrete cellular defect measured in human
  cells. What is not established is the step from there to dystonic movement:
  the basal ganglia and cerebellar network dysfunction that is presumed to
  intervene is supported by imaging and by rodent circuit findings, not by a
  demonstrated causal path in humans.

  Two features make this entry worth reading carefully.

  First, the mouse does not get the disease. Germline Thap1 deletion is embryonic
  lethal, and the heterozygote - the genotype that should model human
  haploinsufficiency - has no discernable phenotype, because the mouse
  upregulates the remaining allele. Conditional nervous-system deletion produces
  locomotor deficits but still no dystonia. That is recorded structurally, as a
  FAILS_TO_RECAPITULATE model link and a HUMAN_MODEL_MISMATCH discussion, rather
  than as a caveat in prose.

  Second, there is no genotype-phenotype correlation. A systematic review of the
  published THAP1 families states this outright. Since more than eighty variants
  are known and two thirds are missense, that absence is a substantive finding
  about the disease and not a gap in the literature review, so the entry does not
  assert variant-specific severity claims.

  Relationship to the existing Cervical_Dystonia entry: that entry covers common
  adult-onset sporadic focal cervical dystonia, deliberately binds no causal gene,
  and types THAP1 as SUSCEPTIBILITY because these genes explain a small minority
  of unselected cases. This entry is the Mendelian entity itself - one gene,
  dominant transmission, characteristic early-onset craniocervical and laryngeal
  involvement with limb spread. They are different diseases that share a
  phenotypic region.

  No pathophysiology node declares conforms_to. kb/modules/ was searched and no
  module covers transcription-factor haploinsufficiency or basal ganglia motor
  network imbalance.
disease_term:
  preferred_term: torsion dystonia 6
  term:
    id: MONDO:0011264
    label: torsion dystonia 6
parents:
- Isolated dystonia
- Monogenic dystonia
inheritance:
- name: Autosomal dominant with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous THAP1 variants segregate dominantly, but many carriers never
    develop dystonia. Reduced penetrance means an unaffected transmitting parent
    is common and a negative family history does not exclude the diagnosis.
  evidence:
  - reference: PMID:19182804
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the discovery of a mutation in the THAP1 gene in three Amish-Mennonite families with mixed-onset primary torsion dystonia (also known as DYT6 dystonia)."
    explanation: >-
      The original family-based identification of THAP1 as the DYT6 locus.
  - reference: PMID:21793105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "account for a substantial proportion of familial, early-onset, nonfocal, primary dystonia cases"
    explanation: >-
      Confirms familial transmission across many independent reports.
pathophysiology:
- name: Heterozygous THAP1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous variants in THAP1, most often missense changes affecting the
    N-terminal THAP DNA-binding domain, but also frameshift and nonsense alleles.
    More than eighty variants have been reported and about two thirds are
    missense. Different variant classes reach the same endpoint by different
    routes: some abolish DNA binding, some destabilise the protein, and some leave
    DNA binding intact while abolishing cofactor recruitment.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Reduced THAP1 Transcriptional Regulatory Function
    description: >-
      Loss of DNA binding, loss of protein stability, or loss of cofactor
      recruitment each reduce the amount of functional THAP1 regulatory activity
      at target promoters.
  evidence:
  - reference: PMID:32112337
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until now, more than eighty different mutations in THAP1 gene have been found in patients with primary dystonia, and two third of them are missense mutations."
    explanation: >-
      Quantifies the variant spectrum and the predominance of missense change.
  - reference: PMID:19182804
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that the missense mutation impairs DNA binding, suggesting that transcriptional dysregulation may contribute to the phenotype of DYT6 dystonia."
    explanation: >-
      Shows the functional consequence of a disease missense variant on DNA
      binding. Graded IN_VITRO because the DNA-binding demonstration is a
      biochemical assay, while the family identification in the same paper is
      clinical.
- name: Reduced THAP1 Transcriptional Regulatory Function
  biological_scale: MOLECULAR
  description: >-
    The convergence point of the variant classes. THAP1 is a zinc-finger
    transcription factor, and disease variants reduce its regulatory output either
    by impairing sequence-specific DNA binding, by reducing protein stability and
    so effective dosage, or by abolishing recruitment of the HCFC1 cofactor at
    promoters THAP1 still binds. The last of these is the reason a variant can be
    pathogenic with normal DNA binding.
  molecular_functions:
  - preferred_term: sequence-specific DNA binding by the THAP zinc-finger domain
    modifier: DECREASED
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
  downstream:
  - target: Transcriptional Dysregulation Through the SP1 Family
    description: >-
      Reduced THAP1 regulatory function propagates into a much wider expression
      change than its own direct target set, because it acts through other
      transcription factors.
  evidence:
  - reference: PMID:28486698
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We investigated the consequences of these mutations on the interaction of THAP1 with HCFC1 and demonstrated that all three mutations abolished HCFC1-THAP1 complex formation."
    explanation: >-
      Shows a distinct loss-of-function route: three patient variants in the
      HCFC1-binding motif abolish cofactor recruitment.
  - reference: PMID:28486698
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Quantitative ChIP on selected promoters revealed that none of the mutations significantly decreased the DNA-binding ability of THAP1 while HCFC1 binding was highly reduced."
    explanation: >-
      Establishes that this route is independent of DNA binding. Marked INDIRECT
      because it supports the node by excluding the alternative mechanism rather
      than by measuring regulatory output directly.
  - reference: PMID:32112337
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we show that some THAP1 mutations (C54Y and F81L) decrease the protein stability which might also be responsible for altered transcription regulation due to dosage insufficiency."
    explanation: >-
      Documents the protein-stability route to reduced regulatory function.
- name: Transcriptional Dysregulation Through the SP1 Family
  biological_scale: MOLECULAR
  description: >-
    THAP1 turns out to account directly for only a minority of the genes that
    change when it is mutated. The bulk of the effect runs through the SP1 family
    transcription factors SP1 and SP4, and it is cell-type dependent - which is a
    plausible part of why a ubiquitously expressed transcription factor produces a
    disorder confined to motor control.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:
  - target: Reduced Striatal GABAergic Transmission
    description: >-
      Among the dysregulated gene sets are those governing synaptic transmission,
      and the measured consequence in patient-derived striatal neurons is a
      GABAergic deficit.
  - target: Basal Ganglia and Cerebellar Motor Network Dysfunction
    description: >-
      Transcriptional changes affecting nervous system development and synaptic
      transmission are the proposed origin of the circuit-level abnormality.
      Supported in rodent models rather than demonstrated in humans.
  evidence:
  - reference: PMID:35015830
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "THAP1 mutations lead to dysregulation of genes mainly through regulation of SP1 family members, SP1 and SP4, in a cell type dependent manner."
    explanation: >-
      States the SP1/SP4 route and its cell-type dependence, which is the core
      claim of this node.
  - reference: PMID:35015830
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed that THAP1 targeted only a minority of differentially expressed genes caused by its mutation."
    explanation: >-
      Supports the claim that most of the expression change is indirect rather
      than at THAP1's own binding sites.
  - reference: PMID:32112337
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ChIP-seq showed that THAP1 can bind to the promoter of one of these genes, superoxide dismutase 2 (SOD2)."
    explanation: >-
      An example of a directly bound target gene, complementing the indirect
      SP1-family route.
- name: Reduced Striatal GABAergic Transmission
  biological_scale: CELLULAR
  description: >-
    The most concrete cellular defect demonstrated in human cells. Patient-derived
    striatal medium spiny neurons show downregulation of the GABA-A receptor alpha2
    subunit, lower calcium responses to GABA, and reduced miniature postsynaptic
    current frequency, with an increased rate of spontaneous action potentials -
    that is, disinhibition and hyperexcitability.
  biological_processes:
  - preferred_term: synaptic transmission, GABAergic
    modifier: DECREASED
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
  cell_types:
  - preferred_term: striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  downstream:
  - target: Basal Ganglia and Cerebellar Motor Network Dysfunction
    description: >-
      Disinhibited, hyperexcitable striatal projection neurons are the proposed
      cellular substrate of abnormal basal ganglia output.
  evidence:
  - reference: PMID:34095114
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Calcium imaging and quantitative PCR analysis revealed significantly lower Ca2+ amplitudes upon GABA applications and a marked downregulation of the gene encoding the GABA A receptor alpha2 subunit in THAP1 MSNs indicating a decreased GABAergic transmission."
    explanation: >-
      Measures the GABAergic deficit in patient-derived neurons, which is the
      claim of this node.
  - reference: PMID:34095114
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whole-cell patch-clamp recordings showed a significantly lower frequency of miniature postsynaptic currents (mPSCs), whereas the frequency of spontaneous action potentials (APs) was elevated in THAP1 MSNs suggesting that decreased synaptic activity might have resulted in enhanced generation of APs."
    explanation: >-
      Documents the electrophysiological disinhibition and hyperexcitability
      described in this node.
- name: Basal Ganglia and Cerebellar Motor Network Dysfunction
  biological_scale: TISSUE
  description: >-
    The least resolved step, and the entry says so. Abnormal output from basal
    ganglia-thalamo-cortical loops, with a parallel cerebellar contribution, is
    the standard account of how a striatal cellular defect becomes dystonic
    movement. The human evidence is structural imaging showing damaged axonal
    integrity in sensorimotor white matter; the circuit-level causal account comes
    from rodent models, which do not reproduce the human phenotype. No human study
    curated here demonstrates the causal step from this node to dystonia.
  biological_processes:
  - preferred_term: chemical synaptic transmission in motor circuitry
    modifier: ABNORMAL
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  locations:
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Isolated Dystonia
    description: >-
      Aberrant sensorimotor integration and loss of surround inhibition are the
      proposed proximate cause of the dystonic posture and movement. This edge is
      inferred rather than demonstrated.
  evidence:
  - reference: PMID:22652465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The axonal integrity and coherence in the region of sensorimotor area of the brain was damaged in DYT6 dystonia."
    explanation: >-
      Human diffusion tensor imaging evidence of a sensorimotor white-matter
      abnormality in genotyped patients. Note that the same abstract's results
      sentence attributes the fractional anisotropy reduction to "DYT1 carriers"
      while the study enrolled DYT6 patients; the conclusion sentence quoted here
      is the unambiguous statement and is used for that reason.
  - reference: PMID:30590536
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Although these mice do not exhibit dystonia, they show pronounced locomotor deficits reflecting derangements in the cerebellar and basal ganglia circuitry."
    explanation: >-
      Supports involvement of cerebellar and basal ganglia circuitry, and is
      marked INDIRECT for the strongest possible reason: the same sentence records
      that the model does not produce dystonia, so it bears on the circuit claim
      without bearing on the step to the clinical phenotype.
- name: Isolated Dystonia
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: sustained or intermittent involuntary muscle
    contractions producing abnormal postures and repetitive movements, with no
    other neurological sign. Onset is typically in childhood or adolescence, most
    often craniocervical or laryngeal, with spread to the limbs. Penetrance is
    incomplete, so this node is reached by only a fraction of carriers.
  downstream:
  - target: Torticollis
  - target: Laryngeal dystonia
  - target: Dysarthria
  - target: Writer's cramp
  - target: Oromandibular dystonia
  - target: Blepharospasm
  - target: Generalized dystonia
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whilst in the DYT6 cases, the onset was cranial or cervical and progresses very slowly."
    explanation: >-
      Describes the characteristic onset distribution and tempo that distinguish
      this entity from DYT1 dystonia.
  - reference: PMID:21793105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we carried out a systematic review of the literature on the THAP1 gene to colligate all reported patients with a specific THAP1 mutation and the associated clinical signs in order to describe the broad phenotypic continuum of this disorder."
    explanation: >-
      Establishes that the clinical picture is a continuum rather than a single
      stereotyped presentation.
phenotypes:
- category: Neurologic
  name: Torticollis
  description: >-
    Cervical dystonia. The neck is the most frequently affected region, and
    cervical onset is one of the two characteristic presentations.
  phenotype_term:
    preferred_term: Cervical dystonia
    term:
      id: HP:0000473
      label: Torticollis
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whilst in the DYT6 cases, the onset was cranial or cervical and progresses very slowly."
    explanation: >-
      Reports cervical onset as one of the characteristic presentations.
- category: Neurologic
  name: Laryngeal dystonia
  description: >-
    Spasmodic dysphonia. Laryngeal involvement is a recognised and relatively
    distinctive feature of this entity within the isolated dystonias.
  phenotype_term:
    preferred_term: Spasmodic dysphonia
    term:
      id: HP:0012049
      label: Laryngeal dystonia
  evidence:
  - reference: PMID:21793105
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of a larger number of THAP1 mutations and collection of high-quality clinical information for each described mutation through international collaborative effort will help investigating the structure-function and genotype-phenotype correlations in DYT6 dystonia."
    explanation: >-
      Marked INDIRECT and worth reading as such. The systematic review this quote
      comes from is the entry's source for the phenotypic continuum that includes
      laryngeal involvement, but the abstract does not enumerate the individual
      body regions, so no quote in the cached record asserts laryngeal dystonia
      directly. Recorded honestly rather than supported by a quote that does not
      say it.
- category: Neurologic
  name: Dysarthria
  description: >-
    Speech impairment arising from cranial and laryngeal dystonia rather than from
    a corticobulbar lesion.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSION: The major clinical differences between DYT1 and DYT6 dystonia in China were the cranial involvement in DYT6 and progress to general dystonia within several years in DYT1."
    explanation: >-
      Supports cranial involvement, of which dysarthria is a manifestation.
      Marked INDIRECT because the quote names the region rather than the symptom.
- category: Neurologic
  name: Writer's cramp
  description: >-
    Task-specific focal dystonia of the upper limb, part of the brachial
    involvement characteristic of spread in this disorder.
  phenotype_term:
    preferred_term: Task-specific upper limb dystonia
    term:
      id: HP:0002356
      label: Writer's cramp
  evidence:
  - reference: PMID:21793105
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, 56 families present with a THAP1 mutation; however, no genotype/phenotype relationship has been found."
    explanation: >-
      Marked INDIRECT for the same reason as laryngeal dystonia: the cached
      abstract establishes a broad phenotypic continuum across 56 families
      without enumerating body regions. The region is clinically well described
      but is not asserted by any quote available in this entry's reference cache.
- category: Neurologic
  name: Oromandibular dystonia
  description: >-
    Dystonia of the jaw, tongue and lower face, part of the cranial involvement
    that distinguishes this entity from DYT1 dystonia.
  phenotype_term:
    preferred_term: Oromandibular dystonia
    term:
      id: HP:0012048
      label: Oromandibular dystonia
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical differences between DYT1 and DYT6 dystonia in China were the cranial involvement in DYT6"
    explanation: >-
      Supports cranial involvement, of which oromandibular dystonia is a
      manifestation. Marked INDIRECT because the quote names the region rather
      than the specific pattern.
- category: Neurologic
  name: Blepharospasm
  description: >-
    Involuntary forced eyelid closure, a cranial dystonia manifestation.
  phenotype_term:
    preferred_term: Blepharospasm
    term:
      id: HP:0000643
      label: Blepharospasm
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cranial involvement in DYT6"
    explanation: >-
      Supports cranial involvement, of which blepharospasm is a manifestation.
      Marked INDIRECT because the quote names the region rather than the sign.
- category: Neurologic
  name: Generalized dystonia
  description: >-
    Spread from a focal onset to segmental and then generalized distribution. This
    is described as slower in this disorder than in DYT1 dystonia, which
    generalizes within a few years.
  phenotype_term:
    preferred_term: Generalized dystonia
    term:
      id: HP:0007325
      label: Generalized dystonia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20825472
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentations of the DYT1 cases included onset in the limbs that could progress to the generalized dystonia within several years but without cranial involvement."
    explanation: >-
      Establishes the contrasting DYT1 tempo against which this disorder's slower
      spread is described in the same study.
genetic:
- name: THAP1
  gene_term:
    preferred_term: THAP1
    term:
      id: hgnc:20856
      label: THAP1
  relationship_type: CAUSATIVE
  notes: >-
    THAP1 is hgnc:20856. It is not THAP11, which is hgnc:23194 and causes an
    unrelated disorder; the two have been confused in at least one deep-research
    output, and the confusion is not caught by term validation because a CURIE and
    its label can agree while naming a gene the surrounding text does not (see
    dismech issue #10948). The binding here was read from the HGNC term cache.

    More than eighty pathogenic variants are known, about two thirds missense, and
    the systematic review of published families reports no genotype-phenotype
    relationship. This entry therefore makes no variant-specific severity claim.
  evidence:
  - reference: PMID:21793105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "THAP1 is the first transcriptional factor involved in primary dystonia and the hypothesis of a transcriptional deregulation, which was primarily proposed for the X-linked dystonia-parkinsonism (DYT3 dystonia), provided thus a new way to investigate the possible mechanism underlying the development of dystonic movements."
    explanation: >-
      Establishes THAP1's identity as a transcription factor and the significance
      of that for the mechanism.
  - reference: PMID:21793105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, 56 families present with a THAP1 mutation; however, no genotype/phenotype relationship has been found."
    explanation: >-
      States the absence of genotype-phenotype correlation recorded in the notes.
  - reference: PMID:20825472
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall mutation frequency was 4.5% in this cohort with TOR1A mutations found in 2.7% and THAP1 mutations found in 1.8%."
    explanation: >-
      Quantifies the contribution of THAP1 variants to an unselected primary
      dystonia cohort, which is small - the reason the sporadic focal disease is
      curated separately with THAP1 typed as SUSCEPTIBILITY.
animal_models:
- name: Thap1 heterozygous knockout mouse
  species: Mouse
  genotype: Thap1 heterozygous null
  publication: PMID:30590536
  description: >-
    The genotype that should, in principle, model human THAP1 haploinsufficiency.
    It does not. The mouse compensates by upregulating transcription from the
    intact allele, and has no discernable phenotype.
  modeled_mechanisms:
  - target: Reduced THAP1 Transcriptional Regulatory Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The model fails at the first node it is meant to reproduce: transcriptional
      autoregulation restores Thap1 message, so the haploinsufficient state the
      human disease depends on is not established.
    limitations: >-
      Thap1 mRNA is autoregulated in mouse, with upregulation at the non-affected
      locus, so heterozygous deletion does not produce a reduced-dosage state.
      Germline homozygous deletion cannot be used instead because it is embryonic
      lethal. The failure is a species difference in gene dosage compensation, not
      a limitation of the construct.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Mouse compensates for the loss of one Thap1 allele by upregulating the
        remaining one. No comparable autoregulatory rescue is described in human
        carriers, who are symptomatic at the same genotype.
    evidence:
    - reference: PMID:30590536
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "While germ-line deletion of Thap1 is embryonic lethal, mice lacking one Thap1 allele-which in principle should recapitulate the haploinsufficiency of the human syndrome-do not show a discernable phenotype."
      explanation: >-
        The authors' own statement that the model does not reproduce the human
        haploinsufficient state.
    - reference: PMID:30590536
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is because mice show autoregulation of Thap1 mRNA levels with upregulation at the non-affected locus."
      explanation: >-
        Gives the mechanism of the failure, which is what makes this a species
        mismatch rather than an unexplained negative result.
  evidence:
  - reference: PMID:30590536
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking one Thap1 allele-which in principle should recapitulate the haploinsufficiency of the human syndrome-do not show a discernable phenotype"
    explanation: >-
      Attests that this model is not informative for the human disease at the
      genotype that matches it.
- name: Nestin-conditional Thap1 knockout mouse
  species: Mouse
  genotype: Thap1 conditional deletion in nestin-expressing glial and neuronal precursors
  publication: PMID:30590536
  description: >-
    Deletion of Thap1 in neural precursors, used to get past the embryonic
    lethality of germline deletion and the autoregulatory rescue in heterozygotes.
    It produces locomotor deficits and transcriptional changes overlapping other
    dystonic syndromes, but still no dystonia.
  modeled_mechanisms:
  - target: Basal Ganglia and Cerebellar Motor Network Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces circuit-level derangement in the cerebellar and basal ganglia
      pathways, and the transcriptional signature, without reproducing the
      disease's defining motor phenotype.
    limitations: >-
      The model does not develop dystonia. Deletion is in neural precursors rather
      than a heterozygous point variant, so the genetic lesion is more severe and
      earlier than the human one, and the readout is locomotor deficit rather than
      dystonic posturing.
    divergences:
    - divergence_type: OTHER
      materiality: QUALIFYING
      description: >-
        The model reaches the circuit node but not the clinical endpoint:
        locomotor deficits are observed, while sustained involuntary muscle
        contraction producing abnormal posture, which is what defines dystonia,
        is not. Typed OTHER because ModelDivergenceTypeEnum has no value for a
        model that reproduces the mechanism but not the phenotype; the nearest
        candidate discussed in CLAUDE.md, INCOMPLETE_PHENOTYPE, is named there as
        a likely future addition and is not currently a permissible value.
    evidence:
    - reference: PMID:30590536
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although these mice do not exhibit dystonia, they show pronounced locomotor deficits reflecting derangements in the cerebellar and basal ganglia circuitry."
      explanation: >-
        States both the circuit finding this link records and the phenotypic
        limitation that caps its fidelity.
  evidence:
  - reference: PMID:30590536
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These behavioral features are associated with alterations in the expression of genes involved in nervous system development, synaptic transmission, cytoskeleton, gliosis and dopamine signaling that link DYT6 to other primary and secondary dystonic syndromes."
    explanation: >-
      Supports treating the model as informative for the transcriptional and
      circuit nodes, through the pathway overlap with other dystonic syndromes.

treatments:
- name: Oral pharmacotherapy
  description: >-
    The first tier of the dystonia treatment algorithm, used before chemodenervation
    and surgery: anticholinergics, baclofen and clonazepam, all off-label. A
    levodopa trial is standard in young-onset dystonia to exclude dopa-responsive
    dystonia, which is a different disease rather than a treatment for this one.
    Like everything else here it is symptomatic and does nothing about the
    transcriptional lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral pharmacotherapy for dystonia
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Isolated Dystonia
    description: >-
      Acts on the motor endpoint by modulating cholinergic and GABAergic tone,
      downstream of every mechanistic node in this entry.
  notes: >-
    therapeutic_agent is left absent deliberately. The cited source names the drug
    classes rather than reporting an outcome for any one agent in THAP1-genotyped
    patients, so binding a specific CHEBI agent would assert more than the evidence
    carries.
  evidence:
  - reference: PMID:31117876
    reference_title: "Update on current and emerging therapies for dystonia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral anticholinergics, baclofen and clonazepam are used off-label, but novel drugs in development include sodium oxybate, zonisamide and perampanel."
    explanation: >-
      Names the first-tier oral agents and records that their use is off-label.
      INDIRECT because the source is a dystonia-management review rather than a
      THAP1-genotyped study.
- name: Botulinum toxin chemodenervation
  description: >-
    Intramuscular botulinum toxin injection into the dystonic muscles, the
    standard symptomatic treatment for focal and segmental dystonia. It acts on
    the effector end of the chain and does nothing about the transcriptional
    lesion.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: botulinum toxin chemodenervation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Isolated Dystonia
    description: >-
      Blocks acetylcholine release at the neuromuscular junction of the injected
      muscle, reducing the dystonic contraction. Symptomatic only, and downstream
      of every mechanistic node in this entry.
  notes: >-
    therapeutic_modality is OTHER, not SMALL_MOLECULE. Botulinum neurotoxin is a
    roughly 150 kDa bacterial protein, so SMALL_MOLECULE is factually wrong, and
    PEPTIDE would be almost as wrong at that size. PROTEIN_REPLACEMENT does not
    apply because nothing deficient is being replaced. OTHER is the honest
    remainder. Note the KB is inconsistent here: botulinum treatments elsewhere
    carry SMALL_MOLECULE about as often as OTHER, which is worth a sweep.

    therapeutic_agent is left absent. NCIT:C163032 Botulinum Toxin and
    NCIT:C82623 Botulinum Toxin Type A both exist and were read from the NCIT
    cache, but the evidence below is a dystonia-management guideline rather than a
    THAP1-genotyped series, so the agent is named in the description rather than
    bound as an evidence-backed claim about this disorder specifically. The
    openscientist report offered NCIT:C1084 for botulinum toxin; that CURIE is
    Staphylococcal Enterotoxin B, and it was not used.
  evidence:
  - reference: PMID:31117876
    reference_title: "Update on current and emerging therapies for dystonia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chemodenervation with botulinum toxin remains the treatment of choice for focal- or select-body regions in generalized and segmental dystonia."
    explanation: >-
      Establishes botulinum toxin as first-line for the focal and segmental
      distribution this disorder presents with. Marked INDIRECT because the source
      is a dystonia-management review and does not report a THAP1-genotyped
      cohort, so it supports the practice rather than an outcome in DYT6.
- name: Deep brain stimulation of the globus pallidus internus
  description: >-
    Bilateral pallidal deep brain stimulation, used for medically refractory
    generalized or segmental dystonia. It intervenes at the network node rather
    than at the muscle, which makes it the one treatment in this entry that acts
    inside the pathograph rather than at its endpoint.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Basal Ganglia and Cerebellar Motor Network Dysfunction
    description: >-
      Modulates pallidal output, altering the abnormal basal ganglia-thalamo-cortical
      signalling proposed to generate the dystonia.
  notes: >-
    The openscientist report for this disease offered NCIT:C38150 for deep brain
    stimulation; that CURIE is PEComa, and it was not used. The term bound here,
    NCIT:C21024, was read from the NCIT term cache.
  evidence:
  - reference: PMID:31817799
    reference_title: "Pallidal Deep Brain Stimulation in DYT6 Dystonia: Clinical Outcome and Predictive Factors for Motor Improvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All benefited from surgery: dystonia severity was reduced by a median of 58% (IQR 31-62, p = 0.001) at last follow-up, as assessed by the Burke Fahn Marsden movement subscale."
    explanation: >-
      Reports the outcome in a genotyped THAP1 cohort, which is what makes this
      evidence about this disorder rather than about dystonia generally.
  - reference: PMID:21949105
    reference_title: "Pallidal deep brain stimulation for DYT6 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYT6 patients appear to respond less robustly to GPi-DBS than their DYT1 counterparts, most likely reflecting differences in the underlying pathophysiology of these distinct genetic disorders."
    explanation: >-
      Records the qualification that matters clinically: the response is real but
      weaker than in DYT1, and the authors attribute that to a genuinely different
      pathophysiology rather than to technique.
discussions:
- discussion_id: dyt6_mouse_does_not_get_dystonia
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    No unprovoked Thap1 mouse develops dystonia, yet a nerve-injured heterozygote
    does. What does the need for a second hit imply about the proposed causal
    chain from transcriptional dysregulation to dystonic movement?
  attaches_to:
  - pathophysiology#Basal Ganglia and Cerebellar Motor Network Dysfunction
  - animal_models#Mouse
  rationale: >-
    This is a mismatch rather than a gap, because the model evidence exists and is
    informative - it simply does not reproduce the phenotype that defines the
    disease. Three things are established in mouse: germline Thap1 deletion is
    embryonic lethal; the heterozygote is rescued by autoregulatory upregulation of
    the intact allele and has no phenotype; and conditional deletion in neural
    precursors produces locomotor deficits and a dystonia-related transcriptional
    signature but not dystonia.

    The mismatch is mechanistically meaningful in two ways. First, the
    autoregulatory rescue is a species difference in gene-dosage handling, which
    means mouse cannot be used to test a haploinsufficiency hypothesis for this
    gene at all. Second, and more consequentially, the step in this entry's
    pathograph from network dysfunction to dystonia is the step no model has
    closed unprovoked: the conditional mouse reaches the network node and stops.
    Human iPSC-derived striatal neurons reach the cellular node and cannot, being
    a dish, address circuit output.

    That framing needs qualifying, and the qualification is the interesting part.
    A peripheral nerve crush in the heterozygote does produce dystonia-like
    movements, exceeding both naive heterozygotes and injured wild-types. So the
    genotype is not phenotypically silent; it is latent. The unanswered question
    shifts from "why does the mouse never get it" to "what does the second hit
    supply". That reframes the human question too, since penetrance in carriers is
    only 40 to 60 per cent, and it is the reason this entry now records the
    gene-environment link on the heterozygous model rather than only the failure.

    What remains genuinely unclosed is whether the injury acts through this
    entry's chain at all. The multi-omic differences reported in nerve-injured
    heterozygotes are energy-metabolism signatures in cerebellum, striatum and
    cortex, which is not obviously the SP1-mediated transcriptional route this
    pathograph models. The final causal edge is therefore still marked inferred.
  proposed_experiments:
  - experiment_id: dyt6_reduced_dosage_without_autoregulation
    name: Knock-in of a patient THAP1 missense allele in a model without Thap1 autoregulation
    description: >-
      Test whether the absent phenotype is due to the autoregulatory rescue rather
      than to a deeper difference in motor circuitry, by using a model organism in
      which the compensating upregulation does not occur, or by engineering an
      allele that escapes autoregulation.
    would_support:
    - pathophysiology#Basal Ganglia and Cerebellar Motor Network Dysfunction
    supporting_outcome:
    - >-
      Dystonic posturing emerges in an animal carrying a reduced-dosage THAP1
      state that is not autoregulatorily rescued, closing the step from network
      dysfunction to dystonia.
    refuting_outcome:
    - >-
      A genuinely reduced-dosage animal still shows locomotor deficit without
      dystonia, which would argue that the human phenotype depends on features of
      primate motor circuitry rather than on THAP1 dosage alone.
  evidence:
  - reference: PMID:30590536
    reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although these mice do not exhibit dystonia, they show pronounced locomotor deficits reflecting derangements in the cerebellar and basal ganglia circuitry."
    explanation: >-
      The core statement of the mismatch: circuit derangement is reproduced, the
      defining clinical phenotype is not.
  - reference: PMID:30590536
    reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This is because mice show autoregulation of Thap1 mRNA levels with upregulation at the non-affected locus."
    explanation: >-
      Identifies the species difference that makes the heterozygous model
      uninformative, which is the first half of the mismatch.
- discussion_id: dyt6_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is there no genotype-phenotype correlation in THAP1 dystonia, and what
    determines penetrance?
  attaches_to:
  - genetic#THAP1
  - pathophysiology#Isolated Dystonia
  rationale: >-
    More than eighty variants are known across several functional classes -
    DNA-binding missense, protein-destabilising missense, HCFC1-binding-motif
    missense, and truncating alleles. Whether they predict phenotype is disputed
    rather than settled: the 2011 review of 56 families found no relationship,
    while a later screen of more than 1800 subjects found that truncating and
    THAP-domain missense variants manifest earlier and involve more body regions.
    Both are cited in the genetic section. Either way the molecular assays curated
    in this entry do not by themselves predict who becomes ill or how severely.

    Penetrance is incomplete at 40 to 60 per cent, so something other than the
    THAP1 allele decides whether a carrier develops dystonia. The environmental
    second hit is no longer purely speculative: a peripheral nerve crush unmasks
    dystonia-like movements in the heterozygous mouse, which is a demonstration in
    principle that a trigger can convert a silent genotype into a phenotype. It is
    not a human exposure, and no precipitant is established in carriers, so the
    practical counselling question stays open.
  evidence:
  - reference: PMID:21793105
    reference_title: "DYT6 dystonia: review of the literature and creation of the UMD Locus-Specific Database (LSDB) for mutations in the THAP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, 56 families present with a THAP1 mutation; however, no genotype/phenotype relationship has been found."
    explanation: >-
      States the absence of correlation across the published family set.
  - reference: PMID:32112337
    reference_title: "Unraveling Molecular Mechanisms of THAP1 Missense Mutations in DYT6 Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taking together, the current study showed different potential pathogenic mechanisms of THAP1 mutations which lead to the same consequence of DYT6 dystonia."
    explanation: >-
      Supports the convergence of mechanistically distinct variant classes on one
      clinical outcome, which is what makes the absence of correlation coherent
      rather than merely unexplained.


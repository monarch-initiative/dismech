      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The overall mutation frequency was 4.5% in this cohort with TOR1A mutations found in 2.7% and THAP1 mutations found in 1.8%."
      explanation: >-
        Source for the 1.8 percent THAP1 share and the 4.5 percent combined
        figure.
  notes: >-
    THAP1 is hgnc:20856. It is not THAP11, which is hgnc:23194 and causes an
    unrelated disorder; the two have been confused in at least one deep-research
    output, and the confusion is not caught by term validation because a CURIE and
    its label can agree while naming a gene the surrounding text does not (see
    dismech issue #10948). The binding here was read from the HGNC term cache.

    More than eighty pathogenic variants are known, about two thirds missense.
    Whether they correlate with phenotype is disputed: the 2011 LSDB review of 56
    families found no relationship, while a later screen of over 1800 subjects
    found that truncating and THAP-domain missense variants manifest earlier and
    involve more body regions. Both are cited below. This entry makes no
    variant-specific severity claim of its own, not because the question is
    settled in the negative but because it is open.
  evidence:
  - reference: PMID:21793105
    reference_title: "DYT6 dystonia: review of the literature and creation of the UMD Locus-Specific Database (LSDB) for mutations in the THAP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "THAP1 is the first transcriptional factor involved in primary dystonia and the hypothesis of a transcriptional deregulation, which was primarily proposed for the X-linked dystonia-parkinsonism (DYT3 dystonia), provided thus a new way to investigate the possible mechanism underlying the development of dystonic movements."
    explanation: >-
      Establishes THAP1's identity as a transcription factor and the significance
      of that for the mechanism.
  - reference: PMID:21793105
    reference_title: "DYT6 dystonia: review of the literature and creation of the UMD Locus-Specific Database (LSDB) for mutations in the THAP1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, 56 families present with a THAP1 mutation; however, no genotype/phenotype relationship has been found."
    explanation: >-
      States the absence of genotype-phenotype correlation recorded in the notes.
  - reference: PMID:22377579
    reference_title: "Genotype-phenotype correlations in THAP1 dystonia: molecular foundations and description of new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein truncating mutations and missense mutations within the THAP domain of THAP1 tend to manifest at an earlier age and exhibit more extensive anatomical distributions than mutations localized to other regions of THAP1."
    explanation: >-
      Reports a variant-class effect on onset age and anatomical spread across
      more than 1800 subjects, which supports the THAP1 gene-disease relationship
      this record asserts. That it disagrees with the 2011 review quoted above is
      a disagreement between two sources, recorded in this record's notes and in
      the dyt6_no_genotype_phenotype_correlation discussion rather than by
      grading this item against a sibling item.
  - reference: PMID:22377579
    reference_title: "Genotype-phenotype correlations in THAP1 dystonia: molecular foundations and description of new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mean age of onset for THAP1 dystonia is 16.8 years and the most common sites of onset are the arm and neck, and the most frequently affected anatomical site is the neck."
    explanation: >-
      Quantifies onset age and the commonest sites, which the entry previously
      described only qualitatively.
  - reference: PMID:39732371
    reference_title: "Peripheral nerve injury induces dystonia-like movements and dysregulation in the energy metabolism: A multi-omics descriptive study in Thap1(+/-) mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The incomplete penetrance of DYT-THAP1 dystonia, estimated at 40 to 60 %, suggests that an environmental trigger may be required for the manifestation of the disease in genetically predisposed individuals."
    explanation: >-
      Puts a number on the incomplete penetrance the entry relies on, and states
      the environmental-trigger hypothesis the knowledge gap below turns on.
      Graded MODEL_ORGANISM because evidence_source classifies the publication,
      and this one is a Thap1(+/-) mouse multi-omics study; its MeSH terms are
      Animals, Mice, Mice Knockout and Disease Models Animal. Marked INDIRECT
      because the quoted sentence is the paper's own background statement of a
      human figure rather than a result it measures. Citing the primary human
      penetrance source would be better and is not done here.
animal_models:
- name: Thap1 heterozygous knockout mouse
  species: Mouse
  genotype: Thap1 heterozygous null
  publication: PMID:30590536
  description: >-
    The genotype that should, in principle, model human THAP1 haploinsufficiency.
    Unprovoked, it does not: the mouse compensates by upregulating transcription
    from the intact allele and has no discernable phenotype. Given a second hit it
    does. After sciatic nerve crush, Thap1+/- mice show significantly more
    dystonia-like movements than naive Thap1+/- mice and than injured wild-type
    mice, so the genotype carries a real susceptibility that is invisible without
    a trigger. Both results are modelled below, as separate links, because they
    are claims about different nodes.
  modeled_mechanisms:
  - target: Reduced THAP1 Transcriptional Regulatory Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The model fails at the first node it is meant to reproduce: transcriptional
      autoregulation restores Thap1 message, so the haploinsufficient state the
      human disease depends on is not established.
    limitations: >-
      Thap1 mRNA is autoregulated in mouse, with upregulation at the non-affected
      locus, so heterozygous deletion does not produce a reduced-dosage state.
      Germline homozygous deletion cannot be used instead because it is embryonic
      lethal. The failure is a species difference in gene dosage compensation, not
      a limitation of the construct. This grading is about the molecular node only:
      the same animal does produce a dystonic phenotype after a peripheral nerve
      injury, which is recorded as a separate link below. Read together, the model
      is uninformative about steady-state THAP1 dosage and informative about
      gene-environment interaction.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Mouse compensates for the loss of one Thap1 allele by upregulating the
        remaining one. No comparable autoregulatory rescue is described in human
        carriers, who are symptomatic at the same genotype.
    evidence:
    - reference: PMID:30590536
      reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "While germ-line deletion of Thap1 is embryonic lethal, mice lacking one Thap1 allele-which in principle should recapitulate the haploinsufficiency of the human syndrome-do not show a discernable phenotype."
      explanation: >-
        The authors' own statement that the model does not reproduce the human
        haploinsufficient state.
    - reference: PMID:30590536
      reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is because mice show autoregulation of Thap1 mRNA levels with upregulation at the non-affected locus."
      explanation: >-
        Gives the mechanism of the failure, which is what makes this a species
        mismatch rather than an unexplained negative result.
  - target: Isolated Dystonia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      After a peripheral nerve crush, the heterozygote produces dystonia-like
      movements exceeding both naive heterozygotes and injured wild-type animals.
      The genotype supplies the predisposition and the injury supplies the
      trigger, which is a two-hit model of the incomplete penetrance seen in human
      carriers.
    limitations: >-
      The trigger is an experimental sciatic nerve crush, not an exposure reported
      in human DYT6, so the gene-environment interaction is demonstrated in
      principle rather than as the human mechanism. The readout is an automated
      movement classification rather than a clinical dystonia diagnosis, and the
      multi-omic differences reported alongside it are descriptive and not shown
      to be causal.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        A peripheral nerve injury is not a recognised precipitant of human THAP1
        dystonia. The claim this link supports is that a second hit can unmask the
        genotype, not that this particular second hit is the human one.
    evidence:
    - reference: PMID:39732371
      reference_title: "Peripheral nerve injury induces dystonia-like movements and dysregulation in the energy metabolism: A multi-omics descriptive study in Thap1(+/-) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Phenotypic analysis using an unbiased deep learning algorithm revealed that nerve-injured Thap1+/- mice exhibited significantly more dystonia like movements (DLM) over the course of the 12-week experiment compared to naive Thap1+/- mice."
      explanation: >-
        The genotype-dependent effect of the second hit, which is what licenses
        PARTIALLY_RECAPITULATES against the dystonia node.
    - reference: PMID:39732371
      reference_title: "Peripheral nerve injury induces dystonia-like movements and dysregulation in the energy metabolism: A multi-omics descriptive study in Thap1(+/-) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, at week 11 after nerve crush, nerve-injured Thap1+/- mice displayed significantly more DLM than nerve-injured wt counterparts."
      explanation: >-
        Separates the genotype effect from the effect of injury alone, which is
        the comparison that makes this a gene-environment result rather than a
        nerve-injury result.
  evidence:
  - reference: PMID:30590536
    reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking one Thap1 allele-which in principle should recapitulate the haploinsufficiency of the human syndrome-do not show a discernable phenotype"
    explanation: >-
      Attests that this model is not informative for the human disease at the
      genotype that matches it.
- name: Nestin-conditional Thap1 knockout mouse
  species: Mouse
  genotype: Thap1 conditional deletion in nestin-expressing glial and neuronal precursors
  publication: PMID:30590536
  description: >-
    Deletion of Thap1 in neural precursors, used to get past the embryonic
    lethality of germline deletion and the autoregulatory rescue in heterozygotes.
    It produces locomotor deficits and transcriptional changes overlapping other
    dystonic syndromes, but still no dystonia.
  modeled_mechanisms:
  - target: Basal Ganglia and Cerebellar Motor Network Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces circuit-level derangement in the cerebellar and basal ganglia
      pathways, and the transcriptional signature, without reproducing the
      disease's defining motor phenotype.
    limitations: >-
      The model does not develop dystonia. Deletion is in neural precursors rather
      than a heterozygous point variant, so the genetic lesion is more severe and
      earlier than the human one, and the readout is locomotor deficit rather than
      dystonic posturing.
    divergences:
    - divergence_type: OTHER
      materiality: QUALIFYING
      description: >-
        The model reaches the circuit node but not the clinical endpoint:
        locomotor deficits are observed, while sustained involuntary muscle
        contraction producing abnormal posture, which is what defines dystonia,
        is not. Typed OTHER because ModelDivergenceTypeEnum has no value for a
        model that reproduces the mechanism but not the phenotype; the nearest
        candidate discussed in CLAUDE.md, INCOMPLETE_PHENOTYPE, is named there as
        a likely future addition and is not currently a permissible value.
    evidence:
    - reference: PMID:30590536
      reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although these mice do not exhibit dystonia, they show pronounced locomotor deficits reflecting derangements in the cerebellar and basal ganglia circuitry."
      explanation: >-
        States both the circuit finding this link records and the phenotypic
        limitation that caps its fidelity.
  evidence:
  - reference: PMID:30590536
    reference_title: "Loss of the dystonia gene Thap1 leads to transcriptional deficits that converge on common pathogenic pathways in dystonic syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These behavioral features are associated with alterations in the expression of genes involved in nervous system development, synaptic transmission, cytoskeleton, gliosis and dopamine signaling that link DYT6 to other primary and secondary dystonic syndromes."
    explanation: >-
      Supports treating the model as informative for the transcriptional and
      circuit nodes, through the pathway overlap with other dystonic syndromes.
experimental_models:
- name: Patient-derived iPSC striatal medium spiny neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:34095114
  description: >-
    Medium spiny neurons differentiated from induced pluripotent stem cells of two
    THAP1 patients and one reduced-penetrance family member, compared with healthy
    controls. This is the human model that succeeds where the mouse fails, because
    it carries the patient genotype in human cells.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:

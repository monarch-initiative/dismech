name: Torsion Dystonia 6
creation_date: "2026-09-12T13:20:00Z"
category: Mendelian
synonyms:
- DYT6
- DYT6 dystonia
- DYT-THAP1
- THAP1 dystonia
- dystonia 6, torsion
- primary torsion dystonia, mixed type
description: >-
  An autosomal dominant isolated dystonia with markedly reduced penetrance,
  caused by heterozygous variants in THAP1. It was the first dystonia attributed
  to a transcription factor, and that is still the defining fact about its
  mechanism: THAP1 is a THAP-domain zinc-finger DNA-binding protein, so the
  primary lesion is a failure of gene regulation rather than of a channel, an
  enzyme, or a structural protein.

  The chain that follows is unusually well characterised at its molecular end and
  unusually poorly closed at its clinical end, and this entry is built to show
  that asymmetry rather than to paper over it. Reduced THAP1 DNA binding and
  disrupted cofactor recruitment lead to broad transcriptional dysregulation,
  executed substantially through the SP1 and SP4 transcription factors and in a
  cell-type-dependent way. Downstream of that, patient-derived striatal medium
  spiny neurons show reduced GABA-A receptor alpha2 expression and decreased
  GABAergic transmission, which is a concrete cellular defect measured in human
  cells. What is not established is the step from there to dystonic movement:
  the basal ganglia and cerebellar network dysfunction that is presumed to
  intervene is supported by imaging and by rodent circuit findings, not by a
  demonstrated causal path in humans.

  Two features make this entry worth reading carefully.

  First, the mouse does not get the disease. Germline Thap1 deletion is embryonic
  lethal, and the heterozygote - the genotype that should model human
  haploinsufficiency - has no discernable phenotype, because the mouse
  upregulates the remaining allele. Conditional nervous-system deletion produces
  locomotor deficits but still no dystonia. That is recorded structurally, as a
  FAILS_TO_RECAPITULATE model link and a HUMAN_MODEL_MISMATCH discussion, rather
  than as a caveat in prose.

  Second, whether a genotype-phenotype correlation exists is contested, and this
  entry records the disagreement rather than picking a side. A 2011 systematic
  review of 56 published THAP1 families reports no such relationship. A later
  screen of more than 1800 subjects reports the opposite: truncating variants and
  missense variants inside the THAP domain manifest earlier and spread further
  than variants elsewhere in the gene. The larger and later study is not
  obviously wrong, so the entry states both and makes no variant-specific severity
  claim of its own.

  Relationship to the existing Cervical_Dystonia entry: that entry covers common
  adult-onset sporadic focal cervical dystonia, deliberately binds no causal gene,
  and types THAP1 as SUSCEPTIBILITY because these genes explain a small minority
  of unselected cases. This entry is the Mendelian entity itself - one gene,
  dominant transmission, characteristic early-onset craniocervical and laryngeal
  involvement with limb spread. They are different diseases that share a
  phenotypic region.

  No pathophysiology node declares conforms_to. kb/modules/ was searched and no
  module covers transcription-factor haploinsufficiency or basal ganglia motor
  network imbalance.

- name: General Sneeze Execution Circuit
  mechanism_confidence: PROVISIONAL
  description: >-
    In experimental studies of the general sneeze reflex, neuromedin B signaling
    from nasal sensory neurons activates NMB-receptor-expressing neurons in a
    brainstem sneeze-evoking region, which project to the caudal ventral
    respiratory group. Recruitment of this circuit by photic stimulation has
    not been directly tested.
  cell_types:
  - preferred_term: Sensory Neuron
    term:
      id: CL:0000101
      label: sensory neuron
  locations:
  - preferred_term: Medulla Oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  evidence:
  - reference: PMID:34133943
    reference_title: "Sneezing reflex is mediated by a peptidergic pathway from nose to brainstem."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "neuromedin B (NMB) peptide is essential for signaling sneezing. Ablation of NMB-sensitive postsynaptic neurons in the sneeze-evoking region or deficiency in NMB receptor abolished the sneezing reflex."
    explanation: Model-organism experiments delineate a general sneeze circuit, but not a photic-sneeze-specific pathway.
  downstream:
  - target: Light-Triggered Sneezing
    description: Activation of the final sneeze-execution pathway produces the sneeze motor response; photic recruitment is inferred rather than directly tested.
    hypothesis_groups:
    - cortical_sensory_hyperexcitability
    - optic_trigeminal_summation
    - parasympathetic_generalization
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:34133943
      reference_title: "Sneezing reflex is mediated by a peptidergic pathway from nose to brainstem."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Chemical activation of NMB-sensitive neurons elicits action potentials in cVRG neurons and leads to sneezing behavior."
      explanation: Circuit activation caused general sneezing in the model, but recruitment of this circuit in human PSR remains untested.

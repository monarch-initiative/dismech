name: Achoo Syndrome
creation_date: '2025-12-12T23:26:49Z'
description: >-
  Achoo syndrome, more commonly called the photic sneeze reflex, is a benign
  trait in which sudden exposure to bright light provokes involuntary sneezing.
  Autosomal-dominant-like segregation has been reported in selected kindreds,
  while population genome-wide association studies support a complex,
  polygenic architecture and no single causal gene is established. Human EEG
  data show enhanced visual-cortical excitability and co-activation of
  somatosensory regions in photic sneezers, while optic-trigeminal and
  parasympathetic mechanisms remain plausible but unvalidated alternatives.
category: Genetic
parents:
- Reflex Disorder
disease_term:
  preferred_term: Achoo syndrome
  term:
    id: MONDO:0007038
    label: Achoo syndrome
synonyms:
- Photic Sneeze Reflex
- Autosomal Dominant Compelling Helioophthalmic Outburst Syndrome
- Sun Sneezing
- Photic Sneeze Syndrome
prevalence:
- population: Chinese GWAS cohort
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 25600.0
  notes: >-
    Self-reported prevalence among 3,417 Chinese participants; this cohort
    estimate should not be generalized to all populations.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a Chinese population of 3417 individuals (PSR prevalence at 25.6%)"
    explanation: The Chinese GWAS cohort reported a self-identified PSR prevalence of 25.6%.
- population: Japanese web-based questionnaire cohort
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3100.0
  notes: >-
    Self-reported prevalence among 11,840 participants recruited through an
    online health-data project. The authors cautioned that the questionnaire
    may have under-identified photic sneeze syndrome.
  evidence:
  - reference: PMID:31287245
    reference_title: "Possible association between photic sneeze syndrome and migraine and psychological distress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prevalence of PSS was 3.1%."
    explanation: The Japanese web-based questionnaire cohort reported a PSS prevalence of 3.1%.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Population PSR is a complex trait influenced by multiple common variants.
    High-penetrance autosomal-dominant-like segregation has also been reported
    in selected families, but no single causal gene has been established and
    those kindreds do not establish a Mendelian model for PSR in the population.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with previous GWAS in other populations, the result substantiated the polygenic and non-ethnicity-specific nature behind the PSR phenotype."
    explanation: Multiple independent GWAS loci support polygenic rather than single-gene inheritance.
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, that pedigree study was of limited sample size (only one family) so the underlying mode of inheritance for PSR likely remained inconclusive."
    explanation: This qualifies one early autosomal-dominant pedigree report as based on limited evidence.
  - reference: PMID:16007510
    reference_title: "[Autosomal dominant compelling helio-ophthalmic outburst syndrome (photic sneeze reflex). Clinical study of six Spanish families]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All the six families showed a high-penetrance, autosomal dominant inheritance."
    explanation: Six selected Spanish families showed dominant-like segregation, supporting familial heterogeneity without identifying a causal gene.
  - reference: PMID:3988295
    reference_title: "Sneezing on exposure to bright light as an inherited response."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Sneezing in response to bright light has been found in 25% of a sample of the British population, and pedigrees are compatible with an autosomal dominant mode of inheritance."
    explanation: British pedigrees were compatible with dominant inheritance, but compatibility does not establish a single-gene cause.
mechanistic_hypotheses:
- hypothesis_group_id: cortical_sensory_hyperexcitability
  hypothesis_label: Cortical Sensory Hyperexcitability Model
  status: EMERGING
  description: >-
    Enhanced responsiveness of visual cortex and co-activation of insular and
    secondary somatosensory regions may contribute to nasal prickling and photic
    sneezing. Human EEG supports cortical involvement, but the pathway from
    these cortical responses to sneeze execution has not been established.
  evidence:
  - reference: PMID:20169159
    reference_title: "When the sun prickles your nose: an EEG study identifying neural bases of photic sneezing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a generally enhanced excitability of the visual cortex (mainly in the cuneus) to visual stimuli in 'photic sneezers' compared with control subjects"
    explanation: Human EEG directly demonstrated enhanced visual-cortical responses in photic sneezers.
- hypothesis_group_id: optic_trigeminal_summation
  hypothesis_label: Optic-Trigeminal Summation Model
  status: ALTERNATIVE
  description: >-
    Bright-light activity in optic pathways is proposed to cross-activate
    trigeminal pathways at a central convergence site, producing nasal sensation
    and triggering sneezing. This is a longstanding hypothesis without
    conclusive anatomical or functional validation.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Several theories, including optic-trigeminal summation, parasympathetic hypersensitivity, and parasympathetic generalization, have been proposed, but none have been conclusively validated."
    explanation: The review identifies optic-trigeminal summation as proposed but unvalidated.
- hypothesis_group_id: parasympathetic_generalization
  hypothesis_label: Parasympathetic Generalization Model
  status: ALTERNATIVE
  description: >-
    A strong pupillary light response is proposed to spread among adjacent
    parasympathetic pathways, causing nasal secretion or tickling that initiates
    sneezing. Direct evidence for this pathway in PSR is lacking.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Several theories, including optic-trigeminal summation, parasympathetic hypersensitivity, and parasympathetic generalization, have been proposed, but none have been conclusively validated."
    explanation: The review identifies parasympathetic generalization as proposed but unvalidated.
pathophysiology:
- name: Abrupt Bright-Light Stimulation
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A sudden transition to bright light is the defining external stimulus. The
    intensity, spectrum, duration, timing, and spatial configuration sufficient
    to elicit PSR have not been established parametrically.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The reviewed studies, including four case reports and three laboratory experiments, consistently support that bright light can induce sneezing in susceptible individuals."
    explanation: A focused review found consistent evidence that bright light can elicit PSR.
  downstream:
  - target: Enhanced Visual and Somatosensory Cortical Responses
    description: Bright visual stimulation evokes larger visual-cortical responses in photic sneezers.
    hypothesis_groups:
    - cortical_sensory_hyperexcitability
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:20169159
      reference_title: "When the sun prickles your nose: an EEG study identifying neural bases of photic sneezing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we found a generally enhanced excitability of the visual cortex (mainly in the cuneus) to visual stimuli in 'photic sneezers' compared with control subjects"
      explanation: Human EEG links visual stimulation to enhanced cortical responses in photic sneezers.
  - target: Optic-Trigeminal Cross-Activation
    description: The optic-trigeminal model proposes that the visual signal cross-activates trigeminal pathways.
    hypothesis_groups:
    - optic_trigeminal_summation
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:39893297
      reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
      supports: NO_EVIDENCE
      evidence_source: OTHER
      snippet: "there is no solid anatomical or functional evidence base that would arbitrate between these distinct neuroanatomical theories."
      explanation: The proposed light-to-trigeminal link lacks direct anatomical or functional validation.
  - target: Parasympathetic Generalization
    description: The parasympathetic model proposes spread from the pupillary response into nasal autonomic pathways.
    hypothesis_groups:
    - parasympathetic_generalization
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:39893297
      reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
      supports: NO_EVIDENCE
      evidence_source: OTHER
      snippet: "there is no solid anatomical or functional evidence base that would arbitrate between these distinct neuroanatomical theories."
      explanation: The proposed spread among parasympathetic branches lacks direct validation.

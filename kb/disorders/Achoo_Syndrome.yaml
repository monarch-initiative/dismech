variants:
- name: rs10427255
  description: >-
    Intergenic 2q22.3 susceptibility locus replicated across populations. In the
    Chinese GWAS, each copy of the minor allele was associated with higher odds
    of PSR (OR 1.68, 95% CI 1.50-1.88); the variant was not shown to be causal.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reproducibly identified both a replicative rs10427255 on 2q22.3 and a novel locus of rs1032507 on 3p12.1 in various effect models (additive, as well as dominant and recessive)."
    explanation: The GWAS places rs10427255 at 2q22.3 and describes its replication.
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With assumption of the additive effect model, rs10427255 had an odds ratio (OR) of 1.68 so each copy of minor allele (T) conferred a multiplicative 68% higher odds for PSR; in comparison, rs1032507 had an OR of 0.65 so each copy of minor allele (A) conferred a multiplicative 35% lower odds for PSR"
    explanation: The GWAS quantifies rs10427255 as a common risk-associated locus.
- name: rs1032507
  description: >-
    Intergenic protective-associated locus at 3p12.1 identified in the Chinese
    GWAS. Each copy of the minor allele was associated with lower odds of PSR
    (OR 0.65, 95% CI 0.58-0.72); the variant was not shown to be causal.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reproducibly identified both a replicative rs10427255 on 2q22.3 and a novel locus of rs1032507 on 3p12.1 in various effect models (additive, as well as dominant and recessive)."
    explanation: The GWAS places the novel rs1032507 locus at 3p12.1.
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With assumption of the additive effect model, rs10427255 had an odds ratio (OR) of 1.68 so each copy of minor allele (T) conferred a multiplicative 68% higher odds for PSR; in comparison, rs1032507 had an OR of 0.65 so each copy of minor allele (A) conferred a multiplicative 35% lower odds for PSR"
    explanation: The GWAS quantifies rs1032507 as a common protective-associated locus.
environmental:
- name: Sudden Bright-Light Exposure
  description: >-
    A transition from darkness or dim light to bright light, often sunlight, is
    the defining trigger. Current evidence does not identify a specific
    wavelength or a validated stimulus threshold.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The reviewed studies, including four case reports and three laboratory experiments, consistently support that bright light can induce sneezing in susceptible individuals."
    explanation: Human reports and laboratory studies consistently identify bright light as the trigger.
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "No study has yet examined the parametric relationship between light parameters and the PSR."
    explanation: The trigger is established, but its quantitative stimulus-response relationship is not.
diagnosis:
- name: Clinical history or self-report
  description: >-
    Recognition is generally based on a reproducible personal history of
    sneezing after sudden bright-light exposure. No standardized provocation
    protocol has been validated.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Efforts to test or reproduce the reflex response in clinical setting by exposing individuals to bright light were unreliable, so in the absence of a standardized testing method, PSR was likely best diagnosed by directly questioning the individuals and identifying the affected ones by their self-reporting."
    explanation: The paper supports history/self-report and documents the lack of a standardized provocation test.
differential_diagnoses:
- name: Allergic rhinitis
  description: >-
    Allergic rhinitis is the commonest cause of recurrent paroxysmal sneezing and
    is the principal condition to exclude when sneezing attacks are reported. The
    overlap with PSR is limited to the sneeze itself: allergic sneezing follows
    IgE-mediated mast-cell mediator release after allergen re-exposure and is
    accompanied by nasal itch, watery rhinorrhoea, and congestion, whereas PSR is
    a brief burst locked to an abrupt light transition with no nasal inflammation.
    The two can coexist, and coexistence does not reclassify the photic trigger.
  disease_term:
    preferred_term: Allergic rhinitis
    term:
      id: MONDO:0011786
      label: allergic rhinitis
  distinguishing_features:
  - Trigger is allergen exposure (pollen, house dust mite, animal dander) rather than an abrupt light transition
  - Sneezing occurs together with nasal itching, watery discharge, and congestion rather than as an isolated short burst
  - Allergen-specific IgE or skin-prick sensitization can be demonstrated; PSR has no confirmatory test
  - Symptoms are sustained or seasonal rather than lasting seconds after a change in illumination
  evidence:
  - reference: PMID:27434218
    reference_title: "Pathogenesis of rhinitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Allergic rhinitis affects approximately one in four of the population of westernized countries and is characterized by typical symptoms of nasal itching, sneezing, watery discharge and congestion."
    explanation: The review establishes sneezing as a cardinal allergic-rhinitis symptom occurring alongside itch, discharge, and congestion, which is the pattern that separates it from an isolated photic sneeze.
  - reference: PMID:27434218
    reference_title: "Pathogenesis of rhinitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "On re-exposure to relevant allergens, cross-linking of IgE on mast cells results in the release of mediators of hypersensitivity such as histamine and immediate nasal symptoms."
    explanation: The IgE/mast-cell mechanism is distinct from any mechanism proposed for PSR, supporting separation on mechanistic as well as clinical grounds.
  notes: >-
    Ontology caveat, stated here because this entry is the other half of the
    problem: MONDO asserts the idiopathic (vasomotor) non-allergic rhinitis
    differential below (`MONDO:0006004`) to be a *subclass of* this
    entry's `MONDO:0011786`. A consumer reasoning over the subclass hierarchy will
    therefore collapse the two differentials into one, despite the prose
    separating them on exactly the allergic/non-allergic axis. See the fuller
    caveat on that entry; the defect is upstream in MONDO, not a claim of either
    entry here.
- name: Idiopathic (vasomotor) non-allergic rhinitis
  description: >-
    Non-allergic rhinitis produces sneezing and rhinorrhoea in response to
    non-immunological environmental triggers such as temperature change, strong
    odours, tobacco smoke, and air pollution, without demonstrable IgE
    sensitization. It is the closest phenocopy of PSR among the rhinitides because
    both are non-inflammatory and both are provoked by an abrupt environmental
    change; the discriminator is that the provoking change is thermal, chemical,
    or olfactory rather than photic, and that symptoms persist beyond the moment
    of exposure.
  disease_term:
    preferred_term: Vasomotor rhinitis
    term:
      id: MONDO:0006004
      label: vasomotor rhinitis
  distinguishing_features:
  - Triggered by temperature fluctuation, strong odours, tobacco smoke, or air pollution rather than by bright light
  - Chronic nasal congestion and rhinorrhoea accompany the sneezing; PSR is a self-limited sneeze burst
  - Allergy testing is negative, as it also is in PSR, so a negative test does not distinguish the two
  evidence:
  - reference: PMID:27434218
    reference_title: "Pathogenesis of rhinitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rhinitis is a heterogeneous condition that has been associated with inflammatory responses as in allergic rhinitis but can also occur in the absence of inflammation such as in so-called idiopathic (previously 'vasomotor') rhinitis."
    explanation: The review distinguishes a non-inflammatory idiopathic/vasomotor rhinitis from allergic rhinitis, which is the entity that most closely phenocopies a non-inflammatory trigger-locked sneeze.
  notes: >-
    Because neither PSR nor idiopathic rhinitis has a confirmatory laboratory
    test, the separation rests on trigger specificity elicited by history.
    Ontology caveat: MONDO asserts `is_a: MONDO:0011786` (allergic rhinitis) for
    `MONDO:0006004`, placing this non-allergic entity under allergic rhinitis and
    inheriting hypersensitivity-reaction and allergic-respiratory-disease
    ancestry. This contradicts the very distinction the entry exists to draw, and
    a consumer reasoning over the subclass hierarchy would collapse this
    differential into the allergic rhinitis differential above it. It also
    contradicts MONDO's own logical definition of the term, whose
    `intersection_of` is rhinitis + regulation of vasoconstriction with no
    allergic component, and its NCIT-derived `def:` makes no mention of IgE. The
    term is nonetheless retained because it is the correct entity and the best
    available: the alternative is the undifferentiated `MONDO:0003014` parent.
    Treat the asserted parentage as an upstream defect to be reported to MONDO,
    not as a curation claim of this entry.
- name: Gustatory rhinitis
  description: >-
    Gustatory rhinitis is a non-allergic rhinitis in which food ingestion provokes
    rhinorrhoea and sneezing. It sits between the rhinitides and the
    trigger-defined sneeze reflexes and is the nearest neighbour of snatiation:
    both are meal-associated, but gustatory rhinitis is driven by a property of
    the food rather than by gastric distension, and it produces prominent
    rhinorrhoea rather than an isolated sneeze burst. Hot and spicy foods are the
    classic and most frequently identified triggers, but the source study
    concluded that almost any food can be implicated, so an atypical food history
    does not exclude it. It appears to be common, so its co-occurrence with PSR is
    better treated as expected than as diagnostically meaningful.
  distinguishing_features:
  - Trigger is food ingestion - classically hot or spicy, most often chili peppers, though a wide range of foods is implicated - not a light transition
  - Rhinorrhoea is the dominant symptom rather than a short sneeze burst
  - Occurs during or shortly after eating, so it is separable from PSR on timing alone
  - Distinguished from snatiation by being driven by food properties rather than by stomach fullness
  evidence:
  - reference: PMID:18426138
    reference_title: "Prevalence and food avoidance behaviors for gustatory rhinitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gustatory rhinitis is a type of nonallergic rhinitis that is usually associated with ingestion of hot or spicy foods."
    explanation: The survey study defines gustatory rhinitis as a food-triggered non-allergic rhinitis, separating it from the photic trigger.
  - reference: PMID:18426138
    reference_title: "Prevalence and food avoidance behaviors for gustatory rhinitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 571 participants who completed the survey, 396 (69%) indicated at least 1 food resulted in gustatory rhinitis symptoms."
    explanation: >-
      The high reported frequency supports treating co-occurrence with PSR as
      expected rather than diagnostically informative. The figure is self-reported
      from a dermatology outpatient sample, not a general-population prevalence,
      and the same study found allergic-rhinitis patients significantly more likely
      to report symptoms, so it establishes that gustatory rhinitis is common in
      clinic populations rather than pinning a population rate.
  - reference: PMID:18426138
    reference_title: "Prevalence and food avoidance behaviors for gustatory rhinitis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The results presented herein suggest that almost all foods can be implicated, both children and adults develop this condition"
    explanation: Tempers the hot/spicy framing - an atypical food history does not exclude gustatory rhinitis, so the trigger discriminator against PSR is the meal association rather than the specific food.
  notes: >-
    No `disease_term` is attached because MONDO has no gustatory rhinitis term
    (checked with OAK against `sqlite:obo:mondo`). The available neighbours are
    unsuitable rather than merely imprecise: `MONDO:0003014` rhinitis is the shared
    parent of several entries here and so discriminates nothing, and
    `MONDO:0006004` vasomotor rhinitis names a different type of non-allergic
    rhinitis already used for a separate differential in this block, so attaching
    it would conflate two distinct entities (note that MONDO asserts that term
    *under* allergic rhinitis rather than as a non-allergic sibling - see the
    misclassification recorded on that entry). Following the same convention as the
    snatiation entry, no term is preferable to a wrong one; this is a second
    MONDO new-term-request candidate.
- name: Snatiation (stomach-fullness sneeze reflex)
  description: >-
    Snatiation is an involuntary sneeze burst provoked by gastric distension after
    a large meal. It is the closest nosological relative of PSR: both are benign,
    familial, trigger-specific sneeze reflexes reported to segregate in a
    dominant-like fashion in selected kindreds, and both are diagnosed purely on
    the reproducible trigger. The distinction is the eliciting stimulus, and the
    two traits can be reported in the same individual.
  distinguishing_features:
  - Trigger is a particularly full stomach after eating, not sudden bright light
  - Sneezing follows meals rather than light transitions, so a food diary or meal-linked history separates the two
  - No visual or ocular component and no relationship to illumination
  evidence:
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sneezing can further be triggered through sudden exposure to bright light, a particularly full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom of psychogenic pathologies."
    explanation: The review enumerates a full stomach as a sneeze trigger distinct from bright light, establishing snatiation as a separate trigger-defined reflex.
  notes: >-
    The trait was described as an autosomal dominant sneezing disorder provoked by
    fullness of the stomach (PMID:2769729) and later given the backronym SNATIATION
    (PMID:2325110); both are brief letters without abstracts, so no snippet-verified
    quote is available and the claim is carried here by the review citation.
    No `disease_term` is attached because MONDO has no current term for this trait:
    the only candidate, MONDO:0007645 "gastric sneezing" (xref OMIM:137130), is
    obsoleted, and per convention no term is preferable to a wrong or deprecated
    one. This is a candidate for a MONDO new-term request.
- name: Sneezing induced by sexual ideation or orgasm
  description: >-
    Sneezing provoked by sexual ideation or by orgasm is another benign
    trigger-specific sneeze reflex. It is a relevant differential because the
    parasympathetic mechanism proposed for it is the same class of mechanism
    proposed (and still unvalidated) for PSR, so the two are separated by the
    eliciting stimulus rather than by any demonstrated pathophysiological
    difference.
  distinguishing_features:
  - Trigger is sexual ideation or orgasm, not an abrupt light transition
  - Reported as under-recognized and rarely volunteered, so it is missed unless the trigger is asked about directly
  evidence:
  - reference: PMID:19092028
    reference_title: "Sneezing induced by sexual ideation or orgasm: an under-reported phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a hitherto under-recognized curious response in some individuals: of sneezing in response either to sexual ideation or in response to orgasm."
    explanation: The report establishes sexual ideation and orgasm as sneeze triggers separate from bright light.
  - reference: PMID:19092028
    reference_title: "Sneezing induced by sexual ideation or orgasm: an under-reported phenomenon."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We surmise that an indiscrete stimulation of the parasympathetic nervous system may be an underlying mechanism to explain this and other reported unusual triggers of sneezing."
    explanation: The proposed parasympathetic mechanism parallels the parasympathetic generalization hypothesis modeled for PSR, which is why the differential rests on trigger rather than mechanism.
- name: Trigeminal irritant-induced sneezing
  description: >-
    Direct mechanical or chemical stimulation of the nasal mucosa (nasal hair
    plucking, pepper and other irritants, cold dry air, intranasal instrumentation)
    activates the trigeminal afferents of the ordinary sneeze reflex. This is the
    physiological reflex that PSR is presumed to borrow downstream, so the two
    share the final sneeze-execution circuit and differ only in the afferent
    stimulus. It should be excluded before a light transition is accepted as the
    trigger, because bright-light exposure often coincides with going outdoors,
    where cold air and airborne irritants are simultaneously encountered.
  distinguishing_features:
  - A direct nasal stimulus is identifiable (irritant, instrumentation, cold dry air) at the time of sneezing
  - Reproducible with the nasal stimulus in the absence of any change in illumination
  - Occurs in essentially everyone, whereas PSR is present in a susceptible minority
  evidence:
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A sneeze (or sternutation) is expulsion of air from the lungs through the nose and mouth, most commonly caused by the irritation of the nasal mucosa."
    explanation: The review identifies nasal-mucosal irritation as the ordinary cause of sneezing, which is the baseline reflex a photic trigger must be distinguished from.
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sneezing can further be triggered through sudden exposure to bright light, a particularly full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom of psychogenic pathologies."
    explanation: The review lists physical trigeminal stimulation separately from bright light, supporting their separation as distinct sneeze triggers.
- name: Psychogenic (intractable) sneezing
  description: >-
    Psychogenic sneezing presents as persistent, often paroxysmal and unremitting
    sneezing, characteristically in adolescents, that is not locked to any external
    physical trigger and typically abates during sleep. It matters as a differential
    because a sufferer may attribute the attacks to whatever was happening at onset,
    including going out into sunlight, and because it is a diagnosis of exclusion
    that should not be reached until organic causes have been ruled out.
  distinguishing_features:
  - Sneezing is intractable and continuous rather than a short burst locked to an abrupt light transition
  - No reproducible physical trigger, and attacks typically remit during sleep
  - A precipitating psychosocial event may be identifiable on psychiatric assessment
  - Diagnosis of exclusion; organic lesions and other causes must be excluded first
  evidence:
  - reference: PMID:21853666
    reference_title: "Intractable sneezing: is it always psychogenic?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An overwhelming number of such patients may be linked to a psychogenic cause; nevertheless, organic lesions or causes should be carefully excluded."
    explanation: The case report establishes psychogenic sneezing as a common but exclusion-based diagnosis in intractable sneezing.
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sneezing can further be triggered through sudden exposure to bright light, a particularly full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom of psychogenic pathologies."
    explanation: The review lists psychogenic pathology as a recognized cause of sneezing distinct from photic triggering.
- name: Sneezing secondary to lateral medullary syndrome
  description: >-
    Lateral medullary (posterior inferior cerebellar artery) syndrome is a
    brainstem infarct involving the medulla, where the sneeze-execution circuitry
    resides, and sneezing has been described as a manifestation of it. Together
    with epilepsy it forms the only non-benign arm of this differential, and it is
    the reason a new-onset sneezing pattern in an adult should not simply be
    labelled a photic sneeze reflex.
  disease_term:
    preferred_term: Lateral medullary syndrome
    term:
      id: MONDO:0006827
      label: lateral medullary syndrome
  distinguishing_features:
  - Abrupt new onset in adulthood rather than a lifelong trait, and without a family history
  - Accompanied by the lateral medullary deficit pattern - crossed sensory loss, dysphagia, dysarthria, vertigo, Horner syndrome
  - Not reproducibly locked to an abrupt bright-light transition
  - Confirmed by neuroimaging (MRI) rather than by trigger history alone
  evidence:
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sneezing can further be triggered through sudden exposure to bright light, a particularly full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom of psychogenic pathologies."
    explanation: The review names posterior inferior cerebellar artery syndrome as a central nervous system cause of sneezing, establishing this non-benign arm of the differential.
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Sneezing is a protective reflex, and is sometimes a sign of various medical conditions."
    explanation: The review frames sneezing as sometimes signalling underlying disease, supporting the need to exclude secondary causes before accepting a benign photic trait.
  notes: >-
    The medullary localization is what makes this differential mechanistically
    pointed: it lesions the same brainstem sneeze-execution circuit that the
    "General Sneeze Execution Circuit" pathophysiology node of this entry models
    as the shared final common pathway.
- name: Sneezing secondary to epilepsy
  description: >-
    Sneezing can occur as a paroxysmal manifestation of epilepsy, whether as an
    ictal automatism or peri-ictally. It shares with PSR the character of a
    stereotyped, involuntary, abruptly-onset paroxysm, which is precisely why it
    can be mistaken for a benign reflex; photosensitive epilepsy makes the overlap
    sharper still, since there the paroxysm is genuinely light-provoked.
  disease_term:
    preferred_term: Epilepsy
    term:
      id: MONDO:0005027
      label: epilepsy
  distinguishing_features:
  - Accompanied by other seizure semiology (impaired awareness, automatisms, post-ictal state) rather than occurring as an isolated sneeze
  - Onset timing does not discriminate - epilepsy commonly begins in childhood, so a lifelong history is not reassuring here the way it is against an adult-onset vascular cause
  - Requires EEG for diagnosis; PSR is diagnosed on trigger history alone
  - In photosensitive epilepsy the light trigger overlaps with PSR, so the discriminator is the accompanying seizure activity rather than the trigger
  evidence:
  - reference: PMID:19617285
    reference_title: "Sneeze reflex: facts and fiction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sneezing can further be triggered through sudden exposure to bright light, a particularly full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom of psychogenic pathologies."
    explanation: The review names epilepsy as a central nervous system cause of sneezing, establishing this non-benign arm of the differential.
  notes: >-
    Photosensitive epilepsy is the sub-case where the trigger-based logic used
    throughout this differential block breaks down, because both conditions are
    then light-provoked; the discriminator becomes the presence of seizure
    activity, not the stimulus.
discussions:
- discussion_id: gap_psr_light_to_sneeze_pathway
  prompt: Which neural pathway connects abrupt bright-light exposure to the sneeze-execution circuit in human PSR?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abrupt Bright-Light Stimulation
  rationale: >-
    Optic-trigeminal summation, parasympathetic hypersensitivity,
    parasympathetic generalization, and cortical sensory hyperexcitability have
    been proposed, but none supplies a validated end-to-end human pathway.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several theories, including optic-trigeminal summation, parasympathetic hypersensitivity, and parasympathetic generalization, have been proposed, but none have been conclusively validated."
    explanation: The focused review establishes that the central mechanism remains unresolved.
notes: |
  ACHOO is a historical backronym for "autosomal dominant compelling
  helioophthalmic outburst." Dominant-like segregation has been reported in
  selected kindreds, while population GWAS support polygenic architecture and
  no single causal gene is established. The trait is generally benign, although
  a sudden sneeze can be distracting during driving, aviation, or other tasks at
  abrupt light transitions. Filtering lenses should not be presented as an
  evidence-based treatment: the relevant stimulus parameters have not been
  established, and the literature does not support a standard therapy. The
  migraine association from PMID:31287245 is modeled as a structured
  comorbidity (see kb/comorbidities/com_Achoo_Syndrome__Migraine.yaml) rather
  than as a core phenotype or causal consequence; that entry also records the
  same study's psychological-distress finding.

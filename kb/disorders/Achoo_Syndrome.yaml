    explanation: The Japanese web-based questionnaire cohort reported a PSS prevalence of 3.1%.
inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Population PSR is a complex trait influenced by multiple common variants.
    High-penetrance autosomal-dominant-like segregation has also been reported
    in selected families, but no single causal gene has been established and
    those kindreds do not establish a Mendelian model for PSR in the population.
  evidence:
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with previous GWAS in other populations, the result substantiated the polygenic and non-ethnicity-specific nature behind the PSR phenotype."
    explanation: Multiple independent GWAS loci support polygenic rather than single-gene inheritance.
  - reference: PMID:30899065
    reference_title: "A genome-wide association study on photic sneeze reflex in the Chinese population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, that pedigree study was of limited sample size (only one family) so the underlying mode of inheritance for PSR likely remained inconclusive."
    explanation: This qualifies one early autosomal-dominant pedigree report as based on limited evidence.
  - reference: PMID:16007510
    reference_title: "[Autosomal dominant compelling helio-ophthalmic outburst syndrome (photic sneeze reflex). Clinical study of six Spanish families]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All the six families showed a high-penetrance, autosomal dominant inheritance."
    explanation: Six selected Spanish families showed dominant-like segregation, supporting familial heterogeneity without identifying a causal gene.
  - reference: PMID:3988295
    reference_title: "Sneezing on exposure to bright light as an inherited response."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Sneezing in response to bright light has been found in 25% of a sample of the British population, and pedigrees are compatible with an autosomal dominant mode of inheritance."
    explanation: British pedigrees were compatible with dominant inheritance, but compatibility does not establish a single-gene cause.
mechanistic_hypotheses:
- hypothesis_group_id: cortical_sensory_hyperexcitability
  hypothesis_label: Cortical Sensory Hyperexcitability Model
  status: EMERGING
  description: >-
    Enhanced responsiveness of visual cortex and co-activation of insular and
    secondary somatosensory regions may contribute to nasal prickling and photic
    sneezing. Human EEG supports cortical involvement, but the pathway from
    these cortical responses to sneeze execution has not been established.
  evidence:
  - reference: PMID:20169159
    reference_title: "When the sun prickles your nose: an EEG study identifying neural bases of photic sneezing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a generally enhanced excitability of the visual cortex (mainly in the cuneus) to visual stimuli in 'photic sneezers' compared with control subjects"
    explanation: Human EEG directly demonstrated enhanced visual-cortical responses in photic sneezers.
- hypothesis_group_id: optic_trigeminal_summation
  hypothesis_label: Optic-Trigeminal Summation Model
  status: ALTERNATIVE
  description: >-
    Bright-light activity in optic pathways is proposed to cross-activate
    trigeminal pathways at a central convergence site, producing nasal sensation
    and triggering sneezing. This is a longstanding hypothesis without
    conclusive anatomical or functional validation.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Several theories, including optic-trigeminal summation, parasympathetic hypersensitivity, and parasympathetic generalization, have been proposed, but none have been conclusively validated."
    explanation: The review identifies optic-trigeminal summation as proposed but unvalidated.
- hypothesis_group_id: parasympathetic_generalization
  hypothesis_label: Parasympathetic Generalization Model
  status: ALTERNATIVE
  description: >-
    A strong pupillary light response is proposed to spread among adjacent
    parasympathetic pathways, causing nasal secretion or tickling that initiates
    sneezing. Direct evidence for this pathway in PSR is lacking.
  evidence:
  - reference: PMID:39893297
    reference_title: "Stimulus conditions eliciting sneezing in response to bright light."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Several theories, including optic-trigeminal summation, parasympathetic hypersensitivity, and parasympathetic generalization, have been proposed, but none have been conclusively validated."
    explanation: The review identifies parasympathetic generalization as proposed but unvalidated.

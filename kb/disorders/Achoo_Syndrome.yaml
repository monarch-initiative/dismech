name: Achoo Syndrome
creation_date: '2025-12-12T23:26:49Z'
updated_date: '2026-03-21T22:57:41Z'
description: >-
  Achoo syndrome, more commonly called the photic sneeze reflex, is a benign
  trait in which sudden exposure to bright light provokes involuntary sneezing.
  Autosomal-dominant-like segregation has been reported in selected kindreds,
  while population genome-wide association studies support a complex,
  polygenic architecture and no single causal gene is established. Human EEG
  data show enhanced visual-cortical excitability and co-activation of
  somatosensory regions in photic sneezers, while optic-trigeminal and
  parasympathetic mechanisms remain plausible but unvalidated alternatives.
category: Genetic
parents:
- Reflex Disorder

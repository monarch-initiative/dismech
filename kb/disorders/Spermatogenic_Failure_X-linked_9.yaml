name: RBBP7-Related X-linked Spermatogenic Maturation Arrest
creation_date: "2026-10-30T03:30:00Z"
category: Mendelian
disease_term:
  preferred_term: spermatogenic failure, X-linked, 9
  term:
    id: MONDO:0976123
    label: spermatogenic failure, X-linked, 9
synonyms:
- spermatogenic failure, X-linked, 9
- SPGFX9
- RBBP7-related maturation arrest
description: >-
  RBBP7-related X-linked spermatogenic maturation arrest (spermatogenic
  failure, X-linked, 9; OMIM:301137) is a form of early maturation arrest, a
  histopathological subtype of non-obstructive azoospermia, caused by a
  hemizygous loss-of-function variant in X-linked RBBP7 (retinoblastoma-binding
  protein 7). RBBP7 is a WD40-repeat histone chaperone and core subunit of
  chromatin-modifier complexes such as CAF-1, binding histone H4 and the BRCT
  domain of BRCA1. A truncating RBBP7 variant identified in two brothers with
  early maturation arrest disrupted these interactions, was associated with
  reduced BRCA1 and increased DNA double-strand-break marker (gammaH2AX)
  staining in the testis, and co-occurred with a benign testicular Leydig cell
  tumor in the proband. Independently, a large X-chromosome exome screen of
  2,354 infertile men found RBBP7 to be the most frequently and significantly
  affected gene, and functional knockdown of the Drosophila ortholog Caf1-55
  showed that the gene is required for germline stem cell maintenance,
  supporting a causal role in human spermatogenic failure.
parents:
- hereditary disease
- male reproductive system disease
notes: >-
  No GeneReviews chapter covers this disorder; a PubMed search for "RBBP7"
  combined with "spermatogenic failure", "azoospermia", or "maturation arrest"
  (all fields, 2026-10-30) returned only the two primary sources cited here, no
  GeneReviews or StatPearls chapter. The causal RBBP7 truncating variant
  (c.1200dupA, p.W401Mfs*5) found in the founding family was absent from 103
  additional unrelated men with non-obstructive azoospermia screened by the
  same group and is distinct from the variants recurrently found in the
  independent 2,354-man cohort, so the allelic spectrum and overall prevalence
  of RBBP7-related disease remain unresolved. No external gene-disease validity
  classification (e.g., ClinGen) has been published for RBBP7 and male
  infertility as of this entry's creation. A deep-research pass
  (research/Spermatogenic_Failure_X-linked_9-deep-research-claude_code.md)
  surfaced Balboula et al. 2014 (PMID:24317350), which shows Rbbp7 knockdown in
  mouse oocytes causes chromosome missegregation and spindle-assembly-checkpoint
  failure via a histone-deacetylation route; it is not cited as pathophysiology
  evidence here because it is female-germline (oocyte meiosis) data and this
  entry's mechanism is specific to male germ cells.

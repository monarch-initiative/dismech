genetic:
- name: RBBP7
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RBBP7 (retinoblastoma-binding protein 7)
    term:
      id: hgnc:9890
      label: RBBP7
  notes: >-
    Identified by whole-exome sequencing of a two-brother family with early
    maturation arrest; independently and more recently confirmed as the most
    recurrently affected gene in a 2,354-man X-chromosome exome screen, with a
    significant case-control burden of pathogenic variants. No ClinGen or
    other external gene-disease validity classification has been published;
    this is a research-level, not yet externally adjudicated, gene-disease
    association.
  evidence:
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An identical hemizygous variant (NM_002893.4, c.1201ins1, p.W401M fs*4)
      was identified in the 2 brothers, occurring on chromosome Xp22.2 and
      affecting the last 2 exons of RBBP7.
    explanation: Exome sequencing identifies the causal hemizygous RBBP7 variant shared by both affected brothers.
  - reference: PMID:35809576
    reference_title: "Large-scale analyses of the X chromosome in 2,354 infertile men discover recurrently affected genes associated with spermatogenic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the burden test showed that pathogenic variants in RBBP7 were
      significantly more common in infertile men than in gnomAD control
      individuals (adjusted p value = 5.07E-6)
    explanation: Independent cohort-level statistical burden test supports RBBP7 as causally associated with spermatogenic failure.
  - reference: PMID:35809576
    reference_title: "Large-scale analyses of the X chromosome in 2,354 infertile men discover recurrently affected genes associated with spermatogenic failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently affected prioritized gene, RBBP7, was found mutated
      in ten men across all cohorts, and our functional studies in Drosophila
      support its role in germ stem cell maintenance.
    explanation: RBBP7 is the most recurrently mutated candidate gene across four independent infertility cohorts.
  variants:
  - name: c.1200dupA (p.W401Mfs*5), hemizygous
    description: >-
      A 1-bp insertion causing a frameshift and premature stop codon four
      amino acids later, truncating the last beta-propeller blade of the
      C-terminal WD40 domain. Hemizygous in both affected brothers; absent
      from population databases and from 103 additional unrelated men with
      non-obstructive azoospermia screened by restriction-fragment-length
      analysis. The source paper itself names this variant two ways:
      c.1201ins1/p.W401Mfs*4 in its main narrative and c.1200dupA/p.W401Mfs*5
      in its Sanger-sequencing figure legend; the latter (used as this
      variant's name) matches the stated downstream truncation site.
    evidence:
    - reference: PMID:37843278
      reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This leads to an earlier translation stop codon 4 amino acids from
        the insertion position at the last WD40 domain of the RBBP7 protein
        (p.W401Mfs*5) (Figure 2B).
      explanation: Describes the frameshift and truncation produced by the variant.
    - reference: PMID:37843278
      reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This RBBP7 mutation was not observed in those 103 unrelated patients with NOA."
      explanation: The variant is not a common cause of non-obstructive azoospermia in this replication panel, consistent with genetic heterogeneity of the disease.
pathophysiology:
- name: Hemizygous RBBP7 Loss-of-Function Variant
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    A hemizygous frameshift variant (c.1200dupA, p.W401Mfs*5) truncates the
    last beta-propeller blade of the RBBP7 WD40 domain. Independently, a
    population-level burden of rare pathogenic RBBP7 variants is found across
    cohorts of men with non-obstructive azoospermia.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    description: >-
      The truncating allele removes the C-terminal hydrophilic/charged
      alpha-helix of the WD40 beta-propeller, with reduced RBBP7 protein
      detected in patient testicular tissue.
  genes:
  - preferred_term: RBBP7
    term:
      id: hgnc:9890
      label: RBBP7
  molecular_functions:
  - preferred_term: histone binding
    term:
      id: GO:0042393
      label: histone binding
    modifier: DECREASED
  evidence:
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation resulted in premature protein translation termination,
      affecting the sixth WD40 domain of the RBBP7 and the interaction of the
      mutated RBBP7 with histone H4.
    explanation: States the structural consequence of the truncating variant on the RBBP7 WD40 domain.
  downstream:
  - target: Impaired RBBP7 Interaction with Histone H4 and BRCA1
    causal_link_type: DIRECT
    description: >-
      The truncated protein loses the C-terminal structural element required
      for its normal binding interfaces.
- name: Impaired RBBP7 Interaction with Histone H4 and BRCA1
  biological_scale: MOLECULAR
  description: >-
    Structural modeling shows the truncated RBBP7 loses hydrogen bonds with
    histone H4 and binds the BRCT domain of BRCA1 with reduced affinity, since
    both interactions use the same docking surface. In patient testis tissue,
    RBBP7 immunofluorescence signal is weak and no longer tightly colocalized
    with condensed histone H4.
  molecular_functions:
  - preferred_term: histone binding
    term:
      id: GO:0042393
      label: histone binding
    modifier: DECREASED
  evidence:
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The loss of the RBBP7 short hydrophilic/charged C-terminal alpha-helix,
      which sits on top of and extends the RBBP7 N-terminal alpha-helix,
      affects its interaction with the key residue Arg35 of histone H4
    explanation: In silico structural modeling shows the truncation disrupts the histone H4 binding interface.
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The result showed a decrease in the energy (-9.5 kcal/mol) of the BRCT
      domain of BRCA1 interacting with mutant RBBP7, compared with that with
      wild-type RBBP7, which shows the energy of -10.9 kcal/mol
    explanation: Docking simulation shows reduced binding energy between mutant RBBP7 and the BRCA1 BRCT domain.
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the sample of the proband, the signals of RBBP7 remained
      weak and associated with loosely distributed histone H4 signals
      (Figure 3J).
    explanation: Immunofluorescence in patient testis tissue confirms reduced RBBP7-histone H4 colocalization.
  downstream:
  - target: Reduced BRCA1-Mediated DNA Repair and Genomic Instability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Weakened RBBP7-BRCA1 docking is proposed to destabilize BRCA1 at sites
      of DNA damage.
- name: Reduced BRCA1-Mediated DNA Repair and Genomic Instability
  biological_scale: CELLULAR
  description: >-

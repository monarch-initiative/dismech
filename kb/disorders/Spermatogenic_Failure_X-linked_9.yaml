- name: Testicular Somatic Cell Hyperproliferation
  biological_scale: TISSUE
  description: >-
    In Drosophila, somatic cyst-cell-specific (rather than germline) knockdown
    of RBBP7/Caf1-55 causes hyperproliferative, tumor-like accumulation of
    cyst cells with elevated DNA double-strand breaks. Drosophila cyst cells
    are the somatic support-cell analog of mammalian Sertoli cells, not of
    Leydig cells, so this node records the somatic-hyperproliferation half of
    the proposed shared mechanism rather than a fly model of the human tumor
    itself; the human Leydig cell tumor finding is recorded on that phenotype.

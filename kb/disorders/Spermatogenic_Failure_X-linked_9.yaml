animal_models:
- name: Caf1-55 germline- and cyst-cell-specific knockdown Drosophila melanogaster
  species: Drosophila
  genotype: "nos-GAL4 or tj-GAL4 driven Caf1-55 RNAi (Caf1-55 IR1, Caf1-55 IR2); Caf1-55 null (Caf1-55-/-)"
  publication: PMID:37843278
  description: >-
    Caf1-55 is the Drosophila ortholog of RBBP7, 96% identical at the amino
    acid level. Germline-specific knockdown (nos-GAL4) depletes germ cells and
    severely shrinks the testis, whereas somatic cyst-cell-specific knockdown
    (tj-GAL4) causes hyperproliferative, tumor-like cyst cells instead.
    Ectopic wild-type human RBBP7 rescues the male infertility caused by
    Caf1-55 deficiency; mutant human RBBP7 does not.
  modeled_mechanisms:
  - target: Germ Cell Depletion and Spermatogenic Maturation Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Drosophila testis architecture and spermatogenesis differ substantially
      from mammalian testis; the germline-specific knockdown models
      cell-autonomous germ cell loss but not the human histological pattern of
      residual Sertoli cells with scattered spermatogonia.
    readouts:
    - name: Germ cell presence (Vasa/dBigH1 immunostaining) and testis size
      target: Germ Cell Depletion and Spermatogenic Maturation Arrest
      direction: DECREASED
      interpretation: Germline knockdown of Caf1-55 depletes germ cells and reduces testis size.
      evidence:
      - reference: PMID:37843278
        reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In Drosophila, knockdown of RBBP7/Caf1-55 in germ cells resulted in
          complete absence of germ cells and reduced testis size, whereas
          knockdown of RBBP7/Caf1-55 in cyst cells resulted in
          hyperproliferative testicular cells.
        explanation: Germline-specific knockdown reproduces germ cell loss and testis size reduction.
    evidence:
    - reference: PMID:37843278
      reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Interestingly, male infertility caused by Caf1-55 deficiency was
        rescued by ectopic expression of wild-type human RBBP7 but not mutant
        variants, suggesting the importance of RBBP7 in spermatogenesis.
      explanation: Genetic rescue with wild-type but not mutant human RBBP7 supports the model's relevance to the human variant's loss-of-function effect.
  - target: Testicular Somatic Cell Hyperproliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Fly cyst cells support germ cells somatically and are not
        homologous to mammalian Leydig cells, which are steroidogenic rather
        than supportive; the model shows that somatic loss of Caf1-55 causes
        hyperproliferation, not that the resulting cells are a true Leydig
        cell tumor analog.
    limitations: >-
      No fly equivalent of a discrete, hormonally active Leydig cell tumor
      exists; the model demonstrates somatic hyperproliferation from genomic
      instability, which is the proposed shared mechanism, not a Leydig cell
      tumor itself.
    readouts:
    - name: Cyst cell accumulation and testis DSB marker staining
      target: Testicular Somatic Cell Hyperproliferation
      direction: INCREASED
      interpretation: Somatic (cyst-cell) knockdown of Caf1-55 causes hyperproliferation with elevated DNA damage markers.
      evidence:
      - reference: PMID:37843278
        reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cyst cells accumulated as tumor-like (Figure 6, A and B)."
        explanation: Direct readout of somatic cyst cell hyperproliferation following Caf1-55 loss.
    evidence:
    - reference: PMID:37843278
      reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of Caf1-55 in Drosophila somatic cyst cells also resulted in high DSB levels and overproliferated testicular cells."
      explanation: Links somatic genomic instability to hyperproliferation in the fly model, the basis for the proposed shared mechanism with the human Leydig cell tumor.
mechanistic_hypotheses:
- hypothesis_group_id: rbbp7_shared_dsb_repair_and_tumor_risk
  hypothesis_label: >-
    Impaired RBBP7-dependent genome stability links spermatogenic maturation
    arrest to testicular tumor predisposition through a shared mechanism
  status: EMERGING
  description: >-
    The founding family shows co-occurrence of early maturation arrest and a
    benign Leydig cell tumor in the same proband, with RBBP7 and BRCA1 both
    decreased and gammaH2AX increased in the tumor tissue. The authors
    propose that RBBP7 loss, via a reported RBBP7-CUL4B-HUWE1-BRCA1 axis,
    could predispose to both spermatogenic failure and testicular neoplasia
    through one underlying defect in genome stability, rather than through two
    unrelated events. This rests on a single kindred; whether it generalizes
    is an open question (see the linked discussion). Downstream causal edges
    that belong to this hypothesis opt in via
    hypothesis_groups: [rbbp7_shared_dsb_repair_and_tumor_risk].
  evidence:
  - reference: PMID:35809576
    reference_title: "Large-scale analyses of the X chromosome in 2,354 infertile men discover recurrently affected genes associated with spermatogenic failure."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      we speculate that RBBP7, CUL4B, or HUWE1 may lead to both spermatogenic
      failure and cancer predisposition.
    explanation: States the proposed shared-mechanism hypothesis in the authors' own words.
discussions:
- discussion_id: rbbp7_tumor_cooccurrence_generalizability
  prompt: >-
    Does RBBP7-related genome instability generally predispose to testicular
    tumor as well as spermatogenic failure, or was the Leydig cell tumor in
    the founding proband an independent, coincidental finding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced BRCA1-Mediated DNA Repair and Genomic Instability
  - pathophysiology#Testicular Somatic Cell Hyperproliferation
  - phenotypes#Leydig Cell Neoplasm
  rationale: >-
    The tumor-infertility link rests on one proband in one kindred; his
    brother, who carries the identical hemizygous variant, was not reported to
    have a testicular mass. The variant was also absent from 103 additional
    unrelated men with non-obstructive azoospermia, and the independent
    2,354-man cohort that recurrently found RBBP7 variants did not report
    testicular tumors in those men. Resolving this needs systematic imaging
    and tumor-marker surveillance across a larger series of RBBP7-variant
    carriers with non-obstructive azoospermia.
  evidence:
  - reference: PMID:37843278
    reference_title: X-linked RBBP7 mutation causes maturation arrest and testicular tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The involvement of RBBP7 in testicular tumors has not been previously
      reported to our knowledge.
    explanation: The authors themselves note this is a novel, single-family observation rather than an established association.

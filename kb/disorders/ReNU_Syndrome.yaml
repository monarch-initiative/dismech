    with minimal change disease and podocyte effacement on biopsy and preserved
    kidney function at age 16. This rests on one reported patient and its frequency
    is unknown; it is curated because the authors recommend monitoring for
    proteinuria in ReNU syndrome, which makes it clinically actionable even at n=1.

      snippet: "No structural epileptogenic lesions were detected on MRI."
      explanation: >-
        Absence of a structural lesion in an epilepsy-focused cohort supports a
        functional rather than lesional basis for the seizures.
  - target: Increased Bone Turnover and Reduced Bone Mineral Density
    description: >-
      Bone involvement is common and its histology suggests a bone-cell-intrinsic

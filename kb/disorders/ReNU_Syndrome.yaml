treatments:
- name: Multidisciplinary supportive care
  therapeutic_modality: OTHER
  description: >-
    Management is supportive and symptomatic, addressing developmental,
    neurological, growth, feeding, and orthopedic needs through multidisciplinary
    care. There is no disease-modifying therapy. The saturation-editing work
    frames variant-function data as groundwork for future therapeutic development,
    which is the current state of play: no targeted treatment exists.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41951737
    reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "providing critical insights for both diagnosis and therapeutic development"
    explanation: >-
      Therapeutic development is framed as prospective, supporting the statement
      that management today is supportive rather than disease-modifying.
- name: Anti-seizure pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Seizures are managed with anti-seizure medications. In the only epilepsy-focused
    cohort, valproate was judged the most effective agent by the treating
    neurologists, followed by levetiracetam, clobazam, lamotrigine and phenytoin,
    and seizure freedom was achieved in half the cohort. Note that this is a
    retrospective clinician judgement in ten patients, not a controlled comparison,
    so it is weak grounds for preferring valproate over another agent in an
    individual patient.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproate
      term:
        id: CHEBI:39867
        label: valproic acid
  target_mechanisms:
  - target: Cortical Network Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Anti-seizure medication suppresses the network hyperexcitability that
      generates the seizures; it does not act on the upstream splicing defect.
    evidence:
    - reference: PMID:41570780
      reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Seizure freedom was achieved with antiseizure medications in 5 patients at a mean age of 7.2 ± 25.2."
      explanation: >-
        Medication abolishes seizures in half the cohort, which is what this link
        asserts: the drug acts on the seizure-generating node, not on the cause.
  evidence:
  - reference: PMID:41570780
    reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate was judged the most effective medication by referring neurologists followed by levetiracetam, clobazam, lamotrigine and phenytoin."
    explanation: >-
      Curated PARTIAL: this is retrospective clinician judgement in a ten-patient
      cohort, which supports valproate being used and considered effective but not
      a comparative efficacy claim.
  - reference: PMID:41570780
    reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure freedom was achieved with antiseizure medications in 5 patients at a mean age of 7.2 ± 25.2."
    explanation: Establishes that medically achieved seizure freedom is attainable in a substantial fraction.
- name: Antiresorptive therapy for skeletal fragility
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Given the 42% frequency of bone abnormality and the occurrence of clinically
    silent vertebral fractures, osteological assessment is warranted. In the one
    published treated case, intravenous neridronate at 2 mg/kg every three months
    over three years was well tolerated, bone mineral density rose and then
    stabilised, and no further vertebral fractures occurred — though the patient
    did sustain a patella and a proximal humerus fracture after falls. This is a
    single treated patient, so it supports the approach being feasible and
    reasonable, not an established efficacy claim.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: neridronate
      term:
        id: NCIT:C66230
        label: Neridronic Acid
  target_mechanisms:
  - target: Increased Bone Turnover and Reduced Bone Mineral Density
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonate therapy suppresses the osteoclast-mediated resorption arm of
      the high-turnover state curated at this node.
    evidence:
    - reference: PMID:40510867
      reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "we observed the expected reduction of bone turnover parameters"
      explanation: >-
        Confirms the drug engaged the turnover process this node represents;
        PARTIAL because it is a pharmacodynamic effect in one patient, not an
        outcome.
  evidence:
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-resorptive treatment with intravenous neridronate injections (2 mg per kg body weight, every 3 mo) was initiated, which was well tolerated by the patient without obvious side effects."
    explanation: Documents the regimen and its tolerability in the reported patient.
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, there were no additional vertebral fractures."
    explanation: >-
      Curated PARTIAL: absence of further vertebral fractures in one uncontrolled
      patient who still sustained two appendicular fractures is suggestive, not
      demonstrative, of benefit.
- name: Structured surveillance and avoidance of bone-toxic agents
  therapeutic_modality: OTHER
  description: >-
    GeneReviews recommends scheduled follow-up to monitor existing manifestations
    and detect new ones, across developmental, seizure, feeding, kidney, urinary
    tract, bone-health and sleep domains, and specifically advises weighing the
    bone consequences of any medication considered. That advice matters more here
    than in most neurodevelopmental disorders given the 42% frequency of bone
    abnormality and the demonstrated occurrence of vertebral fractures that were
    silent until imaged.
  treatment_term:
    preferred_term: scheduled multi-system clinical surveillance
  notes: >-
    treatment_term is deliberately left unbound. NCIT:C15719 (Surveillance) is not
    reachable from NCIT:C25218 (Clinical Intervention or Procedure) and so fails
    the TreatmentActionTerm enum, and no NCIT clinical-action term was found that
    means scheduled multi-system surveillance. Per the project rule that no term
    beats a bad one, a free-text preferred_term is used rather than forcing a
    generic Therapeutic Procedure or reusing Supportive Care, which already labels
    a different treatment in this entry.
  evidence:
  - reference: PMID:42190036
    reference_title: "RNU4-2-Related Autosomal Dominant Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Consider avoiding or limiting any substance or medication that may affect bone health (e.g., steroids)."
    explanation: >-
      The explicit agents-to-avoid recommendation, tied to this disorder's
      skeletal fragility.
- name: Augmentative and alternative communication
  therapeutic_modality: BEHAVIORAL
  description: >-
    Because most individuals never acquire meaningful speech while comprehension
    and social motivation are comparatively preserved, augmentative and alternative
    communication is emphasised as a priority intervention, together with
    cognitive-behavioural approaches aimed at the communicative frustration that
    appears to drive behavioural dysregulation and social anxiety.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: PMID:41681065
    reference_title: "Longitudinal Behavior Phenotype Hallmarks in RNU4-2 Syndrome: Implications for Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with particular emphasis on augmentative and alternative communication strategies and cognitive-behavioral approaches to mitigate communicative frustration, behavioral dysregulation, and social anxiety"
    explanation: States the recommended intervention and the behavioural rationale for it.
- name: Physical and developmental therapy
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physical, occupational, and speech/communication therapies support motor
    development and function given hypotonia, motor delay, and non-verbal status.
    In the treated osteoporosis case a structured strength and coordination
    programme proved infeasible and supervised general mobility was substituted,
    which illustrates the practical ceiling on physical therapy in this population.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A structured training program to improve muscle strength and coordination was not feasible for the patient, but mobility in general was promoted in a protected environment under supervision."
    explanation: >-
      Curated PARTIAL because it documents a limitation of this treatment rather
      than a benefit: structured training was not deliverable.
diagnosis:
- name: Genome sequencing (exome-negative work-up)
  description: >-
    The signature diagnostic feature of ReNU syndrome is that RNU4-2, as a short
    non-coding U4 snRNA gene, is not captured by conventional exome sequencing;
    affected individuals are therefore typically exome-negative and remain
    undiagnosed until clinical genome sequencing is performed and the RNU4-2
    critical-region variant (most often the recurrent n.64_65insT insertion) is
    identified. Genome sequencing of exome-negative NDD cohorts is the actionable
    route to diagnosis and, given the recognizable lip-and-philtrum facial
    gestalt, RNU4-2 should be specifically interrogated in undiagnosed NDD.
  diagnosis_term:
    preferred_term: clinical whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:42419151
    reference_title: "Recurrent RNU4-2 n.64_65insT variant in ReNU syndrome identified in exome-negative cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNU4-2 is not captured by conventional exome sequencing (ES), often leaving affected individuals undiagnosed."
    explanation: >-
      Hiraide et al. state that RNU4-2 is missed by exome sequencing, so affected
      individuals are exome-negative until genome sequencing is applied.
  - reference: PMID:42419151
    reference_title: "Recurrent RNU4-2 n.64_65insT variant in ReNU syndrome identified in exome-negative cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed genome sequencing in 95 patients with NDDs in whom prior ES had failed to identify a causative variant"
    explanation: >-
      Hiraide et al. establish genome sequencing of exome-negative NDD patients as
      the diagnostic approach that identifies the RNU4-2 variant.
  - reference: PMID:42190036
    reference_title: "RNU4-2-Related Autosomal Dominant Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of ReNU syndrome is established in a proband with suggestive findings and a heterozygous pathogenic variant in RNU4-2 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews diagnostic criterion: suggestive clinical findings plus a
      heterozygous RNU4-2 variant on molecular genetic testing. The criterion is
      agnostic about method, which is why both the genome-sequencing and the
      targeted-Sanger routes curated here satisfy it.
- name: Targeted Sanger sequencing of the RNU4-2 hotspot
  description: >-
    Where genome sequencing is unavailable or slow, the recognisability of the
    syndrome makes a targeted approach viable: because the pathogenic variants
    cluster into a short region, direct Sanger sequencing of the 18-base-pair
    critical region is a reasonable first test in a clinically suspected case. This
    is how a nine-patient series was assembled from previously undiagnosed
    individuals, and how the diagnosis was reached in a patient whose trio exome
    had been uninformative. The facial gestalt — hooded upper eyelids, full cheeks,
    a tented philtrum, and a slightly open mouth with an everted lower lip
    vermilion — is the practical trigger for testing.
  diagnosis_term:
    preferred_term: DNA sequence analysis
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  evidence:
  - reference: PMID:40546132
    reference_title: "A Clinical Study of Nine Patients With ReNU Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If clinically suspected, it is reasonable to examine the 18-base pair region using the Sanger method."
    explanation: States the targeted diagnostic recommendation directly.
  - reference: PMID:40546132
    reference_title: "A Clinical Study of Nine Patients With ReNU Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed a distinctive pattern of dysmorphic features, including hooded upper eyelids, full cheeks, a tented philtrum, and a mouth constantly slightly open with an everted lower lip vermilion."
    explanation: >-
      Specifies the recognisable facial pattern that makes targeted testing
      practical, present in every patient in the series.
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As RNA encoding genes are not targeted by exome sequencing, we analyzed RNU4-2"
    explanation: >-
      A worked instance of the targeted approach succeeding after uninformative
      trio exome sequencing.
progression:
- phase: Infancy
  age_range: birth to 2 years
  notes: >-
    Presentation is with hypotonia, feeding difficulty and global developmental
    delay. Microcephaly is mostly congenital, and reduced head circumference may
    be noted prenatally. Seizures usually have not yet begun, though onset before
    12 months occurs in a minority.
  evidence:
  - reference: PMID:41570780
    reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal impaired consciousness with observable manifestations (with onset before 12 months in 3 cases) were the predominant seizure type across all age ranges."
    explanation: >-
      Establishes that seizure onset within the first year occurs but is the
      exception rather than the rule.
- phase: Early childhood
  age_range: 2 to 6 years
  notes: >-
    Epilepsy typically begins in this window, at a mean age of about 2.8 years.
    Expressive language largely fails to emerge: most individuals have not
    acquired meaningful words by age five. Independent walking is attained by
    roughly half.
  evidence:
  - reference: PMID:41570780
    reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at epilepsy onset was 2.8 ±2.1 years."
    explanation: Dates typical epilepsy onset to early childhood.
  - reference: PMID:40546132
    reference_title: "A Clinical Study of Nine Patients With ReNU Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In six patients, meaningful words had not been acquired, even after the age of 5 years."
    explanation: Marks failure of expressive language to emerge by school age.
- phase: Later childhood
  age_range: 6 to 12 years
  notes: >-
    Focal impaired-consciousness seizures peak in frequency between ages 6 and 11,
    and epileptiform EEG abnormality becomes more readily detected after age 3.
    Seizure freedom is achievable with medication in about half of patients.
  evidence:

- phase: Adolescence and adulthood
  age_range: 12 years and older
  notes: >-
    Neuropsychiatric features come to the fore: persistent attention deficits and
    autistic features are described as hallmarks, and self-injurious behaviour and
    social anxiety may emerge in adolescence. Skeletal fragility becomes clinically
    important, with vertebral fractures that may be silent until specifically
    imaged. Individuals have been followed to at least age 29; the disorder is not
    known to be neurodegenerative, though longitudinal data remain sparse.
  evidence:
  - reference: PMID:41681065
    reference_title: "Longitudinal Behavior Phenotype Hallmarks in RNU4-2 Syndrome: Implications for Clinical Management."
    supports: SUPPORT

inheritance:
- name: Autosomal Dominant (de novo)
  description: >-
    ReNU syndrome is inherited in an autosomal-dominant manner, with the causative
    heterozygous RNU4-2 variants arising de novo. Where parental origin could be
    determined, the de novo variants were consistently found on the maternal
    allele. The recurrent n.64_65insT insertion and other critical-region variants
    were confirmed de novo in trio (and, in a subset, long-read) sequencing.
  inheritance_term:
    preferred_term: Autosomal dominant, de novo
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 54 individuals in whom it could be determined, the de novo variants were all on the maternal allele."
    explanation: >-
      Chen et al. establish that the RNU4-2 variants arise de novo and, where
      resolvable, occur on the maternal allele, defining the de novo dominant
      mode of occurrence.
  - reference: PMID:42419151
    reference_title: "Recurrent RNU4-2 n.64_65insT variant in ReNU syndrome identified in exome-negative cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a recurrent RNU4-2 variant (NR_003137.3:n.64_65insT) in five patients (5.3%), four of whom are described here. All variants occurred de novo."
    explanation: >-
      Hiraide et al. independently confirm the recurrent n.64_65insT variant
      arising de novo in an exome-negative NDD cohort.
  - reference: PMID:40011755
    reference_title: "Expanding the mutational spectrum of ReNU syndrome: insights into 5' Stem-loop variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "two were heterozygous for private/rare maternally inherited variants"
    explanation: >-
      Qualifies the de novo rule rather than supporting it: two affected
      individuals inherited their variant from an apparently unaffected mother, so
      "de novo" describes the typical but not the invariant case.
  - reference: PMID:40011755
    reference_title: "Expanding the mutational spectrum of ReNU syndrome: insights into 5' Stem-loop variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that a more complex genetics likely underlies the inheritance of a subset of disease-causing RNU4-2 variants from an apparently unaffected parent."
    explanation: >-
      The authors flag transmission from an unaffected parent as unresolved,
      which is why this entry does not curate inheritance as strictly de novo.
  - reference: PMID:42190036
    reference_title: "RNU4-2-Related Autosomal Dominant Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ReNU syndrome is an autosomal dominant disorder that is almost always caused by a de novo pathogenic variant."
    explanation: >-
      GeneReviews states the rule in its calibrated form - almost always de novo,
      rather than invariably - which is how this entry curates it.
  - reference: PMID:42190036
    reference_title: "RNU4-2-Related Autosomal Dominant Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Very rarely, individuals diagnosed with ReNU syndrome have the disorder as the result of an RNU4-2 pathogenic variant inherited from a mildly affected parent."
    explanation: >-
      Independently corroborates inherited cases. Note GeneReviews describes the
      transmitting parent as mildly affected whereas the stem-loop series
      described theirs as apparently unaffected; both are curated rather than
      reconciled.
has_subtypes:
- name: T-loop
  display_name: T-loop variant ReNU syndrome (including the recurrent n.64_65insT)
  description: >-
    Variants in the T-loop element, which include the highly recurrent
    n.64_65insT insertion accounting for roughly 80% of all cases, define the
    severe end of the spectrum: developmental delay is severe and more than 70%
    of individuals remain non-verbal. This is the classical ReNU presentation on
    which the syndrome was originally delineated.
  evidence:
  - reference: PMID:40413032
    reference_title: "Genotype-phenotype correlations and phenotypic expansion in a case series of ReNU syndrome associated with RNU4-2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-loop variants manifested severe developmental delay with more than 70% of cases being non-verbal."
    explanation: Defines the severity that distinguishes this subtype.
  - reference: PMID:40413032
    reference_title: "Genotype-phenotype correlations and phenotypic expansion in a case series of ReNU syndrome associated with RNU4-2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNU4-2 variants are located in the T-loop or stem III region of U4 snRNA, of which approximately 80% are the n.64_65insT variant in the T-loop."
    explanation: Establishes that the T-loop group, dominated by n.64_65insT, is the majority of cases.
- name: Stem III
  display_name: Stem III variant ReNU syndrome
  description: >-
    Variants in the stem III element produce a materially milder disorder:
    developmental delay is less severe, speech can be fluent, and gross motor
    milestones are close to normal. This subtype is the main reason the syndrome's
    severity is not uniform, and it matters diagnostically because a fluently
    speaking, ambulant individual may still have ReNU syndrome.
  evidence:
  - reference: PMID:40413032
    reference_title: "Genotype-phenotype correlations and phenotypic expansion in a case series of ReNU syndrome associated with RNU4-2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stem III region variants resulted in milder developmental delay with fluent speech and nearly normal gross motor development milestones."
    explanation: Defines the milder phenotype that distinguishes this subtype from the T-loop group.

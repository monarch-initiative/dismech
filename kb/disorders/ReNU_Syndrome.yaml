- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    Epilepsy affects roughly 60% of individuals with ReNU syndrome. The seizure
    disorder is notable for what is absent as much as what is present: dedicated
    epilepsy-cohort imaging found no structural epileptogenic lesion, so the
    seizures are attributed to a functional network abnormality rather than to the
    malformations visible on MRI. Focal impaired-consciousness seizures predominate
    across all ages, onset is in early childhood, and the course is comparatively
    favourable, with seizure freedom achievable in about half of patients. The
    cellular substrate linking the splicing defect to network hyperexcitability is
    not known, which is why this node deliberately carries no biological_process or
    cell_type binding: no source examined identifies the channel, synapse or cell
    population involved, and a generic nervous-system-development term would assert
    nothing about excitability.
  downstream:
  - target: Seizures
    description: >-
      Network hyperexcitability manifests as predominantly focal
      impaired-consciousness seizures with onset in early childhood.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41570780
      reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Focal impaired consciousness with observable manifestations (with onset before 12 months in 3 cases) were the predominant seizure type across all age ranges."
      explanation: Characterizes the predominant seizure semiology arising from this node.
  evidence:
  - reference: PMID:41570780
    reference_title: "Epilepsy phenotypes of Renu syndrome: Novel insights from a European multicentre retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy is a prominent feature in about 60% of patients with ReNU syndrome"
    explanation: Establishes the frequency of epilepsy that this node represents.
  - reference: PMID:41570780

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at epilepsy onset was 2.8 ±2.1 years."
    explanation: Dates the onset of this node's clinical expression to early childhood.
- name: Increased Bone Turnover and Reduced Bone Mineral Density
  biological_scale: TISSUE
  description: >-
    Skeletal fragility is a common and clinically actionable part of the phenotype:
    bone abnormalities were present in 42% of individuals assessed. In the one
    published case with histomorphometry, an undecalcified tibia biopsy showed
    enlarged eroded surfaces with increased numbers of both osteoclasts and
    osteoblasts — an activated, high-turnover state rather than the low-turnover
    picture expected from immobility alone. That observation is the basis for
    suspecting a bone-cell-intrinsic splicing effect, but it rests on a single
    biopsy and disuse remains an unexcluded contributor in a population with
    hypotonia and limited ambulation. Vertebral fractures may be clinically silent
    until sought, which is why this node matters for management.
  biological_processes:
  - preferred_term: Bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  - preferred_term: Ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  locations:

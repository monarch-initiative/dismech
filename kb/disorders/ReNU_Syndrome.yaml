  notes: >-
    RNU4-2 encodes the U4 small nuclear RNA, a critical component of the
    U4/U6.U5 tri-snRNP complex of the major spliceosome. Pathogenic variants
    cluster in an 18-bp critical region in the centre of the gene, mapping to the
    T-loop and stem III structural elements of the U4/U6 duplex; this region is
    severely depleted of variation in the general population. The highly recurrent
    single-base insertion n.64_65insT accounts for the majority of cases; other
    insertions (e.g., n.77_78insT) and single-nucleotide variants in the critical
    region cause the same phenotype. As a short non-coding RNA gene, RNU4-2 is not
    captured by conventional exome sequencing, so affected individuals are
    typically exome-negative until genome sequencing is performed.

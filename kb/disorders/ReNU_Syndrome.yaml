    term:
      id: UBERON:0001474
      label: bone element
  downstream:
  - target: Osteopenia
    description: Reduced bone mineral density is the direct densitometric expression of this node.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40510867
      reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "bone abnormalities have been described previously and were present in 72 out of 173 individuals (42%) with ReNU syndrome who underwent bone assessment"
      explanation: >-
        Quantifies how common reduced bone mass and related abnormalities are
        among assessed individuals.
  - target: Recurrent fractures
    description: >-

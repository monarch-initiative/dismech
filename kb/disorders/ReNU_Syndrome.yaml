clinical_burden:
  burden_level: HIGH
  rationale: >-
    Burden is curated HIGH rather than VARIABLE because the core impairments are
    near-universal rather than distributed: developmental delay or intellectual
    disability was present in every patient across a 3-to-29-year age span, most
    never acquire meaningful speech, only about half walk independently, and
    neuroradiological abnormality was universal in a consecutive series. Epilepsy
    affects about 60%, and 42% of those assessed have bone abnormality with
    fractures that may go unrecognized. The milder Stem III genotype is the one
    real source of variability, and it is a minority of cases; it is captured as a
    subtype rather than by softening the overall burden level.
  evidence:
  - reference: PMID:40546132
    reference_title: "A Clinical Study of Nine Patients With ReNU Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients aged between 3 and 29 years all showed severe developmental delay and/or intellectual disability."
    explanation: Universal severe impairment across the reported age range.
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bone abnormalities have been described previously and were present in 72 out of 173 individuals (42%) with ReNU syndrome who underwent bone assessment"
    explanation: Quantifies the added skeletal burden beyond the neurological phenotype.
experimental_models:
- name: Saturation genome editing of RNU4-2 in HAP1 cells
  experimental_model_type: CELL_LINE
  culture_system: >-
    Haploid human HAP1 cells lacking LIG4 (HAP1-LIG4-KO), into which a library of
    539 RNU4-2 variants was installed by Cas9-directed homology-directed repair;
    variant effects are read out as depletion or enrichment over time in culture.
  cell_source: HAP1 human near-haploid cell line
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:41951737
  description: >-
    Because no established model existed for assaying RNU4-2 variants, the authors
    used saturation genome editing in a haploid human line, where the single copy
    of the gene makes each edited variant's effect directly visible in cell
    fitness. The resulting function scores separate ReNU syndrome variants from
    population variants, outperform in silico predictors, and scale with both
    splicing disruption and clinical severity. This is a variant-function assay
    rather than a disease model: it measures the molecular node, and does not
    reproduce any neurodevelopmental phenotype.
  evidence:
  - reference: PMID:41951737
    reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we performed saturation genome editing (SGE) of RNU4-2 to identify the functional and clinical impact of variants across the entire gene."
    explanation: >-
      Establishes the existence and purpose of the model system curated here.
  modeled_mechanisms:
  - target: RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies the functional consequence of each RNU4-2 variant, resolving the
      critical region to single-nucleotide resolution and reclassifying variants
      of uncertain significance.
    limitations: >-
      Fitness in a haploid cancer-derived cell line is a proxy for spliceosome
      impairment, not a measure of neurodevelopment; HAP1 is not a neural cell
      type, the assay is haploid whereas ReNU syndrome is heterozygous, and no
      clinical phenotype is recapitulated.
    readouts:
    - name: SGE function score (cell fitness)
      target: RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
      direction: DECREASED
      interpretation: >-
        Pathogenic critical-region variants deplete from the edited cell pool,
        yielding low function scores that separate them from population variants.
      evidence:
      - reference: PMID:41951737
        reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The resulting SGE function scores, derived from variants' effects on cell fitness, discriminate ReNU syndrome variants from those observed in the population and markedly outperform in silico variant effect prediction"
        explanation: >-
          Defines the readout and establishes that it discriminates pathogenic
          from population variation better than computational prediction.
    evidence:
    - reference: PMID:41951737
      reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Lacking established models for assaying RNU4-2 variants, we chose to perform SGE in HAP1 cells, a haploid human line in which growth effects have accurately distinguished pathogenic variants across several protein-coding genes"
      explanation: >-
        States both the rationale for the model and, by naming the absence of
        established models, why it is informative for this node.
differential_diagnoses:
- name: Recessive RNU4-2-related neurodevelopmental disorder
  description: >-
    The same gene causes a second, separate disorder. Biallelic variants falling
    outside the 18-nucleotide ReNU critical region — in Stem II, the k-turn and the
    Sm protein binding site — produce a clinically distinct recessive
    neurodevelopmental syndrome. Distinguishing it matters mechanistically as well
    as diagnostically: the recessive disorder shows reduced RNU4-2 transcript and
    so acts by loss of function, which ReNU syndrome does not.
  distinguishing_features:
  - Biallelic (homozygous or compound heterozygous) rather than de novo heterozygous
  - Variants outside the 18-nucleotide critical region, in Stem II, the k-turn or the Sm site
  - Distinctive white matter abnormalities including enlarged perivascular spaces
  - Reduced RNU4-2 transcript levels, indicating a loss-of-function mechanism
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify 38 individuals with biallelic variants outside the 18-nucleotide ReNU syndrome region that cluster within other functionally important elements of U4: Stem II, the k-turn and the Sm protein binding site."
    explanation: Defines the genotype that separates this disorder from ReNU syndrome.
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we find reduced RNU4-2 transcript levels in individuals with the recessive disorder, suggesting a loss-of-function disease mechanism that is distinct from the mechanism underlying ReNU syndrome"
    explanation: >-
      Establishes the mechanistic distinction, which is the reason this is a
      separate disease rather than a severity variant of ReNU syndrome.
- name: RNU4-2- and RNU6-related retinitis pigmentosa
  description: >-
    Heterozygous variants in RNU4-2 also cause non-syndromic retinitis pigmentosa,
    with no neurodevelopmental phenotype. These variants sit in the three-way
    junction of the U4/U6 duplex rather than the ReNU critical region, and appear
    to act by impairing snRNP biogenesis through altered binding of tri-snRNP
    factors. The same gene therefore produces either a neurodevelopmental disorder
    or an isolated retinal degeneration depending on which structural element is
    hit.
  disease_term:
    preferred_term: retinitis pigmentosa
    term:
      id: MONDO:0019200
      label: retinitis pigmentosa
  distinguishing_features:
  - Progressive retinal degeneration without intellectual disability or microcephaly
  - Variants cluster in the U4/U6 three-way junction, not the 18-bp ReNU critical region
  - Often inherited rather than de novo
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reveals pleiotropy in RNU4-2, where distinct variants underlie neurodevelopmental disorder and retinal degeneration"
    explanation: >-
      States the pleiotropy directly: which variant, not which gene, determines
      whether the phenotype is neurodevelopmental or retinal.
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants cluster within the three-way junction of the U4/U6 duplex, a site that interacts with tri-snRNP splicing factors also known to cause RP (PRPF3, PRPF8, PRPF31), and seem to affect snRNP biogenesis."
    explanation: Localizes the RP variants to a different structural element than the ReNU critical region.
- name: Other snRNA-related neurodevelopmental disorders (RNU2-2, RNU5B-1)
  description: >-
    Variants in other major-spliceosome snRNA genes cause neurodevelopmental
    disorders that overlap ReNU syndrome clinically and, like it, are invisible to
    exome sequencing. They belong to the same emerging class of snRNA
    spliceosomopathies and are the main alternative diagnoses when genome
    sequencing of an exome-negative individual is being interpreted.
  distinguishing_features:
  - Causal variant in RNU2-2 or RNU5B-1 rather than RNU4-2
  - Both dominant and recessive forms have been described for RNU2-2
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Likewise, RNU2-2 and RNU5B-1 have been recently associated with NDDs"
    explanation: Establishes these genes as the sibling snRNA causes of neurodevelopmental disorder.
discussions:
- discussion_id: renu_mechanism_is_not_loss_of_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
  prompt: >-
    If ReNU syndrome is not caused by loss of RNU4-2 function, what does the
    dominant critical-region variant actually do to the spliceosome?
  rationale: >-
    The discovery of a recessive RNU4-2 disorder settles what ReNU syndrome is not.
    Biallelic variants outside the critical region reduce RNU4-2 transcript levels
    and cause a clinically distinct disease by loss of function; the authors state
    explicitly that this mechanism differs from the one underlying ReNU syndrome.
    The dominant critical-region variants must therefore act by some other route —
    a dominant-negative or altered-function effect on U4/U6 pairing and spliceosome
    activation — but which of these, and whether the mutant U4 is incorporated into
    tri-snRNPs and poisons them or acts before assembly, is not established. This
    matters for therapy: an antisense or allele-specific strategy is only coherent
    if the mutant transcript is doing something, rather than simply failing to.
  evidence:
  - reference: PMID:41951959
    reference_title: "Biallelic variants in the noncoding RNA gene RNU4-2 cause a recessive neurodevelopmental syndrome with distinct white matter changes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we find reduced RNU4-2 transcript levels in individuals with the recessive disorder, suggesting a loss-of-function disease mechanism that is distinct from the mechanism underlying ReNU syndrome"
    explanation: >-
      The source of the gap: it establishes that ReNU syndrome's mechanism is
      something other than loss of function, without saying what.
- discussion_id: renu_rnu4_2_pleiotropy_ndd_versus_retinopathy
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#RNU4-2 critical-region variants
  - pathophysiology#Systematic Disruption of 5' Splice-Site Usage
  prompt: >-
    Why do variants in one 76-nucleotide non-coding gene produce either a severe
    neurodevelopmental syndrome or an isolated retinal degeneration, depending only
    on which structural element is affected?
  rationale: >-
    RNU4-2 now has at least three distinct variant-position-to-disease mappings: the
    18-bp T-loop/stem III critical region gives dominant ReNU syndrome; the
    three-way junction of the U4/U6 duplex gives dominant non-syndromic retinitis
    pigmentosa; and Stem II, the k-turn and the Sm site give a recessive
    neurodevelopmental disorder when biallelic. A single housekeeping snRNA used by
    essentially every transcript thus yields strikingly tissue-restricted and
    non-overlapping phenotypes. The retinal variants appear to act on snRNP
    biogenesis via tri-snRNP factor binding, echoing the PRPF-gene retinitis
    pigmentosas, which suggests the determinant is which spliceosome sub-process is
    perturbed rather than how much splicing is disturbed overall. Testing that would
    require comparing splicing outcomes across variant classes in the same cell
    system.
  evidence:
  - reference: PMID:41513982
    reference_title: "De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reveals pleiotropy in RNU4-2, where distinct variants underlie neurodevelopmental disorder and retinal degeneration"
    explanation: States the pleiotropy that this question is about.
- discussion_id: renu_bone_disease_intrinsic_versus_disuse
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Bone Turnover and Reduced Bone Mineral Density
  prompt: >-
    Is the skeletal fragility of ReNU syndrome caused by a splicing defect intrinsic
    to bone cells, or is it disuse osteoporosis secondary to hypotonia and limited
    ambulation?
  rationale: >-
    The distinction is not academic: it determines whether bone in ReNU syndrome
    should be managed as a primary skeletal disease with early surveillance and
    anti-resorptive therapy, or as a preventable consequence of immobility. One
    observation currently favours an intrinsic effect — a tibia biopsy showed
    increased numbers of both osteoclasts and osteoblasts with enlarged eroded
    surfaces, an activated high-turnover state, whereas disuse osteoporosis is
    typically low-turnover. But that is a single biopsy in a single patient who was
    also non-ambulatory, so disuse is not excluded, and the authors themselves call
    for the bone pathology to be defined. Resolving it needs histomorphometry in
    several patients stratified by ambulatory status.
  evidence:
  - reference: PMID:40510867
    reference_title: "Assessment and treatment of osteoporosis in a patient with a neurodevelopmental disorder caused by a RNU4-2 pathogenic variant (ReNU syndrome)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although skeletal abnormalities have been reported in individuals with ReNU syndrome,1,2,4–10 the underlying bone cell pathologies still need to be defined in order to prevent fractures by specific treatment strategies."
    explanation: >-
      The authors state the gap directly and tie it to treatment selection; curated
      PARTIAL because it names the uncertainty rather than resolving it.
- discussion_id: renu_unwired_phenotypes
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - phenotypes#Feeding difficulties
  - phenotypes#Short stature
  - phenotypes#Optic nerve hypoplasia
  - phenotypes#Self-injurious behavior
  - phenotypes#Joint hypermobility
  prompt: >-
    Twenty-one of this entry's 34 phenotypes are not attached to a mechanism node.
    Which of them have a real published mechanistic link, and which should stay
    unattached?
  rationale: >-
    The 2026 augmentation wired 13 of 34 phenotypes into the pathograph, in every
    case where a source supported the link. The 21 left unwired fall into groups:
    growth and dysmorphology (short stature, the lip-and-philtrum gestalt, everted
    lower lip); ophthalmological findings (optic nerve hypoplasia, strabismus,
    nystagmus); gastrointestinal and renal features (feeding difficulties,
    constipation, gastro-oesophageal reflux, proteinuria, kidney and urinary tract
    anomalies); skeletal features not covered by the bone-turnover node (scoliosis,
    hip dysplasia, rib morphology, talipes equinovarus, joint hypermobility); and
    the behavioural phenotype (autistic features, short attention span, midline
    stereotypies, sleep disturbance, self-injurious behaviour). The behavioural
    group is the most tempting to attach, since it is obviously neurodevelopmental,
    but the sources list these as features of the syndrome rather than as
    consequences of the brain-growth node, and association is not a mechanism.
    Likewise hypotonia to feeding difficulty, or to scoliosis and hip dysplasia,
    are clinically reasonable chains that no ReNU-specific source states. Inventing
    edges to raise a connectivity metric would make the pathograph assert more than
    the literature does. Each should be wired when a source supports it.

      neurodevelopmental specificity of the disorder.
  - reference: PMID:41951737
    reference_title: "Saturation editing of RNU4-2 reveals distinct dominant and recessive disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we redefine the ReNU syndrome critical region at single-nucleotide resolution, resolve variant pathogenicity for variants of uncertain significance and show that SGE function scores delineate variants by phenotypic severity and the extent of observed splicing disruption"
    explanation: >-
      Saturation genome editing refines the critical region and ties the magnitude
      of the functional defect to both splicing disruption and clinical severity.
- name: Systematic Disruption of 5' Splice-Site Usage
  biological_scale: MOLECULAR
  description: >-
    RNA sequencing of individuals with RNU4-2 variants shows systematically
    disrupted 5' splice-site usage — notably increased use of unannotated 5'
    splice sites — consistent with the known role of the affected region during
    spliceosome activation. This global splicing dysregulation during
    neurodevelopment is the proposed convergence point linking the RNA-level
    defect to the neurodevelopmental phenotype, placing ReNU syndrome among the
    spliceosomopathies. Because the spliceosome is used by essentially every
    transcript, the downstream consequences are not confined to brain: skeletal
    and, in at least one report, glomerular involvement are part of the phenotype.
    Which downstream transcripts actually mediate each organ phenotype is not
    known, so the edges below are curated as indirect with unknown intermediates.
  biological_processes:
  - preferred_term: mRNA splicing via the major spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  - preferred_term: Nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  downstream:
  - target: Impaired Brain Growth and White Matter Development
    description: >-
      Global splicing dysregulation during brain development is the proposed
      basis for the reduced brain growth and white-matter abnormalities that
      dominate the neuroimaging phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38821540

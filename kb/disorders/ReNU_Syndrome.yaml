pathophysiology:
- name: RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
  description: >-
    RNU4-2 encodes the U4 small nuclear RNA, which base-pairs extensively with U6
    snRNA within the U4/U6.U5 tri-snRNP of the major spliceosome. The 18-bp
    critical region harboring the recurrent n.64_65insT insertion maps to the
    T-loop and stem III structural elements that stabilize U4/U6 pairing and help
    position the U6 ACAGAGA sequence to receive the 5' splice site during initial
    spliceosome activation. Variants in this region perturb U4 structure and the
    U4/U6 duplex, compromising accurate spliceosome assembly/activation. RNU4-2 is
    highly expressed in the developing human brain (in contrast to the paralog
    RNU4-1), consistent with a developmental, brain-predominant impact.
  biological_processes:
  - preferred_term: U4/U6.U5 tri-snRNP spliceosome assembly
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
    modifier: ABNORMAL
  - preferred_term: mRNA splicing via the major spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  downstream:
  - target: Systematic Disruption of 5' Splice-Site Usage
    description: >-
      Impaired positioning of the U6 ACAGAGA region during spliceosome activation
      leads to systematically altered 5' splice-site recognition.
  evidence:
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNU4-2 encodes the U4 small nuclear RNA (snRNA), which is a critical component of the U4/U6.U5 tri-snRNP complex of the major spliceosome"
    explanation: >-
      Chen et al. establish the molecular identity and role of the U4 snRNA
      encoded by RNU4-2 within the major spliceosome.
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that RNU4-2 is highly expressed in the developing human brain, in contrast to RNU4-1 and other U4 homologues."
    explanation: >-
      Brain-predominant developmental expression of RNU4-2 supports the
      neurodevelopmental specificity of the disorder.
- name: Systematic Disruption of 5' Splice-Site Usage
  description: >-
    RNA sequencing of individuals with RNU4-2 variants shows systematically
    disrupted 5' splice-site usage — notably increased use of unannotated 5'
    splice sites — consistent with the known role of the affected region during
    spliceosome activation. This global splicing dysregulation during
    neurodevelopment is the proposed convergence point linking the RNA-level
    defect to the neurodevelopmental phenotype, placing ReNU syndrome among the
    spliceosomopathies.
  biological_processes:
  - preferred_term: mRNA splicing via the major spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  - preferred_term: Nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Developing neural cell
    term:
      id: CL:0000047
      label: neural stem cell
  downstream:
  - target: Neurodevelopmental impairment
    description: >-
      Global splicing dysregulation during brain development is proposed to
      underlie the developmental delay, intellectual disability, and structural
      brain anomalies of the disorder.
  evidence:
  - reference: PMID:38991538
    reference_title: "De novo variants in the RNU4-2 snRNA cause a frequent neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show how 5' splice-site use is systematically disrupted in individuals with RNU4-2 variants, consistent with the known role of this region during spliceosome activation"
    explanation: >-
      Chen et al. demonstrate systematic 5' splice-site disruption by RNA-seq,
      the proximate functional consequence of the variants.
  - reference: PMID:38821540
    reference_title: "Mutations in the U4 snRNA gene RNU4-2 cause one of the most prevalent monogenic neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings add to the growing evidence of spliceosome dysfunction in the etiologies of neurological disorders."
    explanation: >-
      Greene et al. frame RNU4-2 disease within the broader class of
      spliceosome-dysfunction neurological disorders.

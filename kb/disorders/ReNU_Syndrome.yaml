  findings: []
notes: >-
  ReNU syndrome was delineated in 2024 by two concurrent large genome-sequencing
  studies (Chen et al., Nature; Greene et al., Nat Med) identifying de novo
  variants in the non-coding U4 snRNA gene RNU4-2 as a frequent cause of
  neurodevelopmental disorder. Because RNU4-2 is a short non-coding RNA not
  covered by exome capture, cases are typically exome-negative and require genome
  sequencing; the recurrent T-loop insertion n.64_65insT accounts for most cases.
  MONDO:0971172 (NEDHAFA; OMIM:620851; Orphanet:686488) is the corresponding
  disease term.


  This entry was substantially augmented in 2026 against literature published
  after the original curation, which changed several claims rather than merely
  adding to them.


  What changed. (1) The pathograph was extended from two molecular nodes to five
  and the phenotypes were wired into it; previously all 25 phenotypes were
  causally unattached, and one causal edge pointed at "Neurodevelopmental
  impairment", a target that existed nowhere in the file and so resolved to
  nothing. (2) ReNU syndrome is now known not to be a loss-of-function disorder:
  biallelic variants elsewhere in RNU4-2 reduce transcript levels and cause a
  separate recessive disease, whose authors state that its mechanism is distinct
  from ReNU's. What the dominant variants actually do is recorded as an open
  knowledge gap rather than asserted. (3) Variant position, not gene identity,
  determines the disease: the same gene yields ReNU syndrome, a recessive
  neurodevelopmental disorder, or non-syndromic retinitis pigmentosa depending on
  which structural element is affected. (4) T-loop and Stem III variants are
  curated as subtypes because they differ materially in severity, Stem III being
  the milder. (5) Inheritance is no longer described as strictly de novo: two
  individuals with 5' Stem-loop variants inherited them from an apparently
  unaffected mother.


  Deliberately not done. Twenty-one of 34 phenotypes remain causally unwired. Chains
  such as hypotonia to feeding difficulty, or to scoliosis and hip dysplasia, are
  clinically plausible but no ReNU-specific source was found asserting them, and
  manufacturing edges to raise a connectivity score would make the pathograph
  claim more than the literature does; this is recorded as a CURATION_TODO
  discussion rather than papered over. No animal-model section was added because
  none was identified in the searched literature - that is an absence of evidence
  found, not a verified absence of models. PMID:41351592 (Genet Med, deep
  phenotyping of 11 individuals) is deliberately uncited: its cache entry is
  content_type "unavailable", so no quotable text exists and citing it would mean
  inventing a snippet.


  Ontology notes. Two NCIT identifiers were rejected during curation after being
  checked against the ontology rather than assumed: NCIT:C17003 resolves to
  Polymerase Chain Reaction, not DNA Sequencing (which is NCIT:C153598), and
  NCIT:C64381 resolves to Regional Anesthesia Procedure, not patient monitoring.
  The surveillance treatment is left with an unbound treatment_term because
  neither NCIT:C15719 (Surveillance) nor NCIT:C15722 (Patient Observation) is
  reachable from NCIT:C25218, and no other suitable clinical-action term was
  found. Attention deficits are bound to HP:0000736
  (Short attention span) rather than HP:0007018 (Attention deficit hyperactivity
  disorder) because the source describes attention deficits, not a formal ADHD
  diagnosis.


  Review response. Four blocking items were raised and fixed. The most
  substantive was a claim-evidence mismatch of my own making: the Delayed
  myelination edge had been evidenced by PMID:41951959, a paper about the
  recessive RNU4-2 disorder whose quoted sentence explicitly distinguishes that
  disorder from ReNU syndrome. It could not support the claim, and my own
  explanation had conceded as much - which was the signal it did not belong there.
  It is replaced by the ReNU-specific imaging quote from PMID:38991538, and the
  edge is now DIRECT rather than indirect. The GeneReviews chapter is now tagged
  in a top-level references block, and its CLINICAL CHARACTERISTICS and
  DIAGNOSIS/TESTING sections are mined: six phenotypes it names were absent and
  have been added (midline stereotypies, sleep disturbance, self-injurious
  behaviour, talipes equinovarus, joint hypermobility, kidney and urinary tract
  anomalies), and its diagnostic criterion now backs the diagnosis section.


  Snippet note. Several sources use U+2009 thin spaces between numbers and units
  ("5 years", "2 mg per kg"), so a few snippets match the cache under the
  validator's whitespace normalization rather than byte-for-byte. All 111 were
  independently re-checked under that normalization; nothing here is paraphrased.

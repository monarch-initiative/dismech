name: ReNU Syndrome
creation_date: "2026-07-10T00:00:00Z"
category: Mendelian
description: >-
  ReNU syndrome (also NEDHAFA; neurodevelopmental disorder with hypotonia, brain
  anomalies, distinctive facies, and absent language; OMIM:620851) is a syndromic
  neurodevelopmental disorder caused by de novo variants in RNU4-2, a non-coding
  gene encoding the U4 small nuclear RNA (snRNA), a critical component of the
  U4/U6.U5 tri-snRNP of the major spliceosome. Pathogenic variants cluster within
  an 18-base-pair critical region in the centre of RNU4-2 (mapping to the T-loop
  and stem III structural elements of the U4/U6 duplex), with a single highly
  recurrent single-base insertion (n.64_65insT) accounting for the majority of
  cases. The disorder is characterized by moderate-to-severe global developmental
  delay/intellectual disability, largely non-verbal speech, hypotonia, microcephaly
  (mostly congenital), short stature, seizures, and characteristic brain MRI
  findings (reduced white-matter volume, corpus callosum hypoplasia,
  ventriculomegaly, delayed myelination), together with a distinctive lip-and-
  philtrum facial gestalt. Because RNU4-2 is a short non-coding RNA gene, it is not
  captured by conventional exome sequencing, and affected individuals are typically
  exome-negative until genome sequencing is performed; variants in the critical
  region are estimated to explain ~0.4% of all neurodevelopmental disorders,
  making ReNU syndrome one of the most prevalent monogenic neurodevelopmental
  disorders. Inheritance is autosomal dominant, with variants arising de novo
  (observed on the maternal allele where parental origin could be resolved).

- name: Acute disseminated encephalomyelitis (ADEM)
  description: >
    A postinfectious, autoimmune demyelinating complication of measles distinct
    from direct viral CNS invasion, typically arising as fever and rash are
    resolving and driven by an immune response against myelin antigens rather
    than ongoing viral replication in the brain.
  phenotype_term:
    preferred_term: acute disseminated encephalomyelitis (ADEM)
    term:

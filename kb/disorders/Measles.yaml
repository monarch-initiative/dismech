datasets:
- accession: geo:GSE272560
  title: A measles virus collective infectious unit that caused lethal human brain disease includes many locally restricted and few widespread copy-back defective genomes
  description: During virus replication in cultured cells, copy-back defective viral genomes (cbDVG) can arise. CbDVG are powerful inducers of innate immune responses in vitro, but their occurrence and impact on natural infections of human hosts remain poorly defined. We asked whether cbDVG were generated in the brain of a patient who succumbed to subacute sclerosing panencephalitis (SSPE) about 20 years after acute measles virus (MeV) infection. Previous analyses of 13 brain specimens of this patient indicated that a collective infectious unit (CIU) drove lethal MeV spread. In this study, we identified 276 replication-competent cbDVG species, each present in over 100 copies in the brain.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 16
  publication: PMID:39431848
  notes: Identified by GEO DataSets index search for Measles (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE272426
  title: Immunological landscape of human lymphoid explants during measles virus infection [BulkSeq]
  description: In humans, lymph nodes are the primary site of measles virus (MeV) replication. To understand the immunological events that occur at this site, we infected human lymphoid tissue explants using a pathogenic strain of MeV that expresses GFP. We found that MeV infected between 5-15% of cells across donors. Using single cell RNA-Seq (scRNA-Seq) and flow cytometry, we found that while most of the 29 cell populations identified in the lymphoid culture were susceptible to MeV, there was a broad preferential infection of B cells and reduced infection of T cells. Further subsetting of T cells revealed that this reduction may be driven by the decreased infection of naïve T cells.

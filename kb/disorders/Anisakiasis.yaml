  description: Urticaria is part of the IgE-mediated gastro-allergic presentation.
  phenotype_term:
    preferred_term: Urticaria
    term:
      id: HP:0001025
      label: Urticaria
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The symptoms varied from localised or generalised oedema to urticaria, and

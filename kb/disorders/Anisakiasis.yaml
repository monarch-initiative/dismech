    Small-bowel perforation is a rare severe complication of intestinal
    anisakiasis that can require surgery.
  phenotype_term:
    preferred_term: Intestinal perforation
    term:
      id: HP:0031368
      label: Intestinal perforation
  evidence:
  - reference: PMID:40974456
    reference_title: "Small bowel perforation by Anisakis infection due to raw fish consumption: a rare entity to consider."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      in rare occasions, intestinal anisakidosis may cause serious life-threatening
      complications requiring surgical intervention
    explanation: >-
      A 2025 case report and review describes intestinal perforation as a rare
      severe complication requiring surgical intervention.
diagnosis:
- name: Endoscopic visualization and larval removal
  description: >-
    Gastric anisakiasis is confirmed by dietary history followed by direct
    endoscopic visualization of an attached larva; the same procedure removes
    the worm and relieves the tissue-invasion driver.
  diagnosis_term:
    preferred_term: endoscopic visualization of anisakid larvae
    term:
      id: NCIT:C16546
      label: Endoscopic Procedure
  evidence:
  - reference: PMID:20804423
    reference_title: "Anisakidosis: Perils of the deep."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis and treatment of gastric disease is usually made by a compatible
      dietary history and visualization and removal of the larva(e) on endoscopy
    explanation: >-
      The CID review states that endoscopic visualization and removal usually
      confirms and treats gastric anisakidosis.
- name: Abdominal CT for intestinal anisakiasis
  description: >-
    Computed tomography can suggest intestinal anisakiasis when endoscopy has
    not seen a gastric larva, especially by showing severe submucosal edema,
    ascites, adjacent fat inflammation, and fluid-filled segments without a
    complete obstructing lesion.
  diagnosis_term:
    preferred_term: abdominal computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:24441579
    reference_title: "CT findings of gastric and intestinal anisakiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Severe submucosal edema with ascites is a characteristic finding of
      gastrointestinal anisakiasis when compared with other forms of
      gastroenteritis.
    explanation: >-
      This CT series identifies submucosal edema with ascites as a characteristic
      imaging clue.
- name: Anti-Anisakis IgE serology
  description: >-
    Anti-Anisakis simplex IgE serology supports diagnosis when the presentation
    is intestinal, ectopic, or allergic and the larva is not visualized
    endoscopically.
  diagnosis_term:
    preferred_term: anti-Anisakis immunoglobulin E measurement
    term:
      id: NCIT:C81970
      label: Immunoglobulin E Measurement
  evidence:
  - reference: PMID:20804423
    reference_title: "Anisakidosis: Perils of the deep."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      serologic testing for anti-A. simplex immunoglobulin E can aid in the
      diagnosis of intestinal, ectopic and allergic disease
    explanation: >-
      The review specifically positions anti-A. simplex IgE as an aid for
      intestinal, ectopic, and allergic anisakidosis.
treatments:
- name: Endoscopic Larval Removal
  description: >-
    Endoscopic removal of visible larvae is both diagnostic and therapeutic in
    gastric anisakiasis because the attached larva drives local mucosal injury.
  treatment_term:
    preferred_term: endoscopic larval removal
    term:
      id: NCIT:C64958
      label: Therapeutic Endoscopic Procedure
  target_mechanisms:
  - target: Larval Gastrointestinal Mucosal Invasion
  evidence:
  - reference: PMID:31529811
    reference_title: "Gastro-allergic anisakiasis: The first case reported in Colombia and a literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis and treatment of anisakiasis are made by a dietary history,
      direct visualization and endoscopic extraction of possible larvae, which is
      the only effective therapy.
    explanation: >-
      The literature review describes endoscopic extraction as definitive
      diagnosis and therapy.
- name: Surgical Removal for Complicated Intestinal or Ectopic Disease
  description: >-
    Intestinal or ectopic anisakiasis can require laparoscopy, laparotomy, or
    bowel resection when larvae cause a mass, ulcer, obstruction-like syndrome,
    or perforation beyond the reach of endoscopic extraction.
  target_mechanisms:
  - target: Larval Gastrointestinal Mucosal Invasion
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 36 cases (49.3%), the patients underwent surgery for the removal of the
      lesion, generally a mass or an ulcer.
    explanation: >-
      Half of confirmed Italian cases in the retrospective analysis required
      surgical lesion removal, usually in extra-gastric sites.
  - reference: PMID:20804423
    reference_title: "Anisakidosis: Perils of the deep."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Intestinal and/or ectopic cases may require surgical removal
    explanation: >-
      The review supports surgery for intestinal or ectopic presentations not
      managed by gastric endoscopy.
prevalence:
- population: Confirmed Italian literature cases through January 2018
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A strict retrospective analysis found 73 confirmed human Anisakis spp.
    infections reported in Italy since 1996; 34 additional suspected cases were
    excluded because a larva was not detected and identified.
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In total, 73 cases were included in the analysis, while 34 were excluded.
    explanation: >-
      The retrospective analysis reports how many confirmed cases met its
      larva-detection and identification criteria.

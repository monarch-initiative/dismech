histopathology:
- name: Eosinophilic Granuloma
  description: >-
    Intestinal and ectopic anisakid lesions can present microscopically as
    eosinophilic granulomas in the digestive tract, mesentery, or peritoneum;
    serial sections may be needed to find the embedded larva.
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathologists should take into account the possibility of this parasitic
      infection when examining an eosinophilic granuloma of the digestive tract,
      mesentery or peritoneum.
    explanation: >-
      The review describes eosinophilic granuloma of the digestive tract,
      mesentery, or peritoneum as a microscopic pattern that can represent
      anisakid infection.

name: Anisakiasis
creation_date: '2026-11-14T08:11:29Z'
synonyms:
- anisakidosis
- anisakiosis
- herring worm disease
category: Infectious Disease
description: >-
  Anisakiasis is a food-borne zoonotic helminthiasis acquired by eating raw or
  undercooked marine fish or squid containing third-stage larvae of Anisakidae
  nematodes, most often Anisakis spp. Larvae do not mature in people, who are
  accidental dead-end hosts, but they can penetrate the gastric or intestinal
  mucosa and produce abrupt epigastric or abdominal pain, nausea, vomiting,
  eosinophilic granulomatous lesions, ectopic disease, and rare perforation.
  Anisakis antigens can also trigger IgE-mediated gastro-allergic anisakiasis
  with urticaria, angioedema, bronchospasm, or anaphylaxis after contaminated
  fish ingestion.
disease_term:
  term:
    id: MONDO:0015200
    label: anisakiasis
  preferred_term: Anisakiasis
parents:
- Ascaridida infectious disease
- Intestinal helminthiasis
infectious_agent:
- name: Anisakidae nematodes
  infectious_agent_term:
    preferred_term: Anisakidae
    term:
      id: NCBITaxon:6267
      label: Anisakidae
  description: >-
    Nematodes in the family Anisakidae. Human disease is most often due to
    Anisakis simplex sensu lato, but Pseudoterranova and, rarely, Contracaecum
    larvae also cause anisakidosis, so the agent is bound at family level.
  evidence:
  - reference: PMID:20804423
    reference_title: "Anisakidosis: Perils of the deep."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anisakidosis, human infection with nematodes of the family Anisakidae, is
      caused most commonly by Anisakis simplex and Pseudoterranova decipiens.
    explanation: >-
      This review defines anisakidosis as human infection by Anisakidae nematodes
      and names Anisakis simplex and Pseudoterranova decipiens as the commonest
      agents.
agent_life_cycle:
  description: >-
    Anisakid adult worms mature in cetacean definitive hosts. Eggs hatch in
    seawater, krill acquire larval stages, and predatory marine fish or squid
    become paratenic hosts carrying infective third-stage larvae on viscera or
    in muscle. Humans are accidental dead-end hosts after eating raw or
    undercooked infected seafood; larvae penetrate mucosa but do not develop
    further in people.
  hosts:
  - preferred_term: cetaceans
    term:
      id: NCBITaxon:9721
      label: Cetacea
    role: definitive host
  - preferred_term: krill
    term:
      id: NCBITaxon:6816
      label: Euphausiacea
    role: intermediate host
    description: >-
      Krill acquire anisakid larval stages in seawater before predatory fish or
      squid ingest them and become paratenic hosts.
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental dead-end host
    description: Larvae do not develop further after invading human tissues.
  - preferred_term: ray-finned fishes
    term:
      id: NCBITaxon:7898
      label: Actinopterygii
    role: paratenic host
    description: >-
      Bound to ray-finned fishes because the sources name marine fish as a
      common vehicle. Squid are also paratenic hosts, but the exact cephalopod
      taxonomic breadth is carried in prose rather than forced into a broad
      mollusk term.
  vectors:
  - raw or undercooked marine fish or squid
  life_cycle_stages:
  - name: Third-stage larva in fish and squid
    life_cycle_stage_term:
      preferred_term: parasitic worm stage
      term:
        id: OPL:0000082
        label: parasitic worm stage
    description: >-
      Crustaceans ingest larval stages in seawater; predatory fish and squid
      then acquire infective third-stage larvae, which encyst on visceral
      surfaces and can migrate into the musculature eaten by people.
    evidence:
    - reference: PMID:30058531
      reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        When crustaceans are preyed on by fish or squid, the third stage larvae
        infect their viscera encysting on organ surfaces and, eventually, in the
        musculature
      explanation: >-
        The life-cycle review embedded in this retrospective study describes the
        infective third-stage larvae in fish and squid.
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adult worms are found in the stomach of marine mammals (cetaceans); eggs
      are passed in their faeces and become embryonated in sea water.
    explanation: >-
      Supports adult Anisakidae worms in cetacean definitive hosts and egg
      release into seawater.
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Humans represent an accidental host of these parasites; the zoonotic
      infection is acquired through the consumption of raw or undercooked
      infected marine fish or squids
    explanation: >-
      Establishes humans as accidental hosts infected through raw or undercooked
      infected marine fish or squid.
transmission:
- name: Raw or undercooked seafood ingestion
  description: >-
    People acquire anisakiasis by eating raw or undercooked marine fish or squid
    carrying viable third-stage anisakid larvae.
  evidence:
  - reference: PMID:20804423
    reference_title: "Anisakidosis: Perils of the deep."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Acquired by the consumption of raw or undercooked marine fish or squid
    explanation: >-
      The review identifies raw or undercooked marine fish or squid as the
      acquisition route.
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In most of the patients (65.7%), the source of infection was raw or
      undercooked anchovies, followed by "anchovies or sardines" (15.1%), generic
      "raw seafood" (15.1%), and sardines (1.4%).
    explanation: >-
      The Italian case series found raw or undercooked anchovies and other raw
      seafood as the recognized sources for nearly all confirmed cases with a
      recorded exposure.
pathophysiology:
- name: Ingestion of Infective Anisakid Third-Stage Larvae
  biological_scale: ORGANISM
  description: >-
    Eating raw or undercooked infected fish or squid transfers viable
    third-stage anisakid larvae into the human gastrointestinal tract. Humans
    are accidental hosts, so this is an exposure and tissue-invasion route
    rather than a productive adult-worm infection.
  downstream:
  - target: Larval Gastrointestinal Mucosal Invasion
    causal_link_type: DIRECT
  - target: Anisakis IgE-Mediated Immediate Hypersensitivity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The larvae do not develop further in humans; however, they can penetrate
      the gastrointestinal mucosa or, more rarely, other organs, often with
      clinical consequences.
    explanation: >-
      The review explains why ingested larvae are dead-end in humans yet still
      drive mucosal and ectopic pathology.
- name: Larval Gastrointestinal Mucosal Invasion
  biological_scale: TISSUE
  description: >-
    Third-stage larvae attach to and penetrate gastric or intestinal mucosa,
    causing direct tissue damage and marked submucosal edema that can progress
    to eosinophil-rich granulomatous inflammation.
  downstream:
  - target: Eosinophilic Granulomatous Inflammation
    causal_link_type: DIRECT
  - target: Abdominal Pain
    causal_link_type: DIRECT
  - target: Nausea
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Ascites
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24441579
    reference_title: "CT findings of gastric and intestinal anisakiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Gastric anisakiasis showed marked submucosal edema of the gastric wall
      (20/20 patients, 100%), increased attenuation of adjacent fat (19/20, 95%),
      and ascites (14/20, 70%) on CT.
    explanation: >-
      The gastric CT series documents the edema and perivisceral inflammatory
      findings expected from larval mucosal invasion.
- name: Eosinophilic Granulomatous Inflammation
  biological_scale: TISSUE
  description: >-
    Direct tissue damage from penetrating anisakid larvae recruits eosinophils
    and produces eosinophil-rich gastrointestinal, mesenteric, or peritoneal
    granulomas and abscesses, with ulcers and occasional transmural perforation.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: eosinophil migration
    term:
      id: GO:0072677
      label: eosinophil migration
    modifier: INCREASED
  downstream:
  - target: Abdominal Pain
    causal_link_type: DIRECT
  - target: Intestinal Perforation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24441579
    reference_title: "CT findings of gastric and intestinal anisakiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      After foods containing the Anisakis larvae are ingested, the larvae invade
      the gastric and intestinal walls. Gastrointestinal invasion causes direct
      tissue damage and an allergic reaction of the gastrointestinal wall. The
      damage then develops an eosinophilic granuloma, ulcer, or perforation of
      the gastrointestinal wall
    explanation: >-
      The CT case series introduction summarizes the direct tissue-damage arm in
      which Anisakis larvae invade the gastrointestinal wall and lesions progress
      to eosinophilic granulomas, ulcers, or perforation.
  - reference: PMID:24441579
    reference_title: "CT findings of gastric and intestinal anisakiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The typical inflammatory infiltrate, rich in eosinophils, is seen as an
      eosinophilic granuloma or an eosinophilic abscess.
    explanation: >-
      The CT study discussion ties anisakid direct tissue damage to the
      eosinophil-rich granuloma or abscess lesion.
  - reference: PMID:30058531
    reference_title: "Human anisakiasis in Italy: a retrospective epidemiological study over two decades."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathologists should take into account the possibility of this parasitic
      infection when examining an eosinophilic granuloma of the digestive tract,
      mesentery or peritoneum.
    explanation: >-
      The retrospective review identifies eosinophilic granulomas in the
      digestive tract, mesentery, or peritoneum as a hallmark histologic
      presentation that should prompt consideration of anisakid infection.
- name: Anisakis IgE-Mediated Immediate Hypersensitivity
  biological_scale: CELLULAR
  description: >-
    In sensitized patients, Anisakis somatic and excretory/secretory antigens
    trigger specific IgE and immediate hypersensitivity after exposure. Mast-cell
    degranulation produces urticaria, angioedema, bronchospasm, and sometimes
    anaphylaxis, often together with abdominal pain.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: type I hypersensitivity mediated by mast cells
    term:
      id: GO:0002558
      label: type I hypersensitivity mediated by mast cells
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
  downstream:
  - target: Urticaria
    causal_link_type: DIRECT
  - target: Angioedema
    causal_link_type: DIRECT
  - target: Bronchospasm
    causal_link_type: DIRECT
  - target: Anaphylaxis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10629469
    reference_title: "Gastroallergic anisakiasis: borderline between food allergy and parasitic disease-clinical and allergologic evaluation of 20 patients with confirmed acute parasitism by Anisakis simplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients in groups A and B did not differ with respect to allergic symptoms
      (urticaria, angioedema, erythema, bronchospasm, and anaphylaxis) or the
      mainly light abdominal symptoms (upper abdominal pain, nausea, vomiting,
      and diarrhea).
    explanation: >-
      Acute allergic-reaction patients with gastroscopically confirmed Anisakis
      parasitism had the hypersensitivity symptom spectrum modeled here.
  - reference: PMID:31529811
    reference_title: "Gastro-allergic anisakiasis: The first case reported in Colombia and a literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      la hipersensibilidad inmediata mediada por IgE frente a los antígenos de
      A. simplex
    explanation: >-
      The literature review identifies immediate IgE-mediated hypersensitivity to
      A. simplex antigens as the allergic arm of gastro-allergic anisakiasis.

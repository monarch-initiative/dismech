  evidence:
  - reference: PMID:10629469
    reference_title: "Gastroallergic anisakiasis: borderline between food allergy and parasitic disease-clinical and allergologic evaluation of 20 patients with confirmed acute parasitism by Anisakis simplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Gastric anisakiasis is probably the most frequent clinical entity
      presenting with severe epigastric pain, vomiting, and diarrhea.
    explanation: The abstract lists vomiting among gastric-anisakiasis symptoms.
- name: Diarrhea
  description: Diarrhea can accompany gastric or gastro-allergic anisakiasis.
  phenotype_term:
    preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  evidence:
  - reference: PMID:10629469
    reference_title: "Gastroallergic anisakiasis: borderline between food allergy and parasitic disease-clinical and allergologic evaluation of 20 patients with confirmed acute parasitism by Anisakis simplex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

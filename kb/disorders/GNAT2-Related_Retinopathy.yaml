name: GNAT2-Related Retinopathy
creation_date: "2026-11-02T00:00:00Z"
category: Mendelian
description: >-
  GNAT2-related retinopathy is an autosomal recessive cone photoreceptor
  disorder caused by biallelic pathogenic variants in GNAT2, which encodes the
  cone-specific alpha subunit of transducin, the heterotrimeric G protein that
  couples photoactivated cone opsin to cone cGMP phosphodiesterase (PDE6) in the
  phototransduction cascade. Loss of cone transducin breaks the cascade at the
  G-protein coupling step, so the cone cannot translate light into a response.
  The usual phenotype is complete or incomplete achromatopsia (ACHM4) -- a
  congenital, largely stationary loss of cone function -- although a progressive
  cone-dystrophy presentation with slow visual-acuity deterioration has also been
  reported. This entry captures the GNAT2-specific gene-disease mechanism and
  spectrum; Achromatopsia.yaml models the ACHM4 subtype within the broader
  achromatopsia umbrella and should be consulted for cross-gene comparison within
  that phenotype.
synonyms:
- achromatopsia 4
- GNAT2-related achromatopsia
- GNAT2-related cone dystrophy
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  GNAT2 encodes cone alpha-transducin, the G protein that couples the cone
  pigments to cone PDE6; its lesion is therefore upstream of the PDE6C catalytic
  defect within the same cone cascade. Because loss of transducin prevents
  cascade activation rather than parking cGMP high through loss of hydrolysis,
  the GNAT2 phenotype is classically the more stationary (complete/incomplete
  achromatopsia) end of the cone-cascade spectrum, though a slowly progressive
  cone dystrophy is documented in some families. GNAT2-specific phenotype
  statements are drawn from the GNAT2 gene-discovery and cohort literature and
  the ClinGen Retina GCEP curation rather than generic achromatopsia
  descriptions.

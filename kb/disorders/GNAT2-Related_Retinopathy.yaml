genetic:
- name: GNAT2
  gene_term:
    preferred_term: GNAT2
    term:
      id: hgnc:4394
      label: GNAT2
  relationship_type: CAUSATIVE
  features: >-
    Biallelic GNAT2 variants reported to date are predominantly protein-truncating
    (nonsense and frameshift), consistent with a loss-of-function mechanism;
    reported alleles include the frameshift M280fsX291 and the nonsense allele
    p.R313X (a founder mutation in a large Tunisian pedigree).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_6888747f-55ae-4f8e-a3a8-c77bcd543689-2022-11-03T160000.000Z
    evidence:
    - reference: CGGV:assertion_6888747f-55ae-4f8e-a3a8-c77bcd543689-2022-11-03T160000.000Z
      reference_title: "GNAT2 / GNAT2-related retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "GNAT2 | HGNC:4394 | GNAT2-related retinopathy | MONDO:0800392 | AR | Definitive | SOP9 | Retina Gene Curation Expert Panel | 2022-11-03T16:00:00.000Z"
      explanation: ClinGen Retina GCEP classifies the GNAT2-retinopathy relationship as Definitive (AR).
  variants:
  - name: M280fsX291
    description: Frameshift allele identified in a consanguineous family with cone dystrophy / ACHM4.
    evidence:
    - reference: PMID:12205108
      reference_title: "Mapping of a novel locus for achromatopsia (ACHM4) to 1p and identification of a germline mutation in the alpha subunit of cone transducin (GNAT2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sequence analysis of the candidate gene GNAT2 located within this interval identified a frameshift mutation in exon 7 (c842_843insTCAG; M280fsX291) that segregated with the disease."
      explanation: Reports the M280fsX291 frameshift allele segregating with disease.
  - name: p.R313X
    description: Nonsense founder mutation homozygous in a large Tunisian achromatopsia pedigree.
    evidence:
    - reference: PMID:21107338
      reference_title: "Clinical and genetic investigation of a large Tunisian family with complete achromatopsia: identification of a new nonsense mutation in GNAT2 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients were homozygous for the p.R313X mutation."
      explanation: Reports the homozygous p.R313X nonsense founder allele.
  evidence:
  - reference: PMID:12077706
    reference_title: "Mutations in the cone photoreceptor G-protein alpha-subunit gene GNAT2 in patients with achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrate that GNAT2 is the third gene implicated in achromatopsia."
    explanation: Gene-discovery paper establishing GNAT2 as an achromatopsia gene.
treatments:
- name: AAV cone-directed gene therapy (preclinical)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal AAV delivery of wild-type GNAT2 to cones rescued the
    cone-mediated ERG and visual acuity in the Gnat2 (cpfl3) mouse model of
    achromatopsia; this is preclinical proof-of-concept, not an approved therapy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:17515894
    reference_title: "Restoration of cone vision in a mouse model of achromatopsia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using adeno-associated virus (AAV) gene therapy, we show that it is possible to target cones and rescue both the cone-mediated electroretinogram response and visual acuity in the Gnat2 ( cpfl3 ) mouse model of achromatopsia."
    explanation: Preclinical AAV GNAT2 gene therapy rescues cone function in the mouse model.
- name: Low vision aids and tinted filters
  therapeutic_modality: DEVICE
  description: >-
    Management is supportive. Tinted or filtering lenses reduce photophobia and
    low-vision aids support residual acuity; there is no approved
    disease-modifying therapy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dark or special filter glasses or red-tinted contact lenses to reduce photophobia and potentially improve visual acuity; low vision aids"
    explanation: GeneReviews management of achromatopsia, which includes GNAT2-related (ACHM4) disease.
- name: Genetic counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance warrants genetic counseling and molecular
    confirmation of both alleles.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

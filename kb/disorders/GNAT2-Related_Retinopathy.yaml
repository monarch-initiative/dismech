      label: Autosomal recessive inheritance
  description: >-
    GNAT2-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in GNAT2.
  evidence:
  - reference: PMID:12077706
    reference_title: "Mutations in the cone photoreceptor G-protein alpha-subunit gene GNAT2 in patients with achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the identification of five independent families with achromatopsia that segregate protein-truncation mutations in the GNAT2 gene, located on chromosome 1p13."
    explanation: >-
      Gene-discovery report establishing recessive, biallelic protein-truncating
      GNAT2 variants in achromatopsia families.
  - reference: PMID:20301591
    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews states the autosomal recessive recurrence risks underlying genetic counseling.

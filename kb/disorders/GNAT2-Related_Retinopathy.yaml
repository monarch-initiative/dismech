epidemiology:
- name: Rarity among achromatopsia genes
  description: >-
    GNAT2 is a rare cause of achromatopsia; complete achromatopsia overall
    affects roughly 1 in 30,000 individuals, with GNAT2 accounting for a small
    minority of cases.
  evidence:
  - reference: PMID:17515894
    reference_title: "Restoration of cone vision in a mouse model of achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete achromatopsia is a genetic defect resulting in cone vision loss in 1 in 30,000 individuals."
    explanation: Gives the population frequency of complete achromatopsia, of which GNAT2 is a rare cause.

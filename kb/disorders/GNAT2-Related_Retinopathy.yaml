  description: >-
    Complete or incomplete achromatopsia from biallelic GNAT2 variants: a
    congenital, largely stationary loss of cone function with severe colour
    vision defect, reduced acuity, photophobia and nystagmus.
  subtype_term:
    preferred_term: achromatopsia 4
    term:
      id: MONDO:0013465
      label: achromatopsia 4
  evidence:
  - reference: PMID:12205108
    reference_title: "Mapping of a novel locus for achromatopsia (ACHM4) to 1p and identification of a germline mutation in the alpha subunit of cone transducin (GNAT2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant linkage was detected to a 12 cM autozygous segment between markers D1S485 and D1S2881 on chromosome 1p13."
    explanation: Maps the ACHM4 locus to GNAT2, defining the achromatopsia-4 subtype.
  - reference: PMID:15557429
    reference_title: "Variant phenotypes of incomplete achromatopsia in two cousins with GNAT2 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one best described as incomplete achromatopsia and the other with oligocone trichromacy."
    explanation: Documents the incomplete-achromatopsia / oligocone-trichromacy end of the GNAT2 spectrum.
pathophysiology:
- name: GNAT2 Cone Transducin Deficiency
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >-
    Biallelic GNAT2 variants (typically protein-truncating) abolish the cone
    photoreceptor-specific alpha subunit of transducin. Cone transducin is the G
    protein that couples photoactivated cone opsin to cone PDE6, so its loss is
    the initiating, cone-autonomous lesion in the phototransduction cascade.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GNAT2
    term:
      id: hgnc:4394
      label: GNAT2
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Failure of Cone Light Response Activation
    causal_link_type: DIRECT
    description: Without cone transducin, photoactivated opsin cannot activate cone PDE6.
    evidence:
    - reference: PMID:12205108
      reference_title: "Mapping of a novel locus for achromatopsia (ACHM4) to 1p and identification of a germline mutation in the alpha subunit of cone transducin (GNAT2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The GNAT2 gene codes for cone alpha-transducin, the G protein that couples the cone pigments to cGMP-phosphodiesterase in phototransduction."
      explanation: >-
        Establishes the coupling step GNAT2 performs, so its loss directly blocks
        activation of the cone cascade.
  evidence:
  - reference: PMID:12077706
    reference_title: "Mutations in the cone photoreceptor G-protein alpha-subunit gene GNAT2 in patients with achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GNAT2 encodes the cone photoreceptor-specific alpha-subunit of transducin, a G-protein of the phototransduction cascade, which couples to the visual pigment(s)."
    explanation: Defines GNAT2 as the cone transducin alpha subunit of the phototransduction cascade.
  - reference: CGGV:assertion_6888747f-55ae-4f8e-a3a8-c77bcd543689-2022-11-03T160000.000Z
    reference_title: "GNAT2 / GNAT2-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be biallelic loss-of-function."
    explanation: ClinGen Retina GCEP records biallelic loss of function as the disease mechanism.
- name: Failure of Cone Light Response Activation
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >-
    With transducin unable to relay the signal from opsin to PDE6, the cone
    cannot generate a light response. Cone-driven (photopic) ERG responses are
    absent while rod-driven (scotopic) responses are preserved, the
    electrophysiological signature of a cone-autonomous cascade defect.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: detection of light stimulus involved in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  downstream:
  - target: Congenital Cone Dysfunction
    causal_link_type: DIRECT
  - target: Undetectable cone electroretinogram
    causal_link_type: DIRECT
  evidence:
  - reference: CGGV:assertion_6888747f-55ae-4f8e-a3a8-c77bcd543689-2022-11-03T160000.000Z
    reference_title: "GNAT2 / GNAT2-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Electroretinographic recordings (ERG) show an absent photopic and a normal scotopic response in affected individuals."
    explanation: >-
      Documents the selective loss of cone-driven (photopic) responses with
      preserved rod (scotopic) responses that defines this cone-cascade failure.
- name: Congenital Cone Dysfunction
  conforms_to: "phototransduction_cascade_dysfunction#Congenital Non-Progressive Photoreceptor Dysfunction"
  description: >-
    The characteristic clinical outcome: congenital, largely stationary cone
    dysfunction with poor visual acuity, nystagmus, photophobia and loss of
    colour discrimination in all axes, with preserved scotopic (rod) vision. A
    minority of GNAT2 families instead show a slowly progressive cone dystrophy.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  downstream:
  - target: Color vision defect
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT
  - target: Photophobia
    causal_link_type: DIRECT
  - target: Nystagmus
    causal_link_type: DIRECT
  - target: Central scotoma
    causal_link_type: DIRECT
    description: Foveal cone dysfunction produces a small central scotoma.
  - target: Cone/cone-rod dystrophy
    causal_link_type: DIRECT
    description: >-
      A minority of GNAT2 families diverge from the stationary majority into a
      slowly progressive cone (or cone-rod) dystrophy; this edge marks that
      minority trajectory rather than the stationary norm of the parent node.
  evidence:
  - reference: CGGV:assertion_6888747f-55ae-4f8e-a3a8-c77bcd543689-2022-11-03T160000.000Z
    reference_title: "GNAT2 / GNAT2-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the complete form of ACHM, affected individuals typically present early in life with nystagmus, photophobia, low visual acuity, and total color blindness."
    explanation: Summarises the congenital cone-dysfunction presentation of GNAT2-related complete achromatopsia.
  - reference: PMID:32203983
    reference_title: "Photoreceptor Structure in GNAT2-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cone mosaic in GNAT2-ACHM is relatively well preserved, potentially allowing for a wide therapeutic window for cone-directed interventions."
    explanation: >-
      Structural imaging shows the cone mosaic is relatively preserved in
      GNAT2-ACHM, supporting the stationary (silenced-not-lost) character of the
      cone dysfunction.
  - reference: PMID:29518352
    reference_title: "Loss of cone function without degeneration in a novel Gnat2 knock-out mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of Gnat2 expression abolished cone phototransduction, yet there was no loss of cones, disruption of the photoreceptor mosaic, nor change in general retinal morphology up to at least 9 months of age."
    explanation: >-
      A Gnat2 knockout abolishes cone function without cone degeneration,
      directly supporting the stationary cone-silencing mechanism.

    reference_title: "Achromatopsia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Achromatopsia is inherited in an autosomal recessive manner."
    explanation: GeneReviews confirms the autosomal recessive inheritance underlying genetic counseling.

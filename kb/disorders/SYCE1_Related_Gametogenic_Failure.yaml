    term:
      id: HP:0008209
      label: Premature ovarian insufficiency
  - preferred_term: Primary amenorrhea
    term:
      id: HP:0000786
      label: Primary amenorrhea
  evidence:
  - reference: PMID:25062452
    reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two daughters of consanguineous parents (first cousins) from a 13-member
      family were diagnosed with POI.
    explanation: >-
      Anchors the ovarian-insufficiency branch for which hormone replacement is
      standard management.
- name: Genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling is indicated for affected individuals and their siblings
    because SYCE1-related gametogenic failure is autosomal recessive, informs
    pre-surgical counseling before testicular sperm extraction in affected men,
    and identifies young 46,XX carrier or biallelic siblings who may benefit
    from early fertility-preservation assessment before complete ovarian
    depletion.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34718620
    reference_title: "Variations of C14ORF39 and SYCE1 Identified in Idiopathic Premature Ovarian Insufficiency and Nonobstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study identified novel pathogenic variations of C14ORF39 and SYCE1 in
      sporadic patients with POI or NOA, highlighting the essential role of SC
      genes in the maintenance of ovarian and testicular function.
    explanation: >-
      Identification of causal recessive variants underpins genetic counseling
      and molecular diagnosis for affected families.
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of LP/P variants in established or candidate POI genes
      implies that genetic counselling for NOA has relevance not only to the
      male but also to the female family members. In younger female siblings,
      if presenting the same genotype, fertility preservation could be advised
      prior to ovarian failure.
    explanation: >-
      Highlights cascade genetic counseling across both male and female
      siblings in families segregating SYCE1 variants.
- name: Microdissection testicular sperm extraction (micro-TESE)
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Although microsurgical testicular sperm extraction (micro-TESE) is the
    standard surgical sperm-retrieval intervention offered in idiopathic
    non-obstructive azoospermia, combined multicenter and literature data show
    uniformly negative sperm retrieval (0/14) in men carrying pathogenic or
    likely pathogenic SYCE1 variants due to complete pachytene-stage meiotic
    arrest; pre-TESE genetic diagnosis therefore enables patients to be
    informed that the likelihood of retrieving spermatozoa is virtually zero
    and helps avoid futile invasive surgery.
  treatment_term:
    preferred_term: sperm retrieval
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  target_phenotypes:
  - preferred_term: Non-obstructive azoospermia
    term:
      id: HP:0011961
      label: Non-obstructive azoospermia
  - preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:10374109
    reference_title: "Testicular sperm extraction: microdissection improves sperm yield with minimal tissue excision."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that microdissection TESE can improve sperm
      retrieval for men with non-obstructive azoospermia over that achieved
      with previously described biopsy techniques.
    explanation: >-
      Establishes micro-TESE as the general surgical sperm-retrieval procedure
      considered in men with non-obstructive azoospermia prior to genotype
      stratification.
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in 19 genes were consistently linked to negative TESE outcomes,
      with genes such as MSH4, SYCE1, and TEX11 mutated in a relatively large
      number of patients. Therefore, patients carrying LP/P variants in these
      genes should be informed that the likelihood of obtaining spermatozoa by
      TESE is virtually zero.
    explanation: >-
      Refutes expected sperm recovery by TESE in biallelic pathogenic SYCE1
      carriers (0/14 positive retrievals), supporting pre-surgical molecular
      testing to counsel against futile TESE.

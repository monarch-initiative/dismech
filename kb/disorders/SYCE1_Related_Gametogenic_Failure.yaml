animal_models:
- name: Humanized Syce1 c.721C>T knock-in mouse
  species: Mouse
  description: >-
    CRISPR/Cas9 knock-in mouse carrying the murine equivalent of the human
    familial SYCE1 c.721C>T nonsense mutation exhibits severe Syce1 transcript
    reduction, complete absence of SYCE1 protein, homologous chromosome
    synapsis failure, and recessive infertility, whereas heterozygous
    littermates remain fertile.
  evidence:
  - reference: PMID:32402064
    reference_title: "Familial primary ovarian insufficiency associated with an SYCE1 point mutation: defective meiosis elucidated in humanized mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aiming to validate an approach to circumvent this difficulty, we have
      used the CRISPR/Cas9 technology to generate a mouse model with an SYCE1
      c.721C>T equivalent genome alteration.
    explanation: >-
      Establishes the humanized Syce1 knock-in mouse modeling the human
      familial nonsense mutation.
  modeled_mechanisms:
  - target: Synaptonemal complex assembly failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Homozygous knock-in mice show transcript degradation and complete loss of
      SYCE1 central-element protein.
    evidence:
    - reference: PMID:32402064
      reference_title: "Familial primary ovarian insufficiency associated with an SYCE1 point mutation: defective meiosis elucidated in humanized mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        No SYCE1 protein was detected in homozygous mutants and Syce1 transcript
        level was highly diminished, suggesting transcript degradation as the
        basis of the infertility mechanism.
      explanation: >-
        Demonstrates complete absence of SYCE1 protein in homozygous knock-in
        germ cells.
  - target: Homologous chromosome synapsis failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Homozygous mutant meiocytes fail to complete homologous chromosome
      synapsis during meiotic prophase I.
    evidence:
    - reference: PMID:32402064
      reference_title: "Familial primary ovarian insufficiency associated with an SYCE1 point mutation: defective meiosis elucidated in humanized mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results strongly support a causative role of this mutation for the
        POI phenotype in human patients, and the mechanisms involved would
        relate to defects in homologous chromosome synapsis.
      explanation: >-
        Confirms homologous chromosome synapsis failure in the humanized knock-in
        mouse model.

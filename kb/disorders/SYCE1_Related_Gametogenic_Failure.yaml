    notes: >-
      Primary gonadal and reproductive failure presenting as hypergonadotropic
      primary ovarian insufficiency or primary amenorrhea in 46,XX individuals
      and non-obstructive azoospermia in 46,XY individuals.
    evidence:
    - reference: PMID:34718620
      reference_title: "Variations of C14ORF39 and SYCE1 Identified in Idiopathic Premature Ovarian Insufficiency and Nonobstructive Azoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our study identified novel pathogenic variations of C14ORF39 and SYCE1 in
        sporadic patients with POI or NOA, highlighting the essential role of SC
        genes in the maintenance of ovarian and testicular function.
      explanation: >-
        Establishes SYCE1 deficiency as a primary disorder of ovarian and
        testicular gonadal function.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive meiotic disorder caused by biallelic
      germline loss-of-function variants or deletions in SYCE1.
    evidence:

      reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A nonsense homozygous mutation (c.613C>T) was identified in the SYCE1 gene
        in both affected sisters.
      explanation: >-
        Demonstrates the monogenic autosomal recessive etiology of SYCE1
        deficiency.
prevalence:
- population: Worldwide (reported cases and infertility cohorts)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare monogenic cause of primary ovarian insufficiency and
    non-obstructive azoospermia; combined multicenter and literature curation
    identified 14 male carriers with pathogenic or likely pathogenic SYCE1
    variants and known testicular sperm extraction outcomes alongside multiple
    consanguineous and sporadic 46,XX pedigrees.
  evidence:
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sperm were not recovered in any patient carrying LP/P variants in TEX11 (n
      = 17), SYCE1 (n = 14), and MSH4 (n = 10), indicating that the likelihood
      of obtaining sperm in patients with LP/P variants in these genes is close
      to zero.
    explanation: >-
      Summarizes 14 reported male carriers of pathogenic or likely pathogenic
      SYCE1 variants with known TESE outcomes across combined multicenter and
      literature cohorts.
  - reference: PMID:25062452
    reference_title: "Exome sequencing reveals SYCE1 mutation associated with autosomal recessive primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe for the first time a homozygous mutation in SYCE1 in humans.
    explanation: >-
      Documents the founding consanguineous pedigree establishing rare human
      SYCE1-related primary ovarian insufficiency.
inheritance:
- name: Autosomal recessive inheritance

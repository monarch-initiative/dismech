genetic:
- name: GJA8
  gene_term:
    preferred_term: GJA8
    term:
      id: hgnc:4281
      label: GJA8
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Dominant missense alleles include p.(Pro88Ser), p.(Glu48Lys),
    p.(Pro88Gln), p.(Val44Glu), p.(Trp45Ser), p.(Gly46Val), p.(Asp47Asn),
    p.(Val79Leu), p.(Pro189Leu), p.(Arg198Gln), p.(Arg198Trp) and
    p.(Ser258Phe); p.(Asp51Asn), p.(Gly46Glu) and p.(Gly94Arg) are associated
    with microphthalmia, sclerocornea, aphakia or acorea. Recessive alleles are
    frameshifts: c.670insA p.(Thr203AsnfsX47), ins776G, and c.855delG with
    c.1125delC. p.(Ile247Met), once reported as a cataract allele, behaves as a
    rare polymorphism. No ClinGen gene-disease validity record for GJA8 is
    present in the reference cache or in the committed ClinGen export
    (cache/clingen/gene_validity.csv), so no gene_disease_validity assertion is
    recorded.
  case_fractions:
  - population: Indian probands with congenital or developmental cataract
    case_fraction_percent: 3.3
    cohort_size: 60
    notes: Two of 60 unrelated probands screened by SSCP and sequencing.
    evidence:
    - reference: PMID:16604058
      reference_title: "Novel mutations in GJA8 associated with autosomal dominant congenital cataract and microcornea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in GJA8 cause 3.3% of congenital cataracts in the population of India."
      explanation: GJA8 share of congenital cataract in an Indian series.
  evidence:
  - reference: PMID:9497259
    reference_title: "A missense mutation in the human connexin50 gene (GJA8) underlies autosomal dominant \"zonular pulverulent\" cataract, on chromosome 1q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies provide the first direct evidence that GJA8 plays a vital role in the maintenance of human lens transparency and identify the genetic defect believed to underlie the first inherited disease to be linked to a human autosome."
    explanation: GJA8 identified as the CZP1 cataract gene.
  variants:
  - name: P88S (c.262C>T)
    description: >-
      Second transmembrane domain; zonular pulverulent cataract in the original
      CZP1 family. Forms no channels, is a dominant negative inhibitor of
      wild-type Cx50, and accumulates intracellularly.
    evidence:
    - reference: PMID:9497259
      reference_title: "A missense mutation in the human connexin50 gene (GJA8) underlies autosomal dominant \"zonular pulverulent\" cataract, on chromosome 1q."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This missense mutation is predicted to result in the nonconservative substitution of serine for a phylogenetically conserved proline (P88S)."
      explanation: Identification of P88S.
  - name: E48K
    description: First extracellular domain; zonular nuclear pulverulent cataract.
    evidence:
    - reference: PMID:10480374
      reference_title: "Connexin 50 mutation in a family with congenital \"zonular nuclear\" pulverulent cataract of Pakistani origin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we describe a second mutation (E48K) in connexin 50 that confirms the involvement of this gene in cataractogenesis."
      explanation: Identification of E48K.
  - name: G46V (c.137G>T)
    description: >-
      First extracellular domain; congenital total cataract. Traffics normally
      but forms hyperactive hemichannels that kill expressing cells.
    evidence:
    - reference: PMID:19684000
      reference_title: "A mutant connexin50 with enhanced hemichannel function leads to cell death."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sequencing of the GJA8 gene identified a 137 G>T transition that resulted in the replacement of glycine by valine at position 46 of the coding region of CX50 (CX50G46V)."
      explanation: Identification of G46V in a child with congenital total cataract.
  - name: D51N (c.151G>A)
    description: >-
      First extracellular domain; severe microphthalmia and sclerocornea in a
      de novo case, and acorea-microphthalmia-cataract in a Japanese family.
    evidence:
    - reference: PMID:38052906
      reference_title: "Association of variants in GJA8 with familial acorea-microphthalmia-cataract syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Additionally, another variant, NM_005267.5:c.151G>A (p.D51N) in GJA8, was identified to co-segregate with this syndrome in an unrelated Japanese family."
      explanation: D51N co-segregating with acorea-microphthalmia-cataract.
  - name: c.670insA (p.Thr203AsnfsX47)
    description: >-
      Recessive frameshift that replaces the C-terminal region; the mutant is
      retained in the endoplasmic reticulum.
    evidence:
    - reference: PMID:23772370
      reference_title: "A cataract-causing connexin 50 mutant is mislocalized to the ER due to loss of the fourth transmembrane domain and cytoplasmic domain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results show that a frameshift mutant of connexin 50 mislocalizes to the ER and causes disintegration of the ERGIC and Golgi."
      explanation: Cellular behavior of the recessive frameshift mutant.
  - name: I247M (c.741G>T)
    description: >-
      Earlier proposed as a cataract allele; found in an unaffected parent and
      forms normal channels, so it is treated as a rare polymorphism.
    evidence:
    - reference: PMID:19756179
      reference_title: "The GJA8 allele encoding CX50I247M is a rare polymorphism, not a cataract-causing mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although the CX50I247M substitution has previously been suggested to cause cataracts, our genetic, cellular, and electrophysiological data suggest that this allele more likely represents a rare silent, polymorphic variant."
      explanation: I247M is unlikely to be pathogenic.
animal_models:
- name: Gja8 knockout mouse
  species: Mus musculus
  genotype: Gja8-/-
  publication: PMID:9813099
  modeled_mechanisms:
  - target: Reduced Lens and Eye Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Null mice have microphthalmia, small lenses and zonular pulverulent nuclear cataracts.
    limitations: >-
      Complete loss of Cx50 models recessive null alleles; most human disease
      is heterozygous missense, which may also inhibit wild-type connexins.
    evidence:
    - reference: PMID:9813099
      reference_title: "Targeted ablation of connexin50 in mice results in microphthalmia and zonular pulverulent cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cx50-null mice exhibited microphthalmia and nuclear cataracts."
      explanation: Microphthalmia and cataract in the null mouse.
  - target: Impaired Postnatal Lens Epithelial Cell Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Null lenses lack the postnatal mitotic peak of the lens epithelium.
    limitations: Not examined in human GJA8 lenses.
    evidence:
    - reference: PMID:15326140
      reference_title: "Connexin50 is essential for normal postnatal lens cell proliferation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results demonstrate that Cx50-mediated communication is necessary to achieve peak mitosis."
      explanation: Proliferation defect in Cx50-deficient lenses.
- name: Gja8 D47A (No2) mouse
  species: Mus musculus
  genotype: Gja8 D47A, heterozygous and homozygous
  publication: PMID:31117126
  modeled_mechanisms:
  - target: Reduced Lens Fiber Gap Junctional Coupling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Heterozygous and homozygous lenses have reduced Cx50 and Cx46 levels and reduced fiber coupling.
    limitations: >-
      Mouse missense allele; the human change at the same residue, D47N,
      behaves differently in vitro (it forms heteromeric channels with
      wild-type connexins).
    evidence:
    - reference: PMID:31117126
      reference_title: "The Connexin50D47A Mutant Causes Cataracts by Calcium Precipitation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Gap junctional coupling in differentiating fibers of Cx50D47A lenses was 49% (heterozygotes) and 29% (homozygotes), and in mature fibers, it was 24% (heterozygotes) and 4% (homozygotes) compared to wild-type lenses."
      explanation: Coupling measured in intact mutant lenses.
  - target: Lens Calcium Accumulation and Precipitation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Calcium precipitates in homozygous lenses match the distribution of the cataract.
    limitations: Precipitates were shown in homozygotes; human dominant disease is heterozygous.
    evidence:
    - reference: PMID:31117126
      reference_title: "The Connexin50D47A Mutant Causes Cataracts by Calcium Precipitation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Alizarin red-stained calcium precipitates were present in homozygous Cx50D47A lenses with a similar distribution to the cataracts."
      explanation: Calcium precipitates co-localize with the opacity.
- name: Gja8 G22R (Lop10) mouse
  species: Mus musculus
  genotype: Gja8 G22R, semi-dominant
  publication: PMID:11875045
  modeled_mechanisms:
  - target: Dominant Inhibition of Wild-type Lens Connexins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: The G22R allele is loss of function for Cx50 and reduces phosphorylated Cx46 in vivo.
    limitations: >-
      The same G22R substitution was later found in BALB/c dense cataract and
      microphthalmia (dcm) mice with recessive inheritance (PMID:20861565), so
      its dominance in mice is not fixed.
    evidence:
    - reference: PMID:11875045
      reference_title: "A Gja8 (Cx50) point mutation causes an alteration of alpha 3 connexin (Cx46) in semi-dominant cataracts of Lop10 mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, we demonstrated that the alpha 8 G22R isoform is a loss-of-function mutant for alpha 8, as well as a dominant mutation for reducing the phosphorylated forms of alpha 3 connexin in vivo."
      explanation: In vivo effect of G22R on Cx46.
- name: Gja8 L7Q (Dca) rat
  species: Rattus norvegicus
  genotype: Gja8 L7Q, semi-dominant
  publication: PMID:18470322
  modeled_mechanisms:
  - target: Reduced Lens and Eye Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygotes have pulverulent cataract with smaller eyes; homozygotes have marked microphthalmia with a hypoplastic lens.
    limitations: Rat N-terminal missense allele not reported in humans.
    evidence:
    - reference: PMID:18470322
      reference_title: "Microphthalmia and cataract in rats with a novel point mutation in connexin 50 - L7Q."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygotes express pulverulent cataract with smaller eyes; homozygotes express marked microphthalmia with hypoplastic lens."
      explanation: Dose-dependent eye and lens growth defect.
diagnosis:
- name: Slit-lamp examination
  description: >-
    Slit-lamp biomicroscopy documents the presence, laterality and morphology
    of the opacity and examines relatives, in whom mild carrier opacities can
    be found in recessive families. Morphology does not identify the gene.
  diagnosis_term:
    preferred_term: slit-lamp examination
    term:
      id: NCIT:C75583
      label: Slit-lamp Examination
  evidence:
  - reference: PMID:18483562
    reference_title: "A novel GJA8 mutation causing a recessive triangular cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents are consanguineous, and the mother and grandmother suffer from a discrete, symmetric opacity of the fetal lens nucleus."
    explanation: Examination of relatives revealed mild opacities in heterozygous carriers.
- name: Genetic testing for inherited cataract
  description: >-
    GJA8 cataract is identified by sequencing, usually a congenital cataract
    gene panel or exome, with segregation in relatives. Gap junction genes
    (GJA3 and GJA8) are among the most frequent findings in such testing. A
    family that looks dominant can carry biallelic GJA8 alleles.
  diagnosis_term:
    preferred_term: whole exome sequencing or cataract gene panel
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26694549
    reference_title: "Sporadic and Familial Congenital Cataracts: Mutational Spectrum and New Diagnoses Using Next-Generation Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This included a case of autosomal-recessive GJA8 mutations (Family 14) and an X-linked NHS mutation (Family 40) in families that appeared autosomal-dominant on pedigree information."
    explanation: Sequencing reassigned an apparently dominant family to recessive GJA8 cataract.
  - reference: PMID:26694549
    reference_title: "Sporadic and Familial Congenital Cataracts: Mutational Spectrum and New Diagnoses Using Next-Generation Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of the patients with likely causative mutations in our study were found to have variants in the gap junction genes, GJA3 and GJA8 (7/33, 21%), three in familial and four in sporadic cases"
    explanation: Gap junction genes account for a fifth of solved cases in this sequencing cohort.
  - reference: PMID:36262071
    reference_title: "Novel compound heterozygous variant of GJA8 gene in two siblings with congenital cataract mimics an autosomal recessive trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing was performed to identify disease-causing variants followed by a confirmatory Sanger sequencing."
    explanation: Exome sequencing established the GJA8 diagnosis.
differential_diagnoses:
- name: Cataract 14 (GJA3, connexin 46)
  description: >-
    Variants in GJA3, encoding the other lens fiber connexin, also cause
    hereditary congenital cataract; the clinical picture does not distinguish
    them and both genes are on cataract panels.
  disease_term:
    preferred_term: cataract 14 multiple types
    term:
      id: MONDO:0011162
      label: cataract 14 multiple types
  evidence:
  - reference: PMID:35223995
    reference_title: "Mutations of CX46/CX50 and Cataract Development."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disrupted expression of the two connexin proteins Cx46 and Cx50 is directly related to the development of severe cataract in human and mice."
    explanation: Both lens fiber connexins cause hereditary cataract.
- name: Other genetic causes of cataract with microcornea
  description: >-
    Cataract-microcornea also results from variants in CRYAA, CRYGD, CRYBB1 and
    MAF, so the phenotype does not identify GJA8.
  disease_term:
    preferred_term: cataract - microcornea syndrome
    term:
      id: MONDO:0015300
      label: cataract - microcornea syndrome
  evidence:
  - reference: PMID:18334946
    reference_title: "A novel mutation in GJA8 associated with jellyfish-like cataract in a family of Indian origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in CRYAA (OMIM 123580), CRYBB1 (OMIM 600929), GJA8 (OMIM 600897), and MAF (OMIM 177075) have been reported in families affected with cataract-microcornea syndrome"
    explanation: Several genes cause the same cataract-microcornea phenotype.
  - reference: PMID:17724170
    reference_title: "Genetic heterogeneity in microcornea-cataract: five novel mutations in CRYAA, CRYGD, and GJA8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation (P189L) affected the gap junction protein alpha 8 (GJA8), and one mutation (Y134X) was detected in crystallin gamma-D (CRYGD)."
    explanation: Same phenotype caused by GJA8 and CRYGD variants in one series.
- name: Isolated microphthalmia of other genetic cause
  description: >-
    GJA8 variants were found in a cohort screened for anophthalmia,
    microphthalmia and coloboma, so GJA8 belongs on microphthalmia panels as
    well as cataract panels.
  disease_term:
    preferred_term: isolated microphthalmia
    term:
      id: MONDO:0000062
      label: isolated microphthalmia
  evidence:
  - reference: PMID:29464339
    reference_title: "New GJA8 variants and phenotypes highlight its critical role in a broad spectrum of eye anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following screening of GJA8 in a cohort of 426 individuals with severe congenital eye anomalies, primarily anophthalmia, microphthalmia and coloboma, we identified four known"
    explanation: GJA8 variants in a microphthalmia and coloboma cohort.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction for visually significant opacity, followed by optical
    correction (contact lens or intraocular lens) and amblyopia therapy. The
    cited outcomes come from infantile cataract cohorts of all causes. Visual
    axis opacification and glaucoma are the main long-term complications. No
    GJA8-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:35307324
    reference_title: "Current management of infantile cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Better visual outcomes in operated eyes, however, are achieved in the setting of early presentation, bilateral infantile cataracts, absence of nystagmus or strabismus, and consistent amblyopia therapy."
    explanation: Review of infantile cataract surgery outcomes of any cause; not specific to GJA8.
  - reference: PMID:35307324
    reference_title: "Current management of infantile cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The most common complications of cataract surgery performed in infancy are visual axis opacification and, in about a third of patients, the long-term development of glaucoma."
    explanation: Complications of infantile cataract surgery in general.
  - reference: PMID:36107778
    reference_title: "Surgical interventions for bilateral congenital cataract in children aged two years and under."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "There is no high level evidence for the effectiveness of one type of surgery for bilateral congenital cataracts over another, or whether surgery itself is better than primary aphakia."
    explanation: Cochrane review of bilateral congenital cataract surgery of any cause; the choice of surgical approach is not settled by trials.
- name: Genetic Counseling
  description: >-
    Counseling on dominant transmission with variable morphology, and on the
    possibility of recessive inheritance with mildly affected carriers.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36262071
    reference_title: "Novel compound heterozygous variant of GJA8 gene in two siblings with congenital cataract mimics an autosomal recessive trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Our report shows compound heterozygous variant of GJA8 gene may mimic autosomal recessive inheritance pattern, and reminds clinicians to perform needful examination."
    explanation: The inheritance pattern of GJA8 cataract can be misread, which counseling has to address.
discussions:
- discussion_id: gja8_allele_severity_spectrum
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do a few GJA8 missense alleles (G94R, D51N, G46E) cause
    microphthalmia, sclerocornea, aphakia or acorea, while most cause isolated
    cataract with or without microcornea?
  attaches_to:
  - has_subtypes#Severe ocular malformation
  - pathophysiology#Reduced Lens and Eye Growth
  rationale: >-
    The severe alleles cluster in specific residues and G94R correlates with
    sclerocornea across families, but the functional studies cited in this
    entry do not explain why these alleles add anterior segment and globe
    malformations. The mouse growth defect accounts for a small eye, not for
    sclerocornea or acorea.
  evidence:
  - reference: PMID:40301690
    reference_title: "GJA8-associated developmental eye disorders: a new multicentre study highlights mutational hotspots and genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we confirm an important genotype-phenotype correlation between sclerocornea and the p.(Gly94Arg) variant"
    explanation: The genotype-phenotype correlation is established; its mechanism is not.
- discussion_id: lens_circulation_in_human_gja8
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the calcium precipitation shown in Cx50 mutant mouse lenses also
    form the opacity in human GJA8 cataract?
  attaches_to:
  - pathophysiology#Lens Calcium Accumulation and Precipitation
  - pathophysiology#Disrupted Lens Internal Circulation
  rationale: >-
    The circulation and calcium-precipitate chain was measured in homozygous
    and heterozygous mouse lenses carrying D47A, a mouse allele; the studies
    cited here do not examine human GJA8 lenses. Lens material obtained at
    cataract surgery would allow the test directly.
  evidence:
  - reference: PMID:31117126
    reference_title: "The Connexin50D47A Mutant Causes Cataracts by Calcium Precipitation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest that mutant lens fiber connexins lead to calcium precipitates, which may cause cataracts."
    explanation: The authors frame the calcium mechanism as a suggestion from the mouse model.
notes: >-
  No GJA8-specific prevalence estimate exists. No GeneReviews chapter covers
  CTRCT1 or GJA8 cataract: cache/bookshelf/genereviews.csv lists two
  cataract chapters, neither about GJA8. Heterozygous 1q21 microdeletions that
  include GJA8 were found in families with coloboma (PMID:29464339), but the
  authors state that their genotype-phenotype correlation remains to be
  established, so they are not treated as a cause here. Common GJA8
  polymorphisms studied for age-related cataract susceptibility are outside the
  scope of this entry. PMID:14627691 (an Iranian family with progressive
  nuclear cataract) was cached with no quotable text and is not cited.

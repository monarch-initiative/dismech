  - reference: PMID:19684000
    reference_title: "A mutant connexin50 with enhanced hemichannel function leads to cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "CX50G46V-induced cell death was prevented by high concentrations of extracellular calcium ions."

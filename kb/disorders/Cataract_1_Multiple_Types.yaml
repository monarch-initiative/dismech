- name: Reduced Lens Fiber Gap Junctional Coupling
  biological_scale: CELLULAR
  description: >-
    Lens fiber cells depend on Cx50 and Cx46 gap junctions to exchange ions,
    water and metabolites with the surface of the avascular lens. In Cx50 D47A
    mouse lenses, Cx50 and Cx46 protein levels fall and coupling between fibers
    drops, most in mature central fibers.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: gap junction-mediated intercellular transport
    term:
      id: GO:1990349
      label: gap junction-mediated intercellular transport
    modifier: DECREASED
  locations:
  - preferred_term: lens of camera-type eye
    term:
      id: UBERON:0000965

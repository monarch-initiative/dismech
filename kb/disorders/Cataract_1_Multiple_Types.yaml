name: Cataract 1 Multiple Types
creation_date: "2026-10-31T08:57:27Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT1
- CZP1
- cataract 1, multiple types
- cataract 1, multiple types, with or without microcornea
- GJA8 cataract (disease)
- cataract (disease) caused by mutation in GJA8
description: >-
  Inherited, usually congenital, bilateral cataract caused by germline variants
  in GJA8 on 1q21, which encodes connexin 50 (Cx50), a gap junction protein of
  lens epithelial and fiber cells. Most families carry a heterozygous missense
  variant and show autosomal dominant transmission; the first allele, P88S, was
  found in the eight-generation British family in which zonular pulverulent
  cataract (the CZP1 locus) had been the first inherited disease linked to a
  human autosome. Cataract morphology varies between and within families
  (zonular or nuclear pulverulent, lamellar pulverulent, Y-sutural
  "balloon-like", "jellyfish-like", triangular nuclear, total), and many
  families also have microcornea, sometimes with myopia. A few missense
  alleles (G46E, D51N, G94R) are associated with microphthalmia, sclerocornea,
  coloboma, congenital aphakia or acorea together with cataract. Rare biallelic
  frameshift alleles cause recessive cataract, with mild or no lens opacity in
  heterozygous carriers. Mutant Cx50 fails to form functional channels, is
  retained intracellularly, or inhibits co-expressed wild-type Cx50 and Cx46;
  in mouse models the resulting loss of fiber cell coupling disrupts the lens
  internal circulation, so calcium accumulates and precipitates where the
  opacities form. Loss of Cx50 also curbs postnatal lens epithelial
  proliferation, which accounts for the small lens and eye in mice. Management
  is lens extraction with optical correction and amblyopia therapy; there is
  no genotype-directed treatment.
disease_term:
  preferred_term: cataract 1 multiple types
  term:
    id: MONDO:0007285
    label: cataract 1 multiple types
has_subtypes:
- name: Autosomal dominant
  display_name: Autosomal dominant GJA8 cataract (with or without microcornea)
  description: >-
    Heterozygous GJA8 missense variants segregating with congenital cataract of
    variable morphology, with or without microcornea, in multigeneration
    families. This is the common form.
  evidence:
  - reference: PMID:9497259
    reference_title: "A missense mutation in the human connexin50 gene (GJA8) underlies autosomal dominant \"zonular pulverulent\" cataract, on chromosome 1q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the entire protein-coding region of the GJA8 gene from the pedigree detected a C-->T transition in codon 88, which introduced a novel MnlI restriction-enzyme site that also cosegregated with the cataract."
    explanation: First dominant GJA8 allele, P88S, cosegregating with zonular pulverulent cataract.
  - reference: PMID:16604058
    reference_title: "Novel mutations in GJA8 associated with autosomal dominant congenital cataract and microcornea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations cosegregated with the diseased phenotype in an autosomal dominant manner and were absent in 400 normal control chromosomes analyzed."
    explanation: Dominant segregation of V44E and R198Q with cataract and microcornea.
- name: Autosomal recessive
  display_name: Autosomal recessive GJA8 cataract
  description: >-
    Homozygous or compound heterozygous frameshift alleles (c.670insA,
    p.Thr203AsnfsX47; ins776G; c.855delG with c.1125delC) cause congenital
    cataract in affected sibs, while heterozygous carriers have mild opacities
    or none.
  evidence:
  - reference: PMID:17601931
    reference_title: "Mutation of the gap junction protein alpha 8 (GJA8) gene causes autosomal recessive cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single base insertion leading to frameshift at codon 203 of connexin 50 was found to co-segregate with disease in the family."
    explanation: Recessive frameshift allele in a family with autosomal recessive congenital cataract.
  - reference: PMID:18483562
    reference_title: "A novel GJA8 mutation causing a recessive triangular cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ins776G mutation most likely causes a recessive triangular cataract with variable expressivity of a weak phenotype in heterozygotes."
    explanation: Second recessive frameshift, with a weak heterozygote phenotype.
- name: Severe ocular malformation
  display_name: GJA8 cataract with microphthalmia, sclerocornea, aphakia or acorea
  description: >-
    Heterozygous missense variants, including G46E, D51N and G94R, associated
    with microphthalmia, sclerocornea, coloboma, congenital aphakia or acorea
    as well as cataract. These are kept in this entry because they are allelic
    to the dominant cataract alleles, cataract with microphthalmia co-segregates
    in the same families, and MONDO has no separate term for them.
  evidence:
  - reference: PMID:29464339
    reference_title: "New GJA8 variants and phenotypes highlight its critical role in a broad spectrum of eye anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of these co-segregated with cataracts and microphthalmia, whereas the variant p.(Gly94Arg) was identified in an individual with congenital aphakia, sclerocornea, microphthalmia and coloboma."
    explanation: GJA8 missense variants in a cohort with severe congenital eye anomalies.
  - reference: PMID:38052906
    reference_title: "Association of variants in GJA8 with familial acorea-microphthalmia-cataract syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, another variant, NM_005267.5:c.151G>A (p.D51N) in GJA8, was identified to co-segregate with this syndrome in an unrelated Japanese family."
    explanation: D51N and G46E co-segregate with acorea, microphthalmia and cataract.
  - reference: PMID:40301690
    reference_title: "GJA8-associated developmental eye disorders: a new multicentre study highlights mutational hotspots and genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their associated phenotypes ranged from isolated cataracts to a combination of microphthalmia and cataract with/without sclerocornea."
    explanation: Fifteen families with heterozygous GJA8 variants span isolated cataract through microphthalmia with sclerocornea.
inheritance:
- name: Autosomal Dominant
  description: >-
    Dominant transmission of heterozygous missense alleles, including P88S,
    E48K, P88Q, V44E, R198Q, R198W and W45S, in multigeneration families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10480374
    reference_title: "Connexin 50 mutation in a family with congenital \"zonular nuclear\" pulverulent cataract of Pakistani origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report linkage of a three-generation family of Pakistani origin with autosomal dominant cataract \"zonular nuclear\" pulverulent type (CZNP) on chromosome 1q21.1."
    explanation: Dominant cataract family linked to the GJA8 region, carrying E48K.
  - reference: PMID:20806042
    reference_title: "A novel mutation in GJA8 causing congenital cataract-microcornea syndrome in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This change co-segregated with all affected members of the family, but was not detected either in the non-carrier relatives or in the 100 normal controls."
    explanation: Dominant segregation of R198W in a four-generation family.
- name: Autosomal Recessive
  description: >-
    Recessive transmission of biallelic frameshift alleles; heterozygous
    carriers may show mild opacities, so some families look dominant with
    reduced penetrance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17601931
    reference_title: "Mutation of the gap junction protein alpha 8 (GJA8) gene causes autosomal recessive cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results confirm involvement of GJA8 in autosomal recessive cataract."
    explanation: Recessive GJA8 cataract in an Indian family.
  - reference: PMID:36262071
    reference_title: "Novel compound heterozygous variant of GJA8 gene in two siblings with congenital cataract mimics an autosomal recessive trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents showed mildly impaired vision, but only the father had mild nuclear opacities, suggesting an autosomal dominant trait with reduced penetrance in one of the pathogenic alleles."
    explanation: Compound heterozygous frameshifts in affected sibs, with a mildly affected carrier parent.
pathophysiology:
- name: GJA8 Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Germline GJA8 variants alter connexin 50. Most are heterozygous missense
    substitutions, many in the first extracellular and transmembrane domains
    (P88S, P88Q, E48K, V44E, W45S, G46V, D47N, D51N, V79L); the recessive
    alleles are frameshifts that replace the C-terminal part of the protein.
    Different alleles act through different routes: absent channel function,
    failure to reach the plasma membrane, dominant inhibition of wild-type lens
    connexins, altered gating, or, for G46V, excess hemichannel activity.
  genes:
  - preferred_term: GJA8
    term:
      id: hgnc:4281
      label: GJA8
  genetic_context:
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:24005045
    reference_title: "Functional effects of Cx50 mutations associated with congenital cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, each mutation produced distinct changes in the properties of junctional coupling."
    explanation: Three dominant cataract alleles (V44E, D47N, V79L) each alter coupling in a different way.
  downstream:
  - target: Loss of Connexin 50 Channel Function
    causal_link_type: DIRECT
    description: Most tested alleles form no functional gap junction channels on their own.
    evidence:
    - reference: PMID:10362609
      reference_title: "Molecular mechanism underlying a Cx50-linked congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, the P88S mutant connexin failed to form functional gap junctional channels when paired homotypically."
      explanation: P88S forms no homotypic channels in paired oocytes.
    - reference: PMID:40158616
      reference_title: "Different GJA8 missense variants reveal distinct pathogenic mechanisms in congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All mutants failed to form functional hemichannels and gap junction channels."
      explanation: V44M, R76C and S258F all lack channel and hemichannel function.
  - target: Mutant Connexin 50 Mistrafficking and Intracellular Retention
    causal_link_type: DIRECT
    description: Several alleles do not reach the plasma membrane and accumulate inside the cell.
    evidence:
    - reference: PMID:16397066
      reference_title: "A novel GJA8 mutation is associated with autosomal dominant lamellar pulverulent cataract: further evidence for gap junction dysfunction in human cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The lack of function was associated with improper targeting to the plasma membrane, most probably due to protein misfolding."
      explanation: P88Q is misfolded and mistargeted.
  - target: Dominant Inhibition of Wild-type Lens Connexins
    causal_link_type: DIRECT
    description: Some alleles inhibit or alter channels formed with co-expressed wild-type Cx50 or Cx46.
    evidence:
    - reference: PMID:10362609
      reference_title: "Molecular mechanism underlying a Cx50-linked congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, the P88S mutant functioned in a dominant negative manner as an inhibitor of human connexin 50 gap junctional channels when coinjected with wild-type connexin 50 cRNA."
      explanation: P88S is a dominant negative inhibitor of wild-type Cx50.
  - target: Enhanced Connexin 50 Hemichannel Activity
    causal_link_type: DIRECT
    description: The G46V allele traffics normally but produces abnormally large hemichannel currents.
    evidence:
    - reference: PMID:19684000
      reference_title: "A mutant connexin50 with enhanced hemichannel function leads to cell death."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In single Xenopus oocytes, CX50G46V induced connexin hemichannel currents that were activated by removal of external calcium; their magnitudes were much higher than those in oocytes injected with similar amounts of CX50 cRNA."
      explanation: G46V produces excess hemichannel current.
- name: Mutant Connexin 50 Mistrafficking and Intracellular Retention
  biological_scale: CELLULAR
  description: >-
    Mutant Cx50 subunits (P88S, P88Q, S50P, G22R, the c.670insA frameshift)
    accumulate in cytoplasmic membranes or the endoplasmic reticulum instead of
    forming gap junction plaques. The frameshift mutant also partially blocks
    transport of wild-type Cx50 to the plasma membrane. In mouse lenses carrying
    S50P or G22R, retained protein is accompanied by a modest unfolded protein
    response.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:12800976
    reference_title: "Loss of function and impaired degradation of a cataract-associated mutant connexin50."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, these results suggest that the P to S mutation at amino acid residue 88 causes a defect that leads to decreased degradation and subsequent accumulation of hCx50P88S in a cellular structure different from aggresomes."
    explanation: P88S accumulates intracellularly in transfected cells.
  - reference: PMID:23772370
    reference_title: "A cataract-causing connexin 50 mutant is mislocalized to the ER due to loss of the fourth transmembrane domain and cytoplasmic domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of the frameshift mutant partially inhibited the transport of wild type connexin 50 to the plasma membrane."
    explanation: The recessive frameshift mutant is retained in the ER and impairs wild-type Cx50 transport.
  - reference: PMID:22713599
    reference_title: "The unfolded protein response is activated in connexin 50 mutant mouse lenses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for the S50P or G22R mutation of connexin 50 have reduced amounts of connexin 50 protein at the cell membrane, with some intracellular staining consistent with retention in the endoplasmic reticulum."
    explanation: Reduced membrane Cx50 and ER retention in mutant mouse lenses.
  downstream:
  - target: Reduced Lens Fiber Gap Junctional Coupling
    causal_link_type: DIRECT
    description: Protein that never reaches the membrane cannot form intercellular channels.
  - target: Lens Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: ER-retained mutant connexin activates the unfolded protein response.
    evidence:
    - reference: PMID:22713599
      reference_title: "The unfolded protein response is activated in connexin 50 mutant mouse lenses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Connexin 50 mutants have elevated levels of BiP expression in both lens epithelial and fiber cells from E15.5 with the most robust elevation detected in newborns."
      explanation: BiP induction in lenses of S50P and G22R mice.
- name: Lens Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  description: >-
    Lenses of Cx50 S50P and G22R mice show raised BiP and increased Xbp1
    splicing. The authors judge the response too modest to be a major driver of
    the cataract, so this node is a contributing branch rather than the main
    path, and no edge from it to the opacity is asserted.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:22713599
    reference_title: "The unfolded protein response is activated in connexin 50 mutant mouse lenses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, these data suggest that UPR may be a contributing factor to the phenotype of connexin 50 mutant lenses even though the relatively modest extent of the response suggests that it is unlikely to be a major driver of the pathology."
    explanation: UPR activation is present but modest in Cx50 mutant lenses.
- name: Loss of Connexin 50 Channel Function
  biological_scale: MOLECULAR
  description: >-
    Homomeric channels of most cataract-associated Cx50 mutants do not conduct.
    In mice, the D47A (No2) and G22R (Lop10) alleles are loss-of-function
    mutants, and D47A acts without strong dominant inhibition in oocytes.
  genes:
  - preferred_term: GJA8
    term:
      id: hgnc:4281
      label: GJA8
  molecular_functions:
  - preferred_term: gap junction channel activity
    term:
      id: GO:0005243
      label: gap junction channel activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: gap junction
    term:
      id: GO:0005921
      label: gap junction
  evidence:
  - reference: PMID:10393059
    reference_title: "Characterization of a mouse Cx50 mutation associated with the No2 mouse cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that the D47A mutation acts as a loss-of-function mutation without strong dominant inhibition."
    explanation: The No2 allele lacks channel function in oocytes.
  - reference: PMID:16397066
    reference_title: "A novel GJA8 mutation is associated with autosomal dominant lamellar pulverulent cataract: further evidence for gap junction dysfunction in human cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "hCx50P88Q did not induce intercellular conductance and significantly inhibited gap junctional activity of co-expressed wild type hCx50 RNA in paired Xenopus oocytes."
    explanation: P88Q forms no conducting channels.
  downstream:
  - target: Reduced Lens Fiber Gap Junctional Coupling
    causal_link_type: DIRECT
    description: Fewer conducting Cx50 channels lower coupling between fiber cells.
  - target: Impaired Lens Fiber Cell Maturation
    causal_link_type: DIRECT
    description: Loss of Cx50 delays organelle and nuclear degradation in maturing fibers.
    evidence:
    - reference: PMID:11782410
      reference_title: "Disruption of Gja8 (alpha8 connexin) in mice leads to microphthalmia associated with retardation of lens growth and lens fiber maturation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "More importantly, a delayed denucleation process was observed in the interior fibers of the alpha8-/- lenses."
      explanation: Delayed fiber denucleation in Gja8 null lenses.
  - target: Impaired Postnatal Lens Epithelial Cell Proliferation
    causal_link_type: DIRECT
    description: Cx50-mediated communication is needed for the postnatal peak of lens epithelial mitosis.
    evidence:
    - reference: PMID:15326140
      reference_title: "Connexin50 is essential for normal postnatal lens cell proliferation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results demonstrate that Cx50-mediated communication is necessary to achieve peak mitosis."
      explanation: Cx50 knockout lenses lack the postnatal mitotic peak.
- name: Impaired Lens Fiber Cell Maturation
  biological_scale: CELLULAR
  description: >-
    Maturing lens fibers normally degrade their nuclei and organelles. In
    Gja8 null and Cx50 D47A mouse lenses, nuclear remnants and organelle
    proteins persist in deep fibers and some crystallins are reduced. Whether
    this contributes to the human opacity has not been tested.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: lens fiber cell differentiation
    term:
      id: GO:0070306
      label: lens fiber cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:24204043
    reference_title: "Connexin50D47A decreases levels of fiber cell connexins and impairs lens fiber cell differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "They also implicate Cx50 in fiber cell differentiation, since mutant lenses showed impaired degradation of organelles and decreased levels of some crystallins."
    explanation: Impaired organelle degradation in Cx50 D47A lenses.
  - reference: PMID:24204043
    reference_title: "Connexin50D47A decreases levels of fiber cell connexins and impairs lens fiber cell differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The lenses of Cx50D47A mice showed persistence of nuclear remnants in deep regions of the lens"
    explanation: Retained nuclear remnants in mutant fibers.
  downstream:
  - target: Loss of Lens Transparency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Retained organelles in central fibers are a plausible source of light
      scatter; the cited studies show the defect alongside the cataract but do
      not show that it causes the opacity.
- name: Dominant Inhibition of Wild-type Lens Connexins
  biological_scale: MOLECULAR
  description: >-
    Mutant subunits co-assemble with wild-type Cx50 or Cx46. P88S and P88Q
    abolish or reduce wild-type Cx50 coupling, V44E silences channels formed
    with wild-type Cx46 and Cx50, and S50P and D47N form heteromeric channels
    with altered properties. This is one way a heterozygous variant can cause
    disease while null alleles are recessive in mice.
  molecular_functions:
  - preferred_term: gap junction channel activity
    term:
      id: GO:0005243
      label: gap junction channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24005045
    reference_title: "Functional effects of Cx50 mutations associated with congenital cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the mutant did not form functional gap junctions when expressed alone, or with wild-type (WT) Cx46 and Cx50, indicating that V44E is a dominant negative inhibitor of WT connexin function."
    explanation: V44E inhibits wild-type Cx46 and Cx50.
  - reference: PMID:18003700
    reference_title: "The cataract-inducing S50P mutation in Cx50 dominantly alters the channel gating of wild-type lens connexins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the mixed expression of Cx50-S50P and wild-type subunits of either Cx50 or Cx46 - to create heteromeric gap junctions - resulted in functional intercellular channels with altered voltage-gating properties compared with homotypic wild-type channels."
    explanation: S50P alters gating of heteromeric channels with wild-type connexins.
  - reference: PMID:11875045
    reference_title: "A Gja8 (Cx50) point mutation causes an alteration of alpha 3 connexin (Cx46) in semi-dominant cataracts of Lop10 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Targeted null mutations in Gja8 and Gja3 in mice cause cataracts with recessive inheritance."
    explanation: Null alleles are recessive in mice, unlike the semi-dominant missense alleles.
  - reference: PMID:11782410
    reference_title: "Disruption of Gja8 (alpha8 connexin) in mice leads to microphthalmia associated with retardation of lens growth and lens fiber maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "while the alpha8 heterozygous (+/-) mice have relatively normal eyes and lenses."
    explanation: Heterozygous Gja8 null mice are near normal, so simple halving of Cx50 does not explain dominant disease.
  downstream:
  - target: Reduced Lens Fiber Gap Junctional Coupling
    causal_link_type: DIRECT
    description: Inhibition of wild-type channels lowers fiber cell coupling below the level set by the mutant allele alone.
- name: Enhanced Connexin 50 Hemichannel Activity
  biological_scale: MOLECULAR
  description: >-
    The G46V allele, found in a child with congenital total cataract, forms
    functional gap junction channels but hemichannels with much larger currents
    than wild type; its expression kills cells, and high extracellular calcium
    prevents the death. This route has been shown only in cultured cells and
    oocytes and only for this allele.
  molecular_functions:
  - preferred_term: gap junction hemi-channel activity
    term:
      id: GO:0055077
      label: gap junction hemi-channel activity
    modifier: INCREASED
  evidence:
  - reference: PMID:19684000
    reference_title: "A mutant connexin50 with enhanced hemichannel function leads to cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The biochemical results indirectly suggest a potential novel mechanism by which connexin mutants could lead to cataracts: cytotoxicity due to enhanced hemichannel function."
    explanation: Enhanced hemichannel activity of G46V is proposed as a cytotoxic route to cataract.
  downstream:
  - target: Lens Cell Death
    causal_link_type: DIRECT
    description: Excess hemichannel opening increases apoptosis of expressing cells.
    evidence:
    - reference: PMID:19684000
      reference_title: "A mutant connexin50 with enhanced hemichannel function leads to cell death."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Induction of CX50G46V expression led to a decrease in the number of cells and an increase in the proportion of apoptotic cells."
      explanation: G46V expression increases apoptosis in HeLa cells.
- name: Lens Cell Death
  biological_scale: CELLULAR
  description: >-
    Death of cells expressing the hyperactive G46V hemichannel. Shown in HeLa

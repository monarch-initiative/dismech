name: TPM2-Related Myopathy
creation_date: '2026-10-23T00:00:00Z'
category: Mendelian
description: >-
  TPM2-related myopathy is a congenital myopathy caused by pathogenic variants in TPM2,
  which encodes beta-tropomyosin (Tpm2.2), the tropomyosin isoform that runs along the
  actin thin filament of slow and, to a lesser extent, fast skeletal muscle fibres and,
  together with troponin, switches actin-myosin interaction on and off in response to
  calcium. Most patients carry a heterozygous, often de novo, missense change or
  single-residue in-frame deletion; the mutant protein is expressed and enters the
  thin filament. Biopsy findings span nemaline rods, subsarcolemmal cap structures,
  congenital fibre-type disproportion and core-rod changes, sometimes in members of
  one family or in serial biopsies of one patient, so these are histological variants
  of a single gene disorder rather than separate diseases. Clinically there is
  congenital or childhood-onset, slowly progressive weakness of facial, proximal and
  distal muscles that is usually milder than in TPM3 or ACTA1 disease, with variable
  respiratory involvement. A second functional axis cuts across the histology: variants
  that lower thin-filament calcium sensitivity produce weakness, whereas variants that
  raise it produce hypercontractility, with limb, jaw and finger contractures that
  overlap the distal arthrogryposes caused by the same gene. Rare biallelic null or
  splice variants abolish the skeletal beta-tropomyosin isoform and cause a recessive
  congenital myopathy with the Escobar variant of multiple pterygium syndrome.
synonyms:
- beta-tropomyosin-related myopathy
- TPM2 myopathy
- congenital myopathy 23
- CMYO23
- nemaline myopathy 4
- NEM4
- cap myopathy 2
- CAPM2

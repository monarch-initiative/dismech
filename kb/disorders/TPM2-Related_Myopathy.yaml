    snippet: "Additionally, although hypercontractile mutations increased Ca2+-sensitivity of the cross-bridge cycle, hypocontractile mutants decreased it."
    explanation: Reconstituted systems confirm reduced calcium sensitivity with hypocontractile variants.
  - reference: PMID:33919826
    reference_title: "Mutations Q93H and E97K in TPM2 Disrupt Ca-Dependent Regulation of Actin Filaments."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The presence of Q93H in homo- and heterodimers strongly decreased activation of the actomyosin ATPase and reduced sensitivity of the thin filament to [Ca2+]."
    explanation: A further hypocontractile variant lowers thin-filament calcium sensitivity.
  downstream:
  - target: Reduced Muscle Fibre Force Generation
    causal_link_type: DIRECT
    evidence:

inheritance:
- name: Autosomal Dominant
  description: >-
    Most pathogenic TPM2 variants are heterozygous and act dominantly. Many arise de novo
    in a simplex proband, and vertical transmission from an affected parent is
    documented, including transmission in which parent and child received different
    histological diagnoses. Expressivity is variable: a single recurrent allele such as
    p.Lys7del produces a remarkable range of phenotypes across families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:24692096
    reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most are heterozygous changes associated with autosomal-dominant disease."
    explanation: States that the TPM2 variant spectrum is predominantly heterozygous and dominant.
  - reference: PMID:17846275
    reference_title: "Congenital myopathy with nemaline rods and cap structures caused by a mutation in the beta-tropomyosin gene (TPM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation, Glu41Lys, in the beta-tropomyosin gene TPM2 was identified in both patients but was absent in their healthy relatives."
    explanation: Documents mother-to-daughter transmission of a TPM2 allele that segregates with disease.
  - reference: PMID:22832343
    reference_title: "Mutations in TPM2 and congenital fibre type disproportion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present two cases in which novel de novo missense mutations in TPM2 are associated with marked fibre size disproportion."
    explanation: Documents de novo dominant TPM2 alleles in simplex patients.
  - reference: PMID:24692096
    reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the 10 families described, the variability in phenotype is quite remarkable, complicating the recognition of any definite clinical and histological phenotype–genotype correlation."
    explanation: Supports variable expressivity of one recurrent allele (p.Lys7del) across families.
- name: Autosomal Recessive
  description: >-
    Rare. Homozygous null or splice-site variants that abolish the skeletal muscle
    beta-tropomyosin isoform cause a recessive congenital myopathy with the Escobar
    variant of multiple pterygium syndrome. Heterozygous parents are clinically
    unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19155175
    reference_title: "Absence of beta-tropomyosin is a new cause of Escobar syndrome associated with nemaline myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification of a homozygous null allele mutation in the TPM2 gene in a patient who presented with a recessive form of nemaline myopathy associated with a non-lethal multiple pterygium syndrome"
    explanation: First recessive TPM2 genotype, a homozygous null allele.
  - reference: PMID:33558124
    reference_title: "Homozygous intronic variants in TPM2 cause recessively inherited Escobar variant of multiple pterygium syndrome and congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parents of the proband, both healthy adults with no clinical features, were heterozygous for the variant."
    explanation: Supports unaffected heterozygous carrier status in recessive families.
has_subtypes:
- name: Nemaline
  display_name: TPM2 nemaline myopathy (NEM4)
  description: >-
    Dominant TPM2 disease with nemaline rods on biopsy. The recurrent p.Lys7del allele
    gives a recognisable course of large-joint contractures in childhood followed by
    slowly progressive weakness in adulthood.
  subtype_term:
    preferred_term: congenital myopathy 23

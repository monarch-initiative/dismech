    evidence_source: IN_VITRO
    snippet: "In vitro studies using recombinant K7del-β-tropomyosin and force measurements from single dissected patient myofibres showed increased myofilament calcium sensitivity."
    explanation: Patient myofibres with p.Lys7del show raised calcium sensitivity.
  - reference: PMID:17194691

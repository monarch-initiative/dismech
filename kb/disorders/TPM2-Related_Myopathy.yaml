notes: >-
  Lump/split decision. MONDO:0100196 is a gene-defined class with two MONDO descendants,
  and ClinGen classifies TPM2 against this class as Definitive for autosomal dominant
  disease. The literature treats the nemaline, cap, fibre-type-disproportion and
  core-rod presentations as one disorder: a single family can carry nemaline myopathy
  in one member and cap disease in another with the same TPM2 allele, and one patient's
  serial biopsies can move from no rods to caps. A single pathograph (TPM2 variant,
  abnormal tropomyosin-actin association, altered calcium regulation of the thin
  filament, sarcomeric structural lesions and reduced force) covers all of them, so this
  is curated as one Disease entry with histological and inheritance strata as
  has_subtypes, following the gene-defined pattern of
  ACTA1-Related_Nemaline_Myopathy.yaml. Nemaline_Myopathy.yaml keeps its NEM4 gene row,
  which carries `curated_in: TPM2-Related_Myopathy` as a pointer to this entry.

  Scope. The distal arthrogryposes caused by TPM2 (DA1A, Sheldon-Hall syndrome DA2B, and
  trismus-pseudocamptodactyly DA7) are allelic and share the hypercontractile mechanism
  recorded below, but are separate MONDO diseases defined by congenital contractures with
  little or no weakness or muscle pathology. They are recorded as a differential
  diagnosis and their mechanism as a pathophysiology branch, not as subtypes, because
  MONDO places them outside this class and they are classified as skeletal rather than
  muscle disease. Patients with contractures and a congenital myopathy on biopsy (for
  example p.Lys7del nemaline myopathy) are in scope.

  Cardiac involvement. One cap disease patient with p.Glu139del was reported with cardiac
  dysfunction (PMID:19345583), described by the authors as the first such report for
  TPM2; it is not recorded as a phenotype because a single case does not establish a
  disease feature.

  MONDO also lists central core myopathy (MONDO:0007294) as a descendant of
  MONDO:0100196. It is not mapped or recorded as a subtype here: central core disease is
  defined by RYR1, and none of the TPM2 sources cited describe central cores as a TPM2
  presentation (the core-rod family has minicores, recorded separately).

  No GeneReviews chapter covers TPM2-related myopathy; the retired nemaline myopathy and
  congenital fibre-type disproportion chapters (PMID:20301465, PMID:20301436) are
  disease-wide and mention TPM2 only in passing, so they are not used as the phenotype
  baseline here. No disease-specific or approved treatment exists; management is the
  general supportive care of congenital myopathy, which this entry does not record
  because no TPM2-specific source states it. The one treatment recorded is a single-case
  anticholinesterase response in cap myopathy with a secondary neuromuscular
  transmission defect.

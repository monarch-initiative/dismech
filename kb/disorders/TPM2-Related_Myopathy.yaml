histopathology:
- name: Caps, Nemaline Rods and Coarse Intermyofibrillar Network
  description: >-
    Subsarcolemmal caps of disarranged thin filaments, nemaline rods, type 1 fibre
    predominance or fibre-type disproportion, an irregular coarse-meshed
    intermyofibrillar network, and broad split myofibrils with jagged Z lines on
    electron microscopy. Caps can be visible only by electron microscopy or appear only
    on a later biopsy, so a single light-microscopic biopsy can miss the diagnosis.
  context: TPM2-related myopathy
  evidence:
  - reference: PMID:19047562
    reference_title: "New morphologic and genetic findings in cap disease associated with beta-tropomyosin (TPM2) mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By electron microscopy, the myofibrils were broad and partly split, and the Z lines appeared jagged. In one of the patients caps structures were identified only by electron microscopy, and in one patient they were identified only in a second biopsy at adulthood."
    explanation: Ultrastructural findings and the time- and method-dependence of cap detection.
  - reference: PMID:22749895
    reference_title: "Myopathies associated with β-tropomyosin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A coarse intermyofibrillar network and jagged Z lines are additional frequent changes."
    explanation: Review summary of frequent accompanying changes.
genetic:
- name: TPM2
  gene_term:
    preferred_term: TPM2
    term:
      id: hgnc:12011
      label: TPM2
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    TPM2 encodes beta-tropomyosin (Tpm2.2), expressed in slow and, to a lesser extent,
    fast skeletal muscle fibres. TPM2 and TPM3 together explained 4.3% of a Danish
    congenital myopathy cohort (two TPM2 and two TPM3 patients of 94), so TPM2 is a rare
    cause of congenital myopathy overall.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_f137b6cf-247a-4af0-b41f-6cb976239175-2021-01-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_f137b6cf-247a-4af0-b41f-6cb976239175-2021-01-04T170000.000Z
      reference_title: "TPM2 / TPM2-related myopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TPM2 | HGNC:12011 | TPM2-related myopathy | MONDO:0100196 | AD | Definitive"
      explanation: ClinGen Definitive classification for autosomal dominant TPM2-related myopathy.
  evidence:
  - reference: CGGV:assertion_f137b6cf-247a-4af0-b41f-6cb976239175-2021-01-04T170000.000Z
    reference_title: "TPM2 / TPM2-related myopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TPM2 | HGNC:12011 | TPM2-related myopathy | MONDO:0100196 | AD | Definitive"
    explanation: ClinGen Definitive classification for autosomal dominant TPM2-related myopathy.
  - reference: PMID:24692096
    reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty distinct pathogenic variants of TPM2 and 20 of TPM3 have been published or listed in the Leiden Open Variant Database"
    explanation: Size of the TPM2 pathogenic variant spectrum as of the mutation update.
  - reference: PMID:24507666
    reference_title: "Frequency and phenotype of patients carrying TPM2 and TPM3 gene mutations in a cohort of 94 patients with congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This indicates a low (4.3%) frequency of TPM2 and TPM3 mutations as a cause of congenital myopathy."
    explanation: Combined TPM2/TPM3 case fraction in a congenital myopathy cohort.
diagnosis:
- name: Muscle Biopsy with Electron Microscopy
  description: >-
    Light microscopy identifies rods, caps or fibre-type disproportion; electron
    microscopy is needed to find small caps, nemaline bodies or minicores that a
    light-microscopic diagnosis of CFTD can miss.
  evidence:
  - reference: PMID:22832343
    reference_title: "Mutations in TPM2 and congenital fibre type disproportion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case emphasises the importance of electron microscopy in patients with presumed congenital fibre type disproportion, to exclude the presence of caps, nemaline bodies or minicores, which, if present, may be very helpful in guiding genetic analysis."
    explanation: States the diagnostic role of electron microscopy.
- name: Whole-Body Muscle MRI
  description: >-
    A cephalic-distal pattern, with masticatory and distal lower-leg involvement and
    relative sparing of the girdles, recurs across TPM2 histologies and is uncommon in
    other myopathies.
  evidence:
  - reference: PMID:22980765
    reference_title: "Whole-Body muscle MRI in a series of patients with congenital myopathy related to TPM2 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cephalic-distal MRI pattern is not frequent in other known myopathies."
    explanation: Supports MRI pattern as a pointer to TPM2.
- name: TPM2 Sequencing
  description: >-
    Sequencing of TPM2, usually within a congenital myopathy panel or exome, assigns the
    genotype. Exome sequencing has identified TPM2 variants where biopsy showed no
    recognisable hallmark.
  evidence:
  - reference: PMID:27726070
    reference_title: "A novel TPM2 gene splice-site mutation causes severe congenital myopathy with arthrogryposis and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the whole exome sequencing (WES) approach we were able to identify a novel heterozygous splice-site mutation within the TPM2 gene, showing the utility of WES in molecular diagnostics of congenital myopathies without recognizable morphological hallmarks."
    explanation: Exome sequencing diagnoses TPM2 disease without a histological hallmark.
differential_diagnoses:
- name: TPM2-Related Distal Arthrogryposis
  description: >-
    Allelic disorders (DA1A, Sheldon-Hall syndrome DA2B, trismus-pseudocamptodactyly
    DA7) defined by congenital contractures of the hands and feet with mild or no
    weakness and little muscle pathology. They share the hypercontractile mechanism and
    overlap the myopathy when weakness and contractures coexist.
  distinguishing_features:
  - Congenital distal contractures with mild or no muscle weakness
  - No major muscle pathology on biopsy
  evidence:
  - reference: PMID:22749895
    reference_title: "Myopathies associated with β-tropomyosin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The distal arthrogryposis syndromes associated with TPM2 mutations include the less severe forms, with congenital contractures mainly of the hands and feet and mild or no muscle weakness."
    explanation: Describes the allelic distal arthrogryposis phenotype.
  - reference: PMID:23401156
    reference_title: "Spectrum of mutations that cause distal arthrogryposis types 1 and 2B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease-causing mutations in 56/153 (37%) kindreds including 14/48 (29%) with DA1 and 42/105 (40%) with DA2B were distributed nearly equally across TNNI2, TNNT3, TPM2, and MYH3."
    explanation: TPM2 is one of four roughly equal contributors to DA1 and DA2B.
- name: TPM3-Related Myopathy
  description: >-
    The slow-fibre tropomyosin gene causes the same histologies (nemaline, cap, CFTD).
    TPM3 disease tends to be more severe and is more often CFTD; distal arthrogryposis
    occurs only with TPM2.
  distinguishing_features:
  - More severe weakness on average
  - Distal arthrogryposis not reported
  evidence:
  - reference: PMID:24692096
    reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with TPM2 mutations tended to present with milder symptoms than those with TPM3 mutations, DA being present only in the TPM2 group."
    explanation: Clinical comparison of TPM2 and TPM3 disease.
- name: Escobar Syndrome Due to Neuromuscular Junction Genes
  description: >-
    The Escobar variant of multiple pterygium syndrome is more often caused by recessive
    variants in CHRNG, CHRNA1, CHRND or RAPSN, as a prenatal form of myasthenia, rather
    than by a sarcomeric gene.
  distinguishing_features:
  - Neuromuscular junction gene genotype
  - No congenital myopathy on biopsy
  evidence:
  - reference: PMID:19155175
    reference_title: "Absence of beta-tropomyosin is a new cause of Escobar syndrome associated with nemaline myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Escobar syndrome has been recently described as a prenatal form of myasthenia associated with recessive mutations in genes of the neuromuscular junction (CHRNG, CHRNA1, CHRND, RAPSN)."
    explanation: Names the usual genetic causes of Escobar syndrome.
treatments:
- name: Anticholinesterase Therapy for Secondary Neuromuscular Transmission Defect
  description: >-
    A TPM2 cap myopathy with myasthenic features and a secondary neuromuscular
    transmission defect responded to anticholinesterase therapy. This is a single case,
    not a general treatment for TPM2 disease; it applies when a congenital myopathy
    shows fatigable weakness with electrophysiological evidence of a transmission
    defect. The specific agent is not named in the abstract, so only the drug class is
    bound.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticholinesterase pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylcholinesterase inhibitor
      term:
        id: NCIT:C47792
        label: Acetylcholinesterase Inhibitor
  target_mechanisms:
  - target: Fatigable Weakness
    treatment_effect: MODULATES
    description: >-
      Enhancing neuromuscular transmission relieves the fatigable component of
      weakness caused by the secondary transmission defect; it does not act on the
      thin-filament lesion.
  evidence:
  - reference: PMID:25127990
    reference_title: "Congenital myopathies with secondary neuromuscular transmission defects; a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a case of cap myopathy with myasthenic features due to a mutation in the TPM2 gene that responded to anticholinesterase therapy."
    explanation: Single-case report of a treatment response in TPM2 cap myopathy with myasthenic features.
animal_models:
- name: Zebrafish expressing TPM2 p.K7del
  species: Zebrafish
  genotype: Transient expression of human wild-type or p.K7del beta-tropomyosin
  publication: PMID:23413262
  description: First animal model of TPM2-related myopathy.
  modeled_mechanisms:
  - target: Sarcomeric Thin-Filament Disorganisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Mutant protein mislocalises in the thin filament and alters sarcomere length.
    limitations: >-
      Transient overexpression of a human protein on a wild-type background, not a
      knock-in at the endogenous locus, so dosage and the ratio of mutant to wild-type
      tropomyosin differ from patients.
    evidence:
    - reference: PMID:23413262
      reference_title: "Novel deletion of lysine 7 expands the clinical, histopathological and genetic spectrum of TPM2-related myopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "p.K7del β-tropomyosin fails to localize properly within the thin filament compartment and its expression alters sarcomere length, suggesting that the mutation interferes with head-to-tail β-tropomyosin polymerization and with overall sarcomeric structure."
      explanation: Reports the sarcomeric phenotype of the model.
- name: Drosophila embryos expressing dominant TPM2 variants
  species: Drosophila melanogaster
  genotype: Expression of dominant pathogenic human TPM2 variants
  publication: PMID:35579956
  description: Embryonic muscle development assay for TPM2 variants, cross-validated in mouse myotubes and zebrafish.
  modeled_mechanisms:
  - target: Impaired Fetal Myogenesis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Four dominant variants disrupt embryonic muscle development and function.
    limitations: >-
      Invertebrate muscle and overexpression rather than an endogenous allele; whether
      disrupted myogenesis occurs in human fetal muscle has not been shown.
    evidence:
    - reference: PMID:35579956
      reference_title: "A pathogenic mechanism associated with myopathies and structural birth defects involves TPM2-directed myogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we expressed a series of dominant, pathogenic TPM2 variants in Drosophila embryos and found 4 variants significantly affected muscle development and muscle function."
      explanation: Reports the developmental phenotype of the model.
experimental_models:
- name: Human myoblasts and myotubes expressing EGFP-tagged mutant beta-tropomyosin
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Transfected human (and mouse C2C12) muscle cells expressing EGFP-tagged mutant
    beta-tropomyosins, used to follow incorporation into thin filaments and aggregate
    or rod formation across differentiation.
  modeled_mechanisms:
  - target: Sarcomeric Thin-Filament Disorganisation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Several mutants form rod-like structures or fail to integrate into thin filaments.
    limitations: >-
      Overexpressed tagged protein in cultured cells; the phenotype depends on cell type
      and maturation stage, and no contractile readout is made.
    evidence:
    - reference: PMID:24039757
      reference_title: "Phenotypes of myopathy-related beta-tropomyosin mutants in human and mouse tissue cultures."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In addition, the histopathological phenotype associated with expression of the various mutant proteins depends on the cell type and varies with the maturation of the muscle cell."
      explanation: States the cell-type and maturation dependence that limits this model.
  evidence:
  - reference: PMID:24039757
    reference_title: "Phenotypes of myopathy-related beta-tropomyosin mutants in human and mouse tissue cultures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N202K-β-TM(EGFP) mutant failed to integrate into thin filaments and formed accumulations in myotubes."
    explanation: Example of a mutant failing to incorporate in this system.
discussions:
- discussion_id: tpm2_contractility_directed_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Would drugs that lower thin-filament calcium sensitivity help patients with
    hypercontractile TPM2 variants, and calcium sensitisers help those with
    hypocontractile variants?
  attaches_to:
  - pathophysiology#Increased Thin-Filament Calcium Sensitivity
  - pathophysiology#Reduced Thin-Filament Calcium Sensitivity
  rationale: >-
    The two molecular classes have opposite contractile defects, so a single
    contractility drug could help one class and harm the other. A calcium sensitiser
    raised calcium sensitivity in hypocontractile patient fibres ex vivo, and the
    p.Lys7del study proposes the opposite approach for hypercontractile disease, but no
    clinical study has tested either.
  evidence:
  - reference: PMID:18420702
    reference_title: "Defective regulation of contractile function in muscle fibres carrying an E41K beta-tropomyosin mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "increased Ca(2+) sensitivity of contraction, suggesting a potential therapeutic approach in patients carrying the E41K beta-Tm mutation."
    explanation: Ex vivo calcium-sensitiser response in hypocontractile patient fibres.
  - reference: PMID:23378224
    reference_title: "K7del is a common TPM2 gene mutation associated with nemaline myopathy and raised myofibre calcium sensitivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that patients may benefit from therapies that reduce skeletal muscle calcium sensitivity, and we highlight late muscle decompensation as an important cause of morbidity."
    explanation: Proposes calcium desensitisation for the hypercontractile class.

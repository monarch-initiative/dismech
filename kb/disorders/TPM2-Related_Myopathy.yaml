- name: Recessive Escobar
  display_name: Recessive TPM2 myopathy with Escobar variant multiple pterygium syndrome
  description: >-
    Biallelic loss of the skeletal muscle beta-tropomyosin isoform, by a homozygous null
    allele or by a splice variant at the acceptor of the muscle-specific exon 6b,
    producing congenital myopathy with sparse nemaline rods together with the
    non-lethal Escobar form of multiple pterygium syndrome.
  genes:
  - preferred_term: TPM2
    term:
      id: hgnc:12011

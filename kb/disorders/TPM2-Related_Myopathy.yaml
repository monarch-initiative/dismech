      reference_title: "Defective regulation of contractile function in muscle fibres carrying an E41K beta-tropomyosin mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "suggesting that the mutation has a negative effect on contractile function, contributing to the muscle weakness"
      explanation: Links the regulatory defect in patient fibres to weakness.
- name: Increased Thin-Filament Calcium Sensitivity
  description: >-
    Hypercontractile variants (for example p.Arg91Gly, p.Asp20His, p.Glu181Lys and
    p.Lys7del) raise the calcium sensitivity of the thin filament, so muscle contracts
    more at a given calcium level. In patients this molecular phenotype tracks with limb
    and jaw contractures rather than with axial contractures.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: regulation of striated muscle contraction
    modifier: INCREASED
    term:

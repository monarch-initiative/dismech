    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening 66 unrelated patients, using single strand conformation polymorphism analysis and sequencing, we found four polymorphisms and two heterozygous missense mutations."
    explanation: First report of heterozygous TPM2 variants in nemaline myopathy.
  - reference: PMID:23378224
    reference_title: "K7del is a common TPM2 gene mutation associated with nemaline myopathy and raised myofibre calcium sensitivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients develop large joint contractures during childhood, followed by slowly progressive skeletal muscle weakness during adulthood."
    explanation: Describes the course of the recurrent p.Lys7del nemaline presentation.
- name: Cap
  display_name: TPM2 cap myopathy (CAPM2)
  description: >-
    Dominant TPM2 disease with peripheral caps of disorganised thin filaments under the
    sarcolemma. TPM2 was the first gene identified for cap disease, and cap structures
    are the most common morphological manifestation of TPM2 variants. MONDO carries
    CAPM2 as a synonym of congenital myopathy 23, so no separate term is bound.
  genes:
  - preferred_term: TPM2
    term:
      id: hgnc:12011
      label: TPM2
  evidence:
  - reference: PMID:17434307
    reference_title: "Cap disease caused by heterozygous deletion of the beta-tropomyosin gene TPM2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is one not previously described and the first genetic cause identified for cap disease."
    explanation: Establishes TPM2 as the first gene for cap disease.
  - reference: PMID:22749895
    reference_title: "Myopathies associated with β-tropomyosin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cap disease appears to be the most common morphological manifestation."
    explanation: Places cap disease as the most frequent TPM2 histology.

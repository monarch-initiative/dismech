    explanation: Identifies the exon 6b splice mechanism of the second recessive case.
pathophysiology:
- name: TPM2 Variant in Beta-Tropomyosin
  description: >-
    A heterozygous TPM2 variant, usually a missense change or an in-frame single-residue
    deletion or duplication, alters beta-tropomyosin. The mutant allele is expressed and
    the protein is incorporated into the sarcomere, where it acts dominantly on the
    wild-type tropomyosin dimers. Two alleles recur (p.Lys7del and p.Glu139del); most
    others are private.
  biological_scale: MOLECULAR
  genetic_context:
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Dominant alleles. The recessive null and splice alleles are modelled by the
      separate loss-of-isoform node below.
  genes:
  - preferred_term: TPM2
    term:
      id: hgnc:12011
      label: TPM2
  evidence:
  - reference: PMID:24692096
    reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two recurrent mutations were found in TPM2. The first is p.Lys7del, which was found in 10 families"
    explanation: Documents the recurrent alleles in the TPM2 spectrum.
  - reference: PMID:19345583
    reference_title: "Cap disease due to mutation of the beta-tropomyosin gene (TPM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2D-gel electrophoresis studies show that the shortened mutant protein incorporates into sarcomeric structures, where it likely imposes a dominant-negative effect to cause muscle weakness."
    explanation: Shows the mutant protein is made and enters the sarcomere, the basis of the dominant-negative model.
  downstream:
  - target: Abnormal Tropomyosin-Actin Association
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24692096
      reference_title: "Mutation update and genotype-phenotype correlations of novel and previously described mutations in TPM2 and TPM3 causing congenital myopathies."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Our in silico predictions show that most mutations affect tropomyosin-actin association or tropomyosin head-to-tail binding."
      explanation: Places most TPM2 variants at the actin-binding or head-to-tail interfaces.
  - target: Impaired Fetal Myogenesis
    causal_link_type: DIRECT
- name: Abnormal Tropomyosin-Actin Association
  description: >-
    Mutant beta-tropomyosin binds actin with altered affinity or fails to polymerise
    head-to-tail along the filament. Some variants (for example p.Lys7del) incorporate
    poorly into the thin filament; others change the position the tropomyosin strand
    occupies on actin. This is the shared molecular lesion from which the regulatory and
    structural consequences branch.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TPM2
    term:
      id: hgnc:12011
      label: TPM2
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: DYSREGULATED
    term:
      id: GO:0051015
      label: actin filament binding
  evidence:
  - reference: PMID:22084935
    reference_title: "Abnormal actin binding of aberrant β-tropomyosins is a molecular cause of muscle weakness in TPM2-related nemaline and cap myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that four of the mutations cause changes in affinity for actin, which may cause muscle weakness in these patients, whereas two show defective Ca2+ activation of contractility."
    explanation: Recombinant mutant beta-tropomyosins show altered actin affinity.
  - reference: PMID:23378224
    reference_title: "K7del is a common TPM2 gene mutation associated with nemaline myopathy and raised myofibre calcium sensitivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant K7del-β-tropomyosin incorporates poorly into sarcomeres in C2C12 myotubes and has a reduced affinity for actin."
    explanation: The recurrent p.Lys7del allele reduces actin affinity and sarcomeric incorporation.
  - reference: PMID:42239403
    reference_title: "Disease-associated mutations in TPM2 alter regulation of actin filament stability and cofilin-dependent dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disease-causing substitutions differentially alter filament length and stability, potentially contributing to the pathogenesis of myopathies."
    explanation: Variants also alter thin-filament stability and length.
  downstream:
  - target: Reduced Thin-Filament Calcium Sensitivity
    causal_link_type: DIRECT
  - target: Increased Thin-Filament Calcium Sensitivity
    causal_link_type: DIRECT
  - target: Reduced Strong-Binding Cross-Bridge Formation
    causal_link_type: DIRECT
  - target: Sarcomeric Thin-Filament Disorganisation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23413262
      reference_title: "Novel deletion of lysine 7 expands the clinical, histopathological and genetic spectrum of TPM2-related myopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "p.K7del β-tropomyosin fails to localize properly within the thin filament compartment and its expression alters sarcomere length, suggesting that the mutation interferes with head-to-tail β-tropomyosin polymerization and with overall sarcomeric structure."
      explanation: In zebrafish, defective polymerisation of the mutant protein disturbs sarcomere structure.
- name: Reduced Thin-Filament Calcium Sensitivity
  description: >-
    Hypocontractile variants (for example p.Glu41Lys and p.Asn202Lys) suppress
    troponin-regulated actomyosin activity and shift force-calcium relationships to
    higher calcium, so the fibre generates less force at physiological calcium. This is
    the molecular phenotype of most weakness-predominant TPM2 myopathy.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: regulation of striated muscle contraction
    modifier: DECREASED
    term:
      id: GO:0006942
      label: regulation of striated muscle contraction
  evidence:
  - reference: PMID:18420702
    reference_title: "Defective regulation of contractile function in muscle fibres carrying an E41K beta-tropomyosin mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Results showed decreases (i) in speed of contraction at saturated Ca(2+) concentration (apparent rate constant of force redevelopment (k(tr)) and unloaded shortening speed (V(0))); and (ii) in contraction sensitivity to Ca(2+) concentration, in fibres from patients compared with controls"
    explanation: Patient skinned fibres carrying p.Glu41Lys show reduced calcium sensitivity of contraction.
  - reference: PMID:40657867
    reference_title: "Myopathy-linked mutations in TPM2 and their impact on troponin-mediated regulation of actomyosin contractility."
    supports: SUPPORT

  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthropathy was uncommon but variable in manifestation.
    explanation: >-
      The qualitative characterisation in the national type IX cohort, which is

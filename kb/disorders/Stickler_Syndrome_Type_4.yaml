genetic:
- name: COL9A1
  gene_term:
    preferred_term: COL9A1
    term:
      id: hgnc:2217
      label: COL9A1
  relationship_type: CAUSATIVE
  notes: >-
    COL9A1 on chromosome 6q13 encodes the alpha-1 chain of collagen IX. Biallelic
    loss of function causes STL4. Heterozygous carriers are clinically
    unaffected, although intervertebral disc bulging was noted in two carriers of
    R507X.

    Note that COL9A1 variants in other allelic and dosage contexts have
    separately been associated with multiple epiphyseal dysplasia and with
    intervertebral disc disease. Those are different diseases on the same gene
    and are not curated here.
  variants:
  - name: p.R295X
    description: >-
      Homozygous in the founding consanguineous Moroccan family of four affected
      children. A nonsense allele, and the first COL9A1 variant reported in
      Stickler syndrome. It was later found again in an unrelated Moroccan boy.
  - name: p.R507X
    description: >-
      Homozygous in two affected Turkish sisters. The second independent nonsense
      allele, which established COL9A1 as a disease gene rather than a
      single-family observation.
  - name: c.1970delC, p.(Pro657fs)
    description: >-
      A frameshift allele reported in the NHS England type IX cohort, in a patient
      who also carried an ARID1B variant.
  - name: g.70,948,188_70,997,277del
    description: >-
      A 44.6 kb homozygous in-frame deletion spanning exons 6 to 33, found by
      copy-number analysis of exome data in two Iranian siblings reported as
      having nonsyndromic hearing loss. It is the only structural COL9A1 allele
      reported and the only one not associated with the full syndrome.
  evidence:
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, COL9A1 is the fourth identified gene that can cause Stickler
      syndrome.
    explanation: >-
      The gene-disease assertion itself, from the report that established it.
  - reference: PMID:31315069
    reference_title: Exome-wide copy number variation analysis identifies a COL9A1 in frame deletion that is associated with hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in COL9A1 are primarily associated with autosomal
      recessive Stickler syndrome.
    explanation: >-
      An independent restatement of the gene-disease relationship from a group
      approaching COL9A1 from the hearing loss side rather than the Stickler side.
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intervertebral disc bulging was observed in one patient and in two
      heterozygous carriers of the p.R507X mutation.
    explanation: >-
      The one reported finding in heterozygotes. It is a single observation in two
      people and is recorded as such, not as an established carrier phenotype.
diagnosis:
- name: Molecular genetic testing for biallelic COL9A1 variants
  description: >-
    The diagnosis is established by identifying biallelic pathogenic COL9A1
    variants in a proband with characteristic features. Sequencing alone is not
    sufficient: one of the reported alleles is a 44.6 kb deletion found only by
    copy-number analysis of exome data.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of Stickler syndrome can be established in a proband with
      characteristic clinical features and/or a heterozygous pathogenic
      variant in COL2A1, COL11A1, or COL11A2 or biallelic pathogenic variants in
      COL9A1, COL9A2, or COL9A3 identified by molecular genetic testing.
    explanation: >-
      The GeneReviews diagnostic criterion, which names biallelic COL9A1 variants
      as establishing the diagnosis.
  - reference: PMID:31315069
    reference_title: Exome-wide copy number variation analysis identifies a COL9A1 in frame deletion that is associated with hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is also the first reported copy number variation in COL9A1 that was
      identified through an exome data set in an Iranian family with apparent
      non-syndromic HL.
    explanation: >-
      The case for adding copy-number analysis to the diagnostic workup rather
      than stopping at sequence variants.
treatments:
- name: Prophylactic retinopexy, genotype-scoped
  description: >-
    Prophylactic retinopexy is the standard of care in type 1 Stickler syndrome,
    where it prevents giant-tear detachment. It does not transfer to the collagen
    IX Sticklers on current evidence: the national type IX cohort found no giant
    retinal tears and no bilateral detachments, and its authors recommend
    offering prophylaxis case by case rather than routinely. Both the general
    recommendation and its genotype-specific restriction are curated here so a
    reader meets them together.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: prophylactic retinopexy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Retinal detachment
    description: >-
      Creates a chorioretinal adhesion at the sites where tears form, which
      reduces but does not eliminate detachment risk.
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic retinopexy should only be offered case-by-case for fellow eyes
      of patients presenting with GRT detachments in their first eye.
    explanation: >-
      The genotype-scoped recommendation, from the only cohort study that
      addressed the question in collagen IX patients.
  - reference: PMID:35885933
    reference_title: Prevention of Blindness in Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on the current body of literature, there is extremely strong evidence
      from cohort comparison studies demonstrating the efficacy and safety of
      prophylactic retinopexy to reduce, but not eliminate, the risk of retinal
      detachment in Stickler syndrome patients.
    explanation: >-
      The general case for prophylaxis in Stickler syndrome, which is what the
      collagen IX restriction above restricts. The same review names absence of
      molecular sub-typing as a source of historic uncertainty, and the type IX
      cohort is that sub-typing carried out.
- name: Retinal detachment repair
  description: >-
    Surgical repair of established detachment. Outcomes of detachment surgery in
    Stickler syndrome are poor compared with the general population, which is the
    stated argument for prevention where prevention is justified.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retinal detachment repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Retinal detachment
    description: Reattaches the retina after a tear has produced a detachment.
  evidence:
  - reference: PMID:35885933
    reference_title: Prevention of Blindness in Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although retinal detachment surgery in the general population has a high
      success rate, outcomes from surgical repair in Stickler syndrome patients
      are notoriously poor, providing a strong argument for prophylactic
      intervention.
    explanation: >-
      The outcome caveat that makes repair an unsatisfactory fallback.
- name: Annual vitreoretinal and audiologic surveillance
  description: >-
    Annual examination by a vitreoretinal specialist and annual audiologic
    evaluation, with orthopaedic assessment as needed. Because the detachments in
    this genotype group occurred in adulthood, surveillance is lifelong rather
    than paediatric.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: clinical surveillance
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Retinal detachment
    description: >-
      Detects tears and early detachment while they are still treatable. It
      modifies outcome rather than the underlying collagen defect.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Annual
      examination by a vitreoretinal specialist; audiologic evaluations annually;
      clinical, radiographic, and/or orthopedic assessment as needed.
    explanation: >-
      The GeneReviews surveillance schedule for Stickler syndrome.
- name: Avoidance of contact sports
  description: >-
    GeneReviews lists activities that may cause traumatic retinal detachment,
    such as contact sports, among circumstances to avoid in Stickler syndrome.
    The recommendation is written for Stickler syndrome as a whole; no collagen
    IX-specific study of trauma risk exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: activity restriction
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Retinal detachment
    description: >-
      Removes the traumatic trigger for detachment. It does not address the
      vitreous lesion that makes the retina vulnerable.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Activities such as contact sports that may lead to traumatic retinal
      detachment.
    explanation: >-
      The GeneReviews agents-and-circumstances-to-avoid entry for Stickler
      syndrome.
- name: Hearing loss management
  description: >-
    Standard management of sensorineural hearing loss, with prompt treatment of
    otitis media. In this genotype the hearing loss is the earliest and most
    consistent manifestation, and dual sensory impairment is what early diagnosis
    is meant to prevent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: hearing loss management
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Sensorineural hearing impairment
    description: >-
      Amplification and aural rehabilitation address the functional deficit, not
      the cochlear matrix lesion.
  evidence:
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      standard treatment of sensorineural and
      conductive hearing loss; prompt treatment of otitis media
    explanation: >-
      The GeneReviews management recommendation for the auditory phenotype.
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although recessive SS is rare, early diagnosis would have a high impact for

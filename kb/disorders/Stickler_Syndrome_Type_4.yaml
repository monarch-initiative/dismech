    snippet: >-
      Four children showed symptoms characteristic of Stickler syndrome,
      including moderate-to-severe sensorineural hearing loss, moderate-to-high
      myopia with vitreoretinopathy, and epiphyseal dysplasia.
    explanation: >-
      The severity grading in the founding COL9A1 family, which is where the
      claim that hearing loss is severe in this genotype originates.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss was more prevalent (91.7%) than in dominant SS.
    explanation: Frequency in the largest type IX cohort.
- category: Musculoskeletal
  name: Epiphyseal dysplasia
  description: >-
    Radiographic epiphyseal dysplasia, reported in the founding family and in all
    three patients of the second report. It is the skeletal signature of collagen
    IX loss and is milder than the spondyloepiphyseal changes of the dominant
    collagen II form.
  phenotype_term:
    preferred_term: Epiphyseal dysplasia
    term:
      id: HP:0002656
      label: Epiphyseal dysplasia
  frequency: FREQUENT
  evidence:
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three had sensorineural hearing loss and epiphyseal dysplasia.
    explanation: >-
      Epiphyseal dysplasia in all three genotyped COL9A1 patients of that report.
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four children showed symptoms characteristic of Stickler syndrome,
      including moderate-to-severe sensorineural hearing loss, moderate-to-high
      myopia with vitreoretinopathy, and epiphyseal dysplasia.
    explanation: The same finding in the founding family.
- category: Ophthalmologic
  name: Retinal detachment
  description: >-
    Retinal detachment occurs but at a far lower rate than in type 1 Stickler
    syndrome, and by a different mechanism: horseshoe tears after posterior
    vitreous detachment rather than giant retinal tears, with no bilateral cases
    in the national cohort. This is the single most consequential difference
    between the collagen IX Sticklers and the dominant forms, because giant-tear
    detachment is what prophylactic retinopexy exists to prevent. Exudative as
    well as rhegmatogenous detachment has been reported in COL9A1 patients.
  phenotype_term:
    preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      15.4% of patients developed RD secondary to horseshoe retinal tears, with
      no cases of bilateral RD or giant retinal tears (GRTs).
    explanation: >-
      The rate and the tear morphology together, which is what distinguishes this
      from the type 1 detachment risk.
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmic assessment revealed myopia, cataracts, distinct vitreous
      changes, progressive chorioretinal degeneration, and exudative and
      rhegmatogenous retinal detachments.
    explanation: >-
      Detachment of both kinds in genotyped COL9A1 patients. Exudative detachment
      was reported by these authors as a new finding in Stickler syndrome.
- category: Ophthalmologic
  name: Progressive chorioretinal degeneration
  description: >-
    Progressive chorioretinal degeneration, reported in the COL9A1 families of the
    2011 series alongside the vitreous changes and detachments. HPO carries no
    "chorioretinal degeneration" term; the binding is to Chorioretinal dystrophy,
    which is the progressive chorioretinal term HPO does have, and the reported
    wording is kept in preferred_term.
  phenotype_term:
    preferred_term: progressive chorioretinal degeneration
    term:
      id: HP:0001135
      label: Chorioretinal dystrophy
  evidence:
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmic assessment revealed myopia, cataracts, distinct vitreous
      changes, progressive chorioretinal degeneration, and exudative and
      rhegmatogenous retinal detachments.
    explanation: >-
      The chorioretinal finding in genotyped COL9A1 patients, listed among the
      ophthalmic assessment results.
- category: Ophthalmologic
  name: Cataract
  description: >-
    Cataract, reported in the COL9A1 families of the 2011 series and listed among
    the ocular findings of Stickler syndrome generally. No source located states
    a mechanism connecting it to a node in this pathograph, so it is left
    causally unwired.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmic assessment revealed myopia, cataracts, distinct vitreous
      changes, progressive chorioretinal degeneration, and exudative and
      rhegmatogenous retinal detachments.
    explanation: Cataract among the ophthalmic findings in genotyped COL9A1 patients.
- category: Craniofacial
  name: Midface retrusion
  description: >-
    Midfacial hypoplasia, present in a minority. It is much milder than in the
    dominant collagen II and XI forms, and unlike them it is not accompanied by
    cleft palate or Pierre Robin sequence in any reported collagen IX patient.
  phenotype_term:
    preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patients had cleft palate, and 30.8% had midfacial hypoplasia.
    explanation: >-
      Frequency in the national type IX cohort, quoted with the cleft palate

- category: Musculoskeletal
  name: Arthralgia
  description: >-
    Joint pain, uncommon and variable in manifestation. The 2022 review reports it
    in 15% of all recessive Stickler patients; the cohorts are young, so the
    lifetime figure is likely higher.
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Retinal detachment has occurred in 18% of all cases, and joint pain in 15%.
    explanation: >-
      The joint pain frequency across all published recessive Stickler cases, of

    explanation: >-
      The stated reason early auditory diagnosis matters in this disease
      specifically.
animal_models:
- name: Col9a1 knockout mouse
  species: Mouse
  genotype: Col9a1 targeted disruption, homozygous null
  publication: PMID:15802199
  description: >-
    The germline Col9a1 null mouse is the model that supplies this entry's
    cochlear and cartilage mechanism. Reading it across to human STL4 requires
    one step the literature does not take for you: the mouse is a Col9a1 null and
    so is the human disease, but almost every human cohort pools the three
    collagen IX genes, so the mouse is gene-matched to this entry in a way the
    human evidence is not.
  modeled_mechanisms:
  - target: Tectorial Membrane Collagen Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The knockout reproduces the lesion and the deficit together: a misshapen
      tectorial membrane with disorganized collagen fibrils, no detectable type
      II collagen in it, and measurable hearing loss on auditory brainstem
      response.
    limitations: >-
      No human tectorial membrane from a COL9A1 patient has been examined, so the
      claim that the human deafness has this mechanism is an extrapolation from
      the mouse. The human-side support is expression rather than structure:
      COL9A1 is highly expressed in the human inner ear.
    readouts:
    - name: Auditory brainstem response threshold
      target: Tectorial Membrane Collagen Disorganization
      direction: ALTERED
      interpretation: Functional hearing deficit in the knockout.
      evidence:
      - reference: PMID:15802199
        reference_title: Type IX collagen is crucial for normal hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice with targeted disruption of the col9a1 gene were shown through
          assessment by auditory brain stem response to have hearing loss,
          suggesting an important role of type IX collagen in maintaining normal
          hearing.
        explanation: The auditory measurement, stated with the method used.
    - name: Tectorial membrane type II collagen immunoreactivity
      target: Tectorial Membrane Collagen Disorganization
      direction: ABOLISHED
      interpretation: >-
        Type II collagen is undetectable in the knockout tectorial membrane, which
        is the structural readout behind the node.
      evidence:
      - reference: PMID:15802199
        reference_title: Type IX collagen is crucial for normal hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          An antibody against type II collagen failed to detect type II collagen
          in the tectorial membrane of type IX collagen knock-out mice, suggesting
          that a lack of type IX collagen may affect the three-dimensional
          structure of type II collagen molecules.
        explanation: The immunohistochemical result, in the knockout tissue.
    evidence:
    - reference: PMID:15802199
      reference_title: Type IX collagen is crucial for normal hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings indicate that genes encoding each chain of type IX
        collagen may fulfill an important function associated with the tectorial
        membrane in the auditory system.
      explanation: >-
        The authors' own conclusion, which is a claim about all three collagen IX
        chains and therefore about this entry's gene.
  - target: Cartilage and Craniofacial Matrix Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout develops premature osteoarthritis and intervertebral disc
      degeneration with cartilage erosion, raised serum hyaluronan, gait changes
      and increased mechanical sensitivity.
    limitations: >-
      The human COL9A1 skeletal phenotype is epiphyseal dysplasia in children,
      not premature osteoarthritis in adults, and human arthropathy in this
      genotype is reported as uncommon. The mouse therefore models the cartilage
      matrix defect but expresses it as a degenerative joint phenotype the human
      cohorts do not consistently show. Intervertebral disc degeneration is the
      one place the two converge: disc bulging was reported in a COL9A1 patient
      and in two heterozygous carriers.
    readouts:
    - name: Knee and spine histologic degeneration grade
      target: Cartilage and Craniofacial Matrix Disorganization
      direction: INCREASED
      interpretation: Cartilage erosion and disc degeneration in the knockout.
      evidence:
      - reference: PMID:19714629
        reference_title: Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Male Col9a1(-/-) mice had the highest mean serum hyaluronan levels and
          strong histologic evidence of cartilage erosion.
        explanation: The histological and biochemical cartilage readout.
    evidence:
    - reference: PMID:19714629
      reference_title: Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In mice with Col9a1 gene inactivation (Col9a1(-/-)), osteoarthritis (OA)
        and intervertebral disc degeneration develop prematurely.
      explanation: >-
        The skeletal phenotype of the knockout, stated as the premise of that
        study rather than as its own finding.
      quote_role: BACKGROUND
    - reference: PMID:18163498
      reference_title: Early-onset degeneration of the intervertebral disc and vertebral end plate in mice deficient in type IX collagen.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There was evidence of more degeneration of the disc and end plate in the
        spines of Col9a1(-/-) mice compared with those of WT controls, at most
        time points.
      explanation: >-
        The disc and end-plate phenotype with its comparison group, measured by
        two blinded graders at three ages. This is the finding rather than the
        paper's framing, which is why it replaced an earlier draft snippet that
        quoted the title.
discussions:
- discussion_id: gap_stl4_collagen_ix_gene_equivalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are STL4 (COL9A1), STL5 (COL9A2) and STL6 (COL9A3) clinically
    distinguishable, or is the three-way split an artefact of gene-by-gene
    discovery?
  attaches_to:
  - "pathophysiology#Collagen IX Heterotrimer Failure"
  rationale: >-
    The mechanistic argument says they should be indistinguishable: collagen IX
    assembles from all three chains, and a null in any one removes the normal
    molecule. Every cohort study to date has pooled them and reported figures for
    "type IX recessive Stickler syndrome" rather than per gene, so there is no
    published comparison that could detect a difference — and the absence of a
    reported difference is not evidence of equivalence. A chain-specific effect
    is not impossible: COL9A2 and COL9A3 have separate associations with multiple
    epiphyseal dysplasia, COL9A1 has one with nonsyndromic hearing loss that the
    other two do not, and the 2022 review itself proposes that the two remaining
    chains may form an alternative heterotrimer, which would make the identity of
    the missing chain matter. The practical stake is whether a clinician seeing a
    COL9A1 patient may use a pooled type IX cohort's numbers, which is exactly
    what this entry has had to do for most of its frequencies. The same gap is
    recorded on Stickler_Syndrome_Type_5; it is restated here rather than
    cross-referenced because the two entries are curated independently and a
    reader of either should meet it.
  proposed_experiments:
  - experiment_id: exp_stl4_gene_stratified_reanalysis
    name: Gene-stratified reanalysis of the pooled collagen IX cohorts
    description: >-
      Reanalyse the published type IX recessive Stickler cases stratified by gene
      rather than pooled, comparing hearing threshold, axial length, retinal
      detachment rate and arthropathy, and report whether the combined cohorts
      are large enough to exclude a clinically meaningful difference.
- discussion_id: gap_stl4_nonsyndromic_hearing_loss_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a biallelic COL9A1 deletion give apparently nonsyndromic hearing
    loss where the nonsense alleles give full Stickler syndrome?
  attaches_to:
  - "pathophysiology#Tectorial Membrane Collagen Disorganization"
  - "genetic#COL9A1"
  rationale: >-
    The Iranian siblings carried a homozygous 44.6 kb in-frame deletion of exons
    6 to 33 and were reported as having nonsyndromic hearing loss, while the
    nonsense alleles R295X and R507X give the full ocular, skeletal and auditory
    syndrome. Two readings are open and the published data do not separate them.
    An in-frame deletion may leave a partially functional chain that the cochlea
    tolerates less well than the eye, in which case the phenotype is genuinely
    allele-specific. Alternatively the ocular features may not have been looked
    for: the study was a hearing loss study, and high myopia and a hypoplastic
    vitreous are not findings a hearing clinic records. Distinguishing these
    decides whether COL9A1 belongs on nonsyndromic hearing loss panels as a
    nonsyndromic gene or as a Stickler gene whose patients need ophthalmic
    referral.
  proposed_experiments:
  - experiment_id: exp_stl4_ophthalmic_assessment_of_nonsyndromic_probands
    name: Ophthalmic assessment of COL9A1 probands ascertained through hearing loss
    description: >-
      Perform refraction, axial length measurement and dilated vitreoretinal
      examination on probands with biallelic COL9A1 variants ascertained through
      hearing loss panels, and report whether the ocular phenotype is absent or
      merely unascertained.
notes: >-
  Scope and lump/split. This entry covers biallelic COL9A1 Stickler syndrome.
  Separate per-type entries are the settled shape here — Stickler_Syndrome_Type_1,
  _Type_2, _Type_5 and _Type_6 already exist alongside the Stickler_Syndrome
  umbrella — and MONDO:0013590 was bound nowhere in kb/ before this entry.
  Whether the three collagen IX genes deserve three entries is genuinely open and
  is curated as a KNOWLEDGE_GAP rather than settled here.

  Cohort attribution, and why it is prose. Almost every published cohort pools
  COL9A1, COL9A2 and COL9A3 as "type IX recessive Stickler syndrome", so most
  quantitative claims here — 91.7% hearing loss, 15.4% retinal detachment, 30.8%
  midfacial hypoplasia, 92.3% abnormal vitreous — are type IX figures and not
  COL9A1 figures. Each description says so. There is no schema slot that records
  the population a phenotype frequency was measured in as structured data, so a
  query for "frequency of retinal detachment in STL4" reads 15.4% off a
  three-gene cohort with nothing machine-readable marking it as such. The
  COL9A1-specific claims here are the two family reports (PMID:16909383,
  PMID:21421862), the deletion report (PMID:31315069), and the case count of
  eight patients from four families.

  The clinically important negative. The prophylactic retinopexy protocol that is
  standard in type 1 Stickler syndrome does not transfer here, and that is
  curated as a restriction with its evidence rather than by omitting the
  treatment. Getting it wrong in either direction has a cost: assuming Stickler
  syndrome means high giant-tear risk leads to unnecessary bilateral prophylaxis
  in children, while omitting the treatment entirely would hide the general
  recommendation from a reader who arrives at this entry first.

  Phenotypes left unwired, deliberately. Cataract carries no causal inlink. No
  source located states a mechanism connecting it to a node in this pathograph;
  collagen IX is not a lens collagen, and the reports list cataract among ocular
  findings without proposing a route from the vitreous lesion. An edge drawn to
  satisfy a connectivity metric would assert a causal claim no paper makes.

  One binding that is not exact. "Progressive chorioretinal degeneration", the
  wording used by the 2011 COL9A1 report, has no HPO term. It is bound to
  Chorioretinal dystrophy (HP:0001135), the progressive chorioretinal term HPO
  does carry, with the reported wording kept in preferred_term. Chorioretinal
  atrophy (HP:0000533) was considered and rejected as naming the endpoint rather
  than the process.

  GeneReviews. PMID:20301479, Stickler Syndrome, is the baseline chapter and is
  tagged in references:. It is written around the dominant forms, so it is mined
  for what applies here — the diagnostic criterion, the recessive inheritance
  statement for the collagen IX genes, the surveillance schedule, the hearing
  loss management recommendation and the contact-sport restriction — and each is
  quoted as REVIEW_SYNTHESIS, because the chapter is an expert synthesis and not
  a study of this genotype. Features it describes that belong to the dominant
  subtypes, notably cleft palate and Pierre Robin sequence and the high
  giant-retinal-tear risk, are deliberately not curated here, because the
  collagen IX literature reports them as absent or different.

  What is deliberately absent. No datasets: block — no COL9A1 Stickler-specific
  dataset was identified, and a COL9A1 search surfaces the far larger multiple
  epiphyseal dysplasia and intervertebral disc degeneration literature, which is
  a different disease on the same gene. No clinical_trials: block — none found
  for recessive Stickler syndrome. No environmental: block. No
  experimental_models: block — no non-animal system (organoid, organ-chip, cell
  line) modelling this disease was located.

  Deep research. One OpenScientist run, committed; its reference validation
  reports 25 of 25 references resolved with no failed quotes. `just preflight-dr`
  was not usable for the Named Entity Confusion check because MONDO records no
  causal gene for MONDO:0013590; the manual fallback is the report's own gene
  counts, which are COL9A1-dominant throughout, and its OMIM identifiers (#614134
  disease, *120210 gene) are this disease's. The run's contribution to the entry
  is specific and large: the Col9a1 knockout mouse literature, which supplies the
  tectorial membrane mechanism above. Before reading it, the cochlear node in
  this entry said the step from collagen IX loss to deafness was not
  mechanistically worked out, which was wrong; it was worked out in mouse in 2005.

  What was not taken from the report. Its term validation flagged HP:0012609,
  offered as "Megalophthalmos", which HPO actually calls Hypomagnesiuria; that
  identifier is not bound here. It also proposes the naturally occurring canine
  oculoskeletal dysplasia as a large-animal model. That dysplasia is caused by
  COL9A2 and COL9A3 variants, not COL9A1, so listing it as an animal model of
  this entry's gene would misstate the genotype, and it is left out.

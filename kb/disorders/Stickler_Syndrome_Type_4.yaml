    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      92.3% of patients exhibited an abnormal hypoplastic vitreous architecture.
    explanation: The vitreous finding quantified in the national type IX cohort.

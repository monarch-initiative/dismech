name: Stickler Syndrome Type 4
creation_date: "2026-09-17T16:17:48Z"
description: >-
  Stickler syndrome type 4 (STL4) is the autosomal recessive Stickler syndrome
  caused by biallelic loss-of-function variants in COL9A1, the gene for the
  alpha-1 chain of collagen IX. It was the first recessive Stickler syndrome
  described and the fourth Stickler gene found, reported in 2006 in a
  consanguineous Moroccan family homozygous for the nonsense allele R295X.
  Collagen IX is a heterotrimer of the alpha-1, alpha-2 and alpha-3 chains, so a
  null in COL9A1 removes the normal molecule rather than one component of it —
  which is why COL9A1, COL9A2 and COL9A3 nulls give one clinical entity in three
  genes, curated here as STL4, STL5 and STL6.

  Collagen IX is a FACIT collagen that decorates the surface of collagen II
  fibrils and bridges them to the surrounding matrix. Its absence is felt where a
  collagen II network has to be spaced and stabilised: the vitreous gel, which
  becomes hypoplastic and architecturally abnormal alongside an enlarged, highly
  myopic globe; hyaline cartilage, where it produces epiphyseal dysplasia and a
  much milder skeletal and orofacial phenotype than the dominant collagen II and
  XI forms; and the cochlea, where COL9A1 is highly expressed and where the
  hearing loss is both more frequent and more severe than in dominant Stickler
  syndrome.

  Two things distinguish STL4 clinically. Sensorineural hearing loss is
  near-universal and is usually what brings a child to attention, to the point
  that the literature recommends adding the collagen IX genes to congenital
  hearing loss panels — and a biallelic COL9A1 deletion has been reported in
  siblings with apparently nonsyndromic hearing loss, so the allelic spectrum
  reaches beyond the full syndrome. Retinal detachment, in contrast, occurs at a
  far lower rate than in type 1 Stickler syndrome and through horseshoe rather
  than giant retinal tears, so the prophylactic retinopexy protocol that is
  standard in type 1 does not transfer here and is offered case by case.
synonyms:
- STL4
- Stickler syndrome, type 4
- STICKLER syndrome, type IV
- COL9A1 autosomal recessive Stickler syndrome
- autosomal recessive Stickler syndrome caused by mutation in COL9A1
- type IX collagen recessive Stickler syndrome

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    STL4 requires two defective COL9A1 alleles. The founding pedigree is the
    clearest statement of it: four homozygous children affected, the two parents
    and four sibs heterozygous and unaffected, and two sibs homozygous wild type.
    Reported families are predominantly consanguineous.
  evidence:
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents and four unaffected children were heterozygous carriers of the
      R295X mutation.
    explanation: >-
      Unaffected heterozygous carriers on both parental sides, which is the
      segregation argument that the disease is recessive rather than dominant
      with reduced penetrance.
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the three previously reported Stickler syndrome-causing
      genes, this gene causes a form of Stickler syndrome with an autosomal
      recessive inheritance pattern.
    explanation: >-
      States the inheritance mode explicitly and contrasts it with the dominant
      collagen II and XI forms, which is the nosological point of STL4.
  - reference: PMID:20301479
    reference_title: Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Stickler
      syndrome caused by pathogenic variants in COL9A1, COL9A2, or COL9A3 is
      inherited in an autosomal recessive manner.
    explanation: >-
      The GeneReviews statement of inheritance for the collagen IX subgroup,
      which is the expert-curated baseline for this entry.
prevalence:
- population: Published COL9A1 Stickler syndrome cases, reviewed to 2022
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight patients from four families with COL9A1 variants had been published as
    of the 2022 review of recessive Stickler syndrome. This is the one published
    count that is COL9A1-specific rather than pooled across the three collagen IX
    genes; every other quantitative figure in this entry is a type IX figure and
    is labelled as such where it is used.
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Table 1, Table 2 and Table 3 show the reported features of eight patients
      from four families with COL9A1 variants, seven patients from four families
      with COL9A2 variants and seven patients from four families with COL9A3
      variants.
    explanation: >-
      The per-gene breakdown of published recessive Stickler cases, which is what
      makes a COL9A1-specific count possible at all.
- population: Published recessive Stickler syndrome cases across all causative genes, reviewed to 2022
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty patients from 23 families with recessive Stickler syndrome of any
    cause. That figure spans COL9A1, COL9A2, COL9A3, COL11A1, LRP2, LOXL3 and
    GZF1, so COL9A1 is a fifth of it. Recorded for context rather than as a
    figure for this disease.
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We review the published cases of recessive SS, which comprise 40 patients
      from 23 families.
    explanation: >-
      The published case count for recessive Stickler syndrome as a whole, which
      bounds how much evidence any one of its genes can have.
progression:
- phase: Congenital ocular and auditory presentation
  notes: >-
    High myopia, an enlarged globe and an abnormal hypoplastic vitreous are
    present from early life, and the sensorineural hearing loss is congenital or
    early. The ear typically brings the child to attention before the eye does,
    which is the argument for adding the collagen IX genes to congenital hearing
    loss panels.
  evidence:
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were highly myopic with congenital megalophthalmos and
      abnormal, hypoplastic vitreous gel, and all had sensorineural hearing loss.
    explanation: >-
      Complete penetrance of the ocular and auditory features across the type IX
      series, which included one COL9A1 patient.
- phase: Later retinal and joint complications
  notes: >-
    Retinal detachment, when it occurs, comes later — in the national type IX
    cohort at ages 24 and 36, through horseshoe tears secondary to posterior
    vitreous detachment. Arthropathy is uncommon and variable. The published
    cohorts are young, mean age 11 years in the 2022 review, so both lifetime
    risks are probably underestimated.
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, the mean age of this cohort is 11 years old, so the lifetime
      incidence of both problems may be underestimated.
    explanation: >-
      The authors' own caveat on their retinal detachment and joint pain figures.
      It is what makes those figures usable rather than misleading, so it is
      curated beside them rather than left in the paper.
pathophysiology:
- name: COL9A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish the alpha-1 chain of collagen IX.
    The reported alleles are nonsense changes (R295X in the founding Moroccan
    family, R507X in a Turkish family), a frameshift (p.Pro657fs), and a 44.6 kb
    in-frame deletion removing exons 6 to 33.
  genes:
  - preferred_term: COL9A1
    term:
      id: hgnc:2217
      label: COL9A1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Collagen IX Heterotrimer Failure
    causal_link_type: DIRECT
    description: >-
      Collagen IX assembles from the alpha-1, alpha-2 and alpha-3 chains, so
      losing the alpha-1 chain prevents assembly of the normal molecule. The
      remaining two chains may form an alternative heterotrimer that covers some
      of its functions, which is the proposed reason a collagen IX null is
      survivable where a collagen II null is not.
    evidence:
    - reference: PMID:35885918
      reference_title: Autosomal Recessive Stickler Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This may suggest that the remaining two α chains are able to form an
        alternative heterotrimer, which can fulfil some, but not all, of the
        functions of the normal heterotrimer.
      explanation: >-
        Supports the edge and qualifies it in the same sentence: losing one chain
        removes the normal heterotrimer, but not necessarily all collagen IX
        function. The entry follows the source rather than asserting a clean
        obligate-heterotrimer null.
  evidence:
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of the coding region of the COL9A1 gene showed a
      homozygous R295X mutation in the four affected children.
    explanation: The founding COL9A1 allele and its nonsense, loss-of-function character.
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous COL9A1 mutation (p.R507X) was identified in two affected
      Turkish sisters, and the previously published mutation (p.R295X) was found
      in a Moroccan boy.
    explanation: >-
      A second independent nonsense allele, which is what moved COL9A1 from a
      single-family observation to an established disease gene.
  - reference: PMID:31315069
    reference_title: Exome-wide copy number variation analysis identifies a COL9A1 in frame deletion that is associated with hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 44.6 kb homozygous in-frame deletion spanning exons 6 to 33 of COL9A1 was
      detected via exome-based copy number variation analysis.
    explanation: >-
      A structural allele rather than a point mutation, which matters because it
      is invisible to the sequencing analyses that found the nonsense alleles.
- name: Collagen IX Heterotrimer Failure
  biological_scale: MOLECULAR
  description: >-
    Without the alpha-1 chain, the normal collagen IX heterotrimer is not formed.
    Collagen IX is a FACIT collagen assembled onto the surface of the collagen
    II/XI fibril and covalently linked to collagen II, so it acts as a bridge
    between fibrils and the surrounding matrix. Its loss is therefore felt
    wherever a collagen II fibril network has to be spaced and stabilised: the
    vitreous gel, hyaline cartilage, and the cochlea.
  cellular_components:
  - preferred_term: collagen trimer
    modifier: DECREASED
    term:
      id: GO:0005581
      label: collagen trimer
  downstream:
  - target: Vitreous Gel Architectural Failure
    causal_link_type: DIRECT
  - target: Cartilage and Craniofacial Matrix Disorganization
    causal_link_type: DIRECT
  - target: Tectorial Membrane Collagen Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      biallelic loss of any one of the α chains for type IX collagen results in
      the milder skeletal SS phenotype.
    explanation: >-
      States that a null in any single collagen IX chain produces the Stickler
      phenotype, which is the claim this node makes and the reason three genes
      give one disease.
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We considered the COL9A1 gene, located on chromosome 6q13, to be a
      candidate gene on the basis of the structural association with collagen
      types II and XI and because of the high expression in the human inner ear
      indicated by cDNA microarray.
    explanation: >-
      States both facts this node rests on: collagen IX associates structurally
      with collagens II and XI, and COL9A1 is highly expressed in the human inner
      ear. The candidate-gene reasoning is the authors' own and preceded the
      mutation finding.
- name: Vitreous Gel Architectural Failure
  biological_scale: TISSUE
  description: >-
    The vitreous is hypoplastic with abnormal architecture and the globe is
    enlarged with high axial myopia. Unlike the dominant forms, which each carry
    a characteristic membranous or beaded vitreous phenotype used to subclassify
    them, the collagen IX vitreous is described simply as hypoplastic and
    abnormal — although the 2011 COL9A1 families were reported to show vitreous
    changes distinctive enough to suggest the gene.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  locations:
  - preferred_term: vitreous humor
    term:
      id: UBERON:0001797
      label: vitreous humor
  downstream:
  - target: High myopia
    causal_link_type: DIRECT
  - target: Abnormal vitreous humor morphology
    causal_link_type: DIRECT
  - target: Retinal detachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Detachment follows posterior vitreous detachment and horseshoe tear
      formation rather than the giant retinal tears of type 1 Stickler syndrome,
      so the vitreous lesion reaches the retina by a different route here.
    evidence:
    - reference: PMID:39406934
      reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These were both due to horseshoe tears, secondary to posterior vitreous
        detachment, occurring at the ages of 24 and 36 respectively.
      explanation: >-
        Names the intermediate steps between the vitreous lesion and the
        detachment in this genotype group, which is what the edge claims.
  - target: Progressive chorioretinal degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were highly myopic with congenital megalophthalmos and
      abnormal, hypoplastic vitreous gel
    explanation: >-
      The vitreous and globe phenotype, present in every patient of the type IX
      series.
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the overall phenotype was comparable to autosomal dominant
      Stickler, vitreous changes that may enable recognition of patients who are
      likely to carry mutations in COL9A1 were identified
    explanation: >-
      A COL9A1-specific claim about the vitreous, from the paper that described
      the second family. It is the one report suggesting the collagen IX vitreous
      is recognisable rather than merely abnormal.
- name: Cartilage and Craniofacial Matrix Disorganization
  biological_scale: TISSUE
  description: >-
    Collagen IX loss in hyaline cartilage produces epiphyseal dysplasia and a
    markedly milder skeletal and orofacial phenotype than the dominant collagen
    II and XI Sticklers. Midface hypoplasia is present in a minority, arthropathy
    is uncommon and variable, and cleft palate — a defining feature of the
    collagen XI forms — has not been reported in any collagen IX patient.
    Intervertebral disc bulging was seen in one COL9A1 patient and, notably, in
    two heterozygous carriers.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  downstream:
  - target: Epiphyseal dysplasia
    causal_link_type: DIRECT
  - target: Midface retrusion
    causal_link_type: DIRECT
  - target: Arthralgia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21421862
    reference_title: Autosomal recessive Stickler syndrome in two families is caused by mutations in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three had sensorineural hearing loss and epiphyseal dysplasia.
    explanation: >-
      Epiphyseal dysplasia in all three genotyped COL9A1 patients of that report,
      which is the cartilage readout this node predicts.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patients had cleft palate, and 30.8% had midfacial hypoplasia.
    explanation: >-
      The craniofacial phenotype quantified in the national type IX cohort,
      including the negative cleft palate finding that separates collagen IX from
      collagen XI recessive Stickler syndrome.
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cleft palate is associated with type XI collagen variants, as well as the
      non-collagen genes, but is so far unreported with type IX collagen
      variants.
    explanation: >-
      States the gene-specific absence of cleft palate, which is the cleanest
      single discriminator between the collagen IX and collagen XI recessive
      forms.
- name: Tectorial Membrane Collagen Disorganization
  biological_scale: TISSUE
  description: >-
    The mechanistic step between collagen IX loss and deafness, worked out in the
    Col9a1 knockout mouse rather than in humans. Type IX collagen is present in
    the tectorial membrane and co-localizes there with type II collagen; in
    knockout mice the tectorial membrane is misshapen, its collagen fibrils are
    disorganized on electron microscopy, and an anti-type-II-collagen antibody
    fails to detect type II collagen in it at all. So the same
    surface-decoration failure that disorganizes the vitreous and cartilage
    matrices removes the type II collagen network from the structure that
    transduces sound onto the hair cells. The human counterpart has not been
    examined; the human-side evidence is that COL9A1 is highly expressed in the
    inner ear.
  locations:
  - preferred_term: tectorial membrane
    term:
      id: UBERON:0002233
      label: tectorial membrane of cochlea
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A disorganized tectorial membrane stripped of its type II collagen network
      degrades mechanotransduction. The intermediate steps between that and a
      measured threshold shift are not worked out, but the lesion and the
      auditory brainstem response deficit were demonstrated in the same animals.
    evidence:
    - reference: PMID:15802199
      reference_title: Type IX collagen is crucial for normal hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with targeted disruption of the col9a1 gene were shown through
        assessment by auditory brain stem response to have hearing loss,
        suggesting an important role of type IX collagen in maintaining normal
        hearing.
      explanation: >-
        The functional deficit measured in the same knockout that carries the
        tectorial membrane lesion, which is what makes this an edge rather than
        two unconnected observations.
  evidence:
  - reference: PMID:15802199
    reference_title: Type IX collagen is crucial for normal hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      An antibody against type II collagen failed to detect type II collagen in
      the tectorial membrane of type IX collagen knock-out mice, suggesting that
      a lack of type IX collagen may affect the three-dimensional structure of
      type II collagen molecules.
    explanation: >-
      The finding this node is named for: without collagen IX, the type II
      collagen network is not merely disordered in the tectorial membrane, it is
      undetectable. It is a mouse result and is graded as one.
  - reference: PMID:15802199
    reference_title: Type IX collagen is crucial for normal hearing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunocytochemical analysis also revealed that type IX collagen is
      distributed in the tectorial membrane, where it co-localizes with type II
      collagen, indicating that type IX collagen may contribute to the
      three-dimensional integrated structure of type II collagen molecules.
    explanation: >-
      The localization result that makes the tectorial membrane the right place
      to look. It is immunocytochemistry on tissue rather than an in vivo
      measurement, so it is graded IN_VITRO and separated from the knockout
      finding above.
  - reference: PMID:39406934
    reference_title: Retinal detachment in Type IX collagen recessive Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss was more prevalent (91.7%) than in dominant SS.
    explanation: >-
      The quantified comparison with the dominant forms, from the largest type IX
      cohort assembled.
  - reference: PMID:31090205
    reference_title: Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that COL9A1, COL9A2, and COL9A3 be added to genetic screening
      panels for patients with congenital hearing loss.
    explanation: >-
      The practical consequence the authors draw from the hearing phenotype, and
      the reason this node matters clinically more than the ocular one at
      presentation.
  - reference: PMID:31315069
    reference_title: Exome-wide copy number variation analysis identifies a COL9A1 in frame deletion that is associated with hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study emphasizes the importance of exome-wide copy number
      variation analysis in molecular diagnosis and provides supporting evidence
      to associate COL9A1 with autosomal recessive non-syndromic HL.
    explanation: >-
      The cochlear phenotype can occur without the rest of the syndrome, which is
      the strongest available statement that the ear is not simply carried along
      by a generalised connective tissue defect.
phenotypes:
- category: Ophthalmologic
  name: High myopia
  description: >-
    High myopia, usually beyond -6 dioptres, accompanying congenital enlargement
    of the globe. It is present in essentially every reported patient, although
    the founding COL9A1 family was described as moderate-to-high rather than
    uniformly high.
  phenotype_term:
    preferred_term: High myopia
    term:
      id: HP:0011003
      label: High myopia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35885918
    reference_title: Autosomal Recessive Stickler Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      High myopia is near-universal, and sensorineural hearing loss is very
      common in patients with variants in genes for type IX or XI collagen
    explanation: >-
      The review's synthesis across published recessive Stickler patients with
      collagen IX or XI variants.
  - reference: PMID:16909383
    reference_title: A new autosomal recessive form of Stickler syndrome is caused by a mutation in the COL9A1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four children showed symptoms characteristic of Stickler syndrome,
      including moderate-to-severe sensorineural hearing loss, moderate-to-high
      myopia with vitreoretinopathy, and epiphyseal dysplasia.
    explanation: >-
      The founding COL9A1 family's ocular phenotype. It is quoted rather than
      paraphrased because it says moderate-to-high, which is weaker than the
      review's near-universal high myopia.
- category: Ophthalmologic
  name: Abnormal vitreous humor morphology
  description: >-
    A hypoplastic vitreous gel with abnormal architecture. In recessive Stickler
    syndrome it is not assigned to the membranous or beaded categories used to
    subclassify the dominant forms.
  phenotype_term:
    preferred_term: Abnormal vitreous humor morphology
    term:

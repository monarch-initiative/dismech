  description: >-
    The dominant monoallelic form, caused by heterozygous GP1BA or GP1BB
    variants. Milder, later-presenting, and frequently mistaken for immune
    thrombocytopenic purpura. The best-characterized allele is the southern
    Italian Bolzano founder variant GP1BA c.515C>T, which accounted for 20% of
    inherited thrombocytopenia patients at two Italian referral centers over a
    decade. Platelet aggregation is often normal here, so genetic testing rather
    than aggregometry is what makes the diagnosis.
  genes:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Except for obligate carriers of a GP9 mutation with a reduced GPIb/IX/V expression and defective aggregation, all the other carriers had no obvious anomalies."
    explanation: >-
      Documents that carriers are usually unremarkable but not invariably so.

- name: Impaired Ristocetin-Induced Platelet Aggregation
  category: Hematologic
  description: >-
    Absent or severely reduced agglutination in response to ristocetin, and
    crucially not corrected by adding normal plasma, which is what separates this
    from von Willebrand disease where the missing element is in the plasma rather
    than on the platelet. In monoallelic disease the response may be reduced or
    even normal, which is why genetic testing rather than aggregometry makes that
    diagnosis.
  phenotype_term:
    preferred_term: Impaired ristocetin-induced platelet aggregation
    term:
      id: HP:0011871
      label: Impaired ristocetin-induced platelet aggregation
  frequency: OBLIGATE
  diagnostic: true
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In biallelic BSS, giant platelets in the peripheral blood smear, absence of ristocetin-induced platelet aggregation (RIPA) using light transmission aggregometry (LTA), and complete loss of GPIbIX complex in flow cytometry are observed, whereas in monoallelic forms, genetic diagnosis is recommended due to the presence of large platelets in the peripheral blood smear, decreased or normal RIPA response in LTA, and partial loss or normal GPIbIX complex in flow cytometry."
    explanation: >-
      Distinguishes the obligate absent response in biallelic disease from the
      variable response in monoallelic disease.

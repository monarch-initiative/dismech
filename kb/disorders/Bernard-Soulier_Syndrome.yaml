genetic:
- name: GP1BA, GP1BB, and GP9 Biallelic Loss of Function
  gene_term:
    preferred_term: GP1BA
    term:
      id: hgnc:4439
      label: GP1BA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic pathogenic variants in GP1BA (17p13.2), GP1BB (22q11.21), or GP9
    (3q21.3) cause classic autosomal recessive disease. Across 211 genotyped
    families the distribution is GP9 44%, GP1BA 28%, GP1BB 28%, with 112 distinct
    variants spanning missense, nonsense, frameshift, splice-site, and larger
    deletions. Eighty-five percent of probands are homozygous, with founder
    effects in several regions and consanguinity the dominant population-level
    risk multiplier. GP5, the fourth subunit gene, has never been implicated.
    Monoallelic GP1BA and GP1BB variants cause the milder dominant type A2,
    including the southern Italian Bolzano founder allele GP1BA c.515C>T.
  frequency: OBLIGATE
  evidence:
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a wide spectrum of mutations with 112 different variants, including 22 novel alterations."
    explanation: >-
      Quantifies the allelic heterogeneity across the international consortium.
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the rarity of the disease, 85% of the probands carry homozygous mutations with evidence of founder effects in some geographical areas."
    explanation: >-
      Documents the predominance of homozygosity and the founder effects that
      follow from consanguinity.
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autosomal recessively inherited biallelic BSS have a homozygous or compound heterozygous expression in the GPIbalpha, GPIbbeta, and GPIX subunits of the GPIbIX complex. Patients with autosomal dominantly inherited monoallelic BSS have a heterozygous expression in only the GPIbalpha and GPIbbeta subunits of the GPIbIX complex."
    explanation: >-
      Establishes the two inheritance modes and which subunits each involves.
- name: GP1BA Bolzano Founder Variant (c.515C>T)
  gene_term:
    preferred_term: GP1BA
    term:
      id: hgnc:4439
      label: GP1BA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: A2
  features: >-
    A monoallelic GP1BA c.515C>T transition originating in southern Italy and
    inherited dominantly. It matters far out of proportion to its mild severity
    because it is common: it accounted for 20% of patients with inherited
    thrombocytopenia recruited at two Italian institutions over ten years, making
    it the single most frequent cause of inherited thrombocytopenia in Italy.
    Southern Italian emigration over the last century means it is likely present
    in other countries under other diagnoses.
  evidence:

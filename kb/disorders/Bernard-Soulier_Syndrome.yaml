    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study indicates that monoallelic Bolzano mutation is the most frequent cause of inherited thrombocytopenia in Italy, affecting 20% of patients recruited at our institutions during the last 10 years."
    explanation: >-
      Quantifies the contribution of this single allele to the inherited
      thrombocytopenia caseload in Italy.
  - reference: PMID:21933849
    reference_title: "Clinical and laboratory features of 103 patients from 42 Italian families with inherited thrombocytopenia derived from the monoallelic Ala156Val mutation of GPIbα (Bolzano mutation)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because many people from southern Italy have emigrated during the last century, this mutation may have spread to other countries."
    explanation: >-
      Notes the likely geographic spread of the founder allele beyond Italy.
- name: 22q11.2 Deletion Conferring GP1BB Hemizygosity
  gene_term:
    preferred_term: GP1BB
    term:
      id: hgnc:4440
      label: GP1BB
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  features: >-
    GP1BB lies inside the commonly deleted 22q11.2 interval, so every patient with
    22q11.2 deletion syndrome is an obligate carrier of Bernard-Soulier syndrome.
    A second-hit pathogenic variant on the retained allele then produces full
    disease. Recorded as a predisposing structural context rather than as a
    differential diagnosis, because it is not a phenotypic mimic: it is a
    contiguous-gene deletion that halves gene dosage and unmasks a monoallelic
    GP1BB variant. Worth testing in any 22q11.2 deletion patient with unexplained
    macrothrombocytopenia.
  evidence:
  - reference: PMID:38625506
    reference_title: "Bernard-Soulier syndrome caused by a novel GP1BB variant and 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with 22q11.2 deletion syndrome (22q11.2DS) are obligate carriers of BSS because GP1BB resides on chromosome 22q11.2."
    explanation: >-
      States the structural basis for obligate carrier status in 22q11.2 deletion
      syndrome.
  - reference: PMID:38625506
    reference_title: "Bernard-Soulier syndrome caused by a novel GP1BB variant and 22q11.2 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene panel testing revealed a novel variant in GP1BB, p.(Val169_Leu172del)."
    explanation: >-
      Documents the second-hit variant on the retained allele that converts
      carrier status into disease.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Classic Bernard-Soulier syndrome is autosomal recessive, with 85% of probands
    homozygous and consanguinity the dominant risk multiplier. Obligate carriers
    are generally indistinguishable from controls, though carriers of some GP9
    variants show reduced complex expression and defective aggregation, so
    heterozygosity is not always silent. A separate autosomal dominant form
    exists, caused by monoallelic GP1BA or GP1BB variants.
  evidence:

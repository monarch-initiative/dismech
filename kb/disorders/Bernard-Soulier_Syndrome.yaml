progression:
- phase: Presentation
  notes: >-
    Biallelic disease presents in infancy or early childhood, typically with
    mucocutaneous bleeding. Monoallelic disease presents later, often in
    adulthood, and is frequently misdiagnosed as immune thrombocytopenic purpura,
    which matters because the two diseases are managed completely differently.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with biallelic form are usually diagnosed at a young age, typically with mucocutaneous bleeding, whereas monoallelic forms are generally identified later in life and are frequently misdiagnosed with immune thrombocytopenic purpura (ITP)."
    explanation: >-
      Contrasts the presentation age and the characteristic misdiagnosis of the two
      forms.
- phase: Lifelong episodic course
  notes: >-
    The underlying defect is static from birth, so the disease does not progress
    in the usual sense. What changes is exposure: menarche, trauma, surgery,
    dental procedures, and pregnancy each produce discrete bleeding events against
    a stable baseline. Prognosis is generally good with adequate supportive care.
  evidence:
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis is usually good with adequate supportive care but severe bleeding episodes can occur with menses, trauma and surgical procedures."
    explanation: >-
      Establishes the episodic, exposure-driven course against a good baseline
      prognosis.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Prognosis is generally good with adequate supportive care, and the disease is
    non-progressive, but the burden is real and chronic: near-universal
    menorrhagia in reproductive-age women, recurrent mucocutaneous bleeding,
    iron deficiency, and dependence on platelet transfusion with its
    alloimmunization risk. A recent multi-instrument quality-of-life study found
    the relationship between quality-of-life scores and bleeding-assessment score
    was weak, which is worth taking seriously: event count is not the same thing
    as lived burden, and the drivers appear to be chronic anemia, fatigue,
    treatment access, and disruption to school and work.
  evidence:
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis is usually good with adequate supportive care but severe bleeding episodes can occur with menses, trauma and surgical procedures."
    explanation: >-
      Supports a moderate rather than high burden level given adequate care.
  - reference: PMID:41100648
    reference_title: "Natural history & quality of life in Glanzmann thrombasthenia & Bernard Soulier syndrome: An observational study from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relationship between quality of life (QoL) scores and ISTH-BAT score was weak."
    explanation: >-
      Establishes the decoupling of measured bleeding severity from lived quality
      of life, which is why burden cannot be read off event counts.
diagnosis:
- name: Diagnostic Triad and Confirmatory Testing
  description: >-
    Diagnosis rests on prolonged skin bleeding time, a small number of very large
    platelets, defective ristocetin-induced agglutination, and low or absent
    GPIb-IX-V expression. Flow cytometry for surface complex expression is the
    modern confirmatory test in biallelic disease. Prothrombin consumption is
    markedly reduced, a finding that reports on the coagulation-support arm rather
    than the adhesion arm.
  evidence:
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on a prolonged skin bleeding time, the presence of a small number of very large platelets (macrothrombocytopenia), defective ristocetin-induced platelet agglutination and low or absent expression of the GPIb-V-IX complex."
    explanation: >-
      Sets out the classic diagnostic criteria.
- name: Genetic Testing, Essential in Monoallelic Disease
  description: >-
    In biallelic disease the laboratory phenotype is unambiguous. In monoallelic
    disease it is not: platelets are large rather than giant, the ristocetin
    response may be decreased or normal, and complex expression may be only
    partially reduced or normal, so genetic testing is what makes the diagnosis
    and separates it from immune thrombocytopenic purpura.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In biallelic BSS, giant platelets in the peripheral blood smear, absence of ristocetin-induced platelet aggregation (RIPA) using light transmission aggregometry (LTA), and complete loss of GPIbIX complex in flow cytometry are observed, whereas in monoallelic forms, genetic diagnosis is recommended due to the presence of large platelets in the peripheral blood smear, decreased or normal RIPA response in LTA, and partial loss or normal GPIbIX complex in flow cytometry."
    explanation: >-
      Establishes why genetic testing is required for the monoallelic form.
treatments:
- name: Antifibrinolytic Therapy
  description: >-
    Tranexamic acid, oral, topical as a mouthwash, or intravenous, is first-line
    for mucocutaneous bleeding and menorrhagia and is used peripartum alongside
    platelet transfusion. It is contraindicated in upper urinary tract bleeding
    because of the risk of clot obstruction, and generally avoided in pulmonary
    hemorrhage.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: MODULATES
    description: >-
      Antifibrinolytics do not restore platelet adhesion. They stabilize the clot
      that does form by blocking its breakdown, which is why they help
      mucocutaneous bleeding without touching the receptor defect. MODULATES
      rather than RESTORES for exactly that reason.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antifibrinolytics and oral contraceptives are utilized as supplementary treatments."
    explanation: >-
      Establishes antifibrinolytics as supplementary therapy in the current
      definitive review.
  - reference: PMID:36889343
    reference_title: "Bernard-Soulier Syndrome from the Perspective of the Obstetrician: A Case Report with a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Single donor platelet transfusions and oral tranexamic acid were administered as prophylaxis at the peripartum period."
    explanation: >-
      Documents peripartum use of tranexamic acid alongside platelet transfusion.
- name: Platelet Transfusion
  description: >-
    The mainstay of treatment for significant bleeding and for procedural
    prophylaxis, preferably HLA-matched, leukoreduced, single-donor apheresis
    product. Its central hazard is what makes the whole treatment algorithm
    escalate: repeated exposure drives HLA and anti-GPIb alloimmunization,
    producing refractoriness, and in mothers transplacental antibody can cause
    fetal or neonatal alloimmune thrombocytopenia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: RESTORES
    description: >-
      Transfused donor platelets carry a functional GPIb-IX-V complex and can
      execute the capture and plug-formation steps the patient's own platelets
      cannot.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet transfusion is the main therapy but recombinant factor VIIa is advised in alloimmunized patients, and allogeneic stem cell transplantation is suggested in refractory cases."
    explanation: >-
      Establishes platelet transfusion as the main therapy and sets out the
      escalation path when alloimmunization occurs.
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of bleeding or prophylaxis during surgical procedures usually requires platelet transfusion."
    explanation: >-
      Confirms platelet transfusion as the standard for both treatment and
      procedural prophylaxis.
- name: Recombinant Activated Factor VIIa
  description: >-
    Licensed for Glanzmann thrombasthenia rather than for this disease, so its use
    here is off-label but guideline-endorsed, and it is specifically advised where
    alloimmunization has made platelet transfusion ineffective. It works by
    bypassing the GPIb-dependent adhesion step entirely and driving thrombin
    generation on the platelet surface. Recent case-report evidence suggests a
    prophylactic weekly schedule can reduce bleeding frequency, but that is two
    patients, and access is a real constraint: none of the patients in a
    76-participant Indian natural-history cohort were receiving it.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: BYPASSES
    description: >-
      Drives thrombin generation on the platelet surface without requiring the
      GPIb-dependent capture step, which is why it works in a receptor-deficient
      platelet.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet transfusion is the main therapy but recombinant factor VIIa is advised in alloimmunized patients, and allogeneic stem cell transplantation is suggested in refractory cases."
    explanation: >-
      Establishes the indication for recombinant factor VIIa in alloimmunized
      patients.
  - reference: PMID:41259294
    reference_title: "Recombinant Factor VIIa Prophylaxis in 2 Brothers with Bernard-Soulier Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Following initiation of prophylaxis, both patients experienced a marked reduction in the frequency and severity of bleeding episodes."
    explanation: >-
      Supports a prophylactic schedule. PARTIAL because this is a case report of
      two siblings, with the authors themselves calling for studies to establish
      standardized protocols.
  - reference: PMID:41100648
    reference_title: "Natural history & quality of life in Glanzmann thrombasthenia & Bernard Soulier syndrome: An observational study from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet transfusion was the main mode of treatment; none of the patients in the present series were on activated recombinant factor VII (rFVIIa) therapy."
    explanation: >-
      Documents the real-world access gap for this therapy outside well-resourced
      settings.
- name: Hormonal Control of Menorrhagia
  description: >-
    Combined oral contraceptives, levonorgestrel-releasing intrauterine systems,
    progestins, and gonadotropin-releasing hormone agonists. Given that menorrhagia
    is close to universal in reproductive-age women with this disease and is the
    dominant route to iron deficiency, this is arguably the highest-yield routine
    intervention available.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levonorgestrel
      term:
        id: CHEBI:6443
        label: levonorgestrel
  target_mechanisms:
  - target: Menorrhagia
    treatment_effect: MODULATES
    description: >-
      Hormonal suppression reduces endometrial bleeding volume. It acts on the
      bleeding substrate rather than on the platelet, which is why it is effective
      for the single highest-burden manifestation while leaving the receptor
      defect untouched.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antifibrinolytics and oral contraceptives are utilized as supplementary treatments."
    explanation: >-
      Names oral contraceptives among the supplementary treatments.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Curative in principle, because the defect is intrinsic to the
    megakaryocyte lineage, and the only curative option currently available in
    the clinic; lentiviral gene therapy addresses the same origin but remains
    preclinical. Suggested for refractory disease. Reserved for
    severe transfusion-dependent or alloimmunized patients given the
    transplant-related morbidity and mortality.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic Loss of Function in GP1BA, GP1BB, or GP9
    treatment_effect: BYPASSES
    description: >-
      Replaces the patient's megakaryocyte lineage with donor cells carrying
      functional alleles, addressing both branches of the disease at once.
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet transfusion is the main therapy but recombinant factor VIIa is advised in alloimmunized patients, and allogeneic stem cell transplantation is suggested in refractory cases."
    explanation: >-
      Places allogeneic transplantation at the top of the escalation ladder for
      refractory disease.
- name: Eltrombopag
  description: >-
    A thrombopoietin-receptor agonist trialed in a mixed cohort of inherited
    thrombocytopenias that included monoallelic Bernard-Soulier syndrome. Response
    rates were substantial, but two caveats govern how far this generalizes. The
    trial included only monoallelic disease and only as part of a mixed cohort, so
    it is not evidence for biallelic disease. And mechanistically, raising the
    count of platelets that still cannot bind von Willebrand factor addresses only
    the thrombopoietic branch, leaving the adhesion defect untouched.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eltrombopag
      term:
        id: CHEBI:85010
        label: eltrombopag
  target_mechanisms:
  - target: Release of Fewer, Abnormally Large Platelets
    treatment_effect: MODULATES
    description: >-
      Thrombopoietin-receptor agonism raises platelet count. It does not act on the
      adhesion branch, so it addresses half the disease at most.
  evidence:
  - reference: PMID:31273088
    reference_title: "Eltrombopag for the treatment of inherited thrombocytopenias: a phase II clinical trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 23 patients evaluable for response, 11 (47.8%) achieved a major response (platelet count >100 ×109/L), ten (43.5%) had a minor response (platelet count at least twice the baseline value), and two patients (8.7%) did not respond."
    explanation: >-
      Reports the response rates. PARTIAL because the cohort was mixed and included
      only monoallelic Bernard-Soulier syndrome, so the result does not transfer to
      biallelic disease.
  - reference: PMID:31273088
    reference_title: "Eltrombopag for the treatment of inherited thrombocytopenias: a phase II clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled 24 patients affected by MYH9-related disease, ANKRD26-related thrombocytopenia, X-linked thrombocytopenia/ Wiskott-Aldrich syndrome, monoallelic Bernard-Soulier syndrome, or ITGB3-related thrombocytopenia."
    explanation: >-
      Documents the mixed cohort and the restriction to monoallelic disease, which
      is the basis for the PARTIAL grading above.
- name: Lentiviral Gene Therapy (Investigational)
  description: >-
    The most active research front, and the reason the transplantation entry
    above should not be read as the only conceivable cure. Lentiviral delivery of
    the missing subunit under a platelet-specific promoter has corrected the
    phenotype across all three genes: in GPIbalpha-null mice it corrected the tail
    bleeding time and improved the macrothrombocytopenia with sustained expression
    through serial transplant; in GPIbbeta-null mice it restored GPIb-IX in 97% of
    circulating platelets with normal bleeding times; and for type C it has
    reached patient material, correcting GPIX expression and platelet size in
    hematopoietic stem cells from two unrelated patients. No clinical trial of
    gene therapy in this disease has been conducted, so this is preclinical
    throughout and is curated as investigational.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failure of GPIb-IX-V Complex Assembly and Surface Expression
    treatment_effect: RESTORES
    description: >-
      Delivering a functional copy of the missing subunit to hematopoietic stem
      cells restores assembly and surface expression of the complex on the
      platelets those cells go on to produce, which addresses both branches of the
      disease at their shared origin.
  evidence:
  - reference: PMID:22044935
    reference_title: Correction of murine Bernard-Soulier syndrome by lentivirus-mediated gene therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therapeutic levels of hGPIbα expression were achieved that corrected the tail bleeding time and improved the macrothrombocytopenia."
    explanation: >-
      Demonstrates correction of both the hemostatic and the thrombopoietic arm in
      the GPIbalpha-null mouse.
  - reference: PMID:27148783
    reference_title: Lentiviral gene rescue of a Bernard-Soulier mouse model to study platelet glycoprotein Ibβ function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hGPIbβ transplanted into the bone marrow of GPIbβ(null) mice rescued GPIb-IX expression in 97% of circulating platelets."
    explanation: >-
      Quantifies the reconstitution achievable by the same strategy applied to the
      GPIbbeta route.
  - reference: PMID:37416759
    reference_title: Lentiviral gene therapy reverts GPIX expression and phenotype in Bernard-Soulier syndrome type C.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Finally, hematopoietic stem cells from two unrelated BSS type C patients were transduced with the gene therapy vectors and differentiated to produce GPIX-expressing megakaryocytes and platelets with a reduced size."
    explanation: >-
      The most advanced human evidence in this disease, correcting expression and
      platelet size in cells from two patients. PARTIAL because it is ex vivo
      correction of patient-derived cells rather than treatment of patients.
animal_models:
- name: GPIbalpha-null mouse
  species: Mouse
  genotype: GP Ibalpha knockout
  description: >-
    The mouse that resolved a 50-year-old question. Disrupting the gene encoding
    the alpha subunit reproduces the hallmark features of the human disease, and
    critically established that the giant-platelet and thrombocytopenia phenotype
    is a direct consequence of the missing receptor rather than an incidental
    association. Transgenic expression of human GPIbalpha rescues the phenotype,
    closing the causal loop.
  publication: PMID:10706630
  modeled_mechanisms:
  - target: Release of Fewer, Abnormally Large Platelets
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knockout reproduces mild thrombocytopenia with giant platelets and a
      bleeding phenotype, and rescue by transgenic human GPIbalpha demonstrates the
      dependency directly.
    limitations: >-
      Mouse platelets differ from human in size and count baselines, and the model
      addresses the GP1BA route only, so it says nothing about how GP1BB or GP9
      variants produce the same phenotype. Murine bleeding assays (tail bleeding
      time) correspond only loosely to human mucocutaneous bleeding.
    evidence:
    - reference: PMID:10706630
      reference_title: "Generation and rescue of a murine model of platelet dysfunction: the Bernard-Soulier syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have disrupted the gene encoding the alpha-subunit of mouse GP Ib-IX-V (GP Ibalpha) and describe a murine model recapitulating the hallmark characteristics of the human Bernard-Soulier syndrome."
      explanation: >-
        States that the model recapitulates the hallmark features of the human
        disease.
- name: Cocker Spaniel GP9 large-deletion natural model
  species: Dog
  genotype: Homozygous 2460 bp deletion in the single coding exon of canine GP9
  description: >-
    The only naturally occurring animal model of this disease, and worth listing
    alongside two engineered knockouts precisely because nobody built it. Four
    Cocker Spaniels with a mild to severe bleeding disorder showed
    macrothrombocytopenia and absent functional GPIb-IX-V, and whole genome
    sequencing identified a 2460 bp deletion removing most of the single coding
    exon of canine GP9, with recessive inheritance confirmed by genotyping and
    the homozygous genotype absent from 98 control Cocker Spaniels. It is the
    canine counterpart of human BSS type C.
  publication: PMID:31484196
  modeled_mechanisms:
  - target: Failure of GPIb-IX-V Complex Assembly and Surface Expression
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A spontaneous GP9 null produces absent functional GPIb-IX-V with
      macrothrombocytopenia and a bleeding phenotype, arrived at naturally rather
      than by engineering.
    limitations: >-
      Four dogs from one breed, so the phenotypic range is not established, and
      canine platelet biology differs from human in baseline count and size.
      Characterization is at the level of platelet count, morphology, and
      immunocytochemistry; the proplatelet-formation and adhesion assays that
      anchor the two-branch model in the mouse have not been run here.
    readouts:
    - name: Functional GPIb-IX-V on canine platelets by immunocytochemistry
      target: Failure of GPIb-IX-V Complex Assembly and Surface Expression
      direction: ABOLISHED
      interpretation: >-
        Absent functional complex is the direct correlate of the GP9 null, and the
        same readout that defines the human disease.
      evidence:
      - reference: PMID:31484196
        reference_title: A large deletion in the GP9 gene in Cocker Spaniel dogs with Bernard-Soulier syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, the lack of functional GPIb-IX-V was demonstrated by immunocytochemistry."
        explanation: >-
          Reports the measured absence of functional complex in the affected dogs.
    evidence:
    - reference: PMID:31484196
      reference_title: A large deletion in the GP9 gene in Cocker Spaniel dogs with Bernard-Soulier syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The affected dogs showed a platelet adhesion defect characterized by macrothrombocytopenia with variable platelet counts resembling human Bernard-Soulier syndrome (BSS)."
      explanation: >-
        Establishes the phenotypic correspondence to the human disease.
    - reference: PMID:31484196
      reference_title: A large deletion in the GP9 gene in Cocker Spaniel dogs with Bernard-Soulier syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings provide the first large animal GP9 model for this group of inherited platelet disorders and greatly facilitate the diagnosis and identification of affected and/or normal carriers in Cocker Spaniels."
      explanation: >-
        The authors' own framing of the model's value as the first large-animal
        GP9 model.
- name: GPIbbeta-null mouse
  species: Mouse
  genotype: GPIbbeta knockout
  description: >-
    The model that localized the thrombopoietic defect. Megakaryocyte progenitor
    number, differentiation, maturation class, and endoreplication are all normal;
    the failure is specifically at the proplatelet-formation stage, with a poorly
    developed demarcation membrane system and a doubled marginal microtubule ring.
  publication: PMID:19377075
  modeled_mechanisms:
  - target: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Proplatelet extension is reduced by 41% in cultured knockout megakaryocytes
      with normal upstream differentiation, localizing the lesion precisely to
      proplatelet formation.
    limitations: >-
      The proportional reduction in proplatelet formation is measured in cultured
      fetal-liver-derived megakaryocytes rather than in vivo, and the mouse
      addresses the GP1BB route only. Human patient megakaryocyte culture is needed
      to confirm translation, and does.
    readouts:
    - name: Proportion of megakaryocytes extending proplatelets
      target: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
      direction: DECREASED
      interpretation: >-
        A 41% reduction in proplatelet-forming capacity with normal upstream
        differentiation is the quantitative core of the thrombopoietic branch.
      evidence:
      - reference: PMID:19377075
        reference_title: "Intrinsic impaired proplatelet formation and microtubule coil assembly of megakaryocytes in a mouse model of Bernard-Soulier syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "GPIbbeta(-/-) megakaryocytes could be differentiated in culture from Lin(-) fetal liver cells in normal amounts but the proportion of cells able to extend proplatelets was decreased by 41%."
        explanation: >-
          Quantifies the proplatelet formation deficit against normal
          differentiation.
    evidence:
    - reference: PMID:19377075
      reference_title: "Intrinsic impaired proplatelet formation and microtubule coil assembly of megakaryocytes in a mouse model of Bernard-Soulier syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Altogether, these findings point to a role of the GPIb-V-IX complex intrinsic to megakaryocytes at the stage of proplatelet formation and suggest a functional link with the underlying microtubular cytoskeleton in platelet biogenesis."
      explanation: >-
        The authors' own conclusion locating the defect at proplatelet formation
        and linking it to the microtubular cytoskeleton.
experimental_models:
- name: Patient-derived megakaryocyte culture (Bolzano heterozygotes)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Megakaryocytes differentiated from cord blood and peripheral blood of patients
    heterozygous for the Bolzano variant. This is what makes the thrombopoietic
    branch a human finding rather than a mouse one: differentiation is normal,
    but proplatelet formation is halved, proplatelet tips are enlarged in
    proportion to the enlarged circulating platelets, and alpha-tubulin
    distribution is severely deranged.
  publication: PMID:19067792
  modeled_mechanisms:
  - target: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the proplatelet-formation defect and the microtubule derangement
      in human patient cells, converging with the mouse knockouts.
    limitations: >-
      The patients studied were monoallelic Bolzano heterozygotes with mild
      disease, so the magnitude of the defect in biallelic disease is not directly
      measured here. Cultured megakaryocytes may not reproduce the marrow
      microenvironment that governs proplatelet release in vivo.
    readouts:
    - name: Proplatelet formation by cultured patient megakaryocytes
      target: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
      direction: DECREASED
      interpretation: >-
        A 50% reduction in proplatelet formation in human patient megakaryocytes
        against normal differentiation is the human counterpart of the mouse
        result.
      evidence:
      - reference: PMID:19067792
        reference_title: "Proplatelet formation in heterozygous Bernard-Soulier syndrome type Bolzano."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Megakaryocyte differentiation from both cord blood (one patient) and peripheral blood (five patients) was comparable to controls. However, proplatelet formation was reduced by about 50% with respect to controls."
        explanation: >-
          Quantifies the human proplatelet formation deficit against normal
          differentiation.
    evidence:
    - reference: PMID:19067792
      reference_title: "Proplatelet formation in heterozygous Bernard-Soulier syndrome type Bolzano."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that a defect of platelet formation contributes to macrothrombocytopenia associated to the Bolzano mutation, and indicate a key role for GPIb alpha in proplatelet formation."
      explanation: >-
        States the authors' conclusion that a platelet-formation defect contributes
        to the macrothrombocytopenia in humans.
discussions:
- discussion_id: bss_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines bleeding severity in Bernard-Soulier syndrome, given that it
    does not track genotype, platelet count, or receptor expression level?
  attaches_to:
  - pathophysiology#Failure of Primary Hemostatic Plug Formation
  rationale: >-
    In the largest systematically evaluated single-center series, bleeding
    severity varied widely between individuals while thrombocytopenia was
    uniformly moderate and GPIbalpha expression uniformly under 10% of control.
    The authors were explicit that they could define no correlations. That
    combination, a variable output with the measured inputs pinned, is the shape
    you would expect if unidentified modifiers were doing the work. No modifier
    allele has been established. This is a genuine gap in the literature rather
    than a gap in searching, and it has direct clinical consequence because there
    is currently no way to predict which patient will bleed badly.
  evidence:
  - reference: PMID:21173099
    reference_title: "Clinical and genetic aspects of Bernard-Soulier syndrome: searching for genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regardless of mutations identified, the patients' bleeding diathesis did not correlate with thrombocytopenia, which was always moderate, and platelet GPIbalpha expression, which was always severely impaired."
    explanation: >-
      Establishes the absence of correlation with the two obvious candidate
      predictors.
  - reference: PMID:21173099
    reference_title: "Clinical and genetic aspects of Bernard-Soulier syndrome: searching for genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aware of the limitations of our cohort, we cannot define any correlations."
    explanation: >-
      The authors' own statement of the negative result, with its cohort-size
      caveat.
- discussion_id: bss_gp5_never_implicated
  kind: OPEN_QUESTION
  prompt: >-
    Why has no Bernard-Soulier-causing variant ever been found in GP5, the fourth
    subunit of the complex?
  attaches_to:
  - pathophysiology#Biallelic Loss of Function in GP1BA, GP1BB, or GP9
  rationale: >-
    GP5 encodes GPV, the fourth subunit, and it maps to a known locus like the
    other three, yet across 211 genotyped families and two decades of review no
    disease-causing GP5 variant has been reported. The straightforward reading is
    that GPV is dispensable for complex assembly and surface expression, so losing
    it does not produce the phenotype. This is a real curatable negative rather
    than an artifact of ascertainment, and it constrains any model of how the
    complex assembles.
  evidence:
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes coding for the four subunits of the receptor, GPIBA, GPIBB, GP5 and GP9, map to chromosomes 17p12, 22q11.2, 3q29, and 3q21, respectively. Defects have been identified in GPIBA, GPIBB, and GP9 but not in GP5."
    explanation: >-
      States the negative finding alongside the three positive genes.
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, no BSS mutations in the GP5 gene have been reported."
    explanation: >-
      Confirms the negative finding still stands in the current definitive review,
      nearly twenty years later.
- discussion_id: bss_gene_therapy_no_clinical_trial
  kind: KNOWLEDGE_GAP
  prompt: >-
    Lentiviral gene therapy corrects the phenotype across all three causal genes
    and now works in patient-derived cells, so why has no clinical trial been
    conducted?
  attaches_to:
  - pathophysiology#Failure of GPIb-IX-V Complex Assembly and Surface Expression
  rationale: >-
    The preclinical package is unusually complete for a disease this rare:
    correction in GPIbalpha-null and GPIbbeta-null mice with sustained expression
    through serial transplant, and ex vivo correction of hematopoietic stem cells
    from two unrelated type C patients. What is missing is any clinical trial. The
    plausible obstacles are the conditioning regimen required for stem cell gene
    therapy against a disease whose prognosis is generally good with supportive
    care, the very small and geographically scattered patient population, and the
    absence of an agreed clinical endpoint given that bleeding score correlates
    only weakly with lived burden. None of these has been formally addressed in
    the literature, so the gap between a solved preclinical problem and an untried
    clinical one is recorded here rather than explained.
  evidence:
  - reference: PMID:37416759
    reference_title: Lentiviral gene therapy reverts GPIX expression and phenotype in Bernard-Soulier syndrome type C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results demonstrate the potential of lentiviral-based gene therapy to rescue BSS type C."
    explanation: >-
      States the preclinical conclusion, which is as far as the evidence currently
      goes.
- discussion_id: bss_qol_decoupled_from_bleeding_score
  kind: OPEN_QUESTION
  prompt: >-
    Why is quality of life only weakly related to bleeding-assessment score in
    inherited platelet function disorders, and what should be measured instead?
  attaches_to:
  - phenotypes#Iron Deficiency Anemia
  rationale: >-
    A recent multi-instrument study using EQ-5D, SF-36, and FACIT alongside annual
    bleed rate and the ISTH bleeding assessment tool found the relationship
    between quality-of-life scores and bleeding score was weak. If event count does
    not predict lived burden, then trials and clinical follow-up anchored on bleed
    rate are measuring the wrong thing. The plausible drivers are chronic anemia
    and fatigue, treatment access, and disruption to schooling and work, none of
    which a bleeding score captures, but this has not been formally decomposed.
  evidence:
  - reference: PMID:41100648
    reference_title: "Natural history & quality of life in Glanzmann thrombasthenia & Bernard Soulier syndrome: An observational study from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relationship between quality of life (QoL) scores and ISTH-BAT score was weak."
    explanation: >-
      The finding that motivates the question.
differential_diagnoses:
- name: Immune Thrombocytopenic Purpura
  description: >-
    The most consequential misdiagnosis, and the one monoallelic disease routinely
    receives. The two are managed completely differently, so getting it wrong
    means immunosuppression and sometimes splenectomy for a structural receptor
    defect that will not respond. Chronic persistent thrombocytopenia, a positive
    family history, unresponsive immune thrombocytopenic purpura treatment,
    macrothrombocytopenia, and an absent ristocetin response should all prompt
    reconsideration.
  distinguishing_features:
  - Lifelong and familial rather than acquired
  - Large or giant platelets rather than normal-sized
  - Absent or reduced ristocetin-induced aggregation
  - Failure to respond to immune thrombocytopenic purpura therapy
  evidence:
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, BSS should be kept in mind in the presence of individuals with chronic persistent thrombocytopenia, positive family history, unresponsive ITP treatment, macrothrombocytopenia, and absence of RIPA response."
    explanation: >-
      Sets out the specific features that should prompt reconsideration of an
      immune thrombocytopenic purpura diagnosis.
- name: von Willebrand Disease
  description: >-
    The other disease of the von Willebrand factor to GPIbalpha axis, approached
    from the opposite side. In von Willebrand disease the plasma ligand is
    deficient or defective; here the platelet receptor is. The discriminating test
    is whether adding normal plasma corrects the ristocetin response: it does in
    von Willebrand disease and it cannot here, because the receptor is simply not
    there.
  distinguishing_features:
  - Ristocetin response corrected by normal plasma in von Willebrand disease, not
    in Bernard-Soulier syndrome
  - Platelet count and size normal in most von Willebrand disease
  - Plasma von Willebrand factor antigen and activity abnormal in von Willebrand
    disease
  evidence:
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a consequence, platelets are unable to adhere to the vascular subendothelium and agglutinate in response to ristocetin."
    explanation: >-
      The platelet-intrinsic basis of the ristocetin failure, which is what makes
      it uncorrectable by normal plasma.
- name: Acquired (Autoantibody-Mediated) Bernard-Soulier Phenotype
  description: >-
    Anti-GPIb/IX autoantibodies can produce a phenocopy in a person with normal
    genes. It presents later, without a family history, and it is a different
    disease requiring immunomodulation rather than supportive hemostatic care. A
    recent Moroccan series of seven patients included one such case, which is a
    useful reminder that the laboratory phenotype alone does not establish the
    genetic diagnosis.
  distinguishing_features:
  - Acquired later-life onset without family history
  - Anti-GPIb/IX autoantibodies detectable
  - No pathogenic GP1BA, GP1BB, or GP9 variant
  evidence:
  - reference: PMID:40703326
    reference_title: "Bernard-Soulier Syndrome: Case Studies From Morocco."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis of constitutional BSS was established in six patients, while only one case was idiopathic acquired BSS."
    explanation: >-
      Documents an acquired case alongside constitutional cases in the same series.
clinical_trials:
- name: NCT02422394
  phase: PHASE_II
  status: COMPLETED
  description: >-
    The eltrombopag phase 2 in inherited thrombocytopenias, published as
    PMID:31273088. Relevant here only in part: the cohort was mixed across several
    inherited thrombocytopenias and included monoallelic Bernard-Soulier syndrome
    only, so it is not evidence for the biallelic disease, and raising the count of
    platelets that still cannot bind von Willebrand factor addresses one branch at
    most.
  target_phenotypes:
  - preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  evidence:
  - reference: clinicaltrials:NCT02422394
    reference_title: Eltrombopag for Inherited Thrombocytopenias
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eltrombopag is a drug, available in tablets, which stimulates the production of platelets by the bone marrow."
    explanation: >-
      Registry record establishing the agent and its mechanism, which acts on
      platelet production rather than on platelet adhesion.
  - reference: PMID:31273088
    reference_title: "Eltrombopag for the treatment of inherited thrombocytopenias: a phase II clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled 24 patients affected by MYH9-related disease, ANKRD26-related thrombocytopenia, X-linked thrombocytopenia/ Wiskott-Aldrich syndrome, monoallelic Bernard-Soulier syndrome, or ITGB3-related thrombocytopenia."
    explanation: >-
      Documents the mixed cohort and the restriction to monoallelic disease, which
      is why the result does not transfer to biallelic Bernard-Soulier syndrome.

notes: >-
  The two-branch model is the organizing idea of this entry and it is
  experimentally earned rather than merely tidy. A chimeric receptor swapping the
  GPIbalpha ectodomain for an unrelated one doubles platelet count and halves
  platelet size while leaving the bleeding phenotype severe. Cytoplasmic tail
  drives size and count; ectodomain drives hemostasis. Two jobs, two domains,
  cleanly dissociable, which is why the pathograph branches at the
  surface-expression node rather than running as a single chain.

  A third contributor is recorded as an EMERGING mechanistic_hypotheses entry
  rather than as a node: shear-induced unfolding of the GPIbalpha mechanosensory
  domain triggers platelet clearance, so a destabilizing missense variant could in
  principle shorten platelet survival independently of production. The direct link
  from BSS-causing variants to accelerated clearance in patients has not been
  demonstrated, so it stays a hypothesis.

  GPIbbeta cytoplasmic-tail deletion in mouse produced enhanced arterial
  thrombosis, a repressor role that studies in heterologous cells had not
  predicted. It is not modeled here because it describes a gain of thrombotic
  function from a specific engineered deletion rather than anything observed in
  patients, but it is the kind of cell-line-versus-in-vivo discordance worth
  keeping in view when reasoning about this receptor.

  Prevalence is recorded as CASES_IN_LITERATURE rather than as a population rate.
  The available figures are a count of about 100 reported cases and 211 genotyped
  families; no validated population prevalence estimate was found, and converting
  a case count into a rate would be invention.

  Recombinant factor VIIa carries no therapeutic_agent binding. The available NCIT
  term for coagulation factor VIIa is not a reliable member of the therapeutic
  agent enum in this repository, and rather than force a binding that would fail
  validation the agent identity is carried in the treatment name and description.

  Deep research. Curated from a claude_code deep-research report
  (research/Bernard-Soulier_Syndrome-deep-research-claude_code.md), whose own
  reference validation reported 34/34 references verified with a confabulation
  rate of 0.0. Every snippet used here was independently re-verified against the
  cached PubMed record.

      syndrome.
pathophysiology:
- name: Biallelic Loss of Function in GP1BA, GP1BB, or GP9
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Pathogenic variants in any one of the three genes encoding the GPIbalpha,
    GPIbbeta, or GPIX subunits cause the disease. Across 211 genotyped families
    the burden splits GP9 44%, GP1BA 28%, GP1BB 28%, spanning 112 distinct
    variants of every class, and 85% of probands are homozygous with founder
    effects in several regions. The fourth subunit gene, GP5, has never been
    implicated, which is a genuine negative finding rather than an absence of
    looking.
  genes:
  - preferred_term: GP1BA
    term:
      id: hgnc:4439
      label: GP1BA
  - preferred_term: GP1BB
    term:
      id: hgnc:4440
      label: GP1BB
  - preferred_term: GP9
    term:
      id: hgnc:4444
      label: GP9
  downstream:
  - target: Failure of GPIb-IX-V Complex Assembly and Surface Expression
    description: >-
      Loss of any one subunit prevents the complex reaching the platelet
      membrane, because assembly is obligately stoichiometric.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With 79 additional families for which molecular data were gleaned from the literature, the 211 families characterized so far have mutations in the GP1BA (28%), GP1BB (28%), or GP9 (44%) genes."
    explanation: >-
      Gives the genotype distribution across the largest assembled cohort.
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes coding for the four subunits of the receptor, GPIBA, GPIBB, GP5 and GP9, map to chromosomes 17p12, 22q11.2, 3q29, and 3q21, respectively. Defects have been identified in GPIBA, GPIBB, and GP9 but not in GP5."
    explanation: >-
      Establishes the three causal genes and the negative finding for GP5.
  - reference: PMID:39191409
    reference_title: "Bernard-Soulier Syndrome: A Review of Epidemiology, Molecular Pathology, Clinical Features, Laboratory Diagnosis, and Therapeutic Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, no BSS mutations in the GP5 gene have been reported."
    explanation: >-
      Independently restates the GP5-negative finding in the current definitive
      review.
- name: Failure of GPIb-IX-V Complex Assembly and Surface Expression
  biological_scale: CELLULAR
  description: >-
    The dominant molecular consequence is failure of the complex to reach the
    platelet surface at all, because assembly is obligately stoichiometric and a
    single null subunit sinks the whole receptor. A minority of variants instead
    permit surface expression but abolish von Willebrand factor binding, a
    genuinely separate mechanism with the same clinical result. Surface
    GPIbalpha in biallelic disease is consistently under 10% of control values.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  cellular_components:
  - preferred_term: glycoprotein Ib-IX-V complex
    term:
      id: GO:1990779
      label: glycoprotein Ib-IX-V complex
    modifier: ABSENT
  downstream:
  - target: Loss of von Willebrand Factor Capture Under Shear
    description: >-
      Without surface receptor there is no von Willebrand factor A1 domain
      capture, so platelet tethering under arterial shear never begins.
    causal_link_type: DIRECT
  - target: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
    description: >-
      Loss of the complex removes the cytoplasmic-tail linkage to filamin A and
      14-3-3 zeta that anchors the membrane skeleton during proplatelet
      extrusion.
    causal_link_type: DIRECT
  - target: Loss of Platelet-Surface Coagulation Factor Binding
    description: >-
      GPIbalpha also binds thrombin, factor XI, factor XII, and
      high-molecular-weight kininogen, so its absence degrades
      platelet-supported coagulation as well as adhesion.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the mutations identified in the genes encoding for the GP1BA (GPIbα), GP1BB (GPIbβ), and GP9 (GPIX) subunits prevent expression of the complex at the platelet membrane or more rarely its interaction with VWF."
    explanation: >-
      Establishes the two molecular consequence classes, failed surface
      expression and, more rarely, failed ligand interaction.
  - reference: PMID:21173099
    reference_title: "Clinical and genetic aspects of Bernard-Soulier syndrome: searching for genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with expression levels of GPIbα always lower than 10% of control values, platelet aggregation was absent or severely reduced."
    explanation: >-
      Quantifies the residual surface expression in biallelic disease and links it
      to the functional readout.
- name: Loss of von Willebrand Factor Capture Under Shear
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Adhesion to the Injured Vessel Wall"
  description: >-
    Under arterial shear, von Willebrand factor unfurls on exposed subendothelium
    and its A1 domain is the only thing fast enough to catch a platelet moving at
    that velocity. GPIbalpha is the catcher's mitt. Without it there is no capture
    step, so nothing downstream ever starts: no rolling, no outside-in signaling,
    no inside-out activation of the integrin alphaIIb-beta3, no firm adhesion.
    The laboratory expression of this node is the absent ristocetin-induced
    agglutination that is not corrected by adding normal plasma, which is the
    entire diagnostic logic of the disease in one sentence.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    description: >-
      Without the capture step no platelet aggregate forms at the site of vessel
      injury.
    causal_link_type: DIRECT
  - target: Impaired Ristocetin-Induced Platelet Aggregation
    description: >-
      Ristocetin artificially promotes von Willebrand factor to GPIbalpha
      engagement, so a platelet lacking the receptor cannot agglutinate however
      much normal plasma is supplied.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24934643
    reference_title: Spectrum of the mutations in Bernard-Soulier syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a consequence, platelets are unable to adhere to the vascular subendothelium and agglutinate in response to ristocetin."
    explanation: >-
      States both the adhesion failure and its diagnostic laboratory correlate.
  - reference: PMID:23336709
    reference_title: "The organizing principle of the platelet glycoprotein Ib-IX-V complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The glycoprotein (GP)Ib-IX-V complex is the platelet receptor for von Willebrand factor and many other molecules that are critically involved in hemostasis and thrombosis."
    explanation: >-
      Establishes the receptor identity and its role as a multi-ligand hemostatic
      hub.
- name: Loss of Platelet-Surface Coagulation Factor Binding
  biological_scale: MOLECULAR
  description: >-
    GPIbalpha is not only a von Willebrand factor receptor. It also binds
    thrombin, factor XI, factor XII, high-molecular-weight kininogen, P-selectin,
    and the leukocyte integrin Mac-1. Losing this hub degrades
    platelet-supported coagulation and platelet-leukocyte crosstalk on top of the
    adhesion defect, and the clinical fingerprint of that second loss is the
    markedly reduced prothrombin consumption seen in these patients. This is the
    arm that gets dropped from modern write-ups, and it is part of why bleeding is
    worse than a pure adhesion defect would predict.
  cellular_components:
  - preferred_term: glycoprotein Ib-IX-V complex
    term:
      id: GO:1990779
      label: glycoprotein Ib-IX-V complex
    modifier: ABSENT
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    description: >-
      Loss of platelet-supported coagulation compounds the adhesion failure at the
      site of injury.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17109744
    reference_title: Bernard-Soulier syndrome (hemorrhagiparous thrombocytic dystrophy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prothrombin consumption is markedly reduced."
    explanation: >-
      The laboratory fingerprint of impaired platelet-supported coagulation,
      distinct from the adhesion defect.
  - reference: PMID:23336709
    reference_title: "The organizing principle of the platelet glycoprotein Ib-IX-V complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The glycoprotein (GP)Ib-IX-V complex is the platelet receptor for von Willebrand factor and many other molecules that are critically involved in hemostasis and thrombosis."
    explanation: >-
      Supports the multi-ligand character of the receptor beyond von Willebrand
      factor.
- name: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
  biological_scale: CELLULAR
  description: >-
    The second job. The GPIbalpha cytoplasmic tail binds filamin A and 14-3-3
    zeta, anchoring the membrane skeleton to the underlying cytoskeleton while a
    megakaryocyte extrudes proplatelets. Without it, megakaryocyte progenitor
    numbers, differentiation, and endoreplication are all normal, but the mature
    cells have a thickened peripheral zone and a poorly developed demarcation
    membrane system, proplatelet extension falls by about 41%, and the marginal
    microtubular ring contains twice as many tubulin fibers. The same defect is
    demonstrable in cultured human megakaryocytes from patients, with proplatelet
    formation reduced about 50%, enlarged proplatelet tips, and severely deranged
    alpha-tubulin distribution. Human and mouse converge here unusually well for a
    rare disease.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  downstream:
  - target: Release of Fewer, Abnormally Large Platelets
    description: >-
      Deranged proplatelet formation yields fewer platelets, each larger than
      normal.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19377075
    reference_title: "Intrinsic impaired proplatelet formation and microtubule coil assembly of megakaryocytes in a mouse model of Bernard-Soulier syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The number of megakaryocyte progenitors, their differentiation and progressive maturation into distinct classes and their level of endoreplication were normal in GPIbbeta(-/-) bone marrow. However, the more mature cells exhibited ultrastructural anomalies with a thicker peripheral zone and a less well developed demarcation membrane system."
    explanation: >-
      Localizes the defect to late megakaryocyte maturation rather than to
      progenitor number or differentiation.
  - reference: PMID:19377075
    reference_title: "Intrinsic impaired proplatelet formation and microtubule coil assembly of megakaryocytes in a mouse model of Bernard-Soulier syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The marginal microtubular ring contained twice as many tubulin fibers in GPIbbeta(-/-) proplatelet buds in cultured and circulating platelets."
    explanation: >-
      Provides the cytoskeletal abnormality that accompanies the proplatelet
      defect.
  - reference: PMID:19067792
    reference_title: "Proplatelet formation in heterozygous Bernard-Soulier syndrome type Bolzano."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Morphological evaluation of proplatelet formation revealed an increased size of proplatelet tips, which was consistent with the increased diameters of patients' blood platelets. Moreover, alpha-tubulin distribution within proplatelets was severely deranged."
    explanation: >-
      Demonstrates the same proplatelet and microtubule abnormality in cultured
      human patient megakaryocytes, not only in mouse.
- name: Release of Fewer, Abnormally Large Platelets
  biological_scale: TISSUE
  description: >-
    The output of the thrombopoietic branch: a moderate thrombocytopenia,
    typically not severe, with platelets that can approach lymphocyte size. The
    two arms of the disease are cleanly dissociable at the domain level. A
    chimeric receptor swapping the GPIbalpha ectodomain for an unrelated one
    doubles the circulating platelet count and halves platelet size while leaving
    the bleeding phenotype severe, so the cytoplasmic tail drives size and count
    and the ectodomain drives hemostasis.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Macrothrombocytopenia
    description: Fewer and larger circulating platelets.
    causal_link_type: DIRECT
  - target: Giant Platelets
    description: Released platelets are abnormally large.
    causal_link_type: DIRECT
  - target: Increased Mean Platelet Volume
    description: The size shift raises measured mean platelet volume.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10706630
    reference_title: "Generation and rescue of a murine model of platelet dysfunction: the Bernard-Soulier syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results demonstrate a direct link between expression of a GP Ib-IX-V complex and normal megakaryocytopoiesis and platelet morphogenesis."
    explanation: >-
      Establishes the causal link between the receptor and platelet production,
      which had been assumed but unproven for decades.
  - reference: PMID:12200373
    reference_title: "Amelioration of the macrothrombocytopenia associated with the murine Bernard-Soulier syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The characterization of these mice revealed a 2-fold increase in circulating platelet count and a 50% reduction in platelet size when compared with platelets from the mouse model of the Bernard-Soulier syndrome."
    explanation: >-
      The chimeric-receptor rescue quantifying how much of the size and count
      phenotype is attributable to the cytoplasmic tail rather than the
      ectodomain.
  - reference: PMID:12200373
    reference_title: "Amelioration of the macrothrombocytopenia associated with the murine Bernard-Soulier syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing the chimeric receptor retain a severe bleeding phenotype, confirming a critical role for the GP Ibalpha extracytoplasmic domain in hemostasis."
    explanation: >-
      The other half of the dissociation: rescuing size and count does not rescue
      bleeding, so the two branches are separable.
- name: Failure of Primary Hemostatic Plug Formation

mechanistic_hypotheses:
- hypothesis_group_id: shear_mechanosensor_platelet_clearance
  hypothesis_label: GPIbalpha Mechanosensory Domain Unfolding as a Platelet-Clearance Timer
  status: EMERGING
  description: >-
    A third, newer contributor to the thrombocytopenia that is not part of the
    canonical two-branch model. GPIbalpha contains a relatively unstable
    mechanosensory domain; von Willebrand factor binding under physiological shear
    unfolds it, and the unfolded domain triggers intracellular signaling and rapid
    platelet clearance. If a BSS-causing missense variant destabilized that domain,
    it could in principle shorten platelet survival independently of production,
    adding a clearance mechanism alongside the production defect. The direct link
    from BSS-causing variants to accelerated clearance in patients has not been
    demonstrated, which is why this is EMERGING and is deliberately not modeled as
    a pathophysiology node.
  evidence:
  - reference: PMID:27670775
    reference_title: Platelet clearance via shear-induced unfolding of a membrane mechanoreceptor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The unfolded MSD, particularly the juxtamembrane 'Trigger' sequence therein, leads to intracellular signalling and rapid platelet clearance."
    explanation: >-
      Establishes the mechanosensory-unfolding to clearance link in the receptor,
      which is the basis for the hypothesis.
phenotypes:
- name: Macrothrombocytopenia
  category: Hematologic
  description: >-
    The defining laboratory finding: a reduced platelet count combined with
    abnormally large platelets. Thrombocytopenia is characteristically moderate
    rather than severe, which is part of why the bleeding severity surprises
    people.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on a prolonged skin bleeding time, the presence of a small number of very large platelets (macrothrombocytopenia), defective ristocetin-induced platelet agglutination and low or absent expression of the GPIb-V-IX complex."
    explanation: >-
      Establishes macrothrombocytopenia as part of the diagnostic definition,
      supporting an OBLIGATE band.
  - reference: PMID:21173099
    reference_title: "Clinical and genetic aspects of Bernard-Soulier syndrome: searching for genotype/phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients all had a moderate thrombocytopenia with giant platelets and a bleeding tendency whose severity varied among individuals."
    explanation: >-
      All 13 patients in the largest single-center series had moderate
      thrombocytopenia with giant platelets.

name: Bernard-Soulier Syndrome
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Inherited Platelet Disorder
- Bleeding Disorder
disease_term:
  preferred_term: Bernard-Soulier Syndrome
  term:
    id: MONDO:0009276
    label: Bernard-Soulier syndrome
synonyms:
- BSS
- hemorrhagiparous thrombocytic dystrophy
- congenital hemorrhagiparous thrombocytic dystrophy
- giant platelet syndrome
- macrothrombocytopenia, Bernard-Soulier type
description: >-
  Bernard-Soulier syndrome is an inherited bleeding disorder of the
  megakaryocyte and platelet lineage caused by absence, deficiency, or
  dysfunction of the platelet GPIb-IX-V complex, the receptor that captures von
  Willebrand factor. The clinical triad is a bleeding tendency out of proportion
  to the platelet count, abnormally large platelets, and moderate
  thrombocytopenia. What makes the disease conceptually neat is that the
  receptor turns out to be doing two unrelated jobs at once. Its ectodomain is
  the grappling hook a platelet throws at a damaged vessel wall under arterial
  shear; its cytoplasmic tail is a structural anchor tying the membrane skeleton
  to the cytoskeleton while a megakaryocyte extrudes proplatelets. Lose the
  complex and both jobs fail, which is why one gene defect produces a platelet
  that cannot stick and a platelet that was built wrong in the first place.
  Biallelic variants in GP1BA, GP1BB, or GP9 cause the classic recessive disease;
  monoallelic GP1BA and GP1BB variants cause a milder dominant form that is
  routinely misdiagnosed as immune thrombocytopenic purpura. No BSS-causing
  variant has ever been reported in GP5, the fourth subunit. Treatment is
  supportive, built on antifibrinolytics and platelet transfusion, with the
  central long-term hazard being alloimmunization from repeated transfusion.

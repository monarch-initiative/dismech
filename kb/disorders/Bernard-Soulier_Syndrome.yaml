- name: Increased Mean Platelet Volume
  category: Hematologic
  description: >-
    The quantitative expression of the giant-platelet phenotype on automated
    counting, and a reason automated analyzers can underreport the platelet count
    by excluding the largest platelets from the gate.
  phenotype_term:
    preferred_term: Increased mean platelet volume
    term:
      id: HP:0011877
      label: Increased mean platelet volume
  evidence:
  - reference: PMID:19067792
    reference_title: "Proplatelet formation in heterozygous Bernard-Soulier syndrome type Bolzano."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Morphological evaluation of proplatelet formation revealed an increased size of proplatelet tips, which was consistent with the increased diameters of patients' blood platelets."
    explanation: >-
      Documents increased platelet diameter in patients and ties it to the

- name: LRRK1-dependent osteoclast RAC1/CDC42 activation
  genes:
  - preferred_term: LRRK1
    term:
      id: hgnc:18608
      label: LRRK1
  subtypes:
  - OSMD
  biological_scale: MOLECULAR
  description: >
    LRRK1 is a leucine-rich repeat kinase that phosphorylates and activates the small
    GTPases RAC1 and CDC42 in the osteoclast within minutes of RANKL stimulation. Loss of
    LRRK1 kinase function leaves RAC1/CDC42 underphosphorylated and inactive and the
    osteoclast unable to resorb, and expressing a constitutively active RAC1 partially
    restores resorption. In humans this produces osteosclerotic metaphyseal dysplasia, in
    which the sclerosis is concentrated at the metaphyses and epiphyseal margins rather
    than being generalised.

- name: Defective osteoclast vesicular transport and ruffled border formation
  genes:
  - preferred_term: SNX10
    term:
      id: hgnc:14974
      label: SNX10
  - preferred_term: PLEKHM1
    term:
      id: hgnc:29017
      label: PLEKHM1
  subtypes:
  - ARO6
  - ARO8
  biological_scale: CELLULAR
  description: >
    A third route to osteoclast-rich osteopetrosis, distinct from both the acidification
    defect and the osteoclast-poor differentiation defect. PLEKHM1 couples RAB7-positive
    late endosomal and lysosomal vesicles to the osteoclast plasma membrane, and SNX10 acts
    in the same vesicular trafficking step. When either is lost the osteoclast
    differentiates normally but fails to build a ruffled border, so the secretory machinery
    never reaches the bone-facing membrane and resorption fails despite intact
    proton-pumping capacity. This is the mechanistic route behind the relatively mild,
    intermediate course that most reported PLEKHM1 and SNX10 cases follow.
  cell_types:

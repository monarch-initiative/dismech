    explanation: >-
      Case report demonstrates that mandibular osteomyelitis also occurs in the
      recessive malignant infantile subtype.
- category: Neurological
  name: Facial palsy
  frequency: OCCASIONAL
  notes: >
    Orphanet annotates facial palsy as very frequent specifically for
    Albers-Schönberg osteopetrosis (ADO2), but the largest ADO2 clinical series
    (PMID:10617161) attributed cranial nerve involvement to ADO2 in only 16% of
    cases. Across the full osteopetrosis spectrum the pooled frequency is
    occasional, so the occasional band reflects real-world clinical-series data
    rather than the ADO2-specific Orphanet annotation cited below.
  description: >
    Facial nerve palsy results from compression in the narrowed facial canal as
    dense bone encroaches on cranial nerve VII. This complication occurs in both
    ADO2 and ARO.
  phenotype_term:
    preferred_term: Facial palsy
    term:
      id: HP:0010628
      label: Facial palsy
  evidence:
  - reference: ORPHA:53
    reference_title: "Albers-Schönberg osteopetrosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0010628 | Facial palsy | Very frequent (99-80%)"
    explanation: >-
      Orphanet lists facial palsy as a very frequent feature of Albers-Schönberg
      osteopetrosis (ADO2).
  - reference: PMID:30898950
    reference_title: "Osteomyelitis of the mandible secondary to malignant infantile osteopetrosis in an adult."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anaemia and thrombocytopaenia. Neurological manifestations can also occur due to"
    explanation: >-
      Case report of malignant infantile osteopetrosis confirms facial palsy as
      a complication of osseous foraminal narrowing across osteopetrosis subtypes.
- category: Skeletal
  name: Abnormal metaphysis morphology
  frequency: VERY_FREQUENT
  description: >
    Abnormal metaphysis morphology — including flaring (Erlenmeyer-flask
    appearance) — is a hallmark radiographic finding seen across osteopetrosis
    subtypes, reflecting accumulation of primary spongiosa in the metaphysis from
    impaired bone remodeling.
  phenotype_term:
    preferred_term: Abnormal metaphysis morphology
    term:
      id: HP:0000944
      label: Abnormal metaphysis morphology
  evidence:
  - reference: ORPHA:53
    reference_title: "Albers-Schönberg osteopetrosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000944 | Abnormal metaphysis morphology | Very frequent (99-80%)"
    explanation: >-
      Orphanet lists abnormal metaphysis morphology as a very frequent feature of
      Albers-Schönberg osteopetrosis (ADO2).
  - reference: ORPHA:667
    reference_title: "Autosomal recessive malignant osteopetrosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000944 | Abnormal metaphysis morphology | Very frequent (99-80%)"
    explanation: >-
      Orphanet also lists abnormal metaphysis morphology as a very frequent
      feature of autosomal recessive malignant osteopetrosis.
genetic:
- name: TCIRG1 mutations
  gene_term:
    preferred_term: TCIRG1
    term:
      id: hgnc:11647
      label: TCIRG1
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO
  notes: >
    Mutations in TCIRG1, encoding the a3 subunit of the vacuolar H+-ATPase,
    are the most common cause of autosomal recessive osteopetrosis. The proton pump is
    essential for acidification of the osteoclast resorption lacuna. The OMIM/MONDO
    numbered form is OPTB1 (MONDO:0009815), which is curated as its own dismech entry
    (Autosomal_Recessive_Osteopetrosis_1), so the subtype foreign key here points at the
    ARO clinical grouping rather than at a TCIRG1 child row.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that TCIRG1, encoding the osteoclast-specific 116-kD subunit of the vacuolar proton pump, is mutated in five of nine patients with a diagnosis of infantile malignant osteopetrosis. Our data indicate that mutations in TCIRG1 are a frequent cause of autosomal recessive osteopetrosis in humans."
    explanation: Landmark paper establishing TCIRG1 as the most common cause of human autosomal recessive osteopetrosis.
  - reference: PMID:16118345
    reference_title: "Clinical, genetic, and cellular analysis of 49 osteopetrotic patients: implications for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most ARO patients bore known or novel (one case) ATP6i (TCIRG1) gene mutations."
    explanation: >-
      In a 49-patient clinical and genetic series, TCIRG1 accounted for most of the
      21 recessive cases, supporting its position as the leading ARO gene.
  - reference: PMID:40875877
    reference_title: TCIRG1-Related Osteopetrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of TCIRG1-related osteopetrosis is established in a proband with characteristic clinical, laboratory, and imaging findings and biallelic pathogenic variants in TCIRG1 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states the biallelic TCIRG1 basis of the diagnosis; the same chapter
      notes that heterozygous TCIRG1 variants have been reported rarely.
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TCIRG1, CLCN7, OSTM1, SNX10 and PLEKHM1 lead to osteoclast-rich ARO (in which osteoclasts are abundant but have severely impaired resorptive function)"
    explanation: Review confirms TCIRG1 as a cause of osteoclast-rich ARO with impaired resorptive function.
- name: CLCN7 biallelic mutations
  gene_term:
    preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO4
  notes: >
    CLCN7 encodes a chloride-proton antiporter critical for osteoclast function.
    Biallelic loss-of-function variants cause the recessive numbered form OPTB4
    (MONDO:0012676), spanning severe infantile and intermediate courses. The separate
    heterozygous dominant form is recorded below rather than merged here, because the two
    are distinct diseases with different inheritance, prognosis and MONDO terms.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:11207362
    reference_title: "Loss of the ClC-7 chloride channel leads to osteopetrosis in mice and man."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice deficient for the ubiquitously expressed ClC-7 Cl(-) channel show severe osteopetrosis and retinal degeneration"
    explanation: Demonstrates that loss of ClC-7 causes osteopetrosis in mice and identifies CLCN7 mutations in a human patient.
  - reference: PMID:20301306
    reference_title: "CLCN7-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a CLCN7-related osteopetrosis is established in a proband with suggestive findings and biallelic pathogenic variants or a heterozygous pathogenic variant in CLCN7 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states that biallelic CLCN7 variants establish the diagnosis, alongside
      the separate heterozygous route.
- name: CLCN7 heterozygous mutations
  gene_term:
    preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ADO2
  notes: >
    Heterozygous CLCN7 variants cause autosomal dominant osteopetrosis type 2
    (Albers-Schoenberg disease, MONDO:0008156), the most common form of osteopetrosis,
    with incomplete penetrance and variable expressivity even within families. Recorded
    separately from the biallelic recessive record above so that the recessive and
    dominant CLCN7 diseases are not collapsed into one claim.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:19953639
    reference_title: "Molecular and clinical heterogeneity in CLCN7-dependent osteopetrosis: report of 20 novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the CLCN7 gene has drawn the attention of many researchers, as mutations within this gene are associated with very different phenotypes"
    explanation: Largest cohort study of CLCN7-dependent osteopetrosis showing genotype-phenotype correlations across ARO, intermediate, and ADO2 forms.
  - reference: PMID:16118345
    reference_title: "Clinical, genetic, and cellular analysis of 49 osteopetrotic patients: implications for diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six ADO II patients had no mutations in ClCN7, the only so far recognised gene implicated, suggesting involvement of yet unknown genes."
    explanation: >-
      Records that CLCN7 was the only recognised ADO II gene in this series and that it
      did not explain every dominant case, so the dominant form is genetically incomplete.
- name: OSTM1 mutations
  gene_term:
    preferred_term: OSTM1
    term:
      id: hgnc:21652
      label: OSTM1
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO5
  notes: >
    OSTM1 encodes a transmembrane protein that stabilizes CLCN7. Biallelic
    mutations cause a severe form of ARO with neurodegeneration, as CLCN7/OSTM1
    also functions in lysosomal homeostasis in the central nervous system. The numbered
    form is OPTB5 (MONDO:0009817).
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TCIRG1, CLCN7, OSTM1, SNX10 and PLEKHM1 lead to osteoclast-rich ARO"
    explanation: Review identifies OSTM1 as one of the genes causing osteoclast-rich ARO.
- name: TNFSF11 mutations
  gene_term:
    preferred_term: TNFSF11
    term:
      id: hgnc:11926
      label: TNFSF11
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO2
  notes: >
    TNFSF11 encodes RANKL, the key osteoclastogenic cytokine. Biallelic mutations
    cause osteoclast-poor ARO, the numbered form OPTB2 (MONDO:0009816). Because the defect
    lies in the microenvironment rather than the osteoclast precursor, HSCT does not
    correct the phenotype.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:17632511
    reference_title: "Osteoclast-poor human osteopetrosis due to mutations in the gene encoding RANKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report mutations in the gene encoding RANKL (receptor activator of nuclear factor-KB ligand) in six individuals with autosomal recessive osteopetrosis whose bone biopsy specimens lacked osteoclasts"
    explanation: First report identifying RANKL mutations as a cause of osteoclast-poor osteopetrosis.
  - reference: PMID:17632511
    reference_title: "Osteoclast-poor human osteopetrosis due to mutations in the gene encoding RANKL."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "exogenous RANKL induced formation of functional osteoclasts from their monocytes, suggesting that they could, theoretically, benefit from exogenous RANKL administration"
    explanation: Shows that the osteoclast precursors are intrinsically normal and the defect is in the microenvironment.
- name: TNFRSF11A mutations
  gene_term:
    preferred_term: TNFRSF11A
    term:
      id: hgnc:11908
      label: TNFRSF11A
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO7
  notes: >
    TNFRSF11A encodes RANK, the receptor for RANKL on osteoclast precursors.
    Biallelic mutations cause osteoclast-poor ARO, the numbered form OPTB7
    (MONDO:0012859), and can present with an osteoclast-rich pattern depending on the
    specific mutation.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TNFSF11 and TNFRSF11A lead to osteoclast-poor ARO"
    explanation: Review confirms TNFRSF11A (RANK) mutations as a cause of osteoclast-poor ARO.
  - reference: PMID:40462430
    reference_title: "[Clinical and genetic characteristics of osteopetrosis in children]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified 15 variants in 12 patients, including 8 variants in the CLCN7 gene (53%), 6 in the TCIRG1 gene (40%), and 1 in the TNFRSF11A gene (7%)."
    explanation: >-
      A 14-child cohort in which TNFRSF11A contributed one of the 15 detected variants,
      showing that it is a rare cause relative to CLCN7 and TCIRG1. The percentages are
      shares of detected variants, not of patients, so they are not recorded as
      case_fractions.
- name: SNX10 mutations
  gene_term:
    preferred_term: SNX10
    term:
      id: hgnc:14974
      label: SNX10
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO8
  notes: >
    SNX10 encodes sorting nexin 10. Biallelic mutations cause ARO, the numbered form
    OPTB8 (MONDO:0014040), typically with a milder course. The lesion is in osteoclast
    vesicular transport, so the ruffled border fails to form.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TCIRG1, CLCN7, OSTM1, SNX10 and PLEKHM1 lead to osteoclast-rich ARO"
    explanation: Review identifies SNX10 as one of the genes causing osteoclast-rich ARO.
  - reference: PMID:35981699
    reference_title: "Osteopetrosis associated with PLEKHM1 and SNX10 genes, both involved in osteoclast vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in PLEKHM1 and SNX10 can be classified among the latter as they impair vesicular transport within the osteoclast and therefore result in the absence of a ruffled border."
    explanation: >-
      Sources the vesicular-transport mechanism and the absent ruffled border for SNX10,
      which were previously asserted in this entry without a citation.
- name: PLEKHM1 biallelic mutations
  gene_term:
    preferred_term: PLEKHM1
    term:
      id: hgnc:29017
      label: PLEKHM1
  association: Causative
  relationship_type: CAUSATIVE
  subtype: ARO6
  notes: >
    PLEKHM1 couples RAB7-positive late endosomal and lysosomal vesicles to the osteoclast
    ruffled border. Biallelic loss of function causes the intermediate recessive numbered
    form OPTB6 (MONDO:0012679). The gene was already named in this entry's cited review
    snippets but was not bound to a gene term until now.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:17404618
    reference_title: "Involvement of PLEKHM1 in osteoclastic vesicular transport and osteopetrosis in incisors absent rats and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss-of-function mutations were found to underlie the osteopetrotic phenotype of the incisors absent rat as well as an intermediate type of human osteopetrosis"
    explanation: Primary report identifying biallelic PLEKHM1 loss of function in intermediate human osteopetrosis.
  - reference: PMID:17404618
    reference_title: "Involvement of PLEKHM1 in osteoclastic vesicular transport and osteopetrosis in incisors absent rats and humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "monocytes from a patient homozygous for the mutation differentiated into osteoclasts normally, but when cultured on dentine discs, the osteoclasts failed to form ruffled borders and showed little evidence of bone resorption"
    explanation: >-
      Places the PLEKHM1 defect after osteoclast differentiation, at ruffled-border
      formation, distinguishing it from the osteoclast-poor RANKL/RANK forms.
- name: PLEKHM1 heterozygous mutation
  gene_term:
    preferred_term: PLEKHM1
    term:
      id: hgnc:29017
      label: PLEKHM1
  association: Causative (single reported proband)
  relationship_type: CAUSATIVE
  subtype: ADO3
  notes: >
    A heterozygous PLEKHM1 exon-11 deletion was reported in one patient with a relatively
    malignant course and was absent from his tested relatives; this is the basis for the
    dominant numbered form OPTA3 (MONDO:0020848). Recorded separately from the biallelic
    record above, and flagged as single-proband evidence rather than an established
    dominant disease.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:27291868
    reference_title: "Characterization of a Relatively Malignant Form of Osteopetrosis Caused by a Novel Mutation in the PLEKHM1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation, a heterozygous deletion mutation in exon 11 (c.3051_3052delCA), was identified in the patient but not in his relatives."
    explanation: >-
      The single-proband heterozygous genotype behind the dominant PLEKHM1 form, and the
      limit of the evidence for it.
  - reference: PMID:27291868
    reference_title: "Characterization of a Relatively Malignant Form of Osteopetrosis Caused by a Novel Mutation in the PLEKHM1 Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "overexpression of a PLEKHM1 CA-deletion mutant resulted in a dramatic decrease in the interaction between PLEKHM1 and the small GTPase Rab7 compared to wild-type PLEKHM1"
    explanation: >-
      Functional support that the reported heterozygous variant disrupts the PLEKHM1-RAB7
      interaction required for osteoclast vesicular transport.
- name: LRRK1 mutations
  gene_term:
    preferred_term: LRRK1
    term:
      id: hgnc:18608
      label: LRRK1
  association: Causative
  relationship_type: CAUSATIVE
  subtype: OSMD
  notes: >
    LRRK1 is a leucine-rich repeat kinase that phosphorylates and activates the small
    GTPases RAC1 and CDC42 in osteoclasts. Biallelic loss of function causes
    osteosclerotic metaphyseal dysplasia (MONDO:0014080), in which the osteosclerosis is
    localised to the metaphyses and epiphyseal margins. LRRK1 does not account for all
    OSMD cases.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:27055475
    reference_title: "Identification of biallelic LRRK1 mutations in osteosclerotic metaphyseal dysplasia and evidence for locus heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole exome sequencing in a boy with OSMD, we identified a homozygous 7 bp deletion (c.5938_5944delGAGTGGT) in the LRRK1 gene."
    explanation: Primary report identifying biallelic LRRK1 loss of function in human OSMD.
  - reference: PMID:27600824
    reference_title: Leucine-rich repeat kinase-1 regulates osteoclast function by modulating RAC1/Cdc42 Small GTPase phosphorylation and activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data indicate that Lrrk1 regulates osteoclast function by directly modulating phosphorylation and activation of small GTPase RAC1/Cdc42 and that its function depends on ANK, ROC, WD40, and kinase domains."
    explanation: >-
      Establishes the molecular step at which LRRK1 acts in the osteoclast, which is the
      mechanism node this gene is wired to.
diagnosis:
- name: Clinical, Radiographic, and Molecular Diagnosis
  description: >-
    Osteopetrosis is diagnosed from generalized osteosclerosis with increased
    bone density and characteristic radiographic findings (Erlenmeyer flask
    deformity, bone-in-bone appearance), with complications of marrow
    failure, cranial nerve compression, and fractures, and is confirmed by
    molecular genetic testing; CLCN7 variants cause both autosomal recessive
    (severe) and autosomal dominant (Albers-Schonberg) forms.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301306
    reference_title: "CLCN7-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a CLCN7-related osteopetrosis is established in a proband with suggestive findings and biallelic pathogenic variants or a heterozygous pathogenic variant in CLCN7 identified by molecular genetic testing."
    explanation: >-
      GeneReviews defines the combined clinical/radiographic and CLCN7 molecular diagnostic criteria across the recessive and dominant osteopetrosis forms.
treatments:
- name: Hematopoietic stem cell transplantation
  description: >
    HSCT is the only curative treatment for osteoclast-rich forms of ARO. Donor-derived
    monocyte-macrophage precursors differentiate into functional osteoclasts that restore
    bone resorption. Best outcomes are achieved with early transplantation before
    irreversible complications develop. HSCT is not effective for osteoclast-poor
    forms (TNFSF11 mutations) or for ADO2.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:9849690
    reference_title: "Hematopoietic stem cell transplantation for infantile osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only therapy shown to be capable of providing lasting benefit is allogeneic hematopoietic stem cell transplantation (HCT). We report the outcome of 10 patients with infantile malignant osteopetrosis treated with HCT"
    explanation: Reports outcomes of HSCT for infantile osteopetrosis, with 5 of 10 patients surviving.
  - reference: PMID:9849690
    reference_title: "Hematopoietic stem cell transplantation for infantile osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend early referral for consideration of HCT with a related or unrelated donor as neurosensory manifestations of osteopetrosis are generally not reversible"
    explanation: Emphasizes the importance of early transplantation before irreversible neurological damage occurs.
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "guidelines for the indication of haematopoietic stem cell transplantation (which can provide a cure for many types of ARO), are outlined"
    explanation: Review confirms HSCT as a curative treatment for many types of ARO.
  - reference: PMID:17632511
    reference_title: "Osteoclast-poor human osteopetrosis due to mutations in the gene encoding RANKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals did not show any obvious defects in immunological parameters and could not be cured by hematopoietic stem cell transplantation"
    explanation: Confirms that RANKL-deficient osteoclast-poor osteopetrosis does not respond to HSCT because the defect is in the microenvironment.
- name: Supportive care and monitoring
  description: >
    For non-infantile forms where HSCT is not indicated, management is supportive.
    Includes monitoring for cranial nerve impingement, anemia, dental disease,
    and mineral metabolism abnormalities. Calcium and vitamin D supplementation
    may be needed for hypocalcemia.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28655174
    reference_title: "Diagnosis and Management of Osteopetrosis: Consensus Guidelines From the Osteopetrosis Working Group."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We suggest that calcitriol should not be used in high doses and instead recommend symptom-based supportive therapy for disease complications because noninfantile osteopetrosis has no effective treatment"
    explanation: Consensus guidelines recommend supportive therapy for non-infantile osteopetrosis.
  - reference: PMID:28655174
    reference_title: "Diagnosis and Management of Osteopetrosis: Consensus Guidelines From the Osteopetrosis Working Group."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend ongoing monitoring for changes in mineral metabolism and other complications, including cranial nerve impingement, anemia, leukopenia, and dental disease"
    explanation: Guidelines outline specific complications requiring ongoing monitoring.
animal_models:
- species: Mus musculus
  genotype: Tcirg1 oc/oc (osteosclerotic)
  description: >
    The oc/oc mouse carries a spontaneous loss-of-function mutation in Tcirg1 and
    recapitulates severe ARO with failure of tooth eruption, bone marrow failure,
    and early lethality. This model has been instrumental in demonstrating that
    HSCT can correct the osteoclast defect and in preclinical evaluation of gene
    therapy approaches.
  evidence:
  - reference: PMID:10888887
    reference_title: "Defects in TCIRG1 subunit of the vacuolar proton pump are responsible for a subset of human autosomal recessive osteopetrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In other mutants, it is the function of the osteoclast that seems to be affected, as they show normal or elevated numbers of non-functioning osteoclasts"
    explanation: Describes mouse osteopetrosis mutants with normal osteoclast numbers but defective function, the category to which the oc/oc (Tcirg1) mouse belongs. The oc/oc model is not named in the abstract but is the canonical Tcirg1 loss-of-function mouse.
- species: Mus musculus
  genotype: Clcn7 -/- (knockout)
  description: >
    Clcn7-deficient mice develop severe osteopetrosis with retinal degeneration
    and neurodegeneration, recapitulating the phenotype of human patients with
    OSTM1 or CLCN7 mutations who develop CNS involvement. The model established
    the dual role of CLCN7 in osteoclast function and lysosomal biology.
  evidence:
  - reference: PMID:11207362
    reference_title: "Loss of the ClC-7 chloride channel leads to osteopetrosis in mice and man."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice deficient for the ubiquitously expressed ClC-7 Cl(-) channel show severe osteopetrosis and retinal degeneration. Although osteoclasts are present in normal numbers, they fail to resorb bone because they cannot acidify the extracellular resorption lacuna."
    explanation: Demonstrates the Clcn7 knockout mouse phenotype of osteopetrosis with retinal degeneration and the mechanism of failed lacunar acidification.
  - reference: PMID:11207362
    reference_title: "Loss of the ClC-7 chloride channel leads to osteopetrosis in mice and man."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ClC-7 resides in late endosomal and lysosomal compartments. In osteoclasts, it is highly expressed in the ruffled membrane"
    explanation: Establishes the subcellular localization of ClC-7 in the ruffled membrane, explaining its role in osteoclast acidification.
notes: >
  Scope of this entry, and the MONDO descendants of MONDO:0017198 that are deliberately
  not subtypes of it. This entry is the umbrella for osteopetrosis as a failure of
  osteoclast-mediated bone resorption; its has_subtypes rows carry the clinical
  groupings and the gene-defined numbered forms that share that lesion. Four numbered
  forms have their own dismech entries and are not duplicated as child rows:
  OPTB1/TCIRG1 (Autosomal_Recessive_Osteopetrosis_1), OPTB3/CA2 with renal tubular
  acidosis (Autosomal_Recessive_Osteopetrosis_3), OPTA1/LRP5
  (Autosomal_Dominant_Osteopetrosis_Type_I) and OPTA2/CLCN7
  (Autosomal_Dominant_Osteopetrosis_Type_II); the X-linked OL-EDA-ID form is a
  has_subtypes row of IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency.

  Four further descendants were investigated and placed elsewhere. Leukocyte adhesion
  deficiency 3 (MONDO:0013016, FERMT3/kindlin-3) is defined by its integrin activation
  defect - MONDO's own definition gives severe bacterial infections and a severe bleeding
  disorder as its features, and the review at PMID:22276660 places kindlin-3 as the
  genetic basis of a beta-integrin activation defect - so it belongs with the leukocyte
  adhesion deficiency entries dismech already carries (Leukocyte_Adhesion_Deficiency_1,
  Leukocyte_Adhesion_Deficiency_Type_II, plus an open stub) rather than here. Osteopathia
  striata with cranial sclerosis (MONDO:0010310, AMER1, reported under its previous
  symbol WTX) is an X-linked dominant bone dysplasia defined by longitudinal striation of
  the long bones with cranial sclerosis (PMID:22716240); it has an open dismech stub and
  warrants its own entry. Osteopetrosis, autosomal dominant 4 (MONDO:0980938, LRP6) is
  declined on mechanistic grounds: the report that identified the gene describes the
  phenotype as LRP6 high bone mass, indistinguishable from LRP5 high bone mass, and
  contrasts it with its own separately genotyped series of autosomal dominant
  (Albers-Schoenberg) osteopetrosis patients (PMID:31085352; PMID:37065631 characterises
  a further LRP6 high-bone-mass family). The lesion is gain of osteoblastic Wnt signalling
  that increases bone
  formation, not loss of osteoclastic resorption, so an entry of its own - matching how
  dismech already handles the LRP5 counterpart - is the right home. Osteopetrosis,
  autosomal recessive 9 (MONDO:0957262, OMIM:620366) is an unlisted descendant that rests
  on a single patient with osteopetrosis and severe renal insufficiency and biallelic
  SLC4A2 variants, reported by the group that reviewed it in PMID:36343920; the MONDO
  release read on 2026-09-24 records no causal gene for the term. It is left uncurated
  pending a second independent family.

  The remaining descendants of MONDO:0017198 carry no causal-gene axiom in that release
  and are not gene-defined subtypes, so none of them is a candidate for a row here.
  Melorheostosis (MONDO:0007970) and pycnodysostosis (MONDO:0009940) already have their
  own dismech entries. Dysosteosclerosis (MONDO:0009138), osteomesopyknosis
  (MONDO:0008155), infantile osteopetrosis with neuroaxonal dysplasia (MONDO:0010866) and
  early-onset calcifying leukoencephalopathy-skeletal dysplasia (MONDO:0034143) are
  uncurated and have no stub. The CSF1R disease dismech curates as
  Brain_Abnormalities_Neurodegeneration_and_Dysosteosclerosis is a different MONDO concept
  (MONDO:0032772) that descends from neither MONDO:0009138 nor MONDO:0017198, so it does
  not cover the dysosteosclerosis term. Autosomal dominant osteopetrosis (MONDO:0020645) and
  autosomal recessive osteopetrosis (MONDO:0019026) are inheritance groupings rather than
  diseases; the recessive one is bound on the ARO row because that row is itself the
  recessive clinical grouping.

  The osteoporosis_bone_resorption module was considered as a conformance target and
  rejected: it models increased osteoclastic resorption producing low bone mass, which is
  the inverse of the lesion in this entry.

  description: >
    Severe infantile form presenting in the first months of life with bone marrow failure,
    hepatosplenomegaly from extramedullary hematopoiesis, cranial nerve compression
    (optic atrophy, deafness), and failure to thrive. Without hematopoietic stem cell
    transplantation, most patients die in early childhood. This row is the clinical
    grouping; the gene-defined OMIM/MONDO numbered forms are listed as its children.
    The TCIRG1 form (OPTB1) and the carbonic-anhydrase-II form with renal tubular
    acidosis (OPTB3) are curated as their own dismech entries
    (Autosomal_Recessive_Osteopetrosis_1, Autosomal_Recessive_Osteopetrosis_3) and so are
    not repeated as child rows here.
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TCIRG1, CLCN7, OSTM1, SNX10 and PLEKHM1 lead to osteoclast-rich ARO"
    explanation: >-
      Names five of the genes assigned to this recessive grouping and the
      osteoclast-rich functional category they share.
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TNFSF11 and TNFRSF11A lead to osteoclast-poor ARO"
    explanation: >-
      Names the two osteoclast-poor recessive genes also assigned to this grouping.
- name: ARO2
  display_name: Autosomal Recessive Osteopetrosis 2 (RANKL-deficient, osteoclast-poor)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 2
    term:
      id: MONDO:0009816
      label: autosomal recessive osteopetrosis 2
  genes:
  - preferred_term: TNFSF11
    term:
      id: hgnc:11926
      label: TNFSF11
  description: >-
    Osteoclast-poor recessive osteopetrosis caused by biallelic loss of TNFSF11
    (RANKL). Because RANKL is supplied by the bone microenvironment rather than by the
    haematopoietic osteoclast precursor, the bone biopsy lacks osteoclasts entirely and
    hematopoietic stem cell transplantation does not correct the phenotype. MONDO defines
    MONDO:0009816 as autosomal recessive malignant osteopetrosis caused by mutation in
    the TNFSF11 gene, which is the basis for binding this row to that term.
  evidence:
  - reference: PMID:17632511
    reference_title: "Osteoclast-poor human osteopetrosis due to mutations in the gene encoding RANKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report mutations in the gene encoding RANKL (receptor activator of nuclear factor-KB ligand) in six individuals with autosomal recessive osteopetrosis whose bone biopsy specimens lacked osteoclasts"
    explanation: >-
      Primary report of biallelic RANKL (TNFSF11) mutation as a cause of
      osteoclast-poor autosomal recessive osteopetrosis.
  - reference: PMID:17632511
    reference_title: "Osteoclast-poor human osteopetrosis due to mutations in the gene encoding RANKL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals did not show any obvious defects in immunological parameters and could not be cured by hematopoietic stem cell transplantation"
    explanation: >-
      Sources the statement on this row that hematopoietic stem cell transplantation does
      not correct the RANKL form.
- name: ARO4
  display_name: Autosomal Recessive Osteopetrosis 4 (CLCN7, biallelic)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 4
    term:
      id: MONDO:0012676
      label: autosomal recessive osteopetrosis 4
  genes:
  - preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  description: >-
    Recessive osteopetrosis caused by biallelic CLCN7 variants. Both biallelic and
    heterozygous CLCN7 variants establish a diagnosis, and the two are separate diseases
    with different inheritance, prognosis and MONDO terms: this recessive form and the
    dominant Albers-Schoenberg form on the ADO2 row. PLEKHM1 has the same two-disease
    shape on the ARO6 and ADO3 rows, so this is a pattern rather than a peculiarity of
    CLCN7. MONDO defines MONDO:0012676 as autosomal recessive malignant osteopetrosis
    caused by mutation in the CLCN7 gene.
  evidence:
  - reference: PMID:20301306
    reference_title: "CLCN7-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a CLCN7-related osteopetrosis is established in a proband with suggestive findings and biallelic pathogenic variants or a heterozygous pathogenic variant in CLCN7 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states that both biallelic and heterozygous CLCN7 variants establish a
      CLCN7-related osteopetrosis diagnosis, the distinction this row and the ADO2 row
      keep apart.
- name: ARO5
  display_name: Autosomal Recessive Osteopetrosis 5 (OSTM1, neurodegenerative)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 5
    term:
      id: MONDO:0009817
      label: autosomal recessive osteopetrosis 5
  genes:
  - preferred_term: OSTM1
    term:
      id: hgnc:21652
      label: OSTM1
  description: >-
    Recessive osteopetrosis caused by biallelic OSTM1 variants. Ostm1 is the beta subunit
    of the lysosomal chloride-proton antiporter ClC-7, and the pair together carry the
    ionic homeostasis of both the lysosome and the osteoclast resorption lacuna. The
    review cited here reports that loss of ClC-7 function produces a lysosomal storage
    disease and neurodegeneration as well as osteopetrosis, which is the shared basis for
    the neurodegenerative component of the OSTM1 subtype. MONDO defines
    MONDO:0009817 as autosomal recessive malignant osteopetrosis caused by mutation in the
    OSTM1 gene.
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TCIRG1, CLCN7, OSTM1, SNX10 and PLEKHM1 lead to osteoclast-rich ARO"
    explanation: >-
      Assigns OSTM1 to the osteoclast-rich recessive osteopetrosis group.
  - reference: PMID:35159175
    reference_title: The Role of the Lysosomal Cl(-)/H(+) Antiporter ClC-7 in Osteopetrosis and Neurodegeneration.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ClC-7 is a lysosomal Cl-/H+ antiporter that together with its beta subunit Ostm1 has a critical role in the ionic homeostasis of lysosomes and of the osteoclasts' resorption lacuna"
    explanation: >-
      Sources the beta-subunit relationship between Ostm1 and ClC-7 and their shared role
      in lysosomal and resorption-lacuna ion homeostasis.
  - reference: PMID:35159175
    reference_title: The Role of the Lysosomal Cl(-)/H(+) Antiporter ClC-7 in Osteopetrosis and Neurodegeneration.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in ClC-7 cause osteopetrosis, but also a form of lysosomal storage disease and neurodegeneration."
    explanation: >-
      Sources the lysosomal storage and neurodegenerative component of this subtype, which
      follows from the shared ClC-7/Ostm1 function rather than from the bone lesion.
- name: ARO6
  display_name: Autosomal Recessive Osteopetrosis 6 (PLEKHM1, intermediate)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 6
    term:
      id: MONDO:0012679
      label: autosomal recessive osteopetrosis 6
  genes:
  - preferred_term: PLEKHM1
    term:
      id: hgnc:29017
      label: PLEKHM1
  description: >-
    Intermediate recessive osteopetrosis caused by biallelic PLEKHM1 loss of function.
    Osteoclasts differentiate normally but fail to build a ruffled border, so the lesion
    is in osteoclast vesicular transport rather than in acidification or differentiation.
    MONDO defines MONDO:0012679 as autosomal recessive malignant osteopetrosis caused by
    mutation in the PLEKHM1 gene. This MONDO term is a descendant of osteopetrosis that
    the issue's gap list did not include.
  evidence:
  - reference: PMID:17404618
    reference_title: "Involvement of PLEKHM1 in osteoclastic vesicular transport and osteopetrosis in incisors absent rats and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss-of-function mutations were found to underlie the osteopetrotic phenotype of the incisors absent rat as well as an intermediate type of human osteopetrosis"
    explanation: >-
      Primary report assigning biallelic PLEKHM1 loss of function to an intermediate
      human osteopetrosis.
  - reference: PMID:17404618
    reference_title: "Involvement of PLEKHM1 in osteoclastic vesicular transport and osteopetrosis in incisors absent rats and humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "monocytes from a patient homozygous for the mutation differentiated into osteoclasts normally, but when cultured on dentine discs, the osteoclasts failed to form ruffled borders and showed little evidence of bone resorption"
    explanation: >-
      Sources the claim on this row that differentiation is normal and the failure is at
      ruffled-border formation.
- name: ARO7
  display_name: Autosomal Recessive Osteopetrosis 7 (RANK-deficient, osteoclast-poor)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 7
    term:
      id: MONDO:0012859
      label: autosomal recessive osteopetrosis 7
  genes:
  - preferred_term: TNFRSF11A
    term:
      id: hgnc:11908
      label: TNFRSF11A
  description: >-
    Osteoclast-poor recessive osteopetrosis caused by biallelic TNFRSF11A variants, the
    second of the two osteoclast-poor forms alongside the TNFSF11 form on the ARO2 row.
    HGNC carries RANK and receptor activator of nuclear factor kappa B as exact synonyms
    of TNFRSF11A, and RANKL as an exact synonym of TNFSF11, so the two osteoclast-poor
    genes are the receptor and its ligand. MONDO defines MONDO:0012859 as autosomal
    recessive malignant osteopetrosis caused by mutation in the TNFRS11A gene; that
    spelling appears to be an upstream typographical error for TNFRSF11A.
  evidence:
  - reference: PMID:23877423
    reference_title: "Osteopetrosis: genetics, treatment and new insights into osteoclast function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in TNFSF11 and TNFRSF11A lead to osteoclast-poor ARO"
    explanation: >-
      Assigns TNFRSF11A (RANK) to the osteoclast-poor recessive osteopetrosis group.
- name: ARO8
  display_name: Autosomal Recessive Osteopetrosis 8 (SNX10)
  subtype_term:
    preferred_term: autosomal recessive osteopetrosis 8
    term:
      id: MONDO:0014040
      label: autosomal recessive osteopetrosis 8
  genes:
  - preferred_term: SNX10
    term:
      id: hgnc:14974
      label: SNX10
  description: >-
    Recessive osteopetrosis caused by biallelic SNX10 variants. As with PLEKHM1, the
    lesion is in osteoclast vesicular transport and the ruffled border is absent, and most
    reported cases run a relatively mild recessive course. MONDO defines MONDO:0014040 as
    autosomal recessive malignant osteopetrosis caused by mutation in the SNX10 gene.
  evidence:
  - reference: PMID:35981699
    reference_title: "Osteopetrosis associated with PLEKHM1 and SNX10 genes, both involved in osteoclast vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in PLEKHM1 and SNX10 can be classified among the latter as they impair vesicular transport within the osteoclast and therefore result in the absence of a ruffled border."
    explanation: >-
      Assigns SNX10 to the vesicular-transport category of osteopetrosis genes and states
      the ruffled-border consequence.
  - reference: PMID:35981699
    reference_title: "Osteopetrosis associated with PLEKHM1 and SNX10 genes, both involved in osteoclast vesicular trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some of the typical radiological hallmarks of osteopetrosis can be seen, and most cases present as a relatively mild form segregating in an autosomal recessive mode of inheritance."
    explanation: Sources the relatively mild recessive course stated on this row.
- name: ADO2
  display_name: Autosomal Dominant Osteopetrosis Type 2 (Albers-Schonberg Disease)
  subtype_term:
    preferred_term: autosomal dominant osteopetrosis 2
    term:
      id: MONDO:0008156
      label: autosomal dominant osteopetrosis 2
  genes:
  - preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  description: >
    The most common form of osteopetrosis, often diagnosed incidentally. Characterized
    by generalized osteosclerosis, pathologic fractures, and cranial nerve palsies.
    Many patients are asymptomatic; others develop recurrent fractures, osteomyelitis,
    or bone pain. Caused by heterozygous CLCN7 variants with incomplete penetrance. This
    form also has its own dismech entry
    (Autosomal_Dominant_Osteopetrosis_Type_II, bound to the same MONDO term); the row is
    retained here because the dominant form is part of the spectrum this umbrella entry
    describes.
  evidence:
  - reference: PMID:19953639
    reference_title: "Molecular and clinical heterogeneity in CLCN7-dependent osteopetrosis: report of 20 novel mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the CLCN7 gene has drawn the attention of many researchers, as mutations within this gene are associated with very different phenotypes"
    explanation: >-
      Cohort study of CLCN7-dependent osteopetrosis across the recessive, intermediate
      and dominant Albers-Schoenberg presentations. It supports the phenotypic breadth of
      CLCN7 disease but says nothing about heterozygosity, which the item below covers.
  - reference: PMID:20301306
    reference_title: "CLCN7-Related Osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a CLCN7-related osteopetrosis is established in a proband with suggestive findings and biallelic pathogenic variants or a heterozygous pathogenic variant in CLCN7 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states the heterozygous route to a CLCN7-related osteopetrosis diagnosis,
      which is the claim this dominant row makes and the cohort study above does not.
- name: ADO3
  display_name: Autosomal Dominant Osteopetrosis 3 (PLEKHM1, heterozygous)
  subtype_term:
    preferred_term: osteopetrosis, autosomal dominant 3
    term:
      id: MONDO:0020848
      label: osteopetrosis, autosomal dominant 3
  genes:
  - preferred_term: PLEKHM1
    term:
      id: hgnc:29017
      label: PLEKHM1
  description: >-
    A dominant PLEKHM1 form, reported in a single patient carrying a heterozygous exon-11
    deletion that was absent from his tested relatives, with pancytopenia and
    hepatosplenomegaly over four years of follow-up. The mutant protein loses its
    interaction with the small GTPase RAB7, the same vesicular-transport step disrupted in
    the recessive PLEKHM1 form. The evidence base is one proband, so this row records the
    form MONDO and OMIM recognise rather than an established dominant disease; a second
    independent family would be needed to settle it.
  evidence:
  - reference: PMID:27291868
    reference_title: "Characterization of a Relatively Malignant Form of Osteopetrosis Caused by a Novel Mutation in the PLEKHM1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation, a heterozygous deletion mutation in exon 11 (c.3051_3052delCA), was identified in the patient but not in his relatives."
    explanation: >-
      States the heterozygous PLEKHM1 genotype and its absence in tested relatives, which
      is both the basis for a dominant form and the limit of the evidence for it.
  - reference: PMID:27291868
    reference_title: "Characterization of a Relatively Malignant Form of Osteopetrosis Caused by a Novel Mutation in the PLEKHM1 Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "overexpression of a PLEKHM1 CA-deletion mutant resulted in a dramatic decrease in the interaction between PLEKHM1 and the small GTPase Rab7 compared to wild-type PLEKHM1"
    explanation: >-
      Functional evidence that the reported heterozygous variant disrupts the
      PLEKHM1-RAB7 interaction required for osteoclast vesicular transport.
- name: OSMD
  display_name: Osteosclerotic Metaphyseal Dysplasia (LRRK1)
  subtype_term:
    preferred_term: osteosclerotic metaphyseal dysplasia
    term:
      id: MONDO:0014080
      label: osteosclerotic metaphyseal dysplasia
  genes:
  - preferred_term: LRRK1
    term:
      id: hgnc:18608
      label: LRRK1
  description: >-
    A recessive form in which the osteosclerosis is localised to the metaphyses and
    epiphyseal margins rather than generalised, caused by biallelic LRRK1 loss of
    function. It is included here as a subtype rather than declined because the report
    that identified the gene describes OSMD as a form of osteopetrosis, and the lesion is
    the same osteoclast resorption failure. The same report found no LRRK1 variant in two
    further unrelated OSMD patients, so OSMD is genetically heterogeneous and LRRK1 does
    not account for every case.
  evidence:
  - reference: PMID:27055475
    reference_title: "Identification of biallelic LRRK1 mutations in osteosclerotic metaphyseal dysplasia and evidence for locus heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Osteosclerotic metaphyseal dysplasia (OSMD) is a unique form of osteopetrosis characterised by severe osteosclerosis localised to the bone ends."
    explanation: >-
      States that OSMD is a form of osteopetrosis with a distinctive distribution of
      sclerosis, which is why it is curated as a subtype of this entry.
  - reference: PMID:27055475
    reference_title: "Identification of biallelic LRRK1 mutations in osteosclerotic metaphyseal dysplasia and evidence for locus heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of LRRK1 in two unrelated patients with OSMD suggested that OSMD is a genetically heterogeneous condition."
    explanation: >-
      Records that LRRK1 does not explain all OSMD, which is the limit of this
      gene-to-subtype assignment.
- name: IRO
  display_name: Intermediate Autosomal Recessive Osteopetrosis
  description: >
    An intermediate form with childhood onset, characterized by increased bone density,
    fractures, and mild anemia, but without the severe bone marrow failure seen in
    infantile ARO. Often caused by biallelic CLCN7 mutations. This is a severity band
    rather than a separate genetic entity, and it is deliberately left without a
    subtype_term. Two searches were run on 2026-09-24: enumerating the 25 inferred
    MONDO descendants of MONDO:0017198 (osteopetrosis) returned no class for an
    intermediate severity band, and a synonym-inclusive MONDO search for "intermediate
    osteopetrosis" returned only MONDO:0012679 (autosomal recessive osteopetrosis 6),
    the PLEKHM1 form already bound on the ARO6 row. The intermediate CLCN7 presentation
    likewise falls under MONDO:0012676, bound on the ARO4 row.
classifications:
  isds_skeletal_category:
  - classification_value: osteopetrosis_and_related
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 23 "Osteopetrosis
      and related disorders"; listed as "Osteopetrosis, severe neonatal or
      infantile forms".
pathophysiology:
- name: Defective osteoclast acidification
  genes:
  - preferred_term: TCIRG1
    term:
      id: hgnc:11647
      label: TCIRG1
  - preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  - preferred_term: OSTM1
    term:
      id: hgnc:21652
      label: OSTM1
  description: >
    The majority of osteopetrosis cases result from mutations in genes required for
    acidification of the osteoclast resorption lacuna. TCIRG1 encodes the a3 subunit
    of the vacuolar proton pump (V-ATPase), and its loss prevents acid secretion into
    the resorption lacuna. CLCN7 encodes a chloride-proton antiporter that provides
    the chloride conductance needed to maintain electroneutrality during proton pumping.
    OSTM1 stabilizes CLCN7. Without adequate acidification, hydroxyapatite dissolution
    fails and bone matrix cannot be degraded, leading to progressive accumulation of
    unresorbed primary spongiosa.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: Bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: DECREASED
  - preferred_term: Vacuolar acidification
    term:
      id: GO:0007035
      label: vacuolar acidification
    modifier: DECREASED

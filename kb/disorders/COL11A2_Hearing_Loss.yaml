  description: >
    In DFNB53, biallelic damaging COL11A2 variants impair alpha-2(XI) collagen
    function. Disruption of type XI collagen in the tectorial membrane is associated
    with profound hearing loss across all frequencies, although the exact effect of
    each reported allele on collagen abundance or assembly is not fully resolved.
  gene:
    preferred_term: COL11A2

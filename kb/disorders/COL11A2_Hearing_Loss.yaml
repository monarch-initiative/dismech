discussions:
- discussion_id: dfnb53_carrier_auditory_effects
  prompt: >-
    Do heterozygous DFNB53 variants reproducibly accelerate adult-onset
    sensorineural hearing loss, indicating semi-dominant auditory expression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal Recessive (DFNB53)
  rationale: >-
    One DFNB53 family showed progressive hearing loss in heterozygous carriers,
    but larger and longitudinal carrier cohorts are needed to distinguish a
    variant effect from ordinary age- and exposure-related hearing loss.
  evidence:
  - reference: PMID:25633957
    reference_title: "Novel mutations confirm that COL11A2 is responsible for autosomal recessive non-syndromic hearing loss DFNB53."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, in family FT3, carriers of the p.Ala37Ser mutation had apparently progressive sensorineural HL after age 30 years."
    explanation: The family provides direct evidence of later-onset hearing loss in heterozygous carriers.
notes: >-
  COL11A2-related hearing loss must be distinguished from syndromic COL11A2 disorders
  (Stickler syndrome type III, OSMED) by the absence of skeletal dysplasia,
  craniofacial anomalies, and ocular involvement. The top-level MONDO term
  MONDO:0011159 specifically grounds DFNA13, while this aggregate entry also
  includes the separately grounded DFNB53 subtype (MONDO:0012333;
  OMIM:609706).

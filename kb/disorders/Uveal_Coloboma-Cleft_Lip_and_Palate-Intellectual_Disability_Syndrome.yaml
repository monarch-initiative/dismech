genetic:
- name: YAP1
  gene_term:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  association: >-
    Heterozygous loss-of-function (nonsense and frameshift) variants in YAP1
    cause dominantly inherited optic fissure closure defects. The syndromic
    form corresponding to this entity segregates the nonsense allele c.1066G>T
    (p.Glu356*), predicted to trigger nonsense-mediated decay in transcripts
    from both the canonical and the intron-1 alternative transcription start
    site.
  notes: >-
    The causal gene IS established for this entity — MONDO:0007355 carries the
    YAP1 gene association (RO:0004003 HGNC:16262), and the defining pedigree is
    the syndromic family (family 132) of Williamson et al. 2014. No second gene
    has been implicated, and no modifier gene, founder allele, epigenetic
    signature, or recurrent rearrangement is known. Genotype-phenotype
    correlation within YAP1 remains incomplete: the isolated-coloboma family
    carried c.370C>T (p.Arg124*), and later reported alleles include a
    non-NMD frameshift (c.1160delA, p.Asn387Thrfs*16) inherited from an
    asymptomatic father and a de novo c.178dupG (p.Asp60GlyfsTer52). Missense
    alleles reported in YAP1 coloboma families should not be assumed pathogenic
    without segregation and ACMG/AMP assessment.
  evidence:
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequence analysis of affected individuals from two families with autosomal-dominant inheritance of coloboma identified two different cosegregating heterozygous nonsense mutations"
    explanation: Identifies the causal YAP1 nonsense alleles in the two coloboma pedigrees.
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypes of the affected families differed in that one included no extraocular features and the other manifested with highly variable multisystem involvement, including hearing loss, intellectual disability, hematuria, and orofacial clefting."
    explanation: >-
      Assigns the syndromic (extraocular) phenotype — the phenotype of this
      entity — to one of the two YAP1 families.
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "In addition to the eye anomalies, affected members of one family also exhibited variable extraocular features including hearing loss, intellectual disability, haematuria and orofacial clefting"
    explanation: >-
      Restates the YAP1 syndromic phenotype attribution. This sentence sits in
      Holt et al.'s introduction and carries their citations 7 and 8 — it is a
      secondary citation of Williamson et al., not an observation of their own —
      so it corroborates the attribution as received knowledge rather than
      independently, hence PARTIAL and evidence_source OTHER.
variants:
- name: "NM_001130145:c.1066G>T (p.Glu356*)"
  description: >-
    The cosegregating heterozygous nonsense allele identified in the syndromic
    family (family 132) that defines this entity. It lies downstream of both the
    canonical and the intron-1 alternative transcription start sites and is
    therefore predicted to cause nonsense-mediated decay of transcripts from
    either, producing true YAP1 haploinsufficiency.

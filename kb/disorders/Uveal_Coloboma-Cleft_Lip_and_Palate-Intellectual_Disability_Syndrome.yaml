- name: Failure of Optic Fissure Closure
  role: intermediate
  biological_scale: TISSUE
  description: >-
    The uveal coloboma of this syndrome is an optic fissure closure defect. The
    optic fissure is a transient groove in the ventral optic cup that must fuse
    between weeks 5 and 7 of human fetal life; failure of that fusion leaves a
    persistent ventral gap expressed clinically as an inferonasal iris,
    chorioretinal, and/or optic disc coloboma, and — when tissue deficiency is
    severe — as microphthalmia. Williamson et al. framed the entire YAP1
    phenotype under this heading, describing both the isolated and the syndromic
    families as optic fissure closure defects.

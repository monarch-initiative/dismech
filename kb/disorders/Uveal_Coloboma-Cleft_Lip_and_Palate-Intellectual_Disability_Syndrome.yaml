  downstream:
  - target: Uveal Coloboma and Colobomatous Microphthalmia
    description: >-
      The unclosed ventral fissure is the anatomical substrate of the clinical
      coloboma; associated tissue deficiency produces the small eye.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35318877
      reference_title: "De novo frameshift mutation in YAP1 associated with bilateral uveal coloboma and microphthalmia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Given the association with YAP1 haploinsufficiency and colobomatous microphthalmia, this novel variant provides a molecular diagnosis for the proband."
      explanation: Links the YAP1 dosage lesion to colobomatous microphthalmia.
- name: Pleiotropic YAP1 Requirement Across Eye, Ear, Palate, and Kidney Primordia
  role: intermediate
  biological_scale: TISSUE
  description: >-
    This is the node that explains why the syndrome is a syndrome, and it carries
    the shared developmental mechanism the eye and the face have in common.
    Whole-mount in situ hybridisation in mouse embryos localises Yap1 to the eye,
    brain, and the fusing facial processes; nonradioactive in situ hybridisation
    on staged human embryos localises YAP1 to the retina, the otic vesicle
    (primitive ear), the primordium of the lateral palatine process, the neural
    tube, and the renal tubules. Optic fissure closure and palatal/facial process
    fusion are both epithelial fusion events occurring in overlapping embryonic
    windows, and both depend on the same dosage-sensitive Hippo effector — so a
    single haploinsufficient allele perturbs both. The correspondence of this
    expression domain to the clinical phenotype is close to one-to-one: retina to

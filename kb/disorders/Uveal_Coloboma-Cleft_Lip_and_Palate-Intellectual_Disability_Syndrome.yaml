pathophysiology:
- name: YAP1 Haploinsufficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous nonsense variant in YAP1 (c.1066G>T, p.Glu356* in the index
    syndromic family) introduces a premature termination codon in transcripts
    from both the canonical and the intron-1 alternative transcription start
    site, so the mutant transcript is expected to be cleared by
    nonsense-mediated decay and the affected individual is left with roughly
    half the normal dose of YAP1 protein. YAP1 is not a structural protein of
    the eye or palate — it is a transcriptional co-activator — so the lesion is
    a dosage lesion in a developmental transcriptional program rather than loss
    of a tissue-specific product. The mechanism is loss of function, not gain of
    function or dominant-negative action. Note that NMD of this specific allele
    is predicted rather than measured — no patient-tissue transcript assay has
    been reported for c.1066G>T — which is why the node is PROVISIONAL rather
    than ESTABLISHED, and why the NMD-escaping YAP1 frameshift reported by Holt
    et al. is treated as a genuine complication of the model.
  gene:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant YAP1 transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  molecular_functions:
  - preferred_term: YAP1 transcriptional co-activator activity
    term:
      id: GO:0003713
      label: transcription coactivator activity
    modifier: DECREASED
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "The c. 1066G>T mutation in family 132 should result in NMD in transcripts from either TSS."
    explanation: >-
      A prediction, not a measurement — "should result in NMD" is an inference
      from premature-termination-codon position, so this supports the
      haploinsufficiency model only partially.
  - reference: PMID:35318877
    reference_title: "De novo frameshift mutation in YAP1 associated with bilateral uveal coloboma and microphthalmia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a de novo mutation in YAP1 that likely results in nonsense-mediated decay. Given the association with YAP1 haploinsufficiency and colobomatous microphthalmia, this novel variant provides a molecular diagnosis for the proband."
    explanation: >-
      An independent case argues for haploinsufficiency rather than a
      dominant-negative effect, but its own NMD claim is hedged ("likely"), so
      the support is partial.
  downstream:
  - target: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
    description: >-
      Halving the dose of the Hippo-pathway effector reduces the amount of
      nuclear YAP1 available to co-activate TEAD-dependent transcription.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24462371
      reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "YAP1 encodes an effector of the HIPPO-pathway-induced growth response"
      explanation: >-
        Places the haploinsufficient product in the Hippo signalling pathway.
        This is a background statement of gene function rather than a clinical
        result of the study, hence evidence_source OTHER — the same treatment
        given to the equivalent Holt et al. statement on the node below.
  - target: Pleiotropic YAP1 Requirement Across Eye, Ear, Palate, and Kidney Primordia
    description: >-
      The reduced co-activator dose is imposed simultaneously on every developing
      tissue that expresses YAP1, which is what converts an ocular lesion into a
      multisystem syndrome. This edge hangs off the dosage lesion itself rather
      than off the ocular YAP-TEAD node, because the multi-organ requirement is a
      property of the germline haploinsufficiency, not a consequence of reduced
      TEAD output in the eye.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28801591
      reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "YAP1 expression was observed in multiple structures at CS15"
      explanation: >-
        A static expression observation. It establishes that the affected
        tissues express YAP1 during the relevant window, but it does not itself
        demonstrate that reduced dose causes the multi-organ phenotype, hence
        PARTIAL.
  - target: Intellectual Disability
    description: >-
      Intellectual disability is part of the multisystem phenotype attributed
      to the heterozygous YAP1 loss-of-function allele, but the intervening
      neurodevelopmental mechanism is unknown. This edge therefore starts at
      the upstream dosage lesion rather than at the tissue-expression node;
      it does not assert that embryonic brain expression explains cognition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24462371
      reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "highly variable multisystem involvement, including hearing loss, intellectual disability, hematuria, and orofacial clefting"
      explanation: >-
        Names intellectual disability among the multisystem features of the
        YAP1-solved syndromic family, supporting disease-level attribution to
        the dosage lesion while leaving the causal intermediates unresolved.
    - reference: PMID:28801591
      reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "such correlations must still be approached with caution"
      explanation: >-
        A Discussion caveat rather than an experimental result. Its immediate
        clinical referent is Asperger syndrome in Holt et al.'s Case 1, set
        beside intellectual disability in other YAP1 families and embryonic
        brain expression. It does not independently support this edge; it is
        retained as a PARTIAL qualification on inferring a neurodevelopmental
        mechanism from the expression pattern.
- name: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    YAP1 is a transcriptional co-activator that, with its paralogue TAZ
    (WWTR1), acts as the major nuclear effector of the Hippo pathway by binding
    TEAD1-4 to drive transcription; Hippo activation phosphorylates YAP1 and
    exports it to the cytoplasm, extinguishing this output. Loss of one YAP1
    allele lowers the ceiling of YAP-TEAD transcriptional activity available to
    developing tissues. Zebrafish work shows this activity is not merely
    permissive but instructive for ocular fate: Yap/Taz-Tead activity is both
    necessary and sufficient for optic vesicle progenitors to adopt retinal
    pigment epithelium identity, and both nuclear localisation and Tead binding
    are required.
  gene:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  biological_processes:
  - preferred_term: hippo signaling
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: ABNORMAL
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "YAP1 is a transcriptional co-activator, and in combination with TAZ (encoded by WWTR1), is a major effector of the Hippo pathway to regulate organ size, binding TEAD1-4 to promote transcription"
    explanation: >-
      Defines the molecular activity that is reduced by haploinsufficiency. This
      is a background/review statement in the paper's introduction rather than a
      result of the study, hence evidence_source OTHER.
  - reference: PMID:26209646
    reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that Yap/Taz-Tead activity is necessary and sufficient for optic vesicle progenitors to adopt RPE identity in zebrafish."
    explanation: >-
      Establishes in vivo that YAP-TEAD output instructs the ocular cell fate

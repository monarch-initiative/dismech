diagnosis:
- name: Molecular Genetic Testing for YAP1
  description: >-
    There is no biochemical marker, imaging finding, or diagnostic criteria
    guideline specific to this entity, so diagnosis rests on recognising
    congenital uveal coloboma (particularly bilateral, and particularly with
    clefting, hearing loss, developmental impairment, or haematuria in a dominant
    pedigree) and confirming a heterozygous YAP1 loss-of-function variant by
    exome/genome sequencing or a developmental-eye-disorder panel that includes
    YAP1. Segregation analysis matters because YAP1 alleles show incomplete
    penetrance, so an unaffected parent may carry the variant.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35318877
    reference_title: "De novo frameshift mutation in YAP1 associated with bilateral uveal coloboma and microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-genome sequencing of the coding regions and intron-exon boundaries confirmed a mutation in the proband. These genetic findings were verified using the Sanger method of DNA sequencing."
    explanation: >-
      Illustrates the sequencing-based diagnostic route used to establish the
      molecular diagnosis in a YAP1 coloboma case.
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental DNA samples were sequenced for both strands of exon 7, and the variant was identified in the heterozygous state in the asymptomatic father"
    explanation: >-
      Demonstrates why parental segregation testing is required for
      interpretation: a YAP1 loss-of-function allele may be non-penetrant.
treatments:
- name: Genetic Counseling
  description: >-
    The one intervention with disease-specific content in this entity. Counseling
    must convey a 50% per-conception transmission risk for a heterozygous
    carrier, but also that neither the presence nor the severity of expression
    can be predicted from the genotype: expressivity within the single defining
    pedigree ranges from a minor ocular sign to microphthalmia with clefting,
    hearing loss and learning difficulty, and YAP1 loss-of-function alleles have
    been transmitted by clinically unaffected carriers. Cascade testing of
    at-risk relatives should therefore be paired with ophthalmic examination
    rather than relied on alone.
  therapeutic_modality: OTHER
  notes: >-
    Modality decided on the enum definition rather than on precedent.
    TherapeuticModalityEnum defines BEHAVIORAL as a "non-pharmacologic
    behavioral, physical, dietary, or lifestyle intervention"; genetic
    counseling is none of those four — it is a risk-communication and
    decision-support service — so OTHER ("modality not covered by the above
    categories") is the accurate value. The KB is genuinely split on this:
    measured across kb/disorders/ on 2026-08-11 with this entry already changed,
    578 treatments bind NCIT:C15240 — 57 tagged BEHAVIORAL, 38 OTHER, and 483
    carrying no modality at all. (An earlier draft of this note recorded 58/37,
    which was the split BEFORE this entry was retagged: the note described the
    KB as it was before its own edit. Corrected, and date-stamped, because these
    counts drift with every entry that touches this term.) There is therefore no
    settled convention to defer to, and
    CLAUDE.md lists NCIT:C15240 among the generic action terms that need a
    per-entry look rather than an ID-based rule. Flagged here because a
    KB-wide reconciliation of this term is worth doing on its own.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:7154042
    reference_title: "An autosomal dominant syndrome of uveal colobomata, cleft lip and palate, and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considerable variability in expression of the gene is apparent"
    explanation: >-
      Establishes the variable expressivity that counseling must convey; it is
      why a genotype-based severity prediction cannot be offered.
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variant was identified in the heterozygous state in the asymptomatic father"
    explanation: >-
      Documents transmission of a YAP1 loss-of-function allele by a clinically
      unaffected carrier, the incomplete-penetrance point that counseling and
      cascade testing must account for.
discussions:
- discussion_id: yap1_haematuria_renal_basis_unknown
  prompt: >-
    What renal lesion produces the haematuria in YAP1-related syndromic
    coloboma, and does it carry a risk of progressive kidney disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pleiotropic YAP1 Requirement Across Eye, Ear, Palate, and Kidney Primordia
  rationale: >-
    Haematuria is a recurrent feature of YAP1 loss-of-function families and
    prompted Holt et al. to look specifically for YAP1 expression in the
    developing kidney, which they found in renal tubules at CS22. But no renal
    biopsy, imaging, or longitudinal renal-function data have been published for
    any affected individual, so it is unknown whether the haematuria reflects a
    glomerular basement membrane defect, a tubular lesion, a structural
    malformation, or something benign. This matters clinically because it
    determines whether carriers need renal surveillance, and mechanistically
    because a glomerular versus tubular origin would point at different YAP1
    dependencies.
  proposed_experiments:
  - experiment_id: exp_yap1_renal_phenotyping
    name: Structured renal phenotyping of genotyped YAP1 carriers
    description: >-
      Perform urinalysis with phase-contrast microscopy for dysmorphic red
      cells, albumin:creatinine ratio, renal ultrasound, and eGFR in all
      molecularly confirmed carriers from reported YAP1 families, with
      longitudinal follow-up in adults. Dysmorphic erythrocytes and albuminuria
      would indicate a glomerular origin; isolated isomorphic haematuria with
      normal albumin would favour a tubular or structural cause.
    decision_criterion: >-
      Presence of dysmorphic erythrocytes and/or albuminuria in a majority of
      carriers distinguishes a glomerular from a tubular or structural origin.
  - experiment_id: exp_yap1_conditional_kidney_deletion
    name: Compartment-specific conditional Yap1 deletion in mouse kidney
    description: >-
      Delete Yap1 conditionally in nephron progenitors versus differentiated
      tubular epithelium in mouse and assay for haematuria, glomerular
      basement-membrane ultrastructure, and tubular integrity, to localise the
      developmental compartment in which reduced YAP1 dose produces the renal
      phenotype.
    decision_criterion: >-
      Haematuria arising only in one compartment-specific deletion localises the
      YAP1 requirement to that compartment.
  evidence:
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we also examined expression in the human embryonic kidney"
    explanation: >-
      The investigators examined kidney expression precisely because the renal
      phenotype was unexplained, evidencing the gap.
- discussion_id: yap1_single_family_entity_boundary
  prompt: >-
    Is uveal coloboma-cleft lip and palate-intellectual disability a distinct
    nosological entity, or the syndromic tail of a single YAP1-related
    developmental eye disorder spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Alternative Transcription Start Site Modulation of Phenotype Severity
  rationale: >-
    MONDO:0007355 / OMIM:120433 / ORPHA:1473 describe an entity resting on a
    single pedigree. The same gene, with the same class of lesion, produces
    isolated non-syndromic coloboma in a second family and in singleton cases.
    Whether the syndromic label names a real biological subdivision (as the
    alternative-TSS model would predict) or simply the most severely expressed
    end of one allelic spectrum cannot be settled without further syndromic
    families. Until then, curators should be careful not to import generic
    coloboma or generic clefting literature into this entry, and should not treat
    the syndrome boundary as mechanistically validated.
  proposed_experiments:
  - experiment_id: exp_yap1_allele_position_genotype_phenotype
    name: Allele-position versus extraocular-phenotype audit across YAP1 carriers
    description: >-
      Assemble every published and diagnostic-laboratory YAP1 loss-of-function
      carrier, annotate each allele by position relative to the intron-1
      alternative transcription start site, and test whether downstream
      alleles (those predicted to trigger NMD in both transcript classes) are
      enriched for extraocular features relative to upstream alleles. Pair this
      with quantitative allele-specific expression of canonical and alternative
      YAP1 transcripts in accessible patient tissue.
    decision_criterion: >-
      Enrichment of extraocular features among alleles downstream of the
      alternative TSS would support a real syndromic/isolated subdivision;
      absence of enrichment would favour a single spectrum with stochastic
      expressivity.
  evidence:
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypes of the affected families differed in that one included no extraocular features and the other manifested with highly variable multisystem involvement"
    explanation: >-
      The same gene and lesion class yield isolated and syndromic phenotypes,
      which is exactly the boundary problem.
differential_diagnoses:
- name: CHARGE Syndrome
  description: >-
    CHARGE syndrome (CHD7) is the principal differential because it also pairs
    coloboma with orofacial clefting, hearing loss, and developmental delay.
    Features favouring CHARGE are choanal atresia, characteristic external and
    inner ear anomalies with semicircular canal hypoplasia, cranial nerve
    dysfunction, and cardiac defects, none of which characterise the YAP1 entity;
    molecular testing (CHD7 versus YAP1) is definitive. Deliberate note for
    curators and deep-research tools: coloboma-plus-clefting reports very often
    concern CHARGE, and CHARGE literature must not be imported into this entry.
- name: Isolated Uveal Coloboma and the Microphthalmia-Anophthalmia-Coloboma Spectrum
  description: >-
    Non-syndromic coloboma — including the isolated YAP1-related coloboma family
    of Williamson et al. — shares the ocular phenotype but lacks the clefting,
    hearing loss, intellectual disability, and haematuria. The MAC spectrum is
    genetically heterogeneous (SOX2, OTX2, BMP4, BMP7, STRA6 among others), and
    YAP1 accounts for only a small share of it.
- name: Branchio-Oculo-Facial Syndrome
  description: >-
    TFAP2A-related branchio-oculo-facial syndrome also combines ocular anomalies
    (including coloboma and microphthalmia) with orofacial clefting, but is
    distinguished by cervical/infra-auricular branchial skin defects, a
    characteristic facies with a broad nasal bridge, ectopic thymus, and
    premature greying.
- name: Cat-Eye Syndrome
  description: >-
    Cat-eye syndrome (chromosome 22q11 tetrasomy from a supernumerary
    bisatellited marker chromosome) presents with iris coloboma, anal atresia,
    preauricular pits and tags, and cardiac and renal anomalies. It is excluded
    by karyotype or chromosomal microarray rather than by phenotype alone.
- name: Renal Coloboma (Papillorenal) Syndrome
  description: >-
    PAX2-related renal coloboma syndrome is the highest-yield differential for
    the specific combination of coloboma with urinary-tract findings, which is
    exactly the combination this entry curates (coloboma plus haematuria).
    Distinguishing features are the characteristic optic nerve dysplasia
    (morning-glory-like disc, excavated with anomalous vessels) rather than a
    simple inferonasal uveal coloboma, and structural renal hypodysplasia with
    vesicoureteral reflux and progressive renal insufficiency — as opposed to
    the isolated, uncharacterised haematuria of the YAP1 entity. Orofacial
    clefting is not a feature of PAX2 disease. Molecular testing separates them.
- name: Kabuki Syndrome
  description: >-
    KMT2D/KDM6A-related Kabuki syndrome pairs coloboma with intellectual
    disability, cleft lip/palate, hearing loss, and renal anomalies, so it
    overlaps this entity on every named element. It is distinguished by the
    characteristic facies (long palpebral fissures with eversion of the lateral
    lower lid, arched sparse eyebrows, large prominent ears), persistent fetal
    fingertip pads, postnatal growth deficiency, hypotonia, and recurrent otitis
    media, none of which characterise the YAP1 entity.
- name: Baraitser-Winter Cerebrofrontofacial Syndrome
  description: >-
    ACTB/ACTG1-related Baraitser-Winter syndrome also features coloboma with
    intellectual disability, but is distinguished by ptosis, hypertelorism, a
    characteristic broad facies, and — critically — cortical malformations such
    as pachygyria or lissencephaly on brain imaging, which are not a feature of
    the YAP1 entity.
animal_models:
- name: Zebrafish yap1 mutant, alone and with wwtr1 (taz)
  species: Danio rerio
  genotype: yap1 (yap) loss-of-function mutant, alone and combined with wwtr1 (taz)
  publication: PMID:26209646
  description: >-
    Zebrafish yap1 mutants lack a subset of retinal pigment epithelium and/or
    develop coloboma, and combined loss of yap and taz abolishes the ability of
    optic vesicle progenitors to form RPE at all. This is the closest available
    model of the ocular arm of the syndrome and the source of the instructive
    (not merely permissive) role of Yap/Taz-Tead in RPE fate. It does not model
    the clefting, hearing loss, or intellectual disability arms.
  associated_phenotypes:
  - Coloboma
  - Loss of retinal pigment epithelium
  modeled_mechanisms:
  - target: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Genetic removal of yap1, and of yap1 together with wwtr1, lowers Yap/Taz-Tead
      output in optic vesicle progenitors — the animal counterpart of the reduced
      co-activator dose imposed by human YAP1 haploinsufficiency.
    limitations: >-
      Homozygous null and double-mutant genotypes model a far deeper loss of
      output than a human heterozygous nonsense allele, so the model addresses
      the direction of the lesion rather than its dose.
    readouts:
    - name: Ability of optic vesicle progenitors to form RPE
      target: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
      direction: ABOLISHED
      interpretation: >-
        The functional consequence of removing that output: complete loss of
        RPE-forming capacity when both Yap and Taz are absent establishes the
        requirement as instructive, not merely permissive. Note this measures
        the capacity the node's output confers, not a direct measurement of
        transcriptional output in the mutant.
      evidence:
      - reference: PMID:26209646
        reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "when Yap and Taz are both absent, optic vesicle progenitor cells completely lose their ability to form RPE"
        explanation: Reports the measured loss of RPE-forming capacity behind this readout.
    evidence:
    - reference: PMID:26209646
      reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mechanism of Yap-dependent RPE cell type determination is reliant on both nuclear localization of Yap and interaction with a Tead co-factor."
      explanation: >-
        Confirms the model reports specifically on YAP-TEAD co-activation, the
        activity this node describes.
  - target: Failure of Optic Fissure Closure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      yap1 mutants develop coloboma — the optic fissure closure defect itself —
      alongside the RPE deficiency proposed to underlie it.
    limitations: >-
      The zygosity mismatch bites hardest here, on the stronger claim: the
      coloboma is scored in homozygous yap1 nulls, whereas the human disorder is
      caused by a heterozygous nonsense allele, so the model recapitulates the
      lesion's direction and not its dose. Zebrafish ocular morphogenesis is
      also not identical to the human weeks-5-to-7 fissure closure window, and
      the model does not reproduce the clefting, hearing loss, haematuria, or
      intellectual disability arms of the syndrome.
    readouts:
    - name: Coloboma incidence in yap1 mutants
      target: Failure of Optic Fissure Closure
      direction: INCREASED
      interpretation: >-
        Coloboma arising on loss of yap1 is the model's direct correlate of the
        human optic fissure closure defect.
      evidence:
      - reference: PMID:26209646
        reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "yap (yap1) mutants lack a subset of RPE cells and/or exhibit coloboma."
        explanation: Reports the coloboma scored in the mutants.
    - name: Retinal pigment epithelium cell number in yap1 mutants
      target: Failure of Optic Fissure Closure
      direction: DECREASED
      interpretation: >-
        The RPE deficiency that accompanies the coloboma, recorded separately
        because it moves in the opposite direction from coloboma incidence and
        cannot share a single direction value with it.
      evidence:
      - reference: PMID:26209646
        reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "yap (yap1) mutants lack a subset of RPE cells and/or exhibit coloboma."
        explanation: Reports the RPE cell deficiency scored in the mutants.
    evidence:
    - reference: PMID:26209646
      reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "provides a mechanistic framework for understanding the congenital ocular defects of Sveinsson's chorioretinal atrophy and congenital retinal coloboma"
      explanation: >-
        The authors position the model as a mechanistic framework for congenital
        retinal coloboma, which is what this node curates.
  evidence:
  - reference: PMID:26209646
    reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "yap (yap1) mutants lack a subset of RPE cells and/or exhibit coloboma."
    explanation: >-
      Establishes the zebrafish yap1 mutant as a model of the coloboma arm of
      the human phenotype.
  - reference: PMID:26209646
    reference_title: "Yap and Taz regulate retinal pigment epithelial cell fate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of RPE in yap mutants is exacerbated in combination with taz (wwtr1) mutant alleles such that, when Yap and Taz are both absent, optic vesicle progenitor cells completely lose their ability to form RPE."
    explanation: Demonstrates the dosage-dependent Yap/Taz requirement in ocular development.
notes: >-
  Scope and evidence discipline. This entry is deliberately small. The entity is
  defined by one pedigree — twelve affected subjects over three generations in
  Kingston et al. 1982, re-evaluated as a four-generation family by Ravine et al.
  1997 — so there is no cohort, no natural-history study, no treatment literature,
  and no biomarker specific to it. Rather than pad the entry with generic coloboma
  or generic orofacial-clefting biology, the pathophysiology is restricted to what
  can be evidenced for YAP1 specifically: the haploinsufficiency lesion, its
  effect on YAP-TEAD output in the Hippo pathway, the optic fissure closure
  defect, the pleiotropic embryonic expression domain that ties the eye, ear,
  palate, neural tube, and kidney features together, and the proposed
  alternative-TSS severity modifier.

  Causal gene status. Contrary to what the sparse clinical literature might
  suggest, the causal gene IS established: YAP1. MONDO:0007355 carries the gene
  association (RO:0004003 HGNC:16262), and Williamson et al. 2014 solved the
  defining pedigree with the cosegregating nonsense allele c.1066G>T (p.Glu356*).
  Family identity across the three reports is inferred, not stated in any
  abstract, and the inference should be treated as strong-but-not-proven. The
  supporting threads are: A.O.M. Wilkie is an author on both Ravine et al. 1997
  and Williamson et al. 2014; A. Clarke of the Institute of Medical Genetics,
  University Hospital of Wales, Cardiff — the institution from which both
  Kingston et al. and Ravine et al. published — is an author on Williamson et al.;
  and Holt et al. 2017 cite Williamson together with a second report for the
  extraocular features of that family. Ravine et al. describe their pedigree as
  "re-evaluated", consistent with the earlier Kingston description. No abstract
  asserts the identity outright, so a curator revisiting this entry should not
  treat the three-report chain as independently confirmed.

  Deliberately omitted, with reasons. (1) Treatments — only genetic counselling
  is curated. No disease-modifying therapy exists, and the rest of management
  (low-vision services, cleft-team care, audiology, developmental support) is
  generic multidisciplinary supportive care for which none of the cached
  references carries a quotable, YAP1-specific statement; adding those entries
  would mean asserting standard-of-care from no source. Genetic counselling is
  the exception because the entry's own inheritance and penetrance evidence
  directly supports what has to be counselled. (1a) Glaucoma (HP:0000501) and
  ptosis (HP:0000508) are named in the fuller ORDO/MONDO definition of this
  entity but appear in neither the current Orphadata cache body for ORPHA:1473
  nor any of the cited abstracts, so there is no quotable snippet for them; they
  are flagged here as the first candidates to add if a citable source is found,
  rather than curated on an uncitable basis. (2) Prevalence rates, incidence, sex ratio, penetrance
  percentages, survival, and phenotype percentages — the deep-research report
  explicitly cautions that these cannot be calculated from single families, and
  coloboma/MAC-spectrum figures must not be substituted. (3) Biochemical markers,
  histopathology, imaging findings, clinical trials, progression and staging —
  none are documented for this entity. (4) Module conformance — no existing
  dismech module covers optic fissure closure failure; the
  pharyngeal_arch_patterning_serial_homology module was considered and rejected
  because YAP1 clefting is not a cranial-neural-crest arch-patterning defect.
  (5) A GeneReviews chapter does not exist for YAP1 or for this syndrome (PubMed
  searches for YAP1 plus GeneReviews and title-level searches returned nothing
  relevant), so the mandatory GeneReviews phenotype baseline is inapplicable.
  (6) Provisional single-case findings from later YAP1 reports (hemifacial
  microsomia, tubular nose, spina bifida occulta, nystagmus, microcornea) are not
  curated as phenotypes of this entity; they belong to individual YAP1 probands
  and the deep-research report itself flags them as provisional extensions.
  (7) Four phenotypes are deliberately left unwired to the pathograph, giving a
  causal-inlink connectivity of 10 of 14 rather than a fuller-looking number
  bought with unsupported edges. The wiring rule applied is a single one: a
  phenotype is wired when a source states it is a feature of the disease caused
  by the YAP1 allele, and not wired when no source does. Cataract and impaired
  extraocular movement are recorded in the ocular spectrum of the entity, but
  neither is an optic fissure closure defect and no source explains either from
  reduced YAP1 dose. Specific learning disability is unwired because it rests on
  Ravine et al.'s "one third of those affected" observation, which this entry
  deliberately keeps separate from the intellectual-disability claim; treating
  the two as one claim is precisely the conflation the phenotype split exists to
  avoid. Neural tube defect is unwired because the sources do not establish the
  claim: Kingston et al. write only that "the possibility of association
  with neural tube defect is discussed", and Ravine et al. that it "has occurred
  in one presumed affected member" — a single event in a relative who was never
  molecularly confirmed. An earlier draft did wire it on YAP1 neural-tube
  expression alone; that edge was removed on audit, because an expression
  correlate is not evidence of causation. (The reasoning given at the time — that
  CausalLinkTypeEnum UNKNOWN, meaning "directness has not yet been determined",
  cannot carry a doubt about whether an edge exists — was itself too strong: the
  alternative-TSS edge in this very entry carries exactly that kind of doubt by
  pairing UNKNOWN with a hypothesis_groups reference to an EMERGING
  mechanistic_hypotheses entry. Deletion was a choice, not the only option; it
  remains the right one here because the sources do not establish the
  association, not merely its directness.)
  (7a) Intellectual disability IS wired, and the earlier draft that excluded it
  was inconsistent. Williamson et al. name hearing loss, intellectual disability,
  haematuria and orofacial clefting in one sentence as the multisystem features
  of the YAP1-solved family; three of those four were wired on that sentence
  while the fourth was excluded on a rationale — Holt et al.'s caution — that
  addresses only the brain-expression route to a mechanism, not the disease-level
  attribution the other three edges rest on. The edge is therefore now curated on
  the same evidential footing as its siblings. The edge is wired directly from
  YAP1 Haploinsufficiency, not from the pleiotropic tissue-expression node, so
  it retains the disease-level attribution while leaving the intervening
  neurodevelopmental mechanism unknown. Holt's "such correlations must still be
  approached with caution" is carried on the edge as a PARTIAL qualifying item
  and no route through brain expression is asserted.
  (8) The seven differential_diagnoses blocks carry no evidence items, and this
  is a recorded gap rather than a completeness claim. Their distinguishing
  features — choanal atresia and semicircular canal hypoplasia in CHARGE, the
  branchial skin defects of branchio-oculo-facial syndrome, the supernumerary
  marker chromosome of cat-eye syndrome, PAX2 renal hypodysplasia with
  vesicoureteral reflux, the Kabuki facies and fetal fingertip pads, the
  Baraitser-Winter cortical malformations, and the genetic heterogeneity of the
  MAC spectrum — are standard clinical knowledge, but none of the seven cached
  references for this entry states any of them, so there is no quotable snippet
  for any of them here. Citing them would mean adding seven new references whose
  only role is to support boundary prose, which is a larger and separately
  reviewable piece of work. Until that is done, no claim is made that the
  differential blocks are evidence-backed.

  Named-entity-confusion preflight. MONDO:0007355 was verified with OAK before any
  content was written: label uveal coloboma-cleft lip and palate-intellectual
  disability, OMIM:120433, Orphanet:1473, gene association HGNC:16262 (YAP1),
  Orphanet definition citing 12 cases from three generations of a single family
  and autosomal dominant transmission. Auditor's note: that case-count sentence
  lives in the MONDO:0007355 definition text (attributed to Orphanet:1473) and is
  NOT present in the Orphadata bulk-snapshot body cached as ORPHA_1473.md. The
  two are different definition texts of different vintages, not a full text and a
  truncation of it — MONDO's runs "is characterized by coloboma of the iris,
  bilateral cleft lip and palate", the cache's "A rare, genetic, multiple
  congenital anomalies/dysmorphic syndrome characterized by uveal coloboma
  (typically bilateral)" — so the case count is not recoverable by quoting more
  of the cached record. It is
  therefore not quotable as an ORPHA:1473 snippet, which is why the prevalence
  record cites PMID:7154042 for the count instead. ORPHA:1473 independently lists OMIM:120433
  and MONDO:0007355 as exact matches, and the Kingston 1982 abstract independently
  confirms the twelve-subjects/three-generations count. This is a high-NEC-risk
  entity because coloboma appears in many named syndromes; CHARGE (CHD7), cat-eye
  syndrome, branchio-oculo-facial syndrome (TFAP2A), COACH/Joubert, and
  Baraitser-Winter were all explicitly excluded, and all but COACH/Joubert are
  recorded under differential_diagnoses so the boundary is auditable. The Edison
  (falcon) deep-research report was read in full and showed no drift onto CHARGE
  or generic coloboma; its own conclusions (YAP1, OMIM 120433, haploinsufficiency,
  single-family basis) match the independently verified identity. The report's
  claim that no MONDO or Orphanet identifier could be verified is a limitation of
  its retrieval, not a contradiction — both were verified here directly against
  OAK and Orphadata.

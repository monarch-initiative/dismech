inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  penetrance: INCOMPLETE
  description: >-
    Autosomal dominant transmission through the index family, documented over
    three generations in the 1982 report and across four generations on
    re-evaluation. Expressivity is strikingly variable within that single
    pedigree, ranging from a minor ocular sign to microphthalmia with clefting,
    hearing loss and intellectual disability. The causal YAP1 nonsense allele
    cosegregated with the phenotype (combined LOD 4.2 across the two YAP1
    coloboma families reported by Williamson et al.). Incomplete penetrance has
    been documented for other YAP1 loss-of-function alleles in coloboma families
    — a later frameshift allele was inherited from an asymptomatic father — so
    unaffected carriers should be expected.

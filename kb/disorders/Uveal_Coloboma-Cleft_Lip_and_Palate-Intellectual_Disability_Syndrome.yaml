prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate exists and none should be inferred. The
    entity is defined by a single multigenerational pedigree — twelve affected
    subjects over three generations in the original report, which is also the
    basis for Orphanet's case count. The broader YAP1 developmental-eye-disorder
    spectrum is likewise reported only as individual families and singleton
    cases: YAP1 screening of 258 undiagnosed UK developmental-eye-disorder
    patients yielded a single novel candidate variant. Prevalence figures for
    coloboma or the microphthalmia-anophthalmia-coloboma spectrum as a whole must
    NOT be substituted for this entity.

- name: Alternative Transcription Start Site Modulation of Phenotype Severity
  role: modifier
  biological_scale: MOLECULAR
  description: >-
    A candidate explanation for why one YAP1 nonsense family is syndromic and
    the other is eye-only. YAP1 has an alternative transcription start site in
    intron 1, widely used in human and mouse development, whose transcripts
    initiate at codon Met179. The isolated-coloboma allele c.370C>T (p.Arg124*)
    falls in the 5' UTR of those alternative transcripts and so cannot trigger
    nonsense-mediated decay in them, leaving a partially rescuing pool of
    protein; the syndromic allele c.1066G>T (p.Glu356*) lies downstream of both
    start sites and is predicted to cause NMD of transcripts from either. On
    this model the syndromic multisystem phenotype of this entity reflects the
    absence of that alternative-transcript rescue. The model is proposed rather
    than experimentally demonstrated in patient tissue, and other alleles
    complicate it — the c.1160delA frameshift escapes NMD altogether yet was
    inherited from an asymptomatic father.
  gene:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the c.370C>T mutation in family 1305 is within the 5' UTR and cannot result in nonsense-mediated decay"
    explanation: >-
      States that the non-syndromic family's allele lies in the 5' UTR of the
      alternative transcripts and therefore escapes NMD in them — the positional
      basis of the proposed rescue. This is a positional inference rather than a
      transcript measurement, hence COMPUTATIONAL.
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Amelioration of the phenotype by the alternative transcripts provides a plausible explanation for the phenotypic differences between the families."
    explanation: >-
      The authors present this explicitly as a plausible explanation, i.e. a
      hypothesis rather than a demonstrated mechanism. PARTIAL for the same
      reason this entry marks "should result in NMD" and "likely results in
      NMD" PARTIAL — the source hedges — and OTHER because the sentence is
      interpretive discussion rather than a clinical result.
  - reference: PMID:28801591
    reference_title: "New variant and expression studies provide further insight into the genotype-phenotype correlation in YAP1-related developmental eye disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the mutation does not lead to either alternate splicing or nonsense mediated decay."
    explanation: >-
      An NMD-escaping YAP1 frameshift inherited from an asymptomatic father
      shows that NMD status alone does not determine expressivity, so the
      alternative-TSS model is incomplete.
  downstream:
  - target: YAP1 Haploinsufficiency
    description: >-
      Whether a given nonsense allele produces true haploinsufficiency, and
      hence whether the phenotype is eye-only or syndromic, is proposed to
      depend on its position relative to the alternative start site.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - alternative_tss_severity_modulation
    evidence:
    - reference: PMID:24462371
      reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Transcripts from the alternative TSS are predicted to initiate at codon Met179 relative to the canonical transcript"
      explanation: >-
        Defines the alternative transcript that would determine allele
        consequence. The initiation codon is predicted, not experimentally
        mapped, hence COMPUTATIONAL.
mechanistic_hypotheses:
- hypothesis_group_id: alternative_tss_severity_modulation
  hypothesis_label: >-
    Position of the YAP1 nonsense allele relative to the intron-1 alternative
    transcription start site determines whether the phenotype is isolated
    coloboma or the full multisystem syndrome
  status: EMERGING
  description: >-
    Williamson et al. propose that the intron-1 alternative transcription start
    site of YAP1 (initiating at Met179) supplies a partially functional protein
    pool when a nonsense allele falls upstream of it, ameliorating the phenotype
    to eye-only disease; alleles downstream of both start sites cause NMD of all
    transcripts and produce the syndromic phenotype of this entity. The
    hypothesis is attractive because it would explain, from allele position
    alone, why two families with the same class of YAP1 lesion differ so
    sharply. It is not established: it rests on predicted rather than measured
    NMD in the relevant tissues, and a later NMD-escaping frameshift allele was
    carried by an asymptomatic father, which the model does not readily
    accommodate. Causal edges belonging to this model opt in via the
    alternative_tss_severity_modulation hypothesis group.
  evidence:
  - reference: PMID:24462371
    reference_title: "Heterozygous loss-of-function mutations in YAP1 cause both isolated and syndromic optic fissure closure defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-PCR showed that an alternative transcription start site (TSS) in intron 1 of YAP1 and Yap1 is widely used in human and mouse development, respectively."
    explanation: >-
      Establishes by RT-PCR that the alternative transcript is genuinely used in
      development. The assay is performed on human and mouse developmental
      material rather than in living subjects, hence IN_VITRO; the mouse arm is
      model-organism data reported in the same sentence.

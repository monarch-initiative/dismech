    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Uveal colobomata are eye defects that result from failure of the optic fissure of the neuroectoderm-derived optic cup to close between weeks 5-7 of fetal life."
    explanation: >-
      States the developmental mechanism and the developmental window for the
      cardinal ocular feature. This sentence sits under the literal BACKGROUND

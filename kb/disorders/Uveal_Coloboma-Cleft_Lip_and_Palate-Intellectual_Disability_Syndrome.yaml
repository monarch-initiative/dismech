name: Uveal Coloboma-Cleft Lip and Palate-Intellectual Disability Syndrome
creation_date: "2026-08-01T00:00:00Z"
description: >-
  An ultra-rare autosomal dominant multiple congenital anomaly syndrome (COB1;
  MONDO:0007355, OMIM:120433, ORPHA:1473) combining uveal (iris/chorioretinal)
  coloboma with orofacial clefting and variable intellectual disability. The
  entity rests on a single large British pedigree: Kingston, Harper and Jones
  described twelve affected subjects over three generations in 1982, and Ravine
  and colleagues re-evaluated a four-generation Cardiff family in 1997 as a
  dominant coloboma-microphthalmos syndrome that also featured mid-frequency
  sensorineural hearing loss and haematuria. Williamson et al. subsequently
  identified a cosegregating heterozygous nonsense variant in YAP1 (c.1066G>T,
  p.Glu356*) in their syndromic pedigree (family 132), establishing YAP1
  haploinsufficiency as the molecular cause of that phenotype. That this is the
  same pedigree as the 1982 and 1997 reports is inferred from author and
  institutional overlap and is not asserted in any abstract — see the notes
  block. YAP1 encodes the Hippo-pathway transcriptional co-activator
  Yes-associated protein 1, which is expressed in the developing human retina,
  otic vesicle, palatine process primordium, neural tube, and renal tubules — a
  pleiotropic expression domain that maps closely onto the eye, ear, palate,
  neural tube, and kidney features of the syndrome, and that supplies the shared
  developmental logic linking failed optic fissure closure to failed facial
  process fusion. Deliberately scoped: this entry models the YAP1-attributable
  syndromic arm and does NOT reproduce generic coloboma or generic orofacial
  clefting biology.
category: Mendelian

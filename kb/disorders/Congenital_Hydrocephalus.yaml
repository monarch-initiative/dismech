has_subtypes:
- name: HSAS
  display_name: X-linked hydrocephalus with stenosis of the aqueduct of Sylvius (L1CAM / L1 syndrome)
  subtype_term:
    preferred_term: X-linked hydrocephalus with stenosis of the aqueduct of Sylvius
    term:
      id: MONDO:0010611
      label: X-linked hydrocephalus with stenosis of the aqueduct of Sylvius
  description: >-
    The severe end of the L1CAM-related L1 syndrome spectrum (which also includes
    MASA syndrome / X-linked complicated spastic paraplegia type 1 and X-linked
    complicated corpus callosum agenesis). Affected males are born with severe
    hydrocephalus, adducted thumbs and spasticity, and hypoplasia or aplasia of
    the corticospinal tracts is near-constant at autopsy. It is the single most
    frequently identified monogenic cause of otherwise isolated congenital
    hydrocephalus. Note the phenotypic overlap trap: callosal abnormality,
    aqueductal stenosis and adducted thumbs are all seen in L1CAM-negative
    hydrocephalus too, so none of them confirms or excludes the diagnosis.
  genes:
  - preferred_term: L1CAM
    term:
      id: hgnc:6470
      label: L1CAM
  inheritance:
  - name: X-linked
  evidence:
  - reference: PMID:20301657
    reference_title: "L1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Males with HSAS are born with severe hydrocephalus, adducted thumbs, and
      spasticity; intellectual disability is severe.
    explanation: >-
      GeneReviews statement of the defining HSAS clinical triad and its severity.
  - reference: PMID:34092257
    reference_title: "Neuropathological hallmarks of fetal hydrocephalus linked to CCDC88C pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic L1CAM variants are responsible for a wide phenotypic spectrum,
      X-linked hydrocephalus with stenosis of the aqueduct of Sylvius (AS) being
      the most common genetic form, with a prevalence of 1:30,000 and accounting
      for approximately 5–10% of males with non-syndromic congenital
      hydrocephalus.
    explanation: >-
      Establishes HSAS as the most common genetic form and quantifies its share
      of non-syndromic congenital hydrocephalus in males.
- name: HYC1
  display_name: Hydrocephalus, nonsyndromic, autosomal recessive 1 (CCDC88C)
  subtype_term:
    preferred_term: hydrocephalus, nonsyndromic, autosomal recessive 1
    term:
      id: MONDO:0009360
      label: hydrocephalus, nonsyndromic, autosomal recessive 1
  description: >-
    Autosomal recessive congenital hydrocephalus caused by biallelic loss of
    CCDC88C, which encodes DAPLE, a Dishevelled-binding regulator of
    non-canonical Wnt signalling and of ependymal cell planar polarity. Fetal
    neuropathology shows multifocal atresia-forking of the aqueduct of Sylvius
    and of the central canal of the medulla, periventricular neuronal
    heterotopias and choroid plexus hydrops — i.e. a developmental malformation
    of the ependymal-lined channels rather than a simple mechanical plug.
  genes:
  - preferred_term: CCDC88C
    term:
      id: hgnc:19967
      label: CCDC88C
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:21031079
    reference_title: "Disturbed Wnt Signalling due to a Mutation in CCDC88C Causes an Autosomal Recessive Non-Syndromic Hydrocephalus with Medial Diverticulum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Via positional cloning in a consanguineous family with autosomal recessive
      hydrocephalus we have now identified a homozygous splice site mutation in
      the CCDC88C gene as a novel cause of a complex hydrocephalic brain
      malformation.
    explanation: >-
      The original gene-discovery report establishing biallelic CCDC88C loss as
      a cause of autosomal recessive non-syndromic hydrocephalus.
  - reference: PMID:34092257
    reference_title: "Neuropathological hallmarks of fetal hydrocephalus linked to CCDC88C pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both fetuses, brain lesions consisted of multifocal atresia-forking
      along the aqueduct of Sylvius and the central canal of the medulla,
      periventricular neuronal heterotopias and choroid plexus hydrops.
    explanation: >-
      Defines the neuropathological signature of the CCDC88C subtype in human
      fetal material.
- name: HYC2
  display_name: Hydrocephalus, nonsyndromic, autosomal recessive 2 (MPDZ)
  subtype_term:
    preferred_term: hydrocephalus, nonsyndromic, autosomal recessive 2
    term:
      id: MONDO:0014085
      label: hydrocephalus, nonsyndromic, autosomal recessive 2
  description: >-
    Severe autosomal recessive congenital hydrocephalus caused by biallelic
    truncating variants in MPDZ (MUPP1), a multi-PDZ scaffold of apical tight
    junctions that binds DAPLE. Unlike the classic aqueductal-obstruction
    picture, the index families were described as communicating hydrocephalus,
    and mouse work attributes the mechanism to hyperpermeability of the choroid
    plexus epithelial barrier rather than to a mechanical block.
  genes:
  - preferred_term: MPDZ
    term:
      id: hgnc:7208
      label: MPDZ
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:23240096
    reference_title: "Mutation in MPDZ causes severe congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a family in which severe congenital hydrocephalus of
      the communicating type follows an autosomal recessive mode of inheritance.
    explanation: >-
      Establishes the autosomal recessive, communicating character of
      MPDZ-related congenital hydrocephalus in the index family.
  - reference: PMID:23240096
    reference_title: "Mutation in MPDZ causes severe congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct sequencing of these genes revealed a truncating mutation in MPDZ,
      encoding a tight junction protein.
    explanation: >-
      Identifies the causal gene and its tight-junction protein product, the
      basis of the barrier-permeability mechanism curated for this subtype.
- name: HYC3
  display_name: Hydrocephalus, congenital, 3, with brain anomalies (WDR81)
  subtype_term:
    preferred_term: hydrocephalus, congenital, 3, with brain anomalies
    term:
      id: MONDO:0054794
      label: hydrocephalus, congenital, 3, with brain anomalies
  description: >-
    Autosomal recessive congenital hydrocephalus with additional brain anomalies
    attributed to biallelic WDR81 variants. Curated here as a recognized member
    of the non-syndromic autosomal recessive series (HYC1/HYC2/HYC3) for
    completeness of the subtype axis; the entry does not curate a
    WDR81-specific mechanism chain, because the mechanistic literature is
    thinner than for CCDC88C and MPDZ.
  genes:
  - preferred_term: WDR81
    term:
      id: hgnc:26600
      label: WDR81
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:39135208
    reference_title: "Congenital hydrocephalus: a review of recent advances in genetic etiology and molecular mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the 4 genes currently associated with CH (two X-linked genes L1CAM and AP1S2, two autosomal recessive MPDZ and CCDC88C)
    explanation: >-
      Recorded to make the boundary of the classical four-gene set explicit.
      WDR81 sits outside it, which is why this subtype is curated for series
      completeness on the strength of the MONDO disease-series-by-gene axiom for
      MONDO:0054794 rather than on a primary gene-discovery snippet this entry
      has verified. Evidence source is OTHER (review).
- name: Chiari II-associated
  display_name: Hydrocephalus secondary to myelomeningocele with Chiari II malformation
  description: >-
    Hydrocephalus complicating open neural tube defect. The great majority of
    infants undergoing myelomeningocele repair carry a diagnosis of
    hydrocephalus. Under the McLone-Knepper unified theory the hindbrain
    deformity itself is a downstream consequence of the open neural tube: fluid
    and pressure fail to accumulate in the embryonic ventricular system, the
    posterior fossa stays small, and the hindbrain is displaced — which then
    obstructs CSF egress. This subtype is a comorbid complication of
    myelomeningocele, and cross-references but does not absorb the separate
    spina bifida cystica disease entity.
  evidence:
  - reference: PMID:31574479
    reference_title: "Myelomeningocele-associated hydrocephalus: nationwide analysis and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A weighted total of 10,627 inpatient MMC repairs were documented in the
      NIS, 8233 (77.5%) of which had documented hydrocephalus
    explanation: >-
      Nationwide inpatient data quantifying how consistently hydrocephalus
      accompanies myelomeningocele repair.
- name: Dandy-Walker-associated
  display_name: Hydrocephalus associated with Dandy-Walker malformation
  subtype_term:
    preferred_term: isolated Dandy-Walker malformation with hydrocephalus
    term:
      id: MONDO:0017110
      label: isolated Dandy-Walker malformation with hydrocephalus
  description: >-
    Hydrocephalus accompanying the Dandy-Walker malformation (vermian
    hypoplasia, cystic dilatation of the fourth ventricle, enlarged posterior
    fossa). The obstruction is distal — at the level of the fourth ventricle and
    its outflow tracts — rather than at the aqueduct, and a single shunt
    controlling both ventricle and cyst is generally effective. Outcome is
    governed more by the associated malformations and the degree of vermian
    involvement than by the hydrocephalus itself.
  evidence:
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among therapeutical strategies, single shunting (ventriculo-peritoneal or
      cyst-peritoneal shunts) appears effective in the control of both ventricle
      and cyst size.
    explanation: >-
      Characterizes the CSF-diversion behaviour specific to the Dandy-Walker
      subtype, where the ventricle and the posterior fossa cyst behave as one
      compartment.
  - reference: PMID:21928031
    reference_title: "Hydrocephalus in Dandy-Walker malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis and intellectual outcome mostly depend on the presence of
      associated malformations, the degree of vermian malformation and the
      adequate control of hydrocephalus.
    explanation: >-
      Supports curating outcome in this subtype as malformation-determined
      rather than determined by ventricular size alone.
- name: Post-haemorrhagic
  display_name: Post-haemorrhagic hydrocephalus (perinatal/prenatal intraventricular haemorrhage)
  subtype_term:
    preferred_term: post-hemorrhagic hydrocephalus
    term:
      id: NCIT:C116383
      label: Post-Hemorrhagic Hydrocephalus
  description: >-
    Progressive ventricular dilatation following intraventricular haemorrhage,
    most often germinal matrix haemorrhage in the preterm infant but also
    following cryptic prenatal intraventricular microhaemorrhage, which can
    present as apparently idiopathic congenital hydrocephalus. Mechanistically
    this subtype is not purely a reabsorption failure: intraventricular blood
    triggers a TLR4-NF-kB inflammatory response in the choroid plexus epithelium
    that drives SPAK-NKCC1-dependent CSF hypersecretion.
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common cause of acquired hydrocephalus in infants is hemorrhage,
      most often as a consequence of prematurity.
    explanation: >-
      Establishes haemorrhage of prematurity as the dominant acquired cause in
      this age group.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, some apparently idiopathic hydrocephalus may in fact be due to
      unrecognized prenatal intraventricular hemorrhage.
    explanation: >-
      Justifies curating post-haemorrhagic hydrocephalus as a subtype of
      *congenital* hydrocephalus and not only as a postnatal acquired entity.
- name: Post-infectious
  display_name: Post-infectious congenital hydrocephalus
  subtype_term:
    preferred_term: post-inflammatory hydrocephalus
    term:
      id: NCIT:C116384
      label: Post-Inflammatory Hydrocephalus
  description: >-
    Hydrocephalus following intrauterine or neonatal infection. Intrauterine
    infection with cytomegalovirus, Toxoplasma gondii, lymphocytic
    choriomeningitis virus and enterovirus has been associated with
    hydrocephalus, and neonatal ventriculitis is the dominant cause of infant
    hydrocephalus in sub-Saharan Africa, where post-infectious disease drives
    much of the global case burden. Curated as a subtype because these forms are
    frequently present at birth or in early infancy and are indistinguishable at
    presentation from the developmental forms.
  evidence:
  - reference: PMID:29262276
    reference_title: "Endoscopic Treatment versus Shunting for Infant Hydrocephalus in Uganda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrocephalus in this region is most commonly postinfectious, occurring
      after neonatal ventriculitis.
    explanation: >-
      Establishes post-infectious hydrocephalus after neonatal ventriculitis as
      the predominant form in the region carrying the largest share of global
      infant hydrocephalus.
  - reference: PMID:29701543
    reference_title: "Global hydrocephalus epidemiology and incidence: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high crude birth rate, greater proportion of patients with
      postinfectious etiology, and higher incidence of NTDs all contribute to a
      case volume in low- and middle-income countries that outweighs that in
      high-income countries by more than 20-fold.
    explanation: >-
      Quantifies the contribution of the post-infectious subtype to the global
      distribution of paediatric hydrocephalus.

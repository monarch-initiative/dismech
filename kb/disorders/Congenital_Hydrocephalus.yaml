      hydrocephalus arising through a motile-cilia mechanism.
  - reference: PMID:34132502
    reference_title: "Autosomal dominant variants in FOXJ1 causing primary ciliary dyskinesia in two patients with obstructive hydrocephalus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though motile, ependymal cilia influencing cerebrospinal fluid flow in the
      central nervous system share many aspects of structure and function with
      motile cilia in the respiratory tract, hydrocephalus is rarely associated
      with PCD.
    explanation: >-
      Recorded as PARTIAL, and deliberately kept alongside the item above,
      because it states the very asymmetry the HUMAN_MODEL_MISMATCH discussion
      rests on: FOXJ1 is a genuine human motile-cilia route to hydrocephalus,
      and it is the exception rather than the rule among human motile
      ciliopathies.

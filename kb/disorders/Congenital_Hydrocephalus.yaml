- name: Neural Tube Defect with Chiari II Hindbrain Herniation and Small Posterior Fossa
  biological_scale: TISSUE
  role: trigger
  description: >-
    In open neural tube defects the hindbrain deformity and the hydrocephalus
    share a single embryological origin. Under the McLone-Knepper unified theory
    the open neural tube prevents the embryonic ventricular system from
    distending; without that distension the posterior fossa never reaches normal
    size, and the cerebellum, fourth ventricle and medulla are displaced
    caudally. The resulting Chiari II configuration obstructs CSF egress at the
    fourth ventricular outflow and foramen magnum — a distal, not proximal,
    obstruction. This entry cross-references, and deliberately does not absorb,
    the separate spina bifida cystica disease entity.

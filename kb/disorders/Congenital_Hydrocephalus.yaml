      solved congenital hydrocephalus family.
environmental:
- name: Intrauterine infection (cytomegalovirus, Toxoplasma gondii, enterovirus, lymphocytic choriomeningitis virus)
  description: >-
    Congenital infection acquired in utero is an established route to
    hydrocephalus present at birth, and neonatal ventriculitis is the dominant
    aetiology of infant hydrocephalus in sub-Saharan Africa. The contribution of
    unrecognized intrauterine infection to apparently idiopathic congenital
    hydrocephalus is suspected but not quantified.
  effect: Triggers post-infectious congenital hydrocephalus through ventriculitis, ependymal injury and impaired CSF flow or absorption.
  influences_mechanisms:
  - target: Impaired CSF Absorption and Perivascular Clearance
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ventriculitis and the ensuing inflammatory scarring of the ventricular
      system and subarachnoid space impede CSF translocation, the classical
      route from intrauterine or neonatal infection to hydrocephalus.
    evidence:
    - reference: PMID:29262276
      reference_title: "Endoscopic Treatment versus Shunting for Infant Hydrocephalus in Uganda."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hydrocephalus in this region is most commonly postinfectious, occurring
        after neonatal ventriculitis.
      explanation: >-
        Establishes ventriculitis as the causal exposure route in the population
        carrying the largest share of infant hydrocephalus worldwide.
  evidence:
  - reference: PMID:29701543
    reference_title: "Global hydrocephalus epidemiology and incidence: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high crude birth rate, greater proportion of patients with
      postinfectious etiology, and higher incidence of NTDs all contribute to a
      case volume in low- and middle-income countries that outweighs that in
      high-income countries by more than 20-fold.
    explanation: >-
      Quantifies the epidemiological weight of the post-infectious route at
      global scale.
  notes: >-
    No ECTO exposure_term is bound. The concept needed here is intrauterine
    infection by a specific congenital pathogen, and binding a generic
    infectious-agent exposure term would be less accurate than free text; see
    the dismech-terms rule that no term beats a bad one.
- name: Isotretinoin exposure in pregnancy
  description: >-
    Among the medications associated with infantile hydrocephalus when taken
    during pregnancy, isotretinoin has the best documented association. The
    mechanism is presumed to be disruption of retinoic acid morphogen gradients
    in the hindbrain, producing an obstructive malformation — a presumption, not
    a demonstrated chain, and curated as such.
  effect: Teratogenic exposure associated with congenital hydrocephalus, presumed to act through hindbrain morphogen disruption.
  influences_mechanisms:
  - target: Aqueductal Stenosis, Atresia and Forking
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disruption of hindbrain retinoic acid gradients is the proposed route to
      an obstructive malformation of the CSF pathway. The intermediates are not
      established.
    evidence:
    - reference: PMID:24932902
      reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Though isotretinoin-associated hydrocephalus is incompletely
        characterized, it is presumably caused by a disruption of retinoic acid
        morphogen gradients in the hindbrain
      explanation: >-
        Recorded as PARTIAL because the source itself hedges: the association is
        documented but the mechanism is presumed rather than demonstrated.
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best documented association is with isotretinoin
    explanation: >-
      Identifies isotretinoin as the best-documented medication association with
      infantile hydrocephalus.
treatments:
- name: Ventriculoperitoneal Shunt Placement
  description: >-
    The conventional treatment: surgical diversion of CSF from the ventricle to
    the peritoneal cavity. It reliably relieves raised intracranial pressure and
    generally produces a greater reduction in ventricular size than endoscopic
    treatment, but it creates lifelong shunt dependence with a substantial
    revision and infection burden, and — importantly for this entry — it does
    not address a genetic cause and yields only marginal improvement in
    neurocognitive deficits.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Progressive Ventricular Dilatation and Raised Intracranial Pressure
    treatment_effect: INHIBITS
    description: >-
      CSF diversion acts on the central effector node — it removes the
      accumulated fluid and lowers intracranial pressure — and on nothing
      upstream of it.
    evidence:
    - reference: PMID:20301657
      reference_title: "L1 Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Shunting of the cerebrospinal fluid should be performed as needed to
        reduce intracranial pressure.
      explanation: >-
        States the mechanism and indication of shunting: reduction of
        intracranial pressure, the central effector node's proximate readout.
  evidence:
  - reference: PMID:39218781
    reference_title: "The Conundrum of Mechanics Versus Genetics in Congenital Hydrocephalus and Its Implications for Fetal Therapy Approaches: A Scoping Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Postnatal surgical approaches, such as ventriculoperitoneal shunts, do not
      address the underlying genetic causes, have high complication rates, and
      result in a marginal improvement of neurocognitive deficits.
    explanation: >-
      Recorded as PARTIAL because it supports shunting as standard care while
      explicitly bounding what it achieves. Evidence source is OTHER (scoping
      review).
- name: Endoscopic Third Ventriculostomy with Choroid Plexus Cauterization
  description: >-
    The shunt-free alternative: an endoscopic stoma in the floor of the third
    ventricle diverts CSF flow, and cauterization of the choroid plexus reduces
    CSF production. It is technically harder than shunting and fails more often
    in the first months, but virtually all its failures occur within six months,
    after which the risk is low — a decisive advantage where urgent
    shunt-revision surgery is not reliably available. In a randomized trial in
    Ugandan infants with post-infectious hydrocephalus, cognitive outcomes at 12
    months did not differ significantly from ventriculoperitoneal shunting.
    Uniquely among the treatments here, its cauterization component acts on the
    CSF hypersecretion node rather than only on the fluid already accumulated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic third ventriculostomy
    term:
      id: NCIT:C182204
      label: Third Ventriculostomy
  target_mechanisms:
  - target: Choroid Plexus CSF Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Cauterization of the choroid plexus reduces the secretory surface and so
      lowers CSF production, acting on the hypersecretion node directly.
    evidence:
    - reference: PMID:29262276
      reference_title: "Endoscopic Treatment versus Shunting for Infant Hydrocephalus in Uganda."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The endoscopic procedure relieves hydrocephalus by diverting the flow of
        cerebrospinal fluid (CSF), and cauterization of the choroid plexus
        reduces CSF production, further reducing hydrocephalus.
      explanation: >-
        States both mechanisms of the combined procedure, and specifically that
        the cauterization component reduces CSF production.
  evidence:
  - reference: PMID:29262276
    reference_title: "Endoscopic Treatment versus Shunting for Infant Hydrocephalus in Uganda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This single-center study involving Ugandan infants with postinfectious
      hydrocephalus showed no significant difference between endoscopic ETV-CPC
      and ventriculoperitoneal shunting with regard to cognitive outcomes at 12
      months.
    explanation: >-
      Randomized-trial conclusion establishing cognitive equipoise between the
      two procedures in the post-infectious subtype.
  - reference: PMID:29262276
    reference_title: "Endoscopic Treatment versus Shunting for Infant Hydrocephalus in Uganda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, ETV–CPC is technically more difficult than shunting, but it
      has the advantage that virtually all failures occur within 6 months
    explanation: >-
      States the failure-timing profile that motivates ETV-CPC where urgent
      shunt revision is not reliably accessible.
- name: Prenatal Repair of Myelomeningocele
  description: >-
    In utero closure of the open neural tube defect before 26 weeks of
    gestation. In the MOMS randomized trial it roughly halved the rate of
    shunt placement by 12 months and improved hindbrain herniation, at the cost
    of increased preterm delivery and uterine dehiscence. Mechanistically this
    is the only treatment in the entry that acts on the *upstream* trigger
    rather than on the accumulated fluid: closing the defect restores the
    embryonic ventricular pressure whose absence produces the Chiari II
    configuration.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: neurosurgical procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  target_mechanisms:
  - target: Neural Tube Defect with Chiari II Hindbrain Herniation and Small Posterior Fossa
    treatment_effect: INHIBITS
    description: >-
      Closing the open neural tube in utero halts chronic CSF leakage, allowing
      the embryonic ventricular system to distend and the posterior fossa to
      develop, which reduces hindbrain herniation and the need for shunting.
    evidence:
    - reference: PMID:21306277
      reference_title: "A randomized trial of prenatal versus postnatal repair of myelomeningocele."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Prenatal surgery also resulted in improvement in the composite score for
        mental development and motor function at 30 months (P=0.007) and in
        improvement in several secondary outcomes, including hindbrain
        herniation by 12 months and ambulation by 30 months.
      explanation: >-
        Shows prenatal repair improving hindbrain herniation itself, which is
        the node this treatment is asserted to act on.
  evidence:
  - reference: PMID:21306277
    reference_title: "A randomized trial of prenatal versus postnatal repair of myelomeningocele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Actual rates of shunt placement were 40% in the prenatal-surgery group and
      82% in the postnatal-surgery group (relative risk, 0.48; 97.7% CI, 0.36 to
      0.64; P<0.001).
    explanation: >-
      Quantifies the reduction in shunt requirement, the outcome that makes this
      a hydrocephalus-modifying intervention.
  - reference: PMID:21306277
    reference_title: "A randomized trial of prenatal versus postnatal repair of myelomeningocele."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, prenatal surgery was associated with an increased risk of preterm
      delivery and uterine dehiscence at delivery.
    explanation: >-
      Recorded as PARTIAL because it states the maternal and fetal harms that
      bound the recommendation.
- name: Early Ventricular Intervention in Post-haemorrhagic Ventricular Dilatation
  description: >-
    Intervening at a low rather than a high ventriculomegaly threshold in
    preterm infants with progressive post-haemorrhagic ventricular dilatation.
    In a post hoc analysis of a multicentre randomized trial, the low-threshold
    strategy was associated with lower odds of death or severe
    neurodevelopmental disability. Curated with the trial's own caveat: this was
    a post hoc analysis and the primary comparison did not reach significance.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cerebrospinal fluid diversion
    term:
      id: NCIT:C93208
      label: Cerebrospinal Fluid Diversion
  target_mechanisms:
  - target: Progressive Ventricular Dilatation and Raised Intracranial Pressure
    treatment_effect: INHIBITS
    description: >-
      Earlier CSF removal limits the duration and degree of ventricular
      distension before irreversible periventricular injury accrues.
    evidence:
    - reference: PMID:32800815
      reference_title: "Randomized Controlled Early versus Late Ventricular Intervention Study in Posthemorrhagic Ventricular Dilatation: Outcome at 2 Years."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a post hoc analysis, earlier intervention was associated with a lower
        odds of death or severe neurodevelopmental disability in preterm infants
        with progressive posthemorrhagic ventricular dilatation.
      explanation: >-
        Recorded as PARTIAL because the authors themselves label the finding a
        post hoc association rather than a confirmed primary result.
  evidence:
  - reference: PMID:32800815
    reference_title: "Randomized Controlled Early versus Late Ventricular Intervention Study in Posthemorrhagic Ventricular Dilatation: Outcome at 2 Years."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The composite adverse outcome was seen in 20 of 58 infants (35%) in the
      low threshold group and 28 of 55 (51%) in the high threshold (P = .07).
    explanation: >-
      The primary comparison, which did not reach conventional significance —
      the reason this treatment is curated as PARTIAL rather than SUPPORT.

    reference_title: "L1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Males who inherit the L1CAM pathogenic variant will be affected; females
      who inherit the pathogenic variant will be heterozygotes and will usually
      not be affected but may have a range of (typically mild) clinical
      manifestations.
    explanation: >-
      GeneReviews statement of the X-linked transmission pattern and of female
      heterozygote expression.
- name: Autosomal Recessive
  description: >-
    Biallelic transmission of CCDC88C (HYC1), MPDZ (HYC2), WDR81 (HYC3) and
    CRB2. Several index families were consanguineous, and the disease is
    typically severe with prenatal presentation.
  inheritance_term:

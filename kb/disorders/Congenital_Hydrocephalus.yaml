- name: Impaired CSF Absorption and Perivascular Clearance
  biological_scale: TISSUE
  role: effector
  description: >-
    The distal, non-obstructive route to ventricular enlargement: CSF is
    produced normally but cannot be translocated out of the craniospinal
    compartment. In the familiar bulk-flow model this is failure at the
    arachnoid granulations, but up to a third of CSF leaves the skull along
    cranial nerve sheaths into the lymphatic system, and CSF has been shown to
    move along paravascular pathways into the parenchyma and thence to the
    systemic circulation. This entry deliberately does NOT declare conforms_to
    against the glymphatic_dysfunction module here. Conformance is a structural
    assertion that tooling reads as satisfied, and the honest state of the
    evidence does not support it: the source literature states plainly that
    whether disturbances of the lymphatic exit pathway contribute to human
    hydrocephalus is not known, and the module itself carries an unresolved
    convective-versus-diffusive controversy. The relationship is recorded as a
    KNOWLEDGE_GAP discussion attached to this node instead, which is where a
    claim this uncertain belongs.

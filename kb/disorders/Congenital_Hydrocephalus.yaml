  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical end state: motor, cognitive, visual and epileptic sequelae on a
    background of periventricular white matter compromise. Crucially, this node
    is reached by both hypothesis arms, and the entry does not assume CSF
    diversion reverses it — ventriculoperitoneal shunting does not address a
    genetic cause, carries high complication rates, and yields only marginal
    improvement of neurocognitive deficits.

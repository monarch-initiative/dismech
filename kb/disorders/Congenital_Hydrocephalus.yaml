- name: X-linked
  description: >-
    X-linked recessive transmission of L1CAM-related disease (HSAS and the wider
    L1 syndrome spectrum), and of AP1S2-related Fried/Pettigrew syndrome.
    Affected males inherit the variant from a heterozygous mother; heterozygous
    females are usually unaffected but may show typically mild manifestations.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:

mechanistic_hypotheses:
- hypothesis_group_id: csf_dynamics_model
  hypothesis_label: CSF Dynamics (Obstruction, Hypersecretion and Absorption Failure) Model
  status: CANONICAL
  description: >-
    The classical and still-dominant reading: hydrocephalus is an active
    distension of the ventricular system caused by physical or functional
    obstruction of CSF flow between its point of production and its point of
    absorption, with post-haemorrhagic disease adding a hypersecretory
    component. Under this model the ventricular enlargement is the primary
    lesion, raised intracranial pressure is its mediator, and CSF diversion is
    mechanistically curative of the fluid problem.
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our preferred definition is that proposed as part of the International
      Hydrocephalus Working Group, which describes “an active distension of the
      ventricular system...resulting from inadequate passage of cerebrospinal
      fluid from its point of production within the cerebral ventricles to its
      point of absorption into the systemic circulation
    explanation: >-
      The consensus definition on which the CSF-dynamics model rests.
  notes: >-
    Scope boundary: this model is not in dispute for post-haemorrhagic,
    post-infectious and frankly obstructive disease. What the alternative
    hypothesis disputes is its sufficiency for the sporadic and Mendelian
    developmental forms.
- hypothesis_group_id: neural_stem_cell_dysgenesis_model
  hypothesis_label: Neural Stem Cell Fate Disruption and Fetal Brain Dysgenesis Model
  status: EMERGING
  description: >-
    The competing reading from large trio exome cohorts: in a substantial
    fraction of sporadic congenital hydrocephalus the causal lesion is genetic
    disruption of early brain development — ventricular-zone neural stem cell
    fate and prenatal neuro-gliogenesis — rather than impaired CSF dynamics.
    Ventriculomegaly is then a consequence of the dysgenesis, which predicts
    that CSF diversion will relieve pressure without restoring
    neurodevelopmental trajectory. Curated as EMERGING, not CANONICAL: the
    evidence is strong human genetics with a stated mechanistic inference, and
    it applies to a subset of patients, not to the disease as a whole.
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data implicate genetic disruption of early brain development, not
      impaired CSF dynamics, as the primary pathomechanism of a significant
      number of patients with sporadic CH.
    explanation: >-
      The explicit statement of the alternative pathomechanism, in direct
      contrast to the canonical model.
  - reference: PMID:29983323
    reference_title: "De Novo Mutation in Genes Regulating Neural Stem Cell Fate in Human Congenital Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results implicate impaired neurogenesis (rather than active CSF
      accumulation) in the pathogenesis of a subset of CH patients, with
      potential diagnostic, prognostic, and therapeutic ramifications.
    explanation: >-
      Independent cohort reaching the same conclusion and, importantly,
      restricting it to a subset of patients.
  notes: >-
    The two hypotheses are not mutually exclusive at the level of the disease —
    they may both be true of different patients — but they are mutually
    exclusive at the level of an individual case, and they make different
    predictions about what shunting can achieve. That is why they are curated as
    two hypothesis groups over a shared central effector node rather than as one
    blended chain.

    evidence_source: OTHER
    snippet: "| Register | ISRCTN |"
    explanation: >-
      WHO ICTRP registration record establishing the trial's identity on a
      non-ClinicalTrials.gov primary registry.
discussions:
- discussion_id: gap_cilia_hypothesis_human_translatability
  prompt: >-
    Does ependymal motile cilia dysfunction cause human congenital
    hydrocephalus, or is the mouse ciliopathy phenotype a species-specific
    result that does not translate to the human fetal brain?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ependymal Motile Cilia Beat Dysfunction and Loss of Directional CSF Flow
  - pathophysiology#Neuroepithelial Planar Polarity and Apical Constriction Failure
  rationale: >-
    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP: the evidence
    exists and is strong, but it is murine, and its translational validity is
    precisely what is disputed. Three mismatches apply. Human ventriculomegaly
    typically arises in utero, before ependymal cilia have functionally matured,
    so cilia cannot be the primary propeller of CSF at the time the phenotype
    begins. Human motile ciliopathies — primary ciliary dyskinesia —
    infrequently cause hydrocephalus, in contrast to the mouse models on which
    the hypothesis was built. And ciliary genes have functions in signalling and
    neural stem cell fate beyond generating flow, so a hydrocephalus phenotype
    in a ciliary-gene mutant may report altered neurodevelopment rather than
    lost flow — which would move the finding onto the dysgenesis hypothesis arm
    of this entry rather than the CSF-dynamics arm. Curators should not upgrade
    the module-conformance link at these nodes into a claim that cilia-driven
    flow determines human fetal ventricular volume.
  evidence:
  - reference: PMID:36341771
    reference_title: "Rethinking the cilia hypothesis of hydrocephalus."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Second, we highlight that in contrast to mouse models, motile ciliopathies
      infrequently cause hydrocephalus in humans.
    explanation: >-
      The core mismatch: the human phenotype does not follow the mouse
      phenotype, which is what makes this a translational-validity question
      rather than an evidence gap.
  - reference: PMID:36341771
    reference_title: "Rethinking the cilia hypothesis of hydrocephalus."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      First, we discuss neuroembryology and physiology data that do not support
      a role for ependymal cilia as the primary propeller of CSF movement across
      the ventricles in the human brain, particularly during in utero
      development prior to the functional maturation of ependymal cilia.
    explanation: >-
      The developmental-timing argument: the cilia are not yet functional when
      human congenital ventriculomegaly begins.
  - reference: PMID:36341771
    reference_title: "Rethinking the cilia hypothesis of hydrocephalus."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Finally, we postulate that certain cases of hydrocephalus associated with
      ciliary gene mutations may arise not necessarily just from loss of
      cilia-generated CSF flow but also from altered neurodevelopment, given the
      potential functions of ciliary genes in signaling and neural stem cell
      fate beyond generating fluid flow.
    explanation: >-
      Proposes the reassignment of ciliary-gene hydrocephalus to the
      neurodevelopmental arm, which is why this discussion is attached to the
      ciliary nodes rather than resolved against them.
  proposed_experiments:
  - experiment_id: exp_ch_cilia_human_fetal_flow_timing
    name: Timing of ependymal ciliary maturation relative to onset of ventriculomegaly in human fetal brain
    description: >-
      In human fetal brain across the gestational window in which
      ventriculomegaly is first detectable by ultrasound (14-20 weeks), stage
      ependymal multiciliation and ciliary beat competence against the timing of
      ventricular enlargement in the same specimens, and compare cases carrying
      ciliary-gene variants against cases carrying neural-stem-cell-fate gene
      variants. The discriminating prediction is that ventricular enlargement
      preceding functional ciliary maturation cannot be caused by lost
      cilia-generated flow.
  - experiment_id: exp_ch_pcd_cohort_ventricular_volume
    name: Systematic ventricular volumetry in a genotyped primary ciliary dyskinesia cohort
    description: >-
      Measure ventricular volume systematically, rather than by clinical
      referral, in a genotyped primary ciliary dyskinesia cohort stratified by
      the affected axonemal component, to establish whether subclinical
      ventriculomegaly is common in human motile ciliopathy and merely
      under-ascertained, or genuinely rare as the clinical literature implies.
- discussion_id: gap_csf_absorption_glymphatic_role_in_hydrocephalus
  prompt: >-
    Do disturbances of perivascular (glymphatic) and cranial-nerve-sheath
    lymphatic CSF efflux contribute causally to human congenital hydrocephalus,
    or is impaired absorption in this disease adequately described by failure at
    the arachnoid granulations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired CSF Absorption and Perivascular Clearance
  rationale: >-
    This is a KNOWLEDGE_GAP, not a HUMAN_MODEL_MISMATCH: the human evidence is
    absent rather than contradicted by a model. Up to a third of CSF is known to
    leave the skull along cranial nerve sheaths into the lymphatic system, and
    paravascular CSF-parenchyma exchange is established physiology, but the
    source literature states plainly that whether disturbances of that efflux
    route participate in the pathogenesis of human hydrocephalus is not known.
    This entry therefore declines to declare conformance to the glymphatic
    module at all: conformance is a structural assertion tooling reads as
    satisfied, and the anatomical route is established while its causal role in
    human hydrocephalus is not. The module's own unresolved
    convective-versus-diffusive controversy is a second reason to withhold the
    link rather than a caveat attached to a declared one. This discussion is the
    artifact that records the relationship instead. Resolving this matters practically: if
    the lymphatic and perivascular routes are causal contributors, communicating
    congenital hydrocephalus acquires a therapeutic target that CSF diversion
    does not address.
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but whether they play a role in the pathogenesis of human hydrocephalus is
      not yet known
    explanation: >-
      The explicit statement of the gap, made by the review that introduces the
      lymphatic efflux route into the hydrocephalus literature.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altered pulsatility of CSF flow has repeatedly been described in
      conjunction with human hydrocephalus
    explanation: >-
      Records the human observation adjacent to this gap. The source's own
      caveat is quoted separately in the next evidence item rather than
      paraphrased here.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but whether it is cause or consequence remains unclear
    explanation: >-
      The source's cause-versus-consequence caveat on that observation, quoted
      as its own item because the inline numeric citation marker between the two
      clauses cannot be carried in a single verbatim snippet.
  proposed_experiments:
  - experiment_id: exp_ch_perivascular_efflux_infant_tracer
    name: Non-invasive assessment of perivascular and lymphatic CSF efflux in infant hydrocephalus
    description: >-
      In infants with communicating congenital hydrocephalus versus
      age-matched controls, assess perivascular and cranial-nerve-sheath
      lymphatic efflux with non-invasive imaging (intrathecal-contrast-free MRI
      surrogates plus cervical lymphatic imaging), acquired before and after CSF
      diversion. Measuring both before and after diversion is what separates a
      causal absorption deficit from a consequence of the distended ventricle —
      the cause-versus-consequence ambiguity the source review flags for CSF
      pulsatility.
- discussion_id: gap_csf_hypersecretion_human_translatability
  prompt: >-
    Does inflammation-driven choroid plexus CSF hypersecretion occur in human
    post-haemorrhagic hydrocephalus, or is the TLR4-SPAK-NKCC1 axis a rodent
    finding whose magnitude and therapeutic relevance in the preterm human
    infant are unmeasured?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Choroid Plexus CSF Hypersecretion
  - pathophysiology#Intraventricular Haemorrhage and Choroid Plexus Inflammatory Activation
  rationale: >-
    This is a HUMAN_MODEL_MISMATCH for the same reason as the cilia discussion:
    the evidence is strong and mechanistically complete — including
    loss-of-function rescue — but it is entirely rat. No human measurement of
    post-haemorrhagic CSF secretion rate is curated here. The mismatch matters
    because this node carries the entry's only pharmacological target: if human
    post-haemorrhagic hydrocephalus is dominated by impaired absorption rather
    than by hypersecretion, then bumetanide or SPAK inhibition would be treating
    a mechanism that is not rate-limiting in patients, and the observed benefit
    of choroid plexus cauterization would need a different explanation. The
    entry states the rodent provenance in the node description rather than
    letting the SPAK-NKCC1 chain read as established human physiology.
  evidence:
  - reference: PMID:28692063
    reference_title: "Inflammation-dependent cerebrospinal fluid hypersecretion by the choroid plexus epithelium in posthemorrhagic hydrocephalus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PHH is classically attributed to primary impairments in CSF reabsorption,
      but little experimental evidence supports this concept. In contrast, the
      potential contribution of CSF secretion to PHH has received little
      attention.
    explanation: >-
      The authors' own framing: neither the classical absorption account nor the
      secretion account rests on human experimental evidence, which is precisely
      the open question recorded here.
  proposed_experiments:
  - experiment_id: exp_ch_human_phh_csf_secretion_rate
    name: Direct measurement of CSF secretion rate in preterm infants with post-haemorrhagic ventricular dilatation
    description: >-
      In preterm infants already undergoing CSF drainage for post-haemorrhagic
      ventricular dilatation, measure CSF production rate directly from drainage
      volumes under controlled pressure, comparing infants with recent
      intraventricular haemorrhage against infants drained for non-haemorrhagic
      indications. Pair with choroid plexus inflammatory markers and
      phospho-NKCC1 in the drained CSF. The discriminating prediction is that
      the haemorrhagic group shows a raised production rate; if production is
      equal and only clearance differs, the rodent axis does not carry to
      humans.
- discussion_id: gap_ch_dysgenesis_versus_dynamics_case_assignment
  prompt: >-
    For an individual infant with congenital hydrocephalus, what evidence
    assigns the case to the CSF-dynamics model versus the neural stem cell
    dysgenesis model, and does that assignment predict the neurodevelopmental
    benefit of CSF diversion?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Ventricular Dilatation and Raised Intracranial Pressure
  - pathophysiology#Impaired Fetal Neuro-Gliogenesis and Brain Dysgenesis
  rationale: >-
    The two mechanistic hypotheses curated in this entry are not merely
    theoretical alternatives — they predict different things about what
    shunting can achieve, and the persistence of ventriculomegaly and poor
    neurodevelopmental outcome in some post-surgical patients is the clinical
    observation that motivated the dysgenesis model. What is missing is a
    prospective test: whether genotype (a burdened neural-stem-cell-fate gene
    versus an obstructive or haemorrhagic aetiology) predicts the
    neurodevelopmental response to CSF diversion. Until that exists, curators
    should not collapse the two hypothesis groups, and should not present
    genotype as a treatment-selection criterion.
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The poor neurodevelopmental outcomes and persistence of ventriculomegaly
      in some post-surgical patients highlight our limited knowledge of disease
      mechanisms.
    explanation: >-
      States the unexplained clinical observation that this open question is
      asking to resolve.
  proposed_experiments:
  - experiment_id: exp_ch_genotype_stratified_shunt_outcome
    name: Genotype-stratified prospective cohort of neurodevelopmental outcome after CSF diversion
    description: >-
      Enrol infants undergoing first CSF diversion for congenital hydrocephalus
      with trio exome or genome sequencing at baseline, and follow standardized
      neurodevelopmental outcome to at least 24 months. Pre-specify the
      comparison of patients carrying damaging variants in
      neural-stem-cell-fate genes against those with obstructive, haemorrhagic
      or infectious aetiology. The dysgenesis model predicts that pressure
      relief is achieved in both groups while neurodevelopmental trajectory
      improves only in the second.
diagnosis:
- name: L1CAM Molecular Genetic Testing
  description: >-
    Hemizygous pathogenic L1CAM variant identified by molecular genetic testing
    in a male proband with suggestive findings establishes the diagnosis of L1
    syndrome. Diagnosis in a female is unusual but possible. Testing should be
    strongly considered in every male with unexplained hydrocephalus and is
    regarded as mandatory where there is a positive family history or adducted
    thumbs — but note that no single finding or combination of findings
    confirms or excludes the diagnosis clinically, which is what makes the
    molecular test decisive rather than confirmatory.
  presence: Positive in affected males with L1 syndrome
  evidence:
  - reference: PMID:20301657
    reference_title: "L1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of L1 syndrome is established in a male proband with
      suggestive findings and a hemizygous pathogenic variant in L1CAM
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews diagnostic criterion for the HSAS subtype, quoted from the
      DIAGNOSIS/TESTING section.
  - reference: PMID:20301657
    reference_title: "L1 Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of L1 syndrome in a female is unusual but not impossible
      (most likely in the setting of general delay and/or hydrocephalus) and is
      established with the identification of a heterozygous pathogenic variant
      in L1CAM by molecular genetic testing.
    explanation: >-
      Recorded as PARTIAL because it bounds the male-proband criterion: female
      diagnosis is possible, so an X-linked pattern should not be used to
      exclude testing in a female with hydrocephalus and developmental delay.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, L1CAM testing should be strongly considered in all males with
      unexplained hydrocephalus, but should be regarded as mandatory for those
      with a family history or adducted thumbs.
    explanation: >-
      States the testing indication curated in this diagnosis entry.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no single finding or combination of findings can confirm or exclude the
      diagnosis
    explanation: >-
      Recorded as PARTIAL because it limits the value of the clinical findings
      and is the reason the molecular test carries the diagnosis.
- name: Neuroimaging Assessment for Basal Ganglia Iron or Calcium Deposition
  description: >-
    In a male with intellectual disability and hydrocephalus, head CT or
    iron/calcium-sensitive MRI sequences (GRE, SWI) should be used to look for
    basal ganglia deposition, which points to AP1S2-related Fried/Pettigrew
    syndrome rather than L1 syndrome. Both iron and calcium may be subtle or
    invisible on standard MRI sequences, so a negative routine MRI does not
    exclude it.
  presence: Positive in AP1S2-related disease
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend considering AP1S2 testing in males with intellectual
      disability and imaging abnormalities that suggest deposition of iron or
      calcium with the basal ganglia.
    explanation: >-
      States the imaging-triggered testing recommendation curated here.
  - reference: PMID:34092257
    reference_title: "Neuropathological hallmarks of fetal hydrocephalus linked to CCDC88C pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic AP1S2 variants have been linked to Pettigrew syndrome
      characterized by intellectual disability with prominent basal ganglia iron
      deposition or calcification and variable severity of hydrocephalus.
    explanation: >-
      Independent statement of the imaging finding that discriminates
      AP1S2-related disease within the congenital hydrocephalus differential.
- name: Neurologic Surveillance After Diagnosis
  description: >-
    Ongoing neurologic evaluation at regular intervals to monitor hydrocephalus,
    developmental progress and spastic paraplegia. Curated as a diagnostic
    activity rather than a treatment because it is a monitoring protocol, not
    an intervention that acts on a mechanism node.
  evidence:
  - reference: PMID:20301657
    reference_title: "L1 Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Neurologic evaluation at regular intervals to monitor
      hydrocephalus, developmental progress, and spastic paraplegia.
    explanation: >-
      GeneReviews surveillance recommendation, quoted from the MANAGEMENT
      section.

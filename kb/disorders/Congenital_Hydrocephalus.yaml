    FOXJ1 is curated specifically because it is the principal human
    counterexample to the cilia-hypothesis critique in the
    gap_cilia_hypothesis_human_translatability discussion. Omitting it would
    make that discussion look more one-sided than the literature is. Note the
    inheritance pattern is de novo autosomal dominant, unlike the mostly
    autosomal recessive remainder of primary ciliary dyskinesia.

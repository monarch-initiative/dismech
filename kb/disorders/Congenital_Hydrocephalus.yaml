pathophysiology:
- name: Genetic Disruption of Ventricular Zone Neural Stem Cell Fate
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: TRIM71
    term:
      id: hgnc:32669
      label: TRIM71
  - preferred_term: SMARCC1
    term:
      id: hgnc:11104
      label: SMARCC1
  - preferred_term: PTCH1
    term:
      id: hgnc:9585
      label: PTCH1
  description: >-
    Damaging de novo and transmitted variants in genes that govern the fate of
    ventricular-zone neural stem cells — TRIM71, SMARCC1, PTCH1 and duplication
    of its ligand SHH, plus a longer list emerging from larger cohorts — are
    found in a substantial minority of sporadic, neurosurgically treated
    congenital hydrocephalus. These are not CSF-handling genes: every one of
    them is required for neural tube development and regulates neural stem cell
    fate, which is what makes this arm mechanistically distinct from the
    obstruction arm rather than merely another route into it.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: ABNORMAL
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: ABNORMAL
  locations:
  - preferred_term: brain ventricle
    term:
      id: UBERON:0004086
      label: brain ventricle
  evidence:
  - reference: PMID:29983323
    reference_title: "De Novo Mutation in Genes Regulating Neural Stem Cell Fate in Human Congenital Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, all four genes are required for neural tube development and
      regulate ventricular zone neural stem cell fate.
    explanation: >-
      States the convergence of the significantly burdened genes on
      ventricular-zone neural stem cell fate, which is the claim this node makes.
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through whole-exome sequencing of 381 patients (232 trios) with sporadic,
      neurosurgically treated CH, we found that damaging de novo mutations
      account for >17% of cases, with five different genes exhibiting a
      significant de novo mutation burden.
    explanation: >-
      Quantifies the de novo mutational burden in a large sporadic cohort,
      establishing that this arm accounts for a substantial fraction of cases.
  downstream:
  - target: Impaired Fetal Neuro-Gliogenesis and Brain Dysgenesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - neural_stem_cell_dysgenesis_model
    description: >-
      Loss of normal neural stem cell fate regulation in the ventricular zone
      distorts the prenatal neuro-gliogenic programme that builds the
      periventricular brain.
- name: L1CAM-Mediated Neural Adhesion and Axon Guidance Failure
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: L1CAM
    term:
      id: hgnc:6470
      label: L1CAM
  - preferred_term: AP1S2
    term:
      id: hgnc:560
      label: AP1S2
  description: >-
    Loss-of-function variants in L1CAM remove a neural recognition molecule of
    the immunoglobulin superfamily required for intercellular adhesion, neuronal
    migration, axon guidance and fasciculation. The consequence is a set of
    structural malformations — corticospinal tract hypoplasia or aplasia,
    callosal abnormality, and obstruction of CSF flow most commonly at the
    aqueduct — rather than a primary defect of CSF secretion or absorption.
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: DECREASED
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
    modifier: ABNORMAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The L1CAM gene product is a neural recognition molecule that plays key
      roles in neuronal migration and axon guidance
    explanation: >-
      States the molecular function whose loss defines this node.
  - reference: PMID:24932902
    reference_title: "Infantile hydrocephalus: a review of epidemiology, classification and causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When mutated, it gives rises to several structural malformations that
      obstruct CSF flow, most commonly at the level of the aqueduct
    explanation: >-
      Connects L1CAM loss of function to the obstructive malformation this node
      feeds, and locates the obstruction at the aqueduct.
  downstream:
  - target: Aqueductal Stenosis, Atresia and Forking
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - csf_dynamics_model
    description: >-
      L1CAM-dependent malformation of the periaqueductal neuroepithelium
      narrows or occludes the aqueduct.
  - target: Adducted Thumbs
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Adducted thumbs accompany L1CAM loss of function in 88% of
      mutation-positive autopsy subjects; the intermediates between the
      adhesion/guidance defect and the thumb posture are not established.
  - target: Spasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hypoplasia or aplasia of the corticospinal tracts, present in 98% of
      L1CAM-mutation-positive autopsy subjects, is the intermediate between the
      axon-guidance defect and the spastic phenotype.
  - target: Abnormal Corpus Callosum Morphology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Failure of callosal axon guidance and fasciculation produces the callosal
      abnormality seen in 98% of L1CAM-mutation-positive autopsy subjects.
- name: Neuroepithelial Planar Polarity and Apical Constriction Failure
  biological_scale: CELLULAR
  role: effector
  genes:
  - preferred_term: CCDC88C
    term:
      id: hgnc:19967
      label: CCDC88C
  - preferred_term: MPDZ
    term:
      id: hgnc:7208
      label: MPDZ
  - preferred_term: CRB2
    term:
      id: hgnc:18688
      label: CRB2
  - preferred_term: WDR81
    term:
      id: hgnc:26600
      label: WDR81
  conforms_to: "ciliopathy_dysfunction#Planar Cell Polarity and Non-Canonical Wnt Disruption"
  description: >-
    The autosomal recessive arm converges on the planar-polarity and apical
    constriction machinery of the ventricular neuroepithelium. CCDC88C encodes
    DAPLE, a Dishevelled-binding protein that contributes to ependymal planar
    polarity by inhibiting non-canonical Wnt signalling and that physically
    interacts with MPDZ (a multi-PDZ apical junction scaffold) and CRB2; the
    three cooperate to promote apical cell constriction during neurulation.
    The node is named for apical constriction rather than for junctional
    disruption on the strength of its own negative evidence: in the human CRB2
    fetal cases, PAR-complex components and tight- and adherens-junction
    molecules were normally localized, so the lesion is not a generalized loss
    of apicobasal polarity. What it produces is frank malformation of the
    ependymal-lined channels (atresia and forking) with periventricular neuronal
    heterotopia.
  cell_types:
  - preferred_term: ependymal cell
    term:
      id: CL:0000065
      label: ependymal cell
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, pathogenic variants in FOXJ1 (Chr 17q25.1) were identified
      causing PCD associated with hydrocephalus, reduced respiratory cilia
      number, axonemal microtubule disorganization, and occurring in a de novo,
      autosomal dominant inheritance pattern.
    explanation: >-

name: Congenital Hydrocephalus
creation_date: "2026-08-20T00:00:00Z"
category: Complex
disease_term:
  preferred_term: congenital hydrocephalus
  term:
    id: MONDO:0016349
    label: congenital hydrocephalus
description: >-
  Congenital hydrocephalus (CH) is ventricular enlargement present at birth or in
  the first months of life, classically framed as an active distension of the
  ventricular system resulting from inadequate passage of cerebrospinal fluid
  (CSF) from its point of production to its point of absorption. It is
  aetiologically heterogeneous rather than a single disease: a Mendelian arm
  (L1CAM, CCDC88C, MPDZ, AP1S2, WDR81 and a much longer list of syndromic genes),
  a sporadic de novo arm converging on ventricular-zone neural stem cell fate
  (TRIM71, SMARCC1, PTCH1/SHH), a malformation arm secondary to neural tube
  defects with Chiari II malformation and to Dandy-Walker malformation, and an
  acquired-in-utero/perinatal arm following intraventricular haemorrhage or
  intrauterine and neonatal infection. A central and unsettled question runs
  through the entry: whether ventriculomegaly in a given patient is driven by CSF
  accumulation against an obstruction, or is a read-out of primary fetal brain
  dysgenesis in which the ventricle enlarges because the surrounding brain was
  never built. The two readings are curated as competing mechanistic hypotheses
  rather than blended, because they predict different responses to CSF diversion.
synonyms:
- congenital hydrocephaly
- hydrocephalus present at birth
- infantile hydrocephalus
parents:
- Hydrocephalus
- Congenital Nervous System Disorder
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Curated as a neurological disorder of CSF dynamics and fetal brain
      development; the neurosurgical management arm (shunting, endoscopic third
      ventriculostomy) sits within the same chapter scope.

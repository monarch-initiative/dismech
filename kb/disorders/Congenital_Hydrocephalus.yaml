animal_models:
- name: Rat post-haemorrhagic hydrocephalus (intraventricular haemorrhage model)
  species: Rat
  genotype: Wild type with induced intraventricular haemorrhage; TLR4-null and SPAK-null comparators
  category: INDUCED
  description: >-
    Induced intraventricular haemorrhage in the rat, used to dissect the
    inflammatory route from blood in the ventricle to CSF hypersecretion.
    Genetic depletion of TLR4 or SPAK normalizes secretion and reduces symptoms,
    which is what makes the axis necessary rather than merely correlated.
  publication: PMID:28692063
  modeled_mechanisms:
  - target: Choroid Plexus CSF Hypersecretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the post-haemorrhagic secretory phenotype and supplies the
      loss-of-function rescue that establishes SPAK-NKCC1 as necessary for it.
    limitations: >-
      The entire chain is rodent. No human measurement of post-haemorrhagic CSF
      hypersecretion is curated in this entry, and rat ventricular anatomy,
      CSF turnover rate and the timing of germinal matrix haemorrhage differ
      from the preterm human infant in whom the clinical syndrome occurs.
    readouts:
    - name: Bumetanide-sensitive CSF secretion rate
      target: Choroid Plexus CSF Hypersecretion
      direction: INCREASED
      interpretation: >-
        Approximately three-fold rise in CSF secretion after intraventricular
        haemorrhage, sensitive to NKCC1 blockade.
      evidence:
      - reference: PMID:28692063
        reference_title: "Inflammation-dependent cerebrospinal fluid hypersecretion by the choroid plexus epithelium in posthemorrhagic hydrocephalus."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In a rat model of PHH, we demonstrate that IVH causes a Toll-like
          receptor 4 (TLR4)- and NF-κB-dependent inflammatory response in the
          CPE that is associated with a ∼3-fold increase in bumetanide-sensitive
          CSF secretion.
        explanation: >-
          Reports the measurement and its magnitude directly.
    evidence:
    - reference: PMID:28692063
      reference_title: "Inflammation-dependent cerebrospinal fluid hypersecretion by the choroid plexus epithelium in posthemorrhagic hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Genetic depletion of TLR4 or SPAK normalizes hyperactive CSF secretion
        rates and reduces PHH symptoms
      explanation: >-
        The rescue result that makes this model informative for the
        hypersecretion node rather than merely descriptive of it.
- name: Dishevelled compound-mutant mouse (ependymal planar polarity)
  species: Mouse
  genotype: hGFAP-Cre;Dvl1(-/-);Dvl2(flox/flox);Dvl3(+/-)
  category: GENETICALLY_ENGINEERED
  description: >-
    Compound conditional ablation of the three Dishevelled genes in the
    ependymal lineage. The informative feature is what is spared: ependymal
    cells differentiate normally and cilia are assembled, so the phenotype
    isolates loss of ciliary planar alignment from loss of cilia themselves.
  publication: PMID:25043421
  modeled_mechanisms:
  - target: Ependymal Motile Cilia Beat Dysfunction and Loss of Directional CSF Flow
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces loss of intracellular and intercellular rotational alignment of
      ependymal motile cilia, with measurably slower generated flow and
      consequent hydrocephalus.
    limitations: >-
      Fidelity is recorded as LOW deliberately, not because the mouse experiment
      is weak but because its translational validity to human congenital
      hydrocephalus is contested: human ventriculomegaly typically begins in
      utero before ependymal cilia functionally mature, and human motile
      ciliopathies infrequently cause hydrocephalus. See the
      gap_cilia_hypothesis_human_translatability discussion.
    readouts:
    - name: Ependymal-generated cerebrospinal fluid flow velocity
      target: Ependymal Motile Cilia Beat Dysfunction and Loss of Directional CSF Flow
      direction: DECREASED
      interpretation: >-
        Flow generated by mutant ependymal cells is significantly slower than
        control, linking the alignment defect to a transport deficit.
      evidence:
      - reference: PMID:25043421
        reference_title: "Loss of Dishevelleds disrupts planar polarity in ependymal motile cilia and results in hydrocephalus."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As a consequence, the fluid flow generated by the
          hGFAP-Cre;Dvl1(-/-);2(flox/flox);3(+/-) E cells was significantly
          slower than that observed in control mice.
        explanation: >-
          Reports the flow measurement that grounds this readout.
    evidence:
    - reference: PMID:25043421
      reference_title: "Loss of Dishevelleds disrupts planar polarity in ependymal motile cilia and results in hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In hGFAP-Cre;Dvl1(-/-);2(flox/flox);3(+/-) mutants, E cells
        differentiated normally, but the intracellular and intercellular
        rotational alignments of ependymal motile cilia were disrupted.
      explanation: >-
        Establishes that the model isolates ciliary alignment from ependymal
        differentiation, which is what makes it informative for this node
        specifically.
notes: >-
  Scope boundaries for future curators. (1) Spina bifida cystica /
  myelomeningocele is a separate disease entity (issue #8965) and is NOT yet
  curated in kb/disorders/. The Chiari II-associated subtype here deliberately
  covers only the hydrocephalus that complicates it. When that entry is created
  it should be linked from this subtype rather than merged into it. (2) The two mechanistic hypotheses
  are deliberately not blended — see the OPEN_QUESTION discussion. (3)
  Conformance is declared to ciliopathy_dysfunction only, at two nodes, with
  attached discussions bounding what those links assert; they should not be read
  as importing settled human mechanism. Conformance to glymphatic_dysfunction is
  deliberately NOT declared, and the CSF-clearance node states the reason in
  full: the source literature says plainly that whether disturbances of the
  lymphatic exit pathway contribute to human hydrocephalus is not known, and the
  module itself carries an unresolved convective-versus-diffusive controversy.
  The relationship is recorded in prose rather than as a structural assertion
  tooling would read as satisfied. (4) The
  alpha-dystroglycanopathies (POMT1, POMT2, POMGNT1, FKTN, FKRP, LARGE, ISPD)
  and syndromic forms with more than 100 associated genes are out of scope for
  this entry's subtype axis, which is restricted to forms in which
  hydrocephalus is the isolated or major clinical feature plus the four
  acquired/malformation routes named in the curation issue.

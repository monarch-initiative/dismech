genetic:
- name: SPTBN2 (SCA5)
  subtype: SCA5
  gene_term:
    preferred_term: SPTBN2
    term:
      id: hgnc:11276
      label: SPTBN2
  association: Causative heterozygous missense or in-frame deletion variants
  presence: Positive
  notes: >-
    Dominant SPTBN2 variants alter beta-III spectrin and disrupt Purkinje-cell
    postsynaptic organization. Biallelic and de novo SPTBN2 disorders are
    distinct allelic conditions and should not be conflated with classic SCA5.
  evidence:
  - reference: PMID:21827906
    reference_title: Spinocerebellar ataxia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ikeda et al. (2006) discovered that β-III spectrin (SPTBN2) mutations
      cause spinocerebellar ataxia type 5 (SCA5) in the American kindred and
      two additional independently reported SCA5 families.
    explanation: This establishes the dominant SPTBN2-SCA5 association.
- name: CACNA1A CAG expansion (SCA6)
  subtype: SCA6
  gene_term:
    preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  association: Causative CAG repeat expansion, generally 19-33 repeats
  presence: Positive
  notes: >-
    The expansion lies in the final exon of CACNA1A and encodes a polyglutamine
    tract. Other CACNA1A variant classes cause overlapping but distinct
    channelopathies, including episodic ataxia type 2 and familial hemiplegic
    migraine type 1.
  evidence:
  - reference: PMID:29427102
    reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetically, SCA6 is caused by expansion of a trinucleotide CAG repeat in
      the last exon of longest isoform CACNA1A gene on chromosome
      19p13.1-p13.2.
    explanation: The review establishes the CACNA1A repeat-expansion cause.
- name: TTBK2 (SCA11)
  subtype: SCA11
  gene_term:
    preferred_term: TTBK2
    term:
      id: hgnc:19141
      label: TTBK2
  association: Causative heterozygous frameshift variants producing premature truncation
  presence: Positive
  notes: >-
    The best-supported functional model is mild dominant-negative interference
    by truncated TTBK2 rather than simple haploinsufficiency.
  evidence:
  - reference: PMID:30532139
    reference_title: Spinocerebellar ataxia type 11-associated alleles of Ttbk2 dominantly interfere with ciliogenesis and cilium stability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SCA11 is caused by mutations in the gene encoding the Serine/Threonine
      kinase Tau tubulin kinase 2 (TTBK2) that result in premature truncations
      of the protein.
    explanation: This supports truncating TTBK2 variants as the cause of SCA11.
- name: EEF2 p.Pro596His (SCA26)
  subtype: SCA26
  gene_term:
    preferred_term: EEF2
    term:
      id: hgnc:3214
      label: EEF2
  association: Segregating single-family p.Pro596His causal candidate
  presence: Positive
  notes: >-
    The p.Pro596His variant was identified in the original SCA26 family and has
    functional support for translational infidelity and proteostatic stress.
    Because independent adult-onset SCA26 replication is limited, causal and
    mechanistic confidence is lower than for SCA5, SCA6, SCA11, or SCA31.
  evidence:
  - reference: PMID:23001565
    reference_title: A conserved eEF2 coding variant in SCA26 leads to loss of translational fidelity and increased susceptibility to proteostatic insult.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a single variant that co-segregates with the disease
      phenotype that produces a single amino acid substitution in eukaryotic
      elongation factor 2.
    explanation: Cosegregation and functional data support EEF2, with single-family limitations.
- name: BEAN1/TK2 repeat locus (SCA31)
  subtype: SCA31
  gene_term:
    preferred_term: BEAN1
    term:
      id: hgnc:24160
      label: BEAN1
  association: Causative intronic pentanucleotide insertion containing a long (TGGAA)n tract
  presence: Positive
  notes: >-
    The insertion occupies overlapping intronic sequence in the oppositely
    transcribed BEAN1/TK2 region. BEAN1 is the structured gene anchor because
    the toxic repeat-containing transcript is produced in the BEAN1 direction.
  evidence:
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other was an insertion, from 2.5-3.8 kb long, consisting of complex
      penta-nucleotide repeats including a long (TGGAA)n stretch.
    explanation: The original study identifies the pathogenic SCA31 repeat insertion.
diagnosis:
- name: Clinical pattern, pedigree, and brain MRI
  presence: Positive
  description: >-
    A slowly progressive, predominantly pure cerebellar syndrome in successive
    generations suggests ADCA-III. Brain MRI usually shows isolated or
    predominant cerebellar atrophy with relative preservation of the brainstem;
    imaging supports the phenotype but does not establish the molecular subtype.
  results: Autosomal dominant pedigree with predominant cerebellar atrophy and minimal extracerebellar disease.
  evidence:
  - reference: PMID:15732118
    reference_title: Spinocerebellar ataxia type 26 maps to chromosome 19p13.3 adjacent to SCA6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging study of 11 affected patients showed
      that atrophy was confined to the cerebellum.
    explanation: SCA26 demonstrates the characteristic isolated cerebellar MRI pattern.
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI showed cerebellar atrophy with preservation of nodulus/uvula and
      brainstem.
    explanation: The defining SCA30 family also showed predominantly cerebellar atrophy.
- name: Subtype-directed molecular testing
  presence: Positive
  description: >-
    Testing must combine methods: sequence and deletion/duplication analysis for
    SPTBN2 and TTBK2, sequence analysis for the reported EEF2 SCA26 variant,
    direct CAG sizing for CACNA1A/SCA6, and a repeat-capable assay for the
    BEAN1/TK2-region SCA31 insertion. Exome sequencing alone does not reliably
    detect repeat expansions. No molecular confirmation is currently available
    for linkage-defined SCA30.
  results: A pathogenic or compelling subtype-specific variant establishes the molecular diagnosis except in gene-unresolved SCA30.
  evidence:
  - reference: PMID:20301723
    reference_title: Spinocerebellar Ataxia Type 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of spinocerebellar ataxia type 11 (SCA11) is established in
      a proband with a heterozygous pathogenic variant in TTBK2 identified by
      molecular genetic testing.
    explanation: GeneReviews supports molecular confirmation for SCA11.
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By performing comprehensive Southern blot analysis and BAC- and
      fosmid-based sequencing, we isolated two genetic changes segregating with
      SCA31.
    explanation: SCA31 required repeat-capable structural analysis rather than routine coding sequencing.
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The responsible gene is yet to be determined, but ODZ3 is a plausible
      candidate.
    explanation: SCA30 remains molecularly unresolved.
differential_diagnoses:

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADCA Type I includes SCA1 - SCA4, SCA8, SCA10, SCA12 - SCA23, SCA25,
      SCA27, SCA28, and SCA32 - SCA36.
    explanation: The review places SCA3 in ADCA-I rather than the ADCA-III grouping.
treatments:
- name: Multidisciplinary supportive care and rehabilitation
  description: >-
    No established disease-modifying therapy exists for the canonical ADCA-III
    subtypes. Management uses physiotherapy for gait and balance, occupational
    therapy and home adaptation, speech and language therapy for dysarthria and
    dysphagia, and mobility or communication aids as needed. Subtype-specific
    experimental drugs should be represented as clinical trials rather than
    routine treatment.

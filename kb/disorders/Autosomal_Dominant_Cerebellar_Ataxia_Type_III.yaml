- name: SCA31 Repeat-RNA Toxicity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The pathogenic SCA31 insertion contains a long (TGGAA)n tract in an intron
    shared by oppositely transcribed BEAN1 and TK2. The BEAN1-direction
    (UGGAA)n transcript forms nuclear RNA foci in Purkinje cells, binds
    serine/arginine-rich splicing factors, and is toxic in cultured-cell
    systems, supporting repeat-RNA toxicity and disturbed RNA processing.

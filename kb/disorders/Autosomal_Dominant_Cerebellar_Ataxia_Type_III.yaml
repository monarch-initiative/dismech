name: Autosomal Dominant Cerebellar Ataxia Type III
creation_date: "2026-04-25T00:00:00Z"
category: Mendelian
synonyms:
- ADCA type III
- Harding type III autosomal dominant cerebellar ataxia
- Autosomal dominant pure cerebellar ataxia
description: >-
  Autosomal dominant cerebellar ataxia type III (ADCA-III) is Harding's
  clinicophenotypic class of dominantly inherited, mostly pure cerebellar
  syndromes. It is not spinocerebellar ataxia type 3 (SCA3/Machado-Joseph
  disease): the Roman numeral denotes Harding's broad class, not an individual
  numbered SCA. The canonical disease concept comprises SCA5, SCA6, SCA11,
  SCA26, SCA30, and SCA31. Gait and limb ataxia, dysarthria, abnormal eye
  movements, and predominantly cerebellar atrophy define the class, although
  mild pyramidal, neuropathic, parkinsonian, dystonic, or tremor features can
  occur in individual families. The molecular causes are heterogeneous:
  SPTBN2-associated postsynaptic organization defects in SCA5, a CACNA1A CAG
  expansion with polyglutamine proteotoxicity in SCA6, truncating TTBK2 alleles
  that disrupt cilia in SCA11, an EEF2 p.Pro596His variant that impairs
  translational fidelity in the original SCA26 family, and a noncoding
  BEAN1/TK2-region pentanucleotide insertion producing toxic repeat RNA in
  SCA31. SCA30 remains mapped to chromosome 4q34.3-q35.1 without an established
  causal gene. Four further numbered types described after the 2013 class review
  are classified here by MONDO and are curated on this entry, all of them
  conventional-variant rather than repeat-expansion diseases: ELOVL5 missense
  alleles that impair polyunsaturated fatty-acid elongation in SCA38, TRPC3
  missense alleles of unresolved functional consequence in SCA41, CACNA1G
  missense alleles that shift Cav3.1 T-type calcium channel voltage dependence in
  SCA42, and FAT2 missense alleles in a cerebellar granule-cell cadherin that
  mouse work shows is required for parallel-fibre synapse organization in SCA45.
  The distinction between a repeat expansion and a conventional variant is
  mechanistically load-bearing in this class: of the roster members with an
  identified gene, only SCA6 (a coding CAG expansion) and SCA31 (a noncoding
  pentanucleotide insertion) are repeat diseases.

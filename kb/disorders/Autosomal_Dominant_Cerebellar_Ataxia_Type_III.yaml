      The primary purpose of this study was to compare the efficacy of BHV-4157
      (Troriluzole) 140 milligrams (mg) once daily versus placebo after 8 weeks
      of treatment in participants with spinocerebellar ataxia (SCA).
    explanation: The registry documents the controlled troriluzole study; eligibility included SCA6.

    intermediate_mechanisms:
    - Purkinje-cell nuclear RNA foci
    - Binding and perturbation of splicing factors
    description: >-
      Toxic BEAN1-direction repeat RNA and nuclear foci are associated with
      Purkinje-cell degeneration.
    evidence:
    - reference: PMID:23607545
      reference_title: Abnormal RNA structures (RNA foci) containing a penta-nucleotide repeat (UGGAA)n in the Purkinje cell nucleus is associated with spinocerebellar ataxia type 31 pathogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Taking these findings together, we conclude that the RNA foci
        containing BEAN1-direction transcript (UGGAA)n are associated with PC
        degeneration in SCA31.
      explanation: Human tissue and cell data connect repeat-RNA foci with Purkinje-cell degeneration.
  evidence:
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The repeat insertion was located in introns of TK2 and BEAN (brain
      expressed, associated with Nedd4) expressed in the brain and formed RNA
      foci in the nuclei of patients' Purkinje cells.
    explanation: The original study demonstrates repeat-containing RNA foci in patient Purkinje cells.
- name: Purkinje Cell Dysfunction and Predominant Cerebellar Atrophy
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The canonical ADCA-III subtypes converge clinically on predominant
    cerebellar cortical dysfunction and atrophy. Purkinje cells are the best
    established vulnerable population in SCA5, SCA6, SCA11, and SCA31; SCA26
    and SCA30 show cerebellum-confined atrophy in the defining families.
    Purkinje-cell firing dysfunction can precede overt cell loss, so the common
    node represents both functional failure and later degeneration rather than
    requiring histologic cell loss in every subtype.

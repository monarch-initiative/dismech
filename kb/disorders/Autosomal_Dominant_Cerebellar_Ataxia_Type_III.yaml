discussions:
- discussion_id: sca6_channel_function_versus_proteotoxicity
  prompt: >-
    How much of SCA6 pathogenesis is caused by altered intrinsic Cav2.1 channel
    function versus polyglutamine proteotoxicity, ER-stress decompensation, and
    secondary membrane hyperexcitability?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#CACNA1A Polyglutamine Proteotoxicity and ER-Stress Decompensation
  rationale: >-
    Xenopus-oocyte work suggested beta4-dependent enhanced channel activation
    and excessive calcium entry. Knock-in Purkinje-neuron recordings instead
    found unchanged current density and voltage dependence, and the 2026
    age-series study attributed abnormal spiking to ER-stress-induced
    store-operated calcium current rather than Cav2.1 ion flux. The entry
    therefore represents proteotoxicity and ER-stress evidence without assigning
    a directional CACNA1A transport defect.
  evidence:
  - reference: PMID:10964945
    reference_title: The polyglutamine expansion in spinocerebellar ataxia type 6 causes a beta subunit-specific enhanced activation of P/Q-type calcium channels in Xenopus oocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings suggest the possibility that SCA6 is a channelopathy, and
      that the underlying mutation in SCA6 causes Purkinje cell degeneration
      through excessive entry of calcium ions.
    explanation: This is the older channel-gain interpretation.
  - reference: PMID:18687887
    reference_title: Spinocerebellar ataxia type 6 knockin mice develop a progressive neuronal dysfunction with age-dependent accumulation of mutant CaV2.1 channels.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neither voltage sensitivity of activation nor inactivation was altered in
      the Sca6(84Q) neurons, suggesting that expanded CAG repeat per se does not
      affect the intrinsic electrophysiological properties of the channels.
    explanation: Native Purkinje-neuron data argue against a simple intrinsic channel-gating explanation.
  - reference: PMID:40990218
    reference_title: Resilience to Endoplasmic Reticulum Stress Mitigates Membrane Hyperexcitability Underlying Late Disease Onset in a Murine Model of SCA6.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The impairments in Purkinje neuron spiking are unrelated to Cav2.1
      ion-flux function.
    explanation: Current work explicitly separates membrane hyperexcitability from Cav2.1 ion flux.
- discussion_id: sca30_causal_gene_gap
  prompt: What gene and molecular mechanism cause linkage-defined SCA30?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#SCA30
  rationale: >-
    The phenotype and chromosome 4q34.3-q35.1 locus are defined in one family,
    but no causal variant has been established. ODZ3/TENM3 was nominated only as
    a candidate, so adding a SCA30 genetic or mechanism node would overstate the
    evidence.
  evidence:
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The responsible gene is yet to be determined, but ODZ3 is a plausible
      candidate.
    explanation: The defining report explicitly records the unresolved causal gene.
notes: >-
  ADCA-III is a historical clinical class that remains useful for prognosis and
  test prioritization, but it is not a single molecular disease. Other dominantly
  inherited ataxias can appear predominantly cerebellar, but should not be
  silently added to this term when their established nosologic placement is
  ADCA-I or remains a boundary classification. In particular, ADCA type III must
  not be conflated with SCA3/Machado-Joseph disease.

  MONDO's own definition text and MONDO's own class hierarchy disagree about the
  size of this concept, and this entry follows the hierarchy. The definition on
  MONDO:0019793 says the group "includes spinocerebellar ataxia (SCA) type 5
  (SCA5), SCA6, SCA11, SCA26, SCA30, and SCA31", which is the roster of the 2013
  class review the definition is built on. That term carries Orphanet:94148 as a
  database cross-reference, read from OLS4 on 2026-09-26; the Orphanet record
  itself has not been fetched here, so the cross-reference is the provenance
  claim and not an assertion about which text came first. An OLS4 query for the
  hierarchical descendants of MONDO:0019793 run on 2026-09-25 returns eleven
  terms: those six plus SCA38 (MONDO:0014417), SCA41 (MONDO:0014626), SCA42
  (MONDO:0014776), SCA45 (MONDO:0033480) and SCA42ND (MONDO:0060758). All four
  of the additional numbered types were first reported after the 2013 review, all
  are dominantly inherited and predominantly cerebellar, and none of them is
  claimed by ADCA-I, so they are curated here as subtype rows rather than
  dispositioned. The stale definition text is a candidate upstream MONDO report.

  SCA42ND (MONDO:0060758) is deliberately not a separate row. It hangs off
  MONDO:0014776 rather than off this entry's term, carries no gene edge of its
  own, and ClinGen's CACNA1G curation lumped it into SCA42 because the molecular
  mechanism could not be distinguished; it is therefore covered by the SCA42 row.

  Two of the roster members have their own Disease entries, which own the
  allele-level detail: Spinocerebellar_Ataxia_Type_6 (MONDO:0008457) and
  Spinocerebellar_Ataxia_Type_31 (MONDO:0007296). Their subtype rows here are the
  class-membership claim, not a duplicate of that detail. SCA6 is also the reason
  a gene-keyed comparison against MONDO misses this entry's CACNA1A coverage:
  MONDO:0008457 carries no RO:0004003 gene edge of its own and inherits CACNA1A
  from its other parent, MONDO:0100254 "CACNA1A-related complex
  neurodevelopmental disorder".

  SCA14 (MONDO:0011540, PRKCG) and SCA15/16 (MONDO:0011694, ITPR1) are sometimes
  described as pure cerebellar, which is why they are mistaken for members of this
  group. They are not: MONDO places both under MONDO:0019792, autosomal dominant
  cerebellar ataxia type I, confirmed by OLS4 on 2026-09-25. SCA14 is curated as
  an ADCA-I subtype row and SCA15/16 has its own entry, so both are out of scope
  here.
review_notes: >-
  Full review completed 2026-07-21. The subtype roster was reconciled to the
  disease-defining ADCA-III review and current MONDO/Orphanet concept; SCA26 and
  SCA30 were restored, while SCA14, SCA15/16, SCA23, SCA25, SCA43, and SCA46
  were removed from this canonical grouping. EEF2 p.Pro596His was added as the
  post-2013 SCA26 causal candidate with explicitly provisional confidence, and
  SCA30 was retained as a gene-unresolved locus. Current SCA6 evidence prompted
  removal of the unsupported decreased-calcium-transport claim and explicit
  documentation of the channelopathy-versus-proteotoxicity debate.
  ClinicalTrials.gov was queried by each canonical subtype: the mixed-SCA
  troriluzole trials NCT02960893 and NCT03701399 and CACNA1A trial NCT07221292
  were retained because they explicitly include SCA6; observational,
  nonspecific device, and stale broad-cell-therapy records were not promoted.
  DailyMed searches current through 2026-07-20 returned no label for troriluzole
  or BHV-4157, and no approved disease-modifying ADCA-III treatment was found.
  Public molecular-data review identified human SCA6 iPSC SuperSeries GSE85349
  and mouse SCA6 age-series RNA-seq GSE264100.

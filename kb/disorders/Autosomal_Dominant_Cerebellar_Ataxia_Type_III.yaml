epidemiology:
- name: Unknown overall incidence with subtype- and population-specific distribution
  description: >-
    The incidence of the ADCA-III class is unknown. SCA6 is the most commonly
    recognized canonical subtype in many tested populations, while SCA31 has a
    strong founder effect in Japan. The other canonical subtypes are rare or
    confined to very few reported families, so a single prevalence estimate
    would be misleading.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of ADCA Type III is unknown.
    explanation: The disease-defining review states that overall incidence is unknown.
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The subtype SCA6 is the most common.
    explanation: The review identifies SCA6 as the most common canonical ADCA-III subtype.
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SCA31 critical region was tracked down to a 900 kb interval in
      chromosome 16q22.1, where the disease shows a strong founder effect.
    explanation: The original SCA31 study documents its strong founder effect.
progression:
- phase: Predominantly adult-onset progressive cerebellar syndrome
  age_range: Adolescence through late adulthood
  notes: >-
    Most affected individuals develop symptoms in adulthood, but onset varies
    substantially between subtypes and families and can occur in adolescence.
    Progression is usually slow, particularly in SCA5, SCA11, SCA26, SCA30, and
    SCA31.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The onset of symptoms typically occurs in adulthood; however, a minority
      of patients develop clinical features in adolescence.
    explanation: This supports the predominantly adult but variable age at onset.
- phase: Progressive mobility and bulbar complications
  age_range: Symptomatic disease course
  notes: >-
    Increasing gait instability can lead to falls and loss of independent
    ambulation. Dysarthria and dysphagia can add communication, aspiration, and
    nutrition burdens even though the canonical disorders are not usually
    rapidly fatal.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although not fatal, ADCA Type III may cause dysphagia and falls, which
      reduce the quality of life of the patients and may in turn shorten the
      lifespan.
    explanation: The review identifies dysphagia and falls as important later complications.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden varies with subtype, age at onset, and disease duration. Many
    canonical ADCA-III disorders progress slowly and life span can be normal,
    but chronic gait disability, falls, dysarthria, dysphagia, and eventual need
    for mobility aids can impose substantial long-term functional burden.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The severity of symptoms and age of onset can vary between each SCA
      subtype and even between families with the same subtype.
    explanation: The defining review directly supports variable severity within the class.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The canonical ADCA-III subtypes segregate in an autosomal dominant pattern.
    Recurrence risk and penetrance must be interpreted at the molecular-subtype
    and allele level; SCA30 remains a linkage-defined disorder without a
    molecular diagnostic variant.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADCA Type III consists of six subtypes, SCA5, SCA6, SCA11, SCA26, SCA30,
      and SCA31.
    explanation: The review defines these six autosomal dominant disorders as the ADCA-III class.
has_subtypes:
- name: SCA5
  display_name: Spinocerebellar ataxia type 5 (SPTBN2)
  description: >-
    A usually slowly progressive, predominantly cerebellar ataxia caused by
    heterozygous missense or in-frame deletion variants in SPTBN2, encoding
    beta-III spectrin. Onset ranges from childhood to late adulthood.
  evidence:
  - reference: PMID:21827906
    reference_title: Spinocerebellar ataxia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ikeda et al. (2006) discovered that β-III spectrin (SPTBN2) mutations
      cause spinocerebellar ataxia type 5 (SCA5) in the American kindred and
      two additional independently reported SCA5 families.
    explanation: This establishes SPTBN2-associated SCA5 as a molecular subtype.
- name: SCA6
  display_name: Spinocerebellar ataxia type 6 (CACNA1A CAG expansion)
  description: >-
    A late-onset, usually slowly progressive pure cerebellar ataxia caused by a
    small CAG repeat expansion in the final exon of CACNA1A. Pathogenic alleles
    generally contain 19-33 repeats, compared with 4-18 in normal alleles.
  evidence:
  - reference: PMID:29427102
    reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Normal alleles have 4-18 repeats, while alleles causing disease contain
      19-33 repeats.
    explanation: The SCA6 review defines the pathogenic repeat range.
- name: SCA11
  display_name: Spinocerebellar ataxia type 11 (TTBK2)
  description: >-
    A rare, predominantly cerebellar ataxia caused by heterozygous truncating
    TTBK2 variants. Abnormal pursuit and nystagmus are characteristic; pyramidal
    signs can occur, while peripheral neuropathy and dystonia are rare.
  evidence:
  - reference: PMID:20301723
    reference_title: Spinocerebellar Ataxia Type 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 11 (SCA11) is characterized by progressive
      cerebellar ataxia and abnormal eye signs (jerky pursuit, horizontal and
      vertical nystagmus).
    explanation: GeneReviews defines the predominantly cerebellar SCA11 phenotype.
- name: SCA26
  display_name: Spinocerebellar ataxia type 26 (EEF2)
  description: >-
    A very rare, slowly progressive pure cerebellar ataxia described in a
    six-generation kindred. A segregating EEF2 p.Pro596His variant is the
    compelling causal candidate and impairs translational fidelity in functional
    models; independent human families with the same adult-onset SCA26 mechanism
    remain limited.
  evidence:
  - reference: PMID:15732118
    reference_title: Spinocerebellar ataxia type 26 maps to chromosome 19p13.3 adjacent to SCA6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected family members had a slowly progressive cerebellar ataxia,
      with an age of onset range from 26 to 60 years.
    explanation: The original linkage family establishes the pure, slowly progressive SCA26 phenotype.
  - reference: PMID:23001565
    reference_title: A conserved eEF2 coding variant in SCA26 leads to loss of translational fidelity and increased susceptibility to proteostatic insult.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a single variant that co-segregates with the disease
      phenotype that produces a single amino acid substitution in eukaryotic
      elongation factor 2.
    explanation: The EEF2 variant cosegregates in the original family, but replication remains limited.
- name: SCA30
  display_name: Spinocerebellar ataxia type 30 (4q34.3-q35.1 locus)
  description: >-
    A linkage-defined, relatively pure, slowly progressive adult-onset
    cerebellar ataxia reported in one Australian family. The locus maps to
    chromosome 4q34.3-q35.1; an established causal gene has not been identified.
  evidence:
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis excluded currently known SCAs and identified a logarithm
      (base 10) of odds score of 3.0 at chromosome 4q34.3-q35.1, distinct from
      all previously reported loci.
    explanation: This establishes the SCA30 locus in the defining family.
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The responsible gene is yet to be determined, but ODZ3 is a plausible
      candidate.
    explanation: The original report explicitly leaves the causal gene unresolved.
- name: SCA31
  display_name: Spinocerebellar ataxia type 31 (BEAN1/TK2 repeat locus)
  description: >-
    A predominantly Japanese, adult-onset pure cerebellar ataxia caused by a
    complex intronic pentanucleotide insertion containing a long (TGGAA)n tract
    in the oppositely transcribed BEAN1/TK2 region.
  evidence:
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 31 (SCA31) is an adult-onset
      autosomal-dominant neurodegenerative disorder showing progressive
      cerebellar ataxia mainly affecting Purkinje cells.
    explanation: The original genetic study defines SCA31 as an adult-onset dominant pure cerebellar ataxia.
pathophysiology:
- name: SPTBN2-Dependent Postsynaptic Organization Defect
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In SCA5, mutant beta-III spectrin disrupts organization of the Purkinje-cell
    dendritic membrane. Beta-III spectrin normally stabilizes and positions
    postsynaptic proteins including EAAT4 and mGluR1alpha. Mutant SPTBN2 causes
    mGluR1alpha mislocalization, reduced mGluR1 signaling, and impaired synaptic
    plasticity, creating a cell-selective route to cerebellar dysfunction.
  genes:
  - preferred_term: SPTBN2
    term:
      id: hgnc:11276
      label: SPTBN2
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: cytoskeleton organization
    term:
      id: GO:0007010
      label: cytoskeleton organization
    modifier: DYSREGULATED
  - preferred_term: modulation of chemical synaptic transmission
    term:
      id: GO:0050804
      label: modulation of chemical synaptic transmission
    modifier: DYSREGULATED
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Purkinje Cell Dysfunction and Predominant Cerebellar Atrophy
    causal_link_type: DIRECT
    description: >-
      Postsynaptic receptor and transporter mislocalization impairs Purkinje-cell
      signaling and precedes progressive cerebellar degeneration.
    evidence:
    - reference: PMID:25057192
      reference_title: Mutant β-III spectrin causes mGluR1α mislocalization and functional deficits in a mouse model of spinocerebellar ataxia type 5.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We have developed a mouse model to understand the mechanistic basis for
        this disease and show that expression of mutant but not wild-type β-III
        spectrin causes progressive motor deficits and cerebellar degeneration.
      explanation: The SCA5 mouse model connects mutant spectrin to cerebellar degeneration.
  evidence:
  - reference: PMID:25057192
    reference_title: Mutant β-III spectrin causes mGluR1α mislocalization and functional deficits in a mouse model of spinocerebellar ataxia type 5.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that mutant β-III spectrin causes mislocalization
      and dysfunction of mGluR1α at dendritic spines and connects SCA5 with
      other disorders involving glutamatergic dysfunction and synaptic
      plasticity abnormalities.
    explanation: This directly supports the postsynaptic-organization mechanism.
- name: CACNA1A Polyglutamine Proteotoxicity and ER-Stress Decompensation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The SCA6 CAG expansion lengthens a polyglutamine tract in the C-terminal
    region encoded by CACNA1A. Mutant Cav2.1 accumulates in Purkinje cells and
    produces cytoplasmic aggregates. Current knock-in evidence supports
    misfolded-protein/ER stress, an initially protective HSP90-dependent
    unfolded-protein response, and age-related loss of that compensation,
    followed by store-operated calcium current and Purkinje-cell membrane
    hyperexcitability. The contribution of altered intrinsic Cav2.1 ion flux
    remains debated and is not modeled as a directional loss of calcium
    transport.
  genes:
  - preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: DYSREGULATED
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Purkinje Cell Dysfunction and Predominant Cerebellar Atrophy
    causal_link_type: DIRECT
    description: >-
      Age-dependent failure of proteostatic compensation permits aberrant
      Purkinje-cell firing and progressive motor dysfunction.
    evidence:
    - reference: PMID:40990218
      reference_title: Resilience to Endoplasmic Reticulum Stress Mitigates Membrane Hyperexcitability Underlying Late Disease Onset in a Murine Model of SCA6.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our studies support a model whereby proteotoxicity from misfolded mutant
        Cav2.1 is mitigated by a HSP90-dependent UPR, and age-related breakdown
        of this response causes motor dysfunction and aberrant Purkinje neuron
        spiking.
      explanation: The current age-series model directly links proteotoxicity and UPR failure to Purkinje dysfunction.
  evidence:
  - reference: PMID:10369863
    reference_title: Abundant expression and cytoplasmic aggregations of [alpha]1A voltage-dependent calcium channel protein associated with neurodegeneration in spinocerebellar ataxia type 6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCA6 brains, numerous oval or rod-shaped aggregates were seen
      exclusively in the cytoplasm of Purkinje cells.
    explanation: Human neuropathology demonstrates mutant-channel aggregation in the selectively vulnerable cell.
  - reference: PMID:18687887
    reference_title: Spinocerebellar ataxia type 6 knockin mice develop a progressive neuronal dysfunction with age-dependent accumulation of mutant CaV2.1 channels.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The pathogenesis of SCA6 is apparently linked to an age-dependent process
      accompanied by accumulation of mutant Ca(V)2.1 channels.
    explanation: Knock-in data support age-dependent mutant Cav2.1 accumulation rather than a simple channel-density defect.
  - reference: PMID:40990218
    reference_title: Resilience to Endoplasmic Reticulum Stress Mitigates Membrane Hyperexcitability Underlying Late Disease Onset in a Murine Model of SCA6.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Novel activation of a store-operated calcium current due to ER stress is
      the cause for Purkinje neuron spiking abnormalities in SCA6 mice.
    explanation: This supports ER-stress-linked membrane hyperexcitability in the current model.
- name: TTBK2 Dominant-Negative Ciliary Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    SCA11-associated frameshift variants truncate TTBK2 after its kinase domain.
    In knock-in and allelic-series experiments, the truncated protein
    interferes with full-length TTBK2, decreases cilium formation and stability,
    and disrupts cilium-dependent Sonic hedgehog signaling. This provides a
    strong model-system mechanism, although the exact adult human
    Purkinje-neuron path from ciliary failure to degeneration remains incomplete.

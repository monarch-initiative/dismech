    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cilia number and stability
    - Impaired cilium-dependent Sonic hedgehog signaling
    description: >-
      Ciliary assembly and signaling defects provide a model-supported route
      from truncated TTBK2 to Purkinje-neuron vulnerability.
    evidence:
    - reference: PMID:30532139
      reference_title: Spinocerebellar ataxia type 11-associated alleles of Ttbk2 dominantly interfere with ciliogenesis and cilium stability.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These studies provide a molecular foundation to understand the cellular
        and molecular pathogenesis of human SCA11, and help account for the link
        between ciliary dysfunction and neurodegenerative diseases.
      explanation: The edge is partial because the study establishes the ciliary mechanism in models rather than the complete human degenerative chain.
  evidence:
  - reference: PMID:30532139
    reference_title: Spinocerebellar ataxia type 11-associated alleles of Ttbk2 dominantly interfere with ciliogenesis and cilium stability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this work, we present evidence that SCA11-associated mutations are
      dominant negative alleles and that the resulting truncated protein
      (TTBK2SCA11) interferes with the function of full length TTBK2 in
      mediating ciliogenesis.
    explanation: This directly supports dominant-negative disruption of ciliogenesis.
- name: EEF2 Translational-Fidelity and Proteostasis Defect
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In the original SCA26 pedigree, the segregating EEF2 p.Pro596His substitution
    affects a conserved domain required to maintain the reading frame during
    translation. The yeast-equivalent variant increases programmed -1 ribosomal
    frameshift read-through and sensitizes cells to unfolded-protein stress.
    Because evidence is centered on one family and functional model systems,
    this mechanism remains provisional pending independent human replication.

epidemiology:
- name: Unknown overall incidence with subtype- and population-specific distribution
  description: >-
    The incidence of the ADCA-III class is unknown. SCA6 is the most commonly
    recognized canonical subtype in many tested populations, while SCA31 has a
    strong founder effect in Japan. The other canonical subtypes are rare or
    confined to very few reported families, so a single prevalence estimate
    would be misleading.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of ADCA Type III is unknown.
    explanation: The disease-defining review states that overall incidence is unknown.
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The subtype SCA6 is the most common.
    explanation: The review identifies SCA6 as the most common canonical ADCA-III subtype.
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SCA31 critical region was tracked down to a 900 kb interval in
      chromosome 16q22.1, where the disease shows a strong founder effect.
    explanation: The original SCA31 study documents its strong founder effect.
progression:
- phase: Predominantly adult-onset progressive cerebellar syndrome
  age_range: Adolescence through late adulthood
  notes: >-
    Most affected individuals develop symptoms in adulthood, but onset varies
    substantially between subtypes and families and can occur in adolescence.
    Progression is usually slow, particularly in SCA5, SCA11, SCA26, SCA30, and
    SCA31.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The onset of symptoms typically occurs in adulthood; however, a minority
      of patients develop clinical features in adolescence.
    explanation: This supports the predominantly adult but variable age at onset.
- phase: Progressive mobility and bulbar complications
  age_range: Symptomatic disease course
  notes: >-
    Increasing gait instability can lead to falls and loss of independent
    ambulation. Dysarthria and dysphagia can add communication, aspiration, and
    nutrition burdens even though the canonical disorders are not usually
    rapidly fatal.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although not fatal, ADCA Type III may cause dysphagia and falls, which
      reduce the quality of life of the patients and may in turn shorten the
      lifespan.
    explanation: The review identifies dysphagia and falls as important later complications.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden varies with subtype, age at onset, and disease duration. Many
    canonical ADCA-III disorders progress slowly and life span can be normal,
    but chronic gait disability, falls, dysarthria, dysphagia, and eventual need
    for mobility aids can impose substantial long-term functional burden.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The severity of symptoms and age of onset can vary between each SCA
      subtype and even between families with the same subtype.
    explanation: The defining review directly supports variable severity within the class.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The canonical ADCA-III subtypes segregate in an autosomal dominant pattern.
    Recurrence risk and penetrance must be interpreted at the molecular-subtype
    and allele level; SCA30 remains a linkage-defined disorder without a
    molecular diagnostic variant.
  evidence:
  - reference: PMID:23331413
    reference_title: "Autosomal dominant cerebellar ataxia type III: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADCA Type III consists of six subtypes, SCA5, SCA6, SCA11, SCA26, SCA30,
      and SCA31.
    explanation: The review defines these six autosomal dominant disorders as the ADCA-III class.
has_subtypes:
- name: SCA5
  display_name: Spinocerebellar ataxia type 5 (SPTBN2)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 5
    term:
      id: MONDO:0010848
      label: spinocerebellar ataxia type 5
  description: >-
    A usually slowly progressive, predominantly cerebellar ataxia caused by
    heterozygous missense or in-frame deletion variants in SPTBN2, encoding
    beta-III spectrin. Onset ranges from childhood to late adulthood.
  genes:
  - preferred_term: SPTBN2
    term:
      id: hgnc:11276
      label: SPTBN2
  evidence:
  - reference: PMID:21827906
    reference_title: Spinocerebellar ataxia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ikeda et al. (2006) discovered that β-III spectrin (SPTBN2) mutations
      cause spinocerebellar ataxia type 5 (SCA5) in the American kindred and
      two additional independently reported SCA5 families.
    explanation: This establishes SPTBN2-associated SCA5 as a molecular subtype.
- name: SCA6
  display_name: Spinocerebellar ataxia type 6 (CACNA1A CAG expansion)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 6
    term:
      id: MONDO:0008457
      label: spinocerebellar ataxia type 6
  description: >-
    A late-onset, usually slowly progressive pure cerebellar ataxia caused by a
    small CAG repeat expansion in the final exon of CACNA1A. Pathogenic alleles
    generally contain 19-33 repeats, compared with 4-18 in normal alleles.
  genes:
  - preferred_term: CACNA1A
    term:
      id: hgnc:1388
      label: CACNA1A
  evidence:
  - reference: PMID:29427102
    reference_title: "Spinocerebellar [corrected] Ataxia Type 6: Molecular Mechanisms and Calcium Channel Genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Normal alleles have 4-18 repeats, while alleles causing disease contain
      19-33 repeats.
    explanation: The SCA6 review defines the pathogenic repeat range.
- name: SCA11
  display_name: Spinocerebellar ataxia type 11 (TTBK2)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 11
    term:
      id: MONDO:0011464
      label: spinocerebellar ataxia type 11
  description: >-
    A rare, predominantly cerebellar ataxia caused by heterozygous truncating
    TTBK2 variants. Abnormal pursuit and nystagmus are characteristic; pyramidal
    signs can occur, while peripheral neuropathy and dystonia are rare.
  genes:
  - preferred_term: TTBK2
    term:
      id: hgnc:19141
      label: TTBK2
  evidence:
  - reference: PMID:20301723
    reference_title: Spinocerebellar Ataxia Type 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 11 (SCA11) is characterized by progressive
      cerebellar ataxia and abnormal eye signs (jerky pursuit, horizontal and
      vertical nystagmus).
    explanation: GeneReviews defines the predominantly cerebellar SCA11 phenotype.
- name: SCA26
  display_name: Spinocerebellar ataxia type 26 (EEF2)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 26
    term:
      id: MONDO:0012246
      label: spinocerebellar ataxia type 26
  description: >-
    A very rare, slowly progressive pure cerebellar ataxia described in a
    six-generation kindred. A segregating EEF2 p.Pro596His variant is the
    compelling causal candidate and impairs translational fidelity in functional
    models; independent human families with the same adult-onset SCA26 mechanism
    remain limited.
  genes:
  - preferred_term: EEF2
    term:
      id: hgnc:3214
      label: EEF2
  evidence:
  - reference: PMID:15732118
    reference_title: Spinocerebellar ataxia type 26 maps to chromosome 19p13.3 adjacent to SCA6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected family members had a slowly progressive cerebellar ataxia,
      with an age of onset range from 26 to 60 years.
    explanation: The original linkage family establishes the pure, slowly progressive SCA26 phenotype.
  - reference: PMID:23001565
    reference_title: A conserved eEF2 coding variant in SCA26 leads to loss of translational fidelity and increased susceptibility to proteostatic insult.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a single variant that co-segregates with the disease
      phenotype that produces a single amino acid substitution in eukaryotic
      elongation factor 2.
    explanation: The EEF2 variant cosegregates in the original family, but replication remains limited.
- name: SCA30
  display_name: Spinocerebellar ataxia type 30 (4q34.3-q35.1 locus)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 30
    term:
      id: MONDO:0013241
      label: spinocerebellar ataxia type 30
  description: >-
    A linkage-defined, relatively pure, slowly progressive adult-onset
    cerebellar ataxia reported in one Australian family. The locus maps to
    chromosome 4q34.3-q35.1; an established causal gene has not been identified.
  evidence:
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage analysis excluded currently known SCAs and identified a logarithm
      (base 10) of odds score of 3.0 at chromosome 4q34.3-q35.1, distinct from
      all previously reported loci.
    explanation: This establishes the SCA30 locus in the defining family.
  - reference: PMID:18996908
    reference_title: A new dominantly inherited pure cerebellar ataxia, SCA 30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The responsible gene is yet to be determined, but ODZ3 is a plausible
      candidate.
    explanation: The original report explicitly leaves the causal gene unresolved.
- name: SCA31
  display_name: Spinocerebellar ataxia type 31 (BEAN1/TK2 repeat locus)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 31
    term:
      id: MONDO:0007296
      label: spinocerebellar ataxia type 31
  description: >-
    A predominantly Japanese, adult-onset pure cerebellar ataxia caused by a
    complex intronic pentanucleotide insertion containing a long (TGGAA)n tract
    in the oppositely transcribed BEAN1/TK2 region.
  genes:
  - preferred_term: BEAN1
    term:
      id: hgnc:24160
      label: BEAN1
  evidence:
  - reference: PMID:19878914
    reference_title: Spinocerebellar ataxia type 31 is associated with "inserted" penta-nucleotide repeats containing (TGGAA)n.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 31 (SCA31) is an adult-onset
      autosomal-dominant neurodegenerative disorder showing progressive
      cerebellar ataxia mainly affecting Purkinje cells.
    explanation: The original genetic study defines SCA31 as an adult-onset dominant pure cerebellar ataxia.
- name: SCA38
  display_name: Spinocerebellar ataxia type 38 (ELOVL5)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 38
    term:
      id: MONDO:0014417
      label: spinocerebellar ataxia type 38
  description: >-
    A slowly progressive, predominantly cerebellar ataxia of fourth-decade onset
    caused by heterozygous missense variants in ELOVL5, a fatty-acid elongase
    highly expressed in Purkinje cells. This is a conventional missense
    mechanism, not a repeat expansion. Nystagmus and gait ataxia are the
    presenting features, with pes cavus and hyposmia as characteristic
    accompanying signs and imaging showing cerebellar atrophy that spares the
    cerebral cortex. GeneReviews describes SCA38 as a pure cerebellar ataxia; a
    sensory and motor axonal polyneuropathy emerges with progression, which
    Harding's predominantly cerebellar class explicitly accommodates.
  genes:
  - preferred_term: ELOVL5
    term:
      id: hgnc:21308
      label: ELOVL5
  evidence:
  - reference: PMID:25065913
    reference_title: ELOVL5 mutations cause spinocerebellar ataxia 38.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped SCA38 to a 56 Mb region on chromosome 6p in a SCA-affected Italian family by whole-genome linkage analysis.
    explanation: Establishes the chromosome 6p SCA38 locus in the index Italian family, the mapping step that led
      to ELOVL5.
  - reference: PMID:27143115
    reference_title: Clinical and neuroradiological features of spinocerebellar ataxia 38 (SCA38).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We extended our clinical and brain neuroimaging data on SCA38 including 21 cases from three Italian families. All had the ELOVL5 c.689G > T (p.Gly230Val) missense mutation.
    explanation: Names the recurrent ELOVL5 allele and the number of characterised carriers.
  - reference: PMID:25065913
    reference_title: ELOVL5 mutations cause spinocerebellar ataxia 38.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation screening of 456 independent SCA-affected individuals identified the same mutation in two further unrelated Italian families.
    explanation: Records the independent families carrying the same allele, which is the replication behind this
      subtype.
  - reference: PMID:27143115
    reference_title: Clinical and neuroradiological features of spinocerebellar ataxia 38 (SCA38).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain imaging documented cerebellar atrophy with sparing of cerebral cortex and no white matter disease.
    explanation: Supports placing SCA38 in the predominantly cerebellar ADCA-III class rather than in a multisystem
      class.
  - reference: PMID:31294938
    reference_title: Spinocerebellar Ataxia Type 38.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 38 (SCA38) is characterized as a pure cerebellar ataxia with symptoms typically manifesting in the fourth decade of life.
    explanation: The GeneReviews chapter's own phenotype statement, which is the baseline for placing SCA38 in the
      pure cerebellar ADCA-III class.
  - reference: PMID:31294938
    reference_title: Spinocerebellar Ataxia Type 38.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA38 is established in a proband with progressive gait ataxia and a heterozygous pathogenic variant in ELOVL5 identified by molecular genetic testing.
    explanation: GeneReviews states the heterozygous ELOVL5 variant as the diagnostic criterion for this subtype.
- name: SCA41
  display_name: Spinocerebellar ataxia type 41 (TRPC3)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 41
    term:
      id: MONDO:0014626
      label: spinocerebellar ataxia type 41
  description: >-
    A cerebellar ataxia attributed to heterozygous missense variants in TRPC3,
    which encodes a non-selective cation channel of Purkinje cell signalling.
    The evidence base is the weakest of the ADCA-III roster: a single de novo
    case described in a 2015 Movement Disorders letter whose own title poses the
    gene-disease relationship as a question, and one further unrelated patient
    reported in 2026 with a different missense allele. A candidate screen of 98
    genetically undefined late-onset cerebellar ataxias and 10 episodic ataxias
    found no causative TRPC3 variant, and the ClinGen Gene-Disease Validity
    download of 2026-09-25 contains no TRPC3 assertion. The subtype is recorded
    here because MONDO asserts it, with its limited support stated rather than
    smoothed over.
  genes:
  - preferred_term: TRPC3
    term:
      id: hgnc:12335
      label: TRPC3
  evidence:
  - reference: PMID:41530546
    reference_title: A case report of spinocerebellar ataxia with TRPC3 gene mutation and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report of SCA41 caused by the c.1955A>G variant in the TRPC3 gene, which expands the mutation spectrum of the TRPC3 gene.
    explanation: Adds a second, unrelated human patient with a distinct TRPC3 missense allele.
  - reference: PMID:21321808
    reference_title: Candidate screening of the TRPC3 gene in cerebellar ataxia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that mutations in TRPC3 do not significantly contribute to the cause of late-onset and episodic human cerebellar ataxias.
    explanation: A candidate screen that found no causative TRPC3 variant; it argues against TRPC3 being a common
      cause, and is recorded here because it bounds how much this subtype can be relied on.
- name: SCA42
  display_name: Spinocerebellar ataxia type 42 (CACNA1G)
  subtype_term:
    preferred_term: spinocerebellar ataxia type 42
    term:
      id: MONDO:0014776
      label: spinocerebellar ataxia type 42
  description: >-
    A dominantly inherited, usually predominantly cerebellar ataxia caused by
    heterozygous missense variants in CACNA1G, the pore-forming subunit of the
    low-voltage-activated T-type calcium channel Cav3.1. The recurrent
    p.Arg1715His allele was reported independently in French and Japanese
    families in 2015 and sits in the voltage sensor of repeat IV; this is a
    conventional missense channelopathy mechanism, not a repeat expansion. Mild
    pyramidal signs and resting tremor occur in some families, which is within
    Harding's predominantly cerebellar class. The separate severe de novo
    presentation that MONDO carries as MONDO:0060758 (SCA42ND) is lumped into
    this row following ClinGen's own lumping ruling for CACNA1G rather than
    curated as a second subtype.
  genes:
  - preferred_term: CACNA1G
    term:
      id: hgnc:1394
      label: CACNA1G
  evidence:
  - reference: PMID:26456284
    reference_title: A Recurrent Mutation in CACNA1G Alters Cav3.1 T-Type Calcium-Channel Conduction and Causes Autosomal-Dominant Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large family affected by ADCA and mild pyramidal signs, we searched for the causative variant by combining linkage analysis and whole-exome sequencing.
    explanation: Identifies the phenotype in which the CACNA1G allele was found as dominant cerebellar ataxia with
      mild pyramidal signs, the ADCA-III phenotype class.
  - reference: PMID:26715324
    reference_title: A mutation in the low voltage-gated calcium channel CACNA1G alters the physiological properties of the channel, causing spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we analyzed a Japanese family with autosomal dominant SCA using linkage analysis and exome sequencing, and identified CACNA1G, which encodes the calcium channel CaV3.1, as a new causative gene.
    explanation: Independent identification of CACNA1G in a second population, which is the replication behind
      this subtype.
  - reference: PMID:26715324
    reference_title: A mutation in the low voltage-gated calcium channel CACNA1G alters the physiological properties of the channel, causing spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most patients exhibited the pure form of cerebellar ataxia, two patients showed prominent resting tremor in addition to ataxia.
    explanation: Supports a predominantly cerebellar phenotype with occasional extra features, consistent with
      ADCA-III placement.
- name: SCA45
  display_name: Spinocerebellar ataxia 45 (FAT2)
  subtype_term:
    preferred_term: spinocerebellar ataxia 45
    term:
      id: MONDO:0033480
      label: spinocerebellar ataxia 45
  description: >-
    A late-onset, pure cerebellar ataxia caused by heterozygous missense variants
    in FAT2, an atypical cadherin expressed in cerebellar granule cells. It was
    identified in a 2017 exome and network study of genetically undiagnosed
    dominant ataxia families, which placed FAT2 among several genes converging on
    synaptic transmission; further families have since been reported but remain
    few, and the ClinGen Gene-Disease Validity download of 2026-09-25 contains no
    FAT2 assertion.
  genes:
  - preferred_term: FAT2
    term:
      id: hgnc:3596
      label: FAT2
  evidence:
  - reference: PMID:29053796
    reference_title: Exome sequencing and network analysis identifies shared mechanisms underlying spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report five novel spinocerebellar ataxia genes, FAT2, PLD3, KIF26B, EP300, and FAT1, identified through a combination of exome sequencing in genetically undiagnosed families and targeted resequencing of exome candidates in a cohort of singletons.
    explanation: The study that first reported FAT2 as a dominant spinocerebellar ataxia gene, the concept MONDO
      curates as SCA45.
  - reference: PMID:42525356
    reference_title: "FAT2-associated early-onset cerebellar ataxia: report of novel phenotype and variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      SCA45/FAT2-associated late-onset cerebellar ataxia was reported in 2017 in 2 families with pure cerebellar syndrome with age of onset after 40 years of age. Similar few families with SCA45 have been reported so far.
    explanation: States the pure cerebellar, late-onset character of SCA45 and how thin the replication remains;

    cells, whose axons form the parallel fibres that synapse onto Purkinje cells.
    It binds Cbln1, a secreted organiser of Purkinje-cell synapse formation, and
    removing Fat2 in mice weakens parallel fibre synaptic strength and impairs
    motor behaviour. The node therefore places the FAT2 lesion at the granule
    cell to Purkinje cell synapse rather than inside the Purkinje cell itself.

- name: Impaired Mitochondrial Iron-Sulfur Cluster Assembly
  description: >-
    FDX2 supplies electrons for de novo [2Fe-2S] cluster synthesis on the
    ISCU2 scaffold and again for reductive fusion of [2Fe-2S] clusters into
    [4Fe-4S] clusters on ISCA1-ISCA2-IBA57. Partial FDX2 deficiency therefore
    lowers maturation of both [2Fe-2S] and [4Fe-4S] mitochondrial proteins.
    Cell-culture knockdown studies agree that FDX2 is required for Fe-S
    protein biogenesis; whether FDX1 also contributes is debated, which may
    bear on how much residual Fe-S assembly patient tissues retain.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  - preferred_term: '[2Fe-2S] cluster assembly'
    term:

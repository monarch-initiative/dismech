      label: '[2Fe-2S] cluster assembly'
    modifier: DECREASED
  - preferred_term: '[4Fe-4S] cluster assembly'
    term:
      id: GO:0044572
      label: '[4Fe-4S] cluster assembly'
    modifier: DECREASED
  evidence:
  - reference: PMID:20547883
    reference_title: "Humans possess two mitochondrial ferredoxins, Fdx1 and Fdx2, with distinct roles in steroidogenesis, heme, and Fe/S cluster biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified a Fdx1-related mitochondrial protein, designated ferredoxin 2 (Fdx2) and found it to be essential for heme A and Fe/S protein biosynthesis"
    explanation: RNAi depletion in human cells shows FDX2 is required for Fe-S protein biogenesis.
  - reference: PMID:36280795
    reference_title: "Functional spectrum and specificity of mitochondrial ferredoxins FDX1 and FDX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that only FDX2, but not FDX1, is involved in Fe-S protein maturation."
    explanation: Assigns Fe-S protein maturation specifically to FDX2.
  - reference: PMID:32817474
    reference_title: "Mitochondrial [4Fe-4S] protein assembly involves reductive [2Fe-2S] cluster fusion on ISCA1-ISCA2 by electron flow from ferredoxin FDX2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "yet surprisingly also depended on mitochondrial ferredoxin FDX2 and its NADPH-coupled reductase FDXR"
    explanation: Reconstituted maturation of [4Fe-4S] aconitase required FDX2, placing it in the [4Fe-4S] cluster-forming step as well as in [2Fe-2S] synthesis.
  - reference: PMID:22101253

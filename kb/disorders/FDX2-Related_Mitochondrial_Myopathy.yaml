    accumulation; fibroblasts may not show the muscle defect.
  diagnosis_term:
    preferred_term: Muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:30010796
    reference_title: "A novel complex neurological phenotype due to a homozygous mutation in FDX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy demonstrated an unusual pattern of regional succinate dehydrogenase and cytochrome c oxidase deficiency with iron accumulation."
    explanation: Characteristic biopsy finding.
  - reference: PMID:28803783
    reference_title: "Impact of mutations within the [Fe-S] cluster or the lipoic acid biosynthesis pathways on mitochondrial protein expression profiles in fibroblasts from patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that the fibroblast is a good cellular model to study these deficiencies, except for patients presenting mutations in FDX1L and a muscular clinical phenotype."
    explanation: Fibroblast studies can miss the defect in FDX2 myopathy, so muscle is the preferred tissue.
differential_diagnoses:
- name: ISCU myopathy
  disease_term:
    preferred_term: ISCU myopathy
    term:
      id: MONDO:0009706
      label: hereditary myopathy with lactic acidosis due to ISCU deficiency
  description: >-
    Recessive ISCU deficiency produces the same picture of exercise
    intolerance, recurrent rhabdomyolysis and lactic acidosis with Fe-S enzyme
    deficiency in muscle. In a direct comparison the FDX2 patient was more
    severely affected, while iron accumulated in ISCU-deficient but not in
    FDX2-deficient muscle. Genetic testing separates them.
  evidence:
  - reference: PMID:35079622
    reference_title: "FDX2 and ISCU Gene Variations Lead to Rhabdomyolysis With Distinct Severity and Iron Regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that FDX2 and ISCU variants result in a similar muscle phenotype, that differ in severity and skeletal muscle iron accumulation."
    explanation: Head-to-head comparison of the two disorders.
- name: FDXR-related auditory neuropathy and optic atrophy
  disease_term:
    preferred_term: auditory neuropathy-optic atrophy syndrome
    term:
      id: MONDO:0060582
      label: auditory neuropathy-optic atrophy syndrome
  description: >-
    Biallelic variants in FDXR, the reductase that supplies electrons to FDX2,
    cause optic atrophy with auditory neuropathy and mitochondrial iron
    overload. Auditory neuropathy has not been reported in FDX2 deficiency.
  evidence:
  - reference: PMID:28965846
    reference_title: "FDXR Mutations Cause Sensorial Neuropathies and Expand the Spectrum of Mitochondrial Fe-S-Synthesis Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on eight subjects from four independent families affected by auditory neuropathy and optic atrophy. Whole-exome sequencing revealed biallelic mutations in FDXR in affected subjects of each family."
    explanation: Defines the FDXR phenotype that overlaps the optic atrophy of the p.Pro144Leu families.

notes: >-
  Entity and gene. MONDO:0020714 is equivalent to OMIM:251900 and has no
  descendants in MONDO; its parents are MONDO:0009637 (inborn mitochondrial
  myopathy) and MONDO:0017338 (fatal multiple mitochondrial dysfunctions
  syndrome). FDX2 is HGNC:30546 (ferredoxin 2, 19p13.2, previous symbol FDX1L,
  UniProt Q6P4F2); the founding paper (PMID:24281368) uses the old symbol
  FDX1L throughout. The disease is curated as one entry: a single gene, a
  single recessive mode, and one mechanism (loss of FDX2 electron supply to
  Fe-S cluster assembly) shared by every allele. The muscle-restricted and
  multisystem presentations are described in the phenotype descriptions rather
  than as subtypes, because they rest on about a dozen patients and no ontology
  or clinical source names them as separate entities.

  Variant nomenclature. Two FDX2 transcripts that differ by three N-terminal
  codons are used in the literature, so start-codon region variants are written
  c.1A>T (p.Met1?) in some reports and c.10A>T (p.Met4Leu) or c.12G>T
  (p.Met4Ile) in others, and the Brazilian missense allele is written c.431C>T
  (p.P144L) in the original report and c.422C>T (p.Pro141Leu) on
  NM_001397406.1 in the 2024 case comparison. Variants are recorded below as
  each source writes them.

  Features not modelled as phenotypes. Compensated hypothyroidism and diabetes
  mellitus are tabulated for some members of the two p.Pro144Leu families in
  the 2024 case comparison (PMID:38444577, Table 1) and appear as very rare
  features in the HPO annotation of OMIM:251900. They are not curated as
  phenotypes because the primary report's abstract does not mention them and
  no mechanism links them to FDX2 deficiency. Microcytic anaemia and
  neutropenia, from the same table, are curated with the review as source. A
  single 2025 patient (PMID:41372147) with a splice-region allele had
  cerebellar hypoplasia progressing to atrophy, ataxia, pyramidal signs and
  foveal hypoplasia without rhabdomyolysis; the cerebellar findings are
  curated and flagged as single-patient observations.

  Lipoylation is contested. FDX2 is required to mature lipoyl synthase (LIAS),
  a [4Fe-4S] enzyme, yet PDH-E2 and 2-ketoglutarate dehydrogenase-E2
  lipoylation was normal in fibroblasts and myoblasts from a start-codon
  patient (PMID:35079622), while fibroblasts from the 2025 splice-variant
  patient showed reduced lipoylation (PMID:41372147). In vitro work places the
  electron supply of lipoyl synthase on FDX1 rather than FDX2 (PMID:36280795).
  The lipoate-dependent dehydrogenase node below carries both directions of
  evidence.

  Module conformance was considered and not declared. complex_i_deficiency
  models isolated complex I deficiency, whereas FDX2 deficiency is a combined
  complex I to III and aconitase defect upstream of any one complex, and
  mitochondrial_dysfunction models age-associated decline.

  No GeneReviews chapter exists for this disorder.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for FDX2
    variants, and heterozygous parents and siblings are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24281368
    reference_title: "Deleterious mutation in FDX1L gene is associated with a novel mitochondrial muscle myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we investigated the genetic cause of a patient from a consanguineous family who presented with adolescent onset autosomal recessive mitochondrial myopathy"
    explanation: The founding report describes recessive transmission in a consanguineous family.
  - reference: PMID:30010796
    reference_title: "A novel complex neurological phenotype due to a homozygous mutation in FDX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

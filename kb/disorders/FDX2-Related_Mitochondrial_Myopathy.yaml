name: FDX2-Related Mitochondrial Myopathy
creation_date: "2026-10-12T14:48:06Z"
category: Mendelian
synonyms:
- MEOAL
- mitochondrial myopathy, episodic, with optic atrophy and reversible leukoencephalopathy
- episodic mitochondrial myopathy with or without optic atrophy and reversible leukoencephalopathy
- FDX2-related disorder
description: >-
  FDX2-related mitochondrial myopathy (MEOAL; OMIM 251900) is an ultra-rare
  autosomal recessive disorder caused by biallelic variants in FDX2 (formerly
  FDX1L), which encodes mitochondrial ferredoxin 2. FDX2 is the [2Fe-2S]
  ferredoxin that, reduced by NADPH through ferredoxin reductase (FDXR),
  supplies electrons to the mitochondrial iron-sulfur cluster (ISC) assembly
  machinery, both for de novo [2Fe-2S] cluster synthesis on ISCU2 and for the
  later reductive fusion that forms [4Fe-4S] clusters. Every reported allele
  lowers the amount of FDX2 protein or its ability to accept electrons, so the
  disease is a partial loss of Fe-S protein maturation. Its measurable
  consequences are reduced activity of the Fe-S-dependent respiratory chain
  complexes I, II and III and of mitochondrial aconitase, reduced oxygen
  consumption, and in some patients mitochondrial iron accumulation.

  Skeletal muscle is the tissue that fails first and most often. All reported
  patients have a mitochondrial myopathy with exercise intolerance and muscle
  weakness, and most have recurrent, sometimes life-threatening rhabdomyolysis
  with very high creatine kinase and lactic acidosis, provoked by febrile
  illness, fasting, exertion or cold and complicated by acute kidney injury or
  respiratory muscle failure. A second, multisystem presentation was defined in
  two Brazilian families homozygous for p.Pro144Leu: optic atrophy and
  nystagmus by age three, then myopathy with episodic cramps and myalgia,
  sensorimotor axonal neuropathy, and a reversible or partially reversible
  leukoencephalopathy. The authors of a 2024 case comparison note that patients
  carrying a start-codon allele have had muscle-restricted disease, and suggest
  that more severely damaging alleles produce the multisystem form. Around a
  dozen patients have been reported.

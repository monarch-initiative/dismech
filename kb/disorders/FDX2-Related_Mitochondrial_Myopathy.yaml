    reference_title: "Α rare case of myopathy, lactic acidosis, and severe rhabdomyolysis, due to a homozygous mutation of the ferredoxin-2 (FDX2) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

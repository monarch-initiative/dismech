prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been published. A 2025 report counts eleven
    previously reported patients and adds one; a 2024 case comparison counts
    11 patients from 7 families including its own proband. The only allele
    shared between families is p.Pro144Leu in two Brazilian families.
  evidence:
  - reference: PMID:39467201
    reference_title: "Unraveling the molecular determinants of a rare human mitochondrial disorder caused by the P144L mutation of FDX2."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "MEOAL is an ultra‐rare inherited neuromuscular disorder"
    explanation: Characterises the disorder as ultra-rare.
  - reference: PMID:41372147
    reference_title: "A novel mutation in FDX2 provides insights into the pathogenesis of MEOAL mitochondrial neuromuscular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "To date, only eleven MEOAL patients have been reported by the medical literature."
    explanation: Literature case count before the 2025 report.
pathophysiology:
- name: Biallelic FDX2 Variants
  description: >-
    The reported alleles are start-codon region variants that abolish or shift
    translation initiation (in five of the eight reported families), the
    Brazilian missense p.Pro144Leu, a splice-acceptor variant c.146-2A>G found
    in trans with a start-codon allele, and a splice-region variant c.200+4A>G
    that replaces 19 N-terminal residues. All are germline, and all tested
    alleles reduce FDX2 protein abundance or function without abolishing it
    entirely.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FDX2
    term:
      id: hgnc:30546
      label: FDX2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: electron transfer activity
    term:
      id: GO:0009055
      label: electron transfer activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24281368
    reference_title: "Deleterious mutation in FDX1L gene is associated with a novel mitochondrial muscle myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We employed exome sequencing combined with homozygosity mapping to identify a homozygous mutation, c.1A>T, in the FDX1L gene, which encodes the mitochondrial ferredoxin 2 (Fdx2) protein."
    explanation: First disease-causing FDX2 allele, a start-codon variant.
  - reference: PMID:30010796
    reference_title: "A novel complex neurological phenotype due to a homozygous mutation in FDX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype was mapped in both families to the same homozygous missense mutation in FDX2 (c.431C > T, p.P144L)."
    explanation: The recurrent missense allele behind the multisystem presentation.
  - reference: PMID:38444577
    reference_title: "Clinical, biochemical and molecular characterization of a new case with FDX2-related mitochondrial disorder: Potential biomarkers and treatment options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We described a new case harboring compound heterozygous variants in FDX2 who presented with recurrent rhabdomyolysis"
    explanation: Compound heterozygosity is also pathogenic.
  - reference: PMID:41372147
    reference_title: "A novel mutation in FDX2 provides insights into the pathogenesis of MEOAL mitochondrial neuromuscular disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutation alters the splicing of the gene transcript, giving rise to a mutant protein in which 19 N-terminal residues encoded by exon 2 are replaced by 21 different amino acids"
    explanation: A splice-region allele with a defined effect on the transcript and protein.
  downstream:
  - target: Reduced Mitochondrial Ferredoxin 2 Protein
    causal_link_type: DIRECT
    description: >-
      Start-codon, splice and missense alleles all lower the steady-state
      amount of FDX2 protein in patient muscle or fibroblasts.
    evidence:
    - reference: PMID:24281368
      reference_title: "Deleterious mutation in FDX1L gene is associated with a novel mitochondrial muscle myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation disrupts the ATG initiation translation site resulting in severe reduction of Fdx2 content in the patient muscle and fibroblasts mitochondria."
      explanation: The start-codon allele reduces FDX2 protein in muscle and fibroblasts.
    - reference: PMID:30010796
      reference_title: "A novel complex neurological phenotype due to a homozygous mutation in FDX2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "demonstrated normal expression of FDX2 mRNA but severely reduced expression of FDX2 protein in muscle tissue"
      explanation: The p.Pro144Leu allele leaves mRNA intact but lowers protein, implying protein instability.
  - target: Impaired FDXR-to-FDX2 Electron Transfer
    causal_link_type: DIRECT
    description: >-
      The p.Pro144Leu substitution sits in a loop distant from the [2Fe-2S]
      cluster and impairs electron acceptance from FDXR.
    evidence:
    - reference: PMID:39467201

    quote_role: BACKGROUND
    snippet: >-
      In West Africa, Borrelia crocidurae is a common cause of disease in many
      rural populations.
    explanation: >-
      Identifies B. crocidurae as a common cause of human TBRF in rural West
      Africa.
agent_life_cycle:

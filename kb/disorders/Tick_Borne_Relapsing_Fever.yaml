    preferred_term: Borrelia
    term:
      id: NCBITaxon:138
      label: Borrelia
  description: >-
    Borrelia species maintained in Ornithodoros soft-tick cycles cause
    tick-borne relapsing fever after zoonotic spillover into humans.
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Defines TBRF as a zoonosis caused by multiple Borrelia species transmitted

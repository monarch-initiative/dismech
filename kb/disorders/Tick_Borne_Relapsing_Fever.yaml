diagnosis:
- name: Blood-film microscopy
  description: >-
    Relapsing fever is diagnosed by direct visualization of spirochetes on
    stained blood films drawn during febrile peaks, with 16S rRNA PCR for
    confirmation.
  evidence:
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is established by demonstration of spirochetes in stained blood
      films during febrile episodes, and polymerase chain reaction (PCR)
      targeting the 16S rRNA gene may be used for confirmation
    explanation: >-
      Establishes blood-film microscopy during febrile episodes, with 16S rRNA
      PCR confirmation, as the diagnostic method for relapsing fever.
treatments:
- name: Antibiotic therapy
  description: >-
    Relapsing fever is treated with a tetracycline (doxycycline), penicillin, or
    ceftriaxone; the first dose frequently triggers a Jarisch-Herxheimer
    reaction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: penicillin
      term:
        id: CHEBI:17334
        label: penicillin
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Spirochetemic Dissemination
    treatment_effect: INHIBITS
    description: >-
      Bactericidal antibiotics clear spirochetes from the bloodstream, ending
      the bacteremic waves.
  evidence:
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients recovered after antibiotic treatment with ceftriaxone and/or
      doxycycline.
    explanation: >-
      Documents recovery of relapsing-fever patients on ceftriaxone and/or
      doxycycline.
- name: Doxycycline post-exposure prophylaxis
  description: >-
    Selective post-exposure prophylaxis with doxycycline after a soft-tick bite
    prevents tick-borne relapsing fever.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Soft-Tick Borrelia Acquisition
    treatment_effect: INHIBITS
    description: >-
      Post-exposure doxycycline blocks establishment of infection after a
      tick bite.
  evidence:
  - reference: PMID:24107216
    reference_title: "Postexposure prophylaxis of tick-borne relapsing fever: lessons learned from recent outbreaks in Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      its prevention is based on heightened awareness and risk stratification by
      active surveillance of tick bites and selective postexposure prophylaxis
      (PEP) with doxycycline for tick-bitten individuals.
    explanation: >-
      Supports selective post-exposure doxycycline prophylaxis as TBRF
      prevention.
progression:
- phase: Incubation
  notes: Acute onset 2 to 18 days after the soft-tick bite.
- phase: First febrile episode
  notes: A high-fever episode lasting about 3 days during peak spirochetemia.
- phase: Afebrile interval
  notes: >-
    About 5 to 7 days of apparent wellness as IgM clears the dominant serotype.
- phase: Relapses
  notes: >-
    Multiple further febrile episodes (often 3 to 10 in TBRF) as the spirochete
    switches Vmp serotype.
prevalence:
- population: Senegal (West African endemic focus), non-malarial febrile illness
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No population incidence or prevalence rate is established for tick-borne
    relapsing fever, which is widely under-recognized and misattributed to
    malaria. In a cross-sectional study of non-malarial febrile illness in a
    low-malaria area of Senegal, relapsing-fever Borrelia (in West Africa the
    soft-tick species B. crocidurae) was the single most common pathogen,
    detected in 15.5% of cases, indicating a substantial endemic burden rather
    than a rare occurrence.
  evidence:
  - reference: PMID:38272885
    reference_title: Investigating the etiologies of non-malarial febrile illness in Senegal using metagenomic sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacteria were the most common, with relapsing fever Borrelia and spotted
      fever Rickettsia found in 15.5% and 3.8% of cases, respectively.
    explanation: >-
      Supports the high endemic burden of tick-borne relapsing fever in West
      Africa, where relapsing-fever Borrelia was the most common identified
      cause of non-malarial febrile illness.


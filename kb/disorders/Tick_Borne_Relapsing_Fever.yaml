name: Tick-Borne Relapsing Fever
creation_date: "2026-09-30T01:09:45Z"
description: >-
  Tick-borne relapsing fever is a zoonotic relapsing-fever borreliosis caused
  by Borrelia species maintained in small-mammal and Ornithodoros soft-tick
  cycles, where tick-bite acquisition, complement evasion, and variable major
  protein antigenic switching drive recurrent spirochetemic febrile episodes.
category: Infectious Disease
disease_term:
  preferred_term: tick-borne relapsing fever
  term:
    id: MONDO:0001621
    label: tick-borne relapsing fever
parents:
- Relapsing Fever
synonyms:
- Soft-tick-borne relapsing fever
- Soft-tick relapsing fever
- Endemic relapsing fever
- TBRF
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 24 reported
  PMIDs resolved, but one quote from PMID:16940140 was unsupported, HP:0500131
  was unresolved, UBERON:0001891 was incorrectly used for brain, NCIT:C308 and
  NCIT:C599 were misreported as doxycycline and ceftriaxone, and live OAK lookup
  showed that generated taxon leads NCBITaxon:6955 and NCBITaxon:47917 were not
  Ornithodoros or Borrelia parkeri. Those generated leads were not curated.
  preflight-dr skipped automated gene identity checks because MONDO:0001621
  records no causal gene; manual review confirmed the report covered the
  intended soft-tick relapsing-fever entity rather than louse-borne or hard-tick
  B. miyamotoi disease.
review_notes: >-
  Deliberately lumped. This entry keeps named soft-tick relapsing-fever
  Borrelia species, including B. hermsii and B. crocidurae here, inside
  MONDO:0001621 tick-borne relapsing fever because the curated evidence supports
  a shared Ornithodoros-borne zoonotic lifecycle and Vmp antigenic-variation
  mechanism. The OpenScientist report was searched for species-specific
  presentation, diagnosis, treatment, prognosis, transmission, vector,
  reservoir, geography, and at-risk-population differences. It separated
  hard-tick B. miyamotoi disease and louse-borne B. recurrentis disease, both
  already handled outside this soft-tick leaf, but it did not support promoting
  the remaining soft-tick Borrelia species into separate disease entries.
infectious_agent:
- name: Relapsing-fever Borrelia species
  infectious_agent_term:
    preferred_term: Borrelia
    term:
      id: NCBITaxon:138
      label: Borrelia
  description: >-
    Borrelia species maintained in Ornithodoros soft-tick cycles cause
    tick-borne relapsing fever after zoonotic spillover into humans.
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Defines TBRF as a zoonosis caused by multiple Borrelia species transmitted
      by Ornithodoros soft ticks.

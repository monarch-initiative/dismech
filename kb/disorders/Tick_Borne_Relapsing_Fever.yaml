treatments:
- name: Antibiotic therapy
  description: >-
    Tick-borne relapsing fever is treated with tetracyclines (such as
    doxycycline), beta-lactams (penicillin or ceftriaxone), or macrolides
    (erythromycin); patients should be monitored closely after the first dose
    because rapid spirochete lysis frequently precipitates a Jarisch-Herxheimer
    reaction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: penicillin
      term:
        id: CHEBI:17334
        label: penicillin
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_mechanisms:
  - target: Spirochetemic Dissemination
    treatment_effect: INHIBITS
    description: >-
      Antimicrobial therapy clears Borrelia from the bloodstream, terminating
      recurrent bacteremic waves.
  - target: Jarisch-Herxheimer Reaction
    treatment_effect: ACTIVATES
    description: >-
      First-dose antibiotic lysis of circulating spirochetes can acutely trigger
      the cytokine-mediated Jarisch-Herxheimer reaction.
  evidence:
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is with beta-lactams, tetracyclines or macrolids.
    explanation: >-
      Systematic review establishes tetracyclines, beta-lactams, and macrolides
      as the standard antimicrobial classes for human TBRF.
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients recovered after antibiotic treatment with ceftriaxone and/or
      doxycycline.
    explanation: >-
      Documents recovery of relapsing-fever patients on ceftriaxone and/or
      doxycycline.
- name: Doxycycline post-exposure prophylaxis
  description: >-
    Selective post-exposure prophylaxis with doxycycline after a soft-tick bite
    prevents tick-borne relapsing fever.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

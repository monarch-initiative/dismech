name: Tick-Borne Relapsing Fever
creation_date: "2026-09-30T01:09:45Z"
description: >-
  Tick-borne relapsing fever is a zoonotic relapsing-fever borreliosis caused
  by Borrelia species maintained in small-mammal and Ornithodoros soft-tick
  cycles, where tick-bite acquisition, complement evasion, and variable major
  protein antigenic switching drive recurrent spirochetemic febrile episodes.
category: Infectious Disease
disease_term:
  preferred_term: tick-borne relapsing fever
  term:
    id: MONDO:0001621
    label: tick-borne relapsing fever
parents:
- Relapsing Fever
synonyms:
- Relapsing fever, tick-borne
- Soft-tick-borne relapsing fever
- Soft-tick relapsing fever
- Endemic relapsing fever
- TBRF
notes: >-
  The genus-level agent (NCBITaxon:138, relapsing-fever Borrelia) is bound
  alongside two representative species (B. hermsii, B. crocidurae) because TBRF
  is a deliberately lumped union of regionally distinct Ornithodoros-borne
  species; see review_notes. This entry is the soft-tick relapsing-fever entity,
  distinct from louse-borne relapsing fever and from hard-tick B. miyamotoi
  disease.
review_notes: >-
  Deliberately lumped. This entry keeps named soft-tick relapsing-fever
  Borrelia species, including B. hermsii and B. crocidurae here, inside
  MONDO:0001621 tick-borne relapsing fever because the curated evidence supports
  a shared Ornithodoros-borne zoonotic lifecycle and Vmp antigenic-variation
  mechanism. The OpenScientist report was searched for species-specific
  presentation, diagnosis, treatment, prognosis, transmission, vector,
  reservoir, geography, and at-risk-population differences. It separated
  hard-tick B. miyamotoi disease and louse-borne B. recurrentis disease, both
  already handled outside this soft-tick leaf, but it did not support promoting
  the remaining soft-tick Borrelia species into separate disease entries.

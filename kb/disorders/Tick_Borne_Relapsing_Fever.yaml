    Soft-tick relapsing-fever Borrelia circulate between small mammal reservoir
    hosts and Ornithodoros ticks; humans are incidental hosts infected when
    competent infected soft ticks feed.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Rodentia
    role: small-mammal reservoir hosts
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: Ornithodoros
    role: soft-tick vector host
    term:
      id: NCBITaxon:6937
      label: Ornithodoros
  vectors:
  - Ornithodoros soft ticks
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Supports the vector-borne zoonotic lifecycle connecting Ornithodoros ticks
      to human TBRF.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:35171908
      reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tick borne relapsing fever (TBRF) is a zoonosis caused by various
        Borrelia species transmitted to humans by both soft-bodied and (more
        recently recognized) hard-bodied ticks.
      explanation: >-
        Establishes tick-borne relapsing fever as a vector-borne spirochetal
        zoonotic infectious disease.
transmission:
- name: Ornithodoros soft-tick bite
  description: >-
    Humans acquire tick-borne relapsing fever when infected Ornithodoros soft
    ticks transmit relapsing-fever Borrelia during feeding.
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Directly supports Ornithodoros tick transmission to humans as the route of
      TBRF acquisition.
pathophysiology:
- name: Soft-Tick Borrelia Acquisition
  role: trigger
  description: >-
    Relapsing-fever Borrelia enter the human host through the bite of an
    infected soft tick.
  biological_scale: ORGANISM
  downstream:
  - target: FhbA-Mediated Complement Evasion
    causal_link_type: DIRECT
    description: >-
      Tick-delivered spirochetes deploy complement evasion to blunt innate
      killing and establish spirochetemia.
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Vtp-producing spirochetes from tick salivary glands establish mammalian
      infection by tick bite and disseminate through the bloodstream.
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant lacking Vtp also colonized ticks but produced neither Vtp nor a
      Vmp in tick salivary glands, which rendered the spirochete noninfectious
      by tick bite.
    explanation: >-
      Demonstrates that a relapsing-fever Borrelia tick-phase surface protein is
      required for mammalian infection by tick bite.
- name: FhbA-Mediated Complement Evasion
  description: >-
    FhbA-family surface proteins recruit host factor H, using the host's
    complement regulator to help relapsing-fever Borrelia evade alternative
    complement killing during early spirochetemia.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: Complement evasion supports survival of bloodstream Borrelia.
  evidence:
  - reference: PMID:35303742
    reference_title: Mechanism of Borrelia immune evasion by FhbA-related proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Important mechanism for complement evasion is acquisition of the main host
      complement inhibitor, factor H (FH).
    explanation: >-
      Background framing: factor H acquisition is the general complement-evasion
      mechanism whose FhbA structural basis this paper determines.
  - reference: PMID:18354209
    reference_title: "Complement factor H-binding protein, a putative virulence determinant of Borrelia hermsii, is an antigenic target for protective B1b lymphocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      complement factor H-binding protein (FhbA), a B. hermsii outer-surface
      protein and putative virulence factor that does not undergo antigenic
      variation and is expressed by all clinical isolates.
    explanation: >-
      Identifies FhbA as a B. hermsii outer-surface virulence factor, expressed
      by all clinical isolates, consistent with its complement-evasion role.
  - reference: PMID:35303742
    reference_title: Mechanism of Borrelia immune evasion by FhbA-related proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Conserved FH-binding mechanism within the FhbA-family was verified by
      analysis of a novel FH-binding protein from B. duttonii
    explanation: >-
      Primary result: factor H binding is a conserved property of the FhbA
      family, verified in a relapsing-fever Borrelia species.
- name: Spirochetemic Dissemination
  description: >-
    Relapsing-fever Borrelia proliferate in blood, producing bacteremic waves
    that expose surface variable major proteins to the humoral immune response.
  biological_scale: ORGANISM
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Vmp Antigenic Switching
    causal_link_type: DIRECT
    description: >-
      Bloodstream expansion creates the antigenic-variation dynamics that drive
      recurrent bacteremic waves.
  - target: B1b-cell IgM Clearance of Bacteremic Waves
    causal_link_type: DIRECT
    description: >-
      Each bacteremic wave elicits a serotype-specific antibody response that
      clears the dominant serotype.
  - target: Jarisch-Herxheimer Reaction
    causal_link_type: DIRECT
    description: >-
      The spirochete burden carried in the bloodstream sets the severity of the
      Jarisch-Herxheimer reaction precipitated when antibiotics lyse the
      organisms.
  - target: Tissue Macrophage Clearance of Spirochete-Bound Erythrocytes
    causal_link_type: DIRECT
    description: >-
      Spirochetes bound to erythrocytes are removed from the bloodstream by
      tissue-resident macrophages in spleen and liver.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      High-level bacteremia is associated with thrombocytopenia in relapsing
      fever; the platelet-clearance mechanism is not resolved.
  - target: Borrelial Central Nervous System Invasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TBRF Borrelia can invade the central nervous system during subsequent
      bacteremic episodes.
  - target: High-Density Spirochetemia During Pregnancy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In pregnant women, higher spirochetemia density increases the risk of
      delivery during the acute TBRF attack.
  evidence:
  - reference: PMID:25914944
    reference_title: Interaction of spirochetes with the host fibrinolytic system and potential roles in pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This review addresses the interaction of these spirochetes with the
      fibrinolytic system, plasminogen (Plg) binding to the surface of bacteria
      and the generation of plasmin (Pla) on their surface.
    explanation: >-
      Supports plasminogen binding and surface plasmin generation as the
      dissemination mechanism for relapsing-fever Borrelia.
- name: Vmp Antigenic Switching
  description: >-
    Borrelia switch variable major protein expression to evade the
    serotype-specific antibody response and restart bacteremia after immune
    clearance.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  downstream:
  - target: Recurrent Spirochetemic Febrile Episodes
    causal_link_type: DIRECT
    description: >-
      Each new Vmp serotype restarts bacteremia, producing the next febrile
      episode.
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the spirochetes repeatedly evade the host's acquired immune response by
      undergoing antigenic variation of the variable major proteins (Vmps)
      produced on their outer surface
    explanation: >-
      Supports Vmp antigenic variation as the bloodstream immune-evasion
      mechanism used by relapsing-fever Borrelia.
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant lacking a Vmp constitutively produced Vtp, was attenuated in
      mice, produced lower cell densities in blood, and was unable to relapse in
      animals after its initial spirochetemia.
    explanation: >-
      Genetic inactivation of the Vmp expression system abolished relapse after
      the initial bacteremia, supporting Vmp switching as causal for recurrent
      waves.
  - reference: PMID:7683020
    reference_title: Intragenic recombination and a chimeric outer membrane protein in the relapsing fever agent Borrelia hermsii.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Antigen switching results from sequential expression of genes for
      serotype-specific outer membrane proteins known as variable major proteins
      (Vmp's)
    explanation: >-
      Supports sequential Vmp gene expression as the molecular basis of
      relapsing-fever antigen switching.
- name: B1b-cell IgM Clearance of Bacteremic Waves
  description: >-
    A T-independent B1b-cell IgM response clears the dominant Vmp serotype,
    ending each bacteremic wave and selecting for the next antigenic variant.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B-1b B cell
    term:
      id: CL:0000821
      label: B-1b B cell
  biological_processes:
  - preferred_term: humoral immune response
    modifier: INCREASED
    term:
      id: GO:0006959
      label: humoral immune response
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Vmp Antigenic Switching
    causal_link_type: DIRECT
    description: >-
      Antibody clearance of the dominant serotype selects for spirochetes that
      have switched to a new Vmp, driving the next wave.
  evidence:
  - reference: PMID:12646649
    reference_title: The resolution of relapsing fever borreliosis requires IgM and is concurrent with expansion of B1b lymphocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together these results support the model that B1b cells generate the
      T-independent IgM required for the control and resolution of relapsing
      fever borreliosis.
    explanation: >-
      Supports B1b-cell T-independent IgM as the response that clears each
      bacteremic wave, the selection pressure behind antigenic switching.
- name: Recurrent Spirochetemic Febrile Episodes
  description: >-
    Successive Vmp-defined bacteremic waves produce the recurring high-fever
    episodes separated by afebrile intervals that define relapsing fever.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent fever
    description: >-
      The waxing and waning bacteremic waves present clinically as recurrent
      fever.
  evidence:
  - reference: PMID:29250931
    reference_title: Cis-acting DNA elements flanking the variable major protein expression site of Borrelia hermsii are required for murine persistence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The waxing and waning fever that is characteristic of relapsing fever is a
      direct result of spirochetal antigenic variation and sequential immune
      evasion.
    explanation: >-
      Ties the recurring febrile episodes directly to Vmp antigenic variation.
- name: Tissue Macrophage Clearance of Spirochete-Bound Erythrocytes
  biological_scale: CELLULAR
  description: >-
    Red blood cells bound to relapsing-fever spirochetes are cleared by
    tissue-resident macrophages, providing a cellular route from bacteremia to
    anemia.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Anemia
    description: >-
      Macrophage clearance of spirochete-bound erythrocytes depletes red blood
      cells and can produce anemia.
  evidence:
  - reference: PMID:19995898
    reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological and fluorescence in situ hybridization (FISH) analysis of
      infected tissues indicated that red blood cells (RBCs) were removed by
      tissue-resident macrophages, a process that could lead to anemia.
    explanation: >-
      Demonstrates tissue-macrophage clearance of spirochete-associated
      erythrocytes in spleen and liver as a mechanism of relapsing-fever anemia.
- name: Borrelial Central Nervous System Invasion
  biological_scale: TISSUE
  description: >-
    In contrast to louse-borne relapsing fever, tick-borne relapsing fever
    frequently has neurologic complications that are attributed to direct
    Borrelia invasion of the central nervous system, often after later febrile
    episodes.
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      neurologic complications in TBRF are frequently observed and attributed to
      direct invasion of the CNS invasion by Borrelia
    explanation: >-
      Attributes the distinctive neurologic involvement of TBRF to direct
      Borrelia CNS invasion.
  downstream:
  - target: Neurological complications
    description: >-
      CNS invasion causes frequent neurologic manifestations in TBRF.
  - target: Facial palsy
    description: >-
      Cranial neuritis, especially facial palsy, is a frequent focal neurologic
      complication of TBRF.
- name: High-Density Spirochetemia During Pregnancy
  biological_scale: ORGANISM
  description: >-
    In pregnant women with TBRF, higher spirochete density during the acute
    febrile attack is associated with delivery during the attack.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  evidence:
  - reference: PMID:9351408
    reference_title: Tick-borne relapsing fever and pregnancy outcome in rural Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of delivery during the attack was positively correlated to
      increasing density of the spirochetemia (p < 0.001) and to gestational age
      (p < 0.001).
    explanation: >-
      Directly links maternal spirochetemia density to delivery during the acute
      TBRF attack.
  downstream:
  - target: Delivery during febrile attack
    description: >-
      Acute, high-density maternal spirochetemia increases the risk of birth
      during the febrile attack.
- name: Jarisch-Herxheimer Reaction
  description: >-
    Antibiotic-induced spirochete lysis triggers a Jarisch-Herxheimer reaction,
    a TNF-alpha / IL-6 / IL-8 cytokine surge with sudden fever, rigors and
    hypotension shortly after the first dose.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Chills
    description: >-
      Acute TNF-alpha, IL-6, and IL-8 release upon spirochete lysis produces
      rigors and chills after the first antibiotic dose.
  - target: Hypotension
    description: >-
      Cytokine-driven vasodilation during the Jarisch-Herxheimer reaction causes
      acute hypotension.
  evidence:
  - reference: PMID:8663853
    reference_title: Prevention of Jarisch-Herxheimer reactions by treatment with antibodies against tumor necrosis factor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      antimicrobial treatment is often followed by sudden fever, rigors, and
      persistent hypotension (Jarisch-Herxheimer reactions) that are associated
      with increases in plasma concentrations of tumor necrosis factor alpha
      (TNF-alpha), interleukin-6, and interleukin-8
    explanation: >-
      Documents the TNF-alpha / IL-6 / IL-8 cytokine surge of the
      Jarisch-Herxheimer reaction after antimicrobial treatment of relapsing
      fever.
  - reference: PMID:9455520
    reference_title: Tick-borne relapsing fever in the northwestern United States and southwestern Canada.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A Jarisch-Herxheimer reaction was reported in 33 (54.1%) of 61 cases for
      which this information was available.
    explanation: >-
      Quantifies Jarisch-Herxheimer reaction incidence in a North American
      human tick-borne relapsing fever case series.
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of Jarisch-Herxheimer reaction (JHR) appears to be lower in TBRF
      (19.3%) compared to louse-borne relapsing fever (LBRF) (55.8%).
    explanation: >-
      Systematic review pooling published human TBRF cases estimates an overall
      19.3% Jarisch-Herxheimer reaction rate across global TBRF reports.
phenotypes:
- name: Recurrent fever
  category: Systemic
  frequency: OBLIGATE
  description: >-
    Recurring high-fever episodes separated by afebrile intervals are the
    defining manifestation of tick-borne relapsing fever.
  phenotype_term:
    preferred_term: Recurrent fever
    term:
      id: HP:0001954
      label: Recurrent fever
  evidence:
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most suggestive symptom in TBRF is the eponymous relapsing fever
      (present in 100% of the cases).
    explanation: >-
      Systematic review of confirmed human TBRF cases establishes relapsing
      fever in 100% of cases.
  - reference: PMID:29250931
    reference_title: Cis-acting DNA elements flanking the variable major protein expression site of Borrelia hermsii are required for murine persistence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human infection with relapsing fever spirochetes results in a series of
      febrile episodes that are interrupted by periods of apparent wellness.
    explanation: >-
      States the recurrent febrile-episode pattern in human relapsing-fever
      infection.
- name: Anemia
  category: Hematologic
  description: >-
    Anemia accompanies the high-level bacteremia of tick-borne relapsing fever
    and is linked to macrophage clearance of spirochete-associated erythrocytes.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:19995898
    reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Relapsing fever is associated with high-level bacteremia, as well as
      hematologic manifestations, such as thrombocytopenia (i.e., low platelet
      numbers) and anemia.
    explanation: >-
      Documents anemia alongside thrombocytopenia as a characteristic human
      hematologic manifestation of relapsing fever.
  - reference: PMID:19995898
    reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similar to human infection, the progression of the disease in mice was
      associated with thrombocytopenia and anemia.
    explanation: >-
      Reports anemia in B. hermsii relapsing-fever infection, mirrored in the
      murine model.
- name: Thrombocytopenia
  category: Hematologic
  description: >-
    Thrombocytopenia is the most suggestive laboratory finding in tick-borne
    relapsing fever.
  phenotype_term:
    preferred_term: Thrombocytopenia

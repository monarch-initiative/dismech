- name: Delivery during febrile attack
  category: Obstetric
  description: >-
    In pregnant women with tick-borne relapsing fever, febrile attacks can
    precipitate delivery during the attack, with substantial perinatal mortality
    linked to low gestational age and low birthweight.
  evidence:
  - reference: PMID:9351408
    reference_title: Tick-borne relapsing fever and pregnancy outcome in rural Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risk of birth during the attack of TBRF was 58.0%, with an extremely high
      perinatal mortality of 436 per 1000 births.
    explanation: >-
      Case-control study of 137 pregnant women with TBRF in rural Tanzania
      quantifies the high risk of delivery during an acute TBRF attack.
  - reference: PMID:9351408
    reference_title: Tick-borne relapsing fever and pregnancy outcome in rural Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of delivery during the attack was positively correlated to
      increasing density of the spirochetemia (p < 0.001) and to gestational age
      (p < 0.001).
    explanation: >-
      Demonstrates that delivery during a TBRF attack scales with maternal
      spirochetemia density and gestational age.
diagnosis:
- name: Blood-film microscopy
  description: >-
    Tick-borne relapsing fever is diagnosed in most clinical settings by direct
    microscopic visualization of spirochetes on stained peripheral blood smears
    obtained during febrile peaks.
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:35171908
    reference_title: Tick borne relapsing fever - a systematic review and analysis of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although only molecular diagnostic methods allow for species
      identification, microscopy remains the diagnostic gold standard in most
      clinical settings.
    explanation: >-
      Establishes peripheral blood microscopy as the clinical diagnostic gold
      standard for human TBRF.
  - reference: PMID:9455520
    reference_title: Tick-borne relapsing fever in the northwestern United States and southwestern Canada.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In confirmed cases, there was febrile illness, and spirochetes were
      identified on peripheral blood preparations.
    explanation: >-
      Confirms peripheral blood spirochete microscopy as the case-confirmation
      criterion in a 182-case North American TBRF series.

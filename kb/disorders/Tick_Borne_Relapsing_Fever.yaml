progression:
- phase: Incubation
  notes: Acute onset 2 to 18 days after the soft-tick bite.
- phase: First febrile episode
  notes: A high-fever episode lasting about 3 days during peak spirochetemia.
- phase: Afebrile interval
  notes: >-
    About 5 to 7 days of apparent wellness as IgM clears the dominant serotype.
- phase: Relapses
  notes: >-
    Multiple further febrile episodes (often 3 to 10 in TBRF) as the spirochete
    switches Vmp serotype.
prevalence:
- population: Senegal (West African endemic focus), non-malarial febrile illness
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No population incidence or prevalence rate is established for tick-borne
    relapsing fever, which is widely under-recognized and misattributed to
    malaria. In a cross-sectional study of non-malarial febrile illness in a
    low-malaria area of Senegal, relapsing-fever Borrelia (in West Africa the
    soft-tick species B. crocidurae) was the single most common pathogen,
    detected in 15.5% of cases, indicating a substantial endemic burden rather
    than a rare occurrence.
  evidence:
  - reference: PMID:38272885
    reference_title: Investigating the etiologies of non-malarial febrile illness in Senegal using metagenomic sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacteria were the most common, with relapsing fever Borrelia and spotted
      fever Rickettsia found in 15.5% and 3.8% of cases, respectively.
    explanation: >-
      Supports the high endemic burden of tick-borne relapsing fever in West
      Africa, where relapsing-fever Borrelia was the most common identified
      cause of non-malarial febrile illness.

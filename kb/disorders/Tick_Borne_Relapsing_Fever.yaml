agent_life_cycle:
  description: >-
    Soft-tick relapsing-fever Borrelia circulate between small mammal reservoir
    hosts and Ornithodoros ticks; humans are incidental hosts infected when
    competent infected soft ticks feed.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Rodentia
    role: small-mammal reservoir hosts
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: Ornithodoros
    role: soft-tick vector host
    term:
      id: NCBITaxon:6937
      label: Ornithodoros
  vectors:
  - Ornithodoros soft ticks
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Supports the vector-borne zoonotic lifecycle connecting Ornithodoros ticks
      to human TBRF.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Ornithodoros soft-tick bite
  description: >-
    Humans acquire tick-borne relapsing fever when infected Ornithodoros soft
    ticks transmit relapsing-fever Borrelia during feeding.
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several
      Borrelia species transmitted to humans by Ornithodoros tick vectors.
    explanation: >-
      Directly supports Ornithodoros tick transmission to humans as the route of
      TBRF acquisition.
pathophysiology:
- name: Soft-Tick Borrelia Acquisition
  role: trigger
  description: >-
    Relapsing-fever Borrelia enter the human host through the bite of an
    infected soft tick.
  biological_scale: ORGANISM
  downstream:
  - target: FhbA-Mediated Complement Evasion
    causal_link_type: DIRECT
    description: >-
      Tick-delivered spirochetes deploy complement evasion to blunt innate
      killing and establish spirochetemia.
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Vtp-producing spirochetes from tick salivary glands establish mammalian
      infection by tick bite and disseminate through the bloodstream.
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant lacking Vtp also colonized ticks but produced neither Vtp nor a
      Vmp in tick salivary glands, which rendered the spirochete noninfectious
      by tick bite.
    explanation: >-
      Demonstrates that a relapsing-fever Borrelia tick-phase surface protein is
      required for mammalian infection by tick bite.
- name: FhbA-Mediated Complement Evasion
  description: >-
    FhbA-family surface proteins recruit host factor H, using the host's
    complement regulator to help relapsing-fever Borrelia evade alternative
    complement killing during early spirochetemia.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Spirochetemic Dissemination
    causal_link_type: DIRECT
    description: Complement evasion supports survival of bloodstream Borrelia.
  evidence:
  - reference: PMID:35303742
    reference_title: Mechanism of Borrelia immune evasion by FhbA-related proteins.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Important mechanism for complement evasion is acquisition of the main host
      complement inhibitor, factor H (FH).
    explanation: >-
      Supports factor H acquisition by FhbA-family proteins as a Borrelia immune
      evasion mechanism.
- name: Spirochetemic Dissemination
  description: >-
    Relapsing-fever Borrelia proliferate in blood, producing bacteremic waves
    that expose surface variable major proteins to the humoral immune response.
  biological_scale: ORGANISM
  downstream:
  - target: Vmp Antigenic Switching
    causal_link_type: DIRECT
    description: >-
      Bloodstream expansion creates the antigenic-variation dynamics that drive
      recurrent bacteremic waves.
  evidence:
  - reference: PMID:18354209
    reference_title: "Complement factor H-binding protein, a putative virulence determinant of Borrelia hermsii, is an antigenic target for protective B1b lymphocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To understand protective immune responses against such pathogens, we have
      been studying Borrelia hermsii, a bacterium that causes recurrent
      bacteremia due to antigenic variation.
    explanation: >-
      Connects B. hermsii antigenic variation to recurrent bloodstream
      bacteremia in the relapsing-fever model.
- name: Vmp Antigenic Switching
  description: >-
    Borrelia switch variable major protein expression to evade the
    serotype-specific antibody response and restart bacteremia after immune
    clearance.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the spirochetes repeatedly evade the host's acquired immune response by
      undergoing antigenic variation of the variable major proteins (Vmps)
      produced on their outer surface
    explanation: >-
      Supports Vmp antigenic variation as the bloodstream immune-evasion
      mechanism used by relapsing-fever Borrelia.
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant lacking a Vmp constitutively produced Vtp, was attenuated in
      mice, produced lower cell densities in blood, and was unable to relapse in
      animals after its initial spirochetemia.
    explanation: >-
      Genetic inactivation of the Vmp expression system abolished relapse after
      the initial bacteremia, supporting Vmp switching as causal for recurrent
      waves.
  - reference: PMID:7683020
    reference_title: Intragenic recombination and a chimeric outer membrane protein in the relapsing fever agent Borrelia hermsii.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Antigen switching results from sequential expression of genes for
      serotype-specific outer membrane proteins known as variable major proteins
      (Vmp's)
    explanation: >-
      Supports sequential Vmp gene expression as the molecular basis of
      relapsing-fever antigen switching.

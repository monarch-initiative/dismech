- name: Borrelia hermsii
  infectious_agent_term:
    preferred_term: Borrelia hermsii
    term:
      id: NCBITaxon:140
      label: Borrelia hermsii
  description: >-
    Western North American soft-tick relapsing fever Borrelia species that
    cycles between small mammals and Ornithodoros hermsi ticks.
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Borrelia hermsii, a causative agent of relapsing fever of humans in
      western North America, is maintained in enzootic cycles that include small
      mammals and the tick vector Ornithodoros hermsi.
    explanation: >-
      Supports B. hermsii as a human relapsing-fever agent with a
      small-mammal/soft-tick enzootic cycle.
- name: Borrelia crocidurae
  infectious_agent_term:
    preferred_term: Borrelia crocidurae

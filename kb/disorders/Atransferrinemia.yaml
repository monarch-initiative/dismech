clinical_trials:
- name: NCT01797055
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    This phase II open-label, single-group study evaluates intravenous human apotransferrin replacement.
    The official record updated September 16, 2026 lists five actual participants, active-not-recruiting
    status and estimated completion in January 2028. Outcomes include hemoglobin, transferrin pharmacokinetics,
    organ iron and adverse reactions. No results are posted; the registry does not establish clinical benefit
    or the optimal regimen. Its transferrin below 40 mg/dL eligibility threshold is a study criterion, not
    a universal diagnostic cutoff.
  target_phenotypes:
  - preferred_term: Hypochromic microcytic anemia
    term:
      id: HP:0004840
      label: Hypochromic microcytic anemia
  - preferred_term: Atransferrinemia
    term:
      id: HP:0012239
      label: Atransferrinemia

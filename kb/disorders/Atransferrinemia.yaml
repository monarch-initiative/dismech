name: Atransferrinemia
creation_date: "2026-08-08T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital atransferrinemia
  term:
    id: MONDO:0008846
    label: atransferrinemia
parents:
  - Disorder of iron metabolism and transport
  - Hereditary anemia
  - Inborn error of metal metabolism

description: >-
  Congenital atransferrinemia (familial hypotransferrinemia) is an extremely rare
  autosomal recessive disorder caused by biallelic loss-of-function variants in TF,
  the gene encoding serum transferrin. Transferrin is the principal plasma
  iron-transport protein: it binds ferric iron absorbed from the gut and delivers it,
  via transferrin-receptor-mediated endocytosis, to erythroid precursors for
  hemoglobin synthesis and to other tissues. In its near-absence, iron cannot be
  delivered to the bone marrow, producing a severe microcytic hypochromic anemia,
  while dietary iron continues to be absorbed and — lacking transferrin to chaperone
  it — circulates as toxic non-transferrin-bound iron that deposits in parenchymal
  organs (liver, heart, pancreas, thyroid, kidney), causing progressive
  hemosiderosis. The disorder thus couples iron-deficient erythropoiesis with
  systemic iron overload. Untreated, it is frequently fatal in infancy or childhood
  from anemia or from complications of iron overload (cardiac, hepatic).

inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    penetrance: COMPLETE
    expressivity: VARIABLE
    description: >-
      Biallelic loss-of-function variants in TF are required; heterozygous carriers
      have reduced transferrin (hypotransferrinemia) but are clinically asymptomatic.
      Penetrance in biallelic individuals is complete, while expressivity is variable
      (severity of anemia and iron overload appears to track residual transferrin
      synthesis rather than a second modifier locus). Several reported kindreds are
      consanguineous, consistent with autosomal recessive homozygosity.
    evidence:
      - reference: PMID:19579082
        reference_title: "Severe hypochromic microcytic anemia in a patient with congenital atransferrinemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Congenital atransferrinemia or hypotransferrinemia is a very rare autosomal
          recessive disorder
        explanation: States the autosomal recessive mode of inheritance.

prevalence:
  - population: Worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      An extremely rare disorder; only ~16-20 genetically or clinically documented
      cases from roughly 14-16 families have been reported since the first description
      by Heilmeyer in 1961.
    evidence:
      - reference: PMID:28895280
        reference_title: "Addition of oral iron to plasma transfusion in human congenital hypotransferrinemia: A 10-year observational follow-up with the effects on hematological parameters and growth."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Since its description in 1961, only 16 cases have been reported."
        explanation: Quantifies the ultra-rarity of the disorder in the published literature.

genetic:
  - name: TF
    gene_term:
      preferred_term: TF
      term:
        id: hgnc:11740
        label: TF
    relationship_type: CAUSATIVE
    notes: >-
      TF (chromosome 3q22.1) encodes serum transferrin (siderophilin), the plasma
      glycoprotein that binds and transports ferric iron. Homozygous or
      compound-heterozygous loss-of-function variants abolish or drastically reduce
      circulating transferrin, causing congenital atransferrinemia (OMIM:209300).
      The characterized disease alleles are private to individual kindreds and are a
      mix of missense substitutions that destabilize or impair secretion of the
      iron-binding lobes and a null-type deletion-insertion event: p.Ala477Pro with a
      10-bp deletion/9-bp insertion (compound heterozygous; the first molecularly
      characterized U.S. case, PMID:11110675), p.Asp77Asn (homozygous; the third case,
      PMID:15466165), and p.Cys137Tyr (homozygous; first Turkish case, PMID:18097132).
      No gain-of-function or dominant-negative TF alleles are reported. These are
      distinct from the common benign TF structural polymorphisms (the TF C/B/D system)
      used historically in population genetics.
    variants:
      - name: TF p.Ala477Pro (with 10-bp deletion/9-bp insertion)
        description: >-
          Compound-heterozygous alleles in the first molecularly characterized U.S.
          case; the missense change lies at an evolutionarily conserved residue.
      - name: TF p.Asp77Asn
        description: Homozygous missense allele reported in the third characterized case.
      - name: TF p.Cys137Tyr
        description: Homozygous missense allele (exon 4) in the first Turkish case.
    evidence:
      - reference: PMID:18097132
        reference_title: "A new case of human atransferrinemia with a previously undescribed mutation in the transferrin gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          DNA analysis of the serum transferrin gene in the patient revealed a
          previously undescribed mutation in exon 4, a G-->A transition at cDNA
          410(Cys137Tyr).
        explanation: >-
          Demonstrates that atransferrinemia is caused by pathogenic variants in the
          serum transferrin (TF) gene.
      - reference: PMID:11110675
        reference_title: "Molecular characterization of a case of atransferrinemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In addition to these mutations, which we regard to be causative in the
          patient's atransferrinemia, a silent polymorphism at cDNA 1572 G-->C was found
        explanation: >-
          The first molecular characterization of atransferrinemia, identifying biallelic
          causative TF mutations (compound heterozygote).

pathophysiology:
  - name: Transferrin Deficiency
    biological_scale: MOLECULAR
    description: >-
      Biallelic TF loss-of-function variants result in absent or near-absent
      circulating transferrin, the plasma protein responsible for solubilizing and
      transporting ferric iron. Serum transferrin and total iron-binding capacity are
      markedly reduced.
    molecular_functions:
      - preferred_term: ferric iron binding
        modifier: DECREASED
        term:
          id: GO:0008199
          label: ferric iron binding
    evidence:
      - reference: PMID:18097132
        reference_title: "A new case of human atransferrinemia with a previously undescribed mutation in the transferrin gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hereditary atransferrinemia is a very rare disorder characterized by
          microcytic anemia and iron overload.
        explanation: >-
          Establishes transferrin deficiency as the primary defect producing the
          coupled anemia-plus-iron-overload phenotype.
    genetic_context:
      gene:
        preferred_term: TF
        term:
          id: hgnc:11740
          label: TF
      functional_impact_category: LOSS_OF_FUNCTION
    downstream:
      - target: Impaired Iron Delivery to Erythroid Precursors
        causal_link_type: DIRECT
        description: >-
          Loss of plasma transferrin removes the receptor-mediated route by which iron
          reaches erythroid precursors.
      - target: Non-Transferrin-Bound Iron Accumulation
        causal_link_type: DIRECT
        description: >-
          With no transferrin to bind absorbed iron, plasma iron circulates as reactive
          non-transferrin-bound iron.
      - target: Hepcidin Suppression
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Loss of transferrin removes a positive input to hepatic hepcidin expression,
          lowering hepcidin.

  - name: Impaired Iron Delivery to Erythroid Precursors
    biological_scale: CELLULAR
    description: >-
      Without transferrin, iron cannot be delivered via transferrin-receptor-mediated
      endocytosis to erythroblasts in the bone marrow. Iron-restricted erythropoiesis
      results despite adequate total body iron, impairing heme and hemoglobin synthesis.
    cell_types:
      - preferred_term: erythroblast
        term:
          id: CL:0000765
          label: erythroblast
    biological_processes:
      - preferred_term: iron ion transport to erythroid precursors
        modifier: DECREASED
        term:
          id: GO:0006826
          label: iron ion transport
      - preferred_term: heme biosynthesis
        modifier: DECREASED
        term:
          id: GO:0006783
          label: heme biosynthetic process
    evidence:
      - reference: PMID:19579082
        reference_title: "Severe hypochromic microcytic anemia in a patient with congenital atransferrinemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Congenital atransferrinemia or hypotransferrinemia is a very rare autosomal
          recessive disorder, characterized by a deficiency of transferrin, resulting
          in hypochromic, microcytic anemia and hemosiderosis.
        explanation: >-
          Links transferrin deficiency directly to iron-restricted (hypochromic,
          microcytic) erythropoiesis.
    downstream:
      - target: Microcytic Hypochromic Anemia
        causal_link_type: DIRECT
        description: >-
          Iron-restricted erythropoiesis impairs heme/hemoglobin synthesis, producing
          the microcytic hypochromic anemia.

  - name: Microcytic Hypochromic Anemia
    biological_scale: ORGANISM
    description: >-
      Iron-restricted erythropoiesis produces a severe microcytic, hypochromic anemia
      from birth or early infancy, with compensatory reticulocytosis and erythroid
      marrow hyperplasia.
    biological_processes:
      - preferred_term: erythrocyte differentiation
        modifier: DECREASED
        term:
          id: GO:0030218
          label: erythrocyte differentiation
    evidence:
      - reference: PMID:28824244
        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hereditary hypotransferrinemia is a very rare cause of iron deficiency anemia
          in childhood characterized by microcytic hypochromic anemia refractory to iron
          therapy and concomitant iron overload.
        explanation: >-
          Documents the characteristic microcytic hypochromic anemia that is refractory
          to iron therapy (because the block is iron delivery, not iron supply).
    downstream:
      - target: Hypochromic Microcytic Anemia
        causal_link_type: DIRECT
        description: The mechanism manifests clinically and on laboratory testing as anemia.
      - target: Pallor
        causal_link_type: DIRECT
        description: Chronic anemia produces pallor.
      - target: Fatigue
        causal_link_type: DIRECT
        description: Chronic anemia produces fatigue.
      - target: Growth Delay
        causal_link_type: DIRECT
        description: Chronic anemia in infancy impairs growth.

  - name: Non-Transferrin-Bound Iron Accumulation
    biological_scale: MOLECULAR
    description: >-
      Dietary iron continues to be absorbed (further driven by the anemia's suppression
      of hepcidin and upregulation of intestinal iron uptake), but with no transferrin
      to chaperone it, iron circulates as reactive non-transferrin-bound iron (NTBI).
      NTBI is taken up unregulated into parenchymal cells.
    evidence:
      - reference: PMID:30420953
        reference_title: "Inherited Disorders of Iron Overload."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          atransferrinemia are further inherited disorders of iron overload caused by
          deficiency in ceruloplasmin or transferrin, the plasma ferroxidase and iron
          carrier, respectively.
        explanation: >-
          Places atransferrinemia among the inherited iron-overload disorders driven by
          loss of the plasma iron carrier, the basis for non-transferrin-bound iron
          accumulation.
    downstream:
      - target: Parenchymal Iron Overload and Hemosiderosis
        causal_link_type: DIRECT
        description: >-
          Non-transferrin-bound iron is taken up unregulated by parenchymal cells,
          depositing as tissue hemosiderosis.

  - name: Hepcidin Suppression
    biological_scale: ORGANISM
    description: >-
      Transferrin is a positive determinant of hepatic hepcidin expression; in its
      absence (compounded by anemia-driven erythropoietic drive), hepcidin is
      inappropriately low, permitting unchecked intestinal iron absorption and cellular
      iron efflux via ferroportin — a feed-forward loop that worsens the
      non-transferrin-bound iron load.
    evidence:
      - reference: PMID:19047682
        reference_title: "Transferrin-a modulates hepcidin expression in zebrafish embryos."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          transferrin plays a critical role both in iron transport and in regulating
          hepcidin expression in zebrafish embryos
        explanation: >-
          Establishes transferrin as a regulator of hepcidin, the basis for hepcidin
          suppression when transferrin is deficient.
    downstream:
      - target: Non-Transferrin-Bound Iron Accumulation
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Low hepcidin de-represses intestinal iron absorption and ferroportin-mediated
          efflux, feeding the non-transferrin-bound iron pool.

  - name: Parenchymal Iron Overload and Hemosiderosis
    biological_scale: TISSUE
    description: >-
      Non-transferrin-bound iron deposits progressively in the liver, heart, pancreas,
      thyroid, and kidney, producing tissue hemosiderosis with catalytic
      iron-driven oxidative injury. Cardiac and hepatic iron loading are the principal
      causes of morbidity and death.
    cell_types:
      - preferred_term: hepatocyte
        term:
          id: CL:0000182
          label: hepatocyte
      - preferred_term: cardiac muscle cell
        term:
          id: CL:0000746
          label: cardiac muscle cell
    biological_processes:
      - preferred_term: intracellular iron ion homeostasis
        modifier: DYSREGULATED
        term:
          id: GO:0006879
          label: intracellular iron ion homeostasis
    evidence:
      - reference: PMID:30420953
        reference_title: "Inherited Disorders of Iron Overload."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Unshielded NTBI, which is redox-active and toxic, is eventually taken up by
          tissue parenchymal cells, especially in the liver, pancreas and heart
        explanation: >-
          Describes the deposition of redox-active non-transferrin-bound iron in liver,
          pancreas, and heart parenchyma that drives the hemosiderosis and organ injury.
      - reference: PMID:41220266
        reference_title: "Revisiting Congenital Atransferrinemia: A Rare but Treatable Cause of Pediatric Heart Failure."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This leads to a characteristic clinical picture that includes heart failure
          due to iron overload cardiomyopathy, severe anemia, as well as hepatic and
          endocrine dysfunction in early infancy.
        explanation: >-
          Documents parenchymal iron loading of heart, liver, and endocrine organs as
          the source of the disease's major organ complications.
    downstream:
      - target: Cardiomyopathy
        causal_link_type: DIRECT
        description: Myocardial iron deposition produces iron-overload cardiomyopathy.
      - target: Hepatomegaly
        causal_link_type: DIRECT
        description: Hepatic iron loading produces hepatomegaly.
      - target: Hepatic Fibrosis
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Chronic hepatic iron loading and oxidative injury drive fibrosis.
      - target: Cirrhosis
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Progressive hepatic fibrosis advances to cirrhosis.
      - target: Diabetes Mellitus
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Pancreatic iron deposition impairs insulin secretion.
      - target: Hypothyroidism
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Thyroid iron deposition impairs thyroid hormone production.
      - target: Splenomegaly
        causal_link_type: DIRECT
        description: Iron overload is associated with splenomegaly.
      - target: Elevated Serum Ferritin
        causal_link_type: DIRECT
        description: Tissue iron loading is reflected in elevated serum ferritin.
      - target: Elevated Hepatic Iron
        causal_link_type: DIRECT
        description: Iron deposits in the liver parenchyma.


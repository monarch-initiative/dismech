  biological_scale: MOLECULAR
  description: >-
    Severely reduced plasma transferrin limits iron-binding capacity and iron delivery, although trace protein
    and clinical expression vary.
  evidence:
  - reference: PMID:11920219
    reference_title: Biochemical and genetic defects underlying human congenital hypotransferrinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At diagnosis the patient had serum Tf levels equal to about 1% of the normal values.
    explanation: >-
      Biochemical measurement in a single congenital case.
  - reference: PMID:40112917
    reference_title: Hypotransferrinemia leading to fatal hemochromatosis without anemia.
    supports: SUPPORT

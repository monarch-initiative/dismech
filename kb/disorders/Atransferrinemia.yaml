- name: Individualized iron supplementation with transferrin replacement
  description: >-
    Iron alone does not correct carrier deficiency and can aggravate loading. A Turkish patient received
    oral iron with regular plasma and later an individualized change in duration to maintain hemoglobin.
    This uncontrolled, overlapping follow-up does not support routine supplementation in iron-overloaded
    patients or establish superiority over adequate transferrin replacement.

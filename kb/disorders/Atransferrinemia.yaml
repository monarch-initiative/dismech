diagnosis:
- name: Integrated iron and hematologic assessment
  description: >-
    Measure transferrin directly alongside hemoglobin, indices, serum iron, TIBC and ferritin. Severe childhood
    iron-refractory microcytosis is a classic trigger, but unexplained parenchymal iron overload with very
    low transferrin also warrants evaluation in adults without anemia. Calculated transferrin saturation
    is variable and can exceed 100% with a very small denominator; no fixed low-saturation threshold is diagnostic.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure

animal_models:
- species: Mouse
  genotype: Trf hpx/hpx on a BALB/cJ background in the mechanistic study
  description: >-
    The spontaneous splice-donor allele produces severe transferrin deficiency, anemia and nonhematopoietic
    iron loading. The 2011 study compared replacement, washed wild-type red-cell transfusion and myeloablation
    followed by transferrin. Replacement improved hematologic and hepcidin readouts; withdrawal allowed recurrence.
    Suppression of erythropoiesis and restoration of transferrin make separable contributions. The study
    does not establish apoptosis of immature erythrocytes, a complete human signaling chain or universal
    clinical rescue.
  genes:
  - preferred_term: TF
    term:
      id: hgnc:11740
      label: TF
  evidence:
  - reference: PMID:10910930
    reference_title: The molecular defect in hypotransferrinemic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      It results from a single point mutation, which alters an invariable nucleotide in the splice donor
      site after exon 16 of the Trf gene. No normal Trf messenger RNA (mRNA) is made from the hpx allele.
    explanation: >-
      Defined spontaneous mouse splice defect; the accessible source is an abstract.
  - reference: PMID:20956801
    reference_title: Transferrin is a major determinant of hepcidin expression in hypotransferrinemic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      By the third day of treatment, spleen masses had decreased and hematocrits had normalized; by the
      sixth day of treatment, hepcidin levels were elevated from baseline to levels similar to those observed
      in wild-type mice (data not shown). Six weeks after cessation of treatment, hematocrits, spleen masses,
      and hepcidin levels reverted to pretreatment or near-pretreatment levels (data not shown).
    explanation: >-
      Main-body report of rapid response and recurrence after withdrawal; the numerical data are not shown
      in the paper.
  - reference: PMID:20956801
    reference_title: Transferrin is a major determinant of hepcidin expression in hypotransferrinemic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hepcidin expression increased in mice treated with doxorubicin and human or murine Tf by approximately
      eighty-fold and seventeen-fold, respectively (Figure 6F).
    explanation: >-
      Transferrin stimulation after myeloablation supports an erythropoiesis-independent component. Different
      protein doses prevent a human-versus-mouse potency comparison.
  modeled_mechanisms:
  - target: Reduced Circulating Transferrin
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The hpx splice allele reduces the normal circulating carrier.
    limitations: >-
      This postnatal mouse splice defect models severe deficiency, not every human missense allele or the
      nonanemic adult spectrum. Early survival support, strain-dependent drug responses, myelotoxic and
      iron-chelating effects of doxorubicin, and different transferrin doses constrain causal interpretation.
      No specific human receptor or erythroid mediator is isolated.

treatments:
  - name: Apotransferrin / Plasma Infusion
    description: >-
      Infusion of apotransferrin (purified or plasma-derived) or fresh-frozen plasma
      restores iron transport, corrects the anemia, and redistributes parenchymal iron.
      This is the disease-specific, mechanism-directed therapy.
    therapeutic_modality: PROTEIN_REPLACEMENT
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    notes: >-
      Management caveat: iron supplementation as monotherapy is ineffective and harmful —
      it does not correct the anemia (erythroid precursors cannot efficiently use
      non-transferrin-bound iron for hemoglobin synthesis) and worsens the secondary
      hemosiderosis. Transferrin replacement is the correct therapy. Note the exception
      documented by Aslan (PMID:28895280): oral iron co-administered with plasma
      (transferrin) transfusion gave satisfactory responses over a 10-year follow-up, so
      the contraindication applies to iron given alone, not to iron combined with
      transferrin replacement.
    target_mechanisms:
      - target: Transferrin Deficiency
        treatment_effect: ACTIVATES
        description: >-
          Infused apotransferrin restores the missing plasma iron carrier, correcting
          the primary molecular defect and re-enabling regulated iron delivery.
    evidence:
      - reference: PMID:28824244
        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Regular plasma infusion to replace the deficient transferrin molecule is the
          therapeutic option.
        explanation: >-
          Establishes transferrin replacement by plasma infusion as the mechanism-directed
          therapy.
      - reference: PMID:28895280
        reference_title: "Addition of oral iron to plasma transfusion in human congenital hypotransferrinemia: A 10-year observational follow-up with the effects on hematological parameters and growth."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          treated with a unique therapy of plasma transfusion fortified with oral iron,
          with satisfactory clinicolaboratory responses
        explanation: >-
          A 10-year follow-up documenting sustained clinical response to plasma
          (transferrin) transfusion therapy.

  - name: Iron Chelation Therapy
    description: >-
      Iron chelators (e.g., deferoxamine, deferasirox) reduce the parenchymal iron
      burden and its organ toxicity.
    therapeutic_modality: SMALL_MOLECULE
    target_mechanisms:
      - target: Parenchymal Iron Overload and Hemosiderosis
        treatment_effect: INHIBITS
        description: >-
          Iron chelators bind and promote excretion of parenchymal iron, reducing the
          tissue iron burden and its organ toxicity.
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:

treatments:
- name: Plasma transferrin replacement
  description: >-
    Plasma infusions supply transferrin and can improve iron-restricted erythropoiesis. Dose and interval
    are individualized to hemoglobin, transferrin and clinical course; a fixed monthly schedule may become
    insufficient during growth. Case reports do not establish uniform tissue-iron clearance or comparative
    product efficacy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Fresh Frozen Plasma Transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  evidence:
  - reference: url:https://richtlijnendatabase.nl/richtlijn/anemie_door_aangeboren_stoornissen/atransferrinemie_anemie_door_tf/behandeling_atransferrinemie_anemie.html
    reference_title: Behandeling atransferrinemie (anemie) - Richtlijn - Richtlijnendatabase
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      De expert groep is van mening dat een pati&euml;nt bij voorkeur moet worden behandeld met transferrine,
      hiervoor zijn twee mogelijkheden: plasma of apo-transferrine (met apo- transferrine is nog weinig
      ervaring).
    explanation: >-
      The 2014 Dutch guideline recommends transferrin replacement via plasma or apotransferrin, while noting
      limited apotransferrin experience. Its evidence base consists of small case reports.
  - reference: PMID:28824244
    reference_title: 'Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient has responded to treatment regimen of monthly infusions of fresh frozen plasma (FFP),
      with an increase of reticulocyte count to 6% at 2 weeks, Hb rise to 12.4 mg/dL at 1 month and decline
      of serum ferritin to 903 µg/L after 12 months.
    explanation: >-
      Response was documented in the boy only; the girl was lost to follow-up. The quoted hemoglobin unit
      is the source’s typographical error and is not used as a dose or treatment target.
  - reference: PMID:17768112
    reference_title: Effects of plasma transfusion on hepcidin production in human congenital hypotransferrinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hemoglobin pr ogressively increased reaching normal values during the third month.
    explanation: >-
      Response to intensified plasma replacement in one child; plasma volume and frequency changed together.
  - &id005
    reference: url:https://richtlijnendatabase.nl/gerelateerde_documenten/file/5656/1/Donker%20Guidelines%20anemia%20Blood%202014.pdf
    reference_title: https://richtlijnendatabase.nl/gerelateerde_documenten/file/5656/1/Donker%20Guidelines%20anemia%20Blood%202014.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

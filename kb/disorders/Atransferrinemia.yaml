review_notes: >-
  No disease-specific GeneReviews or StatPearls chapter was identified. The complete matching research and
  original references were assessed. Unsupported phenotype frequencies, complete penetrance, obligatory childhood
  anemia and uniformly low transferrin saturation were removed. The two-case 2017 abstract claims both children
  responded to FFP, but its body says the girl was lost to follow-up; only the boy has a documented response.
  The 2007, 2018 and 2022 Turkish reports overlap. The 2026 review embeds one case whose novel intronic TF
  deletion is explicitly a VUS despite earlier diagnostic wording. A 2025 adult family establishes mild or
  absent anemia with severe iron overload, without proving an alternative erythroid transport route. The research
  citation PMID10654962 concerns a different neonatal iron-overload syndrome and was not used as TF-disease
  evidence. PMID39081172 has no accessible abstract or full body after normal retrieval attempts; its title
  alone does not establish functional results. Full text was used wherever actually recovered, irrespective
  of cache content-type labels. The primary 2014 microcytic-anemia guideline (PMID:24665134) supplies disease-specific
  replacement, hemoglobin-guided phlebotomy/chelation and monitoring recommendations; it is not presented as
  new guidance. Skin iron deposition is mentioned there without a sufficiently precise phenotype binding and
  remains an uncoded source observation. NCT01797055 was recovered from the live registry and is represented
  as a design-only study with no posted results. Author-thesis retrieval for the unavailable 2024 functional
  study failed through the original repository and its alternate public domain; no findings were reconstructed
  from its title.
progression:
- phase: Variable childhood or adult presentation
  notes: >-
    Severe iron-refractory anemia and growth impairment commonly prompt childhood diagnosis. Adult-onset
    iron loading with mild or absent anemia is documented; therefore anemia onset, organ-failure sequence
    and untreated mortality cannot be assigned universal ages or frequencies.
  evidence:
  - reference: PMID:30420953
    reference_title: Inherited Disorders of Iron Overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This leads to impaired erythropoiesis, microcytic hypochromic anemia, growth retardation and iron
      overload in parenchymal cells of the liver, heart and pancreas.
    explanation: >-
      Clinical review describes the classic phenotype; later familial observations establish that severe
      childhood anemia is not universal.
  - *id001
- phase: Treatment and organ burden over time
  notes: >-
    Replacement can improve hemoglobin, but dose or interval may need reassessment with growth. Ferritin,
    transferrin and tissue iron are distinct measurements, and established organ injury may persist. Long-term
    clinical series are small and often repeat the same patients.
  evidence:
  - reference: PMID:34792309
    reference_title: 'Fresh Frozen Plasma Plus Iron Therapy in Congenital Hypotransferrinemia in the Second Decade: A Dynamic Approach to Maintaining Hematological Stability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, at the start of the second decade, Hb and ferritin began to decline and the therapy was
      revised.
    explanation: >-
      Within-patient longitudinal change after the first decade of treatment; not proof of treatment failure
      in every patient.
biochemical:
- name: Urinary hepcidin response during plasma replacement
  notes: >-
    In one child, urinary hepcidin rose during intensified transferrin replacement and subsequently fell
    as infusions became less frequent. This is a dynamic research observation, not a universally absent hormone
    or a stand-alone diagnostic threshold.
  evidence:
  - *id010
- name: Non-transferrin-bound iron
  notes: >-
    The nonanemic adult sister had measurable excess NTBI. Assay-specific NTBI is distinct from serum iron
    and calculated transferrin saturation.
  evidence:
  - *id008
- name: Abnormal circulating transferrin molecular forms
  notes: >-
    In the Italian child, serum protein analysis found approximately 80-kDa and 50-kDa transferrin forms.
    The authors considered degradation or an altered allele product as alternatives; the accessible abstract
    does not resolve the origin of the smaller form.
  evidence:
  - reference: PMID:11920219
    reference_title: Biochemical and genetic defects underlying human congenital hypotransferrinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Protein analyses indicate that the proband serum contains two transferrin forms: one of 80 kD analogous
      to the normal one, and a smaller one of 50 kD, which may arise from a specific degradation or be
      the gene product of a modified allele.
    explanation: >-
      Observed serum protein forms with explicitly unresolved origin of the smaller species.
histopathology:
- name: Myocardial iron deposition and fibrosis
  description: >-
    The explanted heart of the adult index patient showed widespread cardiomyocyte iron and fibrosis. The
    patient died of primary graft failure; this does not establish that all iron cardiomyopathy is irreversible
    or that graft iron deposition caused death.
  evidence:
  - reference: PMID:40112917
    reference_title: Hypotransferrinemia leading to fatal hemochromatosis without anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathological examination of the explant ed heart revealed widespread iron overload and fibrosis in
      the cardiomyocytes.
    explanation: >-
      Primary pathological finding in one adult with homozygous TF p.Glu370Lys.
discussions:
- discussion_id: gap_variable_erythropoiesis
  kind: KNOWLEDGE_GAP
  prompt: What permits preserved erythropoiesis in some patients with profound transferrin deficiency?
  rationale: >-
    Adult sisters and a historical family have mild or absent anemia at very low transferrin levels. Residual
    carrier availability, other inherited factors and alternative uptake routes are plausible but not resolved.
    The acquired enteropathy case had trace transferrin and transfusion exposure. None of these clinical
    observations proves a specific compensatory transporter or a universal safe transferrin threshold.
  attaches_to:
  - pathophysiology#Reduced Erythroid Iron Delivery
  evidence:
  - *id001
  - reference: PMID:36627980
    reference_title: 'Reversible atransferrinemia in a patient with chronic enteropathy: is transferrin mandatory for iron transport?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mildness of the clinical and haematological manifestations raises questions on possible compensatory
      mechanisms for erythroblastic iron supply, which remain to be investigated.
    explanation: >-
      The acquired-case authors explicitly frame compensation as an unresolved question.
- discussion_id: gap_human_hepcidin_signals
  kind: KNOWLEDGE_GAP
  prompt: How do transferrin-dependent sensing and erythroid demand combine to regulate human hepcidin?
  rationale: >-
    The mouse perturbations support separable contributions but do not isolate the complete molecular pathway.
    Human urinary-hepcidin observations are sparse and treatment-linked; embryonic fish anemia does not reproduce
    the postnatal mammalian suppression pattern. GDF15/TWSG1 transcripts, proposed ERFE signaling and receptor
    models should not be promoted into proven necessary human intermediates.
  attaches_to:
  - pathophysiology#Reduced Transferrin-Dependent Hepcidin Stimulation
  - pathophysiology#Increased Erythropoietic Drive
  evidence:
  - *id011
  - *id010
  - *id012
- discussion_id: gap_intronic_variant_function
  kind: KNOWLEDGE_GAP
  prompt: Does the newly reported intronic TF deletion alter splicing or protein expression?
  rationale: >-
    The 2026 review describes a homozygous intronic deletion, a heterozygous mother and absent population
    observations, but explicitly classifies the allele as VUS. A compatible severe iron-loading phenotype
    is not a functional splice assay or sufficient evidence to reclassify the allele.
  attaches_to:
  - pathophysiology#Biallelic TF Defect
  evidence:
  - *id009

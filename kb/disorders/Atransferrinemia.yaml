name: Atransferrinemia
creation_date: '2026-08-08T00:00:00Z'
category: Mendelian
disease_term:
  preferred_term: congenital atransferrinemia
  term:
    id: MONDO:0008846
    label: atransferrinemia
parents:
- Disorder of iron metabolism and transport
- Hereditary anemia
- Inborn error of metal metabolism
description: >-
  Congenital atransferrinemia, also called familial hypotransferrinemia, is a rare autosomal recessive TF-related
  disorder with markedly reduced circulating transferrin. Reduced transferrin-mediated iron delivery commonly
  causes microcytic hypochromic anemia in childhood, while disturbed iron sensing and low hepcidin can promote
  non-transferrin-bound iron accumulation in parenchymal organs. Cardiac, hepatic and endocrine injury can
  be severe. The spectrum also includes adult-onset iron overload with mild or absent anemia. Residual transferrin,
  age, treatment and other modifiers complicate genotype-phenotype prediction; neither a universal transferrin
  threshold nor complete clinical penetrance is established. Management replaces transferrin when needed, controls
  iron overload according to anemia tolerance, and monitors organ function.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Classic congenital disease is associated with homozygous or compound-heterozygous TF defects. Heterozygous
    relatives may have reduced transferrin without the severe childhood phenotype. Clinical expression varies
    substantially even at very low transferrin concentrations; the available kindreds do not establish complete
    penetrance or exclude modifier effects.
  evidence:
  - reference: PMID:11110675
    reference_title: Molecular characterization of a case of atransferrinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Each of the patient's transferrin genes contains one mutation, ie, the patient is a compound heterozygote
      for these mutations, because one was found in each of her parents.
    explanation: >-
      Segregation of the two parental alleles supports recessive transmission.
  - &id001
    reference: PMID:40112917
    reference_title: Hypotransferrinemia leading to fatal hemochromatosis without anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Interestingly, although serum transferrin was similar to previously described cases, anemia was mild
      in the index patient, and was absent in her sister.
    explanation: >-
      Two adult sisters with homozygous TF p.Glu370Lys had different anemia expression; this is not a penetrance
      estimate.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2018 follow-up cited only 16 published cases at that time. Later families and overlapping follow-up
    reports preclude treating that historical count as a current total or deriving population prevalence.
  evidence:
  - reference: PMID:28895280
    reference_title: 'Addition of oral iron to plasma transfusion in human congenital hypotransferrinemia: A 10-year observational follow-up with the effects on hematological parameters and growth.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Since its description in 1961, only 16 cases have been reported.
    explanation: >-
      Historical literature count in a case follow-up, not a population denominator or current cumulative
      count.
    quote_role: BACKGROUND
genetic:
- name: TF
  gene_term:
    preferred_term: TF
    term:
      id: hgnc:11740
      label: TF
  relationship_type: CAUSATIVE
  notes: >-
    TF encodes the major plasma iron carrier. Recessive defects can markedly lower circulating protein, but
    individual missense alleles should not all be assigned the same folding, secretion or iron-binding mechanism
    without functional evidence. The US compound-heterozygous p.Ala477Pro and deletion-insertion case and
    Turkish p.Cys137Tyr case are reported primary examples. The adult p.Glu370Lys family broadens the clinical
    spectrum. A newly reported intronic deletion remains a VUS despite a compatible phenotype. A broader
    hereditary hypotransferrinemia series also described HFE/HAMP or acquired cofactors; those selected cases
    do not establish that every carrier develops overload.
  variants:
  - name: TF p.Ala477Pro with a second deletion-insertion allele
    description: 'The first molecularly characterized US case had two different alleles: p.Ala477Pro and a 10-bp deletion with 9-bp insertion. Segregation and conservation supported causality; the accessible abstract does not report a secretion assay.'
  - name: TF p.Cys137Tyr
    description: Exon-4 c.410G>A was reported in the Turkish case subsequently followed under plasma plus iron treatment; these publications concern one patient.
  - name: TF p.Glu370Lys
    description: Homozygous c.1108G>A in two adult sisters with severe hypotransferrinemia and iron overload; classified as likely pathogenic by the 2025 authors using prediction and segregation, without a reported functional assay.
  - name: TF c.2063-11_2063-10del
    description: A homozygous intronic variant in a 13-year-old with anemia, cardiac/hepatic iron and diabetes. The source explicitly classifies it as a variant of uncertain significance; rarity and segregation do not establish a splice defect.
  evidence:
  - reference: PMID:11110675
    reference_title: Molecular characterization of a case of atransferrinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hereditary atransferrinemia is a rare but instructive disorder that has previously been reported
      in only 8 patients in 6 families. It is characterized by microcytic anemia and by iron loading, and
      can be treated effectively by plasma infusions. We now report the first case known in the United
      States. We determined the sequences flanking the exons of the human transferrin gene and sequenced
      all of the exons and some of the flanking regions of the patient's DNA and that of her parents. The
      patient's DNA revealed a 10-base pair (bp) deletion, followed by a 9-bp insertion of a duplicated
      sequence. There was also a G-->C transversion at complementary DNA (cDNA) nt 1429, predicting that
      a proline was substituted for the alanine in amino acid position 477 (Ala 477 Pro). The latter mutation
      occurs at an evolutionarily highly conserved site; 704 control alleles were screened and this point
      mutation was not found. Each of the patient's transferrin genes contains one mutation, ie, the patient
      is a compound heterozygote for these mutations, because one was found in each of her parents. In
      addition to these mutations, which we regard to be causative in the patient's atransferrinemia, a
      silent polymorphism at cDNA 1572 G-->C was found in exon 13 as well as 2 previously unreported polymorphisms
      at IVS8 + 62 c-->t and IVS14-4 c-->a. The mutation in nt 1572 and that in intron 8 were common in
      the general population; the intron 14 mutation is rare.
    explanation: >-
      Molecular characterization and familial segregation support two distinct TF alleles; benign polymorphisms
      described in the same abstract are not causal variants.
  - reference: PMID:18097132
    reference_title: A new case of human atransferrinemia with a previously undescribed mutation in the transferrin gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      DNA analysis of the serum transferrin gene in the patient revealed a previously undescribed mutation
      in exon 4, a G-->A transition at cDNA 410(Cys137Tyr).
    explanation: >-
      Primary case variant identification.
  - reference: PMID:40112917
    reference_title: Hypotransferrinemia leading to fatal hemochromatosis without anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Genetic analysis revealed homozygous TF variant NM_001063.3:c.1108G>A , p.(Glu370Lys). No other variants
      were found in the gene panel.
    explanation: >-
      Targeted panel result from one family; does not exclude every modifier outside the tested panel.
  - &id009
    reference: PMID:41220266
    reference_title: 'Revisiting Congenital Atransferrinemia: A Rare but Treatable Cause of Pediatric Heart Failure.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Targeted exome sequencing in the proband revealed a novel splice site variant, NC_000003.12:g.133778575_133778576del(NM_001063.3:c.2063-11_2063-10del)
      in intron 16 of TF in the homozygous state. Segregation analysis in the mother confirmed the variant
      to be present in the heterozygous state. This variant was not observed in population databases and
      in-house whole-exome sequencing (WES) data of 1246 individuals of Indian origin (Fig 7). This variant
      has been classified as a variant of uncertain significance according to the American College of Medical
      Genetics and Genomics (ACMG) guidelines.
    explanation: >-
      The source explicitly labels the intronic variant uncertain. No RNA or expression experiment proves
      altered splicing.
  - reference: PMID:25486930
    reference_title: Hereditary hypotransferrinemia can lead to elevated transferrin saturation and, when associated to HFE or HAMP mutations, to iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We show that, besides increasing serum transferrin saturation without iron overload, hypotransferrinemia,
      when associated to mutations in HFE or HAMP or to acquired factors, can lead to clinically relevant
      iron burden.
    explanation: >-
      Broader hereditary hypotransferrinemia series supports modifier-dependent iron burden; its duplicated
      abstract is the actual available content despite the full_text_html cache label. It does not establish
      the genotype distribution or severe anemia penetrance.
pathophysiology:
- name: Biallelic TF Defect
  biological_scale: MOLECULAR
  description: >-
    Pathogenic TF alleles reduce the availability of functional circulating transferrin through allele-dependent
    mechanisms. Genotype alone does not establish a universal protein-folding defect.

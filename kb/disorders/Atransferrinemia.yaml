  downstream:
  - target: Reduced Erythroid Iron Delivery
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lower transferrin availability reduces receptor-mediated erythroid iron supply; this is not absolute
      cessation of all erythroid iron uptake.
    evidence:
    - reference: PMID:28824244
      reference_title: 'Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        TF binds and delivers trivalent iron to erythroid precursors for synthesis of hemoglobin. Deficiency
        of TF leads to reduced hemoglobin synthesis and anemia, but with excess iron stored in peripheral
        tissues (secondary hemochromatosis) [4].
      explanation: >-
        Clinical background explains iron-restricted hemoglobin production; this is not a patient-specific
        transport assay.
      directness: INDIRECT
  - target: Reduced Transferrin-Dependent Hepcidin Stimulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of circulating transferrin can weaken the iron-sensing input to hepatic hepcidin regulation.
    evidence:
    - reference: PMID:20956801
      reference_title: Transferrin is a major determinant of hepcidin expression in hypotransferrinemic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        These results suggest that hepcidin expression in hpx mice is regulated both by Tf-restricted
        erythropoiesis and by Tf through a mechanism independent of its role in erythropoiesis.
      explanation: >-
        Interpretation of perturbation experiments in hpx mice.
      directness: INDIRECT
  - target: Non-Transferrin-Bound Iron Accumulation
    causal_link_type: DIRECT
    description: >-
      Reduced binding capacity limits safe carriage of circulating iron.
    evidence:

        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Monthly phlebotomy or iron chelation may be done in severe iron overload."
        explanation: Supports monthly phlebotomy for severe iron overload.

diagnosis:
  - name: Iron studies suggestive of atransferrinemia
    description: >-
      The disorder is suspected from the characteristic iron-study pattern: moderate to
      severe microcytic anemia with low serum iron, low transferrin saturation, low TIBC
      and low transferrin, but high serum ferritin.
    evidence:
      - reference: PMID:28824244
        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The diagnosis of atransferrinemia or hypotransferrinemia may be suspected in
          cases with moderate to severe anemia, low serum iron, transferrin saturation,
          TIBC, TF level; but with high serum ferritin.
        explanation: Describes the biochemical pattern that raises suspicion of the disorder.
  - name: TF molecular genetic testing
    description: Confirmatory diagnosis by sequencing the TF gene.
    diagnosis_term:
      preferred_term: Molecular genetic testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    evidence:
      - reference: PMID:28824244
        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Diagnosis is confirmed by molecular genetic testing for mutation in the TF gene."
        explanation: States TF sequencing as the confirmatory diagnostic test.

animal_models:
  - species: Mouse
    genotype: hpx/hpx (hypotransferrinemic)
    description: >-
      The spontaneous murine hpx mutation produces very low transferrin and closely
      recapitulates human atransferrinemia: recessive inheritance, early-onset
      refractory iron-deficient hypochromic anemia, and parenchymal iron deposition,
      with rescue by transferrin/serum injection.
    genes:
      - preferred_term: TF
        term:
          id: hgnc:11740
          label: TF
    evidence:
      - reference: PMID:3681112
        reference_title: "Hereditary hypotransferrinemia with hemosiderosis, a murine disorder resembling human atransferrinemia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A newly reported spontaneous mutation in mice resembles human atransferrinemia.
        explanation: Establishes the hpx mouse as a faithful model of human atransferrinemia.
      - reference: PMID:3681112
        reference_title: "Hereditary hypotransferrinemia with hemosiderosis, a murine disorder resembling human atransferrinemia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the mouse, weekly injections of mouse or human serum, or of highly purified
          transferrin, permit survival and alleviate the anemia.
        explanation: >-
          Demonstrates transferrin replacement rescues the phenotype, supporting the
          causal role of transferrin deficiency and the mechanism-directed therapy.
  - species: Zebrafish
    genotype: gavi (transferrin-a mutant)
    description: >-
      The zebrafish gavi (gav) hypochromic-anemia mutant carries transferrin-a mutations
      producing transferrin deficiency; morpholino knockdown of transferrin-a reproduces
      the anemia, and the model also links transferrin to hepcidin regulation.
    genes:
      - preferred_term: TF
        term:
          id: hgnc:11740
          label: TF
    evidence:
      - reference: PMID:19047682
        reference_title: "Transferrin-a modulates hepcidin expression in zebrafish embryos."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the zebrafish hypochromic anemia mutant, gavi, which exhibits transferrin
          deficiency due to mutations in transferrin-a
        explanation: >-
          Identifies the zebrafish gavi mutant as a transferrin-deficiency model of
          hypochromic anemia.
      - reference: PMID:19047682
        reference_title: "Transferrin-a modulates hepcidin expression in zebrafish embryos."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Morpholino knockdown of transferrin-a in wild-type embryos reproduced the
          anemia phenotype
        explanation: >-
          Knockdown reproduces the anemia, confirming transferrin loss as causal for the
          anemia phenotype.


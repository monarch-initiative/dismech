- species: Zebrafish
  genotype: gavi transferrin-a splice alleles and transferrin-a morphants
  description: >-
    Two recessive gavi splice alleles predict truncated transferrin-a and produce hypochromic anemia with
    early lethality. Morpholino knockdown reproduced reduced hemoglobin and tissue-iron staining; transferrin-a
    cRNA partially restored them. TfR2 knockdown reduced hepcidin without anemia, whereas anemia induced
    outside the transferrin pathway did not lower basal embryonic hepcidin. The complete main body, methods
    and captions were reviewed; separate supplementary objects were not assessed.
  genes:
  - preferred_term: TF
    term:
      id: hgnc:11740
      label: TF
  evidence:
  - reference: PMID:19047682
    reference_title: Transferrin-a modulates hepcidin expression in zebrafish embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Morpholino knockdown of transferrin-a in wild-type embryos reproduced the anemia phenotype and decreased
      somite and terminal gut iron staining, while coinjection of transferrin-a cRNA partially restored
      these defects.
    explanation: >-
      Embryonic perturbation and partial rescue of histochemical readouts.
  - &id012
    reference: PMID:19047682
    reference_title: Transferrin-a modulates hepcidin expression in zebrafish embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Embryos with transferrin-a or transferrin receptor 2 (TfR2) deficiency exhibited low levels of hepcidin
      expression, however anemia, in the absence of a defect in the transferrin pathway, failed to impair
      hepcidin expression.
    explanation: >-
      Embryonic transferrin-pathway dependence differs from the general mammalian anemia-hepcidin response.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2661867/
    reference_title: Transferrin-a modulates hepcidin expression in zebrafish embryos - PMC

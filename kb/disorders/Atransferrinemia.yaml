        reference_title: "Congenital Hypotransferrinemia, an Unusual Cause of Iron Deficiency Anemia: Report of Two Cases."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Monthly phlebotomy or iron chelation may be done in severe iron overload."
        explanation: >-
          Supports iron chelation (and phlebotomy) as adjuncts for severe iron overload.

  - name: Therapeutic Phlebotomy
    description: >-
      Monthly phlebotomy is an option to reduce the iron burden in severe iron overload
      (used alongside, or as an alternative to, chelation).
    therapeutic_modality: OTHER
    treatment_term:

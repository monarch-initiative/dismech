- name: Pulmonary Arterial Endothelial MECOM Deficiency
  biological_scale: CELLULAR
  description: >
    A branch reported only in 2026 and curated as provisional. MECOM is
    expressed principally in pulmonary arterial endothelial cells, and in a
    15-person series assembled through GeneMatcher, 6 had pulmonary arterial
    hypertension. Protein modelling suggests the variant hotspots interfere
    with binding to a VEGFR2/KDR enhancer, which would give an endothelial
    route independent of the marrow. This is an ascertainment-prone series -
    it was assembled by querying for a phenotype the authors had already
    nominated MECOM for - and the mechanism is modelled rather than measured.

    It is attached downstream of the DNA-binding node rather than left
    free-floating, because its evidential shape is the same as the limb branch
    this entry does connect: expression data plus human genetics, with no
    intervening steps established, and variants in the same zinc-finger
    hotspot.
  cell_types:
  - preferred_term: pulmonary arterial endothelial cell
    term:
      id: CL:1001568
      label: pulmonary artery endothelial cell
  downstream:
  - target: Pulmonary arterial hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

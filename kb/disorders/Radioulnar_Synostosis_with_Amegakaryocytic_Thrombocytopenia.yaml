- name: Dysregulation of the EVI1 HSC Maintenance Network
  biological_scale: MOLECULAR
  description: >
    The central node of the MECOM arm, and the point at which one molecular
    lesion becomes several tissue phenotypes. EVI1 does not maintain
    haematopoietic stem cells through a single target: it binds regulatory
    enhancers controlling a network of hundreds of genes, and modelling
    MECOM haploinsufficiency in primary human haematopoietic stem cells shows
    that network is required for stem-cell maintenance. Among its targets are
    GATA2, whose promoter EVI1 binds through the N-terminal zinc fingers, and
    MPL, the thrombopoietin receptor. EVI1 also prevents the CTCF-dependent
    genome reorganisation that normally accompanies differentiation, so the
    consequence of losing it is not simply reduced output of one factor.

    Read the magnitude carefully, because the phenotype is severe and the
    transcriptional change is not. The primary-human-HSC study describes a
    "high degree of similarity" in the single-cell transcriptome after MECOM
    perturbation and, on random permutation analysis, detected no
    differentially expressed genes at all. This node therefore asserts
    coordinated dysregulation of a defined network, not a wholesale collapse
    of transcription. That a small, coordinated shift produces an absence of
    stem cells is the interesting part, not an argument for a larger shift.
  molecular_functions:
  - preferred_term: EVI1 binding at haematopoietic stem cell enhancers
    term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: TGF-beta-mediated transcriptional response
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DYSREGULATED
  downstream:
  - target: Loss of EVI1 Transcriptional Control of MPL
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37610030
      reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrated that EVI1 controls the transcriptional regulation of MPL, a gene whose mutations are responsible for congenital amegakaryocytic thrombocytopenia (CAMT), potentially explaining the partial overlap between MECOM-AS and CAMT"
      explanation: >-
        Establishes MPL as an EVI1 target and names the clinical consequence
        this branch is curated to explain.
  - target: Hematopoietic Stem Cell Maintenance Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36522544
      reference_title: "A genetic disorder reveals a hematopoietic stem cell regulatory network co-opted in leukemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By generating a faithful model of this disorder in primary human HSCs and coupling functional studies with integrative single-cell genomic analyses, we uncover a key transcriptional network involving hundreds of genes that is required for HSC maintenance."
      explanation: >-

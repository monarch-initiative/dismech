      The range of severity and tempo across one seven-family cohort.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we are able to demonstrate that even with the same variant the age of onset and the severity of BMF is highly variable"
    explanation: >
      Establishes that the variability is not explained by allele identity,
      which is what makes prognostication from genotype unreliable here.

- name: B-Cell Developmental Arrest
  biological_scale: CELLULAR
  description: >
    A subset of MECOM patients have B-cell lymphopenia with
    hypogammaglobulinaemia, which has led to MECOM deficiency being classified
    as an inborn error of immunity as well as a marrow failure syndrome. The
    mechanism is unknown. What is notable is the co-segregation: in the largest
    series, B-cell deficiency and radioulnar synostosis were seen only in
    patients whose variants hit the same short C-terminal zinc-finger region -
    two features with no obvious relationship to one another, appearing and
    disappearing together with variant position.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell differentiation
    term:
      id: GO:0030183
      label: B cell differentiation
    modifier: DECREASED
  downstream:

- name: Hematopoietic Stem Cell Maintenance Failure
  biological_scale: CELLULAR
  description: >
    Haematopoietic stem cells are not maintained. The human phenotype modelled
    in primary HSCs is described as an early-onset absence of stem cells in
    vivo, which is what distinguishes this disease from the inherited marrow
    failure syndromes that declare themselves in later childhood or
    adolescence. The severity tracks gene dosage, and the consequence is
    multilineage rather than lineage-restricted - which is the main reason the
    "amegakaryocytic thrombocytopenia" half of the disease name understates
    what is happening.

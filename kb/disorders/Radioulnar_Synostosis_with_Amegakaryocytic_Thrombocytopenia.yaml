      A reported intracranial haemorrhage with a fatal outcome.

- category: Immunologic
  name: Decreased total B cell count
  description: >
    B-cell lymphopenia, reported in a subset and sufficient for MECOM
    deficiency to be classified as an inborn error of immunity alongside its
    marrow phenotype. It co-segregates with radioulnar synostosis by variant
    region.
  phenotype_term:
    preferred_term: Decreased total B cell count
    term:
      id: HP:0010976
      label: Decreased total B cell count
  sequelae:
  - target: Recurrent infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37610030
      reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical phenotype may also include finger malformations, cardiac and renal alterations, hearing loss, B-cell deficiency and predisposition to infections."
      explanation: >-
        Lists B-cell deficiency and infection susceptibility together. Graded
        INDIRECT_UNKNOWN_INTERMEDIATES because the source groups them rather
        than demonstrating that the B-cell defect is what drives the infections;
        neutropenia from the same marrow failure is a competing contributor.
  evidence:
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "B-cell lymphopenia and hypogammaglobulinemia have been described in a subset of patients with MECOM deficiency."
    explanation: >
      Direct statement of the B-cell phenotype and its partial penetrance.

- category: Immunologic
  name: Decreased circulating immunoglobulin concentration
  description: >
    Hypogammaglobulinaemia accompanying the B-cell lymphopenia. Worth measuring
    in any RUSAT patient, since it is actionable independently of the marrow
    disease.
  phenotype_term:
    preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "B-cell lymphopenia and hypogammaglobulinemia have been described in a subset of patients with MECOM deficiency."
    explanation: >
      Names hypogammaglobulinaemia in the same subset as the B-cell
      lymphopenia.

- category: Immunologic
  name: Recurrent infections
  description: >
    Predisposition to infection follows the B-cell deficiency, and is
    compounded by neutropenia once the marrow failure becomes multilineage.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:37610030
    reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype may also include finger malformations, cardiac and renal alterations, hearing loss, B-cell deficiency and predisposition to infections."
    explanation: >
      Lists predisposition to infection among the recognised features.

- category: Skeletal
  name: Clinodactyly
  description: >
    Curvature of a digit, most often the fifth finger, reported in a minority
    across several series. It belongs with the synostosis as part of a limb
    developmental phenotype rather than as an incidental finding: the founding
    MECOM paper attributes forelimb and finger development to EVI1 in the same
    sentence.
  phenotype_term:
    preferred_term: Clinodactyly
    term:
      id: HP:0030084
      label: Clinodactyly
  evidence:
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within our full MECOM-associated syndrome cohort, skeletal abnormalities included radioulnar synostosis (n=5), clinodactyly (n=3), and radial hypoplasia (n=1)"
    explanation: >
      Counts clinodactyly in an eight-patient cohort.
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture included radioulnar synostosis, bone marrow failure, clinodactyly, cardiac and renal malformations, B-cell deficiency, and presenile hearing loss."
    explanation: >
      Independent confirmation in the twelve-patient series.

- category: Auditory
  name: Sensorineural Hearing Impairment
  description: >
    Described as presenile hearing loss, and reported in independent cohorts.
    Because it can appear later than the haematological presentation, it is a
    reason to keep audiological follow-up in the care plan of a child whose
    marrow disease has been cured by transplant.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture included radioulnar synostosis, bone marrow failure, clinodactyly, cardiac and renal malformations, B-cell deficiency, and presenile hearing loss."
    explanation: >
      Names presenile hearing loss among the syndrome's features.
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Extra-hematopoietic manifestations of MECOM deficiency, including renal and cardiac anomalies, radioulnar synostosis, clinodactyly, and hearing loss, have been reported."
    explanation: >
      Independent confirmation, grouped with the other extra-haematopoietic
      features.

- category: Cardiovascular
  name: Ventricular Septal Defect
  description: >
    Cardiac malformations are recurrent in MECOM-associated syndrome and match
    the expression pattern - the factor is expressed at high levels in the
    embryonic heart. A ventricular septal defect is the specific lesion
    recorded in a North American cohort, alongside patent ductus arteriosus,
    patent foramen ovale and more complex outflow anomalies.
  phenotype_term:
    preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture included radioulnar synostosis, bone marrow failure, clinodactyly, cardiac and renal malformations, B-cell deficiency, and presenile hearing loss."
    explanation: >
      Cardiac malformation as a recognised feature of the syndrome.
  - reference: PMID:41617498
    reference_title: "Expanding the phenotypic spectrum of MECOM-associated syndrome: rare variants are associated with syndromic pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "11 individuals had severe or mild thrombocytopenia, 9 had skeletal issues, 8 had cardiac anomalies, 6 had PAH and 10 had additional conditions."
    explanation: >
      Quantifies cardiac anomalies in a 15-person series.
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiac/vascular [patent ductus arteriosus (n=2), patent foramen ovale (n=2), ventricular septal defect, aortic root dilation, interrupted aortic arch, truncus arteriosus, single umbilical artery, (n=1 each)]"
    explanation: >
      Names the ventricular septal defect specifically, alongside the other
      cardiac lesions seen in the same cohort. This is the source for the
      lesion list in the description above.

- category: Cardiovascular
  name: Pulmonary arterial hypertension
  description: >
    A 2026 addition to the phenotype, reported in 6 of 15 individuals in a
    series assembled through GeneMatcher after MECOM had been nominated as a
    paediatric PAH candidate gene. That ascertainment route inflates the
    apparent frequency, so the 6-of-15 figure should not be read as a
    population estimate; what it establishes is that the association exists and
    that PAH is worth looking for. MECOM is expressed principally in pulmonary
    arterial endothelial cells, which gives it a plausible route independent of
    the marrow.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  evidence:
  - reference: PMID:41617498
    reference_title: "Expanding the phenotypic spectrum of MECOM-associated syndrome: rare variants are associated with syndromic pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "11 individuals had severe or mild thrombocytopenia, 9 had skeletal issues, 8 had cardiac anomalies, 6 had PAH and 10 had additional conditions."
    explanation: >
      The count of pulmonary arterial hypertension within the series that
      reported the association.

- category: Renal
  name: Renal Malformation
  description: >
    Renal anomalies - hypoplastic, malrotated, or with renal insufficiency -
    recur across cohorts, again matching the expression pattern: MECOM is
    highly expressed in the developing urinary tract. Bound at kidney level
    rather than to a specific lesion because the reported lesions differ
    between patients - hypoplastic, malrotated, small, agenetic, plus renal
    insufficiency - and no single one is characteristic. The variability is
    within the kidney, so the broader urinary-system term would be a level too
    general.
  phenotype_term:
    preferred_term: Renal malformation
    term:
      id: HP:0000077
      label: Abnormality of the kidney
  evidence:
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Extra-hematopoietic manifestations of MECOM deficiency, including renal and cardiac anomalies, radioulnar synostosis, clinodactyly, and hearing loss, have been reported."
    explanation: >
      Names renal anomalies among the extra-haematopoietic features.
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture included radioulnar synostosis, bone marrow failure, clinodactyly, cardiac and renal malformations, B-cell deficiency, and presenile hearing loss."
    explanation: >
      Independent confirmation in the twelve-patient series.
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "renal insufficiency (n=1), malrotated and hypoplastic kidney (n=1)"
    explanation: >
      The specific renal lesions behind the general binding: they differ
      between patients, which is why the general urinary-system term is used.

- category: Growth
  name: Failure to Thrive
  description: >
    Reported in a minority alongside developmental delay in the cohort that
    most broadened the non-haematological phenotype. Recorded because it is
    part of what brings these infants to attention: most were identified under
    two years of age with multiple malformations rather than with an isolated
    blood count abnormality.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired growth or development [failure to thrive (n=2), developmental delay (n=4), hypotonia (n=1), hearing loss (n=2)]"
    explanation: >
      Names failure to thrive and counts it, 2 of 8, in this cohort. No
      `frequency` is set from a denominator of eight in one series.

- category: Neurologic
  name: Global Developmental Delay
  description: >
    Developmental delay was the commonest non-haematological, non-malformation
    finding in the eight-patient North American cohort. It is not a feature of
    the original RUSAT description and belongs to the broader
    MECOM-associated-syndrome phenotype.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired growth or development [failure to thrive (n=2), developmental delay (n=4), hypotonia (n=1), hearing loss (n=2)]"
    explanation: >
      Names developmental delay and counts it, 4 of 8 - the commonest
      non-haematological finding in this cohort. No `frequency` is set from a
      single eight-patient series.

- category: Skeletal
  name: Patellar Aplasia or Hypoplasia
  description: >
    Absent or small patellae, in 3 of the same 15-person cohort that supplies
    the aortic dilatation figure - bilateral absent patellae in one individual,
    documented radiographically in that paper's own figure, and small patellae
    in two more. Patellar hypoplasia and aplasia are a recognised and
    distinctive part of the MECOM skeletal phenotype, and they are worth
    looking for precisely because nothing draws attention to them: unlike the
    forearm, a small patella causes no obvious functional complaint in
    infancy.

    Bound to the combined aplasia/hypoplasia term because the cohort reports
    both severities and no single one is characteristic.
  phenotype_term:
    preferred_term: Patellar aplasia or hypoplasia
    term:
      id: HP:0006498
      label: Aplasia/Hypoplasia of the patella
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proximal RUS, hypoplastic thumbs, short, broad fingers, short fifth digits, and coalition of right capitate and hamate, and bilateral absent patellae"
    explanation: >
      The aplastic end of the finding, in the individual whose forearm
      radiograph the same paper reproduces. Quoted in full rather than clipped
      to the patellar clause, because the surrounding list is the point: the
      patellar finding sits inside a broader skeletal phenotype in the same
      person, alongside the proximal synostosis this entry is named for.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Club foot and small patellae"
    explanation: >
      The hypoplastic end of the finding in a second individual, which is why
      the binding covers both severities.

- category: Cardiovascular
  name: Aortic Root Dilatation
  description: >
    Reported in 3 of 15 individuals in one cohort, with one progressing to an
    aneurysm large enough to meet the threshold for surgical correction. Worth
    separating from the septal defects: those are static congenital lesions,
    while aortic dilatation is progressive and needs surveillance rather than a
    single echocardiogram. The same cohort notes that only one case each of
    aortic coarctation and aortic root dilatation had been reported before,
    so this is a recent addition to the phenotype and its frequency is not
    established.
  phenotype_term:
    preferred_term: Aortic root dilatation
    term:
      id: HP:0002616
      label: Aortic root aneurysm
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have observed 3 cases of aortic dilatation, with 1 progressing to an aortic aneurysm reaching the threshold for surgical correction in our cohort of 15 cases."
    explanation: >
      The count, the progression, and the denominator in one sentence.

animal_models:
- name: Evi1 H752R knock-in mouse
  species: Mouse
  genotype: Mecom c.2255A>G knock-in, translating to EVI1 p.H752R / MDS1-EVI1 p.H942R (the mouse orthologue of a human RUSAT allele)
  publication: PMID:37099686
  description: >
    The only RUSAT animal model. It carries the mouse equivalent of a human
    RUSAT variant at the orthologous residue, which is what makes it worth
    taking seriously as a model of this disease rather than of MECOM loss in
    general - the previous mice were exonic deletions. Homozygotes die at
    embryonic day 10.5 to 11.5, so the model is necessarily heterozygous, which
    matches the human genotype.
  evidence:
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mutant mice died at embryonic day 10.5 to 11.5."
    explanation: >-
      Establishes the constraint that makes this a heterozygous model, which is
      also the human genotype.
  modeled_mechanisms:
  - target: Hematopoietic Stem Cell Maintenance Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Heterozygotes lose haematopoietic stem and progenitor cells and recover
      poorly from myelosuppression, which is the stem-cell deficit this node
      asserts.
    limitations: >-
      Fidelity is held at MODERATE on timing rather than direction. The human
      disease is congenital; the mouse HSPC decrease is detected at 8 to 12
      weeks and its platelet defect only after 16 weeks, and only in males. The
      model therefore reproduces the deficit but not its onset, and cannot
      speak to the neonatal presentation that defines the human disease.
    readouts:
    - name: Bone marrow HSPC frequency
      target: Hematopoietic Stem Cell Maintenance Failure
      direction: DECREASED
      interpretation: Direct flow-cytometric measurement of the stem and progenitor compartment.
      evidence:
      - reference: PMID:37099686
        reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Flow cytometric analysis of bone marrow cells revealed a decrease in HSPCs in Evi1KI"
        explanation: Reports the measured decrease in the stem and progenitor compartment.
    - name: Haematopoietic recovery after 5-fluorouracil myelosuppression
      target: Hematopoietic Stem Cell Maintenance Failure
      direction: DECREASED
      interpretation: >-
        A stress test of stem-cell reserve. Delayed recovery is the functional
        counterpart of the reduced HSPC count and is the more informative of
        the two, since it measures capacity rather than frequency.
      evidence:
      - reference: PMID:37099686
        reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, Evi1KI/+ mice showed delayed leukocyte and platelet recovery after 5-fluorouracil-induced myelosuppression."
        explanation: Functional demonstration of reduced regenerative capacity.
    evidence:
    - reference: PMID:37099686
      reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings suggest that Evi1KI/+ mice recapitulate the bone marrow dysfunction in RUSAT, similar to that caused by loss-of-function Mecom alleles."
      explanation: >-
        The authors' own assessment that the model is informative for the marrow
        arm of the disease.
  - target: Failure of Proximal Radioulnar Joint Separation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      The mouse has normal forelimbs. Carrying the orthologous patient allele
      is not sufficient to produce radioulnar synostosis in a mouse, so this
      model cannot be used to study the skeletal arm of the disease and its
      silence is not evidence that the human variant does not cause the
      synostosis.
    limitations: >-
      Two readings are open and this model cannot distinguish them: either the
      mouse forelimb does not require Evi1 the way the human forearm requires
      MECOM, or the germline heterozygote does not reach a dose or timing
      threshold that the human embryo does. Mouse and human zeugopod
      segmentation differ in tempo and in the relative timing of joint
      cavitation, so a negative skeletal result in a viable heterozygote is
      weak evidence either way. See the `rusat_mouse_no_synostosis` discussion.
    readouts:
    - name: Presence of radioulnar synostosis
      target: Failure of Proximal Radioulnar Joint Separation
      direction: UNCHANGED
      interpretation: >-
        A real negative result, recorded as UNCHANGED rather than omitted: the
        forelimbs were examined and were normal.
      evidence:
      - reference: PMID:37099686
        reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Heterozygous mutant mice (Evi1KI/+ mice) grew normally without radioulnar synostosis."
        explanation: >-
          SUPPORT, because the claim being evidenced is the readout that the
          forelimbs were normal. The negative result is the finding; the
          evidence agrees with it.
    evidence:
    - reference: PMID:37099686
      reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous mutant mice (Evi1KI/+ mice) grew normally without radioulnar synostosis."
      explanation: >-
        SUPPORT for the FAILS_TO_RECAPITULATE claim this link makes. The
        direction is easy to get backwards: the claim is that the model does
        not reproduce the lesion, and normal forelimbs is evidence for that
        claim, not against it.

experimental_models:
- name: MECOM-haploinsufficient primary human hematopoietic stem cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >
    Primary human haematopoietic stem cells engineered to model MECOM
    haploinsufficiency, combined with single-cell genomics. This is the system
    that turned the disease from a gene assignment into a mechanism: it is
    where the EVI1-dependent maintenance network was defined, and it works in
    the species that has the disease, which the knock-in mouse does not.
  evidence:
  - reference: PMID:36522544
    reference_title: "A genetic disorder reveals a hematopoietic stem cell regulatory network co-opted in leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we have studied a rare genetic disorder due to MECOM haploinsufficiency, characterized by an early-onset absence of HSCs in vivo."
    explanation: >-
      Establishes that this system was built to model this disorder.
  modeled_mechanisms:
  - target: Dysregulation of the EVI1 HSC Maintenance Network
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Reproduces the human haploinsufficient state in human stem cells and
      reads out the transcriptional network directly.
    limitations: >-
      An engineered haploinsufficiency rather than the patient allelic
      spectrum, so it models dose reduction and cannot address whether the
      zinc-finger 8/9 missense alleles do anything a null does not - which is
      exactly the question the two competing hypotheses in this entry turn on.
      It is also a cell-autonomous system with no marrow niche and no limb.
    readouts:
    - name: HSC maintenance transcriptional network expression
      target: Dysregulation of the EVI1 HSC Maintenance Network
      direction: ALTERED
      interpretation: >-
        Single-cell genomic definition of the gene network EVI1 maintains.
      evidence:
      - reference: PMID:36522544
        reference_title: "A genetic disorder reveals a hematopoietic stem cell regulatory network co-opted in leukemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "By generating a faithful model of this disorder in primary human HSCs and coupling functional studies with integrative single-cell genomic analyses, we uncover a key transcriptional network involving hundreds of genes that is required for HSC maintenance."
        explanation: The network readout that this model exists to produce.
    evidence:
    - reference: PMID:36522544
      reference_title: "A genetic disorder reveals a hematopoietic stem cell regulatory network co-opted in leukemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we have studied a rare genetic disorder due to MECOM haploinsufficiency, characterized by an early-onset absence of HSCs in vivo."
      explanation: >-
        Establishes that the system models this disorder specifically.

genetic:
- name: MECOM
  gene_term:
    preferred_term: MECOM
    term:
      id: hgnc:3498
      label: MECOM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    MECOM, the MDS1 and EVI1 complex locus, encodes several transcription
    factor isoforms of which EVI1 - a 1051-amino-acid protein with seven
    N-terminal and three C-terminal zinc fingers - is the best characterised.
    Germline heterozygous variants cause disease; the RUSAT-producing alleles
    are missense changes in zinc fingers 8 and 9, while nonsense, frameshift,
    splice and whole-gene-deletion alleles cause marrow failure without
    synostosis. Across the literature, missense changes account for roughly
    two-thirds of reported variants. The same gene is a well-known oncogene
    when somatically overexpressed, which is the opposite direction of effect
    from the germline mechanism here.
  review_notes: >-
    `relationship_type: CAUSATIVE` is well supported: de novo variants in
    trio-sequenced probands, dominant segregation in several families,
    recurrence of the same alleles across unrelated families, a knock-in mouse
    reproducing the haematopoietic phenotype, and a primary-human-HSC model
    defining the mechanism. No ClinGen gene-disease validity assertion for
    MECOM in RUSAT is cited here.
  evidence:
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent analysis of MECOM in two other individuals with RUSAT revealed two additional missense mutations."
    explanation: >
      Independent replication beyond the index trio in the founding report.
  - reference: PMID:40170114
    reference_title: "A novel MECOM gene variant causes severe thrombocytopenia in a neonate: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A comprehensive review of literature indicated that MECOM gene mutations included missense (68.3%), deletion (8.5%), splice site (8.5%), frameshift (7.3%), and nonsense (7.3%) mutations."
    explanation: >
      The variant-class distribution across the published literature.
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As each subject presented with unique MECOM variants, the series failed to demonstrate clear genotype-to-phenotype correlation but may suggest a role for additional modifiers that affect gene expression and subsequent phenotype."
    explanation: >
      A necessary counterweight to the variant-class pattern curated elsewhere
      in this entry. The domain-level split between synostosis and no
      synostosis is well supported, but within it, individual variants do not
      predict individual phenotypes, and this cohort says so.

- name: HOXA11
  gene_term:
    preferred_term: HOXA11
    term:
      id: hgnc:5101
      label: HOXA11
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    HOXA11 is a posterior HOX homeodomain transcription factor with roles in
    forelimb zeugopod patterning and in haematopoiesis - the same dual
    requirement that makes MECOM a RUSAT gene. Exactly one disease allele is
    known, a frameshift truncating the homeodomain, in six individuals from two
    families. The protein retains its interaction with the cofactor Meis1b but
    loses DNA binding.
  review_notes: >-
    `relationship_type: CAUSATIVE` is retained on the strength of segregation in
    two families plus functional characterisation of the allele, but a reviewer
    should know how thin the base is: two families, no new family in 25 years,
    and a negative HOXA11 screen in a later seven-family RUS cohort. There is no
    ClinGen gene-disease validity assertion cited here for HOXA11 in RUSAT. If
    one exists and grades this below Definitive, this field should be revisited
    rather than defended.
  evidence:
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous HOXA11 mutation has been identified in two unrelated families as a cause of RUSAT."
    explanation: >
      States the gene-disease relationship and its evidential base of two
      families.
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, HOXA11 mutations are absent in a number of individuals with RUSAT, which suggests that other genetic loci contribute to RUSAT."
    explanation: >
      The limit on HOXA11's share of the disease, from the paper that found the
      second gene.

variants:
- name: MECOM p.Arg750Trp
  description: >-
    Numbering note before anything else: p.Arg750Trp is EVI1 numbering
    (NP_001098548.2, transcript NM_001105078). The MDS1-EVI1 isoform adds 188
    residues at the N-terminus, so the same allele appears in some cohorts as
    p.Arg938Gln-style MDS1-EVI1 coordinates. Two numbering systems for one gene
    is a live source of confusion in this literature.

    The recurrent RUSAT allele, and the most informative one for expressivity.
    It was the index variant in the founding MECOM report and recurred in three
    further families in a later cohort. Across six families carrying it, five
    were de novo with very early presentation and all required transplant,
    while the sixth showed dominant inheritance and progressed from aplastic
    anaemia to myelodysplastic syndrome in adulthood. Same allele, two very
    different clinical courses.
  gene:
    preferred_term: MECOM
    term:
      id: hgnc:3498
      label: MECOM
  type: SNV
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observe that theMECOMvariant p.Arg750Trp is a recurrent change that can present with a variety of hematological defects in association with RUS."
    explanation: >-
      Names the recurrent allele and its variable presentation. The gene symbol
      runs into the surrounding words in the cached full text; that is a
      formatting artefact of the source, not a transcription error.

- name: HOXA11 p.Asn291ThrfsX3
  description: >-
    The single RUSAT1 allele, c.872delA, causing a frameshift and premature
    truncation of HOXA11. Found in six individuals from two families and never
    reported again. Functional work shows the truncated protein loses DNA
    binding while retaining its interaction with Meis1b.
  gene:
    preferred_term: HOXA11
    term:
      id: hgnc:5101
      label: HOXA11
  type: DELETION
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterozygous variant c.872delA, p.Asn291ThrfsX3 was identified in six individuals from two families"
    explanation: >-
      The allele, its consequence, and the number of carriers.

treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >
    The only established curative treatment for the marrow failure, and the
    treatment most reported RUSAT patients receive. A retrospective series of
    six infants transplanted between 4 and 18 months of age with
    reduced-intensity conditioning - fludarabine, cyclophosphamide or
    melphalan, and rabbit anti-thymocyte globulin, with or without low-dose
    irradiation - reported that all survived with stable engraftment and full
    donor chimerism, no severe regimen-related toxicity, and only low-grade
    acute graft-versus-host disease.

    Two limits a reader should carry. Transplant replaces the haematopoietic
    compartment and does nothing for the synostosis, the hearing loss, the
    renal or cardiac anomalies, or the aortic dilatation, all of which are
    outside the graft and need their own follow-up. And within the series
    itself, the three children given low-dose irradiation were relatively short
    compared with the three who were not - a small, uncontrolled comparison,
    but the authors raise it as a reason to question routine irradiation rather
    than as an established late effect.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hematopoietic Stem Cell Maintenance Failure
    description: >-
      Replaces the MECOM-deficient stem cell compartment with donor cells that
      carry two functional alleles. It corrects the node rather than
      compensating for it, which is why it is curative for the marrow arm and
      irrelevant to every other arm.
    evidence:
    - reference: PMID:36515795
      reference_title: "Reduced-intensity conditioning is effective for allogeneic hematopoietic stem cell transplantation in infants with MECOM-associated syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients survived and achieved stable engraftment and complete chimerization with the donor type."
      explanation: >-
        Full donor chimerism is the demonstration that the deficient
        compartment has been replaced.
  evidence:
  - reference: PMID:36515795
    reference_title: "Reduced-intensity conditioning is effective for allogeneic hematopoietic stem cell transplantation in infants with MECOM-associated syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, allogeneic HSCT with RIC is an effective and feasible treatment for infants with MECOM-associated syndrome."
    explanation: >
      The series conclusion, in a cohort of six infants.
  - reference: PMID:36515795
    reference_title: "Reduced-intensity conditioning is effective for allogeneic hematopoietic stem cell transplantation in infants with MECOM-associated syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients received a reduced-intensity conditioning (RIC) regimen consisting of fludarabine, cyclophosphamide or melphalan, and rabbit anti-thymocyte globulin and/or low-dose total body/thoracic-abdominal/total lymphoid irradiation, followed by allogeneic bone marrow or cord blood transplantation from unrelated donors"
    explanation: >
      The regimen and the age window, which is the operationally useful detail.
  - reference: PMID:36515795
    reference_title: "Reduced-intensity conditioning is effective for allogeneic hematopoietic stem cell transplantation in infants with MECOM-associated syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients treated with low-dose irradiation had relatively short stature compared to three patients not treated with irradiation."
    explanation: >
      The late-effect signal, recorded with its three-against-three denominator
      visible so nobody reads it as an established outcome.
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Those infants with MECOM-associated bone marrow failure require HSC transplantation for survival."
    explanation: >
      Independent statement that transplant is required rather than optional at
      the severe end.

- name: Platelet Transfusion
  description: >
    Supportive management of the thrombocytopenia, and the mainstay before
    transplant. In one reported neonate, multiple platelet transfusions carried
    the child through the neonatal period until spontaneous recovery - which is
    a real course in this disease and a reason not to treat early transfusion
    dependence as proof that transplant is inevitable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Thrombocytopenia
    description: >-
      Replaces the missing platelets. Purely compensatory: it does nothing to
      the megakaryocyte arrest upstream of it.
    evidence:
    - reference: PMID:38662475
      reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neonatal thrombocytopenia managed with multiple platelet transfusions followed by spontaneous recovery"
      explanation: >-
        Documents transfusion support of the thrombocytopenia in a reported
        patient.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal thrombocytopenia managed with multiple platelet transfusions followed by spontaneous recovery"
    explanation: >
      The one quotable account of transfusion management in this disease, and
      of the spontaneous recovery that followed it.

- name: Surgical Correction of Radioulnar Synostosis
  description: >
    Reported in a single carrier, corrected at age four. Curated because the
    functional deficit is permanent otherwise and because it establishes that
    the orthopaedic arm of the disease is managed separately from the
    haematological arm - this child had bilateral synostosis and no
    haematological abnormality at all.

    The evidence base is one patient in a genotype-phenotype table, not an
    outcome series, so this entry states no indication, no technique and no
    result - including no claim about whether the proximal joint is restored,
    which nothing cited here supports. Congenital radioulnar
    synostosis has its own general orthopaedic literature; nothing in it is
    RUSAT-specific and none of it is cited here.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical correction of radioulnar synostosis
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Limited pronation and supination of the forearm
    description: >-
      Targets the functional consequence rather than the malformation. This
      entry does not state what the operation achieves: the single cited case
      records only that correction was performed at age four, with no technique
      and no outcome, and the general congenital-radioulnar-synostosis surgical
      literature is not cited here.
    evidence:
    - reference: PMID:38662475
      reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bilateral RUS-surgically corrected at age 4"
      explanation: >-
        The one reported instance of surgical correction in a MECOM carrier.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral RUS-surgically corrected at age 4"
    explanation: >
      Establishes that surgical correction is done in this population. A single
      tabulated case; no outcome is claimed.

- name: Genetic Counseling and Cascade Testing
  description: >
    Autosomal dominant transmission gives a 50% recurrence risk per pregnancy,
    but the counselling problem in this disease is that the risk figure is the
    easy part. Expressivity within a family runs from a fixed forearm with
    normal counts to transfusion dependence in infancy, and somatic reversion
    can hide the phenotype in a carrier parent, so a genotype does not predict
    a course.

    One further finding belongs in the counselling conversation and is flagged
    as preliminary in its own source: in one cohort, 12 of 16 pregnancies in
    five mothers with detailed histories ended in loss, against a quoted
    general-population rate of 15-25%. See the `rusat_pregnancy_loss`
    discussion for why this is not yet a risk figure.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the high rate of pregnancy losses in these families, they should be considered for counseling for reproductive planning and the use of preimplantation genetic diagnosis to reduce the risk of future pregnancy losses."
    explanation: >
      The source's own counselling recommendation, including the reproductive
      option it names.
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of the expanded hematologic and non-hematologic clinical features allows for rapid molecular diagnosis, early identification of life-threatening complications, and improved genetic counseling for families."
    explanation: >
      Links the expanded phenotype directly to the counselling task.

diagnosis:
- name: Complete Blood Count and Bone Marrow Examination
  description: >
    The blood count finds the thrombocytopenia; the marrow tells you what kind
    it is. Absent or severely reduced megakaryocytes with a hypocellular marrow
    is what separates a production failure from immune or alloimmune
    destruction in a neonate, and it is the finding that should stop
    immunoglobulin and steroids being given for an inherited marrow failure.
    Serial counts matter, because lineage involvement evolves in both
    directions - towards pancytopenia in most, and towards spontaneous recovery
    in some.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypocellular bone marrow with complete absence of megakaryocytes, dyserythropoiesis and left shifted granulopoiesis with abnormal granulation"
    explanation: >
      The marrow picture, described in a reported patient.

- name: Bilateral Forearm Radiography
  description: >
    Radiographs of both forearms to look for proximal radioulnar fusion. Worth
    doing even when there is no visible deformity, because the external
    appearance can be unremarkable and the restriction subtle enough that an
    affected adult has never noticed it - one reported patient's synostosis was
    inferred from limited bilateral pronation rather than diagnosed
    radiographically. The test is worth doing for what it rules in, not for
    what it rules out: a normal forearm does not exclude the disease.
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs of the radius and ulna fusions from families 4–6 (Figure 1), show all cases have a very similar radiological appearance."
    explanation: >
      Establishes that the radiographic appearance is consistent enough to be
      recognised across families.

- name: Germline Molecular Genetic Testing of MECOM and HOXA11
  description: >
    Confirmatory, and in practice the only way the diagnosis is made -
    essentially every reported RUSAT2 case was identified by next-generation
    sequencing. Test both genes, and include copy-number analysis: whole-gene
    and partial MECOM deletions cause disease and are missed by sequencing
    alone. Trio exome or genome sequencing is what has actually found these
    patients, including the perinatal cases in whom the syndrome was never
    suspected clinically.
  evidence:
  - reference: PMID:38245683
    reference_title: "A novel missense mutation in the MECOM gene in a Chinese boy with radioulnar synostosis with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, all reported RUSAT-2 cases were diagnosed through next generation sequencing and most of them received HSCT."
    explanation: >
      States that sequencing is how this diagnosis is made in practice.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including two deletions that either remove the MDS1 part of the complex or the entire gene region"
    explanation: >
      Documents partial and whole-gene MECOM deletions as disease-causing,
      which is why copy-number analysis belongs alongside sequencing rather
      than as an afterthought.
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, they support the use of a broad sequencing approach for perinatal diagnosis, as MECOM is absent from available targeted gene panels for hydrops, and highlight the importance of postmortem genomic investigation."
    explanation: >
      The specific reason to prefer broad sequencing over a targeted panel in
      the perinatal presentation.

- name: Germline Testing on Non-Hematopoietic Tissue
  description: >
    The one diagnostic step in this entry that follows from a mechanism rather
    than from convention, and the one most easily skipped. Somatic reversion by
    3q copy-neutral loss of heterozygosity expands a clone that has lost the
    mutant allele, so in a carrier whose counts have recovered, blood can be a
    misleading germline sample and the causative variant can be under-called or
    missed. Use cultured skin fibroblasts or hair follicles instead. The same
    caution applies after transplant, when circulating cells are the donor's.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the notable prevalence of somatic genetic rescue reiterates the importance of using DNA from nonhematopoietic tissue such as hair follicles or skin fibroblasts for genetic testing"
    explanation: >
      States both the reason and the recommended tissue sources.

- name: Immunological Evaluation
  description: >
    B-cell count and immunoglobulins, because B-cell deficiency is part of the
    syndrome, is actionable on its own, and would otherwise be found only after
    an infection. It also carries diagnostic weight: B-cell deficiency
    segregates with the same zinc-finger region as the synostosis, so finding
    it alongside a fixed forearm strengthens the case for a variant in that
    region.
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radioulnar synostosis and B-cell deficiency were observed only in patients with mutations affecting a short region in the C-terminal zinc finger domain of EVI1."
    explanation: >
      The co-segregation that gives the immunological workup diagnostic value
      beyond its own management implications.

differential_diagnoses:
- name: Congenital Amegakaryocytic Thrombocytopenia
  description: >
    The closest mimic, and mechanistically the most interesting one. CAMT is
    caused by biallelic MPL variants and presents identically in a neonate:
    congenital thrombocytopenia, an amegakaryocytic marrow, progression to
    pancytopenia, cure only by transplant. The overlap may not be coincidental
    - EVI1 transcriptionally regulates MPL, so the two diseases may converge on
    the same receptor from opposite ends of the same regulatory relationship.
  distinguishing_features: 
  - >-
    Inheritance separates them cleanly: CAMT is autosomal recessive, RUSAT
    autosomal dominant, so a de novo heterozygous variant or an affected parent
    points away from CAMT. Radioulnar synostosis, when present, is decisive -
    but it is present in only some RUSAT patients, so its absence separates
    nothing. In practice a panel containing both MPL and MECOM settles it, which
    is why both genes belong on the same test.
  evidence:
  - reference: PMID:37610030
    reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrated that EVI1 controls the transcriptional regulation of MPL, a gene whose mutations are responsible for congenital amegakaryocytic thrombocytopenia (CAMT), potentially explaining the partial overlap between MECOM-AS and CAMT"
    explanation: >
      Names both the clinical overlap and the proposed mechanistic basis for
      it.

- name: Thrombocytopenia-Absent Radius Syndrome
  description: >
    The other congenital thrombocytopenia with a forearm malformation, and the
    one RUSAT is most likely to be confused with on a description rather than
    an image. TAR is caused by a rare RBM8A null allele in trans with a common
    hypomorphic regulatory variant.
  distinguishing_features: 
  - >-
    The bone lesion is different in kind, not degree. TAR is a bilateral
    absence of the radius with the thumbs preserved - a reduction defect. RUSAT
    is a fusion of two present bones at the proximal joint, with the radius
    intact. A single forearm radiograph separates them. The genetics diverge
    too: TAR requires a rare null allele together with a low-frequency
    regulatory variant on the other chromosome, so it does not segregate as a
    simple dominant the way RUSAT does. HOXA11 is not the TAR gene, and was
    excluded as such directly. This entry makes no claim about the comparative
    natural history of the two thrombocytopenias - no source cited here
    compares them.
  evidence:
  - reference: PMID:22366785
    reference_title: "Compound inheritance of a low-frequency regulatory SNP and a rare null mutation in exon-junction complex subunit RBM8A causes TAR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound inheritance of a rare null allele and one of two low-frequency SNPs in the regulatory regions of RBM8A, encoding the Y14 subunit of EJC, causes TAR."
    explanation: >
      The TAR genotype this differential asserts, and the contrast with RUSAT's
      simple heterozygous dominant inheritance.
  - reference: PMID:11841440
    reference_title: "Absence of mutations in the HoxA10, HoxA11 and HoxD11 nucleotide coding sequences in thrombocytopenia with absent radius syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in the coding sequence of the Hox genes known to affect radial development are not a common cause of TAR syndrome"
    explanation: >
      Excludes the RUSAT1 gene as a cause of TAR, which is what makes these two
      genuinely separate entities rather than one spectrum.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital radioulnar synostosis (RUS) is a rare developmental abnormality involving fusion of the bones of the forearms (radius and ulna) preventing normal supination of the affected forearm"
    explanation: >
      The RUSAT lesion is a fusion of present bones, which is the contrast with
      TAR's absent radius.

- name: Syndromic and Isolated Congenital Radioulnar Synostosis
  description: >
    Radioulnar synostosis occurs on its own and as a feature of other
    syndromes, including aneuploidies and skeletal dysplasias, without any
    haematological disease. Someone presenting to orthopaedics with a fixed
    forearm and a normal blood count is much more likely to have one of these
    than RUSAT.
  distinguishing_features: 
  - >-
    A blood count is the discriminator, and it should be repeated rather than
    taken once: the haematological onset in MECOM disease ranges from in utero
    to late adulthood, so a normal count in childhood does not exclude it.
    Conversely a RUSAT variant can present as isolated synostosis with no
    haematological abnormality at all, so the two groups genuinely overlap and
    sequencing is what separates them.
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RUS can occur with other abnormalities in the skeleton, heart, urinary tract, as well as aneuploid syndromes."
    explanation: >
      Establishes the non-haematological causes of the same bone lesion.
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical spectrum ranged from isolated radioulnar synostosis with no or mild hematological involvement to severe bone marrow failure without obvious skeletal abnormality"
    explanation: >
      The reason the two groups overlap: a MECOM variant can give synostosis
      with no blood disease.

- name: Fanconi Anemia
  description: >
    The inherited marrow failure syndrome that also puts a radial-ray
    abnormality next to a failing marrow, and the one most likely to be tested
    for first in a child with both. It is a DNA interstrand crosslink repair
    disorder, mechanistically unrelated to a transcription-factor
    haploinsufficiency.
  distinguishing_features: 
  - >-
    Chromosome breakage testing separates them: it is positive in Fanconi
    anaemia and normal in RUSAT. Note the asymmetry - a normal breakage test
    argues against Fanconi anaemia but establishes nothing about RUSAT, which
    has no functional confirmatory assay of its own and rests entirely on
    sequencing. The bone lesions also differ: Fanconi anaemia gives radial ray
    reduction defects, often with an absent or hypoplastic thumb, while RUSAT
    gives a proximal fusion with both bones present.
  evidence:
  - reference: PMID:20301575
    reference_title: "Fanconi Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased chromosome breakage and radial forms on cytogenetic testing of"
    explanation: >
      The chromosome-breakage test this differential turns on, from the
      GeneReviews chapter for the comparator disease. It establishes what a
      positive result means for Fanconi anaemia and says nothing about RUSAT,
      which is exactly the asymmetry the distinguishing features record.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic genetic rescue has been reported in several genetic diseases including skin disorders (eg, ichthyosis with confetti9 and epidermolysis bullosa10) and BMF syndromes (eg, Fanconi anemia,11 Diamond Blackfan anemia,12 Wiskott-Aldrich syndrome,13 and dyskeratosis congenita14), with only 1 report in MECOM-associated syndrome."
    explanation: >
      Places RUSAT among the inherited marrow failure syndromes that Fanconi
      anaemia belongs to, and records that somatic reversion - the phenomenon
      curated in this entry's pathograph - is shared across that class rather
      than unique here.


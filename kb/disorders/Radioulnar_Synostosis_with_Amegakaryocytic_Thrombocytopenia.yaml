- name: Loss of HOXA11 Sequence-Specific DNA Binding
  biological_scale: MOLECULAR
  description: >
    The truncated HOXA11 protein cannot bind its consensus site, and the defect
    is not rescued by its cofactor. Wild-type HOXA11 binds DNA most efficiently
    in the presence of the TALE factor Meis1b; the truncated protein still
    associates with Meis1b but binding to DNA is abolished even so. The
    protein-protein interaction is therefore intact while the DNA contact is
    not, which localises the lesion to the homeodomain.

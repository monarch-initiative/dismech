name: Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
  term:
    id: MONDO:0011555
    label: radio-ulnar synostosis-amegakaryocytic thrombocytopenia syndrome
description: >
  Radioulnar synostosis with amegakaryocytic thrombocytopenia (RUSAT) is an
  inherited bone marrow failure syndrome in which a congenital bony fusion of
  the proximal radius and ulna sits beside a marrow that makes no
  megakaryocytes. The forearm is fixed, usually in pronation, and the platelet
  count is low from birth. In many reported individuals the thrombocytopenia
  does not stay confined to one lineage: it progresses to pancytopenia, and
  allogeneic haematopoietic stem cell transplantation is the only curative
  treatment.

  Two genes are established, and they are very unequally represented. HOXA11
  (RUSAT1) accounts for a single frameshift allele found in six individuals
  from two families in 2000, and no further HOXA11 family has been reported
  since. MECOM (RUSAT2), encoding the zinc-finger transcription factor EVI1,
  accounts for essentially every case identified since 2015 - approximately 66
  by 2025. Both proteins are transcription factors required in two places at
  once: in haematopoietic stem cells and in the developing forearm. That dual
  requirement, rather than any shared downstream pathway, is what puts a bone
  malformation and a marrow failure in the same syndrome.

  The mechanism has one central step and several branches. A heterozygous
  variant clustered in the eighth and ninth zinc fingers of EVI1 reduces
  sequence-specific DNA binding at its target sites, and the transcriptional
  network EVI1 maintains is dysregulated. One branch of that network holds
  haematopoietic stem cells in a self-renewing state, and losing it produces
  the progressive multilineage marrow failure. A second branch runs through
  MPL, the thrombopoietin receptor whose biallelic loss causes congenital
  amegakaryocytic thrombocytopenia - which is why RUSAT and CAMT can look
  identical in a neonate. A third branch is developmental, in the limb bud,
  where the proximal radioulnar joint fails to separate.

  The name is the least reliable thing about the disease. A large fraction of
  people carrying pathogenic MECOM variants have marrow failure with no
  synostosis at all, and some have synostosis with almost no haematological
  disease. The synostosis tracks the variant class rather than the diagnosis:
  it is a missense feature, and specifically a zinc-finger-8/9 missense
  feature, while truncating alleles and whole-gene deletions give bone marrow
  failure without it. A second missense hotspot at zinc finger 6 is reported
  and complicates that picture; the entry records it rather than tidying it
  away. Two competing
  renamings are in the literature - MECOM-associated syndrome, and
  RUS-associated haematological disease (RUSHD) - and this entry records that
  dispute rather than resolving it.
synonyms:
  - RUSAT
  - Radioulnar synostosis with amegakaryocytic thrombocytopenia
  - Amegakaryocytic thrombocytopenia with radio-ulnar synostosis
  - MECOM-associated syndrome
  - RUS-associated hematological disease
  - RUSHD
parents:
  - Inherited bone marrow failure syndrome
  - Congenital thrombocytopenia

classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:41635268
      reference_title: "Syndrome of the Month: Radioulnar Synostosis With Amegakaryocytic Thrombocytopenia Type 2."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Radioulnar synostosis with amegakaryocytic thrombocytopenia type 2 (RUSAT-2) is a rare inherited bone marrow failure syndrome characterized by congenital or progressive thrombocytopenia, frequent radioulnar synostosis, and variable multisystem involvement."
      explanation: >
        A bone marrow failure syndrome presenting as cytopenia and progressing
        to pancytopenia, which places it in Harrison's haematology Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:26581901
      reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report missense mutations in MECOM resulting in a Mendelian disorder that provide compelling evidence for the critical role of EVI1 in normal hematopoiesis and in the development of forelimbs and fingers in humans."
      explanation: >
        The source names the disorder Mendelian, which is the Harrison's
        genetics Part.
  iuis_category:
    classification_value: bone marrow failure
    evidence:
    - reference: PMID:37407873
      reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MECOM deficiency is a recently identified inborn error of immunity and inherited bone marrow failure syndrome caused by haploinsufficiency of the hematopoietic transcription factor MECOM."
      explanation: >
        Names both halves of this assignment in one sentence: an inborn error
        of immunity, and a bone marrow failure syndrome. Graded OTHER because
        the source is a review with no primary data.
    notes: >
      IUIS Table 9 is the bone marrow failure table, whose members are the
      class this disease belongs to - Fanconi anaemia, dyskeratosis congenita,
      Shwachman-Diamond, Diamond-Blackfan. Assigned there rather than to
      Table 3 (predominantly antibody deficiency) because the B-cell
      lymphopenia here is one manifestation of a multilineage marrow defect
      rather than an isolated antibody deficiency, and because the source
      frames the disease as marrow failure with B-cell involvement rather than
      the reverse. That choice is curator inference from the cited sentence,
      not something the sentence states, which is why it sits here.

has_subtypes:
- name: RUSAT1
  subtype_term:
    preferred_term: radioulnar synostosis with amegakaryocytic thrombocytopenia 1
    term:
      id: MONDO:0024558
      label: radioulnar synostosis with amegakaryocytic thrombocytopenia 1
  display_name: RUSAT1 (HOXA11-related)
  description: >-
    The founding form, and effectively a historical one. A single heterozygous
    frameshift allele, HOXA11 c.872delA p.Asn291ThrfsX3, was found in six
    individuals across two families; in both families it came from the father,
    and both fathers had the arm malformation without any haematological
    disease. No further HOXA11 family has been reported since, and a later
    cohort that screened HOXA11 in seven RUS families with blood disease found
    no coding variants. A curator should not read RUSAT1 as "the other half of
    RUSAT" - on current counts it is two families against approximately 66
    MECOM cases.
  genes:
  - preferred_term: HOXA11
    term:
      id: hgnc:5101
      label: HOXA11
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterozygous variant c.872delA, p.Asn291ThrfsX3 was identified in six individuals from two families"
    explanation: >-
      Gives the single HOXA11 allele and the number of individuals carrying it.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No coding variants were identified inHOXA11."
    explanation: >-
      A seven-family RUS cohort screened HOXA11 and found nothing, which is why
      RUSAT1 remains at its original two families. The quoted text runs the gene
      symbol into the preceding word; that is an artefact of the cached full
      text, not a transcription error here.

- name: RUSAT2
  subtype_term:
    preferred_term: radioulnar synostosis with amegakaryocytic thrombocytopenia 2
    term:
      id: MONDO:0014758
      label: radioulnar synostosis with amegakaryocytic thrombocytopenia 2
  display_name: RUSAT2 (MECOM-related)
  description: >-
    Essentially all of RUSAT as it is now diagnosed. Heterozygous MECOM
    variants, de novo in most sporadic cases and dominantly transmitted in
    some families. The variants that produce the synostosis cluster in zinc
    fingers 8 and 9 of EVI1; MECOM variants elsewhere in the locus, including
    truncating alleles and whole-gene deletions, give marrow failure without
    it. Approximately 66 cases had been reported by 2025.
  genes:
  - preferred_term: MECOM
    term:
      id: hgnc:3498
      label: MECOM
  evidence:
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These three mutations were clustered within the 8(th) zinc finger motif of the C-terminal zinc finger domain of EVI1."
    explanation: >-
      The founding MECOM series, and the localisation that defines this subtype.
  - reference: PMID:41635268
    reference_title: "Syndrome of the Month: Radioulnar Synostosis With Amegakaryocytic Thrombocytopenia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As of 2025, there were approximately 66 reported cases of RUSAT-2 reported in the literature, with clinical severity ranging from isolated thrombocytopenia to early-onset bone marrow failure requiring hematopoietic stem cell transplantation."
    explanation: >-
      Case count and the breadth of severity within this subtype.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Every reported allele in both genes is germline and heterozygous. Most
    MECOM cases are de novo, but dominant transmission through several
    generations is documented, and in those families expressivity is wide
    enough that a parent may be asymptomatic or have only a mild single
    cytopenia while a child needs a transplant. In both HOXA11 families the
    allele came from a father who had the arm malformation and no blood
    disease at all, which is the cleanest published demonstration that the
    skeletal and haematological arms of this syndrome can be uncoupled within
    one genotype.
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on genetic studies and clinical presentation, an autosomal dominant inheritance pattern was observed in families 1 and 5."
    explanation: >
      Direct statement of dominant inheritance in two MECOM families.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both families the variant was inherited from the father. Interestingly, both fathers showed skeletal abnormalities of the arm but neither had any hematological disease."
    explanation: >
      Establishes germline transmission of the HOXA11 allele and, in the same
      sentence, the within-genotype uncoupling of the skeletal and
      haematological features.
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disease-causing variants in MECOM, which are transmitted in an autosomal dominant pattern, are associated with a phenotypic spectrum encompassing RUSAT2 in addition to variable degrees of bone marrow failure without radioulnar synostosis"
    explanation: >
      States the inheritance pattern and, in the same clause, that the
      synostosis is not required for the diagnosis.

prevalence:
- population: Worldwide, published cases (RUSAT2 / MECOM)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately 66 reported RUSAT-2 cases as of 2025. No population
    prevalence or incidence estimate has been published for either subtype, so
    no rate is computed here. This count is also an undercount of MECOM-related
    disease rather than an overcount: the perinatal-lethal presentations were
    diagnosed only on postmortem or rapid trio sequencing, and MECOM is absent
    from targeted hydrops gene panels.
  evidence:
  - reference: PMID:41635268
    reference_title: "Syndrome of the Month: Radioulnar Synostosis With Amegakaryocytic Thrombocytopenia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As of 2025, there were approximately 66 reported cases of RUSAT-2 reported in the literature, with clinical severity ranging from isolated thrombocytopenia to early-onset bone marrow failure requiring hematopoietic stem cell transplantation."
    explanation: >-
      The published case count for the MECOM subtype.
- population: Worldwide, published cases (all RUSAT, families)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A family-level rather than individual-level count, recorded separately
    because it uses a different denominator and a 2023 cut-off. It is not
    comparable with the 66-case figure above and the two must not be pooled.
  evidence:
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately 22 families have been reported to have individuals affected with RUSAT."
    explanation: >-
      Family count across both subtypes as of 2023.

notes: >
  Two genes, two very different evidence bases, and the entry keeps them
  separate. The MECOM arm is supported by human genetics, a knock-in mouse,
  primary-human-HSPC modelling and reporter assays. The HOXA11 arm rests on two
  families reported in 2000 plus one in vitro follow-up in 2006, and nothing
  since. Where a mechanism node applies to only one gene, its description says
  so; no node silently generalises MECOM data to HOXA11 or the reverse.

  Counts in this entry name their denominator. The 66-case figure is RUSAT2
  only and is dated 2025; the 22-family figure covers both subtypes and is
  dated 2023; the eight-patient and twelve-patient series are separate
  ascertainments. No `frequency:` value is set on any phenotype. A band
  computed across these overlapping, differently ascertained series would be a
  scope error, and the largest cohorts explicitly report that no single
  manifestation is present in all patients.

  The pathograph deliberately carries no leukaemia node, and the reason is a
  direction-of-effect one. MECOM is a well-known oncogene whose somatic
  overexpression marks high-risk acute myeloid leukaemia, and the stem-cell
  network it maintains is co-opted by those leukaemias - but that is the
  opposite direction of effect from the germline loss modelled here, and
  importing it would be putting the somatic oncology literature into a
  haploinsufficiency entry. What is curated instead is what the germline
  literature actually reports: myelodysplasia as a phenotype, and age-related
  clonal haematopoiesis as a mechanism node. The published malignancy count is
  four myeloid malignancies among 80 reported individuals - three adult MDS,
  one paediatric AML - and the source attributes that low frequency to most
  patients being transplanted young, which implies the count understates lifetime
  risk without the source saying so outright. That is recorded in the clonal
  haematopoiesis node with its denominator, and is not restated as a
  quantified germline leukaemia predisposition, which no source cited here
  supports.

  One lead was chased and could not be closed, recorded so it is not re-chased.
  The falcon report attributes to Germeshausen 2018 (PMID:29540340) a set of
  patient-sample findings - reduced CD34-high/CD38-low progenitors, retained low
  MPL expression, elevated thrombopoietin - that would bear directly on the
  `Loss of EVI1 Transcriptional Control of MPL` node, since they would be the
  only human measurement of MPL and thrombopoietin in this disease. That
  paper's cache is `content_type: abstract_only`, and its PubMed Central record
  (PMC5873238) returns metadata only with no article body, so the sentences
  cannot be verified or quoted. If someone obtains the full text and those data
  are there, they settle the direction question that node is currently agnostic
  about, and a `biochemical:` block with a thrombopoietin readout becomes
  possible.

  No `datasets:` block. `just discover-datasets` returned 12 candidates and
  zero of them were DIRECT: every one was a gene-only hit, and the genes lead
  somewhere else entirely - MECOM to castration-resistant prostate cancer and
  to AML, HOXA11 to keloid fibroblasts and transcription-factor binding panels.
  That is the Named Entity Confusion pattern the dataset SOP warns about,
  reached through gene search rather than through disease name. There is no
  RUSAT expression dataset to curate, which is unsurprising for a disease with
  roughly 66 published cases.

  Two phenotypes are deliberately left as pathograph leaves: failure to thrive
  and global developmental delay. Both are real and counted (2 of 8 and 4 of 8
  in one cohort), but no cited source establishes a route from MECOM
  haploinsufficiency to either, and every other edge in this entry carries
  cited evidence. Grouping them under the multi-organ developmental node would
  be an unsupported guess, since developmental delay in a transfusion-dependent
  infant with multiple malformations has several plausible causes that have
  nothing to do with a direct MECOM requirement in brain. They are recorded as
  a decision rather than a gap.

  Three references were fetched and are deliberately not cited: PMID:30536840,
  PMID:35484980 and PMID:29200407 are all novel-variant case reports whose
  cache is `content_type: unavailable`, so nothing in them can be quoted. They
  are real and on topic; they simply cannot carry evidence in this repository's
  model. PMID:11101832, the 2000 Nature Genetics paper that founded RUSAT1, is
  in the same position - its cache has no abstract - so the HOXA11 discovery
  claim is cited to the 2006 follow-up and the 2018 cohort, both of which
  restate it in quotable form.

  The bone lesion itself is curated at low mechanistic resolution and that is
  honest rather than lazy. No source cited here traces a path from EVI1 or
  HOXA11 target genes to the failure of the proximal radioulnar joint to
  separate in a human embryo. What exists is expression data placing both
  factors in the developing limb, and mouse limb genetics for Hoxa11 that does
  not model the human synostosis. The node records that gap in its own
  description rather than inventing intermediate steps.

pathophysiology:
- name: Germline Heterozygous MECOM Zinc Finger Variant
  biological_scale: MOLECULAR
  description: >
    A single altered MECOM allele, almost always de novo, encoding the
    zinc-finger transcription factor EVI1. The variants that give the full
    RUSAT picture are missense changes in the region spanning zinc fingers 8
    and 9 of the C-terminal zinc finger domain - about ten amino acids,
    comprising zinc finger 8 and the adjacent linker.

    That is not the only missense hotspot, and this node should not be read as
    saying it is. A 2026 series reports every missense variant mapping to "the
    zinc finger 6 or zinc finger 8/9 region", so there is a second cluster in
    the N-terminal zinc finger domain - the domain through which EVI1 binds the
    GATA2 promoter. A further reported variant, p.P634L, lies between the two
    domains altogether. Whether the ZF6 cluster produces synostosis is not
    established in anything cited here. Variants elsewhere in the locus, including nonsense,
    frameshift, splice and whole-gene deletion alleles, cause bone marrow
    failure without the synostosis. That the two variant classes give
    different syndromes from the same gene is the central genotype-phenotype
    observation in this disease, and it is why this node is specified by
    domain rather than simply as "loss of one MECOM allele".
  downstream:
  - target: Loss of EVI1 Sequence-Specific DNA Binding
    causal_link_type: DIRECT
    description: >-
      The variant residues sit inside a Cys2His2 zinc finger, the DNA-contact
      module itself, so the immediate consequence is loss of binding rather
      than loss of protein.
    evidence:
    - reference: PMID:26581901
      reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Chromatin immunoprecipitation and qPCR assays of the regions harboring the ETS-like motif that is known as an EVI1 binding site showed a reduction in immunoprecipitated DNA for two EVI1 mutants compared with wild-type EVI1."
      explanation: >-
        Measures the variant's effect on occupancy at a known EVI1 site, which
        is the step this edge asserts.
  evidence:
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed whole exome sequencing in an individual with RUSAT and her healthy parents and identified a de novo missense mutation in MECOM, encoding EVI1, in the individual with RUSAT"
    explanation: >
      The founding observation: a de novo heterozygous MECOM missense variant
      in RUSAT.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is noteworthy that all variants associated with the co-presentation of RUS and hematological disease cluster in region spanning zinc fingers 8 and 9."
    explanation: >
      Localises the RUSAT-producing variants to the region spanning zinc
      fingers 8 and 9, which is what makes this node domain-specific rather
      than gene-level. The source's ten-amino-acid span (aa750-760) is zinc
      finger 8 plus the adjacent linker rather than two whole motifs.

- name: Germline Heterozygous HOXA11 Frameshift Variant
  biological_scale: MOLECULAR
  description: >
    The RUSAT1 lesion: HOXA11 c.872delA, p.Asn291ThrfsX3, a single-nucleotide
    deletion falling in the third helix of the homeodomain and truncating the
    protein. It is the only HOXA11 allele ever reported in this disease, found
    in six individuals from two families. HOXA11 is a posterior HOX
    transcription factor with roles in both early forelimb patterning and
    haematopoiesis, which is the same dual requirement that makes MECOM a
    RUSAT gene.
  downstream:
  - target: Loss of HOXA11 Sequence-Specific DNA Binding
    causal_link_type: DIRECT
    description: >-
      The truncation removes the third helix of the homeodomain, which is the
      DNA-recognition helix.
    evidence:
    - reference: PMID:16765069
      reference_title: "HOXA11 mutation in amegakaryocytic thrombocytopenia with radio-ulnar synostosis syndrome inhibits megakaryocytic differentiation in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we demonstrate that this mutation results in a significantly truncated protein with impaired DNA-binding efficiency."
      explanation: >-
        States the truncation and the binding defect together, which is exactly
        this edge.
  evidence:
  - reference: PMID:16765069
    reference_title: "HOXA11 mutation in amegakaryocytic thrombocytopenia with radio-ulnar synostosis syndrome inhibits megakaryocytic differentiation in vitro."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, we identified an inherited syndrome of congenital amegakaryocytic thrombocytopenia and radio-ulnar synostosis that is associated with a point mutation in the third helix of HOXA11 homeodomain (HOXA11-DeltaH3)."
    explanation: >
      Restates the 2000 discovery in quotable form and localises the variant to
      the homeodomain third helix. This 2006 follow-up is cited in place of the
      2000 discovery paper, PMID:11101832, whose cache is
      `content_type: unavailable` and so carries nothing quotable. The defect
      claim is about PMID:11101832, not about this reference, which has a
      normal abstract.

- name: Loss of EVI1 Sequence-Specific DNA Binding
  biological_scale: MOLECULAR
  description: >
    The zinc-finger 8/9 variants reduce EVI1 occupancy at its recognition
    sites. Protein modelling of the two mutational hotspots, zinc finger 6 and
    zinc fingers 8/9, predicts both are DNA-binding regions, so the variants
    are read as disabling contact with DNA rather than destabilising the
    protein as a whole. The functional consequence is measured on both sides
    of EVI1's dual role: it is a repressor at some targets and a permissive
    factor at others, and the variants shift both.
  molecular_functions:
  - preferred_term: EVI1 DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Multi-Organ Developmental MECOM Requirement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The extra-haematopoietic malformations are grouped behind one node rather
      than hung individually off the network node, because what connects them
      is a single fact - MECOM is required in several developing organs - and
      not four separate demonstrated mechanisms.
    evidence:
    - reference: PMID:37067177
      reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MECOM transcription factors are expressed at high levels in the embryonic heart, lungs, limb buds, nasal cavity, and urinary tract, suggesting an important role in multi-organ development"
      explanation: >-
        The expression basis for a shared developmental requirement across the
        organs that are malformed in this syndrome. Graded OTHER on the same
        rule used elsewhere here: the sentence is that cohort paper's
        introduction citing prior work. The underlying expression data are
        murine.
  - target: Pulmonary Arterial Endothelial MECOM Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Provisional, and the weakest branch in the entry. Modelling places the
      variant hotspots at a VEGFR2/KDR enhancer, which would make this an
      endothelial consequence of the same binding defect; nothing measures it.
    evidence:
    - reference: PMID:41617498
      reference_title: "Expanding the phenotypic spectrum of MECOM-associated syndrome: rare variants are associated with syndromic pulmonary arterial hypertension."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "All missense variants map to the zinc finger 6 or zinc finger 8/9 region, a known hotspot for MECOM-associated syndrome."
      explanation: >-
        Places the PAH-associated variants in this gene's missense hotspots,
        which licenses running the branch off the shared binding defect rather
        than treating it as unrelated. Note the quote says zinc finger 6 OR
        zinc finger 8/9, so it does not put them in the same region as the
        synostosis-associated variants - it names a second cluster.
  - target: Failure of Proximal Radioulnar Joint Separation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mecom_domain_specific_effect
    description: >-
      Recorded as INDIRECT because no source traces target genes from EVI1 to
      the limb bud. Opted into `mecom_domain_specific_effect` because this is
      the edge the two hypotheses disagree about: on a pure-dose model the
      limb phenotype should track total EVI1 loss and therefore appear with
      truncating alleles, which it does not. What supports the edge is that EVI1 is expressed in the
      developing limb and that the human genetics assign the synostosis to
      MECOM; the intervening developmental steps are unknown.
    evidence:
    - reference: PMID:37099686
      reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Evi1 is highly expressed in the urinary system, lungs, heart, and developing limbs of mouse embryos."
      explanation: >-
        Places the factor in the developing limb, which is the necessary
        condition for this branch. Graded OTHER on the same rule applied
        elsewhere in this entry: the sentence is this mouse paper's
        introduction citing prior work, not a result it reports. The underlying
        expression data are murine.
  - target: Dysregulation of the EVI1 HSC Maintenance Network
    causal_link_type: DIRECT
    hypothesis_groups:
    - mecom_pure_haploinsufficiency
    description: >-
      Opted into `mecom_pure_haploinsufficiency` because this is the step the
      dose model explains well and the knock-in mouse supports: less functional
      EVI1 at its target sites, less of the network it maintains. Both

    explanation: >
      Gives the chromatin-level action by which EVI1 holds the self-renewal
      state, which is why its loss releases differentiation rather than merely
      reducing one target's output.
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "EVI1 binds to the promoter of GATA2, which encodes a transcription factor required for the proliferation and survival of early hematopoietic progenitor cells, through the N-terminal zinc finger domain."
    explanation: >
      Names a specific, mechanistically informative target within the network.
      Graded OTHER rather than IN_VITRO because the sentence is this mouse
      paper's introduction citing prior work, not a result it reports.
  - reference: PMID:36522544
    reference_title: "A genetic disorder reveals a hematopoietic stem cell regulatory network co-opted in leukemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "These results reveal a high degree of similarity in the high-dimensional transcriptomic analysis of LT-HSCs following MECOM perturbation"
    explanation: >
      The magnitude constraint on this node, and the reason it is named

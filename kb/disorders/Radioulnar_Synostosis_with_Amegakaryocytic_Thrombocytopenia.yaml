mechanistic_hypotheses:
- hypothesis_group_id: mecom_pure_haploinsufficiency
  hypothesis_label: The RUSAT missense alleles act purely by reducing EVI1 dose
  status: ALTERNATIVE
  description: >
    On this model there is one lesion - not enough functional EVI1 - and
    everything else is dosage and tissue sensitivity. It predicts that a
    zinc-finger 8/9 missense allele should behave like a null, that the
    knock-in mouse should phenocopy the exonic-deletion mice, and that the
    difference between patients with and without synostosis should come from
    modifiers or residual activity rather than from the variant doing anything
    a null does not. The knock-in mouse is the strongest evidence for it: its
    authors conclude the missense allele has a similar effect to
    loss-of-function alleles in haematopoiesis. Reviews of the disease describe
    it as haploinsufficiency without qualification.
  evidence:
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that Evi1KI/+ mice recapitulate the bone marrow dysfunction in RUSAT, similar to that caused by loss-of-function Mecom alleles."
    explanation: >-
      The strongest single piece of evidence for the pure-dose model: in vivo,
      the missense allele behaves like a null in haematopoiesis.
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MECOM deficiency is a recently identified inborn error of immunity and inherited bone marrow failure syndrome caused by haploinsufficiency of the hematopoietic transcription factor MECOM."
    explanation: >-
      A review naming haploinsufficiency as the mechanism without qualification,
      which is this hypothesis stated as settled.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Preliminary data suggest levels of MECOM appear to be reduced in lymphoblastoid cell lines heterozygous for p.Glu758Lys"
    explanation: >-
      The only human datum bearing on the question that separates these two
      hypotheses: whether a zinc-finger missense allele actually lowers EVI1
      dose, as a null would, or leaves a full complement of binding-incompetent
      protein. Reduced protein in a patient cell line is what the pure-dose
      model predicts. Held at INDIRECT and flagged as weak for the reasons the
      source itself gives - the authors call it "preliminary" and say levels
      "appear to be" reduced, it is one allele in a lymphoblastoid line rather
      than in a haematopoietic stem cell, and it appears in supplementary data
      rather than as a headline result.
- hypothesis_group_id: mecom_domain_specific_effect
  hypothesis_label: The zinc finger 8/9 missense alleles do something a null allele does not
  status: ALTERNATIVE
  description: >
    On this model dose is not the whole story, and the evidence for it is a
    pattern in the human genetics that pure haploinsufficiency does not
    predict. Radioulnar synostosis and B-cell deficiency appear only with
    variants in one short C-terminal zinc-finger region; nonsense, frameshift,
    splice and whole-gene-deletion alleles - which remove more EVI1 than a
    missense change does - give marrow failure without the synostosis. If less
    protein were the whole mechanism, the alleles that remove the most protein
    should give the most complete syndrome, and they do not. The prediction
    that separates the models is a tissue-level one: a limb-bud requirement
    that a missense zinc-finger protein disrupts and a null allele does not,
    for instance by leaving a binding-incompetent protein in place at a
    developmental target.
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radioulnar synostosis and B-cell deficiency were observed only in patients with mutations affecting a short region in the C-terminal zinc finger domain of EVI1."
    explanation: >-
      The regional exclusivity that a pure-dose model does not predict.
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RUSAT-associated mutations are located in the eighth and ninth zinc finger motifs, suggesting that RUSAT-associated mutations may have particular intravital effects"
    explanation: >-
      The hypothesis stated in the literature, by the same authors whose mouse
      data support the competing model - which is why both are ALTERNATIVE here.

discussions:
- discussion_id: rusat_name_understates_disease
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - disease#Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia
  - pathophysiology#Progressive Multilineage Marrow Failure
  prompt: >-
    Does the name "radioulnar synostosis with amegakaryocytic thrombocytopenia"
    describe the disease this entry curates?
  rationale: >-
    Both halves of the name are wrong for a large share of patients, and the
    literature says so in two different directions. The haematological half is
    too narrow: a seven-family cohort concluded the blood disease is frequently
    global and variable rather than limited to thrombocytopenia, and proposed
    RUS-associated haematological disease (RUSHD) instead. The skeletal half is
    not required at all: the largest series found no single manifestation
    present in every patient, described a spectrum running from isolated
    synostosis with no blood disease to severe marrow failure with no skeletal
    abnormality, and proposed MECOM-associated syndrome as the covering term.
    The perinatal-lethal hydrops cases had neither synostosis nor a suspected
    diagnosis before sequencing.

    This entry keeps MONDO:0011555 and its label because that is the concept the
    knowledge base is curating against, and records both proposed renamings as
    synonyms. The practical consequence for a reader is a negative one worth
    stating plainly: a normal forearm does not exclude this disease, and
    finding an intact radius and ulna is not a reason to stop before sequencing
    MECOM.
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it has become clear that RUS-associated hematological abnormalities are frequently more global and variable, rather than being limited to thrombocytopenia"
    explanation: >-
      The argument that the "amegakaryocytic thrombocytopenia" half understates
      the marrow phenotype.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The description RUS-associated hematological disease (RUSHD) is therefore perhaps more appropriate than RUS-associated amegakaryocytic thrombocytopenia (RUSAT)"
    explanation: >-
      The proposed replacement name, quoted so the dispute is on the record
      rather than paraphrased.
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No single clinical manifestation was detected in all patients affected by MECOM mutations."
    explanation: >-
      Establishes that no feature in the name is obligate.
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, neither infant was reported to have radioulnar synostosis, nor was a MECOM-associated syndrome suspected clinically prior to the molecular diagnosis."
    explanation: >-
      The clinical cost of the name: two fatal cases in which the absent
      synostosis contributed to the diagnosis being missed until sequencing.

- discussion_id: rusat_variant_class_determines_synostosis
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Germline Heterozygous MECOM Zinc Finger Variant
  - pathophysiology#Failure of Proximal Radioulnar Joint Separation
  - mechanistic_hypotheses#mecom_domain_specific_effect
  prompt: >-
    Why do missense variants in zinc fingers 8 and 9 cause radioulnar
    synostosis while truncating and deletion alleles of the same gene do not?
  rationale: >-
    The observation is consistent across three independent series. Variants
    co-presenting with synostosis cluster in a roughly ten-amino-acid span of
    the C-terminal zinc finger domain; B-cell deficiency segregates with the
    same region; congenital marrow failure without synostosis is caused by
    nonsense, indel and splice variants producing premature termination, and by
    whole-gene deletions. A literature-wide tally puts the same pattern in
    aggregate terms - missense variants frequently show synostosis, while the
    other four variant classes more commonly give marrow failure.

    Simple haploinsufficiency does not obviously predict this ordering, since
    the alleles that remove the most protein give the less complete syndrome.
    The alternative is that the limb requirement is specifically disrupted by a
    binding-incompetent zinc-finger protein. The two readings are curated as
    competing `mechanistic_hypotheses`, and this discussion is what stands
    between them. It matters practically as well: a MECOM truncating variant
    found in an infant with pancytopenia and normal forearms is not a
    different disease from RUSAT, and should not be reported as one.
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radioulnar synostosis and B-cell deficiency were observed only in patients with mutations affecting a short region in the C-terminal zinc finger domain of EVI1."
    explanation: >-
      The regional restriction, stated as an exclusive.
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with congenital bone marrow failure without RUS exhibit nonsense, insertion/deletion, or splicing variants that result in a premature termination codon in MECOM"
    explanation: >-
      The complementary half: the non-synostosis presentations carry
      protein-truncating alleles.
  - reference: PMID:40170114
    reference_title: "A novel MECOM gene variant causes severe thrombocytopenia in a neonate: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with missense mutations frequently exhibited radioulnar synostosis, while bone marrow failure was more commonly associated with the other four types of mutations."
    explanation: >-
      A literature-wide tally reproducing the same split by variant class.
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RUSAT-associated mutations are located in the eighth and ninth zinc finger motifs, suggesting that RUSAT-associated mutations may have particular intravital effects"
    explanation: >-
      The authors' own reading, that these alleles may do something beyond
      dose reduction, which is the domain-specific hypothesis.

- discussion_id: rusat_mouse_no_synostosis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Proximal Radioulnar Joint Separation
  - animal_models#Evi1 H752R knock-in mouse
  prompt: >-
    Why does a mouse carrying the exact human RUSAT allele have no radioulnar
    synostosis, and does that invalidate the mouse for the limb arm of this
    disease?
  rationale: >-
    The knock-in mouse carries the murine equivalent of a human RUSAT variant
    at the orthologous residue, so this is not a species-mismatched allele. It
    reproduces the haematopoietic side - reduced stem and progenitor cells,
    delayed recovery after myelosuppression, low platelet counts in older
    males - and reproduces none of the skeletal side. The forelimbs are normal.

    That is a substantive negative result rather than a failed experiment, and
    it cuts both ways. If the synostosis needs a developmental context the
    mouse forelimb does not provide, the mouse is simply the wrong system for
    the limb arm and its silence says nothing about the human mechanism. But if
    the same allele is sufficient for the marrow phenotype and insufficient for
    the limb phenotype in one animal, the two arms of the syndrome may have
    genuinely different dose or timing requirements - which is the same
    question the variant-class discussion raises from the human side. The
    haematological timing is also mismatched: the human disease is congenital
    and the mouse platelet defect appears only in older males, so the mouse is
    a model of the marrow deficit and not of its onset.
  evidence:
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous mutant mice (Evi1KI/+ mice) grew normally without radioulnar synostosis."
    explanation: >-
      The negative skeletal result in the patient-allele knock-in.
  - reference: PMID:37099686
    reference_title: "Mecom mutation related to radioulnar synostosis with amegakaryocytic thrombocytopenia reduces HSPCs in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that Evi1KI/+ mice recapitulate the bone marrow dysfunction in RUSAT, similar to that caused by loss-of-function Mecom alleles."
    explanation: >-
      The positive haematopoietic result in the same animal, which is what makes
      the skeletal silence informative rather than merely a null model.
  proposed_experiments:
  - experiment_id: rusat_limb_bud_conditional_knockin
    name: Limb-bud-restricted expression of the RUSAT allele during forelimb patterning
    description: >-
      Express the knock-in allele under limb-bud control across the window of
      zeugopod segmentation, and separately test a limb-restricted null allele
      in parallel, scoring proximal radioulnar separation in both.
    would_support:
    - pathophysiology#Failure of Proximal Radioulnar Joint Separation
    - mechanistic_hypotheses#mecom_domain_specific_effect
    supporting_outcome:
    - >-
      Proximal radioulnar fusion in the missense arm but not the null arm would
      support a domain-specific limb requirement and explain both the mouse's
      normal forelimbs (a dose or timing threshold not reached in the germline
      heterozygote) and the human variant-class split.
    refuting_outcome:
    - >-
      Normal forearms in both arms, or fusion in both, would argue that the
      mouse forelimb cannot report this phenotype at all, and that the limb arm
      of RUSAT needs a different system rather than a different allele.

- discussion_id: rusat_camt_convergence
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of EVI1 Transcriptional Control of MPL
  - differential_diagnoses#Congenital Amegakaryocytic Thrombocytopenia
  prompt: >-
    Is the overlap between RUSAT and congenital amegakaryocytic
    thrombocytopenia a coincidence of presentation, or a shared mechanism?
  rationale: >-
    The two diseases are hard to separate in a neonate: both give congenital
    thrombocytopenia with an amegakaryocytic marrow, both progress to
    pancytopenia, and both are cured only by transplant. The finding that EVI1
    transcriptionally regulates MPL - the receptor whose biallelic loss causes
    CAMT - offers a mechanistic account of that overlap rather than a
    coincidental one, and the paper reporting it says so explicitly.

    The claim should be held at the strength its evidence supports. What was
    shown is that EVI1 controls MPL transcription in vitro; what was not shown
    is reduced MPL message or thrombopoietin-receptor signalling in RUSAT
    patient megakaryocytes. The same paper states that the link between EVI1
    dysfunction and thrombocytopenia is poorly understood. So this is a
    plausible and testable convergence, not an established shared pathway, and
    the `Loss of EVI1 Transcriptional Control of MPL` node is written to say so.
  evidence:
  - reference: PMID:37610030
    reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrated that EVI1 controls the transcriptional regulation of MPL, a gene whose mutations are responsible for congenital amegakaryocytic thrombocytopenia (CAMT), potentially explaining the partial overlap between MECOM-AS and CAMT"
    explanation: >-
      The proposed mechanistic account of the RUSAT/CAMT overlap, including its
      own hedge ("potentially explaining").
  - reference: PMID:37610030
    reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mechanism linking the alteration of EVI1 function and thrombocytopenia is poorly understood."
    explanation: >-
      The limit on the claim, from the paper that makes it.

- discussion_id: rusat_somatic_rescue_and_penetrance
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Clonal Selection of Revertant Hematopoietic Stem Cells
  - diagnosis#Germline Testing on Non-Hematopoietic Tissue
  prompt: >-
    How much of the apparent non-penetrance and spontaneous recovery in
    MECOM-associated syndrome is somatic reversion rather than mild disease?
  rationale: >-
    Enough to change practice, and not enough to be the whole answer. In a
    15-person cohort, 7 individuals showed spontaneous resolution, alleviation,
    or late onset; of 6 evaluable, 4 carried copy neutral loss of heterozygosity
    across 3q that duplicates the residual wild-type allele. The other 2 showed
    no allelic imbalance on longitudinal testing, so their mild course is
    unexplained. Reversion is therefore a major contributor to variable
    expressivity in this disease but not a complete account of it, and this
    entry does not present it as one.

    Two consequences follow. Diagnostically, blood is an unreliable germline
    sample in a recovered carrier and testing should use skin fibroblasts or
    hair follicles. Therapeutically, the source argues the existence of
    naturally selected corrected clones gives a rationale for gene-corrected
    autologous transplantation - which is a rationale, not a treatment, and no
    trial exists.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we show that part of the variability in hematological presentation may be attributable to spontaneous reversion of germ line variants observed in some affected individuals."
    explanation: >-
      The claim, at the strength the authors make it - "part of the
      variability", "may be attributable".
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For 2 of 6 individuals, an explanation for mild presentation or symptom resolution remains enigmatic"
    explanation: >-
      The limit on the claim, from the same paper: reversion does not explain
      every mild case.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of somatic genetic rescue provides a rationale for gene-corrected autologous transplantation or direct gene editing approaches as potential treatments for the hematopoietic phenotype of MECOM-associated syndrome in the absence of matched donors."
    explanation: >-
      The therapeutic argument, quoted with its own conditional framing so it
      is not read as an available option.

- discussion_id: rusat_pregnancy_loss
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Genetic Counseling and Cascade Testing
  - inheritance#Autosomal dominant
  prompt: >-
    Is the high rate of pregnancy loss in MECOM families caused by the variant,
    and if so is the fetal or the maternal genotype responsible?
  rationale: >-
    The observation is striking and the interpretation is not settled. Twelve
    of 16 pregnancies in five mothers with detailed histories ended in loss -
    75%, against a quoted 15-25% in the general population and 12-20% in other
    inherited marrow failure syndromes. But fetal genotypes were unavailable,
    so nobody knows whether the lost pregnancies carried the variant; and
    losses also occurred in MECOM wild-type women in these families, including
    a stillbirth at 8.5 months in a mother who tested negative while her
    husband was affected. That last case is the one that keeps both hypotheses
    alive: it is consistent with a fetal-genotype effect, and equally with the
    losses being unrelated to MECOM.

    Until fetal genotyping is done this cannot become a recurrence-risk figure,
    and it should not be quoted to families as one. It is recorded here because
    the source's own recommendation - discuss it in reproductive counselling -
    depends on stating the uncertainty alongside the number.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, there were 12 pregnancy losses of a total of 16 pregnancies in 5 mothers for whom detailed information regarding pregnancies was available"
    explanation: >-
      The observation and its denominator.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a higher rate of loss (75%) than expected pregnancy outcomes in the general population (15%-25%) as well as other inherited BMF syndromes (12%-20%)."
    explanation: >-
      The comparison, including the disease-class comparator that makes it more
      than a general-population contrast.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we were unable to ascertain the MECOM status for the fetus."
    explanation: >-
      The specific missing datum that stops this becoming a risk estimate.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also worth noting that 2-I-2 and 3-I-2 (both wild-type for MECOM) have also experienced pregnancy losses."
    explanation: >-
      Losses in wild-type women in the same families, which is the observation
      that keeps a non-MECOM explanation open.
  proposed_experiments:
  - experiment_id: rusat_fetal_genotyping_of_losses
    name: Genotyping of products of conception in MECOM-variant families
    description: >-
      Prospectively genotype MECOM in products of conception from pregnancies in
      known carrier families, and compare loss rates between variant-carrying
      and wild-type conceptuses within the same families.
    would_support:
    - phenotypes#Nonimmune hydrops fetalis
    supporting_outcome:
    - >-
      Enrichment of the variant among lost conceptuses, relative to liveborn
      siblings from the same families, would establish a fetal-genotype effect
      and connect the pregnancy losses to the severe prenatal end of the
      phenotype already curated here as hydrops.
    refuting_outcome:
    - >-
      No enrichment, with losses distributed independently of fetal genotype,
      would argue the excess is a maternal or family-level effect and should be
      removed from variant-specific counselling.

phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >
    The presenting feature in almost every case, present from birth and often
    severe enough to be found on a neonatal blood count taken for bleeding or
    petechiae. It is the feature the disease is named for and, in the mildest
    dominantly transmitted families, may be the only one.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
    temporality: CHRONIC
  sequelae:
  - target: Petechiae
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37230770
      reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "presented at birth with symptoms of bone marrow failure including severe anemia, hydrops, and petechial hemorrhages"
      explanation: >-
        Petechial haemorrhage reported as a presenting sign of the marrow
        failure at birth.
  - target: Abnormal bleeding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40170114
      reference_title: "A novel MECOM gene variant causes severe thrombocytopenia in a neonate: a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a 0-day-old female Han Chinese neonate who presented with severe thrombocytopenia and intracranial hemorrhage"
      explanation: >-
        Thrombocytopenia and haemorrhage reported together at presentation.
  evidence:
  - reference: PMID:41635268
    reference_title: "Syndrome of the Month: Radioulnar Synostosis With Amegakaryocytic Thrombocytopenia Type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Radioulnar synostosis with amegakaryocytic thrombocytopenia type 2 (RUSAT-2) is a rare inherited bone marrow failure syndrome characterized by congenital or progressive thrombocytopenia, frequent radioulnar synostosis, and variable multisystem involvement."
    explanation: >
      Names congenital or progressive thrombocytopenia as the defining
      haematological feature.
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the affected children presented with thrombocytopenia from birth, with three out of the four undergoing BMT."
    explanation: >
      Congenital onset in the HOXA11 families, and the transplant rate among
      them.

- category: Hematologic
  name: Megakaryocytopenia
  description: >
    Absent or severely reduced megakaryocytes on marrow examination. This is
    the finding that makes the thrombocytopenia a production failure rather
    than a destructive process, and it is the single most useful marrow result
    in separating RUSAT from immune thrombocytopenia in a neonate. Series
    variously describe the marrow as amegakaryocytic or hypomegakaryocytic.
  phenotype_term:
    preferred_term: Megakaryocytopenia
    term:
      id: HP:0005548
      label: Megakaryocytopenia
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on 12 patients with congenital hypomegakaryocytic thrombocytopenia caused by MECOM mutations (including 10 novel mutations)."
    explanation: >
      The marrow phenotype in the series that defined MECOM-associated
      syndrome.

- category: Skeletal
  name: Radioulnar Synostosis
  description: >
    Congenital bony fusion of the proximal radius and ulna, usually bilateral.
    It is present at birth, does not progress, and is frequently found only
    when someone looks for it - the functional deficit is limited enough that
    an affected parent may be unaware of it. Its diagnostic value is
    asymmetric: finding it in a child with congenital thrombocytopenia points
    hard at this disease, but not finding it excludes nothing.
  phenotype_term:
    preferred_term: Bilateral proximal radioulnar synostosis
    term:
      id: HP:0002974
      label: Radioulnar synostosis
    temporality: CHRONIC
  sequelae:
  - target: Limited pronation and supination of the forearm
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29519864
      reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "fusion of the bones of the forearms (radius and ulna) preventing normal supination of the affected forearm"
      explanation: >-
        States the fusion as the cause of the lost supination.
  evidence:
  - reference: PMID:38245683
    reference_title: "A novel missense mutation in the MECOM gene in a Chinese boy with radioulnar synostosis with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by varying presentation of congenital thrombocytopenia (progressing to pancytopenia), bilateral proximal radioulnar synostosis, and other skeletal abnormalities"
    explanation: >
      Gives the anatomical detail this entry curates: proximal and bilateral.
  - reference: PMID:37067177
    reference_title: "Expanded phenotypic and hematologic abnormalities beyond bone marrow failure in MECOM-associated syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within our full MECOM-associated syndrome cohort, skeletal abnormalities included radioulnar synostosis (n=5), clinodactyly (n=3), and radial hypoplasia (n=1)"
    explanation: >
      Counts the skeletal findings in an eight-patient cohort, giving both this
      phenotype and the digital ones.

- category: Skeletal
  name: Limited pronation and supination of the forearm
  description: >
    The functional consequence of the fusion. The forearm is fixed, typically
    in pronation, and rotation at the proximal radioulnar joint is lost. This
    is what a patient actually notices; the synostosis itself is radiographic.
  phenotype_term:
    preferred_term: Limited pronation/supination of forearm
    term:
      id: HP:0006394
      label: Limited pronation/supination of forearm
    clinical_course: STABLE
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital radioulnar synostosis (RUS) is a rare developmental abnormality involving fusion of the bones of the forearms (radius and ulna) preventing normal supination of the affected forearm"
    explanation: >
      States the loss of supination as the direct consequence of the fusion.

- category: Hematologic
  name: Pancytopenia
  description: >
    Progression from isolated thrombocytopenia to a fall in all three lineages.
    The tempo is the most variable thing about this disease: some infants reach
    it within months and need a transplant before their first birthday, while
    some carriers of the same allele reach only a single mild cytopenia in
    adulthood.
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:37610030
    reference_title: "A novel mutation in MECOM affects MPL regulation in vitro and results in thrombocytopenia and bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECOM-associated syndrome (MECOM-AS) is a rare disease characterized by amegakaryocytic thrombocytopenia, progressive bone marrow failure, pancytopenia and radioulnar synostosis with high penetrance."
    explanation: >
      Lists pancytopenia as part of the core phenotype.

- category: Hematologic
  name: Bone marrow hypocellularity
  description: >
    A hypocellular marrow is the tissue-level correlate of the peripheral
    cytopenias and is what places this disease among the inherited bone marrow
    failure syndromes rather than among the isolated inherited
    thrombocytopenias. In the largest series it is the pole of a spectrum whose
    other end is an essentially normal blood count.
  phenotype_term:
    preferred_term: Bone marrow hypocellularity
    term:
      id: HP:0005528
      label: Bone marrow hypocellularity
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical spectrum ranged from isolated radioulnar synostosis with no or mild hematological involvement to severe bone marrow failure without obvious skeletal abnormality"
    explanation: >
      Marrow failure as the severe end of the described range.

- category: Hematologic
  name: Aplastic Anemia
  description: >
    Frank aplastic anaemia is documented in adults with MECOM variants, in at
    least one case as the stage preceding myelodysplastic syndrome. It is the
    late-onset counterpart of the neonatal presentation and is a reason RUSAT
    belongs on the differential for an adult with unexplained aplastic anaemia
    and a fixed forearm.
  phenotype_term:
    preferred_term: Aplastic anemia
    term:
      id: HP:0001915
      label: Aplastic anemia
  sequelae:
  - target: Myelodysplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29519864
      reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the hematological involvement progressed from aplastic anemia to myelodysplastic syndrome (MDS)"
      explanation: >-
        The progression itself, in one reported carrier.
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the hematological involvement progressed from aplastic anemia to myelodysplastic syndrome (MDS); this presentation of RUS and development of MDS in adulthood is similar to the family reported by Ripperger"
    explanation: >
      Documents aplastic anaemia and its progression in an adult carrier.

- category: Hematologic
  name: Myelodysplasia
  description: >
    Reported in adults in two independent families, following a period of
    aplastic anaemia. Note the scope limit deliberately kept here: this entry
    records myelodysplastic progression, and does not extend it to a germline
    leukaemia predisposition claim. MECOM's association with acute myeloid
    leukaemia is through somatic overexpression, which is the opposite
    direction of effect from the germline loss modelled in this entry.
  phenotype_term:
    preferred_term: Myelodysplasia
    term:
      id: HP:0002863
      label: Myelodysplasia
    onset:
      onset_category: ADULT
  evidence:
  - reference: PMID:29519864
    reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a subgroup of patients with RUS who also present with hematological abnormalities ranging from thrombocytopenia to myelodysplastic syndrome (MDS)"
    explanation: >
      Places MDS at the far end of the haematological range in this disease.

- category: Hematologic
  name: Anemia
  description: >
    Part of the multilineage failure, and at the severe end it is the feature
    that kills: the two perinatal-lethal cases presented with severe anaemia
    and hydrops at birth.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two cases of infants born preterm who presented at birth with symptoms of bone marrow failure including severe anemia, hydrops, and petechial hemorrhages"
    explanation: >
      Severe anaemia at the most severe end of the spectrum.

- category: Prenatal
  name: Nonimmune hydrops fetalis
  description: >
    The most severe presentation, and one that is systematically
    under-ascertained. Both reported cases died in the neonatal period, neither
    had radioulnar synostosis, and neither was suspected clinically before
    sequencing - in one case the diagnosis came from postmortem trio exome
    sequencing. MECOM is not on targeted hydrops gene panels, so a broad
    sequencing approach is what finds these cases.
  phenotype_term:
    preferred_term: Nonimmune hydrops fetalis
    term:
      id: HP:0001790
      label: Nonimmune hydrops fetalis
  evidence:
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases add to the growing body of literature that describe MECOM-associated disease, particularly MECOM as a cause of fetal hydrops due to bone marrow failure in utero."
    explanation: >
      Establishes MECOM-related marrow failure as a cause of non-immune fetal
      hydrops.
  - reference: PMID:41617498
    reference_title: "Expanding the phenotypic spectrum of MECOM-associated syndrome: rare variants are associated with syndromic pulmonary arterial hypertension."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three were diagnosed in utero and died in the neonatal period."
    explanation: >
      INDIRECT, and kept for what it does establish rather than what it says:
      the sentence reports prenatal diagnosis and neonatal death, not hydrops.
      It supports the claim that the severe prenatal pole of this disease is
      not confined to the two hydrops case reports, which is why the phenotype
      is not curated as a two-patient curiosity.

- category: Hematologic
  name: Petechiae
  description: >
    A common presenting sign of the neonatal thrombocytopenia, and often what
    prompts the blood count that finds the disease.
  phenotype_term:
    preferred_term: Petechiae
    term:
      id: HP:0000967
      label: Petechiae
  evidence:
  - reference: PMID:37230770
    reference_title: "Perinatal-lethal nonimmune fetal hydrops attributed to MECOM-associated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two cases of infants born preterm who presented at birth with symptoms of bone marrow failure including severe anemia, hydrops, and petechial hemorrhages"
    explanation: >
      Petechial haemorrhage as a presenting sign at birth.

- category: Hematologic
  name: Abnormal bleeding
  description: >
    The clinical risk that makes the platelet count urgent. In the severe
    neonatal presentation the bleeding can be intracranial and fatal within
    days of birth.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:

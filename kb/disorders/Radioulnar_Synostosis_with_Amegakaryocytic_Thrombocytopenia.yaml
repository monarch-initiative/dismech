  - target: Megakaryocyte Differentiation Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      This is the weakest edge in the entry and is marked as such. Expressing
      the mutant in a megakaryocyte-competent cell line suppresses
      megakaryocytic differentiation - but so does expressing the wild-type
      protein, to almost the same degree, and the authors conclude the effect
      runs through sequences outside the homeodomain. So the edge from a
      homeodomain DNA-binding defect to a megakaryocyte arrest is drawn on the

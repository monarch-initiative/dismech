- name: Loss of EVI1 Transcriptional Control of MPL
  biological_scale: MOLECULAR
  description: >
    EVI1 transcriptionally regulates MPL, the thrombopoietin receptor.
    Biallelic MPL loss is the cause of congenital amegakaryocytic
    thrombocytopenia, so this branch is the proposed mechanistic reason RUSAT
    and CAMT are hard to tell apart in a newborn with an amegakaryocytic
    marrow: they converge on the same receptor.

    The node is deliberately named for a loss of control rather than for a
    direction, because the direction is not established and the obvious guess
    is probably backwards. What the assay shows is that the variant "impairs
    the repressive activity of the transcription factor" - and impaired
    repression would, on its face, raise MPL rather than lower it. No
    measurement of MPL message or thrombopoietin-receptor signalling in RUSAT
    patient megakaryocytes is cited here. `DYSREGULATED` is the honest tag
    until someone measures it; naming this node for a direction would export an
    assertion no source supports into the graph.

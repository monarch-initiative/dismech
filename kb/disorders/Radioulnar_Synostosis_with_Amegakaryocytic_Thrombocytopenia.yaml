      supports: SUPPORT
      evidence_source: OTHER
      snippet: "B-cell lymphopenia and hypogammaglobulinemia have been described in a subset of patients with MECOM deficiency."
      explanation: >-
        Names both the cellular and the humoral consequence.
  - target: Decreased circulating immunoglobulin concentration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37407873
      reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "B-cell lymphopenia and hypogammaglobulinemia have been described in a subset of patients with MECOM deficiency."
      explanation: >-
        The hypogammaglobulinaemia follows the B-cell defect in the same
        sentence.
  evidence:
  - reference: PMID:29540340
    reference_title: "MECOM-associated syndrome: a heterogeneous inherited bone marrow failure syndrome with amegakaryocytic thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radioulnar synostosis and B-cell deficiency were observed only in patients with mutations affecting a short region in the C-terminal zinc finger domain of EVI1."
    explanation: >
      The co-segregation of the B-cell and skeletal features with one variant
      region, which is the strongest genotype-phenotype signal in the disease.
  - reference: PMID:37407873
    reference_title: "MECOM Deficiency: from Bone Marrow Failure to Impaired B-Cell Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MECOM deficiency is a recently identified inborn error of immunity and inherited bone marrow failure syndrome caused by haploinsufficiency of the hematopoietic transcription factor MECOM."
    explanation: >
      The immunological reclassification that this node underwrites.

- name: Clonal Selection of Revertant Hematopoietic Stem Cells
  biological_scale: CELLULAR
  description: >
    Somatic genetic rescue. In a failing marrow, a stem cell that has lost the
    mutant MECOM allele outgrows the rest, and the usual mechanism is copy
    neutral loss of heterozygosity across chromosome 3q, which duplicates the
    residual wild-type allele. In a 15-person cohort, 7 individuals showed
    spontaneous resolution, alleviation, or late onset of haematological
    disease, and in 4 of 6 evaluable such cases this reversion was found.

    This node is the reason several things about the disease look strange from
    outside. Apparent non-penetrance in an adult carrier may be a rescued
    marrow rather than a mild allele. Neonatal thrombocytopenia that resolves
    on its own is a documented course, not a misdiagnosis. And it is the one
    node in this entry with a direct, immediate consequence for how the disease
    is diagnosed: blood is an unreliable germline sample in a carrier whose
    counts have recovered.

    The same demand-adapted clonal dynamics run the other way as well. Clonal
    haematopoiesis is curated as a sibling of this node rather than as its
    consequence - both descend from the same selective pressure in a failing
    marrow, which is what the source's "two roads" model says and as far as it
    goes.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For 4 of 6 individuals (3-II-4, 4-II-4, 5-II-1, and patient 11), amelioration of symptoms appears associated with somatic genetic rescue, in the form of copy neutral loss of heterozygosity of chromosome 3q encompassing MECOM"
    explanation: >
      The mechanism and the count. Note the source's own hedge - "appears
      associated with" - and that 2 of 6 rescued-looking individuals had no
      allelic imbalance at all, so reversion is not the whole explanation for
      mild disease.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study identifies 7 of 15 affected individuals who show spontaneous resolution, alleviation of hematological symptoms, or late onset of hematological manifestation of MECOM-associated syndrome."
    explanation: >
      How common the phenomenon is in the one cohort that looked for it.

- name: Age-Related Clonal Hematopoiesis
  biological_scale: CELLULAR
  description: >
    All three older individuals in the 15-person cohort of Venugopal et al.
    (PMID:38662475) carried somatic
    variants in age-related clonal haematopoiesis genes - ASXL1, DNMT3A, TET2 -
    and two also carried ETV6 variants, which is not a typical age-related
    finding. Transient 20q loss was seen in two individuals in the cohort,
    though not the same two - one of them is a younger carrier, so it is not a
    feature of the older group specifically. These clones likely improve
    haematopoietic output, which is the source's own hedged phrasing and the
    reason they expand; the cost is that the same alterations carry myeloid
    malignancy risk.

    Curated at the strength the source states and no further. Four myeloid
    malignancies had been reported among 80 MECOM-associated individuals -
    three adult myelodysplastic syndromes and one paediatric acute myeloid
    leukaemia, about 5% - and the source attributes that low frequency to most
    patients being transplanted young, which implies an underestimate without
    saying so outright. This
    entry therefore records myelodysplasia and clonal haematopoiesis as
    curated findings, and does not assert a quantified germline leukaemia
    predisposition, which no cited source supports.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  - target: Myelodysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38662475
      reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although the presence of such somatic alterations likely improves hematopoietic output, it may also signify an elevated risk of myeloid malignancy development, particularly with advancing age."
      explanation: >-
        The source's own statement of the risk, hedged as it is; INDIRECT
        because it is an inference from the clonal genotypes rather than an
        observed progression within this cohort.
  evidence:
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, all 3 older individuals within our cohort (4-II-1, 4-II-4, and 5-II-1) displayed somatic variants in known age–related clonal hematopoiesis genes"
    explanation: >
      The observation, with its small denominator visible in the quote itself.
  - reference: PMID:38662475
    reference_title: "Unraveling facets of MECOM-associated syndrome: somatic genetic rescue, clonal hematopoiesis, and phenotype expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which could explain relatively low frequency of progression to myeloid malignancy in 5% of patients (3 adult MDS cases and 1 pediatric acute myeloid leukemia of 80 individuals"
    explanation: >
      The published malignancy count and denominator, and the confounder -
      early transplant - that the source says makes it an underestimate.

- name: Failure of Proximal Radioulnar Joint Separation
  biological_scale: TISSUE
  description: >
    The radius and ulna fail to separate proximally during limb development and
    remain fused as bone. This is a developmental non-event rather than a
    destructive lesion: the joint interzone that should cavitate does not, so
    the forearm is fixed - usually in pronation - from birth and never
    supinates.

    Resolution here is deliberately coarse. Both RUSAT genes are expressed in
    the developing limb, and the human genetics assign the synostosis to them,
    but no cited source traces target genes from either factor to the human
    radioulnar interzone. The nearest mechanistic data are murine and are for
    HOXA11 rather than MECOM: Hoxa11/Hoxd11 double mutants mispattern the
    forelimb zeugopod, and the dominant defect there is a failure to form
    normal growth plates at the ends of the radius and ulna - a different
    lesion from a failure of joint separation, in a double mutant rather than
    a heterozygote. It is placed here as the closest available developmental
    context, not as the mechanism.
  biological_processes:
  - preferred_term: embryonic skeletal limb joint morphogenesis
    term:
      id: GO:0036023
      label: embryonic skeletal limb joint morphogenesis
    modifier: DECREASED
  - preferred_term: forelimb morphogenesis
    term:
      id: GO:0035136
      label: forelimb morphogenesis
    modifier: DECREASED
  downstream:
  - target: Radioulnar Synostosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29519864
      reference_title: "Expanding the phenotypic and genetic spectrum of radioulnar synostosis associated hematological disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital radioulnar synostosis (RUS) is a rare developmental abnormality involving fusion of the bones of the forearms (radius and ulna) preventing normal supination of the affected forearm"
      explanation: >-
        Names the malformation as developmental and gives its functional
        consequence.
  evidence:
  - reference: PMID:26581901
    reference_title: "Mutations in MECOM, Encoding Oncoprotein EVI1, Cause Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report missense mutations in MECOM resulting in a Mendelian disorder that provide compelling evidence for the critical role of EVI1 in normal hematopoiesis and in the development of forelimbs and fingers in humans."
    explanation: >
      Assigns forelimb development to EVI1 in humans on genetic grounds.
  - reference: PMID:14668414
    reference_title: "Multiple roles of Hoxa11 and Hoxd11 in the formation of the mammalian forelimb zeugopod."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "the most significant defect appears to be the failure to form normal growth plates at the proximal and distal ends of the zeugopod bones"
    explanation: >
      Developmental context for the HOXA11 arm, and INDIRECT for two reasons
      stated in the node description: the lesion is a growth-plate defect
      rather than a failure of joint separation, and it requires loss of both
      Hoxa11 and Hoxd11 rather than a single heterozygous allele.

- name: Multi-Organ Developmental MECOM Requirement
  biological_scale: TISSUE
  description: >
    A deliberately coarse node collecting the extra-haematopoietic
    malformations - digital, patellar, cardiac, renal and auditory - that recur across
    MECOM cohorts without any of them being obligate. The justification for
    grouping rather than splitting is that the only thing tying them together
    in the cited literature is one fact: MECOM is expressed at high levels in
    the embryonic heart, lungs, limb buds, nasal cavity and urinary tract, and
    those are the organs that turn out to be malformed. No source traces a
    pathway from EVI1 target genes to any individual lesion.

    Two honest limits. The expression data behind the grouping are murine,
    while the malformations are human. And a node at this resolution earns
    little: it says these findings are developmental rather than consequences
    of the marrow disease, which matters clinically - they are present at birth
    and are not corrected by transplant - but it does not explain any of them.
    Splitting it is the right move as soon as a source supports a specific
    route.

    The radioulnar synostosis is deliberately NOT routed through this node. It
    has its own node because it is the defining feature, because it segregates
    with a specific variant region, and because it has its own model-organism
    literature; folding it in here would lose all three.
  biological_processes:

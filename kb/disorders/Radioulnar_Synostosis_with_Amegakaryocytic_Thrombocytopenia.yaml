      Documents bleeding severe enough to be fatal in the neonatal period.

- category: Neurologic
  name: Intracranial hemorrhage
  description: >
    Reported as a cause of neonatal death in a MECOM-related case presenting on
    day zero with severe thrombocytopenia. Curated as a distinct phenotype
    because it is the specific catastrophic outcome that drives transfusion
    thresholds in the first weeks of life, rather than a generic bleeding
    tendency.
  phenotype_term:
    preferred_term: Intracranial hemorrhage

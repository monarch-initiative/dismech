name: Brachydactyly Type A2
synonyms:
- BDA2
- Mohr-Wriedt type brachydactyly
- Brachymesophalangy type 2
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type A2 (BDA2) is an autosomal dominant isolated hand and foot
  malformation in which the middle phalanx of the index finger — and, less
  consistently, of the fifth finger — is hypoplastic, rudimentary, or absent.
  The hypoplastic middle phalanx is characteristically triangular ("delta"
  phalanx), so that the index finger deviates laterally; the second toe is
  affected at least as consistently as the index finger. Unlike brachydactyly
  type A1, which arises from Indian hedgehog signalling defects, BDA2 is a
  disorder of the BMP/GDF5-BMPR1B-SMAD axis that patterns and segments the
  digital ray. Three distinct molecular routes converge on the same phenotype:
  dominant-negative missense variants in the type I BMP receptor BMPR1B,
  variants in its ligand GDF5 that block proteolytic maturation of the
  precursor, and microduplications of a limb enhancer downstream of BMP2 that
  alter BMP2 dosage in the developing limb.
disease_term:
  preferred_term: brachydactyly type A2
  term:

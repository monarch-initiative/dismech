genetic:
- name: BMPR1B Pathogenic Variants
  gene_term:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous missense variants at the BDA2 locus on 4q21-q25. I200K lies in
    the GS domain and abolishes kinase activity; R486W lies C-terminal to the
    kinase domain and retains it. Both act as dominant negatives on
    chondrogenesis.
  evidence:
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed linkage analysis in two unrelated German families and mapped a locus for BD type A2 to 4q21-q25."
    explanation: Maps the BDA2 locus to the interval containing BMPR1B.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the other family we identified a C1456 --> T mutation leading to an arginine-to-tryptophan amino acid change (R486W) in a highly conserved region C-terminal of the BMPR1B kinase domain."
    explanation: Identifies the second BDA2 allele in an independent family.
- name: GDF5 Pathogenic Variants
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Variants in the GDF5 precursor processing site (R380Q) cause BDA2 by
    preventing release of the mature ligand. GDF5 is also the BDC gene and a
    BDA1 gene, so allele-specific effect — not gene identity — determines which
    brachydactyly type results.
  evidence:
  - reference: PMID:18203755
    reference_title: Brachydactyly type A2 associated with a defect in proGDF5 processing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed mutation is located at the processing site of the protein, at which the GDF5 precursor is thought to be cleaved releasing the mature molecule from the prodomain."
    explanation: Places the BDA2 allele at the precursor cleavage site.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "has been shown to be due to mutations in the Bone morphogenetic protein receptor 1B (BMPR1B) or in its ligand Growth and differentiation factor 5 (GDF5)"
    explanation: Independent confirmation that GDF5 is an established BDA2 gene.
- name: BMP2 Limb-Enhancer Microduplication
  gene_term:
    preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A tandem microduplication of roughly 5.5 kb of conserved noncoding sequence
    about 110 kb downstream of BMP2 on 20p12.3, found in two families with no
    BMPR1B or GDF5 coding variant. The duplicated interval behaves as a
    limb-specific BMP2 enhancer in transgenic mice.
  evidence:
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A linkage analysis performed in a mutation-negative family identified a novel locus for BDA2 on chromosome 20p12.3 that incorporates the gene for Bone morphogenetic protein 2 (BMP2)."
    explanation: Establishes the third BDA2 locus in coding-variant-negative families.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of other patients by qPCR revealed a similar duplication in a second family."
    explanation: Replication of the duplication in an independent family.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Diagnosis rests on the clinical and radiographic pattern of a hypoplastic,
    absent, or triangular middle phalanx of the index finger with lateral
    deviation, confirmed where possible by finding a BMPR1B or GDF5 variant or,
    in coding-negative families, a BMP2 enhancer duplication on array CGH or
    qPCR. Sequencing alone will miss the regulatory form.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Triangular or absent middle phalanx of the second (and sometimes fifth)
    finger on hand radiographs, with a causal BMPR1B or GDF5 variant or a 20p12.3
    noncoding duplication when molecularly solved.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is clinical, anthropometric and radiological."
    explanation: Establishes the clinical-radiographic basis of brachydactyly diagnosis.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No point mutation was identified in BMP2, so a high-density array CGH analysis covering the critical interval of approximately 1.3 Mb was performed."
    explanation: >-
      Shows why copy-number analysis is needed: the regulatory form is invisible
      to sequencing of the coding region.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant transmission with variable expressivity,
    including the possibility of a regulatory (copy-number) rather than coding
    lesion in the family.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The nature of genetic counseling depends both on the pattern of inheritance of the type of brachydactyly present in the family and on the presence or absence of accompanying symptoms."
    explanation: Supports inheritance- and phenotype-specific counseling for isolated brachydactyly.
- name: Function- or Cosmesis-Directed Hand Surgery
  description: >-
    Surgery is reserved for meaningful impairment of hand function or selected
    cosmetic indications, and is usually not required in isolated brachydactyly.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plastic surgery is only indicated if the brachydactyly affects hand function or for cosmetic reasons, but is typically not needed."
    explanation: Defines the limited surgical indications in isolated brachydactyly.
- name: Hand Function Rehabilitation
  description: >-
    Physical and occupational therapy where digital shortening limits function.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Physical therapy and ergotherapy may ameliorate hand function."
    explanation: Supports function-directed rehabilitation.

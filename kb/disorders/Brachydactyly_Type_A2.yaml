inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    BDA2 segregates as an autosomal dominant trait with variable expressivity,
    both for the BMPR1B and GDF5 coding variants and for the BMP2 enhancer
    duplications.
  evidence:
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly (BD) type A2 is an autosomal dominant hand malformation characterized by shortening and lateral deviation of the index fingers and, to a variable degree, shortening and deviation of the first and second toes."
    explanation: Two German pedigrees establish autosomal dominant transmission with variable expressivity.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal-dominant brachydactyly type A2 (BDA2), a limb malformation characterized by hypoplastic middle phalanges of the second and fifth fingers, has been shown to be due to mutations in the Bone morphogenetic protein receptor 1B (BMPR1B) or in its ligand Growth and differentiation factor 5 (GDF5)."
    explanation: Confirms dominant inheritance across the BMPR1B- and GDF5-associated forms.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists the
      isolated brachydactyly type A2 entity (OMIM 112600; BMPR1B, BMP2, GDF5).
      The 2019 revision (PMID:31633310) placed the same entity in group 37
      "Brachydactylies (without extraskeletal manifestations)". Per-row
      re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.
prevalence:
- population: Reported pedigrees worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population-based estimate exists. Isolated BDA2 is known from a small
    number of multigenerational pedigrees; the general review literature places
    every isolated brachydactyly except types A3 and D in the rare category.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The various types of isolated brachydactyly are rare, except for types A3 and D."
    explanation: Places isolated BDA2 among the rare brachydactylies rather than the common ones.
pathophysiology:
- name: Dominant-Negative BMPR1B Receptor Signaling
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    BMPR1B is a type I transmembrane serine/threonine kinase that, with a type II
    receptor, transduces BMP and GDF5 signals to SMAD transcription factors.
    BDA2-associated missense variants fall either in the glycine/serine (GS)
    domain that must be transphosphorylated for receptor activation (I200K,
    kinase-deficient) or in a conserved region C-terminal to the kinase domain
    (R486W, kinase-competent). Both act on cartilage formation in a
    dominant-negative fashion rather than by simple haploinsufficiency, which is
    why two mechanistically different lesions produce the same digit phenotype.
  gene:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  biological_processes:
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  - preferred_term: SMAD Protein Signal Transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: DECREASED
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one family, we identified a T599 --> A mutation changing an isoleucine into a lysine residue (I200K) within the glycine/serine (GS) domain of BMPR1B, a region involved in phosphorylation of the receptor."
    explanation: Locates the first BDA2 allele in the GS domain required for receptor activation.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An in vitro kinase assay showed that the I200K mutation is kinase-deficient, whereas the R486W mutation has normal kinase activity, indicating a different pathogenic mechanism."
    explanation: Shows the two BDA2 alleles disable the receptor by different biochemical routes.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings imply that both mutations identified in human BMPR1B affect cartilage formation in a dominant-negative manner."
    explanation: Establishes dominant-negative action rather than haploinsufficiency as the mechanism.
  downstream:
  - target: Reduced BMP/SMAD Output in the Digital Chondrogenic Condensation
    description: >-
      A dominant-negative receptor lowers the BMP/GDF5 signal reaching SMADs in
      the condensing digital ray.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14523231
      reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analyses with a micromass culture system revealed a strong inhibition of chondrogenesis by both mutant receptors."
      explanation: Micromass assays link the mutant receptors directly to suppressed chondrogenesis.
- name: Defective proGDF5 Processing
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    GDF5 is the preferred ligand of BMPR1B and is synthesised as a precursor that
    must be cleaved at a dibasic site to release the mature growth factor from
    its prodomain. The BDA2-associated R380Q substitution sits at that processing
    site. The mutant protein is still secreted but is not cleaved by chondrogenic
    cells, and unprocessed proGDF5 is virtually inactive — so the lesion reduces
    the amount of active ligand available to BMPR1B without abolishing the gene
    product.
  gene:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  biological_processes:
  - preferred_term: Protein Processing
    term:
      id: GO:0016485
      label: protein processing
    modifier: DECREASED
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:18203755
    reference_title: Brachydactyly type A2 associated with a defect in proGDF5 processing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a family with a brachydactyly type A2 and identified a heterozygous arginine to glutamine (R380Q) substitution in the growth/differentiation factor 5 (GDF5) in all affected individuals."
    explanation: Identifies the segregating GDF5 processing-site allele in a BDA2 family.
  - reference: PMID:18203755
    reference_title: Brachydactyly type A2 associated with a defect in proGDF5 processing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analyses showed that wt GDF5 was processed by the chicken micromass cells, whereas the mutants were not, indicating that the mutations interfere with processing and that this leads to a strong reduction of biological activity."
    explanation: Demonstrates that the variant blocks precursor cleavage and lowers ligand activity.
  downstream:
  - target: Reduced BMP/SMAD Output in the Digital Chondrogenic Condensation
    description: >-
      Less mature GDF5 reaches BMPR1B, lowering pathway output in the digital ray.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18203755
      reference_title: Brachydactyly type A2 associated with a defect in proGDF5 processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both mutants were secreted from chicken micromass cultures, but showed diminished biological activity."
      explanation: Ties the processing defect to reduced biological signalling activity.
- name: Altered BMP2 Enhancer Dosage in the Developing Limb
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    In BDA2 families without a BMPR1B or GDF5 coding variant, the lesion is a
    microduplication of a conserved noncoding element roughly 110 kb downstream
    of BMP2. A transgenic reporter shows the element drives limb expression
    overlapping endogenous Bmp2, identifying it as a limb-specific BMP2 enhancer.
    Duplicating it changes BMP2 dosage in the limb bud rather than altering any
    protein, so this is a regulatory route into the same pathway that the coding
    lesions disturb.
  gene:
    preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  biological_processes:
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DYSREGULATED
  - preferred_term: Embryonic Limb Morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A microduplication of approximately 5.5 kb in a noncoding sequence approximately 110 kb downstream of BMP2 was detected."
    explanation: Identifies the noncoding duplication segregating in a mutation-negative BDA2 family.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By using a transgenic mouse model we can show that this sequence is able to drive expression of a X-Gal reporter construct in the limbs."
    explanation: Transgenic reporter assays establish the duplicated sequence as a limb enhancer.
  - reference: PMID:19327734
    reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results reveal an additional functional mechanism for the pathogenesis of BDA2, which is duplication of a regulatory element that affects the expression of BMP2 in the developing limb."
    explanation: States the regulatory mechanism as a third route to BDA2.
  downstream:
  - target: Reduced BMP/SMAD Output in the Digital Chondrogenic Condensation
    description: >-
      Altered limb-bud BMP2 dosage deregulates the same BMP/SMAD output that the
      receptor and ligand lesions reduce.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19327734
      reference_title: Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The almost complete overlap with endogenous Bmp2 expression indicates that a limb-specific enhancer of Bmp2 is located within the identified duplication."
      explanation: >-
        Supports altered limb BMP2 expression as the proximate consequence; the
        quantitative effect on downstream SMAD output in the human digital ray
        was not measured, hence PARTIAL.
- name: Reduced BMP/SMAD Output in the Digital Chondrogenic Condensation
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: CELLULAR
  description: >
    Digital rays form from a continuous prechondrogenic mesenchymal condensation
    that segments into phalanges and metacarpals, with growth at the distal end.
    BMP/GDF5 signalling through BMPR1B controls both chondrocyte differentiation
    within the condensation and the position of the interphalangeal joints, which
    is why brachydactyly and abnormal interdigital joint formation travel
    together across types A-C. Lowering the signal shortens the segment that is
    forming when the deficit bites.
  biological_processes:
  - preferred_term: Chondrocyte Differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Prechondrogenic Mesenchymal Cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The digital rays are thought to be formed from spatially continuous prechondrogenic condensations that subsequently segment into individual skeletal elements, i.e., the phalanges and the metacarpals."
    explanation: Describes the developmental substrate on which the reduced BMP signal acts.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thus, BD types A-C have certain overlapping features including hypoplasia/aplasia of phalanges and abnormal interdigital joint formation, suggesting that the formation of joints and phalanges are linked on a developmental and molecular basis."
    explanation: Supports a shared segmentation/joint-formation effector for the type A-C brachydactylies.
  - reference: PMID:19790289
    reference_title: "The brachydactylies: a molecular disease family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These studies have shown that the BMP pathway plays a pivotal role in the normal development of digits and joints and that the majority of brachydactyly disease genes are directly or indirectly linked to this pathway."
    explanation: Places the BMP pathway at the centre of the brachydactyly disease family.
  downstream:
  - target: Hypoplasia of the Index and Fifth Middle Phalanges
    description: >-
      Reduced chondrogenic output in the second (and fifth) digital ray leaves a
      rudimentary, often triangular middle phalanx.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - suppressed chondrogenesis in the prechondrogenic condensation
    - mispositioned interphalangeal joint segmentation
    evidence:
    - reference: PMID:14523231
      reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overexpression of mutant chBmpR1b in vivo in chick embryos by using a retroviral system resulted either in a BD phenotype with shortening and/or missing phalanges similar to the human phenotype or in severe hypoplasia of the entire limb."
      explanation: >-
        In vivo misexpression of the mutant receptor reproduces the shortened or
        missing phalanges seen in patients.
- name: Hypoplasia of the Index and Fifth Middle Phalanges
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation: a hypoplastic, aplastic, or triangular
    ("delta") middle phalanx of the index finger and, less consistently, the
    fifth finger, with lateral deviation of the affected digit. Because the same
    patterning program is reused in the hindlimb autopod, the first and second
    toes are involved in roughly half of affected individuals.
  biological_processes:

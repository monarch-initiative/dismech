    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article we describe the molecular cause of BDA2, a hand malformation characterized by hypoplasia/aplasia of the middle phalanx of the second and sometimes the fifth fingers"
    explanation: Defines the cardinal digital malformation of BDA2.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half of them also had foot involvement such as deviation and shortening of the first or second toes, cutaneous syndactyly between the second and third toes, and camptodactyly."
    explanation: Quantifies hindlimb involvement in the two molecularly solved families.

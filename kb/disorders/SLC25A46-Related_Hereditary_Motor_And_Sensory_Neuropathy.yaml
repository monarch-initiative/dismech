      atrophy.
    explanation: >-
      An independent count of reported patients across the spectrum.
progression:
- phase: Childhood-onset visual and gait impairment
  notes: >-
    Classic HMSN6B declares itself in childhood, often within the first decade, with
    visual loss and gait difficulty. The recurrent p.Arg340Cys genotype is
    consistently childhood-onset.
  evidence:
  - reference: PMID:28558379
    reference_title: SLC25A46 Mutations Associated with Autosomal Recessive Cerebellar Ataxia in North African Families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the previously reported variant p.Arg340Cys seems to be consistently
      associated with the same clinical features such as childhood onset, optic
      atrophy, gait and speech difficulties
    explanation: >-
      Records childhood onset as a consistent feature of this genotype.
- phase: Slowly progressive course with variable survival
  notes: >-
    The course is chronic and slowly progressive without remission. Across the whole
    SLC25A46 spectrum, survival ranges from neonatal death in the severe forms to the
    fifties; within this entry's rung, survival into adulthood is the rule.
  evidence:
  - reference: PMID:28653766
    reference_title: Extension of the phenotype of biallelic loss-of-function mutations in SLC25A46 to the severe form of pontocerebellar hypoplasia type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The course of the disease was highly variable ranging from severe muscular
      hypotonia at birth and early death to first manifestations in late childhood
      and survival into the fifties.
    explanation: >-
      States the range of onset and survival across the allelic spectrum.
clinical_trials:
- name: NCT04594590
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    An observational natural-history study characterising the clinical course of the
    neuropathy and optic atrophy in paediatric and adult patients with biallelic
    SLC25A46 variants. It is the only registered study found for this disease and
    addresses the absence of longitudinal data.
  target_phenotypes:
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  - preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  evidence:
  - reference: clinicaltrials:NCT04594590
    reference_title: "A Natural History Study of Neurodegeneration and Optic Atrophy Caused by SLC25A46 Mutations in Pediatric and Adult Patients"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of the study is to systematically characterize the clinical course
      of the progressive neuropathy and optic atrophy observe in pediatric and adult
      patients with biallelic mutations in the solute carrier family 25 member 46
      (SLC25A46) gene.
    explanation: >-
      The registry record's own statement of the study's purpose and population.
  notes: >-
    The recorded status is a snapshot. Status and phase were not re-checked against
    the live registry when this entry was written, so run
    just clinicaltrials-status-audit before relying on them.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Exome or genome sequencing, or a hereditary neuropathy or optic neuropathy panel
    that includes SLC25A46. Copy-number analysis matters here because exonic
    deletions have been reported, and biallelic phase should be confirmed by
    parental testing.
  evidence:
  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By whole-exome sequencing of patients with optic atrophy and CMT2, we
      identified four families with recessive mutations in SLC25A46.
    explanation: >-
      Exome sequencing is how the gene was found and remains the diagnostic route.
- name: Nerve conduction studies
  description: >-
    Electrophysiology establishes the axonal character of the neuropathy and can
    reveal it when it is subclinical, which is what confirmed causality in the
    apparently isolated optic neuropathy case.
  evidence:
  - reference: PMID:41640504
    reference_title: An Apparently Isolated Optic Neuropathy Associated with Biallelic Variants in SLC25A46 Gene Encoding the Mitochondrial Ugo1-Like Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of a subclinical peripheral neuropathy revealed by
      electroneuromyography confirmed the responsibility of these SLC25A46 variants.
    explanation: >-
      Shows electrophysiology detecting neuropathy that was clinically silent.
- name: Fibroblast mitochondrial morphology
  description: >-
    Patient fibroblasts show a hyper-filamentous, interconnected network, which can
    serve as functional support for a variant of uncertain significance. Read with
    care: the direction of the morphological change is not uniform across models.
  evidence:
  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further examined fibroblasts from proband IT II-3, which display a
      hyper-filamentous and interconnected network in comparison to both, the
      unaffected sibling IT II-2 and control, indicating the relevance of this
      phenomenon
    explanation: >-
      Demonstrates the fibroblast finding against an unaffected sibling control.
  - reference: PMID:41640504
    reference_title: An Apparently Isolated Optic Neuropathy Associated with Biallelic Variants in SLC25A46 Gene Encoding the Mitochondrial Ugo1-Like Protein.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of functional and structural mitochondrial abnormalities in the
      patient's fibroblasts was consistent with the mild neurological phenotype.
    explanation: >-
      Refutes the usefulness of this test at the mild end of the spectrum: a patient
      with confirmed biallelic variants had entirely normal fibroblasts, so a normal
      result does not exclude the diagnosis.
differential_diagnoses:
- name: MFN2-related Charcot-Marie-Tooth disease type 2A
  description: >-
    The closest mimic, and not a coincidence: MFN2 is one of the fusion GTPases
    SLC25A46 partners with. MFN2 causes axonal CMT2 and a subset of patients also
    develop optic atrophy, giving the same two-feature combination. The separators
    are inheritance, dominant for MFN2 against recessive here, and the gene.
  distinguishing_features:
  - Dominant inheritance in most MFN2 disease, against obligate biallelic SLC25A46 variants
  - Molecular testing is the definitive separator; the clinical overlap is genuine
  evidence:
  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in MFN2 account for more than 20% of inherited axonal degenerative
      peripheral neuropathies, Charcot-Marie-Tooth type 2 (CMT2A)
    explanation: >-
      Establishes MFN2 as the leading cause of axonal CMT2 and so the main
      alternative. Marked BACKGROUND because the sentence is the founding paper's
      framing of prior work rather than its own result.
- name: OPA1-related dominant optic atrophy and optic atrophy plus
  description: >-
    The other fusion-machinery partner. OPA1 is the major cause of dominant optic
    atrophy and its plus forms add neuropathy, ataxia, deafness or myopathy,
    reproducing this entry's combination. Compound heterozygous OPA1 variants give
    Behr syndrome, which overlaps further.
  distinguishing_features:
  - Typically dominant with incomplete penetrance, against recessive inheritance here
  - Deafness is common in OPA1 plus phenotypes and is not a feature of this disease
  evidence:
  - reference: PMID:36977595
    reference_title: The role of the mitochondrial outer membrane protein SLC25A46 in mitochondrial fission and fusion.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Although haploinsufficient-related mutations in OPA1 lead to optic atrophy,
      dominant gain-of-function mutations in OPA1 cause more severe phenotypes of
      optic atrophy, often concomitant with deafness, axonal neuropathy, ataxia,
      and/or myopathy.
    explanation: >-
      Describes the OPA1 plus phenotype that overlaps this disease. BACKGROUND
      because the sentence is this paper's introduction to the field.
- name: PDXK-related hereditary motor and sensory neuropathy type VIc
  description: >-
    The adjacent type in the same HMSN numbering, also recessive and also combining
    axonal neuropathy with optic atrophy, but metabolic rather than mitochondrial:
    PDXK encodes pyridoxal kinase and the disease is treatable with pyridoxal
    5'-phosphate. That treatability is why the distinction matters clinically and
    not only nosologically.
  disease_term:
    preferred_term: "neuropathy, hereditary motor and sensory, type VIc, with optic atrophy"
    term:
      id: MONDO:0032792
      label: "neuropathy, hereditary motor and sensory, type VIc, with optic atrophy"
  distinguishing_features:
  - Low plasma pyridoxal 5'-phosphate with reduced erythrocyte pyridoxal kinase activity in PDXK disease
  - PDXK disease responds to pyridoxal 5'-phosphate supplementation; no targeted therapy exists for SLC25A46 disease
- name: Pontocerebellar hypoplasia type 1E
  description: >-
    Not a different gene but the severe end of this gene's own spectrum, and the
    distinction is one of allele severity rather than of entity. Near-complete loss
    of SLC25A46 presents as congenital pontocerebellar hypoplasia with spinal motor
    neuron degeneration and neonatal death from respiratory insufficiency. It is
    curated as a subtype of Pontocerebellar_Hypoplasia, not here.
  disease_term:
    preferred_term: "pontocerebellar hypoplasia, type 1E"
    term:
      id: MONDO:0030260
      label: "pontocerebellar hypoplasia, type 1E"
  distinguishing_features:
  - Congenital onset with death in the first weeks of life, against childhood onset and survival into adulthood
  - Caused by alleles that markedly destabilise or abolish the protein, rather than partially functional missense alleles
  evidence:
  - reference: PMID:28653766
    reference_title: Extension of the phenotype of biallelic loss-of-function mutations in SLC25A46 to the severe form of pontocerebellar hypoplasia type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on 4 patients from 2 families diagnosed with PCH who died
      within the first month of life from respiratory insufficiency.
    explanation: >-
      Documents the neonatally lethal presentation that marks the severe end of the
      spectrum.
- name: SLC25A46-related Leigh syndrome
  description: >-
    Another severe allelic presentation of the same gene, in which the bioenergetic
    arm of the mechanism dominates and produces a Leigh-type encephalopathy rather
    than a neuropathy. ClinGen curates it as a separate gene-disease pair and rates
    the evidence Limited.
  distinguishing_features:
  - Leigh-type brain lesions and metabolic decompensation rather than a length-dependent neuropathy
  - ClinGen classifies the SLC25A46-Leigh syndrome relationship Limited, against Definitive for this disease
  evidence:
  - reference: PMID:27390132
    reference_title: SLC25A46 is required for mitochondrial lipid homeostasis and cristae maintenance and is responsible for Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We uncovered a homozygous missense mutation in SLC25A46, the mammalian
      orthologue of Ugo1, in a subject with Leigh syndrome.
    explanation: >-
      Establishes the Leigh syndrome presentation of the same gene.
discussions:
- discussion_id: slc25a46_fission_or_fusion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does SLC25A46 promote mitochondrial fission or mitochondrial fusion, and which
    direction of imbalance actually drives neurodegeneration in patients?
  rationale: >-
    This entry's causal chain runs through loss of fission and a shift toward
    MFN1/MFN2-mediated hyperfusion, which is what patient fibroblasts and
    pathogenic missense variants show. But the primary literature does not agree on
    the protein's direction of action, and the disagreement is explicit rather than
    apparent. The founding study concluded that SLC25A46 acts pro-fission and found
    no interaction with MFN2 or OPA1, only with mitofilin. Subsequent work reported
    direct interactions with both fusion GTPases and mapped the interfaces.
    Morphology does not settle it either: knockdown and pathogenic variants give
    hyperfusion, whereas a complete knockout cell line gives fragmentation, and the
    C. elegans orthologue behaves as a fusion factor whose phenotype is suppressed
    by loss of the fission factor drp-1 and rescued by overexpressing the mitofusin
    orthologue. A resource that asserts a single direction without recording the
    disagreement would overstate what is known, and the direction matters because
    it determines whether a therapeutic strategy should push the balance toward
    fission or toward fusion.
  attaches_to:
  - "pathophysiology#Loss of SLC25A46 at Mitochondrial Fission and Fusion Sites"
  - "pathophysiology#Dysregulated MFN1/MFN2 and OPA1 Oligomerization"
  - "pathophysiology#Aberrant Mitochondrial Network Morphology"
  posed_by: "dismech curation (issue #16350)"
  posed_date: "2026-11-03T00:00:00Z"
  evidence:
  - reference: PMID:40444356
    reference_title: SLC-25A46 regulates mitochondrial fusion through the mitofusin protein FZO-1 and is essential for maintaining neuronal morphology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, the function of SLC25A46 in mitochondrial morphogenesis remains
      controversial, with several reports suggesting it acts as a mitochondrial
      fission factor, whereas others propose it as a fusion factor.
    explanation: >-
      States the controversy directly, which is the gap this discussion records.
  - reference: PMID:40444356
    reference_title: SLC-25A46 regulates mitochondrial fusion through the mitofusin protein FZO-1 and is essential for maintaining neuronal morphology.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disease model worms carrying mutations associated with SLC25A46 exhibited
      mitochondrial fragmentation and accelerated neurodegeneration, suggesting that
      slc-25A46 maintains neuronal morphology through regulating mitochondrial fusion
      regulation.
    explanation: >-
      Refutes the pro-fission reading this entry's chain assumes: in the worm, disease
      alleles fragment mitochondria and the protein acts through the mitofusin
      orthologue.
  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, our data supports that unlike Ugo1, SLC25A46 acts in a pro-fission
      manner.
    explanation: >-
      The founding study's pro-fission conclusion, one side of the disagreement.
  - reference: PMID:39222684
    reference_title: Identification of SLC25A46 interaction interfaces with mitochondrial membrane fusogens Opa1 and Mfn2.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      We reveal that the bundle signaling element of Opa1 interacts with SLC25A46,
      and present evidence of an Mfn2 interaction involving the SLC25A46 cytosolic
      face.
    explanation: >-
      Refutes the founding study's specific finding that SLC25A46 does not interact
      with MFN2 or OPA1, by mapping both interfaces.
- discussion_id: slc25a46_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do retinal ganglion cells, long peripheral axons and Purkinje cells
    degenerate when SLC25A46 is lost, while the ubiquitously expressed protein
    leaves most tissues clinically unaffected?
  rationale: >-
    The protein is expressed broadly and its interactome spans OXPHOS complexes,
    adenine nucleotide translocases, MICOS subunits and ER contact-site components
    in cerebellum, cerebrum, heart and thymus alike. Yet the disease is almost
    entirely neurological, and within the nervous system it picks out three cell
    populations. Transcript enrichment in retinal ganglion cells is part of the
    answer but cannot be the whole of it, since Purkinje cells and long peripheral
    axons are hit without a comparable enrichment claim. The plausible explanation
    is that these cells have the longest or most trafficking-dependent processes and
    the least metabolic reserve, so they are the first to fail when organelle
    delivery and cristae integrity degrade together. That remains a hypothesis: no
    study has compared the threshold for degeneration across cell types in the same
    system. The mouse models also report a lymphoid phenotype and neuromuscular
    junction abnormalities that have no recognised clinical counterpart in patients,
    which sharpens rather than resolves the question.
  attaches_to:
  - "pathophysiology#Respiratory Chain Deficiency and Bioenergetic Failure"
  - "pathophysiology#Impaired Mitochondrial Transport and Distribution in Neuronal Processes"
  posed_by: "dismech curation (issue #16350)"
  posed_date: "2026-11-03T00:00:00Z"
  evidence:
  - reference: PMID:34983179
    reference_title: Proteomic Identification of the SLC25A46 Interactome in Transgenic Mice Expressing SLC25A46-FLAG.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tissue-specific co-immunoprecipitated proteins were enriched for synapse
      annotated proteins in the cerebellum and cerebrum for metabolic processes in
      the heart and for nuclear processes and proteasome in the thymus.
    explanation: >-
      Shows the interactome differs by tissue, which is a candidate contributor to
      selectivity but does not by itself explain which cells degenerate.
  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      the transcript has been shown to be highly expressed in the neurons affected
      in patients including spinal cord, cerebellum, and optic chiasm
    explanation: >-
      Expression in the affected neuron populations is partial support for a
      threshold explanation. INDIRECT because expression level does not establish
      differential vulnerability. BACKGROUND because the sentence restates prior
      expression data that this paper cites rather than measured, and OTHER because
      the quoted sentence does not say what kind of study produced it, so grading it
      as a cell-culture result would be a guess.
notes: >-
  Entry name. The MONDO label for the bound term is the positional
  "neuropathy, hereditary motor and sensory, type 6B". The gene-related name used
  here is established as a MONDO EXACT synonym of the same term, "SLC25A46
  hereditary motor and sensory neuropathy type 6", and the gene is the root of this
  entry's pathograph. The "type 6" suffix is dropped because HMSN type 6 is the
  parent class, which also contains the MFN2-related type 6A and the PDXK-related
  type VIc, so carrying it would make the name broader than the entry. All prior
  names are kept in synonyms.


  Scope. SLC25A46 causes a graded allelic spectrum, and this entry is the
  neuropathy-with-optic-atrophy rung of it, which is what MONDO:0014671 and
  OMIM:616505 denote. The severe ends have their own terms and their own homes:
  pontocerebellar hypoplasia type 1E is curated as a has_subtypes row on
  Pontocerebellar_Hypoplasia under MONDO:0030260, and SLC25A46-related Leigh
  syndrome is a separate ClinGen gene-disease pair rated Limited. Both are recorded
  in differential_diagnoses rather than restated here. The ataxia-predominant and
  progressive-myoclonic-ataxia presentations are not split out, because the
  published families are too few to separate them from this rung on anything other
  than which feature happened to dominate at presentation.


  GeneReviews. There is no SLC25A46-specific chapter and no chapter titled for this
  disease; a PubMed search of genereviews[book] for SLC25A46 in title or abstract
  returns nothing, and a search for the gene symbol returns nothing. The
  Charcot-Marie-Tooth Hereditary Neuropathy Overview is tagged in references as the
  disease-family baseline, but its PubMed abstract is only a statement of the
  chapter's purpose and contains no clinical content, so no phenotype in this entry
  rests on it. The phenotype baseline here is therefore the primary literature plus
  the ClinGen curation, which is weaker than a GeneReviews baseline and is the main
  limitation of this entry.


  Frequencies. VERY_FREQUENT is used only for the two core features that every
  series reports. Most phenotypes carry no frequency at all, because the published
  cohorts are small case reports and family series that do not tabulate findings
  systematically, and guessing a band from a handful of patients would invent
  precision. Myoclonus and spasticity are deliberately among those: the sources name
  them as part of the spectrum without quantifying them.


  Unevidenced claims. Three items carry no evidence and say so rather than reaching
  for a quote that does not support them. Optic disc pallor is the expected
  ophthalmoscopic sign of the optic atrophy, and none of the cited reports describes
  disc appearance; the foot surgery and low-vision support treatments are standard
  management of the deformity and of visual loss, and the cited literature never
  discusses either. Each records that absence in its own notes.


  An earlier draft of this entry also listed pes cavus and reduced visual acuity as
  unevidenced, which was wrong: both are reported in papers the entry already cited,
  pes cavus in the p.Arg340Cys genotype table and as hollow feet in the North
  African families, and reduced visual acuity on eye examination in the same series.
  Both now carry that evidence. The error is recorded here because a false
  statement that no source exists is worse than a missing citation: it tells the
  next curator not to look.


  Phenotypes outside the causal graph. Myoclonus and spasticity have no inbound
  causal edge, because the entry has no cortical or pyramidal pathophysiology node
  to originate one and the evidence does not support inventing one. Both are
  therefore recorded as features of the spectrum that this entry's mechanism does
  not yet explain, which is the honest state rather than a wiring omission.


  Nerve conduction binding. The electrophysiology phenotype is bound to the parent
  HP:0040129 Abnormal nerve conduction velocity rather than to HP:0003431 Decreased
  motor nerve conduction velocity, because the human pattern is axonal, with reduced
  amplitudes and relatively preserved velocities. The narrower term would assert the
  demyelinating pattern this disease does not show.


  Reflex binding. Bound to HP:0001284 Areflexia rather than to its sibling
  HP:0001265 Hyporeflexia, because the source reports deep tendon reflexes as
  unelicitable rather than reduced. The two are siblings under Abnormality of
  reflexes, not a general and a specific form of one thing, so the choice is a claim
  about the examination finding and not a matter of precision.


  Molecular function binding. The node carrying the gene binds GO:0044877
  protein-containing complex binding, not a transport activity. SLC25A46 lacks the
  SLC25 family's signature motifs and has no identified substrate, so a transporter
  term would assert an activity its own literature denies; what it demonstrably does
  is bind the fusion GTPases, the MICOS complex through MIC60, and the ER membrane
  protein complex, which is complex binding. The modifier is DECREASED because the
  disease alleles reduce that binding, whether by removing the protein or by
  disturbing a specific interaction.


  Mechanism confidence. The chain from the variant to the three degenerating cell
  populations is well supported at both ends and weakest in the middle. The step
  from bioenergetic and trafficking failure to selective degeneration is recorded
  with INDIRECT_UNKNOWN_INTERMEDIATES because it is an inference from cell and mouse
  data rather than a demonstrated sequence, and the direction of the dynamics defect
  itself is openly disputed in the literature. Both are recorded as knowledge gaps
  rather than smoothed over.

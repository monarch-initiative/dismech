pathophysiology:
- name: Biallelic SLC25A46 Loss of Function
  description: >-
    Homozygous or compound heterozygous SLC25A46 variants remove or cripple a
    highly derived SLC25-family protein of the outer mitochondrial membrane. The
    protein has no identified transported substrate and is the closest human
    relative of yeast Ugo1, an adaptor of the fusion machinery, so the lesion is a
    loss of structural organisation of mitochondrial membrane dynamics rather than
    loss of a transport activity.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

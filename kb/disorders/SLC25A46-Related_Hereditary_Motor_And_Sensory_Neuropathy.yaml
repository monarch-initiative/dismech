  - reference: PMID:26168012
    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that SLC25A46, like Ugo1, is a modified carrier protein that
      has been recruited to the outer mitochondrial membrane and interacts with the
      inner membrane remodeling protein mitofilin (Fcj1).
    explanation: >-
      Establishes the protein's outer-membrane localisation and Ugo1-like identity,
      which is what makes the lesion one of membrane organisation.
  - reference: PMID:39222684
    reference_title: Identification of SLC25A46 interaction interfaces with mitochondrial membrane fusogens Opa1 and Mfn2.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Residing in the outer mitochondrial membrane (OMM), SLC25A46 lacks the
      signature sequence motifs of the SLC25 family ( 10 ), does not have an
      identified substrate and contains a distinct N-terminal extension.
    explanation: >-
      States that the protein carries no SLC25 signature motifs and has no known
      substrate, so its role is not solute transport.
  downstream:
  - target: Destabilization and Proteasomal Degradation of SLC25A46
    causal_link_type: DIRECT
    description: >-
      Most pathogenic missense alleles act by destabilising the protein rather than
      by abolishing a catalytic activity.
    evidence:
    - reference: PMID:30178502
      reference_title: Insights into the genotype-phenotype correlation and molecular function of SLC25A46.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By studying seven different nontruncating mutations, we found that the
        stability of the SLC25A46 protein inversely correlates with the severity of
        the disease and the patient's variant does not markedly destabilize the
        protein.
      explanation: >-
        Establishes the inverse relationship between protein stability and severity
        across seven non-truncating alleles, which is what makes destabilisation the
        route from variant to loss of function. Note the same sentence records that
        this patient's mild allele does not markedly destabilise the protein, which
        is the second route recorded on the other edge.
  - target: Loss of SLC25A46 at Mitochondrial Fission and Fusion Sites
    causal_link_type: DIRECT
    description: >-
      Milder alleles leave abundance largely intact and instead disturb a specific
      partner interaction, so the functional endpoint is reached without
      degradation.
    evidence:
    - reference: PMID:30178502
      reference_title: Insights into the genotype-phenotype correlation and molecular function of SLC25A46.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We thus suggest that there are two distinct molecular mechanisms in
        SLC25A46-associated pathogenesis, one that destabilizes the protein while
        the other alters the molecular interactions of the protein.
      explanation: >-
        Supports a second, degradation-independent route from the variant to loss
        of function at the membrane.
- name: Destabilization and Proteasomal Degradation of SLC25A46
  description: >-
    Destabilising variants are ubiquitylated at the outer membrane by the E3
    ligases MULAN and MARCH5 and extracted and degraded by p97 and the proteasome.
    This proteolysis runs independently of mitophagy and of apoptotic outer-membrane
    stress pathways, so the protein is removed without the organelle being turned
    over.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proteasomal degradation of mutant SLC25A46
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED

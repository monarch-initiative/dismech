    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Mutant cerebellar neurons carry enlarged mitochondria that are abnormally
      distributed and transported, which is the node this model observes directly.
    limitations: >-
      A complete null, whereas the human disease at this rung is caused by partially
      functional missense alleles; the null is closer to the lethal
      pontocerebellar-hypoplasia end of the spectrum.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model is a constitutive null while patients with this phenotype retain
        partial SLC25A46 function, so the model represents a more severe genotype
        than the one it is cited for.

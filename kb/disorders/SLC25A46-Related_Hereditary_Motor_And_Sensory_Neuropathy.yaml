    evidence_source: IN_VITRO
    snippet: >-
      The E3 ubiquitin ligases MULAN and MARCH5 coordinate ubiquitylation of
      SLC25A46 L341P, leading to degradation by organized activities of P97 and the
      proteasome.
    explanation: >-
      Names the ligases and the extraction/degradation machinery that clear the
      destabilised protein.
  notes: >-
    The allele characterised in this pathway, L341P, is one that causes the severe
    pontocerebellar hypoplasia end of the spectrum rather than this entry's
    phenotype. The degradation route is cited here as the general mechanism by
    which a destabilising SLC25A46 missense allele is cleared; the severity that
    follows depends on how much protein a given genotype leaves.

    reference_title: "Mutations in SLC25A46, encoding a UGO1-like protein, cause an optic atrophy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By whole-exome sequencing of patients with optic atrophy and CMT2, we
      identified four families with recessive mutations in SLC25A46.
    explanation: >-
      The gene discovery that established SLC25A46 as causal for this phenotype.
  - reference: CGGV:assertion_9852fb40-0df1-4668-ba57-38a4971cb244-2020-05-26T160000.000Z
    reference_title: "SLC25A46 / neuropathy, hereditary motor and sensory, type 6B (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      12 missense, 2 nonsense, 2 frameshift, and 2 splice variants have been
      reported in humans.
    explanation: >-
      ClinGen's count of the reported variant classes, showing missense
      predominance.
  notes: >-
    SLC25A46 at 5q22.1 encodes the outer mitochondrial membrane protein that is the
    sole cause of this disease. Reported alleles are predominantly missense, with
    nonsense, frameshift and splice variants and exonic deletions also described;
    the truncating and deletion alleles cluster at the lethal end of the spectrum
    rather than in this phenotype. No modifier genes, susceptibility loci or founder
    alleles are established. Many reported families are consanguineous, which is how
    most homozygous genotypes arose rather than a separate risk mechanism.

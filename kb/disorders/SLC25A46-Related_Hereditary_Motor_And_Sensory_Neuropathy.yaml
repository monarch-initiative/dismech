- name: Loss of SLC25A46 at Mitochondrial Fission and Fusion Sites
  description: >-
    SLC25A46 normally occupies discrete foci at mitochondrial branch points and tube
    tips together with DRP1 and OPA1, and essentially every fission or fusion event
    is marked by such a focus. It is a hub in three complexes at once: with the
    fusion GTPases MFN1, MFN2 and OPA1, with the MICOS cristae-organising complex
    through MIC60, and with the ER membrane protein complex at ER-mitochondria
    contacts. Losing it therefore disrupts dynamics, cristae and lipid handling
    together rather than one at a time.
  biological_scale: MOLECULAR

- name: AAV-Slc25a46 gene replacement in Slc25a46 knockout mouse
  species: Mouse
  genotype: Slc25a46 knockout treated with systemic AAV-PHP.B carrying mouse Slc25a46
  category: Genetic
  description: >-
    The one encouraging therapeutic result in this disease, and it is preclinical.
    Systemic delivery of a neurotrophic AAV-PHP.B vector carrying the Slc25a46
    coding sequence to knockout mice rescued premature death, improved nerve
    conduction and mobility, restored respiratory-chain complex activities, and
    normalised mitochondrial morphology in central and peripheral nervous tissue.
    It is recorded here as a rescue arm rather than as a treatment, because nothing
    has been tried in patients.

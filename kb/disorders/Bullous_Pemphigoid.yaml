diagnosis:
- name: Direct Immunofluorescence of Perilesional Skin
  description: >-
    Direct immunofluorescence on a perilesional skin biopsy is the diagnostic
    reference standard, demonstrating linear deposition of IgG and/or C3 along
    the epidermal basement membrane zone. It distinguishes bullous pemphigoid
    from the intercellular (net-like) pattern of pemphigus vulgaris.
  diagnosis_term:
    preferred_term: direct immunofluorescence of perilesional skin
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
    qualifiers:
    - predicate:
        preferred_term: diagnostic procedure
        term:
          id: NCIT:C18020
          label: Diagnostic Procedure
      value:
        preferred_term: direct immunofluorescence
        term:
          id: NCIT:C17370
          label: Fluorescent Antibody Procedure
  results: Linear IgG and/or C3 deposition along the dermal-epidermal basement membrane zone.
  evidence:
  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis involves clinical presentation, histopathology, direct immunofluorescence and serological tests."
    explanation: The primer names direct immunofluorescence as a core component of the diagnostic workup.

  notes: >-
    Reported annual incidence spans 2.6-42.8 cases per million depending on the
    population studied, i.e. 0.26-4.28 per 100,000. The range straddles two
    Orphanet bands; the class is taken from the canonical range rule used
    elsewhere in this KB (_band_from_rate applied to the midpoint, 2.27 per
    100,000), which keeps it consistent with rate_high and with the Sweden
    record below. The width reflects genuine geographic and ascertainment
    variation. Incidence is rising with population ageing.

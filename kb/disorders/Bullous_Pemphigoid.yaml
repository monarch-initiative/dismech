        id: CHEBI:50845
        label: doxycycline
  evidence:
  - reference: PMID:28279484
    reference_title: 'Doxycycline versus prednisolone as an initial treatment strategy for bullous pemphigoid: a pragmatic, non-inferiority, randomised controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Starting patients on doxycycline is non-inferior to standard treatment with oral prednisolone for short-term blister control in bullous pemphigoid and significantly safer in the long-term."
    explanation: The BLISTER randomised non-inferiority trial establishes doxycycline as a viable first-line strategy.
  - reference: PMID:28279484
    reference_title: 'Doxycycline versus prednisolone as an initial treatment strategy for bullous pemphigoid: a pragmatic, non-inferiority, randomised controlled trial.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For those starting doxycycline, 83 (74%) of 112 patients had three or fewer blisters at 6 weeks compared with 92 (91%) of 101 patients on prednisolone, an adjusted difference of 18·6% (90% CI 11·1-26·1) favouring prednisolone"
    explanation: >-
      Records the efficacy trade-off underlying the non-inferiority conclusion -
      prednisolone achieved better 6-week blister control - so the doxycycline
      recommendation is not read as equivalent efficacy.

  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of bullous pemphigoid is increasing, attributed to an ageing population and improved diagnostic recognition."
    explanation: Establishes the rising direction of the incidence trend and its drivers.

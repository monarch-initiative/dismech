name: Bullous Pemphigoid
creation_date: '2026-07-26T19:00:00Z'
description: >-
  Bullous pemphigoid is the most common autoimmune subepidermal blistering
  disease, predominantly affecting older adults. IgG (and IgE) autoantibodies
  target the hemidesmosomal antigens BP180 (collagen XVII, COL17A1) and BP230
  (dystonin, DST), which mediate dermal-epidermal adhesion; the immunodominant
  epitope lies in the juxtamembranous extracellular NC16A domain of BP180.
  Autoantibody binding activates the classical complement pathway and triggers
  mast cell degranulation, recruiting neutrophils and eosinophils whose released
  granule proteins and proteinases cleave BP180 and other
  hemidesmosome-associated proteins, separating the dermal-epidermal junction
  and producing tense subepidermal bullae. Because the split lies above the
  lamina densa, lesions characteristically heal without scarring - the
  histological and clinical counterpoint to the intraepidermal, desmoglein-driven
  split of pemphigus vulgaris. Disease is frequently preceded by a non-bullous
  prodrome of intense pruritus and urticarial plaques and is strongly associated
  with neurological comorbidity.
category: Complex
parents:
- Dermatological Disease
- Autoimmune Disease

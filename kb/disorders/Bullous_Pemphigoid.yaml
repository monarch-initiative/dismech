pathophysiology:
- name: Anti-Hemidesmosomal Autoantibody Formation
  description: >
    Loss of tolerance to hemidesmosomal structural proteins generates
    autoantibodies against BP180 (collagen XVII) and BP230 (dystonin), the
    proteins that anchor basal keratinocytes to the underlying dermis. The
    immunodominant epitope lies in the extracellular juxtamembranous NC16A
    domain of BP180.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  genes:
  - preferred_term: COL17A1
    term:
      id: hgnc:2194
      label: COL17A1
  - preferred_term: DST
    term:
      id: hgnc:1090
      label: DST
  downstream:
  - target: Complement Activation and Inflammatory Cell Recruitment
    description: Autoantibody binding at the dermal-epidermal junction initiates classical complement activation and mast cell degranulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29545809
      reference_title: 'The Autoimmune Skin Disease Bullous Pemphigoid: The Role of Mast Cells in Autoantibody-Induced Tissue Injury.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "key cellular and molecular events leading to the BP disease phenotype are identified, including binding of pathogenic IgG to its target, complement activation of the classical pathway, mast cell degranulation, and infiltration and activation of neutrophils."
      explanation: Passive-transfer mouse models place complement activation and mast cell degranulation immediately downstream of pathogenic IgG binding.
  evidence:
  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease arises from autoantibodies targeting hemidesmosomal proteins BP180 and BP230, which are crucial for dermal-epidermal adhesion."
    explanation: The Nature Reviews Disease Primers overview identifies BP180 and BP230 autoantibodies as the initiating lesion.
  - reference: PMID:41127641
    reference_title: Peptide Epitopes of NC16A BP180 in the Diagnostics of Bullous Pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a microarray of overlapping peptides spanning the NC16A domain of BP180 and the C-terminus of BP230 autoantigens was screened with sera of 13 patients with bullous pemphigoid and 2 control sera."
    explanation: Confirms NC16A of BP180 and the BP230 C-terminus as the autoantibody-reactive regions interrogated in patient sera.
- name: Complement Activation and Inflammatory Cell Recruitment
  description: >
    Autoantibody deposition at the basement membrane zone activates the
    classical complement pathway and degranulates mast cells, recruiting
    neutrophils and eosinophils to the dermal-epidermal junction.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775

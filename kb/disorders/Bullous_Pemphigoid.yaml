      evidence_source: HUMAN_CLINICAL
      snippet: "Mast cells and mast cell-derived mediators including inflammatory cytokines and proteases are increased in lesional skin and blister fluids of BP."
      explanation: >-
        Partial. Human observation in BP lesional skin and blister fluid,
        establishing the mast cell contribution that anti-IgE therapy is
        intended to interrupt, but does not itself test omalizumab; the same
        review notes the pathogenic role of mast cells has been questioned.
    - reference: PMID:29545809
      reference_title: 'The Autoimmune Skin Disease Bullous Pemphigoid: The Role of Mast Cells in Autoantibody-Induced Tissue Injury.'
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "BP animal model evidence also implicates mast cells in the pathogenesis of BP."
      explanation: >-
        Partial. The passive-transfer mouse model implicates mast cells causally,
        which the human lesional-tissue observation alone cannot establish, but
        it does not test omalizumab and is model-organism evidence for a human
        mechanism.

    snippet: "Treatment aims to reduce symptoms and prevent new blister formation, using corticosteroids, immunosuppressive agents and biologics such as rituximab and omalizumab."
    explanation: The primer identifies corticosteroids as the core of current BP management.
- name: Doxycycline
  description: >-
    Doxycycline as an initial treatment strategy is non-inferior to oral
    prednisolone for short-term blister control and significantly safer over the
    long term, making it an important steroid-sparing option in a frail elderly
    population.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

- name: Mucosal Involvement
  category: Oral
  frequency: OCCASIONAL
  notes: >-
    Mucosal disease occurs in a minority of BP patients, most often oral. This
    is a key clinical discriminator from pemphigus vulgaris, where mucosal
    erosions are typically the presenting and near-universal feature. The cited
    10-20% range maps to OCCASIONAL (29-5%) at its lower end and slightly
    exceeds it at the upper end; OCCASIONAL is retained as the closest single
    band.
  phenotype_term:

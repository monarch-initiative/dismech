- name: Subepidermal Blister with Eosinophil-Rich Infiltrate
  description: >-
    Histology shows a subepidermal split with an inflammatory infiltrate rich in
    eosinophils. The cleavage plane lies above the lamina densa, which is why
    lesions re-epithelialize without scarring.
  diagnostic: true
  evidence:
  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bullous pemphigoid is a chronic, subepidermal autoimmune blistering disease characterized by tense blisters on erythematous or normal skin"
    explanation: Establishes the subepidermal level of the split that defines the histological picture.
  - reference: PMID:40488683
    reference_title: Eosinophil-derived neurotoxin and eosinophil cationic protein are key molecules for blister formation in bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eosinophil-derived neurotoxin and eosinophil cationic protein were substantially elevated and localized within bullous areas of skin samples from patients with BP."
    explanation: Localizes eosinophil granule proteins to the blistering areas of BP skin biopsies, the tissue correlate of the eosinophil-rich infiltrate.
genetic:
- name: HLA-DQB1*03:01 Susceptibility
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  association: >-
    HLA-DQB1*03:01 is the most consistently replicated HLA class II
    susceptibility allele in bullous pemphigoid, associated with both idiopathic
    and gliptin-associated disease.
  notes: >-
    Susceptibility genetics only. The hemidesmosomal genes COL17A1 (BP180) and
    DST (BP230) are deliberately NOT listed here: in bullous pemphigoid they are
    autoantibody targets, not inherited disease genes, and are curated on the
    pathophysiology node instead. Germline COL17A1/DST variants cause
    epidermolysis bullosa, a mechanistically distinct disease.
  evidence:
  - reference: PMID:39091267
    reference_title: HLA alleles associated to susceptibility to gliptin-associated bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant association between HLA-DQB1*03:01 allele and IBP and GABP patients was found."
    explanation: Finds HLA-DQB1*03:01 significantly associated with both idiopathic and gliptin-associated BP in an Italian cohort.
environmental:
- name: Drug and Ultraviolet Radiation Triggers
  description: >-
    No proven cause is established for bullous pemphigoid, but several trigger
    factors are recognized: medications (notably gliptins/DPP-4 inhibitors used
    in type 2 diabetes, and immune checkpoint inhibitors), ultraviolet
    radiation, and other skin disorders such as psoriasis and lichen planus.
  evidence:
  - reference: PMID:42206441
    reference_title: 'Increased Mortality in Patients with Bullous Pemphigoid: A Nationwide Population-based Cohort Study of 5,738 Patients in Sweden.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a number of different trigger factors have been described, such as medications, ultraviolet (UV) radiation"
    explanation: Names medications and UV radiation among recognized BP trigger factors.
  - reference: PMID:39091267
    reference_title: HLA alleles associated to susceptibility to gliptin-associated bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with gliptins, used for type 2 diabetes, was reported as associated with BP onset."
    explanation: Documents the gliptin (DPP-4 inhibitor) association with BP onset, the best-characterized drug trigger.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Bullous pemphigoid carries substantially increased mortality relative to the
    age-, sex- and residence-matched general population, reflecting both disease
    severity and the comorbidity burden of an elderly population. Long-term
    management is complicated by the toxicity of systemic corticosteroids in
    frail older patients.
  evidence:
  - reference: PMID:42206441
    reference_title: 'Increased Mortality in Patients with Bullous Pemphigoid: A Nationwide Population-based Cohort Study of 5,738 Patients in Sweden.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BP patients had a significantly higher all-cause mortality (HR 2.15, 95% CI 2.06-2.24) than controls, with 1- and 10-year mortality rates of 21.2% and 80.2%, respectively."
    explanation: Nationwide Swedish cohort quantifies the mortality excess (HR 2.15) and absolute 1- and 10-year mortality.
  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite therapeutic advancements, challenges persist in long-term management, especially in older patients with comorbidities."
    explanation: The primer identifies long-term management in comorbid older patients as the persisting clinical challenge.
discussions:
- discussion_id: bp_checkpoint_inhibitor_trigger_uncurated
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Immune checkpoint inhibitor-induced bullous pemphigoid is a clinically
    important and increasingly recognized trigger, but is named only in the
    `environmental` description rather than curated with its own evidence.
  rationale: >-
    The gliptin/DPP-4-inhibitor arm is now evidenced (PMID:39091267) under
    `environmental`. The checkpoint-inhibitor arm still lacks a quotable source
    in this entry: the closest candidate found during curation, PMID:41747673
    (a real-life comparative study of gliptin- and checkpoint-inhibitor-induced
    versus idiopathic BP), is indexed in PubMed without an abstract, so no
    excerpt satisfies the evidence SOP. Resolving this needs a paper with
    retrievable text reporting the checkpoint-inhibitor risk association.
- discussion_id: bp_neurological_association_direction
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Bullous pemphigoid is consistently associated with neurological disease
    (dementia, Parkinson disease, stroke). Is this association causal in either
    direction, and is it explained by shared BP180/BP230 (dystonin) expression
    in the central nervous system?
  rationale: >-
    BP180 (collagen XVII) and BP230 (dystonin) have neural isoforms expressed in
    the central nervous system, giving a plausible route by which neurodegeneration
    could expose cross-reactive epitopes and break tolerance. The association is
    robust epidemiologically, but the cited cohort cannot establish direction, and
    its per-condition results are not internally uniform - Alzheimer disease was
    actually more common in controls, discordant with several other reports. The
    association is recorded here as an open question rather than as a curated
    causal edge in the pathograph.
  proposed_experiments:
  - experiment_id: bp_neuro_temporal_sequence
    name: Temporal sequencing of neurological diagnosis relative to BP onset
    description: >-
      Longitudinal population cohort determining whether neurological diagnoses
      precede or follow first BP diagnosis, with time-to-event analysis in both
      directions.
    decision_criterion: >-
      Consistent precedence of neurological diagnosis over BP onset would favour
      neurodegeneration-driven epitope exposure over a shared-susceptibility or
      reverse-causation model.
    would_support:
    - Neurological disease precedes BP onset at a rate exceeding the reverse ordering.
    would_refute:
    - No consistent temporal ordering, or BP predominantly precedes neurological diagnosis.
  - experiment_id: bp_neuro_crossreactive_serology
    name: Anti-BP180/BP230 serology in neurodegenerative disease without skin disease
    description: >-
      Serological screening for anti-BP180 NC16A and anti-BP230 reactivity in
      dementia, Parkinson disease and stroke cohorts with no cutaneous disease,
      against age-matched neurologically healthy controls.
    decision_criterion: >-
      Elevated subclinical autoantibody reactivity in neurodegenerative cohorts
      would support CNS epitope exposure as the tolerance-breaking event.
    would_support:
    - Significantly higher anti-BP180/BP230 reactivity in neurodegenerative cohorts than controls.
    would_refute:
    - Equivalent reactivity across neurodegenerative and control groups.
  evidence:
  - reference: PMID:30663128
    reference_title: Neurological disorders are associated with bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cohort of bullous pemphigoid and neurological disorders demonstrates a significant association between bullous pemphigoid and neurological disorders, including dementia, Parkinson's disease and stroke."
    explanation: Case-control study of 183 BP patients and 348 matched controls finds a significant association with dementia, Parkinson disease and stroke.
  - reference: PMID:30663128
    reference_title: Neurological disorders are associated with bullous pemphigoid.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These included dementia (P < 0.0001), Parkinson`s disease (P = 0.0434), stroke (P = 0.0015) and other neurological disorders but not Alzheimer's diseases, which was more common among patients in the control group."
    explanation: >-
      Records the per-condition detail including the negative finding for
      Alzheimer disease, which was more common in controls in this cohort -
      a discordance with other reports worth preserving rather than smoothing over.

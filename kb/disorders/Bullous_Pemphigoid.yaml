    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "STAT6-deficient mice exhibited reduced subepidermal blister formation and eosinophil infiltration in 2 BP mouse models."
    explanation: Reduced eosinophil infiltration accompanies reduced blistering in two BP mouse models, supporting eosinophil recruitment as a required step.
- name: Proteolytic Degradation of the Dermal-Epidermal Junction
  conforms_to: "dermal_epidermal_junction_adhesion_failure#Loss of Adhesive Integrity at a Defined Cleavage Plane"
  description: >
    Neutrophil proteinases together with the eosinophil granule proteins
    eosinophil-derived neurotoxin (EDN) and eosinophil cationic protein (ECP)
    degrade BP180 and impair keratinocyte adhesion at the basement membrane
    zone.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: neutrophil degranulation
    term:
      id: GO:0043312
      label: neutrophil degranulation
    modifier: INCREASED
  downstream:
  - target: Subepidermal Blister Formation
    description: Loss of hemidesmosomal anchoring separates the epidermis from the dermis, forming the blister cavity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40488683
      reference_title: Eosinophil-derived neurotoxin and eosinophil cationic protein are key molecules for blister formation in bullous pemphigoid.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, these proteins significantly impaired keratinocyte adhesion in vitro."
      explanation: Eosinophil granule proteins directly impair keratinocyte adhesion, the proximate cause of dermal-epidermal separation.
  evidence:
  - reference: PMID:40488683
    reference_title: Eosinophil-derived neurotoxin and eosinophil cationic protein are key molecules for blister formation in bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eosinophil-derived neurotoxin and eosinophil cationic protein were substantially elevated and localized within bullous areas of skin samples from patients with BP."
    explanation: Localizes the effector granule proteins to blistering skin in human BP biopsies.
- name: Subepidermal Blister Formation
  conforms_to: "dermal_epidermal_junction_adhesion_failure#Mechanically Induced Dermal-Epidermal Separation and Blistering"
  description: >
    Separation occurs within the lamina lucida, superficial to the lamina densa,
    producing tense bullae with an intact epidermal roof. Because the cleavage
    plane spares the dermis, lesions heal without scarring - in contrast to the
    intraepidermal, desmoglein-mediated acantholytic split of pemphigus
    vulgaris.
  biological_scale: TISSUE
  downstream:
  - target: Tense Bullae
    description: The subepidermal cleavage plane yields clinically tense, fluid-filled blisters.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39979318
      reference_title: Bullous pemphigoid.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bullous pemphigoid is a chronic, subepidermal autoimmune blistering disease characterized by tense blisters on erythematous or normal skin that predominantly affects the older population."
      explanation: Ties the subepidermal cleavage plane to the characteristic tense blister morphology.
  evidence:
  - reference: PMID:40488683
    reference_title: Eosinophil-derived neurotoxin and eosinophil cationic protein are key molecules for blister formation in bullous pemphigoid.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Eosinophil-derived neurotoxin and eosinophil cationic protein play a critical role in subepidermal blister formation in BP."
    explanation: Names subepidermal blister formation as the endpoint of the eosinophil granule protein mechanism.
phenotypes:
- name: Tense Bullae
  category: Dermatological
  diagnostic: true
  notes: >-
    Tense, fluid-filled subepidermal blisters arising on erythematous or normal
    skin, classically on flexural surfaces, trunk and proximal limbs. Frequency
    band omitted: the cited primer establishes tense blisters as the defining
    morphology but reports no occurrence rate.
  phenotype_term:
    preferred_term: Abnormal blistering of the skin
    term:
      id: HP:0008066
      label: Abnormal blistering of the skin
  evidence:
  - reference: PMID:39979318
    reference_title: Bullous pemphigoid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bullous pemphigoid is a chronic, subepidermal autoimmune blistering disease characterized by tense blisters on erythematous or normal skin that predominantly affects the older population."
    explanation: The Nature Reviews Disease Primers definition identifies tense blistering as the cardinal manifestation.
- name: Pruritus
  category: Dermatological
  frequency: VERY_FREQUENT
  notes: >-
    Severe itch, frequently preceding blistering by weeks to months as a
    non-bullous prodrome. Band supported by "almost all patients", which maps to
    VERY_FREQUENT (80-100%) per the frequency-evidence guidelines.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
    severity: SEVERE
  evidence:
  - reference: PMID:29545809
    reference_title: 'The Autoimmune Skin Disease Bullous Pemphigoid: The Role of Mast Cells in Autoantibody-Induced Tissue Injury.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In almost all patients, severe pruritus is present."
    explanation: States that severe pruritus is present in almost all patients with BP, supporting both the phenotype and the VERY_FREQUENT band.
- name: Mucosal Involvement
  category: Oral
  frequency: OCCASIONAL
  notes: >-
    Mucosal disease occurs in a minority of BP patients, most often oral. This
    is a key clinical discriminator from pemphigus vulgaris, where mucosal
    erosions are typically the presenting and near-universal feature. The cited
    10-20% range maps to OCCASIONAL (29-5%) at its lower end and slightly
    exceeds it at the upper end; OCCASIONAL is retained as the closest single
    band.
  phenotype_term:
    preferred_term: Erosion of oral mucosa
    term:
      id: HP:0031446
      label: Erosion of oral mucosa
  evidence:
  - reference: PMID:29545809
    reference_title: 'The Autoimmune Skin Disease Bullous Pemphigoid: The Role of Mast Cells in Autoantibody-Induced Tissue Injury.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 10–20% of patients show mucosal involvement, with the oral mucosa being the most common mucosal site"
    explanation: Quantifies mucosal involvement at 10-20% with oral mucosa the commonest site, supporting the OCCASIONAL band.
- name: Urticarial Lesions (Non-Bullous Prodrome)

name: Musculocontractural Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
description: >
  Musculocontractural Ehlers-Danlos syndrome (mcEDS) is a rare autosomal
  recessive connective-tissue disorder caused by biallelic loss-of-function
  variants in CHST14, encoding dermatan 4-O-sulfotransferase-1 (D4ST1), or in
  DSE, encoding dermatan sulfate epimerase-1 (DS-epi1). Both genes act at
  consecutive steps of the same pathway, so both lesions converge on defective
  dermatan sulfate (DS) biosynthesis: the glycosaminoglycan chain of decorin,
  the major dermal DS-proteoglycan that organizes collagen fibril assembly, is
  replaced by chondroitin sulfate. The resulting failure of collagen fibril
  assembly produces a distinctive two-part disease — congenital multisystem
  malformation (multiple congenital contractures with adducted thumbs and
  talipes equinovarus, characteristic craniofacial features, and ocular and
  urogenital anomalies) followed by progressive connective-tissue fragility
  (skin hyperextensibility, bruisability and atrophic scarring, recurrent
  dislocations, large subcutaneous hematomas, pneumothorax, and diverticular
  perforation). The two gene-defined forms, mcEDS-CHST14 (MONDO:0020681,
  "musculocontractural type 1") and mcEDS-DSE (MONDO:0014236,
  "musculocontractural type 2"), are clinically near-indistinguishable and are
  curated here as subtypes of a single entry; mcEDS-DSE is rarer and appears
  less severe, plausibly because residual DS remains on decorin.

      label: CHST14
  description: >
    Caused by biallelic loss-of-function variants in CHST14, encoding dermatan
    4-O-sulfotransferase-1 (D4ST1). This is the common and more severe form,
    accounting for the large majority of reported patients. Loss of D4ST1
    activity replaces the decorin glycosaminoglycan chain with chondroitin
    sulfate completely, with no residual dermatan sulfate.
  evidence:

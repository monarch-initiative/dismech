animal_models:
- species: Mus musculus
  genotype: Chst14-/-
  category: Knockout
  description: >
    Homozygous Chst14-null mice show perinatal lethality, shorter fetal length,
    and vessel-related placental abnormalities. The model demonstrates that
    dermatan sulfate is required for fetal development, but its perinatal
    lethality means it does not recapitulate the progressive postnatal
    connective-tissue fragility that dominates the human disease.
  genes:
  - preferred_term: CHST14
    term:
      id: hgnc:24464
      label: CHST14
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous (Chst14-/-) mice have been shown perinatal lethality, shorter fetal length and vessel-related placental abnormalities."
    explanation: >
      Supports a developmental requirement for dermatan sulfate, but the
      perinatal-lethal murine phenotype differs from the surviving, progressively
      fragile human phenotype, so support for the human disease model is partial.
- name: Xenopus DS-epi1 (dse) morphant embryos
  species: Xenopus laevis
  genotype: Morpholino knockdown of DS-epi1/dse, with cranial neural crest transplantation and explant culture
  category: Targeted knockdown model of dermatan sulfate epimerase deficiency
  publication: PMID:27101845
  description: >-
    The only model of this disease that addresses the embryonic origin of its
    congenital features. Knocking down DS-epi1 in frog embryos removes iduronic
    acid from chondroitin sulfate/dermatan sulfate chains and leaves neural crest
    induction intact while blocking epithelial-mesenchymal transition and
    migration; transplantation shows the requirement is tissue-autonomous, and
    explants place the defect in adhesion and spreading on fibronectin. The
    downstream loss of neural-crest-derived craniofacial skeleton offers a
    developmental account of the congenital malformations, complementing the
    Chst14-null mouse, which dies perinatally, and the human fibroblast work,
    which is postnatal.
  genes:
  - preferred_term: DSE
    term:
      id: hgnc:21144
      label: DSE
  modeled_mechanisms:
  - target: Dermatan Sulfate Biosynthesis Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the mcEDS-DSE biochemical lesion directly: loss of DS-epi1
      removes iduronic acid residues from hybrid CS/DS glycosaminoglycan chains.
    limitations: >-
      Morpholino knockdown rather than the biallelic null genotype of patients,
      and it models the DSE half of the disease only — mcEDS-CHST14, the more
      common form, acts one step later at 4-O-sulfation and is not addressed.
    readouts:
    - name: Isolated iduronic acid residues in CS/DS proteoglycans
      target: Dermatan Sulfate Biosynthesis Failure
      direction: DECREASED
      interpretation: >-
        The epimerase product itself, measured in the embryo, which is what makes
        this a model of the enzymatic lesion rather than of its consequences.
      evidence:
      - reference: PMID:27101845
        reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We demonstrate that DS-epi1 is important for the generation of isolated iduronic acid residues in chondroitin sulfate (CS)/DS proteoglycans in early Xenopus embryos."
        explanation: Reports the biochemical readout of epimerase loss in the model.
    evidence:
    - reference: PMID:27101845
      reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "this syndrome comprises multiple congenital malformations that are caused by dysfunction of dermatan sulfate (DS) biosynthetic enzymes, including DS epimerase-1 (DS-epi1; also known as DSE)"
      explanation: Identifies the knocked-down enzyme as one of the disease genes for this entry.
  - target: Congenital Malformation of Connective-Tissue-Dependent Structures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies a developmental mechanism for the congenital craniofacial features:
      neural crest cells are induced normally but fail to undergo EMT and migrate,
      so crest-derived craniofacial skeleton is reduced.
    limitations: >-
      The craniofacial readouts are frog structures — dorsal fin and larval
      cartilage — that have no direct human counterpart, and melanocyte loss is
      not an mcEDS feature. The authors themselves put the link to human
      malformation as a proposal. Nothing here addresses the postnatal
      progressive fragility that dominates the disease.
    readouts:
    - name: Neural crest EMT transcription factor activation and extent of migration
      target: Congenital Malformation of Connective-Tissue-Dependent Structures
      direction: DECREASED
      interpretation: >-
        Localizes the defect to EMT and migration rather than to crest induction,
        which the same experiment shows is unaffected.
      evidence:
      - reference: PMID:27101845
        reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The knockdown of DS-epi1 does not affect the formation of early NC progenitors; however, it impairs the correct activation of transcription factors involved in the epithelial-mesenchymal transition (EMT) and reduces the extent of NC cell migration, which leads to a decrease in NC-derived craniofacial skeleton, melanocytes and dorsal fin structures."
        explanation: Reports both the preserved induction and the reduced EMT, migration and crest-derived structures.
    - name: Cranial neural crest adhesion and spreading on fibronectin
      target: Congenital Malformation of Connective-Tissue-Dependent Structures
      direction: DECREASED
      interpretation: >-
        Reduces the migration defect to a cell-matrix interaction, the level at
        which a missing glycosaminoglycan modification would be expected to act.
      evidence:
      - reference: PMID:27101845
        reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Cranial NC explant and single-cell cultures indicate a requirement of DS-epi1 in cell adhesion, spreading and extension of polarized cell processes on fibronectin."
        explanation: The explant and single-cell culture arm is cell-based, so it is graded in vitro rather than model organism.
    evidence:
    - reference: PMID:27101845
      reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transplantation experiments demonstrate a tissue-autonomous role for DS-epi1 in cranial NC cell migration in vivo"
      explanation: >-
        Transplantation rules out a non-autonomous environmental effect, which is
        what makes the model informative about the crest cells themselves.
    - reference: PMID:27101845
      reference_title: "Musculocontractural Ehlers-Danlos syndrome and neurocristopathies: dermatan sulfate is required for Xenopus neural crest cells to migrate and adhere to fibronectin."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that NC defects in the EMT and cell migration might account for the craniofacial anomalies and other congenital malformations in MCEDS"
      explanation: >-
        The authors' link to human malformation is offered as a possibility, which
        is why this link is partial rather than full recapitulation.
discussions:
- discussion_id: mceds_chst14_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the perinatally lethal Chst14-null mouse adequately model human
    mcEDS-CHST14, in which affected individuals survive and the dominant
    morbidity is progressive postnatal connective-tissue fragility?
  attaches_to:
  - pathophysiology#Progressive Multisystem Connective Tissue Fragility
  rationale: >-
    Homozygous Chst14-null mice die perinatally with shorter fetal length and
    placental vascular abnormalities, so the model speaks to the developmental
    arm of the disease but cannot report on the progressive fragility arm —
    skin fragility, recurrent dislocations, large subcutaneous hematomas,
    pneumothorax, and diverticular perforation — that defines long-term human
    morbidity. Evidence for the fragility mechanism therefore rests on human
    ultrastructural and biochemical studies rather than on the mouse.
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous (Chst14-/-) mice have been shown perinatal lethality, shorter fetal length and vessel-related placental abnormalities."
    explanation: >-
      The perinatal-lethal murine phenotype is the source of the translational
      mismatch with the surviving human phenotype.
  proposed_experiments:
  - experiment_id: mceds_conditional_chst14_postnatal_fragility
    name: Conditional or hypomorphic Chst14 allele surviving to adulthood
    description: >-
      Generate and characterize conditional or hypomorphic Chst14 alleles that
      bypass perinatal lethality, then assess postnatal skin, joint, vascular,
      and hollow-organ fragility against the human phenotype.
  - experiment_id: mceds_dse_null_mouse_survival
    name: Dse-null mouse phenotyping
    description: >-
      Test whether a Dse-null mouse, expected to retain residual dermatan
      sulfate as in human mcEDS-DSE, survives to adulthood and develops the
      milder progressive fragility phenotype seen in patients.
- discussion_id: mceds_dse_residual_ds_severity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the residual decorin dermatan sulfate seen in DS-epi1 deficiency actually
    the cause of the milder mcEDS-DSE phenotype, and is DSE2 the compensating
    activity?
  attaches_to:
  - pathophysiology#Decorin Glycosaminoglycan Chain Replacement
  rationale: >-
    The persistence of some dermatan sulfate moieties in DS-epi1-deficient
    fibroblasts, in contrast to complete chondroitin sulfate replacement in
    D4ST1 deficiency, is the leading explanation for the lower symptom burden in
    mcEDS-DSE. The source literature states this only as a hedged proposal, and
    with only a handful of reported mcEDS-DSE patients the genotype-phenotype
    comparison is underpowered. Whether DSE2 provides the compensating epimerase
    activity is untested.
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Milder phenotypes in mcEDS-DSE might be related to a smaller fraction of decorin DS, potentially through residual DSE activity or compensation by DSE2 activity."
    explanation: >-
      The hedged phrasing in the source review is itself the evidence that this
      remains an open question rather than a settled mechanism.
  proposed_experiments:
  - experiment_id: mceds_decorin_ds_severity_correlation
    name: Decorin dermatan sulfate content versus clinical severity
    description: >-
      Quantify decorin dermatan sulfate content across a matched series of
      mcEDS-CHST14 and mcEDS-DSE fibroblast lines and correlate with a
      standardized clinical severity score.
  - experiment_id: mceds_dse2_compensation_test
    name: DSE2 knockdown in DS-epi1-deficient fibroblasts
    description: >-
      Knock down or knock out DSE2 in DS-epi1-deficient patient fibroblasts and
      test whether residual dermatan sulfate is lost, establishing or excluding
      DSE2 compensation.
notes: >
  Curated as a single entry covering both gene-defined forms. MONDO models
  mcEDS-CHST14 (MONDO:0020681) and mcEDS-DSE (MONDO:0014236) as a
  disease_series_by_gene split beneath MONDO:0011142; MONDO:0020681 carries no
  definition of its own, and the two forms are clinically near-indistinguishable,
  differing chiefly in frequency and symptom burden. They are therefore modeled
  here as has_subtypes of one disease rather than as separate entries, following
  the precedent of Spondylodysplastic Ehlers-Danlos Syndrome, which likewise
  unifies three gene-defined forms of a glycosaminoglycan-biosynthesis EDS.

  Mechanistic neighbor: spondylodysplastic EDS (B4GALT7/B3GALT6) also arises
  from a proteoglycan glycosaminoglycan-biosynthesis defect, but at the common
  tetrasaccharide linker that initiates every GAG chain rather than at the
  dermatan-sulfate-specific epimerization and 4-O-sulfation steps modeled here.
  The pair is a candidate for a future shared GAG-biosynthesis mechanism module;
  no such module exists yet, so no conforms_to edge is declared.

  Sourcing note: no deep-research provider artifact backs this entry. It was
  built directly from primary literature located via the PubMed E-utilities API,
  with the GeneReviews chapter (PMID:40373179) mined as the phenotype baseline
  across its Clinical Characteristics, Diagnosis, Management, Genetic
  Counseling, and agents-to-avoid sections. Every PMID is cached through the
  reference validator and every snippet is machine-verified as an exact quote.
  All four organ systems GeneReviews names as additionally involved —
  genitourinary, cardiovascular, neurologic, and gastrointestinal — now carry
  curated phenotypes.

  Note on nosology: although MONDO places this disorder under congenital
  disorder of glycosylation and IEMbase codes CHST14 deficiency as a CDG, the
  dismech congenital_disorder_of_glycosylation module is scoped specifically to
  N-glycosylation (lipid-linked oligosaccharide assembly and Golgi N-glycan
  processing converging on protein hypoglycosylation). mcEDS is a
  glycosaminoglycan/proteoglycan defect and does not conform to that module.

diagnosis:
- name: Molecular Genetic Testing of CHST14 and DSE
  description: >
    The definitive diagnostic test. mcEDS is established in a proband with
    suggestive clinical findings plus biallelic pathogenic variants in CHST14 or
    DSE. In practice this is delivered by a next-generation sequencing panel
    covering the EDS and hereditary connective-tissue disorder genes, with
    exome sequencing reserved for suggestive patients who have no CHST14 or DSE
    variant.
  evidence:
  - reference: PMID:40373179
    reference_title: "Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of mcEDS is established in a proband with suggestive findings and biallelic pathogenic variants in CHST14 or DSE identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion for mcEDS.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "genetic testing is provided as part of routine medical care covered by national health insurance, using a custom next generation sequencing-based panel that includes all EDS-related genes and genes for hereditary connective tissue disorders"
    explanation: Describes the panel-based testing route used in practice for suspected mcEDS.
- name: Clinical Diagnostic Criteria
  description: >
    Three major criteria support the clinical diagnosis before molecular
    confirmation: congenital multiple contractures (characteristically
    adduction-flexion contractures and/or talipes equinovarus), characteristic
    craniofacial features evident at birth or in early infancy, and
    characteristic cutaneous features (hyperextensibility, bruisability, and
    fragility with atrophic scars, plus increased palmar wrinkles).
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Major diagnostic criteria of the disorder are as follows: 1) congenital multiple contractures"
    explanation: Sets out the major clinical diagnostic criteria for mcEDS.
- name: Skin Fibroblast Glycosaminoglycan and Decorin Analysis
  description: >
    Biochemical analysis of extracellular matrix components in patient skin
    fibroblasts — collagens and dermatan sulfate proteoglycans including decorin
    and biglycan — demonstrates the characteristic replacement of the decorin
    dermatan sulfate chain by chondroitin sulfate, supporting the diagnosis and
    distinguishing the two subtypes by residual dermatan sulfate content.
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Biochemical abnormalities of the extracellular matrix are investigated (e.g., various types of collagen and DS-PGs, including decorin and biglycan), using patient skin fibroblasts."
    explanation: Describes the fibroblast biochemical workup used in mcEDS diagnosis and research.
  - reference: PMID:25703627
    reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The glycanation of the dermal DS proteoglycan decorin is impaired in fibroblasts from D4ST1- as well as DS-epi1-deficient patients."
    explanation: Establishes the decorin glycanation abnormality detectable in patient fibroblasts.
progression:
- phase: Congenital presentation
  age_range: Birth to early infancy
  notes: >
    The malformation arm is present at birth: multiple congenital contractures
    with adducted thumbs and talipes equinovarus, plus a craniofacial gestalt
    that is evident at birth or in early infancy.
  evidence:
  - reference: PMID:26646600
    reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple congenital contractures including adduction-flexion contractures and talipes equinovarus as well as other visceral or ophthalmological malformations"
    explanation: Establishes the congenital malformation features present from birth.
- phase: Progressive connective-tissue fragility
  age_range: Childhood through adulthood
  notes: >
    After infancy the disease is dominated by progressive fragility: skin
    hyperextensibility, bruisability and atrophic scarring, recurrent
    dislocations, progressive talipes and spinal deformities, large subcutaneous
    hematomas, pneumothorax, and diverticular perforation. The escalating
    orthopedic surveillance schedule tracks this progression.
  evidence:
  - reference: PMID:26646600
    reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that patients with CHST14/D4ST1 deficiency develop progressive multisystem fragility-related manifestations"
    explanation: States explicitly that the fragility manifestations are progressive over time.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical features comprise multisystem congenital malformations and progressive connective tissue fragility-related manifestations."
    explanation: Confirms the two-phase congenital-then-progressive course.
histopathology:
- name: Disorganized Dermal Collagen Fibril Architecture
  description: >
    The hallmark electron-microscopic finding in mcEDS skin: collagen fibrils
    are dispersed through the papillary to reticular dermis instead of being
    regularly and tightly assembled, and the glycosaminoglycan chains run
    linearly between fibrils rather than curving to stay in contact with the
    fibril they decorate.
  diagnostic: true
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Collagen fibrils in affected skin are dispersed in the papillary to reticular dermis, whereas those in normal skin are regularly and tightly assembled."
    explanation: Describes the diagnostic ultrastructural collagen abnormality in mcEDS skin.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glycosaminoglycan chains are linear in affected skin, stretching from the outer surface of collagen fibrils to adjacent fibrils; glycosaminoglycan chains are curved in normal skin, maintaining close contact with attached collagen fibrils."
    explanation: Documents the altered glycosaminoglycan-collagen geometry seen on electron microscopy.
biochemical:
- name: Urinary Dermatan Sulfate
  notes: >
    Dermatan sulfate is undetectable in urine in mcEDS-DSE, providing direct
    biochemical confirmation of dermatan sulfate depletion in vivo and a
    potential non-invasive biomarker.
  presence: ABSENT
  evidence:
  - reference: PMID:32130795
    reference_title: "Delineation of musculocontractural Ehlers-Danlos Syndrome caused by dermatan sulfate epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No dermatan sulfate was detected in the urine sample from patient 1, suggesting a complete depletion of DS."
    explanation: Direct in vivo biochemical evidence of dermatan sulfate depletion in an mcEDS-DSE patient.
- name: Fibroblast Dermatan Sulfate Epimerase Activity
  notes: >
    Epimerase activity is significantly reduced in cultured fibroblasts from
    patients with DSE variants, confirming the enzymatic defect in patient cells.
  presence: DECREASED

      label: Ehlers-Danlos syndrome, musculocontractural type 2
  genes:
  - preferred_term: DSE
    term:
      id: hgnc:21144
      label: DSE
  description: >
    Caused by biallelic loss-of-function variants in DSE, encoding dermatan
    sulfate epimerase-1 (DS-epi1), which converts glucuronic acid to iduronic
    acid in the nascent chondroitin/dermatan sulfate chain. Ultrastructurally
    and clinically similar to mcEDS-CHST14 but far rarer and with a lower
    symptom burden, plausibly because some dermatan sulfate moieties persist on
    decorin through residual DS-epi1 activity or DSE2 compensation.
  evidence:
  - reference: PMID:23704329
    reference_title: "Loss of dermatan sulfate epimerase (DSE) function results in musculocontractural Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DSE deficiency represents a specific defect of DS biosynthesis. We demonstrate locus heterogeneity in MCEDS"
    explanation: The original report establishing DSE as the second mcEDS locus.
  - reference: PMID:32130795
    reference_title: "Delineation of musculocontractural Ehlers-Danlos Syndrome caused by dermatan sulfate epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "McEDS-DSE is a congenital multisystem disorder with progressive symptoms involving craniofacial, skeletal, cutaneous, and cardiovascular systems, similar to the symptoms of mcEDS-CHST14. However, the burden of symptoms seems lower in patients with mcEDS-DSE."
    explanation: Establishes clinical near-identity with mcEDS-CHST14 alongside a lower symptom burden.
  - reference: PMID:25703627
    reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the second family with a homozygous DSE missense variant, presenting a somewhat milder MC-EDS phenotype"
    explanation: Independent observation of the milder mcEDS-DSE presentation.

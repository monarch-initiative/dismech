pathophysiology:
- name: Dermatan Sulfate Biosynthesis Failure
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function variants in CHST14 (dermatan
    4-O-sulfotransferase-1, D4ST1) or DSE (dermatan sulfate epimerase-1,
    DS-epi1) abolish consecutive steps required to build iduronic
    acid-containing dermatan sulfate domains within hybrid chondroitin
    sulfate/dermatan sulfate glycosaminoglycan chains. DS-epi1 epimerizes
    glucuronic acid to iduronic acid and D4ST1 4-O-sulfates the adjacent
    N-acetylgalactosamine; loss of either leaves a negligible amount of dermatan
    sulfate and a reciprocal excess of chondroitin sulfate. This is the single
    lesion shared by both gene-defined subtypes.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: dermatan sulfate proteoglycan biosynthesis
    modifier: DECREASED
    term:
      id: GO:0050651
      label: dermatan sulfate proteoglycan biosynthetic process
  - preferred_term: chondroitin sulfate proteoglycan biosynthesis
    modifier: INCREASED
    term:
      id: GO:0050650
      label: chondroitin sulfate proteoglycan biosynthetic process
  molecular_functions:
  - preferred_term: dermatan sulfate epimerase activity
    modifier: DECREASED
    term:
      id: GO:0047757
      label: chondroitin-glucuronate 5-epimerase activity
  - preferred_term: dermatan 4-O-sulfotransferase activity
    modifier: DECREASED
    term:
      id: GO:0001537
      label: dermatan 4-sulfotransferase activity
  chemical_entities:
  - preferred_term: dermatan sulfate
    modifier: DECREASED
    term:
      id: CHEBI:18376
      label: dermatan sulfate
  - preferred_term: chondroitin sulfate
    modifier: INCREASED
    term:
      id: CHEBI:37397
      label: chondroitin sulfate
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic variants in CHST14 or DSE lead to reduced activities of relevant enzymes, resulting in a negligible amount of dermatan sulfate (DS) and an excessive amount of chondroitin sulfate."
    explanation: States the shared enzymatic and biochemical lesion of both mcEDS subtypes.
  - reference: PMID:25703627
    reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DS-epi1 and D4ST1 are crucial for biosynthesis of dermatan sulfate (DS) moieties in the hybrid chondroitin sulfate (CS)/DS glycosaminoglycans (GAGs)."
    explanation: Places both enzymes on the same DS biosynthetic pathway.
  - reference: PMID:23704329
    reference_title: "Loss of dermatan sulfate epimerase (DSE) function results in musculocontractural Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologous expression of mutant full-length and soluble recombinant DSE proteins showed a loss of activity towards partially desulfated DS. Patient-derived fibroblasts also showed a significant reduction in epimerase activity."
    explanation: Direct enzymatic demonstration that DSE variants abolish epimerase activity in patient cells.
  - reference: PMID:23704329
    reference_title: "Loss of dermatan sulfate epimerase (DSE) function results in musculocontractural Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Iduronic acid-containing domains in DS have a key role in mediating the functions of DS proteoglycans."
    explanation: Establishes iduronic acid-containing DS domains as the functionally critical product lost in mcEDS.
  downstream:
  - target: Decorin Glycosaminoglycan Chain Replacement
    description: >
      Absent dermatan sulfate synthesis leaves the glycosaminoglycan chain of
      decorin, the principal dermal DS-proteoglycan, glycanated with chondroitin
      sulfate instead.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25703627
      reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The glycanation of the dermal DS proteoglycan decorin is impaired in fibroblasts from D4ST1- as well as DS-epi1-deficient patients."
      explanation: Directly links loss of either enzyme to impaired decorin glycanation in patient fibroblasts.
- name: Decorin Glycosaminoglycan Chain Replacement
  biological_scale: MOLECULAR
  description: >
    Decorin is the major dermatan sulfate proteoglycan of skin and normally
    tethers adjacent collagen fibrils through electrostatic interactions
    mediated by its dermatan sulfate side chain. In mcEDS this side chain is
    replaced by chondroitin sulfate. The replacement is complete in D4ST1
    (CHST14) deficiency, whereas in DS-epi1 (DSE) deficiency some dermatan
    sulfate moieties persist — the leading explanation for the milder mcEDS-DSE
    phenotype.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: proteoglycan biosynthesis
    modifier: ABNORMAL
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
  chemical_entities:
  - preferred_term: dermatan sulfate
    modifier: DECREASED
    term:
      id: CHEBI:18376
      label: dermatan sulfate
  evidence:
  - reference: PMID:25703627
    reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, in D4ST1-deficiency, the decorin GAG is completely replaced by CS, whereas in DS-epi1-deficiency, still some DS moieties are present."
    explanation: >
      Establishes the quantitative difference in decorin glycanation between the
      two subtypes, the proposed basis of the severity gradient.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Connective tissue fragility is presumably attributable to a compositional change in the glycosaminoglycan chains of decorin, a major DS-proteoglycan in the skin that contributes to collagen fibril assembly."
    explanation: Identifies altered decorin glycosaminoglycan composition as the proximate cause of tissue fragility.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Milder phenotypes in mcEDS-DSE might be related to a smaller fraction of decorin DS, potentially through residual DSE activity or compensation by DSE2 activity."
    explanation: >
      Explicitly hedged proposal linking residual decorin dermatan sulfate to the
      milder mcEDS-DSE phenotype; recorded as PARTIAL because it is a proposed
      rather than demonstrated explanation.
  downstream:
  - target: Disorganized Collagen Fibril Assembly
    description: >
      Loss of the dermatan sulfate side chain removes the electrostatic bridging
      that decorin normally provides between neighboring collagen fibrils, so
      fibril assembly fails.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26646600
      reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "multisystem fragility is presumably caused by impaired assembly of collagen fibrils resulting from loss of dermatan sulfate (DS) in the decorin glycosaminoglycan side chain that promotes electrostatic binding between collagen fibrils"
      explanation: States the decorin-to-collagen-fibril mechanistic link explicitly.
- name: Disorganized Collagen Fibril Assembly
  biological_scale: TISSUE
  description: >
    In affected skin, collagen fibrils are dispersed through the papillary to
    reticular dermis rather than being regularly and tightly assembled, and the
    glycosaminoglycan chains run linearly from the surface of one fibril to
    adjacent fibrils instead of curving to stay in close contact with the fibril
    they decorate. This ultrastructural signature is the tissue-level readout of
    the decorin defect and the immediate substrate of connective-tissue
    fragility.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Collagen fibrils in affected skin are dispersed in the papillary to reticular dermis, whereas those in normal skin are regularly and tightly assembled."
    explanation: Describes the diagnostic ultrastructural collagen abnormality in mcEDS skin.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glycosaminoglycan chains are linear in affected skin, stretching from the outer surface of collagen fibrils to adjacent fibrils; glycosaminoglycan chains are curved in normal skin, maintaining close contact with attached collagen fibrils."
    explanation: >
      Documents the altered glycosaminoglycan-collagen geometry that follows
      replacement of decorin dermatan sulfate by chondroitin sulfate.
  downstream:
  - target: Progressive Multisystem Connective Tissue Fragility
    description: >
      Failure of ordered collagen fibril assembly leaves skin, joints, vessels,
      and hollow organs mechanically weak, producing the progressive
      fragility-related complications that dominate the disease after infancy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26646600
      reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "multisystem fragility is presumably caused by impaired assembly of collagen fibrils resulting from loss of dermatan sulfate (DS) in the decorin glycosaminoglycan side chain that promotes electrostatic binding between collagen fibrils"
      explanation: Attributes the multisystem fragility phenotype to impaired collagen fibril assembly.
  - target: Congenital Malformation of Connective-Tissue-Dependent Structures
    description: >
      Because dermatan sulfate proteoglycans are required during fetal
      development, the same biosynthetic block also produces the congenital
      malformation arm of the disease, present at birth rather than acquired.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26646600
      reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CHST14/D4ST1 and, more fundamentally, DS, play a critical role in fetal development and maintenance of connective tissues in multiple organs"
      explanation: >
        Separates the developmental role of dermatan sulfate from its
        tissue-maintenance role, the basis for the two-arm disease structure.
- name: Congenital Malformation of Connective-Tissue-Dependent Structures
  biological_scale: ORGANISM
  description: >
    The developmental arm of mcEDS, evident at birth: multiple congenital
    contractures (characteristically adduction-flexion contractures of the
    thumbs and talipes equinovarus), a recognizable craniofacial gestalt, and
    visceral and ophthalmological malformations. These features are congenital
    and non-progressive in origin, distinguishing them from the fragility arm.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:26646600
    reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple congenital contractures including adduction-flexion contractures and talipes equinovarus as well as other visceral or ophthalmological malformations"
    explanation: Describes the congenital malformation component of the mcEDS phenotype.
  - reference: PMID:40373179
    reference_title: "Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characteristic craniofacial features (large anterior fontanel with delayed closure, short and downslanted palpebral fissures, hypertelorism, blue sclera, low-set posteriorly rotated ears, short nose with hypoplastic columella, long philtrum, thin vermilion of the upper lip, small mouth, high palate, micrognathia)"
    explanation: GeneReviews enumerates the characteristic craniofacial gestalt.
- name: Progressive Multisystem Connective Tissue Fragility
  biological_scale: ORGANISM
  description: >
    The progressive arm of mcEDS, emerging and worsening after infancy: skin
    hyperextensibility, bruisability and fragility with atrophic scars,
    recurrent dislocations, progressive talipes and spinal deformities, large
    subcutaneous hematomas, pneumothorax or pneumohemothorax, and diverticular
    perforation. These complications dominate long-term morbidity and drive the
    surveillance schedule.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:26646600
    reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive multisystem fragility-related complications (skin hyperextensibility, bruisability, and fragility with atrophic scars; recurrent dislocations; progressive talipes or spinal deformities; pneumothorax or pneumohemothorax; large subcutaneous hematomas; and diverticular perforation)"
    explanation: Enumerates the progressive fragility-related complications of mcEDS.
  - reference: PMID:31905796
    reference_title: "Recent Advances in the Pathophysiology of Musculocontractural Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical features comprise multisystem congenital malformations and progressive connective tissue fragility-related manifestations."
    explanation: Confirms the two-arm disease structure of mcEDS.

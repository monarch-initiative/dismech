    reference_title: "Loss of dermatan sulfate epimerase (DSE) function results in musculocontractural Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived fibroblasts also showed a significant reduction in epimerase activity."
    explanation: Establishes reduced epimerase activity as a measurable cellular biochemical phenotype.
genetic:
- name: CHST14
  notes: >
    Encodes carbohydrate sulfotransferase 14 / dermatan 4-O-sulfotransferase-1
    (D4ST1), which 4-O-sulfates N-acetylgalactosamine residues in the
    chondroitin/dermatan sulfate chain. Biallelic loss-of-function variants
    cause mcEDS-CHST14, the common and more severe subtype. This form was
    originally described under three separate names — adducted thumb-clubfoot
    syndrome, EDS Kosho type, and a subset of kyphoscoliotic EDS without lysyl
    hydroxylase deficiency — before being unified.
  gene_term:
    preferred_term: CHST14
    term:
      id: hgnc:24464
      label: CHST14
  relationship_type: CAUSATIVE
  subtype: mcEDS-CHST14
  evidence:
  - reference: PMID:25703627
    reference_title: "Genetic heterogeneity and clinical variability in musculocontractural Ehlers-Danlos syndrome caused by impaired dermatan sulfate biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic variants in CHST14, encoding dermatan 4-O-sulfotransferase-1 (D4ST1), cause musculocontractural Ehlers-Danlos syndrome (MC-EDS), a recessive disorder characterized by connective tissue fragility, craniofacial abnormalities, congenital contractures, and developmental anomalies."
    explanation: Establishes the CHST14-mcEDS gene-disease relationship and its recessive mode.
  - reference: PMID:26646600
    reference_title: "CHST14/D4ST1 deficiency: New form of Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first reported human disorder that specifically affects biosynthesis of DS."
    explanation: Frames CHST14 deficiency as the founding dermatan-sulfate biosynthesis disorder.
- name: DSE
  notes: >
    Encodes dermatan sulfate epimerase-1 (DS-epi1), which converts glucuronic
    acid to iduronic acid in the nascent chondroitin/dermatan sulfate chain —
    the step immediately upstream of D4ST1 sulfation. Biallelic loss-of-function
    variants cause mcEDS-DSE, establishing locus heterogeneity for mcEDS.
    Reported variants include the original homozygous missense c.803C>T
    (p.S268L) and the later nonsense and frameshift variants c.960T>A
    (p.Tyr320*) and c.996dupT (p.Val333Cysfs*4).
  gene_term:
    preferred_term: DSE
    term:
      id: hgnc:21144
      label: DSE
  relationship_type: CAUSATIVE
  subtype: mcEDS-DSE
  evidence:
  - reference: PMID:23704329
    reference_title: "Loss of dermatan sulfate epimerase (DSE) function results in musculocontractural Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now identified a homozygous DSE missense mutation (c.803C>T, p.S268L) by the positional candidate approach in a male child with MCEDS, who was born to consanguineous parents."
    explanation: The index report establishing DSE as an mcEDS locus.
  - reference: PMID:32130795
    reference_title: "Delineation of musculocontractural Ehlers-Danlos Syndrome caused by dermatan sulfate epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous pathogenic variants in DSE were found: c.960T>A/p.Tyr320* in patient 1 and c.996dupT/p.Val333Cysfs*4 in patients 2 and 3."
    explanation: Documents additional loss-of-function DSE variants in molecularly confirmed patients.

animal_models:
- name: Nr3b2 (Esrrb) null mouse, including genetically mosaic animals
  species: Mouse
  genotype: Nr3b2(-/-); mosaic Nr3b2(-/-) inner ear epithelium
  publication: PMID:17765677
  description: >-
    The model that established what ERR-beta does in the inner ear. Because germline Nr3b2 loss is
    not compatible with normal development, the informative experiments are on the inner ear epithelium
    and on genetically mosaic animals in which null marginal cells sit beside wild-type ones - which
    is what makes the non-cell-autonomous effects on intermediate cells and capillaries interpretable.
  modeled_mechanisms:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Null mouse marginal cells fail to express multiple ion-channel and transporter genes. This
      directly models the secretory gene-expression node.
    limitations: >-
      Null animals establish gene function but do not measure the residual activity or phenotype
      of individual human missense variants. The accessible primary abstract lacks quantitative auditory
      physiology.
    readouts:
    - name: Expression of strial marginal cell ion channel and transporter genes
      target: Failure of the Strial Marginal Cell Secretory Programme
      direction: DECREASED
      interpretation: The secretory gene programme is not switched on, which is the definition of this node.
      evidence:
      - reference: PMID:17765677
        reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          Nr3b2(-/-) strial marginal cells fail to express multiple ion channel and transporter genes
        explanation: >-
          The direct measurement of the transcriptional readout in null marginal cells.
    evidence:
    - reference: PMID:17765677
      reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        an orphan nuclear receptor, is specifically expressed in and controls the development of
        the endolymph-producing cells of the inner ear
      explanation: >-
        Establishes that this model is informative for the marginal cell node by showing the gene
        acts in exactly those cells.
  - target: Impaired Endolymph Homeostasis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The 2008 gene-discovery paper summarizes impaired endolymph production and defective hearing
      and balance in conditional-null Esrrb mice.
    limitations: >-
      Physiological consequences are summarized in a later paper; the accessible primary abstract
      does not provide quantitative endolymph or auditory measurements. Extrapolation to human alleles
      is limited.
    evidence:
    - reference: PMID:18179891
      reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Disturbed endolymph production in these mice results in an aberrant inner-ear fluid homeostasis
        and as a consequence in defective hearing and balance.
      explanation: >-
        The human gene-discovery paper summarizes earlier conditional mouse experiments; this is
        indirect evidence for their physiological outcome.
  - target: Partial Marginal Cell Fate Transformation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Nr3b2-null mouse strial marginal cells partially acquire the identity of neighboring Pendrin-expressing
      epithelial cells. This is a partial fate transformation, not evidence that every marginal cell
      disappears or becomes an identical mature neighboring cell.
    limitations: >-
      Directly observed in the null/mosaic mouse model; corresponding human cochlear histology has
      not been reported in the cited studies.
    evidence:
    - reference: PMID:17765677
      reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        they show a partial transformation toward the fate of the immediately adjacent Pendrin-expressing
        epithelial cells
      explanation: >-
        The authors distinguish a partial identity change from loss of transporter expression.
  - target: Secondary Strial Intermediate Cell Expression Changes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      In genetically mosaic mice, Nr3b2-null marginal cells induce secondary changes in gene expression
      in the underlying intermediate-cell layer. This establishes a local non-cell-autonomous effect,
      without identifying a specific intercellular signal.
    limitations: >-
      Directly observed in the null/mosaic mouse model; corresponding human cochlear histology has
      not been reported in the cited studies.
    evidence:
    - reference: PMID:17765677
      reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Nr3b2(-/-) strial marginal cells produce secondary alterations in gene expression in the
        underlying intermediate cells
      explanation: >-
        Mosaic analysis links mutant marginal cells to altered expression in the neighboring strial
        layer.
  - target: Local Strial Capillary Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Local loss of strial capillaries accompanies Nr3b2-null marginal-cell regions in mosaic mice.
      The primary abstract reports the vascular consequence without establishing its temporal order
      relative to intermediate-cell expression changes or specifying the vascular signaling mechanism.
    limitations: >-
      Directly observed in the null/mosaic mouse model; corresponding human cochlear histology has
      not been reported in the cited studies.
    evidence:
    - reference: PMID:17765677
      reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        In genetically mosaic mice, Nr3b2(-/-) strial marginal cells produce secondary alterations
        in gene expression in the underlying intermediate cells and a local loss of strial capillaries.
      explanation: >-
        The capillary finding is separated from the intermediate-cell expression phenotype; no serial
        causal order between them is inferred.

discussions:
- discussion_id: dfnb35_strial_failure_to_threshold
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Endolymph Homeostasis
  prompt: >-
    Does loss of ERR-beta actually raise hearing thresholds in a mouse, and by how much?
  rationale: >-
    Mouse loss-of-function evidence supports defective strial development, and the 2008 gene-discovery
    paper summarizes defective hearing, balance and endolymph production in rescued or conditional-null
    mice. The available records do not provide a verified quantitative genotype-dependent ABR, DPOAE
    or endocochlear-potential comparison. Human missense alleles should not be assumed to retain
    function without assay evidence. Comparing null and defined missense alleles would clarify dose
    dependence; human vestibular results include both normal caloric testing and a single abnormal
    cVEMP report.
  proposed_experiments:
  - experiment_id: dfnb35_exp_abr_ep_conditional_ko
    name: Auditory brainstem response and endocochlear potential in a conditional Esrrb inner-ear knockout
    description: >-
      Measure longitudinal ABR, DPOAE, endocochlear potential and vestibular responses in conditional-null
      animals and a defined human-variant knock-in such as p.Arg382Cys, including the variant in
      trans with a null allele. This tests the proposed hypomorphic mechanism without assuming it.
    would_support:
    - pathophysiology#Impaired Endolymph Homeostasis
    supporting_outcome:
    - Elevated ABR thresholds together with a reduced endocochlear potential and reduced endolymphatic potassium, with the missense knock-in showing an intermediate deficit.
    would_refute:
    - pathophysiology#Impaired Endolymph Homeostasis
    refuting_outcome:
    - Normal endocochlear potential and normal ABR thresholds despite the documented marginal cell fate defect, which would mean the fate conversion is compensated and the deafness arises somewhere else.
- discussion_id: dfnb35_is_it_really_nonsyndromic
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Increased Dental Caries Experience
  prompt: >-
    Does ESRRB dysfunction increase caries susceptibility beyond age, dental care and environmental
    influences?
  rationale: >-
    The Turkish pedigree had severe caries in six affected homozygotes and four heterozygotes, while
    the Czech affected child was caries-free at four years. Telephone histories and unequal dental-care
    access limit interpretation. Normal mouse ameloblast expression and common-SNP associations do
    not establish a DFNB35-specific enamel defect. Standardized dental examination across genotypes
    is needed to assess this association.
  proposed_experiments:
  - experiment_id: dfnb35_exp_dmft_pedigrees
    name: DMFT scoring in reported DFNB35 pedigrees
    description: >-
      Score decayed, missing and filled teeth in affected homozygotes, heterozygous relatives and
      unaffected relatives across the reported DFNB35 families, controlling for age and access to
      dental care, which is the obvious confounder in consanguineous cohorts from different countries.
    would_support:
    - phenotypes#Increased Dental Caries Experience
    supporting_outcome:
    - Higher DMFT in biallelic carriers than in their unaffected relatives across multiple independent pedigrees.
    would_refute:
    - phenotypes#Increased Dental Caries Experience
    refuting_outcome:
    - No DMFT difference between biallelic carriers and relatives once age and dental access are matched, which would make the two-family observation a confound of socioeconomic ascertainment.
- discussion_id: dfnb35_absent_vestibular_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#
  prompt: >-
    How often is vestibular function affected in ESRRB-related hearing loss, and does it depend on
    genotype or the vestibular test used?
  rationale: >-
    Vestibular function is not uniformly unexamined or uniformly abnormal. Collin et al. reported
    normal caloric testing in two Turkish adults; Wang et al. reported abnormal cVEMP but normal
    rotary-chair testing in one pediatric ESRRB-associated case. The latter finding is tabulated
    rather than individually discussed in the narrative. Different tests sample different vestibular
    end organs, and these small reports cannot define penetrance or establish a simple species discordance
    with null mice.
  proposed_experiments:
  - experiment_id: dfnb35_exp_vestibular_testing
    name: Vestibular testing in molecularly confirmed DFNB35 patients
    description: >-
      Video head impulse testing, cervical and ocular VEMPs and caloric testing in biallelic ESRRB
      patients, who are largely already in contact with cochlear implant programmes where such testing
      is routine.
    would_support:
    - pathophysiology#Failure of the Strial Marginal Cell Secretory Programme
    supporting_outcome:
    - Reduced VEMP responses or caloric hypofunction in a substantial fraction of DFNB35 patients, which would extend the dark cell arm of the mechanism into the clinic.
    would_refute:
    - pathophysiology#Failure of the Strial Marginal Cell Secretory Programme
    refuting_outcome:
    - Consistently normal results across canal and otolith tests in a larger genotype-defined series would argue against a common vestibular deficit, while not negating the existing single-case result.

notes: >-
  DFNB35 is a single-gene recessive hearing-loss disorder. Mouse loss-of-function evidence supports
  a strial marginal-cell mechanism. The broader supporting-cell and neural localization reported
  by Collin et al. was established by developmental mouse in situ hybridization and postnatal-day-4
  rat immunohistochemistry. Expression alone does not demonstrate a separate neuronal disease mechanism
  or preservation of the neural target for cochlear implantation.

  The original Turkish pedigree had absent otoacoustic emissions and normal caloric testing in the
  two extensively evaluated adults. A later pediatric series reported an ESRRB-associated vestibular
  deficit by cVEMP with normal rotary-chair testing. These findings should be interpreted by age,
  genotype and test, without inferring a frequency from a single case or declaring all human vestibular
  function normal.

  The 2008 gene-discovery study reports a frameshift and four missense alleles, not an additional
  in-frame deletion. Its p.Pro386Ser variant was also homozygous in two controls and considered polymorphic;
  a heterozygous p.Thr389Met lacked an identified second allele and remained uncertain. The 2024
  literature synthesis reports 22 distinct variants, including an in-frame allele from other literature,
  and retains p.Arg382Cys as a VUS despite functional evidence. Missense predominance does not establish
  that all human alleles are hypomorphic. No ESRRB-specific GeneReviews chapter is identified in
  the baseline check; the general Genetic Hearing Loss Overview supports management and counseling.
  ClinicalTrials.gov returned no studies for ESRRB or DFNB35 on 2026-09-27.


    term:
      id: GO:0006813
      label: potassium ion transport
    modifier: DECREASED
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  downstream:
  - target: Impaired Endolymph Homeostasis
    causal_link_type: DIRECT
    description: >-
      The marginal cells are the endolymph-producing epithelium; a marginal cell that never acquires
      its transporter repertoire cannot secrete.
  evidence:
  - reference: PMID:17765677
    reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We show here that estrogen-related receptor beta (ERR-beta; NR3B2), an orphan nuclear receptor,
      is specifically expressed in and controls the development of the endolymph-producing cells
      of the inner ear: the strial marginal cells in the cochlea and the vestibular dark cells in
      the ampulla and utricle.
    explanation: >-
      Localises ERR-beta function to exactly these two cell types, which is what puts the DFNB35
      lesion in the lateral wall rather than in the hair cell.
  - reference: PMID:17765677
    reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Nr3b2(-/-) strial marginal cells fail to express multiple ion channel and transporter genes
    explanation: >-
      The null marginal cells lose expression of the secretory machinery. This is a mouse result,
      not a direct measurement in human strial tissue.
  notes: >-
    The marginal-cell localization and knockout experiments provide direct model evidence. Collin
    et al. additionally reported a broader distribution in P4 rat cochlea, including supporting and
    neural compartments; different ages, species and antibodies limit direct comparison of localization
    patterns.

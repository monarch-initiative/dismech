    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:25023176
    reference_title: "Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "provides options for the development of new caries prevention strategies, if the associated ESRRB genetic variants are correlated with efficacy"
    explanation: >-
      The authors' conditional proposal, quoted with its condition intact. It supports

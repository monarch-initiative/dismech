inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic ESRRB variants. Most reported pedigrees are consanguineous and homozygous -
    Turkish, Pakistani, Tunisian, Czech - with unaffected heterozygous parents. The
    compound heterozygous configuration is the exception and has been documented in a
    Korean family and a Han Chinese family, both carrying p.Arg382Cys in trans with a
    second allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Mutation analysis of ESRRB, a candidate gene in the overlapping region, revealed a homozygous 7 bp duplication in exon 8 in all affected individuals."
    explanation: >-
      Homozygosity in every affected member of the consanguineous Turkish family that
      defined the gene, which is the recessive pattern.
  - reference: PMID:22951369
    reference_title: "DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Mutation p.R291L in a homozygous state was found in the deaf child, the parents were heterozygous."
    explanation: >-
      Segregation in the Czech family: homozygous in the affected child, heterozygous and
      unaffected in both parents.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Consequently, the majority of reported cases exhibited homozygous zygosity except the p.(Arg382Cys) variant, which presented as a compound heterozygous variant in trans with either c.16A>G in a Han Chinese family or c.397 + 2T>G in a South Korean family."
    explanation: >-
      States the zygosity distribution across the whole reported literature, and names the
      two compound heterozygous exceptions.
pathophysiology:
- name: ESRRB Loss of Function
  biological_scale: MOLECULAR
  role: initiator
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic ESRRB alleles that reduce or abolish the transcriptional output of ERR-beta.
    The reported spectrum is dominated by missense substitutions: of the coding variants
    described to date, all but one lie in the DNA-binding domain or the ligand-binding
    domain, split roughly evenly between them. Truncating alleles exist but are the
    minority - the seven base pair exon 8 duplication that defined the gene in the Turkish
    family, and a canonical donor splice variant that skips exon 4 and triggers
    nonsense-mediated decay. Because most alleles are missense, DFNB35 is better read as a
    graded loss of transcription factor activity than as a clean null.
  genes:
  - preferred_term: ESRRB
    term:
      id: hgnc:3473
      label: ESRRB
  molecular_functions:
  - preferred_term: ERR-beta nuclear receptor transcription factor activity
    term:
      id: GO:0004879
      label: nuclear receptor activity
    modifier: DECREASED
  downstream:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    causal_link_type: DIRECT
    description: >-
      ERR-beta is the transcription factor that installs and maintains the endolymph
      secretory programme in strial marginal cells, so reduced ERR-beta activity is read
      out directly as failure of that programme.
  evidence:
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Sequence analysis of the ESRRB gene in the affected individuals of the original DFNB35 family and in three other DFNB35-linked consanguineous families from Pakistan revealed four missense mutations."
    explanation: >-
      Establishes that the founding DFNB35 alleles are predominantly missense rather than
      truncating.
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Molecular modeling of this nuclear receptor showed that the missense mutations are likely to affect the structure and stability of these domains."
    explanation: >-
      The original mechanistic argument for these missense alleles was structural
      modelling, not an assay - graded COMPUTATIONAL and INDIRECT for that reason.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Of the 19 coding variants, all were located in functional domains except for one variant (c.16A>G:p.Arg6Gly). Nine were resided in the LBD while the remaining 9 were positioned in the DNA binding domain (DBD)."
    explanation: >-
      The domain distribution of the reported coding alleles, which is the basis for
      describing DFNB35 as a domain-restricted loss of transcription factor function.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "In alignment with bioinformatics analysis, the c.397 + 2T>G splicing event was observed to induce exon 4 skipping, leading to formation of a premature stop codon followed by nonsense-mediated decay (NMD)."
    explanation: >-
      Minigene assay in HEK293T cells showing that the splice allele produces a
      transcript destined for degradation, which is the truncating end of the spectrum.
  notes: >-
    No ESRRB genotype-phenotype correlation has been established: the 2024 review of the
    full reported spectrum found no significant difference in onset, severity or symmetry
    between DNA-binding-domain and ligand-binding-domain alleles.

- name: Reduced ERR-beta Transcriptional Output at Target Promoters
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  description: >-
    The molecular consequence measured directly in patient material and in inner-ear
    derived cells. The recurrent p.Arg382Cys ligand-binding-domain substitution does not
    stop ERR-beta reaching the nucleus - subcellular fractionation and immunocytochemistry
    show wild-type-like nuclear localisation - but it destabilises the protein and
    abolishes its activity on a reporter promoter. Downstream, transcripts of ESRRB target
    genes fall by roughly half in patient-derived lymphoblastoid lines, including ATP1B1,
    which encodes the Na+/K+-ATPase beta-1 subunit that inner ear ion gradients depend on.
    The distinction matters mechanistically: this is a transcriptional output failure, not
    a trafficking failure.
  biological_processes:
  - preferred_term: regulation of transcription by ERR-beta at target promoters
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DECREASED
  downstream:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced transcription of the ion channel, transporter and ATPase genes that
      constitute the marginal cell secretory programme.
    description: >-
      Lowered transcriptional output at ERR-beta target promoters is the molecular route
      by which the marginal cell secretory programme is not installed.
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Transient overexpression of the ESRRB wild-type significantly increased luciferase activity, demonstrating a 2.09-fold increase relative to the internal control in HEI-OC1 cells (p < 0.01) and 2.21-fold in HEK293T cells (p < 0.01). However, the luciferase activity of ESRRB mutant did not exhibit a significant deviation from the internal control"
    explanation: >-
      The reporter assay: wild-type ERR-beta drives the promoter about two-fold, the
      p.Arg382Cys protein does not drive it at all.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Consistent with molecular modeling and dynamics studies, the stability of the ESRRB p.(Arg382Cys) variant was significantly reduced compared to that of the wild-type"
    explanation: >-
      Cycloheximide chase in HEI-OC1 and HEK293T cells attributing the lost activity to
      protein instability rather than to a defective DNA-binding surface.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "we observed marked decreases in mRNA levels of ATP1B1 and EGR1 (decreased 55.1% and 45.4% respectively)"
    explanation: >-
      Target gene output measured in cells from the affected proband. ATP1B1 encodes a
      Na+/K+-ATPase subunit, which is why this connects to inner ear ion transport.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "However, immunocytochemistry data showed that there was no significant difference in the translocation ability of ESRRB into the nucleus between the mutant and the wild type"
    explanation: >-
      The negative result that localises the defect: nuclear import is intact, so the lost
      output is not a trafficking problem.
  notes: >-
    Graded IN_VITRO throughout even though the cells came from patients: these are
    reporter, cycloheximide-chase and qRT-PCR experiments in cultured lines, not clinical
    observations. The lymphoblastoid lines are also not inner ear tissue, which is the main
    reason this node is separated from the strial node below rather than merged into it.

- name: Failure of the Strial Marginal Cell Secretory Programme
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    ERR-beta is expressed specifically in the endolymph-producing cells of the inner ear -
    strial marginal cells in the cochlea, vestibular dark cells in the ampulla and utricle
    - and controls their development. Without it, these cells fail to express the panel of
    ion channel and transporter genes that makes them secretory, and they partially convert
    toward the identity of the adjacent Pendrin-expressing epithelium. This is a cell-fate
    defect, which is a different lesion from the transport defects that Jervell and
    Lange-Nielsen syndrome (KCNQ1, KCNE1) or Delpire-McNeill syndrome (SLC12A2) produce in
    the same cells: there the machinery is installed and broken, here it is not installed.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  - preferred_term: vestibular dark cell
    term:
      id: CL:0000846
      label: vestibular dark cell
  biological_processes:
  - preferred_term: potassium ion transport into endolymph
    term:
      id: GO:0006813
      label: potassium ion transport
    modifier: DECREASED
  - preferred_term: inner ear development
    term:
      id: GO:0048839
      label: inner ear development
    modifier: DECREASED
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  downstream:
  - target: Impaired Endolymph Production and Cochlear Lateral Wall Failure
    causal_link_type: DIRECT
    description: >-
      The marginal cells are the endolymph-producing epithelium; a marginal cell that
      never acquires its transporter repertoire cannot secrete.
  evidence:
  - reference: PMID:17765677
    reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "We show here that estrogen-related receptor beta (ERR-beta; NR3B2), an orphan nuclear receptor, is specifically expressed in and controls the development of the endolymph-producing cells of the inner ear: the strial marginal cells in the cochlea and the vestibular dark cells in the ampulla and utricle."
    explanation: >-
      Localises ERR-beta function to exactly these two cell types, which is what puts the
      DFNB35 lesion in the lateral wall rather than in the hair cell.
  - reference: PMID:17765677
    reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Nr3b2(-/-) strial marginal cells fail to express multiple ion channel and transporter genes, and they show a partial transformation toward the fate of the immediately adjacent Pendrin-expressing epithelial cells."
    explanation: >-
      The core cell-fate result: the secretory gene programme is not switched on and the
      cells drift toward a neighbouring identity.
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "RNA in situ hybridization in mice revealed that Esrrb is expressed during inner-ear development, whereas immunohistochemical analysis showed that ESRRB is present postnatally in the cochlea."
    explanation: >-
      Expression evidence rather than functional evidence, and in mouse - it establishes
      that the gene is present where the mechanism requires it, from which the claim
      follows only in combination with the knockout result.
  notes: >-
    The Nr3b2 knockout characterisation is a mouse study and its cached abstract reports
    cell-fate, gene-expression and vascular findings but no audiometry, so the strial
    phenotype is what is measured here and the hearing consequence is inferred.

- name: Impaired Endolymph Production and Cochlear Lateral Wall Failure
  biological_scale: TISSUE
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    The tissue-level consequence: an endolymph-secreting epithelium that cannot secrete.
    In the mosaic mouse the defect is not confined to the marginal cell layer - null
    marginal cells alter gene expression in the intermediate cells beneath them and the
    local strial capillary bed is lost, so the stria fails as a three-layer unit rather
    than as one cell type. Both the endocochlear potential and the endolymphatic potassium
    concentration depend on this epithelium, and lesions elsewhere in the same compartment
    are established causes of profound deafness. Graded PROVISIONAL because the endolymph
    and endocochlear potential consequences of ESRRB loss specifically have not been
    measured; what is measured is the loss of the machinery that produces them.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  biological_processes:
  - preferred_term: potassium ion homeostasis of endolymph
    term:
      id: GO:0055075
      label: potassium ion homeostasis
    modifier: DYSREGULATED
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  - preferred_term: endolymph
    term:
      id: UBERON:0001852
      label: endolymph
  downstream:
  - target: Bilateral Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of the endocochlear potential and of the endolymphatic potassium gradient, on
      which hair cell mechanotransduction depends.
    description: >-
      A stria vascularis that does not develop is an established route to sensorineural
      deafness; the evidence for that step in DFNB35 comes from the compartment rather
      than from ESRRB itself.
    evidence:
    - reference: PMID:31550482
      reference_title: "TBX1 is required for normal stria vascularis and semicircular canal development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Mutant mice are deaf due to an undeveloped stria vascularis and show vestibular dysfunction associated with abnormal semicircular canal formation."
      explanation: >-
        Indirect on two counts and deliberately labelled so: this is a Tbx1 mouse, not an
        Esrrb mouse. It is cited because the same paper places Tbx1 upstream of Esrrb in
        these cells, so it demonstrates that failing to develop this specific epithelium
        produces deafness - the step DFNB35 needs but has never had measured in ESRRB.
    - reference: PMID:31550482
      reference_title: "TBX1 is required for normal stria vascularis and semicircular canal development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We show that TBX1 is expressed in endolymph-producing strial marginal cells and vestibular dark cells of the inner ear and is an upstream regulator of Esrrb, which previously was shown to control the developmental fate of these cells."
      explanation: >-
        Places Esrrb downstream of Tbx1 in the same two cell types, which is what makes the
        Tbx1 deafness phenotype relevant to an ESRRB entry rather than merely adjacent.
  evidence:
  - reference: PMID:17765677
    reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "In genetically mosaic mice, Nr3b2(-/-) strial marginal cells produce secondary alterations in gene expression in the underlying intermediate cells and a local loss of strial capillaries."
    explanation: >-
      Shows the failure is not cell-autonomous to the marginal layer: the intermediate
      cells and the capillary bed are affected too, which is why this node is at tissue
      rather than cellular scale.
  - reference: PMID:17765677
    reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In the mammalian inner ear, endolymph is produced and resorbed by a complex series of epithelia."
    explanation: >-
      Background sentence establishing that endolymph production is an epithelial function,
      which is the premise the tissue-level claim rests on rather than a result.
  notes: >-
    This node sits where the `sensorineural_hair_cell_loss` module places `Cochlear Ionic
    Homeostasis Disruption and Oxidative Stress`, and the same compartment is curated in
    `Jervell_and_Lange-Nielsen_Syndrome_1` and `Delpire-McNeill_Syndrome`, which are the
    natural comparison entries. `conforms_to` is deliberately not declared. Two reasons, both
    content rather than bookkeeping: the module node bundles potassium homeostasis with
    oxidative stress, and no oxidative-stress claim has been made for ESRRB; and the module
    node's expected downstream edge is hair cell death, which is exactly the step this entry
    declines to assert because no ESRRB study has measured it. Declaring conformance would
    import both claims by reference. If an ESRRB mouse is ever shown to lose hair cells, this
    node should gain the module chain below it and the conformance declaration with it.

- name: Reduced ESRRB Activity in Secretory-Stage Ameloblasts
  biological_scale: CELLULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A second, non-cochlear site of ESRRB action that complicates the "nonsyndromic" label.
    Esrrb protein is present in mouse ameloblasts during the secretory stage of
    amelogenesis, when enamel matrix is laid down, but not at the later maturation stage.
    The proposed consequence is enamel that is more susceptible to acid dissolution rather
    than a recognisable enamel dysplasia, which is consistent with the clinical picture
    being excess caries rather than amelogenesis imperfecta. This is curated as a modifier
    node, not as part of the hearing loss chain.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: enamel matrix deposition during the secretory stage
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: DECREASED
  downstream:
  - target: Increased Dental Caries Experience
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The proposed route is a softer, more acid-soluble enamel surface, but the human data
      are association and family observation rather than a demonstrated causal chain.
  evidence:
  - reference: PMID:25023176
    reference_title: "Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Esrrb is expressed by mouse ameloblasts, the cells that deposit tooth enamel, during the secretory stage of amelogenesis in mice"
    explanation: >-
      Immunohistochemistry placing Esrrb in the enamel-secreting cell at the stage when
      matrix is deposited, which is the expression basis for this node.
  - reference: PMID:25023176
    reference_title: "Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Through experiments that tested the effects of acid dissolution of the enamel surface, we reasoned that ESRRB variants contributes to formation of an enamel structure that is more susceptible to the acidic effects in- volved in the initiation of dental caries."
    explanation: >-
      The authors' own mechanistic proposal, stated as reasoning from enamel microhardness
      testing rather than as a demonstrated result - hence INDIRECT and hence the
      PROVISIONAL confidence on the node.
  notes: >-
    The enamel microhardness and SNP-association arms of this paper were run in general
    population cohorts, not in DFNB35 patients, so they establish an ESRRB-caries
    association at the locus rather than a DFNB35 phenotype. Only the two-family
    observation is about DFNB35 itself.
phenotypes:
- name: Bilateral Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The defining and, so far, only consistently reported feature. Every DFNB35 patient
    described has sensorineural rather than conductive or mixed loss, which is what the
    lateral wall localisation of the lesion predicts.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In all affected DFNB35 patients, the type of hearing loss was identified as SNHL."
    explanation: >-
      A statement across the whole reported DFNB35 literature that the loss is
      sensorineural in every case.
  - reference: PMID:35101039
    reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Our study evaluated the genetic cause of bilateral severe to profound HL in an Iranian family with Azeri Turkish ethnicity."
    explanation: >-
      Bilaterality stated for an individual DFNB35 family, which is what the cross-literature
      sentence above does not supply.
  notes: >-
    Bound to the bilateral term because no unilateral DFNB35 case has been reported. The
    first quoted sentence establishes the sensorineural type across the literature but not
    laterality; laterality rests on the individual pedigree audiograms, of which the Iranian
    family is one.
- name: Severe to Profound Hearing Impairment
  category: Auditory
  description: >-
    Most reported patients fall at the severe-to-profound end. The exception is
    instructive: the Korean proband had moderate loss in one ear and severe-to-profound in
    the other, and the milder ear then deteriorated over seventeen years of follow-up. So
    severity is not fixed at presentation in every patient, and the asymmetric, progressive
    pattern is documented at least once.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Severe sensorineural hearing impairment
    term:
      id: HP:0008625
      label: Severe sensorineural hearing impairment
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The majority of hearing loss phenotypes exhibited symmetry, prelingual onset, and severe-to-profound SNHL, whereas our proband showed asymmetric hearing loss with a progressive nature."
    explanation: >-
      Gives both the majority pattern and the documented exception in one sentence, which
      is why the frequency is VERY_FREQUENT rather than OBLIGATE.
  - reference: PMID:32681043
    reference_title: "Spectrum of genetic variants in moderate to severe sporadic hearing loss in Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "A missense variant in ESRRB was implicated for recessively inherited moderate to severe hearing loss."
    explanation: >-
      A sporadic Pakistani case at the moderate-to-severe rather than profound end.
      Indirect for this phenotype because it qualifies the severity range rather than
      asserting the severe-to-profound majority.
  - reference: PMID:35101039
    reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The audiograms show bilateral severe to profound hearing loss in (a) V4, (b) V5, and (c) V6"
    explanation: >-
      Audiometric confirmation in three affected siblings of the Iranian family, which is
      the severe-to-profound majority pattern in a single pedigree.
  notes: >-
    The node is named "Severe to Profound" but the binding is HP:0008625, *Severe*
    sensorineural hearing impairment, which is the narrower of the two. That direction is
    deliberate: HPO has no combined severe-to-profound term, and binding to the profound term
    instead would over-state severity for the patients at the severe end. The broader range is
    carried by `preferred_term` and by the description, which the term contract permits.
- name: Prelingual Onset Hearing Impairment
  category: Auditory
  description: >-
    Onset is typically before speech acquisition, so DFNB35 usually presents as congenital
    or early-childhood deafness rather than as adult-onset loss. The Korean proband's
    hearing was described as congenital or evident at prelingual onset, and the Pakistani
    families in which the ESRRB splice allele was found were ascertained specifically for
    prelingual onset.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Hearing impairment was congenital or evident at prelingual onset."
    explanation: The onset description for the Korean proband.
  - reference: PMID:33269433
    reference_title: "Homozygous mutations in Pakistani consanguineous families with prelingual nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This study determined the genetic causes in five Pakistani DFNB families with prelingual onset."
    explanation: >-
      The ESRRB splice allele c.787+1G>A was found in this prelingual-onset series, which
      places at least one further DFNB35 family in the prelingual category.
  - reference: PMID:35101039
    reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "As stated by parents, HL was congenital, and no other abnormality indicated syndromic HL."
    explanation: >-
      Congenital onset in the Iranian family, reported by parental history rather than by
      newborn screening - which is worth noting, because parental recall is how onset is
      established in most of these consanguineous pedigrees.
  notes: >-
    Bound to HP:0008527 (Congenital sensorineural hearing impairment) rather than to a
    prelingual-specific term because the source sentence itself hedges between congenital
    and prelingual. Frequency is VERY_FREQUENT rather than OBLIGATE: onset is not stated
    for every reported pedigree.
- name: Progressive Hearing Impairment
  category: Auditory
  description: >-
    Progression is documented in the one DFNB35 patient followed long enough to show it: the
    Korean proband's better ear deteriorated over seventeen years of serial audiograms. This
    matters clinically, because it means a moderate audiogram at presentation does not
    predict a stable one, and it distinguishes DFNB35 from the stereotype of a fixed
    congenital deafness. It is not the majority pattern - most reported patients are already
    severe-to-profound and symmetric when first tested, which leaves no room to observe
    progression - so the frequency is a floor, not a rate.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Progressive hearing impairment
    term:
      id: HP:0001730
      label: Progressive hearing impairment
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Over the course of a 17-year monitoring period, audiograms exhibited a progressive nature of hearing loss in the right ear (Fig. 1b)."
    explanation: >-
      Serial audiometry over seventeen years in a molecularly confirmed patient, which is the
      only longitudinal DFNB35 data that exists.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The majority of hearing loss phenotypes exhibited symmetry, prelingual onset, and severe-to-profound SNHL, whereas our proband showed asymmetric hearing loss with a progressive nature."
    explanation: >-
      Places the progressive course explicitly as the exception rather than the rule, which
      is the basis for the OCCASIONAL grade.
  notes: >-
    No longitudinal audiometry has been published for any other DFNB35 patient, so this is a
    denominator of one. It is recorded because a single well-documented seventeen-year series
    is a real observation about the disease's course, not because a frequency can be
    estimated from it.
- name: Increased Dental Caries Experience
  category: Dental
  description: >-
    The finding that makes "nonsyndromic" arguable. In the two DFNB35 families examined for
    it - the Turkish exon 8 duplication family and the Czech p.R291L family - dental
    destruction by caries was markedly more extensive in mutation carriers than in
    unaffected relatives. This is not classical syndromic deafness: there is no enamel
    dysplasia, no other organ system involved, and the observation rests on two families
    plus locus-level association data from unrelated caries cohorts.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Carious teeth
    term:
      id: HP:0000670
      label: Carious teeth
  evidence:
  - reference: PMID:25023176
    reference_title: "Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Two families with recessive ESRRB mutations and DFNB35 hearing impairment showed more extensive dental destruction by caries."
    explanation: >-
      The only direct DFNB35 observation in the paper, and the basis for recording this at
      all.
  - reference: PMID:25023176
    reference_title: "Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "When we evaluated dental caries in two families with previously described hearing impairment and ESRRB mutations, the evidence clearly showed that the severity of dental destruction was much more apparent in mutation carriers."
    explanation: >-
      Restates the comparison being between carriers and non-carriers within the same
      families, which is what makes it more than a background caries rate.
  notes: >-
    Graded OCCASIONAL, which is a floor rather than an estimate. Two families were examined
    and both were affected, but caries has not been assessed in any other DFNB35 pedigree,
    and no DFNB35 report before or since lists dental findings. A denominator of two is not
    a frequency, so the entry records the observation without promoting it toward
    FREQUENT.
prevalence:
- population: Worldwide reported literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Fewer than twenty families reported as of 2024, carrying twenty-two distinct alleles,
    with a strong ascertainment bias toward consanguineous Pakistani pedigrees. Recorded as
    a case count rather than a rate because no population denominator has been published.
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "To date, less than 20 families with SNHL exclusively of Pakistani ethnicity have been diagnosed with ESRRB biallelic variants"
    explanation: >-
      The case count and the ascertainment bias in one sentence. Note the sentence
      overstates exclusivity - Turkish, Czech, Tunisian and Korean families are also
      reported, including by this same paper - so it is cited for the order of magnitude.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "To date, 25 variant alleles of ESRRB (condensed to 22 when considering the same variants) have been reported to cause ESRRB-associated DFNB35, including variants found in the present study."
    explanation: The size of the reported allelic spectrum, which is the other measure of how small this disease is.
  - reference: PMID:35101039
    reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "There are currently more than 13 variants have been found in DFNB35, nearly half of which relates to Pakistani ethnicity"
    explanation: >-
      A more careful statement of the same ascertainment bias than the "exclusively
      Pakistani" phrasing quoted above: about half, not all. Reported families are also
      Turkish, Czech, Tunisian, Iranian, Korean and Han Chinese.
- population: Tunisian families with autosomal recessive nonsyndromic hearing loss
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    One DFNB35 family found; screening 127 further Tunisian ARNSHL families found no
    additional ESRRB mutations. This is a denominator for how rare DFNB35 is *among
    hearing-loss families*, not a population prevalence.
  evidence:
  - reference: PMID:21802533
    reference_title: "A novel missense mutation in the ESRRB gene causes DFNB35 hearing loss in a Tunisian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Using linkage and DHPLC analysis, no more mutations were detected in the ESRRB gene in other 127 Tunisian families with ARNSHL indicating that DFNB35 is most likely to be a rare type of ARNSHL in the Tunisian population."
    explanation: >-
      Gives an explicit denominator of 127 further families screened without a second hit.
- population: Czech patients with early-onset nonsyndromic hearing loss
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    One DFNB35 family found; sequencing ESRRB in 39 further Czech patients yielded only two
    homozygous variants judged to be polymorphisms.
  evidence:
  - reference: PMID:22951369
    reference_title: "DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The entire coding region of the ESRRB gene was sequenced in additional 39 patients of Czech origin with early NSHL and only two variants, p.V413I and p.P386S, were found in homozygous state, but are considered to be polymorphisms."
    explanation: >-
      A second screening denominator, and a useful warning that homozygous ESRRB coding
      variants are not automatically DFNB35 alleles.
genetic:
- name: ESRRB
  notes: >-
    Estrogen-related receptor beta, an orphan nuclear receptor at 14q24.3. Biallelic
    variants cause DFNB35. The reported alleles concentrate in the two functional domains -
    the DNA-binding domain and the ligand-binding domain - and are predominantly missense.
    The gene has a second, unrelated life as a core pluripotency transcription factor in
    embryonic stem cells, which is why searching the gene name returns mostly stem-cell and
    breast-cancer literature rather than deafness literature.
  gene_term:
    preferred_term: ESRRB
    term:
      id: hgnc:3473
      label: ESRRB
  relationship_type: CAUSATIVE
  variants:
  - name: c.1018_1024dup (7 bp duplication in exon 8)
    description: >-
      The allele that identified the gene, homozygous in a large consanguineous Turkish
      family. Frameshift with a premature stop codon.
    type: frameshift_variant
    evidence:
    - reference: PMID:18179891
      reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "This duplication results in a frame shift and premature stop codon."
      explanation: The predicted consequence of the founding allele.
  - name: p.A110V, p.L320P, p.V342L, p.L347P
    description: >-
      The four missense alleles found in the original DFNB35 family and in three
      DFNB35-linked consanguineous Pakistani families. p.A110V is in the DNA-binding
      domain; the other three are in the ligand-binding domain.
    type: missense_variant
    evidence:
    - reference: PMID:18179891
      reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "one of the substitutions (p.A110V) is located in the DNA-binding domain of ESRRB, whereas the other three are substitutions (p.L320P, p.V342L, and p.L347P) located within the ligand-binding domain"
      explanation: >-
        Names the four alleles and their domain assignments, which is the origin of the
        DBD/LBD split that still describes the spectrum.
  - name: p.Arg382Cys (c.1144C>T)
    description: >-
      A recurrent ligand-binding-domain missense allele, notable because it is common
      enough in East Asian populations (gnomAD East Asian allele frequency 0.007) to
      trigger the ACMG stand-alone benign criterion BA1, and was therefore classified as a
      variant of uncertain significance despite deleterious in silico predictions. Direct
      functional work later showed reduced protein stability, abolished reporter activity
      and lowered target gene expression, supporting reclassification.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    type: missense_variant
    evidence:
    - reference: PMID:39261511
      reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "the allele frequency of p.(Arg382Cys) variant is 0.007065 among East Asian while the allele frequency among all ethnicities is 0.002095, according to the Genome Aggregation Database (gnomAD) v.4.1.0"
      explanation: >-
        The population frequency that drove the VUS classification, with the population
        it applies to stated.
    - reference: PMID:39261511
      reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: "we obtained additional evidence of PS3_supporting, permitting the reclassification as a 'warm VUS'"
      explanation: >-
        The authors' own conclusion, which stops short of likely pathogenic - worth
        recording precisely rather than rounding up to pathogenic.
  - name: c.397+2T>G
    description: >-
      Canonical donor splice-site variant found in trans with p.Arg382Cys in a Korean
      family. A minigene assay showed it skips exon 4, producing a premature stop codon
      and nonsense-mediated decay, confirmed by cycloheximide stabilisation of the
      transcript in patient cells.
    clinical_significance: PATHOGENIC
    type: splice_donor_variant
    evidence:
    - reference: PMID:39261511
      reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: "The treatment resulted in the stabilization of ESRRB mRNA, suggesting that the reduction in ESRRB mRNA is dependent on the NMD pathway"
      explanation: >-
        Cycloheximide rescue of the transcript, which is what turns the predicted NMD into
        a measured one.
  - name: p.R291L
    description: >-
      Homozygous missense allele in a consanguineous Czech family, and one of the two
      DFNB35 families in which dental caries was assessed.
    type: missense_variant
    evidence:
    - reference: PMID:22951369
      reference_title: "DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "Mutation p.R291L in a homozygous state was found in the deaf child, the parents were heterozygous."
      explanation: The allele and its segregation.
  - name: p.Y305H
    description: Novel missense ligand-binding-domain allele in a Tunisian ARNSHL family.
    type: missense_variant
    evidence:
    - reference: PMID:21802533
      reference_title: "A novel missense mutation in the ESRRB gene causes DFNB35 hearing loss in a Tunisian family."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: "Molecular modeling showed that the p.Y305H mutation is likely to alter the conformation of the ligand binding-site by destabilizing the coactivator binding pocket."
      explanation: >-
        The mechanistic argument is modelling rather than assay, so it is graded
        COMPUTATIONAL and INDIRECT. The clinical evidence for the allele is the family
        segregation reported alongside it.
  - name: p.G167R (c.499G>A)
    description: >-
      Novel homozygous missense allele in exon 5, in the DNA-binding domain, segregating
      with hearing loss in a consanguineous Iranian family of Azeri Turkish ethnicity.
      Classified by ACMG/AMP criteria and in silico prediction rather than by a functional
      assay.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:35101039
      reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "A novel homozygous missense mutation, c.499G>A (p.G167R), was identified in exon 5 of the ESRRB (estrogen-related receptor beta) gene."
      explanation: The allele, its zygosity and its exon.
    - reference: PMID:35101039
      reference_title: "A novel missense variant in ESRRB gene causing autosomal recessive non-syndromic hearing loss: in silico analysis of a case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "Healthy and affected family members confirmed the co-segregation of the variant with ARNSHL."
      explanation: >-
        Segregation, which is the clinical evidence for the allele. The paper's own
        pathogenicity argument beyond that is in silico, as its title says.
  - name: p.Tyr295Cys
    description: >-
      Novel missense allele reported in a Tunisian hearing-impairment panel study,
      independent of the earlier Tunisian p.Y305H family.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:34194829
      reference_title: "Novel pathogenic mutations and further evidence for clinical relevance of genes and variants causing hearing impairment in Tunisian population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "five novel variants including three missense (ESRRB-Tyr295Cys, MYO15A-Phe2089Leu and MYO7A-Tyr560Cys)"
      explanation: Reports the ESRRB allele among the novel pathogenic variants in this cohort.
  - name: c.787+1G>A
    description: >-
      Novel homozygous splicing donor-site variant in a consanguineous Pakistani family
      with prelingual nonsyndromic hearing loss.
    type: splice_donor_variant
    evidence:
    - reference: PMID:33269433
      reference_title: "Homozygous mutations in Pakistani consanguineous families with prelingual nonsyndromic hearing loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "two splicing donor site mutations of c.787+1G>A in ESRRB (DFNB35) and c.637+1G>T in CABP2 (DFNB93)"
      explanation: Names the allele and assigns it to DFNB35.
  evidence:
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In a large consanguineous family of Turkish origin, genome-wide homozygosity mapping revealed a locus for recessive nonsyndromic hearing impairment on chromosome 14q24.3-q34.12."
    explanation: The mapping that led to ESRRB, and the chromosomal location.
diagnosis:
- name: Genetic testing for biallelic ESRRB variants
  description: >-
    DFNB35 has no distinguishing audiometric, imaging or vestibular signature - the Korean
    proband's temporal bone CT and internal acoustic canal MRI were both normal - so the
    diagnosis is molecular. In practice ESRRB is reached through a multigene deafness panel
    or exome sequencing after GJB2 has been excluded, and the diagnostic difficulty is
    variant interpretation rather than variant detection: several reported ESRRB coding
    variants found homozygous in deaf patients were subsequently judged polymorphisms, and
    the recurrent p.Arg382Cys allele is frequent enough in East Asians to trip a
    stand-alone benign criterion.
  evidence:
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Neither temporal bone computed tomography (CT) nor internal acoustic canal magnetic resonance imaging (MRI) revealed any anomalies within the inner ear"
    explanation: >-
      Normal inner ear imaging in a molecularly confirmed patient, which is why imaging
      does not make this diagnosis.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "At this stage, based on the ACMG-AMP guideline, the p.(Arg382Cys) variant was classified as VUS, evidenced by PM3, PP3, and BA1"
    explanation: >-
      The concrete form the interpretation problem takes: a real DFNB35 allele carrying a
      stand-alone benign criterion.
  - reference: PMID:22951369
    reference_title: "DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Homozygosity mapping is a powerful method for identification of genes in heterogeneous recessive diseases."
    explanation: >-
      The method by which DFNB35 families have historically been found. Indirect: it
      describes gene discovery in consanguineous pedigrees rather than diagnostic testing
      of an individual patient.
treatments:
- name: Cochlear Implantation
  description: >-
    The standard intervention for severe-to-profound sensorineural hearing loss, and the
    only one with any DFNB35-relevant outcome data. That data is thin and should not be
    overstated: in a study designed to find genetic causes of *poor* implant outcome, an
    ESRRB variant appeared among the matched controls with good outcomes rather than among
    the cases, alongside five other genes. A single ESRRB child also appears in a series of
    genetically characterised implant candidates undergoing vestibular testing. Neither
    study reports ESRRB-specific implant performance, and neither has a DFNB35 denominator.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Bilateral Sensorineural Hearing Impairment
    treatment_effect: BYPASSES
    description: >-
      A cochlear implant bypasses the lateral wall and the hair cell by stimulating the
      spiral ganglion directly, so a failure of strial secretion is in principle a favourable
      substrate for it. That argument is weaker than it first looks and should not be stated
      as though the neural element were known to be spared: the 2008 gene-discovery paper
      localises ERR-beta not only to the stria but to nerve fibres and spiral-ganglion cells,
      which are the implant's own target. Whether the ganglion is functionally intact in
      DFNB35 has never been tested. BYPASSES records the anatomical relationship between the
      device and the curated lesion, not a prediction of outcome.
  evidence:
  - reference: PMID:26166082
    reference_title: "Identifying Children With Poor Cochlear Implantation Outcomes Using Massively Parallel Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Mutations in the WFS1, GJB3, ESRRB, LRTOMT, MYO3A, and POU3F4 genes were detected in 7 (23%) of the 30 matched controls."
    explanation: >-
      ESRRB appears in the good-outcome control group of a poor-outcome study, not in the
      cases. Indirect and deliberately weak: this is six genes pooled across seven
      children, so it is consistent with implantation working in DFNB35 but is not an
      ESRRB outcome result.
  - reference: PMID:34744965
    reference_title: "Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic and Syndromic Genetic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The most common cause of non-syndromic HL was due to mutations in GJB2 (n = 13) followed by MYO15A (3), MYO6 (2), POU3F4 (2), TMPRSS3 (1), CDH23 (1), TMC1 (1), and ESRRB (1)."
    explanation: >-
      Places one ESRRB child in a cochlear implant candidate cohort, establishing that
      DFNB35 patients do reach implantation. It reports no outcome for that child.
  notes: >-
    No TreatmentEffectEnum value is asserted at the entry level and no efficacy claim is
    made, because none of the cited sources reports a DFNB35 implant outcome. The
    mechanism link is graded BYPASSES on anatomical grounds - the implant does not act on
    the stria at all - rather than on measured benefit in this disease.
- name: Hearing Aids and Auditory Rehabilitation
  description: >-
    Amplification with conventional hearing aids, together with auditory and speech-language
    rehabilitation and educational support, is the first step in managing prelingual
    sensorineural hearing loss and is what most DFNB35 patients receive before a cochlear
    implant is considered. It is recorded because it is the standard of care, not because
    anything DFNB35-specific supports it.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory rehabilitation with amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  notes: >-
    Carries no evidence item and no target_mechanisms link, deliberately. No DFNB35 patient
    has had an amplification outcome reported, and the general hearing-aid literature has a
    denominator that is not this disease. Note also that most reported DFNB35 patients are
    severe-to-profound, which is the range where amplification is least likely to suffice and
    implantation becomes the question - so the treatment is listed for completeness rather
    than as the expected answer. `treatment_term` is bound to the Rehabilitation action with
    the device carried as a qualifier, because NCIT has no clinical-action term for hearing
    aid usage.
- name: Dental caries surveillance and prevention
  description: >-
    A plausible, unproven addition to routine care, recorded because the ESRRB caries
    association was proposed by its authors as an actionable one. The proposal is explicitly
    conditional in the source, and no DFNB35 preventive study has been done.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

  mechanism_confidence: ESTABLISHED
  description: >-
    Nr3b2-null mouse strial marginal cells partially acquire the identity of neighboring Pendrin-expressing
    epithelial cells. This is a partial fate transformation, not evidence that every marginal cell
    disappears or becomes an identical mature neighboring cell.

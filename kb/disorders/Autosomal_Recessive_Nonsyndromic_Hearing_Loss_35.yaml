  description: >-
    The defining and, so far, only consistently reported feature. Every DFNB35 patient described
    has sensorineural rather than conductive or mixed loss, which is what the lateral wall localisation
    of the lesion predicts.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment

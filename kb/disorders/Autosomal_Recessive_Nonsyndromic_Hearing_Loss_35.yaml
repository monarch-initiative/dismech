- name: Increased Dental Caries Experience
  category: Dental
  description: >-
    In Turkish family TR-21, all six homozygous affected relatives and four heterozygous relatives
    with available dental histories were reported to have severe caries; five noncarriers were caries-free
    or had low caries experience. In the Czech p.Arg291Leu family, the affected four-year-old child
    was caries-free in the primary dentition, while the mother and maternal grandfather had high
    caries experience. Histories were collected by telephone, and age, access to dental care and
    other environmental factors limit causal interpretation.

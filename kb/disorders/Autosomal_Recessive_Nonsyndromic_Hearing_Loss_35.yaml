name: Autosomal Recessive Nonsyndromic Hearing Loss 35
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNB35
- deafness, autosomal recessive 35
- deafness, autosomal recessive type 35
- autosomal recessive deafness 35
- autosomal recessive nonsyndromic deafness 35
- autosomal recessive nonsyndromic deafness type 35
- ESRRB autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in ESRRB
description: >-
  DFNB35 is autosomal recessive bilateral sensorineural hearing loss caused by biallelic pathogenic
  variants in ESRRB, encoding the orphan nuclear receptor ERR-beta (NR3B2). Reported families usually
  have prelingual severe-to-profound loss, although moderate severity, asymmetry and progression
  occur. The reported missense predominance does not establish residual function for every allele.
  The recurrent p.Arg382Cys variant impaired protein stability and reporter activity in cultured
  cells but remained a variant of uncertain significance in the 2024 study.

  Mouse loss-of-function experiments implicate defective strial marginal-cell differentiation and
  ion-transporter expression, with secondary intermediate-cell and capillary abnormalities. Developmental
  mouse RNA localization and postnatal rat immunohistochemistry also place ESRRB in nonsensory and
  neural cochlear compartments. Absent otoacoustic emissions in two affected Turkish relatives support
  outer-hair-cell dysfunction; the proposed secondary origin is inferred from rodent expression rather
  than demonstrated in human cochlear tissue.

  Vestibular findings vary across small reports: two Turkish adults had normal caloric testing, whereas
  a pediatric implant-candidate series reported abnormal cervical vestibular evoked myogenic potentials
  in its one ESRRB-associated case. Severe caries was reported in affected and heterozygous members
  of a Turkish family, whereas the affected Czech child was caries-free at age four. Its frequency
  and an ESRRB-specific enamel mechanism remain uncertain.


name: Autosomal Recessive Nonsyndromic Hearing Loss 35
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNB35
- deafness, autosomal recessive 35
- deafness, autosomal recessive type 35
- autosomal recessive deafness 35
- autosomal recessive nonsyndromic deafness 35
- autosomal recessive nonsyndromic deafness type 35
- ESRRB autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in ESRRB
description: >-
  DFNB35 is bilateral sensorineural hearing loss caused by biallelic variants in ESRRB,
  which encodes the orphan nuclear receptor oestrogen-related receptor beta (ERR-beta,
  NR3B2). Most reported patients have prelingual, symmetrical, severe-to-profound loss;
  the small number of families described means that statement rests on roughly twenty
  pedigrees rather than on a cohort.

  The interesting thing about DFNB35 is where the lesion is not. Most recessive
  nonsyndromic deafness genes act inside the hair cell - on the stereocilium, the
  mechanotransduction channel, the tip link, or the synapse. ESRRB does not. It is a
  transcription factor expressed in the endolymph-producing cells of the inner ear: the
  strial marginal cells of the cochlea and the vestibular dark cells of the ampulla and
  utricle. In the mouse, Nr3b2-null strial marginal cells fail to switch on a whole
  programme of ion channel and transporter genes and drift partway toward the fate of the
  neighbouring Pendrin-expressing epithelium; secondary changes appear in the underlying
  intermediate cells and the strial capillary bed is locally lost. The mechanism this
  entry curates is therefore a fate and secretory-programme failure in the cochlear
  lateral wall, upstream of anything the hair cell does, in the same compartment that
  KCNQ1, KCNE1 and SLC12A2 lesions damage from the transport side.

  The human alleles are mostly missense and mostly hypomorphic rather than null. Of the
  coding variants reported to date, all but one sit in either the DNA-binding domain or
  the ligand-binding domain, and no clear genotype-phenotype correlation separates the
  two. Two alleles have been taken apart functionally: a canonical splice variant that
  skips exon 4 and is degraded by nonsense-mediated decay, and p.Arg382Cys, which is
  common enough in East Asian populations to have been filed as a variant of uncertain
  significance and which turns out to destabilise the protein, abolish its transcriptional
  output in a reporter assay, and lower the expression of ESRRB target genes in
  patient-derived cells. That work is the closest thing DFNB35 has to a molecular
  mechanism measured in human material.

  Two caveats are worth carrying. First, "nonsyndromic" may be doing more work than it
  should: ESRRB is expressed in secretory-stage ameloblasts, and the two DFNB35 families
  examined for it had markedly more dental destruction by caries than their unaffected
  relatives. Second, no *quantitative* auditory readout - an ABR
  threshold, a DPOAE, an endocochlear potential - has been reported for any Esrrb mouse, so
  the step from a failed strial secretory programme to a human audiogram is calibrated by
  inference from the compartment rather than measured in this gene. A behavioural hearing and
  balance phenotype in rescued and conditional-null Esrrb animals is described in the
  discussion of the 2008 gene-discovery paper, which reaches this knowledge base only as an
  abstract, so the observation is acknowledged here rather than curated as an evidence item.

    microhardness experiments suggest a locus-level effect, but neither reduced ESRRB activity nor
    abnormal enamel formation was measured in DFNB35 patients. The two reported pedigrees include
    severe caries in Turkish homozygotes and heterozygotes and a caries-free Czech affected child.

- name: Proposed ESRRB-Related Enamel Susceptibility
  biological_scale: CELLULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Mouse Esrrb expression in secretory-stage ameloblasts provides a possible anatomical basis for

animal_models:
- name: Nr3b2 (Esrrb) null mouse, including genetically mosaic animals
  species: Mouse
  genotype: Nr3b2(-/-); mosaic Nr3b2(-/-) inner ear epithelium
  publication: PMID:17765677
  description: >-
    The model that established what ERR-beta does in the inner ear. Because germline
    Nr3b2 loss is not compatible with normal development, the informative experiments are
    on the inner ear epithelium and on genetically mosaic animals in which null marginal
    cells sit beside wild-type ones - which is what makes the non-cell-autonomous effects
    on intermediate cells and capillaries interpretable.
  modeled_mechanisms:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse defines this node rather than merely supporting it: loss of the secretory
      gene programme and partial fate conversion of strial marginal cells are the mouse
      results the human mechanism is read from.
    limitations: >-
      A null allele, whereas most human DFNB35 alleles are missense and hypomorphic, so the
      mouse is the severe end of the human spectrum. The cached record reports cell fate,
      gene expression and vascular findings only; no quantitative auditory measurement - ABR
      threshold, DPOAE or endocochlear potential - is available from it, so this model cannot
      close the loop to hearing loss. A behavioural hearing and balance phenotype has been
      described for rescued and conditional-null Esrrb animals elsewhere in the literature;
      it is not quotable from the caches available here and is not what this link claims.
    readouts:
    - name: Expression of strial marginal cell ion channel and transporter genes
      target: Failure of the Strial Marginal Cell Secretory Programme
      direction: DECREASED
      interpretation: >-
        The secretory gene programme is not switched on, which is the definition of this
        node.
      evidence:
      - reference: PMID:17765677
        reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "Nr3b2(-/-) strial marginal cells fail to express multiple ion channel and transporter genes"
        explanation: The direct measurement of the transcriptional readout in null marginal cells.
    - name: Marginal cell identity relative to adjacent Pendrin-expressing epithelium
      target: Failure of the Strial Marginal Cell Secretory Programme
      direction: ALTERED
      interpretation: >-
        Fate conversion rather than simple loss of function. ALTERED rather than DECREASED
        because the cells acquire a different identity rather than losing one along an axis.
      evidence:
      - reference: PMID:17765677
        reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "they show a partial transformation toward the fate of the immediately adjacent Pendrin-expressing epithelial cells"
        explanation: The fate-conversion measurement.
    evidence:
    - reference: PMID:17765677
      reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "an orphan nuclear receptor, is specifically expressed in and controls the development of the endolymph-producing cells of the inner ear"
      explanation: >-
        Establishes that this model is informative for the marginal cell node by showing
        the gene acts in exactly those cells.
  - target: Impaired Endolymph Production and Cochlear Lateral Wall Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse shows the stria failing as a multilayer unit - marginal cell defect plus
      secondary intermediate cell changes plus capillary loss - which is the tissue-level
      claim. It does not show the fluid consequence.
    limitations: >-
      PARTIALLY_RECAPITULATES because the structural and transcriptional halves of this
      node are demonstrated while the functional half is not: no endolymph volume,
      endolymphatic potassium concentration or endocochlear potential measurement is
      reported in the cached record, and no hearing threshold is reported either. The
      node's name asserts impaired endolymph production; the mouse establishes the loss of
      the apparatus that produces it.
    readouts:
    - name: Strial capillary density adjacent to null marginal cells
      target: Impaired Endolymph Production and Cochlear Lateral Wall Failure
      direction: DECREASED
      interpretation: >-
        Non-cell-autonomous failure of the strial vascular bed, which is why the lesion is
        tissue-level rather than confined to one cell type.
      evidence:
      - reference: PMID:17765677
        reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "Nr3b2(-/-) strial marginal cells produce secondary alterations in gene expression in the underlying intermediate cells and a local loss of strial capillaries."
        explanation: >-
          The mosaic experiment reporting both the intermediate cell and capillary
          consequences.
    evidence:
    - reference: PMID:17765677
      reference_title: "Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph production by the stria vascularis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "A systematic comparison of transcripts in the WT versus Nr3b2(-/-) stria vascularis has identified a set of genes that is likely to play a role in the development and/or function of endolymph-producing epithelia."
      explanation: >-
        Supports treating the model as informative for the tissue-level node. Indirect
        because the sentence describes candidate genes likely to matter, not a measured
        endolymph phenotype.
discussions:
- discussion_id: dfnb35_strial_failure_to_threshold
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Endolymph Production and Cochlear Lateral Wall Failure
  prompt: >-
    Does loss of ERR-beta actually raise hearing thresholds in a mouse, and by how much?
  rationale: >-
    Every step of the DFNB35 mechanism from the gene to the stria vascularis is measured,
    in mouse and in patient-derived cells. The last step - from a failed strial secretory
    programme to a *quantified* elevation of auditory threshold - is not. Rescued and
    conditional-null Esrrb animals are reported to have a behavioural hearing and balance
    phenotype, so the direction is not in doubt; what is missing is a number. No ABR
    threshold, DPOAE or endocochlear potential has been published for any Esrrb genotype,
    which means the magnitude of the deficit, its frequency profile and its dependence on
    allele dose are all unknown. The size of the step is currently supplied by inference from
    the compartment: KCNQ1, KCNE1 and SLC12A2 lesions in the same cells cause profound
    deafness, and a Tbx1 mouse with an undeveloped stria vascularis is deaf. That is a strong
    prior and very probably right, but the inference is doing real work and should not be
    hidden inside the pathograph. Two features of the human disease make it
    worth testing rather than assuming: most human alleles are hypomorphic missense rather
    than null, so the human phenotype may sit at a different point on a dose-response
    curve than a knockout; and no reported DFNB35 patient has documented vestibular
    dysfunction despite ERR-beta acting equally in vestibular dark cells, which is not what
    a straightforward secretory-failure model predicts.
  proposed_experiments:
  - experiment_id: dfnb35_exp_abr_ep_conditional_ko
    name: Auditory brainstem response and endocochlear potential in a conditional Esrrb inner-ear knockout
    description: >-
      Measure ABR thresholds, DPOAEs and the endocochlear potential in mice with Esrrb
      deleted in the inner ear epithelium, and repeat in a knock-in carrying a human
      missense allele such as p.Arg382Cys to test whether a hypomorph reproduces the
      human severity.
    would_support:
    - pathophysiology#Impaired Endolymph Production and Cochlear Lateral Wall Failure
    supporting_outcome:
    - >-
        Elevated ABR thresholds together with a reduced endocochlear potential and reduced
        endolymphatic potassium, with the missense knock-in showing an intermediate deficit.
    would_refute:
    - pathophysiology#Impaired Endolymph Production and Cochlear Lateral Wall Failure
    refuting_outcome:
    - >-
        Normal endocochlear potential and normal ABR thresholds despite the documented
        marginal cell fate defect, which would mean the fate conversion is compensated and
        the deafness arises somewhere else.
- discussion_id: dfnb35_is_it_really_nonsyndromic
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Increased Dental Caries Experience
  prompt: >-
    Is DFNB35 actually nonsyndromic, or is it a deafness-plus-enamel-susceptibility
    disorder that has been assessed for teeth in only two families?
  rationale: >-
    ESRRB is expressed in secretory-stage ameloblasts and the two DFNB35 families examined
    for dental disease both showed markedly more caries in mutation carriers. No other
    DFNB35 report mentions teeth at all - not because they were normal, but because they
    were not looked at. The disease name, the MONDO label and the OMIM entry all say
    nonsyndromic, so the negative is being carried by nomenclature rather than by data.
    A dental examination of the existing Pakistani, Tunisian and Korean pedigrees would
    settle it cheaply, and the answer changes counselling.
  proposed_experiments:
  - experiment_id: dfnb35_exp_dmft_pedigrees
    name: DMFT scoring in reported DFNB35 pedigrees
    description: >-
      Score decayed, missing and filled teeth in affected homozygotes, heterozygous
      relatives and unaffected relatives across the reported DFNB35 families, controlling
      for age and access to dental care, which is the obvious confounder in consanguineous
      cohorts from different countries.
    would_support:
    - phenotypes#Increased Dental Caries Experience
    supporting_outcome:
    - >-
        Higher DMFT in biallelic carriers than in their unaffected relatives across multiple
        independent pedigrees.
    would_refute:
    - phenotypes#Increased Dental Caries Experience
    refuting_outcome:
    - >-
        No DMFT difference between biallelic carriers and relatives once age and dental
        access are matched, which would make the two-family observation a confound of
        socioeconomic ascertainment.
- discussion_id: dfnb35_absent_vestibular_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#
  notes: >-
    The bare `phenotypes#` anchor is deliberate and not a truncated reference. The subject of
    this discussion is a phenotype that is absent from the entry, so there is no individual
    item to name and the whole section is the correct target.
  prompt: >-
    Why do Esrrb mice circle and toss their heads while reported DFNB35 patients have no
    described vestibular disease?
  rationale: >-
    This is a species discordance, not merely an untested absence, and that is the sharper
    way to hold it. The mouse result that anchors this entry names two cell types and the
    vestibular dark cell is one of them; rescued and conditional-null Esrrb animals are
    reported to show balance abnormalities, circling and head tossing, and balance disease is
    described as more prominent in the mouse than in reported humans. Diseases of the same
    compartment - Jervell and Lange-Nielsen, SLC12A2-related disease - commonly involve
    balance in patients too. Yet no DFNB35 report describes vestibular symptoms or areflexia,
    and the one DFNB35 child in a series that performed routine preoperative vestibular
    testing is not individually reported. Three readings are open and the available data do
    not separate them: human hypomorphic missense alleles may spare the dark cell where a
    mouse null does not; the vestibular system may compensate in humans; or nobody has
    looked, because a child referred for prelingual deafness is not routinely tested for
    balance. The entry therefore carries no vestibular phenotype, and the absence should be
    read as unexamined in humans rather than as evidence of a cochlea-restricted lesion.
  proposed_experiments:
  - experiment_id: dfnb35_exp_vestibular_testing
    name: Vestibular testing in molecularly confirmed DFNB35 patients
    description: >-
      Video head impulse testing, cervical and ocular VEMPs and caloric testing in
      biallelic ESRRB patients, who are largely already in contact with cochlear implant
      programmes where such testing is routine.
    would_support:
    - pathophysiology#Failure of the Strial Marginal Cell Secretory Programme
    supporting_outcome:
    - >-
        Reduced VEMP responses or caloric hypofunction in a substantial fraction of DFNB35
        patients, which would extend the dark cell arm of the mechanism into the clinic.
    would_refute:
    - pathophysiology#Failure of the Strial Marginal Cell Secretory Programme
    refuting_outcome:
    - >-
        Normal vestibular function across a series of DFNB35 patients, which would mean the
        dark cell arm of the mouse mechanism does not translate and the human lesion is
        cochlea-restricted.
notes: >-
  Curated as a DISEASE rather than a SUBTYPE or GROUPING. DFNB35 is a single-gene recessive
  disorder with one conserved pathograph running from ESRRB loss through a strial marginal
  cell fate defect to sensorineural hearing loss, which is a different mechanism from the
  hair-cell and stereocilium lesions that dominate the other DFNB entries, so it does not
  fold into a parent as a subtype. The knowledge base already carries several standalone
  ARNSHL entries on the same pattern.

  Two entries curate the same cochlear compartment from the transport side rather than the
  cell-fate side and are the right comparison reading: `Jervell_and_Lange-Nielsen_Syndrome_1`
  (KCNQ1/KCNE1, the apical potassium channel of the marginal cell) and
  `Delpire-McNeill_Syndrome` (SLC12A2/NKCC1, its basolateral cotransporter). In those diseases
  the secretory machinery is built and broken; in DFNB35 it is never built. That is the
  distinction the pathophysiology descriptions are drawing, and it is why this entry does not
  simply reuse their node chain.

  **The supporting-cell and neural branch, considered and scoped out.** The 2008
  gene-discovery paper's expression work is broader than the stria: it localises ERR-beta to
  organ-of-Corti supporting cells, spiral ligament, spiral limbus and basilar-membrane
  mesothelial cells, nerve fibres and spiral-ganglion cells, and reports it *absent* from
  inner and outer hair cells. It also reports absent transient-evoked otoacoustic emissions
  in the founding Turkish pedigree. Those two facts fit together and are load-bearing for the
  model this entry curates - absent emissions read as secondary outer-hair-cell failure
  precisely because ERR-beta is not in the hair cell - so a second, supporting-cell and neural
  branch of the mechanism is a real candidate. It is not modelled here for an evidential
  reason rather than an editorial one: all of that detail sits in the full text of a paper
  that reaches this knowledge base only as an abstract, so none of it is snippet-quotable, and
  a pathograph branch built on unquotable claims is worse than an acknowledged omission. If
  the full text becomes available, the branch to add is a node for ERR-beta in cochlear
  supporting and neural compartments, an absent-otoacoustic-emissions phenotype, and an edge
  marking the emissions as secondary rather than primary.

  This branch is not merely a missing node; it bears on a treatment claim. A cochlear implant
  works by stimulating the spiral ganglion, and ERR-beta is reported in spiral-ganglion cells
  and nerve fibres. The implant's `BYPASSES` link is therefore worded to record the
  anatomical relationship between the device and the lesion this entry curates, and
  explicitly not to assert that the neural target is spared - because on this expression
  evidence it may not be, and nobody has tested it.

  For the same reason the `genetic` variant list is not the complete DFNB35 allelic spectrum.
  It holds the nine alleles for which a cached source supplies a quotable sentence; the 2024
  synthesis counts twenty-two distinct variants. At least one further allele reported in the
  founding paper, an in-frame deletion in a Pakistani pedigree, is described only in that
  paper's full text, and the precise protein-level name of the seven-base-pair duplication is
  likewise not in the cached abstract, which is why that variant is named at the cDNA level
  here.

  What is deliberately not curated: no progression section, because no DFNB35 series
  reports longitudinal thresholds beyond the single Korean proband; no
  differential_diagnoses section, because the differential for prelingual severe-to-profound
  ARNSHL is the whole DFNB gene list and naming a few would be arbitrary; no vestibular
  phenotype, for the reason given in the third discussion; and no clinical_trials, datasets
  or environmental sections, for which nothing DFNB35-specific was found.

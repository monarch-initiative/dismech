genetic:
- name: ESRRB
  notes: >-
    Estrogen-related receptor beta, an orphan nuclear receptor at 14q24.3. Biallelic variants cause
    DFNB35. The reported alleles concentrate in the two functional domains - the DNA-binding domain
    and the ligand-binding domain - and are predominantly missense. The gene has a second, unrelated
    life as a core pluripotency transcription factor in embryonic stem cells, which is why searching
    the gene name returns mostly stem-cell and breast-cancer literature rather than deafness literature.
  gene_term:
    preferred_term: ESRRB
    term:
      id: hgnc:3473
      label: ESRRB
  relationship_type: CAUSATIVE
  variants:
  - name: c.1018_1024dupGAGTTTG (p.Val342GlyfsTer44)
    description: >-
      Homozygous seven-base-pair exon-8 duplication in Turkish family TR-21, reported relative to
      NM_004452. The predicted frameshift is p.Val342GlyfsTer44 (original notation p.V342GfsX44).
      The original study proposed nonsense-mediated decay or a truncated protein lacking an intact
      ligand-binding domain; it did not distinguish these experimentally.
    type: frameshift_variant
    evidence:
    - reference: PMID:18179891
      reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        This duplication results in a frame shift and premature stop codon.
      explanation: >-
        The predicted consequence of the founding allele.
    - reference: PMID:18179891
      reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Sequence analysis of ESRRB in an affected individual of family TR-21 revealed a 7 bp duplication
        in exon 8
      explanation: >-
        The full text assigns c.1018_1024dupGAGTTTG and predicts p.V342GfsX44.
  - name: p.A110V, p.L320P, p.V342L, p.L347P
    description: >-
      The four missense alleles found in the original DFNB35 family and in three DFNB35-linked consanguineous
      Pakistani families. p.A110V is in the DNA-binding domain; the other three are in the ligand-binding
      domain.
    type: missense_variant
    evidence:
    - reference: PMID:18179891
      reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        one of the substitutions (p.A110V) is located in the DNA-binding domain of ESRRB, whereas
        the other three are substitutions (p.L320P, p.V342L, and p.L347P) located within the ligand-binding
        domain
      explanation: >-
        Names the four alleles and their domain assignments, which is the origin of the DBD/LBD split
        that still describes the spectrum.
  - name: p.Arg382Cys (c.1144C>T)
    description: >-
      Recurrent ligand-binding-domain variant classified as uncertain in the 2024 study. The study
      reported gnomAD v4.1.0 allele frequencies of 0.007065 in East Asians and 0.002095 overall.
      Protein-stability, reporter and family-cell experiments added PS3-supporting evidence, leading
      the authors to call it a warm VUS; it was not upgraded to likely pathogenic or pathogenic.
      A hypomorphic effect in trans with a loss-of-function allele was proposed but not established
      by an in vivo model.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    type: missense_variant
    evidence:
    - reference: PMID:39261511
      reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        the allele frequency of p.(Arg382Cys) variant is 0.007065 among East Asian while the allele
        frequency among all ethnicities is 0.002095, according to the Genome Aggregation Database
        (gnomAD) v.4.1.0
      explanation: >-
        The population frequency that drove the VUS classification, with the population it applies
        to stated.
    - reference: PMID:39261511
      reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        we obtained additional evidence of PS3_supporting, permitting the reclassification as a 'warm
        VUS'
      explanation: >-
        The authors' own conclusion, which stops short of likely pathogenic - worth recording precisely

- name: Severe to Profound Hearing Impairment
  category: Auditory
  description: >-
    Most reported patients fall at the severe-to-profound end. The exception is instructive: the
    Korean proband had moderate loss in one ear and severe-to-profound in the other, and the milder
    ear then deteriorated over seventeen years of follow-up. So severity is not fixed at presentation
    in every patient, and the asymmetric, progressive pattern is documented at least once.

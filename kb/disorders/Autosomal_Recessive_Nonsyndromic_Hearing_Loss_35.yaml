  - reference: PMID:25023176
    reference_title: Role of estrogen related receptor beta (ESRRB) in DFN35B hearing impairment and dental decay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Through experiments that tested the effects of acid dissolution of the enamel surface, we reasoned
      that ESRRB variants contributes to formation of an enamel structure that is more susceptible
      to the acidic effects in- volved in the initiation of dental caries.
    explanation: >-
      The proposed mechanism derives from acid-dissolution experiments on extracted teeth from a
      general orthodontic cohort, not from DFNB35 patient enamel. Reported SNP associations did not

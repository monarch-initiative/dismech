inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic ESRRB variants. Most reported pedigrees are consanguineous and homozygous -
    Turkish, Pakistani, Tunisian, Czech - with unaffected heterozygous parents. The
    compound heterozygous configuration is the exception and has been documented in a
    Korean family and a Han Chinese family, both carrying p.Arg382Cys in trans with a
    second allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18179891
    reference_title: "Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Mutation analysis of ESRRB, a candidate gene in the overlapping region, revealed a homozygous 7 bp duplication in exon 8 in all affected individuals."
    explanation: >-
      Homozygosity in every affected member of the consanguineous Turkish family that
      defined the gene, which is the recessive pattern.
  - reference: PMID:22951369
    reference_title: "DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Mutation p.R291L in a homozygous state was found in the deaf child, the parents were heterozygous."
    explanation: >-
      Segregation in the Czech family: homozygous in the affected child, heterozygous and
      unaffected in both parents.
  - reference: PMID:39261511
    reference_title: "Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Consequently, the majority of reported cases exhibited homozygous zygosity except the p.(Arg382Cys) variant, which presented as a compound heterozygous variant in trans with either c.16A>G in a Han Chinese family or c.397 + 2T>G in a South Korean family."
    explanation: >-
      States the zygosity distribution across the whole reported literature, and names the
      two compound heterozygous exceptions.
pathophysiology:
- name: ESRRB Loss of Function
  biological_scale: MOLECULAR
  role: initiator
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic ESRRB variants impair the function of an orphan nuclear-receptor transcription factor.
    Reported alleles include missense substitutions in the DNA-binding and ligand-binding domains,
    frameshift, nonsense, splice and in-frame variants. The founding c.1018_1024dupGAGTTTG allele
    predicts p.Val342GlyfsTer44; nonsense-mediated decay or an abnormal truncated protein were alternative
    hypotheses in the original paper. Exon-4 skipping and transcript stabilization by cycloheximide
    support nonsense-mediated decay for c.397+2T>G. Missense status alone does not establish a hypomorphic
    effect, and residual function has not been measured across the allelic spectrum.
  genes:
  - preferred_term: ESRRB
    term:
      id: hgnc:3473
      label: ESRRB
  molecular_functions:
  - preferred_term: ERR-beta nuclear receptor transcription factor activity
    term:
      id: GO:0004879
      label: nuclear receptor activity
    modifier: DECREASED
  downstream:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    causal_link_type: DIRECT
    description: >-
      ERR-beta is the transcription factor that installs and maintains the endolymph secretory programme
      in strial marginal cells, so reduced ERR-beta activity is read out directly as failure of that
      programme.
  - target: Partial Marginal Cell Fate Transformation
    causal_link_type: DIRECT
    description: >-
      Null marginal cells partially shift epithelial identity in the mouse model.
  - target: Secondary Strial Intermediate Cell Expression Changes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of Nr3b2 in marginal cells produces a non-cell-autonomous intermediate-cell response in
      mosaic mice.
  - target: Local Strial Capillary Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mosaic null marginal-cell regions show local capillary loss; the intervening signal is unresolved.
  - target: Reduced Stability of ESRRB Arg382Cys Protein
    causal_link_type: DIRECT
    description: >-
      The p.Arg382Cys allele specifically reduced protein stability in overexpression assays; this
      consequence is not assigned to all ESRRB variants.
  evidence:
  - reference: PMID:18179891
    reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Sequence analysis of the ESRRB gene in the affected individuals of the original DFNB35 family
      and in three other DFNB35-linked consanguineous families from Pakistan revealed four missense
      mutations.
    explanation: >-
      Establishes that the founding DFNB35 alleles are predominantly missense rather than truncating.
  - reference: PMID:18179891
    reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: >-
      Molecular modeling of this nuclear receptor showed that the missense mutations are likely to
      affect the structure and stability of these domains.
    explanation: >-
      The original mechanistic argument for these missense alleles was structural modelling, not
      an assay - graded COMPUTATIONAL and INDIRECT for that reason.
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Of the 19 coding variants, all were located in functional domains except for one variant (c.16A>G:p.Arg6Gly).
      Nine were resided in the LBD while the remaining 9 were positioned in the DNA binding domain
      (DBD).
    explanation: >-
      The domain distribution of the reported coding alleles, which is the basis for describing DFNB35
      as a domain-restricted loss of transcription factor function.
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      In alignment with bioinformatics analysis, the c.397 + 2T>G splicing event was observed to
      induce exon 4 skipping, leading to formation of a premature stop codon followed by nonsense-mediated
      decay (NMD).
    explanation: >-
      Minigene assay in HEK293T cells showing that the splice allele produces a transcript destined
      for degradation, which is the truncating end of the spectrum.
  notes: >-
    No ESRRB genotype-phenotype correlation has been established: the 2024 review of the full reported
    spectrum found no significant difference in onset, severity or symmetry between DNA-binding-domain
    and ligand-binding-domain alleles.
- name: Reduced Stability of ESRRB Arg382Cys Protein
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  description: >-
    Overexpressed ESRRB p.Arg382Cys protein had reduced stability in cycloheximide-chase assays in
    HEI-OC1 and HEK293T cells. Nuclear localization was not significantly altered. These assay findings
    do not establish clinical pathogenicity or a shared effect of every ESRRB allele.
  evidence:
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Consistent with molecular modeling and dynamics studies, the stability of the ESRRB p.(Arg382Cys)
      variant was significantly reduced compared to that of the wild-type
    explanation: >-
      Cycloheximide chase showed reduced mutant protein stability in HEI-OC1 and HEK293T cells. Its
      contribution to reduced reporter activity is plausible but was not separated experimentally
      from other functional effects.
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      However, immunocytochemistry data showed that there was no significant difference in the translocation
      ability of ESRRB into the nucleus between the mutant and the wild type
    explanation: >-
      No significant difference in nuclear localization was detected under the tested overexpression
      conditions; this does not exclude every possible trafficking defect.
  downstream:
  - target: Reduced ERR-beta Transcriptional Output at Target Promoters
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced stability is a proposed contributor to lower reporter output; the experiments did not
      isolate it from other effects of the variant.
- name: Reduced ERR-beta Transcriptional Output at Target Promoters
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  description: >-
    ESRRB p.Arg382Cys reduced SMAD7-promoter reporter activation in HEI-OC1 and HEK293T cells. Wild-type
    overexpression produced 2.09-fold and 2.21-fold activity relative to the internal control, whereas
    mutant values of 1.19-fold and 1.24-fold were not significantly different from that control.
    This supports impaired transcriptional output in the assay systems without proving zero residual
    activity or clinical pathogenicity. In family-derived lymphoblastoid cells, ATP1B1 and EGR1 were
    lower in the proband and the unaffected mother than in the father; NRP1, TBX3 and SPARC were
    lower in the proband and father than in the mother. These comparisons do not establish direct
    promoter binding or corresponding changes in the intact inner ear.
  biological_processes:
  - preferred_term: regulation of transcription by ERR-beta at target promoters
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DECREASED
  downstream:
  - target: Failure of the Strial Marginal Cell Secretory Programme
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced transcription of the ion channel, transporter and ATPase genes that constitute the marginal cell secretory programme.
    description: >-
      Reduced transcription of ion-handling genes provides a candidate route from ESRRB dysfunction
      to strial failure. The human-variant reporter and lymphoblastoid experiments did not test marginal-cell
      differentiation or secretion.
  evidence:
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Transient overexpression of the ESRRB wild-type significantly increased luciferase activity,
      demonstrating a 2.09-fold increase relative to the internal control in HEI-OC1 cells (p < 0.01)
      and 2.21-fold in HEK293T cells (p < 0.01). However, the luciferase activity of ESRRB mutant
      did not exhibit a significant deviation from the internal control
    explanation: >-
      Wild-type overexpression activated the SMAD7 reporter; mutant activity was not significantly
      above the internal control. This is not a measurement of complete loss of endogenous transcription.
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      we observed marked decreases in mRNA levels of ATP1B1 and EGR1 (decreased 55.1% and 45.4% respectively)
    explanation: >-
      The reductions of ATP1B1 and EGR1 were measured in proband lymphoblastoid cells relative to
      the father; the unaffected mother also showed reductions. They are not measurements in strial
      tissue.
  notes: >-
    Functional findings remain IN_VITRO. The family-derived cells are lymphoblastoid lines, and HEI-OC1
    cells do not reproduce intact strial development. The study retained p.Arg382Cys as a warm VUS,
    with PS3-supporting functional evidence.
- name: Failure of the Strial Marginal Cell Secretory Programme
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of Nr3b2/Esrrb in mouse strial marginal cells prevents expression of multiple ion-channel
    and transporter genes required for the endolymph-producing epithelial program. ERR-beta also
    acts in vestibular dark cells. This node describes the gene-expression defect; the partial cell-fate
    change and secondary strial effects are modeled separately.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  - preferred_term: vestibular dark cell
    term:
      id: CL:0000846
      label: vestibular dark cell
  biological_processes:

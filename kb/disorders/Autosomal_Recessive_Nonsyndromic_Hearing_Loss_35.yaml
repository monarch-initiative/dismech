  - reference: PMID:18179891
    reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In a large consanguineous family of Turkish origin, genome-wide homozygosity mapping revealed
      a locus for recessive nonsyndromic hearing impairment on chromosome 14q24.3-q34.12.
    explanation: >-
      The mapping that led to ESRRB, and the chromosomal location.

diagnosis:
- name: Genetic testing for biallelic ESRRB variants
  description: >-
    Audiological assessment establishes sensorineural hearing loss, while sequencing and segregation
    analysis evaluate ESRRB as the molecular cause. Normal temporal-bone imaging in reported patients
    does not exclude DFNB35. Variant interpretation remains essential: homozygosity alone does not
    establish pathogenicity, and the recurrent p.Arg382Cys allele remained a VUS after functional
    testing in the 2024 report.
  evidence:
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Neither temporal bone computed tomography (CT) nor internal acoustic canal magnetic resonance
      imaging (MRI) revealed any anomalies within the inner ear
    explanation: >-
      Normal CT and MRI were reported in the Korean proband; this single observation does not establish
      that every DFNB35 patient has normal imaging.
  - reference: PMID:39261511
    reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes to hearing loss (DFNB35).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At this stage, based on the ACMG-AMP guideline, the p.(Arg382Cys) variant was classified as
      VUS, evidenced by PM3, PP3, and BA1
    explanation: >-
      The authors explicitly classified p.Arg382Cys as VUS; their subsequent functional work supplied
      supporting evidence without a likely-pathogenic classification.
  - reference: PMID:22951369
    reference_title: DFNB35 due to a novel mutation in the ESRRB gene in a Czech consanguineous family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Homozygosity mapping is a powerful method for identification of genes in heterogeneous recessive
      diseases.
    explanation: >-
      The method by which DFNB35 families have historically been found. Indirect: it describes gene
      discovery in consanguineous pedigrees rather than diagnostic testing of an individual patient.
- name: Vestibular assessment
  description: >-
    Vestibular function should be interpreted by test and genotype. Two adults in Turkish family
    TR-21 had normal caloric testing. A later pediatric ESRRB-associated case had abnormal cVEMP
    with a normal rotary-chair result. Normal canal testing does not establish normal otolith function.
  evidence:
  - reference: PMID:18179891
    reference_title: Mutations of ESRRB encoding estrogen-related receptor beta cause autosomal-recessive nonsyndromic hearing impairment DFNB35.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For these two individuals, computerized tomography of the temporal bone and caloric testing
      for evaluation of the vestibular function were performed, and no abnormalities were found.
    explanation: >-
      Normal caloric results in two affected Turkish relatives are direct human evidence, with limited
      sample size and vestibular-organ coverage.
  - reference: PMID:34744965
    reference_title: Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      | ESRRB | 0/1 |  | 1/1 |  | 1/1 |
    explanation: >-
      Table 2 reports normal rotary-chair testing (0/1 abnormal), abnormal cVEMP (1/1), and peripheral
      vestibular loss (1/1) in the sole ESRRB-associated case. VHIT and oVEMP entries are blank.
      Column assignments were checked against the published PDF; this selected single case does not
      establish population frequency or laterality.

treatments:
- name: Cochlear Implantation
  description: >-
    Two children with biallelic ESRRB variants were among the good-outcome controls in a 2015 cochlear-implant
    study. Controls were selected for CAP 7 and SIR 5 after more than three years of implant use.
    These are favorable observations in two selected recipients, not an unbiased DFNB35 success rate;
    variant interpretation and individual clinical factors remain relevant. A separate pediatric
    series reports preoperative vestibular testing in one ESRRB-associated child but no individual
    postoperative auditory outcome.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Bilateral Sensorineural Hearing Impairment
    treatment_effect: BYPASSES
    description: >-
      A cochlear implant stimulates auditory nerve fibers and can bypass impaired cochlear sensory
      function. Rodent ESRRB expression in supporting and neural compartments does not establish
      either neural preservation or failure in patients. Two selected ESRRB-associated recipients
      had good outcomes; the mechanism link does not predict benefit for every genotype.
  evidence:
  - reference: PMID:26166082
    reference_title: Identifying Children With Poor Cochlear Implantation Outcomes Using Massively Parallel Sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      2 had bi-allelic mutations in ESRRB
    explanation: >-
      The full text identifies two ESRRB-associated recipients among the good-outcome controls; the
      observation is more specific than the six-gene aggregate in the abstract.
  - reference: PMID:26166082
    reference_title: Identifying Children With Poor Cochlear Implantation Outcomes Using Massively Parallel Sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Thirty unrelated children with good CI performance (CAP score = 7 and SIR score = 5) were selected
    explanation: >-
      These outcome criteria apply to the matched-control group containing the two ESRRB-associated
      children. Outcome-based ascertainment prevents estimating treatment success frequency.
  - reference: PMID:34744965
    reference_title: Peripheral Vestibular Dysfunction Is a Common Occurrence in Children With Non-syndromic and Syndromic Genetic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The most common cause of non-syndromic HL was due to mutations in GJB2 (n = 13) followed by
      MYO15A (3), MYO6 (2), POU3F4 (2), TMPRSS3 (1), CDH23 (1), TMC1 (1), and ESRRB (1).
    explanation: >-
      Places one ESRRB child in a cochlear implant candidate cohort, establishing that DFNB35 patients
      do reach implantation. It reports no outcome for that child.
  notes: >-
    The 2015 study provides favorable outcome observations but no unselected ESRRB cohort, causal
    treatment comparison or variant-independent prognosis. Neural ESRRB expression alone does not
    predict implantation outcome.
- name: Hearing Aids and Auditory Rehabilitation
  description: >-
    Hearing aids, communication support and auditory or speech-language habilitation are individualized
    to residual hearing and family needs. General genetic hearing-loss guidance supports amplification
    for mild-to-severe loss; no ESRRB-specific amplification outcome is established.
  therapeutic_modality: DEVICE

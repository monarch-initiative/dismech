name: Local Anesthetic Systemic Toxicity
creation_date: "2026-09-19T04:30:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Iatrogenic Drug Toxicity
- Anesthetic Complication
synonyms:
- LAST
- local anesthetic poisoning
- local anaesthetic systemic toxicity
- local anesthetic toxicity
description: >-
  Local anesthetic systemic toxicity is an acute drug toxicity that follows an
  excessive plasma concentration of a local anesthetic, usually after
  inadvertent intravascular injection, rapid absorption from a vascular tissue
  bed, or cumulative overdose during regional anesthesia. It affects the two
  tissues whose function depends most on fast sodium currents: the central
  nervous system and the heart.

  The shared molecular action is blockade of voltage-gated sodium channels. In
  the cortex, inhibitory interneurons are silenced before excitatory pathways,
  so the first clinical picture is excitation - perioral numbness, tinnitus,
  agitation, then seizure - and only at higher concentrations does global
  conduction failure produce coma and apnoea. In the heart, blockade of Nav1.5
  slows conduction and sets up reentrant ventricular arrhythmia, while a
  separate mitochondrial action impairs the myocardium's fatty acid fuel
  supply. The two arms converge on cardiovascular collapse.

  Bupivacaine is the prototypical offender, and the reason is pharmacological
  rather than incidental: it accelerates the cardiac sodium channel's entry
  into slow inactivation, so blockade deepens with successive beats. Note that
  use-dependent block is a class property rather than something unique to
  bupivacaine - the electrophysiology paper cited below is explicit that this
  is "consistent with other local anesthetics" - and that the recent mortality
  literature reports lidocaine, not bupivacaine, as the leading reported cause
  of death attributed to this syndrome. Neither observation is curated as a
  claim here; both are reasons the prototypical-offender framing is a
  simplification.

  Treatment is unusual among toxidromes in having a specific antidote,
  intravenous lipid emulsion, whose mechanism remains unsettled. Incidence has
  fallen with ultrasound guidance, and the presentation has shifted: the
  classic progressive sequence described in textbooks fits only about
  three-fifths of published cases.
disease_term:
  preferred_term: local anesthetic poisoning
  term:
    id: MONDO:0100335
    label: local anesthetic poisoning
notes: >-
  **Two incidence figures are carried here and are not reconciled.** A
  multicentre registry of 25,336 peripheral nerve blocks reports 0.87 per 1000
  (`PMID:23788067`); a later review of registries reports 0.27 per 1000 over a
  denominator of 251,325 (`PMID:29303925`); and a single-centre series of
  12,668 ultrasound-guided blocks reports a seizure rate of 0.08 per 1000 and
  no cardiac arrests (`PMID:22705953`). These differ in period, case
  definition, technique mix and denominator. The entry reports each with its
  source rather than averaging them, and the direction they agree on - that
  LAST is rare and getting rarer - is the claim worth making.

  **This entry is about systemic toxicity, not local tissue toxicity.** The two
  share molecular injury pathways and are routinely reviewed together
  (`PMID:42589553` does exactly that), but direct neurotoxicity or myotoxicity
  at the injection site is a different clinical problem with a different
  exposure profile, and is out of scope here. True local anesthetic
  hypersensitivity is also excluded: it is immune-mediated and rarer, and
  nothing in this entry's pathograph applies to it.

  **No GeneReviews chapter exists and none is expected** - this is an acquired
  iatrogenic drug toxicity with no Mendelian basis. `just check-genereviews`
  returns `GeneReviews NO_CHAPTER`. It returns `StatPearls TAGGED`: a
  StatPearls chapter does exist and is cited and tagged below, for the symptom
  list only. StatPearls is never a baseline.

  **Host susceptibility: one half curated, one half not, and the difference is
  the evidence.** The deep research report proposes that SCN5A channelopathy
  and carnitine palmitoyltransferase II deficiency would each lower the
  threshold for this cascade, which is mechanistically coherent given the two
  arms curated below. The SCN5A half is now a `genetic:` record: a single
  functionally characterised case of lidocaine-induced lethal ventricular
  fibrillation in a rare SCN5A variant carrier. The fatty-acid-oxidation half
  is not, and the reason is specific rather than general - the cached review on
  anesthetic management in those patients (`PMID:35363184`) is about general
  anesthesia, recommends avoiding propofol, and never mentions local
  anesthetics or this syndrome. It is the wrong paper for the claim, not merely
  a weak one. An earlier draft of this note asserted that no case report had
  been cached at all, which was false: `PMID:24445991` was sitting in this PR's
  own cache when it was written.

  **Two cached references are deliberately uncited by this entry and are not
  orphans.** `references_cache/` here backs two things: this entry's snippets
  and the deep research report committed beside it, whose citation list is
  checked against the same cache. `PMID:33148630` (the ASRA 2020 checklist)
  and `PMID:27243970` (whole-exome sequencing of a family with local
  anesthetic resistance) are both cited by the report and neither is quotable
  here. The checklist's abstract records only that the 2020 version exists and
  why it was revised, which is bibliographic rather than a finding. The exome
  study is about resistance to the intended block - an SCN5A A572D variant
  causing anesthesia to fail - which is the opposite clinical problem from
  systemic toxicity and does not belong in this entry's `genetic:` section
  merely because it names the same gene.
mechanistic_hypotheses:
- hypothesis_group_id: sodium_channel_cardiotoxicity
  hypothesis_label: Sodium channel blockade as the primary cardiotoxic mechanism
  status: CANONICAL
  description: >-
    Cardiac toxicity arises principally from blockade of the cardiac
    voltage-gated sodium channel Nav1.5, with the potency differences between
    agents explained by how fast each one leaves the channel. Reviews of the
    field describe the experimental data as mixed while still placing sodium
    channels first.
  evidence:
  - reference: PMID:21841477
    reference_title: "Local anesthetic systemic toxicity: update on mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Regarding mechanism(s) of LAST, the evidence remains mixed, but it is likely that local anesthetic cardiotoxicity primarily arises from a blockade of sodium channels."
    explanation: >-
      States the hypothesis and its standing in one sentence, including the
      hedge. "The evidence remains mixed" is why this is curated as a
      hypothesis group rather than as settled fact. Graded OTHER because the
      quoted sentence is a review's summary judgement across a literature
      rather than any one study's result.
- hypothesis_group_id: mitochondrial_bioenergetic_contribution
  hypothesis_label: Mitochondrial carnitine-acylcarnitine translocase inhibition
  status: ALTERNATIVE
  description: >-
    A second, parallel mechanism: local anesthetics with a cardiotoxic profile
    inhibit the carnitine-acylcarnitine translocase, cutting off long-chain
    fatty acid entry into the mitochondrial matrix and starving the myocardium
    of its main fuel. The potency ranking across agents tracks their clinical
    cardiotoxicity, which is the observation the hypothesis rests on. It is not
    a rival to sodium channel blockade so much as a proposed amplifier of it,
    and its quantitative contribution in a whole organism is unresolved.
  evidence:
  - reference: PMID:10691241
    reference_title: Bupivacaine inhibits acylcarnitine exchange in cardiac mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The authors hypothesize that differential inhibition of carnitine-stimulated pyruvate oxidation by various local anesthetics supports the clinical relevance of inhibition of carnitine-acylcarnitine translocase by local anesthetics with a cardiotoxic profile."
    explanation: >-
      The hypothesis in the originating authors' own words, and quoted with
      "The authors hypothesize" intact: this is proposed, not demonstrated, in
      the paper that proposes it.
  - reference: PMID:10691241
    reference_title: Bupivacaine inhibits acylcarnitine exchange in cardiac mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Bupivacaine (IC50 = 0.26+/-0.06 mM) and etidocaine (IC50 = 0.30+/-0.12 mM) inhibit carnitine-stimulated pyruvate oxidation similarly, whereas the lidocaine IC50 is greater by a factor of roughly 5, (IC50 = 1.4+/-0.26 mM), and ropivacaine is intermediate, IC50 = 0.5+/-0.28 mM."
    explanation: >-
      The potency ranking that makes the hypothesis interesting: bupivacaine
      and etidocaine most potent, lidocaine roughly fivefold weaker, ropivacaine
      between them - the same order as their clinical cardiotoxicity.
pathophysiology:
- name: Systemic Local Anesthetic Exposure
  biological_scale: ORGANISM
  description: >-
    An excessive free plasma concentration of local anesthetic, from
    inadvertent intravascular injection, rapid absorption from a vascular
    tissue bed, or cumulative overdose. Everything downstream is
    concentration-dependent, which is why the clinical picture is a sequence
    rather than a switch.
  chemical_entities:
  - preferred_term: bupivacaine
    term:
      id: CHEBI:3215
      label: bupivacaine
  downstream:
  - target: Cardiac Sodium Channel Blockade
    causal_link_type: DIRECT
    hypothesis_groups:
    - sodium_channel_cardiotoxicity
  - target: Cortical GABAergic Interneuron Blockade
    causal_link_type: DIRECT
  - target: Mitochondrial Carnitine-Acylcarnitine Translocase Inhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - mitochondrial_bioenergetic_contribution
  evidence:
  - reference: PMID:42589553
    reference_title: "Molecular Mechanisms of Local Anesthetic Toxicity: From Ion Channel Dysregulation to Mitochondrial Dysfunction and Tissue-Specific Injury."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Their therapeutic effect is based mainly on reversible voltage-gated sodium channel inhibition, but toxicity is not limited to this mechanism."
    explanation: >-
      Frames the entry's two-arm structure: the therapeutic action and the
      toxic action share a target, and the toxicity reaches past it.
- name: Cortical GABAergic Interneuron Blockade
  biological_scale: CELLULAR
  description: >-
    Inhibitory tone is lost before excitatory transmission, which is why the
    first manifestation of a central nervous system overdose is excitation
    rather than sedation. The route is not purely sodium channel blockade of
    interneurons: cited experimental work attributes it to suppressed
    presynaptic GABA release and reduced GABA-A receptor currents as well. The
    sodium channel binding on this node is the shared class action, not the
    whole account.
  cell_types:
  - preferred_term: cortical GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Cortical Disinhibition
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42589553
    reference_title: "Molecular Mechanisms of Local Anesthetic Toxicity: From Ion Channel Dysregulation to Mitochondrial Dysfunction and Tissue-Specific Injury."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Experimental studies show that local anesthetics can suppress presynaptic γ-aminobutyric acid (GABA) release, reduce γ-aminobutyric acid type A (GABA-A) receptor-mediated currents in a subunit-dependent manner, and, particularly with lidocaine, shift the GABA-induced reversal potential in a depolarizing direction."
    explanation: >-
      The mechanisms behind the loss of inhibitory tone this node names, and the
      reason its description does not attribute the effect to sodium channel
      blockade alone.
  - reference: PMID:42589553
    reference_title: "Molecular Mechanisms of Local Anesthetic Toxicity: From Ion Channel Dysregulation to Mitochondrial Dysfunction and Tissue-Specific Injury."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "At the molecular level, CNS toxicity involves more than sodium channel block."
    explanation: >-
      REFUTE against reading this node's sodium channel binding as the complete
      mechanism. Carried explicitly because an earlier draft of the node
      description asserted selective sodium channel blockade of interneurons
      with no evidence at all, and this is the sentence that corrects it.
- name: Cortical Disinhibition
  biological_scale: CELLULAR
  description: >-
    Net excitation of cortical circuits once inhibitory tone is removed,
    producing the excitatory prodrome and then seizure.
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
  - target: Agitation
    causal_link_type: DIRECT
  - target: Global Neuronal Conduction Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Not a consequence of disinhibition itself but of the rising
      concentration that produced it: as blockade extends to excitatory
      pathways the excitatory phase gives way to depression. The intermediate
      is the continued rise in free drug concentration.
  evidence:
  - reference: PMID:20301824
    reference_title: "Clinical presentation of local anesthetic systemic toxicity: a review of published cases, 1979 to 2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The classic description of local anesthetic systemic toxicity (LAST) generally described in textbooks includes a series of progressively worsening neurologic symptoms and signs occurring shortly after the injection of local anesthetic and paralleling progressive increases in blood local anesthetic concentration, culminating in seizures and coma."
    explanation: >-
      The concentration-dependent neurological sequence this node and the next
      one model. BACKGROUND because it is the paper's statement of the textbook
      picture, which the paper then goes on to test - see the REFUTE item on
      the same reference under `discussions`.
- name: Global Neuronal Conduction Failure
  biological_scale: ORGANISM
  description: >-
    At higher concentrations sodium channel blockade is no longer selective for
    inhibitory pathways, and widespread neuronal conduction failure produces
    depression of consciousness and respiratory drive.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Coma
    causal_link_type: DIRECT
- name: Cardiac Sodium Channel Blockade
  biological_scale: MOLECULAR
  description: >-
    Voltage- and use-dependent blockade of Nav1.5, the dominant sodium channel
    isoform in working myocardium. Bupivacaine blocks it within the clinical
    concentration range and accelerates the channel's entry into slow
    inactivation, so the block deepens with each beat rather than recovering
    between them.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: Nav1.5 voltage-gated sodium channel activity
    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
    modifier: DECREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Impaired Cardiac Impulse Conduction
    causal_link_type: DIRECT
    hypothesis_groups:
    - sodium_channel_cardiotoxicity
  evidence:
  - reference: PMID:25008571
    reference_title: Voltage-dependent blockade by bupivacaine of cardiac sodium channels expressed in Xenopus oocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The electrophysiological measurements on Nav1.5 expressed in Xenopus oocytes showed that bupivacaine induced a voltage- and concentration-dependent blockade on the peak of I Na and the half-maximal inhibitory dose was 4.51 μmol/L."
    explanation: >-
      The direct measurement of blockade on the channel this node names, with
      the potency figure. IN_VITRO because it is a heterologous expression
      system, not a heart.
  - reference: PMID:25008571
    reference_title: Voltage-dependent blockade by bupivacaine of cardiac sodium channels expressed in Xenopus oocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The underlying mechanisms of this blockade may contribute to the fact that bupivacaine not only dose-dependently affected the gating kinetics of Nav1.5 but also accelerated the development of its open-state slow inactivation."
    explanation: >-
      The use-dependence this node's description rests on - accelerated
      open-state slow inactivation is why blockade accumulates rather than
      recovering between beats.
- name: Impaired Cardiac Impulse Conduction
  biological_scale: TISSUE
  description: >-
    Slowed phase-0 depolarisation and conduction through working myocardium
    and the conduction system, widening the QRS and setting up the substrate
    for reentry.
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DECREASED
  - preferred_term: cardiac muscle cell action potential
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
    modifier: DECREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Cardiac conduction abnormality
    causal_link_type: DIRECT
  - target: Reentrant Ventricular Arrhythmia
    causal_link_type: DIRECT
  - target: Bradycardia
    causal_link_type: DIRECT
- name: Reentrant Ventricular Arrhythmia
  biological_scale: TISSUE
  description: >-
    Conduction slowing without uniform refractoriness creates reentry circuits,
    producing ventricular tachycardia and fibrillation.
  downstream:
  - target: Ventricular arrhythmia
    causal_link_type: DIRECT
  - target: Cardiovascular Collapse
    causal_link_type: DIRECT
- name: Mitochondrial Carnitine-Acylcarnitine Translocase Inhibition
  biological_scale: MOLECULAR
  description: >-
    Local anesthetics with a cardiotoxic profile inhibit the
    carnitine-acylcarnitine translocase specifically, sparing the carnitine
    palmitoyltransferases either side of it. The substrate specificity is what
    localises the lesion to the translocase rather than to fatty acid oxidation
    generally.
  biological_processes:
  - preferred_term: carnitine shuttle
    term:
      id: GO:0006853
      label: carnitine shuttle
    modifier: DECREASED
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Myocardial Bioenergetic Failure
    causal_link_type: DIRECT
    hypothesis_groups:
    - mitochondrial_bioenergetic_contribution
  evidence:
  - reference: PMID:10691241
    reference_title: Bupivacaine inhibits acylcarnitine exchange in cardiac mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The substrate specificity of this effect rules out bupivacaine inhibition of carnitine palmitoyl transferases I and II, carnitine acetyltransferase, and fatty acid beta-oxidation."
    explanation: >-
      Establishes the specificity this node claims, and does it by exclusion -
      which is what makes the translocase the named target rather than the
      pathway as a whole.
  - reference: PMID:35135371
    reference_title: Lipid emulsions attenuate the inhibition of carnitine acylcarnitine translocase induced by toxic doses of local anesthetics in rat cardiomyoblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "CACT, without significantly altering CPT-I and CPT-II, was inhibited by toxic concentration of local anesthetics."
    explanation: >-
      An independent replication of the same specificity in a different system
      - rat cardiomyoblasts rather than isolated cardiac mitochondria.
- name: Myocardial Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    Loss of the fatty-acid route to ATP in a tissue that depends on it,
    together with the reactive oxygen species and loss of mitochondrial
    membrane potential that accompany it.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Myocardial Contractile Depression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35135371
    reference_title: Lipid emulsions attenuate the inhibition of carnitine acylcarnitine translocase induced by toxic doses of local anesthetics in rat cardiomyoblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The bupivacaine-induced increase of ROS and calcium and the bupivacaine-induced decrease of MMP were attenuated by ROS scavengers NAC and mitotempo, and the lipid emulsion."
    explanation: >-
      The downstream cellular consequences this node names - reactive oxygen
      species, calcium rise and loss of mitochondrial membrane potential - and
      shows them to be reversible, which is why the node sits upstream of a
      contractile rather than a structural lesion.
  - reference: PMID:17643405
    reference_title: "Bupivacaine, but not lidocaine, disrupts cardiolipin-containing small biomimetic unilamellar liposomes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Collectively, these data indicate that bupivacaine, but not lidocaine, interacts avidly and selectively with biomimetic small unilamellar liposomes containing cardiolipin and disrupts their integrity."
    explanation: >-
      A second route to the same node, independent of the translocase arm
      upstream: direct disruption of the cardiolipin-rich inner mitochondrial
      membrane. INDIRECT because the preparation is a synthetic liposome
      rather than a mitochondrion in a myocyte, so it establishes the
      interaction and its agent selectivity but not that this is what happens
      in a poisoned heart. The selectivity is the reason it is carried at all:
      bupivacaine does it and lidocaine does not, which tracks their clinical
      cardiotoxicity in the same direction as the translocase potency series.
- name: Myocardial Contractile Depression
  biological_scale: TISSUE
  description: >-
    Negative inotropy, arising from both the bioenergetic lesion and the direct
    channel effects on excitation-contraction coupling.
  biological_processes:
  - preferred_term: cardiac muscle contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: DECREASED
  downstream:
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Cardiovascular Collapse
    causal_link_type: DIRECT
- name: Cardiovascular Collapse
  biological_scale: ORGANISM
  description: >-
    The convergence of the arrhythmic and contractile arms, and the terminal
    common pathway of severe systemic toxicity.
  downstream:
  - target: Cardiac arrest
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20301824
    reference_title: "Clinical presentation of local anesthetic systemic toxicity: a review of published cases, 1979 to 2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In extreme cases, signs of hemodynamic instability follow and can lead to cardiovascular collapse."
    explanation: >-
      Names collapse as the endpoint of the severe presentation. BACKGROUND for
      the same reason as the companion quote on the disinhibition node: it is
      this paper's statement of the accepted picture.

- category: Neurologic
  name: Muscle twitching
  phenotype_term:
    preferred_term: muscle twitching
    term:
      id: HP:0002380
      label: Fasciculations
    temporality: ACUTE
  notes: >-
    The HPO definition attributes fasciculation to irritability of a
    motor axon, which is a different origin from the cortical
    disinhibition this entry models. The term is bound on the exact
    synonym rather than on the mechanism, and no claim about the
    origin of the twitching is made by binding it.
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The central nervous system (CNS) is often affected first, producing circumoral paresthesia, metallic taste, tinnitus, dizziness, agitation, visual disturbances, dysarthria, or muscle twitching."
    explanation: >-
      Names muscle twitching among the early central nervous system
      features. `HP:0002380` carries "Muscle twitch" as an exact synonym.
- category: Neurologic
  name: Coma
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
  evidence:
  - reference: PMID:20301824
    reference_title: "Clinical presentation of local anesthetic systemic toxicity: a review of published cases, 1979 to 2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "culminating in seizures and coma"
    explanation: Names coma as the endpoint of the neurological sequence.
- category: Cardiovascular
  name: Cardiac arrest
  description: >-
    The terminal presentation, and the reason LAST is treated as an emergency
    even when it presents with neurological signs alone.
  phenotype_term:
    preferred_term: Cardiac arrest
    term:
      id: HP:0001695
      label: Cardiac arrest
  evidence:
  - reference: PMID:23788067
    reference_title: Ultrasound guidance reduces the risk of local anesthetic systemic toxicity following peripheral nerve blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The primary outcome was LAST comprising minor, major, and cardiac arrest (due to toxicity) events determined using standardized definitions."
    explanation: >-
      Cardiac arrest is one of the three graded outcome categories this
      registry counted, which establishes it as a recognised LAST presentation
      rather than an incidental co-occurrence.
- category: Cardiovascular
  name: Cardiac conduction abnormality
  description: >-
    The electrocardiographic readout of sodium channel blockade in working
    myocardium: slowed phase-0 depolarisation lengthens the PR interval and
    widens the QRS before any arrhythmia appears. This is what monitoring
    during a high-risk block is watching for.
  phenotype_term:
    preferred_term: PR and QRS prolongation
    term:
      id: HP:0031546
      label: Cardiac conduction abnormality
    temporality: ACUTE
  notes: >-
    Bound at conduction-abnormality granularity rather than to `HP:0006677`
    Prolonged QRS complex because the two cited sentences say different
    things: the clinical review says "conduction abnormalities" without
    naming an interval, and the mechanistic review says PR and QRS together.
    Binding the QRS term alone would drop the PR half of what is quoted, and
    splitting one electrocardiographic observation across two phenotypes
    would assert two findings where the sources report one.
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Progressive toxicity may cause seizures, loss of consciousness, respiratory depression, conduction abnormalities, hypotension, ventricular dysrhythmias, and cardiovascular collapse."
    explanation: >-
      Names conduction abnormalities among the manifestations of progressive
      toxicity, which is the clinical statement that this phenotype occurs.
  - reference: PMID:42589553
    reference_title: "Molecular Mechanisms of Local Anesthetic Toxicity: From Ion Channel Dysregulation to Mitochondrial Dysfunction and Tissue-Specific Injury."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In cardiomyocytes, sodium channel blockade slows phase 0 depolarization, reduces conduction velocity, and prolongs PR/QRS intervals."
    explanation: >-
      Names the two intervals and ties them to the upstream node this
      phenotype hangs off, which is why the edge is drawn from
      `Impaired Cardiac Impulse Conduction` rather than from the exposure.
- category: Cardiovascular
  name: Ventricular arrhythmia
  phenotype_term:
    preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Progressive toxicity may cause seizures, loss of consciousness, respiratory depression, conduction abnormalities, hypotension, ventricular dysrhythmias, and cardiovascular collapse."
    explanation: >-
      Names ventricular dysrhythmias among the manifestations of progressive
      toxicity. This is the direct clinical statement; the electrophysiology
      item below is kept for the mechanism it points at.
  - reference: PMID:25008571
    reference_title: Voltage-dependent blockade by bupivacaine of cardiac sodium channels expressed in Xenopus oocytes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Nav1.5 is the dominant isoform of VGSCs expressed in cardiac myocytes, and its dysfunction may be the cause of bupivacaine-triggered arrhythmia."
    explanation: >-
      INDIRECT and BACKGROUND: an electrophysiology paper's framing sentence,
      naming bupivacaine-triggered arrhythmia as the clinical problem it
      studies rather than observing it. Kept because it ties the phenotype to
      the specific channel this entry's canonical arm blames.
- category: Cardiovascular
  name: Bradycardia
  phenotype_term:
    preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  evidence:
  - reference: PMID:24496123
    reference_title: "Resuscitation with lipid emulsion: dose-dependent recovery from cardiac pharmacotoxicity requires a cardiotonic effect."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Heart rates remained depressed in all four groups throughout the observation period."
    explanation: >-
      INDIRECT and from a rat model: heart rate was depressed by bupivacaine in
      every arm and did not recover with any treatment. It supports bradycardia
      as part of the toxidrome, not as a human clinical observation, and the
      grading says so.
- category: Cardiovascular
  name: Hypotension
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Progressive toxicity may cause seizures, loss of consciousness, respiratory depression, conduction abnormalities, hypotension, ventricular dysrhythmias, and cardiovascular collapse."
    explanation: Names hypotension directly among the manifestations of progressive toxicity.
  - reference: PMID:20301824
    reference_title: "Clinical presentation of local anesthetic systemic toxicity: a review of published cases, 1979 to 2009."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "or involved only signs of cardiovascular compromise, with no evidence of central nervous system toxicity"
    explanation: >-
      INDIRECT, and kept for a different point than the item above: it does not
      name hypotension, but it establishes cardiovascular compromise as a
      presentation in its own right, which is what makes this phenotype more
      than a late complication of the neurological sequence.
genetic:
- name: SCN5A
  relationship_type: RISK_FACTOR
  notes: >-
    A single functionally characterised case, not a population association.
    It is curated because the mechanism is exactly the one this entry's
    canonical arm describes - a variant that reduces peak sodium current,
    in a patient who then fibrillated on lidocaine - and because a
    loss-of-function channel variant lowering the threshold for channel-blocker
    toxicity is a coherent claim rather than a coincidence. It is not evidence
    that SCN5A genotype predicts risk in the general population.
  gene_term:
    preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  evidence:
  - reference: PMID:24445991
    reference_title: A rare loss-of-function SCN5A variant is associated with lidocaine-induced ventricular fibrillation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report identification and functional characterization of a rare non-synonymous (p.A1427S) variant in the SCN5A gene that was associated with incessant and lethal ventricular tachycardia and fibrillation after administration of lidocaine to a patient with acute myocardial infarction."
    explanation: >-
      The case and the variant. Note the confounder the authors state plainly -
      the lidocaine was given for acute myocardial infarction, so an infarcting
      myocardium is part of the picture.
  - reference: PMID:24445991
    reference_title: A rare loss-of-function SCN5A variant is associated with lidocaine-induced ventricular fibrillation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The variant, located in a highly conserved domain distinct from the predicted lidocaine-binding site, decreased peak current density of the sodium channel."
    explanation: >-
      The functional characterisation, and the reason this is a susceptibility
      claim rather than an altered-drug-binding one: the variant sits away from
      the lidocaine site and lowers baseline current, so it reduces the reserve
      the drug then eats into. Graded IN_VITRO because this is the
      electrophysiology, separate from the clinical case above.
environmental:
- name: Injection of local anesthetic for regional or local anesthesia
  description: >-
    The exposure is a therapeutic procedure. Risk concentrates where injection
    is into a vascular bed, where the dose per weight is high, and where the
    agent is one of the more cardiotoxic amides.
  exposure_term:
    preferred_term: exposure to a local anesthetic agent
    term:
      id: ECTO:9001759
      label: exposure to local anaesthetic
  influences_mechanisms:
  - target: Systemic Local Anesthetic Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The administered dose is the sole source of the systemic concentration;
      there is no endogenous contribution.
    evidence:
    - reference: PMID:23788067
      reference_title: Ultrasound guidance reduces the risk of local anesthetic systemic toxicity following peripheral nerve blockade.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Site of injection, local anesthetic type, dose per weight, dose, and patient weight were all predictors of LAST."
      explanation: >-
        Identifies the features of the exposure that determine whether toxicity
        follows, which is what this edge asserts - dose and site, not patient
        idiosyncrasy.
  evidence:
  - reference: PMID:29303925
    reference_title: "Local Anesthetic Systemic Toxicity: A Review of Recent Case Reports and Registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Local anesthetic systemic toxicity events occurred as a result of penile blocks (23%), local infiltration (17%), and upper/lower extremity, torso, and neuraxial blockade."
    explanation: >-
      The distribution of procedures that produced events, which is the
      exposure this entry models.
  - reference: PMID:35777259
    reference_title: "Local anesthetic systemic toxicity: A narrative review for emergency clinicians."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients at extremes of age or with organ dysfunction are at higher risk."
    explanation: >-
      The patient-side half of the risk picture, which the procedure-side
      evidence above does not cover. Carried because this entry otherwise
      attributes risk entirely to dose and site, and the same review names
      host factors that modify it at a given dose.
  notes: >-
    ECTO spells this term the British way. `runoak -i ols:ecto search "exposure
    to local anesthetic"` returns nothing and `"exposure to anesthetic"` returns
    only the broad `ECTO:2000059`, which is what an earlier draft of this entry
    bound while asserting no specific term existed. `runoak -i ols:ecto search
    "anaesthetic"` returns `ECTO:9001759` exposure to local anaesthetic, which
    is exact, non-obsolete, and reachable from the `ExposureTerm` root via
    exposure to drug, so it validates. Searching one spelling and recording the
    absence as a fact is the failure this note now exists to document.
treatments:
- name: Intravenous Lipid Emulsion
  description: >-
    The specific antidote, and first-line for the cardiovascular manifestations.
    It works - the dose-response is established in animals and the case series
    are favourable - but by which of several mechanisms is unsettled, which the
    `lipid_rescue_mechanism` discussion records. Note that the evidence base
    behind the international recommendations is graded low to very low.
  therapeutic_modality: OTHER
  notes: >-
    The agent binding is a compromise and the reason is worth recording.
    `NCIT:C2575` Fat Emulsion names the formulation exactly, but it is not
    reachable from the `ChemicalEntityTerm` enum root, so `just validate-terms`
    rejects it in `therapeutic_agent` - the same class of failure as binding a
    device term in a clinical-action slot. `CHEBI:166975` soybean oil is bound
    instead: it is the lipid phase of the standard 20% emulsion, not the
    emulsion itself. What is lost is the formulation, which matters here
    because medium-chain and long-chain preparations are not interchangeable
    in this indication; `preferred_term` carries it.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: intravenous lipid emulsion (soybean-oil based)
      term:
        id: CHEBI:166975
        label: soybean oil
  target_mechanisms:
  - target: Myocardial Contractile Depression
    treatment_effect: INHIBITS
    description: >-
      The cardiotonic arm of the antidote's action: lipid emulsion raises
      arterial pressure and accelerates haemodynamic recovery in a
      dose-dependent way.
    evidence:
    - reference: PMID:24496123
      reference_title: "Resuscitation with lipid emulsion: dose-dependent recovery from cardiac pharmacotoxicity requires a cardiotonic effect."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Intravenous lipid emulsion accelerates cardiovascular recovery from bupivacaine toxicity in a dose-dependent manner, which is driven by a cardiotonic response that complements the previously reported sequestration effect."
      explanation: >-
        Supports this specific edge - an effect on contractile performance -
        and is careful that the cardiotonic response complements rather than
        replaces sequestration.
  - target: Global Neuronal Conduction Failure
    treatment_effect: INHIBITS
    description: >-
      Lipid emulsion also acts against the central nervous system arm, not
      only the cardiac one. In rats given local anesthetic directly into the
      lateral ventricle, emulsion given before the dose prevented respiratory
      arrest and emulsion given after it achieved resuscitation.
    evidence:
    - reference: PMID:26622452
      reference_title: Lipid emulsion mitigates local anesthesia-induced central nervous system toxicity in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The results of the present study therefore indicate that pre- and post-conditioning with lipid emulsion effectively mitigates LA-induced CNS toxicity in rats."
      explanation: >-
        Supports this specific edge, which no other evidence in this entry
        covers: every other lipid emulsion item here is cardiac. Worth noting
        for the `lipid_rescue_mechanism` discussion that the anesthetic was
        injected intracerebroventricularly, so a purely intravascular sink
        is not an obvious explanation of the rescue - but the study was not
        designed to test that and the entry does not claim it did.
  - target: Mitochondrial Carnitine-Acylcarnitine Translocase Inhibition
    treatment_effect: INHIBITS
    description: >-
      Lipid emulsion reverses the translocase inhibition in cardiomyoblasts.
      The authors attribute this to sequestration of the drug rather than to
      any direct metabolic effect, which matters for the mechanism question.
    evidence:
    - reference: PMID:35135371
      reference_title: Lipid emulsions attenuate the inhibition of carnitine acylcarnitine translocase induced by toxic doses of local anesthetics in rat cardiomyoblasts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Collectively, these results suggested that the lipid emulsion attenuated the levobupivacaine-induced inhibition of CACT, probably through the lipid emulsion-mediated sequestration of levobupivacaine."
      explanation: >-
        Supports the edge and names the proposed route, with the authors' own
        "probably" left in - this is the sequestration account, and the paper
        offers it as the likely explanation rather than a demonstrated one.
  evidence:
  - reference: PMID:28346007
    reference_title: "Lipid emulsion improves survival in animal models of local anesthetic toxicity: a meta-analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Lipid emulsion reduced the odds of death in resuscitative models (OR =0.24; 95%CI: 0.1-0.56, p = .0012)."
    explanation: >-
      The strongest efficacy estimate available for this treatment, pooled
      across 16 resuscitative animal studies. MODEL_ORGANISM because every
      included study is an animal model - there is no randomised human trial in
      this indication and there is unlikely ever to be one.
  - reference: PMID:28346007
    reference_title: "Lipid emulsion improves survival in animal models of local anesthetic toxicity: a meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Analysis of outliers reinforced the need for good life support measures (securement of airway and chest compressions) along with prompt treatment with lipid."
    explanation: >-
      INDIRECT, and the reason this entry lists airway management before the
      antidote: the same meta-analysis found the lipid benefit depends on basic
      life support being done alongside it.
  - reference: PMID:37242638
    reference_title: "Lipid Emulsion to Treat Acute Poisonings: Mechanisms of Action, Indications, and Controversies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Present evidence supports the use of ILE as first-line therapy to reverse local anesthetic-related systemic toxicity and as adjunct therapy in lipophilic non-local anesthetic drug overdoses refractory to well-established antidotes and supportive care."
    explanation: Establishes first-line status for this indication specifically.
  - reference: PMID:37242638
    reference_title: "Lipid Emulsion to Treat Acute Poisonings: Mechanisms of Action, Indications, and Controversies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, the level of evidence is low to very low, as for most other commonly used antidotes."
    explanation: >-
      The same review's grading of that recommendation, carried so the
      first-line status is not read as a strong evidence base. INDIRECT because
      it qualifies the recommendation rather than bearing on efficacy directly.
- name: Airway Management and Ventilation
  description: >-
    Oxygenation and ventilation come first, because hypoxia and acidosis
    worsen the toxicity that caused them. The binding covers one half of the
    treatment. `runoak`-equivalent OLS searches of NCIT return nothing for
    "Airway Management", `NCIT:C94624` Oxygen Therapy for "Oxygen Therapy", and
    `NCIT:C70909` Mechanical Ventilation for "Mechanical Ventilation". Oxygen
    Therapy is bound because first-line care here is bag-mask ventilation with
    100% oxygen and Mechanical Ventilation names only the escalated form; an
    earlier draft bound the escalated term and then asserted no whole-airway
    term existed, which was a search of one phrase reported as a fact about the
    ontology. The airway-management half is carried in `preferred_term`.
  treatment_term:
    preferred_term: airway management, oxygenation and ventilation
    term:
      id: NCIT:C94624
      label: Oxygen Therapy
  evidence:
  - reference: PMID:21841477
    reference_title: "Local anesthetic systemic toxicity: update on mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As for treatment, in addition to ventilation, oxygenation, and chest compressions, lipid emulsion therapy should be a primary element in the treatment of cardiovascular LAST."
    explanation: >-
      Places ventilation and oxygenation alongside lipid emulsion in the
      treatment set.
- name: Supportive Care and Modified Resuscitation
  description: >-
    Standard resuscitation modified for this toxidrome, notably by keeping
    vasopressor doses low.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:21841477
    reference_title: "Local anesthetic systemic toxicity: update on mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of epinephrine and vasopressin should be tailored to specifics of an episode of LAST, and doses should be kept as low as possible while still achieving the desired effects."
    explanation: >-
      The specific modification that distinguishes LAST resuscitation from
      standard practice.
prevalence:
- population: Peripheral nerve blocks, Australia and New Zealand registry, 2007-2012
  measure_type: UNKNOWN
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 87.0
  rate_denominator: POPULATION
  notes: >-
    0.87 events per 1000 peripheral nerve blocks, converted to 87 per 100,000
    blocks, which is `BAND_1_5_PER_10000` (10-99 per 100,000). Two slots here
    are compromises. The denominator is blocks performed, not people or
    person-years, and no `RateDenominatorEnum` value names that; POPULATION is
    the closest. And `measure_type` is UNKNOWN rather than ANNUAL_INCIDENCE
    because this is a per-procedure attack rate over 2007-2012, not a rate per
    year - an earlier draft said ANNUAL_INCIDENCE, which would have made the
    band read as cases per 100,000 per year. See the entry `notes:` for why
    this figure is not reconciled with the others.
  evidence:
  - reference: PMID:23788067
    reference_title: Ultrasound guidance reduces the risk of local anesthetic systemic toxicity following peripheral nerve blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There were 22 episodes of LAST, resulting in an incidence of LAST of 0.87 per 1000 PNBs (95% confidence interval, 0.54-1.3 per 1000)."
    explanation: The event count, the rate and its confidence interval.
- population: Peripheral nerve blocks, pooled registries reported 2018
  measure_type: UNKNOWN
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 27.0
  rate_denominator: POPULATION
  notes: >-
    0.27 events per 1000 blocks over a denominator of 251,325, converted to 27
    per 100,000 blocks, which is `BAND_1_5_PER_10000`. Lower than the earlier
    registry figure above; the entry does not reconcile the two. `measure_type`
    is UNKNOWN for the same reason as the record above - a per-procedure attack
    rate is not an annual incidence.
  evidence:
  - reference: PMID:29303925
    reference_title: "Local Anesthetic Systemic Toxicity: A Review of Recent Case Reports and Registries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The incidence of LAST reported in registries is 0.03% or 0.27 (95% confidence interval, 0.21-0.35) per 1000 peripheral nerve blocks (denominator of 251,325)."
    explanation: The pooled registry rate with its denominator.
animal_models:
- name: Bupivacaine cardiovascular toxicity in the anesthetized rat
  species: Rat
  genotype: wild type Sprague-Dawley
  publication: PMID:24496123
  description: >-
    Instrumented rats given a non-lethal intravenous bupivacaine dose, then
    randomised to lipid emulsion at two concentrations, saline, or nothing. The
    model that supplies this entry's evidence on how the antidote works.
  modeled_mechanisms:
  - target: Myocardial Contractile Depression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the haemodynamic arm of the toxidrome and its reversal, with
      arterial pressure as the recovering variable.
    limitations: >-
      The dose is deliberately sub-lethal so that recovery happens without
      chest compressions, which is not the clinical scenario the antidote is
      used in. Heart rate did not recover in any arm, so the model reproduces
      the pressure half of the collapse and not the rate half.
    evidence:
    - reference: PMID:24496123
      reference_title: "Resuscitation with lipid emulsion: dose-dependent recovery from cardiac pharmacotoxicity requires a cardiotonic effect."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Rats treated with lipid emulsions recovered faster than did rats treated with saline or no treatment."
      explanation: >-
        The controlled comparison that makes this a usable model of the
        treatment effect rather than of the toxicity alone.
experimental_models:
- name: Nav1.5 expressed in Xenopus oocytes
  experimental_model_type: OTHER
  publication: PMID:25008571
  description: >-
    Heterologous expression of the cardiac sodium channel for voltage-clamp
    measurement of bupivacaine block. Not a disease model - a target model,
    which is what the canonical arm of this entry needs.
  modeled_mechanisms:
  - target: Cardiac Sodium Channel Blockade
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Measures the block directly at the channel, giving the potency and the
      use-dependence the node claims.
    limitations: >-
      An amphibian oocyte expressing one human channel is not a cardiomyocyte:
      there is no sarcomere, no mitochondrial arm, and none of the accessory
      subunits or lipid environment that modulate Nav1.5 in working myocardium.
      It can say what the drug does to the channel and nothing about what that
      does to a heart.
    evidence:
    - reference: PMID:25008571
      reference_title: Voltage-dependent blockade by bupivacaine of cardiac sodium channels expressed in Xenopus oocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Consistent with other local anesthetics, bupivacaine also induced a use-dependent blockade on Nav1.5 currents."
      explanation: >-
        The use-dependence half of what this link claims to measure, observed
        in the oocyte preparation itself. The previous snippet here was the
        paper's aim sentence, which states what the study set out to do rather
        than what it found, and so could carry no `quote_role` at all.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: lipid_rescue_mechanism
  prompt: >-
    By what mechanism does intravenous lipid emulsion reverse local anesthetic
    cardiotoxicity - sequestration of the drug, a direct cardiotonic effect,
    post-conditioning, or some combination?
  attaches_to:
  - treatments#Intravenous Lipid Emulsion
  - pathophysiology#Myocardial Contractile Depression
  rationale: >-
    This is the unusual case of an antidote in routine guideline-endorsed use
    whose mechanism is still argued over. The "lipid sink" account -
    intravascular lipid sequestering drug away from target tissue - is the
    oldest and is supported by the cardiomyoblast work. Against it, a
    dose-response study in rats found recovery driven by a cardiotonic effect
    that the authors say complements rather than replaces sequestration, and
    the ASRA advisory names three mechanisms at once. Others have proposed
    that recovery is simply hemodilution. The question is not academic: if the
    sink dominates, the antidote should be reserved for the most lipophilic
    agents, and if inotropy dominates, it should not.
  evidence:
  - reference: PMID:29356773
    reference_title: "The Third American Society of Regional Anesthesia and Pain Medicine Practice Advisory on Local Anesthetic Systemic Toxicity: Executive Summary 2017."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This interim update summarizes recent scientific findings that have enhanced our understanding of the mechanisms that lead to lipid emulsion reversal of LAST, including rapid partitioning, direct inotropy, and post-conditioning."
    explanation: >-
      The guideline naming three distinct mechanisms, which is the state of the
      question rather than a resolution of it.
  - reference: PMID:37242638
    reference_title: "Lipid Emulsion to Treat Acute Poisonings: Mechanisms of Action, Indications, and Controversies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additional mechanisms based on ILE-attributed vasoactive and cytoprotective properties are still under investigation."
    explanation: >-
      Confirms the list is still open, not merely contested between two
      settled options.
  - reference: PMID:24496123
    reference_title: "Resuscitation with lipid emulsion: dose-dependent recovery from cardiac pharmacotoxicity requires a cardiotonic effect."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "An increase in arterial blood pressure underlay the recovery in both lipid emulsion-treated groups."
    explanation: >-
      The observation behind the cardiotonic account: recovery tracked blood
      pressure, not heart rate, in a controlled dose-response design.
- kind: KNOWLEDGE_GAP
  discussion_id: classic_presentation_is_the_minority_picture
  prompt: >-
    Why does the classic progressive neurological-then-cardiovascular sequence
    describe only about three-fifths of published cases, and what determines
    which patients present with cardiovascular signs alone or after a delay?
  attaches_to:
  - pathophysiology#Cortical Disinhibition
  - phenotypes#Hypotension
  rationale: >-
    The textbook model this entry's pathograph follows - rising concentration
    producing an ordered neurological sequence, with cardiovascular signs late
    - is the minority presentation in a 30-year review of published cases. The
    remainder were substantially delayed or purely cardiovascular with no
    central nervous system signs at all. The ASRA advisory reports the same
    drift and offers candidate explanations, all of them changes in practice
    rather than in biology: ultrasound guidance means fewer intravascular
    injections, infiltration techniques absorb more slowly, and continuous
    infusions accumulate. Whether the shift is entirely explained by technique
    or partly reflects who is now being affected is not settled; the advisory
    notes an increasing share of events outside hospitals and involving
    non-anesthesiologists.
  evidence:
  - reference: PMID:20301824
    reference_title: "Clinical presentation of local anesthetic systemic toxicity: a review of published cases, 1979 to 2009."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sixty percent of cases followed the classic pattern of presentation. However, in the remainder of cases, symptoms were substantially delayed after the injection of local anesthetic, or involved only signs of cardiovascular compromise, with no evidence of central nervous system toxicity."
    explanation: >-
      REFUTE, and the object is the pathograph, not this discussion. The
      discussion's own rationale asserts what this sentence says, so read
      against the discussion it would be SUPPORT. It is graded REFUTE because
      the claim it cuts against is the ordered neurological-then-cardiovascular
      model that this entry's `Cortical Disinhibition` chain encodes, and which
      the same paper supplies as BACKGROUND two nodes away. Stating the object
      explicitly because `supports` is claim-relative and the two gradings of
      this reference would otherwise look inconsistent.
  - reference: PMID:29356773
    reference_title: "The Third American Society of Regional Anesthesia and Pain Medicine Practice Advisory on Local Anesthetic Systemic Toxicity: Executive Summary 2017."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Contemporary case reports suggest a trend toward delayed presentation, which may mirror the increased use of ultrasound guidance (fewer intravascular injections), local infiltration techniques (slower systemic uptake), and continuous local anesthetic infusions."
    explanation: >-
      The candidate explanations, all of them practice changes, and offered by
      the guideline as a possibility ("may mirror") rather than as established.
  - reference: PMID:39398741
    reference_title: "Local Anesthetic Systemic Toxicity in Pregnancy: A Retrospective Cohort Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Pregnant cohorts had a significantly higher risk of cardiac depression (risk ratio (RR)=1.96 (95% confidence interval (CI): 1.44-2.66), p<0.01) and significantly lower risk of cardiac excitation (RR=0.38 (95% CI: 0.22-0.63), p<0.01), prodromal symptoms (RR=0.17 (95% CI: 0.09-0.33), p<0.01), central nervous system excitation (RR=0.44 (95% CI: 0.21-0.90), p=0.02), and central nervous system depression (RR=0.24 (95% CI: 0.13-0.48), p<0.01) than nonpregnant cohorts."
    explanation: >-
      The discussion asks what determines which patients skip the prodrome.
      This is the one cited source that measures a population where they do:
      matched pregnant and nonpregnant cohorts, with the prodrome roughly six
      times less likely in pregnancy and cardiac depression twice as likely.
      It narrows the question rather than settling it - the authors offer
      gestational physiology and earlier detection as competing explanations
      for the same numbers, and a matched retrospective database cohort
      cannot separate them.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Individually severe and occasionally fatal, but rare and getting rarer.
    Registry incidence is under one event per thousand peripheral nerve blocks
    and falling with ultrasound guidance; a single-centre series of 12,668
    ultrasound-guided blocks recorded no cardiac arrests at all. Against that,
    events increasingly occur outside the operating theatre and in the hands of
    non-anesthesiologists, where the antidote and the expertise may not be at
    hand.
  evidence:
  - reference: PMID:22705953
    reference_title: "Incidence of local anesthetic systemic toxicity and postoperative neurologic symptoms associated with 12,668 ultrasound-guided nerve blocks: an analysis from a prospective clinical registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Local anesthetic systemic toxicity, however, is extremely uncommon."
    explanation: >-
      The authors' conclusion from a 12,668-block prospective registry, which
      is the basis for MODERATE rather than HIGH.
  - reference: PMID:29356773
    reference_title: "The Third American Society of Regional Anesthesia and Pain Medicine Practice Advisory on Local Anesthetic Systemic Toxicity: Executive Summary 2017."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "An increasing number of reported events occur outside of the traditional hospital setting and involve non-anesthesiologists."
    explanation: >-
      The countervailing consideration, and the reason the burden is not graded
      LOW despite the falling incidence.

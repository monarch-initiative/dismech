    snippet: "The central nervous system (CNS) is often affected first, producing circumoral paresthesia, metallic taste, tinnitus, dizziness, agitation, visual disturbances, dysarthria, or muscle twitching."
    explanation: >-
      Names metallic taste among the early central nervous system features.
      `HP:0031249` is the binding because its own definition reads "often
      characterized by the sensation of a metallic taste" and it carries
      "Metallic taste" as an exact synonym.
- category: Neurologic
  name: Dizziness
  phenotype_term:
    preferred_term: dizziness
    term:
      id: HP:0002321
      label: Vertigo
    temporality: ACUTE
  notes: >-
    HPO files "Dizziness" only as a synonym of `HP:0002321` Vertigo,
    whose definition is narrower than the source's word: "an abnormal
    sensation of spinning while the body is actually stationary". The
    prodromal dizziness of this syndrome is not described as rotatory.
    The term is bound because HPO offers no separate concept and the
    synonym is the ontology's own decision, but the gap between the
    label and the quoted word is recorded here rather than hidden.
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The central nervous system (CNS) is often affected first, producing circumoral paresthesia, metallic taste, tinnitus, dizziness, agitation, visual disturbances, dysarthria, or muscle twitching."
    explanation: >-
      Names dizziness among the early central nervous system features.
- category: Neurologic
  name: Visual disturbance
  phenotype_term:
    preferred_term: visual disturbances
    term:
      id: HP:0000504
      label: Abnormality of vision
    temporality: ACUTE
  evidence:
  - reference: PMID:29763139
    reference_title: Local Anesthetic Toxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The central nervous system (CNS) is often affected first, producing circumoral paresthesia, metallic taste, tinnitus, dizziness, agitation, visual disturbances, dysarthria, or muscle twitching."
    explanation: >-
      Names visual disturbances among the early central nervous system
      features. `HP:0000504` is the binding rather than `HP:0000505` Visual

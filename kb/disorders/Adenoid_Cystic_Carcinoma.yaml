    reference_title: "Activating NOTCH1 Mutations Define a Distinct Subgroup of Patients With Adenoid Cystic Carcinoma Who Have Poor Prognosis, Propensity to Bone and Liver Metastasis, and Potential Responsiveness to Notch1 Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NOTCH1 mutations occurred predominantly (14 of 15 patients) in the negative
      regulatory region and Pro-Glu-Ser-Thr-rich domains, the same two hotspots
      seen in T-cell acute lymphoblastic leukemias, and led to pathway activation
      in vitro.
    explanation: >-
      Localises ACC NOTCH1 mutations to the canonical activating hotspots and
      confirms functional pathway activation.
  - reference: PMID:31483290
    reference_title: "Genetic hallmarks of recurrent/metastatic adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with primary tumors, R/M tumors were enriched for alterations in
      key Notch (NOTCH1, 26.3% vs. 8.5%; NOTCH2, 4.6% vs. 2.3%; NOTCH3, 5.7% vs.
      2.3%; NOTCH4, 3.6% vs. 0.6%) and chromatin-remodeling (KDM6A, 15.2% vs.
      3.4%; KMT2C/MLL3, 14.3% vs. 4.0%; ARID1B, 14.1% vs. 4.0%) genes.
    explanation: >-
      An integrated genomic analysis of 1,045 ACCs quantifies Notch-pathway and
      chromatin-remodeler enrichment in recurrent/metastatic versus primary
      tumors.
  downstream:
  - target: Solid-Pattern Aggressive Disease
    description: >-
      Notch pathway activation drives the solid histologic phenotype and its
      accelerated clinical course.
    causal_link_type: DIRECT
- name: TERT Promoter Mutation as an Alternative Oncogenic Route
  biological_scale: MOLECULAR
  conforms_to: "enabling_replicative_immortality#Telomere Maintenance Reactivation"
  description: >-
    A minority of recurrent/metastatic tumors carry TERT promoter hotspot
    mutations that are mutually exclusive with both NOTCH1 mutations and
    MYB/MYBL1 fusions. Together with the MYB and Notch lesions these define four
    discrete molecular subgroups, indicating that ACC is reached by more than one
    oncogenic route rather than by a single obligatory pathway. The cited ACC
    genomic series establishes the lesion and its mutual exclusivity but does not
    measure telomerase activity or telomere length, so a downstream mechanism of
    telomere maintenance is not asserted here.
  genes:
  - preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  evidence:
  - reference: PMID:31483290
    reference_title: "Genetic hallmarks of recurrent/metastatic adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TERT promoter mutations (13.1% of R/M cases) were mutually exclusive with
      both NOTCH1 mutations (q = 3.3 × 10-4) and MYB/MYBL1 fusions (q = 5.6 ×

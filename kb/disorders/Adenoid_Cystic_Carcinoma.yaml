- name: NOTCH1 Pathway Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    A distinct subgroup of ACC carries activating NOTCH1 mutations clustered in
    the negative regulatory region and the PEST (Pro-Glu-Ser-Thr-rich) domain —
    the same two hotspots exploited in T-cell acute lymphoblastic leukemia —
    which stabilise the Notch1 intracellular domain and drive constitutive
    pathway output. These alterations are strongly enriched in
    recurrent/metastatic relative to primary disease, indicating that Notch
    activation is a progression event as well as an initiating one.
  genes:
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:

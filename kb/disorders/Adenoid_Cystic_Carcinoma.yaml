    reference_title: "Epidemiological Study of Adenoid Cystic Carcinoma and Its Outcomes: Insights from the Surveillance, Epidemiology, and End Results (SEER) Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adenoid cystic carcinoma (ACC) is a rare malignant tumor that mainly arises
      in the head and neck area.
    explanation: >-
      A SEER-based population study characterises ACC as rare, supporting the
      qualitative RARE prevalence class without asserting a numeric rate.
pathophysiology:
- name: MYB-NFIB Fusion Oncogene Formation
  biological_scale: MOLECULAR
  description: >-
    A recurrent t(6;9)(q22-23;p23-24) translocation fuses the MYB proto-oncogene
    at 6q23 to the transcription factor gene NFIB at 9p23-24, producing chimeric
    transcripts in which MYB exon 14 is joined to the last coding exon(s) of
    NFIB. The rearrangement consistently deletes MYB exon 15 including the 3'
    UTR, which carries conserved binding sites for the repressive miR-15a/16 and
    miR-150 microRNAs. Loss of this post-transcriptional brake is the proximate
    mechanism of MYB overexpression. Reported prevalence varies widely across
    cohorts, largely reflecting assay methodology rather than true biological
    heterogeneity.
  genes:
  - preferred_term: MYB
    term:
      id: hgnc:7545
      label: MYB
  - preferred_term: NFIB
    term:
      id: hgnc:7785
      label: NFIB
  cell_types:
  - preferred_term: salivary gland cell
    term:
      id: CL:0009005
      label: salivary gland cell
  evidence:
  - reference: PMID:19841262
    reference_title: "Recurrent fusion of MYB and NFIB transcription factor genes in carcinomas of the breast and head and neck."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the t(6;9)(q22-23;p23-24) translocation in adenoid cystic carcinomas (ACC)
      of the breast and head and neck consistently results in fusions encoding
      chimeric transcripts predominantly consisting of MYB exon 14 linked to the
      last coding exon(s) of NFIB
    explanation: >-
      Defines the recurrent t(6;9) translocation and the exon architecture of the
      MYB-NFIB fusion transcript that is the genomic hallmark of ACC.
  - reference: PMID:19841262
    reference_title: "Recurrent fusion of MYB and NFIB transcription factor genes in carcinomas of the breast and head and neck."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The minimal common part of MYB deleted as the result of fusion was exon 15
      including the 3'-UTR, which contains several highly conserved target sites
      for miR-15a/16 and miR-150 microRNAs.
    explanation: >-
      Establishes loss of the MYB 3' UTR microRNA-binding sites as the molecular
      basis for escape from miR-15a/16 and miR-150 repression.
  - reference: PMID:30269389
    reference_title: "t(6;9)(MYB-NFIB) in head and neck adenoid cystic carcinoma: A systematic review with meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of t(6;9)(MYB-NFIB) varied significantly (16%-100%),
      especially due to methodological heterogeneity among studies.
    explanation: >-
      A systematic review quantifies the wide reported prevalence range of the
      fusion and attributes it to assay methodology; supports the claim that the
      fusion is recurrent but qualifies any single frequency figure.
  downstream:
  - target: MYB-Driven Oncogenic Transcriptional Program
    description: >-
      Loss of 3' UTR-mediated repression leads to overexpression of MYB-NFIB
      transcripts and protein and activation of MYB target genes.
    causal_link_type: DIRECT
- name: MYBL1 Rearrangement and MYB Amplification
  biological_scale: MOLECULAR
  description: >-
    In tumors lacking the MYB-NFIB fusion, the same MYB-family transcriptional
    output is reached by alternative genetic routes: rearrangements of the second
    MYB-family gene MYBL1 (MYBL1-NFIB, MYBL1-ACTN1) or high-level amplification
    of MYB itself, each producing MYBL1 or MYB overexpression. These lesions are
    mutually exclusive with the MYB-NFIB fusion, making ACC a convergent
    phenotype at the level of MYB-family activation rather than a single-lesion
    disease.
  genes:
  - preferred_term: MYBL1
    term:
      id: hgnc:7547
      label: MYBL1
  - preferred_term: MYB
    term:
      id: hgnc:7545
      label: MYB
  evidence:
  - reference: PMID:29149504
    reference_title: "MYBL1 rearrangements and MYB amplification in breast adenoid cystic carcinomas lacking the MYB-NFIB fusion gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate that MYBL1 rearrangements and MYB amplification probably
      constitute alternative genetic drivers of breast AdCCs, functioning through
      MYBL1 or MYB overexpression.
    explanation: >-
      Massively parallel sequencing of fusion-negative AdCC identifies MYBL1
      rearrangement and MYB amplification as alternative drivers converging on
      MYB-family overexpression.
  - reference: PMID:26851182
    reference_title: "Adenoid Cystic Carcinoma Can Be Driven by MYB or MYBL1 Rearrangements: New Insights into MYB and Tumor Biology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AdCCs can alternatively be driven by similar rearrangements involving a
      second MYB family gene, MYBL1, and that these two drivers act in remarkably
      similar ways
    explanation: >-
      Supports MYBL1 rearrangement as a mechanistically equivalent alternative
      driver to MYB-NFIB in ACC.
  - reference: PMID:36465348
    reference_title: "Single-cell transcriptomic analysis of the tumor ecosystem of adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYB and MYBL1 were found to belong to two different gene modules and were
      expressed in a mutually exclusive manner.
    explanation: >-
      Single-cell transcriptomics confirms mutually exclusive MYB and MYBL1
      expression modules, supporting them as alternative rather than additive
      drivers.
  downstream:
  - target: MYB-Driven Oncogenic Transcriptional Program
    description: >-
      MYBL1 rearrangement or MYB amplification produces MYB-family overexpression
      and activation of the same downstream transcriptional program.
    causal_link_type: DIRECT
- name: Super-Enhancer Translocation and MYB Positive Feedback Loop
  biological_scale: MOLECULAR
  description: >-
    Beyond creating a chimeric protein, the recurrent rearrangements act as
    regulatory translocations that juxtapose distal super-enhancers to the MYB
    locus. MYB protein then binds these translocated enhancers itself,
    establishing a self-sustaining positive feedback loop that locks in MYB
    overexpression. This enhancer dependency is the rationale for bromodomain
    (BET) inhibition in preclinical ACC models.
  biological_processes:
  - preferred_term: enhancer-driven positive regulation of MYB transcription
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:26829750
    reference_title: "An oncogenic MYB feedback loop drives alternate cell fates in adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identify super-enhancer translocations that drive overexpression of the
      oncogenic transcription factor MYB as a recurrent theme in adenoid cystic
      carcinoma (ACC)
    explanation: >-
      Whole-genome sequencing and chromatin mapping identify super-enhancer
      translocations to the MYB locus as a recurrent mechanism of MYB
      overexpression in ACC.
  - reference: PMID:26829750
    reference_title: "An oncogenic MYB feedback loop drives alternate cell fates in adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYB protein binds to the translocated enhancers, creating a positive
      feedback loop that sustains its expression.
    explanation: >-
      Establishes the MYB autoregulatory positive feedback loop that sustains MYB
      overexpression in ACC.
  downstream:
  - target: MYB-Driven Oncogenic Transcriptional Program
    description: >-
      The enhancer feedback loop sustains high-level MYB expression and its
      downstream transcriptional program.
    causal_link_type: DIRECT
- name: MYB-Driven Oncogenic Transcriptional Program
  biological_scale: CELLULAR
  description: >-
    Overexpressed MYB (or MYBL1), acting as a sequence-specific DNA-binding
    transcription factor, drives a transcriptional program promoting cell-cycle
    progression, survival, angiogenesis and adhesion. Critically, MYB binds
    lineage-specific enhancers and therefore drives different regulatory programs
    in the two cell compartments of the tumor: it cooperates with TP63 in
    myoepithelial cells and with a Notch program in luminal epithelial cells.
    This single-driver, two-program behaviour is the molecular explanation for
    the defining biphasic architecture of ACC.
  molecular_functions:
  - preferred_term: MYB DNA-binding transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: MYB target gene transcriptional activation
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:19841262
    reference_title: "Recurrent fusion of MYB and NFIB transcription factor genes in carcinomas of the breast and head and neck."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data indicate that the MYB-NFIB fusion is a hallmark of ACC and that
      deregulation of the expression of MYB and its target genes is a key
      oncogenic event in the pathogenesis of ACC.
    explanation: >-
      Establishes deregulated MYB target-gene expression as the key oncogenic
      event downstream of the fusion.
  - reference: PMID:26829750
    reference_title: "An oncogenic MYB feedback loop drives alternate cell fates in adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYB also binds enhancers that drive different regulatory programs in
      alternate cell lineages in ACC, cooperating with TP63 in myoepithelial
      cells and a Notch program in luminal epithelial cells.
    explanation: >-
      Directly supports the claim that a single MYB driver produces two distinct
      lineage-specific programs, underpinning the biphasic tumor architecture.
  downstream:
  - target: Biphasic Myoepithelial-Luminal Tumor Architecture
    description: >-
      Lineage-specific MYB enhancer binding sustains distinct myoepithelial and
      luminal transcriptional programs within the same tumor.
    causal_link_type: DIRECT
  - target: Neurotropic Perineural Invasion
    description: >-
      The MYB-driven program supports the infiltrative, neurotropic phenotype

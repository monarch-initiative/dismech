biochemical:
- name: MYB-NFIB Fusion Transcript
  notes: >-
    Detection of the MYB-NFIB (or MYBL1) rearrangement by FISH, RT-PCR, or RNA
    sequencing is a useful molecular diagnostic adjunct for ACC. A negative
    result does not exclude ACC because only a subset carries the canonical
    translocation and alternative MYB-family alterations occur.
  evidence:
  - reference: PMID:39199639
    reference_title: "Molecular Analysis of Salivary and Lacrimal Adenoid Cystic Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      76.9% of the analyzed tumors displayed evidence of NFIB-MYB rearrangement
      at the 6q23.3 locus; 35% had mutations in NOTCH pathway genes
    explanation: >-
      Quantifies MYB-NFIB rearrangement detection rate alongside NOTCH pathway
      mutation rate in a clinically sequenced ACC cohort.
- name: MYB Protein Overexpression
  biomarker_term:
    preferred_term: Transcriptional Activator Myb
    term:
      id: NCIT:C17329
      label: Transcriptional Activator Myb
  notes: >-
    Strong nuclear MYB immunostaining is a specific diagnostic adjunct, but its
    limited sensitivity means that a negative stain does not exclude ACC.
  evidence:
  - reference: PMID:21164292
    reference_title: MYB expression and translocation in adenoid cystic carcinomas and other salivary gland tumors with clinicopathologic correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong Myb immunostaining is very specific for adenoid cystic carcinomas
      but is only present in 65% of all cases.
    explanation: >-
      Directly establishes high specificity and the important 65% sensitivity
      limitation of MYB immunohistochemistry.
- name: KIT (CD117) Expression
  biomarker_term:
    preferred_term: Mast/Stem Cell Growth Factor Receptor Kit
    term:
      id: NCIT:C17328
      label: Mast/Stem Cell Growth Factor Receptor Kit
  notes: >-
    KIT (CD117) is expressed in the large majority of ACC and can serve as an
    ancillary immunohistochemical marker, although staining does not reliably
    distinguish ACC from every basaloid mimic.
  evidence:
  - reference: PMID:14681323
    reference_title: "Expression of KIT (CD117) in neoplasms of the head and neck: an ancillary marker for adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 94% (n = 62) of adenoid cystic carcinomas from various anatomic
      sites and of various histologic subtypes were positive for at least one of
      the KIT antibodies, and 77% (n = 50) of adenoid cystic carcinoma cases were
      positive for both antibodies.
    explanation: >-
      Quantifies KIT immunoreactivity across anatomic sites and histologic
      subtypes, supporting its use as an ancillary rather than definitive marker.

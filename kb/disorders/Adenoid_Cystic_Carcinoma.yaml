    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Intercalated Duct Cell of Origin and Premalignant Transition
  biological_scale: CELLULAR
  description: >-
    Single-cell transcriptomic profiling of paracarcinoma and carcinoma tissue
    resolves the ACC epithelium into myoepithelial-like, intercalated duct-like,
    and duct-like cells. A subset of intercalated duct-like cells in
    paracarcinoma tissue carries copy-number alterations affecting MYB-family
    genes and EN1 and is identified as premalignant; pseudotime trajectory
    analysis shows these cells transitioning into frank malignant cells,
    implicating the intercalated duct cell as the cell of origin.

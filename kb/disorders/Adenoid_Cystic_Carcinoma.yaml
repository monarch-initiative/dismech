- name: Biphasic Myoepithelial-Luminal Tumor Architecture
  biological_scale: TISSUE
  description: >-
    The tumor is built from two interdependent epithelial compartments: abluminal
    myoepithelial-like cells and luminal ductal cells. These are arranged in
    cribriform, tubular, and solid patterns, with the cribriform "Swiss cheese"
    architecture produced by pseudocysts filled with basement-membrane-like
    material laid down by the myoepithelial compartment. The proportion of solid
    architecture is the basis of histological grading and tracks with
    aggressiveness.
  cell_types:

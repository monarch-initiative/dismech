discussions:
- discussion_id: acc_myb_not_prognostic_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does MYB-family activation, which is present in the great majority of
    ACCs and is the defining lesion of the disease, carry no prognostic
    information?
  attaches_to:
  - pathophysiology#MYB-Driven Oncogenic Transcriptional Program
  rationale: >-
    A systematic review of 36 studies found no consistent association between
    t(6;9)(MYB-NFIB) status and survival, while NOTCH1 mutation, TERT promoter
    mutation, solid histology, and perineural invasion all stratify outcome
    strongly. This implies that MYB activation is necessary for the ACC phenotype
    but that the clinically important variation lies in the cooperating lesions
    layered on top of it. Which cooperating events convert an indolent MYB-driven
    tumor into an aggressive one is not resolved.
  proposed_experiments:
  - experiment_id: exp_acc_multiregion_progression_sequencing
    name: Multi-region sequencing of matched indolent and aggressive ACC
    description: >-
      Sequence multiple regions of matched indolent and aggressive tumors from
      the same patient to identify progression-specific cooperating alterations
      against a constant MYB-fusion background, separating drivers of
      aggressiveness from the shared initiating lesion.
  - experiment_id: exp_acc_isogenic_cooperating_lesions
    name: Isogenic dissection of cooperating lesions on a MYB-NFIB background
    description: >-
      Express MYB-NFIB in isogenic salivary epithelial models with and without
      candidate cooperating lesions (NOTCH1 activation, TERT promoter mutation,
      chromatin-remodeler loss) and assay invasive and metastatic capacity to
      test which lesion supplies the aggressive phenotype.
  evidence:
  - reference: PMID:30269389
    reference_title: "t(6;9)(MYB-NFIB) in head and neck adenoid cystic carcinoma: A systematic review with meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 11 studies attempted to determine the prognostic importance of
      the translocation, but no study found any significant association with
      survival rates
    explanation: >-
      Directly documents the absence of a prognostic association for the defining
      lesion of ACC, which is the gap this discussion records.
- discussion_id: acc_bdnf_causal_vs_marker_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is BDNF a causal driver of ACC neurotropism, or a marker of the
    neural-adjacent tumor microenvironment?
  attaches_to:
  - pathophysiology#Neurotropic Perineural Invasion
  rationale: >-
    Perineural invasion is the defining behaviour of ACC and independently
    predicts worse survival, yet the mechanistic evidence for its leading
    candidate mediator remains immunohistochemical and correlative more than two
    decades after the original observation. No study has shown that interrupting
    BDNF-TrkB signalling reduces perineural invasion in ACC. Because perineural
    spread is the direct cause of both cranial neuropathy and margin-positive
    resection, a genuinely causal mediator would be a high-value therapeutic
    target.
  proposed_experiments:
  - experiment_id: exp_acc_trkb_blockade_orthotopic
    name: TrkB blockade in orthotopic ACC models with perineural readout
    description: >-
      Apply pharmacological or genetic TrkB blockade in orthotopic ACC models and
      quantify perineural invasion histologically, testing whether interrupting
      the BDNF-TrkB axis reduces neurotropic spread.
  - experiment_id: exp_acc_organoid_drg_coculture
    name: ACC organoid-dorsal root ganglion co-culture under BDNF neutralisation
    description: >-
      Co-culture patient-derived ACC organoids with dorsal root ganglion explants
      under BDNF neutralisation to test whether directed migration toward nerve
      is BDNF-dependent.
  evidence:
  - reference: PMID:12378520
    reference_title: "Perineural invasion in adenoid cystic carcinoma: Its causation/promotion by brain-derived neurotrophic factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies are warranted to gain better understanding of this possible
      relationship.
    explanation: >-
      The originating study itself frames the BDNF-neurotropism relationship as
      unresolved, which is the gap this discussion records.

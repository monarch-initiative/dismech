datasets:
- accession: dbgap:phs000612
  title: The mutational characterization of adenoid cystic carcinoma
  description: Adenoid cystic carcinoma (ACC) typically emanate from the major and minor salivary glands of the head and neck. ACCs have high rates of perineural invasion, locoregional recurrence, and distant metastasis. Here we report sequencing of 60 tumor/normal pairs and find substantial mutational diversity. On pathway analysis, a significant percentage of mutations involved chromatin remodeling, DNA damage, protein kinase A signaling, and FGF/IGF/PI3K signaling. Whole genome sequencing and FISH confirmed the MYB-NFIB translocation as the main structural variant in ACC.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Adenoid Cystic Carcinoma"). Retrieved 2026-08-02.

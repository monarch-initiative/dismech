- name: Late Haematogenous Metastasis
  biological_scale: ORGANISM
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    ACC disseminates preferentially by the haematogenous rather than the
    lymphatic route, so regional nodal involvement is comparatively uncommon
    while distant metastasis — most often pulmonary, then bone and liver — is the
    dominant mode of failure. The defining feature is its latency: distant
    relapse typically appears several years after primary treatment and can occur
    more than a decade later, and patients may survive for years with established
    metastatic disease, so metastasis in ACC marks a chronic phase rather than an
    immediately terminal one.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:18343149
    reference_title: "Lung metastasis resection of adenoid cystic carcinoma of salivary glands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adenoid cystic carcinoma is a rare tumour originating from the exocrine
      mucous glands, known for its high propensity for distant metastases.
    explanation: >-
      Establishes the high propensity for distant metastasis that characterises
      ACC dissemination.
  - reference: PMID:18343149
    reference_title: "Lung metastasis resection of adenoid cystic carcinoma of salivary glands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 20 patients, at a median free interval time of 3 years (range 1-12), a
      distant metastasis relapse was observed.
    explanation: >-
      Quantifies the multi-year and up to 12-year latency of distant metastatic
      relapse in a surgical ACC cohort.
  - reference: PMID:18343149
    reference_title: "Lung metastasis resection of adenoid cystic carcinoma of salivary glands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean survival of patients having presented with distant metastases resulted
      as being 11 years (SE=2.2).
    explanation: >-
      Documents the prolonged survival after distant metastasis that
      distinguishes ACC from most metastatic carcinomas.
  downstream:
  - target: Pulmonary Metastasis
    description: >-
      Haematogenous dissemination commonly seeds the lung after a prolonged
      disease-free interval.
    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: bdnf_neurotropism
  hypothesis_label: BDNF-Mediated Neurotropism Model of Perineural Invasion
  status: EMERGING
  description: >-
    ACC uniformly expresses brain-derived neurotrophic factor, and BDNF-TrkB
    neurotrophin signalling is the leading candidate explanation for the tumor's
    unusual predilection for perineural spread. The supporting human evidence is
    immunohistochemical and correlative rather than functional: no study has yet
    shown that blocking BDNF or TrkB reduces perineural invasion in ACC. The
    alternative interpretation — that BDNF expression is a marker of the
    neural-adjacent microenvironment rather than a driver of neurotropism — has
    not been excluded.
  evidence:
  - reference: PMID:12378520
    reference_title: "Perineural invasion in adenoid cystic carcinoma: Its causation/promotion by brain-derived neurotrophic factor."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies are warranted to gain better understanding of this possible
      relationship.
    explanation: >-
      The originating study explicitly frames the BDNF-neurotropism link as a
      possible relationship requiring further study, supporting EMERGING status.
histopathology:
- name: Cribriform Pattern
  finding_term:
    preferred_term: Cribriform Pattern
    term:
      id: NCIT:C35920
      label: Cribriform Pattern
  diagnostic: true
  description: >-
    The classic and most common architecture: nests of basaloid tumor cells
    punched through by rounded pseudocystic spaces ("Swiss cheese" appearance)
    containing basement-membrane-like and mucoid material produced by the
    myoepithelial compartment.
  evidence:
  - reference: PMID:23463073
    reference_title: "Adenoid cystic carcinoma: clinical and molecular features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACC has distinct histologic features, with cribriform and tubular growth
      patterns of basaloid cells displaying a predominantly myoepithelial
      cellular phenotype.
    explanation: >-
      A disease-focused review identifies cribriform growth as a defining ACC
      histologic pattern.
- name: Tubular Pattern
  finding_term:
    preferred_term: Tubular Pattern
    term:
      id: NCIT:C35925
      label: Tubular Pattern
  description: >-
    True ducts lined by an inner luminal epithelial layer and an outer
    myoepithelial layer. A predominantly tubular tumor corresponds to the
    lowest-grade, most favourable end of the histological spectrum.
  evidence:
  - reference: PMID:23463073
    reference_title: "Adenoid cystic carcinoma: clinical and molecular features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACC has distinct histologic features, with cribriform and tubular growth
      patterns of basaloid cells displaying a predominantly myoepithelial
      cellular phenotype.
    explanation: >-
      A disease-focused review identifies tubular growth as a defining ACC
      histologic pattern.
- name: Solid Growth Pattern
  finding_term:
    preferred_term: Solid Growth Pattern
    term:
      id: NCIT:C36182
      label: Solid Growth Pattern
  description: >-
    Sheets of basaloid cells without duct or pseudocyst formation, often with
    higher mitotic activity and comedonecrosis. The proportion of solid
    architecture drives histological grade; a solid-predominant tumor is the
    least favourable pattern and is enriched in NOTCH1-mutant disease.
  evidence:
  - reference: PMID:27180054
    reference_title: "Myoepithelial differentiation in cribriform, tubular and solid pattern of adenoid cystic carcinoma: A potential involvement in histological grading and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The solid pattern of AdCC showed gland differentiation but loss of
      myoepithelial differentiation with a higher proliferation and more
      aggressiveness as well as poorer prognosis compared with the
      cribriform-tubular subtypes
    explanation: >-
      Directly supports the solid pattern's altered differentiation and worse
      clinical behavior relative to cribriform-tubular ACC.
  - reference: PMID:40025676
    reference_title: "Clinical Outcomes With Notch Inhibitors in Notch-Activated Recurrent/Metastatic Adenoid Cystic Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-nine patients were included, with a predominance of solid histology
      (86%).
    explanation: >-
      In a Notch-activated ACC cohort solid histology predominated, linking the
      solid pattern to Notch-pathway activation.
- name: Perineural Invasion
  finding_term:
    preferred_term: Perineural Invasion
    term:
      id: NCIT:C48260
      label: Perineural Invasion
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Tumor cells within the perineural or endoneural space, classically forming a
    target-like cuff around a nerve fascicle. Present in the majority of named
    nerves examined in skull-base resection specimens and independently
    associated with worse disease-free and overall survival.
  evidence:
  - reference: PMID:17576903
    reference_title: "The sensitivity and specificity of high-resolution imaging in evaluating perineural spread of adenoid cystic carcinoma to the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologic evidence of PNS was present in 25 (66%) of 38 named nerves.
    explanation: >-
      Quantifies perineural spread in 66% of named nerves examined
      histopathologically, supporting a FREQUENT frequency band.

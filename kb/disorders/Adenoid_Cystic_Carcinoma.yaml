genetic:
- name: MYB (MYB-NFIB Fusion)
  gene_term:
    preferred_term: MYB
    term:
      id: hgnc:7545
      label: MYB
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    The somatic t(6;9) MYB-NFIB fusion is the genomic hallmark of ACC. It is a
    somatic, tumor-restricted event; ACC is not an inherited cancer syndrome.
    Notably, the fusion has not been shown to be prognostic — it defines the
    disease rather than stratifying it.
  evidence:
  - reference: PMID:19841262
    reference_title: "Recurrent fusion of MYB and NFIB transcription factor genes in carcinomas of the breast and head and neck."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data indicate that the MYB-NFIB fusion is a hallmark of ACC
    explanation: >-
      Establishes the MYB-NFIB fusion as the defining genetic hallmark of ACC.
  - reference: PMID:30269389
    reference_title: "t(6;9)(MYB-NFIB) in head and neck adenoid cystic carcinoma: A systematic review with meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the best evidence available demonstrates that t(6;9)(MYB-NFIB) does not
      seem to be a prognostic determinant
    explanation: >-
      A systematic review of 36 studies finds no consistent association between
      the fusion and survival, supporting its diagnostic but not prognostic role.
- name: NFIB (Fusion Partner)
  gene_term:
    preferred_term: NFIB
    term:
      id: hgnc:7785
      label: NFIB
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    NFIB at 9p23-24 is the reciprocal partner of MYB in the t(6;9) translocation.
    Its principal contribution appears to be removal of the MYB 3' UTR rather
    than a gain of NFIB function.
  evidence:
  - reference: PMID:19841262
    reference_title: "Recurrent fusion of MYB and NFIB transcription factor genes in carcinomas of the breast and head and neck."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the t(6;9)(q22-23;p23-24) translocation in adenoid cystic carcinomas (ACC)
      of the breast and head and neck consistently results in fusions encoding
      chimeric transcripts predominantly consisting of MYB exon 14 linked to the
      last coding exon(s) of NFIB
    explanation: >-
      Directly establishes NFIB as the recurrent MYB fusion partner in ACC.
- name: MYBL1 Rearrangement
  gene_term:
    preferred_term: MYBL1
    term:
      id: hgnc:7547
      label: MYBL1
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    MYBL1 rearrangements (MYBL1-NFIB, MYBL1-ACTN1) drive the MYB-fusion-negative
    subset and are mutually exclusive with MYB alterations.
  evidence:
  - reference: PMID:29149504
    reference_title: "MYBL1 rearrangements and MYB amplification in breast adenoid cystic carcinomas lacking the MYB-NFIB fusion gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two cases, we identified MYBL1 rearrangements (MYBL1-ACTN1 and
      MYBL1-NFIB), which were associated with MYBL1 overexpression.
    explanation: >-
      Identifies the specific MYBL1 fusion partners and links them to MYBL1
      overexpression in fusion-negative ACC.
- name: NOTCH1 Activating Mutation
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    Somatic gain-of-function NOTCH1 mutations cluster in the negative regulatory
    region and PEST domain. In the largest integrated series they occur in 8.5%
    of primary and 26.3% of recurrent/metastatic tumors, an approximately
    three-fold enrichment with progression (Ho et al., PMID:31483290). Figures
    around 13.7% (NOTCH1 alone) and 20.5% (broader Notch-pathway genes) come from
    a separate mixed primary-plus-recurrent cohort of 102 tumors and are not
    primary-restricted (Ferrarotto et al., PMID:27870570); the two denominators
    should not be compared directly. NOTCH1 mutation defines an aggressive
    solid-histology subgroup and is the actionable biomarker for Notch-directed
    therapy.
  evidence:
  - reference: PMID:35931701
    reference_title: "AL101, a gamma-secretase inhibitor, has potent antitumor activity against adenoid cystic carcinoma with activated NOTCH signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 20% of patients with ACC carry NOTCH-activating mutations
      that are associated with a distinct phenotype, aggressive disease, and poor
      prognosis.
    explanation: >-
      Quantifies the prevalence of NOTCH-activating mutations and their
      association with aggressive disease.
- name: TERT Promoter Mutation
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  variant_origin: SOMATIC
  relationship_type: SOMATIC_DRIVER
  notes: >-
    TERT promoter hotspot mutations occur in about 13% of recurrent/metastatic
    ACC and are mutually exclusive with both NOTCH1 mutation and MYB/MYBL1
    fusion, marking a third oncogenic route.
  evidence:
  - reference: PMID:31483290
    reference_title: "Genetic hallmarks of recurrent/metastatic adenoid cystic carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TERT promoter mutations (13.1% of R/M cases) were mutually exclusive with
      both NOTCH1 mutations (q = 3.3 × 10-4) and MYB/MYBL1 fusions (q = 5.6 ×
      10-3), suggesting discrete, alternative mechanisms of tumorigenesis.
    explanation: >-
      Quantifies TERT promoter mutation frequency and its mutual exclusivity with
      the other ACC drivers.
treatments:
- name: Surgical Resection
  description: >-
    Gross total resection with tumor-free margins is the principal local
    treatment when anatomically feasible. Achieving negative margins is
    difficult because microscopic perineural extension can reach beyond the
    visible tumor. In anterior craniofacial ACC, incomplete R2 resection did not
    improve on nonsurgical treatment, so the benefit should not be generalized
    to unresectable disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:39410002
    reference_title: "Epidemiological Study of Adenoid Cystic Carcinoma and Its Outcomes: Insights from the Surveillance, Epidemiology, and End Results (SEER) Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariable analysis, older age, male sex, thoracic cancer, the
      presence of regional and distal disease, receiving chemotherapy, not
      undergoing surgical resection, and being treated in the West vs. Northeast
      region were found to be independent predictors of poor survival.
    explanation: >-
      In a 5,150-patient SEER analysis, not undergoing surgical resection is an
      independent predictor of poor survival, supporting surgery as the primary
      modality.
  - reference: PMID:41941852
    reference_title: "Outcomes of different treatment patterns for adenoid cystic carcinoma of the anterior craniofacial area: A multi-institutional study on 578 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GTR followed by adjuvant RT, especially with proton therapy (PT), achieved
      the best local control. R2 resections provided no advantage over NST.
    explanation: >-
      A large multi-institutional cohort supports gross total resection while
      warning against incomplete resection; support is PARTIAL because the study
      is retrospective and restricted to anterior craniofacial ACC.
- name: Postoperative Radiotherapy
  description: >-
    Radiotherapy combined with surgery is the standard local approach for many
    head-and-neck ACCs, particularly advanced or anatomically complex disease.
    Proton and carbon-ion techniques are emerging options for improving dose
    conformity; definitive proton therapy is supported for selected anterior
    craniofacial tumors when complete resection is not feasible.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:42229289
    reference_title: "Advanced radiotherapy and systemic therapy in head and neck adenoid cystic carcinoma: Current progress and future integrated strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although surgery combined with radiotherapy remains the standard local
      approach, treatment outcomes remain suboptimal in patients with
      unresectable tumors, advanced local disease, or anatomically complex
      lesions.
    explanation: >-
      A contemporary review establishes surgery plus radiotherapy as the standard
      local approach while noting its limits in advanced disease.
  - reference: PMID:42229289
    reference_title: "Advanced radiotherapy and systemic therapy in head and neck adenoid cystic carcinoma: Current progress and future integrated strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Advances in radiotherapy, including MRI-guided radiotherapy, FLASH
      radiotherapy, and proton or carbon-ion therapy, are reshaping local
      treatment by improving dose precision, normal tissue sparing, and
      opportunities for treatment individualization.
    explanation: >-
      Supports an emerging role for particle and advanced-photon techniques in
      local treatment, without treating all modalities as established standards.
  - reference: PMID:41941852
    reference_title: "Outcomes of different treatment patterns for adenoid cystic carcinoma of the anterior craniofacial area: A multi-institutional study on 578 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For ACF-ACC, GTR plus modern RT provides the strongest local control, and
      R2 surgery should be avoided. PT is an effective definitive option for
      selected patients, supporting future response-guided treatment strategies.
    explanation: >-
      Supports modern radiotherapy and selected definitive proton therapy in
      anterior craniofacial ACC; PARTIAL reflects the retrospective,
      site-restricted evidence.
- name: Notch Inhibition (Gamma-Secretase Inhibitor)
  description: >-
    AL101 (osugacestat) is a gamma-secretase inhibitor that blocks activation of
    all four NOTCH receptors, developed specifically for the NOTCH-activated ACC
    subgroup. It shows potent antitumor activity in NOTCH1-mutant ACC cell lines,
    organoids and xenografts, and in a retrospective clinical series of
    Notch-activated recurrent/metastatic ACC produced longer progression-free
    survival than prior systemic therapy — though responses remain partial and
    short-lived, and combination approaches are being explored.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: osugacestat (AL101)
      term:
        id: NCIT:C116872
        label: Osugacestat
  target_mechanisms:
  - target: NOTCH1 Pathway Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Gamma-secretase inhibition blocks the proteolytic release of the Notch
      intracellular domain, shutting down the constitutive Notch transcriptional
      output produced by activating NOTCH1 mutations.
    evidence:
    - reference: PMID:35931701
      reference_title: "AL101, a gamma-secretase inhibitor, has potent antitumor activity against adenoid cystic carcinoma with activated NOTCH signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        treatment of the organoid model with AL101 resulted in down-regulation of
        NICD1
      explanation: >-
        Directly demonstrates suppression of activated NOTCH1 signaling in an
        ACC organoid model.
  evidence:
  - reference: PMID:35931701
    reference_title: "AL101, a gamma-secretase inhibitor, has potent antitumor activity against adenoid cystic carcinoma with activated NOTCH signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we find that AL101 has potent antitumor effects in in vitro and in vivo
      models of ACC with activating NOTCH1 mutations and constitutively
      upregulated NOTCH signaling pathway
    explanation: >-
      The abstract summarizes activity across cell, organoid, and xenograft
      systems; OTHER avoids assigning this mixed preclinical statement to only
      one experimental source type.
  - reference: PMID:35931701
    reference_title: "AL101, a gamma-secretase inhibitor, has potent antitumor activity against adenoid cystic carcinoma with activated NOTCH signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AL101 therapy induced potent TGI in both models with NOTCH1 gain-of-function
      mutations (110 and 74% for ACCx9 and ACCx11, respectively; p < 0.0001)
    explanation: >-
      Patient-derived xenografts provide separate in-vivo evidence of activity in
      NOTCH1 gain-of-function ACC.
  - reference: PMID:40025676
    reference_title: "Clinical Outcomes With Notch Inhibitors in Notch-Activated Recurrent/Metastatic Adenoid Cystic Carcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NOTCH inhibitors demonstrate activity in NOTCH-activated ACC, surpassing
      the efficacy of observation or prior systemic therapies.
    explanation: >-
      A 29-patient retrospective series supports clinical activity but with only
      17% partial responses and 4.2-month median PFS, so support is PARTIAL.
- name: Brontictuzumab (Anti-NOTCH1 Antibody)
  description: >-
    Brontictuzumab is a monoclonal antibody targeting NOTCH1. Tumor growth
    inhibition in ACC patient-derived xenografts occurred exclusively in the
    model carrying an activating NOTCH1 mutation, and an index patient with
    NOTCH1-mutant ACC had a partial response, providing preliminary evidence of
    genotype-restricted activity.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: brontictuzumab
      term:
        id: NCIT:C103274
        label: Brontictuzumab
  target_mechanisms:
  - target: NOTCH1 Pathway Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Antibody blockade of NOTCH1 prevents receptor activation in tumors
      dependent on activating NOTCH1 mutations.
    evidence:
    - reference: PMID:27870570
      reference_title: "Activating NOTCH1 Mutations Define a Distinct Subgroup of Patients With Adenoid Cystic Carcinoma Who Have Poor Prognosis, Propensity to Bone and Liver Metastasis, and Potential Responsiveness to Notch1 Inhibitors."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Significant tumor growth inhibition with brontictuzumab was observed
        exclusively in the ACC patient-derived xenograft model that harbored a
        NOTCH1 activating mutation.
      explanation: >-
        Genotype-restricted activity in a NOTCH1-mutant xenograft directly links
        brontictuzumab treatment to the activated NOTCH1 mechanism.
  evidence:
  - reference: PMID:27870570
    reference_title: "Activating NOTCH1 Mutations Define a Distinct Subgroup of Patients With Adenoid Cystic Carcinoma Who Have Poor Prognosis, Propensity to Bone and Liver Metastasis, and Potential Responsiveness to Notch1 Inhibitors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Significant tumor growth inhibition with brontictuzumab was observed
      exclusively in the ACC patient-derived xenograft model that harbored a
      NOTCH1 activating mutation.
    explanation: >-
      Patient-derived xenograft data show brontictuzumab activity restricted to
      NOTCH1-mutant ACC, establishing genotype-dependent benefit.
  - reference: PMID:27870570
    reference_title: "Activating NOTCH1 Mutations Define a Distinct Subgroup of Patients With Adenoid Cystic Carcinoma Who Have Poor Prognosis, Propensity to Bone and Liver Metastasis, and Potential Responsiveness to Notch1 Inhibitors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an index patient with NOTCH1-mutant ACC had a partial response to
      brontictuzumab
    explanation: >-
      A single-patient partial response provides preliminary human evidence only,
      so support is marked PARTIAL.
- name: Lenvatinib
  description: >-
    Lenvatinib is a multitargeted VEGFR/FGFR/PDGFR tyrosine kinase inhibitor used
    in recurrent or metastatic ACC. Activity is modest — partial responses in
    about 12% of evaluable patients — and toxicity frequently requires dose
    reduction, so it is best regarded as a disease-stabilising rather than
    tumor-shrinking option.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lenvatinib
      term:
        id: CHEBI:85994
        label: lenvatinib
  evidence:
  - reference: PMID:32031693
    reference_title: "Patients with adenoid cystic carcinomas of the salivary glands treated with lenvatinib: Activity and quality of life."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 26 evaluable patients, 3 partial responses (11.5%) were reported.
    explanation: >-
      Quantifies the modest objective response rate to lenvatinib in
      recurrent/metastatic ACC.
  - reference: PMID:32031693
    reference_title: "Patients with adenoid cystic carcinomas of the salivary glands treated with lenvatinib: Activity and quality of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lenvatinib appears to have modest activity in ACC.
    explanation: >-
      The trial's own conclusion characterises lenvatinib activity in ACC as
      modest.
- name: Axitinib
  description: >-
    Axitinib improved progression-free survival compared with observation in
    progressive recurrent or metastatic ACC, but produced no objective
    responses; its demonstrated benefit is disease stabilization rather than
    tumor shrinkage.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: axitinib
      term:
        id: CHEBI:66910
        label: axitinib
  evidence:
  - reference: PMID:34315722
    reference_title: "Randomized Phase II Study of Axitinib versus Observation in Patients with Recurred or Metastatic Adenoid Cystic Carcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With a median follow-up of 25.4 months, the 6-month PFS rate was 73.0% with
      axitinib and 23.0% with observation. Median PFS was longer in the axitinib
      arm (10.8 months vs. 2.8 months, P < 0.001). The ORR of axitinib was 0.0%,
      but the disease control rate was 100.0% with axitinib and 51.9% with
      observation.
    explanation: >-
      The first randomized ACC trial demonstrates a progression-free survival
      benefit but no objective responses, warranting PARTIAL support.
- name: Rivoceranib

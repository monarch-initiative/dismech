disease_term:
  preferred_term: adenoid cystic carcinoma
  term:
    id: MONDO:0004971
    label: adenoid cystic carcinoma
description: >-
  Adenoid cystic carcinoma (ACC) is a rare epithelial malignancy that arises most
  often in the major and minor salivary glands, and also in the lacrimal gland,
  breast, tracheobronchial tree, skin, and uterine cervix. It is defined
  histologically by a biphasic population of ductal (luminal) and myoepithelial
  (abluminal, basaloid) cells arranged in cribriform, tubular, and solid
  patterns. Most tumors are driven by activation of the MYB family of
  transcription factors, classically through a t(6;9)(q22-23;p23-24)
  translocation producing a MYB-NFIB fusion that deletes the MYB 3' UTR and
  releases MYB from microRNA-mediated repression; MYBL1 rearrangements and
  high-level MYB amplification are alternative, convergent routes to the same
  MYB-driven transcriptional output. A distinct subgroup carries activating
  NOTCH1 mutations and shows solid histology, liver and bone metastasis, and
  markedly worse survival, while TERT promoter mutations mark a third, mutually
  exclusive oncogenic route. Clinically ACC is characterized by indolent but
  relentless growth, a striking propensity for perineural invasion, late
  haematogenous metastasis (predominantly to lung) that may appear more than a
  decade after treatment, and a comparatively low rate of regional lymph node
  involvement. It is largely refractory to conventional cytotoxic chemotherapy.
synonyms:
- ACC
- AdCC
- adenocystic carcinoma
- cylindroid adenocarcinoma

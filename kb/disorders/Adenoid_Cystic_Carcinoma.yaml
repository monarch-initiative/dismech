- name: Neurotropic Perineural Invasion
  biological_scale: TISSUE
  description: >-
    Perineural invasion is the single most characteristic pathophysiological
    behaviour of ACC: tumor cells track along the perineural and endoneural
    spaces of named nerves, forming a target-like cuff around nerve fascicles and
    extending microscopically far beyond the grossly visible tumor margin, in
    many cases to the skull base. Brain-derived neurotrophic factor (BDNF), a
    neurotrophin involved in neurogenesis, is uniformly expressed by ACC and is
    the leading candidate mediator of this neurotropism. Perineural spread is the
    principal reason margin-negative resection is difficult and local recurrence
    is late and frequent.
  locations:
  - preferred_term: nerve
    term:
      id: UBERON:0001021
      label: nerve
  evidence:
  - reference: PMID:12378520
    reference_title: "Perineural invasion in adenoid cystic carcinoma: Its causation/promotion by brain-derived neurotrophic factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is accounted for histologically by its infiltrative capacity and
      distinct propensity for perineural invasion.
    explanation: >-
      Attributes the lengthy clinical course and late local recurrence of ACC to
      its infiltrative capacity and perineural invasion.
  - reference: PMID:12378520
    reference_title: "Perineural invasion in adenoid cystic carcinoma: Its causation/promotion by brain-derived neurotrophic factor."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the results presented here, BDNF is unformly expressed by ACC and
      may play a causative role in its predilection for perineural invasion.
    explanation: >-
      Immunohistochemistry in 29 primary ACCs shows uniform BDNF expression; the
      authors propose but do not prove a causative role, so this is marked
      PARTIAL.
  - reference: PMID:17576903
    reference_title: "The sensitivity and specificity of high-resolution imaging in evaluating perineural spread of adenoid cystic carcinoma to the skull base."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologic evidence of PNS was present in 25 (66%) of 38 named nerves.
    explanation: >-
      Quantifies the high histopathologic frequency of perineural spread along
      named nerves in ACC undergoing cranial base resection.
  downstream:
  - target: Cranial Neuropathy and Late Local Recurrence
    description: >-
      Tumor spread along cranial nerves produces neurological deficits and leaves
      microscopic residual disease after resection.
    causal_link_type: DIRECT

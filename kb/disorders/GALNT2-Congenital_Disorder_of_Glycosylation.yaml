  description: >-
    Seven patients across four families with biallelic loss of function, which is the
    standard pattern for a congenital disorder of glycosylation.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the clinical, biochemical, and molecular features of seven patients
      from four families with GALNT2-congenital disorder of glycosylation (GALNT2-CDG), an
      O-linked glycosylation disorder.
    explanation: >-
      The multiplex-family structure on which the recessive inference rests.

animal_models:

- name: Galnt2-null mouse
  species: Mouse
  genotype: Galnt2 knockout
  publication: PMID:32293671
  description: >-
    The principal model. It matters here for a specific reason: it establishes that the
    neurodevelopmental phenotype follows from loss of the enzyme rather than from
    ascertainment or from the consanguinity of the human families, which seven patients
    could not settle on their own.
  modeled_mechanisms:
  - target: Neurodevelopmental Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces poor growth and neurodevelopmental abnormality, with cerebellar motor
      deficits, decreased sociability, and impaired sensory integration on behavioural
      testing.
    limitations: >-
      PARTIALLY rather than fully: the human phenotype's most prominent features are
      epilepsy, chronic insomnia and a disproportionate language deficit, and none of
      those has a behavioural counterpart reported in the mouse. Decreased sociability is
      an analogue of the autistic features at best.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Language is the human phenotype's most distinctive feature and has no murine
        counterpart at all, so the model structurally cannot address the part of the
        disease that most affects patients. Epilepsy and chronic insomnia are likewise
        unreported in the model. SPECIES_MISMATCH is the closest available value;
        what is meant is an incomplete phenotype, for which ModelDivergenceTypeEnum
        currently has no term (see the discussion in CLAUDE.md, which anticipates
        INCOMPLETE_PHENOTYPE as a likely addition when the taxonomy is extended to
        animal models).
    readouts:
    - name: Behavioural testing for sociability, motor coordination and sensory processing
      target: Neurodevelopmental Dysfunction
      direction: ALTERED
      interpretation: >-
        Establishes a neurodevelopmental phenotype of enzyme loss in a second species.
      evidence:
      - reference: PMID:32293671
        reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In behavioural studies, GALNT2-CDG mice demonstrated cerebellar motor deficits,
          decreased sociability, and impaired sensory integration and processing.
        explanation: >-
          The behavioural findings themselves.
  - target: Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Used as the system in which the GalNAc-T2-dependent O-glycosite network was mapped
      by quantitative glycoproteomics. Listed as MEASURES rather than RECAPITULATES
      because its role here is as an assay substrate: it is where the substrate set was
      determined, not a model of a lesion.
    limitations: >-
      The substrate network is murine. Conservation of individual O-glycosites between
      mouse and human is not established site by site, so the human substrate set is
      inferred from it rather than demonstrated.
    readouts:
    - name: Quantitative O-GalNAc glycoproteomics of Galnt2-null tissue
      target: Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
      direction: DECREASED
      interpretation: >-
        Identifies the glycoproteins that lose GalNAc-T2-specific glycans.
      evidence:
      - reference: PMID:37862385
        reference_title: "Quantitative mapping of the in vivo O-GalNAc glycoproteome in mouse tissues identifies GalNAc-T2 O-glycosites in metabolic disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We examined the Galnt2-null mouse model, which phenocopies congenital disorder
          of glycosylation involving GALNT2 and revealed a network of glycoproteins that
          lack GalNAc-T2-specific O-glycans.
        explanation: >-
          The mapping result.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rodent (mouse and rat) models of GALNT2-CDG recapitulated much of the human
      phenotype, including poor growth and neurodevelopmental abnormalities.
    explanation: >-
      Establishes the model as informative for the human disease, with the authors' own
      hedge ("much of") preserved.

- name: Galnt2-deficient rat
  species: Rat
  genotype: Galnt2 loss of function
  publication: PMID:32293671
  description: >-
    A second rodent species with the same result. Recorded because cross-species
    reproduction is what makes the growth and neurodevelopmental phenotype a robust
    consequence of enzyme loss rather than a strain artefact.
  modeled_mechanisms:
  - target: Neurodevelopmental Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces poor growth and neurodevelopmental abnormalities.
    limitations: >-
      The abstract reports rat and mouse together without separating which findings come
      from which species, so nothing specific to the rat can be curated beyond the shared
      claim.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rodent (mouse and rat) models of GALNT2-CDG recapitulated much of the human
      phenotype, including poor growth and neurodevelopmental abnormalities.
    explanation: >-
      The only statement in which the rat appears; quoted rather than split, because
      splitting it would attribute to the rat a specificity the source does not give.

diagnosis:

- name: Apolipoprotein C-III Glycoform Analysis
  description: >-
    The disease-specific biochemical test. Because apoC-III is a non-redundant GalNAc-T2
    substrate, its complete loss of O-glycosylation is a direct readout of the enzyme
    defect - unlike transferrin isoform analysis, which is the standard CDG screen and
    interrogates N-glycosylation, a pathway this disease does not affect.

    That distinction is the practical point: a GALNT2-CDG patient can screen normal on the
    routine CDG test.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients showed loss of O-glycosylation of apolipoprotein C-III, a non-redundant
      substrate for GALNT2.
    explanation: >-
      Establishes the test's sensitivity in the reported cohort: all seven patients.
  - reference: PMID:34540767
    reference_title: "Congenital Disorders of Glycosylation: What Clinicians Need to Know?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      IEF of serum apolipoprotein C-III (apoC-III) is recommended to perform (Figure 1) to
      distinguish between an exclusive N-glycosylation defect and a combined disorder of N-
      and O-glycosylation
    explanation: >-
      Places the apoC-III test in the standard CDG diagnostic algorithm rather than treating
      it as a GALNT2-CDG-specific assay. INDIRECT: this is class-level guidance for the
      congenital disorders of glycosylation, not a statement about GALNT2-CDG.
  - reference: PMID:34540767
    reference_title: "Congenital Disorders of Glycosylation: What Clinicians Need to Know?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      However, some patients could also have an abnormal biosynthesis of core 1 O-glycans,
      including those with hemolytic uremic syndrome due to Streptococcus pneumoniae.
    explanation: >-
      The specificity caveat: an abnormal apoC-III profile is not on its own diagnostic of a
      GalNAc-T2 defect, which is the reason the molecular confirmation entry below exists
      rather than the glycoform test standing alone.
  notes: >-
    Specificity, not just sensitivity. The cohort finding above establishes that every
    reported patient had the abnormality; it does not establish that the abnormality is
    specific to this disease, and the cited review names at least one acquired cause of a
    core 1 O-glycan biosynthesis abnormality. Treat a positive glycoform result as an
    indication to sequence rather than as a diagnosis.

    The claim that transferrin analysis is normal in this disease is an inference from the
    fact that GALNT2 acts on O-glycosylation while transferrin screening interrogates
    N-glycosylation. No cited source states it for GALNT2-CDG patients, so it is recorded
    here in notes rather than as an evidenced diagnostic claim.

- name: Molecular Confirmation by Next-Generation Sequencing
  description: >-
    How the diagnosis is actually established. The apoC-III glycoform test above points at
    the enzyme, but every reported patient was confirmed by sequencing, and for a disorder
    this rare with a non-specific neurodevelopmental presentation the sequencing usually
    comes first: GALNT2-CDG is the kind of entity found by exome or genome sequencing in a
    child investigated for developmental delay, with the glycoform test used to confirm
    that the variants are doing what they appear to.
  evidence:
  - reference: PMID:34540767
    reference_title: "Congenital Disorders of Glycosylation: What Clinicians Need to Know?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Since next-generation sequencing became more widely available, an improvement in
      diagnostics has been observed, with more patients and novel CDG subtypes being
      reported.
    explanation: >-
      Establishes sequencing as the route by which new CDG subtypes are identified and
      diagnosed. INDIRECT: this is a review of the congenital disorders of glycosylation as
      a class, not a statement about GALNT2-CDG, which it predates in wide recognition.

- name: Brain MRI
  description: >-
    Not diagnostic on its own, and included because the entry curates white matter changes
    as a phenotype: the finding has to be looked for to be recorded. In practice the MRI is
    performed as part of the workup for developmental delay rather than for suspected
    GALNT2-CDG.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      white matter changes on brain MRI
    explanation: >-
      Names the imaging finding in the defining cohort's phenotype description. INDIRECT
      because the source reports the finding rather than recommending the investigation.

treatments:

- name: Antiseizure Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: >-
    Symptomatic management of the epilepsy. No GALNT2-CDG-specific antiseizure data exist
    and no agent is recommended here on disease-specific grounds; the entry records the
    treatment target without asserting a drug choice.
  target_mechanisms:
  - target: Epilepsy
    treatment_effect: MODULATES
    description: >-
      Suppresses the seizure phenotype without acting on the glycosylation defect that
      produces it.
  notes: >-
    No evidence item and no therapeutic_agent, deliberately. Naming an agent would imply
    a disease-specific recommendation the literature does not support.

- name: Developmental and Educational Support
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: developmental and educational intervention
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    Speech and language therapy has the clearest rationale given that language is
    disproportionately affected. As with the antiseizure entry, this is general practice
    for a neurodevelopmental disorder rather than a GALNT2-CDG finding.
  target_mechanisms:
  - target: Neurodevelopmental Dysfunction
    treatment_effect: MODULATES
    description: >-
      Addresses the functional consequences of the neurodevelopmental phenotype. It does
      not act on the mechanism, which is unidentified.
  notes: >-
    No evidence item; general practice, not disease-specific evidence.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Autosomal recessive, 25% recurrence risk per pregnancy for carrier couples.

differential_diagnoses:

- name: Other congenital disorders of glycosylation
  description: >-
    The clinical overlap is broad - developmental delay, epilepsy and dysmorphism are
    common to much of the CDG group - but the biochemical separation is clean. Most CDGs
    are N-glycosylation or combined disorders detectable by transferrin isoform analysis;
    this one is O-glycosylation only, so it separates on which assay is abnormal rather
    than on phenotype.

- name: Non-syndromic causes of low HDL cholesterol
  description: >-
    Relevant in the other direction. Low HDL is common and usually has nothing to do with
    glycosylation; it becomes a pointer to this disease only in the presence of the
    neurodevelopmental phenotype. Common GALNT2 regulatory variants also lower HDL in the
    general population without causing disease, which is the specific confusion to avoid.
  evidence:
  - reference: PMID:37834292
    reference_title: "Apolipoprotein-CIII O-Glycosylation, a Link between GALNT2 and Plasma Lipids."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rs4846913-A, in the GALNT2-gene, was associated with decreased apo-CIII0a. This
      variant was associated with increased high-density lipoprotein cholesterol and
      decreased triglycerides
    explanation: >-
      Documents that common GALNT2 variation shifts HDL in the general population.
      INDIRECT because it supports the differential-diagnostic caution by analogy rather
      than reporting on GALNT2-CDG patients.

discussions:

- discussion_id: galnt2_brain_substrate_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which GalNAc-T2 substrate or substrates mediate the neurodevelopmental phenotype of
    GALNT2-CDG?
  rationale: >-
    The lipid arm of this disease is mechanistically complete: a named substrate, a
    measured loss of its glycosylation, and a downstream clinical readout. The
    neurological arm, which is what actually disables patients, has none of that. The
    defining paper attributes it to non-redundant substrates in various tissues including
    brain, without identifying any of them, and the causal edge in this entry is typed
    INDIRECT_UNKNOWN_INTERMEDIATES to reflect that.

    The gap is tractable rather than merely acknowledged: the Galnt2-null glycoproteomic
    atlas already lists proteins that lose GalNAc-T2-specific glycans, so the candidates
    exist and the missing step is testing which of them matters in brain.

    It also has a practical consequence. Any therapeutic strategy aimed at the
    neurological phenotype needs a target, and there is currently no candidate to aim at.
  attaches_to:
  - pathophysiology#Neurodevelopmental Dysfunction
  - pathophysiology#Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
  proposed_experiments:
  - experiment_id: galnt2_brain_glycosite_mapping
    name: Brain-restricted O-glycosite mapping and functional follow-up in Galnt2-null rodents
    description: >-
      Apply the same quantitative O-GalNAc glycoproteomics to brain regions in Galnt2-null
      animals, restrict to sites lost in brain but retained elsewhere, and test the
      resulting candidates for a neurodevelopmental role.
    readouts:
    - name: Brain-specific GalNAc-T2-dependent O-glycosites
      target: pathophysiology#Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
      direction: DECREASED
      interpretation: >-
        A brain substrate lost only in the null identifies a candidate mediator.
    would_support:
    - pathophysiology#Neurodevelopmental Dysfunction
    supporting_outcome:
    - >-
      One or more neuronal or glial proteins with essential developmental functions lose
      O-glycosylation specifically in brain, and their independent disruption reproduces
      part of the behavioural phenotype.
    would_refute:
    - pathophysiology#Neurodevelopmental Dysfunction
    refuting_outcome:
    - >-
      No brain protein loses O-glycosylation beyond those already lost in other tissues,
      which would move the explanation away from a brain-specific substrate towards a
      systemic or developmental mechanism.

- discussion_id: galnt2_redundancy_paradox
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of one of twenty GalNAc-T isoenzymes produce a severe multisystem
    disease when the family is largely redundant?
  rationale: >-
    This is the question the disease poses to glycobiology rather than a gap in the
    clinical description. Redundancy is the family's defining property, and yet losing one
    member is not tolerated. The answer implied by the literature is that non-redundancy
    is site-specific rather than protein-specific - a given isoenzyme is the only one that
    will modify a particular residue in a particular sequence context - but which features
    of a site make it GalNAc-T2-exclusive is not established.

    Worth stating because it governs how much can be generalized from apoC-III. ApoC-III
    is the one non-redundant substrate that happens to be abundant, secreted and easy to
    assay, and there is no reason to think it is representative of the others.
  attaches_to:
  - pathophysiology#Loss of GalNAc-T2 Initiation of Mucin-Type O-Glycosylation

notes: >-
  Scope. This entry covers biallelic GALNT2 loss of function. Common regulatory variation
  at the GALNT2 locus that shifts HDL in the general population is a different phenomenon
  and is curated here only as differential-diagnostic context, with INDIRECT directness.

  Deep research. An OpenScientist deep-research report for this disease is committed
  alongside this entry. It was used as a lead-generator, not as a source: its
  reference-validation block records 13 of 13 references resolving with zero
  confabulation but only 3 of 13 judged on-topic, so most of what it cites is about
  GALNT2 the lipid-GWAS locus rather than about this disease. The one lead taken from it
  was the insulin receptor as a second non-redundant substrate, which was then verified
  against the primary paper and cited from there.

  Evidence base. Five references, after this review round added one. One - the 2020 Brain
  paper defining the disease - carries the clinical phenotype, the apoC-III finding and
  the rodent models; of the remaining four, two are mechanistic, one is
  population-genetic, and one is a class-level review of the congenital disorders of
  glycosylation cited only for the diagnostic route. An earlier version of this sentence
  said "five references ... the other three", which was both wrong and
  self-contradictory: there were four. The whole clinical phenotype
  therefore rests on a single cohort of seven patients, and every phenotype here is
  graded VERY_FREQUENT rather than OBLIGATE because that source describes the syndrome in
  aggregate ("generally exhibit") rather than giving per-patient counts.

  Identifiers. OMIM 618885 is the phenotype record for this disease. It is not recorded in
  a `mappings:` block because the schema has `icd10cm_mappings`, `icd11f_mappings`,
  `mondo_mappings` and `ncit_mappings` and no OMIM slot. The number here was read from
  MONDO's own `oio:hasDbXref` on MONDO:0030043 rather than taken from the deep-research
  report, which offers it alongside a gene OMIM number this entry does not record because
  it was not independently checked.

  What this entry does not assert. It does not name a mechanism linking the enzyme defect
  to the neurological phenotype; the relevant causal edge is typed
  INDIRECT_UNKNOWN_INTERMEDIATES and the gap is recorded as a discussion. It does not
  claim normal transferrin isoform analysis in patients, although that follows from the
  pathway involved, because no cited source reports it - that inference sits in the
  diagnosis notes instead. And it names no antiseizure agent, because no
  disease-specific data support one.

pathophysiology:

- name: Biallelic GALNT2 Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion: loss of function of both GALNT2 alleles, removing the
    GalNAc-T2 isoenzyme.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GALNT2 encodes the Golgi-localized polypeptide N-acetyl-d-galactosamine-transferase
      2 isoenzyme.
    explanation: >-
      Identifies the gene product and its compartment, which is what the next node is
      about.
  downstream:
  - target: Loss of GalNAc-T2 Initiation of Mucin-Type O-Glycosylation
    causal_link_type: DIRECT
    description: >-
      Removing the enzyme removes the transfer step it catalyses.

- name: Loss of GalNAc-T2 Initiation of Mucin-Type O-Glycosylation
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    GalNAc-T2 catalyses the first committed step of mucin-type O-glycosylation, adding
    GalNAc to serine or threonine on a secreted or membrane protein as it passes through
    the Golgi.

    This is where the redundancy question sits. GalNAc-T2 is one of a family, its
    expression is broad rather than tissue-restricted, and for most substrates another
    isoenzyme can do the same job. So the consequence of losing it is not a global
    O-glycosylation failure but a failure confined to the sites only GalNAc-T2 will
    modify.
  molecular_functions:
  - preferred_term: GalNAc-T2 transferase activity
    term:
      id: GO:0004653
      label: polypeptide N-acetylgalactosaminyltransferase activity
    modifier: ABSENT
  biological_processes:
  - preferred_term: initiation of mucin-type O-glycosylation
    term:
      id: GO:0016266
      label: protein O-linked glycosylation via N-acetylgalactosamine
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GALNT2 is widely expressed in most cell types and directs initiation of mucin-type
      protein O-glycosylation.
    explanation: >-
      States the enzyme's step and its broad expression - the latter being why the
      phenotype is multisystem rather than organ-restricted.
  - reference: PMID:37862385
    reference_title: "Quantitative mapping of the in vivo O-GalNAc glycoproteome in mouse tissues identifies GalNAc-T2 O-glycosites in metabolic disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The family of GalNAc-Ts (GalNAcpolypeptide:N-Acetylgalactosaminyl transferases)
      catalyzes the first committed step in the synthesis of O-glycans, which is an
      abundant and biologically important protein modification.
    explanation: >-
      Establishes that the lost step is the committed first step of the pathway, which is
      why no downstream enzyme can compensate for a site that is never initiated.
  downstream:
  - target: Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
    causal_link_type: DIRECT
    description: >-
      Sites no other isoenzyme modifies are left unglycosylated.

- name: Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    The pivot of the disease. Most O-glycosites survive the loss of one isoenzyme; a
    minority do not, and those are what produce the phenotype.

    Apolipoprotein C-III is the substrate this was established on, and it is described as
    non-redundant for GalNAc-T2 explicitly: all seven patients lost its O-glycosylation
    entirely. That makes apoC-III both the mechanistic anchor and the diagnostic test.

    Beyond apoC-III the substrate set has been mapped rather than enumerated one at a
    time: glycoproteomics of Galnt2-null mouse tissue identifies a network of proteins
    lacking GalNAc-T2-specific glycans. That work is murine and is graded accordingly.
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients showed loss of O-glycosylation of apolipoprotein C-III, a non-redundant
      substrate for GALNT2.
    explanation: >-
      Establishes both the non-redundancy and its complete penetrance across the reported
      cohort. This single sentence carries the mechanism and the biomarker together.
  - reference: PMID:37862385
    reference_title: "Quantitative mapping of the in vivo O-GalNAc glycoproteome in mouse tissues identifies GalNAc-T2 O-glycosites in metabolic disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We examined the Galnt2-null mouse model, which phenocopies congenital disorder of
      glycosylation involving GALNT2 and revealed a network of glycoproteins that lack
      GalNAc-T2-specific O-glycans.
    explanation: >-
      Extends the substrate claim from one protein to a mapped network, in mouse tissue.
  downstream:
  - target: ApoC-III Hypoglycosylation and Altered Lipoprotein Metabolism
    causal_link_type: DIRECT
    description: >-
      The lipid arm, which runs through a named and measured substrate.
  - target: Insulin Receptor Hypoglycosylation and Altered Energy Homeostasis
    causal_link_type: DIRECT
    description: >-
      A second named substrate, and the one that plausibly connects the enzyme defect to
      the growth phenotype.
  - target: Neurodevelopmental Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neurological arm. Deliberately typed as having unknown intermediates: no brain
      substrate of GalNAc-T2 has been shown to mediate the developmental phenotype, and
      the entry does not name one.
  - target: Dysmorphic Features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The dysmorphism has no identified substrate either. It is drawn from this node rather
      than from the neurodevelopmental node because it is a morphogenetic rather than a
      neurological consequence; the source attributes both to non-redundant substrates it
      does not name.

- name: ApoC-III Hypoglycosylation and Altered Lipoprotein Metabolism
  role: mechanism
  biological_scale: ORGANISM
  description: >-
    ApoC-III normally carries a mucin-type core-1 O-glycan and circulates in glycoforms
    that differ in sialylation. Loss of GalNAc-T2 abolishes the initiating GalNAc, so no
    glycoform is made at all.

    Because apoC-III regulates triglyceride-rich lipoprotein handling, this shifts plasma
    lipids, and the clinical readout is a low HDL cholesterol. The direction is
    corroborated from a second, entirely independent direction: common variation at the
    GALNT2 locus in population cohorts shifts apoC-III glycoform proportions and shifts
    HDL and triglycerides with them.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GALNT2-CDG generally exhibit a syndrome characterized by global
      developmental delay, intellectual disability with language deficit, autistic
      features, behavioural abnormalities, epilepsy, chronic insomnia, white matter
      changes on brain MRI, dysmorphic features, decreased stature, and decreased high
      density lipoprotein cholesterol levels.
    explanation: >-
      The clinical HDL finding, quoted from the sentence that lists the whole syndrome.
  - reference: PMID:37834292
    reference_title: "Apolipoprotein-CIII O-Glycosylation, a Link between GALNT2 and Plasma Lipids."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On a genome-wide scale, we confirmed that the GALNT2-gene plays a major role i
      O-glycosylation of apolipoprotein-CIII, with subsequent associations with lipid
      parameters.
    explanation: >-
      Independent population-genetic corroboration that GALNT2 controls apoC-III
      O-glycosylation and that this tracks with lipid traits. Graded INDIRECT because it
      concerns common regulatory variation in the general population, not biallelic loss
      of function, so the claim about this disease follows by an inference step rather
      than being asserted.
  downstream:
  - target: Decreased HDL Cholesterol
    causal_link_type: DIRECT
    description: >-
      The measurable lipid endpoint.

- name: Insulin Receptor Hypoglycosylation and Altered Energy Homeostasis
  role: mechanism
  biological_scale: ORGANISM
  description: >-
    The second identified non-redundant substrate, and the reason the entry does not treat
    apoC-III as the whole of the mechanism. The insulin receptor is a GalNAc-T2 substrate,
    and Galnt2-null mice show altered insulin signalling, reduced adiposity and a shift in
    which fuel they burn.

    This matters for interpreting the human phenotype. Short stature and poor growth are
    core features of GALNT2-CDG and have no explanation in the lipid arm. A defect in
    insulin receptor glycosylation is a candidate explanation with a named substrate
    behind it, which is more than the neurological arm has.

    The caution is that the demonstration is murine. No study has shown altered insulin
    receptor glycosylation or insulin signalling in a GALNT2-CDG patient, so the human
    claim is an extrapolation and the entry marks it as such rather than curating a growth
    mechanism it cannot source in humans.
  evidence:
  - reference: PMID:35304331
    reference_title: "A novel role for GalNAc-T2 dependent glycosylation in energy homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identify the insulin receptor as a novel substrate of GalNAc-T2 and demonstrate
      that Galnt2-/- mice exhibit decreased adiposity, alterations in insulin signaling and
      a shift in energy substrate utilization in the inactive phase.
    explanation: >-
      Identifies the substrate and the metabolic consequence of losing its glycosylation.
      INDIRECT with respect to the human disease: the substrate identification and the
      signalling phenotype are both murine, so applying them to patients requires an
      inference step.
  - reference: PMID:35304331
    reference_title: "A novel role for GalNAc-T2 dependent glycosylation in energy homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It has recently become clear that loss of GALNT2 in rodents, cattle, nonhuman
      primates, and humans should be regarded as a novel congenital disorder of
      glycosylation that affects development and body weight.
    explanation: >-
      States that the growth/body-weight consequence of GALNT2 loss holds across four
      species including humans, which is what makes the murine insulin-receptor mechanism
      worth recording against the human growth phenotype rather than discarding.
  downstream:
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The edge this node's description already argues for in prose and did not draw. Typed
      with unknown intermediates rather than DIRECT for the reason stated above: the
      substrate identification and the growth phenotype are both murine, and no study has
      measured insulin receptor glycosylation or insulin signalling in a patient. It is the
      only candidate explanation for the growth phenotype with a named substrate behind it,
      which is why the edge is drawn at all rather than left out.

- name: Neurodevelopmental Dysfunction
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinically dominant arm of the disease and the least mechanistically explained.
    What is established is that it is not secondary to the lipid phenotype and that it is
    reproduced in rodents, so it is a consequence of losing the enzyme rather than an
    ascertainment artefact of the human series.

    What is not established is the intermediate. No brain substrate of GalNAc-T2 has been
    linked to the phenotype, and the defining paper attributes it to multiple
    non-redundant substrates in various tissues without naming the relevant ones.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  evidence:
  - reference: PMID:32293671
    reference_title: "Novel congenital disorder of O-linked glycosylation caused by GALNT2 loss of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The multisystem nature of phenotypes in patients and rodent models of GALNT2-CDG
      suggest that there are multiple non-redundant protein substrates of GALNT2 in
      various tissues, including brain, which are critical to normal growth and
      development.
    explanation: >-
      The authors' own framing, and the reason this node's upstream edge is typed with
      unknown intermediates: the substrates are inferred to exist, not identified.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cardinal neurodevelopmental manifestation.
  - target: Intellectual Disability with Language Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The disproportionate language involvement is the feature that most distinguishes this
      disorder's cognitive profile.
  - target: Delayed Speech and Language Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developmental counterpart of the language deficit above.
  - target: Autistic Features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported across the cohort as part of the behavioural phenotype.
  - target: Epilepsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Nothing connects the enzyme defect to seizure susceptibility mechanistically; the
      association is clinical.
  - target: Chronic Insomnia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as a distinct feature by the defining cohort rather than folded into the
      behavioural phenotype.
  - target: White Matter Changes on Brain MRI
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The one neurological finding with a structural correlate, and the reason
      oligodendrocytes are bound on this node alongside neurons. Whether the white matter
      change causes the clinical phenotype or accompanies it is not established, so this is
      drawn as a parallel consequence rather than as an intermediate.


name: GALNT2-Congenital Disorder of Glycosylation
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital disorder of glycosylation, type IIt
  term:
    id: MONDO:0030043
    label: congenital disorder of glycosylation, type IIt
synonyms:
- GALNT2-CDG
- CDG2T
- congenital disorder of glycosylation type IIt
- GalNAc-T2 deficiency
description: >-
  A recessive congenital disorder of glycosylation caused by loss of function of GALNT2,
  which encodes GalNAc-T2, one of twenty isoenzymes that initiate mucin-type O-linked
  glycosylation in the Golgi. Patients have global developmental delay, intellectual
  disability with a disproportionate language deficit, autistic features, epilepsy,
  chronic insomnia, white matter change on MRI, dysmorphic features, short stature, and
  strikingly low HDL cholesterol.

  Two features make this disease unusual among the CDGs and shaped this entry.

  The first is that the twenty GalNAc-T isoenzymes overlap heavily in substrate range, so
  losing one of them should in principle be buffered. What makes GALNT2-CDG a disease is
  the small set of substrates for which GalNAc-T2 is *not* redundant. Apolipoprotein C-III
  is the best characterised of those, and its complete loss of O-glycosylation in every
  reported patient is what turns an enzyme deficiency into a measurable biochemical
  phenotype. The entry is built around that non-redundancy rather than around a general
  loss of O-glycosylation, because the general loss does not occur.

  The second is that apoC-III is a biomarker of the enzyme defect, not the cause of the
  neurological disease. The low HDL is downstream of apoC-III hypoglycosylation; the
  developmental phenotype is not. Which brain substrate carries the neurological
  phenotype is unknown, and the entry records that as a knowledge gap rather than
  implying that the lipid arm explains the disease. Keeping those two arms separate is
  the main curation decision here.

  A third point is worth stating because it affects how the evidence should be read. The
  GALNT2 locus is one of the best-replicated common-variant HDL loci in human genetics,
  so there is a large literature associating GALNT2 with lipid traits in the general
  population. That literature is about common regulatory variation with small effects,
  not about this disease. It is cited here only where it establishes the same
  enzyme-substrate relationship, and is labelled as population-genetic evidence.


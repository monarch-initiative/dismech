    explanation: >-
      A normal-hearing homozygous V84I control limits attribution of this variant. The nucleotide notation
      is reproduced exactly from this source, which differs from the later report; this entry uses the
      protein name in its synthesis.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35677558
    reference_title: "A Connexin Gene (GJB3) Mutation in a Chinese Family With Erythrokeratodermia Variabilis, Ichthyosis and Nonsyndromic Hearing Loss: Case Report and Mutations Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing was performed in the proband’s brother for hot spot variants in NSHL-related genes
      (GJB2, GJB3, SLC26A4, and MT-RNR1).
    explanation: >-

differential_diagnoses:
- name: DFNA2A - KCNQ4-related autosomal dominant nonsyndromic hearing loss
  description: >-
    KCNQ4-related DFNA2A is an established cause of progressive, predominantly high-frequency hearing
    loss in the original DFNA2 region. It belongs in broader genetic evaluation. Audiogram-based prediction
    can prioritize testing but is not specific enough to assign causation: the AudioGene validation identified
    KCNQ4 variants in only three of 48 predicted DFNA2 families (positive predictive value 6.3%). The
    GJB3 founding families had not excluded KCNQ4 when first reported.
  evidence:
  - reference: PMID:20301388
    reference_title: DFNA2 Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DFNA2 nonsyndromic hearing loss is characterized by symmetric, predominantly
      high-frequency sensorineural hearing loss (SNHL) that is progressive across all
      frequencies.
    explanation: >-
      The DFNA2A phenotype, which is the phenotype DFNA2B is described as having. That two
      loci in one mapped interval carry the same audiogram is why the differential matters.
  - reference: PMID:20301388
    reference_title: DFNA2 Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DFNA2 nonsyndromic hearing loss is established in an individual with a
      characteristic audioprofile, a family history consistent with autosomal dominant
      inheritance, and identification of a heterozygous pathogenic variant in KCNQ4.
    explanation: >-
      The established diagnostic criteria for the alternative, against which the DFNA2B claim
      has none.
  - reference: PMID:18941426
    reference_title: Audioprofile-directed screening identifies novel mutations in KCNQ4 causing hearing loss at the DFNA2 locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those families predicted to have a DFNA2 audioprofile by AudioGene v2.0 were screened
      for mutations in the KCNQ4 gene.
    explanation: >-
      The audioprofile was used to prioritize KCNQ4 screening. The low positive predictive value
      reported in the same study limits discrimination and requires molecular confirmation.

  - reference: PMID:18941426
    reference_title: Audioprofile-directed screening identifies novel mutations in KCNQ4 causing hearing loss at the DFNA2 locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two novel missense mutations and a stop mutation were detected in three American families predicted
      to have DFNA2-related deafness for a positive predictive value of 6.3%.
    explanation: >-
      The predictive value limits audiogram-based inference; molecular confirmation is required.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Erythrokeratodermia variabilis (GJB3-related)
  description: >-
    GJB3-related erythrokeratodermia variabilis is a separately curated skin disease with Definitive ClinGen
    validity. Its variant mechanisms are diverse and cannot all be equated with the auditory trafficking
    hypothesis. In the R98H family report, the mother had ichthyosis, the daughter EKV and the son hearing
    loss. This co-occurrence is hypothesis-generating; limited testing of the son and absence of variant-specific
    functional validation prevent a secure auditory attribution.
  evidence:
  - reference: CGGV:assertion_1d48c959-31d8-44e2-985c-c48921e8f08a-2023-06-01T160000.000Z
    reference_title: GJB3 / erythrokeratodermia variabilis (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GJB3 | HGNC:4285 | erythrokeratodermia variabilis | MONDO:0017851 | AD | Definitive
    explanation: >-
      The expert-panel verdict on the differential entity, five years newer than the Disputed
      hearing-loss curation.
  - reference: PMID:35677558
    reference_title: "A Connexin Gene (GJB3) Mutation in a Chinese Family With Erythrokeratodermia Variabilis, Ichthyosis and Nonsyndromic Hearing Loss: Case Report and Mutations Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed all of them carried a heterozygous missense mutation c.293G>A
      of GJB3.
    explanation: >-
      A shared allele and differing phenotypes in one family; causation of the son's hearing loss remains
      unresolved.
    directness: INDIRECT
  - reference: PMID:35677558
    reference_title: "A Connexin Gene (GJB3) Mutation in a Chinese Family With Erythrokeratodermia Variabilis, Ichthyosis and Nonsyndromic Hearing Loss: Case Report and Mutations Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variation of clinical features may involve with genetic, epigenetic and environmental
      factors.
    explanation: >-
      The authors' own account of why one allele gave three phenotypes, which is a statement of
      not knowing.

- name: GJB2-related nonsyndromic hearing loss (DFNB1)
  description: >-
    GJB2-related hearing loss is an established alternative. In one GJB3 p.Arg180* series, 11 of 23 carriers
    also had GJB2 or SLC26A4 variants, but the abstract does not establish a complete alternative molecular
    diagnosis in each patient. Connexin-family membership or variant co-occurrence alone does not demonstrate
    digenic inheritance.
  evidence:
  - reference: PMID:22617145
    reference_title: Evaluation of the pathogenicity of GJB3 and GJB6 variants associated with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Connexins (Cx26 encoded by GJB2, Cx31 encoded by GJB3 and Cx30 encoded by GJB6) are core
      components of gap junctions in the inner ear.
    explanation: >-
      Names the three connexins that are screened and interpreted together, which is where the
      confusion arises. Graded OTHER because this sentence is background from the paper's
      introduction and reports no study of its own; the same paper's coupling result is graded
      IN_VITRO elsewhere in this entry.

    quote_role: BACKGROUND
discussions:
- discussion_id: gap_gjb3_dominant_negative_untested_in_vivo
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#GJB3
  - mechanistic_hypotheses#cx31_gap_junction_deafness
  prompt: >-
    Does a heterozygous trafficking-defective GJB3 allele cause hearing loss in any organism?
  rationale: >-
    The cited cell studies measure selected variant effects, while the cited in-vivo study tests a homozygous
    null. Heterozygous knock-in studies with age-appropriate auditory measurements could test variant-specific
    effects, but positive hearing loss alone would not distinguish dominant interference from toxic gain
    of function. Negative results for one allele or model would not resolve every human GJB3 association.
  proposed_experiments:
  - experiment_id: gjb3_knockin_heterozygote_auditory_phenotype
    name: Auditory phenotyping of mice heterozygous for a human DFNA2B GJB3 allele
    description: >-
      Compare heterozygous R180X or E183K knock-in mice with wild-type, heterozygous-null and homozygous-null
      controls across age and frequency. Measure auditory function and variant expression, connexin localization
      and coupling. Use coexpression and rescue experiments to distinguish interference with wild-type
      protein from other toxic effects.
    would_support:
    - mechanistic_hypotheses#cx31_gap_junction_deafness
    supporting_outcome:
    - >-
      A reproducible auditory phenotype linked to a specific knock-in would support that allele's in-vivo
      effect. Dominant-negative attribution would additionally require evidence of interference with wild-type
      function.
    refuting_outcome:
    - >-
      Normal hearing with verified expression and adequate observation would weaken that allele-specific
      mouse mechanism, without proving absence of human disease or justifying retirement of all DFNA2B
      associations.
- discussion_id: mismatch_gjb3_null_mouse_normal_in_skin_too
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Cx31-deficient (Gjb3 lacZ knock-in) mouse
  prompt: >-
    How do genotype, species and compensation limit interpretation of normal hearing in the Gjb3-null
    mouse?
  rationale: >-
    The null study reports normal adult skin and inner ear, but dominant EKV variants have diverse cellular
    effects. A null does not test every dominant variant mechanism in either organ. Proposed compensation
    and species differences require direct study; neither normal skin nor an EKV knock-in result automatically
    validates or invalidates an auditory model.
  proposed_experiments:
  - experiment_id: gjb3_null_mouse_skin_and_ear_reassessment
    name: Reassessment of the Gjb3-null mouse against the established skin phenotype
    description: >-
      Compare null and selected disease-variant genotypes with matched controls using skin and auditory
      assays, expression measurements and connexin localization. Test candidate compensation directly
      instead of assuming that a shared lack of phenotype establishes it.
    would_support:
    - animal_models#Cx31-deficient (Gjb3 lacZ knock-in) mouse
    supporting_outcome:
    - >-
      Reproducible genotype-specific differences would define which mechanisms and tissues the models
      capture; a skin phenotype would not independently establish auditory-model sensitivity.
    refuting_outcome:
    - >-
      Failure to reproduce a selected phenotype would identify a limitation of that genotype and assay,
      not prove that all mouse Gjb3 models are uninformative.
notes: >-
  DFNA2B remains a disputed auditory gene-disease relationship. The clinically established GJB3 skin disease
  is represented only as a differential and external assertion, not as a DFNA2B phenotype. Molecular effects
  in transfected cells, mouse auditory expression, human family associations and null-mouse outcomes are
  graded separately. Functional abnormalities do not override population, segregation or clinical-validity
  uncertainty. No robust disease prevalence, penetrance estimate or variant-confirmed natural-history
  series is inferred.

  The full Genetic Hearing Loss Overview is used for phenotype-directed diagnosis, rehabilitation, surveillance,
  counseling and noise precautions. The full DFNA2A GeneReviews chapter discusses the weak GJB3 evidence
  and the founding-family phenotype; it is not a GJB3-specific chapter. Neither source establishes GJB3-specific
  treatment efficacy. The observational newborn registry is included for its screening relevance, not
  as an intervention study.

  The ClinGen hearing-loss assertion cites PMID 12759707, independently checked at PubMed as a smoking-prevention
  editorial rather than a hearing-loss paper. It is not used as evidence, and the intended identifier
  is not guessed. Selected functional sources remained abstract-only after refetching; relevant full texts
  were used for case-control results, family testing limits, predictive performance and clinical baseline
  care.


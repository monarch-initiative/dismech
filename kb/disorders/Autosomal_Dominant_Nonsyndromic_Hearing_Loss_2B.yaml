prevalence:
- population: Chinese hearing-loss cohorts
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    The number usually quoted for DFNA2B is a variant carrier rate in a deaf cohort, and it
    does not survive comparison with controls. Among 5,700 Chinese hearing-loss patients,
    0.40% carried the heterozygous c.538C>T allele; among 4,600 normal-hearing individuals,
    0.24% did, and the difference was not statistically significant. Eleven of the 23 carriers
    also had GJB2 or SLC26A4 mutations, and all 23 were sporadic with no family history of
    deafness - which is not what a dominant disease looks like.

    Other Chinese cohorts point the same way: GJB3 mutations were not common in a 284-patient
    survey, and a putatively causative GJB3 variant accounted for 1 of 100 GJB2-heterozygous
    patients in another. No prevalence for DFNA2B as a disease can be stated, and the
    prevalence_class is UNKNOWN rather than a numeric band for that reason.
  evidence:
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5700 patients, 23 (0.40%) carried a GJB3 c.538C>T heterozygous variant; of these,
      11 patients had other gene (GJB2/SLC26A4) mutations simultaneously.
    explanation: >-
      The carrier rate in cases, and the confounding: nearly half of the carriers had a
      competing explanation.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no statistical difference in incidence between the two groups.
    explanation: >-
      The case-control comparison that makes the carrier rate uninformative about causation.
  - reference: PMID:19744334
    reference_title: Comprehensive molecular etiology analysis of nonsyndromic hearing impairment from typical areas in China.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in GJB3, GJB6, and mtDNA tRNAser(UCN) were not common in this Chinese cohort.
    explanation: >-
      An independent cohort reaching the same conclusion about how rarely GJB3 explains
      hearing loss.
  - reference: PMID:37964827
    reference_title: "Comparative analysis of allele frequencies of 15 deafness gene variants between hearing-loss and normal populations in Henan, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the allele frequencies of GJB2 c.235delC variant, GJB3 c.538C > T variant and SLC26A4 c.919-2A > G variant were significantly higher than those of the East Asian population average in the gnomAD database."
    explanation: >-
      An allele proposed as a rare dominant cause of deafness is instead more common in this
      population than the gnomAD East Asian average - which is the population-genetic form of
      the argument against it.

mechanistic_hypotheses:
- hypothesis_group_id: cx31_gap_junction_deafness
  hypothesis_label: >-
    Trafficking-defective connexin 31 disrupts cochlear gap-junction coupling and causes
    dominant high-frequency hearing loss
  status: ALTERNATIVE
  description: >-
    The proposed mechanism, and the reason it is a hypothesis group rather than this entry's
    canonical model.

    Its molecular half is solid. Connexin 31 is a gap junction subunit expressed in the inner
    ear, at high levels in adult inner hair cells and spiral ganglion neurons. Two
    hearing-loss-associated mutants are retained in the ER and in Golgi-like structures,
    fail to transfer dye between cells, and induce the ER chaperone BiP. Two further variants
    fail to couple cells even when co-expressed with wild-type Cx31, which is the shape of a
    dominant-negative effect and is what a dominant disease would need.

    Its organismal half does not exist. No animal carrying a GJB3 variant has been shown to
    hear abnormally; the Cx31-null mouse hears normally and has a structurally normal inner
    ear. No human cochlear pathology has ever been examined. The step from "these channels do
    not work in transfected cells" to "this person is deaf" has not been made in any system.

    Every causal edge below opts into this group. None of them is an established step.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, the HI-associated C×31 mutants are impaired in trafficking, promote ER
      stress, and hence lose the ability to assemble functional gap junctions.
    explanation: >-
      The molecular half of the hypothesis, measured in transfected cells.
  - reference: PMID:11237463
    reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No morphological or functional defects of skin or inner ear were observed in surviving
      adult Gjb3(-/-) mice.
    explanation: >-
      The organismal test, with a negative result in the ear and, notably, in the skin as
      well - so the mouse is uninformative about the established GJB3 disease too.

pathophysiology:

- name: Heterozygous GJB3 Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    GJB3 lies at 1p33-p35 and encodes connexin 31. The founding report described a missense
    and a nonsense variant in two families with high-frequency hearing loss; the nonsense
    allele, c.538C>T p.Arg180*, became the one routinely screened in Chinese deafness panels
    and is the one that has since failed a case-control test.

    The variants are heterozygous, which is what makes the claimed inheritance dominant and
    which sets the mechanistic requirement: a single altered allele has to produce a
    phenotype, so either haploinsufficiency or a dominant-negative effect on the wild-type
    protein is needed. Haploinsufficiency is hard to sustain given that homozygous null mice
    hear normally, so the dominant-negative reading is the live one - and the coupling
    experiments below were designed to test exactly that.
  genetic_context:
    gene:
      preferred_term: GJB3
      term:
        id: hgnc:4285
        label: GJB3
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous in the reported families. functional_impact_category is omitted
      deliberately: the trafficking data show the mutant protein is made and mislocalised
      rather than absent, and whether that constitutes loss of function or a dominant
      negative is the open question rather than something the entry can assert.
  downstream:
  - target: Connexin 31 Trafficking Failure and ER Retention
    causal_link_type: DIRECT
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      Two hearing-loss-associated variants have been shown to do this directly in transfected
      cells.
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that a missense mutation and a nonsense mutation of GJB3 were
      associated with high-frequency hearing loss in two families.
    explanation: >-
      The founding association, on two families.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed that the GJB3 c.538C>T variant has a very low incidence in the
      Chinese population, and there was no clear evidence to support a role of the GJB3
      c.538C>T variant in the autosomal dominant form of non-syndromic deafness.
    explanation: >-
      A direct case-control test of the most-screened allele, which found nothing. This is
      the strongest single human argument against DFNA2B.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 23 patients were sporadic cases and had no family history of deafness.
    explanation: >-
      Absence of family history in every carrier, which is incompatible with the allele
      acting as a dominant cause.

- name: Connexin 31 Trafficking Failure and ER Retention
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Wild-type Cx31 forms functional gap junctions at cell-cell contacts in transfected cells.
    Two hearing-impairment-associated mutants, R180X and E183K, do not: they sit in the
    endoplasmic reticulum and in Golgi-like punctate structures respectively, fail to transfer
    lucifer yellow between cells, and upregulate and bind the ER chaperone BiP, indicating ER
    stress.

    This is the same protein-level lesion that the dismech Erythrokeratodermia Variabilis
    entry describes for the skin disease - Cx31 that does not reach the membrane and so cannot
    take part in gap junction formation. The two entries agree about what happens to the
    protein. They differ in whether the resulting tissue phenotype is established, and only
    the skin one is.
  biological_processes:
  - preferred_term: gap junction assembly by connexin 31
    term:
      id: GO:0016264
      label: gap junction assembly
    modifier: DECREASED
  downstream:
  - target: Loss of Cochlear Gap-Junction Coupling
    causal_link_type: DIRECT
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      A channel subunit that never reaches the membrane cannot contribute to intercellular
      coupling.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, two HI-associated C×31 mutants, C×31R180X and C×31E183K resided primarily
      in the ER and Golgi-like intracellular punctate structures, respectively, and failed to
      mediate lucifer yellow transfer.
    explanation: >-
      The retention and dye-transfer failure, in transfected cells.
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In transfected cells, wild type C×31 protein (C×31wt) forms functional gap junction at
      cell-cell-contacts.
    explanation: >-
      The wild-type control that makes the mutant result interpretable.

- name: Loss of Cochlear Gap-Junction Coupling
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Connexin 31 is one of three connexins named as core components of inner ear gap junctions,
    alongside Cx26 (GJB2) and Cx30 (GJB6). Its expression in the ear is real: RT-PCR detected
    Gjb3 in rat inner ear tissue in the founding study, and it is developmentally regulated in
    mouse with high levels in adult inner hair cells and spiral ganglion neurons.

    The dominant-negative question is decided at this node, and it has been tested. Cx31
    p.Val27Met and p.Val84Ile each failed to function when expressed as heterozygotes
    alongside wild-type Cx31 - which is what a dominant allele needs to do, and which is why
    the hypothesis remains alive despite the mouse.

    What has never been shown is the effect of any of this on a cochlea.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  molecular_functions:
  - preferred_term: connexin 31 gap junction channel activity
    term:
      id: GO:0005243
      label: gap junction channel activity
    modifier: DECREASED
  downstream:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      The step with no evidence in any organism. The one animal in which it was tested hears
      normally.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that expression of C×31 in the mouse inner ear is developmentally regulated
      with a high level in adult inner hair cells and spiral ganglion neurons that are
      critical for the hearing process.
    explanation: >-
      Localises the protein to auditory cell types. Graded MODEL_ORGANISM because it is mouse
      inner ear tissue, in the same paper whose transfected-cell work is graded IN_VITRO.
  - reference: PMID:22617145
    reference_title: Evaluation of the pathogenicity of GJB3 and GJB6 variants associated with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results of biochemical and ionic coupling tests showed that both the Cx31-p.V27M and
      Cx31-p.V84I variants did not function normally when each was expressed as a heterozygote
      with the wild-type Cx31.
    explanation: >-
      The dominant-negative test, performed under heterozygous conditions, which is the
      configuration a dominant disease requires.
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, expression of Gjb3 was identified in rat inner ear tissue by RT-PCR.
    explanation: >-
      Expression in the inner ear, graded PARTIAL because presence of a transcript is
      consistent with a role and does not establish one.
  - reference: PMID:11237463
    reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that Cx31 is essential for early placentation but can be compensated for by
      other connexins in the embryo proper and adult mouse.
    explanation: >-
      Offers the reason the mouse is unaffected - compensation by other connexins - which is
      also the reason the mouse result does not fully settle the human question.

- name: Progressive High-Frequency Sensorineural Hearing Loss
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The claimed clinical endpoint: bilateral high-frequency hearing impairment, described in
    the founding report and repeated in reviews as postlingual and progressive.

    It is worth being precise about what the founding paper actually says, because the
    strength of the claim has drifted upward in secondary sources. Its own conclusion is that
    mutations in GJB3 "may be responsible" for bilateral high-frequency hearing impairment -
    hedged in 1998, and the hedge has not been retired since.
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that mutations in GJB3 may be responsible for bilateral
      high-frequency hearing impairment.
    explanation: >-
      The founding claim in the founding paper's own hedged wording. Graded PARTIAL because
      "may be responsible" is what the source says and is what the evidence has supported ever
      since.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Association is seen in at least 5 probands in 3 publications
    explanation: >-
      The total human evidence base for this phenotype, twenty years after the founding
      report: five probands.


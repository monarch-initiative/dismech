inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant inheritance is the proposed historical model, not a confirmed recurrence-risk model
    for a GJB3 finding. Absence of reported family history in all 23 p.Arg180* carriers in one cohort
    supplies no segregation support, but does not logically exclude dominant inheritance: family ascertainment,
    age-dependent penetrance or de novo occurrence can affect pedigrees. A 50% chance of transmitting
    a heterozygous allele must not be presented as a 50% chance of GJB3-related hearing loss while pathogenicity
    is unresolved.
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that a missense mutation and a nonsense mutation of GJB3 were
      associated with high-frequency hearing loss in two families.
    explanation: >-
      The family-based observation underlying the dominant claim.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 23 patients were sporadic cases and had no family history of deafness.
    explanation: >-
      Documents absence of reported family history; it is not direct refutation of dominant inheritance.

    quote_role: PRIMARY_RESULT
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is appropriate to offer genetic counseling (including discussion of the probability of hearing
      loss in offspring and reproductive options) to young adults who have hearing loss.
    explanation: >-
      General counseling recommendation; a disputed GJB3 attribution cannot supply a validated disease
      recurrence risk.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
animal_models:
- name: Cx31-deficient (Gjb3 lacZ knock-in) mouse
  species: Mouse
  genotype: Gjb3(-/-), targeted replacement of Gjb3 by a lacZ reporter, homozygous
  publication: PMID:11237463
  description: >-
    Targeted Gjb3 replacement produced homozygous null mice. Many homozygous embryos were lost during
    placental development, but surviving adults had no reported morphological or functional defect of
    the inner ear or skin. Placental recovery coincided with increased Cx43 expression; compensation in
    adult tissues was the authors' interpretation. This null genotype does not test a heterozygous variant
    with toxic or dominant-interfering effects. Normal null skin is not a failed test of every dominant
    EKV mechanism.
  modeled_mechanisms:
  - target: Reported Sensorineural Hearing Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Surviving adult null mice did not reproduce the auditory endpoint. The study did not directly measure
      the cell-culture coupling event represented elsewhere in this entry.
    limitations: >-
      Species differences, survivor selection, observation window and genotype limit extrapolation. Compensation
      is proposed, not a demonstrated cochlear mechanism. Human EKV variants have diverse effects, so
      the normal null skin result cannot calibrate all GJB3 disease models.
    readouts:
    - name: Inner ear morphology and auditory function in adult Gjb3-null mice
      target: Reported Sensorineural Hearing Loss
      direction: UNCHANGED
      interpretation: >-
        Normal inner-ear morphology and function in surviving adult homozygous null mice; not a direct
        cochlear gap-junction assay.

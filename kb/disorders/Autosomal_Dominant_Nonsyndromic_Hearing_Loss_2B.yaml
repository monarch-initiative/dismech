prevalence:
- population: Chinese hearing-loss cohorts
  measure_type: CARRIER_FREQUENCY
  prevalence_class: UNKNOWN
  notes: >-
    Disease prevalence is unknown. In a Chinese series, p.Arg180* heterozygotes occurred in 23/5,700 hearing-loss
    cases (0.40%) and 11/4,600 normal-hearing controls (0.24%), without a significant difference. Eleven
    case carriers had additional GJB2 or SLC26A4 variants, which require their own genotype and pathogenicity
    assessment. No family history was reported, but this alone does not exclude dominant inheritance.
    A second study of 689 hearing-loss and 1,489 control subjects found p.Arg180* allele frequencies of
    0.29% and 0.30%. Most participants were infants, limiting assessment of adult-onset effects. These
    are allele or carrier frequencies, not DFNA2B prevalence. A separate 284-patient survey sequenced
    GJB3 in 188 remaining patients and found V84I in two heterozygous cases and a homozygous normal-hearing
    control. A selected cohort of 100 GJB2 heterozygotes reported one putative GJB3 contribution; rarity
    alone neither confirms nor refutes causality.
  evidence:
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5700 patients, 23 (0.40%) carried a GJB3 c.538C>T heterozygous variant; of these,
      11 patients had other gene (GJB2/SLC26A4) mutations simultaneously.
    explanation: >-
      Observed carrier frequency and co-occurrence of other variants; the abstract does not establish
      that those variants explain each patient.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no statistical difference in incidence between the two groups.
    explanation: >-
      No significant case-control enrichment was detected for this allele; a nonsignificant result is
      not proof of no effect.
  - reference: PMID:19744334
    reference_title: Comprehensive molecular etiology analysis of nonsyndromic hearing impairment from typical areas in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in GJB3, GJB6, and mtDNA tRNAser(UCN) were not common in this Chinese cohort.
    explanation: >-
      Low variant frequency in this survey does not itself refute a rare disease. Full text distinguishes
      the 284-person cohort from the 188 sequenced for GJB3.
  - reference: PMID:37964827
    reference_title: "Comparative analysis of allele frequencies of 15 deafness gene variants between hearing-loss and normal populations in Henan, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study showed that the allele frequency of GJB3 c.538C > T variant was 0.29 % in the HL group
      and 0.30 % in the NC group (Table .3), and the difference in allele frequency between these two
      groups was not statistically significant.
    explanation: >-
      Within-study comparison, rather than the gnomAD comparison. The 15-variant panel and predominantly
      infant population limit inference about other alleles and later-onset hearing loss.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:19744334
    reference_title: Comprehensive molecular etiology analysis of nonsyndromic hearing impairment from typical areas in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GJB3 was sequenced in the remaining 188 patients.
    explanation: >-
      Full-text methods denominator: the study enrolled 284 patients overall but sequenced GJB3 in the
      remaining 188 after earlier testing.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: cx31_gap_junction_deafness
  hypothesis_label: >-
    Trafficking-defective connexin 31 disrupts cochlear gap-junction coupling and causes
    dominant high-frequency hearing loss
  status: ALTERNATIVE
  description: >-
    Selected GJB3 variants alter connexin 31 localization, induce cellular stress or reduce coupling in
    transfected cells. These effects provide a candidate molecular basis for the disputed auditory association,
    but neither expression in auditory tissue nor abnormal heterozygous coexpression proves clinical pathogenicity
    or a dominant-negative mechanism. Dominant disease could involve dosage reduction, dominant interference
    or toxic gain of function. The normal hearing of surviving Gjb3-null mice challenges a simple loss-of-function
    model but does not test a heterozygous toxic missense allele. The cited evidence does not establish
    the proposed cellular-to-human auditory chain.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, the HI-associated C×31 mutants are impaired in trafficking, promote ER
      stress, and hence lose the ability to assemble functional gap junctions.
    explanation: >-
      The molecular half of the hypothesis, measured in transfected cells.
  - reference: PMID:11237463
    reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No morphological or functional defects of skin or inner ear were observed in surviving
      adult Gjb3(-/-) mice.
    explanation: >-
      Normal inner-ear function in surviving null mice challenges simple loss of function. Species, genotype
      and survivor selection limit extrapolation to heterozygous human alleles. Normal null skin does
      not test the diverse dominant mechanisms reported for EKV.

    directness: INDIRECT
pathophysiology:
- name: Heterozygous GJB3 Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding report associated heterozygous missense and nonsense GJB3 variants with hearing loss
    in two families. GJB3 encodes connexin 31. Selected variants have measurable effects in expression
    systems, but clinical pathogenicity and penetrance remain disputed; heterozygosity alone does not
    establish causation or select among dosage, dominant-negative and toxic gain-of-function mechanisms.
    The frequently screened c.538C>T (p.Arg180*) allele lacked significant enrichment in subsequent case-control
    studies.
  genetic_context:
    gene:
      preferred_term: GJB3
      term:
        id: hgnc:4285
        label: GJB3
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous in the reported families. functional_impact_category is omitted
      deliberately: the trafficking data show the mutant protein is made and mislocalised
      rather than absent, and whether that constitutes loss of function or a dominant
      negative is the open question rather than something the entry can assert.
  downstream:
  - target: Connexin 31 Intracellular Trafficking Abnormality
    causal_link_type: DIRECT
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      Two hearing-loss-associated variants have been shown to do this directly in transfected
      cells.
  - target: Connexin 31-Associated Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      Selected mutant constructs induced BiP responses in transfected cells.
    evidence:
    - reference: PMID:21204020
      reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Expression of C×31 mutants but not C×31wt leads to upregulation of and increased association with
        the ER chaperone BiP indicating ER stress induction.
      explanation: >-
        BiP response and association support ER stress in the expression system.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: V174M-Associated Interference with Connexin 26 Trafficking
    causal_link_type: DIRECT
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      V174M-specific coexpression result; not a property assigned to all GJB3 alleles.
    evidence:
    - reference: PMID:24913888
      reference_title: "Mechanism of a novel missense mutation, p.V174M, of the human connexin31 (GJB3) in causing nonsyndromic hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CX31V174M co-expressed with either CX31WT or CX26WT studies, suggested the impairment of the ability
        of CX26WT proteins to intracellular trafficking and targeting to the plasma membrane, but did
        not influence the trafficking of CX31WT.
      explanation: >-
        Differential effect on two wild-type connexins in the coexpression system.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that a missense mutation and a nonsense mutation of GJB3 were
      associated with high-frequency hearing loss in two families.
    explanation: >-
      The founding association, on two families.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results showed that the GJB3 c.538C>T variant has a very low incidence in the
      Chinese population, and there was no clear evidence to support a role of the GJB3
      c.538C>T variant in the autosomal dominant form of non-syndromic deafness.
    explanation: >-
      The authors found no clear support for this particular allele as a dominant cause; this does not
      establish a result for every GJB3 variant.
- name: Connexin 31 Intracellular Trafficking Abnormality
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    R180X accumulated primarily in the endoplasmic reticulum and E183K in Golgi-like punctate structures
    in transfected cells. V174M accumulated in lysosomes in HeLa cells. Intracellular localization therefore
    differs by variant and is not uniformly ER retention. These findings concern selected expression constructs,
    not demonstrated human cochlear lesions. EKV-associated variants have diverse cellular effects and
    should not all be assigned this same mechanism.
  downstream:
  - target: Reduced Connexin 31-Mediated Coupling in Expression Systems
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      Trafficking abnormalities and deficient coupling co-occur in mutant expression systems. The cited
      experiments do not isolate localization from every other effect of the variants.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, two HI-associated C×31 mutants, C×31R180X and C×31E183K resided primarily
      in the ER and Golgi-like intracellular punctate structures, respectively, and failed to
      mediate lucifer yellow transfer.
    explanation: >-
      The retention and dye-transfer failure, in transfected cells.
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In transfected cells, wild type C×31 protein (C×31wt) forms functional gap junction at
      cell-cell-contacts.
    explanation: >-
      The wild-type control that makes the mutant result interpretable.

  - reference: PMID:24913888
    reference_title: "Mechanism of a novel missense mutation, p.V174M, of the human connexin31 (GJB3) in causing nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Conversely, the p.V174M missense mutation resulted in the accumulation of the mutant protein in
      the lysosomes rather than in the cytoplasmic membrane.
    explanation: >-
      Variant-specific lysosomal accumulation in HeLa cells; the clinical gene-disease relationship remains
      disputed.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Connexin 31-Associated Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  description: >-
    Expression of R180X and E183K increased the ER chaperone BiP and its association with connexin 31.
    This is a cellular stress response in transfected cells; its contribution to human hearing loss has
    not been established.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of C×31 mutants but not C×31wt leads to upregulation of and increased association with
      the ER chaperone BiP indicating ER stress induction.
    explanation: >-
      BiP response and association support ER stress in the expression system.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: V174M-Associated Interference with Connexin 26 Trafficking
  biological_scale: CELLULAR
  description: >-
    In HeLa coexpression experiments, V174M interfered with wild-type Cx26 trafficking and membrane targeting
    but did not alter wild-type Cx31 trafficking. The authors proposed trans-dominant-negative interference;
    this is not equivalent to demonstrated dominant-negative inhibition of Cx31 or proof of deafness in
    carriers.
  evidence:
  - reference: PMID:24913888
    reference_title: "Mechanism of a novel missense mutation, p.V174M, of the human connexin31 (GJB3) in causing nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CX31V174M co-expressed with either CX31WT or CX26WT studies, suggested the impairment of the ability
      of CX26WT proteins to intracellular trafficking and targeting to the plasma membrane, but did not
      influence the trafficking of CX31WT.
    explanation: >-
      Differential effect on two wild-type connexins in the coexpression system.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Reduced Connexin 31-Mediated Coupling in Expression Systems
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Selected mutants reduce intercellular dye transfer or ionic coupling in heterologous expression systems.
    V27M and V84I did not function normally when coexpressed with wild-type Cx31; this does not independently
    establish dominant-negative action or clinical pathogenicity. V174M did not form functional dye-transferring
    channels and interfered with Cx26 trafficking while sparing Cx31 wild-type trafficking. Mouse localization
    and rat transcript data support auditory expression, not direct demonstration of gap-junction coupling
    between inner hair cells or spiral ganglion neurons.
  molecular_functions:
  - preferred_term: connexin 31 gap junction channel activity
    term:
      id: GO:0005243
      label: gap junction channel activity
    modifier: DECREASED
  downstream:
  - target: Reported Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cx31_gap_junction_deafness
    description: >-
      This proposed bridge from cell-culture coupling defects to human hearing loss remains unestablished.
      Normal hearing in null mice limits a simple loss-of-function explanation.
  evidence:
  - reference: PMID:21204020
    reference_title: Trafficking abnormality and ER stress underlie functional deficiency of hearing impairment-associated connexin-31 mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that expression of C×31 in the mouse inner ear is developmentally regulated
      with a high level in adult inner hair cells and spiral ganglion neurons that are
      critical for the hearing process.
    explanation: >-
      Auditory expression in mouse tissue provides context; it does not demonstrate functional coupling
      between these cell types.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:22617145
    reference_title: Evaluation of the pathogenicity of GJB3 and GJB6 variants associated with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results of biochemical and ionic coupling tests showed that both the Cx31-p.V27M and
      Cx31-p.V84I variants did not function normally when each was expressed as a heterozygote
      with the wild-type Cx31.
    explanation: >-
      Abnormal biochemical and ionic coupling under coexpression; not a sufficient demonstration of dominant-negative
      interference or human causality.
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, expression of Gjb3 was identified in rat inner ear tissue by RT-PCR.
    explanation: >-
      Expression in the inner ear, graded INDIRECT because presence of a transcript is
      consistent with a role and does not establish one.
  - reference: PMID:24913888
    reference_title: "Mechanism of a novel missense mutation, p.V174M, of the human connexin31 (GJB3) in causing nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, dye transfer experiments have also demonstrated that the CX31V174M mutant did not form
      functional gap junction channels, probably due to the incorrect assembly or the altered properties
      of the CX31 channels.
    explanation: >-
      Dye-transfer deficiency is measured; the assembly explanation is proposed.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Reported Sensorineural Hearing Loss
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Bilateral high-frequency hearing loss was reported in the two founding families. Progressive or later-onset
    descriptions in reviews are not a validated natural-history series for a molecularly confirmed DFNA2B
    cohort. The clinical observations can be recorded without accepting the disputed attribution to GJB3.
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that mutations in GJB3 may be responsible for bilateral
      high-frequency hearing impairment.
    explanation: >-
      Founding family association, explicitly tentative about causation.
    directness: INDIRECT
  downstream:
  - target: High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      The reported clinical endpoint includes this audiometric feature; this edge does not establish its
      genetic cause.
  - target: Bilateral Involvement
    causal_link_type: DIRECT
    description: >-
      The reported clinical endpoint includes this audiometric feature; this edge does not establish its
      genetic cause.

        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          No morphological or functional defects of skin or inner ear were observed in
          surviving adult Gjb3(-/-) mice.
        explanation: >-
          Measured organismal negative result in surviving null animals.
    evidence:
    - reference: PMID:11237463

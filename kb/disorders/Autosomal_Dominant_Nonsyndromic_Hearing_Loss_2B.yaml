name: Autosomal Dominant Nonsyndromic Hearing Loss 2B
creation_date: "2026-08-28T22:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 2B
  term:
    id: MONDO:0012976
    label: autosomal dominant nonsyndromic hearing loss 2B
synonyms:
- DFNA2B
- deafness, autosomal dominant 2B
- GJB3-related autosomal dominant nonsyndromic hearing loss
- autosomal dominant nonsyndromic deafness 2B
description: >-
  DFNA2B is the proposition that heterozygous GJB3 variants cause dominant, progressive,
  high-frequency sensorineural hearing loss. It was named in 1998 from two Chinese families,
  and the ClinGen Hearing Loss Gene Curation Expert Panel has classified it Disputed since
  2018 - the strongest wording the framework offers short of Refuted, and the panel used the
  phrase "convincing evidence disputing the association".

  Three things weigh against it and they are of different kinds. Many of the reported
  variants are common in population databases or have no evidence of pathogenicity; only
  three scored in the ClinGen review. The most-screened allele, c.538C>T p.Arg180*, was found
  in 0.40% of 5,700 Chinese hearing-loss patients and 0.24% of 4,600 normal-hearing controls,
  a difference that is not significant, and all 23 carriers were sporadic with no family
  history; a second Chinese series of 2,178 subjects found the same allele at a frequency
  above the gnomAD East Asian average and concluded it may not be disease-causing. And the
  Cx31-null mouse has no morphological or functional defect of the inner ear at all.

  What is real is the protein biology. Connexin 31 is expressed in the inner ear - by RT-PCR
  in rat, and at high levels in adult mouse inner hair cells and spiral ganglion neurons -
  and hearing-loss-associated Cx31 mutants demonstrably fail to traffic, are retained in the
  ER, induce ER stress and cannot form functional channels. That is a genuine molecular
  lesion. What is missing is any demonstration that it causes deafness in a person or an
  animal.

  GJB3 does cause a disease: erythrokeratodermia variabilis, which the same expert panel
  rates Definitive and which dismech curates separately. This entry is that entity's
  disputed auditory sibling, and it is curated as contested rather than established.

parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


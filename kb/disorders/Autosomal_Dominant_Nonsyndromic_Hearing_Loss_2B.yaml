      loss in the high frequencies.
    explanation: >-
      The full DFNA2A chapter summarizes the founding GJB3 families. This is a phenotype description,
      not confirmation of the disputed genetic cause.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT

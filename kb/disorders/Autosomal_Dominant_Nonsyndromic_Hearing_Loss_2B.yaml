    The assertion's evidence summary cites PMID 12759707 among the publications in which the
    association was seen. Looked up at PubMed, that identifier is a 2003 Spanish-language
    editorial on smoking prevention in Anales del Sistema Sanitario de Navarra, so it is
    evidently a transcription error in the ClinGen record rather than a hearing-loss report.
    It is cited nowhere in this entry, and no attempt was made to guess which publication was
    intended.


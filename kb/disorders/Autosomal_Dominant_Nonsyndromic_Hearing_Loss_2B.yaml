genetic:

- name: GJB3
  gene_term:
    preferred_term: GJB3
    term:
      id: hgnc:4285
      label: GJB3
  relationship_type: DISPUTED
  notes: >-
    Typed DISPUTED to match the ClinGen Hearing Loss Gene Curation Expert Panel's own
    classification, which used the phrase "convincing evidence disputing the association".
    This is stronger than the Limited classification the same panel gives MET, and it means a
    heterozygous GJB3 variant found in a deaf patient should not be reported as the cause.

    GJB3 encodes connexin 31, a gap junction subunit expressed in epidermis and inner ear. Its
    established disease is erythrokeratodermia variabilis, which the same panel rates
    Definitive and which dismech curates as its own entry. The gene is not in doubt; this
    particular relationship is.

    A practical note on how the dispute plays out in cohorts. GJB3 remains on Chinese deafness
    screening panels, so heterozygous variants keep being reported in deaf patients. In the
    largest series, nearly half of the carriers also had GJB2 or SLC26A4 mutations. A GJB3
    variant in a patient who also carries a GJB2 variant is not evidence for DFNA2B.
  evidence:
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, there is convincing evidence disputing the association between GJB3 and
      autosomal dominant nonsyndromic hearing loss.
    explanation: >-
      The classification this relationship_type encodes.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of note, this gene has also been implicated in Erythrokeratodermia variabilis.
    explanation: >-
      The panel's own separation of the two GJB3 relationships, which is why the Disputed
      verdict is about this disease and not about the gene.
  - reference: PMID:29926981
    reference_title: "GJB3/GJB6 screening in GJB2 carriers with idiopathic hearing loss: Is it necessary?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Putatively causative GJB3 variant underlied 1% (1/100) in this cohort.
    explanation: >-
      A deliberate test of whether screening GJB3 adds diagnostic yield, which found it adds
      almost none.
  - reference: PMID:37964827
    reference_title: "Comparative analysis of allele frequencies of 15 deafness gene variants between hearing-loss and normal populations in Henan, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "our study confirmed that GJB3 c.538C > T variant may not be the disease-causing variant of hearing loss."
    explanation: >-
      A second, independent Chinese case-control series reaching the same verdict on the
      allele that carries most of the DFNA2B claim. Two such studies from different provinces
      is what makes this a replicated negative rather than one group's result.
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GJB3 was mapped to human chromosome 1p33-p35.
    explanation: >-
      The gene's map position, established in the founding study.

inheritance:

- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant transmission is what DFNA2B claims and it is also where the claim is weakest.
    The founding families segregated heterozygous variants with high-frequency hearing loss.
    But in the largest subsequent series every one of the 23 carriers of the most-screened
    allele was a sporadic case with no family history of deafness - the opposite of what
    dominant inheritance predicts, and in a sample far larger than the founding families.
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that a missense mutation and a nonsense mutation of GJB3 were
      associated with high-frequency hearing loss in two families.
    explanation: >-
      The family-based observation underlying the dominant claim.
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 23 patients were sporadic cases and had no family history of deafness.
    explanation: >-
      Directly contradicts dominant transmission for the allele that has been screened most
      widely.

animal_models:

- name: Cx31-deficient (Gjb3 lacZ knock-in) mouse
  species: Mouse
  genotype: Gjb3(-/-), targeted replacement of Gjb3 by a lacZ reporter, homozygous
  publication: PMID:11237463
  description: >-
    The only Gjb3 mouse, and its hearing is normal. Homozygotes are largely lost between
    embryonic days 10.5 and 13.5 from placental failure - the labyrinth and spongiotrophoblast
    are severely reduced at E9.5 - but the placenta recovers as connexin 43 comes up, and the
    survivors reach adulthood with no morphological or functional defect of skin or inner ear.

    The authors' own explanation is compensation by other connexins in the embryo proper and
    the adult, which is a live possibility rather than a dismissal: the cochlea expresses Cx26
    and Cx30 alongside Cx31, so redundancy there is entirely plausible. Two further caveats
    matter for reading this animal against DFNA2B. It is a null, and DFNA2B is claimed to be
    dominant, so a dominant-negative human allele is not modelled by removing the gene. And
    the mouse is also normal in skin, where GJB3 causes a Definitive human disease - so this
    animal fails to model the established GJB3 phenotype too, which is a reason to weight its
    auditory negative carefully rather than treat it as conclusive.
  modeled_mechanisms:
  - target: Loss of Cochlear Gap-Junction Coupling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete absence of Cx31 produces no inner ear defect, structural or functional, in the
      adult mouse. The hypothesis that cochlear Cx31 loss causes deafness predicts otherwise.
    limitations: >-
      Three limitations, and together they are why fidelity is LOW rather than higher. The
      model is a homozygous null and the human disease is claimed to be dominant, so a
      dominant-negative allele acting on wild-type Cx31 is not tested here. The authors
      attribute the normal phenotype to compensation by other connexins, and the cochlea
      expresses Cx26 and Cx30, so compensation is a specific and untested alternative to
      "Cx31 does not matter for hearing". Most tellingly, the same mouse is normal in skin,
      where the human GJB3 relationship is rated Definitive - so this animal demonstrably
      fails to model an established GJB3 disease, and its auditory negative cannot carry more
      weight than its dermatological one.
    readouts:
    - name: Inner ear morphology and auditory function in adult Gjb3-null mice
      target: Loss of Cochlear Gap-Junction Coupling
      direction: UNCHANGED
      interpretation: >-
        No structural or functional inner ear abnormality in the complete absence of connexin
        31. A deliberate negative result in the only animal that has tested the question.
      evidence:
      - reference: PMID:11237463
        reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          No morphological or functional defects of skin or inner ear were observed in
          surviving adult Gjb3(-/-) mice.
        explanation: >-
          The measurement behind this readout. It reports skin and inner ear together, which
          is also the sentence that establishes the model's failure in the established GJB3
          disease.
    - name: Placental labyrinth and spongiotrophoblast size at E9.5
      target: Loss of Cochlear Gap-Junction Coupling
      direction: DECREASED
      interpretation: >-
        The one phenotype the null mouse does have, recorded because it establishes that the
        targeting worked and the animal is a genuine null - so the auditory negative is not an
        artefact of a failed knockout.
      evidence:
      - reference: PMID:11237463
        reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Placentas of Gjb3(-/-) embryos at ED 9.5 were smaller than controls as a result of
          severely reduced labyrinth and spongiotrophoblast size.
        explanation: >-
          Demonstrates a real loss-of-function phenotype elsewhere, which is what makes the
          normal ear meaningful.
    evidence:
    - reference: PMID:11237463
      reference_title: Connexin31-deficiency in mice causes transient placental dysmorphogenesis but does not impair hearing and skin differentiation.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutations in the human GJB3 gene that codes for Connexin31 (Cx31), a protein subunit of
        gap junction channels, have recently been reported to cause deafness and the skin
        disorder erythrokeratodermia variabilis.
      explanation: >-
        Establishes that this mouse was built to test the human deafness claim, which is what
        makes its negative result a failure to recapitulate rather than an unrelated
        observation.

diagnosis:
- name: Interpretation of a GJB3 variant found on a deafness panel
  description: >-
    GJB3 is on hereditary hearing loss panels, particularly in China where it has been part of
    routine deafness screening for two decades, so heterozygous GJB3 variants will continue to
    be reported in deaf patients regardless of the Disputed classification. What follows is a
    reporting question rather than a testing one.

    Three things should be established before a GJB3 variant is offered as an explanation.
    Whether the patient also carries a GJB2 or SLC26A4 variant, because nearly half of the
    GJB3 carriers in the largest series did. Whether there is a family history consistent with
    dominant transmission, because none of those 23 carriers had one. And whether the
    audiogram is high-frequency, because the carriers in that series mostly had moderate to
    profound loss rather than the founding families' pattern.
  evidence:
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5700 patients, 23 (0.40%) carried a GJB3 c.538C>T heterozygous variant; of these,
      11 patients had other gene (GJB2/SLC26A4) mutations simultaneously.
    explanation: >-
      The co-occurrence rate that makes checking for a competing variant the first step.
  - reference: PMID:29926981
    reference_title: "GJB3/GJB6 screening in GJB2 carriers with idiopathic hearing loss: Is it necessary?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GJB3/GJB6 variants account for a low proportion in autosomal recessive GJB2 mutation
      carriers in our cohort.
    explanation: >-
      A study that asked directly whether GJB3 screening is worth doing and found the yield
      low.

differential_diagnoses:
- name: Erythrokeratodermia variabilis (GJB3-related)
  description: >-
    The established GJB3 disease and the one this entry must not be confused with. It is a
    disorder of cornification - transient figurate erythema with fixed hyperkeratotic plaques
    - and the same ClinGen expert panel rates the GJB3 relationship Definitive. dismech
    curates it as Erythrokeratodermia Variabilis, and the two entries agree about the protein:
    mutant Cx31 fails to reach the membrane and cannot form gap junctions. They differ in
    whether the tissue-level consequence is established.

    The entities can also co-occur in one family, which is the practically difficult case. A
    Chinese pedigree carrying a heterozygous GJB3 c.293G>A had a daughter with EKV, a mother
    with ichthyosis, and a son with nonsyndromic hearing loss - one allele, three phenotypes,
    and no explanation offered beyond genetic, epigenetic and environmental modifiers. A
    single such family is not evidence that GJB3 causes deafness; it is evidence that the
    question is hard to settle by pedigree.
  evidence:
  - reference: CGGV:assertion_1d48c959-31d8-44e2-985c-c48921e8f08a-2023-06-01T160000.000Z
    reference_title: GJB3 / erythrokeratodermia variabilis (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GJB3 | HGNC:4285 | erythrokeratodermia variabilis | MONDO:0017851 | AD | Definitive
    explanation: >-
      The expert-panel verdict on the differential entity, five years newer than the Disputed
      hearing-loss curation.
  - reference: PMID:35677558
    reference_title: "A Connexin Gene (GJB3) Mutation in a Chinese Family With Erythrokeratodermia Variabilis, Ichthyosis and Nonsyndromic Hearing Loss: Case Report and Mutations Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed all of them carried a heterozygous missense mutation c.293G>A
      of GJB3.
    explanation: >-
      The one-allele-three-phenotypes family. Graded PARTIAL because it is compatible with
      both readings of the DFNA2B question and settles neither.
  - reference: PMID:35677558
    reference_title: "A Connexin Gene (GJB3) Mutation in a Chinese Family With Erythrokeratodermia Variabilis, Ichthyosis and Nonsyndromic Hearing Loss: Case Report and Mutations Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variation of clinical features may involve with genetic, epigenetic and environmental
      factors.
    explanation: >-
      The authors' own account of why one allele gave three phenotypes, which is a statement of
      not knowing.

- name: GJB2-related nonsyndromic hearing loss (DFNB1)
  description: >-
    The commonest genetic cause of nonsyndromic hearing loss and the competing explanation
    that keeps turning up alongside GJB3 variants. In the largest GJB3 series, 11 of 23
    carriers also had a GJB2 or SLC26A4 mutation. Connexin 26 is the other core inner ear
    connexin, so the two are screened together and confused easily.
  evidence:
  - reference: PMID:22617145
    reference_title: Evaluation of the pathogenicity of GJB3 and GJB6 variants associated with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Connexins (Cx26 encoded by GJB2, Cx31 encoded by GJB3 and Cx30 encoded by GJB6) are core
      components of gap junctions in the inner ear.
    explanation: >-
      Names the three connexins that are screened and interpreted together, which is where the
      confusion arises.

discussions:

- discussion_id: gap_gjb3_dominant_negative_untested_in_vivo
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#GJB3
  - mechanistic_hypotheses#cx31_gap_junction_deafness
  prompt: >-
    Does a heterozygous trafficking-defective GJB3 allele cause hearing loss in any organism?
  rationale: >-
    The evidence base has a specific shape: everything below the tissue level supports the
    hypothesis and nothing at the tissue level tests it in the right genotype.

    Cx31 mutants are retained in the ER, induce BiP, and fail to transfer dye. Two variants
    fail to couple even alongside wild-type Cx31, which is the dominant-negative behaviour a
    dominant disease requires. But the only animal ever made is a homozygous null, and it is
    normal - and a null cannot test a dominant negative, because there is no wild-type protein
    left for the mutant to poison.

    So the decisive experiment has not been done. A mouse heterozygous for a human DFNA2B
    allele - R180X or E183K knocked in - is the direct test, and it is a standard experiment
    that nobody appears to have run in the twenty-eight years since the association was
    proposed. Until it is, the human case-control data are the best evidence available, and
    they are negative.
  proposed_experiments:
  - experiment_id: gjb3_knockin_heterozygote_auditory_phenotype
    name: Auditory phenotyping of mice heterozygous for a human DFNA2B GJB3 allele
    description: >-
      Knock the human R180X and E183K alleles into the mouse Gjb3 locus, phenotype
      heterozygotes with auditory brainstem responses and distortion-product otoacoustic
      emissions across the frequency range and across age, and examine cochlear gap junction
      plaques for Cx26 and Cx30 as well as Cx31 to test whether the mutant protein disrupts
      the other connexins.
    would_support:
    - mechanistic_hypotheses#cx31_gap_junction_deafness
    supporting_outcome:
    - >-
      Heterozygous knock-in mice develop progressive high-frequency hearing loss where nulls
      do not, which would establish a dominant-negative mechanism, explain why the null mouse
      is normal, and warrant revisiting the Disputed classification.
    refuting_outcome:
    - >-
      Heterozygotes hear normally, which together with the case-control data would leave
      DFNA2B without support in either humans or animals and would make retirement of the
      entity the right curation outcome.

- discussion_id: mismatch_gjb3_null_mouse_normal_in_skin_too
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Cx31-deficient (Gjb3 lacZ knock-in) mouse
  prompt: >-
    How much weight should the normal hearing of the Cx31-null mouse carry, given that the
    same mouse is also normal in skin, where GJB3 causes an established human disease?
  rationale: >-
    This is the strongest argument available to the pro-DFNA2B side and it should be recorded
    as such rather than buried. The single sentence that reports normal hearing in the
    Gjb3-null mouse reports normal skin in the same breath - and GJB3-erythrokeratodermia
    variabilis is rated Definitive by the same expert panel that disputes the hearing loss.
    An animal that fails to model a Definitive human disease is a weak instrument for ruling
    out a disputed one.

    There is a coherent reading in which both are explained at once. Human EKV is dominant and
    the alleles behave as dominant negatives; the mouse is a null; nulls do not model dominant
    negatives; and connexin redundancy - the authors' own explanation - covers the rest.
    Under that reading the mouse says nothing about either disease and the DFNA2B question
    turns entirely on the human data, which is where the case-control study becomes decisive.

    The alternative reading is that mouse and human connexin biology simply differ enough in
    both organs that neither negative transfers. Nothing published distinguishes these.
  proposed_experiments:
  - experiment_id: gjb3_null_mouse_skin_and_ear_reassessment
    name: Reassessment of the Gjb3-null mouse against the established skin phenotype
    description: >-
      Re-phenotype Gjb3-null and heterozygous mice with modern dermatological and auditory
      assays alongside a Gjb3 EKV-allele knock-in, and determine whether the knock-in
      reproduces the human skin phenotype. Whether the model can reproduce the Definitive
      disease sets the ceiling on what its silence about the disputed one is worth.
    would_support:
    - animal_models#Cx31-deficient (Gjb3 lacZ knock-in) mouse
    supporting_outcome:
    - >-
      A knock-in reproduces the human skin phenotype while heterozygous ears stay normal,
      which would show the model is capable of reporting a GJB3 disease and would make its
      auditory silence substantive evidence against DFNA2B.
    refuting_outcome:
    - >-
      No mouse genotype reproduces the human skin phenotype either, which would establish that
      mouse Gjb3 does not report human GJB3 disease at all and would remove the strongest
      animal argument currently cited against DFNA2B.

notes: >-
  Named entity check. GJB3 causes erythrokeratodermia variabilis, which dismech already
  curates and which the same ClinGen expert panel rates Definitive. That entry was read before
  this one was written, and the two agree about the protein: mutant connexin 31 fails to reach
  the membrane and cannot form gap junctions. They diverge only on whether the tissue-level
  consequence is established, and this entry says plainly that its own is not. Nothing
  dermatological is curated here as a DFNA2B phenotype; EKV appears under differential
  diagnoses, with its own ClinGen assertion cited alongside so the contrast is visible in the
  data rather than only in prose.

  On the questioned association, which the curation issue asked about specifically. The answer
  is that the evidence is weaker than the OMIM entry implies and the entry says so throughout
  rather than curating around it: the gene is typed DISPUTED, the mechanism is a hypothesis
  group with status ALTERNATIVE, the founding claim is graded PARTIAL because the founding
  paper itself says "may be responsible", the case-control study is cited as REFUTE in four
  separate sections, and the mouse is FAILS_TO_RECAPITULATE.

  The strongest counter-argument is recorded too. The Gjb3-null mouse is normal in skin as
  well as in ear, and GJB3-EKV is Definitive - so an animal that cannot report an established
  GJB3 disease is a poor instrument for excluding a disputed one. That is a real weakness in
  the case against DFNA2B and it is written into the animal model's limitations and into its
  own HUMAN_MODEL_MISMATCH discussion, not left out because it cuts against the entry's
  overall direction.

  A defective source in the ClinGen record. The Disputed assertion's evidence summary lists
  PMID 12759707 among the publications in which the association was seen. Looked up at PubMed,
  that identifier is a 2003 Spanish-language editorial on smoking prevention in Anales del
  Sistema Sanitario de Navarra - so it is a transcription error upstream, not a hearing-loss
  report. It is noted on the external assertion, cited nowhere, and no guess was made at which
  publication was meant.

  Evidence grading. PMID:21204020 is split: its mouse inner ear expression work is graded
  MODEL_ORGANISM and its transfected-cell trafficking work is graded IN_VITRO, because
  evidence_source describes the experiment rather than the publication. The same rule puts the
  founding paper's rat RT-PCR under MODEL_ORGANISM and its family analysis under
  HUMAN_CLINICAL.

  What is deliberately absent. No treatments: management would be generic hearing
  habilitation, there is no DFNA2B-specific evidence for any of it, and curating a treatment
  for a disputed disease would give the entity a clinical solidity the evidence does not
  support. No clinical trials, no datasets, no progression section - progressive, postlingual,
  fourth-decade onset is repeated in reviews but no primary natural-history data was found for
  it, and asserting a clinical course for a disputed entity on review prose would be the
  wrong kind of completeness.


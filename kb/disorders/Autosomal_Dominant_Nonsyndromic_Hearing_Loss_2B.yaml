diagnosis:
- name: Interpretation of a GJB3 variant found on a deafness panel
  description: >-
    Assess the hearing phenotype and pursue a multigene hearing-loss panel and/or genomic testing with
    variant interpretation appropriate to the family. KCNQ4, GJB2 and other established hearing-loss genes
    are alternatives; a particular audiogram does not establish the causal gene. A GJB3 variant, including
    an abnormal functional assay or a VUS, does not independently confirm DFNA2B. Additional GJB2 or SLC26A4
    variants are not automatically alternative diagnoses without appropriate pathogenicity, genotype and
    phase. The former four-item checklist was not a validated diagnostic algorithm.
  evidence:
  - reference: PMID:29106878
    reference_title: The relationship between the GJB3 c.538C>T variant and hearing phenotype in the Chinese population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 5700 patients, 23 (0.40%) carried a GJB3 c.538C>T heterozygous variant; of these,
      11 patients had other gene (GJB2/SLC26A4) mutations simultaneously.
    explanation: >-
      Co-occurring variants motivate broader interpretation; their presence alone does not prove an alternative
      diagnosis.
  - reference: PMID:29926981
    reference_title: "GJB3/GJB6 screening in GJB2 carriers with idiopathic hearing loss: Is it necessary?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GJB3/GJB6 variants account for a low proportion in autosomal recessive GJB2 mutation
      carriers in our cohort.
    explanation: >-
      A study that asked directly whether GJB3 screening is worth doing and found the yield
      low.
  - reference: PMID:20301388
    reference_title: DFNA2 Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DFNA2 nonsyndromic hearing loss is established in an individual with a
      characteristic audioprofile, a family history consistent with autosomal dominant
      inheritance, and identification of a heterozygous pathogenic variant in KCNQ4.
    explanation: >-
      KCNQ4 is an established differential; its diagnosis requires a pathogenic variant, not audiogram
      resemblance alone.

  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of variant(s) of uncertain significance cannot be used to confirm or rule out
      the diagnosis.
    explanation: >-
      General genetic hearing-loss interpretation guidance; directly relevant to unresolved GJB3 findings.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      does not require the clinician to determine which gene is likely involved.

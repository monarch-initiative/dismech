treatments:
- name: Hearing habilitation and communication support
  description: >-
    Offer individualized hearing-aid fitting, communication and educational support for the observed hearing
    loss. These are general hearing-loss measures and do not establish GJB3 causality or a GJB3-specific
    treatment response.
  treatment_term:
    preferred_term: hearing aid fitting and auditory rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: Medical Device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: Hearing Aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals
      with mild-to-severe hearing loss.
    explanation: >-
      This clause refers to hearing aids in the source. It is general rehabilitation guidance, not a DFNA2B
      efficacy study.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Cochlear implant assessment
  description: >-
    Assess implant candidacy according to age, hearing severity and communication needs. General guidance
    supports considering implantation in children with severe-to-profound hearing loss; no GJB3-specific
    benefit estimate is inferred.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: Medical Device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: Cochlear Implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cochlear implantation can be considered in children with severe-to-profound hearing loss who are
      older than age nine months.
    explanation: >-
      General pediatric candidacy statement; individual evaluation is required.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Audiologic follow-up
  description: >-
    Follow hearing over time and adapt rehabilitation to documented stability or progression. A DFNA2B-specific
    surveillance interval cannot be assigned from the disputed association.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Document the stability or progression of the hearing loss;
    explanation: >-
      Purpose of sequential audiologic examinations in the general overview.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Avoid repeated loud-noise overexposure
  description: >-
    Counsel people with hearing loss to avoid repeated excessive noise exposure. This is a general precaution
    and does not establish a specific GJB3-environment interaction.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      persons with documented hearing loss should be counseled appropriately and repeated overexposure
      to loud noises should be avoided.
    explanation: >-
      General hearing-loss precaution in the agents-to-avoid section.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Genetic counseling
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Discuss uncertainty, family history, broader testing and reproductive questions. Allele transmission
    and disease recurrence are distinct when pathogenicity is unresolved; do not assign a 50% hearing-loss
    risk from a GJB3 variant alone.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is appropriate to offer genetic counseling (including discussion of the probability of hearing
      loss in offspring and reproductive options) to young adults who have hearing loss.
    explanation: >-
      General counseling recommendation; a disputed GJB3 attribution cannot supply a validated disease
      recurrence risk.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
clinical_trials:
- name: NCT06133946
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Prospective observational newborn screening cohort, not a therapeutic trial. The registry lists 35,920
    enrolled infants and includes GJB3 c.538C>T among 15 screened variants. Its protocol labels this finding
    as a carrier result; it does not establish GJB3 causality or DFNA2B prevalence. Status checked 2026-09-23;
    registry last update 2023-11-18.
  evidence:
  - reference: NCT06133946
    reference_title: "Cohort of Universal Newborn Deafness-gene Screening in Nantong City, China"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This study was based on a concurrent newborn genetic and hearing screening program in Nantong city.
    explanation: >-
      Registry study description establishes observational screening scope, not therapeutic efficacy.

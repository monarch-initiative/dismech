    among pathogenic-variant carriers cannot be assigned while causality and penetrance are unresolved.
    Hearing-loss severity and audiogram frequency configuration are distinct measurements.
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
  evidence:
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that a missense mutation and a nonsense mutation of GJB3 were
      associated with high-frequency hearing loss in two families.
    explanation: >-
      The audiometric pattern in the two founding families.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1209/?report=reader
    reference_title: DFNA2 Nonsyndromic Hearing Loss - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

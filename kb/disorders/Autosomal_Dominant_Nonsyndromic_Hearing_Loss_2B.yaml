genetic:
- name: GJB3
  gene_term:
    preferred_term: GJB3
    term:
      id: hgnc:4285
      label: GJB3
  relationship_type: DISPUTED
  notes: >-
    ClinGen classifies the dominant nonsyndromic hearing-loss relationship as DISPUTED, distinct from
    the definitive EKV relationship. A GJB3 variant alone is not a confirmed molecular diagnosis of hearing
    loss. Missense and truncating alleles have been reported, but variant-specific functional effects
    do not resolve the gene-disease dispute. The common screening allele p.Arg180* was classified VUS
    in the 2023 case-control paper. GJB2/SLC26A4 co-occurrence requires independent assessment of pathogenicity,
    zygosity and phase. A 2018 family report proposed digenic GJB2/GJB3 inheritance after testing 127
    hearing-loss genes; this is a proposed multigenic explanation, not confirmation of monogenic DFNA2B.
    A 2022 R98H family had diverse skin and auditory phenotypes; the son with hearing loss received limited
    hotspot testing, whereas exome sequencing was performed only in the mother and daughter. Alternative
    causes in the son were not comprehensively excluded.
  evidence:
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, there is convincing evidence disputing the association between GJB3 and
      autosomal dominant nonsyndromic hearing loss.
    explanation: >-
      The classification this relationship_type encodes.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of note, this gene has also been implicated in Erythrokeratodermia variabilis.
    explanation: >-
      The panel's own separation of the two GJB3 relationships, which is why the Disputed
      verdict is about this disease and not about the gene.
  - reference: PMID:29926981
    reference_title: "GJB3/GJB6 screening in GJB2 carriers with idiopathic hearing loss: Is it necessary?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Putatively causative GJB3 variant underlied 1% (1/100) in this cohort.
    explanation: >-
      One putative contribution in a selected cohort of 100 GJB2 heterozygotes, not an estimate of disease
      prevalence or evidence refuting rare causation.
  - reference: PMID:37964827
    reference_title: "Comparative analysis of allele frequencies of 15 deafness gene variants between hearing-loss and normal populations in Henan, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "our study confirmed that GJB3 c.538C > T variant may not be the disease-causing variant of hearing loss."
    explanation: >-
      This independent Chinese case-control study found no significant enrichment of p.Arg180*,
      one of the two founding alleles. The 15-variant panel and predominantly infant cohort limit
      inference about other alleles and later-onset loss; non-significance does not establish absence
      of an effect.
  - reference: PMID:9843210
    reference_title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GJB3 was mapped to human chromosome 1p33-p35.
    explanation: >-
      The gene's map position, established in the founding study.

  - reference: PMID:29926981
    reference_title: "GJB3/GJB6 screening in GJB2 carriers with idiopathic hearing loss: Is it necessary?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family GDHY, we identified a rare GJB3 c.250G>A mutation, as double heterozygotes with GJB2 c.109G>A
      and/or a novel GJB2 mutation c.638T>C predicted to be damaging in a digenic inheritance after precluding
      other attributable mutations from 127 deafness genes.
    explanation: >-
      The authors proposed digenic inheritance. Their association and predictions do not establish monogenic
      GJB3 disease.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT

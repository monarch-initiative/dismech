name: Autosomal Dominant Nonsyndromic Hearing Loss 2B
creation_date: "2026-08-28T22:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 2B
  term:
    id: MONDO:0012976
    label: autosomal dominant nonsyndromic hearing loss 2B
synonyms:
- DFNA2B
- deafness, autosomal dominant 2B
- GJB3-related autosomal dominant nonsyndromic hearing loss
- autosomal dominant nonsyndromic deafness 2B
description: >-
  DFNA2B denotes the proposed association between heterozygous GJB3 variants and autosomal dominant nonsyndromic
  hearing loss. The founding report described two families with bilateral high-frequency impairment. ClinGen
  classified the relationship Disputed in 2018; this classification remained listed when checked in September
  2026. It reflects insufficient or contradictory evidence, not proof that every GJB3 allele is harmless.
  Case-control studies did not find significant enrichment of the frequently screened p.Arg180* allele,
  but their variant selection and age distributions limit generalization. Selected connexin 31 variants
  show trafficking, cellular-stress or coupling abnormalities in expression systems, whereas surviving
  homozygous null mice have normal inner-ear morphology and function. These findings do not establish
  a human deafness mechanism. The separately curated GJB3-erythrokeratodermia variabilis relationship
  is Definitive. Hearing assessment, genetic evaluation and rehabilitation remain appropriate for the
  observed phenotype while its cause is unresolved.

parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

external_assertions:
- name: ClinGen GJB3-nonsyndromic hearing loss gene-disease validity assertion
  source: ClinGen
  assertion_type: gene_disease_validity
  external_id: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
  url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
  description: >-
    The ClinGen Hearing Loss Gene Curation Expert Panel classifies the autosomal dominant
    GJB3-nonsyndromic hearing loss relationship as Disputed, approved 2018-02-27. Its
    evidence summary is unusually explicit about why: the association rested on case-level
    data only, many reported variants are present at high frequency in population databases
    or have no evidence for pathogenicity, and only three variants had enough evidence to
    score.
  evidence:
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: "GJB3 | HGNC:4285 | nonsyndromic genetic hearing loss | MONDO:0019497 | AD | Disputed"
    explanation: >-
      The expert-panel classification row, with the dominant mode of inheritance DFNA2B
      claims.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, there is convincing evidence disputing the association between GJB3 and
      autosomal dominant nonsyndromic hearing loss.
    explanation: >-
      The panel's conclusion sentence. Read together with the sentence that follows it and
      with the framework's published definition, quoted below: Disputed covers insufficient
      as well as contradictory evidence, and the panel explicitly declines to rule the
      reported evidence out.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Multiple missense and nonsense variants have been reported in humans, however many of
      these variants are present in high frequency in population databases and/or have no
      evidence for pathogenicity.
    explanation: >-
      The specific reason the reported variant count overstates the evidence.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: GJB3 / nonsyndromic genetic hearing loss (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More evidence is needed to either support or refute the role GJB3 plays in this disease.
    explanation: >-
      The panel explicitly leaves the relationship unresolved; Disputed is not equivalent to Refuted.
  - reference: PMID:30894701
    reference_title: ClinGen expert clinical validity curation of 164 hearing loss gene-disease pairs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the Disputed classification indicates that the expert panel reviewed the
      evidence and disputed the claim due to insufficient or contradictory evidence.
    explanation: >-
      The HL GCEP's own published definition of what Disputed means. It covers insufficient
      evidence as well as contradictory evidence, which is why this entry does not gloss the
      classification as a positive assertion that GJB3 is not a deafness gene.
  - reference: CGGV:assertion_f83e013a-685f-405b-89d6-a8e80aefaf6e-2018-02-27T170000.000Z
    reference_title: "GJB3 / nonsyndromic genetic hearing loss (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Association is seen in at least 5 probands in 3 publications
    explanation: >-
      A dated minimum in the 2018 assertion, not the exact worldwide total or evidence against the phenotype.
    directness: DIRECT
  notes: >-
    The same expert panel classifies GJB3-erythrokeratodermia variabilis as Definitive. One
    gene, two curations by the same group, opposite verdicts - which is the cleanest possible
    demonstration that a gene's disease relationships have to be assessed one at a time.

    The assertion's evidence summary cites PMID 12759707 among the publications in which the
    association was seen. Looked up at PubMed, that identifier is a 2003 Spanish-language
    editorial on smoking prevention in Anales del Sistema Sanitario de Navarra, so it is
    evidently a transcription error in the ClinGen record rather than a hearing-loss report.
    It is cited nowhere in this entry, and no attempt was made to guess which publication was
    intended.

- name: ClinGen GJB3-erythrokeratodermia variabilis gene-disease validity assertion
  source: ClinGen
  assertion_type: gene_disease_validity

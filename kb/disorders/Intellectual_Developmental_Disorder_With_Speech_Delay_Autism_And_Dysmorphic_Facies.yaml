discussions:
- discussion_id: cnot3_heterozygous_mouse_gap
  prompt: >-
    Why does heterozygous loss of CNOT3 cause a neurodevelopmental disorder in
    humans when conditional heterozygous mice have normal cortical size?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Cortical Neurogenesis
  rationale: >-
    The only in vivo neural model removes both Cnot3 copies and produces
    severe microcephaly, while patients are heterozygous and only a minority
    are microcephalic. The mouse result shows CNOT3 is required for
    neurogenesis but does not show which dosage-sensitive targets produce the
    human cognitive and behavioural phenotype.
  evidence:
  - reference: PMID:39913536
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, conditional heterozygous (cHet) brain sizes were comparable
      to control.
    explanation: >-
      Heterozygous mice lack the gross brain phenotype of the knockout.
animal_models:
- name: Emx1-Cre Cnot3 conditional knockout mouse
  species: Mouse
  genotype: Emx1-Cre; Cnot3 lox/lox
  publication: PMID:39913536
  description: >-
    Cortical progenitor-specific deletion of Cnot3 causes microcephaly from
    altered progenitor fate and p53-dependent apoptosis; heterozygous deletion
    leaves brain size normal.
  modeled_mechanisms:
  - target: Dysregulated Cortical Neurogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Shows that CNOT3-dependent mRNA decay is required for cortical
      neurogenesis.
    limitations: >-
      Homozygous conditional deletion, whereas patients are heterozygous; the
      heterozygous mouse has no gross cortical phenotype.
    evidence:
    - reference: PMID:39913536
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conditional knockout of Cnot3 in neural progenitors and their progeny in
        the developing mouse cortex leads to severe microcephaly due to altered
        cell fate and p53-dependent apoptosis.
      explanation: >-
        The knockout phenotype in cortex.

name: Intellectual Developmental Disorder with Speech Delay, Autism, and Dysmorphic Facies
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
synonyms:
- IDDSADF
- CNOT3-related neurodevelopmental disorder
- CNOT3-associated neurodevelopmental disorder
description: >-
  Intellectual developmental disorder with speech delay, autism, and
  dysmorphic facies (IDDSADF; OMIM 618672) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous variants in CNOT3, which
  encodes a non-catalytic scaffold subunit of the CCR4-NOT complex, the main
  cytoplasmic mRNA deadenylase. Most variants arise de novo, but parent-to-child
  transmission with variable expressivity is documented. Protein-truncating,
  splice, intragenic deletion and missense alleles (the missense clustered at
  the N- and C-terminal domains) show no clear genotype-phenotype correlation,
  and haploinsufficiency is the accepted mechanism. All affected individuals
  have developmental delay that is most marked for language; intellectual
  disability is present in most and is usually mild to moderate. Autism
  spectrum disorder or autistic traits, attention deficit, and other
  behavioural problems affect over half. Neonatal hypotonia, feeding
  difficulty, motor delay, short stature in about a quarter, and a facial
  gestalt with a high broad forehead, upslanting palpebral fissures, a thin
  upper lip and nasal anomalies are common; epilepsy is uncommon. Brain MRI
  may show corpus callosum hypoplasia, and moyamoya angiopathy and aortic
  dilatation have been reported. In the developing mouse cortex, CCR4-NOT
  deadenylation tunes mRNA stability during neurogenesis, and complete Cnot3
  loss in neural progenitors causes microcephaly; how heterozygosity alters
  human brain development is not yet known.
disease_term:
  preferred_term: intellectual developmental disorder with speech delay, autism, and dysmorphic facies
  term:
    id: MONDO:0032864
    label: intellectual developmental disorder with speech delay, autism, and dysmorphic facies
parents:
- Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  ClinGen curates CNOT3 as Definitive for the broader "complex
  neurodevelopmental disorder" (MONDO:0100038), not for this MONDO term, so no
  gene_disease_validity assertion is recorded here. A patient with
  co-occurring truncating CNOT3 and SMAD6 variants had severe congenital heart
  disease attributed to the SMAD6 variant (PMID:34208845); cardiac defects
  are therefore not listed as a core feature.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:

name: Intellectual Developmental Disorder with Speech Delay, Autism, and Dysmorphic Facies
creation_date: "2026-10-19T20:56:26Z"
category: Mendelian
synonyms:
- IDDSADF
- CNOT3-related neurodevelopmental disorder
- CNOT3-associated neurodevelopmental disorder
description: >-
  Intellectual developmental disorder with speech delay, autism, and
  dysmorphic facies (IDDSADF; OMIM 618672) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous variants in CNOT3, which
  encodes a non-catalytic scaffold subunit of the CCR4-NOT complex, the main
  cytoplasmic mRNA deadenylase. Most variants arise de novo, but parent-to-child
  transmission with variable expressivity is documented. Protein-truncating,
  splice, intragenic deletion and missense alleles (the missense clustered at
  the N- and C-terminal domains) show no clear genotype-phenotype correlation,
  and haploinsufficiency is the accepted mechanism. All affected individuals
  have developmental delay that is most marked for language; intellectual
  disability is present in most and is usually mild to moderate. Autism
  spectrum disorder or autistic traits, attention deficit, and other
  behavioural problems affect over half. Neonatal hypotonia, feeding
  difficulty, motor delay, short stature in about a quarter, and a facial
  gestalt with a high broad forehead, upslanting palpebral fissures, a thin
  upper lip and nasal anomalies are common; epilepsy is uncommon. Brain MRI
  may show corpus callosum hypoplasia, and moyamoya angiopathy and aortic
  dilatation have been reported. In the developing mouse cortex, CCR4-NOT
  deadenylation tunes mRNA stability during neurogenesis, and complete Cnot3
  loss in neural progenitors causes microcephaly; how heterozygosity alters
  human brain development is not yet known.
disease_term:
  preferred_term: intellectual developmental disorder with speech delay, autism, and dysmorphic facies
  term:
    id: MONDO:0032864
    label: intellectual developmental disorder with speech delay, autism, and dysmorphic facies
parents:
- Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  ClinGen curates CNOT3 as Definitive for the broader "complex
  neurodevelopmental disorder" (MONDO:0100038), not for this MONDO term, so no
  gene_disease_validity assertion is recorded here. A patient with
  co-occurring truncating CNOT3 and SMAD6 variants had severe congenital heart
  disease attributed to the SMAD6 variant (PMID:34208845); cardiac defects
  are therefore not listed as a core feature.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants, usually de novo; familial transmission with
    variable expressivity has been described. Parental gonosomal mosaicism
    was found in 2 of 42 families, so recurrence after an apparently de novo
    case may exceed 1%.
  evidence:
  - reference: PMID:32720325
    reference_title: "Inherited cases of CNOT3-associated intellectual developmental disorder with speech delay, autism, and dysmorphic facies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report for the first time autosomal dominant transmissions of the
      CNOT3-associated developmental disorder in two unrelated families.
    explanation: >-
      Documents dominant parent-to-child transmission.
  - reference: PMID:38179413
    reference_title: "Novel In-Frame Deletion CNOT3 Variant in a Family With Intellectual Developmental Disorder With Speech Delay and Dysmorphic Facies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we describe a rare case of autosomal dominant inherited
      familial IDDSADF caused by a novel heterozygous pathogenic in-frame
      deletion CNOT3 variant.
    explanation: >-
      A third family with maternally transmitted disease.
  - reference: PMID:31201375
    reference_title: "De novo variants in CNOT3 cause a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This paper describes molecular and clinical details of 16 probands with
      developmental disorders and de novo CNOT3 variants.
    explanation: >-
      The founding series consisted of de novo heterozygous variants.
  - reference: PMID:40562808
    reference_title: "Comprehensive analysis of CNOT3-related neurodevelopmental disorders: phenotypic and genotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, parental gonosomal mosaicism was reported in 2 of the 42
      families of our cohort. Considering that parental segregation could not
      be performed in 6 families, and the unknown rate of germline mosaicism,
      the recurrence risk for de novo CNOT3 mutations could be higher than 1%.
    explanation: >-
      Parental mosaicism means apparently de novo cases carry a recurrence
      risk above the background.
genetic:
- name: CNOT3
  gene_term:
    preferred_term: CNOT3
    term:
      id: hgnc:7879
      label: CNOT3
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous loss-of-function variants: nonsense, frameshift, splice-site,
    an in-frame deletion, intragenic deletions, and missense variants
    clustered at the N- and C-terminal regions. Loss of function is the
    accepted mechanism, but three of eight unrelated patients with epilepsy
    share the missense p.(Arg188His), and the authors raise a possible
    different effect, such as gain of function, for that allele; this is
    untested.
  evidence:
  - reference: PMID:31201375
    reference_title: "De novo variants in CNOT3 cause a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a result of exome-based sequencing work performed by the DDD study,
      de novo variants in CNOT3 have emerged as a newly recognised cause of a
      developmental disorder.
    explanation: >-
      Establishes CNOT3 as the disease gene.
  - reference: PMID:40562808
    reference_title: "Comprehensive analysis of CNOT3-related neurodevelopmental disorders: phenotypic and genotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study investigates 51 patients from 42 families with heterozygous
      CNOT3 variants, aiming to expand the understanding of CNOT3-related
      neurodevelopmental disorders and explore genotype-phenotype correlations.
    explanation: >-
      The largest cohort, confirming the gene-disease relationship across 42
      families.
pathophysiology:
- name: CNOT3 Haploinsufficiency
  description: >-
    Heterozygous truncating, splice and missense CNOT3 variants reduce the
    amount of functional CNOT3. Patient blood shows reduced CNOT3 mRNA and
    altered expression of other CCR4-NOT subunits. CNOT3 is a non-catalytic
    subunit; its C terminus binds the rest of the complex, and loss of CNOT3
    lowers the level of the CNOT1 scaffold, so its molecular role is to hold
    the deadenylase complex together rather than to catalyse deadenylation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CNOT3
    term:
      id: hgnc:7879
      label: CNOT3
  molecular_functions:
  - preferred_term: CCR4-NOT complex adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:31201375
    reference_title: "De novo variants in CNOT3 cause a variable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency appears to be the most likely mechanism of action,
      with eight cases found to have protein-truncating variants.
    explanation: >-
      Half of the founding series carried truncating alleles.
  - reference: PMID:40562808
    reference_title: "Comprehensive analysis of CNOT3-related neurodevelopmental disorders: phenotypic and genotypic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No clear genotype-phenotype correlation was observed, suggesting that all
      identified variants resulted in a loss-of-function effect.
    explanation: >-
      Missense and truncating alleles produce the same phenotype, consistent
      with loss of function.
  - reference: PMID:36802310
    reference_title: "Clinical features of CNOT3-associated neurodevelopmental disorder in three Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The functional study showed that the CNOT3 mRNA levels were significantly
      decreased in the peripheral blood of two patients with c.1058_1059insT and
      c.387 + 2 T > C variants, respectively
    explanation: >-
      Direct measurement of reduced CNOT3 transcript in patients.
  - reference: PMID:27746116
    reference_title: "CNOT3-Dependent mRNA Deadenylation Safeguards the Pluripotent State."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, CNOT3 C terminus is required for its interaction with
      the complex and its function in embryonic stem cells (ESCs).
    explanation: >-
      Supports the adaptor role: CNOT3 function depends on its binding to the
      rest of the CCR4-NOT complex.
  - reference: PMID:39913536
    reference_title: "mRNA stability fine-tunes gene expression in the developing cortex to control neurogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As CNOT1 is essential for scaffolding the complex, this suggests that the
      integrity of the entire CCR4-NOT complex may be impaired in this mouse
      model.
    explanation: >-
      Loss of Cnot3 in mouse cortex lowers CNOT1, consistent with CNOT3
      holding the complex together.
  downstream:
  - target: Impaired CCR4-NOT mRNA Deadenylation
    causal_link_type: DIRECT
- name: Impaired CCR4-NOT mRNA Deadenylation
  description: >-
    CNOT3 is required for CCR4-NOT complex integrity and for efficient
    poly(A) tail shortening and decay of target mRNAs. Reduced CNOT3 is
    expected to lengthen poly(A) tails and stabilise transcripts that should
    be cleared as cells change state. This step is established in mouse
    embryonic stem cells and progenitors; it has not been measured in patient
    neural tissue.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  protein_complexes:
  - preferred_term: CCR4-NOT complex
    term:
      id: GO:0030014
      label: CCR4-NOT complex
  biological_processes:
  - preferred_term: mRNA poly(A) tail shortening
    term:
      id: GO:0000289
      label: nuclear-transcribed mRNA poly(A) tail shortening
    modifier: DECREASED
  evidence:
  - reference: PMID:27746116
    reference_title: "CNOT3-Dependent mRNA Deadenylation Safeguards the Pluripotent State."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, Cnot3 deletion results in increases in the poly(A) tail
      lengths, half-lives, and steady-state levels of differentiation gene
      mRNAs.
    explanation: >-
      Loss of CNOT3 impairs deadenylation and stabilises target mRNAs.
  - reference: PMID:36802310
    reference_title: "Clinical features of CNOT3-associated neurodevelopmental disorder in three Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found that CNOT3 deficiency was linked to alterations of
      expression levels of other CCR4-NOT complex subunits in mRNA level in the
      peripheral blood.
    explanation: >-
      Patient cells show perturbation of the wider complex.
  downstream:
  - target: Dysregulated Cortical Neurogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39913536
      reference_title: "mRNA stability fine-tunes gene expression in the developing cortex to control neurogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using compound mouse genetics, we discover CNOT3, a core component of
        the CCR4-NOT deadenylase complex linked to neurodevelopmental disease,
        is essential for cortical development.
      explanation: >-
        Links CNOT3-dependent mRNA decay to cortical development in vivo.
- name: Dysregulated Cortical Neurogenesis
  description: >-
    During cortical development, mRNA stability is tuned so that transcripts
    rising across development are stable and falling ones are labile. Complete
    Cnot3 loss in mouse neural progenitors alters progenitor fate and triggers
    p53-dependent apoptosis, with severe microcephaly and loss of deep-layer
    neurons. Heterozygous loss leaves mouse brain size normal, so the human
    phenotype is assumed to reflect a subtler, dosage-sensitive disturbance of
    the same process.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39913536
    reference_title: "mRNA stability fine-tunes gene expression in the developing cortex to control neurogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional knockout of Cnot3 in neural progenitors and their progeny in
      the developing mouse cortex leads to severe microcephaly due to altered
      cell fate and p53-dependent apoptosis.
    explanation: >-
      Homozygous conditional loss disrupts cortical neurogenesis.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

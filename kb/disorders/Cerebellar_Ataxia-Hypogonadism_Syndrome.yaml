has_subtypes:
- name: RNF216-related Gordon Holmes syndrome
  genes:
  - preferred_term: RNF216
    term:
      id: hgnc:21698
      label: RNF216
  description: Recessive RNF216 disease with ataxia, central hypogonadism and variable cognitive decline, white-matter changes or movement disorders. Endocrine signs may precede neurologic disease.
  evidence:
  - reference: PMID:39444518
    reference_title: Hypogonadotropic Hypogonadism as First Presentation of the Severe Neuroendocrine Disorder Caused by RNF216.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: hypogonadotropic hypogonadism may be the initial manifestation of this severe neuroendocrine disorder, especially in males.
    explanation: RNF216 disease can first present to endocrine care.
- name: RNF216/OTUD4-related Gordon Holmes syndrome
  genes:
  - preferred_term: RNF216
    term:
      id: hgnc:21698
      label: RNF216
  - preferred_term: OTUD4
    term:
      id: hgnc:24949
      label: OTUD4
  description: Reported two-locus form with homozygous variants in both genes in three affected siblings; functional interaction was supported by zebrafish knockdown and rescue.
  evidence:
  - reference: PMID:23656588
    reference_title: "Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Digenic homozygous mutations in RNF216 and OTUD4, which encode a ubiquitin E3 ligase and a deubiquitinase, respectively, were found in three affected siblings in a consanguineous family."
    explanation: >-
      The discovery study reports the two-locus genotype and its co-segregation
      with disease in three affected siblings.

- name: STUB1-related Gordon Holmes syndrome
  genes:
  - preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  description: The recessive ataxia-hypogonadism presentation of STUB1 disease. The original Thr246Met sisters had cerebellar atrophy, hypogonadism and selective cognitive deficits. This subtype does not encompass all recessive or dominant STUB1 ataxias.
  evidence:
  - reference: PMID:24113144
    reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that GHS can be caused by a loss-of-function mutation in CHIP.
    explanation: The discovery family establishes a STUB1-related GHS form.
  review_notes: MONDO:0014339 covers any recessive STUB1 cerebellar ataxia, according to its current definition inspected with runoak -i sqlite:obo:mondo info MONDO:0014339 -O obo. It is broader than the ataxia-hypogonadism presentation represented here and is not asserted as an exact subtype identity.
- name: PNPLA6-related Gordon Holmes syndrome
  genes:
  - preferred_term: PNPLA6
    term:
      id: hgnc:16268
      label: PNPLA6
  description: The ataxia-hypogonadotropic hypogonadism presentation of biallelic PNPLA6 disease, often with brisk reflexes. Boucher-Neuhauser, Oliver-McFarlane and SPG39 presentations belong to the broader overlapping PNPLA6 spectrum and are not listed as GHS subtypes.
  evidence:
  - reference: PMID:25299038
    reference_title: PNPLA6 Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Gordon Holmes syndrome (cerebellar ataxia, hypogonadotropic hypogonadism, and – to a variable degree – brisk reflexes)
    explanation: GeneReviews distinguishes the GHS cluster within the overlapping PNPLA6 spectrum.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24355708
    reference_title: PNPLA6 mutations cause Boucher-Neuhauser and Gordon Holmes syndromes as part of a broad neurodegenerative spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: both clinically distinct entities are allelic for recessive mutations in the gene PNPLA6.
    explanation: The discovery study connects both GHS and Boucher-Neuhauser clinical clusters to biallelic PNPLA6 variation.
diagnosis:
- name: Molecular genetic diagnosis
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Investigate the clinical ataxia-hypogonadism phenotype with molecular testing of relevant genes, using panel or genomic approaches and segregation as appropriate. PNPLA6 disease requires biallelic pathogenic variants; variants of uncertain significance alone do not establish the diagnosis.
  evidence:
  - reference: PMID:25299038
    reference_title: PNPLA6 Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of a PNPLA6 disorder is established in a proband with suggestive findings and biallelic PNPLA6 pathogenic variants identified on homologous alleles by molecular genetic testing.
    explanation: GeneReviews defines molecular confirmation for the PNPLA6 form.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:23656588
    reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed whole-exome sequencing in a patient with ataxia and hypogonadotropic hypogonadism, followed by targeted sequencing of candidate genes in similarly affected patients.
    explanation: The discovery study demonstrates a phenotype-led genomic and targeted testing strategy.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK247161/
    reference_title: PNPLA6 Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: variant of uncertain significance) does not establish or rule out the diagnosis.
    explanation: GeneReviews explicitly cautions that biallelic VUS, or one pathogenic variant with one VUS, do not establish or exclude PNPLA6 disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK247161/
    reference_title: PNPLA6 Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the next step is to perform gene-targeted ... deletion/duplication analysis ... to detect exon and whole-gene deletions or duplications.
    explanation: GeneReviews recommends subsequent gene-targeted deletion/duplication analysis when initial sequencing is incomplete.
    quote_role: REVIEW_SYNTHESIS
  notes: Single-gene sequence analysis may require deletion/duplication analysis if one or no pathogenic variant is detected; panels or genomic approaches are selected according to the clinical presentation.
- name: Brain MRI
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Assess cerebellar atrophy and cerebral white-matter abnormalities. Imaging supports the phenotype and longitudinal assessment but does not identify the causal genotype by itself.
  evidence:
  - reference: PMID:37161390
    reference_title: A novel mutation in RNF216 gene in a Turkish case with Gordon Holmes syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain magnetic resonance imaging (MRI) revealed progressive cerebellar, vermian, and cerebral cortical atrophy, and periventricular confluent white matter hyperintensities in 2022 compared to 2018.
    explanation: Serial MRI documents progressive structural abnormalities in one RNF216 case.
- name: Reproductive endocrine evaluation
  description: Assess puberty, sex steroids and gonadotropins in clinical context. Selected cases undergo dynamic evaluation to characterize hypothalamic and pituitary contributions; preserved early responses do not exclude later dysfunction.
  evidence:
  - reference: PMID:23656588
    reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Defects were detected at the hypothalamic and pituitary levels of the reproductive endocrine axis.
    explanation: The original clinical investigation localizes central endocrine dysfunction.
  - reference: PMID:27441066
    reference_title: Ataxia and Hypogonadotropic Hypogonadism with Intrafamilial Variability Caused by RNF216 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Reproductive endocrine evaluation in both patients revealed only low levels of LH and testosterone, no other pituitary hormones were affected.
    explanation: The RNF216 brothers illustrate a selective reproductive endocrine deficit.
progression:
- phase: Endocrine-first presentation
  subtype: RNF216-related Gordon Holmes syndrome
  notes: Hypogonadotropic hypogonadism may precede overt neurologic signs. A normal neurologic examination during an endocrine presentation does not exclude later disease.
  evidence:
  - reference: PMID:39444518
    reference_title: Hypogonadotropic Hypogonadism as First Presentation of the Severe Neuroendocrine Disorder Caused by RNF216.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: hypogonadotropic hypogonadism may be the initial manifestation of this severe neuroendocrine disorder, especially in males.
    explanation: The report documents an endocrine-first presentation.
- phase: Variable neurologic progression
  subtype: RNF216-related Gordon Holmes syndrome
  notes: Ataxia and cognitive dysfunction may progress substantially, with intrafamilial variation. Available cases do not establish a reliable survival estimate or a uniform progression rate.
  evidence:
  - reference: PMID:27441066
    reference_title: Ataxia and Hypogonadotropic Hypogonadism with Intrafamilial Variability Caused by RNF216 Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His disease progressively worsened with clear cognitive deterioration and need for support in daily activities to the degree that he became totally dependent.
    explanation: The older RNF216 brother developed severe functional dependence; the younger brother had milder disease at assessment.
- phase: Slowly progressive PNPLA6-related ataxia
  subtype: PNPLA6-related Gordon Holmes syndrome
  notes: A mixed PNPLA6 cohort that included three GHS cases showed slow cerebellar progression with retained ambulation. The cohort mean is not a GHS-specific prognosis.
  evidence:
  - reference: PMID:35069422
    reference_title: 'Multifaceted and Age-Dependent Phenotypes Associated With Biallelic PNPLA6 Gene Variants: Eight Novel Cases and Review of the Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Progression of cerebellar symptoms was slow in all patients, who retained ambulation even after a mean disease duration of 15 years.
    explanation: The observation covers all ataxic patients in a mixed PNPLA6 cohort, including GHS and other phenotypes.

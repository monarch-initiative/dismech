animal_models:
- name: Constitutive Rnf216 knockout mouse
  species: Mus musculus
  genotype: Rnf216-/-
  description: Constitutive deletion model followed through one year for motor and learning behaviors, with sex-specific microglial and electrophysiological analyses.
  evidence:
  - *id001
  - reference: PMID:38164552
    reference_title: Gordon Holmes Syndrome Model Mice Exhibit Alterations in Microglia, Age, and Sex-Specific Disruptions in Cognitive and Proprioceptive Function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we were unable to detect motor impairments or other measures of behavior that would be indicative of ataxia in these mice
    explanation: The tested constitutive knockout failed to reproduce overt ataxia within the observation period.
  modeled_mechanisms:
  - target: Altered microglial state in RNF216 models
    relationship: RECAPITULATES
    description: Demonstrates the model-specific microglial state changes described by this node.
    evidence:
    - reference: PMID:38164552
      reference_title: Gordon Holmes Syndrome Model Mice Exhibit Alterations in Microglia, Age, and Sex-Specific Disruptions in Cognitive and Proprioceptive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: KO mice also showed age-dependent strategy and associative learning impairments with sex-dependent alterations of microglia in the hippocampus and cortex.
      explanation: Constitutive Rnf216 loss is associated with sex- and region-dependent microglial changes and age-dependent learning phenotypes. Their causal relationship is not established.
  - target: Cerebellar degeneration
    relationship: FAILS_TO_RECAPITULATE
    limitations: No reduction in cerebellar mass or overt ataxia was detected in the tested knockout through approximately one year; normal mass does not exclude subtle cellular abnormalities.
    evidence:
    - reference: PMID:38164552
      reference_title: Gordon Holmes Syndrome Model Mice Exhibit Alterations in Microglia, Age, and Sex-Specific Disruptions in Cognitive and Proprioceptive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This lack of phenotype was also coupled with our inability to detect decreases in cerebellar mass
      explanation: The lack of reduced cerebellar mass limits the model as a representation of human cerebellar degeneration.
    - reference: PMID:38164552
      reference_title: Gordon Holmes Syndrome Model Mice Exhibit Alterations in Microglia, Age, and Sex-Specific Disruptions in Cognitive and Proprioceptive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we were unable to detect motor impairments or other measures of behavior that would be indicative of ataxia in these mice
      explanation: The tested constitutive knockout failed to reproduce overt ataxia within the observation period.
- name: Chip-deficient mouse
  species: Mus musculus
  genotype: Stub1 (Chip) knockout
  description: Loss of CHIP produces behavioral and reproductive abnormalities resembling aspects of GHS.
  evidence:
  - reference: PMID:24113144
    reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism.
    explanation: CHIP loss reproduces aspects of the motor and reproductive phenotype in mice; this does not localize every endocrine lesion.
  modeled_mechanisms:
  - target: STUB1 CHIP ubiquitin ligase deficiency
    relationship: PERTURBS
    description: CHIP deficiency removes protein function rather than reproducing only the patient Thr246Met substitution.
    evidence:
    - reference: PMID:24113144
      reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism.
      explanation: CHIP loss reproduces aspects of the motor and reproductive phenotype in mice; this does not localize every endocrine lesion.
  - target: Cerebellar degeneration
    relationship: PARTIALLY_RECAPITULATES
    description: Shows cerebellar Purkinje-layer cell loss and abnormal motor behavior.
    limitations: The complete knockout does not preserve the chaperone-binding function retained by the human Thr246Met protein.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3900109/?report=classic
      reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: cellular loss throughout the various lobes of the cerebellum, specifically in the Purkinje cell layer
      explanation: Cerebellar histology in Chip-null mice demonstrates Purkinje-layer cell loss; this is experimental support, not human STUB1 neuropathology.

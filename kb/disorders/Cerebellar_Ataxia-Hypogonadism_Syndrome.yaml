  genotype: rnf216 and/or otud4 morpholino knockdown
  description: Embryonic knockdown model with more severe brain and eye defects following combined suppression and rescue by wild-type human mRNA.
  evidence:
  - reference: PMID:23656588
    reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Knockdown of rnf216 or otud4 in zebrafish embryos induced defects in the eye, optic tectum, and cerebellum; combinatorial suppression of both genes exacerbated these phenotypes, which were rescued by nonmutant, but not mutant, human RNF216 or OTUD4 messenger RNA.
    explanation: Knockdown and rescue support functional interaction between the two genes, without establishing a physical protein interaction or the exact OTUD4 catalytic defect.
  modeled_mechanisms:
  - target: OTUD4-associated ubiquitin regulation defect
    relationship: PERTURBS
    description: Tests functional interaction by single and combined gene knockdown and human mRNA rescue.
    limitations: Embryonic morpholino phenotypes do not reproduce the complete progressive adult human syndrome or identify the OTUD4 catalytic defect.
    evidence:
    - reference: PMID:23656588
      reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Knockdown of rnf216 or otud4 in zebrafish embryos induced defects in the eye, optic tectum, and cerebellum; combinatorial suppression of both genes exacerbated these phenotypes, which were rescued by nonmutant, but not mutant, human RNF216 or OTUD4 messenger RNA.
      explanation: Knockdown and rescue support functional interaction between the two genes, without establishing a physical protein interaction or the exact OTUD4 catalytic defect.

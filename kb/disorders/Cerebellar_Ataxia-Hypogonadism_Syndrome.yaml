- name: STUB1 CHIP ubiquitin ligase deficiency
  description: The recessive GHS-associated STUB1 Thr246Met variant disrupts the ubiquitin ligase activity of CHIP, a co-chaperone involved in protein quality control. Recombinant-protein and cell assays demonstrate the molecular loss of function.
  genes:
  - preferred_term: STUB1
    term:
      id: hgnc:11427
      label: STUB1
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24113144
    reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Introduction of the Thr246Met mutation into CHIP results in a loss of ubiquitin ligase activity measured directly using recombinant proteins as well as in cell culture models.
    explanation: The experimentally tested Thr246Met variant impairs CHIP E3 activity. This assay result is not generalized to every STUB1 variant.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3900109/?report=classic
    reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: while still maintaining chaperone interactions
    explanation: The full-text functional study shows that loss of E3 activity does not imply loss of chaperone binding.
  downstream:
  - target: Cerebellar degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: CHIP loss is associated with Purkinje-layer degeneration in mice, providing experimental support for an indirect cerebellar pathway.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3900109/?report=classic
      reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: cellular loss throughout the various lobes of the cerebellum, specifically in the Purkinje cell layer
      explanation: Cerebellar histology in Chip-null mice demonstrates Purkinje-layer cell loss; this is experimental support, not human STUB1 neuropathology.
  - target: Reproductive Endocrine Axis Dysfunction
    description: CHIP-related disease includes hypogonadism; the precise site and molecular route remain incompletely characterized.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24113144
      reference_title: Ataxia and hypogonadism caused by the loss of ubiquitin ligase activity of the U box protein CHIP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Loss of CHIP function in mice resulted in behavioral and reproductive impairments that mimic human ataxia and hypogonadism.
      explanation: CHIP loss reproduces aspects of the motor and reproductive phenotype in mice; this does not localize every endocrine lesion.
  notes: Thr246Met retained chaperone interactions despite impaired ubiquitination. The null mouse removes all CHIP function and is not an exact replica of this patient allele.
- name: PNPLA6 / Neuropathy Target Esterase Phospholipid Dysfunction
  description: >-
    Biallelic PNPLA6 variants can reduce neuropathy target esterase (NTE) activity. This endoplasmic-reticulum-associated
    phospholipase participates in phospholipid homeostasis. Variant-specific residual activity helps explain
    tissue involvement across the PNPLA6 spectrum, including its Gordon Holmes presentation; downstream
    neuronal and endocrine pathways remain incompletely defined.
  genes:
  - preferred_term: PNPLA6
    term:
      id: hgnc:16268
      label: PNPLA6
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:35069422
    reference_title: "Multifaceted and Age-Dependent Phenotypes Associated With Biallelic PNPLA6 Gene Variants: Eight Novel Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A wide spectrum of neurodegenerative diseases has been associated with pathogenic variants in the PNPLA6 (patatin-like phospholipase domain-containing protein 6) gene, including spastic paraplegia type 39, Gordon-Holmes, Boucher-Neuhauser, Oliver-Mc Farlane, and Laurence-Moon syndromes."
    explanation: >
      Establishes PNPLA6 as a cause of the Gordon Holmes / Boucher-Neuhauser
      ataxia-hypogonadism continuum.
  - reference: PMID:25299038
    reference_title: "PNPLA6 Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PNPLA6 disorders span a phenotypic continuum characterized by variable combinations of cerebellar ataxia; upper motor neuron involvement manifesting as spasticity and/or brisk reflexes; chorioretinal dystrophy associated with variable degrees of reduced visual function; and hypogonadotropic hypogonadism"
    explanation: >
      GeneReviews defines the PNPLA6 phenotypic continuum encompassing the
      ataxia-hypogonadism syndromes.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11146429/?report=classic
    reference_title: Neuropathy target esterase activity defines phenotypes among PNPLA6 disorders - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The NTE activity of all disease-associated missense/in-frame and truncating variants was significantly reduced compared to the wild-type control
    explanation: Full-length variant assays support reduced NTE activity; this does not imply that every truncating allele has zero residual function.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11146429/?report=classic
    reference_title: Neuropathy target esterase activity defines phenotypes among PNPLA6 disorders - PMC
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Individual genotype activity levels were determined by the average activity of the two individual variants.
    explanation: Patient-level activity in the genotype-phenotype analysis was estimated from individual in-vitro variant activities, rather than measured directly in every patient.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11146429/?report=classic
    reference_title: Neuropathy target esterase activity defines phenotypes among PNPLA6 disorders - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no apparent relationship between the activity of NTE and the onset of retinopathy or endocrinopathy.
    explanation: The tissue-association analysis did not establish age-at-onset prediction.
  downstream:
  - target: Cerebellar degeneration
    description: >-
      PNPLA6-related ataxia can include cerebellar atrophy; the cohort does not establish a direct molecular
      route to neuronal death or hippocampal degeneration.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35069422
      reference_title: "Multifaceted and Age-Dependent Phenotypes Associated With Biallelic PNPLA6 Gene Variants: Eight Novel Cases and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cerebellar ataxia was observed in seven patients and spastic paraplegia in one patient. Progression of cerebellar symptoms was slow in all patients, who retained ambulation even after a mean disease duration of 15 years. Brain MRI showed cerebellar atrophy in 6/8 patients, more pronounced in superior and dorsal vermis lobules (I to VII)."
      explanation: >-
        The eight-person PNPLA6 cohort contains three Gordon Holmes cases and other PNPLA6 phenotypes.
        Its aggregate imaging findings support cerebellar involvement across that spectrum, not GHS-specific
        penetrance.
  - target: Reproductive Endocrine Axis Dysfunction
    description: >-
      PNPLA6-related GHS includes central hypogonadism; the molecular intermediates are incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25299038
      reference_title: "PNPLA6 Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "hypogonadotropic hypogonadism (delayed puberty and lack of secondary sex characteristics). The hypogonadotropic hypogonadism occurs either in isolation or as part of anterior hypopituitarism"
      explanation: >
        GeneReviews confirms hypogonadotropic hypogonadism as a core feature of
        PNPLA6 disorders, connecting PNPLA6 dysfunction to reproductive endocrine
        axis impairment.
      quote_role: REVIEW_SYNTHESIS
  notes: The 2024 study found lower estimated residual activity associated with retinopathy and endocrinopathy across the PNPLA6 spectrum, but no clear relationship with age at onset. These research estimates are not a validated individual prognostic threshold. GHS remains clinically distinguishable from the retinal-predominant Boucher-Neuhauser/Oliver-McFarlane overlap.
  molecular_functions:

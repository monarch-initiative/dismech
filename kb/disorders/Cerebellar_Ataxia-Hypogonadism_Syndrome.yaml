- name: Reproductive Endocrine Axis Dysfunction
  description: >-
    Hypothalamic and pituitary reproductive dysfunction causes central hypogonadism. Detailed RNF216 endocrine
    testing showed variable responses to exogenous GnRH, with declining or absent pituitary responsiveness
    in some patients as disease progressed. The relative contributions of hypothalamic and pituitary dysfunction
    vary; the same cellular localization is not established for every genetic form.
  cell_types:
  - preferred_term: hypothalamic gonadotropin-releasing hormone neuron
    term:
      id: CL:0011111
      label: hypothalamic gonadotropin-releasing hormone neuron
  locations:
  - preferred_term: pituitary gland
    term:
      id: UBERON:0000007
      label: pituitary gland
  evidence:

biochemical:
- name: Reduced PNPLA6 neuropathy target esterase activity
  subtypes:
  - PNPLA6-related Gordon Holmes syndrome
  presence: Reduced
  notes: Variant-function research measure. Patient-level residual activity in the 2024 analysis was estimated from the two independently tested alleles. These estimates are not a validated individual clinical cutoff or age-at-onset predictor.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11146429/?report=classic
    reference_title: Neuropathy target esterase activity defines phenotypes among PNPLA6 disorders - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The NTE activity of all disease-associated missense/in-frame and truncating variants was significantly reduced compared to the wild-type control
    explanation: Full-length protein assays support impaired NTE activity.
  readouts:
  - target: PNPLA6 / Neuropathy Target Esterase Phospholipid Dysfunction
    relationship: READOUT_OF
    interpretation: The esterase assay measures the functional deficit; interpretation depends on the particular genotype and experimental assay.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC11146429/?report=classic
      reference_title: Neuropathy target esterase activity defines phenotypes among PNPLA6 disorders - PMC
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Individual genotype activity levels were determined by the average activity of the two individual variants.
      explanation: The study separates individual variant assays from estimated biallelic genotype activity.

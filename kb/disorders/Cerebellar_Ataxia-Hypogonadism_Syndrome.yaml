name: Cerebellar Ataxia-Hypogonadism Syndrome
creation_date: "2026-06-04T12:00:00Z"
category: Mendelian
description: >-
  Cerebellar ataxia-hypogonadism syndrome (Gordon Holmes syndrome) is a genetically heterogeneous neurodegenerative-neuroendocrine
  disorder characterized by cerebellar ataxia and hypogonadotropic hypogonadism. Cognitive decline, movement
  disorders and cerebral white-matter changes vary with genotype and disease stage. Recessive RNF216 and
  STUB1 disease and a reported digenic RNF216/OTUD4 form involve ubiquitin regulation; biallelic PNPLA6
  variants produce a distinct phospholipid-metabolism disorder within the overlapping PNPLA6 clinical
  spectrum. Endocrine abnormalities can precede overt neurologic signs. Chorioretinal dystrophy suggests
  overlap with Boucher-Neuhauser syndrome rather than a universal Gordon Holmes feature.
disease_term:
  preferred_term: Cerebellar Ataxia-Hypogonadism Syndrome
  term:
    id: MONDO:0008935
    label: cerebellar ataxia-hypogonadism syndrome
synonyms:
- Gordon Holmes syndrome
- Gordon-Holmes syndrome
- ataxia-hypogonadotropic hypogonadism
- ataxia, dementia, and hypogonadotropism

references:
- reference: PMID:25299038
  title: "PNPLA6 Disorders."
  tags:
  - GeneReviews

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic RNF216, STUB1 or PNPLA6 variants can cause an ataxia-hypogonadism phenotype. For PNPLA6 disease with both parents confirmed heterozygous, each conception has a 25% affected, 50% carrier and 25% unaffected non-carrier probability. Family counseling should use the established genotype; these single-locus probabilities are not applied to the digenic pedigree.
  evidence:
  - reference: PMID:23656588
    reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additional screening identified compound heterozygous truncating mutations in RNF216 in an unrelated patient
    explanation: Biallelic truncating RNF216 variants establish a single-locus recessive form.
  - reference: PMID:25299038
    reference_title: PNPLA6 Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for a PNPLA6 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews gives recurrence risks conditional on confirmed parental PNPLA6 carrier status.
    quote_role: REVIEW_SYNTHESIS
- name: Digenic inheritance (RNF216/OTUD4)
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    Three affected siblings in one consanguineous family carried homozygous variants at both RNF216 and
    OTUD4. Zebrafish knockdown and rescue support a functional interaction. This reported two-locus form
    involves homozygosity at both loci and does not establish isolated OTUD4 disease or a physical RNF216-OTUD4
    protein interaction.
  evidence:
  - reference: PMID:23656588
    reference_title: "Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Digenic homozygous mutations in RNF216 and OTUD4, which encode a ubiquitin E3 ligase and a deubiquitinase, respectively, were found in three affected siblings in a consanguineous family."
    explanation: >-
      The discovery study reports the two-locus genotype and its co-segregation
      with disease in three affected siblings.

pathophysiology:
- name: RNF216 K63-linked ubiquitination deficiency
  description: GHS-associated RNF216 catalytic-region variants impair E3 ubiquitin ligase activity. RNF216 synthesizes K63-linked chains in biochemical assays, implicating altered ubiquitin signaling. The relevant neuronal substrates and the steps connecting this defect to human neurodegeneration remain incompletely resolved.
  genes:
  - preferred_term: RNF216
    term:
      id: hgnc:21698
      label: RNF216
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein K63-linked ubiquitination
    term:
      id: GO:0070534
      label: protein K63-linked ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:30886743
    reference_title: TRIAD3/RNF216 E3 ligase specifically synthesises K63-linked ubiquitin chains and is inactivated by mutations associated with Gordon Holmes syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strikingly, we found that TRIAD3 synthesises specifically lysine-63 (K63)-linked poly-ubiquitin chains in vitro, a chain type that usually plays a role in mediating signalling events rather than triggering proteasomal degradation.
    explanation: Biochemical chain-linkage experiments distinguish RNF216 K63 ubiquitination from a uniform K48/proteasomal degradation mechanism.
  - reference: PMID:30886743
    reference_title: TRIAD3/RNF216 E3 ligase specifically synthesises K63-linked ubiquitin chains and is inactivated by mutations associated with Gordon Holmes syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results provide in vitro evidence that point mutations found in patients with Gordon Holmes syndrome5 abrogate TRIAD3’s E3 activity.
    explanation: The study tests GHS-associated catalytic-region substitutions; retained activity of Huntington-like-disorder variants elsewhere in RNF216 cautions against a universal variant mechanism.
  notes: ARC and endocytic proteins were candidate interactors or substrates in overexpression and lysate experiments. These findings do not establish a complete human disease pathway through proteasomal degradation.
  downstream:
  - target: Cerebellar degeneration
    description: RNF216-related disease includes cerebellar degeneration; intervening molecular events are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23656588
      reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The syndrome of hypogonadotropic hypogonadism, ataxia, and dementia can be caused by inactivating mutations in RNF216 or by the combination of mutations in RNF216 and OTUD4.
      explanation: Human genetics supports the disease association; cellular intermediates between altered ubiquitination and regional pathology remain unresolved.
    - reference: PMID:23656588
      reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Neuronal loss was observed in cerebellar pathways and the hippocampus; surviving hippocampal neurons contained ubiquitin-immunoreactive intranuclear inclusions.
      explanation: Autopsy in one affected RNF216/OTUD4 family member documents regional neuronal loss and inclusions; it does not establish that the inclusions cause cell death.
  - target: Hippocampal neuronal loss
    description: Hippocampal neuronal loss was demonstrated in an affected member of the digenic RNF216/OTUD4 family.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23656588
      reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Neuronal loss was observed in cerebellar pathways and the hippocampus; surviving hippocampal neurons contained ubiquitin-immunoreactive intranuclear inclusions.
      explanation: Autopsy in one affected RNF216/OTUD4 family member documents regional neuronal loss and inclusions; it does not establish that the inclusions cause cell death.
  - target: Reproductive Endocrine Axis Dysfunction
    description: RNF216-related disease involves hypothalamic and pituitary reproductive function through incompletely defined intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23656588
      reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The syndrome of hypogonadotropic hypogonadism, ataxia, and dementia can be caused by inactivating mutations in RNF216 or by the combination of mutations in RNF216 and OTUD4.
      explanation: Human genetics supports the disease association; cellular intermediates between altered ubiquitination and regional pathology remain unresolved.
  - target: Altered microglial state in RNF216 models
    description: Constitutive Rnf216 loss alters microglial features in mice; intermediate steps and relevance to human disease remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38164552
      reference_title: Gordon Holmes Syndrome Model Mice Exhibit Alterations in Microglia, Age, and Sex-Specific Disruptions in Cognitive and Proprioceptive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: KO mice also showed age-dependent strategy and associative learning impairments with sex-dependent alterations of microglia in the hippocampus and cortex.
      explanation: Constitutive Rnf216 loss is associated with sex- and region-dependent microglial changes and age-dependent learning phenotypes. Their causal relationship is not established.
- name: OTUD4-associated ubiquitin regulation defect
  mechanism_confidence: PROVISIONAL
  description: A homozygous OTUD4 variant co-segregated with a homozygous RNF216 variant in the original three-sibling family. OTUD4 encodes a deubiquitinase, and combined knockdown worsened developmental brain abnormalities in zebrafish. The exact catalytic consequence of the patient OTUD4 variant and its contribution independently of RNF216 remain unresolved.
  genes:
  - preferred_term: OTUD4
    term:
      id: hgnc:24949
      label: OTUD4
  molecular_functions:
  - preferred_term: deubiquitinase activity
    term:
      id: GO:0101005
      label: deubiquitinase activity
  notes: The molecular-function annotation describes OTUD4 protein activity; the direction and linkage specificity of any change caused by the patient variant have not been established.
  evidence:
  - reference: PMID:23656588
    reference_title: "Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Digenic homozygous mutations in RNF216 and OTUD4, which encode a ubiquitin E3 ligase and a deubiquitinase, respectively, were found in three affected siblings in a consanguineous family."
    explanation: >-
      The discovery study reports the two-locus genotype and its co-segregation
      with disease in three affected siblings.

  - reference: PMID:23656588
    reference_title: Ataxia, dementia, and hypogonadotropism caused by disordered ubiquitination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Knockdown of rnf216 or otud4 in zebrafish embryos induced defects in the eye, optic tectum, and cerebellum; combinatorial suppression of both genes exacerbated these phenotypes, which were rescued by nonmutant, but not mutant, human RNF216 or OTUD4 messenger RNA.
    explanation: Knockdown and rescue support functional interaction between the two genes, without establishing a physical protein interaction or the exact OTUD4 catalytic defect.

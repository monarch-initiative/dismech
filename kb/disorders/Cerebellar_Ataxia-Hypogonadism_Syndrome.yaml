- name: Sex Hormone Replacement Therapy
  description: >-
    Sex-steroid replacement supports pubertal development and secondary sexual characteristics under endocrine
    supervision. Testosterone improved secondary sexual characteristics in the reported RNF216 brothers
    without changing their neurologic symptoms. Fertility requires separate assessment; sex-steroid replacement
    is not evidence of restored fertility.

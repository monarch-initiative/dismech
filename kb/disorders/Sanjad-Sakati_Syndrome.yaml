name: Sanjad-Sakati Syndrome
creation_date: "2026-08-27T01:40:00Z"
category: Mendelian
synonyms:
- SSS
- hypoparathyroidism-retardation-dysmorphism syndrome
- HRD syndrome
- HRD
- Richardson-Kirk syndrome
- Kenny-Caffey syndrome type 1
description: >-
  Sanjad-Sakati syndrome (HRD) is an autosomal recessive disorder of congenital
  hypoparathyroidism, severe pre- and postnatal growth failure, microcephaly,
  characteristic dysmorphism and intellectual disability, reported almost
  exclusively in populations of the Arabian peninsula and the wider Middle East,
  where a founder 12-bp deletion in TBCE accounts for most cases. TBCE encodes
  one of the chaperones that fold alpha-tubulin and build alpha-beta tubulin
  heterodimers, so this is a chaperone disease of the tubulin assembly pathway
  rather than a primary parathyroid gene defect - the parathyroid link runs
  through microtubule-dependent secretory traffic. The same gene, at the more
  severe end of its allelic spectrum, causes autosomal recessive Kenny-Caffey
  syndrome, which adds osteosclerosis and recurrent bacterial infection; the two
  share an ancestral haplotype. Neonatal presentation is usually hypocalcemic
  seizures or apnea, and mortality is high, driven by pneumonia and sepsis.

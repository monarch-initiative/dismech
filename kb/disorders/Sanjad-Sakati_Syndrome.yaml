treatments:
- name: Calcium and Vitamin D Replacement
  description: >-
    Chronic treatment of hypoparathyroid hypocalcemia. The Jordanian series is
    explicit that this therapy carries its own burden - nephrocalcinosis and
    other complications of chronic calcium therapy are among the comorbidities
    associated with increased mortality - so monitoring for hypercalciuria and
    renal calcification is part of the treatment, not an optional extra.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Hypocalcemia
    term:
      id: HP:0002901
      label: Hypocalcemia
  evidence:
  - reference: PMID:42433342
    reference_title: "Sanjad-Sakati Syndrome in Jordan: Clinical Features, Comorbidities, and Mortality Rate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dental anomalies, intestinal pseudo-obstruction, and complications from chronic calcium therapy"
    explanation: >-
      Identifies complications of chronic calcium therapy as a recognized
      comorbidity, which is what makes monitoring part of the treatment.
- name: Infection Surveillance and Supportive Care
  description: >-
    Nearly half the Jordanian cohort died, most often of pneumonia and sepsis,
    so aggressive management of intercurrent infection is the intervention with
    the clearest bearing on survival.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42433342
    reference_title: "Sanjad-Sakati Syndrome in Jordan: Clinical Features, Comorbidities, and Mortality Rate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients (45.5%) died, most commonly due to pneumonia and sepsis."
    explanation: >-
      Establishes infection as the dominant cause of death, and so the priority
      for supportive care.

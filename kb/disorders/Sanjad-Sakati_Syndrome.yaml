      label: Recurrent bacterial infections
  frequency: VERY_FREQUENT
  diagnostic: false
  description: >-
    Invasive bacterial and viral infection is the principal cause of death.
    Pneumococcal disease dominates historically, which is why antibiotic
    prophylaxis became routine in the Soroka cohort; in that cohort under
    prophylaxis the observed episodes were Klebsiella, Shigella and Candida
    bacteraemia, and two of three COVID-19 infections were fatal.
  evidence:

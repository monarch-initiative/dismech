inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic TBCE variants. In the Kuwaiti series every affected individual was
    homozygous for the 12-bp founder deletion and every parent was a
    heterozygous carrier.
  evidence:
  - reference: PMID:19554981
    reference_title: "Sanjad-Sakati syndrome/Kenny-Caffey syndrome type 1: a study of 21 cases in Kuwait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected persons had homozygous deletion of 12 bp (155-166del) in exon 3 of the TBCE gene. All of the parents were heterozygous carriers of this mutation."
    explanation: >-
      Homozygosity in all affected individuals with obligate carrier parents is
      the classic autosomal recessive segregation pattern.
genetic:
- name: TBCE
  gene_term:
    preferred_term: TBCE
    term:
      id: hgnc:11582
      label: TBCE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TBCE (1q42-43) encodes tubulin-folding cofactor E. Deletion and truncation
    variants cause disease; c.155-166del (a 12-bp exon 3 deletion) is the
    founder allele across the Arabian peninsula and has also been found on a
    Moroccan background. TBCE is allelic for autosomal recessive Kenny-Caffey
    syndrome and, through a separate variant class, for an early-onset
    progressive encephalopathy with distal spinal muscular atrophy - so a TBCE
    variant does not by itself specify this entity.
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identification of deletion and truncation mutations of TBCE in affected individuals"
    explanation: >-
      The mapping and mutation study that established TBCE as the HRD gene.
  - reference: PMID:19554981
    reference_title: "Sanjad-Sakati syndrome/Kenny-Caffey syndrome type 1: a study of 21 cases in Kuwait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous deletion of 12 bp (155-166del) in exon 3 of the TBCE gene"
    explanation: >-
      Identifies the recurrent founder allele.
pathophysiology:
- name: Loss of Tubulin-Folding Cofactor E
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic deletion or truncation of TBCE removes one of the chaperones
    required to fold alpha-tubulin subunits and assemble them into alpha-beta
    tubulin heterodimers. The primary lesion is therefore in the tubulin supply
    chain, not in any parathyroid-specific pathway - which is what makes this a
    chaperone disease.
  genes:
  - preferred_term: TBCE
    term:
      id: hgnc:11582
      label: TBCE
  biological_processes:
  - preferred_term: tubulin complex assembly
    term:
      id: GO:0007021
      label: tubulin complex assembly
    modifier: DECREASED
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  downstream:
  - target: Reduced Microtubule Density and Perturbed Polarity
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene TBCE encodes one of several chaperone proteins required for the proper folding of alpha-tubulin subunits and the formation of alpha-beta-tubulin heterodimers."
    explanation: >-
      States the molecular function whose loss initiates the disease.
- name: Reduced Microtubule Density and Perturbed Polarity
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts and lymphoblastoid cells show lower microtubule density
    at the microtubule-organizing centre and disturbed microtubule polarity -
    the direct cellular readout of an inadequate supply of folded tubulin
    heterodimers.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DECREASED
  downstream:
  - target: Disturbed Microtubule-Dependent Membrane Trafficking
  - target: Microcephaly
    description: >-
      Microtubule-dependent neural progenitor division is the plausible route
      to reduced brain growth; the specific requirement in neural progenitors
      has not been demonstrated for TBCE.
  - target: Intellectual disability
    description: >-
      Grouped with the microcephaly as a neurodevelopmental consequence of the
      cytoskeletal defect; the route is not established.
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of diseased fibroblasts and lymphoblastoid cells showed lower microtubule density at the microtubule-organizing center (MTOC) and perturbed microtubule polarity in diseased cells."
    explanation: >-
      The measured cytoskeletal defect in patient cells.
- name: Disturbed Microtubule-Dependent Membrane Trafficking
  biological_scale: CELLULAR
  description: >-
    Organelles that depend on microtubules for membrane trafficking - the Golgi
    and the late endosomal compartment - are structurally disturbed in patient
    cells. This is the step that plausibly connects a general cytoskeletal
    defect to a secretory endocrine organ, and the authors propose it as a link
    between tubulin physiology and parathyroid development. It remains a
    proposal: no study has shown parathyroid-specific trafficking failure
    directly.
  biological_processes:
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  downstream:
  - target: Parathyroid Failure and Congenital Hypoparathyroidism
  - target: Severe Pre- and Postnatal Growth Failure
  - target: Chronic intestinal pseudo-obstruction
    description: >-
      Enteric neuromuscular function depends on microtubule-based transport;
      grouped here as the most plausible route, though it has not been shown
      directly in this disorder.
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunofluorescence and ultrastructural studies showed disturbances in subcellular organelles that require microtubules for membrane trafficking, such as the Golgi and late endosomal compartments."
    explanation: >-
      Documents the trafficking-organelle disturbance downstream of the
      microtubule defect.
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "establish a potential connection between tubulin physiology and the development of the parathyroid"
    explanation: >-
      The parathyroid link is offered as a potential connection, not a
      demonstrated one - hence PARTIAL, and hence the hedge in this node's
      description.
- name: Parathyroid Failure and Congenital Hypoparathyroidism
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Congenital hypoparathyroidism with persistent hypocalcemia, present in every
    reported patient and typically declaring itself in the neonatal period as a
    hypocalcemic seizure or apnea. Chronic calcium and vitamin D therapy is
    itself a source of morbidity through nephrocalcinosis.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  downstream:
  - target: Congenital hypoparathyroidism
    description: >-
      The endocrine endpoint of parathyroid failure.
  - target: Hypocalcemia
    description: >-
      PTH deficiency is the direct cause of the hypocalcemia.
  - target: Nephrocalcinosis
    description: >-
      Largely iatrogenic: a consequence of the chronic calcium and vitamin D
      therapy that the hypoparathyroidism requires, rather than of the primary
      lesion.
  evidence:
  - reference: PMID:19554981
    reference_title: "Sanjad-Sakati syndrome/Kenny-Caffey syndrome type 1: a study of 21 cases in Kuwait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had severe intrauterine growth retardation, short stature, small hands and feet, blue sclera, deep-set eyes, microcephaly, persistent hypocalcaemia and hypoparathyroidism."
    explanation: >-
      Present in all 21 patients in the Kuwaiti series.
- name: Severe Pre- and Postnatal Growth Failure
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Extreme growth failure beginning in utero, with microcephaly and the
    characteristic dysmorphism, and without catch-up - the feature that places
    this disorder among the primordial dwarfisms rather than among the isolated
    hypoparathyroidisms.
  downstream:
  - target: Intrauterine growth retardation
    description: >-
      The prenatal arm of the growth failure.
  - target: Short stature
    description: >-
      The postnatal arm of the growth failure.
  - target: Low birth weight
    description: >-
      Prenatal growth failure measured at birth.
  - target: Small hands
    description: >-
      Acral expression of the same generalized growth deficit.
  - target: Stenosis of the medullary cavity of the long bones
    description: >-
      The radiographic finding that overlaps with Kenny-Caffey syndrome.
      Grouped with the skeletal arm of the growth failure; TBCE has no
      demonstrated role in cortical bone modelling, so the route is
      unestablished.
  evidence:
  - reference: PMID:19554981
    reference_title: "Sanjad-Sakati syndrome/Kenny-Caffey syndrome type 1: a study of 21 cases in Kuwait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had severe intrauterine growth retardation, short stature, small hands and feet, blue sclera, deep-set eyes, microcephaly"
    explanation: >-
      Growth failure with microcephaly in all patients in the series.

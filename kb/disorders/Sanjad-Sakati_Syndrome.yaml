diagnosis:
- name: Molecular genetic testing of TBCE
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Biallelic TBCE pathogenic variants; in Middle Eastern and North African patients almost always the homozygous founder deletion
  description: >-
    Nearly all affected people of Arab descent in the Middle East are
    homozygous for the same 12-base-pair deletion in the second coding exon of
    TBCE and share an ancestral haplotype, so a targeted founder-allele test is
    the efficient first-line study in that population. The same founder allele
    is found in patients labelled Kenny-Caffey type 1 - the two diagnoses are
    allelic, and the molecular result does not distinguish them.
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both traits have previously been mapped to chromosome 1q43-44 (refs 5,6) and, despite the observed clinical variability, share an ancestral haplotype, suggesting a common founder mutation."
    explanation: >-
      The shared ancestral haplotype across both diagnoses, which is what makes
      a targeted founder test appropriate and what limits its ability to
      distinguish the two labels.
- name: Serum calcium, phosphate and parathyroid hormone
  diagnosis_term:
    preferred_term: serum biochemistry
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  presence: Hypocalcemia with inappropriately low or undetectable PTH
  description: >-
    Usually the presenting abnormality, since neonatal hypocalcemic seizures or
    tetany are how these infants come to attention. Combined with the growth
    and dysmorphic features it is enough for a clinical diagnosis where
    sequencing is not available - five of the Jordanian series were diagnosed
    on phenotype and family history alone.
  evidence:
  - reference: PMID:42433342
    reference_title: "Sanjad-Sakati Syndrome in Jordan: Clinical Features, Comorbidities, and Mortality Rate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SSS is established through a combination of medical history (family history of SSS, gestational age, and birth weight), clinical features (dysmorphic features such as deep-set small eyes, micrognathia, narrow face, large floppy ears, and short stature), laboratory findings (hypoparathyroidism, hypocalcemia), and genetic studies (mutations in the TBCE gene on chromosome 1q42-43)."
    explanation: >-
      Sets out the four diagnostic strands, of which this record covers the
      laboratory one.
- name: Clinical scoring against major and minor criteria
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  presence: Growth failure, characteristic dysmorphism and hypoparathyroidism scored against published major/minor criteria
  description: >-
    There is no GeneReviews chapter for this disorder; the nearest thing to a
    consensus definition is a criteria set proposed from a Tunisian series and
    literature review, explicitly intended to decide who should be sent for
    molecular testing rather than to replace it.
  evidence:
  - reference: PMID:30638765
    reference_title: "Additional Tunisian patients with Sanjad-Sakati syndrome: A review toward a consensus on diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reviewing the literature on both its clinical and biochemical characteristics, we suggest for the first time, based on defined major and minor SSS criteria, a clinical scoring system for the diagnosis of SSS."
    explanation: >-
      The proposed scoring system this record describes.
treatments:
- name: Calcium and Vitamin D Replacement
  description: >-
    Chronic treatment of hypoparathyroid hypocalcemia. The Jordanian series is
    explicit that this therapy carries its own burden - nephrocalcinosis and
    other complications of chronic calcium therapy are among the comorbidities
    associated with increased mortality - so monitoring for hypercalciuria and
    renal calcification is part of the treatment, not an optional extra.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Hypocalcemia
    term:
      id: HP:0002901
      label: Hypocalcemia
  evidence:
  - reference: PMID:42433342
    reference_title: "Sanjad-Sakati Syndrome in Jordan: Clinical Features, Comorbidities, and Mortality Rate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dental anomalies, intestinal pseudo-obstruction, and complications from chronic calcium therapy"
    explanation: >-
      Identifies complications of chronic calcium therapy as a recognized
      comorbidity, which is what makes monitoring part of the treatment.
- name: Infection Surveillance and Supportive Care
  description: >-
    Nearly half the Jordanian cohort died, most often of pneumonia and sepsis,
    so aggressive management of intercurrent infection is the intervention with
    the clearest bearing on survival.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42433342
    reference_title: "Sanjad-Sakati Syndrome in Jordan: Clinical Features, Comorbidities, and Mortality Rate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten patients (45.5%) died, most commonly due to pneumonia and sepsis."
    explanation: >-
      Establishes infection as the dominant cause of death, and so the priority
      for supportive care.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counseling, with carrier testing informative in

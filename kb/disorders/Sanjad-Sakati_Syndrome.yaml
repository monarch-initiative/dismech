animal_models:
- name: pmn/pmn mouse (Tbce p.Trp524Gly)
  species: Mouse
  genotype: Tbce c.1570T>G p.(Trp524Gly), homozygous (progressive motor neuronopathy allele)
  publication: PMID:12389029
  description: >-
    The only established Tbce animal model, and it is a spontaneous mouse
    mutant that was studied as a motor neuron disease model for a decade before
    the human gene was identified. It carries a substitution at the terminal
    residue of Tbce that destabilizes the protein - mechanistically the same
    class of lesion as the human disease - and it reproduces the microtubule
    deficit faithfully. It does not reproduce the human syndrome: pmn mice
    develop progressive motor axon degeneration and die at four to six weeks,
    while human HRD patients have hypoparathyroidism, primordial growth failure
    and immunodeficiency without a motor neuronopathy. The model is therefore
    informative about what TBCE does to microtubules and uninformative about why
    the human parathyroid fails.
  modeled_mechanisms:
  - target: Loss of Tubulin-Folding Cofactor E
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A destabilizing missense allele reducing Tbce protein, complemented by a
      wild-type transgene - the causal relationship is established rather than
      correlative.
    limitations: >-
      A single missense allele at the extreme C-terminus, not the human
      12-base-pair deletion, and studied in a species where the resulting
      phenotype is a motor neuronopathy.
    readouts:
    - name: Rescue of phenotype by wild-type Tbce transgene
      target: Loss of Tubulin-Folding Cofactor E
      direction: RESTORED
      interpretation: >-
        Transgenic complementation restoring a normal phenotype establishes
        that Tbce loss is the cause rather than a linked marker.
      evidence:
      - reference: PMID:12389029
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Transgenic complementation with a wildtype Tbce cDNA restored a normal phenotype in mutant mice."
        explanation: Establishes causality by rescue.
    evidence:
    - reference: PMID:12389029
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we identify the pmn mutation as resulting in a Trp524Gly substitution at the last residue of the tubulin-specific chaperone e (Tbce) protein that leads to decreased protein stability"
      explanation: >-
        Identifies the model's lesion as a destabilizing Tbce allele, the same
        class of defect as the human disease.
  - target: Reduced Microtubule Density and Perturbed Polarity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Microtubule loss is demonstrated directly in mutant nerve, and the later
      study localizes TBCE to the Golgi and shows that microtubule loss proceeds
      retrogradely in step with axonal dying back - a cell-biological account of
      the cytoskeletal defect that the human patient-cell data can only measure
      statically.
    limitations: >-
      Measured in motor axons, a compartment not implicated in the human
      disease; whether parathyroid or lymphoid cells show the same defect in
      vivo is untested.
    readouts:
    - name: Axonal microtubule number in sciatic and phrenic nerve
      target: Reduced Microtubule Density and Perturbed Polarity
      direction: DECREASED
      interpretation: >-
        Direct structural confirmation that Tbce loss depletes microtubules in
        vivo.
      evidence:
      - reference: PMID:12389029
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Electron microscopy of the sciatic and phrenic nerves of affected mice showed a reduced number of microtubules, probably due to defective stabilization."
        explanation: The structural measurement behind this readout.
    evidence:
    - reference: PMID:17699660
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In pmn mice, TBCE is destabilized and disappears from the Golgi apparatus of motor neurons, and microtubules are lost in distal axons."
      explanation: >-
        Connects the destabilized protein, its subcellular site of action, and
        the microtubule loss in the same model.
  - target: Disturbed Microtubule-Dependent Membrane Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model supplies the mechanistic content this node otherwise lacks:
      TBCE is a peripheral membrane protein at the Golgi, and disrupting the
      Golgi pharmacologically phenocopies the mutation's effect on tubulin
      routing. That makes a Golgi-centred trafficking defect a demonstrated
      mechanism in neurons rather than only a proposal.
    limitations: >-
      Shown for tubulin routing in motor neurons. The human node concerns
      secretory trafficking in parathyroid cells, which this model does not
      address at all - the parathyroid phenotype is absent in pmn mice.
    readouts:
    - name: Axonal tubulin routing from the Golgi apparatus
      target: Disturbed Microtubule-Dependent Membrane Trafficking
      direction: DECREASED
      interpretation: >-
        Three independent perturbations converging on the same defect place
        TBCE in a Golgi-dependent tubulin-routing pathway.
      evidence:
      - reference: PMID:17699660
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In cultured motor neurons, the pmn mutation, interference RNA-mediated TBCE depletion, and brefeldin A-mediated Golgi disruption all compromise axonal tubulin routing."
        explanation: The convergent evidence behind this readout.
    evidence:
    - reference: PMID:17699660
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that TBCE is a peripheral membrane-associated protein that accumulates at the Golgi apparatus."
      explanation: >-
        Localizes TBCE to the compartment this node concerns, which is what
        makes the model partially informative for it.
  - target: Parathyroid Failure and Congenital Hypoparathyroidism
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      pmn mice have no reported hypoparathyroidism. The defining endocrine
      feature of the human disease is absent from the only Tbce model, so the
      step from a general cytoskeletal defect to selective parathyroid
      aplasia has no animal support.
    limitations: >-
      The mouse phenotype is a progressive motor neuronopathy with death at
      four to six weeks - a lethal course in a compartment the human disease
      spares, and possibly too early for a parathyroid phenotype to be
      ascertained. The published characterizations do not report parathyroid
      assessment either way, so this is an absence of evidence in a model whose
      overall phenotype is clearly divergent, not a documented negative
      parathyroid study.
    evidence:
    - reference: PMID:12389029
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Mice that are homozygous with respect to the progressive motor neuronopathy (pmn) mutation (chromosome 13) develop a progressive caudio-cranial degeneration of their motor axons from the age of two weeks and die four to six weeks after birth."
      explanation: >-
        The full reported phenotype of the model is a motor neuronopathy; no
        endocrine feature is described, which is the divergence this link
        records.

  - classification_value: ENDOCRINOLOGY_METABOLISM
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0040 "Sanjad-Sakati syndrome, recessive, TBCE-related"
      (OMIM 241410). The nosology lists exactly one TBCE row, so the assignment
      is 1:1 with this entry. Autosomal recessive Kenny-Caffey syndrome, the
      allelic osteosclerotic disorder at the severe end of the same TBCE
      spectrum, is not separately listed; the dominant FAM111A Kenny-Caffey
      syndrome is a different gene and a different row (NOS 21-0050).

- name: Loss of NALCN Surface and Dendritic Targeting
  description: >-
    Two of the three UNC-interacting motifs drive NALCN to the plasma membrane,
    and a C-terminal UNC80 domain overcomes a soma-retention signal to place the
    channel in dendrites. Patient-type C-terminal truncations are informative

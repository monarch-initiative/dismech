    reference_title: "Expanding the phenotype of PURA-related neurodevelopmental disorder: a close differential diagnosis of infantile hypotonia with psychomotor retardation and characteristic facies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant phenotypic overlap was observed in subjects with PURA-related
      NDD and IHPRF especially with IHPRF2, caused by biallelic pathogenic
      variants in UNC80.
    explanation: States the overlap and names IHPRF2 as the closest match.
- name: Angelman syndrome and Angelman-like syndromes
  description: >-
    Severe developmental delay with absent speech, a happy demeanour and
    movement abnormalities brings Angelman syndrome into the differential in
    practice.
  evidence:
  - reference: PMID:29572195
    reference_title: "Biallelic UNC80 mutations caused infantile hypotonia with psychomotor retardation and characteristic facies 2 in two Chinese patients with variable phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To some extent, the manifestations of IHPRF2 mimic those of Angelman
      syndrome (AS)-like syndromes.
    explanation: Reports the clinical resemblance from a review of UNC80 patients.
- name: Hypomyelinating leukodystrophy 10 (biallelic PYCR2 variants)
  description: >-
    Shares failure to thrive, hypotonia, hyperkinetic movements, severe delay
    and early death. Progressive postnatal microcephaly and cerebral atrophy
    distinguish it from the NALCN channelopathies.
  evidence:
  - reference: PMID:30167850
    reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differing clinical features are postnatal, progressive microcephaly, which
      has not been documented to this degree in individuals with biallelic NALCN
      or UNC80 mutations, and cerebral atrophy.
    explanation: Names the discriminating features between HLD10 and this entry.

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in
    UNC80 are required. Heterozygous carriers are unaffected. Consanguinity is
    prominent among reported families, and one sibling pair carried a splice
    variant on one allele and an intragenic five-exon deletion on the other, so
    a copy-number variant can supply the second hit.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28933810
    reference_title: UNC80 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: UNC80 deficiency is inherited in an autosomal recessive manner.
    explanation: GeneReviews states the mode of inheritance explicitly.
  - reference: PMID:26708751
    reference_title: >-
      Biallelic Mutations in UNC80 Cause Persistent Hypotonia, Encephalopathy,
      Growth Retardation, and Severe Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four individuals from three unrelated families who have
      homozygous missense or compound heterozygous truncating mutations in UNC80
      and persistent hypotonia, encephalopathy, growth failure, and severe
      intellectual disability.
    explanation: >-
      The gene-discovery cohort establishes the biallelic requirement across
      three unrelated families.

      label: ion channel regulator activity
    modifier: LOSS_OF_FUNCTION
  genes:
  - preferred_term: UNC80
    term:
      id: hgnc:26582
      label: UNC80
  evidence:
  - reference: PMID:35550517
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the activity of which essentially depends on the presence of both UNC79
      and UNC80, two auxiliary proteins
    explanation: >-
      States what the lost protein does: UNC80 is an auxiliary subunit whose
      presence the channel's activity depends on, which is why this node binds a
      channel-regulator rather than a channel activity. The same paper reports
      no transmembrane helices in UNC80, so UNC80 does not itself conduct.
  - reference: CGGV:assertion_7639160a-1761-4dcb-98de-2aeb61b2b080-2021-07-30T134337.292Z

pathophysiology:
- name: Biallelic UNC80 Loss of Function
  description: >-
    Both UNC80 alleles carry predicted-null or function-impairing variants, so
    little or no functional UNC80 protein is available to assemble into the
    NALCN channelosome. This is the initiating lesion of the entry.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:

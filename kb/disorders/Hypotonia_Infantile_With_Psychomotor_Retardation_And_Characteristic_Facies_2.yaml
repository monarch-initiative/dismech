animal_models:
- name: Unc80 knockout mouse
  species: Mouse
  genotype: Unc80 exon 3 deletion (CRISPR), homozygous null
  publication: PMID:32620897
  description: >-
    Constitutive UNC80 knockout. Pups appear normal at birth but none survives
    beyond 24 hours, with severe apnea, phenocopying the NALCN knockout.
  modeled_mechanisms:
  - target: Biallelic UNC80 Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      A true null allele of the orthologous gene, confirmed by absence of UNC80
      protein in mutant brain lysate.
    limitations: >-
      Neonatal lethality means the model cannot represent the chronic human
      course, in which most children survive years with severe static
      impairment. It is a model of the molecular lesion, not of the disease
      trajectory.
    evidence:
    - reference: PMID:32620897
      reference_title: "Intellectual disability-associated UNC80 mutations reveal inter-subunit interaction and dendritic function of the NALCN channel complex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Targeted disruption of UNC80 leads to apnea and neonatal lethality.
      explanation: >-
        States the knockout's phenotype. The apnea is florid in the mouse but
        was absent from all 12 individuals in the largest human cohort.
- name: Unc80 L2654* knock-in mouse
  species: Mouse
  genotype: Unc80 L2654* (patient-type C-terminal truncation), homozygous
  publication: PMID:32620897
  description: >-
    A knock-in of the kind of C-terminal truncation found in affected
    individuals. Homozygotes are born at close to the expected Mendelian ratio
    but none survives beyond P1, again with severe apnea. The informative result
    is electrophysiological: the sodium leak current in cultured mutant neurons
    is not reduced but significantly larger than wild type, while the truncated
    UNC80 protein is confined to the soma and absent from axons and dendrites.
  modeled_mechanisms:
  - target: Loss of NALCN Surface and Dendritic Targeting
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The patient-type truncation removes the domain that overcomes a
      soma-retention signal, confining UNC80 to the soma.
    limitations: >-
      Localisation was assessed on tagged constructs transfected into cultured
      hippocampal neurons rather than on endogenous protein in the knock-in
      brain.
    evidence:
    - reference: PMID:32620897
      reference_title: "Intellectual disability-associated UNC80 mutations reveal inter-subunit interaction and dendritic function of the NALCN channel complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        was restricted in soma and was absent in axons and dendrites, suggesting
        essential roles of the C-terminus in the trafficking of UNC80
      explanation: >-
        Shows the trafficking defect produced by the patient-type truncation.
  - target: Reduced NALCN Sodium Leak Current
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      For this allele class the whole-cell leak current is preserved and in fact
      increased, so the lethal phenotype cannot be attributed to a reduced
      current in this model.
    limitations: >-
      This is a direct counterexample to the entry's pivotal node for
      C-terminal truncating alleles: the current went the opposite way from the
      prediction, in cultured neurons from a model that is nonetheless lethal.
      The reduced-current evidence comes from a missense allele in HEK293T
      cells, so the two allele classes may act by different routes, and neither
      measurement is from patient neurons.
    evidence:
    - reference: PMID:32620897
      reference_title: "Intellectual disability-associated UNC80 mutations reveal inter-subunit interaction and dendritic function of the NALCN channel complex."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In neurons cultured from the mutant pups homozygous for L2654*, ΔILNa
        was significantly larger than that of WT
      explanation: >-
        The leak current in the knock-in is larger, not smaller, than wild type,
        which refutes reduced whole-cell current as the mechanism for this
        allele class.
- name: Drosophila unc80 loss-of-function mutant
  species: Fruit fly
  genotype: unc80 (CG18437) strong or complete loss-of-function alleles
  publication: PMID:24223770
  description: >-
    Fly unc80 mutants lose circadian locomotor rhythmicity indistinguishably
    from mutants of the NALCN ortholog narrow abdomen, and the three subunits
    depend on one another for protein expression. This is the evidence behind
    the channelosome-destabilisation step.
  modeled_mechanisms:
  - target: NALCN Channelosome Destabilisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Loss of any one subunit lowers the protein level of all three, with
      transcript levels largely unchanged.
    limitations: >-
      Shown in fly heads; the readout is circadian locomotor behaviour, which is
      not a feature of the human disorder, and the interdependence has not been
      measured in human neurons.
    evidence:
    - reference: PMID:24223770
      reference_title: "UNC79 and UNC80, putative auxiliary subunits of the NARROW ABDOMEN ion channel, are indispensable for robust circadian locomotor rhythms in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        loss of na, unc79, or unc80 gene function leads to decreased expression
        of all three proteins, with minimal effect on transcript levels
      explanation: >-
        Establishes post-transcriptional interdependence of the three subunits.
discussions:
- discussion_id: allele_class_mechanism_divergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do UNC80 missense and C-terminal truncating alleles act through the same
    lesion, given that one reduces the NALCN leak current while the other
    increases it?
  attaches_to:
  - pathophysiology#Reduced NALCN Sodium Leak Current
  - pathophysiology#Loss of NALCN Surface and Dendritic Targeting
  rationale: >-
    The entry's pivotal node is a reduced sodium leak current, and the only
    direct measurement of a patient allele supports it: the p.Pro1700Ser
    missense variant markedly decreased NALCN current in HEK293T cells. But the
    knock-in mouse carrying a patient-type C-terminal truncation has a leak
    current significantly larger than wild type in cultured neurons, while
    dying neonatally and confining UNC80 to the soma. If that result holds for
    the human truncating alleles, which are the majority of reported variants,
    then for most patients the operative lesion is compartmental mislocalisation
    of the channel rather than a loss of whole-cell conductance, and the
    pathograph's trunk is mis-stated for them. The two measurements are also not
    comparable: one is a heterologous cell line and the other is mouse primary
    neurons.
  proposed_experiments:
  - experiment_id: allele_class_current_and_localisation
    experiment_design: TARGETED_PERTURBATION
    name: Leak current and subcellular localisation across UNC80 allele classes in one system
    description: >-
      Measure the sodium leak current and the dendritic versus somatic
      distribution of NALCN side by side for a panel of patient UNC80 alleles
      (missense, early nonsense, C-terminal truncation, multi-exon deletion) in
      a single neuronal system, ideally isogenic patient-derived neurons, so the
      allele classes are compared on one readout rather than across papers.
- discussion_id: mouse_lethality_versus_human_survival
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do both UNC80 mouse models die within a day of birth from apnea, when
    affected children survive for years and the largest cohort recorded no
    breathing abnormality at all?
  attaches_to:
  - phenotypes#Central sleep apnea
  - pathophysiology#Dysregulated Neuronal Resting Membrane Potential
  rationale: >-
    Both the null and the patient-type knock-in mouse have severe neonatal apnea
    and neither survives past P1, so the available mammalian models represent a
    lethal respiratory phenotype. In humans the picture is close to the
    opposite: breathing abnormalities were documented in 5 of 16 IHPRF1
    individuals and 0 of 12 IHPRF2 individuals in the one cohort that compared
    them, and the apnea that is reported in UNC80 disease comes from a single
    sibling pair. Either the mouse overstates the respiratory consequence of
    UNC80 loss, or human apnea is underascertained because sleep studies are not
    routine in this disorder; the cohort authors recommended sleep studies for
    NALCN variants specifically. This matters for surveillance: whether
    polysomnography belongs in routine UNC80 follow-up turns on the answer.
  proposed_experiments:
  - experiment_id: prospective_polysomnography_unc80
    experiment_design: HUMAN_OBSERVATIONAL
    name: Prospective polysomnography in a UNC80 cohort
    description: >-
      Perform sleep studies prospectively on a molecularly confirmed UNC80
      cohort rather than relying on clinically prompted investigation, to
      establish whether central apnea is genuinely rare in humans or is simply
      not looked for.
- discussion_id: craniofacial_and_growth_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of a neuronal sodium leak conductance produce the
    characteristic facial gestalt, the postnatal microcephaly and the growth
    failure?
  attaches_to:
  - pathophysiology#Dysregulated Neuronal Resting Membrane Potential
  - phenotypes#Microcephaly
  - phenotypes#Triangular face
  rationale: >-
    The facial gestalt is in the disease name and is used clinically for
    recognition, yet no mechanism connects it to the channelopathy. The entry
    therefore does not draw causal edges from the excitability node to the
    craniofacial features, and the growth phenotypes are recorded without a
    mechanistic parent: birth weight is usually normal and the deficits are
    postnatal, which is at least consistent with feeding failure rather than a
    primary growth defect, but no study has partitioned the two.
  proposed_experiments:
  - experiment_id: unc80_expression_in_craniofacial_development
    experiment_design: DESCRIPTIVE_PROFILING
    name: UNC80 and NALCN expression in developing craniofacial tissue
    description: >-
      Determine whether UNC80 and NALCN are expressed in neural crest or
      craniofacial mesenchyme during the relevant developmental window, which
      would distinguish a direct developmental role from a secondary
      consequence of the neurological disease.
- discussion_id: seizure_frequency_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the seizure frequency in UNC80 deficiency closer to 1 in 12 or to 12 in
    22, and does it depend on age at assessment?
  attaches_to:
  - phenotypes#Seizures
  rationale: >-
    The two largest bodies of evidence disagree by roughly sevenfold: 1 of 12
    in the contemporary cohort against 12 of 22 in the previously published
    individuals summarised in the same table. The cohort authors offer an
    explanation, that several of their individuals were still very young at
    last examination and five died early, which would bias a
    childhood-onset feature downwards; publication bias in the earlier case
    reports would push the other way. No frequency band is recorded on the
    phenotype because of this. The answer changes what families are told and
    whether EEG surveillance is warranted.
  proposed_experiments:
  - experiment_id: age_stratified_seizure_ascertainment
    experiment_design: HUMAN_OBSERVATIONAL
    name: Age-stratified seizure ascertainment in UNC80 deficiency
    description: >-
      Pool reported individuals with age at last assessment and seizure status
      to estimate an age-adjusted cumulative incidence, rather than comparing
      raw proportions from cohorts of different ages.
notes: >-
  Entry name. The entry is named "UNC80 Deficiency" rather than carrying the
  MONDO label forward. Design decision 18 and the entry-naming skill direct a
  single-gene Mendelian entry to an established gene-dyadic name, and list a
  GeneReviews chapter title for the same scope as one of the establishing
  sources; the GeneReviews chapter is titled "UNC80 Deficiency" (PMID:28933810,
  NBK453434), and "UNC80-related neurodevelopmental disorder" is used in the
  title of a 2026 case series (PMID:41458659). The MONDO label, IHPRF2 and the
  MONDO synonyms are retained in synonyms, and the file slug is unchanged while
  dismech issue 15894 is open. Note this diverges from the sibling IHPRF3 entry,
  which kept its numbered MONDO label; that entry was created in August 2026,
  before design decision 18 was recorded in October 2026.

  Lump/split. IHPRF2 (UNC80) is kept separate from IHPRF1 (NALCN) although the
  two genes encode subunits of the same channelosome and the two disorders
  share a core phenotype. The two are separately delineated entities with
  separate OMIM and MONDO identifiers, and the one cohort that assessed both
  against each other reported IHPRF1 as the more clinically variable and found
  breathing abnormalities in IHPRF1 only. The series parent MONDO:0014176 is
  recorded as a broadMatch cross-reference, following the IHPRF3 convention,
  not as a claim that the numbered series is one mechanism. A grouping over the
  NALCN channelopathies would be a reasonable follow-up and is not created here.

  Phenotype baseline. GeneReviews "UNC80 Deficiency" (PMID:28933810) is the
  baseline, and every clinical characteristic named in its abstract now has a
  phenotype row. Three of them - clubfeet, joint contractures and scoliosis -
  carry no frequency band: clubfoot and scoliosis are not separately tabulated
  in any cohort, and for joint contractures the two bodies of evidence disagree
  as sharply as they do for seizures, at 1 of 12 in the contemporary series
  against 10 of 10 previously published individuals, so both figures are cited
  instead. None of the three is given a causal parent, because no cited source
  states whether they are secondary to the hypotonia and non-ambulation.
  Frequencies elsewhere are taken from the UNC80 columns of Table 1 of
  PMID:30167850 and from its text, which disagree in one place: the table gives
  severe intellectual disability as 11 of 11 and the text as 12 of 12. The
  table row is quoted.

  Sections deliberately absent. No imaging_findings, histopathology or
  biochemical section: no consistent brain MRI finding, no neuropathology and
  no biomarker is described for this disorder in the cited literature. No
  clinical_trials section either: neither the cited literature nor the
  deep-research report names a trial specific to this disorder, and
  ClinicalTrials.gov was not searched directly. The footnote to the cohort's
  Table 1 records overlapping facial features but no recognisable facial
  phenotype, which is why the two facial phenotype rows carry no frequency
  band.

  Curation inputs. Built from one OpenScientist deep-research report
  (research/Hypotonia_Infantile_With_Psychomotor_Retardation_And_Characteristic_Facies_2-deep-research-openscientist.md),
  whose reference validation resolved 16 of 16 citations with none off topic
  (12 judged on topic, 4 left undecided), and whose term validation checked 38
  CURIEs, resolving 33 with 5 unverifiable for want of a configured resolver
  and none unresolved. Its one "named as a different term" flag is
  MONDO:0014777, where the report's name list picked up the words "if
  available" from the prompt template, and the four terms it flagged for a
  second look are paraphrases of the ontology labels. Every ontology identifier in
  this entry was independently re-resolved against the committed term caches,
  the OLS GO endpoint or the HGNC REST API while writing it; GO:0098662, which
  was considered for the sodium-transport node, proved obsolete and was not
  used, and HP:0001522 is outside the PhenotypeTerm enum, so early death is
  recorded under progression rather than as a phenotype. The ClinGen Definitive
  assertion was rebuilt from the committed cache/clingen/gene_validity.csv
  export of 2026-01-24, because the locally downloaded ClinGen file had drifted
  from the pinned checksum.

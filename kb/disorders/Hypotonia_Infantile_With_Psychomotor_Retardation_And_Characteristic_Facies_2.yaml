progression:
- phase: Neonatal presentation
  age_range: Birth to 1 month
  notes: >-
    Generalised hypotonia from birth with poor suck and feeding difficulty, in
    an infant usually of normal birth weight.
  evidence:
  - reference: PMID:30167850
    reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals (12/12) presented with neonatal hypotonia, failure to
      thrive, and severe ID
    explanation: Establishes hypotonia and poor growth as the neonatal presentation.
- phase: Infancy and childhood - static severe impairment
  age_range: 1 month to 10 years
  notes: >-
    Severe global developmental delay without regression: most children never
    walk and none develop expressive speech, while feeding failure, postnatal
    growth deficiency, microcephaly, constipation, sleep disturbance,
    dyskinesia and recurrent infections accumulate. Skills are gained slowly
    rather than lost.
  evidence:
  - reference: PMID:28933810
    reference_title: "UNC80 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals have slow acquisition of developmental skills and do not have
      features suggestive of neurodegeneration.
    explanation: >-
      Characterises the course as slow acquisition rather than degeneration,
      which is the distinguishing feature of this phase.
- phase: Early death
  age_range: 10 months to 10 years
  notes: >-
    Five of twelve individuals in the largest cohort died early, after recurrent
    infections or pneumonia and cardiopulmonary arrest. The cohort authors
    flagged this as counselling-relevant information that earlier reports had
    not discussed. Survival into later childhood and adulthood also occurs: the
    oldest individual in that series was 18.5 years.
  evidence:
  - reference: PMID:30167850
    reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5/12 individuals passed away early (range 10 months to 10 years), e.g.,
      after recurrent infections/pneumonia and cardiopulmonary arrest
    explanation: >-
      Gives the proportion, the age range and the reported immediate causes of
      early death.
  - reference: PMID:30167850
    reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in our cohort, 12.5% of the IHPRF1-and 41.7% of the IHPRF2-affected
      individuals died early, which is a very important piece of information for
      counseling of affected families
    explanation: >-
      Quantifies early mortality in IHPRF2 at 41.7% and states its counselling
      relevance.
diagnosis:
- name: Molecular genetic testing for biallelic UNC80 variants
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The diagnosis is established in a proband with suggestive findings plus
    biallelic pathogenic UNC80 variants. Exome sequencing is the usual
    first-line test, but it reports only one allele when the second is an
    intragenic deletion, so exon-level copy-number analysis (chromosomal
    microarray or an equivalent) should follow a single heterozygous finding in
    a clinically compatible child.
  evidence:
  - reference: PMID:28933810
    reference_title: "UNC80 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of UNC80 deficiency is established in a proband with
      suggestive findings and biallelic pathogenic variants in UNC80 identified
      by molecular genetic testing.
    explanation: States the diagnostic criterion.
  - reference: PMID:40801661
    reference_title: "Integrated Genomic Approach: A Five Exon Intragenic Deletion in UNC80 Combines With a Novel Splice Variant to Cause IHPRF2 Syndrome in an Italian Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of multiple techniques, also comprising exon-level
      resolution array, is a resource in real-world diagnostics of rare
      diseases.
    explanation: >-
      The sibling pair whose second allele was a five-exon deletion is the basis
      for escalating beyond sequencing alone.
differential_diagnoses:
- name: IHPRF1 (biallelic NALCN variants)
  description: >-
    The same channelosome, the overlapping clinical label and a shared core of
    neonatal hypotonia, failure to thrive and severe intellectual disability.
    The one cohort that compared the two found IHPRF1 more clinically variable,
    and found breathing abnormalities in IHPRF1 only, which is the most useful
    discriminator reported so far. Testing resolves the two.
  evidence:
  - reference: PMID:30167850
    reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the comparison of our IHPRF1-and IHPRF2 cohorts with each other and with
      previously published individuals showed that the clinical presentation of
      IHPRF1 seems to be more variable than of IHPRF2, e.g., with regard to the
      severity of ID
    explanation: Direct clinical comparison of the two disorders in one cohort.
- name: PURA-related neurodevelopmental disorder
  description: >-
    Proposed as a close differential after a child given a clinical IHPRF
    diagnosis proved to have a de novo PURA variant. The overlap is with IHPRF2
    specifically.
  evidence:

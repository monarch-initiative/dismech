      disease mechanism.
  downstream:
  - target: NALCN Channelosome Destabilisation
    causal_link_type: DIRECT
    description: >-
      UNC80 is one of two auxiliary subunits required for the channelosome, and
      the three subunits depend on one another for protein-level stability, so
      losing UNC80 destabilises the complex.
    evidence:
    - reference: PMID:24223770
      reference_title: "UNC79 and UNC80, putative auxiliary subunits of the NARROW ABDOMEN ion channel, are indispensable for robust circadian locomotor rhythms in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        loss of na, unc79, or unc80 gene function leads to decreased expression
        of all three proteins, with minimal effect on transcript levels
      explanation: >-
        In Drosophila, loss of any one subunit lowers the protein level of all
        three post-transcriptionally, which is the interdependence this edge
        asserts. Shown in fly, not in human neurons.
  - target: Loss of NALCN Surface and Dendritic Targeting
    causal_link_type: DIRECT
    description: >-
      UNC80 and UNC79 tether to the cytoplasmic loops of NALCN, and two of those
      interactions are what drive the channel to the cell surface; a
      C-terminal UNC80 domain additionally overcomes a soma-retention signal to
      place the channel in dendrites.
    evidence:
    - reference: PMID:35550517
      reference_title: "Structure and mechanism of NALCN-FAM155A-UNC79-UNC80 channel complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Two interactions are essential for proper cell surface localization of NALCN.
      explanation: >-
        The cryo-EM structure plus surface-labelling assays assign NALCN surface
        delivery to the UNC79-UNC80 tether.
  - target: Persistent NALCN Auto-Inhibition
    causal_link_type: DIRECT
    description: >-
      A third UNC79-UNC80 interaction normally pulls NALCN's auto-inhibitory CIH
      helix out of its binding site; without UNC80 that relief does not happen
      and the channel remains self-inhibited.
    evidence:
    - reference: PMID:35550517
      reference_title: "Structure and mechanism of NALCN-FAM155A-UNC79-UNC80 channel complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The other interaction relieves the self-inhibition of NALCN by pulling
        the auto-inhibitory CTD Interacting Helix (CIH) out of its binding site.
      explanation: >-
        Defines the activation step that is lost, as distinct from the
        trafficking steps above.
- name: NALCN Channelosome Destabilisation
  description: >-
    NALCN, FAM155A, UNC79 and UNC80 co-assemble into one hetero-tetrameric
    complex whose subunits are mutually required for stability. Without UNC80
    the assembled channelosome is reduced.

      No affected individual develops expressive speech, attributed to the same
      diffuse excitability defect.
    evidence:
    - reference: PMID:28933810
      reference_title: "UNC80 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All individuals lack expressive speech; however, many have expressive
        body language, and a few have used signs to communicate.
      explanation: >-
        Establishes absent expressive speech as universal, and notes retained
        non-verbal communication.
  - target: Dyskinesia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess involuntary limb movement is attributed to altered excitability in
      basal ganglia and related motor circuits.
    evidence:
    - reference: PMID:30167850
      reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most IHPRF2-affected individuals displayed feeding difficulties (11/12),
        hypotonia (10/12), extrapyramidal/abnormal movements (8/12)
      explanation: >-
        Reports extrapyramidal or abnormal movements in 8 of 12; the circuit
        attribution is interpretation.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Seizures occur in a minority and their relationship to a loss of leak
      conductance is unresolved, since reduced excitability would not obviously
      predispose to seizures. Reported frequency differs sharply between series.
    evidence:
    - reference: PMID:28933810
      reference_title: "UNC80 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Seizures may develop during infancy or childhood.
      explanation: >-
        GeneReviews records seizures as part of the phenotype without committing
        to a frequency or a mechanism.
  - target: Central sleep apnea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      NALCN-complex loss disrupts brainstem respiratory rhythm in animals, and
      central sleep apnea is reported in one UNC80 sibling pair. The largest
      UNC80 cohort nonetheless recorded no breathing abnormality, so this edge
      is contested and both sides are cited.
    evidence:
    - reference: PMID:40801661
      reference_title: "Integrated Genomic Approach: A Five Exon Intragenic Deletion in UNC80 Combines With a Novel Splice Variant to Cause IHPRF2 Syndrome in an Italian Family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        both presenting with neonatal hypotonia, severe global developmental
        delay, major feeding difficulties with the need for assisted nutrition,
        inability to speak and walk autonomously, epilepsy, central sleep apnea,
        and facial dysmorphism
      explanation: >-
        Reports central sleep apnea in two siblings with biallelic UNC80
        variants.
    - reference: PMID:30167850
      reference_title: "Genetic variants in components of the NALCN-UNC80-UNC79 ion channel complex cause a broad clinical phenotype (NALCN channelopathies)."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to individuals with IHPRF1, individuals with IHPRF2 did not
        show any breathing abnormalities (0/12), which we will discuss in more
        detail below.
      explanation: >-
        The largest UNC80 cohort found no breathing abnormality in any of 12
        individuals, which argues against apnea being a general consequence of
        UNC80 loss.

- name: Persistent NALCN Auto-Inhibition
  description: >-
    The NALCN C-terminal domain binds an auto-inhibitory CIH helix that holds
    the channel closed. The UNC79-UNC80 heterodimer normally pulls CIH out of
    that site; without UNC80 the channel stays self-inhibited even where it

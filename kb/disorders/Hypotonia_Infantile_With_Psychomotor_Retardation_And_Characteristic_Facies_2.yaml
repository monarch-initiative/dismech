    Homozygous missense allele from the gene-discovery cohort, and the only
    UNC80 patient variant with direct electrophysiological evidence: expressed
    in HEK293T cells it markedly reduced NALCN currents, which is the functional
    basis for calling the disease mechanism a loss of sodium leak conductance.

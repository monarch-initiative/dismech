name: UNC80 Deficiency
creation_date: "2026-11-10T14:11:28Z"
category: Mendelian
synonyms:
- IHPRF2
- hypotonia, infantile, with psychomotor retardation and characteristic facies 2
- UNC80-related neurodevelopmental disorder
- UNC80 hypotonia, infantile, with psychomotor retardation and characteristic facies
- hypotonia, infantile, with psychomotor retardation and characteristic facies caused by mutation in UNC80
- hypotonia, infantile, with psychomotor retardation and characteristic facies type 2
description: >-
  UNC80 deficiency (IHPRF2; OMIM:616801) is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic loss-of-function variants in
  UNC80, which encodes an auxiliary subunit of the NALCN sodium-leak
  channelosome (NALCN-FAM155A-UNC79-UNC80). Affected children present from
  birth with neonatal hypotonia, failure to thrive and severe intellectual
  disability; most never speak and never walk independently. Feeding
  difficulties, strabismus, chronic constipation, sleep disturbance, dyskinetic
  limb movements, an increased tendency to infections, postnatal growth
  deficiency and microcephaly are common, and a recognisable facial gestalt
  (thin or tented upper lip, triangular face) is described. Early death is
  frequent: five of twelve individuals in the largest reported cohort died
  between 10 months and 10 years.

  Mechanistically the disorder is a channelopathy of resting membrane
  potential rather than of action-potential firing. UNC80 and UNC79 form a
  pincer-shaped cytosolic heterodimer that tethers to the intracellular loops
  of the pore-forming NALCN subunit, and this tethering does two separable
  things: it drives NALCN to the cell surface and to dendrites, and it relieves
  NALCN's own auto-inhibition. Biallelic UNC80 loss therefore destabilises and
  mislocalises the channelosome and reduces the voltage-independent sodium
  leak current that sets the neuronal resting membrane potential, which is
  measurable as markedly decreased NALCN currents for a patient missense
  allele. How that single electrophysiological lesion produces the
  craniofacial gestalt and the growth failure is not established and is
  curated here as an explicit knowledge gap rather than as a causal chain.

  Curation scope: IHPRF2 is kept as a standalone entry rather than lumped with
  IHPRF1 (NALCN), even though the two genes encode subunits of the same
  channelosome, because the two disorders are separately delineated clinical
  entities with a documented phenotypic difference - breathing abnormalities
  were recorded in 5/16 IHPRF1-affected individuals and 0/12 IHPRF2-affected
  individuals in the one cohort that assessed both against each other. See the
  entry notes and the lump/split discussion below.

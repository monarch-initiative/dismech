- name: Premature Ovarian Follicle Depletion
  biological_scale: TISSUE
  subtypes:
  - LKENP
  description: >-
    Most women with the leukoencephalopathy develop ovarian failure. How
    AARS2 loss depletes the follicle pool is not known in
    patients. In mice homozygous for the knock-in equivalent of p.Arg199Cys,
    granulosa cells show impaired mitochondrial respiration, with increased
    lactylation and reduced activity of pyruvate dehydrogenase and carnitine
    palmitoyltransferase 2, sustained mTORC1 activation, premature follicle
    activation and accelerated depletion of the primordial follicle pool; the
    authors attribute this to AARS2 acting as a lactyltransferase, a mechanism
    not yet examined in human ovary.
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  evidence:
  - reference: PMID:24808023
    reference_title: Novel (ovario) leukodystrophy related to AARS2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All female patients had ovarian failure.
    explanation: Ovarian failure in every affected woman of the founding series.
  - reference: PMID:41832996
    reference_title: AARS2 R199C mutation induces lactylation-driven premature ovarian insufficiency phenotypes partially reversible by SIRT3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant ovaries exhibited increased lysine lactylation of the metabolic
      enzymes pyruvate dehydrogenase alpha 1 and carnitine palmitoyltransferase
      2, accompanied by reduced activity and impaired mitochondrial respiration
      in granulosa cells.
    explanation: The ovarian mechanism proposed from the knock-in mouse.
  downstream:
  - target: Premature ovarian insufficiency
    causal_link_type: DIRECT
    description: Depletion of the follicle pool produces ovarian insufficiency.
    evidence:
    - reference: PMID:41832996
      reference_title: AARS2 R199C mutation induces lactylation-driven premature ovarian insufficiency phenotypes partially reversible by SIRT3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Female knock-in mice showed irregular estrous cycles, reduced fecundity,
        altered endocrine profiles, and accelerated depletion of the primordial
        follicle pool, reproducing core features of POI.
      explanation: In the knock-in mouse, follicle depletion produces ovarian insufficiency.

diagnosis:
- name: Molecular genetic testing for biallelic AARS2 variants
  description: >-
    The diagnosis rests on biallelic pathogenic AARS2 variants in a patient
    with suggestive findings. For the leukoencephalopathy, the MRI pattern and
    the differential with CSF1R-related disease point to the gene, and genomic
    testing should be prioritised.
  evidence:
  - reference: PMID:39480987
    reference_title: AARS2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of AARS2-related disorder is established in a proband with
      suggestive findings and biallelic pathogenic variants in AARS2 identified
      by molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:42362900
    reference_title: "The clinical, radiological and genetic spectrum AARS2-related leukoencephalopathy: a case series of 15 patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of defining features is essential for diagnosis, and genomic
      testing should be prioritised.
    explanation: The case series' diagnostic recommendation.
differential_diagnoses:
- name: CSF1R-related adult-onset leukoencephalopathy with axonal spheroids and pigmented glia
  description: >-
    The adult-onset phenotype overlaps clinically, radiologically and
    histologically with CSF1R-related disease, which is autosomal dominant.
  distinguishing_features:
  - Autosomal recessive inheritance of biallelic AARS2 variants
  - Premature ovarian failure in most affected women
  evidence:
  - reference: PMID:42362900
    reference_title: "The clinical, radiological and genetic spectrum AARS2-related leukoencephalopathy: a case series of 15 patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AARS2-related leukoencephalopathy is a rare autosomal recessive
      leukodystrophy with overlapping clinical and radiological features with
      CSF1R-related disease but distinct genetic and phenotypic
      characteristics.
    explanation: States the overlap and the differences.

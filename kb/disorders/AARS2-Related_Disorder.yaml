  description: >-
    The brain shows confluent, mainly frontoparietal and periventricular white
    matter lesions with relative sparing of subcortical U-fibres, involvement
    of the corpus callosum and descending tracts, multifocal diffusion
    abnormalities and cerebellar atrophy. Biopsy and neuropathology show
    demyelination, white matter rarefaction, reactive gliosis, axonal
    spheroids and pigmented macrophages, as in CSF1R-related leukoencephalopathy.
    No model reproduces this pathology.

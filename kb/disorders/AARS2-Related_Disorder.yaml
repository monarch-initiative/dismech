name: AARS2-Related Disorder
creation_date: "2026-11-27T13:52:45Z"
category: Mendelian
disease_term:
  preferred_term: AARS2-related disorder
  term:
    id: MONDO:1060240
    label: AARS2-related disorder
synonyms:
- AARS2-RD
- AARS2-related disorders
- alanyl-tRNA synthetase 2-related disorder
parents:
- Mitochondrial Disease
description: >-
  AARS2-related disorder is an autosomal recessive mitochondrial disease caused
  by biallelic variants in AARS2, which encodes the mitochondrial alanyl-tRNA
  synthetase (mt-AlaRS). The enzyme charges mitochondrial tRNA-Ala with
  alanine for mitochondrial protein synthesis and, unlike most mitochondrial
  aminoacyl-tRNA synthetases, also has an editing domain that removes
  wrongly attached amino acids. Pathogenic variants reduce aminoacylation or
  destabilise the protein, impair synthesis of the thirteen mitochondrial
  DNA-encoded respiratory chain subunits, and produce a combined complex I and
  IV deficiency that is most severe in heart and skeletal muscle.

  Two phenotypes are recognised. Infantile-onset cardiomyopathy (combined
  oxidative phosphorylation defect type 8) presents perinatally or in infancy
  with hypertrophic cardiomyopathy, hypotonia, skeletal myopathy, lactic
  acidosis and often lung hypoplasia, and has been fatal in infancy in most
  reported patients. Neurodegeneration with or without leukoencephalopathy
  (progressive leukoencephalopathy with ovarian failure) begins at a mean age
  near 27 years but ranges from infancy to the sixth decade, with psychiatric change and
  cognitive decline followed by pyramidal, cerebellar and extrapyramidal motor
  signs, a frontoparietal leukoencephalopathy with corpus callosum thinning,
  and premature ovarian failure in most affected women. The cardiomyopathy was
  first tied to the recurrent p.Arg592Trp allele, but that allele has since
  been found in patients with the leukoencephalopathy, so the genotypes of the
  two phenotypes are not fully separate.

    explanation: The allelic breadth across 71 individuals.
pathophysiology:
- name: AARS2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic AARS2 variants lower the amount or activity of mitochondrial
    alanyl-tRNA synthetase. Structural modelling predicts that every reported
    variant reduces aminoacylation, severely for the cardiomyopathy genotypes
    and partially for the leukoencephalopathy genotypes. Some missense
    variants act mainly by destabilising the protein: p.Arg580Trp retains
    near-normal catalytic activity in vitro, yet mt-AlaRS is reduced in patient
    fibroblasts and muscle and undetectable in the heart.
  genes:
  - preferred_term: AARS2
    term:
      id: hgnc:21022
      label: AARS2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: alanine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004813
      label: alanine-tRNA ligase activity
  evidence:
  - reference: PMID:25705216
    reference_title: Structural modeling of tissue-specific mitochondrial alanyl-tRNA synthetase (AARS2) defects predicts differential effects on aminoacylation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Nevertheless, our structural analysis predicts that all mutations reduce
      the aminoacylation activity of the synthetase, because all mtAlaRS
      domains contribute to tRNA binding for aminoacylation.
    explanation: Structural prediction that every reported variant lowers aminoacylation.
  - reference: PMID:25705216
    reference_title: Structural modeling of tissue-specific mitochondrial alanyl-tRNA synthetase (AARS2) defects predicts differential effects on aminoacylation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      According to our model, the cardiomyopathy mutations severely compromise
      aminoacylation whereas partial activity is retained by the mutation
      combinations found in the leukodystrophy patients.
    explanation: The predicted residual activity differs between the two phenotypes.
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Quantification of steady-state mt-AlaRS protein levels showed a
      statistically significant decrease in both skeletal and cardiac muscle
      homogenate from Patient 2; mt-AlaRS levels were undetectable in cardiac
      homogenate
    explanation: mt-AlaRS protein is reduced in patient skeletal muscle and absent from heart.
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro data showed that the p.Arg580Trp variant had a minimal effect on
      activation, aminoacylation or misaminoacylation activities relative to
      wild-type mt-AlaRS, demonstrating that instability of mt-AlaRS is the
      biological mechanism underlying the fatal cardiomyopathy phenotype in our
      patients.
    explanation: For this allele the loss of function is loss of protein rather than of catalysis.
  - reference: PMID:25705216
    reference_title: Structural modeling of tissue-specific mitochondrial alanyl-tRNA synthetase (AARS2) defects predicts differential effects on aminoacylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The mtAlaRS differs from the other mtARSs because in addition to the
      aminoacylation domain, it has a conserved editing domain for deacylating
      tRNAs that have been mischarged with incorrect amino acids.
    explanation: The domain organisation of the enzyme, including its editing domain.
  downstream:
  - target: Reduced Mitochondrial tRNA-Ala Aminoacylation
    causal_link_type: DIRECT
    description: Less mt-AlaRS activity leaves less alanine-charged mitochondrial tRNA-Ala.
- name: Reduced Mitochondrial tRNA-Ala Aminoacylation
  biological_scale: MOLECULAR
  description: >-
    Charging of mitochondrial tRNA-Ala with alanine is expected to fall in
    proportion to the lost enzyme activity. This step rests on structural
    prediction: in fibroblasts from cardiomyopathy patients, where the
    respiratory chain is also normal, tRNA-Ala was fully charged, and charging
    could not be measured in the affected heart.
  biological_processes:
  - preferred_term: mitochondrial alanyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0070143
      label: mitochondrial alanyl-tRNA aminoacylation
  evidence:
  - reference: PMID:21549344
    reference_title: Exome sequencing identifies mitochondrial alanyl-tRNA synthetase mutations in infantile mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Protein structure modeling of mtAlaRS suggested that one of the mutations
      affected a unique tRNA recognition site in the editing domain, leading to
      incorrect tRNA aminoacylation, whereas the second mutation severely
      disturbed the catalytic function, preventing tRNA aminoacylation.
    explanation: Modelling of the first cardiomyopathy alleles predicts impaired aminoacylation.
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of aminoacylated mt-tRNAAla showed the presence of charged
      Ala-tRNAAla species with no uncharged tRNAAla in both patient and control
      fibroblasts
    explanation: >-
      In patient fibroblasts, an unaffected cell type in this disease,
      tRNA-Ala charging was normal, so reduced charging has not been shown in
      patient cells.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: Too little charged tRNA-Ala limits translation of alanine codons in mitochondrial transcripts.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits"
  description: >-
    Synthesis of the mitochondrial DNA-encoded respiratory chain subunits
    falls, with loss of complex I and IV subunits in patient skeletal and
    cardiac muscle but not in fibroblasts. A cardiomyocyte-specific Aars2
    deletion in mice also lowers the mitochondrially encoded subunits of the
    heart.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was marked loss of MT-COI (complex IV) and NDUFB8 (complex I)
      subunits with a mild reduction of UQCRC2 (complex III).
    explanation: Loss of mitochondrial DNA-encoded and dependent subunits in patient muscle and heart.
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantification of steady-state levels of mt-AlaRS showed a statistically
      significant decrease in all patients (Fig. 4B). However, there was no
      change in OXPHOS complex subunit levels
    explanation: The defect is tissue-specific; fibroblasts keep normal subunit levels despite less enzyme.
  - reference: PMID:42010330
    reference_title: PCBP1 regulates alternative splicing of AARS2 in congenital cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, mitochondrial-encoded OXPHOS complex proteins MT-ND1, MT-ND2
      and MT-CO2 were reduced in both Pcbp1-cKOCtnt and Aars2-cKOCtnt hearts,
      with a more pronounced decrease observed in Aars2-cKOCtnt hearts
    explanation: Mouse hearts lacking Aars2 exon 16 have fewer mitochondrially encoded subunits.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: >-
      Shortage of mitochondrial DNA-encoded subunits impairs assembly of
      complexes I and IV and of respiratory supercomplexes.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  description: >-
    Complex I and IV activities fall, with a milder fall in complex III, in
    heart and skeletal muscle, and cytochrome c oxidase-deficient fibres
    appear. In the heart the deficiency is near-total and assembly of
    complexes I and IV into respiratory supercomplexes fails.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:30285085
    reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical studies showed markedly decreased activities of mitochondrial
      respiratory chain complexes I and IV with a mild decrease of complex III
      activity in skeletal and cardiac muscle.
    explanation: Combined deficiency in patient skeletal and cardiac muscle.
  - reference: PMID:40863384
    reference_title: Dysfunctional Electron Transport Chain Assembly in COXPD8.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, our data demonstrate that the two mutations of the AARS2
      gene are associated with failed assembly of Cx I and Cx IV and reduced
      formation of respiratory supercomplexes of the ETC, likely leading to
      acute bioenergetic stress.
    explanation: Failed complex I and IV assembly in a patient's heart.
  - reference: PMID:42010330
    reference_title: PCBP1 regulates alternative splicing of AARS2 in congenital cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistically, loss of Pcbp1 or Aars2 in the heart reduces oxidative
      phosphorylation, a hallmark of patients with AARS2 mutations.
    explanation: The mouse heart model reproduces the oxidative phosphorylation defect.
  downstream:
  - target: Striated Muscle Energy Failure
    causal_link_type: DIRECT
    description: The respiratory chain defect starves cardiomyocytes and skeletal muscle fibres of ATP.
  - target: Cerebral White Matter Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed: energy insufficiency in the brain contributes to white matter
      injury. The respiratory chain has rarely been studied in tissue from
      patients with the leukoencephalopathy.
    evidence:
    - reference: PMID:42650065
      reference_title: "Advances in Research on AARS1/AARS2-Related Disorders: A Focus on Leukodystrophies."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        High-energy-demand tissues, such as the central nervous system and
        skeletal muscle, may be particularly vulnerable to ATP insufficiency and
        AARS1/AARS2 dysfunction, potentially contributing to white matter injury
        and dysfunction
      explanation: A review's statement of the energy-failure hypothesis, explicitly tentative.
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: With oxidative phosphorylation constrained, pyruvate is reduced to lactate.
  - target: Decreased activity of mitochondrial complex I
    causal_link_type: DIRECT
    description: Complex I activity is reduced in heart and skeletal muscle.
  - target: Decreased activity of mitochondrial complex IV
    causal_link_type: DIRECT
    description: Complex IV activity is reduced in heart and skeletal muscle.

- name: Oral alanine supplementation
  description: >-
    Supplementation with alanine, the substrate of the defective enzyme, was
    given for two years to two adults with the leukoencephalopathy in a pilot
    trial with DARS2 patients. It was safe but did not improve global,
    cognitive or motor scores.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-alanine
      term:
        id: CHEBI:16977
        label: L-alanine
  evidence:
  - reference: PMID:41075682
    reference_title: "Amino acid supplementation in patients affected by leukoencephalopathies associated with mitochondrial aminoacyl tRNA synthetase pathogenic variants: Pilot clinical trial in adults and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recruited 6 adult patients affected by AARS2 (n = 2) and DARS2 (n = 4)
      related leukoencephalopathies and started an oral supplementation with
      alanine and aspartate, respectively, for a total duration of 2 years.
    explanation: The pilot trial design.
  - reference: PMID:41075682
    reference_title: "Amino acid supplementation in patients affected by leukoencephalopathies associated with mitochondrial aminoacyl tRNA synthetase pathogenic variants: Pilot clinical trial in adults and review of literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the treatment was safe and well tolerated by all patients, but
      efficacy endpoints were not met as no significant improvements were
      observed in global, cognitive, or motor scores.
    explanation: No efficacy was shown in this small uncontrolled trial.
animal_models:
- name: Aars2 exon 16 cardiomyocyte-specific deletion mouse
  species: Mouse
  genotype: Aars2 exon 16 floxed, deleted in cardiomyocytes by Ctnt-Cre or Myh6-Cre
  description: >-
    Deletion of Aars2 exon 16 models the human splice-site variants predicted to
    skip this exon. Early deletion (Ctnt-Cre) causes ventricular
    non-compaction, myocardial thinning and death before birth; later deletion
    (Myh6-Cre) causes progressive cardiac dilation, heart failure and death by
    postnatal day 66. Hearts lose mitochondrially encoded respiratory chain
    subunits.
  publication: PMID:42010330
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The deletion reduces cardiac oxidative phosphorylation, as in patients.
    limitations: >-
      The deletion is homozygous and confined to cardiomyocytes, whereas
      patients are compound heterozygous or homozygous for germline alleles in
      every tissue; the cardiomyopathy is non-compaction or dilated rather than
      hypertrophic.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: IMMATERIAL
      description: >-
        Only cardiomyocytes lose Aars2, so skeletal muscle, lung and brain are
        outside the model; this does not bear on the cardiac respiratory chain
        claim.
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The mice develop non-compaction or dilated cardiomyopathy, whereas the
        human infantile disease is a hypertrophic cardiomyopathy, so the model
        speaks to the respiratory chain defect more than to the cardiac
        morphology.
    evidence:
    - reference: PMID:42010330
      reference_title: PCBP1 regulates alternative splicing of AARS2 in congenital cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similarly, mice with a deletion in Aars2 that mimics a disease-causing
        splicing lesion display heart developmental abnormalities, reminiscent of
        those in patients with infantile mitochondrial cardiomyopathy.
      explanation: The model's relation to the human cardiomyopathy.
  evidence:
  - reference: PMID:42010330
    reference_title: PCBP1 regulates alternative splicing of AARS2 in congenital cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Aars2-cKOMyh6 mice exhibit early lethality; all died by P66 with a median
      survival of 50 days
    explanation: Later cardiomyocyte deletion is lethal in young adult mice.
- name: Aars2 R194C knock-in mouse
  species: Mouse
  genotype: Aars2 p.R194C homozygous knock-in (equivalent to human p.Arg199Cys)
  description: >-
    Homozygous knock-in mice model a recurrent human leukoencephalopathy
    allele. Females show irregular estrous cycles, reduced fecundity and
    accelerated loss of primordial follicles, reproducing premature ovarian
    insufficiency. Loss of the mitochondrial delactylase sirtuin-3 mitigated
    the ovarian abnormalities.
  publication: PMID:41832996
  modeled_mechanisms:
  - target: Premature Ovarian Follicle Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The knock-in reproduces follicle depletion and ovarian insufficiency.
    limitations: >-
      The lactylation mechanism comes from this single mouse study and has not
      been examined in human ovary; neurological features of the knock-in are
      not described.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mechanism is inferred from mouse ovaries; whether AARS2-driven
        lactylation of pyruvate dehydrogenase and carnitine
        palmitoyltransferase 2 occurs in human granulosa cells is untested.
    evidence:
    - reference: PMID:41832996
      reference_title: AARS2 R199C mutation induces lactylation-driven premature ovarian insufficiency phenotypes partially reversible by SIRT3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Female knock-in mice showed irregular estrous cycles, reduced fecundity,
        altered endocrine profiles, and accelerated depletion of the primordial
        follicle pool, reproducing core features of POI.
      explanation: The knock-in reproduces premature ovarian insufficiency.
  evidence:
  - reference: PMID:41832996
    reference_title: AARS2 R199C mutation induces lactylation-driven premature ovarian insufficiency phenotypes partially reversible by SIRT3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings demonstrate that the Aars2 R194C/R199C mutation
      alone is sufficient to induce POI and establish a lactylation-driven
      metabolic mechanism underlying early follicle activation.
    explanation: The authors' conclusion about the allele and its ovarian mechanism.
references:
- reference: PMID:39480987
  title: AARS2-Related Disorder.
  tags:
  - GeneReviews
notes: >-
  The GeneReviews chapter AARS2-Related Disorder (PMID:39480987) is the
  phenotype baseline; feature frequencies for the later-onset phenotype come
  from a 2026 multicentre series and literature review of 71 individuals
  (PMID:42362900). Lump or split. The two phenotypes are curated as subtypes of
  one disease, matching MONDO, which places both under AARS2-related disorder
  (MONDO:1060240), and GeneReviews, which covers both in one chapter; the
  allele p.Arg592Trp, once thought specific to the cardiomyopathy, occurs in
  both.

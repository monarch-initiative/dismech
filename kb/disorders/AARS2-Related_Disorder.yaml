- name: Supportive and symptomatic management
  description: >-
    No disease-modifying therapy exists. For the cardiomyopathy, standard
    treatment of hypertrophic cardiomyopathy, respiratory failure and seizures,
    with tube feeding as needed; for the neurodegenerative phenotype,
    dopaminergic therapy for parkinsonism, botulinum toxin for spasticity,
    rehabilitation, management of hypogonadism, and psychiatric care.
    GeneReviews advises caution with sedatives, antipsychotics and other drugs
    that lower alertness and raise the risk of falls.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39480987
    reference_title: AARS2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In AARS2-related infantile-onset cardiomyopathy, standard treatment for
      hypertrophic cardiomyopathy, respiratory failure, and seizures; feeding
      therapy with tube feedings as required.
    explanation: GeneReviews management of the infantile phenotype.
  - reference: PMID:39480987
    reference_title: AARS2-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sedatives, antipsychotics, and other medications that may decrease
      alertness and increase the risk of falling should be used cautiously.
    explanation: GeneReviews agents and circumstances to avoid.
- name: Dopaminergic therapy for parkinsonism

  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic AARS2 variants cause both phenotypes. Dozens of unrelated
    families are reported, with segregation, reduced mt-AlaRS protein and a
    combined respiratory chain defect in patient tissue, yeast complementation,
    and mouse models of the cardiac and ovarian features.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:39480987
      reference_title: AARS2-Related Disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: AARS2-related disorder is inherited in an autosomal recessive manner.
      explanation: Recessive inheritance of the AARS2 disorder.
  notes: >-
    ClinGen classifies AARS2 as Definitive (autosomal recessive) for
    mitochondrial disease (MONDO:0044970), a broader MONDO concept than this
    entry's MONDO:1060240 or either subtype term, so no tier is recorded in
    gene_disease_validity. A 2026 series of 71 individuals with the
    leukoencephalopathy counted 72 distinct AARS2 variants, mostly missense.
    Cardiomyopathy-associated genotypes usually carry p.Arg592Trp, in the
    editing domain, on at least one allele, but p.Arg592Trp has also been found
    in the leukoencephalopathy and some cardiomyopathy patients lack it.
  variants:
  - name: c.1774C>T, p.Arg592Trp
    description: >-
      The recurrent editing-domain allele of the infantile cardiomyopathy,
      predicted to severely compromise aminoacylation; also seen in patients
      with the leukoencephalopathy.
    evidence:
    - reference: PMID:30285085
      reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        To date, all described patients with AARS2-related fatal infantile
        cardiomyopathy are united by either a homozygous or compound
        heterozygous c.1774C>T (p.Arg592Trp) missense founder mutation that is
        absent in patients with other AARS2-related phenotypes.
      explanation: The allele's association with the cardiomyopathy as understood in 2019.
    - reference: PMID:42362900
      reference_title: "The clinical, radiological and genetic spectrum AARS2-related leukoencephalopathy: a case series of 15 patients and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Notably, variants previously linked only to infantile cardiomyopathy,
        including p.Arg592Trp, were observed.
      explanation: The same allele occurs in leukoencephalopathy patients.
  - name: c.1738C>T, p.Arg580Trp
    description: >-
      Found in two unrelated boys with fatal infantile cardiomyopathy who did
      not carry p.Arg592Trp, in trans with a nonsense allele or an intragenic
      deletion. It leaves catalytic activity nearly intact but destabilises the
      protein.
    evidence:
    - reference: PMID:30285085
      reference_title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal infantile-onset cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using next-generation sequencing, we identified a c.1738C>T
        (p.Arg580Trp) AARS2 variant shared by both patients that was in trans
        with a loss-of-function heterozygous AARS2 variant; a c.1008dupT
        (p.Asp337*) nonsense variant or an intragenic deletion encompassing
        AARS2 exons 5-7.
      explanation: The genotypes of the two boys.
  - name: p.Arg199Cys
    description: >-
      A leukoencephalopathy allele reported repeatedly in patients; a mouse
      knock-in of the equivalent residue reproduces premature ovarian
      insufficiency.
    evidence:
    - reference: PMID:41832996
      reference_title: AARS2 R199C mutation induces lactylation-driven premature ovarian insufficiency phenotypes partially reversible by SIRT3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The alanine-tRNA synthetase 2 (AARS2) R199C mutation has been repeatedly
        reported in patients, but its physiological effects are unknown.
      explanation: The recurrence of the allele in patients, as background to the mouse study.
  evidence:
  - reference: PMID:21549344
    reference_title: Exome sequencing identifies mitochondrial alanyl-tRNA synthetase mutations in infantile mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rigorous data analysis allowed us to identify a homozygous missense
      mutation in AARS2, which we showed to encode the mitochondrial
      alanyl-tRNA synthetase (mtAlaRS).
    explanation: Identification of AARS2 as the gene for the infantile cardiomyopathy.
  - reference: PMID:24808023
    reference_title: Novel (ovario) leukodystrophy related to AARS2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing revealed compound heterozygous mutations in
      AARS2 encoding mitochondrial alanyl-tRNA synthetase in both patients.
    explanation: Identification of AARS2 variants in the leukoencephalopathy.
  - reference: PMID:24808023
    reference_title: Novel (ovario) leukodystrophy related to AARS2 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Functional studies in yeast confirmed the pathogenicity of the mutations in one patient.
    explanation: Yeast functional testing of leukoencephalopathy alleles.
  - reference: PMID:42362900
    reference_title: "The clinical, radiological and genetic spectrum AARS2-related leukoencephalopathy: a case series of 15 patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-two unique AARS2 variants were identified, including seven novel

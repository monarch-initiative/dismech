    readouts:
    - name: Apolipoprotein B secretion
      target: Dysregulated Hepatic Lipoprotein Secretion
      direction: INCREASED
      interpretation: >-
        Direct measure of the secretion node in cells carrying the patient
        genotype.
      evidence:
      - reference: PMID:34626841
        reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          HepG2 hepatoma cells, in which the expression of TMEM199 and CCDC115 was
          silenced, and induced pluripotent stem cell (iPSC)-derived
          hepatocyte-like cells from patients with TMEM199 mutations showed
          markedly increased secretion of apolipoprotein B (apoB) compared with
          controls.
        explanation: >-
          The two systems agree on direction, which is what makes the finding
          attributable to TMEM199 loss rather than to either system's quirks.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."

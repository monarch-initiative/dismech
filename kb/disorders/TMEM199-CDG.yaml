discussions:
- discussion_id: tmem199_copper_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is serum ceruloplasmin low in TMEM199-CDG -- because ceruloplasmin itself
    is hypoglycosylated and cleared faster, because copper loading of
    apoceruloplasmin fails in an abnormally acidified compartment, or both?
  attaches_to:
  - pathophysiology#Abnormal Copper and Ceruloplasmin Handling
  rationale: >-
    Low ceruloplasmin is one of the two features that make this a Wilson mimic,
    and it recurs across every Golgi-homeostasis CDG, so it is not incidental.
    But no reported study separates the glycoprotein-stability explanation from
    the copper-loading one in these patients. The edge into this node is marked
    INDIRECT_UNKNOWN_INTERMEDIATES for that reason.
  status: OPEN
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biological results were similar to previously described patients, including
      hypercholesterolemia, elevated alkaline phosphatases and defects in copper
      metabolism.
    explanation: >-
      The copper defect is a class feature of these disorders rather than a
      TMEM199 peculiarity, which is what makes the unexplained mechanism worth
      recording.
- discussion_id: tmem199_course_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is TMEM199-CDG genuinely non-progressive, or does the reported stability
    reflect the p.Arg31Pro founder allele that most published patients carry?
  attaches_to:
  - progression#Childhood to adolescence, non-progressive
  - phenotypes#Periportal hepatic fibrosis
  - phenotypes#Cirrhosis
  rationale: >-
    The two-decade stability that families are told about comes from European
    patients, four of seven families of whom carry the same p.Arg31Pro allele.
    The one Chinese patient, carrying a different frameshift variant, had
    cirrhosis on biopsy. With nine patients total the genotype and the geography
    are confounded, and the reassuring prognosis may not generalise.
  status: OPEN
  evidence:
  - reference: PMID:35401690
    reference_title: "TMEM199-Congenital Disorder of Glycosylation With Novel Phenotype and Genotype in a Chinese Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, novel findings included strabismus, cirrhosis
      by liver biopsy, reduced expression of TMEM199 by immunohistochemistry, and
      a frameshift variant of c.128delA/p.Lys43Argfs*25 in the TMEM199 gene.
    explanation: >-
      The one patient outside the Mediterranean founder group, with a different
      variant, is also the one with cirrhosis.
notes: >-
  hgnc:18085 goes by two symbols depending on which HGNC snapshot you ask. The
  live API says VMA12; the HGNC build behind `just validate-terms`, and every
  clinical paper, says TMEM199. The binding here is TMEM199. The stub file for
  this disease says VMA12, because stub enrichment read the newer release, so the
  repository currently disagrees with itself about this one gene symbol.

  This entry is a sibling of CCDC115-CDG, curated in parallel under
  monarch-initiative/dismech#10097. The two disorders share a mechanism class and
  much of their literature. They are deliberately kept as independent files with
  no cross-file entity references, so neither depends on the other merging.

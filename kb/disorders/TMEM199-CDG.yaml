name: TMEM199-CDG
creation_date: "2026-08-31T15:10:00Z"
description: >-
  TMEM199-CDG is an autosomal recessive type II congenital disorder of
  glycosylation caused by biallelic variants in TMEM199 (HGNC symbol VMA12), the
  human homolog of the yeast V-ATPase assembly factor Vph2p/Vma12p. Loss of
  TMEM199 disturbs Golgi pH homeostasis, and the resulting combined N- and
  mucin-type O-glycosylation defect presents as a liver disease rather than a
  neurological one: raised transaminases and alkaline phosphatase,
  hypercholesterolaemia, hepatic steatosis, and low serum ceruloplasmin and
  copper. That last combination makes it a Wilson disease mimic, and the absence
  of encephalopathy is the feature that most distinguishes it from the rest of
  the CDG family.
category: Mendelian
disease_term:
  preferred_term: TMEM199-CDG
  term:
    id: MONDO:0014790
    label: TMEM199-CDG
synonyms:
- TMEM199 deficiency
- congenital disorder of glycosylation type IIp
- CDG2P
- CDG-IIp
- VMA12 deficiency
parents:
- congenital disorder of glycosylation type II
- disorder of Golgi homeostasis
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported patients carry biallelic TMEM199 variants, homozygous or compound
    heterozygous.
  evidence:
  - reference: PMID:29321044
    reference_title: "Three unreported cases of TMEM199-CDG, a rare genetic liver disease with abnormal glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three patients carried the same set of mutations (c.13-14delTT
      (p.Ser4Serfs*30) and c.92G > C (p.Arg31Pro), despite only two were related
      (siblings).
    explanation: >-
      Compound heterozygous variants in unrelated as well as related patients
      support a recessive mode.
prevalence:
- population: Reported TMEM199-CDG literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Nine patients had been reported by 2023: four in the discovery paper, three
    in a follow-up series, one from China and one further Italian case.
  evidence:
  - reference: PMID:36706865
    reference_title: "Higher frequency of TMEM199-CDG in the southern mediterranean area is associated with c.92G>C (p.Arg31Pro) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only eight patients with TMEM199-CDG have been described including seven
      Europeans (originating from Greece and Italy) and one Chinese.
    explanation: >-
      The cumulative case count before the reporting paper's own patient is
      stated directly.
- population: Southern Mediterranean (Greece and southern Italy)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Seven of nine reported patients originate from the southern Mediterranean,
    and the c.92G>C (p.Arg31Pro) allele recurs in four of seven families. That
    is a strong hint of a founder allele, but nine patients is not a population
    frequency and no carrier screening has been done, so no rate is recorded.
  evidence:
  - reference: PMID:36706865
    reference_title: "Higher frequency of TMEM199-CDG in the southern mediterranean area is associated with c.92G>C (p.Arg31Pro) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMEM199-CDG is an ultra-rare CDG relatively frequent in the southern
      Mediterranean area (7 in 9 patients, 77%).
    explanation: >-
      The geographic clustering is quantified over the whole published series.
progression:
- phase: Childhood to adolescence, non-progressive
  notes: >-
    The disease is chronic and, over decades of follow-up in two patients, did
    not deteriorate. That stability is unusual among the Golgi-homeostasis CDGs
    and is the piece of information families most need at diagnosis.
  evidence:
  - reference: PMID:29321044
    reference_title: "Three unreported cases of TMEM199-CDG, a rare genetic liver disease with abnormal glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the patients were clinically assessed over two decades without
      deterioration.
    explanation: >-
      Two decades of stable disease is direct evidence for a non-progressive
      course.
  - reference: PMID:29321044
    reference_title: "Three unreported cases of TMEM199-CDG, a rare genetic liver disease with abnormal glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the present and the four previously reported patients do not show
      encephalopathy but a chronic, non-progressive (over decades) liver disease
      with hypertransaminasemia and steatosis.
    explanation: >-
      The course is stated for the whole reported series to that point.
pathophysiology:
- name: TMEM199 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic TMEM199 variants reduce the protein. Reduced protein was confirmed
    by Western blot in patient fibroblasts and by immunohistochemistry on liver.
  genes:
  - preferred_term: TMEM199
    term:
      id: hgnc:18085
      label: TMEM199
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, we analyzed raw exome-sequencing data from families affected
      by genetically unsolved CDGs and identified four individuals with different
      mutations in TMEM199.
    explanation: >-
      Establishes that biallelic TMEM199 variants are the lesion in affected
      individuals. The protein's assembly-factor identity is a separate claim,
      cited on the Failed V-ATPase Assembly node with its own quote.
  - reference: PMID:29321044
    reference_title: "Three unreported cases of TMEM199-CDG, a rare genetic liver disease with abnormal glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western Blot analysis confirmed a reduced level of TMEM199 protein in
      patient fibroblasts and all patients showed a similar glycosylation defect.
    explanation: >-
      Reduced protein is measured in patient cells, alongside the glycosylation
      consequence.
  downstream:
  - target: Failed V-ATPase Assembly
    causal_link_type: DIRECT
    description: >-
      TMEM199 is the human homolog of the yeast V-ATPase assembly factor
      Vph2p/Vma12p, so its loss removes the assembly step itself rather than a
      pump subunit.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recently, novel inborn errors of metabolism were identified because of
        mutations in V-ATPase assembly factors TMEM199 and CCDC115.
      explanation: >-
        Names both genes as V-ATPase assembly factors, which is the step this
        node records.
- name: Failed V-ATPase Assembly
  biological_scale: MOLECULAR
  description: >-
    The vacuolar ATPase cannot be assembled normally, so the proton pumping that
    acidifies the Golgi and the lysosome is compromised. Splitting this out from
    the general "disturbed Golgi homeostasis" node matters because it is the
    shared step: it is what makes the lysosomal and autophagic phenotype a
    consequence of the same lesion rather than an unexplained extra finding, and
    it is what TMEM199-CDG and CCDC115-CDG have in common.
  biological_processes:
  - preferred_term: vacuolar proton-transporting V-type ATPase complex assembly
    modifier: DECREASED
    term:
      id: GO:0070072
      label: vacuolar proton-transporting V-type ATPase complex assembly
  - preferred_term: proton transmembrane transport
    modifier: DECREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we identified uncharacterized transmembrane protein 199 (TMEM199,
      previously called C17orf32) as a human homolog of yeast V-ATPase assembly
      factor Vph2p (also known as Vma12p)
    explanation: >-
      The assembly-factor role was established by homology to a yeast protein,
      which is a computational inference rather than a measurement in human
      cells. Graded COMPUTATIONAL for that reason.
  downstream:
  - target: Disturbed Golgi Homeostasis
    causal_link_type: DIRECT
    description: >-
      Failed acidification disturbs Golgi luminal pH and organelle integrity.
      Liver electron microscopy shows dilated ER and Golgi.
    evidence:
    - reference: PMID:26833330
      reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        electron microscopy of a liver biopsy showed dilated organelles
        suggestive of the endoplasmic reticulum and Golgi apparatus
      explanation: >-
        Structural Golgi and ER abnormality is seen in the affected organ itself,
        not only in cultured cells.
  - target: Impaired Lysosomal Acidification and Autophagy
    causal_link_type: DIRECT
    description: >-
      The same assembly failure affects the lysosomal V-ATPase, which is why the
      lysosomal phenotype does not need a separate explanation.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Further investigation of lysosomal function revealed impaired
        acidification combined with impaired autophagic capacity.
      explanation: >-
        The lysosomal acidification defect is measured directly in the silenced
        hepatocyte model.
- name: Disturbed Golgi Homeostasis
  biological_scale: CELLULAR
  description: >-
    V-ATPase-dependent compartment acidification is impaired. TMEM199 localises
    with ERGIC and COPI markers, placing the lesion in the early secretory
    pathway.
  biological_processes:
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  - preferred_term: vacuolar acidification
    modifier: DECREASED
    term:
      id: GO:0007035
      label: vacuolar acidification
  locations:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      V5-tagged TMEM199 localized with ERGIC and COPI markers in HeLa cells
    explanation: >-
      Subcellular localisation places the protein in the early secretory pathway,
      which is where the acidification defect acts.
  downstream:
  - target: Combined N- and O-Glycosylation Defect
    causal_link_type: DIRECT
    description: >-
      Golgi-stage glycosyltransferases and glycosidases are pH-sensitive, so
      disturbed acidification produces a processing defect rather than an
      assembly defect.
    evidence:
    - reference: PMID:36706865
      reference_title: "Higher frequency of TMEM199-CDG in the southern mediterranean area is associated with c.92G>C (p.Arg31Pro) mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Matrix-assisted laser desorption/ionization mass spectrometry analyses
        showed abnormal N- and O- protein glycosylation, indicative of a Golgi
        processing defect and supporting the function of TMEM199 in maintaining
        Golgi homeostasis.
      explanation: >-
        The authors draw exactly this causal link from the glycan pattern back to
        Golgi homeostasis.
  - target: Impaired Lysosomal Acidification and Autophagy
    causal_link_type: DIRECT
    description: >-
      The same V-ATPase dependence extends beyond the Golgi: silencing TMEM199 in
      hepatocyte models impairs lysosomal acidification and autophagic capacity.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Further investigation of lysosomal function revealed impaired
        acidification combined with impaired autophagic capacity.
      explanation: >-
        The lysosomal arm is measured in the silenced hepatocyte model.
- name: Combined N- and O-Glycosylation Defect
  biological_scale: MOLECULAR
  description: >-
    Abnormal N- and mucin-type O-glycosylation with reduced incorporation of
    galactose and sialic acid, the pattern shared across Golgi homeostasis
    defects. Lentiviral transduction with wild-type TMEM199 restores it, which is
    the rescue that ties the glycosylation defect to the gene.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  - preferred_term: protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals showed abnormal N- and mucin-type O-glycosylation, and
      mass spectrometry indicated reduced incorporation of galactose and sialic
      acid, as seen in other Golgi homeostasis defects.
    explanation: >-
      The glycan defect is characterised in patients and placed in its mechanism
      class.
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Metabolic labeling of sialic acids in fibroblasts confirmed deficient Golgi
      glycosylation, which was restored by lentiviral transduction with wild-type
      TMEM199.
    explanation: >-
      Restoration by wild-type transduction is a rescue, so it establishes the
      gene-to-glycan link rather than merely correlating them.
  downstream:
  - target: Type II Transferrin Isoform Profile
    causal_link_type: DIRECT
  - target: Abnormal Copper and Ceruloplasmin Handling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Low ceruloplasmin and low serum copper are consistent findings across the
      Golgi-homeostasis CDGs. Whether they follow from hypoglycosylation of
      ceruloplasmin itself, from failed ATP7B-dependent copper loading in an
      abnormally acidified compartment, or from both is not established in these
      patients.
- name: Impaired Lysosomal Acidification and Autophagy
  biological_scale: CELLULAR
  description: >-
    Lysosomal acidification and autophagic capacity are impaired, and abnormally
    large lipid droplets accumulate and colocalise with lysosomes.
  biological_processes:
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  - preferred_term: lipid droplet organization
    modifier: ABNORMAL
    term:
      id: GO:0034389
      label: lipid droplet organization
  locations:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the siTMEM199 and siCCDC115 HepG2 hepatocyte models, increased numbers
      and size of lipid droplets were observed, including abnormally large lipid
      droplets, which colocalized with lysosomes.
    explanation: >-
      The lipid droplet-lysosome phenotype is measured directly in the silenced
      hepatocyte model.
  downstream:
  - target: Hepatic Steatosis
    causal_link_type: DIRECT
    description: >-
      Failed lipid droplet clearance rather than excess synthesis. The study
      excluded the alternatives explicitly.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Excessive de novo lipogenesis, failing oxidative capacity, and elevated
        lipid uptake were not observed.
      explanation: >-
        Ruling out the three competing explanations is what makes the clearance
        mechanism the supported one, so this negative result is the load-bearing
        evidence for the edge.
- name: Dysregulated Hepatic Lipoprotein Secretion
  biological_scale: CELLULAR
  description: >-
    Patients show hyperlipidaemia with raised VLDL-range lipoproteins, and
    TMEM199-silenced HepG2 cells and patient iPSC-derived hepatocyte-like cells
    secrete markedly more apolipoprotein B.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:34626841
    reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HepG2 hepatoma cells, in which the expression of TMEM199 and CCDC115 was
      silenced, and induced pluripotent stem cell (iPSC)-derived hepatocyte-like
      cells from patients with TMEM199 mutations showed markedly increased
      secretion of apolipoprotein B (apoB) compared with controls.
    explanation: >-
      Patient-derived cells and a silenced line agree on raised apoB secretion.
  downstream:
  - target: Hypercholesterolaemia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with TMEM199 and CCDC115 mutations displayed hyperlipidemia,
        characterized by increased levels of lipoproteins in the very low density
        lipoprotein range.
      explanation: >-
        The lipoprotein abnormality is measured in patient plasma.
- name: Hepatic Steatosis
  biological_scale: TISSUE
  description: >-
    Fatty liver, present from the discovery series onward and progressing to
    fibrosis or cirrhosis in a minority.
  locations:
  - preferred_term: liver

experimental_models:
- name: TMEM199-silenced HepG2 hepatoma cells
  experimental_model_type: CELL_LINE
  description: >-
    HepG2 with TMEM199 knocked down by siRNA. This is the system that carries
    the lysosomal and lipid-droplet measurements.
  modeled_mechanisms:
  - target: Impaired Lysosomal Acidification and Autophagy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces impaired lysosomal acidification, impaired autophagy and
      abnormally large lysosome-colocalised lipid droplets.
    limitations: >-
      HepG2 is a hepatoma line and the silencing is acute rather than
      constitutional, so the model does not capture a lifetime of adaptation. The

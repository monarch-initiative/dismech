diagnosis:
- name: CDG screening in unexplained liver disease
  description: >-
    Because the presentation is hepatic and the ceruloplasmin is low, these
    patients are worked up for Wilson disease and mitochondrial or storage
    disorders before anyone screens for a CDG. The reviews recommend CDG
    screening in unexplained severe liver disease for exactly this reason.
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides pointing to the importance of CDG screening in patients with
      unexplained and severe liver disease
    explanation: >-
      The recommendation is stated for the sibling disorder CCDC115-CDG, whose
      diagnostic problem is the same one; it is cited here as a
      differential-diagnosis argument rather than as a TMEM199-specific finding.
differential_diagnoses:
- name: Wilson disease
  description: >-
    Low ceruloplasmin plus liver disease is the classic Wilson picture. The
    discriminator is urinary copper, which is normal here and raised in Wilson
    disease, and the transferrin isoform profile, which is normal in Wilson
    disease.
  evidence:
  - reference: PMID:36706865
    reference_title: "Higher frequency of TMEM199-CDG in the southern mediterranean area is associated with c.92G>C (p.Arg31Pro) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      such as TMEM199-CDG, a non-encephalopathic liver disorder with Wilson
      disease-like phenotype
    explanation: >-
      The source names the Wilson disease resemblance as the defining diagnostic
      trap.
  - reference: PMID:35401690
    reference_title: "TMEM199-Congenital Disorder of Glycosylation With Novel Phenotype and Genotype in a Chinese Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With a suspected diagnosis of Wilson disease according to the clinical
      manifestation, a multi-gene panel was screened.
    explanation: >-
      The misdiagnosis is not hypothetical: this patient was worked up as Wilson
      disease first.
  - reference: PMID:35401690
    reference_title: "TMEM199-Congenital Disorder of Glycosylation With Novel Phenotype and Genotype in a Chinese Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the absence of ATP7B mutation and normal DNA copy number variant
      (CNV) ruled out Wilson disease.
    explanation: >-
      Names what actually excluded Wilson disease in practice: ATP7B sequencing,
      not the biochemistry, since the biochemistry overlaps.
- name: CCDC115-CDG
  description: >-
    The closest sibling: another V-ATPase assembly factor, the same biochemical
    signature of hypercholesterolaemia, raised alkaline phosphatase and defective
    copper metabolism. CCDC115-CDG more often carries neurological involvement
    and progresses to fibrosis and cirrhosis, whereas TMEM199-CDG is usually
    non-encephalopathic and stable.
  evidence:
  - reference: PMID:29759592
    reference_title: "CCDC115-CDG: A new rare and misleading inherited cause of liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while two individuals clinically presented with early and severe liver
      fibrosis and cirrhosis associated with neurological symptoms, the other one
      "only" showed isolated and late severe liver involvement
    explanation: >-
      The CCDC115-CDG series documents the neurological involvement and severe
      fibrosis that distinguish it from the usually stable TMEM199-CDG course.
- name: Other Golgi-homeostasis CDGs with liver involvement
  description: >-
    MPI-CDG, ATP6AP1-CDG and the COG-CDGs share the isolated or predominant liver
    presentation. MPI-CDG matters most in practice because it is treatable with
    oral mannose.
  evidence:
  - reference: PMID:28108845
    reference_title: "Liver involvement in congenital disorders of glycosylation (CDG). A systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we distinguish two main groups: on the one hand, the CDG types with
      predominant or isolated liver involvement including MPI-CDG, TMEM199-CDG,
      CCDC115-CDG, and ATP6AP1-CDG
    explanation: >-
      The review groups these four as the predominantly hepatic CDGs.

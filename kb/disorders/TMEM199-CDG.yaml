- name: Abnormal Copper and Ceruloplasmin Handling
  biological_scale: ORGANISM
  description: >-
    Low serum ceruloplasmin and low serum copper with normal urinary copper
    excretion. This is the combination that makes the disorder a Wilson disease
    mimic, and the normal urinary copper is what separates the two at the
    bedside.
  evidence:
  - reference: PMID:36706865
    reference_title: "Higher frequency of TMEM199-CDG in the southern mediterranean area is associated with c.92G>C (p.Arg31Pro) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A persistent increase in serum transaminases, total and low-density
      lipoprotein cholesterol and low serum ceruloplasmin and copper levels and
      normal urinary copper excretion were observed.
    explanation: >-
      The full biochemical pattern including the normal urinary copper is
      reported in one patient's workup.
- name: Type II Transferrin Isoform Profile
  biological_scale: ORGANISM
  description: >-
    The screening biochemical readout of a Golgi-stage glycosylation defect.
  evidence:
  - reference: PMID:28108845
    reference_title: "Liver involvement in congenital disorders of glycosylation (CDG). A systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      we distinguish two main groups: on the one hand, the CDG types with
      predominant or isolated liver involvement including MPI-CDG, TMEM199-CDG,
      CCDC115-CDG, and ATP6AP1-CDG
    explanation: >-
      The review places TMEM199-CDG in the isolated-liver CDG group, which is the
      group defined by this screening abnormality. It does not state the
      transferrin profile for TMEM199-CDG specifically, so the inference to this
      node is one step removed.

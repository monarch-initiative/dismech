      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:26833330
    reference_title: "TMEM199 Deficiency Is a Disorder of Golgi Homeostasis Characterized by Elevated Aminotransferases, Alkaline Phosphatase, and Cholesterol and Abnormal Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The adolescent individuals presented with a mild phenotype of hepatic
      steatosis, elevated aminotransferases and alkaline phosphatase, and
      hypercholesterolemia, as well as low serum ceruloplasmin.
    explanation: >-
      Steatosis is part of the founding clinical description.
  downstream:
  - target: Hepatocellular Injury
    causal_link_type: DIRECT
  - target: Dysregulated Hepatic Lipoprotein Secretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - increased secretion of apoB-containing particles from the steatotic liver
    description: >-
      The authors propose that the increased apoB secretion is itself secondary
      to the steatosis, which is what connects the lipoprotein arm to the rest of
      the chain rather than leaving it as a parallel consequence of the gene.
    evidence:
    - reference: PMID:34626841
      reference_title: "Defective Lipid Droplet-Lysosome Interaction Causes Fatty Liver Disease as Evidenced by Human Mutations in TMEM199 and CCDC115."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our data suggest that the hypercholesterolemia in TMEM199 and CCDC115
        deficiency is due to increased secretion of apoB-containing particles.
        This may in turn be secondary to the hepatic steatosis observed in these
        patients as well as in the mouse model.
      explanation: >-
        The authors state the proposed direction of the link. Note their own
        hedge -- "may in turn be secondary to" -- which is why the edge is marked
        indirect rather than direct.

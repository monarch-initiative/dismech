- name: Patient iPSC-derived hepatocyte-like cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Hepatocyte-like cells differentiated from the iPSCs of patients carrying
    TMEM199 mutations. Unlike the silenced line, these carry the actual patient
    genotype, which is what makes the apoB result a patient finding rather than a
    knockdown artefact.
  modeled_mechanisms:
  - target: Dysregulated Hepatic Lipoprotein Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient-derived hepatocyte-like cells secrete markedly more apolipoprotein
      B than controls, matching the patients' VLDL-range hyperlipidaemia.
    limitations: >-
      iPSC-derived hepatocyte-like cells are immature relative to adult

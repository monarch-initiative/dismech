biochemical:
- name: Serum potassium concentration
  presence: DECREASED
  subtype: Stable Cesium Salt Poisoning
  notes: >-
    Serum potassium is the central laboratory measurement in chemical cesium
    poisoning, both as a marker of toxicity and as a modifiable contributor to
    arrhythmic risk. Reported concentrations clustered around a median of
    3.05 mmol/L.
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypokalemia was observed in 10 of 12 patients with reported serum potassium levels, with a median concentration of 3.05 mmol/L"
    explanation: Supports decreased serum potassium as the characteristic biochemical abnormality, with a quantified median.
- name: Blood and urine cesium concentration
  presence: INCREASED
  notes: >-
    Direct measurement of cesium in blood or urine confirms exposure and can be
    orders of magnitude above the reference value. No validated universal toxic
    threshold has been established in the sources consulted, so the measurement
    establishes exposure rather than grading severity.
  evidence:
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her plasma cesium level was 2400 microg/dl (normal < 1 microg/dl)"
    explanation: Supports markedly elevated plasma cesium against a stated normal reference value.
  - reference: PMID:26034598
    reference_title: "Cesium-associated hypokalemia successfully treated with amiloride."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum cesium concentration was 28 000 mcg/L (or 0.2 mM; normal value <10 mcg/L), with a urine cesium concentration of 130 000 mcg/L"
    explanation: Supports measurement of both serum and urine cesium against stated reference values in a confirmed case.
environmental:
- name: Oral self-administration of cesium chloride as alternative cancer therapy
  description: >-
    The dominant route to chemical cesium poisoning is deliberate ingestion of
    cesium chloride or cesium carbonate promoted as an alternative cancer
    treatment. The promotion rests on a mid-1980s hypothesis that has never been
    independently verified, and most published cases took cesium for cancer.
  exposure_term:
    preferred_term: exposure to caesium
    term:
      id: ECTO:9000184
      label: exposure to caesium
    qualifiers:
    - predicate:
        preferred_term: has input
        term:
          id: RO:0002233
          label: has input
      value:
        preferred_term: caesium chloride
        term:
          id: CHEBI:63039
          label: caesium chloride
  effect: Establishes a sustained systemic cesium burden through repeated gram-scale ingestion.
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients used cesium as an alternative treatment for cancer"
    explanation: Supports alternative cancer treatment as the predominant reason for the exposure.
  - reference: PMID:23841836
    reference_title: "Fatal cesium chloride toxicity after alternative cancer treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cesium chloride (CsCl) is sold as a treatment for several types of cancers."
    explanation: Supports commercial availability of cesium chloride as a purported cancer treatment, the proximate source of the exposure.
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cesium chloride (CsCl) is a non-radioactive salt wrongly promoted and used as part of an alternative cancer treatment based on questionable research output published in the mid-eighties."
    explanation: Supports that the exposure is driven by promotion resting on questionable research rather than any established indication.
  influences_mechanisms:
  - target: Gastrointestinal absorption of ingested cesium salts
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Repeated oral dosing delivers cesium salt to the small intestine, where it is almost completely absorbed.
    evidence:
    - reference: PMID:41489700
      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When ingested, cesium is almost completely absorbed from the small intestine"
      explanation: Supports the exposure route initiating the absorption step of the mechanism.
- name: Internal contamination from a damaged radioactive cesium source
  description: >-
    Breach of a sealed cesium-137 source, as in the 1987 Goiania radiotherapy
    source accident, disperses soluble radiocesium that is then ingested or
    inhaled. Screening after that accident identified 249 people with
    significant internal or external contamination out of 112,000 examined.
  exposure_term:
    preferred_term: exposure to ionizing radiation
    term:
      id: ECTO:7000047
      label: exposure to ionizing radiation
    qualifiers:
    - predicate:
        preferred_term: has input
        term:
          id: RO:0002233
          label: has input
      value:
        preferred_term: caesium-137 atom
        term:
          id: CHEBI:196959
          label: caesium-137 atom
  effect: Establishes an internal radiocesium body burden that irradiates soft tissue from within.
  evidence:
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "After this accident, 249 cases out of 112,000 people examined for contamination had significant internal or external radioactive contamination"
    explanation: Supports a breached radiotherapy source as a route to significant internal radiocesium contamination, with the scale of the screened population.
  - reference: PMID:8106241
    reference_title: "137Cs internal contamination involving a Brazilian accident, and the efficacy of Prussian Blue treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brazil, 39 individuals had a high level of 137Cs internal contamination"
    explanation: Supports that the accident produced high-level internal contamination in a defined group of individuals.
  influences_mechanisms:
  - target: Internal radiocesium retention and continuing irradiation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Ingested or inhaled soluble radiocesium is absorbed and retained, establishing a decaying internal body burden.
    evidence:
    - reference: PMID:31835766
      reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Absorbed 137Cs is uniformly distributed in soft tissues, resembling the physiological distribution of potassium, with slightly higher levels in muscles and lower levels in bone and fat."
      explanation: Supports the exposure route establishing a retained soft-tissue radiocesium burden.
treatments:
- name: Cessation of cesium exposure
  description: >-
    The first intervention is to stop all cesium intake, which halts further
    absorption and allows the repolarization abnormality to resolve over days.
    Cessation was documented in eight of twenty published cases.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cesium exposure avoidance
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
    qualifiers:
    - predicate:
        preferred_term: has input
        term:
          id: RO:0002233
          label: has input
      value:
        preferred_term: caesium chloride
        term:
          id: CHEBI:63039
          label: caesium chloride
  target_mechanisms:
  - target: Gastrointestinal absorption of ingested cesium salts
    treatment_effect: INHIBITS
    description: Stopping intake prevents further intestinal absorption of cesium.
    evidence:
    - reference: PMID:41489700
      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cesium cessation was reported in eight cases to limit exposure"
      explanation: Supports cessation as an intervention applied specifically to limit continuing exposure and therefore absorption.
  evidence:
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a QT interval prolonged to 650 milliseconds that resolved over 4 days following withdrawal of cesium"
    explanation: Supports clinical benefit of withdrawal, with resolution of the repolarization abnormality over days.
- name: Potassium and magnesium repletion
  description: >-
    Correction of potassium, usually combined with magnesium, is the mainstay of
    reducing arrhythmic risk. Because the underlying defect is ongoing renal
    potassium wasting, requirements can be large and prolonged.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  target_mechanisms:
  - target: Systemic potassium depletion
    treatment_effect: RESTORES
    description: Supplementation replaces the depleted potassium pool and removes hypokalemia as a contributor to repolarization delay.
    evidence:
    - reference: PMID:41489700
      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Potassium supplementation, often combined with magnesium supplementation, was given to correct hypokalemia."
      explanation: Supports supplementation as the intervention directed at correcting the potassium depletion.
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Potassium supplementation, often combined with magnesium supplementation, was given to correct hypokalemia."
    explanation: Supports potassium with magnesium repletion as the documented electrolyte correction strategy in reported cases.
- name: Amiloride for cesium-associated renal potassium wasting
  description: >-
    Amiloride, an epithelial sodium channel blocker, reduced urinary potassium
    excretion and abolished the supplemental potassium requirement in a patient
    with cesium-associated hypokalemia. This rests on a single case report rather
    than established practice, and amiloride was used in only one of the twenty
    published cases.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amiloride
      term:
        id: CHEBI:2639
        label: amiloride
  target_mechanisms:
  - target: Renal potassium wasting
    treatment_effect: INHIBITS
    description: Epithelial sodium channel blockade reduces the electrical driving force for distal nephron potassium secretion.
    evidence:
    - reference: PMID:26034598
      reference_title: "Cesium-associated hypokalemia successfully treated with amiloride."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After 1 week of amiloride treatment, the patient no longer required extra-dietary potassium supplementation, and his urine K+ excretion decreased to 36 mmol/day."
      explanation: Supports a measured reduction in urinary potassium excretion on amiloride, directly addressing the renal wasting mechanism.
  evidence:
  - reference: PMID:26034598
    reference_title: "Cesium-associated hypokalemia successfully treated with amiloride."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report urinary potassium wasting responsive to amiloride therapy in a cancer patient with CAH, and discuss possible mechanisms."
    explanation: Supports amiloride responsiveness of the potassium wasting in a single reported patient.
- name: Prussian blue for internal radioactive cesium contamination
  description: >-
    Insoluble Prussian blue (ferric ferrocyanide, marketed as Radiogardase) binds
    cesium in the gut and interrupts its enterohepatic recirculation, increasing
    fecal elimination. It is the approved antidote for internal radioactive
    cesium contamination, given as 3 g orally every 8 hours for at least 30 days
    in adults. Its use in stable cesium salt poisoning is reported but not
    established, having been given in only three of twenty published chemical
    cases.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prussian blue insoluble
      term:
        id: CHEBI:750441
        label: prussian blue insoluble
  dosing_interval: 3 g orally every 8 hours
  target_mechanisms:
  - target: Internal radiocesium retention and continuing irradiation
    treatment_effect: INHIBITS
    description: Gut binding of cesium and interruption of enterohepatic recirculation shortens the time cesium is retained and therefore the accrued internal dose.
    evidence:
    - reference: PMID:31835766
      reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The drug binds cesium in the intestinal tract, thereby also interrupting the enterohepatic circulation."
      explanation: Supports the mechanism by which Prussian blue reduces cesium retention and hence continuing irradiation.
  evidence:
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If radioactive cesium is a significant pollutant, Prussian blue is the approved antidote for internal detoxification."
    explanation: Supports Prussian blue as the approved antidote for internal radioactive cesium contamination.
  - reference: PMID:8106241
    reference_title: "137Cs internal contamination involving a Brazilian accident, and the efficacy of Prussian Blue treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prussian Blue caused dose reductions in the range of 51-84%, with an average of 71%."
    explanation: Quantifies the committed-dose reduction achieved with Prussian blue in contaminated adults from the Goiania accident.
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The dose in adults is 3 g given orally every 8 h for at least 30 days."
    explanation: Supports the stated adult dosing regimen for the approved antidote.
- name: Continuous cardiac monitoring and antiarrhythmic management
  description: >-
    Patients require continuous electrocardiographic monitoring with serial
    corrected QT assessment, and standard emergency management of malignant
    arrhythmia. Reported cases received lidocaine, cardiopulmonary
    resuscitation, and electrical cardioversion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Cardiac Monitoring
    term:
      id: NCIT:C98935
      label: Cardiac Monitoring
    therapeutic_agent:
    - preferred_term: lidocaine
      term:
        id: CHEBI:6456
        label: lidocaine
  target_mechanisms:
  - target: Triggered ventricular arrhythmia
    treatment_effect: INHIBITS
    description: Antiarrhythmic therapy and electrical cardioversion terminate and suppress the triggered ventricular arrhythmia.
    evidence:
    - reference: PMID:41489700
      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiovascular support commonly involved lidocaine, cardiopulmonary resuscitation (CPR), and electrical cardioversion."
      explanation: Supports the cardiovascular interventions directed at the arrhythmia itself in reported cases.
  evidence:
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lidocaine therapy was started, and the patient was transferred to a cardiac intensive care unit at our hospital."
    explanation: Individual human case supporting lidocaine therapy with intensive cardiac monitoring in cesium-induced arrhythmia.
animal_models:
- name: Cesium-exposed canine and guinea-pig Purkinje fiber preparation
  species: Dog
  publication: PMID:8542076
  description: >-
    Superfused Purkinje strands and ventricular myocardium from dogs and guinea
    pigs, exposed to 3.6 to 4.0 mM cesium with extracellular potassium reduced
    to 2 to 3 mM at slow pacing rates. This is the preparation in which the
    triggered-activity step of the mechanism was measured directly rather than
    inferred.
  modeled_mechanisms:
  - target: Triggered ventricular arrhythmia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the afterdepolarization step under the same two conditions the
      human disease creates, cesium exposure together with low extracellular
      potassium.
    limitations: >-
      An ex vivo fiber preparation at fixed cesium and potassium concentrations
      and slow pacing, so it establishes the cellular mechanism but supplies no
      human tissue threshold and no whole-heart arrhythmia outcome. The clinical
      arrhythmia is an organ-level event that this preparation cannot show.
    readouts:
    - name: Late early afterdepolarization incidence in Purkinje fibers
      target: Triggered ventricular arrhythmia
      direction: INCREASED
      interpretation: Proportion of fibers developing the triggered activity that initiates the arrhythmia.
      evidence:
      - reference: PMID:8542076
        reference_title: "Role of calcium loading in early afterdepolarizations generated by Cs+ in canine and guinea pig Purkinje fibers."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Forty-three percent of Purkinje fibers developed L-EAD after a latent period of 17 to 123 minutes of exposure."
        explanation: Reports the measured incidence and latency of the afterdepolarizations in this preparation.
    evidence:
    - reference: PMID:8542076
      reference_title: "Role of calcium loading in early afterdepolarizations generated by Cs+ in canine and guinea pig Purkinje fibers."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the uptake of 45Ca2+ was approximately doubled after 30 minutes"
      explanation: Supports treating this preparation as informative for the human node, by reporting the calcium loading that drives the triggered activity in it.
  evidence:
  - reference: PMID:8542076
    reference_title: "Role of calcium loading in early afterdepolarizations generated by Cs+ in canine and guinea pig Purkinje fibers."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In Ca(2+)-loaded preparations, delayed afterdepolarizations (DADs) as well as L-EADs developed."
    explanation: Characterizes the model further, showing calcium loading adds delayed afterdepolarizations to the late early afterdepolarizations.
- name: Cesium-exposed sheep cardiac Purkinje fiber voltage-clamp preparation
  species: Sheep
  publication: PMID:988568
  description: >-
    Voltage-clamped sheep cardiac Purkinje fibers exposed to 20 mM cesium, the
    classical preparation establishing cesium as a blocker of cardiac potassium
    currents.
  modeled_mechanisms:
  - target: Cardiac pacemaker HCN channel inhibition
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Demonstrates block of the cardiac pacemaker current by cesium under voltage clamp.
    limitations: >-
      Uses 20 mM cesium, far above any plasma concentration reached in human
      poisoning, and in this preparation the delayed outward rectifier was the
      one current cesium spared. It therefore supports pacemaker-current block
      but not the delayed rectifier attribution the clinical literature makes.
    evidence:
    - reference: PMID:988568
      reference_title: "Cardiac Purkinje fibers: cesium as a tool to block inward rectifying potassium currents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "exposure to Cs blocks both the pacemaker current iK2 and the instantaneous outward current iK1"
      explanation: Supports treating this preparation as informative for pacemaker-current inhibition specifically.
  evidence:
  - reference: PMID:988568
    reference_title: "Cardiac Purkinje fibers: cesium as a tool to block inward rectifying potassium currents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When a cardiac Purkinje fiber is exposed to 20 mM Cs the membrane potential falls to about -60 mV within 1 min."
    explanation: Characterizes the preparation's response, and records the supraphysiological concentration that limits its translational reach.
diagnosis:
- name: Serial electrocardiography with corrected QT measurement
  description: >-
    The diagnostic pivot in the chemical form is the electrocardiogram.
    Comparison against a prior baseline is what establishes the abnormality as
    acquired, and serial measurement tracks resolution after withdrawal.
    Reported corrected QT intervals ran to a median of 620 ms.
  diagnosis_term:
    preferred_term: serial electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An electrocardiogram revealed occasional premature ventricular contractions, a QTc interval of 683 msec"
    explanation: Supports electrocardiography as the test that identifies the abnormality, with an individual measured value.
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "conclude that cesium toxicity should be considered among the differential diagnoses of prolonged QT interval"
    explanation: Supports the diagnostic inference running the other way, from a prolonged QT interval to considering cesium toxicity as its cause.
- name: Serum potassium and magnesium measurement
  description: >-
    Potassium is measured repeatedly, both because hypokalemia is a defining
    feature and because it is the modifiable contributor to arrhythmic risk.
    Magnesium is measured alongside it since the two are corrected together.
  diagnosis_term:
    preferred_term: serum electrolyte measurement
    term:
      id: NCIT:C74946
      label: Electrolyte Measurement
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypokalemia was observed in 10 of 12 patients with reported serum potassium levels, with a median concentration of 3.05 mmol/L"
    explanation: Supports serum potassium measurement as the test that identifies the characteristic abnormality, with its distribution in reported patients.
  - reference: PMID:26034598
    reference_title: "Cesium-associated hypokalemia successfully treated with amiloride."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum levels of cortisol, renin and aldosterone were normal."
    explanation: >-
      Supports the endocrine work-up measured alongside the electrolytes to
      exclude the alternative causes of hypokalemia, which in this case
      established cesium as the cause by elimination.
- name: Blood and urine cesium quantification
  description: >-
    A specialist laboratory quantifies cesium in blood and urine by elemental
    analysis. The measurement confirms exposure against a stated reference value
    and can be orders of magnitude above it, but no validated universal toxic
    threshold was established in the sources consulted, so it does not grade
    severity.
  diagnosis_term:
    preferred_term: blood and urine cesium quantification
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  evidence:
  - reference: PMID:26034598
    reference_title: "Cesium-associated hypokalemia successfully treated with amiloride."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum cesium concentration was 28 000 mcg/L (or 0.2 mM; normal value <10 mcg/L), with a urine cesium concentration of 130 000 mcg/L"
    explanation: Supports paired blood and urine cesium measurement against stated reference values.
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her plasma cesium level was 2400 microg/dl (normal < 1 microg/dl)"
    explanation: Second independent human measurement of plasma cesium against a stated normal value.
- name: Whole-body counting and urine and fecal bioassay
  description: >-
    The radiological arm is assessed differently: internal contamination is
    verified by whole-body counting together with analysis of urine and fecal
    samples, which is also how retained activity and the effect of decorporation
    are followed. Serial blood counts and clinical chemistry run alongside,
    since marrow is the organ at risk. This route applies to the internal
    radioactive cesium contamination subtype; the Diagnosis class has no
    subtype slot, so the scoping is stated here.
  diagnosis_term:
    preferred_term: whole-body counting and urine and fecal bioassay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Internal contamination was verified by the analysis of urine and fecal samples and in a whole-body counter."
    explanation: Directly supports the assessment route used to verify internal radiocesium contamination after a source accident.
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adequate clinical chemistry monitoring, including measurements of blood cell counts, is routinely done."
    explanation: Supports serial blood counts and clinical chemistry as routine monitoring in the radiological arm, where marrow is the organ at risk.
differential_diagnoses:
- name: Thallium Poisoning
  distinguishing_features:
  - Both are treated with Prussian blue, so the antidote does not distinguish them
  - Thallium poisoning is dominated by painful ascending sensory neuropathy and delayed alopecia
  - Cesium poisoning is dominated by repolarization abnormality, hypokalemia, and ventricular arrhythmia without alopecia
  evidence:
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prussian blue insoluble capsules (Radiogardase, Heyl Co, Germany) are approved by the FDA for the treatment of internal contamination with radioactive cesium or thallium."
    explanation: Supports that the same antidote is approved for both metals, which is why the treatment cannot be used to discriminate between them.
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently observed abnormality was QT-interval prolongation, described in 14 cases."
    explanation: Supports the cardiac-dominant presentation of cesium poisoning, in contrast to the neurocutaneous dominance of thallium poisoning.
- name: Congenital Long QT Syndrome
  distinguishing_features:
  - Cesium poisoning produces a markedly prolonged corrected QT that shortens within days of stopping the exposure
  - An elevated blood or urine cesium concentration is present in cesium poisoning and absent in the inherited syndrome
  - Hypokalemia with inappropriate urinary potassium wasting accompanies the acquired form
  evidence:
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a QT interval prolonged to 650 milliseconds that resolved over 4 days following withdrawal of cesium"
    explanation: Supports reversibility on withdrawal of the exposure, which is the feature that separates the acquired form from an inherited channelopathy.
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "conclude that cesium toxicity should be considered among the differential diagnoses of prolonged QT interval"
    explanation: The cited authors explicitly place cesium toxicity in the differential diagnosis of a prolonged QT interval.
notes: >-
  Frequency bands are deliberately omitted from the phenotypes in this entry. The
  only systematic human series is a review of 20 published case reports, and that
  review's own scope statement warns that its case-report percentages are not
  population frequencies: the denominators reflect what individual authors chose
  to report rather than systematic screening of everyone exposed. A FrequencyEnum
  band derived from those fractions would assert a population frequency the
  source explicitly disclaims.

  The two subtypes should not have their statistics pooled. Case fatality in the
  chemical series (5 of 20) and mortality after the Goiania source accident are
  measurements on different populations with different mechanisms of harm, and
  the accident deaths cannot be attributed to internal cesium alone because
  external irradiation co-occurred in the same patients.

  No causal gene, susceptibility locus, or validated genetic modifier is
  established for cesium poisoning, so the entry carries no genetic section. A
  2024 study associated a KCNE1 variant with drug-induced long QT from other
  QT-prolonging medications, but it did not test cesium exposure and must not be
  recorded here as a cesium susceptibility gene.

  Diarrhea is left causally unconnected on purpose. It is well documented as a
  manifestation, and the sources use it to explain part of the potassium
  depletion, but none of them states a mechanism by which cesium produces the
  diarrhea itself. An edge drawn from the absorption or distribution node would
  be invented rather than sourced.

    explanation: Independent support for paresthesias as a frequently reported manifestation across the case series rather than a single-case finding.
- name: Diarrhea
  category: Gastrointestinal
  subtype: Stable Cesium Salt Poisoning
  description: >-
    Diarrhea is frequently observed and is itself a contributor to potassium
    depletion through increased gastrointestinal losses.
  phenotype_term:
    preferred_term: Diarrhea

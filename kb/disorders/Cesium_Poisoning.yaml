synonyms:
- cesium intoxication
- caesium poisoning
- cesium chloride toxicity
- cesium salt poisoning
description: >-
  Cesium poisoning is an acquired toxic disorder caused by exposure to the alkali
  metal cesium. Two clinically distinct forms share the identifier. Chemical
  poisoning with non-radioactive cesium salts, most often cesium chloride taken
  as an unproven alternative cancer therapy, is dominated by cardiac toxicity:
  absorbed cesium mimics potassium, blocks cardiac and renal potassium channels,
  and produces hypokalemia with prolonged ventricular repolarization that can
  degenerate into torsade de pointes and cardiac arrest. Internal contamination
  with radioactive cesium, principally cesium-137 released from damaged medical
  or industrial sources, instead delivers continuing internal irradiation and, at
  sufficient absorbed dose, hematopoietic injury. The two forms differ in
  mechanism, assessment, and treatment, and their clinical statistics should not
  be pooled.

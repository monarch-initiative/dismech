  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, potassium depletion may occur through increased gastrointestinal losses as associated with the frequently observed diarrhea"
    explanation: Directly supports diarrhea as a frequently observed manifestation, and connects it to the potassium depletion mechanism.
- name: Decreased total neutrophil count
  category: Hematologic
  subtype: Internal Radioactive Cesium Contamination
  description: >-
    Neutropenia follows radiation injury to the marrow in severe internal
    cesium-137 contamination, and predisposes to the infections that are a
    leading cause of death.
  phenotype_term:

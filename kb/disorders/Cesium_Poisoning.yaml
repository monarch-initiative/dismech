      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Potassium inward rectifier channels of the KCNJ gene family are also targeted by cesium resulting in channel inhibition in the micromolar range"
      explanation: Supports a second downstream branch in which distributed cesium inhibits inward rectifier potassium channels.
  - target: Cardiac pacemaker HCN channel inhibition
    causal_link_type: DIRECT
    description: Distributed cesium additionally inhibits hyperpolarization-activated pacemaker channels.

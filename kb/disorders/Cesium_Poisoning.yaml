- name: Triggered ventricular arrhythmia
  description: >-
    Against a background of prolonged repolarization and hypokalemia, triggered
    activity initiates polymorphic ventricular tachycardia, characteristically
    torsade de pointes, which may degenerate into cardiac arrest. The triggered
    activity itself has been measured directly: in superfused canine and
    guinea-pig Purkinje fibers, cesium at 3.6 to 4.0 mM with extracellular
    potassium reduced to 2 to 3 mM produced late early afterdepolarizations in
    43% of fibers, and calcium loading accelerated their appearance. Cesium
    salts have been used deliberately for decades to induce exactly this
    arrhythmia in animal models of the long QT syndrome.
  biological_scale: TISSUE

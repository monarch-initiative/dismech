      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "its inhibition results in, for example, unstable plasma-membrane potential in neural and cardiac cells"
      explanation: Supports a fourth downstream branch in which inward rectifier inhibition destabilizes neuronal membrane potential.
- name: Myocardial delayed rectifier potassium channel blockade
  description: >-
    Cesium blocks the potassium channels that carry the repolarizing current of
    the ventricular action potential. Classical voltage-clamp work in cardiac
    Purkinje fibers established cesium as a blocker of cardiac potassium
    currents, and the clinical literature attributes the observed repolarization
    delay to delayed rectifier inhibition.
  biological_scale: MOLECULAR
  locations:
  - preferred_term: cardiac ventricle
    term:
      id: UBERON:0002082
      label: cardiac ventricle
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: delayed rectifier potassium channel activity
    modifier: DECREASED
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
  evidence:

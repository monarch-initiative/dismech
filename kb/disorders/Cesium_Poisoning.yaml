      snippet: "It inhibits delayed rectifier potassium channels in the myocardium, causing delayed repolarization and QT-interval prolongation."
      explanation: Supports the step from systemic cesium to inhibition of myocardial delayed rectifier channels.
  - target: Renal inward rectifier potassium channel blockade
    causal_link_type: DIRECT
    description: Distributed cesium also reaches the inward rectifier potassium channels of the distal nephron.
    evidence:

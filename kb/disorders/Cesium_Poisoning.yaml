    - reference: PMID:41489700
      reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Finally, pacemaker channels of the HCN family become also inhibited by cesium in the low millimolar range"
      explanation: Supports a third downstream branch in which cesium inhibits HCN pacemaker channels.
  - target: Neuronal membrane potential instability
    causal_link_type: DIRECT
    description: >-
      The same inward rectifier potassium channel family that cesium inhibits in
      the kidney and heart also operates in neural tissue, where its inhibition
      destabilizes the resting membrane potential.

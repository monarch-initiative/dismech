- name: Systemic distribution of cesium as a potassium analog
  description: >-
    Absorbed cesium distributes through soft tissue in a pattern resembling
    potassium, with relatively higher concentrations in muscle. Because the
    cesium cation is chemically similar to potassium but not identical to it,
    this distribution places a poorly discriminated competitor at potassium
    channels throughout the body.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: potassium ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0055075
      label: potassium ion homeostasis
  chemical_entities:

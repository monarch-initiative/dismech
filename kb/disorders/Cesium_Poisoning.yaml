definitions:
- name: Clinical toxic exposure syndrome definition for cesium poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Cesium poisoning is an exposure-defined toxic disorder. In its chemical form
    it is a cardiac-dominant syndrome of hypokalemia, prolonged ventricular
    repolarization, and ventricular arrhythmia following ingestion or injection
    of cesium salts; in its radiological form it is internal contamination with
    radioactive cesium causing continuing internal irradiation.
  scope: Disease-level clinical framing spanning the chemical and radiological exposure routes
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following absorption, cesium is distributed throughout the body, where it inhibits ion channels, mainly for potassium."
    explanation: Supports defining the chemical syndrome around systemic distribution and potassium-channel inhibition rather than a single organ lesion.
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Internal contamination with radioactive material can expose patients to prolonged radiation, thus leading to short- and long-term clinical consequences."
    explanation: Supports treating internal radioactive cesium contamination as a distinct exposure form whose harm is delivered radiation dose rather than ion-channel blockade.
- name: Practical diagnostic definition for suspected chemical cesium poisoning
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Practical recognition rests on an exposure history for a cesium-containing
    product together with a prolonged QT interval and hypokalemia, confirmed
    where available by an elevated blood or urine cesium concentration.
  scope: Clinical recognition and laboratory confirmation in suspected chemical cesium poisoning
  evidence:
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors describe a case of cesium toxicity manifested by syncope, polymorphic ventricular tachycardia, hypokalemia, and a QT interval prolonged to 650 milliseconds that resolved over 4 days following withdrawal of cesium."
    explanation: Supports the diagnostic triad of syncope or arrhythmia, hypokalemia, and QT prolongation that reverses on withdrawal of cesium.
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her plasma cesium level was 2400 microg/dl (normal < 1 microg/dl)"
    explanation: Supports laboratory confirmation by direct measurement of a markedly elevated plasma cesium concentration against a normal reference value.

has_subtypes:
- name: Stable Cesium Salt Poisoning
  display_name: Stable (non-radioactive) cesium salt poisoning
  description: >-
    Chemical poisoning following ingestion or injection of non-radioactive cesium
    chloride or cesium carbonate, most often self-administered as an unproven
    alternative cancer treatment. The clinical picture is cardiac-dominant, with
    hypokalemia, QT prolongation, and ventricular arrhythmia.
  evidence:
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients used cesium as an alternative treatment for cancer"
    explanation: Supports self-administration as an alternative cancer therapy as the dominant route to stable cesium salt poisoning.
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients were reported to have died because of the cesium intake."
    explanation: Supports that the chemical form of the disease was lethal in a quarter of the published cases.
- name: Internal Radioactive Cesium Contamination
  display_name: Internal radioactive cesium (cesium-137) contamination
  description: >-
    Internal contamination with radioactive cesium, principally cesium-137
    released from a damaged medical or industrial source or a reactor accident.
    Harm is delivered as continuing internal beta and gamma irradiation; at
    sufficient absorbed dose this produces hematopoietic injury, frequently
    alongside external irradiation that must be assessed separately.
  evidence:
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "After this accident, 249 cases out of 112,000 people examined for contamination had significant internal or external radioactive contamination"
    explanation: Supports internal radioactive cesium contamination as a distinct clinical entity arising from a point-source release.
  - reference: PMID:31835766
    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The 137Cs isotope has physical half-life of about 30 years"
    explanation: Supports the long physical persistence of the contaminating isotope that distinguishes this form from stable cesium salt exposure.
progression:
- phase: Latent accumulation during continued cesium intake
  notes: >-
    Chemical poisoning typically develops over days to weeks of repeated
    self-administration rather than after a single dose, and the long biological
    half-life means cesium accumulates while intake continues.
  evidence:
  - reference: PMID:23489152
    reference_title: "Torsades de pointes - a report of a case induced by caesium taken as a complementary medicine, and the literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upon admission her QTc was 620 ms. The patient had taken caesium carbonate 10 g daily for 1 month prior to admission."
    explanation: Supports an accumulation phase of sustained daily intake preceding the presenting arrhythmic event.
  - reference: PMID:41489700
    reference_title: "Intoxication by Self-administered Cesium Salts, the Clinical Impact of Questionable Research Output."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cesium is mainly excreted via the kidneys and has a half-life of approximately 2 to 4 months"
    explanation: Supports a long biological half-life permitting progressive accumulation during continued intake.
- phase: Abrupt arrhythmic presentation
  notes: >-
    Presentation is often sudden, with syncope, a malignant ventricular
    arrhythmia, or cardiac arrest as the first recognized event despite weeks of
    preceding exposure.
  evidence:
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient went to a local emergency department after experiencing two brief syncopal episodes"
    explanation: Supports an abrupt symptomatic presentation with syncope after a period of asymptomatic exposure.
  - reference: PMID:23489152
    reference_title: "Torsades de pointes - a report of a case induced by caesium taken as a complementary medicine, and the literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 46-year-old woman with syncope experienced torsades de pointes and cardiac arrest."
    explanation: Supports cardiac arrest as a presenting rather than late event in the chemical form.
- phase: Prolonged recovery after cesium withdrawal
  notes: >-
    Repolarization abnormality resolves after exposure stops, but the long
    half-life and large volume of distribution mean electrolyte and rhythm
    surveillance must continue well beyond the acute event.
  evidence:
  - reference: PMID:12548155
    reference_title: "Cesium toxicity: a case of self-treatment by alternate therapy gone awry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a QT interval prolonged to 650 milliseconds that resolved over 4 days following withdrawal of cesium"
    explanation: Supports resolution of the repolarization abnormality over days once cesium is withdrawn.
  - reference: PMID:18657021
    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two months later, at a follow-up visit, her serum cesium level was 1800 microg/dl, and her QTc interval was 494 msec."
    explanation: Supports persistently elevated cesium and incompletely normalized QTc two months after exposure ceased, justifying prolonged surveillance.
pathophysiology:
- name: Gastrointestinal absorption of ingested cesium salts
  description: >-
    Ingested cesium salts are almost completely absorbed from the small intestine,
    so an oral dose is delivered systemically with little first-pass limitation.
    The same potassium-like handling that drives absorption also governs
    subsequent distal nephron secretion.

    reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It inhibits delayed rectifier potassium channels in the myocardium, causing delayed repolarization and QT-interval prolongation."
    explanation: Directly supports myocardial delayed rectifier blockade as the proximate molecular lesion behind repolarization delay.
  - reference: PMID:988568
    reference_title: "Cardiac Purkinje fibers: cesium as a tool to block inward rectifying potassium currents."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "exposure to Cs blocks both the pacemaker current iK2 and the instantaneous outward current iK1, while the delayed outward rectifying potassium current ix is not affected"
    explanation: >-
      Voltage-clamp evidence that cesium blocks cardiac potassium currents.
      Graded INDIRECT because in this sheep Purkinje preparation the currents
      blocked were the pacemaker and inward rectifier currents while the delayed
      outward rectifier was spared, so it establishes cesium as a cardiac
      potassium-channel blocker without confirming the specific delayed
      rectifier attribution made in the clinical literature.
  notes: >-
    The clinical literature consistently attributes cesium-induced QT
    prolongation to delayed rectifier blockade, while the classical
    voltage-clamp study reports the delayed outward rectifier as the one current
    cesium spared in sheep Purkinje fibers. Both statements are quoted here
    rather than reconciled, because the apparent conflict may reflect
    preparation, species, and concentration differences rather than an error in
    either source.
  downstream:
  - target: Prolonged ventricular repolarization
    causal_link_type: DIRECT
    description: Loss of repolarizing potassium current lengthens the ventricular action potential.
    evidence:
    - reference: PMID:18657021
      reference_title: "Cesium-induced QT-interval prolongation in an adolescent."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It inhibits delayed rectifier potassium channels in the myocardium, causing delayed repolarization and QT-interval prolongation."
      explanation: The quoted sentence states the causal step from channel inhibition to delayed repolarization.
- name: Renal inward rectifier potassium channel blockade
  description: >-
    Cesium inhibits inward rectifier potassium channels of the KCNJ family in the
    distal nephron, including ROMK (Kir1.1) and Kir4.1. Blockade is asymmetric:
    extracellular cesium blocks potassium entry through ROMK while enhancing
    potassium exit through it, which is how a channel blocker produces net
    potassium loss rather than retention.

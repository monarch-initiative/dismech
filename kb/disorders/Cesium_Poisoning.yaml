    reference_title: "Medical Therapy of Patients Contaminated with Radioactive Cesium or Iodine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first report described 14 patients who developed severe bone marrow depression with neutropenia and thrombocytopenia."
    explanation: Directly supports neutropenia in severely contaminated patients following a cesium-137 source accident.
- name: Thrombocytopenia
  category: Hematologic

- species: Mus musculus
  genotype: Notch2 HCS knock-in (fracture-healing model)
  description: >-
    In an HCS mouse fracture-healing model with high-turnover osteopenia, structural
    indices of bone regeneration were near-normal, but the callus showed increased
    osteoclast parameters and osteoclast/osteoblast marker expression, and healed
    femora had inferior biomechanical stability.
  evidence:
  - reference: PMID:37452111
    reference_title: "Fracture healing in a mouse model of Hajdu-Cheney-Syndrome with high turnover osteopenia results in decreased biomechanical stability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our data demonstrate that structural indices of bone regeneration are
      normal in HCS mice, which, however, exhibit signs of increased callus turnover
      and display impaired biomechanical stability of healed fractures.
    explanation: >-
      This supports impaired biomechanical stability of healed fractures despite
      near-normal structural healing in the HCS mouse model.
  - reference: PMID:37452111
    reference_title: "Fracture healing in a mouse model of Hajdu-Cheney-Syndrome with high turnover osteopenia results in decreased biomechanical stability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histomorphometry showed increased osteoclast parameters in the callus of HCS
      mice, which was accompanied by an increased expression of osteoclast and
      osteoblast markers.
    explanation: >-
      This documents increased osteoclast activity in fracture callus, consistent
      with the high-turnover mechanism.
datasets: []
references:
- reference: PMID:21378985
  title: "Mutations in NOTCH2 cause Hajdu-Cheney syndrome, a disorder of severe and progressive bone loss."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: An allelic series of NOTCH2 truncating mutations causes HCS by removing the C-terminal PEST proteolytic-recognition sequence, increasing Notch signaling.
    supporting_text: >-
      The Hajdu-Cheney syndrome mutations are predicted to lead to the premature
      truncation of NOTCH2 with either disruption or loss of the C-terminal
      proline-glutamate-serine-threonine-rich proteolytic recognition sequence, the
      absence of which has previously been shown to increase Notch signaling.
- reference: PMID:21378989
  title: Truncating mutations in the last exon of NOTCH2 cause a rare skeletal disorder with osteoporosis.
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: Heterozygous NOTCH2 truncating mutations cluster in the last coding exon, escape nonsense-mediated decay, and act in a gain-of-function manner.
    supporting_text: >-
      All mutations cluster to the last coding exon of the gene, suggesting that the
      mutant mRNA products escape nonsense-mediated decay and that the resulting
      truncated NOTCH2 proteins act in a gain-of-function manner.
- reference: PMID:25491639
  title: "Hajdu-Cheney syndrome: a review."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: HCS is an autosomal dominant disorder caused by exon 34 NOTCH2 mutations producing a truncated stable protein with enhanced signaling; antiresorptive/anabolic benefit is unproven.
    supporting_text: >-
      HCS is associated with mutations in exon 34 of NOTCH2 upstream the PEST domain
      that lead to the creation of a truncated and stable NOTCH2 protein with
      enhanced NOTCH2 signaling activity.
- reference: PMID:26627824
  title: "Hajdu Cheney Mouse Mutants Exhibit Osteopenia, Increased Osteoclastogenesis, and Bone Resorption."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: A Notch2(Q2319X) knock-in mouse recapitulates HCS bone disease with osteopenia, enhanced osteoclastogenesis, and increased RANKL-dependent bone resorption.
    supporting_text: >-
      In conclusion, Notch2(Q2319X) mice exhibit cancellous and cortical bone
      osteopenia, enhanced osteoclastogenesis, and increased bone resorption.
- reference: PMID:32854429
  title: "Hajdu-Cheney Syndrome: A Systematic Review of the Literature."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: HCS causes acroosteolysis and generalized osteoporosis, is autosomal dominant with sporadic cases, is associated with NOTCH2, and has no curative treatment.
    supporting_text: >-
      Hajdu-Cheney syndrome (HCS) is a rare genetic disease that causes acroosteolysis
      and generalized osteoporosis, accompanied by a series of developmental skeletal
      disorders and multiple clinical and radiological manifestations.
- reference: PMID:36079132
  title: "Hajdu-Cheney Syndrome: A Novel NOTCH2 Mutation in a Spanish Child in Treatment with Vibrotherapy: A Case Report."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: A genetically confirmed HCS case shows distal-phalangeal acroosteolysis of feet and hands and is treated with bisphosphonates and focal vibration therapy.
    supporting_text: >-
      Treatment is with bisphosphonates in the framework of bone density improvement
      and with focal vibration therapy for rehabilitation of the musculoskeletal
      system and gait improvement.
- reference: PMID:37452111
  title: "Fracture healing in a mouse model of Hajdu-Cheney-Syndrome with high turnover osteopenia results in decreased biomechanical stability."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: In HCS mice, fracture structural healing is near-normal but callus turnover is increased and healed-bone biomechanical stability is impaired.
    supporting_text: >-
      Together, our data demonstrate that structural indices of bone regeneration are
      normal in HCS mice, which, however, exhibit signs of increased callus turnover
      and display impaired biomechanical stability of healed fractures.
- reference: PMID:34501688
  title: "Oral Surgery Procedures in a Patient with Hajdu-Cheney Syndrome Treated with Denosumab-A Rare Case Report."
  found_in:
  - Hajdu-Cheney_Syndrome-deep-research-falcon.md
  findings:
  - statement: Denosumab (anti-RANKL) is used off-label in HCS but carries MRONJ and delayed oral-healing risk relevant to dental surgery planning.
    supporting_text: >-
      In patients receiving denosumab, a delayed wound healing in the oral cavity and
      osteonecrosis may occur.

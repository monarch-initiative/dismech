name: Hajdu-Cheney Syndrome
creation_date: '2026-07-24T12:00:00Z'
updated_date: '2026-07-24T12:00:00Z'
category: Mendelian
synonyms:
- acroosteolysis dominant type
- acro-osteolysis with osteoporosis and changes in skull and mandible
- Cheney syndrome
- arthrodentoosteodysplasia
description: >-
  Hajdu-Cheney syndrome is a rare autosomal dominant skeletal dysplasia caused by
  heterozygous truncating mutations in the terminal exon of NOTCH2. These
  mutations escape nonsense-mediated decay and generate a stabilized, gain-of-function
  NOTCH2 protein that enhances NOTCH signaling and osteoclast-mediated bone
  resorption. The disorder is characterized by progressive acro-osteolysis of the
  distal phalanges, severe generalized osteoporosis with fractures, wormian bones,
  platybasia with basilar invagination, distinctive coarse craniofacial features,
  premature tooth loss, short stature, and joint laxity.

- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Hajdu-Cheney syndrome is inherited in an autosomal dominant manner, although a
    substantial proportion of cases arise from de novo NOTCH2 mutations.
  evidence:

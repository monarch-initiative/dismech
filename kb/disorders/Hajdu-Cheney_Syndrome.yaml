genetic:
- name: NOTCH2
  association: Gain-of-function terminal-exon truncating mutation
  gene_term:
    preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  notes: >-
    Heterozygous nonsense/frameshift mutations in the last coding exon (exon 34) of
    NOTCH2, upstream of the PEST domain, cause HCS by producing a stabilized,
    gain-of-function NOTCH2 protein.
  evidence:
  - reference: PMID:21378985
    reference_title: Mutations in NOTCH2 cause Hajdu-Cheney syndrome, a disorder of severe and progressive bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used an exome-sequencing strategy and identified an allelic series of NOTCH2
      mutations in Hajdu-Cheney syndrome, an autosomal dominant multisystem disorder
      characterized by severe and progressive bone loss.
    explanation: >-
      This identifies NOTCH2 as the causative gene in an allelic series for HCS.
  - reference: PMID:21378989
    reference_title: Truncating mutations in the last exon of NOTCH2 cause a rare skeletal disorder with osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the exomes of six unrelated individuals with this syndrome and
      identified heterozygous nonsense and frameshift mutations in NOTCH2 in five of
      them.
    explanation: >-
      An independent exome study confirms heterozygous NOTCH2 truncating mutations as
      the cause of HCS.
treatments:
- name: Bisphosphonate antiresorptive therapy
  description: >-
    Bisphosphonates are the most commonly reported antiresorptive treatment for the
    osteoporosis of HCS, aimed at improving bone density; however, controlled benefit
    at the syndrome level has not been established.
  treatment_term:
    preferred_term: bisphosphonate agent therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  target_phenotypes:
  - preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  evidence:
  - reference: PMID:36079132
    reference_title: "Hajdu-Cheney Syndrome: A Novel NOTCH2 Mutation in a Spanish Child in Treatment with Vibrotherapy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is with bisphosphonates in the framework of bone density improvement
      and with focal vibration therapy for rehabilitation of the musculoskeletal
      system and gait improvement.
    explanation: >-
      This documents bisphosphonate use for bone-density improvement in a
      genetically confirmed HCS patient.
  - reference: PMID:25491639
    reference_title: "Hajdu-Cheney syndrome: a review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone antiresorptive and anabolic agents have been tried to treat the
      osteoporosis, but their benefit has not been established.
    explanation: >-
      The review notes antiresorptive/anabolic agents are used but with unproven
      benefit, tempering the strength of this recommendation.
- name: Denosumab (off-label RANKL inhibitor) with MRONJ precautions
  description: >-
    Denosumab, a monoclonal antibody against RANKL that suppresses osteoclast
    activity, has been used off-label. It carries a risk of delayed oral wound
    healing and medication-related osteonecrosis of the jaw (MRONJ), so invasive
    dental procedures require careful planning.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34501688
    reference_title: "Oral Surgery Procedures in a Patient with Hajdu-Cheney Syndrome Treated with Denosumab-A Rare Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Denosumab is a monoclonal antibody against RANKL.
    explanation: >-
      This identifies denosumab's mechanism as an anti-RANKL monoclonal antibody used
      in an HCS patient.

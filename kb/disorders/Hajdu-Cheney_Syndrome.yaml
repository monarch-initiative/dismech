pathophysiology:
- name: NOTCH2 terminal-exon truncation escapes nonsense-mediated decay
  description: >-
    Heterozygous nonsense and frameshift mutations cluster in the last coding exon
    (exon 34) of NOTCH2. Because they lie in the terminal exon, the mutant mRNAs
    escape nonsense-mediated decay and encode a truncated NOTCH2 protein that has
    lost the C-terminal PEST proteolytic-recognition (degradation) sequence.
  genes:
  - preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:21378989
    reference_title: Truncating mutations in the last exon of NOTCH2 cause a rare skeletal disorder with osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations cluster to the last coding exon of the gene, suggesting that the
      mutant mRNA products escape nonsense-mediated decay and that the resulting
      truncated NOTCH2 proteins act in a gain-of-function manner.
    explanation: >-
      This directly supports terminal-exon clustering, escape from
      nonsense-mediated decay, and a gain-of-function mechanism.
  - reference: PMID:21378985
    reference_title: Mutations in NOTCH2 cause Hajdu-Cheney syndrome, a disorder of severe and progressive bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Hajdu-Cheney syndrome mutations are predicted to lead to the premature
      truncation of NOTCH2 with either disruption or loss of the C-terminal
      proline-glutamate-serine-threonine-rich proteolytic recognition sequence, the
      absence of which has previously been shown to increase Notch signaling.
    explanation: >-
      This establishes loss of the C-terminal PEST proteolytic-recognition sequence
      as the molecular lesion that increases Notch signaling.
  downstream:
  - target: Enhanced NOTCH2 signaling with increased osteoclastogenesis
    description: The stabilized truncated NOTCH2 protein produces enhanced NOTCH2 signaling activity.
    causal_link_type: DIRECT
- name: Enhanced NOTCH2 signaling with increased osteoclastogenesis
  description: >-
    The truncated, stable NOTCH2 protein has enhanced signaling activity that shifts
    bone remodeling toward high-turnover bone loss, increasing osteoclastogenesis
    and bone resorption without a compensatory decrease in osteoblast number or bone
    formation.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  evidence:
  - reference: PMID:25491639
    reference_title: "Hajdu-Cheney syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCS is associated with mutations in exon 34 of NOTCH2 upstream the PEST domain
      that lead to the creation of a truncated and stable NOTCH2 protein with
      enhanced NOTCH2 signaling activity.
    explanation: >-
      This links the exon 34 / PEST-domain lesion to a stable NOTCH2 protein with
      enhanced signaling activity.
  - reference: PMID:26627824
    reference_title: "Hajdu Cheney Mouse Mutants Exhibit Osteopenia, Increased Osteoclastogenesis, and Bone Resorption."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, Notch2(Q2319X) mice exhibit cancellous and cortical bone
      osteopenia, enhanced osteoclastogenesis, and increased bone resorption.
    explanation: >-
      A knock-in mouse reproducing an HCS NOTCH2 truncation shows osteopenia with
      enhanced osteoclastogenesis and increased bone resorption.
  downstream:
  - target: Acroosteolysis
    description: High-turnover resorption of the terminal phalanges produces acro-osteolysis.
    causal_link_type: DIRECT
  - target: Osteoporosis
    description: Generalized excess osteoclastic resorption produces severe osteoporosis.
    causal_link_type: DIRECT
- name: High-turnover osteoclastic bone resorption
  description: >-
    Histomorphometry in the HCS mouse model shows an increased number of osteoclasts
    and increased bone resorption, without a decrease in osteoblast number or bone
    formation, and the enhanced osteoclastogenesis is RANKL-dependent and
    Notch-dependent (suppressed by a gamma-secretase inhibitor).
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:26627824
    reference_title: "Hajdu Cheney Mouse Mutants Exhibit Osteopenia, Increased Osteoclastogenesis, and Bone Resorption."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cancellous bone histomorphometry revealed an increased number of osteoclasts
      and bone resorption, without a decrease in osteoblast number or bone
      formation.
    explanation: >-
      This defines the high-turnover, resorption-dominant mechanism with preserved
      osteoblast number/formation.
  - reference: PMID:26627824
    reference_title: "Hajdu Cheney Mouse Mutants Exhibit Osteopenia, Increased Osteoclastogenesis, and Bone Resorption."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The pre-osteoclast cell pool, osteoclast differentiation, and bone resorption
      in response to receptor activator of nuclear factor κB ligand in vitro were
      increased in Notch2(Q2319X) mutants.
    explanation: >-
      This supports RANKL-dependent enhancement of osteoclast differentiation and
      resorption downstream of mutant NOTCH2.
phenotypes:
- name: Acroosteolysis of distal phalanges
  category: Skeletal
  frequency: VERY_FREQUENT
  description: >-
    Progressive acro-osteolysis (resorption) of the distal phalanges of the hands
    and feet is a cardinal, defining feature.
  phenotype_term:
    preferred_term: Acroosteolysis of distal phalanges (feet)
    term:
      id: HP:0001870
      label: Acroosteolysis of distal phalanges (feet)
  evidence:
  - reference: PMID:36079132
    reference_title: "Hajdu-Cheney Syndrome: A Novel NOTCH2 Mutation in a Spanish Child in Treatment with Vibrotherapy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A case report of an 11-year-old boy with a de novo variant in NOTCH2 and
      clinical features characteristic of Hajdu-Cheney syndrome is reported, with
      acroosteolysis of the distal phalanges of the feet and hands, generalized
      osteoporosis, musculoskeletal and craniofacial alterations, short stature,
      bowing of long bones, vertebral anomalies, genu recurvatum, hypertrichosis,
      joint and skin hyperlaxity, atopic dermatitis, megalocorneas, micrognathia and
      frequent respiratory infections, among others.
    explanation: >-
      This documents acroosteolysis of the distal phalanges of the feet and hands as
      a characteristic feature.

pathophysiology:
- name: NOTCH2 terminal-exon truncating mutation stabilizes NOTCH2
  description: >-
    Truncating mutations in the last coding exon (exon 34) of NOTCH2 escape
    nonsense-mediated mRNA decay and delete the C-terminal PEST domain, producing a
    stabilized NOTCH2 intracellular domain and gain of NOTCH2 signaling.
  genes:
  - preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  evidence:
  - reference: PMID:21378989
    reference_title: Truncating mutations in the last exon of NOTCH2 cause a rare skeletal disorder with osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations are located in the last exon of NOTCH2 and are predicted to
      escape nonsense-mediated decay, resulting in a truncated protein lacking the
      C-terminal PEST domain.
    explanation: >-
      Loss of the PEST degradation domain stabilizes NOTCH2 and drives the
      gain-of-function mechanism.
  downstream:
  - target: Increased osteoclastic bone resorption
    description: Stabilized NOTCH2 enhances osteoclastogenesis and bone resorption.
    causal_link_type: DIRECT
- name: Increased osteoclastic bone resorption
  description: >-
    Gain of NOTCH2 signaling increases osteoclast differentiation and activity,
    tipping bone remodeling toward net resorption and producing acro-osteolysis and
    generalized osteoporosis.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  evidence:
  - reference: PMID:21378985
    reference_title: Mutations in NOTCH2 cause Hajdu-Cheney syndrome, a disorder of severe and progressive bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hajdu-Cheney syndrome is characterized by severe and progressive bone loss due
      to increased osteoclastic bone resorption.
    explanation: >-
      Increased osteoclast-mediated resorption underlies the acro-osteolysis and
      osteoporosis of the disorder.
  downstream:
  - target: Acro-osteolysis
    causal_link_type: DIRECT
    description: Resorption of the terminal phalanges produces acro-osteolysis.
  - target: Osteoporosis
    causal_link_type: DIRECT
    description: Generalized excess resorption produces severe osteoporosis.

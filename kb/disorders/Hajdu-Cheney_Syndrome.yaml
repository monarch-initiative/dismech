name: Hajdu-Cheney Syndrome
creation_date: '2026-07-24T12:00:00Z'
category: Mendelian
synonyms:
- acroosteolysis dominant type
- acro-osteolysis with osteoporosis and changes in skull and mandible
- acro-dento-osteo dysplasia
- arthrodentoosteodysplasia
- Cheney syndrome
- serpentine fibula-polycystic kidney syndrome
- Hajdu-Cheney syndrome, NOTCH2-related
description: >-
  Hajdu-Cheney syndrome (HCS) is a rare autosomal dominant connective-tissue and
  skeletal disorder caused by heterozygous truncating mutations in the terminal
  coding exon (exon 34) of NOTCH2. Because these mutations cluster in the last exon,
  the mutant transcripts escape nonsense-mediated decay and produce a truncated,
  stabilized NOTCH2 protein lacking the C-terminal PEST degradation domain, yielding
  enhanced (gain-of-function) NOTCH2 signaling. The disorder is characterized by
  progressive acro-osteolysis of the distal phalanges, severe generalized
  osteoporosis with fractures, short stature, distinctive craniofacial features,
  wormian bones, platybasia/basilar invagination, premature tooth loss, joint
  laxity, and variable cardiovascular, renal, and neurologic involvement.

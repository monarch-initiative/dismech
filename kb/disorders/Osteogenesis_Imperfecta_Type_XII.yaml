treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the
    pharmacological mainstay of more severe OI, increasing bone mineral density
    and reducing fracture frequency, particularly relevant given the high
    trabecular bone turnover seen on biopsy in recessive SP7-related OI. They
    are antiresorptive and do not correct the underlying osteoblast-differentiation
    defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:

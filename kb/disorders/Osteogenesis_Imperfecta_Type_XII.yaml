      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Reduced Bone Matrix, Low Bone Density, and Skeletal Fragility
    treatment_effect: MODULATES
    description: >-
      Antiresorptive bisphosphonates suppress elevated trabecular bone turnover
      to improve bone mineral density and reduce low-trauma fracture risk.
    evidence:
    - reference: PMID:20301472
      reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bisphosphonates continue to be used most extensively in those with
        vertebral fractures, frequent long bone fractures, or more severe OI.
      explanation: >-
        Extrapolated from classical collagen-related OI management supporting
        antiresorptive modulation of low bone density and recurrent fractures.

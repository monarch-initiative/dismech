name: Osteogenesis Imperfecta Type XII
creation_date: "2026-06-30T00:00:00Z"
updated_date: "2026-11-13T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Osteogenesis imperfecta type 12
  term:
    id: MONDO:0013460
    label: osteogenesis imperfecta type 12
synonyms:
- OI12
- SP7 osteogenesis imperfecta
- osteogenesis imperfecta caused by mutation in SP7
- osteogenesis imperfecta, type XII
- osteogenesis imperfecta type 12
description: >-
  Osteogenesis imperfecta type XII (OI type XII) is an extremely rare brittle
  bone disease caused predominantly by biallelic loss-of-function variants in
  SP7, the gene encoding the osteoblast-specific zinc-finger transcription
  factor Osterix (OSX), with rare dominant heterozygous SP7 cases also reported.
  Unlike the collagen-structural (COL1A1/COL1A2) and collagen-modification
  (CRTAP, P3H1, PPIB, SERPINH1) forms of OI, OI type XII is a
  transcription-factor / osteoblast-differentiation disorder: Osterix acts
  downstream of RUNX2 and interacts with RUNX2 to induce COL1A1 expression,
  making it essential for the differentiation of preosteoblasts into mature,
  matrix-secreting osteoblasts and for bone formation. The defining human allele
  is a homozygous single-base-pair frameshift deletion (c.1052delA) that removes
  the last 81 amino acids of the protein, including the third Cys2-His2
  zinc-finger DNA-binding motif, abolishing the transcription factor's function.
  Subsequent consanguineous sibships carrying a homozygous missense variant
  (c.946C>T, p.Arg316Cys) confirmed the gene-disease relationship and added
  scoliosis, craniofacial anomalies, variable dentinogenesis imperfecta, and
  progressive hearing loss from ossicular and petrous bone hypomineralization to
  the recognized spectrum. Loss of Osterix impairs osteoblast differentiation
  and bone matrix deposition, producing a bone-formation deficit with cortical
  porosity, high trabecular turnover (in recessive cases), low bone mineral
  density, recurrent low-trauma fractures, mild-to-moderate bone deformity,
  variable short stature, normal sclerae, and delayed tooth eruption. The
  disorder was first defined in an Egyptian child (Lapunzina et al., 2010) and
  is modeled in extreme form by the bone-free phenotype of Osx-null mice
  (Nakashima et al., 2002).
parents:
- Osteogenesis imperfecta
notes: >-
  Classical OI type XII was established in autosomal recessive biallelic SP7
  loss-of-function kindreds (homozygous c.1052delA frameshift and homozygous
  p.Arg316Cys zinc-finger missense) showing cortical porosity and high
  trabecular bone turnover, which anchor the pathophysiology graph here.
  Pathological heterozygous SP7 missense variants have also been reported:
  siblings with heterozygous p.Glu340Ala presented with dominant OI
  characterized by low cortical density and low (rather than high) bone
  turnover, whereas unrelated individuals with a de novo neomorphic
  p.Ser309Trp variant developed high-turnover cranial hyperostosis /
  craniosynostosis with long-bone fragility or juvenile Paget disease (curated
  separately under Juvenile_Paget_Disease). No SP7-specific GeneReviews chapter
  exists in the NCBI Bookshelf GeneReviews index (checked against the
  2026-09-10 cache/bookshelf/genereviews.csv snapshot); general OI densitometry
  and supportive management items citing PMID:20301472 (COL1A1- and
  COL1A2-Related Osteogenesis Imperfecta) are extrapolated from classical
  collagen-related OI and marked directness: INDIRECT.
inheritance:
- name: Autosomal Recessive
  description: >-
    Predominant autosomal recessive inheritance from biallelic (homozygous)
    loss-of-function SP7/Osterix variants (c.1052delA; c.946C>T p.Arg316Cys) in
    consanguineous kindreds, associated with high trabecular bone turnover and
    cortical porosity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20579626
    reference_title: "Identification of a frameshift mutation in Osterix in a patient with recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have identified a homozygous single base pair deletion (c.1052delA) in
      SP7/Osterix (OSX) in an Egyptian child with recessive osteogenesis
      imperfecta.
    explanation: >-
      Establishes autosomal recessive inheritance of OI type XII from a
      homozygous SP7/Osterix frameshift variant.
  - reference: PMID:29382611
    reference_title: "Novel variant in Sp7/Osx associated with recessive osteogenesis imperfecta with bone fragility and hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variant in exon 2 of the Sp7/Osx gene was found in
      all affected relatives; c.946C>T (p.Arg316Cys).
    explanation: >-
      A second consanguineous sibship with a homozygous SP7/Osx variant confirms
      autosomal recessive inheritance.
- name: Autosomal Dominant (Rare Heterozygous SP7 Variant)
  description: >-
    Rare dominant OI type XII reported in siblings carrying a heterozygous
    zinc-finger substitution (p.Glu340Ala) who share low cortical density with
    recessive SP7 OI but exhibit low rather than high bone turnover; distinct
    heterozygous neomorphic p.Ser309Trp variants cause cranial hyperostosis or
    juvenile Paget disease (curated in Juvenile_Paget_Disease).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: DOI:10.1007/s00223-024-01266-5
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Homozygous or heterozygous mutations in SP7 are the cause of extremely rare type XII OI, with either with recessive ... or dominant inheritance ... and characterized by predominantly moderate bone fragility and deformity, delayed eruption of teeth, normal sclerae and variable den- tinogenesis imperfecta."
    explanation: >-
      Documents both autosomal recessive and dominant inheritance in SP7-related
      OI type XII.
  - reference: DOI:10.1007/s00223-024-01266-5
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intriguingly, there have also been reports of pathological heterozygous
      mutations in SP7. Siblings with a heterozy - gous substitution in a highly
      conserved zinc finger domain of osterix (p.Glu340Ala) share low cortical
      density with the recessive OI, but have low bone turnover ... rather than
      the high bone turnover seen in SP7 recessive OI.
    explanation: >-
      Describes the dominant heterozygous SP7 p.Glu340Ala sibship and contrasts
      its low bone turnover with high-turnover recessive SP7 OI.

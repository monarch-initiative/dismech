      secondary to otospongiosis and poor mineralization of ossicles and petrous
      temporal bone was also noted in two of the siblings.
    explanation: >-
      Documents progressive hearing loss (from ossicle/petrous mineralization
      defects) as a distinguishing feature of OI type XII in the second sibship.

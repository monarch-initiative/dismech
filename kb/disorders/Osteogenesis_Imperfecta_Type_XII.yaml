- name: Impaired Osteoblast Differentiation and Bone Matrix Deposition
  biological_scale: CELLULAR
  description: >-
    Osterix is required for the terminal differentiation of preosteoblasts into
    mature osteoblasts that synthesize type I procollagen and deposit bone
    matrix. In Osx-null mice no bone formation occurs: mesenchymal cells invade
    the cartilage but fail to deposit bone matrix and cannot differentiate into
    osteoblasts, even though they still express RUNX2/Cbfa1, placing Osterix
    downstream of RUNX2. In human cellular knockdown models and affected
    individuals, SP7 deficiency markedly reduces pro-alpha1(I) collagen
    expression and impairs osteoblast maturation and mineralized-tissue
    development, including tooth eruption.

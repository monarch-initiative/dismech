- name: Progressive Hearing Impairment
  category: Ear
  description: >-
    Progressive moderate-to-severe to severe-to-profound hearing loss was
    identified in two siblings of the second SP7/Osx sibship, secondary to
    otospongiosis and poor mineralization of the ossicles and petrous temporal
    bone. This established hearing loss as a potential distinguishing feature of
    OI type XII (the index patient of the first report had normal hearing), and
    the authors recommend early audiology screening. Sp7/Osx additionally
    regulates biomineralization of the otoconia/otoliths of the inner ear in
    animal models, offering a mechanistic link to the auditory phenotype.
  phenotype_term:
    preferred_term: Progressive hearing impairment
    term:
      id: HP:0001730
      label: Progressive hearing impairment
    clinical_course: PROGRESSIVE

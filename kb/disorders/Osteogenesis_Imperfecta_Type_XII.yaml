pathophysiology:
- name: SP7/Osterix Loss-of-Function Eliminates the Osteoblast Master Transcription Factor
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    SP7 encodes Osterix (OSX), an osteoblast-specific zinc-finger transcription
    factor containing three Cys2-His2 zinc-finger DNA-binding domains at its C
    terminus. Osterix is specifically expressed in all developing bones, acts
    downstream of RUNX2/Cbfa1, and interacts with RUNX2 to induce COL1A1 gene
    expression during osteoblast differentiation. The OI type XII frameshift
    deletion (c.1052delA) removes the last 81 amino acids, including the third
    zinc-finger motif, abolishing DNA-binding and transcriptional function,
    while the homozygous missense variant (p.Arg316Cys) alters the first
    zinc-finger domain.

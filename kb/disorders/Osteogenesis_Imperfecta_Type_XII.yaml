animal_models:
- name: Osx (Sp7) constitutive null mouse
  species: Mouse
  genotype: Sp7 (Osx) homozygous null (Osx-/-)
  publication: PMID:11792318
  description: >-
    Constitutive Osx-null mice exhibit a complete block of endochondral and
    intramembranous osteoblast differentiation despite preserved Runx2
    expression, resulting in absent bone matrix deposition and perinatal death.
  associated_phenotypes:
  - Complete absence of endochondral and intramembranous bone formation
  - Arrested osteoblast differentiation downstream of Runx2
  - Perinatal lethality
  modeled_mechanisms:
  - target: Impaired Osteoblast Differentiation and Bone Matrix Deposition
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes the essential requirement of Osterix for osteoblast
      differentiation and bone matrix deposition, though complete murine loss is
      perinatally lethal with zero bone formation whereas human C-terminal
      truncation or missense variants permit postnatal survival with
      osteopenic, fragile bone.
    limitations: >-
      Complete null mice form no mineralized bone and die shortly after birth,
      so postnatal fracture remodeling, cortical porosity, and progressive
      ossicular hearing loss seen in human OI type XII cannot be studied in
      constitutive Osx-/- neonates.
    evidence:
    - reference: PMID:11792318
      reference_title: "The novel zinc finger-containing transcription factor osterix is required for osteoblast differentiation and bone formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the mesenchymal cells do not deposit bone matrix. Similarly,
        cells in the periosteum and in the condensed mesenchyme of membranous
        skeletal elements cannot differentiate into osteoblasts.
      explanation: >-
        Demonstrates the complete arrest of osteoblast differentiation and bone
        matrix deposition in Osx-null mice.
diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XII is suspected in a child with recessive OI (recurrent low-trauma
    fractures, low bone mineral density, mild deformity, short stature, with or
    without hearing loss) when COL1A1/COL1A2 and the other recessive OI genes are
    negative. Diagnosis is confirmed by identifying a biallelic SP7 (Osterix)
    loss-of-function variant by gene-panel or exome sequencing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20579626
    reference_title: "Identification of a frameshift mutation in Osterix in a patient with recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a combination of homozygosity mapping and candidate gene approach,
      we have identified a homozygous single base pair deletion (c.1052delA) in
      SP7/Osterix (OSX)
    explanation: >-
      Molecular identification of a biallelic SP7 variant establishes the
      diagnosis of OI type XII.
- name: Dual X-Ray Absorptiometry
  description: >-
    Dual-energy X-ray absorptiometry (DXA) documents low bone mineral density
    (osteoporosis) and monitors bone-mass response during follow-up.
  diagnosis_term:
    preferred_term: dual X-ray absorptiometry
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:

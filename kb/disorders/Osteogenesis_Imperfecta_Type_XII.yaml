genetic:
- name: SP7 (Osterix) Loss-of-Function Mutation
  association: Causative
  gene_term:
    preferred_term: SP7 (OSX, Osterix; osteoblast transcription factor)
    term:
      id: hgnc:17321
      label: SP7
  notes: >-
    OI type XII is caused predominantly by biallelic loss-of-function variants
    in SP7, encoding the osteoblast-specific transcription factor Osterix (OSX).
    The defining human allele is a homozygous frameshift deletion (c.1052delA)
    that truncates the protein, removing its third zinc-finger DNA-binding
    motif; subsequent consanguineous sibships with a homozygous missense variant
    (c.946C>T, p.Arg316Cys) altering the first zinc-finger domain confirmed
    recessive SP7 OI with high trabecular bone turnover. Heterozygous zinc-finger
    missense alleles also cause dominant SP7 bone disease with distinct turnover
    phenotypes: p.Glu340Ala causes dominant OI with low cortical density and low
    bone turnover, whereas de novo neomorphic p.Ser309Trp causes cranial
    hyperostosis / craniosynostosis with long-bone fragility or juvenile Paget
    disease (curated separately in Juvenile_Paget_Disease).
  evidence:
  - reference: PMID:20579626
    reference_title: "Identification of a frameshift mutation in Osterix in a patient with recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding adds another locus to the spectrum of genes associated with
      osteogenesis imperfecta and reveals that SP7/OSX also plays a key role in
      human bone development.
    explanation: >-
      Identifies SP7/OSX as the causative locus for this recessive OI, defining
      OI type XII in humans.
  - reference: PMID:29382611
    reference_title: "Novel variant in Sp7/Osx associated with recessive osteogenesis imperfecta with bone fragility and hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variant in exon 2 of the Sp7/Osx gene was found in
      all affected relatives; c.946C>T (p.Arg316Cys).
    explanation: >-
      A second independent biallelic SP7 variant confirms SP7 as the OI type XII
      disease gene.
  - reference: DOI:10.1007/s00223-024-01266-5
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unrelated patients were reported with different phenotypic outcomes of a
      heterozygous p.Ser309Trp substitution, one patient with cranial
      hyperostosis, craniosynostosis, long bone fragility, and high bone
      turnover ... and one with Juvenile Paget’s Disease
    explanation: >-
      Documents allelic pleiotropy of heterozygous SP7 p.Ser309Trp across
      high-turnover bone fragility/hyperostosis and juvenile Paget disease.

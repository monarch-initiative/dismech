progression:
- phase: Exudative stage (stage I)
  notes: >-
    Sterile, free-flowing, neutrophilic exudate with normal pH and glucose;
    usually treated with antibiotics alone.
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The evolution of parapneumonic effusion is divided into three progressive
      stages: (I) exudative stage; (II) fibrinopurulent stage; and (III)
      organizing stage with pleural peel formation
    explanation: >-
      Defines the three-stage course.
- phase: Fibrinopurulent stage (stage II)
  notes: >-
    Bacterial invasion, fibrin deposition and loculation, turbid or purulent
    fluid with low pH and glucose and high LDH; can follow stage I within hours
    without effective treatment.
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients can progress to stage 2, the fibrinopurulent stage within hours
      if effective treatment is not provided.
    explanation: >-
      Gives the tempo of progression to stage II.
- phase: Organising stage (stage III)
  notes: >-
    Fibroblast ingrowth forms a pleural peel that can trap the lung; chronic
    empyema may follow, with bronchopleural fistula, fibrothorax or chest wall
    perforation.
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If stage 2 pleural fluid is not drained in conjunction with effective
      antibiotic therapy, the effusion may progress to stage 3, the organizing
      stage.
    explanation: >-
      States progression of undrained stage II fluid to stage III.
diagnosis:
- name: Diagnostic thoracentesis with pleural fluid appearance, Gram stain and culture
  description: >-
    Pleural fluid sampling is the reference standard. Macroscopic pus is
    diagnostic and needs no further analysis; otherwise Gram stain and culture
    are sent, inoculating fluid into blood culture bottles to raise the yield
    from 30-40% to about 60%. 16S rRNA PCR or sequencing detects organisms
    culture misses but is not yet routine. The trials define pleural infection
    as purulent fluid, organisms on Gram stain or culture, or pH below 7.2 with
    clinical infection.
  diagnosis_term:
    preferred_term: Thoracentesis
    term:
      id: NCIT:C15392
      label: Thoracentesis
  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pleural fluid sampling remains the gold standard for diagnosis of pleural
      infection.
    explanation: >-
      Pleural fluid sampling is the diagnostic reference standard.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pleural fluid culture, to date, is the recommended modality for
      microbiology. Although it has a yield of 30–40%, this increases to 60%
      when inoculated into blood culture bottles
    explanation: >-
      Gives the culture yield and the benefit of blood culture bottles.
  - reference: PMID:15745977
    reference_title: U.K. Controlled trial of intrapleural streptokinase for pleural infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      defined by the presence of purulent pleural fluid or pleural fluid with a
      pH below 7.2 with signs of infection or by proven bacterial invasion of
      the pleural space
    explanation: >-
      The MIST1 operational definition of pleural infection.
- name: Pleural fluid pH, glucose and LDH
  description: >-
    In non-purulent fluid, biochemistry decides drainage. Pleural fluid pH
    (measured on a blood gas analyser) is the single most useful indicator:
    under the 2023 British Thoracic Society guideline pH 7.2 or below means a
    high likelihood of infection and a chest drain; pH between 7.2 and 7.4 calls
    for LDH and glucose, with drainage considered if LDH is above 900 IU/L and
    glucose 4 mmol/L or below; pH 7.4 or above makes drainage unnecessary.
    Glucose below 2.2 mmol/L can stand in when pH is unreliable. The classic
    stage II thresholds are glucose below 60 mg/dL, pH below 7.20 and LDH above
    three times the serum upper limit. The pH cut-off is not absolute: effusions
    with pH up to 7.37 may need drainage.
  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pleural fluid pH has continued to be the single most useful indicator of
      the need for drainage of parapneumonic effusion
    explanation: >-
      Pleural fluid pH is the key drainage criterion.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      consider intercostal drain if LDH >900 IU·L−1 and glucose ≤4 mmol·L−1
    explanation: >-
      The BTS 2023 intermediate-pH rule as tabulated in the review.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, studies have shown that this criterion is not absolute and a
      higher pH of up to 7.37 may require drainage
    explanation: >-
      Caveat that the pH 7.2 threshold is not absolute.
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Typical pleural fluid studies in this stage have a glucose level less
      than 60 mg/dL, pH below 7.20, and pleural LDH more than three times the
      upper limit normal for serum (often >1,000 units/L)
    explanation: >-
      Classic biochemical thresholds of the fibrinopurulent stage.
- name: Thoracic ultrasound
  description: >-
    Bedside ultrasound guides safe sampling and drainage and shows features
    suggesting infection, such as septations, loculations and echogenic
    swirling. In one series 67% of parapneumonic collections were hyperechoic
    with septae, but ultrasound appearance did not reliably predict stage or the
    need for surgery.
  diagnosis_term:
    preferred_term: Thoracic ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT

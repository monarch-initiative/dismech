- name: ACCP parapneumonic effusion risk category
  description: >-
    The American College of Chest Physicians classification combines pleural
    space anatomy (size, loculation, parietal pleural thickening), pleural fluid
    bacteriology and pleural fluid chemistry (pH or glucose) into four risk
    categories; drainage is recommended for categories 3 and 4.
  evidence:
  - reference: PMID:11035692
    reference_title: "Medical and surgical treatment of parapneumonic effusions : an evidence-based guideline."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three variables, pleural space anatomy, pleural fluid bacteriology, and
      pleural fluid chemistry, were used in this annotated table to categorize
      patients into four separate risk levels for poor outcome
    explanation: >-
      Defines the ACCP risk categories.
  - reference: PMID:11035692
    reference_title: "Medical and surgical treatment of parapneumonic effusions : an evidence-based guideline."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      The panel's consensus opinion supported drainage for patients with
      moderate (category 3) or high (category 4) risk for a poor outcome
    explanation: >-
      Drainage threshold under the ACCP classification.
- name: RAPID prognostic score
  description: >-
    RAPID (Renal: serum urea; Age; Purulence of fluid, non-purulent scoring
    higher; Infection source, hospital-acquired scoring higher; Dietary: serum
    albumin) scores 0-7 at presentation. In the prospective PILOT validation,
    3-month mortality was 2.3% for low risk (0-2), 9.2% for medium risk (3-4)
    and 29.3% for high risk (5-7). It is validated for prognosis but not yet
    shown to improve outcomes when used to guide treatment.
  evidence:
  - reference: PMID:24264558
    reference_title: A clinical score (RAPID) to identify those at risk for poor outcome at presentation in patients with pleural infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Age, urea, albumin, hospital-acquired infection, and nonpurulence
      predicted poor outcome.
    explanation: >-
      The variables of the RAPID score, derived in MIST1.
  - reference: PMID:32675200
    reference_title: "Prospective validation of the RAPID clinical risk prediction score in adult patients with pleural infection: the PILOT study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Low-risk mortality (RAPID score 0-2): five out of 222 (2.3%, 95% CI 0.9 to
      5.7%); medium-risk mortality (RAPID score 3-4): 21 out of 228 (9.2%, 95%
      CI 6.0 to 13.7%); and high-risk mortality (RAPID score 5-7): 27 out of 92
      (29.3%, 95% CI 21.0 to 39.2%).
    explanation: >-
      Prospective validation of RAPID risk strata against 3-month mortality.
  - reference: PMID:36229045
    reference_title: ERS/ESTS statement on the management of pleural infection in adults.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Several studies have externally validated the RAPID score, but it
      requires incorporating into prospective intervention studies prior to
      adopting into clinical practice.
    explanation: >-
      Caveat that RAPID is not yet established for treatment decisions.
treatments:
- name: Empiric Antibiotic Therapy with Anaerobic Cover
  description: >-
    Broad-spectrum antibiotics are started as soon as pleural infection is
    suspected and chosen by setting. Community-acquired: an aminopenicillin with
    a beta-lactamase inhibitor (co-amoxiclav) plus metronidazole, covering
    streptococci, S. aureus and anaerobes; in penicillin allergy, clindamycin
    alone or with ciprofloxacin or a cephalosporin. Anaerobic cover can be
    dropped in proven monomicrobial streptococcal infection. Atypical cover is
    usually not needed. Hospital-acquired (after nosocomial pneumonia, surgery
    or trauma): antipseudomonal agents with anaerobic cover, for example
    cefepime with metronidazole, piperacillin-tazobactam, or a carbapenem,
    together with vancomycin or linezolid for MRSA. A total course of at least
    four weeks (intravenous then oral) is usual, based on expert opinion;
    intravenous treatment is stepped down to oral on clinical improvement, which
    usually takes 5-7 days.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy

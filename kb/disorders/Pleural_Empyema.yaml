- name: Video-Assisted Thoracoscopic Surgery (VATS) Debridement and Decortication
  description: >-
    Surgery debrides and evacuates infected material; in the organising stage,
    decortication of the visceral pleural rind lets the lung re-expand. VATS is
    preferred over open thoracotomy because of less pain, shorter stay and fewer
    complications; open window thoracostomy or thoracoplasty is reserved for
    chronic empyema with bronchopleural fistula after failed treatment. About
    15-20% of patients need surgery, usually for persistent collection or
    sepsis. Delay in surgical referral is associated with conversion to open
    surgery and worse outcome. The MIST-3 feasibility trial compared early VATS
    with early intrapleural enzyme therapy and was not powered for clinical
    outcomes; meta-analysis found no mortality difference between primary
    surgical and non-surgical management.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Video-assisted thoracoscopic surgery
    term:
      id: NCIT:C15726
      label: Thoracoscopic Surgery
  target_mechanisms:
  - target: Fibrin Deposition and Loculation
    treatment_effect: INHIBITS
    description: >-
      Breaks down septations and evacuates loculated pus.
  - target: Organizing Pleural Peel Formation
    treatment_effect: INHIBITS
    description: >-
      Decortication removes the organised peel.
  - target: Lung Entrapment
    treatment_effect: INHIBITS
    description: >-
      Decortication frees the trapped lung to re-expand.
  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In advanced stages of pleural infection, the visceral pleura develops a
      thick rind; therefore, decortication is required to allow lung
      re-expansion and to maintain a sterile pleural space thereafter.
    explanation: >-
      Rationale for decortication in the organising stage.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Advances in surgery have led to an increase in the use of VATS as the
      preferred approach in managing pleural infection.
    explanation: >-
      VATS is the preferred surgical approach.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      about 15–20% of patients with pleural infection usually require surgical
      intervention
    explanation: >-
      Proportion needing surgery.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The authors concluded that there is no statistically significant
      difference in mortality between primary surgical and non-surgical
      management of pleural empyema for all age groups.
    explanation: >-
      Caveat: meta-analysis found no mortality advantage of primary surgery.
  - reference: PMID:37820359
    reference_title: "Early Video-assisted Thoracoscopic Surgery or Intrapleural Enzyme Therapy in Pleural Infection: A Feasibility Randomized Controlled Trial. The Third Multicenter Intrapleural Sepsis Trial-MIST-3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Median times to intervention were 1.0 and 3.5 days in the IET and surgery
      groups, respectively (P = 0.02).
    explanation: >-
      MIST-3 feasibility data comparing early enzyme therapy with early VATS.
differential_diagnoses:
- name: Malignant pleural effusion
  description: >-
    Older, comorbid patients with an insidious presentation of weight loss,
    anorexia and malaise are often first investigated for malignancy, which
    delays diagnosis of pleural infection.
  distinguishing_features:
  - Purulent fluid, positive Gram stain or culture, or low pleural fluid pH and glucose point to infection.
  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These symptoms mimic those of malignancy, and often these patients are
      enrolled in malignancy investigation pathways, thereby causing delays in
      diagnosis and treatment
    explanation: >-
      Names malignancy as the condition the insidious presentation mimics.

  evidence:
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, a β-lactamase inhibitor such as co-amoxiclav, and metronidazole,
      should also be given due to the frequent co-existence of
      penicillin-resistant aerobes (including S. aureus) and anaerobic
      bacteria, respectively.
    explanation: >-
      Community-acquired regimen with beta-lactamase inhibitor and anaerobic
      cover.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For patients that are penicillin-allergic, clindamycin alone, or in
      combination with ciprofloxacin or a cephalosporin, is likely to provide a
      good alternative
    explanation: >-
      Alternative regimen in penicillin allergy.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A reasonable empirical choice is cefepime–metronidazole,

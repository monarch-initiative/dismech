- name: Contrast-enhanced chest CT
  description: >-
    CT shows pleural enhancement and thickening; enhancement of both pleural
    layers separated by fluid (the split pleura sign) and pleural fluid volume
    were the CT features that predicted pleural infection in a retrospective
    study. CT does not reliably stage infection or predict the need for surgery.

- name: Organizing Pleural Peel Formation
  role: consequence
  biological_scale: TISSUE
  conforms_to: "parapneumonic_empyema_formation#Organizing Pleural Peel and Mesothelial-Mesenchymal Transition"
  description: >-
    Stage III. Fibroblasts proliferate into the fibrin from the visceral and
    parietal pleura, and mesothelial cells undergo mesothelial-mesenchymal
    transition into matrix-producing myofibroblasts, forming a thick, inelastic
    pleural peel. On CT, pleural thickening and enhancement are near-universal
    in parapneumonic effusions imaged for drainage (pleural thickening 46/50,
    92%).
  notes: >-
    GO:0001837 epithelial to mesenchymal transition approximates
    mesothelial-mesenchymal transition, following the module node this
    conforms to, which records that no mesothelial-specific GO term exists.

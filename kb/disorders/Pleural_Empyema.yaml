    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The evidence remains in favour of a small-bore chest tube optimally placed
      under image guidance as an appropriate initial intervention for most
      cases of pleural infection.
    explanation: >-

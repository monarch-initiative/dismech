name: Pleural Empyema
creation_date: "2026-11-27T23:10:01Z"
description: >-
  Pleural empyema is bacterial infection of the pleural space in which the
  pleural fluid is frank pus or contains organisms on Gram stain or culture. It
  is the purulent end of the spectrum of pleural infection, which runs from a
  sterile exudative parapneumonic effusion through a complicated, infected,
  acidic and loculated effusion to pus. Most cases complicate pneumonia
  (parapneumonic empyema); the rest follow thoracic surgery, chest trauma,
  oesophageal perforation, pleural procedures, subdiaphragmatic infection or
  haematogenous seeding. The disease evolves through three stages: exudative,
  fibrinopurulent (bacterial invasion, neutrophil influx, fibrin deposition and
  loculation, with low pleural fluid pH and glucose and high LDH) and organising
  (a fibrous pleural peel that can trap the lung). The organisms differ from
  those of pneumonia and from each other by setting: streptococci (the
  Streptococcus anginosus group and S. pneumoniae) and oral anaerobes dominate
  community-acquired disease, often as polymicrobial infection, whereas
  hospital-acquired disease is dominated by Staphylococcus aureus (frequently
  methicillin resistant) and Gram-negative bacteria. Treatment is prolonged
  antibiotics with anaerobic cover and chest tube drainage, with intrapleural
  tissue plasminogen activator plus DNase when drainage fails and thoracoscopic
  debridement or decortication for persistent sepsis or a trapped lung. About
  one in ten adults dies within three months and about one in five within a
  year. This entry covers non-tuberculous bacterial empyema; tuberculous empyema
  is curated separately.
category: Infectious Disease
disease_term:
  preferred_term: pleural empyema
  term:
    id: MONDO:0018667
    label: pleural empyema
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005242
      label: empyema
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0005242 empyema is defined as an accumulation of pus in a body
      cavity, usually the pleural space. It therefore also covers pus in other
      cavities (subdural empyema, gallbladder empyema), so it is broader than
      this entry, which is pus in the pleural space only. The entry is the
      subject and the broader generic class is the object, hence broadMatch.
      MONDO itself places pleural empyema (MONDO:0018667) under empyema.
parents:
- Pleural disease
- Bacterial infectious disease
synonyms:
- empyema thoracis
- thoracic empyema
- pyothorax
- purulent pleurisy
- bacterial pleural infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
  - classification_value: RESPIRATORY
notes: >-
  Scope. The modern literature mostly reports "pleural infection", which covers
  both complicated parapneumonic effusion and frank empyema, and the trials
  cited here (MIST1, MIST2, MIST3, PILOT) enrolled patients with purulent fluid,
  a positive Gram stain or culture, or acidic fluid with clinical infection.
  Statements quoted from those sources are therefore about pleural infection as
  a whole, of which purulent empyema is the far end. Paediatric empyema is not
  modelled separately; the cited adult review notes it differs in microbiology
  and outcome. Tuberculous empyema is carried only as a pointer subtype because
  it has its own entry, and the tuberculous pleural effusion is out of scope.
  No phenotype frequency is set. The cached sources name the presenting symptoms
  (fever, rigors, cough, pleuritic chest pain, dyspnoea, weight loss, anorexia,
  malaise) without per-symptom percentages in an empyema-only population; the
  one percentage found (pleural thickening on CT in 46/50, 92%) is from a
  50-patient series of parapneumonic effusions of mixed stage, so it is quoted
  in the description rather than set as a frequency. Incidence is recorded from
  a US hospitalisation dataset that counts parapneumonic empyema only, so it
  understates all-cause empyema. Cough is left without an upstream edge: in the
  cited series it accompanies the underlying pneumonia, which this entry does
  not model as a node. Seeded from
  research/Pleural_Empyema-deep-research-claude_code.md, used as leads only;
  every claim is supported by an evidence item quoting a cached abstract or full
  text. The parapneumonic_empyema_formation module notes advise against an
  Empyema disease entry; see review_notes for why this entry exists and how it
  conforms to that module.
review_notes: >-
  Deliberately lumped. This entry is the named clinical entity pleural empyema
  (MONDO:0018667) across every non-tuberculous bacterial cause, with no organism
  subtypes. Streptococcus pneumoniae, the Streptococcus anginosus group,
  Staphylococcus aureus including MRSA, oral anaerobes such as Fusobacterium,
  Prevotella and Porphyromonas, Enterobacteriaceae and Pseudomonas were checked
  against the rung-3 axes of design decisions section 3e. They do not partition
  cases: the TORPIDS metagenomic study found 79% of PILOT pleural fluid samples
  polymicrobial (PMID:35544066), so most patients carry several of these groups
  at once; diagnosis (pleural fluid purulence, pH, Gram stain and culture,
  ultrasound and CT), staging, drainage, intrapleural enzyme therapy and surgery
  are the same for all of them; and empiric antibiotics are chosen by setting
  (community- versus hospital-acquired) rather than by organism. The organism
  differences that are documented (higher mortality with S. aureus,
  Enterobacteriaceae and hospital-acquired infection, better survival with
  anaerobes and the S. anginosus group, PMID:16840746, PMID:35544066) are
  recorded as prognostic facts on the agents and in the RAPID score row rather
  than as subtypes, because they do not change the disease's mechanism. This is
  the same pattern as Bacterial_meningitis and Acute_Pyelonephritis, which are
  single entries over several organisms for one organ syndrome. Why a Disease
  entry and not only the module: the parapneumonic_empyema_formation module
  carries the shared pleural mechanism and says not to create an Empyema entry,
  on the reading that empyema is an organism-agnostic organ syndrome (rule R4).
  This entry instead treats pleural empyema as rung 2, the named clinical entity
  the field diagnoses, stages and treats as a unit (one guideline chapter, one
  trial series, one prognostic score), and every pathophysiology node below is
  true of every case whatever the organism. It conforms to the module node by
  node rather than duplicating it, and it covers post-surgical, post-traumatic
  and haematogenous empyema, which the module scopes out. A reviewer who prefers
  the R4 reading would convert this entry to a Grouping and lose the stage,
  diagnosis and treatment content, which has no other home. Tuberculous empyema
  is a pointer subtype with curated_in because it differs on agent, tempo and
  first-line therapy and has its own entry.
has_subtypes:
- name: Tuberculous empyema
  curated_in: Tuberculous_Empyema
  subtype_term:
    preferred_term: tuberculous empyema
    term:
      id: MONDO:0005999
      label: tuberculous empyema
  description: >-
    Chronic pleural infection by Mycobacterium tuberculosis with a high
    bacillary load, treated with antituberculous chemotherapy rather than the
    pyogenic regimens below. A child of pleural empyema in MONDO, curated in
    full in its own entry and kept here only as a pointer.
  evidence:
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous empyema represents a chronic, active infection of the pleural
      space that contains a large number of tubercle bacilli.
    explanation: >-
      Defines tuberculous empyema as a chronic mycobacterial infection of the
      pleural space, distinct in agent and tempo from pyogenic empyema.
infectious_agent:
- name: Streptococcus anginosus group
  infectious_agent_term:
    preferred_term: Streptococcus anginosus group
    term:
      id: NCBITaxon:671232
      label: Streptococcus anginosus group
  description: >-
    The S. anginosus (milleri) group of oral streptococci (S. anginosus,
    S. intermedius, S. constellatus) is among the commonest causes of
    community-acquired empyema and is associated with better one-year survival
    than other organisms.
  evidence:
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Conventional culture identified bacteria of the S anginosus group as the
      most frequently identified pathogen (15 [27%] of 55 samples), followed by
      Enterobacteriaceae (12 [22%] samples) and anaerobes (nine [16%] samples).
    explanation: >-
      In the culture-positive PILOT samples, the S. anginosus group was the
      most frequent cultured pathogen.
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The presence of anaerobes (hazard ratio 0·46, 95% CI 0·24-0·86, p=0·015)
      or bacteria of the Streptococcus anginosus group (0·43, 0·19-0·97,
      p=0·043) was associated with better patient survival
    explanation: >-
      Records the prognostic difference: S. anginosus group and anaerobic
      infections carry better survival.
- name: Streptococcus pneumoniae
  infectious_agent_term:
    preferred_term: Streptococcus pneumoniae
    term:
      id: NCBITaxon:1313
      label: Streptococcus pneumoniae
  description: >-
    The pneumococcus caused most empyemas before antibiotics and is now a
    minority cause in adults; it predominates in monomicrobial
    community-acquired infection.
  evidence:
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mixed anaerobes and other Gram-negative bacteria predominated in
      community-acquired polymicrobial infection whereas Streptococcus
      pneumoniae prevailed in monomicrobial cases.
    explanation: >-
      Places S. pneumoniae as the dominant organism of monomicrobial
      community-acquired pleural infection.
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the pre-antibiotic era, 60-70% of empyemas were due to Streptococcus
      pneumoniae (S. pneumoniae), which now only accounts for about 10%
    explanation: >-
      Records the fall in the pneumococcal share of empyema since the
      antibiotic era.
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    S. aureus, often methicillin resistant, is a leading cause of
    hospital-acquired empyema, has become more common in recent decades and
    carries the highest mortality of the common organisms.
  evidence:
  - reference: PMID:16840746
    reference_title: The bacteriology of pleural infection by genetic and standard methods and its mortality significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Approximately 60% of hospital-acquired infections included bacteria
      frequently resistant to antibiotics (methicillin-resistant Staphylococcus
      aureus, 25%; Enterobacteriaceae, 18%; Pseudomonas spp., 5%, enterococci,
      12%).
    explanation: >-
      In the MIST1 bacteriology study, MRSA was the commonest organism in
      hospital-acquired pleural infection.
  - reference: PMID:21617169
    reference_title: Emergence of parapneumonic empyema in the USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of the empyemas where study pathogens were listed (37.6%),
      staphylococcal-related empyema had the largest absolute increases across
      age groups and was associated with longer hospital stay and higher
      in-hospital mortality than other empyemas.
    explanation: >-
      US national data show rising staphylococcal empyema with worse outcomes.
- name: Fusobacterium nucleatum
  infectious_agent_term:
    preferred_term: Fusobacterium nucleatum (oral anaerobes)
    term:
      id: NCBITaxon:851
      label: Fusobacterium nucleatum
  description: >-
    Bound as the representative of the oral anaerobes (Fusobacterium,
    Prevotella, Porphyromonas, Parvimonas) that are the most abundant organisms
    in pleural fluid by sequencing, usually in polymicrobial infection; they are
    under-detected by culture, which is why empiric regimens cover anaerobes.
  evidence:
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Species of the genera Fusobacterium, Prevotella, Porphyromonas, and
      Parvimonas, which have all been reported in the oral cavity and dental
      microbiome, 10 , 17 were the most abundant anaerobic bacteria.
    explanation: >-
      Names Fusobacterium and other oral anaerobes as the most abundant
      anaerobes in pleural infection.
  - reference: PMID:16840746
    reference_title: The bacteriology of pleural infection by genetic and standard methods and its mortality significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Approximately 50% of community-acquired infections were streptococcal,
      and 20% included anaerobic bacteria.
    explanation: >-
      Quantifies the streptococcal and anaerobic shares of community-acquired
      pleural infection by culture and 16S PCR.
- name: Enterobacteriaceae
  infectious_agent_term:
    preferred_term: Enterobacteriaceae (Escherichia coli, Klebsiella)
    term:
      id: NCBITaxon:543
      label: Enterobacteriaceae
  description: >-
    Gram-negative enteric bacteria, mainly E. coli and Klebsiella, are common in
    hospital-acquired empyema; their dominance in pleural fluid is associated
    with higher mortality.
  evidence:
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Enterobacteriaceae were present in 52 (21%) samples and showed a mean
      abundance of 8·0% (23·9), with Escherichia coli and Klebsiella spp being
      the most common.
    explanation: >-
      Enterobacteriaceae, chiefly E. coli and Klebsiella, were detected in a
      fifth of pleural infection samples.
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Moreover, dominance of Enterobacteriaceae was associated with higher risk
      of death (2·26, 1·03-4·93, p=0·041).
    explanation: >-
      Records the worse prognosis of Enterobacteriaceae-dominant infection.
- name: Pseudomonas aeruginosa
  infectious_agent_term:
    preferred_term: Pseudomonas aeruginosa
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  description: >-
    A less common, antibiotic-resistant Gram-negative cause of hospital-acquired
    empyema; it is the reason hospital-acquired empiric regimens include an
    antipseudomonal agent. The cited study reports Pseudomonas at genus level.
  evidence:
  - reference: PMID:16840746
    reference_title: The bacteriology of pleural infection by genetic and standard methods and its mortality significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Approximately 60% of hospital-acquired infections included bacteria
      frequently resistant to antibiotics (methicillin-resistant Staphylococcus
      aureus, 25%; Enterobacteriaceae, 18%; Pseudomonas spp., 5%, enterococci,
      12%).
    explanation: >-
      Pseudomonas species accounted for 5% of hospital-acquired pleural
      infections.
agent_life_cycle:
  description: >-
    The causative bacteria are human commensals or nosocomial organisms (oral
    and upper respiratory tract flora, skin and hospital flora). Empyema is not
    transmitted between people as such; it arises within the host when these
    organisms reach the pleural space from an adjacent pneumonia, through a
    surgical or traumatic breach, from the oesophagus or abdomen, or by the
    bloodstream. No non-human reservoir is involved in human disease.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
transmission:
- name: Contiguous spread from pneumonia
  description: >-
    The usual route: bacteria and inflammation extend from a pneumonia or lung
    abscess in parenchyma next to the visceral pleura. The oral anaerobes and
    S. anginosus group bacteria found in pleural fluid point to aspiration of
    oral and oropharyngeal flora as the source in much community-acquired
    disease.
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      About 60% of empyemas are related to a primary pneumonic process,
      therefore risk factors for pleural infection are similar to those for
      pneumonia
    explanation: >-
      Establishes pneumonia as the most common source of empyema.
  - reference: PMID:35544066
    reference_title: "The bacteriology of pleural infection (TORPIDS): an exploratory metagenomics analysis through next generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combined, these data suggest that aspiration of oropharyngeal and oral
      and dental pathogens might play a substantial role in the
      aetio-pathogenesis of pleural infection.
    explanation: >-
      The authors' interpretation of their own sequencing data, supporting
      aspiration of oral flora as a source.
- name: Iatrogenic or traumatic inoculation and non-pneumonic sources
  description: >-
    Bacteria enter the pleural space directly after thoracic surgery, chest
    trauma, oesophageal perforation or thoracentesis, or reach it from a
    subdiaphragmatic infection or by haematogenous spread. These routes account
    for most hospital-acquired empyema.
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other causes of empyema include complications after thoracic surgical
      procedures, trauma, esophageal perforation, thoracentesis and
      subdiaphragmatic infection
    explanation: >-
      Lists the non-pneumonic routes into the pleural space.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the hospital-acquired setting, pleural infection usually arises
      secondary to nosocomial pneumonia, trauma and surgery.
    explanation: >-
      Ties trauma and surgery to hospital-acquired pleural infection.
prevalence:
- population: United States, national hospitalisation data, 2008 (parapneumonic empyema-related hospitalisations)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.98
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Parapneumonic empyema-related hospitalisations rose from 3.04 per 100,000
    in 1996 to 5.98 per 100,000 in 2008, using census denominators. The figure
    counts hospitalisations with a parapneumonic empyema code, not all empyema,
    so post-surgical and other non-pneumonic empyema are excluded.
  evidence:
  - reference: PMID:21617169
    reference_title: Emergence of parapneumonic empyema in the USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall, national parapneumonic empyema-related hospitalisation rates
      increased from 3.04 per 100,000 in 1996 to 5.98 per 100,000 in 2008, a
      2.0-fold increase (95% CI 1.8 to 2.1).
    explanation: >-
      Gives the 2008 US annual incidence of parapneumonic empyema
      hospitalisation and its doubling since 1996.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Pleural infection needs prolonged hospital care (an average stay of about
    two weeks and at least four weeks of antibiotics), drainage and often
    surgery, and it remains lethal: in the prospective PILOT cohort 10% of
    adults died within 3 months and 19% within 12 months, and the US in-hospital
    case fatality of parapneumonic empyema was about 7-8%. Mortality is much
    higher in hospital-acquired, S. aureus and Gram-negative infection, and
    chronic empyema leaves bronchopleural fistula, trapped lung and fibrothorax
    in some survivors.
  evidence:
  - reference: PMID:32675200
    reference_title: "Prospective validation of the RAPID clinical risk prediction score in adult patients with pleural infection: the PILOT study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall mortality was 10% at 3 months (54 out of 542) and 19% at 12
      months (102 out of 542).
    explanation: >-
      Prospective multicentre mortality of adult pleural infection.
  - reference: PMID:21617169
    reference_title: Emergence of parapneumonic empyema in the USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The overall in-hospital case fatality ratio for parapneumonic
      empyema-related hospitalisations was 8.0% (95% CI 6.4% to 9.5%) in 1996
      and 7.2% (95% CI 6.3% to 8.1%) in 2008 (p=0.395).
    explanation: >-
      National in-hospital case fatality of parapneumonic empyema.
  - reference: PMID:16840746
    reference_title: The bacteriology of pleural infection by genetic and standard methods and its mortality significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mortality was increased in hospital-acquired infection (hospital, 17/36
      [47%]; community, 53/304 [17%]; relative risk, 4.24; 95% confidence
      interval, 2.07-8.69; p < 0.00001; chi(2), 1 df = 17.47)
    explanation: >-
      Hospital-acquired pleural infection carried roughly four times the
      mortality of community-acquired infection.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The average length of hospital stay for pleural infection is 14 days
    explanation: >-
      Records the length-of-stay component of the burden.

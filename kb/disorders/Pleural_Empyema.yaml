  evidence:
  - reference: PMID:11404254
    reference_title: Bacterial induction of pleural mesothelial monolayer barrier dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results suggest that bacterial pathogens induce VEGF release in
      mesothelial cells and alter mesothelial permeability, leading to protein
      exudation in empyema.
    explanation: >-
      In a mesothelial monolayer model, bacteria raise VEGF and permeability.
  downstream:
  - target: Exudative Pleural Effusion
    causal_link_type: DIRECT
    description: >-
      Raised permeability lets protein-rich fluid and inflammatory cells into
      the pleural space.
    evidence:
    - reference: PMID:11404254
      reference_title: Bacterial induction of pleural mesothelial monolayer barrier dysfunction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Our results suggest that bacterial pathogens induce VEGF release in
        mesothelial cells and alter mesothelial permeability, leading to
        protein exudation in empyema.
      explanation: >-
        Links mesothelial permeability change to protein exudation.
  - target: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
    causal_link_type: DIRECT
    description: >-
      Activated mesothelium switches on coagulation and represses
      fibrinolysis.
    evidence:
    - reference: PMID:23308155
      reference_title: "Clinical importance of angiogenic cytokines, fibrinolytic activity and effusion size in parapneumonic effusions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Exposure of pleural mesothelial cells to bacteria or lipopolysaccharide

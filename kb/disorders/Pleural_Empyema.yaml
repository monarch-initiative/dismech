- name: Chest Tube Drainage
  description: >-
    Drainage of the pleural space with a small-bore chest tube placed under
    image guidance is the appropriate first intervention for most cases and is
    indicated immediately for frank pus or pH 7.2 or below. Drain blockage is
    common, and saline flushes are used to reduce it. Delay in drainage of more
    than two days was associated with higher mortality.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Tube thoracostomy
    term:
      id: NCIT:C148463
      label: Tube Thoracostomy
  target_mechanisms:

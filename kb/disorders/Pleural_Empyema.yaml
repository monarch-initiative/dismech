pathophysiology:
- name: Bacterial Seeding of the Pleural Space
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Bacteria or bacterial products reach the pleura. In most cases the source
    is a pneumonia whose inflammation extends from the parenchyma to the
    visceral pleura; otherwise bacteria are inoculated directly by surgery,
    trauma, oesophageal perforation or a pleural procedure, or arrive from the
    abdomen or the bloodstream. About 30% of pleural infections have no
    radiological pneumonia.
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  - preferred_term: visceral pleura
    term:
      id: UBERON:0002401
      label: visceral pleura
  evidence:
  - reference: PMID:26150912
    reference_title: "Pneumonia and empyema: causal, casual or unknown."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, up to 40% of empyema may be secondary to a non-pneumonic
      process, such as systemic infection with hematogenous spread or abdominal
      etiology.
    explanation: >-
      Supports the non-pneumonic routes of seeding alongside pneumonia.
  - reference: PMID:38229682
    reference_title: Diagnosis and management of pleural infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      We now know that about 30% of cases of pleural infection have no
      associated pneumonic illness on radiological assessment
    explanation: >-
      The review restating cohort data that a minority of pleural infections
      lack radiological pneumonia.
  downstream:
  - target: Visceral Pleural Mesothelial Activation and Barrier Injury
    causal_link_type: DIRECT
    description: >-
      Pneumonic inflammation or bacteria at the pleural surface act on the
      mesothelium.
    evidence:
    - reference: PMID:26150912
      reference_title: "Pneumonia and empyema: causal, casual or unknown."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The inflammatory process of the pulmonary parenchyma extends to the
        visceral pleura causing changes to the mesothelial cells lining the
        pleura, allowing increased fluid movement.
      explanation: >-
        States the step from parenchymal infection to mesothelial change.
- name: Visceral Pleural Mesothelial Activation and Barrier Injury
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "parapneumonic_empyema_formation#Visceral Pleural Mesothelial Activation and Barrier Injury"
  description: >-
    Pleural mesothelial cells exposed to bacteria or their products release
    VEGF, IL-8 and other mediators and lose barrier integrity, raising

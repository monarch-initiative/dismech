- name: Intrapleural tPA plus DNase (MIST2 regimen)
  description: >-
    Intrapleural alteplase 10 mg followed by dornase alfa 5 mg, twice daily for
    three days (up to six doses), for infected collections that do not drain.
    In MIST2 the combination improved radiographic clearance and reduced
    surgical referral and hospital stay, whereas either agent alone was
    ineffective; DNase alone increased surgical referral. Bleeding occurs in
    about 4% and is more likely with a high RAPID score, concurrent systemic
    anticoagulation, renal failure or a low platelet count; halving the tPA dose
    is an option when anticoagulation cannot be stopped.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intrapleural pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alteplase (tissue plasminogen activator)
      term:
        id: NCIT:C39607
        label: Alteplase
    - preferred_term: dornase alfa (recombinant human DNase)
      term:
        id: NCIT:C81664
        label: Dornase Alfa
  target_mechanisms:
  - target: Intrapleural Procoagulant Shift with Suppressed Fibrinolysis
    treatment_effect: INHIBITS
    description: >-
      tPA restores local fibrinolysis against the PAI-1-dominated state.
  - target: Fibrin Deposition and Loculation
    treatment_effect: INHIBITS
    description: >-
      tPA breaks down fibrin septations so loculated fluid can drain.
  - target: Empyema (Pleural Pus Accumulation)
    treatment_effect: INHIBITS
    description: >-
      DNase degrades extracellular DNA that makes pus viscous.
  evidence:
  - reference: PMID:21830966

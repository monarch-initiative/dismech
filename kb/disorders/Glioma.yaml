  notes: >-
    IDH1 (most often R132H) mutation defines IDH-mutant astrocytoma and
    oligodendroglioma and is the primary molecular divider of adult-type diffuse
    glioma. IDH-mutant tumors carry a more favorable prognosis than IDH-wildtype.
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation is the defining, grading-relevant molecular feature of IDH-mutant glioma.
- name: IDH2
  gene_term:
    preferred_term: IDH2
    term:
      id: hgnc:5383
      label: IDH2
  association: Somatic Missense Mutation
  notes: >-
    IDH2 mutation is a less common alternative to IDH1 mutation and produces the
    same D-2-hydroxyglutarate oncometabolite; it likewise defines IDH-mutant
    adult-type diffuse glioma.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  association: Promoter Mutation
  notes: >-
    TERT promoter mutation reactivates telomerase and is one of three
    glioblastoma-defining molecular markers; also frequent in oligodendroglioma.
- name: EGFR
  gene_term:
    preferred_term: EGFR
    term:
      id: hgnc:3236
      label: EGFR
  association: Amplification
  notes: >-
    EGFR amplification (frequently with EGFRvIII) is one of three
    glioblastoma-defining molecular features and activates RTK-RAS-PI3K signaling.
- name: 1p/19q
  association: Whole-Arm Codeletion
  notes: >-
    Whole-arm codeletion of chromosomes 1p and 19q, together with IDH mutation,
    defines oligodendroglioma. This is a chromosomal codeletion, not a single-gene
    lesion, so it carries no gene_term.
- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  association: Homozygous Deletion
  notes: >-
    Homozygous deletion of CDKN2A (with the adjacent CDKN2B) is a WHO CNS5 grade-4
    criterion in IDH-mutant astrocytoma and is common in IDH-wildtype glioblastoma.
- name: CDKN2B
  gene_term:
    preferred_term: CDKN2B
    term:
      id: hgnc:1788
      label: CDKN2B
  association: Homozygous Deletion
  notes: >-
    CDKN2B is co-deleted with CDKN2A at 9p21; homozygous CDKN2A/B loss upgrades
    IDH-mutant astrocytoma to grade 4 and is frequent in IDH-wildtype glioblastoma.
- name: Germline Cancer-Predisposition Variants
  association: Germline Pathogenic Variant
  notes: >-
    Most gliomas are sporadic, but a clinically meaningful minority carry
    pathogenic germline variants (e.g., BRCA2, MUTYH, CHEK2, NF1, mismatch-repair
    genes), with implications for surveillance and cascade testing.
  evidence:
  - reference: PMID:37720399
    reference_title: "Prevalence of pathogenic germline variants in adult-type diffuse glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified 152 glioma patients of which 15 (9.8%) had pathogenic germline variants."
    explanation: About 10% of adult-type diffuse glioma patients harbored pathogenic germline variants in a paired tumor/normal series.
diagnosis:
- name: Contrast-enhanced brain magnetic resonance imaging
  presence: >-
    Contrast-enhanced brain MRI (including T2-weighted, FLAIR, and pre- and
    post-gadolinium T1-weighted sequences, optionally supplemented by diffusion
    and perfusion imaging) is the gold-standard neuroimaging modality to detect,
    localize, and characterize suspected glioma.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:37540408
    reference_title: "SEOM-GEINO clinical guidelines for high-grade gliomas of adulthood (2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The objective of imaging tests of brain tumors is to detect lesions, locate them, define their extension, and characterize them. The gold standard is magnetic resonance imaging (MRI) with contrast"
    explanation: Establishes contrast-enhanced brain MRI as the gold-standard imaging modality for suspected glioma.
- name: Integrated histopathological and molecular neuropathological examination
  presence: >-
    Tissue biopsy or surgical resection specimen evaluated by histopathology,
    IDH1 R132H and ATRX immunohistochemistry, and molecular testing for IDH1/2
    sequencing, 1p/19q codeletion, CDKN2A/B deletion, TERT promoter mutation,
    EGFR amplification, +7/-10 signature, and H3 alterations establishes the
    WHO CNS5 integrated diagnosis.
  diagnosis_term:
    preferred_term: Histopathologic Examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The fifth-edition (WHO 2021) moved molecular diagnostics forward into a full integration of molecular parameters with the histological features into an integrative diagnostic approach."
    explanation: Supports integrated histological and molecular tissue diagnosis under WHO CNS5.
  - reference: PMID:37540408
    reference_title: "SEOM-GEINO clinical guidelines for high-grade gliomas of adulthood (2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immunohistochemistry for mutant IDH1 R132H protein and nuclear expression of ATRX should be performed routinely in the diagnostic workup for diffuse gliomas"
    explanation: Supports routine IDH1 R132H and ATRX immunohistochemistry in the diagnostic tissue workup of diffuse glioma.
treatments:
- name: Maximal Safe Surgical Resection
  description: >-
    Maximal safe resection of the tumor; extent of resection is prognostic, but
    the infiltrative nature of diffuse glioma precludes complete removal.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Diffuse Infiltrative Growth
    treatment_effect: INHIBITS
    description: >-
      Cytoreductive resection removes the bulk infiltrative tumor mass and
      relieves mass effect, though microscopic parenchymal infiltration persists.
    evidence:
    - reference: PMID:37540408
      reference_title: "SEOM-GEINO clinical guidelines for high-grade gliomas of adulthood (2022)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The first line of care consists of a multimodal treatment approach with surgical resection, RT, and CTX."
      explanation: Establishes maximal safe surgical resection as the initial cytoreductive component of first-line glioma management.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult-type diffuse gliomas represent a group of highly infiltrative central"
    explanation: Diffuse gliomas are characterized by highly infiltrative growth in the CNS.

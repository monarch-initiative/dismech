- accession: geo:GSE298358
  title: Endothelins influences the proliferation-migration balance of IDH1-mutant glioma cells and promotes proneural to mesenchymal transition [RNAseq-Gb7-HUVEC]
  description: Adult diffuse gliomas are the deadliest brain tumours including IDH-wildtype glioblastomas of worst prognosis and diffuse low grade IDH-mutant astrocytomas and oligodendrogliomas. These glial tumours display distinct tumoral cell population defeating current therapies. Our group has unveiled the role of NOTCH signalling in glioblastoma cell plasticity and in the conversion of oligodendrocytic-like to astrocytic-like tumoral cells in IDH-mutant low-grade gliomas which escalate inevitably to higher grade malignant gliomas.
  organism:
    preferred_term: human
    term:

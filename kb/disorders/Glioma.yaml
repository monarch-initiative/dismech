description: >-
  Glioma is the umbrella class of primary central nervous system tumors that
  arise from glial cells or glial/neural precursor cells — encompassing
  astrocytic, oligodendroglial, ependymal, and mixed neuronal-glial lineages and
  spanning WHO CNS grades 1-4. Under the 5th-edition WHO Classification of Tumors
  of the Central Nervous System (WHO CNS5, 2021), gliomas are organized primarily
  by molecular type rather than histology alone, using a layered "integrated
  diagnosis." Adult-type diffuse gliomas collapse into three molecularly defined
  types (astrocytoma, IDH-mutant; oligodendroglioma, IDH-mutant and
  1p/19q-codeleted; and glioblastoma, IDH-wildtype), while pediatric-type diffuse
  gliomas, circumscribed astrocytic gliomas, and ependymal tumors form separate
  families. Shared molecular axes — IDH1/2 mutation, 1p/19q codeletion, TERT
  promoter mutation, EGFR amplification, combined chromosome 7 gain / chromosome
  10 loss (+7/-10), CDKN2A/B homozygous deletion, and H3 alterations — define
  entities and increasingly drive grading. This root entry captures the conserved
  glial-tumor mechanism and cross-references the molecularly/histologically
  defined children curated as standalone dismech entries.
has_subtypes:
- name: Glioblastoma, IDH-Wildtype
  description: >-
    Most aggressive adult-type diffuse glioma (WHO grade 4), IDH-wildtype,
    diagnosable by classic histology or by glioblastoma-defining molecular
    features (TERT promoter mutation, EGFR amplification, and/or +7/-10). Curated
    as a standalone dismech entry (Glioblastoma_IDH_Wildtype; MONDO:0850335).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The principal updates in adult tumours concern the molecular definition of glioblastoma, restructuring of diffuse gliomas, and the introduction of several new tumour types."
    explanation: WHO CNS5 gives glioblastoma a molecular (IDH-wildtype) definition, the basis for this subtype.
- name: IDH-Mutant Astrocytoma
  description: >-
    Adult-type diffuse glioma (WHO grade 2-4) defined by IDH1/2 mutation without
    1p/19q codeletion, commonly with ATRX loss and TP53 mutation; prognosis is
    significantly better than IDH-wildtype glioblastoma. CDKN2A/B homozygous
    deletion upgrades the tumor to grade 4. Curated as a standalone dismech entry
    (IDH_Mutant_Astrocytoma; MONDO:0956994).
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation (without 1p/19q codeletion) with astrocytic-lineage markers defines IDH-mutant astrocytoma under WHO CNS5, where molecular features also drive grading.
- name: IDH-Mutant and 1p/19q-Codeleted Oligodendroglioma
  description: >-
    Adult-type diffuse glioma (WHO grade 2-3) defined by the combination of
    IDH1/2 mutation and whole-arm 1p/19q codeletion; generally the most
    favorable-prognosis adult diffuse glioma. Curated as a standalone dismech entry
    (IDH_Mutant_Oligodendroglioma; MONDO:0859592).
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation status (with 1p/19q codeletion for oligodendroglioma) defines and grades this subtype under WHO CNS5.
- name: Diffuse Midline Glioma, H3 K27-Altered
  description: >-
    Pediatric-type diffuse high-grade glioma (WHO grade 4) of midline structures,
    defined by loss of H3 K27 trimethylation (H3 K27M mutation or EZHIP
    overexpression). Curated as a standalone dismech entry
    (H3_K27_Altered_Diffuse_Midline_Glioma; MONDO:1060171).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The updates to the paediatric classification are protean, ranging from the introduction of new types to establishing separate tumour families for paediatric-type gliomas."
    explanation: WHO CNS5 established separate paediatric-type glioma families, the framework under which diffuse midline glioma, H3 K27-altered is defined.
- name: Mixed Neuronal-Glial Tumor
  description: >-
    Tumors with combined neuronal and glial differentiation (e.g., ganglioglioma,
    dysembryoplastic neuroepithelial tumor), typically low-grade and frequently
    epilepsy-associated. Curated as a standalone dismech entry
    (Mixed_Neuronal-Glial_Tumor; MONDO:0016729).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "WHO CNS5 introduces fundamental changes to brain tumour classification through the introduction of new tumour families and types, especially in the paediatric population, and a revision of diagnostic criteria for some of the existing neoplasms."
    explanation: WHO CNS5 revised diagnostic criteria across CNS tumour families, including the neuronal and mixed neuronal-glial tumours grouped here.
- name: Pilocytic Astrocytoma
  description: >-
    Circumscribed astrocytic glioma (WHO grade 1), the most common paediatric
    glioma, typically driven by KIAA1549-BRAF fusion or BRAF V600E and a distinct
    WHO CNS5 family from the adult-type diffuse gliomas. Curated as a standalone
    dismech entry (Pilocytic_Astrocytoma; MONDO:0016691).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of particular importance, WHO CNS5 places greater emphasis on organising tumours by molecular type to reflect biology, as well as to allow for better planning of treatment."
    explanation: WHO CNS5 organises tumours by molecular type; pilocytic astrocytoma is defined by its characteristic BRAF alteration within the circumscribed astrocytic glioma family.
pathophysiology:
- name: Glial-Lineage Neoplastic Transformation
  biological_scale: CELLULAR
  description: >-
    Gliomas arise from neoplastic transformation of glial cells or glial/neural
    stem and progenitor cells, producing highly infiltrative (diffuse) or
    circumscribed CNS tumors. Cell-of-origin lineage (astrocytic,
    oligodendroglial, ependymal, or mixed neuronal-glial) together with molecular
    alterations underpins the WHO CNS5 integrated diagnosis.

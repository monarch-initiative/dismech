name: Glioma
creation_date: "2026-07-08T00:00:00Z"
category: Cancer
parents:
- neuroepithelial neoplasm
disease_term:
  preferred_term: glioma
  term:
    id: MONDO:0021042
    label: glioma
description: >-
  Glioma is the umbrella class of primary central nervous system tumors that
  arise from glial cells or glial/neural precursor cells — encompassing
  astrocytic, oligodendroglial, ependymal, and mixed neuronal-glial lineages and
  spanning WHO CNS grades 1-4. Under the 5th-edition WHO Classification of Tumors
  of the Central Nervous System (WHO CNS5, 2021), gliomas are organized primarily
  by molecular type rather than histology alone, using a layered "integrated
  diagnosis." Adult-type diffuse gliomas collapse into three molecularly defined
  types (astrocytoma, IDH-mutant; oligodendroglioma, IDH-mutant and 1p/19q-
  codeleted; and glioblastoma, IDH-wildtype), while pediatric-type diffuse
  gliomas, circumscribed astrocytic gliomas, and ependymal tumors form separate
  families. Shared molecular axes — IDH1/2 mutation, 1p/19q codeletion, TERT
  promoter mutation, EGFR amplification, combined chromosome 7 gain / chromosome
  10 loss (+7/-10), CDKN2A/B homozygous deletion, and H3 alterations — define
  entities and increasingly drive grading. This root entry captures the conserved
  glial-tumor mechanism and cross-references the molecularly/histologically
  defined children curated as standalone dismech entries.
has_subtypes:
- name: Glioblastoma, IDH-Wildtype
  description: >-
    Most aggressive adult-type diffuse glioma (WHO grade 4), IDH-wildtype,
    diagnosable by classic histology or by glioblastoma-defining molecular
    features (TERT promoter mutation, EGFR amplification, and/or +7/-10). Curated
    as a standalone dismech entry (Glioblastoma_IDH_Wildtype; MONDO:0850335).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The principal updates in adult tumours concern the molecular definition of glioblastoma, restructuring of diffuse gliomas, and the introduction of several new tumour types."
    explanation: WHO CNS5 gives glioblastoma a molecular (IDH-wildtype) definition, the basis for this subtype.
- name: IDH-Mutant Astrocytoma
  description: >-
    Adult-type diffuse glioma (WHO grade 2-4) defined by IDH1/2 mutation without
    1p/19q codeletion, commonly with ATRX loss and TP53 mutation; prognosis is
    significantly better than IDH-wildtype glioblastoma. CDKN2A/B homozygous
    deletion upgrades the tumor to grade 4. Curated as a standalone dismech entry
    (IDH_Mutant_Astrocytoma; MONDO:0956994).
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation (without 1p/19q codeletion) with astrocytic-lineage markers defines IDH-mutant astrocytoma under WHO CNS5, where molecular features also drive grading.
- name: IDH-Mutant and 1p/19q-Codeleted Oligodendroglioma
  description: >-
    Adult-type diffuse glioma (WHO grade 2-3) defined by the combination of
    IDH1/2 mutation and whole-arm 1p/19q codeletion; generally the most favorable-
    prognosis adult diffuse glioma. Curated as a standalone dismech entry
    (IDH_Mutant_Oligodendroglioma; MONDO:0859592).
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation status (with 1p/19q codeletion for oligodendroglioma) defines and grades this subtype under WHO CNS5.
- name: Diffuse Midline Glioma, H3 K27-Altered
  description: >-
    Pediatric-type diffuse high-grade glioma (WHO grade 4) of midline structures,
    defined by loss of H3 K27 trimethylation (H3 K27M mutation or EZHIP
    overexpression). Curated as a standalone dismech entry
    (H3_K27_Altered_Diffuse_Midline_Glioma; MONDO:1060171).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "establishing separate tumour families for paediatric-type gliomas"
    explanation: WHO CNS5 established separate paediatric-type glioma families, the framework under which diffuse midline glioma, H3 K27-altered is defined.
- name: Mixed Neuronal-Glial Tumor
  description: >-
    Tumors with combined neuronal and glial differentiation (e.g., ganglioglioma,
    dysembryoplastic neuroepithelial tumor), typically low-grade and frequently
    epilepsy-associated. Curated as a standalone dismech entry
    (Mixed_Neuronal-Glial_Tumor; MONDO:0016729).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "revision of diagnostic criteria for some of the existing neoplasms"
    explanation: WHO CNS5 revised diagnostic criteria across CNS tumour families, including the neuronal and mixed neuronal-glial tumours grouped here.
- name: Pilocytic Astrocytoma
  description: >-
    Circumscribed astrocytic glioma (WHO grade 1), the most common paediatric
    glioma, typically driven by KIAA1549-BRAF fusion or BRAF V600E and a distinct
    WHO CNS5 family from the adult-type diffuse gliomas. Curated as a standalone
    dismech entry (Pilocytic_Astrocytoma; MONDO:0016691).
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "WHO CNS5 places greater emphasis on organising tumours by molecular type to reflect biology"
    explanation: WHO CNS5 organises tumours by molecular type; pilocytic astrocytoma is defined by its characteristic BRAF alteration within the circumscribed astrocytic glioma family.
pathophysiology:
- name: Glial-Lineage Neoplastic Transformation
  description: >-
    Gliomas arise from neoplastic transformation of glial cells or glial/neural
    stem and progenitor cells, producing highly infiltrative (diffuse) or
    circumscribed CNS tumors. Cell-of-origin lineage (astrocytic,
    oligodendroglial, ependymal, or mixed neuronal-glial) together with molecular
    alterations underpins the WHO CNS5 integrated diagnosis.
  cell_types:
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: gliogenesis
    term:
      id: GO:0042063
      label: gliogenesis
    modifier: ABNORMAL
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: IDH-Mutation Oncometabolite Epigenetic Reprogramming
    description: Transformed glial-lineage cells acquire the canonical molecular lesions that define glioma type.
  - target: TERT Promoter Mutation and Telomere Maintenance Reactivation
    description: Transformed cells acquire TERT promoter mutation, a glioblastoma-defining lesion enabling replicative immortality.
  - target: Chromosomal Copy-Number Alteration and Genomic Instability
    description: Transformed cells acquire large-scale copy-number alterations (+7/-10, 1p/19q codeletion, CDKN2A/B loss) that define glioma type and grade.
  - target: EGFR Amplification and RTK-RAS-PI3K Mitogenic Signaling
    description: Transformed cells acquire EGFR amplification (a glioblastoma-defining lesion) driving constitutive mitogenic signaling.
  - target: Diffuse Infiltrative Growth
    description: Transformed cells infiltrate brain parenchyma along white-matter tracts.
  evidence:
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult-type diffuse gliomas represent a group of highly infiltrative central"
    explanation: Adult-type diffuse gliomas are highly infiltrative CNS tumors of glial lineage.
- name: IDH-Mutation Oncometabolite Epigenetic Reprogramming
  description: >-
    IDH1 or IDH2 mutation is the primary biological divider of adult-type diffuse
    glioma. Mutant IDH acquires neomorphic activity producing the oncometabolite
    D-2-hydroxyglutarate, which competitively inhibits alpha-ketoglutarate-
    dependent dioxygenases (TET DNA demethylases and histone demethylases),
    yielding a glioma CpG-island methylator phenotype and a block in glial
    differentiation. IDH-mutant tumors carry a more favorable prognosis than
    IDH-wildtype.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: demethylation
    term:
      id: GO:0070988
      label: demethylation
    modifier: DECREASED
  - preferred_term: glial cell differentiation
    term:
      id: GO:0010001
      label: glial cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation is the defining molecular feature separating IDH-mutant from IDH-wildtype gliomas and informs grading.
  - reference: PMID:38760442
    reference_title: "IDH inhibition in gliomas: from preclinical models to clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "D-2-HG promotes DNA and histone hypermethylation."
    explanation: The IDH-mutant oncometabolite D-2-hydroxyglutarate drives DNA and histone hypermethylation, the epigenetic reprogramming underlying the glioma CpG-island methylator phenotype.
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis of adult type diffuse gliomas, IDH"
    explanation: WHO CNS5 anchors adult-type diffuse glioma diagnosis on IDH mutation status.
- name: TERT Promoter Mutation and Telomere Maintenance Reactivation
  conforms_to: "enabling_replicative_immortality#Telomere Maintenance Reactivation"
  description: >-
    TERT promoter mutation reactivates telomerase, enabling telomere maintenance
    and replicative immortality. TERT promoter mutation is one of the three
    glioblastoma-defining molecular markers (with EGFR amplification and +7/-10)
    and also occurs frequently in oligodendroglioma.
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Telomerase reactivation confers replicative immortality that sustains continued tumor-cell proliferation and growth.
  evidence:
  - reference: PMID:38760442
    reference_title: "IDH inhibition in gliomas: from preclinical models to clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bind the mutated TERT promoter and upregulate TERT expression"
    explanation: RNA polymerase II binding the mutated TERT promoter upregulates TERT expression, reactivating telomerase and enabling telomere maintenance in glioma.
- name: EGFR Amplification and RTK-RAS-PI3K Mitogenic Signaling
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    EGFR amplification (often with the EGFRvIII variant) and related receptor
    tyrosine kinase lesions drive constitutive RAS-MAPK and PI3K-AKT-mTOR
    mitogenic signaling and growth-factor-independent proliferation. EGFR
    amplification is one of the three glioblastoma-defining molecular features.
  biological_processes:
  - preferred_term: epidermal growth factor receptor signaling pathway
    term:
      id: GO:0007173
      label: epidermal growth factor receptor signaling pathway
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Sustained mitogenic signaling promotes tumor cell proliferation and invasion.
  evidence:
  - reference: PMID:35869291
    reference_title: "2021 WHO classification of tumours of the central nervous system: a review for the neuroradiologist."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The principal updates in adult tumours concern the molecular definition of glioblastoma, restructuring of diffuse gliomas, and the introduction of several new tumour types."
    explanation: EGFR amplification is one of the molecular alterations defining IDH-wildtype glioblastoma in WHO CNS5.
- name: Chromosomal Copy-Number Alteration and Genomic Instability
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Glioma types are defined in part by large-scale chromosomal copy-number
    alterations: combined whole chromosome 7 gain and chromosome 10 loss (+7/-10)
    and CDKN2A/B homozygous deletion in IDH-wildtype glioblastoma; whole-arm
    1p/19q codeletion in oligodendroglioma; and CDKN2A/B loss upgrading IDH-mutant
    astrocytoma to grade 4. These reflect underlying chromosomal instability.
  biological_processes:
  - preferred_term: chromosome organization
    term:
      id: GO:0051276
      label: chromosome organization
    modifier: ABNORMAL
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Chromosomal instability drives clonal evolution that sustains tumor progression and infiltrative growth.
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-arm 1p/19q codeletion and TERT promoter"
    explanation: Whole-arm 1p/19q codeletion is a defining large-scale chromosomal copy-number alteration under WHO CNS5, exemplifying the copy-number changes this node describes.
- name: Diffuse Infiltrative Growth
  description: >-
    Diffuse gliomas grow by single-cell infiltration of brain parenchyma along
    white-matter tracts and perivascular/subpial routes, precluding complete
    surgical resection and driving recurrence despite therapy.
  cell_types:
  - preferred_term: glial cell
    term:

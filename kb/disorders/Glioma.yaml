- accession: geo:GSE298358
  title: Endothelins influences the proliferation-migration balance of IDH1-mutant glioma cells and promotes proneural to mesenchymal transition [RNAseq-Gb7-HUVEC]
  description: Adult diffuse gliomas are the deadliest brain tumours including IDH-wildtype glioblastomas of worst prognosis and diffuse low grade IDH-mutant astrocytomas and oligodendrogliomas. These glial tumours display distinct tumoral cell population defeating current therapies. Our group has unveiled the role of NOTCH signalling in glioblastoma cell plasticity and in the conversion of oligodendrocytic-like to astrocytic-like tumoral cells in IDH-mutant low-grade gliomas which escalate inevitably to higher grade malignant gliomas.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12
  publication: PMID:42026941
  notes: Identified by GEO DataSets index search for Glioma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001000579
  title: Mutational analysis reveals the origin and therapy-driven evolution of recurrent glioma
  description: Tumor recurrence is a leading cause of cancer mortality. Therapies for recurrent disease may fail, at least in part, because the genomic alterations driving the growth of recurrences are distinct from those in the initial tumor. To explore this hypothesis, we sequenced the exomes of 23 initial low-grade gliomas and recurrent tumors resected from the same patients. In 43% of cases, at least half of the mutations in the initial tumor were undetected at recurrence, including driver mutations inTP53, ATRX, SMARCA4, and BRAF; this suggests that recurrent tumors are often seeded by cells derived from the initial tumor at a very early stage of their evolution.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WES
  publication: PMID:24336570
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Glioma"); description-level mentions were not accepted. EGA study_type: Exome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001258
  title: Search for new loci and low-frequency variants influencing glioma risk by exome-array analysis
  description: To identify protein altering variants (PAVs) for glioma we analysed Illumina HumanExome BeadChip exome array data on 1,882 glioma cases and 8,079 controls from three independent European populations. In addition to single variant tests we incorporated information on the predicted functional consequences of PAVs and analysed sets of genes with a higher likelihood of having a role in glioma on the basis of the profile of somatic mutations documented by large-scale sequencing initiatives. Globally there was a strong relationship between effect size and SNPs predicted to be damaging (P=2.29x10-49); however, these variants which are most likely to impact on risk, are rare (MAF<5%).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Glioma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001437
  title: Chromatin immunoprecipitation linked to next-generation whole genome sequencing (ChIP-Seq) for H3K36me3 in paediatric high grade glioma cell lines KKNS4 and SF188 with and without a G34V mutation in H3F3A
  description: Glioblastomas of children and young adults have a median survival of only 12-15months and are clinically and biologically distinct from histologically similar cancers in older adults1. They are defined by highly specific mutations in the gene encoding the histone H3.3 variant H3F3A2, occurring either at or close to key residues marked by methylation for regulation of transcription – K27 and G34. We performed chromatin immunoprecipitation linked to next-generation whole genome sequencing (ChIP-Seq) for H3K36me3 in order to test the hypothesis that, rather than total H3K36me3, the G34V mutation may instead result in differential binding of the trimethyl mark throughout the genome.

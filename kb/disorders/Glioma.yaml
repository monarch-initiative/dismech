datasets:
- accession: geo:GSE339484
  title: RNA-seq profiling of 14 paired primary and recurrent glioma cases
  description: Glioma recurrence remains a major clinical challenge and is associated with poor patient outcomes. To characterize transcriptomic alterations associated with tumor recurrence, we performed bulk RNA sequencing on paired primary and recurrent glioma tissue specimens from 14 patients. According to the 2021 World Health Organization (WHO) Classification of Central Nervous System Tumors, glioblastoma is defined as IDH-wildtype (IDH-wt), CNS WHO grade 4. Based on these criteria, 11 paired cases were classified as glioblastoma (IDH-wt, grade 4), while three paired cases with IDH-mutant, grade 3 gliomas were included as a comparison group.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 28
  publication: PMID:40658067
  notes: Identified by GEO DataSets index search for Glioma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE327029
  title: KPNA3 drives temozolomide resistance in glioblastoma by upregulating MGMT and activating STAT3 to sustain glioma stem cells
  description: Glioblastoma (GBM) invariably develops resistance to temozolomide (TMZ), the frontline chemotherapeutic agent, leading to treatment failure. The molecular mechanisms underlying this resistance remain incompletely understood. Here, we identify karyopherin subunit alpha 3 (KPNA3) as a novel and critical driver of TMZ resistance. Through integrated bioinformatics analysis of temozolomide-resistant glioma cells (SF126R) and patient databases, we found KPNA3 expression is elevated in TMZ-resistant contexts and correlates with poor prognosis in TMZ-treated patients.
  organism:
    preferred_term: human

    modifier: ABNORMAL
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: IDH-Mutation Oncometabolite Epigenetic Reprogramming
    description: Somatic IDH1/2 driver mutation in glial-lineage precursor cells defines IDH-mutant diffuse glioma subtypes.
  - target: TERT Promoter Mutation and Telomere Maintenance Reactivation
    description: Somatic TERT promoter mutation in glial-lineage tumor cells reactivates telomerase to sustain replicative immortality.
  - target: Chromosomal Copy-Number Alteration and Genomic Instability
    description: Large-scale chromosomal copy-number alterations (+7/-10, 1p/19q codeletion, CDKN2A/B loss) drive clonal progression across glioma subtypes.
  - target: EGFR Amplification and RTK-RAS-PI3K Mitogenic Signaling
    description: Somatic EGFR amplification in glial-lineage tumor cells drives constitutive RTK mitogenic signaling in IDH-wildtype glioblastoma.
  - target: Diffuse Infiltrative Growth
    description: Transformed cells infiltrate brain parenchyma along white-matter tracts.
  evidence:
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adult-type diffuse gliomas represent a group of highly infiltrative central nervous system tumors with a prognosis that significantly varies depending on the specific subtype and histological grade."
    explanation: Adult-type diffuse gliomas are highly infiltrative CNS tumors of glial lineage.
- name: IDH-Mutation Oncometabolite Epigenetic Reprogramming
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    IDH1 or IDH2 mutation is the primary biological divider of adult-type diffuse
    glioma. Mutant IDH acquires neomorphic activity producing the oncometabolite
    D-2-hydroxyglutarate, which competitively inhibits
    alpha-ketoglutarate-dependent dioxygenases (TET DNA demethylases and histone
    demethylases),
    yielding a glioma CpG-island methylator phenotype and a block in glial
    differentiation. IDH-mutant tumors carry a more favorable prognosis than
    IDH-wildtype.
  genes:
  - preferred_term: IDH1
    term:
      id: hgnc:5382
      label: IDH1
  - preferred_term: IDH2
    term:
      id: hgnc:5383
      label: IDH2
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NADP+) activity
    modifier: ABNORMAL
    term:
      id: GO:0004450
      label: isocitrate dehydrogenase (NADP+) activity
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: demethylation
    term:
      id: GO:0070988
      label: demethylation
    modifier: DECREASED
  - preferred_term: glial cell differentiation
    term:
      id: GO:0010001
      label: glial cell differentiation
    modifier: DECREASED
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Blocked glial differentiation and epigenetic reprogramming sustain diffuse glioma growth.
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For the first time molecular features are not only relevant for the classification of IDH-mutant gliomas but may impact grading as well."
    explanation: IDH mutation is the defining molecular feature separating IDH-mutant from IDH-wildtype gliomas and informs grading.
  - reference: PMID:38760442
    reference_title: "IDH inhibition in gliomas: from preclinical models to clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "D-2-HG promotes DNA and histone hypermethylation."
    explanation: The IDH-mutant oncometabolite D-2-hydroxyglutarate drives DNA and histone hypermethylation, the epigenetic reprogramming underlying the glioma CpG-island methylator phenotype.
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis of adult type diffuse gliomas, IDH mutant and IDH-wildtype has been simplified by introducing revised diagnostic and grading criteria."
    explanation: WHO CNS5 anchors adult-type diffuse glioma diagnosis on IDH mutation status.
- name: TERT Promoter Mutation and Telomere Maintenance Reactivation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  conforms_to: "enabling_replicative_immortality#Telomere Maintenance Reactivation"
  description: >-
    TERT promoter mutation reactivates telomerase, enabling telomere maintenance
    and replicative immortality. TERT promoter mutation is one of the three
    glioblastoma-defining molecular markers (with EGFR amplification and +7/-10)
    and also occurs frequently in oligodendroglioma.
  genes:
  - preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  cell_types:
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  molecular_functions:
  - preferred_term: telomerase activity
    modifier: INCREASED
    term:
      id: GO:0003720
      label: telomerase activity
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Telomerase reactivation confers replicative immortality that sustains continued tumor-cell proliferation and growth.
  evidence:
  - reference: PMID:38760442
    reference_title: "IDH inhibition in gliomas: from preclinical models to clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "RNA polymerase 2 can bind the mutated TERT promoter and upregulate TERT expression"
    explanation: RNA polymerase II binding the mutated TERT promoter upregulates TERT expression, reactivating telomerase and enabling telomere maintenance in glioma.
- name: EGFR Amplification and RTK-RAS-PI3K Mitogenic Signaling
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    EGFR amplification (often with the EGFRvIII variant) and related receptor
    tyrosine kinase lesions drive constitutive RAS-MAPK and PI3K-AKT-mTOR
    mitogenic signaling and growth-factor-independent proliferation. EGFR
    amplification is one of the three glioblastoma-defining molecular features.
  genes:
  - preferred_term: EGFR
    term:
      id: hgnc:3236
      label: EGFR
  cell_types:
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  molecular_functions:
  - preferred_term: epidermal growth factor receptor activity
    modifier: INCREASED
    term:
      id: GO:0005006
      label: epidermal growth factor receptor activity
  biological_processes:
  - preferred_term: epidermal growth factor receptor signaling pathway
    term:
      id: GO:0007173
      label: epidermal growth factor receptor signaling pathway
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Sustained mitogenic signaling promotes tumor cell proliferation and invasion.
  notes: >-
    PMID:37540408 documents EGFR amplification as a diagnostic molecular marker
    of IDH-wildtype glioblastoma; a glioma-specific source directly evidencing
    the downstream RAS-MAPK and PI3K-AKT-mTOR signaling cascade remains to be
    added.
  evidence:
  - reference: PMID:37540408
    reference_title: "SEOM-GEINO clinical guidelines for high-grade gliomas of adulthood (2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The presence of (+ 7/-10), EGFR amplification, and TERT promoter mutation are diagnostic of grade 4 GB in all IDH wild-type (WT) gliomas, even in the absence of necrosis, proliferation, or microvascularization."
    explanation: >-
      EGFR amplification is one of the glioblastoma-defining molecular
      alterations under WHO CNS5 (diagnostic of grade 4 IDH-wildtype
      glioblastoma). The downstream RTK-RAS-PI3K signaling mechanism this node
      also describes still needs a dedicated source.
- name: Chromosomal Copy-Number Alteration and Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Glioma types are defined in part by large-scale chromosomal copy-number
    alterations: combined whole chromosome 7 gain and chromosome 10 loss (+7/-10)
    and CDKN2A/B homozygous deletion in IDH-wildtype glioblastoma; whole-arm
    1p/19q codeletion in oligodendroglioma; and CDKN2A/B loss upgrading IDH-mutant
    astrocytoma to grade 4. These reflect underlying chromosomal instability.
  biological_processes:
  - preferred_term: chromosome organization
    term:
      id: GO:0051276
      label: chromosome organization
    modifier: ABNORMAL
  downstream:
  - target: Diffuse Infiltrative Growth
    description: Chromosomal instability drives clonal evolution that sustains tumor progression and infiltrative growth.
  evidence:
  - reference: PMID:36717507
    reference_title: "Updates on the WHO diagnosis of IDH-mutant glioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "IDH-mutations co-occur either with mutations in TP53 and ATRX associating with a less-favorable prognosis or with whole-arm 1p/19q codeletion and TERT promoter (TERTp) mutations associating with the most favorable prognosis for IDH-mutant gliomas"
    explanation: Whole-arm 1p/19q codeletion is a defining large-scale chromosomal copy-number alteration under WHO CNS5, exemplifying the copy-number changes this node describes.
- name: Diffuse Infiltrative Growth
  biological_scale: TISSUE
  description: >-
    Diffuse gliomas grow by single-cell infiltration of brain parenchyma along
    white-matter tracts and perivascular/subpial routes, precluding complete
    surgical resection and driving recurrence, mass effect, peritumoral edema,
    and focal or generalized neurological symptoms despite therapy.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  cell_types:
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  biological_processes:
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  downstream:
  - target: Seizure
    description: Cortical and subcortical parenchymal infiltration and peritumoral microenvironmental disruption provoke glioma-related seizures.
  - target: Headache
    description: Parenchymal tumor expansion and peritumoral vasogenic edema elevate intracranial pressure, causing headache.
  - target: Cognitive Impairment
    description: Diffuse infiltration across white-matter tracts and eloquent association networks impairs cognition.
  - target: Aphasia
    description: Infiltration and mass effect involving dominant-hemisphere language cortices and white-matter pathways produce aphasia.
  - target: Focal Motor Deficit
    description: Infiltration or compression of corticospinal motor cortex and white-matter tracts causes focal muscle weakness.
  - target: Dysphagia
    description: Brainstem or corticobulbar pathway involvement and mass effect impair swallowing.
  - target: Fatigue
    description: Parenchymal tumor burden, mass effect, and peritumoral edema contribute to prominent clinical fatigue.
  evidence:
  - reference: PMID:36534419
    reference_title: "Adult type diffuse gliomas in the new 2021 WHO Classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adult-type diffuse gliomas represent a group of highly infiltrative central nervous system tumors with a prognosis that significantly varies depending on the specific subtype and histological grade."
    explanation: Diffuse gliomas are characterized by highly infiltrative growth in the CNS.
  - reference: PMID:37540408
    reference_title: "SEOM-GEINO clinical guidelines for high-grade gliomas of adulthood (2022)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Focal or generalized symptoms vary depending on the size and location of the tumor, as well as the degree of peritumoral edema."
    explanation: Links parenchymal tumor size, location, and peritumoral edema to the focal and generalized neurological symptoms of glioma.

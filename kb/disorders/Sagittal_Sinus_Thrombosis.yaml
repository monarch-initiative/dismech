differential_diagnoses:
- name: Ischemic stroke
  disease_term:
    preferred_term: ischemic stroke
    term:
      id: MONDO:1060198
      label: ischemic stroke
  description: Arterial ischemic stroke is a cerebrovascular differential diagnosis, although cerebral venous thrombosis has a more varied clinical presentation and rarely presents as a classic arterial stroke syndrome.
  distinguishing_features:
  - More varied clinical presentation (isolated headache, intracranial hypertension syndrome, seizures, focal lobar syndrome, or encephalopathy) rather than a classic arterial stroke syndrome
  - Demonstration of thrombus in the cerebral veins and/or dural sinuses on MR venography or CT venography
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CVT have a more varied clinical presentation than other stroke types as they rarely present as a stroke syndrome.
    explanation: Contrasts the clinical presentation of cerebral venous thrombosis with other stroke types such as arterial ischemic stroke.
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The confirmation of the diagnosis of CVT relies on the demonstration of thrombi in the cerebral veins and/or sinuses by MR/MR venography or veno CT.
    explanation: Demonstrating venous or dural sinus thrombus on MR/CT venography distinguishes sagittal sinus thrombosis from arterial stroke.

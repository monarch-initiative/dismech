diagnosis:
- name: MR venography or CT venography demonstration of thrombus
  description: Diagnosis is confirmed by demonstrating thrombus in cerebral veins or dural venous sinuses using MR/MR venography or venous CT.
  diagnosis_term:
    preferred_term: venography
    term:
      id: NCIT:C38099
      label: Venography
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The confirmation of the diagnosis of CVT relies on the demonstration of thrombi in the cerebral veins and/or sinuses by MR/MR venography or veno CT.
    explanation: This supports venous imaging confirmation as the diagnostic standard.
progression:
- phase: Acute symptomatic venous sinus thrombosis
  notes: Acute presentation ranges from isolated headache to encephalopathy or loss of consciousness. Prognosis is often favorable with expert care, but severe cases can deteriorate from intracranial hypertension, venous infarction, or hemorrhage.
  evidence:
  - reference: PMID:38050259
    reference_title: 'Pathophysiology, diagnosis and management of cerebral venous thrombosis: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The presenting symptoms can range from headache to loss of consciousness.
    explanation: This supports a wide acute presentation spectrum.
  - reference: PMID:38050259
    reference_title: 'Pathophysiology, diagnosis and management of cerebral venous thrombosis: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nevertheless, approximately 80% of patients have a good recovery
    explanation: This supports generally favorable recovery in many patients while not excluding severe outcomes.
treatments:
- name: Acute heparin anticoagulation
  description: Acute treatment uses unfractionated or low-molecular-weight heparin to limit thrombus extension and support recanalization; longer-term anticoagulation is tailored to thrombotic risk after the acute phase.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The main intervention in the acute is anticoagulation with either low molecular weight or unfractionated heparin.
    explanation: This review directly supports heparin anticoagulation as the main acute intervention.
  - reference: PMID:39492709
    reference_title: 'Treatment of cerebral venous thrombosis: a review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that LMWH and UH are safe and effective for the management of acute CVT and should be considered first line.
    explanation: This recent treatment review supports low-molecular-weight and unfractionated heparin as first-line acute CVT therapy.
- name: Endovascular thrombolysis or thrombectomy
  description: Local thrombolysis or mechanical thrombectomy may be considered in selected severe cases or when clinical status deteriorates despite anticoagulation, but evidence remains limited and specialist-center selection is important.
  treatment_term:
    preferred_term: thrombectomy
    term:
      id: NCIT:C52003
      label: Thrombectomy
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In patients in severe condition on admission or who deteriorate despite anticoagulation, local thrombolysis or thrombectomy is an option.
    explanation: This supports endovascular therapy only for selected severe or deteriorating patients.
  - reference: PMID:25899238
    reference_title: 'Mechanical thrombectomy in cerebral venous thrombosis: systematic review of 185 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebral venous thrombosis is generally treated with anticoagulation. However, some patients do not respond to medical therapy and these might benefit from mechanical thrombectomy.
    explanation: This systematic review supports thrombectomy as a possible option after inadequate response to medical therapy.
- name: Decompressive surgery for life-threatening mass effect
  description: Decompressive craniectomy may be used in life-threatening cases with large venous infarcts, hemorrhage, or severe intracranial pressure elevation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Decompressive surgery is life-saving in patients with large venous infarcts or haemorrhage.
    explanation: This supports decompressive surgery for selected life-threatening venous infarction or hemorrhage.
  - reference: PMID:39492709
    reference_title: 'Treatment of cerebral venous thrombosis: a review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Decompressive craniectomy may be used to reduce intracranial pressure in life-threatening cases.
    explanation: This recent treatment review supports decompressive craniectomy for selected life-threatening cases.
- name: Subacute and secondary-prevention oral anticoagulation (warfarin or direct oral anticoagulants)
  description: After acute heparin anticoagulation, patients continue oral anticoagulation with vitamin K antagonists (warfarin) or direct oral anticoagulants (DOACs) for a duration tailored to their underlying thrombotic risk to prevent recurrent venous thromboembolism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After the acute phase patients remain anticoagulated for a variable period of time, depending on their inherent thrombotic risk.
    explanation: Supports post-acute maintenance anticoagulation tailored to patient thrombotic risk.
  - reference: PMID:39492709
    reference_title: 'Treatment of cerebral venous thrombosis: a review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Warfarin may be used in the sub-acute phase for secondary prevention but has weak evidence. DOACs are potentially a safe warfarin alternative, but only warfarin is currently recommended in international guidelines.
    explanation: Documents subacute/secondary-prevention oral anticoagulation with warfarin and the emerging role of DOACs.
- name: Antiepileptic seizure prophylaxis
  description: Antiepileptic drug prophylaxis is recommended after a first seizure in cerebral venous thrombosis, particularly in patients with supratentorial hemispheric lesions.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

    modifier: INCREASED
    term:
      id: GO:0001666
      label: response to hypoxia
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Hemorrhagic parenchymal injury
    description: Focal venous infarction and lobar parenchymal injury can be complicated by parenchymal bleeding.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29039017
      reference_title: 'Cerebral venous sinus thrombosis complicated by seizures: a retrospective analysis of 69 cases.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Compared with those with no seizures, significantly more patients with secondary seizures had hemiplegia (37.50 vs. 15.63%; P = 0.020), bleeding (29.40 vs. 10.81%; P = 0.047), lesions involving the frontal (31.25 vs. 10.81%; P = 0.023) and temporal lobe (43.75 vs. 8.11%; P = 0.005)
      explanation: Supports focal lobar lesions and parenchymal bleeding in cerebral venous sinus thrombosis.
  - target: Focal neurological deficits
    description: Focal venous infarction produces local neurological deficits such as hemiparesis.
    causal_link_type: DIRECT
    evidence:

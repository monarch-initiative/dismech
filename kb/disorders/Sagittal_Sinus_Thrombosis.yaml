epidemiology:
- name: Young adult and female-predominant cerebral venous thrombosis pattern
  description: Cerebral venous thrombosis is uncommon, disproportionately affects younger adults, and in contemporary reviews is described as more common in females than males.
  evidence:
  - reference: PMID:38050259
    reference_title: 'Pathophysiology, diagnosis and management of cerebral venous thrombosis: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebral venous thrombosis is a rare cause of stroke in young mostly female adults which is frequently overlooked due to its variable clinical and radiological presentation.
    explanation: This review provides demographic context for the broader cerebral venous thrombosis syndrome that includes sagittal sinus thrombosis.
  - reference: PMID:38050259
    reference_title: 'Pathophysiology, diagnosis and management of cerebral venous thrombosis: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Females are 3 times more commonly affected and are significantly younger than males.
    explanation: This supports female predominance and younger age distribution in cerebral venous thrombosis.
- name: Common prothrombotic and acquired risk factors
  description: Frequently cited cerebral venous thrombosis risk factors include inherited or acquired prothrombotic states, estrogen-related exposures, pregnancy or puerperium, infection, and malignancy.
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The more frequent risk factors for CVT are prothrombotic conditions, either genetic or acquired, oral contraceptives, puerperium and pregnancy, infection and malignancy.
    explanation: This review directly lists common cerebral venous thrombosis risk factors.
prevalence:
- population: General adult population
  prevalence_class: RARE
  measure_type: UNKNOWN
  notes: Cerebral venous thrombosis is a rare cause of stroke that is less frequent than arterial ischemic stroke or intracerebral hemorrhage and has an adult incidence comparable to acute bacterial meningitis.
  evidence:
  - reference: PMID:38050259
    reference_title: 'Pathophysiology, diagnosis and management of cerebral venous thrombosis: A comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebral venous thrombosis is a rare cause of stroke in young mostly female adults which is frequently overlooked due to its variable clinical and radiological presentation.
    explanation: Establishes that cerebral venous thrombosis is a rare cause of stroke.
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebral venous thrombosis (CVT) is less frequent than ischemic stroke or intracerebral haemorrhage. Its incidence is comparable to that of acute bacterial meningitis in adults.
    explanation: Provides epidemiological incidence context relative to other stroke subtypes and acute bacterial meningitis in adults.
pathophysiology:
- name: Sagittal sinus thrombus and venous outflow obstruction
  description: Thrombus in a dural venous sinus, including the superior sagittal sinus, obstructs cerebral venous drainage. The lesion involves intraluminal clot formation in the venous sinus and can propagate or impair cortical venous outflow.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  locations:
  - preferred_term: superior sagittal sinus
    term:
      id: UBERON:0001642
      label: superior sagittal sinus
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  downstream:
  - target: Venous infarction
    description: Obstructed venous drainage causes focal venous infarction of cortical and subcortical brain tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17183977
      reference_title: Pathophysiology of cerebral venous thrombosis--an overview.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The pathophysiology of CVST depends on two interconnected events, local signs due to venous infarct, e.g., hemiparesis and global signs due to raised ICP from an obstructed venous system--papilloedema and isolated intracranial hypertension being one of them.
      explanation: Supports focal venous infarction as one of the two major consequences of obstructed cerebral venous drainage.
  - target: Raised intracranial pressure
    description: Obstructed venous drainage across the sagittal sinus elevates intracranial pressure globally.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17183977
      reference_title: Pathophysiology of cerebral venous thrombosis--an overview.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The pathophysiology of CVST depends on two interconnected events, local signs due to venous infarct, e.g., hemiparesis and global signs due to raised ICP from an obstructed venous system--papilloedema and isolated intracranial hypertension being one of them.
      explanation: Supports raised intracranial pressure from an obstructed venous system as one of the two major consequences of venous sinus thrombosis.
  evidence:
  - reference: PMID:25073867
    reference_title: 'Cerebral venous sinus thrombosis: update on diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The confirmation of the diagnosis of CVT relies on the demonstration of thrombi in the cerebral veins and/or sinuses by MR/MR venography or veno CT.
    explanation: This supports venous or sinus thrombus as the defining anatomic lesion in cerebral venous thrombosis.
- name: Venous infarction
  description: Obstructed cerebral venous drainage impairs venous outflow and causes focal cortical and subcortical venous infarction that manifests with local neurological signs such as hemiparesis and can undergo hemorrhagic conversion.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:

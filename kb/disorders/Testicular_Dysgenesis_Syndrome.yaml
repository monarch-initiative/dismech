    snippet: "Based on the timings in rats, we believe the programming window in humans is likely to be 8-14 weeks of gestation."
    explanation: >-
      Source of the human window timing in this node's description. Flagged INDIRECT
      because the human interval is extrapolated from rat timings, not measured.
- name: Incomplete Reproductive Tract Masculinization
  description: >-
    The organism-level consequence of deficient androgen action in the programming
    window: under-virilisation of the androgen-dependent reproductive structures. In the
    rat, which is where this node's evidence comes from, it presents as hypospadias,
    altered penile length and reduced ventral prostate and seminal vesicle size, all
    tracking with anogenital distance. The corresponding human components of TDS are
    hypospadias and cryptorchidism, but that correspondence is inferred from the shared
    endocrinology rather than measured in humans.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: male genitalia development
    term:
      id: GO:0030539
      label: male genitalia development
  downstream:
  - target: Hypospadias
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18340380
      reference_title: "Identification in rats of a programming window for reproductive tract masculinization, disruption of which leads to hypospadias and cryptorchidism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Only within the programming window did blocking androgen action induce hypospadias and cryptorchidism and altered penile length in male rats, all of which correlated with anogenital distance (AGD)."
      explanation: >-
        Failure of androgen-dependent masculinisation produces hypospadias. Rat evidence;
        the phenotype itself carries human evidence separately.
  - target: Cryptorchidism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18340380
      reference_title: "Identification in rats of a programming window for reproductive tract masculinization, disruption of which leads to hypospadias and cryptorchidism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Only within the programming window did blocking androgen action induce hypospadias and cryptorchidism and altered penile length in male rats, all of which correlated with anogenital distance (AGD)."
      explanation: >-
        The androgen-dependent route to cryptorchidism, corresponding to the second,
        inguinoscrotal phase of descent. The INSL3-dependent first phase reaches the same
        phenotype through Failure of Trans-abdominal Testicular Descent.
  evidence:
  - reference: PMID:20002220
    reference_title: "Androgen action in the masculinization programming window and development of male reproductive organs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Both DBP and flutamide exposure in the MPW significantly reduced penis, VP and SV size along with AGD at Pnd25; AGD and organ size were highly correlated."
    explanation: >-
      Two independent means of disrupting androgen action in the window produced the same
      coordinated under-virilisation of reproductive organs, tracking with AGD.
- name: Impaired INSL3-RXFP2 Signalling at the Gubernaculum
  description: >-
    A second, androgen-independent route from fetal Leydig cell dysfunction to a TDS
    component. Insulin-like 3 (INSL3), made by the fetal Leydig cells, acts through its
    receptor RXFP2 on the gubernaculum, the ligament anchoring the testis to the lower
    abdomen. Signalling through this axis drives myogenic differentiation and maintains
    androgen-receptor-positive cells in the gubernaculum, with Wnt/beta-catenin and Notch
    as downstream pathways. Loss of the ligand or the receptor interrupts the first,
    trans-abdominal stage of descent, which is why cryptorchidism can arise from Leydig
    cell failure without a proportionate deficit in testosterone.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  downstream:
  - target: Failure of Trans-abdominal Testicular Descent
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21147849
      reference_title: "Suppression of insulin-like3 receptor reveals the role of beta-catenin and Notch signaling in gubernaculum development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Conditional suppression of Rxfp2 in the gubernaculum led to cryptorchidism."
      explanation: >-
        Receptor suppression restricted to the gubernaculum produced the descent failure,
        which is this edge with the tissue of action pinned down.
  evidence:
  - reference: PMID:21147849
    reference_title: "Suppression of insulin-like3 receptor reveals the role of beta-catenin and Notch signaling in gubernaculum development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We have shown that INSL3/RXFP2 signaling is essential for myogenic differentiation and maintenance of AR-positive cells in the gubernaculum."
    explanation: >-
      States the cellular function of the axis in the gubernaculum that this node names.
- name: Failure of Trans-abdominal Testicular Descent
  description: >-
    Interruption of the first stage of testicular descent, in which the testis is held
    near the inguinal region as the abdomen grows. In the mouse it carries spermatogenic
    consequences in its own right, up to Sertoli-cell-only tubules. Human descent has two
    phases and this node models only the INSL3-dependent trans-abdominal one; the later
    inguinoscrotal phase is androgen-dependent and reaches cryptorchidism through
    Incomplete Reproductive Tract Masculinization instead, so human cryptorchidism is not
    attributed wholly to this node.
  biological_scale: ORGANISM
  downstream:
  - target: Cryptorchidism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20963592
      reference_title: "A missense mutation in LRR8 of RXFP2 is associated with cryptorchidism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Specifically, mice with one of each mutant allele (Rxfp2 ( DG/-)) exhibited decreased testis weight and failure of the testes to descend compared to their Rxfp2 (+/-) littermates."
      explanation: >-
        Failure of descent is cryptorchidism. Mouse evidence for the edge; the phenotype
        carries human evidence of its own.
  - target: Oligozoospermia

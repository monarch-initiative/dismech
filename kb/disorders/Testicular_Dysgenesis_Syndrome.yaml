prevalence:
- population: Western / developed countries, testicular germ cell cancer component
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    TDS itself has no prevalence figure, because it is not diagnosed as a unit. What the
    literature measures is the incidence of its components, and the component that
    carries the epidemiological argument is testicular germ cell cancer: its incidence
    rises by birth cohort rather than by period, which is what implicates a fetal
    exposure. Recorded at the TDS level because the birth-cohort pattern, not the rate,
    is the TDS-relevant claim. Rates for individual components belong in the component
    entries.
  evidence:
  - reference: PMID:17031378
    reference_title: "Interpreting the international trends in testicular seminoma and nonseminoma incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The disease mainly affects Western populations, with average rates in developed areas of the world six times higher than those in developing areas."
    explanation: >-
      The geographic concentration that accompanies the birth-cohort trend, and part of
      why the syndrome is read as environmentally driven.
  - reference: PMID:17031378
    reference_title: "Interpreting the international trends in testicular seminoma and nonseminoma incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Cohort-specific trends in seminoma incidence are similar to cohort-specific trends in nonseminoma incidence, lending support to the conclusion that the subtypes are epidemiologically and etiologically comparable."
    explanation: >-
      Both histological subtypes track the same birth cohorts, consistent with one
      early rate-limiting step shared by both, which is the TDS claim.
inheritance:
- name: Multifactorial, with rare monogenic forms
  description: >-
    TDS as a whole has no Mendelian mode of inheritance. The syndrome is read as
    multifactorial, with common inherited susceptibility to the cancer component
    (over 25 risk SNPs at 19 loci) acting alongside fetal exposures, and with rare
    families in which a single androgen-signalling lesion produces the full set of
    components. The AR variant curated in the genetic block is one such family and is
    X-linked, but it is not the mode of inheritance of the syndrome.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:26582516
    reference_title: "Male Reproductive Disorders and Fertility Trends: Influences of Environment and Genetic Susceptibility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on our review of genetic and environmental factors, we conclude that environmental exposures arising from modern lifestyle, rather than genetics, are the most important factors in the observed trends."
    explanation: >-
      Supports recording the syndrome as multifactorial and environmentally weighted
      rather than assigning it a Mendelian mode.
  - reference: PMID:25598472
    reference_title: "Common variants identified in genome-wide association studies of testicular germ cell tumour: an update, biological insights and clinical application."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple genome-wide association studies (GWAS) of TGCT have now been conducted, yielding over 25 disease-associated single-nucleotide polymorphism (SNP)s at 19 independent loci."
    explanation: >-
      The polygenic component of the multifactorial model, bearing on the cancer arm.
notes: >-
  TDS is a mechanistic hypothesis about shared fetal origin, not a clinical diagnosis
  applied to individual patients; most people present with one component only. The entry
  is therefore curated as the umbrella mechanism, and is deliberately kept separate from
  the entries for its components and for the Mendelian gonadal dysgenesis disorders that
  overlap it: Testicular_Germ_Cell_Tumor and Testicular_Seminoma (both of which already
  carry a Testicular Dysgenesis Syndrome item in their environmental section citing
  PMID:11331648), and NR5A1_Related_Sex_Development_Disorder,
  45_X_46_XY_Mixed_Gonadal_Dysgenesis and 46_XY_Partial_Gonadal_Dysgenesis. Monogenic
  causes of gonadal dysgenesis belong in those entries; what is curated here is the
  shared fetal-origin mechanism and the exposures that drive it.

  Prognosis is carried on the descent-to-infertility edge rather than in a block of its
  own, because the quantified cross-component outcomes that exist are measured on
  cryptorchidism cohorts after orchidopexy (impaired fertility in 33 per cent of
  unilateral and 66 per cent of bilateral cases, and a five- to ten-fold malignancy
  risk; PMID:20610195). Those figures are the clearest statement of why TDS is treated
  as one entity rather than four coincidences, so they sit on the causal edge they
  quantify. No TDS-level survival or progression data exist, because the syndrome is not
  diagnosed as a unit.

  Scope not covered, recorded so the gaps are deliberate rather than silent. The genetic
  block is thin on purpose: NR5A1, INSL3 and RXFP2 variants and 45,X/46,XY mosaicism are
  curated in the neighbour entries above, and the TGCT risk loci are curated as an
  aggregate rather than one entry per locus, because the claim this entry makes is about
  inherited susceptibility to the cancer component as a whole. Diagnostics are not
  curated: inhibin B, AMH and FSH, and GCNIS immunohistochemistry, are component-level
  tests belonging to the component entries. The one TDS-level diagnostic marker is
  anogenital distance, which has no HPO term (see below) and appears here as a readout on
  the animal models and in the environmental evidence. Treatments are not curated because
  management is component-specific.

  No HPO term for anogenital distance was found. Searched the HPO build behind the
  dismech OAK adapter by label and by text for "anogenital" and for "anogenital
  distance", and neither returned a term. Reduced AGD is therefore represented where it
  functions in the literature, as a readout on the animal-model mechanism links, rather
  than as a phenotype with a coarse or approximate binding.

  The deep-research report flagged two of its own references as off topic
  (PMID:28981654, PMID:36377604). Both were read and neither is cited here; the flag was
  acted on rather than missed.

  No GeneReviews chapter was found for this disease; a PubMed search restricted to
  genereviews[book] for "testicular dysgenesis" returned no records, and
  `just check-genereviews --online` reported NO_CHAPTER, which is expected for a
  non-Mendelian umbrella entity.

  The rodent evidence carries a specific translational caveat that is recorded on the
  DBP model's Leydig link rather than left in prose: phthalate suppression of fetal
  Leydig steroidogenesis is species specific, and grafted human fetal testis showed the
  germ cell change without the steroidogenic suppression. The androgen-programming
  mechanism should not be read as quantitatively transferable to human phthalate
  exposure on the strength of the rat data alone.

  No datasets are curated for this entry; it is an umbrella mechanism rather than a
  cohort-defined disease, and no dataset search was run.

animal_models:
- name: Gestational DBP rat model of TDS
  species: Rat
  category: Chemical anti-androgen exposure model
  background: Wistar
  description: >-
    Pregnant rats exposed to di(n-butyl) phthalate, which suppresses fetal testicular
    testosterone production. The model's decisive feature is window specificity: DBP
    suppresses fetal testosterone equally during and after the masculinisation
    programming window, but only exposure inside the window shortens anogenital distance
    and produces focal testicular dysgenesis and the TDS disorders. It is the model that
    converted TDS from a hypothesis into a testable, and tested, causal claim.
  publication: PMID:28352662
  modeled_mechanisms:
  - target: Deficient Androgen Action in the Masculinization Programming Window
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the core mechanistic claim of TDS: androgen deficiency confined to the
      programming window, and not an equivalent deficiency outside it, generates the
      syndrome.
    readouts:
    - name: Anogenital distance
      target: Deficient Androgen Action in the Masculinization Programming Window
      description: >-
        Ano-genital distance measured in male offspring, used as the read-out of androgen
        action during the programming window.
      direction: DECREASED
      interpretation: >-
        Shortened AGD indicates deficient androgen action inside the window specifically,
        because AGD is programmed there and is unaffected by exposure that begins
        afterwards.
      evidence:
      - reference: PMID:28352662
        reference_title: "Experimentally induced testicular dysgenesis syndrome originates in the masculinization programming window."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "We show that DBP suppresses fetal testosterone equally during and after the MPW, but only DBP exposure in the MPW causes reduced AGD, focal testicular dysgenesis, and TDS disorders (cryptorchidism, hypospadias, reduced adult testis size, and compensated adult Leydig cell failure)."
        explanation: >-
          Shortened AGD and the TDS disorders follow window-confined exposure only,
          although testosterone suppression is equal in both periods. This dissociation
          is what makes AGD a read-out of the window rather than of testosterone.
    limitations: >-
      The window is defined in rat embryonic days; the corresponding human interval is
      extrapolated from rat timings rather than measured.
    evidence:
    - reference: PMID:28352662
      reference_title: "Experimentally induced testicular dysgenesis syndrome originates in the masculinization programming window."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Focal testicular dysgenesis, reduced size of adult male reproductive organs, and TDS disorders and their severity were all strongly associated with reduced AGD."
      explanation: >-
        Ties the dysgenesis and the clinical components together through the AGD read-out
        within one experiment, which is the model's claim on this mechanism node.
  - target: Fetal Leydig Cell Dysfunction
    relationship: PERTURBS
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      DBP is used as the means of suppressing fetal Leydig cell steroidogenesis, so the
      model manipulates this node rather than arising from it spontaneously.
    readouts:
    - name: Intratesticular testosterone
      target: Fetal Leydig Cell Dysfunction
      description: Testosterone measured in the fetal testis during and after the programming window.
      direction: DECREASED
      interpretation: >-
        Reduced intratesticular testosterone confirms the intended Leydig cell
        perturbation. It is a poor predictor of the TDS outcome on its own, because it
        falls just as far under exposure that begins after the programming window and
        produces no syndrome.
      evidence:
      - reference: PMID:26385564
        reference_title: "The mechanism underlying dibutyl phthalate induced shortened anogenital distance and hypospadias in rats."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Contrastingly, testicular development and testosterone secretion were significantly diminished throughout development in the 900mg group."
        explanation: >-
          Direct measurement of suppressed fetal testicular testosterone secretion under
          DBP.
    evidence:
    - reference: PMID:26385564
      reference_title: "The mechanism underlying dibutyl phthalate induced shortened anogenital distance and hypospadias in rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Male offspring of 300mg and 900mg DBP-treated pregnant Wistar rats exhibited shortened average AGD compared with the control group."
      explanation: >-
        Dose-related AGD shortening confirms the perturbation reached the androgen-dependent
        programming endpoint.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: >-
        The link assumes the rat steroidogenic response to phthalate stands in for the
        human one. Grafted human fetal testis tested directly did not suppress
        steroidogenic gene expression, although it did show the germ cell change, and
        mice do not suppress it either. The rat perturbation of this node is real and
        well measured; what is contested is reading it as the human response. Marked
        QUALIFYING rather than INVALIDATING because the germ cell arm did transfer and
        the mechanism remains informative.
      evidence:
      - reference: PMID:22511013
        reference_title: "Human fetal testis xenografts are resistant to phthalate-induced endocrine disruption."
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: "Across a range of doses, human fetal testis xenografts exhibited MNG induction but were resistant to suppression of steroidogenic gene expression."
        explanation: >-
          Direct measurement of the human tissue response, which is what establishes the
          divergence. Classified IN_VITRO rather than MODEL_ORGANISM because the material
          assayed is human fetal testis, grafted into a host only to keep it viable.
    limitations: >-
      Phthalate suppression of fetal Leydig steroidogenesis is species specific. Rats show
      it, mice do not, and grafted human fetal testis does not either, so this link
      supports a mechanism that human tissue has not been shown to share at the
      steroidogenic step.
  - target: Arrested Gonocyte Differentiation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The rat model reproduces the somatic and masculinisation arms of TDS but not the
      germ cell neoplasia arm: GCNIS cells and human-type germ cell cancers have not been
      described in any animal model of TDS. The model does reproduce the focal dysgenetic
      histology seen in the testes of men with GCNIS, so it speaks to the lesion's
      context without reproducing the neoplastic lesion itself.
    limitations: >-
      Likely a species difference in male gonad development. Any inference from this model
      to the cancer component of TDS passes through the shared dysgenetic histology, not
      through a modelled neoplasm, and the latency and post-pubertal proliferation that
      produce human invasive cancer are not represented at all.
    evidence:
    - reference: PMID:18205797
      reference_title: "Testicular dysgenesis syndrome and the origin of carcinoma in situ testis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "CIS cells and germ cell-derived cancers of the human type have so far not been described in any animal model of TDS, which could be caused by species differences in the development of the male gonad."
      explanation: >-
        States the negative claim directly: no animal model of TDS reproduces the
        precursor lesion or the human-type cancer.
    - reference: PMID:28352662
      reference_title: "Experimentally induced testicular dysgenesis syndrome originates in the masculinization programming window."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We show that DBP suppresses fetal testosterone equally during and after the MPW, but only DBP exposure in the MPW causes reduced AGD, focal testicular dysgenesis, and TDS disorders (cryptorchidism, hypospadias, reduced adult testis size, and compensated adult Leydig cell failure)."
      explanation: >-
        The model's full inventory of what it reproduces, and the reason this link is
        negative: the list ends at compensated Leydig cell failure and never reaches a
        germ cell neoplasm. The human-side half of this paper's comparison is cited on
        the Germ Cell Neoplasia In Situ node, where the evidence is human.
  evidence:
  - reference: PMID:28352662
    reference_title: "Experimentally induced testicular dysgenesis syndrome originates in the masculinization programming window."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "If our results are translatable to humans, they suggest that identification of potential causes of human TDS disorders should focus on exposures during a human MPW equivalent, especially if negatively associated with offspring AGD."
    explanation: >-
      The authors' own statement of the model's translational scope, conditional on
      translatability.
- name: Gestational flutamide rat model of androgen receptor blockade
  species: Rat
  category: Androgen receptor antagonist exposure model
  background: Sprague-Dawley and Wistar
  description: >-
    Pregnant rats exposed to flutamide, an androgen receptor antagonist, which blocks
    androgen action at the receptor rather than suppressing its synthesis. This separates
    the receptor-level step from the steroidogenic step: flutamide and DBP both shorten
    anogenital distance and reduce androgen-dependent organ size, but flutamide does so
    without reducing testosterone production. Single-dose dosing on individual gestational
    days further resolves which day programmes which structure.
  publication: PMID:15788718
  modeled_mechanisms:
  - target: Deficient Androgen Action in the Masculinization Programming Window
    relationship: PERTURBS
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Receptor-level blockade isolates androgen action from androgen production as the
      step that the programming window depends on.
    readouts:
    - name: Anogenital distance
      target: Deficient Androgen Action in the Masculinization Programming Window
      description: >-
        Anogenital distance in offspring of flutamide-exposed dams, measured alongside
        androgen-dependent organ weights.
      direction: DECREASED
      interpretation: >-
        Shortening under receptor blockade shows AGD reports androgen action at the
        receptor, not circulating or intratesticular testosterone concentration.
      evidence:
      - reference: PMID:20002220
        reference_title: "Androgen action in the masculinization programming window and development of male reproductive organs."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Both DBP and flutamide exposure in the MPW significantly reduced penis, VP and SV size along with AGD at Pnd25; AGD and organ size were highly correlated."
        explanation: >-
          Flutamide reproduces the AGD and organ-size reduction produced by DBP, placing
          the lesion at androgen action rather than androgen synthesis.
    evidence:
    - reference: PMID:20002220
      reference_title: "Androgen action in the masculinization programming window and development of male reproductive organs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Reduced anogenital distance (AGD) was used as a monitor of androgen production/action during the MPW."
      explanation: >-
        States the design role of AGD as the monitor of androgen action in this model.
  - target: Incomplete Reproductive Tract Masculinization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Gestational receptor blockade produces the under-virilisation phenotypes, with the
      affected structure depending on the gestational day of exposure.
    readouts:
    - name: Hypospadias incidence
      target: Incomplete Reproductive Tract Masculinization
      description: Hypospadias in adult male offspring after a single gestational flutamide dose.
      direction: INCREASED
      interpretation: >-
        Peak incidence at gestational day 17 locates urethral programming within the
        window and shows tissue-selective timing.
      evidence:
      - reference: PMID:15788718
        reference_title: "Changes in androgen-mediated reproductive development in male rat offspring following exposure to a single oral dose of flutamide at different gestational ages."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "The highest incidences for hypospadias (58% pups, 80% litters), vaginal pouch (49% pups, 70% litters), cleft prepuce (29% pups, 60% litters), and missing prostate lobes (12% pups, 60% litters) were noted at GD 17."
        explanation: >-
          Quantifies the under-virilisation malformations and their dependence on the day
          of receptor blockade.
    limitations: >-
      Cryptorchidism was almost absent after single-dose exposure, unlike the
      multiple-dose flutamide and DBP models, so this model under-reproduces the
      testicular descent component.
    evidence:
    - reference: PMID:15788718
      reference_title: "Changes in androgen-mediated reproductive development in male rat offspring following exposure to a single oral dose of flutamide at different gestational ages."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The major discrepancy between this study and previous multiple-dose studies was in the very few numbers of animals presenting with cryptorchidism (only one each on GDs 16 and 17), suggesting that exposure over multiple days may be required to induce this malformation."
      explanation: >-
        Records the model's own stated shortfall on the cryptorchidism component,
        supporting the limitation noted on this link.
  evidence:
  - reference: PMID:15788718
    reference_title: "Changes in androgen-mediated reproductive development in male rat offspring following exposure to a single oral dose of flutamide at different gestational ages."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Thus, a single gestational exposure of flutamide induced numerous reproductive tract malformations consistent with previously reports following multiple exposures, with the timing of the exposure producing marked tissue selectivity in the response noted in adult offspring."
    explanation: >-
      The model's own summary result: one receptor-blocking dose is enough to produce the
      malformations, and which structure is hit depends on when the dose lands.
- name: Rxfp2 D294G missense mouse
  species: Mouse
  category: ENU-induced missense model of INSL3 receptor dysfunction
  genotype: Rxfp2 D294G homozygous and Rxfp2 D294G over null compound heterozygous
  description: >-
    A mouse carrying an ENU-induced missense change in leucine-rich repeat 8 of Rxfp2,
    the INSL3 receptor. The variant leaves total protein near normal but markedly reduces
    cell-surface expression and caps the maximum cAMP response, so it is a partial
    loss-of-function of receptor trafficking rather than a null. Genetic complementation
    against a loss-of-function allele confirmed causality. It isolates the descent arm of
    TDS from the androgen arm, and shows that a descent defect alone brings spermatogenic
    damage with it.
  publication: PMID:20963592

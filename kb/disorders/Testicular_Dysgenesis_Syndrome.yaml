- name: Arrested Gonocyte Differentiation
  description: >-
    Fetal germ cells that fail to complete the transition from gonocyte to spermatogonium
    and retain an embryonic, pluripotency-associated programme. This is the pivotal germ
    cell event of the TDS hypothesis and the step at which the germ cell arm separates
    from the somatic arms.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: primordial germ cell

    showed roughly half-normal AR transcriptional activity, making this a genetic
    counterpart of the androgen signalling deficit that anti-androgens produce
    environmentally. A single family, so this establishes sufficiency of reduced androgen
    signalling in principle rather than a recurrent genetic cause of TDS.

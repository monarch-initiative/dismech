- name: Sertoli Cell Dysfunction
  description: >-
    Malfunction of the Sertoli cells, the nurse cells on which germ cell differentiation
    depends. In the dysgenetic fetal testis Sertoli cells are mislocated outside the
    seminiferous cords; after birth the affected foci develop malformed cords containing
    intratubular Leydig cells, and these persist for life as Sertoli-cell-only tubules.
    Disturbed Sertoli-germ cell signalling is the proposed route by which dysgenesis
    reaches the germ cell lineage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  downstream:

name: Testicular Dysgenesis Syndrome
creation_date: "2026-10-18T23:45:00Z"
description: >-
  Testicular dysgenesis syndrome (TDS) is a proposed developmental entity in which
  maldevelopment of the fetal testis, whatever its primary cause, produces dysfunction
  of the somatic Leydig and Sertoli cells and, through that, a cluster of downstream
  male reproductive disorders: cryptorchidism and hypospadias at birth, and impaired
  spermatogenesis and testicular germ cell cancer in adult life. The unifying lesion is
  deficient androgen production and action during a fetal masculinisation programming
  window (MPW), identified in the rat as embryonic days 15.5 to 18.5 and postulated in
  humans at roughly 8 to 14 weeks of gestation. Anogenital distance (AGD) is programmed
  within that window and so serves as a non-invasive read-out of fetal androgen
  exposure, shortened in both anti-androgen-exposed rodents and phthalate-exposed human
  infants. TDS is a hypothesis about shared origin rather than a conventional clinical
  diagnosis: most affected individuals present with a single component, and the entry is
  curated as the mechanistic umbrella those components share. The strongest causal
  evidence is experimental and rodent; in humans the environmental arm rests on
  exposure-to-AGD associations rather than on a demonstrated full-component phenotype,
  and the genetic arm on isolated families.
category: Complex
synonyms:
- TDS
parents:
- gonadal dysgenesis
- testicular disorder
disease_term:
  preferred_term: testicular dysgenesis syndrome
  term:
    id: MONDO:0005437
    label: testicular dysgenesis syndrome
pathophysiology:
- name: Common Early Disruption of Testis Lineage Specification
  description: >-
    The initiating event of the TDS hypothesis as the rat data actually constrain it: a
    single early, DBP-sensitive disturbance of fetal testis set-up, probably at the level
    of somatic cell lineage specification, which independently produces fetal Leydig cell
    failure, Sertoli cell dysfunction and the focal dysgenetic lesion. Its primary causes
    may be environmental anti-androgens, genetic lesions of androgen signalling, or
    unknown factors. The node is deliberately placed upstream of all three rather than
    making dysgenesis the cause of somatic dysfunction: in the rat, Leydig cell
    impairment is present before dysgenesis is detectable, and the authors who measured
    both read their correlation as a shared origin rather than one causing the other.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: male gonad development
    term:
      id: GO:0008584
      label: male gonad development
  downstream:
  - target: Fetal Leydig Cell Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22253897
      reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Our results point to this occurring because of a common early mechanism, targeted by DBP that determines both dysgenesis and early (during the MPW) fetal Leydig cell dysfunction."
      explanation: >-
        The authors' own causal reading: one early mechanism determines Leydig cell
        dysfunction, which is this edge. The same sentence is what rules out the
        dysgenesis-causes-Leydig-failure ordering.
  - target: Sertoli Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22253897
      reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "it seems likely that a common, DBP-sensitive, mechanism that leads to impaired Leydig cell function (at any fetal age) also leads to dysgenesis, perhaps by affecting an aspect of cell lineage specification, consistent with the abnormal mixture of somatic (Sertoli, Leydig) cells found in some focal dysgenetic areas at e21.5 in DBP-exposed animals."
      explanation: >-
        Names cell lineage specification as the shared mechanism reaching the Sertoli
        compartment. The authors mark it as likely rather than shown, so the
        intermediates are recorded as unknown.
  - target: Focal Testicular Dysgenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22253897
      reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Our results point to this relationship occurring because of a common cause rather than the induction of dysgenesis secondarily causing impaired Leydig cell function."
      explanation: >-
        Establishes dysgenesis as a parallel consequence of the common cause, which is
        this edge and the reason dysgenesis carries no downstream edges of its own.
  evidence:
  - reference: PMID:22253897
    reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "First, the Leydig cell impairment is evident before dysgenesis is apparent."
    explanation: >-
      The temporal argument that forces this ordering: the somatic lesion precedes the
      structural one, so dysgenesis cannot be its cause.
- name: Focal Testicular Dysgenesis
  description: >-
    The structural signature of the early disruption: focal areas in which Leydig cells
    form large aggregates, Sertoli cells sit ectopically outside the seminiferous cords,
    and cords are malformed, with intratubular Leydig cells appearing after birth. It is
    a marker of poor set-up during the programming window rather than a cause of the
    downstream disorders, which is why it carries no downstream edges: it is not even
    detectable until after the window in which the damage is done. The same focal changes
    are found in the testes of men with germ cell neoplasia in situ.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  evidence:
  - reference: PMID:22253897
    reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "DBP-induced focal testicular dysgenesis (Leydig cell aggregation, ectopic Sertoli cells, malformed seminiferous cords) is not evident until after the MPW."
    explanation: >-
      Defines the lesion and establishes that it postdates the window, which is why it is
      modelled as a marker rather than an upstream cause.
  - reference: PMID:22253897
    reference_title: "Inter-relationship between testicular dysgenesis and Leydig cell function in the masculinization programming window in the rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Focal testicular dysgenesis is simply a reflection of poor set-up during this early programming period, even though it is not observed itself until some time later in development."
    explanation: >-
      States the marker reading of dysgenesis directly, in the authors' words.
- name: Fetal Leydig Cell Dysfunction
  description: >-
    Impaired steroidogenic function of the fetal Leydig cells, the proximate consequence
    of testis maldevelopment and the step that limits androgen available to the
    masculinisation programming window. In the dibutyl phthalate rat, intratesticular
    testosterone falls during exposure and recovers if exposure stops at the end of the
    window, which is why a late testosterone measurement can miss the deficit that
    matters.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  biological_processes:
  - preferred_term: androgen biosynthetic process
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  downstream:
  - target: Deficient Androgen Action in the Masculinization Programming Window
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18308057
      reference_title: "Testicular dysgenesis syndrome: mechanistic insights and potential new downstream effects."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Recent advances in understanding from such studies have led to refinement of the TDS hypothesis, highlighting the central role that deficient androgen production/action during fetal testis development, may play in the origin of downstream disorders."
      explanation: >-
        The refined TDS hypothesis places deficient fetal androgen production upstream of
        deficient androgen action, which is this edge.
  - target: Impaired INSL3-RXFP2 Signalling at the Gubernaculum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21147849
      reference_title: "Suppression of insulin-like3 receptor reveals the role of beta-catenin and Notch signaling in gubernaculum development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "The first stage of testicular descent is controlled by insulin like3 hormone (INSL3), produced in testicular Leydig cells."
      explanation: >-
        Places the INSL3 ligand in the fetal Leydig cell, so the cell whose dysfunction
        this edge starts from is the cell that makes the hormone. The quote establishes
        the anatomy of the axis, not that INSL3 output falls when Leydig cells are
        compromised, so the edge is recorded with unknown intermediates.
  evidence:
  - reference: PMID:26385564
    reference_title: "The mechanism underlying dibutyl phthalate induced shortened anogenital distance and hypospadias in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Between E15.5 and E17.5, the 300mg group exhibited delayed testicular development and testosterone secretion."
    explanation: >-
      Shows impaired fetal testicular testosterone secretion within the rat
      masculinisation programming window after an anti-androgenic exposure.
- name: Deficient Androgen Action in the Masculinization Programming Window
  description: >-
    Insufficient androgen receptor signalling in reproductive tract target tissues during
    a discrete fetal window (rat embryonic day 15.5 to 18.5; postulated human equivalent
    around 8 to 14 weeks of gestation). Androgen action inside this window, and not
    during the later period of morphological differentiation, is what programmes
    masculinisation of the whole reproductive tract in the rat. Anogenital distance is set within
    the same window, which is what makes it a read-out of androgen action here rather
    than of androgen levels at any later time.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: androgen receptor signaling pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
  downstream:
  - target: Incomplete Reproductive Tract Masculinization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18340380
      reference_title: "Identification in rats of a programming window for reproductive tract masculinization, disruption of which leads to hypospadias and cryptorchidism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Only within the programming window did blocking androgen action induce hypospadias and cryptorchidism and altered penile length in male rats, all of which correlated with anogenital distance (AGD)."
      explanation: >-
        Blocking androgen action confined to the window produced the masculinisation
        failures, establishing the causal step rather than a correlation between them.
  evidence:
  - reference: PMID:18340380
    reference_title: "Identification in rats of a programming window for reproductive tract masculinization, disruption of which leads to hypospadias and cryptorchidism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We exposed rat fetuses to either anti-androgens or androgens and showed that masculinization of all reproductive tract tissues was programmed by androgen action during a common fetal programming window."
    explanation: >-

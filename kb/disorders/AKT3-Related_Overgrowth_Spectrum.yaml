    biological_scale: CELLULAR
    conforms_to: "pi3k_akt_mtor_cortical_overgrowth#Progenitor Hyperproliferation and Cell-Cycle Dysregulation"
    description: >-
      Excess pathway signalling increases progenitor proliferation and cell growth,

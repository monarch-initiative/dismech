    title: MPPH Syndrome.
    tags:
      - GeneReviews
notes: >-
  Scope. This entry covers gain-of-function AKT3 disease only. Loss of AKT3,
  through 1q43q44 deletions or pure AKT3 deletions, causes microcephaly with
  developmental delay, the opposite growth phenotype, and is out of scope here
  (ClinGen's gene-validity export, kb/genes/ingest/clingen_gene_validity.tsv,
  lists AKT3 as Limited for microcephaly). Germline AKT3 duplications
  produce a phenotype broadly similar to germline activating point variants and
  are included as part of the constitutional arm.

  Relation to other entries. The mosaic arm overlaps the gene-agnostic entries
  Hemimegalencephaly and Focal_Cortical_Dysplasia_Type_II, which model the same
  malformations across PIK3CA, AKT3, MTOR and the mTOR repressors. This entry
  carries what is specific to AKT3: the germline/mosaic dichotomy, the hotspots,
  and the endocrine and cutaneous features. The GeneReviews chapter MPPH Syndrome
  (PMID:27854409) is the phenotype baseline; its frequencies are pooled across
  AKT3, CCND2 and PIK3R2, so they are cited as MPPH-wide figures and not as
  AKT3-specific ones.

  Gene-disease validity. The ClinGen gene-validity export
  (kb/genes/ingest/clingen_gene_validity.tsv) lists AKT3 as Definitive (AD) for the
  broader concept "overgrowth syndrome and/or cerebral malformations due to
  abnormalities in MTOR pathway genes" (MONDO:0100283). That is a lumped disease,
  not this entry's MONDO term or an exactMatch of it, so no
  gene_disease_validity assertion is recorded.

  Mosaic fraction. Reported AKT3 allele fractions in resected brain are low and
  regionally variable (about 35% of cells carried p.E17K in the first case, and
  hotspot variant allele fractions in a ddPCR series ranged down to 0.14%), which
  is why blood testing misses the somatic arm.

  Medulloblastoma. GeneReviews recommends posterior-fossa imaging to look for
  medulloblastoma in MPPH, but that recommendation is pooled across AKT3, CCND2
  and PIK3R2. None of the AKT3 sources cited in this entry reports
  medulloblastoma, so it is not recorded as a phenotype here.
inheritance:
  - name: Autosomal dominant, usually de novo
    description: >-
      The constitutional arm (MPPH2) is autosomal dominant. Almost all cases are
      de novo. Recurrence in siblings has been explained by parental germline
      mosaicism, including one family with a recurrent p.R465W variant absent from
      maternal blood.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MPPH syndrome is an autosomal dominant disorder typically caused by a de
          novo pathogenic variant.
        explanation: >-
          GeneReviews states the inheritance mode and the predominance of de novo
          variants for MPPH, of which MPPH2 is the AKT3 form.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Each child of an individual with a germline AKT3, CCND2, or PIK3R2 pathogenic variant has a 50% chance of inheriting the pathogenic variant.
        explanation: >-
          GeneReviews genetic-counseling statement of the 50% transmission risk for a germline (constitutional-arm) variant.
      - reference: PMID:32446860
        reference_title: "Maternal mosaicism underlies the inheritance of a rare germline AKT3 variant which is responsible for megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome in two Roma half-siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          this is the first report in which maternal germline mosaicism of a rare
          pathogenic AKT3 variant leads to autosomal dominantly inherited MPPH
          syndrome
        explanation: >-
          Documents parental germline mosaicism as the explanation for sibling
          recurrence of AKT3-related MPPH.
  - name: Somatic mosaicism (hemimegalencephaly and focal cortical dysplasia arm)
    description: >-
      The asymmetric malformations are caused by post-zygotic variants that arise
      in a cortical progenitor and are absent from blood. This arm is not
      inherited.
    inheritance_term:
      preferred_term: Somatic mosaicism
      term:
        id: HP:0001442
        label: Typified by somatic mosaicism
    evidence:
      - reference: PMID:22500628
        reference_title: "Somatic activation of AKT3 causes hemispheric developmental brain malformations."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A third case showed a known activating mutation in AKT3
        explanation: >-
          The founding report of somatic AKT3 activation in hemimegalencephaly
          resected brain.
      - reference: PMID:22500628
        reference_title: "Somatic activation of AKT3 causes hemispheric developmental brain malformations."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          this mutation was not detectable in DNA derived from the patient's
          leukocytes
        explanation: >-
          The paired brain-blood comparison establishes that the AKT3 p.E17K
          variant is post-zygotic and brain-restricted.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The risk for transmission to offspring of an individual with somatic mosaicism for an MPPH-related pathogenic variant is expected to be less than 50%.
        explanation: >-
          GeneReviews genetic-counseling statement that transmission risk from a somatically mosaic individual is below the 50% germline risk.
pathophysiology:
  - name: AKT3 Gain-of-Function Variant
    biological_scale: MOLECULAR
    description: >-
      A heterozygous activating AKT3 variant, either constitutional (de novo or
      inherited from a mosaic parent) or post-zygotic. All tested variants raise
      AKT3 kinase activity; variants in the pleckstrin homology (PH) domain, such
      as p.E17K, additionally increase binding to membrane phosphoinositides, the
      step that recruits AKT to the membrane for activation. Strongly activating
      variants tend to be tolerated only as low-level mosaics and produce focal
      malformations, while milder constitutional variants produce diffuse
      megalencephaly.
    genes:
      - preferred_term: AKT3
        term:
          id: hgnc:393
          label: AKT3
    molecular_functions:
      - preferred_term: AKT3 kinase activity
        term:
          id: GO:0004674
          label: protein serine/threonine kinase activity
        modifier: INCREASED
      - preferred_term: PH-domain phosphoinositide binding
        term:
          id: GO:0035091
          label: phosphatidylinositol binding
        modifier: INCREASED
    evidence:
      - reference: PMID:28969385
        reference_title: "Mutations of AKT3 are associated with a wide spectrum of developmental disorders including extreme megalencephaly."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          All mutations increased kinase activity, and pleckstrin homology domain
          mutants exhibited enhanced phospholipid binding.
        explanation: >-
          Ex vivo kinase and lipid-binding assays on patient variants establish the
          gain-of-function mechanism and the PH-domain lipid-binding effect.
      - reference: PMID:25523067
        reference_title: "Germline activating AKT3 mutation associated with megalencephaly, polymicrogyria, epilepsy and hypoglycemia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          A novel, de novo AKT3 missense variant (exon 5; c.548T>A, p.(V183D)) was
          identified and shown to activate AKT3 by in vitro functional testing.
        explanation: >-
          Independent functional confirmation that a constitutional AKT3 variant
          activates the kinase.
      - reference: PMID:31441589
        reference_title: "Megalencephaly syndromes associated with mutations of core components of the PI3K-AKT-MTOR pathway: PIK3CA, PIK3R2, AKT3, and MTOR."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          strongly activating variants (that are usually very low-level mosaic) are
          associated with focal brain malformations including hemimegalencephaly
          and focal cortical dysplasia
        explanation: >-
          Review synthesis linking variant strength and mosaic level to the focal
          end of the spectrum.
      - reference: PMID:31441589
        reference_title: "Megalencephaly syndromes associated with mutations of core components of the PI3K-AKT-MTOR pathway: PIK3CA, PIK3R2, AKT3, and MTOR."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          mildly activating variants (that are typically constitutional or
          germline) are associated with diffuse megalencephaly with intellectual
          disability and/or autism spectrum disorder
        explanation: >-
          Review synthesis linking milder constitutional variants to the diffuse
          end of the spectrum.
    downstream:
      - target: PI3K-AKT-mTOR Pathway Hyperactivation in Cortical Progenitors
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:40057591
            reference_title: "Functional verification and allele-specific silencing of a novel AKT3 variant that causes megalencephaly, polymicrogyria and intractable epilepsy."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              observed a significant increase of phospho-S6, a marker of mTOR
              complex 1 (mTORC1) activity, in AKT3Q78R transfected cells
            explanation: >-
              A patient AKT3 variant raises mTORC1 output in cells, linking the
              variant to downstream pathway activation.
  - name: PI3K-AKT-mTOR Pathway Hyperactivation in Cortical Progenitors
    biological_scale: CELLULAR
    conforms_to: "pi3k_akt_mtor_cortical_overgrowth#PI3K-AKT-mTOR Pathway Hyperactivation in Neural Progenitors"
    description: >-
      AKT3 is the most abundant AKT paralog in the developing cortex, and
      phosphorylated AKT is concentrated in dividing radial glial progenitors of the
      ventricular zone. Activated AKT3 increases signalling through mTORC1, seen in
      patient brain as increased phosphorylation of ribosomal protein S6. Because
      the progenitors give rise to both neurons and glia, a variant arising in them
      is inherited by the cortical lineages they produce.
    genes:

        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          two out of eight HMG samples showed trisomy of chromosome 1q, which
          encompasses many genes, including AKT3, a gene known to regulate brain
          size
        explanation: >-
          Mosaic 1q gains spanning AKT3 in hemimegalencephaly brain.
      - reference: PMID:22729223
        reference_title: "De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway cause hemimegalencephaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          identified de novo somatic mutations in 30% of affected individuals in
          the PIK3CA, AKT3 and MTOR genes
        explanation: >-
          Somatic AKT3 variants among the causes of hemimegalencephaly in paired
          brain-blood sequencing.
      - reference: PMID:42044617
        reference_title: "Phenotype and genotype of AKT3-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The somatic variant E17K and the germline variant R465W exhibited as
          mutational hotspots.
        explanation: >-
          Identifies E17K as the somatic hotspot.
treatments:
  - name: Hemispherectomy or Focal Resection
    description: >-
      Removal or disconnection of the malformed hemisphere, or resection of a focal
      dysplasia, is the standard treatment for the drug-resistant epilepsy of the
      mosaic arm. In the founding AKT3 cases it substantially reduced or stopped
      seizures. Resected tissue
      is also what allows a molecular diagnosis of the somatic arm.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: epilepsy surgery
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Epileptogenic Cortex
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:22500628
        reference_title: "Somatic activation of AKT3 causes hemispheric developmental brain malformations."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          severe, intractable epilepsy often necessitating surgical removal or
          disconnection of the abnormal hemisphere for seizure control
        explanation: >-
          States the role of hemispheric surgery in hemimegalencephaly.
      - reference: PMID:22500628
        reference_title: "Somatic activation of AKT3 causes hemispheric developmental brain malformations."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Following surgery, he had two periods of breakthrough seizures but has
          been seizure-free for 6 years at 10 years of age.
        explanation: >-
          Outcome after hemispherectomy in the AKT3 p.E17K patient.
  - name: Antiseizure Medication
    description: >-
      Started first, but seizures in this spectrum are frequently refractory to
      polytherapy, especially in the mosaic arm.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Seizure
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42044617
        reference_title: "Phenotype and genotype of AKT3-related disorders."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among patients with somatic variants, early-onset seizures were observed
          in 96.4%, with drug resistance epilepsy reported in 96.1%.
        explanation: >-
          Graded REFUTE against the INHIBITS-seizure link: in the mosaic arm
          medication almost always fails to control seizures, which is why it is
          a bridge to surgery rather than the definitive treatment.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: OTHER
        snippet: >-
          Oromotor difficulties, epilepsy, developmental delays, intellectual disability, polydactyly, vision issues, cardiac anomalies, thyroid abnormalities, and renal anomalies are treated as per usual clinical care standards.
        explanation: >-
          GeneReviews recommends standard epilepsy care in MPPH, of which
          antiseizure medication is the first line. It is graded INDIRECT
          because the quote names standard care, not a specific drug. Together
          with the REFUTE item above, it shows that medication is the first
          treatment and that it often fails in the mosaic arm.
  - name: Ketogenic Diet
    description: >-
      In one patient with a germline activating AKT3 variant, infantile spasms
      responded to a ketogenic diet, which also has to be adjusted for the
      hypoglycemia some patients have. Evidence is a single case.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: ketogenic diet
      term:
        id: NCIT:C15447
        label: Dietary Intervention
    target_mechanisms:
      - target: Infantile spasms
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:25523067
        reference_title: "Germline activating AKT3 mutation associated with megalencephaly, polymicrogyria, epilepsy and hypoglycemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The infantile spasms responded to the introduction of a ketogenic diet,
          but the hypoglycemia recurred until the diet was adjusted for increased
          resting energy expenditure.
        explanation: >-
          Single-case response of infantile spasms to ketogenic diet, with the
          hypoglycemia caveat.
  - name: Hydrocephalus Shunting
    description: >-
      Hydrocephalus in MPPH warrants early neurosurgical intervention, with serial
      brain MRI in early childhood to detect hydrocephalus and cerebellar tonsillar
      ectopia.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: ventriculoperitoneal shunt placement
      term:
        id: NCIT:C168483
        label: Ventriculoperitoneal Shunt Placement
    target_mechanisms:
      - target: Hydrocephalus
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Hydrocephalus warrants early neurosurgical intervention.
        explanation: >-
          GeneReviews management recommendation for MPPH.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Brain MRI to detect hydrocephalus and/or cerebellar tonsillar ectopia is provisionally recommended every six months from birth to age two years, and yearly from age two to six years.
        explanation: >-
          GeneReviews surveillance recommendation supporting the serial early-childhood brain MRI described for this treatment.
  - name: PI3K-AKT-mTOR Pathway Inhibition (Investigational)
    description: >-
      Blocking the pathway downstream of AKT3 is the rational precision therapy
      and restored neuronal migration in a mouse model, and allele-specific siRNA
      against a patient variant suppressed mTORC1 activity in cells. No clinical
      efficacy data specific to AKT3 disease were found; this is recorded as a
      preclinical rationale, not as practice.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: PI3K-AKT-mTOR Pathway Hyperactivation in Cortical Progenitors
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:26523971
        reference_title: "An AKT3-FOXG1-reelin network underlies defective migration in human focal malformations of cortical development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Treatments aimed at either blocking downstream AKT signaling or
          inactivating reelin restored migration.
        explanation: >-
          Preclinical rescue by blocking signalling downstream of AKT3.
      - reference: PMID:40057591
        reference_title: "Functional verification and allele-specific silencing of a novel AKT3 variant that causes megalencephaly, polymicrogyria and intractable epilepsy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the siRNA we identified specifically suppressed the AKT3Q78R-mediated
          mTORC1 activity
        explanation: >-
          Allele-specific silencing of a patient AKT3 variant reduces mTORC1
          activity in cells.
diagnosis:
  - name: Brain MRI
    description: >-
      Shows megalencephaly with bilateral polymicrogyria, heterotopia or
      ventriculomegaly in the constitutional arm, and hemimegalencephaly or focal
      cortical dysplasia in the mosaic arm.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    evidence:
      - reference: PMID:42044617
        reference_title: "Phenotype and genotype of AKT3-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cranial MRI findings were heterogeneous, with megalencephaly accompanied
          by polymicrogyria representing the most common pattern
        explanation: >-
          Describes the MRI patterns in the germline arm.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The clinical diagnosis of MPPH syndrome can be established in individuals with the two core features: megalencephaly and polymicrogyria (PMG).
        explanation: >-
          GeneReviews diagnostic criterion: the two core features are imaging findings, so brain MRI establishes the clinical diagnosis of the constitutional arm.
  - name: Genetic testing of blood and affected tissue
    description: >-
      Germline variants are found in blood. Mosaic variants are often detectable
      only in affected brain or skin, at low allele fractions, so sensitive methods
      such as deep sequencing or droplet digital PCR of resected tissue are needed
      and a negative blood test does not exclude the mosaic arm.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    evidence:
      - reference: PMID:35355055
        reference_title: "Profiling PI3K-AKT-MTOR variants in focal brain malformations reveals new insights for diagnostic care."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Variant allele fractions ranged from 0.14 to 22.67% across all
          mutation-positive samples.
        explanation: >-
          A ddPCR hotspot panel that includes AKT3 p.E17K detected mosaic variants
          in resected tissue at very low allele fractions, which is why tissue
          testing with sensitive methods is needed.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The molecular diagnosis of MPPH syndrome is established in a proband with some of the suggestive clinical and imaging features by identification of a heterozygous pathogenic variant in one of three genes: AKT3, CCND2, or PIK3R2.
        explanation: >-
          GeneReviews molecular diagnostic criterion, naming AKT3 among the three genes.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          some have a somatic mosaic pathogenic variant (most commonly reported in PIK3R2 or AKT3).
        explanation: >-
          GeneReviews notes that some MPPH probands are somatic mosaics, most often for AKT3 or PIK3R2, which is why a negative blood test does not exclude AKT3 disease.
animal_models:
  - name: Akt3 Nmf350 mouse
    species: Mouse
    genotype: Akt3 Nmf350 (dominant kinase-domain missense, ENU-induced)
    publication: PMID:21159799
    description: >-
      A dominant activating Akt3 allele from a mutagenesis screen, with brain
      enlargement, hippocampal neuronal ectopia, and a low seizure threshold.
    modeled_mechanisms:
      - target: Epileptogenic Cortex
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        limitations: >-
          The lesion is hippocampal ectopia rather than the cortical polymicrogyria
          or hemispheric dysplasia of human disease, and the allele is a
          kinase-domain variant not reported in patients.
        evidence:
          - reference: PMID:21159799
            reference_title: "A novel Akt3 mutation associated with enhanced kinase activity and seizure susceptibility in mice."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              a novel, dominant mouse mutation, Nmf350, caused low seizure
              threshold, sporadic tonic-clonic seizures, brain enlargement
            explanation: >-
              The activating allele (higher kinase activity in vitro) lowers seizure
              threshold and causes spontaneous seizures with brain enlargement.
  - name: Akt3 null mouse
    species: Mouse
    genotype: Akt3 -/-
    publication: PMID:15713641
    description: >-
      Loss-of-function mirror of the human disease: brains are about 20% smaller
      with fewer and smaller cells and reduced mTOR signalling, other organs
      normal. It models AKT3's role in brain size, not the overgrowth phenotype.
    modeled_mechanisms:
      - target: Progenitor Overproliferation and Neuronal Overgrowth
        relationship: PERTURBS
        fidelity: LOW
        limitations: >-
          Opposite direction of effect to the human gain-of-function disease;
          informative about AKT3's role in brain growth, not a disease model.
        evidence:
          - reference: PMID:15713641
            reference_title: "Role for Akt3/protein kinase Bgamma in attainment of normal brain size."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Akt3-/- mice present a selective 20% decrease in brain size
            explanation: >-
              Shows AKT3 is required for normal brain size.
experimental_models:
  - name: AKT3-mutant human cortical organoids
    experimental_model_type: ORGANOID
    description: >-
      Human embryonic stem cell lines engineered to carry AKT3 activating variants,
      grown as cortical organoids with mosaic or uniform variant expression.
    publication: PMID:38759814
    modeled_mechanisms:
      - target: Progenitor Overproliferation and Neuronal Overgrowth
        relationship: RECAPITULATES
        fidelity: MODERATE
        limitations: >-
          Organoids lack vasculature and whole-hemisphere architecture, so they
          cannot show megalencephaly or hemispheric overgrowth.
        evidence:
          - reference: PMID:38759814
            reference_title: "A spectrum of AKT3 activating mutations cause focal malformations of cortical development (FMCDs) in cortical organoids."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              Mosaic and somatic expression of AKT3 activating mutations in cortical
              organoids mimicking the disease presentation with overproliferation
              and the formation of dysmorphic neurons.
            explanation: >-
              The organoids reproduce overproliferation and dysmorphic neurons.
discussions:
  - discussion_id: akt3_targeted_therapy_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Do PI3K, AKT or mTOR inhibitors change seizures or development in
      AKT3-related disease, and does the answer differ between the constitutional
      and mosaic arms?
    attaches_to:
      - pathophysiology#PI3K-AKT-mTOR Pathway Hyperactivation in Cortical Progenitors
      - treatments#PI3K-AKT-mTOR Pathway Inhibition (Investigational)
    rationale: >-
      Preclinical work shows that blocking signalling downstream of AKT3 restores
      neuronal migration in mice and that allele-specific siRNA lowers mTORC1
      output in cells, and the largest clinical series names pathway inhibitors as
      the obvious trial target. No AKT3-specific clinical efficacy data were found.
      The two arms pose different questions: the constitutional arm has diffuse,
      lifelong pathway activation where a systemic drug could act on every cell,
      while in the mosaic arm the malformation is fixed before birth and surgery
      already controls seizures in most cases.

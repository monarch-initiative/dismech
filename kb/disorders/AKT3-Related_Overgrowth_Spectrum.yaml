      - reference: PMID:22729223
        reference_title: "De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway cause hemimegalencephaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          associated with increased neuronal S6 protein phosphorylation in the
          brains of affected individuals, indicating aberrant activation of
          mammalian target of rapamycin (mTOR) signaling
        explanation: >-
          Shows mTOR pathway activation in brain tissue carrying somatic
          PI3K-AKT3-mTOR variants, AKT3 among them.
      - reference: PMID:26523971
        reference_title: "An AKT3-FOXG1-reelin network underlies defective migration in human focal malformations of cortical development."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Within human FMCD-affected brain, we found that cells showing activation
          of the PI3K-AKT-mTOR pathway were enriched for the AKT3(E17K) mutation.
        explanation: >-
          Ties pathway activation at the cellular level to the cells carrying the
          AKT3 variant in patient cortex.
    downstream:
      - target: Progenitor Overproliferation and Neuronal Overgrowth
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:38759814
            reference_title: "A spectrum of AKT3 activating mutations cause focal malformations of cortical development (FMCDs) in cortical organoids."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              Mosaic and somatic expression of AKT3 activating mutations in cortical
              organoids mimicking the disease presentation with overproliferation
              and the formation of dysmorphic neurons.
            explanation: >-
              In engineered human cortical organoids, AKT3 activating variants

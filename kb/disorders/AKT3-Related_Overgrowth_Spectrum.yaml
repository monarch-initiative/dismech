        explanation: >-
          Identifies R465W as the germline hotspot.
      - reference: PMID:42044617
        reference_title: "Phenotype and genotype of AKT3-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients with germline AKT3 duplications exhibited phenotypes broadly
          similar to those with germline SNVs.
        explanation: >-
          Supports including germline duplications in the constitutional arm.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          identification of a heterozygous pathogenic variant in one of three
          genes: AKT3, CCND2, or PIK3R2
        explanation: >-
          GeneReviews names AKT3 as one of the three MPPH genes.
  - name: AKT3 (somatic mosaic)
    subtype: Mosaic AKT3 Cortical Dysplasia
    gene_term:
      preferred_term: AKT3
      term:
        id: hgnc:393
        label: AKT3
    relationship_type: CAUSATIVE
    variant_origin: SOMATIC
    association: >-
      Post-zygotic activating AKT3 variants, most often p.E17K in the PH domain,
      or mosaic gains of 1q spanning AKT3, confined to brain cause
      hemimegalencephaly and focal cortical dysplasia; skin-restricted or
      broader mosaic variants cause capillary malformation with segmental growth
      differences.
    evidence:
      - reference: PMID:22500628

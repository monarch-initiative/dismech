has_subtypes:
  - name: MPPH2
    display_name: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
    description: >-
      The constitutional arm. A heterozygous activating AKT3 variant present in
      every cell, almost always de novo, causes diffuse bilateral megalencephaly
      with variable bilateral cortical malformation (polymicrogyria, periventricular
      nodular heterotopia) or megalencephaly without visible cortical dysplasia.
      The germline variant p.R465W is a recurrent hotspot.
    subtype_term:
      preferred_term: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
      term:
        id: MONDO:0014407
        label: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
    genes:
      - preferred_term: AKT3
        term:
          id: hgnc:393
          label: AKT3
    evidence:
      - reference: PMID:28969385
        reference_title: "Mutations of AKT3 are associated with a wide spectrum of developmental disorders including extreme megalencephaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          patients with constitutional AKT3 mutations exhibiting more variable
          phenotypes including bilateral cortical malformations, polymicrogyria,
          periventricular nodular heterotopia and diffuse megalencephaly without
          cortical dysplasia
        explanation: >-
          Defines the constitutional group of the spectrum and its bilateral,
          diffuse brain phenotype.
  - name: Mosaic AKT3 Cortical Dysplasia
    display_name: Mosaic AKT3 hemimegalencephaly and focal cortical dysplasia
    description: >-
      The somatic arm. A post-zygotic activating AKT3 variant, most commonly
      p.E17K, or a mosaic 1q gain spanning AKT3, confined to part of the brain
      causes hemimegalencephaly or focal cortical dysplasia with early-onset,
      drug-resistant epilepsy. MONDO has no separate AKT3-specific term for this
      arm; the gene-agnostic malformations are curated as Hemimegalencephaly and
      Focal Cortical Dysplasia Type II.
    genes:
      - preferred_term: AKT3
        term:
          id: hgnc:393
          label: AKT3
    evidence:
      - reference: PMID:28969385
        reference_title: "Mutations of AKT3 are associated with a wide spectrum of developmental disorders including extreme megalencephaly."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          broadly segregates individuals with AKT3 mutations into two groups:
          patients with highly asymmetric cortical dysplasia caused by the common
          p.E17K mutation
        explanation: >-
          Defines the mosaic group of the spectrum and its asymmetric brain
          phenotype.
      - reference: PMID:42044617
        reference_title: "Phenotype and genotype of AKT3-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain MRI abnormalities were detected in 96.4% of cases, most commonly
          focal cortical dysplasia and hemimegalencephaly.
        explanation: >-
          In a 74-patient literature series, the somatic-variant group showed
          focal cortical dysplasia and hemimegalencephaly as the dominant lesions.
references:

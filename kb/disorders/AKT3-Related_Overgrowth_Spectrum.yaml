      - target: Reelin Misexpression and Non-Cell-Autonomous Migration Defect
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:26523971
            reference_title: "An AKT3-FOXG1-reelin network underlies defective migration in human focal malformations of cortical development."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Mutation-expressing neural progenitors showed misexpression of
              reelin, which led to a non-cell autonomous migration defect in

          MCAP/MPPH-overlap megalencephaly.
      - reference: PMID:22729224
        reference_title: "De novo germline and postzygotic mutations in AKT3, PIK3R2 and PIK3CA cause a spectrum of related megalencephaly syndromes."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          which supports mutations in AKT3 as a rare cause of megalencephaly
        explanation: >-

  - name: Increased Glucose Utilization
    biological_scale: ORGANISM
    description: >-
      Proposed mechanism for the hypoinsulinaemic, hypoketotic hypoglycemia seen in
      a few constitutional cases: systemic AKT3 activation increases glucose uptake
      and use. This is the reporting authors' hypothesis and has not been tested
      directly.
    evidence:
      - reference: PMID:25523067
        reference_title: "Germline activating AKT3 mutation associated with megalencephaly, polymicrogyria, epilepsy and hypoglycemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We hypothesize that the sustained hypoglycemia in this patient is caused
          by increased glucose utilization due to activation of AKT3 signaling.
        explanation: >-
          States the proposed mechanism; it is a hypothesis from a single case.
    downstream:
      - target: Hypoglycemia
phenotypes:
  - name: Megalencephaly
    category: Neurological
    frequency: VERY_FREQUENT
    phenotype_term:
      preferred_term: Megalencephaly
      term:
        id: HP:0001355
        label: Megalencephaly
    description: >-
      Brain overgrowth, diffuse in the constitutional arm and often asymmetric in
      the mosaic arm. In a 61-patient literature series of AKT3 point variants
      (19 somatic, 42 germline), 81.9% had megalencephaly, including 14 of 16
      with mosaic p.E17K.
    evidence:
      - reference: PMID:40032969
        reference_title: "The phenotypic and genetic spectrum of AKT3-related neurodevelopmental condition."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          p.E17K | 16 (10, 6) | 14/16 | 6/16
        explanation: >-
          Table 2 row for the somatic p.E17K group: megalencephaly in 14/16 and
          polymicrogyria in 6/16, so the feature is not confined to the
          constitutional arm.
      - reference: PMID:40032969
        reference_title: "The phenotypic and genetic spectrum of AKT3-related neurodevelopmental condition."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Approximately 77% (47/61) of the patients experienced macrocephaly, and
          81.9% (50/61) had megalencephaly.
        explanation: >-
          Gives the megalencephaly frequency in AKT3 point-variant patients.
      - reference: PMID:27854409
        reference_title: "MPPH Syndrome."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          MPPH (megalencephaly-postaxial polydactyly-polymicrogyria-hydrocephalus)
          syndrome is a developmental brain disorder characterized by
          megalencephaly (brain overgrowth) with the cortical malformation
          bilateral perisylvian polymicrogyria (BPP).
        explanation: >-
          GeneReviews baseline: megalencephaly is a core feature of MPPH.

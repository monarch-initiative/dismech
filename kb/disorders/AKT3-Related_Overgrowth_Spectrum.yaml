  - name: Reelin Misexpression and Non-Cell-Autonomous Migration Defect
    biological_scale: CELLULAR
    conforms_to: "pi3k_akt_mtor_cortical_overgrowth#Impaired Neuronal Migration and Cortical Lamination"

name: AKT3-Related Overgrowth Spectrum
creation_date: "2026-10-15T00:00:00Z"
category: Genetic
description: >-
  A spectrum of brain overgrowth and cortical malformation disorders caused by
  activating variants in AKT3, the brain-predominant isoform of the AKT
  serine/threonine kinase in the PI3K-AKT-mTOR growth pathway. What a patient has
  depends mostly on when and where the variant arose. A constitutional variant,
  usually de novo and present in every cell, causes diffuse bilateral
  megalencephaly, often with polymicrogyria, ventriculomegaly or hydrocephalus,
  and sometimes postaxial polydactyly; this is
  megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2 (MPPH2). A post-zygotic variant confined
  to a clone of cortical progenitors, most often the recurrent p.E17K, causes a
  highly asymmetric malformation, hemimegalencephaly or focal cortical
  dysplasia, that presents with early drug-resistant epilepsy. A few mosaic
  patients have a faint capillary malformation of the skin with or without
  segmental over- or undergrowth. Developmental delay or intellectual disability
  is common across the spectrum, and some constitutional cases have endocrine
  features such as hypoglycemia or hypothyroidism.
parents:
  - Overgrowth Syndrome
  - Malformation of Cortical Development
synonyms:
  - AKT3-related megalencephaly
  - AKT3-related disorder
  - AKT3-related neurodevelopmental condition
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        Presents and is managed as a developmental brain malformation with
        epilepsy and neurodevelopmental impairment.

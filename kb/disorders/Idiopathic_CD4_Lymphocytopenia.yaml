discussions:
- discussion_id: icl_no_unifying_upstream_mechanism
  kind: KNOWLEDGE_GAP
  prompt: What depletes the CD4 compartment in the patients who have no monogenic cause?
  status: OPEN
  attaches_to:
  - pathophysiology#Persistent CD4-Positive T Cell Depletion
  - mechanistic_hypotheses#icl_autoantibody_mediated_depletion
  - mechanistic_hypotheses#icl_accelerated_apoptosis
  - mechanistic_hypotheses#icl_cxcr4_trafficking_defect
  - mechanistic_hypotheses#icl_impaired_il7_homeostasis
  rationale: >-
    This is the central gap, and it is why the upstream nodes of this entry are all
    provisional. Four mechanisms have support in patient material, and none has been
    shown to account for the syndrome: accelerated Fas-mediated apoptosis in seven of
    eight patients in one series, defective surface CXCR4 in six of six in another,
    cytolytic anti-CD4 antibodies in half of a 72-patient cohort, and a blunted
    interleukin-7 homeostatic response. They are not mutually exclusive and may
    describe different patients, which is the reading the humanised-mouse subgroup
    result supports. The open question is whether the syndrome partitions into
    mechanism-defined groups that could be identified before treatment, since the
    treatments that follow from these accounts differ: an antibody-driven group would
    want B cell depletion, an intrinsic-proliferation group cytokine support.
  proposed_experiments:
  - experiment_id: icl_mechanism_stratification
    name: Mechanism stratification of an unexplained ICL cohort
    experiment_design: HUMAN_OBSERVATIONAL
    description: >-
      Assay each of the four candidate mechanisms in the same patients, so that the
      question of whether they mark different groups is answered within one cohort
      rather than across four series from different decades. In a prospectively
      enrolled cohort of patients meeting the case definition with no monogenic cause
      on genome sequencing, measure in parallel: anti-CD4 cell antibodies and
      complement deposition by flow cytometry, spontaneous and Fas-induced apoptosis
      of sorted CD4 T cells, surface and intracellular CXCR4 with CXCL12 chemotaxis,
      and serum interleukin 7 against the CD4 count. Transfer mononuclear cells from
      each patient into lymphocyte-free mice to score expansion. Then test whether the
      assays cluster the patients, and whether the clusters predict which patients
      expand in the xenograft.
    readouts:
    - name: Anti-CD4 cell antibody titre and complement deposition
      target: pathophysiology#Anti-CD4 T Cell Autoantibody-Mediated Lymphocyte Destruction
      interpretation: >-
        Separates the patients in whom an extrinsic humoral mechanism is operating
        from those in whom it is not.
    - name: Spontaneous and Fas-induced CD4 T cell apoptosis
      target: pathophysiology#Accelerated Fas-Mediated CD4 T Cell Apoptosis
      interpretation: Scores the apoptotic mechanism in the same patients.
    - name: Surface CXCR4 and CXCL12-directed chemotaxis
      target: pathophysiology#Defective Surface CXCR4 Expression on CD4 T Cells
      interpretation: Scores the trafficking mechanism in the same patients.
    - name: Serum interleukin 7 against CD4 count
      target: pathophysiology#Blunted Interleukin-7 Homeostatic Response
      interpretation: Scores the homeostatic mechanism in the same patients.
    would_support:
    - pathophysiology#Persistent CD4-Positive T Cell Depletion
    supporting_outcome:
    - >-
      The assays cluster patients into groups, each dominated by one mechanism, and
      membership predicts whether the patient's cells expand in a lymphocyte-free
      host.
    refuting_outcome:
    - >-
      The assays are abnormal in overlapping and uninformative combinations, or are
      normal in most patients, leaving the depletion unaccounted for.
- discussion_id: icl_unc119_gene_assignment
  kind: CONTROVERSY
  prompt: Should UNC119 continue to be recorded as the gene for this disease concept?
  status: OPEN
  attaches_to:
  - genetic#UNC119
  - mechanistic_hypotheses#icl_unc119_lck_trafficking
  rationale: >-
    OMIM 615518 assigns this entity to UNC119 and MONDO:0014226 merges that gene
    entry into the clinical syndrome, so every consumer of either resource inherits
    the assignment. The evidence for it is one proband from 2012 with in vitro
    functional work, no reported second patient in the thirteen years since, and an
    allele ClinVar classifies Benign/Likely benign with multiple submitters and no
    conflicts. Against that, the UNC119A-to-LCK trafficking mechanism is real and
    independently established in primary human T cells, so the pathway is a reasonable
    candidate for the syndrome even though this allele is not a Mendelian cause. This
    entry records the gene as DISPUTED, which is the schema's grade for an
    unreplicated claim, and keeps the pathway as a hypothesis. Resolving it means
    either a second patient with a damaging UNC119 allele and a demonstrated effect at
    endogenous expression, or a formal gene-disease validity classification; neither
    exists yet. The practical consequence of leaving it unresolved is that an
    incidental p.Gly22Val finding may be reported as causal.
  posed_by: "dismech curation (issue #10666)"
  posed_date: "2026-11-17T00:00:00Z"

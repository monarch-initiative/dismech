    explanation: The test and the lineages measured in the largest cohort.
- name: Exclusion of HIV, HTLV and other causes of CD4 depletion
  description: >-
    The diagnosis exists only after exclusion. HIV-1, HIV-2 and HTLV infection must
    be ruled out, as must any other defined immunodeficiency, lymphodepleting therapy
    or disease associated with low CD4 counts. In the NIH series this step removed 17
    of 108 enrolled patients, including five with an alternative diagnosis. No NCIT
    clinical-action term covers this composite exclusion workup, so no term is bound.
  evidence:
  - reference: PMID:24646462
    reference_title: "Idiopathic CD4 lymphocytopenia: clinical and immunologic characteristics and follow-up of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      no evidence of infection with human immunodeficiency virus (HIV)-1/2 or human
      T-cell lymphotropic 1/2 (HTLV-1/2); and lack of a defined immunodeficiency
      disease or therapy associated with depressed levels of CD4 T cells
    explanation: The exclusions the case definition requires.
- name: Whole exome or targeted gene panel sequencing
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Sequencing is part of the exclusion workup rather than a confirmatory test: a
    monogenic cause moves the patient out of this diagnosis and into the relevant
    gene-specific disease. Of 84 patients sequenced in the NIH series, six had a
    pathogenic variant in NFKB1, PIK3CD, FAS, IL2RG, DOCK8 or CD4, and a monogenic
    cause was found in 7 percent overall.
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Similarly, in our cohort, despite extensive genetic workup, only 7% of the
      patients were found to have a monogenic cause of CD4 lymphopenia.
    explanation: The yield of sequencing in the largest cohort.
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      after genetic workup that was performed in 84 study patients (80 by whole-exome
      sequencing and 4 by targeted-gene-panel sequencing)
    explanation: The number sequenced and the methods used.

animal_models:
- name: ICL patient PBMC-engrafted NOD-Rag1-null IL2rg-null mouse
  species: Mouse
  genotype: NOD-Rag1null IL2rgnull (NRG), engrafted with human peripheral blood mononuclear cells
  category: Humanized xenograft
  description: >-
    The only model of this syndrome, and a xenograft rather than a genetic model:
    peripheral blood mononuclear cells from patients and healthy donors are
    transferred into lymphocyte-free mice and their expansion compared. Mice given
    cells from some patients reproduce the donor's lymphopenia, which is what
    localises the limitation to the T cells. A single dose of long-acting interleukin
    7 restored CD4 counts in those mice to the level seen with healthy-donor cells.
  publication: PMID:42155681
  modeled_mechanisms:
  - target: Persistent CD4-Positive T Cell Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the failure of the patient's T cells to expand, in a host emptied of
      competing lymphocytes.
    limitations: >-
      A xenogeneic system: human cells in a mouse niche, without the patient's own
      cytokine environment, stroma or autoantibodies. It therefore cannot represent
      any extrinsic mechanism, including the autoantibody-mediated depletion
      hypothesis recorded above, and it reproduces the phenotype only for the subgroup
      of patients whose defect is T cell intrinsic.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The patient's humoral environment is outside the model. Anti-CD4
        autoantibodies and complement, which half the NIH cohort carries, are not
        transferred with the mononuclear cells, so a patient whose depletion is
        antibody-driven would be expected to produce a normally expanding graft.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model reproduces donor lymphopenia for a subgroup of patients, and the
        reported results are conditioned on the mice that phenocopied their donor.
        Patients whose cells expand normally are not represented.
    readouts:
    - name: Human CD4 T cell reconstitution in blood and spleen
      target: Persistent CD4-Positive T Cell Depletion
      direction: DECREASED
      interpretation: >-
        Poor expansion of patient CD4 and CD8 T cells four weeks after transfer, which
        is the model's representation of the depletion.
      evidence:
      - reference: PMID:42155681
        reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: As expected, four weeks after PBMC transfer, untreated mice showed poor reconstitution of CD4 and CD8 T-cells
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:42155681
      reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        This suggests a potential T-cell intrinsic factor/s as the cause, or
        contributor, of lymphopenia in these patients, since a robust impediment to
        T-cell proliferation and/or survival persists even in a T-cell empty and
        xenogenic host.
      explanation: >-
        States what the model licenses, namely an intrinsic limitation travelling with
        the cells, for the patients whose cells behave this way.
  - target: Blunted Interleukin-7 Homeostatic Response
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Supplying long-acting interleukin 7 restores CD4 counts in the lymphopenic mice
      to healthy-donor levels, which is the preclinical basis for the current trial.
    limitations: >-
      The rescue shows that the engrafted cells can respond to exogenous interleukin
      7; it does not establish that a blunted endogenous response is what limits them,
      since the mouse niche supplies neither the human cytokine nor the human stroma.
    readouts:
    - name: Human CD4 T cell count after a single NT-I7 dose
      target: Blunted Interleukin-7 Homeostatic Response
      direction: RESTORED
      interpretation: CD4 counts returned to the level seen in mice given healthy-donor cells.
      evidence:
      - reference: PMID:42155681
        reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          In mice that phenocopied their donors' lymphopenia, NT-I7 treatment restored
          CD4 T-cell counts to the levels observed in mice receiving lymphocytes from
          healthy donors.
        explanation: The rescue this readout records.
  evidence:
  - reference: PMID:42155681
    reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Mice received peripheral blood mononuclear cells from 15 individuals: 5 healthy donors and 10 persons with ICL."
    explanation: The model's design, including the healthy-donor comparison that makes it interpretable.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population-based prevalence or incidence estimate was located, and Orphanet
    ORPHA:228000 carries no prevalence class, so only the qualitative tier is
    recorded. The case definition itself describes the disease as rare, and the
    largest cohort assembled in 30 years at a national referral centre holds 91
    patients.

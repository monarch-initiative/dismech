- name: Secondary non-HIV CD4 lymphocytopenia
  description: >-
    Drugs, malignancy, lymphodepleting chemotherapy, sarcoidosis, common variable
    immunodeficiency and autoimmune disease all cause CD4 depletion and are excluded
    by history and workup. Five of the 108 patients enrolled in the NIH study had such
    an alternative diagnosis, including two with common variable immunodeficiency and
    one whose counts recovered when Crohn disease was treated.
  distinguishing_features:
  - An identifiable cause on history, medication review or workup.
  - CD4 counts may recover when the cause is treated.

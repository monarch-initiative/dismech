      label: Flow Cytometry
  description: >-
    The primary test, repeated to establish persistence: CD4, CD8, B and natural
    killer cell counts, with the CD4 criterion required on at least two occasions six
    weeks apart. Enumerating the other lineages at the same time matters, because the
    CD8 and natural killer counts carry the prognostic information.
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We measured the number of CD4+ and CD8+ T cells, B cells, and natural killer (NK)

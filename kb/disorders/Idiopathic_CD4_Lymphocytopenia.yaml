    beyond a year in 88 percent of those. Trimethoprim-sulfamethoxazole, atovaquone or
    dapsone against Pneumocystis in 67 percent, azithromycin against nontuberculous
    mycobacteria in 13 percent, fluconazole as antifungal prophylaxis in 8 percent. It
    treats the consequences of the depletion, not the depletion.
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: co-trimoxazole
      term:
        id: CHEBI:3770
        label: co-trimoxazole
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: fluconazole
      term:
        id: CHEBI:46081
        label: fluconazole
  target_mechanisms:

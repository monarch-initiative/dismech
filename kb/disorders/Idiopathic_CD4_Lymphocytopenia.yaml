mechanistic_hypotheses:
- hypothesis_group_id: icl_autoantibody_mediated_depletion
  hypothesis_label: Anti-lymphocyte autoantibodies destroy CD4 T cells
  status: EMERGING
  description: >-
    On this account the depletion is antibody-mediated. Sera from the NIH cohort
    carry large numbers of autoantibodies, half of the patients have anti-CD4 cell
    antibodies detectable by flow cytometry, and in half of those the antibodies
    lyse CD4 T cells; classical complement activation was found on CD4 T cells in
    vivo in 14 percent of the cohort. The attraction of this account is that it
    supplies an effector mechanism for the depletion and a drug target, which is the
    rationale for the belimumab pilot. What it does not yet explain is direction: the
    autoantibodies are mostly against private targets and track neither the patients'
    autoimmune disease status nor, quantitatively, their CD4 counts, so whether they
    cause the lymphopenia or follow it is open.
  evidence:
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The targets included lymphocyte intracellular and membrane antigens, confirmed
      by the detection by flow of IgM and IgG (mostly IgG1 and IgG4) anti-CD4+ cell
      Abs in 50% of the patients, with half of these cases triggering lysis of CD4+ T
      cells.
    explanation: >-
      Antibodies specific for CD4 T cells are present in half the cohort and are
      cytolytic in half of those, which is the effector step this hypothesis needs.
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: We also detected in vivo classical complement activation on CD4+ T cells in 14% of the whole cohort.
    explanation: >-
      Complement deposition on the patients' own CD4 T cells shows the pathway is
      engaged in vivo rather than only in the assay.
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All ICL patients had a multitude of autoantibodies mostly directed against
      private (not shared) targets and unrelated quantitatively or qualitatively to
      the patients' autoimmune disease status.
    explanation: >-
      The autoantibody burden does not correspond to the patients' clinical
      autoimmunity, which argues against reading it as the driving lesion and is why
      this hypothesis is recorded as emerging.
- hypothesis_group_id: icl_accelerated_apoptosis
  hypothesis_label: Accelerated Fas-mediated apoptosis depletes the CD4 compartment
  status: ALTERNATIVE
  description: >-
    The oldest mechanistic account, and the one with the longest supporting series.
    CD4 T cells from most patients in an early cohort died by accelerated programmed
    cell death, with Fas and Fas ligand overexpressed before any stimulation and the
    death partly blocked by anti-Fas antibody; a later single patient showed CD95 on
    almost every lymphocyte with apoptosis confined to the CD4 subset. The 2008
    natural-history cohort found increased activation and turnover in CD4 but not CD8
    T cells, which fits a compartment being consumed rather than not made. What keeps
    this an alternative rather than the canonical account is that none of the work
    establishes what drives the Fas pathway, and the patients in whom both CD4 and
    CD8 are deeply reduced are not explained by a CD4-selective death pathway.
  evidence:
  - reference: PMID:8609222
    reference_title: Apoptotic depletion of CD4+ T cells in idiopathic CD4+ T lymphocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      We report that CD4+ T cells from seven of eight ICL patients underwent
      accelerated programmed cell death, a process facilitated by T cell receptor
      cross-linking.
    explanation: Accelerated death of the patients' own CD4 T cells in seven of eight patients.
  - reference: PMID:8609222
    reference_title: Apoptotic depletion of CD4+ T cells in idiopathic CD4+ T lymphocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Apoptosis was associated with enhanced expression of Fas and Fas ligand in
      unstimulated cell populations, and partially inhibited by soluble anti-Fas mAb.
    explanation: >-
      Names Fas as the pathway and shows the death is partly blocked when Fas is
      neutralised.
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: Immunologic analyses revealed increased activation and turnover in CD4 but not CD8 T lymphocytes.
    explanation: >-
      Increased turnover restricted to the CD4 compartment in a prospective cohort is
      what a consumption mechanism predicts.
- hypothesis_group_id: icl_cxcr4_trafficking_defect
  hypothesis_label: Defective surface CXCR4 misdirects CD4 T cell trafficking
  status: ALTERNATIVE
  description: >-
    On this account the circulating CD4 count is low because the cells cannot traffic
    normally, not because they are destroyed. All six patients in the defining series
    had little surface CXCR4 on their CD4 T cells, with CXCR4 and its ligand CXCL12
    accumulating inside the cell and chemotaxis towards CXCL12 reduced while the
    response to CXCL8 was intact. The account has a treatment prediction and it was
    met: adding interleukin 2 restored surface CXCR4 in five of six patients in
    vitro, and giving it therapeutically raised both the CD4 count and surface CXCR4
    in three of four patients treated. It rests on small numbers, and whether the
    trafficking defect is primary or a consequence of the lymphopenic state is
    untested.
  evidence:
  - reference: PMID:20038787
    reference_title: Idiopathic CD4+ T-cell lymphocytopenia is associated with impaired membrane expression of the chemokine receptor CXCR4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For all 6 patients studied, a profound defect in CXCR4 expression was detected
      at the surface of CD4(+) T lymphocytes, in association with an abnormal
      intracellular accumulation of CXCR4 and of its natural ligand, the chemokine
      CXCL12.
    explanation: The defect was present in every patient studied and is specific to the receptor's surface pool.
  - reference: PMID:20038787
    reference_title: Idiopathic CD4+ T-cell lymphocytopenia is associated with impaired membrane expression of the chemokine receptor CXCR4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Upon therapeutic administration of IL-2, CD4(+) T-cell count and membrane CXCR4
      expression and function improved over time in 3 of 4 patients treated.
    explanation: >-
      The CD4 count and the receptor defect move together under treatment, which is
      the prediction that makes this more than an association.
- hypothesis_group_id: icl_impaired_il7_homeostasis
  hypothesis_label: A blunted interleukin-7 response fails to refill the CD4 compartment
  status: ALTERNATIVE
  description: >-
    Interleukin 7 normally rises as CD4 cells are lost and drives their regeneration,
    and that inverse relationship holds in HIV infection and after chemotherapy. In
    idiopathic CD4 lymphocytopenia the relationship is much weaker, which suggests
    the homeostatic loop itself is broken rather than the cells being destroyed
    faster than they can be replaced. This is the rationale behind every
    interleukin-7 trial in the disease, and the trials support it indirectly:
    recombinant interleukin 7 does raise circulating and tissue T cell numbers. The
    original observation is correlational and the measurement is of serum cytokine
    rather than of receptor signalling, so the broken step is not identified.
  evidence:
  - reference: PMID:11342421
    reference_title: A potential role for interleukin-7 in T-cell homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Furthermore, in patients with idiopathic CD4 lymphopenia, a much weaker
      relationship between IL-7 levels and peripheral blood CD4 counts was observed,
      suggesting that an impaired IL-7 response to CD4 depletion may contribute to the
      impaired lymphocyte homeostasis observed in this population.
    explanation: >-
      States the broken homeostatic relationship in these patients, against the intact
      relationship the same study measured in other causes of CD4 depletion.
  - reference: PMID:26675348
    reference_title: Administration of interleukin-7 increases CD4 T cells in idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Quantitatively, rhIL-7 led to an increase in the number of circulating CD4 and
      CD8 T cells and tissue-resident CD3 T cells in the gut mucosa and bone marrow.
    explanation: >-
      Supplying the cytokine raises the cell numbers, which is consistent with the
      endogenous response being the limiting step, though the trial had no control arm.
- hypothesis_group_id: icl_t_cell_intrinsic_defect
  hypothesis_label: A T cell intrinsic defect limits proliferation and survival in a subgroup
  status: EMERGING
  description: >-
    Transferring patient peripheral blood mononuclear cells into lymphocyte-free
    immunodeficient mice separates the patients. Cells from some patients fail to
    expand in a host that is empty of competing lymphocytes and carries no human
    autoantibodies or human cytokine environment, which locates the limitation in the
    T cells themselves rather than in their surroundings. That is the cleanest
    available argument that at least part of this syndrome is T cell intrinsic, and it
    predicts that the subgroup is identifiable before treatment. It is a xenogeneic
    model, a human cell in a mouse niche, and it applies to a subgroup rather than to
    the syndrome.
  evidence:
  - reference: PMID:42155681
    reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      This suggests a potential T-cell intrinsic factor/s as the cause, or
      contributor, of lymphopenia in these patients, since a robust impediment to
      T-cell proliferation and/or survival persists even in a T-cell empty and
      xenogenic host.
    explanation: >-
      The defect travels with the cells into a host lacking the patient's own
      environment, which is what distinguishes an intrinsic from an extrinsic cause.
  - reference: PMID:42155681
    reference_title: Long-acting IL-7 restores T-cell reconstitution in a humanized mouse model of lymphopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Using a humanized mouse model, we have previously identified a subgroup of
      people with ICL (pICL) who, unlike healthy donors (HD), harbor T-cells incapable
      of reconstituting an immunocompromised mouse host through homeostatic expansion
    explanation: >-
      States that this applies to a subgroup, which is why the hypothesis is scoped
      that way rather than offered for the whole syndrome.
- hypothesis_group_id: icl_unc119_lck_trafficking
  hypothesis_label: UNC119-dependent LCK delivery to the immune synapse is the lesion
  status: ALTERNATIVE
  description: >-
    The mechanism proposed with the 2012 UNC119 proband, and the reason OMIM assigns
    this entity to that gene. UNC119A carries myristoylated LCK to the immunological
    synapse, and a disruption of that delivery would blunt proximal T cell receptor
    signalling and the proliferation that maintains the CD4 compartment. The
    trafficking step is independently established, in structural work and in primary
    human T cells where inhibiting UNC119 reduces LCK at the synapse without
    affecting its phosphorylation. What this hypothesis does not have is a genetic
    foothold: the only allele offered for it is classified benign, and no second
    patient has been reported in thirteen years. It is kept as a candidate pathway
    for the syndrome, not as an account of the reported family.
  evidence:
  - reference: PMID:22184408
    reference_title: A mutation in the human Uncoordinated 119 gene impairs TCR signaling and is associated with CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The patient's cells have reduced response to TCR stimulation, with impairment in
      both localization and enzymatic activation of the lymphocyte-specific kinase
      (Lck) resulting in decreased cell proliferation.
    explanation: >-
      The proband's own cells show the signalling and proliferation defect the
      hypothesis predicts, measured in vitro.
  - reference: PMID:39814552
    reference_title: UNC119 regulates T-cell receptor signalling in primary T cells and T acute lymphocytic leukaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Inhibiting UNC119 reduces localisation of LCK without impairing LCK
      phosphorylation and reduces T-cell receptor signal transduction.
    explanation: >-
      Establishes the trafficking step in primary human T cells independently of the
      disputed allele, which is why the pathway survives the allele's reclassification.
pathophysiology:
- name: Blunted Interleukin-7 Homeostatic Response
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Serum interleukin 7 normally rises in inverse proportion to the circulating CD4
    count and drives regeneration of the compartment. In these patients that
    relationship is much weaker than in other causes of CD4 depletion, so the loop
    that should refill the compartment does not respond to its emptying. Recorded as
    provisional: the observation is a correlation between a serum cytokine level and
    a cell count, and the step that fails between them has not been identified.
  biological_processes:
  - preferred_term: interleukin-7-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038111
      label: interleukin-7-mediated signaling pathway
  - preferred_term: T cell homeostasis
    modifier: DECREASED
    term:
      id: GO:0043029
      label: T cell homeostasis
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Persistent CD4-Positive T Cell Depletion
    description: >-
      A homeostatic response that does not scale with the depletion leaves the
      compartment unreplenished.
    evidence:
    - reference: PMID:11342421
      reference_title: A potential role for interleukin-7 in T-cell homeostasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        suggesting that an impaired IL-7 response to CD4 depletion may contribute to
        the impaired lymphocyte homeostasis observed in this population
      explanation: >-
        The authors propose exactly this link, from the blunted cytokine response to
        the failure of lymphocyte homeostasis.
  evidence:
  - reference: PMID:11342421
    reference_title: A potential role for interleukin-7 in T-cell homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT

- name: Persistent CD4-Positive T Cell Depletion
  biological_scale: ORGANISM
  description: >-
    The defining lesion and the one step every case shares: a circulating CD4 T cell
    count persistently below 300 cells per cubic millimetre, confirmed on separate
    occasions, with no infectious, iatrogenic or monogenic cause found. The median
    count in the largest cohort was 80 cells per cubic millimetre. CD8 counts are
    reduced alongside CD4 in about half of patients, and natural killer and B cell
    numbers less often, so the depletion is frequently not confined to the CD4
    lineage. Counts drift upward slightly over years rather than falling, which is
    what separates the natural history from untreated HIV infection.
  cell_types:

    - reference: PMID:37133586
      reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        13% received azithromycin for nontuberculous mycobacterial infection
        prophylaxis, and 8% received fluconazole as antifungal prophylaxis
      explanation: >-
        Names the agents and the organisms they are directed at, which is the
        substitution this link records.
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In our cohort, 55% of the patients received prophylaxis for opportunistic infections.
    explanation: Establishes prophylaxis as standard practice in this disease.
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      A total of 67% of the patients received prophylaxis for PJP (48% with
      trimethoprim-sulfamethoxazole, 11% with atovaquone, and 8% with dapsone)
    explanation: The agents used against Pneumocystis and the proportions receiving them.
- name: Recombinant interleukin-7
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    The only intervention tested prospectively against the depletion itself. An
    open-label phase 1/2A dose-escalation trial of recombinant human interleukin 7
    raised circulating CD4 and CD8 counts and tissue-resident T cells in gut mucosa
    and bone marrow, and the cells produced cytokines on stimulation. Injection-site
    reactions were the commonest adverse event; one patient made non-neutralising
    anti-interleukin-7 antibodies, and one developed systemic lupus erythematosus on
    study. A long-acting form, efineptakin alfa, is in a phase 1/2 trial, and one
    patient in the NIH cohort was receiving it for refractory papillomavirus disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glycosylated recombinant human interleukin-7
      term:
        id: NCIT:C77879
        label: Glycosylated Recombinant Human Interleukin-7
    - preferred_term: efineptakin alfa
      term:
        id: NCIT:C151927
        label: Efineptakin alfa
  target_mechanisms:
  - target: Blunted Interleukin-7 Homeostatic Response
    treatment_effect: RESTORES
    description: >-
      Supplies the cytokine whose endogenous response to depletion is blunted in this
      disease.
    evidence:
    - reference: PMID:26675348
      reference_title: Administration of interleukin-7 increases CD4 T cells in idiopathic CD4 lymphocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Quantitatively, rhIL-7 led to an increase in the number of circulating CD4 and
        CD8 T cells and tissue-resident CD3 T cells in the gut mucosa and bone marrow.
      explanation: The measured effect of supplying the cytokine.
  - target: Persistent CD4-Positive T Cell Depletion
    treatment_effect: RESTORES

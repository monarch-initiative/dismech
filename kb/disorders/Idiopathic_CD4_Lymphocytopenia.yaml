    only in individual patients. Six of the 40 French patients received recombinant
    interleukin 2; two were able to stop after three and five years with no new
    opportunistic infection. In the series that found defective surface CXCR4, the
    receptor defect normalised in three of four treated patients as their CD4 counts
    rose. Autoimmune haemolytic anaemia and Goodpasture syndrome in one patient were
    attributed to the treatment.

    autoimmunity point the same way: patients with the larger residual CD4 pool are
    the ones at autoimmune risk, and they are also the ones with least to gain from
    expansion.
- name: Interleukin-2
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-

- name: Lymphopenia-Associated Breakdown of Self-Tolerance
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    About a third of patients carry an autoimmune condition, and 44 autoimmune
    diagnoses were made in 33 of the 91 patients in the largest cohort. The risk runs
    opposite to the depth of CD4 depletion, so it is not a simple consequence of
    immune failure; the proposed explanation is that lymphopenia drives homeostatic
    proliferation and loss of regulatory balance in patients who retain a larger CD4
    pool. Provisional: the inverse association is solid, the regulatory mechanism
    offered for it has not been measured in these patients, and the autoantibody
    repertoire does not track their autoimmune disease status.

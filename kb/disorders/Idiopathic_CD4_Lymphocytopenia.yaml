name: Idiopathic CD4 Lymphocytopenia
creation_date: "2026-11-16T21:58:59Z"
category: Complex
description: >-
  A clinical syndrome of persistent CD4-positive T cell depletion below 300 cells
  per cubic millimetre, diagnosed by exclusion once HIV-1, HIV-2, HTLV infection,
  another defined immunodeficiency and lymphodepleting therapy have all been ruled
  out. The depleted CD4 compartment leaves cell-mediated immunity unable to control
  a characteristic set of pathogens: human papillomavirus, Cryptococcus, molluscum
  contagiosum virus, nontuberculous mycobacteria and JC virus. Virus-driven and
  other cancers are commoner than in the general population, and about a third of
  patients carry an autoimmune condition. CD8, natural killer and B cell counts are
  reduced in many patients, so the deficit is often broader than the CD4 lineage
  alone. No cause is established in most patients, and the upstream mechanisms
  recorded here are competing candidates rather than one agreed lesion.
notes: >-
  Curated as a single Disease entry rather than a Grouping, which is the lump/split
  question posed by the claim issue. Three things decided it. The syndrome has a
  consensus case definition that every cohort applies, so its membership is stated
  rather than inferred. The large cohorts report a reproducible downstream
  pathograph: the 2023 NIH series of 91 patients found HPV disease, cryptococcosis,
  cancer and autoimmunity recurring together and called it a unifying pattern, and
  the 29 percent HPV figure replicates across continents. And a monogenic cause is
  the exception, not the rule: whole-exome or panel sequencing of 84 of the 108
  enrolled NIH patients found a monogenic cause in 7 percent, and those patients
  were then excluded from the ICL analysis, which is what the case definition
  requires. So the gene-defined causes are not subtypes of this entry. They are
  separate diseases that present with the same laboratory finding, and they are
  recorded in differential_diagnoses; MAGT1, ITK, CD4 and STK4 deficiency each
  already have their own KB entry.
  What is left is a convergent phenotype with several candidate upstream lesions.
  Those are carried as mechanistic_hypotheses and as provisional pathophysiology
  nodes feeding the defining depletion node, because no cohort has shown any one of
  them to account for the syndrome.
  UNC119 is recorded as a DISPUTED gene, not as a cause. MONDO:0014226 merges the
  OMIM gene entry immunodeficiency 13 into the clinical syndrome, so the gene has to
  be addressed by this entry, and the schema asks for a genetic row graded DISPUTED
  rather than a subtype where a locus claim is unsettled. The claim rests on one
  proband reported in 2012 and has not been replicated in the thirteen years since,
  in a period during which two large cohorts sequenced their patients and named six
  other genes. ClinVar classifies the reported allele NM_005148.4(UNC119):c.65G>T
  (p.Gly22Val) as Benign/Likely benign with criteria provided, multiple submitters
  and no conflicts, last evaluated 2026-01-28 (ClinVar variation 88737, checked
  2026-11-17); that classification is recorded in external_assertions and as the
  variant's clinical_significance, since ClinVar is not a citable reference prefix
  here. The in vitro LCK-trafficking work in the same paper is cited on its own
  terms, and the UNC119A-to-LCK mechanism is independently established in primary T
  cells, so the pathway is a live candidate even though the allele is not a
  Mendelian cause.
  Prevalence is recorded qualitatively. No population-based registry or incidence
  estimate for this syndrome was located, and Orphanet ORPHA:228000 carries no
  prevalence class, so no numeric rate is given.
  Sources: a 3-iteration OpenScientist deep-research report
  (research/Idiopathic_CD4_Lymphocytopenia-deep-research-openscientist.md; 13 of 13
  references resolved, no unresolved identifiers) was used as a lead list. Its
  ontology suggestions were not used: 11 of its 31 checked labels were mismatched,
  including every NCIT treatment CURIE it proposed, and two of its HPO suggestions
  name different concepts (HP:0032252 is Granuloma, not molluscum contagiosum;
  HP:0032257 is Severe Histoplasma capsulatum infection, not nontuberculous
  mycobacterial disease). Every term bound below was looked up in the committed
  caches or in OLS, and every snippet is quoted from a directly fetched reference.

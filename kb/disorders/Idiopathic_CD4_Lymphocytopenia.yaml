genetic:
- name: UNC119
  relationship_type: DISPUTED
  gene_term:
    preferred_term: UNC119
    term:
      id: hgnc:12565
      label: UNC119
  association: >-
    A single heterozygous missense allele reported in one patient in 2012, on which
    OMIM 615518 and the MONDO merge of immunodeficiency 13 into this syndrome rest.
    The claim is unreplicated after thirteen years and the allele is classified
    benign, so the gene is recorded as disputed rather than causative.
  variant_origin: GERMLINE
  notes: >-
    The gene is retained here because MONDO:0014226 merges the OMIM gene entry into
    this clinical syndrome, so an entry for the syndrome has to say what it makes of
    the gene. Three things count against the Mendelian claim and none of them is a
    criticism of the functional work. The report describes one proband, and the same
    paper notes the allele was absent from the two other ICL patients studied. No
    second patient has been reported since, in a period when the two large cohorts
    sequenced their patients and named NFKB1, PIK3CD, FAS, IL2RG, DOCK8 and CD4 but
    not UNC119. And ClinVar classifies the allele Benign/Likely benign with criteria
    provided, multiple submitters and no conflicts (variation 88737, last evaluated
    2026-01-28); that record is in external_assertions, since ClinVar is not a
    citable reference prefix here.
    The UNC119A-to-LCK trafficking mechanism is separate from the allele's status and
    is independently established, so it is kept as a candidate pathway in
    mechanistic_hypotheses under icl_unc119_lck_trafficking.
    No gene-disease validity assertion is recorded: ClinGen has not classified this
    pair, and gene_disease_validity is for copying an external body's tier, never for
    assigning one.
  variants:
  - name: NM_005148.4(UNC119):c.65G>T (p.Gly22Val)
    clinical_significance: BENIGN
    description: >-
      The allele reported in the single proband, published as codon 22 GGC to GTC
      with the protein change named V22G. The codon change given encodes glycine to
      valine, so the protein-level name is p.Gly22Val; ClinVar records it under that
      name, as rs199714731, and classifies it Benign/Likely benign.
    identifiers:
    - dbSNP:rs199714731
    evidence:
    - reference: PMID:22184408
      reference_title: A mutation in the human Uncoordinated 119 gene impairs TCR signaling and is associated with CD4 lymphopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: of the signaling adaptor protein Uncoordinated 119 (Unc119) in an ICL patient
      explanation: The original report of the allele in one patient with this syndrome.
    - reference: PMID:22184408
      reference_title: A mutation in the human Uncoordinated 119 gene impairs TCR signaling and is associated with CD4 lymphopenia.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: The mutation is not present in 2 other patients with ICL, patients with secondary CD4 lymphopenia or 60 healthy subjects.
      explanation: >-
        The reporting paper's own control data: the allele was absent from the other
        ICL patients studied, so it accounts for no case beyond the index patient, and
        a 60-subject panel is too small to establish rarity.
  evidence:
  - reference: PMID:22184408
    reference_title: A mutation in the human Uncoordinated 119 gene impairs TCR signaling and is associated with CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The mutation disrupts the Unc119-Lck interaction which is normally needed for
      stimulation of the Lck catalytic activity by TCR.
    explanation: >-
      The functional result offered in support of the gene, obtained by transducing
      the mutant protein into normal T cells rather than in patient cells at
      endogenous expression.
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Similarly, in our cohort, despite extensive genetic workup, only 7% of the
      patients were found to have a monogenic cause of CD4 lymphopenia.
    explanation: >-
      A cohort of 108 patients sequenced without recovering this gene, which is the
      replication the 2012 claim has not received.

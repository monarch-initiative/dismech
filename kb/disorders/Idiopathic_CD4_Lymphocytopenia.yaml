- name: Allogeneic hematopoietic stem cell transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Reserved for the most severe disease and reported in individual patients. A
    40-year-old man with severe disease and opportunistic infection received
    non-myeloablative conditioning and a sibling graft, achieved stable chimerism, and
    had a CD4 count of 1019 cells per microlitre at 35 months. Two patients in the NIH
    cohort with progressive papillomavirus-related carcinoma were transplanted.

        count of 101 to 300 cells, was associated with a higher risk of opportunistic
        infection (odds ratio, 5.3; 95% confidence interval [CI], 2.8 to 10.7)
      explanation: >-
        A dose-response between the depth of depletion and opportunistic infection,
        which is the quantitative form of this edge.
    - reference: PMID:24646462

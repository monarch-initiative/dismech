progression:
- phase: Adult onset, usually detected through an opportunistic infection
  notes: >-
    Onset is in adult life and insidious. The French cohort's mean age was 44 years
    and the NIH cohort's median age at enrolment 48; the usual route to diagnosis is a
    lymphocyte subset count prompted by an opportunistic infection, most often
    cryptococcal or papillomavirus disease.
  evidence:
  - reference: PMID:24646462
    reference_title: "Idiopathic CD4 lymphocytopenia: clinical and immunologic characteristics and follow-up of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: We recruited 40 patients (24 female) of mean age 44.2
    explanation: Age at recruitment in the French cohort.
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Thirty-nine patients (17 men, 22 women) 25 to 85 years old with ICL were
      evaluated between 1992 and 2006, and 36 were followed for a median of 49.5
      months.
    explanation: The adult age range and the follow-up this phase describes.
- phase: First four years after diagnosis, when mortality is concentrated
  notes: >-
    In the prospective natural-history cohort seven of 39 patients died, four from
    opportunistic infection related to the disease, and all of those deaths occurred
    within 42 months of diagnosis. A CD8 count below 180 cells per cubic millimetre
    and CD4 HLA-DR expression at presentation identified the patients at risk. This is
    the window in which prophylaxis and surveillance matter most.
  evidence:
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Seven patients died, 4 from ICL-related opportunistic infections, within 42 months after diagnosis.
    explanation: The timing of mortality that defines this phase.
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      CD8 T lymphocytopenia (< 180/mm(3)) and the degree of CD4 T cell activation
      (measured by HLA-DR expression) at presentation were associated with adverse
      outcome
    explanation: The measures that stratify risk in this window.
- phase: Chronic stable course, with cancer rather than infection as the late burden
  notes: >-
    Counts do not collapse the way they do in untreated HIV infection. In the
    prospective cohort 32 of 39 patients stayed below 300 cells per cubic millimetre
    throughout while seven normalised after a mean of 31 months, and in the NIH cohort
    CD4 and CD8 counts rose slightly year on year. Mortality over 374 person-years
    matched the age- and sex-adjusted general population, but cancer prevalence did
    not, so the late burden is malignancy and autoimmunity rather than infection.
  evidence:
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In 32, CD4 T-cell counts remained less than 300/mm(3) throughout the study period
      and in 7 normalized after an average of 31 months.
    explanation: >-
      The two trajectories: a persistent deficit in most patients and spontaneous
      resolution in a minority.
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The risk of death was similar to that in the age- and sex-adjusted general population, but the prevalence of cancer was higher.
    explanation: The late burden this phase describes.
differential_diagnoses:
- name: HIV and HTLV infection
  description: >-
    The exclusion the diagnosis is built on, and the reason the syndrome was once
    described as AIDS without HIV. Serology and nucleic acid testing for HIV-1, HIV-2
    and HTLV-1/2 are required before the diagnosis can be made. The opportunistic
    infection spectrum differs from that of untreated HIV infection, and so does the
    natural history: counts here drift up rather than down and mortality is not
    raised.
  disease_term:
    preferred_term: AIDS
    term:
      id: MONDO:0012268
      label: AIDS
  distinguishing_features:
  - HIV and HTLV testing is negative, and must be before the diagnosis is made.
  - The opportunistic infection spectrum differs from that of untreated HIV type 1 infection.
  - CD4 and CD8 counts are stable or drift slightly upward rather than declining.
  evidence:
  - reference: PMID:24646462
    reference_title: "Idiopathic CD4 lymphocytopenia: clinical and immunologic characteristics and follow-up of 40 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      no evidence of infection with human immunodeficiency virus (HIV)-1/2 or human
      T-cell lymphotropic 1/2 (HTLV-1/2)
    explanation: The exclusion the case definition requires.
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In addition, the spectrum of the opportunistic infections observed in patients
      with ICL is distinct from that in those with untreated HIV type 1, which suggests
      differences in pathogenesis.
    explanation: The clinical difference beyond the serology.
- name: XMEN disease (MAGT1 deficiency)
  description: >-
    An X-linked magnesium transporter defect presenting with CD4 lymphopenia, chronic
    Epstein-Barr virus infection and defective T cell activation. CD4 lymphopenia was
    the presenting feature that led to its discovery, and it is curated here as
    congenital disorder of glycosylation type ICC. A patient with a MAGT1 variant does
    not have idiopathic CD4 lymphocytopenia, by definition.
  disease_term:
    preferred_term: congenital disorder of glycosylation, type ICC
    term:
      id: MONDO:0026729
      label: congenital disorder of glycosylation, type ICC
  distinguishing_features:
  - X-linked inheritance, with a MAGT1 variant on sequencing.
  - Chronic Epstein-Barr virus viraemia and EBV-driven lymphoproliferation.
  - Defective T cell receptor-induced magnesium influx.
  evidence:
  - reference: PMID:21796205
    reference_title: Second messenger role for Mg2+ revealed by human T-cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Here we identify mutations in the magnesium transporter gene, MAGT1, in a novel
      X-linked human immunodeficiency characterized by CD4 lymphopenia, severe chronic
      viral infections, and defective T-lymphocyte activation.
    explanation: Defines the entity and the features that separate it from this syndrome.
- name: ITK deficiency
  description: >-
    A recessive kinase deficiency identified in a patient carrying this syndrome's
    label, and published as a genetic cause of it. Under the case definition it is a
    separate disease, curated here as lymphoproliferative syndrome 1; the case is a
    worked example of why sequencing belongs in the exclusion workup.
  disease_term:
    preferred_term: lymphoproliferative syndrome 1
    term:
      id: MONDO:0013081
      label: lymphoproliferative syndrome 1
  distinguishing_features:
  - A biallelic ITK variant on sequencing.
  - Absent invariant natural killer T cells.
  - Epstein-Barr virus-driven lymphoproliferation in most reported patients.
  evidence:
  - reference: PMID:25061172
    reference_title: Identification of ITK deficiency as a novel genetic cause of idiopathic CD4+ T-cell lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In conclusion, in this case we identify ITK deficiency as a novel cause of idiopathic CD4 lymphopenia.
    explanation: >-
      The report that moves such a patient out of this diagnosis and into a
      gene-defined one.
- name: Inherited CD4 deficiency
  description: >-
    A biallelic CD4 defect, in which CD4-positive T cells are absent rather than
    depleted and the receptor itself is missing from the cell surface. One of the six
    inborn errors of immunity found in the NIH cohort's sequencing and curated here as
    immunodeficiency 79.
  disease_term:
    preferred_term: immunodeficiency 79
    term:
      id: MONDO:0030981
      label: immunodeficiency 79
  distinguishing_features:
  - Absent rather than reduced CD4-positive T cells, with increased double-negative T cells.
  - A biallelic CD4 variant on sequencing.
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      6 cases of inborn errors of immunity 16 with pathogenic variants in NFKB1,
      PI3KCD, FAS, 17 IL2RG, 18 DOCK8, and CD4 19
    explanation: >-
      The genes found in the cohort's own exclusion workup, CD4 among them; each
      identifies a different disease.
- name: Other inborn errors of immunity found on sequencing
  description: >-
    Variants in NFKB1, PIK3CD, FAS, IL2RG and DOCK8 each accounted for a patient
    referred with this syndrome's label in the NIH cohort, and STK4 deficiency
    presents with CD4 lymphopenia in every reported patient. Sequencing is what
    separates them, which is why it belongs in the diagnostic workup rather than after
    it.
  disease_term:
    preferred_term: combined immunodeficiency due to STK4 deficiency
    term:
      id: MONDO:0013934
      label: combined immunodeficiency due to STK4 deficiency
  distinguishing_features:
  - A pathogenic variant in a known immunodeficiency gene on exome or panel sequencing.
  - Often childhood onset, where this syndrome presents in adult life.
  evidence:

name: Idiopathic CD4 Lymphocytopenia
creation_date: "2026-09-09T09:30:00Z"
category: Complex
description: >-
  A clinical syndrome defined by persistent CD4+ T lymphocytopenia below 300
  cells per cubic millimetre in the absence of HIV infection or any other
  identifiable cause of immunodeficiency. It is a diagnosis of exclusion rather
  than a single disease: patients in whom a genetic or acquired cause is
  subsequently found leave the category. The lymphopenia is often discovered
  incidentally, but confers susceptibility to a characteristic set of
  opportunistic infections, to virus-associated malignancy, and to autoimmune
  disease.
synonyms:
- ICL
- idiopathic CD4+ T-lymphocytopenia
- idiopathic CD4 lymphopenia
parents:
- Primary Immunodeficiency
disease_term:
  preferred_term: idiopathic CD4 lymphocytopenia
  term:
    id: MONDO:0014226
    label: idiopathic CD4 lymphocytopenia
pathophysiology:
- name: Lymphocyte-Directed Autoantibody Formation
  biological_scale: MOLECULAR
  description: >-
    Sera from ICL patients carry a broad autoantibody repertoire directed
    largely at private rather than shared targets, including lymphocyte
    intracellular and membrane antigens. The repertoire does not track with
    whether the patient has clinical autoimmune disease, which argues that it is
    a feature of the lymphopenic state itself rather than a marker of
    coincidental autoimmunity.
  downstream:
  - target: Antibody-Mediated Destruction of CD4+ T Cells
    causal_link_type: DIRECT
    description: >-
      A subset of these autoantibodies is specific for CD4+ T cells and is
      competent to destroy them.
    evidence:
    - reference: PMID:32634122
      reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the detection by flow of IgM and IgG (mostly IgG1 and IgG4) anti-CD4+ cell Abs in 50% of the patients, with half of these cases triggering lysis of CD4+ T cells"
      explanation: Establishes that anti-CD4 antibodies are present in half the cohort and that a subset of them lyses CD4+ T cells, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All ICL patients had a multitude of autoantibodies mostly directed against private (not shared) targets and unrelated quantitatively or qualitatively to the patients' autoimmune disease status."
    explanation: Documents the universal, private autoantibody repertoire and its independence from clinical autoimmune status.
- name: Antibody-Mediated Destruction of CD4+ T Cells
  biological_scale: CELLULAR
  description: >-
    Anti-CD4 antibodies drive complement-dependent cytotoxicity against CD4+ T
    cells. Classical complement activation on circulating CD4+ T cells is
    demonstrable in vivo in a minority of patients, so this route is
    established but accounts for only part of the cohort.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Depletion of Circulating CD4+ T Cells
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also detected in vivo classical complement activation on CD4+ T cells in 14% of the whole cohort."
    explanation: Shows the complement arm operating in vivo, and bounds it to a minority of patients.
- name: Increased CD4+ T Cell Activation and Turnover
  biological_scale: CELLULAR
  description: >-
    CD4+ T cells in ICL show raised activation and turnover, and the CD8+
    compartment does not, so the abnormality is lineage-restricted rather than a
    global lymphocyte defect. The degree of activation at presentation carries
    prognostic weight.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Depletion of Circulating CD4+ T Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Accelerated turnover is presumed to contribute to the steady-state
      deficit, though the intermediate steps between activation and net loss
      are not established.
  evidence:
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunologic analyses revealed increased activation and turnover in CD4 but not CD8 T lymphocytes."
    explanation: Establishes the raised activation and turnover, and its restriction to the CD4 lineage.
- name: Depletion of Circulating CD4+ T Cells
  biological_scale: ORGANISM
  description: >-
    The defining state of the syndrome. It is reached by more than one upstream
    route, and in most patients no route is identified at all. The deficit is
    typically profound and persistent rather than marginal, and only a minority
    of patients normalise.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Impaired Cell-Mediated Immune Surveillance
    causal_link_type: DIRECT
  - target: Blunted Response to Novel Antigens
    causal_link_type: DIRECT
    description: >-
      The novel-antigen deficit scales with the depth of the CD4 deficit, which
      is what ties it to this node rather than to the syndrome generally.
  - target: CD4+ T Lymphocytopenia
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median CD4+ T-cell count among the patients was 80 cells per cubic millimeter."
    explanation: Quantifies the depth of the deficit, well below the 300-cell diagnostic threshold.
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 32, CD4 T-cell counts remained less than 300/mm(3) throughout the study period and in 7 normalized after an average of 31 months."
    explanation: Establishes persistence in most patients while recording that a minority normalise.
- name: Impaired Cell-Mediated Immune Surveillance
  biological_scale: ORGANISM
  description: >-
    Loss of CD4+ helper function degrades control of intracellular and
    encapsulated organisms and of oncogenic viruses. The consequence is a
    characteristic opportunistic-infection profile and an excess of
    virus-associated cancers.
  downstream:
  - target: Opportunistic Infection
  - target: Human Papillomavirus-Related Disease
  - target: Cryptococcosis
  - target: Molluscum Contagiosum
  - target: Non-Tuberculous Mycobacterial Disease
  - target: Progressive Multifocal Leukoencephalopathy
  - target: Invasive Cancer
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the study patients, ICL continued to be associated with increased susceptibility to viral, encapsulated fungal, and mycobacterial diseases, as well as with a reduced response to novel antigens and an increased risk of cancer."
    explanation: States the breadth of the surveillance failure and names the organism classes and the cancer excess.
- name: Blunted Response to Novel Antigens
  biological_scale: ORGANISM
  description: >-
    Responses to antigens the patient has not previously encountered are
    reduced, and the deficit tracks with the depth of the CD4 deficit rather
    than being uniform across the syndrome.
  evidence:
  - reference: PMID:38344971
    reference_title: Immune responses to SARS-CoV-2 mRNA vaccination in people with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ICL and CD4 counts >100 cells/μL can mount vigorous humoral and cellular immune responses to SARS-CoV-2 vaccination; however, patients with more severe CD4 lymphopenia have blunted vaccine-induced immunity and may require additional vaccine doses and other risk mitigation strategies."
    explanation: Demonstrates the impaired novel-antigen response and shows it is a function of CD4 depth rather than a uniform property of ICL.
phenotypes:
- category: Immunologic
  name: CD4+ T Lymphocytopenia
  description: >-
    The defining laboratory finding: a CD4+ T-cell count below 300 cells per
    cubic millimetre, or below 20 percent of total T cells, documented on at
    least two occasions six weeks apart, with HIV infection and every other
    recognised cause of immunodeficiency excluded.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Decreased total CD4+ T cell count
    term:
      id: HP:5210418
      label: Decreased total CD4+ T cell count
    temporality: CHRONIC
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis of ICL has been defined as a CD4 count of less than 300 cells per cubic millimeter measured at least twice 6 weeks apart in the absence of any disease or therapy that may be associated with lymphopenia"
    explanation: States the diagnostic threshold, the repeat-measurement requirement and the exclusion clause that together define the phenotype.
- category: Infectious
  name: Opportunistic Infection
  description: >-
    Infection with organisms that rarely cause disease in immunocompetent
    hosts. In many patients the opportunistic infection is what brings the
    lymphopenia to attention.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Opportunistic infection
    term:
      id: HP:0031690
      label: Opportunistic infection
  evidence:
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 15 (41.6%) developed an opportunistic infection in follow-up, 5 (13.8%) of which were \"AIDS-defining clinical conditions,\" and 4 (11.1%) developed autoimmune diseases."
    explanation: Gives the follow-up incidence of opportunistic infection in the natural-history cohort.
- category: Infectious
  name: Human Papillomavirus-Related Disease
  description: >-
    The most prevalent opportunistic complication in the largest cohort,
    spanning warts and anogenital dysplasia.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Persistent human papillomavirus infection
    term:
      id: HP:0020114
      label: Persistent human papillomavirus infection
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent opportunistic infections were diseases related to human papillomavirus (in 29%), cryptococcosis (in 24%), molluscum contagiosum (in 9%), and nontuberculous mycobacterial diseases (in 5%)."
    explanation: Ranks HPV-related disease first among opportunistic infections and gives its prevalence.
- category: Infectious
  name: Cryptococcosis
  description: >-
    Cryptococcal disease, classically meningitis, is one of the two infections
    that most often bring ICL to medical attention. HPO has no plain
    cryptococcosis term; the bound term frames it as an unusual Cryptococcus
    infection, which is what cryptococcosis in a CD4-depleted host is.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: cryptococcosis
    term:
      id: HP:5210105
      label: Unusual Cryptococcus infection
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent opportunistic infections were diseases related to human papillomavirus (in 29%), cryptococcosis (in 24%), molluscum contagiosum (in 9%), and nontuberculous mycobacterial diseases (in 5%)."
    explanation: Gives the cohort prevalence of cryptococcosis.
  - reference: PMID:18456875
    reference_title: "Idiopathic CD4+ lymphocytopenia: natural history and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cryptococcal and nontuberculous mycobacterial infections were the major presenting opportunistic infections."
    explanation: Identifies cryptococcosis as a presenting rather than merely incident infection.
- category: Infectious
  name: Molluscum Contagiosum
  description: >-
    Poxvirus skin infection, extensive or persistent beyond the usual
    self-limited course.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Unusual molluscum contagiosum
    term:
      id: HP:0032163
      label: Unusual molluscum contagiosum
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent opportunistic infections were diseases related to human papillomavirus (in 29%), cryptococcosis (in 24%), molluscum contagiosum (in 9%), and nontuberculous mycobacterial diseases (in 5%)."
    explanation: Gives the cohort prevalence of molluscum contagiosum.
- category: Infectious
  name: Non-Tuberculous Mycobacterial Disease
  description: >-
    Disease caused by environmental mycobacteria, the second of the two classic
    presenting infections.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Non-tuberculous mycobacterial infection
    term:
      id: HP:5210115
      label: Non-tuberculous mycobacterial infection
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent opportunistic infections were diseases related to human papillomavirus (in 29%), cryptococcosis (in 24%), molluscum contagiosum (in 9%), and nontuberculous mycobacterial diseases (in 5%)."
    explanation: Gives the cohort prevalence of nontuberculous mycobacterial disease.
- category: Neurologic
  name: Progressive Multifocal Leukoencephalopathy
  description: >-
    JC virus reactivation causing demyelinating brain disease. Rare in ICL but
    notable because ICL is one of the few causes outside HIV infection and
    haematologic malignancy. HPO has no progressive multifocal
    leukoencephalopathy term, so the broader leukoencephalopathy term is bound
    and the specific entity is carried in the preferred term.
  phenotype_term:
    preferred_term: progressive multifocal leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:11049808
    reference_title: "Progressive multifocal leukoencephalopathy and idiopathic CD4+lymphocytopenia: a case report and review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To the best of our knowledge, this is the third reported case of PML and ICL, and also the first reported case of the use of cidofovir to treat PML in a patient not infected with human immunodeficiency virus."
    explanation: Documents PML in ICL while making the rarity explicit, which is why no frequency band is asserted.
- category: Neoplastic
  name: Invasive Cancer
  description: >-
    Cancer prevalence exceeds that of the age- and sex-matched general
    population, with the excess concentrated in virus-associated tumours,
    consistent with failed immune surveillance of oncogenic viruses rather than
    a general cancer predisposition.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: PMID:37133586
    reference_title: Reappraisal of Idiopathic CD4 Lymphocytopenia at 30 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of death was similar to that in the age- and sex-adjusted general population, but the prevalence of cancer was higher."
    explanation: Establishes the cancer excess against a matched comparison, and simultaneously bounds the mortality claim.
- category: Immunologic
  name: Autoimmune Disease
  description: >-
    Roughly a third of patients develop clinical autoimmune disease. Its
    relationship to the lymphopenia is inverse rather than dose-dependent:
    deeper CD4 depletion carries lower, not higher, odds of autoimmunity.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  sequelae:
  - target: Vitiligo
    description: >-
      Vitiligo is one of the autoimmune manifestations reported in association
      with the syndrome.
  evidence:
  - reference: PMID:32634122
    reference_title: Prevalence and pathogenicity of autoantibodies in patients with idiopathic CD4 lymphopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 30% of ICL patients develop autoimmune disease."
    explanation: Gives the proportion of patients with clinical autoimmune disease.
- category: Dermatologic
  name: Vitiligo
  description: >-
    Reported in association with ICL as one of the autoimmune manifestations of
    the syndrome.
  phenotype_term:
    preferred_term: Vitiligo
    term:
      id: HP:0001045
      label: Vitiligo
  evidence:
  - reference: PMID:12004324
    reference_title: Idiopathic CD4+T-cell lymphocytopenia associated with vitiligo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of a 32-year-old white man with a long history of vitiligo that is associated with ICTL."
    explanation: Single-case documentation of the association, which is why no frequency is asserted.
genetic:
- name: RAG1
  gene_term:
    preferred_term: RAG1
    term:
      id: hgnc:9831
      label: RAG1
  association: Causative
  relationship_type: MODIFIER
  notes: >-
    Hypomorphic RAG1 variants are one of the monogenic defects that can present
    as isolated CD4 lymphopenia. Recording it here is a statement about the
    differential, not about ICL itself: once such a variant is identified the
    patient no longer meets the definition of ICL, which requires that no other
    immunodeficiency be demonstrable. See notes.
  evidence:
  - reference: PMID:21502542
    reference_title: Idiopathic CD4+ T lymphopenia without autoimmunity or granulomatous disease in the slipstream of RAG mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 2 novel missense mutations in RAG1 (p.Arg474Cys and p.Leu506Phe) resulting in reduced RAG activity."
    explanation: Identifies hypomorphic RAG1 variants in a patient carrying an ICL label.
  - reference: PMID:21502542
    reference_title: Idiopathic CD4+ T lymphopenia without autoimmunity or granulomatous disease in the slipstream of RAG mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report gives the first genetic clue for ICL and extends the clinical spectrum of RAG mutations from severe immune defects to an almost normal condition."
    explanation: Frames the finding as extending the RAG phenotype into the ICL-labelled population.
treatments:
- name: Recombinant Human Interleukin-7
  description: >-
    IL-7 is the homeostatic cytokine for thymopoiesis and mature T-cell
    survival, which is the rationale for using it to reconstitute the CD4
    compartment. A phase 1/2A dose-escalation trial raised circulating and
    tissue-resident T cells. It remains investigational: the trial was open
    label and small, and one participant developed systemic lupus erythematosus
    while on study.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Depletion of Circulating CD4+ T Cells
    description: >-
      Supplies the homeostatic signal for T-cell expansion and survival,
      raising the circulating CD4 count rather than addressing the upstream
      cause.
    evidence:
    - reference: PMID:26675348
      reference_title: Administration of interleukin-7 increases CD4 T cells in idiopathic CD4 lymphocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "rhIL-7 led to an increase in the number of circulating CD4 and CD8 T cells and tissue-resident CD3 T cells in the gut mucosa and bone marrow."
      explanation: Reports the measured effect of the intervention on the node it targets.
  evidence:
  - reference: PMID:26675348
    reference_title: Administration of interleukin-7 increases CD4 T cells in idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interleukin-7 (IL-7) is fundamental for thymopoiesis, T-cell homeostasis, and survival of mature T cells, which provides a rationale for its potential use as an immunotherapeutic agent for ICL."
    explanation: States the mechanistic rationale for the intervention.
  - reference: PMID:26675348
    reference_title: Administration of interleukin-7 increases CD4 T cells in idiopathic CD4 lymphocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rhIL-7 was well tolerated at biologically active doses and may represent a promising therapeutic intervention in ICL."
    explanation: Records the tolerability finding and the authors' own hedged framing of the result.
clinical_trials:
- name: NCT00839436
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Open-label phase 1/2A dose-escalation trial of subcutaneous recombinant
    human IL-7 in ICL patients at risk of disease progression.
  evidence:
  - reference: clinicaltrials:NCT00839436
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To determine whether CYT107 will increase the number and function of T cells in people with ICL."
    explanation: States the trial's stated objective, which is the CD4-reconstitution endpoint this entry cites it for.
notes: >-
  MONDO:0014226 conflates two different things, and this entry curates only one
  of them. The term's own definition and its Orphanet:228000 cross-reference
  describe the clinical syndrome - a diagnosis of exclusion defined by a CD4
  count below 300 cells per cubic millimetre with every identifiable cause
  ruled out. But the same term also cross-references OMIM:615518, which is
  immunodeficiency 13, a specific Mendelian disorder attributed to UNC119; the
  curation stub for this disease inherited both identities, listing "IMD13" and
  "immunodeficiency type 13" among the synonyms and UNC119 among the genes.
  This entry follows the clinical definition, because that is what the
  literature under this name is about and what the cited cohorts enrolled.
  No causal gene is bound as the cause of ICL, and that is a deliberate
  structural claim rather than an omission: the defining criterion requires
  that no other immunodeficiency be demonstrable, so a patient in whom a
  monogenic cause is found ceases to have ICL. The NEJM cohort makes the
  mechanic explicit and quantifies it - 108 patients enrolled, 91 remaining
  "after the exclusion of patients with genetic and acquired causes of CD4
  lymphopenia". ICL is therefore better read as a provisional category that
  patients leave as causes are identified than as a disease with a gene.
  The RAG1 entry in the genetic section is recorded on that understanding. It
  is a statement about the differential, not about ICL's own aetiology, and its
  notes say so. Hypomorphic RAG1, MAGT1, JAK3 and CD4 variants have each been
  found in patients carrying an ICL label; each finding removes that patient
  from the category. Only RAG1 is curated here, because it is the one for which
  a primary report was fetched and quoted; the others are named in the deep
  research report but were not curated on that authority alone.
  Running `just preflight-dr` against this entry's report produces a warning
  that looks alarming and is not. It reports the expected gene as UNC119
  (mentioned 3 times) against a "rival gene" CD4 (mentioned 112 times). CD4 is
  not a rival disease gene here - it is the surface marker that defines the
  syndrome - and MAGT1, RAG1 and GATA2 appear because they are the monogenic
  causes that must be excluded before the label applies. The warning is a
  direct consequence of the MONDO conflation described above: MONDO has
  attached a Mendelian gene to a clinical diagnosis of exclusion.
  Autoimmune Disease is deliberately left with no incoming causal edge. The
  obvious edge would run from the autoantibody node, and the cited source
  argues against it: the autoantibody repertoire is "unrelated quantitatively
  or qualitatively to the patients' autoimmune disease status". The
  alternative, an edge from the depletion node, is contradicted in the other
  direction - deeper CD4 depletion carries lower odds of autoimmunity (odds
  ratio 0.5), not higher. Both candidate edges are therefore unsupported, and
  the mechanism connecting lymphopenia to clinical autoimmunity in ICL is not
  established. Vitiligo hangs off Autoimmune Disease rather than off the
  pathophysiology chain for the same reason.
  Deep research: one claude_code provider report, with 19/19 references
  resolved and no confabulation. Its term validation flagged that it offered
  HP:0004802 as "Lymphopenia" when that identifier is Episodic hemolytic
  anemia; that term was not used. Every snippet in this entry is quoted from a
  primary reference fetched directly, not from the report.
  Not curated, and why. No GeneReviews chapter was sought, since ICL is not a
  Mendelian disorder and the exclusion of monogenic causes is definitional. No
  prevalence record is asserted: the cited cohorts are referral series from a
  single national centre and no population-based rate was found. No animal
  model is curated - the syndrome is defined by the absence of an identified
  cause, which is not a thing a model can reproduce. Treatment beyond IL-7 is
  limited to management of the individual opportunistic infections, which
  belongs to those diseases rather than to this one.

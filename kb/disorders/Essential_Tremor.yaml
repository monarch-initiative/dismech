- name: ETM5
  display_name: "Hereditary essential tremor 5 (TENM4)"
  description: >-
    The TENM4-defined hereditary essential tremor class. Heterozygous missense
    variants in TENM4, a teneurin that regulates axon guidance and central nervous
    system myelination, segregated with ET in three Spanish families. Patient alleles
    mislocalized in oligodendrocyte precursor cells and disrupted axon guidance in
    zebrafish, consistent with a dominant-negative action. A sequencing screen of
    Chinese ET patients found no nonsynonymous TENM4 variants, so this form has not
    been confirmed outside the original families.

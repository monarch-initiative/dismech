- accession: geo:GSE134426
  title: Next Generation Sequencing Facilitated Cerebellum DNA Methylation Analysis of Essential Tremor Patients
  description: We report the RRBS-based cerebellum DNA methylation profiling of essential tremor (ET) patients and controls. By obtaining over thirty billion bases of sequence from bisulfited-converted DNA, we generated genome-wide methylation profile of human cerebellum tissue. We identified differential DNA methylation patterns in 735 genes at various gene parts, across 12 ET patients. Many of those differentially methylated CpGs in ET patients are located in upstream regulatory regions of genes. We further found that many differentially methylated genes in ET pateints are associated with neurodegenerative disease.
  organism:

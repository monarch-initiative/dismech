    reference_title: "A functional variant of the dopamine D3 receptor is associated with risk and age-at-onset of essential tremor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is associated and cosegregates with familial ET in 23 out of 30 French families"
    explanation: >-
      The founding family study that defines the DRD3 (ETM1) form: Ser9Gly cosegregated
      with familial ET in most of the French families examined.
  - reference: PMID:24054403
    reference_title: "Meta-analysis of the influence of DRD3 Ser9Gly variant on susceptibility for essential tremor."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the present meta-analysis does not support the notion that the DRD3 Ser9Gly variant is a genetic risk factor for ET"
    explanation: >-
      A meta-analysis of seven case-control studies found no association between
      Ser9Gly and ET under any genetic model, contradicting DRD3 as an ET gene.
- name: ETM4
  display_name: "Hereditary essential tremor 4 (FUS)"
  description: >-
    The FUS-defined hereditary essential tremor class, identified by exome sequencing
    of a large French-Canadian family carrying the nonsense variant p.Gln290Ter, with
    two further rare missense variants in a screen of 270 ET cases. The ET nonsense
    allele is cleared by nonsense-mediated decay, unlike the FUS variants that cause
    amyotrophic lateral sclerosis, which argues for a loss-of-function mechanism
    distinct from FUS-ALS.

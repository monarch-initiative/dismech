    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have shown that the ET FUS nonsense mutation is degraded by the nonsense-mediated-decay pathway, whereas amyotrophic lateral sclerosis FUS mutant transcripts are not"
    explanation: >-

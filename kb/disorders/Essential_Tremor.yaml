- name: ETM6
  display_name: "Hereditary essential tremor 6 (NOTCH2NLC)"
  description: >-
    The NOTCH2NLC-defined hereditary essential tremor class: an expanded GGC repeat in
    the 5' region of NOTCH2NLC that cosegregated with ET in Chinese pedigrees, with
    more severe tremor and genetic anticipation in carriers. The same expansion causes
    neuronal intranuclear inclusion disease (NIID), and on long-term follow-up a
    minority of expansion carriers first diagnosed with ET were reclassified as
    ET-plus or ET-NIID, so the boundary between this form and NIID is not settled.
    The expansion has not been found in European ET patients.

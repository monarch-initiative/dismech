- accession: dbgap:phs000966
  title: Family Study of Essential Tremor (FASET)
  description:  The Familial Study of Essential Tremor (FASET) was designed to identify susceptibility genes for Essential Tremor. ET is among the most common neurological diseases with a prevalence (age > 40 years) estimated to be 4.0% and prevalence in advanced age (' 90 years) exceeding 20%. ET, often referred to as "familial tremor", is generally regarded as a highly genetic disorder with families with affecteds over multiple generations, and twin studies showing high concordance among monozygotic twins. Probands (affected with ET) and relatives were enrolled in a family study of ET at Columbia
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Essential Tremor"). Retrieved 2026-08-02.

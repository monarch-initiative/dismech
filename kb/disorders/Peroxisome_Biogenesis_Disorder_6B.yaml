progression:
- phase: Childhood onset, slow progression, survival into adult life
  notes: >-
    This is the prognostic fact that separates the entry from PBD6A, where death usually
    occurs in the first year. First symptoms in the reported ataxic cohort appear between
    about three and eight years of age, progression is slow, and affected individuals reach
    adulthood - the founding report describes an adult patient, and an independent family
    contributed three adults.
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A literature search yielded 14 similar patients from nine families with PEX10-related
      cerebellar ataxia, most of them presenting their first symptoms between 3 and 8 years
      of age.
    explanation: States the age of onset across the reported cohort.
  - reference: PMID:27230853
    reference_title: "Expanding the spectrum of PEX10-related peroxisomal biogenesis disorders: slowly progressive recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at onset was in childhood or in adolescence (3-15 years)."
    explanation: >-
      An independent family's onset range, which extends the upper bound into adolescence
      and is reported in adults.
genetic:
- name: PEX10
  gene_term:
    preferred_term: PEX10
    term:
      id: hgnc:8851
      label: PEX10
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    Peroxin-10 is a peroxisomal membrane protein with a C-terminal C3HC4 zinc-finger RING
    motif. The alleles reported in this band are predominantly missense and several lie in
    or beside that motif: p.Cys276Phe and p.Arg311Gln in a French family, p.C307Y opposite
    an initiation-codon change in a Japanese sibship, p.G70E with p.L277P in a Chinese
    proband reported as PBD6B, and homozygous p.Leu177Arg in an attenuated case. The
    founding genotype-phenotype survey's mild-band allele was H290Q.
  evidence:
  - reference: PMID:9700193
    reference_title: "Mutations in PEX10 is the cause of Zellweger peroxisome deficiency syndrome of complementation group B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results demonstrate that mutation in PEX10 is the genetic cause of complementation group B PBD."
    explanation: >-
      Establishes the gene-disease relationship for the locus, by complementation. Quoted
      from a primary report rather than taken from the sibling entry.
  - reference: CGGV:assertion_c0f7f094-ac3b-4309-ad8f-8e604f006485-2019-12-06T050000.000Z
    reference_title: "PEX10 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PEX10 | HGNC:8851 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive
    explanation: >-
      ClinGen's Peroxisomal Disorders expert panel classifies the PEX10 gene-disease
      relationship as Definitive, with autosomal recessive inheritance. The assertion is
      made against the grouping concept MONDO:0019234 peroxisome biogenesis disorder rather
      than against this entry's MONDO:0013937, so it establishes the gene and the mode of
      inheritance for the locus and says nothing about the severity band.
  - reference: PMID:20695019
    reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutations in PEX10 were found in the child, c.992G>A (novel) and c.764_765insA,
      and in the adult, c.2T>C (novel) and c.790C>T.
    explanation: >-
      The genotypes in the two patients who founded the ataxic presentation, each a
      compound heterozygote.
  - reference: PMID:30640048
    reference_title: "Ataxia with novel compound heterozygous PEX10 mutations and a literature review of PEX10-related peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PEX10 gene test showed compound heterozygous mutations (c.209 G > A, p. G70E and
      c.830 T > C, p. L277 P).
    explanation: >-
      The genotype in the one patient in the literature explicitly labelled peroxisome
      biogenesis disorder 6B, which is the label this entry is scoped to.
  - reference: PMID:40267090
    reference_title: "Identification of novel compound heterozygous variants in the PEX10 gene in a Han-Chinese family with PEX10-related peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous variants, a novel splicing variant c.113-2A>G and a reported
      substitution c.890T>C (p.Leu297Pro), in the peroxisomal biogenesis factor 10 gene
      (PEX10) were detected.
    explanation: >-
      A second family assigned to this entry's label, and a genotype that shows the
      residual-function requirement is met by one allele rather than two: the splicing
      variant deletes 27 residues in frame while the other allele is missense.
  - reference: PMID:28784167
    reference_title: "Identification of a novel mutation in PEX10 in a patient with attenuated Zellweger spectrum disorder: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis was confirmed by next generation sequencing analysis, which showed a novel
      homozygous mutation (c.530 T > G (p.Leu177Arg) (NM_153818.1)) in the PEX10 gene
      predicted to be pathogenic.
    explanation: >-
      A homozygous missense genotype at the mild end, which is why the pathophysiology node
      records COMPOUND_HETEROZYGOUS as the commoner configuration rather than a requirement.
biochemical:
- name: Very-long-chain fatty acid ratios
  context: >-
    The C24:0/C22:0 and C26:0/C22:0 ratios, rather than the absolute very-long-chain fatty
    acid concentrations, are what is abnormal at this end of the spectrum.
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VLCFA ratios (C24:0/C22:0 and/or C26:0/C22:0), though, were elevated in 11/11 cases.
    explanation: >-
      The ratios were abnormal in every patient in whom they were measured, which is what
      makes them the analyte to ask for.
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phytanic acid was elevated in 8/12 patients, while absolute concentrations of VLCFA
      levels were in normal limits in several patients.
    explanation: >-
      Refutes the use of the absolute very-long-chain fatty acid concentration as the screen
      here. A normal absolute value carries no exclusionary weight at this end of the
      spectrum.
  notes: >-
    A normal absolute plasma very-long-chain fatty acid concentration does not exclude
    PEX10 disease at this end of the spectrum; the ratios and phytanic acid are what move.
    Cultured fibroblasts can mislead in the same direction - one PEX10 patient with
    abnormal blood metabolites had normal results across multiple peroxisomal pathways in
    fibroblasts - which is why molecular testing is the route to the diagnosis.
diagnosis:
- name: Targeted peroxisomal metabolic screen
  description: >-
    Plasma phytanic acid together with the very-long-chain fatty acid ratios, requested
    specifically rather than as part of a generic panel, in a child with unexplained
    recessive ataxia and cerebellar atrophy.
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest including measurement of phytanic acid and VLCFA ratios in metabolic
      screening tests in unexplained autosomal recessive ataxias with cerebellar atrophy,
      especially when there is an early onset and symptoms are mild.
    explanation: >-
      The authors' own diagnostic recommendation, scoped to exactly the clinical situation
      this entry describes.
- name: PEX gene sequencing
  description: >-
    Molecular confirmation by identifying biallelic PEX10 variants. At this end of the
    spectrum it is not merely confirmatory: biochemical and fibroblast studies can be
    normal, so sequencing may be the only route to the diagnosis.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive clinical and
      biochemical findings above by identification of biallelic pathogenic variants in one
      of the 13 known ZSD-PEX genes.
    explanation: States the confirmatory test and the gene set it covers.
  - reference: PMID:19127411
    reference_title: "A PEX10 defect in a patient with no detectable defect in peroxisome assembly or metabolism in cultured fibroblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case highlights that molecular analysis may be essential to the diagnosis of
      patients at the milder end of the ZSD spectrum.
    explanation: >-
      The authors' conclusion from a PEX10 patient whose fibroblast studies were entirely
      normal, which is the specific reason sequencing is not optional here.
treatments:
- name: Symptomatic and supportive management
  description: >-
    There is no disease-modifying therapy. Management is symptomatic and, for this band,
    is dominated by the sensory and motor consequences: hearing aids, refractive
    correction, fat-soluble vitamin supplementation, and rehabilitation for the ataxia and
    neuropathy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide adequate
      calories, hearing aids, cataract removal, glasses to correct refractive errors,
      supplementation of fat-soluble vitamins, and cholic acid supplementation
    explanation: >-
      The GeneReviews management statement for the spectrum. The list is spectrum-wide;
      gastrostomy in particular belongs to the severe band rather than to this entry. The
      modality is OTHER because the row spans devices, surgery and supplementation, none of
      which is a behavioural intervention.
- name: Cholic acid supplementation
  description: >-
    Bile acid replacement, given because peroxisomal bile-acid biosynthesis is impaired.
    In the founding ataxia report it was started alongside dietary phytanic acid
    restriction; that report states what was done and does not report an outcome, so no
    claim of benefit in this band is made here.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:20695019
    reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bile acid supplements and dietary restriction of phytanic acid were started."
    explanation: >-
      Records that the treatment was given in ataxic-form patients. INDIRECT because the
      sentence reports an intervention, not its effect - the report gives no outcome.
  target_mechanisms:
  - target: Residual Peroxisomal Metabolic Impairment
    description: >-
      Replaces a product the impaired peroxisomal pathway makes less of; it does not restore
      matrix-protein import.
- name: Dietary phytanic acid restriction
  description: >-
    Restriction of dietary phytanic acid, the substrate that accumulates because
    peroxisomal alpha-oxidation is impaired. As with the bile acid supplement, the founding
    report records that it was started and not what it achieved.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20695019
    reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bile acid supplements and dietary restriction of phytanic acid were started."
    explanation: >-
      Same sentence, for the dietary arm. INDIRECT for the same reason: an intervention is
      recorded, an outcome is not.
  target_mechanisms:
  - target: Elevated circulating phytanic acid
    description: >-
      Acts on the substrate rather than on the enzyme deficiency, by lowering the load the
      impaired alpha-oxidation pathway has to clear.
- name: Multisystem surveillance
  description: >-
    Annual audiology and ophthalmology; annual liver function, coagulation and liver
    imaging; head MRI for white matter change; developmental and educational review; ACTH
    and cortisol from age one and annually; six-monthly dental examination; annual urine
    oxalate-to-creatinine ratio. For a child presenting with isolated ataxia the audiology
    and ophthalmology arms matter most, because sensory loss is the manifestation that
    accrues silently.
  treatment_term:
    preferred_term: multisystem surveillance schedule
  notes: >-
    Deliberately left unbound, and the meaning is carried in preferred_term. The
    TreatmentActionTerm enum is rooted at NCIT:C25218 Clinical Intervention or Procedure.
    Searching NCIT through the OLS search API by label for "surveillance" and for
    "monitoring" returns two plausible candidates, NCIT:C15719 Surveillance and
    NCIT:C53607 Patient Monitoring; asking OLS for each one's hierarchical ancestors shows
    neither has NCIT:C25218 among them. C15719 sits under Observational Study and Clinical
    Study, which is a study design rather than a clinical action, and C53607 sits under
    Monitoring and Action. Neither is a legal value for this slot.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annual audiology and ophthalmologic evaluations; annual monitoring of liver function
      and coagulation factors, and ultrasound and/or fibroscan to evaluate liver
      architecture
    explanation: Specifies the core surveillance intervals.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACTH and cortisol levels by age one year and annually thereafter."
    explanation: >-
      Adrenal surveillance is scheduled from infancy because insufficiency develops
      progressively rather than presenting at diagnosis.
differential_diagnoses:
- name: Peroxisome biogenesis disorder 6A (Zellweger)
  description: >-
    The severe band at the same locus. Separated not by gene but by residual peroxin-10
    function, and in practice by the presence of congenital malformations and death in the
    first year.
  distinguishing_features:
  - Congenital malformations - neuronal migration defect, renal cysts, epiphyseal stippling
  - Truncating alleles on both sides rather than a retained-function missense allele
  - Death in the first year of life without developmental progress
  evidence:
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four PEX10-deficient Zellweger Syndrome (ZS) patients were found to have
      nonsense, frameshift, or splice site mutations that remove large portions of the
      PEX10 coding region.
    explanation: >-
      The mutational class of the severe band, contrasted in the same survey with the
      missense allele of the mild band.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die during the first
      year of life, usually having made no developmental progress.
    explanation: The clinical outcome that separates the two bands.
- name: Other autosomal recessive cerebellar ataxias
  description: >-
    The clinical differential this entry is actually met in: a child or young adult with
    progressive ataxia, cerebellar atrophy and an axonal neuropathy. A peroxisomal
    biogenesis disorder is not the first consideration and is missed unless the specific
    analytes are requested.
  distinguishing_features:
  - Raised phytanic acid and raised very-long-chain fatty acid ratios
  - Absolute very-long-chain fatty acid concentrations may be normal
  - Biallelic PEX10 variants on sequencing
  evidence:
  - reference: PMID:20695019
    reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peroxisomal biogenesis disorders should be considered in the differential diagnosis
      of autosomal recessive ataxia.
    explanation: The authors' own statement of where this entry sits in a clinical differential.
- name: Zellweger spectrum disorders of other complementation groups
  description: >-
    The other twelve ZSD-PEX genes produce overlapping phenotypes across the same severity
    range. The distinction is molecular, and it does not change management.
  distinguishing_features:
  - Different causal PEX gene on sequencing
  - Clinically and biochemically overlapping at the same point on the severity range
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the term "ZSD" is now used to refer to all individuals with a defect in one of the
      ZSD-PEX genes regardless of phenotype
    explanation: >-
      States the current gene-agnostic framing, which is why the differential between
      complementation groups is molecular rather than clinical.
discussions:
- discussion_id: normal_biochemistry_at_the_mild_end
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Partial Failure of Peroxisomal Matrix Protein Import
  - biochemical#Very-long-chain fatty acid ratios
  prompt: >-
    How often is every standard peroxisomal test - plasma very-long-chain fatty acids and
    cultured-fibroblast assays - normal in a patient who nevertheless has biallelic PEX10
    variants and disease?
  rationale: >-
    Two independent observations say the standard screen can be silent at this end of the
    allelic series: the absolute very-long-chain fatty acid concentration is normal in
    several of the reported ataxic patients, and one PEX10 patient with clearly abnormal
    blood metabolites had normal results across multiple peroxisomal pathways in cultured
    fibroblasts. Neither observation comes with a denominator for false negatives, because
    both come from patients who were eventually diagnosed. Nobody has counted the patients
    in whom the screen was normal and the diagnosis was therefore never made, so the true
    sensitivity of a peroxisomal screen in unexplained recessive ataxia is unknown. That is
    the number a clinician deciding whether to sequence needs.
  evidence:
  - reference: PMID:19127411
    reference_title: "A PEX10 defect in a patient with no detectable defect in peroxisome assembly or metabolism in cultured fibroblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the abnormal metabolites detected in blood (phytanate, bile acid
      intermediates and pipecolate), analysis of multiple peroxisomal pathways in
      fibroblasts yielded normal results.
    explanation: >-
      A PEX10 patient in whom the fibroblast assays - the reference method for a biogenesis
      disorder - were entirely normal.
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phytanic acid was elevated in 8/12 patients, while absolute concentrations of VLCFA
      levels were in normal limits in several patients.
    explanation: >-
      The blood-side version of the same problem: the analyte most laboratories report was
      normal in several patients who had the disease.
- discussion_id: where_the_ataxic_form_belongs
  kind: CONTROVERSY
  attaches_to:
  - disease#
  - has_subtypes#Ataxic form
  prompt: >-
    Is the PEX10 ataxic form part of peroxisome biogenesis disorder 6B, or a third band
    distinct from both 6A and the neonatal adrenoleukodystrophy presentation?
  rationale: >-
    The literature says both things. One group describes PEX10 as causing three subtypes -
    Zellweger syndrome, neonatal adrenoleukodystrophy and an ataxic form - which reads as a
    third band alongside, not inside, the 6B concept; the existing dismech entry for
    peroxisome biogenesis disorder 6A follows that reading and carries the ataxic form as a
    differential diagnosis. Against that, a published ataxic patient is labelled peroxisome
    biogenesis disorder 6B by the authors reporting him, and the OMIM concept that
    MONDO:0013937 maps to covers the milder PEX10 phenotypes generally. This entry takes
    the second reading, because the A/B pair is a severity split with only two members and
    an ataxic form that sat outside both would have no ontology class to live in. The
    consequence is recorded rather than hidden: the ataxic form is curated here as a
    subtype, and the peroxisome biogenesis disorder 6A entry's differential row describing
    it now overlaps this entry.
  evidence:
  - reference: PMID:28320181
    reference_title: "Ataxic form of autosomal recessive PEX10-related peroxisome biogenesis disorders with a novel compound heterozygous gene mutation and characteristic clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mutation of this gene causes 3 subtypes of peroxisome biogenesis disorders,
      namely Zellweger syndrome (severe), neonatal adrenoleukodystrophy (moderate) and an
      ataxic form (mild)
    explanation: The three-band reading, which treats the ataxic form as its own subtype.
  - reference: PMID:30640048
    reference_title: "Ataxia with novel compound heterozygous PEX10 mutations and a literature review of PEX10-related peroxisome biogenesis disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To describe the clinical and genetic features of a Chinese peroxisome biogenesis
      disorder 6B patient with PEX10 mutations and review PEX10-related peroxisomal
      disorders.
    explanation: >-
      The competing reading, in which an ataxic patient simply is a peroxisome biogenesis
      disorder 6B patient. Recorded as refuting the three-band framing above, because the
      two cannot both be the right way to file this presentation.
  - reference: PMID:40267090
    reference_title: "Identification of novel compound heterozygous variants in the PEX10 gene in a Han-Chinese family with PEX10-related peroxisome biogenesis disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three patients had similar phenotypes of milder PBDs, which were further
      genetically determined as PBD6B.
    explanation: >-
      A second, independent group assigning milder PEX10 disease to the PBD6B label
      directly. Recorded on the same side as the sentence above: it treats PBD6B as the
      home of milder PEX10 disease generally rather than of one named presentation.
notes: >-
  Lump/split decision: DISEASE, curated as the mild band of the PEX10 allelic series at
  MONDO:0013937, and not as a has_subtypes row on peroxisome biogenesis disorder 6A. That
  follows repository precedent. Two A/B pairs are already curated as separate Disease
  entries at exactly this granularity - 4A/4B and 11A/11B - and they are the direct
  analogue of this pair. Peroxisome_Biogenesis_Disorder_1B and _2B are also separate
  entries, although their A arms are still uncurated stubs. The decision also follows the
  ontology, which gives 6A and 6B separate MONDO and OMIM identifiers. The stub is retired
  accordingly.

  Within the entry, the ataxic form and the neonatal adrenoleukodystrophy presentation are
  curated as two has_subtypes rows rather than as one undifferentiated mild band. They are
  not equally evidenced and the entry should not be read as if they were. The ataxic form
  has a real literature: fourteen patients from nine families, several independent case
  series, and a paper that labels its patient peroxisome biogenesis disorder 6B in so many
  words. The neonatal adrenoleukodystrophy presentation at this locus rests on one patient
  in the 2000 genotype-phenotype survey, and everything else recorded for it here - retinal
  dystrophy, liver dysfunction - comes from the spectrum-wide GeneReviews description of
  intermediate and milder ZSD rather than from any PEX10 source. Those two phenotypes are
  scoped to that subtype and their evidence items are graded accordingly.

  Neither has_subtypes row carries a subtype_term, and that is a searched answer rather
  than an omission. Searching MONDO through the OLS search API for "neonatal
  adrenoleukodystrophy" returns two classes, MONDO:0009919 peroxisomal acyl-CoA oxidase
  deficiency and MONDO:0019234 peroxisome biogenesis disorder, which carry the string as a
  synonym; searching for "infantile Refsum disease" returns only MONDO:0019234. Both are
  the wrong concept here - one is a single-enzyme defect at a different locus, the other
  the whole-class grouping - so binding either would assert something false. No MONDO class
  exists for a PEX10 ataxic form.

  Whether the ataxic form belongs inside 6B at all is genuinely contested in the sources,
  and is recorded as a CONTROVERSY discussion rather than settled silently. Note the
  practical consequence for the KB: the peroxisome biogenesis disorder 6A entry carries a
  differential row for the PEX10 ataxic form, written on the reading that it is a third
  band. That row and this entry now describe the same patients.

  Ataxia is bound to HP:0001251, for which "Cerebellar ataxia" is HPO's own exact synonym.
  Searching HPO through the OLS search API for "cerebellar ataxia" returns fourteen hits
  and no class carrying that string as its primary label: HP:0001251 Ataxia holds it as a
  synonym, and the nearest labelled alternatives are the course-qualified HP:0002073
  Progressive cerebellar ataxia and HP:0002470 Nonprogressive cerebellar ataxia.
  HP:0002073 was considered and not taken. The reported patients are not uniformly
  described as progressive - the index case of the most recent series presented subacutely -
  and this repository's convention is to carry course on the clinical_course slot rather
  than inside the term, which is what this binding does.

  Cognitive impairment carries a REFUTE evidence item alongside its supporting one. This is
  deliberate and not an inconsistency: the finding is present in nine of fourteen reported
  patients and explicitly absent in the two who founded the presentation, and a reader using
  normal intelligence to exclude the diagnosis would be wrong.

  Two absences are worth naming. No animal model is curated: no PEX10-specific model is
  reported in the sources cited here. And no treatment in this entry has a reported outcome
  - the bile acid supplement and the phytanic acid restriction are recorded as having been
  started, with no follow-up data, which is why both carry directness INDIRECT rather than
  an efficacy claim.

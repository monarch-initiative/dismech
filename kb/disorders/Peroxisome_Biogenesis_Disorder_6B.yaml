  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Progressive loss of cerebellar tissue, visible as cerebellar atrophy on MRI in almost
    every reported patient and clinically as ataxia, intention tremor and nystagmus. It is
    the defining lesion of this band, and its selectivity - cerebellum first, in a disorder
    of an organelle present in every cell - is unexplained.

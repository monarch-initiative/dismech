has_subtypes:
- name: Ataxic form
  display_name: PEX10-related cerebellar ataxia (childhood-onset ataxic form)
  description: >-
    Childhood-onset, slowly progressive cerebellar ataxia with axonal polyneuropathy,
    cognitive impairment and cerebellar atrophy, in patients of otherwise normal or only
    mildly impaired intellect who reach adult life. This is the presentation that dominates
    the reported PBD6B literature, and it is the one published explicitly under the PBD6B
    label.
  evidence:
  - reference: PMID:30640048
    reference_title: "Ataxia with novel compound heterozygous PEX10 mutations and a literature review of PEX10-related peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified an ataxia case of peroxisome biogenesis disorder 6B caused by novel compound heterozygous mutations of the PEX10 gene."
    explanation: >-
      The sentence that ties the ataxic presentation to the PBD6B label specifically, rather
      than to PEX10 disease in general. It is the basis for curating the ataxic form inside
      this entry rather than as a separate concept.
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A literature search yielded 14 similar patients from nine families with PEX10-related
      cerebellar ataxia, most of them presenting their first symptoms between 3 and 8 years
      of age.
    explanation: >-
      The size and age of onset of the reported population of this subtype. Fourteen
      patients from nine families is the whole published series, and the reader should
      have that denominator in mind for every frequency quoted in this entry.
- name: NALD-IRD
  display_name: Neonatal adrenoleukodystrophy / infantile Refsum disease presentation
  description: >-
    The older phenotype labels for the intermediate band of the Zellweger spectrum:
    progressive peroxisomal failure with sensory loss, liver dysfunction and developmental
    delay, but without the congenital malformations of classic Zellweger syndrome. This is
    the presentation the founding PEX10 genotype-phenotype survey described in its one
    mildly affected patient.
  evidence:
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, a more mildly affected PEX10-deficient neonatal adrenoleukodystrophy
      patient expressed a PEX10 allele with a missense mutation, H290Q, affecting the
      C-terminal zinc-binding domain of the PEX10 product.
    explanation: >-
      The one PEX10 patient carrying the neonatal adrenoleukodystrophy label in the survey
      that separated the severe from the mild band, and the allele she carried.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations, but
      rather progressive peroxisome dysfunction variably manifest as sensory loss
      (secondary to retinal dystrophy and sensorineural hearing loss), neurologic
      involvement (ataxia, polyneuropathy, and leukodystrophy), liver dysfunction, adrenal
      insufficiency, and renal oxalate stones.
    explanation: >-
      GeneReviews characterisation of the band these older labels describe. Quoted from the
      spectrum resource rather than from a PEX10 source because no PEX10-specific series
      describes this presentation in comparable detail.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No numeric prevalence is available for this entry. The reported population of the
    ataxic form is fourteen patients from nine families assembled by literature review;
    the neonatal adrenoleukodystrophy presentation at this locus rests on a single patient
    in the founding genotype-phenotype survey. No source cited here gives a rate, a
    denominator, or PEX10's share of the Zellweger spectrum, so none is asserted.
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A literature search yielded 14 similar patients from nine families with PEX10-related
      cerebellar ataxia, most of them presenting their first symptoms between 3 and 8 years
      of age.
    explanation: >-
      Quoted for the denominator. Fourteen patients is the entire reported ataxic-form
      population, which is why this entry asserts a qualitative band rather than a rate.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PEX10 variants, and specifically genotypes leaving residual peroxin-10
    function on at least one allele. Reported patients in the ataxic form are compound
    heterozygotes combining a missense allele with a second, often truncating, allele.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an individual with biallelic ZSD-causing pathogenic
      variants has a 25% chance of being affected, a 50% chance of being an asymptomatic
      carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risk that genetic counselling for this entry turns on, stated for the
      spectrum as a whole.
  - reference: PMID:28320181
    reference_title: "Ataxic form of autosomal recessive PEX10-related peroxisome biogenesis disorders with a novel compound heterozygous gene mutation and characteristic clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 3 siblings are compound heterozygous for a previously reported mutation, c.2T>C
      (p.M1T), and a novel mutation, c.920G>A, causing a missense change (p.C307Y) located
      in the RING finger domain of PEX10.
    explanation: >-
      A worked biallelic genotype in the ataxic form, and the recessive segregation across
      three affected siblings.
pathophysiology:
- name: Biallelic Hypomorphic PEX10 Genotype
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both PEX10 alleles carry variants, but at least one retains partial peroxin-10
    function. In the reported ataxic patients these are missense changes, several of them
    in or adjacent to the C-terminal RING finger, carried opposite a second allele that may
    itself be severe. The residual-function threshold, not gene identity, is what separates
    this entry from PBD6A.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    gene:
      preferred_term: PEX10
      term:
        id: hgnc:8851
        label: PEX10
    description: >-
      Missense alleles predominate. Homozygous missense genotypes are also reported at the
      mild end, so COMPOUND_HETEROZYGOUS records the commoner reported configuration rather
      than a requirement.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support the hypothesis that severe, loss-of-function mutations in PEX
      genes cause more severe clinical phenotypes, whereas mildly affected PBD patients
      have PEX gene mutations that retain residual function.
    explanation: >-
      The residual-function account that defines this entry against PBD6A, stated by the
      survey that assembled both bands.
  - reference: PMID:27230853
    reference_title: "Expanding the spectrum of PEX10-related peroxisomal biogenesis disorders: slowly progressive recessive ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With whole exome sequencing, two mutations in PEX10 were found in the three patients:
      c.827G>T (novel) causing the missense change p.Cys276Phe and c.932G>A causing the
      missense change p.Arg311Gln.
    explanation: >-
      A worked mild-band genotype: two missense alleles, in a family whose disease was
      slowly progressive and compatible with adult life.
  downstream:
  - target: Partial Loss of Peroxin-10 RING Function
    description: >-
      The reported mild alleles cluster in and around the C-terminal zinc-binding RING
      module, the part of the protein that carries its function, but alter rather than
      remove it.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28320181
      reference_title: "Ataxic form of autosomal recessive PEX10-related peroxisome biogenesis disorders with a novel compound heterozygous gene mutation and characteristic clinical phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a novel mutation, c.920G>A, causing a missense change (p.C307Y) located in the RING
        finger domain of PEX10
      explanation: >-
        Places a mild-band allele inside the RING finger domain, which is what this edge
        asserts.
- name: Partial Loss of Peroxin-10 RING Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Peroxin-10 is a peroxisomal membrane protein whose C-terminal C3HC4 zinc-finger RING
    motif carries its function. A missense change in that module degrades the activity
    rather than abolishing it, which is the molecular difference between this entry and the
    severe band.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:10862081
    reference_title: "Phenotype-genotype relationships in PEX10-deficient peroxisome biogenesis disorder patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Although these results demonstrate serious flaws in the PEX10 functional
      complementation assay, they do suggest that the C-terminal zinc-binding domain is
      critical for PEX10 function.
    explanation: >-
      Supports the claim while carrying the authors' own caveat about the assay that
      produced it. Quoted whole rather than trimmed to the supportive clause. Marked
      INDIRECT because, with the assay called into question by its own authors, the domain
      claim rests on the mutational pattern rather than on activity measurements.
  - reference: PMID:35768507
    reference_title: "A peroxisomal ubiquitin ligase complex forms a retrotranslocation channel."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Recycling requires receptor modification by a membrane-embedded ubiquitin ligase
      complex comprising three RING finger domain-containing proteins (Pex2, Pex10 and
      Pex12)
    explanation: >-
      Names the complex peroxin-10's RING domain belongs to, and what it does. Quoted
      rather than paraphrased because the subunit naming is the load-bearing detail.
      INDIRECT: the structure was solved in a fungal system, so the human claim rests on
      conservation.
  - reference: PMID:35768507
    reference_title: "A peroxisomal ubiquitin ligase complex forms a retrotranslocation channel."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Each subunit of the complex contributes five transmembrane segments that co-assemble
      into an open channel. The three ring finger domains form a cytosolic tower, with ring
      finger 2 (RF2) positioned above the channel pore.
    explanation: >-
      The architectural reason a missense change in one RING domain degrades rather than
      abolishes the assembly: each of the three subunits contributes to a shared channel,
      and the RING domains sit above its pore. INDIRECT for the same reason as above.
  - reference: PMID:9700193
    reference_title: "Mutations in PEX10 is the cause of Zellweger peroxisome deficiency syndrome of complementation group B."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "This implies that the C-terminal part, including the RING finger, is required for biological function of Pex10p."
    explanation: >-
      Localises peroxin-10's biological function to the domain the mild alleles alter. The
      authors' own "This implies" is preserved: the inference is theirs, drawn from a
      frameshift immediately upstream of the motif rather than from a missense allele, which
      is why this is marked INDIRECT for a missense-driven node.
  downstream:
  - target: Partial Failure of Peroxisomal Matrix Protein Import
    description: >-
      Degraded RING function leaves matrix-protein import partly rather than wholly
      defective, which is what produces a cell population with some import-competent
      peroxisomes and some not.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9683594
      reference_title: "Identification of PEX10, the gene defective in complementation group 7 of the peroxisome-biogenesis disorders."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        PEX10-deficient PBD100 cells contain many peroxisomes and import peroxisomal
        membrane proteins but do not import peroxisomal matrix proteins, indicating that
        loss of PEX10 has its most pronounced effect on peroxisomal matrix-protein import.
      explanation: >-
        Establishes that the consequence of losing peroxin-10 is specifically a
        matrix-import defect. Marked INDIRECT because the cell line quoted is a severe-band
        Zellweger line with a complete defect; what this entry asserts is the partial form
        of the same defect.
- name: Partial Failure of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Matrix-protein import is reduced but not abolished. In a patient with the ataxic form
    this appears in fibroblasts as peroxisomal mosaicism - some peroxisomes importing and
    some not - together with a catalase import deficiency and abnormal organelle
    morphology. It is the cellular counterpart of the residual-function genotype, and it is
    why the biochemical signature in blood is attenuated rather than absent.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  cellular_components:
  - preferred_term: peroxisomal matrix
    term:
      id: GO:0005782
      label: peroxisomal matrix
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunohistochemistry confirmed pathogenicity in the patients' cultured fibroblasts
      demonstrating peroxisomal mosaicism with a general catalase import deficiency as well
      as conspicuous peroxisome morphology as an expression of impaired peroxisomal
      function.
    explanation: >-
      The direct cellular observation behind this node, in a patient with the ataxic form.
      Mosaicism rather than uniform failure is what distinguishes the partial defect from
      the severe band's empty organelle.
  - reference: PMID:20695019
    reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection with wild-type PEX10 corrected the fibroblast phenotype."
    explanation: >-
      A rescue experiment in ataxic-form patient cells, which is what makes the cellular
      defect attributable to the PEX10 lesion rather than merely coincident with it.
  downstream:
  - target: Residual Peroxisomal Metabolic Impairment
    description: >-
      Fewer import-competent peroxisomes means reduced flux through every peroxisomal
      pathway at once, rather than the abolition seen in the severe band.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27230853
      reference_title: "Expanding the spectrum of PEX10-related peroxisomal biogenesis disorders: slowly progressive recessive ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biochemical blood analyses suggested a mild peroxisomal defect."
      explanation: >-
        The whole-organism biochemical reading of the cellular defect in ataxic-form
        patients: present, and mild.
- name: Residual Peroxisomal Metabolic Impairment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Peroxisomal beta-oxidation and phytanic acid handling run below normal without failing.
    The measurable consequences are a raised phytanic acid and raised very-long-chain fatty
    acid ratios, against absolute very-long-chain fatty acid concentrations that are often
    within the reference interval - which is the reason this band is missed on a
    conventional peroxisomal screen.
  biological_processes:
  - preferred_term: very long-chain fatty acid catabolic process
    modifier: DECREASED
    term:
      id: GO:0042760
      label: very long-chain fatty acid catabolic process
  evidence:
  - reference: PMID:35038753
    reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phytanic acid was elevated in 8/12 patients, while absolute concentrations of VLCFA
      levels were in normal limits in several patients. VLCFA ratios (C24:0/C22:0 and/or
      C26:0/C22:0), though, were elevated in 11/11 cases.
    explanation: >-
      The quantitative signature of a partial peroxisomal defect across the reported ataxic
      cohort, and the sentence on which this entry's diagnostic advice rests.
  downstream:
  - target: Cerebellar Degeneration
    description: >-
      The cerebellum is the organ that fails first and hardest in this band. No source cited
      here traces which lost peroxisomal function is responsible, so the intermediates are
      recorded as unknown rather than implied.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20695019
      reference_title: "Mutations in PEX10 are a cause of autosomal recessive ataxia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients had marked cerebellar atrophy."
      explanation: >-
        Establishes the cerebellar lesion in patients whose peroxisomal defect was
        demonstrated. INDIRECT: the association is shown, the route is not.
  - target: Peripheral axonal polyneuropathy
    description: >-
      Length-dependent axonal neuropathy accompanies the cerebellar disease in most reported
      patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35038753
      reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Polyneuropathy (9/14) and cognitive impairment (9/14) were common associated findings."
      explanation: Gives the frequency of the neuropathy in the reported cohort.
  - target: Cognitive impairment
    description: >-
      Cognitive impairment is common but not universal, and several reported patients had
      normal intelligence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35038753
      reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Polyneuropathy (9/14) and cognitive impairment (9/14) were common associated findings."
      explanation: Gives the frequency of cognitive impairment in the reported cohort.
  - target: Sensorineural hearing impairment
    description: >-
      Hearing loss can precede the ataxia and be the presenting complaint, which is how the
      diagnosis is most often delayed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35038753
      reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 11/14 patients, the first and main symptom was cerebellar ataxia; in three
        patients, it was sensorineural hearing impairment.
      explanation: >-
        Records hearing loss as the presenting symptom in three of fourteen reported
        patients.
  - target: Elevated circulating phytanic acid
    description: >-
      Phytanic acid alpha-oxidation is peroxisomal, so a partial biogenesis defect raises it
      directly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35038753
      reference_title: "How to Detect Isolated PEX10-Related Cerebellar Ataxia?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Metabolic screening tests aiming to detect potentially treatable ataxias showed an

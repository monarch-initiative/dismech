name: Peroxisome Biogenesis Disorder 6B
creation_date: "2026-09-25T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 6B is the mild end of the PEX10 allelic series: the same
  gene and the same lesion as peroxisome biogenesis disorder 6A, separated from it by how
  much peroxin-10 function the genotype leaves rather than by a different mechanism. The
  survey that founded the split found the two groups carrying systematically different
  kinds of allele - every PEX10 patient with the classic Zellweger phenotype carried
  nonsense, frameshift or splice variants removing large parts of the coding region, while
  the one mildly affected patient in that survey carried a missense variant in the
  C-terminal zinc-binding domain.

  What lands in this entry is therefore everything PEX10 does short of classic Zellweger
  syndrome, and in the reported literature that is dominated by one picture: a
  childhood-onset, slowly progressive cerebellar ataxia with axonal polyneuropathy and
  cognitive impairment, in patients who survive into adult life. The largest assembly of
  these patients is a literature review of fourteen individuals from nine families, most
  with first symptoms between three and eight years of age, all of whom eventually
  developed ataxia. That picture is explicitly labelled peroxisome biogenesis disorder 6B
  in the literature. The older neonatal adrenoleukodystrophy presentation sits at the
  other end of the same entry and is the one the founding genotype-phenotype survey
  described.

  The diagnostically consequential fact about this band is biochemical and it runs against
  how the Zellweger spectrum is usually screened. Absolute plasma very-long-chain fatty
  acid concentrations can be entirely normal here, while the C24:0/C22:0 and C26:0/C22:0
  ratios are raised; in the fourteen-patient review the ratios were elevated in every one
  of the eleven patients in whom they were measured, and phytanic acid was elevated in
  eight of twelve. Cultured fibroblasts can also mislead: one PEX10 patient with clearly
  abnormal blood metabolites had entirely normal results across multiple peroxisomal
  pathways in fibroblasts. A normal peroxisomal screen at this end of the spectrum does
  not exclude the diagnosis, and the route to it is molecular.

  The gene-agnostic downstream cascade shared by the whole spectrum is curated on the
  Zellweger Spectrum Disorders entry, and the severe PEX10 band is curated as peroxisome
  biogenesis disorder 6A. What is carried here is what is PEX10-specific and specific to
  the attenuated band.
synonyms:
- PBD6B
- peroxisome biogenesis disorder type 6B
- PEX10-related neonatal adrenoleukodystrophy
- PEX10-related cerebellar ataxia
- attenuated PEX10-related Zellweger spectrum disorder

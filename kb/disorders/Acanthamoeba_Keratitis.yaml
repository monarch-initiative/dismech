agent_life_cycle:
  description: >-
    Acanthamoeba alternates between replicating, motile trophozoites and
    dormant cysts that survive hostile conditions and resist antiamoebic drugs;
    the human cornea is an incidental clinical site, with no arthropod vector
    required.
  hosts:
    - preferred_term: Homo sapiens
      role: incidental clinical host
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
  life_cycle_stages:
    - name: Motile trophozoite
      life_cycle_stage_term:
        preferred_term: trophozoite stage
        term:
          id: OPL:0000057
          label: trophozoite stage
      description: >-
        Replicating amoebae that bind mannosylated corneal epithelial
        glycoproteins, secrete pathogenic proteases, and invade the cornea.
      evidence:
        - reference: PMID:33804353
          reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
          supports: SUPPORT
          evidence_source: OTHER
          quote_role: REVIEW_SYNTHESIS
          snippet: >-
            It exists in two forms: motile, which replicate trophozoites, and
            dormant cysts, which have minimal metabolic activity and are much more
            resistant to adverse conditions, such as extremes in temperature,
            dryness, and pH, as well as antiamoebic drugs
          explanation: >-
            Distinguishes the motile trophozoite from the dormant cyst form.
    - name: Dormant cyst
      description: >-
        Resistant cysts persist under adverse environmental or treatment
        conditions and can complicate eradication during keratitis therapy.
      evidence:
        - reference: PMID:33804353
          reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
          supports: SUPPORT
          evidence_source: OTHER
          quote_role: REVIEW_SYNTHESIS
          snippet: >-
            It exists in two forms: motile, which replicate trophozoites, and
            dormant cysts, which have minimal metabolic activity and are much more
            resistant to adverse conditions, such as extremes in temperature,
            dryness, and pH, as well as antiamoebic drugs
          explanation: >-
            Supports cysts as the dormant, treatment-resistant form relevant to
            persistent keratitis.

transmission:
  - name: Contact-lens and environmental corneal exposure
    description: >-
      Contact-lens contamination, lens wear during swimming or showering,
      overnight wear, and direct ocular exposure to contaminated water or soil
      place Acanthamoeba trophozoites onto a corneal surface made permissive by
      contact-lens wear or abrasion.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Approximately 93% of all cases of AK are reported to occur in contact
          lens wearers
        explanation: >-
          Identifies contact-lens wear as the dominant human exposure context for
          Acanthamoeba keratitis.
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Poor contact lens hygiene, such as overnight wear or wearing lenses during
          swimming and showering, is a known risk factor for AK
        explanation: >-
          Supports water exposure and poor lens hygiene as exposure patterns that
          increase risk.
      - reference: PMID:41111636
        reference_title: "Acanthamoeba keratitis: from pathophysiology to prevention, a contemporary
          clinical perspective."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Foreign body injuries or lens-handling trauma create pathogen access
          routes into corneal tissue
        explanation: >-
          Supports corneal trauma as a route that allows environmental
          Acanthamoeba to access corneal tissue.

environmental:
  - name: Corneal exposure to contaminated contact lenses, water, or soil
    description: >-
      Acanthamoeba from contaminated lenses, lens cases, water, or soil must reach
      the ocular surface before trophozoites can bind the corneal epithelium and
      initiate infection.
    presence: PRESENT
    effect: HARMFUL
    influences_mechanisms:
      - target: Mannose-Sensitive Trophozoite Corneal Adhesion
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          The exposure route places Acanthamoeba organisms at the corneal surface
          where trophozoites can bind mannosylated epithelial glycoproteins.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Poor contact lens hygiene, such as overnight wear or wearing lenses during
          swimming and showering, is a known risk factor for AK
        explanation: >-
          Identifies contact-lens water exposure and hygiene failures as the
          environmental and behavioral setting for inoculating the corneal surface.
      - reference: PMID:41111636
        reference_title: "Acanthamoeba keratitis: from pathophysiology to prevention, a contemporary
          clinical perspective."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          It is caused by Acanthamoeba, free-living amoeba distributed
          ubiquitously across environmental sources including water, soil, and air
        explanation: >-
          Directly supports water and soil as environmental sources for the
          free-living Acanthamoeba organisms that contaminate the ocular surface.
  - name: Corticosteroid treatment before Acanthamoeba keratitis diagnosis
    description: >-
      Corticosteroid exposure before antiamoebic diagnosis is associated with poor
      visual outcome in Acanthamoeba keratitis and marks a period in which
      unrecognized infection can progress before cysticidal therapy.
    presence: PRESENT
    effect: HARMFUL
    influences_mechanisms:
    - target: Treatment-Resistant Acanthamoeba Encystation and Persistence
      environmental_effect: EXACERBATES
      causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
      description: >-
        Pre-diagnostic steroid exposure is associated with poor outcomes in
        established Acanthamoeba keratitis rather than with initiating corneal
        inoculation itself.
    evidence:
    - reference: PMID:40387241
      reference_title: Genetic diversity of Acanthamoeba and clinical outcome predictors in Danish patients with Acanthamoeba keratitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Corticosteroid treatment prior to AK diagnosis, moderate-to-severe pain,
        male gender, older age, ring infiltration and infiltrate size >3 mm were
        associated with poor visual outcome.
      explanation: >-
        A Danish clinical cohort identified corticosteroid exposure before
        diagnosis among the factors associated with poor visual outcome.

prevalence:
  - population: General corneal-infection context
    measure_type: POINT_PREVALENCE
    prevalence_class: RARE
    notes: >-
      The published estimate is a range of 1-9 cases per 100,000; no single
      point estimate is asserted here.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          AK is relatively rare among corneal infections, with an estimated
          prevalence of 1–9 cases per 100,000.
        explanation: >-
          Provides the published prevalence estimate used to classify AK as rare.

progression:
  - phase: Epithelial and early perineural keratitis
    notes: >-
      Early Acanthamoeba keratitis presents with epithelial change, limbitis,
      perineural infiltrates, punctate keratitis, and multifocal stromal
      infiltrates before destructive anterior-segment complications appear.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Early clinical signs of infection include limbitis (95% of cases),
          perineural infiltrates (57% of cases), and punctate keratitis (46% of
          cases)
        explanation: >-
          Defines the early limbitis, perineural, and punctate-keratitis phase.
  - phase: Stromal ring-infiltrate keratitis
    notes: >-
      After delayed recognition and deeper stromal involvement, ring infiltrate,
      epithelial defects, and uveitis become common.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          after two months, the collection of common clinical signs continues to
          include limbitis (96% of cases), as well as a ring infiltrate (or
          “Wessely immune ring,” 83% of cases), epithelial defects (75% of cases),
          and uveitis (79% of cases)
        explanation: >-
          Supports the later stromal ring-infiltrate presentation.
  - phase: Late inflammatory and destructive complications
    notes: >-
      Severe late Acanthamoeba keratitis can extend beyond stromal infiltrates to
      scleritis and other anterior-segment complications.
    evidence:
      - reference: PMID:30899841
        reference_title: >-
          Acanthamoeba keratitis - Clinical signs, differential diagnosis and
          treatment.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          in later stages with scleritis, iris atrophy, anterior synechiae,
          secondary glaucoma, mature cataract, and chorioretinitis.
        explanation: >-
          Defines the late inflammatory and destructive complication phase.

pathophysiology:
  - name: Mannose-Sensitive Trophozoite Corneal Adhesion
    role: trigger
    biological_scale: CELLULAR
    description: >-
      Acanthamoeba trophozoites adhere to mannose-containing glycoproteins on
      corneal epithelial cells through a parasite membrane mannose-binding
      protein, establishing the first host-parasite interaction on the ocular
      surface.
    cell_types:
      - preferred_term: corneal epithelial cell
        term:
          id: CL:0000575
          label: corneal epithelial cell
    locations:
      - preferred_term: corneal epithelium
        term:
          id: UBERON:0001772
          label: corneal epithelium
    biological_processes:
      - preferred_term: adhesion of symbiont to host cell
        modifier: INCREASED
        term:
          id: GO:0044650
          label: adhesion of symbiont to host cell
    downstream:
      - target: Acanthamoeba Protease-Mediated Corneal Cytotoxicity
        causal_link_type: DIRECT
        description: >-
          Mannose-binding adhesion localizes the trophozoite to the corneal
          epithelium and initiates contact-dependent epithelial cell damage.
    evidence:
      - reference: PMID:9009294
        reference_title: >-
          Pathogenesis of Acanthamoeba keratitis: carbohydrate-mediated
          host-parasite interactions.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          In summary, a mannose-binding protein is present on the surface membranes
          of Acanthamoeba, and corneal epithelial cells express
          Acanthamoeba-reactive GPs.
        explanation: >-
          Demonstrates the parasite and corneal epithelial glycoconjugate sides of
          the mannose-mediated adhesion mechanism.
      - reference: PMID:9009294
        reference_title: >-
          Pathogenesis of Acanthamoeba keratitis: carbohydrate-mediated
          host-parasite interactions.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          One of the mechanisms of Acanthamoeba adhesion to the corneal surface may
          involve interactions between the mannose-binding protein of Acanthamoeba
          and mannose-GPs on the surface of corneal epithelium.
        explanation: >-
          Supports the causal interpretation that parasite mannose-binding protein
          engagement is an adhesion route at the corneal surface.
  - name: Acanthamoeba Protease-Mediated Corneal Cytotoxicity
    biological_scale: CELLULAR
    description: >-
      Cornea-adherent Acanthamoeba trophozoites secrete mannose-induced MIP-133
      and other proteases that kill corneal epithelial cells through cytolysis,
      phagocytosis, and programmed cell-death induction.
    cell_types:
      - preferred_term: corneal epithelial cell
        term:
          id: CL:0000575
          label: corneal epithelial cell
    biological_processes:
      - preferred_term: apoptotic process
        modifier: INCREASED
        term:
          id: GO:0006915
          label: apoptotic process
      - preferred_term: proteolysis
        modifier: INCREASED
        term:
          id: GO:0006508
          label: proteolysis
    downstream:
      - target: Corneal Stromal Matrix Dissolution
        causal_link_type: DIRECT
        description: >-
          Acanthamoeba proteases and epithelial cytolysis allow organisms to cross
          the epithelial barrier and digest extracellular matrix in the stroma.
    evidence:
      - reference: PMID:10602676
        reference_title: The pathogenesis of Acanthamoeba keratitis.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          The pathogenesis of Acanthamoeba keratitis involves parasite-mediated
          cytolysis and phagocytosis of corneal epithelial cells and induction of
          programmed cell death.
        explanation: >-
          Supports epithelial cell killing as an early parasite-mediated pathogenic
          event.
      - reference: PMID:23132804
        reference_title: Acanthamoeba-cytopathic protein induces apoptosis and
          proinflammatory cytokines in human corneal epithelial cells by cPLA2α
          activation.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: stimulates trophozoites to secrete a mannose-induced 133 kDa protease
          (MIP-133), which facilitates corneal invasion and induces apoptosis.
        explanation: Identifies MIP-133 as the mannose-induced protease linking
          trophozoite adhesion to corneal invasion and epithelial-cell apoptosis.
  - name: Corneal Stromal Matrix Dissolution
    biological_scale: TISSUE
    description: >-
      Acanthamoeba proteases dissolve the extracellular matrix of the corneal
      stroma, enabling invasion into substantia propria and causing destructive
      keratitis.
    locations:
      - preferred_term: corneal stroma
        term:
          id: UBERON:0001777
          label: substantia propria of cornea
    biological_processes:
      - preferred_term: extracellular matrix disassembly
        modifier: INCREASED
        term:
          id: GO:0022617
          label: extracellular matrix disassembly
    downstream:
      - target: Perineural Stromal Keratitis
        causal_link_type: DIRECT
        description: >-
          Stromal invasion localizes organisms and inflammation deeper in the
          cornea, including along stromal nerves.
      - target: Host Epithelial Cytokine and Granulocytic Response
        causal_link_type: DIRECT
        description: >-
          Stromal Acanthamoeba infection stimulates corneal epithelial cytokine
          release and a granulocytic inflammatory response.
      - target: Treatment-Resistant Acanthamoeba Encystation and Persistence
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Acanthamoeba within chronically infected corneal tissue can form dormant
          cysts that resist therapy and maintain infection.
    evidence:
      - reference: PMID:10602676
        reference_title: The pathogenesis of Acanthamoeba keratitis.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Acanthamoeba spp. elaborate a variety of proteases which may facilitate
          cytolysis of the corneal epithelium, invasion of the extracellular
          matrix, and dissolution of the corneal stromal matrix.
        explanation: >-
          Connects Acanthamoeba protease activity to stromal extracellular-matrix
          invasion and dissolution.
  - name: Treatment-Resistant Acanthamoeba Encystation and Persistence
    biological_scale: CELLULAR
    description: >-
      Acanthamoeba in infected corneal tissue can encyst into dormant,
      double-walled forms whose metabolic downregulation and wall components make
      the infection chronic and treatment resistant.
    locations:
      - preferred_term: cornea
        term:
          id: UBERON:0000964
          label: cornea
    downstream:
      - target: Host Epithelial Cytokine and Granulocytic Response
        causal_link_type: DIRECT
        description: >-
          Cyst persistence maintains host exposure to viable organisms and cysts
          themselves can provoke epithelial cytokine release.
    evidence:
      - reference: PMID:40738523
        reference_title: Metabolic Profile Associated With Encystation in Acanthamoeba.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          The results indicated a global metabolic downregulation during
          encystation, which is consistent with a state of dormancy. Components of
          the cyst wall such as cellobiose and lactose accumulated in the final
          phase.
        explanation: >-
          Supports Acanthamoeba encystation as a dormant, wall-forming persistence
          program.
      - reference: PMID:42885963
        reference_title: "Chronic infectious keratitis: A review of etiopathogenesis, clinical presentation and management challenges."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Acanthamoeba keratitis, commonly associated with contact lens (CL) wear
          or water exposure, is characterized by severe pain disproportionate to
          clinical findings and the presence of cyst forms that confer significant
          treatment resistance.
        explanation: >-
          Links Acanthamoeba cyst forms to the treatment resistance that makes
          keratitis chronic.
  - name: Host Epithelial Cytokine and Granulocytic Response
    biological_scale: TISSUE
    description: >-
      Acanthamoeba trophozoites and cysts stimulate corneal epithelial IL-1α,
      IL-6, IL-8, and CXCL1 release and recruit neutrophil, macrophage, and
      IL-17A-linked inflammation that contributes to stromal infiltrates and late
      scleritis.
    cell_types:
      - preferred_term: corneal epithelial cell
        term:
          id: CL:0000575
          label: corneal epithelial cell
      - preferred_term: neutrophil
        term:
          id: CL:0000775
          label: neutrophil
      - preferred_term: macrophage
        term:
          id: CL:0000235
          label: macrophage
    locations:
      - preferred_term: cornea
        term:
          id: UBERON:0000964
          label: cornea
    biological_processes:
      - preferred_term: inflammatory response
        modifier: INCREASED
        term:
          id: GO:0006954
          label: inflammatory response
      - preferred_term: neutrophil migration
        modifier: INCREASED
        term:
          id: GO:1990266
          label: neutrophil migration
      - preferred_term: macrophage activation
        modifier: INCREASED
        term:
          id: GO:0042116
          label: macrophage activation
    downstream:
      - target: Ring stromal infiltrate
        causal_link_type: DIRECT
        description: >-
          Stromal leukocyte recruitment and corneal inflammation produce the
          characteristic ring infiltrate.
      - target: Scleritis
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Advanced anterior-segment inflammation can extend to the sclera in late
          disease.
    evidence:
      - reference: PMID:31284343
        reference_title: Cytopathic Change and Inflammatory Response of Human Corneal Epithelial Cells Induced by Acanthamoeba castellanii Trophozoites and Cysts.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          A. castellanii induced the expression of IL-1α, IL-6, IL-8, and CXCL1
          in HCECs.
        explanation: >-
          Shows that human corneal epithelial cells produce pro-inflammatory
          cytokines and chemokines after Acanthamoeba exposure.
      - reference: PMID:25505284
        reference_title: IL-17A-mediated protection against Acanthamoeba keratitis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          Although past studies have indicated a critical role of neutrophils and
          macrophages in AK, the relative contribution of the proinflammatory
          cytokine, IL-17A, that is essential for migration, activation, and
          function of these cells into the cornea is poorly defined.
        explanation: >-
          Supports neutrophils and macrophages as core Acanthamoeba keratitis
          inflammatory cells and links IL-17A to their corneal migration and
          activation in the mouse model.
  - name: Perineural Stromal Keratitis
    biological_scale: TISSUE
    description: >-
      Corneal stromal infection and inflammation produce perineural infiltrates,
      stromal infiltrates, and late ring infiltrates that manifest as keratitis,
      pain, photophobia, and reduced visual acuity.
    locations:
      - preferred_term: cornea
        term:
          id: UBERON:0000964
          label: cornea
    biological_processes:
      - preferred_term: inflammatory response
        modifier: INCREASED
        term:
          id: GO:0006954
          label: inflammatory response
    downstream:
      - target: Keratitis
        causal_link_type: DIRECT
        description: >-
          Corneal inflammation is the defining clinical manifestation.
      - target: Ocular pain
        causal_link_type: DIRECT
        description: >-
          Acanthamoeba perineuritis and keratitis produce severe ocular pain.
      - target: Photophobia
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Inflammatory keratitis and anterior-segment irritation make light
          exposure painful.
      - target: Reduced visual acuity
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Stromal inflammation, infiltration, and scarring reduce corneal
          transparency and visual acuity.
      - target: Radial keratoneuritis
        causal_link_type: DIRECT
        description: >-
          Perineural stromal inflammation produces the radial keratoneuritis sign
          of Acanthamoeba keratitis.
      - target: Conjunctival hyperemia
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Anterior-segment inflammation manifests clinically as ocular redness.
      - target: Epiphora
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Irritative keratitis and ocular pain increase tearing.
    evidence:
      - reference: PMID:33804353
        reference_title: >-
          Challenges in Acanthamoeba Keratitis: A Review.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Early clinical signs of infection include limbitis (95% of cases),
          perineural infiltrates (57% of cases), and punctate keratitis (46% of
          cases)
        explanation: >-
          Identifies perineural infiltrates and punctate keratitis as common early
          manifestations.
      - reference: PMID:30899841
        reference_title: >-
          Acanthamoeba keratitis - Clinical signs, differential diagnosis and
          treatment.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          In summary, acanthamoeba keratitis presents in early stages with
          grey-dirty epithelium, pseudodendritiformic epitheliopathy, perineuritis,
          multifocal stromal infiltrates, ring infiltrates
        explanation: >-
          Supports the modeled stromal and perineural keratitis features.


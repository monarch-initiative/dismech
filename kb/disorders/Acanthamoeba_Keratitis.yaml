name: Acanthamoeba Keratitis
creation_date: "2026-11-14T03:17:51Z"
description: >-
  Acanthamoeba keratitis is a sight-threatening corneal infection caused by
  free-living Acanthamoeba species. Contaminated contact lenses, water, soil,
  or corneal trauma bring trophozoites to a damaged corneal epithelial surface;
  the organisms adhere through mannose-sensitive host-parasite interactions,
  kill epithelial cells, secrete proteases, invade and dissolve the corneal
  stroma, and produce painful keratitis with photophobia and reduced vision.
category: Infectious Disease
classifications:
  harrisons_chapter:
    - classification_value: INFECTIOUS_DISEASES
      evidence:
        - reference: PMID:10602676
          reference_title: The pathogenesis of Acanthamoeba keratitis.
          supports: SUPPORT
          evidence_source: OTHER
          quote_role: REVIEW_SYNTHESIS
          snippet: >-
            Free-living amoebae of the genus Acanthamoeba produce a progressive,
            blinding infection of the corneal surface.
          explanation: >-
            Identifies Acanthamoeba keratitis as an infectious corneal disease
            caused by a free-living ameba genus.
disease_term:
  preferred_term: Acanthamoeba keratitis
  term:
    id: MONDO:0005629
    label: Acanthamoeba keratitis
parents:
  - Protozoal infection
synonyms:
  - Acanthamoeba corneal infection
  - Acanthamoeba-associated keratitis
notes: >-
  Scoped to Acanthamoeba infection of the cornea. Granulomatous amebic
  encephalitis, primary amebic meningoencephalitis, and broad corneal-infection
  groupings are outside this entry.
review_notes: >-
  Deliberately lumped. This entry records Acanthamoeba keratitis at the genus
  level because the named MONDO disease spans human keratitis caused by
  multiple Acanthamoeba spp. and T genotypes; the available clinical reviews
  stratify by contact-lens exposure, delayed diagnosis, steroid exposure, and
  inflammatory complications rather than by a species-specific mechanism.


diagnosis:
  - name: Corneal scraping, culture, and PCR confirmation
    description: >-
      Corneal scrapings, corneal biopsy, contact lenses, lens cases, or lens
      cleaning solution can be tested by Acanthamoeba PCR, microbiologic culture,
      or histopathologic examination to confirm the clinical diagnosis.
    evidence:
      - reference: PMID:30899841
        reference_title: >-
          Acanthamoeba keratitis - Clinical signs, differential diagnosis and
          treatment.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          We use in vivo confocal microscopy and as in vitro diagnostics
          polymerase-chain-reaction (PCR), histopathological examination, or
          microbiological culture in acanthamoeba keratitis.
        explanation: >-
          Identifies the principal in vivo and in vitro diagnostic modalities.
  - name: In vivo confocal microscopy
    description: >-
      In vivo confocal microscopy rapidly images corneal epithelium, stroma, and
      endothelium so cysts and deeper organisms can be detected without tissue
      fixation or culture growth.
    evidence:
      - reference: PMID:33804353
        reference_title: "Challenges in Acanthamoeba Keratitis: A Review."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          IVCM provides rapid, detailed images of the corneal epithelium, stroma,
          and endothelium, and permits in vivo identification and observation of
          microorganisms without using stains, dyes, or tissue fixation
        explanation: >-
          Supports in vivo confocal microscopy as a rapid corneal imaging approach
          for Acanthamoeba detection.

treatments:
  - name: Topical biguanide antiamoebic therapy with or without diamidines
    description: >-
      Intensive topical biguanide therapy with polyhexamethylene biguanide or
      chlorhexidine, with or without a diamidine such as propamidine, is the
      mainstay of antiamoebic treatment; modern PHMB 0.08% monotherapy is
      supported by a phase III noninferiority trial against PHMB plus propamidine.
    action_category: THERAPEUTIC
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: polyhexamethylene biguanide
          term:
            id: CHEBI:149520
            label: polyhexamethylene biguanide
        - preferred_term: chlorhexidine
          term:
            id: CHEBI:3614
            label: chlorhexidine
        - preferred_term: propamidine
          term:
            id: CHEBI:87462
            label: propamidine
    therapeutic_modality: SMALL_MOLECULE
    target_mechanisms:
      - target: Treatment-Resistant Acanthamoeba Encystation and Persistence
        treatment_effect: INHIBITS
        description: >-
          Biguanides are cysticidal antiamoebic agents, reducing persistent
          trophozoite and cyst forms that maintain chronic infection.
    evidence:
      - reference: PMID:41111636
        reference_title: "Acanthamoeba keratitis: from pathophysiology to prevention, a contemporary
          clinical perspective."
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Biguanide compounds serve as primary therapeutic agents for Acanthamoeba
          keratitis. Polyhexamethylene biguanide (PHMB) and chlorhexidine represent
          preferred initial treatments
        explanation: >-
          Identifies topical biguanide antiamoebic therapy as the principal initial
          treatment.
      - reference: PMID:37802392
        reference_title: >-
          The Orphan Drug for Acanthamoeba Keratitis (ODAK) Trial: PHMB 0.08% (Polihexanide) and Placebo versus PHMB 0.02% and Propamidine 0.1.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: PRIMARY_RESULT
        snippet: >-
          The adjusted MCR within 12 months was 86.6% (unadjusted, 88.5%) for PHMB
          0.02%+ propamidine and 86.7% (unadjusted, 84.9%) for PHMB 0.08%;
        explanation: >-
          Reports the primary ODAK Phase III comparison showing noninferior
          medical cure rates for PHMB 0.08% monotherapy and PHMB/propamidine
          combination therapy.
  - name: Corneal transplantation for refractory or destructive keratitis
    description: >-
      Deep anterior lamellar or penetrating keratoplasty is used when infection,
      stromal abscess, melting, perforation, or postinfectious scarring cannot be
      managed medically.
    action_category: THERAPEUTIC
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: Corneal Transplantation
      term:
        id: NCIT:C210959
        label: Corneal Transplantation
    evidence:
      - reference: PMID:41111636
        reference_title: >-
          Acanthamoeba keratitis: from pathophysiology to prevention, a contemporary clinical
          perspective.
        supports: SUPPORT
        evidence_source: OTHER
        quote_role: REVIEW_SYNTHESIS
        snippet: >-
          Acute presentations with abscess or perforation require therapeutic
          penetrating keratoplasty
        explanation: >-
          Supports urgent full-thickness corneal transplantation for advanced
          destructive presentations.


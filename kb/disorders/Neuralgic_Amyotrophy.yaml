- category: Neurologic
  name: Fatigue
  description: >-
    Persistent fatigue is one of the two dominant residual symptoms, alongside pain, and is the
    clinical readout of this entry's central mechanistic claim: it is not explained by residual
    paresis. The cohort study found no correlation between fatigue and the level of residual
    weakness on the MRC scale, which is the observation that separates this from simple
    deconditioning after nerve injury, and which is why the long-term treatment target is
    energy distribution rather than strength.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue

treatments:
- name: High-Dose Oral Corticosteroids
  description: >-
    A short trial of high-dose oral corticosteroids in the acute phase, advised for patients
    seen early while still in pain. The aim is to damp the inflammatory attack during the window
    in which it is still active.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  notes: >-
    Bound to CHEBI:50858 rather than the NCIT Corticosteroid term. NCIT:C2322 does resolve to
    "Corticosteroid", but it is not reachable from NCIT:C1909 and so fails the
    ChemicalEntityTerm dynamic enum. CLAUDE.md currently offers NCIT:C2322 as an example
    therapeutic_agent, which does not validate.
  target_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    description: Suppresses the acute inflammatory attack on the nerve during the painful phase.
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If patients are seen early and are still in pain, a short trial of high-dose oral corticosteroids is advised"
    explanation: States the recommendation and the timing constraint on it.
  - reference: PMID:32487526
    reference_title: "Neuralgic amyotrophy: a paradigm shift in diagnosis and treatment."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment options were confined to application of corticosteroids and symptomatic management, without proven positive effects on long-term outcomes"
    explanation: >-
      Refutes a long-term outcome benefit for corticosteroids. Recorded alongside the
      recommendation because the two claims are both true and about different endpoints: acute
      phase practice versus proven long-term effect.
- name: Intravenous Immunoglobulin
  description: >-
    Immunomodulating treatment in the acute phase, cited alongside steroids as potentially
    beneficial. Early immunomodulation is presented as important for optimal recovery.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    description: Immunomodulation directed at the acute immune attack on the nerve.
  evidence:
  - reference: PMID:34054111
    reference_title: "Neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute phase treatment of NA with steroids or i.v. immunoglobulin may benefit patients."
    explanation: >-
      Names IVIG as an acute-phase option. The hedged "may benefit" is the strength of the claim
      and is not upgraded here.
- name: Peripheral Nerve Surgery
  description: >-
    Surgical treatment of hourglass constrictions and nerve torsion identified on
    high-resolution imaging. This is the treatment that the structural findings made possible,
    and it applies to the constriction subgroup rather than to neuralgic amyotrophy generally.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Peripheral nerve surgery for hourglass constriction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Focal Nerve Constriction and Torsion
    description: >-
      Addresses the focal structural lesion directly, by neurolysis, resection or grafting of
      the constricted segment.
  evidence:
  - reference: PMID:32487526
    reference_title: "Neuralgic amyotrophy: a paradigm shift in diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgery has shown to improve clinical outcomes in such cases, indicating the viability of peripheral nerve surgery as a valuable treatment option in NA"
    explanation: Supports surgery for the imaging-identified constriction subgroup specifically.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis is generally favorable after surgery, with a high rate of good motor recovery."
    explanation: Independent statement of post-surgical outcome in the constriction subgroup.
- name: Scapular Coordination Rehabilitation
  description: >-
    Multidisciplinary rehabilitation focused on scapular coordination, energy distribution
    strategies and self-management. Because persisting symptoms are attributed to reduced nerve
    endurance and an altered movement pattern rather than to axon loss, this targets the actual
    driver of long-term disability and is not merely supportive.

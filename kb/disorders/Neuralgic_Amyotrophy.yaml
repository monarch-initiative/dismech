    snippet: "Over one third of the individual patients suffered from severe fatigue."
    explanation: >-
      The frequency source, from 89 patients assessed on average two years after their last
      attack. Graded FREQUENT (30-79%) on "over one third" for severe fatigue; the same paper
      reports a quarter to a third with significant long-term fatigue on the looser criterion.
  - reference: PMID:19254608
    reference_title: "Long-term pain, fatigue, and impairment in neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no correlation of pain or fatigue with the level of residual paresis on a Medical Research Council scale"
    explanation: >-
      The reason this phenotype is wired to the endurance node rather than to axonal injury:
      fatigue tracks neither with how weak the patient is nor with psychological distress, which
      is the dissociation the endurance model predicts.
environmental:
- name: Antecedent infection or vaccination
  description: >-
    The general immune trigger the first pathophysiology node depends on. A prospective matched
    case-control study confirmed a microbiologically documented infectious trigger in 26.3% of
    patients and considered COVID-19 vaccination a potential trigger in a further 12.3%, giving
    a confirmed immune trigger in 38.6% overall. An acute viral infection was associated with
    bilateral brachial plexus involvement, which is the clinically useful part: the trigger is
    not just antecedent, it shapes the attack.

    This is the better-evidenced and more general trigger claim; the hepatitis E entry below is
    a specific, clinically distinctive instance of it rather than an alternative to it. Note
    that a confirmed trigger in 38.6% means the majority of attacks still have none identified,
    so this is a contributing precipitant in a susceptible individual and not a necessary cause.
  exposure_term:
    preferred_term: antecedent infection or vaccination
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      An antecedent immune challenge precipitates the multifocal inflammatory attack in a
      susceptible plexus.
    evidence:
    - reference: PMID:39364568
      reference_title: Immune triggers preceding neuralgic amyotrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Confirmed immune triggers (infection or vaccination) preceded disease onset in 22/57 (38.6%) NA cases."
      explanation: >-
        The headline figure from the only matched case-control study of triggers in this
        disease, with serology performed centrally rather than relying on patient report.
  evidence:
  - reference: PMID:39364568
    reference_title: Immune triggers preceding neuralgic amyotrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NA onset was preceded by a symptomatic infectious trigger confirmed by microbiological tests in 15/57 (26.3%) patients."
    explanation: >-
      The infection component, confirmed microbiologically rather than by history. Each case was
      matched to a healthy control for age, sex, residence and blood collection time, which is
      what distinguishes this from the uncontrolled series elsewhere in this entry.
  - reference: PMID:39364568
    reference_title: Immune triggers preceding neuralgic amyotrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An acute viral infection was associated with a bilateral involvement of the brachial plexus (p = 0.003, Cram\u00e8r's V = 0.43)."
    explanation: >-
      The trigger is associated with the anatomical pattern of the attack, not only with its
      occurrence. Quoted with the paper's own spelling of the statistic's name.
  - reference: PMID:39364568
    reference_title: Immune triggers preceding neuralgic amyotrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coronavirus disease 2019 vaccination was considered a potential trigger in 7/57 (12.3%) subjects."
    explanation: >-
      The vaccination component. The authors write "considered a potential trigger", which is
      weaker than the microbiologically confirmed infections above, and the wording is kept.
- name: Hepatitis E virus infection
  description: >-
    HEV, characteristically genotype 3, is a recurrently reported trigger of a neuralgic
    amyotrophy attack, and the association is clinically distinctive rather than incidental: the
    HEV-associated cases are enriched for phrenic nerve involvement and diaphragmatic paralysis
    rather than the usual shoulder-girdle picture. One series found 13 such patients in three
    years with normal liver enzymes in all of them, which is why the association is missed - the
    trigger leaves no hepatic signal by the time the neuropathy presents.

    Curated as an environmental trigger rather than a cause. NA is not a manifestation of
    hepatitis E; the virus is one of several precipitants acting on an already-susceptible
    plexus, which is the model this entry's first pathophysiology node describes.
  exposure_term:
    preferred_term: exposure to hepatitis E virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Infection precipitates the immune attack on the plexus, with a predilection for the
      phrenic nerve that distinguishes HEV-triggered attacks from other precipitants.
    evidence:
    - reference: PMID:38657646
      reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NA that shows involvement of the phrenic nerve resulting in diaphragmatic dysfunction and dyspnoea, may be associated with HEV infection"
      explanation: >-
        States the association and the phrenic predilection that makes it recognisable. Note the
        authors' own hedge - "may be associated" - which is why this edge is a trigger rather
        than a cause.
    - reference: PMID:40534221
      reference_title: "Neurological Manifestations of HEV Infection: A Rare Phenomenon or an Underrecognized Reality?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The diagnosis of neuralgic amyotrophy with diaphragmatic paralysis secondary to HEV was made"
      explanation: A single worked case with serology, viral load and electrodiagnostic confirmation of phrenic involvement.
  evidence:
  - reference: PMID:38657646
    reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, O2C hepatitis genotype 3 was identified."
    explanation: Identifies the genotype across the whole series, which is what makes this a specific exposure rather than "a viral illness".
  - reference: PMID:38657646
    reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver values were normal in all patients."
    explanation: >-
      The reason the trigger is missed. By the time the neuropathy presents there is no hepatic
      signal to prompt HEV serology, so the exposure is only found when it is looked for.
  notes: >-
    exposure_term is bound to the broader ECTO:3000001 (exposure to virus) with the specificity
    carried in preferred_term. ECTO has no hepatitis exposure term: searching t~hepat returns
    only ECTO:9001877 (hepatotoxic agent) and ECTO:9001927 (hepatoprotective agent), and t~virus
    returns only ECTO:3000001, ECTO:2000053 (HPV) and ECTO:3000002 (Enterovirus). This is a
    confirmed absence, established on a working adapter by the reviewer of PR #10998 after my
    own local ECTO index returned nothing even for a control query. Recorded as an absence
    rather than as an unanswered question, because the two are different claims.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: >-
    Reported as an incidence of 1 per 1,000 individuals, roughly an order of magnitude above
    the figure carried in the older literature. Converted as 1/1,000 = 100 per 100,000.
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not rare, with an incidence of 1 per 1,000 individuals, but it is still often missed."
    explanation: The source of the incidence figure and of the underdiagnosis claim.
progression:
- phase: Acute pain phase
  age_range: First ~4 weeks from onset
  notes: >-
    Abrupt onset of severe continuous neuropathic pain in the shoulder and upper arm, lasting
    around four weeks on average. This phase is the therapeutic window for corticosteroids.
  evidence:
  - reference: PMID:16371410
    reference_title: "The clinical spectrum of neuralgic amyotrophy in 246 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generally, the course of the pain manifests itself in three consecutive phases with an initial severe, continuous pain lasting for approximately 4 weeks on average."
    explanation: >-
      Establishes both the three-phase structure and the duration of the first phase, in the
      largest series of this disease.
- phase: Paresis phase
  notes: >-
    As the initial pain subsides, patchy flaccid paresis and amyotrophy appear in the affected
    nerve distributions, most often upper and middle trunk.
  evidence:
  - reference: PMID:16371410
    reference_title: "The clinical spectrum of neuralgic amyotrophy in 246 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a typically patchy disorder NA can affect almost any nerve in the brachial plexus, although damage in the upper and middle trunk distribution with involvement of the long thoracic and/or suprascapular nerve occurred most frequently (71.1%)."
    explanation: The anatomical distribution of the paresis, with the dominant pattern quantified.
- phase: Residual phase
  notes: >-
    Slow and often incomplete recovery. This is the phase the modern rehabilitation approach
    targets, and the phase whose burden the older literature understated.
  evidence:
  - reference: PMID:16371410
    reference_title: "The clinical spectrum of neuralgic amyotrophy in 246 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall recovery was less favourable than usually assumed, with persisting pain and paresis in approximately two-thirds of the patients who were followed for 3 years or more."
    explanation: >-
      The prognosis correction that underpins this entry's treatment section. Two-thirds with
      persisting symptoms at three years is the reason rehabilitation is curated as
      disease-modifying rather than supportive.
treatments:
- name: High-Dose Oral Corticosteroids
  description: >-
    A short trial of high-dose oral corticosteroids in the acute phase, advised for patients
    seen early while still in pain. The aim is to damp the inflammatory attack during the window
    in which it is still active.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  notes: >-
    Bound to CHEBI:50858 rather than the NCIT Corticosteroid term. NCIT:C2322 does resolve to
    "Corticosteroid", but it is not reachable from NCIT:C1909 and so fails the
    ChemicalEntityTerm dynamic enum. CLAUDE.md currently offers NCIT:C2322 as an example
    therapeutic_agent, which does not validate. Filed as dismech#10978, with the root cause:
    NCIT classifies corticosteroids under Hormone rather than Pharmacologic Substance, so the
    enum's NCIT:C1909 root cannot reach them.
  target_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    description: Suppresses the acute inflammatory attack on the nerve during the painful phase.
    evidence:
    - reference: PMID:19321467
      reference_title: "Evaluation of prednisolone treatment in the acute phase of neuralgic amyotrophy: an observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The median time until initial pain relief was lower in the study group (12.5 days vs 20.5 days), and a significantly higher percentage already recovered strength in the first month of treatment (18% vs 6.3%; p = 0.011)."
      explanation: >-
        The comparative data behind the recommendation: 50 treated patients against a historical
        control group of 203 untreated ones. A retrospective case series with a historical
        control is weak for causal attribution, and the authors say so themselves - they
        recommend the regimen "pending a prospective, randomised trial verifying the results".
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If patients are seen early and are still in pain, a short trial of high-dose oral corticosteroids is advised"
    explanation: States the recommendation and the timing constraint on it.
  - reference: PMID:32487526
    reference_title: "Neuralgic amyotrophy: a paradigm shift in diagnosis and treatment."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment options were confined to application of corticosteroids and symptomatic management, without proven positive effects on long-term outcomes"
    explanation: >-
      Refutes a long-term outcome benefit for corticosteroids. Recorded alongside the
      recommendation because the two claims are both true and about different endpoints: acute
      phase practice versus proven long-term effect.
- name: Intravenous Immunoglobulin
  description: >-
    Immunomodulating treatment in the acute phase, cited alongside steroids as potentially
    beneficial. Early immunomodulation is presented as important for optimal recovery.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    description: Immunomodulation directed at the acute immune attack on the nerve.
  evidence:
  - reference: PMID:34054111
    reference_title: "Neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute phase treatment of NA with steroids or i.v. immunoglobulin may benefit patients."
    explanation: >-
      Names IVIG as an acute-phase option. The hedged "may benefit" is the strength of the claim
      and is not upgraded here.
- name: Peripheral Nerve Surgery
  description: >-
    Surgical treatment of hourglass constrictions and nerve torsion identified on
    high-resolution imaging. This is the treatment that the structural findings made possible,
    and it applies to the constriction subgroup rather than to neuralgic amyotrophy generally.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Peripheral nerve surgery for hourglass constriction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Focal Nerve Constriction and Torsion
    description: >-
      Addresses the focal structural lesion directly, by neurolysis, resection or grafting of
      the constricted segment.
  evidence:
  - reference: PMID:32487526
    reference_title: "Neuralgic amyotrophy: a paradigm shift in diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgery has shown to improve clinical outcomes in such cases, indicating the viability of peripheral nerve surgery as a valuable treatment option in NA"
    explanation: Supports surgery for the imaging-identified constriction subgroup specifically.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis is generally favorable after surgery, with a high rate of good motor recovery."
    explanation: Independent statement of post-surgical outcome in the constriction subgroup.
  - reference: PMID:32868098
    reference_title: "Outcomes of Microneurolysis of Hourglass Constrictions in Chronic Neuralgic Amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine of 11 operative patients experienced clinical recovery compared with 3 of 13 nonsurgical patients."
    explanation: >-
      The comparative outcome behind the recommendation, quoted as counts rather than as a
      percentage because the arms are 11 and 13 patients. The paper grades itself Therapeutic
      IV, and allocation was not randomised, so this establishes an association between surgery
      and recovery in a selected group, not an effect size.
- name: Phrenic Nerve Reconstruction
  description: >-
    Surgical repair of the injured phrenic nerve for symptomatic diaphragm paralysis, in
    selected patients. Curated because diaphragmatic weakness is a phenotype of this entry with
    no other treatment linked to it, and because it is the intervention that follows from the
    HEV-associated phrenic presentation.

    The evidence is weaker than for the other surgical entry here: this is a narrative review of
    phrenic nerve reconstruction across all causes of phrenic injury, of which neuralgic
    amyotrophy is one, not a series of NA patients. It reports no NA-specific outcome.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Phrenic nerve reconstruction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Diaphragmatic weakness
    description: >-
      Restores functional diaphragmatic activity by repairing the nerve lesion, rather than
      compensating for it mechanically as diaphragm plication does.
  evidence:
  - reference: PMID:36031309
    reference_title: Phrenic nerve paralysis and phrenic nerve reconstruction surgery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common etiologies of phrenic injuries include cervical trauma, iatrogenic injury in the neck or chest, and neuralgic amyotrophy."
    explanation: >-
      Establishes that neuralgic amyotrophy is among the phrenic injuries this operation is
      performed for, which is what makes the treatment in scope for this entry.
  - reference: PMID:36031309
    reference_title: Phrenic nerve paralysis and phrenic nerve reconstruction surgery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical repair of the nerve injury to restore functional diaphragmatic activity, termed phrenic nerve reconstruction, is a safe and effective alternative to static repositioning of the diaphragm (diaphragm plication), in properly selected patients."
    explanation: >-
      The efficacy claim, with the authors' own restriction to "properly selected patients"
      preserved. A review statement, not a trial result.
- name: Scapular Coordination Rehabilitation
  description: >-
    Multidisciplinary rehabilitation focused on scapular coordination, energy distribution
    strategies and self-management. Because persisting symptoms are attributed to reduced nerve
    endurance and an altered movement pattern rather than to axon loss, this targets the actual
    driver of long-term disability and is not merely supportive.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Reduced Nerve Endurance and Maladaptive Motor Pattern
    description: >-
      Retrains scapular coordination and paces energy expenditure, addressing the movement
      pattern and endurance limitation that carry the persisting symptoms.
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persistent complaints are common, and a multidisciplinary rehabilitation approach focusing on scapular coordination, energy distribution strategies, and self-management is indicated."
    explanation: States the indication and the specific content of the rehabilitation programme.
  - reference: PMID:34054111
    reference_title: "Neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients benefit from specific rehabilitation treatment."
    explanation: Independent statement of benefit from targeted rehabilitation.
  - reference: PMID:36697215
    reference_title: "Effectiveness of an outpatient rehabilitation programme in patients with neuralgic amyotrophy and scapular dyskinesia: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean group difference adjusted for sex, age and SRQ-DLV baseline score was 8.60 (95%CI: 0.26 to 16.94, p=0.044)."
    explanation: >-
      The primary outcome of the only randomised trial of this intervention, and the strongest
      interventional evidence in this disease. Note the confidence interval nearly touches zero
      and the trial randomised 47 patients but analysed 37 after dropout, so the effect is real
      but imprecise.
  - reference: PMID:36697215
    reference_title: "Effectiveness of an outpatient rehabilitation programme in patients with neuralgic amyotrophy and scapular dyskinesia: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion attaining a minimal clinically relevant SRQ-DLV improvement (\u226512) was larger for the MR group (59%) than the UC group (33%) with a number needed to treat of 4."
    explanation: >-
      The responder analysis, which is what makes the effect interpretable: a number needed to
      treat of 4 on a clinically anchored threshold rather than a group mean on a scale.
  - reference: PMID:39402917
    reference_title: "Neuralgic amyotrophy: An update in evaluation, diagnosis, and treatment approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rather than strength training which may worsen the symptoms"
    explanation: >-
      The explicit negative that defines the intervention by contrast. Curated because the
      obvious rehabilitation approach to a weak limb is the wrong one here, and an entry that
      records only what to do leaves that trap in place.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:34054111
      reference_title: "Neuralgic amyotrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an auto-immune multifocal peripheral nervous system disorder that leaves many patients permanently impaired if not recognized and treated properly"
      explanation: Places the disorder among the peripheral nervous system diseases.
diagnosis:
- name: Clinical diagnosis with exclusion of alternative causes
  description: >-
    Neuralgic amyotrophy is diagnosed clinically. Ancillary studies are used to exclude
    infectious or malignant causes or to assess a differential diagnosis, rather than to confirm
    the disease. High-resolution ultrasound and MRI have a distinct role: identifying hourglass
    constrictions or nerve torsion pre-surgically, which changes management for that subgroup.
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NA is a clinical diagnosis, and ancillary studies serve to exclude infectious or malignant causes or to assess a differential diagnosis."
    explanation: States the diagnostic model and the limited role of ancillary testing.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is now widely accepted that nerve imaging is necessary in identifying hourglass constrictions/nerve torsion pre-surgically in patients with an acute mononeuropathy/plexopathy."
    explanation: Establishes the specific, surgical role of nerve imaging.
  - reference: PMID:36214185
    reference_title: Imaging of neuralgic amyotrophy in the acute phase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "US and MRN showed nerve abnormalities within 1 mo from NA onset in 90% of patients."
    explanation: >-
      Puts a number on the imaging claim above. 39 patients imaged within 31 days of onset, so
      this is the yield in the acute window specifically, not in a chronic presentation.
  - reference: PMID:36214185
    reference_title: Imaging of neuralgic amyotrophy in the acute phase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HGCs were found in 74% (29/39) of the patients: 4 within 1 wk, 8 within 2 wk, 5 within 3 wk, and 12 within 4 wk."
    explanation: >-
      The constriction yield and its timing, which is the operationally useful part: the earliest
      appeared within 12 hours on ultrasound, so a normal early scan does not exclude them and a
      repeat within the month is what the distribution supports.
- name: Hepatitis E serology in phrenic or diaphragmatic involvement
  description: >-
    Test for HEV IgM and IgG with serum HEV RNA when the phrenic nerve or diaphragm is involved.
    This is the action that follows from the observation curated in the environmental section:
    the reason HEV-associated cases are missed is that liver enzymes are normal by the time the
    neuropathy presents, so nothing prompts the serology unless it is asked for on the
    neurological picture alone.

    The recommendation is stated at a lower level of confidence than the imaging above. It rests
    on two small uncontrolled series, plus the case-control study's suggestion to test acute-phase
    patients where there is bilateral involvement or hepatitis. No study has evaluated this as a
    diagnostic strategy, so its yield is unknown.
  evidence:
  - reference: PMID:38657646
    reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, even in diaphragmatic dysfunction without NA symptoms and causative damaging event, HEV infection should be considered, as it may represent a subform of NA with only phrenic nerve involvement."
    explanation: >-
      The authors' own recommendation, extending past NA into unexplained diaphragmatic
      dysfunction. Quoted with the hedges ("should be considered", "may represent") intact.
  - reference: PMID:39364568
    reference_title: Immune triggers preceding neuralgic amyotrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest to test NA patients in the acute phase for intracellular antigens, especially in the case of concomitant bilateral involvement and hepatitis."
    explanation: >-
      Independent support for testing in the acute phase, from the case-control study, with the
      trigger pattern that should raise suspicion.
discussions:
- discussion_id: hourglass_constriction_same_disease_or_not
  kind: CONTROVERSY
  prompt: >-
    Are neuralgic amyotrophy, hourglass nerve constriction and nerve torsion different
    evolutions of one pathological process, or distinct entities that resemble each other?
  rationale: >-
    This is stated as an open question in the review literature rather than a settled point, and
    it has direct consequences for this entry's structure. If they are one process, the
    constriction node belongs downstream of the inflammatory attack, which is how the pathograph
    currently draws it, and the ultrasound categories - swelling, swelling with incomplete
    constriction, swelling with complete constriction, fascicular entwinement - are stages of a
    continuum. If they are separate entities, that edge is wrong and the constriction cases are
    a different disease that happens to look similar. The node carries
    mechanism_confidence: PROVISIONAL for this reason - causal_link_type records directness, not
    confidence, so it is not the slot that expresses this. The practical stakes are not academic: the constriction subgroup has a poor
    prognosis without surgery and a good one with it, so which patients are considered to have
    "neuralgic amyotrophy" determines who gets referred.
  attaches_to:
  - pathophysiology#Focal Nerve Constriction and Torsion
  - pathophysiology#Multifocal Inflammatory Attack on Peripheral Nerve
  evidence:
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology of neuralgic amyotrophy, hourglass constriction and nerve torsion is still poorly understood, and a generic role of inflammation is proposed for all these conditions."
    explanation: >-
      States that the shared mechanism is proposed rather than demonstrated, which is the basis
      for recording this as a controversy.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in some cases of NA, after a first phase characterized by nerve inflammation and swelling, in selected anatomical conditions, the process evolves into hourglass constriction or nerve torsion"
    explanation: >-
      The continuum hypothesis in its explicit form, which is the reading the pathograph
      currently encodes.

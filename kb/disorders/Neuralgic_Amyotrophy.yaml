diagnosis:
- name: Clinical diagnosis with exclusion of alternative causes
  description: >-
    Neuralgic amyotrophy is diagnosed clinically. Ancillary studies are used to exclude
    infectious or malignant causes or to assess a differential diagnosis, rather than to confirm
    the disease. High-resolution ultrasound and MRI have a distinct role: identifying hourglass
    constrictions or nerve torsion pre-surgically, which changes management for that subgroup.
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NA is a clinical diagnosis, and ancillary studies serve to exclude infectious or malignant causes or to assess a differential diagnosis."
    explanation: States the diagnostic model and the limited role of ancillary testing.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is now widely accepted that nerve imaging is necessary in identifying hourglass constrictions/nerve torsion pre-surgically in patients with an acute mononeuropathy/plexopathy."
    explanation: Establishes the specific, surgical role of nerve imaging.
discussions:
- discussion_id: hourglass_constriction_same_disease_or_not
  kind: CONTROVERSY
  prompt: >-
    Are neuralgic amyotrophy, hourglass nerve constriction and nerve torsion different
    evolutions of one pathological process, or distinct entities that resemble each other?
  rationale: >-
    This is stated as an open question in the review literature rather than a settled point, and
    it has direct consequences for this entry's structure. If they are one process, the
    constriction node belongs downstream of the inflammatory attack, which is how the pathograph
    currently draws it, and the ultrasound categories - swelling, swelling with incomplete
    constriction, swelling with complete constriction, fascicular entwinement - are stages of a
    continuum. If they are separate entities, that edge is wrong and the constriction cases are
    a different disease that happens to look similar. The edge is marked PROVISIONAL for this
    reason. The practical stakes are not academic: the constriction subgroup has a poor
    prognosis without surgery and a good one with it, so which patients are considered to have
    "neuralgic amyotrophy" determines who gets referred.
  attaches_to:
  - pathophysiology#Focal Nerve Constriction and Torsion
  - pathophysiology#Multifocal Inflammatory Attack on Peripheral Nerve
  evidence:
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology of neuralgic amyotrophy, hourglass constriction and nerve torsion is still poorly understood, and a generic role of inflammation is proposed for all these conditions."
    explanation: >-
      States that the shared mechanism is proposed rather than demonstrated, which is the basis
      for recording this as a controversy.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in some cases of NA, after a first phase characterized by nerve inflammation and swelling, in selected anatomical conditions, the process evolves into hourglass constriction or nerve torsion"
    explanation: >-
      The continuum hypothesis in its explicit form, which is the reading the pathograph
      currently encodes.

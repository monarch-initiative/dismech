name: Neuralgic Amyotrophy
category: Complex
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- Parsonage-Turner syndrome
- brachial plexus neuritis
- acute brachial plexus neuritis
- immune brachial plexus neuropathy
- neuralgic shoulder amyotrophy
description: >-
  Neuralgic amyotrophy is an immune-mediated multifocal peripheral neuropathy that begins with
  an abrupt attack of severe shoulder-girdle pain and is followed, as the pain subsides, by
  patchy weakness and wasting in the upper limb. It is a clinical diagnosis; ancillary testing
  serves mainly to exclude infectious or malignant causes.

  This entry covers the acquired, idiopathic form. Hereditary neuralgic amyotrophy, caused by
  SEPTIN9 duplication, is a separate MONDO concept with a different initiating lesion and is
  deliberately not folded in here.

  Three things about this disease are commonly got wrong, and the entry is organised around
  them.

  It is not rare. Incidence is about 1 per 1,000 individuals, an order of magnitude above the
  figure the older literature carried, and it is still frequently missed.

  It is not benign. The original descriptions emphasised spontaneous good recovery, but the
  majority of patients never achieve full recovery, and long-term consequences are the rule
  rather than the exception.

  Most importantly, the residual disability is not simply the axonal damage. Persisting symptoms
  are attributed mainly to reduced endurance in the affected nerves combined with an altered
  posture and movement pattern - not to the axon loss itself. That distinction is what makes
  scapular-coordination rehabilitation a mechanistically targeted treatment rather than generic
  supportive care, and it is why the entry carries a separate maladaptive-motor-pattern arm
  downstream of the nerve injury.

  The other development worth recording is structural. High-resolution ultrasound and MRI
  identified hourglass-like constrictions - focal narrowings with proximal and distal nerve
  thickening, involving the perineurium, with marked edema and a mononuclear infiltrate of
  CD8-positive T lymphocytes. Whether these are a distinct entity or a late stage of the same
  inflammatory process is genuinely unsettled, and is recorded as a controversy rather than
  resolved in the causal chain.
notes: >-
  A note on this entry's evidence base, because it is not visible from the evidence items
  themselves. Sixteen references: five are narrative reviews (PMID:26662794, PMID:32487526,
  PMID:34054111, PMID:38248282, PMID:39402917) carrying MEDLINE publication type "Review" with
  no primary patient data of their own, and one (PMID:36031309) is a review of phrenic nerve
  reconstruction across all causes rather than in this disease. The remaining ten report
  original human observations, and they carry the load for the entry's quantitative claims:

  - PMID:36697215 - randomised controlled trial (n=47 randomised, 37 analysed) of the
    rehabilitation programme, the only randomised evidence in this disease.
  - PMID:16371410 - 246-patient clinical series, the source of the three-phase course, the
    sensory-involvement frequency and the two-thirds persisting-symptom prognosis. Note this
    cohort mixes 199 idiopathic with 47 hereditary cases, while this entry scopes to the
    acquired form.
  - PMID:39364568 - prospective matched case-control (n=57) of immune triggers, with central
    serology.
  - PMID:19254608 - 89 patients assessed on average two years out, for long-term fatigue.
  - PMID:36214185 - 39 patients imaged within 31 days, for the imaging yields.
  - PMID:19321467 - 50 treated patients against a historical control group of 203, for the
    corticosteroid effect. Retrospective with a historical control, which the authors flag.
  - PMID:32868098 - 24 patients, non-randomised, for the surgical comparison. Graded
    Therapeutic IV by its own authors.
  - PMID:8614534 - the four-patient brachial plexus biopsy series, still the only direct tissue
    evidence for the immune-mediated mechanism this entry is built on.
  - PMID:38657646 (13 patients) and PMID:40534221 (2 patients) - the hepatitis E association,
    both uncontrolled.

  Every one of these is graded HUMAN_CLINICAL, which is what the schema's definition supports
  and the dominant convention in this knowledge base. But an RCT, a 246-patient series, a
  four-patient biopsy series and a two-patient case report all carry that identical value, and a
  reader cannot tell them apart at the evidence item. That is why the distinctions above are
  written out here. See dismech#9421 and dismech#9827.

  A comparative-species model was considered and rejected. The deep-research report for this
  disease offers feline hypertrophic brachial plexus neuritis (PMID:29925717) as a naturally
  occurring analogue. Reading the source rather than the summary, that cat had a chronic
  hypertrophic demyelinating neuritis with onion-bulb formation, which its own authors compare
  to human CIDP rather than to neuralgic amyotrophy. NA is an acute, painful, multifocal axonal
  process. The shared feature is brachial plexus inflammation, which is not enough to make it a
  model of this disease, so it is deliberately not curated as one.


environmental:
- name: Hepatitis E virus infection
  description: >-
    HEV, characteristically genotype 3, is a recurrently reported trigger of a neuralgic
    amyotrophy attack, and the association is clinically distinctive rather than incidental: the
    HEV-associated cases are enriched for phrenic nerve involvement and diaphragmatic paralysis
    rather than the usual shoulder-girdle picture. One series found 13 such patients in three
    years with normal liver enzymes in all of them, which is why the association is missed - the
    trigger leaves no hepatic signal by the time the neuropathy presents.

    Curated as an environmental trigger rather than a cause. NA is not a manifestation of
    hepatitis E; the virus is one of several precipitants acting on an already-susceptible
    plexus, which is the model this entry's first pathophysiology node describes.
  exposure_term:
    preferred_term: exposure to hepatitis E virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Infection precipitates the immune attack on the plexus, with a predilection for the
      phrenic nerve that distinguishes HEV-triggered attacks from other precipitants.
    evidence:
    - reference: PMID:38657646
      reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NA that shows involvement of the phrenic nerve resulting in diaphragmatic dysfunction and dyspnoea, may be associated with HEV infection"
      explanation: >-
        States the association and the phrenic predilection that makes it recognisable. Note the
        authors' own hedge - "may be associated" - which is why this edge is a trigger rather
        than a cause.
    - reference: PMID:40534221
      reference_title: "Neurological Manifestations of HEV Infection: A Rare Phenomenon or an Underrecognized Reality?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The diagnosis of neuralgic amyotrophy with diaphragmatic paralysis secondary to HEV was made"
      explanation: A single worked case with serology, viral load and electrodiagnostic confirmation of phrenic involvement.
  evidence:
  - reference: PMID:38657646
    reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, O2C hepatitis genotype 3 was identified."
    explanation: Identifies the genotype across the whole series, which is what makes this a specific exposure rather than "a viral illness".
  - reference: PMID:38657646
    reference_title: "Hepatitis E and diaphragmatic dysfunction: Case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver values were normal in all patients."
    explanation: >-
      The reason the trigger is missed. By the time the neuropathy presents there is no hepatic
      signal to prompt HEV serology, so the exposure is only found when it is looked for.
  notes: >-
    exposure_term is bound to the broader ECTO:3000001 (exposure to virus) with the specificity
    carried in preferred_term. Whether ECTO codes a hepatitis E exposure specifically is not
    established here: the local ECTO index returned nothing for a control query as well as for
    "hepatitis", so the search was uninformative rather than negative. Left as a lead for
    whoever next has a working ECTO adapter, rather than recorded as an absence.

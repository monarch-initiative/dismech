pathophysiology:
- name: Multifactorial Susceptibility to Brachial Plexus Immune Attack
  description: >-
    Neuralgic amyotrophy is not attributed to a single initiating lesion. Genetic, biomechanical
    and immunologic factors are all implicated, and it is this multifactorial etiology - rather
    than a lack of study - that limits the ability to predict or prevent the recurrences that
    are common in this disease. The biomechanical component is what is thought to localise an
    otherwise systemic immune event to particular nerves.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Multifocal Inflammatory Attack on Peripheral Nerve
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26662794
    reference_title: "Neuralgic amyotrophy: An update on diagnosis, pathophysiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrences are common, yet the proposed multifactorial etiology, which includes genetic, biomechanical, and immunologic factors, limits our capacity to predict or prevent them."
    explanation: >-
      States the three-component etiologic model and its practical consequence, which is why
      this node is marked provisional rather than established.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune, genetic, infectious and mechanical processes are thought to be involved, but etiopathogenesis is still incompletely understood"
    explanation: >-
      An independent review reaching the same multifactorial conclusion and stating explicitly
      that the etiopathogenesis is not settled.
- name: Multifocal Inflammatory Attack on Peripheral Nerve
  description: >-
    Brachial plexus biopsy in affected patients shows florid multifocal mononuclear inflammatory
    cell infiltrates, which is the direct histopathological basis for calling the disorder
    immune-mediated. The infiltrate in the constricted segments is composed of CD8-positive T
    lymphocytes, and the lesion involves the perineurium with marked edema. "Multifocal" is
    doing real work here: the attack picks out individual nerves and even individual fascicles,
    which is why the resulting weakness is patchy rather than following a plexus territory.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: CD8-positive T lymphocyte
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: inflammatory response in peripheral nerve
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  locations:
  - preferred_term: brachial plexus
    term:
      id: UBERON:0001814
      label: brachial nerve plexus
  downstream:
  - target: Severe Neuropathic Pain Attack
    causal_link_type: DIRECT
  - target: Focal Nerve Constriction and Torsion
    causal_link_type: DIRECT
  - target: Multifocal Axonal Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8614534
    reference_title: "Immune brachial plexus neuropathy: suggestive evidence for an inflammatory-immune pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were florid multifocal mononuclear inflammatory cell infiltrates. Present evidence suggests that these brachial neuropathies have an immune basis."
    explanation: >-
      Direct tissue evidence from brachial plexus biopsy in four patients, and the primary basis
      for the immune-mediated classification.
  - reference: PMID:34054111
    reference_title: "Neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an auto-immune multifocal peripheral nervous system disorder that leaves many patients permanently impaired if not recognized and treated properly"
    explanation: Characterises the disorder as autoimmune and multifocal, and notes the cost of missing it.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which involves the perineurium and is associated with marked edema, a mononuclear inflammatory infiltration, composed of CD8-positive T lymphocytes"
    explanation: >-
      Identifies the effector cell population and the anatomical compartment of the lesion,
      which is what the cell-type and location bindings on this node record.
- name: Severe Neuropathic Pain Attack
  description: >-
    The illness opens with sudden, severe pain in the shoulder girdle. The pain is the
    presenting symptom and the window for immunomodulating treatment: it precedes the weakness,
    and it is while the patient is still in pain that corticosteroids are advised.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Shoulder pain
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32487526
    reference_title: "Neuralgic amyotrophy: a paradigm shift in diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is characterised by sudden pain attacks, followed by patchy muscle paresis in the upper extremity"
    explanation: >-
      Establishes the defining temporal sequence of pain preceding patchy paresis, which the
      downstream edges of this entry encode.
- name: Focal Nerve Constriction and Torsion
  description: >-
    In a subset of patients the inflamed, swollen nerve develops a very focal constriction, with
    thickening proximal and distal to it, or frank torsion of the nerve or some of its fascicles.
    Ultrasound findings have been grouped as nerve swelling, swelling with incomplete
    constriction, swelling with complete constriction, and fascicular entwinement, which has
    been read as a continuum. The clinical importance is that these lesions do badly without
    surgery and well with it, so recognising them changes management.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Multifocal Axonal Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the hourglass constriction, which is characterized by a very focal constriction of a nerve, or part of it, usually associated with nerve thickening proximally and distally to the constriction"
    explanation: Defines the structural lesion this node represents.
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis of these conditions is often poor in the absence of any surgical treatment"
    explanation: >-
      Supports treating the constriction as a mechanistically distinct, surgically addressable
      lesion rather than a radiological curiosity.
- name: Multifocal Axonal Injury
  description: >-
    The affected nerves sustain axonal loss, typically a severe axonotmesis on
    neurophysiological testing. This produces the patchy paresis and, over weeks, the amyotrophy
    the disease is named for. Importantly the axonal damage is not the whole story of long-term
    disability - see the maladaptive motor pattern node downstream.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Upper limb muscle weakness
    causal_link_type: DIRECT
  - target: Skeletal muscle atrophy
    causal_link_type: DIRECT
  - target: Diaphragmatic weakness
    causal_link_type: DIRECT
  - target: Paresthesia
    causal_link_type: DIRECT
  - target: Reduced Nerve Endurance and Maladaptive Motor Pattern
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38248282
    reference_title: "Neuralgic Amyotrophy and Hourglass Nerve Constriction/Nerve Torsion: Two Sides of the Same Coin? A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually a severe axonotmesis, documented during neurophysiological examination"
    explanation: Characterises the nerve injury as severe axonotmesis on electrophysiology.
- name: Reduced Nerve Endurance and Maladaptive Motor Pattern
  description: >-
    The distinctive claim of the modern literature on this disease: persisting symptoms are
    caused mainly by a combination of decreased endurance in the affected nerves and an altered
    posture and movement pattern, and not by the axonal damage itself. This is why the
    long-term treatment target is scapular coordination and energy distribution rather than
    nerve regeneration, and why rehabilitation here is disease-modifying rather than supportive.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Scapular winging
    causal_link_type: DIRECT
  - target: Fatigue
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34054111
    reference_title: "Neuralgic amyotrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term consequences are the rule, and persisting symptoms are mainly caused by a combination of decreased endurance in the affected nerves and an altered posture and movement pattern, not by the axonal damage itself."
    explanation: >-
      States the claim directly, including the explicit negative - that axonal damage is not the
      main driver of persistent symptoms - which is the reason this node exists separately from
      the axonal injury node.

name: Combined Oxidative Phosphorylation Defect Type 21
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Combined oxidative phosphorylation defect type 21 is an autosomal recessive
  mitochondrial disease caused by biallelic variants in TARS2, the mitochondrial
  threonyl-tRNA synthetase. It presents in infancy with severe axial hypotonia
  against limb hypertonia, developmental delay that often turns to regression
  after an intercurrent illness, cerebellar signs, dystonia, seizures and a
  raised blood lactate, with a brain MRI that shows cerebellar atrophy and
  faint signal change in the globus pallidus and other basal ganglia nuclei.
  Roughly thirty patients have been described.

  The canonical mechanism is the one shared by every mitochondrial
  aminoacyl-tRNA synthetase disorder. Mitochondria run their own translation
  apparatus for the thirteen proteins encoded by mitochondrial DNA, and it needs
  its own set of synthetases, encoded in the nucleus and imported. Losing one of
  them starves mitochondrial translation of a charged tRNA, so the thirteen
  mitochondrially encoded subunits are made in insufficient quantity, and the
  four respiratory complexes that contain them fail together. Complex II is
  spared, because it is the only complex built entirely from
  nuclear-encoded subunits, and that sparing is the biochemical signature of the
  whole disease family.

  A second mechanism is specific to this gene and is what makes the entry
  interesting. TARS2 has a non-translational job: it senses threonine and
  binds Rag GTPases at the lysosomal surface, which is how mTORC1 gets recruited
  and activated. A cluster of disease variants falls in the residue 301 to 381
  region that mediates that binding, and those variants bind Rag GTPases less
  well. In zebrafish, knocking tars2 down dysregulates downstream targets of
  mTORC1 and produces small heads, small cerebella, brain apoptosis, reduced
  myelination and increased seizure activity. The clearest evidence that this
  arm is a real disease mechanism rather than a laboratory observation comes
  from an unexpected direction: four individuals homozygous for p.(Arg327Gln),
  one of the Rag-binding-region variants, presented with neonatal diabetes, a
  feature not otherwise seen in this disorder, and mTORC1 is essential to
  pancreatic beta cells.

  Two things bound how confidently any of this can be stated. The mutational
  spectrum is almost entirely missense, with a single nonsense allele reported
  only in combination with a splice variant, which suggests that complete loss
  of TARS2 is lethal in humans and means the disease is always studied through
  hypomorphic alleles. And the respiratory chain defect is tissue-restricted:
  the combined deficiency is found in muscle and not reliably in fibroblasts or
  liver, so a normal fibroblast enzymology does not exclude the diagnosis.

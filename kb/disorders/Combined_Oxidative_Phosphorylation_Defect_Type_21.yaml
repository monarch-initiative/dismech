- name: Impaired Mitochondrial Threonyl-tRNA Aminoacylation
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    Charging mitochondrial tRNA-Thr with threonine is the enzyme's canonical
    job, and it has a second, quality-control half: clearing mischarged
    seryl-tRNA-Thr through the editing domain. Both matter, since disease
    alleles fall in the editing domain as well as the catalytic one. Measured
    threonyl-tRNA levels are reduced in patient samples in proportion to the
    genetic defect.
  biological_processes:
  - preferred_term: tRNA aminoacylation for mitochondrial protein translation
    modifier: DECREASED
    term:
      id: GO:0070127
      label: tRNA aminoacylation for mitochondrial protein translation
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:39394138
    reference_title: "TARS2 c.470 C > G is a chinese-specific founder mutation in three unrelated families with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TARS2, a mitochondrial aminoacyl-tRNA synthetase (mt-aaRS), generates
      mitochondrial Thr-tRNAThr by catalyzing the binding of homologous tRNA to
      specific amino acids and clearing mischarged Ser-tRNAThr during
      mitochondrial translation, which safeguards normal and accurate
      mitochondrial protein synthesis.
    explanation: >-
      States both halves of the enzyme's function, charging and editing.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_aminoacylation_model
    description: >-
      Mitochondrial translation cannot proceed without an adequate supply of the
      charged tRNA for every amino acid.
    evidence:
    - reference: PMID:39394138
      reference_title: "TARS2 c.470 C > G is a chinese-specific founder mutation in three unrelated families with mitochondrial encephalomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenic variants in mt-aaRS genes lead to a reduction in charged
        tRNA, which impairs mitochondrial protein synthesis and decreases the
        amount of mtDNA-encoded subunits of the oxidative phosphorylation system
        (OXPHOS)
      explanation: >-
        States the causal step from reduced charged tRNA to impaired
        mitochondrial protein synthesis.

- name: Impaired Mitochondrial Translation
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    Mitochondria translate only thirteen proteins, all of them subunits of the
    respiratory chain, but they need a full translation apparatus to do it: two
    ribosomal RNAs and twenty-two transfer RNAs encoded by mitochondrial DNA,
    plus more than a hundred nuclear-encoded proteins imported from the cytosol.
    The aminoacyl-tRNA synthetases are among those imported proteins, which is
    why a nuclear gene defect produces what looks like a mitochondrial DNA
    disease.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:24827421
    reference_title: "VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Translation of the 13 mtDNA-encoded, OXPHOS-related proteins takes place
      within the mitochondrial matrix. This complex process requires ribosomal
      and transfer RNAs (rRNAs and tRNAs), encoded by mtDNA, and more than 100
      proteins, encoded by nuclear genes, translated by cytosolic ribosomes and
      imported into mitochondria.
    explanation: >-
      Describes the apparatus and why a nuclear-encoded component sits inside
      it.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_aminoacylation_model
    description: >-
      Insufficient synthesis of the mitochondrially encoded subunits leaves the
      complexes that contain them unable to assemble and remain stable.
    evidence:
    - reference: PMID:24827421
      reference_title: "VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in any component of the mitochondrial translation machinery
        can in principle cause inherited mitochondrial disorders affecting the
        MRC complexes containing mtDNA-encoded subunits (cI, cIII, cIV, cV),
        with the preservation of complex II, the only complex which has no
        mtDNA-encoded proteins.
      explanation: >-
        States the causal step and, critically, why complex II is spared, which
        is the biochemical signature of the disease family.

- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining biochemical lesion, and the one the disease is named for.
    Complexes I, III, IV and V are deficient together because each contains
    mitochondrially encoded subunits; complex II is normal because it does not.
    Two practical qualifications attach to it. The defect is tissue-restricted
    and is found in muscle rather than reliably in fibroblasts or liver, so a
    normal fibroblast enzymology does not exclude the diagnosis. And it is
    inconsistently found even when looked for: of two patients biopsied in the
    largest cohort, one showed complex I deficiency and the other did not, so
    modern diagnosis rests on sequencing rather than on enzymology.
  biological_processes:

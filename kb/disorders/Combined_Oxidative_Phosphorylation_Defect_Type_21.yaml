inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic TARS2 variants, homozygous in consanguineous families and compound
    heterozygous otherwise. The allelic spectrum is almost entirely missense.
    Only one reported patient carried a stop-gain, and then only in combination
    with a splice variant, which is the observation behind the inference that
    complete loss of TARS2 is lethal in humans.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 16 novel or ultra-rare TARS2 variants in either a homozygous
      (n = 7) or compound heterozygous state (n = 10)
    explanation: >-
      Establishes biallelic inheritance and the split between homozygous and
      compound heterozygous genotypes in the largest cohort.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a predominance of missense variants and only 1 patient previously
      reported11 was harboring 1 stop-gain in combination with a splicing
      variant, suggesting that total loss of TARS2 is likely lethal in humans.
    explanation: >-
      Records the missense predominance and the inference drawn from the near
      absence of truncating alleles.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_aminoacylation_model
  hypothesis_label: Impaired mitochondrial aminoacylation and combined respiratory chain deficiency
  status: CANONICAL
  description: >-
    The mechanism shared by the whole family of mitochondrial aminoacyl-tRNA
    synthetase disorders. Reduced TARS2 protein lowers the supply of charged
    mitochondrial threonyl-tRNA, mitochondrial translation of the thirteen
    mitochondrially encoded respiratory chain subunits falls, and the four
    complexes that contain those subunits are deficient together while complex
    II is spared. This is the model the disease was named for, and it is
    supported by direct measurement in patient material and by rescue of the
    respiratory defect on re-expression of wild-type TARS2.
  evidence:
  - reference: PMID:24827421
    reference_title: "VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amount of VARS2 and TARS2 proteins and valyl-tRNA and threonyl-tRNA
      levels were decreased in samples of afflicted patients according to the
      genetic defect.
    explanation: >-
      Direct measurement of the two steps this model asserts, reduced synthetase
      and reduced charged tRNA, in patient material.
- hypothesis_group_id: noncanonical_mtorc1_model
  hypothesis_label: Reduced Rag GTPase binding and mTORC1 dysregulation
  status: EMERGING
  description: >-
    A mechanism that does not involve translation at all. TARS2 senses threonine
    and binds Rag GTPases at the lysosome, which recruits and activates mTORC1.
    A cluster of disease variants falls in the residue 301 to 381 region that
    mediates that binding and reduces it, downstream mTORC1 targets are
    dysregulated in a zebrafish knockdown, and one Rag-binding-region variant is
    associated with neonatal diabetes, a beta cell phenotype where mTORC1 is
    essential and which the translation model does not predict.

    It is EMERGING rather than CANONICAL for three reasons. The binding
    reduction was measured by co-immunoprecipitation of transfected constructs,
    and those constructs also had reduced basal expression, so reduced binding
    and reduced protein cannot be fully separated. mTORC1 activity itself was
    not measured in patient cells, only inferred. And the in vivo evidence is a
    morpholino knockdown in zebrafish rather than a model of the human alleles.
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro studies showed that variants within the TARS2301-381 region had
      decreased binding to Rag GTPases, likely impairing mTORC1 activity.
    explanation: >-
      States the mechanism and, in the word "likely", the authors' own hedge
      about mTORC1 activity not having been measured directly.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We define the clinico-radiological spectrum of TARS2-related mitochondrial
      disease, unveil the likely involvement of the mTORC1 signaling pathway as
      a distinct molecular mechanism
    explanation: >-
      The authors present the mTORC1 arm as a distinct mechanism, not as a
      restatement of the translational one.

pathophysiology:
- name: TARS2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    TARS2 encodes a 718-residue mitochondrial threonyl-tRNA synthetase with four
    domains: an N1 domain, an editing domain that clears mischarged
    seryl-tRNA-Thr, an aminoacylation domain, and an anticodon-binding domain.
    Disease variants are predominantly missense and cluster in three places:
    the Rag GTPase-binding region between the editing and catalytic core
    domains, the editing domain, and the anticodon-binding domain. Recurrent
    alleles are common, including p.(Thr157Arg), which recurs in Chinese
    families and is absent from other populations, and p.(Pro155Leu),
    p.(Glu512Lys) and p.(Ser258Leu), each seen in more than one unrelated
    family.

    Which domain an allele hits matters. Variants in the Rag-binding region
    behave differently from the rest, both in the laboratory and in the clinic,
    and are the basis of the second mechanistic hypothesis curated here.
  genes:
  - preferred_term: TARS2
    term:
      id: hgnc:30740
      label: TARS2
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    description: >-
      Biallelic germline variants, homozygous in consanguineous families and
      compound heterozygous otherwise. Categorised as partial rather than
      complete loss of function because the near absence of truncating alleles
      indicates that complete loss is not compatible with life.
  molecular_functions:
  - preferred_term: threonine-tRNA ligase activity
    modifier: DECREASED
    term:

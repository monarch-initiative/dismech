- name: Reduced Rag GTPase Binding and mTORC1 Dysregulation
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    The non-translational arm. mTORC1 is recruited to and activated at the
    lysosomal surface by Rag GTPases in response to amino acid availability, and
    TARS2 is part of how threonine availability is read: on threonine
    supplementation it binds RagC preferentially and drives the conversion of
    the Rag heterodimer to its active form. The region responsible, residues 301
    to 381, sits between the editing and catalytic core domains, and four
    disease variants fall inside it. All four bound RagA and RagC significantly
    less than wild type.

    The confidence is PROVISIONAL and the limitations are specific. The
    transfected variant constructs also had reduced basal expression, between 39
    and 66 percent of wild type, which the authors attribute to intrinsic
    instability, so reduced binding cannot be entirely separated from reduced
    protein. mTORC1 activity itself was not measured in patient cells. What is
    measured downstream comes from the zebrafish knockdown, where two mTORC1
    targets move in opposite directions as expected.
  biological_processes:
  - preferred_term: TORC1 signaling
    modifier: DYSREGULATED
    term:
      id: GO:0038202
      label: TORC1 signaling
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon threonine supplementation, TARS2 preferentially binds RagCGTP and
      promotes the conversion of inactive Rag GTPases (RagAGDP/RagCGTP) into the
      active form (RagAGTP/RagCGDP). This is sufficient to recruit mTORC1 to
      lysosomes.
    explanation: >-
      Describes the normal non-translational function whose loss this node
      asserts.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Despite being cloned from the same wild-type (WT) backbone, the TARS2
      variants had reduced basal expression levels
    explanation: >-
      The confound that keeps this node PROVISIONAL: the constructs expressed
      less protein, between 39 and 66 percent of wild type, as well as binding
      less well, so the two effects are not cleanly separated. The reporting
      authors attribute the lower expression to intrinsic instability of the
      variant proteins.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As expected, we found that PGC1α and PPARα were downregulated and
      upregulated, respectively, in tars2 knock-down animals, likely leading to
      dysregulation of mTORC1 signaling.
    explanation: >-
      The in vivo readout of the pathway, in a zebrafish knockdown rather than
      in patient cells.
  downstream:
  - target: Neurodevelopmental Impairment and Progressive Brain Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - noncanonical_mtorc1_model
    description: >-
      Proposed as a route to the neurodevelopmental phenotype independent of the
      respiratory chain defect, acting through neuronal proliferation and
      apoptosis. The intermediates between mTORC1 dysregulation and the human
      brain phenotype are not established, hence the indirect link type.
    evidence:
    - reference: PMID:37454282
      reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taken together, our results suggest that TARS2 plays an essential role in
        early CNS development, possibly affecting neuronal proliferation and
        apoptosis through aberrant mTORC1 signaling.
      explanation: >-
        The authors' proposal, stated with their own hedges, that the mTORC1 arm
        reaches the brain phenotype through proliferation and apoptosis.
  - target: Pancreatic Beta Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - noncanonical_mtorc1_model
    description: >-
      The most striking prediction of this arm, because it explains a phenotype
      the translational model does not. One Rag-binding-region variant,
      p.(Arg327Gln), was found homozygously in four individuals with neonatal
      diabetes, and mTORC1 is essential to beta cells.
    evidence:
    - reference: PMID:39509107
      reference_title: "A homozygous TARS2 variant is a novel cause of syndromic neonatal diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Current evidence suggests that the p.(Arg327Gln) variant disrupts TARS2's
        regulation of the mTORC1 pathway which is essential for β-cells.
      explanation: >-
        Attributes a beta cell phenotype to the mTORC1 arm specifically, in
        patients carrying one of the four Rag-binding-region variants.

- name: Pancreatic Beta Cell Dysfunction
  biological_scale: CELLULAR
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    A phenotype outside the classical description of the disorder, and one that
    is genotype-restricted rather than general. Four individuals homozygous for
    p.(Arg327Gln) presented with diabetes, three of them in the first week of
    life, alongside epilepsy and developmental delay. Diabetes is not a
    recognised feature of COXPD21 and none of the larger cohorts report it,
    which is what makes the association with a specific Rag-binding-region
    allele informative rather than incidental.
  cell_types:
  - preferred_term: Pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:39509107
    reference_title: "A homozygous TARS2 variant is a novel cause of syndromic neonatal diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three individuals, all diagnosed with diabetes in the first week of life,
      shared a rare homozygous missense variant, p.(Arg327Gln), in TARS2.
      Replication studies identified the same homozygous variant in a fourth
      individual diagnosed with diabetes at 1 year.
    explanation: >-
      Establishes the genotype-restricted association, in a discovery cohort
      plus a replication cohort.
  - reference: PMID:39509107
    reference_title: "A homozygous TARS2 variant is a novel cause of syndromic neonatal diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic TARS2 variants cause a mitochondrial encephalopathy (COXPD-21)
      characterised by severe hypotonia, epilepsy and developmental delay.
      Diabetes is not a known feature of COXPD-21.
    explanation: >-
      States explicitly that diabetes falls outside the recognised phenotype,
      which is why it is curated here as an allele-specific branch rather than
      as a general feature.

- name: Neurodevelopmental Impairment and Progressive Brain Atrophy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint, and the point at which the two mechanistic arms
    converge. Almost all patients have moderate or severe developmental delay or
    intellectual disability. About a third regress, typically triggered by an
    intercurrent illness and often within the first year, which is the pattern
    that marks the disorder out as metabolic rather than statically
    developmental. Imaging shows cerebellar atrophy with a vermian predominance
    in three quarters of patients, basal ganglia signal change in about two
    thirds, and progressive loss of periventricular white matter with callosal
    thinning in over 40 percent.

    Two temporal points matter for diagnosis. The cerebellum was normal in one
    infant imaged in the first months of life, so a normal early MRI does not
    exclude the disorder and follow-up imaging is needed. And in at least two
    patients the basal ganglia lesions progressed with lactate peaks and new
    dentate signal change, producing a Leigh-like pattern.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI was abnormal in all individuals for whom it was available
      (Figure 2), revealing mild to severe cerebellar atrophy with prevalent
      vermian involvement in 12 of 16 (75%) cases.
    explanation: >-
      Quantifies the dominant structural finding and its cerebellar
      predominance.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the cerebellum was initially normal in 1 infant who underwent
      brain MRI in the first months of life. Therefore, we hypothesize that
      cerebellar atrophy might develop later in TARS2-related disorders and be
      missed without follow-up MRI studies
    explanation: >-
      Establishes that the atrophy is acquired and progressive rather than
      congenital, with the diagnostic consequence the authors draw.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      thus suggesting that TARS2 variants might also be associated with a
      Leigh-like neuroimaging pattern, in keeping with the phenotypic
      heterogeneity of ARS2-related disorders.
    explanation: >-
      Records the Leigh-like imaging pattern seen on follow-up in two patients.


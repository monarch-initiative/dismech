genetic:
- name: TARS2
  notes: >-
    TARS2 encodes the mitochondrial threonyl-tRNA synthetase. The mutational
    spectrum is dominated by missense variants and by recurrence: of the
    twenty-four families reported by 2023, seventeen carried a recurrent
    variant. Recurrent alleles include p.(Thr157Arg), which is a Chinese-specific
    founder variant recurring in six Chinese individuals and absent from other
    populations, plus p.(Pro155Leu), p.(Glu512Lys), p.(Ser258Leu), p.(Phe323Cys)
    and p.(Arg346Cys). Two splice variants also recur, c.387+6T>C and
    c.695+3A>G.

    Genotype-phenotype correlation is weak but not absent. p.(Pro155Leu) was
    associated with a severe phenotype in two unrelated individuals, while
    p.(Glu512Lys) and p.(Ser258Leu) were associated with moderate intellectual
    disability and milder motor and cerebellar dysfunction. Variants in the
    Rag-binding region behave as a group: all but one individual carrying them in
    compound heterozygosity showed basal ganglia and cerebellar signal change
    without cerebellar atrophy, and one of them, p.(Arg327Gln), is the allele
    associated with neonatal diabetes.
  gene_term:
    preferred_term: TARS2
    term:
      id: hgnc:30740
      label: TARS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is noteworthy that 17 of the 24 families reported to date harbor
      recurrent TARS2 variants
    explanation: >-
      Quantifies how far the mutational spectrum is dominated by recurrent
      alleles.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although we did not recognize a specific genotype-phenotype correlation,
      some interesting findings emerged.
    explanation: >-
      The authors' own assessment that no general correlation was established,
      which bounds the allele-specific observations that follow it.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, all but 1 individual harboring compound heterozygous variants
      in the TARS2-Rag GTPase binding region showed basal ganglia and cerebellar
      signal alterations without cerebellar atrophy.
    explanation: >-
      The clearest genotype-phenotype signal in the disorder, and the one that
      groups the Rag-binding-region alleles together clinically as well as
      biochemically.

animal_models:
- name: Zebrafish tars2 morpholino knockdown
  species: Zebrafish
  genotype: tars2 splice-blocking morpholino knockdown
  publication: PMID:37454282
  description: >-
    A morpholino knockdown of tars2 in zebrafish embryos, validated by rescue
    with either zebrafish tars2 or human TARS2 messenger RNA, which is what
    establishes that the phenotypes are specific to loss of Tars2 and that the
    function is conserved. The model was then used as an assay: seventeen human
    variants were tested for their ability to rescue, and none rescued fully.
  modeled_mechanisms:
  - target: Neurodevelopmental Impairment and Progressive Brain Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Morphants show reduced head size, a smaller cerebellum, extensive brain
      apoptosis, reduced myelination and increased seizure-associated gene
      expression, which map onto the human microcephaly, cerebellar atrophy,
      white matter change and epilepsy. It is partial rather than full
      recapitulation because the model produces developmental hypoplasia in an
      embryo rather than the progressive postnatal atrophy that characterises the
      human disease, and because heart edema is a morphant phenotype without a
      direct human counterpart.
    limitations: >-
      Morpholino knockdown is a transient, dose-dependent reduction rather than
      a model of the human hypomorphic missense alleles, and morpholinos are
      known to produce off-target phenotypes. The rescue experiments control for
      that but do not make the knockdown a genetic model of the disease. The
      readouts are embryonic, so nothing in this model speaks to the progressive
      postnatal course.
    readouts:
    - name: Head size at 3 days post fertilization
      target: Neurodevelopmental Impairment and Progressive Brain Atrophy
      direction: DECREASED
      interpretation: >-
        Reduced head size in morphants, restored by co-injection of wild-type
        zebrafish or human messenger RNA.
      evidence:
      - reference: PMID:37454282
        reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Knockdown of tars2 in zebrafish embryos (morphants) via MO led to a
          significant reduction in head size (Figure 4A and B) and heart edema
          (Figure 4C) compared with uninjected and control MO embryos
        explanation: >-
          Reports the measurement and its direction.
    - name: Cerebellum area in the Tg(olig2:DsRed2) reporter line
      target: Neurodevelopmental Impairment and Progressive Brain Atrophy
      direction: DECREASED
      interpretation: >-
        Smaller cerebellum in morphants, the readout chosen because cerebellar
        atrophy dominates the human imaging.
      evidence:
      - reference: PMID:37454282
        reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we observed a smaller cerebellum (marked by olig2+ cells) in tars2
          morphants compared with control morphants
        explanation: >-
          Reports the cerebellar measurement in the reporter line.
    - name: Myelination and seizure-associated gene expression
      target: Neurodevelopmental Impairment and Progressive Brain Atrophy
      direction: ALTERED
      interpretation: >-
        Reduced mbpa, the myelin basic protein transcript, and elevated c-fos,
        a marker of seizure activity.
      evidence:
      - reference: PMID:37454282
        reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our study confirmed that zebrafish with reduced TARS2 function (tars2
          morphants) showed decreased myelination and increased seizure
          activity, as indicated by reduced mbpa and elevated c-fos expressions
        explanation: >-
          Reports both molecular readouts and what they stand for.
    evidence:
    - reference: PMID:37454282
      reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This evidence confirms that the observed phenotypes resulted from tars2
        downregulation and demonstrates functional conservation across species.
      explanation: >-
        The rescue result that establishes the model as informative for human
        TARS2 loss rather than as an off-target morpholino artefact.
  - target: Reduced Rag GTPase Binding and mTORC1 Dysregulation
    relationship: MEASURES
    fidelity: LOW
    description: >-
      The model provides the only in vivo readout of the mTORC1 arm, through two
      transcriptional targets of the pathway moving in the expected directions.
    limitations: >-
      Fidelity is LOW because a knockdown removes the protein entirely and
      therefore cannot distinguish the Rag-binding defect specific to the
      residue 301 to 381 variants from the general consequence of losing the
      synthetase. mTORC1 activity itself is not measured; the readout is the
      expression of two downstream targets.
    readouts:
    - name: PGC1-alpha and PPAR-alpha expression
      target: Reduced Rag GTPase Binding and mTORC1 Dysregulation
      direction: ALTERED
      interpretation: >-
        PGC1-alpha down and PPAR-alpha up in morphants, both regulated by
        mTORC1.
      evidence:
      - reference: PMID:37454282
        reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As expected, we found that PGC1α and PPARα were downregulated and
          upregulated, respectively, in tars2 knock-down animals, likely leading
          to dysregulation of mTORC1 signaling.
        explanation: >-
          Reports both transcriptional readouts and their directions.
    evidence:
    - reference: PMID:37454282
      reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We also discovered changes in mTORC1 signaling pathway in these
        morphants, with decreased PGC1α and increased PPARα levels
      explanation: >-
        Establishes that the model reports on the pathway, while the knockdown
        design prevents it from isolating the Rag-binding defect specifically.

diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    The primary diagnostic route, and in practice the only reliable one. The
    disorder has no pathognomonic biochemical marker, the respiratory chain
    enzymology is tissue-restricted and inconsistent, and the imaging pattern
    overlaps with several other mitochondrial aminoacyl-tRNA synthetase
    disorders. Interpretation is helped by the mutational spectrum being
    dominated by recurrent missense alleles, and in Chinese patients by the
    p.(Thr157Arg) founder variant.
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome or genome sequencing was carried out in 15 families.
    explanation: >-
      The diagnostic method used in the cohort that defined the clinical
      spectrum.
  - reference: PMID:39394138
    reference_title: "TARS2 c.470 C > G is a chinese-specific founder mutation in three unrelated families with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings expanded the mutation spectrum of TARS2 and confirmed that
      c.470 C > G is a Chinese-specific founder mutation.
    explanation: >-
      Establishes an ancestry-specific allele that shifts variant
      interpretation in Chinese patients.

- name: Respiratory Chain Enzymology in Muscle
  description: >-
    Historically the route to the diagnosis, and still informative when
    positive, but its limitations are the reason it no longer leads. The
    combined deficiency is found in muscle tissue and not reliably in
    fibroblasts or liver, so tissue choice determines the answer. Even in muscle
    it is inconsistent: of two patients biopsied in the largest cohort, one
    showed complex I deficiency and the other showed nothing. A normal or
    isolated result therefore does not exclude the diagnosis.
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 2 patients underwent muscle biopsy showing features of complex I
      deficiency in 1 of them.
    explanation: >-
      Shows how often the enzymology is uninformative even when performed, which
      is why sequencing has replaced it as the primary route.
  - reference: PMID:24827421
    reference_title: "VARS2 and TARS2 mutations in patients with mitochondrial encephalomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygous mutations in TARS2 in two siblings presenting with
      axial hypotonia and severe psychomotor delay associated with multiple MRC
      defects
    explanation: >-
      The combined respiratory chain defect in muscle that first identified the
      disorder biochemically.

- name: Systematic Cardiac, Renal and Auditory Screening
  description: >-
    Not a diagnostic test for the disorder but a recommendation that follows
    from it. Cardiomyopathy, renal tubular acidosis and hearing loss each occur
    in a minority, each is easy to miss without being sought, and the cohort
    authors note that all three may be underestimated because no affected
    individual had a specific work-up. All three are also actionable: one
    patient reached end-stage kidney disease by four and a half years.
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cardiological evaluation, urine analysis for tubulopathy and hearing
      screening is warranted in patients with biallelic TARS2 variants.
    explanation: >-
      The explicit surveillance recommendation from the largest cohort.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is possible that these features may be underestimated, considering that
      no affected individual had specific work-up or that they may develop
      hearing impairment and cardiac and rental tubular dysfunction later.
    explanation: >-
      The reason the recommendation is made: ascertainment, not rarity, may
      explain the low reported frequencies.

treatments:
- name: Antiseizure Medication
  description: >-
    Symptomatic, and the only pharmacological intervention with reported
    outcomes in this disorder. Seizures occurred in eight individuals in the
    largest cohort and were successfully controlled in half of them, so the
    response is real but partial. No agent is established as preferable, and no
    disease-modifying therapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy, including tonic-clonic seizures, myoclonic seizures, and
      infantile spasms, occurred in 8 individuals and was successfully
      controlled with anti-seizure medications in half of them.
    explanation: >-
      Supports antiseizure medication while quantifying the partial response,
      which is why the support is PARTIAL.
  notes: >-
    No therapeutic_agent is bound. No specific drug is named as effective in the
    reported cohorts, and binding one would imply a recommendation the evidence
    does not support.

- name: Supportive and Organ-Directed Care
  description: >-
    There is no disease-modifying therapy, so management is supportive and its
    content follows from the surveillance recommendations: alkali and
    electrolyte replacement for renal tubular acidosis, and renal replacement
    therapy in the one patient who reached end-stage kidney disease; cardiac
    management where hypertrophic cardiomyopathy is found; and the usual
    developmental therapies and nutritional support. Nothing in this list is
    specific to TARS2, and none of it has been evaluated in this disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38482264
    reference_title: "Expanding the Phenotypic Spectrum: Chronic Kidney Disease in a Patient with Combined Oxidative Phosphorylation Defect 21."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We referred the patient to paediatric centre that provides renal
      replacement therapy.
    explanation: >-
      The only organ-directed intervention reported by name in this disorder,
      in the single patient who progressed to end-stage kidney disease.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cardiological evaluation, urine analysis for tubulopathy and hearing
      screening is warranted in patients with biallelic TARS2 variants.
    explanation: >-
      The surveillance recommendation from which the content of supportive care
      follows: what is looked for is what gets treated.
  notes: >-
    No therapeutic_agent and no regimen are bound. Nothing in this entry is a
    TARS2-specific therapy; it records what is done for the organ involvement
    the disorder produces. Mitochondrial supplement cocktails are used
    empirically in this disease family but have no reported efficacy evidence in
    this disorder, so they are not curated as a treatment.

discussions:
- discussion_id: coxpd21_two_mechanisms_relative_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the phenotype comes from impaired mitochondrial translation and
    how much from impaired mTORC1 signalling, and does the answer differ by
    which domain a variant hits?
  attaches_to:
  - "pathophysiology#Combined Respiratory Chain Complex Deficiency"
  - "pathophysiology#Reduced Rag GTPase Binding and mTORC1 Dysregulation"
  - "pathophysiology#Neurodevelopmental Impairment and Progressive Brain Atrophy"
  rationale: >-
    Two mechanisms are curated here as separate hypothesis groups, and the
    honest position is that their relative contribution is unknown. The
    translational one is established: reduced synthetase, reduced charged tRNA,
    combined respiratory chain deficiency, rescued by wild-type TARS2. The
    mTORC1 one is supported but not established, and the evidence for it is
    indirect at every step.

    There are three concrete reasons to think it is not merely a laboratory
    artefact. Four disease variants cluster in the residue 301 to 381 Rag-binding
    region, which is not where you would put variants if aminoacylation were the
    only thing that mattered. Those variants group clinically as well as
    biochemically, showing basal ganglia and cerebellar signal change without
    cerebellar atrophy. And one of them, p.(Arg327Gln), is associated with
    neonatal diabetes, a beta cell phenotype that the translational model does
    not predict and that no other TARS2 allele produces.

    Against that, the binding experiments used transfected constructs whose
    basal expression was itself reduced to between 39 and 66 percent of wild
    type, so less binding and less protein are confounded. mTORC1 activity was
    never measured in patient cells. And the in vivo evidence is a morpholino
    knockdown, which removes the protein altogether and therefore cannot
    separate a specific Rag-binding defect from general loss of the synthetase.

    The question is not academic. The cohort authors end by asking whether
    mTORC1 drug modulators could be therapeutic here, and that question cannot
    be answered without knowing whether mTORC1 dysregulation drives the
    phenotype or accompanies it.
  proposed_experiments:
  - experiment_id: coxpd21_patient_cell_mtorc1_activity
    name: Direct measurement of mTORC1 activity in patient cells stratified by variant domain
    description: >-
      Measure mTORC1 activity, by phosphorylation of S6 kinase and 4E-BP1 under
      threonine withdrawal and repletion, in fibroblasts from patients carrying
      Rag-binding-region variants against patients carrying catalytic or editing
      domain variants and against controls. This tests the step the current
      evidence infers rather than measures, and the domain stratification is
      what would show whether the mTORC1 arm is variant-specific.
  - experiment_id: coxpd21_separation_of_function_alleles
    name: Separation-of-function allele series in a knock-in cell model
    description: >-
      Engineer knock-in alleles at the endogenous locus rather than transfecting
      constructs, so protein level is set by the allele rather than by
      transfection, and measure aminoacylation and Rag binding independently in
      each. This removes the expression confound that currently prevents the
      binding result from being read cleanly.
  - experiment_id: coxpd21_beta_cell_model_of_r327q
    name: Beta cell model of the p.(Arg327Gln) allele
    description: >-
      Differentiate beta cells from induced pluripotent stem cells carrying
      p.(Arg327Gln) and test insulin secretion, survival and mTORC1 activity
      against isogenic controls and against a catalytic-domain variant. The
      neonatal diabetes association is the single strongest human argument for
      the mTORC1 arm, and this is what would turn it from an association into a
      mechanism.
  evidence:
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides impaired aminoacylation, other factors have been reported to
      explain the variety of phenotypes present in ARS2-related disorders. These
      factors include non-canonical functions, tissue-specific developmental
      differences in energy requirements, and downstream effects of
      mitochondrial dysfunction on other intracellular organelles.
    explanation: >-
      Frames the question: aminoacylation alone is not thought to account for
      the phenotypic range in this disease family.
  - reference: PMID:37454282
    reference_title: "Clinical, neuroradiological, and molecular characterization of mitochondrial threonyl-tRNA-synthetase (TARS2)-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, these observations raise the question whether mTORC1 drug
      modulators could be therapeutic for individuals with TARS2-related
      disorder in the future.
    explanation: >-
      States the therapeutic stake that makes resolving the relative
      contribution worth doing.

notes: >-
  Two mechanisms, curated as two hypothesis groups. The causal edges in this
  entry carry hypothesis_groups so the canonical translational chain and the
  emerging mTORC1 chain can be read separately. They converge on the same
  clinical node rather than competing to explain it, and the open question is
  their relative contribution, not which one is right.

  Not curated here, and why. No prevalence record: roughly thirty patients have
  been described and no population estimate exists. No environmental section,
  although the entry does record that developmental regression is typically
  triggered by intercurrent illness, which is the catabolic-stress pattern
  common to mitochondrial disease; no source examined here treats that as an
  exposure with its own evidence. No experimental_models section: the human
  work is transfection-based co-immunoprecipitation and fibroblast rescue rather
  than a characterised model system, and those results are curated as evidence
  on the nodes they bear on.

  The Orphanet record ORPHA:420733 defines this disorder and states that the
  combined respiratory chain deficiency is present in muscle tissue but not in
  fibroblasts or liver. That tissue restriction is curated in the diagnosis
  section, but sourced to the primary literature rather than to Orphanet,
  because the ORPHA structured reference is not present in this repository's
  references_cache and just refresh-orphadata currently fails on a drifted
  checksum in data/orphadata/MANIFEST.yaml. Adding ORPHA:420733 to the cache
  and citing it directly would strengthen the epidemiology and definition
  sections and is worth doing once that recipe works.

  Deep research: a false start worth recording. The first falcon run for this
  disease returned a report about TACO1, mentioning TARS2 zero times and TACO1
  fifty-nine times. just preflight-dr returned FAIL, and the report was deleted
  rather than committed, since a wrong-entity file in research/ misleads the next
  curator and falsely registers provider coverage. A second run with the
  claude_code provider returned a TARS2 report that passed preflight, and that is
  the report committed here. Nothing in this entry was curated from either
  report; every snippet was taken from a references_cache file fetched directly.

  GeneReviews has no chapter for this entity, and a PubMed search returned none.

  Frequency bands. Most frequencies here come from a single pooled analysis of
  28 individuals in the 2023 cohort paper, which is the only source that reports
  denominators. Sensorineural hearing impairment carries no frequency because
  the two available denominators disagree, and the cohort authors say the
  feature may be underestimated for lack of systematic screening.

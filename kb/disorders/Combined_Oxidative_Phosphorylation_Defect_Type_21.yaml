    reference_title: "TARS2 c.470 C > G is a chinese-specific founder mutation in three unrelated families with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TARS2 (MIM 612805) encodes a 718-amino acid mitochondrial threonyl
      tRNA-synthetase, which contains an N-terminal N1 domain (Leu20-Ser124), an
      N2 domain (for editing) (Pro125-Asp301), an aminoacylation domain (for
      amino acid activation and tRNA charging) (His302-Gly605), and an anticodon
      binding domain (for tRNA binding) (Lys606-Phe718)
    explanation: >-
      Gives the domain architecture against which disease variants are located.

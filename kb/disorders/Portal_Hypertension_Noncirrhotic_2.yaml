differential_diagnoses:
- name: DGUOK-related noncirrhotic portal hypertension
  description: >-
    Noncirrhotic portal hypertension 1, caused by recessive DGUOK variants. It
    presents in the same way - portal hypertension of indeterminate cause
    beginning in infancy or childhood, without cirrhosis - and is separated only
    by sequencing.
  evidence:
  - reference: PMID:26874653
    reference_title: "Recurrent recessive mutation in deoxyguanosine kinase causes idiopathic noncirrhotic portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three subjects from two consanguineous families shared the identical rare
      homozygous p.N46S mutation in DGUOK, a deoxyguanosine kinase required for mitochondrial
      DNA replication
    explanation: Identifies the distinct gene and mechanism of the sibling entity.
  - reference: PMID:26874653
    reference_title: "Recurrent recessive mutation in deoxyguanosine kinase causes idiopathic noncirrhotic portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All three affected subjects had stable portal hypertension with noncirrhotic
      liver disease for 6-16 years of follow-up
    explanation: Shows the clinical presentation is indistinguishable at the bedside.
- name: Other genetic causes of porto-sinusoidal vascular disorder
  description: >-
    A broad differential: more than thirty genes have been associated with
    porto-sinusoidal vascular disorder, some as part of syndromes and some as
    isolated disease. GIMAP5 sits among the isolated-PSVD genes, and the
    striking observation across the whole set is that these genes are
    predominantly expressed in immune cells.
  evidence:
  - reference: PMID:38900412
    reference_title: "Genetic predisposition to porto-sinusoidal vascular disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 34 genes and 1 chromosomal abnormality associated with PSVD
      in the literature
    explanation: Gives the size of the genetic differential.
  - reference: PMID:38900412
    reference_title: "Genetic predisposition to porto-sinusoidal vascular disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we found that these genes are predominantly expressed in immune cells,
      suggesting that these cells may play a more important role in the development
      of PSVD than previously thought
    explanation: Places the GIMAP5 immune-endothelial duality within a broader pattern
      across PSVD genes.
- name: Drug-induced noncirrhotic portal hypertension
  description: >-
    Acquired phenocopies exist and must be excluded, notably didanosine
    exposure. The connection is not merely clinical: didanosine lowers
    deoxyguanosine kinase levels, which is the same protein whose loss causes
    the inherited NCPH1, so the acquired and inherited forms may converge
    mechanistically.
  evidence:
  - reference: PMID:26874653
    reference_title: "Recurrent recessive mutation in deoxyguanosine kinase causes idiopathic noncirrhotic portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: treatment of patients with human immunodeficiency viral infection with
      the nucleoside analogue didanosine is known to cause portal hypertension in a
      subset of patients and lowers deoxyguanosine kinase levels in vitro
    explanation: Documents the acquired phenocopy and the shared molecular target.
discussions:
- discussion_id: hsct_will_not_reverse_portal_hypertension
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does correcting the haematopoietic compartment alter the course of the
    hepatic vascular disease in GIMAP5 deficiency?
  attaches_to:
  - pathophysiology#Sinusoidal Capillarization
  - treatments#Hematopoietic Cell Transplantation
  rationale: >-
    The mouse evidence says the two arms are independent: endothelial-specific
    deletion reproduces the capillarization on its own, and the hepatic
    pathology persists in a Rag2-deficient background lacking mature B, T and NK
    cells, and cannot be adoptively transferred with marrow. The prediction is
    that haematopoietic transplantation will not reverse established portal
    hypertension. But this has not been tested in patients, and the untested
    question that matters is whether transplantation performed early, before
    capillarization is established, changes the hepatic trajectory. Because HSCT
    carries real mortality and is being weighed for the immune arm anyway, this
    gap sits directly on a clinical decision rather than beside one.
  evidence:
  - reference: PMID:18796632
    reference_title: "Impaired survival of peripheral T cells, disrupted NK/NKT cell development, and liver failure in mice lacking Gimap5."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This pathology persists in a Rag2-deficient background in the absence
      of mature B, T, or NK cells and cannot be adoptively transferred by transplanting
      gimap5(-/-) bone marrow into wild-type recipients
    explanation: The lymphocyte-independence result on which the prediction rests.
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: this effect is also seen when GIMAP5 is selectively deleted in endothelial
      cells
    explanation: The complementary result showing the endothelium alone is sufficient.
- discussion_id: ceramide_pathway_to_endothelial_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does the CK2-ceramide senescence pathway account for the endothelial arm,
    or only the lymphocyte arm?
  attaches_to:
  - pathophysiology#Long-Chain Ceramide Accumulation
  - pathophysiology#Reduced GATA4 in Liver Sinusoidal Endothelial Cells
  rationale: >-
    The CK2-ceramide axis was demonstrated in T cells, where inhibiting CK2 or
    ceramide synthase rescues the cells. It is presented as a unifying mechanism
    for both arms of the disease, but the endothelial half of that claim is an
    extrapolation: no study has shown ceramide accumulation in liver sinusoidal
    endothelial cells, nor that CK2 or ceramide synthase inhibition prevents
    capillarization or reduces GATA4 loss. This matters because CK2 and
    ceramide-synthase inhibitors are the leading candidate targeted therapies,
    and whether they could address the portal hypertension or only the immune
    disease turns on exactly this question.
  proposed_experiments:
  - experiment_id: lsec_ceramide_and_ck2_rescue
    name: Ceramide profiling and CK2 inhibition in GIMAP5-deficient liver endothelium
    description: >-
      Measure long-chain ceramide species in liver sinusoidal endothelial cells
      isolated from endothelial-specific Gimap5 knockout mice against littermate
      controls, then test whether CK2 or ceramide-synthase inhibition prevents
      GATA4 loss and capillarization in the same model.
    readouts:
    - name: Long-chain ceramide abundance in isolated LSECs
      target: pathophysiology#Long-Chain Ceramide Accumulation
      direction: INCREASED
      interpretation: Accumulation in endothelium would extend the pathway beyond
        lymphocytes.
    - name: GATA4 expression after CK2 inhibition
      target: pathophysiology#Reduced GATA4 in Liver Sinusoidal Endothelial Cells
      direction: RESTORED
      interpretation: Restoration would place the ceramide pathway upstream of the
        endothelial transcriptional defect.
    would_support:
    - pathophysiology#Long-Chain Ceramide Accumulation
    supporting_outcome:
    - Ceramides accumulate in GIMAP5-deficient liver sinusoidal endothelial cells,
      and CK2 or ceramide-synthase inhibition preserves GATA4 expression and prevents
      capillarization.
    would_refute:
    - pathophysiology#Long-Chain Ceramide Accumulation
    refuting_outcome:
    - Ceramide levels are unchanged in GIMAP5-deficient liver endothelium, or
      inhibition rescues lymphocytes while leaving capillarization and GATA4 loss
      unaffected, showing the endothelial arm runs through a different pathway.
  evidence:
  - reference: PMID:38172257
    reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inhibition of CK2 and CER synthase rescues GIMAP5-deficient T cells by
      preventing CER overaccumulation and cell deterioration
    explanation: The rescue is demonstrated in T cells; the endothelial equivalent
      is what is missing.
notes: >-
  Scope. This entry is GIMAP5 only. Noncirrhotic portal hypertension 1 is a
  distinct entity caused by DGUOK and is curated here as a differential rather
  than as content. The deep-research report is correct on this and states OMIM
  619463 for the phenotype; the preflight check flagged an OMIM mismatch only
  because it read the gene MIM 608086 and the NCPH1 MIM 617068 out of the text
  while missing the hash-prefixed 619463.

  Why the two arms are curated as independent branches. The hepatic and immune
  diseases share an upstream step but do not depend on one another, and the
  evidence for that is unusually clean in both directions: deleting Gimap5 in
  endothelium alone reproduces the sinusoidal capillarization, and the hepatic
  pathology persists in mice lacking mature B, T and NK cells and cannot be
  transferred with marrow. This is not a modelling nicety - it is why
  haematopoietic transplantation is not expected to reverse established portal
  hypertension, and the treatment entry for transplantation carries both a
  SUPPORT item for the immune arm and a REFUTE item for the hepatic one.

  What the shared upstream step does and does not cover. The CK2-ceramide
  senescence pathway is presented in the literature as unifying both arms, but
  it was demonstrated in T cells. No study has shown ceramide accumulation in
  liver sinusoidal endothelial cells, or that inhibiting CK2 or ceramide
  synthase prevents capillarization. That gap is recorded as an open discussion
  with a proposed experiment rather than smoothed over, because the leading
  candidate targeted therapies act on exactly that pathway.

  The germline null is curated as a partial failure. The whole-body Gimap5
  knockout mouse recapitulates the lymphocyte arm well but FAILS_TO_RECAPITULATE
  the portal hypertension: its hepatic phenotype is hepatocyte apoptosis and
  liver failure, and it dies at a median of fifteen weeks. Reporting it as
  simply "a mouse model of GIMAP5 deficiency" would obscure that the most
  complete genetic null available cannot be used to study the disease's defining
  feature.

  Report term corrections. CL:1000488, which the report offered for liver
  sinusoidal endothelial cell, is cholangiocyte; CL:1000398 endothelial cell of
  hepatic sinusoid is used instead. Two of the four NCIT treatment codes the
  report proposed are also wrong, and no report-side validation checks NCIT:
  C692, offered for propranolol, is Nimodipine, and C15356, offered for Liver
  Transplantation, is the Whipple Procedure. NCIT:C62073 and NCIT:C15271 are the
  correct terms; the report's C1212 for sirolimus and C15431 for haematopoietic
  cell transplantation are right. Every other identifier it suggested resolved
  correctly, which makes this a more reliable report than the FEPS3 one in the
  same batch.

  Deliberately not curated. No environmental entries: nothing environmental is
  required or established, and the acquired drug-induced phenocopies belong in
  differential diagnoses, where didanosine is recorded. Endoscopic variceal band
  ligation and transjugular intrahepatic portosystemic shunting are real
  management steps but no NCIT clinical-action term was found for variceal
  ligation, and the shunt outcome is a single-patient observation, so both are
  left out rather than bound to an approximate term. The GSK3 and
  CK2/ceramide-synthase inhibitors are in-vitro rescues, not treatments. The
  beta-blockade and transplantation entries carry notes recording that their
  rationale is extrapolated from general portal-hypertension practice or
  mechanistic reasoning rather than from evidence in this disease. One further reference, on
  NF-kappaB and MAPK activation in Gimap5-mutant rat T cells, was fetched by the
  research run, read and set aside: it concerns a signalling branch this entry
  does not model, and its cache is not shipped.

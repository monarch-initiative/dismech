  - preferred_term: T cell homeostasis
    term:
      id: GO:0043029
      label: T cell homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:18796632
    reference_title: "Impaired survival of peripheral T cells, disrupted NK/NKT cell development, and liver failure in mice lacking Gimap5."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: selective gene ablation of the mouse gimap5 gene impairs the final intrathymic
      maturation of CD8 and CD4 T cells and compromises the survival of postthymic
      CD4 and CD8 cells
    explanation: Establishes the survival defect in T cells on Gimap5 loss.
  - reference: PMID:29382851
    reference_title: "Gimap5-dependent inactivation of GSK3\u03b2 is required for CD4(+) T cell homeostasis and prevention of immune pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a human patient with a GIMAP5 loss-of-function mutation has lymphopenia
      and impaired T cell proliferation in vitro that can be rescued with GSK3 inhibitors
    explanation: Confirms the proliferation defect in a human patient and identifies
      a pharmacological rescue.
  downstream:
  - target: Decreased total lymphocyte count
    causal_link_type: DIRECT
    description: Failure of lymphocyte survival and proliferation manifests as lymphopenia.
    evidence:
    - reference: PMID:38055739
      reference_title: "Essential role of MFSD1-GLMP-GIMAP5 in lymphocyte survival and liver homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Germline knockout alleles of Mfsd1, Glmp, and Gimap5 each caused lymphopenia,
        liver pathology, EMH, and lipid deposition in the bone marrow and liver
      explanation: Reports lymphopenia on Gimap5 loss alongside the liver pathology.
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: Lymphopenia and T-cell exhaustion leave the patient susceptible to

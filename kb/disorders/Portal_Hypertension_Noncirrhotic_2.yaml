inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two damaged alleles are required. Most reported index families are
    consanguineous with homozygous variants, and monoallelic carriers are
    generally healthy.
  evidence:
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we demonstrate homozygous damaging mutations in GIMAP5, a small organellar
      GTPase, in four families with unexplained portal hypertension
    explanation: Establishes the recessive, homozygous basis across four independent
      families.
  - reference: PMID:42358996
    reference_title: "Unexpected genetically determined immune dysregulation with liver involvement: GIMAP5 therapeutic dilemmas between targeted therapy and HSCT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Biallelic loss-of-function mutations in the GTPase of immunity-associated
      protein 5 (GIMAP5) cause a severe syndrome
    explanation: States the biallelic requirement directly.
genetic:
- name: GIMAP5
  gene_term:
    preferred_term: GIMAP5
    term:
      id: hgnc:18005
      label: GIMAP5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we demonstrate homozygous damaging mutations in GIMAP5, a small organellar
      GTPase, in four families with unexplained portal hypertension
    explanation: The gene-discovery study.
  variants:
  - name: p.Leu204Pro
    description: >-
      The recurrent allele, seen homozygously and in compound heterozygosity
      across independent reports. It is the most frequent of the reported
      variants in population databases, which is why it is the one most likely
      to be encountered.
    functional_effects:
    - function: GIMAP5 GTPase activity
      description: Loss of function; the substitution maps to the AIG1-type G domain.
    evidence:
    - reference: PMID:42358996
      reference_title: "Unexpected genetically determined immune dysregulation with liver involvement: GIMAP5 therapeutic dilemmas between targeted therapy and HSCT."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Genetic analysis identified compound heterozygous variants (p.Leu204Pro
        and p.Arg214Ter) in GIMAP5 gene resulting in absent protein expression
      explanation: Reports this allele in compound heterozygosity with a nonsense
        allele, leaving no detectable protein.
  - name: p.Arg214Ter
    description: A nonsense allele reported in compound heterozygosity with p.Leu204Pro,
      in a combination that leaves no detectable GIMAP5 protein.
    functional_effects:
    - function: GIMAP5 GTPase activity
      description: Loss of function through premature termination.
    evidence:
    - reference: PMID:42358996
      reference_title: "Unexpected genetically determined immune dysregulation with liver involvement: GIMAP5 therapeutic dilemmas between targeted therapy and HSCT."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Genetic analysis identified compound heterozygous variants (p.Leu204Pro
        and p.Arg214Ter) in GIMAP5 gene resulting in absent protein expression
      explanation: Reports the allele pair and the absent-protein consequence
        directly.
  notes: >-
    All reported disease alleles are germline and recessive, and most are
    missense substitutions in or near the AIG1-type G domain; at least one
    nonsense allele is reported. GIMAP5 is loss-of-function tolerant at the
    population level, which is consistent with heterozygous carriers being
    unaffected. Note that the stability of GIMAP5 depends on the lysosomal
    MFSD1-GLMP complex, so MFSD1 and GLMP are candidate biological modifiers
    rather than established ones.
pathophysiology:
- name: Biallelic GIMAP5 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged GIMAP5 alleles leave little or no functional GTPase. GIMAP5 is
    expressed selectively in lymphocytes and endothelial cells, which is what
    confines the disease to those two compartments despite the gene being lost
    everywhere.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: lysosomal membrane
    term:
      id: GO:0005765
      label: lysosomal membrane
  evidence:
  - reference: PMID:38172257
    reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: deficiency of GIMAP5, an evolutionarily conserved GTPase selectively expressed
      in lymphocytes and endothelial cells
    explanation: Establishes the restricted expression pattern that determines which
      tissues the disease affects.
  downstream:
  - target: Unrestrained CK2 Activation of Ceramide Synthases
    causal_link_type: DIRECT
    description: GIMAP5 normally binds CK2 and attenuates its activation of ceramide
      synthases, so losing GIMAP5 removes that restraint.
    evidence:
    - reference: PMID:38172257
      reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: GIMAP5 controls CER abundance by interacting with protein kinase CK2
        (CK2), attenuating its ability to activate CER synthases
      explanation: States the direct molecular interaction and what its loss releases.
  - target: Lymphocyte Apoptosis and Impaired Proliferation
    causal_link_type: DIRECT
    description: >-
      In lymphocytes, GIMAP5 loss also leaves GSK3-beta constitutively active,
      which constrains c-Myc induction and NFATc1 nuclear import and limits
      productive proliferation independently of the ceramide route.
    evidence:
    - reference: PMID:29382851
      reference_title: "Gimap5-dependent inactivation of GSK3\u03b2 is required for CD4(+) T cell homeostasis and prevention of immune pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In the absence of Gimap5, constitutive GSK3beta activity constrains
        c-Myc induction and NFATc1 nuclear import, thereby limiting productive CD4+
        T cell proliferation
      explanation: Gives the second, GSK3-beta-dependent route from GIMAP5 loss to
        the lymphocyte phenotype.
- name: Unrestrained CK2 Activation of Ceramide Synthases
  biological_scale: MOLECULAR
  description: >-
    Without GIMAP5 to attenuate it, protein kinase CK2 over-activates ceramide
    synthases. This is the shared upstream step proposed for both arms of the
    disease.
  biological_processes:
  - preferred_term: ceramide metabolic process
    term:
      id: GO:0006672
      label: ceramide metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38172257
    reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: GIMAP5 controls CER abundance by interacting with protein kinase CK2 (CK2),
      attenuating its ability to activate CER synthases
    explanation: Identifies CK2 and the ceramide synthases as the immediate downstream
      effectors.
  downstream:
  - target: Long-Chain Ceramide Accumulation
    causal_link_type: DIRECT
    description: Over-active ceramide synthases produce ceramide faster than it is
      cleared.
    evidence:
    - reference: PMID:38172257
      reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show that GIMAP5 restricts the pathological accumulation of long-chain
        ceramides (CERs), thereby regulating longevity
      explanation: States the accumulation and its consequence for cell longevity.
- name: Long-Chain Ceramide Accumulation
  biological_scale: MOLECULAR
  description: >-
    Pathological accumulation of long-chain ceramides, the defining metabolic
    signature of GIMAP5 deficiency. That inhibiting either CK2 or ceramide
    synthase rescues the cells is what makes this a causal step rather than a
    correlate.
  chemical_entities:
  - preferred_term: ceramide
    term:
      id: CHEBI:17761
      label: ceramide
    modifier: INCREASED
  evidence:
  - reference: PMID:38172257
    reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Inhibition of CK2 and CER synthase rescues GIMAP5-deficient T cells by
      preventing CER overaccumulation and cell deterioration
    explanation: The rescue experiment establishing that the ceramide accumulation
      causes the cellular deterioration rather than accompanying it.
  downstream:
  - target: Cellular Senescence in Endothelium and Lymphocytes
    causal_link_type: DIRECT
    description: Ceramide overaccumulation drives the senescent phenotype in the two
      cell types that express GIMAP5.
    evidence:
    - reference: PMID:38172257
      reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we report a new human genetic disease that causes cell senescence, liver
        and immune dysfunction, and early mortality that results from deficiency of
        GIMAP5
      explanation: Names cell senescence as the consequence, together with the two
        organ systems affected.
- name: Cellular Senescence in Endothelium and Lymphocytes
  biological_scale: CELLULAR
  description: >-
    Senescence and organelle dysfunction in the GIMAP5-expressing compartments.
    From here the disease divides into a hepatic vascular arm and an immune
    arm, which proceed independently of each other.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:38172257
    reference_title: "GIMAP5 deficiency reveals a mammalian ceramide-driven longevity assurance pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a new human genetic disease that causes cell senescence, liver and immune
      dysfunction, and early mortality
    explanation: Establishes senescence as the cellular endpoint of the shared pathway.
  downstream:
  - target: Reduced GATA4 in Liver Sinusoidal Endothelial Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GIMAP5 is placed upstream of GATA4 by single-cell transcriptomics, but the
      steps connecting the ceramide and senescence pathway to GATA4 have not
      been demonstrated.
    evidence:
    - reference: PMID:33956074
      reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: places GIMAP5 upstream of GATA4, a transcription factor required for
        LSEC specification
      explanation: Establishes the ordering without demonstrating the intervening
        mechanism.
- name: Reduced GATA4 in Liver Sinusoidal Endothelial Cells
  biological_scale: CELLULAR
  description: >-
    Loss of GATA4, the transcription factor required to specify liver
    sinusoidal endothelial cell identity. This is the step that turns a
    generic endothelial defect into a specifically hepatic one.
  cell_types:
  - preferred_term: liver sinusoidal endothelial cell
    term:
      id: CL:1000398
      label: endothelial cell of hepatic sinusoid
  biological_processes:
  - preferred_term: endothelial cell differentiation
    term:
      id: GO:0045446
      label: endothelial cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: places GIMAP5 upstream of GATA4, a transcription factor required for LSEC
      specification
    explanation: Identifies GATA4 and its role in specifying the affected cell type.
  downstream:
  - target: Sinusoidal Capillarization
    causal_link_type: DIRECT
    description: Without GATA4 the sinusoidal endothelium loses its specialized identity
      and takes on a continuous, capillary-like phenotype.
    evidence:
    - reference: PMID:33956074
      reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: its loss in both humans and mice results in capillarization of liver
        sinusoidal endothelial cells (LSECs)
      explanation: States the consequence in both species.
- name: Sinusoidal Capillarization
  biological_scale: TISSUE
  description: >-
    The specialized fenestrated sinusoidal endothelium is replaced by
    capillarized endothelium, and macrovascular hepatic endothelial cells are
    reduced. Critically this happens when GIMAP5 is deleted in endothelium
    alone, which is what establishes the lesion as endothelial-intrinsic rather
    than a consequence of the immune disease.
  locations:
  - preferred_term: hepatic sinusoid
    term:
      id: UBERON:0001281
      label: hepatic sinusoid
  cell_types:
  - preferred_term: liver sinusoidal endothelial cell
    term:
      id: CL:1000398
      label: endothelial cell of hepatic sinusoid
  evidence:
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: this effect is also seen when GIMAP5 is selectively deleted in endothelial
      cells
    explanation: The endothelial-specific deletion experiment establishing cell-intrinsic
      causation.
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: reveals replacement of LSECs with capillarized endothelial cells, a reduction
      of macrovascular hepatic endothelial cells
    explanation: Describes the cellular composition change by single-cell sequencing.
  downstream:
  - target: Increased Intrahepatic Vascular Resistance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Capillarized sinusoids, with nodular regenerative hyperplasia and
      obliterative portal venopathy, raise resistance to portal flow. The
      quantitative contribution of each histological change has not been
      partitioned.
    evidence:
    - reference: PMID:33956074
      reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: GIMAP5 is a critical regulator of liver endothelial cell homeostasis
        and, when absent, produces portal hypertension
      explanation: Links the endothelial lesion to the haemodynamic outcome without
        resolving the intervening steps.
- name: Increased Intrahepatic Vascular Resistance
  biological_scale: TISSUE
  description: >-
    Raised resistance to portal venous flow within a liver that is not
    cirrhotic. This is the defining haemodynamic abnormality, and the absence
    of cirrhosis, fibrosis and portal vein thrombosis is what makes the entity
    noncirrhotic portal hypertension rather than ordinary chronic liver
    disease.
  locations:
  - preferred_term: portal vein
    term:
      id: UBERON:0002017
      label: portal vein
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:33956074
    reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Portal hypertension is a major contributor to decompensation and death
      from liver disease, a global health problem
    explanation: Frames the clinical significance of the haemodynamic endpoint.
  downstream:
  - target: Portal hypertension
    causal_link_type: DIRECT
    description: The raised resistance is the portal hypertension.
    evidence:
    - reference: PMID:33956074
      reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: GIMAP5 is a critical regulator of liver endothelial cell homeostasis
        and, when absent, produces portal hypertension
      explanation: States the causal endpoint directly.
  - target: Splenomegaly
    causal_link_type: DIRECT
    description: Portal congestion enlarges the spleen.
    evidence:
    - reference: PMID:38055739
      reference_title: "Essential role of MFSD1-GLMP-GIMAP5 in lymphocyte survival and liver homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Germline knockout alleles of Mfsd1, Glmp, and Gimap5 each caused lymphopenia,
        liver pathology, EMH, and lipid deposition in the bone marrow and liver
      explanation: Confirms liver pathology on Gimap5 loss in the model system; the
        splenomegaly of the human disease follows from the portal congestion.
  - target: Esophageal varix
    causal_link_type: DIRECT
    description: Portosystemic collaterals decompress the hypertensive portal system
      through the oesophageal veins.
    evidence:
    - reference: PMID:33956074
      reference_title: "GIMAP5 maintains liver endothelial cell homeostasis and prevents portal hypertension."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Portal hypertension is a major contributor to decompensation and death
        from liver disease
      explanation: Establishes decompensation, of which variceal formation is the
        principal mechanism, as the clinical consequence.
  - target: Nodular regenerative hyperplasia of liver
    causal_link_type: DIRECT
    description: The characteristic hepatic histology of the disorder, found on biopsy
      in the absence of cirrhosis.
    evidence:
    - reference: PMID:42358996
      reference_title: "Unexpected genetically determined immune dysregulation with liver involvement: GIMAP5 therapeutic dilemmas between targeted therapy and HSCT."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: GIMAP5 deficiency drives a distinct vascular remodeling characterized
        by nodular regenerative hyperplasia (NRH) and porto-sinusoidal vascular disorder
        (PSVD), frequently progressing to non-cirrhotic portal hypertension
      explanation: Ties the histological lesion to the haemodynamic outcome in this
        disease.
- name: Lymphocyte Apoptosis and Impaired Proliferation
  biological_scale: CELLULAR
  description: >-
    Spontaneous T and NK cell apoptosis with impaired proliferation. GIMAP5 has
    long been recognized as an anti-apoptotic factor required for lymphocyte
    survival, and this arm of the disease was characterized in rodents well
    before the human portal hypertension phenotype was described.
  cell_types:

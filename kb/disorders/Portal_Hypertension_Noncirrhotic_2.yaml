      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: alongside an expanded atypical memory B-cell population and T-cell
        exhaustion
      explanation: Records the immune dysregulation accompanying the cytopenias
        without establishing how a lymphocyte survival defect produces
        autoimmunity.

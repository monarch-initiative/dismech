name: Portal_Hypertension_Noncirrhotic_2
category: Mendelian
creation_date: '2026-09-01T23:50:00Z'
description: >-
  Noncirrhotic portal hypertension 2 is an autosomal recessive disorder caused
  by biallelic loss-of-function variants in GIMAP5, which encodes a small
  organellar GTPase expressed selectively in lymphocytes and endothelial cells.
  It is distinctive on two counts. First, the portal hypertension arises from a
  primary endothelial lesion rather than from hepatocellular injury or
  fibrosis: losing GIMAP5 reduces GATA4, the transcription factor that
  specifies liver sinusoidal endothelial cell identity, and the sinusoids
  capillarize, raising intrahepatic vascular resistance in a liver that is not
  cirrhotic. Second, the same molecular lesion produces an inborn error of
  immunity in parallel, with lymphopenia, recurrent infection and autoimmune
  cytopenias, because GIMAP5 is required for lymphocyte survival as well. A
  unifying upstream step has been proposed for both arms: GIMAP5 restrains
  protein kinase CK2, and without it ceramide synthases run unchecked and
  long-chain ceramides accumulate, driving cellular senescence. The two arms
  are nonetheless mechanistically independent, which matters clinically -
  endothelial-specific deletion reproduces the capillarization on its own, and
  mice lacking mature lymphocytes still develop the liver disease, so
  transplanting the immune system is not expected to reverse established portal
  hypertension.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals diagnosed with autosomal dominant CLCN7-related osteopetrosis have an affected parent. Each child of an individual with autosomal dominant osteopetrosis has a 50% chance of inheriting the pathogenic variant."
    explanation: "GeneReviews confirms autosomal dominant inheritance with 50% offspring transmission risk."

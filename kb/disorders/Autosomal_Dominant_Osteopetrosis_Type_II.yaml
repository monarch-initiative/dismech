- name: CLCN7
  gene_term:
    preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  association: Heterozygous dominant-negative missense variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous missense mutations in CLCN7 on chromosome 16p13.3 act via a
    dominant-negative mechanism through dimeric channel disruption; nine
    different mutations were identified in 22 of 23 ADO2 families in early
    series, indicating near-complete genetic homogeneity among CLCN7-related
    ADO2 families. Biallelic CLCN7 variants cause allelic autosomal recessive
    osteopetrosis.

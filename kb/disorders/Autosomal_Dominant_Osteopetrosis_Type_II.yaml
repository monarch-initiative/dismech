- name: Impaired Resorption Lacuna Acidification
  description: >
    Dysfunctional ClC-7 chloride/proton antiporters reduce the ability of
    osteoclasts to acidify the resorption lacuna, decreasing bone resorption
    capacity despite normal or compensatorily increased osteoclast numbers.
  notes: >-
    ADO2 shows incomplete penetrance and variable expressivity, and affected
    adults exhibit elevated osteoclast-number markers (TRAP) alongside reduced
    bone-resorption markers (CTX), consistent with osteoclast-rich resorption
    failure. GO has no term for extracellular osteoclast resorption-lacuna
    acidification (GO:0007035 vacuolar acidification describes intracellular
    organellar acidification), so this node binds GO:0045453 (bone resorption)
    alone.
  biological_scale: CELLULAR

pathophysiology:
- name: Heterozygous CLCN7 Missense Variant
  description: >-
    Constitutional heterozygous missense variants in CLCN7 alter subunits of the
    endolysosomal and ruffled-border 2Cl-/H+ antiporter without abolishing
    protein expression, creating the germline molecular substrate for dominant-negative
    dimer poisoning.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  molecular_functions:
  - preferred_term: chloride:proton antiporter activity
    term:
      id: GO:0062158
      label: chloride:proton antiporter activity
  - preferred_term: chloride channel activity
    term:
      id: GO:0005254
      label: chloride channel activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:12929941
    reference_title: "Chloride channel 7 (ClCN7) gene mutations and autosomal dominant osteopetrosis, type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 11 of 12 kindreds, five different missense mutations were identified in the ClCN7 gene, indicating the genetic basis and possible dominant negative mechanism for ADO2."
    explanation: "Identifies germline heterozygous CLCN7 missense variants as the initiating genetic lesion in ADO2."
  downstream:
  - target: CLCN7 Dominant Negative Chloride Channel Dysfunction
    causal_link_type: DIRECT
    description: >-
      Mutant CLCN7 subunits co-assemble into homodimeric channels and exert a
      dominant-negative effect on chloride-proton exchange in osteoclasts.
    evidence:
    - reference: PMID:12929941
      reference_title: "Chloride channel 7 (ClCN7) gene mutations and autosomal dominant osteopetrosis, type II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Based on the preponderance of missense mutations and the knowledge that chloride channels probably function as dimers, it seems that heterozygous ClCN7 gene mutations may cause ADO2 through a dominant negative mechanism"
      explanation: "Links heterozygous CLCN7 missense variants directly to dominant-negative dimeric channel dysfunction."
- name: CLCN7 Dominant Negative Chloride Channel Dysfunction
  description: >
    CLCN7 encodes ClC-7, a chloride/proton antiporter that functions as a
    homodimer at the osteoclast ruffled border. It was described as a chloride
    channel when the gene was identified, and the 2001 and 2003 sources quoted
    below use that wording. Heterozygous missense mutations exert a dominant
    negative effect by incorporating mutant subunits into the dimer, impairing
    chloride transport. Loss-of-function (null) mutations in heterozygous state
    do not cause disease, confirming that the pathogenic mechanism is
    dominant negative rather than haploinsufficiency.
  biological_scale: CELLULAR
  genes:
  - preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  cell_types:
  - preferred_term: Osteoclast

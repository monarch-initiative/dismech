biochemical:
- name: Serum tartrate-resistant acid phosphatase 5b (TRAP5b)
  presence: ELEVATED
  context: >-
    Marker of osteoclast number that correlates positively with bone mineral
    density and lifetime fracture number in adults with ADO2, reflecting a
    compensatory increase in osteoclast number among more severely affected
    individuals.
  readouts:
  - target: Impaired Resorption Lacuna Acidification
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: >-
      Compensatory increase in osteoclast number in response to impaired
      osteoclastic bone resorption.
  evidence:
  - reference: DOI:10.1093/jbmr/zjaf123
    reference_title: Fractures are highly correlated with bone density and inversely correlated with bone turnover markers in autosomal dominant osteopetrosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tartrate resistant acid phosphatase, a marker of osteoclast number, correlated positively with fracture (r = 0.52, p = .004) consistent with an adaptive response of higher numbers of osteoclasts among more severely affected individuals."
    explanation: >-
      Demonstrates that serum tartrate-resistant acid phosphatase (osteoclast-number
      marker) correlates positively with fracture burden in ADO2 as a compensatory
      response to impaired resorption.
- name: Serum C-telopeptide (CTX) and urine N-telopeptide/creatinine ratio
  presence: DECREASED
  context: >-
    Bone resorption markers inversely correlated with bone mineral density and
    lifetime fracture burden in adults with ADO2, indicating reduced collagen
    degradation in subjects with the most severe osteoclast resorption failure.
  readouts:
  - target: Impaired Resorption Lacuna Acidification
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: >-
      Reduced type I collagen degradation readout of impaired osteoclastic bone
      resorption.
  evidence:
  - reference: DOI:10.1093/jbmr/zjaf123
    reference_title: Fractures are highly correlated with bone density and inversely correlated with bone turnover markers in autosomal dominant osteopetrosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, fracture number correlated inversely with the bone resorption markers serum C-telopeptide (r = −0.60, p < .001) and urine N-telopeptide/creatinine ratio (r = −0.35, p = .047), suggesting that ADO subjects who have the most reduced osteoclast activity have a greater tendency to fracture."
    explanation: >-
      Establishes that serum CTX and urinary NTX/creatinine ratio are inversely
      correlated with fracture number and reflect reduced osteoclastic bone
      resorption in ADO2.

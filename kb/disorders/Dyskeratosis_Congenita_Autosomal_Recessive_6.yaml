name: Dyskeratosis Congenita Autosomal Recessive 6
creation_date: "2026-09-16T20:30:00Z"
description: >-
  Dyskeratosis congenita autosomal recessive 6 (DKCB6) is the telomere biology
  disorder caused by biallelic variants in PARN, which encodes poly(A)-specific
  ribonuclease. PARN is not a telomerase component and has no direct role at the
  telomere. It reaches telomere biology one step upstream, through RNA 3'-end
  maturation: the telomerase RNA component TERC is transcribed with a precise 3'
  end and then acquires post-transcriptional oligo(A) tails that mark nuclear
  RNAs for exosomal degradation. PARN removes those tails. Without it, TERC is
  degraded rather than matured, telomerase runs short of its own template, and
  telomeres shorten. The presentation sits at the severe end of the dyskeratosis
  congenita spectrum: most reported patients meet criteria for
  Hoyeraal-Hreidarsson syndrome, with intrauterine growth retardation,
  microcephaly, cerebellar hypoplasia, immunodeficiency, developmental delay and
  early bone marrow failure, alongside the classic mucocutaneous triad of nail
  dysplasia, reticulate skin pigmentation and oral leukoplakia. PARN deficiency
  is also pleiotropic beyond TERC — shelterin transcripts are down-regulated and
  ribosomal RNA biogenesis is impaired — which is one proposed explanation for
  why DKCB6 is more severe than TERC loss alone would predict.
synonyms:
- DKCB6
- dyskeratosis congenita, autosomal recessive 6
- PARN dyskeratosis congenita
- dyskeratosis congenita caused by mutation in PARN
- PARN-related Hoyeraal-Hreidarsson syndrome

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DKCB6 requires two defective PARN alleles. Reported genotypes include
    compound heterozygosity for a missense variant with a whole-gene deletion,
    and a missense variant with a non-coding defect reducing expression of the
    other allele. The same gene also causes autosomal dominant pulmonary fibrosis
    in the heterozygous state, so zygosity is what separates the two diseases.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data show compound heterozygous loss-of-function mutations in PARN in
      two families with dyskeratosis congenita and very short telomeres.
    explanation: >-
      Establishes biallelic loss of function as the genotype in the founding
      dyskeratosis congenita families.
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Autosomal dominant or autosomal recessive: ACD, PARN, RTEL1, and TERT.
    explanation: >-
      GeneReviews places PARN among the genes that act in both modes, which is
      why the recessive entity needs its own identity separate from the dominant
      pulmonary fibrosis phenotype.
prevalence:
- population: Boston Children's Hospital bone marrow failure registry, genetically uncharacterized dyskeratosis congenita
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Biallelic PARN defects accounted for roughly 15% of the unrelated families in
    the genetically uncharacterized dyskeratosis congenita category of one
    registry. That denominator is the previously unsolved cases at a single
    referral centre, not dyskeratosis congenita overall, so the figure is a yield
    of a candidate-gene screen rather than a share of the disease. No population
    prevalence has been published.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified biallelic defects in PARN in two families (Fig. 1a),
      representing ~15% of the unrelated families in this disease category
    explanation: The registry yield, quoted with its own denominator attached.
- population: Hoyeraal-Hreidarsson syndrome patients reported to 2019
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Nine patients with biallelic PARN mutations had been reported across four
    independent laboratories as of the 2019 review, establishing PARN as the
    sixth identified molecular cause of Hoyeraal-Hreidarsson syndrome.
  evidence:
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Recently, biallelic mutations in the PARN (poly(A)‐specific
      ribonuclease)‐encoding gene were reported by four independent laboratories
      in a total of nine patients as the sixth identified molecular cause of HH
    explanation: >-
      Published case count. The sentence is this paper's introduction summarising
      the prior literature, not a result of its own experiments.
progression:
- phase: Intrauterine and infantile onset
  notes: >-
    Unlike the milder telomere biology disorders, DKCB6 is usually apparent from
    birth or infancy, with intrauterine growth retardation, microcephaly and
    cerebellar hypoplasia. Mucocutaneous features and marrow failure follow in
    early childhood.
  evidence:
  - reference: PMID:39649862
    reference_title: "Hoyeraal-Hreidarsson syndrome: a case report of dyskeratosis congenita with a novel PARN gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient exhibited intrauterine growth retardation (IUGR), congenital
      cytomegalovirus (CMV) infection, immunodeficiency, microcephaly, and
      cerebellar hypoplasia.
    explanation: The infantile presentation in a genetically confirmed PARN patient.
- phase: Progressive marrow failure and transformation
  notes: >-
    Cytopenias progress over childhood. One patient followed for 14 years
    progressed from bone marrow failure to myelodysplastic syndrome and required
    haematopoietic cell transplantation at 14 years, with the mucocutaneous
    features worsening to anonychia over the same period.
  evidence:
  - reference: PMID:26810774
    reference_title: "Hoyeraal-Hreidarsson Syndrome due to PARN Mutations: Fourteen Years of Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was diagnosed with Hoyeraal-Hreidarsson syndrome at age 6 years and had
      a complicated medical history including severe developmental delay,
      cerebellar hypoplasia, esophageal and urethral stenosis, hip avascular
      necrosis, immunodeficiency, and bone marrow failure evolving to
      myelodysplastic syndrome requiring hematopoietic cell transplantation at
      age 14 years.
    explanation: >-
      The only long-term natural-history description of a PARN patient in the
      literature.
pathophysiology:
- name: PARN Deadenylase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants deplete PARN, a DEDDh-family
    poly(A)-specific ribonuclease. Patient fibroblasts show reduced PARN mRNA and
    a still more severe reduction in PARN protein, so the lesion is loss of
    enzyme rather than altered specificity.
  molecular_functions:
  - preferred_term: poly(A)-specific ribonuclease activity
    modifier: DECREASED
    term:
      id: GO:0004535
      label: poly(A)-specific ribonuclease activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: TERC 3'-End Maturation Failure
    causal_link_type: DIRECT
    description: >-
      PARN is the deadenylase that trims the oligo(A) tails from nascent TERC, so
      its loss leaves those tails in place.
    evidence:
    - reference: PMID:26482878
      reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Deep sequencing of TERC RNA 3' termini shows that PARN is required for
        removal of post-transcriptionally acquired oligo(A) tails that target
        nuclear RNAs for degradation.
      explanation: >-
        Direct molecular demonstration of the reaction whose loss defines this
        edge, measured at nucleotide resolution.
  - target: Shelterin and Ribosome Biogenesis Transcript Dysregulation
    causal_link_type: DIRECT
    description: >-
      PARN has substrates beyond TERC, so its loss has consequences that the
      telomerase-template account does not cover.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In keeping with these findings, PARN mRNA levels were diminished in
      fibroblasts from both patients (Fig. 1e), and PARN protein levels were even
      more severely compromised (Fig. 1f).
    explanation: >-
      Quantifies the deficiency at both transcript and protein level in patient
      cells.
- name: TERC 3'-End Maturation Failure
  biological_scale: MOLECULAR
  description: >-
    TERC is transcribed by RNA polymerase II with a precise 3' end and no long
    poly(A) tail, and shares a box H/ACA architecture with the small nucleolar
    RNAs that PARN is known to process. Post-transcriptional oligoadenylation
    flags it for exosomal degradation; PARN counteracts that. Without PARN,
    oligo(A)-tailed TERC accumulates and the mature species is depleted. The
    causal direction is fixed by a rescue: restoring PARN normalises both the
    TERC level and the oligo(A) fraction.
  biological_processes:
  - preferred_term: telomerase RNA stabilization
    modifier: DECREASED
    term:
      id: GO:0090669
      label: telomerase RNA stabilization
  downstream:
  - target: Telomerase Insufficiency and Telomere Shortening
    causal_link_type: DIRECT
    description: >-
      TERC is the telomerase template and is rate-limiting, so depleting it
      reduces telomerase activity and telomere elongation capacity.
    evidence:
    - reference: PMID:26482878
      reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that PARN-mutant iPSCs manifested decreased telomerase activity
        and impaired telomere elongation capacity in comparison to normal cells
      explanation: >-
        Measures the functional consequence in telomerase-expressing patient
        cells, which fibroblasts cannot show.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Diminished TERC levels and the increased proportion of oligo(A) forms of
      TERC are normalized by restoring PARN, which is limiting for TERC
      maturation in cells.
    explanation: >-
      The rescue experiment. It is what makes this a causal claim rather than a
      correlation between PARN loss and low TERC.
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These studies demonstrate that PARN deficiency results in diminished TERC
      levels independently of DKC1 (dyskerin), as well as in deficits in
      telomerase activity and telomere maintenance.
    explanation: >-
      Excludes the alternative route to low TERC — dyskerin loss — which is the
      mechanism in X-linked dyskeratosis congenita.
- name: Shelterin and Ribosome Biogenesis Transcript Dysregulation
  biological_scale: MOLECULAR
  description: >-
    PARN deficiency down-regulates the shelterin transcripts TRF1, TRF2, TPP1,
    RAP1 and POT1, and compromises ribosomal RNA biogenesis. The DKC1
    down-regulation in these cells is secondary to p53 activation rather than a
    direct PARN effect. This branch is the argument that DKCB6 severity is not
    fully explained by TERC depletion: telomere stability as well as telomere
    length is affected, and a second housekeeping pathway is hit at the same
    time.
  biological_processes:
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  downstream:
  - target: Telomerase Insufficiency and Telomere Shortening
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced shelterin transcript levels compromise telomere protection
      alongside the length defect.
  evidence:
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that PARN deficiency affects both telomere length and stability
      and down-regulates the expression of TRF1, TRF2, TPP1, RAP1, and POT1
      shelterin transcripts
    explanation: >-
      The shelterin arm, measured in cells from two Hoyeraal-Hreidarsson patients
      and in a PARN knockout line.
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further showed that PARN deficiency compromises ribosomal RNA biogenesis
      in patients' fibroblasts and cells from heterozygous Parn KO mice.
    explanation: The ribosome biogenesis arm, in patient cells and mouse cells.
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Down-regulation of dyskerin-encoding DKC1 mRNA was also observed and found
      to result from p53 activation in PARN-deficient cells.
    explanation: >-
      Places the DKC1 change downstream of p53 rather than of PARN directly,
      which matters because the earlier study had excluded dyskerin loss as the
      route to low TERC.
- name: Telomerase Insufficiency and Telomere Shortening
  biological_scale: CELLULAR
  description: >-
    Reduced telomerase activity and elongation capacity produce very short
    telomeres in peripheral blood, below the first percentile for age, which is
    the diagnostic hallmark shared across the telomere biology disorders. Short,
    unprotected telomeres trigger replicative senescence and apoptosis in the
    tissues with the highest turnover.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: telomere maintenance
    modifier: DECREASED
    term:
      id: GO:0000723
      label: telomere maintenance
  downstream:
  - target: Hematopoietic Stem Cell Exhaustion
    causal_link_type: DIRECT
  - target: Short telomere length
    causal_link_type: DIRECT
  - target: Developmental Failure of Cerebellum and Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The Hoyeraal-Hreidarsson features are consequences of the PARN lesion, so the
      edge is drawn, but the route from short telomeres to cerebellar hypoplasia has
      not been established and the impaired ribosome biogenesis branch is an
      untested alternative candidate. Hence unknown intermediates. Omitting the edge
      would leave the node at the leftmost layer of the render, presenting the
      cerebellar phenotype as a separate primary lesion, which claims more than an
      unresolved route does.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The probands manifested classic features of dyskeratosis congenita and
      associated phenotypes, including bone marrow failure and very short
      telomere lengths in peripheral blood cells
    explanation: >-
      Links the molecular defect to the measured telomere length in the patients
      themselves.
- name: Hematopoietic Stem Cell Exhaustion
  biological_scale: TISSUE
  description: >-
    The haematopoietic compartment fails first because it has the highest
    replicative demand and depends on telomerase to sustain it. Marrow failure
    progresses through cytopenias to aplasia and carries a risk of clonal
    evolution to myelodysplastic syndrome and acute myeloid leukaemia.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: replicative senescence
    modifier: INCREASED
    term:
      id: GO:0090399
      label: replicative senescence
  downstream:
  - target: Bone marrow failure
    causal_link_type: DIRECT
  - target: Myelodysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Immunodeficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      People with DC/TBD are at increased risk for progressive bone marrow
      failure (BMF), myelodysplastic syndrome or acute myelogenous leukemia,
      solid tumors (usually squamous cell carcinoma of the head/neck or anogenital
      cancer), and pulmonary fibrosis.
    explanation: >-
      The GeneReviews statement of the haematological and malignancy risk across
      the telomere biology disorders, of which DKCB6 is one.
- name: Developmental Failure of Cerebellum and Growth
  biological_scale: ORGANISM
  description: >-
    Cerebellar hypoplasia, microcephaly and intrauterine growth retardation
    define the Hoyeraal-Hreidarsson end of the spectrum and are what make DKCB6
    more than a marrow failure syndrome. The step from short telomeres to
    cerebellar hypoplasia is not established; the impaired ribosome biogenesis
    branch is a candidate that has not been tested against it.
  downstream:
  - target: Cerebellar hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intrauterine growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      HH syndrome is characterized by early‐onset bone marrow failure,
      intrauterine growth retardation, microcephaly and/or cerebellar hypoplasia,
      and other developmental defects
    explanation: >-
      Defines the developmental component of the phenotype this node covers. The
      sentence is background framing in a cell-biology paper, so it describes the
      established human syndrome rather than that paper's own result.

- category: Hematologic
  name: Bone marrow failure
  description: >-
    Progressive marrow failure is the dominant cause of morbidity, beginning in
    early childhood and progressing to transfusion dependence and, in one
    long-followed patient, to myelodysplastic syndrome.
  phenotype_term:

genetic:
- name: PARN
  gene_term:
    preferred_term: PARN
    term:
      id: hgnc:8609
      label: PARN
  relationship_type: CAUSATIVE
  notes: >-
    PARN (16p13.12) encodes poly(A)-specific ribonuclease. The gene is dose
    sensitive in both directions of the telomere phenotype: heterozygous
    loss-of-function segregates with adult autosomal dominant pulmonary fibrosis,
    while biallelic loss produces the severe childhood disease curated here.
    Monoallelic PARN deletions have separately been reported in individuals with
    developmental delay or mental illness, which complicates counselling of
    carrier parents and is not settled.
  variants:
  - name: c.19A>C (p.Asn7His) in trans with a whole-gene deletion
    description: >-
      Genotype of the first proband: a missense change at a highly conserved
      residue inherited from the mother, with a deletion encompassing the entire
      PARN gene from the father.
  - name: c.260C>T (p.Ser87Leu) in trans with a non-coding expression defect
    description: >-
      Genotype of the second proband: a maternally inherited missense variant
      with reduced transcript from the paternal allele, indicating a non-coding
      lesion not visible to exome sequencing.
  - name: c.1200del (p.Leu401fs)
    description: >-
      A frameshift reported in a 2-year-old with Hoyeraal-Hreidarsson syndrome,
      classified as pathogenic by ACMG criteria.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 was found to carry an undescribed missense variant, c.19A>C, on
      the allele inherited from his mother, resulting in the substitution of a
      highly conserved amino acid, p.Asn7His, and a large deletion encompassing
      the entire PARN gene on the allele inherited from his father
    explanation: The first proband's genotype, with parental phase established.
  - reference: PMID:39649862
    reference_title: "Hoyeraal-Hreidarsson syndrome: a case report of dyskeratosis congenita with a novel PARN gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing identified a novel c.1200del (p.Leu401fs) mutation
      in the PARN gene, associated with dyskeratosis congenita and classified as
      highly pathogenic according to ACMG criteria.
    explanation: An additional pathogenic allele with an ACMG classification.
  - reference: PMID:26810774
    reference_title: "Hoyeraal-Hreidarsson Syndrome due to PARN Mutations: Fourteen Years of Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PARN, which encodes poly(A)-specific ribonuclease, a
      deadenylase, have been linked with autosomal dominant familial pulmonary
      fibrosis13 and autosomal recessive Hoyeraal-Hreidarsson syndrome
    explanation: >-
      States the two-disease, zygosity-split architecture of this gene, which is
      the reason this entry is separate from the pulmonary fibrosis literature.
biochemical:
- name: Telomerase RNA component (TERC) level
  notes: >-
    Reduced steady-state TERC with an increased oligo(A)-tailed fraction is the
    molecular signature of PARN deficiency, measurable in patient fibroblasts and
    iPSCs. It is a research measurement rather than a clinical assay; the
    clinical test is leukocyte telomere length by flow-FISH.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient-derived cells as well as immortalized cells in which PARN is
      disrupted show decreased levels of TERC.
    explanation: The measurement in patient cells and in an engineered line.
- name: Leukocyte telomere length by flow-FISH
  notes: >-
    Multicolour flow-FISH on lymphocyte subsets is the diagnostic assay for the
    telomere biology disorders, with results below the first percentile for age
    supporting the diagnosis.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A majority of individuals with DC/TBD have abnormally short telomeres for
      their age, as determined by multicolor flow cytometry fluorescence in situ
      hybridization (flow-FISH) on lymphocyte subsets.
    explanation: The GeneReviews diagnostic testing statement.
treatments:
- name: Hematopoietic cell transplantation
  description: >-
    The only curative option for marrow failure and leukaemia. GeneReviews is
    explicit that historical long-term outcome has been poor because of treatment
    toxicity, which in telomere biology disorders reflects the same telomere
    defect in every tissue exposed to conditioning. One PARN patient underwent
    transplantation at 14 years for myelodysplastic syndrome.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hematopoietic Stem Cell Exhaustion
    description: >-
      Replaces the exhausted stem cell compartment with donor cells that have
      normal telomere maintenance. It does not address the developmental,
      pulmonary or malignancy risk arising in other tissues.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hematopoietic cell transplantation (HCT) is the only curative treatment for
      BMF and leukemia, but long-term outcome has historically been poor due to
      treatment toxicity; if a suitable donor is not available, androgen therapy
      may be considered for BMF.
    explanation: >-
      The GeneReviews management statement, including the toxicity caveat and the
      androgen alternative.
- name: Androgen therapy
  description: >-
    Considered for marrow failure when no suitable transplant donor is available.
    GeneReviews requires routine monitoring of blood count, liver function, liver
    ultrasound and endocrine status on treatment, and warns specifically against
    combining androgens with granulocyte colony-stimulating factor because of
    splenic rupture.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Androgen Therapy
    term:
      id: NCIT:C15482
      label: Androgen Therapy
  target_mechanisms:
  - target: Hematopoietic Stem Cell Exhaustion
    description: >-
      Improves counts in marrow failure; androgens up-regulate telomerase in
      haematopoietic cells, though that mechanism is not demonstrated for PARN
      disease specifically.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the combination of androgens and granulocyte colony-stimulating factor in
      treatment of BMF (has been associated with splenic rupture)
    explanation: >-
      The drug-safety warning from the GeneReviews Agents/Circumstances to Avoid
      section.
- name: Surveillance for malignancy and pulmonary fibrosis
  description: >-
    GeneReviews specifies monthly self-examination for oral, head and neck
    cancer, annual otolaryngology, dermatology and gynaecological screening,
    annual pulmonary function testing from diagnosis or from about age eight, and
    six-monthly dental review. Smoking and excessive sun exposure are to be
    avoided.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For cancer risk: monthly self-examination for oral, head, and neck cancer;
      annual cancer screening by an otolaryngologist and dermatologist; annual
      gynecologic examination.
    explanation: The GeneReviews surveillance schedule.
experimental_models:
- name: PARN-mutant patient-derived induced pluripotent stem cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSCs reprogrammed from the fibroblasts of the two founding probands. They
    exist because the question could not be answered in fibroblasts: telomerase
    activity and telomere elongation are only measurable in a
    telomerase-expressing cell, and patient fibroblast numbers were limiting.
  publication: PMID:26482878
  modeled_mechanisms:
  - target: TERC 3'-End Maturation Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient-genotype cells reproduce the TERC deficit without any engineered
      lesion, and show the downstream telomerase and elongation defects.
    limitations: >-
      Reprogramming resets telomere length, so these cells report on telomerase
      capacity rather than on the accumulated telomere attrition the patient
      has. Two probands only.
    readouts:
    - name: Telomerase activity
      target: TERC 3'-End Maturation Failure
      direction: DECREASED
      interpretation: >-
        The functional consequence of TERC depletion, measured directly rather
        than inferred.
      evidence:
      - reference: PMID:26482878
        reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found that PARN-mutant iPSCs manifested decreased telomerase activity
          and impaired telomere elongation capacity in comparison to normal cells
        explanation: The telomerase activity and elongation measurements.
  evidence:
  - reference: PMID:26482878
    reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase RNA component.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These iPSCs also showed a deficiency in PARN transcripts and reduced TERC
      levels in comparison to normal iPSCs, without diminished dyskerin protein
      levels
    explanation: >-
      Confirms the model carries the molecular defect and, again, that dyskerin
      is not the route.
- name: PARN knockout human cell line with inducible complementation
  experimental_model_type: CELL_LINE
  description: >-
    A human PARN knockout line in which PARN can be re-expressed on demand,
    allowing loss and restoration of the enzyme to be compared in an otherwise
    identical background.
  publication: PMID:31273937
  modeled_mechanisms:
  - target: Shelterin and Ribosome Biogenesis Transcript Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Establishes that the shelterin and rRNA changes follow PARN loss rather
      than being incidental to patient genetic background, because the same
      background with PARN restored does not show them.
    limitations: >-
      A complete knockout is a more severe lesion than the hypomorphic
      combinations patients carry, and an immortalised line has its own telomere
      biology. It cannot say which of these changes matters clinically.
  evidence:
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using cells from two unrelated HH individuals carrying novel PARN mutations
      and a human PARN knock-out (KO) cell line with inducible PARN
      complementation
    explanation: Describes the model and the complementation design.
animal_models:
- name: Parn knockout mouse
  species: Mouse
  genotype: Parn knockout, heterozygous and homozygous
  publication: PMID:31273937
  modeled_mechanisms:
  - target: Shelterin and Ribosome Biogenesis Transcript Dysregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Heterozygous knockout cells reproduce the ribosomal RNA biogenesis defect.
      The homozygote cannot be studied at all: it is embryonic lethal, and
      remains so on a p53-null background, so the lethality is not simply a p53
      response to the cellular stress.
    limitations: >-
      Homozygous embryonic lethality means the mouse cannot model the human
      biallelic disease, which is the entire subject of this entry. Laboratory
      mice also have very long telomeres and abundant telomerase, so murine
      telomere phenotypes routinely fail to mirror human ones. Only the
      heterozygote is informative, and human heterozygotes have a different
      disease.
  evidence:
  - reference: PMID:31273937
    reference_title: Impaired telomere integrity and rRNA biogenesis in PARN-deficient patients and knock-out models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Parn KO however resulted in early embryonic lethality that was
      not overcome by p53 KO.
    explanation: >-
      The lethality result, including the p53 epistasis test that rules out the
      obvious explanation.
discussions:
- discussion_id: mismatch_dkcb6_mouse_lethality
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is complete Parn loss embryonic lethal in mouse when human patients
    survive biallelic PARN loss of function into childhood and beyond?
  attaches_to:
  - "pathophysiology#PARN Deadenylase Deficiency"
  rationale: >-
    Homozygous Parn knockout mice die early in embryogenesis, and that lethality
    is not rescued by removing p53, so it is not a p53-mediated stress response
    to the deficiency. Human DKCB6 patients, by contrast, reach childhood and in
    one case adulthood. Two explanations are compatible with what is known and
    nothing separates them: the human alleles may all be hypomorphic rather than
    null — even the reported whole-gene deletion is in trans with a missense
    allele, so no human true null genotype has been observed — or mouse
    development may depend on Parn more heavily than human development does,
    which would be consistent with the several other PARN targets that already
    differ between the species. The consequence is practical: there is currently
    no animal model of the human biallelic disease, which is why every
    mechanistic result in this entry comes from patient cells or engineered human
    lines.
  proposed_experiments:
  - experiment_id: exp_dkcb6_hypomorphic_mouse
    name: Hypomorphic knock-in mouse carrying a patient PARN allele
    description: >-
      Knock a patient missense allele such as p.Asn7His into the mouse Parn locus
      rather than deleting the gene, and test whether homozygotes are viable and
      develop a telomere, marrow or cerebellar phenotype.
    would_support:
    - "pathophysiology#PARN Deadenylase Deficiency"
- discussion_id: gap_dkcb6_terc_sufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is TERC depletion sufficient to explain DKCB6 severity, or do the shelterin
    and ribosome biogenesis defects contribute independently?
  attaches_to:
  - "pathophysiology#TERC 3'-End Maturation Failure"
  - "pathophysiology#Shelterin and Ribosome Biogenesis Transcript Dysregulation"
  rationale: >-
    The argument for a second contribution is that DKCB6 is more severe than
    would be expected from TERC down-regulation alone, and that PARN deficiency
    demonstrably also lowers shelterin transcripts and impairs rRNA biogenesis.
    The argument against treating this as settled is that severity is a soft
    comparison across small case series with different ascertainment, and that no
    experiment has separated the arms — for example by restoring TERC alone in a
    PARN-deficient cell and asking what is left. The distinction has a therapeutic
    consequence. PAPD5/7 inhibition, which restores telomerase function in
    dyskeratosis congenita cells by blocking the oligoadenylation PARN
    counteracts, addresses the TERC arm and would not be expected to touch a
    ribosome biogenesis defect.
  proposed_experiments:
  - experiment_id: exp_dkcb6_terc_addback
    name: TERC add-back in PARN-deficient cells
    description: >-
      Restore mature TERC to physiological levels in PARN-deficient patient cells
      without restoring PARN, and measure telomerase activity, telomere
      elongation, shelterin transcript levels and rRNA processing to establish
      which phenotypes are TERC-dependent.
    would_support:
    - "pathophysiology#TERC 3'-End Maturation Failure"
  - experiment_id: exp_dkcb6_papd5_inhibition
    name: PAPD5/7 inhibition in PARN-deficient patient cells
    description: >-
      Apply a PAPD5/7 inhibitor to PARN-mutant iPSCs and haematopoietic
      derivatives and measure TERC level, telomerase activity and haematopoietic
      output, testing whether blocking oligoadenylation substitutes for the
      missing deadenylase in this specific genotype.
- discussion_id: gap_dkcb6_carrier_neuropsychiatric
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do heterozygous PARN carriers have an increased risk of developmental delay
    or mental illness, and what should parents of a DKCB6 child be told?
  attaches_to:
  - "genetic#PARN"
  rationale: >-
    Monoallelic PARN deletions have been reported in individuals ascertained for
    developmental delay or mental illness, separately from the pulmonary fibrosis
    literature. Parents of a child with DKCB6 are obligate heterozygotes, so if
    that association is real it changes what they are told at counselling — and
    it sits alongside a heterozygous pulmonary fibrosis risk that is already
    established. The reports are small and ascertainment-biased, and no
    population-scale test has been published.
  proposed_experiments:
  - experiment_id: exp_dkcb6_carrier_biobank
    name: Biobank-scale phenotyping of PARN loss-of-function heterozygotes
    description: >-
      Identify heterozygous PARN loss-of-function carriers in population biobanks
      and test for enrichment of neurodevelopmental and psychiatric diagnoses and
      of pulmonary fibrosis, against matched non-carriers.
notes: >-
  Scope and lump/split. This entry covers biallelic PARN telomere biology
  disease. It is a separate file rather than a subtype of Dyskeratosis_Congenita
  for the same reason Dyskeratosis_Congenita_Autosomal_Recessive_8 is: the
  upstream mechanism is distinct. Every other dyskeratosis congenita gene acts on
  the telomerase holoenzyme, on shelterin, or on the CST complex. PARN acts on
  RNA 3'-end maturation and reaches the telomere only through TERC, which is why
  it also hits ribosome biogenesis and why the disease is not purely a telomere
  phenotype.

  The zygosity split is deliberate. Heterozygous PARN loss of function causes
  adult autosomal dominant pulmonary fibrosis and is curated in this repository
  under Idiopathic_Pulmonary_Fibrosis. Biallelic loss causes the childhood
  disease here. They share a gene and almost nothing else clinically, and the
  GeneReviews chapter lists PARN explicitly among the genes that act in both
  modes.

  What is deliberately absent. No datasets: block — a search on PARN retrieves
  the large mRNA-turnover and cancer literature far more readily than the nine
  or so telomere patients, and no DKCB6-specific dataset was identified. No
  clinical_trials: block — PAPD5/7 inhibitors are discussed in the cited
  literature as a strategy for dyskeratosis congenita broadly, and no
  interventional trial keyed to biallelic PARN disease was found; listing a
  general dyskeratosis congenita trial would misattribute it. No environmental:
  block. Frequency values are given only where more than one patient supports
  them.

  Evidence provenance. Four of the quoted items carry quote_role: BACKGROUND or
  REVIEW_SYNTHESIS. That is not incidental here — this disease has roughly nine
  reported patients, so most statements about its clinical picture appear in the
  introductions of molecular papers or in a GeneReviews chapter about the
  disorder family, rather than in a cohort study of DKCB6 itself. Recording where
  in the citing document each quote sits is the honest way to keep those claims
  while saying what they rest on.

  GeneReviews. PMID:20301779, Dyskeratosis Congenita and Related Telomere Biology
  Disorders, is the baseline chapter and is tagged in references:. It covers the
  disorder family rather than DKCB6 specifically; there is no PARN-specific
  chapter. Its Clinical Characteristics list was cross-checked against the
  phenotypes here. Features it names that are not curated as phenotypes of this
  entry — taurodontism, gastrointestinal telangiectasia, the eye findings, liver
  disease, pulmonary fibrosis, squamous cell carcinoma — have not been reported
  in a PARN patient, and asserting them here would attribute family-level
  findings to a genotype that has not shown them. The surveillance they drive is
  curated under treatments, where it belongs, because surveillance is
  recommended on genotype rather than on manifestation.

genetic:
- name: EIF2S3
  gene_term:
    preferred_term: EIF2S3
    term:
      id: hgnc:3267
      label: EIF2S3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    EIF2S3 at Xp22 encodes eIF2gamma, the core subunit of the heterotrimeric
    translation initiation factor eIF2. Genotype tracks severity more closely
    here than in most rare syndromes: the recurrent C-terminal frameshift
    p.Ile465Serfs*4 impairs eIF2gamma function more than the tested missense
    variants and is found in the most severely affected patients, while
    missense variants in the guanine nucleotide binding domain give a milder
    or incomplete phenotype, down to a family with hypopituitarism, glucose
    dysregulation, normal head circumference and only mild learning
    difficulty. Reported variants include p.Ser108Arg, p.Thr144Ile,
    p.Met145Val, p.Ile159Leu, p.Ile259Met, p.Pro432Ser and the Ile465Serfs
    frameshift. A de novo variant has been reported, so an affected male
    without a carrier mother does not exclude the diagnosis.
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    explanation: >-
      The genotype-severity relationship, in the authors' own proposing
      language.
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional assays in yeast demonstrate that the Ile465Serfs mutation impairs eIF2γ function to a greater extent than tested missense mutations, consistent with the more severe clinical phenotype of the Ile465Serfs male mutation carriers."
    explanation: >-
      The functional measurement behind the genotype-severity relationship,
      which is what makes it more than a clinical impression.
  - reference: PMID:33942450

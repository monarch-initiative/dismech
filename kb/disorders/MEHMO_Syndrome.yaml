name: MEHMO Syndrome
creation_date: "2026-10-15T07:30:00Z"
category: Mendelian
parents:
- X-linked Syndromic Intellectual Disability
disease_term:
  preferred_term: MEHMO syndrome
  term:
    id: MONDO:0010258
    label: MEHMO syndrome
synonyms:
- mental retardation, epileptic seizures, hypogenitalism and hypogonadism, microcephaly, obesity
- EIF2S3-related syndromic intellectual disability
- eIF2-related neuroendocrinopathy
description: >-
  X-linked multisystem disorder caused by hemizygous variants in EIF2S3, which
  encodes the gamma subunit of eukaryotic translation initiation factor 2
  (eIF2). The acronym records the features of the originally described
  families: mental disability, epileptic seizures, hypogenitalism and
  hypogonadism, microcephaly and obesity. eIF2 delivers initiator
  methionyl-tRNA to the 40S ribosome and selects the AUG start codon, and
  eIF2gamma is the core subunit that holds the heterotrimer together, so a
  partial loss of its function lowers the amount of active eIF2 ternary
  complex. Translation initiation becomes less accurate as well as less
  efficient: initiation at near-cognate, non-AUG codons increases. Because
  eIF2 is also the node the integrated stress response acts on, the same
  variants leave cells with an over-active stress response and more
  vulnerable to death under stress.

  Endocrine disease is as prominent as the neurological picture and was not in
  the original acronym. Neonatal hypoglycaemia, early-onset insulin-dependent
  diabetes and progressive anterior hypopituitarism recur across reported
  patients, and a milder EIF2S3 phenotype of X-linked hypopituitarism with
  glucose dysregulation and normal head circumference has been described in
  one family. A 2025 review proposes reclassifying the condition, with related
  conditions, as an eIF2-related neuroendocrinopathy.

  Genotype tracks severity in a way that is unusual for a rare syndrome. The
  recurrent C-terminal frameshift p.Ile465Serfs*4 impairs eIF2gamma function
  more than the tested missense variants and is found in the most severely
  affected patients, while missense variants in the guanine nucleotide binding
  domain generally give a milder, sometimes incomplete phenotype. The small
  molecule ISRIB, which activates the eIF2 guanine nucleotide exchange factor,
  rescued growth, translation and neuronal differentiation defects in
  patient-derived cells, which makes this one of the few disorders in this
  class with an experimentally supported therapeutic lead.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A rare X-linked syndrome known from a small number of families; the
    cited report's comparison table across the families reported to that
    point has ten columns. No prevalence estimate exists, which is why the
    measure recorded here is CASES_IN_LITERATURE rather than a rate.
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MEHMO is a rare X-linked syndrome characterized by profound intellectual disability, epilepsy, hypogonadism and hypogenitalism, microcephaly, and obesity."
    explanation: Establishes rarity and the defining feature set.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are males hemizygous for an EIF2S3 variant, with
    carrier mothers. Reported pedigrees include maternally inherited variants
    and affected brothers.
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel maternally inherited missense EIF2S3 variant (c.324T>A; p.Ser108Arg) in another male patient with less severe clinical symptoms."
    explanation: Maternal transmission to an affected male.
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a novel hemizygous EIF2S3 variant, p.Pro432Ser, in the three boys (heterozygous in their mothers)."
    explanation: Hemizygous in affected males, heterozygous in unaffected mothers.
pathophysiology:
- name: Hemizygous EIF2S3 Variants
  biological_scale: MOLECULAR
  description: >-
    Hemizygous missense variants and a recurrent C-terminal frameshift in
    EIF2S3. Missense variants cluster in the conserved guanine nucleotide
    binding domain of eIF2gamma; the frameshift p.Ile465Serfs*4 truncates the
    C-terminus. The two classes reach the same endpoint by different routes,
    which is why the entry separates them: the C-terminal lesion impairs
    CDC123-dependent assembly of the eIF2 complex, while domain missense
    variants impair Met-tRNA binding or subunit contact.
  genes:
  - preferred_term: EIF2S3
    term:
      id: hgnc:3267
      label: EIF2S3
  molecular_functions:
  - preferred_term: translation initiation factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003743
      label: translation initiation factor activity
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a C-terminal frameshift mutation (Ile465Serfs) in the EIF2S3 gene in three families with MEHMO syndrome"
    explanation: The recurrent frameshift and the families it was found in.
  - reference: PMID:32799315
    reference_title: Novel pathogenic EIF2S3 missense variants causing clinically variable MEHMO syndrome with impaired eIF2γ translational function, and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both variants are located in the highly conserved guanine nucleotide binding domain of the EIF2S3 encoded eIF2γ subunit of the heterotrimeric translation initiation factor 2 (eIF2) complex."
    explanation: Where the missense variants sit in the protein.
  downstream:
  - target: Reduced eIF2 Ternary Complex Formation
    causal_link_type: DIRECT
    description: >-
      Each variant class lowers the amount of functional
      eIF2-GTP-Met-tRNAi ternary complex, by impaired complex assembly or by
      impaired initiator tRNA binding.
    evidence:
    - reference: PMID:31836389
      reference_title: Suppression of MEHMO Syndrome Mutation in eIF2 by Small Molecule ISRIB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we show that a mutation at the C terminus of eIF2γ impairs CDC123 promotion of eIF2 complex formation and decreases the level of eIF2-GTP-Met-tRNAiMet ternary complexes."
      explanation: >-
        The frameshift route to reduced ternary complex, shown in
        patient-derived induced pluripotent stem cells.
    - reference: PMID:30517694
      reference_title: MEHMO syndrome mutation EIF2S3-I259M impairs initiator Met-tRNAiMet binding to eukaryotic translation initiation factor eIF2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Biochemical analyses revealed a defect in Met-tRNAiMet binding to the mutant yeast eIF2 complexes in vivo and in vitro."
      explanation: >-
        The missense route, measured for the I259M variant in a yeast model of
        the human mutation.
    - reference: PMID:23063529
      reference_title: eIF2γ mutation that disrupts eIF2 complex integrity links intellectual disability to impaired translation initiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biochemical studies of human cells overexpressing the eIF2γ mutant and of yeast eIF2γ with the analogous mutation revealed a defect in binding the eIF2β subunit to eIF2γ."
      explanation: >-
        A third route, loss of heterotrimer integrity, for the EIF2S3 variant
        that first linked this gene to intellectual disability. The full
        sentence is quoted because it names both systems the result rests on,
        human cells and yeast, which is what the grading depends on.
- name: Reduced eIF2 Ternary Complex Formation
  biological_scale: MOLECULAR
  description: >-
    Less eIF2-GTP-Met-tRNAi ternary complex is available to load the 40S
    ribosomal subunit. This is the shared hinge of the entry: both the
    translational and the stress-response consequences run downstream of it.
  biological_processes:
  - preferred_term: formation of translation initiation ternary complex
    modifier: DECREASED
    term:
      id: GO:0001677
      label: formation of translation initiation ternary complex
  evidence:
  - reference: PMID:31836389
    reference_title: Suppression of MEHMO Syndrome Mutation in eIF2 by Small Molecule ISRIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This reduction in eIF2 activity results in dysregulation of global and gene-specific protein synthesis and enhances cell death upon stress induction."
    explanation: >-
      Names both downstream consequences this node branches into, in
      patient-derived cells.
  downstream:
  - target: Impaired and Error-Prone Translation Initiation
    causal_link_type: DIRECT
    description: >-
      Less ternary complex lowers initiation efficiency and loosens start
      codon selection.
  - target: Over-Activated Integrated Stress Response
    causal_link_type: DIRECT
    description: >-
      Low eIF2 activity is read by the cell as the signal the integrated
      stress response exists to produce, so the response is constitutively
      shifted on.
- name: Impaired and Error-Prone Translation Initiation
  biological_scale: CELLULAR
  description: >-
    Reduced global protein synthesis together with relaxed stringency of start
    codon selection, so initiation occurs more often at near-cognate non-AUG
    codons. Both were measured in yeast models of patient variants and in
    human cells overexpressing the mutant subunit. The gene-specific component
    matters as much as the global one: ATF4 and GCN4, whose translation is
    controlled by eIF2 availability, are derepressed.
  biological_processes:
  - preferred_term: translational initiation
    modifier: DECREASED
    term:
      id: GO:0006413
      label: translational initiation
  evidence:
  - reference: PMID:32799315
    reference_title: Novel pathogenic EIF2S3 missense variants causing clinically variable MEHMO syndrome with impaired eIF2γ translational function, and literature review.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduced growth rates and lowered fidelity of translation with increased initiation at non-AUG codons observed for both mutants in these studies strongly support pathogenicity of the variants."
    explanation: Both the efficiency and the fidelity defect, for two patient variants.
  - reference: PMID:30517694
    reference_title: MEHMO syndrome mutation EIF2S3-I259M impairs initiator Met-tRNAiMet binding to eukaryotic translation initiation factor eIF2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The yeast eIF2γ-I318M mutation also increased initiation from near-cognate start codons."
    explanation: The start-codon fidelity defect in the yeast model.
  downstream:
  - target: Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed route to the neurological phenotype. Supported by the rescue of
      neuronal differentiation in patient cells and by microcephaly with
      increased neuronal death in eif2s3-null zebrafish, but not demonstrated
      in human brain tissue.
- name: Over-Activated Integrated Stress Response
  biological_scale: CELLULAR
  description: >-
    The integrated stress response acts by lowering eIF2 activity, so a
    genetic lesion that lowers it leaves the response partly engaged at
    baseline and over-engaged under stress. Patient fibroblasts carrying the
    frameshift show increased stress-response activity, and ATF4 translation
    is derepressed when the mutant subunit is expressed in human cells. The
    consequence is reduced tolerance of cellular stress rather than a
    discrete second disease.
  biological_processes:
  - preferred_term: integrated stress response signaling
    modifier: INCREASED
    term:
      id: GO:0140467
      label: integrated stress response signaling
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies in patient fibroblasts confirm increased ISR activation due to the Ile465Serfs mutation"
    explanation: Increased stress-response activity in patient cells.
  - reference: PMID:30517694
    reference_title: MEHMO syndrome mutation EIF2S3-I259M impairs initiator Met-tRNAiMet binding to eukaryotic translation initiation factor eIF2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "overexpression of human eIF2γ-I259M derepressed ATF4 messenger RNA translation in human cells."
    explanation: >-
      Derepression of the stress-response effector ATF4, the gene-specific
      readout of low eIF2 activity.
  - reference: PMID:34999262
    reference_title: mRNA analysis revealed a novel pathogenic EIF2S3 variant causing MEHMO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed expression analysis, which showed that the DDIT3 transcript level was significantly increased in the patient relative to the controls."
    explanation: >-
      A second stress-response effector, DDIT3 (CHOP), raised in a patient
      carrying a different EIF2S3 variant, which is independent evidence that
      the over-activation is a property of the disease rather than of one
      allele.
  downstream:
  - target: Pancreatic Beta Cell Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed explanation for why a secretory endocrine cell is affected:
      cells with a high secretory protein load depend most on intact
      translation initiation and stress handling. Supported by EIF2S3
      expression in the islets and by increased cell death on EIF2S3
      knockdown, not by human tissue pathology.
  - target: Anterior Pituitary Hormone Secretion Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same reasoning applied to the other high-load secretory tissue: the
      anterior pituitary expresses EIF2S3 during development and its hormone
      output declines progressively in reported patients. Weaker than the
      beta cell edge, which has a cell-death and a progenitor-deficiency
      result behind it; this arm has expression plus clinical course and no
      tissue pathology or animal model, so the intermediates are unknown.
    evidence:
    - reference: PMID:30878599
      reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "EIF2S3 expression was detectable in the developing pituitary gland and pancreatic islets of Langerhans."
      explanation: >-
        The expression result is the whole of the tissue-level basis for
        routing the pituitary arm through this node. INDIRECT because
        expression in a tissue is not a demonstration that the stress
        response acts on it, which is why the edge records unknown
        intermediates.
- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    Impaired brain growth and development, giving microcephaly, intellectual
    disability and epilepsy. The experimental support is a zebrafish knockout
    that reproduces microcephaly with increased neuronal cell death, plus
    rescue of neuronal differentiation in patient-derived cells by ISRIB.
  evidence:
  - reference: PMID:33942450
    reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR/Cas9 knockout of eif2s3 in zebrafish embryos recapitulate the human microcephaly and show increased neuronal cell death."
    explanation: Animal evidence linking loss of the gene to microcephaly.
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
    description: Impaired brain growth.
  - target: Intellectual disability
    causal_link_type: DIRECT
    description: The core neurodevelopmental outcome.
  - target: Global developmental delay
    causal_link_type: DIRECT
    description: >-
      Delay across domains, which is how the impairment presents before an
      intellectual disability can be assessed.
  - target: Motor delay
    causal_link_type: DIRECT
    description: >-
      The motor component specifically, reported severe in one missense
      patient and mild in another.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Epilepsy in most reported patients. Note that untreated hypoglycaemia is
      an alternative or additional contributor, which is recorded as a
      hypothesis rather than asserted here.
- name: Pancreatic Beta Cell Failure
  biological_scale: TISSUE
  description: >-
    Failure of the insulin-secreting beta cell, giving neonatal hypoglycaemia
    first and insulin-dependent diabetes later. EIF2S3 is expressed in the
    islets of Langerhans, and the cellular route is contested: knockdown in a
    human pancreatic cell line increased caspase activity and cell death,
    while in zebrafish the hyperglycaemia came from beta cell and pancreatic
    progenitor deficiency explicitly not related to apoptosis. See the
    HUMAN_MODEL_MISMATCH discussion; this node does not assert either route.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EIF2S3 expression was detectable in the developing pituitary gland and pancreatic islets of Langerhans. Cells lacking EIF2S3 had increased caspase activity/cell death."
    explanation: >-
      Expression in the islets, and increased cell death on knockdown in a
      human pancreatic cell line.
  - reference: PMID:33942450
    reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abnormal high glucose levels were identified in mutant embryos, caused by beta cell and pancreatic progenitor deficiency, not related to apoptosis."
    explanation: >-
      The competing cellular account for the same beta cell failure, which is
      why this node does not assert apoptosis as the mechanism.
  downstream:
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: Neonatal hypoglycaemia precedes the diabetes in reported patients.
  - target: Diabetes mellitus
    causal_link_type: DIRECT
    description: Early-onset insulin-dependent diabetes follows.
- name: Anterior Pituitary Hormone Secretion Failure
  biological_scale: TISSUE
  description: >-
    Progressive decline of anterior pituitary peptide hormone secretion,
    reported as growth hormone and TSH deficiency and as a gradual decline
    rather than a fixed deficit. The support here is weaker than for the beta
    cell node: it rests on EIF2S3 expression in the developing human pituitary
    plus the clinical course, with no pituitary tissue from a patient
    examined and no animal model of the pituitary arm.
  cell_types:
  - preferred_term: hormone-secreting cell of the anterior pituitary
    term:
      id: CL:0000637
      label: chromophil cell of anterior pituitary gland
  evidence:
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EIF2S3 expression was detectable in the developing pituitary gland and pancreatic islets of Langerhans."
    explanation: >-
      Expression in the developing pituitary, which is the whole of the
      tissue-level support for this node.
  - reference: PMID:29303605
    reference_title: Neonatal hypoglycemia, early-onset diabetes and hypopituitarism due to the mutation in EIF2S3 gene causing MEHMO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypopituitarism due to dysregulation and gradual decline of peptide hormone secretion."
    explanation: >-
      The clinical course, which is what makes this a progressive secretory
      failure rather than a developmental absence.
  downstream:
  - target: Hypopituitarism
    causal_link_type: DIRECT
    description: Progressive decline of anterior pituitary hormone secretion.
  - target: Central hypothyroidism
    causal_link_type: DIRECT
    description: TSH deficiency is one of the reported deficient axes.
  - target: Growth delay
    causal_link_type: DIRECT
    description: >-
      Growth hormone deficiency is the other reported axis, and postnatal
      growth retardation is positive in seven of the eight families in which
      it was assessed.
  - target: Hypogonadism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypogonadism and hypogenitalism, plausibly through gonadotropin
      deficiency in a hypopituitary patient. The reports describe the features
      without establishing that route, so the edge is not asserted as direct.
  - target: External genital hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypogenitalism, by the same unestablished gonadotropin route.
phenotypes:
- name: Growth delay
  category: Growth
  description: >-
    Postnatal growth retardation, present in seven of the eight reported
    families in which it was assessed, and one of the features in the title of
    the first series to link two EIF2S3 variants to this syndrome. Growth
    hormone deficiency is the documented mechanism in the families where the
    pituitary was assessed.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Growth retardation
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:27333055
    reference_title: Two novel EIF2S3 mutations associated with syndromic intellectual disability with severe microcephaly, growth retardation, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both families, affected males presented with severe intellectual disability, microcephaly, growth retardation, and epilepsy."
    explanation: Growth retardation in affected males from two unrelated families.
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postnatal growth retardation | + | + | + | \u2212 | + | + | + | n.a. | + | n.a."
    explanation: >-
      The paper's comparison table across the families reported to date, one
      column per family. Postnatal growth retardation is positive in seven,
      negative in one and not assessed in two, which is the basis for
      VERY_FREQUENT rather than the two-family abstract above.
- name: Central hypothyroidism
  category: Endocrine
  description: >-
    TSH deficiency of pituitary origin, one of the two anterior pituitary axes
    reported deficient. Distinguished from primary hypothyroidism because the
    lesion is in the pituitary rather than the thyroid.
  phenotype_term:
    preferred_term: Central hypothyroidism
    term:
      id: HP:0011787
      label: Central hypothyroidism
  evidence:
  - reference: PMID:33714664
    reference_title: "Ketogenic diet for refractory epilepsy with MEHMO syndrome: Caution for acute necrotizing pancreatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 5-year-old boy was referred to our hospital because of profound intellectual disability, micropenis, cryptorchidism, central hypothyroidism, and microcephaly."
    explanation: Central hypothyroidism in a molecularly confirmed patient.
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypopituitarism (GH and TSH deficiencies)"
    explanation: TSH deficiency as one of the two deficient axes in the milder family.
- name: Hypogonadism
  category: Endocrine
  description: >-
    Hypogonadism, the H of the acronym alongside hypogenitalism. Carried as
    its own phenotype rather than only inside the hypogenitalism description,
    because it is a distinct endocrine claim.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hypogonadism
    term:
      id: HP:0000135
      label: Hypogonadism
  evidence:
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MEHMO is a rare X-linked syndrome characterized by profound intellectual disability, epilepsy, hypogonadism and hypogenitalism, microcephaly, and obesity."
    explanation: Hypogonadism in the defining phenotype.
- name: Micropenis
  category: Genitourinary
  description: Micropenis, the specific hypogenitalism finding reported in patients.
  phenotype_term:
    preferred_term: Micropenis
    term:
      id: HP:0000054
      label: Micropenis
  evidence:
  - reference: PMID:33714664
    reference_title: "Ketogenic diet for refractory epilepsy with MEHMO syndrome: Caution for acute necrotizing pancreatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 5-year-old boy was referred to our hospital because of profound intellectual disability, micropenis, cryptorchidism, central hypothyroidism, and microcephaly."
    explanation: Micropenis in a molecularly confirmed patient.
- name: Cryptorchidism
  category: Genitourinary
  description: Undescended testes, reported with micropenis.
  phenotype_term:
    preferred_term: Cryptorchidism
    term:
      id: HP:0000028
      label: Cryptorchidism
  evidence:
  - reference: PMID:33714664
    reference_title: "Ketogenic diet for refractory epilepsy with MEHMO syndrome: Caution for acute necrotizing pancreatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 5-year-old boy was referred to our hospital because of profound intellectual disability, micropenis, cryptorchidism, central hypothyroidism, and microcephaly."
    explanation: Cryptorchidism in the same patient.
- name: Global developmental delay
  category: Neurological
  description: >-
    Developmental delay across domains, reported directly in the mild
    hypopituitarism family and positive in every family of the comparison
    table. Carried separately from Motor delay, which is bound to the
    motor-specific term because that is what its own source reports.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He has global developmental delay needing 1:1 support in mainstream school, behavioural problems and mild hepatomegaly with normal liver function."
    explanation: >-
      Global developmental delay named directly, in the mildest reported
      phenotype, which is what makes it a feature of the spectrum rather than
      only of the severe frameshift patients.
  - reference: PMID:28055140
    reference_title: EIF2S3 Mutations Associated with Severe X-Linked Intellectual Disability Syndrome MEHMO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental delay | + | + | + | + | + | + | + | + | + | +"
    explanation: >-
      The comparison table row, positive in all ten families, which is the
      basis for VERY_FREQUENT.
- name: Motor delay
  category: Neurological
  description: >-
    Motor delay, severe in one missense patient and mild in another. Bound to
    the motor-delay term rather than to global developmental delay because
    that is what the quoted source reports; no frequency is asserted, since
    the evidence is two patients.
  phenotype_term:

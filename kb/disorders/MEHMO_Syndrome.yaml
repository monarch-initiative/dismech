mechanistic_hypotheses:
- hypothesis_group_id: eif2b_activation_is_the_therapeutic_route
  hypothesis_label: Pharmacological eIF2B activation is the therapeutic route
  status: EMERGING
  description: >-
    Holds that the consequences of a defective eIF2 gamma subunit are
    reachable by activating the eIF2 guanine nucleotide exchange factor eIF2B,
    so that the therapeutic target is the exchange step downstream of the
    defect rather than the defective subunit itself. Note the narrower thing
    this does not claim. Patient cells do show increased stress-response
    activity, which is the Over-Activated Integrated Stress Response node and
    is cited there. What nothing reported establishes is whether that
    over-activation, or the reduced translation initiation it accompanies,
    drives the phenotype; eIF2B activation would oppose both, so the rescue
    result below does not separate them either. The experimental support is
    direct but confined
    to cells: ISRIB rescued growth, translation and neuronal differentiation
    in induced pluripotent stem cells from a patient with the C-terminal
    frameshift. No animal or human treatment data were identified, and whether
    rescue in differentiating cells predicts benefit in an already-developed
    brain is untested.
  evidence:
  - reference: PMID:31836389
    reference_title: Suppression of MEHMO Syndrome Mutation in eIF2 by Small Molecule ISRIB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Addition of the drug ISRIB, an activator of the eIF2 guanine nucleotide exchange factor, rescues the cell growth, translation, and neuronal differentiation defects associated with the EIF2S3 mutation, offering the possibility of therapeutic intervention for MEHMO syndrome."
    explanation: >-
      The rescue result and the authors' own framing of it as a possibility
      rather than a demonstrated therapy.
  - reference: PMID:37823684
    reference_title: Pharmacological inhibition of the integrated stress response accelerates disease progression in an amyotrophic lateral sclerosis mouse model.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "This study reveals that the ISR works as a neuroprotective pathway in ALS motor neurons and reveals the toxicity that eIF2B activators may display in ALS patients."
    explanation: >-
      Two eIF2B activators of the same class as ISRIB brought disease forward
      and shortened survival in an ALS mouse model, and the authors warn of
      the toxicity the class may display in patients. REFUTE because the claim
      here is that pharmacological eIF2B activation is the therapeutic route,
      and this is the only in vivo test of that class in a neurological
      disease: it went the wrong way. INDIRECT because the test was in a
      different disease, where eIF2B is being pushed against a protective
      stress response rather than against a defect in eIF2 itself, so it bears
      on the class rather than on this lesion.
  - reference: PMID:37823684
    reference_title: Pharmacological inhibition of the integrated stress response accelerates disease progression in an amyotrophic lateral sclerosis mouse model.
    supports: NO_EVIDENCE
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "In experimental models, both ISR stimulation and inhibition prevented ALS neurodegeneration; however, which mode of ISR regulation would work in patients is still debated."
    explanation: >-
      Cited for what it does not settle. Experimental models have been
      reported going both ways on the direction of stress-response modulation
      that helps, so the direction of effect is open even in the disease where
      the class has been tested in vivo. NO_EVIDENCE because a statement that
      the direction is debated neither supports nor refutes this hypothesis
      about MEHMO; it is the reason the hypothesis stays EMERGING.
  notes: >-
    Kept EMERGING rather than CANONICAL because the entire supporting result
    is in patient-derived cells, and recorded as a hypothesis rather than a
    treatment entry because no patient has been reported treated. The two
    results are not testing the same proposition: rescuing a defined genetic
    lesion in eIF2 assembly is not the same intervention as activating eIF2B
    against a stress response that is itself protective, which is why neither
    result closes the question.
- hypothesis_group_id: hypoglycaemia_contributes_to_neurological_injury
  hypothesis_label: Untreated neonatal hypoglycaemia contributes to the neurological phenotype
  status: EMERGING
  description: >-
    Holds that part of the neurological impairment in the severe patients is
    not a direct consequence of impaired translation in neurons but of
    untreated hypoglycaemia, which was not recognised as part of the syndrome
    until the endocrine phenotype was characterised. The proposal matters
    clinically: if true, early glucose management changes outcome in a disease
    otherwise without treatment. It is raised by the authors of the mild
    family's report as an explanation for why earlier patients were more
    severely affected, and it has not been tested.
  evidence:
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Untreated hypoglycaemia in previous cases may have contributed to their more severe neurological impairment and seizures in association with impaired EIF2S3."
    explanation: >-
      The originating statement of the hypothesis, in the authors' hedged
      wording.
  notes: >-
    Not placed in the pathograph. Doing so would assert that hypoglycaemia
    causes part of the neurological phenotype, which this single hedged
    sentence does not establish, and the alternative explanation for the
    severity difference, that the frameshift allele is simply worse than the
    missense alleles, is supported by functional data.
animal_models:
- name: eif2s3 knockout zebrafish (CRISPR/Cas9)
  species: Zebrafish
  genotype: eif2s3 CRISPR/Cas9 knockout
  publication: PMID:33942450
  description: >-
    CRISPR/Cas9 knockout of the zebrafish ortholog, used to test the
    pathogenicity of patient missense variants and to look at mechanism. It
    reproduces microcephaly with increased neuronal cell death and produces
    hyperglycaemia from beta cell and pancreatic progenitor deficiency. An
    earlier morpholino knockdown of the same gene reproduced microcephaly and
    short stature.
  modeled_mechanisms:
  - target: Neurodevelopmental Impairment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the microcephaly and gives a cellular correlate, increased
      neuronal death.
    limitations: >-
      Microcephaly and neuronal death are reproduced; the intellectual
      disability and epilepsy that dominate the human phenotype are not
      assessable in this model. It is also a complete knockout, whereas the
      human disease is caused by partial loss of function, so it may
      overstate severity.
    evidence:
    - reference: PMID:33942450
      reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CRISPR/Cas9 knockout of eif2s3 in zebrafish embryos recapitulate the human microcephaly and show increased neuronal cell death."
      explanation: The reproduced phenotype and its cellular correlate.
    readouts:
    - name: Neuronal cell death in embryos
      target: Neurodevelopmental Impairment
      direction: INCREASED
      interpretation: Cellular correlate of the reproduced microcephaly.
      evidence:
      - reference: PMID:33942450
        reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "show increased neuronal cell death"
        explanation: The measured readout.
  - target: Pancreatic Beta Cell Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Hyperglycaemia from a deficiency of beta cells and pancreatic
      progenitors, which supports a developmental rather than apoptotic route
      to the glucose phenotype.
    limitations: >-
      The mechanism found here, progenitor deficiency without apoptosis,
      disagrees with the increased cell death seen on EIF2S3 knockdown in a
      human pancreatic cell line, and patient fibroblasts showed no apoptosis
      either. The authors themselves read the discrepancy as tissue-dependent
      mechanisms. The pituitary arm of the disease is not modelled by this
      animal at all, which is why this link targets the beta cell node only.
    evidence:
    - reference: PMID:33942450
      reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Abnormal high glucose levels were identified in mutant embryos, caused by beta cell and pancreatic progenitor deficiency, not related to apoptosis."
      explanation: The glucose phenotype and the cellular route the authors attribute it to.
    readouts:
    - name: Embryonic glucose level
      target: Pancreatic Beta Cell Failure
      direction: INCREASED
      interpretation: Hyperglycaemia in the knockout, the counterpart of the patients' diabetes.
      evidence:
      - reference: PMID:33942450
        reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Abnormal high glucose levels were identified in mutant embryos"
        explanation: The measured readout.
- name: Yeast eIF2gamma-I318M model of the human I259M variant
  species: Yeast
  genotype: Saccharomyces cerevisiae GCD11 I318M, the residue equivalent to human eIF2gamma I259M
  publication: PMID:30517694
  description: >-
    Humanised point mutation in the yeast ortholog, used to measure what the
    patient variant does to eIF2 function. It impairs growth, derepresses
    GCN4, increases initiation at near-cognate start codons, and reduces
    Met-tRNAi binding; overexpressing initiator tRNA restores binding and
    rescues growth, which is how the defect was localised.
  modeled_mechanisms:
  - target: Reduced eIF2 Ternary Complex Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reproduces the molecular lesion, reduced initiator tRNA binding to
      eIF2, and identifies it as the step the variant breaks.
    limitations: >-
      A yeast protein carrying the equivalent substitution, not the human
      protein, and the model reports on molecular function only. It says
      nothing about any tissue or clinical consequence.
    evidence:
    - reference: PMID:30517694
      reference_title: MEHMO syndrome mutation EIF2S3-I259M impairs initiator Met-tRNAiMet binding to eukaryotic translation initiation factor eIF2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The corresponding eIF2γ-I318M mutation impaired yeast cell growth and derepressed GCN4 expression, an indicator of defective eIF2-GTP-Met-tRNAiMet complex formation"
      explanation: The functional defect, read out by GCN4 derepression.
    readouts:
    - name: Met-tRNAi binding to eIF2 rescued by initiator tRNA overexpression
      target: Reduced eIF2 Ternary Complex Formation
      direction: RESTORED
      interpretation: >-
        Restoring initiator tRNA rescued both binding and growth, which is
        what localises the defect to this step rather than to a general loss
        of protein function.
      evidence:
      - reference: PMID:30517694
        reference_title: MEHMO syndrome mutation EIF2S3-I259M impairs initiator Met-tRNAiMet binding to eukaryotic translation initiation factor eIF2.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Overexpression of tRNAiMet restored Met-tRNAiMet binding to eIF2 in vivo and rescued the growth defect in the eIF2γ-I318M strain."
        explanation: The rescue measurement.
differential_diagnoses:
- name: Other eIF2-related and integrated stress response disorders
  description: >-
    A 2025 review proposes grouping MEHMO syndrome with other conditions
    affecting eIF2 and its regulation as eIF2-related neuroendocrinopathies.
    dismech has no such grouping yet; the proposal is recorded here rather
    than acted on.
  evidence:
  - reference: PMID:41207135
    reference_title: "MEHMO syndrome: Review and proposed classification as an eIF2-related neuroendocrinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "reports of additional cases suggest a consideration for a re-definition of the acronym and a re-classification of the condition along with others as eIF2-related neuroendocrinopathies."
    explanation: The proposed reclassification, as a proposal.
- name: Syndromic obesity with hypogonadism and intellectual disability
  description: >-
    The acronym features overlap clinically with Prader-Willi syndrome and
    with Bardet-Biedl syndrome. The distinguishing findings are the X-linked
    pedigree, the microcephaly, and the early-onset insulin-dependent diabetes
    preceded by neonatal hypoglycaemia, which the ciliopathies and
    imprinting disorders do not produce.
discussions:
- discussion_id: mehmo_endocrine_cell_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the endocrine phenotype of MEHMO syndrome caused by death of
    differentiated secretory cells, or by a developmental deficiency of beta
    cells and pancreatic progenitors?
  rationale: >-
    The two available models disagree, and the disagreement is not a detail:
    it decides whether the endocrine disease is progressive degeneration,
    which a stress-response drug might slow, or a fixed developmental
    deficit, which it would not. EIF2S3 knockdown in a human pancreatic cell
    line increased caspase activity and cell death, while the zebrafish
    knockout produced hyperglycaemia from beta cell and progenitor deficiency
    explicitly not related to apoptosis, and patient-derived fibroblasts also
    showed no apoptosis. The authors of the zebrafish work read this as
    tissue-dependent mechanisms, which may be right, but no human pancreatic
    or pituitary tissue from a patient has been examined.
  attaches_to:
  - pathophysiology#Pancreatic Beta Cell Failure
  - animal_models#Zebrafish
  evidence:
  - reference: PMID:33942450
    reference_title: Broadening the phenotypic spectrum and physiological insights related to EIF2S3 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additional studies in patient-derived fibroblasts did not reveal apoptosis. Our results provide new insights into disease physiopathology, suggesting tissue-dependent mechanisms."
    explanation: >-
      The negative apoptosis result in cultured patient fibroblasts, and the
      authors' own reading of the discrepancy, which is the substance of this
      gap. Graded IN_VITRO because the measurement is in cultured human cells,
      even though the same publication's other results are in zebrafish.
  - reference: PMID:30878599
    reference_title: Impaired EIF2S3 function associated with a novel phenotype of X-linked hypopituitarism with glucose dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells lacking EIF2S3 had increased caspase activity/cell death."
    explanation: >-
      The apoptotic result, in a human pancreatic cell line. Graded SUPPORT
      rather than REFUTE because what this discussion asserts is that the two
      results conflict, and this is one of the two: it supports the existence
      of the mismatch, and contradicts only the other experiment, not the
      question being asked.
references:
- reference: PMID:41207135
  title: "MEHMO syndrome: Review and proposed classification as an eIF2-related neuroendocrinopathy."
notes: >-
  Lump/split decision: DISEASE. One gene, one molecular lesion class, and one
  conserved chain from reduced eIF2 ternary complex formation to the
  neurological and endocrine phenotypes. MONDO records no descendants for
  MONDO:0010258 and no causal gene other than EIF2S3.

  The milder EIF2S3 phenotype of X-linked hypopituitarism with glucose
  dysregulation and normal head circumference is curated inside this entry
  rather than as a separate disease or a has_subtypes row. It is the same gene
  acting through the same mechanism with less functional loss, and the authors
  who described it present it as an expansion of the EIF2S3 phenotypic range
  rather than a distinct entity. A has_subtypes row was considered and not
  taken because the published variant-to-severity relationship is a gradient
  rather than two groups, and no MONDO term exists for the mild phenotype.

  Two things are deliberately not asserted. ISRIB is recorded as a
  mechanistic hypothesis, not a treatment, because no patient has been
  reported treated with it. And untreated neonatal hypoglycaemia as a cause of
  part of the neurological phenotype is a hypothesis rather than a pathograph
  edge, on one hedged sentence.

  No GeneReviews chapter exists; a PubMed genereviews[book] title search for
  MEHMO and EIF2S3 returned nothing.

phenotypes:
- category: Biochemical
  name: Hyperoxaluria
  description: >-
    Raised 24-hour urinary oxalate was found in both heterozygous carriers of
    the p.R507W variant in the reported family: the proband (733 and 800
    umol/day on two collections; normal 40-330) and her father (520 umol/day).
    The wild-type mother had normal urinary oxalate. The proband's urine
    collection was shown adequate by creatinine excretion, and dietary oxalate
    intake was low, which points to increased net intestinal oxalate absorption
    rather than dietary excess.
  phenotype_term:
    preferred_term: Hyperoxaluria
    term:
      id: HP:0003159
      label: Hyperoxaluria
  evidence:
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation cosegregated with hyperoxaluria in the family."
    explanation: Supports hyperoxaluria in SLC26A6-related disease.
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even though the father did not report any renal colic, biochemical analyses revealed that he also had hyperoxaluria"
    explanation: A second heterozygous carrier, the proband's father, had hyperoxaluria without having had stones, so the biochemical trait was seen in both carriers.
- category: Clinical
  name: Calcium oxalate nephrolithiasis
  description: >-
    The proband, a late adolescent woman, had her first renal colic in early
    adolescence and then more than 20 further episodes, passing multiple
    stones. Imaging showed multiple bilateral stones without nephrocalcinosis;
    a passed stone was about 80% calcium oxalate monohydrate (whewellite).
    Renal function was normal and there were no signs of systemic oxalosis.
    Her heterozygous father, who has hyperoxaluria, never had a renal colic;
    his very high water intake (urine output near 4 L/day) was proposed as the
    reason, so stone formation is not seen in every carrier.
  phenotype_term:
    preferred_term: Calcium oxalate nephrolithiasis
    term:
      id: HP:0008672
      label: Calcium oxalate nephrolithiasis
    temporality: RECURRENT
  evidence:
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used a whole exome-based approach in a patient with calcium oxalate NL."
    explanation: Supports calcium oxalate nephrolithiasis in the SLC26A6 index case.
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abdominal CT and ultrasound detected multiple and bilateral stones without nephrocalcinosis"
    explanation: Documents multiple bilateral stones in the proband, with no nephrocalcinosis.
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since then, she has had recurrent renal colic (>20) and passed multiple kidney stones."
    explanation: Documents recurrent renal colic with more than 20 episodes and multiple passed stones in the proband.
- category: Biochemical
  name: Hypocitraturia
  description: >-
    The proband had very mild hypocitraturia (urinary citrate 1.18 mmol/24 h;
    normal above 1.67), later 1.49 mmol/24 h on dietary treatment. Her father
    had normal citrate excretion. The authors considered it unlikely that so
    mild a reduction alone explains her frequent recurrences but allowed that
    it may have added to the stone risk; no mechanism linking it to the
    p.R507W variant is established, so it is not wired into the causal graph.
  phenotype_term:
    preferred_term: Hypocitraturia
    term:
      id: HP:0012405
      label: Hypocitraturia
    severity: MILD
  evidence:
  - reference: PMID:35115415
    reference_title: "Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria and nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A very mild hypocitraturia, along with the marked hyperoxaluria, was also observed in our patient."
    explanation: Reports mild hypocitraturia in the proband of the SLC26A6 p.R507W family.
discussions:
- discussion_id: gap_slc26a6_disease_boundary
  prompt: >-
    Beyond the reported dominant-negative p.R507W family, what is the penetrance
    and mutational spectrum of SLC26A6-related hyperoxaluria and nephrolithiasis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative SLC26A6 Oxalate Transporter Dysfunction
  rationale: >-
    A newer family supports a rare dominant-negative disease mechanism, but an
    earlier cohort found that SLC26A6 was not the monogenic cause of their
    non-PH1/PH2 hyperoxaluria cohort and that identified common variants had no
    significant effect on oxalate excretion. Additional families are needed to
    define the disease boundary and penetrance.
  evidence:
  - reference: PMID:18951670
    reference_title: "Phenotypic and functional analysis of human SLC26A6 variants in patients with familial hyperoxaluria and calcium oxalate nephrolithiasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC26A6 was effectively ruled out as the disease gene in this non-PH1/PH2 cohort."
    explanation: Earlier cohort screening limits overgeneralization of SLC26A6 as a common monogenic cause.

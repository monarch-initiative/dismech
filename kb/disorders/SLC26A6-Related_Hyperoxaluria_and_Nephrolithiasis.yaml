  notes: >-
    Solute carrier family 26 member 6 (PAT1/CFEX), an apical epithelial
    chloride/oxalate, chloride/bicarbonate and sulfate anion exchanger that
    mediates intestinal oxalate secretion. A single family carries the
    heterozygous dominant-negative missense variant c.1519C>T p.R507W; earlier
    cohort screening did not support SLC26A6 as a common monogenic cause of
    hyperoxaluria, and no further families had been reported by 2026. No
    ClinGen gene-disease validity assertion exists for SLC26A6. The record is
    typed UNKNOWN rather than CAUSATIVE because one family does not reach the
    Definitive or Strong level that CAUSATIVE asserts.

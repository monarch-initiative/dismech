genetic:
- name: ANK2 loss-of-function variants
  gene_term:
    preferred_term: ANK2
    term:
      id: hgnc:493
      label: ANK2
  association: Causative heterozygous loss-of-function variants
  relationship_type: CAUSATIVE
  features: >-
    Heterozygous loss-of-function variants cause an autosomal dominant complex
    neurodevelopmental disorder. ClinGen curated seven de novo
    protein-truncating variants across eight probands and identifies loss of function as
    the predicted disease mechanism. De novo missense variants are also
    reported, including variants of uncertain significance; these are not
    generalized here as an established causative class. A separate familial
    giant-isoform frameshift report describes an epilepsy-only allelic
    presentation.
  evidence:
  - reference: PMID:37195288
    reference_title: "ANK2 loss-of-function variants are associated with epilepsy, and lead to impaired axon initial segment plasticity and hyperactive network activity in hiPSC-derived neuronal networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We collected clinical and molecular data of 12 individuals with
      heterozygous de novo LoF variants in ANK2.
    explanation: >-
      Establishes the heterozygous loss-of-function cohort.
  - reference: "CGGV:assertion_097e646b-467f-4c08-95d6-958ed324562b-2020-10-21T100000.000Z"
    reference_title: ANK2 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Seven de novo protein truncating variants (frameshift and nonsense) that
      have been reported in 8 probands in 7 publications
    explanation: >-
      Supplies the curated variant-class and proband counts for the established
      truncating-variant class.
  - reference: "CGGV:assertion_097e646b-467f-4c08-95d6-958ed324562b-2020-10-21T100000.000Z"
    reference_title: ANK2 / complex neurodevelopmental disorder (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of pathogenicity is predicted to be loss-of-function based
      on the protein truncating variants reported in individuals affected with
      neurodevelopmental disorders and experimental data showing reduced protein
      expression in cultured cells bearing truncating variants in ANK2
    explanation: >-
      ClinGen explicitly supports loss of function as the disease mechanism.
  - reference: "CGGV:assertion_097e646b-467f-4c08-95d6-958ed324562b-2020-10-21T100000.000Z"
    reference_title: ANK2 / complex neurodevelopmental disorder (Definitive)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      at least six de novo missense variants of unknown significance (PMIDs:
      28135719, 31981491) have also been reported in individuals with
      neurodevelopmental disorders.
    explanation: >-
      Documents the reported missense-VUS count while explicitly withholding
      support for an established causative missense class.

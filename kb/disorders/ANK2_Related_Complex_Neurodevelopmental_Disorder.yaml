inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous de novo loss-of-function variants predominate in the principal
    complex-neurodevelopmental cohort. A family carrying a giant-ankyrin-B
    frameshift had young-onset self-limited focal epilepsy without a documented
    complex neurodevelopmental phenotype, and a separate familial missense
    report described high-functioning autism in a child and subthreshold
    autistic traits in her father.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:37195288
    reference_title: "ANK2 loss-of-function variants are associated with epilepsy, and lead to impaired axon initial segment plasticity and hyperactive network activity in hiPSC-derived neuronal networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We collected clinical and molecular data of 12 individuals with
      heterozygous de novo LoF variants in ANK2.
    explanation: >-
      Establishes heterozygous de novo loss of function in the principal human
      cohort.
  - reference: PMID:39962910
    reference_title: "Self-limited familial focal epilepsy caused by ANK2 variants: A potentially under-recognized condition."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereby, we reported a Taiwanese family with the ANK2 pathogenic variant
      (chr4:114276707, c.6933del, p.T2312Lfs*2) that affects the giant
      ankyrin-B isoform.
    explanation: >-
      The familial report shows that ANK2-related epilepsy is not confined to
      de novo presentations, but it does not establish inherited complex
      neurodevelopmental disorder.
  - reference: PMID:39978592
    reference_title: "Variability in autism spectrum phenotypes linked to heterozygous missense familial ANK2 mutation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient was diagnosed with high-functioning ASD while her father
      showed subthreshold autistic traits such as relational difficulties and
      peculiar interests.
    explanation: >-
      Supports inherited and variably expressive autistic traits in one family,
      but the reported missense variant was only predicted pathogenic and does
      not redefine the established loss-of-function mechanism.
mechanistic_hypotheses:
- hypothesis_group_id: general_ank2_haploinsufficiency_neuronal_model
  hypothesis_label: General ANK2 Haploinsufficiency Neuronal Model
  status: EMERGING
  description: >-
    Reduced ankyrin-B expression in human neurons produces parallel
    somatodendritic/AIS abnormalities and hyperactive, desynchronized network
    activity. Links from these cellular phenotypes to intellectual disability
    and epilepsy remain candidate disease mechanisms rather than established
    linear causal chains.
  evidence:
  - reference: PMID:37195288
    reference_title: "ANK2 loss-of-function variants are associated with epilepsy, and lead to impaired axon initial segment plasticity and hyperactive network activity in hiPSC-derived neuronal networks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our functional in vitro data of ANK2-deficient human neurons show a
      specific neuronal phenotype in which reduced ANKB expression leads to
      hyperactive and desynchronized neuronal network activity, increased
      somatodendritic complexity and AIS structure and impaired
      activity-dependent plasticity of the AIS.
    explanation: >-
      Supports both observed human-neuron branches without imposing a serial
      AIS-to-network edge.
- hypothesis_group_id: giant_ankyrin_b_axon_branching_model
  hypothesis_label: Giant Ankyrin-B Axon-Branching Model
  status: EMERGING
  description: >-
    The neurospecific giant ankyrin-B isoform normally couples axonal
    microtubules to L1CAM-containing membrane domains and restricts collateral
    branch formation. Disruption produces ectopic axon branching and
    connectivity in a mouse-derived neuronal model; relevance to human autistic
    behavior remains a candidate link.
  evidence:
  - reference: PMID:31285321
    reference_title: "ANK2 autism mutation targeting giant ankyrin-B promotes axon branching and ectopic connectivity."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, gain of axon branching due to giant ankB-deficiency/mutation is a
      candidate cellular mechanism to explain aberrant structural connectivity
      and penetrant behavioral consequences in mice as well as humans bearing
      ASD-related ANK2 mutations.
    explanation: >-
      The authors explicitly frame giant-ankyrin-B-dependent branching as a
      candidate mechanism with model-organism support.
- hypothesis_group_id: ank2_kv7_cortical_hyperexcitability_model
  hypothesis_label: ANK2-Kv7 Cortical Hyperexcitability Model
  status: EMERGING
  description: >-
    Developmental Ank2 loss in mouse cortical excitatory neurons reduces the
    abundance and function of AIS Kv7.2/KCNQ2 and Kv7.3/KCNQ3 channels, producing
    cortical hyperexcitability and seizure-related death. Kv7 activation and
    AMPA-receptor antagonism rescue model phenotypes, but this mechanism and its
    pharmacologic tractability have not been established in affected humans.
  evidence:
  - reference: PMID:37321992
    reference_title: "Kv7/KCNQ potassium channels in cortical hyperexcitability and juvenile seizure-related death in Ank2-mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These changes accompanied decreases in the total level and function of
      the Kv7.2/KCNQ2 and Kv7.3/KCNQ3 potassium channels and the density of
      these channels in the enlengthened axon initial segment.
    explanation: >-
      Directly supports the proposed Kv7-channel arm in Ank2-mutant mice.
- hypothesis_group_id: dendritic_nav1_2_scaffolding_model
  hypothesis_label: Dendritic NaV1.2 Scaffolding Model
  status: EMERGING
  description: >-
    Ankyrin-B scaffolds NaV1.2 at the dendritic membrane of mouse neocortical
    pyramidal neurons. Ank2 haploinsufficiency reproduces dendritic excitability
    and synaptic deficits seen with Scn2a haploinsufficiency, suggesting a
    convergent dendritic mechanism for autism-related neurodevelopmental risk.
  evidence:
  - reference: PMID:38290518
    reference_title: "Physical and functional convergence of the autism risk genes Scn2a and Ank2 in neocortical pyramidal cell dendrites."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that ankyrin-B is essential for scaffolding NaV1.2 to the
      dendritic membrane of mouse neocortical neurons and that haploinsufficiency
      of Ank2 phenocopies intrinsic dendritic excitability and synaptic deficits
      observed in Scn2a+/- conditions.
    explanation: >-
      Establishes the ankyrin-B-dependent dendritic NaV1.2 scaffolding mechanism
      and the resulting cellular deficits in mouse neurons.

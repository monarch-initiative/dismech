  evidence:
  - reference: PMID:31285321
    reference_title: "ANK2 autism mutation targeting giant ankyrin-B promotes axon branching and ectopic connectivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We elucidate a mechanism normally limiting axon branching, whereby giant
      ankB localizes to periodic axonal plasma membrane domains through L1
      cell-adhesion molecule protein, where it couples microtubules to the plasma
      membrane and prevents microtubule entry into nascent axon branches.
    explanation: >-
      Establishes the L1CAM-microtubule coupling mechanism in the
      mouse-derived neuronal system.
  downstream:
  - target: Ectopic Axon Branching and Connectivity
    description: >-
      Disruption of the giant ankyrin-B branch-restriction mechanism increases
      axonal branching and ectopic CNS connectivity.
    hypothesis_groups:
    - giant_ankyrin_b_axon_branching_model
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31285321
      reference_title: "ANK2 autism mutation targeting giant ankyrin-B promotes axon branching and ectopic connectivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We report that a mouse model for human ASD mutation of giant ankB
        exhibits increased axonal branching in cultured neurons with ectopic CNS
        axon connectivity, as well as with a transient increase in excitatory
        synapses during postnatal development.
      explanation: >-
        Directly demonstrates ectopic branching and connectivity in the
        giant-ankyrin-B model.

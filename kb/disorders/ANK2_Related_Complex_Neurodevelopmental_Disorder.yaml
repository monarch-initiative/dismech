  relationship_type: CAUSATIVE
  features: >-
    Heterozygous loss-of-function variants cause an autosomal dominant complex
    neurodevelopmental disorder. The principal published
    complex-neurodevelopmental cohort consists of de novo variants; a separate
    familial giant-isoform frameshift report describes an epilepsy-only allelic

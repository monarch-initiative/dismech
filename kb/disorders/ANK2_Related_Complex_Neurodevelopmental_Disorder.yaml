diagnosis:
- name: Exome or genome sequencing for ANK2-related neurodevelopmental disorder
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Exome or genome sequencing is appropriate early in the evaluation of a
    child with developmental delay or intellectual disability. A heterozygous
    pathogenic or likely pathogenic ANK2 loss-of-function variant, interpreted
    with inheritance and phenotype, supports the molecular diagnosis.
  results: >-
    Identification of a heterozygous pathogenic or likely pathogenic ANK2
    loss-of-function variant consistent with the neurodevelopmental phenotype.
  evidence:
  - reference: PMID:34211152
    reference_title: "Exome and genome sequencing for pediatric patients with congenital anomalies or intellectual disability: an evidence-based clinical guideline of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We strongly recommend that ES/GS be considered as a first- or second-tier
      test for patients with CA/DD/ID.
    explanation: >-
      The ACMG guideline supports early exome or genome sequencing in the
      relevant pediatric neurodevelopmental population.
  - reference: PMID:37195288
    reference_title: "ANK2 loss-of-function variants are associated with epilepsy, and lead to impaired axon initial segment plasticity and hyperactive network activity in hiPSC-derived neuronal networks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We collected clinical and molecular data of 12 individuals with
      heterozygous de novo LoF variants in ANK2.
    explanation: >-
      Establishes the molecular class identified in affected individuals.
- name: Electroencephalography for Seizure Evaluation
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  description: >-
    EEG is appropriate for evaluating suspected seizures and documenting
    electrophysiologic abnormalities in the ANK2-related spectrum. Published
    cases establish that abnormal EEG is common in the selected literature
    cohort but do not define a single ANK2-specific EEG signature.
  results: >-
    An abnormal EEG supports seizure phenotyping but is not specific for an
    ANK2 molecular diagnosis.
  evidence:
  - reference: PMID:40035441
    reference_title: "A Mutation in the ANK2 Gene Causing ASD and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient cohort included 16 patients with a complex array of
      neurological disabilities: ASD (9 patients); EP (10 patients); ASD with
      EP (4 patients); intellectual disability and developmental delay (5 patients);
      poor language communication (11 patients); language and learning impairment
      (11 patients); anxiety/agitation mood disorder (6 patients);
      attention-deficit/hyperactivity disorder (5 patients); cognitive, memory,
      and adaptability deficits (1 patient); tic disorder (1 patient);
      electrocardiogram and cardiac damage (1 patient); and abnormal
      electroencephalography (EEG) (9 patients).
    explanation: >-
      Directly supports abnormal EEG as a recurrent finding while not asserting
      a disease-specific electrophysiologic pattern.
notes: >-
  MONDO:0100038 is a broad complex-neurodevelopmental-disorder class used by
  the ClinGen assertion for this gene-disease relationship. The entry name
  provides the ANK2-specific scope. Published-case counts are not converted to
  population frequency enums because the expanded review is a selected
  literature cohort. Hypotonia and motor delay remain omitted because exact,
  disorder-scoped support was not available in the fetched reference caches.
  The 2020 ClinGen neurodevelopmental curation separately notes reported ANK2
  long-QT findings and an expert-panel validity evaluation; this record retains
  the neurodevelopmental scope and leaves cardiac assertions to the separate
  ankyrin-B cardiac record.

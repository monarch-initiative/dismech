name: ANK2-Related Complex Neurodevelopmental Disorder
creation_date: '2026-07-18T19:05:00Z'
category: Genetic
description: >-
  ANK2-related complex neurodevelopmental disorder is an autosomal dominant
  disorder caused by heterozygous loss-of-function ANK2 variants. The reported
  spectrum includes intellectual disability, autism spectrum disorder, and
  early-onset epilepsy, with speech and language impairment and behavioral
  manifestations described in expanded case reviews. The principal
  loss-of-function cohort consists of de novo variants, while familial reports
  describe variable autistic traits or self-limited focal epilepsy. Human-neuron
  experiments support parallel effects on somatodendritic and
  axon-initial-segment structure and on
  network activity, while a distinct giant-ankyrin-B model supports abnormal
  axon branching and connectivity. Cardiac ankyrin-B findings and disputed
  ANK2-LQTS/CPVT relationships are modeled in a separate cardiac record.
synonyms:
- ANK2-related neurodevelopmental disorder
- ANK2 haploinsufficiency disorder

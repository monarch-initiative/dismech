- name: Giant Ankyrin-B Axonal Membrane-Microtubule Coupling Failure
  description: >-
    Giant ankyrin-B normally localizes through L1CAM-containing axonal membrane
    domains, couples microtubules to the plasma membrane, and prevents
    microtubule entry into nascent branches.
  genes:
  - preferred_term: ANK2
    term:

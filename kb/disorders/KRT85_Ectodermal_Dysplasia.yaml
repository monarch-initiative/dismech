treatments:
- name: Symptomatic Management
  description: >-
    No specific disease-modifying treatment exists for the underlying KRT85
    intermediate filament defect. Management is supportive and includes gentle
    hair care to minimize mechanical breakage, protective nail care for
    dystrophic nails, and cosmetic prostheses such as wigs. Because sweat glands
    and teeth are spared, thermoregulatory precautions and dental rehabilitation
    required in hypohidrotic ectodermal dysplasias are unnecessary.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Symptomatic Therapy
    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
  evidence:

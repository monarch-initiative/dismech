  findings:
  - statement: >-
      K85 and K35 are the earliest hair keratins expressed in differentiating
      cortical cells and form short intermediate filaments that bundle laterally;
      the ECTD4 tail-domain delCT frameshift abolishes K85-K35 filament assembly
      into aggregates whereas the head-domain R78H missense variant permits
      initial filament formation.
    supporting_text: >-

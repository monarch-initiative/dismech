notes: >-
  Entry scope and grouping relationship: this entry covers ectodermal dysplasia
  4, hair/nail type (ECTD4, MONDO:0011177), the KRT85-related autosomal
  recessive form of pure hair and nail ectodermal dysplasia (PHNED). The two
  sibling autosomal recessive forms—ECTD7 (KRT74, MONDO:0013975) and ECTD9
  (HOXC13, MONDO:0013976)—are curated in `KRT74_Ectodermal_Dysplasia.yaml` and
  `HOXC13_Ectodermal_Dysplasia.yaml`, and all three are collected under the
  umbrella grouping `Pure_Hair_and_Nail_Ectodermal_Dysplasias.yaml`
  (MONDO:0019071).

  Pathway convergence across PHNED genes: all three known autosomal recessive
  PHNED genes reside in the chromosome 12p11.1-q14.3 region, where the type II
  keratin gene cluster and the HOXC cluster are adjacent. Rather than being
  independent phenocopies, HOXC13 directly transactivates KRT85 and its type I
  partner KRT35 in differentiating hair cortex and nail matrix keratinocytes
  (PMID:28011715), so ECTD9 (regulator loss) and ECTD4 (structural effector
  loss) disrupt consecutive steps of the same appendage keratinization pathway.

  Exclusion of dental and eccrine involvement: normal dentition (absence of
  hypodontia) and normal sweating (absence of hypohidrosis) are defining
  negative features that separate ECTD4 from the hypohidrotic ectodermal
  dysplasias. As documented in `kb/groupings/Pure_Hair_and_Nail_Ectodermal_Dysplasias.yaml`,
  these exclusions are stated in the disease description, diagnostic criteria,
  and differential diagnosis rather than as `frequency: EXCLUDED` phenotype
  leaves so that all curated phenotype nodes remain causally connected to the
  KRT85 pathophysiology graph.

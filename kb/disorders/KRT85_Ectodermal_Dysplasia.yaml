pathophysiology:
- name: KRT85 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    KRT85 encodes keratin 85 (formerly KRTHB5), a type II hard keratin that
    obligately heterodimerizes with type I hair keratins (particularly KRT35)
    to form short intermediate filaments that laterally associate into bundles.
    Transcription of KRT85 and KRT35 is directly activated upstream by HOXC13
    (mutated in ECTD9). Biallelic pathogenic variants in KRT85 either abolish
    K85-K35 filament assembly into cytoplasmic aggregates (such as the
    tail-domain delCT frameshift) or alter conserved head-domain residues
    required for higher-order filament organization (such as R78H), compromising
    hard keratin intermediate filament integrity across both hair follicle and
    nail matrix epithelia.

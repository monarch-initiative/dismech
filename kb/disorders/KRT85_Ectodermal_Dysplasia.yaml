    reference_title: "Keratin gene mutations in disorders of human skin and its appendages."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular defects in cutaneous keratin genes encoding for keratin
      intermediate filaments (KIFs) causes keratinocytes and tissue-specific
      fragility, accounting for a large number of genetic disorders in human
      skin and its appendages.
    explanation: >-
      Because the disorder arises from intrinsic structural fragility of hair
      and nail keratin intermediate filaments, clinical care focuses on
      supportive protection against mechanical trauma.
- name: Genetic Counseling
  description: >-
    Genetic counseling for autosomal recessive inheritance (25% recurrence risk
    for siblings of an affected individual), cascade carrier testing for family
    members, and prenatal or preimplantation genetic testing when the familial
    KRT85 pathogenic variants have been identified.
  therapeutic_modality: BEHAVIORAL

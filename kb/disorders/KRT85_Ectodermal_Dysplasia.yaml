diagnosis:
- name: Molecular Genetic Testing of KRT85 and PHNED Gene Panel
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is suspected clinically in individuals presenting with congenital
    hypotrichosis or complete alopecia and nail dystrophy affecting all twenty
    nails, with normal dentition and normal sweat gland function. Definitive
    diagnosis requires molecular genetic testing via a multigene ectodermal
    dysplasia / hereditary hypotrichosis panel that includes KRT85, HOXC13, and
    KRT74 (all located within the chromosome 12p11.1-q14.3 region) or exome
    sequencing, followed by parental carrier testing to confirm biallelic
    variants in trans.
  results: >-
    Identification of biallelic (homozygous or compound heterozygous) pathogenic
    variants in KRT85.
  markers: >-
    Coding exons and exon-intron boundaries of KRT85 (formerly KRTHB5) on
    chromosome 12q13.13.
  evidence:
  - reference: PMID:16525032
    reference_title: "A mutation in the hair matrix and cuticle keratin KRTHB5 gene causes ectodermal dysplasia of hair and nail type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequence analysis revealed a homozygous missense mutation in the hair
      matrix and cuticle keratin KRTHB5, leading to histidine substitution of a
      conserved arginine residue (R78H) located in the head domain.
    explanation: >-
      Demonstrates definitive molecular diagnosis by DNA sequence analysis of
      KRT85 (KRTHB5).
  - reference: PMID:28403827
    reference_title: "A novel mutation in homeobox DNA binding domain of HOXC13 gene underlies pure hair and nail ectodermal dysplasia (ECTD9) in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To screen for mutation in the genes (HOXC13, KRT74, KRT85), its coding
      exons and exons-intron boundaries were sequenced.
    explanation: >-
      Supports parallel sequencing of coding exons and splice junctions across
      all three known autosomal recessive PHNED genes (HOXC13, KRT74, KRT85)
      because their clinical presentations overlap.

- name: Hair Keratin Intermediate Filament Disruption
  biological_scale: CELLULAR
  description: >-
    Within the hair matrix, cuticle, and early differentiating hair cortex,
    K85-K35 heterodimers normally form short intermediate filaments that bundle
    into proto-macrofibrils. Disruption of KRT85 prevents normal cortical and
    cuticle keratin filament bundling, resulting in structurally fragile hair
    shafts, sparse hair (hypotrichosis), or complete failure of hair shaft
    production (alopecia).

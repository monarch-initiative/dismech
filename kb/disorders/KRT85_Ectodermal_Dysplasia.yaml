name: KRT85-Related Pure Hair-Nail Ectodermal Dysplasia
creation_date: "2026-04-24T00:00:00Z"
updated_date: "2026-10-16T19:45:00Z"
synonyms:
- ECTD4
- pure hair and nail ectodermal dysplasia
- PHNED
- ectodermal dysplasia of hair and nail type
description: >-
  KRT85-related ectodermal dysplasia 4, hair/nail type (ECTD4) is a rare autosomal
  recessive disorder caused by biallelic loss-of-function mutations in KRT85, which
  encodes keratin 85 (formerly KRTHB5), a type II hair-specific keratin expressed
  in the hair matrix, cuticle, and cortex as well as the nail matrix. Affected
  individuals present with congenital hypotrichosis or complete alopecia and nail
  dystrophy from birth or early childhood. Unlike hypohidrotic forms of ectodermal
  dysplasia, sweat gland function and dentition are normal, restricting the phenotype
  to hair and nail appendages. Because K85 and its type I partner K35 are the first
  hair keratins expressed in differentiating cortical cells—promoting lateral
  association of short intermediate filaments into bundles—disruption of KRT85
  selectively compromises hair shaft and nail plate structural integrity without
  affecting other ectodermal derivatives. Additionally, KRT85 is a direct
  transcriptional target of HOXC13 (mutated in ECTD9), placing the KRT85 and HOXC13
  forms of pure hair and nail ectodermal dysplasia in a single regulatory-structural
  pathway.

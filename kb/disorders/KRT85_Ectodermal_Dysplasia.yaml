    evidence_source: IN_VITRO
    snippet: >-
      K85 and K35 are the first hair keratins expressed in cortical cells
      at the early stage of the differentiation. Two types of mutations in
      the gene encoding K85 are associated with ectodermal dysplasia of
      hair and nail type
    explanation: >-
      Demonstrates that K85 and K35 are the earliest hair keratins expressed
      in differentiating cortical cells and that K85 mutations cause ectodermal
      dysplasia of hair and nail type.
  - reference: PMID:33605551
    reference_title: "De novo filament formation by human hair keratins K85 and K35 follows a filament development pattern distinct from cytokeratin filament networks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The K85-K35 pair formed short filaments in the cytoplasm, which
      gradually elongated and became thicker and entangled around the
      nucleus, indicating that K85-K35 promotes lateral association of
      short intermediate filaments (IFs) into bundles but cannot form IF
      networks in the cytoplasm
    explanation: >-
      Characterization of K85-K35 intermediate filament assembly shows unique
      lateral bundling behavior distinct from cytokeratin networks.
  - reference: PMID:28011715
    reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hoxc13 was not expressed in pigs with all three mutation types, and the
      expression levels of Hoxc13-regulated genes, namely, Foxn1, Krt85 and
      Krt35, were decreased.
    explanation: >-
      Establishes that Krt85 and its heterodimer partner Krt35 are downstream
      transcriptional targets of Hoxc13, mechanistically linking ECTD4 (KRT85)
      and ECTD9 (HOXC13).

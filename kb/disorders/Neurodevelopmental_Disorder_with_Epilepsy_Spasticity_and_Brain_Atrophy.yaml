- name: Genetic counseling and reproductive options
  description: >-
    Autosomal recessive inheritance carries a 25% recurrence risk for each
    subsequent pregnancy. Because the recurrent c.454+3A>G allele has a
    measurable carrier frequency in the general population, on the order of a few
    per 10,000 and highest in Mediterranean and European ancestries, cascade
    carrier testing of relatives and, once the familial allele is known, prenatal
    or preimplantation testing are the practical preventive options.

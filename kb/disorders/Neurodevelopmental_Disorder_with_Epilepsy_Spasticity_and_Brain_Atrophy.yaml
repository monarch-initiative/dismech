name: Neurodevelopmental Disorder with Epilepsy, Spasticity, and Brain Atrophy
creation_date: '2026-08-15T00:00:00Z'
category: Mendelian
synonyms:
- NEDESBA
- TRAPPC4-related neurodevelopmental disorder
- TRAPPC4-related encephalopathy
- TRAPPC4 trappopathy
- TRAPPC4-related early-infantile neurodegenerative syndrome
- severe syndromic intellectual disability due to TRAPPC4 deficiency
description: >-
  Neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
  (NEDESBA; OMIM 618741) is an ultra-rare autosomal recessive TRAPPopathy caused
  by biallelic pathogenic variants in TRAPPC4, which encodes a core subunit
  (historically called synbindin) of the multisubunit TRAnsport Protein Particle
  (TRAPP) membrane-tethering complex. After a usually unremarkable pregnancy and
  neonatal period, affected infants develop profound global developmental
  impairment within the first months of life, seizures that typically begin in
  the first year, progressive postnatal microcephaly, and spastic tetraplegia.
  Psychomotor progress is minimal or absent, producing feeding difficulties and
  an inability to walk or speak, and early milestones that were attained are
  subsequently lost. Serial neuroimaging shows progressive cerebral cortical and
  (in most patients) cerebellar atrophy with white-matter volume loss,
  ventriculomegaly and a thin corpus callosum, so the disorder is best understood
  as a neurodegenerative process layered on a developmental one. Sensorineural
  hearing loss, cortical visual impairment and optic atrophy, a subtle
  recognizable facial gestalt, and, in a subset, elevated creatine kinase and
  lactate with muscle involvement complete the picture. Most reported individuals
  worldwide are homozygous for a single recurrent non-canonical splice variant,
  NM_016146.5:c.454+3A>G, which is leaky (hypomorphic): it reduces full-length
  TRAPPC4 transcript and protein rather than abolishing it, and complete loss is
  thought to be incompatible with life. Reduced TRAPPC4 destabilizes assembly of
  the TRAPP complex, impairing its guanine-nucleotide-exchange-factor activity
  towards RAB1 and hence endoplasmic-reticulum-to-Golgi vesicular tethering,
  Golgi transit, and autophagosome formation. Patient fibroblasts show delayed
  entry into and exit from the Golgi and a basal autophagy defect with delayed
  autophagic flux, both rescued by wild-type TRAPPC4, and a yeast trs23 model
  reproduces the secretory and autophagic defects. No disease-modifying therapy
  exists; management is molecular diagnosis, symptomatic antiseizure treatment,
  spasticity and feeding management, multidisciplinary rehabilitation, and
  genetic counseling.

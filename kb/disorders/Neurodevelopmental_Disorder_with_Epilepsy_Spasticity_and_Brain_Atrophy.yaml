    explanation: >-
      Resolves the precise mis-splicing event and the nonsense-mediated-decay
      route to transcript loss.
- name: Reduced TRAPP Complex Assembly and Stability
  description: >-
    TRAPPC4 is one of the small core subunits present in every TRAPP complex, and
    all four core subunits are essential for cell viability. Reduced TRAPPC4
    protein selectively destabilizes the assembled machine: in patient
    fibroblasts TRAPPC4 protein levels fall while the levels of other TRAPP
    subunits are unchanged, yet native gel electrophoresis and size exclusion
    chromatography reveal a defect in assembly and/or stability of the intact
    complex. The lesion is therefore at the level of the holo-complex, not of an
    individual partner subunit.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  protein_complexes:
  - preferred_term: TRAPP complex

    reference_title: Further evidence of muscle involvement in neurodevelopmental disorder
      with epilepsy, spasticity, and brain atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Regression of achieved milestones is seen in addition to delayed milestones
      in most individuals with this condition.
    explanation: Documents regression on top of delay as the characteristic trajectory.
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some patients exhibit frequent infections, which can lead to death in
      the first decade, at a mean age of 8.8 years.
    explanation: Documents the reported mortality and its usual proximate cause.

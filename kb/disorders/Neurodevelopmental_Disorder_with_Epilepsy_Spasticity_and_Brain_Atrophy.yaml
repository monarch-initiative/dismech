    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Early-onset, poorly controlled epileptic activity contributes to the
      developmental arrest characteristic of an epileptic encephalopathy.
  evidence:
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected individuals with the homozygous TRAPPC4 c.454+3A>G variant showed
      profound psychomotor delay, developmental regression, early-onset epilepsy, microcephaly
      and progressive spastic tetraplegia.
    explanation: Establishes early-onset epilepsy as a core feature of the largest cohort.
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A variety of seizures, including spasms, occur early in NEDESBA. Epileptiform
      abnormalities, generalized disorganization and very low voltage background activity
      are reported.
    explanation: Describes seizure semiology and the accompanying EEG signature.
- name: Corticospinal Tract Dysfunction and Spasticity
  description: >-
    Upper-motor-neuron signs dominate the motor examination. Spasticity affects
    all four limbs (spastic quadriparesis/tetraplegia) with brisk deep tendon
    reflexes, and it is progressive, ultimately contributing to complete loss of
    independent mobility. Spasticity is frequently refractory to baclofen and
    physical rehabilitation.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  locations:

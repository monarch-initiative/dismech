progression:
- phase: Onset
  age_range: First months of life (early infancy)
  notes: >-
    Pregnancy and the neonatal period are usually unremarkable. Global
    developmental impairment becomes apparent within the first months, and
    seizures typically begin between two and six months of age (within the first
    year in nearly all patients).
  evidence:
  - reference: PMID:34878169
    reference_title: Further evidence of muscle involvement in neurodevelopmental disorder
      with epilepsy, spasticity, and brain atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early-onset seizures (two months to six months) were noted in 23 out of
      31 individuals with recurrent splicing variant along with P1 (one year).
    explanation: Establishes the typical age at seizure onset.
- phase: Developmental stagnation and regression
  age_range: Infancy to early childhood
  notes: >-
    Almost no psychomotor progress is made, and the few milestones that were
    attained are lost. Head growth decelerates and the child becomes spastic and
    tetraplegic. This is the phase in which the disorder declares itself as
    neurodegenerative rather than static.
  evidence:
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected individuals with the homozygous TRAPPC4 c.454+3A>G variant showed
      profound psychomotor delay, developmental regression, early-onset epilepsy, microcephaly
      and progressive spastic tetraplegia.
    explanation: Describes the stagnation-plus-regression phase of the natural history.
- phase: Progressive brain atrophy
  age_range: Infancy through childhood
  notes: >-
    Serial MRI shows worsening cerebral (and usually cerebellar) atrophy, more
    severe in older children. Repeat imaging within a few months of presentation
    can already show new severe cortical atrophy. Optic atrophy may likewise
    appear during follow-up having been absent initially.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the presented patient, spasms and very low voltage activity on EEG
      early in the course, led to a second MRI showing severe cortical atrophy, indicating
      the progressive course of the disease.
    explanation: Serial imaging documenting the progressive phase.
- phase: Late complications and mortality
  age_range: First decade
  notes: >-
    Profound dependence, refractory spasticity and epilepsy, and susceptibility to
    intercurrent infection. Death in the first decade is reported in a minority,
    at a mean age of about 8.8 years. Mortality is
    deliberately recorded here rather than as a phenotype, because HP:0003819
    ("Death in childhood") sits under Clinical modifier rather than Phenotypic
    abnormality and so is not a valid phenotype_term in this schema.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some patients exhibit frequent infections, which can lead to death in
      the first decade, at a mean age of 8.8 years.
    explanation: Documents the late phase and its mortality.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis is molecular. The clinical picture, an early-infantile epileptic
    encephalopathy with progressive microcephaly, spasticity and brain atrophy,
    overlaps a large number of neurometabolic and neurodegenerative disorders and
    has no specific biomarker, so unbiased broad sequencing is the practical
    first-line test. A thorough metabolic workup is commonly (and reasonably)
    performed first to exclude treatable mimics, but it is normal in this
    disorder.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Biallelic pathogenic TRAPPC4 variants. In practice this is nearly always
    homozygosity for the recurrent splice variant NM_016146.5:c.454+3A>G;
    biallelic missense and in-frame/stop-loss alleles account for the remainder.
  presence: Diagnostic when biallelic pathogenic TRAPPC4 variants are identified
  evidence:
  - reference: PMID:42543852
    reference_title: A Case Report and a Review of TRAPPC4-Related TRAPPopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole exome sequencing revealed a homozygous splice-site variant (c.454+3A>G)
      in the TRAPPC4 gene, confirming the diagnosis of NEDESBA.
    explanation: Documents exome sequencing as the diagnostic route actually used.
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Before proceeding to next-generation sequencing, a thorough metabolic
      workup in order to exclude neurodegenerative diseases, which may present with
      a similar phenotype is advisable.
    explanation: Supports the described sequencing-after-metabolic-screen diagnostic pathway.
- name: Sanger Confirmation and Parental Segregation
  description: >-
    Targeted Sanger sequencing confirms the candidate variant and demonstrates
    biallelic inheritance by showing both parents to be heterozygous carriers,
    which is particularly important for a non-canonical splice-region variant
    whose pathogenicity is not self-evident from the DNA sequence alone.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Proband homozygous, both parents heterozygous for the familial TRAPPC4 allele.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Segregation analysis by Sanger sequencing showed both healthy parents
      were heterozygous for the same variant.
    explanation: Documents the Sanger segregation step in a reported diagnosis.
- name: RNA Analysis of the Splice Variant
  description: >-
    Transcript analysis (RT-PCR or RNA sequencing of patient fibroblasts) is the
    functional test that establishes pathogenicity of the recurrent
    splice-region allele. It is diagnostically valuable because a non-canonical
    +3 intronic variant can be filtered out or deprioritized by standard exome
    pipelines.
  diagnosis_term:
    preferred_term: RNA sequencing
    term:
      id: NCIT:C124261
      label: Whole Transcriptome Sequencing
  results: >-
    Reduced full-length TRAPPC4 transcript with partial exon 3 skipping and use
    of a downstream cryptic splice donor, generating a premature termination
    codon subject to nonsense-mediated decay.
  evidence:
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Based upon RNA sequencing, the variant resulted in partial exon 3 skipping
      and generation of an aberrant transcript owing to use of a downstream cryptic
      splice donor site, predicting a premature stop codon and nonsense mediated decay.
    explanation: The RNA-level finding that establishes pathogenicity of the splice allele.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Cranial MRI is the principal phenotyping investigation. It is supportive
    rather than diagnostic, but the combination of progressive cortical (and
    usually cerebellar) atrophy with enlarged subarachnoid spaces in an infant
    with severe microcephaly and early seizures is what should prompt TRAPPC4
    testing. Serial imaging is more informative than a single scan because it
    demonstrates progression.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Progressive cerebral cortical atrophy, cerebellar atrophy in most, enlarged
    subarachnoid spaces, white-matter volume loss and delayed myelination, thin
    corpus callosum, ventriculomegaly.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In patients presenting with severe microcephaly, typical dysmorphic facial
      features, early-onset seizures with very low voltage, abnormal EEG and progressive
      cortical atrophy, a TRAPPC4-related neurodevelopmental disorder should be considered
      in the differential diagnosis of neurodegenerative diseases.
    explanation: States the imaging-plus-clinical trigger for considering the diagnosis.
- name: Electroencephalography
  description: >-
    EEG documents the epilepsy and, over serial recordings, the progressive
    background voltage suppression that parallels cortical atrophy. Findings are
    supportive and non-specific.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: >-
    Epileptiform discharges with generalized disorganization; progressively very
    low voltage background in advanced disease.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Epileptiform abnormalities, generalized disorganization and very low voltage
      background activity are reported.
    explanation: Describes the EEG findings that the investigation yields.
differential_diagnoses:
- name: TRAPPC12-related encephalopathy (PEBAS)
  description: >-
    The closest phenotypic mimic within the TRAPPopathies. Biallelic TRAPPC12
    variants cause progressive childhood encephalopathy with severe disability,
    microcephaly, hearing loss, spasticity and progressive brain atrophy, an
    almost superimposable clinical description.
  disease_term:
    preferred_term: TRAPPC12-related encephalopathy
    term:
      id: MONDO:0044696
      label: early-onset progressive encephalopathy-hearing loss-pons hypoplasia-brain
        atrophy syndrome
  distinguishing_features:
  - 'Causal gene: TRAPPC12, a TRAPPIII-specific large subunit, not TRAPPC4, a small
    subunit of the shared core.'
  - Imaging in TRAPPC12 disease characteristically includes pontine hypoplasia, which
    is not a described feature of NEDESBA.
  - There is no single recurrent TRAPPC12 allele analogous to TRAPPC4 c.454+3A>G, so
    separation is by sequencing rather than by clinical examination.
  evidence:
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy
      and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The clinical phenotypes of the three individuals are strikingly similar:
      severe disability, microcephaly, hearing loss, spasticity, and characteristic
      brain imaging findings.'
    explanation: Documents the closely overlapping phenotype of the TRAPPC12 disorder.
  - reference: PMID:28777934
    reference_title: Mutations in TRAPPC12 Manifest in Progressive Childhood Encephalopathy
      and Golgi Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report that variants in TRAPPC12 result in progressive childhood
      encephalopathy.
    explanation: Establishes the distinct causal gene for this differential.
- name: TRAPPC6B-related neurodevelopmental disorder (NEDMEBA)
  description: >-
    Biallelic TRAPPC6B variants cause a neurodevelopmental disorder with
    microcephaly, epilepsy and autistic features, with cortical atrophy, thin
    corpus callosum and, in some, cerebellar and brainstem atrophy. Like NEDESBA
    it is a core-subunit TRAPPopathy caused by a founder splice mutation in a
    consanguineous population.
  disease_term:
    preferred_term: neurodevelopmental disorder with microcephaly, epilepsy, and brain
      atrophy
    term:
      id: MONDO:0060640
      label: neurodevelopmental disorder with microcephaly, epilepsy, and brain atrophy
  distinguishing_features:
  - 'Causal gene: TRAPPC6B, not TRAPPC4.'
  - The TRAPPC6B phenotype is substantially milder - affected individuals walk, have
    autistic features and ataxic gait, and survive into adulthood with only slow progression,
    whereas NEDESBA patients typically never walk or speak.
  - Zebrafish trappc6b morphants recapitulate the microcephaly and neuronal hyperexcitability;
    no comparable vertebrate model exists in the TRAPPC4 literature.
  evidence:
  - reference: PMID:28626029
    reference_title: A homozygous founder mutation in TRAPPC6B associates with a neurodevelopmental
      disorder characterised by microcephaly, epilepsy and autistic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified six individuals from three unrelated families with a founder
      homozygous splice mutation in TRAPPC6B, encoding a core subunit of the complex
      TRAPP I. Patients manifested a neurodevelopmental disorder characterised by microcephaly,
      epilepsy and autistic features, and showed splicing defect.
    explanation: >-
      Establishes the distinct gene and the overlapping but milder
      microcephaly-plus-epilepsy phenotype.
  - reference: PMID:28626029
    reference_title: A homozygous founder mutation in TRAPPC6B associates with a neurodevelopmental
      disorder characterised by microcephaly, epilepsy and autistic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Zebrafish trappc6b morphants replicated the human phenotype, displaying
      decreased head size and neuronal hyperexcitability, leading to a lower seizure
      threshold.
    explanation: >-
      Model-organism evidence specific to TRAPPC6B, which has no TRAPPC4
      counterpart and helps keep the two entities distinct.
- name: TRAPPC2L-related progressive encephalopathy with episodic rhabdomyolysis
  description: >-
    Biallelic TRAPPC2L variants cause neurodevelopmental delay with
    febrile-illness-induced encephalopathy and episodes of rhabdomyolysis,
    followed by developmental arrest, epilepsy and tetraplegia. The endpoint
    (developmental arrest, epilepsy, tetraplegia) closely resembles NEDESBA, and
    the muscle involvement reported in a subset of TRAPPC4 patients makes the
    overlap tighter still.
  disease_term:
    preferred_term: encephalopathy, progressive, early-onset, with episodic rhabdomyolysis
    term:
      id: MONDO:0032681
      label: encephalopathy, progressive, early-onset, with episodic rhabdomyolysis
  distinguishing_features:
  - 'Causal gene: TRAPPC2L, not TRAPPC4.'
  - TRAPPC2L disease is defined by discrete febrile-illness-triggered encephalopathic
    and rhabdomyolysis crises, which are not the pattern in NEDESBA, where creatine
    kinase elevation, when present, is persistent and is not the presenting event.
  - Mechanistically TRAPPC2L acts through TRAPPII and RAB11, whereas the TRAPPC4 defect
    is felt principally through the RAB1/TRAPPIII arm.
  evidence:
  - reference: PMID:30120216
    reference_title: Bi-allelic mutations in TRAPPC2L result in a neurodevelopmental
      disorder and have an impact on RAB11 in fibroblasts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: both of whom presented clinically with a similar phenotype that included
      neurodevelopmental delay, febrile illness-induced encephalopathy and episodes
      of rhabdomyolysis, followed by developmental arrest, epilepsy and tetraplegia
    explanation: Documents the overlapping endpoint and the distinguishing crisis pattern.
  - reference: PMID:30120216
    reference_title: Bi-allelic mutations in TRAPPC2L result in a neurodevelopmental
      disorder and have an impact on RAB11 in fibroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Since TRAPP II activates the GTPase RAB11, we examined the activation
      state of this protein and found increased levels of the active RAB, correlating
      with changes in its cellular morphology.
    explanation: >-
      Establishes the RAB11/TRAPPII mechanistic axis that distinguishes this
      TRAPPopathy from the RAB1/TRAPPIII-dominated TRAPPC4 disorder.
- name: TRAPPC11-related limb-girdle muscular dystrophy R18 and syndromic myopathy
  description: >-
    Biallelic TRAPPC11 variants cause a spectrum from pure limb-girdle muscular
    dystrophy to a syndromic myopathy with infantile hyperkinetic movements,
    ataxia and intellectual disability. It is the TRAPPopathy to consider when a
    child with a neurodevelopmental disorder has prominent muscle involvement and
    a high creatine kinase, exactly the situation created by the CK elevations
    reported in a subset of TRAPPC4 patients.
  disease_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy type R18
    term:
      id: MONDO:0014144
      label: autosomal recessive limb-girdle muscular dystrophy type R18
  distinguishing_features:
  - 'Causal gene: TRAPPC11, a TRAPPIII-specific large subunit, not TRAPPC4.'
  - Muscle disease is the primary and defining feature in TRAPPC11 disorders, whereas
    in NEDESBA the muscle findings are a secondary, inconsistent laboratory observation
    on a background of profound epileptic encephalopathy and brain atrophy.
  - TRAPPC11 patients do not show the progressive severe microcephaly with cortical
    and cerebellar atrophy that defines NEDESBA.
  evidence:
  - reference: PMID:23830518
    reference_title: Recessive TRAPPC11 mutations cause a disease spectrum of limb
      girdle muscular dystrophy and myopathy with movement disorder and intellectual
      disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we report the identification of mutations in transport protein particle
      complex 11 (TRAPPC11) in three individuals of a consanguineous Syrian family
      presenting with LGMD and in five individuals of Hutterite descent presenting with
      myopathy, infantile hyperkinetic movements, ataxia, and intellectual disability
    explanation: >-
      Establishes the muscle-dominant phenotype and distinct gene for this
      differential.
- name: TRAPPC9-related autosomal recessive intellectual disability 13
  description: >-
    Biallelic TRAPPC9 variants cause autosomal recessive intellectual disability
    with postnatal microcephaly and a thin corpus callosum. It shares the
    microcephaly-plus-intellectual-disability core with NEDESBA and is a
    frequently cited member of the TRAPPopathy differential.
  disease_term:
    preferred_term: intellectual disability, autosomal recessive 13
    term:
      id: MONDO:0013173
      label: intellectual disability, autosomal recessive 13
  distinguishing_features:
  - 'Causal gene: TRAPPC9, a TRAPPII-specific subunit, not TRAPPC4.'
  - The TRAPPC9 phenotype is a comparatively static intellectual disability with microcephaly
    and thin corpus callosum.
  - It lacks the early-onset epileptic encephalopathy, spastic tetraplegia, and relentlessly
    progressive cerebral and cerebellar atrophy that define NEDESBA.
  evidence:
  - reference: PMID:28626029
    reference_title: A homozygous founder mutation in TRAPPC6B associates with a neurodevelopmental
      disorder characterised by microcephaly, epilepsy and autistic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: intellectual disability with microcephaly (TrappC9 (MIM 611966); TRAPP
      II)
    explanation: >-
      Places TRAPPC9 in the TRAPPopathy differential with an
      intellectual-disability-with-microcephaly phenotype and identifies it as a
      TRAPPII subunit.
- name: Early-infantile neurodegenerative and neurometabolic mimics
  description: >-
    Before molecular diagnosis, NEDESBA is routinely mistaken for a
    neurometabolic disease. The reported differential includes early-onset
    epileptic encephalopathies, lysosomal storage disorders such as neuronal
    ceroid lipofuscinosis, mitochondrial encephalopathies, and the
    leukodystrophies (metachromatic leukodystrophy, Krabbe disease). In one
    reported infant a low biotin level even suggested biotinidase deficiency
    before enzymatic testing excluded it.
  distinguishing_features:
  - A thorough metabolic workup (plasma amino acids, acylcarnitines, urine organic
    acids, lysosomal enzymes, neuronal ceroid lipofuscinosis enzymes) is normal in
    NEDESBA.
  - Grey- versus white-matter predominance on MRI helps triage the mimics, but the
    definitive discriminator is biallelic TRAPPC4 variants on sequencing.
  evidence:
  - reference: PMID:36211171
    reference_title: 'Severe Microcephaly and Rapid Deterioration Due to Cortical Atrophy
      in Early Infancy: Consider TRAPPC4 Trappopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early-onset epileptic encephalopathies, lysosomal storage diseases, such
      as NCL, and mitochondrial encephalopathies present with prominent gray matter
      involvement, whereas white matter involvement occurs in disorders with demyelination,
      such as MLD and Krabbe disease.
    explanation: Enumerates the neurodegenerative mimics and how imaging helps triage them.
  - reference: PMID:42543852
    reference_title: A Case Report and a Review of TRAPPC4-Related TRAPPopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, confirmatory biochemical and enzymatic studies ruled out classic
      biotinidase deficiency.
    explanation: A worked example of a metabolic mimic misleading the initial workup.

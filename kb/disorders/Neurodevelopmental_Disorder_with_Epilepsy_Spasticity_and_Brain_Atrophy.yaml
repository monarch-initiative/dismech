notes: >-
  GeneReviews baseline: a PubMed search for a GeneReviews chapter on TRAPPC4,
  NEDESBA, or the TRAPPopathies returned no results, so no GeneReviews phenotype
  baseline was available for this entry. Phenotype coverage was instead
  cross-referenced against the two largest primary cohorts (PMID:31794024,
  PMID:32901138) and the literature review tabulated in PMID:34878169.
  Named-entity-confusion preflight: MONDO:0032894 was confirmed by OAK to carry
  OMIM:618741 and the RO:0004003 relationship to HGNC:19943 (TRAPPC4), and
  `just preflight-dr` on the falcon deep-research report returned PASS with 56
  TRAPPC4 mentions and no competing TRAPPC-family gene dominating the report.
  Every citation in this entry was individually checked to be TRAPPC4-specific,
  except the deliberately cross-family citations used in
  `differential_diagnoses`, where the sibling gene is named explicitly in the
  distinguishing_features text. Two cited papers (PMID:32125366, PMID:33011761)
  are Brain correspondence letters whose full text is not retrievable through
  the reference cache; they are listed under `references` for completeness but
  are deliberately not used as evidence snippets anywhere in the entry.
  Deliberate phenotype omissions: muscle wasting (HP:0003202) and joint
  contracture (HP:0001371) are plausible and are mentioned in secondary review
  syntheses, but no exact-quote snippet supporting either could be found in any
  cached reference for this entry, so neither is asserted as a phenotype. They
  are recorded here as candidates for a future pass if a citable primary source
  becomes available. The muscle axis that IS citable is captured as the elevated
  creatine kinase and elevated lactate phenotypes.

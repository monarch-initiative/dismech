    explanation: Direct biochemical demonstration of the complex-assembly defect.
  - reference: PMID:32116085
    reference_title: 'TRAPPing a neurological disorder: from yeast to humans.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This variant results in lower levels of full-length TRAPPC4 protein and
      the TRAPP complex.
    explanation: Independent restatement that both the subunit and the complex are reduced.
  - reference: PMID:32116085
    reference_title: 'TRAPPing a neurological disorder: from yeast to humans.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All TRAPP complexes contain four core subunits essential for cell viability,
      and until recently there were no human diseases associated with any core TRAPP
      subunit.
    explanation: >-
      Explains why complete loss of this core subunit is expected to be lethal and
      why only hypomorphic alleles are seen in patients.
- name: Impaired RAB1 Guanine Nucleotide Exchange Factor Activity
  description: >-
    The TRAPP complexes are Rab guanine-nucleotide-exchange factors: TRAPPIII
    activates RAB1 (the master regulator of the early secretory pathway and of
    the first step of macroautophagy) and TRAPPII activates RAB11. TRAPPC4 and
    its yeast orthologue Trs23 are among the essential subunits for the RAB1 GEF
    activity, and structural work localizes the exchange site to a conserved
    surface spanning several core subunits, so a destabilized core lowers
    exchange activity rather than abolishing a discrete catalytic site. Reduced
    RAB1 activation leaves less RAB1-GTP available on donor and acceptor
    membranes to recruit long coiled-coil tethers.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

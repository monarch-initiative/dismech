pathophysiology:
- name: Biallelic TRAPPC4 Loss of Function
  description: >-
    Biallelic pathogenic variants in TRAPPC4 (11q23.3; historical protein name
    synbindin) reduce the amount or function of TRAPPC4, one of the small core
    subunits shared by the TRAPPII and TRAPPIII complexes. The overwhelmingly
    predominant allele worldwide is the recurrent non-canonical splice variant
    NM_016146.5:c.454+3A>G (hg19:chr11:g.118890966A>G), found homozygously in
    almost every reported family, mostly in the setting of consanguinity. Single
    nucleotide polymorphism array analysis found no shared haplotype between a
    Turkish and a Caucasian family, favouring a recurrent mutational hotspot over
    a single ancient founder allele. A small number of families carry other
    biallelic alleles: novel missense variants c.191T>C p.(Leu64Pro) and
    c.278C>T p.(Pro93Leu) in two Indian families, and a biallelic in-frame
    deletion causing stop-loss in one family with a milder phenotype. Because the
    recurrent splice allele is leaky, residual correctly spliced transcript
    persists; complete loss of this essential core subunit is thought to be
    incompatible with survival.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:

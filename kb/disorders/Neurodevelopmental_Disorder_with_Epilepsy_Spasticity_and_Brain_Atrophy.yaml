- name: Cortical Network Hyperexcitability and Epileptic Encephalopathy
  description: >-
    Seizures are a defining feature and typically begin within the first six
    months of life, with onset in the first year in nearly all affected
    individuals. Semiology is varied: epileptic spasms, focal, tonic, atonic and
    generalized tonic-clonic seizures are all described. The
    electroencephalogram is not specific but shows epileptiform abnormalities,
    generalized disorganization and, in the more advanced cases, a strikingly low
    voltage background that tracks the cortical atrophy. Response to antiseizure
    medication is often only partial.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  cell_types:

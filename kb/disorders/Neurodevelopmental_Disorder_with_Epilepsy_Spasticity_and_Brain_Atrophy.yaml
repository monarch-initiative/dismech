- name: Progressive Cerebral and Cerebellar Neurodegeneration
  description: >-
    Neuroimaging converts this from a static developmental disorder into a
    neurodegenerative one. Brain MRI shows a variable but progressive degree of
    cerebral cortical atrophy that is more severe in older children, commonly
    accompanied by cerebellar atrophy, enlarged subarachnoid spaces, white-matter
    volume loss with delayed myelination, ventriculomegaly and a thin corpus
    callosum. Serial imaging in individual patients documents the progression
    directly: repeat scans within months can show new severe cortical atrophy.
    The progressive brain volume loss is also the substrate for the progressive
    postnatal microcephaly.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

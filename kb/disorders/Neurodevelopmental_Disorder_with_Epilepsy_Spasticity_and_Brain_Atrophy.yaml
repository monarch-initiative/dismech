- name: Neuronal Secretory and Autophagic Failure
  description: >-
    The step from a fibroblast phenotype to a brain phenotype is the least
    directly evidenced link in the chain and is currently a well-motivated
    hypothesis rather than a demonstrated fact. The proposal, advanced by the
    discovery group, is that a chronic low-grade autophagy defect is especially
    harmful to neurons, which are post-mitotic, long-lived and unusually
    dependent on membrane trafficking and proteostasis. A second,
    neuron-specific route is suggested by TRAPPC4/synbindin biology: through its
    atypical PDZ-like domain synbindin binds the cytoplasmic tail of syndecan-2,
    and the synbindin/syndecan complex participates in synaptic membrane
    trafficking and dendritic spine morphogenesis, so reduced TRAPPC4 may also
    impair synapse formation and maturation directly. Neither route has been
    tested in patient-derived neurons.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:

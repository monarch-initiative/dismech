- name: Defective Autophagosome Formation and Autophagic Flux
  description: >-
    The second and, on current evidence, more severe cellular consequence is a
    macroautophagy defect. Patient fibroblasts have a basal autophagy defect and
    a delay in autophagic flux, attributed to autophagosomes that fail to seal.
    The same dissociation is reproduced in a yeast trs23 temperature-sensitive
    model, which shows constitutive and stress-induced autophagic defects at the
    permissive temperature while the secretory defect appears only at the
    restrictive temperature, i.e. autophagy is the more dosage-sensitive output
    of the core TRAPP complex.

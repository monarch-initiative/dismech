inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (usually homozygous) TRAPPC4 variants are required. Most reported
    families are consanguineous and homozygous for the recurrent c.454+3A>G
    splice variant; heterozygous carriers are clinically unaffected and the
    carrier frequency of that allele in healthy individuals is on the order of a
    few per 10,000.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:42543852
    reference_title: A Case Report and a Review of TRAPPC4-Related TRAPPopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurodevelopmental disorder with spasticity, epilepsy and brain atrophy
      (NEDESBA) is a rare autosomal recessive condition, first described in 2020.
    explanation: States the autosomal recessive mode of inheritance directly.
  - reference: PMID:31794024
    reference_title: Deficiencies in vesicular transport mediated by TRAPPC4 are associated
      with severe syndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All seven affected subjects shared the same identical rare, homozygous,
      potentially pathogenic variant in a non-canonical, well-conserved splice site
      within TRAPPC4
    explanation: >-
      Homozygosity in all affected children of three unrelated families, with
      unaffected heterozygous parents, establishes recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence study exists. The founding report
    described seven children from three unrelated families (2020); a subsequent
    multicentre series added 23 patients from 17 independent families (2021), and
    by 2022 a review counted 33 individuals from 22 families. Later case reports
    have added a small number of further patients. Published counts overlap
    substantially between cohorts and must not be summed as independent cases.
  evidence:

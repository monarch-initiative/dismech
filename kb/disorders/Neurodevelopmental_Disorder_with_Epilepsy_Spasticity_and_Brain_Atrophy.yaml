    explanation: >-
      Supports the description of the recurrent allele as a mutational hotspot
      rather than a proven founder variant.
  - reference: PMID:34878169
    reference_title: Further evidence of muscle involvement in neurodevelopmental disorder
      with epilepsy, spasticity, and brain atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report three individuals from two Indian families harboring novel
      bi-allelic missense variants c.191T>C and c.278C>T (NM_016146.6) in TRAPPC4
      with classic clinical presentation in one and milder and later onset in the
      other family.
    explanation: >-
      Documents pathogenic TRAPPC4 alleles other than the recurrent splice
      variant, showing the mechanism is gene-level rather than allele-specific.
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No other clinically relevant TRAPPC4 variants were identified among any
      of over 10,000 patients with neurodevelopmental conditions.
    explanation: >-
      Shows how strongly the reported allelic spectrum is dominated by the single
      recurrent splice variant.
- name: Aberrant TRAPPC4 Pre-mRNA Splicing and Transcript Loss
  description: >-
    The c.454+3A>G variant lies in the intron 3 splice donor region. RNA studies
    in patient cells show that it is an incompletely penetrant (leaky) splice
    defect: full-length TRAPPC4 transcript is reduced while a shorter transcript
    lacking exon 3 accumulates. RNA sequencing further resolved partial exon 3
    skipping plus use of a downstream cryptic splice donor site, producing an
    aberrant transcript with a premature termination codon that is predicted to
    be degraded by nonsense-mediated decay. The net effect is a dosage reduction
    of normal TRAPPC4 protein rather than production of a dominant-negative
    product.
  biological_scale: MOLECULAR

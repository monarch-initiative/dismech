genetic:
- name: TRAPPC4
  gene_term:
    preferred_term: TRAPPC4
    term:
      id: hgnc:19943
      label: TRAPPC4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    TRAPPC4 (aliases SBDN, synbindin, TRS23) lies at 11q23.3 and encodes one of
    the small core subunits shared by the TRAPPII and TRAPPIII complexes. The
    allelic spectrum is unusually narrow. The recurrent non-canonical splice
    variant NM_016146.5:c.454+3A>G (hg19:chr11:g.118890966A>G;
    hg38:11:119020256 A>G; ClinVar VCV000812649.1) accounts for 31 of 33
    reported individuals from 21 of 22 families, almost always homozygous and
    usually in a consanguineous setting; a screen of over 10,000 patients with
    neurodevelopmental conditions found no other clinically relevant TRAPPC4
    variant. The remaining reported alleles are two novel homozygous missense
    variants in Indian families, c.191T>C p.(Leu64Pro) and c.278C>T p.(Pro93Leu)
    (both predicted to destabilize the protein), and a biallelic in-frame
    deletion causing stop-loss in one family with a milder, later-onset
    phenotype and normal head circumference. All are hypomorphic: complete loss
    of this essential core subunit is thought to be incompatible with survival.
    Penetrance: every reported homozygote for c.454+3A>G has been clinically
    affected, so penetrance appears complete for that genotype; heterozygous
    carriers are unaffected. Penetrance across the wider (very small) allelic
    spectrum is not established, and no unaffected homozygote has been described.
    The residual level of correctly spliced transcript is the presumed determinant
    of both viability and severity, but this has not been measured against
    clinical severity in a patient series.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31794024
    reference_title: Deficiencies in vesicular transport mediated by TRAPPC4 are associated
      with severe syndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is the first report of a TRAPPC4 variant, and our findings add to
      the growing number of TRAPP-associated neurological disorders.
    explanation: The founding gene-disease association.
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data confirm the pathogenicity of the TRAPPC4 c.454+3A>G variant,
      and refine the clinical presentation of TRAPPC4-related encephalopathy.
    explanation: Independent multicentre confirmation of the gene-disease relationship.
  - reference: PMID:34878169
    reference_title: Further evidence of muscle involvement in neurodevelopmental disorder
      with epilepsy, spasticity, and brain atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: of the 33 individuals from 22 families reported to date, 31 individuals
      from 21 families have been reported with a recurrent homozygous pathogenic variant
    explanation: Quantifies how strongly the allelic spectrum is dominated by one variant.
  - reference: PMID:34878169
    reference_title: Further evidence of muscle involvement in neurodevelopmental disorder
      with epilepsy, spasticity, and brain atrophy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Further, I-Mutant also predicts the decreased stability of the mutant
      protein
    explanation: >-
      In silico stability prediction supporting the destabilizing effect of the
      p.(Leu64Pro) missense allele; classified COMPUTATIONAL because it is a
      prediction, not a measurement.

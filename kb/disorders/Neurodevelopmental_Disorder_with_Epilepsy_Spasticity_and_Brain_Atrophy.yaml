- name: Arrest of Psychomotor Development with Regression
  description: >-
    The organism-level outcome is a profound, essentially complete arrest of
    psychomotor development, with loss of the few milestones that were attained.
    Affected children do not walk or speak, cannot feed themselves and develop
    feeding difficulties and failure to thrive, and remain profoundly dependent.
    Because the substrate is a degenerative process superimposed on a
    developmental one, the trajectory is one of stagnation followed by decline
    rather than of slow ongoing gains. Death in the first decade, most often from
    intercurrent infection, is reported in a minority.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32901138
    reference_title: A relatively common homozygous TRAPPC4 splicing variant is associated
      with an early-infantile neurodegenerative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report 23 patients from 17 independent families with an early-infantile-onset
      neurodegenerative presentation
    explanation: Frames the disorder as an early-infantile neurodegenerative presentation.

- name: Impaired ER-to-Golgi Vesicular Tethering and Golgi Transit
  description: >-
    The functional consequence in patient cells is a secretory-pathway defect.
    Using the temperature-sensitive Golgi cargo marker VSVG-GFP-ts045, patient
    fibroblasts show significantly delayed entry into and exit from the Golgi
    apparatus. The defect is a direct consequence of reduced TRAPPC4 dosage
    rather than of an unrelated cellular abnormality, because lentiviral
    expression of wild-type TRAPPC4 in the same fibroblasts restores normal
    trafficking. Relative to the autophagy arm below, the secretory defect is the
    milder of the two.

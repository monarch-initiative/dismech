  preferred_term: gastric adenocarcinoma
  term:
    id: MONDO:0005036
    label: gastric adenocarcinoma

notes: >-
  Scope and boundaries with neighbouring dismech entries. This entry is the histologic
  parent concept (MONDO:0005036) and is deliberately kept distinct from four existing
  aspect-specific gastric entries, none of which carries MONDO:0005036:
  `Gastric_Cancer_H_pylori_Associated` (the infectious-etiology view),
  `HER2_Positive_Gastric_Cancer` (a biomarker-defined therapeutic subset),
  `EBV_Associated_Gastric_Cancer` (one TCGA molecular class curated in depth), and
  the former `Metastatic_Gastric_Cancer` entry, whose advanced-stage view was
  folded into this entry's Metastatic stage (design decisions §3a). This entry
  models the shared mechanism graph and the two Lauren routes.

  LUMP/SPLIT CAVEAT REQUIRING HUMAN ADJUDICATION (@cmungall). There IS real mechanistic
  overlap with `Gastric_Cancer_H_pylori_Associated`, which already models CagA
  signalling, VacA injury, the Correa cascade, atrophic gastritis, intestinal metaplasia
  and CDH1/E-cadherin loss. Route A of this entry re-derives much of that chain. The
  case for this entry is that MONDO:0005036 was unclaimed, and that the TCGA molecular
  axis, the HDGC arm and the modern biomarker-gated therapeutic axis are genuinely new.
  But the alternative resolution - trimming the aspect-specific entries and redirecting
  them here - is equally defensible and should be decided by a human curator rather than
  unilaterally.

  Gastric MALT lymphoma is NOT a variant of gastric adenocarcinoma. Both are driven by
  chronic H. pylori infection, but MALT lymphoma is a B-cell lymphoma of
  mucosa-associated lymphoid tissue (`MALT_Lymphoma`, MONDO:0007650) with a distinct
  cell of origin, distinct genetics (t(11;18) API2-MALT1) and a distinct primary
  treatment (H. pylori eradication alone can induce remission). It is modelled here
  only as a differential diagnosis.

  Gastroesophageal junction (GEJ) adenocarcinoma is a deliberate boundary case. Most of
  the pivotal systemic-therapy trials cited here (ToGA, FLOT4, SPOTLIGHT, KEYNOTE-859,
  FIGHT) enrolled gastric AND GEJ adenocarcinoma together, so the treatment evidence is
  quoted as the trials framed it rather than being silently narrowed to pure gastric
  disease. Mechanistically, however, distal/non-cardia gastric adenocarcinoma is
  H. pylori-driven whereas GEJ and cardia tumours track with obesity and reflux and
  overlap the Barrett-derived biology curated in `Esophageal_Adenocarcinoma`. GEJ
  adenocarcinoma has its own MONDO term (MONDO:0003219) and is treated here as a
  differential diagnosis, not a subtype.

  The Lauren axis and the TCGA axis are NOT interchangeable and must not be collapsed
  into a single subtype list. They are cross-cutting: the genomically stable (GS)
  molecular class is *enriched for* - but not equivalent to - diffuse histology, and
  EBV-positive, MSI and CIN tumours each span multiple Lauren types. `has_subtypes`
  therefore carries both axes with distinct `classification` values
  (`histological_lauren` vs `molecular_tcga`), plus a separate `hereditary` axis.

  Ontology gaps encountered during curation (worth reporting upstream). (1) NCIT:C3190 "Linitis Plastica" exists but sits
  under "Finding by Site or System", not under the histopathology branch, so it is not
  bindable as a `finding_term`; linitis plastica is instead captured in the
  "Diffuse Infiltrative Growth and Linitis Plastica" pathophysiology node. Arguably
  correct, since linitis plastica is a macroscopic rather than microscopic finding.
  (The HPO term HP:0020168 "Tumor signet ring cell" is likewise outside the
  `HistopathologyFindingTerm` reachable set, but NCIT:C5250 "Gastric Signet Ring Cell
  Adenocarcinoma" IS reachable via NCIT:C4741 and is used here, so signet-ring cytology
  is not a gap.) (2) Five subtypes carry no `subtype_term` because MONDO has no corresponding class:
  mixed-type gastric adenocarcinoma, and all four TCGA molecular classes (EBV-positive,
  MSI, genomically stable, chromosomal instability). This is a real MONDO gap rather
  than a curation omission - the `test_subtypes_have_disease_term` warning on this file
  is therefore expected. The Intestinal, Diffuse and HDGC subtypes are all bound.


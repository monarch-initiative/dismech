histopathology:
- name: Intestinal Metaplasia of Gastric Mucosa
  description: >-
    Replacement of gastric mucosal epithelium by intestinal-type epithelium with goblet
    cells. The defining precancerous lesion of the intestinal (Correa) route and the
    histologic finding that triggers endoscopic surveillance.
  finding_term:
    preferred_term: Intestinal Metaplasia of Gastric Mucosa
    term:
      id: NCIT:C3956
      label: Intestinal Metaplasia of Gastric Mucosa
  diagnostic: false
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic gastritis; atrophy; intestinal metaplasia; and dysplasia"
    explanation: >-
      Establishes intestinal metaplasia as a defined histologic stage of the human
      gastric carcinogenesis sequence.
- name: Gastric Dysplasia
  description: >-
    Unequivocally neoplastic non-invasive epithelium, graded low or high. High-grade
    dysplasia is the immediate precursor of invasive carcinoma and an indication for
    endoscopic resection.
  finding_term:
    preferred_term: Gastric Dysplasia
    term:
      id: NCIT:C95754
      label: Gastric Dysplasia
  diagnostic: false
  evidence:

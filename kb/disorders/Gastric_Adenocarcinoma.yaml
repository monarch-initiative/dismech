    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia"
    explanation: >-
      Places dysplasia as the final preinvasive histologic stage of the Correa sequence.
- name: Poorly Cohesive Growth Pattern
  description: >-
    Malignant cells infiltrating singly or in tiny aggregates rather than forming
    glands - the architectural hallmark of diffuse-type (poorly cohesive) carcinoma in
    the current WHO scheme and the direct histologic readout of E-cadherin loss.
  finding_term:
    preferred_term: Poorly Cohesive Malignant Cellular Infiltrate
    term:
      id: NCIT:C95744

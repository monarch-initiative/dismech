name: Gastric Adenocarcinoma
creation_date: "2026-08-01T07:20:00Z"
description: >-
  Gastric adenocarcinoma is a malignant gland-forming epithelial neoplasm arising from
  the glandular epithelium of the stomach. It is the dominant histology of gastric
  cancer (approximately 90% of cases) and a leading global cause of cancer death.
  It is not one disease mechanistically. Two largely distinct routes converge on the
  same organ: the intestinal-type Correa cascade, in which chronic Helicobacter pylori
  gastritis drives atrophic gastritis, intestinal metaplasia, dysplasia and finally
  invasive carcinoma; and the diffuse-type route, in which loss of the CDH1-encoded
  adherens-junction protein E-cadherin produces poorly cohesive, signet-ring-cell,
  infiltrative tumours that present younger and carry a worse prognosis. Superimposed
  on this histologic (Lauren) axis is the orthogonal TCGA molecular classification -
  Epstein-Barr-virus-positive, microsatellite-instable, genomically stable and
  chromosomally unstable - which carries the direct therapeutic implications. Modern
  management is biomarker-gated on HER2, PD-L1 CPS, MMR/MSI and claudin-18.2.
categories:
- Gastrointestinal Cancer
- Gastric Cancer
- Adenocarcinoma
- Solid Tumor
parents:
- gastric carcinoma
- adenocarcinoma
synonyms:
- stomach adenocarcinoma
- adenocarcinoma of the stomach
- gastric (stomach) adenocarcinoma
- STAD

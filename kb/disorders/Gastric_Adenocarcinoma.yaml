- name: Signet Ring Cell Morphology
  description: >-
    The characteristic cytology of the diffuse type: tumour cells distended by
    intracytoplasmic mucin that displaces the nucleus to the cell periphery, producing a
    signet-ring outline. Signet-ring foci are near-universal as pT1a lesions in
    prophylactic gastrectomy specimens from germline CDH1 carriers, where the behaviour
    of any individual focus is unpredictable.
  finding_term:
    preferred_term: Gastric Signet Ring Cell Adenocarcinoma
    term:
      id: NCIT:C5250
      label: Gastric Signet Ring Cell Adenocarcinoma
  frequency: VERY_FREQUENT
  subtype: HDGC
  diagnostic: false
  evidence:
  - reference: PMID:39379994
    reference_title: "Current advances and challenges in Managing Hereditary Diffuse Gastric Cancer (HDGC): a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "almost every PTG specimen shows the presence of small low-stage (pT1a) signet ring cell (SRC) lesions of which the behaviour is unpredictable but often are considered indolent or premalignant stages of DGC"
    explanation: >-
      "Almost every" prophylactic total gastrectomy specimen maps to the VERY_FREQUENT
      band; the frequency is scoped to the HDGC subtype, where the quantitative claim
      was made, not to gastric adenocarcinoma overall.

biochemical:
- name: HER2 (ERBB2) Overexpression or Amplification
  notes: >-
    Assessed by immunohistochemistry with reflex in-situ hybridisation for equivocal
    (2+) cases. Positive in roughly 15-20% of gastric and gastroesophageal junction
    adenocarcinomas, enriched in intestinal-type and junctional tumours. Expression is
    notoriously heterogeneous within a tumour, so adequate tissue sampling matters.
    A mandatory first-line decision biomarker.
  biomarker_term:
    preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  evidence:
  - reference: PMID:39409957
    reference_title: "Systemic Therapy of Gastric Cancer-State of the Art and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is essential to determine biomarkers such as HER2 expression, PD-L1 combined positive score (CPS) (combined positive score), Claudin 18.2, and microsatellite instability (MSI)"
    explanation: >-
      Establishes HER2 as one of the four essential biomarkers determining therapy
      selection in advanced gastric adenocarcinoma.
- name: PD-L1 Combined Positive Score (CPS)
  notes: >-
    Immunohistochemical score counting PD-L1-staining tumour cells, lymphocytes and
    macrophages relative to total viable tumour cells. Assay- and
    jurisdiction-specific thresholds (commonly CPS >= 1, >= 5 or >= 10) gate access to
    first-line checkpoint blockade; benefit in KEYNOTE-859 was greater at higher CPS.
  biomarker_term:
    preferred_term: CD274
    term:
      id: hgnc:17635
      label: CD274
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in tumor cells, lymphocytes, and macrophages relative to the total number of viable tumor cells, and is expressed as a score."
    explanation: >-
      Defines exactly what the PD-L1 combined positive score counts, as curated here.
- name: Mismatch Repair / Microsatellite Instability Status
  notes: >-
    Determined by immunohistochemistry for MLH1, PMS2, MSH2 and MSH6, and/or by PCR or
    NGS microsatellite testing. dMMR/MSI-H tumours are strongly immunotherapy-sensitive
    and, when germline, indicate Lynch syndrome and trigger cascade testing.
  biomarker_term:
    preferred_term: MLH1
    term:
      id: hgnc:7127
      label: MLH1
  evidence:
  - reference: PMID:38160327
    reference_title: "The Chinese Society of Clinical Oncology (CSCO): Clinical guidelines for the diagnosis and treatment of gastric cancer, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "updated management strategies for human epidermal growth factor receptor 2 (HER2)-positive and deficient DNA mismatch repair (dMMR)/microsatellite instability-high (MSI-H) patients"
    explanation: >-
      Guideline confirmation that dMMR/MSI-H status directs distinct management in
      gastric cancer.
- name: Claudin-18.2 (CLDN18.2) Expression
  notes: >-
    Tight-junction protein whose stomach-specific isoform 2 is retained and becomes
    surface-exposed in a large fraction of gastric adenocarcinomas while normal-tissue
    expression is confined to short-lived differentiated gastric mucosal epithelium -
    an unusually clean therapeutic window. Trial-validated positivity is >= 75% of
    tumour cells with moderate-to-strong membranous staining; this threshold gates
    zolbetuximab eligibility.
  biomarker_term:
    preferred_term: CLDN18
    term:
      id: hgnc:2039
      label: CLDN18
  evidence:
  - reference: PMID:37068504
    reference_title: "Zolbetuximab plus mFOLFOX6 in patients with CLDN18.2-positive, HER2-negative, untreated, locally advanced unresectable or metastatic gastric or gastro-oesophageal junction adenocarcinoma (SPOTLIGHT): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLDN18.2-positive (defined as ≥75% of tumour cells showing moderate-to-strong membranous CLDN18 staining)"
    explanation: >-
      Gives the exact trial-validated CLDN18.2 positivity threshold curated here.

genetic:
- name: CDH1
  notes: >-
    Tumour suppressor encoding E-cadherin. Germline inactivating variants cause
    hereditary diffuse gastric cancer; somatic biallelic inactivation (frequently via
    promoter hypermethylation) underlies sporadic diffuse-type disease. Truncating
    variants are readily classifiable; missense variants often remain VUS without
    functional or segregation data.
  gene_term:
    preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: HDGC
  evidence:
  - reference: PMID:9537325
    reference_title: "E-cadherin germline mutations in familial gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe the identification of the gene responsible for early-onset, histologically poorly differentiated, high grade, diffuse gastric cancer in a large kindred from New Zealand (Aotearoa)."
    explanation: >-
      The original identification of CDH1 as the hereditary diffuse gastric cancer gene.
  - reference: PMID:40998418
    reference_title: "Hereditary diffuse gastric cancer spectrum associated with germline CTNNA1 loss of function revealed by clinical and molecular data from 351 carrier families and over 37 000 non-carrier controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with wild-type individuals, GC risk is 7-fold higher in CTNNA1-truncating and 38-fold higher in CDH1-truncating variant carriers."
    explanation: >-
      Quantifies the 38-fold gastric cancer risk of CDH1 truncating variants against
      population controls, and calibrates it against CTNNA1.
- name: CTNNA1
  notes: >-
    Encodes alpha-E-catenin, which links E-cadherin to the actin cytoskeleton. Germline
    truncating variants cause a moderate-penetrance HDGC phenotype through
    nonsense-mediated decay of the transcript. Accounts for under 2% of HDGC families;
    gastric cancer risk is roughly fivefold lower than for CDH1, which is why
    management (surveillance versus prophylactic gastrectomy) is not simply
    transplanted from CDH1.
  gene_term:
    preferred_term: CTNNA1
    term:
      id: hgnc:2509
      label: CTNNA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: HDGC
  evidence:
  - reference: PMID:40998418
    reference_title: "Hereditary diffuse gastric cancer spectrum associated with germline CTNNA1 loss of function revealed by clinical and molecular data from 351 carrier families and over 37 000 non-carrier controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that compared with CDH1, CTNNA1 is a moderate penetrance HDGC gene."
    explanation: >-
      The key calibration statement establishing CTNNA1 as moderate- rather than
      high-penetrance, which is what makes its management distinct from CDH1.
  - reference: PMID:40998418
    reference_title: "Hereditary diffuse gastric cancer spectrum associated with germline CTNNA1 loss of function revealed by clinical and molecular data from 351 carrier families and over 37 000 non-carrier controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DGC risk is eightfold higher in truncating, compared with non-truncating carriers."
    explanation: >-
      Establishes that only truncating CTNNA1 variants carry substantial diffuse gastric
      cancer risk - a variant-type distinction that matters for clinical reporting.
- name: RHOA
  notes: >-
    Small GTPase recurrently mutated at Tyr42, Arg5 and Gly17 in about a quarter of
    diffuse-type gastric carcinomas, acting in a gain-of-function manner. Defines part
    of the genomically stable TCGA class and is specific to diffuse histology. Not yet
    directly druggable.
  gene_term:
    preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Diffuse
  evidence:
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparison of mutational profiles for the major gastric cancer subtypes showed that RHOA mutations occur specifically in DGCs"
    explanation: >-
      Establishes the histology specificity of RHOA mutation to diffuse gastric
      carcinoma, supporting its placement on the diffuse route only.
- name: ERBB2
  notes: >-
    Receptor tyrosine kinase amplified or overexpressed in roughly 15-20% of gastric and
    gastroesophageal junction adenocarcinomas, concentrated in the chromosomal
    instability class. The first successfully drugged target in this disease.
  gene_term:
    preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: CIN
  evidence:
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with gastric or gastro-oesophageal junction cancer were eligible for inclusion if their tumours showed overexpression of HER2 protein by immunohistochemistry or gene amplification by fluorescence in-situ hybridisation."
    explanation: >-
      Defines the HER2 overexpression/amplification lesion as a tumour-intrinsic,
      therapeutically actionable alteration in gastric adenocarcinoma.
- name: FGFR2
  notes: >-
    Receptor tyrosine kinase whose FGFR2b isoform is overexpressed in a minority of
    gastric adenocarcinomas, most often through FGFR2 amplification within the
    chromosomal instability class. Target of bemarituzumab.
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: CIN
  evidence:
  - reference: PMID:36244398
    reference_title: "Bemarituzumab in patients with FGFR2b-selected gastric or gastro-oesophageal junction adenocarcinoma (FIGHT): a randomised, double-blind, placebo-controlled, phase 2 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "910 patients were screened and 155 were randomly assigned to the bemarituzumab"
    explanation: >-
      The 910-screened-to-155-enrolled ratio quantifies how small the
      FGFR2b-overexpressing subset of gastric adenocarcinoma is.
- name: MLH1
  notes: >-
    Mismatch repair gene. Sporadic MSI-high gastric cancer arises chiefly through MLH1
    promoter hypermethylation; germline pathogenic variants cause Lynch syndrome. MLH1
    loss on immunohistochemistry is the usual entry point to MSI testing.
  gene_term:
    preferred_term: MLH1
    term:
      id: hgnc:7127
      label: MLH1
  relationship_type: CAUSATIVE
  subtype: MSI
  evidence:
  - reference: PMID:31337882
    reference_title: "Cancer risks by gene, age, and gender in 6350 carriers of pathogenic mismatch repair variants: findings from the Prospective Lynch Syndrome Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic MLH1 and MSH2 variants caused high penetrance dominant cancer syndromes"
    explanation: >-
      Establishes MLH1 (with MSH2) as a high-penetrance dominant cancer-predisposition
      gene, the Lynch route into gastric adenocarcinoma.
- name: MSH2
  notes: >-
    Mismatch repair gene. Within Lynch syndrome, MSH2 carriers specifically carry
    elevated upper gastrointestinal cancer risk with age - the gene most relevant to the
    Lynch contribution to gastric adenocarcinoma. See the `Lynch_Syndrome` entry for the
    full syndromic context.
  gene_term:
    preferred_term: MSH2
    term:
      id: hgnc:7325
      label: MSH2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MSI
  evidence:
  - reference: PMID:31337882
    reference_title: "Cancer risks by gene, age, and gender in 6350 carriers of pathogenic mismatch repair variants: findings from the Prospective Lynch Syndrome Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "older MSH2 carriers had higher risk of cancers of the upper urinary tract, upper gastrointestinal tract, brain, and particularly prostate"
    explanation: >-
      Prospective evidence that upper gastrointestinal (including gastric) cancer risk in
      Lynch syndrome is concentrated in older MSH2 carriers.
- name: SMAD4
  notes: >-
    Juvenile polyposis syndrome gene. Gastric polyposis and gastric malignancy in
    juvenile polyposis are specifically associated with SMAD4, not with BMPR1A - a
    genotype-phenotype distinction with direct surveillance consequences, since it means
    gastric surveillance is warranted in SMAD4 carriers but is not supported by the
    published BMPR1A phenotype.
  gene_term:
    preferred_term: SMAD4
    term:
      id: hgnc:6770
      label: SMAD4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:37400896
    reference_title: "Genotype-phenotype correlation of BMPR1a disease causing variants in juvenile polyposis syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike in SMAD4 carriers, gastric polyposis and malignancy were not identified in our review in BMPR1a carriers"
    explanation: >-
      Establishes that within juvenile polyposis the gastric cancer risk is
      SMAD4-specific, preventing the common overstatement that juvenile polyposis as a
      whole confers gastric risk. Support is PARTIAL because this is a BMPR1A-focused
      study and the SMAD4 association is carried by the negative finding in its
      comparator arm rather than measured directly.
- name: ARID1A
  notes: >-
    Chromatin-remodelling (SWI/SNF) tumour suppressor, among the most frequently mutated
    genes in gastric adenocarcinoma overall and strongly enriched in the EBV-positive and
    MSI classes. Loss remodels chromatin and cooperates with the epigenetic
    reprogramming modelled on the EBV node.
  gene_term:
    preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: EBV-positive
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EBV-positive tumours had frequent ARID1A (55%) and BCOR (23%) mutations and only rare TP53 mutations."
    explanation: >-
      Quantifies ARID1A mutation in 55% of EBV-positive gastric adenocarcinomas and
      contrasts the near-absence of TP53 mutation in that class with its dominance in CIN.
- name: PIK3CA
  notes: >-
    Recurrently mutated in EBV-positive gastric adenocarcinoma, where it is one of the
    three defining molecular features alongside extreme hypermethylation and PD-L1/L2
    amplification.
  gene_term:
    preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: EBV-positive
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations"
    explanation: >-
      TCGA identifies recurrent PIK3CA mutation as a defining feature of EBV-positive
      gastric adenocarcinoma.
- name: TP53
  notes: >-
    The most frequently mutated gene in gastric adenocarcinoma overall and near-universal
    in the chromosomal instability class, where loss of p53 checkpoint control permits
    the tolerated aneuploidy that defines the class.
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: CIN
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the CIN tumours, we observed TP53 mutations in 71% of tumours."
    explanation: >-
      Directly quantifies TP53 mutation in 71% of chromosomally unstable gastric
      adenocarcinomas, the permissive lesion for the tolerated aneuploidy that defines
      the class.

environmental:
- name: Helicobacter pylori infection
  exposure_term:
    preferred_term: exposure to Helicobacter pylori
    term:
      id: ECTO:3000003
      label: exposure to Helicobacter pylori
  influences_mechanisms:
  - target: Helicobacter pylori Chronic Active Gastritis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The organism colonises the gastric mucosa and the chronic active
      gastritis at this node is its direct consequence, the first step of the
      Correa cascade. Nothing intervenes between the infection and the
      gastritis it causes.
    evidence:
    - reference: PMID:1458460
      reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori."
      explanation: >-
        Correa links the initial stages of gastritis and atrophy to
        Helicobacter pylori infection by name, which is this node's own
        process rather than the cancer at the end of the cascade.
    - reference: PMID:36483973
      reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Helicobacter pylori is a Gram-negative bacterium that inhabits the gastric environment of 60.3% of the world's population and represents the main risk factor for the onset of gastric neoplasms."
      explanation: >-
        The full sentence, which names the organism rather than starting after
        the subject. Partial because it reaches the onset of gastric neoplasms,
        the disease at the end of the cascade, and not the gastritis node this
        link targets.
  description: >-
    The dominant modifiable cause and the main risk factor for gastric neoplasia, present
    in roughly 60% of the world's population. Widely cited attributable-fraction
    estimates put close to 90% of non-cardia gastric adenocarcinoma down to H. pylori,
    and IARC classifies it a Group 1 carcinogen; neither the 90% figure nor the IARC
    classification is snippet-quotable from the sources cited in this entry, so both are
    reported as context rather than as evidenced claims. Eradication reduces incidence,
    most effectively before advanced atrophy and metaplasia develop.
  evidence:
  - reference: PMID:39004993
    reference_title: '[Advances in the application of intragastric flora in the diagnosis and treatment of gastric cancer].'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Gastric cancer is one of the major causes of cancer-related deaths worldwide, and infection with Helicobacter pylori and EBV, smoking and a salt-heavy diet have been shown to be risk factors for the development of gastric cancer.
    explanation: This review abstract identifies H. pylori infection as an established upstream risk factor for gastric cancer, which precedes metastatic disease.
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Helicobacter pylori is a Gram-negative bacterium that inhabits the gastric environment of 60.3% of the world's population and represents the main risk factor for the onset of gastric neoplasms."
    explanation: >-
      Establishes H. pylori as the principal risk factor for gastric neoplasia.
- name: High dietary salt and salt-preserved foods
  exposure_term:
    preferred_term: high dietary sodium chloride exposure
    modifier: INCREASED
    term:
      id: ECTO:9001347
      label: exposure to sodium chloride
  influences_mechanisms:
  - target: Helicobacter pylori Chronic Active Gastritis
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Excess salt injures the gastric mucosa and makes it a more hospitable
      surface for Helicobacter colonisation. Mucosal injury and the enhanced
      colonisation that follows are the intervening steps, and neither is a
      node in this graph, so the intermediates are recorded as known rather
      than the link as direct. Recorded as exacerbating rather than
      triggering, in contrast to the infection link into this same node,
      because salt worsens a gastritis it does not by itself cause.
    evidence:
    - reference: PMID:1458460
      reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori."
      explanation: >-
        The same Correa sentence names excessive salt intake alongside the
        infection as linked to the initial gastritis and atrophy stages, which
        is the node this link targets.
  description: >-
    High sodium intake and consumption of salt-preserved and nitrosated foods damage the
    gastric mucosa, potentiate H. pylori colonisation, and supply nitrosating precursors
    - contributing at both the initiating and the later stages of the Correa cascade.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The final stages have been linked with the supply of beta-carotene and with excessive salt intake."
    explanation: >-
      Correa implicates excessive salt intake at the final stages of gastric
      carcinogenesis; the same abstract separately links the initial gastritis/atrophy
      stages to salt, quoted on the H. pylori gastritis node.
- name: Tobacco smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Gastric Intestinal Metaplasia
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking raises the odds that an atrophic mucosa has progressed to intestinal
      metaplasia, the step of the Correa cascade at which the mucosa commits to the
      metaplastic route. The Wuwei cohort resolved risk factors stage by stage and
      placed smoking specifically at the atrophy-to-metaplasia transition, but reports
      an adjusted association rather than a mechanistic route, so the intermediates are
      unknown. Recorded as predisposing rather than exacerbating for the same reason.
    evidence:
    - reference: PMID:36713177
      reference_title: "Risk factors in the development of gastric adenocarcinoma in the general population: A cross-sectional study of the Wuwei Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Age, illiteracy, H. pylori infection, smoking, eating hot food, eating quickly, and histories of gastritis and gallbladder diseases were associated with the progression to IM from CAG."
      explanation: >-
        A 9,326-participant stage-resolved analysis names smoking among the factors
        associated with progression from chronic atrophic gastritis to intestinal
        metaplasia, which is the node this link targets.
    - reference: PMID:18293090
      reference_title: "Smoking and gastric cancer: systematic review and meta-analysis of cohort studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "smoking was significantly associated with both cardia (RR = 1.87; 95% CI: 1.31-2.67; I (2) = 73.2%; nine studies) and non-cardia (RR = 1.60; 95% CI: 1.41-1.80; I (2) = 18.9%; nine studies) cancers"
      explanation: >-
        Quantifies the excess risk in smokers at both anatomical sites. Support is
        PARTIAL because the endpoint is gastric cancer, not the metaplastic step this
        link targets.
  description: >-
    An established risk factor for gastric adenocarcinoma at both cardia and non-cardia
    sites, acting independently of and additively with H. pylori infection.
  evidence:
  - reference: PMID:18293090
    reference_title: "Smoking and gastric cancer: systematic review and meta-analysis of cohort studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study provides solid evidence to classify smoking as the most important behavioral risk factor for gastric cancer."
    explanation: >-
      A meta-analysis of 42 cohort and nested case-control studies concludes that
      smoking is the leading behavioural risk factor for gastric cancer.
  - reference: PMID:38572751
    reference_title: "Global cancer statistics 2022: GLOBOCAN estimates of incidence and mortality worldwide for 36 cancers in 185 countries."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "targeting of key risk factors for cancer (including smoking, overweight and obesity, and infection)"
    explanation: >-
      Indirect: GLOBOCAN names smoking and infection among the key modifiable cancer risk
      factors amenable to prevention. Gastric-specific risk magnitude is not quantified
      here.
- name: Epstein-Barr virus infection
  exposure_term:
    preferred_term: Epstein-Barr virus exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: EBV-Driven Hypermethylation and Checkpoint Ligand Amplification
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Clonal EBV infection of the tumour epithelium is what establishes the molecular
      class this node models: the extreme CpG island methylator phenotype and the
      PD-L1/PD-L2 amplification are features of EBV-positive tumours specifically, so
      the virus is the direct antecedent of the node rather than a background risk
      factor.
    evidence:
    - reference: PMID:25079317
      reference_title: Comprehensive molecular characterization of gastric adenocarcinoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations, extreme DNA hypermethylation, and amplification of JAK2, CD274 (also known as PD-L1) and PDCD1LG2 (also known as PD-L2)"
      explanation: >-
        TCGA defines the hypermethylation and checkpoint-ligand amplification of this
        node as properties of EBV-positive tumours, tying the exposure to the node.
  description: >-
    Epstein-Barr virus is clonally present in the tumour epithelium of roughly 7-9% of
    gastric adenocarcinomas and defines one of the four TCGA molecular classes. Unlike
    H. pylori, salt and smoking, which act on the preinvasive Correa cascade, EBV is
    detected within the malignant cells themselves and marks a distinct route into
    gastric cancer, enriched proximally and in men. IARC classifies EBV as a Group 1
    carcinogen; that classification is not snippet-quotable from the sources cited here
    and is reported as context rather than as an evidenced claim.
  evidence:
  - reference: PMID:35963539
    reference_title: "Estimating the Global Burden of Epstein-Barr Virus-Associated Gastric Cancer: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EBV prevalence in tumor cells was 7.5% (95% CI, 6.9%-8.1%) and was higher in men compared with women (PR, 2.1; 95% CI, 1.9-2.4), in diffuse type compared with intestinal type (PR, 1.3; 95% CI, 1.1-1.5), and in the proximal region compared with the distal region (PR, 2.5; 95% CI, 2.0-3.1)."
    explanation: >-
      A 220-study meta-analysis of over 68,000 conventional gastric adenocarcinomas
      quantifies the share carrying EBV in the tumour cells and its sex, Lauren-type
      and anatomical distribution.
  - reference: PMID:32487043
    reference_title: "Association between Epstein-Barr virus infection and gastric cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EBV infection is associated with more than 18 times increase the risk of gastric cancer."
    explanation: >-
      Case-control meta-analysis using tumour-adjacent normal tissue as the comparison
      gives the magnitude of the association between EBV infection and gastric cancer.
  notes: >-
    Bound to ECTO:3000001 exposure to virus, the most specific applicable ECTO term -
    ECTO has no Epstein-Barr or gammaherpesvirus exposure class (searched 2026-08-25).
    Same binding as the EBV exposure in Multiple_Sclerosis.

diagnosis:
- name: Upper endoscopy with multiple biopsies
  description: >-
    The diagnostic gold standard. Multiple biopsies are essential because single samples
    substantially underperform, particularly with ulcerated lesions and in diffuse-type
    disease where the mucosa may look intact over transmural infiltration.
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple biopsies should be carried out to provide sufficient material for histological and molecular interpretation, particularly in the setting of ulcerated lesions."
    explanation: >-
      Guideline statement on the multiple-biopsy requirement and its rationale.
- name: CT staging and diagnostic laparoscopy with peritoneal lavage
  description: >-
    Thoracic and abdomino-pelvic CT is the primary staging examination; endoscopic
    ultrasound refines T and N assessment. Diagnostic laparoscopy with peritoneal
    washings is added for potentially resectable locally advanced disease to detect
    occult peritoneal spread, since positive cytology counts as metastatic disease.
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thoracic and abdomino-pelvic CT scan is the preferred examination for staging and is highly accurate in detect- ing metastasis; albeit less sensitive for evaluating T and N spread."
    explanation: >-
      Establishes CT as the preferred staging modality and its known limitation for local
      T/N assessment, which is why EUS and laparoscopy are added.
- name: Predictive biomarker panel
  description: >-
    Advanced disease requires HER2 (IHC with reflex ISH), MMR/MSI, PD-L1 CPS and
    claudin-18.2 testing before first-line therapy. EBER in-situ hybridisation, broad
    NGS and ctDNA are selective or investigational.
  evidence:
  - reference: PMID:39409957
    reference_title: "Systemic Therapy of Gastric Cancer-State of the Art and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is essential to determine biomarkers such as HER2 expression, PD-L1 combined positive score (CPS) (combined positive score), Claudin 18.2, and microsatellite instability (MSI)"
    explanation: >-
      Names the exact four-biomarker panel curated here as essential for therapy
      selection.

differential_diagnoses:
- name: Gastric MALT lymphoma
  description: >-
    The most important differential to keep mechanistically separate. Extranodal marginal
    zone B-cell lymphoma of mucosa-associated lymphoid tissue shares H. pylori as its
    driver, arises in the same organ, and can look similar endoscopically - but it is a
    lymphoid, not epithelial, neoplasm with an entirely different natural history and
    first-line treatment. Curated separately as `MALT_Lymphoma`.
  disease_term:
    preferred_term: MALT lymphoma
    term:
      id: MONDO:0007650
      label: MALT lymphoma
  distinguishing_features:
  - Cell of origin is a marginal-zone B lymphocyte, not gastric glandular epithelium;
    immunohistochemistry (CD20-positive lymphoid infiltrate with lymphoepithelial
    lesions) separates them definitively.
  - Characteristic t(11;18)(q21;q21) API2-MALT1 translocation has no counterpart in
    gastric adenocarcinoma, and predicts failure of eradication therapy.
  - H. pylori eradication alone can induce durable remission in early-stage gastric MALT
    lymphoma; eradication never treats established gastric adenocarcinoma, in which it
    is a primary-prevention measure only.
  - Indolent course with prolonged survival, versus the aggressive course of
    adenocarcinoma.
  notes: >-
    The distinguishing features rest on standard WHO diagnostic pathology rather than on
    any source in this entry's cited corpus, so no evidence item is attached rather than
    citing a tangential quote (CLAUDE.md SOP section 4).
- name: Gastrointestinal stromal tumor
  description: >-
    Mesenchymal neoplasm of the interstitial cells of Cajal, the commonest gastric
    submucosal tumour. Presents as a submucosal mass with intact overlying mucosa, so
    superficial endoscopic biopsy is frequently non-diagnostic - the same pitfall as
    diffuse-type adenocarcinoma, but with a completely different answer. Curated
    separately as `Gastrointestinal_Stromal_Tumor`.
  disease_term:
    preferred_term: gastrointestinal stromal tumor
    term:
      id: MONDO:0011719
      label: gastrointestinal stromal tumor
  distinguishing_features:
  - KIT (CD117) and DOG1 positive, cytokeratin negative - the inverse of adenocarcinoma.
  - Driven by activating KIT or PDGFRA mutations and treated with imatinib; neither
    applies to adenocarcinoma.
  - Spindle or epithelioid mesenchymal morphology without gland formation or signet-ring
    cells.
  notes: >-
    The distinguishing features rest on standard WHO diagnostic pathology rather than on
    any source in this entry's cited corpus, so no evidence item is attached rather than
    citing a tangential quote (CLAUDE.md SOP section 4).
- name: Gastric neuroendocrine neoplasm
  description: >-
    Epithelial neoplasm of enterochromaffin-like cells. Type 1 lesions arise in
    autoimmune atrophic gastritis with hypergastrinaemia - the same atrophic background
    that predisposes to intestinal-type adenocarcinoma - so the two can coexist and must
    be distinguished on a single biopsy. Curated separately as
    `Gastroenteropancreatic_Neuroendocrine_Neoplasm`.
  disease_term:
    preferred_term: gastric neuroendocrine neoplasm
    term:
      id: MONDO:0003111
      label: gastric neuroendocrine neoplasm
  distinguishing_features:
  - Expresses chromogranin A and synaptophysin with organoid/trabecular architecture,
    unlike gland-forming adenocarcinoma.
  - Type 1 lesions are gastrin-driven, usually multiple, small and indolent, and are
    managed by surveillance or endoscopic resection rather than gastrectomy.
  - Graded by Ki-67 index and mitotic count (WHO neuroendocrine grading), not by Lauren
    type.
  notes: >-
    The distinguishing features rest on standard WHO diagnostic pathology rather than on
    any source in this entry's cited corpus, so no evidence item is attached rather than
    citing a tangential quote (CLAUDE.md SOP section 4).
- name: Gastroesophageal junction adenocarcinoma
  description: >-
    Adenocarcinoma centred at the gastroesophageal junction. Deliberately modelled as a
    differential rather than a subtype: junctional tumours share systemic-therapy
    evidence with gastric adenocarcinoma (they were co-enrolled in ToGA, FLOT4,
    SPOTLIGHT and FIGHT) but differ in aetiology, being driven by obesity and reflux
    rather than H. pylori, and overlapping the Barrett-derived esophageal
    adenocarcinoma biology curated in `Esophageal_Adenocarcinoma`.
  disease_term:
    preferred_term: gastroesophageal junction adenocarcinoma
    term:
      id: MONDO:0003219
      label: gastroesophageal junction adenocarcinoma
  distinguishing_features:
  - Anatomic epicentre at the junction (Siewert classification) rather than in the
    gastric body or antrum.
  - Aetiologically linked to gastroesophageal reflux, Barrett metaplasia and obesity,
    not to H. pylori-driven atrophic gastritis.
  - Higher HER2 positivity rate than distal gastric tumours, and different locoregional
    management (chemoradiation has a defined role at the junction).
  evidence:
  - reference: PMID:39409957
    reference_title: "Systemic Therapy of Gastric Cancer-State of the Art and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To select the most appropriate therapy for advanced gastric cancer, including adenocarcinoma of the esophago-gastric junction"
    explanation: >-
      Confirms that junctional adenocarcinoma is handled alongside, but named separately
      from, gastric adenocarcinoma in systemic-therapy guidance - exactly the boundary
      modelled here.
- name: Benign gastric ulcer
  description: >-
    Peptic ulceration, most often H. pylori- or NSAID-related. Endoscopically an
    ulcerated gastric adenocarcinoma can be indistinguishable from a benign ulcer, which
    is why guidelines mandate biopsy of every gastric ulcer and endoscopic confirmation
    of healing. Curated separately as `Gastric_Ulcer`.
  disease_term:
    preferred_term: gastric ulcer
    term:
      id: MONDO:0001126
      label: gastric ulcer
  distinguishing_features:
  - Histology shows inflammation, granulation tissue and regenerative change without
    invasive malignant epithelium.
  - Benign ulcers heal completely on acid suppression and H. pylori eradication;
    persistent or non-healing ulceration mandates re-biopsy for malignancy.
  - Regular ulcer margins with radiating folds, versus the heaped, irregular, indurated
    margins of a malignant ulcer.
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "particularly in the setting of ulcerated lesions"
    explanation: >-
      The guideline singles out ulcerated lesions as requiring extra biopsy sampling,
      reflecting the difficulty of separating malignant from benign gastric ulceration.

treatments:
- name: Prophylactic Total Gastrectomy for Germline CDH1 Carriers
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    The highest-stakes actionable recommendation in this entry. For carriers of a
    pathogenic germline CDH1 variant, risk-reducing total gastrectomy remains the IGCLC
    recommended option for gastric cancer risk management, and is the only intervention
    that substantially eliminates it (rare post-gastrectomy diffuse gastric cancer is
    reported from residual mucosa at the anastomosis). Threshold and timing: surgery is
    recommended in early adulthood, generally between 20 and 30 years of age, and is NOT
    recommended over age 70 unless there are significant mitigating circumstances. For
    carriers who decline or postpone, the IGCLC recommends annual endoscopy by
    endoscopists experienced in HDGC, and eradication of Helicobacter pylori if present.
    The 2020 IGCLC guidelines
    relaxed the genetic testing criteria (mainly by loosening age limits) and, critically,
    now express increasing confidence that endoscopic surveillance in expert centres can
    be safely offered to carriers who wish to postpone surgery or whose risk is not well
    defined - so the recommendation is no longer uniform. The reason the threshold has
    moved is quantitative: including less-selected families, the cumulative lifetime risk
    of advanced diffuse gastric cancer is now estimated at 13-19%, far below older
    high-risk-family estimates, while roughly a third of carriers decline surgery because
    of its lifelong physical and psychological consequences. Surveillance is imperfect:
    almost every prophylactic gastrectomy specimen already contains small pT1a
    signet-ring-cell foci of unpredictable behaviour, so the goal of endoscopic
    surveillance must be detecting atypical deeper-infiltrating lesions rather than every
    signet-ring focus. CTNNA1 carriers should not be managed by simple extrapolation from
    CDH1, being moderate-penetrance. Lifelong sequelae of total gastrectomy include small
    frequent meals, weight loss, dumping, reflux, and iron and vitamin B12 deficiency.
  treatment_term:
    preferred_term: Total Gastrectomy
    term:
      id: NCIT:C185240
      label: Total Gastrectomy
  target_mechanisms:
  - target: CDH1 Inactivation and E-cadherin Loss
    treatment_effect: INHIBITS
    description: >-
      Removes the entire at-risk epithelial compartment in which the germline first hit
      is present, pre-empting the somatic second hit.
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylactic total gastrectomy remains the recommended option for gastric cancer risk management in pathogenic CDH1 variant carriers."
    explanation: >-
      The core IGCLC recommendation curated here.
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where possible, surgery is recommended in early adulthood, generally between 20 and 30yrs of age."
    explanation: >-
      The IGCLC age window for risk-reducing total gastrectomy - the timing threshold
      this treatment entry turns on.
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTG is not recommended in patients over 70yrs unless there are significant mitigating circumstances."
    explanation: >-
      The upper age bound, driven by perioperative risk and prolonged recovery.
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For those declining or wishing to postpone PTG, it is recommended that annual endoscopy is carried out by experienced endoscopists with knowledge of HDGC"
    explanation: >-
      Defines the surveillance alternative and its required expertise, and links this
      treatment to the Endoscopic Surveillance entry.
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also recommended that Helicobacter pylori is eradicated if present."
    explanation: >-
      Co-recommendation for CDH1 carriers, linking the hereditary arm to the H. pylori
      screen-and-treat entry.
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is increasing confidence from the IGCLC that endoscopic surveillance in expert centres can be safely offered to patients who wish to postpone surgery, or to those whose risk of developing gastric cancer is not well defined."
    explanation: >-
      Documents the qualification to the blanket recommendation - the surveillance
      alternative and the conditions under which it is acceptable.
  - reference: PMID:39379994
    reference_title: "Current advances and challenges in Managing Hereditary Diffuse Gastric Cancer (HDGC): a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cumulative lifetime risk of developing advanced DGC is much lower than previously thought and is now estimated to be 13-19%"
    explanation: >-
      Gives the revised quantitative risk estimate that is driving reconsideration of a
      uniform prophylactic gastrectomy recommendation.
  - reference: PMID:39379994
    reference_title: "Current advances and challenges in Managing Hereditary Diffuse Gastric Cancer (HDGC): a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a prophylactic total gastrectomy (PTG) is currently the gold standard for reducing the risk of DGC in CDH1 PV carriers"
    explanation: >-
      Independent confirmation of prophylactic total gastrectomy as the gold-standard
      risk-reducing intervention.
- name: Curative Gastrectomy with D2 Lymphadenectomy
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    The definitive operation for non-early, operable gastric adenocarcinoma: subtotal or
    total gastrectomy with a D2 lymphadenectomy clearing the perigastric mesenteric and
    coeliac-branch nodal stations. Distinct from the prophylactic total gastrectomy
    offered to unaffected germline CDH1 carriers - this is resection of established
    cancer with curative intent, and is normally combined with perioperative
    chemotherapy.
  treatment_term:
    preferred_term: Gastrectomy
    term:
      id: NCIT:C15236
      label: Gastrectomy
  target_mechanisms:
  - target: Intestinal-Type Invasive Adenocarcinoma
    treatment_effect: INHIBITS
    description: >-
      Removes the invasive primary tumour and its draining nodal basin before
      dissemination becomes established.
  - target: Diffuse Infiltrative Growth and Linitis Plastica
    treatment_effect: INHIBITS
    description: >-
      Resects transmurally infiltrating disease; total gastrectomy is usually required
      because diffuse tumours lack a discrete margin.
  evidence:
  - reference: PMID:32861308
    reference_title: "Gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-early operable gastric cancer is treated with surgery, which should include D2 lymphadenectomy (including lymph node stations in the perigastric mesentery and along the celiac arterial branches)."
    explanation: >-
      Defines the standard curative operation and the required extent of lymphadenectomy.
  - reference: PMID:32861308
    reference_title: "Gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perioperative or adjuvant chemotherapy improves survival in patients with stage 1B or higher cancers."
    explanation: >-
      Establishes that surgery is combined with perioperative/adjuvant chemotherapy from
      stage 1B upward, linking this entry to the FLOT treatment.

- name: Ramucirumab (Anti-VEGFR2) Second-Line Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Human IgG1 monoclonal antibody antagonist of VEGFR2 (KDR), licensed second line in
    advanced gastric and gastroesophageal junction adenocarcinoma, given with paclitaxel
    (RAINBOW) or as monotherapy (REGARD). It is the only anti-angiogenic agent with
    phase 3 survival benefit in this disease and, unlike the HER2, CLDN18.2, PD-L1 and
    FGFR2b agents, requires no predictive biomarker. Characteristic class toxicities are
    hypertension, proteinuria and bleeding.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ramucirumab
      term:
        id: NCIT:C70792
        label: Ramucirumab
  target_mechanisms:
  - target: Angiogenic Switch and VEGF-Driven Neovascularization
    treatment_effect: INHIBITS
    description: >-
      Blocks VEGFR2 on tumour endothelium, cutting off the VEGF-driven neovascularization
      that sustains tumour growth.
  evidence:
  - reference: PMID:25240821
    reference_title: "Ramucirumab plus paclitaxel versus placebo plus paclitaxel in patients with previously treated advanced gastric or gastro-oesophageal junction adenocarcinoma (RAINBOW): a double-blind, randomised phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assessed whether ramucirumab, a monoclonal antibody VEGFR-2 antagonist, in combination with paclitaxel would increase overall survival in patients previously treated for advanced gastric cancer compared with placebo plus paclitaxel."
    explanation: >-
      Defines the agent, its molecular target and the second-line indication curated here.
  - reference: PMID:32861308
    reference_title: "Gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapies licensed to treat gastric cancer include trastuzumab (HER2-positive patients first line), ramucirumab (anti-angiogenic second line), and nivolumab or pembrolizumab (anti-PD-1 third line)."
    explanation: >-
      Places ramucirumab in the licensed second-line position, alongside the other
      targeted agents curated in this entry.

- name: Breast Surveillance for Female CDH1 Carriers
  action_category: SCREENING
  therapeutic_modality: DEVICE
  description: >-
    Lobular breast cancer is the second tumour of hereditary diffuse gastric cancer, so
    gastric risk management alone is insufficient for female germline CDH1 carriers. The
    IGCLC offers annual breast surveillance as one of the two acceptable strategies for
    managing that risk (the other being risk-reducing mastectomy, curated separately
    below). Recorded as a distinct clinical action because it is co-equal in stakes with
    the gastric recommendation and is easily overlooked once prophylactic gastrectomy
    has been addressed.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LBC risk should be managed with either annual surveillance or bilateral risk-reducing mastectomy (BRRM)."
    explanation: >-
      The IGCLC recommendation establishing annual surveillance as one of the two
      acceptable strategies for the breast arm of HDGC risk management.

- name: Risk-Reducing Bilateral Mastectomy for Female CDH1 Carriers
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Bilateral risk-reducing mastectomy is the surgical alternative to annual breast
    surveillance for female germline CDH1 carriers, and is the breast counterpart of
    prophylactic total gastrectomy: it removes the at-risk epithelial compartment in
    which the germline first hit is present. Modelled as its own THERAPEUTIC/SURGERY
    treatment rather than folded into the surveillance entry, matching the existing
    pattern in `Hereditary_Breast_and_Ovarian_Cancer_Syndrome`, `Cowden_Syndrome` and
    `Li-Fraumeni_Syndrome`, so that a query for surgical prophylaxis in CDH1 carriers
    returns it.
  treatment_term:
    preferred_term: Prophylactic Mastectomy
    term:
      id: NCIT:C94445
      label: Prophylactic Mastectomy
  target_mechanisms:
  - target: CDH1 Inactivation and E-cadherin Loss
    treatment_effect: INHIBITS
    description: >-
      Removes the at-risk breast epithelial compartment carrying the germline CDH1
      first hit, pre-empting the somatic second hit that would produce lobular breast
      carcinoma.
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LBC risk should be managed with either annual surveillance or bilateral risk-reducing mastectomy (BRRM)."
    explanation: >-
      The IGCLC recommendation establishing bilateral risk-reducing mastectomy as the
      surgical option for the breast arm of HDGC risk management.

- name: Perioperative FLOT Chemotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Fluorouracil, leucovorin, oxaliplatin and docetaxel given before and after
    gastrectomy for fit patients with locally advanced resectable gastric or
    gastroesophageal junction adenocarcinoma. Established as the Western standard by
    FLOT4, which reported a median overall survival of 50 months versus 35 months
    against the prior ECF/ECX standard (hazard ratio 0.77).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fluorouracil
      term:
        id: CHEBI:46345
        label: 5-fluorouracil
    - preferred_term: oxaliplatin
      term:
        id: CHEBI:31941
        label: oxaliplatin
    - preferred_term: leucovorin
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
    - preferred_term: docetaxel
      term:
        id: CHEBI:4672
        label: docetaxel anhydrous
  regimen_term:
    preferred_term: FLOT regimen
    term:
      id: NCIT:C160565
      label: FLOT Regimen
  evidence:
  - reference: PMID:30982686
    reference_title: "Perioperative chemotherapy with fluorouracil plus leucovorin, oxaliplatin, and docetaxel versus fluorouracil or capecitabine plus cisplatin and epirubicin for locally advanced, resectable gastric or gastro-oesophageal junction adenocarcinoma (FLOT4): a randomised, phase 2/3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall survival was increased in the FLOT group compared with the ECF/ECX group"
    explanation: >-
      The FLOT4 primary result establishing perioperative FLOT as the standard of care.
  - reference: PMID:30982686
    reference_title: "Perioperative chemotherapy with fluorouracil plus leucovorin, oxaliplatin, and docetaxel versus fluorouracil or capecitabine plus cisplatin and epirubicin for locally advanced, resectable gastric or gastro-oesophageal junction adenocarcinoma (FLOT4): a randomised, phase 2/3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In locally advanced, resectable gastric or gastro-oesophageal junction adenocarcinoma, perioperative FLOT improved overall survival compared with perioperative ECF/ECX."
    explanation: >-
      The authors' interpretation, defining the indication as curated here.
- name: Trastuzumab for HER2-Positive Disease
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-HER2 monoclonal antibody added to first-line fluoropyrimidine-platinum
    chemotherapy for HER2-overexpressing or HER2-amplified advanced gastric or
    gastroesophageal junction adenocarcinoma. The ToGA trial was the first demonstration
    that a targeted agent improves survival in this disease (median overall survival 13.8
    versus 11.1 months). Trastuzumab deruxtecan is an important later-line option after
    trastuzumab exposure. See `HER2_Positive_Gastric_Cancer` for the deeper treatment
    curation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trastuzumab
      term:
        id: NCIT:C1647
        label: Trastuzumab
  target_mechanisms:
  - target: Receptor Tyrosine Kinase Amplification
    treatment_effect: INHIBITS
    description: >-
      Binds the amplified HER2 receptor, blocking its ERBB2 signalling output. Note the
      target is the RTK amplification node, not the upstream chromosomal instability -
      trastuzumab does not correct aneuploidy.
  evidence:
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median overall survival was 13.8 months (95% CI 12-16) in those assigned to trastuzumab plus chemotherapy compared with 11.1 months (10-13) in those assigned to chemotherapy alone (hazard ratio 0.74; 95% CI 0.60-0.91; p=0.0046)."
    explanation: >-
      The ToGA primary survival result quantifying HER2-directed benefit.
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trastuzumab in combination with chemotherapy can be considered as a new standard option for patients with HER2-positive advanced gastric or gastro-oesophageal junction cancer."
    explanation: >-
      Establishes the standard-of-care status of the HER2-directed indication.
- name: Zolbetuximab for CLDN18.2-Positive HER2-Negative Disease
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Chimeric IgG1 monoclonal antibody against claudin-18 isoform 2, added to mFOLFOX6 in
    the first line for CLDN18.2-positive, HER2-negative advanced disease. It kills
    CLDN18.2-expressing tumour cells by antibody- and complement-dependent cytotoxicity.
    The therapeutic window exists because normal CLDN18.2 expression is restricted to
    short-lived differentiated gastric mucosal epithelium. Nausea and vomiting are
    prominent infusion-related toxicities.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zolbetuximab
      term:
        id: NCIT:C85475
        label: Zolbetuximab
  evidence:
  - reference: DOI:10.1038/s41591-023-02465-7
    reference_title: 'Zolbetuximab plus CAPOX in CLDN18.2-positive gastric or gastroesophageal junction adenocarcinoma: the randomized, phase 3 GLOW trial'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Zolbetuximab plus CAPOX represents a potential new first-line therapy for patients with CLDN18.2-positive, HER2-negative, locally advanced unresectable or mG/GEJ adenocarcinoma.
    explanation: The randomized phase 3 GLOW trial supports zolbetuximab plus CAPOX as a first-line treatment for the CLDN18.2-positive metastatic gastric/GEJ adenocarcinoma subset.
  - reference: PMID:37068504
    reference_title: "Zolbetuximab plus mFOLFOX6 in patients with CLDN18.2-positive, HER2-negative, untreated, locally advanced unresectable or metastatic gastric or gastro-oesophageal junction adenocarcinoma (SPOTLIGHT): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeting CLDN18.2 with zolbetuximab significantly prolonged progression-free survival and overall survival when combined with mFOLFOX6 versus placebo plus mFOLFOX6"
    explanation: >-
      The SPOTLIGHT interpretation establishing efficacy on both progression-free and
      overall survival.
  - reference: PMID:37068504
    reference_title: "Zolbetuximab plus mFOLFOX6 in patients with CLDN18.2-positive, HER2-negative, untreated, locally advanced unresectable or metastatic gastric or gastro-oesophageal junction adenocarcinoma (SPOTLIGHT): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Zolbetuximab treatment showed a significant reduction in the risk of disease progression or death compared with placebo"
    explanation: >-
      Confirms the progression-free survival benefit of the CLDN18.2-directed indication.
- name: PD-1 Checkpoint Blockade (Pembrolizumab, Nivolumab)
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-PD-1 antibodies added to first-line chemotherapy for HER2-negative advanced
    disease, with eligibility gated on PD-L1 combined positive score and with the largest
    benefit in MSI-high/dMMR and high-CPS tumours. KEYNOTE-859 reported a significant
    overall survival improvement in the intention-to-treat population (12.9 versus 11.5
    months, hazard ratio 0.78) that widened at higher CPS. Pembrolizumab is also added to
    trastuzumab plus chemotherapy in eligible PD-L1-positive HER2-positive disease.
    Immune-related adverse events are the characteristic toxicity class.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
  target_mechanisms:
  - target: Tumor Immune Evasion and Checkpoint Engagement
    treatment_effect: INHIBITS
    description: >-
      Blocks PD-1 on tumour-infiltrating T cells, releasing the checkpoint brake imposed
      by tumour PD-L1.
  evidence:
  - reference: PMID:37875143
    reference_title: "Pembrolizumab plus chemotherapy versus placebo plus chemotherapy for HER2-negative advanced gastric cancer (KEYNOTE-859): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median overall survival was longer in the pembrolizumab group than in the placebo group in the ITT population"
    explanation: >-
      The KEYNOTE-859 primary overall survival result demonstrating checkpoint-blockade
      benefit.
  - reference: PMID:37875143
    reference_title: "Pembrolizumab plus chemotherapy versus placebo plus chemotherapy for HER2-negative advanced gastric cancer (KEYNOTE-859): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pembrolizumab with chemotherapy might be a first-line treatment option for patients with locally advanced or metastatic HER2-negative gastric or gastro-esophageal junction adenocarcinoma."
    explanation: >-
      Defines the first-line HER2-negative indication curated here.
- name: Bemarituzumab for FGFR2b-Overexpressing Disease
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Afucosylated humanised monoclonal antibody against the FGFR2b isoform, added to
    mFOLFOX6 in FGFR2b-selected disease. The randomised phase 2 FIGHT study did not meet
    statistical significance for progression-free survival (9.5 versus 7.4 months, hazard
    ratio 0.68, p=0.073) but showed promising activity, and confirmatory phase 3 trials
    followed. Investigational rather than standard of care. A distinctive and
    dose-limiting on-target toxicity reported in the FIGHT safety analysis is corneal
    disorder, occurring as a grade 3 or worse event in 24% of bemarituzumab recipients
    and in none of the placebo group.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bemarituzumab
      term:
        id: NCIT:C120040
        label: Bemarituzumab
  target_mechanisms:
  - target: Receptor Tyrosine Kinase Amplification
    treatment_effect: INHIBITS
    description: >-
      Blocks the FGFR2b receptor tyrosine kinase amplified/overexpressed in a subset of
      CIN-class tumours.
  evidence:
  - reference: PMID:36244398
    reference_title: "Bemarituzumab in patients with FGFR2b-selected gastric or gastro-oesophageal junction adenocarcinoma (FIGHT): a randomised, double-blind, placebo-controlled, phase 2 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "median progression-free survival was 9·5 months (95% CI 7·3-12·9) in the bemarituzumab group and 7·4 months (5·8-8·4) in the placebo group"
    explanation: >-
      Quantifies the efficacy signal. Support is PARTIAL because the difference did not
      reach statistical significance, which is why the entry frames bemarituzumab as
      investigational rather than standard of care.
  - reference: PMID:36244398
    reference_title: "Bemarituzumab in patients with FGFR2b-selected gastric or gastro-oesophageal junction adenocarcinoma (FIGHT): a randomised, double-blind, placebo-controlled, phase 2 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this exploratory phase 2 study, despite no statistically significant improvement in progression-free survival, treatment with bemarituzumab showed promising clinical efficacy."
    explanation: >-
      The authors' own interpretation, which is the basis for the investigational framing
      and for the confirmatory phase 3 programme noted in the description.
- name: Endoscopic Submucosal Dissection for Early Gastric Cancer
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    En-bloc endoscopic resection of selected superficial lesions confined to the mucosa
    with negligible nodal risk, achieving cure while preserving the stomach. Applies to
    early gastric cancer meeting size, depth, differentiation and ulceration criteria -
    essentially a Correa-route intervention, since it presupposes a discrete
    intestinal-type lesion rather than diffuse infiltration.
  treatment_term:
    preferred_term: Endoscopic Submucosal Dissection
    term:
      id: NCIT:C157837
      label: Endoscopic Submucosal Dissection
  target_mechanisms:
  - target: Intestinal-Type Invasive Adenocarcinoma
    treatment_effect: INHIBITS
    description: >-
      Physically removes the intramucosal carcinoma before it can invade deeper or
      metastasise.
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endoscopic resection in very early stage, perioperative chemotherapy in locally advanced tumors"
    explanation: >-
      Guideline statement placing endoscopic resection as the standard for very early
      stage disease.
- name: Helicobacter pylori Screen-and-Treat (Primary Prevention)
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Population-level detection and eradication of H. pylori, the leading supportable
    gastric cancer prevention strategy in intermediate- and high-incidence regions.
    Eradication is most effective before advanced atrophy and intestinal metaplasia
    develop - the mechanistic reason the intervention window is early in the Correa
    cascade. It also prevents peptic ulcer disease and gastric MALT lymphoma. A
    recognised trade-off is increased population antibiotic use. Note this treats the
    trigger; it does not treat established cancer.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Helicobacter pylori Chronic Active Gastritis
    treatment_effect: INHIBITS
    description: >-
      Eliminates the persistent inflammatory stimulus that initiates the Correa cascade.
  evidence:
  - reference: PMID:39237127
    reference_title: "Where are we with gastric cancer screening in Europe in 2024?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the screen and treat strategy for Helicobacter pylori (H. pylori) seems to be the most appropriate for Europe"
    explanation: >-
      Establishes H. pylori screen-and-treat as the leading population prevention
      strategy.
  - reference: PMID:39237127
    reference_title: "Where are we with gastric cancer screening in Europe in 2024?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has to be noted that increased use of antibiotics would be associated with this strategy."
    explanation: >-
      Documents the antibiotic-stewardship trade-off of the strategy, curated as a caveat.
- name: Endoscopic Surveillance in Hereditary and Precancerous Settings
  action_category: SCREENING
  therapeutic_modality: DEVICE
  description: >-
    Upper endoscopy with protocol biopsies, used in two distinct settings: surveillance of
    advanced precancerous gastric conditions (extensive atrophic gastritis, intestinal
    metaplasia, dysplasia) along the Correa route, and as an alternative to immediate
    prophylactic gastrectomy for selected germline CDH1 carriers in expert centres. In the
    HDGC setting its sensitivity is inherently imperfect because signet-ring-cell foci are
    small, submucosal and endoscopically inapparent.
  treatment_term:
    preferred_term: Gastroscopy
    term:
      id: NCIT:C16604
      label: Gastroscopy
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the growing capability of endoscopic and histological surveillance in HDGC"
    explanation: >-
      IGCLC recognition of endoscopic and histological surveillance as an increasingly
      capable option in HDGC.
- name: Genetic Counselling and Cascade Testing
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    Referral for genetic counselling is indicated for young-onset diffuse gastric cancer,
    a family history meeting HDGC criteria, bilateral or familial lobular breast cancer,
    Lynch-compatible MSI, or polyposis. Testing should use a hereditary gastric cancer
    panel covering CDH1, CTNNA1, the mismatch repair genes, APC, STK11, SMAD4, BMPR1A and
    TP53, including deletion/duplication analysis. Identification of a familial variant
    triggers cascade testing of at-risk relatives, which is what converts a diagnosis in
    one patient into prevention for the family.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38160327
    reference_title: "The Chinese Society of Clinical Oncology (CSCO): Clinical guidelines for the diagnosis and treatment of gastric cancer, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the guidelines offer detailed screening recommendations for hereditary gastric cancer"
    explanation: >-
      Guideline confirmation that hereditary gastric cancer screening is a defined
      component of gastric cancer care.

datasets:
- accession: https://portal.gdc.cancer.gov/projects/TCGA-STAD
  title: https://portal.gdc.cancer.gov/projects/TCGA-STAD
  description: >-
    The Cancer Genome Atlas stomach adenocarcinoma project (TCGA-STAD). Multi-platform
    molecular profiling (whole-exome sequencing, mRNA and miRNA expression, DNA
    methylation, copy number and reverse-phase protein arrays) of 295 primary gastric
    adenocarcinomas. This is the dataset from which the four-class EBV / MSI /
    genomically stable / chromosomal instability molecular taxonomy used throughout this
    entry was derived, and the primary resource for validating those class assignments.
  organism:

prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  rate_per_100000: 11.5
  notes: >-
    GLOBOCAN 2022 places stomach cancer at 4.9% of all incident cancers worldwide
    (roughly 970,000 new cases against ~20 million total), i.e. an order of
    magnitude near 11-12 per 100,000 person-years crude. `prevalence_class` is left
    UNKNOWN rather than given an Orphanet band, because the Orphanet bands are
    point-prevalence classes and must not be applied to an annual-incidence rate.
    Adenocarcinoma accounts
    for approximately 90% of these. Incidence is strongly geographically
    concentrated (East Asia, Eastern Europe, Latin America) and is roughly
    twice as high in men, so the worldwide figure should not be applied locally.
  evidence:
  - reference: PMID:38572751
    reference_title: "Global cancer statistics 2022: GLOBOCAN estimates of incidence and mortality worldwide for 36 cancers in 185 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "followed by cancers of the female breast (11.6%), colorectum (9.6%), prostate (7.3%), and stomach (4.9%)"
    explanation: >-
      GLOBOCAN 2022 ranks stomach cancer fifth worldwide at 4.9% of all incident
      cancers, anchoring the global incidence estimate.

progression:
- phase: Advanced and metastatic disease
  notes: >-
    Stomach cancer is the fifth leading cause of cancer death worldwide, at 6.8% of all
    cancer deaths in 2022 - a mortality share larger than its 4.9% incidence share,
    reflecting late presentation and poor survival. Median survival in advanced disease
    remains under one year with sequential chemotherapy. Stage is the dominant
    predictor: completely resected early mucosal cancers can be cured, while metastatic
    disease is usually incurable.
  evidence:
  - reference: PMID:38572751
    reference_title: "Global cancer statistics 2022: GLOBOCAN estimates of incidence and mortality worldwide for 36 cancers in 185 countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "followed by colorectal (9.3%), liver (7.8%), female breast (6.9%), and stomach (6.8%) cancers"
    explanation: >-
      Establishes stomach cancer's share of global cancer mortality, larger than its
      share of incidence.
  - reference: PMID:32861308
    reference_title: "Gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced gastric cancer is treated with sequential lines of chemotherapy, starting with a platinum and fluoropyrimidine doublet in the first line; median survival is less than 1 year."
    explanation: >-
      Quantifies the poor prognosis of advanced disease that drives the mortality burden.

has_subtypes:
# ---------------- Lauren histological axis ----------------
- name: Intestinal
  display_name: Intestinal-type gastric adenocarcinoma (Lauren)
  classification: histological_lauren
  description: >-
    Gland-forming, well-to-moderately differentiated tumours arising through the
    Correa cascade of H. pylori gastritis, atrophy, intestinal metaplasia and
    dysplasia. Predominates in older men and in high-incidence regions, and is the
    histology most reduced by H. pylori eradication and endoscopic screening.
  subtype_term:
    preferred_term: gastric intestinal type adenocarcinoma
    term:
      id: MONDO:0005037
      label: gastric intestinal type adenocarcinoma
  evidence:
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 90% of GC are adenocarcinomas (Ac), which are subdivided into diffuse and intestinal (Lauren classification)"
    explanation: >-
      Guideline statement that the Lauren scheme splits gastric adenocarcinoma into
      intestinal and diffuse types, and that adenocarcinoma is ~90% of gastric cancer.
- name: Diffuse
  display_name: Diffuse-type gastric adenocarcinoma (Lauren)
  classification: histological_lauren
  description: >-
    Poorly cohesive tumours composed of individually infiltrating cells, frequently
    with signet-ring morphology, that spread within the gastric wall rather than
    forming a mass and may produce linitis plastica. Associated with E-cadherin
    (CDH1) loss, younger age at onset, peritoneal dissemination and worse prognosis
    than intestinal type.
  subtype_term:
    preferred_term: diffuse gastric adenocarcinoma
    term:
      id: MONDO:0005017
      label: diffuse gastric adenocarcinoma
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  - preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  evidence:
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse-type gastric carcinoma (DGC) is characterized by a highly malignant phenotype with prominent infiltration and stromal induction."
    explanation: >-
      Characterises the infiltrative, stroma-inducing behaviour that defines the
      diffuse Lauren type.
- name: Mixed
  display_name: Mixed-type gastric adenocarcinoma (Lauren)
  classification: histological_lauren
  description: >-
    Tumours containing both gland-forming intestinal and poorly cohesive diffuse
    components in appreciable proportion. Recognised as a third Lauren category;
    behaviour generally tracks the diffuse component. Included because the Lauren
    scheme is trichotomous, not binary - collapsing mixed tumours into one of the
    two poles loses the observation that the two programmes can coexist in one tumour.
  evidence:
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of which were histopathologically characterized by the presence of poorly differentiated adenocarcinomas together with more differentiated components in the gastric mucosa"
    explanation: >-
      Direct histologic evidence that poorly differentiated (diffuse) and more
      differentiated (intestinal-like) components coexist within the same tumours -
      the observation the mixed Lauren category encodes. Support is PARTIAL because
      the paper describes the coexistence without using the "mixed type" label.
# ---------------- TCGA molecular axis ----------------
- name: EBV-positive
  subtype_frequency: 9% of the TCGA cohort (n=295)
  display_name: Epstein-Barr virus-positive gastric adenocarcinoma (TCGA)
  classification: molecular_tcga
  description: >-
    Approximately 9% of gastric adenocarcinomas. Defined by clonal EBV infection of
    the tumour epithelium and characterised by recurrent PIK3CA mutation, extreme DNA
    hypermethylation, and amplification of JAK2, CD274 (PD-L1) and PDCD1LG2 (PD-L2).
    The PD-L1/PD-L2 amplification makes this the molecular class with the clearest a
    priori rationale for checkpoint blockade. Curated in depth in the separate
    `EBV_Associated_Gastric_Cancer` entry.
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations, extreme DNA hypermethylation, and amplification of JAK2, CD274 (also known as PD-L1) and PDCD1LG2 (also known as PD-L2)"
    explanation: >-
      The TCGA definition of the EBV-positive molecular class, including the three
      features (PIK3CA, hypermethylation, PD-L1/L2 amplification) modelled as a
      pathophysiology node in this entry.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumours were first categorized by EBV-positivity (9%), then by MSI-high status, hereafter called MSI (22%), and the remaining tumours were distinguished by degree of aneuploidy into those termed genomically stable (20%) or those exhibiting chromosomal instability (CIN; 50%)."
    explanation: >-
      Quantifies the EBV-positive class at 9% of the TCGA cohort, and gives the
      frequencies of all four molecular classes in one statement.
- name: MSI
  subtype_frequency: 22% of the TCGA cohort (n=295)
  display_name: Microsatellite-instable gastric adenocarcinoma (TCGA)
  classification: molecular_tcga
  description: >-
    22% of the TCGA cohort. Tumours with mismatch-repair deficiency (most often sporadic MLH1 promoter
    hypermethylation, less often germline Lynch syndrome) producing elevated mutation
    rates and a hypermutated, neoantigen-rich genome. Strongly enriched for
    immunotherapy benefit and a mandatory biomarker test in advanced disease.
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microsatellite unstable tumours, which show elevated mutation rates, including mutations of genes encoding targetable oncogenic signalling proteins"
    explanation: >-
      The TCGA definition of the MSI molecular class and its hypermutated phenotype.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "then by MSI-high status, hereafter called MSI (22%)"
    explanation: >-
      Quantifies the MSI class at 22% of the TCGA cohort.
- name: GS
  subtype_frequency: 20% of the TCGA cohort (n=295)
  display_name: Genomically stable gastric adenocarcinoma (TCGA)
  classification: molecular_tcga
  description: >-
    20% of the TCGA cohort. Tumours lacking both aneuploidy and hypermutation. Enriched for - but, importantly,
    not synonymous with - the diffuse Lauren histology, and characterised by RHOA
    mutation or CLDN18-ARHGAP fusion. This class is the clearest illustration of why
    the Lauren and TCGA axes must be kept separate: TCGA describes GS as enriched for
    the diffuse variant, an association rather than an identity.
  genes:
  - preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  - preferred_term: CLDN18
    term:
      id: hgnc:2039
      label: CLDN18
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genomically stable tumours, which are enriched for the diffuse histological variant and mutations of RHOA or fusions involving RHO-family GTPase-activating proteins"
    explanation: >-
      Establishes both the molecular definition of the GS class and the fact that its
      relationship to diffuse histology is enrichment, not equivalence - the basis for
      keeping the Lauren and TCGA subtype axes distinct in this entry.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "those termed genomically stable (20%)"
    explanation: >-
      Quantifies the genomically stable class at 20% of the TCGA cohort.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDH1 somatic mutations were enriched in the genomically stable subtype (37% of cases)."
    explanation: >-
      Shows that somatic CDH1 inactivation - the sporadic counterpart of the germline
      HDGC lesion - concentrates in this class, linking the GS molecular class to the
      diffuse-route mechanism modelled in this entry.
- name: CIN
  subtype_frequency: 50% of the TCGA cohort (n=295)
  display_name: Chromosomally unstable gastric adenocarcinoma (TCGA)
  classification: molecular_tcga
  description: >-
    The largest molecular class, at 50% of the TCGA cohort. Marked aneuploidy with focal amplification of receptor
    tyrosine kinases (notably ERBB2/HER2, but also EGFR, MET, FGFR2), typically TP53
    mutant, and enriched at the gastroesophageal junction and in intestinal histology.
    This is the class in which HER2-directed therapy is most often actionable.
  genes:
  - preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and tumours with chromosomal instability, which show marked aneuploidy and focal amplification of receptor tyrosine kinases"
    explanation: >-
      The TCGA definition of the CIN class and its receptor-tyrosine-kinase
      amplification phenotype, which underpins HER2-directed therapy.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "those exhibiting chromosomal instability (CIN; 50%)"
    explanation: >-
      Quantifies CIN as the largest molecular class at 50% of the TCGA cohort.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the CIN tumours, we observed TP53 mutations in 71% of tumours."
    explanation: >-
      Quantifies the near-universal TP53 mutation that permits the tolerated aneuploidy
      defining this class.
# ---------------- Hereditary axis ----------------
- name: HDGC
  display_name: Hereditary diffuse gastric cancer (germline CDH1/CTNNA1)
  classification: hereditary
  description: >-
    Autosomal dominant syndrome caused by inactivating germline CDH1 variants, and in a
    minority of families CTNNA1, characterised by diffuse gastric cancer and lobular
    breast cancer. Distinct from the somatic diffuse-type subtype above because the
    first hit is constitutional in every gastric epithelial cell, which is what makes
    risk-reducing total gastrectomy a coherent - and recommended - intervention.
  subtype_term:
    preferred_term: hereditary diffuse gastric adenocarcinoma
    term:
      id: MONDO:0007648
      label: hereditary diffuse gastric adenocarcinoma
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  - preferred_term: CTNNA1
    term:
      id: hgnc:2509
      label: CTNNA1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    penetrance_percentage: "13-19% cumulative lifetime risk of advanced diffuse gastric cancer"
    expressivity: VARIABLE
    description: >-
      Age-dependent and family-dependent incomplete penetrance. Including less-selected
      families, cumulative lifetime risk of advanced diffuse gastric cancer in CDH1
      carriers is now estimated at 13-19%, well below older high-risk-family estimates
      of roughly 42% in men and 33% in women. CTNNA1 is moderate-penetrance: gastric
      cancer risk is about 7-fold over population baseline versus 38-fold for CDH1.
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary diffuse gastric cancer (HDGC) is an autosomal dominant cancer syndrome that is characterised by a high prevalence of diffuse gastric cancer and lobular breast cancer."
    explanation: >-
      IGCLC definition of HDGC, its inheritance mode and its two-tumour phenotype.

inheritance:
- name: Sporadic (multifactorial)
  description: >-
    The overwhelming majority of gastric adenocarcinoma is sporadic and multifactorial,
    driven by H. pylori infection, diet, smoking and age acting on a polygenic
    background. Roughly 10% shows familial clustering, and only about 1-3% is
    attributable to a recognised high-penetrance hereditary syndrome.
  evidence:
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Helicobacter pylori is a Gram-negative bacterium that inhabits the gastric environment of 60.3% of the world's population and represents the main risk factor for the onset of gastric neoplasms."
    explanation: >-
      Supports the sporadic/multifactorial framing: an acquired environmental exposure,
      not an inherited variant, is the main driver of gastric neoplasia. The precise
      1-3% hereditary fraction is not quantified by this abstract, hence PARTIAL.
- name: Autosomal dominant (hereditary syndromes)
  description: >-
    The hereditary fraction is dominated by autosomal dominant syndromes: hereditary
    diffuse gastric cancer (CDH1, CTNNA1), Lynch syndrome (MLH1/MSH2/MSH6/PMS2),
    juvenile polyposis (SMAD4), familial adenomatous polyposis and gastric
    adenocarcinoma and proximal polyposis of the stomach (APC), Peutz-Jeghers
    syndrome (STK11) and Li-Fraumeni syndrome (TP53).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32758476
    reference_title: "Hereditary diffuse gastric cancer: updated clinical practice guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is largely caused by inactivating germline mutations in the tumour suppressor gene CDH1, although pathogenic variants in CTNNA1 occur in a minority of families with HDGC."
    explanation: >-
      Establishes the two autosomal dominant HDGC genes; HDGC is the archetype of the
      dominant hereditary route to gastric adenocarcinoma.

stages:
- name: Localized
  description: >-
    Resectable disease confined to the stomach and regional nodes, treated
    with endoscopic resection, gastrectomy with D2 lymphadenectomy, and
    perioperative chemotherapy.
- name: Metastatic
  description: >-
    Advanced gastric adenocarcinoma with peritoneal, hepatic, nodal, or other
    distant spread. Peritoneal dissemination is a key metastatic route,
    particularly in diffuse and CDH1-disrupted disease; liver metastasis is
    also common, while HER2-positive and MSI-high subsets define biologically
    distinct metastatic states.
  notes: >-
    Folded in from the former Metastatic_Gastric_Cancer entry (cancer
    granularity ladder, design decisions §3a).
  evidence:
  - reference: PMID:34389165
    reference_title: "Palliative gastrectomy for metastatic gastric adenocarcinoma: A national population-based cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median survival was 6.1 months, and 5-year survival was 4% in the entire cohort.
    explanation: Provides a survival estimate for the metastatic stage of gastric adenocarcinoma.
pathophysiology:
# ================= ROUTE A: intestinal type / Correa cascade =================
- name: Helicobacter pylori Chronic Active Gastritis
  biological_scale: TISSUE
  role: trigger
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  description: >-
    Persistent colonisation of the gastric mucosa by Helicobacter pylori establishes a
    lifelong, non-resolving active gastritis. The organism cannot be cleared by the
    host response it provokes, so the inflammatory stimulus is indefinite - exactly the
    persistent, non-resolving inflammatory driver pattern the tumor-promoting
    inflammation module abstracts, and which that module names H. pylori gastritis
    preceding gastric cancer as an archetype of. This is the initiating step of the
    Correa cascade and the dominant cause of non-cardia gastric adenocarcinoma.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: gastric epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  downstream:
  - target: CagA and VacA Virulence Factor Delivery
    description: >-
      Colonising cag-pathogenicity-island-positive strains inject effector proteins
      into the gastric epithelium.
  - target: Pro-Tumorigenic Gastric Inflammatory Microenvironment
    description: >-
      Persistent infection recruits and activates a myeloid-rich mucosal infiltrate.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori."
    explanation: >-
      Correa's original formulation places H. pylori infection at the initiating
      gastritis stage of the cascade.
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Helicobacter pylori is a Gram-negative bacterium that inhabits the gastric environment of 60.3% of the world's population and represents the main risk factor for the onset of gastric neoplasms."
    explanation: >-
      Establishes H. pylori as the principal risk factor for gastric neoplasia and the
      scale of the exposed population.

- name: CagA and VacA Virulence Factor Delivery
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    Strains carrying the cag pathogenicity island use a type IV secretion system to
    translocate the CagA oncoprotein into gastric epithelial cells, where it is tyrosine
    phosphorylated and acts as a promiscuous pathological scaffold, simultaneously
    engaging multiple host signalling pathways and deranging proliferation,
    differentiation and apoptosis. The vacuolating cytotoxin VacA contributes
    independently to epithelial injury. Because transformation, once established, no
    longer requires the oncoprotein, CagA is described as acting by a hit-and-run
    mechanism - a mechanistically important caveat, since it means CagA positivity in
    an established tumour is not required for CagA to have caused it. Note the
    `protein tyrosine kinase activity` annotation on this node refers to the HOST
    kinases (SRC, ABL) that phosphorylate the translocated CagA EPIYA motifs; CagA
    itself is the substrate, not a kinase.
  molecular_functions:
  - preferred_term: host SRC/ABL kinase activity phosphorylating CagA
    modifier: INCREASED
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  cell_types:
  - preferred_term: gastric epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  downstream:
  - target: Pro-Tumorigenic Gastric Inflammatory Microenvironment
    description: >-
      CagA-driven epithelial signalling amplifies mucosal cytokine output.
  - target: Atrophic Gastritis and Achlorhydria
    description: >-
      Sustained epithelial injury and inflammation destroy oxyntic glands.
  evidence:
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CagA is the most important virulence factor in H. pylori, and is a translocated oncoprotein that induces morphofunctional modifications in gastric epithelial cells and a chronic inflammatory response that increases the risk of developing precancerous lesions."
    explanation: >-
      Establishes CagA as a translocated oncoprotein linking infection to epithelial
      derangement and precancerous change.
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon translocation and tyrosine phosphorylation, CagA moves to the cell membrane and acts as a pathological scaffold protein that simultaneously interacts with multiple intracellular signaling pathways, thereby disrupting cell proliferation, differentiation and apoptosis."
    explanation: >-
      Specifies the molecular mechanism (tyrosine phosphorylation, scaffold function)
      captured by this node's molecular_function annotation.

- name: Pro-Tumorigenic Gastric Inflammatory Microenvironment
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory Microenvironment"
  description: >-
    The chronically infected mucosa accumulates macrophages, neutrophils and lymphocytes
    that sustain cytokine production (IL-1beta, IL-6, TNF), NF-kB and STAT3 signalling,
    and mutagenic reactive oxygen and nitrogen species. This is the organ-specific
    instance of the module's pro-tumorigenic inflammatory microenvironment: it supplies
    both the proliferative/survival drive and the genotoxic stress that convert
    persistent gastritis into a field at risk of transformation.
  biological_processes:
  - preferred_term: positive regulation of cytokine production
    modifier: INCREASED
    term:
      id: GO:0001819
      label: positive regulation of cytokine production
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  downstream:
  - target: Atrophic Gastritis and Achlorhydria
    description: >-
      Sustained inflammatory injury destroys oxyntic (acid-secreting) glands.
  evidence:
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All these alterations in cell biology increase the risk of damaged cells acquiring pro-oncogenic genetic changes."
    explanation: >-
      Links the CagA-driven inflammatory/epithelial derangement to acquisition of
      oncogenic genetic change, the output of this node. Support is PARTIAL: the review
      does not itemise the macrophage/neutrophil infiltrate or the specific
      IL-1beta/IL-6/TNF, NF-kB and STAT3 mediators named in the description, which are
      taken from the conserved module rather than from this source.

- name: Atrophic Gastritis and Achlorhydria
  biological_scale: TISSUE
  role: mediator
  description: >-
    Progressive loss of oxyntic glands (parietal and chief cells) produces multifocal
    atrophic gastritis with reduced or absent gastric acid secretion. Achlorhydria
    removes the stomach's principal antimicrobial barrier, permitting overgrowth of
    nitrate-reducing bacteria and altering the gastric microbiota, which in turn
    increases intragastric nitrosation and N-nitroso compound exposure. This is the
    step at which the mucosa commits to the metaplastic pathway.
  biological_processes:
  - preferred_term: gastric acid secretion
    modifier: DECREASED
    term:
      id: GO:0001696
      label: gastric acid secretion
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  downstream:
  - target: Gastric Intestinal Metaplasia
    description: >-
      The atrophic, achlorhydric mucosa is replaced by intestinal-type epithelium.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The intermediate stages have been associated with the ingestion of ascorbic acid and nitrate, determinants of intragastric nitrosation."
    explanation: >-
      Correa links the intermediate (atrophy/metaplasia) stages to intragastric
      nitrosation. Support is PARTIAL: the abstract places atrophy in the sequence and
      implicates nitrosation, but does not itself document achlorhydria, loss of the
      antimicrobial barrier, or nitrate-reducing bacterial overgrowth, which are
      asserted in the node description on textbook grounds.

- name: Gastric Intestinal Metaplasia
  biological_scale: TISSUE
  role: mediator
  description: >-
    The gastric mucosal epithelium is replaced by intestinal-type epithelium containing
    goblet and absorptive cells. Intestinal metaplasia is the defining precancerous
    lesion of the intestinal route and the point at which H. pylori eradication begins
    to lose its preventive efficacy - the mechanistic basis for the guideline emphasis
    on eradicating before advanced precancerous change.
  cell_types:
  - preferred_term: gastric goblet cell
    term:
      id: CL:1000313
      label: gastric goblet cell
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  downstream:
  - target: Gastric Dysplasia
    description: >-
      Metaplastic epithelium accumulates further genetic and epigenetic hits and
      becomes cytologically and architecturally atypical.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
    explanation: >-
      The canonical statement of the Correa cascade, placing intestinal metaplasia
      between atrophy and dysplasia.

- name: Gastric Dysplasia
  biological_scale: TISSUE
  role: mediator
  description: >-
    Unequivocally neoplastic but non-invasive epithelium confined by the basement
    membrane, graded low or high. High-grade dysplasia carries substantial short-term
    risk of progression and is the principal target of endoscopic surveillance and
    endoscopic resection. This node is also where the juvenile polyposis route enters
    the graph: germline SMAD4 loss produces gastric polyposis whose hamartomatous polyps
    are the substrate for dysplastic change and subsequent malignancy, a risk not shared
    by BMPR1A carriers.
  genes:
  - preferred_term: SMAD4
    term:
      id: hgnc:6770
      label: SMAD4
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  downstream:
  - target: Intestinal-Type Invasive Adenocarcinoma
    description: >-
      Dysplastic epithelium breaches the basement membrane and invades the lamina
      propria and beyond.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic gastritis; atrophy; intestinal metaplasia; and dysplasia"
    explanation: >-
      Places dysplasia as the terminal preinvasive stage of the Correa sequence.

- name: Intestinal-Type Invasive Adenocarcinoma
  biological_scale: TISSUE
  role: consequence
  description: >-
    Gland-forming carcinoma invading through the basement membrane into the lamina
    propria, submucosa and, in advanced disease, the muscularis propria and serosa.
    This is the terminal step of the Correa cascade and the histology most strongly
    coupled to the chromosomal-instability molecular class.
  cell_types:
  - preferred_term: glandular epithelial cell of stomach
    term:
      id: CL:0002659
      label: glandular epithelial cell of stomach
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Chromosomal Instability and Aneuploidy
    description: >-
      Intestinal-type tumours preferentially evolve along the aneuploid CIN trajectory.
  - target: Peritoneal Dissemination and Distant Metastasis
    description: >-
      Invasive carcinoma penetrates the serosa and disseminates.
  - target: Stomach cancer
    description: >-
      Invasive glandular carcinoma of the stomach is the defining neoplastic phenotype.
  - target: Epigastric pain
    description: >-
      Mucosal and mural involvement produces epigastric pain and dyspepsia.
  - target: Gastrointestinal hemorrhage
    description: >-
      Tumour ulceration erodes mucosal vessels, causing occult or overt bleeding.
  - target: Iron deficiency anemia
    description: >-
      Chronic occult blood loss from the ulcerated tumour depletes iron stores.
  - target: Dysphagia
    description: >-
      Proximal (cardia) tumours obstruct the gastric inlet and impair swallowing.
  evidence:
  - reference: PMID:15668283
    reference_title: 'Amplification of HER-2 in gastric carcinoma: association with Topoisomerase IIalpha gene amplification, intestinal type, poor prognosis and sensitivity to trastuzumab.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: HER-2/neu amplification is common in the intestinal type of gastric carcinoma, and it is associated with a poor outcome.
    explanation: 'Confirms intestinal-type carcinoma as a distinct, clinically consequential histology in this disease. Support is PARTIAL: the finding is about HER2 enrichment within that histology, not about the invasive transition this node models.'
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
    explanation: >-
      Anchors the multistep human model leading up to this node. Support is PARTIAL
      because Correa's staged sequence terminates at dysplasia and does not itself
      assert the invasive-carcinoma endpoint.

# ================= ROUTE B: diffuse type / CDH1 =================
- name: CDH1 Inactivation and E-cadherin Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic inactivation of CDH1 abolishes E-cadherin, the transmembrane
    calcium-dependent adhesion molecule of the epithelial adherens junction. In
    hereditary diffuse gastric cancer the first hit is a germline truncating variant
    present in every gastric epithelial cell and the second hit is most often CDH1
    promoter hypermethylation (or loss of heterozygosity, or somatic mutation); in
    sporadic diffuse cancer both hits are somatic. Germline CTNNA1 truncating variants
    produce the mechanistically equivalent lesion one step down the junction, by
    nonsense-mediated decay of the alpha-E-catenin transcript, but with lower penetrance.
  gene:
    preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  - preferred_term: CTNNA1
    term:
      id: hgnc:2509
      label: CTNNA1
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  cellular_components:
  - preferred_term: adherens junction
    term:
      id: GO:0005912
      label: adherens junction
  downstream:
  - target: Loss of Epithelial Cohesion and Signet Ring Cell Formation
    description: >-
      Without E-cadherin, epithelial cells fail to maintain junctional contacts and
      detach individually from the epithelial sheet.
  - target: Breast carcinoma
    description: >-
      The same adherens-junction lesion acts in breast epithelium, where E-cadherin
      loss produces the lobular breast carcinoma of hereditary diffuse gastric cancer.
  evidence:
  - reference: PMID:9537325
    reference_title: "E-cadherin germline mutations in familial gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the E-cadherin gene revealed a G --> T nucleotide substitution in the donor splice consensus sequence of exon 7, leading to a truncated gene product."
    explanation: >-
      The founding observation identifying a truncating germline E-cadherin (CDH1)
      variant as the cause of hereditary diffuse gastric cancer.
  - reference: PMID:40998418
    reference_title: "Hereditary diffuse gastric cancer spectrum associated with germline CTNNA1 loss of function revealed by clinical and molecular data from 351 carrier families and over 37 000 non-carrier controls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTNNA1-truncating transcripts are degraded by nonsense-mediated mRNA decay (NMD), and DGCs from germline CTNNA1-truncating carriers lose αE-catenin."
    explanation: >-
      Establishes the loss-of-function mechanism for the CTNNA1 arm - NMD of truncating
      transcripts causing alpha-E-catenin loss at the same adherens junction.

- name: Loss of Epithelial Cohesion and Signet Ring Cell Formation
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "invasion_and_metastasis#Epithelial-Mesenchymal Transition Activation"
  description: >-
    Loss of E-cadherin releases cells from the epithelial sheet, disrupting apicobasal
    polarity, mitotic spindle orientation and anoikis control. Detached cells accumulate
    intracytoplasmic mucin that displaces the nucleus to the periphery, producing the
    signet-ring morphology. This node conforms to the module's EMT-activation node
    because E-cadherin loss is that node's canonical initiating lesion, but the
    conformance is deliberately scoped to the cadherin-loss / loss-of-adhesion arm only:
    diffuse gastric cancer loses E-cadherin structurally (mutation, promoter
    hypermethylation, LOH) rather than by SNAIL/SLUG/ZEB/TWIST-driven transcriptional
    repression, and does not execute a complete mesenchymal programme. The node
    therefore annotates only decreased cell-cell adhesion, NOT GO:0001837 epithelial to
    mesenchymal transition, which would overstate the biology.
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  cell_types:
  - preferred_term: gastric epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  downstream:
  - target: Diffuse Infiltrative Growth and Linitis Plastica
    description: >-
      Non-cohesive cells permeate the gastric wall singly and in small clusters rather
      than forming a discrete mass.
  evidence:
  - reference: PMID:41710815
    reference_title: E-Cadherin Immunohistochemical Expression in Gastrointestinal Adenocarcinomas and Its Association With Histological and Prognostic Parameters.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Loss of E-cadherin expression in advanced tumor stages, higher nodal metastasis, and perineural invasion elucidate the role of E-cadherin as a useful prognostic immunohistochemical marker in gastrointestinal adenocarcinomas.
    explanation: This supports a direct relationship between E-cadherin loss and invasive metastatic behavior.
  - reference: PMID:9537325
    reference_title: "E-cadherin germline mutations in familial gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diminished E-cadherin expression is associated with aggressive, poorly differentiated carcinomas."
    explanation: >-
      Ties reduced E-cadherin expression directly to the aggressive, poorly
      differentiated phenotype that this node models as loss of epithelial cohesion.
  - reference: PMID:39379994
    reference_title: "Current advances and challenges in Managing Hereditary Diffuse Gastric Cancer (HDGC): a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "almost every PTG specimen shows the presence of small low-stage (pT1a) signet ring cell (SRC) lesions of which the behaviour is unpredictable"
    explanation: >-
      Demonstrates that signet-ring-cell foci are the near-universal early cellular
      consequence of germline CDH1 loss, and that their progression is stochastic.

- name: RHOA Gain-of-Function and CLDN18-ARHGAP Fusion
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    A quarter of diffuse gastric carcinomas carry recurrent gain-of-function RHOA
    hotspot mutations (Tyr42, Arg5, Gly17); others carry CLDN18-ARHGAP fusions that
    disable RHO-family GTPase-activating proteins. Both converge on deregulated RHO
    signalling, which sustains survival of non-adherent cells and drives the
    infiltrative, stroma-inducing phenotype. These lesions define the genomically
    stable TCGA class and are essentially absent from intestinal-type tumours.
  gene:
    preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  genes:
  - preferred_term: RHOA
    term:
      id: hgnc:667
      label: RHOA
  - preferred_term: CLDN18
    term:
      id: hgnc:2039
      label: CLDN18
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: ABNORMAL
    term:
      id: GO:0003924
      label: GTPase activity
  downstream:
  - target: Diffuse Infiltrative Growth and Linitis Plastica
    description: >-
      Deregulated RHO signalling amplifies the infiltrative, stroma-inducing growth
      pattern.
  evidence:
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RHOA mutation was observed in 25.3% (22/87) of DGCs, with mutational hotspots affecting the Tyr42, Arg5 and Gly17 residues in RHOA protein."
    explanation: >-
      Quantifies RHOA mutation frequency in diffuse gastric carcinoma and identifies the
      specific hotspot residues.
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several lines of functional evidence indicated that mutant RHOA works in a gain-of-function manner."
    explanation: >-
      Establishes the gain-of-function (rather than loss-of-function) direction of the
      RHOA lesion asserted by this node.

- name: Diffuse Infiltrative Growth and Linitis Plastica
  biological_scale: TISSUE
  role: consequence
  conforms_to: "invasion_and_metastasis#Local Invasion and Intravasation"
  description: >-
    Non-cohesive tumour cells permeate the gastric wall diffusely, provoking a dense
    desmoplastic stromal reaction. When the process is extensive the stomach becomes a
    rigid, thickened, non-distensible leather-bottle organ - linitis plastica. Because
    there is often no exophytic mass and the overlying mucosa can appear intact,
    endoscopic biopsy is falsely negative more often than in intestinal-type disease,
    contributing to late diagnosis and poor prognosis.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Peritoneal Dissemination and Distant Metastasis
    description: >-
      Serosal penetration by non-cohesive cells seeds the peritoneal cavity, the
      characteristic route of spread for diffuse-type disease.
    evidence:
    - reference: PMID:34650801
      reference_title: Clinical significance of coexisting histological diffuse type in stage II/III gastric cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A pathological diagnosis of Sig was an independent risk factor for peritoneal recurrence in patients with stage II/III gastric cancer.
      explanation: Signet-ring histology, the morphological expression of E-cadherin loss, was an independent risk factor for peritoneal recurrence in a 968-patient resection cohort.
    - reference: PMID:34650801
      reference_title: Clinical significance of coexisting histological diffuse type in stage II/III gastric cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients with diffuse type had peritoneal recurrence more frequently than patients with intestinal type, whereas intestinal type had more hepatic recurrence caused by venous infiltration than diffuse type.
      explanation: Contrasts the two Lauren routes directly, showing peritoneal recurrence to be the diffuse-type pattern that this edge asserts.
  - target: Stomach cancer
    description: >-
      Diffuse infiltrative carcinoma is the second route to the defining neoplastic
      phenotype.
  - target: Early satiety
    description: >-
      Transmural infiltration with desmoplasia stiffens the gastric wall and reduces
      compliance, limiting the volume tolerated per meal.
  - target: Weight loss
    description: >-
      Reduced gastric capacity and impaired intake drive progressive weight loss.
  evidence:
  - reference: PMID:24816255
    reference_title: "Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse-type gastric carcinoma (DGC) is characterized by a highly malignant phenotype with prominent infiltration and stromal induction."
    explanation: >-
      Directly describes the infiltrative growth with stromal induction that constitutes
      this node.

# ================= SHARED OUTCOME =================
- name: Peritoneal Dissemination and Distant Metastasis
  biological_scale: ORGANISM
  role: outcome
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    Both Lauren routes converge on dissemination. Transcoelomic spread after serosal
    penetration seeds the peritoneum and omentum (and, classically, the ovaries as
    Krukenberg tumours); lymphatic spread involves perigastric and distant nodes; and
    haematogenous spread reaches liver, lung and bone. Peritoneal carcinomatosis is the
    dominant and most treatment-refractory pattern in diffuse-type disease and defines
    incurability. Formerly curated in a separate Metastatic_Gastric_Cancer entry, now folded into this entry (design decisions §3a).
  biological_processes:
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  downstream:
  - target: Tumor Immune Evasion and Checkpoint Engagement
    description: >-
      Disseminated tumour deposits persist by engaging inhibitory immune checkpoints.
  - target: Ascites
    description: >-
      Peritoneal carcinomatosis obstructs lymphatic drainage and exudes fluid,
      producing malignant ascites.
  - target: Weight loss
    description: >-
      Disseminated disease drives cancer cachexia with progressive weight loss.
  evidence:
  - reference: PMID:25088196
    reference_title: Tks5 activation in mesothelial cells creates invasion front of peritoneal carcinomatosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The peritoneal dissemination of gastric cancer was significantly increased by mixing cancer cells and PMCs, and was suppressed by knockdown of Tks5 in PMCs.
    explanation: Model data supports a direct role for mesothelial cell interactions in establishing peritoneal gastric cancer implants.
  - reference: PMID:39023829
    reference_title: "SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peritoneal metastases are present in almost 20% of GC at"
    explanation: >-
      Quantifies peritoneal dissemination as present in almost 20% of gastric cancers
      already at diagnosis - direct support for transcoelomic spread as the dominant
      and clinically decisive metastatic route modelled by this node.

# ================= TCGA MOLECULAR CLASS NODES =================
- name: EBV-Driven Hypermethylation and Checkpoint Ligand Amplification
  biological_scale: MOLECULAR
  role: driver
  description: >-
    In roughly 9% of gastric adenocarcinomas, clonal Epstein-Barr virus infection of the
    tumour epithelium drives an extreme CpG island methylator phenotype that silences
    tumour-suppressor loci, together with recurrent PIK3CA mutation and amplification of
    JAK2, CD274 (PD-L1) and PDCD1LG2 (PD-L2). The PD-L1/PD-L2 amplification is the
    mechanistically important part: it makes checkpoint ligand overexpression a
    structural genomic feature rather than an inducible response, which is the rationale
    for prioritising checkpoint blockade in this class. Loss of the SWI/SNF chromatin
    remodeller ARID1A (mutated in 55% of EBV-positive tumours) cooperates with the
    methylator phenotype in this epigenetic reprogramming, while TP53 mutation - dominant
    in the CIN class - is characteristically rare here.
  genes:
  - preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  - preferred_term: CD274
    term:
      id: hgnc:17635
      label: CD274
  - preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: INCREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  downstream:
  - target: Tumor Immune Evasion and Checkpoint Engagement
    description: >-
      Amplified PD-L1/PD-L2 directly engages PD-1 on tumour-infiltrating T cells.
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations, extreme DNA hypermethylation, and amplification of JAK2, CD274 (also known as PD-L1) and PDCD1LG2 (also known as PD-L2)"
    explanation: >-
      TCGA defines all three features of this node - PIK3CA mutation, extreme
      hypermethylation, and PD-L1/PD-L2 amplification - in EBV-positive tumours.

- name: Mismatch Repair Deficiency and Microsatellite Instability
  biological_scale: MOLECULAR
  role: driver
  conforms_to: "genome_instability_mutation#Genome-Maintenance Defect or Replication Stress"
  description: >-
    Loss of DNA mismatch repair - usually by sporadic MLH1 promoter hypermethylation,
    less often by a germline Lynch syndrome variant - produces a hypermutated,
    microsatellite-unstable genome. The resulting frameshift neoantigen load makes these
    tumours the most immunotherapy-responsive gastric cancers. This conforms to the
    genome-instability module's mutator-phenotype node, which explicitly covers the
    hypermutated / microsatellite-unstable genome (MMR loss) manifestation.
  genes:
  - preferred_term: MLH1
    term:
      id: hgnc:7127
      label: MLH1
  - preferred_term: MSH2
    term:
      id: hgnc:7325
      label: MSH2
  biological_processes:
  - preferred_term: mismatch repair
    modifier: DECREASED
    term:
      id: GO:0006298
      label: mismatch repair
  downstream:
  - target: Tumor Immune Evasion and Checkpoint Engagement
    description: >-
      Hypermutation generates abundant neoantigens, provoking a T-cell response that the
      tumour must then restrain via checkpoint engagement.
  evidence:
  - reference: PMID:37271124
    reference_title: 'Performance of Immunohistochemical and Molecular Methods in Detecting Microsatellite Instability in Gastric Cancer: A Multicenter Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Microsatellite instability (MSI) is an important prognostic molecular biomarker for gastric cancer (GC).
    explanation: This supports MSI as a biologically and clinically important gastric cancer state.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microsatellite unstable tumours, which show elevated mutation rates, including mutations of genes encoding targetable oncogenic signalling proteins"
    explanation: >-
      TCGA characterisation of the MSI class as hypermutated with targetable
      consequences.

- name: Chromosomal Instability and Aneuploidy
  biological_scale: MOLECULAR
  role: driver
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    The genome-instability arm of the largest TCGA class. Near-universal TP53 mutation
    disables the checkpoint that would otherwise eliminate cells with missegregated
    chromosomes, permitting tolerated aneuploidy and widespread somatic copy-number
    alteration. Enriched in intestinal histology and at the gastroesophageal junction.
    This node is deliberately kept separate from the receptor-tyrosine-kinase
    amplification it enables, because the two are distinct mechanistic claims and only
    the latter is druggable - a drug that blocks HER2 does not correct chromosomal
    instability.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  downstream:
  - target: Receptor Tyrosine Kinase Amplification
    description: >-
      Copy-number instability generates the focal high-level amplifications of receptor
      tyrosine kinase loci that characterise this class.
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and tumours with chromosomal instability, which show marked aneuploidy"
    explanation: >-
      TCGA definition of the aneuploidy that characterises the CIN class.
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the CIN tumours, we observed TP53 mutations in 71% of tumours."
    explanation: >-
      Quantifies the TP53 loss that permits the tolerated aneuploidy asserted here.

- name: Receptor Tyrosine Kinase Amplification
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  description: >-
    Focal high-level amplification of receptor tyrosine kinase loci - ERBB2/HER2 most
    importantly, but also EGFR, MET and FGFR2 - generated by the underlying chromosomal
    instability. Unlike the aneuploidy that produces them, these amplifications are
    directly druggable, and this node is the actual molecular target of trastuzumab and
    of bemarituzumab. It is the mechanistic reason HER2, and now FGFR2b, testing is
    mandatory in advanced disease.
  genes:
  - preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  - preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  biological_processes:
  - preferred_term: ERBB2 signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038128
      label: ERBB2 signaling pathway
  downstream:
  - target: Peritoneal Dissemination and Distant Metastasis
    description: >-
      RTK-driven proliferation and survival support progression to disseminated disease.
  evidence:
  - reference: PMID:25079317
    reference_title: "Comprehensive molecular characterization of gastric adenocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "focal amplification of receptor tyrosine kinases"
    explanation: >-
      TCGA identifies focal receptor-tyrosine-kinase amplification as the druggable
      feature of the chromosomally unstable class.
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "their tumours showed overexpression of HER2 protein by immunohistochemistry or gene amplification by fluorescence in-situ hybridisation"
    explanation: >-
      Confirms HER2 amplification/overexpression as a measurable, therapeutically
      actionable lesion - the property that makes this node a therapeutic vulnerability.

- name: Angiogenic Switch and VEGF-Driven Neovascularization
  biological_scale: TISSUE
  role: therapeutic_vulnerability
  conforms_to: "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization"
  description: >-
    Growing gastric tumours outstrip their blood supply and switch to a pro-angiogenic
    phenotype, secreting VEGF-A that engages VEGFR2 (KDR) on tumour endothelium to drive
    neovascularization. This is the organ-specific instance of the tumour-angiogenesis
    module's central effector, and it is the target of the anti-VEGFR2 antibody
    ramucirumab, which is licensed second-line in advanced gastric adenocarcinoma.
  genes:
  - preferred_term: VEGFA
    term:
      id: hgnc:12680
      label: VEGFA
  - preferred_term: KDR
    term:
      id: hgnc:6307
      label: KDR
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: vascular endothelial growth factor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038084
      label: vascular endothelial growth factor signaling pathway
  downstream:
  - target: Peritoneal Dissemination and Distant Metastasis
    description: >-
      Tumour neovascularization sustains growth and provides the haematogenous route for
      dissemination.
  evidence:
  - reference: PMID:32439934
    reference_title: Omental adipocytes promote peritoneal metastasis of gastric cancer through the CXCL2-VEGFA axis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Conditioned media derived from OmAd (OmAd-CM) promoted the proliferation, migration and capacity to induce angiogenesis of GC cells through AKT phosphorylation and VEGFA overexpression, whereas silencing CXCL2 in OmAd cancelled OmAd-induced effects.
    explanation: Coculture data shows stromal adipocyte signals can promote angiogenesis and migratory behavior in gastric cancer cells.
  - reference: PMID:32439934
    reference_title: Omental adipocytes promote peritoneal metastasis of gastric cancer through the CXCL2-VEGFA axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In an orthotopic tumour model using SCID mice, omentectomy suppressed GC growth and peritoneal dissemination, and reduced serum levels of CXCL2.
    explanation: Orthotopic mouse data links omental stromal support to metastatic outgrowth and peritoneal dissemination.
  - reference: PMID:32861308
    reference_title: "Gastric cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ramucirumab (anti-angiogenic second line)"
    explanation: >-
      Establishes anti-angiogenic therapy as a licensed treatment class in gastric
      cancer, i.e. that VEGF-driven neovascularization is a validated, druggable node.
  - reference: PMID:25240821
    reference_title: "Ramucirumab plus paclitaxel versus placebo plus paclitaxel in patients with previously treated advanced gastric or gastro-oesophageal junction adenocarcinoma (RAINBOW): a double-blind, randomised phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VEGFR-2 has a role in gastric cancer pathogenesis and progression."
    explanation: >-
      States the role of VEGFR2 in gastric cancer pathogenesis, the premise of this
      node and of the ramucirumab indication built on it.

- name: Tumor Immune Evasion and Checkpoint Engagement
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  description: >-
    Tumour and stromal PD-L1 expression - constitutive in EBV-amplified tumours,
    interferon-induced in the neoantigen-rich MSI class - engages PD-1 on
    tumour-infiltrating CD8-positive T cells and restrains their cytotoxic function.
    Quantified clinically as the PD-L1 combined positive score (CPS), this is the
    directly actionable node: blocking the PD-1/PD-L1 axis with pembrolizumab or
    nivolumab added to chemotherapy improves survival, with benefit concentrated at
    higher CPS and in MSI-high disease.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: negative regulation of T cell mediated immunity
    modifier: INCREASED
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
  genes:
  - preferred_term: CD274
    term:
      id: hgnc:17635
      label: CD274
  evidence:
  - reference: PMID:37875143
    reference_title: "Pembrolizumab plus chemotherapy versus placebo plus chemotherapy for HER2-negative advanced gastric cancer (KEYNOTE-859): a multicentre, randomised, double-blind, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants in the pembrolizumab plus chemotherapy group had a significant and clinically meaningful improvement in overall survival with manageable toxicity compared with participants in the placebo plus chemotherapy group."
    explanation: >-
      Therapeutic proof that the PD-1/PD-L1 axis modelled by this node is a functional
      immune brake in gastric adenocarcinoma - blocking it improves survival.
  - reference: PMID:39409957
    reference_title: "Systemic Therapy of Gastric Cancer-State of the Art and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is essential to determine biomarkers such as HER2 expression, PD-L1 combined positive score (CPS) (combined positive score), Claudin 18.2, and microsatellite instability (MSI)"
    explanation: >-
      Establishes PD-L1 CPS and MSI as mandatory decision biomarkers, i.e. that this
      node is clinically measured and acted upon.


name: ATP6AP2-Related Disorder
category: Mendelian
creation_date: "2026-11-26T18:30:00Z"
synonyms:
- ATP6AP2-related disorder
- ATP6AP2 deficiency
description: >-
  An X-linked disorder caused by hypomorphic variants in ATP6AP2, which encodes an
  accessory subunit and endoplasmic-reticulum assembly factor of the vacuolar H+-ATPase
  (and, in a separate context, the (pro)renin receptor). Complete loss of ATP6AP2 is not
  compatible with life, so only partial-loss alleles reach the clinic, and the class of
  allele rather than the identity of the disease decides which organ fails. Variants
  that promote skipping of exon 4 halve the full-length transcript and produce the
  neurological presentations — syndromic intellectual disability with epilepsy, and
  parkinsonism with spasticity — while missense variants in the luminal extracellular
  domain destabilise the protein and break its interaction with ATP6AP1, producing a
  congenital disorder of glycosylation with hepatopathy, immunological abnormality and
  cutis laxa. All converge on one mechanism: impaired assembly of the V-ATPase V0 sector
  in the ER, then defective organelle acidification, reduced mTOR signalling and
  autophagic misregulation.
disease_term:
  preferred_term: ATP6AP2-related disorder
  term:
    id: MONDO:0100146
    label: ATP6AP2-related disorder
parents:
- X-linked syndromic intellectual disability
notes: >-
  Scope, and why the three ATP6AP2 phenotypes are not all modelled here. ATP6AP2 maps to
  three OMIM phenotype entries, and the two authorities disagree about whether they are
  one disease. The ClinGen Intellectual Disability and Autism Gene Curation Expert Panel
  curates a single gene-disease relationship, named ATP6AP2-related disorder and keyed on
  this entry's own MONDO term, and names all three OMIM phenotypes as its manifestations;
  that assertion is quoted in the genetic record. MONDO splits them, and splits them
  unevenly: MONDO:0100146 has exactly two descendants, the two neurological entities,
  while the glycosylation phenotype sits at MONDO:0026765 under congenital disorder of
  glycosylation type II, in the metabolic branch, with no path back to this term.
  dismech follows MONDO here, for a reason that is about this knowledge base rather than
  about the biology: the glycosylation phenotype is already curated as its own entry,
  Congenital_Disorder_of_Glycosylation_Type_IIr. So this entry's own scope is
  MONDO:0100146 as MONDO draws it, the two neurological entities, which are carried as
  real subtypes; and ATP6AP2-CDG is carried as a pointer subtype with `curated_in`, so
  the gene's third phenotype is discoverable from here without being modelled twice.
  Modelling it here as well would have duplicated that entry's phenotypes, hepatic
  mechanism and treatments, and left two records to keep in step.
  The two neurological entities are lumped, and that part is this entry's own call.
  Complete loss of ATP6AP2 function is effectively absent from population variation
  data, so every clinical allele is a hypomorph of the same gene. The two entities share
  their extrapyramidal and pyramidal features and differ mainly in whether a
  developmental and epileptic layer is present, which reads as one disease seen at two
  ages rather than as two diseases.
  The mechanism curated here is shared with the separately curated CDG entry, and that
  is deliberate rather than an oversight. Both run through impaired V-ATPase V0 assembly
  in the endoplasmic reticulum and defective organelle acidification; the entries differ
  below that point, where the allele class decides the organ. The glycosylation node is
  kept in this entry, rather than left to the CDG entry, because PMID:41131679 found the
  glycosylation abnormality in patients with purely neurological disease: on the
  neurological side it is a finding about these patients, not a borrowed feature of the
  hepatic phenotype. The organ specificity itself is recorded as an open question in
  discussions.
  Inheritance is recorded as X-linked rather than X-linked recessive. All three OMIM
  entries annotate X-linked recessive inheritance, but the 2025 series reports an
  affected heterozygous female with a milder phenotype, so the recessive qualifier is
  not safe for the disease as a whole; the more specific term would assert a pattern the
  current literature contradicts.
  A published abstract transposes two acronyms, and this entry does not follow it. The
  2025 report's abstract pairs "Hedera type" with the acronym XPDS and OMIM 300423, and
  "X-linked parkinsonism with spasticity" with MRXSH and OMIM 300911. MONDO:0010319,
  intellectual developmental disorder, X-linked, syndromic, Hedera type, carries the
  xref OMIM:300423, so the Hedera-type entry is 300423 and XPDS is 300911, which is the
  mapping used here. That sentence is quotable for its clinical content but not for its
  acronym-to-identifier pairing.
inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Hemizygous males are affected. Heterozygous females were long regarded as unaffected
    carriers, and all three OMIM entries annotate X-linked recessive inheritance, but an
    affected female with a milder phenotype has now been reported, plausibly through
    skewed X-inactivation.
  evidence:
  - reference: PMID:41131679
    reference_title: "ATP6AP2-Related Disease Caused by Splicing Defects: Abnormal Glycosylation and the First Affected Female."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heterozygous female has a milder phenotype"
    explanation: >-
      The report of an affected heterozygous female, which is why this entry binds
      X-linked inheritance rather than the X-linked recessive term the OMIM entries
      carry.

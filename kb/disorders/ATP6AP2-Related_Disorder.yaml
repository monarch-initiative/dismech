diagnosis:
- name: RNA or splicing analysis alongside gene panel sequencing
  description: >-
    Because the pathogenic alleles are predominantly synonymous or intronic variants
    acting on splicing, a filter that prioritises protein-altering variants will miss
    them. Splicing assays on patient material resolve the consequence that sequence
    alone does not.
  evidence:
  - reference: PMID:35779466
    reference_title: Reduced gene dosage is a common mechanism of neuropathologies caused by ATP6AP2 splicing mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All previously reported splicing mutations increase the level of a minor isoform with skipped exon 4"
    explanation: >-
      Establishes that the reported alleles act through splicing, which is why the
      diagnostic route has to measure splicing rather than infer it.
differential_diagnoses:
- name: ATP6AP1-related immunodeficiency with hepatopathy
  description: >-
    The partner subunit, and the closest mechanistic differential: ATP6AP1 and ATP6AP2
    act together in V0 assembly, and loss of either produces a glycosylation disorder
    with hepatopathy and immunodeficiency. ATP6AP1 is the glycosylated member of the
    pair.
- name: Other congenital disorders of glycosylation
  description: >-
    Any CDG presenting with hepatopathy and an abnormal transferrin isoform profile.
    ATP6AP2-CDG is distinguished by being secondary to Golgi under-acidification rather
    than to a defect in a glycosyltransferase or a sugar-donor pathway, and by its
    X-linked inheritance.
- name: X-linked dystonia-parkinsonism
  description: >-
    A separate X-linked parkinsonism caused by TAF1 variants, and a differential for the
    XPDS presentation on phenotype rather than on mechanism.
discussions:
- discussion_id: atp6ap2_allele_class_organ_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the class of hypomorphic ATP6AP2 allele determine which organ fails, when
    every class converges on the same impaired V-ATPase assembly and the same defective
    organelle acidification?
  rationale: >-
    This entry curates one mechanism reached by two molecular routes: splicing variants
    that halve full-length transcript, and extracellular-domain missense variants that
    destabilise the protein and break the ATP6AP1 interaction. Both end at impaired V0
    assembly, yet the first gives neurological disease and the second a hepatic and
    immunological one. Nothing in the curated chain distinguishes them downstream of the
    assembly step, so the organ specificity is unexplained by the mechanism as recorded.
    Two possibilities are open and untested: the routes may differ quantitatively, with
    the missense alleles leaving a different residual level of functional complex than
    the splicing alleles, or qualitatively, with loss of the ATP6AP1 partnership having
    consequences for glycosylation that a simple dosage reduction does not. The 2025
    finding of glycosylation abnormality in purely neurological patients argues against a
    clean separation and makes the quantitative reading more likely, without
    establishing it.
  attaches_to:
  - pathophysiology#Exon 4 Skipping and Reduced Full-Length Transcript
  - pathophysiology#Destabilised Extracellular Domain and Lost ATP6AP1 Binding
  - pathophysiology#Defective Organelle Acidification

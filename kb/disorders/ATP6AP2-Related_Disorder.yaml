pathophysiology:
- name: Hypomorphic ATP6AP2 Variant
  description: >-
    A partial-loss X-linked allele. Every pathogenic allele reported in this disease is
    a hypomorph rather than a null, and the class of allele sets which presentation
    follows. This entry does not assert a population-genetic reason for that, because no
    source cited here measures ATP6AP2 constraint; the claim is about the reported
    allele spectrum.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: ATP6AP2
    term:
      id: hgnc:18305
      label: ATP6AP2
  molecular_functions:
  - preferred_term: V-ATPase V0 assembly adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  downstream:
  - target: Aberrant Splicing and Reduced Full-Length Transcript
    causal_link_type: DIRECT
    description: >-
      The splicing-variant route, which produces the neurological presentations.
  - target: Destabilised Extracellular Domain and Lost ATP6AP1 Binding
    causal_link_type: DIRECT
    description: >-
      The missense route, which produces the glycosylation presentation.
  notes: >-
    The molecular function bound here is the adaptor activity ATP6AP2 provides during
    V-ATPase assembly, which is what the structural and cross-species genetic work cited
    below establishes. It is deliberately not a catalytic term: ATP6AP2 is an assembly
    factor and accessory subunit, not a catalytic subunit of the pump.
    On reduced dosage versus a dominant-negative effect. PMID:30985297 reports that the
    deficiencies in patient iPSC-derived neurons were rescued by expressing full-length
    ATP6AP2, and this entry models the disease as reduced dosage rather than as
    interference by the short isoform. That reading is an inference and is recorded here
    rather than on an evidence item: the abstract does not state that the short isoform
    was still present during the rescue, so the experiment as reported does not by itself
    exclude a dominant-negative contribution.
- name: Aberrant Splicing and Reduced Full-Length Transcript
  description: >-
    Splicing-modulating variants reduce the functional full-length transcript to roughly
    half. Which exon they act on varies, and the dosage reduction rather than any one
    exon is the general mechanism: the classic alleles of both neurological
    presentations raise a minor isoform lacking the exon-4-encoded residues, while
    c.168+6T>A acts on exon 2 and the 2025 series reports exon 5 skipping, exon 8
    skipping and a pseudoexon insertion. The resulting short isoforms are inert in the
    complex rather than toxic to it, so the pathogenic unit is the missing quantity of
    normal protein.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired V-ATPase V0 Assembly in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Less full-length protein means less assembly-competent adaptor.
  evidence:
  - reference: PMID:35779466
    reference_title: Reduced gene dosage is a common mechanism of neuropathologies caused by ATP6AP2 splicing mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "All previously reported splicing mutations increase the level of a minor isoform with skipped exon 4"
    explanation: >-
      Establishes the exon 4 isoform as the mechanism of the alleles reported before this
      study. Tagged BACKGROUND because the sentence sits in the abstract's background
      paragraph and describes other groups' alleles, which is also why it must not be
      read as this paper's own finding or as covering every allele now known.
  - reference: PMID:35779466
    reference_title: Reduced gene dosage is a common mechanism of neuropathologies caused by ATP6AP2 splicing mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "This results in out-of-frame splicing products and a reciprocal 50% reduction in functional full-length ATP6AP2 transcripts."
    explanation: >-
      Quantifies the dosage reduction, for the c.168+6T>A allele, which acts on exon 2
      rather than exon 4. Graded IN_VITRO because the paper's methods state the
      measurement was made by RNA-Seq and qRT-PCR on induced pluripotent stem cells from
      patients reprogrammed to neural progenitor cells. This is the item that shows the
      node is about dosage rather than about one exon.
  - reference: PMID:24223829
    reference_title: The role of individual domains and the significance of shedding of ATP6AP2/(pro)renin receptor in vacuolar H(+)-ATPase biogenesis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "was defective as a V-ATPase-associated protein"
    explanation: >-
      Shows the exon-4-deleted isoform fails as a V-ATPase-associated protein, which is
      why halving the full-length transcript is not compensated by the short isoform.
      This item is specifically about the exon 4 isoform, which is why it is kept beside
      the dosage items rather than replaced by them.
  - reference: PMID:35779466
    reference_title: Reduced gene dosage is a common mechanism of neuropathologies caused by ATP6AP2 splicing mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common pathogenic consequence of splicing mutations affecting inclusion of different ATP6AP2 exons is reduction of the functional full-length transcript."
    explanation: >-
      The paper's own conclusion, and the sentence this node is named for: the shared
      mechanism is loss of full-length transcript across alleles acting on different
      exons, not skipping of any one exon.
- name: Destabilised Extracellular Domain and Lost ATP6AP1 Binding
  description: >-
    Missense variants in the luminal extracellular domain reduce protein stability and
    abolish the interaction with ATP6AP1, the glycosylated V0 partner, so assembly fails
    for a different reason than in the splicing route while converging on the same step.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired V-ATPase V0 Assembly in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Loss of the ATP6AP1 interaction removes the partnership the assembly step requires.
  evidence:
  - reference: PMID:29127204
    reference_title: Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "impaired protein stability and the interaction with ATP6AP1, a member of the V0 assembly complex"
    explanation: >-
      Direct functional characterisation of the missense alleles' effect on stability
      and on the assembly partnership.
- name: Impaired V-ATPase V0 Assembly in the Endoplasmic Reticulum
  description: >-
    ATP6AP2 acts with ATP6AP1 in the endoplasmic reticulum, before the pump reaches its
    destination compartment, and its C-terminal ER-retrieval motif is required for that
    function while proteolytic cleavage is not. Reduced adaptor availability leaves the
    V0 sector incompletely assembled.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: vacuolar proton-transporting V-type ATPase complex assembly
    term:
      id: GO:0070072
      label: vacuolar proton-transporting V-type ATPase complex assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: lysosomal V-ATPase complex
    term:
      id: GO:0046611
      label: lysosomal proton-transporting V-type ATPase complex
    modifier: DECREASED
  downstream:
  - target: Defective Organelle Acidification
    causal_link_type: DIRECT
    description: >-
      An incompletely assembled pump cannot acidify its compartment.
  evidence:
  - reference: PMID:29995586
    reference_title: ATP6AP2 functions as a V-ATPase assembly factor in the endoplasmic reticulum.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Structure-function analyses in both yeast and Drosophila show that proteolytic cleavage is dispensable, while C-terminus-dependent ER retrieval is required for ATP6AP2 function."
    explanation: >-
      Locates the function in the ER and identifies which part of the protein the
      function depends on. Graded MODEL_ORGANISM because the quoted sentence reports
      whole-organism genetics in two species, including Drosophila in vivo; the same
      paper's yeast complementation is a separate claim and is not what this sentence
      carries.
  - reference: PMID:32165585
    reference_title: Structure of V-ATPase from the mammalian brain.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "This structure shows how ATP6AP1/Ac45 and ATP6AP2/PRR enable assembly of the enzyme's catalytic and membrane regions."
    explanation: >-
      Structural evidence placing ATP6AP2 inside the pump and assigning it an assembly
      role for the catalytic and membrane regions.
- name: Defective Organelle Acidification
  description: >-
    Lysosomal and Golgi lumens are insufficiently acidified. This is the step at which
    every allele class converges, and the branch point from which the neurological and
    glycosylation consequences separate.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: lysosomal lumen acidification
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
    modifier: DECREASED
  downstream:
  - target: Reduced mTOR Signalling and Autophagic Misregulation
    causal_link_type: DIRECT
    description: >-
      Lysosomal acidification is required for the degradative and signalling functions
      that follow.
  - target: Secondary Glycosylation Defect of Other Proteins
    causal_link_type: DIRECT
    description: >-
      Golgi glycosyltransferases depend on luminal pH, so under-acidification impairs
      glycosylation of other proteins.
  evidence:
  - reference: PMID:29388887
    reference_title: Mutations in ATP6AP2 cause autophagic liver disease in humans.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathogenetic cascade that includes impaired V-ATPase assembly, defective lysosomal acidification, reduced MTOR signaling and autophagic misregulation"
    explanation: >-
      States the ordered cascade this node and the next two implement, from the authors
      of the hepatic series.
- name: Reduced mTOR Signalling and Autophagic Misregulation
  description: >-
    Impaired lysosomal acidification reduces mTOR signalling and misregulates autophagy,
    with failure of protein degradation. In patient neurons this ends in cell death, and
    the deficits are reversible by supplying full-length protein.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: DECREASED
  - preferred_term: regulation of macroautophagy
    term:
      id: GO:0016241
      label: regulation of macroautophagy
    modifier: DYSREGULATED
  downstream:
  - target: Neuronal Death and Impaired CNS Development
    causal_link_type: DIRECT
    description: >-
      Failure of lysosomal degradation in neurons leads to their death.
  evidence:
  - reference: PMID:29388887
    reference_title: Mutations in ATP6AP2 cause autophagic liver disease in humans.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathogenetic cascade that includes impaired V-ATPase assembly, defective lysosomal acidification, reduced MTOR signaling and autophagic misregulation"
    explanation: >-
      The only source in this entry that names reduced mTOR signalling as part of the
      cascade, and the reason this node binds a TOR term at all. Graded INDIRECT
      deliberately: it was shown in the glycosylation presentation, which is curated as
      its own entry, so applying it to the neurological arm is an inference from the
      shared upstream mechanism rather than a measurement in these patients. No source
      here reports mTOR signalling in the neurological presentation.
  - reference: PMID:30985297
    reference_title: ATP6AP2 variant impairs CNS development and neuronal survival to cause fulminant neurodegeneration.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "severe deficiency in lysosomal acidification and protein degradation"
    explanation: >-
      Supports the protein-degradation half of this node in the neurological
      presentation, measured in patient iPSC-derived neurons. It does not mention mTOR,
      which is why the item above carries that part of the claim.
- name: Secondary Glycosylation Defect of Other Proteins
  description: >-
    Under-acidification of the Golgi impairs glycosylation of other proteins. ATP6AP2
    itself carries no N-glycosylation sequon, so this is not a defect in glycosylating
    ATP6AP2 but in the glycosylation machinery the pump supports, with its glycosylated
    V0 partner ATP6AP1 among the affected proteins. The abnormality is detectable in
    patients with purely neurological disease, not only in the hepatic presentation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  downstream:
  - target: Type II transferrin isoform profile
    causal_link_type: DIRECT
    description: >-
      The glycosylation defect is detectable as an abnormal serum transferrin isoform
      profile.
  evidence:
  - reference: PMID:41131679
    reference_title: "ATP6AP2-Related Disease Caused by Splicing Defects: Abnormal Glycosylation and the First Affected Female."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This connects more closely the phenotypes of XPDS/MRXSH and ATP6AP2-CDG and indicates that abnormal glycosylation markers may be a consistent feature of splicing variants, and potentially part of the pathological mechanism."
    explanation: >-
      The finding that collapses the neurological/hepatic split this entry would
      otherwise have been divided along, and the reason the glycosylation node sits on
      the shared chain rather than only under the CDG subtype.
- name: Neuronal Death and Impaired CNS Development
  description: >-
    Reduced spontaneous activity, failure of protein degradation and neuronal death,
    with impaired central nervous system development in the most severe reported allele.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The developmental consequence, prominent in the MRXSH presentation.
  - target: Parkinsonism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The extrapyramidal consequence, prominent in the XPDS presentation.
  - target: Spasticity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The pyramidal consequence, shared by both neurological presentations.
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Epilepsy accompanies the developmental presentation.
  - target: Microcephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced head circumference follows failure of cortical development, which is the
      outcome the conditional-deletion mouse makes visible directly.
  - target: Axial hypotonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Central hypotonia, from the same failure of CNS development. The axonal neuropathy
      reported alongside it is deliberately not wired here: no source cited in this entry
      establishes that it is central in origin rather than a separate peripheral process.
  evidence:
  - reference: PMID:30985297
    reference_title: ATP6AP2 variant impairs CNS development and neuronal survival to cause fulminant neurodegeneration.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Functional studies of induced pluripotent stem cell-derived (iPSC-derived) neurons from this patient revealed reduced spontaneous activity and severe deficiency in lysosomal acidification and protein degradation leading to neuronal cell death"
    explanation: >-
      States the finding directly in human patient-derived neurons: reduced spontaneous
      activity, failed lysosomal acidification and protein degradation, and neuronal
      death.
  - reference: PMID:30985297
    reference_title: ATP6AP2 variant impairs CNS development and neuronal survival to cause fulminant neurodegeneration.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional deletion of Atp6ap2 in developing mouse brain impaired V-ATPase-dependent functions, causing impaired neural stem cell self-renewal, premature neuronal differentiation, and apoptosis resulting in degeneration of nearly the entire cortex."
    explanation: >-
      The in vivo counterpart, and the source for the impaired-CNS-development half of
      this node's name. Kept as a separate item from the iPSC result because it is a
      different evidence class in a different organism.
animal_models:
- name: Conditional Atp6ap2 deletion in developing mouse brain
  species: Mouse
  genotype: Conditional Atp6ap2 deletion in the developing brain
  publication: PMID:30985297
  description: >-
    A conditional brain deletion of Atp6ap2, which impaired V-ATPase-dependent functions
    and produced impaired neural stem cell self-renewal, premature neuronal
    differentiation and apoptosis degenerating nearly the whole cortex. It is the in
    vivo arm of the same study whose patient iPSC-derived neurons support the neuronal
    death node.
  modeled_mechanisms:
  - target: Neuronal Death and Impaired CNS Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the neuronal death and the failure of CNS development that this node
      asserts, in vivo and at the scale the node describes.
    limitations: >-
      The model deletes the gene rather than carrying a hypomorphic allele, so it cannot
      speak to the dosage relationship that defines the human disease, and the cortical
      degeneration is more severe than the human neurological presentations.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human lesion is a hypomorphic splicing allele that halves the full-length
        transcript while leaving some function. This model imposes a conditional deletion
        instead, so the mechanism does not arise from the allele that causes the disease.
        The claim it supports therefore holds in a narrower form: that losing ATP6AP2
        function in developing brain kills neurons and derails cortical development, not
        that a half-dose does so to this degree.
    readouts:
    - name: Cortical integrity after conditional Atp6ap2 deletion
      target: Neuronal Death and Impaired CNS Development
      direction: DECREASED
      interpretation: >-
        Degeneration of nearly the entire cortex, the structural readout of this node in
        this model.
      evidence:
      - reference: PMID:30985297
        reference_title: ATP6AP2 variant impairs CNS development and neuronal survival to cause fulminant neurodegeneration.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "apoptosis resulting in degeneration of nearly the entire cortex"
        explanation: >-
          The measured outcome behind this readout.
    evidence:
    - reference: PMID:30985297
      reference_title: ATP6AP2 variant impairs CNS development and neuronal survival to cause fulminant neurodegeneration.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional deletion of Atp6ap2 in developing mouse brain impaired V-ATPase-dependent functions, causing impaired neural stem cell self-renewal, premature neuronal differentiation, and apoptosis resulting in degeneration of nearly the entire cortex."
      explanation: >-
        Establishes that this model is informative for the neuronal death and impaired
        CNS development node.
  notes: >-
    No `genes:` binding is recorded. Alliance of Genome Resources was unreachable
    throughout the session that curated this entry, and the term validator does not check
    MGI labels, so an identifier written from memory would have passed every gate
    unverified. The gene is mouse Atp6ap2.

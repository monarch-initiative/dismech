  notes: >-
    The gene identifier is hgnc:18305, read from HGNC. Pathogenic alleles are
    overwhelmingly synonymous or intronic variants acting on splicing, so a
    protein-centric variant filter will miss this disease: the alleles that establish it
    are the ones an in-silico missense predictor scores as silent.

name: RD3-Related Retinopathy
creation_date: "2026-10-15T16:00:00Z"
category: Mendelian
description: >-
  RD3-related retinopathy is an autosomal recessive, congenital-onset inherited
  retinal dystrophy caused by biallelic loss-of-function variants in RD3, which
  encodes a small photoreceptor protein that binds the retinal membrane guanylyl
  cyclases (RetGC1/GUCY2D and RetGC2/GUCY2F). It presents as Leber congenital
  amaurosis type 12 (LCA12): congenital nystagmus, vision reduced to counting
  fingers or light perception, sluggish pupils, eye poking and hyperopia, with an
  atrophic macula and early loss of the photoreceptor layer. RD3 has two
  separable jobs in the photoreceptor inner segment. It escorts newly made
  guanylyl cyclase out of the endoplasmic reticulum to the outer segment, and it
  holds the cyclase inactive until it gets there. Losing the first leaves the
  outer segment unable to make cGMP, so rods and cones cannot generate or recover
  a light response. In the rd3 mouse, losing the second lets calcium-sensor
  proteins (GCAPs) activate the cyclase in the wrong compartment, which drives
  endoplasmic reticulum stress and unusually rapid photoreceptor death; this
  branch has not been examined in human retina. The disease is very rare, mostly
  reported in consanguineous families, with one recurrent truncating founder
  allele (p.Arg38Ter) around the Mediterranean, and has no extraocular
  features. Gene augmentation restores cyclase trafficking,
  function and photoreceptor survival in the rd3 mouse, but no human treatment
  exists.

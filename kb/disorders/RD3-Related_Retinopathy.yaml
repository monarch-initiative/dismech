- name: Failure of Guanylate Cyclase Export to the Outer Segment
  biological_scale: CELLULAR
  description: >-
    RD3 binds RetGC1 and RetGC2 in the inner segment and carries them out of the
    endoplasmic reticulum toward the outer segment. Without RD3 the cyclases are
    not exported from the endoplasmic reticulum, are not stably expressed, and
    are essentially absent from rod and cone outer segments. The C-terminal
    Arg158-Ser170 region of RD3 is required for this trafficking step but not for
    cyclase inhibition, which is why trafficking and degeneration can be
    separated experimentally.

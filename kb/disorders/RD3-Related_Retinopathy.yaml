- name: Aberrant GCAP-Stimulated Guanylate Cyclase Activity in the Inner Segment
  biological_scale: CELLULAR
  description: >-
    With RD3 absent, calcium-free GCAP1 and GCAP2 activate the residual RetGC in
    the inner segment, a compartment where the cyclase should be silent. This is
    the main driver of the rapid photoreceptor death: deleting GCAPs preserves
    most rd3 photoreceptors, and RD3 fragments that still inhibit the cyclase but
    cannot traffic it prevent degeneration without restoring function. Whether
    the toxicity comes from the misplaced cyclase activity itself or from a
    cyclase-independent action of calcium-free GCAPs is not settled.

notes: >-
  MONDO:0700235 is a gene-level spectrum term created by the ClinGen ocular
  clinical domain working group; at the time of curation its only child is
  Leber congenital amaurosis 12 (MONDO:0012525), which is carried here as a
  has_subtypes row rather than a separate entry. Almost every reported patient
  carries biallelic truncating alleles and has LCA; the exception is a single
  Spanish family with retinitis pigmentosa and a homozygous missense variant
  (p.Lys87Glu), supported only by in-silico prediction, which is recorded under
  genetic variants rather than as a subtype. The phenotype overlaps closely with
  GUCY2D-related recessive retinopathy (LCA1), which is expected: RD3 acts on
  the GUCY2D gene product. There is no RD3-specific GeneReviews chapter; the
  applicable one is the nonsyndromic LCA/EOSRD overview (PMID:30285347), whose
  PubMed abstract lists no clinical findings, so the phenotypes here come from
  the RD3 case series (Perrault et al. 2013, Preising et al. 2012) and case
  reports. None of the sources cited here reports full-field ERG results for
  RD3 patients specifically, so no ERG phenotype is recorded. RD3 is neither a cascade
  component nor a GCAP; the trigger node conforms to the phototransduction
  module's component-defect node because RD3 is the cyclase's obligatory
  trafficking partner and inhibitor, and its loss removes the cyclase from the
  cascade.

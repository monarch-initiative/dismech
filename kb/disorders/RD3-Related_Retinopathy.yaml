- name: Loss of RD3 Inhibition of Guanylate Cyclase in the Inner Segment
  biological_scale: MOLECULAR
  description: >-
    RD3 is a high-affinity, noncompetitive inhibitor of RetGC1 and RetGC2 that
    opposes their activation by GCAPs. Its alpha-helical core (N-terminal to
    Gly148) binds the cyclase through two surface clusters and keeps it inactive
    while it is in the inner segment, before the RetGC:GCAP complex forms in the
    outer segment. Truncated disease alleles lose this inhibition.

pathophysiology:
- name: RD3 Biallelic Loss of Function
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating RD3 variants (nonsense, frameshift and splice-site
    alleles, including the Mediterranean founder p.Arg38Ter) produce unstable,
    non-functional C-terminally truncated protein or none at all. RD3 is a
    195-residue four-helix-bundle protein expressed in rods and cones; it binds
    RetGC1 and RetGC2 through a central helical interface and needs its
    C-terminal region to couple the cyclase to intracellular trafficking.

- name: Deficient Outer Segment cGMP Synthesis
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: CELLULAR
  description: >-
    With little cyclase in the outer segment, guanylyl cyclase activity in the
    rd3 retina is drastically reduced and photoreceptors cannot raise cGMP to the
    dark-state level. cGMP-gated channels stay closed, the dark current is lost,
    and the outer segment cannot reset after light.

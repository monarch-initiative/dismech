treatments:
- name: RD3 Gene Augmentation (preclinical)
  description: >-
    Subretinal AAV delivery of RD3 to photoreceptors is the only disease-directed
    approach and has been tested only in mice. In two rd3 strains, AAV8(Y733F)
    carrying Rd3 under the rhodopsin kinase promoter moved guanylyl cyclase from
    the endoplasmic reticulum to rod and cone outer segments, kept photoreceptors
    alive for at least 7 months, and restored ERG responses. Transgenic RD3
    expression in rods likewise restored cyclase levels and photoresponses. No
    human trial has been reported; care for patients is supportive.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene augmentation therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    target_cell_types:
    - preferred_term: photoreceptor cell
      term:
        id: CL:0000210
        label: photoreceptor cell
  target_mechanisms:
  - target: Failure of Guanylate Cyclase Export to the Outer Segment
    treatment_effect: RESTORES
  - target: Rapid Rod and Cone Photoreceptor Degeneration
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:23740938
    reference_title: "RD3 gene delivery restores guanylate cyclase localization and rescues photoreceptors in the Rd3 mouse model of Leber congenital amaurosis 12."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strong RD3 transgene expression led to the translocation of guanylate cyclase from the endoplasmic reticulum (ER) to rod and cone outer segments (OSs) as visualized by immunofluorescence microscopy."
    explanation: >-
      AAV-delivered RD3 restores cyclase trafficking in rd3 mice.
  - reference: PMID:23740938
    reference_title: "RD3 gene delivery restores guanylate cyclase localization and rescues photoreceptors in the Rd3 mouse model of Leber congenital amaurosis 12."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Guanylate cyclase expression and localization coincided with the survival of rod and cone photoreceptors for at least 7 months."
    explanation: >-
      Long-term photoreceptor survival after RD3 gene delivery.
  - reference: PMID:31346032
    reference_title: "Retinal guanylyl cyclase activation by calcium sensor proteins mediates photoreceptor degeneration in an rd3 mouse model of congenital human blindness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When transgenically expressed in rd3/rd3 mouse retinas under control of the rhodopsin promoter, the RD3GFP construct increased RetGC levels to near normal levels, restored dark-adapted photoresponses, and rescued rods from degeneration."
    explanation: >-
      Independent transgenic rescue of cyclase levels, function and survival.
- name: Genetic Counseling
  description: >-
    Counselling for families with an affected child. Because RD3 carriers are
    rare, the authors of the largest series judged the recurrence risk for LCA
    in non-consanguineous unions negligible, for heterozygous and homozygous
    individuals alike; the risk is in consanguineous unions.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23308101
    reference_title: "Union makes strength: a worldwide collaborative genetic and clinical study to provide a comprehensive survey of RD3 mutations and delineate the associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the low frequency of RD3 carriers, the recurrence risk for LCA in non-consanguineous unions is negligible for both heterozygote and homozygote RD3 individuals."
    explanation: Basis for recurrence-risk counselling.
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis rests on finding biallelic RD3 variants, because the LCA12
    phenotype closely resembles GUCY2D-related LCA1. In patients with LCA type
    I from the Mediterranean region with moderate or no hyperopia, the authors
    of the largest series recommend screening RD3 first, before GUCY2D, RPGRIP1
    and CEP290. Since LCA12 is non-syndromic, they advise against routine
    extraocular investigations once an RD3 diagnosis is made.
  evidence:
  - reference: PMID:23308101
    reference_title: "Union makes strength: a worldwide collaborative genetic and clinical study to provide a comprehensive survey of RD3 mutations and delineate the associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In LCA type I patients originating from this region with moderate or no hyperopia, RD3 should be screened for mutations first, before GUCY2D, RPGRIP1 and CEP290"
    explanation: >-
      Recommended screening order for Mediterranean patients, reflecting the
      p.Arg38Ter founder allele.
  - reference: PMID:23308101
    reference_title: "Union makes strength: a worldwide collaborative genetic and clinical study to provide a comprehensive survey of RD3 mutations and delineate the associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, anxiogenic and expensive extraocular explorations must not be systematically prescribed"
    explanation: >-
      Management point that follows from the absence of extraocular disease.
  - reference: PMID:23308101
    reference_title: "Union makes strength: a worldwide collaborative genetic and clinical study to provide a comprehensive survey of RD3 mutations and delineate the associated phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LCA12 phenotype in our patients is highly similar to those of patients with mutant photoreceptor-specific guanylate cyclase (GUCY2D/LCA1)."
    explanation: >-
      The clinical overlap with LCA1 is why gene testing, not examination,
      makes the diagnosis.
animal_models:
- name: rd3 mouse (Rd3 nonsense)
  species: Mouse
  genotype: Rd3 C>T nonsense, predicted stop after residue 106, homozygous
  publication: PMID:17186464
  description: >-
    Naturally occurring retinal degeneration 3 mouse, described in 1993 and
    mapped to Rd3 in 2006. Photoreceptors develop normally and then degenerate
    from about postnatal week 2 to 3. Several strains carry the mutation and
    differ in the rate of degeneration and, in one strain, in cone function,
    which points to background modifiers.
  evidence:
  - reference: PMID:17186464
    reference_title: "Premature truncation of a novel protein, RD3, exhibiting subnuclear localization is associated with retinal degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The rd3 mutation results in a predicted stop codon after residue 106."
    explanation: Identifies the causal Rd3 truncating mutation in the rd3 mouse.
  modeled_mechanisms:
  - target: Failure of Guanylate Cyclase Export to the Outer Segment
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Both retinal guanylyl cyclases are lost from rd3 photoreceptors, the
      defect the human truncating alleles are predicted to cause.
    evidence:
    - reference: PMID:21078983
      reference_title: "RD3, the protein associated with Leber congenital amaurosis type 12, is required for guanylate cyclase trafficking in photoreceptor cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GC1 and GC2 are undetectable in photoreceptors of the rd3 mouse deficient in RD3 by immunofluorescence microscopy."
      explanation: Cyclase loss from rd3 mouse photoreceptors.
  - target: Rapid Rod and Cone Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Rapid rod and cone loss within weeks of eye opening.
    limitations: >-
      The rate of degeneration differs between rd3 strains, and the
      Rb(11.13)4Bnr/J strain appears to carry an additional cone
      phototransduction defect, so strain background must be considered before
      comparing rates with human disease.
    evidence:
    - reference: PMID:8486383
      reference_title: "New mouse primary retinal degeneration (rd-3)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The rod photoreceptor loss is essentially complete by 5 weeks, whereas remnant cone cells are seen through 7 weeks."
      explanation: Time course of rd-3 photoreceptor loss.
- name: rcd2 collie (RD3 insertion)
  species: Dog
  genotype: RD3 insertion altering the last 61 codons, homozygous
  background: Collie
  publication: PMID:19130129
  description: >-
    Rod-cone dysplasia type 2, an autosomal recessive retinal disease of collie
    dogs, maps to an insertion in RD3 that replaces the C-terminal 61 codons and
    extends the open reading frame. It is the large-animal counterpart of LCA12.
  evidence:
  - reference: PMID:19130129
    reference_title: "Canine RD3 mutation establishes rod-cone dysplasia type 2 (rcd2) as ortholog of human and murine rd3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "an insertion was found that cosegregates with rcd2 and is predicted to alter the last 61 codons of the normal open reading frame and further extend the open reading frame."
    explanation: Identifies the canine RD3 allele that causes rcd2.
  modeled_mechanisms:
  - target: RD3 Biallelic Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      A naturally occurring RD3 allele that disrupts the C-terminal region, as
      the human truncating alleles do.
    limitations: >-
      The canine allele replaces and extends the C terminus rather than
      truncating it, and the mapping paper does not report cyclase trafficking
      or ERG data for the dog.
    evidence:
    - reference: PMID:19130129
      reference_title: "Canine RD3 mutation establishes rod-cone dysplasia type 2 (rcd2) as ortholog of human and murine rd3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "an insertion was found that cosegregates with rcd2 and is predicted to alter the last 61 codons of the normal open reading frame and further extend the open reading frame."
      explanation: The canine allele alters the RD3 C terminus.

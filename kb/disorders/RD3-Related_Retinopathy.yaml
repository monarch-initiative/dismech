genetic:
- name: RD3
  gene_term:
    preferred_term: RD3
    term:
      id: hgnc:19689
      label: RD3
  relationship_type: CAUSATIVE
  association: Causative
  inheritance:
  - name: Autosomal recessive
  features: >-
    The LCA-causing alleles are predicted to truncate the protein (nonsense,
    small frameshift and canonical splice-site variants). The c.112C>T
    (p.Arg38Ter) allele recurs in families from the southern Mediterranean as
    an ancient founder allele. One homozygous missense variant (p.Lys87Glu)
    has been reported in a family with retinitis pigmentosa, on in-silico
    evidence only.
  variants:
  - name: c.112C>T (p.Arg38Ter)
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Nonsense founder allele shared by five families from the southern shores
      of the Mediterranean; also reported homozygous in an infant with
      RD3-related LCA.
    evidence:
    - reference: PMID:23308101
      reference_title: "Union makes strength: a worldwide collaborative genetic and clinical study to provide a comprehensive survey of RD3 mutations and delineate the associated phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five families originating from the Southern Shores of the Mediterranean segregated a similar mutation (c.112C>T, p.R38*) suggesting that this change may have resulted from an ancient founder effect."
      explanation: Founder nonsense allele segregating in five families.
    - reference: PMID:32083505
      reference_title: "Optical coherence tomography and fundus autofluorescence imaging in an infant with RD3-related leber congenital amaurosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Homozygous pathogenic variant (c.112 C > T, p.Arg38Ter) was detected in the RD3 gene."
      explanation: Same allele homozygous in an independent infant case.
  - name: c.180C>A
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: Homozygous nonsense variant in a consanguineous Kurdish family.
    evidence:
    - reference: PMID:22531706
      reference_title: "Mutations in RD3 are associated with an extremely rare and severe form of early onset retinal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sequencing of RD3 revealed a homozygous nonsense mutation (c.180C > A) in all affected members tested."
      explanation: Segregating homozygous nonsense allele.
  - name: c.259A>G (p.Lys87Glu)
    variant_type: single nucleotide variant
    description: >-
      Homozygous missense variant reported in one Spanish family with
      retinitis pigmentosa rather than LCA. Pathogenicity rests on in-silico
      prediction; no segregation or functional data are given. Lys87 lies in
      the Lys87-Leu122 region that binds the cyclase.
    evidence:
    - reference: PMID:24516651

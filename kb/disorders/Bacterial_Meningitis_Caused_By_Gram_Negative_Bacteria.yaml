transmission:
- name: Respiratory Gram-negative acquisition
  description: >-
    Meningococci and H. influenzae reach a new host through respiratory
    secretions, colonize the nasopharynx, and can invade blood before meningeal
    disease.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Places invasive H. influenzae disease downstream of upper-respiratory
      colonization.
- name: Maternal, endogenous, or healthcare Gram-negative seeding
  description: >-
    E. coli, Klebsiella, Pseudomonas, and related rods reach the host by
    maternal-neonatal, endogenous enteric, traumatic, device-associated, or
    healthcare routes before bacteremia or direct CSF inoculation develops.
  evidence:
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Neonatal meningitis Escherichia coli K1 (NMEC) are thought to be
      transmitted from mothers to newborns during delivery or by nosocomial
      infections.
    explanation: >-
      Supports maternal-neonatal and healthcare-associated entry for neonatal
      E. coli meningitis.
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Meningitis may not only be acquired in the community setting, but may be
      associated with a variety of invasive procedures or head trauma.
    explanation: >-
      IDSA guidelines define traumatic, neurosurgical, shunt, drain, and
      device-associated routes into healthcare-associated ventriculitis and
      meningitis.
pathophysiology:
- name: Gram-Negative Mucosal or Device Invasion
  role: trigger
  description: >-
    Respiratory, enteric, maternal, traumatic, or neurosurgical exposure places
    meningitis-capable Gram-negative organisms at an epithelial surface or CNS
    device portal.
  biological_scale: ORGANISM
  downstream:
  - target: Gram-Negative Bacteremia
    causal_link_type: DIRECT
    description: >-
      Organisms that cross respiratory or enteric epithelial barriers enter
      blood and disseminate hematogenously.
  - target: Gram-Negative Meningeal Seeding
    causal_link_type: DIRECT
    description: >-
      Traumatic, post-neurosurgical, drain-associated, or shunt-associated
      organisms bypass bacteremia and directly inoculate CSF, ventricular
      hardware, or adjacent CNS tissue.
  evidence:
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Meningitis may not only be acquired in the community setting, but may be
      associated with a variety of invasive procedures or head trauma.
    explanation: >-
      Establishes invasive procedures and head trauma as portals for the
      healthcare-associated branch of Gram-negative meningitis.
- name: Gram-Negative Bacteremia
  description: >-
    Encapsulated or serum-resistant Gram-negative bacteria survive complement
    attack in blood and disseminate toward neurovascular barriers.
  biological_scale: ORGANISM
  downstream:
  - target: Gram-Negative Meningeal Seeding
    causal_link_type: DIRECT
    description: >-
      Bacteremic Gram-negative organisms traverse the blood-brain or
      blood-CSF barrier and reach cerebrospinal fluid.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      The H. influenzae capsule protects the bacteria against both phagocytosis
      and opsonization.
    explanation: >-
      Demonstrates immune-evasive capsule biology in one encapsulated
      Gram-negative meningitis pathogen.
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using four representative APEC and NMEC strains that belong to serotype
      O18, we demonstrate that these strains survive in human serum similar to
      that of the prototypic NMEC strain E44, a derivative of RS218.
    explanation: >-
      Supports serum survival as a bloodstream property of O18 E. coli strains
      that model neonatal meningitis E. coli.
- name: Gram-Negative Meningeal Seeding
  description: >-
    Gram-negative organisms cross into, or are directly introduced into, the
    cerebrospinal-fluid compartment.
  biological_scale: TISSUE
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: Gram-Negative CSF Replication
    causal_link_type: DIRECT
    description: >-
      Gram-negative bacteria multiply after entering the meningeal CSF space.
  evidence:
  - reference: PMID:19520910
    reference_title: Meningococcal type IV pili recruit the polarity complex to cross the brain endothelium.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In Neisseria meningitidis, the causative agent of cerebrospinal
      meningitis, type IV pili-mediated adhesion to brain endothelial cells is
      required for bacteria to cross the blood-brain barrier.
    explanation: >-
      Shows active Gram-negative crossing of the blood-brain barrier in the
      meningococcal branch.
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To enter the central nervous system (CNS) the bacteria generally have to
      cross either the blood-brain barrier (BBB) or the blood-cerebrospinal
      fluid barrier (BSCFB).
    explanation: >-
      Generalizes hematogenous H. influenzae CNS entry to the blood-brain and
      blood-CSF barriers.
- name: Gram-Negative CSF Replication
  description: >-
    Replicating Gram-negative bacteria shed outer-membrane products, including
    lipopolysaccharide or lipooligosaccharide, into the cerebrospinal-fluid and
    subarachnoid compartments.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  downstream:
  - target: LPS-Driven Neutrophilic Meningeal Inflammation
    causal_link_type: DIRECT
    description: >-
      Gram-negative envelope products activate innate receptor signaling and
      recruit neutrophils into CSF.
  evidence:
  - reference: PMID:30188499
    reference_title: Mesenchymal stem cells transplantation attenuates brain injury and enhances bacterial clearance in Escherichia coli meningitis in newborn rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Meningitis modeling induced robust proliferation of E. coli in the
      cerebrospinal fluid and increased mortality in rat pups, and MSC
      transplantation significantly reduced this bacterial growth and the
      mortality rate.
    explanation: >-
      Demonstrates Gram-negative E. coli proliferation within CSF in a neonatal
      rat meningitis model.
- name: LPS-Driven Neutrophilic Meningeal Inflammation
  description: >-
    Lipooligosaccharide or lipopolysaccharide stimulates cytokine production,
    neutrophil influx, barrier injury, cerebral edema, and the acute pyogenic
    meningitis syndrome.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  downstream:
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Meningeal innate immune activation drives systemic fever.
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Inflamed meninges and raised intracranial pressure produce headache.
  - target: Meningeal Irritation
    causal_link_type: DIRECT
    description: >-
      Inflammation of the meningeal compartment produces clinical meningeal
      signs.
  - target: Altered Mental Status
    causal_link_type: DIRECT
    description: >-
      Pyogenic CSF inflammation and edema alter consciousness in acute
      Gram-negative meningitis.
  evidence:
  - reference: PMID:2794062
    reference_title: Tumor necrosis factor in mediating experimental Haemophilus influenzae type B meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In CSF of rabbits with meningitis induced with Haemophilus influenzae
      type b (Hib) lipooligosaccharide (LOS), TNF activity was first detected 45
      min after intracisternal (IC) injection of 20 ng Hib LOS and white blood
      cells (WBC) first appeared 75 min later.
    explanation: >-
      Shows that a Gram-negative meningitis lipooligosaccharide can induce CSF
      TNF followed by leukocyte influx.
  - reference: PMID:2373990
    reference_title: Tumor necrosis factor alpha/cachectin and interleukin 1 beta initiate meningeal inflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data provide evidence for a seminal role of TNF-alpha and IL-1 beta
      in the initial events of meningeal inflammation.
    explanation: >-
      Places TNF-alpha and IL-1 beta upstream of the meningeal inflammatory
      cascade driven by Gram-negative envelope products.
diagnosis:
- name: Cerebrospinal-fluid Gram-negative culture
  description: >-
    CSF culture establishes Gram-negative bacterial ventriculitis or meningitis
    when it grows an aerobic Gram-negative bacillus in a compatible clinical and
    inflammatory context.
  diagnosis_term:
    preferred_term: Microbial Culture Procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  results: >-
    Growth of an aerobic Gram-negative bacillus from CSF confirms the causative
    lineage for Gram-negative bacterial meningitis.
  evidence:
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CSF cultures that grow Staphylococcus aureus or aerobic gram-negative
      bacilli are indicative of infection (strong, moderate).
    explanation: >-
      The IDSA healthcare-associated ventriculitis and meningitis guideline
      treats recovery of aerobic Gram-negative bacilli from CSF as evidence of
      infection rather than contamination.
progression:
- phase: Gram-negative cerebrospinal-fluid infection
  notes: >-
    Respiratory, maternal-neonatal, endogenous, traumatic, or
    healthcare-associated seeding progresses to Gram-negative meningitis when an
    aerobic Gram-negative bacillus infects the cerebrospinal-fluid compartment
    and triggers a culture-positive ventriculitis or meningitis syndrome.
  evidence:
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CSF cultures that grow Staphylococcus aureus or aerobic gram-negative
      bacilli are indicative of infection (strong, moderate).
    explanation: >-
      Supports Gram-negative bacillary growth in CSF as the defining infection
      phase of Gram-negative bacterial meningitis or ventriculitis.

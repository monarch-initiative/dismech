  subtype_term:
    preferred_term: haemophilus meningitis
    term:
      id: MONDO:0000889
      label: haemophilus meningitis
  description: >-
    The Haemophilus influenzae branch, shared with the broader
    bacterial-meningitis parent and distinguished by a Gram-negative
    coccobacillary respiratory colonizer.
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Grounds the Haemophilus stratum as a Gram-negative
      respiratory-colonizing cause of meningitis.
- name: Neonatal enteric Gram-negative meningitis
  classification: host_age_and_enteric_species
  description: >-
    The neonatal enteric-rod branch, led by Escherichia coli and reached
    through maternal, neonatal, or nosocomial acquisition.
  evidence:
  - reference: PMID:36709579
    reference_title: A high-throughput sequencing approach identifies immunotherapeutic targets for bacterial meningitis in neonates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Worldwide, Escherichia coli is the leading cause of neonatal
      Gram-negative bacterial meningitis, but full understanding of the
      pathogenesis of this disease is not yet achieved.
    explanation: >-
      Places E. coli as the leading species in the neonatal enteric
      Gram-negative stratum.
- name: Healthcare-associated Gram-negative ventriculitis and meningitis
  classification: acquisition_route
  description: >-
    The post-traumatic, post-neurosurgical, shunt-associated, or
    drain-associated branch caused by aerobic Gram-negative bacilli such as
    Pseudomonas, Acinetobacter, Klebsiella, E. coli, Enterobacter, Citrobacter,
    or Serratia.
  evidence:
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most likely microorganisms associated with CSF shunt and drain
      infections are coagulase-negative staphylococci (especially
      Staphylococcus epidermidis), S. aureus, P. acnes, and gram-negative
      bacilli (including Escherichia coli, Enterobacter species, Citrobacter
      species, Serratia species, and Pseudomonas aeruginosa).
    explanation: >-
      Grounds the healthcare-associated subtype as a device-linked
      ventriculitis/meningitis stratum that includes several aerobic
      Gram-negative bacilli.
synonyms:
- Gram-negative bacterial meningitis
notes: >-
  This etiologic-envelope entry records Gram-negative-specific meningitis
  mechanisms shared by encapsulated community pathogens, neonatal enteric rods,
  and healthcare-associated rods. It stays coarser than species-specific child
  entries, which can carry distinct capsule, adhesin, vaccine, resistance, and
  age-band details.
review_notes: >-
  Deliberately lumped. MONDO:0041825 is an etiologic-envelope child of bacterial
  meningitis that is narrower than all bacterial meningitis but broad enough to
  cover meningococcal, Haemophilus, neonatal enteric, and
  healthcare-associated branches, so this entry is retained as a Disease rather
  than a Grouping. It records the Gram-negative shared mechanism and repeats the
  meningococcal and Haemophilus subtype cross-reference already present in
  Bacterial_meningitis.

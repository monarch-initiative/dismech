agent_life_cycle:
  description: >-
    Gram-negative meningitis pathogens are maintained in several human niches:
    respiratory carriage for meningococci and H. influenzae, enteric or
    maternal-genital reservoirs for E. coli and Klebsiella, and healthcare
    reservoirs for Pseudomonas and resistant Enterobacterales; humans are the
    clinical host when organisms reach blood or cerebrospinal fluid.
  hosts:
  - preferred_term: Homo sapiens
    role: mucosal reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:30049648
    reference_title: Capsule and fimbriae modulate the invasion of Haemophilus influenzae in a human blood-cerebrospinal fluid barrier model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The Gram-negative bacterium Haemophilus influenzae (H. influenzae) can
      commensally colonize the upper respiratory tract, but also cause life
      threatening disease including epiglottitis, sepsis and meningitis.
    explanation: >-
      Supports human upper-airway carriage as one reservoir feeding the
      Gram-negative bacterial-meningitis class.
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Neonatal meningitis Escherichia coli K1 (NMEC) are thought to be
      transmitted from mothers to newborns during delivery or by nosocomial
      infections.
    explanation: >-
      Supports maternal-neonatal and nosocomial reservoirs for the neonatal
      E. coli branch of the lumped Gram-negative class.

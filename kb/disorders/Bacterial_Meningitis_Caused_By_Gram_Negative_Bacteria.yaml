name: Bacterial meningitis caused by gram-negative bacteria
creation_date: "2026-09-30T04:25:00Z"
description: >-
  Bacterial meningitis caused by Gram-negative bacteria is pyogenic meningitis
  in which encapsulated or hospital-associated Gram-negative lineages such as
  Neisseria meningitidis, Haemophilus influenzae, Escherichia coli, Klebsiella
  pneumoniae, or Pseudomonas aeruginosa invade blood or a neurosurgical portal,
  enter the cerebrospinal-fluid compartment, replicate beside the meninges, and
  trigger lipopolysaccharide- or lipooligosaccharide-driven neutrophilic
  inflammation.
category: Infectious Disease
disease_term:
  preferred_term: bacterial meningitis caused by gram-negative bacteria
  term:
    id: MONDO:0041825
    label: bacterial meningitis caused by gram-negative bacteria
parents:
- Bacterial meningitis
has_subtypes:
- name: Meningococcal
  display_name: Meningococcal meningitis
  classification: etiologic_species
  subtype_term:
    preferred_term: meningococcal meningitis
    term:
      id: MONDO:0018059
      label: meningococcal meningitis
  description: >-
    The community-acquired Neisseria meningitidis branch, shared with the
    broader bacterial-meningitis parent but placed here as an encapsulated
    Gram-negative diplococcal subtype.
  evidence:
  - reference: PMID:22906940
    reference_title: "Meningococcal vaccine: a new vaccine to combat meningococcal disease in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Meningococcal meningitis is caused by Neisseria meningitidis, a
      gram-negative, aerobic, encapsulated diplococcus.
    explanation: >-
      Grounds the meningococcal stratum of Gram-negative bacterial meningitis.
- name: Haemophilus
  display_name: Haemophilus influenzae meningitis

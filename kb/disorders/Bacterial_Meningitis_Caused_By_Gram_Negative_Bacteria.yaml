    reference_title: Clinical characteristics and prognosis of Klebsiella pneumoniae meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fever (93.8%) is the most common symptom, followed by positive meningeal irritation (62.5%).
    explanation: >-

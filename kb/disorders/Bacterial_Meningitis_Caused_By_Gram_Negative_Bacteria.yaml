clinical_burden:
  burden_level: HIGH
  rationale: >-
    Gram-negative meningitis can be life-threatening once CSF infection is
    established, and healthcare-associated Klebsiella disease combines very high
    in-hospital mortality with carbapenem resistance as an independent mortality
    predictor. Burden varies by organism, host age, resistance, and acquisition
    route, but the envelope includes post-neurosurgical and drug-resistant cases
    that require intensive CNS-penetrant antimicrobial management.
  evidence:
  - reference: PMID:38601552
    reference_title: Clinical characteristics and prognosis of Klebsiella pneumoniae meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study included 80 adult patients with KPM, 58 (72.5%) of whom were
      males. The mortality rate was 45%. Among them, 74 (92.5%) were diagnosed
      with healthcare-associated meningitis.
    explanation: >-
      Quantifies high mortality and healthcare association in a contemporary
      adult K. pneumoniae meningitis cohort.
  - reference: PMID:38601552
    reference_title: Clinical characteristics and prognosis of Klebsiella pneumoniae meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CRKP (OR = 9.825, 95%CI = 2.757-35.011, P < 0.001), length of stay (OR =
      0.953, 95%CI = 0.921-0.986, P = 0.005), and C-reactive
      protein-to-prealbumin ratio (CRP/PA, OR = 3.053, 95%CI = 1.329-7.016, P =
      0.009) were identified as predictive factors for mortality using
      multivariate logistic regression.
    explanation: >-
      Establishes carbapenem-resistant Klebsiella pneumoniae as an independent
      predictor of mortality.
treatments:
- name: Susceptibility-guided Gram-negative meningitis antibiotics
  description: >-
    Ceftriaxone or cefotaxime can treat third-generation-cephalosporin
    susceptible Gram-negative bacilli, while cefepime, ceftazidime, or
    meropenem are used for Pseudomonas species or resistant healthcare-associated
    Gram-negative rods according to susceptibility testing. Carbapenem-resistant
    healthcare-associated Gram-negative ventriculitis and meningitis can require
    polymyxin or other salvage regimens selected from isolate susceptibilities.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: cefotaxime
      term:
        id: CHEBI:204928
        label: cefotaxime
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
    - preferred_term: cefepime
      term:
        id: CHEBI:478164
        label: cefepime
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
  target_mechanisms:
  - target: Gram-Negative CSF Replication
    treatment_effect: INHIBITS
    description: >-
      CNS-penetrant bactericidal therapy kills the causative Gram-negative
      bacillus in CSF and blocks further release of inflammatory outer-membrane
      products.
  evidence:
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For treatment of infection caused by gram-negative bacilli, therapy should
      be based on in vitro susceptibility testing with agents that achieve good
      CNS penetration (strong, moderate).
    explanation: >-
      Supports susceptibility-guided, CNS-penetrant therapy for Gram-negative
      bacillary meningitis or ventriculitis.
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For treatment of infection caused by Pseudomonas species, the recommended
      therapy is cefepime, ceftazidime, or meropenem (strong, moderate);
      recommended alternative antimicrobial agents are aztreonam or a
      fluoroquinolone with in vitro activity (strong, moderate).
    explanation: >-
      Identifies antipseudomonal beta-lactam options for the nonfermenting-rod
      branch of healthcare-associated Gram-negative meningitis.
  - reference: PMID:28203777
    reference_title: 2017 Infectious Diseases Society of America's Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with Acinetobacter ventriculomeningitis, empiric therapy
      should be initiated with meropenem. If carbapenem resistance is suspected,
      a combination of intravenous and intraventricular colistimethate sodium or
      polymyxin B is recommended [109].
    explanation: >-
      Adds the carbapenem-resistant Gram-negative healthcare-associated branch
      that can require intraventricular polymyxin therapy.
animal_models:
- name: Adult Wistar rat Klebsiella meningitis
  species: Rat
  publication: PMID:24105840
  description: >-
    Adult Wistar rats with induced K. pneumoniae meningitis are used to measure
    cytokines, chemokines, and memory impairment after Gram-negative meningeal
    infection.
  modeled_mechanisms:
  - target: LPS-Driven Neutrophilic Meningeal Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model follows pro-inflammatory mediator induction in CSF and brain
      tissue after Gram-negative K. pneumoniae meningitis.
    limitations: >-
      Experimental induction in adult Wistar rats does not reproduce
      species-specific human acquisition, neonatal E. coli disease, or
      post-neurosurgical device-associated inoculation.
    evidence:
    - reference: PMID:24105840
      reference_title: Klebsiella pneumoniae meningitis induces memory impairment and increases pro-inflammatory host response in the central nervous system of Wistar rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The aim of the present study was to evaluate memory and
        pro-inflammatory mediators at different times in the brains of adult
        Wistar rats with K. pneumoniae meningitis.
      explanation: >-
        Describes an adult Wistar rat K. pneumoniae meningitis model for
        tracking CNS inflammatory mediators.

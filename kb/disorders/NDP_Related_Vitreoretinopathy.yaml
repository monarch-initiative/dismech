has_subtypes:
- name: Norrie disease
  display_name: Norrie Disease
  subtype_term:
    preferred_term: Norrie disease
    term:
      id: MONDO:0010691
      label: Norrie disease
  description: >
    The first described and most severe NDP-related phenotype, presenting at
    birth with bilateral grayish-yellow, glistening, elevated retrolental
    masses of immature retinal cells; foveal development is always
    incomplete. Norrie disease is the only NDP-related retinopathy with
    extraocular findings, which can variably include cognitive disability,
    mental health and behavior disorders, seizures, sensorineural hearing
    loss (typically childhood/adult onset, distinct from the congenital
    blindness), and peripheral vascular disease.
  evidence:
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The eye findings of Norrie disease, the first described and best characterized of these disorders, are typically bilateral grayish-yellow, glistening, elevated retrolental masses composed of immature retinal cells usually visible through clear lenses; foveal development is always incomplete."
    explanation: >
      GeneReviews describes the pathognomonic Norrie disease fundus finding of
      bilateral grayish-yellow, glistening, elevated retrolental masses.
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, Norrie disease is the only NDP-related retinopathy with associated extraocular findings, which can variably include cognitive disability, mental health and behavior disorders, seizures, sensorineural hearing loss, and peripheral vascular disease."
    explanation: >
      Establishes Norrie disease as the sole NDP-related phenotype with
      extraocular manifestations, distinguishing it from the milder
      NDP-related FEVR/PFV/ROP/Coats presentations.
  - reference: PMID:28602015
    reference_title: "Clinical and genetic analysis of Indian patients with NDP-related retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NDP-related retinopathies are a group of X-linked disorders characterized by degenerative and proliferative changes of the neuroretina, occasionally accompanied with varying degrees of mental retardation and sensorineural hearing loss."
    explanation: >
      Clinical cohort confirms the dual degenerative/proliferative retinal
      pathology and occasional systemic (mental retardation, hearing loss)
      involvement in NDP-related retinopathies.
- name: NDP-related FEVR
  display_name: NDP-Related Familial Exudative Vitreoretinopathy (EVR2)
  description: >
    Milder end of the NDP phenotypic spectrum, with peripheral retinal
    vascular abnormalities (avascular zones, neovascularization, exudation,
    tractional detachment) but without the extraocular features of Norrie
    disease. Modeled in detail as the EVR2 subtype of
    Familial_Exudative_Vitreoretinopathy.yaml; referenced here to place it
    within the broader NDP-related retinopathy continuum.
  evidence:
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of NDP-related retinopathies appears to be a continuum with considerable overlap, ranging from Norrie disease, NDP-related persistent fetal vasculature, NDP-related familial exudative vitreoretinopathy, NDP-related advanced retinopathy of prematurity, and NDP-related Coats disease."
    explanation: >
      GeneReviews places NDP-related FEVR within the continuum of NDP-related
      retinopathies alongside Norrie disease.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >
    NDP-related retinopathies are inherited in an X-linked manner. The
    majority of affected males have an NDP pathogenic variant inherited from
    their carrier mother, who has a 50% transmission risk per pregnancy;
    affected males transmit the variant to all daughters (who become
    carriers) and no sons. Rarely, heterozygous females have clinical
    manifestations.
  evidence:
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "males who inherit the pathogenic variant will be affected; females who inherit the pathogenic variant will be heterozygous and may rarely have clinical manifestations. Affected males transmit the NDP pathogenic variant to all of their daughters and none of their sons."
    explanation: >
      GeneReviews confirms the X-linked transmission pattern, including the
      rare occurrence of clinical manifestations in heterozygous females.
pathophysiology:
- name: Norrin-FZD4-LRP5-TSPAN12 Retinal Vascular Wnt Signaling Deficiency
  conforms_to: "norrin_fzd4_retinal_vascular_development#Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium"
  role: trigger
  description: >
    Loss-of-function NDP variants impair Norrin ligand activity, disrupting
    Norrin-FZD4-LRP5-TSPAN12 canonical Wnt/beta-catenin signaling in retinal
    vascular endothelium. This signaling axis is required for deep retinal
    vascular plexus formation and stabilization of endothelial junctional
    complexes that maintain the inner blood-retinal barrier; its loss
    produces the combined degenerative and proliferative retinal vascular
    pathology (incomplete vascularization with secondary neovascularization
    and exudation) seen across the NDP-related retinopathy spectrum.
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:37947657
    reference_title: "Mechanisms Underlying Rare Inherited Pediatric Retinal Vascular Diseases: FEVR, Norrie Disease, Persistent Fetal Vascular Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The early angiogenesis of the retina and its iBRB is a delicate process that is mediated by the canonical Norrin Wnt-signaling pathway in retinal endothelial cells. Pathogenic variants in genes that play key roles within this pathway, such as NDP, FZD4, TSPAN12, and LRP5, have been associated with the incidence of these retinal diseases."
    explanation: >
      Establishes NDP, FZD4, TSPAN12, and LRP5 as components of the shared
      canonical Norrin-Wnt signaling pathway required for normal retinal
      vascular development.
  - reference: PMID:41862006
    reference_title: "Therapeutic potential of norrin/FZD4/β-catenin signaling in blood-retinal barrier protection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interest in norrin signaling within the Wnt/β-catenin pathway arises from its crucial role in maintaining BRB integrity through the activation of the FZD4 receptor and LRP5/6 co-receptors, leading to the stabilization of endothelial junctional complexes and the maintenance and restoration of retinal vascular barrier properties"
    explanation: >
      Documents that Norrin-FZD4-LRP5/6 signaling stabilizes retinal
      endothelial junctional complexes, mechanistically linking pathway loss
      to blood-retinal barrier breakdown. Evidence source is OTHER because this
      is a review.
  downstream:
  - target: Failure of Intraretinal Capillary Formation
    causal_link_type: DIRECT
  - target: Cochlear Vascular Pathology Underlying Sensorineural Hearing Loss
    causal_link_type: DIRECT

- name: Failure of Intraretinal Capillary Formation
  description: >
    The retinal consequence of the signalling deficit, and the step at which
    this disease separates from an ordinary vasculopathy. Norrin is secreted by
    Muller glia and acts on the endothelium beside them, so the affected cell
    and the signalling cell are different; the vessels never receive the
    instruction to grow inward from the superficial plexus and form the deep
    intraretinal capillary beds. In Ndp-null mice intraretinal capillary
    formation is abolished outright rather than merely reduced. Severity in
    humans scales with residual signal, from a peripheral avascular zone in
    X-linked FEVR to near-total retinal hypovascularization in Norrie disease.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "norrin_fzd4_retinal_vascular_development#Incomplete Retinal Vascularization with Peripheral Avascular Retina"
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  - preferred_term: Mueller cell
    term:
      id: CL:0000636
      label: Mueller cell
  biological_processes:
  - preferred_term: Retinal blood vessel morphogenesis
    term:
      id: GO:0061304
      label: retinal blood vessel morphogenesis
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:42436854
    reference_title: "AAV-norrin gene therapy rescues retinal defects in mice with Norrie disease and oxygen-induced retinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Norrin, secreted by retinal Müller cells, activates canonical Wnt signaling via Frizzled-4 and co-receptors."
    explanation: >
      Establishes the paracrine arrangement this node describes, in which the
      Muller glial cell is the source and the endothelium the target.
  - reference: PMID:42436854
    reference_title: "AAV-norrin gene therapy rescues retinal defects in mice with Norrie disease and oxygen-induced retinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss-of-function mutations abolish intraretinal capillary formation in mice."
    explanation: >
      States the severity of the developmental failure this node asserts:
      intraretinal capillary formation is abolished, not merely impaired.
  downstream:
  - target: Retinal Hypovascularization, Dysplasia and Congenital Blindness
    causal_link_type: DIRECT

- name: Retinal Hypovascularization, Dysplasia and Congenital Blindness
  description: >
    At the severe end of the spectrum the avascular retina is also dysplastic,
    producing the retrolental fibrovascular mass historically called
    pseudoglioma, with retinal detachment usually present at or shortly after
    birth and blindness from infancy. The same lesion at higher residual signal
    gives X-linked FEVR, whose peripheral avascularity and exudative
    complications resemble retinopathy of prematurity - a resemblance that is
    phenotypic convergence on ischaemic retina, not shared aetiology, since ROP
    begins with hyperoxic vessel arrest rather than with a Norrin lesion.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "norrin_fzd4_retinal_vascular_development#Ischaemia-Driven Neovascularization, Exudation and Tractional Detachment"
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:42436854
    reference_title: "AAV-norrin gene therapy rescues retinal defects in mice with Norrie disease and oxygen-induced retinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In humans, mutations in NDP, which encodes norrin, cause Norrie disease, characterized by retinal hypovascularization and congenital blindness, and X-linked familial exudative vitreoretinopathy (FEVR), resembling retinopathy of prematurity (ROP)."
    explanation: >
      Supports both ends of the continuum this node describes and is the source
      of the stated resemblance between X-linked FEVR and retinopathy of
      prematurity.

- name: Cochlear Vascular Pathology Underlying Sensorineural Hearing Loss
  role: consequence
  biological_scale: TISSUE
  description: >
    Norrin-Wnt signaling is also required for cochlear vascular development.
    In Norrie disease, early malformation of the cochlear microvasculature
    precedes loss of vessel integrity, decline of the endocochlear potential,
    and subsequent hair cell death, explaining why hearing loss in Norrie
    disease has a later, progressive onset distinct from the congenital
    retinal blindness.
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:35132964
    reference_title: "The timing of auditory sensory deficits in Norrie disease has implications for therapeutic intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that cochlear vascular pathology occurs earlier than previously reported and precedes sensorineural hearing loss."
    explanation: >
      Mouse model study demonstrates that cochlear microvascular pathology
      precedes, and therefore is not a consequence of, the sensorineural hearing
      loss of Norrie disease.
  - reference: PMID:35132964
    reference_title: "The timing of auditory sensory deficits in Norrie disease has implications for therapeutic intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The work defines a disease mechanism whereby early malformation of the cochlear microvasculature precedes loss of vessel integrity and decline of endocochlear potential, leading to hearing loss and hair cell death while sparing spiral ganglion cells."
    explanation: >
      Defines the mechanistic sequence: microvascular malformation, loss of
      endocochlear potential, then hair cell death, with spiral ganglion
      cells relatively spared.

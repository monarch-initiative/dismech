name: NDP-Related Vitreoretinopathy
creation_date: "2026-07-07T00:00:00Z"
category: Mendelian
description: >
  NDP-related vitreoretinopathy is an X-linked spectrum of retinal vascular
  diseases caused by pathogenic variants in NDP, which encodes Norrin, a
  secreted Wnt-family ligand required for retinal vascular development. Norrin
  binds the Frizzled-4 (FZD4) receptor together with the co-receptor LRP5 and
  the potentiator TSPAN12 to activate canonical Wnt/beta-catenin signaling in
  retinal vascular endothelium, driving deep retinal vascular plexus formation
  and inner blood-retina barrier (iBRB) maturation. NDP-related retinopathies
  form a clinical continuum with considerable overlap -- ranging from Norrie
  disease, NDP-related persistent fetal vasculature, NDP-related familial
  exudative vitreoretinopathy (FEVR, EVR2), NDP-related advanced retinopathy
  of prematurity, and NDP-related Coats disease -- unified by degenerative and
  proliferative retinal vascular changes evident at or near birth. Norrie
  disease, the first described and most severe presentation, is the only
  NDP-related retinopathy with extraocular manifestations (sensorineural
  hearing loss, cognitive disability), reflecting a parallel requirement for
  Norrin-Wnt signaling in cochlear vascular development.

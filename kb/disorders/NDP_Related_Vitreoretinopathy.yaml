genetic:
- name: NDP
  gene_term:
    preferred_term: NDP
    term:
      id: hgnc:7678
      label: NDP
  notes: >
    NDP encodes Norrin, a secreted cystine-knot growth factor that activates
    canonical Wnt/beta-catenin signaling through FZD4/LRP5/TSPAN12 in retinal
    and cochlear vascular endothelium. Disease variants act through loss of
    Norrin ligand function; whole-gene deletions and missense variants have
    both been reported to cause the classical Norrie disease ocular
    phenotype.
  evidence:
  - reference: PMID:28602015
    reference_title: "Clinical and genetic analysis of Indian patients with NDP-related retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The whole NDP gene was deleted in patient I, while a missense NDP"
    explanation: >
      Documents that both whole-gene deletion and missense NDP variants
      produce the classical Norrie disease ocular phenotype.

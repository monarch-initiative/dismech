animal_models:
- name: Ndp knockout mouse
  species: Mouse
  genotype: Ndp knockout (norrin-deficient)
  description: >
    The standard model of Norrie disease, lacking norrin and therefore
    intraretinal capillary formation. Used both to define the vascular
    pathophysiology and to test AAV-mediated norrin replacement delivered
    intravitreally at postnatal day 7.
  publication: PMID:42436854
  modeled_mechanisms:
  - target: Failure of Intraretinal Capillary Formation
    relationship: RESCUES
    fidelity: MODERATE
    description: >
      Intravitreal AAV expressing norrin restored intraretinal capillary growth,
      vessel density and plexus organization, preserved the blood-retinal
      barrier and rescued visual function, establishing that the vascular defect
      is correctable postnatally rather than fixed at birth.
    limitations: >
      Mouse retinal vascularization is largely postnatal whereas human retinal
      vascularization completes before term, so the postnatal-day-7 treatment
      window has no straightforward human equivalent; and the mouse lacks the
      retrolental fibrovascular mass and retinal detachment that define severe
      human Norrie disease.
    readouts:
    - name: Intraretinal capillary growth and deep plexus organization after AAV-norrin
      target: Failure of Intraretinal Capillary Formation
      direction: RESTORED
      interpretation: >
        Structural confirmation that resupplying the ligand reverses the
        developmental vascular failure this node models.
      evidence:
      - reference: PMID:42436854
        reference_title: "AAV-norrin gene therapy rescues retinal defects in mice with Norrie disease and oxygen-induced retinopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Both vectors fully restored intraretinal capillary growth in Ndp KO mice, normalizing vessel density and plexus organization, preserving the blood-retinal barrier, and rescuing visual function."
        explanation: >
          Reports the readout and its restoration directly, across both vector
          serotypes tested.
    evidence:
    - reference: PMID:42436854
      reference_title: "AAV-norrin gene therapy rescues retinal defects in mice with Norrie disease and oxygen-induced retinopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss-of-function mutations abolish intraretinal capillary formation in mice."
      explanation: >
        Establishes that the model reproduces the human developmental vascular
        failure, supporting its use as informative for this node.

- name: Binding and Redistribution of RNA-Binding and Splicing Factors
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    (UGGAA)n binds a defined set of RNA-binding proteins. The original report
    showed by electrophoretic mobility-shift assay that the serine/arginine-rich
    splicing factors SRSF1 and SRSF9 (published under the older SFRS1/SFRS9
    names) bind the repeat in vitro. Later pulldown from nuclear extract
    confirmed sequence-specific co-precipitation of TDP-43, HNRNPM, SRSF9 and
    FUS with r(UGGAA)20 but not with the antisense sequence, and TDP-43 was
    shown to co-localize with foci in human SCA31 Purkinje cells.

    The direction of the effect is not the simple sequestration story it first
    resembles, and this is the most consequential nuance in SCA31 mechanism.
    TDP-43, FUS and hnRNPA2B1 do not merely get trapped: they act as RNA
    chaperones, and raising their level suppresses rather than worsens (UGGAA)n
    toxicity in Drosophila. So this node is curated as an alteration of the
    RNA-protein equilibrium rather than as loss of splicing-factor function, and
    no splicing target has been shown mis-spliced in human SCA31 cerebellum.
  molecular_functions:
  - preferred_term: (UGGAA)n repeat RNA binding by splicing factors and RNA chaperones
    term:
      id: GO:0003723
      label: RNA binding
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: spliceosomal mRNA splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:19878914
    reference_title: "Spinocerebellar ataxia type 31 is associated with \"inserted\" penta-nucleotide repeats containing (TGGAA)n."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An electrophoretic mobility-shift assay showed that essential splicing
      factors, serine/arginine-rich splicing factors SFRS1 and SFRS9, bind to
      (UGGAA)n in vitro.
    explanation: >-
      The original splicing-factor binding result. Note the gene symbols are the
      pre-2010 SFRS1/SFRS9 names for SRSF1 and SRSF9.
  - reference: PMID:33431896
    reference_title: "Small molecule targeting r(UGGAA)(n) disrupts RNA foci and alleviates disease phenotype in Drosophila model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

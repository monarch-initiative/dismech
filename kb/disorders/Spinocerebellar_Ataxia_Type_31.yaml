    from other ancestries. Cases reported outside Japan have been in people of
    Japanese descent, which is the epidemiological signature of the founder
    effect rather than of a worldwide distribution.
  evidence:
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is ranked the third most frequent SCA in Japan (after SCA3 and SCA6),
      very rarely found in neighboring Asian countries
    explanation: >-
      The national ranking and the sharp fall-off in neighbouring populations.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SCA31 has also been diagnosed in Brazilian SCA patients with Japanese
      ancestry, suggesting a strong founder effect
    explanation: >-
      The diaspora observation that distinguishes a founder effect from a
      geographically restricted environmental cause.
  - reference: PMID:36319738
    reference_title: "Spinocerebellar ataxia type 31 (SCA31)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA31 has a strong founder effect, which is consistent with the fact that
      this disease is basically absent in other ethnicities.
    explanation: The founder effect stated directly by the discovering group.
progression:
- phase: Late-onset slowly progressive cerebellar ataxia
  age_range: Mean onset 58.5 years (SD 10.3); wheelchair dependence near 79 years
  notes: >-
    SCA31 is among the latest-onset of all the spinocerebellar ataxias. A
    four-year prospective study of 44 genetically confirmed patients across ten
    Nagano referral centres measured a SARA progression of 0.8 points per year
    and a Barthel Index decline of 2.3 points per year, and summarized the
    averaged course as ataxia onset at 58.5 years, wheelchair dependence at
    79.4, and death at 88.5. Shorter disease duration at baseline predicted
    faster SARA progression. These are cohort means from one region, not
    individual prognoses, and the cohort's mean age at enrolment was already
    73.6 years.
  evidence:
  - reference: PMID:27830516
    reference_title: "Natural History of Spinocerebellar Ataxia Type 31: a 4-Year Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study indicated the averaged clinical course of SCA31 as follows: the
      patients develop ataxic symptoms at 58.5 ± 10.3 years, become wheelchair
      bound at 79.4 ± 1.7 years, and died at 88.5 ± 0.7 years.
    explanation: The averaged clinical trajectory from the only prospective natural-history study.
  - reference: PMID:27830516
    reference_title: "Natural History of Spinocerebellar Ataxia Type 31: a 4-Year Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The annual progression of the SARA score was 0.8 ± 0.1 points/year and
      that of the BI was -2.3 ± 0.4 points/year
    explanation: >-
      The quantitative progression rates that would anchor a trial's power
      calculation.
  - reference: PMID:27830516
    reference_title: "Natural History of Spinocerebellar Ataxia Type 31: a 4-Year Prospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we enrolled 44 patients (mean ± standard deviation 73.6 ± 8.5 years) with
      genetically confirmed SCA31 from 10 ataxia referral centers in the Nagano
      area, Japan
    explanation: >-
      The cohort behind those figures, including the enrolment age that
      constrains how the onset figure should be read.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The age of onset for SCA31 is 58.5 ± 10.3 years, making it the latest to
      manifest of all SCAs
    explanation: Places SCA31's onset age relative to the other spinocerebellar ataxias.
histopathology:
- name: Purkinje cell loss with halo-like amorphous perisomatic material
  diagnostic: false
  description: >-
    The signature SCA31 finding. Surviving Purkinje cells are surrounded by
    halo-like amorphous material composed of calbindin-positive somatic sprouts
    and synaptophysin-positive presynaptic terminals innervated from basket
    cells, inferior olivary neurons and other Purkinje cell afferents. The halo
    is therefore aberrant perisomatic reinnervation, not a protein aggregate,
    which distinguishes SCA31 from the inclusion-body pathology of the
    polyglutamine ataxias. Ubiquitin-positive degradation granules and Golgi
    fragmentation are enriched in the same cells, and the halo-bearing cells
    carry bent, elongated, folded nuclei while cells without the halo shrink
    with slender condensed nuclei.

    No finding_term is bound. HistopathologyFindingTerm is reachable only from
    the NCIT Histopathology Result branch plus a handful of HP rosette terms;
    neither NCIT nor HP names perisomatic sprouting around a degenerating
    Purkinje cell, and binding a generic neuronal-loss term would drop what is
    specific about this finding.
  evidence:
  - reference: PMID:24344778
    reference_title: "Distinctive features of degenerating Purkinje cells in spinocerebellar ataxia type 31."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that bent, elongated, often folded nuclei were observed
      frequently in degenerating Purkinje cells with the halo-like structure.
    explanation: >-
      The nuclear morphology that accompanies the halo, from direct examination
      of two SCA31 brains.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These amorphous materials are composed of calbindin-positive somatic
      sprouts (cactus-like formation) and synaptophysin-positive presynaptic
      terminals innervated from basket cells, neurons of the inferior olivary
      nucleus, or other neurons that connect to Purkinje cells
    explanation: >-
      Identifies what the halo is made of, which is what makes it reinnervation
      rather than aggregate.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ubiquitin-positive degradation granules and Golgi fragmentation are also
      enriched in the amorphous materials
    explanation: The proteostasis-adjacent findings that accompany the halo.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the affected regions, Purkinje cells not only drop in number, but also
      show shrinkage and halo-like amorphous materials surrounding the cells.
    explanation: >-
      States the cell loss and the shrinkage alongside the halo, which are the
      three components of the finding.
diagnosis:
- name: Targeted repeat-expansion testing for the 16q22.1 insertion
  description: >-
    Diagnosis is molecular, and the assay has to be chosen for the lesion. The
    insertion is large, compositionally complex and intronic, so it is not
    resolved by standard exome sequencing and a negative exome does not exclude
    SCA31. Historically the allele was characterized by Southern blot with
    motif-specific probes, and this remains the method that distinguishes a
    pathogenic (TGGAA)n-containing insertion from a non-pathogenic control
    insertion of comparable size. Fragment-length methods that report only
    insertion size cannot make that distinction.
  evidence:
  - reference: PMID:20424877
    reference_title: "Analysis of an insertion mutation in a cohort of 94 patients with spinocerebellar ataxia type 31 from Nagano, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that control alleles very rarely have a nonpathogenic
      large insertion in the SCA31 critical region and that not only the
      presence of the insertion but also its size is not sufficient evidence for
      a disease-causing allele.
    explanation: >-
      The explicit statement that presence and size of the insertion are
      insufficient, which is the argument for motif-resolving assays.
  - reference: PMID:20424877
    reference_title: "Analysis of an insertion mutation in a cohort of 94 patients with spinocerebellar ataxia type 31 from Nagano, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The insertions in normal controls were clearly detected by Southern
      hybridization using (TAAAA)(5) probe, while they were not labeled with
      (TGGAA)(5) or (TAGAA)(5) probe.
    explanation: >-
      The motif-specific hybridization result that operationalizes the
      distinction between a pathogenic and a control insertion.
- name: Cerebellar-predominant MRI with brainstem sparing
  description: >-
    MRI supports localization rather than making the diagnosis. The expected
    pattern is cerebellar atrophy, most marked in the upper vermis, with the
    brainstem spared, which separates SCA31 from multiple system atrophy of
    cerebellar type and from the multisystem SCAs, but not from the other pure
    cerebellar ataxias such as SCA6. A minority of patients do show brainstem or
    cortical atrophy, so a normal brainstem is not required for the diagnosis.
  evidence:
  - reference: PMID:36319738
    reference_title: "Spinocerebellar ataxia type 31 (SCA31)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      magnetic resonance imaging showed cerebellar atrophy without brainstem
      involvement
    explanation: The expected imaging pattern in the founding cohorts.
  - reference: PMID:36563608
    reference_title: "Spinocerebellar ataxia type 31: A clinical and radiological literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon radiological examination, clinicians can expect a high prevalence of
      cerebellar atrophy (78.7%), occasionally accompanied by brainstem (9.1%)
      and cortical (9.1%) atrophy.
    explanation: >-
      Qualifies the preceding claim: brainstem involvement is uncommon but not
      absent, so its presence does not exclude SCA31.
- name: Recognizing the extracerebellar half of the phenotype
  description: >-
    SCA31 is taught as a pure cerebellar ataxia, and the founding Japanese
    descriptions recorded no pyramidal signs, neuropathy or gaze limitation. The
    largest pooled review found extracerebellar signs in 52.5% of 374 patients,
    predominantly dysreflexia, vibratory hypoesthesia and hypoacousia. The
    practical consequence is that the presence of such signs should not by
    itself steer a workup away from SCA31, while their attribution to SCA31 in
    an individual patient in their seventies remains uncertain.
  evidence:
  - reference: PMID:36563608
    reference_title: "Spinocerebellar ataxia type 31: A clinical and radiological literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extracerebellar signs were observed in 52.5% of patients, primarily
      consisting of dysreflexia, vibratory hypoesthesia and hypoacousia.
    explanation: >-
      The pooled frequency of extracerebellar involvement, which is the finding
      that complicates the pure-cerebellar characterization.
  - reference: PMID:36563608
    reference_title: "Spinocerebellar ataxia type 31: A clinical and radiological literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical and radiological features of 374 patients issued from 25
      studies were collected.
    explanation: The denominator behind the pooled frequencies used throughout this entry.
treatments:
- name: Multidisciplinary Rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    There is no disease-modifying therapy for SCA31, and management is
    supportive: physical therapy for balance, gait and falls prevention,
    occupational therapy and home-safety assessment, and speech and swallowing
    therapy. A seven-year follow-up of annual four-week intensive rehabilitation
    in patients with pure cerebellar SCA6 or SCA31 found SARA scores stable
    through year six, better than the expected natural history, with
    deterioration appearing at year seven; balance measured by the BESTest
    declined earlier, from year three. The study is small (seven patients) and
    mixes SCA6 with SCA31, so it supports rehabilitation as worthwhile
    maintenance rather than as an SCA31-specific intervention with a measured
    effect size.
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:40906249
    reference_title: "Long-Term Effects of Annual Intensive Rehabilitation in Patients with Hereditary Pure Cerebellar Ataxia: A 7-year Follow-up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual intensive rehabilitation effectively slowed the progression of
      ataxic symptoms (SARA) for up to six years, while balance function
      (BESTest) showed a significant decline from the third year.
    explanation: >-
      The primary result, including the divergence between coordination and
      balance outcomes that qualifies it.
  - reference: PMID:40906249
    reference_title: "Long-Term Effects of Annual Intensive Rehabilitation in Patients with Hereditary Pure Cerebellar Ataxia: A 7-year Follow-up Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients with genetically confirmed SCA6 or SCA31 participated in
      annual 4-week intensive rehabilitation programmes.
    explanation: >-
      The cohort is seven patients pooling two diseases, so it cannot deliver an
      SCA31-specific effect estimate; recorded to bound the claim above.
- name: Naphthyridine Carbamate Dimer (Preclinical)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An experimental small molecule, not a treatment. Naphthyridine carbamate
    dimer (NCD) binds the r(UGGAA)n repeat, recognizing four guanines in the
    UGGAA/UGGAA pentad, and disrupts RNA foci and the repeat's interactions with
    TDP-43, HNRNPM and SRSF9. Fed to larvae of the SCA31 Drosophila model it
    alleviates the repeat-induced phenotype. It is curated because it is the
    only compound with a demonstrated effect on the SCA31 lesion and because it
    targets a pathophysiology node directly, not because it is near clinical
    use: there is no mammalian efficacy, pharmacokinetic or safety data, and its
    disruption of nuclear stress bodies suppresses a physiological splicing
    process, which is a mechanism-level liability rather than a hypothetical
    one.
  target_mechanisms:
  - target: Nuclear (UGGAA)n RNA Foci in Purkinje Cells
    description: >-
      NCD binds the repeat RNA and disperses the foci built on it.
    evidence:
    - reference: PMID:33431896
      reference_title: "Small molecule targeting r(UGGAA)(n) disrupts RNA foci and alleviates disease phenotype in Drosophila model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Biological studies show that NCD disrupts naturally occurring RNA foci
        built on r(UGGAA)n repeat RNA known as nuclear stress bodies (nSBs) by
        interfering with RNA-protein interactions resulting in the suppression
        of nSB-mediated splicing events.
      explanation: >-
        The mechanism of action on foci, quoted with the splicing consequence
        that is also the compound's chief liability.
  evidence:
  - reference: PMID:33431896
    reference_title: "Small molecule targeting r(UGGAA)(n) disrupts RNA foci and alleviates disease phenotype in Drosophila model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Feeding NCD to larvae of the Drosophila model of SCA31 alleviates the
      disease phenotype induced by toxic r(UGGAA)n repeat RNA.
    explanation: >-
      The in vivo result, in the only organism in which the compound has been
      tested against the SCA31 lesion.
animal_models:
- species: Drosophila melanogaster
  genotype: Transgenic expression of expanded (UGGAA)n pentanucleotide repeat RNA
  publication: PMID:28343865
  description: >-
    Transgenic flies expressing expanded (UGGAA)n reproduce the two molecular
    hallmarks of SCA31, nuclear RNA foci and poly-WNGME PPR protein, and develop
    compound-eye degeneration, shortened lifespan and progressive locomotor
    decline, with toxicity scaling with repeat length and expression level. It
    is the workhorse system for SCA31: the RNA-chaperone rescue by TDP-43, FUS
    and hnRNPA2B1, the TDP-43 suppression of PPR translation, and the NCD
    small-molecule result were all obtained in it.
  associated_phenotypes:
  - Compound eye degeneration
  - Shortened lifespan
  - Progressive locomotor defect
  modeled_mechanisms:
  - target: Nuclear (UGGAA)n RNA Foci in Purkinje Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces (UGGAA)n foci formation and its dependence on repeat
      length and expression level.
    limitations: >-
      Foci form in fly eye imaginal discs and nervous tissue under a
      heterologous driver at supraphysiological expression, not in Purkinje
      cells from an endogenous intronic locus. Drosophila has no cerebellum and
      no Purkinje cell, so the model cannot address the cell-type selectivity
      that is the most striking feature of the human disease.
    readouts:
    - name: Nuclear and cytoplasmic (UGGAA)n RNA foci burden
      target: Nuclear (UGGAA)n RNA Foci in Purkinje Cells
      direction: INCREASED
      interpretation: >-
        Foci accumulation in the fly is the direct counterpart of the foci
        observed in patient Purkinje cell nuclei.
      evidence:
      - reference: PMID:28343865
        reference_title: "Regulatory Role of RNA Chaperone TDP-43 for RNA Misfolding and Repeat-Associated Translation in SCA31."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the expression of UGGAAexp induced toxicity in vivo in a manner
          dependent on repeat length and gene dosage, accompanied by the
          accumulation of RNA foci
        explanation: >-
          Reports the foci accumulation and the length and dosage dependence
          behind this readout.
    evidence:
    - reference: PMID:35563872
      reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        flies exhibited a shorter lifespan and progressive locomotive defects
        with age
      explanation: >-
        Establishes that the model produces a progressive organismal phenotype,
        which is what makes it informative for the repeat-RNA node rather than a
        purely cell-biological readout.
  - target: Repeat-Associated Translation of poly-WNGME Pentapeptide Protein
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The fly produces the same poly-WNGME PPR protein detected in patient
      Purkinje cells, and PPR level tracks the severity of eye degeneration.
    limitations: >-
      PPR protein in the fly is predominantly cytoplasmic in eye imaginal disc
      cells, whereas in patients it is granular material in Purkinje cell bodies
      and dendrites; and the translation route remains unresolved in both
      systems, so the model cannot yet be used to test an intervention specific
      to repeat-associated non-AUG translation.
    readouts:
    - name: poly-WNGME PPR protein level
      target: Repeat-Associated Translation of poly-WNGME Pentapeptide Protein
      direction: INCREASED
      interpretation: >-
        PPR protein accumulation in the model matched by its detection in SCA31
        patient brain.
      evidence:
      - reference: PMID:28343865
        reference_title: "Regulatory Role of RNA Chaperone TDP-43 for RNA Misfolding and Repeat-Associated Translation in SCA31."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we observed an accumulation of UGGAAexp-encoded pentapeptide
          (Trp-Asn-Gly-Met-Glu) repeat (PPR) proteins in Drosophila and SCA31
          human brains
        explanation: >-
          The measurement in both the model and human brain, which is what makes
          this readout translationally anchored.
    evidence:
    - reference: PMID:28343865
      reference_title: "Regulatory Role of RNA Chaperone TDP-43 for RNA Misfolding and Repeat-Associated Translation in SCA31."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings expand the growing list of microsatellite expansion
        disorders in which repeat-associated translation occurs, and support a
        dual-toxicity mechanism of repeat RNAs and PPR proteins in
        neurodegeneration.
      explanation: >-
        The authors' summary of what the model establishes about the translation
        arm.
discussions:
- discussion_id: sca31_foci_versus_ppr_contribution
  prompt: >-
    How much of SCA31 Purkinje cell degeneration is caused by the (UGGAA)n RNA
    itself versus by the poly-WNGME pentapeptide protein it is translated into?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nuclear (UGGAA)n RNA Foci in Purkinje Cells
  - pathophysiology#Repeat-Associated Translation of poly-WNGME Pentapeptide Protein
  rationale: >-
    Both toxic species are present in patient Purkinje cells and both are
    produced by the fly model, but no experiment has separated their
    contributions. The obvious dissection, suppressing translation while leaving
    the RNA or the reverse, is complicated in SCA31 specifically, because the
    same manipulation affects both arms: raising TDP-43 reduces foci and PPR
    production together. It is complicated further by the unresolved translation
    route, since the repeat contains its own AUG and cannot be assumed to be
    RAN-translated, so a strategy that blocks RAN translation may not apply
    here. The answer matters for therapy: an approach that clears the transcript
    addresses both arms, whereas a translation-directed approach addresses only
    one.
  proposed_experiments:
  - experiment_id: exp_sca31_translation_blocked_repeat
    name: Translation-silent (UGGAA)n allele in a mammalian Purkinje cell system
    description: >-
      Express an (UGGAA)n repeat engineered to retain its RNA structure and
      foci-forming capacity while being unable to produce poly-WNGME, alongside
      the wild-type repeat, in a mammalian Purkinje-cell system, and compare
      toxicity.
    decision_criterion: >-
      Comparable toxicity from the translation-silent allele would attribute the
      damage predominantly to the RNA; markedly reduced toxicity would implicate
      the PPR protein.
  - experiment_id: exp_sca31_ppr_only_expression
    name: Direct poly-WNGME expression without the repeat RNA
    description: >-
      Express poly-WNGME from a codon-altered, non-repetitive construct that
      makes the protein without producing (UGGAA)n RNA, and assay Purkinje cell
      toxicity.
    decision_criterion: >-
      Toxicity from the protein alone would establish an RNA-independent
      contribution; its absence would argue the PPR protein is a marker rather
      than a driver.
  evidence:
  - reference: PMID:28343865
    reference_title: "Regulatory Role of RNA Chaperone TDP-43 for RNA Misfolding and Repeat-Associated Translation in SCA31."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is important to understand the contributions of repeat RNA and PPR
      proteins to disease pathogenesis.
    explanation: >-
      The authors state the apportionment as an open question rather than
      answering it, which is what this knowledge gap records.
- discussion_id: sca31_drosophila_translational_validity
  prompt: >-
    Does the (UGGAA)n Drosophila model, in which the repeat is overexpressed
    from a heterologous driver in a nervous system with no cerebellum, capture
    the biology that makes SCA31 a Purkinje-cell disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Drosophila melanogaster
  - pathophysiology#Binding and Redistribution of RNA-Binding and Splicing Factors
  rationale: >-
    Almost every mechanistic claim about SCA31 beyond the human autopsy findings
    rests on the fly. The mismatch is specific rather than generic. The most
    distinctive feature of human SCA31 is that foci and degeneration are
    confined to Purkinje cells and spare other neurons and glia, and Drosophila
    has neither a cerebellum nor a Purkinje cell, so the model cannot address
    selectivity at all. The fly expresses the repeat from a GAL4 driver at
    supraphysiological levels rather than from an endogenous intron under BEAN1
    transcriptional control, and the toxicity is explicitly expression-level
    dependent, so the dose relationship in the model is not the dose
    relationship in patients. The rescue result on which the whole
    RNA-chaperone therapeutic hypothesis rests, that raising TDP-43, FUS or
    hnRNPA2B1 suppresses toxicity, has not been reproduced in a mammalian
    system, and those proteins are pleiotropic enough that the manipulation may
    not be tolerable in one. No mouse model of the SCA31 insertion has been
    reported.
  proposed_experiments:
  - experiment_id: exp_sca31_knockin_mouse
    name: Knock-in mouse carrying the (TGGAA)n insertion at the orthologous intron
    description: >-
      Generate a mouse carrying the human-length (TGGAA)n-containing insertion
      at the orthologous Bean1/Tk2 shared intron, so the repeat is transcribed
      under endogenous brain-restricted control, and assay for Purkinje-cell
      foci, PPR protein, and age-dependent ataxia.
    decision_criterion: >-
      Purkinje-cell-selective foci and late-onset ataxia would establish that
      the fly findings translate to a mammalian cerebellum; their absence at
      physiological expression would show the fly phenotype depends on
      overexpression.
  - experiment_id: exp_sca31_ipsc_purkinje
    name: Patient-derived iPSC Purkinje cells
    description: >-
      Differentiate Purkinje-like neurons from SCA31 patient iPSCs carrying the
      endogenous insertion and test whether foci form, PPR protein accumulates,
      and RNA-binding-protein supplementation rescues, in a human cerebellar
      cell type at endogenous expression.
    decision_criterion: >-
      Reproduction of the fly rescue in human Purkinje-like cells would support
      the RNA-chaperone strategy; failure would localize the effect to the fly's
      overexpression regime.
  evidence:
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These SCA31 RNA foci were only detected in the BEAN1-direction (no
      anti-sense foci), ranged from 0.2 to 1.8 µm in diameter, and accumulated
      in the nuclei of Purkinje cells (not observed in other neurons or glial
      cells)
    explanation: >-
      Documents the Purkinje-cell selectivity in humans that the fly model has
      no way to reproduce.
  - reference: PMID:36319738
    reference_title: "Spinocerebellar ataxia type 31 (SCA31)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Subsequent investigation by over-expressing (UGGAA)n in Drosophila
      revealed that the RNA containing (UGGAA)n exerts toxicity in a length- and
      expression level-dependent manner
    explanation: >-
      Quoted for the words over-expressing and expression level-dependent, which
      together are the mismatch: the model's phenotype is a function of a dose
      the endogenous locus does not deliver.
notes: >-
  Curation caveat on the disease's reputation as a pure cerebellar ataxia. The
  founding Japanese descriptions, still the basis of most textbook summaries,
  explicitly recorded no pyramidal signs, neuropathy or gaze limitation, and the
  neuropathology finds cerebrum, brainstem and spinal cord normal. The largest
  pooled review nonetheless found extracerebellar signs in 52.5% of 374
  patients. This entry curates both, and does not resolve the tension, because
  the reviewers themselves note that SCA31 patients are old and long-diseased,
  which confounds the attribution of hearing loss, reduced vibration sense and
  reflex changes to the disease rather than to age.

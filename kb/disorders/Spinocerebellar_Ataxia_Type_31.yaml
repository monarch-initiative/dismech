- name: Nuclear (UGGAA)n RNA Foci in Purkinje Cells
  biological_scale: CELLULAR
  description: >-
    The (UGGAA)n transcript accumulates as discrete nuclear RNA foci in
    cerebellar Purkinje cells of SCA31 patients and not in controls. The foci
    are confined to Purkinje cell nuclei, are not seen in other neurons or in
    glia, are detected in roughly 30% of patient Purkinje cells examined, and
    measure about 0.2 to 1.8 micrometres. In the SCA31 fly model the number of
    foci tracks with disease severity, which is the closest available link
    between foci burden and outcome.

    A precise reading of what the human data show: the foci are associated with
    Purkinje cell degeneration. That is the word the neuropathology paper uses,
    and this entry keeps it. Whether foci formation is the proximal cause of the
    degeneration, or an accompanying marker of the toxic transcript, is not
    settled by an association in fixed tissue.

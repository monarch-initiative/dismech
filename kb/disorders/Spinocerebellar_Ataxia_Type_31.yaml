genetic:
- name: BEAN1
  gene_term:
    preferred_term: BEAN1
    term:
      id: hgnc:24160
      label: BEAN1
  association: Intronic complex pentanucleotide repeat insertion containing (TGGAA)n
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The disease allele is a heterozygous 2.5-3.8 kb insertion of complex
    pentanucleotide repeats in an intron of BEAN1 at 16q22.1. The insertion
    contains (TGGAA)n, (TAGAA)n, (TAAAA)n and (TAAAATAGAA)n, but only (TGGAA)n
    is disease-specific; the others occur on control chromosomes. Insertion size
    correlates inversely with age at onset but not with the rate of progression
    after onset.

    Interpretation caveats that matter at the bench. Size alone does not make an
    allele pathogenic: about 0.7% of controls in one Nagano series carried
    insertions of 1.0 to 3.5 kb, and those insertions lacked (TGGAA)n at their
    5' end by sequencing and by Southern hybridization. The mechanism is a toxic
    RNA gain of function rather than a coding change in BEAN1, so no
    variant-level protein consequence is recorded here; there is no protein
    product of the repeat to describe.

    A single homozygote has been reported, carrying insertions of about 3.0 and
    4.3 kb, of which only the 3.0 kb allele contained the (TGGAA)n stretch. The
    authors are explicit that whether a large insertion lacking (TGGAA)n is
    non-pathogenic remains undetermined.
  evidence:
  - reference: PMID:19878914
    reference_title: "Spinocerebellar ataxia type 31 is associated with \"inserted\" penta-nucleotide repeats containing (TGGAA)n."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other was an insertion, from 2.5-3.8 kb long, consisting of complex
      penta-nucleotide repeats including a long (TGGAA)n stretch.
    explanation: The gene-discovery statement describing the causal allele.
  - reference: PMID:20424877
    reference_title: "Analysis of an insertion mutation in a cohort of 94 patients with spinocerebellar ataxia type 31 from Nagano, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had a 2.6- to 3.7-kb insertion. The size of the insertion was
      inversely correlated with the age at onset but not associated with the
      progression rate after onset.
    explanation: >-
      A 94-patient cohort confirming the allele and separating what size does
      predict (onset) from what it does not (progression rate).
  - reference: PMID:20424877
    reference_title: "Analysis of an insertion mutation in a cohort of 94 patients with spinocerebellar ataxia type 31 from Nagano, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found that 3 of 405 control individuals (0.7%) had the insertions
      from 1.0 to 3.5 kb in length.
    explanation: >-
      The control observation that makes insertion size on its own an
      insufficient diagnostic criterion.
  - reference: PMID:20424877
    reference_title: "Analysis of an insertion mutation in a cohort of 94 patients with spinocerebellar ataxia type 31 from Nagano, Japan."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it remains undetermined whether a large insertion lacking (TGGAA)n is
      nonpathogenic
    explanation: >-
      The authors' own limit on the interpretive rule the rest of their paper
      supports; it bounds the claim rather than establishing it, hence INDIRECT.
  - reference: PMID:35563872
    reference_title: "Mechanistic and Therapeutic Insights into Ataxic Disorders with Pentanucleotide Expansions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The majority of healthy controls (99.77%) do not have any insertions or,
      on very rare occasions (0.23%), have an insertion without the TGGAA
      repeats.
    explanation: >-
      Quantifies the control allele distribution at the locus across the pooled
      literature.
- name: TK2
  gene_term:
    preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  association: Shares the affected intron; transcribed in the opposite direction
  relationship_type: MODIFIER
  notes: >-
    TK2 is listed here because the repeat insertion lies in an intron it shares
    with BEAN1, and TK2 is therefore the source of the antisense (UUCCA)n
    transcript. This is a locus relationship, not a coding gene-disease
    relationship, and it is emphatically not TK2 deficiency: the recessive
    coding-variant mitochondrial DNA depletion syndrome caused by TK2 is a
    different disease with a different mechanism, and its clinical trials are
    not SCA31 trials. The original report also found a single-nucleotide change
    in a TK2 intron segregating with SCA31, but showed it did not affect
    splicing or expression, so it is not curated as causal. The relationship
    type is MODIFIER rather than CAUSATIVE for that reason: the gene contributes
    the antisense transcript and the shared intron, not the causal lesion.
  evidence:
  - reference: PMID:19878914
    reference_title: "Spinocerebellar ataxia type 31 is associated with \"inserted\" penta-nucleotide repeats containing (TGGAA)n."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One was a single-nucleotide change in an intron of the thymidine kinase 2
      gene (TK2). However, this did not appear to affect splicing or expression
      patterns.
    explanation: >-
      Records the co-segregating TK2 intronic variant and the reason the
      original authors set it aside.
  - reference: PMID:36319738
    reference_title: "Spinocerebellar ataxia type 31 (SCA31)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While TK2 is ubiquitously expressed, BEAN1 is transcribed only in the
      brain.
    explanation: >-
      The expression difference that makes the BEAN1-direction transcript, not
      the TK2-direction one, the plausible pathogenic species.

pathophysiology:
- name: BEAN1/TK2 Intronic (TGGAA)n Pentanucleotide Repeat Insertion
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    The causative lesion is a 2.5-3.8 kb insertion of complex pentanucleotide
    repeats at 16q22.1, located in an intronic segment shared by BEAN1 and TK2.
    The insertion contains (TGGAA)n, (TAGAA)n, (TAAAA)n and (TAAAATAGAA)n, but
    only (TGGAA)n segregates with the disease: the other motifs are encountered
    in control Japanese chromosomes, and the rare control insertions lack the
    (TGGAA)n stretch. This is the disorder-specific substitution this entry
    makes against the generic molecular lesion of the conserved
    Purkinje-degeneration module.

    Two negatives matter for interpretation. Insertion size alone does not
    establish pathogenicity, because control alleles can also carry a large
    insertion; the (TGGAA)n content does. And the lesion is intronic and far
    larger than an exome read, so standard exome sequencing does not exclude it.

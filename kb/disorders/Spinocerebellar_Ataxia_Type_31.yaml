- name: Purkinje Cell Degeneration
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    The tissue lesion is a Purkinje-cell-restricted degeneration of the
    cerebellar cortex, with the cerebrum, brainstem and spinal cord appearing
    normal. Purkinje cells fall in number and shrink, and the surviving cells
    are characteristically surrounded by halo-like amorphous material made of
    calbindin-positive somatic sprouts and synaptophysin-positive presynaptic
    terminals: that is, an aberrant reinnervation of the shrinking soma rather
    than a deposit of aggregated protein. Ubiquitin-positive degradation
    granules and fragmentation of the Golgi apparatus are enriched in the same
    cells. Detailed morphological work separates two degenerative processes:
    shrinkage with the halo, which carries the bent, elongated, folded nuclei
    and the Golgi fragmentation and is considered specific to SCA31, and
    shrinkage without it.

    This entry does not declare conformance to the module's Purkinje calcium and
    proteostasis node. Golgi fragmentation and ubiquitin-positive granules are
    proteostasis-adjacent findings, but nothing bearing on Purkinje calcium
    handling has been measured in SCA31, in patients or in a mammalian model,
    and the module node asserts both.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  cellular_components:
  - preferred_term: fragmented Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:24344778
    reference_title: "Distinctive features of degenerating Purkinje cells in spinocerebellar ataxia type 31."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuropathologically, cerebellar Purkinje cells are preferentially affected
      and reduced in number in SCA31, and they are often surrounded by halo-like
      amorphous materials.
    explanation: The core neuropathological finding and its signature structure.
  - reference: PMID:24344778
    reference_title: "Distinctive features of degenerating Purkinje cells in spinocerebellar ataxia type 31."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Correspondingly, fragmentation of the Golgi apparatus was observed more
      frequently in Purkinje cells with the halo-like structure than in those
      without this structure.
    explanation: >-
      Ties the Golgi finding specifically to the halo-bearing subpopulation,

- name: Repeat-Associated Translation of poly-WNGME Pentapeptide Protein
  biological_scale: MOLECULAR
  description: >-
    The repeat RNA is translated into a pentapeptide repeat protein, poly-WNGME
    (Trp-Asn-Gly-Met-Glu), which accumulates as granular material in the cell
    bodies and dendrites of patient Purkinje cells and in the fly model. Whether
    this proceeds by repeat-associated non-AUG translation or by conventional
    AUG-initiated translation is explicitly unresolved: unlike most
    repeat-expansion disorders, the TGGAA repeat itself contains an AUG codon,
    and the flanking TAAAA and TAGAA sequences supply stop codons, so all three
    reading frames of the repeat yield the same product.

    In the fly, raising TDP-43 suppresses PPR protein production as well as foci
    formation, so the two toxic arms are not independently regulated.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell

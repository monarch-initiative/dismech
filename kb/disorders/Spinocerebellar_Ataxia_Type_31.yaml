name: Spinocerebellar Ataxia Type 31
creation_date: "2026-09-02T13:40:00Z"
description: >-
  SCA31 is an adult-onset, slowly progressive, autosomal dominant cerebellar
  ataxia caused by a 2.5-3.8 kb insertion of complex pentanucleotide repeats at
  chromosome 16q22.1, in an intronic segment shared by BEAN1 and TK2, which are
  transcribed in opposite directions. Of the several motifs in the insertion,
  only (TGGAA)n segregates with disease; the others occur in controls. The
  proposed mechanism is a toxic RNA gain of function rather than
  haploinsufficiency: the brain-restricted BEAN1-direction transcript (UGGAA)n
  forms nuclear RNA foci in Purkinje cells, binds RNA-binding and splicing
  proteins, and is additionally translated into a repeat-encoded poly-WNGME
  pentapeptide protein detected in patient Purkinje cells. The disease has a
  strong Japanese founder effect and is essentially absent from other
  ancestries. Clinically it is a relatively pure cerebellar syndrome with onset
  near 60 years, though a large literature review found extracerebellar signs in
  about half of patients.
category: Mendelian
parents:
- Hereditary cerebellar ataxia
- Neurodegenerative Disease
synonyms:
- SCA31
- spinocerebellar ataxia 31
- spinocerebellar ataxia, 16q22-linked
- 16q22.1-linked autosomal dominant cerebellar ataxia
- 16q-ADCA

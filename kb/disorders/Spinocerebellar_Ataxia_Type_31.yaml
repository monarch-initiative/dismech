    snippet: >-
      expression of expanded UGGAA (UGGAAexp) repeats, responsible for
      spinocerebellar ataxia type 31 (SCA31) in Drosophila, causes
      neurodegeneration accompanied by accumulation of UGGAAexp RNA foci and
      translation of repeat-associated pentapeptide repeat (PPR) proteins,
      consistent with observations in SCA31 patient brains
    explanation: >-
      Couples the fly result to the human observation and names both toxic
      products of the transcript.
  - reference: PMID:28343865
    reference_title: "Regulatory Role of RNA Chaperone TDP-43 for RNA Misfolding and Repeat-Associated Translation in SCA31."

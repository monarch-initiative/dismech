inheritance:
- name: Autosomal dominant inheritance
  description: >-
    SCA31 is autosomal dominant with adult onset, so penetrance is strongly
    age-dependent; a precise age-specific penetrance curve has not been
    published. The insertion length correlates inversely with age at onset, and
    the original report documented an expansion in one family showing
    anticipation. Later systematic sizing across parent-child pairs found the
    insertion changeable but not markedly unstable in either direction, so
    anticipation should not be assumed as a general property of the locus.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance

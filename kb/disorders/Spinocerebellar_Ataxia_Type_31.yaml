  - target: Bidirectional Transcription of the Repeat into (UGGAA)n Repeat RNA
    causal_link_type: DIRECT
    description: >-
      Because the insertion sits in an intron shared by two oppositely
      transcribed genes, it is transcribed from both strands, and the
      BEAN1-direction transcript is confined to brain.
    evidence:
    - reference: PMID:36319738
      reference_title: "Spinocerebellar ataxia type 31 (SCA31)."

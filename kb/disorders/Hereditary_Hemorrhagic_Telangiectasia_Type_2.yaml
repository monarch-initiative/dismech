notes: >-
  Scope and its relationship to the parent entry. This entry curates the
  ACVRL1-defined type (MONDO:0010880, OMIM 600376). The clinical syndrome as a
  whole is curated separately as Hereditary Hemorrhagic Telangiectasia
  (MONDO:0019180), and the locus-defined HHT4 as Hereditary Hemorrhagic
  Telangiectasia Type 4 (MONDO:0012532). Content overlap with the parent entry
  is expected and is not duplication: what makes this a separate entry is that
  the genotype-phenotype correlation is reproducible and clinically
  consequential - later and incompletely penetrant epistaxis, fewer pulmonary
  and cerebral AVMs, more gastrointestinal bleeding and anaemia, a hepatic
  burden that in one cohort was confined to HHT2, and a pulmonary arteriopathy
  that among the HHT genes is ACVRL1's alone. Where a claim is true of HHT
  generally rather than of ACVRL1 specifically, this entry says so rather than
  silently attributing it to the genotype; the prevalence record is annotated
  that way, and so is the treatment evidence.

  What is deliberately not asserted. No prevalence figure is given for HHT2
  itself - none is published, and the ACVRL1 share of solved cases varies
  between cohorts from 46% to 68%, which is a diagnostic-yield statistic and not
  a population rate. Frequencies are recorded only where an HHT2-specific
  percentage exists in a cited cohort; epistaxis and hepatic involvement
  therefore carry no frequency band despite being the entry's most
  characteristic features, because the sources report onset, penetrance or
  genotype contrast rather than a percentage of ACVRL1 carriers affected. The
  spinal arteriovenous malformation claim rests on a single cohort and is
  flagged as such in its own description.

  Mouse evidence. The BMP10-over-BMP9 ligand assignment and the
  stalled-migration/excess-proliferation cell biology come from mouse models and
  are graded MODEL_ORGANISM throughout. They are cited here because the human
  lesion is not accessible to this kind of experiment, not because the mouse
  work has been confirmed in human HHT2 tissue. The one place human tissue does
  speak directly is the somatic second hit, where lesion-specific biallelic
  ACVRL1 loss has been recovered from hepatic AVMs and a skin telangiectasia in
  an HHT2 patient.

  Deep research provenance. A falcon (Edison) run was requested for this entry
  per the curation default. Edison authentication failed in this environment
  (403 ProviderAuthError, confirmed with `deep-research-client providers
  --check`), so the run was re-issued with `--fallback` as the skill directs
  rather than substituting a provider by hand; it fell through to OpenScientist,
  which produced
  `research/Hereditary_Hemorrhagic_Telangiectasia_Type_2-deep-research-openscientist.md`
  (the report's own frontmatter records `fell_back: true`,
  `requested_provider: falcon`, and both provider attempts). Reference
  validation was retro-fitted onto it and resolved 35 of 35 citations with none
  off topic. Term validation on the same report found six wrong ontology
  bindings, including HP:0002110 offered as "pulmonary AVM" when it is
  Bronchiectasis, HP:0002435 offered for spinal AVM when it is Meningocele, and
  NCIT codes offered for pazopanib, thalidomide and pomalidomide that name a
  chlorinated hydrocarbon, omeprazole and defactinib respectively. None of those
  CURIEs is used in this entry: every term here was bound independently from the
  ontology caches and OLS. That divergence is the reason the report is treated
  as a source of leads and claims rather than of identifiers.

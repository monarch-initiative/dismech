    snippet: "Characteristics associated with a less robust response were older age (0.29 [95% CI, 0.05-0.53] per 10 years older, P = .02) and underlying ACVRL1 germ line mutation (0.62 [95% CI, -0.04 to 1.27] vs ENG, SMAD4, or mutation not known, P = .06]"

name: Hereditary Hemorrhagic Telangiectasia Type 2
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- HHT2
- telangiectasia, hereditary hemorrhagic, type 2
- ACVRL1-related hereditary hemorrhagic telangiectasia
- ALK1-related hereditary hemorrhagic telangiectasia
- Osler-Weber-Rendu disease type 2
description: >-
  Hereditary hemorrhagic telangiectasia type 2 (HHT2) is the ACVRL1 (ALK1) form
  of hereditary hemorrhagic telangiectasia: an autosomal dominant vascular
  dysplasia caused by germline loss-of-function variants in ACVRL1, the gene
  encoding the endothelial type I receptor serine/threonine kinase ALK1. ALK1
  is the signalling receptor for the circulating BMP9/BMP10 ligands, which the
  co-receptor endoglin captures and hands to it; activated ALK1 phosphorylates
  SMAD1/5, which partner SMAD4 to hold endothelium in a quiescent, correctly
  patterned arteriovenous configuration. Reduced ALK1 signalling permits stalled shear-directed
  endothelial migration and excess endothelial proliferation, producing direct
  artery-to-vein connections that lack an intervening capillary bed - small
  ones as mucocutaneous telangiectases, large ones as visceral arteriovenous
  malformations.
  HHT2 is not simply "HHT in a different gene". Multiple independent cohorts
  agree that, relative to the ENG form (HHT1), HHT2 has later and incompletely
  penetrant epistaxis, markedly fewer pulmonary and cerebral arteriovenous
  malformations and cerebral abscesses, more gastrointestinal bleeding and
  anaemia, and a distinctly hepatic burden - symptomatic liver involvement, a
  raised cardiac index, and high-output cardiac failure. ACVRL1 is also the HHT
  gene for which a second, opposite pulmonary lesion is best established:
  variants in it cause pulmonary arterial hypertension with occlusive
  remodelling of small pulmonary arteries, the mechanistic mirror image of the
  vascular dilatation that defines the disease everywhere else.
  Multifocality of the lesions is explained by somatic second hits inactivating
  the remaining ACVRL1 allele within individual telangiectases and AVMs.

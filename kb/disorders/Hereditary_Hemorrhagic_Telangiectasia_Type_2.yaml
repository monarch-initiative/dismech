      reference_title: Bevacizumab in patients with hereditary hemorrhagic telangiectasia and severe hepatic vascular malformations and high cardiac output.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 24 patients who had echocardiograms available for reread, there was a response in 20 of 24 patients with normalization of cardiac index (complete response [CR]) in 3 of 24, partial response (PR) in 17 of 24, and no response in 4 cases."
      explanation: >-
        Quantifies the effect on the exact haemodynamic node this treatment
        targets.
  - target: Loss of Endothelial Quiescence and Excess Angiogenic Drive
    description: >-
      Mechanistic rationale: the BMP9/10-ALK1 pathway normally damps endothelial

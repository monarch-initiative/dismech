inheritance:
- name: Autosomal dominant inheritance with age-related penetrance
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Penetrance is age-related and manifestation-specific: it is high for the
    syndrome as a whole by middle age, but individual features appear at
    different ages, and in HHT2 specifically even epistaxis - the earliest and
    most penetrant feature of HHT1 - is later in onset and incompletely
    penetrant. That makes clinical (Curacao) diagnosis unreliable in young
    ACVRL1 carriers and is the practical argument for molecular testing of
    at-risk relatives. Expressivity is highly variable both between and within
    families, with the organ distribution of lesions differing between
    relatives carrying the same ACVRL1 variant.
    Each child of an affected individual has a 50% chance of inheriting the
    pathogenic ACVRL1 variant. Homozygous or compound heterozygous germline
    loss of ACVRL1 is not observed as a viable human genotype; the germline
    state in HHT2 is heterozygous, with biallelic loss arising somatically
    within lesions.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HHT is inherited in an autosomal dominant manner with considerable intrafamilial variability and age-related penetrance of individual manifestations."
    explanation: >-
      GeneReviews states both the transmission mode and the age-dependence of
      penetrance that this block records.
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with HHT has a 50% chance of inheriting the pathogenic variant."
    explanation: Gives the recurrence risk stated in the description.
  - reference: PMID:17224686
    reference_title: "Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia: data from the French-Italian HHT network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epistaxis occurred later in HHT2, with incomplete penetrance (P<0.0001)."
    explanation: >-
      Directly supports the HHT2-specific penetrance claim - later onset and
      incomplete penetrance of the cardinal feature - rather than the generic
      HHT statement.
prevalence:
- population: Worldwide (hereditary hemorrhagic telangiectasia, all genotypes)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 20.0
  notes: >-
    This is the prevalence of HHT as a whole, not of HHT2 specifically. No
    published prevalence estimate exists for the ACVRL1 genotype alone; what is
    reported instead is the ACVRL1 share of molecularly diagnosed HHT, which is
    cohort- and country-dependent (see the genetic case_fractions below).
    Recorded here so that the syndrome-level figure is available without being
    misattributed to the gene-defined entity.
  evidence:
  - reference: PMID:32894695
    reference_title: Second International Guidelines for the Diagnosis and Management of Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary hemorrhagic telangiectasia (HHT) is an autosomal dominant disease with an estimated prevalence of 1 in 5000 that is characterized by the presence of vascular malformations (VMs)."
    explanation: >-
      Source of the 1 in 5,000 (20 per 100,000) syndrome-level estimate. It is
      explicitly a figure for HHT, which is why this record is annotated as
      all-genotype rather than HHT2-specific.
- population: gnomAD, All of Us and Regeneron Million Exome (ENG and ACVRL1 combined)
  measure_type: UNKNOWN
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 43.1
  notes: >-
    Genetic rather than clinical prevalence, and again for ENG plus ACVRL1
    combined rather than for ACVRL1 alone. Population-database analysis puts
    pathogenic and likely-pathogenic carriage at 1.753-2.555 per 5,000
    (35.1-51.1 per 100,000; the midpoint 43.1 is recorded here), rising to
    2.874-4.327 per 5,000 if potentially pathogenic variants are included - so
    roughly twice the 1 in 5,000 clinical figure, which the authors read as
    underdiagnosis. `measure_type` is UNKNOWN because carriage of a pathogenic
    variant is neither a point prevalence of disease nor an incidence; it is a
    genotype frequency, and the schema has no measure for that.
  rate_low: 35.1
  rate_high: 51.1
  evidence:
  - reference: PMID:41610956
    reference_title: Global prevalence of hereditary hemorrhagic telangiectasia-associated variants estimated by analysis of large-scale genomic databases.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The genetic prevalence of HHT ranged from 1.753 to 2.555 in 5000 individuals, when considering only pathogenic and likely pathogenic variants, and from 2.874 to 4.327 in 5000 individuals, when also potentially pathogenic variants were considered."
    explanation: >-
      Source of both bands recorded here. Graded COMPUTATIONAL because the
      estimate is derived by variant-classification analysis over population
      sequencing databases, not by ascertaining patients.
progression:
- phase: Childhood - clinically silent or epistaxis-only
  age_range: Childhood
  notes: >-
    HHT2 is often not diagnosable clinically in childhood. In a paediatric HHT
    cohort only 41% met three or more Curacao criteria at a median age of 8.4
    years, and only 23% of those presenting under age 6. Hepatic involvement is
    already detectable on imaging in about a third of HHT2 children and is
    entirely silent, with hepatic artery dilation as the earliest sign and
    already wider in HHT2 than in HHT1 children.
  evidence:
  - reference: PMID:37572862
    reference_title: Longitudinal Assessment of Curaçao Criteria in Children with Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children <6 years at presentation, only 23% fulfilled at least 3 criteria initially."
    explanation: Quantifies how poorly the clinical criteria perform in young children.
  - reference: PMID:28248153
    reference_title: Hepatic angiodynamic profile in paediatric patients with hereditary haemorrhagic telangiectasia type 1 and type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diameter of common hepatic artery was significantly larger in HHT2 (0.45 +/- 0.15 cm) compared to HHT1 (0.33 +/- 0.09, p < 0.01) and control children (0.32 +/- 0.08, p < 0.05)."
    explanation: >-
      Shows the HHT2 hepatic signal is measurable in childhood, before any
      clinical liver manifestation.
  - reference: PMID:28248153
    reference_title: Hepatic angiodynamic profile in paediatric patients with hereditary haemorrhagic telangiectasia type 1 and type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients had clinical manifestations of liver involvement."
    explanation: Supports describing the childhood hepatic involvement as silent.
- phase: Adulthood - chronic bleeding, anaemia and hepatic complications
  age_range: Adulthood
  notes: >-
    Epistaxis appears later than in HHT1 and telangiectases accumulate;
    gastrointestinal bleeding is rarely seen before age 50; iron-deficiency
    anaemia becomes the dominant burden; and the hepatic shunt burden that is
    silent in childhood declares itself as a raised cardiac index and, in some,
    high-output cardiac failure.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some individuals with HHT have GI bleeding, which is rarely seen before age 50 years."
    explanation: Anchors the late timing of the gastrointestinal bleeding phase.
  - reference: PMID:16470787
    reference_title: "Genotype-phenotype correlation in hereditary hemorrhagic telangiectasia: mutations and manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that HHT2 has a later onset than HHT1 and the former may disproportionately involve smaller vessels in tissues with more significant vascular remodeling."
    explanation: The genotype-specific statement that HHT2 onset is shifted later.
environmental:
- name: Pregnancy
  description: >-
    Pregnancy is not a cause of HHT2 but is its best-characterised physiological
    trigger. The peripheral vasodilation and rise in cardiac output of pregnancy
    load an already-shunting circulation, and adverse events reported in HHT
    pregnancies include heart failure, pulmonary and intracranial haemorrhage,
    and stroke. This is why the guidelines screen and treat pulmonary and
    cerebral AVMs before or during pregnancy, and why sizable pulmonary AVMs
    found in pregnancy are treated in the second trimester. Complications
    cluster in the second and third trimesters, when the maternal haemodynamic
    changes are maximal.
  presence: PRESENT
  effect: Increases the risk of haemorrhagic and cardiovascular complications
  influences_mechanisms:
  - target: Hyperdynamic Circulation with Elevated Cardiac Index
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      The physiological rise in cardiac output and fall in systemic vascular
      resistance add to the volume load already imposed by hepatic shunting.
    evidence:
    - reference: PMID:28603431
      reference_title: "Hereditary hemorrhagic telangiectasia and pregnancy: potential adverse events and pregnancy outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Such complications occur most often in the second and third trimesters when maternal changes such as peripheral vasodilation and increased cardiac output are at their maximum."
      explanation: >-
        Names the haemodynamic changes - peripheral vasodilation and increased
        cardiac output - by which pregnancy loads this node, and ties the timing
        of complications to when they peak.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with HHT considering pregnancy are screened and treated for pulmonary and cerebral AVMs; sizable pulmonary AVMs discovered during pregnancy are treated during the second trimester."
    explanation: >-
      The management response to this exposure, which is the practical evidence
      that pregnancy is treated as a risk period in HHT.
genetic:
- name: ACVRL1
  gene_term:
    preferred_term: ACVRL1
    term:
      id: hgnc:175
      label: ACVRL1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    ACVRL1 and ENG together account for up to 90% of disease-causal variants in
    HHT; the ACVRL1 share of molecularly solved cases varies by cohort from
    roughly 45% to 68%.
  notes: >-
    ACVRL1 (12q13) encodes activin receptor-like kinase 1 (ALK1), a
    transmembrane serine/threonine kinase type I receptor expressed in vascular
    endothelium. Germline variants are heterozygous and loss-of-function; both
    truncating and missense classes occur, and reported variants cluster in the
    kinase-domain exons. Do not import ENG (9q34, HHT1), SMAD4 (18q21, juvenile
    polyposis/HHT overlap) or GDF2 (10q11) into this block - those genes define
    other HHT entities.
  case_fractions:
  - population: Spanish RiHHTa registry, patients with a genetic test
    case_fraction_percent: 68.1
    cohort_size: 113
    notes: >-
      ACVRL1 was the more common HHT genotype in this Spanish cohort, which is
      the reverse of the ENG-predominant series reported elsewhere.
    evidence:
    - reference: PMID:32503579
      reference_title: "Current HHT genetic overview in Spain and its phenotypic correlation: data from RiHHTa registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among 113 patients with genetic test, 77 (68.1%) showed a genetic variant in ACVRL1 and 36 (31.8%) in ENG gene."
      explanation: Gives the ACVRL1 case fraction and the cohort size recorded here.
  - population: US HHT families with a detected mutation (34 kindreds screened)
    case_fraction_percent: 46.0
    cohort_size: 26
    notes: >-
      Reported per kindred rather than per proband; 26 of 34 kindreds had a
      detected mutation, of which 46% were in ACVRL1.
    evidence:
    - reference: PMID:16470787
      reference_title: "Genotype-phenotype correlation in hereditary hemorrhagic telangiectasia: mutations and manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found mutations in 26 of the 34 kindreds (76%) analyzed-54% were in ENG and 46% were in ACVRL1."
      explanation: >-
        Source of the 46% ACVRL1 share and of the 26-kindred denominator noted
        above.
  variants:
  - name: Truncating ACVRL1 variants
    clinical_significance: PATHOGENIC
    description: >-
      Nonsense and frameshift variants predicted to abolish receptor function.
      Within HHT2 they are associated with a higher frequency of epistaxis and
      telangiectasis than non-truncating variants.
    evidence:
    - reference: PMID:17224686
      reference_title: "Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia: data from the French-Italian HHT network."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Truncating mutations were associated with a higher frequency of epistaxis and telangiectasis, in HHT2."
      explanation: >-
        Establishes an intragenic genotype-phenotype gradient within HHT2 for
        the truncating variant class.
  - name: Germline deletion of the entire ACVRL1 gene
    clinical_significance: PATHOGENIC
    description: >-
      Whole-gene deletion is a documented germline lesion in HHT2 and was the
      background in which lesion-specific somatic second hits were demonstrated.
    evidence:
    - reference: PMID:41162588
      reference_title: Multiple lesion-specific somatic mutations and bi-allelic loss of ACVRL1 in a single patient with hereditary haemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "all from a single HHT patient caused by a germline deletion of the entire ACVRL1 gene"
      explanation: >-
        Documents whole-gene deletion as a germline ACVRL1 lesion class in a
        patient with HHT.
  evidence:
  - reference: PMID:8640225
    reference_title: Mutations in the activin receptor-like kinase 1 gene in hereditary haemorrhagic telangiectasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report three mutations in the coding sequence of the ALK1 gene in those families which show linkage of the ORW phenotype to chromosome 12."
    explanation: >-
      The founding demonstration that ACVRL1 is the HHT2 gene, establishing the
      gene-disease relationship this block asserts.
  - reference: PMID:8640225
    reference_title: Mutations in the activin receptor-like kinase 1 gene in hereditary haemorrhagic telangiectasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It includes the activin receptor like kinase 1 gene (ACVRLK1 or ALK1), a member of the serine-threonine kinase receptor family expressed in endothelium."
    explanation: >-
      Supports the receptor class and endothelial expression stated in the
      notes.
  - reference: PMID:16470787
    reference_title: "Genotype-phenotype correlation in hereditary hemorrhagic telangiectasia: mutations and manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ACVRL1 cluster largely in exons 7 and 8, but ENG mutations were widely distributed within that gene."
    explanation: Supports the statement that reported ACVRL1 variants cluster within the gene.
  - reference: PMID:39788978
    reference_title: Hereditary haemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to 90% of disease-causal variants are observed in ENG and ACVRL1, with SMAD4 and GDF2 less frequently responsible for HHT."
    explanation: >-
      Supports the frequency statement and places ACVRL1 among the two major
      HHT genes.
mechanistic_hypotheses:
- hypothesis_group_id: hepatic_alk1_dependence
  hypothesis_label: Hepatic endothelium is disproportionately ALK1-dependent because BMP9 is made in the liver
  status: EMERGING
  description: >-
    Why HHT2 is the hepatic form of HHT is not settled. Endoglin facilitates but
    is not strictly required for BMP9/BMP10 signalling through ALK1, so if the
    two proteins acted purely in series HHT1 and HHT2 should look alike, and
    they do not. One proposed explanation is regional ligand availability: BMP9
    is produced in the liver, so hepatic endothelial cells sit in a
    high-ligand environment in which the ligand-capturing contribution of
    endoglin matters less and the signalling contribution of ALK1 matters more.
    Losing one ACVRL1 allele would then bite harder in the liver than losing one
    ENG allele does. An alternative, not mutually exclusive, account is that
    ENG and ALK1 recruit different partner proteins in different vascular beds.
    Both are hypotheses about the ligand/receptor economy of specific vascular
    beds; neither has been demonstrated in human hepatic tissue.
  evidence:
  - reference: PMID:36250069
    reference_title: "An update on preclinical models of hereditary haemorrhagic telangiectasia: Insights into disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this latter context, high local BMP9 concentrations (BMP9 is made in the liver) could make hepatic ECs less dependent on ENG and more dependent on ALK1 activity."
    explanation: >-
      States the hypothesis in the reviewers' own words, and its hedged phrasing
      ("could make") is why this is recorded as EMERGING rather than canonical.
      Graded OTHER because the sentence is the review authors' proposed
      explanation rather than a result from any single study design.
  - reference: PMID:36250069
    reference_title: "An update on preclinical models of hereditary haemorrhagic telangiectasia: Insights into disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is possible that ENG and ALK1 interact with different partner proteins in different vascular beds to elicit differential downstream signalling."
    explanation: Records the competing bed-specific-partner account named in the description.
pathophysiology:
- name: ACVRL1 Germline Loss-of-Function Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a heterozygous germline loss-of-function variant in
    ACVRL1 on chromosome 12q13, present in every cell of the body. Reported
    classes include nonsense, frameshift, missense within the kinase domain, and
    whole-gene deletion.
  genetic_context:
    gene:
      preferred_term: ACVRL1
      term:
        id: hgnc:175
        label: ACVRL1
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: ALK1 type I receptor serine/threonine kinase activity
    modifier: DECREASED
    term:
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
  downstream:
  - target: Reduced Endothelial ALK1 Receptor Signaling
    causal_link_type: DIRECT
    description: >-
      A single functional ACVRL1 allele delivers less ALK1 receptor to the
      endothelial surface than the vasculature requires during remodelling.
    evidence:
    - reference: PMID:8640225
      reference_title: Mutations in the activin receptor-like kinase 1 gene in hereditary haemorrhagic telangiectasia type 2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data suggest a critical role for ALK1 in the control of blood vessel development or repair."
      explanation: >-
        The original ACVRL1 report draws exactly this inference - that the
        mutations act by compromising ALK1's role in vessel development - which
        is the edge from variant to reduced receptor signalling.
  evidence:
  - reference: PMID:8640225
    reference_title: Mutations in the activin receptor-like kinase 1 gene in hereditary haemorrhagic telangiectasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second locus, designated ORW2, was mapped to chromosome 12."
    explanation: Localises the HHT2 locus to chromosome 12, where ACVRL1 lies.
- name: Somatic Second-Hit Inactivation of the Remaining ACVRL1 Allele
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Individual lesions acquire a somatic mutation in the remaining wild-type
    ACVRL1 allele, producing local biallelic loss. This is what reconciles a
    germline variant present in every endothelial cell with a disease that is
    focal: telangiectases and AVMs arise where a second hit has occurred, not
    everywhere. Lesion-specific somatic ACVRL1 variants have been recovered from
    hepatic AVMs and from a skin telangiectasia in a patient whose germline
    lesion was a whole-gene ACVRL1 deletion, with different somatic variants in
    different lesions of the same person.
  genetic_context:
    gene:
      preferred_term: ACVRL1
      term:
        id: hgnc:175
        label: ACVRL1
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Reduced Endothelial ALK1 Receptor Signaling
    causal_link_type: DIRECT
    description: >-
      Loss of the second allele drops ALK1 signalling below the haploinsufficient
      level within the clone, which is where the lesion forms.
    evidence:
    - reference: PMID:41162588
      reference_title: Multiple lesion-specific somatic mutations and bi-allelic loss of ACVRL1 in a single patient with hereditary haemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data further support the second-hit pathophysiological mechanism to explain the multifocality of vascular lesions in HHT."
      explanation: >-
        States the causal role of the second hit in lesion genesis, which is the
        claim this edge makes.
  evidence:
  - reference: PMID:41162588
    reference_title: Multiple lesion-specific somatic mutations and bi-allelic loss of ACVRL1 in a single patient with hereditary haemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mosaic lesion-specific ACVRL1 variants were identified in four hepatic AVM samples and in one telangiectasia."
    explanation: >-
      Direct human evidence for lesion-restricted somatic ACVRL1 variants in
      HHT2 tissue, in both the hepatic and mucocutaneous compartments.
  - reference: PMID:36250069
    reference_title: "An update on preclinical models of hereditary haemorrhagic telangiectasia: Insights into disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increasing evidence points to the importance of a second genetic hit to generate biallelic mutations, and the sporadic nature of such somatic mutations would explain the localised formation of vascular lesions."
    explanation: >-
      Gives the reasoning that ties the second hit specifically to the focal
      distribution of lesions.
- name: Reduced Endothelial ALK1 Receptor Signaling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    ALK1 is the type I receptor for the circulating ligands BMP9 and BMP10.
    Ligand is captured by the co-receptor endoglin and handed to ALK1, a type II
    receptor joins and phosphorylates ALK1, and activated ALK1 phosphorylates
    SMAD1/5. With less functional ALK1, flux through this specific
    BMP9/10-ENG-ALK1 arm falls. Mouse work indicates BMP10 rather than BMP9 is
    the ligand whose loss reproduces the AVM phenotype.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: BMP9/BMP10-ALK1 signaling
    modifier: DECREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  molecular_functions:
  - preferred_term: ALK1 type I receptor serine/threonine kinase activity
    modifier: DECREASED
    term:
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
  downstream:
  - target: Deficient SMAD1/5-SMAD4 Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      Activated ALK1 is the kinase for SMAD1/5, so less ALK1 activity means less
      phospho-SMAD1/5 available to partner SMAD4 and enter the nucleus.
    evidence:
    - reference: PMID:36250069
      reference_title: "An update on preclinical models of hereditary haemorrhagic telangiectasia: Insights into disease mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The type II receptor phosphorylates ALK1, which in turn phosphorylates SMAD1/5 transcription factors that can then bind to SMAD4 and move to the nucleus to regulate gene expression."
      explanation: >-
        Sets out the receptor-to-transcription-factor step that this edge
        asserts.
  - target: Occlusive Remodeling of Small Pulmonary Arteries
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

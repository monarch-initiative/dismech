diagnosis:
- name: Curacao clinical criteria
  description: >-
    Clinical diagnosis rests on four criteria - recurrent spontaneous epistaxis,
    mucocutaneous telangiectases in characteristic sites, visceral AVMs, and an
    affected first-degree relative - with three of four establishing a definite
    diagnosis. These criteria are genotype-blind, and they under-perform
    specifically in HHT2: because epistaxis and telangiectases appear later in
    ACVRL1 disease and epistaxis is incompletely penetrant, a young ACVRL1
    carrier may not meet three criteria while carrying the variant.
  presence: PRESENT
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical diagnosis of HHT can be established in a proband with at least three of the following diagnostic criteria: recurrent epistaxis; mucocutaneous telangiectases in characteristic locations; visceral AVMs; a first-degree relative diagnosed with HHT on the basis of the preceding criteria."
    explanation: The criteria set and threshold recorded here.
  - reference: PMID:17224686
    reference_title: "Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia: data from the French-Italian HHT network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epistaxis occurred later in HHT2, with incomplete penetrance (P<0.0001)."
    explanation: >-
      Supports the specific limitation of clinical criteria in HHT2 - the
      criterion that is earliest and most reliable in HHT1 is the one that is
      delayed and incompletely penetrant here.
  - reference: PMID:37572862
    reference_title: Longitudinal Assessment of Curaçao Criteria in Children with Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relying solely on clinical criteria may lead to underdiagnosis of HHT in children."
    explanation: >-
      Quantified evidence for the under-performance of the criteria in
      childhood, which is when an at-risk ACVRL1 relative is typically assessed.
- name: ACVRL1 molecular genetic testing
  description: >-
    Identification of a heterozygous pathogenic ACVRL1 variant establishes the
    molecular diagnosis and, unlike the clinical criteria, is age-independent.
    This is what makes molecular testing the practical route to diagnosis in
    young at-risk relatives of an HHT2 proband, and what assigns a patient to
    this entity rather than to HHT1 or the SMAD4 overlap syndrome.
  presence: PRESENT
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis is established by identification of a heterozygous pathogenic variant in ACVRL1, ENG, or SMAD4 by molecular genetic testing."
    explanation: Names ACVRL1 testing as an established molecular diagnostic route.
  - reference: PMID:32503579
    reference_title: "Current HHT genetic overview in Spain and its phenotypic correlation: data from RiHHTa registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "since HHT is an age-dependent disease, genetic study is a very useful tool for diagnosis in young patients"
    explanation: >-
      States the age-independence argument for molecular over clinical
      diagnosis that this record relies on.
- name: Screening for pulmonary and cerebral arteriovenous malformations
  description: >-
    Transthoracic contrast echocardiography for pulmonary AVMs and brain MRI for
    cerebral AVMs are performed in HHT irrespective of genotype. The lower
    HHT2 lesion frequency lowers the yield but does not remove the indication,
    since an unscreened pulmonary AVM presents as stroke or abscess rather than
    gradually.
  presence: PRESENT
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evaluation for pulmonary AVMs every five years with transthoracic contrast echocardiography (TCE) in adults and TCE or chest radiograph with pulse oximetry in children"
    explanation: The pulmonary screening modality and interval recorded here.
- name: Hepatic imaging and cardiac assessment
  description: >-
    Because hepatic involvement is the compartment that most distinguishes HHT2,
    hepatic imaging and clinical evaluation for heart or liver failure carry
    particular weight in ACVRL1 patients. Note that GeneReviews lists liver
    biopsy among the procedures to avoid in HHT.
  presence: PRESENT

animal_models:
- name: Endothelial-specific Alk1 conditional knockout mouse
  species: Mouse
  genotype: Endothelial cell-specific conditional deletion of Alk1 (Acvrl1)
  publication: PMID:39429196
  description: >-
    Inducible endothelial-restricted deletion of Alk1 produces severe
    arteriovenous malformations with vascular leakage, and single-cell
    transcriptomics of the lesions identified a cell population co-expressing
    arterial and lymphatic endothelial markers, lineage-traced to ALK1-depleted
    arterial endothelium. Transplanting those cells was itself sufficient to
    cause vascular malformation, and MDM2 inhibition reduced AVM burden in the
    model.
  genes:
  - preferred_term: ACVRL1
    term:
      id: hgnc:175
      label: ACVRL1
  modeled_mechanisms:
  - target: Failure of Arteriovenous Network Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Endothelial Alk1 deletion reproduces the defining lesion of HHT2 - a
      direct arteriovenous connection - in a gene-specific way.
    limitations: >-
      The model deletes Alk1 biallelically and endothelium-wide, whereas HHT2
      patients are germline heterozygous with focal somatic second hits; so the
      model reproduces the lesion but not the focality that is the disease's
      most distinctive feature. It also does not reproduce the hepatic
      predominance that separates HHT2 from HHT1 in patients - the phenotype
      characterised here is pulmonary and systemic.
    readouts:
    - name: Arteriovenous malformation burden on micro-computed tomography
      target: Failure of Arteriovenous Network Patterning
      direction: INCREASED
      interpretation: >-
        Structural confirmation that the patterning failure node is realised in
        this model.
      evidence:
      - reference: PMID:39429196
        reference_title: Arterial-Lymphatic-Like Endothelial Cells Appear in Hereditary Hemorrhagic Telangiectasia 2 and Contribute to Vascular Leakage and Arteriovenous Malformations.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We performed endothelial-specific deletion of Alk1 in mice and found severe arteriovenous malformations and vascular leakage."
        explanation: Reports the malformation phenotype this readout measures.
    - name: Emergence of arterial-lymphatic-like endothelial cells on single-cell RNA sequencing
      target: Failure of Arteriovenous Network Patterning
      direction: INCREASED
      interpretation: >-
        A cell-state readout of the same node: ALK1-depleted arterial
        endothelium acquires a mixed arterial-lymphatic identity, which the
        study links causally to malformation.
      evidence:
      - reference: PMID:39429196
        reference_title: Arterial-Lymphatic-Like Endothelial Cells Appear in Hereditary Hemorrhagic Telangiectasia 2 and Contribute to Vascular Leakage and Arteriovenous Malformations.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The transcriptomics of single-cell analysis revealed a new distinctive cell cluster formed after Alk1 deletion where the cells coexpressed arterial and lymphatic endothelial markers."
        explanation: Reports the cell population this readout counts.
    evidence:
    - reference: PMID:39429196
      reference_title: Arterial-Lymphatic-Like Endothelial Cells Appear in Hereditary Hemorrhagic Telangiectasia 2 and Contribute to Vascular Leakage and Arteriovenous Malformations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss-of-function mutations in the activin receptor-like kinase 1 (Alk1) are linked to hemorrhagic telangiectasia type 2."
      explanation: >-
        States why an Alk1 deletion mouse is the informative model for this
        entity specifically rather than for HHT generally.
  evidence:
  - reference: PMID:39429196
    reference_title: Arterial-Lymphatic-Like Endothelial Cells Appear in Hereditary Hemorrhagic Telangiectasia 2 and Contribute to Vascular Leakage and Arteriovenous Malformations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, our studies revealed the mechanistic underpinnings of ALK1 signaling in regulating the endothelial phenotype and provided possibilities for new therapeutic strategies in hemorrhagic telangiectasia type 2."
    explanation: The study's own framing of this model as an HHT2 model.
experimental_models:
- name: LUMCi029-A-3 isogenic hiPSC line carrying ACVRL1 c.143G>A (p.Gly48Glu)
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:41905104
  description: >-
    CRISPR/Cas9-edited human induced pluripotent stem cell line heterozygous for
    a patient-derived ACVRL1 missense variant, on an isogenic background. It is
    the human counterpart of the mouse deletion models: heterozygous rather than
    biallelic, and carrying a specific disease allele rather than a null, so it
    matches the human germline state that the mouse models do not. The line is
    characterised for karyotype, pluripotency and trilineage differentiation but
    no vascular phenotype has been reported for it yet, so no modeled_mechanisms
    link is asserted - doing so would claim a result the report does not
    contain.
  evidence:
  - reference: PMID:41905104
    reference_title: Generation of ALK1 p.Gly48Glu mutant LUMCi029-A-3 for modeling Hereditary hemorrhagic telangiectasia type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report the generation and characterization of an isogenic human induced pluripotent stem cell (hiPSC) line carrying a heterozygous ACVRL1 c.143G > A (p.Gly48Glu) mutation."
    explanation: Establishes the line, its genotype, and its isogenic design.
  - reference: PMID:41905104
    reference_title: Generation of ALK1 p.Gly48Glu mutant LUMCi029-A-3 for modeling Hereditary hemorrhagic telangiectasia type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The edited line retained normal karyotype, pluripotency, and trilineage differentiation capacity."
    explanation: >-
      The full extent of what has been characterised - which is why this entry
      records the line without a mechanism link.

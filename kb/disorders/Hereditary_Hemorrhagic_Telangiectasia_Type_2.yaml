phenotypes:
- category: Hematologic
  name: Recurrent Epistaxis
  description: >-
    Recurrent spontaneous nosebleeds from ruptured nasal mucosal telangiectases;
    the cardinal and usually earliest manifestation of HHT, and the first
    Curacao criterion. In HHT2 it begins later than in HHT1 and is incompletely
    penetrant, so its absence in a young ACVRL1 carrier does not exclude the
    diagnosis. No frequency is recorded here because the HHT2-specific sources
    report incomplete penetrance without a percentage.
  phenotype_term:
    preferred_term: Recurrent epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
    temporality: RECURRENT
  diagnostic: true
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical manifestation is recurrent nosebleeds (epistaxis) beginning on average at age 12 years."
    explanation: >-
      Establishes epistaxis as the cardinal manifestation of HHT and gives the
      syndrome-level age of onset against which the HHT2 delay is measured.
  - reference: PMID:17224686
    reference_title: "Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia: data from the French-Italian HHT network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epistaxis occurred later in HHT2, with incomplete penetrance (P<0.0001)."
    explanation: The HHT2-specific onset and penetrance claim in this description.
  - reference: PMID:16470787
    reference_title: "Genotype-phenotype correlation in hereditary hemorrhagic telangiectasia: mutations and manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that epistaxis had an earlier onset in patients with HHT1 than those with HHT2, but the severity by middle ages was similar."
    explanation: >-
      Replicates the later onset in HHT2 and adds the important qualifier that
      the eventual severity converges - so this is a difference in timing, not
      in ultimate burden.
- category: Dermatologic
  name: Mucocutaneous Telangiectases
  description: >-
    Clusters of dilated post-capillary venules connected directly to dilated
    arterioles, on the lips, tongue, buccal mucosa, fingers and nose. The second
    Curacao criterion. In HHT2 they appear later than in HHT1, and truncating
    ACVRL1 variants carry a higher telangiectasis burden than other variant
    classes.
  phenotype_term:
    preferred_term: Mucocutaneous telangiectases
    term:
      id: HP:0001009
      label: Telangiectasia
  diagnostic: true
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The appearance of telangiectases is generally later than epistaxis but may be during childhood."
    explanation: Gives the relative timing of this feature stated in the description.
  - reference: PMID:17224686
    reference_title: "Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia: data from the French-Italian HHT network."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations were associated with a higher frequency of epistaxis and telangiectasis, in HHT2."
    explanation: Supports the intra-HHT2 variant-class gradient in telangiectasis burden.
- category: Gastrointestinal
  name: Gastrointestinal Bleeding
  description: >-
    Bleeding from gastrointestinal mucosal telangiectases, typically presenting

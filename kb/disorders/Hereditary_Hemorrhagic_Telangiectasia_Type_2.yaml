    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using endothelial-specific inducible Alk1 knockout mice (Alk1iECKO) and regionally resolved single-cell RNA sequencing, we show that loss of ALK1 signaling induces bAVMs predominantly in the perineural vascular plexus (PNVP)."
    explanation: >-
      Shows that ALK1 loss alone is sufficient to produce brain AVMs, and that
      they are regionally patterned - the mechanistic counterpart of the
      cerebral lesion this node represents.
  - reference: PMID:42579368
    reference_title: Targeting KIT prevents brain arteriovenous malformations driven by ALK1-deficient angiogenic endothelial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cross-species analyses and validation in human samples demonstrate that KIT expression is conserved in endothelial cells from both sporadic and HHT2 brain AVMs."
    explanation: >-
      Confirms in human HHT2 brain AVM tissue the endothelial state that the
      mouse work identifies, which is the rare point at which this node's cell
      biology is anchored in human material.
- name: Occlusive Remodeling of Small Pulmonary Arteries
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A separate and opposite pulmonary lesion from the pulmonary AVM: obliterative
    remodelling of small pulmonary arteries producing pre-capillary pulmonary
    arterial hypertension histologically indistinguishable from the idiopathic
    disease. ACVRL1 is the HHT gene for which this second disease phenotype is
    best established, and it means that pulmonary hypertension in an HHT2
    patient has two candidate mechanisms - this arteriopathy, and the
    post-capillary pressure rise from a high-output hepatic shunt - which are
    managed differently. Marked PROVISIONAL because the intermediate steps
    linking reduced ALK1 signalling to an occlusive rather than a dilating
    lesion are not established.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  downstream:
  - target: Pulmonary Arterial Hypertension
    causal_link_type: DIRECT

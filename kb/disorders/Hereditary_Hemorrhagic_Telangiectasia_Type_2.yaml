discussions:
- discussion_id: hht2_hepatic_tropism_unexplained
  prompt: >-
    Why does losing one ACVRL1 allele produce hepatic vascular malformations,
    while losing one ENG allele - in the same ligand-receptor complex -
    preferentially produces pulmonary and cerebral ones?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic Arteriovenous Shunting
  - pathophysiology#Reduced Endothelial ALK1 Receptor Signaling
  - mechanistic_hypotheses#hepatic_alk1_dependence
  rationale: >-
    Endoglin and ALK1 act in the same BMP9/10 receptor complex, with endoglin
    facilitating rather than being strictly required for ALK1 signalling. On a
    simple series model HHT1 and HHT2 should therefore differ in severity, not
    in organ distribution - and yet the organ distribution is exactly what
    separates them, reproducibly, across independent French-Italian, US and
    Spanish cohorts. The candidate explanations on offer are hypotheses about
    vascular-bed-specific ligand economy (BMP9 is made in the liver, so hepatic
    endothelium may lean on ALK1 rather than on endoglin for ligand capture)
    and about bed-specific interaction partners. Neither has been tested in
    human hepatic tissue, and neither predicts the reciprocal pulmonary and
    cerebral bias of HHT1. Until one is established, the genotype-phenotype
    correlation that drives HHT2 surveillance is an empirical regularity rather
    than a mechanism.
  proposed_experiments:
  - experiment_id: hht2_bed_specific_ligand_dependence
    name: Vascular-bed-resolved measurement of BMP9/BMP10 availability and ALK1 dependence
    description: >-
      In a conditional Acvrl1 or Eng endothelial-knockout model, quantify local
      BMP9 and BMP10 concentration and phospho-SMAD1/5 output separately in
      hepatic, pulmonary and cerebral endothelium, and test whether AVM
      susceptibility per bed tracks the predicted ligand-availability gradient
      rather than tracking gene identity alone.
    decision_criterion: >-
      A hepatic bed in which Acvrl1 loss reduces phospho-SMAD1/5 markedly more
      than Eng loss does, matched to high local BMP9, would support the
      ligand-economy hypothesis; equal reduction in both genotypes would refute
      it and shift weight onto bed-specific interaction partners.
    would_support:
    - mechanistic_hypotheses#hepatic_alk1_dependence
    supporting_outcome:
    - >-
      Hepatic endothelium shows a selective loss of phospho-SMAD1/5 on Acvrl1
      deletion relative to Eng deletion, in proportion to local BMP9.
    refuting_outcome:
    - >-
      Hepatic phospho-SMAD1/5 falls equally on Acvrl1 and Eng deletion, leaving
      the hepatic tropism of HHT2 unexplained by ligand availability.
  evidence:
  - reference: PMID:36250069
    reference_title: "An update on preclinical models of hereditary haemorrhagic telangiectasia: Insights into disease mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, this is not the case and there are clear genotype/phenotype correlations in HHT that are not understood."
    explanation: >-
      The review states plainly that the genotype-phenotype split this entry
      curates is unexplained, which is the gap recorded here.
- discussion_id: hht2_pulmonary_hypertension_two_mechanisms
  prompt: >-
    In an HHT2 patient with pulmonary hypertension, is the lesion the ACVRL1
    pulmonary arteriopathy or the post-capillary consequence of a high-output
    hepatic shunt?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Occlusive Remodeling of Small Pulmonary Arteries
  - pathophysiology#Hyperdynamic Circulation with Elevated Cardiac Index
  - phenotypes#Pulmonary Arterial Hypertension
  rationale: >-
    ACVRL1 is the one HHT gene in which pulmonary hypertension has two
    mechanistically opposite routes. One is a pre-capillary arteriopathy in
    which small pulmonary arteries occlude, histologically indistinguishable
    from idiopathic pulmonary arterial hypertension - the mirror image of the
    vascular dilatation that defines HHT everywhere else in the body. The other
    is the elevated pulmonary pressure that follows the volume load of hepatic
    left-to-right shunting, which is the HHT2-predominant complication. The two
    coexist in the same genotype and are separated by right heart
    catheterisation rather than by genetics, and they diverge in management: the
    hepatic route responds to reducing the shunt burden, the arteriopathy does
    not. This entry models them as separate nodes deliberately so that the
    distinction is not collapsed into a single "pulmonary hypertension in HHT2"
    claim.
  evidence:
  - reference: PMID:11484689
    reference_title: Clinical and molecular genetic features of pulmonary hypertension in patients with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations are associated with diverse effects, including the vascular dilatation characteristic of hereditary hemorrhagic telangiectasia and the occlusion of small pulmonary arteries that is typical of primary pulmonary hypertension."
    explanation: >-
      Documents that the same ACVRL1 mutations produce both a dilating and an
      occluding vascular lesion, which is what creates the ambiguity this
      discussion records.
- discussion_id: hht2_treatment_evidence_not_genotype_stratified
  prompt: >-
    Do the HHT therapeutic trials support genotype-specific recommendations for
    HHT2, or only genotype-blind ones?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Pomalidomide
  - treatments#Systemic Bevacizumab
  - clinical_trials#NCT03910244
  rationale: >-
    The therapeutic evidence base for HHT is enrolled on phenotype, not
    genotype. The pomalidomide trial randomised on epistaxis severity and
    anaemia; the guideline recommendations are written for HHT as a whole. The
    one partial exception runs the other way and favours this entity: the
    bevacizumab trial selected patients with severe hepatic vascular
    malformations and high cardiac output, which is the HHT2-predominant
    presentation, without stating genotype. So the treatments recorded in this
    entry are ones with established efficacy in HHT that are applied to HHT2
    patients. Reading any of them as an ACVRL1-specific recommendation would
    overstate what the trials tested.
    One signal does exist and it runs against this entity: a post-hoc analysis
    of PATH-HHT found ACVRL1 germline mutation among the characteristics
    associated with a less robust pomalidomide response, at P=0.06. A trend in a
    post-hoc analysis of a trial that did not randomise on genotype is not a
    basis for withholding an effective drug from HHT2 patients, and the entry
    does not treat it as one. It is recorded because it is the only genotype
    signal in HHT therapeutics and because the study that would settle it - a
    prospective genotype-stratified trial - has not been done.
  evidence:
  - reference: PMID:32894695
    reference_title: Second International Guidelines for the Diagnosis and Management of Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommendations highlight new evidence in existing topics from the first International HHT Guidelines and provide guidance in 3 new areas: anemia, pediatrics, and pregnancy and delivery."
    explanation: >-
      The guideline structure is organised by clinical domain rather than by

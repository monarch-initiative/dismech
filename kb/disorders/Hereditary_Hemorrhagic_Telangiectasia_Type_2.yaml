- name: Systemic Bevacizumab
  description: >-
    Intravenous anti-VEGF monoclonal antibody. The most HHT2-relevant systemic
    therapy: in a phase II trial of patients with severe hepatic vascular
    malformations and high cardiac output, bevacizumab lowered cardiac index in
    20 of 24 patients and also reduced epistaxis duration. Before this, liver
    transplantation was the only way to restore cardiac output in these
    patients. It works upstream of the bleeding, on the excess VEGF-driven
    angiogenic drive released by loss of ALK1 signalling, rather than on
    haemostasis.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

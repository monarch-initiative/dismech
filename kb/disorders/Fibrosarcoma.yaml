description: >-
  Fibrosarcoma is a rare malignant fibroblastic mesenchymal neoplasm arising in
  soft tissue or bone and composed of collagen-producing spindle fibroblasts.
  It comprises two clinically and biologically distinct age-related forms:
  infantile (congenital) fibrosarcoma, which is driven in most cases by a
  recurrent t(12;15)(p13;q25) ETV6-NTRK3 gene fusion (or alternative NTRK/kinase
  fusions), rarely metastasizes, and responds rapidly to selective TRK
  inhibitors, and adult-type fibrosarcoma, an aggressive spindle-cell sarcoma
  diagnosed by exclusion that carries a substantial risk of local recurrence and
  distant metastasis.
synonyms:
- fibrocytic tumor

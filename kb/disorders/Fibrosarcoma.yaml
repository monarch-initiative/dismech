diagnosis:
- name: Tissue Biopsy and Histopathologic Exclusion
  description: >-
    Imaging followed by tissue biopsy establishes spindle-cell fibroblastic
    histopathology; in adult-type fibrosarcoma, immunohistochemistry and
    molecular testing are required to exclude overlapping spindle-cell sarcomas.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:32809594
    reference_title: "Fibrosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis relies on imaging followed by tissue biopsy, and management
      centers on surgical resection with radiation and systemic therapy reserved
      for select patients.
    explanation: Establishes imaging followed by tissue biopsy as the core diagnostic pathway for fibrosarcoma.
  - reference: PMID:32809594
    reference_title: "Fibrosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult fibrosarcoma is now considered a diagnosis of exclusion, established
      only after other spindle-cell sarcomas with overlapping morphology have
      been ruled out.
    explanation: Documents the requirement for histopathologic and ancillary exclusion of morphologic mimics in adult fibrosarcoma.
- name: ETV6-NTRK3 Fluorescence In Situ Hybridization
  description: >-
    Tissue fluorescence in situ hybridization (FISH) detects the recurrent
    t(12;15)(p13;q25) ETV6-NTRK3 rearrangement in infantile fibrosarcoma.
  diagnosis_term:
    preferred_term: Fluorescence In Situ Hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:37576877
    reference_title: "Larotrectinib treatment for infantile fibrosarcoma in newborns: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a case of IFS in a newborn with a mass in the left lower
      extremity confirmed by imaging, histopathological examination, tissue FISH
      testing, and high-throughput sequencing to detect gene rearrangement.
    explanation: Supports tissue FISH testing to confirm gene rearrangement in infantile fibrosarcoma.
- name: Targeted Next-Generation Sequencing for Kinase Fusions
  description: >-
    High-throughput RNA/DNA next-generation sequencing identifies canonical
    ETV6-NTRK3 fusions as well as alternative NTRK1, RET, BRAF, and RAF1 kinase
    fusions to confirm diagnosis and guide TRK-targeted therapy.
  diagnosis_term:

- name: Infantile Fibrosarcoma
  subtype_term:
    preferred_term: infantile fibrosarcoma
    term:
      id: MONDO:0004557
      label: congenital fibrosarcoma
  description: >-
    A pediatric fibrosarcoma subset, often congenital or presenting during
    infancy, characterized by rapidly growing localized masses and frequent
    ETV6-NTRK3 fusion.
  evidence:
  - reference: PMID:37576877
    reference_title: "Larotrectinib treatment for infantile fibrosarcoma in newborns: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infantile fibrosarcoma (IFS) is a rare tumor in childhood characterized
      by a single, localized, painless mass that grows rapidly but has a
      relatively indolent biological behavior and a favorable prognosis.
    explanation: >-
      The abstract directly defines the infantile fibrosarcoma subtype and its
      typical clinical presentation.
- name: Adult-Type Fibrosarcoma
  description: >-
    A highly malignant fibroblastic spindle-cell sarcoma occurring outside
    infancy with substantial risk of local recurrence and distant metastasis,
    established as a diagnosis of exclusion after other morphologic spindle-cell
    sarcoma entities have been ruled out. Subset overlap with kinase-fusion
    spindle-cell sarcomas in older adults is increasingly recognized.
  evidence:
  - reference: PMID:32809594
    reference_title: "Fibrosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult fibrosarcoma is now considered a diagnosis of exclusion, established
      only after other spindle-cell sarcomas with overlapping morphology have
      been ruled out.
    explanation: Defines adult-type fibrosarcoma as a histopathologic and molecular diagnosis of exclusion.
  - reference: PMID:32809594
    reference_title: "Fibrosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, adult-type fibrosarcoma is highly malignant, with a
      substantial risk of local recurrence and distant spread.
    explanation: Contrasts the aggressive clinical behavior of adult-type fibrosarcoma with infantile fibrosarcoma.
  - reference: PMID:37782551
    reference_title: "Kinase fusion positive intra-osseous spindle cell tumors: A series of eight cases with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, all four tumors presenting in the elderly were high-grade spindle
      cell sarcomas, with adult fibrosarcoma (FS)-like, malignant peripheral
      nerve sheath tumor (MPNST)-like and MPNST phenotypes.
    explanation: >-
      Supports adult fibrosarcoma-like high-grade spindle-cell morphology within
      the kinase-fusion sarcoma spectrum.
pathophysiology:
- name: Fusion-Driven Oncogenic Signaling
  biological_scale: MOLECULAR
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  description: >-
    Recurrent somatic gene fusions—most commonly the t(12;15)(p13;q25)
    ETV6-NTRK3 translocation in infantile fibrosarcoma, and less commonly NTRK1
    or other kinase fusions—join an oligomerization partner domain (ETV6) to a
    receptor tyrosine kinase domain (NTRK3/NTRK1), driving ligand-independent
    dimerization and constitutive oncogenic kinase signaling in fibroblast-lineage
    cells.

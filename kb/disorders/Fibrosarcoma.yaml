  evidence:
  - reference: PMID:37576877
    reference_title: "Larotrectinib treatment for infantile fibrosarcoma in newborns: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-five percent of infantile fibrosarcomas are associated with t

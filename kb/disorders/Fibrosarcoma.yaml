treatments:
- name: Surgical Resection
  description: >-
    Surgical resection is the primary local treatment for both adult-type and
    resectable infantile fibrosarcoma, with conservative surgery favored in
    infantile fibrosarcoma to avoid mutilating procedures.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  target_mechanisms:
  - target: Fibroblastic Malignant Proliferation
    description: Complete surgical excision removes the proliferating malignant fibroblastic tumor mass.
  - target: Localized Painless Mass
    description: Resection directly removes the primary localized soft-tissue tumor mass.
  evidence:
  - reference: PMID:32809594
    reference_title: "Fibrosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis relies on imaging followed by tissue biopsy, and management
      centers on surgical resection with radiation and systemic therapy reserved
      for select patients.
    explanation: StatPearls establishes surgical resection as the central treatment modality across fibrosarcoma.
  - reference: PMID:37533946
    reference_title: "Limb salvage of an infant with infantile fibrosarcoma using TRK inhibitor larotrectinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary therapy involves complete surgical resection with or without
      chemotherapy.
    explanation: >-
      The abstract states the standard role of surgery, with chemotherapy as an
      optional component.
  - reference: PMID:32784118
    reference_title: "Spotlight on the treatment of infantile fibrosarcoma in the era of neurotrophic tropomyosin receptor kinase inhibitors: International consensus and remaining controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapies consisted of tumour resection and/or perioperative chemotherapy
      for extensive tumours.
    explanation: >-
      The consensus review abstract supports tumor resection and perioperative
      chemotherapy as conventional treatment approaches.
- name: Chemotherapy
  description: >-
    Perioperative or non-surgical chemotherapy has been used for extensive
    infantile fibrosarcoma, although TRK inhibitors are now an important option
    in NTRK fusion-positive disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Fibroblastic Malignant Proliferation
    treatment_effect: INHIBITS
    description: Cytotoxic chemotherapy inhibits proliferating malignant fibroblastic cells to facilitate conservative surgery.
  evidence:
  - reference: PMID:32784118
    reference_title: "Spotlight on the treatment of infantile fibrosarcoma in the era of neurotrophic tropomyosin receptor kinase inhibitors: International consensus and remaining controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-five patients (40% of all survivors) were treated with surgery
      alone and 64 patients (39%) with surgery combined with chemotherapy.
    explanation: >-
      Supports chemotherapy as a common historical component of infantile
      fibrosarcoma treatment.

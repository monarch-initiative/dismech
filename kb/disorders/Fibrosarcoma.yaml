    explanation: Supports high-throughput sequencing for fusion confirmation and targeted-therapy selection.
  - reference: PMID:37782551
    reference_title: "Kinase fusion positive intra-osseous spindle cell tumors: A series of eight cases with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fusions spanned a large spectrum of kinase genes, including in
      descending order NTRK3 (n = 6), NTRK1 (n = 4), RET (n = 2), BRAF (n = 2),
      and RAF1 (n = 1).
    explanation: Supports broad kinase-fusion sequencing when canonical ETV6-NTRK3 testing is negative in fibrosarcoma-spectrum spindle-cell tumors.
notes: >-
  Fibrosarcoma encompasses infantile (congenital) fibrosarcoma, typically driven
  by somatic ETV6-NTRK3 or alternative NTRK fusions, and adult-type fibrosarcoma,
  a diagnosis of exclusion among malignant fibroblastic spindle-cell sarcomas.
  The three EGA datasets below profile sclerosing epithelioid fibrosarcoma (SEF,
  typically EWSR1-CREB3L1-rearranged), a related fibroblastic sarcoma entity
  retained from automated dataset matching.
datasets:
- accession: ega:EGAS00001005214
  title: Sclerosing epithelioid fibrosarcoma case report
  description: Sclerosing epithelioid fibrosarcoma (SEF) is a rare and aggressive soft tissue sarcomathought to originate in fibroblasts of the tissues surrounding tendons, ligaments and muscles. Minimally responsive to conventional cytotoxic chemotherapies, greater than 50% of SEF patients experience relapse and/or metastatic disease. SEF is most commonly discovered in middle-aged and elderly adults, but also rarely in children. A common gene fusion occurring between the EWSR1 and CREB3L1 genes has been observed in 80-90% of SEF cases. We describe here the youngest SEF patient reported to date (a 3-year-old Caucasian male) who presented with numerous bony and lung metastases.
  organism:
    preferred_term: human

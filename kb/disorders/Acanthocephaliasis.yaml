      A prominent characteristic of the phylum, from which it receives its name,
      is a protrusible proboscis that is armed with recurved hooks, by which the
      worm attaches to the wall of the intestine of the definitive host
    explanation: >-
      Supports the proboscis-hook attachment mechanism that defines
      thorny-headed worms.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      liberated parasites attach to the mucosa of the small intestine, where
      they mature into adults
    explanation: >-
      Localizes the human host stage to the small-intestinal mucosa.
- name: Proboscis-Associated Mucosal Ulceration
  biological_scale: TISSUE
  description: >-
    Hooked-proboscis penetration and repeated release-and-reattachment injure
    the intestinal mucosa, producing ulceration, hemorrhage, edema, and mixed
    inflammatory infiltrates that can include neutrophils, eosinophils, and
    lymphocytes.

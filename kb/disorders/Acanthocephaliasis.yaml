name: Acanthocephaliasis
creation_date: '2026-11-14T09:32:31Z'
synonyms:
- acanthocephalan infection
- thorny-headed worm infection
category: Infectious Disease
description: >-
  Acanthocephaliasis is a rare zoonotic intestinal helminthiasis caused by
  Acanthocephala, the thorny-headed worms, with most documented human cases due
  to Macracanthorhynchus hirudinaceus, Macracanthorhynchus ingens, or
  Moniliformis moniliformis. Acanthocephalans alternate between a vertebrate
  definitive host that sheds embryonated eggs in feces and an arthropod
  intermediate host in which larvae develop from acanthor to acanthella to the
  infective cystacanth. Humans become incidental definitive hosts after
  ingesting cystacanth-infected arthropods or, for some marine species,
  paratenic hosts. Liberated juveniles attach to the small-intestinal mucosa
  through a hooked eversible proboscis, mature into adult worms, and can cause
    asymptomatic worm passage, abdominal pain, diarrhea, nausea, anorexia,
    abdominal distension, vomiting, weight loss, eosinophilia, or rare
    ulceration, ileus, and perforation. Diagnosis usually rests on morphologic
    identification of a passed adult worm in stool; pyrantel pamoate has been
    used for mild infections, while invasive worms may need endoscopic or
    surgical removal.
disease_term:
  preferred_term: acanthocephaliasis
  term:
    id: MONDO:0000295
    label: acanthocephaliasis
parents:
- helminthiasis
infectious_agent:
- name: Acanthocephala
  infectious_agent_term:
    preferred_term: Acanthocephala
    term:
      id: NCBITaxon:10232
      label: Acanthocephala <thorny-headed worms>
  description: >-
    Phylum of parasitic worms, now placed near or within Rotifera, whose members
    have an eversible anterior proboscis armed with hooks. The species most
    often documented in human infection are M. hirudinaceus, M. ingens, and
    M. moniliformis, with rare reports due to Acanthocephalus,
    Pseudoacanthocephalus, Corynosoma, and Bolbosoma species.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acanthocephala is a phylum of parasitic pseudocoelomates that infect a
      wide range of vertebrate and invertebrate hosts and can cause zoonotic
      infections in humans.
    explanation: >-
      The review identifies Acanthocephala as the parasite phylum that causes
      zoonotic human acanthocephaliasis.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most documented cases of human acanthocephaliasis are caused by
      Macracanthorhynchus hirudinaceus, Macracanthorhynchus ingens, and
      Moniliformis moniliformis.
    explanation: >-
      Supports naming these three species as the dominant documented human
      agents within the broader phylum.
agent_life_cycle:
  description: >-
    Human-infecting acanthocephalans have multihost cycles. Adult worms in a
    vertebrate definitive host shed acanthor-containing eggs in feces; an
    arthropod intermediate host ingests the eggs and supports larval
    development through acanthella to the infective cystacanth; a definitive
    host becomes infected after ingesting an arthropod, or in some marine
    cycles a paratenic host, that contains cystacanths. Humans are incidental
    definitive hosts after eating infected arthropods or paratenic hosts, and
    adult worms are usually recognized only when they pass in stool.
  hosts:
  - preferred_term: arthropods
    term:
      id: NCBITaxon:6656
      label: Arthropoda
    role: intermediate host
    description: >-
      Scarabaeoid beetles, millipedes, beetles, cockroaches, and marine
      amphipod crustaceans can act as intermediate hosts for different
      acanthocephalan species.
  - preferred_term: pig
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
    role: definitive host for Macracanthorhynchus hirudinaceus
  - preferred_term: rodents
    term:
      id: NCBITaxon:9989
      label: Rodentia
    role: definitive host for Moniliformis moniliformis
  - preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental definitive host
    description: >-
      Humans can acquire cystacanths and develop adult intestinal worms, but
      published human cases are sporadic and do not sustain the parasite in a
      known transmission cycle.
  life_cycle_stages:
  - name: Embryonated egg shed in definitive-host feces
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Adult worms in the definitive host produce fully embryonated eggs that
      contain an acanthor and leave the host in feces.
    evidence:
    - reference: PMID:34076470
      reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Fully embryonated eggs containing an infective first-stage larva
        (acanthor) are shed in the feces of the definitive host.
      explanation: >-
        Supports the fecal egg stage and the acanthor inside shed eggs.
  - name: Acanthor to cystacanth development in an arthropod
    description: >-
      An arthropod intermediate host ingests eggs, and the parasite develops
      internally through the acanthor and acanthella stages to the cystacanth
      stage that infects a vertebrate definitive host.
    evidence:
    - reference: PMID:34076470
      reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Within the arthropod host, the parasite goes through multiple stages,
        from acanthor to acanthella to cystacanth, the last of which is the
        infective stage for the definitive host.
      explanation: >-
        Supports the ordered arthropod stages and identifies the cystacanth as
        infective for the next host.
  - name: Adult thorny-headed worm in small intestine
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      After a definitive host eats an arthropod carrying cystacanths, liberated
      juveniles attach by their proboscis to small-intestinal mucosa and mature
      into adult worms over several weeks.
    evidence:
    - reference: PMID:34076470
      reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In the definitive host, liberated parasites attach to the mucosa of the
        small intestine, where they mature into adults and mate in about 8 to 12
        weeks
      explanation: >-
        Supports adult-stage residence on the small-intestinal mucosa after the
        cystacanth reaches a definitive host.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Acanthocephalans have a complex multihost life cycle
    explanation: >-
      Frames the acanthocephalan cycle as multihost rather than direct
      person-to-person or environmentally completed in humans.
  - reference: PMID:39979033
    reference_title: Moniliformis moniliformis acanthocephaliasis in a paediatric patient.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      When the definitive host, a rodent or sometimes human, ingests the
      cystacanth-infected arthropod, the cystacanths release and attach to the
      host’s small intestine where they mature into adult worms and reproduce,
      completing the cycle.
    explanation: >-
      A 2024 pediatric case review recapitulates the M. moniliformis cycle,
      including humans as occasional definitive hosts after arthropod ingestion.
transmission:
- name: Ingestion of cystacanth-infected arthropods
  description: >-
    Humans acquire Macracanthorhynchus and Moniliformis infections by directly
    ingesting an infected arthropod intermediate host, commonly when toddlers
    put beetles, cockroaches, millipedes, or other insects into the mouth.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The definitive host, including humans, becomes infected after ingesting
      arthropods containing infective cystacanths.
    explanation: >-
      Supports arthropod ingestion as the shared route for the main
      human-infecting acanthocephalans.
  - reference: PMID:39979033
    reference_title: Moniliformis moniliformis acanthocephaliasis in a paediatric patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Infections are acquired via direct ingestion of arthropod intermediate hosts.
    explanation: >-
      The recent M. moniliformis case review states the same arthropod-ingestion
      route for human acanthocephaliasis.
- name: Ingestion of paratenic hosts in marine species
  description: >-
    Some rarer Corynosoma and Bolbosoma infections are linked to eating raw or
    undercooked marine fish that act as paratenic hosts after marine
    crustacean intermediate hosts.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Members of the genus Bolbosoma are parasites of whales. Marine planktonic
      crustaceans are believed to serve as the intermediate host and fish as
      paratenic hosts. Human infection is believed to be acquired from the
      consumption of infected fish.
    explanation: >-
      Supports a fish-borne paratenic-host route for rare marine
      acanthocephalan infections without making it the dominant route for
      Macracanthorhynchus or Moniliformis.
epidemiology:
- name: Rare sporadic zoonosis enriched in toddlers
  description: >-
    Human acanthocephaliasis appears as sporadic reports rather than as a
    common endemic helminthiasis. The Macracanthorhynchus and Moniliformis
    cases that reach clinical attention are disproportionately reported in very
    young children, likely because toddlers mouth arthropods and diapers allow
    caregivers to notice passed adult worms.
  factors:
  - toddler age
  - insect mouthing
  - cockroach exposure
  - beetle exposure
  - millipede exposure
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human cases of acanthocephaliasis are seemingly rare in medical
      literature; however, there have been a growing number of cases reported in
      the last 10 years
    explanation: >-
      Supports treating human disease as rare in the clinical literature.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The preponderance of human cases of Macracanthorhynchus and Moniliformis
      involving children may be due to children’s habit of putting objects,
      including insects, in their mouths.
    explanation: >-
      Supports the pediatric skew as an exposure effect from object and insect
      mouthing.
progression:
- phase: Prepatent juvenile attachment and maturation
  notes: >-
    After ingestion, liberated parasites attach to the small-intestinal mucosa
    and mature into adult worms over roughly 8-12 weeks before egg production
    or visible adult-worm passage establishes a patent infection.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the definitive host, liberated parasites attach to the mucosa of the
      small intestine, where they mature into adults and mate in about 8 to 12
      weeks
    explanation: >-
      Supports the juvenile-to-adult prepatent window after cystacanth
      ingestion.
- phase: Patent adult-worm intestinal infection
  notes: >-
    Most recognized human infections are detected once adult worms pass in
    stool; eggs are much less often seen, but rare patent infections can be
    diagnosed on concentrated stool wet mounts.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Passage of an adult worm is typically the trigger for clinical
      evaluation, as the worms are large and readily noticeable in a stool
      specimen.
    explanation: >-
      Supports adult-worm passage in stool as the usual sign that triggers
      diagnosis of an established infection.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patent acanthocephalan infections in humans are rare but do occur, and in
      those instances identification can be made by the finding of eggs in
      concentrated wet mounts of stool
    explanation: >-
      Supports rare egg-positive human patent infection.
- phase: Invasive ulcerative intestinal disease
  notes: >-
    Severe infections, especially those due to Bolbosoma or Corynosoma, can
    progress from adult-worm attachment to ulceration, ileus, intestinal
    obstruction, or perforation that requires endoscopic or surgical removal.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Severe symptoms include bloody diarrhea and ileus, perforation, and/or
      ulceration of the intestinal wall (most common with Bolbosoma and
      Corynosoma)
    explanation: >-
      Supports a severe invasive intestinal phase and identifies the marine
      genera as the species context in which it is most common.
pathophysiology:
- name: Cystacanth-Infected Arthropod Ingestion
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Infection begins when a person eats an arthropod intermediate host carrying
    infective cystacanths; marine Corynosoma and Bolbosoma infections may
    instead begin with raw fish carrying larval stages as a paratenic host.
  downstream:
  - target: Small-Intestinal Proboscis Attachment

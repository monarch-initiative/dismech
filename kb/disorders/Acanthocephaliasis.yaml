      characterized by ulceration of the mucosal surface with profound white
      blood cell infiltration which may include neutrophils, eosinophils, and/or
      lymphocytes
    explanation: >-
      Supports ulceration and mixed leukocyte infiltration as direct tissue
      findings at the proboscis attachment site.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lacteals in the lamina propria are dilated with hemorrhage in the ileal

diagnosis:
- name: Adult Worm Morphologic Identification in Stool
  description: >-
    Diagnosis usually follows recovery of a large adult worm from stool,
    followed by morphologic recognition of pseudosegmentation or heavy
    wrinkling, a proboscis receptacle rather than Ascaris-like lips, and, when
    needed, dissection or molecular COX-I sequencing to distinguish
    Macracanthorhynchus species.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acanthocephaliasis is usually diagnosed by the identification of adult
      parasites in stool specimens, usually in diaper-aged children.
    explanation: >-
      Supports adult worm identification in stool as the usual diagnostic route.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They superficially resemble adults of Ascaris lumbricoides but are
      usually heavily wrinkled (Macracanthorhynchus) or exhibit
      pseudosegmentation (Moniliformis)
    explanation: >-
      Supports the gross morphology used to separate common adult
      acanthocephalans from Ascaris.
- name: Stool Ova and Parasite Examination
  description: >-
    Patent human infections are rare but can be diagnosed when the
    characteristic acanthor-containing eggs are recovered in concentrated wet
    mounts of stool.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patent acanthocephalan infections in humans are rare but do occur, and in
      those instances identification can be made by the finding of eggs in
      concentrated wet mounts of stool
    explanation: >-
      Supports stool egg detection as an uncommon but valid diagnostic route.
treatments:
- name: Pyrantel Pamoate for Mild Adult-Worm Infection
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Pyrantel pamoate
      term:
        id: CHEBI:8655
        label: Pyrantel pamoate
  description: >-
    There is no standardized regimen, but many mild or asymptomatic
    Macracanthorhynchus or Moniliformis cases have stopped shedding worms,
    stopped having symptoms, or cleared stool eggs after three oral pyrantel
    pamoate doses separated by two weeks.
  target_mechanisms:
  - target: Small-Intestinal Proboscis Attachment
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment for acanthocephalans is largely unstandardized. For mild or
      asymptomatic cases, many patients have been treated successfully with
      pyrantel pamoate
    explanation: >-
      Supports pyrantel pamoate as a commonly successful reported treatment
      while preserving that no standard regimen exists.
  - reference: PMID:39979033
    reference_title: Moniliformis moniliformis acanthocephaliasis in a paediatric patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient completed three doses of 11 mg/kg pyrantel pamoate, separated
      by 2-week intervals. A repeat stool study was performed 2 weeks following
      the last treatment and was negative for ova and parasites.
    explanation: >-
      A recent pediatric M. moniliformis case documents clearance after the
      three-dose pyrantel pamoate schedule.
- name: Endoscopic or Surgical Removal for Invasive Intestinal Worms
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Worms embedded in the ileum or jejunum with obstruction, ulceration, or
    perforation have often been removed endoscopically or surgically without a
    concurrent antihelminthic course.
  target_mechanisms:
  - target: Small-Intestinal Proboscis Attachment
  - target: Proboscis-Associated Mucosal Ulceration
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For more invasive infections involving bowel perforations, ileus, or
      ulceration, endoscopic removal of the worm without concomitant
      antihelminth therapy is common
    explanation: >-
      Supports direct removal as the reported management pattern for invasive
      intestinal cases.
review_notes: >-
  Deliberately lumped. Bolbosoma and Corynosoma are retained within this
  phylum-level entry rather than split into separate species or genus entries
  because MONDO does not define species-level acanthocephaliasis children, the
  literature represented in PMID:34076470 is still dominated by sporadic case
  reports, and the same adult-worm attachment mechanism underlies both the
  common arthropod-borne Macracanthorhynchus/Moniliformis cases and the rarer
  fish-borne marine infections. The Bolbosoma/Corynosoma difference is recorded
  in the transmission row and severe-phenotype evidence rather than hidden.

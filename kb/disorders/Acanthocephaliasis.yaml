  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The typical findings at the site of attachment of the proboscis are
      characterized by ulceration of the mucosal surface with profound white
      blood cell infiltration which may include neutrophils, eosinophils, and/or
      lymphocytes
    explanation: >-
      Supports modeling mucosal ulceration and mixed inflammatory infiltration
      at the proboscis attachment site.
  - reference: PMID:17570979
    reference_title: A case of Moniliformis moniliformis (Acanthocephala) infection in Iran.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In the definitive hosts damage to intestinal mucosa may occur by
      penetration of proboscis, and is compounded by the worm's tendency to
      release their hold occasionally and reattach at another place.
    explanation: >-
      Supports the mechanical source of mucosal damage from penetration and
      repeated reattachment.
histopathology:
- name: Proboscis Attachment Ulcer with Mixed Leukocyte Infiltration
  description: >-
    Tissue at an acanthocephalan attachment site shows the proboscis embedded
    in intestinal mucosa, surface ulceration, mixed white-cell infiltration,
    submucosal edema, and hemorrhagic dilated lacteals in the ileal wall in
    reported invasive cases.
  evidence:
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lymphocytic and monocytic infiltration has also been described at sites of
      submucosal edema
    explanation: >-
      Supports submucosal edema with mononuclear inflammatory infiltration in
      invasive intestinal acanthocephaliasis.
  - reference: PMID:34076470
    reference_title: "Human Acanthocephaliasis: a Thorn in the Side of Parasite Diagnostics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

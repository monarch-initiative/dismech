name: SHILCA Syndrome
creation_date: "2026-10-21T00:00:00Z"
category: Mendelian
parents:
- NMNAT1-related retinopathy
- Leber congenital amaurosis
- Spondyloepiphyseal dysplasia
synonyms:
- SHILCA
- spondyloepiphyseal dysplasia, sensorineural hearing loss, impaired intellectual development, and Leber congenital amaurosis
- spondyloepiphyseal dysplasia, sensorineural hearing loss, intellectual developmental disorder, and Leber congenital amaurosis
description: >-
  SHILCA syndrome is an autosomal recessive multisystem disorder caused by
  biallelic NMNAT1 alleles that reduce expression of the nuclear NAD+ synthase
  more severely than the alleles behind retina-restricted Leber congenital
  amaurosis 9. The defining features are a severe spondyloepiphyseal
  dysplasia, sensorineural hearing loss, intellectual disability and Leber
  congenital amaurosis, with brain anomalies on MRI. The one compound
  heterozygous patient described in detail also had severe short stature,
  hypomyelinating leukoencephalopathy, progressive brain and cerebellar
  atrophy, corpus callosum hypoplasia and pseudocolobomatous macular atrophy.
  Every reported patient carries an Alu-mediated duplication of NMNAT1 exons
  4-5 on a shared founder haplotype, either homozygous or in trans with a
  splice variant. The duplication cuts NMNAT1 expression roughly four-fold and
  produces aberrant transcripts. Complete loss of Nmnat1 is embryonic lethal
  in mice, so the authors read SHILCA as the intermediate point on an NMNAT1
  dosage series between LCA9 and lethality. That extra-retinal tissues fail
  because nuclear NAD+ falls below what they tolerate is a hypothesis; NAD+
  has not been measured in patients. Four patients are published.

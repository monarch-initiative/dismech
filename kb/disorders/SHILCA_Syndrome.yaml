genetic:
- name: NMNAT1
  gene_term:
    preferred_term: NMNAT1
    term:
      id: hgnc:17877
      label: NMNAT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  variants:
  - name: NM_022787.3:c.299+526_*968dup
    type: duplication
    clinical_significance: PATHOGENIC
    description: >-
      Alu-mediated tandem duplication of about 7.4 kb from intron 3 into the
      3' UTR, covering exons 4 and 5 of the main isoform. Found on one shared
      haplotype in Italian and Spanish patients, consistent with an ancient
      founder event. Homozygous in the three index children.
  - name: NM_022787.3:c.439+5G>T
    type: splice region
    clinical_significance: PATHOGENIC
    description: >-
      Exon 4 donor splice-site variant; increases an intron 4 retention
      transcript. Reported in trans with the duplication in one patient.
  notes: >-
    No patient with biallelic NMNAT1 null alleles is known. NMNAT1 missense and
    splice alleles cause retina-restricted LCA9, curated separately as
    Leber_Congenital_Amaurosis_9.
  evidence:
  - reference: PMID:33668384
    reference_title: "New Insights on the Genetic Basis Underlying SHILCA Syndrome: Characterization of the NMNAT1 Pathological Alterations Due to Compound Heterozygous Mutations and Identification of a Novel Alternative Isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening by next-generation sequencing identified two heterozygous pathogenic variants in nicotinamide mononucleotide adenylyltransferase 1 (NMNAT1) as the molecular cause of the disease: c.439+5G>T and c.299+526_*968dup."
    explanation: Compound heterozygous genotype in the second family.
  - reference: PMID:33668384
    reference_title: "New Insights on the Genetic Basis Underlying SHILCA Syndrome: Characterization of the NMNAT1 Pathological Alterations Due to Compound Heterozygous Mutations and Identification of a Novel Alternative Isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This identical haplotype surrounding the rearrangement was also detected in an additional Spanish patient, indicative of a common and likely remote ancestral genetic event."
    explanation: Shared haplotype indicates a founder duplication.
diagnosis:
- name: Genome Sequencing for NMNAT1 Structural Variant
  description: >-
    The duplication was missed by exome sequencing in the index families and
    was found only after RNA sequencing showed low NMNAT1 expression, followed
    by short- and long-read genome sequencing. In the second family it was
    suspected from exome read depth and confirmed by genome sequencing.
  evidence:
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonetheless, whole-exome sequencing failed to identify any shared rare coding variants, in this region or elsewhere."
    explanation: Exome sequencing alone missed the causal variant.
  - reference: PMID:33668384
    reference_title: "New Insights on the Genetic Basis Underlying SHILCA Syndrome: Characterization of the NMNAT1 Pathological Alterations Due to Compound Heterozygous Mutations and Identification of a Novel Alternative Isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An increase in reads involving two of the five exons of NMNAT1 (exons 4 and 5, NM_022787.3) could be detected, consistent with a heterozygous duplication of this region."
    explanation: In the second family the duplication was suspected from exome read depth.
mechanistic_hypotheses:
- hypothesis_group_id: nmnat1_extraretinal_nad_threshold
  hypothesis_label: Extra-retinal tissues fail below an NMNAT1/NAD+ dosage threshold
  status: EMERGING
  description: >-
    The SHILCA alleles leave less NMNAT1 than LCA9 alleles do, and complete
    loss is embryonic lethal in mice. The proposal is that skeletal, cochlear
    and brain tissue tolerate the LCA9 reduction but not the SHILCA one.
    Neither NAD+ levels nor any tissue-specific step has been measured in
    patients or in a model carrying SHILCA alleles.
  evidence:
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rearrangement found in our cases, presumably causing a strong but not complete reduction of enzymatic activity, may therefore result in an intermediate syndromic phenotype with respect to LCA and lethality."
    explanation: The authors' own dosage proposal.
  - reference: PMID:22842230
    reference_title: Mutations in NMNAT1 cause Leber congenital amaurosis and identify a new disease pathway for retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals with biallelic NMNAT1 mutations had severe LCA but normal physical and mental health."
    explanation: >-
      The contrast case: patients with milder NMNAT1 alleles have no
      extra-retinal disease, which is what the threshold model has to explain.
discussions:
- discussion_id: gap_shilca_nad_measurement
  prompt: >-
    Is nuclear NAD+ reduced in extra-retinal cells of SHILCA patients, and by
    more than in LCA9 patient cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Multi-Tissue Nuclear NAD+ Insufficiency
  rationale: >-
    The multi-tissue NAD+ node and every edge from it to the skeletal,
    hearing and brain phenotypes rest on inference from NMNAT1 expression and
    mouse knockouts. Measuring NAD+ in SHILCA fibroblasts or blood alongside
    LCA9 and control samples would test the dosage model directly.
notes: >-
  Four patients from three families have been published (two Italian
  families with three homozygous children, one Spanish child compound
  heterozygous). Many features here (short stature, ossification delay,
  hypotonia, ataxia, dyskinesia, the detailed MRI and fundus findings,
  hypermetropia and facial features) are documented only for the Spanish
  child, because the index report is available only as an abstract. That
  child had milder hearing loss and, at two years, no detectable
  intellectual disability, biconcave spine or scoliosis. No GeneReviews
  chapter covers SHILCA. A homozygous NMNAT1
  p.Glu257Lys family with pure hereditary spastic paraplegia and no retinal
  disease (PMID:36871412) is a separate, unconfirmed NMNAT1 phenotype and is
  not included here. No treatment has been studied; care is supportive.

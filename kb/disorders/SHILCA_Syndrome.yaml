pathophysiology:
- name: NMNAT1 Severe Hypomorphic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    An Alu-mediated tandem duplication spanning NMNAT1 exons 4 and 5 of the
    main isoform (c.299+526_*968dup) produces aberrant mRNAs and an
    approximately four-fold reduction in NMNAT1 expression in patient
    fibroblasts; some canonical transcript remains. In trans with the splice
    variant c.439+5G>T, total NMNAT1 mRNA in blood was about 25% lower than in
    controls and the isoform balance was disturbed. Because Nmnat1 knockout
    mice die as embryos and no human with biallelic null alleles is known, the
    duplication is interpreted as a strong but incomplete loss of function,
    more severe than the hypomorphs that cause retina-restricted LCA9.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: NMNAT1
    term:
      id: hgnc:17877
      label: NMNAT1
  molecular_functions:
  - preferred_term: nicotinamide-nucleotide adenylyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0000309
      label: nicotinamide-nucleotide adenylyltransferase activity
  evidence:
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gene expression analysis revealed a 4-fold downregulation of the gene NMNAT1, residing indeed in the shared autozygous interval."
    explanation: RNA-seq of cultured patient fibroblasts shows strongly reduced NMNAT1 expression.
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short- and long-read whole-genome sequencing highlighted a duplication involving 2 out of the 5 exons of NMNAT1 main isoform (NM_022787.3), leading to the production of aberrant mRNAs."
    explanation: Identifies the causal structural variant and its transcript-level consequence.
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rearrangement found in our cases, presumably causing a strong but not complete reduction of enzymatic activity, may therefore result in an intermediate syndromic phenotype with respect to LCA and lethality."
    explanation: >-
      The authors' dosage interpretation; enzymatic activity was not measured
      directly, so the severity ranking is inferred from expression and from
      the lethality of complete knockout.
  - reference: PMID:33668384
    reference_title: "New Insights on the Genetic Basis Underlying SHILCA Syndrome: Characterization of the NMNAT1 Pathological Alterations Due to Compound Heterozygous Mutations and Identification of a Novel Alternative Isoform."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The total NMNAT1 expression in the patient was decreased by approximately 25% compared with that of the control subjects."
    explanation: Reduced NMNAT1 expression in the compound heterozygous patient's blood.
  - reference: PMID:33668384
    reference_title: "New Insights on the Genetic Basis Underlying SHILCA Syndrome: Characterization of the NMNAT1 Pathological Alterations Due to Compound Heterozygous Mutations and Identification of a Novel Alternative Isoform."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These alterations are most probably responsible for the multisystem involvement instead of a retina-restricted degeneration, as they compromise the correct NMNAT1 expression by unbalancing the relative levels of all isoforms and reducing the expression of the canonical variant."
    explanation: The authors attribute the multisystem rather than retina-restricted phenotype to the depth of the expression defect.
  downstream:
  - target: Multi-Tissue Nuclear NAD+ Insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      NAD+ has not been measured in SHILCA patient cells. The link rests on
      NMNAT1 being the nuclear NAD+ synthase and on NAD+ falling when NMNAT1
      is removed from human iPSC-derived retinal organoids.
    evidence:
    - reference: PMID:39446354
      reference_title: NMNAT1 Is Essential for Human iPS Cell Differentiation to the Retinal Lineage.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Decreased intracellular NAD levels and poly(ADP-ribosyl)ation were observed in NMNAT1-KO organoids at 7 to 10 days of the culture."
      explanation: NMNAT1 knockout lowers NAD in human cells; SHILCA alleles are partial, not null, so this is an inference.
- name: Multi-Tissue Nuclear NAD+ Insufficiency
  biological_scale: MOLECULAR
  description: >-
    The working model for SHILCA is that the duplication lowers nuclear NAD+
    synthesis below what skeletal, cochlear and central nervous system tissue
    tolerate, not only below the retina's threshold as in LCA9. Nmnat1
    knockout mice die in utero, which shows that some NMNAT1 activity is
    required outside the retina. The tissue-specific steps between NAD+
    shortfall and chondrodysplasia, hearing loss or hypomyelination have not
    been studied.
  biological_processes:
  - preferred_term: nuclear NAD+ biosynthesis
    modifier: DECREASED
    term:
      id: GO:0009435
      label: NAD+ biosynthetic process
  evidence:
  - reference: PMID:32533184
    reference_title: "An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel syndrome, SHILCA, affecting multiple tissues and organs."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "murine Nmnat1 knockouts show embryonic lethality, indicating that complete absence of NMNAT1 activity is probably not compatible with life"
    explanation: >-
      Complete loss of NMNAT1 is not tolerated outside the retina in mouse,
      the basis for reading SHILCA as an extra-retinal NAD+ insufficiency.
      The paper restates prior mouse work rather than reporting it.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33107823
      reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, loss of NMNAT1 activates the NADase SARM1, the central executioner of axon degeneration, to trigger photoreceptor death and vision loss."
      explanation: Shown with adult conditional Nmnat1 deletion in mouse; applied to SHILCA by inference.
  - target: Spondyloepiphyseal Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; no study links NAD+ shortfall to the growth plate.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; the cochlear cell type and mechanism are unstudied.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: CNS Hypomyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; oligodendrocyte NAD+ has not been studied in this disorder.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; no neuronal mechanism has been studied.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; no neuronal mechanism has been studied.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: Brain Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; reported in one patient only.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
  - target: Cerebellar Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypothesized; reported in one patient only.
    hypothesis_groups:
    - nmnat1_extraretinal_nad_threshold
- name: Photoreceptor Degeneration
  biological_scale: CELLULAR
  description: >-
    The retinal component is the same process as in LCA9 (see
    Leber_Congenital_Amaurosis_9 for the PARP and SARM1 steps). Deleting
    Nmnat1 during retinal development in mouse causes early, severe
    photoreceptor loss through several cell death pathways. All SHILCA
    patients have congenital LCA; the compound heterozygous patient's
    electroretinogram was undetectable and her macular atrophy progressed.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: photoreceptor cell death
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  evidence:
  - reference: PMID:34878972
    reference_title: Nuclear NAD(+)-biosynthetic enzyme NMNAT1 facilitates development and early survival of retinal neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "deletion of the nuclear-localized NAD+ synthase nicotinamide mononucleotide adenylyltransferase-1 (NMNAT1) in the developing murine retina causes early and severe degeneration of photoreceptors and select inner retinal neurons via multiple distinct cell death pathways"
    explanation: Developmental loss of NMNAT1 produces early severe photoreceptor degeneration.
  - reference: PMID:33107823
    reference_title: SARM1 depletion rescues NMNAT1-dependent photoreceptor cell death and retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional deletion demonstrates that NMNAT1 is required within the photoreceptor."
    explanation: NMNAT1 acts cell-autonomously in photoreceptors.
  downstream:

discussions:
- discussion_id: splis_organ_specific_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adrenocortical Zonation and Steroidogenesis Failure
  - pathophysiology#Neuronal and Myelin Sphingolipid Dysregulation
  prompt: >
    Which S1P-receptor-dependent and receptor-independent pathways link sphingolipid
    accumulation to adrenocortical and neuronal injury in SPLIS, and why are these tissues
    vulnerable while others are spared?
  rationale: >
    The lymphopenia is mechanistically explained by loss of the S1P egress gradient and the
    podocyte lesion by Rho/ROCK hyperactivation, but the adrenal and neurological
    pathogenesis remains unknown; recent data showing that S1P does not invariably
    accumulate in SPL-deficient cells make the tissue-specific trigger an open question.
  evidence:
  - reference: PMID:34133011
    reference_title: "Genotype/Phenotype Interactions and First Steps Toward Targeted Therapy for Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other manifestations of SPLIS include nephrotic syndrome, neuronal defects, and adrenal insufficiency, but their pathogenesis remains unknown."
    explanation: Authors' explicit statement of the mechanistic gap.
- discussion_id: splis_knockout_lethality_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic SGPL1 Loss of Function
  prompt: >
    Does the constitutive Sgpl1 knockout mouse, which dies within weeks of birth, model
    the later-onset, R222Q-associated and isolated-adrenal presentations of human SPLIS?
  rationale: >
    The null mouse models the severe infantile end of the spectrum but cannot reproduce
    the milder hypomorphic disease; the pyridoxine-dependent R222Q knock-in, which is
    phenotypically silent on B6-enriched chow, is the first model of a hypomorphic allele
    and shows that diet can gate the phenotype, so extrapolation from the null to the
    common human genotype needs care.
  evidence:
  - reference: PMID:42182331
    reference_title: "Pyridoxine supplementation confers protection against SGPL1 (R222Q) variant sphingosine phosphate lyase insufficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SPLR222Q mice fed pyridoxine-enriched chow lacked obvious phenotypes."
    explanation: Shows the hypomorphic model's phenotype is conditional on cofactor availability.

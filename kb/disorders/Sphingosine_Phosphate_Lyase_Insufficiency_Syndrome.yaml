    explanation: Quantifies ESKD frequency and timing.
- name: Primary adrenal insufficiency
  category: Endocrine
  frequency: FREQUENT
  description: >
    Glucocorticoid insufficiency in early childhood is the most common endocrine
    manifestation; about a third of affected individuals also have mineralocorticoid
    deficiency. Adrenal insufficiency can be the sole presenting feature, particularly with
    the R222Q allele, and may present with hypoglycaemia and seizures.

    malformation in an early Indian case and pericardial effusion in a hydropic patient;
    the spectrum is not characterised and cardiology evaluation is recommended as needed.
  phenotype_term:
    preferred_term: Cardiac manifestations
    term:
      id: HP:0001626
      label: Abnormality of the cardiovascular system
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cardiac manifestations are reported in some individuals."
    explanation: GeneReviews statement of cardiac involvement without a frequency.
  - reference: PMID:28181337
    reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One male patient had non-palpable testes and micropenis, and another patient had pericardial and pleural effusions, generalized hydrops, and a cleft palate."
    explanation: Pericardial effusion in a hydropic patient.
- name: Micropenis
  category: Endocrine
  frequency: OCCASIONAL
  description: >
    Undervirilisation with micropenis accompanies cryptorchidism and low anti-Mullerian
    hormone in a minority of affected boys, reflecting partial gonadal dysfunction.
  phenotype_term:
    preferred_term: Micropenis
    term:
      id: HP:0000054
      label: Micropenis
  evidence:
  - reference: PMID:28165343
    reference_title: "Sphingosine-1-phosphate lyase mutations cause primary adrenal insufficiency and steroid-resistant nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Undervirilization was reported in patient 6, who had micropenis, right cryptorchidism, and bilateral microorchidism, associated with low serum anti-Müllerian hormone, suggesting that partial gonadal dysfunction may be part of the clinical picture."
    explanation: Micropenis as part of gonadal dysfunction in a reported patient.
  - reference: PMID:28181337
    reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A micropenis and cryptorchidism with a small inguinal testis at the right side and no testis at the left side were noted."
    explanation: Second independent report.
- name: Anemia
  category: Hematological
  description: >
    Anaemia and thrombocytopenia are listed among the haematological and immune findings
    in reviews of the syndrome; their frequency is not quantified.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:30090628
    reference_title: "Nephrotic syndrome and adrenal insufficiency caused by a variant in SGPL1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Immunodeficienies include lymphopenia, deficiency of cellular immunity, multiple bacterial infection, hypogammaglobulinemia, thrombocytopenia and anemia."
    explanation: Review listing anaemia among the reported findings.
biochemical:
- name: Elevated plasma sphingosine-1-phosphate and sphingosine
  presence: present
  notes: >
    Plasma and fibroblast S1P and sphingosine are markedly elevated by LC-MS/MS and serve as
    disease biomarkers that respond to pyridoxine in responsive patients; S1P also appears in
    urine in the mouse model.
  readouts:
  - target: Sphingoid Base Phosphate and Sphingolipid Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Elevated circulating sphingoid base phosphates report the metabolic block at the
      lyase step and fall when residual enzyme activity is restored.
  evidence:
  - reference: PMID:28181337
    reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of SGPL1 substrates, S1P, and sphingosine were markedly increased in the patients' blood and fibroblasts, as determined by liquid chromatography-tandem mass spectrometry."
    explanation: Establishes the plasma biomarker.
  - reference: PMID:32233035
    reference_title: "Responsiveness of sphingosine phosphate lyase insufficiency syndrome to vitamin B6 cofactor supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two patients, disease biomarkers responded to B6 supplementation. S1P abundance and activity levels increased and sphingolipids decreased in response to B6."
    explanation: Shows the biomarker is treatment-responsive.
treatments:
- name: Pyridoxine (vitamin B6) cofactor supplementation
  description: >
    Targeted therapy for patients with pyridoxine-responsive alleles, notably R222Q:
    pyridoxal 5'-phosphate stabilises and augments the residual mutant enzyme, lowering
    sphingolipid biomarkers and improving neurological status in responders. It is
    recommended by GeneReviews and is limited to patients with a susceptible allele.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Biallelic SGPL1 Loss of Function
    description: Cofactor supplementation partially restores activity of destabilised missense SGPL1 variants.
  evidence:
  - reference: PMID:32233035
    reference_title: "Responsiveness of sphingosine phosphate lyase insufficiency syndrome to vitamin B6 cofactor supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate the first potential targeted therapy for SPLIS and suggest that 30% of SPLIS patients might respond to cofactor supplementation."
    explanation: First report of clinical and biochemical response to B6.
  - reference: PMID:42182331
    reference_title: "Pyridoxine supplementation confers protection against SGPL1 (R222Q) variant sphingosine phosphate lyase insufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological improvement, plasma S1P normalization, and increased SPL activity in patient-derived fibroblasts were observed after pyridoxine supplementation in a patient with R222Q-variant SPLIS."
    explanation: Clinical response in an R222Q patient, corroborated by the R222Q mouse model.
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapy: Vitamin B6 supplementation."
    explanation: GeneReviews management recommendation.
- name: Glucocorticoid and mineralocorticoid replacement
  description: >
    Standard hormone replacement for primary adrenal insufficiency, with stress dosing;
    adrenal function should be reassessed every 6-12 months and before major procedures
    because adrenal insufficiency can emerge late.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
    - preferred_term: fludrocortisone
      term:
        id: CHEBI:50885
        label: fludrocortisone
  target_phenotypes:
  - preferred_term: Primary adrenal insufficiency
    term:
      id: HP:0008207
      label: Primary adrenal insufficiency
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "assess primary adrenal function every six to 12 months and before any major procedure"
    explanation: GeneReviews surveillance guidance underpinning replacement therapy.
  - reference: PMID:35904228
    reference_title: "A retrospective analysis of endocrine disease in sphingosine-1-phosphate lyase insufficiency: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While endocrinopathy in the syndrome generally presents in infancy, late-onset disease also occurs. Screening for these is therefore warranted both at diagnosis and through follow-up."
    explanation: Rationale for ongoing endocrine screening and replacement.
- name: Levothyroxine replacement
  description: Replacement for the primary hypothyroidism seen in about a third of patients; annual thyroid function testing is recommended.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  target_phenotypes:
  - preferred_term: Hypothyroidism
    term:
      id: HP:0000821
      label: Hypothyroidism
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual free thyroxine and thyroid-stimulating hormone"
    explanation: GeneReviews surveillance recommendation for thyroid function.
- name: Kidney replacement therapy and kidney transplantation
  description: >
    Dialysis and kidney transplantation for end-stage kidney disease; transplantation
    significantly extends survival and the nephropathy does not recur in the graft, because
    the enzyme defect is systemic but the glomerular lesion is intrinsic to the native
    podocytes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_phenotypes:
  - preferred_term: End-stage kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:39334450
    reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney transplantation significantly extended survival outcomes."
    explanation: Natural history evidence for the survival benefit of transplantation.
  - reference: PMID:35748945
    reference_title: "A rare cause of nephrotic syndrome-sphingosine-1-phosphate lyase (SGPL1) deficiency: 6 cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 6 patients progressed to chronic kidney disease; 5 required kidney replacement therapy (KRT) at a median age of 6 months. Deceased kidney transplantation was performed in one patient."
    explanation: Clinical series documenting kidney replacement therapy and transplantation.
- name: Infection prevention and immunodeficiency precautions
  description: >
    Because of T-cell lymphopenia, GeneReviews advises avoiding live vaccines, exposure to
    infectious agents and non-irradiated transfusion products, with immunological
    reassessment every 6-12 months; nephrotoxic drugs should also be avoided.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Nephrotoxic medications; medications that require renal excretion (for individuals with renal insufficiency); live vaccines; exposure to infectious agents; transfusion products that have not been irradiated."
    explanation: GeneReviews list of agents and circumstances to avoid.
- name: AAV9-mediated SGPL1 gene replacement (preclinical)
  description: >
    Systemic AAV9-SGPL1 given to newborn Sgpl1-knockout mice dramatically prolonged
    survival and prevented nephrosis, neurodevelopmental delay, anaemia and
    hypercholesterolaemia; a CAG-promoter version (AAV-SPL 2.0) performs at least as well
    but treated mice eventually develop glomerulosclerosis, indicating that improved kidney
    targeting is needed. Proposed as a universal, genotype-independent therapy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic SGPL1 Loss of Function
    description: Restores enzyme expression and activity, correcting the metabolic block at its source.
  evidence:
  - reference: PMID:33755599
    reference_title: "Efficacy of AAV9-mediated SGPL1 gene transfer in a mouse model of S1P lyase insufficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment dramatically prolonged survival and prevented nephrosis, neurodevelopmental delay, anemia, and hypercholesterolemia."
    explanation: Proof-of-concept efficacy in the knockout mouse.
  - reference: PMID:37958544
    reference_title: "AAV-SPL 2.0, a Modified Adeno-Associated Virus Gene Therapy Agent for the Treatment of Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Over time, treated mice developed nephrosis and glomerulosclerosis, which likely resulted in their demise. Our overall findings show that AAV-SPL 2.0 performs equal to or better than AAV-SPL. However, improved kidney targeting may be necessary to achieve maximally optimized gene therapy as a potentially lifesaving SPLIS treatment."
    explanation: Second-generation vector results and the remaining kidney-targeting limitation.
- name: ROCK inhibition with fasudil (preclinical)
  description: >
    Pharmacological Rho-kinase inhibition mitigated renal cytoskeletal defects and partially
    restored epithelial architecture in Sgpl1-deficient mice, identifying S1P-driven
    Rho/ROCK hyperactivation as a tractable downstream target independent of genotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fasudil
      term:
        id: CHEBI:43871
        label: fasudil
  target_mechanisms:
  - target: Podocyte Cytoskeletal Disorganization and Loss
    description: Blocks the Rho/ROCK signalling through which excess S1P disorganises the renal epithelial cytoskeleton.
  evidence:
  - reference: PMID:42024444
    reference_title: "Redirection of sphingolipid metabolism drives cytoskeletal defects in SPLIS and reveals ROCK inhibition as therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pharmacological ROCK inhibition with fasudil mitigated renal cytoskeletal defects in Sgpl1-/- and Sgpl1rosa+fl/fl mice and partially restored epithelial architecture."
    explanation: Preclinical efficacy of ROCK inhibition on the renal lesion.
- name: Genetic counseling and testing of at-risk relatives
  description: >
    Autosomal recessive counselling with a 25% recurrence risk; GeneReviews recommends
    clarifying the genetic status of at-risk sibs so that treatment and precautions can
    begin before symptoms.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of apparently asymptomatic older and younger at-risk sibs of an affected individual in order to identify as early as possible those who would benefit from prompt initiation of treatment and awareness of agents/circumstances to avoid."
    explanation: GeneReviews recommendation on evaluation of relatives at risk.
clinical_trials:
- name: NCT04885179
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >
    International observational study and patient registry for SPLIS collecting clinical,
    biochemical, genetic and biosample data; no intervention is administered.
  evidence:
  - reference: clinicaltrials:NCT04885179
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This protocol aims to gather information about sphingosine phosphate lyase insufficiency syndrome (SPLIS), also known as NPHS14, and to create a SPLIS patient registry."
    explanation: Registry protocol summary.
- name: NCT06669949
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >
    Prospective longitudinal natural history study with a retrospective cross-sectional
    arm testing whether age of onset, disease features and biomarkers predict quality of
    life and survival.
  evidence:
  - reference: clinicaltrials:NCT06669949
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The central hypothesis is that age of onset, other disease features, and disease biomarkers will be predictive of quality of life (QOL) and survival in SPLIS patients."
    explanation: Natural history study summary.
diagnosis:
- name: Molecular genetic testing for biallelic SGPL1 variants
  description: >
    The diagnosis is established in a proband with at least one suggestive finding and
    biallelic pathogenic SGPL1 variants; SGPL1 should be included in steroid-resistant
    nephrotic syndrome and primary adrenal insufficiency gene panels, including for isolated
    adrenal insufficiency.
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SPLIS is established in a proband with at least one suggestive finding and biallelic pathogenic variants in SGPL1 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:30517686
    reference_title: "SGPL1 Deficiency: A Rare Cause of Primary Adrenal Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that screening for SGPL1 mutations should not be reserved only for patients with nephrotic syndrome but may also include patients with PAI who lack other clinical manifestations of NPHS14 because, in certain cases, kidney disease and accompanying features might develop."
    explanation: Supports testing in isolated adrenal insufficiency.
- name: Plasma sphingolipid profiling
  description: >
    LC-MS/MS shows markedly elevated S1P and sphingosine in blood and fibroblasts, supporting
    the diagnosis and providing a biomarker for treatment response.
  evidence:
  - reference: PMID:28181337
    reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of SGPL1 substrates, S1P, and sphingosine were markedly increased in the patients' blood and fibroblasts, as determined by liquid chromatography-tandem mass spectrometry."
    explanation: Biochemical diagnostic finding.
- name: Brain MRI
  description: >
    Recurring patterns include isolated callosal dysgenesis and progressive involvement of
    the globus pallidus, thalamus and dentate nucleus; these findings in an infant with
    nephrotic syndrome or adrenal insufficiency should prompt SGPL1 testing.
  evidence:
  - reference: PMID:32855188
    reference_title: "MRI Spectrum of Brain Involvement in Sphingosine-1-Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR imaging findings of abnormal deep gray nuclei, microcephaly, or callosal dysgenesis in an infant or young child exhibiting other typical clinical features of sphingosine-1-phosphate lyase insufficiency syndrome should trigger prompt genetic testing for SGPL1 mutations."
    explanation: Neuroradiological diagnostic guidance.
- name: Endocrine, immunological and renal surveillance
  description: >
    Urine studies, adrenal function every 6-12 months, annual thyroid function, testicular
    function review, immunological assessment, neurological and audiological evaluation.
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Urine studies per nephrologist in those with kidney disease or annually in those without known kidney disease; assess primary adrenal function every six to 12 months and before any major procedure; annual free thyroxine and thyroid-stimulating hormone; annual review of testicular function"
    explanation: GeneReviews surveillance schedule.
differential_diagnoses:
- name: Familial glucocorticoid deficiency
  description: >
    Isolated glucocorticoid deficiency due to MC2R, MRAP or other genes; SGPL1 variants were
    found when patients with familial glucocorticoid deficiency or triple A syndrome lacking
    nephrotic syndrome were sequenced, so SPLIS belongs in that differential.
  distinguishing_features:
  - Nephrotic syndrome, ichthyosis, lymphopenia or neurological findings favour SPLIS
  - Elevated plasma S1P and sphingosine
  - Biallelic SGPL1 variants
  evidence:
  - reference: PMID:30517686
    reference_title: "SGPL1 Deficiency: A Rare Cause of Primary Adrenal Insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the SGPL1 gene in 21 patients with familial glucocorticoid disease or triple A syndrome"
    explanation: SGPL1 variants identified within a familial glucocorticoid deficiency cohort.
- name: Other monogenic steroid-resistant nephrotic syndromes
  description: >
    NPHS1, NPHS2, LAMB2, WT1 and PLCE1 account for most congenital and early-onset SRNS;
    the syndromic combination with adrenal insufficiency, ichthyosis, immunodeficiency and
    neurological disease distinguishes SPLIS.
  distinguishing_features:
  - Primary adrenal insufficiency or adrenal calcification
  - Ichthyosis, lymphopenia, neurological involvement
  - Elevated plasma sphingoid base phosphates
  evidence:
  - reference: PMID:28165339
    reference_title: "Mutations in sphingosine-1-phosphate lyase cause nephrosis with ichthyosis and adrenal insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in 1 of over 40 monogenic genes can be detected in approximately 30% of individuals with SRNS whose symptoms manifest before 25 years of age."
    explanation: Context of the monogenic SRNS differential in which SGPL1 was discovered.
animal_models:
- name: Sgpl1 knockout mouse
  species: Mouse
  genotype: Sgpl1-/- (constitutive null)
  publication: PMID:28165343
  description: >
    Constitutive knockout that dies in the first weeks of life and recapitulates the main
    human features: glomerular nephrosis, disrupted adrenocortical zonation with defective
    steroidogenic enzyme expression, lymphopenia, anaemia, hypercholesterolaemia and
    neurodevelopmental delay; renal S1P enrichment with cytoskeletal disorganisation.
  modeled_mechanisms:
  - target: Adrenocortical Zonation and Steroidogenesis Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Adrenal histology in the null mouse shows disrupted zonation and reduced steroidogenic enzyme expression.
    limitations: >-
      Early postnatal lethality precludes study of the childhood-onset, late-emerging
      adrenal insufficiency seen in patients.
    readouts:
    - name: Adrenocortical zonation and steroidogenic enzyme expression
      target: Adrenocortical Zonation and Steroidogenesis Failure
      direction: ALTERED
      interpretation: Histological correlate of the adrenal steroidogenic failure.
      evidence:
      - reference: PMID:28165343
        reference_title: "Sphingosine-1-phosphate lyase mutations cause primary adrenal insufficiency and steroid-resistant nephrotic syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Sgpl1-/- mice displayed disrupted adrenocortical zonation and defective expression of steroidogenic enzymes"
        explanation: Reports the adrenal histological measurement.
    evidence:
    - reference: PMID:28165343
      reference_title: "Sphingosine-1-phosphate lyase mutations cause primary adrenal insufficiency and steroid-resistant nephrotic syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sgpl1-/- mice recapitulated the main characteristics of the human disease with abnormal adrenal and renal morphology."
      explanation: Authors' statement that the knockout recapitulates the human disease.
  - target: Glomerular Filtration Barrier Failure and Glomerulosclerosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Nephrosis with glomerular pathology and profibrotic cytokine signalling, prevented by AAV-SGPL1 gene transfer.
    readouts:
    - name: Nephrosis and renal STAT3/cytokine activation
      target: Glomerular Filtration Barrier Failure and Glomerulosclerosis
      direction: INCREASED
      interpretation: Proteinuric glomerular disease with inflammatory signalling in the knockout kidney.
      evidence:
      - reference: PMID:33755599
        reference_title: "Efficacy of AAV9-mediated SGPL1 gene transfer in a mouse model of S1P lyase insufficiency syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "STAT3 pathway activation and elevated proinflammatory and profibrogenic cytokines observed in KO kidneys were attenuated by treatment."
        explanation: Reports the renal readout and its correction by gene therapy.
    evidence:
    - reference: PMID:33755599
      reference_title: "Efficacy of AAV9-mediated SGPL1 gene transfer in a mouse model of S1P lyase insufficiency syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As proof of concept, we evaluated the efficacy of adeno-associated virus 9-mediated transfer of human SGPL1 (AAV-SPL) given to newborn Sgpl1-KO mice that model SPLIS and die in the first weeks of life."
      explanation: Establishes the knockout as the SPLIS model used for the renal readouts.
  - target: Podocyte Cytoskeletal Disorganization and Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Renal S1P enrichment with cytoskeletal disorganisation and impaired epithelial morphogenesis, rescued by ROCK inhibition.
    readouts:
    - name: Renal epithelial cytoskeletal organisation
      target: Podocyte Cytoskeletal Disorganization and Loss
      direction: ALTERED
      interpretation: Cytoskeletal disorganisation driven by S1P/Rho/ROCK signalling.
      evidence:
      - reference: PMID:42024444
        reference_title: "Redirection of sphingolipid metabolism drives cytoskeletal defects in SPLIS and reveals ROCK inhibition as therapy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vivo, Sgpl1-/- mice had pronounced urinary S1P excretion and renal S1P enrichment, accompanied by cytoskeletal disorganization and impaired epithelial morphogenesis."
        explanation: Reports the renal cytoskeletal readout.
- name: SGPL1 R222Q knock-in mouse
  species: Mouse
  genotype: Sgpl1 R222Q homozygous knock-in
  publication: PMID:42182331
  description: >
    Gene-edited model of the most common human allele; phenotypically silent on
    pyridoxine-enriched chow but develops enzyme inactivation, S1P accumulation, wasting,
    anaemia, proteinuria, glomerulosclerosis, podocyte loss and foot process effacement on
    reduced-pyridoxine chow, demonstrating pyridoxine responsiveness in vivo.
  modeled_mechanisms:
  - target: Podocyte Cytoskeletal Disorganization and Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces the human allele, its pyridoxine dependence and the podocyte lesion.
    readouts:
    - name: Podocyte number and foot process morphology
      target: Podocyte Cytoskeletal Disorganization and Loss
      direction: DECREASED
      interpretation: Podocyte loss and foot process effacement on pyridoxine-deficient diet.
      evidence:
      - reference: PMID:42182331
        reference_title: "Pyridoxine supplementation confers protection against SGPL1 (R222Q) variant sphingosine phosphate lyase insufficiency syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ultrastructural analysis and super-resolution microscopy showed podocyte loss and foot process effacement."
        explanation: Reports the ultrastructural podocyte readout.
    evidence:
    - reference: PMID:42182331
      reference_title: "Pyridoxine supplementation confers protection against SGPL1 (R222Q) variant sphingosine phosphate lyase insufficiency syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, SPL inactivation, S1P accumulation, wasting, anemia, proteinuria, and glomerulosclerosis developed in SPLR222Q but not WT mice fed chow with reduced pyridoxine."
      explanation: Establishes the diet-dependent disease phenotype of the knock-in model.
- name: Drosophila Sply mutant
  species: Drosophila melanogaster
  genotype: Sply loss-of-function

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucocorticoid insufficiency in early childhood is the most common endocrine manifestation affecting 64% of the 50 patients reported with SPLIS, and a third of these individuals have additional mineralocorticoid deficiency."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent clinical feature was endocrinopathies, including primary adrenal insufficiency (PAI) (71.2%) and hypothyroidism (32.7%)."
    explanation: Systematic review frequency of PAI.
  - reference: PMID:35904228

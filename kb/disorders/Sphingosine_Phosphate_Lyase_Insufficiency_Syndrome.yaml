    notes: >-
      SGPL1 deficiency is an inborn error of the final, irreversible step of sphingolipid
      degradation and is classified with the disorders of sphingolipid synthesis and
      recycling (ICIMD category 14, lipid metabolism), distinct from the lysosomal
      sphingolipidoses.

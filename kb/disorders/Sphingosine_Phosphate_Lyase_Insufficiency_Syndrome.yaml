    snippet: "Kidney biopsy showed focal segmental glomerulosclerosis in 2 patients and diffuse mesangial sclerosis in one patient."
    explanation: Biopsy findings in a clinical series.
- name: Stage 5 chronic kidney disease
  category: Renal
  frequency: FREQUENT
  description: >

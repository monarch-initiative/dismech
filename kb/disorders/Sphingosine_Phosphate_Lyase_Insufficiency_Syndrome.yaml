name: Sphingosine Phosphate Lyase Insufficiency Syndrome
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- SPLIS
- Nephrotic syndrome type 14
- NPHS14
- SGPL1 deficiency
- Sphingosine-1-phosphate lyase deficiency
- RENI syndrome (renal, endocrine, neurologic, immune)
- Primary adrenal insufficiency and steroid-resistant nephrotic syndrome due to SGPL1 deficiency
description: >
  Sphingosine phosphate lyase insufficiency syndrome (SPLIS; nephrotic syndrome type 14,
  OMIM #617575) is an autosomal recessive, non-lysosomal inborn error of sphingolipid
  metabolism first described in 2017, caused by biallelic inactivating variants in SGPL1.
  SGPL1 encodes sphingosine-1-phosphate (S1P) lyase, a pyridoxal 5'-phosphate-dependent
  endoplasmic reticulum enzyme that irreversibly cleaves S1P at the only exit point of
  sphingolipid catabolism. Loss of the enzyme causes accumulation of S1P, sphingosine and
  ceramide species in blood and tissues, with cell-type-specific consequences: podocyte
  cytoskeletal disorganization and loss (steroid-resistant nephrotic syndrome, most often
  with focal segmental glomerulosclerosis, progressing to kidney failure), disrupted
  adrenocortical zonation and steroidogenesis (primary adrenal insufficiency, often with
  adrenal calcification), impaired lymphocyte egress (T-cell lymphopenia and
  immunodeficiency), keratinocyte hyperdifferentiation (ichthyosis), and a progressive
  neurological disorder with deep grey nuclei involvement, cranial nerve palsies,
  sensorineural hearing loss and peripheral neuropathy. Additional endocrinopathies include
  primary hypothyroidism and, in boys, primary gonadal insufficiency. The phenotype is
  highly variable, from nonimmune fetal hydrops and neonatal death to adolescent-onset
  isolated adrenal insufficiency or nephropathy. Roughly half of reported patients have
  died, most in infancy from kidney failure or sepsis; diagnosis of nephropathy in the
  first year of life and prenatal presentation mark the highest-risk groups, while the
  common p.Arg222Gln (R222Q) allele is associated with milder disease. Pyridoxine
  (vitamin B6) cofactor supplementation benefits a subset of patients with responsive
  missense alleles, kidney transplantation extends survival, and AAV-mediated SGPL1 gene
  replacement and ROCK inhibition are in preclinical development.

prevalence:
- population: Worldwide (gnomAD v2.1.1-derived estimate)
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.015
  rate_low: 0.010
  rate_high: 0.021
  notes: >-
    Genomic-database estimate from cumulative pathogenic allele frequencies, not an
    observed case count: 0.015 per 100,000 (95% CI 0.010-0.021) worldwide, with higher
    estimates in Turkish and Iranian populations (0.046-0.078 per 100,000).
  evidence:
  - reference: PMID:39669624
    reference_title: "Prevalence estimate of sphingosine phosphate lyase insufficiency syndrome in worldwide and select populations."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The SPLIS prevalence estimate based on the total number of samples included from gnomAD v.2.1.1 (n = 141,430) was 0.015/100,000 (95% CI: 0.010 to 0.021)."
    explanation: >-
      Allele-frequency-based prevalence estimate; classified as computational because it
      is derived in silico from population genomic data rather than observed cases.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seventy-six molecularly confirmed patients were analysed in the 2024 natural history
    study; a 2023 systematic review found 55 patients across 19 articles.
  evidence:
  - reference: PMID:39334450
    reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a retrospective analysis of 76 patients in whom the diagnosis of SPLIS was established in a proband with at least one suggestive finding and biallelic SGPL1 variants identified by molecular genetic testing."
    explanation: Largest published patient series, giving the reported-case denominator.
progression:
- phase: Prenatal and infantile-onset nephropathy (high-risk)
  notes: >-
    Prenatal presentation (nonimmune hydrops, adrenal calcifications) and nephropathy
    diagnosed before one year of age define the highest-risk subgroups; fewer than 30% of
    infants with nephropathy diagnosed before age one survive two years, and prenatally
    diagnosed patients died at a median age of 2 months.
  evidence:
  - reference: PMID:39334450
    reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of children diagnosed with SPLIS nephropathy before age one (n = 30), less than 30% were alive 2 years after diagnosis, and 17% were living at last report."
    explanation: Natural history data defining the early-onset high-risk course.
  - reference: PMID:36371483
    reference_title: "Sphingosine phosphate lyase insufficiency syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all patients with a prenatal diagnosis of SPLIS (27.5%) died at a median"
    explanation: Systematic review showing uniformly fatal outcome of prenatally diagnosed disease.
- phase: Later-onset and R222Q-associated milder course
  notes: >-
    Patients whose nephropathy is diagnosed at or after one year of age, and those
    homozygous for p.Arg222Gln, survive substantially longer; kidney transplantation
    extends survival. Time from onset of proteinuria to end-stage kidney disease ranges
    from under one month to five years.
  evidence:
  - reference: PMID:39334450
    reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among those diagnosed at or after age one (n = 18), ~ 70% were alive 2 years after diagnosis, and 72% were living at time of last report. SPLIS patients homozygous for the SPL R222Q variant survived longer compared to patients with other genotypes. Kidney transplantation significantly extended survival outcomes."
    explanation: Defines the later-onset, better-prognosis subgroup and the genotype effect.
genetic:
- name: SGPL1
  gene_term:
    preferred_term: SGPL1
    term:
      id: hgnc:10817
      label: SGPL1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic loss-of-function variants in SGPL1 (10q22.1; sphingosine-1-phosphate lyase 1)
    cause SPLIS. More than 45 disease-associated variants have been reported, including
    missense, nonsense, frameshift, splice-site and in-frame deletion alleles; all tested
    alleles reduce or abolish protein and/or enzyme activity, and several missense variants
    mislocalise the protein. The recurrent p.Arg222Gln (c.665G>A) allele accounts for
    roughly 20-30% of patients, is associated with isolated glucocorticoid deficiency and
    a milder course, and is pyridoxine-responsive in vitro and in some patients.
  variants:
  - name: c.665G>A (p.Arg222Gln)
    description: >
      The most common SPLIS allele, present in roughly 20-30% of reported patients.
      Molecular modelling suggests it distorts the dimer interface; the residual enzyme is
      stabilised by pyridoxal 5'-phosphate cofactor supplementation, and homozygotes show
      longer survival and a preponderance of isolated glucocorticoid deficiency.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32233035
      reference_title: "Responsiveness of sphingosine phosphate lyase insufficiency syndrome to vitamin B6 cofactor supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One responsive patient is homozygous for an SPL R222Q variant present in almost 30% of SPLIS patients. Molecular modeling suggests the variant distorts the dimer interface which could be overcome by cofactor supplementation."
      explanation: Establishes the allele frequency and the structural basis for B6 responsiveness.
    - reference: PMID:36371483
      reference_title: "Sphingosine phosphate lyase insufficiency syndrome: a systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among 30 different mutations in SGPL1, the most common was c.665G > A (p.Arg222Gln) in 11 (20%) patients."
      explanation: Systematic review quantifying the share of patients carrying this allele.
  - name: c.1513C>T (p.Arg505*) and c.934delC (p.Leu312Phefs*30)
    description: >
      Homozygous truncating variants identified in two consanguineous families with
      congenital nephrotic syndrome, hypogonadism and prenatally detected adrenal
      calcifications; associated with markedly elevated blood and fibroblast S1P.
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28181337
      reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using exome sequencing and targeted Sanger sequencing, two homozygous truncating mutations, c.1513C>T (p.Arg505*) and c.934delC (p.Leu312Phefs*30), were identified in SGPL1-encoding sphingosine-1-phosphate (S1P) lyase 1."
      explanation: Original report of these truncating alleles in the congenital nephrotic presentation.
  - name: p.Tyr416Cys, p.Arg340Trp, p.Ser346Ile and p.Arg222Trp (recurrent severe alleles)
    description: >
      Together with p.Arg222Gln these four recurrent missense alleles account for three
      quarters of reported cases. They carry a genotype-severity signal: no patient
      homozygous for p.Ser346Ile (a Moroccan founder allele) or p.Arg222Trp (Turkish
      ancestry) survived, with median age at last report under six months, whereas
      p.Arg222Gln homozygotes survive into later childhood.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39334450
      reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five missense variants (R222Q, Y416C, R340W, S346I, and R222W) accounted for 75% of all reported SPLIS cases"
      explanation: Quantifies the share of cases explained by the recurrent alleles.
    - reference: PMID:39334450
      reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast to the generally more favorable outcome of SPLIS patients homozygous for the R222Q variant, no patients homozygous for R222W variant survived"
      explanation: Genotype-survival relationship for the Arg222Trp allele.
    - reference: PMID:39334450
      reference_title: "Factors influencing survival in sphingosine phosphate lyase insufficiency syndrome: a retrospective cross-sectional natural history study of 76 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The S346I variant representing 11% of variants and 7% of SPLIS cases was found in homozygous state in one Moroccan family, and no case survived"
      explanation: Genotype-survival relationship for the Ser346Ile allele.
  evidence:
  - reference: PMID:28165339
    reference_title: "Mutations in sphingosine-1-phosphate lyase cause nephrosis with ichthyosis and adrenal insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 7 families with SRNS and facultative ichthyosis, adrenal insufficiency, immunodeficiency, and neurological defects, we identified 9 different recessive mutations in SGPL1, which encodes sphingosine-1-phosphate (S1P) lyase. All mutations resulted in reduced or absent SGPL1 protein and/or enzyme activity."
    explanation: One of the three simultaneous 2017 gene-discovery reports establishing SGPL1 as causative.
  - reference: PMID:28165343
    reference_title: "Sphingosine-1-phosphate lyase mutations cause primary adrenal insufficiency and steroid-resistant nephrotic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this work, we have identified 4 different homozygous mutations, c.665G>A (p.R222Q), c.1633_1635delTTC (p.F545del), c.261+1G>A (p.S65Rfs*6), and c.7dupA (p.S3Kfs*11), in 5 families with the condition."
    explanation: Independent simultaneous gene-discovery report in the adrenal-insufficiency cohort.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >
    SPLIS is inherited in an autosomal recessive manner; parental consanguinity is reported
    in about 70% of patients. Expressivity is highly variable, including within kindreds,
    and there is no clear overall genotype-phenotype correlation apart from the milder
    R222Q-associated course.
  evidence:
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPLIS is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for an SGPL1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: GeneReviews statement of the inheritance pattern and recurrence risk.
  - reference: PMID:35904228
    reference_title: "A retrospective analysis of endocrine disease in sphingosine-1-phosphate lyase insufficiency: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no clear genotype-phenotype correlation overall in the syndrome, with variable disease penetrance within individual kindreds."
    explanation: Documents the variable expressivity, including intrafamilial variability.
pathophysiology:
- name: Biallelic SGPL1 Loss of Function
  description: >
    Biallelic SGPL1 variants abolish or severely reduce sphingosine-1-phosphate lyase, the
    pyridoxal 5'-phosphate-dependent endoplasmic reticulum enzyme that irreversibly cleaves
    S1P into hexadecenal and phosphoethanolamine. Missense alleles reduce activity and can
    mislocalise the protein; truncating alleles abolish it. Because the lyase guards the only
    exit from sphingolipid metabolism, its loss blocks the entire degradative pathway.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: sphingosine-1-phosphate lyase activity
    term:
      id: GO:0008117
      label: sphinganine-1-phosphate aldolase activity
    modifier: DECREASED
  downstream:
  - target: Sphingoid Base Phosphate and Sphingolipid Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28181337
      reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The levels of SGPL1 substrates, S1P, and sphingosine were markedly increased in the patients' blood and fibroblasts, as determined by liquid chromatography-tandem mass spectrometry."
      explanation: Directly links loss of the enzyme to substrate accumulation in patients.
  evidence:
  - reference: PMID:28165339
    reference_title: "Mutations in sphingosine-1-phosphate lyase cause nephrosis with ichthyosis and adrenal insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutations resulted in reduced or absent SGPL1 protein and/or enzyme activity. Overexpression of cDNA representing SGPL1 mutations resulted in subcellular mislocalization of SGPL1."
    explanation: Functional characterisation of the disease alleles as loss of function.
  - reference: PMID:30274713
    reference_title: "Sphingosine phosphate lyase insufficiency syndrome (SPLIS): A novel inborn error of sphingolipid metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sphingosine-1-phosphate lyase (SPL) is an intracellular enzyme that controls the final step in the sphingolipid degradative pathway, the only biochemical pathway for removal of sphingolipids."
    explanation: Review establishing why loss of this single enzyme blocks all sphingolipid removal.
- name: Sphingoid Base Phosphate and Sphingolipid Accumulation
  description: >
    Without the lyase, S1P, sphingosine, ceramides and sphingomyelin accumulate in plasma,
    urine and cells. S1P is a bioactive signalling lipid acting through five G-protein-coupled
    S1P receptors and intracellular targets, so the accumulation is not inert storage but
    excessive signalling. Metabolic labelling shows that cells partly buffer S1P by
    feedback-inhibiting de novo synthesis and diverting ceramide into glycosphingolipids;
    pathological intracellular S1P accumulation emerges when these compensations are
    overwhelmed, and Sgpl1-null kidneys show pronounced S1P enrichment and urinary excretion.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: sphingolipid catabolic process
    term:
      id: GO:0030149
      label: sphingolipid catabolic process
    modifier: DECREASED
  - preferred_term: sphingosine-1-phosphate receptor signaling pathway
    term:
      id: GO:0003376
      label: sphingosine-1-phosphate receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Podocyte Cytoskeletal Disorganization and Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42024444
      reference_title: "Redirection of sphingolipid metabolism drives cytoskeletal defects in SPLIS and reveals ROCK inhibition as therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo, Sgpl1-/- mice had pronounced urinary S1P excretion and renal S1P enrichment, accompanied by cytoskeletal disorganization and impaired epithelial morphogenesis. Mechanistically, we identify aberrant Rho/ROCK signaling as a key mediator of S1P-driven cytoskeletal dysregulation."
      explanation: Links renal S1P accumulation to the cytoskeletal lesion via Rho/ROCK signalling.
  - target: Adrenocortical Zonation and Steroidogenesis Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Lymphocyte Egress and T-Cell Lymphopenia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34133011
      reference_title: "Genotype/Phenotype Interactions and First Steps Toward Targeted Therapy for Sphingosine Phosphate Lyase Insufficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inactivating mutations of SGPL1-the gene encoding SPL-lead to a deficiency of its downstream products, and buildup of sphingolipid intermediates, including its bioactive substrate, sphingosine-1-phosphate (S1P), the latter causing lymphopenia, a hallmark of the disease."
      explanation: States that S1P buildup is the cause of the lymphopenia.
  - target: Keratinocyte Hyperdifferentiation and Epidermal Barrier Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36868360
      reference_title: "Ichthyosis linked to sphingosine 1-phosphate lyase insufficiency is due to aberrant sphingolipid and calcium regulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of SGPL1 caused an accumulation of S1P, sphingosine, and ceramides, while its overexpression caused a reduction of these species."
      explanation: Keratinocyte knockout reproduces the sphingolipid accumulation upstream of the differentiation phenotype.
  - target: Mitochondrial Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32682944
      reference_title: "Sphingosine-1-phosphate lyase (SGPL1) deficiency is associated with mitochondrial dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accumulation of sphingolipid intermediates, as seen with loss of function mutations in SGPL1, has been implicated in mitochondrial dysregulation, including alterations in mitochondrial membrane potentials and initiation of mitochondrial apoptosis."
      explanation: Frames sphingolipid accumulation as the trigger for the mitochondrial changes measured in the study.
  - target: Neuronal and Myelin Sphingolipid Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36187293
      reference_title: "Neurological Consequences of Sphingosine Phosphate Lyase Insufficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SPL guards the only exit point for sphingolipid metabolism, and its inactivation leads to accumulation of various types of sphingolipids which have biophysical roles in plasma membrane rafts and myelin, and signaling roles in cell cycle progression, vesicular trafficking, cell migration, and programmed cell death."
      explanation: Review connecting sphingolipid accumulation to membrane, myelin and neuronal signalling roles.
  evidence:
  - reference: PMID:32682944
    reference_title: "Sphingosine-1-phosphate lyase (SGPL1) deficiency is associated with mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mass spectrometric analysis of patient dermal fibroblasts revealed significantly elevated levels of sphingosine-1-phosphate, sphingosine, ceramide species and sphingomyelin when compared to control."
    explanation: Quantifies the breadth of sphingolipid accumulation in patient cells.
  - reference: PMID:42024444
    reference_title: "Redirection of sphingolipid metabolism drives cytoskeletal defects in SPLIS and reveals ROCK inhibition as therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Metabolic stable isotope labeling revealed that SPL deficiency does not invariably result in S1P accumulation. Instead, SPL-deficient cells maintain near-normal S1P levels through (a) feedback regulation of de novo sphingolipid synthesis via the ORMDL-ceramide axis and (b) increased diversion of excess ceramides into glycosphingolipids."
    explanation: >-
      Qualifies the accumulation model: compensatory rerouting buffers S1P until the
      sphingolipid load exceeds it.
- name: Podocyte Cytoskeletal Disorganization and Loss
  description: >
    SGPL1 is expressed in podocytes and mesangial cells. Excess S1P drives Rho/ROCK
    hyperactivation, disorganising the podocyte actin cytoskeleton; ultrastructure in the
    R222Q mouse shows foot process effacement and podocyte loss, and knockdown in mesangial
    cells impairs migration in an S1P-receptor-dependent manner. This is the
    disorder-specific initiating podocyte insult of the conserved nephrotic podocytopathy
    chain.
  biological_scale: CELLULAR
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  - preferred_term: glomerular mesangial cell
    term:
      id: CL:1000742
      label: glomerular mesangial cell
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  downstream:
  - target: Glomerular Filtration Barrier Failure and Glomerulosclerosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42182331
      reference_title: "Pyridoxine supplementation confers protection against SGPL1 (R222Q) variant sphingosine phosphate lyase insufficiency syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ultrastructural analysis and super-resolution microscopy showed podocyte loss and foot process effacement. Transcriptional profiling revealed a pattern of cytokine upregulation and extracellular matrix remodeling."
      explanation: Podocyte loss and effacement accompany proteinuria and glomerulosclerosis in the R222Q model.
  evidence:
  - reference: PMID:28165339
    reference_title: "Mutations in sphingosine-1-phosphate lyase cause nephrosis with ichthyosis and adrenal insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunofluorescence revealed SGPL1 expression in mouse podocytes and mesangial cells. Knockdown of Sgpl1 in rat mesangial cells inhibited cell migration, which was partially rescued by VPC23109, an S1P receptor antagonist."
    explanation: Localises the enzyme to the glomerular cells and shows an S1P-receptor-dependent cellular defect.
  - reference: PMID:42024444
    reference_title: "Redirection of sphingolipid metabolism drives cytoskeletal defects in SPLIS and reveals ROCK inhibition as therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pharmacological ROCK inhibition with fasudil mitigated renal cytoskeletal defects in Sgpl1-/- and Sgpl1rosa+fl/fl mice and partially restored epithelial architecture."
    explanation: Pharmacological rescue confirms Rho/ROCK as the mediator of the cytoskeletal lesion.
- name: Glomerular Filtration Barrier Failure and Glomerulosclerosis
  description: >
    Podocyte injury breaks the size- and charge-selective filtration barrier, producing
    steroid-resistant nephrotic-range proteinuria. Kidney biopsies show focal segmental
    glomerulosclerosis (including the collapsing variant) or diffuse mesangial sclerosis,
    and Sgpl1-knockout kidneys show STAT3 activation with proinflammatory and profibrogenic
    cytokine elevation. Progression to end-stage kidney disease ranges from under a month to
    five years after onset of proteinuria.
  biological_scale: TISSUE
  conforms_to: "nephrotic_podocyte_injury#Glomerular Filtration Barrier Breakdown"
  biological_processes:
  - preferred_term: glomerular filtration
    term:
      id: GO:0003094
      label: glomerular filtration
    modifier: ABNORMAL
  downstream:
  - target: Steroid-resistant nephrotic syndrome
    causal_link_type: DIRECT
  - target: Focal segmental glomerulosclerosis
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36371483
      reference_title: "Sphingosine phosphate lyase insufficiency syndrome: a systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Kidney disorders (42, 80.8%) were mainly in the form of steroid-resistant nephrotic syndrome (SRNS) and progressed to end-stage kidney disease (ESKD) in 19 (36.5%) patients at a median (IQR) age of 6 (1.4-42.6) months."
      explanation: Documents progression from SRNS to kidney failure in over a third of patients.
  evidence:
  - reference: PMID:33755599
    reference_title: "Efficacy of AAV9-mediated SGPL1 gene transfer in a mouse model of S1P lyase insufficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "STAT3 pathway activation and elevated proinflammatory and profibrogenic cytokines observed in KO kidneys were attenuated by treatment."
    explanation: Identifies the inflammatory and profibrotic signalling in the knockout kidney that underlies glomerulosclerosis.
  - reference: PMID:35748945
    reference_title: "A rare cause of nephrotic syndrome-sphingosine-1-phosphate lyase (SGPL1) deficiency: 6 cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney biopsy showed focal segmental glomerulosclerosis in 2 patients and diffuse mesangial sclerosis in one patient. Steroids were given to 3 patients, but they did not respond. All 6 patients progressed to chronic kidney disease"
    explanation: Histology and steroid resistance in a clinical series.
- name: Adrenocortical Zonation and Steroidogenesis Failure
  description: >
    Sgpl1-null mice show disrupted adrenocortical zonation and defective expression of
    steroidogenic enzymes, and patient fibroblasts show reduced cortisol output after
    progesterone stimulation. In patients this manifests as glucocorticoid deficiency in
    early childhood, with mineralocorticoid deficiency in about a third, and prenatally
    detectable adrenal calcification in some. The intermediate steps by which sphingolipid
    accumulation disrupts adrenal development and steroidogenesis are not established.

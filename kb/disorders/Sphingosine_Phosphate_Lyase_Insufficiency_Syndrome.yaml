    explanation: Imaging evidence for the progressive deep grey nuclei and callosal lesions.
phenotypes:
- name: Steroid-resistant nephrotic syndrome
  category: Renal
  frequency: VERY_FREQUENT
  description: >
    The most common presentation; onset ranges from congenital (including in utero) to
    adolescence, does not respond to corticosteroids, and progresses to kidney failure in a
    large proportion of patients.
  phenotype_term:
    preferred_term: Steroid-resistant nephrotic syndrome
    term:
      id: HP:0012588
      label: Steroid-resistant nephrotic syndrome
  evidence:
  - reference: PMID:36371483
    reference_title: "Sphingosine phosphate lyase insufficiency syndrome: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney disorders (42, 80.8%) were mainly in the form of steroid-resistant nephrotic syndrome (SRNS)"
    explanation: Systematic review frequency of kidney involvement, predominantly SRNS.
  - reference: PMID:33074640
    reference_title: "Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sphingosine phosphate lyase insufficiency syndrome (SPLIS) is characterized by varying combinations of steroid-resistant nephrotic syndrome (ranging from nonimmune fetal hydrops to adolescent onset)"
    explanation: GeneReviews summary of the renal phenotype and its onset range.
- name: Focal segmental glomerulosclerosis
  category: Renal
  frequency: FREQUENT

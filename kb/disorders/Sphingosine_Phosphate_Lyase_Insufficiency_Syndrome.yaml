    reference_title: "Sphingosine-1-phosphate lyase mutations cause primary adrenal insufficiency and steroid-resistant nephrotic syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sgpl1-/- mice displayed disrupted adrenocortical zonation and defective expression of steroidogenic enzymes as well as renal histology in keeping with a glomerular phenotype."
    explanation: Knockout adrenal histology establishing the tissue-level lesion.
  - reference: PMID:32682944
    reference_title: "Sphingosine-1-phosphate lyase (SGPL1) deficiency is associated with mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reduced cortisol output in response to progesterone stimulation was observed in two patient dermal fibroblast cell lines."
    explanation: Patient-cell steroidogenic defect corroborating the adrenal phenotype.
- name: Impaired Lymphocyte Egress and T-Cell Lymphopenia
  description: >
    Lymphocyte egress from thymus and lymph nodes follows an S1P gradient sensed by S1P
    receptor 1; loss of the lyase abolishes the gradient, trapping lymphocytes in lymphoid
    organs. T-cell lymphopenia is a near-universal feature, and although some T-cell
    function persists, patients have recurrent viral, fungal and bacterial infections and
    sepsis is a leading cause of death.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell migration
    term:
      id: GO:0072678
      label: T cell migration
    modifier: DECREASED
  downstream:
  - target: Decreased total lymphocyte count
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34133011
    reference_title: "Genotype/Phenotype Interactions and First Steps Toward Targeted Therapy for Sphingosine Phosphate Lyase Insufficiency Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "buildup of sphingolipid intermediates, including its bioactive substrate, sphingosine-1-phosphate (S1P), the latter causing lymphopenia, a hallmark of the disease"
    explanation: Attributes the lymphopenia to S1P accumulation.
  - reference: PMID:28181337
    reference_title: "Deficiency of the sphingosine-1-phosphate lyase SGPL1 is associated with congenital nephrotic syndrome and congenital adrenal calcifications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "S1P is an intracellular and extracellular signaling molecule involved in angiogenesis, vascular maturation, and immunity."
    explanation: Background for the immune role of S1P signalling disrupted in the disease.
- name: Keratinocyte Hyperdifferentiation and Epidermal Barrier Disruption
  description: >
    In SGPL1-knockout keratinocytes and organotypic skin equivalents, accumulated S1P,
    sphingosine and ceramide drive premature differentiation, a thickened retained stratum
    corneum, altered calcium-signalling gene expression and loss of E-cadherin junctions,
    reproducing the ichthyosis, acanthosis and hyperpigmentation seen in most patients with
    a reported skin phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Ichthyosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36868360
    reference_title: "Ichthyosis linked to sphingosine 1-phosphate lyase insufficiency is due to aberrant sphingolipid and calcium regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SGPL1_KO upregulated differentiation markers, while SGPL1_OE upregulated basal and proliferative markers. The advanced differentiation of SGPL1_KO was confirmed by 3D organotypic models that also presented with a thickened and retained stratum corneum and a breakdown of E-cadherin junctions."
    explanation: Direct demonstration of the keratinocyte differentiation and barrier defect in a human skin model.
- name: Mitochondrial Dysfunction
  description: >
    Patient fibroblasts and SGPL1-knockout HeLa cells show reduced total mitochondrial
    volume and altered mitochondrial dynamics and oxidative phosphorylation parameters,
    consistent with sphingolipid-induced mitochondrial dysregulation. Its contribution to
    organ pathology and to phenotype severity is proposed but not yet established.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32682944
    reference_title: "Sphingosine-1-phosphate lyase (SGPL1) deficiency is associated with mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Total mitochondrial volume was reduced in both S1P lyase deficient patient and HeLa cell lines. Mitochondrial dynamics and parameters of oxidative phosphorylation were altered when compared to matched controls, though differentially across the cell lines."
    explanation: Primary measurement of the mitochondrial phenotype in patient-derived and engineered cells.
- name: Neuronal and Myelin Sphingolipid Dysregulation
  description: >
    Accumulated sphingolipids perturb membrane rafts and myelin, and loss of the lyase's
    products impairs autophagic flux important for axonal integrity. Clinically this
    produces a spectrum from callosal dysgenesis and microcephaly to progressive
    involvement of the globus pallidus, thalamus and dentate nucleus with atrophy, cranial
    nerve deficits, sensorineural hearing loss, peripheral motor and sensory neuropathy,
    seizures and developmental regression.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: ABNORMAL
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DYSREGULATED
  downstream:

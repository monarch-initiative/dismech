    Chronic perimyocarditis with R. helvetica DNA in cardiac tissue has been
    reported in sudden cardiac death.
  phenotype_term:
    preferred_term: Myocarditis
    term:
      id: HP:0012819
      label: Myocarditis
  evidence:
  - reference: PMID:10513711
    reference_title: >-
      Association of Rickettsia helvetica with chronic perimyocarditis in
      sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied two young Swedish men who died of sudden cardiac failure
      during exercise, and who showed signs of perimyocarditis similar to those
      described in rickettsial disease.
    explanation: >-
      The case report ties R. helvetica infection to fatal chronic
      perimyocarditis in two young men.

- name: Meningitis
  category: Neurologic
  description: R. helvetica has been implicated in subacute lymphocytic meningitis.
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:29996782
    reference_title: >-
      Evidence of rickettsiae in Danish patients tested for Lyme
      neuroborreliosis: a retrospective study of archival samples.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most reports of human exposure have described asymptomatic seroconversion
      or a mild, self-limiting flu-like illness but it has also been implicated
      as a cause of subacute lymphocytic meningitis.
    explanation: >-
      The Danish study cites subacute lymphocytic meningitis as a published
      severe neurologic presentation of R. helvetica infection.

treatments:
- name: Empiric doxycycline for spotted-fever-group rickettsiosis
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Suspected R. helvetica disease is treated with doxycycline, a
    cell-penetrant tetracycline that reaches the rickettsial cytosolic niche
    and inhibits bacterial 30S ribosomal translation; post-bite prophylactic
    doxycycline is not recommended for asymptomatic tick exposure.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits R. helvetica by binding the bacterial 30S ribosomal
      subunit and arresting protein synthesis.
  - target: Intracytosolic Rickettsia helvetica Niche
    treatment_effect: BYPASSES
    description: >-
      Intracellular accumulation lets doxycycline reach the cytosolic rickettsial
      niche.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical signs resolved after doxycycline.
    explanation: >-
      The two molecularly confirmed Serbian human cases had clinical resolution
      after doxycycline.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      CDC guidance for tickborne rickettsial diseases supports doxycycline as
      the empiric treatment for suspected rickettsioses while diagnostic testing
      is pending.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic use of doxycycline after a tick bite is not recommended for
      the prevention of tickborne rickettsial diseases.
    explanation: >-
      Supports avoiding post-exposure antibiotic prophylaxis after an
      asymptomatic tick bite.

- name: Tick-bite prevention counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    Primary prevention interrupts the tick-inoculation trigger through avoidance
    of tick-infested habitats when possible, topical DEET on exposed skin,
    permethrin-treated clothing, protective clothing, regular tick checks, and
    prompt mechanical removal of attached ticks.
  treatment_term:
    preferred_term: tick-bite prevention counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No vaccine is licensed for the prevention of tickborne rickettsial
      diseases in the United States. Avoiding tick bites and promptly removing
      attached ticks remain the best disease prevention strategies.
    explanation: >-
      Establishes bite avoidance and tick removal as the primary preventive
      approach for tickborne rickettsioses.
  - reference: PMID:17338947
    reference_title: Rickettsial and other tick-borne infections.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The best method to avoid tick bites is twofold: application of a topical
      deet (N,N-diethyl-m-toluamide) repellent to exposed skin, and treatment
      of clothing with permethrin.
    explanation: >-
      Review guidance names topical DEET and permethrin-treated clothing as the
      main personal-protection measures against tick bites.

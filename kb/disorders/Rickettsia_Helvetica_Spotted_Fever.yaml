name: Rickettsia helvetica spotted fever
creation_date: "2026-09-28T09:11:00Z"
updated_date: "2026-09-28T09:11:00Z"
category: Infectious Disease
description: >-
  Rickettsia helvetica spotted fever is a usually mild, often aneruptive,
  tick-borne spotted-fever-group rickettsiosis caused by the obligately
  intracellular bacterium Rickettsia helvetica. The organism is associated
  mainly with Ixodes ricinus in Europe and circulates vertically in ticks;
  human infection is sparsely reported, but serology and lesion/blood PCR from
  tick-bite-associated cases link infection to fever, headache, myalgia,
  arthralgia, occasional eschar, and response to doxycycline.
disease_term:
  preferred_term: Rickettsia helvetica spotted fever
  term:
    id: MONDO:0000331
    label: Rickettsia helvetica spotted fever
parents:
- Spotted fever rickettsiosis
synonyms:
- Rickettsia helvetica infection
- Rickettsia helvetica aneruptive fever
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:14766859
      reference_title: >-
        Aneruptive fever associated with antibodies to Rickettsia helvetica in
        Europe and Thailand.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report that eight patients from France, Italy, and Thailand had
        serological evidence of Rickettsia helvetica infection.
      explanation: >-
        The case series frames R. helvetica spotted fever as an acute bacterial
        rickettsial infection, placing it in Harrison's Infectious Diseases
        Part.

infectious_agent:
- name: Rickettsia helvetica
  infectious_agent_term:
    preferred_term: Rickettsia helvetica
    term:
      id: NCBITaxon:35789
      label: Rickettsia helvetica
  description: >-
    Obligate intracellular spotted-fever-group rickettsial bacterium associated
    with human febrile illness after exposure to infected Ixodes ticks.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia helvetica is a spotted fever group rickettsia associated
      mainly with Ixodes ricinus and increasingly detected in European ticks.
    explanation: >-
      Molecularly confirmed Serbian human cases identify R. helvetica as a
      spotted-fever-group Rickettsia linked to human tick-bite illness.

transmission:
- name: Ixodes-associated tick bite transmission
  description: >-
    Humans are exposed when infected Ixodes ticks feed and inoculate R.
    helvetica from the enzootic tick reservoir; I. ricinus maintains stable
    R. helvetica infection in Europe through efficient transovarial
    transmission, while vertebrate hosts disperse infected ticks and organisms.
  evidence:
  - reference: PMID:19732416
    reference_title: >-
      Ixodes ricinus ticks are reservoir hosts for Rickettsia helvetica and
      potentially carry flea-borne Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The simplest explanation for the comparable prevalence of R. helvetica
      between the defined tick stages is, that R. helvetica is vertically
      transmitted through the next generation with high efficiency.
    explanation: >-
      A longitudinal Dutch tick survey found R. helvetica in I. ricinus larvae,
      nymphs, and adults at comparable prevalence, supporting I. ricinus as the
      reservoir tick.
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two tick-bite-associated human cases in Serbia in May 2025.
    explanation: >-
      The Serbian molecular detections establish that human cases follow tick
      attachment.

pathophysiology:
- name: Tick-Borne Rickettsia helvetica Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    An infected tick introduces R. helvetica into skin during attachment,
    seeding a local lesion that can contain rickettsial DNA and, in some
    patients, necrose into an inoculation eschar.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Intracytosolic Rickettsia helvetica Niche
    causal_link_type: DIRECT
    description: Tick inoculation delivers R. helvetica to intracellular host-cell niches.
  - target: Inoculation Eschar
    causal_link_type: DIRECT
    description: Bite-site infection can produce a necrotic eschar.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia spp. DNA was detected in capillary blood from both lesions,
      and sequencing of the PCR amplicons identified R. helvetica
    explanation: >-
      Lesion-focused PCR after Ixodes attachment detected R. helvetica DNA at
      bite-associated skin lesions, supporting local inoculation.

- name: Intracytosolic Rickettsia helvetica Niche
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  biological_scale: CELLULAR
  description: >-
    Like pathogenic Rickettsia generally, R. helvetica is modeled as a
    cytosolic intracellular bacterium; this niche places the organism beyond
    extracellular-only antibacterial exposure and requires cell-penetrant
    therapy.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Small-Vessel Rickettsial Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial spread can extend infection to microvascular endothelium.
  - target: Rickettsial Ribosomal Translation
    causal_link_type: DIRECT
    description: Cytosolic R. helvetica remains dependent on bacterial ribosomal protein synthesis.
  evidence:
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms
      of an Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining
      genes for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The rickettsial pathogenesis review supports the free cytosolic niche as
      the conserved intracellular lifestyle of Rickettsia species.

- name: Small-Vessel Rickettsial Vasculitis
  role: vascular_response
  biological_scale: TISSUE
  description: >-
    Spotted-fever-group rickettsiae disseminate from the bite site and target
    microvascular endothelium, producing focal small-vessel vasculitis; in
    R. helvetica infection this conserved mechanism is kept narrow because most
    reported human disease is mild and aneruptive.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Endotheliotropic infection and inflammatory signaling drive systemic fever.
  evidence:
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms
      of an Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The fundamental lesion of rickettsial diseases is vasculitis
    explanation: >-
      Review synthesis supports small-vessel vasculitis as the shared
      rickettsial tissue lesion downstream of endothelial infection.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  biological_scale: MOLECULAR
  description: >-
    R. helvetica requires bacterial 70S ribosomal translation to synthesize
    proteins; doxycycline reaches intracellular rickettsiae and blocks the 30S
    ribosomal subunit.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the conserved target
      of tetracycline-class therapy; the R. helvetica-specific treatment
      evidence below establishes doxycycline responsiveness in human disease.

phenotypes:
- name: Fever
  category: Constitutional
  frequency: VERY_FREQUENT
  description: Fever is the cardinal systemic manifestation of R. helvetica infection.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:14766859
    reference_title: >-
      Aneruptive fever associated with antibodies to Rickettsia helvetica in
      Europe and Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infection presented as a mild disease in the warm season and was
      associated with fever, headache, and myalgia but not with a cutaneous
      rash.
    explanation: >-
      The eight-patient serologic case series identifies fever as part of the
      dominant mild aneruptive presentation.

- name: Headache
  category: Neurologic
  frequency: VERY_FREQUENT
  description: Headache accompanies the acute febrile syndrome.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:14766859
    reference_title: >-
      Aneruptive fever associated with antibodies to Rickettsia helvetica in
      Europe and Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infection presented as a mild disease in the warm season and was
      associated with fever, headache, and myalgia but not with a cutaneous
      rash.
    explanation: >-
      The serologic case series places headache in the dominant R. helvetica
      symptom complex.

- name: Myalgia
  category: Musculoskeletal
  description: Myalgia is part of the nonspecific flu-like syndrome.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  evidence:
  - reference: PMID:14766859
    reference_title: >-
      Aneruptive fever associated with antibodies to Rickettsia helvetica in
      Europe and Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms included fever, headache, and arthralgia in all
      patients, myalgia in four, and an inoculation eschar in one but no
      cutaneous rash.
    explanation: >-
      Four of the European serologically supported patients had myalgia.

- name: Arthralgia
  category: Musculoskeletal
  description: Arthralgia can accompany the acute R. helvetica febrile illness.
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:14766859
    reference_title: >-
      Aneruptive fever associated with antibodies to Rickettsia helvetica in
      Europe and Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms included fever, headache, and arthralgia in all
      patients, myalgia in four, and an inoculation eschar in one but no
      cutaneous rash.
    explanation: >-
      Arthralgia was reported in the European serologically supported
      R. helvetica cases.

- name: Inoculation Eschar
  category: Dermatologic
  description: >-
    A necrotic eschar can occur at the infected tick attachment site, although
    it was uncommon in the small published case series.
  phenotype_term:
    preferred_term: Eschar
    term:
      id: HP:6000793
      label: Eschar
  evidence:
  - reference: PMID:14766859
    reference_title: >-
      Aneruptive fever associated with antibodies to Rickettsia helvetica in
      Europe and Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms included fever, headache, and arthralgia in all
      patients, myalgia in four, and an inoculation eschar in one but no
      cutaneous rash.
    explanation: >-
      The series recorded an inoculation eschar in only one patient, supporting
      eschar as possible rather than typical for R. helvetica infection.

treatments:
- name: Empiric doxycycline for spotted-fever-group rickettsiosis
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Suspected R. helvetica disease is treated with doxycycline, a
    cell-penetrant tetracycline that reaches the rickettsial cytosolic niche
    and inhibits bacterial 30S ribosomal translation; post-bite prophylactic
    doxycycline is not recommended for asymptomatic tick exposure.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits R. helvetica by binding the bacterial 30S ribosomal
      subunit and arresting protein synthesis.
  - target: Intracytosolic Rickettsia helvetica Niche
    treatment_effect: BYPASSES
    description: >-
      Intracellular accumulation lets doxycycline reach the cytosolic rickettsial
      niche.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical signs resolved after doxycycline.
    explanation: >-
      The two molecularly confirmed Serbian human cases had clinical resolution
      after doxycycline.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      CDC guidance for tickborne rickettsial diseases supports doxycycline as
      the empiric treatment for suspected rickettsioses while diagnostic testing
      is pending.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prophylactic use of doxycycline after a tick bite is not recommended for
      the prevention of tickborne rickettsial diseases.
    explanation: >-
      Supports avoiding post-exposure antibiotic prophylaxis after an
      asymptomatic tick bite.

- name: Tick-bite prevention counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    Primary prevention interrupts the tick-inoculation trigger through avoidance
    of tick-infested habitats when possible, topical DEET on exposed skin,
    permethrin-treated clothing, protective clothing, regular tick checks, and
    prompt mechanical removal of attached ticks.
  treatment_term:
    preferred_term: tick-bite prevention counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No vaccine is licensed for the prevention of tickborne rickettsial
      diseases in the United States. Avoiding tick bites and promptly removing
      attached ticks remain the best disease prevention strategies.
    explanation: >-
      Establishes bite avoidance and tick removal as the primary preventive
      approach for tickborne rickettsioses.
  - reference: PMID:17338947
    reference_title: Rickettsial and other tick-borne infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The best method to avoid tick bites is twofold: application of a topical
      deet (N,N-diethyl-m-toluamide) repellent to exposed skin, and treatment
      of clothing with permethrin.
    explanation: >-
      Review guidance names topical DEET and permethrin-treated clothing as the
      main personal-protection measures against tick bites.

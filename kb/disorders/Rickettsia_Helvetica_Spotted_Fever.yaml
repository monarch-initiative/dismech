- name: Skin Rash
  category: Dermatologic
  description: >-
    R. helvetica is often described as aneruptive, but PCR- and
    serology-supported bacteremic disease can include rash.
  phenotype_term:
    preferred_term: Skin rash
    term:
      id: HP:0000988

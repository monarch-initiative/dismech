name: Rickettsia helvetica spotted fever
creation_date: "2026-09-28T09:11:00Z"
category: Infectious Disease
description: >-
  Rickettsia helvetica spotted fever is a usually mild, often aneruptive,
  tick-borne spotted-fever-group rickettsiosis caused by the obligately
  intracellular bacterium Rickettsia helvetica. The organism is associated
  mainly with Ixodes ricinus in Europe and circulates vertically in ticks;
  human infection is sparsely reported and often presents as self-limited fever
  with headache, myalgia, arthralgia, and occasional eschar. Molecular and
  serologic reports also link R. helvetica to rash-positive bacteremia and rare
  severe cardiac or neurologic presentations.
disease_term:
  preferred_term: Rickettsia helvetica spotted fever
  term:
    id: MONDO:0000331
    label: Rickettsia helvetica spotted fever
parents:
- Spotted fever rickettsiosis
synonyms:
- Rickettsia helvetica infection
- Rickettsia helvetica aneruptive fever
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:14766859
      reference_title: >-
        Aneruptive fever associated with antibodies to Rickettsia helvetica in
        Europe and Thailand.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report that eight patients from France, Italy, and Thailand had
        serological evidence of Rickettsia helvetica infection.
      explanation: >-
        The case series frames R. helvetica spotted fever as an acute bacterial
        rickettsial infection, placing it in Harrison's Infectious Diseases
        Part.

infectious_agent:
- name: Rickettsia helvetica
  infectious_agent_term:
    preferred_term: Rickettsia helvetica
    term:
      id: NCBITaxon:35789
      label: Rickettsia helvetica
  description: >-
    Obligate intracellular spotted-fever-group rickettsial bacterium associated
    with human febrile illness after exposure to infected Ixodes ticks.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia helvetica is a spotted fever group rickettsia associated
      mainly with Ixodes ricinus and increasingly detected in European ticks.
    explanation: >-
      Molecularly confirmed Serbian human cases identify R. helvetica as a
      spotted-fever-group Rickettsia linked to human tick-bite illness.

transmission:
- name: Ixodes-associated tick bite transmission
  description: >-
    Humans are exposed when infected Ixodes ticks feed and inoculate R.
    helvetica from the enzootic tick reservoir; I. ricinus maintains stable
    R. helvetica infection in Europe through efficient transovarial
    transmission, while vertebrate hosts disperse infected ticks and organisms.
  evidence:
  - reference: PMID:19732416
    reference_title: >-
      Ixodes ricinus ticks are reservoir hosts for Rickettsia helvetica and
      potentially carry flea-borne Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The simplest explanation for the comparable prevalence of R. helvetica
      between the defined tick stages is, that R. helvetica is vertically
      transmitted through the next generation with high efficiency.
    explanation: >-
      A longitudinal Dutch tick survey found R. helvetica in I. ricinus larvae,
      nymphs, and adults at comparable prevalence, supporting I. ricinus as the
      reservoir tick.
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two tick-bite-associated human cases in Serbia in May 2025.
    explanation: >-
      The Serbian molecular detections establish that human cases follow tick
      attachment.

diagnosis:
- name: Paired-serum indirect immunofluorescence antibody assay
  description: >-
    Paired acute and convalescent IgG IFA can retrospectively confirm spotted
    fever group rickettsiosis when the titer rises at least fourfold. Because
    serology cross-reacts within the spotted fever group, species-level
    assignment of R. helvetica needs an R. helvetica-focused antigen strategy,
    Western blot, cross-adsorption, or molecular confirmation.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: A fourfold rise in paired R. helvetica IgG titers supports recent infection.
  evidence:
  - reference: PMID:15723687
    reference_title: >-
      Evidence of Rickettsia spp. infection in Sweden: a clinical,
      ultrastructural and serological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients showed a four-fold increase in antibody titer to the spotted
      fever rickettsia, R. helvetica
    explanation: >-
      The Swedish clinical study documents paired-serum seroconversion to
      R. helvetica in three tick-bite-associated cases.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A diagnosis of tickborne rickettsial disease is confirmed with a
      fourfold or greater increase in antibody titer in samples collected at
      appropriately timed intervals in patients with a clinically compatible
      acute illness
    explanation: >-
      CDC tickborne-rickettsiosis guidance defines the fourfold-rise standard
      that also applies to spotted-fever-group R. helvetica infection.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cross-reactive immune responses to rickettsial antigens result in
      antibodies that are typically group-specific, although perhaps not
      species-specific, for tickborne rickettsial pathogens
    explanation: >-
      CDC guidance explains why a spotted-fever-group serologic response alone
      cannot reliably assign the infection to R. helvetica.

- name: Lesion or tissue rickettsial PCR with sequencing
  description: >-
    PCR can amplify rickettsial DNA from lesion capillary blood, skin lesions,
    or involved tissues and sequencing then assigns the infecting species. A
    negative whole-blood PCR does not exclude a localized R. helvetica
    infection when the lesion itself remains PCR-positive.
  diagnosis_term:
    preferred_term: PCR-based molecular diagnosis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Rickettsial DNA amplified from a lesion or tissue and sequenced as R. helvetica.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia spp. DNA was detected in capillary blood from both lesions,
      and sequencing of the PCR amplicons identified R. helvetica, while whole
      blood was PCR-negative and serology did not show reproducible
      seroconversion.
    explanation: >-
      Lesion capillary blood confirmed R. helvetica by PCR and sequencing even
      when the same patient's whole blood and serology were uninformative.
  - reference: PMID:10513711
    reference_title: >-
      Association of Rickettsia helvetica with chronic perimyocarditis in
      sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By use of a semi-nested PCR, with primers specific for the 16S rRNA and
      17-kDa outer-membrane-protein genes, and sequence analysis of the
      amplified products, genetic material from R. helvetica was detected in
      the pericardium and in a lymph node from the pulmonary hilum in case 1,
      and in a coronary artery and the heart muscle in case 2.
    explanation: >-
      The cardiac case report used 16S and 17-kDa PCR followed by sequencing to
      localize R. helvetica DNA to inflamed cardiac and lymph-node tissue.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky
      Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses,
      Ehrlichioses, and Anaplasmosis - United States.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For eschar-producing tickborne rickettsial diseases, including R.
      parkeri, Rickettsia species 364D, and R. africae, an eschar biopsy, a
      swab of eschar exudate, or scab material from the eschar surface can
      provide suitable specimens for molecular confirmation of SFG rickettsial
      DNA
    explanation: >-
      The CDC report supports skin lesion material as a high-yield specimen
      type for spotted-fever-group rickettsial PCR, indirectly supporting the
      same sampling strategy when an R. helvetica bite site or eschar is
      present.

pathophysiology:
- name: Tick-Borne Rickettsia helvetica Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    An infected tick introduces R. helvetica into skin during attachment,
    seeding a local lesion that can contain rickettsial DNA and, in some
    patients, necrose into an inoculation eschar.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Early Monocyte Rickettsia helvetica Survival
    causal_link_type: DIRECT
    description: >-
      Tick inoculation can expose early macrophage and monocyte targets to
      viable rickettsiae.
  - target: Inoculation Eschar
    causal_link_type: DIRECT
    description: Bite-site infection can produce a necrotic eschar.
  evidence:
  - reference: PMID:42520541
    reference_title: >-
      Molecular detection of Rickettsia helvetica in lesion and blood samples
      after tick bites in Serbia: two cases with One Health implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia spp. DNA was detected in capillary blood from both lesions,
      and sequencing of the PCR amplicons identified R. helvetica
    explanation: >-
      Lesion-focused PCR after Ixodes attachment detected R. helvetica DNA at
      bite-associated skin lesions, supporting local inoculation.

- name: Early Monocyte Rickettsia helvetica Survival
  role: intracellular_persistence
  biological_scale: CELLULAR
  description: >-
    In the early post-inoculation phase, monocytes/macrophages can be exposed
    before vascular endothelial infection is established. In a THP-1 human
    monocytic model, R. helvetica survived, propagated, and induced TNF-alpha,
    supporting monocytes as an early host-cell compartment in the pathograph.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Intracytosolic Rickettsia helvetica Niche
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Monocyte/macrophage survival precedes dissemination to the
      intracytosolic niches that sustain endothelial infection.
  evidence:
  - reference: PMID:33276122
    reference_title: >-
      Characteristics of in vitro infection of human monocytes, by Rickettsia
      helvetica.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      One of the initial targets for rickettsiae after inoculation by ticks is
      the macrophage/monocyte.
    explanation: >-
      This frames the in-vitro R. helvetica monocyte experiment at the
      inoculation-to-endothelium step in rickettsial pathogenesis.
  - reference: PMID:33276122
    reference_title: >-
      Characteristics of in vitro infection of human monocytes, by Rickettsia
      helvetica.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: R. helvetica survives and propagates in the THP-1 cells.
    explanation: >-
      Human THP-1 monocytic cells supported R. helvetica survival and
      propagation in vitro.
  - reference: PMID:33276122
    reference_title: >-
      Characteristics of in vitro infection of human monocytes, by Rickettsia
      helvetica.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Infected monocytes induced TNF-α which may be important in host defence
      against rickettsial infections and promote cell survival and inhibiting
      cell death by apoptosis.
    explanation: >-
      Infected monocytes initiated a TNF-alpha inflammatory program, supporting
      the node's link to early inflammatory signaling.

- name: Intracytosolic Rickettsia helvetica Niche
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  biological_scale: CELLULAR
  description: >-
    Like pathogenic Rickettsia generally, R. helvetica is modeled as a
    cytosolic intracellular bacterium; this niche places the organism beyond
    extracellular-only antibacterial exposure and requires cell-penetrant
    therapy.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Small-Vessel Rickettsial Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial spread can extend infection to microvascular endothelium.
  - target: Rickettsial Ribosomal Translation
    causal_link_type: DIRECT
    description: Cytosolic R. helvetica remains dependent on bacterial ribosomal protein synthesis.
  evidence:
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms
      of an Endotheliotropic Infection.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining
      genes for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The rickettsial pathogenesis review supports the free cytosolic niche as
      the conserved intracellular lifestyle of Rickettsia species.

- name: Small-Vessel Rickettsial Vasculitis
  role: vascular_response
  biological_scale: TISSUE
  description: >-
    Spotted-fever-group rickettsiae disseminate from the bite site and target
    microvascular endothelium, producing focal small-vessel vasculitis; in
    R. helvetica infection this conserved mechanism is kept narrow because most
    reported human disease is mild and aneruptive.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Endotheliotropic infection and inflammatory signaling drive systemic fever.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic inflammation can present as headache.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic inflammation can present as myalgia.
  - target: Arthralgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic inflammation can present as arthralgia.
  - target: Skin Rash
    causal_link_type: DIRECT
    description: Systemic rickettsial endothelial infection can produce a rash.
  - target: Chronic Rickettsial Perimyocarditis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Endotheliotropic infection can involve cardiac tissue.
  - target: Reported Lymphocytic Meningitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: R. helvetica has been implicated in lymphocytic meningitis.
  evidence:
  - reference: PMID:15723687
    reference_title: >-
      Evidence of Rickettsia spp. infection in Sweden: a clinical,
      ultrastructural and serological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients showed a four-fold increase in antibody titer to the spotted
      fever rickettsia, R. helvetica, and immunohistochemical examination
      revealed rickettsia-like organisms in the walls of skin capillaries and
      veins.
    explanation: >-
      R. helvetica-seroconverting human cases had rickettsia-like organisms in
      skin capillary and venous walls, directly anchoring the endothelial
      small-vessel lesion.
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms
      of an Endotheliotropic Infection.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The fundamental lesion of rickettsial diseases is vasculitis
    explanation: >-
      Review synthesis supports small-vessel vasculitis as the shared
      rickettsial tissue lesion downstream of endothelial infection.

- name: Chronic Rickettsial Perimyocarditis
  role: organ_injury
  biological_scale: TISSUE
  description: >-
    Rare disseminated R. helvetica infection can involve pericardial, coronary,
    and myocardial tissue, with chronic interstitial inflammation and
    endothelium-localized rickettsia-like organisms in reported sudden-cardiac
    death cases.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Myocarditis
    causal_link_type: DIRECT
    description: Cardiac rickettsial infection can present as myocarditis or perimyocarditis.
  evidence:
  - reference: PMID:10513711
    reference_title: >-
      Association of Rickettsia helvetica with chronic perimyocarditis in
      sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examination of PCR-positive tissue showed chronic interstitial
      inflammation and the presence of rickettsia-like organisms predominantly
      located in the endothelium.
    explanation: >-
      In fatal chronic perimyocarditis cases with R. helvetica DNA, inflamed
      PCR-positive tissue contained endothelium-localized rickettsia-like
      organisms.

- name: Reported Lymphocytic Meningitis
  role: neurologic_complication
  biological_scale: TISSUE
  description: >-
    R. helvetica has been implicated as a cause of subacute lymphocytic
    meningitis, defining a rare neurologic branch of disease while leaving the
    intervening CNS trafficking and inflammatory steps unresolved.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Meningitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Meningeal inflammation manifests clinically as meningitis.
  evidence:
  - reference: PMID:29996782
    reference_title: >-
      Evidence of rickettsiae in Danish patients tested for Lyme
      neuroborreliosis: a retrospective study of archival samples.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most reports of human exposure have described asymptomatic seroconversion
      or a mild, self-limiting flu-like illness but it has also been implicated
      as a cause of subacute lymphocytic meningitis.
    explanation: >-
      The retrospective Danish study summarizes the published neurologic
      association and places lymphocytic meningitis outside the usual mild
      flu-like presentation.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  biological_scale: MOLECULAR
  description: >-
    R. helvetica requires bacterial 70S ribosomal translation to synthesize
    proteins; doxycycline reaches intracellular rickettsiae and blocks the 30S
    ribosomal subunit.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the conserved target
      of tetracycline-class therapy; the R. helvetica-specific treatment
      evidence below establishes doxycycline responsiveness in human disease.

phenotypes:

  evidence:
  - reference: PMID:18649945
    reference_title: >-
      Septicaemia with Rickettsia helvetica in a patient with acute febrile
      illness, rash and myasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present case, however, where the presence of R. helvetica in the
      blood was verified by PCR together with serologic evidence of infection,
      the patient presented a different clinical picture with acute febrile
      illness, rash and long-lasting myasthenia.
    explanation: >-
      A bacteremic PCR- and serology-supported case shows that R. helvetica can
      present with rash despite the usual aneruptive pattern.

- name: Myocarditis

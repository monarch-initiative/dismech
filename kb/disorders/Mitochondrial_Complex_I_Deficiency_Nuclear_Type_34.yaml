inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two NDUFAF8 alleles - compound heterozygous in
    the Leigh cohort, homozygous in the optic-atrophy families. NDUFAF8 is
    nuclear-encoded and autosomal, so this is a nuclear recessive mitochondrial
    disease, with the 25 percent sibling recurrence risk and absence of maternal
    transmission that distinguishes it from the mitochondrial-genome forms of
    complex I deficiency.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic next-generation sequencing has identified three unrelated
      pediatric subjects, each with a clinical diagnosis of Leigh syndrome, who
      harbor bi-allelic pathogenic variants in NDUFAF8.
    explanation: >-
      Establishes biallelic inheritance in the three subjects who define the
      entity.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The siblings from Family U carried the homozygous novel missense variant
      c.44T>G p.(L15R), while the probands from Families V and W carried the
      homozygous deep intronic variant c.195+271C>T p.?
    explanation: >-
      Homozygosity in three further families, confirming the recessive mode in
      the second, phenotypically distinct cohort.
pathophysiology:
- name: Biallelic NDUFAF8 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. Two allele classes have been reported and they are
    instructive in different ways.

    The first is a deep-intronic splicing variant, c.195+271C>T, which the
    defining study found recurrently and which it explicitly flags as having been
    initially overlooked because of where it sits. That is a diagnostic warning
    with a general moral, drawn by the authors themselves: when a patient has one
    definitively pathogenic variant in a recessive gene and no second hit, the
    intronic sequence is where to look. The same allele is what links the Leigh
    and optic-atrophy cohorts.

    The second is c.44T>G p.(L15R), which lies in the mitochondrial targeting
    sequence rather than in a functional domain, and is predicted to introduce a
    positive charge on the hydrophobic face of the amphipathic targeting helix.
    The consequence proposed for it is a failure of import rather than a failure
    of function, which is a different kind of loss-of-function claim and is
    modelled as its own node below.
  genes:
  - preferred_term: NDUFAF8
    term:
      id: hgnc:33551
      label: NDUFAF8
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as loss of function on measured grounds rather than predicted ones:
      the deep-intronic allele was confirmed to induce transcript decay, and the
      cellular phenotype of the defining cohort was corrected by supplying
      wild-type NDUFAF8 cDNA. `zygosity` is deliberately unset at the disease
      level because it differs between reported families - compound heterozygous
      in the Leigh cohort, homozygous in the optic-atrophy families - and a
      single value would misdescribe one of them. Both are recorded in the
      `inheritance:` block instead.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These variants include a recurrent splicing variant that was initially
      overlooked due to its deep-intronic location.
    explanation: >-
      Identifies the recurrent allele class and the reason it is easy to miss.
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also highlight the importance of evaluating intronic sequence when a
      single, definitively pathogenic variant is identified during diagnostic
      testing.
    explanation: >-
      The authors' own generalisation of the diagnostic lesson, which is the
      practical content of this node.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This latter variant was already described in two independent families
      affected by LS, in compound heterozygosity with pathogenic alleles, and it
      was confirmed to induce transcript decay.
    explanation: >-
      Establishes both the transcript-decay consequence of the recurrent allele
      and its recurrence across the Leigh and optic-atrophy cohorts, which is
      what makes those cohorts one entity.
  downstream:
  - target: Reduced NDUFAF8 Abundance in Mitochondria
    causal_link_type: DIRECT
- name: Reduced NDUFAF8 Abundance in Mitochondria
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Whatever the allele class, the shared consequence is that less functional
    NDUFAF8 reaches the mitochondrial matrix. For the deep-intronic allele the
    route is transcript decay. For p.(L15R) the proposed route is import failure:
    the residue lies in the targeting sequence, and the 2026 study reports
    experimental support that the variant reduces NDUFAF8 abundance in
    mitochondria and impairs complex I assembly.

    The evidence for the abundance claim in that family is indirect and the entry
    should be read as saying so. Quantitative proteomics on the patient's
    fibroblasts did not detect NDUFAF8 at all in the batch, so the protein's own
    level was not measured; what was measured was a strong fall in NDUFAF5, which
    is the protein whose stability depends on NDUFAF8, and a moderate fall in
    complex I. That is a coherent read-out of NDUFAF8 loss through its obligate
    partner, and it is how the node is supported, but it is not a direct
    measurement of NDUFAF8.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the change is predicted to affect the MTS introducing a positive charge on
      the hydrophobic side of the amphipathic α-helix (Fig. 5D), possibly
      affecting NDUFAF8 import into the mitochondria.
    explanation: >-
      The proposed import-failure route for the targeting-sequence allele. Quoted
      with its own hedging intact: the paper says "possibly", and so does this
      node.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NDUFAF8 protein was not detected in the whole TMT 11-plex batch, not
      allowing us to directly evaluate the variant effect.
    explanation: >-
      Graded PARTIAL because it is the limitation on this node rather than
      support for it: the abundance claim rests on the partner protein, not on
      NDUFAF8 itself.
  - reference: PMID:37159021
    reference_title: "A two-step mitochondrial import pathway couples the disulfide relay with matrix complex I biogenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      A weak targeting sequence drives TIM23-dependent NDUFAF8 matrix import,
      and en route, allows exposure to the IMS disulfide relay, which oxidizes
      NDUFAF8.
    explanation: >-
      Establishes the import route a targeting-sequence variant would act on,
      and therefore why NDUFAF8 abundance is the plausible endpoint of such a
      variant. Graded PARTIAL because it is cell-line work on wild-type NDUFAF8
      that does not involve the patient allele - the untested join between the
      two is the subject of an open HUMAN_MODEL_MISMATCH discussion.
  - reference: PMID:37159021
    reference_title: "A two-step mitochondrial import pathway couples the disulfide relay with matrix complex I biogenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Import is closely surveyed by proteases: YME1L prevents accumulation of
      excess NDUFAF8 in the IMS, while CLPP degrades reduced NDUFAF8 in the
      matrix.
    explanation: >-
      The quality-control layer that makes NDUFAF8 abundance sensitive to import
      efficiency rather than merely to transcript level. Graded PARTIAL for the
      same reason: measured in cell lines, never in a patient.
  downstream:
  - target: Loss of the NDUFAF8-NDUFAF5 Early Assembly Module
    causal_link_type: DIRECT
- name: Loss of the NDUFAF8-NDUFAF5 Early Assembly Module
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFAF8 does not act alone, and this is the node that explains why an
    assembly-factor loss is not simply a slower assembly. NDUFAF8 was found in the
    first place as an interactor of NDUFAF5, and the dependency runs the other
    way too: NDUFAF5 requires NDUFAF8 for its stability, so NDUFAF8 loss removes
    both halves of the module. Together the two contribute to the early
    stabilisation of NDUFS7, a core subunit of the matrix Q module.

    The measured consequence in a patient is a NDUFAF5 level at 18 percent of
    control. That is the strongest quantitative statement available anywhere in
    this entity, and it is a measurement of the partner rather than of NDUFAF8.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDUFAF8 is one such protein; it has been found to interact with the
      well-characterized complex I (CI) assembly factor NDUFAF5 in a large-scale
      protein-protein interaction screen.
    explanation: >-
      Establishes the NDUFAF8-NDUFAF5 interaction that defines the module.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed a strong reduction of NDUFAF5 protein (fold change: 0.18;
      Supplementary Fig. 2A), another CI assembly factor known to require NDUFAF8
      for its stability
    explanation: >-
      Quantifies the collapse of the partner protein in a patient's fibroblasts
      and states the stability dependency that explains it.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NDUFAF8 contributes to early stabilization of NDUFS7 together with NDUFAF5.
    explanation: >-
      Names the substrate of the module - the core Q-module subunit NDUFS7 -
      which is what places the lesion at the earliest stage of assembly.
  downstream:
  - target: Stalled Early Complex I Assembly
    causal_link_type: DIRECT
- name: Stalled Early Complex I Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Complex I is built stepwise from modular intermediates, and where a defect
    stalls that process is visible directly by complexome profiling. In NDUFAF8
    patient fibroblasts the profile shows an assembly defect whose stalled
    intermediates place NDUFAF8's role early - consistent with the module's
    substrate being a core Q-module subunit rather than a late accessory
    addition.

    This is the node that separates MC1DN34 from a subunit deficiency. A missing
    subunit yields an enzyme that is assembled but incomplete or inactive; a
    missing early assembly factor yields an enzyme that never gets past an
    intermediate.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complexome profiling of subject fibroblasts demonstrated a complex I
      assembly defect, and the stalled assembly intermediates corroborate the
      role of NDUFAF8 in early complex I assembly.
    explanation: >-
      Directly measures the stall and localises NDUFAF8's role to early assembly.
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The measured biochemical endpoint, and the phenotype the disease is named
    for. Patient fibroblasts express a complex I deficiency; the deficiency is
    isolated, meaning the other respiratory-chain complexes are spared, which is
    what an assembly factor dedicated to complex I predicts and what
    distinguishes this from the combined deficiencies caused by defects in
    mitochondrial gene expression. Lentiviral transduction with wild-type
    NDUFAF8 cDNA corrected both the assembly defect and the biochemical
    deficiency, which is the experiment that makes the gene causal rather than
    merely associated.

    Conformance note: the module node pairs decreased oxidative phosphorylation
    with increased reactive oxygen species. Only the first half is evidenced
    here - no reactive-oxygen measurement has been reported in an NDUFAF8
    patient - and the ROS arm is not asserted. The module's upstream node,
    age-related mitochondrial damage and mtDNA mutation, does not apply to a
    primary nuclear-gene assembly defect, so conformance is declared at this node
    alone.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subject fibroblasts were found to express a complex I deficiency, and
      lentiviral transduction with wild-type NDUFAF8-cDNA ameliorated both the
      assembly defect and the biochemical deficiency.
    explanation: >-
      Measures the deficiency and supplies the complementation result that
      establishes causality.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, a moderate reduction of CI protein level (mean fold change: 0.73)
      was observed, indicating an impaired assembly pathway (Supplementary Fig.
      2B).
    explanation: >-
      An independent measurement of reduced complex I in the second cohort, and
      the one that shows the deficit can be moderate rather than severe.
  downstream:
  - target: Retinal Ganglion Cell and Optic Nerve Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why complex I failure selects retinal ganglion cells is the central
      unsolved question of the inherited optic neuropathies generally, and no
      NDUFAF8-specific work addresses it. The edge is typed as having unknown
      intermediates for that reason.
  - target: Leigh-Syndrome Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from a generalised bioenergetic deficit to the specific
      symmetrical brainstem and basal-ganglia lesions of Leigh syndrome is not
      established for NDUFAF8 or for complex I deficiency as a class.
- name: Retinal Ganglion Cell and Optic Nerve Degeneration
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The 2026 pole of the phenotype. Six patients with biallelic NDUFAF8 variants
    presented with optic atrophy, five of them with optic atrophy and nothing
    else; the sixth also had cerebellar ataxia and nystagmus. In six of the
    thirteen patients across the four assembly-factor genes in that cohort the
    vision loss was subacute, which is the pattern of Leber hereditary optic
    neuropathy, and NDUFAF8 was associated with the autosomal-recessive LHON
    phenotype for the first time.

    Marked PROVISIONAL rather than ESTABLISHED because the *cellular* claim in
    the node title is an inference. What was observed is optic atrophy in
    patients; retinal ganglion cell loss is the accepted substrate of optic
    atrophy in the mitochondrial optic neuropathies but was not measured in these
    patients, and no NDUFAF8 tissue has been examined.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:

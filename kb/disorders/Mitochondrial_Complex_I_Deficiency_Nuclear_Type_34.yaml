name: Mitochondrial Complex I Deficiency, Nuclear Type 34
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 34
  term:
    id: MONDO:0032910
    label: mitochondrial complex I deficiency, nuclear type 34
description: >-
  Mitochondrial complex I deficiency nuclear type 34 (MC1DN34) is the isolated
  complex I deficiency caused by biallelic variants in NDUFAF8. NDUFAF8 is not a
  subunit of the enzyme: it is a small assembly factor, discovered as the
  uncharacterised open reading frame C17orf89 in a mitochondrial
  protein-interaction screen, whose interaction partner is the established
  complex I assembly factor NDUFAF5. The two act together at the earliest stage
  of assembly, stabilising the core subunit NDUFS7, and NDUFAF5 depends on
  NDUFAF8 for its own stability - so losing NDUFAF8 removes a module rather than
  a single protein.

  Ten patients have been reported, in three papers, and the two cohorts among
  them differ sharply in severity. The entity was defined in 2020 in three
  unrelated children with Leigh syndrome, whose fibroblasts had a complex I
  deficiency corrected by wild-type NDUFAF8 cDNA and whose complexome profiles
  showed stalled early assembly intermediates; a fourth Leigh-syndrome patient
  followed in 2025. In 2026 a targeted screen of complex I genes in patients with
  optic atrophy found six further patients with biallelic NDUFAF8 variants, five
  of whom had *isolated* optic atrophy - and associated NDUFAF8 for the first
  time with the autosomal-recessive Leber hereditary optic neuropathy phenotype.

  The two are not, however, two unrelated pictures that happen to share a gene,
  and it would be wrong to read them that way. Two things join them. The first is
  an allele: the recurrent deep-intronic c.195+271C>T variant reported in the
  Leigh families reappears homozygously in two of the optic-atrophy families. The
  second is the optic nerve itself. The deep-research report committed with this
  entry, which had full-text access to the 2020 paper, records optic atrophy and
  visual impairment in its first subject and small optic nerves with nystagmus in
  its second - so optic involvement was already present in the severe cohort,
  where it was one feature among many rather than the whole disease. That is an
  uncited lead, because the paper's cached record is abstract-only and its
  abstract does not describe individual subjects; it is recorded because without
  it a reader would take the two cohorts to be phenotypically disjoint, which
  they are not. This entry therefore curates one gene-defined disease whose range
  runs from fatal infantile encephalopathy with optic involvement to isolated
  optic atrophy, and does not treat the optic-atrophy cohort as a separate
  disorder.

  A second reason the entity is worth curating in its own right is the shape of
  its molecular lesion. One of the optic-atrophy alleles, p.(L15R), sits in the
  mitochondrial targeting sequence rather than in any functional domain, and
  independent cell-biological work shows why that matters: NDUFAF8 reaches the
  matrix by an unusual two-step import route that threads it through the
  intermembrane-space disulfide relay on the way, and is policed at both stages
  by proteases. A protein whose abundance is set by the efficiency of a two-stage
  import-and-oxidation pipeline is a protein a targeting-sequence variant can
  deplete without touching its active surface. That connection is drawn here as a
  hypothesis, not a finding - see the open discussion.

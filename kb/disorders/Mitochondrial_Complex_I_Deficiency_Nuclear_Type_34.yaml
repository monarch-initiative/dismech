  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with variants in NDUFAF4 was characterized by
      isolated OA in all three patients, as observed also for five of six
      patients with NDUFAF8 variants; the remaining proband also exhibited
      cerebellar ataxia and nystagmus.
    explanation: >-
      The primary clinical observation for this node, with the exact
      five-of-six split between isolated and syndromic optic atrophy.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, we associate for the first time the arLHON phenotype with variants
      in NDUFAF4 and NDUFAF8
    explanation: >-
      Establishes the subacute, LHON-like character of the vision loss in this
      gene.
- name: Leigh-Syndrome Encephalopathy
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The 2020 pole of the phenotype. All three subjects in the defining cohort
    carried a clinical diagnosis of Leigh syndrome - the commonest neurological
    presentation of paediatric mitochondrial disease, defined by symmetrical
    basal-ganglia, thalamic and brainstem lesions on neuroimaging together with
    loss of motor skills and delayed milestones.

    A scope note that matters for how this node should be read. The subjects'
    Leigh diagnosis is directly stated in the source; the lesion distribution and
    developmental features are quoted from the source's definition of Leigh
    syndrome rather than from a description of these three children. The
    diagnosis entails those features, which is why they are recorded here, but no
    per-patient imaging or developmental description is available in the cached
    record. The `phenotypes:` block reflects that distinction: it curates the
    Leigh diagnosis, not a list of individually observed neurological signs.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic next-generation sequencing has identified three unrelated
      pediatric subjects, each with a clinical diagnosis of Leigh syndrome, who
      harbor bi-allelic pathogenic variants in NDUFAF8.
    explanation: >-
      The clinical diagnosis in all three defining subjects.
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is characterized by symmetrical lesions found on neuroimaging in the
      basal ganglia, thalamus, and brainstem and by a loss of motor skills and
      delayed developmental milestones.
    explanation: >-
      The source's definition of the syndrome the subjects were diagnosed with.
      Graded OTHER because it is a definitional statement about Leigh syndrome as
      a class, not an observation in these subjects.

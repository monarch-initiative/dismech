genetic:
- name: NDUFAF8
  gene_term:
    preferred_term: NDUFAF8
    term:
      id: hgnc:33551
      label: NDUFAF8
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NDUFAF8's earlier name is C17orf89, and this matters for literature searching
    in the same way LYRM3 matters for NDUFB9: the work that first showed the
    protein is a complex I assembly factor was published under the
    open-reading-frame name, before the gene had a function or a disease. A search under
    "NDUFAF8" alone returns a very short list.

    Two allele classes are reported. The recurrent deep-intronic c.195+271C>T
    causes transcript decay and appears in both published cohorts - compound
    heterozygous with other pathogenic alleles in two Leigh families, homozygous
    in two optic-atrophy families. The missense c.44T>G p.(L15R) is homozygous in
    a third optic-atrophy family and lies in the mitochondrial targeting sequence.

    The 2020 cohort's other alleles are reported but not quotably here, since that
    paper's cached record is abstract-only. Recorded as uncited leads from the
    deep-research report committed with this entry, which read the full text: the
    frameshift c.45_52dup p.(Phe18Serfs*32), in trans with c.195+271C>T in subject
    1; the start-loss c.1A>G, in trans with c.195+271C>T in subject 2; and the
    homozygous missense c.165C>G p.(Phe55Leu) in subject 3, which the report
    describes as affecting an invariant aromatic residue and as the one variant
    for which no complementation rescue was possible because further tissue was
    unavailable. The same report gives the transcript as NM_001086521.1, a
    74-amino-acid protein, and the ClinVar submissions as SCV000995081 to
    SCV000995084. A curator with journal access should promote these to cited
    genetic_context entries.

    Two cross-references worth having. The first is to a sibling entry: the
    deep-intronic allele here is the second such lesion among the nuclear complex
    I diseases this knowledge base curates, alongside TIMMDC1 c.597-1340A>G in
    Mitochondrial_Complex_I_Deficiency_Nuclear_Type_31, whose entry is built
    around the fact that the disease is defined by a lesion exome sequencing
    cannot see. Two of this knowledge base's nuclear complex I entries turning on
    a deep-intronic allele is a pattern worth noticing, and it is the practical
    reason the diagnostic section here recommends looking at intronic sequence
    rather than stopping at one hit. No count of how common intronic alleles are
    across the whole class is asserted, because none of the sources cited here
    gives one.

    The second is a caution from the fourth reported patient, who carried a
    mitochondrial-DNA variant in a complex I subunit gene as well as the NDUFAF8
    variants. Whether that second variant modifies severity is unresolved, and
    the authors use the case to argue that both genomes should be examined before
    a Leigh-syndrome diagnosis is called complete. A single-gene answer in this
    disease class is not automatically the whole answer.

    A note on what is NOT claimed. The ten reported patients are too few,
    and their alleles too overlapping, to support a genotype-phenotype rule. It
    is tempting to read the recurrence of c.195+271C>T in both a Leigh cohort and
    an optic-atrophy cohort as showing the allele is phenotypically plastic, and
    the 2026 authors do report discordant phenotypes within one family carrying
    it. But in the Leigh families that allele was in trans with a different
    pathogenic variant, whereas in the optic-atrophy families it was homozygous,
    so allele state and phenotype are confounded and no clean inference is
    available.
  evidence:
  - reference: PMID:27499296
    reference_title: "Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory Chain Function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Building upon these observations, we validated C17orf89 as a complex I (CI)
      assembly factor.
    explanation: >-
      Establishes the C17orf89 synonym and the protein's function, four years
      before the gene had a disease.
  - reference: PMID:27499296
    reference_title: "Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory Chain Function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disruption of C17orf89 markedly reduced CI activity, and its depletion is
      found in an unresolved case of CI deficiency.
    explanation: >-
      The functional and clinical prediction that the 2020 gene-discovery paper
      later confirmed.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An important observation to highlight is the clinical variability that can
      occur with the same pathogenic variant in different individuals.
    explanation: >-
      The authors' framing of intrafamilial and interindividual phenotype
      variability, which is the reason this block declines to state a
      genotype-phenotype rule.
biochemical:
- name: Complex I Activity and Assembled Amount in Patient Fibroblasts
  notes: >-
    The measurement that both defines and diagnoses the entity, and the one that
    resolves a variant of uncertain significance. Three readouts are reported
    across the two cohorts and they are not interchangeable: enzyme activity
    (reduced in the Leigh cohort), assembled complex I protein level (reduced to
    a mean fold change of 0.73 in the optic-atrophy family), and the complexome
    profile, which shows where assembly stalls rather than how much enzyme is
    left. Only the third localises the defect to an early assembly step.

    The practical corollary for a new NDUFAF8 variant: complementation with
    wild-type NDUFAF8 cDNA in patient fibroblasts is the assay that made the
    first variants causal, and remains the route for the next one.

    A negative that is as important as the positives, and that this entry cannot
    cite. Subject 3 of the defining cohort had a *normal* blood lactate - the
    deep-research report committed with this entry records 1.44 mmol/L, with CSF
    lactate raised at 3 mmol/L. Normal blood lactate is the finding most likely
    to stop a clinician suspecting mitochondrial disease at all, and the same
    caution is curated in the sibling TIMMDC1 entry. It is an uncited lead here
    because the paper's cached record is abstract-only.

    Numbers, as uncited leads from the same report. It records residual complex I
    activity of 33 percent of control in muscle and 47 percent in fibroblasts for
    subject 1, and 3 percent in muscle for subject 3, and it records the rescue as restoring NDUFAF5 steady-state
    levels as well as complex I assembly and activity - which is the strongest
    single link between the module described above and the biochemical endpoint.
    It also names the complexome dataset, ProteomeXchange PXD015749, and the two
    stalled intermediates as PD-a and a partly assembled Q module. None of this is
    snippet-verifiable, because the paper is abstract-only in the reference cache.
    Note in particular that the spread from 3 percent to 47 percent residual
    activity sits inside the severe cohort, which is why the cross-cohort severity
    comparison discussed below cannot be made from published numbers.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complexome profiling of subject fibroblasts demonstrated a complex I
      assembly defect, and the stalled assembly intermediates corroborate the
      role of NDUFAF8 in early complex I assembly.
    explanation: >-
      The complexome readout and what it establishes that an activity assay
      cannot.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients in total across three reports - three unrelated children with
    Leigh syndrome in 2020, a fourth Leigh-syndrome patient reported in 2025, and
    six patients from three families ascertained through optic atrophy in 2026.
    No population estimate exists, and the ascertainments are so different (a
    paediatric mitochondrial-disease diagnostic pipeline; a single diagnostic
    case; a targeted screen of complex I genes in optic-atrophy patients) that
    none gives an unbiased denominator.

    For context on the class rather than on this entity: complex I deficiency is
    the most frequent childhood mitochondrial disorder, accounting for up to 30
    percent of cases. The 2026 authors' own conclusion is that the nuclear
    complex I genes are underrepresented in the molecular diagnosis of inherited
    optic neuropathy, which implies NDUFAF8's count is a floor rather than an
    estimate.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic next-generation sequencing has identified three unrelated
      pediatric subjects, each with a clinical diagnosis of Leigh syndrome, who
      harbor bi-allelic pathogenic variants in NDUFAF8.
    explanation: >-
      The three defining patients.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with variants in NDUFAF4 was characterized by
      isolated OA in all three patients, as observed also for five of six
      patients with NDUFAF8 variants; the remaining proband also exhibited
      cerebellar ataxia and nystagmus.
    explanation: >-
      The six patients of the optic-atrophy cohort.
  - reference: PMID:39921456
    reference_title: "Mitochondrial DNA or Genomic DNA Variant(s): Utility of Exhaustive Sequencing in Leigh Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in the nuclear gene NDUFAF8 are a rare cause of
      mitochondrial complex I deficiency with only three cases described to date.
      We report here a new case of NDUFAF8 deficiency confirming the phenotype of
      NDUFAF8-induced complex I biochemical defect, Leigh syndrome and premature
      death.
    explanation: >-
      A fourth Leigh-syndrome patient, and an independent confirmation of the
      2020 phenotype. Note the paper's own "only three cases described to date"
      was already out of date by the time the 2026 optic-atrophy series
      published.
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complex I deficiency is the most frequent mitochondrial disorder presenting
      in childhood, accounting for up to 30% of cases.
    explanation: >-
      Establishes the frequency of the disease class, not of this entity.
experimental_models:
- name: NDUFAF8 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from the three Leigh-syndrome subjects, transduced with wild-type
    NDUFAF8 cDNA. This is the experiment that converted a candidate gene into a
    disease gene, and it is the only functional work reported in cells from a
    patient with this disorder. There is no NDUFAF8 animal model, no knockout
    cell line reported in a disease context, and no patient tissue.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type NDUFAF8 corrected both the assembly defect and the
      biochemical deficiency in the patients' own cells, which excludes a
      coincidental variant and localises the deficit to this gene.
    limitations: >-
      Fibroblasts are neither brain nor retinal ganglion cell, and neither
      affected tissue has been studied. The rescue establishes causality; it says
      nothing about why the basal ganglia or the optic nerve are the organs that
      fail, nor about why the same gene produces two such different clinical
      pictures.
    readouts:
    - name: Complex I assembly and enzyme activity after wild-type NDUFAF8 expression
      target: Isolated Complex I Deficiency
      direction: RESTORED
      interpretation: >-
        Both the assembly defect and the biochemical deficiency improving on
        complementation is the criterion the authors used to call the variants
        causal.
      evidence:
      - reference: PMID:31866046
        reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Subject fibroblasts were found to express a complex I deficiency, and
          lentiviral transduction with wild-type NDUFAF8-cDNA ameliorated both
          the assembly defect and the biochemical deficiency.
        explanation: >-
          The rescue measurement underlying this readout.
    evidence:
    - reference: PMID:31866046
      reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Complexome profiling of subject fibroblasts demonstrated a complex I
        assembly defect, and the stalled assembly intermediates corroborate the
        role of NDUFAF8 in early complex I assembly.
      explanation: >-
        Establishes that the patient fibroblast reproduces the assembly lesion
        this node describes, which is what makes the model informative for it.
treatments:
- name: Idebenone for the Optic Neuropathy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The only treatment with any published relationship to this disease, and it
    is a recommendation rather than a result.

    The 2026 series that found the optic-atrophy pole of NDUFAF8 disease
    concludes that patients with nuclear complex I optic neuropathy may benefit
    from idebenone, dosed as it is for Leber hereditary optic neuropathy - where
    it is an approved therapy. The same paper reports what its cohort actually
    experienced, and the honest reading is discouraging: visual improvement was
    variable, with only three of thirteen patients showing some degree of
    response.

    Three limits on how far this should be taken. That three-of-thirteen figure
    is a denominator spanning the paper's assembly-factor patients across four
    genes, not NDUFAF8 patients, so no response rate can be attributed to this
    genotype. No NDUFAF8 patient's individual treatment or outcome is reported
    anywhere. And nothing has been reported at all for the Leigh-syndrome pole,
    where an optic-nerve-directed therapy would not address the encephalopathy.
    This block records a recommendation the literature makes for a class this
    disease belongs to; it is not evidence that idebenone helps MC1DN34.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_phenotypes:
  - preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  target_mechanisms:
  - target: Isolated Complex I Deficiency
    treatment_effect: BYPASSES
    description: >-
      The rationale is that idebenone does not repair complex I but routes around
      it: in its reduced form it accepts electrons from NADH and delivers them
      directly to complex III, restoring flux through the rest of the chain. That
      is why it is a candidate here at all - the lesion is an assembly failure
      that no small molecule is going to reverse, whereas the bioenergetic
      consequence of that failure is in principle bypassable.
    evidence:
    - reference: PMID:41234160
      reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Idebenone, in its reduced form, can bypass CI and transfer electrons from
        NADH directly to respiratory complex III, thus restoring the downstream
        electron transport chain and oxidative phosphorylation.
      explanation: >-
        The mechanistic rationale for this edge. Graded OTHER because it is a
        statement of the drug's known pharmacology rather than a result measured
        in this cohort.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, these patients may benefit from treatment with idebenone,
      following appropriate dosing and standard protocols similar to those used
      for LHON.
    explanation: >-
      The authors' recommendation for the patient class this disease belongs to,
      which is the whole basis for this block.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Visual improvement was variable, with only 3 of 13 patients showing some
      degree of response to idebenone treatment (Supplementary Table 4).
    explanation: >-
      Graded PARTIAL because it qualifies the recommendation as much as it
      supports it: a minority responded, and the denominator is the cohort rather
      than the NDUFAF8 patients within it.
diagnosis:
- name: Complex I Enzyme or Complexome Assay Followed by Sequencing, Including Introns
  description: >-
    The biochemical demonstration of an isolated complex I deficiency comes
    first, and NDUFAF8 is then one candidate among many dozens - which is why the
    practical diagnostic content of this entity is not "test for NDUFAF8" but two
    narrower lessons.

    The first is where to look when sequencing returns one hit and not two. The
    recurrent NDUFAF8 allele is deep-intronic and was missed on that account, and
    the defining paper generalises the point into a recommendation about intronic
    sequence.

    The second is that a patient with apparently isolated optic atrophy and no
    mitochondrial-DNA finding may still have a nuclear complex I disorder. The
    2026 series makes exactly this argument, having found eleven such genes
    including NDUFAF8 in patients whose primary phenotype was optic atrophy.
  evidence:
  - reference: PMID:31866046
    reference_title: "Pathogenic Bi-allelic Mutations in NDUFAF8 Cause Leigh Syndrome with an Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also highlight the importance of evaluating intronic sequence when a
      single, definitively pathogenic variant is identified during diagnostic
      testing.
    explanation: >-
      The authors' diagnostic recommendation, arising from the missed
      deep-intronic allele in this gene.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted next-generation sequencing screening of CI genes to identify
      potential causative variants in patients with optic atrophy, and performed
      comprehensive clinical assessments, including neuroimaging (MRI) and
      neurological evaluations.
    explanation: >-
      The ascertainment strategy that found the optic-atrophy pole of this
      entity, and the one the authors recommend generalising.
differential_diagnoses:
- name: Other nuclear complex I subunit and assembly factor deficiencies
  description: >-
    MC1DN34 cannot be separated from its siblings clinically or biochemically -
    only by genotype. The class spans thirty-eight nuclear-encoded subunits and a
    growing list of assembly factors, several of which this knowledge base
    already carries as separate entries. The 2026 optic-atrophy series is the
    closest thing to a discriminating observation: within its cohort, core
    subunit defects gave isolated optic atrophy while accessory subunits and
    assembly factors gave a spectrum from isolated to syndromic - a tendency, in
    thirty-one patients, not a rule usable on an individual.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Causative genetic defects may involve the seven mitochondrial-encoded or 38
      nuclear-encoded subunits of the enzyme, or any of an increasing number of
      assembly factors implicated in the correct biosynthesis of complex I within
      the inner mitochondrial membrane.
    explanation: >-
      Establishes the size of the differential.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, defects in core CI subunits in this cohort led to isolated optic
      atrophy, while defects in accessory CI subunits and assembly factors
      resulted in a spectrum of phenotypes, from isolated to syndromic optic
      atrophy.
    explanation: >-
      Graded PARTIAL because it is a cohort-level tendency that does not
      discriminate an individual patient's gene, which is what a differential
      needs to do.
- name: Mitochondrial-DNA-encoded complex I deficiency, including classical LHON
  description: >-
    Roughly a quarter of complex I deficiency arises in the mitochondrial genome,
    with maternal inheritance, heteroplasmy and recurrence-risk implications
    entirely unlike a nuclear recessive disorder. The distinction is sharper for
    MC1DN34 than for most of its siblings because of the optic-atrophy pole:
    subacute vision loss in a young adult is the classical presentation of
    mitochondrial-DNA Leber hereditary optic neuropathy, and a patient with that
    picture and no mitochondrial-DNA finding is exactly the patient in whom the
    2026 series found NDUFAF8.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 25% of cases have mitochondrial DNA mutations, while a
      further ∼25% have mutations in a nuclear subunit or in one of nine known
      assembly factors.
    explanation: >-
      Quantifies the mitochondrial-genome arm of the differential.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients had no putative causative variants in the mitochondrial
      genome or in other nuclear genes associated with OA (Fig. 1 and Table 1).
    explanation: >-
      The exclusion step that separates this nuclear entity from
      mitochondrial-DNA optic neuropathy in practice.
discussions:
- discussion_id: mc1dn34_two_phenotype_poles
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does the same gene, and in part the same allele, produce fatal infantile
    Leigh syndrome in one set of families and optic atrophy that is the whole
    disease in another?
  attaches_to:
  - "pathophysiology#Isolated Complex I Deficiency"
  - "pathophysiology#Retinal Ganglion Cell and Optic Nerve Degeneration"
  - "pathophysiology#Leigh-Syndrome Encephalopathy"
  rationale: >-
    This is the question the entity poses and the reason it is worth a separate
    entry rather than a line in a gene list. Three reports, ten patients, one gene,
    and outcomes at opposite ends of the mitochondrial-disease severity range.

    State the question precisely, because the obvious version of it is wrong. It
    is not "why the optic nerve in one cohort and the brain in the other": optic
    involvement was present in the severe cohort too, in at least two of its three
    subjects, as an uncited lead from the deep-research report committed with this
    entry records. The real question is why the same tissue vulnerability stops
    at the optic nerve in one set of families and extends to a fatal
    encephalopathy in the other.

    The obvious hypothesis is residual function: the Leigh families were compound
    heterozygous for the transcript-decay allele in trans with another pathogenic
    variant, whereas the optic-atrophy families were homozygous for either that
    allele or a targeting-sequence missense. If homozygosity for a hypomorphic
    allele leaves more residual NDUFAF8 than compound heterozygosity for two
    severe ones, a milder, tissue-restricted phenotype follows. The one
    quantitative hint that points that way is that complex I protein fell only
    moderately (mean fold change 0.73) in the optic-atrophy family, whereas the
    Leigh cohort had a complex I deficiency severe enough to be the presenting
    biochemical abnormality.

    Two things stop that from being an answer. First, the comparison crosses two
    laboratories, two assay types and two decades of methods, so a 0.73 fold
    change and "a complex I deficiency" are not commensurable measurements - and
    the residual-activity figures the deep-research report extracts from the 2020
    full text range from 3 percent to 47 percent *within* the severe cohort,
    which is a wider spread than any difference between the cohorts that has been
    demonstrated.
    Second, the 2026 series reports discordant phenotypes within a single family
    carrying the same allele, which no residual-function model explains. The
    authors attribute such variability to genetic modifiers and environmental
    exposure, as is invoked for LHON - which is a restatement of the problem
    rather than a solution to it.

    What would settle it is a single-laboratory comparison: complex I activity,
    assembly and NDUFAF8 abundance measured side by side in fibroblasts from a
    Leigh patient and an optic-atrophy patient. No such comparison has been
    published.
  proposed_experiments:
  - experiment_id: exp_mc1dn34_cross_cohort_biochemistry
    name: Side-by-side biochemical comparison of the two phenotype poles
    description: >-
      Measure complex I activity, assembled complex I amount, complexome profile
      and NDUFAF8 and NDUFAF5 abundance in the same laboratory, in fibroblasts
      from Leigh-syndrome and optic-atrophy patients carrying NDUFAF8 variants,
      including at least one patient homozygous and one compound heterozygous for
      c.195+271C>T. This tests whether the phenotype tracks residual complex I
      capacity or is independent of it.
- discussion_id: mc1dn34_import_pathway_is_untested_in_patients
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the two-step import-and-oxidation pathway described for NDUFAF8 in cell
    lines actually explain the effect of the patient targeting-sequence variant
    p.(L15R)?
  attaches_to:
  - "pathophysiology#Reduced NDUFAF8 Abundance in Mitochondria"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    mechanism is not missing - it is well worked out in a system that has never
    been connected to a patient.

    Cell-biological work establishes that NDUFAF8 carries a weak targeting
    sequence, is imported to the matrix through TIM23 by way of the
    intermembrane-space disulfide relay which oxidises it en route, and is
    surveyed at both stages by proteases - YME1L removing excess NDUFAF8 from the
    intermembrane space, CLPP degrading the reduced form in the matrix. The
    explicit conclusion is that NDUFAF8 can only do its job if both oxidation and
    matrix import work efficiently.

    That is a strikingly good fit for a patient variant in the targeting
    sequence, and the temptation is to say the two-step pathway explains
    p.(L15R). They have not been joined up. The import work was done in cultured
    cell lines with tagged constructs and does not involve the patient variant;
    the patient work is a structural prediction plus an indirect proteomic
    inference, and did not measure import. Nobody has assayed import, oxidation
    state or protease-dependent turnover of the p.(L15R) protein.

    The node is marked accordingly, and the causal edge into it is supported by
    evidence that includes the paper's own statement that NDUFAF8 was not
    detected in the proteomic batch.
  evidence:
  - reference: PMID:37159021
    reference_title: "A two-step mitochondrial import pathway couples the disulfide relay with matrix complex I biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, NDUFAF8 can only fulfil its function in complex I biogenesis if
      both oxidation in the IMS and subsequent matrix import work efficiently.
    explanation: >-
      The claim whose transfer to a patient is in question. It is a strong
      statement about NDUFAF8's dependence on import efficiency, made in cultured
      cells with tagged constructs and without reference to any disease allele -
      which is precisely the mismatch this discussion records.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the change is predicted to affect the MTS introducing a positive charge on
      the hydrophobic side of the amphipathic α-helix (Fig. 5D), possibly
      affecting NDUFAF8 import into the mitochondria.
    explanation: >-
      The patient-side half of the mismatch, and graded PARTIAL because of its
      own hedging: the effect on import is predicted from structure, not
      measured. Joining these two evidence items into a mechanism is exactly what
      nobody has done.
  proposed_experiments:
  - experiment_id: exp_mc1dn34_l15r_import_assay
    name: Test import and oxidation of the p.(L15R) targeting-sequence variant
    description: >-
      Compare mitochondrial import efficiency, redox state and protease-dependent
      turnover of wild-type and p.(L15R) NDUFAF8, in vitro and in cells, and ask
      whether inhibiting YME1L or CLPP rescues the mutant protein's abundance and
      the associated complex I assembly defect. A rescue would convert the
      import-pathway account of this allele from an inference into a mechanism -
      and would identify a protease as a candidate target.
- discussion_id: mc1dn34_no_treatment_or_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history of NDUFAF8 disease, and does anything change it?
  attaches_to:
  - "pathophysiology#Leigh-Syndrome Encephalopathy"
  - "pathophysiology#Retinal Ganglion Cell and Optic Nerve Degeneration"
  rationale: >-
    Two different absences here, and they should not be conflated.

    Treatment is thinly covered rather than absent, and the entry's
    `treatments:` block should be read for exactly what it says. A
    recommendation exists - the 2026 optic-atrophy series concludes that patients
    with nuclear complex I optic neuropathy may benefit from idebenone at LHON
    dosing - and it is curated. What does not exist is any outcome attributable
    to this genotype: no NDUFAF8 patient's treatment or response is individually
    reported anywhere, the cohort's own response figure of three in thirteen
    spans four genes, and nothing at all has been reported for the Leigh pole,
    where an optic-nerve-directed therapy would not touch the encephalopathy.
    The defining 2020 series records only supportive care and treats the
    lentiviral complementation as an experiment rather than a therapy.

    Natural history is not absent - it is not quotable. The defining paper does
    describe the course of its three subjects, and the deep-research report,
    which read it, records onset between three and fifteen months, an episodic
    course with regression after intercurrent illness, and outcomes: subject 1
    alive at two years, subject 2 dead at four years one month, subject 3 dead at
    eighteen months during a hypertensive crisis. These are recorded here as
    uncited leads, and there is no `progression:` block, because the paper's
    cached record is abstract-only and a deep-research report is a lead rather
    than a citable source. Do not read the missing block as saying the course is
    unknown; it is known and not quotable.

    The optic-atrophy cohort is better served than the Leigh one, though still
    only at cohort level. Its paper is cached as full text and describes the
    tempo: onset was either insidious during childhood or acute to subacute in
    young adulthood, resembling the course of Leber hereditary optic neuropathy.
    That is quoted in the phenotype block. What it does not give, and what a
    `progression:` block would need, is which of those two patterns the six
    NDUFAF8 patients followed - the sentence spans the whole thirty-one-patient
    series across eleven genes.

    Neither gap should be filled from the surrounding literature. Supportive
    management of Leigh syndrome and the Leigh-syndrome natural-history cohorts
    are plausible-looking imports, and each would attribute to ten NDUFAF8
    patients an experience recorded only in other people. The same caution
    applies to the LHON idebenone trial literature: the recommendation curated in
    `treatments:` is that literature applied to a class, and it must not be
    upgraded into a claim about response in this genotype.

    Closing both gaps needs no new science - a follow-up report on the existing
    patients would do it.
  proposed_experiments:
  - experiment_id: exp_mc1dn34_natural_history
    name: Longitudinal follow-up of the reported NDUFAF8 cohort
    description: >-
      Report age at onset, rate of visual and neurological decline, survival and
      any treatment exposure for the ten published NDUFAF8 patients, and query
      mitochondrial-disease and inherited-optic-neuropathy registries for further
      cases found by exome sequencing but never written up.
notes: >-
  What this entry deliberately does not contain, and why.

  There is no `progression:` block. Age of onset and clinical course are reported
  in the defining paper and simply cannot be quoted, because that paper's cached
  record is abstract-only; the values are recorded as uncited leads in an open
  discussion instead, which is not the same as saying the course is unknown.

  The `treatments:` block holds one entry and it is deliberately narrow: a
  recommendation that patients with nuclear complex I optic neuropathy may
  benefit from idebenone, made by the 2026 series, with that series' own
  three-in-thirteen response figure attached as a qualification. No NDUFAF8
  patient's treatment or outcome is individually reported anywhere, and nothing
  is reported for the Leigh pole. The Leigh management literature and the LHON
  idebenone trial literature both offer ready-made content that would look right
  here; importing either would assert of these patients something recorded only
  of other people with other genotypes, and in the exported graph the borrowed
  annotation would be indistinguishable from an observed one.

  The `phenotypes:` block curates the Leigh diagnosis rather than a decomposition
  of it into HPO signs. The source states the diagnosis in all three subjects and
  separately defines the syndrome; it does not describe any individual child's
  imaging or development. Listing basal-ganglia lesions, developmental delay and
  loss of motor skills as separate observed phenotypes would convert a
  definitional statement into three clinical observations.

  On treating the two cohorts as one disease. The 2020 Leigh cohort and the 2026
  optic-atrophy cohort could have been curated as two entities. They are curated
  as one here for two reasons. They share the recurrent allele c.195+271C>T,
  which the 2026 paper explicitly identifies as previously reported in the Leigh
  families - a shared allele across two phenotypes is a range within one
  gene-defined entity, not two diseases. And they share the affected tissue: the
  deep-research report committed with this entry records optic atrophy, visual
  impairment, small optic nerves and nystagmus among the 2020 subjects, so the
  optic nerve is involved at both ends of the severity range rather than defining
  one end of it. The question that decision leaves open - what determines how far
  beyond the optic nerve the disease extends - is the entry's first discussion.

  On the treatment gap, stated the way it is actually true. There is no
  NDUFAF8-specific trial, and no per-patient treatment response is separable from
  the cohort data - the 2026 series' three-in-thirteen figure sits in a
  whole-cohort paragraph with the per-patient breakdown in a supplementary table
  that is not in the reference cache. So this entry does not claim that any
  individual NDUFAF8 patient received idebenone, or responded to it. What it
  claims is that idebenone is recommended for the gene class these patients
  belong to, with a stated mechanistic rationale, which is what the
  `treatments:` block records.

  On GeneReviews. PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum
  Overview") is the applicable chapter for the Leigh pole of this disease and is
  tagged in the top-level `references:` block, following the sibling entries
  MC1DN2 and MC1DN6. It is deliberately not cited as evidence anywhere: its
  cached record carries only the chapter's statement of purpose and no clinical
  content, so any snippet from it would attest to the chapter's aims rather than
  to a fact about NDUFAF8 disease.

  On the deep-research report. Several statements above are attributed to
  `research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_34-deep-research-falcon.md`,
  which is committed with this entry and had full-text access to the 2020 paper
  that the reference cache holds only as an abstract. Everything taken from it is
  labelled an uncited lead and appears only in prose - never in an evidence
  `snippet:`, a structured slot, or a phenotype binding. Its Named Entity
  Confusion preflight passes on the gene (NDUFAF8 mentioned 61 times, the next
  gene being its partner NDUFAF5 at 10); the preflight's one warning is that the
  report cites OMIM 256000, which is Leigh syndrome, the parent phenotype, rather
  than 618776 for this entity - an imprecision about nomenclature, not a
  different disease.

  On the mechanism chain. Two links in it are inferences rather than
  measurements, and both are marked. The step from the p.(L15R) targeting-sequence
  variant to reduced mitochondrial NDUFAF8 is a structural prediction supported
  by an indirect proteomic observation, since NDUFAF8 itself was not detected in
  the assay. The elegant two-step import pathway that would explain that step was
  worked out in cell lines and has never been tested on a patient variant; it is
  cited for what it establishes about the protein, and its untested relation to
  this disease is an open HUMAN_MODEL_MISMATCH discussion rather than a curated
  causal claim.

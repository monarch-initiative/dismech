      holocarboxylase synthetase (HCS) deficiency, all lead to deficiency of the
      4 biotin-dependent carboxylases
    explanation: >-
      The review identifies biotinidase and holocarboxylase synthetase
      deficiency as distinct inherited routes to the same biochemical pattern.
treatments:
- name: Oral biotin supplementation
  description: >-
    Lifelong oral free biotin is the disease-specific therapy for both profound
    and partial deficiency. Current GeneReviews dosing is 5-10 mg/day for
    profound deficiency and 2.5-10 mg/day for partial deficiency.
    Presymptomatic adherence prevents manifestations; established hearing loss,
    optic atrophy, or developmental impairment may not completely reverse.
  action_category: THERAPEUTIC

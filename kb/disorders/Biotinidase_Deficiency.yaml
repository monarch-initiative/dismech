genetic:
- name: BTD gene variants causing biotinidase deficiency
  gene_term:
    preferred_term: BTD
    term:
      id: hgnc:1122
      label: BTD
  variants:
  - name: c.1270G>C (p.Asp424His)
    description: >-
      This was the most frequent BTD variant in two Turkish cohorts. In one
      cohort, 97.3% of homozygotes had enzyme activity above 30%, so this
      genotype should not be equated automatically with biochemical partial
      deficiency without an activity assay. The cited studies use p.Asp424His;
      cross-cohort comparison requires normalization to a specified reference
      transcript and protein sequence. Regional frequency should not be
      generalized worldwide.
    evidence:
    - reference: PMID:39451125
      reference_title: "A retrospective study on biotinidase deficiency: analysis of the Eastern Anatolia region patient cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the most frequent variant was c.1270G > C | p.Asp424His. Biotinidase enzyme activity was above 30% in 97.3% of patients with a homozygous p.D424His mutation
      explanation: >-
        The regional cohort identifies D424H as frequent and, importantly,
        documents activity above the partial-deficiency range in most
        homozygotes.
    - reference: PMID:38141137
      reference_title: "Evaluation of clinical, laboratory, and molecular genetic features of patients with biotinidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The most common pathogenic variants were c.1270G > C (p.Asp424His), c.410G > A (p.Arg137His), and c.38_44delGCGCTGinsTCC (p.Cys13Phefs*36) in BTD gene
      explanation: Confirms D424H as the most common variant in a large Turkish cohort.
  - name: c.410G>A (p.Arg137His)
    description: >-
      This variant was among those associated with the largest enzyme-activity
      decreases and was enriched among neurologically symptomatic individuals
      in regional cohorts. Those associations are not deterministic for an
      individual patient.
    evidence:
    - reference: PMID:39451125
      reference_title: "A retrospective study on biotinidase deficiency: analysis of the Eastern Anatolia region patient cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The mutations that caused the most significant decrease in enzyme activity were c.410G > A p.Arg137His, c.38_delinsTCC p.Cys13phefs*36, and c.1535C > T p.Thr512Met
      explanation: Identifies R137H as causing significant enzyme activity reduction.
    - reference: PMID:38141137
      reference_title: "Evaluation of clinical, laboratory, and molecular genetic features of patients with biotinidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The c.410G > A and c.38_44delGCGCTGinsTCC variants were more common in the patients with neurological symptoms
      explanation: Links R137H variant to neurological presentation.
  - name: c.38_44delGCGCTGinsTCC (p.Cys13Phefs*36)
    description: >-
      This frameshift was associated with marked enzyme-activity reduction,
      neurologic manifestations, hearing loss, and optic atrophy in regional
      cohorts. The small numbers and inclusion of both homozygous and
      heterozygous observations limit individual prognostic prediction.
    evidence:
    - reference: PMID:39451125
      reference_title: "A retrospective study on biotinidase deficiency: analysis of the Eastern Anatolia region patient cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Hearing loss (4 patients) and optic atrophy (1 patient) were mainly observed in patients with the c.38_delinsTCC mutation (homozygous or heterozygous)
      explanation: Links this frameshift variant to severe sensory complications.
    - reference: PMID:38141137
      reference_title: "Evaluation of clinical, laboratory, and molecular genetic features of patients with biotinidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The c.410G > A and c.38_44delGCGCTGinsTCC variants were more common in the patients with neurological symptoms
      explanation: Confirms association of this variant with neurological symptoms in a large cohort.
  features: >-
    Biallelic pathogenic BTD variants reduce biotinidase enzyme activity.
    Clinical classification is anchored to measured residual enzyme activity:
    profound deficiency is below 10% and partial deficiency is 10%-30% of mean
    normal activity. Regional genotype-phenotype associations can support
    interpretation but do not replace biochemical confirmation.
  evidence:
  - reference: PMID:38141137
    reference_title: "Evaluation of clinical, laboratory, and molecular genetic features of patients with biotinidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two hundred forty-seven cases were included in the study who were admitted to the Department of Pediatric Metabolism
    explanation: Large cohort study providing comprehensive genotype-phenotype correlations in biotinidase deficiency.
  - reference: PMID:39451125
    reference_title: "A retrospective study on biotinidase deficiency: analysis of the Eastern Anatolia region patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study provides a detailed analysis of genetic diversity and clinical presentation in biotinidase deficiency cases in Eastern Anatolia, demonstrating the efficacy of biotin treatment
    explanation: Regional cohort study demonstrating genetic diversity and variant-phenotype relationships.
  - reference: ORPHA:79241
    reference_title: "Biotinidase deficiency (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BTD | biotinidase | hgnc:1122 | Disease-causing germline mutation(s) in"
    explanation: Orphanet confirms BTD as the disease-causing gene for biotinidase deficiency.
  - reference: CGGV:assertion_847f7f2b-575f-4a90-bf02-179d464e4841-2020-02-10T180000.000Z
    reference_title: "BTD / biotinidase deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BTD | HGNC:1122 | biotinidase deficiency | MONDO:0009665 | AR | Definitive"
    explanation: ClinGen classifies the BTD-biotinidase deficiency gene-disease relationship as definitive with autosomal recessive inheritance.
diagnosis:
- name: Serum or plasma biotinidase enzyme-activity assay
  description: >-
    Quantitative measurement of biotinidase activity in serum or plasma is the
    primary confirmatory biochemical test. Residual activity classifies
    profound deficiency below 10% and partial deficiency at 10%-30% of mean
    normal activity.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  markers: Biotinidase enzyme activity
  results: >-
    Deficient serum or plasma activity confirms the proximal enzyme defect and
    supplies the biochemical severity classification.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: detection of deficient biotinidase enzyme activity in serum/plasma
    explanation: >-
      Current GeneReviews identifies deficient serum/plasma enzyme activity as
      a diagnostic route.
- name: BTD molecular genetic testing
  description: >-
    Identification of biallelic pathogenic BTD variants establishes the
    molecular diagnosis and is particularly useful when enzyme results are
    ambiguous. Enzyme activity remains important for severity classification.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic BTD variants support the molecular diagnosis.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identification of biallelic pathogenic variants in BTD on molecular
      genetic testing when the results of enzymatic testing are ambiguous.
    explanation: >-
      Current GeneReviews defines molecular testing as a diagnostic route when
      enzyme testing is ambiguous.
- name: Newborn screening for biotinidase deficiency
  description: >-
    Newborn screening identifies affected infants before symptoms and should be
    followed by confirmatory serum/plasma enzyme activity testing, with
    molecular testing when biochemical results are ambiguous.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    A low screening biotinidase activity result triggers confirmatory
    biochemical and, when needed, molecular testing.
  evidence:
  - reference: PMID:37027963
    reference_title: "Biotinidase deficiency: What have we learned in forty years?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Newborn screening has had a major positive impact on the outcome of many individuals with BD
    explanation: >-
      The 1,113-person systematic review supports the clinical utility of
      newborn screening.
  - reference: PMID:38141137
    reference_title: "Evaluation of clinical, laboratory, and molecular genetic features of patients with biotinidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An analysis of the admission routes of all cases to our clinic revealed 89.5% NBS, 5.7% family screening, and 4.9% suspicious clinical findings suggestive of BD
    explanation: >-
      A 247-person cohort shows that screening was the predominant diagnostic
      route.

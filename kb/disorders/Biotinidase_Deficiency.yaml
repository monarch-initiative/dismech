prevalence:
- population: Newborn screening cohorts
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.637546
  notes: >-
    Newborn-screening studies place overall biotinidase deficiency incidence at
    roughly 1 in 60,000 births. A Paraná screening cohort found 1 affected
    infant in 62,500 births overall, with profound and partial deficiency each
    occurring in 1 in 125,000 births.
  evidence:
  - reference: PMID:2314964
    reference_title: "Screening for biotinidase deficiency in newborns: worldwide experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combined incidence of profound and partial deficiency was 1 case per 61,067 live births"
    explanation: >-
      This multicountry newborn-screening survey (~4.4 million newborns
      screened across 12 countries) provides a commonly cited combined
      incidence estimate for biotinidase deficiency.
  - reference: PMID:9713119
    reference_title: "[Prevalence study of biotinidase deficiency in newborns]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of 125,000 infants born in Paraná State was carried out to establish the prevalence of biotinidase deficiency. A simple colorimetric procedure was used to detect two infants with biotinidase deficiency (1:62,500), one of them with profound deficiency (1:125,000) and the other with partial deficiency (1:125,000) of the enzyme."
    explanation: >-
      This newborn-screening study independently supports an incidence near 1 in
      60,000 births and provides subtype-specific rates for profound and partial
      deficiency.
  - reference: ORPHA:79241
    reference_title: "Biotinidase deficiency (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1-9 / 100 000 | Worldwide | Prevalence at birth | PMID:1779651"
    explanation: Orphanet epidemiology data cites worldwide birth prevalence of 1-9 per 100,000 based on Wolf 1991 screening survey.
  - reference: PMID:1779651
    reference_title: "Worldwide survey of neonatal screening for biotinidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of combined profound and partial deficiency is 1:60,089 newborns (1:49,500 to 1:73,100)"
    explanation: Landmark worldwide screening survey of 8.5 million newborns establishing the 1:60,000 global incidence estimate.
progression:
- phase: Presymptomatic detection and prevention
  age_range: Newborn period onward
  notes: >-
    Individuals identified before symptoms and maintained on biotin are
    expected to develop normally without the untreated disease manifestations.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with biotinidase deficiency who are diagnosed before they
      have developed symptoms (e.g., by newborn screening) and who are treated
      with biotin have normal development.
    explanation: >-
      Current GeneReviews directly links presymptomatic diagnosis and biotin
      treatment to normal development.
- phase: Untreated symptomatic disease and residual injury
  age_range: Infancy through adulthood
  notes: >-
    Untreated profound deficiency can present from infancy through childhood;
    adolescents and adults may present with myelopathy and optic neuropathy.
    Metabolic, feeding, skin, and respiratory findings often respond promptly,
    whereas established hearing loss, optic atrophy, and developmental
    impairment may not fully reverse.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some symptoms, such as feeding issues, cutaneous manifestations, and
      respiratory issues, usually resolve with biotin therapy, whereas other
      manifestations presenting prior to biotin treatment, such as optic
      atrophy, hearing loss, and developmental delay, may improve but are
      usually not completely reversible with the initiation of biotin therapy.
    explanation: >-
      Current GeneReviews distinguishes reversible manifestations from commonly
      persistent sensory and developmental injury.

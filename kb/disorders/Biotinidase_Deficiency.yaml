name: Biotinidase Deficiency
category: Mendelian
creation_date: '2025-06-12T20:16:27Z'
synonyms:
- BTD deficiency
- Biotinidase deficiency, profound
- Biotinidase deficiency, partial
- Late-onset multiple carboxylase deficiency
- Juvenile-onset multiple carboxylase deficiency
description: >-
  Biotinidase deficiency is an autosomal recessive disorder of biotin recycling
  caused by biallelic pathogenic variants in BTD. Deficient biotinidase activity
  limits release of free biotin from biocytin and biotinyl-peptides, producing
  secondary functional deficiency of biotin-dependent carboxylases. Untreated
  profound deficiency can cause metabolic acidosis, organic aciduria, seizures,
  developmental impairment, neurocutaneous disease, hearing loss, and optic
  atrophy; partial deficiency may become symptomatic during physiologic stress.
  Newborn screening followed by lifelong oral free biotin prevents symptoms in
  presymptomatically treated individuals, while delayed treatment may leave
  irreversible auditory, visual, or developmental deficits.

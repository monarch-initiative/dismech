animal_models:
- species: Mus musculus
  genotype: Homozygous Btd null allele (Btd-/-)
  background: >-
    Congenic C57BL/6 background after ten backcross generations; animals remain
    asymptomatic on a biotin-replete standard diet and develop disease
    manifestations after a low- or biotin-deficient dietary challenge.
  category: Knockout, dietary challenge, and biotin rescue
  description: >-
    Btd-null mice lack detectable serum biotinidase activity. A
    biotin-deficient diet produces neurologic and cutaneous disease, secondary
    carboxylase deficiency, organic-acid abnormalities, and white-matter/axonal
    injury; pharmacologic biotin reverses many measured manifestations. The
    required dietary challenge is an important boundary on direct comparison
    with untreated human disease.
  associated_phenotypes:
  - Absent serum biotinidase activity
  - Neurological deficits
  - Cutaneous abnormalities and alopecia
  - Secondary carboxylase deficiency
  - Demyelination and axonal degeneration
  - Increased urinary 3-hydroxyisovaleric acid
  evidence:
  - reference: PMID:21051254
    reference_title: "Development and characterization of a mouse with profound biotinidase deficiency: a biotin-responsive neurocutaneous disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mouse has a null mutation that results in no detectable serum
      biotinidase activity or cross-reacting material to antibody prepared
      against biotinidase.
    explanation: The model publication directly defines the null genotype and enzyme phenotype.
  - reference: PMID:21051254
    reference_title: "Development and characterization of a mouse with profound biotinidase deficiency: a biotin-responsive neurocutaneous disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When fed a biotin-deficient diet these mice develop neurological and
      cutaneous symptoms, carboxylase deficiency, mild hyperammonemia, and
      exhibit increased urinary excretion of 3-hydroxyisovaleric acid and biotin
      and biotin metabolites.
    explanation: >-
      The dietary-challenge experiment directly documents the neurocutaneous
      and biochemical disease phenotype.
  - reference: PMID:22579707
    reference_title: Neurological deficits in mice with profound biotinidase deficiency are associated with demylination and axonal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the chimera with the gene knock-out was generated followed by initial
      backcross with C57BL/6 background mouse for 10 generations to obtain the
      biotinidase gene knock-out mouse with C57BL/6 genetic background.
    explanation: The model publication directly documents the congenic C57BL/6 background.
  - reference: PMID:22579707
    reference_title: Neurological deficits in mice with profound biotinidase deficiency are associated with demylination and axonal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      With biotin treatment, the symptomatic mice improved neurologically and
      the white matter abnormalities resolved.
    explanation: The rescue experiment supports biotin responsiveness of measured neurologic and white-matter abnormalities.
discussions:
- discussion_id: gap_human_sensory_injury_reversibility
  prompt: >-
    Which cellular events determine whether auditory, optic, and developmental
    injury remains reversible after biotin is started?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Central nervous system vulnerability and white matter injury
  - treatments#Oral biotin supplementation
  - animal_models#Mus musculus
  rationale: >-
    The knockout mouse shows rapid neurologic, myelin, and axonal recovery after
    biotin, whereas established hearing loss, optic atrophy, and developmental
    impairment in humans are commonly incomplete responders. The temporal and
    cell-type-specific transition to irreversible injury is not resolved by
    either evidence base.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      optic atrophy, hearing loss, and developmental delay, may improve but are
      usually not completely reversible with the initiation of biotin therapy.
    explanation: Current GeneReviews documents the human residual-injury boundary.
  - reference: PMID:22579707
    reference_title: Neurological deficits in mice with profound biotinidase deficiency are associated with demylination and axonal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      With biotin treatment, the symptomatic mice improved neurologically and
      the white matter abnormalities resolved.
    explanation: The mouse rescue exposes the difference from commonly persistent human sensory injury.
- discussion_id: gap_partial_deficiency_natural_history
  prompt: >-
    What is the untreated lifetime penetrance and stress-specific risk of
    biochemically confirmed partial biotinidase deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Partial biotinidase deficiency
  - treatments#Oral biotin supplementation
  rationale: >-
    Lifelong free biotin is the current recommendation and should not be
    withheld. However, widespread presymptomatic screening and treatment leave
    limited direct observation of the untreated partial-deficiency natural
    history, including which infections or physiologic stresses precipitate
    disease.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with partial biotinidase deficiency (10%-30% of mean normal
      serum biotinidase activity) may develop symptoms only when stressed, such
      as during infection.
    explanation: Current GeneReviews identifies stress-related expression without quantifying lifetime penetrance.
- discussion_id: gap_genotype_activity_classification
  prompt: >-
    How should transcript-specific BTD variant nomenclature and regional
    genotype associations be reconciled with measured enzyme-activity classes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#BTD gene variants causing biotinidase deficiency
  - diagnosis#Serum or plasma biotinidase enzyme-activity assay
  rationale: >-
    Severity is defined biochemically, while published cohorts use different
    variant numbering and show that a frequent homozygous genotype can retain
    activity above the partial-deficiency range. Harmonized transcript
    nomenclature and assay-aware interpretation are needed before using
    regional genotype associations prognostically.
  evidence:
  - reference: PMID:39451125
    reference_title: "A retrospective study on biotinidase deficiency: analysis of the Eastern Anatolia region patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biotinidase enzyme activity was above 30% in 97.3% of patients with a
      homozygous p.D424His mutation
    explanation: >-
      The cohort demonstrates why genotype alone cannot substitute for the
      biochemical severity threshold.

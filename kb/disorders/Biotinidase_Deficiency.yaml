review_notes: >-
  This entry is scoped to biallelic BTD-related biotinidase deficiency;
  holocarboxylase synthetase deficiency is a distinct inherited cause of
  multiple carboxylase deficiency. Profound and partial disease are
  biochemical residual-activity classes rather than genotype-defined subtypes;
  no distinct MONDO concepts were found for these classes, so subtype_term is
  intentionally omitted. Regional variant associations were retained only with
  cohort boundaries and do not replace enzyme testing. Orphanet frequencies
  describe the disease concept and should not be interpreted as frequencies
  among newborn-screened, presymptomatically treated individuals. The D2P
  audit surfaced additional findings such as diarrhea, hepatosplenomegaly, and
  more specific seizure or imaging terms; these were not bulk-imported without
  exact local evidence or where a broader supported phenotype was already
  present. Red-nucleus, Purkinje-cell, and auditory-brainstem localization
  mentioned in the research synthesis was not modeled because no exact
  quotable source text was available in the local reference cache.
  HP:0410145 is the closest available HPO mapping for decreased circulating
  biotinidase, but its label describes concentration while the diagnostic
  evidence measures enzyme activity; preferred_term therefore preserves
  "Decreased biotinidase activity," and a dedicated HPO activity term may
  warrant a future term request. No public disease-specific omics or phenotype
  dataset accession was identified in GEO, and no validated non-animal disease
  model was found, so datasets and experimental_models are intentionally
  omitted. Treatment outcome evidence is principally observational, but
  current guidance recommends lifelong oral free biotin for both profound and
  partial deficiency.

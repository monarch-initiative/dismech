has_subtypes:
- name: Profound biotinidase deficiency
  display_name: Profound biotinidase deficiency
  classification: residual_enzyme_activity
  description: >-
    Less than 10% of mean normal serum biotinidase activity. Untreated symptoms
    usually begin from the first week of life through childhood and can involve
    neurologic, cutaneous, auditory, visual, and metabolic systems.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms of untreated profound biotinidase deficiency (<10% mean normal
      serum biotinidase activity) usually appear between ages one week and ten
      years
    explanation: >-
      Current GeneReviews defines profound deficiency by residual activity and
      describes its untreated age range.
- name: Partial biotinidase deficiency
  display_name: Partial biotinidase deficiency
  classification: residual_enzyme_activity
  description: >-
    Ten to 30% of mean normal serum biotinidase activity. Affected individuals
    may remain asymptomatic and may manifest disease only during infection or
    other physiologic stress.
  evidence:
  - reference: PMID:20301497
    reference_title: Biotinidase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with partial biotinidase deficiency (10%-30% of mean normal
      serum biotinidase activity) may develop symptoms only when stressed, such
      as during infection.
    explanation: >-
      Current GeneReviews defines partial deficiency and bounds its
      stress-associated clinical expression.

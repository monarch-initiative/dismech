- name: FBN2 Heterozygous Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous rare FBN2 variants, the founding one being p.Glu1144Lys,
    in fibrillin-2, a structural glycoprotein of elastic microfibrils. The
    variants are predicted to disrupt fibrillin-2 function, but no study has
    measured the effect of p.Glu1144Lys on secretion, microfibril assembly or
    stability, so no functional impact category or activity modifier is
    recorded.

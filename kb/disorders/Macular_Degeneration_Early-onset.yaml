name: Macular Degeneration, Early-onset
creation_date: "2026-10-24T05:30:00Z"
category: Mendelian
synonyms:
- early-onset macular degeneration
- EOMD
- FBN2-related maculopathy
description: >-
  Early-onset macular degeneration (EOMD) is an autosomal dominant
  maculopathy attributed to heterozygous variants in FBN2, which encodes
  fibrillin-2, a glycoprotein of the elastic microfibrils of the
  extracellular matrix. The disease was defined in one two-generation family
  in which exome sequencing found the rare missense variant p.Glu1144Lys
  segregating with the maculopathy; further rare FBN2 variants predicted to
  disrupt function were found among 192 maculopathy patients. Fibrillin-2
  localizes to Bruch's membrane, the elastin-rich layer between the retinal
  pigment epithelium and the choriocapillaris, and its expression appears
  reduced in aging and age-related macular degeneration eyes. A common FBN2
  missense variant shows suggestive association with age-related macular
  degeneration, so the same gene is linked to Mendelian and complex forms of
  macular disease. How a heterozygous FBN2 variant damages the macula is not
  known; in mice, knocking down or blocking fibrillin-2 in the eye produces
  retinal degeneration. There is no disease-specific treatment.

  downstream:
  - target: Outer Retinal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mice, reducing or blocking fibrillin-2 in the eye leads to retinal
      degeneration with thinning of the outer nuclear layer and reduced ERG
      amplitudes. The intermediate steps are not known. Both mouse studies
      report increased retinal TGF-beta when fibrillin-2 is lost, but whether
      that increase drives the degeneration has not been tested (see
      discussions).
    evidence:
    - reference: PMID:35108420
      reference_title: Association between anti-fibrillin-2 protein induced retinal degeneration via intravitreous delivery and activated TGF-β signalling in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        our findings indicate that the intravitreous delivery of anti-FBN2 protein could induce retina degeneration in mice
      explanation: >-
        Blocking fibrillin-2 in the mouse eye causes retinal degeneration;
        indirect because the model is an antibody, not a heterozygous
        variant, and mice have no macula.
- name: Outer Retinal Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration of the outer retina, including the retinal pigment
    epithelium and photoreceptor layers, which in patients presents as a
    maculopathy. In fibrillin-2-deficient mice it appears as thinning of the
    whole retina and the outer nuclear layer with reduced ERG amplitudes.

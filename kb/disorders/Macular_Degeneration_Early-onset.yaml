    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The retina suffered markedly damage, and the thickness of whole retina and outer nuclear layer markedly thinned.
    explanation: >-
      Retinal and outer nuclear layer thinning after fibrillin-2 blockade in
      mice.
  - reference: PMID:37100863
    reference_title: Intravitreal injection of fibrillin 2 (Fbn2) recombinant protein for therapy of retinopathy in a retina-specific Fbn2 knock-down mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      showed multifocal, small to medium sized lesions at the layer of the retinal photoreceptors / retinal pigment epithelium
    explanation: >-
      After Fbn2 knockdown the lesions sit at the photoreceptor and retinal
      pigment epithelium layer, which is the outer retina this node binds.
  downstream:

  notes: >-
    The causal claim rests on one two-generation family in which
    p.Glu1144Lys segregates with the maculopathy (four affected members
    exome-sequenced, two further affected and one unaffected member
    Sanger-sequenced), plus rare FBN2 variants of predicted but unmeasured
    effect among 192 maculopathy patients. No ClinGen gene-disease validity
    record for FBN2 and this disease is in the local ClinGen cache, so no
    validity tier is recorded. FBN2 variants also cause congenital
    contractural arachnodactyly (Beals syndrome), a separate disease.

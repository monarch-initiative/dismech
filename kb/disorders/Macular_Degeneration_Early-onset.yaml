- name: Bruch's Membrane Elastic Microfibril Dysfunction
  biological_scale: TISSUE
  description: >-
    Proposed loss of fibrillin-2-containing elastic microfibrils in Bruch's
    membrane, the barrier between the retinal pigment epithelium and the
    choriocapillaris. The authors of the defining report interpret the
    genetics as evidence that elastin microfibers and Bruch's membrane
    maintain blood-retina homeostasis. The structure of Bruch's membrane in
    EOMD patients has not been reported.

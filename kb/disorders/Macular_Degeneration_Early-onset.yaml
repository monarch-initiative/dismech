      is expected to impair its elastic microfibril layer. The step has not
      been measured in carriers of the disease variant.
    evidence:
    - reference: PMID:24899048
      reference_title: Rare and common variants in extracellular matrix gene Fibrillin 2 (FBN2) are associated with macular degeneration.

animal_models:
- name: Retina-specific Fbn2 knockdown mouse
  species: Mouse
  genotype: Intravitreal AAV-sh-fbn2 (shRNA knockdown of Fbn2) in adult C57BL/6J mice
  publication: PMID:37100863
  description: >-
    Adult male mice given an intravitreal AAV expressing an Fbn2 shRNA
    develop an exudative retinopathy involving the deep retinal layers, with
    reduced axial length and reduced ERG amplitudes. Repeated intravitreal
    fibrillin-2 recombinant protein improved retinal thickness and ERG
    amplitude, most markedly at 0.75 micrograms.
  modeled_mechanisms:
  - target: Outer Retinal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Fbn2 knockdown in the adult mouse eye produces a retinopathy of the
      deep retinal layers with reduced ERG amplitudes, reversed by
      recombinant fibrillin-2.
    limitations: >-
      An acquired knockdown in adult wild-type mice, not a heterozygous
      germline missense variant, and mice have no macula. The retinopathy is
      described as exudative, which is not documented in EOMD patients.
    readouts:
    - name: ERG amplitude
      target: Outer Retinal Degeneration
      direction: DECREASED
      interpretation: Functional correlate of retinal degeneration after Fbn2 knockdown.
      evidence:
      - reference: PMID:37100863
        reference_title: Intravitreal injection of fibrillin 2 (Fbn2) recombinant protein for therapy of retinopathy in a retina-specific Fbn2 knock-down mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          developed an exudative retinopathy with involvement of the deep retinal layers, reduction in axial length and reduction in ERG amplitudes
        explanation: >-
          Reports the reduced ERG amplitude after knockdown.
    - name: Retinal thickness after recombinant fibrillin-2
      target: Outer Retinal Degeneration
      direction: RESTORED
      interpretation: Rescue arm; restoring fibrillin-2 protein reverses the retinal thinning caused by Fbn2 knockdown.
      evidence:
      - reference: PMID:37100863
        reference_title: Intravitreal injection of fibrillin 2 (Fbn2) recombinant protein for therapy of retinopathy in a retina-specific Fbn2 knock-down mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          After three intravitreal injections of the fbn2 recombinant protein, the mean retinal thickness was significantly larger in the eyes with the intravitreal injection of the fbn2 recombinant protein
        explanation: >-
          Retinal thickness recovers after recombinant fibrillin-2 compared
          with untreated knockdown eyes.
    evidence:
    - reference: PMID:37100863
      reference_title: Intravitreal injection of fibrillin 2 (Fbn2) recombinant protein for therapy of retinopathy in a retina-specific Fbn2 knock-down mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The observations suggest that intravitreally applied fbn2 recombinant protein reversed the retinopathy caused by an fbn2 knockdown.
      explanation: >-
        Fbn2 loss is sufficient for retinopathy in this model and is
        reversed by restoring the protein.
- name: Intravitreal anti-fibrillin-2 mouse
  species: Mouse
  genotype: Wild-type mice given weekly intravitreal anti-FBN2 protein for three weeks
  publication: PMID:35108420
  description: >-
    Intravitreal anti-FBN2 injection produced large patchy yellow-white
    degenerative regions and pigmentation in the fundus, with thinning of the
    whole retina and outer nuclear layer, reduced FBN2 expression and
    increased TGF-beta 1, 2 and 3.
  modeled_mechanisms:
  - target: Outer Retinal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Blocking fibrillin-2 in the eye produces fundus degeneration and outer
      nuclear layer thinning.
    limitations: >-
      Antibody blockade in wild-type mice, not a germline variant; mice have
      no macula, and the short time course does not model an adult-onset
      dominant disease.
    evidence:
    - reference: PMID:35108420
      reference_title: Association between anti-fibrillin-2 protein induced retinal degeneration via intravitreous delivery and activated TGF-β signalling in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        there were a large patchy yellow white degeneration region and numerous pigmentations in the retina in anti-FBN2-treated mice
      explanation: >-
        Fundus degeneration after fibrillin-2 blockade.
discussions:
- discussion_id: eomd_fbn2_variant_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a heterozygous FBN2 missense variant cause macular degeneration,
    and is the increase in retinal TGF-beta seen after fibrillin-2 loss in
    mice a cause of the degeneration or a bystander?
  attaches_to:
  - pathophysiology#FBN2 Heterozygous Missense Variant
  - pathophysiology#Bruch's Membrane Elastic Microfibril Dysfunction
  rationale: >-
    The human evidence is one family and variants of predicted effect, and
    the mechanism is inferred from fibrillin-2 localizing to Bruch's
    membrane. Both mouse models remove or block fibrillin-2 rather than
    express a disease variant. They agree on TGF-beta: anti-FBN2 blockade
    raised retinal TGF-beta 1-3 alongside degeneration, and Fbn2 knockdown
    raised retinal TGF-beta1 and LTBP-1 mRNA and protein, which fell again
    after recombinant fibrillin-2 rescue. Neither study blocked TGF-beta to
    test whether the increase causes the degeneration, neither measured
    Bruch's membrane structure, and the abstract of the knockdown study
    describes the TGF-beta1 and LTBP-1 change in the rescue arm as an
    increase, which its own Results contradict.
  proposed_experiments:
  - experiment_id: eomd_fbn2_e1144k_microfibril_assembly
    name: Microfibril assembly by FBN2 p.Glu1144Lys
    description: >-
      Express wild-type and p.Glu1144Lys fibrillin-2 in RPE or fibroblast
      cultures and compare secretion, incorporation into microfibrils and
      LTBP binding.
    decision_criterion: >-
      Reduced secretion or microfibril incorporation of the variant, or a
      dominant-negative effect on wild-type assembly, would support the
      variant impairing Bruch's membrane microfibrils.
    would_support:
    - pathophysiology#FBN2 Heterozygous Missense Variant
  evidence:
  - reference: PMID:35108420
    reference_title: Association between anti-fibrillin-2 protein induced retinal degeneration via intravitreous delivery and activated TGF-β signalling in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      the association between the retinal degeneration resulting from the abnormality of FBN2 and the activation of TGF-β signalling has not been fully addressed
    explanation: >-
      States that the TGF-beta link is unresolved.
  - reference: PMID:37100863
    reference_title: Intravitreal injection of fibrillin 2 (Fbn2) recombinant protein for therapy of retinopathy in a retina-specific Fbn2 knock-down mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the mRNA expression of endogenous of TGF-β1 and LTBP-1 was significantly higher in the eyes with the intravitreal injection of AAV-sh-fbn2
    explanation: >-
      From the Results: Fbn2 knockdown raised retinal TGF-beta1 and LTBP-1
      mRNA, the same direction as the anti-FBN2 blockade study.
datasets: []
notes: >-
  The human evidence for this disease is a single family plus a sequencing
  screen of 192 maculopathy patients; no prevalence figure exists. The
  defining human report (PMID:24899048) is cached as an abstract only, so
  detailed fundus, imaging and age at onset findings for the family are not
  recorded here. A common FBN2
  variant, rs154001 (p.Val965Ile), shows suggestive association with
  age-related macular degeneration in the same report; that is a complex
  trait and belongs to the Age_Related_Macular_Degeneration entry.

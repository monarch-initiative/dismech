    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Outer retinal degeneration centred on the macula is the clinical
      maculopathy of EOMD. No source describes the macular lesion in
      patients, so this edge carries no evidence.

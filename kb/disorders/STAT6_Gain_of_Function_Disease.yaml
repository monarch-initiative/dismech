treatments:
- name: Dupilumab
  description: >-
    The anti-IL-4Ra monoclonal antibody dupilumab blocks IL-4/IL-13 signaling
    upstream of STAT6 and was highly effective in STAT6 GOF disease, improving
    both clinical manifestations and immunological biomarkers.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dupilumab
      term:
        id: NCIT:C162455
        label: Dupilumab
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Precision treatment with the anti-IL-4Rα antibody, dupilumab, was highly
      effective improving both clinical manifestations and immunological
      biomarkers.
    explanation: Documents dupilumab as an effective precision therapy.
  target_mechanisms:
  - target: Constitutive STAT6 signaling
    treatment_effect: INHIBITS
    description: >-
      Blocking the shared IL-4Ra chain reduces IL-4/IL-13-driven input into the
      hyperresponsive STAT6 pathway.
- name: JAK inhibitor (ruxolitinib)
  description: >-
    The JAK1/2 inhibitor ruxolitinib reversed STAT6 hyperresponsiveness to IL-4,
    normalized TH1/TH17 cells, suppressed eosinophilia, and improved atopic
    dermatitis, and JAK inhibition is proposed as an effective targeted treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  evidence:
  - reference: PMID:36758835
    reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with the Janus kinase 1/2 inhibitor ruxolitinib reversed STAT6
      hyperresponsiveness to IL-4, normalized TH1 and TH17 cells, suppressed the
      eosinophilia, and improved the patient's atopic dermatitis.
    explanation: Documents ruxolitinib efficacy targeting the STAT6 signaling axis.
  target_mechanisms:
  - target: Constitutive STAT6 signaling
    treatment_effect: INHIBITS
    description: >-
      JAK1/2 inhibition blocks the kinases upstream of STAT6, reducing STAT6
      phosphorylation and downstream type 2 signaling.

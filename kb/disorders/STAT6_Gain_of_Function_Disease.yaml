      Establishes STAT6 heterozygous GOF variants as the cause of a novel
      autosomal dominant allergic disorder.
  - reference: PMID:37316763
    reference_title: "Autosomal Dominant STAT6 Gain of Function Causes Severe Atopy Associated with Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel heterozygous germline mutation STAT6 c.1255G > C,
      p.D419H leading to overactivity of IL-4 JAK/STAT signalling pathway, in a
      kindred affected by early-onset atopic dermatitis, food allergy,
      eosinophilic asthma, anaphylaxis and follicular lymphoma.
    explanation: >-
      Independent kindred confirming a recurrent DNA-binding-domain variant
      (p.D419H) as a germline GOF cause of the disease.
  - reference: PMID:40502541
    reference_title: "STAT6 gain-of-function disease: p.D519N is a new disease-causing variant that responds well to dupilumab treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case report presents a new genetic variant that causes STAT6
      gain-of-function disease in 2 patients, expands the clinical phenotype of
      STAT6 gain-of-function disease
    explanation: >-
      Independent report of an additional disease-causing variant (p.D519N),
      broadening the allelic spectrum.

  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      Corrected from `immune dysregulation` (2026-08-20). The IUIS 2024 update
      places STAT6 GOF in Table 2, subtable 1 — combined immunodeficiencies
      with syndromic features — not Table 4. The earlier assignment read the
      disease's dominant allergic/type-2 dysregulation phenotype as a Table 4
      signal, but IUIS groups it with the hyper-IgE-like syndromic entities
      alongside dominant-negative STAT3, where an immune defect is inseparable
      from a broader syndromic presentation. The phenotype description is
      unchanged; only the table assignment is.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Combined immunodeficiencies with syndromic features: IKZF2 (dominant
        negative); GINS4, SLC19A1, SGPL1, FLT3L, ITPR3, RECQL4 (AR LOF); PTCRA
        (AR LOF/hypomorphic); SMAD3 (AD); and STAT6 (AD GOF)
      explanation: >-
        The IUIS Expert Committee's own enumeration of gene defects new since
        the 2022 update lists STAT6 (AD GOF) under "combined immunodeficiencies
        with syndromic features", which the same sentence identifies as Table 2,
        subtable 1.

notes: >-
  Initial curation from the founding STAT6 GOF disease literature (Sharma et al.
  JEM 2023; Baris et al. JACI 2023; Suratannon et al. JACI 2023) plus the STAT6
  GOF International Consortium review. Emphasizes the STAT6 GOF -> constitutive
  type 2 signaling -> TH2 skewing -> IgE/eosinophil effector -> multisystem
  allergic disease axis and the dupilumab / JAK-inhibitor targeted treatments.

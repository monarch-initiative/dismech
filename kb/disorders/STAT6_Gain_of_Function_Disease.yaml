- hyper-IgE syndrome
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    STAT6 GOF disease follows an autosomal dominant inheritance pattern from
    monoallelic (heterozygous) STAT6 variants; cases are either de novo/sporadic
    or transmitted through affected kindreds.
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cases were either sporadic (seven kindreds) or followed an autosomal
      dominant inheritance pattern (three kindreds).
    explanation: >-
      Documents both sporadic/de novo and autosomal dominant transmission of
      heterozygous STAT6 GOF variants across the discovery cohort.
pathophysiology:
- name: STAT6 gain-of-function variant
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous rare variants in STAT6 (most in the DNA-binding
    domain, e.g. p.E372K, p.E377K) confer a gain of function: the mutant
    transcription factor shows increased DNA-binding affinity, a strong
    preference for nuclear localization, and spontaneous transcriptional
    activity.
  genes:
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients carried monoallelic rare variants in STAT6 and functional
      studies established their gain-of-function (GOF) phenotype with sustained
      STAT6 phosphorylation, increased STAT6 target gene expression, and TH2
      skewing.
    explanation: >-
      Establishes monoallelic STAT6 variants with a functionally validated
      gain-of-function phenotype as the causal lesion.
  - reference: PMID:36216080
    reference_title: "A germline STAT6 gain-of-function variant is associated with early-onset allergies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a heterozygous missense variant (c.1129G>A;p.Glu377Lys) in
      the DNA binding domain of STAT6 that was de novo in the index patient's
      father and was inherited by 2 of his 3 children.
    explanation: >-
      Localizes a representative GOF variant to the STAT6 DNA-binding domain.
  downstream:
  - target: Constitutive STAT6 signaling
    description: >-
      GOF variants drive sustained/spontaneous STAT6 pathway activation
      independent of, and hyperresponsive to, upstream IL-4/IL-13 cytokine input.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36216080
      reference_title: "A germline STAT6 gain-of-function variant is associated with early-onset allergies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A germline STAT6 gain-of-function variant results in spontaneous
        activation of the STAT6 signaling pathway and is associated with an
        early-onset and severe allergic phenotype in humans.
      explanation: >-
        Links the GOF variant directly to spontaneous activation of STAT6
        signaling.
- name: Constitutive STAT6 signaling
  biological_scale: MOLECULAR
  description: >-
    STAT6 is the central transcription factor of the type 2 cytokine (IL-4/IL-13)
    response. GOF variants produce sustained basal and cytokine-induced STAT6
    phosphorylation and increased target-gene transcription, amplifying the
    allergic-inflammation program.
  biological_processes:
  - preferred_term: interleukin-4-mediated signaling pathway
    term:
      id: GO:0035771
      label: interleukin-4-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAT6 (signal transducer and activator of transcription 6) is a
      transcription factor that plays a central role in the pathophysiology of
      allergic inflammation.
    explanation: >-
      Establishes STAT6 as the central signaling node whose constitutive
      activity drives the disease.
  - reference: PMID:36758835
    reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation augmented both basal and cytokine-induced STAT6
      phosphorylation without affecting dephosphorylation kinetics.
    explanation: >-
      Documents increased basal and cytokine-induced STAT6 phosphorylation as
      the proximal signaling abnormality.
  downstream:
  - target: TH2 immune skewing
    description: >-
      Hyperactive STAT6 signaling skews CD4+ T-cell differentiation toward the
      TH2 program while suppressing TH1 and TH17 responses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36758835
      reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Naive lymphocytes from the affected patient displayed increased TH2- and
        suppressed TH1- and TH17-cell responses.
      explanation: >-
        Links constitutive STAT6 activity to TH2 skewing with reciprocal TH1/TH17
        suppression.
- name: TH2 immune skewing
  biological_scale: CELLULAR
  description: >-
    Constitutive STAT6 activity biases naive CD4+ T cells toward TH2
    differentiation with elevated peripheral TH2 lymphocytes, producing the IL-4/
    IL-5/IL-13-dominated milieu that underlies allergic effector disease.
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:36216080
    reference_title: "A germline STAT6 gain-of-function variant is associated with early-onset allergies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Higher levels of peripheral blood TH2 lymphocytes were detected.
    explanation: >-
      Documents increased peripheral TH2 lymphocytes as the cellular readout of
      STAT6-driven skewing.
  downstream:
  - target: IgE class switching and hypereosinophilia
    description: >-
      TH2 cytokines drive B-cell IgE class switching and eosinophil expansion,
      the humoral and cellular effector arms of the allergic phenotype.
    causal_link_type: DIRECT
  - target: Impaired antimicrobial immunity
    description: >-
      Reciprocal suppression of TH1/TH17 responses contributes to recurrent and
      severe infection susceptibility in some patients.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - TH1 response suppression
    - TH17 response suppression
    evidence:
    - reference: PMID:36758835
      reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Naive lymphocytes from the affected patient displayed increased TH2- and
        suppressed TH1- and TH17-cell responses.
      explanation: >-
        TH1/TH17 suppression provides a mechanistic basis for impaired
        antimicrobial defense.

    STAT6 hyperresponsiveness to IL-4, normalized TH1/TH17 cells, suppressed
    eosinophilia, and improved atopic dermatitis; the consortium review names
    both ruxolitinib and tofacitinib as JAK inhibitors used in patients.
  therapeutic_modality: SMALL_MOLECULE

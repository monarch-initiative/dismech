name: STAT6 Gain-of-Function Disease
creation_date: "2026-07-29T00:00:00Z"
category: Mendelian
description: >-
  STAT6 gain-of-function (GOF) disease is a recently described autosomal
  dominant inborn error of immunity caused by germline heterozygous
  gain-of-function variants in STAT6, the transcription factor downstream of the
  type 2 cytokines IL-4 and IL-13. GOF variants (predominantly in the DNA-binding
  domain) cause constitutive/hyperresponsive STAT6 signaling with sustained
  phosphorylation, increased target-gene expression, and TH2 skewing, producing a
  profound early-life multisystem allergic phenotype: treatment-resistant atopic
  dermatitis, marked hypereosinophilia with eosinophilic gastrointestinal
  disease, asthma, very high serum IgE, IgE-mediated food allergy, and
  anaphylaxis, with variable susceptibility to infection. It is catalogued in
  OMIM as hyper-IgE syndrome 6 (HIES6). Type 2-directed therapy (the anti-IL-4Ra
  antibody dupilumab) and JAK inhibition (ruxolitinib) are effective targeted
  treatments.
disease_term:
  preferred_term: STAT6 gain-of-function disease
  term:
    id: MONDO:0957807
    label: hyper-IgE syndrome 6, autosomal dominant, with recurrent infections
synonyms:
- STAT6-GOF
- STAT6 GOF disease
- Hyper-IgE syndrome 6
- HIES6
- Autosomal dominant allergic disorder due to STAT6 gain-of-function
- Early-onset multisystem allergic disease with STAT6 gain-of-function
parents:
- hereditary disease

name: STAT6 Gain-of-Function Disease
creation_date: "2026-07-29T00:00:00Z"
category: Mendelian
description: >-
  STAT6 gain-of-function (GOF) disease is a recently described autosomal
  dominant inborn error of immunity caused by germline heterozygous
  gain-of-function variants in STAT6, the transcription factor downstream of the
  type 2 cytokines IL-4 and IL-13. GOF variants (predominantly in the DNA-binding
  domain) cause constitutive/hyperresponsive STAT6 signaling with sustained
  phosphorylation, increased target-gene expression, and TH2 skewing, producing a
  profound early-life multisystem allergic phenotype: treatment-resistant atopic
  dermatitis, marked hypereosinophilia with eosinophilic gastrointestinal
  disease, asthma, very high serum IgE, IgE-mediated food allergy, and
  anaphylaxis, with variable susceptibility to infection. It is catalogued in
  OMIM as hyper-IgE syndrome 6 (HIES6). Type 2-directed therapy (the anti-IL-4Ra
  antibody dupilumab) and JAK inhibition (ruxolitinib) are effective targeted
  treatments.
disease_term:
  preferred_term: STAT6 gain-of-function disease
  term:
    id: MONDO:0957807
    label: hyper-IgE syndrome 6, autosomal dominant, with recurrent infections
synonyms:
- STAT6-GOF
- STAT6 GOF disease
- Hyper-IgE syndrome 6
- HIES6
- Autosomal dominant allergic disorder due to STAT6 gain-of-function
- Early-onset multisystem allergic disease with STAT6 gain-of-function
parents:
- hereditary disease
- inborn error of immunity
- hyper-IgE syndrome
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    STAT6 GOF disease follows an autosomal dominant inheritance pattern from
    monoallelic (heterozygous) STAT6 variants; cases are either de novo/sporadic
    or transmitted through affected kindreds. Penetrance is complete, with
    variable expressivity.
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cases were either sporadic (seven kindreds) or followed an autosomal
      dominant inheritance pattern (three kindreds).
    explanation: >-
      Documents both sporadic/de novo and autosomal dominant transmission of
      heterozygous STAT6 GOF variants across the discovery cohort.
  - reference: PMID:38238227
    reference_title: "Human germline gain-of-function in STAT6: from severe allergic disease to lymphoma and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAT6-GOF disease demonstrated complete penetrance, although some clinical
      variability
    explanation: >-
      The consortium review reports complete penetrance with clinical
      variability (variable expressivity).
pathophysiology:
- name: STAT6 gain-of-function variant
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous rare variants in STAT6 (most in the DNA-binding
    domain, e.g. p.E372K, p.E377K) confer a gain of function: the mutant
    transcription factor shows increased DNA-binding affinity, a strong
    preference for nuclear localization, and spontaneous transcriptional
    activity.
  genes:
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: INCREASED
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients carried monoallelic rare variants in STAT6 and functional
      studies established their gain-of-function (GOF) phenotype with sustained
      STAT6 phosphorylation, increased STAT6 target gene expression, and TH2
      skewing.
    explanation: >-
      Establishes monoallelic STAT6 variants with a functionally validated
      gain-of-function phenotype as the causal lesion.
  - reference: PMID:36216080
    reference_title: "A germline STAT6 gain-of-function variant is associated with early-onset allergies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a heterozygous missense variant (c.1129G>A;p.Glu377Lys) in
      the DNA binding domain of STAT6 that was de novo in the index patient's
      father and was inherited by 2 of his 3 children.
    explanation: >-
      Localizes a representative GOF variant to the STAT6 DNA-binding domain.
  downstream:
  - target: Constitutive STAT6 signaling
    description: >-
      GOF variants drive sustained/spontaneous STAT6 pathway activation
      independent of, and hyperresponsive to, upstream IL-4/IL-13 cytokine input.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36216080
      reference_title: "A germline STAT6 gain-of-function variant is associated with early-onset allergies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A germline STAT6 gain-of-function variant results in spontaneous
        activation of the STAT6 signaling pathway and is associated with an
        early-onset and severe allergic phenotype in humans.
      explanation: >-
        Links the GOF variant directly to spontaneous activation of STAT6
        signaling.
- name: Constitutive STAT6 signaling
  conforms_to: "jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation"
  biological_scale: MOLECULAR
  description: >-
    STAT6 is the central transcription factor of the type 2 cytokine (IL-4/IL-13)
    response. GOF variants produce sustained basal and cytokine-induced STAT6
    phosphorylation and increased target-gene transcription, amplifying the
    allergic-inflammation program.
  biological_processes:
  - preferred_term: interleukin-4-mediated signaling pathway
    term:
      id: GO:0035771
      label: interleukin-4-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:36884218
    reference_title: "Human germline heterozygous gain-of-function STAT6 variants cause severe allergic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAT6 (signal transducer and activator of transcription 6) is a
      transcription factor that plays a central role in the pathophysiology of
      allergic inflammation.
    explanation: >-
      Establishes STAT6 as the central signaling node whose constitutive
      activity drives the disease.
  - reference: PMID:36758835
    reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation augmented both basal and cytokine-induced STAT6
      phosphorylation without affecting dephosphorylation kinetics.
    explanation: >-
      Functional assay of the mutated STAT6 protein documents increased basal and
      cytokine-induced STAT6 phosphorylation as the proximal signaling
      abnormality.
  - reference: PMID:40603028
    reference_title: "[Mechanism of pathogenesis by a gain-of-function variant of STAT6 causing severe allergic diseases and potential for development of molecularly targeted drugs]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      even in the absence of IL-4 stimulation, we observed the translocation of
      mutant STAT6 in its unphosphorylated state, which activated gene
      expression.
    explanation: >-
      Documents ligand- and phosphorylation-independent nuclear translocation of
      the D419N mutant, the most constitutive form of the signaling defect.
  - reference: PMID:40603028
    reference_title: "[Mechanism of pathogenesis by a gain-of-function variant of STAT6 causing severe allergic diseases and potential for development of molecularly targeted drugs]."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant STAT6 knock-in mice elicited an abnormal TH2-dominant immune
      response in vivo, with findings similar to those observed in patients.
    explanation: >-
      A patient-derived D419N knock-in mouse recapitulates the human TH2/allergic
      phenotype, validating the causal mechanism in vivo.
  - reference: PMID:28653395
    reference_title: "Poly-ADP ribose polymerase-14 limits severity of allergic skin disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice that express constitutively active Stat6 in T cells (Stat6VT) and
      develop spontaneous inflammation of the skin
    explanation: >-
      An independent constitutively active STAT6 mouse model (Stat6VT) develops
      spontaneous allergic skin inflammation, corroborating that constitutive
      STAT6 activity drives atopic disease.
  downstream:
  - target: TH2 immune skewing
    description: >-
      Hyperactive STAT6 signaling skews CD4+ T-cell differentiation toward the
      TH2 program while suppressing TH1 and TH17 responses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36758835
      reference_title: "Severe allergic dysregulation due to a gain of function mutation in the transcription factor STAT6."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Naive lymphocytes from the affected patient displayed increased TH2- and
        suppressed TH1- and TH17-cell responses.
      explanation: >-
        Links constitutive STAT6 activity to TH2 skewing with reciprocal TH1/TH17
        suppression.
  - target: B-cell lymphoma predisposition
    description: >-
      Constitutive STAT6 activity is oncogenic in the B-cell lineage: the same
      DNA-binding-domain residues mutated in the germline (notably D419) are
      recurrently mutated somatically in follicular lymphoma, predisposing to
      B-cell lymphomagenesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38238227
      reference_title: "Human germline gain-of-function in STAT6: from severe allergic disease to lymphoma and beyond."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        STAT6 is frequently and recurrently mutated in follicular lymphomas and
        other B cell lymphomas
      explanation: >-
        The shared STAT6 mutational spectrum between germline GOF disease and
        somatic follicular lymphoma links constitutive STAT6 activity to
        lymphomagenesis.

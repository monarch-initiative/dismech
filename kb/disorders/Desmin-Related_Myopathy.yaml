- name: Cardiac device therapy (pacemaker / ICD)
  description: >-
    A permanent pacemaker for atrioventricular block and an implantable
    cardioverter-defibrillator for prevention of sudden death are mainstays of
    cardiac management. No NCIT clinical-action term for device implantation is
    reachable from the TreatmentActionTerm root (NCIT:C25218), so treatment_term
    is left unbound.
  therapeutic_modality: DEVICE
  target_phenotypes:
  - preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  evidence:
  - reference: PMID:34315782
    reference_title: Expanding Spectrum of Desmin-Related Myopathy, Long-term Follow-up, and Cardiac Transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complete atrioventricular block in 11 patients, all of whom required a permanent pacemaker"
    explanation: Pacemaker implantation was required for AV block in the series.
- name: AAV9-desmin gene transfer (experimental)
  description: >-
    Preclinical gene transfer of wild-type desmin rescues cardiac function in
    desmin-null mice, so it is plausible for recessive null disease; it is
    untested in humans and expected to be ineffective, or harmful, in
    dominant-negative disease.
  therapeutic_modality: GENE_THERAPY
  evidence:
  - reference: PMID:27101257
    reference_title: AAV9-mediated gene transfer of desmin ameliorates cardiomyopathy in desmin-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "improved systolic left-ventricular function when compared with control vector-treated DES-KO mice"
    explanation: AAV-desmin improved cardiac function in desmin-null mice.
- name: Heart transplantation
  description: >-
    For end-stage heart failure, orthotopic cardiac transplantation is performed
    and is well tolerated, with improved cardiac function afterwards.
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:34315782
    reference_title: "Expanding Spectrum of Desmin-Related Myopathy, Long-term Follow-up, and Cardiac Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heart transplantation was tolerated with improved cardiac function and quality of life"
    explanation: Heart transplantation is used for end-stage cardiac disease and is well tolerated.
animal_models:
- name: R349P desmin knock-in mouse
  species: Mouse
  genotype: Des R349P knock-in (ortholog of human R350P)
  publication: PMID:25394388
  description: >-
    The R349P knock-in mouse models dominant, aggregate-forming desminopathy.
  modeled_mechanisms:
  - target: Myofibrillar Disintegration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Network disruption increases myofibrillar mechanical vulnerability, as in human disease.
    evidence:
    - reference: PMID:25394388
      reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "disruption of the extrasarcomeric intermediate filament network leads to increased mechanical vulnerability of muscle fibers"
      explanation: Reproduces the network-loss mechanism.
  - target: Desmin-Related Cardiomyopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The mouse develops dilated cardiomyopathy, arrhythmias and conduction defects.
    evidence:
    - reference: PMID:25394388
      reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "skeletal muscle weakness, dilated cardiomyopathy, as well as cardiac arrhythmias and conduction defects"
      explanation: Reproduces the cardioskeletal phenotype.
  evidence:
  - reference: PMID:25394388
    reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice develop age-dependent desmin-positive protein aggregation pathology, skeletal muscle weakness, dilated cardiomyopathy, as well as cardiac arrhythmias and conduction defects"
    explanation: Establishes the knock-in mouse as a dominant desminopathy model.
- name: Desmin-null mouse
  species: Mouse
  genotype: Des-null (knockout)
  publication: PMID:8794866
  description: >-
    The desmin knockout mouse models recessive loss-of-function (null)
    desminopathy.
  modeled_mechanisms:
  - target: Striated Muscle Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Null muscle shows architectural disruption and degeneration across muscle types.
    limitations: >-
      Models the recessive null spectrum, not the dominant-negative
      aggregate-forming disease.
    evidence:
    - reference: PMID:8794866
      reference_title: Disruption of muscle architecture and myocardial degeneration in mice lacking desmin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "severe disruption of muscle architecture and degeneration"
      explanation: Reproduces striated-muscle degeneration.
  - target: Desmin-Related Cardiomyopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Null mice develop cardiomyopathy, but through desmin absence rather than a dominant-negative aggregate mechanism.
    limitations: >-
      The null genotype recapitulates recessive disease; it does not reproduce
      the dominant-negative aggregate mechanism of most human cases.
    evidence:
    - reference: PMID:8794866
      reference_title: Disruption of muscle architecture and myocardial degeneration in mice lacking desmin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "these mice demonstrated a multisystem disorder involving cardiac, skeletal, and smooth muscle"
      explanation: Reproduces multisystem cardiac and skeletal involvement.
  evidence:
  - reference: PMID:8794866
    reference_title: Disruption of muscle architecture and myocardial degeneration in mice lacking desmin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these mice demonstrated a multisystem disorder involving cardiac, skeletal, and smooth muscle"
    explanation: Establishes the knockout as a recessive null desminopathy model.

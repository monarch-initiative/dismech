prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence rate is documented. Desminopathy is a minority of
    myofibrillar myopathies, and DES accounts for roughly 1-2% of dilated
    cardiomyopathy.
progression:
- phase: Subclinical carrier
  notes: >-
    An asymptomatic pathogenic-variant carrier, sometimes with subclinical
    myocardial fibrosis detectable on cardiac MRI.
- phase: Conduction disease and early distal weakness
  notes: >-
    Cardiac conduction disease and distal lower-limb weakness emerge, often in
    the 20s to 30s.
- phase: Cardiomyopathy and proximal spread
  notes: >-
    Cardiomyopathy develops and skeletal weakness spreads proximally and to
    respiratory muscles.
- phase: Advanced disease
  notes: >-
    Wheelchair dependence, ventilatory failure and end-stage heart disease
    requiring device therapy or transplantation.
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is confirmed by identifying pathogenic DES variants on molecular
    genetic testing; CRYAB is tested in parallel as the histological phenocopy.
  evidence:
  - reference: PMID:14724127
    reference_title: Desmin myopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Routine genetic testing of patients for mutations in desmin and alphaB- crystallin genes is now available and necessary for establishing an accurate diagnosis"
    explanation: Molecular testing of DES (and CRYAB) establishes the diagnosis.
- name: Muscle biopsy
  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle biopsy shows desmin-positive myofibrillar aggregates; in recessive
    loss-of-function disease the classical myofibrillar-myopathy pathology may be
    absent.
  evidence:
  - reference: PMID:14724127
    reference_title: Desmin myopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immuno-staining for desmin is positive in each region containing abnormal structures"
    explanation: Desmin-positive aggregates are the diagnostic biopsy finding.
  - reference: PMID:42753430
    reference_title: "Autosomal recessive desminopathy: an under-recognised disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "classical MFM histopathology may be absent"
    explanation: In recessive disease the hallmark biopsy pathology can be absent.
histopathology:
- name: Desmin-positive myofibrillar aggregates
  description: >-
    Granulofilamentous, desmin-positive aggregates with myofibrillar
    disorganization and amorphous material on Gomori trichrome. No NCIT or HP
    term specific to the desmin aggregate pattern is available, so finding_term is
    left unbound.
  diagnostic: true
  evidence:
  - reference: PMID:34315782
    reference_title: "Expanding Spectrum of Desmin-Related Myopathy, Long-term Follow-up, and Cardiac Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "amorphous material in Gomori trichrome-stained sections"
    explanation: The biopsy shows amorphous material on Gomori trichrome staining.

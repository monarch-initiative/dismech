name: Desmin-Related Myopathy
creation_date: "2026-10-29T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: desminopathy
  term:
    id: MONDO:0016187
    label: qualitative or quantitative defects of desmin
synonyms:
- desminopathy
- desmin myopathy
- desmin-related myopathy
- desmin-related myofibrillar myopathy
- myofibrillar myopathy 1
notes: >-
  Disease_term is MONDO:0016187 "qualitative or quantitative defects of desmin",
  the Orphanet-derived term for the whole DES allelic spectrum. The field treats
  desminopathy as a single cardioskeletal entity caused by DES, pooling its
  clinical forms in natural-history meta-analyses (PMID:20718792, PMID:39968648),
  so it is curated as one Disease with the recognised sub-entities (MFM1, CMD1I,
  Kaeser scapuloperoneal syndrome, LGMD1E) recorded as has_subtypes. "Qualitative"
  defects are the dominant rod-domain missense variants that poison filament
  assembly; "quantitative" defects are the biallelic loss-of-function variants of
  the recessive spectrum. CRYAB (alphaB-crystallin) disease is a histological
  phenocopy and is kept as a differential diagnosis, not a causal gene.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most desminopathy is autosomal dominant, frequently from de novo rod-domain
    missense variants acting dominant-negatively, with incomplete, age-dependent
    penetrance.
  evidence:
  - reference: PMID:20718792
    reference_title: Desmin-related myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "mainly caused by dominant mutations in the desmin gene"
    explanation: The meta-analysis identifies dominant DES mutations as the main cause.
  - reference: PMID:39968648
    reference_title: "Natural History, Phenotype Spectrum, and Clinical Outcomes of Desmin (DES)-Associated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Familial penetrance of cardiac disease was 63.6% among relatives with pathogenic/LP DES variants"
    explanation: Cardiac penetrance is incomplete (63.6%) among variant-carrying relatives.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Rarer biallelic loss-of-function (or hypomorphic) variants cause a distinct,
    often cardiac-sparing recessive spectrum in which classical myofibrillar
    aggregates may be absent.
  evidence:
  - reference: PMID:42753430
    reference_title: "Autosomal recessive desminopathy: an under-recognised disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive DES mutations generate a broad, distinct clinical spectrum compared with dominant MFM"
    explanation: Establishes a distinct recessive loss-of-function spectrum.
genetic:
- name: DES
  gene_term:
    preferred_term: DES
    term:
      id: hgnc:2770
      label: DES
  relationship_type: CAUSATIVE
  notes: >-
    Desmin is the muscle-specific type III intermediate filament protein that
    links Z-discs to each other, to the sarcolemma (costameres), the nucleus,
    mitochondria and, in the heart, the intercalated discs. Dominant rod-domain
    missense variants (hotspot coil 2B, around R350P) act dominant-negatively;
    biallelic loss-of-function variants cause the recessive spectrum.
  evidence:
  - reference: PMID:15800015
    reference_title: Pathogenic effects of a novel heterozygous R350P desmin mutation on the assembly of desmin intermediate filaments in vivo and in vitro.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "R350P desmin missense mutation, which resides in the evolutionary highly conserved coil 2B domain of the alpha-helical coiled-coil desmin rod domain"
    explanation: Locates the recurrent rod-domain missense hotspot in DES.
  - reference: PMID:25394388
    reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "the ortholog of the most frequently occurring human desmin missense mutation R350P"
    explanation: States that R350P is the most frequent human desmin missense mutation.
pathophysiology:
- name: DES Rod-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous rod-domain (usually coil 2B, e.g. R350P) missense variant in
    DES produces a mutant desmin that is still incorporated into heteropolymers
    with wild-type desmin.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: DES
    term:
      id: hgnc:2770
      label: DES
  molecular_functions:
  - preferred_term: structural constituent of cytoskeleton
    modifier: DECREASED
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  downstream:
  - target: Dominant-Negative Filament Assembly Failure
    description: Mutant desmin incorporated into heteropolymers blocks normal assembly.
  evidence:
  - reference: PMID:15800015
    reference_title: Pathogenic effects of a novel heterozygous R350P desmin mutation on the assembly of desmin intermediate filaments in vivo and in vitro.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "R350P desmin missense mutation, which resides in the evolutionary highly conserved coil 2B domain of the alpha-helical coiled-coil desmin rod domain"
    explanation: Identifies the rod-domain missense variant that initiates the disease.
- name: Dominant-Negative Filament Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    The mutant protein cannot form a desmin intermediate-filament network and
    blocks polymerization of wild-type desmin.
  biological_processes:
  - preferred_term: intermediate filament organization
    modifier: DECREASED
    term:
      id: GO:0045109
      label: intermediate filament organization
  downstream:
  - target: Extrasarcomeric Desmin Network Collapse
    description: Failed assembly leaves the extrasarcomeric desmin network unable to form.
  evidence:
  - reference: PMID:15800015
    reference_title: Pathogenic effects of a novel heterozygous R350P desmin mutation on the assembly of desmin intermediate filaments in vivo and in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R350P desmin is incapable of de novo formation of a desmin IF network"
    explanation: Transfection shows the mutant cannot build a desmin filament network.
- name: Extrasarcomeric Desmin Network Collapse
  biological_scale: CELLULAR
  description: >-
    Loss of the desmin filament network removes the scaffold that aligns and
    anchors myofibrils, organelles and nuclei in striated muscle.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Granulofilamentous Desmin Aggregation
    description: Misfolded desmin accumulates as granulofilamentous aggregates.
    hypothesis_groups:
    - aggregate_proteotoxicity
  - target: Myofibrillar Disintegration
    description: Loss of mechanical coupling destabilizes the myofibrillar apparatus.
    hypothesis_groups:
    - network_loss_mechanical_vulnerability
  - target: Mitochondrial Dysfunction
    description: Without desmin anchoring, mitochondria are mispositioned and damaged.
  evidence:
  - reference: PMID:23143191
    reference_title: "Desminopathies: pathology and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The intermediate filament protein desmin is an essential component of the extra-sarcomeric cytoskeleton in muscle cells"
    explanation: Establishes the extrasarcomeric desmin network whose loss is the central lesion.
- name: Granulofilamentous Desmin Aggregation
  biological_scale: CELLULAR
  description: >-
    Misfolded desmin forms granulofilamentous, desmin-positive aggregates that
    sequester partner proteins and create proteotoxic stress.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Impaired Protein Quality Control
    description: Aggregates overload and dysregulate the cell's protein quality-control systems.
    hypothesis_groups:
    - aggregate_proteotoxicity
  evidence:
  - reference: PMID:23143191
    reference_title: "Desminopathies: pathology and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The muscle pathology is characterized by desmin-positive protein aggregates and degenerative changes of the myofibrillar apparatus"
    explanation: Describes the hallmark desmin-positive aggregates.
- name: Impaired Protein Quality Control
  biological_scale: CELLULAR
  description: >-
    Mutant desmin aberrantly engages all major protein quality-control systems,
    raising proteasomal activity and macroautophagy and dysregulating
    chaperone-assisted selective autophagy.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: macroautophagy
    modifier: INCREASED
    term:
      id: GO:0016236
      label: macroautophagy
  downstream:
  - target: Striated Muscle Cell Degeneration
    description: Chronic proteostatic imbalance contributes to muscle-cell degeneration.
    hypothesis_groups:
    - aggregate_proteotoxicity
  evidence:
  - reference: PMID:30179276
    reference_title: Imbalances in protein homeostasis caused by mutant desmin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the presence of R349P mutant desmin causes a general imbalance in skeletal muscle protein homeostasis via aberrant activity of all major protein quality control systems"
    explanation: The R349P knock-in model shows imbalance across all protein quality-control systems.
- name: Myofibrillar Disintegration
  biological_scale: CELLULAR
  description: >-
    Loss of the desmin network increases the mechanical vulnerability of muscle
    fibres, producing Z-disc streaming and myofibrillar disintegration.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Striated Muscle Cell Degeneration
    description: Mechanically vulnerable, disorganized myofibrils degenerate under contraction.
    hypothesis_groups:
    - network_loss_mechanical_vulnerability
  evidence:
  - reference: PMID:25394388
    reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "disruption of the extrasarcomeric intermediate filament network leads to increased mechanical vulnerability of muscle fibers"
    explanation: The knock-in model shows network disruption drives mechanical fragility.
- name: Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Without desmin anchoring, mitochondria are mispositioned and structurally and
    functionally abnormal, with respiratory-chain deficits.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: ABNORMAL
    term:
      id: GO:0007005
      label: mitochondrion organization
  downstream:
  - target: Striated Muscle Cell Degeneration
    description: Bioenergetic failure contributes to muscle-cell degeneration.
  evidence:
  - reference: PMID:27393313
    reference_title: Mutant desmin substantially perturbs mitochondrial morphology, function and maintenance in skeletal muscle tissue.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the expression of mutant desmin causes disruption of the extrasarcomeric desmin cytoskeleton and extensive mitochondrial abnormalities"
    explanation: Mutant desmin produces extensive mitochondrial abnormalities.
- name: Striated Muscle Cell Degeneration
  biological_scale: CELLULAR
  description: >-
    Skeletal muscle fibres and cardiomyocytes degenerate through the converging
    aggregate-proteotoxicity, network-loss and mitochondrial routes.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Desmin-Related Cardiomyopathy
    description: Cardiomyocyte loss and remodeling produce cardiomyopathy.
  - target: Cardiac Conduction System Degeneration
    description: Degeneration of conduction-system myocytes produces conduction disease.
  - target: Distal lower limb muscle weakness
    description: Loss of skeletal muscle fibres produces distal-onset weakness.
  - target: Proximal muscle weakness
    description: Progressive fibre loss spreads to proximal muscles.
  - target: Respiratory insufficiency
    description: Diaphragmatic and intercostal involvement produces respiratory insufficiency.
  - target: Dysphagia
    description: Bulbar muscle involvement produces dysphagia in advanced disease.
  - target: Elevated creatine kinase
    description: Degenerating muscle fibres release creatine kinase into serum.
  evidence:
  - reference: PMID:8794866
    reference_title: Disruption of muscle architecture and myocardial degeneration in mice lacking desmin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "severe disruption of muscle architecture and degeneration"
    explanation: Desmin-null muscle shows architectural disruption and degeneration.
- name: Desmin-Related Cardiomyopathy
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    A cytoskeletal (desmin) primary insult to cardiomyocytes impairs contractile
    performance and drives maladaptive remodeling into dilated, restrictive,
    arrhythmogenic or hypertrophic cardiomyopathy.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: ABNORMAL
    term:
      id: GO:0045214
      label: sarcomere organization
  - preferred_term: muscle contraction
    modifier: ABNORMAL
    term:
      id: GO:0006936
      label: muscle contraction
  downstream:
  - target: Cardiomyopathy
    description: The cardiac insult manifests as cardiomyopathy.
  - target: Dilated cardiomyopathy
    description: Dilated cardiomyopathy is a common structural form.
  - target: Restrictive cardiomyopathy
    description: Restrictive cardiomyopathy is the second most common structural form.
  - target: Hypertrophic cardiomyopathy
    description: A hypertrophic form occurs in a minority.
  - target: Arrhythmogenic right ventricular cardiomyopathy
    description: An arrhythmogenic right-ventricular form occurs in a minority.
  - target: Congestive heart failure
    description: Progressive contractile dysfunction produces heart failure.
  - target: Ventricular arrhythmia
    description: Remodeled, fibrotic myocardium is arrhythmogenic.
  - target: Sudden cardiac death
    description: Ventricular arrhythmia can cause sudden cardiac death.
  evidence:
  - reference: PMID:39968648
    reference_title: Natural History, Phenotype Spectrum, and Clinical Outcomes of Desmin (DES)-Associated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pathogenic/likely pathogenic (LP) desmin (DES) variants cause heterogeneous cardiomyopathy and skeletal myopathy phenotypes"
    explanation: Establishes DES variants as a cause of cardiomyopathy.
- name: Cardiac Conduction System Degeneration
  biological_scale: CELLULAR
  description: >-
    Degeneration and desmin pathology in conduction-system myocytes produce
    atrioventricular block and other conduction disease, often requiring a
    pacemaker.
  cell_types:
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
  downstream:
  - target: Atrioventricular block
    description: Conduction-system degeneration produces AV block.
  - target: Sudden cardiac death
    description: Conduction block and arrhythmia can cause sudden cardiac death.
  evidence:
  - reference: PMID:34315782
    reference_title: Expanding Spectrum of Desmin-Related Myopathy, Long-term Follow-up, and Cardiac Transplantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complete atrioventricular block in 11 patients, all of whom required a permanent pacemaker"
    explanation: Complete AV block requiring a pacemaker was the most common cardiac finding.
mechanistic_hypotheses:
- hypothesis_group_id: network_loss_mechanical_vulnerability
  hypothesis_label: Network-loss mechanical vulnerability
  status: CANONICAL
  description: >-
    Disruption of the extrasarcomeric desmin filament network, rather than the
    aggregates themselves, is the primary driver: it increases the mechanical
    vulnerability of muscle fibres. Recessive loss-of-function disease, in which
    aggregates may be absent, shows network loss alone is sufficient.
  evidence:
  - reference: PMID:25394388
    reference_title: The toxic effect of R350P mutant desmin in striated muscle of man and mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "not the presence of protein aggregates, but disruption of the extrasarcomeric intermediate filament network leads to increased mechanical vulnerability of muscle fibers"
    explanation: Knock-in data attribute vulnerability to network loss rather than aggregates.
- hypothesis_group_id: aggregate_proteotoxicity
  hypothesis_label: Aggregate proteotoxicity
  status: ALTERNATIVE
  description: >-
    Granulofilamentous desmin aggregates are themselves toxic, sequestering
    partner proteins and overloading protein quality-control systems. This
    concurrent mechanism operates in the dominant, aggregate-forming forms.
  evidence:
  - reference: PMID:30179276
    reference_title: Imbalances in protein homeostasis caused by mutant desmin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutant desmin (i) increases proteasomal activity, (ii) stimulates macroautophagy"
    explanation: Mutant desmin aberrantly activates protein quality-control systems.

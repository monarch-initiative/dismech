inheritance:
- name: Autosomal dominant
  description: >-
    Congenital mirror movements are generally inherited in an autosomal dominant
    manner with reduced penetrance (~68% in DCC pathogenic variant carriers,
    higher in males than females). Most individuals with autosomal dominant CMM
    inherited the pathogenic variant from a symptomatic or asymptomatic parent;
    each child of an affected or carrier individual has a 50% chance of
    inheriting the causative variant, and sibs of a proband with clinically
    unaffected parents remain at increased risk because of reduced parental
    penetrance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22305526
    reference_title: "RAD51 haploinsufficiency causes congenital mirror movements in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CMM reflect dysfunctions and structural abnormalities of the motor
      network and are mainly inherited in an autosomal-dominant fashion.
    explanation: >-
      Establishes that congenital mirror movements are mainly inherited in an
      autosomal dominant fashion, consistent with most DCC, RAD51, NTN1, and
      ARHGEF7 families.
  - reference: PMID:25763452
    reference_title: "Congenital Mirror Movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For AD inheritance: most individuals with CMM resulting from a pathogenic
      variant in DCC, NTN1, or RAD51 inherited the pathogenic variant from a
      parent who may be symptomatic or asymptomatic. If a parent of the proband
      is affected and/or has a DCC, NTN1, or RAD51 pathogenic variant, the risk
      to the sibs of inheriting the variant is 50%. Of note, the sibs of a
      proband who has clinically unaffected parents are still at increased risk
      for CMM because of the significant possibility of reduced penetrance in a
      heterozygous parent. Each child of an individual with AD CMM has a 50%
      chance of inheriting the causative variant; however, because of reduced
      penetrance, offspring who inherit the pathogenic variant may not manifest
      CMM.
    explanation: >-
      GeneReviews details autosomal dominant inheritance, 50% transmission risk
      to siblings and offspring, and reduced penetrance in asymptomatic carrier
      parents and offspring.

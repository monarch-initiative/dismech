  prevalence_class: RARE
  notes: >-
    Familial congenital mirror movements is a rare neurodevelopmental disorder.
    The cohort and primary genetics literature characterize it as rare; precise
    population-based prevalence estimates are limited and vary with
    ascertainment.
  evidence:
  - reference: PMID:38314870
    reference_title: "Defining the Genetic Landscape of Congenital Mirror Movements in 80 Affected Individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital mirror movements (CMM) is a rare neurodevelopmental disorder
      characterized by involuntary movements from one side of the body that
      mirror voluntary movements on the opposite side.
    explanation: >-
      Characterizes CMM as a rare neurodevelopmental disorder.
treatments:
- name: Supportive and rehabilitative care
  description: >-
    No disease-modifying therapy is established. Management is supportive and
    function-oriented, including adaptation of the school environment (extra
    examination time and limiting the amount of handwriting), avoiding
    stigmatization of affected children and adolescents, career counseling to
    avoid professions requiring complex bimanual movements or extensive
    handwriting, standard therapy for any concomitant neurocognitive issues,
    and avoidance of sustained or repetitive bimanual hand activity to reduce
    upper-limb pain or discomfort.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25763452
    reference_title: "Congenital Mirror Movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MANAGEMENT: Treatment of manifestations: Adaptation of the school
      environment (e.g., allocation of extra time during examinations and
      limitation of the amount of handwriting) is recommended. Stigmatizing
      children and adolescents should be avoided to assure that educational
      opportunities are not lost as a result of mirror movements. Adolescents
      and young adults should be encouraged to consider a profession that does
      not require complex bimanual movements, repetitive or sustained hand
      movements, or extensive handwriting. Standard therapy for any
      neurocognitive issues is recommended. Agents/circumstances to avoid:
      Complex bimanual movements or sustained/repetitive hand activity in order
      to reduce pain or discomfort in the upper limbs.
    explanation: >-
      GeneReviews details supportive management including school accommodations,
      psychosocial and vocational guidance, standard neurocognitive therapy, and
      avoidance of sustained/repetitive bimanual hand activity to reduce
      upper-limb pain or discomfort.
- name: Occupational therapy
  description: >-
    Occupational therapy and functional task adaptation (including school
    accommodations such as limiting handwriting volume and allocating extra
    time during examinations) to compensate for fine-motor and bimanual task
    limitations.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  notes: >-
    No CMM-specific controlled trial of occupational therapy exists; task and
    handwriting adaptations are recommended on a supportive, function-oriented
    basis in clinical guidance.
  evidence:
  - reference: PMID:25763452
    reference_title: "Congenital Mirror Movements."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MANAGEMENT: Treatment of manifestations: Adaptation of the school
      environment (e.g., allocation of extra time during examinations and
      limitation of the amount of handwriting) is recommended. Stigmatizing
      children and adolescents should be avoided to assure that educational
      opportunities are not lost as a result of mirror movements. Adolescents
      and young adults should be encouraged to consider a profession that does
      not require complex bimanual movements, repetitive or sustained hand
      movements, or extensive handwriting. Standard therapy for any
      neurocognitive issues is recommended. Agents/circumstances to avoid:
      Complex bimanual movements or sustained/repetitive hand activity in order
      to reduce pain or discomfort in the upper limbs.
    explanation: >-
      GeneReviews recommends handwriting limitation, school environment
      adaptations, and avoidance of sustained repetitive bimanual hand tasks,
      providing indirect support for occupational therapy and task adaptation.
- name: Genetic counseling
  description: >-
    Genetic counseling for affected families and at-risk relatives, with
    cascade, prenatal, and preimplantation genetic testing once a familial
    pathogenic variant is identified. Counseling addresses the predominantly
    autosomal dominant inheritance (50% transmission risk with reduced
    penetrance in asymptomatic carrier parents and offspring) and the rare
    autosomal recessive DNAL4 form.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25763452
    reference_title: "Congenital Mirror Movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the CMM-causing pathogenic variant has been identified in an affected
      family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews documents genetic counseling and the availability of prenatal
      and preimplantation genetic testing once a familial pathogenic variant is
      identified.
  - reference: PMID:38314870
    reference_title: "Defining the Genetic Landscape of Congenital Mirror Movements in 80 Affected Individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic etiology can be identified in one third of CMM individuals, with
      DCC being the most common gene involved.
    explanation: >-
      Because a genetic etiology is identifiable in a substantial fraction of
      CMM cases, genetic counseling and cascade testing of relatives are
      relevant once a familial pathogenic variant is found.
differential_diagnoses:
- name: Developmental split-brain syndrome
  description: >-
    Developmental split-brain syndrome (DSBS) is the severe allelic
    neurodevelopmental disorder caused by biallelic loss-of-function DCC
    variants; unlike isolated heterozygous DCC-related CMM, DSBS features
    widespread commissural tract failure, complete corpus callosum agenesis, and
    neurodevelopmental impairment with or without mirror movements.
  evidence:
  - reference: PMID:29068161
    reference_title: "DCC mutation update: Congenital mirror movements, isolated agenesis of the corpus callosum, and developmental split brain syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alternatively, biallelic DCC mutations leading to predicted
      loss-of-function (LoF) cause developmental split brain syndrome (DSBS,
      MIM# 617542), a more complex syndrome associated with agenesis of the
      corpus callosum (ACC) as well as widespread failure of commissural tracts
      throughout the rest of the CNS, with or without MMs
    explanation: >-
      Distinguishes biallelic DCC developmental split-brain syndrome from
      heterozygous isolated DCC congenital mirror movements.

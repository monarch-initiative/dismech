progression:
- phase: Variable outcome from perinatal lethality to adult survival
  notes: >-
    Outcome ranges from early lethal disease to long-term survival with short
    stature, and both extremes occur within a single family carrying the same
    alleles. A radiographic diagnosis of achondrogenesis 1A in one child and ODCD in
    a sibling is attributed to variable penetrance of TRIP11 mis-splicing between
    individuals, giving constitutively different residual GMAP levels. There is no
    marker that predicts which course an affected fetus will take.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Third, it became evident that disease manifestations may range from early
      lethal to long-term survival with short stature
    explanation: States the range of outcomes directly from the assembled case series.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is considerable clinical variability inTRIP11-related disorders, with
      early lethality and milder postnatal phenotypes occurring within the same
      family
    explanation: >-
      Introduces the observation of early lethality and milder postnatal phenotypes
      occurring within the same family.
diagnosis:
- name: Radiographic and Dental Recognition
  description: >-
    The combination of platyspondyly with coronal clefts, metaphyseal irregularity,
    mesomelic shortening, and dentinogenesis imperfecta is distinctive enough to
    direct testing. Because the radiographic gestalt overlaps the skeletal
    ciliopathies — thoracic dystrophy, brachydactyly with cone-shaped epiphyses, a
    trident pelvis — a ciliopathy panel is a common first and unrewarding step.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      radiographic features of ACG1A and ODCD are characteristic of skeletal
      ciliopathies
    explanation: >-
      Explains why ODCD is mistaken for a skeletal ciliopathy on imaging, the main
      diagnostic pitfall.
- name: TRIP11 Sequencing with RNA Confirmation
  description: >-
    Biallelic TRIP11 variants confirm the diagnosis, but coding annotation alone is
    misleading: the recurrent c.586C>T allele is annotated as a nonsense change yet
    behaves as an in-frame exon-skipping hypomorph. RNA analysis of patient
    fibroblasts is what distinguishes a true null genotype — predicting
    achondrogenesis 1A — from the hypomorphic genotype of ODCD.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, the experimental evidence shows aberrant splicing
      ofTRIP11in all ODCD cases investigated
    explanation: >-
      RNA analysis demonstrated aberrant splicing in every ODCD case investigated,
      which is why transcript-level confirmation is part of the diagnostic pathway.
differential_diagnoses:
- name: Achondrogenesis Type 1A (TRIP11-Related)
  description: >-
    The allelic null phenotype: complete loss of TRIP11 causes early embryonic
    lethality with a closely similar but more severe skeletal picture. The ISDS
    nosology places it in group 14 (severe spondylodysplastic dysplasias), so the
    same gene appears in two groups separated by severity. Distinguishing them
    matters for counselling because they are not different diseases at the molecular
    level, only different residual GMAP doses.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although our functional data corroborate that ODCD is the milder allelic form
      of ACG1A, clinical variability associated with hypomorphicTRIP11mutations is
      too high for a reliable genotype-phenotype correlation, at present.
    explanation: >-
      States the allelic relationship and, in the same sentence, that the variability
      defeats a reliable genotype-phenotype correlation.
- name: MIA3/TANGO1-Related Odontochondrodysplasia
  description: >-
    Biallelic MIA3 (TANGO1) variants produce an odontochondrodysplasia phenotype
    that at its severe end closely resembles the TRIP11 disorder — MIA3 and TRIP11
    act at consecutive steps of collagen and matrix export from the endoplasmic
    reticulum and Golgi. Extraskeletal features differ: the originally reported MIA3
    family had insulin-dependent diabetes, hearing loss, obesity, and intellectual
    disability, none of which is typical of TRIP11 disease. MIA3-related ODCD is not
    listed in the 2023 ISDS nosology and is therefore not assigned an ISDS group
    here.
  evidence:
  - reference: PMID:40119123
    reference_title: Deciphering the phenotypic spectrum associated with MIA3-related odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, they had more severe skeletal deformities closely resembling those
      observed in patients with TRIP11 variants.
    explanation: >-
      Documents the radiographic convergence between the MIA3 and TRIP11 forms that
      makes this a genuine differential.
- name: Skeletal Ciliopathies
  description: >-
    Cranioectodermal dysplasia (Sensenbrenner syndrome) and the short-rib thoracic
    dysplasias share the thoracic dystrophy, cone-shaped epiphyses, trident pelvis,
    and the dental, renal, and cerebral organ pattern. GMAP-210 binds IFT20, which
    made a ciliary mechanism plausible, but cilia and ciliary IFT20 targeting were
    normal in ODCD patient fibroblasts.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same organs are affected in an overlapping condition known as
      cranioectodermal dysplasia, or Sensenbrenner syndrome
    explanation: Names the specific ciliopathy with which ODCD is most readily confused.
treatments:
- name: Supportive and Multidisciplinary Management
  description: >-
    No disease-modifying therapy exists. Management is supportive: respiratory
    support for the narrow thorax and pulmonary dysplasia in infancy, orthopaedic
    care for the limb and spinal deformity, renal surveillance for the late cystic
    disease, and neurosurgical assessment where hydrocephaly is present.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    Curated without an evidence item because no management study of ODCD has been
    published; the record states the absence of disease-specific therapy rather
    than asserting a supported intervention. The organ systems listed are those the
    case series documents as involved.
- name: Restorative Dental Care
  description: >-
    Dentinogenesis imperfecta requires early and continuing restorative dentistry to
    preserve the dentition. Two of the reporting centres in the founding series are
    dedicated rare oral and dental disease referral centres, which reflects how
    central the dental burden is to long-term care.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:40119123
    reference_title: Deciphering the phenotypic spectrum associated with MIA3-related odontochondrodysplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Odontochondrodysplasia (ODCD) is a rare skeletal dysplasia characterized by
      short stature, skeletal deformities, and dentinogenesis imperfecta (DI).
    explanation: >-
      Establishes dentinogenesis imperfecta as a defining feature and therefore a
      standing care need; it does not evidence a specific dental protocol, hence
      PARTIAL.
- name: Genetic Counseling
  description: >-
    Recurrence risk is 25 percent, but the counselling problem is severity rather
    than recurrence: the same parental alleles have produced early-lethal
    achondrogenesis 1A in one child and surviving ODCD in a sibling, and no
    genotype-based prediction of outcome is currently possible.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our results make the prediction of clinical outcome solely based on
      genotype difficult in genetic counselling and clinical care.
    explanation: >-
      The authors name genetic counselling as the setting in which the unpredictable
      genotype-phenotype relationship bites.
experimental_models:
- name: TRIP11-mutant patient fibroblast-derived chondrocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from ODCD and achondrogenesis 1A patients,
    transdifferentiated into mature chondrocytes on an aggrecan-coated surface and
    assessed for chondrogenic nodule number and size, matrix synthesis,
    proliferation, and viability against controls. This system carries the entire
    cellular mechanism for the disorder, since no viable animal model exists.
  cell_source: Patient-derived (skin biopsy)
  culture_system: Fibroblast transdifferentiation to chondrocytes on aggrecan-coated surface
  modeled_mechanisms:
  - target: Block in Hypertrophic Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient-derived chondrogenic cells reproduce the differentiation block and
      the matrix-synthesis defect, and separate them from any effect on cell number.
    limitations: >-
      Transdifferentiated dermal fibroblasts are not growth-plate chondrocytes, and
      the system cannot reproduce the spatial organisation of the growth plate in
      which the hypertrophic transition normally occurs. The histological comparison
      the authors draw on comes from achondrogenesis 1A fetuses rather than ODCD.
    readouts:
    - name: Chondrogenic nodule number and size
      target: Block in Hypertrophic Chondrocyte Differentiation
      direction: DECREASED
      interpretation: >-
        Fewer and smaller chondrogenic nodules index the failure of chondrogenic
        differentiation in TRIP11-mutant cells.
    - name: Cell proliferation and viability during chondrogenesis
      target: Block in Hypertrophic Chondrocyte Differentiation
      direction: UNCHANGED
      interpretation: >-
        Normal proliferation and viability establish that the reduced matrix output
        is a differentiation defect rather than a consequence of cell loss. A
        deliberate negative result.
      evidence:
      - reference: PMID:30728324
        reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          we found that proliferation was not impaired during chondrogenesis
        explanation: >-
          The negative control that rules out reduced cell number as the explanation
          for reduced matrix synthesis.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, our functional studies in patient-derived primary cells clearly
        support a Golgi-based disease mechanism.
      explanation: >-
        The authors treat the patient-derived primary cell system as the decisive
        evidence for the mechanism, which is what makes this model informative for
        the node.
discussions:
- discussion_id: odcd_no_viable_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Extraskeletal Golgi-Related Organ Disease
  prompt: >-
    Can the late-onset renal, cerebral, and pulmonary disease of ODCD be studied at
    all, given that every existing Trip11 knockout mouse dies perinatally?
  rationale: >-
    The available Trip11-knockout models are null models, and nulls in humans are
    embryonic-lethal, so the mouse reproduces achondrogenesis 1A rather than ODCD.
    The authors state that perinatal lethality in these models precludes recognition
    and analysis of later-onset phenotypes — which is exactly the class the
    extraskeletal features of ODCD fall into. The cystic renal disease in particular
    emerged only on longitudinal clinical follow-up, and there is no system in which
    to test whether it arises through impaired ciliary export of IFT20 or through
    the Golgi defect directly.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These models all bear the disadvantage of perinatal lethality, precluding the
      recognition and analysis of later-onset phenotypes
    explanation: >-
      The authors name perinatal lethality of the existing models as the barrier to
      studying the later-onset organ disease.
  proposed_experiments:
  - experiment_id: exp_odcd_hypomorphic_knockin_model
    name: Hypomorphic Trip11 knock-in model reproducing the human splice allele
    description: >-
      Generate a knock-in mouse carrying the human exon-4-skipping allele rather
      than a null, so that residual GMAP protein permits postnatal survival, and
      follow the animals for renal cystic disease, hydrocephaly, and lung
      development. Compare against conditional Ift20 deletion to separate a ciliary
      from a Golgi route to the renal phenotype.
    would_support:
    - pathophysiology#Extraskeletal Golgi-Related Organ Disease
    supporting_outcome:
    - >-
      Postnatally viable hypomorphic animals developing cystic kidneys and
      hydrocephaly would establish that the extraskeletal disease is a direct
      consequence of reduced GMAP dose rather than of an unrelated modifier.
    would_refute:
    - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
    refuting_outcome:
    - >-
      Normal kidneys and ventricles in animals with the same residual GMAP dose that
      causes human disease would argue that the human extraskeletal features require
      something beyond the Golgi lesion.
- discussion_id: odcd_splicing_penetrance_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Variable outcome from perinatal lethality to adult survival
  prompt: >-
    What determines the penetrance of TRIP11 mis-splicing between individuals, and
    could it be measured prenatally to predict outcome?
  rationale: >-
    Siblings carrying identical TRIP11 alleles have received radiographic diagnoses
    of achondrogenesis 1A and of ODCD respectively. The proposed explanation is that
    splicing of TRIP11 is cell-type dependent and incompletely penetrant, so
    residual GMAP protein settles at constitutively different levels in different
    individuals. Nothing is known about what sets that level. If it were measurable
    in accessible fetal or neonatal material it would convert an unanswerable
    counselling question into a quantitative one, which is why this gap has direct
    clinical weight rather than only mechanistic interest.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A radiographic diagnosis of ACG1A and ODCD in different children originating
      from the same parents may be primarily due to variable penetrance
      ofTRIP11missplicing between individuals, resulting in constitutively different
      amounts of residual GMAP protein.
    explanation: >-
      States the variable-splicing-penetrance hypothesis for the intrafamilial
      severity difference, as a proposal rather than a demonstrated mechanism.
  proposed_experiments:
  - experiment_id: exp_odcd_residual_gmap_quantification
    name: Quantify residual GMAP protein against clinical severity across the allelic series
    description: >-
      Measure TRIP11 transcript isoform ratios and GMAP protein levels in matched
      accessible tissue from patients across the full severity range, and test
      whether residual protein level predicts radiographic severity independently of
      genotype.
    would_support:
    - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
    supporting_outcome:
    - >-
      A monotonic relationship between residual GMAP protein and severity across
      individuals sharing alleles would confirm protein dose as the operative
      variable and make it a candidate prognostic measurement.
    would_refute:
    - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
    refuting_outcome:
    - >-
      Comparable residual GMAP levels in siblings with lethal and surviving disease
      would move the explanation to a modifier outside TRIP11 altogether.
clinical_trials: []
datasets: []
notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. ODCD is NOS 12-0020 in the 2023
  revision. TRIP11 appears twice in that nosology — here and, as achondrogenesis
  type 1A, in group 14 — so this entry is scoped to the non-lethal phenotype and the
  lethal null phenotype is recorded as a differential rather than as a subtype. The
  MIA3/TANGO1 form of odontochondrodysplasia is deliberately left unclassified: it
  is not listed in the 2023 nosology, and the schema's own guidance is that this
  classification is a transcription of an expert nosology and should not be extended
  to entities the committee did not list.

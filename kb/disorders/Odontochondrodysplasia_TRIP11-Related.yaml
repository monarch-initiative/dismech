name: Odontochondrodysplasia TRIP11-Related
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Odontochondrodysplasia (ODCD, Goldblatt syndrome; OMIM #184260) is an ultra-rare
  autosomal recessive spondylometaphyseal dysplasia caused by hypomorphic
  biallelic variants in TRIP11, which encodes GMAP-210, the cis-Golgi vesicle
  tether. Affected individuals have short stature, a narrow chest, mesomelic limb
  shortening, brachydactyly, joint laxity, and dentinogenesis imperfecta;
  radiographs show platyspondyly with coronal clefts and metaphyseal irregularity.
  Extraskeletal disease — pulmonary dysplasia, cystic renal disease, and
  nonobstructive hydrocephaly — is part of the phenotype. ODCD is the non-lethal
  allelic counterpart of achondrogenesis type 1A: complete loss of TRIP11 is
  embryonic-lethal, while the recurrent splice alleles of ODCD leave trace amounts
  of shortened GMAP protein that preserve Golgi organisation, bulk secretion, and
  IFT20 Golgi anchoring. What survives that partial rescue is glycan processing and
  proteoglycan secretion, and the resulting block in hypertrophic chondrocyte
  differentiation is what both disorders share. Because splicing penetrance varies
  between individuals, the same alleles produce early-lethal disease and long-term
  survival within one family, so genotype does not predict outcome.
disease_term:
  preferred_term: odontochondrodysplasia
  term:
    id: MONDO:0100325
    label: odontochondrodysplasia 1
synonyms:
- ODCD
- ODCD1
- Odontochondrodysplasia 1
- Goldblatt syndrome
- Goldblatt chondrodysplasia
- Chondrodysplasia-dentinogenesis imperfecta-joint laxity syndrome
- Spondylometaphyseal dysplasia with dentinogenesis imperfecta
- TRIP11-related odontochondrodysplasia
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)",
      entry NOS 12-0020, listed as "Odontochondrodysplasia (ODCD), TRIP11-related"
      (AR, TRIP11, MIM 184260). The nosology carries an explicit cross-reference
      from this entry to "Achondrogenesis, TRIP11-related (formerly type 1A)",
      which it places in group 14 (severe spondylodysplastic dysplasias) — the same
      gene, split across two groups by severity, which is why the group-12 tag
      belongs on the non-lethal phenotype only.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    Sixteen patients from twelve unrelated families with TRIP11 variants had been
    published by 2025, three decades after Goldblatt recognised the entity in 1991.
    No population-based prevalence estimate exists; rate_per_100000 is recorded as
    0.0 only to mark that the true rate is far below the resolution of any
    published survey.
  evidence:
  - reference: PMID:40119123
    reference_title: Deciphering the phenotypic spectrum associated with MIA3-related odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 16 patients from 12 unrelated families with TRIP11 variants have
      been described in the literature
    explanation: Gives the published caseload for the TRIP11-related form.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ODCD is autosomal recessive. Every reported patient carries a TRIP11-null
    allele in trans with a splice variant that retains partial function; two null
    alleles instead produce achondrogenesis type 1A. Because the penetrance of the
    mis-splicing varies between individuals, recurrence risk counselling cannot
    predict which end of the severity spectrum a subsequent affected child will
    occupy.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all ODCD patients, in addition to aTRIP11-null allele, carry compound
      heterozygous splice variants, which are translated into low-abundance GMAP
      proteins
    explanation: >-
      Establishes the compound heterozygous null-plus-hypomorph allele structure
      that defines the recessive genotype of ODCD.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our results make the prediction of clinical outcome solely based on
      genotype difficult in genetic counselling and clinical care.
    explanation: >-
      The authors state directly that genotype does not predict outcome, which is
      the counselling-relevant consequence of variable splicing penetrance.
genetic:
- name: Biallelic Hypomorphic TRIP11 Variants
  gene_term:
    preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    TRIP11 has 21 coding exons and encodes the 1,979-amino-acid GMAP-210 protein.
    ODCD patients are compound heterozygous for a null allele and a recurrent
    splice variant. The recurrent c.586C>T change is instructive: predicted to be a
    nonsense allele (p.Gln196*) subject to nonsense-mediated decay, it in fact
    abrogates a splice donor site and causes complete in-frame skipping of exon 4,
    producing a shortened but partly functional protein. Splicing is cell-type
    dependent and not fully penetrant, which is the proposed source of the
    intrafamilial variability.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that ODCD is caused by hypomorphic TRIP11 mutations, and we
      identify ODCD as the nonlethal counterpart to achondrogenesis 1A (ACG1A), the
      known null phenotype in humans.
    explanation: >-
      Establishes the gene, the hypomorphic mechanism, and the allelic relationship
      with achondrogenesis 1A.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, we were surprised to find that the mutation, instead, abrogates a
      splice donor site, causing complete in-frame skipping of exon 4
    explanation: >-
      Shows that an apparently null nonsense allele actually behaves as a splice
      hypomorph, which is why the genotype is not readable from the coding
      annotation alone.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings establish that ODCD is genetically homogeneous and that
      hypomorphic mutations ofTRIP11are the genetic basis for a range of ODCD
      phenotypes.
    explanation: >-
      Supports treating ODCD as a single-locus disorder rather than a
      radiographically defined category.
pathophysiology:
- name: Aberrant TRIP11 Splicing with a Null Allele in Trans
  biological_scale: MOLECULAR
  description: >-
    A TRIP11-null allele in trans with a recurrent splice allele. The splice allele
    yields low-abundance GMAP proteins identical to, or overlapping with, natural
    isoforms; the null allele contributes nothing. Two null alleles instead cause
    achondrogenesis type 1A, so this genotype defines the non-lethal end of one
    allelic series.
  genes:
  - preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas recurrent splice mutations are associated with a milder but variable
      spectrum of postnatal clinical phenotypes
    explanation: >-
      Introduces the dose relationship in which complete loss is lethal and residual
      function permits survival; the sentence continues to name early embryonic
      lethality in ACG1A versus a milder postnatal spectrum.
  downstream:
  - target: Reduced GMAP-210 Abundance at the cis-Golgi
    causal_link_type: DIRECT
    description: >-
      All disease-associated TRIP11 alleles reduce GMAP-210 protein abundance
      sharply in patient-derived primary cells, leaving only trace amounts of the
      shortened variants.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        caused a strong reduction of GMAP-210 abundance in patient-derived primary
        cells
      explanation: >-
        Quantifies the protein-level consequence shared by every disease-associated
        allele.

- name: Reduced GMAP-210 Abundance at the cis-Golgi
  biological_scale: MOLECULAR
  description: >-
    GMAP-210 is the cis-Golgi vesicle tether. In ODCD its abundance is sharply
    reduced but not abolished, and the residual variants retain enough tethering
    capacity to hold the Golgi together. This is the node at which ODCD and
    achondrogenesis 1A diverge: what is preserved here is what makes ODCD
    survivable.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: Golgi organization
    modifier: DECREASED
    term:
      id: GO:0007030
      label: Golgi organization
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In spite of reduced abundance, residual GMAP variants maintain partial Golgi
      integrity, normal global protein secretion, and subcellular distribution of
      IFT20 in ODCD.
    explanation: >-
      Defines exactly what the hypomorphic alleles preserve, and by contrast what
      the null alleles of achondrogenesis 1A lose.
  downstream:
  - target: Defective Golgi Glycan Processing and Proteoglycan Secretion
    causal_link_type: DIRECT
    description: >-
      Bulk secretory traffic survives the reduction in GMAP-210, but glycan
      processing does not. Glycosylation of LAMP1 and LAMP2, which depends on
      efficient intra-Golgi trafficking of processing enzymes, is used as the
      readout, and procollagen type I secretion is reduced relative to control while
      remaining above the achondrogenesis 1A level.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ensuing from aberrant glycan processing and impaired extracellular matrix
        proteoglycan secretion by the Golgi apparatus
      explanation: >-
        Names the two Golgi functions that fail despite preserved bulk secretion.
  - target: Extraskeletal Golgi-Related Organ Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The lung, kidney, and brain manifestations of ODCD are attributed to reduced
      GMAP-210 dose rather than to a separate lesion, but the route from the Golgi
      defect to each organ has not been established. The authors' own fibroblast
      data argue against a ciliary intermediate, and no viable model exists in which
      to test the alternatives, so the intermediates are left unspecified.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Second, additional extraskeletal disease manifestations of ODCD included
        pulmonary dysplasia, cystic renal disease, and nonobstructive hydrocephaly.
      explanation: >-
        Establishes that the extraskeletal organ disease belongs to the TRIP11
        hypomorph phenotype, which is what places it downstream of reduced GMAP-210
        abundance. Graded PARTIAL because the sentence documents co-occurrence in
        the series and does not itself demonstrate the causal route.
- name: Defective Golgi Glycan Processing and Proteoglycan Secretion
  biological_scale: MOLECULAR
  description: >-
    Post-translational glycan processing and secretion of extracellular matrix
    proteoglycans are impaired while bulk protein export is normal. The authors
    propose that a limited set of secreted developmental regulators with key roles
    in early chondrogenesis — decorin among them — are the cargoes that matter, by
    analogy with achondrogenesis type 1B, in which aberrant glycan processing
    produces a closely similar skeletal phenotype.
  biological_processes:
  - preferred_term: glycoprotein biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0009101
      label: glycoprotein biosynthetic process
  - preferred_term: Golgi vesicle transport
    modifier: ABNORMAL
    term:
      id: GO:0048193
      label: Golgi vesicle transport
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The etiology of the differentiation defect remains currently unclear, but we
      hypothesize that aberrant posttranslational processing and secretion of a
      limited number of secreted developmental regulators with key importance for
      early chondrogenesis, like decorin
    explanation: >-
      The specific cargo identity is an explicit hypothesis of the authors, not a
      demonstrated result, which is why this is graded PARTIAL.
  downstream:
  - target: Block in Hypertrophic Chondrocyte Differentiation
    causal_link_type: DIRECT
    description: >-
      The differentiation block is the shared cellular endpoint of ODCD and
      achondrogenesis 1A, differing between them only in degree. Fibroblasts
      transdifferentiated to chondrocytes form fewer and smaller chondrogenic
      nodules with reduced matrix synthesis, and proliferation and viability are
      unaffected, so this is a differentiation defect and not cell loss.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, a similar defect in chondrocyte maturation is observed in both
        disorders, which produces a cellular achondrogenesis phenotype of different
        severity
      explanation: >-
        Establishes the differentiation block as the common downstream endpoint of
        the allelic series.
  - target: Dentinogenesis Imperfecta
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Odontoblasts secrete a collagenous, proteoglycan-rich dentine matrix through
      the same Golgi route, so defective glycan processing and matrix secretion is
      the natural explanation for the dental defect that names the disorder. The
      step has not been demonstrated in odontoblasts, and MIA3/TANGO1 — the other
      odontochondrodysplasia gene — acts on the immediately upstream export step,
      which is the main circumstantial support for a shared secretory mechanism.
- name: Block in Hypertrophic Chondrocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    Chondrocytes fail to progress to the hypertrophic stage, so the growth plate
    loses the cells that synthesise the key cartilage matrix proteins, COL10A1
    among them. Histology in achondrogenesis 1A fetuses shows reduced total
    epiphyseal cartilage with absent columnar chondrocytes in the prehypertrophic
    and hypertrophic zones; ODCD is the attenuated version of the same lesion.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A block in cellular differentiation impairs the evolution of hypertrophic
      chondrocytes, which synthesize key cartilage matrix proteins in the growth
      plate, including COL10A1.
    explanation: >-
      States the cellular lesion and why it matters for growth-plate matrix
      production.
  downstream:
  - target: Spondylometaphyseal Dysplasia with Mesomelic Shortening
    causal_link_type: DIRECT
    description: >-
      Failure of the hypertrophic transition disorders endochondral growth at both
      the vertebral and the metaphyseal growth plates, producing the combined
      radiographic pattern that places ODCD in the spondylometaphyseal group.
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Radiographic features include platyspondyly with coronal clefts and
        metaphyseal irregularities of the tubular bones
      explanation: Gives the vertebral-plus-metaphyseal radiographic pattern that results.
- name: Spondylometaphyseal Dysplasia with Mesomelic Shortening
  biological_scale: ORGANISM
  description: >-
    The skeletal phenotype: short stature, narrow chest, mesomelic limb shortening,
    brachydactyly, and joint laxity, on a radiographic background of platyspondyly
    with coronal clefts and metaphyseal irregularity. Short plump tubular bones with
    cupped metaphyses flanked by longitudinal spurs, short ribs, and a trident
    pelvis are shared with achondrogenesis 1A and are the features that first
    suggested the two disorders were allelic.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key clinical findings are short stature, narrow chest, mesomelic limb
      shortening, brachydactyly, joint laxity, and dental anomalies
    explanation: The clinical core of the disorder as defined at entity recognition.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
    description: Disordered endochondral growth at every growth plate reduces stature.
  - target: Mesomelic Limb Shortening
    causal_link_type: DIRECT
    description: >-
      Shortening falls predominantly on the middle limb segments, the pattern that
      distinguishes the disorder from the rhizomelic dysplasias.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      Short digits with cone-shaped epiphyses, the distal expression of the same
      growth-plate lesion.
  - target: Platyspondyly with Coronal Clefts
    causal_link_type: DIRECT
    description: >-
      The vertebral growth plates are affected alongside the appendicular ones,
      which is what makes the disorder spondylometaphyseal rather than metaphyseal.
  - target: Coronal Cleft Vertebrae
    causal_link_type: DIRECT
    description: >-
      Coronal clefting is a normal transient fetal finding that persists abnormally
      where vertebral endochondral ossification is disordered.
  - target: Metaphyseal Irregularity
    causal_link_type: DIRECT
    description: >-
      Cupped, irregular metaphyses flanked by longitudinal spurs — the direct
      radiographic read-out of the failed hypertrophic transition.
  - target: Narrow Chest
    causal_link_type: DIRECT
    description: >-
      Short ribs produce a narrow thorax, which together with the pulmonary
      dysplasia accounts for the deaths at the lethal end of the spectrum.
  - target: Joint Laxity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ligamentous laxity accompanies the skeletal dysplasia. Whether it reflects the
      same defective matrix secretion acting on ligament and capsule, or a separate
      consequence of GMAP-210 loss, has not been established.
- name: Extraskeletal Golgi-Related Organ Disease
  biological_scale: ORGANISM
  description: >-
    Pulmonary dysplasia, cystic renal disease, and nonobstructive hydrocephaly
    occur in ODCD and implicate GMAP-210 in renal and cerebral development beyond
    the skeleton. The authors could not attribute these to a ciliary mechanism —
    cilia in GMAP-210-deficient fibroblasts were of normal length and structure, and
    ciliary targeting of IFT20 was preserved — but note that conditional Ift20
    deletion during renal development causes polycystic kidney disease in mice, so a
    cilium-based route to the late renal disease remains open.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Second, additional extraskeletal disease manifestations of ODCD included
      pulmonary dysplasia, cystic renal disease, and nonobstructive hydrocephaly.
    explanation: Documents the extraskeletal organ involvement in the assembled series.
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Our studies did not provide support for a cilium-dependent pathogenesis
      inTRIP11-related disorders
    explanation: >-
      A negative result against the ciliopathy hypothesis in patient fibroblasts,
      which is why the extraskeletal node is not curated as a ciliary mechanism.
  downstream:
  - target: Cystic Renal Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Late-onset cystic renal degeneration. The authors suggest it may be the one
      manifestation that genuinely runs through impaired ciliary transport of IFT20,
      by analogy with conditional Ift20 deletion causing polycystic kidney disease in
      neonatal mice — but their own fibroblast data found ciliary IFT20 targeting
      intact, so the route is unresolved.
  - target: Nonobstructive Hydrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Communicating hydrocephalus without an obstructive lesion, implicating GMAP-210
      in cerebral development by a mechanism that has not been worked out.
  - target: Pulmonary Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal lung development, distinct from the mechanical restriction imposed by
      the narrow thorax though clinically inseparable from it.

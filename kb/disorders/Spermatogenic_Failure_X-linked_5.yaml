- name: Genetic Counseling
  description: Counseling covers X-linked transmission. As for any X-linked recessive condition, daughters
    conceived by ICSI would be carriers and each of their sons would have a 50% chance of inheriting the
    variant. This follows from the inheritance pattern rather than from an observed SSX1 pedigree.
  therapeutic_modality: OTHER

      evidence_source: HUMAN_CLINICAL
      snippet: Here, using whole-exome sequencing, we identified deleterious variants of X-linked SSX1
        in six unrelated men with asthenoteratozoospermia.
      explanation: Supports classification as an X-linked Mendelian genetic disorder.
notes: The gene-disease link rests on one report of six men and two primate-like knockdown models (PMID:36796361),
  plus one further candidate variant from a whole-genome sequencing series (PMID:42467186). Both are cached
  as abstract only, so the individual variants, semen parameters and sperm ultrastructure of the six men
  are not recorded here. SSX1 is not classified by ClinGen (no row in cache/clingen/gene_validity.csv),
  so no gene-disease validity tier is recorded. SSX1 is better known as the fusion partner of SS18 in
  synovial sarcoma (Synovial_Sarcoma), a somatic event unrelated to this disorder.

name: Spermatogenic Failure X-linked 5
creation_date: '2026-10-23T13:00:00Z'
category: Mendelian
synonyms:
- SPGFX5
- spermatogenic failure, X-linked, 5
- SSX1-related asthenoteratozoospermia
description: Spermatogenic failure X-linked 5 (SPGFX5) is X-linked male infertility with asthenoteratozoospermia
  (reduced sperm motility and abnormal sperm morphology) caused by hemizygous deleterious variants in
  SSX1. SSX1 is a primate-specific gene expressed predominantly in the testis; the SSX family expanded
  independently in rodents and primates, so the mouse cannot model it. Variants were found by exome sequencing
  in six unrelated men with asthenoteratozoospermia, and knockdown of Ssx1 in the testes of cynomolgus
  monkeys and tree shrews reproduced reduced sperm motility and abnormal sperm morphology. Testicular
  RNA sequencing after knockdown showed that many spermatogenic processes were affected, but the step
  through which SSX1 loss produces the sperm defect is not known. Three of five couples treated with intracytoplasmic
  sperm injection (ICSI) achieved a pregnancy. A hemizygous SSX1 splice donor variant has since been reported
  in a man with oligoasthenoteratozoospermia.

name: Food Protein-Induced Enterocolitis Syndrome
creation_date: "2026-10-23T19:12:07Z"
category: Complex
disease_term:
  preferred_term: food protein-induced enterocolitis syndrome
  term:
    id: MONDO:0100008
    label: food protein-induced enterocolitis syndrome
synonyms:
- FPIES
- delayed food allergy
parents:
- Food Allergy
- Non-IgE-Mediated Food Allergy
- Gastrointestinal Disease
description: >-
  Food protein-induced enterocolitis syndrome (FPIES) is a non-IgE-mediated
  gastrointestinal food allergy, usually beginning in infancy, in which
  ingestion of a trigger food is followed after a delay of 1 to 4 hours by
  repetitive, often projectile vomiting with lethargy and pallor, sometimes
  progressing to diarrhea, dehydration, hypotension and hypovolemic shock.
  Cow's milk protein is the most common trigger in infancy, followed by soy and
  solid foods such as rice and oat; fish and shellfish predominate in
  adult-onset disease. Chronic FPIES, with daily ingestion of the trigger
  (typically cow's milk or soy formula), presents with intermittent vomiting,
  diarrhea and failure to thrive. In contrast to IgE-mediated food allergy,
  skin and respiratory symptoms are absent and food-specific antibody responses
  to milk proteins, including the caseins, are weak or absent; a subset of
  patients with detectable food-specific IgE (atypical FPIES) has a more
  protracted course and can convert to IgE-mediated allergy. Acute reactions
  are accompanied by marked systemic innate immune activation (neutrophils,
  monocytes, natural killer cells and eosinophils) and neuroendocrine
  activation, but how the trigger food is specifically recognized remains
  unknown. Diagnosis rests on the 2017 international consensus clinical
  criteria, supported by oral food challenge; management is trigger avoidance,
  fluid resuscitation and ondansetron for acute reactions, and periodic
  supervised challenges to detect the resolution that occurs in most children.
notes: >-
  No GeneReviews chapter applies: FPIES is a non-Mendelian food allergy. The
  diagnosis rows below carry no diagnosis_term because NCIT has no oral food
  challenge procedure term; OLS searches of the ncit ontology for "oral food
  challenge", "food challenge", "oral challenge" and "challenge test" returned
  no food-challenge procedure (the last returned only Histamine Challenge Test
  and Proficiency Testing Challenge).
has_subtypes:
- name: Acute FPIES
  description: >-
    Repetitive vomiting 1 to 4 hours after intermittent ingestion of the
    trigger food, followed by lethargy and pallor and sometimes diarrhea within
    5 to 10 hours; patients are well between episodes and symptoms resolve
    within 24 hours of food elimination.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute FPIES is characterized by repetitive vomiting that occurs 1-4 hours after food ingestion."
    explanation: Review summarizing the 2017 consensus definition of the acute phenotype.
- name: Chronic FPIES
  description: >-
    Intermittent vomiting, chronic diarrhea and failure to thrive with daily
    ingestion of the trigger, typically cow's milk or soy formula in young
    infants; symptoms resolve within days of elimination, and reintroduction
    after elimination produces an acute reaction.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic FPIES presents with intermittent vomiting and/or diarrhea, followed by failure to thrive."
    explanation: Review summarizing the consensus definition of the chronic phenotype.
  - reference: PMID:40848987
    reference_title: "Phenotypes and follow-up of chronic cow's milk food protein-induced enterocolitis syndrome: A 16-year prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most prevalent symptom was intermittent vomiting, followed by diarrhea."
    explanation: Prospective cohort of oral food challenge-confirmed cow's milk chronic FPIES describing its presentation.
- name: Atypical FPIES
  description: >-
    FPIES in a patient with detectable IgE (positive skin prick test or serum
    specific IgE) to the trigger food. For cow's milk, detectable milk-specific
    IgE is associated with a protracted course and possible conversion to an
    immediate IgE-mediated phenotype.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FPIES is subcategorized by the absence (classical FPIES) or presence (atypical FPIES) of food specificIgE."
    explanation: States the consensus classical versus atypical subdivision by food-specific IgE.
  - reference: PMID:24880634
    reference_title: "Clinical features and resolution of food protein-induced enterocolitis syndrome: 10-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among children with specific IgE to cow's milk, 41% changed from a milk FPIES to an IgE-mediated phenotype over time."
    explanation: Cohort evidence that milk-specific IgE marks a subgroup that can convert to IgE-mediated milk allergy.

discussions:
- discussion_id: gap_fpies_food_antigen_recognition
  prompt: >-
    How is the trigger food specifically recognized in FPIES, given that
    food-specific antibodies are weak or absent and food-responsive T cells
    are within the range of tolerant controls, yet reactions are reproducibly
    food-specific?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Food Antigen-Responsive T-Cell Activation
  - pathophysiology#Systemic Innate Immune Activation
  - mechanistic_hypotheses#innate_immune_activation_model
  rationale: >-
    Without the recognition step the chain from ingestion to innate activation
    cannot be completed, and for cow's milk FPIES it is not known whether
    casein, whey proteins or a non-protein milk component is the operative
    antigen.
  evidence:
  - reference: PMID:28192147
    reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further investigation is needed to identify the mechanism of antigen specificity of adverse reactions to foods in FPIES."
    explanation: Authors identify antigen specificity as the open question.
  - reference: PMID:25746969
    reference_title: Immunopathophysiology of food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For example, invariant NKT cells are activated by milk sphingolipids in IgE-mediated food allergy and eosinophilic esophagitis 49, 50, a similar recognition may be at work in FPIES."
    explanation: Raises a non-protein milk antigen route as a candidate.
- discussion_id: gap_fpies_biomarkers
  prompt: >-
    Is there a biomarker of active FPIES or of its resolution, for example
    casein-stimulated TGF-beta, baseline IL-10 or tryptase, or food-specific
    IgE for persistence of milk FPIES, that could reduce dependence on oral
    food challenges?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Deficient Tolerogenic Response to Milk Proteins
  - diagnosis#Supervised oral food challenge
  rationale: >-
    Candidate markers come from small single-center cohorts and have not been
    validated prospectively; milk-specific IgE predicts persistence but does
    not diagnose active disease.
  evidence:
  - reference: PMID:39521282
    reference_title: "Current status and future directions in food protein-induced enterocolitis syndrome: An NIAID workshop report of the June 22, 2022, virtual meeting."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathophysiology of FPIES remains unknown, and currently there are no diagnostic biomarkers available to assess disease activity or its resolution."
    explanation: NIAID workshop statement of the biomarker gap.
  - reference: PMID:25283440
    reference_title: The role of casein-specific IgA and TGF-β in children with food protein-induced enterocolitis syndrome to milk.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prospective studies are needed to validate these findings, elucidate their role in FPIES pathophysiology, and establish the diagnostic utility of TGF-β in milk-induced FPIES."
    explanation: Casein-stimulated TGF-beta proposed as a candidate marker needing validation.
- discussion_id: gap_fpies_ige_conversion
  prompt: >-
    What drives conversion of cow's milk FPIES to IgE-mediated milk allergy in
    patients with milk-specific IgE, and are IgE-mediated and non-IgE-mediated
    milk allergy points on one spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Atypical FPIES
  rationale: >-
    Conversion and persistence are documented clinically, but the immunologic
    switch, including the role of the casein-dominated IgE response typical of
    IgE-mediated milk allergy, has not been studied mechanistically.
  evidence:
  - reference: PMID:38940669
    reference_title: "Shift from Cow's Milk Food Protein-Induced Enterocolitis Syndrome to IgE-Mediated Allergy: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This phenomenon raises the question of whether IgE-mediated and non-IgE-mediated allergies represent a spectrum of the same disease and highlights the need for further investigation to understand the pathophysiological mechanisms of this process."
    explanation: States the open mechanistic question about conversion.

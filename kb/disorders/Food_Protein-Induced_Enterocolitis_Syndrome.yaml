progression:
- phase: Infant onset
  age_range: First months of life (milk/soy); around 6 months for solid foods
  notes: >-
    Cow's milk FPIES usually begins within the first 6 months of life; solid
    food FPIES starts later, when grains, vegetables and poultry are introduced.
  evidence:
  - reference: PMID:21377033
    reference_title: "The prevalence and natural course of food protein-induced enterocolitis syndrome to cow's milk: a large-scale, prospective population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had FPIES within the first 6 months of life."
    explanation: Population-based cohort showing onset of cow's milk FPIES in early infancy.
- phase: Resolution in childhood
  age_range: Typically by 3 to 5 years
  notes: >-
    Most children acquire tolerance; milk FPIES resolves earlier than grain or
    soy FPIES in referral cohorts, and detectable milk-specific IgE is
    associated with persistence.
  evidence:
  - reference: PMID:21377033
    reference_title: "The prevalence and natural course of food protein-induced enterocolitis syndrome to cow's milk: a large-scale, prospective population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By the age of 3 years, 90% of the patients had recovered."
    explanation: Population-based natural history of cow's milk FPIES.
  - reference: PMID:24880634
    reference_title: "Clinical features and resolution of food protein-induced enterocolitis syndrome: 10-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age when milk tolerance was established for subjects with undetectable milk-specific IgE levels was 5.1 years, whereas none of the subjects with detectable milk-specific IgE became tolerant to milk during the study (P = .003)."
    explanation: Referral cohort showing later resolution and persistence of milk FPIES when milk-specific IgE is detectable.
- phase: Adult-onset disease
  age_range: Adulthood
  notes: >-
    Adult-onset FPIES is increasingly recognized, is triggered mostly by fish
    and shellfish, and some patients outgrow it.
  evidence:
  - reference: PMID:35753669
    reference_title: The Natural Course of Adult-Onset Food Protein-Induced Enterocolitis Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients achieved tolerance (40%) after a mean of 17.8 months (range, 6-36 months)."
    explanation: Adult cohort documenting resolution in a subset of adult-onset FPIES.
mechanistic_hypotheses:
- hypothesis_group_id: innate_immune_activation_model
  hypothesis_label: Systemic innate immune activation model
  status: EMERGING
  description: >-
    Ingestion of the trigger food is followed by systemic activation of
    monocytes, neutrophils, natural killer cells and eosinophils and by
    neuroendocrine activation, which together produce neutrophilia, vomiting
    and the shock-like systemic response. The innate activation itself is
    well documented in blood; the upstream event that confers food specificity
    and the link to the emetic reflex are not established.
  evidence:
  - reference: PMID:33548465
    reference_title: Advances in understanding immune mechanisms of food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FPIES reactions are associated with marked activation of innate immune and neuroendocrine pathways; however, the mechanism underlying the specific recognition of foods remains elusive."
    explanation: Review summarizing the innate and neuroendocrine activation model and its main open question.
- hypothesis_group_id: antigen_specific_t_cell_model
  hypothesis_label: Antigen-specific T-cell model
  status: ALTERNATIVE
  description: >-
    The older model holds that FPIES is a cell-mediated hypersensitivity in
    which food-protein-specific T cells, including casein-reactive T cells in
    cow's milk FPIES, drive intestinal inflammation. Lymphocyte responses to
    casein and other trigger proteins have been reported, but more recent
    studies find these responses within the range seen in tolerant or
    IgE-allergic controls, so their causal role is contested.
  evidence:
  - reference: PMID:4039696
    reference_title: "Milk- and soy protein-induced enterocolitis: evidence for lymphocyte sensitization to specific food proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The enhanced lymphocyte responses were specific for the food proteins responsible for clinical symptoms."
    explanation: Early lymphocyte-proliferation study (casein used as the milk antigen) supporting antigen-specific T-cell sensitization.
  - reference: PMID:28192147
    reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, levels were within the normal range and were inconsistent with a role in the pathophysiology of FPIES."
    explanation: Food-responsive CD154+ T cells were within the normal range, arguing against a dominant antigen-specific T-cell mechanism.
pathophysiology:
- name: Deficient Tolerogenic Response to Milk Proteins
  description: >-
    Children with cow's milk FPIES mount weak or absent humoral responses to
    milk proteins, with low casein-specific IgG, IgG4 and IgA, and their
    casein-stimulated T cells show deficient TGF-beta and low IL-10 production.
    These deficits distinguish active from resolved or tolerant states and are
    proposed to reflect failed oral tolerance to milk proteins, but whether
    they cause reactions or merely mark active disease is not established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: transforming growth factor beta production
    term:
      id: GO:0071604
      label: transforming growth factor beta production
    modifier: DECREASED
  - preferred_term: interleukin-10 production
    term:
      id: GO:0032613
      label: interleukin-10 production
    modifier: DECREASED
  evidence:
  - reference: PMID:25283440
    reference_title: The role of casein-specific IgA and TGF-β in children with food protein-induced enterocolitis syndrome to milk.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with milk-FPIES have low levels of csIgG, csIgG4, and csIgA. In particular, children with active FPIES to cow's milk have deficient T-cell mediated TGF-β responses to casein"
    explanation: Casein-specific antibody and TGF-beta deficits in milk FPIES.
  - reference: PMID:27545065
    reference_title: "Humoral and cellular responses to casein in patients with food protein-induced enterocolitis to cow's milk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found low levels of CM and casein-specific IgG and casein-specific IgG4 in patients with CM-FPIES versus those tolerating CM (P < .05)."
    explanation: Confirms the paucity of casein-specific humoral responses in cow's milk FPIES.
  - reference: PMID:27545065
    reference_title: "Humoral and cellular responses to casein in patients with food protein-induced enterocolitis to cow's milk."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Significantly lower secretion of IL-10 and higher secretion of IL-9 by casein-stimulated T cells were found in patients with CM-FPIES versus those with IgE-mediated CM allergy."
    explanation: Casein-stimulated T cells from FPIES patients show a low-IL-10 profile.
  - reference: PMID:15932382
    reference_title: Humoral and cellular responses to cow milk proteins in patients with milk-induced IgE-mediated and non-IgE-mediated disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relative lack of specific IgG4 production in patients with enterocolitis syndrome may be involved in the pathogenesis of the disease."
    explanation: Earlier study of casein and whey components reaching the same conclusion about low milk-specific IgG4.
  - reference: PMID:30275944
    reference_title: "Deep analysis of immune response and metabolic signature in children with food protein induced enterocolitis to cow's milk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In CM-FPIES, both humoral and cellular specific immune responses are weak or absent, and this is not related to CM avoidance."
    explanation: Independent cohort tested against whey and casein allergens and their digestion products, showing weak specific responses not explained by avoidance.
  downstream:
  - target: Systemic Innate Immune Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - innate_immune_activation_model
    description: >-
      Loss of the tolerogenic casein response is associated with active,
      reaction-prone milk FPIES; the intermediate steps by which this permits
      the innate reaction are unknown.
    evidence:
    - reference: PMID:25283440
      reference_title: The role of casein-specific IgA and TGF-β in children with food protein-induced enterocolitis syndrome to milk.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "rendering TGF-β a promising biomarker in identifying children who are likely to experience FPIES reactions to this allergen"
      explanation: The deficit tracks which children react on challenge, an association rather than a demonstrated causal step.
    - reference: PMID:27545065
      reference_title: "Humoral and cellular responses to casein in patients with food protein-induced enterocolitis to cow's milk."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "IL-10 might play a key role in acquisition of tolerance in patients with CM-FPIES."
      explanation: Authors propose IL-10 deficiency as part of failed tolerance; stated as a hypothesis.
- name: Food Antigen-Responsive T-Cell Activation
  description: >-
    T cells responsive to the trigger food (milk, soy or rice) are more
    frequent in active than in resolved FPIES, and casein stimulation elicits
    CD4+ T-cell proliferation with Th2 cytokines in cow's milk FPIES. Because
    similar responses occur in tolerant or IgE-allergic controls, these cells
    may track disease activity without being the effector mechanism. Pan-T-cell
    activation and redistribution from the circulation follow a positive
    challenge.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:28192147
    reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed that milk, soy, or rice-responsive T cells, and TNF-α-producing CD154+ T cells, were significantly lower in those with outgrown FPIES compared with those with active FPIES"
    explanation: Food-responsive T cells track disease activity.
  - reference: PMID:28192147
    reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed pan-T-cell activation and redistribution from the circulation after a positive food challenge but not in those who had outgrown their FPIES"
    explanation: In vivo T-cell activation accompanies positive challenges.
  - reference: PMID:27545065
    reference_title: "Humoral and cellular responses to casein in patients with food protein-induced enterocolitis to cow's milk."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although we found both a high CD4+ T cell-proliferative response and TH2 cytokines production after casein stimulation in children with CM-FPIES, results were similar to those in control subjects."
    explanation: Casein-reactive CD4+ T cells exist in milk FPIES but do not distinguish patients from controls.
  - reference: PMID:4039696
    reference_title: "Milk- and soy protein-induced enterocolitis: evidence for lymphocyte sensitization to specific food proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "for patients with positive cow's milk challenge the stimulation index was 6.0 when casein was used in the cultures"
    explanation: Casein-induced lymphocyte proliferation in challenge-positive milk FPIES.
  downstream:
  - target: Intestinal Inflammation with Increased Permeability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - antigen_specific_t_cell_model
    description: >-
      Under the T-cell model, food-specific T-cell activation drives intestinal
      inflammation and permeability; human data supporting a causal role are
      limited and contested.
    evidence:
    - reference: PMID:39022142
      reference_title: Food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "FPIES is believed to be secondary to intestinal inflammation after food antigen exposure and T-cell activation, which thereby leads to increased permeability of the gut and fluid shifting into the intestinal lumen."
      explanation: Review statement of the T-cell-driven inflammation model, presented as belief rather than demonstration.
- name: Systemic Innate Immune Activation
  description: >-
    Positive food challenges in active FPIES are followed by profound
    activation of circulating monocytes, neutrophils, natural killer cells and
    eosinophils, with transcriptional innate signatures and rises in serum
    IL-8 and IL-10, absent in children who have outgrown FPIES. Symptomatic
    reactions also carry an IL-17 family signature (IL-17A, IL-22, CCL20),
    with preferential activation of non-conventional T-cell populations.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: INCREASED
  - preferred_term: neutrophil activation
    term:
      id: GO:0042119
      label: neutrophil activation
    modifier: INCREASED
  - preferred_term: monocyte activation
    term:
      id: GO:0042117
      label: monocyte activation
    modifier: INCREASED
  - preferred_term: interleukin-17 production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: INCREASED
  evidence:
  - reference: PMID:33891982
    reference_title: Acute FPIES reactions are associated with an IL-17 inflammatory signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic FPIES challenge results were associated with significant elevation of levels of cytokines and chemokines, including IL-17 family markers (IL-17A, IL-22, IL-17C, and CCL20) and T-cell activation (IL-2), and innate inflammatory markers (IL-8, oncostatin M, leukemia inhibitory factor, TNF-α, IL-10, and IL-6)."
    explanation: Serum proteomics of symptomatic versus asymptomatic challenges shows an IL-17 and innate inflammatory signature.
  - reference: PMID:28192147
    reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Profiling of whole blood by CyTOF demonstrated profound activation of cells of the innate immune system after food challenge, including monocytes, neutrophils, natural killer cells, and eosinophils. Activation was not observed in children with outgrown FPIES."
    explanation: Mass cytometry of blood before and after challenge.
  - reference: PMID:27545065
    reference_title: "Humoral and cellular responses to casein in patients with food protein-induced enterocolitis to cow's milk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased serum IL-8 levels in patients with active FPIES suggest neutrophil involvement."
    explanation: Serum IL-8 rise after positive cow's milk challenge points to neutrophil activation.
  downstream:
  - target: Increased total neutrophil count
    causal_link_type: DIRECT
    hypothesis_groups:
    - innate_immune_activation_model
    evidence:
    - reference: PMID:28192147
      reference_title: Systemic innate immune activation in food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we confirmed a significant increase in circulating neutrophils in subjects who had reactions to food challenge, but not in those who had outgrown their FPIES"
      explanation: Neutrophilia accompanies the innate activation of a positive challenge.
  - target: Intestinal Inflammation with Increased Permeability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - innate_immune_activation_model
    description: >-
      Innate effector cells, together with locally produced TNF-alpha, are
      proposed to drive mucosal inflammation and loss of barrier function; the
      sequence has not been demonstrated directly in FPIES.
    evidence:
    - reference: PMID:25746969
      reference_title: Immunopathophysiology of food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Smears of fecal mucus from positive challenges reveal the presence of neutrophils, eosinophils, lymphocytes, and other unidentified mononuclear cells"
      explanation: Inflammatory cells appear in the intestinal lumen after positive challenges, linking the cellular reaction to mucosal inflammation.
    - reference: PMID:33891982
      reference_title: Acute FPIES reactions are associated with an IL-17 inflammatory signature.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The level of the mucosal damage marker regenerating family member 1 alpha (REG1A) was also significantly increased."
      explanation: A circulating mucosal damage marker rises with the inflammatory reaction, consistent with mucosal injury accompanying innate activation.
  - target: Enterochromaffin Serotonin Release and Emetic Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - innate_immune_activation_model
    description: >-
      FPIES reactions activate neuroendocrine as well as innate pathways; how
      the immune reaction recruits the serotonergic emetic reflex is not
      established; purinergic signaling is one candidate.
    evidence:
    - reference: PMID:33548465
      reference_title: Advances in understanding immune mechanisms of food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "growing evidence suggests a robust systemic innate immune activation occurring during FPIES reactions and the activation of neuroendocrine pathways"
      explanation: Co-activation of innate and neuroendocrine pathways during reactions; the connecting mechanism is unstated.
    - reference: PMID:36306938
      reference_title: Untargeted serum metabolomic analysis reveals a role for purinergic signaling in FPIES.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Activation of the purinergic pathway during FPIES reactions provides a possible mechanism connecting inflammation and vomiting by triggering serotonin release from gastric and duodenal mucosa."
      explanation: Proposes purinergic signaling as the link from inflammation to mucosal serotonin release; adenosine-induced serotonin release was shown in biopsies from donors without FPIES.
- name: Intestinal Inflammation with Increased Permeability
  description: >-
    Food-antigen exposure is believed to cause intestinal inflammation with
    increased permeability and fluid shift into the intestinal lumen. Early
    biopsy studies of milk-exposed infants showed altered intestinal
    architecture, mucosal TNF-alpha expression, and inflammatory cells in
    fecal mucus after challenge.
  biological_scale: TISSUE
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FPIES is believed to be secondary to intestinal inflammation after exposure to a food antigen, which thereby leads to increased permeability and fluid shifting into the intestinal lumen."
    explanation: Review statement of the mucosal inflammation and permeability model.
  - reference: PMID:25746969
    reference_title: Immunopathophysiology of food protein-induced enterocolitis syndrome.

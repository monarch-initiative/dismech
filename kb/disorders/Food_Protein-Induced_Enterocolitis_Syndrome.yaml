- name: Ondansetron
  description: >-
    Intramuscular or intravenous ondansetron (0.15 mg/kg, maximum 16 mg) for
    moderate to severe reactions in children older than 6 months; caution with
    arrhythmia because of QT prolongation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

environmental:
- name: Cow's milk protein ingestion
  description: >-
    Cow's milk protein, usually given as cow's milk-based infant formula, is
    the most common FPIES trigger in infancy and the main trigger of chronic
    FPIES. The caseins dominate the milk antigen response in IgE-mediated milk
    allergy, and they are the milk antigen most studied in FPIES, where
    casein-specific antibody and regulatory T-cell responses are deficient;
    whether casein or whey proteins are the operative FPIES antigens has not
    been resolved.

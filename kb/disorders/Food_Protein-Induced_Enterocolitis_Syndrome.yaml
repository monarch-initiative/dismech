diagnosis:
- name: Consensus clinical criteria for acute FPIES
  description: >-
    Acute FPIES is diagnosed with one major criterion (vomiting 1 to 4 hours
    after ingestion of the suspected food without IgE-mediated skin or
    respiratory symptoms) plus at least three minor criteria (repeated
    episodes, reaction to a different food, lethargy, pallor, emergency
    department visit, need for intravenous fluids, diarrhea within 24 hours,
    hypotension, hypothermia). Infectious gastroenteritis, sepsis, anatomic
    obstruction, necrotizing enterocolitis and anaphylaxis should be excluded.
    There is no diagnostic biomarker; absence of fever and a normal
    C-reactive protein favor FPIES over sepsis or gastroenteritis.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To diagnose acute FPIES, patients would require one major and three or more minor criteria. The major criterion includes vomiting 1-4 hours after ingestion of the suspected food and absence of IgE-mediated skin and respiratory symptoms."
    explanation: Summary of the 2017 international consensus diagnostic criteria.
  - reference: PMID:30722841
    reference_title: "Differentiating Acute Food Protein-Induced Enterocolitis Syndrome From Its Mimics: A Comparison of Clinical Features and Routine Laboratory Biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the young vomiting child, lethargy, floppiness, pallor without fever, and normal CRP should alert clinicians to a possible diagnosis of FPIES."
    explanation: Emergency department features distinguishing FPIES from its mimics.
- name: Consensus clinical criteria for chronic FPIES
  description: >-
    Chronic FPIES requires intermittent vomiting and/or diarrhea with regular
    ingestion of the food, resolution within days to weeks of elimination, and
    acute symptoms on reintroduction, confirmed by food challenge.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Regardless of the presentation type, patients with chronic FPIES must show resolution of the symptoms within days or weeks of removing the food trigger but will experience acute FPIES reactions after reintroduction of the food."
    explanation: Consensus chronic FPIES criterion as summarized in the review.
- name: Supervised oral food challenge
  description: >-
    The diagnostic standard when history is unclear and the means of
    detecting resolution, usually no sooner than 12 months after the last
    reaction; a positive challenge requires the major criterion plus at least
    two minor criteria, which include a neutrophil rise of at least 1,500/mm3
    above baseline. Food-specific IgE testing before challenge identifies
    atypical FPIES needing an IgE-mediated challenge protocol.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The criterion standard to diagnosing FPIES is through OFC; however, this is not always necessary if the patient's history is consistent with an FPIES reaction and all other diagnoses have been ruled out."
    explanation: Role of the oral food challenge in diagnosis.
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increased neutrophil count of ≥1500 neutrophils above the baseline count"
    explanation: Minor criterion for a positive FPIES oral food challenge (Table 4).
treatments:
- name: Trigger Food Avoidance
  description: >-
    Strict elimination of the trigger food, with dietetic support, regular
    growth monitoring and a written emergency plan; maternal dietary
    elimination is not recommended for a thriving, asymptomatic breastfed
    infant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: trigger food elimination diet
    term:
      id: NCIT:C219792
      label: Allergen Elimination Diet
  target_mechanisms:
  - target: Systemic Innate Immune Activation
    treatment_effect: INHIBITS
    description: Removing the trigger food prevents the antigen exposure that elicits reactions.
    evidence:
    - reference: PMID:39022142
      reference_title: Food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Management of FPIES requires strict avoidance of food triggers, and treatment requires rapid fluid rehydration."
      explanation: Avoidance is the core of management.
  evidence:
  - reference: PMID:31950904
    reference_title: Food Protein-Induced Enterocolitis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Management relies of avoidance of food triggers, treatment of accidental exposures, and periodic re-evaluations with supervised oral food challenges to monitor for resolution."
    explanation: Review summarizing management.
- name: Hypoallergenic Infant Formula
  description: >-
    For formula-fed infants with cow's milk or soy FPIES, an extensively
    hydrolyzed casein-based formula is typically recommended; a minority
    (10-20%) need an amino acid-based formula, and hydrolyzed formula has
    occasionally exacerbated FPIES.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: hypoallergenic formula feeding
    term:
      id: NCIT:C64892
      label: Therapeutic Dietary Intervention
  evidence:
  - reference: PMID:36426394
    reference_title: "Recent Update in Food Protein-Induced Enterocolitis Syndrome: Pathophysiology, Diagnosis, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "for formula-fed infants, extensively hydrolyzed casein-based formula is typically recommended"
    explanation: Guideline-concordant formula choice.
  - reference: PMID:36426394
    reference_title: "Recent Update in Food Protein-Induced Enterocolitis Syndrome: Pathophysiology, Diagnosis, and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Among these infants, 10%-20% require an amino acid-based formula (AAF)."
    explanation: Proportion requiring amino acid formula.
- name: Intravenous Fluid Resuscitation
  description: >-
    Oral rehydration for mild reactions; intravenous normal saline boluses
    (20 mL/kg, repeated as needed) for moderate to severe reactions, with
    correction of acid-base disturbance and methemoglobinemia. Epinephrine is
    not helpful.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_phenotypes:
  - preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  - preferred_term: Hypovolemic shock
    term:
      id: HP:0031274
      label: Hypovolemic shock
  target_mechanisms:
  - target: Intestinal Fluid Loss and Hypovolemia
    treatment_effect: RESTORES
    description: Volume replacement corrects the hypovolemia of moderate to severe reactions.
    evidence:
    - reference: PMID:39022142
      reference_title: Food protein-induced enterocolitis syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Oral hydration is attempted in patients with mild symptoms, whereas boluses of intravenous normal saline solution are administered in patients with moderate-to-severe FPIES."
      explanation: Fluid resuscitation is first-line treatment.
  evidence:
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "First-line treatment for an acute reaction includes oral or intravenous fluid rehydration."
    explanation: Fluid rehydration is first-line.
  - reference: PMID:39022142
    reference_title: Food protein-induced enterocolitis syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The use of epinephrine is not helpful in the management for an FPIES reaction."

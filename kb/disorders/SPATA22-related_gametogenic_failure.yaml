name: SPATA22-related gametogenic failure
creation_date: "2026-10-15T12:00:00Z"
category: Mendelian
description: >-
  SPATA22-related gametogenic failure is an autosomal recessive meiotic
  recombination disorder caused by biallelic loss-of-function variants in
  SPATA22. SPATA22 is a germ-cell-specific protein that forms an obligate
  heterodimer with MEIOB; the complex binds single-stranded DNA and associates
  with RPA at resected meiotic double-strand breaks. Without it, germ cells start
  meiotic recombination but cannot complete double-strand break repair or
  homolog synapsis, arrest in early meiotic prophase I and are lost. The same
  lesion presents as premature ovarian insufficiency in 46,XX individuals and as
  non-obstructive azoospermia with zygotene-like spermatogenic arrest in 46,XY
  individuals; the founding consanguineous family had affected members of both
  sexes.
disease_term:
  preferred_term: SPATA22-related gametogenic failure
  term:
    id: MONDO:0975843
    label: premature ovarian failure 25
parents:
- Primary ovarian insufficiency
- Male infertility
- Infertility disorder
synonyms:
- premature ovarian failure 25
- POF25
- spermatogenic failure 96
- SPGF96
- SPATA22 deficiency
notes: >-
  MONDO has no gene-level SPATA22 grouping class. It splits the presentations
  into MONDO:0975843 (premature ovarian failure 25; OMIM:621002) and
  MONDO:0975842 (spermatogenic failure 96; OMIM:621001), both naming SPATA22 as
  the causal gene. This entry follows the HFM1-, STAG3- and SYCE1-related
  gametogenic failure entries: one mechanism-first entry anchored on the ovarian
  term, with both MONDO classes carried as subtype rows, because the lesion, the
  MEIOB-SPATA22 recombination node and the meiotic arrest are shared and only
  the gamete lineage differs. A 2026 report (PMID:42098781) titles its POI
  pedigree "heterozygous", but the two variants it names, c.31C>T (p.Arg11Ter)
  and c.900+1G>A, are the same pair PMID:35285020 reported as compound
  heterozygous in a sporadic POI patient. The 2026 paper does not report their
  phase or per-individual segregation, so its human data are compatible with
  biallelic, recessive disease. Its claim that one variant suffices rests on a
  Spata22+/- mouse model, in which the authors also propose a non-meiotic
  granulosa-cell mechanism. That mechanism is not modelled here: the
  meiotic-arrest mechanism is the one supported by the biallelic human families
  and by the null mouse and rat models. The pedigree's clinical findings (four
  affected women with menstrual disturbance, raised FSH and low AMH) are
  recorded as POF25 phenotypes. No GeneReviews chapter covers SPATA22.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry homozygous or compound-heterozygous SPATA22
    loss-of-function variants; two of the three reported families are
    consanguineous.
  evidence:
  - reference: PMID:35285020
    reference_title: "Bi-allelic SPATA22 variants cause premature ovarian insufficiency and nonobstructive azoospermia due to meiotic arrest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing (WES) in members of a consanguineous
      family with two POI and two NOA patients to screen for potential
      pathogenic variants for familial POI and NOA. And a homozygous variant in
      SPATA22 (c.400C>T:p.R134X) was identified.
    explanation: >-
      A homozygous SPATA22 nonsense variant in a consanguineous family with
      affected women and men supports recessive inheritance.
  - reference: PMID:35285020
    reference_title: "Bi-allelic SPATA22 variants cause premature ovarian insufficiency and nonobstructive azoospermia due to meiotic arrest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One additional compound heterozygous variant in SPATA22 (c.900+1G>A and
      c.31C>T:p.R11X) was found in one patient with sporadic POI and validated
      by minigene assay.
    explanation: >-
      A second, compound-heterozygous genotype in an unrelated patient is
      consistent with biallelic (recessive) disease.
  - reference: PMID:34392356
    reference_title: "Whole-exome sequencing of consanguineous families with infertile men and women identifies homologous mutations in SPATA22 and MEIOB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous SPATA22 frameshift mutation (c.203del) was identified in a
      patient with non-obstructive azoospermia (NOA) from a consanguineous
      Pakistani family
    explanation: >-
      An independent homozygous SPATA22 loss-of-function allele in a second
      consanguineous family supports recessive inheritance.

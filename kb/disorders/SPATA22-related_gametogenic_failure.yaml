genetic:
- name: SPATA22
  gene_term:
    preferred_term: SPATA22
    term:
      id: hgnc:30705
      label: SPATA22
  association: Causative (Primary)
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:35285020
    reference_title: "Bi-allelic SPATA22 variants cause premature ovarian insufficiency and nonobstructive azoospermia due to meiotic arrest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this is the first report identifying SPATA22 as the causative gene
      for human POI.
    explanation: >-
      Establishes SPATA22 as the causal gene for the ovarian presentation.
  - reference: PMID:34392356
    reference_title: "Whole-exome sequencing of consanguineous families with infertile men and women identifies homologous mutations in SPATA22 and MEIOB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, our study suggests that SPATA22 and MEIOB may both be causative
      genes for human infertility.
    explanation: >-
      An independent family supports SPATA22 as a cause of male infertility;
      the authors state the conclusion cautiously.
  notes: >-
    SPATA22 encodes a germ-cell-specific partner of MEIOB. Three biallelic
    families or probands are published with phase-consistent genotypes
    (PMID:35285020: one consanguineous homozygous family and one sporadic
    compound heterozygote; PMID:34392356: one consanguineous homozygous
    family). A fourth pedigree (PMID:42098781) carries the same two variants as
    the PMID:35285020 compound heterozygote with phase not reported, so it is
    probably a further biallelic family. No ClinGen
    gene-disease validity classification was found for this pair, so
    gene_disease_validity is left absent.

pathophysiology:
- name: Loss of MEIOB-SPATA22 single-stranded DNA binding
  conforms_to: "meiotic_prophase_failure#Homologous Recombination Repair of Meiotic DNA Breaks"
  biological_scale: MOLECULAR
  description: >-
    SPATA22 and MEIOB form an obligate meiosis-specific heterodimer that
    resembles RPA, binds single-stranded DNA and associates with RPA-coated
    single-stranded DNA at resected meiotic double-strand breaks. Purified human
    SPATA22 binds single-stranded DNA on its own, and the heterodimer binds it
    more strongly than either protein alone. The two proteins stabilize each
    other: Spata22-null meiocytes fail to localize MEIOB and make less of it,
    and the patient frameshift c.203del abolishes the SPATA22-MEIOB interaction.
    Biallelic SPATA22 loss therefore removes the complex from recombination
    intermediates.
  genes:
  - preferred_term: SPATA22
    term:
      id: hgnc:30705
      label: SPATA22
  - preferred_term: MEIOB
    term:
      id: hgnc:28569
      label: MEIOB
  molecular_functions:
  - preferred_term: single-stranded DNA binding
    term:
      id: GO:0003697
      label: single-stranded DNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:33812231
    reference_title: "The meiosis-specific MEIOB-SPATA22 complex cooperates with RPA to form a compacted mixed MEIOB/SPATA22/RPA/ssDNA complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that like MEIOB, SPATA22 resembles RPA subunits and binds
      ssDNA.
    explanation: >-
      Direct biochemical evidence that SPATA22 itself has single-stranded DNA
      binding activity, the molecular function lost on biallelic loss.
  - reference: PMID:40296718
    reference_title: "New feature of hMEIOB and hSPATA22 binding to ssDNA from a single-molecule perspective."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results show that hMEIOB has low ssDNA-binding affinity and stability
      alone, but hSPATA22 binds to ssDNA faster and more stably and promotes
      ssDNA condensation. Strong binding affinity and stability to ssDNA are
      present when the hMEIOB-hSPATA22 heterodimer is formed.
    explanation: >-
      Confirms single-stranded DNA binding by the human SPATA22 protein and by
      the MEIOB-SPATA22 heterodimer.
  - reference: PMID:28453612
    reference_title: "Meiosis-specific proteins MEIOB and SPATA22 cooperatively associate with the single-stranded DNA-binding replication protein A complex and DNA double-strand breaks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that MEIOB and SPATA22 form an obligate complex and contain
      defined interaction domains.
    explanation: >-
      Places SPATA22 in an obligate complex with MEIOB, so SPATA22 loss removes
      the complex.
  - reference: PMID:28453612
    reference_title: "Meiosis-specific proteins MEIOB and SPATA22 cooperatively associate with the single-stranded DNA-binding replication protein A complex and DNA double-strand breaks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, MEIOB and SPATA22 are recruited to induced DNA double-strand
      breaks (DSBs) together but not alone.
    explanation: >-
      The complex is recruited to double-strand breaks only as a pair, which is
      why loss of SPATA22 removes MEIOB function at breaks as well.
  - reference: PMID:28297563
    reference_title: "Spermatogenesis associated 22 is required for DNA repair and synapsis of homologous chromosomes in mouse germ cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of Spata22Gt/Gt meiocytes confirms that SPATA22 is required for
      localization of MEIOB but not RPA (two proteins known to interact with
      SPATA22), and immunoblotting corroborates that production of MEIOB is
      indeed decreased in the absence of SPATA22.
    explanation: >-
      In null mouse meiocytes, SPATA22 loss also depletes and mislocalizes its
      partner MEIOB.
  - reference: PMID:34392356
    reference_title: "Whole-exome sequencing of consanguineous families with infertile men and women identifies homologous mutations in SPATA22 and MEIOB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The SPATA22 mutation destroyed the interaction with MEIOB.
    explanation: >-
      The patient frameshift allele was tested in cultured cells and abolished
      binding to MEIOB, linking the human variant to loss of the complex.
  downstream:
  - target: Failed meiotic recombination and homolog synapsis
    causal_link_type: DIRECT
    description: >-
      Without the MEIOB-SPATA22 complex on single-stranded DNA, meiotic
      double-strand breaks are formed but not repaired and homologs do not
      synapse.
    evidence:
    - reference: PMID:34392356
      reference_title: "Whole-exome sequencing of consanguineous families with infertile men and women identifies homologous mutations in SPATA22 and MEIOB."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Meiob and Spata22 knockout mice have the same phenotypes: mutant
        spermatocytes can initiate meiotic recombination but are unable to
        complete DSB repair, leading to crossover formation failure, meiotic
        prophase arrest, and sterility.
      explanation: >-
        Background statement of the mouse knockout phenotype: loss of either
        partner leaves meiotic double-strand breaks unrepaired.
- name: Failed meiotic recombination and homolog synapsis
  conforms_to: "meiotic_prophase_failure#Homologous Recombination Repair of Meiotic DNA Breaks"
  biological_scale: CELLULAR
  description: >-
    SPATA22-deficient germ cells initiate programmed meiotic double-strand
    breaks but cannot complete their repair. RPA foci form normally while RAD51
    foci are not maintained, consistent with a defect in the presynaptic step,
    and homologous chromosomes fail to synapse.

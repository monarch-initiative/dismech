    modifier: DECREASED
  evidence:
  - reference: PMID:22011390
    reference_title: "Spata22, a novel vertebrate-specific gene, is required for meiotic progress in mouse germ cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Spata22 gene is essential for one or more key events of early meiotic
      prophase, as homologous chromosomes of mutant germ cells do not achieve
      normal synapsis or repair meiotic DNA double-strand breaks.
    explanation: >-
      In repro42 (Spata22 nonsense) mice, germ cells fail both synapsis and
      meiotic double-strand break repair.
  - reference: PMID:28297563
    reference_title: "Spermatogenesis associated 22 is required for DNA repair and synapsis of homologous chromosomes in mouse germ cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cytological examination confirms that germ cells do not progress beyond
      zygonema and meiotic arrest is linked to impairment of both synapsis and
      DNA repair.
    explanation: >-
      An independent null Spata22 allele reproduces the synapsis and DNA repair
      defect.
  - reference: PMID:25142975
    reference_title: "Genetic evidence suggests that Spata22 is required for the maintenance of Rad51 foci in mammalian meiosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that both formation and maintenance of Rpa foci are
      independent of Spata22, and the maintenance, but not the formation, of
      Rad51 foci requires Spata22.
    explanation: >-
      In Spata22-deficient rats, the recombination defect lies downstream of RPA
      loading, at maintenance of RAD51 on resected DNA.

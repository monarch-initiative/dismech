    evidence:
    - reference: PMID:33129256
      reference_title: "A novel PIK3R1 mutation of SHORT syndrome in a Chinese female with diffuse thyroid disease: a case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        almost all postpubertal women affected present polycystic ovary syndrome
      explanation: >-
        Records the near-universal ovarian phenotype in postpubertal affected women.

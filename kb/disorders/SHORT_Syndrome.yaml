      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PIK3R1 variants segregate in an autosomal dominant manner. Both de
    novo and inherited variants are reported, and the recurrent p.Arg649Trp allele
    has been observed to segregate with the phenotype in multigenerational families
    as well as arising de novo.
  evidence:
  - reference: PMID:23980586
    reference_title: PIK3R1 mutations in SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SHORT syndrome (OMIM 269880) is a rare autosomal-dominant disorder
    explanation: >-
      States the mode of inheritance directly.
  - reference: PMID:23810378
    reference_title: PIK3R1 mutations cause syndromic insulin resistance with lipoatrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, we identified in nine affected individuals from eight families de
      novo or inherited PIK3R1 mutations
    explanation: >-
      Records that both de novo and inherited heterozygous alleles occur, which is
      what makes the dominant transmission observable across families.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    An upper bound rather than an estimate. The cited source states explicitly that
    the prevalence is unclear and gives only a ceiling, so no point rate is
    recorded here. Cohort sizes in the literature are consistent with an ultra-rare
    disorder: the largest systematically phenotyped series comprised 32 individuals
    with a confirmed PIK3R1 variant.
  evidence:
  - reference: PMID:33129256
    reference_title: "A novel PIK3R1 mutation of SHORT syndrome in a Chinese female with diffuse thyroid disease: a case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A few cases have been reported in the literature, but the prevalence of SHORT
      syndrome remains unclear
    explanation: >-
      The source declines to give a point estimate; only the ceiling that follows in
      the same sentence is quantitative, which is why this record carries a class
      and no rate.
  - reference: PMID:26497935
    reference_title: "Clinical reappraisal of SHORT syndrome with PIK3R1 mutations: toward recommendation for molecular testing and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The detailed phenotypes of 32 individuals with SHORT syndrome and PIK3R1
      mutation, including eight newly ascertained individuals, were studied to fully
      define the syndrome and the indications for PIK3R1 testing.
    explanation: >-
      The size of the largest systematically phenotyped molecularly confirmed cohort,
      which bounds how much is known about the disorder's occurrence.
pathophysiology:
- name: PIK3R1 C-terminal SH2 Domain Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous PIK3R1 variants cluster in exon 14, which encodes the C-terminal
    SH2 domain of the p85-alpha regulatory subunit. The reported allele spectrum
    comprises missense, frameshift and nonsense changes, all of which spare the
    N-terminal half of the protein, and c.1945C>T (p.Arg649Trp) recurs across
    unrelated families as a mutational hotspot. PIK3R1 also encodes the p55-alpha
    and p50-alpha subunits, so a single allele perturbs the regulatory arm of every
    class IA PI3K holoenzyme in which those subunits participate.
  genes:
  - preferred_term: PIK3R1
    term:
      id: hgnc:8979
      label: PIK3R1
  molecular_functions:
  - preferred_term: p85-alpha PI3K regulatory subunit activity
    term:
      id: GO:0035014
      label: phosphatidylinositol 3-kinase regulator activity
    modifier: ABNORMAL
  downstream:
  - target: Impaired p85-alpha Binding to IRS-1
    causal_link_type: DIRECT
    description: >-
      The variant SH2 domain is the surface through which p85-alpha docks onto
      tyrosine-phosphorylated IRS-1, so a change in this domain acts directly on
      that interaction.
    evidence:
    - reference: PMID:23810379
      reference_title: SHORT syndrome with partial lipodystrophy due to impaired phosphatidylinositol 3 kinase signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This mutation led to impaired interaction between p85α and IRS-1 and reduced
        AKT-mediated insulin signaling in fibroblasts from affected subjects
      explanation: >-
        Directly links the hotspot variant to loss of the p85-alpha/IRS-1 interaction.
  evidence:
  - reference: PMID:23810382
    reference_title: Mutations in PIK3R1 cause SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing in a family trio of an affected child and unaffected
      parents identified a de novo frameshift insertion, c.1906_1907insC
    explanation: >-
      The exome finding that identified PIK3R1 as the SHORT syndrome gene, and the
      first of the exon 14 alleles.
  - reference: PMID:23810378
    reference_title: PIK3R1 mutations cause syndromic insulin resistance with lipoatrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified in nine affected individuals from eight families de novo or
      inherited PIK3R1 mutations, including a mutational hotspot
    explanation: >-
      Establishes p.Arg649Trp as a recurrent allele across unrelated families.
  - reference: PMID:23810378
    reference_title: PIK3R1 mutations cause syndromic insulin resistance with lipoatrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIK3R1 encodes the p85α, p55α, and p50α regulatory subunits of class IA
      phosphatidylinositol 3 kinases (PI3Ks), which are known to play a key role in
      insulin signaling.
    explanation: >-
      States which gene products are affected and why a regulatory-subunit defect
      reaches insulin signalling.
- name: Impaired p85-alpha Binding to IRS-1
  biological_scale: MOLECULAR
  description: >-
    Recruitment of class IA PI3K to the activated insulin receptor depends on the
    p85-alpha SH2 domains engaging phosphotyrosine motifs on IRS-1. The SHORT
    syndrome hotspot variant impairs that interaction, so the catalytic p110 subunit
    is not brought to its membrane substrate after insulin stimulation. This is the
    step that makes the disease a post-receptor defect: the insulin receptor itself
    is intact.
  molecular_functions:
  - preferred_term: p85-alpha binding to IRS-1
    term:
      id: GO:0043560
      label: insulin receptor substrate binding
    modifier: DECREASED
  downstream:
  - target: Reduced PI3K-AKT Signal Transduction
    causal_link_type: DIRECT
    description: >-
      Failure to recruit the holoenzyme to IRS-1 is the immediate cause of reduced
      downstream AKT and S6 phosphorylation.
    evidence:
    - reference: PMID:23810382
      reference_title: Mutations in PIK3R1 cause SHORT syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies on lymphoblastoid cells with the PIK3R1 c.1906_1907insC
        mutation showed decreased phosphorylation of the downstream S6 target of the
        PI3K-AKT-mTOR pathway.
      explanation: >-
        Measures the downstream consequence in patient-derived cells.
  evidence:
  - reference: PMID:23810379
    reference_title: SHORT syndrome with partial lipodystrophy due to impaired phosphatidylinositol 3 kinase signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation led to impaired interaction between p85α and IRS-1 and reduced
      AKT-mediated insulin signaling in fibroblasts from affected subjects and in
      reconstituted Pik3r1-knockout preadipocytes.
    explanation: >-
      Demonstrates the binding defect in both patient fibroblasts and a reconstituted
      preadipocyte system.
- name: Reduced PI3K-AKT Signal Transduction
  biological_scale: CELLULAR
  description: >-
    Downstream of the failed IRS-1 interaction, phosphorylation of AKT and of the
    more distal S6 target is reduced in patient-derived cells. The defect is not
    confined to one branch of the cascade: proximal and distal PI3K-dependent
    signalling are both impaired, which is why one molecular lesion produces a
    phenotype spanning growth, adipose tissue and glucose metabolism.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: PI3K-AKT signal transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: DECREASED
  downstream:
  - target: Post-receptor Insulin Resistance
    causal_link_type: DIRECT
    description: >-
      Reduced PI3K-dependent signalling downstream of an intact insulin receptor is
      what post-receptor insulin resistance consists of at the cellular level.
    evidence:
    - reference: PMID:23810378
      reference_title: PIK3R1 mutations cause syndromic insulin resistance with lipoatrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional data from fibroblasts derived from individuals with PIK3R1
        mutations showed severe insulin resistance for both proximal and distal
        PI3K-dependent signaling.
      explanation: >-
        Shows the signalling defect is present at both proximal and distal levels of
        the cascade in patient cells.
  - target: Impaired Adipocyte Differentiation
    causal_link_type: DIRECT
    description: >-
      PI3K activity is required for adipose differentiation, so the same reduction in
      signalling that impairs insulin action also constrains adipogenesis.
    evidence:
    - reference: PMID:23810379
      reference_title: SHORT syndrome with partial lipodystrophy due to impaired phosphatidylinositol 3 kinase signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Normal PI3K activity is critical for adipose differentiation and insulin
        signaling
      explanation: >-
        States the dependency of adipose differentiation on PI3K activity that this
        edge asserts.
  - target: Impaired Insulin Secretion and Incretin Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PI3K signalling operates in the beta cell as well as in insulin target tissues, so
      the secretory defect seen in the knock-in mouse plausibly shares this upstream
      lesion. The intervening steps in the islet are not established.
    evidence:
    - reference: PMID:26974159
      reference_title: PI3-kinase mutation linked to insulin and growth factor resistance in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data demonstrate the ability of this heterozygous mutation to alter PI3K
        activity in vivo and the central role of PI3K in insulin/growth factor action,
        adipocyte function, and glucose metabolism.
      explanation: >-
        Places the secretory defect within the same in vivo PI3K lesion. The islet
        mechanism itself is not resolved, hence unknown intermediates.
      directness: INDIRECT
  - target: Progeroid Craniofacial and Dental Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The craniofacial and dental features segregate with PIK3R1 variants and are, on
      systematic appraisal, the most consistent part of the phenotype. No developmental
      mechanism connecting reduced PI3K signalling to them is established, so the edge is
      drawn with unknown intermediates rather than omitted.
    evidence:
    - reference: PMID:34212753
      reference_title: "SHORT Syndrome: Systematic Appraisal of the Medical and Dental Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Facial dysmorphism including ocular depression, triangular shaped face, frontal
        bossing, large low-set ears, and micrognathia were the most consistent features
      explanation: >-
        Establishes the craniofacial gestalt as the most consistent element of the
        syndrome, which is what makes it worth a node despite the missing mechanism.
      directness: INDIRECT
  - target: Anterior Segment Dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The anterior chamber phenotype is attributed to the same signalling defect because
      it segregates with PIK3R1 variants, but no developmental route from reduced PI3K
      signalling to neural-crest-derived anterior segment formation is established. The
      edge is drawn with unknown intermediates rather than left disconnected, because
      leaving it disconnected would imply an independent cause the evidence does not
      support.
    evidence:
    - reference: PMID:23810379
      reference_title: SHORT syndrome with partial lipodystrophy due to impaired phosphatidylinositol 3 kinase signaling.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        in two unrelated families affected by partial lipodystrophy, low body mass index,
        short stature, progeroid face, and Rieger anomaly (SHORT syndrome)
      explanation: >-
        Rieger anomaly segregates with the same variant as the metabolic and growth
        features, which is the basis for placing it downstream of the shared signalling
        lesion. It is co-segregation, not a demonstrated developmental mechanism.
      directness: INDIRECT
  - target: Impaired Growth Signalling
    causal_link_type: DIRECT
    description: >-
      The PI3K-AKT-mTOR axis drives cell growth and proliferation, so its
      downregulation is the proposed route from the variant to the growth phenotype.
    evidence:
    - reference: PMID:23810382
      reference_title: Mutations in PIK3R1 cause SHORT syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PIK3R1 is involved in the phosphatidylinositol 3 kinase (PI3K) signaling
        cascade and, as such, plays an important role in cell growth, proliferation,
        and survival.
      explanation: >-
        The authors' statement of the pathway's growth role, which is the basis for
        attributing the growth restriction to pathway downregulation. This is an
        inference about the pathway rather than a measurement in growth plate tissue.
      directness: INDIRECT
  evidence:
  - reference: PMID:23810382
    reference_title: Mutations in PIK3R1 cause SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that PIK3R1 mutations are the major cause of SHORT syndrome
      and suggest that the molecular mechanism of disease might involve
      downregulation of the PI3K-AKT-mTOR pathway.
    explanation: >-
      The authors' own summary of the proposed mechanism. Note the hedge in the
      original ("might involve") is preserved here rather than upgraded.
- name: Post-receptor Insulin Resistance
  biological_scale: ORGANISM
  description: >-
    Insulin resistance in SHORT syndrome arises below the receptor, in the PI3K arm
    of the cascade. Clinically this presents as severe insulin resistance with
    compensatory hyperinsulinaemia, progressing in some patients to diabetes,
    typically in the second decade.
  biological_processes:
  - preferred_term: insulin receptor signaling pathway
    term:
      id: GO:0008286
      label: insulin receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: Insulin resistance
    causal_link_type: DIRECT
    description: >-
      The cellular signalling defect is the mechanism of the clinical insulin
      resistance.
    evidence:
    - reference: PMID:23810378
      reference_title: PIK3R1 mutations cause syndromic insulin resistance with lipoatrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings extend the genetic causes of severe insulin-resistance syndromes
      explanation: >-
        Places SHORT syndrome among the severe insulin-resistance syndromes.
  - target: Diabetes mellitus
    causal_link_type: DIRECT
    description: >-
      Sustained severe insulin resistance is the route to diabetes in this disorder.
    evidence:
    - reference: PMID:33129256
      reference_title: "A novel PIK3R1 mutation of SHORT syndrome in a Chinese female with diffuse thyroid disease: a case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Severe insulin resistance may also lead to an early onset of type 2 diabetes,
        typically occurring in the second decade of life
      explanation: >-
        States both the causal step and its usual timing.
  - target: Dissociation of Insulin Resistance from Dyslipidaemia
    causal_link_type: DIRECT
    description: >-
      The insulin resistance of SHORT syndrome does not carry the metabolic company it
      usually keeps. This is not an absence of findings but a positive, discriminating
      feature.
    evidence:
    - reference: PMID:27766312
      reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four of 5 patients had extreme insulin resistance without dyslipidemia or hepatic
        steatosis.
      explanation: >-
        The counted observation that defines this node.
  - target: Polycystic ovaries
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hyperinsulinaemia secondary to insulin resistance is the conventional route to

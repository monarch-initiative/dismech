genetic:
- name: PIK3R1 pathogenic variants
  gene_term:
    preferred_term: PIK3R1
    term:
      id: hgnc:8979
      label: PIK3R1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported alleles are heterozygous and cluster in exon 14, encoding the C-terminal
    SH2 domain of p85-alpha; they include missense (recurrently c.1945C>T,
    p.Arg649Trp), frameshift (c.1906_1907insC, p.Asn636Thrfs*18) and nonsense
    (c.1971T>G, p.Tyr657*; c.1960C>T, p.Gln654*) changes. The domain clustering is the
    clinically load-bearing observation: variants elsewhere in the same gene, notably
    splice-site changes affecting the inter-SH2 region, cause activated PI3K-delta
    syndrome 2 instead, which has the opposite effect on PI3K signalling. This entry
    does not assign a `functional_impact_category`: the reported functional data
    establish that pathway signalling is reduced, but none of the cited sources
    distinguishes haploinsufficiency from a dominant-negative action of the mutant
    subunit, and the recurrent missense hotspot in a heterozygous state is compatible
    with either.
  evidence:
  - reference: PMID:23810382
    reference_title: Mutations in PIK3R1 cause SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations in exon 14 of PIK3R1 were subsequently identified by
      Sanger sequencing in three additional affected individuals and two affected
      family members.
    explanation: >-
      Establishes the exon 14 clustering across multiple affected individuals.
  - reference: PMID:23810382
    reference_title: Mutations in PIK3R1 cause SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other mutation, a de novo truncating mutation
    explanation: >-
      A truncating allele in the same region, showing the spectrum is not restricted
      to missense changes.
  - reference: PMID:23980586
    reference_title: PIK3R1 mutations in SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these families had a recurrent missense mutation (c.1945C>T;
      p.Arg649Trp).
    explanation: >-
      Quantifies the recurrence of the hotspot allele across reported families.
  - reference: PMID:33129256
    reference_title: "A novel PIK3R1 mutation of SHORT syndrome in a Chinese female with diffuse thyroid disease: a case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing result indicated c.1960C > T of PIK3R1 gene a novel nonsense
      mutation, leading to the termination of protein translation
    explanation: >-
      An additional nonsense allele in the same region.
  variants:
  - name: PIK3R1 c.1945C>T (p.Arg649Trp)
    description: >-
      The recurrent hotspot allele, accounting for the majority of reported cases. It
      substitutes an arginine in the C-terminal SH2 domain of p85-alpha. Two lines of
      functional work place it as dominant negative rather than simply hypomorphic:

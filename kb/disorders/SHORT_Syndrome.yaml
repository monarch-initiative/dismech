    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Obesity-related insulin resistance is associated with fatty liver, dyslipidemia, and
      low plasma adiponectin. Insulin resistance due to insulin receptor (INSR) dysfunction
      is associated with none of these
    explanation: >-
      The comparison that gives the dissociation its meaning: which group SHORT syndrome
      resembles is a statement about where in the cascade the lesion is.
  - reference: PMID:27766312
    reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIK3R1 C-terminal mutations impair insulin signaling only in some cellular contexts

name: SHORT Syndrome
creation_date: "2026-09-01T14:07:00Z"
description: >-
  SHORT syndrome is a rare autosomal dominant multisystem disorder caused by
  heterozygous variants in PIK3R1, which encodes the p85-alpha, p55-alpha and
  p50-alpha regulatory subunits of class IA phosphatidylinositol 3-kinase. The
  causal variants cluster in exon 14, in the C-terminal SH2 domain, with a
  recurrent p.Arg649Trp hotspot; they impair the interaction between p85-alpha and
  IRS-1 and reduce AKT-mediated insulin signalling, so the disease is a
  post-receptor defect of PI3K-AKT signal transduction rather than of the insulin
  receptor itself. The acronym records short stature, hyperextensibility of joints
  and/or inguinal hernia, ocular depression, Rieger anomaly and teething delay, but
  systematic phenotyping of a PIK3R1-confirmed cohort showed that these classic
  features are not universally present; intrauterine and postnatal growth
  restriction, lipoatrophy and a characteristic facial gestalt are the features
  most consistently seen, with anterior chamber defects and insulin resistance or
  diabetes less prevalent. Because the same gene also causes activated PI3K-delta
  syndrome 2 through a different class of variant with the opposite effect on
  signalling, PIK3R1 genotype alone does not predict which phenotype a patient will
  have, and rare individuals manifest both.
synonyms:
- Short stature, hyperextensibility of joints, ocular depression, Rieger anomaly and teething delay
- Lipodystrophy, partial, with Rieger anomaly and short stature
- Rieger anomaly-partial lipodystrophy syndrome
- Aarskog-Ose-Pande syndrome
- PIK3R1-related SHORT syndrome

progression:
- phase: Pubertal emergence of insulin-resistant diabetes
  notes: >-
    The metabolic phenotype has a clear temporal structure. Insulin resistance is
    detectable in childhood, but overt diabetes characteristically appears around or after
    puberty. In the literature review accompanying the case report, insulin-resistant
    diabetes had developed in 10 of 15 growth-hormone-untreated patients aged 12 or over,
    and in none of the three treated or six untreated patients aged 10 or under. That
    contrast is what separates an age effect from a treatment effect, and it sets the
    surveillance interval: glucose monitoring matters most from puberty onward.
  evidence:
  - reference: PMID:32879144
    reference_title: "Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent literature review for patients with molecularly confirmed SHORT syndrome
      revealed the development of IRDM in 10 of 15 GH-untreated patients aged 12 years but
      in none of three GH-treated and six GH-untreated patients aged 10 years.
    explanation: >-
      The age-stratified counts. Note the cached text has lost the inequality signs from
      the original "aged 12 years" and "aged 10 years", which in the source read as at
      least 12 and at most 10; the description states the intended reading.
- phase: Diabetes onset in the second decade
  notes: >-
    Consistent with the age-stratified counts, narrative reviews place the onset of type 2
    diabetes in the second decade of life.
  evidence:
  - reference: PMID:33129256
    reference_title: "A novel PIK3R1 mutation of SHORT syndrome in a Chinese female with diffuse thyroid disease: a case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe insulin resistance may also lead to an early onset of type 2 diabetes,
      typically occurring in the second decade of life
    explanation: >-
      An independent statement of the same timing.
animal_models:
- name: Pik3r1 R649W knock-in mouse
  species: Mouse
  genotype: Pik3r1 Arg649Trp heterozygous knock-in
  publication: PMID:26974159
  description: >-
    A heterozygous knock-in of the human hotspot allele, and the load-bearing model for
    this disease. It reproduces the growth, adipose and metabolic phenotype together, which
    is what allows the three arms of the human phenotype to be attributed to one signalling
    lesion rather than to three coincident ones.
  modeled_mechanisms:
  - target: Reduced PI3K-AKT Signal Transduction
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model demonstrates the signalling defect in vivo, across the three tissues that
      matter for the human phenotype, rather than only in cultured patient cells.
    limitations: >-
      A mouse carrying one human allele. The ocular and dental components of the human
      syndrome are not reported for this model, so it speaks to the metabolic and growth
      arms only.
    readouts:
    - name: Insulin and growth-factor-stimulated PI3K activation in liver, muscle and fat
      target: Reduced PI3K-AKT Signal Transduction
      direction: DECREASED
      interpretation: >-
        The in vivo counterpart of the reduced AKT and S6 phosphorylation measured in
        patient cells.
      evidence:
      - reference: PMID:26974159
        reference_title: PI3-kinase mutation linked to insulin and growth factor resistance in vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These derangements were associated with a reduced capacity of insulin and other
          growth factors to activate PI3K in liver, muscle, and fat
        explanation: >-
          The tissue-level measurement behind this readout.
    evidence:
    - reference: PMID:26974159
      reference_title: PI3-kinase mutation linked to insulin and growth factor resistance in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data demonstrate the ability of this heterozygous mutation to alter PI3K
        activity in vivo and the central role of PI3K in insulin/growth factor action,
        adipocyte function, and glucose metabolism.
      explanation: >-
        The authors' summary of what the model establishes.
  - target: Impaired Adipocyte Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Partial lipodystrophy is reproduced, alongside the reduced body weight and length.
    limitations: >-
      Regional distribution of the fat loss is not reported in the same terms as the human
      facial and upper-limb pattern, so the correspondence is at the level of "partial
      lipodystrophy" rather than of its anatomy.
    readouts:
    - name: Body weight, length and adipose mass
      target: Impaired Adipocyte Differentiation
      direction: DECREASED
      interpretation: >-
        The growth and adipose phenotype in the model.
      evidence:
      - reference: PMID:26974159
        reference_title: PI3-kinase mutation linked to insulin and growth factor resistance in vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Similar to the patients, mutant mice exhibited a reduction in body weight and
          length, partial lipodystrophy, and systemic insulin resistance.
        explanation: >-
          The three-way phenotypic correspondence with patients.
    evidence:
    - reference: PMID:26974159
      reference_title: PI3-kinase mutation linked to insulin and growth factor resistance in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similar to the patients, mutant mice exhibited a reduction in body weight and
        length, partial lipodystrophy, and systemic insulin resistance.
      explanation: >-
        Establishes the model's fidelity for the adipose arm.
  - target: Dissociation of Insulin Resistance from Dyslipidaemia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Challenged with a high-fat diet or crossed onto an obese background, the mutant mice
      are protected from obesity and hepatic steatosis while becoming more diabetic. That
      is the mouse form of the human dissociation, and it separates the two effects
      experimentally in a way patient observation cannot.
    limitations: >-
      The mouse experiments impose obesogenic challenges that patients are not subjected
      to, so the protection is demonstrated under conditions with no human counterpart. The
      direction of the dissociation matches; its magnitude in unchallenged animals is not
      reported here.
    readouts:
    - name: Adiposity and hepatic steatosis under obesogenic challenge
      target: Dissociation of Insulin Resistance from Dyslipidaemia
      direction: DECREASED
      interpretation: >-
        Less fat and less fatty liver despite worse glycaemia, which is the dissociation.
      evidence:
      - reference: PMID:29724723
        reference_title: Mice Carrying a Dominant-Negative Human PI3K Mutation Are Protected From Obesity and Hepatic Steatosis but Not Diabetes.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the ob/ob mice carrying the heterozygous R649W mutation were protected from
          obesity and hepatic steatosis but developed a severe diabetic state
        explanation: >-
          The clearest statement of the dissociation, in the genetically obese cross.
    evidence:
    - reference: PMID:29724723
      reference_title: Mice Carrying a Dominant-Negative Human PI3K Mutation Are Protected From Obesity and Hepatic Steatosis but Not Diabetes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        despite the lower level of adiposity, the HFD knock-in mice are more hyperglycemic
        and more insulin-resistant than HFD-fed control mice
      explanation: >-
        The dissociation under dietary challenge: less adiposity, worse glycaemia.
differential_diagnoses:
- name: Activated PI3K-delta syndrome 2
  description: >-
    The other PIK3R1-related disease. It is caused by a different class of variant in
    the same gene, acting in the opposite direction on PI3K signalling, and presents as
    a primary immunodeficiency. The two are not mutually exclusive: individuals with
    both phenotypes have been reported, so finding a PIK3R1 variant does not settle
    which disease a patient has.
  evidence:
  - reference: PMID:28302518
    reference_title: "Mutations in PIK3R1 can lead to APDS2, SHORT syndrome or a combination of the two."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PIK3R1 gene have been associated to two different conditions: a
      primary immunodeficiency, called APDS2, of recent description and SHORT
      syndrome.
    explanation: >-
      Establishes that one gene underlies both entities.
discussions:
- discussion_id: pik3r1_allelic_direction
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How do PIK3R1 variants that reduce PI3K-AKT signalling (SHORT syndrome) and
    PIK3R1 variants that increase p110-delta activity (APDS2) coexist in the same
    patients, and what determines which phenotype a given allele produces?
  attaches_to:
  - pathophysiology#Reduced PI3K-AKT Signal Transduction
  - pathophysiology#PIK3R1 C-terminal SH2 Domain Variant
  rationale: >-
    The two PIK3R1 diseases are usually described as having opposite effects on the
    pathway, which makes their co-occurrence in one individual mechanistically
    awkward rather than merely unusual. Reported overlap cases show it is not a
    theoretical concern: two further patients with both phenotypes were described in
    2017, taking the total beyond the single previously known case, and the authors
    concluded the association may not be rare. Resolving this matters for curation
    because it determines whether the two entries can keep independent pathographs or
    whether a shared allele-to-phenotype model is needed.
  evidence:
  - reference: PMID:28302518
    reference_title: "Mutations in PIK3R1 can lead to APDS2, SHORT syndrome or a combination of the two."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      47 patients with APDS2 have been reported to date, only one of them sharing both
      PIK3R1-related phenotypes.
    explanation: >-
      Quantifies how exceptional the overlap was thought to be before this report.
  - reference: PMID:28302518
    reference_title: "Mutations in PIK3R1 can lead to APDS2, SHORT syndrome or a combination of the two."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe two more patients affected by APDS2 and SHORT syndrome, which
      highlights that this association may not be so infrequent.
    explanation: >-
      The observation that reopens the question: the overlap is more common than the
      single prior case suggested.
- discussion_id: context_dependent_signalling
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If the C-terminal PIK3R1 variants impair insulin signalling only in some cellular
    contexts, what determines which tissues are affected, and is a single "reduced
    PI3K-AKT signalling" node the right way to model this disease?
  attaches_to:
  - pathophysiology#Reduced PI3K-AKT Signal Transduction
  - pathophysiology#Dissociation of Insulin Resistance from Dyslipidaemia
  rationale: >-
    The pathograph in this entry routes everything through one node in which PI3K-AKT
    signalling is reduced, and that is how the founding papers framed it. The 2016 study
    that established the dyslipidaemia dissociation complicates the picture in two ways.
    First, it states outright that these mutations impair insulin signalling only in some
    cellular contexts. Second, in cells from one patient carrying the p.Tyr657X allele,
    the mutant p85-alpha failed to associate with IRS1 while downstream signalling was
    normal - a binding defect that did not propagate. Taken together these say the lesion
    is not a uniform dial turned down across every tissue, which is what the single node
    implies. The tissue selectivity would also explain the dissociation directly: hepatic
    lipogenesis is spared while glucose disposal is not. Nothing cited here identifies
    what makes a given cell type sensitive or resistant, so the node is kept as one and
    this question records the qualification rather than splitting the pathograph on
    speculation.
  evidence:
  - reference: PMID:27766312
    reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PIK3R1 C-terminal mutations impair insulin signaling only in some cellular contexts
    explanation: >-
      The authors' explicit statement of context-dependence, which is what this question is
      about.
  - reference: PMID:27766312
    reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      showed severely reduced insulin-stimulated association of mutant but not WT p85α with
      IRS1, but normal downstream signaling
    explanation: >-
      A measured case where the binding defect did not propagate downstream. This is the
      single most direct challenge to the simple linear reading of the pathograph, and is
      recorded here rather than omitted because it is inconvenient.
- discussion_id: anterior_segment_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what developmental route does reduced PI3K-AKT signalling produce anterior
    segment dysgenesis (Rieger anomaly) in SHORT syndrome?
  attaches_to:
  - pathophysiology#Anterior Segment Dysgenesis
  rationale: >-
    The metabolic and adipose arms of this pathograph are supported by functional
    measurements in patient-derived cells, and the growth arm by a well-established
    pathway role. The ocular arm has neither: the anterior chamber phenotype is
    consistently reported as a defining feature, but none of the cited sources
    identifies an intervening mechanism between the signalling defect and neural crest
    derived anterior segment development. The pathophysiology node is therefore
    deliberately left without an upstream molecular edge rather than being connected
    by an assumed one.
  evidence:
  - reference: PMID:23810382
    reference_title: Mutations in PIK3R1 cause SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SHORT syndrome is a rare, multisystem disease characterized by short stature,
      anterior-chamber eye anomalies
    explanation: >-
      Establishes the phenotype whose mechanism is missing. The gap is the absence of
      any further mechanistic statement about it in this literature, which cannot
      itself be quoted.
notes: >-
  Entity scope. This entry covers SHORT syndrome as the PIK3R1-related growth,
  lipodystrophy and anterior-segment disorder. It is deliberately kept separate from
  the existing `Activated_PI3K-delta_Syndrome` entry even though both are PIK3R1
  diseases, because the variant classes, the direction of effect on PI3K signalling,
  and the affected systems differ. MONDO's `MONDO:1060136` ("PIK3R1-related
  immunodeficiency and SHORT syndrome") lumps the two; that lumping is not adopted
  here, and the overlap between them is recorded as an open question rather than as a
  merged pathograph.

  Frequency bands. Two cohorts inform them and they agree on ordering. The 32-patient
  molecularly confirmed cohort grades features qualitatively ("commonly observed", "not as
  prevalent", "less specific, or minor") and gives only one percentage, for the
  acronym-completeness figure. The later systematic appraisal of 19 individuals from 11
  families puts facial dysmorphism first, ahead of lipodystrophy, insulin resistance and
  intrauterine growth restriction, and ahead of the eponymous ocular and dental signs.
  Bands here are anchored to that ordering rather than to reported prevalences, and each
  phenotype's evidence explanation says which wording it rests on. Where the sources
  support no ordering at all, no `frequency` is recorded.

  Pathograph connectivity. Four phenotypes are deliberately left with no incoming edge:
  joint hypermobility, inguinal hernia, sensorineural hearing impairment and speech delay.
  These are exactly the features the cohort study grades as "less specific, or minor", and
  no cited source proposes a route from the signalling defect to any of them. Drawing an
  edge would assert a mechanism nobody has; leaving them attached to nothing is the
  accurate representation. Every other phenotype in the entry is reachable from the
  PIK3R1 variant node.

  Mechanism, and one qualification carried rather than dropped. The pathograph routes the
  three arms of the phenotype - growth, adipose, metabolic - through a single node in
  which PI3K-AKT signalling is reduced, which is how the founding papers framed it and
  what the knock-in mouse supports across liver, muscle and fat. The 2016 dissociation
  study qualifies that: it states the mutations impair insulin signalling only in some
  cellular contexts, and reports one patient's cells in which the binding defect did not
  propagate downstream. That qualification is recorded as an open question rather than
  resolved by splitting the node, because nothing cited identifies what makes a tissue
  sensitive.

  Two phenotypes are recorded in order to record their absence. Hepatic steatosis and
  dyslipidaemia carry REFUTE evidence, because their absence alongside extreme insulin
  resistance is diagnostically useful - it points away from obesity-related insulin
  resistance and towards a proximal receptor-to-PI3K lesion. Omitting them would make the
  entry silent on a question clinicians actually ask.

  Not asserted. The gene-level `genetic:` entry carries no `functional_impact_category`,
  since the schema places that slot on variant-level records; the variants themselves are
  curated with their functional effects, and the dominant-negative reading of p.Arg649Trp
  is evidenced from the preadipocyte overexpression experiment and the mouse paper's own
  framing rather than asserted from the heterozygous state alone. Growth hormone therapy
  is recorded with REFUTE evidence against the claim that it causes the diabetes: the
  cited review attributes that to puberty instead, and the case against growth hormone in
  this disorder rests on lack of statural benefit.

diagnosis:
- name: Clinical recognition with PIK3R1 sequencing
  description: >-
    The diagnosis is suspected from the combination of intrauterine and postnatal
    growth restriction, lipoatrophy and the facial gestalt, and confirmed by finding a
    heterozygous PIK3R1 variant. Relying on the acronym as a checklist under-diagnoses
    the condition: in a molecularly confirmed cohort only about half of patients had
    four or more of the five classic features, so the acronym should not be treated as
    a diagnostic threshold.
  evidence:
  - reference: PMID:26497935
    reference_title: "Clinical reappraisal of SHORT syndrome with PIK3R1 mutations: toward recommendation for molecular testing and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major features described in the SHORT acronym were not universally seen and
      only half (52%) had four or more of the classic features.
    explanation: >-
      The quantitative basis for not using the acronym as a diagnostic threshold.
  - reference: PMID:26497935
    reference_title: "Clinical reappraisal of SHORT syndrome with PIK3R1 mutations: toward recommendation for molecular testing and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Knowledge of the molecular etiology of SHORT syndrome has permitted a
      reassessment of the clinical phenotype.
    explanation: >-
      States that molecular confirmation is what allowed the clinical definition to be
      revised, which is the argument for gene-first testing.
- name: Immunological assessment for coexisting APDS2
  description: >-
    Because PIK3R1 variants cause both SHORT syndrome and activated PI3K-delta
    syndrome 2, and because individuals manifesting both have been reported, patients
    with a PIK3R1 variant warrant assessment by clinical immunology as well as
    clinical genetics.
  evidence:
  - reference: PMID:28302518
    reference_title: "Mutations in PIK3R1 can lead to APDS2, SHORT syndrome or a combination of the two."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend that patients with mutations in PIK3R1 gene should be assessed by
      both clinical immunologists and clinical geneticists.
    explanation: >-
      The recommendation this diagnostic step implements, stated by the authors who
      reported the overlapping cases.
treatments:
- name: Metformin and SGLT2 inhibitor for insulin-resistant diabetes
  description: >-
    Once diabetes is overt, the reported regimen is an insulin sensitiser plus an
    insulin-independent glucose-lowering agent. In the documented case, metformin with
    canagliflozin brought HbA1c from 9.2% to around 7% and, notably, corrected both the
    daytime hyperglycaemia and the nocturnal hypoglycaemia. The rationale for an SGLT2
    inhibitor here is mechanistic as well as empirical: it lowers glucose by a renal route
    that does not depend on the impaired PI3K arm of insulin signalling.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metformin
      term:
        id: CHEBI:6801
        label: metformin
    - preferred_term: canagliflozin
      term:
        id: CHEBI:73274
        label: canagliflozin
  target_phenotypes:
  - preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  - preferred_term: Insulin resistance
    term:
      id: HP:0000855
      label: Insulin resistance
  evidence:
  - reference: PMID:32879144
    reference_title: "Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with metformin and canagliflozin (a sodium glucose co-transporter 2
      (SGLT2) inhibitor), which ameliorated overt diurnal hyperglycemia and mild nocturnal
      hypoglycemia and reduced her blood HbA1c around 7%.
    explanation: >-
      The regimen and its measured effect in the one reported case. A single case, which is
      why this is recorded as reported practice rather than as established therapy.
  - reference: PMID:32879144
    reference_title: "Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a usefulness of SGLT2 inhibitor in the treatment of IRDM
    explanation: >-
      The authors' own conclusion about the drug class.
- name: Growth hormone therapy
  description: >-
    Long treated as contraindicated because growth hormone is diabetogenic and these
    patients are already severely insulin resistant. The reported evidence complicates
    that: growth response was poor in the one documented case, and the literature review
    in the same paper found insulin-resistant diabetes in 10 of 15 untreated patients aged
    12 or over and in none of three treated or six untreated patients aged 10 or under -
    an age effect, not a treatment effect. So the case against growth hormone here rests
    on lack of benefit more securely than on causing the diabetes.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Hormone therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:32879144
    reference_title: "Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GH dosage was increased from 0.23 to 0.36 mg/kg/week, but statural response to GH
      therapy remained poor.
    explanation: >-
      The growth outcome, which is the clearest argument against the intervention in this
      disorder.
  - reference: PMID:32879144
    reference_title: "Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings imply a critical role of pubertal development and/or advanced age
      rather than GH therapy in the development of IRDM
    explanation: >-
      Graded REFUTE because it contradicts the claim this treatment entry might otherwise
      be read as making - that growth hormone causes the diabetes. The authors attribute
      the diabetes to puberty instead.
- name: Metabolic surveillance and management of insulin resistance
  description: >-
    There is no disease-modifying therapy. Management centres on surveillance for and
    treatment of the metabolic consequences: because the risk of diabetes is high,
    regular monitoring of glucose metabolism is recommended, with treatment of
    hyperglycaemia when it develops.

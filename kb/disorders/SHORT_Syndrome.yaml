      directness: INDIRECT
  evidence:
  - reference: PMID:23980586
    reference_title: PIK3R1 mutations in SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      teething delay, partial lipodystrophy, insulin resistance and facial dysmorphic
      signs
    explanation: >-
      Lists insulin resistance among the defining features of the syndrome.
- name: Dissociation of Insulin Resistance from Dyslipidaemia
  biological_scale: ORGANISM
  description: >-
    Obesity-related insulin resistance travels with fatty liver, dyslipidaemia and low
    adiponectin. Insulin resistance from insulin-receptor dysfunction travels with none of
    them, and insulin resistance from AKT2 dysfunction phenocopies the obesity pattern.
    SHORT syndrome sits with the receptor group: four of five studied patients had extreme
    insulin resistance without dyslipidaemia or hepatic steatosis, and adiponectin was
    preserved in three of those four. Because PIK3R1 acts between the receptor and AKT,
    that placement is informative about where in the cascade the lesion sits, and it makes
    the metabolic profile a discriminating clinical feature rather than an incidental one.
  downstream:
  - target: Hypertriglyceridemia
    causal_link_type: DIRECT
    description: >-
      The other half of the dissociation, and recorded the same way: an expected feature
      that is characteristically absent.
    evidence:
    - reference: PMID:27766312
      reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four of 5 patients had extreme insulin resistance without dyslipidemia or hepatic
        steatosis.
      explanation: >-
        Establishes the absence of dyslipidaemia, which is the claim the linked phenotype
        records.
  - target: Hepatic steatosis
    causal_link_type: DIRECT
    description: >-
      Recorded as an expected feature that is characteristically absent. The phenotype
      entry carries REFUTE evidence rather than asserting its presence.
    evidence:
    - reference: PMID:27766312
      reference_title: Insulin resistance uncoupled from dyslipidemia due to C-terminal PIK3R1 mutations.

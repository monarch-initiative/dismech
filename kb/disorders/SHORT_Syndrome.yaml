- name: Impaired Adipocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    PI3K signalling is required for preadipocytes to differentiate into mature
    adipocytes. The hotspot variant reduces AKT-mediated insulin signalling in
    reconstituted Pik3r1-knockout preadipocytes, and the resulting failure of
    adipose differentiation is the proposed basis of the partial lipodystrophy, which
    characteristically affects the face, chest and upper extremities while sparing
    the buttocks and legs.

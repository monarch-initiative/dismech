name: Tick-Borne Encephalitis
creation_date: '2026-10-25T20:00:00Z'
category: Infectious Disease
description: >-
  Tick-borne encephalitis (TBE) is a neuroinvasive flavivirus infection caused
  by tick-borne encephalitis virus (TBEV), transmitted primarily by the bite of
  infected Ixodes ticks (Ixodes ricinus in Europe and Ixodes persulcatus in
  Siberia and the Far East) and less frequently by ingestion of unpasteurized
  dairy products from infected ruminants. Symptomatic European-subtype infection
  characteristically follows a biphasic course, with an initial nonspecific
  viremic febrile phase accompanied by leukopenia and thrombocytopenia, followed
  after an asymptomatic interval by central nervous system invasion presenting
  as meningitis, meningoencephalitis, or meningoencephalomyelitis.
disease_term:
  preferred_term: tick-borne encephalitis
  term:
    id: MONDO:0017572
    label: tick-borne encephalitis
parents:
- Arbovirus Infection
- Viral Encephalitis
synonyms:
- TBE
- Central European encephalitis
- Russian spring-summer encephalitis
- Far Eastern tick-borne encephalitis
has_subtypes:
- name: European Subtype (TBEV-Eu)
  description: >-
    Transmitted primarily by Ixodes ricinus across Europe; typically produces a
    biphasic illness with a case fatality rate below 2%.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ixodes ricinus is the main vector for the European subtype TBE virus and Ixodes persulcatus for the Siberian and Far Eastern subtype viruses"
    explanation: Identifies Ixodes ricinus as the main vector for the European subtype TBE virus.
- name: Siberian Subtype (TBEV-Sib)
  description: >-
    Transmitted primarily by Ixodes persulcatus in Siberia, the Baltic region,
    and northern Europe; associated with a 2% to 3% case fatality rate and rare
    chronic or progressive neurological disease.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ixodes ricinus is the main vector for the European subtype TBE virus and Ixodes persulcatus for the Siberian and Far Eastern subtype viruses"
    explanation: Identifies Ixodes persulcatus as the primary vector for the Siberian subtype TBE virus.
- name: Far Eastern Subtype (TBEV-FE)
  description: >-
    Transmitted primarily by Ixodes persulcatus in eastern Russia, China, and
    Japan; causes the most severe clinical course with monophasic presentation
    and higher fatality rates.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ixodes ricinus is the main vector for the European subtype TBE virus and Ixodes persulcatus for the Siberian and Far Eastern subtype viruses"
    explanation: Identifies Ixodes persulcatus as the primary vector for the Far Eastern subtype TBE virus.
infectious_agent:
- name: Tick-borne encephalitis virus
  description: >-
    Single-stranded, positive-sense RNA orthoflavivirus of the family
    Flaviviridae comprising three main antigenic subtypes (European, Siberian,
    and Far Eastern) that share closely related envelope (E) glycoprotein
    neutralizing epitopes.
  infectious_agent_term:
    preferred_term: Tick-borne encephalitis virus
    term:
      id: NCBITaxon:11084
      label: Tick-borne encephalitis virus
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TBE virus is a single-stranded RNA virus in the genus Flavivirus, family Flaviviridae (4). TBE virus is closely related to Powassan virus, a tickborne flavivirus transmitted in parts of the United States (5). The three main antigenic subtypes of TBE virus (i.e., European, Siberian, and Far Eastern) differ in the severity of disease they cause and geographic distribution"
    explanation: Establishes the viral classification and three main subtypes of tick-borne encephalitis virus.
agent_life_cycle:
  description: >-
    TBEV is maintained in natural foci between hard ticks (Ixodes ricinus and
    Ixodes persulcatus) and small woodland rodent reservoirs; domestic
    ruminants (goats, sheep, cattle) can become viremic and shed virus in milk,
    while humans are incidental dead-end hosts.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental dead-end host
  - preferred_term: Ixodes ricinus
    term:
      id: NCBITaxon:34613
      label: Ixodes ricinus
    role: vector
  - preferred_term: Ixodes persulcatus
    term:
      id: NCBITaxon:34615
      label: Ixodes persulcatus
    role: vector
  - preferred_term: goat
    term:
      id: NCBITaxon:9925
      label: Capra hircus
    role: intermediate amplifying host for alimentary transmission
transmission:
- name: Ixodes tick bite transmission
  description: >-
    Primary transmission occurs through the bite of an infected Ixodes ricinus
    or Ixodes persulcatus tick, with virus inoculated in tick saliva almost
    immediately upon attachment.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TBE virus is primarily transmitted to humans by the bites of infected Ixodes sp. ticks but can also be acquired less frequently by alimentary transmission."
    explanation: Documents tick bites from infected Ixodes species as the primary route of human transmission.
- name: Alimentary transmission via unpasteurized dairy
  description: >-
    Secondary foodborne transmission occurs after ingestion of unpasteurized
    milk or cheese from viremic goats, sheep, or cattle.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alimentary transmission is a less frequent means of acquisition of TBE virus and occurs after ingestion of unpasteurized dairy products (e.g., milk and cheese) from infected cattle, goats, or sheep; transmission from goats is most commonly reported"
    explanation: Documents alimentary transmission via unpasteurized dairy products from infected domestic ruminants.
prevalence:
- population: Endemic regions of Europe and Asia
  measure_type: ANNUAL_INCIDENCE
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Approximately 5,000 to 10,000 new cases of tick-borne encephalitis are
    reported annually across endemic regions of Europe and Asia.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In areas where TBE is endemic, approximately 5,000–10,000 new cases are reported annually"
    explanation: Reports annual incidence of 5,000 to 10,000 TBE cases across endemic areas.
progression:
- phase: Incubation Phase
  duration: 7-14 days after tick bite (range 2-28 days)
  notes: >-
    Following an infected Ixodes tick bite, the typical incubation period is 7
    to 14 days (shorter, 3 to 4 days, after alimentary dairy transmission).
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients who develop clinical symptoms after a bite from an infected tick, the incubation period is typically 7–14 days (range = 2–28 days)"
    explanation: Documents the typical 7- to 14-day incubation period after an infected tick bite.
- phase: First (Viremic Febrile) Phase and Asymptomatic Remission
  duration: Median 4 days febrile illness followed by ~7 days remission
  notes: >-
    In biphasic illness, an initial nonspecific febrile phase with headache,
    myalgia, leukopenia, and thrombocytopenia lasts a median of ~4 days,
    followed by an asymptomatic remission interval of ~7 days before onset of
    neurologic disease.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When biphasic illness occurs, the initial phase includes nonspecific symptoms (e.g., fever, headache, malaise, myalgia, nausea, and vomiting). These symptoms usually last for a median of approximately 4 days (range = 1–10 days), followed by a period of remission of"
    explanation: Quantifies the duration of the initial viremic febrile phase (median ~4 days, range 1-10 days) in biphasic TBE.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 7 days (range = 1–33 days), followed by the second (neurologic) phase"
    explanation: Quantifies the duration of the asymptomatic remission period (~7 days, range 1-33 days) preceding the second neurologic phase.
- phase: Second (Neuroinvasive) Phase and Chronic Neurological Sequelae
  notes: >-
    Central nervous system invasion manifests as meningitis (35%-45%),
    meningoencephalitis (45%-55%), or meningoencephalomyelitis (10%), and can
    be followed by long-term neurological sequelae.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, meningitis is reported in approximately 35%–45% of patients, meningoencephalitis in 45%–55%, and meningoencephalomyelitis in 10%"
    explanation: Characterizes the clinical spectrum of the second (neurologic) phase of TBE.
pathophysiology:
- name: Cutaneous Inoculation, Peripheral Viral Replication, and Primary Viremia
  description: >-
    Following inoculation of TBEV via tick bite into the skin (or across the
    gastrointestinal tract after dairy ingestion), the virus replicates locally
    in cutaneous dendritic cells, drains to regional lymph nodes, and
    establishes a primary viremia that causes the first febrile phase of
    biphasic illness with transient bone marrow suppression (leukopenia and
    thrombocytopenia) and mild hepatic injury.
  role: trigger
  biological_scale: ORGANISM
  locations:
  - preferred_term: zone of skin
    term:
      id: UBERON:0000014
      label: zone of skin
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:

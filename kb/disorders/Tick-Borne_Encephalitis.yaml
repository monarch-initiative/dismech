diagnosis:
- name: TBE Virus-Specific IgM ELISA and Plaque Reduction Neutralization Test (PRNT)
  description: >-
    Laboratory diagnosis of tick-borne encephalitis is established primarily by
    detection of TBEV-specific IgM and IgG antibodies in serum or cerebrospinal
    fluid by ELISA at the onset of neurologic symptoms, confirmed by plaque
    reduction neutralization testing (PRNT) to exclude flavivirus
    cross-reactivity or demonstrate a >=4-fold neutralizing titer rise between
    acute and convalescent sera.
  diagnosis_term:
    preferred_term: laboratory examination
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laboratory diagnosis of TBE usually is based on detection of virus-specific immunoglobulin M (IgM) antibody in CSF or serum ( 180). An IgM enzyme-linked immunosorbent assay is routinely used for testing samples and usually is positive when neurologic symptoms are present."
    explanation: Establishes CSF or serum TBEV-specific IgM ELISA as the routine diagnostic assay during the neurologic phase.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plaque reduction neutralization tests can be performed to discriminate between cross-reacting antibodies attributable to another primary flavivirus infection or to confirm recent TBE virus infection on the basis of a fourfold or higher increase in virus-specific neutralizing antibodies between acute- and convalescent-phase serum specimens."
    explanation: Establishes PRNT as the confirmatory serological test to distinguish TBEV from cross-reactive flavivirus antibodies.
treatments:
- name: Inactivated Tick-Borne Encephalitis Vaccination (FSME-IMMUN / TICOVAC)
  description: >-
    Three-dose primary immunization series with formaldehyde-inactivated,
    whole-virus European subtype TBE vaccine (TICOVAC / FSME-IMMUN) induces
    neutralizing antibodies in 99% of seronegative adults (GMT 259 at 21-28 days
    post-dose 3) and confers 91% to 99% vaccine effectiveness against clinical
    TBE and hospitalization. Older adults achieve lower post-vaccination
    neutralizing antibody titers and experience more rapid seroreversion over
    time.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Cutaneous Inoculation, Peripheral Viral Replication, and Primary Viremia
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced E-glycoprotein neutralizing antibodies neutralize TBEV
      following tick inoculation and prevent systemic viremia and neuroinvasion.
    evidence:
    - reference: PMID:37943707
      reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "TBE virus neutralizing antibodies are believed to confer protection against disease on the basis of animal and human studies"
      explanation: Establishes neutralizing antibody-mediated block of infection and disease progression.
  effect_modifiers:
  - effect_modifier_type: AGE
    stratum: older adults
    comparator_stratum: younger adults
    modified_outcome: post-vaccination neutralizing antibody geometric mean titer and persistence
    effect_in_stratum: SMALLER_EFFECT
    description: >-
      Older adults mount lower post-primary neutralizing antibody titers than
      younger adults and have higher rates of seroreversion over time after
      vaccination.
    evidence:
    - reference: PMID:37943707
      reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, seropositivity rates immediately after completion of the 3-dose primary series are high among older persons but levels of neutralizing antibodies are lower than among younger adults. Over time postvaccination, lower neutralizing antibody levels continue to be observed among older adults and they are more likely to become seronegative."
      explanation: Demonstrates age-related reduction in neutralizing antibody levels and durability after TBE vaccination.
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vaccine is an inactivated, whole virus vaccine, prepared using a European subtype TBE virus."
    explanation: Describes the composition of the licensed TBE vaccine.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, VE estimates for the European subtype virus TBE vaccines against disease caused by the European subtype virus after ≥3 doses of vaccine are 91%–99% for prevention of various outcomes (e.g., all TBE disease and hospitalization)"
    explanation: Documents 91% to 99% real-world vaccine effectiveness after at least 3 doses.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 416 adults seronegative at baseline, 411 (99%) were seropositive at 21–28 days after dose 3 of the primary series with a geometric mean titer (GMT) of 259 (95% CI = 235–285)."
    explanation: Reports 99% seropositivity and neutralizing GMT of 259 after the 3-dose primary series in adults.

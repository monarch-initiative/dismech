      label: viral genome replication
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When biphasic illness occurs, the initial phase includes nonspecific symptoms (e.g., fever, headache, malaise, myalgia, nausea, and vomiting)."
    explanation: Describes the initial viremic phase of biphasic TBE illness.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the initial phase of a biphasic illness, findings can include leukopenia, thrombocytopenia, or elevated hepatic enzymes"
    explanation: Documents systemic hematologic and hepatic manifestations during the initial viremic phase.
  downstream:
  - target: Neuroinvasion and Central Nervous System Inflammation
    description: >-
      In a subset of infected individuals, peripheral viremia breaches the
      blood-brain barrier to invade the meninges, brain parenchyma, and spinal
      cord.
    causal_link_type: DIRECT
  - target: Fever
    description: Systemic viremia and innate cytokine release trigger the initial febrile phase.
  - target: Headache
    description: Systemic viral replication and inflammatory cytokines produce headache during the initial viremic phase.
  - target: Leukopenia
    description: Transient viral bone marrow suppression during primary viremia causes leukopenia.
  - target: Thrombocytopenia
    description: Transient bone marrow suppression and peripheral platelet consumption during primary viremia cause thrombocytopenia.
- name: Neuroinvasion and Central Nervous System Inflammation
  description: >-
    During the second phase of illness, TBEV crosses the blood-brain barrier and
    infects neurons across the meninges, cerebral cortex, brainstem, cerebellum,
    and spinal cord anterior horns, provoking lymphocytic CSF pleocytosis and
    meningeal and parenchymal neuroinflammation that manifests clinically as
    meningitis, meningoencephalitis, or meningoencephalomyelitis.
  role: central_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, meningitis is reported in approximately 35%–45% of patients, meningoencephalitis in 45%–55%, and meningoencephalomyelitis in 10%"
    explanation: Quantifies the clinical spectrum of central nervous system involvement in TBE.
  - reference: PMID:37943707
    reference_title: "Tick-Borne Encephalitis Vaccine: Recommendations of the Advisory Committee on Immunization Practices, United States, 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebrospinal fluid (CSF) testing usually indicates a pleocytosis, typically lymphocytic, with moderately elevated protein levels"
    explanation: Confirms lymphocytic CSF pleocytosis as a hallmark of CNS inflammation in TBE.
  downstream:
  - target: Meningitis
    description: Meningeal viral invasion and lymphocytic inflammation cause acute meningitis.
  - target: Infectious encephalitis
    description: Viral infection of brain parenchyma produces meningoencephalitis with cognitive dysfunction, ataxia, and tremor.
  - target: Headache
    description: Meningeal inflammation and elevated intracranial pressure cause severe headache in the neuroinvasive phase.
  - target: Ataxia
    description: Cerebellar and brainstem neuronal infection and neuroinflammation cause cerebellar ataxia.
  - target: Tremor
    description: Basal ganglia, brainstem, and cerebellar involvement during meningoencephalitis produces extremity and tongue tremors.

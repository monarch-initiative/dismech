genetic:
- name: OAT
  association: Biallelic loss-of-function variants
  notes: >
    OAT encodes mitochondrial ornithine-delta-aminotransferase. Variants are
    functionally heterogeneous in a way that matters clinically: some
    destabilize the pyridoxal-5'-phosphate-dependent enzyme in a manner
    partially rescuable by supraphysiological pyridoxine, while others cause
    folding defects that cofactor cannot correct. The Dutch founder allele
    p.Gly353Asp is of the latter kind, and no patient carrying it responded to
    pyridoxine in vivo or in vitro - so genotype can prospectively exclude one
    of the two available treatments.
  gene_term:
    preferred_term: OAT
    term:
      id: hgnc:8091
      label: OAT
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:39053126
    reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gyrate atrophy of the choroid and retina (GACR) is caused by pathogenic biallelic variants in the gene encoding ornithine-δ-aminotransferase (OAT), and is characterized by progressive vision loss leading to blindness."
    explanation: >
      Assigns causation to biallelic OAT variants.
  - reference: PMID:39053126
    reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In silico analysis and small-scale expression experiments showed that this variant causes a folding defect, leading to increased aggregation properties that could not be rescued by PLP."
    explanation: >
      Provides the molecular basis for the notes' claim that the founder allele
      is constitutionally non-responsive to pyridoxine.
treatments:
- name: Arginine-Restricted Diet
  description: >
    Dietary restriction of arginine, the metabolic precursor of ornithine,
    lowers plasma ornithine and is the mainstay of treatment. It is effective in
    principle for every genotype because it acts upstream of the enzyme rather
    than on it, and evidence of benefit extends to adults with advanced disease,
    where visual field decline appeared to stabilize while ornithine was held
    below 500 micromolar.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Systemic Hyperornithinemia
    treatment_effect: INHIBITS
    description: >
      Restricting the precursor lowers the accumulating metabolite, acting
      directly on the entry's central effector node.
    evidence:
    - reference: PMID:35856163
      reference_title: "A possible ocular biomarker for response to hyperornithinemia in gyrate atrophy: the effect of pyridoxine, lysine, and arginine-restricted diet in a patient with advanced disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with pyridoxine and arginine-diet restriction yielded a maximal reduction in ornithine levels by 71% (275 µmol/L)."
      explanation: >
        Quantifies the reduction in the target metabolite achieved by this
        intervention.
  evidence:
  - reference: PMID:35856163
    reference_title: "A possible ocular biomarker for response to hyperornithinemia in gyrate atrophy: the effect of pyridoxine, lysine, and arginine-restricted diet in a patient with advanced disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While her best-corrected visual acuity remained unchanged, the progressive decline in her visual fields appeared to stabilize during a one-year period when ornithine levels were below 500 µmol/L."
    explanation: >
      Documents apparent field stabilization at lowered ornithine in advanced
      adult disease. Marked PARTIAL because this is a single uncontrolled case
      report with acuity unchanged.
- name: Supraphysiological Pyridoxine (Vitamin B6)
  description: >
    High-dose pyridoxine saturates the pyridoxal-5'-phosphate cofactor site and
    can partially restore activity of destabilized OAT variants, lowering
    ornithine. It works only in a minority of genotypes, and the distinction is
    predictable rather than empirical: variants causing folding defects with
    increased aggregation, including the Dutch founder p.Gly353Asp, do not
    respond in vivo or in vitro. Genotype-directed use, supported by an in vitro
    responsiveness assay, therefore avoids committing non-responders to an
    ineffective therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Ornithine Aminotransferase Deficiency
    treatment_effect: ACTIVATES
    description: >
      Cofactor saturation enhances residual enzyme activity, acting on the
      trigger lesion itself rather than on the metabolite it produces - which is
      why the effect is genotype-dependent in a way dietary restriction is not.
    evidence:
    - reference: PMID:39053126
      reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Therapy is aimed at lowering ornithine levels through dietary arginine restriction and, in some cases, through enhancement of OAT activity via supraphysiological dosages of pyridoxine."
      explanation: >
        States the mechanism of action as enhancement of OAT activity, which is
        the node this treatment is wired to.
  evidence:
  - reference: PMID:39053126
    reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "None of the patients harboring the p.(Gly353Asp) substitution were responsive to pyridoxine in vivo or in vitro."
    explanation: >
      Documents the genotype-restricted efficacy that qualifies this treatment.
      Marked PARTIAL because it establishes the limits of the therapy rather
      than demonstrating benefit.
discussions:
- discussion_id: gyrate_atrophy_retinal_tissue_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a systemic, lifelong excess of ornithine damage the retina and
    choroid and essentially nothing else?
  attaches_to:
  - "pathophysiology#Systemic Hyperornithinemia"
  - "pathophysiology#Progressive Chorioretinal Atrophy"
  rationale: >-
    Ornithine accumulates in every tissue, yet the clinical phenotype is
    confined to the eye - the causal edge between these two nodes is recorded as
    indirect with unknown intermediates for exactly that reason. Candidate
    explanations have included ornithine-driven inhibition of creatine synthesis
    with consequent phosphocreatine depletion in a highly energy-demanding
    tissue, and proline deficiency in the retinal pigment epithelium, but
    neither is established. This is not merely descriptive: an ornithine
    threshold below which the retina is safe would let treatment be titrated to
    a target, and the observation that field decline stabilized below 500
    micromolar in one advanced case hints at such a threshold without
    establishing one.
  proposed_experiments:
  - experiment_id: oat_rpe_metabolite_threshold
    name: Ornithine dose-response in patient-derived RPE with metabolic rescue arms
    description: >
      Expose patient-derived and OAT-knockout retinal pigment epithelium to
      graded ornithine concentrations spanning the treated and untreated patient
      range, measuring viability, phosphocreatine and intracellular proline, and
      test whether creatine or proline supplementation rescues the phenotype at
      concentrations that are otherwise toxic.

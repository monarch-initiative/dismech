name: Gyrate Atrophy of the Choroid and Retina
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Gyrate atrophy of the choroid and retina is an autosomal recessive inborn
  error of metabolism that presents as a chorioretinal dystrophy. Biallelic
  loss-of-function variants in OAT abolish mitochondrial ornithine
  aminotransferase, the pyridoxal-5'-phosphate-dependent enzyme that catabolizes
  ornithine, and plasma ornithine rises to many times normal. The retina and
  choroid are, for reasons still not fully explained, uniquely vulnerable to
  that systemic excess: sharply demarcated, scalloped patches of chorioretinal
  atrophy appear in the midperiphery in childhood, coalesce and advance
  centrally, and produce night blindness, high myopia and progressive field loss
  ending in blindness. Two features set it apart from the other inherited
  chorioretinal dystrophies and make the diagnosis worth pursuing. It is
  detectable by a plasma amino acid measurement rather than requiring genetic
  testing. And it is, uniquely among them, partially treatable: lowering
  ornithine by dietary arginine restriction, with supraphysiological pyridoxine
  in the minority of genotypes that respond, slows progression, and there is
  evidence of stabilization even in advanced adult disease.
disease_term:
  preferred_term: ornithine aminotransferase deficiency
  term:

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic OAT variants are required for the classic disease. A single report
    describes a heterozygous carrier mother with pathologic myopia, posterior
    staphyloma and chorioretinal and RPE changes alongside mildly elevated
    ornithine, raising the possibility of a mild carrier phenotype; this is a
    single pedigree and should not be generalized.
  evidence:
  - reference: PMID:40666757
    reference_title: "Gyrate atrophy of the choroid and retina with vitreous hemorrhage complication in a Vietnamese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gyrate atrophy (GA) of the choroid and retina is a rare autosomal recessive inherited disease characterized by elevation of plasma ornithine levels due to deficiency of the mitochondrial enzyme ornithine aminotransferase resulting in progressive chorioretinal atrophy, nyctalopia, and possibly blindness."
    explanation: >
      States the autosomal recessive inheritance together with the biochemical
      and clinical definition of the disease.
  - reference: PMID:39202380
    reference_title: "Mild Phenotypes of Gyrate Atrophy in a Heterozygous Carrier with One Variant Allele of OAT."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We believe that this is the first report of a carrier of one OAT variant allele exhibiting a mild phenotype, suggesting that family members should be aware of the possibility of clinical involvement in carriers with some autosomal recessive conditions."
    explanation: >
      Documents the single-pedigree carrier observation. Marked PARTIAL because
      the authors themselves present it as a first report rather than an
      established feature of the disease.
pathophysiology:
- name: Ornithine Aminotransferase Deficiency
  description: >
    Biallelic pathogenic variants in OAT abolish or cripple mitochondrial
    ornithine-delta-aminotransferase. OAT is pyridoxal-5'-phosphate dependent,
    which is the structural basis for the pyridoxine-responsive subgroup: some
    variants destabilize the enzyme in a way that saturating cofactor can
    partially rescue, while others - the Dutch founder p.Gly353Asp being the
    documented example - cause a folding defect with increased aggregation that
    PLP cannot rescue at all. Enzymatic activity and ornithine flux are below the
    limit of quantification in most patients.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: ornithine aminotransferase activity
    term:
      id: GO:0004587
      label: L-ornithine transaminase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:39053126
    reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OAT is a pyridoxal-5'-phosphate (PLP) dependent enzyme that is mainly involved in ornithine catabolism, and patients with a deficiency develop profound hyperornithinemia."
    explanation: >
      Identifies the enzyme, its cofactor dependence, and the immediate
      biochemical consequence of its loss.
  - reference: PMID:39053126
    reference_title: "Extending diagnostic practices in gyrate atrophy: Enzymatic characterization and the development of an in vitro pyridoxine responsiveness assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Apart from our positive control, only one patient cell line showed responsiveness to pyridoxine in vitro, which is in line with the reported in vivo pyridoxine responsiveness in this patient."
    explanation: >
      Supports this node's claim that cofactor-rescuable variants are a small
      minority, and shows the in vitro assay agreeing with the in vivo response
      in the one responsive patient.
  downstream:
  - target: Systemic Hyperornithinemia
    causal_link_type: DIRECT

- name: Systemic Hyperornithinemia
  description: >
    Without OAT, ornithine cannot be transaminated to glutamate
    semialdehyde and accumulates throughout the body, reaching plasma
    concentrations several-fold to ten-fold above the normal 18-135 micromolar
    range. The excess is systemic and lifelong, yet the clinical phenotype is
    confined to the eye - the tissue-restriction problem that this disease shares
    with choroideremia and that remains unexplained here too. Because the
    metabolite is measurable in plasma, this node is also the diagnostic entry
    point and the therapeutic target: every established treatment works by
    lowering it.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Ornithine metabolic process
    term:
      id: GO:0006591
      label: ornithine metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35856163
    reference_title: "A possible ocular biomarker for response to hyperornithinemia in gyrate atrophy: the effect of pyridoxine, lysine, and arginine-restricted diet in a patient with advanced disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 51-year-old female with advanced chorioretinal degeneration presented with hyperornithinemia (961 vs. normal 18-135 µmol/L) and compound heterozygous pathogenic variants in OAT (p.Tyr299* and p.Ala270Pro)."
    explanation: >
      Gives the magnitude of the accumulation against the stated normal range,
      supporting the several-fold elevation this node describes.
  - reference: PMID:35856163
    reference_title: "A possible ocular biomarker for response to hyperornithinemia in gyrate atrophy: the effect of pyridoxine, lysine, and arginine-restricted diet in a patient with advanced disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of function variants in the ornithine aminotransferase (OAT) gene cause accumulation of ornithine levels, leading to gyrate atrophy."
    explanation: >
      States the causal step from enzyme loss through ornithine accumulation to
      the retinal disease, which is the placement of this node in the chain.
  downstream:
  - target: Progressive Chorioretinal Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Progressive Chorioretinal Atrophy
  description: >
    Sharply demarcated, scalloped patches of retinal pigment epithelium and
    choriocapillaris atrophy with hyperpigmented margins appear in the
    midperiphery, enlarge, coalesce into the garland or gyrate pattern the
    disease is named for, and advance towards the macula. The causal link from
    hyperornithinemia to this atrophy is drawn as indirect with unknown
    intermediates deliberately: that the retina alone is affected by a systemic
    metabolite excess is not explained by any single established mechanism, and
    this entry does not assert one.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  locations:
  - preferred_term: optic choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  evidence:
  - reference: PMID:40666757
    reference_title: "Gyrate atrophy of the choroid and retina with vitreous hemorrhage complication in a Vietnamese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fundus examination showed vitreous hemorrhage in the right eye and chorioretinal atrophy with hyperpigmented margins in the periphery retina of the left eye."
    explanation: >
      Documents the characteristic peripheral chorioretinal atrophy with
      hyperpigmented margins that defines this node, in a molecularly confirmed
      child.
  downstream:
  - target: Night Blindness and Progressive Visual Field Loss
    causal_link_type: DIRECT

- name: Night Blindness and Progressive Visual Field Loss
  description: >
    Nyctalopia begins in the first decade as the peripheral rod-rich retina is
    lost, followed by progressive constriction of the visual field as atrophy
    coalesces, and finally central visual loss when the macula is reached,
    typically in the fourth to fifth decade. High myopia with posterior
    staphyloma is characteristic and often precedes recognition of the retinal
    disease. Untreated, the course is to blindness.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:40666757
    reference_title: "Gyrate atrophy of the choroid and retina with vitreous hemorrhage complication in a Vietnamese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in progressive chorioretinal atrophy, nyctalopia, and possibly blindness"
    explanation: >
      States the progression from atrophy through night blindness to blindness
      that this consequence node models.

pathophysiology:
- name: Aortic wall aging and chronic hemodynamic stress
  description: >-
    Cumulative pulsatile wall stress across a lifetime, amplified by systemic
    hypertension, drives a vasculopathic aging process in the aortic media.
    This is the dominant upstream trigger for sporadic degenerative thoracic
    aortic aneurysm, and is especially characteristic of descending thoracic
    disease in older patients. It is the acquired counterpart of the monogenic
    wall defects that trigger the heritable aortopathies.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:27031798
    reference_title: "Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular Pathology and the Association For European Cardiovascular Pathology: II. Noninflammatory degenerative diseases - nomenclature and diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A number of diseases, genetic syndromes (Marfan syndrome, Loeys-Dietz
      syndrome, etc.), and vasculopathic aging processes involved in vascular
      injury can cause both distinct and nonspecific histopathologic changes
      with degeneration of the media as a common denominator.
    explanation: >-
      The cardiovascular pathology consensus statement identifies vasculopathic
      aging alongside genetic syndromes as an upstream cause converging on
      medial degeneration.
  - reference: PMID:29360940
    reference_title: "From genetics to response to injury: vascular smooth muscle cells in aneurysms and dissections of the ascending aorta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "degenerative form linked to the aortic aging process"
    explanation: >-
      Names the aging-linked degenerative form as one of the predominant
      aetiologies of thoracic aortic aneurysm and dissection. Evidence source is
      OTHER because this is a review synthesizing multiple study types.
  - reference: PMID:39145396
    reference_title: "Acute Aortic Dissection: Observational Lessons Learned From 11 000 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over time, the rates of hypertension increased from 77.8% to 80.4%"
    explanation: >-
      In the IRAD registry of acute aortic dissections, roughly four in five
      patients were hypertensive, supporting chronic pressure loading as a
      dominant acquired risk factor.
  downstream:
  - target: Medial degeneration of the aortic wall
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Bicuspid aortic valve-associated altered wall shear stress
  description: >-
    A bicuspid aortic valve produces an eccentric, high-velocity systolic jet
    that imposes regionally elevated wall shear stress (WSS) on the ascending
    aortic convexity. Elevated WSS is associated with locally altered aortic
    wall biomechanics and maladaptive remodeling, giving a hemodynamic route to
    ascending aneurysm that is distinct from, and additive to, the intrinsic
    vascular smooth muscle cell abnormality also documented in bicuspid aortic
    tissue.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:36797175
    reference_title: "Magnetic resonance imaging-based hemodynamic wall shear stress alters aortic wall tissue biomechanics in bicuspid aortic valve patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated WSS in the ascending aorta of patients with bicuspid aortic valve
      has been shown to contribute to local maladaptive aortic remodeling and
      might alter biomechanics.
    explanation: >-
      States the hemodynamic premise linking bicuspid-valve-driven elevated wall
      shear stress to maladaptive ascending aortic remodeling.
  - reference: PMID:36797175
    reference_title: "Magnetic resonance imaging-based hemodynamic wall shear stress alters aortic wall tissue biomechanics in bicuspid aortic valve patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study shows strong evidence that biomechanical changes in the aorta
      are strongly associated with hemodynamics
    explanation: >-
      Biaxial testing of resected bicuspid aortopathy tissue mapped to 4D-flow
      MRI confirms that regional hemodynamics, not sampling region, tracks with
      altered wall biomechanics.
  downstream:
  - target: Vascular smooth muscle cell depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Medial degeneration of the aortic wall
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Vascular smooth muscle cell depletion
  description: >-
    Loss of medial vascular smooth muscle cells (VSMCs) by apoptosis and
    phenotypic failure removes the cells responsible for maintaining and
    repairing the elastic lamellar units. In resected ascending aneurysm tissue
    VSMCs show both defective secretion of matrix proteins and a several-fold
    increase in apoptotic loss, with MMP-2 upregulation implicated in driving
    that loss.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In MS and BAV there is alteration in both the amount and quality of
      secreted proteins and an increased degree of VSMC apoptosis.
    explanation: >-
      Cultured VSMCs from resected Marfan and bicuspid-valve thoracic aneurysm
      tissue show both defective matrix protein secretion and increased
      apoptosis.
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunohistochemical study of cultured MS and BAV VSMC showed intracellular
      accumulation and reduction of extracellular distribution of fibrillin,
      fibronectin, and tenascin.
    explanation: >-
      Documents the secretory defect — matrix proteins retained intracellularly
      rather than deposited into the media — underlying the VSMC contribution.
  - reference: PMID:29360940
    reference_title: "From genetics to response to injury: vascular smooth muscle cells in aneurysms and dissections of the ascending aorta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vSMC disappearance, medial areas of mucoid degeneration, and extracellular
      matrix (ECM) breakdown
    explanation: >-
      Names VSMC disappearance as one of the defining histopathological
      alterations of thoracic aortic aneurysm and dissection. Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Medial degeneration of the aortic wall
    causal_link_type: DIRECT
- name: Extracellular matrix proteolysis and elastic fiber fragmentation
  description: >-
    Protease-mediated destruction of the medial extracellular matrix —
    matrix metalloproteinase activity, plus plasmin generated from plasminogen
    that is convected across the abnormally permeable aortic wall — degrades
    elastin and fibrillar collagen. Loss of intact elastic lamellae removes the
    principal load-bearing element of the media. Inflammatory reactions and
    oxidative stress act as amplifiers of this proteolytic injury rather than as
    the primary lesion, distinguishing thoracic medial degeneration from the
    florid transmural inflammation of abdominal aortic aneurysm.
  role: effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  notes: >-
    GO:0048251 elastic fiber assembly (DECREASED) was removed from this node
    during review. The claim here is proteolytic DESTRUCTION of existing
    elastin, which GO:0022617 extracellular matrix disassembly (INCREASED)
    already states; reduced assembly is a different mechanism, is not what the
    cited evidence shows, and carrying both would have implied a synthetic
    defect the sources do not support.
  evidence:
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Up-regulation of MMP-2 might play a role in VSMC apoptosis in MS VSMC."
    explanation: >-
      Implicates MMP-2 upregulation, a matrix-degrading protease, in the
      cellular injury of thoracic aneurysm tissue.
  - reference: PMID:29360940
    reference_title: "From genetics to response to injury: vascular smooth muscle cells in aneurysms and dissections of the ascending aorta."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      aneurysms and dissections, whatever their aetiologies, are characterized by
      an increase in wall permeability leading to transmural advection of plasma
      proteins which could interact with vSMCs and ECM components
    explanation: >-
      Describes the aetiology-independent wall-permeability/plasminogen route to
      proteolytic matrix injury. Evidence source is OTHER because this is a
      review.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inflammatory reactions and increased oxidative stress are cellular
      responses to aortic injury, and they may induce protease-mediated
      destruction of the aortic wall.
    explanation: >-
      Positions inflammation and oxidative stress as responses to aortic injury
      that amplify protease-mediated wall destruction. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Medial degeneration of the aortic wall
    causal_link_type: DIRECT
- name: Segment-specific smooth muscle lineage susceptibility
  description: >-
    The thoracic aorta is a mosaic of vascular smooth muscle cells of different
    embryonic origin: root VSMCs derive from cardiogenic mesoderm, the ascending
    aorta from both cardiogenic mesoderm and cardiac neural crest, and the
    descending thoracic aorta from somites. Lineages differ in their
    transcriptional response to stimuli such as TGF-beta, and the boundaries
    between them are proposed focal points of lamellar weakness. This
    developmental mosaicism is a mechanistic explanation for why proximal and
    distal thoracic aneurysm/dissection differ in age at onset, risk-factor
    profile, and histology.
  role: modifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VSMCs in the root arise from cardiogenic mesoderm cells, whereas the
      ascending aorta is composed of both cardiogenic mesodermal cells and
      cardiac neural crest cells
    explanation: >-
      Establishes the differing embryonic origins of VSMCs across proximal
      thoracic aortic segments. Evidence source is OTHER because this is a
      review.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The descending thoracic aorta is composed of somite-derived SMCs"
    explanation: >-
      Confirms the distinct somitic origin of descending thoracic aortic VSMCs.
      Evidence source is OTHER because this is a review.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The transition points between different VSMCs may represent focal points of
      weakness between lamellar units where dissection occurs or propagates.
    explanation: >-
      Proposes lineage-boundary weakness as the link from developmental
      mosaicism to segment-specific dissection. Marked PARTIAL because the
      source frames this as a hypothesis ("may represent"), not a demonstrated
      mechanism.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ascending TAD usually occurs in younger patients than descending TAD does
      and is more often associated with a connective tissue disorder.
    explanation: >-
      Documents the clinical segment split that the lineage model is invoked to
      explain. Evidence source is OTHER because this is a review.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      dissection arising in the descending thoracic aorta tends to occur in older
      patients, who often have a history of hypertension
    explanation: >-
      Documents the older, hypertensive phenotype of descending thoracic
      disease, the distal half of the segment split. Evidence source is OTHER
      because this is a review.
  - reference: PMID:34238012
    reference_title: "Root Dilatation Is More Malignant Than Ascending Aortic Dilation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      studies of natural behavior have generally treated the aortic root and the
      ascending aorta as 1 unit despite embryological, anatomical, and functional
      differences
    explanation: >-
      Independently invokes embryological difference between root and ascending
      aorta as the rationale for treating them as distinct segments, and the
      study then confirms their natural histories differ.
  - reference: PMID:34238012
    reference_title: "Root Dilatation Is More Malignant Than Ascending Aortic Dilation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The natural histories of the aortic root and mid-ascending aorta are
      uniquely different.
    explanation: >-
      Clinical confirmation that segment identity, not just diameter, governs
      behaviour — the outcome the lineage-mosaicism model predicts.
  downstream:
  - target: Medial degeneration of the aortic wall
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Medial degeneration of the aortic wall
  description: >-
    The convergent tissue lesion of thoracic aortic aneurysm: loss of smooth
    muscle cell nuclei, fragmentation and/or loss of elastic fibers, and mucoid
    extracellular matrix accumulation (MEMA) within the media. The 2016
    Society for Cardiovascular Pathology / Association for European
    Cardiovascular Pathology consensus replaced the older terms "cystic medial
    necrosis" and "medionecrosis" with these descriptive terms and defined a
    grading system. Importantly, this is a non-inflammatory degenerative lesion;
    florid inflammatory infiltrate is characteristically absent.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  evidence:
  - reference: PMID:27031798
    reference_title: "Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular Pathology and the Association For European Cardiovascular Pathology: II. Noninflammatory degenerative diseases - nomenclature and diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Older terms such as cystic medial necrosis and medionecrosis are replaced
      by more technically accurate terms such as mucoid extracellular matrix
      accumulation (MEMA), elastic fiber fragmentation and/or loss, and smooth
      muscle cell nuclei loss.
    explanation: >-
      Defines the three component lesions of medial degeneration in the current
      consensus nomenclature for surgical aortic specimens.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases of TAD are characterized by medial degeneration in the aortic
      wall. This medial degeneration is associated with the fragmentation and
      loss of elastic fibers, SMC depletion, fibrotic remodeling, and the
      accumulation of mucopolysaccharides in the aortic media.
    explanation: >-
      Independently confirms medial degeneration as the dominant wall lesion and
      enumerates its components. Evidence source is OTHER because this is a
      review.
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MS and BAV aneurysm histology showed areas of cystic medial necrosis (CMN)
      without inflammatory infiltrate.
    explanation: >-
      Human aneurysm histology confirms the non-inflammatory character of the
      medial lesion, distinguishing it from inflammation-driven abdominal
      aneurysm.
  downstream:
  - target: Loss of wall tensile strength and progressive dilatation
    causal_link_type: DIRECT
- name: Loss of wall tensile strength and progressive dilatation
  description: >-
    The degenerated media can no longer withstand the circumferential wall
    stress imposed by pulsatile blood pressure. By the Laplace relationship,
    each increment of dilatation raises wall tension, which drives further
    dilatation — a self-reinforcing cycle. Growth is slow and accelerates with
    size: the aneurysmal thoracic aorta enlarges by about 0.10 cm/year overall,
    but far faster distally (0.19 cm/year descending) than proximally
    (0.07 cm/year ascending). Because absolute diameter under-rates risk in
    small patients, size indexed to height (aortic height index) or body surface
    area (aortic size index) improves risk stratification.
  role: effector
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the aneurysmal thoracic aorta grows at an average rate of 0.10 cm per year
      (0.07 for ascending and 0.19 for descending)
    explanation: >-
      Quantifies the slow, segment-dependent growth of the dilating thoracic
      aorta in the Yale natural-history cohort.
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated mean growth rate of descending thoracic and thoracoabdominal
      aortic aneurysms was 0.19 cm/year, increasing with increasing aortic size.
    explanation: >-
      Confirms the descending growth rate and, critically, that growth
      accelerates with size — the signature of the self-reinforcing Laplace
      cycle.
  - reference: PMID:29395211
    reference_title: "Height alone, rather than body surface area, suffices for risk estimation in ascending aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both ASI and AHI were shown to be significant predictors of complications"
    explanation: >-
      Establishes that body-size-indexed aortic dimensions predict natural
      complications, motivating index-based rather than purely diameter-based
      risk assessment.
  - reference: PMID:29395211
    reference_title: "Height alone, rather than body surface area, suffices for risk estimation in ascending aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the simpler height-based ratio (excluding weight and BSA calculations)
      yields satisfactory results for evaluating the risk of natural
      complications
    explanation: >-
      Supports the aortic height index as a practical body-size adjustment for
      risk estimation in ascending aneurysm.
  downstream:
  - target: Aortic dissection and rupture
    causal_link_type: DIRECT
- name: Aortic dissection and rupture
  description: >-
    Wall failure, the lethal endpoint. When stress exceeds the strength of the
    degenerated media, an intimal tear admits blood into the media and propagates
    a dissection, or the wall ruptures outright. Rupture risk is strongly
    non-linear in diameter: hinge points for natural complications occur near
    6.0 cm for the ascending and 7.0 cm for the descending aorta, and a 6 cm
    aorta carries an approximately 14% annual risk of rupture, dissection, or
    death. Dissection, however, does NOT follow the same size dependence — a
    majority of both type A (59% below 5.5 cm) and type B (80% below 5 cm)
    dissections occur below the operative threshold, so diameter-triggered
    prophylactic repair prevents rupture far more effectively than it prevents
    dissection.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hinge points for natural complications of aortic aneurysm (rupture or
      dissection) were found at 6.0 cm for the ascending aorta and 7.0 cm for the
      descending
    explanation: >-
      Establishes the non-linear, size-dependent hinge points at which
      catastrophic complications sharply increase.
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient with an aorta that has reached 6 cm maximal diameter faces the
      following yearly rates of devastating adverse events: rupture (3.6%),
      dissection (3.7%), death (10.8%), rupture, dissection, or death (14.1%)
    explanation: >-
      Quantifies the annual event rates at the 6 cm hinge point that justify
      preemptive repair.
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median size at acute type B dissection was 4.1 cm. Some 80% of dissections
      occurred below 5 cm, whereas 93% of ruptures occurred above 5 cm.
    explanation: >-
      Demonstrates the divergent size dependence of dissection versus rupture in
      the descending aorta — the basis for the caveat that size-based surgery
      does not protect against dissection.
  - reference: PMID:17709637
    reference_title: "Aortic diameter >or = 5.5 cm is not a good predictor of type A aortic dissection: observations from the International Registry of Acute Aortic Dissection (IRAD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximum aortic diameters averaged 5.3 cm; 349 (59%) patients had aortic
      diameters <5.5 cm and 229 (40%) patients had aortic diameters <5.0 cm.
    explanation: >-
      Extends the sub-threshold dissection finding to the ascending aorta: most
      type A dissections in IRAD occurred below the 5.5 cm operative threshold.
  - reference: PMID:9851478
    reference_title: "Improved prognosis of thoracic aortic aneurysms: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year risk of rupture as a function of aneurysm size at recognition
      was 0% for aneurysms less than 4 cm in diameter
    explanation: >-
      Independent population-based confirmation of the steep size-dependence of
      rupture risk, outside a surgical referral cohort; the same sentence reports
      16% for 4-5.9 cm and 31% for 6 cm or more.
phenotypes:
- category: Cardiovascular
  name: Thoracic aortic aneurysm
  description: >-
    Localized permanent dilatation of the thoracic aorta, the defining lesion.
    Usually asymptomatic and discovered incidentally on imaging performed for
    another indication.
  phenotype_term:
    preferred_term: Thoracic aortic aneurysm
    term:
      id: HP:0012727
      label: Thoracic aortic aneurysm
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:9851478
    reference_title: "Improved prognosis of thoracic aortic aneurysms: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Managing thoracic aortic aneurysms identified incidentally by increased use
      of computed tomography, echocardiography, and magnetic resonance imaging is
      problematic, especially in the elderly.
    explanation: >-
      Confirms that thoracic aortic aneurysm is characteristically an incidental,
      asymptomatic imaging finding. Frequency is VERY_FREQUENT because the
      dilatation is the disease-defining lesion, present in all cases by
      definition.
- category: Cardiovascular
  name: Aortic dissection
  description: >-
    Separation of the layers of the aortic wall by blood entering the media
    through an intimal tear. Dissection characteristically occurs at modest
    diameters in both segments — median 4.1 cm for type B, and 59% of type A
    dissections below 5.5 cm — so it is not reliably prevented by diameter-based
    prophylactic repair.
  phenotype_term:
    preferred_term: Aortic dissection
    term:
      id: HP:0002647
      label: Aortic dissection
    temporality: ACUTE
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient with an aorta that has reached 6 cm maximal diameter faces the
      following yearly rates of devastating adverse events: rupture (3.6%),
      dissection (3.7%), death (10.8%), rupture, dissection, or death (14.1%)
    explanation: >-
      Documents dissection as a quantified natural complication of thoracic
      aortic aneurysm.
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median size at acute type B dissection was 4.1 cm."
    explanation: >-
      Establishes the characteristically modest aortic size at which descending
      (type B) dissection occurs.
  - reference: PMID:17709637
    reference_title: "Aortic diameter >or = 5.5 cm is not a good predictor of type A aortic dissection: observations from the International Registry of Acute Aortic Dissection (IRAD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients with acute type A acute aortic dissection present
      with aortic diameters <5.5 cm and thus do not fall within current
      guidelines for elective aneurysm surgery.
    explanation: >-
      IRAD registry evidence that most type A dissections occur below the
      elective-surgery diameter threshold.
- category: Cardiovascular
  name: Aortic rupture
  description: >-
    Frank transmural failure of the aortic wall with catastrophic hemorrhage.
    Unlike dissection, rupture risk rises steeply with diameter, and in the
    descending aorta more than 90% of ruptures occur above 5 cm.
  phenotype_term:
    preferred_term: Aortic rupture
    term:
      id: HP:0031649
      label: Aortic rupture
    temporality: ACUTE
  evidence:
  - reference: PMID:9851478
    reference_title: "Improved prognosis of thoracic aortic aneurysms: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative risk of rupture was 20% after 5 years. Seventy-nine percent
      of ruptures occurred in women
    explanation: >-
      Quantifies the cumulative 5-year rupture risk in a population-based cohort
      of degenerative thoracic aortic aneurysm.
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "93% of ruptures occurred above 5 cm"
    explanation: >-
      Establishes the strong size threshold for rupture in the descending
      thoracic aorta.
- category: Cardiovascular
  name: Aortic root aneurysm
  description: >-
    Dilatation localized to the aortic root (sinuses of Valsalva). The root is
    not simply the proximal end of the ascending aorta: it has a distinct
    natural history, and root dilatation carries a higher risk of adverse events
    than mid-ascending dilatation of the same degree, with a lower hinge point
    (5.0 cm versus 5.25 cm). Root involvement is also the segment most enriched
    for heritable aortopathy.
  phenotype_term:
    preferred_term: Aortic root aneurysm
    term:
      id: HP:0002616
      label: Aortic root aneurysm
  evidence:
  - reference: PMID:34238012
    reference_title: "Root Dilatation Is More Malignant Than Ascending Aortic Dilation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dilation of the aortic root imparts a significant higher risk of adverse events."
    explanation: >-
      Yale cohort of 1,162 patients with ascending thoracic aortic aneurysm, in
      which root and mid-ascending diameters were measured separately, showing
      that root dilatation is the more dangerous of the two.
  - reference: PMID:34238012
    reference_title: "Root Dilatation Is More Malignant Than Ascending Aortic Dilation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dedicated risk curves for the aortic root and the mid-ascending aorta
      revealed hinge points at 5.0 and 5.25 cm, respectively.
    explanation: >-
      Quantifies the segment-specific hinge points that distinguish root from
      mid-ascending aneurysm.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Ascending TAD usually occurs in younger patients than descending TAD does
      and is more often associated with a connective tissue disorder.
    explanation: >-
      Supports the proximal segment as the one enriched for younger patients and
      heritable connective tissue disease. Marked PARTIAL because the source
      addresses the ascending aorta as a whole and does not separate the root.
      Evidence source is OTHER because this is a review.
- category: Cardiovascular
  name: Bicuspid aortic valve
  description: >-
    A congenital two-cusp aortic valve that generates an eccentric high-shear jet
    against the ascending aorta and is a major risk factor for ascending
    aneurysm. Bicuspid aortic tissue also shows an intrinsic vascular smooth
    muscle cell abnormality independent of the valve hemodynamics.
  phenotype_term:
    preferred_term: Bicuspid aortic valve
    term:
      id: HP:0001647
      label: Bicuspid aortic valve
  evidence:
  - reference: PMID:36797175
    reference_title: "Magnetic resonance imaging-based hemodynamic wall shear stress alters aortic wall tissue biomechanics in bicuspid aortic valve patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preoperative 4-dimensional flow magnetic resonance imaging was performed on
      22 patients who underwent prophylactic aortic root and/or ascending aorta
      replacement.
    explanation: >-
      A surgical cohort of bicuspid aortopathy patients requiring prophylactic
      root/ascending replacement, directly evidencing the co-occurrence of
      bicuspid aortic valve with operative-threshold ascending aneurysm.
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Bicuspid aortic valve (BAV) is a congenital heart malformation of unknown
      cause. Both conditions are associated with ascending aortic aneurysm and
      premature death.
    explanation: >-
      States the bicuspid-valve/ascending-aneurysm association. Marked PARTIAL
      because this sentence is background framing in an in vitro study rather
      than a finding the study itself establishes.
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The findings suggest the presence of a fundamental cellular abnormality in
      BAV thoracic aorta, possibly of genetic origin.
    explanation: >-
      Supports an intrinsic cellular (not purely hemodynamic) contribution of
      bicuspid aortopathy to aneurysm formation.
- category: Cardiovascular
  name: Ascending aortic aneurysm
  description: >-
    Aneurysm of the tubular ascending aorta, the commonest thoracic segment
    involved and the one with the slower growth rate of the two major segments -
    0.07 cm/year against 0.19 for the descending aorta. Its hinge point for
    rupture or dissection sits at 6.0 cm, a full centimetre below the descending
    threshold, which is why segment identity rather than absolute diameter drives
    the intervention decision. Distinguished from aortic root aneurysm, curated
    separately here, because the root has its own natural history.
  phenotype_term:
    preferred_term: Ascending tubular aorta aneurysm
    term:
      id: HP:0004970
      label: Ascending tubular aorta aneurysm
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hinge points for natural complications of aortic aneurysm (rupture or
      dissection) were found at 6.0 cm for the ascending aorta and 7.0 cm for the
      descending.
    explanation: >-
      Establishes the ascending segment as a distinct entity with its own
      complication threshold, which is the clinical expression of the
      segment-specific susceptibility this entry models mechanistically.
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the aneurysmal thoracic aorta grows at an average rate of 0.10 cm per year
      (0.07 for ascending and 0.19 for descending).
    explanation: >-
      The segment-specific growth rates, nearly threefold different, from the
      same 1600-patient prospective series.
- category: Cardiovascular
  name: Descending thoracic aortic aneurysm
  description: >-
    Aneurysm of the descending thoracic aorta, which grows almost three times
    faster than the ascending segment (0.19 versus 0.07 cm/year) yet tolerates a
    larger diameter before its complication hinge point at 7.0 cm. A caveat worth
    carrying: the median size at acute type B dissection was 4.1 cm, well below
    that hinge point, so a diameter-based rule does not capture dissection risk in
    this segment the way it captures rupture risk.
  phenotype_term:
    preferred_term: Descending thoracic aorta aneurysm
    term:
      id: HP:0004959
      label: Descending thoracic aorta aneurysm
  evidence:
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated mean growth rate of descending thoracic and thoracoabdominal
      aortic aneurysms was 0.19 cm/year, increasing with increasing aortic size.
    explanation: >-
      Independent confirmation of the descending growth rate in a dedicated
      907-patient series, with the additional observation that growth accelerates
      with size.
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median size at acute type B dissection was 4.1 cm.
    explanation: >-
      The datum that complicates diameter-based management of this segment:
      dissection typically occurred well below the 7.0 cm hinge point (and below the 6.5 cm diameter at which
      intervention is recommended for this segment).
- category: Cardiovascular
  name: Chest pain
  description: >-
    The principal symptom, and one whose absence is more characteristic than its
    presence - thoracic aortic aneurysm is usually silent until complication, so
    new or severe chest or back pain in a known aneurysm is treated as
    dissection until proven otherwise rather than as a stable symptom.
  phenotype_term:
    preferred_term: Chest pain
    term:
      id: HP:0100749
      label: Chest pain
  notes: >-
    Deliberately carries no evidence item and no frequency. No cached source for
    this entry quantifies symptom frequency in unruptured thoracic aortic
    aneurysm, and the clinical rule stated here is guideline practice rather than
    a finding of any cited study. Curated because a phenotype list containing
    only imaging findings would misrepresent how this disease presents.
- category: Cardiovascular
  name: Death from aortic complication
  description: >-
    Mortality is the terminal outcome the entire size-threshold literature exists
    to prevent, and until now the pathograph in this entry stopped at dissection
    and rupture without representing it. At 6 cm maximal diameter the yearly rate
    of death reaches 10.8%, exceeding the rates of rupture and dissection
    individually - which is the quantitative core of the argument for elective
    repair before that diameter.
  phenotype_term:
    preferred_term: Sudden death
    term:
      id: HP:0001699
      label: Sudden death
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient with an aorta that has reached 6 cm maximal diameter faces the
      following yearly rates of devastating adverse events: rupture (3.6%),
      dissection (3.7%), death (10.8%), rupture, dissection, or death (14.1%).
    explanation: >-
      Quantifies death as a distinct outcome alongside rupture and dissection,
      and at a higher yearly rate than either.
  notes: >-
    HP:0001699 Sudden death is the closest available term. The 10.8% yearly
    figure is all-cause death in this aneurysm cohort rather than specifically
    sudden death, so the term is broader in mechanism than the cited datum;
    preferred_term keeps the phenotype label general for that reason.
- category: Cardiovascular
  name: Aortic regurgitation
  description: >-
    Valve incompetence arising from the aneurysm itself rather than from primary
    valve disease: root dilatation widens the aortic annulus and separates the
    commissures, so the leaflets no longer coapt. This is the structural
    consequence that makes root aneurysms behave differently from tubular ones,
    and it is the main reason roots are operated at smaller diameters - the
    decision is driven by valve competence as well as by rupture risk. It also
    changes the operation: a competent-leaflet root can take a valve-sparing
    replacement, whereas established regurgitation with damaged leaflets points
    to a composite graft.
  phenotype_term:
    preferred_term: Aortic regurgitation
    term:
      id: HP:0001659
      label: Aortic regurgitation
  frequency: FREQUENT
  evidence:
  - reference: PMID:10685714
    reference_title: "The International Registry of Acute Aortic Dissection (IRAD): new insights into an old disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic physical findings such as aortic regurgitation and pulse deficit
      were noted in only 31.6% and 15.1% of patients, respectively
    explanation: >-
      Quantifies aortic regurgitation in a large registry, and the word "only"
      is the authors' point: it is present in under a third even where it is
      classically expected. PARTIAL, and the caveat is important - this is the
      acute DISSECTION population, not the stable aneurysm population this entry
      otherwise describes, so the figure bounds rather than measures the
      frequency in unruptured disease. The FREQUENT band is set from this
      figure and should be read with that ascertainment attached.
  notes: >-
    Curated after a previous round declined it for want of a cached source. The
    mechanistic case is what justifies it independently of the frequency: root
    dilatation to annular dilatation to valve incompetence is a direct
    structural consequence of the Loss of wall tensile strength and progressive
    dilatation node this entry already models, and without it the pathograph's
    downstream story runs only to dissection and rupture, omitting the
    commonest reason a root aneurysm is repaired early.
histopathology:
- name: Medial degeneration (MEMA, elastic fiber fragmentation, smooth muscle cell nuclei loss)
  description: >-
    The diagnostic surgical-pathology lesion of resected thoracic aortic
    aneurysm. The 2016 SCVP/AECVP consensus retired "cystic medial necrosis" and
    "medionecrosis" in favor of three separately graded descriptive findings:
    mucoid extracellular matrix accumulation (MEMA), elastic fiber fragmentation
    and/or loss, and smooth muscle cell nuclei loss. Inflammatory infiltrate is
    characteristically absent — this is a non-inflammatory degenerative lesion.
  evidence:
  - reference: PMID:27031798
    reference_title: "Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular Pathology and the Association For European Cardiovascular Pathology: II. Noninflammatory degenerative diseases - nomenclature and diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Older terms such as cystic medial necrosis and medionecrosis are replaced
      by more technically accurate terms such as mucoid extracellular matrix
      accumulation (MEMA), elastic fiber fragmentation and/or loss, and smooth
      muscle cell nuclei loss.
    explanation: >-
      Defines the current consensus histopathological nomenclature for the
      medial lesion of thoracic aortic aneurysm.
  - reference: PMID:27031798
    reference_title: "Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular Pathology and the Association For European Cardiovascular Pathology: II. Noninflammatory degenerative diseases - nomenclature and diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A straightforward system of grading is presented to gauge the extent of
      medial degeneration
    explanation: >-
      Confirms that the consensus provides a formal grading scheme for reporting
      the extent of medial degeneration.
  - reference: PMID:12970255
    reference_title: "Abnormal extracellular matrix protein transport associated with increased apoptosis of vascular smooth muscle cells in marfan syndrome and bicuspid aortic valve thoracic aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MS and BAV aneurysm histology showed areas of cystic medial necrosis (CMN)
      without inflammatory infiltrate.
    explanation: >-
      Documents the absence of inflammatory infiltrate in human thoracic aneurysm
      histology, the feature that separates it from abdominal aortic aneurysm.
environmental:
- name: Systemic hypertension
  description: >-
    Chronic elevation of blood pressure increases circumferential wall stress on
    the thoracic aorta and is the leading modifiable risk factor for aneurysm
    progression and dissection, particularly for descending thoracic disease in
    older patients.
  evidence:
  - reference: PMID:39145396
    reference_title: "Acute Aortic Dissection: Observational Lessons Learned From 11 000 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over time, the rates of hypertension increased from 77.8% to 80.4%"
    explanation: >-
      Hypertension is present in roughly 80% of patients enrolled in the
      International Registry of Acute Aortic Dissection. Note the denominator is
      patients presenting with dissection, not an unselected aneurysm cohort, so
      this is a risk-factor prevalence rather than a phenotype frequency.
  - reference: PMID:17709637
    reference_title: "Aortic diameter >or = 5.5 cm is not a good predictor of type A aortic dissection: observations from the International Registry of Acute Aortic Dissection (IRAD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent predictors of dissection at smaller diameters (<5.5 cm)
      included a history of hypertension
    explanation: >-
      Hypertension is an independent predictor of dissection occurring below the
      operative diameter threshold, strengthening its status as a causal risk
      factor rather than an incidental association.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      dissection arising in the descending thoracic aorta tends to occur in older
      patients, who often have a history of hypertension
    explanation: >-
      Links hypertension specifically to the descending thoracic segment.
      Evidence source is OTHER because this is a review.
- name: Aging
  description: >-
    Age-related vasculopathic change in the aortic media is the principal
    non-modifiable driver of sporadic degenerative thoracic aortic aneurysm.
    In the Olmsted County population-based cohort, women with thoracic aortic
    aneurysm were recognized at a mean age of 75.9 years and men at 62.8 years.
  evidence:
  - reference: PMID:27031798
    reference_title: "Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular Pathology and the Association For European Cardiovascular Pathology: II. Noninflammatory degenerative diseases - nomenclature and diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vasculopathic aging processes involved in vascular injury can cause both
      distinct and nonspecific histopathologic changes with degeneration of the
      media as a common denominator
    explanation: >-
      Identifies vasculopathic aging as a cause converging on medial
      degeneration.
  - reference: PMID:9851478
    reference_title: "Improved prognosis of thoracic aortic aneurysms: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      51% of thoracic aortic aneurysms were identified in women who were
      considerably older at recognition than men (mean age, 75.9 vs 62.8 years,
      respectively; P= .01)
    explanation: >-
      Documents the advanced age at recognition, and the notable sex difference,
      in population-based degenerative thoracic aortic aneurysm.
- name: Fluoroquinolone exposure
  description: >-
    Systemic fluoroquinolone antibiotics are associated with a short-term
    increase in the risk of aortic aneurysm or dissection, an association driven
    largely by aneurysm rather than dissection. The absolute excess risk is small
    (an estimated 82 extra cases per million treatment episodes by 60 days), but
    the association underlies current advice to avoid fluoroquinolones in
    patients with known aortic aneurysm or aortopathy risk.
  evidence:
  - reference: PMID:29519881
    reference_title: "Fluoroquinolone use and risk of aortic aneurysm and dissection: nationwide cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluoroquinolone use was associated with an increased risk of aortic
      aneurysm or dissection (hazard ratio 1.66
    explanation: >-
      Propensity-matched Swedish nationwide cohort quantifying the
      fluoroquinolone-associated risk increase; the source gives the 95%
      confidence interval as 1.12 to 2.46.
  - reference: PMID:29519881
    reference_title: "Fluoroquinolone use and risk of aortic aneurysm and dissection: nationwide cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a propensity score matched cohort, fluoroquinolone use was associated
      with an increased risk of aortic aneurysm or dissection. This association
      appeared to be largely driven by aortic aneurysm.
    explanation: >-
      Qualifies the signal as driven mainly by aneurysm; marked PARTIAL because
      this is an observational association from which causality cannot be
      established.
- name: Cigarette smoking
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  description: >-
    Smoking is over-represented among individuals with thoracic aortic aneurysm
    and dissection. Its contribution is less dominant here than in abdominal
    aortic aneurysm, where smoking is the single strongest risk factor.
  evidence:
  - reference: PMID:37308786
    reference_title: "Genome-wide association study of thoracic aortic aneurysm and dissection in the Million Veteran Program."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants with TAAD were more likely to be older, male, prescribed
      statin therapy and former smokers.
    explanation: >-
      Baseline characteristics of TAAD cases in the Million Veteran Program show
      enrichment for former smoking. Marked PARTIAL because this is an unadjusted
      baseline-characteristics comparison, not a risk estimate.
genetic:
- name: Family history of arterial aneurysm
  relationship_type: SUSCEPTIBILITY
  notes: >-
    A substantial minority of thoracic aortic aneurysm probands have affected
    first-degree relatives, indicating that heritable aortopathy is
    under-recognized within apparently sporadic thoracic aortic aneurysm
    populations. This is the rationale for family screening and for referring
    selected probands for genetic evaluation; the specific monogenic entities
    are curated as separate dismech entries (see notes).
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      family pedigrees confirm that 21% of probands with thoracic aortic aneurysm
      have first-order family members with arterial aneurysm
    explanation: >-
      Quantifies the familial clustering seen within an unselected thoracic
      aortic aneurysm cohort.
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family members should be evaluated."
    explanation: >-
      States the resulting clinical recommendation for family evaluation.
diagnosis:
- name: Cross-sectional and echocardiographic aortic imaging
  description: >-
    Diagnosis rests on measuring aortic diameter by CT angiography, MR
    angiography, or echocardiography. Most aneurysms are found incidentally on
    imaging performed for another indication. Diameter should be interpreted
    alongside a body-size index (aortic height index or aortic size index),
    since absolute diameter under-rates risk in smaller patients.
  evidence:
  - reference: PMID:9851478
    reference_title: "Improved prognosis of thoracic aortic aneurysms: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Managing thoracic aortic aneurysms identified incidentally by increased use
      of computed tomography, echocardiography, and magnetic resonance imaging is
      problematic, especially in the elderly.
    explanation: >-
      Names the three imaging modalities by which thoracic aortic aneurysm is
      detected.
  - reference: PMID:29395211
    reference_title: "Height alone, rather than body surface area, suffices for risk estimation in ascending aortic aneurysm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both ASI and AHI were shown to be significant predictors of complications"
    explanation: >-
      Supports body-size-indexed aortic measurement as part of diagnostic risk
      assessment.
treatments:
- name: Serial aortic imaging surveillance
  description: >-
    Repeated measurement of aortic diameter by CT, MR, or echocardiography to
    detect progressive dilatation and time prophylactic repair before the
    diameter hinge point is reached. Surveillance is the core management strategy
    for aneurysms below the operative threshold, and long-term surveillance is a
    named domain of the 2022 ACC/AHA aortic disease guideline.
  treatment_term:
    preferred_term: magnetic resonance imaging surveillance
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:36334952
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provides recommendations to guide clinicians in the diagnosis, genetic
      evaluation and family screening, medical therapy, endovascular and surgical
      treatment, and long-term surveillance of patients with aortic disease
    explanation: >-
      The ACC/AHA guideline identifies long-term surveillance as a core
      management domain for aortic disease.
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the aneurysmal thoracic aorta grows at an average rate of 0.10 cm per year
      (0.07 for ascending and 0.19 for descending)
    explanation: >-
      The slow, measurable growth rate is what makes interval imaging
      surveillance an effective strategy.
- name: Blood-pressure and wall-stress reducing pharmacotherapy
  description: >-
    Antihypertensive therapy, conventionally beta-blockade and/or
    renin-angiotensin system blockade, to lower the pulsatile wall stress driving
    dilatation. Medical therapy is a named management domain in the 2022 ACC/AHA
    aortic disease guideline. The evidence base is weaker than that framing
    suggests: the strongest randomized data come from syndromic (Marfan) cohorts,
    where the head-to-head Pediatric Heart Network trial found losartan no better
    than atenolol, and no comparable randomized evidence exists for sporadic
    degenerative thoracic aortic aneurysm. The distinction between those two
    findings matters and is easy to collapse: an individual-patient-data
    meta-analysis of seven randomized trials in Marfan syndrome found that
    allocation to an ARB approximately halved the annual rate of aortic root Z
    score increase against control, with the effect particularly large in
    fibrillin-1 variant carriers. So ARBs do work against control; what the
    head-to-head trial showed is that they are not superior to an active
    beta-blocker comparator. Both agents are curated here for that reason.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Loss of wall tensile strength and progressive dilatation
    treatment_effect: MODULATES
  evidence:
  - reference: PMID:36049495
    reference_title: "Angiotensin receptor blockers and β blockers in Marfan syndrome: an individual patient data meta-analysis of randomised trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a median follow-up of 3 years, allocation to ARB approximately
      halved the annual rate of change in the aortic root Z score
    explanation: >-
      Randomized individual-patient-data evidence across seven trials that
      angiotensin receptor blockade slows aortic root dilatation against
      control. This is the comparison the head-to-head losartan-versus-atenolol
      trial did not make, and it is why an ARB agent is curated here rather than
      beta blockade alone.
  - reference: PMID:36049495
    reference_title: "Angiotensin receptor blockers and β blockers in Marfan syndrome: an individual patient data meta-analysis of randomised trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prespecified secondary subgroup analyses showed that the effects of ARB
      were particularly large in those with pathogenic variants in fibrillin-1,
      compared with those without such variants (heterogeneity p=0·0050)
    explanation: >-
      The effect concentrates in fibrillin-1 carriers, which is mechanistically
      informative but also the reason this evidence is PARTIAL for the present
      entry: it comes from syndromic Marfan cohorts, and transfer to sporadic
      degenerative thoracic aortic aneurysm is not established.
  - reference: PMID:36334952
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provides recommendations to guide clinicians in the diagnosis, genetic
      evaluation and family screening, medical therapy, endovascular and surgical
      treatment, and long-term surveillance of patients with aortic disease
    explanation: >-
      The guideline abstract establishes medical therapy as a recommended
      management domain but does not itself quote a specific drug-class effect
      size; marked PARTIAL because the snippet supports the domain, not a
      quantified benefit.
  - reference: PMID:25405392
    reference_title: "Atenolol versus losartan in children and young adults with Marfan's syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both slopes were significantly less than zero, indicating a decrease in the
      aortic-root diameter relative to body-surface area with either treatment.
    explanation: >-
      Both wall-stress-reducing regimens slowed body-size-indexed root growth in
      Marfan syndrome. Marked PARTIAL because the cohort is syndromic Marfan, not
      sporadic degenerative thoracic aortic aneurysm, so the benefit is
      extrapolated rather than directly demonstrated for this entry's population.
  - reference: PMID:25405392
    reference_title: "Atenolol versus losartan in children and young adults with Marfan's syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among children and young adults with Marfan's syndrome who were randomly
      assigned to losartan or atenolol, we found no significant difference in the
      rate of aortic-root dilatation between the two treatment groups over a
      3-year period.
    explanation: >-
      Recorded as REFUTE against the specific claim that TGF-beta/AT1-directed
      therapy (losartan) is superior to conventional beta-blockade — the
      randomized trial found no difference.
- name: Prophylactic open surgical repair
  description: >-
    Elective open replacement of the aneurysmal segment before the diameter
    hinge point is reached. Conventional thresholds are approximately 5.5 cm for
    the ascending aorta and 6.5 cm for the descending aorta in non-syndromic
    disease, with earlier intervention (5.0 cm ascending, 6.0 cm descending) for
    Marfan syndrome or familial thoracic aortic aneurysm. A contemporary
    surveillance cohort found a seven-fold rise in mortality at diameters
    >=5.5 cm, supporting that threshold for rupture prevention — though it does
    not address the sub-threshold dissection problem.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: thoracic aortic aneurysm open repair
    term:
      id: NCIT:C158011
      label: Thoracic Aortic Aneurysm Open Repair
  target_mechanisms:
  - target: Aortic dissection and rupture
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:12440685
    reference_title: "Natural history of thoracic aortic aneurysms: indications for surgery, and surgical versus nonsurgical risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend intervention for the ascending aorta at 5.5 cm and for the
      descending aorta at 6.5 cm.
    explanation: >-
      States the diameter thresholds for prophylactic repair derived from the
      Yale natural-history risk/benefit analysis.
  - reference: PMID:41532501
    reference_title: "Ascending Thoracic Aortic Aneurysms in a Veterans Affairs Health System: Longitudinal Outcomes and Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATAA all-cause mortality increases with diameter, with a 7-fold incidence
      increase in aneurysms ≥5.5 cm.
    explanation: >-
      Contemporary surveillance cohort evidence supporting the 5.5 cm
      prophylactic-repair threshold for ascending aneurysm.
  - reference: PMID:41532501
    reference_title: "Ascending Thoracic Aortic Aneurysms in a Veterans Affairs Health System: Longitudinal Outcomes and Risk Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the 5.5 cm threshold for prophylactic ATAA repair"
    explanation: >-
      Explicit contemporary endorsement of the operative threshold.
  - reference: PMID:17709637
    reference_title: "Aortic diameter >or = 5.5 cm is not a good predictor of type A aortic dissection: observations from the International Registry of Acute Aortic Dissection (IRAD)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients with acute type A acute aortic dissection present
      with aortic diameters <5.5 cm and thus do not fall within current
      guidelines for elective aneurysm surgery.
    explanation: >-
      Recorded as REFUTE against the broader claim that diameter-triggered
      prophylactic repair prevents acute aortic events generally: most type A
      dissections occur in patients who never met the operative criterion.
- name: Thoracic endovascular aortic repair (TEVAR)
  description: >-
    Endovascular stent-graft exclusion of a descending thoracic aneurysm.
    Relative to open repair, TEVAR lowers postoperative mortality and morbidity
    and improves freedom from aortic-related death, but carries a higher
    reintervention burden and, in meta-analysis, inferior long-term all-cause
    survival — so the choice is a trade-off between perioperative safety and
    durability rather than a uniform advantage.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: endovascular aneurysm repair
    term:
      id: NCIT:C157839
      label: Endovascular Aneurysm Repair
  target_mechanisms:
  - target: Aortic dissection and rupture
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:39869368
    reference_title: "Comparison of short-and long-term outcomes between endovascular and open repair for descending thoracic aortic aneurysm: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      endovascular repair was associated with better freedom from aortic-related
      survival, a lower risk for postoperative mortality and morbidity
    explanation: >-
      Meta-analysis of 49,972 patients supports the perioperative and
      aortic-related-survival advantage of TEVAR for descending thoracic
      aneurysm.
  - reference: PMID:39869368
    reference_title: "Comparison of short-and long-term outcomes between endovascular and open repair for descending thoracic aortic aneurysm: a systematic review and meta-analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Open repair yielded significantly better long-term all-cause survival and
      freedom from aortic-related re-intervention than endovascular repair.
    explanation: >-
      Counterbalancing evidence from the same meta-analysis: TEVAR is not
      uniformly superior, with worse long-term all-cause survival and more
      reinterventions. Recorded as REFUTE against a claim of unqualified TEVAR
      superiority.
discussions:
- discussion_id: gap_taa_nondiameter_dissection_prediction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can aortic dissection risk be predicted by anything other than maximal
    diameter, given that a majority of both type A and type B dissections occur
    below the operative size threshold?
  attaches_to:
  - pathophysiology#Aortic dissection and rupture
  - pathophysiology#Loss of wall tensile strength and progressive dilatation
  rationale: >-
    Rupture and dissection have different size dependence, yet the entire
    management algorithm is built on diameter. In the descending aorta, median
    size at acute type B dissection was 4.1 cm with 80% of dissections below
    5 cm, while 93% of ruptures occurred above 5 cm. In the ascending aorta, 59%
    of IRAD type A dissections presented below 5.5 cm. Diameter-triggered
    prophylactic repair therefore addresses rupture well but leaves dissection
    risk largely unmitigated, and the authors of both cohorts state this
    explicitly. No validated non-diameter predictor (biomechanical, imaging
    biomarker, or circulating marker) is yet in routine clinical use, so the most
    common acute presentation of thoracic aortic disease is currently not
    preventable by the standard size-based algorithm.
  proposed_experiments:
  - experiment_id: taa_nondiameter_dissection_predictors
    name: Prospective imaging-biomarker cohort for sub-threshold aortic dissection
    description: >-
      Enrol patients under surveillance for thoracic aortic aneurysm below the
      operative diameter threshold and collect 4D-flow MRI wall shear stress,
      wall-strain/distensibility imaging, and aortic height index at baseline and
      at intervals, with acute aortic dissection as the prespecified endpoint.
    decision_criterion: >-
      A candidate marker predicts dissection independently of maximal diameter in
      multivariable competing-risks analysis, with reproducible discrimination in
      an external validation cohort.
    would_support:
    - pathophysiology#Aortic dissection and rupture
  evidence:
  - reference: PMID:31982126
    reference_title: "Natural history of descending thoracic and thoracoabdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute type B dissections occur frequently at small aortic sizes; thus,
      prophylactic size-based surgery may not afford a means for dissection
      protection.
    explanation: >-
      The source authors state the gap directly for the descending aorta:
      size-based prophylactic surgery does not protect against dissection.
  - reference: PMID:17709637
    reference_title: "Aortic diameter >or = 5.5 cm is not a good predictor of type A aortic dissection: observations from the International Registry of Acute Aortic Dissection (IRAD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methods other than size measurement of the ascending aorta are needed to
      identify patients at risk for dissection.
    explanation: >-
      The IRAD authors state the same gap for the ascending aorta and explicitly
      call for non-diameter risk-prediction methods.
  - reference: PMID:34238012
    reference_title: "Root Dilatation Is More Malignant Than Ascending Aortic Dilation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the guideline criterion of 5.5 cm for ascending aortic intervention misses
      many dissections occurring at smaller dimensions
    explanation: >-
      Restates the gap and offers one partial mitigation short of a new
      biomarker — segment-specific hinge points (5.0 cm root, 5.25 cm
      mid-ascending) rather than a single ascending threshold. Marked PARTIAL
      because refining the diameter criterion narrows but does not close the
      sub-threshold dissection gap.
- discussion_id: mismatch_taa_tgfbeta_losartan_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the TGF-beta-antagonism mechanism that prevents aortic aneurysm in the
    Marfan mouse translate into a clinically distinguishable benefit in humans,
    and does it apply at all to sporadic degenerative thoracic aortic aneurysm?
  attaches_to:
  - pathophysiology#Loss of wall tensile strength and progressive dilatation
  - pathophysiology#Segment-specific smooth muscle lineage susceptibility
  rationale: >-
    The mechanistic rationale for angiotensin-receptor blockade in aortopathy
    comes from a fibrillin-1 mouse model, in which losartan and a
    TGF-beta-neutralizing antibody prevented aneurysm outright. The subsequent
    randomized human trial in Marfan syndrome found no difference between
    losartan and atenolol in the rate of aortic-root dilatation over three years
    — both slowed indexed growth, but the TGF-beta-directed agent conferred no
    additional benefit than an active comparator. That trial is often read as
    showing the mechanism failed to translate, and it does not show that: a
    later individual-patient-data meta-analysis of seven randomized trials
    (1442 patients) found ARB allocation approximately halved the annual rate of
    aortic root Z score increase when compared against control rather than
    against a beta blocker, with a significantly larger effect in fibrillin-1
    variant carriers. The honest statement of the mismatch is therefore
    narrower than "losartan did not work": ARBs demonstrably slow root dilatation
    in Marfan syndrome, but they do not outperform beta blockade, so the
    human data do not isolate a TGF-beta-specific benefit of the magnitude the
    mouse model predicted. This remains a model-to-human fidelity question
    rather than an absence of evidence. The gap is wider still for this entry, because even the human
    trial evidence comes from syndromic Marfan disease, whereas sporadic
    degenerative thoracic aortic aneurysm has no comparable randomized data and
    is not established to be TGF-beta-driven at all. This is the main reason the
    entry does not declare conformance to the
    `aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation` node.
  proposed_experiments:
  - experiment_id: taa_tgfbeta_axis_in_sporadic_disease
    name: TGF-beta pathway activity in sporadic versus syndromic thoracic aneurysm tissue
    description: >-
      Compare canonical TGF-beta pathway activation (phospho-SMAD2/3 signalling,
      pathway transcriptional output) in resected aortic tissue from sporadic
      degenerative thoracic aortic aneurysm, syndromic heritable aortopathy, and
      non-aneurysmal control aorta, stratified by aortic segment and smooth
      muscle lineage.
    decision_criterion: >-
      Sporadic degenerative aneurysm tissue shows TGF-beta pathway activation
      comparable to syndromic aortopathy, versus control aorta, in independent
      specimen series.
    would_support:
    - pathophysiology#Segment-specific smooth muscle lineage susceptibility
  evidence:
  - reference: PMID:16601194
    reference_title: "Losartan, an AT1 antagonist, prevents aortic aneurysm in a mouse model of Marfan syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that aortic aneurysm in a mouse model of MFS is associated with
      increased TGF-beta signaling and can be prevented by TGF-beta antagonists
      such as TGF-beta-neutralizing antibody or the angiotensin II type 1
      receptor (AT1) blocker, losartan.
    explanation: >-
      The model-organism result establishing the TGF-beta antagonism rationale
      that did not reproduce as a distinguishable clinical benefit in humans.
  - reference: PMID:25405392
    reference_title: "Atenolol versus losartan in children and young adults with Marfan's syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among children and young adults with Marfan's syndrome who were randomly
      assigned to losartan or atenolol, we found no significant difference in the
      rate of aortic-root dilatation between the two treatment groups over a
      3-year period.
    explanation: >-
      The human randomized trial that did not reproduce a losartan-specific
      advantage, defining the model-to-human mismatch.
notes: >-
  **Scope.** This entry covers thoracic aortic aneurysm as the general clinical
  entity, with emphasis on the sporadic degenerative form — the aging /
  hypertension / bicuspid-valve disease that accounts for most clinically
  recognized cases. It is the thoracic counterpart of the `Abdominal Aortic
  Aneurysm` entry, and the two are mechanistically distinct: abdominal aneurysm
  is driven by chronic transmural inflammation and MMP-mediated proteolysis,
  whereas thoracic aneurysm is a characteristically NON-inflammatory medial
  degeneration.

  **Relationship to the heritable entries.** The monogenic and syndromic causes
  of thoracic aortic disease are curated as their own dismech entries and are not
  duplicated here: `Familial Thoracic Aortic Aneurysm and Aortic Dissection`
  (nonsyndromic heritable, ACTA2/MYH11/MYLK/PRKG1 and related), `Marfan
  Syndrome`, `Loeys-Dietz Syndrome`, `Vascular Ehlers-Danlos Syndrome`,
  `Aneurysm-Osteoarthritis Syndrome`, and `Rienhoff Syndrome`. Of these, the
  `Heritable Thoracic Aortic Disease` grouping currently lists as `members:`
  only `Familial Thoracic Aortic Aneurysm and Aortic Dissection`, `Marfan
  Syndrome`, `Loeys-Dietz Syndrome`, `Arterial Tortuosity Syndrome`, and
  `Shprintzen-Goldberg Syndrome` — it does not yet include `Vascular
  Ehlers-Danlos Syndrome`, `Aneurysm-Osteoarthritis Syndrome`, `Rienhoff
  Syndrome`, or the separately-curated `Loeys-Dietz Syndrome 4`/`Loeys-Dietz
  Syndrome 6` entries (tracked in issue #8866). This entry deliberately keeps
  its `genetic:` section to the family-history susceptibility signal (21% of
  probands have an affected first-degree relative) rather than re-listing the
  HTAD gene panel.

  **Partial module conformance.** Three nodes declare `conforms_to` against
  `aortopathy_tgfbeta_dysregulation` — the medial degeneration, progressive
  dilation, and dissection/rupture nodes, which are the aetiology-independent
  final common pathway. The entry deliberately does NOT conform at the module's
  upstream `Aortic Wall ECM or Contractile Apparatus Defect` (monogenic lesion)
  or `TGF-beta Signaling Dysregulation` nodes: in sporadic degenerative disease
  the trigger is acquired hemodynamic/aging injury, and paradoxically increased
  TGF-beta signaling is a documented feature of the heritable aortopathies but is
  not established as the driver of the sporadic degenerative form. Claiming those
  two nodes here would overstate the evidence; the open question is recorded as
  the `mismatch_taa_tgfbeta_losartan_translation` discussion rather than asserted
  as a mechanism.

  **No atherogenesis conformance.** Descending thoracic aneurysm frequently
  coexists with aortic atherosclerosis, but thoracic aortic aneurysm and
  dissection is mechanistically distinct from atherosclerotic occlusive disease,
  so this entry does not conform to the `atherogenesis` module.

  **Non-inflammatory qualifier.** Inflammation and oxidative stress are curated
  as amplifiers of protease-mediated wall injury (a documented *response* to
  aortic injury), not as the initiating lesion. Genuinely inflammatory thoracic
  aortic disease (giant cell arteritis, Takayasu arteritis, syphilitic aortitis)
  is a distinct entity covered by the `Aortitis` entry.

  **Deep research provenance.** Curated with the `claude_code` deep-research
  provider (`research/Thoracic_Aortic_Aneurysm-deep-research-claude_code.md`);
  no Edison/Falcon, Asta, or OpenScientist key was available in this environment.
  Provider output was treated as leads, not ground truth: every PMID was fetched
  with `just fetch-reference` and every snippet was checked as an exact
  whitespace-normalized substring of the cached abstract before commit. One
  candidate ontology term surfaced during drafting (`CHEBI:35567` for
  "beta-adrenergic antagonist") proved to denote an unrelated chemical and was
  replaced with the verified NCIT drug-class term.

name: Thoracic Aortic Aneurysm
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Thoracic aortic aneurysm (TAA) is a localized, permanent dilatation of the
  thoracic aorta — aortic root, ascending aorta, arch, or descending thoracic
  aorta. It is usually asymptomatic and detected incidentally on cross-sectional
  imaging or echocardiography, enlarging silently until it dissects or ruptures.
  Whatever the upstream cause, the converging tissue lesion is non-inflammatory
  medial degeneration: loss of vascular smooth muscle cell nuclei, fragmentation
  and loss of elastic fibers, and mucoid extracellular matrix accumulation in
  the media. The weakened wall dilates under pulsatile stress in a
  self-reinforcing Laplace cycle until wall stress exceeds wall strength.
  TAA is segment-heterogeneous: root and ascending aneurysms occur in younger
  patients and are enriched for heritable aortopathy and bicuspid-aortic-valve
  hemodynamic disease, whereas descending thoracic aneurysms occur in older,
  usually hypertensive patients and reflect an aging/degenerative process.
  Management centers on blood-pressure and wall-stress reduction, serial imaging
  surveillance, and prophylactic open or endovascular repair once diameter,
  size-index, growth-rate, or syndromic risk thresholds are met — though a
  majority of acute dissections occur below the operative diameter threshold,
  which is the central unsolved problem in the disease.
category: Complex

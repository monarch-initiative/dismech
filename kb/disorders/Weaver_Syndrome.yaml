pathophysiology:
- name: Reduced EZH2/PRC2 Histone Methyltransferase Activity
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  description: >-
    EZH2 is the catalytic subunit of Polycomb repressive complex 2 (PRC2), the
    predominant enzyme that mono-, di-, and trimethylates histone H3 lysine 27
    (H3K27me1/2/3). Heterozygous germline pathogenic EZH2 variants in Weaver
    syndrome are predominantly missense. In vitro reconstitution demonstrates
    reduced methyltransferase activity for tested Weaver-associated amino-acid
    changes. Isogenic work on ten representative variants further supports
    dominant-negative interference with PRC2 activity, but does not establish
    identical behavior for every reported allele.
  biological_scale: MOLECULAR
  gene:
    preferred_term: EZH2
    term:
      id: hgnc:3527
      label: EZH2
  genetic_context:
    gene:
      preferred_term: EZH2
      term:
        id: hgnc:3527
        label: EZH2
    variant_origin: GERMLINE
    allelic_events:
    - PATHOGENIC_VARIANT
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline EZH2 pathogenic variants are the disease trigger;
      most reported alleles are missense, but the structured context does not
      restrict the mechanism to one sequence-variant class.
  biological_processes:
  - preferred_term: peptidyl-lysine (H3K27) methylation
    term:
      id: GO:0018022
      label: peptidyl-lysine methylation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: histone H3K27 methyltransferase activity
    term:
      id: GO:0046976
      label: histone H3K27 methyltransferase activity

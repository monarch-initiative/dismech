    Facial features may be subtle, and clinical recognition becomes particularly
    challenging in older individuals. This is an age-dependent recognition issue;
    the cited cohort does not establish a progressive loss of facial features.
  evidence:
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through analyses of clinical data and facial photographs of EZH2 mutation-positive individuals, we have shown that the facial features can be subtle and the clinical diagnosis of Weaver syndrome is thus challenging, especially in older individuals."
    explanation: Directly supports age-dependent difficulty recognizing the facial phenotype.

genetic:
- name: EZH2
  gene_term:
    preferred_term: EZH2
    term:
      id: hgnc:3527
      label: EZH2
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    EZH2 encodes the catalytic histone methyltransferase subunit of PRC2.
    Pathogenic variants are predominantly missense and occur throughout the gene,
    with some clustering in the SET domain; truncating variants are uncommon and
    confined to the final exon after the SET domain. The recurrent p.Arg684Cys
    (R684C) was described as the most common Weaver missense variant in the 2023
    mouse-model report. Both de novo and inherited pathogenic variants occur, but
    their relative proportions are unknown.
  evidence:
  - reference: PMID:22177091
    reference_title: "Mutations in EZH2 cause Weaver syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data show that mutations in EZH2 cause Weaver syndrome."
    explanation: Establishes EZH2 as the causal gene for Weaver syndrome.
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations were primarily missense mutations occurring throughout the gene, with some clustering in the SET domain (12/48). Truncating mutations were uncommon (4/48) and only identified in the final exon, after the SET domain."
    explanation: Characterizes the EZH2 variant spectrum (mostly missense, rare truncating in final exon).
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of EZH2-related overgrowth is based on detection of a heterozygous germline EZH2 pathogenic variant on molecular genetic testing."
    explanation: GeneReviews confirms heterozygous germline EZH2 variants are diagnostic.
  - reference: PMID:38015625
    reference_title: "A mouse model of Weaver syndrome displays overgrowth and excess osteogenesis reversible with KDM6A/6B inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated a mouse model for the most common Weaver syndrome missense variant, EZH2 p.R684C."
    explanation: Supports the report-specific statement that p.R684C is the most common Weaver missense variant.
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some individuals diagnosed with EZH2-related overgrowth have an affected parent; some individuals diagnosed with EZH2-related overgrowth have the disorder as the result of a de novo EZH2 pathogenic variant. The proportion of individuals with EZH2-related overgrowth caused by a de novo pathogenic variant is unknown."
    explanation: >-
      Correctly bounds the origin distribution: both inherited and de novo
      variants occur, but their relative proportions are unknown.

diagnosis:
- name: Molecular Genetic Confirmation
  description: >-
    The diagnosis of EZH2-related overgrowth is established by detecting a
    heterozygous germline pathogenic variant in EZH2 on molecular genetic testing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Detection of a heterozygous germline pathogenic EZH2 variant establishes the diagnosis.
  evidence:
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of EZH2-related overgrowth is based on detection of a heterozygous germline EZH2 pathogenic variant on molecular genetic testing."
    explanation: GeneReviews states the defining molecular diagnostic criterion.
- name: PRC2 DNA Methylation Episignature Analysis
  description: >-
    Genome-wide DNA methylation analysis can detect a highly specific and
    sensitive Weaver-associated signature in the studied cohort. The signature
    can functionally classify loss-of-function versus gain-of-function missense
    variants, detect somatic mosaicism, and classify variants in the other PRC2
    core genes EED and SUZ12. It is an adjunct to variant interpretation; the
    defining Weaver diagnosis remains a heterozygous germline EZH2 pathogenic
    variant.
  diagnosis_term:
    preferred_term: DNA methylation episignature analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    A matching signature supports functional classification of an EZH2 or other
    core-PRC2 sequence variant, including mosaic and opposing functional states.
  evidence:
  - reference: PMID:32243864
    reference_title: "DNA Methylation Signature for EZH2 Functionally Classifies Sequence Variants in Three PRC2 Complex Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using genome-wide DNA methylation (DNAm) data for 187 individuals with OGID and 969 control subjects, we show that pathogenic variants in EZH2 generate a highly specific and sensitive DNAm signature reflecting the phenotype of WS. This signature can be used to distinguish loss-of-function from gain-of-function missense variants and to detect somatic mosaicism."
    explanation: Defines the study population, Weaver-associated signature, and its demonstrated functional-classification uses.
  - reference: PMID:32243864
    reference_title: "DNA Methylation Signature for EZH2 Functionally Classifies Sequence Variants in Three PRC2 Complex Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also show that the signature can accurately classify sequence variants in EED and SUZ12, which encode two other core components of PRC2, and predict the presence of pathogenic variants in undiagnosed individuals with OGID."
    explanation: Supports extension of the PRC2 signature to EED and SUZ12 variant classification.
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of EZH2-related overgrowth is based on detection of a heterozygous germline EZH2 pathogenic variant on molecular genetic testing."
    explanation: Prevents the adjunctive episignature from being misrepresented as a replacement for the defining molecular diagnosis.

differential_diagnoses:
- name: Sotos Syndrome
  description: >-
    Sotos syndrome (NSD1) is an important differential diagnosis because of its
    considerable phenotypic overlap with Weaver syndrome. Weaver facial features
    may be subtle, particularly in older individuals, so identification of an EZH2
    pathogenic variant provides an objective means of confirming Weaver syndrome
    and distinguishing it from Sotos syndrome.
  evidence:
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considerable phenotypic overlap between Sotos and Weaver syndromes is also evident."
    explanation: Documents the clinical overlap between Sotos and Weaver syndromes motivating differential diagnosis.
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of an EZH2 mutation can therefore provide an objective means of confirming a subtle presentation of Weaver syndrome and/or distinguishing Weaver and Sotos syndromes."
    explanation: Directly supports molecular EZH2 confirmation as the objective discriminator from Sotos syndrome.


  evidence:
  - reference: PMID:40846643
    reference_title: "Dominant-negative effects of Weaver syndrome-associated EZH2 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterozygous missense mutations in EZH2 cause Weaver syndrome (WS), a developmental disorder characterized by intellectual disability and overgrowth. EZH2 encodes the enzymatic subunit of Polycomb repressive complex 2 (PRC2), which mediates monomethylation, dimethylation, and trimethylation of histone H3 lysine 27 (H3K27me1/2/3)."
    explanation: Supports the causal heterozygous EZH2 context and the PRC2 H3K27 catalytic function represented by this node.
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations were primarily missense mutations occurring throughout the gene, with some clustering in the SET domain (12/48). Truncating mutations were uncommon (4/48) and only identified in the final exon, after the SET domain."
    explanation: >-
      Bounds the variant-spectrum claim: missense variants predominate, but
      truncating variants also occur.
  - reference: PMID:26694085
    reference_title: "Weaver syndrome-associated EZH2 protein variants show impaired histone methyltransferase function in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that WS-associated amino acid alterations reduce the histone methyltransferase function of EZH2 in this in vitro assay."
    explanation: In vitro PRC2 assays directly demonstrate impaired EZH2 methyltransferase activity for the tested Weaver-associated variants.
  - reference: PMID:40846643
    reference_title: "Dominant-negative effects of Weaver syndrome-associated EZH2 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, the pattern of H3K27me2/3 reductions indicated dominant-negative interference on PRC2 activity even when WS variants were expressed at low levels."
    explanation: The isogenic study supports dominant-negative interference with PRC2 for its representative Weaver variant panel.
  downstream:
  - target: H3K27me2/3 Depletion and Chromatin Decompaction
    causal_link_type: DIRECT
    hypothesis_groups:
    - dominant_negative_prc2
    - loss_of_function_prc2
    evidence:
    - reference: PMID:40846643
      reference_title: "Dominant-negative effects of Weaver syndrome-associated EZH2 variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We isogenically modeled 10 representative variants in embryonic stem cells and showed that they reduce global H3K27me2/3 with concomitant increases in H3K27ac and chromatin decompaction."
      explanation: Directly supports the modeled transition from reduced PRC2 activity to depleted H3K27me2/3 and decompacted chromatin in the representative isogenic variants.

- name: H3K27me2/3 Depletion and Chromatin Decompaction
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    In isogenic embryonic stem-cell models, ten representative
    Weaver-associated EZH2 variants reduce global H3K27me2/3, increase H3K27ac,
    and decompact chromatin. These are model-system molecular readouts rather
    than measurements from affected human developmental tissues.
  biological_scale: MOLECULAR

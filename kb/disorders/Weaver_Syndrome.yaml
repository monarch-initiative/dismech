    evidence:
    - reference: PMID:40846643
      reference_title: "Dominant-negative effects of Weaver syndrome-associated EZH2 variants."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "RNA-seq identified weakly Polycomb-bound genes that lose canonical PRC1 (cPRC1) occupancy and become derepressed, including several phenotypically relevant growth control genes."
      explanation: The same isogenic study observes cPRC1 loss and derepression, although it does not isolate every causal intermediate between the H3K27 change and transcriptional output.

- name: Impaired Polycomb Repression and Gene Derepression
  description: >-
    Weaver-associated EZH2 variants cause loss of canonical PRC1 occupancy and
    derepression at weakly Polycomb-bound genes in an isogenic stem-cell system.
    Several affected genes regulate growth, providing a plausible bridge from
    altered chromatin to overgrowth; the tissue-specific developmental
    intermediates remain incompletely defined.
  biological_scale: MOLECULAR

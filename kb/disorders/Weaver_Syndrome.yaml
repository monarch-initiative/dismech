discussions:
- discussion_id: weaver_r684c_skeletal_model_generalizability
  prompt: >-
    Does the skeletal mechanism observed in the Ezh2 p.R684C knock-in mouse
    generalize to the diverse heterozygous EZH2 variants and developing human
    bone represented in Weaver syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Osteoblast Differentiation and Excess Osteogenesis
  rationale: >-
    The p.R684C mouse provides coherent molecular, cellular, and bone-level
    evidence for excess osteogenesis, but it models one recurrent allele. Its
    H3K27me3 readout was measured in homozygous mouse embryonic fibroblasts,
    whereas its skeletal phenotype was measured in heterozygous mice and
    osteoblasts. Human disease is heterozygous and genetically heterogeneous,
    and no cited study directly measures osteoblast differentiation or advanced
    bone age in human variant-bearing skeletal cells. The model therefore
    supports a candidate skeletal mechanism without establishing pan-allelic
    human generality.
  proposed_experiments:
  - experiment_id: weaver-human-osteoblast-allelic-series
    name: Isogenic human osteoblast allelic-series study
    description: >-
      Generate heterozygous p.R684C and several structurally diverse
      Weaver-associated EZH2 variants in the same human iPSC background,
      differentiate them through mesenchymal progenitors into osteoblasts, and
      compare them with corrected isogenic controls across matched time points.
    readouts:
    - name: H3K27me2/3 abundance, BMP-pathway transcription, and osteogenic differentiation kinetics by allele
      target: "pathophysiology#Dysregulated Osteoblast Differentiation and Excess Osteogenesis"
    decision_criterion: >-
      Concordant H3K27 loss and excess osteogenesis across variant classes, with
      correction after restoration of wild-type EZH2 dosage, would support a
      general human skeletal mechanism. Absent, opposite, or allele-restricted
      effects would confine the mouse result to p.R684C or identify mechanistic
      subgroups.
  evidence:
  - reference: PMID:38015625
    reference_title: "A mouse model of Weaver syndrome displays overgrowth and excess osteogenesis reversible with KDM6A/6B inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated a mouse model for the most common Weaver syndrome missense variant, EZH2 p.R684C. Ezh2R684C/R684C mouse embryonic fibroblasts (MEFs) showed global depletion of H3K27me3. Ezh2R684C/+ mice had abnormal bone parameters, indicative of skeletal overgrowth, and Ezh2R684C/+ osteoblasts showed increased osteogenic activity."
    explanation: Establishes both the strength and the allele-, organism-, and zygosity-specific boundaries of the current skeletal model.
- discussion_id: weaver_neuroblastoma_mechanistic_bridge
  prompt: >-
    By what developmental and cell-type-specific mechanism does a germline
    heterozygous EZH2 pathogenic variant increase neuroblastoma frequency in
    Weaver syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Neuroblastoma Predisposition
  - pathophysiology#Impaired Polycomb Repression and Gene Derepression
  rationale: >-
    The human association with neuroblastoma is recognized, but the curated
    molecular studies establish PRC2/H3K27 disruption and growth-gene
    derepression in stem-cell systems rather than a transformation mechanism in
    the sympathoadrenal lineage from which neuroblastoma arises. Connecting
    these observations without lineage-specific evidence would overstate the
    pathograph. Resolving the bridge matters both for biological interpretation
    and for determining whether surveillance should eventually be stratified by
    variant or molecular phenotype.
  proposed_experiments:
  - experiment_id: weaver-neural-crest-neuroblastoma-model
    name: Isogenic human sympathoadrenal-lineage tumor-predisposition model
    description: >-
      Differentiate isogenic human iPSCs carrying representative heterozygous
      Weaver EZH2 variants and corrected controls through neural crest into
      sympathoadrenal progenitors, then follow chromatin state, differentiation,
      proliferation, and transformation-associated phenotypes longitudinally.
    readouts:
    - name: Variant-dependent H3K27/cPRC1 state and sympathoadrenal differentiation trajectory
      target: "pathophysiology#Impaired Polycomb Repression and Gene Derepression"
    - name: Persistent proliferative or transformation-associated phenotype in sympathoadrenal progenitors
      target: "phenotypes#Neuroblastoma Predisposition"
    decision_criterion: >-
      A reproducible variant-dependent chromatin defect that precedes impaired
      sympathoadrenal differentiation and persistent proliferative behavior,
      and is reversed by isogenic correction, would support a mechanistic bridge.
      Normal lineage behavior despite the expected H3K27 defect would argue that
      additional developmental, somatic, or environmental events are required.
  evidence:
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroblastoma occurs at an increased frequency in individuals with a heterozygous EZH2 pathogenic variant."
    explanation: Establishes the human tumor association whose molecular bridge remains unresolved.

epidemiology:
- name: 2013 EZH2-Positive Cohort Size
  description: >-
    A 2013 series identified 48 individuals with EZH2 mutations. This is a
    historical case-series count rather than a population prevalence estimate and
    should not be interpreted as the current worldwide number of affected people.
  evidence:
  - reference: PMID:24214728
    reference_title: "Weaver syndrome and EZH2 mutations: Clarifying the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, we have identified 48 individuals with EZH2 mutations."
    explanation: Records the cohort size as reported in 2013 without converting it into a prevalence estimate or a time-stable worldwide case count.

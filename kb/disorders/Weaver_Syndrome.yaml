    explanation: Defines the H3K27 and chromatin-state phenotype in the isogenic variant panel.
  downstream:
  - target: Impaired Polycomb Repression and Gene Derepression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

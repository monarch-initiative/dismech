inheritance:
- name: Autosomal Dominant
  description: >-
    EZH2-related overgrowth (Weaver syndrome) is inherited in an autosomal
    dominant manner. Both inherited and de novo pathogenic variants occur, but
    the proportion of de novo cases is unknown. Each child of an affected
    individual has a 50% chance of inheriting the variant, and phenotype in an
    individual who inherits a familial variant cannot be predicted.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EZH2-related overgrowth is inherited in an autosomal dominant manner."
    explanation: GeneReviews establishes autosomal dominant inheritance for EZH2-related overgrowth (Weaver syndrome).
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some individuals diagnosed with EZH2-related overgrowth have an affected parent; some individuals diagnosed with EZH2-related overgrowth have the disorder as the result of a de novo EZH2 pathogenic variant. The proportion of individuals with EZH2-related overgrowth caused by a de novo pathogenic variant is unknown."
    explanation: GeneReviews documents both inherited and de novo cases and explicitly states that the de novo proportion is unknown.
  - reference: PMID:23865096
    reference_title: "EZH2-Related Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with EZH2-related overgrowth has a 50% chance of inheriting the pathogenic variant; the phenotype in individuals who inherit a familial EZH2 pathogenic variant cannot be predicted."
    explanation: Supports the 50% transmission risk and variable expressivity relevant to family counseling.


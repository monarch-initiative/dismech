name: Congenital Factor XII Deficiency
creation_date: "2026-10-05T00:00:00Z"
category: Mendelian
description: >-
  Congenital factor XII deficiency (Hageman trait) is an autosomal recessive
  deficiency of coagulation factor XII, the serine protease that initiates the
  contact activation pathway. Biallelic F12 variants reduce factor XII activity
  and antigen, which markedly prolongs the activated partial thromboplastin
  time while leaving hemostasis intact: the tissue-factor/factor VIIa route to
  thrombin is untouched, so patients do not bleed abnormally and tolerate major
  surgery. The deficiency is therefore almost always found incidentally on
  preoperative or routine coagulation testing rather than through symptoms.

  Its interest is mechanistic rather than clinical. Factor XII-deficient mice
  are protected from arterial thrombosis despite normal hemostasis, platelet
  polyphosphate was identified as the endogenous activator, and heterozygous
  human loss-of-function carriers in two population biobanks are protected from
  venous thromboembolism without excess bleeding. That dissociation between
  thrombosis and hemostasis is what makes factor XII a drug target. The
  historical claim that the deficiency is itself thrombophilic has not survived
  meta-analysis.

  The practical hazard is diagnostic, not hemorrhagic. A prolonged aPTT invites
  unnecessary plasma transfusion or cancelled surgery, and during
  cardiopulmonary bypass the activated clotting time cannot be used to steer
  heparin dosing.

  The opposite lesion is a different disease: F12 gain-of-function variants
  cause hereditary angioedema with normal C1 inhibitor through unrestrained
  contact-system activation, curated in Hereditary_Angioedema.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, seven shared a common 46T/T polymorphism, while the other three had a 46 C/T polymorphism, which may have contributed synergistically to the observed deficiency"
    explanation: The 46C>T polymorphism acts as a contributing modifier of measured factor XII level.
  - reference: PMID:36627437
    reference_title: "Factor XII deficiency: a clinical and molecular genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight patients with mild FXII deficiency were found to be homozygous for a hypomorphic variant of functional polymorphism C46T and have no other deleterious substitutions in the F12 gene."
    explanation: >-
      Homozygosity for the hypomorphic polymorphism alone can account for mild
      deficiency, with no coding variant required.

diagnosis:
- name: Factor XII activity assay after isolated aPTT prolongation
  description: >-
    The diagnosis is made by measuring factor XII activity in a patient with an
    isolated prolonged aPTT and a normal prothrombin time. A plasma mixing
    study comes first and separates a factor deficiency, which corrects, from
    an inhibitor, which does not.
  evidence:
  - reference: PMID:26157783
    reference_title: Prevalent factor XII deficiency in cancer patients with isolated aPTT prolongation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The plasma mixing test is the cornerstone test for the initial differential diagnosis of persistent and isolated aPTT prolongation; corrected cases suggest factor deficiency, while uncorrected cases suggest the presence of an inhibitor, such as lupus anticoagulant."
    explanation: The mixing study is the branch point before factor assays.
  - reference: PMID:26157783
    reference_title: Prevalent factor XII deficiency in cancer patients with isolated aPTT prolongation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that most patients with isolated aPTT prolongation who were scheduled for cancer surgery had factor deficiency (88.8%), primarily factor XII (75.0%)."
    explanation: >-
      Factor XII was the commonest deficiency behind isolated aPTT prolongation
      in this series. The cohort is cancer patients with largely acquired
      deficiency, so it supports the diagnostic algorithm rather than the
      Mendelian disease's frequency.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prothrombin time(PT), APTT and factors VIII, IX, XI and XII were determined using one-stage clotting method."
    explanation: The assay panel used to place the deficiency within the intrinsic pathway.
- name: F12 sequencing
  description: >-
    Sequencing F12 confirms the diagnosis and distinguishes a coding defect
    from homozygosity for the hypomorphic 46C>T polymorphism alone.
  evidence:
  - reference: PMID:36627437
    reference_title: "Factor XII deficiency: a clinical and molecular genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty mutant alleles and six different deleterious substitutions were identified."
    explanation: Sequencing resolves the allele spectrum in a patient cohort.

treatments:
- name: No Hemostatic Prophylaxis
  description: >-
    Factor XII deficiency needs no replacement or prophylaxis, including before
    surgery. The prolonged aPTT invites plasma transfusion that has no proven
    benefit, and homozygous patients have come through major operations without
    hemostatic support. The management decision here is to withhold treatment,
    not to give it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: observation without hemostatic prophylaxis
  notes: >-
    Deliberately unbound. TreatmentTerm is rooted at NCIT:C25218 Clinical
    Intervention or Procedure, and every term there names an action given,
    whereas this record's content is an action withheld. Against ols:ncit,
    `l~watchful` and `l^Watchful` return only questionnaire items;
    `l~observation` returns NCIT:C25598 Observation Activity and NCIT:C16084
    Observational Study, which are study rather than intervention concepts; and
    `l~no treatment`, `l~expectant` and `l~deferred` return nothing relevant. A
    search for "Watchful Waiting" surfaces NCIT:C15722 Patient Observation,
    which exists but which `just validate-terms` rejects as outside the
    TreatmentActionTerm enum. NCIT:C15747 Supportive Care was rejected because
    it asserts care delivered.
  target_mechanisms:
  - target: Preserved Tissue-Factor-Initiated Hemostasis
  evidence:
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients do not experience a higher risk of surgical bleeding despite a markedly prolonged activated partial thromboplastin time."
    explanation: >-
      The rationale for withholding prophylaxis: surgical bleeding risk is not
      raised despite the alarming laboratory value.
  - reference: PMID:15497021
    reference_title: "Thrombosis-free surgical procedures in severe (Homozygote) factor XII deficiency: report of four additional cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a few patients, the plasma was given prophylactically because of the long partial thromboplastin time."
    explanation: >-
      Documents the practice this recommendation argues against; plasma was
      given for the laboratory value rather than for a clinical need.
- name: Heparin Concentration Monitoring During Cardiopulmonary Bypass
  description: >-
    During cardiopulmonary bypass the activated clotting time is contact
    activated and so is already prolonged at baseline, which makes it useless
    for steering heparin dosing or reversal. Measuring heparin concentration
    instead, with heparin dose-response and protamine titration, allows bypass
    to proceed safely.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: heparin anticoagulation guided by heparin concentration monitoring
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  target_mechanisms:
  - target: Prolonged Partial Thromboplastin Time
  evidence:
  - reference: PMID:26357792
    reference_title: Factor XII Deficiency and Cardiopulmonary Bypass.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deficiency is important in the patient undergoing cardiopulmonary bypass because activated clotting times are not helpful in determining proper levels of heparin anticoagulation and its reversal."
    explanation: States why the standard monitoring test fails in this disease.
  - reference: PMID:26357792
    reference_title: Factor XII Deficiency and Cardiopulmonary Bypass.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heparin anticoagulation in patients with factor XII deficiency can be safely carried out with heparin concentration monitoring."
    explanation: The alternative monitoring strategy, in a single reported case.

clinical_burden:
  burden_level: LOW
  rationale: >-
    The deficiency itself imposes almost no burden: it is usually asymptomatic,
    needs no treatment, and does not restrict surgery. What burden exists is
    iatrogenic and diagnostic. An unexplained prolonged aPTT, or a prolonged
    activated clotting time discovered at operation, prompts plasma transfusion
    or abandonment of the procedure, and in cardiopulmonary bypass it removes
    the usual means of steering heparin. Recognising the deficiency is
    therefore what averts the burden.
  evidence:
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our consulting hematologist advised either to give three units of fresh frozen plasma to enable heparin effect monitoring by ACT or to abandon surgery."
    explanation: >-
      The two harms, both offered intraoperatively for a laboratory value that
      carried no bleeding risk.
  - reference: PMID:15497021
    reference_title: "Thrombosis-free surgical procedures in severe (Homozygote) factor XII deficiency: report of four additional cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients slowed any complication."
    explanation: >-
      Supports the low burden level: homozygous patients came through major
      surgery without complications.

animal_models:
- name: Factor XII knockout mouse
  species: Mouse
  genotype: F12-/-
  publication: PMID:16009717
  modeled_mechanisms:
  - target: Preserved Tissue-Factor-Initiated Hemostasis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the defining human feature: no spontaneous or
      injury-related bleeding despite absent factor XII.
    limitations: >-
      Murine hemostatic challenges are not human surgery, so the agreement is
      qualitative.
    evidence:
    - reference: PMID:16009717
      reference_title: Defective thrombus formation in mice lacking coagulation factor XII.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although FXII-deficient mice do not experience spontaneous or excessive injury-related bleeding, they are protected against collagen- and epinephrine-induced thromboembolism."
      explanation: Normal hemostasis in the knockout, as in patients.
  - target: Impaired Polyphosphate-Driven Thrombus Propagation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: >-
      Arterial thrombus formation and stabilisation fail across three vascular
      beds, and human factor XII restores it.
    limitations: >-
      Whether human factor XII deficiency confers the same thromboprotection is
      unresolved: the human evidence is from heterozygous carriers, and complete
      human deficiency has not been tested for thrombosis protection.
    evidence:
    - reference: PMID:16009717
      reference_title: Defective thrombus formation in mice lacking coagulation factor XII.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These unexpected findings change the long-standing concept that the FXII-induced intrinsic coagulation pathway is not important for clotting in vivo."
      explanation: The result that established factor XII's role in thrombus formation in vivo.
- name: Naturally occurring feline factor XII deficiency
  species: Cat
  genotype: F12 variants including a high-frequency exon 13 missense allele
  publication: PMID:31022435
  modeled_mechanisms:
  - target: Preserved Tissue-Factor-Initiated Hemostasis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Factor XII deficiency occurs naturally and commonly in domestic cats, and
      none of 26 deficient cats had abnormal bleeding. Residual activity tracked
      mutation number and type, as in human patients.
    limitations: >-
      An observational veterinary series rather than a controlled challenge, and
      the cats were ascertained through laboratory submissions.
    evidence:
    - reference: PMID:31022435
      reference_title: Factor XII deficiency is common in domestic cats and associated with two high frequency F12 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "None of the cats had experienced abnormal bleeding and their residual FXII:C was related to F12 mutation number and mutation-type."
      explanation: >-
        A naturally occurring, non-engineered deficiency with the same absence
        of bleeding and the same genotype-activity relationship.

discussions:
- discussion_id: f12_deficiency_bleeding_contested
  prompt: >-
    Does congenital factor XII deficiency cause any bleeding? One cohort reports
    mild hemorrhagic manifestations as common, while surgical series and the
    largest genotyped cohort report none. Are the reported bleeders explained by
    coexisting hemostatic defects, by ascertainment, or by the deficiency itself?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Abnormal Bleeding
  rationale: >-
    The answer decides whether a prolonged aPTT in a factor XII-deficient
    patient can be dismissed before surgery, which is the only clinical decision
    this disease forces. Most reports do not systematically exclude von
    Willebrand disease or platelet function defects in the patients who bleed.
  evidence:
  - reference: PMID:36627437
    reference_title: "Factor XII deficiency: a clinical and molecular genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contrary to data in the literature, our study showed that mild haemorrhagic manifestations are common among patients with FXII deficiency."
    explanation: The report that opens the question against the established position.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that factor XII deficiency is recognized not to be associated with an increased risk of bleeding, we considered excluding all other potential causes of bleeding, such as other hemostatic defects like von Willebrand factor (VWF) deficiency or platelet function abnormalities."
    explanation: >-
      Names the confounder that would have to be excluded to settle the
      question.
- discussion_id: f12_deficiency_thrombosis_claim
  prompt: >-
    Is factor XII deficiency a thrombophilia, as case reports have long
    suggested? Pooled analysis finds no significant association, and biobank
    data suggest heterozygous loss is protective rather than harmful. What
    explains the persistent case-report signal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Polyphosphate-Driven Thrombus Propagation
  rationale: >-
    The two directions are not merely unreconciled but opposite, and the
    question bears directly on whether factor XII is a safe antithrombotic
    target. Publication bias in case reports of thrombosis in deficient
    patients is the obvious candidate explanation and has not been quantified.
    The signal is not confined to isolated reports: the East China cohort cited
    throughout this entry contains a proband with inferior vena cava and right
    common iliac thrombus.
  evidence:
  - reference: PMID:42035525
    reference_title: "Factor XII Deficiency and Thrombosis Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FXII deficiency was not significantly associated with thromboembolic risk."
    explanation: >-
      The pooled conclusion across six studies and 5,003 individuals. Note the
      unadjusted primary estimate was borderline rather than flatly null.
  - reference: PMID:42035525
    reference_title: "Factor XII Deficiency and Thrombosis Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third analysis pooling adjusted ORs from two studies showed no association (OR 1.03; 95% CI: 0.65"
    explanation: >-
      The adjusted estimate is null, while the unadjusted pooled risk ratio of
      1.34 (95% CI 0.99-1.81) sits at the edge of significance. Recording both
      is why the entry treats the question as open rather than closed.
  - reference: PMID:7947293
    reference_title: "John Hageman's factor and deep-vein thrombosis: Leiden thrombophilia Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we do not consider factor XII to be a determinant of deep-vein thrombosis."
    explanation: A population-based case-control study finding no association.
  - reference: PMID:40890099
    reference_title: Coagulation factor XII haploinsufficiency is protective against venous thromboembolism in a population-scale multidimensional analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that heterozygous loss of F12 represents a haploinsufficient state characterized by protection against venous thromboembolism and that therapeutically inhibiting factor XII is likely to be safe and effective."
    explanation: Biobank evidence pointing the opposite way from the thrombophilia claim.

- discussion_id: f12_deficiency_pregnancy_loss_claim
  prompt: >-
    Is reduced factor XII activity a cause of recurrent pregnancy loss? Three
    case-control series found reduced activity in women with recurrent
    miscarriage and none in controls, but the largest study found no
    association with low activity and showed that lupus anticoagulant itself
    lowers measured factor XII. Is the association real, or an artefact of
    antiphospholipid antibodies interfering with the assay?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Plasma Factor XII Deficiency
  rationale: >-
    This is the second claimed clinical consequence of the deficiency, and it
    has the same shape as the thrombosis claim: positive small series against a
    larger negative one. It matters more than the thrombosis question for
    counselling, because women with recurrent miscarriage are routinely
    screened for thrombophilia and a factor XII result can redirect care. The
    assay-interference mechanism would explain the positive studies without any
    causal role for factor XII.
  evidence:
  - reference: PMID:25489738
    reference_title: Genotyping analysis for the 46 C/T polymorphism of coagulation factor XII and the involvement of factor XII activity in patients with recurrent pregnancy loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: Low FXII activity was not associated with RPL."
    explanation: >-
      The largest study, 279 patients against 100 fertile controls, finds no
      association with activity.
  - reference: PMID:25489738
    reference_title: Genotyping analysis for the 46 C/T polymorphism of coagulation factor XII and the involvement of factor XII activity in patients with recurrent pregnancy loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LA was associated with reduced FXII activity."
    explanation: >-
      The candidate confounder: lupus anticoagulant lowers measured factor XII,
      so an antiphospholipid cohort can look factor XII-deficient.
  - reference: PMID:12969703
    reference_title: Factor XII deficiency is strongly associated with primary recurrent abortions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 67 women with primary recurrent abortion (14.9%) and 4 of 33 women (12.1%) with secondary recurrent abortion had reduced factor XII activity (<60%)."
    explanation: One of the positive series the larger study contradicts.
  - reference: PMID:24597288
    reference_title: Role of coagulation factor XII in unexplained recurrent abortions in the Greek population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifteen of 100 women with RSA had reduced FXII activity, whereas all controls had normal FXII activity."
    explanation: An independent positive series, in a different population.

notes: >-
  No GeneReviews chapter exists for congenital factor XII deficiency. Venous
  thrombosis is deliberately not recorded as a phenotype: a systematic review
  and meta-analysis of six studies found no significant association, a
  population-based case-control study found none, and biobank carriers are
  protected rather than at risk. The historical thrombophilia claim is recorded
  as a discussion instead, together with the pooled unadjusted estimate that
  sits at the edge of significance. Recurrent pregnancy loss is excluded from
  the phenotypes on the same basis and recorded as its own discussion: the
  positive series are small and the largest study found no association with
  factor XII activity, having also shown that lupus anticoagulant depresses the
  measured level. Factor XII deficiency also arises acquired, after
  orthotopic liver transplantation and in critically ill or cancer patients with
  isolated aPTT prolongation; those are not this Mendelian entry.

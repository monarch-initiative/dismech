inheritance:
- name: Autosomal recessive
  description: >-
    Severe deficiency usually requires biallelic F12 variants, but the mode is
    not strictly recessive: a minority of probands with severe measured
    deficiency are heterozygous on sequencing, and the largest cohort allows
    dominant inheritance. Heterozygotes have partially reduced factor XII with
    a normal or only slightly prolonged aPTT, and are relatively common in the
    general population at about 2.3%, while complete absence is rare.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor XII (FXII) deficiency is a congenital disorder inherited as an autosomal recessive condition."
    explanation: States the mode of inheritance.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relatives with a heterozygous mutation exhibited normal or only slight prolongation of the APTT ratio, along with decreased levels of FXII: C and FXII: Ag."
    explanation: Heterozygotes are biochemically intermediate and largely spared the laboratory abnormality.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is primarily inherited in a recessive pattern, although dominant inheritance is also possible."
    explanation: >-
      The cohort's own statement that the mode is predominantly but not purely
      recessive.
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In his heterozygous form (25--50% of normal FXII plasma levels), it is relatively common in the general population (2.3%)."
    explanation: Heterozygote frequency and the corresponding factor XII level.

prevalence:
- population: Worldwide, complete (homozygous) deficiency
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported as an incidence of approximately 1 in 1,000,000 for total absence
    of factor XII. The source does not state which occurrence measure this is,
    so measure_type is UNKNOWN and no normalized rate is recorded.
  evidence:
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a total absence of FXII as seen in homozygous patients, is rare, with an incidence of approximately 1/1,000,000 individuals."
    explanation: The figure for complete deficiency.
- population: Young adult Mexican healthy controls
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 9200.0
  notes: >-
    Partial deficiency defined by reduced factor XII activity is far more
    common than complete deficiency, and at similar frequency in patients and
    controls: 9.2% of 250 controls against 8.8% of 250 patients with venous
    thromboembolism. The rate recorded here is the control arm. These
    activity-threshold figures count heterozygotes, so they are the prevalence
    of the laboratory abnormality rather than of the biallelic disease.
  evidence:
  - reference: PMID:38065013
    reference_title: "Factor XII Deficiency in Mexico: High Prevalence in the General Population and Patients with Venous Thromboembolic Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "percentage of patients and controls with FXII deficiency was 8.8 and 9.2%, respectively"
    explanation: Activity-defined deficiency is common and equally frequent in cases and controls.
- population: Asymptomatic Saudi preoperative patients
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1790.0
  notes: >-
    2 of 115 preoperative patients had factor XII below 60%. A small
    single-centre series, reported as the basis for a local reference range.
  evidence:
  - reference: PMID:33732086
    reference_title: "Factor XII deficiency in asymptomatic Saudi population: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two (1.79%) patients, both of whom were women, had FXII levels <60%."
    explanation: Frequency of reduced factor XII in an unselected preoperative series.

pathophysiology:
- name: F12 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic F12 variants abolish or reduce production of functional factor
    XII. The spectrum is population-dependent: missense alleles dominate in a
    Han Chinese cohort, where the abstract reports clustering in the catalytic
    and kringle domains although its own body describes the variants as spread
    across the gene, while a Russian cohort is 92.5% promoter and splice
    variants with no missense predominance. Most variant carriers have a
    quantitative (type I) defect in which antigen falls with activity; a
    qualitative (type II) defect with preserved antigen is less common. The
    common promoter polymorphism 46C>T lowers factor XII levels and contributes
    additively in many probands.
  genes:
  - preferred_term: F12
    term:
      id: hgnc:3530
      label: F12
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed that 94.1% of probands carried genetic defects, with 29 mutations pinpointed in the F12 gene."
    explanation: Most probands in a 51-proband cohort carry an identifiable F12 defect.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations were predominantly concentrated in two crucial regions: the catalytic domain and the kringle domain."
    explanation: Where the reported variants fall in the protein.
  - reference: PMID:40890099
    reference_title: Coagulation factor XII haploinsufficiency is protective against venous thromboembolism in a population-scale multidimensional analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also show that F12 variant carriers generally experience a quantitative (type I) defect in circulating factor XII levels, though a subset of participants was also identified with possible qualitative (type II) deficiency."
    explanation: Distinguishes the quantitative and qualitative defect classes across 703,745 biobank participants.
  downstream:
  - target: Plasma Factor XII Deficiency
    causal_link_type: DIRECT
    description: Loss of functional F12 product lowers circulating factor XII activity and antigen.
    evidence:
    - reference: PMID:39385199
      reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory tests for all probands revealed significantly prolonged APTT ratios and markedly decreased levels of Factor XII Coagulant Activity (FXII: C) and FXII: Ag."
      explanation: Links the genetic defect to the measured plasma deficiency.
    - reference: PMID:39385199
      reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the in vitro expression study, p.Ser267Valfs*22, p.Asp538Asn, and p.Gly542Ser exhibited significantly decreased FXII: C and FXII: Ag levels in the supernatant, confirming secretion defects in the mutant protein."
      explanation: >-
        Expression of patient alleles shows the step between gene and plasma:
        the mutant protein is not secreted.
    - reference: PMID:39385199
      reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "indicating defects in both synthesis and secretion of the mutant protein"
      explanation: >-
        A second allele class fails at synthesis as well as secretion, so the
        route from variant to low plasma level is not uniform.

- name: Plasma Factor XII Deficiency
  biological_scale: MOLECULAR
  description: >-
    Circulating factor XII activity and antigen are reduced or absent. This is
    the measured biochemical state that defines the disease, and the only
    abnormality in most patients.
  genes:
  - preferred_term: F12
    term:
      id: hgnc:3530
      label: F12
  evidence:
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, all probands with heterozygous, compound heterozygous, or homozygous mutations exhibited severe FXII deficiencies, leading to significantly reduced FXII: C and FXII: Ag levels."
    explanation: The plasma phenotype across the cohort's genotypes.
  downstream:
  - target: Reduced Factor XII Activity
    causal_link_type: DIRECT
    description: >-
      The laboratory phenotype is the direct measurement of this plasma state,
      by coagulant activity and by antigen.
    evidence:
    - reference: PMID:39385199
      reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory tests for all probands revealed significantly prolonged APTT ratios and markedly decreased levels of Factor XII Coagulant Activity (FXII: C) and FXII: Ag."
      explanation: The assays that render the plasma state as the measured phenotype.
  - target: Contact Activation Failure
    causal_link_type: DIRECT
    description: >-
      Factor XII is the protease that starts the contact pathway, so its
      absence prevents surface-triggered initiation of intrinsic coagulation.
    evidence:
    - reference: PMID:31022435
      reference_title: Factor XII deficiency is common in domestic cats and associated with two high frequency F12 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Factor XII (FXII) is a coagulation protein that initiates surface-activation of the coagulation cascade in vitro."
      explanation: >-
        States factor XII's initiating role in the contact pathway. The quoted
        sentence describes surface activation in vitro, and sits in the
        introduction of a veterinary study rather than being its own result.
  - target: Reduced Plasma Kallikrein-Kinin Activation
    causal_link_type: DIRECT
    description: >-
      The same protease feeds the bradykinin-generating arm of the contact
      system, so deficiency lowers kallikrein-kinin output as well.
    evidence:
    - reference: PMID:29483100
      reference_title: Coagulation factor XII in thrombosis and inflammation.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The factor XII-driven contact system starts coagulation and inflammatory mechanisms via the intrinsic pathway of coagulation and the bradykinin-producing kallikrein-kinin system, respectively."
      explanation: >-
        A review states the two arms factor XII feeds; the kallikrein-kinin arm
        is the one this edge represents.

- name: Contact Activation Failure
  biological_scale: MOLECULAR
  description: >-
    The intrinsic (contact) pathway cannot be initiated on a negatively charged
    surface, so no fibrin forms in the aPTT reaction. This is the whole basis
    of the laboratory abnormality, and because the pathway is dispensable for
    hemostasis in vivo it is also the reason the abnormality is harmless.
  biological_processes:
  - preferred_term: "blood coagulation, intrinsic pathway"
    modifier: DECREASED
    term:
      id: GO:0007597
      label: "blood coagulation, intrinsic pathway"
  evidence:
  - reference: PMID:42035525
    reference_title: "Factor XII Deficiency and Thrombosis Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Factor XII (FXII) initiates the intrinsic coagulation pathway. Despite its role in contact activation assays, FXII deficiency is not associated with bleeding."
    explanation: >-
      States both halves of this node: the pathway factor XII initiates, and
      that losing it does not cause bleeding.
  downstream:
  - target: Prolonged Partial Thromboplastin Time
    causal_link_type: DIRECT
    description: >-
      The aPTT reagent works by contact activation, so an assay that depends on
      factor XII is prolonged in its absence.
    evidence:
    - reference: PMID:35417978
      reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The finding of a hypocoagulable INTEM tracing and a concurrent normal EXTEM tracing in a sample of a patient with prolonged ACT and adverse anamnestic bleeding history should prompt clinicians to consider a FXII deficiency."
      explanation: >-
        The contact-activated assay (INTEM) is abnormal while the
        tissue-factor-activated assay (EXTEM) is normal, which is the
        assay-level signature of this node.
  - target: Impaired Polyphosphate-Driven Thrombus Propagation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Platelet-released polyphosphate is the physiological factor XII
      activator, so without factor XII that route to fibrin within a growing
      thrombus is lost. Demonstrated in factor XII-deficient mice.
    evidence:
    - reference: PMID:21385010
      reference_title: "Platelet polyphosphates: the nexus of primary and secondary hemostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "We found that platelets release polyphosphates, linear inorganic polymers of 60-100 phosphate residues that directly bound to and activated factor XII."
      explanation: >-
        Identifies the endogenous activator whose downstream effect this edge
        represents. The quoted result is the biochemical binding and activation,
        not the in vivo thrombosis result in the same review.

- name: Impaired Polyphosphate-Driven Thrombus Propagation
  biological_scale: TISSUE
  description: >-
    In factor XII-deficient mice, platelet-rich occlusive thrombi fail to form
    and stabilise across three arterial beds, and the defect is corrected by
    infusing human factor XII. The same animals bleed normally. Whether human
    factor XII deficiency confers equivalent protection is not established:
    heterozygous human carriers are protected from venous thromboembolism in
    biobank data, but complete human deficiency has never been tested that way.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: "blood coagulation, fibrin clot formation"
    modifier: DECREASED
    term:
      id: GO:0072378
      label: "blood coagulation, fibrin clot formation"
  evidence:
  - reference: PMID:16009717
    reference_title: Defective thrombus formation in mice lacking coagulation factor XII.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intravital fluorescence microscopy and blood flow measurements in three distinct arterial beds revealed a severe defect in the formation and stabilization of platelet-rich occlusive thrombi."
    explanation: The thrombus defect in the knockout.
  - reference: PMID:16009717
    reference_title: Defective thrombus formation in mice lacking coagulation factor XII.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Infusion of human FXII into FXII-null mice restored injury-induced thrombus formation."
    explanation: >-
      Rescue by the human protein shows the defect is attributable to factor
      XII itself rather than a background effect.
  - reference: PMID:40890099
    reference_title: Coagulation factor XII haploinsufficiency is protective against venous thromboembolism in a population-scale multidimensional analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We find that heterozygous carriers of nonsense, frameshift, and essential splice site variants in F12 are protected against venous thromboembolism without an increased risk of bleeding or infection."
    explanation: >-
      The human counterpart of the mouse protection, in heterozygous carriers
      rather than complete deficiency.

- name: Preserved Tissue-Factor-Initiated Hemostasis
  biological_scale: ORGANISM
  description: >-
    Thrombin generation after injury proceeds through tissue factor and factor
    VIIa, which factor XII deficiency does not touch. Patients tolerate major
    surgery without hemostatic support, and factor XII-deficient mice do not
    bleed spontaneously or excessively after injury. This node is why an
    alarming aPTT has no hemorrhagic consequence. It carries no inbound causal
    edge on purpose: the contact-pathway lesion does not reach this route, and
    that independence is the point.
  biological_processes:
  - preferred_term: tissue-factor/factor VIIa-initiated coagulation (unaffected)
    term:
      id: GO:0007598
      label: "blood coagulation, extrinsic pathway"
  evidence:
  - reference: PMID:29483100
    reference_title: Coagulation factor XII in thrombosis and inflammation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This suggests that the polyphosphate/factor XII axis contributes to thrombus formation while being dispensable for hemostatic processes."
    explanation: >-
      States the dissociation this node records: factor XII feeds thrombosis
      while hemostasis does not depend on it.
  - reference: PMID:15497021
    reference_title: "Thrombosis-free surgical procedures in severe (Homozygote) factor XII deficiency: report of four additional cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data supply further evidence that factor XII deficiency does not only show any bleeding tendency but also can withstand even major surgical procedures without thrombotic complications."
    explanation: Surgical outcomes in homozygous patients establish preserved hemostasis.
  - reference: PMID:16009717
    reference_title: Defective thrombus formation in mice lacking coagulation factor XII.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Although FXII-deficient mice do not experience spontaneous or excessive injury-related bleeding, they are protected against collagen- and epinephrine-induced thromboembolism."
    explanation: >-
      The same dissociation in the knockout; indirect for humans because it is
      a mouse result.

- name: Reduced Plasma Kallikrein-Kinin Activation
  biological_scale: MOLECULAR
  description: >-
    Factor XIIa also converts prekallikrein to kallikrein, which cleaves
    high-molecular-weight kininogen to release bradykinin. Deficiency lowers
    the output of this arm. No deficiency phenotype has been attributed to it;
    its importance is established from the opposite direction, because
    excessive factor XII activity causes hereditary angioedema.
  biological_processes:
  - preferred_term: plasma kallikrein-kinin cascade
    modifier: DECREASED
    term:
      id: GO:0002353
      label: plasma kallikrein-kinin cascade
  evidence:
  - reference: PMID:29483100
    reference_title: Coagulation factor XII in thrombosis and inflammation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast to deficiency in factor XII providing safe thromboprotection, excessive FXII activity is associated with the life-threatening inflammatory disorder hereditary angioedema."
    explanation: >-
      Establishes the arm's clinical weight through the gain-of-function
      disease, and states that the deficiency direction is safe.

phenotypes:
- name: Reduced Factor XII Activity
  category: Hematologic
  frequency: VERY_FREQUENT
  description: >-
    Reduced or absent factor XII coagulant activity, with antigen reduced in
    parallel in the usual quantitative defect. This is the defining laboratory
    finding.
  phenotype_term:
    preferred_term: Reduced factor XII activity
    term:
      id: HP:0004841
      label: Reduced factor XII activity
  evidence:
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests for all probands revealed significantly prolonged APTT ratios and markedly decreased levels of Factor XII Coagulant Activity (FXII: C) and FXII: Ag."
    explanation: Present in all 51 probands.
- name: Prolonged Partial Thromboplastin Time
  category: Hematologic
  frequency: VERY_FREQUENT
  description: >-
    Isolated, markedly prolonged aPTT with a normal prothrombin time. It
    corrects on a plasma mixing study, which distinguishes a factor deficiency
    from an inhibitor such as a lupus anticoagulant. The degree of prolongation
    does not track factor XII level reliably in unselected patients.
  phenotype_term:
    preferred_term: Prolonged partial thromboplastin time
    term:
      id: HP:0003645
      label: Prolonged partial thromboplastin time
  evidence:
  - reference: PMID:35417978
    reference_title: An unanticipated prolonged baseline ACT during cardiac surgery due to factor XII deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients do not experience a higher risk of surgical bleeding despite a markedly prolonged activated partial thromboplastin time."
    explanation: The prolongation, and that it carries no bleeding risk.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The deficiency is usually detected through routine coagulation testing before surgery or during a health check, as it leads to a notable prolongation of the activated partial thromboplastin time (APTT)."
    explanation: The aPTT finding is how the disease is almost always ascertained.
  - reference: PMID:37395184
    reference_title: "Incidence of factor XII deficiency in critically ill patients with a prolonged activated partial thromboplastin time: a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor XII levels were not significantly correlated with the measured aPTT"
    explanation: >-
      In critically ill patients with a prolonged aPTT, the degree of
      prolongation does not track the factor XII level, so aPTT cannot be used
      to grade the deficiency.
- name: Abnormal Bleeding
  category: Hematologic
  description: >-
    Contested, and the one claim in this entry where cohorts disagree. The
    long-standing position is that factor XII deficiency causes no bleeding,
    supported by homozygous patients coming through major surgery without
    hemostatic support. A Russian cohort of 33 patients instead reported that
    mild hemorrhagic manifestations are common, and the East China cohort
    describes individual patients with heavy menstrual bleeding or difficulty
    stopping bleeding after trauma while concluding the deficiency is not
    linked to bleeding risk.

    The cohorts are not comparable, and that asymmetry is most of the apparent
    conflict. The study reporting common bleeding enrolled patients with factor
    XII below 60%, a partial-deficiency group in which eight were homozygous
    for the hypomorphic 46C>T polymorphism with no coding variant at all. The
    studies reporting none examined homozygous or severely deficient patients.
    Coexisting hemostatic defects are not systematically excluded in most
    reports.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:36627437
    reference_title: "Factor XII deficiency: a clinical and molecular genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contrary to data in the literature, our study showed that mild haemorrhagic manifestations are common among patients with FXII deficiency."
    explanation: The one cohort reporting bleeding as a common feature.
  - reference: PMID:36627437
    reference_title: "Factor XII deficiency: a clinical and molecular genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We obtained and analysed genetic and clinical data from 33 apparently unrelated patients with FXII plasma levels below 60% and genetic data from 26 healthy controls with no history of FXII deficiency."
    explanation: >-
      The enrolment threshold that makes this a partial-deficiency cohort,
      which is why its result does not contradict the severe-deficiency series.
  - reference: PMID:39385199
    reference_title: Clinical and genetic spectrum of factor XII deficiency in the Han population of East China.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The few suspected bleeding manifestations described in this group of FXII deficient individuals"
    explanation: >-
      The largest genotyped cohort reads its own handful of bleeding events as
      incidental rather than attributable to the deficiency.
  - reference: PMID:15497021
    reference_title: "Thrombosis-free surgical procedures in severe (Homozygote) factor XII deficiency: report of four additional cases and literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients slowed any complication."
    explanation: >-
      Homozygous patients undergoing major surgery had no hemorrhagic
      complications.


name: Immunodeficiency 80 with or without Congenital Cardiomyopathy
creation_date: "2026-08-17T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 80 with or without congenital cardiomyopathy
  term:
    id: MONDO:0030266
    label: immunodeficiency 80 with or without congenital cardiomyopathy
description: >
  Immunodeficiency 80 with or without congenital cardiomyopathy (IMD80; MCM10
  deficiency; OMIM 619313) is an ultra-rare autosomal recessive inborn error of
  immunity caused by biallelic (compound heterozygous) variants in MCM10, which
  encodes an essential activator and processivity factor of the eukaryotic CMG
  (CDC45-MCM2-7-GINS) DNA replicative helicase. Only two unrelated kindreds have
  been reported. One patient, carrying a hypomorphic missense allele together
  with a nonsense allele, presented in infancy with a profound natural killer
  (NK) cell deficiency (absence of terminally mature NK cells) and died in
  infancy of overwhelming cytomegalovirus (CMV) infection. A second, unrelated
  family carrying a frameshift allele together with a splice-donor allele had
  three affected fetuses/siblings with restrictive cardiomyopathy accompanied
  by hypoplasia of the spleen and thymus (lymphoreticular hypoplasia).
  Functional studies show that MCM10 deficiency causes chronic replication
  stress, accumulation of abnormal single-stranded-DNA-rich replication fork
  intermediates, genomic instability, and accelerated telomere erosion; the
  authors propose that these biallelic hypomorphic/loss-of-function variants
  push specific, rapidly proliferating lineages (NK cell precursors during
  terminal maturation, and cardiac/lymphoreticular progenitors during
  differentiation) to prematurely arrest, producing the divergent but
  overlapping NKD and restrictive-cardiomyopathy phenotypes from a single
  gene. MCM10 joins MCM4, GINS1, and GINS4 as CMG-helicase components in which
  biallelic hypomorphic variants cause human NK cell deficiency.

synonyms:
  - IMD80
  - MCM10 deficiency
  - NK cell deficiency with or without restrictive cardiomyopathy

parents:
  - Inborn error of immunity
  - Natural killer cell deficiency


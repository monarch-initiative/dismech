experimental_models:
- name: Patient-derived iPSC-NK cell differentiation (MCM10 R426C/R582X)
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Patient-derived induced pluripotent stem cells (iPSCs)
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32865517
  description: >
    iPSCs generated from the NKD proband (compound heterozygous MCM10
    p.R426C/p.R582X) and differentiated along the NK-cell lineage, alongside
    CRISPR-modeled patient variants in fibroblast and NK cell lines.
  modeled_mechanisms:
  - target: Impaired Terminal Maturation of NK Cell Precursors
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Patient-derived iPSC-NK differentiation and MCM10 knockdown in NK cell
      lines reproduce the terminal NK maturation defect seen in the patient.
    readouts:
    - name: NK cell terminal maturation and functional acquisition
      target: Impaired Terminal Maturation of NK Cell Precursors
      direction: DECREASED
      interpretation: >
        Patient-iPSC-derived and MCM10-knockdown NK cells fail to complete
        terminal maturation and acquire immunological function.
      evidence:
      - reference: PMID:32865517
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we further demonstrated that MCM10 is required for NK cell terminal maturation and acquisition of immunological system function"
        explanation: >
          Directly reports the patient-iPSC-derived NK differentiation
          readout supporting this mechanism node.
    evidence:
    - reference: PMID:32865517
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "By modeling MCM10 deficiency in primary NK cell precursors, including patient-derived induced pluripotent stem cells, we further demonstrated that MCM10 is required for NK cell terminal maturation and acquisition of immunological system function."
      explanation: >
        Establishes patient-derived iPSC-NK differentiation as informative
        for the NK terminal maturation mechanism node.

- name: MCM10 heterozygous (MCM10+/-) iPSC-NK differentiation
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: iPSC (CRISPR-engineered MCM10 heterozygous knockout)
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38262603
  description: >
    CRISPR-engineered MCM10 heterozygous (MCM10+/-) iPSC lines differentiated
    through hematopoietic stem cell and NK-lineage stages, used to test a
    gene-dosage threshold model of MCM10-dependent genome stability.
  modeled_mechanisms:
  - target: Impaired Terminal Maturation of NK Cell Precursors
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      MCM10 haploinsufficiency in iPSCs is sufficient to impair NK-lineage
      differentiation and block generation of mature NK cells, independently
      confirming the terminal-maturation defect with a distinct
      (heterozygous knockout, rather than patient compound-heterozygous)
      genotype.
    limitations: >-
      Models MCM10 haploinsufficiency rather than the patient's specific
      compound heterozygous missense/nonsense genotype, so it demonstrates a
      gene-dosage threshold effect rather than reproducing the exact allelic
      combination.
    readouts:
    - name: NK-lineage differentiation from hematopoietic progenitors
      target: Impaired Terminal Maturation of NK Cell Precursors
      direction: DECREASED
      interpretation: >
        MCM10+/- hematopoietic progenitors give rise to lymphoid progenitors
        but fail to generate mature NK cells, coincident with telomere
        erosion.
      evidence:
      - reference: PMID:38262603
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Although MCM10+/- HSCs were able to give rise to lymphoid progenitors, these did not generate mature NK cells."
        explanation: >
          Directly reports the block at the mature NK cell stage in this
          model.
    evidence:
    - reference: PMID:38262603
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MCM10+/- iPSCs displayed defects in NK cell differentiation, exhibiting reduced yields of hematopoietic stem cells (HSCs)."
      explanation: >
        Establishes the MCM10+/- iPSC-NK differentiation system as
        informative for the NK terminal maturation mechanism node.

treatments:
- name: Bone Marrow Transplantation
  description: >
    The index NKD patient underwent bone marrow transplantation for
    suspected primary immunodeficiency, but succumbed to overwhelming
    pre-existing CMV infection at 24 months of age; transplantation was
    performed after the CMV infection was already established rather than
    pre-emptively, so this single case does not demonstrate treatment
    efficacy and instead illustrates the importance of early recognition
    before severe viral disease is established.

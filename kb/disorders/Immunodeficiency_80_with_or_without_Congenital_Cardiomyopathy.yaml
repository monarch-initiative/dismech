    term:
      id: HP:0031381
      label: Decreased mitogen-induced T-cell proliferation
  evidence:
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T cell activation in \nresponse to phytohemagglutinin was reduced relative to control"
    explanation: >

    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient underwent bone marrow transplantation for suspect"
    explanation: >
      Documents that bone marrow transplantation was attempted in the index
      patient for suspected primary immunodeficiency.
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "succumbed to overwhelming preexisting CMV at 24 months"
    explanation: >
      The patient died of pre-existing CMV infection despite transplantation,
      indicating that transplantation performed after severe viral disease
      was already established was not able to rescue the patient in this
      single reported case.

genetic:
- name: MCM10
  gene_term:
    preferred_term: MCM10
    term:
      id: hgnc:18043
      label: MCM10
  relationship_type: CAUSATIVE
  notes: >
    MCM10 (minichromosome maintenance 10 replication initiation factor) is an
    essential activator/processivity factor of the eukaryotic CMG
    (CDC45-MCM2-7-GINS) replicative helicase. Both reported kindreds carry
    compound heterozygous variants that together reduce, but do not
    eliminate, MCM10 function (complete biallelic loss of MCM10 is expected
    to be incompatible with cell viability, since MCM10 is essential for DNA
    replication). The NKD proband carries a hypomorphic missense variant
    (c.1276C>T, p.R426C) together with a nonsense variant (c.1744C>T,
    p.R582X); the RCM family carries a frameshift variant (c.236delG,
    p.G79EfsTer6) together with a splice-donor variant (c.764+5G>A,
    p.D198GfsTer10). Neither variant set has been observed in homozygosity in
    population reference databases, consistent with very rare autosomal
    recessive alleles.
  evidence:
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minichromosome maintenance protein 10 (MCM10) is essential for eukaryotic DNA replication."
    explanation: >
      States the core molecular function of MCM10, the causal gene for this
      disorder.
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "was predicted to be disease causing by MutationTaster (score \n0.99) (34) and likely damaging by PolyPhen2 (score 1.0) (35)"
    explanation: >
      In silico pathogenicity predictions for the NKD-associated p.R426C
      missense variant support a damaging/hypomorphic effect.
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonsense variant was \nnot found in ExAC"
    explanation: >
      Documents that the NKD-associated p.R582X nonsense allele is absent
      from population reference databases, consistent with a very rare
      autosomal recessive pathogenic allele.


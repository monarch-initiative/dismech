- name: NK cell immunophenotyping by flow cytometry
  description: >
    Flow cytometric enumeration of peripheral blood NK cells (CD56+CD3-) and
    subset analysis (CD56bright vs. CD56dim) identified the profound NK cell
    deficit and the shift toward the immature CD56bright subset in the index
    patient.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: >-
    Profoundly reduced frequency of peripheral blood NK cells with
    overrepresentation of the immature CD56bright subset.
  evidence:
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow cytometry of peripheral blood lymphocytes \ndemonstrated profoundly reduced frequency of NK cells"
    explanation: >
      Documents flow cytometric immunophenotyping as the diagnostic modality
      that identified the NK cell deficiency in the index patient.

- name: Molecular confirmation by whole exome sequencing
  description: >
    Trio-based whole exome sequencing of the proband and his parents
    identified the compound heterozygous MCM10 variants segregating with
    disease, confirming the molecular diagnosis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Compound heterozygous MCM10 variants (c.1276C>T, p.R426C and c.1744C>T,
    p.R582X) that were rare, predicted damaging, and segregated with disease.
  evidence:
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified compound heterozygous mutations that were rare and predicted to be damaging"
    explanation: >
      Documents whole exome sequencing as the diagnostic modality that
      identified and confirmed the causal MCM10 variants in the index
      patient.

treatments:
- name: Bone Marrow Transplantation
  description: >
    The index NKD patient underwent bone marrow transplantation for
    suspected primary immunodeficiency, but succumbed to overwhelming
    pre-existing CMV infection at 24 months of age; transplantation was
    performed after the CMV infection was already established rather than
    pre-emptively, so this single case does not demonstrate treatment
    efficacy and instead illustrates the importance of early recognition
    before severe viral disease is established.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY

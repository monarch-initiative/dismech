    evidence:
    - reference: PMID:36809597
      reference_title: "Unwinding the Role of the CMG Helicase in Inborn Errors of Immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inborn errors of immunity (IEI) are a collection of diseases resulting from genetic causes that impact the immune system through multiple mechanisms. Natural killer cell deficiency (NKD) is one such IEI"
      explanation: >
        MCM10-associated NK cell deficiency is classified as an inborn error
        of immunity, placing it in Harrison's immune/rheumatologic Part.
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:33712616
      reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "natural killer (NK) cell deficiency (NKD) and restrictive cardiomyopathy (RCM) with hypoplasia of the spleen and thymus"
      explanation: >
        The RCM-associated genotype produces a primary cardiomyopathy
        phenotype, placing it in Harrison's cardiovascular Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:33712616
      reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we describe compound heterozygous MCM10 variants in patients with distinctive, but overlapping, clinical phenotypes"
      explanation: >
        A biallelic Mendelian disorder caused by compound heterozygous MCM10
        variants, placing it in Harrison's genetics Part.
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      MCM10 is grouped with MCM4, GINS1, and GINS4 (CMG helicase components)
      as causes of human NK cell deficiency, an innate-immunity defect
      (PMID:36809597); the RCM-predominant genotype is not itself an
      immunodeficiency, so this IUIS placement reflects the NKD-associated
      genotype specifically.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Both reported kindreds carry compound heterozygous (biallelic) MCM10
    variants; unaffected parents/relatives are obligate heterozygous carriers.
  evidence:
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe compound heterozygous MCM10 variants in patients with distinctive, but overlapping, clinical phenotypes: natural killer (NK) cell deficiency (NKD) and restrictive cardiomyopathy (RCM) with hypoplasia of the spleen and thymus."
    explanation: >
      Both reported clinical phenotypes arise from compound heterozygous
      (biallelic) MCM10 variants, consistent with autosomal recessive
      inheritance.

notes: >
  Ultra-rare: only two published kindreds (one NKD proband, one three-sibling
  RCM family) as of this curation. The cached reference for PMID:32865517 (the
  NKD proband paper) includes full open-access text (PMC7524476), which
  supplied the detailed clinical vignette, laboratory values, and variant
  pathogenicity scores used throughout this entry. The cached reference for
  PMID:33712616 (the RCM family paper) is shorter and does not include its
  Supplementary Note 1, which is where the RCM family's detailed
  clinical/genetic description (pedigree, exact variant segregation,
  individual fetal/sibling outcomes) is reported; RCM-family claims here are
  therefore limited to what the main-text/abstract-level cached content
  states. HP:0001522 (Death in infancy) is not a valid PhenotypeTerm (it sits
  under the HPO Clinical modifier / Mortality branch, not Phenotypic
  abnormality), so the index patient's fatal outcome is recorded only in this
  description, not as a separate phenotype entry. No GeneReviews chapter
  exists for this disorder (PubMed search for "MCM10[TI] GeneReviews[TI]"
  returned no results, 2026-08-17). `just discover-datasets` for this entry
  returned only GENE_ONLY candidates (generic MCM10 replication-biology GEO
  series in yeast, zebrafish, and unrelated human cell lines) with no
  disease-specific dataset, so no `datasets:` block is populated (see
  CLAUDE.md dataset-curation guidance on GENE_ONLY triage risk). A falcon
  deep-research report (research/Immunodeficiency_80_with_or_without_Congenital_Cardiomyopathy-deep-research-falcon.md)
  was consulted (NEC preflight PASS against MONDO:0030266/MCM10) and its
  detailed clinical/molecular claims were independently re-verified against
  the primary-literature cache before being curated here, rather than
  transcribed from the report directly.

pathophysiology:
- name: Biallelic MCM10 Hypomorphic/Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Compound heterozygous MCM10 variants reduce functional MCM10 protein below
    a critical threshold. NK-cell-deficiency-associated alleles are a
    hypomorphic missense variant (p.R426C) paired with a nonsense variant
    (p.R582X); restrictive-cardiomyopathy-associated alleles are a frameshift
    variant (c.236delG) paired with a splice-donor variant (c.764+5G>A).
    MCM10 is required for activation and processivity of the CMG
    (CDC45-MCM2-7-GINS) replicative helicase.
  biological_processes:
  - preferred_term: DNA replication initiation
    modifier: DECREASED
    term:
      id: GO:0006270
      label: DNA replication initiation
  evidence:
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe compound heterozygous MCM10 variants in patients with distinctive, but overlapping, clinical phenotypes: natural killer (NK) cell deficiency (NKD) and restrictive cardiomyopathy (RCM) with hypoplasia of the spleen and thymus."
    explanation: >
      Establishes that biallelic MCM10 variants underlie both the NKD and RCM
      clinical presentations of this disorder.
  downstream:
  - target: Chronic Replication Stress and Genomic Instability
    description: Reduced MCM10 function impairs CMG helicase-dependent DNA replication.

- name: Chronic Replication Stress and Genomic Instability
  biological_scale: CELLULAR
  description: >
    Reduced MCM10 function impairs CMG helicase activity, causing chronic
    replication stress with accumulation of terminally arrested,
    single-strand-DNA-enriched replication fork structures. These abnormal
    forks require
    endonucleolytic processing by MUS81; in MCM10:MUS81 double-mutant cells,
    viability falls further and telomere shortening accelerates, indicating
    that MUS81-dependent fork processing is a downstream node that itself
    contributes to (rather than merely reads out) the genomic instability.
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  - preferred_term: telomere maintenance
    modifier: DECREASED
    term:
      id: GO:0000723
      label: telomere maintenance
  evidence:
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MCM10 deficiency causes chronic replication stress that reduces cell viability due to increased genomic instability and telomere erosion."
    explanation: >
      Direct experimental demonstration (patient-variant-modeled human cell
      lines) of the proximate cellular consequence of MCM10 deficiency.
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Terminally-arrested replication forks in MCM10-deficient cells require endonucleolytic processing by MUS81, as MCM10:MUS81 double mutants display decreased viability and accelerated telomere shortening."
    explanation: >
      Identifies MUS81-dependent processing of stalled replication forks as a
      mechanistic contributor to the telomere erosion and reduced viability
      caused by MCM10 deficiency.
  downstream:
  - target: Impaired Terminal Maturation of NK Cell Precursors
    description: >
      Proposed lineage-specific consequence of replication stress in the
      NKD-associated genotype.
  - target: Impaired Differentiation of Cardiac and Lymphoreticular Progenitors
    description: >
      Proposed lineage-specific consequence of replication stress in the
      RCM-associated genotype.

- name: Impaired Terminal Maturation of NK Cell Precursors
  biological_scale: CELLULAR
  description: >
    In the NKD-associated genotype, replication-stress-driven genomic
    instability (including telomere erosion) selectively arrests NK cell
    precursors during terminal differentiation, producing a profound
    deficiency of mature, functional NK cells while earlier hematopoietic and
    lymphoid progenitor stages are comparatively preserved.
  cell_types:
  - preferred_term: natural killer cell
    modifier: DECREASED
    term:
      id: CL:0000623
      label: natural killer cell
  - preferred_term: CD56dim natural killer cell
    modifier: DECREASED
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  - preferred_term: CD56bright natural killer cell
    modifier: INCREASED
    term:
      id: CL:0000938
      label: "CD16-negative, CD56-bright natural killer cell, human"
  biological_processes:
  - preferred_term: natural killer cell differentiation
    modifier: DECREASED
    term:
      id: GO:0001779
      label: natural killer cell differentiation
  evidence:
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By modeling MCM10 deficiency in primary NK cell precursors, including patient-derived induced pluripotent stem cells, we further demonstrated that MCM10 is required for NK cell terminal maturation and acquisition of immunological system function."
    explanation: >
      Directly shows MCM10 requirement for the terminal maturation step of NK
      cell development using patient-derived iPSC-NK differentiation.
  - reference: PMID:32865517
    reference_title: "Human NK cell deficiency as a result of biallelic mutations in MCM10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreased frequency of peripheral blood NK cells with overrepresentation of the CD56bright subset"
    explanation: >
      Directly documents the shift toward the immature CD56bright subset with
      loss of terminally mature CD56dim NK cells in the index patient's
      peripheral blood (Figure 1 legend).
  - reference: PMID:38262603
    reference_title: "A critical threshold of MCM10 is required to maintain genome stability during differentiation of induced pluripotent stem cells into natural killer cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MCM10+/- iPSCs displayed defects in NK cell differentiation, exhibiting reduced yields of hematopoietic stem cells (HSCs)."
    explanation: >
      Independent iPSC-differentiation study confirms that reduced MCM10
      dosage impairs the NK-lineage differentiation pathway, with the defect
      most pronounced at the mature NK cell stage.
  downstream:
  - target: Severely Decreased Mature NK Cells
    description: Loss of terminal NK maturation manifests clinically as NK cell deficiency.

- name: Impaired Differentiation of Cardiac and Lymphoreticular Progenitors
  biological_scale: CELLULAR
  description: >
    In the RCM-associated genotype, the same replication-stress mechanism is
    proposed to prematurely arrest cardiac and lymphoreticular (splenic and
    thymic) progenitor lineages during differentiation, rather than NK
    precursors, illustrating lineage-specific sensitivity to a shared
    molecular lesion.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:33712616
    reference_title: "Bi-allelic MCM10 variants associated with immune dysfunction and cardiomyopathy cause telomere shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that these bi-allelic variants in MCM10 predispose specific cardiac and immune cell lineages to prematurely arrest during differentiation, causing the clinical phenotypes observed in both NKD and RCM patients."
    explanation: >
      States the authors' proposed mechanistic link between the shared
      molecular lesion (MCM10 deficiency) and the two divergent,
      lineage-specific clinical phenotypes.
  downstream:
  - target: Restrictive Cardiomyopathy
    description: Cardiac progenitor arrest during differentiation manifests as restrictive cardiomyopathy.
  - target: Hypoplasia of the Thymus
    description: Lymphoreticular progenitor arrest manifests as thymic hypoplasia.
  - target: Hypoplastic Spleen
    description: Lymphoreticular progenitor arrest manifests as splenic hypoplasia.

discussions:
- discussion_id: mcm10_allele_lineage_divergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired Differentiation of Cardiac and Lymphoreticular Progenitors"
  - "pathophysiology#Impaired Terminal Maturation of NK Cell Precursors"
  prompt: >
    Why does one set of biallelic MCM10 variants (missense + nonsense)
    selectively arrest NK cell precursors while a different set (frameshift +
    splice donor) instead arrests cardiac and lymphoreticular progenitors,
    from the same underlying replication-stress mechanism?
  rationale: >
    Only two kindreds, with non-overlapping allele combinations, have been
    reported, so it is not established whether the divergence reflects
    allele-specific residual MCM10 activity, lineage-specific proliferation
    kinetics/replication demand, or another factor. The primary report frames
    this explicitly as an open mechanistic question rather than a settled
    finding.
  proposed_experiments:
  - experiment_id: exp_mcm10_allelic_series_lineage_comparison
    name: Isogenic MCM10 allelic-series comparison across NK and cardiomyocyte differentiation
    description: >
      Generate isogenic human iPSC lines carrying each reported MCM10 variant
      combination (NKD alleles vs. RCM alleles), differentiate each line down
      both NK-cell and cardiomyocyte lineages in parallel, and compare
      replication stress markers, telomere length, and differentiation
      efficiency to test whether allele identity or lineage-intrinsic
      replication demand determines which cell type arrests.


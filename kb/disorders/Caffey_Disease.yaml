name: Caffey Disease
creation_date: "2026-11-06T00:00:00Z"
description: >-
  Caffey disease (infantile cortical hyperostosis) is a largely self-limited
  disorder of early infancy. Episodes of acute inflammation of the periosteum and
  overlying soft tissues, with fever, irritability, pain and firm swelling, are
  accompanied by massive subperiosteal new lamellar bone formation, most often of
  the mandible, clavicles, ribs, scapulae and long-bone diaphyses. Onset is between
  birth and about five months and the lesions usually remodel and regress by two
  years, although hyperostosis can recur later in childhood and a rare prenatal
  form can be severe or lethal. Familial disease is autosomal dominant with
  incomplete penetrance and is caused in most families by the recurrent
  heterozygous COL1A1 missense variant c.3040C>T, p.(Arg1014Cys) (historically
  numbered R836C within the triple helix); a second arginine-to-cysteine
  substitution, p.(Arg918Cys), accounts for a minority of families. The cysteine
  substitution produces disulfide-bonded alpha1(I) chain dimers and subtly
  abnormal collagen fibrils. How that matrix change gives rise to a spatially and
  temporally limited inflammatory hyperostosis is unresolved; a local
  COX-2/prostaglandin E feedback loop is the leading hypothesis, supported by the
  phenocopy produced by prolonged prostaglandin E1 infusion in neonates. Carriers,
  whether or not they had an infantile episode, can show mild connective tissue
  laxity in later life (joint hypermobility, hyperextensible skin, hernias), and
  short stature and fracture susceptibility have been reported in adults.
category: Mendelian
parents:
- Musculoskeletal Disease
- Genetic Disease
disease_term:
  preferred_term: Caffey disease
  term:
    id: MONDO:0007244
    label: Caffey disease
synonyms:

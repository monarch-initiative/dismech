notes: >-
  Phenotype baseline is the GeneReviews chapter Caffey Disease (PMID:22855962),
  whose clinical-characteristics abstract is fully represented here. Not to be
  confused with Kenny-Caffey syndrome (FAM111A/TBCE), or with the infantile
  cortical hyperostosis reported with fetuin-A (AHSG) deficiency, which
  Alopecia-Intellectual_Disability_Syndrome_1 cites and which is not COL1A1
  Caffey disease. No prevalence figure is recorded: the GeneReviews abstract and
  the other cited sources give none.

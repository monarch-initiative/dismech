diagnosis:
- name: Clinical and Radiographic Diagnosis with COL1A1 Testing
  description: >-
    The diagnosis rests on typical clinical and radiographic findings (cortical
    hyperostosis with periosteal new bone, sparing metaphyses and epiphyses) and
    can be confirmed by finding a heterozygous Caffey-associated COL1A1 variant.
    Because a minority of typical cases have no COL1A1 variant, a negative test
    does not exclude the diagnosis.
  evidence:
  - reference: PMID:22855962
    reference_title: "Caffey Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Caffey disease is established in a proband with typical clinical and radiographic findings; identification of a heterozygous COL1A1 pathogenic variant associated with Caffey disease on molecular genetic testing can confirm the diagnosis."
    explanation: GeneReviews diagnostic approach.
  - reference: PMID:34272483
    reference_title: "Caffey disease is associated with distinct arginine to cysteine substitutions in the proα1(I) chain of type I procollagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it confirms allelic heterogeneity in Caffey disease and impacts its molecular confirmation."
    explanation: Testing must cover p.(Arg918Cys) as well as the recurrent allele.
differential_diagnoses:
- name: Prostaglandin E1-Induced Cortical Hyperostosis
  description: >-
    An acquired phenocopy in neonates given prolonged prostaglandin E1 infusion to
    keep the ductus arteriosus open. It produces symmetric diaphyseal periosteal
    new bone, can be painful, and regresses when the infusion is withdrawn.
  distinguishing_features:
  - History of prolonged prostaglandin E1 infusion for duct-dependent congenital heart disease
  - Bilaterally symmetric diaphyseal periosteal new bone rather than asymmetric lesions with mandibular involvement
  - Rapid response to withdrawal of the drug
  evidence:
  - reference: PMID:3769947
    reference_title: "Periosteal hyperostosis resulting from prostaglandin therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result of the long-term use of this drug, bilaterally symmetric marked diaphyseal periosteal new bone can be induced."
    explanation: Describes the drug-induced phenocopy and its symmetric pattern.
  - reference: PMID:26423344
    reference_title: "Cortical hyperostosis as a side-effect of prolonged use of prostaglandins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cortical hyperostosis is a very uncommon side-effect of prolonged prostaglandin therapy with distinctive radiological signs that may be accompanied by painful swelling of the limbs and responds rapidly to withdrawal of therapy."
    explanation: Clinical features and reversibility of the phenocopy.
- name: Osteomyelitis, Scurvy, Hypervitaminosis A and Inflicted Injury
  description: >-
    Infantile periosteal new bone with soft-tissue swelling, fever and raised
    inflammatory markers is often first treated as osteomyelitis, and the
    radiological differential includes vitamin A intoxication, scurvy, congenital
    syphilis, malignancy and inflicted injury (child physical abuse). Misattribution
    to abuse has been reported.
  distinguishing_features:
  - Diaphyseal lesions sparing metaphyses and epiphyses
  - Mandibular involvement
  - Negative cultures
  - Spontaneous regression and family history of the same episode
  evidence:
  - reference: PMID:19203363
    reference_title: "Professional awareness is needed to distinguish between child physical abuse from other disorders that can mimic signs of abuse (Skull base sclerosis in infant manifesting features of infantile cortical hyperostosis): a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The radiological differential diagnosis should include osteomyelitis, vitamin A intoxication, scurvy, syphilis, osteosarcoma and battered child syndrome."
    explanation: Lists the main radiological differentials.
  - reference: PMID:40473314
    reference_title: "Unravelling the challenges in diagnosing Caffey disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnoses like osteomyelitis and malignancy were ruled out."
    explanation: Case report illustrating exclusion of osteomyelitis and malignancy.
treatments:
- name: Nonsteroidal Anti-Inflammatory Drugs
  description: >-
    Short-term anti-inflammatory, antipyretic and analgesic treatment for the
    swelling, fever and pain of an episode. Indomethacin, ibuprofen and naproxen
    have been used; case reports describe resolution of symptoms on indomethacin,
    and indomethacin allowed steroid withdrawal in relapsing twins. There are no
    controlled trials, and the disease is self-limited.

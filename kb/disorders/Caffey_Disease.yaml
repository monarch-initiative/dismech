has_subtypes:
- name: Infantile Form
  description: >-
    The classic presentation: onset between birth and about five months with
    inflammatory soft-tissue swelling, fever and irritability over the affected
    bones, and spontaneous regression of the hyperostosis by about two years.
  evidence:
  - reference: PMID:22855962
    reference_title: "Caffey Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically associated with fever, soft-tissue swelling, and pain, with onset between birth and five months and spontaneous resolution by age two years"
    explanation: GeneReviews description of the classic infantile course.
- name: Prenatal Form
  description: >-
    A much rarer presentation recognised before birth, with diffuse cortical
    hyperostosis of long bones and ribs, sometimes polyhydramnios and hydrops, and
    a high perinatal mortality when it begins early in gestation. The recurrent
    COL1A1 variant has been found in a lethal case, but whether all prenatal cases
    share the COL1A1 etiology is not established.
  evidence:
  - reference: PMID:18553566
    reference_title: "Prenatal cortical hyperostosis with COL1A1 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study indicates that a heterozygous 3040C --> T mutation can also be found in lethal prenatal cortical hyperostosis."
    explanation: Places a lethal prenatal case on the same COL1A1 allele as the infantile form.
  - reference: PMID:41479472
    reference_title: "Defying the Odds: Survival in Severe Prenatal Caffey's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A much rarer prenatal form presents before birth with diffuse, symmetric cortical thickening and often results in perinatal death, especially when it develops early in gestation."
    explanation: Describes the prenatal form and its usual outcome.
inheritance:
- name: Autosomal Dominant
  description: >-
    A single heterozygous COL1A1 variant is sufficient. Familial cases show vertical
    transmission, but clinically unaffected relatives can carry the familial
    variant, so penetrance for the infantile episode is incomplete and
    expressivity (number and site of bones, severity, recurrence) varies within
    families. Some cases arise from a de novo variant; the proportion is unknown.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:22855962
    reference_title: "Caffey Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Caffey disease is inherited in an autosomal dominant manner."
    explanation: GeneReviews statement of the mode of inheritance.
  - reference: PMID:18704262
    reference_title: "The c.3040C > T mutation in COL1A1 is recurrent in Korean patients with infantile cortical hyperostosis (Caffey disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our result supported that ICH is caused by the single mutation in COL1A1 with incomplete penetrance."
    explanation: Mutation found in all patients and in tested parents, supporting incomplete penetrance.
  - reference: PMID:24390061
    reference_title: "Two Japanese familial cases of Caffey disease with and without the common COL1A1 mutation and normal bone density, and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case and two clinically healthy members of one family carry the common heterozygous mutation"
    explanation: Clinically healthy carriers of the familial variant document non-penetrance.
  - reference: PMID:21567126
    reference_title: "Infantile cortical hyperostosis and COL1A1 mutation in four generations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although our paper shows a distinct correlation between R836C mutation and ICH, there is a certain interindividual and intra-familial variability."
    explanation: Four-generation family showing variable expressivity of the same allele.
  - reference: PMID:22855962
    reference_title: "Caffey Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "others have the disorder as the result of a de novo pathogenic variant. The proportion of individuals with Caffey disease caused by a de novo pathogenic variant is unknown."
    explanation: De novo occurrence is recognised but unquantified.
pathophysiology:
- name: COL1A1 Arginine-to-Cysteine Substitution
  description: >-
    The initiating lesion is a heterozygous germline missense variant in COL1A1
    that replaces an arginine with a cysteine in the triple-helical domain of the
    pro-alpha1(I) chain of type I collagen. The recurrent allele is c.3040C>T,
    p.(Arg1014Cys) (R836C in helical numbering); c.2752C>T, p.(Arg918Cys) is a
    second, less common allele. Neither is a glycine substitution of the kind that
    causes osteogenesis imperfecta. The structural-constituent function is marked
    ABNORMAL rather than DECREASED because the change is qualitative (aberrant
    disulfide-bonded chains, altered fibril diameter and packing and, per
    ClinGen, disrupted collagen-ligand interaction), not a loss of collagen
    quantity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: type I collagen structural constituent of the extracellular matrix
    modifier: ABNORMAL
    term:
      id: GO:0030020
      label: extracellular matrix structural constituent conferring tensile strength
  evidence:
  - reference: PMID:15864348
    reference_title: "A novel COL1A1 mutation in infantile cortical hyperostosis (Caffey disease) expands the spectrum of collagen-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals and obligate carriers were heterozygous for a missense mutation"
    explanation: Linkage and sequencing in the index family identified the heterozygous COL1A1 missense variant.
  - reference: PMID:34272483
    reference_title: "Caffey disease is associated with distinct arginine to cysteine substitutions in the proα1(I) chain of type I procollagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both arginine to cysteine substitutions are located in the triple helical domain of the proα1(I) procollagen chain."
    explanation: Both known Caffey alleles are Arg-to-Cys substitutions in the helical domain.
  downstream:
  - target: Disulfide-Bonded Alpha1(I) Chain Dimers
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24389367
      reference_title: "Caffey disease: new perspectives on old questions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In fact, presence of cysteine residues results in aberrant disulfide bonded α1(I) dimers leading to abnormal fibril diameter often noticed in ultrastructural analyses of patient-derived dermis"
      explanation: Review stating that the introduced cysteine causes aberrant disulfide-bonded alpha1(I) dimers.
- name: Disulfide-Bonded Alpha1(I) Chain Dimers
  description: >-
    The free thiol of the introduced cysteine allows abnormal disulfide bonds
    between alpha1(I) chains. Patient dermal fibroblasts produce disulfide-linked
    alpha1(I) dimers; with p.(Arg1014Cys) these molecules are secreted, with
    p.(Arg918Cys) they were not, and no intracellular accumulation of type I
    procollagen was seen.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:15864348
    reference_title: "A novel COL1A1 mutation in infantile cortical hyperostosis (Caffey disease) expands the spectrum of collagen-related disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblast cultures from an affected individual produced abnormal disulfide-bonded dimeric alpha1(I) chains."
    explanation: Direct biochemical demonstration in patient fibroblasts.
  - reference: PMID:34272483
    reference_title: "Caffey disease is associated with distinct arginine to cysteine substitutions in the proα1(I) chain of type I procollagen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dermal fibroblasts (one patient with p.(Arg1014Cys) and one with p.(Arg918Cys)) produced molecules with disulfide-linked proα1(I) chains, which were secreted only with p.(Arg1014Cys). No intracellular accumulation of type I procollagen was detected."
    explanation: Confirms the dimers for both alleles and the absence of intracellular retention.
  downstream:
  - target: Abnormal Type I Collagen Fibril Architecture
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24389367
      reference_title: "Caffey disease: new perspectives on old questions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In fact, presence of cysteine residues results in aberrant disulfide bonded α1(I) dimers leading to abnormal fibril diameter often noticed in ultrastructural analyses of patient-derived dermis"
      explanation: Links the aberrant dimers to the abnormal fibril diameter seen in patient dermis.
- name: Abnormal Type I Collagen Fibril Architecture
  description: >-
    Dermal collagen fibrils of carriers are larger and more variable in diameter
    and shape and less densely packed than normal. The changes are mild, and the
    review literature argues that the disease is driven not by a gross structural
    or quantitative collagen defect but by altered matrix composition and
    collagen-ligand interactions that change cell signalling.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:15864348
    reference_title: "A novel COL1A1 mutation in infantile cortical hyperostosis (Caffey disease) expands the spectrum of collagen-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermal collagen fibrils of the same individual were larger, more variable in shape and size, and less densely packed than those in control samples."
    explanation: Ultrastructural fibril abnormality in patient skin.
  - reference: PMID:34272483
    reference_title: "Caffey disease is associated with distinct arginine to cysteine substitutions in the proα1(I) chain of type I procollagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dermis revealed mild ultrastructural abnormalities in collagen fibril diameter and packing."
    explanation: Replicates the mild fibril abnormality in a larger series.
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Taken together, these observations argue for a pathogenesis driven not necessarily by gross structural or quantitative defects in type I collagen fibrils, but by a subtle alteration in ECM composition that may affect cell signaling as a result of impaired collagen interactions."
    explanation: Review synthesis of how the fibril change is thought to act.
  downstream:
  - target: Acute Periosteal and Soft-Tissue Inflammation
    description: >-
      The step from altered matrix to focal inflammation is inferred, not
      demonstrated; see the collagen_to_inflammation discussion.
    evidence:
    - reference: PMID:15864344
      reference_title: "Caffey disease: an unlikely collagenopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "the precise functional link between the reported missense mutation and the localized inflammation and hyperostosis seen in Caffey disease awaits future studies"
      explanation: Commentary accepting the mutation as causal while stating that the mechanism linking it to inflammation is unknown.
  - target: Joint Hypermobility
  - target: Hyperextensible Skin
  - target: Inguinal Hernia
- name: Acute Periosteal and Soft-Tissue Inflammation
  description: >-
    Histologically, foci of acute inflammation begin in the periosteum and spread
    into the adjacent soft tissues, producing the tender swelling over affected
    bones. Systemic markers of inflammation (ESR, C-reactive protein,
    immunoglobulins) rise. Because the neonatal immune system has blunted
    cytokine responses, the inflammation is thought to be a local, matrix-driven
    process.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Foci of acute inflammation were confined to the periosteum early on but progressively disrupted the adjacent soft tissue."
    explanation: Review summary of the histology of affected bones.
  - reference: PMID:40473314
    reference_title: "Unravelling the challenges in diagnosing Caffey disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is characterised by acute inflammation of the periosteum, cortical hyperostosis, and soft tissue swelling"
    explanation: Biopsy-confirmed case report describing the inflammatory periosteal lesion.
  downstream:
  - target: COX-2 Prostaglandin E Signaling
    description: Hypothesised; see the collagen_to_inflammation discussion.
    evidence:
    - reference: PMID:24389367
      reference_title: "Caffey disease: new perspectives on old questions."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "In such a scenario, the periosteal injury might elicit an inflammatory response that triggers a local positive feedback loop involving COX-2/PGE signaling driving new bone formation by periosteal osteoblasts."
      explanation: Proposed model linking periosteal inflammation to COX-2/PGE signalling; a hypothesis, not a demonstration.
  - target: Fever
  - target: Irritability
  - target: Soft-Tissue Swelling Over Affected Bones
  - target: Bone Pain
  - target: Elevated Erythrocyte Sedimentation Rate
  - target: Elevated C-Reactive Protein
  - target: Increased Circulating Immunoglobulins
- name: COX-2 Prostaglandin E Signaling
  description: >-
    Hypothesised amplifier. Prolonged prostaglandin E1 infusion in neonates
    reproduces lamellated cortical hyperostosis, elevated prostaglandin E levels
    were reported in patients with cortical hyperostosis whose symptoms resolved
    on indomethacin or glucocorticoids, and prostaglandin E2 is anabolic for
    periosteal osteoblasts in mice. Direct measurement of COX-2 activity in
    COL1A1-positive Caffey lesions has not been reported.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: prostaglandin biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
  evidence:
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "reported elevated PGE levels in five patients with cortical hyperostosis, whose symptoms resolved upon abrogation of PGE synthesis via indomethacin administration or other anti-inflammatory drugs, such as glucocorticoids"
    explanation: Review account of elevated PGE and response to its suppression; the review does not say these patients carried the COL1A1 variant.
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Upregulation of COX2/PGE axis and transforming growth factor (TGFβ) signaling have been shown to cause cortical hyperostosis in humans"
    explanation: States that COX-2/PGE upregulation can cause cortical hyperostosis, the basis for the hypothesis.
  downstream:
  - target: Subperiosteal New Lamellar Bone Formation
    description: Hypothesised.
    evidence:
    - reference: PMID:24389367
      reference_title: "Caffey disease: new perspectives on old questions."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Furthermore, numerous murine studies have demonstrated the bone anabolic effects of PGE2 resulting from increased proliferation of periosteal osteoblasts"
      explanation: Model-organism background for PGE driving periosteal bone formation, cited by the review in support of the hypothesis.
- name: Subperiosteal New Lamellar Bone Formation
  description: >-
    Periosteal osteoblasts lay down new lamellar bone beneath the inflamed
    periosteum, thickening the cortex of the affected bones and giving long-bone
    diaphyses a spindle shape while metaphyses and epiphyses are usually spared.
    This is the hyperostosis seen radiographically.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: periosteal osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  evidence:
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "were the first to provide a detailed histological analysis of the affected bones with evidence for local inflammation along with subperiosteal new lamellar bone formation"
    explanation: Review account of the histology combining inflammation and subperiosteal lamellar bone.
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutant collagen fibrils in Caffey disease lead to enhanced lamellar bone formation along the periosteal surface"
    explanation: Contrasts Caffey disease with osteogenesis imperfecta, where collagen mutations impair bone formation.
  downstream:
  - target: Subperiosteal Bone Formation
  - target: Mandibular Hyperostosis
  - target: Clavicular Cortical Thickening
  - target: Thickened Ribs
  - target: Cortical Thickening of Long Bone Diaphyses
  - target: Elevated Alkaline Phosphatase
  - target: Remodeling and Regression of Hyperostosis
- name: Remodeling and Regression of Hyperostosis
  description: >-
    As the episode resolves the inflammation subsides, the periosteum re-forms as
    a fibrous layer, and the excess peripheral bone is removed by remodeling, so
    that radiographs usually normalise by about two years. The mechanism that
    terminates the episode is unknown.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone remodeling
    modifier: INCREASED
    term:
      id: GO:0046849
      label: bone remodeling
  evidence:
  - reference: PMID:24389367
    reference_title: "Caffey disease: new perspectives on old questions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subsequently, the inflammation disappears and excess peripheral bone is eliminated through remodeling"
    explanation: Review description of the resolution phase.

pathophysiology:
- name: Biphasic Epithelial-Osteofibrous Neoplastic Proliferation
  biological_scale: TISSUE
  description: >-
    Adamantinoma is defined by a neoplastic proliferation of keratin- and
    p63-positive epithelial cells, arranged in tubular, basaloid,
    spindle-cell, or squamoid patterns, embedded within a fibro-osseous
    (osteofibrous) stroma. The epithelial component shows a keratin
    subclass immunoreactivity pattern (widespread keratin 14 and 19, with
    keratin 5 in the majority of cases) that is independent of histologic
    growth pattern and is conserved in local recurrences and metastases,
    supporting a common basal epithelial cell-like histogenesis for all
    growth patterns. Almost all tumors arise in the tibial diaphysis or
    metaphysis.
  cell_types:
  - preferred_term: basal epithelial-like tumor cell
    term:
      id: CL:0000646
      label: basal cell
  - preferred_term: osteofibrous stromal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: tibial diaphysis
    term:
      id: UBERON:0013280
      label: diaphysis of tibia
  biological_processes:
  - preferred_term: aberrant basal epithelial differentiation of tumor cells
    modifier: ABNORMAL
    term:
      id: GO:0030855
      label: epithelial cell differentiation
  evidence:
  - reference: PMID:7694513
    reference_title: "Adamantinoma of the long bones: keratin subclass immunoreactivity pattern with reference to its histogenesis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results revealed the widespread presence of keratins 14 and 19
      in all specimens studied; 74% showed immunoreactivity of keratin 5
    explanation: >-
      Establishes the conserved keratin immunoprofile of the epithelial
      component across adamantinoma growth patterns and recurrences.
  - reference: PMID:7694513
    reference_title: "Adamantinoma of the long bones: keratin subclass immunoreactivity pattern with reference to its histogenesis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest a basal epithelial cell-like differentiation of adamantinomas."
    explanation: Directly supports the basal epithelial-like histogenesis claim.
  downstream:
  - target: Local Cortical Bone Destruction and Structural Compromise
    description: >-
      Intraosseous tumor growth destroys and remodels adjacent cortical
      bone in the tibial diaphysis.

- name: Recurrent Chromosomal Copy-Number Gains Without an Established Driver
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Cytogenetic and, more recently, genomic studies of classic adamantinoma
    recurrently identify extra copies of chromosomes 7, 8, 12, 19, and 21
    (and, in a targeted sequencing/SNP-array series, chromosomes 7, 8, 10,
    12, and/or 19), sometimes accompanied by isolated structural events
    (e.g., a chromosome 12q tandem duplication, an FGFR1 rearrangement, or
    an NRAS p.G12D variant in single cases). No single recurrent driver
    gene, mutation, or fusion has been established across cases: this
    genomic profile is what most clearly distinguishes true adamantinoma
    from its principal molecular mimic, "adamantinoma-like Ewing sarcoma,"
    which instead carries the canonical EWSR1::FLI1/ERG t(11;22) or t(21;22)
    translocations that are consistently absent from true adamantinoma.
    Osteofibrous dysplasia-like adamantinoma is genomically heterogeneous
    and, in a small paired series, could show either no detectable
    variants or the same chromosome 7/8/19 gain pattern as classic
    adamantinoma, so genomic profiling has been proposed as an aid to (but
    not yet a settled arbiter of) distinguishing these entities.
  evidence:
  - reference: PMID:11227067
    reference_title: "Extra copies of chromosomes 7, 8, 12, 19, and 21 are recurrent in adamantinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetic or molecular cytogenetic analysis of four adamantinomas,
      and a review of eleven cases in the literature reveals extra copies
      of chromosomes 7, 8, 12, 19, and 21 as recurrent in this neoplasm.
    explanation: Establishes the recurrent whole-chromosome copy-number gain pattern.
  - reference: PMID:9242211
    reference_title: "Cytogenetic analysis of adamantinoma of long bones: further indications for a common histogenesis with osteofibrous dysplasia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of them revealed trisomies 7, 8, 12, and 19, combined with a
      balanced translocation, t(10;12), with centromere breakpoints in one
      tumor.
    explanation: >-
      Independent cytogenetic series confirming the recurrent trisomy
      pattern and demonstrating additional structural heterogeneity
      between cases (no single lesion is shared by all tumors).
  - reference: PMID:42379271
    reference_title: "Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3 classic adamantinomas harbored multiple copy number gains
      involving chromosome 7, 8, 10, 12, and/or 19. Focal deletion of
      chromosome 17, intergenic rearrangement involving FGFR1, and NRAS
      p.G12D were each present in 1 classic adamantinoma.
    explanation: >-
      Contemporary NGS/SNP-array/Hi-C study confirming the copy-number
      gain pattern and showing that isolated structural/point variants
      differ from tumor to tumor rather than converging on one driver.
  - reference: PMID:11592101
    reference_title: "Adamantinoma-like Ewing's sarcoma and Ewing's-like adamantinoma. The t(11; 22), t(21; 22) status"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study investigated the putative presence of t(11; 22) and
      t(21; 22) in 14 cases of adamantinoma by RT-PCR. These translocations
      were not found in any of these cases.
    explanation: >-
      Shows true adamantinoma lacks the EWSR1 translocations that define
      its principal molecular mimic, adamantinoma-like Ewing sarcoma,
      supporting genomic distinctness despite morphologic overlap.

- name: Local Cortical Bone Destruction and Structural Compromise
  biological_scale: TISSUE
  description: >-
    Progressive intracortical and intramedullary tumor growth within the
    tibial diaphysis destroys and thins cortical bone, producing anterior
    tibial bowing, a palpable mass, bone pain, and, in advanced or
    long-standing disease, structural weakening predisposing to pathologic
    fracture.
  locations:
  - preferred_term: tibial diaphysis
    term:
      id: UBERON:0013280
      label: diaphysis of tibia
  downstream:
  - target: Tibial Bowing
    description: Cortical destruction and remodeling produce progressive anterior bowing of the tibia.
  - target: Bone Pain
    description: Local tumor growth and cortical destruction cause chronic bone pain.
  - target: Localized Extremity Mass
    description: Tumor expansion produces a palpable soft-tissue swelling over the involved bone.
  - target: Pathologic Fracture
    description: Cortical thinning from tumor growth predisposes to fracture through the involved bone.
  evidence:
  - reference: PMID:30844202
    reference_title: "Adamantinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adamantinomas are rare, low-grade malignant bone tumors of uncertain
      histogenesis that predominately affect the diaphyses and metaphyses
      of the tibia.
    explanation: Establishes the anatomic site of the destructive tumor process.

- name: Local Recurrence After Incomplete Surgical Resection
  biological_scale: TISSUE
  description: >-
    Local recurrence is common and can occur late (documented beyond 15
    years post-treatment). Across a synthesized literature base, local
    recurrence rates range from 15-31% for classic adamantinoma and
    22-43% for the OFD-like variant. Wide resection with uncontaminated
    margins is the most consistently protective surgical variable
    identified across the case-series literature; intralesional or
    marginal margins predispose to recurrence.
  downstream:
  - target: Hematogenous and Lymphatic Metastasis
    description: >-
      Recurrent and spindle/basaloid-pattern classic adamantinoma is
      disproportionately associated with subsequent metastatic disease.
  evidence:
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Local recurrence rates for classic adamantinoma (AD) range from 15%
      to 31%, with metastatic rates from 10% to 27%, predominantly to the
      lung.
    explanation: Quantifies the recurrence and metastasis rates from a synthesis of the case-series literature.
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wide resection with uncontaminated margins is the most consistently
      protective surgical variable (hazard ratio 0.164; p < 0.001).
    explanation: Quantifies the protective effect of margin status on outcome.
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late recurrences beyond 15 years are documented in multiple series, supporting prolonged surveillance."
    explanation: Documents the long natural history requiring lifelong surveillance.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly associated patterns with recurrences and
      metastasis in a classic adamantinoma were spindle and basaloid.
    explanation: Links specific classic-adamantinoma growth patterns to a higher risk of recurrence and metastasis.

- name: Hematogenous and Lymphatic Metastasis
  biological_scale: ORGANISM
  description: >-
    Classic adamantinoma metastasizes predominantly to the lungs, in an
    estimated 10-27% of cases, but metastatic spread is not confined to
    the lung: it is also reported to regional lymph nodes (including a
    case with inguinal nodal recurrence and no pulmonary disease at all)
    and, less commonly, to abdominal/pelvic sites, liver, brain, and
    skeleton. In contrast, the OFD-like variant, despite a locally
    aggressive recurrence rate, shows no metastases in series that report
    it separately, indicating a biologically distinct clinical behavior
    from classic adamantinoma despite their morphologic overlap.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  downstream:
  - target: Pulmonary Metastasis
    description: Hematogenous spread establishes secondary tumor deposits in the lung.
  - target: Nodal Metastasis
    description: Lymphatic spread establishes secondary tumor deposits in regional lymph nodes.
  evidence:
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The osteofibrous dysplasia-like subtype (OFD-AD) showed no
      metastases in any series that reports this subtype separately but
      carries a locally aggressive recurrence rate of 22-43%.
    explanation: >-
      Directly supports the biological distinction between classic
      adamantinoma metastatic potential and the OFD-like variant's purely
      local aggressiveness.
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because metastatic spread is not confined to the lung, chest CT
      alone may be insufficient for surveillance in selected high-risk
      patients, in whom staging beyond the chest should be considered
    explanation: >-
      Directly supports that metastatic spread extends beyond the lung
      alone, motivating the broader nodal/abdominal-pelvic framing of this
      node rather than a pulmonary-only model.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five out of 28 (17.9%) patients with an adamantinoma developed recurrences and 5 (17.9) developed metastases."
    explanation: Independent single-institution series quantifying metastatic frequency among classic adamantinomas.
  - reference: PMID:39555331
    reference_title: "Adamantinoma: A SEER-based Epidemiological Analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      metastasis occurs at rates as high as 18–32% primarily to lymph
      nodes or lungs
    explanation: >-
      Directly establishes lymph nodes, alongside lungs, as a primary
      metastatic site for adamantinoma.
  - reference: PMID:38486378
    reference_title: "Rare Case of Recurrent Adamantinoma of the Tibia: Limited Efficacy of Pazopanib as a Standalone Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a positive emission tomography scan revealed mildly increased
      tracer uptake near the area of the previous lesion and in the right
      inguinal lymph node. Biopsies of the lesion and inguinal lymph node
      confirmed recurrence of the adamantinoma. Due to abdominal and
      pelvic metastasis
    explanation: >-
      Case-level evidence of inguinal lymph node and abdominal/pelvic
      metastatic recurrence with no lung involvement reported, directly
      motivating a nodal (not pulmonary-only) metastasis model.

- name: Sarcomatoid Dedifferentiation with Loss of Epithelial Phenotype
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Rarely, classic adamantinoma undergoes high-grade sarcomatoid
    transformation, with progressive loss of pankeratin and other
    epithelial marker expression in the transformed component (a
    "revertant mesenchymal phenotype"). This dedifferentiated form behaves
    more aggressively; the evidence base for its mechanism is limited to a
    small number of case reports.
  evidence:
  - reference: PMID:20717000
    reference_title: "Dedifferentiated classic adamantinoma of the tibia: a report of a case with eventual complete revertant mesenchymal phenotype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the en bloc resection specimen, areas of classic adamantinoma
      were found but most of the tumor corresponded to a high-grade
      neoplasm with 2 histologic patterns: one made up by epithelial nests
      with a basaloid arrangement and positive for pankeratins and
      so-called glandular keratins, and a second sarcomatoid component,
      negative for these epithelial markers.
    explanation: Direct description of a dedifferentiated adamantinoma with sarcomatoid loss of the epithelial immunophenotype.
  downstream:
  - target: Hematogenous and Lymphatic Metastasis
    description: >-
      Dedifferentiated/sarcomatoid transformation is associated with more
      aggressive, higher-risk clinical behavior including relapse and
      metastasis in reported cases.

phenotypes:
- name: Tibial Bowing
  category: Skeletal
  description: >-
    Progressive anterior angular deformity (bowing) of the tibia, a
    recognized presenting or associated finding across the OFD/adamantinoma
    spectrum, particularly well documented for the OFD and OFD-like end of
    that spectrum and in younger patients.
  phenotype_term:
    preferred_term: Tibial bowing
    term:
      id: HP:0002982
      label: Tibial bowing
  evidence:
  - reference: PMID:35094574
    reference_title: "Osteofibrous dysplasia of the tibia : the importance of deformity in surveillance"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      41 lesions (40.6%) presented with radiological deformity (> 10°):
      apex anterior in 97.6%.
    explanation: >-
      Directly quantifies anterior angular tibial deformity (bowing) in a
      101-lesion tibial OFD case series, the benign end of the
      OFD/adamantinoma spectrum this phenotype describes.
  - reference: PMID:38539216
    reference_title: "Osteofibrous dysplasia: a narrative review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OFD can present with asymptomatic, mass, pain, swelling, deformity
      (anterior bowing of the tibia), and even pathological fracture
    explanation: >-
      Independent narrative review confirming anterior tibial bowing
      (deformity) as a recognized clinical presentation across the
      OFD/adamantinoma spectrum.


name: Adamantinoma
creation_date: "2026-08-26T23:27:22Z"
category: Cancer
categories:
- Bone Cancer
- Rare Cancer
- Low-Grade Malignant Neoplasm
synonyms:
- Adamantinoma of long bones
- Adamantinoma of the tibia
description: >-
  Adamantinoma is a rare, low-grade malignant primary bone tumor with a
  striking predilection for the diaphysis and metaphysis of the tibia
  (occasionally the fibula, and rarely other long bones), accounting for
  less than 0.1-0.5% of all primary bone tumors. It is histologically
  biphasic, combining keratin- and p63-positive epithelial cell nests
  within an osteofibrous (fibro-osseous) stroma, and is named for its
  histological resemblance to ameloblastoma ("adamantinoma" of the jaw)
  despite arising in an unrelated anatomic site and lineage. WHO
  classification recognizes classic adamantinoma (with tubular, basaloid,
  spindle-cell, and squamoid growth patterns), the osteofibrous
  dysplasia-like (OFD-like) form, and a rare dedifferentiated form with
  high-grade sarcomatous transformation; these are curated here as
  histopathologic variants of a single entity rather than as subtypes,
  because the boundaries between them are diagnostically unstable and the
  relationship between osteofibrous dysplasia, OFD-like adamantinoma, and
  classic adamantinoma remains a genuinely unsettled histogenetic question
  (see `discussions`). Despite its low-grade designation, adamantinoma
  carries a substantial long-term risk of local recurrence (15-31% for
  classic adamantinoma, 22-43% for the OFD-like form) and pulmonary
  metastasis (10-27%, essentially confined to classic adamantinoma), with
  recurrences reported more than 15 years after initial treatment. Wide
  surgical resection with uncontaminated margins is the most consistently
  protective factor and the mainstay of treatment, as the tumor is largely
  resistant to conventional chemotherapy and radiotherapy.

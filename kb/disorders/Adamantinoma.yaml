histopathology:
- name: Keratin/p63-Positive Epithelial Immunoprofile
  diagnostic: true
  description: >-
    The neoplastic epithelial nests express pankeratin (AE1/AE3) in
    approximately 95% of cases, with p40 and p63 also positive in the
    large majority of cases; this keratin/p63 epithelial immunoprofile
    within an otherwise osteofibrous bone lesion is the diagnostic anchor
    that establishes an epithelial (rather than purely mesenchymal or
    fibro-osseous) neoplasm.
  finding_term:
    preferred_term: Cytokeratin and p63 co-expression in epithelial tumor nests
    term:
      id: NCIT:C81765
      label: Cytokeratin-Positive Neoplastic Cells Present
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pan keratin (AE1/AE3) was positive in 18/19 (94.7%) OFDs and 19/20
      (95%) adamantinomas. P40 (5/5, 100%) and p63 (6/8, 75%) were useful
      in the diagnosis of adamantinoma.
    explanation: Direct quantification of pankeratin/p40/p63 positivity rates.
  - reference: PMID:21674157
    reference_title: "p63 expression in adamantinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epithelial component in adamantinoma was found to stain for p63."
    explanation: Establishes p63 as a marker of the epithelial tumor component.

- name: Tubular/Basaloid/Spindle-Cell/Squamoid Growth Patterns (Classic Adamantinoma)
  diagnostic: true
  description: >-
    Classic adamantinoma displays a spectrum of architectural growth
    patterns — tubular, basaloid, spindle-cell, and squamoid — within the
    same underlying epithelial-osteofibrous biphasic lesion. The keratin
    immunoreactivity pattern is conserved across all of these patterns,
    indicating a shared histogenesis; spindle and basaloid patterns are
    disproportionately associated with recurrence and metastasis.
  finding_term:
    preferred_term: Tubular growth pattern
    term:
      id: NCIT:C35925
      label: Tubular Pattern
  evidence:
  - reference: PMID:7694513
    reference_title: "Adamantinoma of the long bones: keratin subclass immunoreactivity pattern with reference to its histogenesis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This keratin immunoreactivity pattern was independent of histologic
      subtype, despite marked variety in differentiation pattern,
      suggesting a common histogenesis for all subtypes of adamantinoma.
    explanation: >-
      Directly supports that the growth-pattern variants share a common
      histogenesis rather than being distinct entities.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly associated patterns with recurrences and
      metastasis in a classic adamantinoma were spindle and basaloid.
    explanation: Links specific growth patterns to prognostic behavior.

- name: Osteofibrous Dysplasia-Like Pattern
  diagnostic: false
  description: >-
    A fibro-osseous pattern resembling osteofibrous dysplasia, with only
    scattered or focal keratin/p40-positive epithelial cell clusters
    (sometimes detectable only by immunostain, not on light microscopy).
    Distinguishing an OFD-like adamantinoma from osteofibrous dysplasia
    proper, and from classic adamantinoma, is a recognized source of
    interobserver diagnostic disagreement (see `discussions`).
  finding_term:
    preferred_term: Osteofibrous dysplasia-like growth pattern
  evidence:
  - reference: PMID:42379271
    reference_title: "Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one case with tumor clusters visible only on cytokeratin immunostain
      harbored no variants, whereas another case with tumor clusters
      visible on light microscopy and cytokeratin/p40 immunostains showed
      gains of chromosome 7, 8, 19, and 20
    explanation: >-
      Documents the diagnostically ambiguous, immunostain-dependent nature
      of the OFD-like epithelial component.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a review, the diagnosis was modified in 12/58 (20.7%) tumors;
      with 4 OFDs revised to FDs; 2 FDs to OFDs; 2 intra-osseous SSs to
      classic adamantinomas; 3 OFD-like adamantinomas to classic
      adamantinomas, and a single de-differentiated adamantinoma to
      classic adamantinoma.
    explanation: >-
      Quantifies the substantial rate of diagnostic revision among OFD,
      OFD-like adamantinoma, and classic adamantinoma on expert review,
      supporting that these categories are diagnostically unstable rather
      than sharply demarcated entities.

- name: Sarcomatoid Dedifferentiation
  diagnostic: false
  description: >-
    A rare high-grade component with loss of epithelial (keratin) marker
    expression arising within or after classic adamantinoma, sometimes
    with a completely "revertant" mesenchymal/sarcomatoid phenotype on
    recurrence.
  finding_term:
    preferred_term: Sarcomatoid dedifferentiation
    term:
      id: NCIT:C158781
      label: Dedifferentiated Lesion
  frequency: VERY_RARE
  evidence:
  - reference: PMID:20717000
    reference_title: "Dedifferentiated classic adamantinoma of the tibia: a report of a case with eventual complete revertant mesenchymal phenotype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three cases of adamantinomas with sarcomatoid transformation of the
      epithelial component have been described but the tumours still
      preserved an epithelial immunophenotype.
    explanation: Establishes the rarity and prior documentation of dedifferentiation in adamantinoma.

diagnosis:
- name: Plain Radiography (Soap-Bubble Osteolytic Lesion)
  description: >-
    Initial imaging is plain radiography, which characteristically shows
    an eccentric, lobular, lytic lesion with sclerotic margins of
    overlapping radiolucency in the tibial diaphysis -- the classic
    "soap-bubble" appearance -- though the radiologic impression does not
    reliably predict the underlying histologic diagnosis (see the
    centrally-sampled-biopsy caveat below).
  diagnosis_term:
    preferred_term: plain radiography of the affected bone
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:34697136
    reference_title: "Adamantinoma: An Updated Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In X-ray, it is usually seen as an eccentric and sometimes central,
      lobular, lytic lesion with sclerotic margins of overlapping
      radiolucency, and a characteristic 'soap-bubble' appearance.
    explanation: Direct description of the characteristic radiographic appearance.

- name: Whole-Bone MRI for Multifocality and Skip Lesions
  description: >-
    MRI of the entire involved bone is used both for differential
    diagnosis and to detect multifocal disease -- reported in
    approximately 24% of cases -- including a singular lobulated focus or
    several small nodules within multiple foci that may not be apparent on
    plain radiographs alone.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the affected bone
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:38486378
    reference_title: "Rare Case of Recurrent Adamantinoma of the Tibia: Limited Efficacy of Pazopanib as a Standalone Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On magnetic resonance imaging (MRI), 2 morphological patterns have
      been described: a singular lobulated focus or several small nodules
      within multiple foci.
    explanation: Directly describes the multifocal/skip-lesion MRI patterns relevant to whole-bone imaging.
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multifocality occurs in approximately 24% of cases"
    explanation: Quantifies the frequency of multifocal disease that whole-bone MRI is intended to detect.
  - reference: PMID:34697136
    reference_title: "Adamantinoma: An Updated Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging seems to be the most appropriate
      examination for differential diagnosis between adamantinoma and
      other skeletal tumors.
    explanation: Establishes MRI as the preferred differential-diagnosis imaging modality.

- name: Chest CT for Metastatic Staging
  description: >-
    Chest CT is used for pulmonary metastatic staging given the tumor's
    predilection for hematogenous lung spread, but chest CT alone can be
    insufficient in high-risk patients because metastatic spread is not
    confined to the lung (see `phenotypes#Nodal Metastasis`); staging
    beyond the chest should be considered in selected high-risk cases, and
    the optimal imaging modality, extent, and frequency of surveillance
    remain undefined.
  diagnosis_term:
    preferred_term: computed tomography of the chest
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because metastatic spread is not confined to the lung, chest CT
      alone may be insufficient for surveillance in selected high-risk
      patients, in whom staging beyond the chest should be considered
    explanation: Directly supports both the chest-CT staging role and its limitation given non-pulmonary metastatic sites.

- name: Centrally-Sampled Biopsy with Immunohistochemistry
  description: >-
    Because the diagnostic epithelial component can be sparse and
    patchy -- especially in OFD-like adamantinoma, where it may be
    detectable only by immunostain and not on light microscopy (see
    `histopathology#Osteofibrous Dysplasia-Like Pattern`) -- adequate,
    ideally centrally-sampled biopsy with immunohistochemistry (pankeratin,
    p40, p63) is needed to avoid false-negative or misclassified
    diagnoses; radiologic-histologic concordance is imperfect even among
    experienced centers.
  diagnosis_term:
    preferred_term: image-guided biopsy with immunohistochemistry
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:18279517
    reference_title: "Adamantinoma: a clinicopathological review and update"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To assure the histological diagnosis, pathologists should employ
      immunohistochemistry for demonstrating the sometimes sparse
      epithelial cell nests when the radiological features are suggestive
      of adamantinoma.
    explanation: Directly states the sampling/immunohistochemistry caveat for the sparse epithelial component.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The radiological impression concurred with the histopathological diagnosis in 40% of OFDs and 60% of adamantinomas."
    explanation: Quantifies imperfect radiologic-histologic concordance, motivating reliance on adequately sampled biopsy.

treatments:
- name: Wide En Bloc Surgical Resection
  description: >-
    Complete surgical excision with uncontaminated (wide) margins is the
    standard, and most consistently effective, treatment for adamantinoma.
    Conventional chemotherapy and radiotherapy have not been shown to be
    reliably effective, so margin-negative surgery is the primary
    curative-intent modality; reconstruction (e.g., with a vascularized
    fibular graft) is frequently required for the resulting tibial defect.
  treatment_term:
    preferred_term: en bloc surgical resection
    term:
      id: NCIT:C139567
      label: En Bloc Resection
  evidence:
  - reference: PMID:42496518
    reference_title: "Adamantinoma of Bone: A Structured Narrative Review of Clinical Outcomes, Recurrence Patterns, and Metastatic Behaviour"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wide resection with uncontaminated margins is the most consistently
      protective surgical variable (hazard ratio 0.164; p < 0.001).
    explanation: Quantifies the protective effect of wide-margin resection on recurrence risk.

- name: Limb-Sparing Reconstruction
  description: >-
    Following wide resection of the tibial defect, limb-sparing
    reconstructive techniques (including vascularized or non-vascularized
    fibular grafts) are used to preserve limb function and avoid
    amputation where feasible.
  treatment_term:
    preferred_term: limb salvage procedure
    term:
      id: NCIT:C16042
      label: Limb Salvage Procedure

- name: Pazopanib (Limited Efficacy in Recurrent/Metastatic Disease)
  description: >-
    The multi-target tyrosine kinase inhibitor pazopanib has been used in
    recurrent/metastatic adamantinoma when surgery alone is no longer
    curative, but case-level experience to date indicates limited
    standalone efficacy; adamantinoma has no consensus systemic-therapy
    guideline.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pazopanib
      term:
        id: CHEBI:71219
        label: pazopanib
  evidence:
  - reference: PMID:38486378
    reference_title: "Rare Case of Recurrent Adamantinoma of the Tibia: Limited Efficacy of Pazopanib as a Standalone Treatment"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This report showed that pazopanib as standalone treatment does not appear to have promising role on patient outcomes."
    explanation: >-
      Case report directly reporting limited efficacy of pazopanib
      monotherapy for recurrent/metastatic adamantinoma.
  notes: >-
    A separate case report describes a sustained response to the PARP
    inhibitor olaparib in a metastatic adamantinoma harboring a somatic
    XRCC2 frameshift mutation (PMID:41370129), illustrating an emerging,
    genomically-guided precision-oncology approach for individual
    metastatic cases; this is not yet an established or guideline-based
    treatment and is not modeled as a separate targeted-therapy entry
    given the single-case evidence base.

differential_diagnoses:
- name: Ameloblastoma
  description: >-
    Ameloblastoma is a locally aggressive odontogenic epithelial tumor of
    the jaw (mandible/maxilla) that shares keratin-positive epithelial
    histology with adamantinoma of long bone, and historically gave
    adamantinoma its name, but the two are anatomically, embryologically,
    and clinically distinct entities: ameloblastoma arises from odontogenic
    epithelium in the jaw, whereas adamantinoma is a primary bone tumor
    with a striking predilection for the tibial diaphysis and no
    odontogenic relationship. This entry (MONDO:0002422) is NOT
    ameloblastoma (MONDO:0017795).
  disease_term:
    preferred_term: ameloblastoma
    term:
      id: MONDO:0017795
      label: ameloblastoma
  distinguishing_features:
  - Arises in the jaw (mandible/maxilla) from odontogenic epithelium, not in long bones
  - No predilection for the tibial diaphysis
  - Distinct molecular drivers (e.g., BRAF V600E, SMO) not reported as recurrent in true adamantinoma
  evidence:
  - reference: PMID:30844202
    reference_title: "Adamantinoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tumor is called adamantinoma due to its histological similarity
      to ameloblastoma, often found in the mandible.
    explanation: >-
      States the historical basis for the name shared with ameloblastoma
      while identifying the mandible as the site specific to ameloblastoma.

- name: Adamantinomatous Craniopharyngioma
  description: >-
    Adamantinomatous craniopharyngioma is a WHO grade 1 epithelial
    neoplasm of the sellar/parasellar region arising from Rathke pouch
    epithelial remnants, driven by somatic CTNNB1 mutations. It shares
    only a descriptive histological label ("adamantinomatous," for its
    resemblance to ameloblastoma/adamantinoma-type epithelium) with the
    bone tumor curated in this entry; it is a completely separate
    disease, already curated in dismech as `Craniopharyngioma.yaml`, and
    is not a form of, subtype of, or related to skeletal adamantinoma
    (MONDO:0002422).
  disease_term:
    preferred_term: craniopharyngioma
    term:
      id: MONDO:0018907
      label: craniopharyngioma
  distinguishing_features:
  - Arises in the sellar/suprasellar region of the central nervous system, not in bone
  - Driven by somatic CTNNB1/Wnt pathway activation, not by the chromosomal copy-number gains seen in skeletal adamantinoma
  - Presents with visual, endocrine, and hypothalamic symptoms rather than a limb mass or bone pain
  notes: >-
    Named entity confusion risk: "adamantinoma" and "adamantinomatous
    craniopharyngioma" share only the descriptive adjective, not disease
    identity; deep-research and literature-search tools can conflate them.

- name: Adamantinoma-like Ewing Sarcoma
  description: >-
    A member of the Ewing sarcoma family of tumors that shows aberrant
    epithelial (cytokeratin) expression and, in some cases, an
    architectural resemblance to adamantinoma, but is genetically defined
    by the canonical Ewing sarcoma EWSR1::FLI1 t(11;22) or EWSR1::ERG
    t(21;22) translocation. These translocations are consistently absent
    in true adamantinoma, despite the misleading shared name.
  distinguishing_features:
  - Carries the EWSR1::FLI1 t(11;22) or EWSR1::ERG t(21;22) translocation, absent in true adamantinoma
  - Not restricted to the tibial diaphysis in the same site-specific pattern as adamantinoma
  - Aggressive small round blue cell histology rather than the biphasic epithelial-osteofibrous pattern of adamantinoma
  evidence:
  - reference: PMID:11592101
    reference_title: "Adamantinoma-like Ewing's sarcoma and Ewing's-like adamantinoma. The t(11; 22), t(21; 22) status"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study investigated the putative presence of t(11; 22) and
      t(21; 22) in 14 cases of adamantinoma by RT-PCR. These translocations
      were not found in any of these cases. The results support the view
      that these tumours are genetically and clinically distinct, but may
      eventually show overlapping morphological and immunohistochemical
      features.
    explanation: >-
      Directly establishes the genetic distinction between true
      adamantinoma and adamantinoma-like Ewing sarcoma despite
      morphologic overlap.

- name: Osteofibrous Dysplasia
  description: >-
    A benign, self-limited fibro-osseous lesion of the tibial diaphysis in
    children, radiologically and histologically similar to OFD-like
    adamantinoma; distinguishing the two (and determining whether OFD can
    itself progress to adamantinoma) is an open diagnostic and
    histogenetic question (see `discussions`).
  disease_term:
    preferred_term: osteofibrous dysplasia
    term:
      id: MONDO:0011806
      label: osteofibrous dysplasia
  distinguishing_features:
  - Benign lesion, historically not considered to metastasize
  - Typically younger age at presentation (median 10 years vs 25 years for adamantinoma in one series)
  - Absent or only very focal/rare p63-positive epithelial cells on immunostain
  evidence:
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age for OFD (10 years) was lower than that of adamantinoma (25 years)."
    explanation: Quantifies the age-distribution distinction used to help separate the two entities clinically.

discussions:
- discussion_id: adam_ofd_progression_sequence
  prompt: >-
    Does osteofibrous dysplasia progress through an OFD-like adamantinoma
    intermediate to classic adamantinoma along a single histogenetic
    continuum, or are these three diagnostically overlapping but
    biologically separate entities?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biphasic Epithelial-Osteofibrous Neoplastic Proliferation
  - pathophysiology#Recurrent Chromosomal Copy-Number Gains Without an Established Driver
  - histopathology#Osteofibrous Dysplasia-Like Pattern
  - differential_diagnoses#Osteofibrous Dysplasia
  rationale: >-
    Shared cytogenetic findings (trisomies 7, 8, and 12 reported in both
    OFD and adamantinoma) and shared, if focal, p63/keratin epithelial
    positivity in OFD have long been read as evidence of a common
    histogenesis and a possible progression sequence from OFD through
    OFD-like adamantinoma to classic adamantinoma. However, a contemporary
    genomic comparison found classic adamantinomas carry multiple
    chromosome/arm-level copy-number gains that OFDs largely lack, arguing
    the two may be genetically distinct rather than points on one
    continuum; and the largest recent single-institution clinicopathologic
    series observed a morphological continuum among the three diagnoses
    but did not observe any OFD progressing to adamantinoma during
    prospective follow-up (median 51 months, range 4-98 months). Both the
    "shared histogenesis/progression" and "distinct entities" readings
    remain live in the literature, and no study to date has followed a
    cohort of confirmed OFD cases long enough, with sufficiently
    consistent molecular workup, to settle the question. This bears
    directly on clinical management: if OFD can progress to a malignant
    tumor, that argues for closer surveillance of pediatric OFD than is
    currently standard.
  proposed_experiments:
  - experiment_id: exp_adam_ofd_longitudinal_molecular_cohort
    name: Prospective longitudinal molecular cohort of OFD, OFD-like adamantinoma, and classic adamantinoma
    description: >-
      Assemble a multi-institutional cohort of histologically confirmed
      OFD cases with long-term (>15 year) clinical and radiographic
      follow-up, paired with serial genomic profiling (copy-number/SNP
      array or targeted sequencing) of the lesion at diagnosis and at any
      subsequent biopsy or recurrence, to determine whether any lesion
      acquires the classic-adamantinoma copy-number gain pattern over time
      and whether that acquisition precedes clinical/histologic
      progression.
  evidence:
  - reference: PMID:9242211
    reference_title: "Cytogenetic analysis of adamantinoma of long bones: further indications for a common histogenesis with osteofibrous dysplasia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trisomies 7, 8, and 12 also were described in OFD, which
      suggests a common histogenesis of OFD and adamantinoma.
    explanation: Represents the "shared histogenesis/progression" position in the literature.
  - reference: PMID:12679847
    reference_title: "Adamantinoma, osteofibrous dysplasia and differentiated adamantinoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cytokeratin subset immunohistochemical stains and cytogenetic
      studies performed in recent years suggest a common histogenesis for
      these three entities.
    explanation: >-
      Independent review reinforcing the "shared histogenesis/progression"
      position across OFD, OFD-like adamantinoma, and classic
      adamantinoma.
  - reference: PMID:42379271
    reference_title: "Genomic Characterization of Classic Adamantinoma, Osteofibrous Dysplasia, and Osteofibrous Dysplasia-like Adamantinoma"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, classic adamantinomas and OFD might be genetically
      distinct. Classic adamantinomas harbored multiple alterations,
      including chromosome/arm-level copy number gains, the detection of
      which could aid their distinction from OFDs.
    explanation: >-
      Represents the more recent, genomically-based "distinct entities"
      position, in tension with the earlier common-histogenesis reading.
  - reference: PMID:41653544
    reference_title: "Clinicopathological analysis of osteofibrous dysplasia and adamantinoma: A single institution experience"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there is a morphological continuum between OFD and
      adamantinoma, we did not observe a disease progression during the
      limited follow-up.
    explanation: >-
      Direct negative result on progression from the largest recent
      clinicopathologic follow-up series, explicitly framed against the
      morphological-continuum hypothesis.

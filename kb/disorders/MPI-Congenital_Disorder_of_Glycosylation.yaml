differential_diagnoses:
- name: PMM2-congenital disorder of glycosylation
  description: >-
    The commonest CDG and the closest biochemical mimic: PMM2-CDG produces an
    identical CDG type I transferrin pattern but is dominated by neurologic
    disease (developmental delay, cerebellar hypoplasia) with dysmorphism,
    inverted nipples and abnormal fat pads, none of which occur in MPI-CDG.
    Discrimination requires enzyme assay or molecular testing.
  disease_term:
    preferred_term: PMM2-congenital disorder of glycosylation
    term:
      id: MONDO:0008907
      label: PMM2-congenital disorder of glycosylation
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast with PMM2-CDG, facial dysmorphia, atypical fat pads, inverted nipples, and skeletal deformities are not present in MPI-CDG patients.
    explanation: >-
      States the clinical discriminators from the principal differential.
  - reference: PMID:24508628
    reference_title: "Asymptomatic phosphomannose isomerase deficiency (MPI-CDG) initially mistaken for excessive alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probing for the underlying enzyme defect(s) using cultured skin fibroblasts demonstrated normal activity of phosphomannomutase, whereas the activity of phosphomannose isomerase (MPI) was reduced (0.64 mU/mg protein, reference 2.1-6.9), pointing to CDG of the MPI subtype (formerly called CDG-Ib).
    explanation: >-
      Demonstrates how the two are separated enzymatically.
- name: Chronic excessive alcohol consumption
  description: >-
    Elevated carbohydrate-deficient transferrin is a routine biomarker of heavy
    drinking, and asymptomatic MPI-CDG adults have been misdiagnosed as alcohol
    abusers on the basis of a markedly raised CDT. A negative
    phosphatidylethanol and the type-1 glycoform pattern point instead to CDG.
  evidence:
  - reference: PMID:24508628
    reference_title: "Asymptomatic phosphomannose isomerase deficiency (MPI-CDG) initially mistaken for excessive alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If asymptomatic MPI-CDG subjects undergo CDT screening, their highly elevated test results may be wrongly interpreted as caused by excessive alcohol consumption.
    explanation: >-
      Documents the specific diagnostic pitfall.
- name: Other causes of protein-losing enteropathy
  description: >-
    Protein-losing enteropathy has many causes - gastrointestinal infection,
    severe coeliac disease, inflammatory bowel disease, other metabolic
    disorders including ALG6-CDG, and intestinal lymphangiectasia in Noonan and
    Turner syndromes. One MPI-CDG patient was managed as Crohn disease for 13
    years before mannose produced prompt improvement.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MPI-CDG should be included in the differential diagnosis of patients with a PLE.
    explanation: >-
      Consensus statement positioning MPI-CDG within the protein-losing
      enteropathy differential.
- name: Congenital hepatic fibrosis in autosomal recessive polycystic kidney disease
  description: >-
    The ductal plate malformation of MPI-CDG closely resembles the hepatic
    lesion of congenital hepatic fibrosis in ARPKD, which is a key
    histopathological differential on liver biopsy.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bile duct involvement in MPI-CDG with ductal plate malformation is very similar to those observed in Congenital Hepatic Fibrosis in Autosomal Recessive Polycystic Kidney Disease.
    explanation: >-
      Names the histopathological mimic.
- name: Liver-predominant congenital disorders of glycosylation
  description: >-
    TMEM199-CDG, CCDC115-CDG and ATP6AP1-CDG also present with liver disease as
    the predominant symptom and belong in the differential of an abnormal
    transferrin pattern with hepatopathy.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      including other CDGs, especially those where the liver involvement is present as a predominant symptom (TMEM199-CDG, CCDC115-CDG, and ATP6AP1-CDG).
    explanation: >-
      Names the liver-predominant CDG differentials.
animal_models:
- species: Mus musculus
  genotype: Mpi null (Mpi-/-) and Mpi hypomorphic alleles
  description: >-
    Germline ablation of mouse Mpi causes mannose-6-phosphate accumulation,
    inhibition of glycolytic enzymes, ATP depletion and embryonic lethality
    around E11.5, with growth retardation, placental hyperplasia and failed yolk
    sac vasculogenesis; mannose supplementation hastens rather than rescues
    embryonic death, so a faithful murine CDG-Ib model requires hypomorphic
    alleles. Hypomorphic mice with patient-range residual activity are largely
    normal apart from about 15% embryonic lethality, but antenatal mannose
    reduces litter size and survival to weaning and causes eye defects in about
    half of survivors. The model therefore establishes the mannose-toxicity
    mechanism but does not reproduce the human hepatic-intestinal disease.
  genes:
  - preferred_term: MPI
    term:
      id: hgnc:7216
      label: MPI
  associated_phenotypes:
  - Embryonic lethality
  - Blindness
  evidence:
  - reference: PMID:16339137
    reference_title: "Ablation of mouse phosphomannose isomerase (Mpi) causes mannose 6-phosphate accumulation, toxicity, and embryonic lethality."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because Mpi ablation is embryonic lethal, a murine CDG-Ib model will require hypomorphic Mpi alleles.
    explanation: >-
      States the limitation of the null model for modelling the human disorder.
  - reference: PMID:24421398
    reference_title: "Mannose supplements induce embryonic lethality and blindness in phosphomannose isomerase hypomorphic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated viable Mpi hypomorphic mice with residual enzymatic activity comparable to that of patients, but surprisingly, these mice appeared completely normal except for modest (~15%) embryonic lethality.
    explanation: >-
      Establishes that patient-equivalent residual activity does not reproduce
      human disease in the mouse.
  - reference: PMID:24421398
    reference_title: "Mannose supplements induce embryonic lethality and blindness in phosphomannose isomerase hypomorphic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, mannose further reduced litter size and survival to weaning by 40 and 66%, respectively. Moreover, ~50% of survivors developed eye defects beginning around midgestation.
    explanation: >-
      Documents the antenatal mannose toxicity that motivates caution in
      pregnancy.
- species: Danio rerio
  genotype: mpi morpholino knockdown (morphant, ~13% residual Mpi activity)
  description: >-
    Morpholino knockdown of zebrafish mpi to 13% residual activity - within the
    range measured in MPI-CDG patient fibroblasts - reduces lipid-linked
    oligosaccharide and N-glycan levels and produces embryonic lethality and
    multisystem abnormalities including a small liver, pericardial oedema and
    small eyes. The phenotype is rescued by mannose, but only when supplied
    before 24 hours post-fertilisation, defining a developmental window for
    correction. Transient knockdown and embryonic phenotypes do not reproduce
    chronic human portal-hypertensive disease.
  genes:
  - preferred_term: MPI
    term:
      id: hgnc:7216
      label: MPI
  associated_phenotypes:
  - Embryonic lethality
  - Small liver
  - Pericardial edema
  evidence:
  - reference: PMID:22899857
    reference_title: "A zebrafish model of congenital disorders of glycosylation with phosphomannose isomerase deficiency reveals an early opportunity for corrective mannose supplementation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, these phenotypes could be rescued with mannose supplementation. Thus, parallel processes in fish and humans contribute to the phenotypes caused by Mpi depletion. Interestingly, mannose was only effective if provided prior to 24 hpf.
    explanation: >-
      Establishes both the mannose responsiveness and the early developmental
      window of the model.
  - reference: PMID:22899857
    reference_title: "A zebrafish model of congenital disorders of glycosylation with phosphomannose isomerase deficiency reveals an early opportunity for corrective mannose supplementation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We used a morpholino to block mpi mRNA translation and established a concentration that consistently yielded 13% residual Mpi enzyme activity at 4 days post-fertilization (dpf), which is within the range of MPI activity detected in fibroblasts from MPI-CDG patients.
    explanation: >-
      Documents that the knockdown was calibrated to patient-equivalent residual
      enzyme activity.
discussions:
- discussion_id: mpi_cdg_hyperinsulinism_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does hyperinsulinaemic hypoglycaemia occur in MPI-CDG, and which
    hypoglycosylated beta-cell protein is responsible?
  attaches_to:
  - pathophysiology#Hyperinsulinaemic Hypoglycaemia
  rationale: >-
    Hyperinsulinism accounts for more than two-thirds of hypoglycaemia in
    MPI-CDG and also occurs in PGM1-CDG and PMM2-CDG, suggesting a shared
    glycosylation-dependent mechanism, but the consensus guideline states the
    cause is unknown. Hypoglycosylation of the sulfonylurea receptor SUR1 is
    proposed and altered insulin secretion has been shown in hypoglycosylated
    murine beta cells, but neither has been demonstrated in human MPI-CDG
    islets. Resolving this would clarify why mannose corrects the hypoglycaemia
    and whether beta-cell-directed therapy is ever needed beyond diazoxide.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the exact cause of HH in CDG patients is still unknown.
    explanation: >-
      The consensus panel states the mechanism is unresolved.
- discussion_id: mpi_cdg_mannose_pregnancy_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the mannose-toxicity findings in Mpi mice - accelerated embryonic death
    in nulls and ocular defects with blindness in hypomorphs - predict any risk
    of oral or antenatal mannose therapy in human MPI-CDG?
  attaches_to:
  - pathophysiology#Mannose-6-Phosphate Accumulation and Energy Failure on Excess Mannose
  rationale: >-
    The direction of the mannose effect is species- and route-discordant.
    Complete Mpi ablation in mice is embryonic lethal and mannose hastens
    embryonic death; Mpi hypomorphic mice develop blindness on antenatal
    mannose. Yet in zebrafish mannose rescues the phenotype when given early,
    and in humans oral mannose is well tolerated and clearly beneficial, with
    normal pregnancies reported in treated women; human toxicity has been seen
    only with the intravenous route. Whether the murine antenatal toxicity has
    any human counterpart is unresolved and directly gates the guideline's
    cautious stance on mannose in pregnancy.
  evidence:
  - reference: PMID:24421398
    reference_title: "Mannose supplements induce embryonic lethality and blindness in phosphomannose isomerase hypomorphic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is unknown whether mannose is harmful to human fetuses during gestation; however, mothers who are at risk for having MPI-CDG children and who consume mannose during pregnancy hoping to benefit an affected fetus in utero should be cautious.
    explanation: >-
      The authors themselves flag the translational uncertainty, which is
      exactly the mismatch recorded here.

    reference_title: "Long term outcome of MPI-CDG patients on D-mannose therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Poor compliance with D-mannose was correlated with recurrence of diarrhea, thrombosis, and abnormal biological parameters including coagulation factors and transferrin profiles.
    explanation: >-

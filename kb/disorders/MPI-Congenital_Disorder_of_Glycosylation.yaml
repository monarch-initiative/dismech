- name: Multisystem Glycoprotein Dysfunction with Neurologic Sparing
  biological_scale: ORGANISM
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  role: consequence
  description: >-
    The convergent multisystem outflow of hypoglycosylation in MPI-CDG is
    hepatic, gastrointestinal, endocrine, coagulation and immune, but - unlike
    almost every other CDG - not neurologic. Cognitive development and brain
    imaging are typically normal, cerebellar hypoplasia is absent, and the
    dysmorphic, fat-pad, inverted-nipple and skeletal features of PMM2-CDG do not
    occur. A proposed explanation is that circulating maternal and dietary
    mannose partially rescues glycosylation in developing cerebral tissue,
    consistent with the zebrafish finding that mannose rescue is effective only
    within an early developmental window.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: ABNORMAL
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast with PMM2-CDG, facial dysmorphia, atypical fat pads, inverted nipples, and skeletal deformities are not present in MPI-CDG patients.
    explanation: >-
      Documents the absence of the classic CDG dysmorphic pattern in MPI-CDG.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no cerebellar hypoplasia was noted, as it is typical in other CDG.
    explanation: >-
      Neuroimaging in reported patients shows the absence of the cerebellar
      hypoplasia characteristic of other CDG subtypes.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The exogenous mannose pathway is also a possible explanation for the absence of developmental impairment in MPI-CDG as circulating maternal mannose reduces the prenatal glycosylation defect in cerebral tissues.
    explanation: >-
      The maternal-mannose rescue account of neurologic sparing is presented by
      the consensus panel as a hypothesis, hence PARTIAL support.
- name: Mannose-6-Phosphate Accumulation and Energy Failure on Excess Mannose
  biological_scale: MOLECULAR
  description: >-
    An iatrogenic mechanism specific to MPI deficiency: because
    mannose-6-phosphate cannot be isomerised back to fructose-6-phosphate, an
    excessive mannose load (notably intravenous mannose) allows intracellular
    mannose-6-phosphate to accumulate. Mannose-6-phosphate inhibits hexokinase,
    phosphoglucose isomerase and glucose-6-phosphate dehydrogenase, suppressing
    glycolysis and depleting ATP - the "honeybee effect". This underlies
    reported seizures and stupor during intravenous mannose therapy and the
    paradoxical worsening of Mpi-null mouse embryos given mannose, and is the
    reason intravenous mannose is not recommended for stable patients.
  chemical_entities:
  - preferred_term: D-mannose 6-phosphate
    modifier: INCREASED
    term:
      id: CHEBI:17369
      label: D-mannose 6-phosphate
  evidence:
  - reference: PMID:16339137
    reference_title: "Ablation of mouse phosphomannose isomerase (Mpi) causes mannose 6-phosphate accumulation, toxicity, and embryonic lethality."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results in vitro suggest that mannose toxicity in Mpi(-/-) embryos is caused by Man-6-P accumulation, which inhibits glucose metabolism and depletes intracellular ATP.
    explanation: >-
      The Mpi-null mouse establishes the mechanism of mannose-6-phosphate
      toxicity. Model-organism evidence; the human counterpart is the
      intravenous-mannose case report below.
  - reference: PMID:16339137
    reference_title: "Ablation of mouse phosphomannose isomerase (Mpi) causes mannose 6-phosphate accumulation, toxicity, and embryonic lethality."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell lysates, Man-6-P inhibited hexokinase (70%), phosphoglucose isomerase (65%), and glucose-6-phosphate dehydrogenase (85%), but not phosphofructokinase.
    explanation: >-
      Biochemical assays identify the specific glycolytic enzymes inhibited by
      mannose-6-phosphate.
  - reference: PMID:21240668
    reference_title: "Seizures and stupor during intravenous mannose therapy in a patient with CDG syndrome type 1b (MPI-CDG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We caution that, in patients with MPI-CDG, life-threatening central nervous system disturbances may occur with intravenous mannose treatment.
    explanation: >-
      Human clinical confirmation that intravenous mannose can cause severe
      neurological deterioration in MPI-CDG.

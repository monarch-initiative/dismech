name: MPI-congenital disorder of glycosylation
creation_date: "2026-08-01T00:00:00Z"
description: >-
  MPI-congenital disorder of glycosylation (MPI-CDG, formerly CDG-Ib) is an
  ultra-rare autosomal recessive congenital disorder of N-linked glycosylation
  caused by biallelic pathogenic variants in MPI, encoding phosphomannose
  (mannose-6-phosphate) isomerase. Loss of MPI blocks the endogenous conversion
  of fructose-6-phosphate to mannose-6-phosphate, depleting GDP-mannose for
  lipid-linked oligosaccharide assembly and producing a CDG type I
  hypoglycosylation pattern. MPI-CDG is the outlier of the CDG family in two
  respects: the phenotype is dominantly hepatic-intestinal and endocrine
  (protein-losing enteropathy, congenital hepatic fibrosis with ductal plate
  malformation, hyperinsulinaemic hypoglycaemia, mixed coagulopathy) with
  sparing of cognitive development, and the enzymatic block can be bypassed
  therapeutically by oral D-mannose, making it one of the few treatable CDGs.
  Liver disease is the notable mannose-refractory arm.
category: Mendelian
parents:
- hereditary disease
synonyms:
- MPI-CDG
- CDG-Ib
- CDG1B
- congenital disorder of glycosylation type Ib
- carbohydrate deficient glycoprotein syndrome type Ib
- phosphomannose isomerase deficiency
- mannose phosphate isomerase deficiency
disease_term:
  preferred_term: MPI-congenital disorder of glycosylation
  term:
    id: MONDO:0011257
    label: MPI-congenital disorder of glycosylation
notes: >-
  GeneReviews baseline: no dedicated GeneReviews chapter exists for MPI-CDG
  (PubMed searches for "MPI-CDG", "phosphomannose isomerase" and "CDG-Ib"
  combined with GeneReviews return no hits); the only related chapter,
  "Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview"
  (PMID:20301507), is a retired archival overview whose abstract carries no
  MPI-specific clinical content. The 2020 international consensus guideline
  (PMID:32266963), which systematically reviewed all 35 then-published patients
  organ system by organ system, and the 2023 literature review of 52 patients
  (PMID:37124179) are used here as the equivalent expert-curated phenotype
  baseline. Frequency bands are taken from the 2023 review's explicit
  numerators/denominators where available; those denominators vary by feature
  because not every feature was assessed in every published patient, and both
  cohorts are subject to publication and ascertainment bias.

  Dataset coverage (searched 2026-08-20): no relevant public dataset was found,
  and none was added. `just discover-datasets` returned only GENE_ONLY matches
  driven by the gene symbol - a Burkitt lymphoma methylation series, an
  iPSC-neuron miR-132 screen, and a hepatic-stellate-cell series whose "MPI MT"
  label belongs to an unrelated zebrafish/human liver fibrogenesis study.
  Direct GEO DataSets searches for "MPI-CDG" and "MPI deficiency glycosylation"
  both return zero series, and "mannose phosphate isomerase deficiency" returns
  only a Bacillus subtilis phosphosugar-stress series. Adding any of these
  would be Named Entity Confusion reached through dataset search, so the
  datasets block is deliberately left empty rather than filled.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    MPI-CDG is inherited in an autosomal recessive manner. Both homozygous
    (frequently but not exclusively consanguineous) and compound heterozygous
    genotypes are reported.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MPI-CDG has autosomal recessive inheritance, but surprisingly high percentage of homozygotes was present (13 out of 28 patients with known genotype).
    explanation: >-
      The consensus review of all published patients states the mode of
      inheritance and the genotype distribution directly.
  - reference: PMID:24508628
    reference_title: "Asymptomatic phosphomannose isomerase deficiency (MPI-CDG) initially mistaken for excessive alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents, being distant relatives, were heterozygous mutation carriers with normal CDT values.
    explanation: >-
      Heterozygous, biochemically normal parents of a homozygous proband
      demonstrate recessive segregation.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    The 2020 international consensus guideline systematically reviewed the
    entire published literature and identified 35 patients from 30 families; no
    population prevalence estimate is available.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MPI-CDG is a rare autosomal recessive disorder with only 35 patients described so far. The prevalence is not known.
    explanation: >-
      Directly states the total number of reported cases and the absence of a
      prevalence estimate.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    An expanded 2023 literature review raised the cumulative published total to
    52 patients from 17 countries, confirming panethnic distribution rather than
    restriction to the Saguenay-Lac-Saint-Jean founder population in which the
    earliest cluster was described.
  evidence:
  - reference: PMID:37124179
    reference_title: "Mannose phosphate isomerase gene mutation leads to a congenital disorder of glycosylation: A rare case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Including the present case, a total of 52 patients from hospitals across 17 countries were diagnosed with MPI-CDG.
    explanation: >-
      Gives the updated cumulative case count and geographic spread.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is panethnic, 14 patients originated from Europe
    explanation: >-
      The consensus cohort description establishes panethnic distribution.
progression:
- phase: Infantile-onset hepatic-intestinal and endocrine presentation
  age_range: birth to 15 years, with onset before age 2 in most patients
  notes: >-
    Symptoms begin in infancy in the large majority of patients, most often as
    diarrhoea and vomiting with hepatomegaly, hypoglycaemia and coagulopathy.
    The gastrointestinal and hypoglycaemic course is episodic, with infection,
    fasting or dehydration precipitating exacerbations. Diagnostic delay is
    substantial (median 2.15 years, range 0-30 years).
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of disease symptoms was in infancy in large majority of patients (93%) with the average age of onset being at 1.2 years
    explanation: >-
      Establishes infantile onset in the pooled published cohort.
  - reference: PMID:37124179
    reference_title: "Mannose phosphate isomerase gene mutation leads to a congenital disorder of glycosylation: A rare case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age at disease onset ranged from birth to 15 years, with an onset under 2 years in most patients (43/50).
    explanation: >-
      Quantifies onset age across the expanded 52-patient literature review.
- phase: Untreated course and mortality
  notes: >-
    Untreated disease carries substantial early mortality, concentrated in
    infancy and early childhood, with hepatic failure and sepsis among the
    identified causes. Most reported deaths predate recognition of the disorder
    and availability of mannose.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mortality rate was 23.5%, and all the eight patients died in their infancy and early childhood (at the age from 4 months to 5 years, median age 2.2 years).
    explanation: >-
      Quantifies mortality in the pooled published cohort.
- phase: Treated long-term course with residual hepatic and vascular risk
  notes: >-
    On D-mannose the digestive, hypoglycaemic and coagulation manifestations
    remit, but liver fibrosis persists and portal hypertension, venous
    thrombosis and impaired renal function can still emerge in adolescence and
    adulthood. Lifelong treatment and surveillance are required.
  evidence:
  - reference: PMID:37124179
    reference_title: "Mannose phosphate isomerase gene mutation leads to a congenital disorder of glycosylation: A rare case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients (26/30) showed clinical symptoms, and laboratory results improved after oral mannose administration.
    explanation: >-
      Quantifies treatment response across the reviewed literature.
  - reference: PMID:33098580
    reference_title: "Long term outcome of MPI-CDG patients on D-mannose therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On treatment, two patients developed severe portal hypertension, two developed venous thrombosis, and 1 displayed altered kidney function.
    explanation: >-
      The longest published follow-up series documents the residual long-term
      complications despite D-mannose therapy.
pathophysiology:
- name: Phosphomannose Isomerase Deficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic loss-of-function or hypomorphic variants in MPI reduce the
    activity of phosphomannose (mannose-6-phosphate) isomerase, the mainly
    cytosolic enzyme that interconverts fructose-6-phosphate and
    mannose-6-phosphate. Residual enzyme activity in patient leukocytes and
    fibroblasts is typically below 10% of normal. Because fructose-6-phosphate
    is a glycolytic intermediate, the block itself does not cause accumulation
    of a toxic upstream substrate; the lesion is one of insufficient
    mannose-6-phosphate supply.
  genes:
  - preferred_term: MPI
    term:
      id: hgnc:7216
      label: MPI
  molecular_functions:
  - preferred_term: mannose-6-phosphate isomerase activity
    modifier: DECREASED
    term:
      id: GO:0004476
      label: mannose-6-phosphate isomerase activity
  biological_processes:
  - preferred_term: mannose metabolic process
    modifier: DECREASED
    term:
      id: GO:0006013
      label: mannose metabolic process
  chemical_entities:
  - preferred_term: D-mannose 6-phosphate
    modifier: DECREASED
    term:
      id: CHEBI:17369
      label: D-mannose 6-phosphate
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MPI is mainly a cytosolic enzyme (but it can be also localised in the plasma membrane) which catalyses the first step of biosynthesis of nucleotide sugar mannose-GDP, that is, interconversion of fructose-6-phosphate to mannose-6-phosphate (Figure 1A).
    explanation: >-
      The consensus guideline states the enzymatic reaction catalysed by MPI.
      Evidence source is OTHER because this is the review's biochemical
      background synthesis rather than a primary patient observation.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In described MPI-CDG patients, enzyme activities were usually very deficient with activities less than 10% of normal values in both leukocytes and fibroblasts.
    explanation: >-
      Quantifies the residual enzyme activity measured in patients.
  - reference: PMID:9525984
    reference_title: "Carbohydrate-deficient glycoprotein syndrome type Ib. Phosphomannose isomerase deficiency and mannose therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphomannose isomerase (PMI) deficiency is the cause of a new type of carbohydrate-deficient glycoprotein syndrome (CDGS). The disorder is caused by mutations in the PMI1 gene.
    explanation: >-
      The founding report establishing PMI deficiency and MPI mutations as the
      cause of the disorder.
  downstream:
  - target: GDP-Mannose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
    description: >-
      Reduced mannose-6-phosphate supply limits the downstream nucleotide-sugar
      pool required to build the dolichol-linked oligosaccharide precursor.
    causal_link_type: DIRECT
- name: GDP-Mannose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  description: >-
    Mannose-6-phosphate is the committed precursor of GDP-mannose, the mannosyl
    donor for assembly of the dolichol-linked (lipid-linked) oligosaccharide in
    the endoplasmic reticulum. In MPI deficiency the endogenous route to
    mannose-6-phosphate fails and dietary mannose is insufficient to compensate
    under ordinary conditions, so lipid-linked oligosaccharide synthesis is
    curtailed and incomplete precursors are transferred to nascent protein -
    the canonical CDG type I lesion. Plasma mannose is under 10 micromol/L in
    patients versus 50-100 micromol/L in healthy individuals. This is the step
    at which exogenous D-mannose therapy re-enters the pathway.
  biological_processes:
  - preferred_term: GDP-mannose biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0009298
      label: GDP-mannose biosynthetic process
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  chemical_entities:
  - preferred_term: GDP-mannose
    modifier: DECREASED
    term:
      id: CHEBI:21168
      label: GDP-mannose
  evidence:
  - reference: PMID:22899857
    reference_title: "A zebrafish model of congenital disorders of glycosylation with phosphomannose isomerase deficiency reveals an early opportunity for corrective mannose supplementation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Synthesis of the lipid-linked oligosaccharide (LLO), which serves as the sugar donor for the N-glycosylation of secretory proteins, requires conversion of fructose-6-phosphate to mannose-6-phosphate via the phosphomannose isomerase (MPI) enzyme.
    explanation: >-
      Places the MPI reaction directly upstream of lipid-linked oligosaccharide
      synthesis. Evidence source is OTHER because this sentence is the paper's
      background statement of the pathway rather than a result from its
      zebrafish experiments.
  - reference: PMID:22899857
    reference_title: "A zebrafish model of congenital disorders of glycosylation with phosphomannose isomerase deficiency reveals an early opportunity for corrective mannose supplementation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fluorophore-assisted carbohydrate electrophoresis detected decreased LLO and N-glycans in mpi morphants.
    explanation: >-
      A zebrafish MPI-knockdown model with patient-range residual activity
      directly demonstrates reduced lipid-linked oligosaccharide and N-glycan
      pools. Model-organism evidence, complementing the human biochemistry.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the enzymatic block can be therapeutically bypassed by dietary mannose supplementation
    explanation: >-
      Establishes that this node is the pharmacologically bypassable step, the
      basis of D-mannose therapy.
  downstream:
  - target: Protein Hypoglycosylation
    description: >-
      Incomplete lipid-linked oligosaccharide precursors are transferred to
      nascent glycoproteins, producing systemic hypoglycosylation.
    causal_link_type: DIRECT
- name: Protein Hypoglycosylation
  biological_scale: CELLULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  role: central_effector
  description: >-
    Many secreted and membrane glycoproteins carry absent or truncated N-glycans.
    The readout is the classic CDG type I serum transferrin pattern - reduced
    tetrasialotransferrin with increased disialo- and asialotransferrin - which
    is 100% sensitive but biochemically indistinguishable from PMM2-CDG and other
    type I disorders. Because glycosylation modifies a large fraction of the
    secreted proteome, this single lesion degrades many unrelated proteins at
    once, and the specific organ pattern of MPI-CDG reflects which client
    glycoproteins are rate-limiting rather than any tissue-restricted expression
    of MPI.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MPI-CDG can be biochemically characterised by a decreased level of the major tetrasialylated transferrin (Trf) glycoform (tetrasialotransferrin) and an increase of disialotransferrin and asialotransferrin, that is, CDG type I pattern.
    explanation: >-
      Documents systemic protein hypoglycosylation via the transferrin readout.
  - reference: PMID:10980531
    reference_title: "Genomic organization of the human phosphomannose isomerase (MPI) gene and mutation analysis in patients with congenital disorders of glycosylation type Ib (CDG-Ib)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The symptoms result from hypoglycosylation of serum- and other glycoproteins.
    explanation: >-
      States explicitly that the clinical phenotype is downstream of
      glycoprotein hypoglycosylation.
  downstream:
  - target: Enterocyte Glycoprotein Deficit and Protein-Losing Enteropathy
    description: >-
      Hypoglycosylation of enterocyte surface glycoproteins is the proposed
      mechanism of intestinal barrier failure and enteric protein loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of intestinal epithelial barrier integrity
    - intestinal lymphangiectasia
  - target: Hypoglycosylation of Coagulation Factors and Inhibitors
    description: >-
      Antithrombin, protein C, protein S and factor XI are N-glycoproteins whose
      plasma levels fall when glycosylation is impaired.
    causal_link_type: DIRECT
  - target: Hyperinsulinaemic Hypoglycaemia
    description: >-
      Hypoglycosylation is proposed to alter beta-cell insulin secretion,
      although the precise mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatic Ductal Plate Malformation and Progressive Fibrosis
    description: >-
      Prenatal and early hypoglycosylation is associated with a developmental
      biliary lesion and progressive fibrosis that, unlike the other arms, does
      not reverse with mannose.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Multisystem Glycoprotein Dysfunction with Neurologic Sparing
    description: >-
      The convergent multisystem outflow of proteome-wide hypoglycosylation,
      distinguished in MPI-CDG by the near-absence of neurologic involvement.
    causal_link_type: DIRECT
- name: Enterocyte Glycoprotein Deficit and Protein-Losing Enteropathy
  biological_scale: TISSUE
  description: >-
    Loss of intestinal wall integrity, attributed to reduced glycoproteins on the
    enterocyte membrane and/or intestinal lymphangiectasia, produces
    protein-losing enteropathy with hypoalbuminaemia, oedema, diarrhoea and
    secondary hypogammaglobulinaemia. Duodenal biopsy may show mild villous
    atrophy and lymphangiectasia, and both the clinical syndrome and the
    histology normalise on mannose.
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diarrhoea is most commonly due to PLE with resulting hypoalbuminaemia.
    explanation: >-
      Places protein-losing enteropathy causally upstream of the diarrhoea and
      hypoalbuminaemia. Evidence source is OTHER because this is the consensus
      panel's mechanistic interpretation of the pooled case literature.
  - reference: PMID:9525984
    reference_title: "Carbohydrate-deficient glycoprotein syndrome type Ib. Phosphomannose isomerase deficiency and mannose therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical phenotype is characterized by protein-losing enteropathy, while neurological manifestations prevailing in other types of CDGS are absent.
    explanation: >-
      The founding report identifies protein-losing enteropathy as the defining
      clinical consequence.
- name: Hypoglycosylation of Coagulation Factors and Inhibitors
  biological_scale: MOLECULAR
  description: >-
    Antithrombin, protein C, protein S and factor XI are all N-glycosylated
    plasma proteins, and their functional levels fall in MPI-CDG. The result is a
    mixed coagulopathy affecting both procoagulant and anticoagulant arms, so the
    same patient may thrombose and bleed. Antithrombin deficiency dominates, and
    the deficits are exacerbated by intercurrent protein-losing enteropathy
    episodes, dehydration and infection.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: ABNORMAL
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coagulopathy with typical pattern affecting both procoagulant and anticoagulant factors is reported in almost all patients, with mainly antithrombin (AT) deficiency.
    explanation: >-
      Establishes the near-universal mixed coagulopathy and its dominant
      antithrombin component.
  - reference: PMID:30545931
    reference_title: "MPI-CDG with transient hypoglycosylation and antithrombin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital disorders of glycosylation (CDG), a rare disease, are actually usually associated with antithrombin deficiency.
    explanation: >-
      Links the glycosylation defect to antithrombin deficiency as the
      characteristic coagulation lesion of CDG, the molecular basis for this
      node.
  downstream:
  - target: Thrombotic and Haemorrhagic Complications
    description: >-
      The imbalance of procoagulant and anticoagulant glycoproteins destabilises
      haemostasis in both directions.
    causal_link_type: DIRECT
- name: Thrombotic and Haemorrhagic Complications
  biological_scale: ORGANISM
  description: >-
    Thrombosis typically complicates intercurrent infection or dehydration and is
    most often deep venous thrombosis of the lower limbs, but cerebral venous
    sinus thrombosis, pulmonary embolism and intracardiac thrombus are reported
    and may be the presenting event. Bleeding is less frequent but can be
    life-threatening, chiefly diffuse intestinal bleeding or variceal
    haemorrhage.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombotic events often complicate acute infections and dehydration episodes. These are mainly deep vein thromboses of the lower extremities.
    explanation: >-
      Describes the triggers and typical site of thrombosis in the pooled
      cohort.
  - reference: PMID:32905087
    reference_title: "Mannose phosphate isomerase deficiency-congenital disorder of glycosylation (MPI-CDG) with cerebral venous sinus thrombosis as first and only presenting symptom: A rare but treatable cause of thrombophilia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we present the first MPI-CDG patient with severe cerebral venous sinus thrombosis as first and only symptom of disease manifestation.
    explanation: >-
      Demonstrates that the thrombotic arm alone can constitute the entire
      clinical presentation.
- name: Hyperinsulinaemic Hypoglycaemia
  biological_scale: ORGANISM
  description: >-
    Hypoglycaemia affects most patients and is most often hyperinsulinaemic. The
    mechanism is unresolved; hypoglycosylation of beta-cell membrane proteins
    such as the sulfonylurea receptor SUR1 has been proposed, supported by
    altered insulin secretion in hypoglycosylated murine beta cells. A minority
    of patients are hypoglycaemic without hyperinsulinism. Hypoglycaemia responds
    to mannose in both groups.
  cell_types:
  - preferred_term: Pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: positive regulation of insulin secretion
    modifier: ABNORMAL
    term:
      id: GO:0032024
      label: positive regulation of insulin secretion
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common cause of hypoglycaemia in these patients was hyperinsulinism (HH), which is present in more than two-third of hypoglycaemic patients.
    explanation: >-
      Establishes hyperinsulinism as the predominant hypoglycaemia mechanism.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, the exact cause of HH in CDG patients is still unknown.
    explanation: >-
      Explicitly flags the mechanism of hyperinsulinism as unresolved, so this
      node's proposed beta-cell mechanism is only partially supported.
- name: Hepatic Ductal Plate Malformation and Progressive Fibrosis
  biological_scale: TISSUE
  description: >-
    Essentially all patients have some degree of liver involvement. The
    characteristic lesion is a developmental one - an excess of dilated bile duct
    structures in a ductal plate configuration, mimicking congenital hepatic
    fibrosis, together with hepatomegaly, fibrosis and sometimes steatosis.
    Because it is a congenital/developmental abnormality rather than an ongoing
    glycosylation-dependent process, it does not reverse with mannose and can
    progress to portal hypertension, oesophageal varices and hepatopulmonary
    syndrome. This mannose-refractory arm is the principal determinant of
    long-term morbidity.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the most characteristic lesion mimics those seen in congenital hepatic fibrosis, with an excess of dilated bile duct structures in ductal plate configuration in the portal tracts
    explanation: >-
      Identifies the characteristic hepatic histopathology.

- name: CDG type I transferrin pattern
  presence: ABNORMAL
  context: >-
    Serum or plasma transferrin isoelectric focusing (or HPLC/capillary
    electrophoresis quantifying carbohydrate-deficient transferrin) shows reduced
    tetrasialotransferrin with increased disialo- and asialotransferrin. This is
    the first-line screen but cannot distinguish MPI-CDG from PMM2-CDG or other
    type I disorders.
  biomarker_term:

    the second-line confirmatory test, typically showing under 10% of normal
    activity; obligate carriers show intermediate values of 30-83% (median 50%).
  readouts:
  - target: Phosphomannose Isomerase Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Directly measures the deficient enzyme defining the disorder.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In described MPI-CDG patients, enzyme activities were usually very deficient with activities less than 10% of normal values in both leukocytes and fibroblasts.
    explanation: >-
      Quantifies the diagnostic enzyme deficit.
  - reference: PMID:24508628
    reference_title: "Asymptomatic phosphomannose isomerase deficiency (MPI-CDG) initially mistaken for excessive alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probing for the underlying enzyme defect(s) using cultured skin fibroblasts demonstrated normal activity of phosphomannomutase, whereas the activity of phosphomannose isomerase (MPI) was reduced (0.64 mU/mg protein, reference 2.1-6.9), pointing to CDG of the MPI subtype (formerly called CDG-Ib).
    explanation: >-
      Worked example of the fibroblast enzyme assay discriminating MPI-CDG from
      PMM2-CDG.

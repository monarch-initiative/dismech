      therapy.
  notes: >-
    Intravenous mannose is NOT recommended for stable patients and must be
    reserved for life-threatening situations in which oral intake is impossible,
    because mannose-6-phosphate accumulation can precipitate seizures, stupor
    and haemolysis. Caution is advised with mannose (and mannose-containing
    antibiotics) in pregnancy, since mannose accelerated embryonic death in
    Mpi-null mice and caused blindness in Mpi hypomorphic mice. Monitoring on
    oral therapy: unconjugated bilirubin, blood count, HbA1c and mannose levels
    every three months, targeting mannose above 20 micromol/L before a dose and
    above 100 micromol/L one hour after.

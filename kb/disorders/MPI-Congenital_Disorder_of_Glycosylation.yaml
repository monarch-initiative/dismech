treatments:
- name: Oral D-mannose supplementation
  description: >-
    Oral D-mannose is the disease-specific therapy and the reason MPI-CDG is one
    of the few treatable CDGs. Exogenous mannose is phosphorylated by hexokinase
    to mannose-6-phosphate, entering the N-glycosylation pathway downstream of
    the MPI block. The recommended dose is 150-170 mg/kg per dose, four to five
    times daily, started as soon as the diagnosis is made and continued lifelong.
    It corrects the digestive symptoms, hypoglycaemia and coagulopathy, but it
    does not treat the hepatic disease. Clinical response usually begins within a
    week while biochemical abnormalities take months to stabilise. Abdominal pain
    and diarrhoea are the main side effects. Poor compliance is associated with
    relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: D-mannose
      term:
        id: CHEBI:16024
        label: D-mannose
  target_mechanisms:
  - target: GDP-Mannose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
    treatment_effect: BYPASSES
    description: >-
      Dietary mannose is converted to mannose-6-phosphate by hexokinase,
      re-supplying the GDP-mannose pool without requiring MPI activity.
    evidence:
    - reference: PMID:21240668
      reference_title: "Seizures and stupor during intravenous mannose therapy in a patient with CDG syndrome type 1b (MPI-CDG)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dietary supplementation of mannose can reverse clinical symptoms by entering the N-glycosylation pathway downstream of MPI.
      explanation: >-
        States the bypass mechanism explicitly.
    - reference: PMID:22899857
      reference_title: "A zebrafish model of congenital disorders of glycosylation with phosphomannose isomerase deficiency reveals an early opportunity for corrective mannose supplementation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        MPI-CDG patients can be treated with oral mannose supplements, which is converted to mannose-6-phosphate through a minor complementary metabolic pathway, restoring protein glycosylation and ameliorating most symptoms, although liver disease continues to progress.
      explanation: >-
        Names the complementary metabolic pathway that bypasses the block and
        notes its hepatic limitation. Evidence source is OTHER because this is
        the paper's background statement about human patients.

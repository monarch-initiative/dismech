      deficiency.
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MPI-CDG can be biochemically characterised by a decreased level of the major tetrasialylated transferrin (Trf) glycoform (tetrasialotransferrin) and an increase of disialotransferrin and asialotransferrin, that is, CDG type I pattern.
    explanation: >-
      Defines the biochemical signature.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CDT% in MPI-CDG patients rises above 6% but often up to 40% to 50% of asialo-/and disialotransferrins.
    explanation: >-
      Quantifies the carbohydrate-deficient transferrin elevation, relevant to
      the recurring misdiagnosis as alcohol misuse.
  notes: >-
    Transferrin protein polymorphisms, untreated galactosaemia, hereditary

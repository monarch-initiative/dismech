genetic:
- name: MPI
  gene_term:
    preferred_term: MPI
    term:
      id: hgnc:7216
      label: MPI
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic pathogenic variants in MPI (15q24.1), an eight-exon gene spanning
    only 5 kb, cause MPI-CDG. Missense variants predominate, consistent with
    survival requiring residual activity. Three recurrent variants - c.656G>A
    (p.Arg219Gln), c.457G>A (p.Arg152Gln) and c.884G>A (p.Arg295His) - together
    account for roughly half of reported alleles. p.Arg219Gln, the first variant
    identified, has been found homozygous in clinically asymptomatic adults,
    indicating incomplete penetrance or the action of unknown modifiers; neither
    residual enzyme activity nor carbohydrate-deficient transferrin reliably
    predicts clinical severity.
  evidence:
  - reference: PMID:10980531
    reference_title: "Genomic organization of the human phosphomannose isomerase (MPI) gene and mutation analysis in patients with congenital disorders of glycosylation type Ib (CDG-Ib)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDG-Ib is caused by a deficiency of mannose-6-phosphate isomerase (synonym: phosphomannose isomerase, EC 5.3.1.8), due to mutations in the MPI gene.
    explanation: >-
      Establishes MPI as the disease gene.
  - reference: PMID:10980531
    reference_title: "Genomic organization of the human phosphomannose isomerase (MPI) gene and mutation analysis in patients with congenital disorders of glycosylation type Ib (CDG-Ib)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene is composed of 8 exons and spans only 5 kb.
    explanation: >-
      Defines the genomic structure that underpins routine sequencing.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common variants are c.656G > A (p. Arg219Gln), c.457G > A (p.Arg152Gln), and c.884G > A (p.Arg295His), which all together form about one half of all alleles.
    explanation: >-
      Identifies the recurrent variants and their allelic burden.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 28 published patients with known genotype, 20 different pathogenic variants were described (summarised in Table 3) with 17 missense variants, 2 frameshift-causing variants, and 1 splicing defect.
    explanation: >-
      Characterises the variant spectrum as predominantly missense.
  - reference: PMID:24508628
    reference_title: "Asymptomatic phosphomannose isomerase deficiency (MPI-CDG) initially mistaken for excessive alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was confirmed by sequence analysis of the MPI gene revealing a homozygous missense mutation (c.656G>A) causing replacement of arginine by glutamine (p.R219Q). However, the woman had never experienced any clinical manifestations associated with MPI-CDG.
    explanation: >-
      Documents clinically asymptomatic homozygosity for the commonest variant,
      the basis of the incomplete-penetrance claim.

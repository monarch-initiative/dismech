    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As the liver involvement in MPI-CDG is irreversible and progressive, the further liver damage should be prevented by vaccination against hepatotropic viruses (hepatitises A and B), avoidance of hepatotoxic drugs, and alcohol abstinence.
    explanation: >-
      Consensus "agents and circumstances to avoid" recommendation.
- name: Genetic counseling

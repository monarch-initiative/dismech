- name: Multisystem surveillance programme
  action_category: MONITORING
  description: >-
    Because the hepatic arm progresses independently of mannose and the
    coagulopathy fluctuates with intercurrent illness, the consensus guideline
    specifies scheduled surveillance rather than symptom-driven review:
    six-monthly liver chemistry (transaminases, GGT, bilirubin,
    alpha-fetoprotein, prothrombin time) plus liver ultrasound; annual
    elastography where transaminases remain elevated; annual and then at least
    three-yearly oesophageal endoscopy once portal hypertension is present, with
    echocardiography and oximetry for portopulmonary hypertension and
    hepatopulmonary syndrome; a broad annual haemostasis panel, repeated around
    infection, dehydration and any invasive procedure; albumin at a frequency
    set by the presence and severity of protein-losing enteropathy and the
    treatment response; and glucose, thyroid/IGF-axis, renal, immunoglobulin and
    nutritional review.
  treatment_term:
    preferred_term: scheduled multisystem disease surveillance
  evidence:
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To the best of our knowledge, all the patients have liver involvement even at minimal stage, so the liver tests (transaminases, GGT, bilirubin, alpha-fetoprotein, prothrombin time) and liver ultrasound (in search for liver fibrosis, steatosis, ductal plate malformations, or signs of portal hypertension) should be performed every 6 months.
    explanation: >-
      Consensus hepatic surveillance schedule, justified by the near-universal
      liver involvement.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Broad haemostatic study including fibrinogen, prothrombin time, partial thromboplastin time, factor VIII, factor IX, factor XI, AT, PC, and PS, complete blood count and differential should be performed at diagnosis and then annually.
    explanation: >-
      Consensus haemostasis surveillance schedule.
  - reference: PMID:32266963
    reference_title: "Consensus guideline for the diagnosis and management of mannose phosphate isomerase-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      oesophageal endoscopy should be performed each year at the beginning of the follow-up and thereafter depending on the endoscopic findings, but at least every 3 years.
    explanation: >-
      Consensus variceal-surveillance interval for patients with portal
      hypertension.
  notes: >-
    NCIT has no clinical-action term for scheduled disease surveillance that is
    reachable from NCIT:C25218 (Clinical Intervention or Procedure) - the
    obvious candidate, NCIT:C61256 Monitoring, is not in that subtree - so
    treatment_term carries a free-text preferred_term only, per the documented
    fallback. The MONITORING action_category makes the intent machine-queryable,
    and target_phenotypes/target_mechanisms are deliberately omitted because
    surveillance does not modify pathophysiology.
- name: Hepatoprotective avoidance measures
  description: >-
    Because the hepatic lesion is irreversible and progressive and unresponsive
    to mannose, further liver injury should be actively prevented: vaccination
    against hepatitis A and B, avoidance of hepatotoxic drugs, and abstinence
    from alcohol.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since MPI deficiency cannot be discriminated from PMM2 deficiency and other CDGs type I by TIEF and other biochemical techniques, another confirmatory method (direct enzyme assay and/or MPI gene analysis) is strongly recommended for the correct diagnosis.
    explanation: >-

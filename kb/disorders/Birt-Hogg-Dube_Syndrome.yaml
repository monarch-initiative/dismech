    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first germline missense mutation in BHD c.1978A>G (K508R) in
      a patient who presented with bilateral multifocal renal oncocytomas.
    explanation: >-
      Documents bilateral multifocal renal oncocytoma as a presenting phenotype

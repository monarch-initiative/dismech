  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Additionally, BHD patients are at risk to develop chromophobe RCC (35%),
      clear cell RCC (9%) and, less frequently, renal oncocytoma (5%) (Figure
      3).
    explanation: >-
      Places pure oncocytoma at about 5% of BHD renal tumors. That is a share
      of tumors, not of patients, so it gives no patient frequency band. It
      also shows GeneReviews' "also common" is generous for pure oncocytoma.

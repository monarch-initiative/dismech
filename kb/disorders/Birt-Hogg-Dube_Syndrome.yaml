pathophysiology:
- name: Germline FLCN First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous loss-of-function variant in FLCN at 17p11.2 is present
    constitutionally. Most alleles are protein-truncating, and a striking
    proportion are insertions or deletions within a hypermutable
    mononucleotide C(8) tract, which is why that tract is the first target of
    diagnostic sequencing. FLCN transcript is widely expressed — including in
    kidney, lung and skin, the three affected organs — so the tissue restriction
    of the phenotype is not explained by where the gene is expressed.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: FLCN
    modifier: DECREASED
    term:
      id: hgnc:27310
      label: FLCN
  genetic_context:
    gene:
      preferred_term: FLCN
      term:
        id: hgnc:27310
        label: FLCN
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    - FRAMESHIFT_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous FLCN loss of function, predominantly
      protein-truncating, with a hotspot in a hypermutable C(8) tract.
  evidence:
  - reference: PMID:12204536
    reference_title: "Mutations in a novel gene lead to kidney tumors, lung wall defects, and benign tumors of the hair follicle in patients with the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Protein-truncating mutations were identified in a novel candidate gene in
      a panel of BHD families, with a 44% frequency of insertion/deletion
      mutations within a hypermutable C(8) tract.
    explanation: >-
      Identifies the germline lesion and its mutational hotspot in BHD families,
      which is the constitutional first hit this node asserts.
  - reference: PMID:12204536
    reference_title: "Mutations in a novel gene lead to kidney tumors, lung wall defects, and benign tumors of the hair follicle in patients with the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue expression of the 3.8 kb transcript was widespread, including
      kidney, lung, and skin.
    explanation: >-
      Establishes that FLCN is broadly expressed across the affected organs,
      which is the basis for the statement that expression pattern alone does
      not explain tissue restriction.
  downstream:
  - target: Somatic FLCN Second-Hit Inactivation
    description: >-
      With one allele already inactivated in every cell, a single somatic event
      at the FLCN locus becomes the rate-limiting step to folliculin loss.

- name: Somatic FLCN Second-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    A somatic event inactivates the retained wild-type FLCN allele. In BHD
    renal tumors the dominant route is not loss of heterozygosity but an
    independent intragenic mutation: sequencing 77 renal tumors from 12
    carriers found somatic sequence alterations in 53% and loss of
    heterozygosity in a further 17%, with most somatic changes producing
    frameshifts predicted to truncate the protein. That distribution matters
    for interpretation, because a BHD renal tumor without loss of heterozygosity
    has usually still completed its second hit, by mutation rather than allele
    loss.
  role: amplifier
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: FLCN
      term:
        id: hgnc:27310
        label: FLCN
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    allelic_events:
    - FRAMESHIFT_VARIANT
    - LOSS_OF_HETEROZYGOSITY
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Acquired inactivation of the retained wild-type FLCN allele in renal
      tumor tissue, predominantly by somatic frameshift mutation and less often
      by loss of heterozygosity.
  evidence:
  - reference: PMID:15956655
    reference_title: "High frequency of somatic frameshift BHD gene mutations in Birt-Hogg-Dubé-associated renal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence alterations were detected in the majority of renal tumors (41 of
      77, 53%), with loss of heterozygosity at the BHD locus in a minority of
      additional tumors (14 of 77, 17%).
    explanation: >-
      Quantifies the somatic second hit in BHD renal tumors and shows that
      intragenic mutation rather than allele loss is the dominant route, which
      is exactly what this node asserts.
  downstream:
  - target: Folliculin Loss and FNIP1-AMPK-mTOR Nutrient Sensing Dysregulation
    description: >-
      Completion of the second hit leaves the renal tumor cell without
      functional folliculin.

- name: Folliculin Loss and FNIP1-AMPK-mTOR Nutrient Sensing Dysregulation
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Folliculin is a tumor-suppressor protein without an assigned catalytic
    family; its identified partner FNIP1 binds AMP-activated protein kinase, the
    central energy sensor that negatively regulates mTOR. FNIP1 is phosphorylated
    by AMPK, and folliculin phosphorylation is reduced by AMPK inhibitors,
    diminished by rapamycin and by amino-acid starvation, and increased by FNIP1
    overexpression — placing folliculin inside the AMPK and mTOR signalling
    network rather than upstream or downstream of it. Loss of folliculin in a
    cell that has inactivated both alleles therefore dysregulates nutrient and
    energy sensing, which is the mechanistic link between Birt-Hogg-Dube and the
    other hamartoma syndromes caused by LKB1, TSC1/2 and PTEN.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15956655
    reference_title: "High frequency of somatic frameshift BHD gene mutations in Birt-Hogg-Dubé-associated renal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support a role for BHD as a tumor suppressor gene that
      predisposes to the development of renal tumors when both copies are
      inactivated.
    explanation: >-
      Direct evidence that BHD tumorigenesis requires inactivation of both FLCN
      copies, which is the biallelic claim this node makes and which the
      FNIP1/AMPK evidence below does not itself establish.
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report the identification of the FLCN-interacting protein, FNIP1,
      and demonstrate its interaction with 5' AMP-activated protein kinase
      (AMPK), a key molecule for energy sensing that negatively regulates mTOR
      activity.
    explanation: >-
      Establishes the physical link from folliculin through FNIP1 to AMPK, the
      basis for placing this disorder on the nutrient-sensing axis. Evidence
      source is IN_VITRO (cell-based interaction and phosphorylation studies).
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest that FLCN, mutated in Birt-Hogg-Dubé syndrome, and its
      interacting partner FNIP1 may be involved in energy and/or nutrient
      sensing through the AMPK and mTOR signaling pathways.
    explanation: >-
      The authors' own statement of the pathway assignment. Note the hedged
      wording ("may be involved") is preserved here rather than upgraded — the
      interaction is demonstrated, the pathway role is inferred.
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The tumor-suppressor proteins encoded by genes responsible for several
      other hamartoma syndromes, LKB1, TSC1/2, and PTEN, have been shown to be
      involved in the mammalian target of rapamycin (mTOR) signaling pathway.
    explanation: >-
      Supports grouping Birt-Hogg-Dube with the other nutrient-sensing hamartoma
      syndromes, which is the classification claim made in this entry.
  downstream:
  - target: Loss of FLCN-FNIP RagC/D GAP Activity
    description: >-
      The molecular function folliculin loses with its second allele is its GAP
      activity toward RagC and RagD, the step through which it acts on mTORC1.

- name: Loss of FLCN-FNIP RagC/D GAP Activity
  description: >-
    Folliculin, with its partners FNIP1 and FNIP2, is a GTPase-activating protein
    (GAP) for RagC and RagD, the Rag GTPases that signal amino-acid sufficiency
    to mTORC1 at the lysosome; it has no such activity toward RagA or RagB. In
    starved cells folliculin is held on the lysosome in the lysosomal folliculin
    complex, where its catalytic arginine is displaced and the GAP is off;
    disassembly of that complex releases the GAP activity. A cell without
    folliculin therefore cannot complete RagC/D activation, whatever its nutrient
    state.
  role: mediator
  biological_scale: MOLECULAR
  gene:
    preferred_term: FLCN
    modifier: DECREASED
    term:
      id: hgnc:27310
      label: FLCN
  molecular_functions:
  - preferred_term: GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:24095279
    reference_title: "The folliculin tumor suppressor is a GAP for the RagC/D GTPases that signal amino acid levels to mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identify FLCN and its binding partners, FNIP1/2, as Rag-interacting
      proteins with GAP activity for RagC/D, but not RagA/B.
    explanation: >-
      Identifies the molecular function this node says is lost: folliculin with
      FNIP1/2 is a GAP selective for RagC/D. Biochemical and cell-based work.
  - reference: PMID:31672913
    reference_title: "Structural mechanism of a Rag GTPase activation checkpoint by the lysosomal folliculin complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The RagC-GAP activity of FLCN was inhibited within the LFC, owing to
      displacement of a catalytically required arginine in FLCN from the RagC
      nucleotide.
    explanation: >-
      Structural basis for how the GAP activity is held off in the starved,
      lysosome-bound state, and that it depends on a catalytic arginine in
      folliculin itself. Cryo-electron microscopy of the reconstituted complex.
  downstream:
  - target: Constitutive TFEB/TFE3 Nuclear Activation
    description: >-
      Without RagC/D activation, mTORC1 cannot phosphorylate TFEB and TFE3,
      whose phosphorylation, unlike that of its other substrates, depends on it.
    evidence:
    - reference: PMID:31672913
      reference_title: "Structural mechanism of a Rag GTPase activation checkpoint by the lysosomal folliculin complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Disassembly of the LFC and release of the RagC-GAP activity of FLCN
        enabled mTORC1-dependent regulation of the master regulator of
        lysosomal biogenesis, transcription factor E3, implicating the LFC as a
        checkpoint in mTORC1 signaling.
      explanation: >-
        Links release of the RagC GAP activity to mTORC1 control of TFE3, the
        edge from this node to the next.

- name: Constitutive TFEB/TFE3 Nuclear Activation
  description: >-
    The MiT/TFE transcription factors TFEB and TFE3 are mTORC1 substrates of an
    unusual kind: their phosphorylation depends on amino-acid activation of
    RagC/D rather than on growth-factor activation of RHEB, so it is lost when
    folliculin is. Folliculin promotes the mTORC1-dependent phosphorylation and
    cytoplasmic retention of TFEB; without it TFEB is constitutively nuclear and
    drives its lysosomal and metabolic programme. In a kidney-specific mouse
    model this, rather than general mTORC1 activation, is the driver of disease:
    TFEB depletion rescues the kidney phenotype and lethality and normalizes
    mTORC1 activity, which is itself raised downstream of TFEB. This resolves the
    paradox of folliculin-null tumors showing mTORC1 hyperactivity despite losing
    an mTORC1 activator.
  role: effector
  biological_scale: CELLULAR
  gene:
    preferred_term: TFEB
    modifier: INCREASED
    term:
      id: hgnc:11753
      label: TFEB
  biological_processes:
  - preferred_term: protein import into nucleus
    term:
      id: GO:0006606
      label: protein import into nucleus
    modifier: INCREASED
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: INCREASED
  evidence:
  - reference: PMID:24081491
    reference_title: "Recruitment of folliculin to lysosomes supports the amino acid-dependent activation of Rag GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we show that FLCN regulates lysosome function by promoting
      the mTORC1-dependent phosphorylation and cytoplasmic sequestration of
      transcription factor EB (TFEB).
    explanation: >-
      Shows that folliculin is required for the phosphorylation and cytoplasmic
      retention of TFEB, so its loss leaves TFEB nuclear. Cell-based work.
  - reference: PMID:32612235
    reference_title: "A substrate-specific mTORC1 pathway underlies Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that constitutive activation of TFEB is the main driver of the
      kidney abnormalities and mTORC1 hyperactivity in a mouse model of
      Birt-Hogg-Dubé syndrome.
    explanation: >-
      Places constitutive TFEB activation as the driver of the kidney disease and
      of the mTORC1 hyperactivity seen in it, in a mouse model.
  - reference: PMID:32612235
    reference_title: "A substrate-specific mTORC1 pathway underlies Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Accordingly, depletion of TFEB in kidneys of these mice fully rescued the
      disease phenotype and associated lethality, and normalized mTORC1
      activity.
    explanation: >-
      The genetic rescue that makes TFEB activation causal rather than
      correlated in the kidney: removing it restores the phenotype, survival and
      mTORC1 activity.
  downstream:
  - target: Multiorgan Hamartoma and Renal Tumor Development
    description: >-
      Constitutive TFEB activity drives the renal proliferation and tumor
      development; its role in the lung and skin lesions is less established.

- name: Multiorgan Hamartoma and Renal Tumor Development
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: follicular hamartomas of the skin, cysts in the lung
    wall that predispose to spontaneous pneumothorax, and renal neoplasms that
    are characteristically bilateral and multifocal. The renal histology is
    distinctive and diagnostically useful: mostly hybrid oncocytic tumors and
    chromophobe renal cell carcinoma, with oncocytoma, rather than the
    predominantly clear-cell tumors of von Hippel-Lindau disease, although a
    minority of BHD renal tumors are clear cell or papillary carcinomas.
    Risk is family-stratified: carriers whose relatives have had kidney cancer,
    or spontaneous pneumothorax, are at significantly higher risk of that same
    feature, which is what surveillance planning is built on.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12204536

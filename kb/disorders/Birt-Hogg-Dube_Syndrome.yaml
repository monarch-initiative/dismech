phenotypes:
- category: Dermatologic
  name: Fibrofolliculoma
  description: >-
    Benign follicular hamartoma of the skin, typically multiple and
    facial/cervical, and often the first feature to bring a family to attention.
    Absent in a minority of mutation-positive individuals.
  phenotype_term:
    preferred_term: Fibrofolliculoma
    term:
      id: HP:0030436
      label: Fibrofolliculoma
    onset:
      onset_category: YOUNG_ADULT
      notes: >-
        Lesions develop after puberty and typically appear between the second
        and fourth decades (GeneReviews, PMID:20301695), about age 25 in the
        original kindred (PMID:26334087).
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrofolliculomas are the most common phenotypic features of BHD syndrome
      occurring in greater than 85% of BHD patients over the age of 25.
    explanation: >-
      Frequency evidence: more than 85% of patients over 25 falls in the
      VERY_FREQUENT band (80-99%). The figure is age-qualified, since the lesions
      appear from the second to fourth decade.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dubé syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Birt-Hogg-Dubé syndrome (BHDS) (MIM 135150) is an autosomal dominant
      predisposition to the development of follicular hamartomas
      (fibrofolliculomas), lung cysts, spontaneous pneumothorax, and kidney
      neoplasms.
    explanation: >-
      Names follicular hamartoma (fibrofolliculoma) directly as a defining
      feature of the syndrome.
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Skin lesions typically appear between the second and fourth decades of
      life and typically increase in size and number with age.
    explanation: >-
      GeneReviews Clinical Characteristics section, giving the onset window and
      the progressive accumulation with age — the visible signature of
      independent second hits occurring across the skin over time.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dubé syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      10% (5/51) of the families had individuals without histologically
      confirmed fibrofolliculomas.
    explanation: >-
      Quantifies the minority of mutation-positive families in which the
      cutaneous lesion is not histologically confirmed. It qualifies the
      VERY_FREQUENT band rather than contradicting it: the band describes
      affected adults, and some carriers in a family never develop a confirmed
      lesion.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They tend to occur on the face, neck, upper torso, and less frequently on
      ear lobes or oral mucosa.
    explanation: >-
      Review (full text) giving the body distribution of the lesions, which is
      why the description calls them facial and cervical.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fibrofolliculomas, which develop after puberty, are generally neither
      painful nor pruritic.
    explanation: >-
      Supports the post-pubertal onset recorded on the term, and that the
      lesions are asymptomatic.
- category: Respiratory

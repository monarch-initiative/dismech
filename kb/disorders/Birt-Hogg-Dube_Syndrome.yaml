treatments:
- name: Renal Surveillance and Nephron-Sparing Surgery
  notes: >-
    Curated under `treatments:` as a management intervention, not as a claim
    that imaging or biochemistry is itself therapeutic. In a two-hit
    predisposition syndrome the second hit cannot be prevented, so the only
    available lever is stage at detection: surveillance is the intervention
    that converts an unavoidable tumor into a resectable one. Where a
    `target_mechanisms` link is present it points at the clinical-outcome node
    for that reason, and never at an upstream mechanistic node.
  description: >-
    The renal arm dominates management. Tumors under 3 cm are watched rather
    than resected, and larger ones are removed nephron-sparingly where possible
    — a deliberately conservative approach that only makes sense because the
    tumors are typically indolent oncocytic lesions and because bilateral,
    multifocal disease means renal tissue must be preserved for future
    operations. This is the opposite of the wide-margin policy used in HLRCC,
    where the renal tumor metastasizes while small.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  target_mechanisms:
  - target: Multiorgan Hamartoma and Renal Tumor Development
    treatment_effect: INHIBITS
    description: >-
      Surveillance and nephron-sparing resection act on the consequence node by
      removing established tumors while preserving tissue for the further
      independent tumors the two-hit mechanism predicts.
  evidence:
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Renal tumors less than 3.0 cm in diameter can be monitored with imaging;
      when possible, nephron-sparing surgery is the treatment of choice for
      larger renal tumors, depending on their size and location.
    explanation: >-
      GeneReviews Management section, giving the size threshold for observation
      versus surgery and the nephron-sparing preference.
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annual abdominal/pelvic MRI to assess for renal lesions beginning at age
      20 years or earlier in those with a family history of renal tumors before
      age 30 years
    explanation: >-
      GeneReviews Management section, giving the surveillance modality, interval
      and start age, including the family-history-dependent earlier start.
- name: Pneumothorax Management and Risk-Activity Counselling
  description: >-
    Pneumothoraces are treated conventionally, with surgery considered for
    recurrence. The distinctive part is anticipatory counselling: carriers are
    advised about activities involving ambient pressure change, because the
    underlying cysts are permanent and the risk is lifelong.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pneumothoraces are treated as in the general population; consider surgical
      intervention for recurrent pneumothoraces.
    explanation: >-
      GeneReviews Management section on treating the acute event and the
      threshold for surgical intervention.
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      discuss activities that might increase pneumothorax risk (e.g., working as
      a pilot, flying in unpressurized aircraft, diving)
    explanation: >-
      GeneReviews Management section, giving the specific activities that
      warrant counselling in a carrier.
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Cigarette smoking, high ambient pressures,
      and radiation exposure.
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid, covering all three exposures
      relevant across the pulmonary and renal arms of the syndrome.
- name: Treatment of Cutaneous Fibrofolliculomas
  description: >-
    Surgical and laser treatment of fibrofolliculomas is cosmetic and
    temporary — the lesions recur, which is expected given that the skin
    continues to accumulate independently initiated lesions with age.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surgical and laser treatment can lead to temporary improvement of
      fibrofolliculomas, but lesions often recur.
    explanation: >-
      GeneReviews Management section. The recurrence caveat is quoted because it
      is the clinically important half of the statement.
diagnosis:
- name: Clinical Diagnostic Criteria for Birt-Hogg-Dube Syndrome
  description: >-
    A clinical diagnosis can be made without genetic testing: one major
    criterion (more than five fibrofolliculomas or trichodiscomas, at least one
    histologically confirmed) or two minor criteria drawn from the pulmonary,
    renal and family-history features.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    One major or two minor criteria establish the clinical diagnosis and
    prompt confirmatory FLCN testing.
  evidence:
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical diagnosis of BHDS is established in a proband with either one
      major criteria (>5 fibrofolliculomas/trichodiscomas; one histologically
      confirmed) or two minor criteria
    explanation: >-
      GeneReviews Diagnosis/Testing section, giving the major and minor criteria
      structure of the clinical diagnosis.
- name: Molecular Genetic Testing for FLCN
  description: >-
    A germline heterozygous FLCN pathogenic variant establishes the molecular
    diagnosis. Cascade testing then serves both directions: starting renal
    surveillance in carriers and releasing non-carriers from lifelong imaging.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous germline pathogenic FLCN variant confirms the diagnosis and
    determines which relatives need renal surveillance.
  evidence:
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The molecular diagnosis is established in a proband with any suggestive
      findings and a germline heterozygous pathogenic variant in FLCN identified
      by molecular genetic testing.
    explanation: >-
      GeneReviews Diagnosis/Testing section, stating the confirmatory molecular
      test.
  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing for the family-specific FLCN pathogenic variant
      for early identification of at-risk family members improves diagnostic
      certainty and reduces costly screening procedures in at-risk relatives who
      have not inherited the family-specific pathogenic variant.
    explanation: >-
      GeneReviews Evaluation of Relatives at Risk, giving both purposes of
      cascade testing.
prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.2
  notes: >-
    Estimated 2 cases per million, normalised to 0.2 per 100,000. Treat as an
    order-of-magnitude estimate rather than a measured rate: Birt-Hogg-Dube is
    substantially underdiagnosed because its commonest features — skin papules
    and asymptomatic lung cysts — rarely prompt genetic evaluation on their own,
    so ascertainment-based estimates are expected to run low. The same source
    reports a local founder cluster, which illustrates how far the figure can
    depart from the general-population estimate in a specific ancestry group.
  evidence:
  - reference: PMID:35907578
    reference_title: "Birt-Hogg-Dubé syndrome: Another mTOR phenomenon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although its prevalence in the general population has been estimated at 2
      cases per million, BHDS has been detected in a few patients from the
      nearby Portuguese-lineage quarter of the city of Newark, a disproportionate
      prevalence possibly explained by the founder effect.
    explanation: >-
      Source for the general-population estimate, quoted together with the
      founder-effect cluster that qualifies it. Evidence source is OTHER because
      this is a review article rather than a primary epidemiological study.

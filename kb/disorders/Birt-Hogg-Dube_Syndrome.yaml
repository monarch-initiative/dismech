  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lung cysts are mainly in the basal lung regions; most individuals are
      asymptomatic but at high risk for spontaneous pneumothorax.
    explanation: >-
      GeneReviews Clinical Characteristics section, giving the basal
      distribution and the key clinical asymmetry: the cysts themselves are
      usually silent, but they carry a high pneumothorax risk.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Multiple bilateral pulmonary cysts are highly penetrant manifestations in
      BHD syndrome , detected on high resolution computed tomography (CT) of the
      chest in 70-84% of BHD affected individuals, and occur at a median age of
      30-40 years
    explanation: >-
      Review summarising several cohorts: 70-84% on CT, which together with the
      85% survey figure and the >80% figure below keeps the phenotype at the
      upper edge of FREQUENT to VERY_FREQUENT; the band is left at
      VERY_FREQUENT. Also the source of the median detection age.
  - reference: PMID:27514594
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More than 80% of adult patients with BHD have pulmonary cysts on
      high-resolution computed tomography scan of the chest.
    explanation: >-
      Independent review figure for cyst frequency in adults, consistent with
      the VERY_FREQUENT band.
  sequelae:
  - target: Spontaneous Pneumothorax
    causal_link_type: DIRECT
    description: >-
      Rupture of the subpleural lung cysts causes spontaneous pneumothorax.
    evidence:
    - reference: PMID:17322109
      reference_title: "Lung cysts, spontaneous pneumothorax, and genetic associations in 89 families with Birt-Hogg-Dubé syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of lung cysts was significantly associated with pneumothorax (p = 0.006)."
      explanation: >-
        In 198 patients from 89 families, having lung cysts was associated with a history of pneumothorax.
- category: Respiratory
  name: Spontaneous Pneumothorax
  description: >-
    Recurrent spontaneous pneumothorax arising from rupture of the
    characteristic lung cysts; risk is strongly stratified by family history.
    The first episode usually comes before age 40, and most patients who have
    one go on to have more, ipsilateral or contralateral. Reported frequency
    depends heavily on ascertainment: about a quarter of patients in an
    NIH family series, but three quarters of patients recruited through lung
    clinics and a patient foundation.
  phenotype_term:
    preferred_term: Spontaneous pneumothorax
    term:
      id: HP:0002108
      label: Spontaneous pneumothorax
    temporality: RECURRENT
    onset:
      onset_category: ADULT
      mean_age_years: 36.5
      min_age_years: 14
      max_age_years: 63
      notes: >-
        Mean age and range at first pneumothorax in a 104-patient survey
        (PMID:28248571). Cases in children as young as 7 have been reported
        (PMID:26334087).
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:17322109
    reference_title: "Lung cysts, spontaneous pneumothorax, and genetic associations in 89 families with Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-four percent (48/198) of patients with BHDS had a history of
      pneumothorax.
    explanation: >-
      Frequency evidence: 48 of 198 patients (24%) falls in the OCCASIONAL band
      (5-29%). This is history of pneumothorax at the time of study, so it
      understates lifetime occurrence.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dubé syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly, patients with a BHD germline mutation and family history of
      spontaneous pneumothorax had a significantly increased greater probability
      of having spontaneous pneumothorax than BHDS patients without a family
      history of spontaneous pneumothorax (p = 0.011).
    explanation: >-
      Establishes spontaneous pneumothorax as a BHD feature and quantifies its
      familial clustering.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Approximately 30% of BHD patients report a history of spontaneous
      pneumothorax, generally prior to the age of 40 years, with diagnoses in
      children as young as 7 years of age.
    explanation: >-
      Review figure pooled across cohorts. At about 30% it sits on the
      OCCASIONAL/FREQUENT boundary; OCCASIONAL is kept because the largest
      primary count (48/198, 24%) falls inside it. Also supports the onset
      before 40 and the youngest reported age.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      BHD-affected individuals have a 50-fold greater risk (after adjusting for
      age) of developing spontaneous pneumothorax than unaffected family
      members.
    explanation: >-
      Quantifies the excess risk against unaffected relatives, reported in the
      review from an NIH case-control study of 111 patients and 112 relatives.
  - reference: PMID:28248571
    reference_title: "Spontaneous Pneumothoraces in Patients with Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-nine (76%) of 104 patients had at least one spontaneous
      pneumothorax during their lifetime, and 82% had multiple pneumothoraces.
    explanation: >-
      Lifetime count in a survey recruited through a rare lung disease clinic
      network and a patient foundation. That route over-samples patients with
      lung disease, so the 76% is not used for the frequency band; it does
      support the recurrence recorded as temporality.
  - reference: PMID:28248571
    reference_title: "Spontaneous Pneumothoraces in Patients with Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean ages at first and second pneumothoraces were 36.5 years (range,
      14-63 yr) and 37 years (range, 20-55 yr), respectively.
    explanation: >-
      Source of the onset age and range recorded on the term.
  - reference: PMID:28248571
    reference_title: "Spontaneous Pneumothoraces in Patients with Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous pneumothorax was the presenting manifestation that led to the
      diagnosis of BHD in 65% of patients, typically after the second episode
      (mean, 2.4 episodes).
    explanation: >-
      Shows that pneumothorax is often how the syndrome comes to attention, and
      usually only after a recurrence.
- category: Renal
  name: Renal Neoplasm
  description: >-
    Bilateral, multifocal renal tumors, a mean of about five per patient in a
    surgical series. Hybrid oncocytic tumors (about half of resected tumors)
    and chromophobe renal cell carcinoma (about a third) predominate, with
    clear cell carcinoma and oncocytoma less common; the background kidney
    usually carries microscopic oncocytosis, thought to be the precursor
    lesion. Hybrid oncocytic tumor and renal oncocytosis have no HPO term, so
    they are recorded here rather than as phenotypes of their own. Renal
    tumors develop in roughly 12-34% of affected individuals, at a mean age of
    46-52 years. No frequency band is set because the cohort figures span the
    OCCASIONAL and FREQUENT bands and are partly family-level counts.
  phenotype_term:
    preferred_term: Renal neoplasm
    term:
      id: HP:0009726
      label: Renal neoplasm
    onset:
      onset_category: MIDDLE_AGE
      notes: >-
        Mean age of onset 46-52 years across cohorts, with cases reported from
        age 20 (PMID:26334087); multiple and bilateral tumors at a mean of 50.7
        years in a surgical series (PMID:12459621).
  evidence:
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dubé syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 44 families ascertained on the basis of skin lesions, 18 (41%) had
      kidney tumours.
    explanation: >-
      Quantifies renal tumor occurrence in families ascertained through the
      cutaneous phenotype.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Renal neoplasms develop in 12-34% of individuals affected with BHD
      syndrome with a mean age of onset of 46-52 years (Figure 2), but have
      been reported in patients as young as 20 years of age.
    explanation: >-
      Review figure for per-individual renal tumor frequency and onset, pooled
      across cohorts. The range crosses the OCCASIONAL/FREQUENT boundary, which
      is why no band is set.
  - reference: PMID:26334087
    reference_title: "Molecular genetics and clinical features of Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The risk of developing renal tumors was 7-fold greater in BHD affected
      individuals when compared with their unaffected siblings.
    explanation: >-
      Excess risk against unaffected siblings, reported in the review from the
      NIH case-control study.
  - reference: PMID:12459621
    reference_title: "Renal tumors in the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preoperative computed tomography scans demonstrated a mean of 5.3 tumors
      per patient (range 1-28 tumors), the largest tumors averaging 5.7 cm in
      diameter (+/- 3.4 cm, range 1.2-15 cm). Multiple and bilateral tumors were
      noted at an early age (mean 50.7 years).
    explanation: >-
      Pathology series of 130 tumors from 30 patients, documenting the
      multiplicity and bilaterality of BHD renal tumors.
  - reference: PMID:12459621
    reference_title: "Renal tumors in the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The resected tumors consisted predominantly of chromophobe renal cell
      carcinomas (44 of 130, 34%) or of hybrid oncocytic neoplasms that had
      areas reminiscent of chromophobe renal cell carcinoma and oncocytoma (65
      of 130, 50%).
    explanation: >-
      Gives the histological mix of BHD renal tumors, including the hybrid
      oncocytic tumor that has no HPO term of its own.
  - reference: PMID:12459621
    reference_title: "Renal tumors in the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopic oncocytosis was found in the renal parenchyma of most
      patients, including the parenchyma of five patients with evidence of
      clear cell renal cell carcinoma.
    explanation: >-
      Documents the background renal oncocytosis recorded in the description.
- category: Renal
  name: Renal Oncocytoma
  description: >-
    Benign renal tumor of Birt-Hogg-Dube; bilateral multifocal oncocytoma is a
    strong pointer to the diagnosis. Pure oncocytoma is the least common of the
    main histologies, about 5% of tumors, far fewer than the hybrid
    oncocytic tumors that share its features.

name: Birt-Hogg-Dube Syndrome
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Hamartoma Syndrome
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: Birt-Hogg-Dube syndrome
  term:
    id: MONDO:0800444
    label: Birt-Hogg-Dube syndrome
synonyms:
- BHD
- BHD syndrome
- fibrofolliculomas with trichodiscomas and acrochordons
description: >-
  Birt-Hogg-Dube syndrome is an autosomal dominant hereditary cancer and
  hamartoma syndrome caused by germline loss-of-function variants in FLCN at
  17p11.2, which encodes folliculin. It is defined by a triad that spans three
  unrelated organs — cutaneous follicular hamartomas (fibrofolliculomas), lung
  cysts with spontaneous pneumothorax, and renal tumors — and the fact that one
  tumor suppressor produces this particular combination is what makes the
  syndrome mechanistically interesting. Folliculin is not an enzyme in a
  proliferation pathway but a component of a nutrient- and energy-sensing
  network: it binds FNIP1, which in turn binds AMP-activated protein kinase, and
  folliculin phosphorylation responds to both mTOR and AMPK signalling.
  Birt-Hogg-Dube therefore belongs with the other hamartoma syndromes whose genes act
  on the same axis — LKB1/STK11 in Peutz-Jeghers, TSC1/TSC2 in tuberous
  sclerosis, and PTEN in the PTEN hamartoma tumor syndrome — rather than with the
  classical cell-cycle tumor suppressors. The renal tumors are characteristically
  bilateral and multifocal, and their histology is distinctive: renal oncocytoma
  and chromophobe renal cell carcinoma, and hybrid oncocytic tumors, rather than
  the clear-cell histology of von Hippel-Lindau disease. Kidney tumor risk and
  pneumothorax risk both cluster within families, so a positive family history
  for either feature raises the probability of that feature in a carrier.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Birt-Hogg-Dube syndrome is transmitted as an autosomal dominant
    predisposition. Expressivity is variable both between and within families: a
    minority of mutation-positive families contain individuals with no
    histologically confirmed fibrofolliculomas at all, and the probability of
    renal tumor or of spontaneous pneumothorax in a carrier depends on whether
    that feature has already occurred in the family.
  evidence:
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Birt-Hogg-Dubé syndrome (BHDS) (MIM 135150) is an autosomal dominant
      predisposition to the development of follicular hamartomas
      (fibrofolliculomas), lung cysts, spontaneous pneumothorax, and kidney
      neoplasms.
    explanation: >-
      States the autosomal dominant inheritance and the defining multi-organ
      phenotype in a series of 50 families.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BHDS is characterised by a spectrum of mutations, and clinical
      heterogeneity both among and within families.
    explanation: >-
      Directly supports the variable expressivity asserted here, including
      within-family variation.
pathophysiology:
- name: Germline FLCN First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous loss-of-function variant in FLCN at 17p11.2 is present
    constitutionally. Most alleles are protein-truncating, and a striking
    proportion are insertions or deletions within a hypermutable
    mononucleotide C(8) tract, which is why that tract is the first target of
    diagnostic sequencing. FLCN transcript is widely expressed — including in
    kidney, lung and skin, the three affected organs — so the tissue restriction
    of the phenotype is not explained by where the gene is expressed.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: FLCN
    modifier: DECREASED
    term:
      id: hgnc:27310
      label: FLCN
  genetic_context:
    gene:
      preferred_term: FLCN
      term:
        id: hgnc:27310
        label: FLCN
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    - FRAMESHIFT_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous FLCN loss of function, predominantly
      protein-truncating, with a hotspot in a hypermutable C(8) tract.
  evidence:
  - reference: PMID:12204536
    reference_title: "Mutations in a novel gene lead to kidney tumors, lung wall defects, and benign tumors of the hair follicle in patients with the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Protein-truncating mutations were identified in a novel candidate gene in
      a panel of BHD families, with a 44% frequency of insertion/deletion
      mutations within a hypermutable C(8) tract.
    explanation: >-
      Identifies the germline lesion and its mutational hotspot in BHD families,
      which is the constitutional first hit this node asserts.
  - reference: PMID:12204536
    reference_title: "Mutations in a novel gene lead to kidney tumors, lung wall defects, and benign tumors of the hair follicle in patients with the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue expression of the 3.8 kb transcript was widespread, including
      kidney, lung, and skin.
    explanation: >-
      Establishes that FLCN is broadly expressed across the affected organs,
      which is the basis for the statement that expression pattern alone does
      not explain tissue restriction.
  downstream:
  - target: Somatic FLCN Second-Hit Inactivation
    description: >-
      With one allele already inactivated in every cell, a single somatic event
      at the FLCN locus becomes the rate-limiting step to folliculin loss.

- name: Somatic FLCN Second-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    A somatic event inactivates the retained wild-type FLCN allele. In BHD
    renal tumors the dominant route is not loss of heterozygosity but an
    independent intragenic mutation: sequencing 77 renal tumors from 12
    carriers found somatic sequence alterations in 53% and loss of
    heterozygosity in a further 17%, with most somatic changes producing
    frameshifts predicted to truncate the protein. That distribution matters
    for interpretation, because a BHD renal tumor without loss of heterozygosity
    has usually still completed its second hit, by mutation rather than allele
    loss.
  role: amplifier
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: FLCN
      term:
        id: hgnc:27310
        label: FLCN
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    allelic_events:
    - FRAMESHIFT_VARIANT
    - LOSS_OF_HETEROZYGOSITY
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Acquired inactivation of the retained wild-type FLCN allele in renal
      tumor tissue, predominantly by somatic frameshift mutation and less often
      by loss of heterozygosity.
  evidence:
  - reference: PMID:15956655
    reference_title: "High frequency of somatic frameshift BHD gene mutations in Birt-Hogg-Dube-associated renal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence alterations were detected in the majority of renal tumors (41 of
      77, 53%), with loss of heterozygosity at the BHD locus in a minority of
      additional tumors (14 of 77, 17%).
    explanation: >-
      Quantifies the somatic second hit in BHD renal tumors and shows that
      intragenic mutation rather than allele loss is the dominant route, which
      is exactly what this node asserts.
  downstream:
  - target: Folliculin Loss and FNIP1-AMPK-mTOR Nutrient Sensing Dysregulation
    description: >-
      Completion of the second hit leaves the renal tumor cell without
      functional folliculin.

- name: Folliculin Loss and FNIP1-AMPK-mTOR Nutrient Sensing Dysregulation
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Folliculin is a tumor-suppressor protein without an assigned catalytic
    family; its identified partner FNIP1 binds AMP-activated protein kinase, the
    central energy sensor that negatively regulates mTOR. FNIP1 is phosphorylated
    by AMPK, and folliculin phosphorylation is reduced by AMPK inhibitors,
    diminished by rapamycin and by amino-acid starvation, and increased by FNIP1
    overexpression — placing folliculin inside the AMPK and mTOR signalling
    network rather than upstream or downstream of it. Loss of folliculin in a
    cell that has inactivated both alleles therefore dysregulates nutrient and
    energy sensing, which is the mechanistic link between Birt-Hogg-Dube and the
    other hamartoma syndromes caused by LKB1, TSC1/2 and PTEN.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15956655
    reference_title: "High frequency of somatic frameshift BHD gene mutations in Birt-Hogg-Dube-associated renal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support a role for BHD as a tumor suppressor gene that
      predisposes to the development of renal tumors when both copies are
      inactivated.
    explanation: >-
      Direct evidence that BHD tumorigenesis requires inactivation of both FLCN
      copies, which is the biallelic claim this node makes and which the
      FNIP1/AMPK evidence below does not itself establish.
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report the identification of the FLCN-interacting protein, FNIP1,
      and demonstrate its interaction with 5' AMP-activated protein kinase
      (AMPK), a key molecule for energy sensing that negatively regulates mTOR
      activity.
    explanation: >-
      Establishes the physical link from folliculin through FNIP1 to AMPK, the
      basis for placing this disorder on the nutrient-sensing axis. Evidence
      source is IN_VITRO (cell-based interaction and phosphorylation studies).
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest that FLCN, mutated in Birt-Hogg-Dubé syndrome, and its
      interacting partner FNIP1 may be involved in energy and/or nutrient
      sensing through the AMPK and mTOR signaling pathways.
    explanation: >-
      The authors' own statement of the pathway assignment. Note the hedged
      wording ("may be involved") is preserved here rather than upgraded — the
      interaction is demonstrated, the pathway role is inferred.
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The tumor-suppressor proteins encoded by genes responsible for several
      other hamartoma syndromes, LKB1, TSC1/2, and PTEN, have been shown to be
      involved in the mammalian target of rapamycin (mTOR) signaling pathway.
    explanation: >-
      Supports grouping Birt-Hogg-Dube with the other nutrient-sensing hamartoma
      syndromes, which is the classification claim made in this entry.
  downstream:
  - target: Multiorgan Hamartoma and Renal Tumor Development
    description: >-
      Dysregulated nutrient sensing in folliculin-null cells drives hamartomatous
      and neoplastic growth in the affected lineages.

- name: Multiorgan Hamartoma and Renal Tumor Development
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: follicular hamartomas of the skin, cysts in the lung
    wall that predispose to spontaneous pneumothorax, and renal neoplasms that
    are characteristically bilateral and multifocal. The renal histology is
    distinctive and diagnostically useful — oncocytoma and chromophobe renal cell
    carcinoma rather than the clear-cell tumors of von Hippel-Lindau disease.
    Risk is family-stratified: carriers whose relatives have had kidney cancer,
    or spontaneous pneumothorax, are at significantly higher risk of that same
    feature, which is what surveillance planning is built on.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12204536
    reference_title: "Mutations in a novel gene lead to kidney tumors, lung wall defects, and benign tumors of the hair follicle in patients with the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Discovery of disease-causing mutations in BHD, a novel kidney cancer gene
      associated with renal oncocytoma or chromophobe renal cancer, will
      contribute to understanding the role of folliculin in pathways common to
      skin, lung, and kidney development.
    explanation: >-
      Documents the characteristic renal histology and the three-organ
      distribution of the phenotype.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a germline BHD mutation and family history of kidney cancer
      had a statistically significantly increased probability of developing
      renal tumours compared to patients without a positive family history (p =
      0.0032).
    explanation: >-
      Quantifies the family-history stratification of renal tumor risk that this
      node asserts.
phenotypes:
- category: Dermatologic
  name: Fibrofolliculoma
  description: >-
    Benign follicular hamartoma of the skin, typically multiple and
    facial/cervical, and often the first feature to bring a family to attention.
    Absent in a minority of mutation-positive individuals.
  phenotype_term:
    preferred_term: Fibrofolliculoma
    term:
      id: HP:0030436
      label: Fibrofolliculoma
  evidence:
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Birt-Hogg-Dubé syndrome (BHDS) (MIM 135150) is an autosomal dominant
      predisposition to the development of follicular hamartomas
      (fibrofolliculomas), lung cysts, spontaneous pneumothorax, and kidney
      neoplasms.
    explanation: >-
      Names follicular hamartoma (fibrofolliculoma) directly as a defining
      feature of the syndrome.
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      10% (5/51) of the families had individuals without histologically
      confirmed fibrofolliculomas.
    explanation: >-
      Quantifies the minority of mutation-positive families in which the
      cutaneous lesion is not histologically confirmed, which is why this
      phenotype carries no frequency band. Marked PARTIAL because it qualifies
      rather than supports the association.
- category: Respiratory
  name: Pulmonary Cysts
  description: >-
    Thin-walled lung cysts, typically basal and subpleural, which are the
    structural substrate for pneumothorax.
  phenotype_term:
    preferred_term: Pulmonary cyst
    term:
      id: HP:0032445
      label: Pulmonary cyst
  evidence:
  - reference: PMID:17028174
    reference_title: "Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is involved in AMPK and mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Birt-Hogg-Dubé syndrome, a hamartoma disorder characterized by benign
      tumors of the hair follicle, lung cysts, and renal neoplasia, is caused by
      germ-line mutations in the BHD(FLCN) gene
    explanation: >-
      Names lung cysts directly as a defining feature of the syndrome, rather
      than leaving the cystic lesion to be inferred from a pneumothorax
      statement.
- category: Respiratory
  name: Spontaneous Pneumothorax
  description: >-
    Recurrent spontaneous pneumothorax arising from rupture of the
    characteristic lung cysts; risk is strongly stratified by family history.
  phenotype_term:
    preferred_term: Spontaneous pneumothorax
    term:
      id: HP:0002108
      label: Spontaneous pneumothorax
  evidence:
  - reference: PMID:18234728
    reference_title: "BHD mutations, clinical and molecular genetic investigations of Birt-Hogg-Dube syndrome: a new series of 50 families and a review of published reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly, patients with a BHD germline mutation and family history of
      spontaneous pneumothorax had a significantly increased greater probability
      of having spontaneous pneumothorax than BHDS patients without a family
      history of spontaneous pneumothorax (p = 0.011).
    explanation: >-
      Establishes spontaneous pneumothorax as a BHD feature and quantifies its
      familial clustering.
- category: Renal

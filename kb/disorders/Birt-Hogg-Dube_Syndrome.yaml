  - reference: PMID:20301695
    reference_title: "Birt-Hogg-Dubé Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common renal tumors are a hybrid of oncocytoma and chromophobe
      histologic cell types (oncocytic hybrid tumor); clear cell carcinoma and
      oncocytoma are also common.
    explanation: >-
      GeneReviews Clinical Characteristics section, giving the full renal
      histological spectrum. Note it includes clear cell carcinoma, so the
      oncocytic/chromophobe predominance is a tendency rather than an absolute

  notes: The 2018 and 2020 reports together describe five molecularly confirmed individuals from three families. The later report re-examines the two American sisters and adds one male patient; it also describes their clinically similar brother, whose DNA and formal autonomic evaluation were unavailable. These reports are overlapping case series, not independent cohorts or a population prevalence estimate.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe 2 families, with 4 patients in total, experiencing severe life-threatening orthostatic hypotension because of a novel cause.
    explanation: Gives the size of the founding cohort.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients 1 and 2 were sisters and homozygous for a nonsense mutation in exon 2, c.131G>A, p.Trp44 (Circ Res 2018). Their brother (patient 3) died at age 16 and his DNA was not available.
    explanation: The later report explicitly identifies overlap with the founding American family and the unconfirmed brother.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patient 4, not reported previously, had compound heterozygous mutations of the CYB561 gene.
    explanation: One newly described molecularly confirmed individual brings the combined count to five.
pathophysiology:
- name: Biallelic CYB561 Loss of Function
  biological_scale: MOLECULAR
  description: Homozygous Gly88Arg and Trp44Ter variants were identified in two families, and a third family carried His53Tyr in trans with an exon 2 deletion. The clinical and biochemical findings support loss of function. The precise effects of the patient alleles on protein abundance, membrane localization and electron transfer remain inferred; structural modeling of Gly88Arg and conservation of His53Tyr do not substitute for functional assays.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygosity mapping and exome and Sanger sequencing revealed pathogenic homozygous mutations in the gene encoding cytochrome b561 (CYB561); a missense variant c.262G>A, p.Gly88Arg in exon 3 in the Dutch family and a nonsense mutation (c.131G>A, p.Trp44*) in exon 2 in the American family.
    explanation: The original gene identification in the two founding families.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Variants were identified on separate chromosomes (in trans), indicating biparental inheritance.
    explanation: The additional patient carried the missense and exon-deletion alleles on opposite parental chromosomes.
  downstream:
  - target: Loss of Transmembrane Electron Transfer into Secretory Vesicles
    causal_link_type: DIRECT
    description: Biallelic damaging variants are inferred to impair CYB561 electron transfer; loss of membrane protein has not been directly demonstrated for every allele.
  genes:
  - preferred_term: CYB561
    term:
      id: hgnc:2571
      label: CYB561
- name: Loss of Transmembrane Electron Transfer into Secretory Vesicles
  biological_scale: MOLECULAR
  description: Vesicular CYB561 normally transfers reducing equivalents between cytosolic ascorbate and the vesicle interior through two heme centers. Impaired transfer in the human disorder is inferred from biallelic damaging variants, the catecholamine profile and the established biochemistry of the protein.
  cell_types:
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  evidence:
  - reference: PMID:14769875
    reference_title: Reversely-oriented cytochrome b561 in reconstituted vesicles catalyzes transmembrane electron transfer and supports extravesicular dopamine beta-hydroxylase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The reduction of thiazole blue or cytochrome c was dependent on the presence of cytochrome b561 in the vesicle membranes.
    explanation: Reconstituted bovine chromaffin-vesicle CYB561 demonstrates transmembrane electron transfer. The experiment used inside-out orientation and did not test patient variants.
  - reference: PMID:14999009
    reference_title: Properties of two distinct heme centers of cytochrome b561 from bovine chromaffin vesicles studied by EPR, resonance Raman, and ascorbate reduction assay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cytochrome b(561) from bovine adrenal chromaffin vesicles contains two hemes b with different midpoint potentials (+150 and +60 mV) and participates in transmembrane electron transport from extravesicular ascorbate to an intravesicular monooxygenase, dopamine beta-hydroxylase.
    explanation: Biochemistry of chromaffin-vesicle CYB561 supports its two-heme electron-transfer role; this is the relevant protein rather than another CYB561-family member.
  downstream:
  - target: Intravesicular Ascorbate Depletion
    causal_link_type: DIRECT
    description: Without electron transfer, oxidized intravesicular ascorbate is not regenerated.
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: transmembrane monodehydroascorbate reductase activity
    term:
      id: GO:0140575
      label: transmembrane monodehydroascorbate reductase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: secretory granule membrane
    term:
      id: GO:0030667
      label: secretory granule membrane

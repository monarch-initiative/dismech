- name: Autonomic function testing
  description: Orthostatic challenge and Valsalva testing reveal defective blood-pressure compensation, while sinus arrhythmia, cardiovagal responses and sweating can be preserved. The 2020 report discusses four relatives/cases but explicitly lacks formal autonomic testing for the deceased, genetically untested brother.
  evidence:
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients were evaluated in Vanderbilt Autonomic Dysfunction Center (VADC), on a sodium-controlled diet and off medications. Autonomic evaluation included Valsalva maneuvers, sinus arrhythmia during deep breathing, orthostatic challenge, and determination of catecholamines and their metabolites using high-performance liquid chromatography with electrochemical detection.
    explanation: The methods define the physiologic and biochemical evaluation.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients had profound orthostatic hypotension and impaired blood pressure response to the Valsalva maneuver, with exaggerated hypotension during phase 2 and absence of overshoot during phase 4
    explanation: The results describe adrenergic cardiovascular failure in the evaluated cases; the brother is explicitly excluded from formal testing in the case history.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thermoregulatory testing showed normal sweating.
    explanation: Preserved sweating is a diagnostic observation rather than a positive disease phenotype.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heart rate ratios for sinus arrhythmia and the VM were normal.
    explanation: Documents the preserved parasympathetic response measured in the autonomic evaluation.
- name: Catecholamine and enzyme profile
  description: Low or undetectable noradrenaline and DHPG with normal dopamine and preserved plasma DBH activity supports CYB561 deficiency in a patient with lifelong orthostatic hypotension. Genetic confirmation separates it from primary DBH deficiency.
  evidence:
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma dopamine and its metabolites were comparable to normal participants, and much lower than in DBH deficiency.
    explanation: The paired biochemical comparison helps distinguish the two molecular diseases.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene had no mutations.
    explanation: Normal plasma enzyme activity and negative DBH sequencing distinguish these families from primary DBH deficiency; they do not directly assay enzyme turnover inside patient vesicles.
treatments:
- name: Droxidopa
  description: Droxidopa (L-DOPS) is converted to noradrenaline by aromatic L-amino acid decarboxylase, bypassing the DBH-dependent step. In the founding four patients, 200 mg once to three times daily improved blood pressure and dizziness; nausea, headache and lumbar pain limited tolerability. The overlapping 2020 series reports improvement with 100 mg three times daily and excessive pressor responses or nausea above that dose. These are historical individual treatment observations, not a universal dosing regimen or evidence of improved survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: droxidopa
      term:
        id: CHEBI:31524
        label: droxidopa
  target_mechanisms:
  - target: Functional Dopamine Beta-Hydroxylase Deficiency
    treatment_effect: BYPASSES
    description: Direct decarboxylation of droxidopa to noradrenaline bypasses the cofactor-dependent dopamine hydroxylation step.
    evidence:
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The patients responded favorably to treatment with l-dihydroxyphenylserine, which can be converted directly to norepinephrine.
      explanation: States both the clinical response and the reason the bypass works, in the founding report.
  - target: Noradrenaline and Adrenaline Deficiency
    treatment_effect: RESTORES
    description: Restores measurable noradrenaline and DHPG; normalization of every catecholamine compartment is not demonstrated.
    evidence:
    - reference: PMID:31822578
      reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Droxidopa restored norepinephrine levels and improved OH.
      explanation: Confirms the response on both the biochemical and the clinical endpoint in the autonomic evaluation series.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The four patients were treated with L-dihydroxyphenylserine (L-DOPS), a synthetic precursor of norepinephrine, with dosages ranging from 200 mg once to three times daily
    explanation: The founding paper reports the doses used in four patients; the later series describes lower doses in overlapping cases.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, L-DOPS tolerability was hampered by nausea, headache and pain in the lumbar region
    explanation: The full text documents adverse effects that limited tolerability; this observation does not quantify their frequency or prove a survival benefit.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This treatment led a rise blood pressure in all 4 patients: supine blood pressure invariably exceeded 100/70 mmHg and blood pressure in the upright position usually rose to at least 90/60 mmHg.'
    explanation: The founding series directly documents improved blood pressure, with residual variation in standing measurements.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Droxidopa 100 mg three times a day improved orthostatic hypotension (table 1) and increased plasma norepinephrine from undetectable to 65 and 139 pg/mL in patients 1 and 2.
    explanation: The later study supplies paired biochemical response measurements in two previously reported sisters.
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Doses >100 mg TID were not tolerated because of excessive pressor responses (patients 1 and 2) or nausea (patient 4).
    explanation: The later report documents dose-limiting effects and cautions against treating the historical doses as a universal regimen.

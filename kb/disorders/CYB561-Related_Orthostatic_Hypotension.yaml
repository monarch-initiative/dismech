genetic:
- name: CYB561
  gene_term:
    preferred_term: CYB561
    term:
      id: hgnc:2571
      label: CYB561
  relationship_type: CAUSATIVE
  notes: Reported disease alleles include homozygous Gly88Arg and Trp44Ter, and His53Tyr in trans with an exon 2 deletion. Segregation supports recessive inheritance. Human missense effects remain predicted, and no quantitative penetrance estimate is established by these small families.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The CYB561 gene was found to be expressed in many human tissues, in particular the brain.
    explanation: Quantitative PCR of human adult and fetal tissue RNA shows broad expression; expression alone does not establish the causal effects of disease alleles.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygosity mapping and exome and Sanger sequencing revealed pathogenic homozygous mutations in the gene encoding cytochrome b561 (CYB561); a missense variant c.262G>A, p.Gly88Arg in exon 3 in the Dutch family and a nonsense mutation (c.131G>A, p.Trp44*) in exon 2 in the American family.
    explanation: The original gene identification in the two founding families.
  variants:
  - name: NM_001915.3:c.262G>A (p.Gly88Arg)
    description: Homozygous in the Dutch sisters and heterozygous in unaffected parents and a sister. Homology modeling predicts altered membrane anchoring and possible heme-adjacent effects; patient protein localization and transport were not directly measured. The distinct c.262G>C allele encoding the same protein substitution is not the familial allele.
    evidence:
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Sanger sequencing confirmed the presence of the c.262G>A mutation in homozygous form in the two affected Dutch sisters while it was heterozygous in the parents and in an unaffected sister and wild type in the other sister
      explanation: Family segregation supports the recessive allele.
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: The model suggests that the introduction of a hydrophilic and positively charged arginine in the third transmembrane region might affect the interactions between the hydrophobic lipids and can alter transmembrane anchoring of the protein
      explanation: An Arabidopsis-template homology model predicts a structural consequence; this is not a functional assay.
  - name: NM_001915.3:c.131G>A (p.Trp44Ter)
    description: Homozygous early stop variant in the American sisters, predicted to truncate the protein between the first two transmembrane segments. Endogenous RNA decay and residual protein were not measured.
    evidence:
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Both affected sisters (A1 and A2) had a homozygous nonsense mutation (c.131G>A, p.Trp44*) in exon 2 of the gene
      explanation: The founding study directly identifies the familial nonsense allele.
  - name: c.157C>T (p.His53Tyr)
    description: Missense allele at a conserved site, found in trans with an exon 2 deletion in the additional male patient. Impaired function was predicted; no variant-specific functional measurement was reported.
    evidence:
    - reference: PMID:31822578
      reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This is a missense mutation (p.His53Tyr) in a highly conserved site, predictive of impaired protein function. Variants were identified on separate chromosomes (in trans), indicating biparental inheritance.
      explanation: Clinical sequencing establishes phase, while the functional consequence remains predicted.
  - name: Exon 2 deletion
    description: Deletion allele in trans with His53Tyr in the additional male patient, demonstrating that diagnostic testing must be able to detect exon-level deletions as well as sequence variants.
    evidence:
    - reference: PMID:31822578
      reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patient 4, not reported previously, had compound heterozygous mutations of the CYB561 gene. One allele had a deletion of exon 2; the other allele had a c.157C>T variant
      explanation: The primary report establishes the exon-deletion variant class in the third family.
diagnosis:
- name: Molecular confirmation
  description: Sequence analysis together with detection of exon-level deletions can identify biallelic CYB561 variants. The third family demonstrates the value of deletion-sensitive analysis and establishing that two variants are in trans.
  evidence:

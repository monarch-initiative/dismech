- name: Intravesicular Ascorbate Depletion
  biological_scale: MOLECULAR
  description: Loss of vesicular ascorbate regeneration is the proposed compartment-specific consequence of impaired CYB561 function. The clinical papers infer this shortage rather than measuring ascorbate inside patient vesicles. Peptidylglycine alpha-amidating monooxygenase also uses vesicular ascorbate, but a resulting neuropeptide-amidation defect has not been demonstrated in these patients.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The CYB561 protein defect leads to a shortage of ascorbate inside the catecholamine secretory vesicles leading to a functional dopamine β-hydroxylase deficiency.
    explanation: The authors interpret the combined genetic, clinical and biochemical findings as intravesicular ascorbate shortage; this sentence is a mechanistic inference rather than a direct patient-vesicle measurement.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Intravesicular ascorbic acid is required by DβH and peptidylglycine alpha-amidating monooxygenase for their enzymatic activity
    explanation: Names both ascorbate-dependent vesicular enzymes. This is what makes the absent neuropeptide phenotype a question rather than an omission.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: peptidylglycine alpha-amidating monooxygenase uses ascorbic acid to amidate neuropeptides to prolong and increase activity (e.g. α-melanocyte-stimulating hormone, oxytocin, vasopressin, gastrin)
    explanation: Gives what the second enzyme does and which peptides it acts on, which is what would have to be measured to close the gap.
  downstream:
  - target: Functional Dopamine Beta-Hydroxylase Deficiency
    causal_link_type: DIRECT
    description: Insufficient regenerated ascorbate is inferred to limit vesicular dopamine beta-hydroxylase activity despite preserved plasma activity.
  mechanism_confidence: PROVISIONAL
- name: Functional Dopamine Beta-Hydroxylase Deficiency
  biological_scale: MOLECULAR
  description: Noradrenaline synthesis is impaired despite preserved measured plasma dopamine beta-hydroxylase activity and absence of pathogenic DBH variants in the founding families. This supports a cofactor-supply defect affecting the enzyme in its vesicular compartment; plasma testing does not directly measure its intravesicular catalytic state.
  molecular_functions:
  - preferred_term: dopamine beta-monooxygenase activity
    modifier: DECREASED
    term:
      id: GO:0004500
      label: dopamine beta-monooxygenase activity
  biological_processes:
  - preferred_term: norepinephrine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042421
      label: norepinephrine biosynthetic process
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene had no mutations.
    explanation: Normal plasma enzyme activity and negative DBH sequencing distinguish these families from primary DBH deficiency; they do not directly assay enzyme turnover inside patient vesicles.
  - reference: PMID:14769875
    reference_title: Reversely-oriented cytochrome b561 in reconstituted vesicles catalyzes transmembrane electron transfer and supports extravesicular dopamine beta-hydroxylase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The addition of a soluble form of dopamine beta-hydroxylase to the external medium resulted in the successful reconstitution of the hydroxylation activity towards tyramine, an analogue of dopamine, suggesting that a direct electron transfer via complex formation occurred.
    explanation: The bovine reconstitution experiment connects CYB561-mediated electron transfer with monooxygenase activity, using an artificial reversed orientation and tyramine substrate rather than patient vesicles.
  downstream:
  - target: Noradrenaline and Adrenaline Deficiency
    causal_link_type: DIRECT
    description: Impaired dopamine hydroxylation reduces noradrenaline production and consequently the substrate available for adrenaline synthesis.
- name: Noradrenaline and Adrenaline Deficiency
  biological_scale: ORGANISM
  description: Plasma noradrenaline, adrenaline and the noradrenaline metabolite DHPG are low or undetectable, with normal dopamine and its metabolites. Low CSF MHPG indicates involvement of central noradrenaline metabolism. Normal concentrations of selected dopamine and serotonin metabolites do not establish normal function of every pathway in those systems.
  evidence:
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma norepinephrine and metabolites were undetectable, and plasma dopamine and metabolites were normal.
    explanation: The measured catecholamine pattern supports selective noradrenaline deficiency; it does not prove that every upstream biochemical function is intact.
  downstream:
  - target: Selective Sympathetic Noradrenergic Failure
    causal_link_type: DIRECT
    description: Only the noradrenergic arm of the autonomic nervous system loses its transmitter.
  - target: Impaired Adrenergic Restraint of Insulin Secretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of noradrenergic inhibition of insulin secretion is proposed to contribute to infant hypoglycemia.
    intermediate_mechanisms:
    - Reduced alpha2-adrenergic receptor signaling in pancreatic beta cells
- name: Selective Sympathetic Noradrenergic Failure
  biological_scale: ORGANISM
  description: Deficient noradrenergic cardiovascular responses coexist with preserved sweating and cardiovagal responses in the tested patients. This pattern supports selective autonomic transmitter failure rather than generalized loss of autonomic function.
  evidence:
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CYB561 deficiency is characterized by selective sympathetic noradrenergic failure with lifelong, disabling OH but with normal sympathetic cholinergic (sweating) and parasympathetic (heart rate regulation) functions.
    explanation: Establishes the selectivity, which is what makes the autonomic phenotype mechanistically interpretable rather than a general dysautonomia.
  downstream:
  - target: Orthostatic Hypotension
    causal_link_type: DIRECT
    description: Failure of compensatory noradrenergic vasoconstriction produces a severe blood-pressure fall on standing.
  - target: Reduced Renal Perfusion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Severe postural hypotension
    description: Systemic hypotension is a plausible contributor to the posture-associated fall in renal blood flow measured in one patient.
- name: Impaired Adrenergic Restraint of Insulin Secretion
  biological_scale: ORGANISM
  description: The 2020 authors propose that loss of alpha2-adrenergic inhibition of insulin secretion, with preserved parasympathetic stimulation, contributes to hypoglycemia in infancy. Insulin secretion and counterregulatory responses were not directly characterized in the CYB561 patients. Failure of partial pancreatectomy in one patient does not exclude insulin dysregulation, and the later report states that episodes did not persist through childhood.
  evidence:
  - reference: PMID:31822578
    reference_title: Congenital absence of norepinephrine due to CYB561 mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: because of the loss of α2-adrenergic receptor-mediated inhibition, and conservation of parasympathetic-mediated stimulation of insulin secretion.
    explanation: The discussion proposes an autonomic explanation by analogy with DBH deficiency; the cited CYB561 series does not directly test pancreatic insulin dynamics.
  downstream:
  - target: Recurrent Hypoglycaemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Excess insulin secretion relative to glucose supply is a proposed contributor to the infant episodes.
    intermediate_mechanisms:
    - Inappropriately maintained insulin secretion
  mechanism_confidence: HYPOTHETICAL
- name: Reduced Renal Perfusion
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: Low renal plasma flow and further reduction on sitting were measured in the Dutch index patient. Chronic hemodynamic impairment could contribute to renal insufficiency, but the small series does not establish that it fully explains progressive kidney dysfunction.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: supine effective renal plasma flow was 248 ml/min and glomerular filtration rate was 56 ml/min (reference 1000–1200 and 100–120, respectively) whereas sitting effective renal plasma flow was 199 ml/min and glomerular filtration rate 38 ml/min.
    explanation: Clearance measurements directly demonstrate reduced renal perfusion; the causal contribution to chronic progression remains inferred.
  downstream:
  - target: Progressive Renal Insufficiency
    causal_link_type: DIRECT
    description: Persistently reduced perfusion is a proposed contributor to reduced filtration and progressive renal impairment.
  - target: Anemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Renal impairment
    description: The founding case report describes mild anemia as secondary to impaired renal function.
    evidence:
    - reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Renal function was impaired, with secondary mild anemia (Hb=7.3 mmol/L).
      explanation: The clinical narrative explicitly links anemia with renal impairment; the upstream hemodynamic contribution remains provisional.

    limitations: 'The evidence is biochemical: no blood-pressure phenotype was measured, and only six animals per genotype were examined. Adrenal noradrenaline and adrenaline differences were not significant, despite lower medians. Mice synthesize ascorbate de novo, unlike humans, but whether this attenuates disease severity was not tested.'

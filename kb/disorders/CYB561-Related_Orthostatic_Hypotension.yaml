    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both American patients (A1 and A2) were lost to follow up and died of
      unknown cause at age 59 and 48, respectively
    explanation: >-
      Two of the four deaths, with ages. Together with D1 this is three of four, which
      is inside the FREQUENT band (30-79%) and outside OCCASIONAL by a wide margin.
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four years after presentation, patient D1 suddenly lost consciousness with a
      prolonged circulatory arrest (while she was off L-DOPS treatment). After
      resuscitation measures and administration of a low-dose epinephrine, her
      blood pressure quickly recovered, but she had incurred severe brain damage
      and died after being in coma for five days
    explanation: >-
      The third death, and the one with a mechanism attached. The parenthesis matters
      clinically: the fatal arrest happened during an interruption of the treatment
      that had been controlling her blood pressure.

biochemical:
- name: Plasma noradrenaline
  presence: Decreased
  context: >-
    Undetectable, with normal plasma dopamine. Together with a normal plasma dopamine
    beta-hydroxylase activity, this pattern separates CYB561 deficiency from dopamine
    beta-hydroxylase deficiency, which shares the catecholamine profile but not the
    enzyme result.
  biomarker_term:
    preferred_term: noradrenaline
    term:
      id: CHEBI:33569
      label: noradrenaline
  readouts:
  - target: Noradrenaline and Adrenaline Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Absent noradrenaline with preserved dopamine reports a block at the
      dopamine-to-noradrenaline step specifically.
    evidence:
    - reference: PMID:31822578
      reference_title: "Congenital absence of norepinephrine due to CYB561 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma norepinephrine and metabolites were undetectable, and plasma dopamine and
        metabolites were normal.
      explanation: The paired measurement that makes this readout interpretable.

- name: Plasma dihydroxyphenylglycol
  presence: Decreased
  context: >-
    Below the limit of detection. DHPG is the metabolite of noradrenaline formed inside
    the neuron before release, so it reports the size of the intraneuronal noradrenaline
    pool rather than what reaches the circulation. Undetectable DHPG therefore says the
    noradrenaline was never made, not that it was made and cleared - which is the
    distinction between a synthetic defect and a release or reuptake defect. No CHEBI
    term is bound: the ontology carries the O-sulfate conjugate but not the free
    metabolite, and a conjugate is a different analyte.
  biomarker_term:
    preferred_term: 3,4-dihydroxyphenylglycol
  readouts:
  - target: Noradrenaline and Adrenaline Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      An undetectable intraneuronal metabolite localizes the deficit to synthesis rather
      than to handling of noradrenaline after it is made.
    evidence:
    - reference: PMID:29343526
      reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma norepinephrine, epinephrine and the intraneuronal norepinephrine
        metabolite dihydroxyphenylglycol were below the limit of detection
        (<0.01 nmol/L)
      explanation: >-
        Reports DHPG alongside noradrenaline and adrenaline, all below detection, in the
        American sisters.

- name: CSF 3-methoxy-4-hydroxyphenylglycol
  presence: Decreased
  context: >-
    Extremely low against a reference of 26 to 64 nmol/L, while CSF homovanillic acid
    and 5-hydroxyindoleacetic acid were normal. This is the entry's only direct evidence
    about the brain, and it is a three-part result rather than one: central noradrenaline
    is depleted, while the dopamine and serotonin pathways that share much of the same
    machinery are intact. The preserved dopamine metabolite is also the central
    counterpart of the preserved plasma dopamine that separates this disease from
    dopamine beta-hydroxylase deficiency. As with DHPG, CHEBI carries only conjugates of
    MHPG, so no term is bound.
  biomarker_term:
    preferred_term: 3-methoxy-4-hydroxyphenylglycol
  readouts:
  - target: Noradrenaline and Adrenaline Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Confirms the noradrenaline deficit extends to the central nervous system, and that
      it is selective for noradrenaline rather than a general monoamine failure.
    evidence:
    - reference: PMID:29343526
      reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The concentration of MHPG, the principal downstream metabolite of
        norepinephrine in the brain, was extremely low in CSF (<3 nmol/L;
        reference 26–64). The downstream metabolites of dopamine and serotonin,
        HVA and 5-HIAA respectively, had a normal concentration in CSF
      explanation: >-
        Gives the low CSF MHPG and the normal HVA and 5-HIAA in the same sentence, which
        is what makes this a selectivity result and not just a severity one.

- name: Plasma dopamine beta-hydroxylase activity
  presence: Normal
  context: >-
    Normal, which is the finding that redirects the diagnosis from DBH deficiency to a
    cofactor-supply defect. A normal result here in a patient with absent noradrenaline
    is the specific reason to sequence CYB561.
  readouts:
  - target: Functional Dopamine Beta-Hydroxylase Deficiency
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Read as a present-or-absent discriminator rather than as a magnitude: enzyme
      activity is present and normal while its product is absent, which establishes
      that the enzyme is not the lesion.
    evidence:
    - reference: PMID:29343526
      reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene
        had no mutations.
      explanation: Reports both the normal enzyme activity and the normal gene.


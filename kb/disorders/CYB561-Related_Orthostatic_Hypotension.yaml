animal_models:
- name: CYB561 knockout mouse
  species: Mouse
  genotype: CYB561 -/- (reporter-tagged deletion allele, post-Cre, C57BL/6NTac)
  publication: PMID:29343526
  description: >-
    Reproduces the central biochemical lesion, with reduced noradrenaline and
    normetanephrine in brain and reduced normetanephrine and metanephrine in adrenal
    tissue.
  modeled_mechanisms:
  - target: Noradrenaline and Adrenaline Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Six knockout mice showed the catecholamine deficit in both brain and adrenal
      gland, which the authors describe as recapitulating the clinical phenotype.
    limitations: >-
      Mice, unlike humans, synthesize ascorbate de novo, so a mouse retains a source of
      the cofactor a patient does not have. For a disease defined by failure to recycle
      ascorbate, that is the strongest reason to expect the knockout to under-represent
      human severity, and it is why fidelity here is MODERATE rather than HIGH. Beyond
      that, the reported measurements are tissue catecholamine concentrations rather
      than haemodynamic phenotyping, so the model is shown to reproduce the biochemistry
      rather than the orthostatic hypotension itself; and the cohort is six animals.
    readouts:
    - name: Whole-brain noradrenaline and normetanephrine
      target: Noradrenaline and Adrenaline Deficiency
      direction: DECREASED
      interpretation: Central catecholamine deficit matching the human biochemical profile.
      evidence:
      - reference: PMID:29343526
        reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The concentration of norepinephrine and normetanephrine was decreased in
          whole-brain homogenates of the CYB561(-/-) mice compared with wild-type mice
          (P<0.01), and the concentration of normetanephrine and metanephrine was
          decreased in adrenal glands (P<0.01), recapitulating the clinical phenotype.
        explanation: Reports the measurements and their significance in both tissues.
    evidence:
    - reference: PMID:29343526
      reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        An important consideration when using mice in ascorbic acid studies is that
        mice, unlike humans, can produce ascorbic acid de novo.
      explanation: >-
        The species difference that limits this model for an ascorbate-recycling
        disease, stated by the authors themselves. Attached to the link rather than to a
        readout because it qualifies whether the model is informative at all, not any
        single measurement.

discussions:
- discussion_id: cyb561_phenocopy_not_subtype
  kind: INTERPRETATION
  prompt: >-
    Is CYB561 deficiency a form of dopamine beta-hydroxylase deficiency, or a separate
    disease that resembles it?
  attaches_to:
  - pathophysiology#Functional Dopamine Beta-Hydroxylase Deficiency
  rationale: >-
    The two share low noradrenaline and adrenaline - which is what the founding report
    states, "As in DBH deficiency, concentrations of norepinephrine and epinephrine in
    the patients were low" - and both present as severe orthostatic hypotension
    responsive to droxidopa. Preserved dopamine is deliberately not claimed as a shared
    feature: it is a CYB561 finding, and in primary dopamine beta-hydroxylase deficiency
    plasma dopamine is characteristically elevated, accumulating upstream of the
    enzymatic block. They are nonetheless different
    diseases at different points in the same chain: in DBH deficiency the enzyme is
    defective, while here the enzyme is present, catalytically normal in plasma assay,
    and encoded by an intact gene, and what is missing is the regenerated cofactor
    inside the secretory vesicle. The practical consequence is diagnostic. A patient
    with the catecholamine profile and a normal plasma DBH activity has been shown not
    to have DBH deficiency, and that normal result is the specific indication to
    sequence CYB561 rather than a reason to doubt the phenotype. Curated as a
    phenocopy relationship rather than by merging the two entities.

    Two further discriminators reported in the same series strengthen that reading. The
    CYB561 syndrome "appears to be more malignant in terms of renal insufficiency and
    reduced life expectancy", and "ptosis and skeletal muscle hypotonia have been
    described in DBH patients but were not observed in our CYB561-patients" - a
    preserved-function difference of the same kind this entry curates elsewhere.

- discussion_id: cyb561_expression_versus_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the phenotype confined to noradrenergic function when CYB561 is expressed
    widely, including in brain?
  attaches_to:
  - pathophysiology#Selective Sympathetic Noradrenergic Failure
  - genetic#CYB561
  rationale: >-
    CYB561 is expressed in many tissues and particularly in brain, yet the clinical
    picture is a selective sympathetic noradrenergic failure with preserved cholinergic
    and parasympathetic function, and the knockout mouse shows reduced brain
    catecholamines without a reported neurological phenotype. Several explanations are
    available and none is established by the sources here: other cytochrome b561 family
    members may substitute in tissues where they are co-expressed; ascorbate demand may
    simply be highest in catecholamine secretory vesicles; or central deficits may
    exist and be unmeasured, given that only four patients have been evaluated. The
    sharpest form of the question is not about tissue expression at all but about the
    second enzyme in the same vesicle: peptidylglycine alpha-amidating monooxygenase
    draws on the same intravesicular ascorbate pool as dopamine beta-hydroxylase, so a
    supply defect should hit both, and no neuropeptide phenotype has been reported.
    Amidated peptide measurements in a CYB561 patient would discriminate between a
    genuinely spared pathway and one that has simply never been assayed. The
    question matters because it determines whether this should be regarded as an
    autonomic disease or as a systemic ascorbate-recycling disease that presents
    autonomically.

notes: >-
  GeneReviews. There is no GeneReviews chapter for CYB561 deficiency. A search returns
  the chapter for Dopamine Beta-Hydroxylase Deficiency (PMID:20301647), which is the
  disease this one phenocopies rather than this disease. It is deliberately not cited:
  every clinical statement in it describes DBH deficiency, and using it here would be
  the exact substitution the entry's own differential warns against. Recorded so that a
  later pass does not have to re-derive the absence, and does not mistake the adjacent
  chapter for a missed source.

  Named Entity Confusion. The preflight returned WARN with DBH mentioned 45 times
  against CYB561's 71, and the report carries two OMIM identifiers - 618182 for this
  entity and 223360 for dopamine beta-hydroxylase deficiency. The warning is genuine
  rather than an artifact: DBH is both the enzyme this disease acts on and the gene of
  the disease it phenocopies. Report content describing DBH deficiency has been used
  only to state the differential, and no DBH-deficiency observation is cited here as a
  CYB561 finding.

  A second entity risk, not flagged by the preflight. PMID:36903505 concerns
  CYB561D1, a different member of the cytochrome b561 family studied in mouse in a
  cancer context, not the CYB561 gene of this disease. It is cited once, for the
  family-level biochemical property that defines these proteins, and the evidence
  explanation says so explicitly. Two further papers returned by the literature search
  (on Cyb561 in leukemia stem cells and CYB561A3 in Burkitt lymphoma) concern other
  family members entirely and are not cited.

  Evidence base. Five patients have been characterized in total. Phenotype frequencies
  are stated against that cohort and should not be read as population estimates; the
  prevalence record is CASES_IN_LITERATURE.

  The preserved-function phenotype. "Preserved Sweating and Heart Rate Regulation" is
  curated as a phenotype although it records normal function. It is included because
  the selectivity is the mechanistically informative observation and is what a
  clinician would use to distinguish this from a generalized autonomic failure.

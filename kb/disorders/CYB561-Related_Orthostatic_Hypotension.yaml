  description: Six homozygous knockout mice and six wild-type mice were studied at 16 weeks. Brain noradrenaline and normetanephrine and adrenal normetanephrine and metanephrine were significantly reduced. Adrenal noradrenaline and adrenaline and tissue dopamine differences were not significant. Blood pressure was not measured.

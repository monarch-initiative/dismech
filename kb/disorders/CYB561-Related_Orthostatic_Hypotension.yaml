name: CYB561-Related Orthostatic Hypotension
description: >-
  Biallelic variants in CYB561 cause a lifelong, severe orthostatic hypotension
  syndrome with undetectable noradrenaline and adrenaline but normal dopamine.
  Cytochrome b561 is a transmembrane haem protein that carries electrons across the
  catecholamine secretory vesicle membrane to regenerate intravesicular ascorbate, the
  cofactor dopamine beta-hydroxylase consumes when it converts dopamine to
  noradrenaline. Losing it therefore does not damage the enzyme; it starves the enzyme
  of a regenerated cofactor inside a compartment, producing a functional dopamine
  beta-hydroxylase deficiency with a structurally and catalytically normal enzyme. The
  autonomic failure is strikingly selective: sympathetic noradrenergic function fails
  while sympathetic cholinergic and parasympathetic function are preserved.
disease_term:
  preferred_term: orthostatic hypotension 2
  term:
    id: MONDO:0020751
    label: orthostatic hypotension 2
creation_date: "2026-08-27T18:45:00Z"

references:
- reference: PMID:29343526
  title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
- reference: PMID:31822578
  title: Congenital absence of norepinephrine due to CYB561 mutations.
- reference: PMID:36903505
  title: >-
    Spectral and Redox Properties of a Recombinant Mouse Cytochrome b561 Protein
    Suggest Transmembrane Electron Transfer Function.

pathophysiology:
- name: Biallelic CYB561 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous CYB561 variants. Reported alleles include a
    missense change, a nonsense change and a whole-exon deletion, across two families
    and one further compound heterozygote.
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping and exome and Sanger sequencing revealed pathogenic
      homozygous mutations in the gene encoding cytochrome b561 (CYB561); a missense
      variant c.262G>A, p.Gly88Arg in exon 3 in the Dutch family and a nonsense
      mutation (c.131G>A, p.Trp44*) in exon 2 in the American family.
    explanation: The original gene identification in the two founding families.
  downstream:
  - target: Loss of Transmembrane Electron Transfer into Secretory Vesicles
    causal_link_type: DIRECT
    description: The variants remove the electron-transferring haem protein from the vesicle membrane.

- name: Loss of Transmembrane Electron Transfer into Secretory Vesicles
  biological_scale: MOLECULAR
  description: >-
    Cytochrome b561 carries electrons from cytosolic ascorbate across the vesicle
    membrane using two haem-b centres, one on each face. That transfer is what
    regenerates ascorbate inside the vesicle, a compartment the cell cannot simply
    refill from outside.
  cellular_components:
  - preferred_term: secretory granule lumen
    term:
      id: GO:0034774
      label: secretory granule lumen
  cell_types:
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  evidence:
  - reference: PMID:36903505
    reference_title: "Spectral and Redox Properties of a Recombinant Mouse Cytochrome b561 Protein Suggest Transmembrane Electron Transfer Function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The major characteristics of these proteins are their ascorbate reducibility and
      trans-membrane electron transferring capability.
    explanation: >-
      A family-level property of the cytochrome b561 proteins. This paper characterizes
      a different family member (CYB561D1), so it is cited only for the shared
      biochemical property that defines the family, not for any claim about CYB561
      itself or about this disease.
  downstream:
  - target: Intravesicular Ascorbate Depletion
    causal_link_type: DIRECT
    description: Without electron transfer, oxidized intravesicular ascorbate is not regenerated.

- name: Intravesicular Ascorbate Depletion
  biological_scale: MOLECULAR
  description: >-
    Ascorbate inside the catecholamine secretory vesicle is consumed and not replaced.
    This is the specific compartmental shortage that defines the disease.

    Two vesicular enzymes depend on that ascorbate, not one. Alongside dopamine
    beta-hydroxylase, peptidylglycine alpha-amidating monooxygenase uses it to amidate
    neuropeptides including alpha-MSH, oxytocin, vasopressin and gastrin - a
    modification that is required for those peptides to be active. So the lesion should
    in principle disable neuropeptide amidation as well as noradrenaline synthesis, and
    yet no neuropeptide phenotype has been reported in any of the four patients. That
    asymmetry is curated as a knowledge gap rather than resolved: the possibilities
    include a lower ascorbate requirement for the amidating enzyme, redundancy from
    other cytochrome b561 family members in the tissues where the neuropeptides are
    made, or a deficit that exists and has never been looked for in four patients.
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CYB561 protein defect leads to a shortage of ascorbate inside the
      catecholamine secretory vesicles leading to a functional dopamine β-hydroxylase
      deficiency.
    explanation: >-
      States the mechanism in one sentence, including the crucial word "functional" -
      the enzyme itself is intact.
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intravesicular ascorbic acid is required by DβH and peptidylglycine
      alpha-amidating monooxygenase for their enzymatic activity
    explanation: >-
      Names both ascorbate-dependent vesicular enzymes. This is what makes the absent
      neuropeptide phenotype a question rather than an omission.
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      peptidylglycine alpha-amidating monooxygenase uses ascorbic acid to amidate
      neuropeptides to prolong and increase activity (e.g.
      α-melanocyte-stimulating hormone, oxytocin, vasopressin, gastrin)
    explanation: >-
      Gives what the second enzyme does and which peptides it acts on, which is what
      would have to be measured to close the gap.
  downstream:
  - target: Functional Dopamine Beta-Hydroxylase Deficiency
    causal_link_type: DIRECT
    description: >-
      The enzyme cannot turn over without its cofactor, despite being present and
      catalytically competent.

- name: Functional Dopamine Beta-Hydroxylase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Dopamine beta-hydroxylase activity fails in situ while measured plasma enzyme
    activity is normal and the DBH gene is intact. This dissociation is the single most
    useful diagnostic feature and the reason the disease is a phenocopy rather than a
    variant of DBH deficiency.
  molecular_functions:
  - preferred_term: dopamine beta-monooxygenase activity
    modifier: DECREASED
    term:
      id: GO:0004500
      label: dopamine beta-monooxygenase activity
  biological_processes:
  - preferred_term: norepinephrine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042421
      label: norepinephrine biosynthetic process
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma dopamine β-hydroxylase activity, however, was normal, and the DBH gene had
      no mutations.
    explanation: >-
      The discriminating observation: normal enzyme activity and normal gene, which is
      what distinguishes this disease from dopamine beta-hydroxylase deficiency.
  downstream:
  - target: Noradrenaline and Adrenaline Deficiency
    causal_link_type: DIRECT
    description: The conversion of dopamine to noradrenaline does not occur.

- name: Noradrenaline and Adrenaline Deficiency
  biological_scale: ORGANISM
  description: >-
    Noradrenaline and its metabolites are undetectable while dopamine and its
    metabolites are normal - the biochemical signature of a block at exactly this step.
  evidence:
  - reference: PMID:31822578
    reference_title: "Congenital absence of norepinephrine due to CYB561 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma norepinephrine and metabolites were undetectable, and plasma dopamine and
      metabolites were normal.
    explanation: >-
      Localizes the lesion precisely: everything upstream of the DBH step is intact and
      everything downstream is absent.
  downstream:
  - target: Selective Sympathetic Noradrenergic Failure
    causal_link_type: DIRECT
    description: >-
      Only the noradrenergic arm of the autonomic nervous system loses its transmitter.
  - target: Impaired Catecholamine Counter-Regulation of Hypoglycaemia
    causal_link_type: DIRECT
    description: >-
      Adrenaline is a principal counter-regulatory hormone for falling blood glucose, so
      a disease that abolishes it removes that defence. This is a second downstream arm
      of the same lesion, not a coincidental finding.

- name: Selective Sympathetic Noradrenergic Failure
  biological_scale: ORGANISM
  description: >-
    Sympathetic noradrenergic function fails while sympathetic cholinergic function
    (sweating) and parasympathetic function (heart rate regulation) remain normal. The
    selectivity follows directly from which transmitter the missing cofactor serves.
  evidence:
  - reference: PMID:31822578
    reference_title: "Congenital absence of norepinephrine due to CYB561 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CYB561 deficiency is characterized by selective sympathetic noradrenergic failure
      with lifelong, disabling OH but with normal sympathetic cholinergic (sweating)
      and parasympathetic (heart rate regulation) functions.
    explanation: >-
      Establishes the selectivity, which is what makes the autonomic phenotype
      mechanistically interpretable rather than a general dysautonomia.
  downstream:
  - target: Orthostatic Hypotension
    causal_link_type: DIRECT
    description: >-
      Without noradrenergic vasoconstriction, standing produces an uncompensated fall
      in blood pressure.

- name: Impaired Catecholamine Counter-Regulation of Hypoglycaemia
  biological_scale: ORGANISM
  description: >-
    Without adrenaline, the counter-regulatory response to falling glucose is lost, and
    patients experience recurrent symptomatic hypoglycaemia from infancy. In one
    reported patient it was severe enough to prompt a partial pancreatectomy at age
    three - which did not help, since the defect is in the counter-regulation rather
    than in insulin secretion.
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DβH and CYB561 deficiency are both characterized by orthostatic hypotension,
      recurrent hypoglycemia and low norepinephrine levels.
    explanation: >-
      Places recurrent hypoglycaemia alongside the orthostatic hypotension as a defining
      feature rather than an incidental one.
  downstream:
  - target: Recurrent Hypoglycaemia
    causal_link_type: DIRECT
    description: The clinical manifestation of the lost counter-regulatory response.

- name: Recurrent Hypoglycaemia
  biological_scale: ORGANISM
  description: >-
    Symptomatic episodes from infancy, unresponsive to partial pancreatectomy.
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient A1 underwent a partial pancreatectomy at age three years for this reason
      but she showed no improvement in these episodes.
    explanation: >-
      The failure of pancreatectomy is what localizes the problem to counter-regulation
      rather than to inappropriate insulin secretion.

- name: Orthostatic Hypotension
  biological_scale: ORGANISM
  description: >-
    Lifelong and severe enough to be life-threatening, with an abnormal blood pressure
    response to the Valsalva manoeuvre but a normal heart rate response - the pattern
    expected when the efferent noradrenergic limb alone is lost.
  evidence:
  - reference: PMID:31822578
    reference_title: "Congenital absence of norepinephrine due to CYB561 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had disabling lifelong orthostatic hypotension (OH) and impaired blood
      pressure response to the Valsalva maneuver (VM), with exaggerated hypotension
      during phase 2 and lack of overshoot during phase 4.
    explanation: >-
      Characterizes the haemodynamic deficit in the terms an autonomic laboratory would
      use.


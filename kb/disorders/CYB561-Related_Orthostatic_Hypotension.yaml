    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients 1, 2, and 3 were treated for seizures in early childhood, but it is not clear if these episodes corresponded to documented epilepsy, hypoglycemic seizures, or the tonic-clonic movements that occur during hypotensive syncope.

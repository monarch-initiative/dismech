- phase: Reported long-term outcomes
  notes: The Dutch index patient died at 37 after prolonged circulatory arrest while off droxidopa. The two American sisters died at 59 and 48 of unascertained causes; their unconfirmed brother died at 16. These observations do not establish a survival distribution, a mortality frequency, or protection from death by treatment. The additional male patient was stable and had fathered a healthy child at reported follow-up.
  evidence:
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both American patients (A1 and A2) were lost to follow up and died of unknown cause at age 59 and 48, respectively
    explanation: A historical outcome in the founding series; case counts and causes do not establish population life expectancy or treatment-related survival benefit.
  - reference: PMID:29343526
    reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four years after presentation, patient D1 suddenly lost consciousness with a prolonged circulatory arrest (while she was off L-DOPS treatment). After resuscitation measures and administration of a low-dose epinephrine, her blood pressure quickly recovered, but she had incurred severe brain damage and died after being in coma for five days
    explanation: A historical outcome in the founding series; case counts and causes do not establish population life expectancy or treatment-related survival benefit.

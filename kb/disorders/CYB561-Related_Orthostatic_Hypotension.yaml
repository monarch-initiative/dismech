  frequency: FREQUENT
  description: >-
    Three of the four molecularly confirmed patients are dead: D1 at 37 after a
    prolonged circulatory arrest sustained while off droxidopa, and the two American
    sisters at 59 and 48 of causes never established. The fourth is alive with
    progressive renal insufficiency. An unconfirmed brother of the American sisters
    also died, at 16, but predates the molecular diagnosis and is not counted here.
    Recorded because it distinguishes this disease from the one it phenocopies, where
    life expectancy is not described as reduced.
  evidence:
  - reference: PMID:29343526
    reference_title: "Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Instead, the syndrome in our patients appears to be more malignant in terms of
      renal insufficiency and reduced life expectancy, either due to hypotensive crises

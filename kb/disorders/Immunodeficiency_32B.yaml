treatments:
- name: Hematopoietic stem-cell transplantation
  description: >
    Allogeneic hematopoietic stem-cell transplantation is the only definitive treatment for
    complete IRF8 deficiency: it restores the missing mononuclear phagocyte lineage from
    donor cells. The index patient required transplantation, and reported patients have been
    cured by cord blood or stem-cell transplant; untransplanted complete deficiency is fatal
    in infancy.
  treatment_term:
    preferred_term: hematopoietic stem-cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY

phenotypes:
- category: Immunologic
  name: Decreased total monocyte count
  description: >
    Circulating monocytes are absent, reflecting the IRF8-dependent block in monocyte
    development. Monocytopenia together with absent dendritic cells is the diagnostic
    hematological signature of the disease.
  phenotype_term:
    preferred_term: Monocytopenia
    term:
      id: HP:0012312
      label: Decreased total monocyte count
  evidence:
  - reference: PMID:35338423
    reference_title: "Pulmonary Alveolar Proteinosis and Multiple Infectious Diseases in a Child with Autosomal Recessive Complete IRF8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had no blood monocytes or dendritic cells, associated with neutrophilia,
      and normal counts of NK and other lymphoid cell subsets.
    explanation: >-
      Reports the absence of blood monocytes directly in an AR complete IRF8 deficiency
      patient.
- category: Immunologic
  name: Absent circulating dendritic cells
  description: >
    Both conventional and plasmacytoid dendritic cells are absent from blood, removing the
    principal antigen-presenting compartment. In the milder autosomal dominant IRF8 disorder
    the depletion is selective (CD11c+CD1c+ dendritic cells); in IMD32B it is complete.
  phenotype_term:
    preferred_term: Absent circulating dendritic cells
    term:
      id: HP:0020178
      label: Abnormal dendritic cell count
  evidence:
  - reference: PMID:29128673
    reference_title: "Biallelic interferon regulatory factor 8 mutation: A complex immunodeficiency syndrome with dendritic cell deficiency, monocytopenia, and immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DC deficiency and monocytopenia were observed in blood, dermis, and lung lavage fluid.
    explanation: >-
      Documents dendritic cell deficiency alongside monocytopenia in biallelic IRF8
      deficiency.
- category: Infectious
  name: Disseminated BCG disease
  description: >
    Disseminated disease caused by the M. bovis BCG vaccine strain after routine
    vaccination. Because BCG is often the first mycobacterial challenge an infant meets,
    disseminated BCG disease is a common presenting event of complete IRF8 deficiency.
  phenotype_term:
    preferred_term: BCGosis

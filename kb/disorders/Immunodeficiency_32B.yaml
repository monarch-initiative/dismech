prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Autosomal recessive complete IRF8 deficiency is exceedingly rare. At the time of the
    Rosain et al. report only three unrelated patients had been described (from Ireland,
    England and China), with the Argentinian patient in that paper the fourth. No
    population rate can be derived from a handful of reported individuals, so the class
    is UNKNOWN rather than an ultra-rare band.
  evidence:
  - reference: PMID:35338423
    reference_title: "Pulmonary Alveolar Proteinosis and Multiple Infectious Diseases in a Child with Autosomal Recessive Complete IRF8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive (AR) complete IRF8 deficiency is a rare severe inborn error of
      immunity underlying an absence of blood myeloid mononuclear cells, intracerebral
      calcifications, and multiple infections. Only three unrelated patients have been
      reported.
    explanation: >-
      Establishes the rarity of AR complete IRF8 deficiency as a handful of reported
      cases, which is why prevalence is recorded as cases-in-literature with an unknown
      class.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    IMD32B is inherited in an autosomal recessive manner: complete IRF8 deficiency
    requires biallelic loss-of-function variants. The index case was homozygous for the
    K108E variant, present in both healthy parents in a heterozygous state; subsequent
    patients have been compound heterozygous (for example R83C/R291Q, or c.55del/R111*).
    This distinguishes IMD32B from the milder autosomal dominant IRF8 disorder
    (immunodeficiency 32A, T80A), in which a single allele produces a selective dendritic
    cell depletion rather than the complete monocyte and dendritic cell aplasia seen here.
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The K108E variant was associated with an autosomal recessive severe immunodeficiency
      with a complete lack of circulating monocytes and dendritic cells.
    explanation: >-
      States that the K108E allele underlying IMD32B is inherited in an autosomal
      recessive manner and produces the complete monocyte/dendritic cell deficiency.
genetic:
- name: IRF8
  gene_term:
    preferred_term: IRF8
    term:
      id: hgnc:5358
      label: IRF8
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    IRF8 encodes interferon regulatory factor 8, a transcription factor that controls the
    development and function of mononuclear myeloid cells. IMD32B is caused by biallelic
    loss-of-function variants: the paradigmatic allele is the homozygous missense K108E,
    which maps to the DNA-binding domain and abolishes transcriptional activity, and
    additional recessive alleles include compound-heterozygous missense (R83C, R291Q) and
    truncating (R111*, c.55del) variants, all experimentally shown to be loss-of-function
    in overexpression/luciferase assays. Loss of IRF8 removes the transcriptional
    instruction for monocyte and dendritic cell differentiation while sparing granulopoiesis,
    which expands.
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They also show that human IRF8 is critical for the development of monocytes and
      dendritic cells and for antimycobacterial immunity.
    explanation: >-
      Establishes IRF8 as the causative gene and its role in mononuclear phagocyte
      development and antimycobacterial immunity.
  - reference: PMID:35338423
    reference_title: "Pulmonary Alveolar Proteinosis and Multiple Infectious Diseases in a Child with Autosomal Recessive Complete IRF8 Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, both variants were loss-of-function in a luciferase assay, suggesting that
      the patient had AR complete IRF8 deficiency.
    explanation: >-
      Confirms that the recessive IRF8 variants are loss-of-function, the molecular basis
      for classifying this as complete IRF8 deficiency.
pathophysiology:
- name: IRF8 Biallelic Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    The initiating lesion is biallelic loss of function of IRF8. IRF8 is a sequence-specific
    DNA-binding transcription factor; the disease-causing variants map to its DNA-binding
    domain and disrupt the IRF8-DNA interaction, abolishing transcriptional activity. For
    the K108E allele this proceeds through protein destabilization: loss of the positively
    charged side chain causes loss of nuclear localization and of transcriptional activity,
    with enhanced proteasomal degradation of the misfolded protein.
  molecular_functions:
  - preferred_term: IRF8 sequence-specific DNA-binding transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failed Mononuclear Phagocyte and Dendritic Cell Development
    causal_link_type: DIRECT
    description: >-
      Loss of IRF8 transcriptional activity removes the lineage-specification signal for
      monocyte and dendritic cell differentiation.
    evidence:
    - reference: PMID:21524210
      reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They also show that human IRF8 is critical for the development of monocytes and
        dendritic cells and for antimycobacterial immunity.
      explanation: >-
        States the causal step: IRF8 is required for the development of monocytes and
        dendritic cells, the lineages that fail in this node's downstream target.
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both K108E and T80A mutations impair IRF8 transcriptional activity by disrupting the
      interaction between IRF8 and DNA.
    explanation: >-
      Functional characterization establishing that the causal variants abolish IRF8
      transcription factor activity through loss of DNA binding.
  - reference: PMID:25122610
    reference_title: "Functional characterization of the human dendritic cell immunodeficiency associated with the IRF8(K108E) mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical characterization of the IRF8(K108E) mutant in vitro shows that loss of
      the positively charged side chain at K108 causes loss of nuclear localization and
      loss of transcriptional activity
    explanation: >-
      Details the molecular mechanism of the K108E allele: loss of nuclear localization
      and transcriptional activity, the functional consequence of the loss-of-function.
- name: Failed Mononuclear Phagocyte and Dendritic Cell Development
  biological_scale: CELLULAR
  description: >
    Without IRF8, the mononuclear phagocyte lineage fails to develop. Circulating monocytes
    are absent and both conventional and plasmacytoid dendritic cells are absent from blood,
    while other lymphoid subsets are largely preserved. This is a developmental block in
    myelopoiesis rather than a signalling defect, and it defines the cellular lesion of
    IMD32B.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: conventional dendritic cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: monocyte differentiation
    term:
      id: GO:0030224
      label: monocyte differentiation
    modifier: DECREASED
  - preferred_term: dendritic cell differentiation
    term:
      id: GO:0097028
      label: dendritic cell differentiation
    modifier: DECREASED
  downstream:
  - target: Decreased total monocyte count
  - target: Absent circulating dendritic cells
  - target: Compensatory Granulocytic Hyperplasia
  - target: Impaired Antimicrobial Effector Immunity
    causal_link_type: DIRECT
    description: >-
      The mononuclear phagocytes that fail to develop are the antigen-presenting and
      macrophage-effector cells required to control intracellular and fungal pathogens, so
      their absence directly impairs antimicrobial immunity.
    evidence:
    - reference: PMID:21524210
      reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They also show that human IRF8 is critical for the development of monocytes and
        dendritic cells and for antimycobacterial immunity.
      explanation: >-
        Links the failed development of monocytes and dendritic cells to the loss of
        antimycobacterial immunity, which is this edge.
  evidence:
  - reference: PMID:21524210
    reference_title: "IRF8 mutations and human dendritic-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The K108E variant was associated with an autosomal recessive severe immunodeficiency
      with a complete lack of circulating monocytes and dendritic cells.
    explanation: >-
      Reports the complete absence of circulating monocytes and dendritic cells, the
      cellular content of this node.
  - reference: PMID:35338423
    reference_title: "Pulmonary Alveolar Proteinosis and Multiple Infectious Diseases in a Child with Autosomal Recessive Complete IRF8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had no blood monocytes or dendritic cells, associated with neutrophilia,
      and normal counts of NK and other lymphoid cell subsets.
    explanation: >-
      Independently confirms absent monocytes and dendritic cells with preserved lymphoid
      subsets, establishing the lineage-selective developmental block.
- name: Compensatory Granulocytic Hyperplasia
  biological_scale: CELLULAR
  description: >
    The block in mononuclear phagocyte development is accompanied by an expansion of the
    granulocytic compartment. IRF8 normally restrains granulopoiesis, and its loss diverts
    myeloid output toward neutrophils, producing a striking granulocytic hyperplasia and
    peripheral neutrophilia alongside the monocyte and dendritic cell aplasia.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Increased total neutrophil count
  evidence:
  - reference: PMID:25122610
    reference_title: "Functional characterization of the human dendritic cell immunodeficiency associated with the IRF8(K108E) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      absence of CD11c1 conventional dendritic cells (DCs) and CD11c1/CD1231 plasmacytoid
      DCs, and striking granulocytic hyperplasia
    explanation: >-
      Reports the granulocytic hyperplasia accompanying the dendritic cell aplasia in the
      IRF8 K108E patient.
- name: Impaired Antimicrobial Effector Immunity
  biological_scale: ORGANISM
  description: >
    The net consequence is a failure of antimicrobial effector immunity. Loss of the
    monocyte/macrophage and dendritic-cell compartments removes the cells that control
    intracellular pathogens (mycobacteria), present antigen, and clear fungi, and also
    impairs IL-12 and IFN-gamma production. The result is a selective susceptibility to
    weakly virulent mycobacteria including the BCG vaccine strain, to mucocutaneous fungal
    infection, and to severe viral infection.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: Disseminated BCG disease
  - target: Recurrent mucocutaneous candidiasis
  - target: Susceptibility to severe viral infection
  - target: Pulmonary alveolar proteinosis
  evidence:
  - reference: PMID:25122610
    reference_title: "Functional characterization of the human dendritic cell immunodeficiency associated with the IRF8(K108E) mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient initially presented with severe disseminated mycobacterial and
      mucocutaneous fungal infections and was ultimately cured by cord blood transplant.
    explanation: >-
      Documents the organism-level infectious phenotype: disseminated mycobacterial and
      mucocutaneous fungal infection resulting from the loss of antimicrobial effector
      immunity.

name: Immunodeficiency 32B
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
synonyms:
- IMD32B
- Autosomal recessive IRF8 deficiency
- IRF8 deficiency, autosomal recessive
- Monocyte and dendritic cell deficiency, autosomal recessive
- Recessive IRF8 dendritic cell immunodeficiency
description: >
  Immunodeficiency 32B (IMD32B) is an autosomal recessive inborn error of immunity
  caused by biallelic loss-of-function variants in IRF8, the gene encoding interferon
  regulatory factor 8, a transcription factor that specifies the mononuclear phagocyte
  system. Biallelic IRF8 loss abolishes the development of circulating monocytes and
  dendritic cells, producing a myeloid compartment with no blood monocytes and no
  conventional or plasmacytoid dendritic cells, and a compensatory granulocytic
  hyperplasia. Clinically it presents in infancy as a severe immunodeficiency:
  disseminated disease after Bacille Calmette-Guerin (BCG) vaccination, mucocutaneous
  candidiasis, severe viral infections and, in some patients, intracerebral
  calcification and pulmonary alveolar proteinosis. The complete deficiency is fatal
  in infancy without hematopoietic stem-cell transplantation and only a handful of
  patients have been reported.

  IMD32B is the severe, recessive pole of a two-tiered IRF8 disorder. The original
  report of Hambleton and colleagues (2011) described two distinct IRF8 alleles: a
  homozygous K108E variant causing autosomal recessive severe immunodeficiency with a
  complete lack of circulating monocytes and dendritic cells (this entry, IMD32B), and
  a T80A variant causing a milder, autosomal dominant immunodeficiency with selective
  depletion of CD11c+CD1c+ dendritic cells (immunodeficiency 32A, MONDO:0009193, curated
  separately). Both alleles map to the DNA-binding domain and impair IRF8 transcriptional
  activity by disrupting the IRF8-DNA interaction; the two forms differ in dose (biallelic
  versus monoallelic) and hence in the severity of the mononuclear-phagocyte lesion.

  The disease is mechanistically informative about human myelopoiesis: it shows that IRF8
  is non-redundantly required for the differentiation of the entire mononuclear phagocyte
  lineage in humans, and that losing the antigen-presenting and macrophage-effector
  compartment is sufficient to abolish antimycobacterial and antifungal immunity even when
  lymphoid development is otherwise preserved.

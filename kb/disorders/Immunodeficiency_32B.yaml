- name: Avoidance of live attenuated vaccines
  description: >
    Live attenuated vaccines, in particular BCG, cause disseminated disease in complete
    IRF8 deficiency and are contraindicated; avoiding them is a key preventive measure once
    the diagnosis is suspected.

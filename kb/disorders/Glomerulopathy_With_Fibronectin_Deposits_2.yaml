notes: >-
  Named with the MONDO and OMIM numbered-series label. The only gene-dyad
  form in MONDO, "FN1 fibronectin glomerulopathy", is a synonym generated
  from MONDO's disease-series-by-gene design pattern, and a PubMed search for
  "FN1-related" OR "FN1-associated" with glomerulopathy returned one 2026
  case report (PMID:42675453), so no dyadic name is established. Disease
  onset ranges from 4 months to 88 years (PMID:42068364). One family with
  FN1 p.Tyr973Cys included three relatives who died of cerebral hemorrhage
  or stroke in their thirties (PMID:33837952), and fibronectin was
  increased in gastric extracellular matrix in one child (PMID:42068364);
  whether the disease is systemic is unresolved, so neither is curated as a
  phenotype. No animal model of FN1 glomerulopathy is reported. No
  GeneReviews chapter covers this disease; the only FN1 chapter
  (PMID:32200603) is for spondylometaphyseal dysplasia, corner fracture
  type, a separate allelic disorder.

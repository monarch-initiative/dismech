- name: Reduced Solubility of Circulating Variant Plasma Fibronectin
  biological_scale: MOLECULAR
  description: >-
    Plasma fibronectin is a soluble dimer secreted by hepatocytes. Variants
    are proposed to disturb the interaction between the Hep-II and Hep-III
    domains, lowering the solubility of plasma fibronectin so that it
    deposits in tissue. Direct tests of recombinant variant proteins found
    only minor effects on conformation and matrix assembly, so this step
    remains a hypothesis.
  cell_types:

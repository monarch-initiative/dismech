name: Glomerulopathy With Fibronectin Deposits 2
creation_date: "2026-11-12T18:20:00Z"
category: Mendelian
parents:
- Fibronectin Glomerulopathy
- Glomerular Disease
- Hereditary Kidney Disease
disease_term:
  preferred_term: glomerulopathy with fibronectin deposits 2
  term:
    id: MONDO:0011165
    label: glomerulopathy with fibronectin deposits 2
synonyms:
- GFND2
- FN1 fibronectin glomerulopathy
- FN1-associated fibronectin glomerulopathy
- fibronectin glomerulopathy caused by mutation in FN1
- glomerulopathy with fibronectin deposits type 2
- glomerular nephritis familial with fibronectin deposits
description: >-
  Glomerulopathy with fibronectin deposits 2 is the FN1-associated form of
  fibronectin glomerulopathy, a rare autosomal dominant kidney disease with
  age-related and incomplete penetrance. Heterozygous missense, small in-frame
  deletion and splice-site variants in FN1 cluster in the heparin-binding
  domains (most often Hep-II and Hep-III, with p.Tyr973Cys the commonest
  allele) and less often in the integrin-binding domain. The deposited
  fibronectin is the soluble plasma form made by hepatocytes, and it is laid
  down in massive amounts in the glomerular mesangium and subendothelial
  space, together with fibulin, usually without immunoglobulin or
  complement. The glomeruli become enlarged and lobular with mesangial
  hypercellularity, a pattern often first read as membranoproliferative
  glomerulonephritis. Patients present at any age, most often between 20
  and 50 years, with proteinuria that is frequently in the nephrotic range,
  microscopic hematuria and hypertension; about a fifth progress to kidney
  failure over years to decades. Because the abnormal fibronectin
  circulates, the deposits can recur in a kidney allograft. Treatment is
  supportive, with renin-angiotensin system blockade and SGLT2 inhibition;
  responses to glucocorticoids and other immunosuppressants are
  inconsistent.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous FN1 variants cosegregate with disease in families, with
    father-to-son transmission reported.
  evidence:
  - reference: PMID:18268355
    reference_title: "Mutations in FN1 cause glomerulopathy with fibronectin deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the FN1 in 15 unrelated pedigrees and found three heterozygous missense mutations, the W1925R, L1974R, and Y973C, that cosegregated with the disease in six pedigrees."
    explanation: >-
      Heterozygous FN1 variants cosegregate with disease in several pedigrees.
  - reference: PMID:31419955
    reference_title: "A novel single amino acid deletion impairs fibronectin function and causes familial glomerulopathy with fibronectin deposits: case report of a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, the c.5962_5964del:p.1988_1988del variant was also found in the father but not detected in the non-affected mother, two brothers and sister"
    explanation: >-
      Father-to-son transmission of a heterozygous in-frame deletion, absent
      from unaffected relatives.
- name: Incomplete and age-related penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Penetrance rises with age, and some heterozygous carriers in affected
    families remain without urinary abnormalities.
  evidence:
  - reference: PMID:18268355
    reference_title: "Mutations in FN1 cause glomerulopathy with fibronectin deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glomerulopathy with fibronectin (FN) deposits (GFND) is an autosomal dominant disease with age-related penetrance"
    explanation: >-
      States age-related penetrance in the study that identified FN1.
  - reference: PMID:27056061
    reference_title: "Identification of mutations in FN1 leading to glomerulopathy with fibronectin deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected patients developed urine abnormalities during the first or second decade of life, and some mutation carriers were completely asymptomatic."
    explanation: >-
      Asymptomatic carriers in a 12-family series show incomplete penetrance.
prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 literature review counted about 130 reported cases of fibronectin
    glomerulopathy in nearly 100 families; of 72 patients tested for FN1, 68
    carried an FN1 variant. No population-based estimate exists.
  evidence:
  - reference: PMID:42068364
    reference_title: "Rapidly progressive pediatric fibronectin glomerulopathy driven by a novel FN1 mutation (p.Thr1917del): implications for early diagnosis and recognition of systemic involvement."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature search identified approximately 130 reported cases of FNG worldwide, involving nearly 100 families."
    explanation: >-
      Count of reported cases of fibronectin glomerulopathy worldwide.
  - reference: PMID:42068364
    reference_title: "Rapidly progressive pediatric fibronectin glomerulopathy driven by a novel FN1 mutation (p.Thr1917del): implications for early diagnosis and recognition of systemic involvement."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-two patients (Table 1) underwent FN1 gene testing, of which 68 cases detected FN1 variant sites"
    explanation: >-
      Most genetically tested reported patients carry an FN1 variant.
genetic:
- name: FN1
  gene_term:
    preferred_term: FN1
    term:
      id: hgnc:3778
      label: FN1
  notes: >-
    Heterozygous missense, small in-frame deletion and splice-site variants.
    Reported alleles include p.Tyr973Cys (c.2918A>G), the most frequent,
    p.Trp1925Arg, p.Leu1974Arg, p.Leu1974Pro, p.Pro969Leu, p.Trp1017Cys,
    p.Ile1988del, the integrin-binding-domain p.Pro1472del, and the intron 36
    splice variant c.5888-2A>G. relationship_type is deliberately left
    unset: the schema defines CAUSATIVE as corresponding to ClinGen
    Definitive or Strong, and ClinGen rates this gene-disease pair Moderate.
    FN1 is not the only cause of fibronectin glomerulopathy: linkage in a
    large kindred excluded the FN1 region, and a separate locus defines
    glomerulopathy with fibronectin deposits 1.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_3ffbb09f-bf2d-4d76-9176-4961ce8862e9-2023-10-04T160000.000Z
    evidence:
    - reference: CGGV:assertion_3ffbb09f-bf2d-4d76-9176-4961ce8862e9-2023-10-04T160000.000Z
      reference_title: "FN1 / glomerulopathy with fibronectin deposits 2 (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FN1 | HGNC:3778 | glomerulopathy with fibronectin deposits 2 | MONDO:0011165 | AD | Moderate"
      explanation: >-
        ClinGen Glomerulopathy GCEP classifies FN1 in autosomal dominant GFND2
        as Moderate.
  evidence:
  - reference: PMID:18268355
    reference_title: "Mutations in FN1 cause glomerulopathy with fibronectin deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall dominant mutations in FN1 accounted for 40% of cases of GFND in our study group."
    explanation: >-
      FN1 variants explain a substantial share of familial GFND.
  - reference: PMID:27056061
    reference_title: "Identification of mutations in FN1 leading to glomerulopathy with fibronectin deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected p.Tyr973Cys, p.Pro1472del, and p.Leu1974Pro mutations in multiple families, and haplotype analysis implied that p.Pro1472del and p.Leu1974Pro are founder mutations."
    explanation: >-
      Recurrent and founder FN1 alleles in Japanese families.
  - reference: PMID:29131116
    reference_title: "Detection of a Splice Site Variant in a Patient with Glomerulopathy and Fibronectin Deposits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intronic variants can cause GFND."
    explanation: >-
      An intronic splice-site variant (c.5888-2A>G) causes an in-frame
      12 bp deletion and the disease.
  - reference: PMID:42068364
    reference_title: "Rapidly progressive pediatric fibronectin glomerulopathy driven by a novel FN1 mutation (p.Thr1917del): implications for early diagnosis and recognition of systemic involvement."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.2918A > G variant was the most prevalent, accounting for 27.78% (20/72) of cases."
    explanation: >-
      p.Tyr973Cys is the most frequent allele in a pooled analysis.
  - reference: PMID:8723129
    reference_title: "Glomerulopathy associated with predominant fibronectin deposits: exclusion of the genes for fibronectin, villin and desmin as causative genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This result excludes fibronectin, villin, and desmin from being the causative genes for GFD in this large kindred."
    explanation: >-
      Locus heterogeneity: FN1 is excluded in at least one large kindred, so
      not every fibronectin glomerulopathy is this FN1 disease.
  - reference: PMID:10964510
    reference_title: "Molecular cloning of the critical region for glomerulopathy with fibronectin deposits (GFND) and evaluation of candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have recently localized a gene locus for GFND to human chromosome 1q32 by total genome linkage analysis in a large kindred"
    explanation: >-
      The non-FN1 locus on 1q32 defines GFND1, separate from this entry.

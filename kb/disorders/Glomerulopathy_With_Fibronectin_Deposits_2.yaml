    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic confirmation requires, in addition to the TEM findings, strong plasma fibronectin isoform staining in mesangium and capillary loops."
    explanation: >-
      Fibronectin immunostaining confirms the diagnosis.
  - reference: PMID:42068364
    reference_title: "Rapidly progressive pediatric fibronectin glomerulopathy driven by a novel FN1 mutation (p.Thr1917del): implications for early diagnosis and recognition of systemic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend performing fibronectin immunohistochemistry when kidney biopsy reveals the following characteristics: glomerular enlargement with lobular configuration observed by light microscopy"
    explanation: >-
      Histologic triggers for fibronectin staining.

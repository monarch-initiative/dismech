- name: Kidney biopsy with fibronectin immunostaining
  description: >-
    Biopsy shows enlarged lobular glomeruli with PAS-positive, fuchsinophilic
    mesangial and subendothelial deposits that are negative for Congo red and
    immunoglobulins. Strong staining for fibronectin, particularly with an
    antibody recognising plasma fibronectin, or mass-spectrometric detection
    of fibronectin in microdissected glomeruli establishes the diagnosis.
  diagnosis_term:
    preferred_term: kidney biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:

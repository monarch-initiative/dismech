name: Platelet-type Bleeding Disorder 16
creation_date: "2026-09-30T19:45:00Z"
category: Mendelian
disease_term:
  preferred_term: platelet-type bleeding disorder 16
  term:
    id: MONDO:0008552
    label: platelet-type bleeding disorder 16
description: >
  Platelet-type bleeding disorder 16 (BDPLT16, OMIM #187800) is an autosomal
  dominant congenital macrothrombocytopenia with platelet anisocytosis and a
  mild to moderate, sometimes absent, mucocutaneous bleeding tendency, caused
  by heterozygous activating variants in ITGA2B, the gene encoding the alphaIIb
  subunit of the platelet fibrinogen receptor integrin alphaIIbbeta3. The
  clinical literature also calls it the dominant or variant form of Glanzmann
  thrombasthenia, or Glanzmann thrombasthenia-like syndrome, but the mechanism
  runs in the opposite direction to classic Glanzmann thrombasthenia.

  In classic Glanzmann thrombasthenia biallelic loss-of-function variants
  remove or disable the integrin, platelet count and size are normal, and
  aggregation to every physiological agonist is absent. In BDPLT16 a single
  variant in the membrane-proximal part of alphaIIb, most often at Arg995 in
  the conserved GFFKR motif (Arg1026 in HGVS numbering), weakens the inner
  membrane clasp: the salt bridge between alphaIIb Arg995 and beta3 Asp723
  that holds the receptor in its bent resting conformation. A fraction of the
  receptor pool then sits in the ligand-binding conformation without any
  inside-out signal, binding the activation-dependent antibody PAC-1 and
  fibrinogen on resting platelets that have not themselves been activated.

  Two consequences follow from that single lesion. In megakaryocytes,
  permanent integrin outside-in signalling disturbs cytoskeletal remodelling,
  and proplatelets form with fewer and larger tips, so fewer and larger
  platelets are released. In circulating platelets the constitutively engaged
  receptor is internalised, surface alphaIIbbeta3 falls to roughly half of
  normal, and agonist-induced aggregation is reduced rather than abolished.
  The resulting bleeding is milder than in classic thrombasthenia and reflects
  the reduced platelet count together with the impaired platelet function.

  Heterozygous activating variants in ITGB3 produce a clinically
  indistinguishable phenotype, and MONDO's definition of this term still names
  both genes, but OMIM curates the ITGB3 form separately as BDPLT24. This
  entry is therefore scoped to the ITGA2B form, and cites the shared
  mechanistic literature only where a source states its conclusion for
  activating alphaIIbbeta3 variants as a class.

synonyms:
- BDPLT16
- bleeding disorder, platelet-type, 16
- bleeding disorder, platelet-type, 16, autosomal dominant
- autosomal dominant Glanzmann thrombasthenia
- Glanzmann thrombasthenia, autosomal dominant
- thrombasthenia of Glanzmann and Naegeli, autosomal dominant
- autosomal dominant thrombasthenia of Glanzmann and Naegeli
- Glanzmann thrombasthenia-like syndrome
- ITGA2B-related macrothrombocytopenia
- ITGA2B/ITGB3-related thrombocytopenia

parents:
- Inherited bleeding disorder, platelet-type
- Inherited blood coagulation disorder
- Congenital macrothrombocytopenia

notes: >
  Gene scope. MONDO's definition of MONDO:0008552 names heterozygous variants
  in ITGA2B or ITGB3. OMIM, as mirrored by MedGen UID 1781222, restricts
  BDPLT16 to ITGA2B and curates the ITGB3 form as BDPLT24 (OMIM 619271,
  MONDO:0030996), which has its own entry in the curation queue. This entry
  follows OMIM: ITGA2B is the causal gene, and ITGB3 appears only in prose and
  in mechanistic evidence a source states for activating alphaIIbbeta3
  variants as a class. The ITGB3 dominant form is deliberately not curated
  here as a subtype, since it has its own MONDO term and would then be
  modelled twice.

  Relationship to Glanzmann thrombasthenia. The Glanzmann_Thrombasthenia entry
  already records this disorder as a differential diagnosis with the opposite
  mechanism, increased rather than lost integrin activation. The two share
  their genes but not their mechanism, so a variant in ITGA2B is by itself
  diagnostic of neither: the zygosity, the platelet count and size, and
  whether aggregation is reduced or absent decide it. A StatPearls chapter
  exists for Glanzmann thrombasthenia and matches one of this entry's
  synonyms, but it is about the recessive disease and is not a baseline for
  this one. No GeneReviews chapter names this disease.

  Treatment evidence is thin and mostly extrapolated. The three treatments
  curated here are the ones a source states for this disorder or for inherited
  platelet disorders as a class. Recombinant activated factor VII and hormonal
  control of heavy menstrual bleeding are both used in this disease family, but
  the published series describing them are in Glanzmann thrombasthenia, a
  different disease with a different mechanism and a much more severe bleeding
  phenotype, so they are not curated here as treatments of this disorder.
  Avoidance of aspirin, NSAIDs and P2Y12 inhibitors is standard advice across
  inherited platelet disorders and is likewise not curated, because no cited
  source states it for these patients.

  Variant numbering. Two numberings are in use for alphaIIb. Legacy numbering
  of the mature protein gives Arg995, Gly991 and Phe993; HGVS numbering on
  NM_000419, which counts the signal peptide, gives Arg1026, Gly1022 and
  Phe1024. R995W and R1026W are the same substitution, and the largest series
  prints both.

  Constitutive activation is the leading mechanism but is not uniform. It is
  well shown for R995W, G991C and F993del in transfected cells, yet the first
  variant described, R995Q, did not lock the transfected receptor into a high
  activation state, and in the largest single-centre series constitutive
  activation was detected in a minority of patients and at a similar rate in
  healthy controls. Both observations are curated as REFUTE evidence on the
  activation node rather than left out.

  Phenotypes deliberately not curated. MONDO's definition mentions a prolonged
  bleeding time; no cached source reports a bleeding time in an ITGA2B variant
  carrier, so it is not curated. One European-ancestry family carrying the
  recurrent p.Arg1026Trp variant had thrombocytopenia with normal platelet
  size, which is why macrothrombocytopenia is curated as VERY_FREQUENT rather
  than OBLIGATE. The enlarged, sometimes fusing alpha-granules described in
  ITGA2B R995W families are curated as a phenotype, but whether they
  characterise all salt-bridge variants was left open by the authors who
  described them.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population estimate exists for this disorder. ITGA2B-related
    macrothrombocytopenia is known from a small number of families: four
    unrelated Japanese families carrying R995W in the first molecular series,
    three further families in a Japanese series of novel alleles, a later
    series of three families of which two carry R995W, one
    European-ancestry family in which the same allele arose on a different
    haplotype, and five Portuguese families in the largest single-centre
    series. Because the bleeding is mild and the platelet count often only
    moderately reduced, affected families are readily misclassified as immune
    thrombocytopenia or left undiagnosed.
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel, conserved heterozygous ITGA2B R995W mutation in 4 unrelated families."
    explanation: >-
      The first molecular series is four families, which is the order of
      magnitude the whole literature works at; no source gives a denominator.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 7 missense variants: 3 in ITGA2B (5 families), and 4 in ITGB3 (5 families)."
    explanation: >-
      The largest single-centre series contributes five ITGA2B families, which
      shows how few are on record.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous ITGA2B variants segregating with macrothrombocytopenia across
    generations. The dominance follows from the mechanism: one activating
    allele is enough to put part of the integrin pool into a constitutively
    active conformation, and what that state then does to megakaryocyte
    cytoskeletal signalling does not require the second allele to be affected.
    Penetrance for the platelet phenotype is high within reported families,
    while bleeding severity varies and some carriers report no bleeding at all.
  evidence:
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three new families with autosomal dominant (AD) MTP, two harboring the same mutation of ITGA2B, αIIbR995W, and a third family with an ITGB3 mutation, β3D723H."
    explanation: >-
      Two autosomal dominant macrothrombocytopenia families carrying the
      recurrent ITGA2B allele.
  - reference: PMID:31119735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing showed that the ITGA2B variant was present in heterozygous form in all affected family members and was absent in all unaffected family members."
    explanation: >-
      Co-segregation of the heterozygous variant with the trait in a
      four-generation family, backed by linkage analysis.

mechanistic_hypotheses:
- hypothesis_group_id: constitutive_aiibb3_activation
  hypothesis_label: Constitutive Partial alphaIIbbeta3 Activation Disturbing Megakaryocyte and Platelet Cytoskeleton
  status: CANONICAL
  description: >-
    A heterozygous variant at the membrane-proximal region of alphaIIb weakens
    the alphaIIb Arg995-beta3 Asp723 inner membrane clasp that keeps the
    integrin bent and inactive. Part of the receptor pool becomes partially and
    constitutively active and signals outside-in without ligand engagement,
    phosphorylating focal adhesion kinase and lowering RhoA activity. In
    megakaryocytes that disorganises cytoskeletal remodelling, and proplatelets
    form with fewer and larger tips, which is macrothrombocytopenia. In
    circulating platelets it drives internalisation of the receptor and arrests
    actin turnover, so surface alphaIIbbeta3 and agonist-induced aggregation
    both fall. CANONICAL because patient platelets, transfected cell lines,
    transduced murine megakaryocytes and patient-derived megakaryocytes agree
    on it; its limit is that constitutive activation is not demonstrable for
    every reported allele or in every patient.

pathophysiology:
- name: ITGA2B Membrane-Proximal Activating Variants
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >
    Heterozygous germline missense variants and small in-frame deletions in
    ITGA2B, clustered at the membrane-proximal part of alphaIIb: the
    cytoplasmic GFFKR motif (R995W, R995Q, G991C and F993del in legacy
    numbering) and, less often, the transmembrane domain, where p.Gly1007Val
    substitutes one of the glycines of the outer membrane clasp. R995W is the
    recurrent allele and has arisen at least twice independently, on Japanese
    and European haplotypes. The conformance target is the module's
    component-loss node read in its "dysfunctional" sense: the receptor is
    present and it is the wrong shape, which is also why a compound
    heterozygote carrying G991C opposite a nonsense allele sits at the severe,
    thrombasthenia-like end of the spectrum.
  genes:
  - preferred_term: ITGA2B
    term:
      id: hgnc:6138
      label: ITGA2B
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    description: >-
      Heterozygous germline activating variants in ITGA2B. The functional
      category is gain of function because the variant raises the activation
      state of the receptor rather than removing it, which is the mechanistic
      inverse of the biallelic loss-of-function variants that cause classic
      Glanzmann thrombasthenia in the same gene.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel, conserved heterozygous ITGA2B R995W mutation in 4 unrelated families."
    explanation: >-
      The recurrent heterozygous ITGA2B allele that defines the molecular
      entity.
  - reference: PMID:9834222
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequencing showed a heterozygous mutation giving rise to amino acid substitution R995 to Q in the GFFKR sequence of the cytoplasmic domain of IIb"
    explanation: >-
      The first natural variant found in the alphaIIb GFFKR motif, in the
      patient originally reported with giant platelets and a mild Glanzmann
      thrombasthenia-like syndrome.
  - reference: PMID:24498605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two mutations in highly conserved Gly-Phe-Phe-Lys-Arg sequence in juxtamembrane region of αIIb"
    explanation: >-
      Extends the allelic series in the same motif to G991C and F993del.
  - reference: PMID:31119735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrated that the ITGA2B R1026W mutation arose on a different haplotype compared to the previous reports, strongly supporting at least 2 independent origins for this same point mutation"
    explanation: >-
      Two independent origins of the recurrent allele, which is also the
      argument against the causal variant being something else in linkage
      with it.
  downstream:
  - target: Disruption of the alphaIIb-beta3 Inner Membrane Clasp
    causal_link_type: DIRECT
    description: >-
      The substituted residues are the ones that form or position the
      alphaIIb Arg995-beta3 Asp723 salt bridge.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:29090484
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "In silico analysis shows how the two mutated amino acids directly modify the salt bridge linking the intra-cytoplasmic part of αIIb to β3 of the integrin αIIbβ3."
      explanation: >-
        Structural modelling connecting the ITGA2B R995W substitution to the
        salt bridge, in the paper that reports two families carrying it.

- name: Disruption of the alphaIIb-beta3 Inner Membrane Clasp
  biological_scale: MOLECULAR
  description: >
    In a resting platelet alphaIIbbeta3 is held bent and closed by two
    inter-subunit constraints, the transmembrane outer membrane clasp and the
    cytoplasmic inner membrane clasp, whose key contact is the salt bridge
    between alphaIIb Arg995 and beta3 Asp723. Physiological activation requires
    that clasp to open, so a variant that weakens it lowers the threshold for
    the conformational change rather than adding a new activity.
  cellular_components:
  - preferred_term: integrin alphaIIb-beta3 complex
    term:
      id: GO:0070442
      label: integrin alphaIIb-beta3 complex
  evidence:
  - reference: PMID:22102273
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Significantly, Arg995 and Asp723 form a salt linkage binding the cytoplasmic tails of αIIbβ3 together keeping the integrin in a bent resting state."
    explanation: >-
      The structural role of the residue the recurrent ITGA2B variant
      replaces, stated in the review that defined this disease group.
  - reference: PMID:41503871
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The αIIbArg995/β3Asp723 salt bridge is a critical structure for maintaining the resting conformation of αIIbβ3."
    explanation: >-
      A recent review restating the same constraint, and the frame in which
      both genes' membrane-proximal variants are read.
  downstream:
  - target: Constitutive Partial alphaIIbbeta3 Activation
    causal_link_type: DIRECT
    description: >-
      Without the clasp, the receptor can reach its ligand-binding
      conformation with no inside-out signal.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:22102273
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Mutations weakening this link (if not abolishing it) increase the activation state of αIIbβ3 and interfere with megakaryocytopoiesis."
      explanation: >-
        States this edge, and in the same sentence the megakaryocyte
        consequence two nodes further down.

- name: Constitutive Partial alphaIIbbeta3 Activation
  biological_scale: MOLECULAR
  description: >
    Part of the surface receptor pool sits in a high-affinity state on resting
    platelets: PAC-1 and soluble fibrinogen bind without an agonist, and
    without P-selectin appearing, so the integrin is active while the platelet
    is not. In transfected cells the activation state conferred by alphaIIb
    R995W is higher than for the beta3 D723H salt-bridge variant and weaker
    than for the strongly activating beta3 N562 mutant, which is what "partial"
    means here. The activation is not uniform across alleles or patients, and
    the refuting evidence on this node is the reason it is not offered as a
    diagnostic test.
  biological_processes:
  - preferred_term: integrin activation
    modifier: INCREASED
    term:
      id: GO:0033622
      label: integrin activation
  cellular_components:
  - preferred_term: integrin alphaIIb-beta3 complex
    term:
      id: GO:0070442
      label: integrin alphaIIb-beta3 complex
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was spontaneous PAC-1 and fibrinogen binding to resting platelets without CD62p expression."
    explanation: >-
      The observation in patient platelets: an active receptor on a platelet
      that has not degranulated.
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that αIIb-W995/β3 has a constitutive, activated conformation but does not induce platelet activation."
    explanation: >-
      The authors' conclusion from transfected-cell activation assays for the
      recurrent allele.
  - reference: PMID:24498605
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All three mutations, ITGA2B p.Gly991Cys, ITGA2B p.Phe993del, and ITGB3 p.(Asp621_Glu660del), led to highly activated conformation of αIIbβ3 and spontaneous tyrosine phosphorylation of FAK in transfected cells."
    explanation: >-
      Constitutive activation demonstrated for two further ITGA2B GFFKR
      alleles.
  - reference: PMID:9834222
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Flow cytometry with PAC-1 and a stable Chinese hamster ovary-transfected cell line showed that the mutated receptor was not locked into a high activation state, although it became so in the presence of the activating antibody, anti-LIBS6."
    explanation: >-
      For R995Q the transfected receptor was not constitutively active, so
      this node is not established for every ITGA2B allele assigned to the
      disorder.
  - reference: PMID:33276370
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence for constitutive αIIbβ3 activation, occurred in 2 out of 9 patients from 8 families studied, but also in 2 out of 12 healthy controls."
    explanation: >-
      In the largest series the finding appeared in a minority of patients and
      at a similar rate in controls, so it does not separate patients from
      controls in practice.
  downstream:
  - target: Persistent alphaIIbbeta3 Outside-In Signalling
    causal_link_type: DIRECT
    description: >-
      The active receptor signals into the cell as though ligand-engaged.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:21454453
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "FAK was spontaneously phosphorylated in αIIb-W995/β3-transfected 293T cells."
      explanation: >-
        Spontaneous focal adhesion kinase phosphorylation is the outside-in
        signal measured downstream of the active R995W receptor.
  - target: Receptor Internalisation and Reduced Surface alphaIIbbeta3
    causal_link_type: DIRECT
    description: >-
      A constitutively engaged receptor is taken off the surface.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:26452979
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Here we show that constitutive activation of integrin αIIbβ3 decreases surface expression of the complex through receptor internalization and permanently triggers outside-in signaling"
      explanation: >-
        The edge itself, shown with patient platelets carrying a beta3 variant
        and with CHO cells expressing several activating alphaIIbbeta3
        variants. Graded INDIRECT because the experiments centre on ITGB3
        alleles and its application to the ITGA2B form is the class-level
        reading.

- name: Persistent alphaIIbbeta3 Outside-In Signalling
  biological_scale: CELLULAR
  description: >
    The constitutively active receptor signals continuously through the
    integrin-mediated pathway in megakaryocytes and platelets: focal adhesion
    kinase is spontaneously phosphorylated, and RhoA activity falls, which is
    the arm that couples the receptor to the cytoskeleton. In transfected
    non-haematopoietic cells the same signal produces membrane ruffling and
    abnormal cytoplasmic protrusions resembling the extensions a megakaryocyte
    makes when it forms proplatelets.
  biological_processes:
  - preferred_term: integrin-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007229
      label: integrin-mediated signaling pathway
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "αIIb-W995/β3-transfected CHO cells developed membrane ruffling and abnormal cytoplasmic protrusions."
    explanation: >-
      The morphological consequence of the signal, for the recurrent ITGA2B
      allele specifically.
  - reference: PMID:25806962
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Moreover, we showed that formation of abnormal extensions occurred also in wild-type αIIbβ3 cells when activated by activating antibody."
    explanation: >-
      Forcing a wild-type receptor into its active conformation reproduces the
      protrusions, which is what makes the active conformation rather than the
      particular variant the operative cause. Graded INDIRECT because the
      experiment uses beta3 variants and an antibody rather than an ITGA2B
      allele.
  downstream:
  - target: Abnormal Proplatelet Formation by Megakaryocytes
    causal_link_type: DIRECT
    description: >-
      The same cytoskeletal signal misdirects the terminal step of platelet
      production.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:25806962
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "These results suggest that the active conformation of αIIbβ3 can induce cytoskeletal rearrangements that lead to impaired proplatelet formation."
      explanation: >-
        States the edge from an active receptor through cytoskeletal
        rearrangement to impaired proplatelet formation; INDIRECT for the same
        reason as above.
  - target: Arrested Platelet Cytoskeletal Remodelling
    causal_link_type: DIRECT
    description: >-
      In the circulating platelet the persistent signal freezes actin turnover
      instead of remodelling it.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:26452979
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Moreover, we demonstrated that permanent triggering of αIIbβ3-mediated outside-in signaling causes an impairment of cytoskeletal reorganization arresting actin turnover at the stage of polymerization."
      explanation: >-
        The edge from persistent outside-in signalling to arrested actin
        turnover. INDIRECT because it was shown for activating ITGB3 alleles
        and is read here as a property of the activated receptor.

- name: Abnormal Proplatelet Formation by Megakaryocytes
  biological_scale: CELLULAR
  description: >
    Megakaryocyte maturation itself is normal: ploidy and early differentiation
    are unaffected, and plasma thrombopoietin is not raised. What fails is the
    terminal step. Proplatelets extend with fewer branches and abnormally large
    tips, and transduced murine megakaryocytes additionally form asymmetric
    barbell proplatelets, so each megakaryocyte yields fewer and larger
    platelets. This is the quantitative arm of the disorder, which the
    primary_hemostatic_plug_failure module deliberately does not model, so no
    node here conforms to it.
  biological_processes:
  - preferred_term: platelet formation
    modifier: DECREASED
    term:
      id: GO:0030220
      label: platelet formation
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The increased size and decreased number of proplatelet tips in αIIb-W995/β3-transduced mouse fetal liver-derived megakaryocytes indicate defective pro-platelet formation."
    explanation: >-
      The defect measured in megakaryocytes expressing the recurrent ITGA2B
      allele itself.
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the maturation and development of megakaryocytes reveal no defect in their early maturation but abnormal proplatelet formation was observed with increased size of the tips."
    explanation: >-
      Confirms in megakaryocytes from patients, two of the three families
      carrying ITGA2B R995W, that the lesion is in the terminal step and not
      in maturation.
  - reference: PMID:26452979
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "del647-686β3-transduced murine megakaryocytes generated proplatelets with a reduced number of large tips and asymmetric barbell-proplatelets, suggesting that impaired cytoskeletal rearrangement is the cause of macrothrombocytopenia."
    explanation: >-
      The same result for an activating ITGB3 allele, with the barbell
      abnormality that names the mechanism. INDIRECT because the allele is in
      the other subunit.
  downstream:
  - target: Reduced Output of Enlarged Circulating Platelets
    causal_link_type: DIRECT
    description: >-
      Fewer and larger proplatelet tips give fewer and larger platelets.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Abnormal Platelet Alpha-Granules
    causal_link_type: DIRECT
    description: >-
      Alpha-granule maturation is disturbed alongside proplatelet formation, so
      the platelets released carry abnormally large granules.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:29090484
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly, this study revealed that in addition to the classical phenotype of patients with αIIbβ3 intracytoplasmic mutations there is an abnormal maturation of α-granules."
      explanation: >-
        Places the granule abnormality alongside the proplatelet defect in the
        same patients, as a maturation problem rather than a consequence of
        platelet size.

- name: Receptor Internalisation and Reduced Surface alphaIIbbeta3
  biological_scale: CELLULAR
  description: >
    Surface alphaIIbbeta3 on patient platelets runs at roughly half of normal,
    which is the finding that first brought these patients to attention and is
    the reason they were read as having a mild form of thrombasthenia. The
    total platelet content of the receptor is much better preserved than the
    surface pool, and the missing fraction is internal: the constitutively
    engaged receptor is taken up and degraded rather than never made.
  biological_processes:
  - preferred_term: receptor internalization
    modifier: INCREASED
    term:
      id: GO:0031623
      label: receptor internalization
  cellular_components:

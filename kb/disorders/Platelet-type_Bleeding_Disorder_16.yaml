  - reference: PMID:1638023
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staining of ultrathin sections confirmed the presence of an internal pool of GP IIb-IIIa."
    explanation: >-
      Where the receptor missing from the surface actually is, demonstrated
      morphologically before the mechanism was known.
  - reference: PMID:41503871
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Persistent activation of αIIbβ3 likely triggers enhanced internalisation and lysosomal degradation, resulting in downregulated αIIbβ3 expression in platelets surface"
    explanation: >-
      The review's statement of the route, hedged as the authors hedge it.
  - reference: PMID:23926302
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "hyperactivatable platelets characterized by constitutive binding of fibrinogen to its αIIbβ3 integrin receptor, internalization of the αIIbβ3 complex, generation of platelet-derived microparticles, and changes in the quantity and subcellular localization of filamin"
    explanation: >-
      A non-genetic phenocopy: in a murine sitosterolemia model, membrane sterol
      accumulation leaves the same receptor constitutively fibrinogen-bound and
      internalised, with macrothrombocytopenia following. Graded INDIRECT
      because the mouse carries no integrin variant, which is also what makes
      the observation informative: the route from an active receptor to

      genotype.
  downstream:
  - target: Impaired Agonist-Induced Platelet Aggregation
    causal_link_type: DIRECT
    description: >-
      Fewer available fibrinogen receptors per platelet, so less
      interplatelet bridging on activation.
    hypothesis_groups:
    - constitutive_aiibb3_activation
    evidence:
    - reference: PMID:1638023
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fibrinogen-binding was analyzed by flow cytometry using platelets in whole blood or PRP and was markedly decreased."
      explanation: >-
        The functional consequence of the reduced surface pool, measured as
        fibrinogen binding in the index patient.
  - target: Decreased Platelet Surface Glycoprotein IIb-IIIa
    causal_link_type: DIRECT
    description: >-
      The flow-cytometric finding that identifies these patients.
    hypothesis_groups:
    - constitutive_aiibb3_activation

- name: Arrested Platelet Cytoskeletal Remodelling
  biological_scale: CELLULAR
  description: >
    Aggregation and spreading require actin to be turned over, not merely
    polymerised. Under permanent outside-in signalling actin turnover halts at
    the polymerisation stage, and the authors who showed this reproduced the
    patients' functional defect in normal platelets with jasplakinolide, a
    toxin that promotes nucleation and prevents depolymerisation. That
    pharmacological phenocopy is what makes the arrested cytoskeleton, rather
    than the reduced receptor number alone, the proximate cause of the platelet
    dysfunction.
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: INCREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:26452979
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The induction of actin polymerization by jasplakinolide, a natural toxin that promotes actin nucleation and prevents depolymerization of stress fibers, in control platelets produced an impairment of platelet function similar to that of patients with variant forms of dominant Glanzmann thrombasthenia."
    explanation: >-
      The phenocopy experiment. Graded INDIRECT twice over: the patients
      studied carried an ITGB3 allele, and the argument runs from a chemical
      that arrests actin turnover to the mechanism in the disease.
  - reference: PMID:26452979
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These data show that impaired cytoskeletal remodeling caused by a constitutively activated αIIbβ3 is the main effector of platelet dysfunction and macrothrombocytopenia, and thus of bleeding, in variant forms of dominant Glanzmann thrombasthenia."
    explanation: >-
      The authors' summary of where the proximate lesion sits, for this
      disease group as a whole.
  downstream:
  - target: Impaired Agonist-Induced Platelet Aggregation
    causal_link_type: DIRECT
    description: >-
      A platelet that cannot remodel its cytoskeleton cannot spread and
      consolidate an aggregate.
    hypothesis_groups:
    - constitutive_aiibb3_activation

- name: Reduced Output of Enlarged Circulating Platelets
  biological_scale: ORGANISM
  description: >
    The haematological result: a moderately reduced platelet count with a
    raised mean platelet volume and a wide platelet size distribution, often
    with giant forms on the film. Counts in reported families run from the
    twenties to the low normal range and the immature platelet fraction is
    raised, which is consistent with a production defect rather than with
    peripheral destruction. Plasma thrombopoietin is normal, and in one patient
    the count rose transiently after an influenza infection, both arguing
    against a profound global failure of thrombopoiesis.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that activating mutations in ITGA2B and ITGB3 represent the etiology of a subset of congenital macrothrombocytopenias."
    explanation: >-
      The conclusion that puts this haematological picture, rather than
      thrombasthenia, at the centre of the disease.
  - reference: PMID:24498605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that gain-of-function mutations around membrane region of αIIbβ3 lead to abnormal platelet number and morphology with impaired surface αIIbβ3 expression."
    explanation: >-
      Ties the three findings of this node and the node above, count,
      morphology and surface expression, to the same class of variant.
  downstream:
  - target: Macrothrombocytopenia
    causal_link_type: DIRECT
    description: Fewer and larger platelets, measured as a count and a volume.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Platelet Anisocytosis
    causal_link_type: DIRECT
    description: >-
      Released platelets vary widely in size because the proplatelet tips they
      come from do.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Increased Mean Platelet Volume
    causal_link_type: DIRECT
    description: The quantitative expression of the size shift.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Giant Platelets
    causal_link_type: DIRECT
    description: The extreme tail of the size distribution, seen on the film.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Fewer platelets arrive at the site of injury, which is the quantitative
      half of this disorder's contribution to the shared endpoint.
    hypothesis_groups:
    - constitutive_aiibb3_activation

- name: Impaired Agonist-Induced Platelet Aggregation
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation"
  description: >
    Aggregation and dense-granule ATP release in response to ADP, collagen,
    epinephrine and arachidonic acid are reduced, while ristocetin
    agglutination is preserved, so the lesion is in aggregation and not in
    adhesion. The reduction is partial, which is what separates this disorder
    from classic Glanzmann thrombasthenia at the bench: aggregation is
    diminished rather than absent, and the platelet function analyser closure
    times, although prolonged, never reach the values typical of
    thrombasthenia. Conformance is at the module's aggregation arm because the
    lesion is in alphaIIbbeta3 itself, with reduced surface receptor and
    reduced fibrinogen binding, rather than in an upstream arm reading out
    through aggregometry.
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: DECREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had absent to moderate bleeding, macrothrombocytopenia, low αIIbβ3 expression, impaired platelet aggregation/ATP release to physiological agonists and low expression of activation-induced binding sites on αIIbβ3 (PAC-1) and receptor-induced binding sites on its ligand (bound fibrinogen), upon stimulation with TRAP-6 and ADP."
    explanation: >-
      The laboratory phenotype of the largest series, which includes five
      ITGA2B families.
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet aggregation tended to be reduced but not absent."
    explanation: >-
      The partial character of the defect, in families carrying the recurrent
      ITGA2B allele.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly increased closure times, such as those typically found in GT, have never been observed"
    explanation: >-
      The same point measured on a different instrument, and the practical
      distinction from classic thrombasthenia.
  - reference: PMID:1638023
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In citrated platelet-rich plasma (PRP), platelet aggregation induced by adenosine diphosphate (ADP) and other agonists was much reduced."
    explanation: >-
      The finding in the index patient of the first described family, whose
      ITGA2B R995Q variant was identified six years later.
  downstream:
  - target: Impaired Platelet Aggregation
    causal_link_type: DIRECT
    description: The aggregometry readout of this mechanism.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      The qualitative half of the contribution: the platelets that do arrive
      bridge each other poorly.
    hypothesis_groups:
    - constitutive_aiibb3_activation

- name: Failure of Primary Hemostatic Plug Formation
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >
    The rate-limiting step, reached here by two routes at once: too few
    platelets, and platelets that aggregate and spread poorly. Which route
    dominates is not settled, and it matters clinically, because bleeding
    severity in reported families tracks neither the platelet count nor the
    surface receptor level closely. The plug that forms is inadequate for
    small-vessel haemostasis under challenge, while spontaneous severe
    bleeding is unusual.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:26452979
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These data show that impaired cytoskeletal remodeling caused by a constitutively activated αIIbβ3 is the main effector of platelet dysfunction and macrothrombocytopenia, and thus of bleeding, in variant forms of dominant Glanzmann thrombasthenia."
    explanation: >-
      The authors argue that the functional defect rather than the count is
      the effector of bleeding in this disease group; graded INDIRECT because
      their patients carried an ITGB3 allele and no study has separated the
      two contributions in ITGA2B carriers.
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: The clinical expression of the failed plug.
    hypothesis_groups:
    - constitutive_aiibb3_activation

- name: Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >
    Mild to moderate and provoked rather than spontaneous. Easy bruising is the
    usual background finding; the events that bring families to attention are
    haemostatic challenges, most often tonsillectomy, dental extraction and
    delivery, and in several reported families the disorder was instead found
    incidentally on a routine platelet count. Bleeding scores in the largest
    series ranged from absent to high within the same disease, and one carrier
    of a severe bleeding score had a caesarean delivery complicated by
    postpartum haemorrhage requiring intensive care and transfusion.
  evidence:
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all affected patients, the bleeding syndrome and MTP was mild to moderate."
    explanation: >-
      The severity statement for the families carrying the recurrent ITGA2B
      allele.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had absent to moderate bleeding, macrothrombocytopenia, low αIIbβ3 expression"
    explanation: >-
      The wider range seen across ten families, including patients with no
      bleeding at all.
  downstream:
  - target: Bruising Susceptibility
    causal_link_type: DIRECT
    description: The commonest manifestation, and often the only one.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Epistaxis
    causal_link_type: DIRECT
    description: Mucosal bleeding, typically reported in childhood.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Gingival Bleeding
    causal_link_type: DIRECT
    description: Mucosal bleeding, including bleeding on tooth brushing.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Menometrorrhagia
    causal_link_type: DIRECT
    description: Heavy and irregular menstrual bleeding.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Post-Partum Hemorrhage
    causal_link_type: DIRECT
    description: >-
      The most serious reported complication, and the one that has required
      transfusion and intensive care.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Prolonged Bleeding After Surgery
    causal_link_type: DIRECT
    description: >-
      Post-tonsillectomy haemorrhage is the presentation in two reported
      families.
    hypothesis_groups:
    - constitutive_aiibb3_activation
  - target: Prolonged Bleeding After Dental Extraction
    causal_link_type: DIRECT
    description: >-
      A haemostatic challenge that reveals the disorder in some carriers and
      passes uneventfully in others.
    hypothesis_groups:
    - constitutive_aiibb3_activation

phenotypes:
- category: Hematologic
  name: Macrothrombocytopenia
  description: >
    A moderately reduced platelet count with enlarged platelets, and the
    defining feature of the disorder. Counts in reported ITGA2B families run
    from about 20 to 150 x 10^9/L, most often in the 60 to 120 range, and they
    are frequently found incidentally. It is curated as very frequent rather
    than obligate because one European-ancestry family carrying the recurrent
    p.Arg1026Trp variant had autosomal dominant thrombocytopenia with normal
    platelet size, which the authors attributed to modifier differences between
    genetic backgrounds.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three new families with autosomal dominant (AD) MTP, two harboring the same mutation of ITGA2B, αIIbR995W, and a third family with an ITGB3 mutation, β3D723H."
    explanation: >-
      Macrothrombocytopenia as the presenting phenotype of two ITGA2B R995W
      families.
  - reference: PMID:31119735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to our family (European ancestry), all previously reported families (Japanese ancestry) with HT due to the ITGA2B R1026W substitution exhibit macrothrombocytopenia (thrombocytopenia with large platelet size)"
    explanation: >-
      States that every previously reported family with the recurrent allele
      had macrothrombocytopenia.
  - reference: PMID:31119735
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a family with autosomal dominant (AD) thrombocytopenia with normal platelet size."
    explanation: >-
      The exception, in a family carrying the same ITGA2B variant, which is why
      this phenotype is not curated as obligate.

- category: Hematologic
  name: Platelet Anisocytosis
  description: >
    A wide platelet size distribution on the film and a raised platelet
    distribution width, which is the morphological signature that first
    separated these families from classic Glanzmann thrombasthenia. Some
    unaffected relatives in the largest series also showed it, so it is not by
    itself diagnostic.
  phenotype_term:
    preferred_term: Platelet anisocytosis
    term:
      id: HP:0032438
      label: Platelet anisocytosis
  frequency: FREQUENT
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PB smears revealed PLT macrocytosis and anisocytosis in most of the patients analyzed"
    explanation: >-
      The frequency of the finding across ten families, five of them with
      ITGA2B variants.
  - reference: PMID:22102273
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This was brought to light by the discovery of mutations at Arg995 in αIIb and Asp723 in β3 that lead to platelet anisotropy (increased size variation) and thrombocytopenia."
    explanation: >-
      Ties the size variation specifically to the alphaIIb Arg995 variants
      this entry curates.

- category: Hematologic
  name: Increased Mean Platelet Volume
  description: >
    The quantitative expression of the platelet size shift, and the measurement
    most likely to be available from a routine analyser. In the largest series
    the median value was 13 fL against a median of 8 fL in healthy relatives.
  phenotype_term:
    preferred_term: Increased mean platelet volume
    term:
      id: HP:0011877
      label: Increased mean platelet volume
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MPV was increased (>11fL) in 28/32 patients tested (88%), with a median value of 13fL"
    explanation: >-
      The proportion and the magnitude, from which the VERY_FREQUENT band is
      taken.

- category: Hematologic
  name: Giant Platelets
  description: >
    Platelets at the extreme of the size distribution, present in a variable
    fraction of patients rather than in all, and described in the first family
    reported before the gene was known.
  phenotype_term:
    preferred_term: Giant platelets
    term:
      id: HP:0001902
      label: Giant platelets
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:1638023
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy showed a wide diversity of platelet size including giant forms."
    explanation: >-
      The morphological description in the index patient later shown to carry
      ITGA2B R995Q.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sometimes with a variable fraction of giant PLT"
    explanation: >-
      The authors' own qualification, which is the basis for the OCCASIONAL
      band rather than a higher one.

- category: Hematologic
  name: Decreased Platelet Surface Glycoprotein IIb-IIIa
  description: >
    Surface alphaIIbbeta3 measured by flow cytometry, as CD41 or CD61, runs at
    roughly 40 to 70 per cent of normal. This is the laboratory finding that
    puts ITGA2B or ITGB3 in the differential of an inherited
    macrothrombocytopenia, and the degree of reduction distinguishes the
    disorder from classic Glanzmann thrombasthenia, where surface expression is
    typically below five per cent of normal.
  phenotype_term:
    preferred_term: Decreased platelet glycoprotein IIb-IIIa
    term:
      id: HP:0001975
      label: Decreased platelet glycoprotein IIb-IIIa
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:21454453
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The surface expression of platelet αIIbβ3 was decreased to 50% to 70% of control."
    explanation: >-
      The measured range in the four families carrying the recurrent ITGA2B
      allele.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "decreased expression of αIIbβ3 (around half of the normal)"
    explanation: >-
      The same finding in the largest series, in the subgroup defined by
      variants at the alphaIIb Arg1026 residue.

- category: Hematologic
  name: Impaired Platelet Aggregation
  description: >
    Reduced, not absent, aggregation and dense-granule ATP release to ADP,
    collagen, epinephrine and arachidonic acid, with normal ristocetin
    agglutination. The pattern is the diagnostic one for this disorder, and the
    partial character of the reduction is what separates it at the bench from
    classic Glanzmann thrombasthenia.
  phenotype_term:
    preferred_term: Impaired platelet aggregation
    term:
      id: HP:0003540
      label: Impaired platelet aggregation
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired platelet aggregation/ATP release to physiological agonists"
    explanation: >-
      The laboratory phenotype reported for the series as a whole.
  - reference: PMID:1638023
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aggregation of washed platelets with ADP was improved but remained subnormal, as was aggregation with collagen and thrombin."
    explanation: >-
      The agonist pattern in the index patient, including the partial
      correction on washing that distinguishes it from an absent response.

- category: Hematologic
  name: Abnormal Platelet Alpha-Granules
  description: >
    Enlarged alpha-granules, some giant and showing signs of fusion, on
    electron microscopy of large round platelets. It was described in families
    carrying salt-bridge variants including ITGA2B R995W, and the authors left
    open whether it characterises every variant that disturbs the alphaIIb
    Arg995 to beta3 Asp723 bridge.
  phenotype_term:
    preferred_term: Abnormal alpha granules
    term:
      id: HP:0012483
      label: Abnormal alpha granules
  evidence:
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy associated with a morphometric analysis revealed large round platelets; a feature being the presence of abnormal large α-granules with some giant forms showing signs of fusion."
    explanation: >-
      The morphometric description in the families reporting this finding, two
      of the three carrying ITGA2B R995W.
  - reference: PMID:29090484
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is now necessary to determine if this feature is a characteristic of all mutations disturbing the αIIb R995/β3 D723 salt bridge."
    explanation: >-
      The authors' own limit on how far the finding generalises, which is why
      no frequency is set here.

- category: Hematologic
  name: Bruising Susceptibility
  description: >
    Easy bruising with minor or no trauma, the commonest clinical manifestation
    and in several reported carriers the only one.
  phenotype_term:
    preferred_term: Bruising susceptibility
    term:
      id: HP:0000978
      label: Bruising susceptibility
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hemorrhagic symptoms consisted of easy bruising and menometrorrhagia, and she had no history of surgeries."
    explanation: >-
      The index patient of family 5, one of the five ITGA2B families in this
      series.
  - reference: PMID:24498605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since her bleeding diathesis with easy epistaxis, bruising, and hemostatic difficulty after teeth extraction became worse at 9 years of age, she was referred to our hospital."
    explanation: >-
      The clinical picture in the most severely affected reported case, a
      compound heterozygote for ITGA2B p.Gly991Cys and a nonsense allele.

- category: Hematologic
  name: Epistaxis
  description: >
    Nosebleeds, typically reported in childhood and sometimes described as
    severe, which is the usual mucosal manifestation of a platelet-type
    bleeding disorder.
  phenotype_term:
    preferred_term: Epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He reported bleeding after tonsillectomy at 7 years of age and epistaxis in childhood, as well as easy ecchymosis and gingival bleeding."
    explanation: >-
      The index patient of family 4, who carries the ITGA2B p.Arg1026Gln
      variant.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He reported severe epistaxis as a child, but he had had multiple dental extractions without hemorrhage; there was no history of surgeries."
    explanation: >-
      The index patient of family 3, carrying the recurrent ITGA2B allele, and
      an illustration of how selectively the bleeding presents.

- category: Hematologic
  name: Gingival Bleeding
  description: >
    Bleeding from the gums, including on tooth brushing, reported in several
    carriers in the largest series.
  phenotype_term:
    preferred_term: Gingival bleeding
    term:
      id: HP:0000225
      label: Gingival bleeding
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as easy ecchymosis and gingival bleeding"
    explanation: >-
      The index patient of family 4, carrying an ITGA2B variant at Arg1026.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she also reported bleeding after tooth brushing and easy bruising without trauma"
    explanation: >-
      The mother in family 2, who carries the recurrent ITGA2B allele and had
      the highest bleeding score in that family.

- category: Reproductive
  name: Menometrorrhagia
  description: >
    Heavy and irregular menstrual bleeding, which in inherited platelet
    disorders generally is the manifestation with the most cumulative
    morbidity and the usual route to iron deficiency.
  phenotype_term:
    preferred_term: Menometrorrhagia
    term:
      id: HP:0400008
      label: Menometrorrhagia
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hemorrhagic symptoms consisted of easy bruising and menometrorrhagia, and she had no history of surgeries."
    explanation: >-
      The index patient of family 5, diagnosed at 16 years of age.

- category: Reproductive
  name: Post-Partum Hemorrhage
  description: >
    The most serious complication reported in this disorder. One carrier of the
    recurrent ITGA2B variant required labour induction for thrombocytopenia and
    had a caesarean delivery complicated by postpartum haemorrhage needing
    intensive care and red cell and platelet transfusion; other carriers in the
    same series delivered without bleeding, so the risk is real but not
    uniform.
  phenotype_term:
    preferred_term: Post-partum hemorrhage
    term:
      id: HP:0011891
      label: Post-partum hemorrhage
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cesarean delivery had been complicated by postpartum hemorrhage, demanding hospitalization in Intensive Care, and RBC and PLT transfusions"
    explanation: >-
      The severe obstetric course in the mother of the family 2 index case,
      who carries the recurrent ITGA2B allele.

- category: Hematologic
  name: Prolonged Bleeding After Surgery
  description: >
    Excessive bleeding after surgery, most often after tonsillectomy, which is
    the event that brought two of the reported ITGA2B families to attention.
    Other carriers have had major surgery without bleeding, in at least one case
    under desmopressin cover.
  phenotype_term:
    preferred_term: Prolonged bleeding after surgery
    term:
      id: HP:0004846
      label: Prolonged bleeding after surgery
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "submitted to tonsillectomy complicated by hemorrhage and needing to be transfused with red blood cells"
    explanation: >-
      The presentation of the first patient identified in the largest series,
      from an ITGA2B family.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He reported bleeding after tonsillectomy at 7 years of age and epistaxis in childhood"
    explanation: >-
      The same presentation in a second, unrelated ITGA2B family.

- category: Hematologic
  name: Prolonged Bleeding After Dental Extraction
  description: >
    Bleeding after tooth extraction, which is one of the haemostatic challenges
    that reveals the disorder. It is inconsistent: in the largest series one
    carrier of the recurrent ITGA2B variant had multiple extractions without
    haemorrhage.
  phenotype_term:
    preferred_term: Prolonged bleeding after dental extraction
    term:
      id: HP:0006298
      label: Prolonged bleeding after dental extraction
  evidence:
  - reference: PMID:24498605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hemostatic difficulty after teeth extraction became worse at 9 years of age"
    explanation: >-
      The finding in a patient carrying ITGA2B p.Gly991Cys, noting that she is
      a compound heterozygote with a nonsense allele and sits at the severe end
      of the spectrum.
  - reference: PMID:33276370
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "he had had multiple dental extractions without hemorrhage"
    explanation: >-
      A carrier of the recurrent ITGA2B allele for whom the same challenge
      passed uneventfully, which contradicts this being a consistent feature of
      the disease.

genetic:
- name: ITGA2B
  gene_term:
    preferred_term: ITGA2B
    term:
      id: hgnc:6138
      label: ITGA2B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    ITGA2B, at 17q21.31, encodes the alphaIIb subunit of integrin
    alphaIIbbeta3, the platelet fibrinogen and von Willebrand factor receptor.
    The same gene causes two mechanistically opposite diseases: biallelic
    loss-of-function variants cause Glanzmann thrombasthenia, while the
    heterozygous variants of this disorder raise the activation state of the
    receptor. Reported alleles cluster in the membrane-proximal region, with
    p.Arg1026Trp (legacy R995W) recurrent on at least two haplotypes and
    p.Arg1026Gln (legacy R995Q) the first identified. No ClinGen Gene-Disease
    Validity assertion for this gene-disease pair is cached in this repository,
    so no gene_disease_validity tier is recorded.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare pathogenic variants in either the ITGA2B or ITGB3 genes have been linked to autosomal dominant macrothrombocytopenia associated with abnormal platelet production and function, deserving the designation of Glanzmann Thrombasthenia-Like Syndrome (GTLS) or ITGA2B/ITGB3-related thrombocytopenia."
    explanation: >-
      Names the gene-disease relationship and the disorder's alternative names
      in one sentence.
  - reference: PMID:31119735
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous or compound heterozygous loss of function mutations in ITGA2B result in Glanzmann thrombasthenia, a bleeding disorder characterized by normal platelet count but abnormal platelet function."
    explanation: >-
      The contrast that makes zygosity and variant mechanism, not the gene,
      the thing that distinguishes the two diseases.
  variants:
  - name: ITGA2B p.Arg1026Trp
    description: >-
      The recurrent allele, legacy name R995W. Reported in four unrelated
      Japanese families in the first molecular series, in further Japanese,
      French and Portuguese families, and in one European-ancestry family in
      which it arose on a different haplotype. The substitution is a C to T
      transition at a CpG site.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33276370
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This family was subsequently found to have a heterozygous variant in ITGA2B (p.Arg1026Trp), in common with a case published in 2011"
      explanation: >-
        The sentence introducing the variant in the first family of the series;
        the table of that paper gives it as NM_000419.4:c.3076C>T,
        p.(Arg1026Trp), classified pathogenic by legacy.
  - name: ITGA2B p.Arg1026Gln
    description: >-
      Legacy name R995Q, the first natural variant found in the alphaIIb GFFKR
      motif, in the patient described in 1992 with giant platelets and a mild
      thrombasthenia-like syndrome, and found again in one Portuguese family.
      The transfected receptor was not constitutively active in that first
      study, which is the main exception to the activation mechanism.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:9834222
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is the first reported natural mutation in the highly conserved GFFKR sequence of the IIb cytoplasmic domain."
      explanation: >-
        Establishes the allele as the first of its class to be described.
  - name: ITGA2B p.Gly991Cys
    description: >-
      A GFFKR-motif substitution in legacy numbering, identified in a Japanese
      patient who also carried the nonsense allele p.Arg422* in trans and had
      the most severe reported phenotype, with surface alphaIIbbeta3 at 3 to 11
      per cent of control.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24498605
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient, who showed Glanzmann thrombasthenia-like marked reduction in surface αIIbβ3 expression (3-11% of normal control), was a compound heterozygote with ITGA2B p.Gly991Cys and a novel nonsense mutation, ITGA2B p.Arg422*."
      explanation: >-
        The genotype and the degree of surface reduction that places this
        patient between the two diseases.
  - name: ITGA2B p.Phe993del
    description: >-
      An in-frame single-residue deletion in the GFFKR motif in legacy
      numbering, heterozygous, in a Japanese family with macrothrombocytopenia
      and no bleeding history in the index case.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24498605
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All three mutations, ITGA2B p.Gly991Cys, ITGA2B p.Phe993del, and ITGB3 p.(Asp621_Glu660del), led to highly activated conformation of αIIbβ3 and spontaneous tyrosine phosphorylation of FAK in transfected cells."
      explanation: >-
        The functional demonstration for this allele, alongside the other two
        in the same study.
  - name: ITGA2B p.Gly1007Val
    description: >-
      A transmembrane-domain substitution reported as new in the largest
      series, at one of the glycines of the outer membrane clasp rather than in
      the cytoplasmic inner clasp, and classified there as a variant of
      uncertain significance.
    variant_type: single nucleotide variant
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:33276370
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "one of the novel variants found in our patients (αIIb: p.Gly1007Val) is a glycine substitution at αIIb p.Gly1007, interfering with inter-helical packing of the αIIb and β3 TMD"
      explanation: >-
        States where the variant sits and the structural interaction it is
        proposed to disturb, which is the outer rather than the inner membrane
        clasp.

biochemical:
- name: Platelet surface alphaIIbbeta3 expression by flow cytometry
  presence: DECREASED
  context: >-
    Measured as CD41 (alphaIIb) or CD61 (beta3) binding on resting platelets
    and reported as a percentage of a normal control. In this disorder it sits
    at roughly 40 to 70 per cent of normal, which is the range that
    distinguishes it both from normal and from classic Glanzmann
    thrombasthenia, where the surface receptor is typically almost absent. The
    reduction correlates inversely with mean platelet volume across patients.
    The total platelet content of the receptor is far better preserved than the
    surface pool, because the missing fraction has been internalised.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  readouts:
  - target: Receptor Internalisation and Reduced Surface alphaIIbbeta3
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A partial reduction in surface alphaIIbbeta3 in a patient with
      macrothrombocytopenia is the finding that points at ITGA2B or ITGB3, and
      its degree is what separates this disorder from classic thrombasthenia.
    evidence:
    - reference: PMID:21454453
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The surface expression of platelet αIIbβ3 was decreased to 50% to 70% of control."
      explanation: >-
        The measured range in the families carrying the recurrent ITGA2B
        allele, expressed against a control as the assay reports it.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, GPIIb/IIIa and GPIIIa expression levels correlated inversely and moderately with the MPV values"
    explanation: >-
      Links the biochemical readout to the platelet size phenotype within the
      same patients, which is what a single mechanism acting on both predicts.
  notes: >-
    No reference interval is recorded here. Every cited study reports the result
    as a percentage of its own normal control rather than against a published
    interval, and a percentage-of-control figure is not a reference range.

- name: Immature platelet fraction
  presence: INCREASED
  context: >-
    The fraction of circulating platelets that are reticulated and recently
    released. It is raised in this disorder, with median values of 13 to 27 per
    cent across families in the largest series against a stated normal range of
    1 to 7 per cent, and it correlates with mean platelet volume and platelet
    distribution width. A raised value with a low count is the pattern of a
    production disorder releasing large young platelets, not of accelerated
    peripheral destruction.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  readouts:
  - target: Reduced Output of Enlarged Circulating Platelets
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reports the abnormal platelet production arm of the disorder rather than
      its platelet function arm.
    evidence:
    - reference: PMID:33276370
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The IPF correlated positively with the MPV and the PDW values"
      explanation: >-
        The correlation that ties the young-platelet fraction to the size
        abnormality this node produces.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased IPF values (median of 14%)"
    explanation: >-
      A representative median in the subgroup of families that includes the
      ITGA2B variants, against the 1 to 7 per cent normal range stated in the
      same paper's methods.

diagnosis:
- name: Flow cytometry of platelet surface alphaIIbbeta3
  diagnosis_term:
    preferred_term: flow cytometry of platelet CD41 and CD61
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >
    The test that points at the gene. A partial reduction of CD41 or CD61 on
    resting platelets, to roughly half of a normal control, in a patient with
    macrothrombocytopenia, is the finding that distinguishes this disorder both
    from other inherited macrothrombocytopenias and from classic Glanzmann
    thrombasthenia. Spontaneous PAC-1 or bound-fibrinogen binding on resting
    platelets can be looked for in the same assay, but it is present in only a
    minority of patients and was seen at a similar rate in healthy controls in
    the largest series, so it confirms nothing when absent.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To describe a series of patients with familial macrothrombocytopenia and decreased expression of αIIbβ3 integrin due to defects in the ITGA2B or ITGB3 genes."
    explanation: >-
      The combination of findings that defines the series, and so the pairing
      the test is looking for.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence for constitutive αIIbβ3 activation, occurred in 2 out of 9 patients from 8 families studied, but also in 2 out of 12 healthy controls."
    explanation: >-
      Why the activation arm of the same assay is not a diagnostic criterion.

- name: Light transmission aggregometry
  description: >
    Reduced but present aggregation and ATP release to ADP, collagen,
    epinephrine and arachidonic acid, with preserved ristocetin agglutination.
    The partial response is what distinguishes the trace from classic Glanzmann
    thrombasthenia, and closure times on a platelet function analyser are
    prolonged without reaching thrombasthenic values. No ontology term is bound
    here: NCIT codes platelet aggregometry only as data elements such as
    NCIT:C114210 Platelet Aggregometry Curve Type, which are not clinical
    procedures under NCIT:C25218 and so cannot fill this slot.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired platelet aggregation/ATP release to physiological agonists"
    explanation: >-
      The aggregometry finding as the series reports it.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly increased closure times, such as those typically found in GT, have never been observed"
    explanation: >-
      The negative that keeps a thrombasthenic trace from being expected here.

- name: Peripheral blood film and platelet indices
  description: >
    The cheapest step and often the one that raises the possibility at all: a
    low platelet count with a raised mean platelet volume and platelet
    distribution width, macrocytic and anisocytic platelets on the film, and
    sometimes giant forms. A raised immature platelet fraction alongside them
    argues for impaired production rather than peripheral destruction. Automated
    counters undercount very large platelets, so the count may read lower than
    it is. No ontology term is bound: NCIT:C79903 Blood Smear names the
    specimen rather than a clinical procedure and is not reachable from
    NCIT:C25218, so it fails the TreatmentActionTerm enum this slot uses.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PB smears revealed PLT macrocytosis and anisocytosis in most of the patients analyzed"
    explanation: >-
      The film findings across the series, which is what makes this the first
      test rather than a confirmatory one.

- name: ITGA2B sequencing within a hereditary platelet disorder panel
  diagnosis_term:
    preferred_term: multi-gene panel sequencing of ITGA2B and ITGB3
    term:
      id: NCIT:C198412
      label: Multi-gene Panel Sequencing
  description: >
    Confirms the diagnosis. In practice ITGA2B and ITGB3 are sequenced inside a
    hereditary platelet or haematological disease panel rather than as
    single-gene tests, and the authors of the largest series argue that
    sequencing without platelet phenotyping is the wrong order to work in,
    because a heterozygous variant in either gene has to be interpreted against
    the platelet count, the platelet size and the surface receptor level before
    it means this disease rather than Glanzmann thrombasthenia carriership or
    nothing.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of ITGA2B and ITGB3 genes was performed by NGS in selected patients from families with novel variants, using a commercially available gene panel for hematologic diseases"
    explanation: >-
      How the testing is actually done, on a panel rather than gene by gene.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study favors the idea that screening mutations by NGS alone (without performing phenotypic studies) may not be the best approach"
    explanation: >-
      The authors' caution about sequencing without phenotyping, which is the
      interpretive point this entry records.

- name: Distinction from acquired thrombocytopenia
  description: >
    Not a test but the decision the tests are for. Patients in the largest
    series had been followed for years with a diagnosis of chronic
    thrombocytopenia, and some had been treated as having autoimmune or
    gestational thrombocytopenia, which carries the cost of corticosteroids and
    platelet transfusions that cannot work. A family history is not always
    apparent, since relatives are often unaware of their own counts.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some had been misdiagnosed (e.g. autoimmune thrombocytopenia, gestational thrombocytopenia), with therapeutic implications (e.g. corticosteroids and PLT transfusions)"
    explanation: >-
      The misdiagnoses documented in this series and the treatment consequence
      of each.
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "even when a familial history is not obvious (as many patients are unaware of a family history of thrombocytopenia)"
    explanation: >-
      Why an absent family history does not exclude an inherited disorder here.
  - reference: PMID:16169642
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Many of these disorders share common clinical and laboratory features, making accurate diagnosis difficult and patients are often misdiagnosed with and treated for idiopathic thrombocytopenic purpura."
    explanation: >-
      The same error described for the congenital macrothrombocytopenias as a
      class, the group this disorder belongs to. Graded INDIRECT because the
      review predates the molecular definition of this entity.

treatments:
- name: Desmopressin
  description: >
    Peri-procedural cover, and the option with the most direct support in an
    ITGA2B family: the first patient identified in the largest series had two
    caesarean sections and spinal surgery under desmopressin without bleeding,
    having previously haemorrhaged after a tonsillectomy performed without
    cover. It does nothing to the integrin. It raises plasma von Willebrand
    factor and factor VIII and shortens the bleeding time, so it improves the
    conditions in which a defective platelet works rather than correcting the
    platelet.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: BYPASSES
    description: >-
      Acts around the platelet lesion rather than on it, by improving the
      plasma contribution to primary haemostasis.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient subsequently underwent two caesarean sections and spinal surgery with desmopressin without bleeding, and she had no significant hemorrhagic symptoms in addition to easy bruising."
    explanation: >-
      Three uneventful procedures under desmopressin in a patient from an
      ITGA2B family whose earlier unprotected tonsillectomy had bled. Observed
      in one patient, not a trial.
  - reference: PMID:37611608
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Places desmopressin among the established options. Graded INDIRECT
      because the review addresses inherited platelet disorders as a class and
      no trial exists in this disorder.

- name: Tranexamic Acid
  description: >
    Antifibrinolytic cover for procedures and for menorrhagia, which is the
    manifestation with the most cumulative morbidity here. It stabilises the
    clot that a reduced number of poorly aggregating platelets manages to
    build, and does not touch the underlying defect. No study of it exists in
    this disorder; the recommendation is inherited from the management of
    inherited platelet disorders generally.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Mucocutaneous Bleeding Diathesis
    treatment_effect: BYPASSES
    description: >-
      Reduces bleeding without altering platelet number or function, by
      slowing dissolution of the clot that does form.
  evidence:
  - reference: PMID:37611608
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Class-level support. Graded INDIRECT for the same reason as desmopressin
      above.
  - reference: PMID:37611608
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Special attention is given to the treatment of menorrhagia and risk management during pregnancy in women with IPDs."
    explanation: >-
      Identifies the two clinical situations that dominate management in this
      disorder, which is where antifibrinolytic cover is used.

- name: Platelet Transfusion
  description: >
    Reserved for serious bleeding and for major surgery. It supplies platelets
    with a normal integrin in normal number, so unlike the other options it
    corrects both arms of the defect for as long as the transfused platelets
    survive. In the largest series it was used for postpartum haemorrhage in a
    carrier of the recurrent ITGA2B variant, and prophylactically before
    surgery and delivery in other families. Repeated exposure carries an
    alloimmunisation risk, which in this disorder is not the
    anti-alphaIIbbeta3 isoimmunisation seen in Glanzmann thrombasthenia, since
    these patients express the receptor.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Failure of Primary Hemostatic Plug Formation
    treatment_effect: RESTORES
    description: >-
      Replaces the deficient and dysfunctional platelet pool with a competent
      one for the life of the transfused platelets.
  evidence:
  - reference: PMID:33276370
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cesarean delivery had been complicated by postpartum hemorrhage, demanding hospitalization in Intensive Care, and RBC and PLT transfusions"
    explanation: >-
      Platelet transfusion used for the most serious reported complication, in
      a carrier of the recurrent ITGA2B allele.
  - reference: PMID:37611608
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Class-level support for platelet concentrates. INDIRECT for the same
      reason as above.

experimental_models:
- name: alphaIIb-W995/beta3-transduced mouse fetal liver-derived megakaryocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  cell_source: Mouse fetal liver haematopoietic cells, retrovirally transduced
  publication: PMID:21454453
  description: >
    Megakaryocytes differentiated from mouse fetal liver cells after
    transduction with the human alphaIIb R995W allele together with beta3. This
    is the model that connects the receptor lesion to the platelet count: it
    puts the patient's allele into a cell that actually makes platelets, and
    asks what the proplatelets look like.
  modeled_mechanisms:
  - target: Abnormal Proplatelet Formation by Megakaryocytes
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Transduced megakaryocytes form proplatelets with fewer and larger tips,
      which is the cellular defect this node asserts.
    limitations: >-
      The human allele is expressed in a mouse megakaryocyte alongside the
      endogenous mouse integrin and at a transduced rather than heterozygous
      level, so the gene dosage is not the patient's. Proplatelet tips in
      culture are a surrogate for platelet release in the marrow, and no
      platelet count or bleeding phenotype is measured.
    readouts:
    - name: Proplatelet tip number and size
      target: Abnormal Proplatelet Formation by Megakaryocytes
      direction: ALTERED
      interpretation: >-
        Fewer tips of larger size is the culture correlate of releasing fewer
        and larger platelets.
      evidence:
      - reference: PMID:21454453
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The increased size and decreased number of proplatelet tips in αIIb-W995/β3-transduced mouse fetal liver-derived megakaryocytes indicate defective pro-platelet formation."
        explanation: >-
          The measurement and the authors' reading of it.
    evidence:
    - reference: PMID:21454453
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that activating mutations in ITGA2B and ITGB3 represent the etiology of a subset of congenital macrothrombocytopenias."
      explanation: >-
        The inference this model licenses, and the reason it is treated as

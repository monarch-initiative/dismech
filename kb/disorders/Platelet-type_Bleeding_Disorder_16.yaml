- name: Patient-derived megakaryocyte cultures from ITGA2B R995W carriers
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  cell_source: Megakaryocytes cultured from patients carrying ITGA2B R995W or ITGB3 D723H
  publication: PMID:29090484
  description: >
    Megakaryocyte maturation and proplatelet formation studied in cultures from
    patients themselves, in three families of which two carry ITGA2B R995W. The
    value of the model is that the genotype, the dosage and the species are the
    patient's, so it answers where in megakaryocyte development the defect sits
    without extrapolation.
  modeled_mechanisms:
  - target: Abnormal Proplatelet Formation by Megakaryocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Early maturation is normal and proplatelet formation is abnormal with
      enlarged tips, which localises the defect to the terminal step.
    limitations: >-
      Three families and a small number of cultures, with the ITGA2B and ITGB3
      genotypes analysed together, so the model does not separate the two
      genes. Proplatelet morphology in culture remains a surrogate for platelet
      release in vivo.
    readouts:
    - name: Megakaryocyte maturation and proplatelet tip size
      target: Abnormal Proplatelet Formation by Megakaryocytes
      direction: ALTERED
      interpretation: >-
        Normal maturation with abnormally large proplatelet tips is the
        pattern that excludes a maturation arrest as the cause of the low
        platelet count.
      evidence:
      - reference: PMID:29090484
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Analysis of the maturation and development of megakaryocytes reveal no defect in their early maturation but abnormal proplatelet formation was observed with increased size of the tips."
        explanation: >-
          The two findings together, which is what makes this a terminal-step
          defect.

discussions:
- discussion_id: gap_which_arm_causes_the_bleeding
  kind: KNOWLEDGE_GAP
  prompt: >-
    In ITGA2B-related macrothrombocytopenia, how much of the bleeding is due to
    the reduced platelet count and how much to the platelet function defect?
  rationale: >-
    The disorder breaks both the quantitative and the qualitative arm of
    primary haemostasis, and the two have never been separated in carriers of an
    ITGA2B variant. The question is not academic: it decides whether management
    should aim at the count, at platelet function, or only at local and
    antifibrinolytic measures, and it is the likeliest explanation for why
    bleeding severity tracks neither the platelet count nor the surface receptor
    level well. The one study that argues the question directly did so in
    patients carrying an ITGB3 allele and concluded that the cytoskeletal
    defect, not the count, is the effector of bleeding.
  attaches_to:
  - pathophysiology#Failure of Primary Hemostatic Plug Formation
  - phenotypes#Macrothrombocytopenia

- discussion_id: gap_activation_negative_alleles
  kind: KNOWLEDGE_GAP
  prompt: >-
    What explains macrothrombocytopenia in carriers whose receptor shows no
    constitutive activation?
  rationale: >-
    Constitutive activation is the mechanism this entry curates, but it is not
    demonstrable for every allele or every patient: the transfected R995Q
    receptor was not locked into a high activation state, and in the largest
    series spontaneous PAC-1 binding appeared in a minority of patients and in
    healthy controls at a similar rate. Either the assays read the platelet
    pool too crudely, or some of these variants act on megakaryocyte
    cytoskeletal signalling without a detectable shift in receptor
    conformation, which is also what has been proposed for the non-activating
    ITGB3 variants described more recently.
  attaches_to:
  - pathophysiology#Constitutive Partial alphaIIbbeta3 Activation


        and jaundice.
      explanation: >-
        The NIDDK clinical summary supports joint pain as a manifestation, while
        the mechanistic link remains uncertain.
- name: Autoantibody and hyper-IgG response
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Activated B-cell and plasma-cell lineages generate elevated IgG and
    characteristic ANA, SMA, anti-LKM1/LC1, and anti-SLA/SepSecS antibodies.
    These are diagnostically useful outputs of adaptive immunity; this graph
    does not assume that circulating autoantibodies directly injure hepatocytes.
  cell_types:

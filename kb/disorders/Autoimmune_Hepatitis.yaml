clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden varies from asymptomatic disease to acute liver failure. Even
    clinically stable disease commonly requires long-term immunosuppression and
    repeated specialist follow-up; delayed treatment can permit cirrhosis and
    end-stage liver failure. Quality-of-life and mental-health burden may remain
    clinically important even in ambulatory patients.
  evidence:
  - reference: PMID:40348684
    reference_title: EASL Clinical Practice Guidelines on the management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At baseline, the clinical spectrum of the disease varies largely from
      asymptomatic cases to acute liver failure with massive hepatocyte necrosis.
    explanation: >-
      Current guidance directly supports the very broad severity spectrum.
  - reference: PMID:36746473
    reference_title: Diagnosis and management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients need lifelong maintenance therapy, and repeated follow-up in
      experienced hands improves the quality of care and quality of life for
      affected patients.
    explanation: >-
      The review documents the chronic treatment and follow-up burden.
  - reference: PMID:24240053
    reference_title: Health-related quality of life, depression, and anxiety in patients with autoimmune hepatitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on patient-reported data, a major depressive syndrome (10.8%) was
      found to be five times more frequent in AIH patients compared to the
      general population (p<0.001).
    explanation: >-
      A single-center outpatient cohort supports an additional psychosocial
      burden but is not assumed to represent all populations.
progression:
- phase: Asymptomatic or insidious presentation
  notes: >-
    Some patients are found through abnormal laboratory testing and do not pass
    through a fixed sequence of clinical stages.
  evidence:
  - reference: PMID:36746473
    reference_title: Diagnosis and management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation is often that of acute hepatitis, sometimes very
      severe; less frequently, it can be insidious or completely asymptomatic.
    explanation: >-
      The review directly identifies insidious and asymptomatic presentations.
- phase: Acute or acute-severe presentation
  notes: >-
    Acute hepatitis, including acute liver failure, can be the initial
    presentation rather than a late phase of previously recognized disease.
  evidence:
  - reference: PMID:40348684
    reference_title: EASL Clinical Practice Guidelines on the management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At baseline, the clinical spectrum of the disease varies largely from
      asymptomatic cases to acute liver failure with massive hepatocyte necrosis.
    explanation: >-
      Current guidance identifies acute liver failure as part of the baseline
      spectrum.
- phase: Persistent inflammation with fibrosis and advanced liver disease
  notes: >-
    When diagnosis or effective treatment is delayed, chronic inflammation may
    progress to cirrhosis and end-stage liver failure. This is preventable in
    many patients and is not an inevitable stage.
  evidence:
  - reference: PMID:36746473
    reference_title: Diagnosis and management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune hepatitis is an inflammatory disease of the liver of unknown
      cause that may progress to liver cirrhosis and end stage liver failure if
      diagnosis is overlooked and treatment delayed.
    explanation: >-
      The review directly links delayed diagnosis and treatment to advanced
      liver disease.
pathophysiology:
- name: Polygenic HLA-linked susceptibility
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Common germline variation creates a polygenic susceptibility rather than a
    Mendelian cause. HLA-DRB1*03:01 and *04:01 are major signals in European
    type-1-serology cohorts, while HLA-B*35:01 is the strongest signal in a Han
    Chinese cohort; these ancestry-dependent associations implicate antigen
    presentation. SH2B3 adds a non-HLA immune-signaling susceptibility signal.
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  - preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  - preferred_term: SH2B3
    term:
      id: hgnc:29605
      label: SH2B3
  evidence:
  - reference: PMID:24768677
    reference_title: Genome-wide association study identifies variants associated with autoimmune hepatitis type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of this variant in the discovery cohort identified HLA-DRB1*0301
      (P = 5.3 × 10(-49)) as a primary susceptibility genotype and
      HLA-DRB1*0401 (P = 2.8 × 10(-18)) as a secondary susceptibility genotype.
    explanation: >-
      A replicated European GWAS identifies the two principal HLA-DRB1
      susceptibility alleles.
  - reference: PMID:38089552
    reference_title: Fine mapping identifies independent HLA associations in autoimmune hepatitis type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stepwise conditional analysis revealed the strongest allele was in the
      HLA-B gene (HLA-B*35:01, p = 8.17×10-304; OR = 7.32), with additional
      independent signals at HLA-B*08:01 (p = 1.35 × 10-33; OR = 4.26) and
      rs7765379 (p = 5.08 × 10-18; OR = 1.66).
    explanation: >-
      Fine mapping in 1,622 Chinese cases and matched controls establishes an
      ancestry-specific HLA-B susceptibility pattern.
  downstream:
  - target: Liver-autoantigen-specific adaptive immune activation
    description: >-
      Genetic susceptibility, together with incompletely defined triggers and
      tolerance failure, permits an adaptive response against liver
      autoantigens.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Environmental triggers are not defined for most patients.
    - The steps converting HLA-associated risk into loss of self-tolerance remain incompletely resolved.
    hypothesis_groups:
    - canonical_adaptive_autoimmunity
    evidence:
    - reference: PMID:29644994
      reference_title: Autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AIH arises in genetically predisposed individuals when a trigger, such as
        exposure to a virus, leads to a T cell-mediated autoimmune response
        directed against liver autoantigens; this immune response is permitted by
        inadequate regulatory immune control leading to a loss of tolerance.
      explanation: >-
        The disease primer explicitly links genetic predisposition, a trigger,
        loss of tolerance, and liver-autoantigen-directed T-cell autoimmunity.
- name: Liver-autoantigen-specific adaptive immune activation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Autoreactive T and B cells recognize liver-associated self antigens. Human
    clonal analysis has directly demonstrated SepSecS/SLA-specific CD4 T cells
    and B cells, while also finding lower-level SepSecS-reactive T cells in
    controls; the response is therefore disease-associated but not by itself
    diagnostic or universally disease-specific.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:

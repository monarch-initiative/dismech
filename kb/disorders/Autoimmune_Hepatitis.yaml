      label: Laboratory Procedure
  description: >-
    Measure serum ALT/AST and IgG and test an appropriate autoantibody panel
    (including ANA, SMA/F-actin, anti-LKM1/LC1, and anti-SLA when indicated).
    Results must be integrated with histology and competing-cause evaluation;
    neither seronegativity nor a normal IgG alone is modeled as exclusionary.
  results: A compatible hepatocellular injury pattern, increased IgG, and characteristic autoantibodies support but do not independently establish AIH.
  evidence:
  - reference: PMID:29644994
    reference_title: Autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of AIH relies on increased serum transaminase and
      immunoglobulin G levels, presence of autoantibodies and interface hepatitis
      on liver histology.
    explanation: >-
      The disease primer directly supports the integrated biochemical,
      serologic, and histologic diagnostic pattern.

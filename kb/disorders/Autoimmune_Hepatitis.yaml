- name: Simplified International Autoimmune Hepatitis Group score
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    The simplified score combines autoantibodies, IgG, histology, and exclusion
    of viral hepatitis. A score of at least 6 supports probable AIH and at least
    7 supports definite AIH; it supports clinical reasoning but does not replace
    expert assessment in atypical or acute-severe presentations.
  results: In the original validation set, cutoff 6 had 88% sensitivity and 97% specificity; cutoff 7 had 81% sensitivity and 99% specificity.
  evidence:
  - reference: PMID:18537184
    reference_title: Simplified criteria for the diagnosis of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This score included autoantibodies, immunoglobulin G, histology, and
      exclusion of viral hepatitis.
    explanation: >-
      The primary criteria study defines the four score components.
  - reference: PMID:18537184
    reference_title: Simplified criteria for the diagnosis of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The score was found to have 88% sensitivity and 97% specificity (cutoff >
      or =6) and 81% sensitivity and 99% specificity (cutoff > or =7) in the
      validation set.
    explanation: >-
      The primary validation supplies the cutoff performance characteristics.
differential_diagnoses:
- name: Viral hepatitis
  description: >-
    Acute or chronic viral hepatitis can produce the same hepatocellular enzyme
    pattern and overlapping histology. Virologic testing and exposure context
    are required before assigning idiopathic AIH.
  distinguishing_features:
  - Positive pathogen-specific nucleic-acid or serologic evidence
  - Epidemiologic exposure context
  - Simplified AIH criteria explicitly require exclusion of viral hepatitis
  evidence:
  - reference: PMID:18537184
    reference_title: Simplified criteria for the diagnosis of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This score included autoantibodies, immunoglobulin G, histology, and
      exclusion of viral hepatitis.
    explanation: >-
      The validated diagnostic score explicitly requires viral-hepatitis
      exclusion.
- name: Drug-induced autoimmune-like hepatitis
  description: >-
    Drug-induced liver injury may reproduce autoantibodies, increased IgG, and
    an autoimmune-like histologic pattern. The idiopathic AIH disease boundary
    used here excludes cases attributed to a drug or herb after temporal and
    causality assessment.
  distinguishing_features:
  - Compatible medication or supplement exposure and latency
  - Improvement after withdrawal may support drug causality
  - Relapse behavior after immunosuppression withdrawal may differ, but is not by itself definitive
  evidence:
  - reference: PMID:25574080
    reference_title: "Autoimmune hepatitis, one disease with many faces: etiopathogenetic, clinico-laboratory and histological characteristics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      AIH should be considered in every case in the absence of viral, metabolic,
      genetic and toxic etiology of chronic or acute hepatitis.
    explanation: >-
      The review explicitly requires exclusion of toxic causes, supporting the
      drug-induced boundary without supplying a complete causality algorithm.
- name: Wilson disease
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  description: >-
    Wilson disease can present as acute hepatitis, chronic hepatitis, or liver
    failure and must be excluded in compatible age groups and presentations.
  distinguishing_features:
  - Copper studies and ATP7B evaluation support Wilson disease
  - Kayser-Fleischer rings or neurologic features may be present but are not required
  - Autoantibody positivity does not independently exclude Wilson disease
  evidence:
  - reference: PMID:25574080
    reference_title: "Autoimmune hepatitis, one disease with many faces: etiopathogenetic, clinico-laboratory and histological characteristics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      AIH should be considered in every case in the absence of viral, metabolic,
      genetic and toxic etiology of chronic or acute hepatitis.
    explanation: >-
      The review requires exclusion of metabolic and genetic causes; Wilson
      disease is a key such mimic.
- name: Primary biliary cholangitis, primary sclerosing cholangitis, and AIH variant syndromes
  description: >-
    Cholestatic biochemistry, bile-duct injury, cholangiography, and
    disease-specific serology may identify PBC, PSC, or an AIH variant syndrome.
    Variant/overlap taxonomy remains controversial and should not be treated as
    a simple autoantibody-defined AIH subtype.
  distinguishing_features:
  - Antimitochondrial antibodies and small-duct cholangitis support PBC
  - Multifocal biliary stricturing and inflammatory bowel disease support PSC
  - Combined hepatitic and cholangiopathic findings may support a variant syndrome
  evidence:
  - reference: PMID:20862497
    reference_title: Discrimination of autoimmune hepatitis—autoantibody typing and beyond.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There also are patients with variant forms of autoimmune hepatitis who
      have clinical and serologic findings of autoimmune hepatitis in addition
      to features of primary biliary cirrhosis or primary sclerosing cholangitis.
      The taxonomy and definitions of these variants, often referred to as
      overlap syndromes, are controversial.
    explanation: >-
      The review supports the combined-feature variants and explicitly notes
      taxonomic uncertainty.
- name: Immune checkpoint inhibitor-associated hepatitis
  description: >-
    Immune-mediated hepatitis after checkpoint blockade is a treatment-related
    immune adverse event, not idiopathic AIH, even though T-cell activation,
    transaminase elevation, and steroid responsiveness may overlap.
  distinguishing_features:
  - Temporal relationship to immune checkpoint inhibitor exposure
  - Diagnosis of exclusion within an oncology treatment context
  - Histology and serology may differ from idiopathic AIH
  evidence:
  - reference: DOI:10.3389/fphar.2022.1077468
    reference_title: "Immune-mediated hepatitis induced by immune checkpoint inhibitors: Current updates and future perspectives"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because of the lack of specific markers, a diagnosis of exclusion of IMH
      is critical.
    explanation: >-
      The review supports checkpoint-inhibitor hepatitis as a diagnosis of
      exclusion defined by treatment exposure.

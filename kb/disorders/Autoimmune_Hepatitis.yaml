synonyms:
- AIH
- autoimmune chronic active hepatitis
disease_term:
  preferred_term: Autoimmune Hepatitis
  term:
    id: MONDO:0016264
    label: autoimmune hepatitis
description: >-
  Autoimmune hepatitis (AIH) is an idiopathic immune-mediated necroinflammatory
  liver disease with a clinical spectrum from asymptomatic biochemical
  abnormalities to acute liver failure. Diagnosis requires clinicopathologic
  integration of serum aminotransferases, IgG, autoantibodies, liver histology,
  and exclusion of competing causes; no single finding is pathognomonic.
  Persistent untreated inflammation can lead to fibrosis, cirrhosis, and
  end-stage liver failure. ANA/SMA and anti-LKM1/LC1 patterns were historically
  called types 1 and 2, but current EASL guidance no longer recommends those
  serologic profiles as clinically distinct subtypes requiring different
  treatment strategies.
prevalence:
- population: Global pooled estimate from population-based studies
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.28
  rate_low: 1.01
  rate_high: 1.63
  notes: >-
    Annual incidence per 100,000 inhabitant-years. Between-study heterogeneity
    was extreme (I2 99.51%), so the pooled value is not a universal regional
    rate.
  evidence:
  - reference: PMID:37876996
    reference_title: "Global incidence and prevalence of autoimmune hepatitis, 1970-2022: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Global pooled incidence and prevalence of AIH were found to be 1.28 cases
      per 100,000 inhabitant-years (95% CI, 1.01-1.63, I2 = 99·51%; number of
      studies, 33; sample population, 220,673,674) and 15.65 cases per 100,000
      inhabitants (95% CI, 13.42-18.24, I2 = 99·75%; number of studies, 26;
      sample population, 217,178,684), respectively.
    explanation: >-
      The population-based meta-analysis supplies the pooled annual incidence,
      confidence interval, and heterogeneity used here.

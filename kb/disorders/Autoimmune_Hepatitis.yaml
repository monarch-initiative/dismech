discussions:
- discussion_id: gap_b_cell_targeting_clinical_benefit
  prompt: >-
    Does selective BAFF or CD19-directed B-cell therapy safely improve durable
    biochemical control and reduce glucocorticoid exposure in AIH?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Autoantibody and hyper-IgG response
  - pathophysiology#Liver-autoantigen-specific adaptive immune activation
  rationale: >-
    Antigen-specific B-cell presentation is demonstrated in human samples, but
    direct antibody pathogenicity and clinical benefit from B-cell targeting
    remain unproven. BELief and MERCURY are testing two distinct B-cell-directed
    strategies; registry protocols must not be interpreted as positive results.
  evidence:
  - reference: PMID:39817450
    reference_title: Clonal analysis of SepSecS-specific B and T cells in autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SepSecS-specific B cell clones, but not those of unrelated
      specificities, were able to present soluble SepSecS to specific T cells.
    explanation: >-
      Human clonal data establish the biologic rationale for testing B-cell
      targeting.
  - reference: clinicaltrials:NCT06381453
    reference_title: "Belimumab in the Management of Autoimmune Hepatitis: A Multi-centre, Open-label Trial of add-on Belimumab Therapy to Standard of Care"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Belimumab is a human monoclonal antibody that inhibits B-cell activating
      factor (BAFF), also known as B-lymphocyte stimulator.
    explanation: >-
      The ongoing protocol tests BAFF inhibition but provides no efficacy result.
  - reference: clinicaltrials:NCT07598825
    reference_title: "A Phase 2/3, Randomized, Double-blind, Multicenter, Placebo-controlled Study of Inebilizumab in Participants With Autoimmune Hepatitis"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The main objectives of this trial are to evaluate the safety and
      tolerability of inebilizumab in participants with autoimmune hepatitis
      (AIH) (Part 1) and to evaluate the efficacy of inebilizumab on AIH disease
      activity and glucocorticoid (GC) use in the management of AIH (Part 2).
    explanation: >-
      The ongoing protocol defines the CD19-directed question without supplying
      an answer.
- discussion_id: gap_paired_liver_blood_single_cell_resolution
  prompt: >-
    Which immune states are reproducibly enriched in AIH liver tissue, and how
    do they relate to matched blood, disease activity, ancestry, and treatment
    response at donor level?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Liver-autoantigen-specific adaptive immune activation
  - pathophysiology#T-cell-mediated hepatocyte injury
  rationale: >-
    The public AIH single-cell dataset pools four donors per condition into two
    PBMC libraries. It cannot estimate donor heterogeneity and samples blood,
    not the injured liver. A multi-ancestry longitudinal study with paired
    liver and blood single-cell/spatial profiling is needed before peripheral
    monocyte or NK signatures are promoted to causal liver mechanisms.
  evidence:
  - reference: PMID:38340154
    reference_title: "Characteristics of peripheral blood mononuclear cells and potential related molecular mechanisms in patients with autoimmune hepatitis: a single-cell RNA sequencing analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We generated 3690 and 3511 single-cell transcriptomes of PBMCs pooled from
      4 healthy controls (HCs) and 4 AIH patients, respectively, by scRNA-seq.
    explanation: >-
      The publication directly establishes the pooled peripheral design that
      creates the inference gap.
- discussion_id: interpretation_budesonide_guideline_reversal
  prompt: >-
    Should budesonide remain represented as a current first-line corticosteroid
    option for AIH?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - treatment#Prednisone or prednisolone-based corticosteroid induction
  rationale: >-
    A 2010 randomized trial favored budesonide plus azathioprine in patients
    explicitly selected to have no cirrhosis, but the official 2025 EASL update
    no longer endorses budesonide because of safety and effectiveness concerns.
    Current representation must follow the newer guidance while preserving the
    historical trial boundary.
  resolved_date: '2026-07-21T00:00:00Z'
  resolution_note: >-
    Budesonide was removed from the current first-line treatment description;
    prednisone/prednisolone remain represented, and the older noncirrhotic trial
    is retained here for provenance.
  evidence:
  - reference: PMID:20600032
    reference_title: Budesonide induces remission more effectively than prednisone in a controlled trial of patients with autoimmune hepatitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a 6-month, prospective, double-blind, randomized,
      active-controlled, multicenter, phase IIb trial of patients with AIH
      without evidence of cirrhosis who were given budesonide (3 mg, three times
      daily or twice daily) or prednisone (40 mg/d, tapered to 10 mg/d); patients
      also received azathioprine (1-2 mg/kg/d).
    explanation: >-
      The older trial supports efficacy only within a noncirrhotic study
      population and predates the current guidance.
  - reference: "url:https://easl.eu/news/easl-cpgs-autoimmune-hepatitis-2025/"
    reference_title: New EASL Clinical Practice Guidelines on the management of Autoimmune Hepatitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Budesonide, which had previously been recommended as part of first-line
      therapy, is no longer endorsed due to concerns regarding its safety and
      overall effectiveness.
    explanation: >-
      The official 2025 guideline summary resolves the current representation.
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    evidence:
    - reference: PMID:40348684
      reference_title: EASL Clinical Practice Guidelines on the management of autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Autoimmune hepatitis (AIH) is a chronic liver disease of unknown
        aetiology which may affect any patient irrespective of age, sex, or
        ethnicity.
      explanation: >-
        The guideline directly identifies AIH as a chronic liver disease,
        supporting the gastrointestinal and hepatology classification.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:36746473
      reference_title: Diagnosis and management of autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An abnormal immune response targeting liver autoantigens and inducing
        persistent and self-perpetuating liver inflammation is the pathogenic
        mechanism of the disease.
      explanation: >-
        The review directly identifies an abnormal autoantigen-directed immune
        response, supporting the immune and rheumatologic classification.
notes: >-
  Disease boundary: this entry represents idiopathic autoimmune hepatitis. It
  excludes drug-induced autoimmune-like hepatitis, immune-checkpoint-inhibitor
  hepatitis, and isolated PBC/PSC. AIH-PBC/PSC variant syndromes require combined
  hepatitic and cholangiopathic assessment and are not collapsed into historical
  autoantibody-defined type 1/type 2 labels.
review_notes: >-
  Full re-review completed 2026-07-21. The causal graph was rebuilt around
  ancestry-dependent polygenic susceptibility, autoantigen-specific adaptive
  immunity, hepatocyte injury, interface hepatitis, and fibrogenesis. The prior
  incorrect claim that CD8 T cells kill MHC-class-II-expressing hepatocytes and
  the weakly supported standalone regulatory-T-cell-deficiency node were
  removed. Autoantibodies are modeled as diagnostic immune outputs rather than
  assumed direct effectors. Existing updated_date was preserved per review
  workflow. ClinicalTrials.gov v2 audit paginated through 110 primary-condition
  records (100 plus 10) and cross-checked exact-condition, exact-phrase
  full-text, and AIH-acronym searches on 2026-07-21; eight active or planned
  direct-AIH studies with explicit boundary/staleness notes are represented.
  Mixed post-transplant studies without an AIH-specific cohort and broad
  refractory-autoimmunity baskets were excluded. GSE216064 is the only retained
  AIH-focused public molecular dataset; mixed-liver datasets in which AIH is an
  inseparable control subset were not promoted.

  results: Interface hepatitis and periportal necroinflammation support AIH in the appropriate clinic-serologic context.
  evidence:
  - reference: PMID:36746473
    reference_title: Diagnosis and management of autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A specific set of autoantibodies, increased IgG concentrations, and

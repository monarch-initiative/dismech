- name: Mycophenolate mofetil immunosuppression
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Mycophenolate mofetil (MMF) is a current first-line alternative to
    azathioprine and remains an option for intolerance or inadequate response.
    It is teratogenic and requires reproductive-risk counseling. The strongest
    direct comparison is a small 24-week, open-label adult trial, so long-term
    and broader-population comparative effectiveness remains less certain.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: Liver-autoantigen-specific adaptive immune activation
    treatment_effect: INHIBITS
    description: MMF suppresses lymphocyte proliferation and the adaptive autoimmune response.
    evidence:
    - reference: PMID:38101756
      reference_title: An open-label randomised-controlled trial of azathioprine vs. mycophenolate mofetil for the induction of remission in treatment-naive autoimmune hepatitis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The primary endpoint was met in 56.4% and 29.0% of patients assigned to
        the MMF group and the azathioprine group, respectively (difference, 27.4
        percentage points; 95% CI 4.0 to 46.7; p = 0.022).
      explanation: >-
        The randomized comparison supports clinical pathway modulation by MMF,
        but it does not directly measure the proposed lymphocyte-level target.
  evidence:
  - reference: PMID:38101756
    reference_title: An open-label randomised-controlled trial of azathioprine vs. mycophenolate mofetil for the induction of remission in treatment-naive autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint was met in 56.4% and 29.0% of patients assigned to the
      MMF group and the azathioprine group, respectively (difference, 27.4
      percentage points; 95% CI 4.0 to 46.7; p = 0.022).
    explanation: >-
      The randomized comparison supports higher 24-week biochemical remission
      with MMF plus prednisolone in this 70-patient open-label cohort.
  - reference: "url:https://easl.eu/news/easl-cpgs-autoimmune-hepatitis-2025/"
    reference_title: New EASL Clinical Practice Guidelines on the management of Autoimmune Hepatitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutically, the updated guidelines introduce Mycophenolate mofetil as
      a viable and safe first-line alternative to azathioprine. It is now
      recognised for its comparable or even superior efficacy and reduced rate
      of adverse events. However, clinicians are cautioned about its teratogenic
      risks, particularly in patients of reproductive age.
    explanation: >-
      The official EASL summary supports MMF as a first-line alternative and
      states the reproductive-safety caveat.

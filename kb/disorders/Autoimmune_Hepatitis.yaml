    explanation: >-
      The clinical review directly supports the biopsy pattern within an
      integrated diagnosis.
  - reference: "url:https://easl.eu/news/easl-cpgs-autoimmune-hepatitis-2025/"
    reference_title: New EASL Clinical Practice Guidelines on the management of Autoimmune Hepatitis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These new standards are designed to support more consistent and

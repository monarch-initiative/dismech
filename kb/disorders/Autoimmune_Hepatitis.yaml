  evidence:
  - reference: PMID:39817450
    reference_title: Clonal analysis of SepSecS-specific B and T cells in autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The anti-SepSecS mAbs isolated were primarily IgG1, affinity-matured
      compared with their germline versions, and recognized at least 3
      nonoverlapping epitopes.
    explanation: >-
      Human monoclonal antibodies directly demonstrate an affinity-matured IgG1
      response to an AIH autoantigen.
- name: T-cell-mediated hepatocyte injury
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Liver-autoantigen-directed T-cell activation and inflammatory cytokine
    production promote hepatocyte injury and death. The prior record's claim
    that CD8 T cells recognize MHC class II on hepatocytes was removed: CD8
    restriction is to MHC class I, and the available AIH evidence does not
    establish that erroneous route.

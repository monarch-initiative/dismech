      label: B cell activation
  evidence:
  - reference: PMID:39817450
    reference_title: Clonal analysis of SepSecS-specific B and T cells in autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SepSecS-specific CD4+ T cell clones were found in patients with AIH who
      were anti-SLA-positive and anti-SLA-negative, and, to a lesser extent, in
      patients with non-AIH liver diseases and in healthy individuals.
    explanation: >-
      Human clonal analysis directly supports an autoantigen-specific CD4
      response while preserving its incomplete disease specificity.
  downstream:
  - target: Autoantibody and hyper-IgG response
    description: >-
      Cognate B-cell antigen presentation and T-cell help support affinity-matured
      autoantibody production and the polyclonal IgG response.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_adaptive_autoimmunity
    - b_cell_amplification
    evidence:
    - reference: PMID:39817450
      reference_title: Clonal analysis of SepSecS-specific B and T cells in autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SepSecS-specific B cell clones, but not those of unrelated
        specificities, were able to present soluble SepSecS to specific T cells.
      explanation: >-
        The primary human study demonstrates antigen-specific B-cell
        presentation to cognate T cells.
  - target: T-cell-mediated hepatocyte injury
    description: >-
      The autoreactive response is modeled as driving hepatocyte injury through
      effector T-cell and cytokine pathways; the precise dominant cytotoxic
      subset and antigenic targets remain incompletely mapped in human liver.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - canonical_adaptive_autoimmunity
    evidence:
    - reference: PMID:29644994
      reference_title: Autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AIH arises in genetically predisposed individuals when a trigger, such as
        exposure to a virus, leads to a T cell-mediated autoimmune response
        directed against liver autoantigens
      explanation: >-
        The review supports T-cell-mediated liver-autoantigen autoimmunity but
        does not establish a single cytotoxic subset.
  - target: Arthralgia
    description: >-
      Joint pain is an extrahepatic symptom of AIH, but the intermediates linking
      liver-directed adaptive autoimmunity to arthralgia are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_adaptive_autoimmunity
    evidence:

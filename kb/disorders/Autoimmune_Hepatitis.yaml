    explanation: >-
      The study supports cytokine-producing autoantigen-specific T cells and
      liver expansion in one patient, but not a universal CD8 cytotoxic route.
  downstream:
  - target: Interface hepatitis and hepatocellular necroinflammation
    description: >-
      Persistent adaptive immune injury produces periportal/interface

mechanistic_hypotheses:
- hypothesis_group_id: canonical_adaptive_autoimmunity
  hypothesis_label: HLA-linked loss of tolerance and adaptive hepatocyte injury
  status: CANONICAL
  description: >-
    Polygenic susceptibility and incompletely defined triggers permit a
    liver-autoantigen-directed adaptive response that produces hepatocyte
    injury, interface hepatitis, and—when persistent—fibrosis and cirrhosis.
  evidence:
  - reference: PMID:29644994
    reference_title: Autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AIH arises in genetically predisposed individuals when a trigger, such as
      exposure to a virus, leads to a T cell-mediated autoimmune response
      directed against liver autoantigens; this immune response is permitted by
      inadequate regulatory immune control leading to a loss of tolerance.
    explanation: >-
      The disease primer states the canonical genetic-trigger-tolerance-adaptive
      immunity model.
- hypothesis_group_id: b_cell_amplification
  hypothesis_label: Antigen-specific B-cell amplification of adaptive autoimmunity
  status: EMERGING
  description: >-
    Autoreactive B cells may amplify AIH through cognate antigen presentation,
    cytokine interactions, and antibody production. Antigen-specific human
    clonal data support this route, but the direct pathogenic contribution of
    circulating autoantibodies and the clinical benefit of selective B-cell
    targeting remain unresolved.
  evidence:
  - reference: PMID:39817450
    reference_title: Clonal analysis of SepSecS-specific B and T cells in autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SepSecS-specific B cell clones, but not those of unrelated
      specificities, were able to present soluble SepSecS to specific T cells.
    explanation: >-
      Primary human clonal data directly demonstrate cognate autoantigen
      presentation by B cells.
  - reference: PMID:31226726
    reference_title: The Contribution of B Cells in Autoimmune Liver Diseases.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Autoreactive B cells can promote autoimmunity through antigen presentation
      to autoreactive T cells, production of autoantibodies, generation of
      cytokines promoting T cell activation and differentiation, and inhibition
      of regulatory T cells and B cells.
    explanation: >-
      This review supplies plausible amplification routes but covers several
      autoimmune liver diseases and does not establish AIH-specific causality for
      every route.

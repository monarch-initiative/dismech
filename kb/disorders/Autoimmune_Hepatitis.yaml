treatments:
- name: Prednisone or prednisolone-based corticosteroid induction
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Systemic prednisone or prednisolone is used to induce remission, with dose
    and taper individualized to severity, response, and toxicity. Budesonide is
    deliberately not grouped into this current first-line entry; its older
    noncirrhotic trial and the 2025 guideline reversal are documented below.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: T-cell-mediated hepatocyte injury
    treatment_effect: INHIBITS
    description: Broad glucocorticoid immunosuppression reduces immune-mediated hepatocyte injury.
    evidence:
    - reference: PMID:29644994
      reference_title: Autoimmune hepatitis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard regimens include fairly high initial doses of corticosteroids
        (prednisone or prednisolone), which are tapered gradually as
        azathioprine is introduced.
      explanation: >-
        Clinical use of corticosteroid induction supports suppression of the
        autoimmune-injury pathway, but this passage does not isolate a
        T-cell-specific pharmacodynamic effect.
  - target: Interface hepatitis and hepatocellular necroinflammation
    treatment_effect: INHIBITS
    description: Suppression of active inflammation is the induction target.
    evidence:
    - reference: PMID:36746473
      reference_title: Diagnosis and management of autoimmune hepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The aims of treatment are to induce and maintain long term remission of
        liver inflammation.
      explanation: >-
        The review directly identifies remission of liver inflammation as the
        treatment target.
  evidence:
  - reference: PMID:29644994
    reference_title: Autoimmune hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard regimens include fairly high initial doses of corticosteroids
      (prednisone or prednisolone), which are tapered gradually as azathioprine
      is introduced.

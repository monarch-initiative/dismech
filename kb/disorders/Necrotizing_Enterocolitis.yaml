discussions:
- discussion_id: nec_paneth_cell_hypothesis
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does Paneth cell loss or dysfunction precede and contribute to NEC, or is
    the Paneth cell change observed in resected bowel a consequence of the
    disease and its repair?
  rationale: >-
    Paneth cell dysfunction has been a standing hypothesis for NEC pathogenesis,
    on the reasoning that loss of alpha-defensin output would remove a control
    on the colonizing community. The one human tissue series read for this entry
    points the other way at the time that matters: Paneth cell abundance in
    acute NEC did not differ from preterm controls, and hyperplasia with raised
    alpha-defensin 5 appeared only after recovery. That is compatible with a
    reparative rather than causal role. No Paneth cell node is curated in the
    pathograph for this reason.
  attaches_to:
  - pathophysiology#Abnormal Microbial Colonization of the Preterm Gut
  evidence:
  - reference: PMID:21372757
    reference_title: "Paneth cell hyperplasia and metaplasia in necrotizing enterocolitis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In acute NEC, Paneth cell abundance in small intestinal tissue was not significantly different from preterm controls."
    explanation: >-
      Contradicts a depletion-at-onset version of the Paneth cell hypothesis in
      human resected tissue, which is the specific claim this controversy turns
      on.
  - reference: PMID:21372757
    reference_title: "Paneth cell hyperplasia and metaplasia in necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      After recovery from NEC, Paneth cell hyperplasia was observed in the small
      intestine concomitant with elevated human alpha-defensin 5 mRNA levels.
    explanation: >-
      The post-recovery hyperplasia with raised alpha-defensin 5 is the
      observation that keeps the Paneth cell compartment mechanistically
      interesting, on a reparative reading rather than a causal one.

- discussion_id: nec_white_matter_injury_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the excess of periventricular leukomalacia and neurodevelopmental
    impairment after NEC caused by the disease's systemic inflammatory response,
    or is it confounded by gestational age, illness severity and interrupted
    nutrition?
  rationale: >-
    The association is large, replicated and graded by disease severity, and a
    plausible mediator route exists in the circulating cytokine load. None of
    that establishes causation from observational data: the infants who develop
    surgical NEC are also the sickest and the most nutritionally deprived, and
    the meta-analysis that supplies the effect estimates says in its own
    conclusion that causality is not established. Resolving it would need
    mediation analysis against measured inflammatory mediators, or a preventive
    trial powered on neurodevelopmental rather than intestinal outcomes.
  attaches_to:
  - pathophysiology#Cerebral White Matter Injury
  - phenotypes#Neurodevelopmental delay
  evidence:
  - reference: PMID:38684534
    reference_title: "Neurodevelopmental outcomes of preterm with necrotizing enterocolitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Further high-quality studies with comprehensive adjustments for potential
      confounding factors are required to definitively establish whether the
      association with NDI is causal.
    explanation: >-
      The meta-analysis states the open question this gap records, in its own
      words, and names residual confounding as the reason it is open.
  - reference: PMID:37493095
    reference_title: "Probiotics to prevent necrotising enterocolitis in very preterm or very low birth weight infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Probiotics may have little or no effect on neurodevelopmental impairment
      (RR 1.03, 95% CI 0.84 to 1.26
    explanation: >-
      An intervention that reduces NEC does not measurably reduce
      neurodevelopmental impairment in the five trials reporting it, which is
      weak evidence against a simple NEC-causes-impairment model. INDIRECT and
      low-powered: five trials and 1,518 infants, graded low certainty.

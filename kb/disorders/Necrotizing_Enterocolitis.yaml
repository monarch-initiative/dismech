name: Necrotizing Enterocolitis
creation_date: "2026-09-29T00:00:00Z"
category: Complex
categories:
- Gastrointestinal Disease
- Neonatal Disorder
- Disorder of Prematurity
synonyms:
- NEC
- necrotising enterocolitis
- neonatal necrotizing enterocolitis
- necrotizing enterocolitis in fetus or newborn
description: >-
  Necrotizing enterocolitis is the most common gastrointestinal emergency of
  preterm neonates: an acute, patchy inflammatory necrosis of the small bowel
  and colon that can progress within hours to transmural necrosis, perforation,
  peritonitis and septic shock. It is multifactorial rather than Mendelian. The
  dominant risk factor is prematurity itself, which leaves the intestine with an
  immature epithelial barrier, an immature innate immune set-point, and immature
  microvascular autoregulation. On that substrate, abnormal microbial
  colonization of the preterm gut supplies the luminal microbial ligands that
  the immature epithelium over-reads, chiefly through the lipopolysaccharide
  receptor TLR4, which is expressed at higher levels in the premature than the
  full-term gut. TLR4 signalling in the epithelium drives enterocyte apoptosis
  and blocks mucosal restitution, while TLR4 signalling in the intestinal
  endothelium lowers endothelial nitric oxide synthase output and reduces
  mesenteric perfusion. The result is a self-amplifying loop of barrier failure,
  bacterial and lipopolysaccharide translocation, mucosal cytokine release and
  microcirculatory ischemia that produces the coagulative necrosis and
  intramural gas (pneumatosis intestinalis) by which the disease is recognized
  radiographically. Human milk is the best-established protective exposure and
  formula feeding the best-established feeding risk. Survivors carry a durable
  burden of intestinal stricture, short bowel syndrome and neurodevelopmental
  impairment, the latter linked to the same systemic inflammatory response that
  injures the gut. Severity is graded with the Bell staging system.
parents:
- Gastrointestinal Disease
- Disorder of prematurity
disease_term:
  preferred_term: necrotizing enterocolitis
  term:
    id: MONDO:0005313
    label: necrotizing enterocolitis
notes: >-
  Not a Mendelian disease and deliberately carries no causative `genetic:`
  block. Candidate susceptibility loci have been reported but none is
  established at the level this KB records as a causal gene, so the section is
  omitted rather than filled with a nominal gene.

  Scope relative to MONDO: `MONDO:0004639 perinatal necrotizing enterocolitis`
  is MONDO's only descendant of the anchor term and names the same clinical
  entity by its onset window; it is not curated as a separate `has_subtypes`
  row because the clinically load-bearing stratification in this disease is
  medical versus surgical NEC (captured in `stages:` and in the prevalence and
  outcome records), not perinatal versus non-perinatal onset. Spontaneous
  intestinal perforation is a distinct entity that is repeatedly pooled with
  NEC in surgical series, including the peritoneal-drainage meta-analysis cited
  under treatments; that pooling is a limitation of the evidence rather than a
  claim of identity.

  No `conforms_to` target was found for the ischemia-reperfusion arm: `just
  list-modules` and `ls kb/modules/` return no ischemia, reperfusion or
  mesenteric-perfusion module, so the microcirculatory nodes here are curated
  de novo. `gut_dysbiosis` was considered for the colonization nodes and
  rejected: that module is an aging hallmark scoped to age-associated
  microbiota drift feeding inflammaging, which is the wrong direction of life
  course for neonatal colonization. `epithelial_barrier_dysfunction` was also
  rejected because it models the epithelial-barrier hypothesis of type 2
  allergic disease and terminates in IgE class switch and the atopic march.
definitions:
- name: Bell staging of necrotizing enterocolitis
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Clinical staging system that grades NEC by systemic signs, intestinal signs
    and radiographic findings, and that ties each grade to a management tier.
    Proposed by Bell and colleagues in 1978 and subsequently modified; it
    remains the reference stratification used by trials, registries and
    surgical series, and is the basis of the medical (stage II) versus surgical
    (stage III) split used throughout this entry.
  scope: Preterm and term neonates with suspected necrotizing enterocolitis
  evidence:
  - reference: PMID:413500
    reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A method of clinical staging for infants with necrotizing enterocolitis (NEC) is proposed."
    explanation: >-
      The originating publication of the staging system this definition records.
  - reference: PMID:413500
    reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      For Stage I infants, vigorous diagnostic and supportive measures are
      appropriate. Stage II infants are treated medically, including parenteral
      and gavage aminoglycoside antibiotic, and Stage III patients require
      operation.
    explanation: >-
      States the stage-to-management mapping that makes the staging system a
      therapeutic and not merely descriptive classification.
stages:
- name: Bell stage I
  description: >-
    Mild or suspected NEC. Mild systemic and intestinal signs with nonspecific
    radiographs; managed by close observation and withholding enteral feeds.
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mild NEC, suspected NEC | Mild systemic signs and intestinal signs | Nonspecific"
    explanation: >-
      The review's Bell staging table row defining stage I severity and
      radiographic findings.
- name: Bell stage II
  description: >-
    Moderate NEC, the medically managed tier. Prominent abdominal distension,
    tenderness and wall oedema with thrombocytopenia and metabolic acidosis, plus
    pneumatosis intestinalis or portal venous gas on radiography.
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Moderate systemic signs with prominent abdominal distension, abdominal
      tenderness and wall oedema Thrombocytopenia and metabolic acidosis |
      Pneumatosis intestinalis, portal venous gas
    explanation: >-
      The review's Bell staging table row defining the stage II clinical and
      radiographic criteria.
- name: Bell stage III
  description: >-
    Advanced NEC, the surgical tier. Worsening stage II findings plus
    hypotension, peritonitis, severe metabolic acidosis and shock, with
    pneumoperitoneum on radiography; managed by laparotomy and resection of
    necrotic bowel, or peritoneal drainage in selected infants.
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Worsening stage II signs and symptoms plus hypotension Signs of
      peritonitis Severe metabolic acidosis and shock.
    explanation: >-
      The review's Bell staging table row defining stage III, the tier at which
      operative intervention is indicated.
pathophysiology:
- name: Intestinal Immaturity of Prematurity
  biological_scale: TISSUE
  description: >-
    Preterm birth interrupts intestinal maturation, leaving an epithelium with
    incomplete junctional and mucus barrier function, an innate immune
    set-point tuned to over-respond to microbial ligands, and immature
    microvascular and neuromuscular control. This is the substrate on which
    every other node in this entry acts, and it is why gestational age is the
    dominant risk factor for NEC rather than any single exposure.
  biological_processes:
  - preferred_term: intestinal epithelial cell development
    term:
      id: GO:0060576
      label: intestinal epithelial cell development
    modifier: DECREASED
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  downstream:
  - target: Elevated Intestinal Epithelial TLR4 Expression
    description: >-
      The immature gut carries the higher TLR4 expression that makes it
      hyper-reactive to luminal lipopolysaccharide.
  - target: Abnormal Microbial Colonization of the Preterm Gut
    description: >-
      Prolonged hospitalization, delayed and non-maternal feeding, and broad
      antibiotic exposure shape an abnormal colonization trajectory in the
      preterm gut.
  - target: Impaired Intestinal Microcirculatory Autoregulation
    description: >-
      Immature vasoregulation leaves mesenteric perfusion poorly able to match
      the metabolic demand imposed by enteral feeding.
  evidence:
  - reference: PMID:40953322
    reference_title: "Exploring the Complex Pathophysiology of Necrotizing Enterocolitis in Preterm Neonates."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We examine key contributing factors, including intestinal vascular
      development, mucosal immunity, intestinal regeneration, the enteric
      nervous system, and the gut microbiome, highlighting how prematurity
      disrupts these processes and predisposes neonates to NEC.
    explanation: >-
      Names prematurity as the disruption acting across the vascular, immune,
      regenerative and microbial axes that the downstream nodes here separate
      out.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      disease onset is thought to be due in part to a baseline increased
      reactivity of the premature intestinal mucosa to microbial ligands as
      compared with the full-term intestinal mucosa
    explanation: >-
      States the immature-mucosa hyper-reactivity that this node represents, and
      contrasts it explicitly with the full-term gut.

- name: Elevated Intestinal Epithelial TLR4 Expression
  biological_scale: MOLECULAR
  description: >-
    The premature intestinal epithelium expresses TLR4 at higher levels than the
    full-term epithelium. This is not incidental: TLR4 has a developmental role
    in normal gut morphogenesis, and its prenatal persistence leaves the preterm
    epithelium primed to respond to the lipopolysaccharide it will meet once
    colonization and feeding begin.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: INCREASED
  downstream:
  - target: Epithelial TLR4 Hyperactivation by Luminal Lipopolysaccharide
    description: >-
      High receptor abundance converts a given luminal lipopolysaccharide load
      into a larger epithelial signal than the same load would produce in a
      term gut.
  evidence:
  - reference: PMID:35347256
    reference_title: "Bench to bedside - new insights into the pathogenesis of necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Central amongst the bacterial signalling receptors implicated in NEC
      development is the lipopolysaccharide receptor Toll-like receptor 4
      (TLR4), which is expressed at higher levels in the premature gut than in
      the full-term gut.
    explanation: >-
      States both claims this node makes: that TLR4 is the central receptor, and
      that its expression is higher in the premature than the full-term gut.
  - reference: PMID:17878380
    reference_title: "A critical role for TLR4 in the pathogenesis of necrotizing enterocolitis by modulating intestinal injury and repair."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We now demonstrate that NEC in mice and humans is associated with
      increased expression of TLR4 in the intestinal mucosa and that
      physiological stressors associated with NEC development, namely, exposure
      to LPS and hypoxia, sensitize the murine intestinal epithelium to LPS
      through up-regulation of TLR4.
    explanation: >-
      Measures increased mucosal TLR4 in NEC and shows that the physiological
      stressors of NEC further up-regulate it, which is the sensitization this
      node asserts.

- name: Abnormal Microbial Colonization of the Preterm Gut
  biological_scale: ORGANISM
  description: >-
    The preterm gut is colonized on an abnormal trajectory. Rather than a
    consistent single pathogen, what distinguishes infants who go on to develop
    NEC is a shift in community structure that emerges weeks after birth: an
    expansion of facultatively anaerobic Gammaproteobacteria and a depletion of
    strict anaerobes. No organism is necessary or sufficient, which is why this
    node is a community-level state rather than an infection.
  locations:
  - preferred_term: intestinal mucosa
    term:
      id: UBERON:0001242
      label: intestinal mucosa
  notes: >-
    Taxa named in the supporting studies are Gammaproteobacteria
    (NCBITaxon:1236) and Enterobacteriaceae (NCBITaxon:543) on the expanding
    side, Negativicutes and other strict anaerobes on the depleted side, and
    Bifidobacterium longum (NCBITaxon:216816) among the taxa reduced before
    onset. NCBITaxon terms are not bound in `cell_types`, per the
    microbiome-curation rule that microbial taxa are not cell types.
  downstream:
  - target: Gammaproteobacterial Bloom and Increased Luminal Lipopolysaccharide Load
    description: >-
      The community shift is what raises the gram-negative share of the
      community and therefore the luminal lipopolysaccharide burden.
  evidence:
  - reference: PMID:26969089
    reference_title: "Gut bacteria dysbiosis and necrotising enterocolitis in very low birthweight infants: a prospective case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The microbial community structure in case stools differed significantly from those in control stools. These differences emerged only after the first month of age."
    explanation: >-
      Prospective case-control stool sequencing in very low birthweight infants
      establishes a community-structure difference preceding NEC, and dates its
      emergence, which is the community-level claim this node makes.
  - reference: PMID:33330904
    reference_title: "Necrotizing Enterocolitis and the Microbiome: Current Status and Future Directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      evidence suggests that host-microbiota interactions, in which microbial
      dysbiosis is followed by loss of barrier integrity, inflammation, and
      necrosis, are central to NEC development
    explanation: >-
      States the dysbiosis-to-barrier-failure-to-necrosis ordering that this
      node heads.

- name: Gammaproteobacterial Bloom and Increased Luminal Lipopolysaccharide Load
  biological_scale: ORGANISM
  description: >-
    Expansion of facultatively anaerobic Gammaproteobacteria, largely
    Enterobacteriaceae, at the expense of strict anaerobes raises the
    gram-negative fraction of the luminal community and with it the
    lipopolysaccharide available at the epithelial surface. This is the ligand
    supply side of the TLR4 mechanism; the receptor side is the preceding
    epithelial node.
  chemical_entities:
  - preferred_term: lipopolysaccharide
    term:
      id: CHEBI:16412
      label: lipopolysaccharide
    modifier: INCREASED
  downstream:
  - target: Epithelial TLR4 Hyperactivation by Luminal Lipopolysaccharide
    description: >-
      The raised luminal lipopolysaccharide load is the ligand that engages the
      over-expressed epithelial receptor.
  evidence:
  - reference: PMID:26969089
    reference_title: "Gut bacteria dysbiosis and necrotising enterocolitis in very low birthweight infants: a prospective case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "the time-by-necrotising-enterocolitis interaction was positively associated with Gammaproteobacteria"
    explanation: >-
      Names the expanding taxonomic group this node asserts, measured in stool
      before NEC onset.
  - reference: PMID:33328245
    reference_title: "Human milk oligosaccharide DSLNT and gut microbiome in preterm infants predicts necrotising enterocolitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Metagenomic sequencing before NEC onset showed significantly lower
      relative abundance of Bifidobacterium longum and higher relative
      abundance of Enterobacter cloacae in infants with NEC.
    explanation: >-
      Independent metagenomic replication of the same directional shift at
      species level, sampled before onset, with a named Enterobacteriaceae
      organism on the expanding side.

- name: Epithelial TLR4 Hyperactivation by Luminal Lipopolysaccharide
  biological_scale: CELLULAR
  description: >-
    Engagement of the abundant epithelial TLR4 by luminal lipopolysaccharide
    converts the ligand load into a proinflammatory epithelial response. This
    is the convergence point of the two upstream arms - the receptor supplied
    by prematurity and the ligand supplied by abnormal colonization - and it is
    the step that the protective effect of human milk is thought to act on.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: cellular response to lipopolysaccharide
    term:
      id: GO:0071222
      label: cellular response to lipopolysaccharide
    modifier: INCREASED
  downstream:
  - target: Enterocyte Apoptosis and Failed Mucosal Restitution
    description: >-
      TLR4 signalling shifts the epithelium from renewal toward death and
      arrested repair.
  - target: Mucosal Proinflammatory Cytokine Amplification
    description: >-
      The same signalling drives the mucosal cytokine output that recruits
      myeloid cells and sustains the inflammatory response.
  evidence:
  - reference: PMID:35347256
    reference_title: "Bench to bedside - new insights into the pathogenesis of necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the interaction between bacterial signalling receptors on the premature
      intestine and an abnormal gut microbiota incites a pro-inflammatory
      response in the intestinal mucosa and its underlying endothelium that
      leads to NEC
    explanation: >-
      States the receptor-plus-microbiota convergence this node represents, and
      its proinflammatory output in both mucosa and endothelium.
  - reference: PMID:17878380
    reference_title: "A critical role for TLR4 in the pathogenesis of necrotizing enterocolitis by modulating intestinal injury and repair."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "TLR4-mutant C3H/HeJ mice were protected from the development of NEC compared with wild-type C3H/HeOUJ littermates."
    explanation: >-
      Loss-of-receptor protection in a murine NEC model establishes that
      epithelial TLR4 signalling is required rather than merely correlated.

- name: Enterocyte Apoptosis and Failed Mucosal Restitution
  conforms_to: intestinal_barrier_dysfunction#Epithelial Stress and Injury
  biological_scale: CELLULAR
  description: >-
    Downstream of TLR4 the epithelium both loses cells to apoptosis and fails to
    replace them: migration and proliferation are suppressed, so the denuded
    surface is not resurfaced. The lesion is therefore not injury alone but
    injury with arrested repair, which is what allows a focal insult to become a
    confluent defect.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: epithelial cell migration
    term:
      id: GO:0010631
      label: epithelial cell migration
    modifier: DECREASED
  - preferred_term: epithelial cell proliferation
    term:
      id: GO:0050673
      label: epithelial cell proliferation
    modifier: DECREASED
  downstream:
  - target: Intestinal Epithelial Barrier Failure and Bacterial Translocation
    description: >-
      Unrepaired epithelial loss is the structural basis of the barrier defect.
  evidence:
  - reference: PMID:17878380
    reference_title: "A critical role for TLR4 in the pathogenesis of necrotizing enterocolitis by modulating intestinal injury and repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "TLR4 activation in vitro led to increased enterocyte apoptosis and reduced enterocyte migration and proliferation, suggesting a role for TLR4 in intestinal repair."
    explanation: >-
      Directly measures the three process changes this node binds - apoptosis
      up, migration and proliferation down - as consequences of TLR4
      activation.
  - reference: PMID:25899687
    reference_title: "Breast milk protects against the development of necrotizing enterocolitis through inhibition of Toll-like receptor 4 in the intestinal epithelium via activation of the epidermal growth factor receptor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The protective effects of breast milk occurred via inhibition of enterocyte apoptosis and restoration of enterocyte proliferation."
    explanation: >-
      Rescue in the opposite direction: an intervention that protects against
      NEC does so by reversing exactly the apoptosis-and-proliferation changes
      this node asserts. Graded INDIRECT because the inference runs from
      therapeutic reversal back to the mechanism.

- name: Impaired Intestinal Microcirculatory Autoregulation
  biological_scale: TISSUE
  description: >-
    The newborn mesenteric circulation is held in a strongly vasodilated state
    by endothelium-derived nitric oxide, which is what keeps oxygen delivery
    matched to a rapidly growing gut. That arrangement has little reserve:
    endothelial injury shifts the balance toward endothelin-1-mediated
    vasoconstriction, and in the preterm infant the shift can be provoked by the
    ordinary metabolic demand of an enteral feed.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: nitric oxide biosynthetic process
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Intestinal Microcirculatory Hypoperfusion and Mucosal Ischemia
    description: >-
      Loss of the vasodilatory set-point is what converts a normal feeding
      demand into a perfusion deficit.
  evidence:
  - reference: PMID:18346531
    reference_title: "The neonatal intestinal vasculature: contributing factors to necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the newborn, this balance heavily favors vasodilation secondary to the
      copious production of endothelium-derived nitric oxide (NO), a
      circumstance which serves to ensure adequate blood flow and thus oxygen
      delivery to the rapidly growing intestine.
    explanation: >-
      States the nitric-oxide-dependent vasodilatory set-point whose fragility
      this node represents.
  - reference: PMID:18346531
    reference_title: "The neonatal intestinal vasculature: contributing factors to necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Endothelial cell injury could shift this balance in favor of endothelin (ET)-1-mediated vasoconstriction, leading to intestinal ischemia and tissue injury."
    explanation: >-
      Names the direction the balance shifts in and the ischemic consequence
      that the downstream node carries.

- name: Endothelial TLR4 Activation and Loss of eNOS-Dependent Vasodilation
  biological_scale: CELLULAR
  description: >-
    TLR4 signalling in the intestinal endothelium, not only in the epithelium,
    is required for experimental NEC. Endothelial TLR4 activation reduces
    endothelial nitric oxide synthase expression through MyD88 and selectively
    impairs perfusion of the small intestine, which supplies the mechanism by
    which an inflammatory signal produces the ischemia that had otherwise to be
    assumed.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: INCREASED
  - preferred_term: establishment of endothelial barrier
    term:
      id: GO:0061028
      label: establishment of endothelial barrier
    modifier: DECREASED
  downstream:
  - target: Intestinal Microcirculatory Hypoperfusion and Mucosal Ischemia
    description: >-
      Reduced endothelial nitric oxide synthase output is the direct cause of
      the perfusion deficit in this arm.
  evidence:
  - reference: PMID:23650378
    reference_title: "Endothelial TLR4 activation impairs intestinal microcirculatory perfusion in necrotizing enterocolitis via eNOS-NO-nitrite signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      we now show that endothelial TLR4 activation is required for NEC
      development and that endothelial TLR4 activation impairs intestinal
      perfusion without effects on other organs and reduces eNOS expression via
      activation of myeloid differentiation primary response gene 88
    explanation: >-
      Endothelium-selective TLR4 deletion establishes requirement, gut
      selectivity, and the eNOS-lowering mechanism that this node asserts.
  - reference: PMID:23650378
    reference_title: "Endothelial TLR4 activation impairs intestinal microcirculatory perfusion in necrotizing enterocolitis via eNOS-NO-nitrite signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "NEC severity was significantly increased in eNOS(-/-) mice and decreased upon administration of the phosphodiesterase inhibitor sildenafil, which augments eNOS function."
    explanation: >-
      Bidirectional genetic and pharmacological manipulation of eNOS moves NEC
      severity in opposite directions, supporting eNOS as the effector rather
      than a correlate. INDIRECT because the inference runs from severity
      modulation back to the perfusion step.

- name: Intestinal Microcirculatory Hypoperfusion and Mucosal Ischemia
  biological_scale: TISSUE
  description: >-
    Convergence of the developmental and inflammatory vascular arms on a
    localized perfusion deficit in the small bowel and colon. Ischemia is not
    merely a late complication of established inflammation here: the coagulative
    character of the necrosis found at surgery is the evidence that it is
    upstream, and one current sequential model places feeding-triggered
    localized ischemia at the initiating step.
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  locations:
  - preferred_term: wall of small intestine
    term:
      id: UBERON:0001168
      label: wall of small intestine
  downstream:
  - target: Intestinal Epithelial Barrier Failure and Bacterial Translocation
    description: >-
      Ischemic epithelium loses barrier function independently of the TLR4
      apoptotic arm.
  - target: Coagulative Mucosal Necrosis and Intramural Gas Formation
    description: >-
      Sustained regional ischemia is what produces coagulative rather than
      purely inflammatory necrosis.
  evidence:
  - reference: PMID:18346531
    reference_title: "The neonatal intestinal vasculature: contributing factors to necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the demonstration of coagulation necrosis, it is clear that intestinal ischemia plays a role in the pathogenesis of necrotizing enterocolitis (NEC)."
    explanation: >-
      Argues from the histological character of the lesion to the presence of
      ischemia in the causal chain, which is why this node sits upstream of the
      necrosis node rather than beside it.
  - reference: PMID:40953322
    reference_title: "Exploring the Complex Pathophysiology of Necrotizing Enterocolitis in Preterm Neonates."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      we propose a sequential model of NEC pathogenesis, hypothesizing that
      impaired intestinal microcirculation in preterm neonates compromises blood
      flow in response to enteral feeding, leading to localized ischemia
    explanation: >-
      States the feeding-triggered localized-ischemia step explicitly. Cited as
      a proposed model, which is how the review frames it.

- name: Intestinal Epithelial Barrier Failure and Bacterial Translocation
  conforms_to: intestinal_barrier_dysfunction#Luminal Access and Inflammatory Amplification
  biological_scale: TISSUE
  description: >-
    Once the epithelium is breached, luminal bacteria and lipopolysaccharide
    reach the lamina propria, the submucosa and the portal circulation. This is
    the amplification step of the disease: the same ligands that started the
    epithelial response now reach the immune and vascular compartments directly,
    so injury feeds its own cause.
  locations:
  - preferred_term: intestinal mucosa
    term:
      id: UBERON:0001242
      label: intestinal mucosa
  biological_processes:
  - preferred_term: tight junction organization
    term:
      id: GO:0120193
      label: tight junction organization
    modifier: DECREASED
  downstream:
  - target: Mucosal Proinflammatory Cytokine Amplification
    description: >-
      Translocated microbial products engage lamina propria myeloid cells.
  - target: Systemic Inflammatory Response and Sepsis
    description: >-
      Portal and systemic entry of enteric organisms is the route from a local
      lesion to bacteraemia.
  evidence:
  - reference: PMID:17878380
    reference_title: "A critical role for TLR4 in the pathogenesis of necrotizing enterocolitis by modulating intestinal injury and repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "is characterized by translocation of LPS across the inflamed intestine"
    explanation: >-
      States translocation of lipopolysaccharide across the inflamed intestine
      as a defining feature of the human disease. Graded HUMAN_CLINICAL for the
      clinical characterization the sentence makes, with quote_role BACKGROUND
      because the citing paper is a murine study restating it.
  - reference: PMID:33330904
    reference_title: "Necrotizing Enterocolitis and the Microbiome: Current Status and Future Directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      evidence suggests that host-microbiota interactions, in which microbial
      dysbiosis is followed by loss of barrier integrity, inflammation, and
      necrosis, are central to NEC development
    explanation: >-
      Places loss of barrier integrity between dysbiosis and inflammation, which
      is the position this node occupies.

- name: Mucosal Proinflammatory Cytokine Amplification
  biological_scale: TISSUE
  description: >-
    Lamina propria macrophages and recruited neutrophils, engaged by
    translocated microbial products and by epithelial signals, release TNF,
    interleukin-6, platelet-activating factor and nitric oxide. The output is
    large enough to be systemic rather than local, which is what links the
    intestinal lesion to the haemodynamic and cerebral consequences.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  downstream:
  - target: Coagulative Mucosal Necrosis and Intramural Gas Formation
    description: >-
      Cytokine and nitric-oxide-mediated tissue injury contributes to the
      necrotic lesion alongside ischemia.
  - target: Systemic Inflammatory Response and Sepsis
    description: >-
      The mediator output spills over into a systemic inflammatory state.
  - target: Abdominal distention
    description: >-
      Inflammatory ileus with bowel wall oedema is what produces the distension,
      tenderness and wall oedema that the Bell stage II criteria name together.
  - target: Feeding difficulties
    description: >-
      Inflammatory disturbance of motility and gastric emptying presents as
      feeding intolerance with raised gastric residuals, which is typically the
      first sign.
  evidence:
  - reference: PMID:27836422
    reference_title: "Surgical necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      interleukin-6, platelet activating factor, and nitric oxide, claimed to
      contribute to a mechanism that leads to hemodynamic instability, tissue
      necrosis, and white matter injury
    explanation: >-
      Names the mediators this node binds and the three consequences its
      downstream edges carry: haemodynamic instability, tissue necrosis and
      white matter injury.
  - reference: PMID:35347256
    reference_title: "Bench to bedside - new insights into the pathogenesis of necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      incites a pro-inflammatory response in the intestinal mucosa and its
      underlying endothelium that leads to NEC
    explanation: >-
      Locates the proinflammatory response in the mucosa and the underlying
      endothelium, and places it causally upstream of NEC.

- name: Coagulative Mucosal Necrosis and Intramural Gas Formation
  biological_scale: TISSUE
  description: >-
    The characteristic lesion: patchy coagulative necrosis of the bowel wall,
    with gas generated by luminal organisms tracking into the mucosal,
    submucosal and subserosal layers. The intramural gas is what plain
    radiography detects as pneumatosis intestinalis, so this node is where the
    mechanism becomes visible at the bedside.
  locations:
  - preferred_term: wall of small intestine
    term:
      id: UBERON:0001168
      label: wall of small intestine
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  downstream:
  - target: Intramural intestinal gas
    description: >-
      Gas within the bowel wall layers is the radiographic finding this lesion
      produces.
  - target: Transmural Necrosis and Intestinal Perforation
    description: >-
      Extension of necrosis through the full wall thickness is what perforates.
  - target: Hematochezia
    description: >-
      Necrosis and sloughing of the mucosal surface is the source of the blood
      passed per rectum.
  - target: Ileal stricture
    description: >-
      Where a necrotic segment survives and heals, it heals by fibrosis, which is
      why stricture is commonest after medically rather than surgically managed
      disease.
  evidence:
  - reference: PMID:36864828
    reference_title: "Imaging for Diagnosis and Assessment of Necrotizing Enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pneumatosis intestinalis refers to gas bubbles/cysts in the mucosal, submucosal, subserosal, or all three bowel wall layers."
    explanation: >-
      Defines the intramural distribution of gas that this node asserts, layer
      by layer.
  - reference: PMID:18346531
    reference_title: "The neonatal intestinal vasculature: contributing factors to necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the demonstration of coagulation necrosis, it is clear that intestinal ischemia plays a role in the pathogenesis"
    explanation: >-
      Attests that the necrosis found in NEC is coagulative, which is the
      histological character named in this node.

- name: Transmural Necrosis and Intestinal Perforation
  biological_scale: TISSUE
  description: >-
    Progression of necrosis through the full thickness of the bowel wall,
    ending in perforation, enteric spillage and peritonitis. This is the
    threshold that converts medical NEC into surgical NEC, and it is the state
    that operative intervention is intended to pre-empt or control.
  locations:
  - preferred_term: wall of small intestine
    term:
      id: UBERON:0001168
      label: wall of small intestine
  downstream:
  - target: Intestinal perforation
    description: >-
      Full-thickness necrosis is the immediate cause of the perforation.
  - target: Systemic Inflammatory Response and Sepsis
    description: >-
      Enteric spillage into the peritoneum accelerates the systemic septic
      response.
  - target: Short bowel syndrome
    description: >-
      Resection of the full-thickness-necrotic segment is what removes absorptive
      length; residual length is the determinant of intestinal failure.
  evidence:
  - reference: PMID:38564081
    reference_title: "Neonatal Necrotizing Enterocolitis: An Update on Pathophysiology, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      resulting in inflammation and necrosis of the small bowel and colon and
      potentially leading to sepsis, peritonitis, perforation, and death
    explanation: >-
      States the progression from necrosis to perforation, peritonitis and
      sepsis that this node and its downstream edges represent.
  - reference: PMID:27836422
    reference_title: "Surgical necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The primary goals of surgical intervention in NEC are to control enteric spillage and/or resect necrotic intestine while maximizing the length of viable intestine."
    explanation: >-
      Enteric spillage and resectable necrotic intestine are the operative
      problem, which is the clinical correlate of this node.

- name: Systemic Inflammatory Response and Sepsis
  biological_scale: ORGANISM
  description: >-
    Spillover of the mucosal mediator load, together with bacteraemia from
    translocated enteric organisms, produces a systemic inflammatory state with
    haemodynamic instability, thrombocytopenia and metabolic acidosis. It is
    this systemic arm rather than the bowel lesion itself that carries much of
    the disease's mortality and its remote organ injury.
  downstream:
  - target: Neonatal sepsis
    description: >-
      Enteric organisms reaching the bloodstream give the septic phenotype.
  - target: Thrombocytopenia
    description: >-
      Consumptive thrombocytopenia accompanies the systemic inflammatory state
      and is one of the stage II criteria.
  - target: Metabolic acidosis
    description: >-
      Hypoperfusion and the systemic inflammatory state produce the acidosis
      that grades stage II and stage III disease.
  - target: Cerebral White Matter Injury
    description: >-
      Circulating inflammatory mediators are the proposed route from the
      intestinal lesion to the developing brain.
  evidence:
  - reference: PMID:413500
    reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Enteric organisms were cultured from the blood of four infants dying of NEC."
    explanation: >-
      Direct human evidence that gut organisms reach the bloodstream in fatal
      NEC, which is the bacteraemic component of this node.
  - reference: PMID:38564081
    reference_title: "Neonatal Necrotizing Enterocolitis: An Update on Pathophysiology, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "potentially leading to sepsis, peritonitis, perforation, and death"
    explanation: >-
      Names sepsis and death as the systemic endpoints of the intestinal
      lesion.

- name: Cerebral White Matter Injury
  biological_scale: TISSUE
  description: >-
    Preterm infants with NEC carry an excess of severe intraventricular
    haemorrhage and periventricular leukomalacia, and the excess is larger in
    surgical than in medically managed disease. The proposed mechanism is the
    circulating proinflammatory mediator load generated by the intestinal
    lesion, acting on the vulnerable developing white matter; the dose-response
    with disease severity is the main argument that the association is more than
    shared prematurity.
  notes: >-
    Whether this is causal remains open. The meta-analysis cited here says so
    explicitly, and confounding by gestational age, illness severity and
    nutritional interruption is not fully separable in observational data. No
    microglial or astrocytic cell type is bound and no `conforms_to` on
    `neuroinflammation_glial_activation` is asserted: the module's central node
    is a reactive microglial and astrocytic state, and no source read for this
    entry measures glial activation in the brains of infants with NEC. See the
    `discussions` entry.
  downstream:
  - target: Periventricular leukomalacia
    description: >-
      White matter injury in the periventricular distribution is the imaging
      and neuropathological correlate.
  - target: Neurodevelopmental delay
    description: >-
      Periventricular white matter injury is the substrate of the later motor,
      cognitive and language deficits.
  evidence:
  - reference: PMID:38684534
    reference_title: "Neurodevelopmental outcomes of preterm with necrotizing enterocolitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Regarding brain injury, pooled crude ORs indicated an association of NEC
      with severe intraventricular haemorrhage (IVH) (OR 1.42, 95% CI 1.06-1.92)
      and periventricular leucomalacia (PVL) (OR 2.55, 95% CI 1.76-3.69).
    explanation: >-
      Quantifies the excess of severe intraventricular haemorrhage and
      periventricular leukomalacia in infants with NEC across 33 studies.
  - reference: PMID:27836422
    reference_title: "Surgical necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "claimed to contribute to a mechanism that leads to hemodynamic instability, tissue necrosis, and white matter injury"
    explanation: >-
      States the proposed mediator route from the intestinal inflammatory
      response to white matter injury. INDIRECT and hedged in the source itself
      ("claimed to"), which is why this node's causal status is recorded as
      open.
phenotypes:
- category: Clinical
  name: Feeding difficulties
  description: >-
    Feeding intolerance, usually with raised gastric residuals, is the earliest
    and commonest gastrointestinal sign and typically precedes the abdominal and
    radiographic findings.
  phenotype_term:
    preferred_term: Feeding intolerance
    term:
      id: HP:0011968
      label: Feeding difficulties
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The typical neonate with NEC is a premature infant who is thriving, yet
      suddenly presents with feeding intolerance, abdominal distension, bloody
      stools and signs of sepsis
    explanation: >-
      Names feeding intolerance as part of the typical presenting picture.

- category: Clinical
  name: Abdominal distention
  description: >-
    Abdominal distension with tenderness and abdominal wall oedema is a
    cardinal sign and one of the Bell stage II criteria.
  phenotype_term:
    preferred_term: Abdominal distension
    term:
      id: HP:0003270
      label: Abdominal distention
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Moderate systemic signs with prominent abdominal distension, abdominal
      tenderness and wall oedema
    explanation: >-
      The Bell stage II row names prominent abdominal distension, tenderness and
      wall oedema as defining signs of the medically managed tier.

- category: Clinical
  name: Hematochezia
  description: >-
    Passage of gross or occult blood per rectum, reflecting mucosal necrosis and
    sloughing.
  phenotype_term:
    preferred_term: Bloody stools
    term:
      id: HP:0002573
      label: Hematochezia
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "suddenly presents with feeding intolerance, abdominal distension, bloody stools and signs of sepsis"
    explanation: >-
      Names bloody stools as part of the typical presenting picture.

- category: Radiographic
  name: Intramural intestinal gas
  description: >-
    Pneumatosis intestinalis: gas within the bowel wall, considered
    pathognomonic for NEC, but present on plain radiography in only about
    55-60% of affected infants, so its absence does not exclude the diagnosis.
  phenotype_term:
    preferred_term: Pneumatosis intestinalis
    term:
      id: HP:6000377
      label: Intramural intestinal gas
  diagnostic: true
  frequency: COMMON
  evidence:
  - reference: PMID:36864828
    reference_title: "Imaging for Diagnosis and Assessment of Necrotizing Enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More specific radiographic findings, which have been considered
      pathognomonic for NEC, include pneumatosis intestinalis and the detection
      of radiolucent gas in the portal venous system
    explanation: >-
      Establishes pneumatosis intestinalis as the specific, near-pathognomonic
      radiographic finding of NEC.
  - reference: PMID:36864828
    reference_title: "Imaging for Diagnosis and Assessment of Necrotizing Enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "pneumatosis is seen only in 55-60% of all infants with NEC"
    explanation: >-
      Quantifies the sensitivity limitation recorded in this phenotype's
      description, supporting the COMMON rather than universal frequency band.

- category: Clinical
  name: Intestinal perforation
  description: >-
    Full-thickness bowel necrosis with perforation. Radiographic
    pneumoperitoneum is the only absolute indication for operation in NEC,
    although it is present in fewer than half of infants found to have
    perforation or necrosis at laparotomy.
  phenotype_term:
    preferred_term: Intestinal perforation
    term:
      id: HP:0031368
      label: Intestinal perforation
    temporality: ACUTE
  severity: SEVERE
  diagnostic: true
  evidence:
  - reference: PMID:38564081
    reference_title: "Neonatal Necrotizing Enterocolitis: An Update on Pathophysiology, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "potentially leading to sepsis, peritonitis, perforation, and death"
    explanation: >-
      Names perforation among the outcomes of established NEC.
  - reference: PMID:27836422
    reference_title: "Surgical necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pneumoperitoneum is present in less than half of all infants with
      intestinal perforation or necrosis at the time of operative exploration,
      demonstrating that it is a relatively insensitive marker of infants with
      surgical NEC.
    explanation: >-
      Quantifies the insensitivity of pneumoperitoneum recorded in this
      phenotype's description: perforation is present more often than the
      radiographic sign that is its only absolute indication for operation.

- category: Clinical
  name: Neonatal sepsis
  description: >-
    Systemic inflammatory response with culture-positive bacteraemia from
    translocated enteric organisms; the septic signs are often what brings the
    infant to attention.
  phenotype_term:
    preferred_term: Neonatal sepsis
    term:
      id: HP:0040187
      label: Neonatal sepsis
    temporality: ACUTE
  severity: SEVERE
  evidence:
  - reference: PMID:413500
    reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Enteric organisms were cultured from the blood of four infants dying of NEC."
    explanation: >-
      Culture-confirmed enteric bacteraemia in infants dying of NEC.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      signs of sepsis (that is, changes in heart rate, respiratory rate,
      temperature and blood pressure)
    explanation: >-
      Names the septic signs that form part of the presenting picture and
      specifies what they consist of.

- category: Laboratory
  name: Thrombocytopenia
  description: >-
    Falling platelet count accompanies the systemic inflammatory response and is
    one of the Bell stage II laboratory criteria.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Moderate NEC | Moderate systemic signs with prominent abdominal
      distension, abdominal tenderness and wall oedema Thrombocytopenia and
      metabolic acidosis
    explanation: >-
      The Bell staging table lists thrombocytopenia among the laboratory
      criteria that define moderate, medically managed disease.

- category: Laboratory
  name: Metabolic acidosis
  description: >-
    Metabolic acidosis reflects tissue hypoperfusion; it is a stage II criterion
    and becomes severe, with shock, at stage III.
  phenotype_term:
    preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severe metabolic acidosis and shock."
    explanation: >-
      The Bell stage III row names severe metabolic acidosis with shock as a
      defining feature of advanced disease.

- category: Gastrointestinal
  name: Ileal stricture
  description: >-
    Fibrotic narrowing of healed bowel is the commonest late gastrointestinal
    complication, reported in roughly 12-35% of survivors and more frequent
    after medical than surgical management.
  phenotype_term:
    preferred_term: Post-NEC intestinal stricture
    term:
      id: HP:0020002
      label: Ileal stricture
    temporality: CHRONIC
  frequency: COMMON
  evidence:
  - reference: PMID:30864508
    reference_title: "Necrotizing Enterocolitis: Long Term Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Common complications of NEC include neurodevelopmental delay, failure to
      thrive, gastrointestinal problems including strictures and adhesions,
      cholestasis, short bowel syndrome with or without intestinal failure that
      can be difficult to manage.
    explanation: >-
      Names strictures among the common long-term complications of NEC.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intestinal strictures | 12-35%"
    explanation: >-
      The review's complications table gives the incidence range quoted in this
      phenotype's description.
  notes: >-
    Bound to `HP:0020002 Ileal stricture` rather than a generic intestinal
    stricture term because HPO has no such generic class: `l~intestinal
    stricture` against OLS HP returns nothing, and `l~small bowel stricture`
    returns only `HP:0020002`. Post-NEC strictures are commonest in the colon,
    so the binding is narrower in site than the disease warrants; the
    `preferred_term` carries the correct concept.

- category: Gastrointestinal
  name: Short bowel syndrome
  description: >-
    Extensive resection of necrotic bowel, or a long segment lost to the disease
    itself, leaves insufficient absorptive length, reported in roughly 20-35% of
    survivors and the main route to long-term parenteral nutrition dependence.
  phenotype_term:
    preferred_term: Short bowel syndrome
    temporality: CHRONIC
  frequency: COMMON
  sequelae:
  - target: Cholestasis
    description: >-
      Short bowel syndrome is what makes parenteral nutrition dependence
      prolonged, and prolonged dependence is what produces the cholestasis.
  - target: Failure to thrive
    description: >-
      Insufficient absorptive length is the route to growth failure, which the
      cited review reports is most severe in post-NEC short bowel syndrome.
  evidence:
  - reference: PMID:30864508
    reference_title: "Necrotizing Enterocolitis: Long Term Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      short bowel syndrome with or without intestinal failure that can be
      difficult to manage
    explanation: >-
      Names short bowel syndrome with or without intestinal failure as a
      long-term complication.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Short Bowel Syndrome | 20-35%"
    explanation: >-
      The review's complications table gives the incidence range quoted in this
      phenotype's description.
  notes: >-
    Left unbound. HPO has no class for acquired short bowel syndrome. Searches
    against OLS HP: `short bowel` returns only `HP:0030889 Congenital shortened
    small intestine` (synonym "Short bowel"), which is congenital and so the
    wrong concept for a post-resection state; `intestinal failure` returns only
    agenesis terms; `malabsorption` returns `HP:0002024 Malabsorption`, which is
    a consequence rather than this entity. `HP:0033994 Dependency on parenteral
    nutrition` names the management consequence and is also not this entity.
    `preferred_term` carries the concept rather than asserting a wrong binding.

- category: Gastrointestinal
  name: Cholestasis
  description: >-
    Cholestasis in NEC survivors is driven by prolonged parenteral nutrition
    dependence and by the loss of enteral feeding during and after the acute
    illness.
  phenotype_term:
    preferred_term: Cholestasis
    term:
      id: HP:0001396
      label: Cholestasis
    temporality: CHRONIC
  evidence:
  - reference: PMID:30864508
    reference_title: "Necrotizing Enterocolitis: Long Term Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      gastrointestinal problems including strictures and adhesions, cholestasis,
      short bowel syndrome with or without intestinal failure
    explanation: >-
      Names cholestasis among the long-term complications of NEC.

- category: Growth
  name: Failure to thrive
  description: >-
    Growth failure after NEC, most marked in infants left with short bowel
    syndrome.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
    temporality: CHRONIC
  evidence:
  - reference: PMID:30864508
    reference_title: "Necrotizing Enterocolitis: Long Term Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Common complications of NEC include neurodevelopmental delay, failure to thrive"
    explanation: >-
      Names failure to thrive among the common long-term complications.

- category: Neurologic
  name: Periventricular leukomalacia
  description: >-
    White matter injury in the periventricular distribution is over-represented
    in infants with NEC, with a pooled crude odds ratio of about 2.6.
  phenotype_term:
    preferred_term: Periventricular leukomalacia
    term:
      id: HP:0006970
      label: Periventricular leukomalacia
  evidence:
  - reference: PMID:38684534
    reference_title: "Neurodevelopmental outcomes of preterm with necrotizing enterocolitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "periventricular leucomalacia (PVL) (OR 2.55, 95% CI 1.76-3.69)"
    explanation: >-
      Gives the pooled effect estimate quoted in this phenotype's description.

- category: Neurologic
  name: Neurodevelopmental delay
  description: >-
    Motor, cognitive and language developmental delay is the dominant long-term
    morbidity of NEC survivors, with an adjusted odds ratio of about 1.9 against
    preterm infants without NEC, and a further excess in infants who required
    surgery.
  phenotype_term:
    preferred_term: Neurodevelopmental impairment
    term:
      id: HP:0012758
      label: Neurodevelopmental delay
    temporality: CHRONIC
  frequency: COMMON
  evidence:
  - reference: PMID:38684534
    reference_title: "Neurodevelopmental outcomes of preterm with necrotizing enterocolitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Meta-analysis of unadjusted and adjusted ORs demonstrated a significant
      association between NEC and increased odds of NDI (OR 2.15, 95% CI
      1.9-2.44; aOR 1.89, 95% CI 1.46-2.46).
    explanation: >-
      Gives both the unadjusted and adjusted pooled effect estimates quoted in
      this phenotype's description, across 60,346 infants.
  - reference: PMID:38684534
    reference_title: "Neurodevelopmental outcomes of preterm with necrotizing enterocolitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      When compared with conservatively treated NEC, surgical NEC potentially
      carries a higher risk of NDI (OR 1.78, 95% CI 1.09-2.93)
    explanation: >-
      Supports the surgical-versus-medical gradient recorded in this
      phenotype's description, which is the severity dose-response argument
      for the association being more than shared prematurity.
histopathology:
- name: Coagulative necrosis of the bowel wall
  description: >-
    Coagulative necrosis is the characteristic histology of resected NEC bowel,
    and its ischemic character is the main histological argument that
    hypoperfusion sits in the causal chain rather than merely following
    inflammation.
  finding_term:
    preferred_term: coagulative necrosis
    term:
      id: NCIT:C39608
      label: Coagulative Necrosis
  diagnostic: true
  evidence:
  - reference: PMID:18346531
    reference_title: "The neonatal intestinal vasculature: contributing factors to necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the demonstration of coagulation necrosis, it is clear that intestinal ischemia plays a role in the pathogenesis of necrotizing enterocolitis (NEC)."
    explanation: >-
      Attests coagulation necrosis as a demonstrated finding in NEC and draws
      the ischemic inference this finding's description records.
prevalence:
- population: >-
    US infants 23-29 weeks' gestation and birth weight under 1,500 g,
    Pediatrix Medical Group 2015-2019
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3400.0
  notes: >-
    1,150 of 34,032 infants (3.4%) diagnosed with medical NEC in a contemporary
    US multicentre cohort of very preterm, very low birth weight infants. Not a
    general-population rate: the denominator is the at-risk preterm population,
    which is the only denominator in which NEC occurrence is meaningful.
  evidence:
  - reference: PMID:35554890
    reference_title: "Necrotizing Enterocolitis in Very Low Birth Weight Neonates: A Natural History Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Among 34,032 patients in the contemporary cohort, 1,150 (3.4%) were diagnosed with medical NEC and 543 (1.6%) were diagnosed with surgical NEC."
    explanation: >-
      Gives the numerator, denominator and percentage for medical NEC in the
      cohort named in this record's population.
- population: >-
    US infants 23-29 weeks' gestation and birth weight under 1,500 g,
    Pediatrix Medical Group 2015-2019, surgical NEC
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1600.0
  notes: >-
    543 of 34,032 infants (1.6%) diagnosed with surgical NEC in the same cohort.
    Recorded separately from medical NEC because the two tiers differ in onset
    pattern, risk factors and mortality rather than only in severity.
  evidence:
  - reference: PMID:35554890
    reference_title: "Necrotizing Enterocolitis in Very Low Birth Weight Neonates: A Natural History Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "543 (1.6%) were diagnosed with surgical NEC"
    explanation: >-
      Gives the surgical NEC numerator and percentage in the cohort named in
      this record's population.
environmental:
- name: Preterm formula feeding in the absence of human milk
  description: >-
    Feeding preterm infants formula rather than human milk raises NEC risk
    roughly twofold in randomized comparisons. Whether this reflects an
    injurious constituent of formula or the absence of protective constituents
    of human milk is not settled; the pooled effect is the same either way.
  causal_role: RISK_FACTOR
  exposure_term:
    preferred_term: preterm formula feeding
  notes: >-
    Left unbound. ECTO has no infant-formula or human-milk feeding exposure
    class. Searches run against the local ECTO build: `runoak -i
    sqlite:obo:ecto search "l~formula"` returns no ECTO term at all;
    `l~human milk` returns only FOODON classes (`FOODON:00001958`,
    `FOODON:03303918`); `l~breast` and `l~infant` each return nothing in ECTO;
    `l~milk` returns thirteen ECTO ingestion classes of which the closest,
    `ECTO:0070204 exposure to cow milk (liquid) via ingestion`, names a
    beverage rather than a preterm formula and is not bound because it would
    assert a different exposure.
  influences_mechanisms:
  - target: Abnormal Microbial Colonization of the Preterm Gut
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Formula lacks the human milk oligosaccharides that shape Bifidobacterium
      colonization; low delivery of one such oligosaccharide, DSLNT, tracks with
      a reduced transition into Bifidobacterium-dominated preterm gut
      communities and with NEC. The intermediate steps between oligosaccharide
      supply and community structure are not established, so the link is
      indirect.
    evidence:
    - reference: PMID:33328245
      reference_title: "Human milk oligosaccharide DSLNT and gut microbiome in preterm infants predicts necrotising enterocolitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Longitudinal development of the microbiome was also impacted by low MOM
        DSLNT associated with reduced transition into preterm gut community
        types dominated by Bifidobacterium spp
      explanation: >-
        Links low delivery of a human milk oligosaccharide to the failure of the
        Bifidobacterium-dominated community transition, which is the
        colonization mechanism this link asserts.
  evidence:
  - reference: PMID:32384652
    reference_title: "The Impact of Human Milk on Necrotizing Enterocolitis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "RCTs meta-analysis indicates a risk reduction of NEC using human milk respect to formula: Relative risk (RR) = 0.62 (0.42-0.93)."
    explanation: >-
      Pooled randomized evidence quantifying the human-milk-versus-formula
      contrast that defines this exposure, in the protective direction.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Whether the development of NEC in association with formula feeding
      represents the presence of an injurious component in infant formula, or
      the deficiency of a protective agent only present in breast milk remains
      to be determined
    explanation: >-
      Supports the unresolved-mechanism caveat recorded in this exposure's
      description, in the review's own words.

- name: Early broad-spectrum antibiotic exposure
  description: >-
    Antibiotic exposure in the first days and weeks of life reshapes the
    colonizing community of the preterm gut and is reported as a risk factor for
    subsequent NEC. It is also the treatment given for suspected sepsis, so the
    exposure is near-universal in the at-risk population and hard to separate
    from the illness that prompts it.
  causal_role: RISK_FACTOR
  exposure_term:
    preferred_term: exposure to antibacterial drug
    term:
      id: ECTO:9001757
      label: exposure to antibacterial drug
  influences_mechanisms:
  - target: Abnormal Microbial Colonization of the Preterm Gut
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Broad-spectrum antibiotics deplete the colonizing community, and the
      resulting delay and distortion of colonization is the proposed route to
      the abnormal community structure that precedes NEC.
    evidence:
    - reference: PMID:27534694
      reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        A late onset of NEC in the most premature infants might be related to
        delayed microbial colonization of the gut and establishment of virulent
        microbial agents, in part owing to the use of broad-spectrum antibiotics
        and prolonged hospital stay
      explanation: >-
        Attributes delayed and distorted colonization in part to
        broad-spectrum antibiotic use, which is the mechanism this link
        asserts. Hedged in the source ("might be related to"), hence INDIRECT.
  evidence:
  - reference: PMID:38564081
    reference_title: "Neonatal Necrotizing Enterocolitis: An Update on Pathophysiology, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This review also highlights the effect of early antibiotic exposure,
      infections, proton pump inhibitors (PPIs), and H2 receptor antagonists on
      the microbiota and how these risk factors can increase the chances of NEC.
    explanation: >-
      Names early antibiotic exposure as a risk factor acting on the microbiota
      to increase NEC risk.
treatments:
- name: Human Milk Feeding
  description: >-
    Feeding human milk rather than preterm formula is the best-established
    preventive intervention. Mother's own milk is preferred; where it is
    unavailable, pasteurised donor human milk roughly halves NEC risk against
    formula in trials at low risk of bias.
  treatment_term:
    preferred_term: human milk feeding
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  role: preventive
  target_mechanisms:
  - target: Epithelial TLR4 Hyperactivation by Luminal Lipopolysaccharide
    description: >-
      Human milk inhibits epithelial TLR4 signalling through EGF-dependent
      activation of the epidermal growth factor receptor, which is the
      mechanistic account of its protective effect in murine NEC.
    evidence:
    - reference: PMID:25899687
      reference_title: "Breast milk protects against the development of necrotizing enterocolitis through inhibition of Toll-like receptor 4 in the intestinal epithelium via activation of the epidermal growth factor receptor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Breast milk protected against NEC and reduced TLR4 signaling in
        wild-type neonatal mice, but not in mice lacking the epidermal growth
        factor receptor (EGFR), whereas selective removal of EGF from breast
        milk reduced its protective properties, indicating that breast milk
        inhibits NEC and attenuates TLR4 signaling via EGF/EGFR activation.
      explanation: >-
        Receptor-knockout and ligand-depletion arms together establish that the
        protection acts on TLR4 signalling through EGFR, which is the target
        this link names.
  evidence:
  - reference: PMID:39239939
    reference_title: "Donor human milk for preventing necrotising enterocolitis in very preterm or very low-birthweight infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "donor human milk reduces the risk of NEC (RR 0.39, 95% CI 0.22 to 0.70"
    explanation: >-
      Cochrane meta-analysis restricted to trials at low risk of bias across all
      domains gives the donor-milk effect estimate quoted in this treatment's
      description.
  - reference: PMID:32384652
    reference_title: "The Impact of Human Milk on Necrotizing Enterocolitis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "RCTs meta-analysis indicates a risk reduction of NEC using human milk respect to formula: Relative risk (RR) = 0.62 (0.42-0.93)."
    explanation: >-
      Independent pooled randomized estimate of the human-milk protective
      effect.

- name: Probiotic Supplementation
  description: >-
    Supplemental probiotics, most often Bifidobacterium and Lactobacillus
    preparations, reduce NEC risk in very preterm and very low birth weight
    infants, although the certainty of the evidence is low and the benefit is
    not demonstrated in the extremely preterm subgroup where the risk is
    highest.
  treatment_term:
    preferred_term: probiotic supplementation
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  role: preventive
  target_mechanisms:
  - target: Abnormal Microbial Colonization of the Preterm Gut
    description: >-
      Probiotics are given in order to modify the colonizing community, which is
      the node they are intended to act on.
    evidence:
    - reference: PMID:37493095
      reference_title: "Probiotics to prevent necrotising enterocolitis in very preterm or very low birth weight infants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Dietary supplementation with probiotics to modulate the intestinal
        microbiome has been proposed as a strategy to reduce the risk of NEC
      explanation: >-
        States the intended target of the intervention. INDIRECT because the
        Cochrane review measures the clinical outcome rather than the
        community-structure change the link asserts.
  evidence:
  - reference: PMID:37493095
    reference_title: "Probiotics to prevent necrotising enterocolitis in very preterm or very low birth weight infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Probiotics may reduce the risk of NEC (RR 0.54, 95% CI 0.46 to 0.65"
    explanation: >-
      Cochrane pooled estimate over 57 trials and 10,918 infants, graded low
      certainty by the review's own GRADE assessment.
  - reference: PMID:37493095
    reference_title: "Probiotics to prevent necrotising enterocolitis in very preterm or very low birth weight infants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In this population, probiotics may have little or no effect on NEC (RR
      0.92, 95% CI 0.69 to 1.22
    explanation: >-
      In extremely preterm and extremely low birth weight infants the same
      review finds no effect, which contradicts a general claim of benefit in
      the highest-risk subgroup and is the caveat recorded in this treatment's
      description.

- name: Standardized Feeding Regimen
  description: >-
    Unit-level standardized feeding guidelines, with preset thresholds for
    managing feeding intolerance, have reduced NEC incidence and severity where
    implemented. What standardization does not require is slow feed advancement:
    pooled randomized evidence shows that advancing enteral volumes slowly
    (daily increments up to 24 mL/kg) rather than faster does not reduce NEC, and
    may slightly increase invasive infection. The benefit appears to lie in
    consistency of practice rather than in caution about volume.
  treatment_term:
    preferred_term: standardized enteral feeding regimen
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  role: preventive
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the use of standardized feeding guidelines (for example, patient-specific
      orders with set thresholds to manage feeding intolerance)126 have been
      implemented in multiple centres and have been proven to be effective to
      reduce the incidence and severity of the disease
    explanation: >-
      Supports standardized feeding guidelines as an effective preventive
      measure, and describes the form they take.
  - reference: PMID:34427330
    reference_title: "Slow advancement of enteral feed volumes to prevent necrotising enterocolitis in very low birth weight infants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Meta-analyses showed that slow advancement of enteral feed volumes probably
      has little or no effect on the risk of NEC (RR 1.06, 95% confidence
      interval (CI) 0.83 to 1.37
    explanation: >-
      Refutes the specific proposition that cautious volume advancement prevents
      NEC, over 14 trials and 4,026 infants at moderate certainty. Recorded as
      REFUTE rather than omitted because slow advancement is a widely used
      practice that this evidence does not support.
  - reference: PMID:34427330
    reference_title: "Slow advancement of enteral feed volumes to prevent necrotising enterocolitis in very low birth weight infants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Advancing the volume of enteral feeds at a slow rate may slightly increase
      the risk of invasive infection.
    explanation: >-
      The review's own conclusion that slow advancement may carry net harm,
      supporting the caveat recorded in this treatment's description.
  notes: >-
    Two claims are kept deliberately separate here because the literature
    separates them: standardized feeding practice reduces NEC, while slow volume
    advancement specifically does not. Conflating them would read the positive
    quality-improvement result as evidence for a practice that randomized trials
    do not support.

- name: Bowel Rest, Gastric Decompression and Broad-Spectrum Antibiotics
  description: >-
    Standard medical management of Bell stage II disease: enteral feeds are
    stopped, the stomach is decompressed by nasogastric tube, intravenous fluids
    are given, and broad-spectrum antibiotic cover is started. Combination
    antimicrobial therapy has been the standard since the original staging
    series, which cultured enteric organisms including anaerobes from these
    infants.
  treatment_term:
    preferred_term: broad-spectrum antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  role: standard of care
  notes: >-
    The three agents bound here are named as the common empiric combination in
    the treatment literature surveyed for this entry rather than quoted from a
    trial comparing regimens; no head-to-head antibiotic regimen trial in NEC
    was read for this entry, and antibiotic choice in NEC remains a stewardship
    question rather than a settled one.
  target_mechanisms:
  - target: Systemic Inflammatory Response and Sepsis
    description: >-
      Antimicrobial cover addresses the bacteraemia from translocated enteric
      organisms.
    evidence:
    - reference: PMID:413500
      reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Bacteriologic evaluation of the gastrointestinal microflora in these
        neonates has revealed a wide range of enteric organisms including
        anaerobes.
      explanation: >-
        The organisms recovered are the rationale for combination cover
        including anaerobic activity. INDIRECT because the inference runs from
        the organisms present to the choice of regimen.
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Medical management, such as nasograstric decompression, intravenous fluids
      and broad-spectrum antibiotics Close clinical, laboratory and radiographic
      observation
    explanation: >-
      The Bell stage II treatment column states exactly the components of
      medical management this treatment records. The source's spelling of
      "nasograstric" is kept because a snippet is not corrected.
  - reference: PMID:413500
    reference_title: "Neonatal necrotizing enterocolitis. Therapeutic decisions based upon clinical staging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These studies support the use of combination antimicrobial therapy in the treatment of infants with NEC."
    explanation: >-
      The originating series' own conclusion supporting combination
      antimicrobial therapy.

- name: Parenteral Nutrition
  description: >-
    Because enteral feeds are withheld for the duration of the acute illness and
    absorptive capacity may be permanently reduced, parenteral nutrition is
    required through the acute phase and, in infants left with short bowel
    syndrome, for far longer. Prolonged dependence carries its own cost in
    cholestasis.
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  role: supportive
  evidence:
  - reference: PMID:30864508
    reference_title: "Necrotizing Enterocolitis: Long Term Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      cholestasis, short bowel syndrome with or without intestinal failure that
      can be difficult to manage
    explanation: >-
      Names the intestinal failure that makes parenteral nutrition necessary and
      the cholestasis that accompanies prolonged dependence.

- name: Laparotomy with Resection of Necrotic Bowel
  description: >-
    Operative management of Bell stage III disease. The goals are to control
    enteric spillage and resect necrotic intestine while preserving as much
    viable length as possible, since residual length determines the risk of
    short bowel syndrome. Radiographic pneumoperitoneum is the only absolute
    indication.
  treatment_term:
    preferred_term: laparotomy with resection of necrotic bowel
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  role: standard of care
  target_mechanisms:
  - target: Transmural Necrosis and Intestinal Perforation
    description: >-
      Resection removes the necrotic segment and closes the source of enteric
      spillage, which is the lesion this node names.
    evidence:
    - reference: PMID:27836422
      reference_title: "Surgical necrotizing enterocolitis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The primary goals of surgical intervention in NEC are to control enteric spillage and/or resect necrotic intestine while maximizing the length of viable intestine."
      explanation: >-
        States the operative goals against exactly the lesion this target node
        represents.
  evidence:
  - reference: PMID:27836422
    reference_title: "Surgical necrotizing enterocolitis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence of pneumoperitoneum on plain radiography is the only absolute criteria for operative intervention."
    explanation: >-
      States the single absolute operative indication recorded in this
      treatment's description.
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Exploratory laparotomy and resection of necrotic bowel Peritoneal drainage
      in selected cases
    explanation: >-
      The Bell stage III treatment column names laparotomy with resection as the
      management of advanced disease, with peritoneal drainage as the selected
      alternative curated separately below.

- name: Primary Peritoneal Drainage
  description: >-
    Bedside peritoneal drain placement as the initial surgical intervention, used
    particularly in the smallest and least stable infants. Pooled evidence shows
    no mortality difference against primary laparotomy, so either can be chosen
    in selected patients; a substantial fraction of drained infants subsequently
    require laparotomy.
  treatment_term:
    preferred_term: primary peritoneal drainage
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  role: alternative
  evidence:
  - reference: PMID:35451633
    reference_title: "Initial surgical treatment of necrotizing enterocolitis: a meta-analysis of peritoneal drainage versus laparotomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "There was no significant difference in mortality between peritoneal drainage and laparotomy as initial surgical intervention."
    explanation: >-
      The meta-analysis conclusion recorded in this treatment's description.
  - reference: PMID:35451633
    reference_title: "Initial surgical treatment of necrotizing enterocolitis: a meta-analysis of peritoneal drainage versus laparotomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The results suggest that either intervention could be used in selected
      patients.
    explanation: >-
      Supports the equipoise this treatment's description records.
  notes: >-
    The meta-analysis pooled NEC with spontaneous intestinal perforation, which
    the authors list among their own stated limitations. That is a limitation of
    the evidence for this treatment, not a claim that the two entities are the
    same.

- name: Enterostomy
  description: >-
    Diverting stoma formation at laparotomy, used when primary anastomosis is
    unsafe. Stoma complications are common in this population, including
    prolapse, stricture and retraction, and proximal jejunostomies cause
    substantial fluid and electrolyte losses.
  treatment_term:
    preferred_term: Enterostomy
    term:
      id: NCIT:C52005
      label: Enterostomy
  therapeutic_modality: SURGERY
  role: standard of care
  evidence:
  - reference: PMID:27534694
    reference_title: "Necrotizing enterocolitis: new insights into pathogenesis and mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most common include: prolapse, stricture and retraction Proximal
      jejunostomies can cause substantial electrolyte and fluid losses, impaired
      weight gain and peristomal skin complications
    explanation: >-
      The complications table row enumerates exactly the stoma complications
      this treatment's description records.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    NEC is the leading cause of death from gastrointestinal disease in preterm
    infants, with mortality of 30-50% in advanced disease and 43% at thirty days
    among infants requiring surgery. Survivors carry intestinal stricture, short
    bowel syndrome and neurodevelopmental impairment at rates well above those of
    preterm infants without NEC.
  evidence:
  - reference: PMID:40953322
    reference_title: "Exploring the Complex Pathophysiology of Necrotizing Enterocolitis in Preterm Neonates."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Necrotizing enterocolitis (NEC) is the most common gastrointestinal emergency in preterm neonates, with a mortality rate of 30-50% in advanced cases."
    explanation: >-
      Gives both the epidemiological standing and the advanced-disease mortality

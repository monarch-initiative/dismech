notes: >-
  The entry keeps the MONDO label as its name. No PRKDC-related dyadic name
  is established (none in MONDO or OMIM), and the name is already specific to
  one gene product. No GeneReviews or StatPearls chapter exists for this
  disease (checked against the Bookshelf index and a live PubMed search). Its "severe combined" wording is narrower than the
  disease as now understood, since most reported patients have a leaky
  combined immunodeficiency; the OMIM title (immunodeficiency 26 with or
  without neurologic abnormalities) is kept as a synonym. The general Severe
  Combined Immunodeficiency entry lists PRKDC as a gene acting at its V(D)J
  recombination and DNA repair node; this entry is the leaf disease. No node
  conforms to a DNA repair or V(D)J recombination module because kb/modules/
  has none; the granuloma node conforms to granuloma_formation.

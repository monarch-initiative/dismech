      snippet: "Radiosensitive T-B- severe combined immunodeficiency (RS-SCID) is caused by defects in the nonhomologous end-joining (NHEJ) DNA repair pathway, which results in failure of functional V(D)J recombination."
      explanation: States the causal link from the NHEJ defect to failed V(D)J recombination.
  - target: Impaired Immunoglobulin Class Switch Recombination
    causal_link_type: DIRECT
    description: >-
      Class switch recombination joins switch-region breaks by classical NHEJ;

- name: Defective DNA-PKcs-Dependent Artemis Activation
  biological_scale: MOLECULAR
  description: >-
    In V(D)J recombination the RAG complex leaves covalently sealed hairpins
    at the coding ends. Artemis acquires the endonuclease activity that opens
    them only after forming a complex with DNA-PKcs and being phosphorylated by
    it. With the founder allele the hairpins are opened poorly, leaving long
    palindromic P-nucleotide stretches in the coding joints that do form.
  genes:
  - preferred_term: PRKDC
    term:
      id: hgnc:9413
      label: PRKDC
  - preferred_term: DCLRE1C (Artemis)
    term:
      id: hgnc:17642
      label: DCLRE1C
  biological_processes:
  - preferred_term: positive regulation of Artemis endonuclease activity
    modifier: DECREASED
    term:
      id: GO:0032079
      label: positive regulation of endodeoxyribonuclease activity
  evidence:
  - reference: PMID:11955432
    reference_title: "Hairpin opening and overhang processing by an Artemis/DNA-dependent protein kinase complex in nonhomologous end joining and V(D)J recombination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon complex formation, DNA-PKcs phosphorylates Artemis, and Artemis acquires endonucleolytic activity on 5' and 3' overhangs, as well as hairpins."
    explanation: Biochemical basis for DNA-PKcs as the activator of Artemis endonuclease activity.
  - reference: PMID:11955432
    reference_title: "Hairpin opening and overhang processing by an Artemis/DNA-dependent protein kinase complex in nonhomologous end joining and V(D)J recombination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, the Artemis:DNA-PKcs complex can open hairpins generated by the RAG complex."
    explanation: The activated complex performs the hairpin-opening step of V(D)J recombination.
  - reference: PMID:34936881
    reference_title: "Autophosphorylation transforms DNA-PK from protecting to processing DNA ends."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphorylation of four Thr residues in ABCDE leads to gross structural rearrangement of DNA-PK, widening the DNA binding groove for Artemis recruitment and hairpin cleavage."
    explanation: Structural basis for how DNA-PKcs autophosphorylation admits Artemis to cleave hairpins.
  - reference: PMID:35801871
    reference_title: "Structural analysis of the basal state of the Artemis:DNA-PKcs complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All of the findings are useful in explaining how a hypomorphic L3062R missense mutation of DNA-PKcs could lead to insufficient Artemis activation, hence RS-SCID."
    explanation: >-
      Cryo-EM structures of the Artemis:DNA-PKcs complex give a structural
      account of how the founder allele impairs Artemis activation.
  - reference: PMID:19075392
    reference_title: "A DNA-PKcs mutation in a radiosensitive T-B- SCID patient inhibits Artemis activation and nonhomologous end-joining."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of long P-nucleotide stretches in the immunoglobulin coding joints indicated that it caused insufficient Artemis activation, something that is dependent on Artemis interaction with autophosphorylated DNA-PKcs"
    explanation: The patient-derived evidence that this step fails with the founder allele.
  downstream:
  - target: Defective V(D)J Recombination
    causal_link_type: DIRECT
    description: >-
      Unopened coding-end hairpins cannot be joined, so antigen receptor gene
      segments fail to assemble.
    evidence:
    - reference: PMID:11955432
      reference_title: "Hairpin opening and overhang processing by an Artemis/DNA-dependent protein kinase complex in nonhomologous end joining and V(D)J recombination."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, DNA-PKcs regulates Artemis by both phosphorylation and complex formation to permit enzymatic activities that are critical for the hairpin-opening step of V(D)J recombination"
      explanation: Hairpin opening by the activated complex is a required step of V(D)J recombination.
- name: Impaired Nonhomologous End-Joining of DNA Double-Strand Breaks
  biological_scale: CELLULAR
  description: >-
    Reduced DNA-PKcs function slows the repair of double-strand breaks by
    classical NHEJ in all nucleated cells. Patient fibroblasts survive the
    radiomimetic phleomycin poorly and keep 53BP1 repair foci 24 hours after
    irradiation. The same defect underlies the lymphoid recombination failure,
    the cellular radiosensitivity, and plausibly the growth and brain
    developmental defects of the most severely affected patient.
  genes:
  - preferred_term: PRKDC

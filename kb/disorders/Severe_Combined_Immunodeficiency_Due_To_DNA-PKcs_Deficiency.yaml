- name: Impaired Neurogenesis From Insufficient DNA-PKcs
  biological_scale: TISSUE
  description: >-
    The patient with the lowest residual DNA-PKcs activity had microcephaly
    with cortical and hippocampal dysplasia, seizures, profound global
    neurological impairment and progressive brain atrophy over two years.
    This was more severe than in other NHEJ deficiencies and is not seen in
    DNA-PKcs-deficient mice, dogs or horses, which suggests a requirement for
    high DNA-PK levels during human brain development. Patients homozygous
    for the founder allele had no obvious neurological involvement, so the
    feature depends on genotype.

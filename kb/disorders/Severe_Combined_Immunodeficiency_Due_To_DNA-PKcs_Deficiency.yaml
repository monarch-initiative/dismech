    classified_by: CLINGEN
    external_id: CGGV:assertion_fff25ca1-bbe5-47d3-b672-4b675a9fa6f7-2022-02-01T151658.605Z
    evidence:
    - reference: CGGV:assertion_fff25ca1-bbe5-47d3-b672-4b675a9fa6f7-2022-02-01T151658.605Z
      reference_title: "PRKDC / severe combined immunodeficiency due to DNA-PKcs deficiency (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PRKDC | HGNC:9413 | severe combined immunodeficiency due to DNA-PKcs deficiency | MONDO:0014423 | AR | Definitive"
      explanation: ClinGen SCID-CID GCEP classifies PRKDC as definitively associated with this disease (AR).
  notes: >-
    PRKDC (8q11) encodes DNA-PKcs. Reported disease alleles are missense and
    splice variants with reduced function; ClinGen notes that no nonsense or
    frameshift variant has been described in a patient. The recurrent
    p.Leu3062Arg allele is a Turkish founder allele and travels with the
    common p.Gly2113del variant, which is considered nonpathogenic.
  evidence:
  - reference: PMID:19075392
    reference_title: "A DNA-PKcs mutation in a radiosensitive T-B- SCID patient inhibits Artemis activation and nonhomologous end-joining."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have identified the first human RS-SCID patient to our knowledge with a DNA-PKcs missense mutation (L3062R)."
    explanation: First human PRKDC disease allele.
  - reference: PMID:23722905
    reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with compound heterozygous mutations in PRKDC, low DNA-PKcs expression, barely detectable DNA-PK kinase activity, and impaired DSB repair."
    explanation: Independent compound heterozygous patient.
  - reference: CGGV:assertion_fff25ca1-bbe5-47d3-b672-4b675a9fa6f7-2022-02-01T151658.605Z
    reference_title: "PRKDC / severe combined immunodeficiency due to DNA-PKcs deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonsense or frameshift variants have not yet been described in humans."
    explanation: Supports the note that only hypomorphic allele classes are known.
  variants:
  - name: c.9185T>G p.(Leu3062Arg)
    description: >-
      Recurrent homozygous missense founder allele in patients of Turkish
      ancestry. It preserves DNA-PKcs kinase activity and DNA end binding but
      impairs Artemis activation and overall end joining. It has been found
      both in classical radiosensitive SCID and in later-onset combined
      immunodeficiency with granulomas and autoimmunity.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25842288
      reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sanger sequencing identified a c.9185T>G (p.Leu3062Arg) homozygous missense variant and a homozygous c.6340delGAG (pGly2113del) deletion in PRKDC in this patient"
      explanation: Cites the founder allele at cDNA and protein level.
    - reference: PMID:25842288
      reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All 3 patients shared a common Turkish ancestry, suggesting a founder effect for these variants."
      explanation: Shared Turkish ancestry suggests a founder allele.
animal_models:
- name: Prkdc scid mouse
  species: Mouse
  genotype: Prkdc scid/scid
  genes:
  - preferred_term: Prkdc
    term:
      id: MGI:104779
      label: Prkdc
  publication: PMID:7889575
  description: >-
    The C.B-17 scid mouse carries a spontaneous Prkdc mutation that removes
    DNA-PK activity. It lacks T and B cells, its cells are hypersensitive to
    ionizing radiation, and its V(D)J recombination block is leaky. It is also
    the basis of the AIRE studies in thymic epithelium. It does not show the
    neurodevelopmental defect seen in the most severe human case.
  modeled_mechanisms:
  - target: Impaired Nonhomologous End-Joining of DNA Double-Strand Breaks
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Scid cells lack DNA-PK activity and share the repair and recombination defects of patient cells.
    evidence:
    - reference: PMID:7889575
      reference_title: "Defective DNA-dependent protein kinase activity is linked to V(D)J recombination and DNA repair defects associated with the murine scid mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we show that both cell types lack DNA-dependent protein kinase (DNA-PK) activity owing to defects in DNA-PKcs, the catalytic subunit of this enzyme."
      explanation: Scid mouse cells lack DNA-PK activity from a DNA-PKcs defect.
  - target: Arrested T- and B-Lymphocyte Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Scid mice lack B and T cell immunity.
    limitations: >-
      The mouse V(D)J block is leaky, unlike the more complete block in the
      horse, and the mouse null allele differs from the kinase-preserving
      human founder allele.
    evidence:
    - reference: PMID:7855601
      reference_title: "DNA-dependent kinase (p350) as a candidate gene for the murine SCID defect."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "The phenotype of these mice involves both cellular hypersensitivity to ionizing radiation and a lack of B and T cell immunity."
      explanation: The scid mouse phenotype matches the human lymphoid and radiosensitivity defects.
  - target: Impaired Neurogenesis From Insufficient DNA-PKcs
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: DNA-PKcs-deficient mice do not show the human neurodevelopmental defect.
    limitations: >-
      Proposed explanations include the much higher abundance of DNA-PK in
      human cells, which this model cannot test.
    evidence:
    - reference: PMID:23722905
      reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although loss of DNA-PKcs in mice, dogs, and horses was previously shown not to impair neuronal development, our findings demonstrate a stringent requirement for DNA-PKcs during human neuronal development"
      explanation: States that the animal models lack the human neurological phenotype.

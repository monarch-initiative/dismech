disease_term:
  preferred_term: severe combined immunodeficiency due to DNA-PKcs deficiency
  term:
    id: MONDO:0014423
    label: severe combined immunodeficiency due to DNA-PKcs deficiency
parents:
- T-B- severe combined immunodeficiency
- Combined immunodeficiency
description: >-
  An autosomal recessive inborn error of immunity caused by biallelic
  hypomorphic variants in PRKDC, which encodes the catalytic subunit of the
  DNA-dependent protein kinase (DNA-PKcs). DNA-PKcs is a core component of
  classical nonhomologous end-joining (NHEJ): bound to Ku at a DNA end, it
  phosphorylates and activates the Artemis nuclease that opens the coding-end
  hairpins created by RAG cleavage during V(D)J recombination, and it is
  needed for end joining more generally. Its loss therefore blocks antigen
  receptor gene assembly in developing T and B cells and leaves every
  nucleated cell sensitive to ionizing radiation and other double-strand
  break inducing agents.

  The clinical spectrum is wide for a disease with so few patients. The first
  patients had classical radiosensitive T-B-NK+ severe combined
  immunodeficiency in infancy, and one with compound heterozygous variants and
  barely detectable kinase activity also had severe growth failure,
  microcephaly, seizures and cortical and hippocampal dysplasia, a degree of
  neurological involvement not seen in the animal models. Most patients now
  known, nearly all homozygous for the Turkish founder allele p.Leu3062Arg,
  instead present later in childhood with an atypical (leaky) combined
  immunodeficiency dominated by immune dysregulation: noninfectious skin and
  splenic granulomas, bronchiectasis, arthritis, autoantibodies, an
  interferon signature and a falling naive T-cell count. DNA-PKcs is also a
  partner of AIRE in medullary thymic epithelial cells, and patient alleles
  fail to support AIRE-dependent peripheral tissue antigen expression, which
  is the proposed basis for the anti-calcium-sensing receptor autoantibodies
  and for organ-specific autoimmunity that appeared after transplantation.

  Allogeneic hematopoietic stem cell transplantation is the only curative
  treatment. Because the repair defect is constitutional, conditioning that
  relies on alkylating agents or irradiation is a particular hazard, and
  transplantation does not replace the thymic epithelium that carries the
  AIRE-related defect.

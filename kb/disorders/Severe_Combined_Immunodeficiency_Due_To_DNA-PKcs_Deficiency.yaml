    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "53BP1 foci remained increased at 24 hours compared with the control"
    explanation: Persistent repair foci in irradiated patient fibroblasts show slow double-strand break repair.
  - reference: PMID:23722905
    reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with compound heterozygous mutations in PRKDC, low DNA-PKcs expression, barely detectable DNA-PK kinase activity, and impaired DSB repair."
    explanation: Impaired double-strand break repair in a second, unrelated genotype.
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified PRKDC mutations in both patients. These patients exhibited a defect in DNA double-strand break repair and V(D)J recombination."
    explanation: The repair defect is also present in the later-onset inflammatory presentation.
  downstream:
  - target: Defective V(D)J Recombination
    causal_link_type: DIRECT
    description: >-
      V(D)J recombination intermediates are resolved by NHEJ, so the repair

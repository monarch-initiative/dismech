  description: >-
    SCID in a litter of Jack Russell terriers due to markedly reduced
    DNA-PKcs expression. The V(D)J recombination block is intermediate between
    the scid mouse and the Arabian foal.
  modeled_mechanisms:
  - target: Defective V(D)J Recombination
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Canine DNA-PKcs deficiency blocks coding and signal end joining.
    limitations: >-
      Species differ in how strictly V(D)J recombination depends on DNA-PKcs,
      so the severity of the block does not transfer directly to humans.

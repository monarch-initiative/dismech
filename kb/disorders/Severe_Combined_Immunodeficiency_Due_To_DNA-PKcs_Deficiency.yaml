diagnosis:
- name: PRKDC molecular genetic testing
  description: >-
    Sequencing of PRKDC in a patient with T-B-NK+ SCID, or with leaky
    combined immunodeficiency and granulomas or autoimmunity, after RAG1 and
    RAG2 defects are excluded. Normal DNA-PKcs kinase activity does not
    exclude the diagnosis, because the founder allele preserves it.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:19075392
    reference_title: "A DNA-PKcs mutation in a radiosensitive T-B- SCID patient inhibits Artemis activation and nonhomologous end-joining."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study demonstrates that the presence of DNA-PKcs kinase activity is not sufficient to rule out a defect in this gene during diagnosis and treatment of RS-SCID patients."
    explanation: A functional kinase assay can miss the founder allele, so genetic testing is needed.
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in RAG1 and RAG2 were excluded by means of Sanger sequencing."
    explanation: RAG genes are tested and excluded in the work-up.
- name: Lymphocyte subset immunophenotyping
  description: >-
    Flow cytometry shows low or absent T and B cells with normal NK cells, and
    in leaky disease a marked loss of naive CD45RA+ T cells with expansion of
    memory cells.
  diagnosis_term:
    preferred_term: immunological flow cytometry
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, memory phenotype CD4+CD45RO+ T cells represented more than 90% of circulating CD4 T cells, and CD4+CD45RA+ T cells were decreased to less than 5%."
    explanation: The characteristic flow cytometry pattern of leaky disease.
- name: Cellular radiosensitivity testing
  description: >-
    Survival of patient fibroblasts after ionizing radiation or a radiomimetic
    drug, or persistence of DNA damage foci, identifies an NHEJ defect and
    informs the choice of transplant conditioning.
  evidence:
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Primary fibroblasts of both patients displayed a dose-dependent defect in survival compared with control fibroblasts."
    explanation: Fibroblast survival assay detects the repair defect.
differential_diagnoses:
- name: Artemis deficiency
  description: >-
    Radiosensitive T-B-NK+ SCID from DCLRE1C variants; DNA-PKcs and Artemis
    act at the same hairpin-opening step, and the clinical pictures overlap.
  distinguishing_features:
  - Distinguished only by genetic testing.
  disease_term:
    preferred_term: severe combined immunodeficiency due to DCLRE1C deficiency
    term:
      id: MONDO:0011225
      label: severe combined immunodeficiency due to DCLRE1C deficiency
  evidence:
  - reference: PMID:19823081
    reference_title: "DNA-PKcs deficiency in human: long predicted, finally found."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DNA-PKcs deficient patient presented as a classical SCID patient, not different from a recombination activating gene or Artemis deficiency."
    explanation: The clinical presentation does not separate DNA-PKcs from Artemis deficiency.
- name: RAG1 or RAG2 deficiency
  description: >-
    T-B-NK+ SCID and leaky SCID with granulomas from RAG variants, without
    cellular radiosensitivity.
  distinguishing_features:
  - RAG-deficient cells are not radiosensitive.
  - Genetic testing.
  disease_term:
    preferred_term: T-B-NK+ severe combined immunodeficiency, autosomal recessive
    term:
      id: MONDO:0011086
      label: severe combined immunodeficiency, autosomal recessive, T cell-negative, B cell-negative, NK cell-positive
  evidence:
  - reference: PMID:19823081
    reference_title: "DNA-PKcs deficiency in human: long predicted, finally found."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DNA-PKcs deficient patient presented as a classical SCID patient, not different from a recombination activating gene or Artemis deficiency."
    explanation: RAG deficiency is clinically indistinguishable.
  - reference: PMID:26055221
    reference_title: "Radiation-sensitive severe combined immunodeficiency: The arguments for and against conditioning before hematopoietic cell transplantation--what to do?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "while defects in RAG1/2 result in T−B−NK+ SCID without increased susceptibility to alkylating agents and ionizing radiation"
    explanation: Radiosensitivity separates NHEJ defects from RAG deficiency.
- name: Cernunnos-XLF deficiency
  description: >-
    Another radiosensitive NHEJ defect with combined immunodeficiency,
    microcephaly and growth retardation.
  distinguishing_features:
  - Genetic testing.
  disease_term:
    preferred_term: Cernunnos-XLF deficiency
    term:
      id: MONDO:0012650
      label: Cernunnos-XLF deficiency
  evidence:
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Their survival was similar to that of radiosensitive CERNUNNOS-deficient cells at a dose of 400 ng/mL phleomycin"
    explanation: The two disorders share the same degree of cellular radiosensitivity.
discussions:
- discussion_id: prkdc_neurodevelopment_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why did the compound heterozygous patient have profound microcephaly and
    brain malformation when DNA-PKcs-deficient mice, dogs and horses have
    normal neuronal development, and when founder-allele homozygotes have no
    neurological disease?
  attaches_to:
  - pathophysiology#Impaired Neurogenesis From Insufficient DNA-PKcs
  rationale: >-
    The animal models have no neurological phenotype, so they cannot test
    whether human neurogenesis needs high DNA-PK levels. The founder allele,
    which keeps kinase activity, spares the brain, while the genotype with
    barely detectable kinase activity did not. Whether the difference reflects
    residual kinase activity, total DNA-PKcs protein, or species differences
    in DNA-PK abundance is untested.
  evidence:
  - reference: PMID:23722905
    reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although loss of DNA-PKcs in mice, dogs, and horses was previously shown not to impair neuronal development, our findings demonstrate a stringent requirement for DNA-PKcs during human neuronal development"
    explanation: States the mismatch between the animal models and the patient.
  - reference: PMID:19823081
    reference_title: "DNA-PKcs deficiency in human: long predicted, finally found."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the spontaneous animal models, however, the kinase activity was completely lost, which is essentially different from the human mutation."
    explanation: The animal alleles differ in kind from the human founder allele.
- discussion_id: prkdc_founder_allele_phenotype_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the same homozygous p.Leu3062Arg genotype give classical infant
    SCID in some patients and later-onset combined immunodeficiency with
    granulomas and autoimmunity in others?
  attaches_to:
  - pathophysiology#Defective V(D)J Recombination
  - pathophysiology#Noninfectious Granulomatous Inflammation
  rationale: >-
    The founder allele explains the disease but not its range. Modifier
    genes, epigenetic or environmental factors and chance have been proposed;
    no study has compared founder-allele patients with different courses.
  evidence:
  - reference: PMID:30121298
    reference_title: "Two siblings with PRKDC defect who presented with cutaneous granulomas and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variation in clinical phenotypes of patients with PRKDC mutation suggests that additional factors such as modifying genes, epigenetic and environmental factors may affect the severity and clinical phenotype of the disease."
    explanation: States the unexplained variability.

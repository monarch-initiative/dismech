      reference_title: "SCID in Jack Russell terriers: a new animal model of DNA-PKcs deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data demonstrate significant species variation in the absolute necessity for DNA-PKcs during V(D)J recombination."
      explanation: Shows species variation in the V(D)J requirement for DNA-PKcs.
treatments:
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    The only curative treatment. In a 2024 series five of seven patients were
    transplanted, four were alive without transplant-related morbidity, and
    T- and B-cell reconstitution was sustained in four and three patients
    after a median follow-up of eight years. Skin granulomas resolved after
    transplantation in one patient, but organ-specific autoimmunity can
    appear afterwards because the recipient thymic epithelium is not
    replaced.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Arrested T- and B-Lymphocyte Development
    treatment_effect: RESTORES
    description: Donor stem cells provide lymphocyte precursors with normal DNA-PKcs.
  - target: Noninfectious Granulomatous Inflammation
    treatment_effect: INHIBITS
    description: Granulomas regressed after donor engraftment in one patient.
  notes: >-
    Conditioning is the main difficulty. All nucleated cells share the
    repair defect, so alkylating agents and irradiation are poorly tolerated
    and carry a risk of late effects; reduced-intensity or alkylator-sparing
    regimens are favoured for radiosensitive SCID, but outcome data for
    DNA-PKcs deficiency specifically are too few to recommend a regimen. One
    patient received myeloablative fludarabine and busulfan with full donor
    chimerism.
  evidence:
  - reference: PMID:38977084
    reference_title: "Human DNA-dependent protein kinase catalytic subunit deficiency: A comprehensive review and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation was performed in 5 patients, of whom 4 are still alive without transplant-related morbidity."
    explanation: Survival after transplantation in the largest series.
  - reference: PMID:38977084
    reference_title: "Human DNA-dependent protein kinase catalytic subunit deficiency: A comprehensive review and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sustained T- and B-cell reconstitution was observed, respectively, for 4 and 3 patients, after a median follow-up of 8 years (range 3-16 years)."
    explanation: Durable immune reconstitution after transplantation.
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine months after transplantation, his skin granuloma had disappeared."
    explanation: Granuloma regression after transplantation.
  - reference: PMID:25842288
    reference_title: "PRKDC mutations associated with immunodeficiency, granuloma, and autoimmune regulator-dependent autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After myeloablative conditioning with fludarabine and busulfan, Pt1 underwent bone marrow transplantation (BMT) from his HLA-identical mother, which resulted in reconstitution with 100% donor chimerism of the myeloid, B-cell, and T-cell compartments."
    explanation: A documented conditioning regimen and full donor chimerism.
  - reference: PMID:26055221
    reference_title: "Radiation-sensitive severe combined immunodeficiency: The arguments for and against conditioning before hematopoietic cell transplantation--what to do?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Results of hematopoietic cell transplantation for radiation-sensitive SCID suggest that minimizing exposure to alkylating agents and ionizing radiation is important for optimizing survival and minimizing late effects."
    explanation: Basis for alkylator- and irradiation-sparing conditioning in radiosensitive SCID.
  - reference: PMID:20113890
    reference_title: "Radiosensitive severe combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with the radiosensitive form of SCID may also have increased short- and long-term sensitivity to the alkylator-based chemotherapy regimens that are traditionally used for conditioning before allogeneic hematopoietic cell transplantation (HCT)"
    explanation: States the conditioning hazard specific to radiosensitive SCID.
  - reference: PMID:26055221
    reference_title: "Radiation-sensitive severe combined immunodeficiency: The arguments for and against conditioning before hematopoietic cell transplantation--what to do?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The data are too limited to comment on patients with DNA-PKcs abnormalities."
    explanation: Records that no PRKDC-specific conditioning evidence exists.

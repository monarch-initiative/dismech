pathophysiology:
- name: Biallelic Hypomorphic PRKDC Variants
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic PRKDC variants that reduce but do not abolish DNA-PKcs
    function. The recurrent founder allele p.Leu3062Arg leaves kinase activity
    and DNA end binding intact but cannot activate Artemis, while a compound
    heterozygous genotype (one inactivating allele, one with sharply reduced
    residual function) gave low protein and barely detectable kinase
    activity. No patient with two null alleles has been reported, consistent
    with residual DNA-PKcs activity being indispensable in humans.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: PRKDC
    term:
      id: hgnc:9413
      label: PRKDC
  molecular_functions:
  - preferred_term: DNA-dependent protein kinase activity
    modifier: DECREASED
    term:
      id: GO:0004677
      label: DNA-dependent protein kinase activity
  evidence:
  - reference: PMID:23722905
    reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a patient with compound heterozygous mutations in PRKDC, low DNA-PKcs expression, barely detectable DNA-PK kinase activity, and impaired DSB repair."
    explanation: >-
      A compound heterozygous genotype with low protein and barely detectable
      kinase activity grounds the DECREASED kinase-activity binding.
  - reference: PMID:23722905
    reference_title: "PRKDC mutations in a SCID patient with profound neurological abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a heterologous expression system, we found that one of the PRKDC mutations inactivated DNA-PKcs, while the other resulted in dramatically diminished but detectable residual function."
    explanation: Expression of the two patient alleles shows one null and one hypomorphic allele.
  - reference: PMID:19075392
    reference_title: "A DNA-PKcs mutation in a radiosensitive T-B- SCID patient inhibits Artemis activation and nonhomologous end-joining."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative mutation did not affect the kinase activity or DNA end-binding capacity of DNA-PKcs itself"
    explanation: >-
      The founder allele is hypomorphic in a different way: kinase activity is
      preserved, so the lost function lies downstream of the kinase.
  - reference: PMID:19075392
    reference_title: "A DNA-PKcs mutation in a radiosensitive T-B- SCID patient inhibits Artemis activation and nonhomologous end-joining."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further, the data suggest that residual DNA-PKcs activity is indispensable in humans."
    explanation: Supports describing all reported human genotypes as hypomorphic rather than null.
  downstream:
  - target: Defective DNA-PKcs-Dependent Artemis Activation

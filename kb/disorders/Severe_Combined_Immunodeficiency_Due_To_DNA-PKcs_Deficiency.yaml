- name: Impaired Immunoglobulin Class Switch Recombination
  biological_scale: CELLULAR
  description: >-
    Class switch recombination in mature B cells also relies on classical
    NHEJ. In switched B cells from DNA-PKcs-deficient patients the switch
    junctions shift towards microhomology-mediated alternative end joining,
    and the patient with the lowest kinase activity showed more severe
    switching abnormalities. This is one route to the selective IgA and IgG
    subclass deficiencies seen in some patients.

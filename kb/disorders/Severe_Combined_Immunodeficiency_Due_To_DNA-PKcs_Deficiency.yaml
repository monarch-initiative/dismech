- name: Loss of DNA-PKcs Support for AIRE-Dependent Tissue Antigen Expression
  biological_scale: CELLULAR
  description: >-
    In the thymic medulla AIRE drives the ectopic expression of peripheral
    tissue antigens that is needed to delete autoreactive T cells. DNA-PK is
    part of the AIRE transcriptional complex. Patient fibroblasts transfected
    with AIRE fail to induce AIRE-dependent genes such as IGFL1 and S100A8,
    and Prkdc-scid mice reconstituted with normal marrow show reduced
    AIRE-dependent transcription in medullary thymic epithelial cells and
    late autoantibody production. Because the defect sits in the thymic
    epithelium, it is not corrected by transplantation.
  genes:

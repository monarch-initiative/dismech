prevalence:
- population: General population
  notes: >-
    CED is a rare disorder; fewer than 100 affected individuals had been reported
    in the literature at the time of the GeneReviews summary, with no precise
    incidence established.
pathophysiology:
- name: CILK1 Ciliary Kinase Deficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >
    The CED6 route. A biallelic frameshift variant in the C-terminal
    non-catalytic domain of CILK1 removes the region that binds the IFT-B
    complex, without disturbing CILK1's own ciliary localization. CILK1 is a
    kinase rather than a transport subunit, so this is a distinct upstream lesion
    from the IFT-subunit mutations, and it reaches the same downstream mechanism
    by displacing IFT components within the cilium.
  cell_types:
  - preferred_term: ciliated cell
    term:
      id: CL:0000064
      label: ciliated cell
  cellular_components:
  - preferred_term: primary cilium
    term:
      id: GO:0005929
      label: cilium
  genes:
  - preferred_term: CILK1
    term:
      id: hgnc:21219
      label: CILK1
  evidence:
  - reference: PMID:40615527
    reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ciliogenesis-associated kinase 1 (CILK1) is a highly conserved ciliary
      serine/threonine kinase with an N-terminal catalytic domain responsible for
      kinase activity and a C-terminal non-catalytic domain that interacts with
      the IFT-B complex.
    explanation: >-
      Establishes CILK1 as a ciliary serine/threonine kinase and locates the
      IFT-B-binding region in the domain the CED variant truncates.
  - reference: PMID:40615527
    reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the ciliary localization of CILK1 bearing the variant itself
      remains unaffected.
    explanation: >-
      Distinguishes this lesion from a failure to deliver CILK1 to the cilium:
      the mutant protein still reaches the cilium but cannot engage IFT-B.
  downstream:
  - target: Intraflagellar Transport Dysfunction
    causal_link_type: DIRECT
    description: >-
      Loss of the CILK1 IFT-B-binding domain disrupts the localization of IFT
      components and alters cilium number and length in patient-derived cells.
    evidence:
    - reference: PMID:40615527
      reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional data from patient-derived cells and the C. elegans model
        indicate that the variant reduces cilia number, increases cilia length,
        and disrupts the localization of IFT components.
      explanation: >-
        Measures the ciliary and IFT-localization consequences of the CILK1 CED
        variant, which is the link from this node to the shared IFT-dysfunction
        node.
- name: Intraflagellar Transport Dysfunction
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >
    Biallelic mutations in IFT genes disrupt ciliary transport. Most CED genes
    encode IFT-A subunits involved in retrograde trafficking (IFT122, WDR35,
    IFT43, WDR19, and IFT140), while IFT52 encodes an IFT-B core subunit.
    Disrupted intraflagellar transport impairs primary cilium assembly,
    maintenance, and the gated compartmentalization of signaling machinery,
    producing a structurally deficient or functionally incompetent cilium.
  cell_types:
  - preferred_term: ciliated cell
    term:
      id: CL:0000064
      label: ciliated cell

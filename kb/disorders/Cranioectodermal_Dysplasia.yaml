  - preferred_term: IFT52
    term:
      id: hgnc:15901
      label: IFT52
  description: >
    Caused by biallelic mutations in IFT52, an IFT-B core complex protein, and so
    mechanistically distinct from the IFT-A retrograde-transport subtypes above.
    MONDO assigns no CED-numbered term to IFT52. A Monarch causal-gene query on
    hgnc:15901 returns one disease, short-rib thoracic dysplasia 16
    (MONDO:0014915, OMIM:617102), which MONDO classifies under both
    cranioectodermal dysplasia and Jeune syndrome. That term is bound here
    because the index patient's phenotype was reported as significantly
    overlapping CED type I; the Jeune entry does not bind it.
  evidence:
  - reference: PMID:26880018
    reference_title: A homozygous nonsense variant in IFT52 is associated with a human skeletal ciliopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical phenotype of the child shows significant overlap with
      cranioectodermal dysplasia type I (Sensenbrenner syndrome).
    explanation: >-
      Supports treating the IFT52 skeletal ciliopathy as a CED-overlapping entity
      rather than a distinct clinical syndrome.
  - reference: PMID:26880018
    reference_title: A homozygous nonsense variant in IFT52 is associated with a human skeletal ciliopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed a homozygous nonsense variant p.R142* in
      IFT52 encoding an IFT-B core complex protein as the probable cause of her
      condition.
    explanation: >-
      Source for assigning IFT52 to the IFT-B core complex rather than IFT-A.
inheritance:
- name: Autosomal Recessive
  description: >
    Autosomal recessive inheritance with genetic heterogeneity across IFT
    complex genes.
  evidence:
  - reference: PMID:20817137
    reference_title: "Exome sequencing identifies WDR35 variants involved in Sensenbrenner syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensenbrenner syndrome/cranioectodermal dysplasia (CED) is an
      autosomal-recessive disease that is characterized by craniosynostosis and
      ectodermal and skeletal abnormalities.
    explanation: >-
      Confirms autosomal recessive inheritance and the core craniosynostosis /
      ectodermal / skeletal triad of CED.
classifications:
  isds_skeletal_category:
  - classification_value: ciliopathies_with_major_skeletal_involvement
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 9 "Ciliopathies with major skeletal
      involvement"; listed as "Cranioectodermal dysplasia (Levin-Sensenbrenner) type 1,

    preferred_term: CILK1
    term:
      id: hgnc:21219
      label: CILK1
  subtype: CED6
  inheritance:
  - name: Autosomal Recessive
  features: >
    CILK1 (previous symbol ICK) encodes a ciliary serine/threonine kinase. Its
    C-terminal non-catalytic domain mediates interaction with the IFT-B complex,
    and a biallelic frameshift variant affecting the distal part of that domain
    causes CED. This is the only CED gene that does not itself encode an
    intraflagellar transport subunit.
  variants:
  - name: Biallelic CILK1 non-catalytic-domain frameshift variant
    description: >
      The reported CED allele is a homozygous frameshift in the distal
      non-catalytic domain, found in five patients from two pedigrees. Biallelic
      variants in the CILK1 catalytic domain cause different, perinatal-lethal
      skeletal ciliopathies instead.
    evidence:
    - reference: PMID:40615527
      reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Biallelic variants in the catalytic domain are associated with lethal
        skeletal dysplasia, endocrine cerebroosteodysplasia, and short-rib
        polydactyly syndrome.
      explanation: >-
        Establishes that the catalytic-domain allele class causes separate
        diseases, which is why the CED claim is restricted to the non-catalytic
        domain.
  evidence:
  - reference: PMID:40615527
    reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a homozygous frameshift variant in the CILK1 gene that affects
      the distal part of the non-catalytic domain, causing CED in five patients
      from two pedigrees.
    explanation: >-
      Direct CED case evidence establishing CILK1 as a causative gene.
  - reference: PMID:40615527
    reference_title: A homozygous frameshift variant in the CILK1 gene causes cranioectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ciliogenesis-associated kinase 1 (CILK1) is a highly conserved ciliary
      serine/threonine kinase with an N-terminal catalytic domain responsible for
      kinase activity and a C-terminal non-catalytic domain that interacts with
      the IFT-B complex.
    explanation: >-
      Source for the CILK1 protein architecture and its IFT-B interaction, which
      is how a non-IFT gene reaches the shared CED mechanism.
diagnosis:
- name: Clinical and Radiographic Diagnosis
  description: >-
    CED can be established clinically when the characteristic craniofacial,
    skeletal, ectodermal, and radiographic pattern is present, including at least
    two frequent features and two additional abnormalities with at least one
    ectodermal defect involving teeth, hair, or nails.
  diagnosis_term:
    preferred_term: clinical imaging procedure
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:24027799
    reference_title: "Cranioectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CED is established in a proband with characteristic
      clinical and radiographic features (including two frequent features and two
      other abnormalities, with at least one ectodermal defect – i.e.,
      involvement of the teeth, hair, or nails)
    explanation: >-
      GeneReviews defines the clinical/radiographic diagnostic rule for CED.
- name: Molecular Genetic Confirmation
  description: >-
    Molecular confirmation is by identifying biallelic pathogenic variants in a
    known CED gene: IFT43, IFT52, IFT122, IFT140, WDR19, or WDR35. Testing should
    be capable of detecting copy-number or structural alleles when sequence
    analysis finds only one variant, especially in IFT140.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:24027799
    reference_title: "Cranioectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identification of biallelic pathogenic variants in one of the six genes
      currently known to be associated with CED: IFT43, IFT52, IFT122, IFT140,
      WDR19, or WDR35.
    explanation: >-
      GeneReviews gives the current six-gene molecular diagnostic criterion.
  - reference: PMID:32007091
    reference_title: "Compound heterozygous IFT140 variants in two Polish families with Sensenbrenner syndrome and early onset end-stage renal disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent qPCR and duplex PCR analysis were conducted for both patients.
      Genetic analyses identified compound heterozygous variants in the IFT140
      gene in both affected individuals.
    explanation: >-
      The IFT140 case series shows that orthogonal copy-number assays were
      required in addition to NGS to resolve compound heterozygous variants.
- name: Prenatal Testing and Ultrasound in At-Risk Pregnancies
  description: >-
    Once familial pathogenic variants are known, prenatal or preimplantation
    genetic testing can be offered; second-trimester ultrasound may detect renal
    cysts, limb shortening, or polydactyly in an at-risk fetus.
  diagnosis_term:
    preferred_term: clinical imaging procedure
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:24027799
    reference_title: "Cranioectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk relatives, prenatal testing for a pregnancy at
      increased risk, and preimplantation genetic testing are possible once the
      CED-causing pathogenic variants have been identified in an affected family
      member.
    explanation: >-
      GeneReviews supports variant-informed prenatal and preimplantation
      testing in at-risk families.
  - reference: PMID:24027799
    reference_title: "Cranioectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Second-trimester ultrasound examination may detect renal cysts, shortening
      of the limbs, and/or polydactyly.
    explanation: >-
      GeneReviews supports second-trimester ultrasound as a prenatal diagnostic
      adjunct in at-risk pregnancies.
treatments:
- name: Craniosynostosis Surgery
  description: >
    Surgical correction of sagittal craniosynostosis, usually performed before
    age one year, to relieve premature suture fusion and its sequelae.
  therapeutic_modality: SURGERY
  treatment_term:

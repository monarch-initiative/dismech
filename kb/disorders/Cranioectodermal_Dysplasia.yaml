notes: >
  Subtype scope. MONDO:0009032 has seven hierarchical descendants (checked via the
  OLS4 hierarchicalDescendants endpoint): cranioectodermal dysplasia 1-6 and
  short-rib thoracic dysplasia 16. All seven are now bound as has_subtypes rows
  here, so this entry's subtype list matches the MONDO subtree exactly.

  MONDO:0014915 (short-rib thoracic dysplasia 16, OMIM:617102, the IFT52 leaf) is
  dual-parented under both cranioectodermal dysplasia and Jeune syndrome. It is
  bound on the IFT52-associated row here rather than on
  Jeune_Asphyxiating_Thoracic_Dystrophy, which does not bind it.

  Claims left to the entries that own them. The non-syndromic retinal (retinitis
  pigmentosa 80) and syndromic conorenal (short-rib thoracic dysplasia 9) poles of
  the IFT140 spectrum are curated on IFT140-related_Recessive_Ciliopathy. WDR19
  disease outside CED - Jeune syndrome and isolated nephronophthisis - is curated
  on Jeune_Asphyxiating_Thoracic_Dystrophy and Nephronophthisis. The CILK1
  catalytic-domain diseases (endocrine-cerebro-osteodysplasia, short-rib
  polydactyly syndrome, and juvenile myoclonic epilepsy susceptibility) are
  separate entities and are not modeled here.

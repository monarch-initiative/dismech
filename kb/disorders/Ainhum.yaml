differential_diagnoses:
- name: Pseudo-Ainhum
  description: >-
    Pseudo-ainhum is an ainhum-like annular digital constriction secondary to an
    identifiable hereditary or acquired condition. The visible ring can closely
    resemble true ainhum, but causal history, associated systemic or cutaneous
    findings, congenital onset, or a foreign-body tourniquet favors the
    secondary diagnosis.
  distinguishing_features:
  - An identifiable precipitating factor or underlying disorder.
  - Congenital onset, non-classic distribution, or syndromic skin findings.
  - Management must address the underlying cause as well as the constriction.
  evidence:
  - reference: PMID:25657437
    reference_title: "Familial ainhum: a case report of multiple toe involvement in a father and son, staging of ainhum with insight into different types of constricting bands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pseudoainhum is a similar condition that occurs as a secondary event
      resulting from certain hereditary and nonhereditary diseases that lead to
      annular constriction of digits.
    explanation: >-
      The report defines pseudo-ainhum by a secondary hereditary or
      nonhereditary cause.
  - reference: PMID:27011582
    reference_title: "Ainhum: A Spot Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It needs to be differentiated from pseudo ainhum, which may have a
      precipitating factor, and careful history may reveal a preventable cause.
    explanation: >-
      A careful causal history is identified as a key discriminator.
- name: Keratoderma Hereditarium Mutilans (Vohwinkel Syndrome)
  description: >-
    Vohwinkel syndrome is an inherited mutilating palmoplantar keratoderma that
    can produce ainhumoid constriction bands. Keratoderma and a hereditary
    syndromic pattern support Vohwinkel syndrome rather than idiopathic true
    ainhum.
  disease_term:
    preferred_term: Vohwinkel syndrome
    term:
      id: MONDO:0007422
      label: keratoderma hereditarium mutilans
  distinguishing_features:
  - Hereditary palmoplantar keratoderma and other syndrome-associated skin findings.
  - Ainhumoid bands are secondary to the inherited keratoderma.
  evidence:
  - reference: PMID:25624138
    reference_title: "[Ainhum and \"African acral keratoderma\": three cases]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ainhumoid palmoplantar keratoderma, which is of genetic origin and occurs
      for instance in Vohwinkel syndrome.
    explanation: >-
      The series distinguishes genetic ainhumoid keratoderma from true ainhum
      and names Vohwinkel syndrome as an example.
- name: Ischemia-Associated Pseudo-Ainhum
  description: >-
    Peripheral arterial disease can coexist with an ainhum-like toe
    constriction and should be classified as secondary pseudo-ainhum rather than
    used as evidence that ischemia causes true ainhum.
  distinguishing_features:
  - Objective chronic lower-limb ischemia or peripheral arterial disease.
  - Management includes assessment of perfusion and possible revascularization.
  evidence:
  - reference: PMID:21693445
    reference_title: "Pseudoainhum of the toe with underlying chronic lower-limb ischemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of pseudoainhum in a Caucasian female with underlying
      chronic lower limb peripheral arterial disease (PAD).
    explanation: >-
      This Ainhum-specific case identifies PAD-associated constriction as
      pseudo-ainhum, not true ainhum.
discussions:
- discussion_id: ainhum_unresolved_initiating_cause
  prompt: >-
    Does the mechanical-inflammatory wound-repair pattern initiate the
    constriction band, or is it a secondary response to an earlier unidentified
    lesion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Toe-Base Groove or Fissure
  - pathophysiology#Epidermal and Dermal Wound-Repair Response
  - pathophysiology#Circumferential Fibrotic Constriction
  rationale: >-
    Human pathology establishes hyperkeratosis, fibroblast-rich repair,
    lymphocytic inflammation, ligament destruction, and bone resorption, but
    cross-sectional tissue cannot determine temporal order or causal
    direction. Trauma, infection, neuropathy, perfusion change, and immune
    mechanisms therefore remain unproven as causes of true ainhum.
  evidence:
  - reference: PMID:3214498
    reference_title: "[Spontaneous dactylolysis or ainhum. Histopathologic study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is a tropical disease of the adult, the origin of which remains
      obscure.
    explanation: >-
      The seven-case pathology series explicitly states that the origin remains
      obscure.
  - reference: PMID:2423578
    reference_title: "The surgical pathology of ainhum (dactylolysis spontanea)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spontaneous amputation of the fifth toe, designated as dactylolysis
      spontanea, has no known etiology
    explanation: >-
      The surgical-pathology report also states that the etiology was unknown.
- discussion_id: ainhum_acral_keratoderma_boundary
  prompt: >-
    Is the reported association between true ainhum and an African acral
    keratoderma spectrum causal, a shared susceptibility, or an ascertainment
    association?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Epidermal and Dermal Wound-Repair Response
  rationale: >-
    A 42-patient retrospective keratoderma cohort included only three patients
    with ainhum. Familial aggregation across the broader mixed-keratoderma
    cohort does not establish Mendelian inheritance or a causal gene for true
    ainhum, so no gene is encoded in this entry.
  evidence:
  - reference: PMID:36424301
    reference_title: "\"African\" acral keratoderma: Further evidence for a single entity. A retrospective study of 42 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 had ainhum
    explanation: >-
      Only three members of the 42-patient acral-keratoderma cohort had ainhum.
  - reference: PMID:36424301
    reference_title: "\"African\" acral keratoderma: Further evidence for a single entity. A retrospective study of 42 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic origin is suggested by the familial aggregation of cases.
    explanation: >-
      The authors suggest a genetic origin for the broader acral-keratoderma
      entity; this does not establish a gene or inheritance model for true
      ainhum.

  - reference: PMID:26379327
    reference_title: "Dactylolysis spontanea (ainhum)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main DS feature of this condition is the development of a fibrotic
      constriction ring involving the base of one or more toes, conditioning
      eversion and absorption of distal structures, possibly progressing to
      spontaneous amputation
    explanation: >-
      The radiology review identifies a fibrotic constriction ring as the main
      lesion and links it to distal structural change.
  downstream:

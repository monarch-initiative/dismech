    Resected tissue can show epidermal hyperkeratotic change, numerous
    fibroblasts, wound-repair phenomena, chronic dermatitis, and a
    T-lymphocyte-predominant infiltrate. The response is modeled as an
    alternative candidate input because the evidence does not establish whether
    it precedes or follows mechanical constriction.

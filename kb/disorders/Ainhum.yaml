name: Ainhum
creation_date: "2026-02-04T17:27:57Z"
description: >-
  Ainhum (dactylolysis spontanea) is a rare, acquired, progressive, and
  idiopathic constriction disorder that classically affects the fifth toe. A
  plantar groove or fissure becomes a circumferential fibrotic band, followed
  by distal enlargement, pain, soft-tissue and phalangeal resorption, and
  sometimes spontaneous autoamputation. True ainhum is distinguished from
  pseudo-ainhum, in which a hereditary disorder, vascular disease, congenital
  band, foreign-body tourniquet, or another identifiable cause produces an
  ainhum-like constriction.
categories:
- Dermatologic Disease
- Musculoskeletal Disease
- Rare Disease
synonyms:
- Dactylolysis spontanea
- Spontaneous dactylolysis
disease_term:
  preferred_term: ainhum
  term:
    id: MONDO:0007074
    label: ainhum
parents:
- Dermatologic Disease
- Musculoskeletal Disease
mechanistic_hypotheses:
- hypothesis_group_id: progressive_constriction_model
  hypothesis_label: Progressive Constriction Model
  status: CANONICAL
  description: >-
    This descriptive natural-history model links a plantar fifth-toe groove or
    fissure to circumferential constriction, distal enlargement, progressive
    soft-tissue and phalangeal destruction, and eventual autoamputation. It
    describes the observed sequence without assigning an established initiating
    molecular cause.
  evidence:
  - reference: PMID:17924881
    reference_title: "An unusual cause of ulceration: ainhum (dactylolysis spontanea)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eventually, the groove extends to encircle the toe, the underlying
      structures are absorbed and the toe autoamputates.
    explanation: >-
      The case report and clinical review state the characteristic sequence
      from encircling groove through tissue absorption to autoamputation.
- hypothesis_group_id: mechanical_inflammatory_wound_repair_model
  hypothesis_label: Mechanical-Inflammatory Wound-Repair Model
  status: ALTERNATIVE
  description: >-
    Histopathologic observations support a candidate mechanical-inflammatory
    wound-repair process involving hyperkeratosis, chronic dermatitis,
    fibroblast-rich repair, and lymphocytic inflammation. These findings do not
    establish whether inflammation and repair initiate the band or arise
    secondarily after chronic constriction.
  evidence:
  - reference: PMID:3214498
    reference_title: "[Spontaneous dactylolysis or ainhum. Histopathologic study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the usually considered etiopathogenetic hypotheses, our findings
      are in favor of a mechanical and inflammatory origin.
    explanation: >-
      A seven-case histopathology series favored this interpretation, but did
      not experimentally establish the initiating cause.
  - reference: PMID:2423578
    reference_title: "The surgical pathology of ainhum (dactylolysis spontanea)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperkeratosis and parakeratosis, together with elongation of the
      epidermal rete pegs and acanthosis, are observed and these findings are
      associated with the presence of numerous fibroblasts and wound repair
      phenomena.
    explanation: >-
      Surgical pathology directly documents fibroblast-rich wound-repair
      changes but does not determine whether they are primary or reactive.

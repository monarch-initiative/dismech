treatments:
- name: Early Constriction-Band Release With Z-Plasty
  action_category: THERAPEUTIC
  description: >-
    At an early, structurally salvageable stage, excision or release of the
    circular constriction followed by Z-plasty can relieve pain and may prevent
    progression to amputation. Evidence is limited to case reports and series;
    no controlled efficacy evidence establishes an optimal technique.
  treatment_term:
    preferred_term: Reconstructive Surgery
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_mechanisms:
  - target: Circumferential Fibrotic Constriction
    treatment_effect: INHIBITS
    description: >-
      Z-plasty releases the circular band, directly reducing the defining
      mechanical constriction.
    evidence:
    - reference: PMID:25624138
      reference_title: "[Ainhum and \"African acral keratoderma\": three cases]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Once the diagnosis had been made, relief was promptly provided for all
        three patients through Z-plasty to remove the circular constriction
        around the toe in question.
      explanation: >-
        The three-case series directly links Z-plasty to removal of the
        constriction and prompt symptom relief.
  evidence:
  - reference: PMID:25624138
    reference_title: "[Ainhum and \"African acral keratoderma\": three cases]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the diagnosis had been made, relief was promptly provided for all
      three patients through Z-plasty to remove the circular constriction around
      the toe in question.
    explanation: >-
      Prompt relief after Z-plasty was reported in three patients.
- name: Advanced-Stage Surgical Amputation or Disarticulation
  action_category: THERAPEUTIC
  description: >-
    When the toe is irreversibly destroyed, separated, hypermobile, or severely
    painful, surgical amputation or disarticulation may provide symptom relief
    and controlled wound closure. This late-stage palliative procedure is
    distinct from early band release.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  target_mechanisms:
  - target: Foot Pain
    treatment_effect: INHIBITS
    description: >-
      Removal of an irreversibly damaged, painful toe is intended to alleviate
      advanced-stage pain rather than reverse the upstream disease mechanism.
    evidence:
    - reference: PMID:31401977
      reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Timely amputation helps in pain relief
      explanation: >-
        The review section describes pain relief as an intended benefit of
        timely amputation.
  evidence:
  - reference: PMID:31401977
    reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was managed surgically by excision of the band, disarticulated at
      right fifth metatarsophalangeal joint and skin closure.
    explanation: >-
      The case directly documents band excision, disarticulation, and closure in
      advanced disease.

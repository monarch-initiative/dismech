      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Findings on x-ray imaging include a radiolucent ring constricting the
        base of the toe, bone resorption or osteolysis is seen in the distal and
        middle phalanges, with a characteristic tapering effect
      explanation: >-
        The review section directly links advanced ainhum to phalangeal
        resorption and osteolysis on radiography.

progression:
- phase: Stage 1 - Groove and Annular Fissure
  notes: >-
    A plantar clavus or groove progresses to an annular fissure around the toe.
    This is a descriptive clinical stage, not a precisely timed longitudinal
    interval.
  evidence:
  - reference: PMID:31401977
    reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clavus develops, which progresses to an annular fissure around the toe
    explanation: >-
      The review section describes the first clinical stage.
- phase: Stage 2 - Distal Enlargement and Bone Resorption
  notes: >-
    The toe becomes globular distal to the groove as structural resorption
    begins.
  evidence:
  - reference: PMID:31401977
    reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The toe becomes globular distal to the groove, associated with bone
      resorption and arterial narrowing
    explanation: >-
      The review section describes the second clinical stage.
- phase: Stage 3 - Joint Separation and Hypermobility
  notes: >-
    Progressive bone loss permits painful separation at the joint and
    hypermobility of the distal toe.
  evidence:
  - reference: PMID:31401977
    reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The very painful bone separates at the joint with hypermobility of the toe
    explanation: >-
      The review section describes the third clinical stage.
- phase: Stage 4 - Autoamputation
  notes: >-
    End-stage structural loss culminates in spontaneous autoamputation.
  evidence:
  - reference: PMID:31401977
    reference_title: "Ainhum, a rare mutilating dermatological disease in a female Cameroonian: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A bloodless auto-amputation of the toe with severe pains.
    explanation: >-
      The review section describes the fourth clinical stage.
diagnosis:
- name: Clinical Assessment for True Ainhum
  description: >-
    Diagnosis is primarily clinical: identify the acquired fifth-toe
    constriction and characteristic distal changes, establish spontaneous onset,
    and take a careful history for trauma, tourniquet, congenital band,
    hereditary keratoderma, vascular disease, infection, or another secondary
    cause that would favor pseudo-ainhum.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: MAXO:0000487
      label: clinical assessment
  results: >-
    Hallmark annular constriction at the fifth-toe base with no identified
    precipitating or underlying cause supports true ainhum.
  evidence:
  - reference: PMID:27011582
    reference_title: "Ainhum: A Spot Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ainhum is an acquired progressive condition presenting with a
      constriction ring around the fifth toe.
    explanation: >-
      The case report supports recognition of the characteristic acquired
      constriction-ring presentation.
  - reference: PMID:27011582
    reference_title: "Ainhum: A Spot Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It needs to be differentiated from pseudo ainhum, which may have a
      precipitating factor, and careful history may reveal a preventable cause.
    explanation: >-
      The report explicitly supports searching for a precipitating cause to
      distinguish pseudo-ainhum.
- name: Foot Radiography for Diagnosis and Staging
  description: >-
    Plain radiographs evaluate the constriction ring, soft-tissue contour,
    phalangeal tapering, osteolysis, and stage. Imaging supports but does not
    replace the clinical distinction between idiopathic true ainhum and
    secondary pseudo-ainhum.
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: MAXO:0000595
      label: radiograph imaging procedure
  results: >-
    A soft-tissue constriction or radiolucent ring with progressive middle and
    distal phalangeal resorption supports ainhum and helps assign stage.
  evidence:
  - reference: PMID:12500788
    reference_title: "Ainhum (dactylolysis spontanea): a radiological survey of 6000 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis and accurate staging of ainhum are facilitated by
      radiological examination of the feet.
    explanation: >-
      The selected radiographic series supports foot radiography for diagnosis
      and staging.

    reference_title: "[Spontaneous dactylolysis or ainhum. Histopathologic study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical features have been found, including hyperkeratosis, chronic
      dermatitis, osteoporosis with cortical bone resorption.
    explanation: >-
      The seven-case pathology series directly documents cortical bone
      resorption.
  - reference: PMID:3214498
    reference_title: "[Spontaneous dactylolysis or ainhum. Histopathologic study]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study has also revealed in all cases complete ligamental destruction.
    explanation: >-
      Complete ligament destruction was observed in all seven histologically
      studied cases.

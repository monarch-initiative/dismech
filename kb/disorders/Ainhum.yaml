- name: Circumferential Fibrotic Constriction
  description: >-
    A hard annular fibrotic band surrounds the toe base and progressively
    constricts the enclosed soft tissues. This is the defining structural lesion
    of true ainhum.
  locations:
  - preferred_term: pedal digit 5
    term:
      id: UBERON:0003635

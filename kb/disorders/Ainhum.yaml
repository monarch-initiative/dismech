    Advanced disease includes absorption of underlying soft tissues, cortical
    bone resorption, complete ligament destruction, joint separation, and
    progressive loss of phalangeal structure.
  locations:
  - preferred_term: pedal digit 5
    term:
      id: UBERON:0003635
      label: pedal digit 5
  biological_processes:

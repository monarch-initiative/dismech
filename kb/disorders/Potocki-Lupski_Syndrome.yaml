has_subtypes:
- name: Typical
  display_name: Typical ~3.7 Mb 17p11.2 duplication
  description: >-
    The recurrent ~3.7 Mb 17p11.2 duplication mediated by non-allelic homologous
    recombination between the flanking SMS-REP low-copy repeats — the reciprocal
    copy-number gain of the common Smith-Magenis syndrome deletion. Contains RAI1
    together with the surrounding contiguous genes.
  evidence:
  - reference: PMID:23255863
    reference_title: "Reciprocal deletion and duplication of 17p11.2-11.2: Korean patients with Smith-Magenis syndrome and Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion and duplication of the -3.7-Mb region in 17p11.2 result in two reciprocal syndrome, Smith-Magenis syndrome and Potocki-Lupski syndrome."
    explanation: Defines the typical ~3.7 Mb duplication as the reciprocal copy-number event of the Smith-Magenis deletion.
- name: Small RAI1 duplication
  display_name: Small RAI1-containing duplication (down to ~0.25 Mb)
  description: >-
    Smaller, atypical duplications that still encompass RAI1 (reported down to
    ~0.25 Mb) are associated with a milder phenotype, supporting RAI1 dosage as
    the rate-limiting driver rather than the full contiguous interval.
  evidence:
  - reference: PMID:23078968
    reference_title: "Clinical and cytogenetic features of a Potocki-Lupski syndrome with the shortest 0.25Mb microduplication in 17p11.2 including RAI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When compared with previously reported cases, the milder phenotype of our patient may be associated with the smallest duplication in 17p11.2, 0.25Mb in length."
    explanation: A ~0.25 Mb duplication still including RAI1 produced a milder phenotype, delineating a small-duplication subtype.

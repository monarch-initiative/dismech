  rate_per_100000: 5.0
  notes: >-
    Estimated at ~1 in 20,000 live births (5 per 100,000). Likely underascertained
    because the phenotype is mild and nonspecific relative to the reciprocal
    Smith-Magenis deletion.
  evidence:
  - reference: PMID:28413209
    reference_title: "Duplication 17p11.2 (Potocki-Lupski Syndrome) in a child with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a rare contiguous gene syndrome affecting 1 in 20,000 live births."
    explanation: Provides the commonly cited ~1 in 20,000 live-birth frequency.
pathophysiology:
- name: 17p11.2 Microduplication
  biological_scale: MOLECULAR
  description: >-
    A recurrent copy-number gain of the 17p11.2 region, generated by non-allelic
    homologous recombination between the flanking SMS-REP low-copy repeats. It is
    the reciprocal event of the Smith-Magenis syndrome deletion; the two share an
    overlapping critical interval containing RAI1.
  evidence:
  - reference: PMID:23255863
    reference_title: "Reciprocal deletion and duplication of 17p11.2-11.2: Korean patients with Smith-Magenis syndrome and Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These regions overlapped in a 2.1 Mb size containing 11 common genes, including RAI1 and SREBF."
    explanation: Establishes the shared 17p11.2 critical interval (including RAI1) between the reciprocal duplication and deletion.
  downstream:
  - target: Increased RAI1 Dosage
    causal_link_type: DIRECT
    description: The duplication raises the copy number of RAI1, the dosage-sensitive gene within the interval.
- name: Increased RAI1 Dosage
  biological_scale: MOLECULAR
  description: >-
    RAI1 (retinoic acid induced 1) is a transcriptional regulator and the
    dosage-sensitive critical gene of the 17p11.2 interval. A third copy raises
    RAI1 expression, dysregulating RAI1-dependent transcriptional programs. This
    is the copy-number-gain mirror of the RAI1 haploinsufficiency that causes
    Smith-Magenis syndrome.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of RAI1-dependent transcription
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: INCREASED
  genetic_context:
    gene:
      preferred_term: RAI1
      term:
        id: hgnc:9834
        label: RAI1
    functional_impact_category: HYPERMORPHIC
  evidence:
  - reference: PMID:33043631
    reference_title: "Neurological phenotype of Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by duplications of the 17p11.2 region, encompassing RAI1 gene."
    explanation: Attributes PTLS to duplication of the 17p11.2 region encompassing RAI1.
  - reference: PMID:23078968
    reference_title: "Clinical and cytogenetic features of a Potocki-Lupski syndrome with the shortest 0.25Mb microduplication in 17p11.2 including RAI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the critical PTLS region was deduced to be 1.3Mb in length, and included RAI1 and 17 other genes."
    explanation: Delineates the RAI1-containing critical region for PTLS.
  downstream:
  - target: Neurodevelopmental Dysregulation
    causal_link_type: DIRECT
    description: Altered RAI1 dosage perturbs neurodevelopmental transcriptional programs.
- name: Neurodevelopmental Dysregulation
  biological_scale: CELLULAR
  description: >-
    Dysregulation of RAI1-dependent neurodevelopmental programs produces the
    variably expressive cognitive, language, autistic, behavioral, and sleep
    phenotype. Expressivity is notably broad even among individuals with similar
    duplications.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33043631
    reference_title: "Neurological phenotype of Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its clinical presentation is extremely variable, especially for what concerns the cognitive level and the behavioral phenotype."
    explanation: Documents the extreme clinical variability of the neurodevelopmental phenotype.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: DIRECT
  - target: Intellectual Disability
    causal_link_type: DIRECT
  - target: Autistic Behavior
    causal_link_type: DIRECT

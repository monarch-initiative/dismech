name: Potocki-Lupski Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Potocki-Lupski syndrome (PTLS) is a rare contiguous-gene neurodevelopmental
  disorder caused by a recurrent ~3.7 Mb microduplication of chromosome 17p11.2 —
  the reciprocal copy-number gain of the deletion that causes Smith-Magenis
  syndrome, generated by non-allelic homologous recombination between the flanking
  SMS-REP low-copy repeats. Increased dosage of the dosage-sensitive gene RAI1
  (retinoic acid induced 1) is the principal driver; smaller duplications that
  still include RAI1 (down to ~0.25 Mb) reproduce a milder form of the phenotype,
  establishing RAI1 gene dosage as rate-limiting. The core phenotype comprises
  infantile hypotonia, failure to thrive, global developmental delay with
  mild-to-moderate intellectual disability, prominent speech/language delay,
  autism spectrum features, behavioral and sleep disturbance, variable
  craniofacial dysmorphism, and cardiovascular anomalies (notably dilated aortic
  root and other structural defects). Expressivity is highly variable.
category: Genetic
synonyms:
- 17p11.2 duplication syndrome
- dup(17)(p11.2p11.2) syndrome
- trisomy 17p11.2
- PTLS
parents:
- hereditary disease
- chromosomal disorder

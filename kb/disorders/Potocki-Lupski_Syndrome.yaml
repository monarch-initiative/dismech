genetic:
- name: RAI1
  gene_term:
    preferred_term: RAI1
    term:
      id: hgnc:9834
      label: RAI1
  association: Causal
  relationship_type: SUSCEPTIBILITY
  notes: >-
    RAI1 is the dosage-sensitive critical gene of the 17p11.2 interval. PTLS
    results from a copy-number GAIN (increased RAI1 dosage), the reciprocal of
    the RAI1 haploinsufficiency that causes Smith-Magenis syndrome. Small
    duplications that still include RAI1 reproduce a milder phenotype.
  evidence:
  - reference: PMID:33043631
    reference_title: "Neurological phenotype of Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by duplications of the 17p11.2 region, encompassing RAI1 gene."
    explanation: Identifies RAI1 as the gene encompassed by the causative 17p11.2 duplication.
- name: 17p11.2 duplication (contiguous genes)
  association: Causal
  notes: >-
    The recurrent ~3.7 Mb 17p11.2 duplication is a copy-number gain spanning RAI1
    and additional contiguous genes (candidate contributors include SREBF1, DRG2,
    LLGL1, SHMT1, and ZFP179). No coordinate slot exists in the schema; the
    structural event is recorded here in prose (copy-number gain, 17p11.2).
  evidence:
  - reference: PMID:28413209
    reference_title: "Duplication 17p11.2 (Potocki-Lupski Syndrome) in a child with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there are a few genes which are considered as candidates for PTLS which include RAI1, SREBF1, DRG2, LLGL1, SHMT1 and ZFP179."
    explanation: Names the contiguous candidate genes within the PTLS duplication interval.
  - reference: PMID:28837307
    reference_title: "Potocki-Lupski Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent 3.7-Mb duplication accounts for approximately two thirds of 17p11.2 duplications; approximately one third are non-recurrent duplications that encompass RAI1 and vary in size from 0.41 Mb to 19.7 Mb."
    explanation: GeneReviews quantifies the recurrent 3.7-Mb duplication against the non-recurrent RAI1-containing alternatives.
diagnosis:
- name: Chromosomal Microarray (array CGH)
  presence: 17p11.2 copy-number gain
  notes: >-
    Chromosomal microarray (array CGH) detects and sizes the 17p11.2 duplication;
    MLPA and FISH with probes in the PTLS critical region confirm it.
  evidence:
  - reference: PMID:28413209
    reference_title: "Duplication 17p11.2 (Potocki-Lupski Syndrome) in a child with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report demonstrates the importance of microarray and FISH in the diagnosis of PTLS."
    explanation: Establishes microarray and FISH as the diagnostic modalities for PTLS.

    reference_title: "Reciprocal deletion and duplication of 17p11.2-11.2: Korean patients with Smith-Magenis syndrome and Potocki-Lupski syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These regions overlapped in a 2.1 Mb size containing 11 common genes, including RAI1 and SREBF."
    explanation: Establishes the shared 17p11.2 critical interval (including RAI1) between the reciprocal duplication and deletion.
  downstream:
  - target: Increased RAI1 Dosage
    causal_link_type: DIRECT
    description: The duplication raises the copy number of RAI1, the dosage-sensitive gene within the interval.
- name: Increased RAI1 Dosage
  biological_scale: MOLECULAR
  description: >-
    RAI1 (retinoic acid induced 1) is a transcriptional regulator and the
    dosage-sensitive critical gene of the 17p11.2 interval. A third copy raises
    RAI1 expression, dysregulating RAI1-dependent transcriptional programs. This
    is the copy-number-gain mirror of the RAI1 haploinsufficiency that causes
    Smith-Magenis syndrome.

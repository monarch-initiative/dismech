genetic:
- name: ARSL
  relationship_type: CAUSATIVE
  presence: Present
  gene_term:
    preferred_term: ARSL
    term:
      id: hgnc:719
      label: ARSL
  notes: >-
    ARSL (arylsulfatase L; previous symbols ARSE, CDPX, CDPX1) at Xp22.33. Roughly
    60-75% of molecularly solved cases are found by sequencing and a further ~25% by
    deletion/rearrangement analysis, so a normal sequencing result does not exclude the
    diagnosis. The important negative is that most patients meeting clinical criteria
    have no ARSL variant at all - those belong to the phenocopy group rather than to
    this gene.
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CDPX1 is established in a male proband with typical clinical and
      radiographic findings and a hemizygous ARSL pathogenic variant identified by
      molecular genetic testing.
    explanation: States the gene and the hemizygous requirement for diagnosis.
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in seven individuals."
    explanation: >-
      Seven of eleven patients meeting clinical criteria had identifiable variants in
      this systematic series.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are hemizygous males. Female carriers have not so far been
    reported as affected - the contrast with CDPX2, where the heterozygous female is the
    typical patient, follows from CDPX1 being recessive rather than dominant at the
    X-linked locus.
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Males who inherit the pathogenic variant will be affected; females who inherit the
      pathogenic variant will be carriers and thus far have not been affected.
    explanation: States the X-linked recessive pattern and the carrier status of females.
diagnosis:
- name: Molecular testing of ARSL
  description: >-
    Diagnosis requires typical clinical and radiographic findings plus a hemizygous ARSL
    variant. There is no biochemical confirmatory test: enzyme assay is not clinically
    available, and because the substrate is unknown there is no metabolite to measure.
    That is a real diagnostic handicap in a disorder whose most important differentials
    are acquired.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing of ARSL enzymatic activity is not currently available on a clinical basis."
    explanation: States that no clinical enzyme assay exists.
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "molecular analysis remains the only confirmatory diagnostic test"
    explanation: Confirms that molecular testing is the sole confirmatory route.
- name: Maternal history as part of the diagnostic workup
  description: >-
    Because the phenocopies are indistinguishable on examination, evaluating a stippled
    male infant means taking a maternal history - coumarin exposure, vitamin K status,
    autoimmune disease - as seriously as the molecular test. The largest systematic
    series found maternal conditions in three of the four patients who had no ARSL
    variant.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the remainder, three had maternal conditions that further expand the phenocopy
      group.
    explanation: >-
      Documents that maternal conditions accounted for most of the variant-negative
      patients in this series.
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We extracted clinical information from all prior reports over the past decade and
      show that there are few distinguishing features on examination between these two
      groups of patients.
    explanation: >-
      Establishes that examination alone cannot separate genetic CDPX1 from its
      phenocopies, which is why the maternal history carries diagnostic weight.
treatments:
- name: Cervical spine surveillance, immobilization, and decompression
  description: >-
    Flexion-extension radiographs every six to twelve months until growth is complete;
    a cervical collar or spinal fusion for instability; decompression for stenosis. Neck
    extension, neck flexion, and contact sports are to be avoided in an affected
    individual with instability, and the cervical spine should be imaged before general
    anaesthesia.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:

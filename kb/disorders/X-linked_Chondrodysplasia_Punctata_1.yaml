differential_diagnoses:
- name: Warfarin (coumarin) embryopathy
  description: >-
    The phenocopy that the gene-discovery work itself explained. A fetus exposed to a
    coumarin derivative in early gestation develops a virtually identical picture,
    proposed to be drug-induced inhibition of the same warfarin-sensitive arylsulfatase.
    It is a differential diagnosis rather than a form of CDPX1, since the ARSL gene is
    intact.
  distinguishing_features:
  - A maternal history of coumarin exposure in the first trimester
  - No ARSL variant is identifiable
  - Female infants can be affected, whereas genetic CDPX1 affects hemizygous males
  evidence:
  - reference: PMID:7720070
    reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A virtually identical phenotype is observed in the warfarin embryopathy, which is
      due to the teratogenic effects of coumarin derivatives during pregnancy.
    explanation: >-
      States that the phenotypes are virtually identical, which is why this is the primary
      differential rather than a distant one.
- name: Vitamin K deficiency and maternal autoimmune phenocopies of brachytelephalangic CDP
  description: >-
    Early-gestation vitamin K deficiency and maternal autoimmune disease, notably
    systemic lupus erythematosus, produce the same brachytelephalangic picture. In the
    largest systematic series these accounted for most of the variant-negative patients,
    and the authors report few distinguishing features on examination. One report of a
    newborn with brachytelephalangic CDP, maternal SLE, and two unrelated de novo variants
    goes further and argues the radiographic pattern is not a diagnostic entity at all.
  distinguishing_features:
  - A maternal history of autoimmune disease or of a condition causing vitamin K deficiency
  - No ARSL variant is identifiable
  - Affected infants of either sex
  evidence:
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major clinical features in these patients are also present in a group now
      recognized as phenocopies, due to vitamin K deficiency in early gestation or
      maternal autoimmune disease.
    explanation: Names the two acquired phenocopy mechanisms.
  - reference: PMID:32506814
    reference_title: "Maternal SLE and brachytelephalangic chondrodysplasia punctata in a patient with unrelated de novo RAF1 and SIX2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case shows that BCDP is most probably not a diagnostic entity and can be
      associated with various conditions associated with CDP including maternal SLE.
    explanation: >-
      The strongest published statement of the position that the brachytelephalangic
      pattern names a convergence rather than a disease.
- name: X-linked chondrodysplasia punctata 2 (Conradi-Hunermann-Happle syndrome)
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 2
    term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
  description: >-
    The other X-linked CDP and the source of most naming confusion, since both are
    "X-linked chondrodysplasia punctata". They share almost nothing else: CDPX2 is
    dominant, sterol-pathway, male-lethal, and mosaic.
  distinguishing_features:
  - CDPX2 affects heterozygous females and is lethal in hemizygous males; CDPX1 affects hemizygous males and spares carrier females
  - CDPX2 has ichthyosis, follicular atrophoderma, scarring alopecia, and cataract; CDPX1 has none of these
  - CDPX2 has asymmetric rhizomelic shortening; CDPX1 has brachytelephalangy and nasomaxillary hypoplasia
  - CDPX2 has a diagnostic sterol profile; CDPX1 has no biochemical marker at all
discussions:
- discussion_id: arsl_substrate_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified Sulfated Substrate Accumulates or Fails to Be Processed
  - pathophysiology#ARSL Arylsulfatase Deficiency
  prompt: >-
    What is the physiological substrate of ARSL, and what sulfated species links its
    loss to abnormal cartilage mineralization?
  rationale: >-
    The gene has been known since 1995 and the enzyme deficiency has been demonstrated
    directly in patients, yet neither the substrate nor the function of the enzyme has
    been identified. Every consequence follows from that: there is no biochemical
    diagnostic test, no metabolite to monitor, no target for therapy, and a pathophysiology
    node in this entry that can only be named negatively. The gap is unusual among the
    chondrodysplasia punctata group, where the peroxisomal and sterol-pathway members all
    have solved biochemistry and quantitative diagnostic assays. Two clues constrain the
    answer - the enzyme's warfarin sensitivity, and the fact that early-gestation vitamin
    K deficiency phenocopies the disorder - which together point towards a
    vitamin-K-dependent process, but no candidate substrate has been confirmed.
  proposed_experiments:
  - experiment_id: arsl_substrate_identification
    name: Substrate identification for ARSL
    description: >-
      Untargeted sulfatomic profiling of ARSL-deficient versus control chondrocytes or
      cartilage, with the warfarin-inhibited enzyme as a pharmacological comparator, to
      identify sulfated species that accumulate on loss of activity; candidates then tested
      as direct substrates of recombinant enzyme.
  evidence:
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither the substrate nor function of the encoded warfarin-sensitive arylsulfatase
      has been identified and molecular analysis remains the only confirmatory diagnostic
      test.
    explanation: States the gap and its immediate diagnostic consequence.
- discussion_id: bcdp_entity_status
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#X-linked Chondrodysplasia Punctata 1
  - differential_diagnoses#Vitamin K deficiency and maternal autoimmune phenocopies of brachytelephalangic CDP
  prompt: >-
    Is "brachytelephalangic chondrodysplasia punctata" a disease, or a radiographic
    convergence point reached by an inherited sulfatase deficiency and by several
    unrelated maternal-fetal insults?
  rationale: >-
    This is a nosological question with practical teeth. The ISDS nosology lists the
    ARSL-related entity as a single row, and this dismech entry follows it - but the
    clinical literature reports that most patients meeting the clinical criteria have no
    ARSL variant, that examination cannot separate the genetic from the acquired cases, and
    in one report that the pattern "is most probably not a diagnostic entity". If that view
    is right, the useful dismech object might eventually be a grouping over the convergent
    causes rather than a disease entry per cause. dismech keeps the gene-defined entry
    because that is what the nosology lists and what MONDO:0010555 denotes, and records the
    acquired routes as differentials rather than as subtypes, but the boundary is not
    settled.
  evidence:
  - reference: PMID:32506814
    reference_title: "Maternal SLE and brachytelephalangic chondrodysplasia punctata in a patient with unrelated de novo RAF1 and SIX2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case shows that BCDP is most probably not a diagnostic entity and can be
      associated with various conditions associated with CDP including maternal SLE.
    explanation: States the position that the radiographic pattern is not a disease entity.
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study supports heterogeneity for CDPX1-like phenotypes and sorting these out
      will help to define the biological pathway and genetic contributors.
    explanation: >-
      The authors of the largest systematic series frame the heterogeneity of the clinical
      category as unresolved.
notes: >-
  Curated as its own dismech entry because the ISDS 2023 nosology lists it as its own row
  (NOS 23-0010) with its own gene and inheritance, and because it is mechanistically the
  most distant member of its group - the only one whose biochemical lesion is unsolved and
  the only one with a well-documented set of acquired phenocopies. The warfarin-embryopathy
  and maternal-autoimmune/vitamin-K phenocopies are deliberately kept as differential
  diagnoses rather than modelled as subtypes or as environmental entries on this file: they
  are not ARSL disorders, and folding them in would assert an identity that the literature
  is actively disputing. A member of the Chondrodysplasia_Punctata grouping.

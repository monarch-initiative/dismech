classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An X-linked Mendelian skeletal dysplasia. This Part is a particularly good fit
      here because the entity's central problem is the boundary between an inherited
      cause and an environmental/maternal one - the group of phenocopies that share its
      radiographic picture.
    evidence:
    - reference: PMID:20301713
      reference_title: "Chondrodysplasia Punctata 1, X-Linked."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CDPX1 is inherited in an X-linked manner."
      explanation: Confirms the Mendelian X-linked basis that places the entry in this Part.
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0010 "CDP, X-linked recessive, ARSE-related (brachytelephalangic type;
      CDPX1)" (MIM 302950). Carried forward from the 2019 revision (Mortier et al.,
      PMID:31633310), where the group was numbered 21. The nosology row names the gene
      ARSE, which is the previous HGNC symbol; the current symbol is ARSL and that is
      what this entry uses. Note that only the genetic entity is a nosology row - the
      warfarin-embryopathy, vitamin-K-deficiency, and maternal-autoimmune phenocopies
      share the radiographic pattern but are not inherited skeletal disorders and are
      correctly absent from the table.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010555
      label: X-linked chondrodysplasia punctata 1
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The dismech entry and the MONDO class denote the same entity: ARSL/ARSE-related
      X-linked recessive chondrodysplasia punctata. The acquired phenocopies that share
      its radiographic picture are deliberately excluded from both, and are handled here
      as differential diagnoses.

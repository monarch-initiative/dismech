prevalence:
- population: Genetically confirmed patients reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate is available. The published count of
    molecularly confirmed cases is the only quantitative handle, and it is small - the
    figure below is as of 2015.
  evidence:
  - reference: PMID:26526591
    reference_title: "Brachytelephalangic chondrodysplasia punctata caused by new small hemizygous deletion in a boy presenting with hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease is caused due to the loss of arylsulfatase E activity and only 55 patients
      with genetically confirmed disease have been reported so far.
    explanation: >-
      Gives the count of genetically confirmed cases, which is the closest available
      proxy for how rare the molecularly defined entity is.
- population: Patients meeting clinical CDPX1 criteria, proportion with an identified variant
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Two figures that look contradictory but are not: among patients in whom a variant is
    found, sequencing detects most and deletion/rearrangement analysis the rest; but
    among patients merely meeting clinical criteria, a large fraction have no ARSL
    variant at all. Both numbers matter for testing strategy, and the second is the
    reason the phenocopy group exists.
  evidence:
  - reference: PMID:26526591
    reference_title: "Brachytelephalangic chondrodysplasia punctata caused by new small hemizygous deletion in a boy presenting with hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 60-75 % of all patients the mutation in ARSE gene is detected by sequence
      analysis and in further 25 % of patients Xp deletions or rearrangements are
      causative and may be identified by classical chromosome studies.
    explanation: >-
      Establishes that a normal sequencing result does not exclude the diagnosis, since a
      quarter of causative lesions are deletions or rearrangements.
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the majority of patients evaluated have not had identifiable
      mutations in ARSE, and thus far 23 patients have been reported.
    explanation: >-
      Establishes that most clinically ascertained patients are variant-negative, which
      is the observation the phenocopy group explains.
progression:
- phase: Neonatal period - airway and radiographic presentation
  notes: >-
    The disorder presents in the newborn with stippled epiphyses and nasomaxillary
    hypoplasia, and the immediate clinical risk is airway rather than skeletal, since
    obligate nasal breathers with severe nasal hypoplasia may need stenting or oxygen.
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of respiratory difficulty as per ENT and/or pulmonologist including
      nasal stents and oxygen as needed.
    explanation: >-
      Identifies airway management as the acute intervention, consistent with a
      nasal-hypoplasia mechanism.
- phase: Childhood - radiographic improvement with persisting cervical spine risk
  notes: >-
    The skeletal findings improve by adulthood in most affected males, which is why the
    diagnosis is often missed or made late. Cervical spine instability runs against that
    trend and is the reason for interval flexion-extension imaging until growth is
    complete.
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most affected males have minimal morbidity and skeletal findings that
      improve by adulthood, some have significant medical problems including respiratory
      involvement, cervical spine stenosis and instability, mixed conductive and
      sensorineural hearing loss, and intellectual disability.
    explanation: >-
      States both the generally favourable trajectory and the specific serious
      complications that qualify it.
- phase: Later childhood and adulthood - reconstructive and functional needs
  notes: >-
    Severe maxillary hypoplasia or retrognathia may need reconstruction in older
    individuals, and hearing loss requires ongoing management. The skeletal dysplasia
    itself becomes radiographically quiet.
  evidence:
  - reference: PMID:20301713
    reference_title: "Chondrodysplasia Punctata 1, X-Linked."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe maxillary hypoplasia or maxillary retrognathia may require reconstructive
      surgery in older individuals.
    explanation: States the later reconstructive need.
pathophysiology:
- name: ARSL Arylsulfatase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Hemizygous loss-of-function variants in ARSL (formerly ARSE) abolish a
    heat-labile arylsulfatase activity localized to Xp22.3. The gene was found by
    positional cloning of the CDPX region, and the enzyme deficiency was demonstrated
    directly in patients carrying deletions spanning that region - so the enzymatic
    lesion is established even though what the enzyme normally does is not.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    gene:
      preferred_term: ARSL
      term:
        id: hgnc:719
        label: ARSL
    description: >-
      Hemizygous germline point mutations, and in about a quarter of molecularly solved
      cases Xp deletions or rearrangements. Heterozygous females are carriers and have
      not so far been reported as affected.
  molecular_functions:
  - preferred_term: arylsulfatase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004065
      label: arylsulfatase activity
  evidence:
  - reference: PMID:7720070
    reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Point mutations in one of these genes were identified in five patients with CDPX."
    explanation: Establishes the gene assignment in patients.
  - reference: PMID:7720070
    reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A deficiency of a heat-labile arylsulfatase activity was demonstrated in patients
      with deletions spanning the CDPX region.
    explanation: >-
      Demonstrates the enzyme deficiency itself in patients, not merely the genotype.
  downstream:
  - target: Unidentified Sulfated Substrate Accumulates or Fails to Be Processed
    description: >-
      The immediate biochemical consequence of losing a sulfatase is that its substrate
      is not desulfated. In this case that substrate has never been identified, so the
      node is a placeholder for a real but uncharacterized step.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18348268
      reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neither the substrate nor function of the encoded warfarin-sensitive arylsulfatase
        has been identified and molecular analysis remains the only confirmatory
        diagnostic test.
      explanation: >-
        States directly that the substrate is unknown, which is why this node cannot be
        specified further.
- name: Unidentified Sulfated Substrate Accumulates or Fails to Be Processed
  biological_scale: MOLECULAR
  description: >-
    An explicitly unresolved node. ARSL's physiological substrate has not been
    identified, so the step between the enzyme deficiency and the cartilage phenotype is
    empty. It is modelled rather than omitted because the shape of the gap matters: the
    warfarin sensitivity of the enzyme and the vitamin-K-deficiency phenocopies both
    point towards a vitamin-K-dependent process, and that is the leading hypothesis for
    what should occupy this node.
  evidence:
  - reference: PMID:18348268
    reference_title: "Clinical and molecular analysis of arylsulfatase E in patients with brachytelephalangic chondrodysplasia punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study supports heterogeneity for CDPX1-like phenotypes and sorting these out
      will help to define the biological pathway and genetic contributors.
    explanation: >-
      The authors frame identification of the biological pathway as still outstanding.
  downstream:
  - target: Abnormal Cartilage Calcification and Endochondral Ossification
    description: >-
      Whatever the missing step is, its endpoint is disordered mineralization of
      developing bone and cartilage - the feature by which the disorder was originally
      characterized.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:7720070
      reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        X-linked recessive chondrodysplasia punctata (CDPX) is a congenital defect of
        bone and cartilage development characterized by aberrant bone mineralization,
        severe underdevelopment of nasal cartilage, and distal phalangeal hypoplasia.
      explanation: >-
        Defines the phenotype as aberrant bone mineralization with the specific
        nasal-cartilage and distal-phalangeal pattern.
- name: Warfarin-Sensitive Enzyme Activity
  biological_scale: MOLECULAR
  description: >-
    Recombinant ARSL expressed in COS cells yields an arylsulfatase activity that is
    inhibited by warfarin. This is not a feature of the disease so much as the bridge
    between the genetic disorder and its most important phenocopy: a coumarin taken by
    the mother during a critical window can pharmacologically produce the same enzyme
    deficiency the mutation produces genetically. It is modelled as its own node because
    it is the mechanistic claim that unifies CDPX1 with warfarin embryopathy and, more
    speculatively, with the vitamin-K-deficiency phenocopies.
  evidence:
  - reference: PMID:7720070
    reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of this gene in COS cells resulted in a heat-labile arylsulfatase
      activity that is inhibited by warfarin.
    explanation: >-
      Demonstrates the warfarin sensitivity of the enzyme in a heterologous expression
      system.
  downstream:
  - target: ARSL Arylsulfatase Deficiency
    description: >-
      Pharmacological inhibition reaches the same molecular endpoint as the genetic
      lesion. The authors advance this as the mechanism of warfarin embryopathy, in
      which a fetus with an intact ARSL gene nonetheless has deficient enzyme activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7720070
      reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data indicate that CDPX is caused by an inherited deficiency of a novel
        sulfatase and suggest that warfarin embryopathy might involve drug-induced
        inhibition of the same enzyme.
      explanation: >-
        States the proposed convergence of the genetic and the drug-induced routes on one
        enzyme. The authors' own hedge ("might involve") is preserved here.
- name: Abnormal Cartilage Calcification and Endochondral Ossification
  biological_scale: TISSUE
  description: >-
    Punctate calcification appears in epiphyseal and other cartilage, with a
    distribution that in this disorder is weighted towards the nasal cartilage and the
    distal phalanges rather than towards the proximal long bones. That regional
    weighting is what separates the brachytelephalangic pattern from the rhizomelic one
    radiographically, and it is unexplained.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: bone mineralization
    modifier: ABNORMAL
    term:
      id: GO:0030282
      label: bone mineralization
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:26526591
    reference_title: "Brachytelephalangic chondrodysplasia punctata caused by new small hemizygous deletion in a boy presenting with hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked recessive type chondrodysplasia punctata (CDPX1) is a congenital disorder
      of cartilage and bone development with typical findings of stippled epyphises,
      nasomaxillary hypoplasia and short distal phalanges in a male patient.
    explanation: States the cartilage-and-bone-development lesion and its three typical findings.
  downstream:
  - target: Epiphyseal Stippling
    causal_link_type: DIRECT
    description: Punctate calcification of epiphyseal cartilage is the defining radiographic finding.
  - target: Nasomaxillary Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Underdevelopment of the nasal cartilage and maxilla, the craniofacial expression of
      the same cartilage lesion.
  - target: Brachytelephalangy
    causal_link_type: DIRECT
    description: Shortening of the distal phalanges.
  - target: Cervical Spine Stenosis and Instability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Disordered ossification of the cervical vertebrae and their ligamentous attachments.
    description: >-
      The cervical spine is the site where the dysplasia has its most dangerous
      consequence, and unlike the other skeletal findings it does not improve with age.
- name: Nasomaxillary Hypoplasia
  biological_scale: TISSUE
  description: >-
    Severe underdevelopment of the nasal cartilage with maxillary hypoplasia, producing
    the flat midface and depressed nasal bridge that are the clinical signature of the
    brachytelephalangic pattern. In the newborn it is also a mechanical airway problem.
  evidence:
  - reference: PMID:7720070
    reference_title: "A cluster of sulfatase genes on Xp22.3: mutations in chondrodysplasia punctata (CDPX) and implications for warfarin embryopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked recessive chondrodysplasia punctata (CDPX) is a congenital defect of bone
      and cartilage development characterized by aberrant bone mineralization, severe
      underdevelopment of nasal cartilage, and distal phalangeal hypoplasia.
    explanation: Names severe underdevelopment of nasal cartilage as a defining feature.
  downstream:
  - target: Hypoplasia of the Maxilla
    causal_link_type: DIRECT
    description: The maxillary component of the midface hypoplasia.
  - target: Respiratory Distress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Nasal airway narrowing in an obligate nasal breather.
    description: >-
      Nasal-airway compromise in infancy, the reason nasal stents and supplemental oxygen
      appear in the management recommendations.

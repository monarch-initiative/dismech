name: X-linked Chondrodysplasia Punctata 1
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  X-linked recessive chondrodysplasia punctata type 1 (CDPX1, brachytelephalangic
  chondrodysplasia punctata) is caused by hemizygous loss-of-function variants in ARSL
  (arylsulfatase L, formerly ARSE) at Xp22.33, and presents in males with the triad of
  stippled epiphyses, shortening of the distal phalanges, and nasomaxillary hypoplasia.
  It is the outlier of its skeletal nosology group in a specific and instructive way:
  every other member has a solved biochemistry, whereas here the causal gene has been
  known since 1995 while the enzyme's physiological substrate and function remain
  unidentified, so there is no metabolite assay and molecular testing is the only
  confirmatory test. What the enzyme is known to have is a pharmacological property -
  the recombinant arylsulfatase activity is inhibited by warfarin - and that single
  observation carries most of the disorder's explanatory weight, because it is the
  reason a maternal coumarin exposure produces a virtually identical embryopathy. That
  convergence has since widened: the same brachytelephalangic radiographic picture
  arises from early-gestation vitamin K deficiency and from maternal autoimmune disease,
  and in the largest systematic series most patients meeting clinical criteria for CDPX1
  had no identifiable ARSL variant while several instead had a maternal condition. The
  practical consequence is that the radiographic pattern names a convergence point
  rather than a diagnosis, and one author group argues on that basis that
  brachytelephalangic CDP is probably not a diagnostic entity at all. Clinically most
  affected males have minimal morbidity and skeletal findings that improve into
  adulthood, but a minority have serious problems - nasal-airway and respiratory
  compromise in infancy, and cervical spine stenosis and instability, which is the
  finding that makes this an entry with a real surveillance and anaesthetic-safety
  consequence.
synonyms:
- CDPX1
- Brachytelephalangic chondrodysplasia punctata
- X-linked recessive chondrodysplasia punctata
- Arylsulfatase E deficiency
- ARSL-related chondrodysplasia punctata
- Chondrodysplasia punctata 1, X-linked recessive

- name: Reduced Alanyl-tRNA Charging
  description: >-
    Reduced aminoacylation of tRNA-Ala lowers the supply of charged tRNA-Ala
    for cytoplasmic translation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cytoplasmic alanyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006419
      label: alanyl-tRNA aminoacylation
  downstream:
  - target: Deficient CNS Myelination
  evidence:
  - reference: PMID:28493438
    reference_title: "Deficient activity of alanyl-tRNA synthetase underlies an autosomal recessive syndrome of progressive microcephaly, hypomyelination, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutations decrease aminoacylation efficiency by 70%-90%."
    explanation: Direct measurement of reduced aminoacylation by the recessive variants.
  - reference: PMID:34446925
    reference_title: "Expanded phenotype of AARS1-related white matter disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AlaRS activity was significantly reduced in five affected individuals with both early infantile-onset and late-onset phenotypes."
    explanation: Reduced activity measured in patient fibroblasts across both recessive presentations.
  - reference: PMID:37106376
    reference_title: "An AARS1 variant identified to cause adult-onset leukoencephalopathy with neuroaxonal spheroids and pigmented glia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In aminoacylation and misaminoacylation assays, the AlaRS T606I variant showed deficient aminoacylation efficiency"
    explanation: The adult-onset recessive variant also reduces aminoacylation.
- name: Defective tRNA-Ala Editing
  description: >-
    AlaRS hydrolyses mischarged tRNA-Ala (for example Ser-tRNA-Ala). Loss of
    editing raises mistranslation at alanine codons. In the reported human
    case this applies to one variant only; the downstream consequence comes
    from the sticky mouse.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: aminoacyl-tRNA metabolism involved in translational fidelity
    modifier: DECREASED
    term:
      id: GO:0106074
      label: aminoacyl-tRNA metabolism involved in translational fidelity
  downstream:
  - target: Neuronal Misfolded Protein Accumulation
  evidence:
  - reference: PMID:28493438
    reference_title: "Deficient activity of alanyl-tRNA synthetase underlies an autosomal recessive syndrome of progressive microcephaly, hypomyelination, and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.Tyr690Leufs*3 mutation also abolished editing activity required for hydrolyzing misacylated tRNAs, thereby increasing errors during aminoacylation."
    explanation: One patient variant abolishes editing.
- name: Neuronal Misfolded Protein Accumulation
  description: >-
    In the sticky mouse, an editing-domain Aars missense variant causes
    accumulation of misfolded proteins, chaperone upregulation and the unfolded
    protein response in Purkinje cells, followed by their death. Whether this
    occurs in human AARS1 disease has not been shown.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: response to unfolded protein
    modifier: INCREASED
    term:
      id: GO:0006986
      label: response to unfolded protein
  evidence:
  - reference: PMID:16906134
    reference_title: "Editing-defective tRNA synthetase causes protein misfolding and neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These accumulations are accompanied by upregulation of cytoplasmic protein chaperones and by induction of the unfolded protein response."
    explanation: Mouse evidence that an AlaRS editing defect causes neuronal protein misfolding.
- name: Deficient CNS Myelination
  description: >-
    Recessive AARS1 disease shows persistently deficient myelination on MRI,
    or a progressive leukoencephalopathy in later-onset cases. Oligodendrocytes
    are bound because CNS myelination is their function; no oligodendrocyte-level
    data exist, and the cellular step between reduced charging and the myelin
    defect has not been established.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: central nervous system myelination
    modifier: DECREASED
    term:
      id: GO:0022010
      label: central nervous system myelination
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  downstream:
  - target: CNS hypomyelination
  evidence:
  - reference: PMID:25817015
    reference_title: "Loss-of-function alanyl-tRNA synthetase mutations cause an autosomal-recessive early-onset epileptic encephalopathy with persistent myelination defect."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal-recessive AARS mutations identified in the individuals described here, however, cause a severe infantile epileptic encephalopathy with a central myelin defect and peripheral neuropathy, demonstrating that defects of alanyl-tRNA charging can result in a wide spectrum of disease manifestations."
    explanation: >-
      The authors attribute the central myelin defect to reduced alanyl-tRNA
      charging; this is an inference from genetics and enzyme activity, not a
      measurement in oligodendrocytes.
- name: Neuroaxonal Degeneration with Spheroids
  description: >-
    Applies to the adult-onset HDLS2 and recessive ALSP presentations. They are marked by
    neuroaxonal degeneration with spheroids, ending in white matter
    liquefaction in the Swedish kindred. How AARS1 variants produce it is
    unknown.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  downstream:
  - target: Central nervous system axonal spheroid
  evidence:
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain pathology in one case after 10 years of disease duration showed the end stage of the disease to be characterized by widespread liquefaction of the white matter leaving only some macrophages and glial cells behind the centrifugally progressing front."
    explanation: Neuropathology of end-stage HDLS-S.
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Swedish type Hereditary Diffuse Leukoencephalopathy with Spheroids (HDLS-S) is a severe adult-onset leukoencephalopathy with the histopathological hallmark of neuraxonal degeneration with spheroids, described in a large family with a dominant inheritance pattern."
    explanation: Neuraxonal degeneration with spheroids is the defining lesion.

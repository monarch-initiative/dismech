has_subtypes:
- name: DEE29
  display_name: Developmental and epileptic encephalopathy 29 (infantile-onset, recessive)
  description: >-
    The predominant presentation of biallelic AARS1 variants: infantile-onset
    refractory epileptic encephalopathy with persistently deficient myelination,
    progressive microcephaly, spasticity and peripheral neuropathy.
  subtype_term:
    preferred_term: developmental and epileptic encephalopathy 29
    term:
      id: MONDO:0014593
      label: developmental and epileptic encephalopathy, 29
  evidence:
  - reference: PMID:25817015
    reference_title: "Loss-of-function alanyl-tRNA synthetase mutations cause an autosomal-recessive early-onset epileptic encephalopathy with persistent myelination defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three individuals (two siblings and an unrelated individual) with severe infantile epileptic encephalopathy, clubfoot, absent deep tendon reflexes, extrapyramidal symptoms, and persistently deficient myelination on MRI."
    explanation: Index description of the recessive infantile-onset presentation.
- name: Later-onset recessive
  display_name: Later-onset recessive AARS1 leukoencephalopathy
  description: >-
    Biallelic AARS1 disease with onset after the first year of life and a
    progressive, posterior-predominant leukoencephalopathy that extends to the
    frontal white matter, with rapid clinical decline. No separate MONDO term.
  evidence:
  - reference: PMID:34446925
    reference_title: "Expanded phenotype of AARS1-related white matter disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second (n = 4) was a later-onset disorder, where disease onset occurred after the first year of life and was characterized on neuroimaging by a progressive posterior predominant leukoencephalopathy evolving to include the frontal white matter."
    explanation: Defines the later-onset recessive group in an 11-patient cohort.
- name: HDLS2
  display_name: Hereditary diffuse leukoencephalopathy with spheroids 2 (adult-onset)
  description: >-
    Adult-onset, rapidly progressive leukoencephalopathy with neuroaxonal
    spheroids, described as dominant in the Swedish HDLS kindred carrying the
    heterozygous p.Cys152Phe aminoacylation-domain variant. This rests on a
    single family, and the authors call the variant the probable cause. Distinct from
    the CSF1R-related disorder curated in
    Hereditary_Diffuse_Leukoencephalopathy_with_Spheroids.
  subtype_term:
    preferred_term: hereditary diffuse leukoencephalopathy with spheroids 2
    term:
      id: MONDO:0030634
      label: leukoencephalopathy, hereditary diffuse, with spheroids 2
  evidence:
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report the results from exome sequencing analyses indicating the p.Cys152Phe variant in the alanyl tRNA synthetase (AARS) gene as the probable cause of this disease."
    explanation: Assigns the Swedish HDLS kindred to AARS1.
- name: Adult-onset recessive ALSP
  display_name: Adult-onset recessive AARS1 leukoencephalopathy with spheroids and pigmented glia
  description: >-
    One consanguineous family with a homozygous p.Thr606Ile variant and
    heterozygous unaffected relatives: onset in the early twenties with gait
    difficulty, then dysarthria, visual loss and cognitive decline, with axonal
    spheroids on biopsy. The authors treat it as a recessive entity separate
    from the dominant Swedish kindred. No separate MONDO term; single family.
  evidence:
  - reference: PMID:37106376
    reference_title: "An AARS1 variant identified to cause adult-onset leukoencephalopathy with neuroaxonal spheroids and pigmented glia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we associated a recessive AARS1 variant with ALSP (AARS1-AR-ALSP)."
    explanation: Defines the recessive adult-onset spheroid presentation.
- name: TTD8
  display_name: Trichothiodystrophy 8, nonphotosensitive
  curated_in: Trichothiodystrophy
  description: >-
    Biallelic AARS1 variants that destabilize AlaRS cause non-photosensitive
    trichothiodystrophy. MONDO places TTD8 under AARS1-related
    leukoencephalopathy, so the row is kept here for discoverability, but its
    hair, skin and developmental phenotypes are curated with the other
    non-photosensitive TTD genes in Trichothiodystrophy.
  subtype_term:
    preferred_term: trichothiodystrophy 8, nonphotosensitive
    term:
      id: MONDO:0030517
      label: trichothiodystrophy 8, nonphotosensitive
  evidence:
  - reference: PMID:33909043
    reference_title: "Protein instability associated with AARS1 and MARS1 mutations causes trichothiodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identify alanyl-tRNA synthetase 1 and methionyl-tRNA synthetase 1 variants as new gene defects that cause NPS-TTD."
    explanation: Establishes AARS1 as a non-photosensitive TTD gene.

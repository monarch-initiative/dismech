discussions:
- discussion_id: aars1_dominant_hdls_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Neuroaxonal Degeneration with Spheroids
  prompt: >-
    How does a single heterozygous aminoacylation-domain variant (p.Cys152Phe)
    cause adult-onset spheroid leukoencephalopathy, when heterozygous carriers
    in the recessive adult-onset family are unaffected?
  rationale: >-
    The variant did not change splicing or brain expression, its effect on
    AlaRS activity has not been reported, and the dominant presentation rests
    on one family. In the recessive ALSP family the parents and brother carry
    the variant heterozygously (PMID:37106376). A dominant-negative effect on
    the AlaRS dimer is possible but untested.
- discussion_id: aars1_sticky_mouse_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Neuronal Misfolded Protein Accumulation
  - pathophysiology#Deficient CNS Myelination
  prompt: >-
    Does the editing-defect mechanism shown in the sticky mouse operate in
    human AARS1 leukoencephalopathy, which is a white matter disease and is
    mainly caused by loss of aminoacylation?
  rationale: >-
    The sticky mouse shows Purkinje cell death from mistranslation, not
    hypomyelination, and only one human variant has been shown to abolish
    editing. No model carrying a recessive human variant, and no
    oligodendrocyte-specific model, has been reported.
animal_models:
- name: Sticky mouse (Aars editing-domain missense)
  species: Mouse
  genotype: Aars sti/sti (editing-domain missense)
  publication: PMID:16906134
  description: >-
    The sticky mouse carries an editing-domain Aars missense variant and
    develops Purkinje cell loss and ataxia. It models the editing defect, not
    the hypomyelination of the human disease.
  modeled_mechanisms:
  - target: Neuronal Misfolded Protein Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Models an editing defect in cerebellar neurons; human AARS1
      leukoencephalopathy is mainly an aminoacylation defect with white-matter
      disease, and only one human variant has been shown to abolish editing.
    evidence:
    - reference: PMID:16906134
      reference_title: "Editing-defective tRNA synthetase causes protein misfolding and neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report that the mouse sticky mutation, which causes cerebellar Purkinje cell loss and ataxia, is a missense mutation in the editing domain of the alanyl-tRNA synthetase gene that compromises the proofreading activity of this enzyme during aminoacylation of tRNAs."
      explanation: Defines the model and its editing defect.

pathophysiology:
- name: Biallelic AARS1 Loss of Function
  description: >-
    Recessive AARS1 variants reduce alanyl-tRNA synthetase function, through
    reduced aminoacylation activity, reduced protein abundance, or both.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AARS1

name: AARS1-related Leukoencephalopathy
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
description: >-
  AARS1-related leukoencephalopathy is central nervous system white-matter
  disease caused by pathogenic variants in AARS1, which encodes cytoplasmic
  alanyl-tRNA synthetase (AlaRS). AlaRS charges tRNA-Ala with alanine and
  proofreads (edits) mischarged tRNA-Ala. The spectrum has two inheritance
  arms. Biallelic loss-of-function variants cause an infantile-onset epileptic
  encephalopathy with persistently deficient myelination, progressive
  microcephaly and spasticity (developmental and epileptic encephalopathy 29),
  together with a later-onset progressive leukoencephalopathy and a
  non-photosensitive trichothiodystrophy presentation (curated in
  Trichothiodystrophy). A heterozygous
  aminoacylation-domain variant segregates with a rapidly progressive
  adult-onset leukoencephalopathy with axonal spheroids in the Swedish HDLS
  kindred (hereditary diffuse leukoencephalopathy with spheroids 2). In the
  recessive cases studied, alanine-tRNA charging activity is reduced, and some
  variants also destabilize the protein or abolish editing. Dominant AARS1
  axonal neuropathy (Charcot-Marie-Tooth disease type 2N) is a separate
  allelic disorder curated in Charcot-Marie-Tooth_Disease_Type_2. There is no
  disease-modifying therapy.

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "do not influence the decision to use CRS-specific interventions such as anti-cytokine therapy and corticosteroids"
    explanation: >-
      Names corticosteroids as one of the CRS-specific interventions, which is
      what establishes this as a treatment of the syndrome rather than
      supportive care.
  - reference: PMID:29025771
    reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty of 53 patients diagnosed with neurotoxicity (38%) received tocilizumab (4–8 mg/kg IV) and dexamethasone"
    explanation: >-
      Documents dexamethasone in actual use for this indication, and is the
      source for the specific agent bound above.
  - reference: PMID:30592986
    reference_title: "ASTCT Consensus Grading for Cytokine Release Syndrome and Neurologic Toxicity Associated with Immune Effector Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Though prospective clinical trials evaluating the timing of intervention are lacking, retrospective analyses suggest that this is not the case, at least when such therapies are implemented after CRS is well under way"
    explanation: >-

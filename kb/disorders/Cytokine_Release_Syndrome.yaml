- name: Anakinra
  description: >-
    IL-1 receptor antagonist. In the humanised mouse model it abolished both
    CRS and the delayed neurotoxicity that IL-6 receptor blockade did not
    prevent, which is the structural argument for IL-1 acting upstream of, or
    in parallel to, IL-6 in the neurological arm. Human use for this
    indication is not established by the cited work.

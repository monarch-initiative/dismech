animal_models:
- name: Humanised mouse model of CAR T cell CRS and neurotoxicity
  species: Mouse
  genotype: Human haematopoietic-stem-cell-engrafted mice bearing a high leukaemia burden, treated with CD19-directed CAR T cells
  publication: PMID:29808007
  description: >-
    The model the monocyte and interleukin-1 results in this entry rest on. It
    reproduces fever and raised interleukin-6 on CAR-T-mediated tumour
    clearance, and allows the host myeloid compartment to be removed or
    blocked independently of the infused cells.
  modeled_mechanisms:
  - target: Myeloid Recruitment and Cytokine Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Monocyte depletion prevented the syndrome, which is the loss-of-function
      evidence that this node is necessary rather than merely present.
    limitations: >-
      The myeloid compartment is human cells engrafted in a mouse, so its
      cytokine output and its interaction with mouse stroma and endothelium
      need not match a patient's. Tumour burden is set experimentally and is
      higher than in most treated patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The responding monocytes and CAR T cells are human but the vasculature,
        stroma and central nervous system they act in are mouse, so the
        amplification step is human-on-mouse rather than human-on-human.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The model requires a high leukaemia burden to produce the syndrome,
        whereas CRS also occurs in patients with low disease burden.
    readouts:
    - name: Serum interleukin-6 concentration
      target: Myeloid Recruitment and Cytokine Amplification
      direction: INCREASED
      interpretation: Reports the cytokine output of the myeloid compartment this node describes.
      evidence:
      - reference: PMID:29808007
        reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CAR T cell-mediated clearance of cancer triggered high fever and elevated IL-6 levels, which are hallmarks of CRS"
        explanation: Reports the interleukin-6 measurement, with fever, on tumour clearance.
    evidence:
    - reference: PMID:29808007
      reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Human monocytes were the major source of IL-1 and IL-6 during CRS."
      explanation: >-
        Supports treating this model as informative for the myeloid
        amplification node: it is where the attribution was made.
  - target: Blood-Brain Barrier Disruption and Pericyte Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The model produces a delayed lethal neurotoxicity that interleukin-6
      receptor blockade does not prevent and interleukin-1 receptor
      antagonism does, which is the separation between the two arms that this
      node exists to carry. It does not reproduce the mechanism the node
      describes.
    limitations: >-
      The model's neurotoxicity is characterised by meningeal inflammation,
      not by the pericyte and endothelial injury this node is built on, and it
      is delayed and lethal where the human syndrome is usually reversible. So
      the model supports the existence and the interleukin-1 dependence of a
      neurological arm, not the pericyte account of it.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: INVALIDATING
      description: >-
        The pericyte stress and blood-brain barrier disruption this node
        asserts are not what the model reports; its lesion is meningeal
        inflammation. The model therefore cannot be used as evidence for this
        node's mechanism, only for the arm's existence.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The model's neurotoxicity is delayed and lethal, whereas the human
        syndrome resolved by day 28 in all but the fatal cases of the cited
        cohort.
    evidence:
    - reference: PMID:29808007
      reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "tocilizumab failed to protect mice from delayed lethal neurotoxicity, characterized by meningeal inflammation"
      explanation: >-
        Both the result that makes the model informative about a separable
        neurological arm, and the statement of the lesion that makes its
        fidelity to this node low.
- name: TNF-disrupted humanised xenochimera model of CRS severity
  species: Mouse
  genotype: Humanised xenochimeras with selective disruption of TNF signalling, treated with CAR T cells
  publication: PMID:42627932
  description: >-
    The model behind the emerging hypothesis that effector-derived tumour
    necrosis factor is the upstream initiator of myeloid amplification.
  modeled_mechanisms:
  - target: Effector Cytokine Release
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Selective disruption of TNF signalling is the perturbation that places
      effector-derived TNF upstream of the host macrophage compartment.
    limitations: >-
      Severity and lethality are read out in humanised mice, and no human
      intervention study has tested TNF blockade for CRS, so the position of
      TNF in the human syndrome is inferred from this model.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Severity and lethality are mouse endpoints standing in for human CRS
        grade, which is defined on fever, vasopressor requirement and oxygen
        requirement.
    evidence:
    - reference: PMID:42627932
      reference_title: "CAR T cell-derived TNF is an early determinant of cytokine release syndrome severity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By selectively disrupting tumor necrosis factor (TNF) signaling in a mouse model of CRS"
      explanation: >-
        Names the perturbation this link records.
discussions:
- discussion_id: crs_neurotoxicity_mechanism_distinct_from_crs
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Blood-Brain Barrier Disruption and Pericyte Stress
  prompt: >-
    What mechanism accounts for the neurological arm of immune effector cell
    toxicity, given that it follows CRS but does not respond to IL-6 receptor
    blockade?
  rationale: >-
    The consensus panel states that the neurotoxicity syndrome has unclear
    pathophysiology distinct from CRS, and that it does not usually respond to
    tocilizumab. The endothelial and pericyte account recorded in this entry
    is a candidate, supported by one detailed clinical and autopsy series plus
    cell-culture work; the IL-1 result that separates the two arms is from a
    mouse model. So the entry records a vascular mechanism for the systemic
    syndrome with reasonable confidence and the neurological arm as open.
    Resolving it bears directly on whether IL-1 blockade should be preferred
    over IL-6 blockade in patients.
  evidence:
  - reference: PMID:30592986
    reference_title: "ASTCT Consensus Grading for Cytokine Release Syndrome and Neurologic Toxicity Associated with Immune Effector Cells."

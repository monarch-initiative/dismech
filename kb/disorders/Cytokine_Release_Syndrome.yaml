name: Cytokine Release Syndrome
creation_date: "2026-11-06T00:00:00Z"
category: Complex
categories:
- Treatment-Related Disorder
- Adverse Drug Reaction
- Immune Dysregulation
synonyms:
- CRS
- cytokine release syndrome
- immune effector cell-associated cytokine release syndrome
description: >-
  Cytokine release syndrome is a systemic hyperinflammatory toxicity of immune
  therapies that activate or engage T cells and other immune effector cells,
  most prominently chimeric antigen receptor (CAR) T cell products and T cell
  engaging bispecific antibodies. Engagement of target antigen activates the
  effector cells, which release tumour necrosis factor;
  these recruit and activate host monocytes and macrophages, and in a
  humanised mouse model that myeloid compartment rather than the engineered
  cells is the dominant source of the interleukin-1 and interleukin-6 that
  drive the systemic syndrome. The
  resulting hypercytokinemia activates vascular endothelium throughout the
  body, producing capillary leak, coagulopathy and distributive shock. Fever is
  obligatory at onset; hypotension, hypoxia and end-organ dysfunction follow in
  more severe grades. Neurological toxicity, graded separately as immune
  effector cell-associated neurotoxicity syndrome, usually follows CRS and
  responds differently to treatment, and its pathophysiology is not settled.
  The syndrome is the engineered-therapy route into the conserved cytokine
  storm mechanism, and is substantially reversible when recognised and treated.
parents:
- Iatrogenic condition
- Systemic inflammatory response syndrome
disease_term:
  preferred_term: cytokine release syndrome
  term:
    id: MONDO:0600008
    label: cytokine release syndrome
pathophysiology:
- name: Effector Cell Engagement of Target Antigen
  biological_scale: CELLULAR
  conforms_to: cytokine_storm_hyperinflammation#Uncontrolled Immune Activation Trigger
  description: >-
    The initiating event is engagement of target antigen by an infused or
    redirected immune effector cell. Signalling through the chimeric antigen
    receptor, or through a bispecific antibody bridging the effector cell to its
    target, drives effector cell proliferation, cytokine secretion and target
    cell lysis. The magnitude of this engagement scales with antigen burden
    and with infused cell dose. Host properties matter too: pre-existing
    neurological comorbidity was an independent risk factor for the
    neurological arm in multivariable analysis, so this node is not the only
    determinant of severity.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:29025771
    reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariable analysis showed that preexisting neurologic comorbidities (p=0.0023)"
    explanation: >-
      Source for this node's statement that host properties contribute
      alongside antigen burden and cell dose. The multivariable model is of
      neurotoxicity risk, not of CRS magnitude.
  downstream:
  - target: Effector Cytokine Release
    causal_link_type: DIRECT
    description: >-
      Receptor signalling on antigen engagement is what induces the effector
      cytokine output; without target engagement the infused cells do not
      produce the syndrome.
    evidence:
    - reference: PMID:29025771
      reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "When CD19-specific CAR-T cells encounter CD19+ target cells in vivo, signaling through the CAR induces CAR-T cell proliferation, cytokine secretion, and target cell lysis"
      explanation: >-
        States the causal step from antigen engagement to cytokine secretion.
        Quoted from the publication's introduction, where it restates
        established clinical pharmacology rather than this study's own result.
- name: Effector Cytokine Release
  biological_scale: CELLULAR
  description: >-
    Activated effector cells secrete tumour necrosis factor. This is an
    upstream signal of the syndrome rather than one of its dominant
    mediators: it acts on the host myeloid compartment, which then supplies
    the interleukin-1 and interleukin-6 that produce the systemic illness.
    Selective disruption of effector-derived TNF in a mouse model reduces
    macrophage accumulation and host cytokine induction and changes CRS
    severity, which places TNF upstream of the myeloid amplifier. Interferon
    gamma and GM-CSF are also described as effector cytokines in CRS, and
    interferon gamma is measured at high concentration in serum and
    cerebrospinal fluid, but none of the sources cited here attributes its
    production to the effector cells specifically, so no such process is bound
    on this node.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: tumor necrosis factor production
    modifier: INCREASED
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  evidence:
  - reference: PMID:42627932
    reference_title: "CAR T cell-derived TNF is an early determinant of cytokine release syndrome severity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CAR T cell-derived TNF promotes the accumulation of pro-inflammatory monocyte-derived macrophages at the tumor site"
    explanation: >-
      Attributes TNF production to the effector cells themselves, which is the
      claim this node and its bound process make.
  - reference: PMID:42500657
    reference_title: "Dual Inhibition of TNF-α and IL-6R mitigates cytokine release syndrome via protection of endothelial integrity and reduction of organ damage in mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TNF-α drives early macrophage activation and endothelial injury, whereas IL-6 amplifies systemic inflammation."
    explanation: >-
      An independent group's statement of the same division of labour between
      the effector cytokine of this node and the myeloid amplifier
      downstream.
  downstream:
  - target: Myeloid Recruitment and Cytokine Amplification
    causal_link_type: DIRECT
    hypothesis_groups:
    - tnf_upstream_of_myeloid_amplification
    description: >-
      Effector-derived TNF drives accumulation of pro-inflammatory
      monocyte-derived macrophages at the tumour site and induces host IL-6 and
      IL-1 beta, making this edge the link between the engineered cell and the
      host amplifier.
    evidence:
    - reference: PMID:42627932
      reference_title: "CAR T cell-derived TNF is an early determinant of cytokine release syndrome severity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CAR T cell-derived TNF promotes the accumulation of pro-inflammatory monocyte-derived macrophages at the tumor site and the induction of host-derived cytokines including IL-6 and IL-1β"
      explanation: >-
        Directly supports the edge: effector-cell TNF causes the myeloid
        accumulation and host cytokine induction of the downstream node.
- name: Myeloid Recruitment and Cytokine Amplification
  biological_scale: CELLULAR
  conforms_to: cytokine_storm_hyperinflammation#Unrestrained Myeloid Cytokine Amplification
  description: >-
    Host monocytes and macrophages, not the engineered effector cells, are the
    major source of the interleukin-1 and interleukin-6 that drive the
    syndrome. In a humanised mouse model recapitulating CRS, depleting
    monocytes prevented the syndrome altogether. This node is why an IL-6
    receptor antagonist and an IL-1 receptor antagonist both work on the
    syndrome, and why neither acts on the infused product.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: positive regulation of interleukin-6 production
    modifier: INCREASED
    term:
      id: GO:0032755
      label: positive regulation of interleukin-6 production
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  evidence:
  - reference: PMID:29808007
    reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Human monocytes were the major source of IL-1 and IL-6 during CRS."
    explanation: >-
      Establishes the host myeloid compartment, rather than the infused cells,
      as the dominant source of the two cytokines that drive the syndrome.
  - reference: PMID:29808007
    reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the syndrome was prevented by monocyte depletion or by blocking IL-6 receptor with tocilizumab"
    explanation: >-
      Loss-of-function support for this node being necessary: removing the
      monocyte compartment abolishes the syndrome.
  downstream:
  - target: Systemic Hypercytokinemia
    causal_link_type: DIRECT
    description: >-
      Myeloid cytokine output escapes local control and becomes the systemic
      cytokine elevation that produces the clinical syndrome.
- name: Systemic Hypercytokinemia
  biological_scale: ORGANISM
  conforms_to:
  - "cytokine_storm_hyperinflammation#IL-6-Driven Systemic Cytokine Storm"
  - "il6_hypercytokinemia#Sustained Interleukin-6 Oversupply"
  description: >-
    Circulating cytokine concentrations rise far above physiological range,
    with interleukin-6 the dominant systemic mediator. At this point the
    cytokine output, rather than whatever provoked it, is the proximate cause
    of illness, which is the sense in which the consensus definition calls CRS
    a supraphysiologic response. Rapid clinical stabilisation on IL-6 receptor
    blockade is the clinical argument that this node is load-bearing rather
    than merely correlated.
  biological_processes:
  - preferred_term: interleukin-6 production
    modifier: INCREASED
    term:
      id: GO:0032635
      label: interleukin-6 production
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:30592986
    reference_title: "ASTCT Consensus Grading for Cytokine Release Syndrome and Neurologic Toxicity Associated with Immune Effector Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, rapid clinical stabilization is frequently seen with the use of the IL-6 receptor antagonist, tocilizumab, strongly implicating cytokines, especially IL-6 ( 8 , 20– 22 ) in the pathophysiology of the syndrome."
    explanation: >-
      The consensus panel's synthesis of why IL-6 is treated as the dominant
      mediator: response to receptor blockade rather than correlation alone.
  downstream:
  - target: Endothelial Activation and Capillary Leak
    causal_link_type: DIRECT
    description: >-
      The cytokines that activate endothelium rise with the severity of the
      neurological arm, which is the measured link between systemic cytokine
      concentration and endothelial activation.
    evidence:
    - reference: PMID:29025771
      reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The severity of neurotoxicity correlated with higher peak concentrations of CRP, ferritin, and multiple cytokines, including those that activate endothelial cells (ECs), such as IL-6, IFN-γ, and TNF-α"
      explanation: >-
        Links the systemic cytokine concentrations of this node to the
        endothelium-activating cytokines that drive the next one. The
        correlation reported is with neurotoxicity grade.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Fever is the obligatory presenting sign and rises with the cytokine
      elevation; in the mouse model, effector-mediated tumour clearance
      produced fever together with elevated IL-6.
    evidence:
    - reference: PMID:29808007
      reference_title: "Monocyte-derived IL-1 and IL-6 are differentially required for cytokine-release syndrome and neurotoxicity due to CAR T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In humanized mice with high leukemia burden, CAR T cell-mediated clearance of cancer triggered high fever and elevated IL-6 levels, which are hallmarks of CRS."
      explanation: >-
        Couples the cytokine elevation of this node to fever in the same
        experimental system.
- name: Endothelial Activation and Capillary Leak
  biological_scale: TISSUE
  conforms_to: cytokine_storm_hyperinflammation#Endothelial Activation and Capillary Leak
  description: >-
    Circulating cytokines act on vascular endothelium throughout the body.
    Activated endothelium releases von Willebrand factor and angiopoietin-2
    from Weibel-Palade bodies, loses barrier integrity and becomes
    procoagulant, so capillary leak and consumptive coagulopathy appear
    together. Endothelial activation is detectable early, before the most
    severe manifestations, and baseline markers of it identify patients at
    higher risk.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: DYSREGULATED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:29025771
    reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with severe neurotoxicity demonstrated evidence of endothelial activation, including disseminated intravascular coagulation, capillary leak, and increased blood-brain barrier (BBB) permeability."
    explanation: >-
      Establishes endothelial activation with capillary leak and coagulopathy
      in patients, as a single process with vascular and neurological
      expressions.
  downstream:
  - target: Distributive Shock and Organ Dysfunction
    causal_link_type: DIRECT
  - target: Blood-Brain Barrier Disruption and Pericyte Stress
    causal_link_type: DIRECT
    description: >-
      The same endothelial process extends to the cerebral microvasculature,
      where loss of barrier function admits systemic cytokines to the
      cerebrospinal fluid.
  - target: Disseminated intravascular coagulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29025771
      reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe neurotoxicity was accompanied by disseminated intravascular coagulation (DIC), with elevated PT, aPTT and d-dimer beginning 2–5 days after CAR-T cell infusion, prolonged thrombocytopenia"
      explanation: >-
        Reports the coagulopathy and thrombocytopenia arising with the
        endothelial activation of this node.
  - target: Capillary leak
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29025771
      reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Patients with grade ≥3 neurotoxicity also had earlier and higher fever, more severe hemodynamic instability and tachypnea, and more severe hypoproteinemia, hypoalbuminemia and weight gain, consistent with loss of vascular integrity and systemic capillary leak"
      explanation: >-
        Reports the clinical signature of capillary leak in the grade >=3
        neurotoxicity subgroup. Marked INDIRECT because the leak is the
        authors' inference from protein, albumin and weight rather than a
        direct permeability measurement.
- name: Distributive Shock and Organ Dysfunction
  biological_scale: ORGANISM
  conforms_to: cytokine_storm_hyperinflammation#Shock and Multiorgan Dysfunction
  description: >-
    The clinical endpoint of the vascular chain: vasodilatory and
    capillary-leak shock with hypotension requiring vasopressor support,
    hypoxia from pulmonary capillary leak, and dysfunction of organs remote
    from the tumour, including acute kidney injury. The consensus grading
    system is built on exactly this progression, grading by fever, hypotension
    and hypoxia.
  evidence:
  - reference: PMID:30592986
    reference_title: "ASTCT Consensus Grading for Cytokine Release Syndrome and Neurologic Toxicity Associated with Immune Effector Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Symptoms can be progressive, must include fever at the onset and may include hypotension, capillary leak (hypoxia) and end organ dysfunction."
    explanation: >-
      The consensus definition of the syndrome's progression, which this node
      represents as its endpoint.
  downstream:
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Hypoxemia
    causal_link_type: DIRECT
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Tachycardia
    causal_link_type: DIRECT
  - target: Reduced left ventricular ejection fraction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe CRS carries a measurable excess of cardiovascular events. The
      intermediate steps between systemic cytokine exposure and the fall in
      ejection fraction are not established by the cited review, so the link
      is recorded as indirect.
    evidence:
    - reference: PMID:42905219
      reference_title: "Cardiovascular Toxicity Across the Cancer Immunotherapy Spectrum: Mechanisms and Management in Immune Checkpoint Inhibitor (ICI) and Chimeric Antigen Receptor T-Cell (CAR-T) Therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Severe CRS more than doubles the risk of cardiovascular events, including a 6-10% incidence of LVEF decline and a 4-18% incidence of arrhythmias"
      explanation: >-
        Attributes the excess of LVEF decline to severe CRS specifically,
        which is what this edge asserts.
  - target: Arrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Blood-Brain Barrier Disruption and Pericyte Stress
  biological_scale: TISSUE
  description: >-
    A proposed mechanism for the neurological arm. Increased blood-brain
    barrier permeability admits high concentrations of systemic cytokines to
    the cerebrospinal fluid; interferon gamma and tumour necrosis factor then
    stress brain vascular pericytes, which secrete interleukin-6 and vascular
    endothelial growth factor and further increase barrier permeability. This
    is a candidate account rather than a settled one. The consensus panel
    states that the neurotoxicity syndrome has unclear pathophysiology,
    distinct from CRS, and that it does not usually respond to IL-6 receptor
    blockade, so the mechanism here is not simply the systemic one acting in
    the brain.
  cell_types:
  - preferred_term: brain pericyte
    term:
      id: CL:2000043
      label: brain pericyte
  evidence:
  - reference: PMID:29025771
    reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During acute neurotoxicity, the concentrations of IFN-γ, TNF-α, IL-6, and TNFR p55 had increased markedly, and were comparable between serum and CSF"
    explanation: >-
      The clinical measurement behind this node: systemic cytokine
      concentrations reach the cerebrospinal fluid during acute
      neurotoxicity. The pericyte step it leads to is a separate in vitro
      result, cited below.
  - reference: PMID:29025771
    reference_title: "Endothelial Activation and Blood-Brain Barrier Disruption in Neurotoxicity after Adoptive Immunotherapy with CD19 CAR-T Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pericytes exposed to IFN-γ secreted increased amounts of IL-6 and vascular endothelial growth factor (VEGF), each of which activates endothelial cells and increases BBB permeability"
    explanation: >-
      The cell-culture arm of the same study, supplying the pericyte step
      directly: interferon gamma is sufficient to make pericytes secrete the
      cytokines that further open the barrier.
  downstream:
  - target: Encephalopathy
    causal_link_type: DIRECT
  - target: Delirium
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
mechanistic_hypotheses:
- hypothesis_group_id: tnf_upstream_of_myeloid_amplification
  hypothesis_label: Effector-derived TNF as the upstream initiator of myeloid amplification
  status: EMERGING
  description: >-
    IL-6 and IL-1 beta are well characterised as the effectors of CRS, but
    which effector-cell signal initiates the myeloid amplification is less
    settled. Selective disruption of TNF signalling in a mouse model places
    effector-derived TNF upstream, acting at least in part through the host
    macrophage compartment and governing severity and lethality. The evidence
    is from mouse models and humanised xenochimeras, not from human
    intervention, so the position of TNF in the human syndrome remains open.
  evidence:
  - reference: PMID:42627932
    reference_title: "CAR T cell-derived TNF is an early determinant of cytokine release syndrome severity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that TNF is a determinant of CRS severity in humanized xenochimeras, governing the overall disease course including eventual lethality."
    explanation: >-
      The central claim of the hypothesis, and the reason it is recorded as
      emerging rather than canonical: the result is in humanised mice.
  - reference: PMID:42500657
    reference_title: "Dual Inhibition of TNF-α and IL-6R mitigates cytokine release syndrome via protection of endothelial integrity and reduction of organ damage in mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Standard Interleukin-6 (IL-6) blockade often fails in severe cases by leaving the upstream initiator, Tumor Necrosis Factor-α (TNF-α), unchecked."
    explanation: >-
      An independent group reaching the same ordering, and stating the
      clinical consequence the hypothesis predicts: that IL-6 blockade alone
      is insufficient in severe disease. Also mouse and in vitro work.

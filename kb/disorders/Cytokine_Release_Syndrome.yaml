notes: >-
  Scope. This entry covers the systemic hyperinflammatory syndrome itself, as
  the consensus definition frames it: a supraphysiologic response following any
  immune therapy that activates or engages T cells or other immune effector
  cells. It is not scoped to one product or one target antigen. The
  neurological arm is graded separately in clinical practice as immune
  effector cell-associated neurotoxicity syndrome; it is represented here as a
  downstream arm of the same chain with an explicit knowledge gap, because
  MONDO carries no term for it and splitting it into its own entry would
  assert a mechanistic separation the sources do not settle.

  Evidence shape. The mechanism rests on a humanised mouse model for the
  monocyte and IL-1 results, on a single detailed 133-patient clinical,
  radiologic and autopsy series for the endothelial and barrier results, and
  on a consensus statement for the definition and grading. The monocyte and
  anakinra results have not been replicated in a human intervention study, so
  the IL-1 arm is recorded with its model-organism source visible rather than
  as established human pharmacology. Both mouse models are recorded in
  animal_models with typed divergences rather than only described in prose,
  so the species and burden caveats sit on the links that carry the claims.

  Reading the clinical series. The 133-patient series is a study of
  neurotoxicity, and most of its quantitative findings, including the CRP and
  ferritin correlations, the coagulopathy and the capillary-leak signature,
  are comparisons between neurotoxicity grades rather than between CRS
  grades. Each snippet taken from it keeps its own subject clause so the
  cohort it describes travels with the quote, and the explanations name the
  subgroup. Read those figures as established for the severe-neurotoxicity
  subgroup and as indicative, not quantified, for CRS severity in general.

  No sourced effector-cell interferon gamma attribution. Interferon gamma is
  central to the syndrome and is measured at high concentration in serum and
  cerebrospinal fluid, but none of the cited sources attributes its production
  to the effector cells specifically, so the Effector Cytokine Release node
  binds only tumour necrosis factor production. Sourcing that attribution is
  the clearest next addition to this entry.

  Occurrence. CRS is reported in 49-93% of patients receiving licensed CAR-T
  products. That is an attack rate among the exposed, and the prevalence
  record says so in its own notes, because PrevalenceMeasureEnum has no value
  for one. Do not read the recorded rate as a population figure.

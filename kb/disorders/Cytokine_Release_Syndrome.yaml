  rate_high: 93000.0
  rate_denominator: POPULATION
  notes: >-
    The source reports CRS in 49-93% of patients receiving licensed CAR-T
    products. The denominator is treated patients, not the general
    population, so this is an attack rate among the exposed rather than a
    population prevalence; the rate is normalised to per-100,000 treated
    patients. PrevalenceMeasureEnum has no value for an attack rate among the
    exposed, and PERIOD_PREVALENCE is the closest available, so read it with
    the denominator above. The wide range reflects differences between
    products and between grading systems.

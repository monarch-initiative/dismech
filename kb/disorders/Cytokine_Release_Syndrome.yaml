- name: Corticosteroid therapy
  description: >-
    Corticosteroids are one of the two CRS-specific interventions the
    consensus panel names, alongside anti-cytokine therapy. In the largest
    characterised neurotoxicity cohort, dexamethasone was given with
    tocilizumab to most patients treated for neurological toxicity, which is
    the basis for binding dexamethasone here. Early, prolonged or high-dose
    use was once withheld out of concern that broad immunosuppression would
    abrogate the antitumour response; retrospective data do not support that
    concern for treatment started after CRS is established, while the
    pre-emptive and prophylactic question remains open.
  therapeutic_modality: SMALL_MOLECULE

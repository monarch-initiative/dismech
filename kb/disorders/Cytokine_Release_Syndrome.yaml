    quote_role: REVIEW_SYNTHESIS
    snippet: "Unlike the classic symptoms of CRS, immune effector cell-associated neurotoxicities do not usually respond to tocilizumab, which is not surprising given the observation that intravenous tocilizumab administration does not generate significant levels of the drug in the cerebrospinal fluid ( 26 )."

treatments:
- name: Tocilizumab
  description: >-
    IL-6 receptor antagonist and the first-line agent for CRS. Rapid clinical
    stabilisation on tocilizumab is the main clinical argument that IL-6 is
    the dominant systemic mediator. It does not reliably treat the
    neurological arm: intravenous administration does not achieve significant
    cerebrospinal fluid concentrations, and in the mouse model it failed to
    prevent delayed lethal neurotoxicity.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:

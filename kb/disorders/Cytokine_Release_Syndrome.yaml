- phase: Onset within the first two weeks after effector cell infusion
  notes: >-
    Fever is the presenting sign and is required at onset. Neurological
    toxicity, where it occurs, follows rather than precedes CRS: in the cited
    cohort every patient who reached grade 3 or higher neurotoxicity had
    fever first, at a median of 4.5 days after the first fever.

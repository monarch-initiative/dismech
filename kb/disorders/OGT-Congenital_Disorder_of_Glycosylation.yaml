      disorders associated with sialic acid deficiency and thus not OGT-CDG."
    explanation: Explains why the screen is uninformative.
diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis rests on finding a hemizygous (male) or heterozygous (female)
    OGT variant by exome or genome sequencing. Maternal X-inactivation skew
    and functional studies in patient cells support causality for novel
    missense variants.
  diagnosis_term:
    preferred_term: Exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41030119
    reference_title: "An OGT Missense Variant With Impaired Enzyme Activity in a Child
      With Severe Developmental Delay and Hepatoblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OGT-CDG was diagnosed by exome sequencing that identified a de novo missense
      variant in the OGT gene."
    explanation: Exome sequencing made the molecular diagnosis.
- name: Functional assessment of OGA and O-GlcNAc in patient cells
  description: >-
    Western blotting of patient fibroblasts or lymphoblastoid cells for OGA
    and global O-GlcNAc, and in vitro activity assays of the recombinant
    variant, have been used to support pathogenicity. Reduced OGA protein has
    been proposed as a rapid initial test. A mouse embryonic stem cell
    reporter assay of OGT feedback separates pathogenic from population
    variants in research settings.
  evidence:
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since patient-derived cells show reduced OGA, we propose western blotting
      for OGA protein levels as a rapid initial diagnostic test for OGT-CDG."
    explanation: Proposes OGA immunoblotting as a diagnostic test.
  - reference: PMID:41030119
    reference_title: "An OGT Missense Variant With Impaired Enzyme Activity in a Child
      With Severe Developmental Delay and Hepatoblastoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional validation by Western blot on patient-derived fibroblasts showed
      reduced O-GlcNAcylation and OGA expression, while significantly reduced enzyme
      activity in vitro confirmed the pathogenicity of the variant."
    explanation: Fibroblast and enzyme studies used to confirm a novel variant.
  - reference: PMID:39706180
    reference_title: "Exploiting O-GlcNAc dyshomeostasis to screen O-GlcNAc transferase
      intellectual disability variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our work enables the prediction of pathogenicity for rapidly emerging
      de novo OGT-CDG variants and points to reduced disruption of O-GlcNAc homeostasis
      as a common mechanism underpinning OGT-CDG."
    explanation: A cell-based assay for classifying variants.

      label: synapse assembly
    modifier: ABNORMAL
  description: >-
    In Drosophila larval neuromuscular junctions, TPR-variant alleles increase
    bouton number while the C921Y-equivalent catalytic allele reduces bouton
    number and junction area, so synapse growth is disturbed in opposite
    directions by the two variant classes. The catalytic-allele phenotype and
    reduced sleep stability are partially rescued by genetic or chemical OGA
    inhibition. The human synaptic correlate has not been examined.

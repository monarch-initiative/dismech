name: OGT-Congenital Disorder of Glycosylation
creation_date: "2026-10-01T12:00:00Z"
category: Mendelian
description: >-
  OGT-congenital disorder of glycosylation (OGT-CDG, MRX106) is a syndromic
  X-linked neurodevelopmental disorder caused by missense variants in OGT,
  which encodes O-GlcNAc transferase. OGT is the only enzyme that attaches
  O-linked N-acetylglucosamine (O-GlcNAc) to serine and threonine residues of
  nuclear, cytosolic and mitochondrial proteins; a single opposing enzyme,
  O-GlcNAcase (OGA), removes it. OGT also catalyses the proteolytic maturation
  of the transcriptional co-regulator HCF1, itself an X-linked intellectual
  disability gene. Unlike the N-linked CDGs, the lesion is in cytoplasmic and
  nuclear O-GlcNAc cycling, so serum transferrin glycosylation is normal.

  Pathogenic variants fall in the N-terminal tetratricopeptide repeat (TPR)
  domain, which recognises substrates and partners, or in the C-terminal
  catalytic domain. TPR variants mostly lower the thermal stability of OGT with
  modest effects on activity, while catalytic-domain variants markedly reduce
  glycosyltransferase activity and global O-GlcNAcylation. A recurring finding
  across patient cells and models is compensatory downregulation of OGA, which
  keeps steady-state O-GlcNAc levels close to normal at the cost of a
  disturbed O-GlcNAc homeostasis. Affected males are hemizygous, usually for
  variants inherited from unaffected carrier mothers with skewed X
  inactivation; de novo variants occur in males and in heterozygous females
  with skewed X inactivation.

  Intellectual disability and developmental delay are present in every
  reported patient, with speech and language delay, hypotonia, eye anomalies
  (notably myopia and astigmatism), behavioural problems, brain abnormalities
  such as microcephaly and a thin corpus callosum, short stature, fifth-finger
  clinodactyly, long fingers and facial dysmorphism. Mouse, Drosophila and
  stem-cell models reproduce microcephaly, cortical and synaptic defects and
  learning deficits, and several of these are partially rescued by blocking
  OGA. No disease-specific treatment exists.

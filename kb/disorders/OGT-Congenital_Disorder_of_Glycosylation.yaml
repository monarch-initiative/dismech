    external_id: CGGV:assertion_07776d36-7494-4ee4-992e-c6fb82c36749-2024-08-08T160000.000Z
    evidence:
    - reference: CGGV:assertion_07776d36-7494-4ee4-992e-c6fb82c36749-2024-08-08T160000.000Z

notes: >-
  Naming and classification. MONDO:0030907 is labelled "intellectual
  disability, X-linked 106" (OMIM:300997) and sits under non-syndromic X-linked
  intellectual disability, but the field now treats it as a syndromic
  disorder and a congenital disorder of glycosylation (PMID:32080367), so the
  entry is named OGT-CDG and listed among dismech's CDG entries while keeping
  the MONDO binding. The Non-Syndromic_X-Linked_Intellectual_Disability entry
  records the same reclassification. The phenotype frequencies come from the
  only published pooled clinical table (13 individuals, 2020); the case count
  has since grown past 70, so these frequencies will shift when a larger
  cohort is published. A hepatoblastoma in one child with a de novo variant
  (PMID:41030119) is not curated as a phenotype because the authors could not
  exclude coincidence. A 2024 review also mentions connective-tissue
  disorders and ulcerative colitis in some patients without counts or
  primary citations; these are not curated. No GeneReviews chapter covers
  OGT-CDG. ClinGen's Syndromic Disorders Gene Curation Expert Panel
  classifies OGT against this MONDO term as Moderate (X-linked).
  No disease-specific treatment has been reported, so the entry carries no
  treatments section; candidate approaches are recorded under discussions.

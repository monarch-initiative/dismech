    reference_title: "Intellectual disability-associated disruption of O-GlcNAc cycling
      impairs habituation learning in Drosophila."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We manipulated O-GlcNAc transferase and O-GlcNAc hydrolase activity in
      Drosophila and demonstrate an important role of O-GlcNAcylation in habituation
      learning and synaptic development at the larval neuromuscular junction."
    explanation: O-GlcNAc cycling controls synaptic development and learning.

- name: Impaired HCF1 Proteolytic Maturation
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: HCF1 proteolytic processing
    term:
      id: GO:0016485
      label: protein processing
    modifier: DECREASED
  description: >-
    OGT glycosylates and then cleaves the HCF1 precursor at its PRO repeats
    using the same active site. Reduced HCF1 cleavage has been shown for R284P
    (recombinant enzyme) and N567K (recombinant enzyme and mouse embryonic
    stem cells, where the HCF1 target GABPA was upregulated), but not for
    L254F, A259T, E339G or C921Y. Because HCFC1 is itself an X-linked
    intellectual disability gene, misprocessing may contribute for some
    variants but is not thought to be the general mechanism.

inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Familial cases are hemizygous males whose unaffected carrier mothers show
    X inactivation skewed away from the variant allele. De novo variants have
    been reported in males and in monozygotic female twins who are
    heterozygous for a catalytic-domain variant and show a 98:2 X-inactivation
    skew; which X is inactivated in the twins is unknown.
  evidence:
  - reference: PMID:39059494
    reference_title: "O-GlcNAc transferase congenital disorder of glycosylation (OGT-CDG):
      Potential mechanistic targets revealed by evaluating the OGT interactome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "OGT-CDG is an X-linked recessive disorder, and therefore it primarily
      affects males."
    explanation: States the mode of inheritance.
  - reference: PMID:39059494
    reference_title: "O-GlcNAc transferase congenital disorder of glycosylation (OGT-CDG):
      Potential mechanistic targets revealed by evaluating the OGT interactome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A 98:2 skew in X inactivation was detected in both twins, while the
      maternal parent was unaffected."
    explanation: The heterozygous female twins with the de novo N567K variant both
      had highly skewed X inactivation.
  - reference: PMID:31296563
    reference_title: "Catalytic deficiency of O-GlcNAc transferase leads to X-linked
      intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, being a de novo mutation, which 1 of the 2 chromosomes is predominantly
      inactivated remains unclear."
    explanation: The twins' variant arose de novo, and the inactivated X is not
      known.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The first six reports (2015-2019) described 13 affected individuals from
    seven families. By 2026 more than 70 affected individuals were known, and
    a community-curated catalogue listed 101 OGT-XLID variants. No population
    prevalence estimate has been published.
  evidence:
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thirteen affected individuals from seven families presenting with previously
      unclassified ID and developmental delay were subjected to genetic testing and
      found to carry nonsynonymous variants in the OGT gene"
    explanation: The pooled case count from the first reports.
  - reference: PMID:42209020
    reference_title: "Genetic Rescue of Pathogenic O-GlcNAc Dyshomeostasis Associated
      with Microcephaly and Motor Deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Although >70 individuals with this condition are now known, we still
      lack a clear understanding of how OGT mutations cause the disease."
    explanation: Gives the number of known affected individuals by 2026.
  - reference: PMID:42107645
    reference_title: "Systematic mapping of O-GlcNAc transferase and O-GlcNAcase defines
      disease-associated variants."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This approach positions the O-GlcNAc database as the most current and
      comprehensive repository of OGT-XLID mutations (n = 101 OGT-XLID variants)."
    explanation: The size of the curated variant catalogue.

discussions:
- discussion_id: ogt_cdg_shared_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What mechanism do TPR-domain and catalytic-domain OGT variants share,
    given that they produce a similar syndrome?
  attaches_to:
  - pathophysiology#OGT TPR Domain Missense Variants
  - pathophysiology#OGT Catalytic Domain Missense Variants
  rationale: >-
    Catalytic variants clearly reduce glycosyltransferase activity and global
    O-GlcNAc, but most TPR variants retain near-normal activity and global
    O-GlcNAc, and they alter fly synapse growth in the opposite direction.
    Proposed shared mechanisms are disturbed O-GlcNAc feedback, altered
    TPR-dependent interactions with substrates and partners, many of which
    are themselves intellectual disability genes, and, for some variants,
    HCF1 misprocessing. None has been shown to apply to every variant.
  evidence:
  - reference: PMID:39059494
    reference_title: "O-GlcNAc transferase congenital disorder of glycosylation (OGT-CDG):
      Potential mechanistic targets revealed by evaluating the OGT interactome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Overall, studies examining the structure of OGT-CDG variants point toward
      domain-specific changes: TPR domain variants have altered structure which could
      affect protein-protein interactions, substrate selection, and stability, while
      catalytic domain variants have changes in the binding site of substrates."
    explanation: Summarises the domain-specific structural effects.
  - reference: PMID:33356293
    reference_title: "Generation of an Interactome for the Tetratricopeptide Repeat
      Domain of O-GlcNAc Transferase Indicates a Role for the Enzyme in Intellectual
      Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, the identified TPR interactors are linked to several disease
      states but most notably are enriched in pathologies featuring intellectual disability
      that may underlie the mechanism by which mutations in OGT lead to XLID."
    explanation: TPR interactors are enriched for intellectual disability genes.
  - reference: PMID:35863433
    reference_title: "Bioinformatic prediction of putative conveyers of O-GlcNAc transferase
      intellectual disability."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Here, we used bioinformatic techniques to integrate sequence conservation,
      structural data, clinical data, and the available literature to identify 22 candidate
      proteins that convey OGT-CDG."
    explanation: Proposes specific hypo-O-GlcNAcylated substrates as the shared mechanism.
- discussion_id: ogt_cdg_oga_inhibition
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Could inhibiting OGA, or supplementing the hexosamine pathway, treat
    OGT-CDG?
  attaches_to:
  - pathophysiology#Disrupted O-GlcNAc Homeostasis
  rationale: >-
    Blocking OGA corrects habituation learning in TPR-variant flies, partially
    rescues synaptic and sleep phenotypes in catalytic-variant flies, and
    partially restores O-GlcNAc homeostasis in N648Y mice. Brain-penetrant
    OGA inhibitors exist from neurodegeneration programmes. Glucosamine
    supplementation was being explored in the N648Y patient with reported
    positive effects, but no outcome data have been published, and no clinical
    trial has been registered.
  evidence:
  - reference: PMID:35500025
    reference_title: "Intellectual disability-associated disruption of O-GlcNAc cycling
      impairs habituation learning in Drosophila."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study establishes a critical role for O-GlcNAc cycling and disrupted
      O-GlcNAc transferase activity in cognitive dysfunction, and suggests that blocking
      O-GlcNAc hydrolysis is a potential strategy to treat OGT-CDG."
    explanation: Proposes OGA blockade from fly rescue data.
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For the patient with the c.1942A>T p.(Asn648Tyr) variant, GlcN supplementation
      is being explored with some positive effects"
    explanation: Anecdotal report of glucosamine use in one patient.

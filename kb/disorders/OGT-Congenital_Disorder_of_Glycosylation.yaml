  - target: Impaired HCF1 Proteolytic Maturation
    causal_link_type: DIRECT
    description: Shown for N567K; C921Y does not impair HCF1 cleavage.
    evidence:
    - reference: PMID:31296563
      reference_title: "Catalytic deficiency of O-GlcNAc transferase leads to X-linked
        intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "(C) 3HA-OGTN567K mESCs show impaired HCF1 proteolytic cleavage."
      explanation: The variant impairs HCF1 cleavage in mouse embryonic stem cells.
- name: Disrupted O-GlcNAc Homeostasis
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein O-GlcNAcylation
    term:
      id: GO:7770074
      label: protein O-linked glycosylation via N-acetylglucosamine
    modifier: DYSREGULATED
  description: >-
    O-GlcNAc levels are set by OGT and OGA acting in feedback. Catalytic
    variants lower global O-GlcNAcylation in stem cells and brain. In patient
    lymphoblastoid cells and fibroblasts, OGA protein and mRNA fall, partly
    through enrichment of an OGT-containing mSin3A-HDAC1 repressor complex at
    the OGA promoter, which keeps bulk O-GlcNAc near normal. The compensation
    is imperfect and variant-specific: some models also raise OGT, and a
    reporter screen found that OGT-CDG variants elicit a weaker feedback
    response than wild-type or population variants. OGA downregulation has
    been proposed as a cellular diagnostic marker.
  evidence:
  - reference: PMID:28302723
    reference_title: "Identification and characterization of a missense mutation in
      the O-linked β-N-acetylglucosamine (O-GlcNAc) transferase gene that segregates
      with X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed an enrichment of the OGT-containing transcriptional repressor
      complex mSin3A-HDAC1 at the proximal promoter region of OGA and correspondingly
      decreased OGA promoter activity in affected cells."
    explanation: Mechanism of OGA downregulation in patient cells.
  - reference: PMID:28302723
    reference_title: "Identification and characterization of a missense mutation in
      the O-linked β-N-acetylglucosamine (O-GlcNAc) transferase gene that segregates
      with X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, we have begun to unravel the molecular consequences of the 759G>T
      (p.L254F) mutation in OGT that uncovered a compensation mechanism, albeit imperfect,
      given the phenotype of affected individuals, to maintain steady-state O-GlcNAc
      levels."
    explanation: Frames OGA loss as imperfect compensation.
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, variants in OGT may lead to reduction of OGA protein/transcript
      to maintain O-GlcNAc homoeostasis."
    explanation: Review synthesis across variants.
  - reference: PMID:39706180
    reference_title: "Exploiting O-GlcNAc dyshomeostasis to screen O-GlcNAc transferase
      intellectual disability variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OGT-CDG variants generally elicited a lower feedback response than wild-type
      and Genome Aggregation Database (gnomAD) OGT variants."
    explanation: A shared signature of disturbed feedback across variants.
  - reference: PMID:41033462
    reference_title: "Zscan4 as a Candidate Conveyor of Early Developmental Defects
      in O-GlcNAc Transferase Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition to the increased levels of OGT and decreased levels of OGA
      reflecting disrupted O-GlcNAc homeostasis, we find that expression of the ID
      gene Zscan4 is upregulated."
    explanation: Raised OGT and lowered OGA in stem cells carrying patient variants.
  downstream:
  - target: Dysregulated Developmental Gene Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In stem cells carrying catalytic variants, lower O-GlcNAcylation is
      accompanied by loss of pluripotency factors, and raised OGT-TET complex
      levels by Zscan4 upregulation. Which O-GlcNAc substrates convey these
      changes is not established.
    evidence:
    - reference: PMID:37334838
      reference_title: "An O-GlcNAc transferase pathogenic variant linked to intellectual
        disability affects pluripotent stem cell self-renewal."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Colonies formed by mouse embryonic stem cells carrying OGTC921Y showed
        decreased levels of protein O-GlcNAcylation accompanied by decreased levels
        of Oct4 (encoded by Pou5f1), Sox2 and extracellular alkaline phosphatase (ALP),
        implying reduced self-renewal capacity."
      explanation: Hypo-O-GlcNAcylation co-occurs with loss of pluripotency markers.
  - target: Impaired Synaptic Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In Drosophila, hypo-O-GlcNAcylation from a patient catalytic variant

    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Changes in HCF1 processing were observed for the c.851G>C p.(Arg284Pro)
      and c.1701=/T>A p.(Asn567Lys) variants"
    explanation: The two variants with reduced HCF1 processing.
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, while c.1701=/T>A p.(Asn567Lys) appears to affect HCF1 processing,
      current data across all variants suggest that HCF1 misprocessing is unlikely
      to be the general mechanism by which OGT variants lead to the observed XLID
      phenotypes"
    explanation: Refutes HCF1 misprocessing as a mechanism shared by all variants.
  downstream:
  - target: Dysregulated Developmental Gene Expression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      HCF1 is a transcriptional co-regulator; in N567K stem cells with reduced
      HCF1 cleavage, expression of the HCF1 target GABPA was raised.
    evidence:

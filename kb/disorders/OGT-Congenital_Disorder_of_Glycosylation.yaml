        | XL | Moderate"
      explanation: >-
        The ClinGen Syndromic Disorders Gene Curation Expert Panel classifies
        the X-linked OGT relationship with this MONDO term as Moderate (SOP10,
        2024-08-08).
  association: >-
    OGT (Xq13.1) encodes O-GlcNAc transferase. Pathogenic variants are missense
    variants in the TPR or catalytic domain, plus one splice variant that
    removes TPR residues 155-177. No null allele has been reported, consistent
    with OGT being essential in vertebrate embryos.
  evidence:
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this review, we compile the work from the last few years that clearly
      delineates a new syndromic form of ID, which we propose to classify as a novel
      Congenital Disorder of Glycosylation (OGT-CDG)."
    explanation: Establishes OGT variants as the cause of a distinct syndrome and
      proposes the OGT-CDG classification.
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Three patients carried de novo variants resulting in single-amino acid
      variants in the CD of OGT"
    explanation: Catalytic-domain variants arose de novo, while the remaining early
      variants were inherited TPR-domain variants.
  variants:
  - name: "OGT p.Leu254Phe"
    description: >-
      TPR-domain variant found by X-exome screening and segregating with
      intellectual disability in three related males. It distorts the TPR
      superhelix and lowers OGT stability; affected lymphoblastoid cells show
      reduced OGT and OGA with near-normal global O-GlcNAc.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28302723
      reference_title: "Identification and characterization of a missense mutation
        in the O-linked β-N-acetylglucosamine (O-GlcNAc) transferase gene that segregates
        with X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An X-chromosome exome screen identified a missense mutation, which
        encodes an amino acid in the tetratricopeptide repeat, in OGT (759G>T (p.L254F))
        that segregates with X-linked intellectual disability (XLID) in an affected
        family."
      explanation: Segregation of the variant with disease in a family.
  - name: "OGT p.Arg284Pro"
    description: >-
      Hemizygous TPR-domain variant in a male with intellectual disability and
      dysmorphic features. The recombinant protein unfolds readily and has
      reduced glycosyltransferase and HCF1-processing activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28584052
      reference_title: "Mutations in N-acetylglucosamine (O-GlcNAc) transferase in patients
        with X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Recombinant OGT bearing the p.Arg284Pro mutation was prone to unfolding
        and exhibited reduced glycosylation activity against a complex array of glycosylation
        substrates and proteolytic processing of the transcription factor host cell
        factor 1, which is also encoded by an XLID-associated gene."
      explanation: Functional evidence for loss of both OGT activities.
  - name: "OGT c.463-6T>G"
    description: >-
      Hemizygous intronic variant causing aberrant splicing; no stable
      truncated protein was detected in patient fibroblasts. It corresponds to
      the in-frame loss of TPR residues 155-177 that was later modelled in
      patient-derived iPSCs.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28584052
      reference_title: "Mutations in N-acetylglucosamine (O-GlcNAc) transferase in patients
        with X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also found that the c.463-6T>G mutation leads to aberrant mRNA splicing,
        but no stable truncated protein was detected in the corresponding patient-derived
        fibroblasts."
      explanation: Shows the splicing consequence of the variant.
  - name: "OGT p.Ala259Thr"
    description: TPR-domain variant segregating with intellectual disability in a family.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:29769320
      reference_title: "O-GlcNAc transferase missense mutations linked to X-linked intellectual
        disability deregulate genes involved in cell fate determination and signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report the discovery of two additional novel missense mutations
        (c.775 G>A, p.A259T, and c.1016 A>G, p.E339G) in the TPR domain of OGT that
        segregate with XLID in affected families."
      explanation: Reports segregation of the variant with disease.
  - name: "OGT p.Glu339Gly"
    description: TPR-domain variant segregating with intellectual disability in two brothers.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:29769320
      reference_title: "O-GlcNAc transferase missense mutations linked to X-linked intellectual
        disability deregulate genes involved in cell fate determination and signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report the discovery of two additional novel missense mutations
        (c.775 G>A, p.A259T, and c.1016 A>G, p.E339G) in the TPR domain of OGT that
        segregate with XLID in affected families."
      explanation: Reports segregation of the variant with disease.
  - name: "OGT p.Ala319Thr"
    description: >-
      TPR-domain variant in three brothers with severe intellectual
      disability, inherited from their mother. It co-segregates with a missense
      variant in MED12, another X-linked intellectual disability gene, so its
      causal contribution in this family is uncertain.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:35500025
      reference_title: "Intellectual disability-associated disruption of O-GlcNAc cycling
        impairs habituation learning in Drosophila."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The A319T mutation, present in three individuals with severe ID, was
        inherited from the mother but segregated with an uncharacterized missense mutation
        in MED12, a gene already implicated in ID"
      explanation: Records the confounding MED12 variant in the A319T family.
  - name: "OGT p.Asn567Lys"
    description: >-
      De novo catalytic-domain variant in monozygotic female twins. It lowers
      OGT stability and disrupts the substrate-binding site, abolishing
      catalytic activity, and impairs HCF1 cleavage in mouse embryonic stem
      cells.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:31296563
      reference_title: "Catalytic deficiency of O-GlcNAc transferase leads to X-linked
        intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Molecular analyses revealed decreased OGT stability and disruption of
        the substrate binding site, resulting in loss of catalytic activity."
      explanation: Functional evidence that the variant abolishes catalytic activity.
  - name: "OGT p.Asn648Tyr"
    description: >-
      De novo catalytic-domain variant in a male. It does not lower OGT thermal
      stability but reduces catalytic activity, and mouse embryonic stem cells
      carrying it have reduced OGA and global O-GlcNAc.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32080367
      reference_title: "An intellectual disability syndrome with single-nucleotide variants
        in O-GlcNAc transferase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "Furthermore, in vitro determination of protein unfolding melting curves
        demonstrated that all the XLID variants but the c.1942A>T p.(Asn648Tyr) destabilised
        OGT"
      explanation: Distinguishes this variant, which is not destabilising, from the
        other early variants.
    - reference: PMID:31627256
      reference_title: "A missense mutation in the catalytic domain of O-GlcNAc transferase
        links perturbations in protein O-GlcNAcylation to X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mouse embryonic stem cells carrying the mutation reveal reduced O-GlcNAcase
        (OGA) and global O-GlcNAc levels."
      explanation: Cellular consequence of the catalytic-domain variant reported in
        this paper (p.Asn648Tyr, as identified in the later review).
  - name: "OGT p.Cys921Tyr"
    description: >-
      Catalytic-domain variant inherited by three brothers with intellectual
      disability and absent from their unaffected brother; two of the three
      had generalised tonic-clonic seizures beginning around age 40. It
      abolishes catalytic activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37334838
      reference_title: "An O-GlcNAc transferase pathogenic variant linked to intellectual
        disability affects pluripotent stem cell self-renewal."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report three brothers affected by OGT-CDG that carry a novel
        OGT variant, OGTC921Y, with a mutation in the catalytic core of OGT, which
        is absent in their unaffected brother."
      explanation: Segregation of the variant with disease in a sibship.
pathophysiology:
- name: OGT TPR Domain Missense Variants
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: protein O-GlcNAc transferase activity
    term:
      id: GO:0097363
      label: protein O-acetylglucosaminyltransferase activity
    modifier: DECREASED
  description: >-
    Hemizygous missense variants in the tetratricopeptide repeats (L254F,
    A259T, R284P, A319T, E339G) and an in-frame TPR deletion. They lower the
    thermal stability of OGT and alter TPR conformation; L254F shifts the TPR
    helix by up to 15 angstroms. Effects on activity are modest and
    substrate-dependent: all tested TPR variants still glycosylate the model
    substrate CKII alpha, though L254F and R284P modify a complex lysate
    substrate less well. Because the TPR domain selects substrates and binding
    partners, the variants are thought to alter a subset of OGT interactions
    rather than abolish activity.
  genetic_context:
    genes:
    - preferred_term: OGT
      term:
        id: hgnc:8127
        label: OGT
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    allele_type: missense
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Inherited hemizygous TPR-domain missense variants, plus the c.463-6T>G
      splice variant that removes residues 155-177.
  evidence:
  - reference: PMID:29769320
    reference_title: "O-GlcNAc transferase missense mutations linked to X-linked intellectual
      disability deregulate genes involved in cell fate determination and signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Characterization of all five of these XLID missense variants of OGT demonstrates
      modest declines in thermodynamic stability and/or activities of the variants."
    explanation: Biochemical characterisation of the five TPR variants.
  - reference: PMID:29606577
    reference_title: "The O-GlcNAc Transferase Intellectual Disability Mutation L254F
      Distorts the TPR Helix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a multi-disciplinary approach we show that the L254F OGT mutation
      leads to conformational changes of the tetratricopeptide repeats and reduced
      activity, revealing the molecular mechanisms contributing to pathogenesis."
    explanation: Structural and activity consequences of a TPR variant.
  - reference: PMID:32080367
    reference_title: "An intellectual disability syndrome with single-nucleotide variants
      in O-GlcNAc transferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Furthermore, in vitro determination of protein unfolding melting curves
      demonstrated that all the XLID variants but the c.1942A>T p.(Asn648Tyr) destabilised
      OGT"
    explanation: All five TPR variants destabilise OGT in melting-curve assays.
  downstream:
  - target: Disrupted O-GlcNAc Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TPR variants leave global O-GlcNAc grossly unchanged in patient cells,
      but cells lower OGA expression, and in Drosophila the learning deficit
      caused by TPR variants is corrected by blocking O-GlcNAc removal. Which
      substrates are under-modified is not known.
    evidence:
    - reference: PMID:28584052
      reference_title: "Mutations in N-acetylglucosamine (O-GlcNAc) transferase in patients
        with X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data suggest that mutant cells attempt to maintain global O-GlcNAcylation
        by down-regulating O-GlcNAcase expression."
      explanation: Patient fibroblasts with TPR-region variants compensate by lowering
        OGA.
    - reference: PMID:35500025
      reference_title: "Intellectual disability-associated disruption of O-GlcNAc cycling
        impairs habituation learning in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The habituation deficit can be corrected by blocking O-GlcNAc hydrolysis,
        indicating that OGT-CDG mutations affect cognition-relevant habituation via
        reduced protein O-GlcNAcylation."
      explanation: In flies carrying TPR variants, restoring O-GlcNAc rescues the
        behavioural defect, placing reduced O-GlcNAcylation downstream of the variants.
  - target: Impaired HCF1 Proteolytic Maturation
    causal_link_type: DIRECT
    description: Shown for R284P only; the other TPR variants process HCF1 normally.
    evidence:
    - reference: PMID:28584052
      reference_title: "Mutations in N-acetylglucosamine (O-GlcNAc) transferase in patients
        with X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Recombinant OGT bearing the p.Arg284Pro mutation was prone to unfolding
        and exhibited reduced glycosylation activity against a complex array of glycosylation
        substrates and proteolytic processing of the transcription factor host cell
        factor 1, which is also encoded by an XLID-associated gene."
      explanation: The recombinant variant processes HCF1 less efficiently.
  - target: Dysregulated Developmental Gene Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Four TPR variants engineered into human embryonic stem cells deregulate
      a shared set of cell-fate and LXR/RXR signalling genes without gross
      changes in global O-GlcNAc, OGT or OGA, so the link does not run through
      a measurable change in bulk O-GlcNAc.
    evidence:
    - reference: PMID:29769320
      reference_title: "O-GlcNAc transferase missense mutations linked to X-linked intellectual
        disability deregulate genes involved in cell fate determination and signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, analyses of the differential transcriptomes of the OGT variant-expressing
        stem cells revealed shared deregulation of genes involved in cell fate determination
        and liver X receptor/retinoid X receptor signaling, which has been implicated
        in neuronal development."
      explanation: TPR variants change gene expression in stem cells.

    reference_title: "Rescuable sleep and synaptogenesis phenotypes in a Drosophila
      model of O-GlcNAc transferase intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both these phenotypes can be partially rescued by genetically or chemically
      targeting OGA, suggesting that a balance of OGT/OGA activity is required for
      normal neuronal development and function."
    explanation: Synaptic and sleep phenotypes depend on the OGT/OGA balance.

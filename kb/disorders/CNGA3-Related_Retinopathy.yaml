  evidence:
  - reference: PMID:9662398
    reference_title: "Total colourblindness is caused by mutations in the gene encoding the alpha-subunit of the cone photoreceptor cGMP-gated cation channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations are present in two families, whereas the remaining families show compound heterozygous mutations."
    explanation: >-
      The gene-discovery report shows the biallelic (homozygous or compound
      heterozygous) genotypes that cause CNGA3 disease.
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apparently, both mutant alleles were identified in 47 families, including 16 families with presumed homozygous mutations and 31 families with two heterozygous mutations."
    explanation: >-
      The first comprehensive CNGA3 screen confirms the two-allele requirement
      across 47 families.
has_subtypes:
- name: ACHM2
  display_name: Achromatopsia 2 (CNGA3)
  classification: genetic
  description: >-
    Congenital achromatopsia from biallelic CNGA3 variants, the usual
    phenotype: loss of colour discrimination, poor visual acuity, photophobia
    and pendular nystagmus with absent cone and preserved rod
    electroretinogram responses. Most patients have the complete form; some
    retain residual cone function (incomplete achromatopsia), which is a
    quantitative rather than a categorical difference.
  subtype_term:
    preferred_term: achromatopsia 2
    term:
      id: MONDO:0009003
      label: achromatopsia 2
  evidence:
  - reference: PMID:9662398
    reference_title: "Total colourblindness is caused by mutations in the gene encoding the alpha-subunit of the cone photoreceptor cGMP-gated cation channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the identification of missense mutations in CNGA3 in five families with RM."
    explanation: >-
      Identifies CNGA3 as the cause of rod monochromacy, the complete
      achromatopsia phenotype now numbered ACHM2.
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNGA3 mutations were detected not only in patients with the complete form of achromatopsia but also in incomplete achromats with residual cone photoreceptor function and (rarely) in patients with evidence for severe progressive cone dystrophy."
    explanation: >-
      Places complete and incomplete achromatopsia within one CNGA3 spectrum,
      with progressive cone dystrophy as the rare outlier curated below.
  - reference: PMID:19592100
    reference_title: Genetic etiology and clinical consequences of complete and incomplete achromatopsia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distinction between complete and incomplete subtypes of ACHM has no clinical value, and the assumption of a stationary nature is misleading."
    explanation: >-
      Supports keeping complete and incomplete achromatopsia inside one
      subtype. Indirect because the conclusion is drawn across the cohort's
      genes rather than from its three CNGA3 probands alone.
- name: CNGA3 Progressive Cone Dystrophy
  display_name: Progressive cone dystrophy (CNGA3)
  classification: genetic
  description: >-
    A rare presentation in which cone function deteriorates rather than being
    congenitally absent, reported in a small minority of patients carrying
    CNGA3 variants. It is the CNGA3 counterpart of the better characterised
    CNGB3 progressive cone dystrophy.
  evidence:
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNGA3 mutations were detected not only in patients with the complete form of achromatopsia but also in incomplete achromats with residual cone photoreceptor function and (rarely) in patients with evidence for severe progressive cone dystrophy."
    explanation: >-
      Records CNGA3 variants in rare patients with severe progressive cone
      dystrophy, ascertained in a screen of hereditary cone disorders rather
      than of achromatopsia alone.
pathophysiology:
- name: CNGA3 Cone CNG Channel Alpha Subunit Defect
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >-
    Biallelic CNGA3 variants, most of them missense substitutions at residues
    conserved across the cyclic nucleotide-gated channel family, alter the
    alpha subunit of the cone CNG channel. The substitutions cluster at the
    cytoplasmic face of transmembrane segments S1 and S2, in S4, and in the
    cGMP-binding domain. This is the initiating, cone-autonomous lesion.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT

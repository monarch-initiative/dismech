    snippet: "These symptoms are easily noticed early (mean age 0.88 ± 1.07 years at onset of initial symptom)."
    explanation: >-
      A preschool CNGA3 cohort dates the first noticed symptoms to under one
      year of age.
  - reference: PMID:32960951
    reference_title: Long-Term Investigation of Retinal Function in Patients with Achromatopsia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinal function including MS, volumetric indices, and CS are stable in ACHM."
    explanation: >-
      Supports the functional stability recorded here over a mean 7.2 years.
      Indirect because the cohort pools CNGA3 with CNGB3 achromatopsia,
      reporting only that mean sensitivity was similar between them.
- name: Progressive Foveal Cone Loss
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  description: >-
    Over years the surviving foveal cones thin and their inner and outer
    segments break up, giving foveal thinning, ellipsoid-zone disruption and
    in some patients frank macular atrophy. Cross-sectional series show the
    outer-retinal stage worsening with age from early childhood, with no
    difference between CNGA3 and CNGB3. Longitudinal adaptive-optics imaging of
    CNGA3 patients over about 2.6 years finds the foveal cone mosaic stable, so
    the structural decline is slow enough that a wide therapeutic window
    remains.
  role: consequence
  biological_scale: TISSUE
  node_class: DEGENERATION_ATROPHY
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Retinal thinning on OCT
    causal_link_type: DIRECT
  - target: Macular atrophy
    causal_link_type: DIRECT
  - target: Cone/cone-rod dystrophy
    causal_link_type: DIRECT
    description: >-
      In the rare progressive subtype, cone loss shows up as deteriorating
      cone function rather than stationary dysfunction.
  evidence:
  - reference: PMID:20574029
    reference_title: "Progressive loss of cones in achromatopsia: an imaging study using spectral-domain optical coherence tomography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone cell loss further progressed with age and occurred in 8 (42%) of 19 patients below 30 years and in 20 (95%) of 21 of those aged 30+ years."
    explanation: >-
      Quantifies the age-related accumulation of cone loss in a cohort with
      known CNGA3, CNGB3 and PDE6C variants.
  - reference: PMID:34449556
    reference_title: Disease Progression in CNGA3 and CNGB3 Retinopathy; Characteristics of Slovenian Cohort and Proposed OCT Staging Based on Pooled Data from 126 Patients from 7 Studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple regression analysis showed a significant correlation of OCT stage with age (p < 0.001) and no correlation with gene (p > 0.05)."
    explanation: >-
      In 126 pooled patients the outer-retinal stage worsens with age
      regardless of which channel gene is mutated.
  - reference: PMID:39365261
    reference_title: Longitudinal Imaging of the Foveal Cone Mosaic in CNGA3-Associated Achromatopsia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no change in ONL thickness, degree of EZ disruption, or foveal hypoplasia over the follow-up period."
    explanation: >-
      Longitudinal CNGA3 imaging found no measurable structural change over a
      mean 2.6 years, which contradicts reading this node as degeneration that
      is detectable on that timescale.
phenotypes:
- name: Achromatopsia

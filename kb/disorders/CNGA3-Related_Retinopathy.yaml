    explanation: >-
      Three further homozygous missense alleles from consanguineous families
      mistarget the subunit in heterologous cells.
- name: Loss of Functional Cone CNG Channels
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  description: >-
    The native cone channel is a heterotetramer of CNGA3 and CNGB3 subunits in
    which CNGA3 carries the current. Without functional alpha subunits the
    cone outer segment has no cGMP-gated cation conductance: deleting the
    channel in mouse removes the cone photoresponse entirely, and in
    heterologous expression of two patient alleles only one formed a
    functioning channel at all, and then with grossly altered properties.
  role: central_effector
  biological_scale: MOLECULAR
  node_class: CHANNEL_CONDUCTANCE

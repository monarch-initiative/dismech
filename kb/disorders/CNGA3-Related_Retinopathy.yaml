genetic:
- name: CNGA3
  gene_term:
    preferred_term: CNGA3
    term:
      id: hgnc:2150
      label: CNGA3
  relationship_type: CAUSATIVE
  features: >-
    The mutation spectrum is dominated by missense substitutions, in contrast
    to the truncating alleles that dominate CNGB3. Four recurrent
    substitutions, R277C, R283W, R436W and F547L, accounted for 41.8% of
    mutant alleles in the first comprehensive screen; the R283W allele is
    particularly frequent in Scandinavia and northern Italy and has a common
    origin. Whole-genome sequencing also finds exon-level copy-number changes
    that coding analysis misses.
  case_fractions:
  - population: Genetically confirmed achromatopsia cohort (1,060 patients; Solaki et al. 2022)
    case_fraction_percent: 36.3
    cohort_size: 1060
    notes: 385 of 1,060 genetically confirmed patients carried likely disease-causing CNGA3 variants.
    evidence:
    - reference: PMID:35332618
      reference_title: Comprehensive variant spectrum of the CNGA3 gene in patients affected by achromatopsia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we provide a comprehensive overview of the CNGA3 variant spectrum in a cohort of 1060 genetically confirmed ACHM patients, 385 (36.3%) of these carrying \"likely disease-causing\" variants in CNGA3."
      explanation: Gives the CNGA3 share of the largest genetically confirmed cohort.
  - population: Dutch achromatopsia cohort (63 probands; Thiadens et al. 2009)
    case_fraction_percent: 4.8
    cohort_size: 63
    notes: >-
      3 of 63 probands, which the authors round to 5%, in a cohort where CNGB3
      accounted for 87%. The CNGA3 share is strongly population dependent and
      is much higher in consanguineous Middle Eastern populations.
    evidence:
    - reference: PMID:19592100
      reference_title: Genetic etiology and clinical consequences of complete and incomplete achromatopsia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CNGA3 mutations were detected in 3 of 63 (5%) probands; all caused an amino acid change of the protein."
      explanation: Gives the CNGA3 share of a Dutch clinic-based cohort.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_39fe36b7-54c3-486b-a9f9-19bce71f096e-2022-02-03T170000.000Z
    evidence:
    - reference: CGGV:assertion_39fe36b7-54c3-486b-a9f9-19bce71f096e-2022-02-03T170000.000Z
      reference_title: "CNGA3 / CNGA3-related retinopathy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CNGA3 | HGNC:2150 | CNGA3-related retinopathy | MONDO:0800102 | AR | Definitive | SOP9 | Retina Gene Curation Expert Panel | 2022-02-03T17:00:00.000Z"
      explanation: >-
        ClinGen's Retina Gene Curation Expert Panel classifies the
        CNGA3-retinopathy relationship as Definitive under autosomal recessive
        inheritance.
  variants:
  - name: c.847C>T (p.Arg283Trp)
    description: >-
      Recurrent missense allele, the most frequent CNGA3 variant in a
      Slovenian cohort and one of the four substitutions that account for over
      40% of mutant alleles. Haplotype analysis indicates a common origin for
      the alleles that are frequent in Scandinavia and northern Italy.
    evidence:
    - reference: PMID:34449556
      reference_title: Disease Progression in CNGA3 and CNGB3 Retinopathy; Characteristics of Slovenian Cohort and Proposed OCT Staging Based on Pooled Data from 126 Patients from 7 Studies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most prevalent pathogenic variants were CNGA3:c.847C>T (p.Arg283Trp) (seven alleles)"
      explanation: Identifies this as the most frequent allele in a CNGA3 and CNGB3 cohort.
    - reference: PMID:11536077
      reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis suggests that the R436W and F547L mutant alleles have multiple origins, whereas we found evidence that the R283W alleles, which are particularly frequent among patients from Scandinavia and northern Italy, have a common origin."
      explanation: Establishes the single origin and regional frequency of the R283W allele.
  - name: c.1641C>A (p.Phe547Leu)
    description: >-
      Recurrent missense allele, one of the four recurrent substitutions of
      the first comprehensive screen, and reported homozygously in a
      consanguineous Pakistani family.
    evidence:
    - reference: PMID:11536077
      reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Several mutations were identified recurrently (e.g., R277C, R283W, R436W, and F547L)."
      explanation: Places F547L among the four recurrent CNGA3 alleles.
    - reference: PMID:42099125
      reference_title: "The genetic spectrum of achromatopsia in consanguineous families: insights from Whole exome sequencing across 15 affected individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Four homozygous pathogenic variants were identified: CNGA3:c.1641C > A p.(Phe547Leu)"
      explanation: Homozygous F547L in a consanguineous Pakistani family.
  - name: c.1279C>T (p.Arg427Cys)
    description: >-
      Missense allele whose main pathogenic effect is reduced channel density
      at the cell membrane; a chemical chaperone increased macroscopic
      currents in vitro.
    evidence:
    - reference: PMID:18445228
      reference_title: Functional analysis of human CNGA3 mutations associated with colour blindness suggests impaired surface expression of channel mutants A3(R427C) and A3(R563C).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with the chemical chaperone glycerol effectively increased macroscopic currents, presumably by enhancing surface expression of mutant channels as confirmed by immunocytochemistry."
      explanation: Identifies impaired surface expression as this allele's mechanism.
  - name: p.Arg410Trp
    description: >-
      Gating-ring substitution that destabilises the closed state. Cryo-EM of
      the analogous mutation in the orthologous nematode TAX-4 channel shows
      most channels open in the absence of ligand, so this allele is a
      gain-of-function rather than the loss-of-function it was assumed to be.
    evidence:
    - reference: PMID:35233102
      reference_title: Structural and functional characterization of an achromatopsia-associated mutation in a phototransduction channel.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "R421W disrupts this interaction, destabilizes the closed state, and stabilizes the open state."
      explanation: >-
        Structural basis for the constitutive activity of the R410W channel,
        resolved in the orthologous TAX-4 channel.
  - name: c.1710C>A (p.Ser570Arg)
    description: >-
      Novel missense allele predicted by molecular dynamics to act as a second
      gain-of-function variant.
    evidence:
    - reference: PMID:40699246
      reference_title: "Expanding the genetic spectrum of achromatopsia: novel CNGA3 and CNGB3 variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a novel missense variant in CNGA3 (c.1710C > A p.(Ser570Arg)) and a novel frameshift variant in CNGB3 (c.739_754del p.(Ala247Thrfs*27))."
      explanation: Reports the allele in an achromatopsia family.
  - name: c.1074G>A (p.Trp358Ter)
    description: >-
      Nonsense allele found in compound heterozygosity with p.Arg569His in a
      Chinese pedigree; truncating alleles are a minority of the CNGA3
      spectrum.
    evidence:
    - reference: PMID:26493561
      reference_title: Identification of novel mutations by targeted exome sequencing and the genotype-phenotype assessment of patients with achromatopsia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The compound heterozygous mutations in CNGA3 (c.1074G > A, p.W358X; c.1706G > A, p.R569H) were identified in the first proband, and a novel homozygous mutation (c.968C > A, p.A323D) was detected in the other pedigree."
      explanation: Reports the truncating allele and the compound heterozygous genotype.
  evidence:
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of all known CNGA3 mutations (39/46) are amino acid substitutions compared with only four stop-codon mutations, two 1-bp insertions and one 3-bp in-frame deletion."
    explanation: Establishes the missense-dominated CNGA3 mutation spectrum described in features.
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These four mutations account for 41.8% of all detected mutant CNGA3 alleles."
    explanation: Gives the share of mutant alleles carried by the four recurrent substitutions named in features.
  - reference: PMID:22493484
    reference_title: Endoplasmic reticulum stress-associated cone photoreceptor degeneration in cyclic nucleotide-gated channel deficiency.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the cone CNG channel subunits CNGA3 and CNGB3 account for >70% of all known cases of achromatopsia."
    explanation: >-
      Places the two channel genes as the major cause of achromatopsia. The
      quote is background in a mouse study, hence the recorded quote_role.
- name: CNGA3 accessory allele in CNGB3 disease
  gene_term:
    preferred_term: CNGA3
    term:
      id: hgnc:2150
      label: CNGA3
  relationship_type: MODIFIER
  features: >-
    A single heterozygous CNGA3 allele can worsen disease caused by the CNGB3
    p.Arg403Gln variant, giving digenic triallelic inheritance. Ten of 16
    patients homozygous or heterozygous for CNGB3 p.Arg403Gln also carried a
    mutant CNGA3 allele, and a triallelic mouse carrying one Cnga3-null allele
    on a Cngb3 p.Arg403Gln background reproduced the more severe phenotype.
    This is a modifier role in CNGB3 disease rather than CNGA3 disease, and it
    is recorded here so that a heterozygous CNGA3 finding in a CNGB3 patient is
    not read as an incidental result.
  evidence:
  - reference: PMID:30418171
    reference_title: Accessory heterozygous mutations in cone photoreceptor CNGA3 exacerbate CNG channel-associated retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In-depth genetic and clinical analysis revealed a co-occurrence of a mutant CNGA3 allele in a high proportion of these patients (10 of 16), likely contributing to the disease phenotype."
    explanation: Quantifies the accessory CNGA3 allele among CNGB3 p.Arg403Gln patients.
  - reference: PMID:30418171
    reference_title: Accessory heterozygous mutations in cone photoreceptor CNGA3 exacerbate CNG channel-associated retinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As in human subjects, there was a striking genotype-phenotype correlation, since the presence of 1 Cnga3-null allele exacerbated the cone dystrophy phenotype in Cngb3R403Q/R403Q mice."
    explanation: >-
      The triallelic mouse reproduces the human modifier effect, which is the
      experimental support for this role.
animal_models:
- name: Cnga3 knockout mouse
  species: Mouse
  genotype: Cnga3 -/-
  publication: PMID:10377453
  description: >-
    Targeted deletion of the cone CNG channel alpha subunit. The mouse has no
    cone-mediated photoresponse with a fully intact rod pathway, fails to
    transport opsin into cone outer segments, accumulates cGMP, and loses
    cones progressively from the second postnatal week, ventral retina first.
    It is the model in which AAV gene supplementation was first shown to
    restore cone vision.
  modeled_mechanisms:
  - target: Loss of Functional Cone CNG Channels
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: The targeted allele removes the same channel subunit that is lost in patients.
    limitations: >-
      Patients mostly carry missense alleles whose protein is made but
      mistrafficked or misgated, so a null allele models the functional
      endpoint rather than the molecular lesion.
    evidence:
    - reference: PMID:10377453
      reference_title: Selective loss of cone function in mice lacking the cyclic nucleotide-gated channel CNG3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By deleting the cyclic nucleotide-gated channel CNG3 we have generated a mouse lacking any cone-mediated photoresponse."
      explanation: Establishes that the knockout removes cone channel function.
  - target: Failure of the Cone Light Response
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: No cone-mediated photoresponse with a completely intact rod pathway.
    limitations: >-
      The mouse retina is rod-dominant and has no fovea, so the acuity and
      foveal consequences central to the human disease cannot be measured.
    readouts:
    - name: Cone-mediated photoresponse
      target: Failure of the Cone Light Response
      direction: ABOLISHED
      interpretation: Cone signalling is absent while rod signalling is preserved.
      evidence:
      - reference: PMID:10377453
        reference_title: Selective loss of cone function in mice lacking the cyclic nucleotide-gated channel CNG3.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast, the rod pathway is completely intact in CNG3-deficient mice."
        explanation: Records the cone-selective nature of the deficit.
  - target: Cone Outer-Segment cGMP Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      cGMP accumulates massively in the knockout retina, and opsin is not
      delivered to the outer segment.
    limitations: >-
      The cGMP time course was measured on a cone-dominant Nrl-null
      background, and no equivalent measurement exists in human CNGA3 retina.
    readouts:
    - name: Retinal cGMP level
      target: Cone Outer-Segment cGMP Accumulation
      direction: INCREASED
      interpretation: Loss of the channel leaves its own ligand to accumulate.
      evidence:
      - reference: PMID:24027293
        reference_title: "cGMP accumulation causes photoreceptor degeneration in CNG channel deficiency: evidence of cGMP cytotoxicity independently of enhanced CNG channel function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The time course study showed that the retinal cGMP level in Cnga3(-/-);Nrl(-/-) mice with CNGA3 deficiency on a cone-dominant background was sharply increased at postnatal day 8 (P8), peaked around P10-P15, remained high through P30-P60, and returned to near control level at P90."
        explanation: Gives the measured cGMP time course in the CNGA3-deficient retina.
  - target: ER Stress-Associated Cone Photoreceptor Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cones die by an ER stress-associated apoptotic pathway, with raised
      stress markers, calpain upregulation and caspase cleavage.
    limitations: >-
      Shown on a cone-dominant Nrl-null background rather than in the
      wild-type cone population, and not demonstrated in human retina.
    evidence:
    - reference: PMID:22493484
      reference_title: Endoplasmic reticulum stress-associated cone photoreceptor degeneration in cyclic nucleotide-gated channel deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, our findings suggest a crucial role of endoplasmic reticulum stress in cone degeneration associated with CNG channel deficiency."
      explanation: States the conclusion that this link relies on.
- name: CNGA3-mutant day-blind Awassi sheep
  species: Sheep
  genotype: Ovine CNGA3 p.Arg236Ter homozygous; a second allele, p.Gly540Ser, segregates in the same breed
  publication: PMID:19874885
  description: >-
    Naturally occurring day blindness in the Improved Awassi breed, caused by
    a stop-codon substitution in ovine CNGA3 and inherited recessively.
    Affected sheep have severely depressed photopic electroretinogram
    responses with no retinal degeneration on histology, so cones are present
    but silent, as in patients. The large eye makes it the model used to
    develop subretinal AAV delivery.
  modeled_mechanisms:
  - target: Failure of the Cone Light Response
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Day blindness with attenuated photopic responses and a critical flicker
      fusion frequency close to that of human achromats, in an animal whose
      cone photoreceptors survive.
    limitations: >-
      Sheep have no human-type fovea, so foveal hypoplasia and central acuity
      cannot be modelled; the first ovine allele is a stop codon whereas most
      patients carry missense alleles.
    readouts:
    - name: Photopic critical flicker fusion frequency
      target: Failure of the Cone Light Response
      direction: DECREASED
      interpretation: Cone-driven temporal resolution collapses while the cones remain present.
      evidence:
      - reference: PMID:25204753
        reference_title: "Flicker cone function in normal and day blind sheep: a large animal model for human achromatopsia caused by CNGA3 mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In all four flash intensities, CFF values were significantly lower (p < 0.0001) in day blind sheep."
        explanation: Quantifies the loss of cone-driven flicker resolution in the model.
    evidence:
    - reference: PMID:19874885
      reference_title: A mutation in gene CNGA3 is associated with day blindness in sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sequencing the coding regions of those genes from four affected and eight non-affected lambs showed that all affected lambs were homozygous for a mutation in the CNGA3 gene that changes amino acid R236 to a stop codon."
      explanation: Establishes the ovine disease as homozygous CNGA3 loss of function.
    - reference: PMID:28282490
      reference_title: Gene Augmentation Therapy for a Missense Substitution in the cGMP-Binding Domain of Ovine CNGA3 Gene Restores Vision in Day-Blind Sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histologic and immunohistochemical examination of affected sheep eyes did not reveal degeneration, and cone photoreceptors expressing CNGA3 were present."
      explanation: >-
        Confirms that the ovine cones survive and are silent, the feature that
        makes this model match the human disease.
treatments:
- name: AAV CNGA3 gene augmentation (investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal delivery of an AAV vector carrying CNGA3 under a cone-directed
    promoter. It restores cone responses, normalises cGMP and delays cone death
    in the Cnga3 knockout mouse, and has restored photopic vision in day-blind
    sheep for six years after a single injection. The first-in-human
    AAV8.CNGA3 dose-escalation trial in nine adults found no substantial
    safety problem and small gains in acuity and contrast sensitivity.
    Intravitreal delivery did not achieve clinical rescue in sheep, which is
    why the route is subretinal. There is no approved gene therapy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    target_cell_types:
    - preferred_term: retinal cone cell
      term:
        id: CL:0000573
        label: retinal cone cell
  target_mechanisms:
  - target: Failure of the Cone Light Response
    description: >-
      Supplying a functional alpha subunit is intended to restore the cone CNG
      channel and with it the cone light response.
  evidence:
  - reference: PMID:20628362
    reference_title: Restoration of cone vision in the CNGA3-/- mouse model of congenital complete lack of cone photoreceptor function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treated CNGA3(-/-) mice were able to generate cone photoreceptor responses and to transfer these signals to bipolar cells."
    explanation: >-
      Gene supplementation restores the cone response and its transmission in
      the knockout mouse.
  - reference: PMID:20628362
    reference_title: Restoration of cone vision in the CNGA3-/- mouse model of congenital complete lack of cone photoreceptor function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, expression of CNGA3 normalized cyclic guanosine monophosphate (cGMP) levels in cones, delayed cone cell death and reduced the inflammatory response of Müller glia cells that is typical of retinal degenerations."
    explanation: >-
      Treatment acts on the cGMP accumulation and cone death arms of the
      mechanism, not only on the light response.
  - reference: PMID:28596720
    reference_title: "AAV-Mediated Gene Supplementation Therapy in Achromatopsia Type 2: Preclinical Data on Therapeutic Time Window and Long-Term Effects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, we found that the therapeutic time window of opportunity for AAV-mediated Cnga3 gene supplementation therapy in the Cnga3 KO mouse model extends at least to an age of 3 months, but is presumably limited by the condition, number and topographical distribution of remaining cones at the time of treatment."
    explanation: >-
      Defines the therapeutic window in the mouse and ties it to the number of
      surviving cones.
  - reference: PMID:26087757
    reference_title: Gene Augmentation Therapy Restores Retinal Function and Visual Behavior in a Sheep Model of CNGA3 Achromatopsia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The rescue effect has so far been maintained for over 3 years in the first-treated animals, with no obvious ocular or systemic side effects."
    explanation: Durable rescue of cone function in the large-animal CNGA3 model.
  - reference: PMID:29926749
    reference_title: "Six Years and Counting: Restoration of Photopic Retinal Function and Visual Behavior Following Gene Augmentation Therapy in a Sheep Model of CNGA3 Achromatopsia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ERG Critical Flicker Fusion Frequency and flicker amplitudes at 30 and 40 Hz showed significant improvement following treatment (p < 0.0001) throughout the study."
    explanation: Extends the ovine rescue to six years of follow-up.
  - reference: PMID:32352493
    reference_title: "Safety and Vision Outcomes of Subretinal Gene Therapy Targeting Cone Photoreceptors in Achromatopsia: A Nonrandomized Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subretinal gene therapy with AAV8.CNGA3 was not associated with substantial safety problems and was associated with cone photoreceptor activation in adult patients, as reflected by visual acuity and contrast sensitivity gains."
    explanation: First-in-human safety and secondary efficacy result for CNGA3 gene augmentation.
  - reference: PMID:34853444
    reference_title: Outer retinal transduction by AAV2-7m8 following intravitreal injection in a sheep model of CNGA3 achromatopsia.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Intravitreal injection of AAV2-7m8 carrying human CNGA3 in mutant sheep resulted in mild photoreceptor transduction, but did not lead to the clinical rescue of photopic vision, while day-blind sheep treated with a subretinal injection exhibited functional recovery of photopic vision."
    explanation: >-
      Refutes the less invasive intravitreal route for this treatment; the
      subretinal route in the same model worked.
- name: Low vision aids and tinted filters
  therapeutic_modality: DEVICE
  description: >-
    Management is otherwise supportive: tinted or filtering lenses to reduce
    photophobia, low-vision aids and refractive correction, with classroom and
    occupational adjustments.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Photophobia
    description: Dark or tinted filters cut the light reaching the retina and ease photophobia.
  - target: Reduced visual acuity
    description: Low-vision aids help a patient use residual acuity; they do not change it.
  evidence:
  - reference: PMID:20301591
    reference_title: Achromatopsia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dark or special filter glasses or red-tinted contact lenses to reduce photophobia and potentially improve visual acuity; low vision aids"
    explanation: >-
      GeneReviews management of achromatopsia, which includes CNGA3-related
      (ACHM2) disease.
- name: Genetic counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance warrants counselling on recurrence risk
    and molecular confirmation of both alleles, with carrier, prenatal and
    preimplantation testing available once the family's variants are known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301591
    reference_title: Achromatopsia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews states the autosomal recessive recurrence risks used in counselling.
- name: Ophthalmologic surveillance
  therapeutic_modality: OTHER
  description: >-
    Periodic ophthalmologic examination, which also follows the outer-retinal
    changes that bear on gene-therapy candidacy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301591
    reference_title: Achromatopsia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ophthalmologic examination every six to 12 months for children and every two to three years for adults."
    explanation: GeneReviews surveillance schedule for achromatopsia.

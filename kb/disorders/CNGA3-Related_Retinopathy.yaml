    evidence_source: IN_VITRO
    snippet: "These results suggest decreased channel density in the cell membrane due to impaired folding or trafficking of the channel protein as the main pathogenic effect of the mutations R427C and R563C."
    explanation: >-
      Patch-clamp and immunocytochemistry in HEK293 cells identify impaired
      surface expression as the pathogenic effect of these alleles.
  - reference: PMID:35456423

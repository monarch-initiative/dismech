name: CNGA3-Related Retinopathy
creation_date: "2026-11-11T07:18:00Z"
category: Mendelian
description: >-
  CNGA3-related retinopathy is an autosomal recessive cone photoreceptor
  disorder caused by biallelic pathogenic variants in CNGA3, which encodes the
  alpha (ion-conducting) subunit of the cone cyclic nucleotide-gated (CNG)
  channel. That channel carries the cGMP-gated cation current of the cone outer
  segment, so cones that lack a working CNGA3 subunit survive but cannot
  generate a light response. CNGA3 was the first achromatopsia gene identified
  and is the second most common one, and its usual phenotype is complete
  achromatopsia (ACHM2): congenital loss of colour vision, poor visual acuity,
  photophobia and pendular nystagmus with absent light-adapted and preserved
  dark-adapted electroretinogram responses. Incomplete achromatopsia with
  residual cone function, and more rarely a progressive cone dystrophy, also
  occur. Unlike CNGB3 variants, which are mostly truncating, CNGA3 variants are
  predominantly missense, and they act by several routes: failure of channel
  assembly or surface delivery, altered gating, or constitutive opening of the
  channel without cGMP. This entry captures the CNGA3-specific gene-disease
  mechanism and spectrum; Achromatopsia.yaml models the ACHM2 subtype within
  the broader achromatopsia umbrella and points here.
synonyms:
- achromatopsia 2
- ACHM2
- CNGA3-related achromatopsia
- CNGA3-associated achromatopsia
- CNGA3-related cone photoreceptor disorder
- rod monochromacy (CNGA3-related)
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  CNGA3 is the ion-conducting alpha subunit of the heterotetrameric cone CNG
  channel; CNGB3 is the modulatory beta subunit. The two genes therefore sit at
  the same step of the cone cascade but are not interchangeable: CNGA3 disease
  is dominated by missense alleles, several of which produce a channel that
  reaches the membrane with altered properties or opens without cGMP, whereas
  CNGB3 disease is dominated by truncating alleles. In a Dutch cohort the
  achromatopsia subtype, acuity, colour vision and macular appearance were more
  severely affected among CNGA3 than CNGB3 genotypes, although larger pooled
  series find no genotype difference in retinal sensitivity or in the rate of
  outer-retinal structural change. Whether the disease is stationary is
  contested, and the two sides measure different things: foveal cone mosaic
  imaging and microperimetry over 2 to 7 years are stable, while
  cross-sectional OCT series show outer-retinal disruption accumulating with
  age from early childhood. The entry models the slow structural arm as its own
  node and keeps the congenital functional arm separate. Rod electroretinogram
  abnormalities accompany the cone deficit in a substantial minority of CNGA3
  patients, so a strictly normal rod response is not required for the
  diagnosis. The gain-of-function alleles are recorded on their own mechanism
  node rather than on the channel-loss node, because a spontaneously open
  channel kills cones by a route that absent current cannot explain; both
  branches converge on cone death. Foveal hypoplasia, the refractive errors and
  the rod findings (abnormal dark-adapted electroretinogram, nyctalopia) are
  left without an incoming causal edge because no cited source establishes the
  mechanism that produces them in this disease. HPO has no term for
  ellipsoid-zone or interdigitation-zone disruption, which is the OCT finding
  these cohorts actually report, so that observation is carried by the broader
  retinal thinning and macular atrophy phenotypes and in the diagnosis section.

  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.33
  notes: >-
    Achromatopsia overall affects roughly 1 in 30,000; CNGA3 accounts for
    about a quarter of patients in the United States and Europe and a much
    larger share in consanguineous Middle Eastern populations, so
    CNGA3-related disease is rarer than this figure.

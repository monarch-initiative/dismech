    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologous expression revealed that only one mutant forms functional channels, albeit with grossly altered properties, including changes in Ca2+ blockage and permeation."
    explanation: >-
      Patient CNGA3 alleles yield either no channel or a channel with grossly
      altered conduction, which is the deficit this node asserts.
- name: Constitutive Cone CNG Channel Activity
  description: >-
    A minority of CNGA3 substitutions are not loss-of-function at all. R410W
    sits in the gating ring, where the corresponding residue of the orthologous
    nematode TAX-4 channel contacts the S4 segment in the closed state; losing
    that contact destabilises the closed state and leaves the channel
    spontaneously open without cGMP. Spontaneously active channels kill cells,
    so these alleles damage cones by excess rather than absent channel
    activity. A further novel allele, Ser570Arg, is predicted by molecular
    dynamics to act the same way.
  role: central_effector
  biological_scale: MOLECULAR
  node_class: CHANNEL_CONDUCTANCE
  genes:
  - preferred_term: CNGA3
    term:
      id: hgnc:2150
      label: CNGA3
  molecular_functions:
  - preferred_term: intracellularly cGMP-activated cation channel activity
    term:
      id: GO:0005223
      label: intracellularly cGMP-activated cation channel activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: ER Stress-Associated Cone Photoreceptor Death
    causal_link_type: DIRECT
    description: >-
      Spontaneous channel activity is itself cytotoxic, converging on cone
      death from the opposite direction to channel loss.
  evidence:
  - reference: PMID:35233102
    reference_title: Structural and functional characterization of an achromatopsia-associated mutation in a phototransduction channel.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CNGA3_R410W/CNGB3 and TAX4_R421W channels are spontaneously active without cGMP and induce cell death, suggesting cone degeneration triggered by spontaneous CNG channel activity as a possible cause of achromatopsia."
    explanation: >-
      Cryo-EM and electrophysiology show the R410W channel is constitutively
      open and lethal to cells, the claim this node makes.
  - reference: PMID:40699246
    reference_title: "Expanding the genetic spectrum of achromatopsia: novel CNGA3 and CNGB3 variants."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular dynamics simulations suggest that the CNGA3 c.1710C > A p.(Ser570Arg) variant may act as a gain-of-function variant, leading to altered cyclic nucleotide-gated channel activity in cone photoreceptors."
    explanation: >-
      A second candidate gain-of-function allele. Indirect because the
      mechanism is simulated rather than recorded from a channel.
- name: Failure of the Cone Light Response
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >-
    Phototransduction in cones ends with closure of the CNG channel, so a cone
    without a working channel cannot convert the light-driven fall in cGMP
    into a change in membrane potential. Cones are present but electrically
    silent: light-adapted and flicker electroretinogram responses are absent
    or nearly so while dark-adapted, rod-driven responses are preserved.
  role: central_effector
  biological_scale: CELLULAR
  node_class: SIGNALLING_REDUCED_FAILED

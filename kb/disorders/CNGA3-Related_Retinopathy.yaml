- name: Congenital Cone Dysfunction
  conforms_to: "phototransduction_cascade_dysfunction#Congenital Non-Progressive Photoreceptor Dysfunction"
  description: >-
    The clinical outcome of silent cones, present from the first months of
    life: impaired colour discrimination along all three cone axes, poor visual
    acuity, photophobia with day blindness, and pendular nystagmus, on a

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total colourblindness (OMIM 216900), also referred to as rod monochromacy (RM) or complete achromatopsia, is a rare, autosomal recessive inherited and congenital disorder characterized by photophobia, reduced visual acuity, nystagmus and the complete inability to discriminate between colours."
    explanation: Total loss of colour discrimination is the defining feature of CNGA3 disease.
  - reference: PMID:41867372
    reference_title: Genetic phenotypic characteristics and inheritance patterns of patients with achromatopsia at a large academic institution and a review of the literature and gene therapies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients experienced difficulties with color vision, 20 of 21 (95.2%) had photosensitivity, and 18 of 21 patients reported congenital nystagmus."
    explanation: >-
      Every patient in a genetically confirmed achromatopsia cohort, mostly
      CNGA3 and CNGB3, had impaired colour vision.
- name: Reduced visual acuity

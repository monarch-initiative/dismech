- name: Cone Outer-Segment cGMP Accumulation
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  description: >-
    cGMP is the channel's own ligand, and in the CNGA3-deficient retina it
    accumulates massively, peaking in the second and third postnatal weeks in
    mouse and tracking the wave of photoreceptor apoptosis. Removing retinal
    guanylyl cyclase 1 from the same background preserves cones, which places
    the accumulated cGMP, rather than the missing cation influx, upstream of
    most of the cell death. Protein kinase G activity rises with it. The same
    cones also fail to transport opsin into the outer segment and downregulate
    other phototransduction proteins.
  role: central_effector
  biological_scale: CELLULAR
  node_class: METABOLITE_ACCUMULATION

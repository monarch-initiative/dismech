classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted or exome sequencing of the achromatopsia genes identifies
    biallelic pathogenic CNGA3 variants. Whole-genome sequencing finds
    exon-level copy-number changes in patients who otherwise carry only one
    variant.
  results: Identification of biallelic pathogenic CNGA3 variants confirms the diagnosis.
  evidence:
  - reference: PMID:20301591
    reference_title: Achromatopsia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Identification of biallelic pathogenic (or likely pathogenic) variants in ATF6, CNGA3, CNGB3, GNAT2, PDE6C, or PDE6H confirms the clinical diagnosis."
    explanation: GeneReviews states that biallelic CNGA3 variants confirm the clinical diagnosis.
  - reference: PMID:26493561
    reference_title: Identification of novel mutations by targeted exome sequencing and the genotype-phenotype assessment of patients with achromatopsia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted exome sequencing (TES) was performed on 201 disease-causing genes of inherited retinal dystrophies to screen for ACHM causative mutations in the two probands."
    explanation: Shows the panel sequencing route used to reach a CNGA3 molecular diagnosis.
  - reference: PMID:34449556
    reference_title: Disease Progression in CNGA3 and CNGB3 Retinopathy; Characteristics of Slovenian Cohort and Proposed OCT Staging Based on Pooled Data from 126 Patients from 7 Studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-genome sequencing was used to detect duplication of exon 7 in the CNGA3 gene."
    explanation: >-
      Whole-genome sequencing finds the exon-level copy-number changes that
      coding analysis misses.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  description: >-
    Light-adapted and dark-adapted full-field electroretinography separates the
    cone-selective dysfunction of CNGA3 disease from generalised retinal
    dystrophy.
  results: >-
    Absent or nearly extinguished light-adapted and flicker responses with
    preserved or mildly reduced dark-adapted responses; rod abnormalities are
    present in a substantial minority.
  evidence:
  - reference: PMID:41867372
    reference_title: Genetic phenotypic characteristics and inheritance patterns of patients with achromatopsia at a large academic institution and a review of the literature and gene therapies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic imaging showed most patients with a normal scotopic response and absent photopic response on electroretinogram, macular hyperfluorescence on fundus autofluorescence, and normal optical coherence tomography imaging."
    explanation: The expected electroretinogram pattern in a genetically confirmed cohort.
  - reference: PMID:25616768
    reference_title: "Genetics and Disease Expression in the CNGA3 Form of Achromatopsia: Steps on the Path to Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rod ERG abnormalities (in addition to cone dysfunction) were detected in 59% of patients."
    explanation: >-
      Warns that a normal rod response should not be required before accepting
      the diagnosis.
- name: Optical coherence tomography
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    Optical coherence tomography shows foveal hypoplasia, thinning and
    ellipsoid-zone or interdigitation-zone disruption, and is the measurement
    used to stage the outer retina and judge gene-therapy candidacy.
  evidence:
  - reference: PMID:20574029
    reference_title: "Progressive loss of cones in achromatopsia: an imaging study using spectral-domain optical coherence tomography."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial feature of cone cell decay was loss of inner and outer segments with disruption of the ciliary layer on OCT, which was observed as early as 8 years of age."
    explanation: Identifies the earliest optical coherence tomography finding and its age.
  - reference: PMID:40241905
    reference_title: "Clinical and genetic features of CNGA3 achromatopsia in preschool children: novel insights into retinal architecture and therapeutic window for clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinal outer layer damage was observed in 18 eyes (9 patients), with the modified classification distribution: grade 1 in 1 eye (5.6%), grade 2 in 9 eyes (50.0%), and grade 3 in 8 eyes (44.4%)."
    explanation: Shows the graded outer-retinal staging applied to CNGA3 children.
differential_diagnoses:
- name: Blue-cone monochromatism
  description: >-
    Blue-cone monochromatism overlaps through congenital poor acuity,
    infantile nystagmus, photophobia, a normal-looking fundus and severely
    impaired colour discrimination.
  distinguishing_features:
  - >-
    X-linked inheritance with mostly males affected, against autosomal
    recessive CNGA3 disease.
  - >-
    S-cone function is preserved, so blue flashes on a yellow background still
    elicit cone electroretinogram responses.
  - >-
    A four-colour plate test or two-colour filter test separates blue-cone
    monochromats from rod monochromats clinically.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A special 4-color plate test or a 2-color filter test can clinically distinguish blue-cone monochromats from achromats"
    explanation: >-
      GeneReviews lists blue-cone monochromatism in the differential diagnosis
      of achromatopsia and gives the discriminating test.
- name: Cone and cone-rod dystrophies
  description: >-
    Cone and cone-rod dystrophies overlap through reduced acuity, photophobia
    and abnormal colour vision, and CNGA3 itself rarely causes a progressive
    cone dystrophy, which makes this the hardest boundary in the differential.
  distinguishing_features:
  - >-
    Progression over time favours a cone or cone-rod dystrophy, whereas CNGA3
    achromatopsia is congenital and functionally broadly stationary.
  - >-
    Later onset without congenital nystagmus supports a cone or cone-rod
    dystrophy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Best clinical discriminator is disease progression."
    explanation: >-
      GeneReviews identifies progression as the discriminator between
      achromatopsia and cone or cone-rod dystrophies.
- name: Achromatopsia caused by another gene
  description: >-
    CNGB3, GNAT2, PDE6C, PDE6H and ATF6 produce a clinically similar
    achromatopsia, and CNGB3 is the more common cause in European and North
    American cohorts.
  distinguishing_features:
  - >-
    Only molecular testing separates them; the achromatopsia subtype, acuity
    and macular appearance do not reliably predict the gene.
  - >-
    A CNGB3 patient can also carry an accessory heterozygous CNGA3 allele, so
    finding one CNGA3 variant does not establish CNGA3 disease.
  evidence:
  - reference: PMID:19592100
    reference_title: Genetic etiology and clinical consequences of complete and incomplete achromatopsia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ACHM subtype, visual acuity, color vision, and macular appearance were equally distributed among the CNGB3 genotypes, but were more severely affected among CNGA3 genotypes."
    explanation: >-
      Shows that clinical features shift with the gene but do not identify it,
      so molecular testing is required.
prevalence:

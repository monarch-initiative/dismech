    reference_title: "Total colourblindness is caused by mutations in the gene encoding the alpha-subunit of the cone photoreceptor cGMP-gated cation channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, the segregation pattern of the mutations is consistent with the autosomal recessive inheritance of the disease and all mutations affect amino acids that are highly conserved among cyclic nucleotide gated channels (CNG) in various species."
    explanation: >-
      Establishes the lesion as missense change at conserved CNG channel
      residues in the alpha subunit.
  - reference: PMID:11536077
    reference_title: CNGA3 mutations in hereditary cone photoreceptor disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense mutations mostly affect amino acids conserved among the members of the cyclic nucleotide gated (CNG) channel family and cluster at the cytoplasmic face of transmembrane domains (TM) S1 and S2, in TM S4, and in the cGMP-binding domain."
    explanation: Gives the domain distribution of CNGA3 missense alleles stated in this node.
  - reference: PMID:26493561
    reference_title: Identification of novel mutations by targeted exome sequencing and the genotype-phenotype assessment of patients with achromatopsia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proposed topological model of the CNGA3 polypeptide suggested that the missense mutations primarily affected the transmembrane helix 5 and the cGMP-binding domain, respectively."
    explanation: >-
      Independent families place CNGA3 missense alleles in the transmembrane
      and cGMP-binding regions of the subunit.
- name: Impaired Cone CNG Channel Surface Expression
  description: >-
    Several achromatopsia-associated CNGA3 substitutions fold or traffic
    poorly, so less channel protein reaches the plasma membrane. In HEK293
    cells the R427C and R563C mutant channels gave reduced maximal cGMP
    currents that a chemical chaperone partly rescued, and three Pakistani
    missense alleles likewise showed altered membrane targeting in
    heterologous cells.
  role: central_effector
  biological_scale: MOLECULAR

- name: ER Stress-Associated Cone Photoreceptor Death
  description: >-
    Cones lacking a functional CNG channel die by an endoplasmic reticulum
    stress-associated apoptotic pathway. On a cone-dominant background,
    CNGA3-deficient retina shows raised ER stress markers, calpain
    upregulation and caspase cleavage, together with nuclear translocation of
    apoptosis-inducing factor. In the CNGA3 knockout mouse the loss begins in
    the second postnatal week and clears the ventral retina first.
  role: central_effector
  biological_scale: CELLULAR
  node_class: CELL_DEATH

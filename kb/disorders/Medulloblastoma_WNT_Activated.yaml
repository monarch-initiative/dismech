notes: >-
  WNT-activated medulloblastoma has the most favorable prognosis of all medulloblastoma
  molecular subgroups, with 5-year progression-free and overall survival exceeding 90%.
  This outcome is thought to be aided by enhanced systemic chemotherapy penetration
  across its fenestrated intratumoral vasculature and has motivated prospective
  de-escalation trials evaluating reduced craniospinal radiation and tailored
  chemotherapy intensity to mitigate neurocognitive, audiologic, and endocrine late
  effects.

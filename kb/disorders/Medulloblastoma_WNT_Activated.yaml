name: Medulloblastoma, WNT-Activated
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Medulloblastoma, WNT-activated, is a molecularly defined subgroup of medulloblastoma
  characterized by activation of the WNT/beta-catenin signaling pathway, typically
  through somatic CTNNB1 (beta-catenin) exon 3 mutations or germline APC mutations.
  This subgroup represents approximately 10% of medulloblastomas and has the most
  favorable prognosis of all molecular subgroups, with >95% long-term survival.
  WNT-activated tumors arise from lower rhombic lip progenitors, have classic
  histology, and are characterized by nuclear beta-catenin accumulation, monosomy 6,
  and expression of WNT target genes including DKK1 and AXIN2. Treatment de-escalation
  trials are exploring reduced-intensity therapy to minimize long-term toxicity.
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Molecularly Defined Tumor
- Embryonal Tumor
synonyms:
- WNT-activated medulloblastoma
- WNT medulloblastoma
- WNT-subgroup medulloblastoma
- Wingless-activated medulloblastoma
parents:
- medulloblastoma
has_subtypes:
- name: WNT-Activated Medulloblastoma with CTNNB1 Mutation
  description: >-
    The most common form, with somatic activating mutations in CTNNB1 exon 3
    that prevent beta-catenin phosphorylation and degradation. Sporadic, not
    associated with germline predisposition.
- name: WNT-Activated Medulloblastoma with APC Mutation
  description: >-
    Associated with Turcot syndrome (APC germline mutation) in CTNNB1-wildtype
    cases. APC normally promotes beta-catenin degradation; biallelic loss leads
    to canonical WNT pathway activation. Patients require genetic counseling and
    surveillance for familial adenomatous polyposis.
pathophysiology:
- name: CTNNB1 Exon 3 Activating Mutation in Lower Rhombic Lip Progenitors
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  description: >-
    Somatic gain-of-function point mutations in CTNNB1 exon 3 (affecting GSK3B
    phosphorylation residues at codons 32, 33, 34, 37, 41, or 45) occur in ~85-96%
    of WNT-activated medulloblastomas arising in lower rhombic lip neural progenitor
    cells, abolishing beta-catenin destruction-complex phosphorylation and proteasomal
    degradation.
  evidence:
  - reference: PMID:40967259
    reference_title: "Evolving Biology and Therapy of WNT-Activated Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "These tumors originate from progenitor cells in the lower rhombic lip, leading to a characteristic anatomical location: midline, often involving the fourth ventricle and dorsal brainstem."
    explanation: "Identifies lower rhombic lip progenitor cells as the developmental cell of origin of WNT-activated medulloblastoma."
  - reference: PMID:40967259
    reference_title: "Evolving Biology and Therapy of WNT-Activated Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "nearly all cases harbor either somatic CTNNB1 mutations or germline APC mutations."
    explanation: "Establishes somatic CTNNB1 mutations as the primary initiating canonical WNT lesion in WNT-activated medulloblastoma."
  - reference: PMID:33405951
    reference_title: "Outcomes by Clinical and Molecular Features in Children With Medulloblastoma Treated With Risk-Adapted Therapy: Results of an International Phase III Trial (SJMB03)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in CTNNB1 (96%), DDX3X (37%), and SMARCA4 (24%) were most common in WNT tumors"
    explanation: "Quantifies somatic CTNNB1 driver prevalence (96%) in molecularly confirmed WNT-activated medulloblastoma in the SJMB03 trial."

- name: Nuclear Beta-Catenin Accumulation
  biological_scale: CELLULAR
  description: >-
    Stabilized beta-catenin accumulates in tumor cell nuclei and complexes with TCF/LEF
    transcription factors to constitutively transactivate canonical WNT target genes
    (including AXIN2, DKK1, MYC, and CCND1), serving both as the core oncogenic
    transcriptional program and as a diagnostic immunohistochemical hallmark.
  evidence:
  - reference: PMID:21267586
    reference_title: "Medulloblastoma: clinicopathological correlates of SHH, WNT, and non-SHH/WNT molecular subgroups."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoreactivity (IR) for GAB1 characterizes only SHH tumors and nuclear IR for β-catenin only WNT tumors."
    explanation: "Demonstrates that nuclear beta-catenin accumulation uniquely characterizes WNT-subgroup medulloblastoma."
  - reference: PMID:17172831
    reference_title: "Wnt/Wingless pathway activation and chromosome 6 loss characterize a distinct molecular sub-group of medulloblastomas associated with a favorable prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cases displaying evidence of Wnt/Wg activation (CTNNB1 mutation and/or beta-catenin nuclear stabilisation) were exclusively associated with a distinct genomic signature involving loss of an entire copy of chromosome 6 but few other aberrations (p < 0.001)."
    explanation: "Links CTNNB1 mutation and nuclear beta-catenin stabilization to canonical WNT pathway activation in human primary medulloblastomas."

- name: APC Inactivation in Lower Rhombic Lip Progenitors
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE_AND_SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    In CTNNB1-wildtype WNT-activated medulloblastomas (~5-10%), germline pathogenic
    APC variants (associated with familial adenomatous polyposis / Turcot syndrome)
    coupled with somatic second-hit APC inactivation disrupt the beta-catenin
    destruction complex in lower rhombic lip neural progenitor cells, preventing
    beta-catenin phosphorylation and proteasomal degradation.
  evidence:
  - reference: PMID:40967259
    reference_title: "Evolving Biology and Therapy of WNT-Activated Medulloblastoma."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "nearly all cases harbor either somatic CTNNB1 mutations or germline APC mutations."
    explanation: "Establishes germline APC mutations as the principal alternative initiating lesion in CTNNB1-wildtype WNT-activated medulloblastoma."
  - reference: DOI:10.1007/s11910-023-01316-9
    reference_title: Recent Advances in Pediatric Medulloblastoma
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "WNT-activated tumors have pathognomonic nuclear staining for beta catenin. This can reflect an activating mutation in CTNNB1 or an inactivating mutation of the APC gene, both of which serve to ramp up WNT signaling."
    explanation: "Confirms that APC inactivation converges with activating CTNNB1 mutation on nuclear beta-catenin accumulation and canonical WNT pathway activation."

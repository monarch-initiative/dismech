- name: DDX3X Somatic Mutation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Recurrent somatic mutations in the DEAD-box RNA helicase DDX3X (37% in the
    SJMB03 cohort) co-occur with CTNNB1 mutations and functionally cooperate with
    mutant beta-catenin by potentiating TCF promoter transactivation and enhancing
    medulloblastoma cell viability.
  evidence:
  - reference: PMID:22820256
    reference_title: "Medulloblastoma exome sequencing uncovers subtype-specific somatic mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that mutant DDX3X potentiates transactivation of a TCF promoter and enhances cell viability in combination with mutant, but not wild-type, β-catenin."
    explanation: "Demonstrates functional cooperation between somatic DDX3X mutations and mutant beta-catenin in potentiating TCF transactivation and tumor cell viability."
  - reference: PMID:33405951
    reference_title: "Outcomes by Clinical and Molecular Features in Children With Medulloblastoma Treated With Risk-Adapted Therapy: Results of an International Phase III Trial (SJMB03)."

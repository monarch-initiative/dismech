inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic ABCD3 variants. The index patient was homozygous for a 1758 bp genomic
    deletion, born to consanguineous parents, with both parents confirmed carriers; the
    second reported child was compound heterozygous for two previously unreported variants.
    Penetrance and expressivity are recorded as UNKNOWN rather than complete and
    consistent: with two reported families there is no unaffected biallelic carrier to
    argue from and no phenotypic range to characterise, so any stronger statement would
    be an inference from an n of two rather than an observation.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed a homozygous deletion at the DNA level of 1758bp, predicted to result in a truncated ABCD3 protein lacking the C-terminal 24 amino acids (p.Y635NfsX1)."
    explanation: Establishes the homozygous biallelic genotype in the index patient.
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous mutations were found in the ABCD3 gene at exon 10: C.846C>G (p.Y282Ter) and intron 21: C.1845+9G>A (p.?)."
    explanation: >-
      A second, independent biallelic genotype - compound heterozygous rather than
      homozygous - in a child with cholestatic liver disease.
genetic:
- name: ABCD3
  gene_term:
    preferred_term: ABCD3
    term:
      id: hgnc:67
      label: ABCD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ABCD3 encodes PMP70, one of the three peroxisomal-membrane ABC half-transporters.
    Both reported genotypes are predicted to abolish the transporter: a homozygous 1758 bp
    deletion removing exon 24 and part of the 3' UTR, truncating the protein by its
    C-terminal 24 residues, and a compound heterozygous pair comprising a nonsense allele
    and an intronic variant near a splice site.
  evidence:
  - reference: PMID:34198763
    reference_title: "Peroxisomal ABC Transporters: An Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The defects of ABCD1 and ABCD3 are responsible for two genetic disorders called X-linked adrenoleukodystrophy and congenital bile acid synthesis defect 5, respectively."
    explanation: >-
      A review that assigns CBAS5 to ABCD3 and, in the same sentence, assigns the
      neighbouring peroxisomal ABC transporter ABCD1 to a different disease. Graded OTHER
      because it is a narrative review of transporter biology, not a study.
  - reference: PMID:41428872
    reference_title: "Molecular mechanism of substrate transport by human peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in ABCD3 are associated with defects in congenital bile acid synthesis."
    explanation: >-
      A structural study of purified human ABCD3 that states the gene-disease relationship
      its work is motivated by.
  variants:
  - name: "ABCD3 c.1903-573_*1108del (p.Tyr635AsnfsTer1)"
    description: >-
      Homozygous 1758 bp genomic deletion removing exon 24 and part of the 3' UTR in the
      index patient, predicted to truncate the protein by its C-terminal 24 amino acids.
      Both parents were carriers.
    type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25168382
      reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis revealed a homozygous deletion at the DNA level of 1758bp, predicted to result in a truncated ABCD3 protein lacking the C-terminal 24 amino acids (p.Y635NfsX1)."
      explanation: Reports the variant, its zygosity and its predicted protein consequence.
  - name: "ABCD3 c.846C>G (p.Tyr282Ter) and c.1845+9G>A"
    description: >-
      Compound heterozygous pair reported in a second child with cholestasis; both alleles
      were novel at the time of report. `clinical_significance` is deliberately left unset:
      the publication calls them suspected pathogenic variants associated with the
      phenotype, which is not a completed ACMG classification, and recording either
      PATHOGENIC or UNCERTAIN_SIGNIFICANCE would assert a call the source did not make.
    type: compound_heterozygous
    evidence:
    - reference: PMID:41179737
      reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compound heterozygous mutations were found in the ABCD3 gene at exon 10: C.846C>G (p.Y282Ter) and intron 21: C.1845+9G>A (p.?)."
      explanation: Reports both alleles and their compound heterozygous configuration.
pathophysiology:
- name: ABCD3 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect"
  description: >-
    Biallelic loss-of-function ABCD3 variants remove PMP70 from the peroxisomal membrane.
    In the index patient's fibroblasts, immunofluorescence and immunoblot showed loss of
    the transporter while ABCD1 and PEX14 were present, and the peroxisomes themselves were
    fewer and enlarged but still competent to import matrix protein. This node enters the
    peroxisomal module by its transporter arm: the organelle is assembled, and it is one
    substrate route into it that is lost.
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in the index patient; the second reported child was compound
      heterozygous, so the zygosity recorded here is that of the better-characterised
      genotype rather than a property of the disease.
  molecular_functions:
  - preferred_term: peroxisomal ABC-type acyl-CoA transporter activity (PMP70/ABCD3)
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0015607
      label: ABC-type fatty-acyl-CoA transporter activity
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  biological_processes:
  - preferred_term: peroxisome number and size are abnormal, while matrix import is preserved
    modifier: ABNORMAL
    term:
      id: GO:0007031
      label: peroxisome organization
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of peroxisomal parameters in skin fibroblasts revealed a reduced number of enlarged import-competent peroxisomes."
    explanation: >-
      Establishes that the organelle is present and import-competent, which is what
      separates this lesion from a peroxisome biogenesis defect.
  downstream:
  - target: Failure of Peroxisomal Import of C27 Bile Acid and Branched-Chain Acyl-CoA Esters
    description: >-
      Loss of the transporter removes the route by which its substrates cross the
      peroxisomal membrane.
    evidence:
    - reference: PMID:41428872
      reference_title: "Molecular mechanism of substrate transport by human peroxisomal ABCD3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ABCD3 facilitates the transport of a broad spectrum of substrates, including branched-chain fatty acids, very long-chain fatty acids, bile salt intermediates, and dicarboxylic acids as CoA adducts."
      explanation: >-
        Cryo-EM and ATPase work on purified human ABCD3 naming the substrate spectrum that
        loss of the transporter withdraws.
- name: Failure of Peroxisomal Import of C27 Bile Acid and Branched-Chain Acyl-CoA Esters
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    The CoA thioesters of DHCA and THCA, and of 2-methyl branched-chain fatty acids such
    as pristanic acid, are no longer delivered into the peroxisomal matrix. The failure is
    substrate-selective: beta-oxidation of the very-long-chain fatty acid C26:0 was normal
    in the index patient's fibroblasts, so the straight-chain very-long-chain route into
    the organelle is not the one that is lost.
  biological_processes:
  - preferred_term: import of acyl-CoA esters into the peroxisomal matrix
    modifier: DECREASED
    term:
      id: GO:0015916
      label: fatty-acyl-CoA transport
  cellular_components:
  - preferred_term: peroxisomal matrix
    term:
      id: GO:0005782
      label: peroxisomal matrix
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peroxisomal beta-oxidation of C26:0 was normal, but beta-oxidation of pristanic acid was reduced."
    explanation: >-
      The functional signature of a selective import failure in patient fibroblasts:
      branched-chain substrate handling is impaired while straight-chain very-long-chain
      handling is not.
  - reference: PMID:39223112
    reference_title: "Structural insights into human ABCD3-mediated peroxisomal acyl-CoA translocation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The transport of branched-chain fatty acids from cytosol to peroxisome is specifically driven by ABCD3, dysfunction of which causes severe liver diseases such as hepatosplenomegaly."
    explanation: >-
      Structural work assigning branched-chain acyl-CoA import specifically to ABCD3 and
      linking its dysfunction to liver disease.
  downstream:
  - target: Block of Peroxisomal Side-Chain Shortening of C27 Bile Acid Intermediates
    description: >-
      The beta-oxidation enzymes that shorten the C27 side chain are inside the matrix, so
      an import failure is functionally equivalent to a block of the pathway they carry.
  - target: Reduced Peroxisomal Beta-Oxidation of Branched-Chain Fatty Acids
    description: >-
      The same import failure withdraws pristanoyl-CoA from the branched-chain
      beta-oxidation spiral.
- name: Block of Peroxisomal Side-Chain Shortening of C27 Bile Acid Intermediates
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Bile acid synthesis is completed inside the peroxisome: the C27 intermediates DHCA and
    THCA must be shortened by beta-oxidation to the C24 primary bile acids. With their
    import blocked, that terminal step cannot run, and the pathway fails in both
    directions at once - substrate backs up and product is not made.
  biological_processes:
  - preferred_term: peroxisomal side-chain beta-oxidation of C27 bile acid intermediates
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  - preferred_term: bile acid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006699
      label: bile acid biosynthetic process
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our studies show that ABCD3 is involved in transport of branched-chain fatty acids and C27 bile acids into the peroxisome and that this is a crucial step in bile acid biosynthesis"
    explanation: >-
      The authors' own conclusion placing the ABCD3 transport step inside the bile acid
      synthetic pathway.
  downstream:
  - target: Accumulation of C27 Bile Acid Intermediates
    description: The unmetabolised substrates accumulate in plasma and tissue.
  - target: Deficient Formation of Mature C24 Primary Bile Acids
    description: The product of the blocked step is not made.
- name: Reduced Peroxisomal Beta-Oxidation of Branched-Chain Fatty Acids
  role: parallel branch
  biological_scale: MOLECULAR
  description: >-
    Pristanic acid beta-oxidation was reduced to 59 percent of control activity in the
    index patient's fibroblasts, and Abcd3 knockout mice accumulate phytanic acid when
    phytol-loaded. This arm is biochemically real but was clinically silent in the index
    patient, whose plasma phytanic and pristanic acid concentrations were within the
    reference range; no branched-chain-fatty-acid phenotype is recorded for this disease,
    which is why the node is a branch and not part of the chain to the clinical
    manifestations.
  biological_processes:
  - preferred_term: branched-chain fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abcd3-/- mice accumulated the branched chain fatty acid phytanic acid after phytol loading."
    explanation: >-
      The branched-chain arm demonstrated in the knockout mouse under phytol challenge.
      Graded MODEL_ORGANISM because this specific result is the mouse experiment.
- name: Accumulation of C27 Bile Acid Intermediates
  role: effector
  biological_scale: ORGANISM
  description: >-
    DHCA and THCA accumulate to concentrations far above the reference range - in the index
    patient they were the striking abnormality of the plasma bile acid profile, and in
    Abcd3 knockout mice they rose in liver, bile and intestine. C27 intermediates are the
    species held responsible for hepatocellular injury across the bile acid synthesis
    defects.
  chemical_entities:
  - preferred_term: dihydroxycholestanoic acid (DHCA)
    modifier: INCREASED
    term:
      id: CHEBI:16577
      label: 3alpha,7alpha-dihydroxy-5beta-cholestan-26-oic acid
  - preferred_term: trihydroxycholestanoic acid (THCA)
    modifier: INCREASED
    term:
      id: CHEBI:18402
      label: 3alpha,7alpha,12alpha-trihydroxy-5beta-cholestan-26-oic acid
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with hepatosplenomegaly and severe liver disease and showed a striking accumulation of peroxisomal C27-bile acid intermediates in plasma."
    explanation: The accumulation measured in the index patient's plasma.
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, ABCD3 deficiency and acyl-CoA-oxidase 2 deficiency are characterized by these metabolite abnormalities."
    explanation: >-
      A clinical mass-spectrometry study that treats DHCA/THCA accumulation as the
      characteristic metabolite abnormality of ABCD3 deficiency.
  downstream:
  - target: Hepatocellular Injury and Cholestasis
    description: >-
      Retained C27 intermediates are the injurious species; the link is the same one
      invoked across the bile acid synthesis defects rather than a mechanism dissected in
      an ABCD3-deficient liver.
- name: Deficient Formation of Mature C24 Primary Bile Acids
  role: effector
  biological_scale: ORGANISM
  description: >-
    The product side of the block. This is demonstrated in the mouse, where C24 bile acids
    fell as the C27 intermediates rose. It is deliberately not asserted for the index
    patient, whose plasma cholic and chenodeoxycholic acid concentrations were above, not
    below, the reference range while she was receiving ursodeoxycholic acid - so the human
    plasma profile does not show a C24 deficit and should not be read as though it did.
  chemical_entities:
  - preferred_term: cholic acid
    modifier: DECREASED
    term:
      id: CHEBI:16359
      label: cholic acid
  - preferred_term: chenodeoxycholic acid
    modifier: DECREASED
    term:
      id: CHEBI:16755
      label: chenodeoxycholic acid
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "analysis of bile acids revealed a reduction of C24 bile acids, whereas C27-bile acid intermediates were significantly increased in liver, bile and intestine of Abcd3-/- mice"
    explanation: >-
      The C24 deficit as measured in Abcd3 knockout mouse tissue. Graded MODEL_ORGANISM
      because the reduction was measured in the mouse and not in the patient.
  downstream:
  - target: Hepatocellular Injury and Cholestasis
    description: >-
      Loss of the mature bile acid pool removes the principal osmotic driver of bile flow.
      Inferred from bile acid physiology; not separately measured in an ABCD3-deficient
      patient.
- name: Hepatocellular Injury and Cholestasis
  role: effector
  biological_scale: TISSUE
  description: >-
    Cholestatic hepatocellular injury with a normal gamma-glutamyltransferase. Both
    reported children had raised transaminases, raised serum bile acids and conjugated
    hyperbilirubinaemia with a normal GGT; the index patient's liver biopsy showed minimal
    intracanalicular and intracytoplasmic cholestasis with normal interlobular bile ducts
    and no ductular reaction.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical features included elevated transaminases, CBIL, and total serum bile acids, while GGT levels remained normal."
    explanation: >-
      The biochemical pattern in the second reported child: hepatocellular and cholestatic
      injury with a normal GGT.
  downstream:
  - target: Progressive Hepatic Fibrosis and Cirrhosis
    description: Sustained injury drives fibrogenesis in the liver parenchyma.
  - target: Cholestasis
  - target: Conjugated hyperbilirubinemia
  - target: Increased serum bile acid concentration
  - target: Elevated circulating hepatic transaminase concentration
  - target: Jaundice
  - target: Pruritus
  - target: Hepatosplenomegaly
- name: Progressive Hepatic Fibrosis and Cirrhosis
  role: consequence
  biological_scale: TISSUE
  description: >-
    Fibrosis was present on the index patient's liver biopsy at 18 months and had become
    micronodular cirrhosis in the hepatectomy specimen at four years; the second reported
    child had transient elastography in the mild-to-moderate fibrosis range. The
    intervening cellular steps - stellate cell activation and matrix deposition - are not
    separately documented for this disease and are not asserted here.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver transient elastography showed an average liver stiffness of 9.2 kPa, indicating mild to moderate fibrosis."
    explanation: >-
      Non-invasive measurement of fibrosis in the second reported child, independent of the
      index patient's histology.
  downstream:
  - target: Portal Hypertension and Hepatic Decompensation
    description: Cirrhosis raises portal resistance and exhausts hepatic reserve.
  - target: Hepatic fibrosis
  - target: Cirrhosis
- name: Portal Hypertension and Hepatic Decompensation
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The index patient developed umbilical collaterals, oesophageal varices and
    hepatopulmonary syndrome after three years of age, with pancytopenia attributed to
    hypersplenism and bleeding attributed to hepatic dysfunction, and reached decompensated
    cirrhosis requiring transplantation at four years.
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver disease progressed and the patient required liver transplantation at 4 years of age but expired shortly after transplantation."
    explanation: The clinical endpoint of the decompensation, as reported for the index patient.
  downstream:
  - target: Portal hypertension
  - target: Esophageal varix
  - target: Pancytopenia
  - target: Abnormality of coagulation

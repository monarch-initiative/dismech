biochemical:
- name: Plasma C27 bile acid intermediates (DHCA and THCA)
  notes: >-
    The diagnostic analytes. They are undetectable in controls, so any measurable
    concentration is abnormal, and in ABCD3 deficiency they are the dominant species of the
    plasma bile acid profile. They do not distinguish CBAS5 from the other peroxisomal
    causes of C27 intermediate accumulation on their own.
  evidence:
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all controls, THCA and DHCA levels were below the detection limit."
    explanation: >-
      Establishes that these analytes are absent in controls, which is what makes their
      presence informative.
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, ABCD3 deficiency and acyl-CoA-oxidase 2 deficiency are characterized by these metabolite abnormalities."
    explanation: >-
      Names ABCD3 deficiency as one of the two peroxisomal disorders characterised by these
      intermediates - and names the other one, which is why the finding is not specific.

treatments:
- name: Liver Transplantation
  description: >-
    The only intervention with a reported outcome in this disease, and the outcome was
    poor: the index patient was transplanted at four years for decompensated cirrhosis with
    hepatopulmonary syndrome and died five days later of respiratory complications. It is
    a rescue for end-stage liver disease, not a treatment of the metabolic defect - though
    because the enzymes and the transporter are hepatic, transplantation would be expected
    to correct hepatic bile acid synthesis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver disease progressed and the patient required liver transplantation at 4 years of age but expired shortly after transplantation."
    explanation: >-
      The single reported treatment outcome: transplantation performed, and death shortly
      afterwards.
  target_mechanisms:
  - target: Progressive Hepatic Fibrosis and Cirrhosis
    description: >-
      Replaces the cirrhotic organ. It does not act on the transport lesion in any other
      tissue.
- name: Ursodeoxycholic Acid
  description: >-
    Given to the index patient at 10 mg/kg/day from two years of age, before the metabolic
    diagnosis was made, and her disease progressed to cirrhosis and transplantation on
    treatment. That is one patient and does not establish that ursodeoxycholic acid is
    ineffective in this disease, but it is the only reported experience of it. Plasma
    ursodeoxycholic acid was correspondingly the highest-concentration bile acid species in
    her profile, which is a treatment effect and not a feature of the disease.
  therapeutic_modality: SMALL_MOLECULE

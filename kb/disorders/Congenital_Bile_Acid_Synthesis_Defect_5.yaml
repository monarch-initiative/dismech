      based on in the index family.
differential_diagnoses:
- name: Congenital bile acid synthesis defect 6 (ACOX2 deficiency)
  disease_term:
    preferred_term: congenital bile acid synthesis defect 6
    term:
      id: MONDO:0015015
      label: congenital bile acid synthesis defect 6
  description: >-
    The closest biochemical mimic. ACOX2 catalyses the first beta-oxidation step on the
    C27 side chain, immediately downstream of the ABCD3 import step, so it raises the same
    DHCA and THCA. The plasma profile cannot separate the two; the fibroblast acyl-CoA
    oxidase measurement and the gene can.
  distinguishing_features:
  - Both raise plasma DHCA and THCA, so the bile acid profile alone does not discriminate.
  - >-
    The discriminator is the gene, and at the protein level the absence of ABCD3 itself
    from the peroxisomal membrane. The fibroblast enzyme panel run in the ABCD3-deficient
    patient measured acyl-CoA oxidase 1, which is the straight-chain oxidase and not the
    branched-chain and bile-acid oxidase encoded by ACOX2, so it does not settle this
    differential.
  evidence:
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, ABCD3 deficiency and acyl-CoA-oxidase 2 deficiency are characterized by these metabolite abnormalities."
    explanation: Names the two disorders that share this metabolite signature.
- name: Zellweger spectrum disorders
  disease_term:
    preferred_term: Zellweger spectrum disorders
    term:
      id: MONDO:0019609
      label: Zellweger spectrum disorders
  description: >-
    The peroxisome biogenesis disorders also raise C27 bile acid intermediates, but by a
    generalised lesion: matrix protein import fails, so very-long-chain fatty acid
    beta-oxidation and ether-phospholipid synthesis fail alongside the bile acid pathway.
  distinguishing_features:
  - >-
    Peroxisomes were import-competent in the ABCD3-deficient patient, which a biogenesis
    disorder is defined by not being.
  - >-
    C26:0 beta-oxidation was normal in the ABCD3-deficient patient; it is impaired in the
    generalised biogenesis disorders.
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of peroxisomal parameters in skin fibroblasts revealed a reduced number of enlarged import-competent peroxisomes."
    explanation: >-
      Import competence is the observation that separates this disease from a peroxisome
      biogenesis disorder.
- name: Adrenoleukodystrophy (ABCD1)
  disease_term:
    preferred_term: adrenoleukodystrophy
    term:
      id: MONDO:0018544
      label: adrenoleukodystrophy
  description: >-
    The neighbouring peroxisomal ABC transporter. ABCD1 loss impairs very-long-chain fatty
    acid import and produces adrenal and central nervous system disease; ABCD3 loss spares
    the very-long-chain route and produces liver disease. The two are listed together
    because the gene names invite the confusion, not because the diseases resemble each
    other.
  distinguishing_features:
  - ABCD1 is X-linked; ABCD3 disease is autosomal recessive.
  - >-
    ABCD1 was present in the peroxisomal membrane of the ABCD3-deficient patient's
    fibroblasts, and C26:0 beta-oxidation was normal in them.
  evidence:
  - reference: PMID:34198763
    reference_title: "Peroxisomal ABC Transporters: An Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The defects of ABCD1 and ABCD3 are responsible for two genetic disorders called X-linked adrenoleukodystrophy and congenital bile acid synthesis defect 5, respectively."
    explanation: >-
      Assigns the two transporters to two different diseases in one sentence. Graded OTHER
      because it is a narrative review.
- name: Congenital bile acid synthesis defect 1 (HSD3B7 deficiency)
  disease_term:
    preferred_term: congenital bile acid synthesis defect 1
    term:
      id: MONDO:0011906
      label: congenital bile acid synthesis defect 1
  description: >-
    The commonest of the bile acid synthesis defects and the one a low-GGT cholestatic
    infant is most likely to have. It is a cytosolic/microsomal enzyme defect early in the
    pathway, so it does not raise C27 intermediates and does not produce a peroxisomal
    functional abnormality.
  distinguishing_features:
  - >-
    Shares the low-GGT cholestatic presentation, so the clinical picture does not
    discriminate.
  - >-
    The accumulating species differ: 3beta-hydroxy-Delta5 intermediates rather than the
    C27 cholestanoic acids DHCA and THCA.
- name: Progressive familial intrahepatic cholestasis
  disease_term:
    preferred_term: progressive familial intrahepatic cholestasis
    term:
      id: MONDO:0015762
      label: progressive familial intrahepatic cholestasis
  description: >-
    The other major low-GGT cholestatic group of infancy. These are canalicular export and
    tight-junction defects rather than synthesis defects, and the direction of the bile
    acid abnormality is the discriminator.
  distinguishing_features:
  - >-
    Serum bile acids are markedly raised in PFIC because export fails; in this disease the
    informative abnormality is the presence of C27 intermediates that controls do not have
    at all.
  - >-
    A plasma bile acid profile that quantifies DHCA and THCA separates the two; a total
    bile acid measurement does not.
animal_models:
- species: Mouse
  genotype: Abcd3 knockout (Abcd3-/-)
  description: >-
    The Abcd3 knockout mouse was the pre-existing model the founding report used to
    corroborate its patient. It reproduces the bile acid lesion directly - C24 bile acids
    fall while C27 intermediates rise in liver, bile and intestine - and reproduces the
    branched-chain arm under phytol challenge. A separately generated CRISPR-Cas9 knockout
    has since been used to characterise the transporter's role in dicarboxylic fatty acid
    metabolism and hepatic lipid homeostasis, a phenotype dimension with no counterpart in
    the two reported human patients.
  publication: PMID:25168382
  modeled_mechanisms:

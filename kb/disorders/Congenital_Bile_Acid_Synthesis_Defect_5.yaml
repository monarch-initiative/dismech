    Present in both reported children. In the index patient the liver was palpable 5-6 cm
    and the spleen 7-8 cm below the costal margins at 18 months, and both organs later
    enlarged further; the second child presented with hepatosplenomegaly together with
    jaundice and pruritus.
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:25168382

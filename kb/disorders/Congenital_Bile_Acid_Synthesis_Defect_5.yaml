progression:
- phase: Infancy and early childhood
  notes: >-
    The index patient had normal developmental milestones and grew normally, with
    hepatosplenomegaly noticed at one year and severe anaemia, coagulopathy and raised
    transaminases at eighteen months. Fibrosis was already present on biopsy at that point.
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with hepatosplenomegaly and severe liver disease and showed a striking accumulation of peroxisomal C27-bile acid intermediates in plasma."
    explanation: The presenting picture of the index patient.
- phase: Decompensated cirrhosis
  notes: >-
    After three years of age the index patient developed severe portal hypertension and
    hepatopulmonary syndrome, deteriorated rapidly at four years before a metabolic
    diagnosis had been made, was transplanted, and died five days later of respiratory
    complications.
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver disease progressed and the patient required liver transplantation at 4 years of age but expired shortly after transplantation."
    explanation: The reported endpoint of the index patient's course.
diagnosis:
- name: Plasma bile acid profiling by mass spectrometry
  description: >-
    The step that makes the diagnosis reachable. Quantifying DHCA and THCA by liquid
    chromatography-mass spectrometry separates the peroxisomal bile acid synthesis defects
    from every other cause of infantile cholestasis, because these C27 intermediates are
    below the detection limit in controls. It does not by itself identify ABCD3 as the
    lesion: acyl-CoA oxidase 2 deficiency and the Zellweger-spectrum disorders raise the
    same analytes. In the index patient the abnormal bile acid profile, combined with
    abnormal very-long-chain fatty acid ratios, is what prompted the peroxisomal workup.
  markers: >-
    DHCA (3alpha,7alpha-dihydroxy-5beta-cholestan-26-oic acid) and THCA
    (3alpha,7alpha,12alpha-trihydroxy-5beta-cholestan-26-oic acid); total serum bile acids;
    serum gamma-glutamyltransferase, which stays normal.
  diagnosis_term:
    preferred_term: plasma bile acid intermediate profiling by liquid chromatography-mass spectrometry
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all controls, THCA and DHCA levels were below the detection limit."
    explanation: >-
      The control data that make a measurable concentration diagnostic rather than merely
      abnormal.
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, ABCD3 deficiency and acyl-CoA-oxidase 2 deficiency are characterized by these metabolite abnormalities."
    explanation: >-
      Names ABCD3 deficiency as characterised by this profile, and in the same sentence
      names the other disorder that shares it - which is why the test localises the
      pathway, not the gene.
- name: Peroxisomal function studies in cultured skin fibroblasts
  description: >-
    What distinguishes an ABCD3 transport defect from a biogenesis defect and from the
    enzyme defects of the same pathway. In the index patient, catalase immunofluorescence
    showed matrix-import-competent peroxisomes that were fewer and enlarged; ABCD3 was
    absent from the peroxisomal membrane while ABCD1 and PEX14 were present; C26:0
    beta-oxidation was normal while pristanic acid beta-oxidation was reduced; and acyl-CoA
    oxidase 1, D-bifunctional protein, sterol carrier protein X and
    dihydroxyacetonephosphate acyltransferase activities were all reported as normal.
    Acyl-CoA oxidase 2 was not part of that panel.
  markers: >-
    Peroxisomal C26:0 and pristanic acid beta-oxidation rates; ABCD3 immunofluorescence and
    immunoblot; catalase immunofluorescence for peroxisome number and morphology;
    plasmalogens; DHAPAT, ACOX1, D-bifunctional protein and SCPx activities.
  diagnosis_term:
    preferred_term: peroxisomal function studies in cultured fibroblasts
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peroxisomal beta-oxidation of C26:0 was normal, but beta-oxidation of pristanic acid was reduced."
    explanation: >-
      The discriminating pair of measurements: a selective branched-chain defect with the
      straight-chain very-long-chain route intact.
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of peroxisomal parameters in skin fibroblasts revealed a reduced number of enlarged import-competent peroxisomes."
    explanation: >-
      Import-competent peroxisomes are what exclude a peroxisome biogenesis disorder as the
      explanation for the biochemical profile.
- name: ABCD3 sequencing, within a gene panel or by exome sequencing
  description: >-
    Both reported genotypes were reached by sequencing, and each illustrates a different
    detection problem. The index patient's allele is a 1758 bp deletion removing an exon
    and part of the 3' UTR, which is a copy-number lesion rather than a coding
    substitution; the second child's alleles were a nonsense variant and a near-splice-site
    intronic variant found on exome sequencing in a child whose liver disease was
    otherwise unexplained.
  markers: >-
    Biallelic ABCD3 variants. Note that a deletion of this size needs copy-number calling
    or genome sequencing rather than coding-exon analysis alone.
  diagnosis_term:
    preferred_term: ABCD3 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous mutations were found in the ABCD3 gene at exon 10: C.846C>G (p.Y282Ter) and intron 21: C.1845+9G>A (p.?)."
    explanation: >-
      The second reported diagnosis, made by exome sequencing in an unexplained pediatric
      liver disease cohort.

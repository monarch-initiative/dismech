discussions:
- discussion_id: cbas5-primary-bile-acid-replacement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does oral primary bile acid replacement alter the course of ABCD3 deficiency, as it
    does in the enzyme-defect bile acid synthesis disorders?
  attaches_to:
  - treatments#
  - pathophysiology#Accumulation of C27 Bile Acid Intermediates
  rationale: >-
    The mechanistic case is straightforward and unproven. Replacing the missing primary
    bile acids restores the FXR-mediated feedback that suppresses CYP7A1, which should
    reduce flux into the pathway and so reduce production of the C27 intermediates that
    accumulate. That argument is generic to the bile acid synthesis defects and does not
    depend on where the block sits, so it applies to a transport lesion as readily as to an
    enzyme lesion. What is missing is any reported use in ABCD3 deficiency: the index
    patient received ursodeoxycholic acid rather than a primary bile acid and progressed to
    transplantation, and no treatment was reported for the second child. Evidence that
    primary bile acid supplementation lowers these intermediates exists for the peroxisome
    biogenesis disorders, which is a different lesion in the same pathway.
  evidence:
  - reference: PMID:36511274
    reference_title: "Development of a system adapted for the diagnosis and evaluation of peroxisomal disorders by measuring bile acid intermediates."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with ZSD, levels of bile acid intermediates can be lowered by a primary bile acid supplementation treatment; therefore, measuring their levels could help evaluate treatment effectiveness."
    explanation: >-
      Supports the premise of the open question - that primary bile acid supplementation
      lowers these intermediates - in Zellweger spectrum disorder, not in ABCD3 deficiency.
      Marked INDIRECT because carrying it across to this disease requires the inference that
      the feedback argument is lesion-independent, which is exactly what is unproven.
- discussion_id: cbas5-branched-chain-arm-is-clinically-silent
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does the branched-chain fatty acid arm of ABCD3 deficiency ever become clinically
    manifest, for example with age, with a phytanic-acid-rich diet, or in a patient who
    survives the liver disease?
  attaches_to:
  - pathophysiology#Reduced Peroxisomal Beta-Oxidation of Branched-Chain Fatty Acids
  rationale: >-
    ABCD3 imports branched-chain acyl-CoA esters as well as the C27 bile acid intermediates,
    and the biochemical defect in that arm is demonstrable: pristanic acid beta-oxidation
    was reduced in the index patient's fibroblasts, and the knockout mouse accumulates
    phytanic acid when phytol-loaded. Yet the index patient's plasma phytanic and pristanic
    acid concentrations were within the reference range and she had no neurological
    phenotype, dying of liver disease at four. Whether that is because the arm is
    metabolically well compensated, because dietary phytol intake in a young child is low,
    or simply because neither reported patient lived long enough or was old enough for it
    to declare, cannot be settled from two patients.
  evidence:
  - reference: PMID:25168382
    reference_title: "A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abcd3-/- mice accumulated the branched chain fatty acid phytanic acid after phytol loading."
    explanation: >-
      Shows that the branched-chain arm is a real substrate deficit that a dietary load can
      unmask, which is what makes the human question live.
- discussion_id: cbas5-fibrogenic-mechanism-unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what cellular route do retained C27 bile acid intermediates produce hepatic fibrosis
    in ABCD3 deficiency?
  attaches_to:
  - pathophysiology#Progressive Hepatic Fibrosis and Cirrhosis
  rationale: >-
    Fibrosis is the outcome that determines the prognosis, and its cellular mechanism has
    not been studied in this disease. The index patient's biopsy is informative as a
    negative: the interlobular bile ducts were normal and there was no ductular reaction,
    with pericellular and portal fibrosis instead - a hepatocyte-centred rather than
    cholangiocyte-driven pattern, and the opposite of what the classic cholangiopathies
    show. Whether hepatic stellate cells are activated, and by what signal from the injured
    hepatocyte, is unmeasured; the knockout mouse has not been reported to develop fibrosis,
    so there is no model result to fall back on either.
notes: >-
  Which parent the mechanism is built on. MONDO gives MONDO:0014564 two parents,
  MONDO:0018841 (congenital bile acid synthesis defect) and MONDO:0100372 (disorder of
  peroxisomal transporter). This entry builds its causal chain on the second, and the
  reason is that the first names a consequence while the second names the lesion. The
  molecular defect is loss of a peroxisomal membrane ABC transporter, and no enzyme of the
  pathway was found to be impaired: the founding report states that the peroxisomal
  beta-oxidation enzyme activities it assayed - acyl-CoA oxidase 1, D-bifunctional protein
  and sterol carrier protein X - were normal, and the peroxisomes themselves were
  import-competent for matrix protein. That panel did not include acyl-CoA oxidase 2, the
  branched-chain and bile-acid oxidase, so the enzymes of the C27 side-chain spiral were
  assayed only in part. What fails is delivery of substrate
  across the membrane to enzymes that are present and working. Filing the pathophysiology
  under bile acid synthesis would put the first node at a step that is not broken.
  Why the entry is nonetheless named and classified as a bile acid synthesis defect.
  ABCD3 carries several substrate classes, and only one of them produces disease here.
  Very-long-chain fatty acid handling is preserved: peroxisomal beta-oxidation of C26:0 was
  normal in the index patient's fibroblasts, and her plasma C26:0 was within the reference
  interval - the raised C26/C22 and C24/C22 ratios came from a low C22:0 denominator rather
  than from C26:0 accumulation. Ether-phospholipid synthesis is preserved: the activity of
  dihydroxyacetonephosphate acyltransferase, the first committed enzyme of that pathway,
  was normal, as were fibroblast plasmalogen levels. The branched-chain arm is
  biochemically impaired but was clinically silent, with normal plasma phytanic and
  pristanic acid. So of everything ABCD3 transports, the C27 bile acid intermediates are
  the substrate whose retention produces the phenotype, and the disease that results is a
  bile acid synthesis defect reached by a transport route. Both parents are therefore
  correct, and they are recorded as broadMatch mappings rather than resolved in favour of
  one.
  Module conformance, and where it deliberately stops. The trigger node conforms to
  peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect, entering that
  module by its single-transporter arm. It does not conform to that module's central
  effector, "Toxic Fatty-Acid Accumulation with Ether-Lipid Deficiency", because the
  ether-lipid half of that claim does not hold here - DHAPAT activity and fibroblast
  plasmalogens were normal - and asserting it would curate a normal analyte as deficient.
  The hepatic half of the chain is likewise not conformed to cholestatic_liver_injury,
  whose central effector is bile acid-mediated injury of hepatocytes and cholangiocytes
  running through a ductular reaction. The only liver histology reported for this disease
  shows normal interlobular bile ducts with no ductular reaction, so the cholangiocyte hub
  that module is built around is precisely what the biopsy did not find. That is a
  judgement made from one biopsy in one patient and should be revisited if further
  histology becomes available.
  The species split in the evidence. The accumulation half of the biochemical lesion is
  human; the deficiency half is mouse. DHCA and THCA were grossly raised in the index
  patient's plasma, but her cholic and chenodeoxycholic acid concentrations were above,
  not below, their reference intervals. Her plasma ursodeoxycholic acid was the highest
  concentration in the profile and many times its reference interval, which indicates she
  was on ursodeoxycholic acid when the sample was taken. The reduction
  of C24 bile acids that completes the mechanistic picture was measured in Abcd3 knockout
  mouse liver, bile and intestine. The corresponding node records this and is graded
  MODEL_ORGANISM for that reason.
review_notes: >-
  Snippet sourcing. Evidence from PMID:25168382 is quoted from the abstract wherever
  possible. The paper's case narrative, biochemical table and fibroblast results carry
  detail that the abstract does not - the normal GGT, the normal DHAPAT activity and
  plasmalogens, the normal plasma phytanic and pristanic acid, the low C22:0 behind the
  abnormal very-long-chain ratios, the ursodeoxycholic acid dose, the absent ductular
  reaction - and that detail informs the descriptions and `notes` here. Those passages
  were read in the cached record but are largely not quotable as exact substrings, because
  the cached text of this paper comes from a PDF whose extraction breaks words across
  end-of-line hyphens and uses ligature characters. Where such a claim appears in prose
  without a snippet beside it, that is why; the underlying measurement is in the paper.
  Deep research. A claude_code deep-research run was performed and is committed under
  research/. Its citations were not usable: it attributed eleven claims about this disease
  to PMID:25326392, which is a zebrafish glucocerebrosidase study in the same journal and
  year as the founding ABCD3 paper, not the founding paper itself (PMID:25168382). Its
  term suggestions included HP:0031994, which is Bronchial breath sound and not a bile acid
  term, and the obsolete GO:0043433. Neither was bound. The report was used only as a
  checklist of topics; every reference and CURIE in this entry was resolved independently.

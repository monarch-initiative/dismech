    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with hepatosplenomegaly and severe liver disease and showed a striking accumulation of peroxisomal C27-bile acid intermediates in plasma."
    explanation: Hepatosplenomegaly as the presenting sign in the index patient.
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is worth noting that one patient with cholestasis presented with hepatosplenomegaly, jaundice, and pruritus."
    explanation: >-
      The presentation of the second reported child, in whom compound heterozygous ABCD3
      variants were then identified.
- category: Gastrointestinal
  name: Cholestasis
  description: >-
    Cholestasis with a normal gamma-glutamyltransferase, which is the pattern shared with
    the other congenital bile acid synthesis defects and which separates this group from
    the high-GGT cholestatic disorders.
  phenotype_term:
    preferred_term: Cholestasis
    term:
      id: HP:0001396
      label: Cholestasis
  evidence:
  - reference: PMID:41179737
    reference_title: "Clinical characteristics and genetic causes of unexplained pediatric liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a cholestatic child carrying a novel ABCD3 mutation showed a unique phenotype (liver fibrosis with normal GGT)"
    explanation: Cholestasis with fibrosis and a normal GGT in the second reported child.
- category: Laboratory

name: Congenital Bile Acid Synthesis Defect 5
category: Mendelian
creation_date: '2026-09-08T07:30:00Z'
synonyms:
- CBAS5
- ABCD3 deficiency
- peroxisomal ABCD3 deficiency
- PMP70 deficiency
- ABCD3 congenital bile acid synthesis defect
description: >-
  Congenital bile acid synthesis defect 5 (CBAS5) is an autosomal recessive disorder
  caused by biallelic loss-of-function variants in ABCD3, which encodes the peroxisomal
  membrane ABC half-transporter PMP70. ABCD3 carries the CoA thioesters of 2-methyl
  branched-chain fatty acids and of the C27 bile acid intermediates dihydroxycholestanoic
  acid (DHCA) and trihydroxycholestanoic acid (THCA) from the cytosol into the peroxisomal
  matrix, where side-chain beta-oxidation shortens them to the mature C24 primary bile
  acids. The lesion is therefore a transport failure, not an enzyme failure: the peroxisome
  is assembled and import-competent, and the enzymes of the beta-oxidation spiral are
  present and active, but their substrates never reach them.
  The block is selective. Peroxisomal beta-oxidation of the very-long-chain fatty acid
  C26:0 and the first committed enzyme of ether-phospholipid synthesis were both normal
  in the index patient's fibroblasts, so this is not the generalized two-sided peroxisomal
  lesion of the biogenesis disorders; what fails is the branched-chain and C27-bile-acid
  substream, and it is the bile acid arm that produces the disease. Clinically that arm
  presents as a cholestatic liver disease of infancy and early childhood - hepatosplenomegaly,
  jaundice, elevated transaminases and raised serum bile acids with a normal
  gamma-glutamyltransferase - which progresses to hepatic fibrosis and cirrhosis. The
  index patient reached decompensated cirrhosis and was transplanted at four years of age.
  A second, independently reported child carried compound heterozygous ABCD3 variants and
  the same low-GGT cholestatic-fibrotic pattern, so the entity rests on two families.

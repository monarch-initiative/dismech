- name: Aberrant Cranial Neural Crest Specification and Migration
  biological_scale: CELLULAR
  description: >-
    In zebrafish embryos, mRNA encoding the mutant PACS1 induces craniofacial
    cartilage defects, most likely in a dominant-negative fashion, through
    aberrant specification and migration of SOX10-positive cranial neural crest
    cells, while enteric neural crest is spared. In transfected cells the mutant
    protein forms cytoplasmic aggregates with increased stability. This is the
    proposed basis of the facial gestalt. The model is overexpression of human
    mRNA in fish, and the result predates the HDAC6 mechanism; how the two
    connect has not been tested.

- name: Altered Cortical Network Activity
  biological_scale: TISSUE
  description: >-
    Mature PACS1(+/R203W) glutamatergic neurons and cortical organoids
    differentiated from isogenic stem cells show reduced expression of synaptic
    signaling genes and prolonged network bursts with longer interspike
    intervals on multielectrode arrays and calcium imaging. Neural precursors
    show few changes, so the deficit appears with neuronal maturation. Organoid
    proteomics converge on the same developmental processes and on known
    neurodevelopmental disorder and autism risk genes. This node is the
    proposed substrate for intellectual disability, autism and seizures; no
    study has yet connected a specific circuit change to a specific clinical
    feature.

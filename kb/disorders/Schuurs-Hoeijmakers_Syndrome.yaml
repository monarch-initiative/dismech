    reference_title: PACS1 syndrome mutation disrupts dynein-mediated cargo transport via HDAC6 and BICD2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that PACS1R203W-HDAC6 recruits the adaptor BICD2, forming a complex that disperses the Golgi and impairs dynein function. Cargo motility assays revealed that PACS1R203W reduces dynein initiation frequency and velocity, defects rescued by HDAC6 inhibition or by expressing the dynein regulator Lis1."
    explanation: Direct measurement of impaired dynein transport and its HDAC6 dependence.
  downstream:

pathophysiology:
- name: PACS1 Arg203 Gain-of-Function Substitution
  biological_scale: MOLECULAR
  description: >-
    The recurrent c.607C>T p.(Arg203Trp) substitution, and the rarer
    p.(Arg203Gln) at the same residue, lie in the furin-binding region (FBR,
    residues 101-273) of PACS1. NMR of the FBR shows that a central unstructured
    segment of PACS1 folds back across the FBR and contacts a positively charged
    loop that contains Arg203; this intramolecular contact restrains the
    PACS1-HDAC6 interaction, and the tryptophan substitution disrupts it. The
    allele is therefore a gain of function. Consistent with this, a three-generation
    family heterozygous for a deletion of PACS1 exons 12-24 lacked the facial
    gestalt, intellectual disability and brain anomalies of the syndrome.
  genes:
  - preferred_term: PACS1
    term:
      id: hgnc:30032
      label: PACS1
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:41858172
    reference_title: The R203W substitution drives PACS-1 syndrome by disrupting intramolecular regulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We present the solution structure of a chimeric PACS-1 FBR and use NMR to demonstrate that the PACS-1/HDAC6 interaction is regulated by an intramolecular mechanism involving the central unstructured region of PACS-1 folding back across the FBR and engaging in contacts with an extended, positively charged loop. The R203W substitution, located in this loop, disrupts this regulatory interaction"
    explanation: Structural basis for why Arg203 substitution releases an autoinhibitory contact.
  - reference: PMID:37848409
    reference_title: Neural deficits in a mouse model of PACS1 syndrome are corrected with PACS1- or HDAC6-targeting therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we use patient fibroblasts, patient-derived NPCs, and mouse models to show that PACS1 is an in vivo effector of HDAC6 and that the R203W substitution represents a gain-of-function (GOF) mutation that increases the interaction between PACS1 and HDAC6 to aberrantly potentiate enzyme activity."
    explanation: Patient cells and knock-in mice establish the allele as gain of function.
  - reference: PMID:34373684
    reference_title: "A Novel Multi-Exon Deletion of PACS1 in a Three-Generation Pedigree: Supplements to PACS1 Neurodevelopmental Disorder Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "This study might supplement the spectrum of PACS1-NDD and demonstrates that the loss of function variation in PACS1 displays no contributions to the typical SHMS which is caused by the recurrent c.607C > T (p.Arg203Trp) variant."
    explanation: >-
      A heterozygous PACS1 deletion does not cause the syndrome, which argues
      against haploinsufficiency; the gain-of-function reading follows by
      exclusion.
  - reference: PMID:41279321
    reference_title: The Structural Basis for Pacs1-Wdr37 Complex Assembly and Stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This pathogenic mutation lies on a solvent-exposed surface of the FBR and does not disrupt complex formation. Instead, Pacs1-R203W remains dependent on Wdr37 for stability and its levels can be reduced through targeted Wdr37 proteolytic degradation."
    explanation: >-
      Cryo-EM of the Pacs1-Wdr37 complex places Arg203 on a solvent-exposed
      surface of the FBR, so the variant leaves the WDR37 complex intact rather
      than destabilizing PACS1.

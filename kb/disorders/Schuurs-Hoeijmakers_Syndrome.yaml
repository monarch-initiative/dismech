- name: Dendritic Overarborization with Reduced Spines and Synapses
  biological_scale: CELLULAR
  description: >-
    In PACS1 syndrome mice, prefrontal cortical neurons carry more elaborate
    dendrites that are beaded with varicosities and have fewer spines and fewer
    functional synapses. Antisense oligonucleotides against PACS1 or HDAC6, or
    HDAC6 inhibitors, restore neuronal structure and synaptic transmission. The
    increased arborization was not seen in isogenic human iPSC-derived cortical
    neurons, whose deficit was in network activity instead, so the dendritic
    branching component is not settled across model systems.

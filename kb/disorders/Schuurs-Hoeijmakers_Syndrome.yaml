- name: PACS1-Targeting Antisense Oligonucleotide (preclinical)
  description: >-
    A Pacs1-specific 2'-O-methoxyethyl gapmer antisense oligonucleotide given
    intracerebroventricularly to newborn Pacs1 R201W/+ mice (R201W is the mouse
    equivalent of human R203W) depleted PACS1 and rescued excitatory synaptic
    transmission. Pacs1 loss itself did not disturb synapses in the same study,
    which is the rationale for lowering PACS1 in patients. Not tested in
    patients.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: PACS1
      term:
        id: hgnc:30032
        label: PACS1
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: PACS1 Arg203 Gain-of-Function Substitution
  evidence:
  - reference: PMID:37848409
    reference_title: Neural deficits in a mouse model of PACS1 syndrome are corrected with PACS1- or HDAC6-targeting therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment of the mice with antisense oligonucleotides (ASOs) that deplete HDAC6 or PACS1 restores both neuronal structure and communication, suggesting PACS1R203W/HDAC6 underlies PACS1 syndrome neuronal pathology and that this NDD may be treatable with targeted therapies."
    explanation: Preclinical rescue in mice.
  - reference: PMID:37848409
    reference_title: Neural deficits in a mouse model of PACS1 syndrome are corrected with PACS1- or HDAC6-targeting therapy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, these findings suggest Pacs1 loss does not significantly disturb excitatory or inhibitory synapses, supporting the development of a PACS1 ASO strategy for patient therapy."
    explanation: Lowering PACS1 is tolerated at the synapse, the safety premise of the approach.
  - reference: PMID:37848409

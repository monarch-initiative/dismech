animal_models:
- name: PACS1 R203W conditional knock-in mouse
  species: Mouse
  genotype: Cre-inducible PACS1 R203W expression (R26P1R203W), and Emx1-Cre-induced Pacs1 R201W/+ knock-in (mouse equivalent of R203W)
  publication: PMID:37848409
  description: >-
    Mice expressing PACS1 R203W reproduce the neuronal Golgi, dendrite, spine
    and synaptic phenotypes, which antisense depletion of Hdac6 or PACS1
    rescues. A standard germline Pacs1 R201W knock-in was embryonic lethal, so
    expression was restricted to forebrain neurons. Craniofacial and systemic
    features were not the subject of the study.
  modeled_mechanisms:
  - target: Dendritic Overarborization with Reduced Spines and Synapses
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the dendrite, spine and synapse phenotype and its HDAC6 dependence.
    limitations: >-
      Increased arborization was not reproduced in isogenic human iPSC-derived
      neurons, so this component may be species- or system-specific.
    evidence:
    - reference: PMID:37848409
      reference_title: Neural deficits in a mouse model of PACS1 syndrome are corrected with PACS1- or HDAC6-targeting therapy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consequently, PACS1R203W/HDAC6 causes neuronal deficits in patient-derived cells and mouse models of PACS1 syndrome, including increased dendrite arborization together with reductions in spine density and synaptic strength."
      explanation: The model shows the node's phenotype.
- name: C. elegans pacs-1 knock-in of PACS1 syndrome variants
  species: Caenorhabditis elegans
  genotype: PACS1 and PACS2 syndrome variants edited into cePACS-1
  publication: PMID:39031646
  description: >-
    Editing the PACS1 and PACS2 syndrome variants into the single worm PACS
    ortholog changes protein localization in several cell types including
    neurons. Worm PACS-1 and WDR-37 are mutually required for expression.
  modeled_mechanisms:
  - target: PACS1 Arg203 Gain-of-Function Substitution
    relationship: MEASURES
    fidelity: LOW
    model_scale: CELLULAR
    description: Shows that the variant alters the protein's subcellular localization in vivo.
    limitations: >-
      The worm has one PACS gene standing for both PACS1 and PACS2, and the
      readout is protein localization, not any of the downstream HDAC6, Golgi
      or synaptic phenotypes.
    evidence:
    - reference: PMID:39031646
      reference_title: PACS-1 variant protein is aberrantly localized in Caenorhabditis elegans model of PACS1/PACS2 syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We further show that editing in PACS1 and PACS2 variants in cePACS-1 changes protein localization in multiple cell types, including neurons."
      explanation: In vivo localization effect of the edited variant.
experimental_models:
- name: Isogenic PACS1(+/R203W) iPSC-derived neurons and cortical organoids
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Stem cells edited to carry the variant and differentiated to glutamatergic
    neurons and cortical organoids, used for transcriptomics, proteomics,
    calcium imaging and multielectrode array recording.
  modeled_mechanisms:
  - target: Altered Cortical Network Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Measures the network-burst phenotype in human neurons.
    limitations: >-
      In vitro networks lack the developing brain's cell diversity and
      connectivity; how prolonged bursting maps onto seizures or cognition is
      not established.
    readouts:
    - name: Network burst duration on multielectrode array
      target: Altered Cortical Network Activity
      direction: INCREASED
      interpretation: Variant neurons show prolonged network bursts.
      evidence:
      - reference: PMID:38280846
        reference_title: iPSC-derived models of PACS1 syndrome reveal transcriptional and functional deficits in neuron activity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "To characterize these effects, we performed both calcium imaging in organoids and multielectrode array (MEA) recording of iPSC-derived neurons and found a prolonged network burst duration in PACS1(+/R203W) cells."
        explanation: The measurement behind the readout.
  - target: Dendritic Overarborization with Reduced Spines and Synapses
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    description: No difference in dendritic arborization by Sholl analysis.
    limitations: >-
      A negative morphological result in one in vitro system; spine density and
      synapse number were not the readout.
    evidence:
    - reference: PMID:38280846
      reference_title: iPSC-derived models of PACS1 syndrome reveal transcriptional and functional deficits in neuron activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Sholl analysis was performed since neuron projection development was a strongly implicated pattern in DEGs (Fig. 3c, d, f) but did not reveal differences in dendritic arborization"
      explanation: Human neurons did not show the increased arborization seen in mouse.
differential_diagnoses:
- name: PACS2-related developmental and epileptic encephalopathy (DEE66)
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 66
    term:
      id: MONDO:0054845
      label: developmental and epileptic encephalopathy, 66
  distinguishing_features:
  - >-
    Caused by a recurrent de novo PACS2 variant in the paralog; neonatal-onset
    epileptic encephalopathy with cerebellar dysgenesis, where seizures in
    PACS1 syndrome are milder and not a defining feature. The facial features
    overlap.
  evidence:
  - reference: PMID:33369122
    reference_title: Coloboma may be a shared feature in a spectrum of disorders caused by mutations in the WDR37-PACS1-PACS2 axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our review of the phenotypes of three human disorders caused by WDR37, PACS1, and PACS2 mutations showed a significant overlap of epilepsy, intellectual disability, cerebellar atrophy, and facial features."
    explanation: Overlap among the three disorders of the WDR37-PACS1-PACS2 axis.
  - reference: PMID:40869285
    reference_title: "AI-Based Facial Phenotyping Supports a Shared Molecular Axis in PACS1-, PACS2-, and WDR37-Related Syndromes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In addition to consistently recognizing SHMS as a distinct clinical entity, the algorithms frequently matched DEE66 and NOCGUS, suggesting a shared facial gestalt."
    explanation: Facial analysis distinguishes SHMS but often matches it to DEE66 and NOCGUS.
- name: Neurooculocardiogenitourinary syndrome (WDR37)
  disease_term:
    preferred_term: neurooculocardiogenitourinary syndrome
    term:
      id: MONDO:0032850
      label: neurooculocardiogenitourinary syndrome
  distinguishing_features:
  - >-
    De novo WDR37 variants; WDR37 is PACS1's strongest interactor and the
    syndrome shares intellectual disability, facial dysmorphism and coloboma.
  evidence:
  - reference: PMID:33369122
    reference_title: Coloboma may be a shared feature in a spectrum of disorders caused by mutations in the WDR37-PACS1-PACS2 axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo heterozygous mutations in WDR37 have been shown to cause a novel human disorder, neurooculocardiogenitourinary syndrome (NOCGUS syndrome) (OMIM #618652), characterized by intellectual disability, facial dysmorphism, and coloboma."
    explanation: Phenotypic overlap with the WDR37 disorder.
notes: >-
  A GeneReviews chapter exists (PACS1-Related Neurodevelopmental Disorder,
  PMID:32672908) and its abstract is the phenotype baseline here. Brain
  malformations are reported in most individuals imaged in the delineating
  cohort (12 of 16) but differ between individuals, so they are recorded under
  one general brain-morphology phenotype rather than as specific anomalies.

prevalence:
- population: Published case reports and series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About 87 published cases by 2023. This is a literature case count, not a
    population prevalence. A 2026 review counts about 158 published patients,
    but that figure spans the PACS1, PACS2 and WDR37 disorders together and is
    not used here.
  evidence:
  - reference: PMID:37747683
    reference_title: Genetic characterization of Schuurs-Hoeijmakers syndrome in a moroccan individual with heterozygote PACS1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 87 cases have been recorded to date, and oddly enough, the majority of them share the same mutation"
    explanation: Literature case count in 2023.
genetic:
- name: PACS1
  gene_term:
    preferred_term: PACS1
    term:
      id: hgnc:30032
      label: PACS1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    A heterozygous missense variant at Arg203, nearly always c.607C>T
    p.(Arg203Trp) and rarely c.608G>A p.(Arg203Gln), causes the syndrome.
  evidence:
  - reference: PMID:34517877
    reference_title: "PACS1-Neurodevelopmental disorder: clinical features and trial readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is one other pathogenic mutation reported in the PACS1 gene, R203Q (p.608G > A), in one patient; it is the same amino acid that is changed, resulting, as for the R203W mutation, in the loss of a positive charge"
    explanation: Both known pathogenic alleles change the same arginine.
  - reference: PMID:41882293
    reference_title: DNA methylation signature and clinical delineation of PACS1-related disorder in 24 unreported individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PACS1-related disorder (PACS1-RD), also known as Schuurs-Hoeijmakers syndrome, is a rare autosomal dominant neurodevelopmental disorder predominantly caused by the recurrent de novo c.607 C > T p.(Arg203Trp) gain-of-function variant."
    explanation: The recurrent allele and its gain-of-function character.
  notes: >-
    Intragenic PACS1 deletions are not an established cause: a heterozygous
    deletion of exons 12-24 segregated in a three-generation family without the
    syndrome's face, intellectual disability or brain anomalies.
diagnosis:

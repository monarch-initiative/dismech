name: Schuurs-Hoeijmakers Syndrome
creation_date: "2026-10-28T22:23:34Z"
category: Mendelian
synonyms:
- PACS1 syndrome
- PACS1-related neurodevelopmental disorder
- PACS1-NDD
- PACS1-related disorder
- SHMS
description: >-
  Autosomal dominant neurodevelopmental disorder caused in nearly every reported
  individual by one recurrent de novo missense variant in PACS1, c.607C>T
  p.(Arg203Trp), with a second substitution at the same residue, p.(Arg203Gln),
  in a few individuals. PACS1 is a cytoplasmic sorting protein that routes cargo
  between endosomes, the trans-Golgi network and the endoplasmic reticulum.
  Affected individuals have mild to moderate intellectual disability with language
  more affected than motor skills, a recognizable face (hypertelorism,
  downslanting palpebral fissures, bulbous nasal tip, wide mouth with downturned
  corners, thin upper lip, widely spaced teeth), seizures in about half, and
  variable congenital malformations of the heart, brain, eye, kidney and
  genitalia, with feeding difficulties and constipation. The variant acts by gain
  of function rather than by loss of PACS1: the substituted arginine sits in a
  regulatory loop of the furin-binding region, and its loss strengthens the
  PACS1-HDAC6 interaction, potentiates HDAC6 deacetylase activity, reduces
  alpha-tubulin acetylation and impairs dynein-driven transport, fragmenting the
  Golgi in neurons. A heterozygous multi-exon PACS1 deletion does not reproduce
  the syndrome. Treatment is supportive; allele-specific RNA silencing and HDAC6
  inhibition are preclinical.

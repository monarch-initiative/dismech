name: SPTAN1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T19:10:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 5
- DEE5
- EIEE5
- SPTAN1 encephalopathy
- Early infantile epileptic encephalopathy 5
description: >-
  SPTAN1-related developmental and epileptic encephalopathy (DEE5) is caused by de
  novo in-frame deletions and duplications in the last two spectrin repeats of
  alpha-II spectrin, the region required for alpha/beta spectrin heterodimer
  nucleation. The mutant protein still binds beta-spectrin but forms thermolabile
  heterodimers that aggregate, sequestering wild-type subunits - a dominant-negative
  mechanism rather than haploinsufficiency, which is why the position and type of
  variant, not merely its presence, determines whether a person develops this severe
  phenotype or one of the much milder SPTAN1 disorders. Aggregates disrupt the axon
  initial segment and its ankyrin-G and sodium-channel clustering, and inhibitory
  innervation is reduced. Clinically this produces West syndrome with hypsarrhythmia,
  cerebral hypomyelination, spastic quadriplegia, acquired microcephaly and profound
  developmental impairment, with brainstem and cerebellar atrophy as imaging
  hallmarks.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 5
  term:
    id: MONDO:0013277
    label: developmental and epileptic encephalopathy, 5
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and de novo. The mechanism is dominant-negative rather than
    haploinsufficient, which is a stronger statement than "dominant" alone and is
    evidenced by heterozygous null mice being unaffected.
  evidence:
  - reference: PMID:36831804
    reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "no haploinsufficiency-related phenotypes unfold in heterozygous Spna2 deficient mice"
    explanation: >-
      Losing one copy is not sufficient to cause disease in mice, which is the
      observation that separates a dominant-negative mechanism from a dose effect.

pathophysiology:
- name: De Novo In-Frame SPTAN1 Variant in the Heterodimerization Repeats
  biological_scale: MOLECULAR
  description: >-
    An in-frame deletion or duplication in the last two spectrin repeats of the
    C-terminal region, the site at which alpha/beta spectrin heterodimer nucleation
    begins. Position and variant type are both load-bearing here: only in-frame
    changes in this region produce the severe phenotype, which is why this node names
    the region rather than simply recording "a SPTAN1 variant".
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two subjects, an in-frame 3 bp deletion and a 6 bp duplication in SPTAN1 were found at the initial nucleation site of the alpha/beta spectrin heterodimer."
    explanation: >-
      Locates the original variants precisely at the heterodimer nucleation site.
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region lead to dominant negative effects and these specific phenotypes."
    explanation: >-
      States the region- and type-specificity that makes this node's framing necessary
      rather than pedantic.
  downstream:
  - target: Thermolabile Alpha/Beta Spectrin Heterodimers
    causal_link_type: DIRECT
    description: >-
      Mutant alpha-II still assembles with beta-II spectrin, but the resulting
      heterodimer is unstable.

- name: Thermolabile Alpha/Beta Spectrin Heterodimers
  biological_scale: MOLECULAR
  description: >-
    Mutant and wild-type alpha-II spectrin both assemble heterodimers with beta-II
    spectrin, but the mutant heterodimers are thermolabile. This is a distinct node
    from the aggregation it leads to, and the distinction matters: assembly is not
    blocked, so the defect is in the stability of a complex that does form, not in
    failure to form one.
  molecular_functions:
  - preferred_term: spectrin binding
    term:
      id: GO:0030507
      label: spectrin binding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant mutant (mut) and wild-type (WT) alpha-II spectrin could assemble heterodimers with beta-II spectrin, but alpha-II (mut)/beta-II spectrin heterodimers were thermolabile compared with the alpha-II (WT)/beta-II heterodimers."
    explanation: >-
      The biophysical measurement, and the explicit statement that assembly itself
      still occurs.
  downstream:
  - target: Spectrin Heterodimer Aggregation
    causal_link_type: DIRECT
    description: >-
      Unstable heterodimers accumulate as aggregates.

- name: Spectrin Heterodimer Aggregation
  biological_scale: CELLULAR
  description: >-
    Mutant heterodimers aggregate in neurons and in patient-derived cells. This is the
    dominant-negative step: the mutant product does not merely fail, it captures
    partner subunits into aggregates, which is why one mutant allele is worse than one
    absent allele.
  cellular_components:
  - preferred_term: spectrin
    term:
      id: GO:0008091
      label: spectrin
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transient expression in mouse cortical neurons revealed aggregation of alpha-II (mut)/beta-II and alpha-II (mut)/beta-III spectrin heterodimers, which was also observed in lymphoblastoid cells from two subjects with in-frame mutations."
    explanation: >-
      Shows aggregation in both a heterologous neuronal system and in cells taken from
      affected individuals, which is what makes it more than an overexpression
      artefact.
  - reference: PMID:29337302
    reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, patient-derived neurons displayed aggregation of spectrin complexes."
    explanation: >-
      Independent confirmation in patient-derived neurons rather than transfected
      cells.
  downstream:
  - target: Axon Initial Segment Disruption
    causal_link_type: DIRECT
    description: >-
      Aggregates disrupt the periodic submembranous lattice at the axon initial
      segment.
  - target: Reduced Inhibitory Innervation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inhibitory innervation falls when alpha-II spectrin function is lost, by a route
      that has not been mapped.
  - target: Disrupted Dendritic and Axonal Development
    causal_link_type: DIRECT
    description: >-
      Neuronal process development is altered in the same systems.

- name: Axon Initial Segment Disruption
  biological_scale: CELLULAR
  description: >-
    Alpha-II spectrin partners with beta-IV spectrin to form the periodic cytoskeleton
    of the axon initial segment. Aggregation disrupts that lattice and, with it, the
    clustering of ankyrin-G and voltage-gated sodium channels that depends on it.
  cellular_components:
  - preferred_term: axon initial segment
    term:
      id: GO:0043194
      label: axon initial segment
    modifier: ABNORMAL
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:29038240
    reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that αII and βIV spectrin interact and form a periodic AIS cytoskeleton"
    explanation: >-
      Establishes that alpha-II spectrin is a structural component of the axon initial
      segment, which is the basis for its disruption here.
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clustering of ankyrinG and voltage-gated sodium channels at axon initial segment (AIS) was disturbed in relation to the aggregates, together with an elevated action potential threshold."
    explanation: >-
      Ties the clustering failure directly to the aggregates, and reports the
      excitability consequence.
  downstream:
  - target: Elevated Action Potential Threshold
    causal_link_type: DIRECT
    description: >-
      Loss of sodium-channel clustering at the initial segment raises the threshold for
      firing in the affected neuron.

- name: Elevated Action Potential Threshold
  biological_scale: CELLULAR
  description: >-
    Neurons bearing spectrin aggregates fire less readily, not more. This node is
    curated in the direction the measurement actually went, which is opposite to what
    an epilepsy entry would naively predict; the discussion attached to it addresses
    how a disorder of reduced single-neuron excitability produces seizures.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clustering of ankyrinG and voltage-gated sodium channels at axon initial segment (AIS) was disturbed in relation to the aggregates, together with an elevated action potential threshold."
    explanation: >-
      The threshold measurement, quoted in its own right because the direction is the
      point.

- name: Reduced Inhibitory Innervation
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    Inhibitory innervation decreases after alpha-II spectrin loss. This is the arm
    that plausibly reconciles the seizures with the elevated single-neuron threshold
    above, by removing inhibition at network level rather than by making individual
    neurons more excitable.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: inhibitory synapse assembly
    term:
      id: GO:1904862
      label: inhibitory synapse assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:29337302
    reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR-mediated deletion of Sptan1 in embryonic rat forebrain by in utero electroporation caused altered dendritic and axonal development, loss of the AIS, and decreased inhibitory innervation."
    explanation: >-
      Reports the inhibitory-innervation deficit alongside the AIS loss in the same
      in vivo manipulation.
  downstream:
  - target: Cortical Network Disinhibition
    causal_link_type: DIRECT
    description: >-
      Fewer inhibitory inputs leave cortical networks disinhibited.

- name: Disrupted Dendritic and Axonal Development
  biological_scale: CELLULAR
  description: >-
    Dendritic and axonal development is altered, separately from the axon initial
    segment defect. Kept as its own node because the same experiments report it
    alongside, not as part of, AIS loss.
  biological_processes:
  - preferred_term: regulation of neuron projection development
    term:
      id: GO:0010975
      label: regulation of neuron projection development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29337302
    reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR-mediated deletion of Sptan1 in embryonic rat forebrain by in utero electroporation caused altered dendritic and axonal development, loss of the AIS, and decreased inhibitory innervation."
    explanation: >-
      Names altered dendritic and axonal development as a distinct finding in the same
      experiment.
  downstream:
  - target: Disrupted Cortical Lamination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal process development plausibly contributes to the lamination defect seen
      on loss of alpha-II spectrin.

- name: Disrupted Cortical Lamination
  biological_scale: TISSUE
  description: >-
    Cortical layering is disrupted where alpha-II spectrin is absent - a developmental
    malformation arm distinct from the synaptic and excitability arms.
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29038240
    reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "αII spectrin-deficient mice die before 1 month of age and have disrupted AIS and many other neurological impairments including seizures, disrupted cortical lamination, and widespread neurodegeneration."
    explanation: >-
      Reports disrupted cortical lamination in the conditional knockout.

- name: Cortical Network Disinhibition
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    The net shift of cortical circuits toward excitation, driven here by loss of
    inhibitory innervation rather than by increased intrinsic excitability.
  evidence:
  - reference: PMID:29337302
    reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR-mediated deletion of Sptan1 in embryonic rat forebrain by in utero electroporation caused altered dendritic and axonal development, loss of the AIS, and decreased inhibitory innervation."
    explanation: >-
      Typed PARTIAL: the decreased inhibitory innervation is measured, but the
      resulting network-level disinhibition is inferred from it rather than recorded
      directly.
  downstream:
  - target: Infantile Spasms with Hypsarrhythmia
    causal_link_type: DIRECT
    description: >-
      A disinhibited immature cortex generates the presenting epilepsy.

- name: Infantile Spasms with Hypsarrhythmia
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    West syndrome - epileptic spasms with a hypsarrhythmic EEG - is the presenting
    epilepsy phenotype of DEE5.
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features of SPTAN1 mutations include epileptic encephalopathy with hypsarrhythmia, no visual attention, acquired microcephaly, spastic quadriplegia and severe intellectual disability."
    explanation: >-
      Names hypsarrhythmic epileptic encephalopathy as the leading clinical feature.

- name: Cerebral Hypomyelination
  biological_scale: TISSUE
  description: >-
    Severe cerebral hypomyelination, one of the imaging hallmarks. Curated as a
    parallel arm rather than downstream of the seizures, because it was part of the
    phenotype that originally identified the gene and alpha-II spectrin is
    independently required for myelination.
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTAN1 encoding alpha-II spectrin, which is essential for proper myelination in zebrafish, turned out to be deleted."
    explanation: >-
      Records both the gene's myelination role and the reason it was implicated in a
      hypomyelinating phenotype.

- name: Progressive Brainstem and Cerebellar Atrophy
  biological_scale: TISSUE
  description: >-
    Brainstem and cerebellar atrophy on MRI, together with cerebral hypomyelination,
    are described as specific hallmarks of this condition - which is what makes the
    imaging discriminating rather than merely abnormal.
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brainstem and cerebellar atrophy and cerebral hypomyelination, as observed by magnetic resonance imaging, are specific hallmarks of this condition."
    explanation: >-
      States the imaging hallmarks and their specificity.

- name: Widespread Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Neurodegeneration follows loss of alpha-II spectrin in the conditional knockout, a
    degenerative arm distinct from the developmental malformation arm above.
  evidence:
  - reference: PMID:29038240
    reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "αII spectrin-deficient mice die before 1 month of age and have disrupted AIS and many other neurological impairments including seizures, disrupted cortical lamination, and widespread neurodegeneration."
    explanation: >-
      Reports widespread neurodegeneration alongside the developmental defects.

- name: Profound Developmental Impairment
  biological_scale: ORGANISM
  description: >-
    Severe intellectual disability with spastic quadriplegia, acquired microcephaly
    and absent visual attention. Multiple upstream arms converge here and the
    published data do not separate their contributions.
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features of SPTAN1 mutations include epileptic encephalopathy with hypsarrhythmia, no visual attention, acquired microcephaly, spastic quadriplegia and severe intellectual disability."
    explanation: >-
      Enumerates the developmental and motor features of the severe phenotype.


genetic:
- name: SPTAN1
  gene_term:
    preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  relationship_type: CAUSATIVE
  association: >-
    De novo in-frame deletions and duplications in the last two C-terminal spectrin
    repeats of SPTAN1 cause DEE5 by a dominant-negative mechanism.
  notes: >-
    The genotype-mechanism relationship is unusually well resolved for a developmental
    and epileptic encephalopathy, and it is not simply "variants in this gene cause
    this disease". Only in-frame changes in the last two spectrin repeats - the
    alpha/beta heterodimer nucleation site - produce the severe DEE5 phenotype, and
    they do so by dominant-negative aggregation rather than by reducing gene dose.
    Heterozygous null mice have no haploinsufficiency phenotype, which is the
    observation that separates the two mechanisms. Other SPTAN1 variant classes cause
    substantially milder disorders: a large sequencing study found statistically
    significant enrichment of rare damaging SPTAN1 variants in hereditary ataxia and
    hereditary spastic paraplegia families, with a third of the identified carriers
    presenting pure or complex HSP/ataxia rather than developmental delay and
    seizures. Curators extending this entry should therefore not treat "a SPTAN1
    variant" as sufficient for DEE5 - position and variant type carry the phenotype.
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region lead to dominant negative effects and these specific phenotypes."
    explanation: >-
      The region- and type-specificity claim, stated in the source's own restrictive
      language.
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The last two spectrin repeats are required for α/β spectrin heterodimer associations and the mutations can alter heterodimer formation between the two spectrins."
    explanation: >-
      Explains why that region specifically matters, which is what turns a positional
      correlation into a mechanism.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 10 patients presented with pure or complex HSP/HA. The remaining 21 patients had developmental delay and seizures."
    explanation: >-
      Quantifies the milder end of the allelic spectrum, which is the reason this
      entry is scoped to the in-frame heterodimerization-domain phenotype.
  - reference: PMID:34590414
    reference_title: "Extending the clinical phenotype of SPTAN1: From DEE5 to migraine, epilepsy, and subependymal heterotopias without intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we noted an excess of male versus female patients"
    explanation: >-
      A sex skew across reported SPTAN1 patients, more pronounced at the milder end.
      Recorded because it bears on variant interpretation rather than on the DEE5
      phenotype itself.
  - reference: PMID:34590414
    reference_title: "Extending the clinical phenotype of SPTAN1: From DEE5 to migraine, epilepsy, and subependymal heterotopias without intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, some protection factor might be suspected among female carriers"
    explanation: >-
      Typed PARTIAL because the authors offer this as a suspicion to be confirmed, not
      a finding; it is quoted for the caution it attaches to calling milder variants
      pathogenic.
  - reference: PMID:41370269
    reference_title: "Axon initial segment damage and hyperexcitability in a mutant mouse with increased calpain-dependent cleavage of αII-Spectrin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, a clear genotype-phenotype relationship remains elusive."
    explanation: >-
      A 2025 statement that genotype-phenotype correlation across SPTAN1 as a whole
      is still unresolved - which is worth holding alongside the well-established
      correlation for this specific in-frame heterodimerization-repeat class.

animal_models:
- name: Sptan1 conditional CNS knockout mouse
  species: Mouse
  genotype: Sptan1 f/f with CNS-specific Cre-mediated deletion
  publication: PMID:29038240
  description: >-
    Complete CNS deletion of alpha-II spectrin. Supplies the structural and
    developmental arms of this entry. Note the deliberate mismatch of mechanism: this
    is a null, whereas human DEE5 is dominant-negative, which is why its relationship
    to the aggregation node is typed as a failure to recapitulate.
  modeled_mechanisms:
  - target: Axon Initial Segment Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that alpha-II spectrin is required for axon initial segment assembly,
      which is the structural premise the human aggregation mechanism acts on.
    limitations: >-
      A complete deletion removes the protein rather than producing an aggregating
      mutant, so it shows what the AIS needs alpha-II spectrin for, not how the human
      variant disrupts it. The mice die before one month, far short of the human
      disease course.
    readouts:
    - name: Axon initial segment integrity
      target: Axon Initial Segment Disruption
      direction: ABOLISHED
      interpretation: >-
        The AIS is disrupted, alongside profound reductions in all beta spectrins.
      evidence:
      - reference: PMID:29038240
        reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "found that loss of αII spectrin causes profound reductions in all β spectrins"
        explanation: The subunit-loss measurement behind this readout.
    evidence:
    - reference: PMID:29038240
      reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using a new αII spectrin conditional knock-out mouse, we show that αII spectrin is required for AIS assembly, neuronal excitability, cortical lamination, and to protect against neurodegeneration."
      explanation: >-
        States what this model establishes, which is the requirement rather than the
        disease mechanism.
  - target: Disrupted Cortical Lamination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical developmental defect, and pairs it with seizures and
      neurodegeneration in the same animals.
    limitations: >-
      Same null-versus-dominant-negative caveat; and because the deletion is CNS-wide
      from development, the model cannot separate a cell-autonomous lamination defect
      from a consequence of widespread degeneration.
    readouts:
    - name: Cortical layering and neurodegeneration
      target: Disrupted Cortical Lamination
      direction: ALTERED
      interpretation: >-
        Cortical lamination is disrupted, with seizures and widespread
        neurodegeneration in the same animals.
      evidence:
      - reference: PMID:29038240
        reference_title: "αII Spectrin Forms a Periodic Cytoskeleton at the Axon Initial Segment and Is Required for Nervous System Function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "αII spectrin-deficient mice die before 1 month of age and have disrupted AIS and many other neurological impairments including seizures, disrupted cortical lamination, and widespread neurodegeneration."
        explanation: The combined phenotype measurement behind this readout.
  - target: Spectrin Heterodimer Aggregation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A null cannot aggregate. This model deletes the protein, so it cannot reproduce
      the dominant-negative sequestration that defines the human mechanism, and any
      phenotype it shows is evidence about requirement rather than about aggregation.
    limitations: >-
      This is a definitional limitation rather than an experimental shortfall, and it
      is the reason the entry does not treat the conditional knockout as a model of
      DEE5 as such. The point is sharpened by the observation that heterozygous null
      mice - the closest null analogue of a heterozygous human patient - have no
      phenotype at all, so gene dose alone does not reproduce the disease.
    readouts:
    - name: Absence of a haploinsufficiency phenotype in heterozygous null mice
      target: Spectrin Heterodimer Aggregation
      direction: UNCHANGED
      interpretation: >-
        Losing one copy produces no disease phenotype, so the human heterozygous
        phenotype cannot be a dose effect.
      evidence:
      - reference: PMID:36831804
        reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "no haploinsufficiency-related phenotypes unfold in heterozygous Spna2 deficient mice"
        explanation: >-
          The negative result behind this readout, and the basis for typing this link
          as a failure to recapitulate.
    evidence:
    - reference: PMID:36831804
      reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Modeling human SPTAN1 encephalopathies in laboratory animals has been challenging partially because no haploinsufficiency-related phenotypes unfold in heterozygous Spna2 deficient mice nor stable transgenic lines of mice mimicking missense human SPTAN1 mutations have been created to date."
      explanation: >-
        States the modelling problem directly - neither dose reduction nor a
        transgenic missense line reproduces the human disease.

- name: Spna2 R1098Q dominant-negative mouse
  species: Mouse
  genotype: Spna2 R1098Q heterozygous point mutation in spectrin repeat 10
  publication: PMID:36831804
  description: >-
    A spontaneous point mutation affecting alpha-II spectrin scaffold stability, and
    the closest available in vivo analogue of a human dominant-negative allele -
    though it sits in repeat 10 rather than the last two repeats that cause DEE5.
  modeled_mechanisms:
  - target: Infantile Spasms with Hypsarrhythmia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Heterozygous R1098Q mice have seizure episodes, so a dominant-negative
      alpha-II spectrin allele is sufficient to produce seizures in vivo. The seizures
      are stress-induced and appear alongside progressive ataxia and memory
      impairment.
    limitations: >-
      The variant is in repeat 10, not the heterodimerization repeats that cause DEE5,
      and the phenotype it produces - progressive ataxia with stress-induced seizures
      and memory impairment - resembles the milder ataxia end of the human SPTAN1
      spectrum more than infantile spasms with hypsarrhythmia. It therefore supports
      the dominant-negative principle without modelling this disease's epilepsy
      syndrome.
    readouts:
    - name: Stress-induced seizure episodes in heterozygous mice
      target: Infantile Spasms with Hypsarrhythmia
      direction: INCREASED
      interpretation: >-
        Long-lasting seizure episodes occur in heterozygous animals carrying a
        dominant-negative allele.
      evidence:
      - reference: PMID:36831804
        reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We also document stress-induced, long-lasting seizure episodes of R1098Q mice and their poor performance in novel object recognition memory tests."
        explanation: The seizure and memory measurements behind this readout.
    evidence:
    - reference: PMID:36831804
      reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, we propose that the complexity of neuropathology-related phenotypes presented by the R1098Q mice recapitulates a number of symptoms observed in human patients carrying SPTAN1 mutations affecting α-II scaffold stability."
      explanation: >-
        The authors scope their own claim to variants affecting scaffold stability,
        which is the milder arm rather than the DEE5 heterodimerization arm.

experimental_models:
- name: DEE5 patient-derived iPSC neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Neurons derived from patients carrying dominant-negative SPTAN1 variants - the one
    system that carries the actual human genotype rather than a null or a surrogate
    allele.
  modeled_mechanisms:
  - target: Spectrin Heterodimer Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Shows the defining aggregation phenotype in human neurons at the patient
      genotype, which neither the null mouse nor the R1098Q mouse can do.
    limitations: >-
      iPSC neurons are developmentally immature and lack the circuit context in which
      the epilepsy arises, so they establish the cell-biological lesion rather than
      the network phenotype. The developmental defects were characterised alongside
      overexpression experiments in rodent neurons, so the patient-derived arm of that
      comparison is the smaller part of the evidence.
    readouts:
    - name: Spectrin complex aggregation in patient neurons
      target: Spectrin Heterodimer Aggregation
      direction: INCREASED
      interpretation: >-
        Patient-derived neurons display aggregated spectrin complexes.
      evidence:
      - reference: PMID:29337302
        reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Additionally, patient-derived neurons displayed aggregation of spectrin complexes."
        explanation: The aggregation measurement behind this readout.
    evidence:
    - reference: PMID:29337302
      reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of human EIEE5 mutant SPTAN1 in embryonic rat forebrain and mouse hippocampal neurons led to similar developmental defects that were also observed in EIEE5 patient-derived neurons."
      explanation: >-
        Establishes that the patient-derived neurons reproduce the developmental
        defects seen with mutant overexpression, which is what makes them informative.

diagnosis:
- name: Molecular Genetic Testing for a SPTAN1 Variant
  description: >-
    Diagnosis rests on identifying a de novo SPTAN1 variant and, critically, on
    locating it: only in-frame changes in the last two spectrin repeats predict this
    severe phenotype, so variant position is part of the diagnostic interpretation
    rather than a downstream detail. Exome or genome sequencing is the route, with
    developmental and epileptic encephalopathy gene panels as an alternative.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important that this syndrome is recognized by pediatric neurologists to enable proper diagnostic work-up for patients."
    explanation: >-
      The source's argument for recognition and diagnostic work-up, which belongs
      here rather than against a treatment claim.
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region lead to dominant negative effects and these specific phenotypes."
    explanation: >-
      Why variant position, not merely variant presence, is what the diagnosis turns
      on.

- name: Brain MRI
  description: >-
    Imaging is unusually discriminating here: brainstem and cerebellar atrophy with
    cerebral hypomyelination are described as specific hallmarks of this condition,
    which is a stronger claim than the nonspecific findings typical of the
    developmental and epileptic encephalopathies generally.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brainstem and cerebellar atrophy and cerebral hypomyelination, as observed by magnetic resonance imaging, are specific hallmarks of this condition."
    explanation: >-
      States both the imaging findings and their claimed specificity.

- name: Electroencephalography
  description: >-
    EEG demonstrates the hypsarrhythmia of West syndrome, which is the presenting
    electroclinical picture.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features of SPTAN1 mutations include epileptic encephalopathy with hypsarrhythmia, no visual attention, acquired microcephaly, spastic quadriplegia and severe intellectual disability."
    explanation: >-
      Hypsarrhythmia is the EEG finding this modality demonstrates.

treatments:
- name: Antiseizure Medication
  description: >-
    Symptomatic management of the epileptic encephalopathy. No disease-modifying
    therapy exists, and this entry makes no efficacy claim for any specific agent,
    because the cited sources characterise the syndrome rather than compare
    treatments.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No evidence block is attached. None of the references cited by this entry states
    anything about antiseizure drug choice or response in DEE5, and rather than
    attach a snippet that does not support the claim, the treatment is described
    without evidence. Agents used first-line for infantile spasms generally - ACTH,
    vigabatrin, the ketogenic diet - are deliberately not bound as therapeutic_agent
    here: the deep-research report scopes them as broad infantile-spasms practice with
    response rates from general and mixed-etiology populations, not as SPTAN1 evidence,
    and binding them would import general epilepsy practice as though it were
    disease-specific. That gap is real and worth closing with a proper SPTAN1 treatment
    source rather than by inference.

- name: Genetic Counseling
  description: >-
    Offered given de novo dominant inheritance, with recurrence risk limited to
    gonadal mosaicism. Counselling in this disorder additionally has to convey that a
    SPTAN1 variant alone does not predict this phenotype, since other variant classes
    in the same gene cause much milder disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 10 patients presented with pure or complex HSP/HA. The remaining 21 patients had developmental delay and seizures."
    explanation: >-
      Shows that a third of identified SPTAN1 variant carriers have a substantially
      different and milder disorder, which is the fact counselling has to convey.

discussions:
- discussion_id: controversy_seizures_despite_raised_firing_threshold
  prompt: >-
    Neurons carrying SPTAN1 aggregates have a raised action potential threshold - they
    fire less readily. How does a lesion that makes individual neurons harder to
    excite produce an infantile epileptic encephalopathy?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Elevated Action Potential Threshold
  - pathophysiology#Reduced Inhibitory Innervation
  - pathophysiology#Cortical Network Disinhibition
  rationale: >-
    The measured direction is the opposite of the naive expectation for an epilepsy
    gene, and the pathograph records it that way rather than quietly smoothing it out.
    Disrupted clustering of voltage-gated sodium channels at the axon initial segment
    raises the threshold for firing, so the primary cellular defect is reduced
    excitability. The leading reconciliation is that the network consequence inverts
    the cellular one: inhibitory innervation is also reduced, and if inhibitory
    interneurons are more affected than principal cells - or if the loss of inhibitory
    synapses outweighs the raised threshold in principal cells - the net cortical
    effect is disinhibition despite less excitable individual neurons. That account is
    plausible and consistent with everything measured, and it gains support from an
    intact-animal result: a mouse carrying a destabilising alpha-II spectrin variant
    shows fewer and structurally defective axon initial segments together with
    increased neuronal excitability and greater chemoconvulsant sensitivity, so at
    network level the sign is the opposite of the single-neuron threshold shift. That
    still does not settle it, because the variant sits in repeat 10 rather than the
    DEE5 heterodimerization repeats and the measurement is at network rather than
    cellular level - and no study has compared threshold shifts between interneurons
    and pyramidal cells in the same preparation, which is exactly the measurement that
    would decide it. Until then the entry keeps the raised threshold and the reduced
    inhibition as separate nodes rather than merging them into a single excitability
    claim, because merging them would hide the tension rather than resolve it.
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clustering of ankyrinG and voltage-gated sodium channels at axon initial segment (AIS) was disturbed in relation to the aggregates, together with an elevated action potential threshold."
    explanation: >-
      The measurement that creates the puzzle: threshold goes up, not down.
  - reference: PMID:29337302
    reference_title: "Critical roles of αII spectrin in brain development and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CRISPR-mediated deletion of Sptan1 in embryonic rat forebrain by in utero electroporation caused altered dendritic and axonal development, loss of the AIS, and decreased inhibitory innervation."
    explanation: >-
      The decreased inhibitory innervation that supplies the candidate resolution, in
      the same lesion.
  - reference: PMID:41370269
    reference_title: "Axon initial segment damage and hyperexcitability in a mutant mouse with increased calpain-dependent cleavage of αII-Spectrin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results show that R1098Q mutant mice display abnormal electroencephalographic activity, increased neuronal excitability, and heightened sensitivity to a chemoconvulsant."
    explanation: >-
      Partially resolves the paradox in the direction of the network account: in an
      intact animal carrying a destabilising alpha-II spectrin variant, excitability
      and seizure susceptibility go up, not down. It does not close the question,
      because this variant sits in repeat 10 rather than the DEE5 heterodimerization
      repeats, and because the measurement is at network rather than single-neuron
      level - which is precisely the level at which the sign is proposed to invert.
  - reference: PMID:41370269
    reference_title: "Axon initial segment damage and hyperexcitability in a mutant mouse with increased calpain-dependent cleavage of αII-Spectrin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphological analysis revealed fewer AIS structures, along with structural defects such as shortening and thinning of these segments."
    explanation: >-
      Shows AIS damage and network hyperexcitability coexisting in the same animals,
      which is the combination the raised single-neuron threshold has to be reconciled
      with.
  proposed_experiments:
  - experiment_id: exp_cell_type_resolved_threshold_comparison
    name: Cell-type-resolved excitability in SPTAN1-mutant cortex
    description: >-
      Record action potential threshold and firing from identified GABAergic
      interneurons and pyramidal neurons in the same SPTAN1-mutant cortical
      preparation, together with inhibitory and excitatory synaptic currents onto
      each. If interneurons show a larger threshold shift than pyramidal cells, the
      disinhibition account is supported directly; if both shift equally, the seizures
      must arise from the synaptic rather than the intrinsic arm, and the raised
      threshold is a bystander finding.

- discussion_id: gap_no_model_carries_the_dee5_allele
  prompt: >-
    No published animal model carries an in-frame variant in the last two spectrin
    repeats - the only variant class that causes DEE5. What is being modelled instead,
    and what does that cost?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Spectrin Heterodimer Aggregation
  - pathophysiology#De Novo In-Frame SPTAN1 Variant in the Heterodimerization Repeats
  rationale: >-
    The in vivo evidence for this disorder comes from two models, and neither carries
    the disease allele. The conditional knockout deletes alpha-II spectrin outright,
    so it cannot aggregate and cannot exert a dominant-negative effect - it shows what
    the protein is required for, not what the mutant protein does. The R1098Q mouse is
    genuinely dominant-negative but sits in repeat 10 rather than the heterodimer
    nucleation site, and produces progressive ataxia with stress-induced seizures,
    which resembles the milder human SPTAN1 phenotypes rather than West syndrome. The
    source that describes the R1098Q model states the underlying problem plainly:
    modelling these encephalopathies has been difficult because heterozygous nulls
    show nothing and no stable transgenic line carrying a human missense variant
    exists. The practical cost is that the causal step from aggregation to seizures
    has never been tested in an animal that actually aggregates the relevant complex,
    and patient-derived neurons - which do carry the allele - cannot supply a network
    or behavioural readout. This is a mismatch in what the models can address, not
    evidence that the mechanism is wrong.
  evidence:
  - reference: PMID:36831804
    reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Modeling human SPTAN1 encephalopathies in laboratory animals has been challenging partially because no haploinsufficiency-related phenotypes unfold in heterozygous Spna2 deficient mice nor stable transgenic lines of mice mimicking missense human SPTAN1 mutations have been created to date."
    explanation: >-
      States both halves of the modelling gap in one sentence - nulls are silent, and
      no missense line exists.
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region lead to dominant negative effects and these specific phenotypes."
    explanation: >-
      Defines the allele class that would have to be modelled, and that none of the
      current models carries.
  proposed_experiments:
  - experiment_id: exp_knockin_heterodimerization_repeat_allele
    name: Knock-in mouse carrying a human DEE5 heterodimerization-repeat allele
    description: >-
      Generate a knock-in mouse carrying one of the recurrent in-frame deletions or
      duplications at the alpha/beta heterodimer nucleation site, and characterise
      spectrin aggregation, AIS integrity, inhibitory innervation, EEG and seizure
      phenotype. This is the single experiment that would let the step from
      aggregation to seizure be tested in vivo, and it would also test whether the
      raised firing threshold seen in vitro holds in an intact circuit.

- discussion_id: gap_which_arm_causes_the_hypomyelination
  prompt: >-
    Cerebral hypomyelination is a diagnostic hallmark of DEE5, but alpha-II spectrin
    is a neuronal cytoskeletal protein. Is the hypomyelination a direct consequence of
    spectrin loss in oligodendrocytes, a non-cell-autonomous consequence of abnormal
    axons, or secondary to the epileptic encephalopathy itself?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebral Hypomyelination
  - pathophysiology#Disrupted Dendritic and Axonal Development
  rationale: >-
    Hypomyelination is one of the features that made SPTAN1 a candidate gene in the
    first place - it was picked out partly because alpha-II spectrin is essential for
    proper myelination in zebrafish - so it is not an incidental finding. But the
    mechanism curated in the rest of this entry is neuronal: aggregation, axon initial
    segment disruption, inhibitory synapse loss. Nothing in the verified sources
    measures spectrin function in oligodendrocytes or asks whether myelination
    recovers when axonal development is rescued. The three candidate routes make
    different predictions and would support different interpretations of the MRI
    hallmark, and the entry deliberately places hypomyelination as a parallel arm
    rather than downstream of any one of them, because choosing would assert more than
    the evidence carries.
  evidence:
  - reference: PMID:20493457
    reference_title: "Dominant-negative mutations in alpha-II spectrin cause West syndrome with severe cerebral hypomyelination, spastic quadriplegia, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTAN1 encoding alpha-II spectrin, which is essential for proper myelination in zebrafish, turned out to be deleted."
    explanation: >-
      The myelination link that motivated the gene's identification, and which remains
      unresolved as to cell type in the human disease.
  - reference: PMID:25631096
    reference_title: "SPTAN1 encephalopathy: distinct phenotypes and genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brainstem and cerebellar atrophy and cerebral hypomyelination, as observed by magnetic resonance imaging, are specific hallmarks of this condition."
    explanation: >-
      Establishes hypomyelination as a diagnostic hallmark, which is why its mechanism
      matters rather than being a detail.
  proposed_experiments:
  - experiment_id: exp_conditional_oligodendrocyte_sptan1_deletion
    name: Oligodendrocyte-restricted versus neuron-restricted Sptan1 deletion
    description: >-
      Compare myelin content and oligodendrocyte maturation between mice with
      Sptan1 deleted only in oligodendrocytes and mice with it deleted only in
      neurons. Hypomyelination in the oligodendrocyte-restricted line would establish
      a cell-autonomous glial requirement; hypomyelination only in the
      neuron-restricted line would establish the non-cell-autonomous axonal route, as
      has been shown for other neuronal genes with myelin phenotypes.

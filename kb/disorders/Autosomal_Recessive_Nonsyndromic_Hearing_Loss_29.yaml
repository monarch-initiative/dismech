    evidence_source: HUMAN_CLINICAL
    snippet: "The essential function of one of these claudins in the inner ear was established by identifying mutations in CLDN14 that cause nonsyndromic recessive deafness DFNB29 in two large consanguineous Pakistani families."
    explanation: CLDN14 mutations were identified as the cause of DFNB29 in two Pakistani families.

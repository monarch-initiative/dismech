- name: Inner Hair Cell Ribbon Synapse Loss and Auditory Nerve Regression
  role: effector
  biological_scale: CELLULAR
  description: >-
    In Cldn14-null mice, inner hair cell ribbon synapses degenerate in apical
    regions from postnatal day 12, before the inner hair cells themselves are
    lost. Peripheral auditory nerve processes regress, especially the outer
    radial fibres, while spiral ganglion neuron density is unchanged. Centrally,
    the dorsal cochlear nucleus is smaller and glutamatergic input to the
    ventral cochlear nucleus is reduced. These changes in auditory nerve
    connectivity bear on how well a cochlear implant can work, and they have not
    been examined in patients.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  cellular_components:
  - preferred_term: ribbon synapse
    term:
      id: GO:0097470
      label: ribbon synapse
  evidence:
  - reference: PMID:32251970
    reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemical analysis, using presynaptic Ribeye and postsynaptic GluR2 or PSD 95 as markers, revealed the degeneration of full ribbon synapses in inner hair cells from apical cochlear regions already at postnatal day 12 (P12)."
    explanation: Ribbon synapses degenerate early, before inner hair cells are lost.
  - reference: PMID:32251970
    reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The number of spiral ganglion neurons per area, however, was unchanged between the genotypes."
    explanation: Spiral ganglion neuron density is preserved.
  - reference: PMID:32251970
    reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While the dorsal cochlear nucleus (DCN) showed a significant 19.7% volume reduction, VGLUT-1 input was reduced by 34.4% in the ventral cochlear nucleus (VCN) but not in the DCN of Cldn14-/- mice."
    explanation: Central auditory nuclei are also affected.
  - reference: PMID:32251970
    reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition to the regression of peripheral nerve processes, reduced levels of VGLUT-1 in the VCN of Cldn14-/- mice suggests that Claudin 14 loss does not only cause hair cell loss but also affects peripheral and central connectivity of the auditory nerve."
    explanation: Claudin-14 loss affects auditory nerve connectivity beyond the hair cells.

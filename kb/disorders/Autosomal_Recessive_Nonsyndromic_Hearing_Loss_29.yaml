    sensory epithelium.
  evidence:
  - reference: PMID:31527509
    reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient showed normal vestibular function."
    explanation: Vestibular function was normal on testing.
  - reference: PMID:23235333
    reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, six different pathogenic variants of human CLDN14 have been identified in families segregating severe to profound hearing loss, but no obvious vestibular phenotype."
    explanation: Families with CLDN14 variants have no obvious vestibular phenotype.
genetic:
- name: CLDN14
  association: >-
    Causal gene, encoding claudin-14. Biallelic missense and frameshift variants
    have been reported in families from Pakistan, Newfoundland, Japan and
    southern Europe, with founder alleles in Pakistan and Newfoundland. CLDN14
    accounts for a small fraction of recessive hearing loss in cohort screens.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CLDN14
    term:
      id: hgnc:2035
      label: CLDN14
  notes: >-
    ClinGen's Definitive classification of CLDN14 is for nonsyndromic genetic
    hearing loss (MONDO:0019497), a broader disease than DFNB29, so it is not
    recorded here as this entry's gene-disease validity.
  variants:
  - name: p.Val85Asp (c.254T>A)
    description: >-
      Founder missense allele, about two-thirds of mutant CLDN14 alleles in a
      Pakistani cohort. It fails to form tight junctions in a cell model.
    evidence:
    - reference: PMID:23235333
      reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.Val85Asp accounts for ~67% of the mutant alleles of CLDN14 in our cohort."
      explanation: The commonest allele in the Pakistani cohort.
    - reference: PMID:23235333
      reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analyses indicate that p.Val85Asp and p.Met133ArgfsX23 are founder mutations."
      explanation: p.Val85Asp is a founder mutation.
  - name: p.Met133ArgfsX23
    description: Founder frameshift allele in the Pakistani cohort.
    evidence:
    - reference: PMID:23235333
      reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analyses indicate that p.Val85Asp and p.Met133ArgfsX23 are founder mutations."
      explanation: p.Met133ArgfsX23 is a founder mutation.
  - name: p.Ala163Val (c.488C>T)
    description: >-
      Newfoundland founder allele, earlier classed as a variant of uncertain
      significance, associated with prelingual loss that deteriorates rapidly.
    evidence:
    - reference: PMID:27838790
      reference_title: "A common variant in CLDN14 causes precipitous, prelingual sensorineural hearing loss in multiple families due to founder effect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genealogical studies, cascade sequencing and haplotype analysis across four unrelated families showed all subjects with the unique audioprofile (n = 12) were also homozygous for p.(Ala163Val) and shared a 1.4 Mb DFNB29-associated haplotype on chromosome 21."
      explanation: All affected Newfoundland subjects are homozygous for the founder allele.
  - name: p.Gly101Arg (c.301G>A)
    description: >-
      Missense allele found in a southern European screen. It fails to form
      tight junctions in a cell model.
    evidence:
    - reference: PMID:15880785
      reference_title: "Different mechanisms preclude mutant CLDN14 proteins from forming tight junctions in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ectopic expression in L mouse fibroblasts (LM cells) of wild-type CLDN14 protein induced the formation of tight junctions, while both the c.254T>A (p.V85D) mutant, previously identified in a Pakistani family, and the c.301 G>A (p.G101R) mutant, identified in this study through the screen of 183 Spanish and Greek patients affected with sporadic nonsyndromic deafness, failed to form such junctions."
      explanation: The p.Gly101Arg mutant cannot form tight junctions.
  - name: p.Arg81Cys (c.241C>T)
    description: Homozygous in a Japanese patient with post-lingual, progressive loss.
    evidence:
    - reference: PMID:31527509
      reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient had a homozygous novel variant (c.241C>T: p.Arg81Cys) (0.04%: 1/2549)."
      explanation: The only CLDN14 patient among 2549 Japanese hearing loss patients.
  case_fractions:
  - population: Pakistani families segregating deafness
    case_fraction_percent: 2.25
    case_fraction_low: 1.4
    case_fraction_high: 3.5
    cohort_size: 800
    notes: 18 of 800 families, combining this cohort with earlier reports; the range is the 95% confidence interval.
    evidence:
    - reference: PMID:23235333
      reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Combined with the previously reported data, CLDN14 mutations were identified in 18 of 800 Pakistani families (2.25; 95% CI, 1.4-3.5)."
      explanation: CLDN14 explains about 2% of Pakistani deafness families.
  - population: Japanese hearing loss patients screened for 68 deafness genes
    case_fraction_percent: 0.04
    cohort_size: 2549
    evidence:
    - reference: PMID:31527509
      reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient had a homozygous novel variant (c.241C>T: p.Arg81Cys) (0.04%: 1/2549)."
      explanation: CLDN14 explains 1 of 2549 Japanese hearing loss patients.
  - population: Korean patients with recessive or sporadic nonsyndromic hearing loss
    case_fraction_percent: 0.0
    cohort_size: 48
    notes: A tested null; only non-pathogenic CLDN14 variants were found.
    evidence:
    - reference: PMID:24752540
      reference_title: "Genetic analysis of genes related to tight junction function in the Korean population with non-syndromic hearing loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings indicate that, whereas mutation of the TJP2 gene might cause ADNSHL, CLDN14 is not a major causative gene for ARNSHL in the Korean population studied."
      explanation: No pathogenic CLDN14 variant was found in the Korean cohort.
  evidence:
  - reference: PMID:11163249
    reference_title: "Mutations in the gene encoding tight junction claudin-14 cause autosomal recessive deafness DFNB29."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The essential function of one of these claudins in the inner ear was established by identifying mutations in CLDN14 that cause nonsyndromic recessive deafness DFNB29 in two large consanguineous Pakistani families."
    explanation: CLDN14 mutations were identified as the cause of DFNB29 in two Pakistani families.
  - reference: PMID:23235333
    reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss in 15 multi-generational families was found to co-segregate with CLDN14-linked STR markers."
    explanation: Linkage of hearing loss to CLDN14 in 15 families.
  - reference: PMID:38534090
    reference_title: "Autosomal recessive non-syndromic hearing loss genes in Pakistan during the previous three decades."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, 13 of the most prevalent genes, namely CDH23, CIB2, CLDN14, GJB2, HGF, MARVELD2, MYO7A, MYO15A, MSRB3, OTOF, SLC26A4, TMC1 and TMPRSS3, account for more than half of all cases of profound hearing loss, while the prevalence of other genes is less than 2% individually."
    explanation: CLDN14 is among the most prevalent recessive deafness genes in Pakistan.
animal_models:
- name: Cldn14-null mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Cldn14 targeted deletion with a lacZ cassette under the Cldn14 promoter, homozygous
  publication: PMID:12913076
  description: >-
    Knockout mice are deaf, with a normal endocochlear potential, rapid outer
    hair cell degeneration and slower inner hair cell degeneration during the
    first three weeks of life.
  modeled_mechanisms:
  - target: Outer Hair Cell Degeneration Followed by Inner Hair Cell Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Outer then inner hair cell degeneration in the first weeks of life.
    limitations: >-
      A null allele, whereas most patients carry missense alleles, and the mice
      are uniformly deaf while patients range from moderate to profound loss
      with variable onset.
    evidence:
    - reference: PMID:12913076
      reference_title: "Claudin 14 knockout mice, a model for autosomal recessive deafness DFNB29, are deaf due to cochlear hair cell degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cldn14-null mice have a normal endocochlear potential but are deaf due to rapid degeneration of cochlear outer hair cells, followed by slower degeneration of the inner hair cells, during the first 3 weeks of life."
      explanation: The knockout shows the hair cell degeneration.
- name: Cldn14-/- mouse (auditory synapse and nerve study)
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Cldn14-/-
  publication: PMID:32251970
  description: >-
    The same knockout studied for inner hair cell ribbon synapses, auditory
    nerve fibres and the cochlear nucleus.
  modeled_mechanisms:
  - target: Inner Hair Cell Ribbon Synapse Loss and Auditory Nerve Regression
    relationship: MEASURES
    fidelity: UNKNOWN
    description: Ribbon synapse loss, nerve fibre regression and cochlear nucleus changes.
    limitations: >-
      Synapses and auditory nerve fibres have not been examined in patients, so
      whether the same changes occur in human DFNB29 is not known.
    evidence:
    - reference: PMID:32251970
      reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunohistochemical analysis, using presynaptic Ribeye and postsynaptic GluR2 or PSD 95 as markers, revealed the degeneration of full ribbon synapses in inner hair cells from apical cochlear regions already at postnatal day 12 (P12)."
      explanation: The model measures early ribbon synapse loss.
diagnosis:
- name: Audiologic Evaluation and Follow-up
  description: >-
    Pure-tone audiometry shows bilateral sensorineural loss that may be worse at
    high frequencies. Because a child with the Newfoundland founder allele
    passed newborn screening and lost hearing later, a normal newborn screen
    does not exclude DFNB29, and at-risk children need audiological follow-up.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:27838790
    reference_title: "A common variant in CLDN14 causes precipitous, prelingual sensorineural hearing loss in multiple families due to founder effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The youngest CLDN14 ... homozygote passed newborn screening and had normal hearing thresholds up to 3 years of age, which then deteriorated to a precipitous loss >1 kHz during the first decade."
    explanation: A normal newborn screen did not exclude later DFNB29 hearing loss.
  - reference: PMID:31527509
    reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pure-tone audiograms indicated a high-frequency hearing loss type, and the deterioration gradually spread to other frequencies."
    explanation: Audiometry characterizes the frequency pattern.
- name: Molecular Genetic Testing
  description: >-
    Biallelic pathogenic CLDN14 variants confirm the diagnosis. Genetic testing
    can identify at-risk children before speech and language are affected,
    which matters where hearing is normal at birth.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27838790
    reference_title: "A common variant in CLDN14 causes precipitous, prelingual sensorineural hearing loss in multiple families due to founder effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study suggests that genetic testing may be necessary to identify at-risk children in time to prevent speech, language and developmental delay."
    explanation: Genetic testing identifies at-risk children early.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids help affected children and young adults. In the Newfoundland
    founder families most adults no longer benefit, because the mid and high
    frequencies are largely lost.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting and auditory rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  evidence:
  - reference: PMID:27838790
    reference_title: "A common variant in CLDN14 causes precipitous, prelingual sensorineural hearing loss in multiple families due to founder effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing aids benefit affected children and young adults (up to the third decade), but most adults do not find them beneficial."
    explanation: Hearing aids help younger patients but not most adults.
- name: Cochlear Implantation
  description: >-
    In the one reported DFNB29 implant recipient, cochlear implantation improved
    sound-field thresholds but not speech discrimination. The implant bypasses
    the lost hair cells but depends on the auditory nerve, whose fibres and
    central connections are affected in Cldn14-null mice; whether that explains
    the poor discrimination is not known.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Outer Hair Cell Degeneration Followed by Inner Hair Cell Loss
    treatment_effect: BYPASSES
    description: The implant stimulates the auditory nerve directly, bypassing the lost hair cells.
    evidence:
    - reference: PMID:31527509
      reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cochlear implantation improved the patient's sound field threshold levels, but not speech discrimination scores."
      explanation: Thresholds improved after implantation.
  evidence:
  - reference: PMID:31527509
    reference_title: "Detailed Clinical Features of Deafness Caused by a Claudin-14 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear implantation improved the patient's sound field threshold levels, but not speech discrimination scores."
    explanation: The one reported implant outcome in DFNB29.
  - reference: PMID:32251970
    reference_title: "Loss of inner hair cell ribbon synapses and auditory nerve fiber regression in Cldn14 knockout mice."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Proper functioning of the auditory nerve is of critical importance for auditory rehabilitation by cochlear implants."
    explanation: Implant outcome depends on the auditory nerve.
differential_diagnoses:
- name: Perrault Syndrome
  description: >-
    In a consanguineous family, homozygous CLDN14 deafness occurred together
    with a homozygous SGO2 frameshift that caused ovarian insufficiency in the
    proband, so the family resembled Perrault syndrome. A second genetic cause
    should be sought when a patient with DFNB29 also has ovarian insufficiency.
  disease_term:
    preferred_term: Perrault syndrome
    term:
      id: MONDO:0017312
      label: Perrault syndrome
  evidence:
  - reference: PMID:27629923
    reference_title: "Mutations of SGO2 and CLDN14 collectively cause coincidental Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All hearing impaired individuals, including the proband, are homozygous for a pathogenic variant of CLDN14, but this only explains the deafness."
    explanation: CLDN14 explains the deafness but not the ovarian phenotype.
  - reference: PMID:27629923
    reference_title: "Mutations of SGO2 and CLDN14 collectively cause coincidental Perrault syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PS proband is also homozygous for a frameshift variant (c.1453_1454delGA, p.(Glu485Lysfs*5)) in exon 7 of SGO2 encoding shugoshin 2, which is the likely cause of her concurrent ovarian insufficiency."
    explanation: A second homozygous variant explains the ovarian insufficiency.
discussions:
- discussion_id: dfnb29_mouse_uniform_deafness_versus_human_variability
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Outer Hair Cell Degeneration Followed by Inner Hair Cell Loss
  - phenotypes#Bilateral sensorineural hearing impairment
  prompt: >-
    Why are Cldn14-null mice uniformly deaf within weeks of birth, while
    patients homozygous for CLDN14 variants range from moderate to profound
    loss, some with normal hearing in early childhood or post-lingual onset?
  rationale: >-
    The mouse is a null allele, while most patients carry missense alleles, and
    two cohort studies propose modifier genes or environmental exposures as the
    source of the human variability without identifying any. Whether the mouse time
    course predicts human onset and severity therefore remains open, and it
    matters for counselling and for the timing of hearing intervention.
  evidence:
  - reference: PMID:20811388
    reference_title: "Mutations in CLDN14 are associated with different hearing thresholds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that a modifier can reduce the severity of HL associated with mutations of CLDN14."
    explanation: A modifier is proposed to explain milder loss.
  - reference: PMID:23235333
    reference_title: "Phenotypic variability of CLDN14 mutations causing DFNB29 hearing loss in the Pakistani population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This phenotypic variability may be due to environmental factors (for example drug and noise exposure) and/or genetic modifiers."
    explanation: Environmental factors and modifiers are proposed, not identified.
  proposed_experiments:
  - experiment_id: cldn14_patient_allele_knockin_audiometry
    experiment_design: TARGETED_PERTURBATION
    name: Patient-allele Cldn14 knock-in mice with longitudinal hearing tests
    description: >-
      Knock in the p.Val85Asp and p.Ala163Val patient alleles and follow
      hearing thresholds and hair cell counts from hearing onset onward. A
      slower or milder course than in the null mouse would show that allele
      differences account for part of the human variability.
    readouts:
    - name: Auditory brainstem response thresholds over time
      target: pathophysiology#Outer Hair Cell Degeneration Followed by Inner Hair Cell Loss
      interpretation: >-
        A course matching the null mouse would point away from allele effects
        and toward modifiers or environment.
- discussion_id: cldn14_kidney_stone_gene_without_renal_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CLDN14
  prompt: >-
    Why do DFNB29 patients and Cldn14-null mice have no renal dysfunction, when
    claudin-14 regulates renal calcium handling and common CLDN14 variants are
    a major risk factor for hypercalciuric kidney stones?
  rationale: >-
    The absence of a renal phenotype is what makes DFNB29 nonsyndromic, but the
    reason is not established. In the thick ascending limb, calcium-sensing
    receptor activity raises claudin-14 expression, and claudin-14 blocks
    paracellular calcium reabsorption; a stone-associated risk-haplotype
    variant increases CLDN14 expression. So the renal risk runs through too
    much claudin-14, the opposite direction to the deafness alleles. Why losing
    claudin-14 leaves renal calcium handling apparently normal is the open
    question.
  evidence:
  - reference: PMID:22731732
    reference_title: "The yin and yang of claudin-14 function in human diseases."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "A recent genome-wide association study has identified claudin-14 as a major risk gene of hypercalciuric nephrolithiasis."
    explanation: CLDN14 is a kidney-stone risk gene.
  - reference: PMID:22731732
    reference_title: "The yin and yang of claudin-14 function in human diseases."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, neither homozygous individuals with DFNB29 mutations nor claudin-14 knockout mice show any renal dysfunction."
    explanation: Neither patients nor knockout mice have renal dysfunction.
  - reference: PMID:33796889
    reference_title: "Molecular mechanisms altering tubular calcium reabsorption."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "This pathway is regulated by the CaSR, whose activity increases the expression of claudin-14, a protein that blocks paracellular calcium reabsorption."
    explanation: In the kidney, more claudin-14 means less calcium reabsorption.
  - reference: PMID:28229505
    reference_title: "A variant in a cis-regulatory element enhances claudin-14 expression and is associated with pediatric-onset hypercalciuria and kidney stones."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dual luciferase and cell-based assays demonstrated increased reporter or CLDN14 expression when this polymorphism was introduced."
    explanation: The stone-associated variant increases CLDN14 expression.
  - reference: PMID:28229505
    reference_title: "A variant in a cis-regulatory element enhances claudin-14 expression and is associated with pediatric-onset hypercalciuria and kidney stones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that children with the INSM1 binding site within the CLDN14 risk haplotype have a higher likelihood of hypercalciuria and kidney stones."
    explanation: The expression-raising variant is associated with hypercalciuria in children.
notes: >-
  The only GeneReviews chapter covering CLDN14 is the Genetic Hearing Loss
  Overview (PMID:20301607), an Overview-format chapter whose cached abstract is a
  statement of purpose with no clinical characteristics, so it is not used as a
  phenotype baseline; the phenotypes come from the family and cohort reports
  cited here. DFNB29 is curated as one disease with variable onset, severity and
  course rather than with subtypes, because the different audioprofiles come
  from different alleles and populations of the same CLDN14 loss-of-function
  disease.

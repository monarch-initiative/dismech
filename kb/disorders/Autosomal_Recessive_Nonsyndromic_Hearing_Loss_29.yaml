name: Autosomal Recessive Nonsyndromic Hearing Loss 29
creation_date: "2026-11-16T15:06:57Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 29
  term:
    id: MONDO:0013537
    label: autosomal recessive nonsyndromic hearing loss 29
synonyms:
- DFNB29
- CLDN14 autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in CLDN14
- deafness, autosomal recessive 29
description: >-
  Autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic
  pathogenic variants in CLDN14, which encodes claudin-14, a tight-junction
  protein of the hair cells and supporting cells of the organ of Corti.
  Claudin-14 makes the tight junctions of the reticular lamina a barrier to
  cations. In Cldn14-null mice the endocochlear potential is normal, but outer
  hair cells degenerate rapidly during the first three weeks of life and inner
  hair cells follow more slowly, a loss attributed to the leaky barrier
  disturbing the ionic composition of the fluid around the outer hair cells.
  Inner hair cell ribbon synapses are lost before the inner hair cells
  themselves, and peripheral auditory nerve fibres regress. The human phenotype
  is variable. It is classically prelingual, bilateral and severe to profound,
  but some homozygotes have moderate or severe loss, loss can be worse at high
  frequencies, and a Newfoundland founder allele and a Japanese patient show
  later onset with progression. Vestibular function is spared, and although
  claudin-14 also acts in the kidney, neither patients nor knockout mice have
  renal dysfunction.

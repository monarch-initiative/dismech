- name: Loss of the Cation Barrier at Reticular Lamina Tight Junctions
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult"
  description: >-
    Claudin-14 sits in the tight junctions between hair cells and supporting
    cells at the reticular lamina, which separate potassium-rich endolymph from
    sodium-rich perilymph. It makes these junctions restrictive to cations:
    expressed in MDCK monolayers it raises transepithelial resistance six-fold
    by lowering paracellular cation permeability. Without it the barrier is
    expected to leak cations. What this node is not: a failure of the
    endocochlear potential, which is normal in Cldn14-null mice, so the stria
    vascularis route that many other recessive deafness genes take is not
    involved.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: organ of Corti supporting cell
    term:
      id: CL:0002490
      label: organ of Corti supporting cell

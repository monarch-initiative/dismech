pathophysiology:
- name: Biallelic CLDN14 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline CLDN14 variants, mostly missense with founder frameshift
    and missense alleles in Pakistan and a founder missense allele in
    Newfoundland, remove claudin-14 from tight-junction strands. Expressed in
    L fibroblasts, wild-type claudin-14 forms tight junctions while the
    p.Val85Asp and p.Gly101Arg mutants do not, and the two mutants differ in
    whether they reach the plasma membrane, so different alleles disable the
    protein by different routes.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline CLDN14 variants, including p.Val85Asp,
      p.Met133ArgfsX23, p.Gly101Arg, p.Ala163Val and p.Arg81Cys.
  genes:
  - preferred_term: CLDN14
    term:
      id: hgnc:2035
      label: CLDN14
  molecular_functions:
  - preferred_term: tight-junction strand structural activity
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  downstream:
  - target: Loss of the Cation Barrier at Reticular Lamina Tight Junctions
    description: >-
      Mutant claudin-14 fails to form tight junctions, so the junctions of the
      reticular lamina lose their claudin-14 component.
    evidence:
    - reference: PMID:15880785
      reference_title: "Different mechanisms preclude mutant CLDN14 proteins from forming tight junctions in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ectopic expression in L mouse fibroblasts (LM cells) of wild-type CLDN14 protein induced the formation of tight junctions, while both the c.254T>A (p.V85D) mutant, previously identified in a Pakistani family, and the c.301 G>A (p.G101R) mutant, identified in this study through the screen of 183 Spanish and Greek patients affected with sporadic nonsyndromic deafness, failed to form such junctions."
      explanation: Two patient missense alleles cannot form tight junctions in a cell model.

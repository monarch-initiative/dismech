  - preferred_term: bicellular tight junction
    term:
      id: GO:0005923
      label: bicellular tight junction
  biological_processes:
  - preferred_term: paracellular cation transport
    modifier: INCREASED
    term:
      id: GO:0160184
      label: paracellular transport
  locations:
  - preferred_term: spiral organ of cochlea
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Cation Overload Around Outer Hair Cell Basolateral Membranes
    description: >-
      The barrier keeps the fluid around the basolateral surface of outer hair
      cells at the right ionic composition.
    evidence:
    - reference: PMID:12913076
      reference_title: "Claudin 14 knockout mice, a model for autosomal recessive deafness DFNB29, are deaf due to cochlear hair cell degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data suggest that the TJ complex at the apex of the reticular lamina requires claudin 14 as a cation-restrictive barrier to maintain the proper ionic composition of the fluid surrounding the basolateral surface of outer hair cells."
      explanation: The authors' conclusion links the claudin-14 barrier to the ionic environment of outer hair cells.
  evidence:
  - reference: PMID:12913076
    reference_title: "Claudin 14 knockout mice, a model for autosomal recessive deafness DFNB29, are deaf due to cochlear hair cell degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In wild type mice, claudin 14 was immunolocalized at hair cell and supporting cell TJs."
    explanation: Claudin-14 is in the tight junctions of hair cells and supporting cells.
  - reference: PMID:11163249
    reference_title: "Mutations in the gene encoding tight junction claudin-14 cause autosomal recessive deafness DFNB29."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In situ hybridization and immunofluorescence studies demonstrated mouse claudin-14 expression in the sensory epithelium of the organ of Corti."
    explanation: Claudin-14 is expressed in the organ of Corti sensory epithelium.
  - reference: PMID:12913076
    reference_title: "Claudin 14 knockout mice, a model for autosomal recessive deafness DFNB29, are deaf due to cochlear hair cell degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Monolayers of MDCK cells expressing claudin 14 show a 6-fold increase in the transepithelial electrical resistance by decreasing paracellular permeability for cations."
    explanation: Claudin-14 lowers paracellular cation permeability in an epithelial cell model.
  - reference: PMID:12913076
    reference_title: "Claudin 14 knockout mice, a model for autosomal recessive deafness DFNB29, are deaf due to cochlear hair cell degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cldn14-null mice have a normal endocochlear potential but are deaf due to rapid degeneration of cochlear outer hair cells, followed by slower degeneration of the inner hair cells, during the first 3 weeks of life."
    explanation: The endocochlear potential is normal, so the defect is not a loss of the potential.

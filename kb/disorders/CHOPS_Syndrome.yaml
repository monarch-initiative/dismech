inheritance:
- name: Autosomal dominant, de novo
  description: >-
    CHOPS syndrome is autosomal dominant. Every reported proband whose parents were
    tested carries a de novo AFF4 variant; no vertically transmitted family has been
    described, and sib recurrence risk is quoted at roughly 1% on the basis of
    possible parental gonadal mosaicism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFF4-related CHOPS syndrome is an autosomal dominant disorder."
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands reported to date with AFF4-related CHOPS syndrome whose parents have undergone molecular genetic testing have the disorder as the result of a de novo pathogenic variant."
    explanation: >-
      Establishes that the disorder arises de novo rather than being inherited.
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is, however, a recurrence risk (~1%) to sibs based on the possibility of parental gonadal mosaicism."
    explanation: >-
      Quantifies the residual sib recurrence risk that follows from gonadal
      mosaicism, which is what makes prenatal testing a discussable option.

pathophysiology:
- name: De Novo AFF4 ALF-Homology-Domain Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous de novo missense variant in AFF4 (chromosome 5q31.1). The
    reported alleles cluster in a 14-amino-acid stretch (residues ~251-263) of the
    ALF (AF4/LAF4/FMR2) homology domain: p.Pro253Arg, p.Pro253Leu, p.Thr254Ala,
    p.Thr254Ser, p.Ala255Thr, p.Ala255Val, p.Arg258Trp, p.Met260Thr and
    p.Met260Val. p.Arg258Trp is the recurrent allele. This node records the genomic
    lesion only; no truncating or whole-gene-deletion allele has been implicated,
    which is itself an argument against haploinsufficiency.
  genetic_context:
    gene:
      preferred_term: AFF4
      term:
        id: hgnc:17869
        label: AFF4
    allele_type: missense
    variant_origin: DE_NOVO
    allelic_events:
    - MISSENSE_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      A single de novo heterozygous missense allele in the AFF4 ALF homology domain.
      The consequence is gain of function - escape from SIAH1-mediated degradation -
      not haploinsufficiency; no truncating allele has been implicated.
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the missense mutations found in AFF4 (c.760A>G (p.Thr254Ala), c.761C>G (p.Thr254Ser) and c.772C>T (p.Arg258Trp)) were de novo"
    explanation: >-
      Reports the three founding alleles and their de novo status.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 3 missense mutations were located within the ALF (AF4/LAF4/FMR2) homology domain of AFF4, and these missense mutations altered highly evolutionarily conserved amino acids"
    explanation: >-
      Localises the lesion to the ALF homology domain and notes the conservation of
      the affected residues.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the mutations identified in CHOPS syndrome were de novo, and those clustered in the ALF homology domain"
    explanation: >-
      Confirms clustering and de novo origin across an eleven-individual cohort.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p. R258W mutation represents the most common recurrent mutation, and this mutation accounted for 55% of CHOPS syndrome cases."
    explanation: >-
      Identifies the recurrent allele and its share of reported cases.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there are no missense variants reported in this region in ExAC"
    explanation: >-
      Population-database constraint on the affected 14-amino-acid stretch, which is
      why variants there are interpretable as pathogenic.
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, all CHOPS-related pathogenic variants are located in the AFF4 ALF homology domain."
    explanation: >-
      GeneReviews restates the domain restriction as a diagnostic rule.
  downstream:
  - target: Loss of SIAH1-Mediated Degradation of AFF4
    causal_link_type: DIRECT
    description: >-
      The substituted residues sit in the degron that SIAH1 must recognise, so the
      variant protein is no longer efficiently ubiquitinated and degraded.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the missense mutations found in the three CHOPS syndrome probands caused a decreased clearance of mutated AFF4 protein due to the acquired resistance to SIAH1-mediated proteasomal degradation"
      explanation: >-
        States the causal step from the missense variant to loss of SIAH1-mediated
        clearance.

- name: Loss of SIAH1-Mediated Degradation of AFF4
  biological_scale: MOLECULAR
  description: >-
    Wild-type AFF4 is cleared by the SIAH1 ubiquitin E3 ligase through the
    proteasome. Co-expression experiments in HEK293T cells show that each CHOPS
    allele resists SIAH1-driven degradation, and proteasome inhibition with MG132
    restores wild-type AFF4 levels - confirming the route being escaped is
    proteasomal. The same escape was demonstrated independently for the later
    alleles p.Ala255Thr and p.Pro253Arg. This is a protein-turnover defect, distinct
    from the abundance change it produces.
  molecular_functions:
  - preferred_term: SIAH1 ubiquitin ligase binding
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: proteasomal degradation of AFF4
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the AFF4 constructs containing the missense mutations found in the three CHOPS syndrome probands hindered the degradation of AFF4 with SIAH1 overexpression"
    explanation: >-
      Direct demonstration that the CHOPS alleles escape SIAH1-mediated degradation.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The addition of MG132, which is a proteosomal degradation inhibitor, resulted in the recovery of AFF4 bands."
    explanation: >-
      Identifies the proteasome as the degradation route being escaped.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both p.A255T and p.P253R mutants showed a similar resistance to degradation when co-transfected with SIAH1 as the p.T254A mutant"
    explanation: >-
      Extends the same degradation-resistance mechanism to two later-identified
      alleles.
  downstream:
  - target: Accumulation of Chromatin-Associated AFF4 Protein
    causal_link_type: DIRECT
    description: >-
      Reduced clearance raises the steady-state amount of AFF4 protein.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The amount of AFF4 protein in patient derived skin fibroblasts was elevated, supporting the suggestion that the missense mutations found in these probands results in a more stable AFF4 protein"
      explanation: >-
        Links reduced clearance to the measured rise in AFF4 protein in patient cells.

- name: Accumulation of Chromatin-Associated AFF4 Protein
  biological_scale: MOLECULAR
  description: >-
    AFF4 protein is elevated in patient-derived skin fibroblasts while AFF4 mRNA is
    unchanged, confirming a post-translational cause. The excess partitions
    specifically to the chromatin fraction, and the other SEC components ELL2 and
    CDK9 are not correspondingly increased - so the complex is not simply more
    abundant; its scaffold is over-represented on chromatin. Deleting the mutant
    allele in a patient line lowers AFF4 back down, attributing the accumulation to
    the mutant allele rather than to a trans effect.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  cellular_components:
  - preferred_term: super elongation complex
    term:
      id: GO:0032783
      label: super elongation complex
  biological_processes:
  - preferred_term: AFF4 protein stabilization
    term:
      id: GO:0050821
      label: protein stabilization
    modifier: INCREASED
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amount of AFF4 protein in patient derived skin fibroblasts was elevated, supporting the suggestion that the missense mutations found in these probands results in a more stable AFF4 protein"
    explanation: >-
      Establishes AFF4 protein accumulation in patient cells.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "accumulation of AFF4 mainly occurred on the chromatin fraction in the CHOPS syndrome cell lines"
    explanation: >-
      Localises the excess AFF4 to chromatin, which is where it acts.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amount of other SEC components such as ELL2 and CDK9 did not show major alterations in the chromatin fraction of the CHOPS syndrome cell lines."
    explanation: >-
      Shows the accumulation is scaffold-specific rather than a uniform increase in
      the whole complex - the reason this node is worth separating from SEC activity.
  downstream:
  - target: Dysregulated SEC-Dependent Transcriptional Elongation
    causal_link_type: DIRECT
    description: >-
      Excess chromatin-bound AFF4 alters the genome-wide deployment of the SEC and
      of RNA polymerase II.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transcriptome and chromatin immunoprecipitation sequencing (ChIP-seq) analyses demonstrated similar alterations of genome-wide binding of AFF4, cohesin and RNAP2 in CdLS and CHOPS syndrome."
      explanation: >-
        Measures the altered genome-wide deployment that this edge asserts.
  - target: Attenuation of Enhancer Complexes and Enhancer-Promoter Looping
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In patient cells the enhancer landscape is degraded in parallel with the
      elongation defect; the step from AFF4 accumulation to enhancer-complex loss is
      not yet resolved mechanistically.

- name: Dysregulated SEC-Dependent Transcriptional Elongation
  biological_scale: MOLECULAR
  description: >-
    The super elongation complex mobilises promoter-proximally paused RNA polymerase
    II, with its P-TEFb (CDK9-cyclin T1) module phosphorylating Ser2 of the RNAP2
    C-terminal domain to license productive elongation. With AFF4 over-represented on
    chromatin, genome-wide binding of AFF4, RNAP2 and cohesin is altered and direct
    AFF4 target genes are de-repressed: MYC, JUN, TMEM100, ZNF711 and FAM13C are all
    significantly upregulated in patient fibroblasts. This is the gain-of-function
    read-out that names the mechanism.
  biological_processes:
  - preferred_term: transcription elongation by RNA polymerase II
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
    modifier: GAIN_OF_FUNCTION
  - preferred_term: positive regulation of transcriptional elongation
    term:
      id: GO:0032968
      label: positive regulation of transcription elongation by RNA polymerase II
    modifier: INCREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptional elongation is critical for gene expression regulation during embryogenesis. The super elongation complex (SEC) governs this process by mobilizing paused RNA polymerase II (RNAP2)."
    explanation: >-
      States the normal function of the complex whose activity is dysregulated here.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CDK9 phosphorylates the Ser2 residue of RNAP2 in order for initiation of transcriptional elongation"
    explanation: >-
      Names the molecular step by which the SEC licenses productive elongation.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The up-regulation of 5 of these genes was statistically significant: MYC, JUN, TMEM100, ZNF711 and FAM13C. These observations further support the notion that AFF4 mutations render gain-of-function effects."
    explanation: >-
      Quantitative evidence that direct AFF4 targets are de-repressed, and the
      authors' own basis for calling the mechanism gain of function.
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptome and chromatin immunoprecipitation sequencing (ChIP-seq) analyses demonstrated similar alterations of genome-wide binding of AFF4, cohesin and RNAP2 in CdLS and CHOPS syndrome."
    explanation: >-
      Genome-wide evidence that AFF4, cohesin and RNAP2 deployment is altered.
  - reference: PMID:37528066
    reference_title: "Distinct roles of two SEC scaffold proteins, AFF1 and AFF4, in regulating RNA polymerase II transcription elongation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AFF1 mainly binds upstream of the TSS, while AFF4 is enriched downstream of the TSS."
    explanation: >-
      Establishes that AFF4 specifically occupies the post-initiation region where
      elongation is controlled, which is why an excess of chromatin-bound AFF4 is
      expected to act on elongation rather than on initiation. This is general cell
      biology in non-CHOPS cells, not a patient-derived observation.
  - reference: PMID:37528066
    reference_title: "Distinct roles of two SEC scaffold proteins, AFF1 and AFF4, in regulating RNA polymerase II transcription elongation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "disruption of AFF4 results in slow elongation and early termination in a subset of AFF4-bound active genes, whereas AFF1 deletion leads to fast elongation and transcriptional readthrough in the same subset of genes"
    explanation: >-
      Shows AFF4 dosage on chromatin sets elongation rate and termination in a
      gene-selective way. It is curated as PARTIAL because the experiment is AFF4
      loss, the opposite direction from the CHOPS gain of function, so it constrains
      the mechanism without directly evidencing it.
  downstream:
  - target: Global Transcriptional Dysregulation of Developmental Gene Programmes
    causal_link_type: DIRECT
    description: >-
      Altered elongation control propagates into a genome-scale change in the
      developmental transcriptome.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using an FDR cutoff of 0.2, 288 genes were downregulated in patient skin fibroblasts, and 445 genes were upregulated in patient samples"
      explanation: >-
        Quantifies the genome-scale transcriptional change in patient cells.

- name: Attenuation of Enhancer Complexes and Enhancer-Promoter Looping
  biological_scale: MOLECULAR
  description: >-
    Chromosome-architecture analysis of CHOPS and CdLS patient cell lines found
    cohesin, the cohesin loader NIPBL, BRD4 and H3K27ac all reduced at most
    enhancers, with attenuation of enhancer-promoter loops, while topologically
    associating domains were preserved. The lesion is therefore at the level of
    enhancer complex maintenance and looping, not at the level of large-scale genome
    compartmentalisation - and it is shared with CdLS, which is the structural basis
    of the two disorders' phenotypic overlap.
  biological_processes:
  - preferred_term: chromatin looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: DECREASED
  cellular_components:
  - preferred_term: cohesin complex
    term:
      id: GO:0008278
      label: cohesin complex
  cell_types:
  - preferred_term: patient-derived skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:39983729
    reference_title: "A common molecular mechanism underlying Cornelia de Lange and CHOPS syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In both patient cells, we found a decrease in cohesin, NIPBL, BRD4, and acetylation of lysine 27 on histone H3"
    explanation: >-
      Reports the loss of enhancer-complex components in CHOPS patient cells.
  - reference: PMID:39983729
    reference_title: "A common molecular mechanism underlying Cornelia de Lange and CHOPS syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, TADs were maintained in both patient cells."
    explanation: >-
      Bounds the claim: the defect is enhancer/loop-level, not TAD-level.
  - reference: PMID:39983729
    reference_title: "A common molecular mechanism underlying Cornelia de Lange and CHOPS syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings reveal a shared molecular mechanism in these syndromes and highlight unexpected roles for cohesin, cohesin loaders, and the SEC in maintaining the enhancer complexes."
    explanation: >-
      States the shared-mechanism conclusion linking CHOPS syndrome to CdLS.
  downstream:
  - target: Global Transcriptional Dysregulation of Developmental Gene Programmes
    causal_link_type: DIRECT
    description: >-
      Loss of enhancer complexes and enhancer-promoter contacts changes which
      developmental genes are transcribed.
    evidence:
    - reference: PMID:39983729
      reference_title: "A common molecular mechanism underlying Cornelia de Lange and CHOPS syndromes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These complexes are crucial for recruiting transcriptional regulators, sustaining active histone modifications, and facilitating enhancer-promoter looping."
      explanation: >-
        States that the enhancer complexes whose loss is measured are what recruit
        transcriptional regulators, which is the step this edge asserts.

- name: Global Transcriptional Dysregulation of Developmental Gene Programmes
  biological_scale: CELLULAR
  description: >-
    Expression profiling of patient fibroblasts identifies hundreds of dysregulated
    genes. Upregulated genes are enriched for homeobox proteins, skeletal system
    development and morphogenesis, anterior/posterior pattern formation, and
    embryonic organ development; downregulated genes are enriched for actin-binding
    and extracellular-matrix genes. The dysregulated set correlates positively with
    that of CdLS fibroblasts. This is the disorder-agnostic convergence point that
    CHOPS syndrome shares with the wider class of transcriptional-regulation
    disorders.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  - preferred_term: skeletal system development
    term:
      id: GO:0001501
      label: skeletal system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "upregulated genes are enriched for Homeobox proteins, skeletal system development/morphogenesis and anterior/posterior pattern formation as well as embryonic organ development/morphogenesis, and downregulated genes are enriched for actin binding genes and extracellular matrix genes"
    explanation: >-
      Characterises which developmental programmes are disturbed, connecting the
      molecular lesion to a skeletal and organ-morphogenesis phenotype.
  - reference: PMID:27867341
    reference_title: "Disorders of Transcriptional Regulation: An Emerging Category of Multiple Malformation Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some genetic disorders caused by mutations in genes encoding components of the transcriptional machinery as well as proteins involved in epigenetic modification of the genome share many overlapping features, such as facial dysmorphisms, growth problems and developmental delay/intellectual disability."
    explanation: >-
      Places CHOPS syndrome in the disorders-of-transcriptional-regulation class and
      explains why global transcriptional disturbance yields this phenotype triad.
  downstream:
  - target: Multisystem Developmental Malformation and Growth Dysregulation
    causal_link_type: DIRECT
    description: >-
      Disturbed developmental transcription during embryogenesis produces structural
      malformation across organ systems.
  - target: Food-Seeking Behaviour and Impaired Satiety
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from transcriptional dysregulation to the appetite phenotype is not
      established; the link is asserted only as an unexplained consequence.

- name: Multisystem Developmental Malformation and Growth Dysregulation
  biological_scale: ORGANISM
  description: >-
    The organism-level convergence node: craniofacial, cardiac, pulmonary, skeletal,
    genitourinary, ocular and neurodevelopmental structures are all affected, with
    linear growth failure that is not corrected by a normal growth hormone response.
    Phenotypes attach here.
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  - preferred_term: lung development
    term:
      id: GO:0030324
      label: lung development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals have a distinct phenotype, that is, characterized by short stature, characteristic facial features (synophrys, arched eyebrows, long eyelashes, upturned nasal tip with anteverted nares and coarse, full facies), congenital heart defects, pulmonary involvement, brachydactyly and other skeletal involvement, genitourinary issues, and developmental delay/intellectual disability."
    explanation: >-
      Enumerates the organ systems that converge at this node.
  - reference: PMID:42273204
    reference_title: "CHOPS Syndrome: A Rare Malformation Syndrome with de novo AFF4 Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient exhibited significant growth failure despite an adequate growth hormone response."
    explanation: >-
      Shows the growth failure is not attributable to growth hormone deficiency,
      which is why it is placed at the developmental-programme node rather than at a

discussions:
- discussion_id: gap_pulmonary_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does AFF4 gain of function produce chronic lung disease?
  attaches_to:
  - pathophysiology#Multisystem Developmental Malformation and Growth Dysregulation
  rationale: >-
    Pulmonary involvement is one of the two features that most reliably separate
    CHOPS syndrome from CdLS, and it carries much of the morbidity - a third of the
    largest cohort required tracheostomy. Yet the largest clinical series states
    plainly that the aetiology of the chronic lung disease is undetermined, and it is
    not attributed to the cardiac lesions, prematurity, or aspiration. Nothing in the
    published transcriptomic work identifies a lung-specific programme downstream of
    excess AFF4. The pathograph therefore stops at the organism-level malformation
    node rather than inventing a pulmonary mechanism.
  evidence:
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary issues most commonly manifested as chronic lung disease, of as yet undetermined etiology"
    explanation: >-
      The source states the gap in its own words.
  proposed_experiments:
  - experiment_id: exp_lung_lineage_aff4_transcriptomics
    name: Airway and alveolar transcriptomics in AFF4 gain-of-function models
    description: >-
      Profile AFF4 occupancy and transcription in lung epithelial and mesenchymal
      lineages carrying a knock-in CHOPS allele (for example p.Arg258Trp), to test
      whether excess chromatin-bound AFF4 dysregulates a lung developmental or
      airway-remodelling programme rather than acting through a systemic route.
- discussion_id: gap_appetite_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a transcriptional-elongation defect produce hyperphagia and impaired
    satiety?
  attaches_to:
  - pathophysiology#Food-Seeking Behaviour and Impaired Satiety
  rationale: >-
    The obesity of CHOPS syndrome is behaviourally driven: satiety items score
    highest on a Prader-Willi-derived questionnaire, and families lock food away. But
    no hypothalamic, leptin-melanocortin, or other appetite-pathway link to AFF4 has
    been demonstrated, and the phenotypic resemblance to Prader-Willi syndrome is not
    evidence of a shared mechanism. The causal edge into this node is therefore
    curated as INDIRECT and the node makes no anatomical claim.
  evidence:
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The group of questions pertaining to impairment of satiety category had the highest average scores ranging from 3 to 4.5."
    explanation: >-
      Establishes that the phenotype is one of impaired satiety, which is what a
      mechanism would need to explain.
  proposed_experiments:
  - experiment_id: exp_hypothalamic_appetite_circuit_knockin
    name: Hypothalamic appetite-circuit assessment in a CHOPS knock-in model
    description: >-
      Measure food intake, satiety responses, and AFF4-dependent transcription in
      hypothalamic arcuate neurons of a mouse carrying a CHOPS AFF4 allele, to test
      whether the appetite phenotype has a central origin at all.
- discussion_id: gap_vasculopathy_association_unconfirmed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is systemic vasculopathy, including moyamoya, part of the CHOPS syndrome
    phenotype?
  attaches_to:
  - phenotypes#Moyamoya Phenomenon and Systemic Vasculopathy
  rationale: >-
    One individual with a p.Pro253Leu AFF4 variant developed moyamoya disease and
    diffuse narrowing of the renal arteries and infrarenal aorta. The observation is
    confounded: the same individual carried the RNF213 p.Arg4810Lys moyamoya
    susceptibility allele inherited from an unaffected mother. With n=1 and a
    competing explanation in the same genome, this cannot be curated as a CHOPS
    feature; the report's own authors ask for more observation. The phenotype is
    recorded with PARTIAL evidence so that a second case would be recognised as
    confirmatory rather than novel.
  evidence:
  - reference: PMID:33248856
    reference_title: "A case of CHOPS syndrome accompanied with moyamoya disease and systemic vasculopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "More clinical observations and functional studies are required to clarify this association."
    explanation: >-
      The authors explicitly decline to assert the association.
  proposed_experiments:
  - experiment_id: exp_cohort_vascular_imaging_rnf213
    name: Systematic vascular imaging in a CHOPS syndrome cohort
    description: >-
      Cerebral and abdominal vascular imaging across an unselected CHOPS syndrome
      cohort, with RNF213 genotyping, to establish whether vasculopathy occurs above
      background in AFF4 variant carriers independently of known susceptibility
      alleles.
- discussion_id: gap_shared_vs_specific_arm_partition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the CHOPS phenotypes are driven by enhancer-complex loss shared with
    CdLS, and which by the CHOPS-specific elongation gain of function?
  attaches_to:
  - pathophysiology#Attenuation of Enhancer Complexes and Enhancer-Promoter Looping
  rationale: >-
    CHOPS and CdLS patient cells converge on the same enhancer and looping defect,
    which plausibly accounts for the shared features - synophrys, arched eyebrows,
    long eyelashes, developmental delay, heart defects, hearing loss. But obesity,
    pulmonary involvement and skeletal dysplasia are CHOPS-specific and would have to
    arise from something the shared mechanism does not explain, presumably the
    elongation-side gain of function. No study has yet partitioned the phenotype
    between the two arms, so the pathograph runs both into a single convergence node
    rather than assigning phenotypes to one arm or the other.
  evidence:
  - reference: PMID:39983729
    reference_title: "A common molecular mechanism underlying Cornelia de Lange and CHOPS syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings reveal a shared molecular mechanism in these syndromes and highlight unexpected roles for cohesin, cohesin loaders, and the SEC in maintaining the enhancer complexes."
    explanation: >-
      Establishes the shared arm whose phenotypic scope is the open question.
  proposed_experiments:
  - experiment_id: exp_isogenic_lineage_enhancer_comparison
    name: Allele-resolved comparison of CHOPS and CdLS transcriptomes by lineage
    description: >-
      Differentiate isogenic CHOPS-allele and NIPBL-haploinsufficient iPSC lines into
      lung, cartilage and hypothalamic lineages and compare enhancer occupancy and
      transcription, to identify which programmes diverge between the two disorders
      and therefore which phenotypes belong to the CHOPS-specific arm.

experimental_models:
- name: CHOPS patient-derived dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblast lines from individuals carrying p.Thr254Ala, p.Thr254Ser
    and p.Arg258Trp, with hTERT-immortalised derivatives, compared against
    age- and sex-matched controls and against NIPBL-mutant CdLS fibroblasts. This is
    the system in which every human-cell observation of the CHOPS mechanism was made.
  publication: PMID:25730767
  modeled_mechanisms:
  - target: Accumulation of Chromatin-Associated AFF4 Protein
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the direct human measurement of AFF4 protein level and its chromatin
      partitioning in cells carrying the endogenous variant.
    limitations: >-
      Dermal fibroblasts are not the affected lineage for any CHOPS phenotype - not
      lung, not cartilage, not neurons - so the magnitude and gene-selectivity of
      AFF4 accumulation in the tissues that actually malform is inferred, not
      measured. Few patient lines were available and controls were correspondingly few.
    readouts:
    - name: Chromatin-fraction AFF4 protein abundance by western blot
      target: Accumulation of Chromatin-Associated AFF4 Protein
      direction: INCREASED
      interpretation: >-
        The variant protein accumulates specifically on chromatin.
      evidence:
      - reference: PMID:25730767
        reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "accumulation of AFF4 mainly occurred on the chromatin fraction in the CHOPS syndrome cell lines"
        explanation: >-
          Reports the fractionation result behind this readout.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The amount of AFF4 protein in patient derived skin fibroblasts was elevated, supporting the suggestion that the missense mutations found in these probands results in a more stable AFF4 protein"
      explanation: >-
        Justifies the patient fibroblast line as informative for the protein-stability
        mechanism.
  - target: Global Transcriptional Dysregulation of Developmental Gene Programmes
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Supplies the expression-profiling and RNA-seq data defining the dysregulated
      gene set, and the comparison against CdLS fibroblasts.
    limitations: >-
      A fibroblast transcriptome cannot report the developmental programmes of the
      tissues that malform, so the reported enrichment for homeobox and
      skeletal-development genes is suggestive of, not equivalent to, the in vivo
      lesion. Only two patient lines were profiled on the microarray, at an FDR
      cutoff of 0.2.
    readouts:
    - name: Differentially expressed gene count in patient fibroblasts
      target: Global Transcriptional Dysregulation of Developmental Gene Programmes
      direction: ALTERED
      interpretation: >-
        Hundreds of genes change expression in either direction.
      evidence:
      - reference: PMID:25730767
        reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Using an FDR cutoff of 0.2, 288 genes were downregulated in patient skin fibroblasts, and 445 genes were upregulated in patient samples"
        explanation: >-
          Reports the differential-expression counts behind this readout.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we performed genome-wide expression profiling using Affymetrix U133plus2 chips on patient derived skin fibroblast cell lines"
      explanation: >-
        Establishes that the transcriptomic claims rest on this cell system.
- name: HEK293T AFF4/SIAH1 co-overexpression assay
  experimental_model_type: CELL_LINE
  description: >-
    Transient co-transfection of tagged wild-type or CHOPS-variant AFF4 with SIAH1 in
    HEK293T cells, read out by western blot, with MG132 used to confirm the
    proteasomal route. This is the assay that established gain of function and that
    was reused to validate each newly reported allele.
  publication: PMID:25730767
  modeled_mechanisms:
  - target: Loss of SIAH1-Mediated Degradation of AFF4
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Directly tests whether each variant escapes SIAH1-driven degradation, and is
      the standard functional-validation step for a candidate CHOPS allele.
    limitations: >-
      Both proteins are supraphysiologically overexpressed from cDNA in a
      kidney-derived immortalised line, so the assay establishes that the variant can
      escape SIAH1 but says nothing about the size of the effect at endogenous
      stoichiometry, in a relevant tissue, or during development.
    readouts:
    - name: AFF4 protein level under SIAH1 co-expression
      target: Loss of SIAH1-Mediated Degradation of AFF4
      direction: UNCHANGED
      interpretation: >-
        Variant AFF4 is not depleted by SIAH1 co-expression, whereas wild-type AFF4
        is - the definition of degradation resistance in this assay.
      evidence:
      - reference: PMID:31058441
        reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "both p.A255T and p.P253R mutants showed a similar resistance to degradation when co-transfected with SIAH1 as the p.T254A mutant, while WT AFF4 experienced a significant decrease when co-transfected with SIAH1"
        explanation: >-
          Reports the comparative band intensities behind this readout.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we created an AFF4 and SIAH1 overexpression model using HEK293T cells"
      explanation: >-
        Establishes the assay system used for the degradation-resistance claim.

animal_models:
- name: robotic mouse (ENU Aff1 ALF-homology-domain missense)
  species: Mouse
  genotype: Aff1 (Af4) ALF homology domain missense, ENU-induced
  publication: PMID:25730767
  description: >-
    An ENU-mutagenesis ataxia mouse carrying a missense change in the ALF homology
    domain of Aff1, the AFF4 paralogue. Its mechanism - gain of function through
    reduced SIAH1-mediated clearance - is the precedent that led the CHOPS discovery
    team to test the same hypothesis for AFF4. It is a mechanistic analogy, not a
    CHOPS disease model.
  modeled_mechanisms:
  - target: Loss of SIAH1-Mediated Degradation of AFF4
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Demonstrates in a whole organism that a missense change in this domain of an
      ALF-family protein produces gain of function via escape from SIAH1-mediated
      degradation.
    limitations: >-
      The mutated gene is Aff1, not Aff4, and the phenotype is ataxia - not the
      craniofacial, cardiac, pulmonary, skeletal or obesity features of CHOPS
      syndrome. No mouse carrying a CHOPS Aff4 allele has been reported, so there is
      currently no animal model of the disorder itself; this model supports only the
      degradation-escape step.
    evidence:
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "A missense mutation in the ALF homology domain of Aff1 (Af4) was reported in the robotic mouse, an ataxia mouse model created by ENU mutagenesis"
      explanation: >-
        Establishes the existence and nature of the model. Curated as PARTIAL because
        the gene is the paralogue and the phenotype is not CHOPS syndrome.
    - reference: PMID:25730767
      reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "The pathogenetic mechanism of this missense mutation is a gain-of-function effect due to decreased clearance of the protein by SIAH1 ubiquitin E3 ligase"
      explanation: >-
        States the shared mechanism - degradation escape - that makes this model
        informative for the AFF4 node despite the gene and phenotype mismatch.


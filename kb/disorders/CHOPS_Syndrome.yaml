- name: Food-Seeking Behaviour and Impaired Satiety
  biological_scale: ORGANISM
  description: >-
    Excessive food-seeking behaviour with impaired satiety is near-universal and is
    one of the features that distinguishes CHOPS syndrome from CdLS. On a
    food-related problems questionnaire originally designed for Prader-Willi
    syndrome, the impairment-of-satiety items scored highest, every respondent
    reported their child helping themselves to forbidden food, and most families had
    found it necessary to lock food away. The node is behavioural and deliberately
    makes no hypothalamic claim - no mechanism linking AFF4 to appetite regulation
    has been demonstrated.

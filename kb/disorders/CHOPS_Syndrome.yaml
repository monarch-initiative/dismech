genetic:
- name: AFF4
  association: De novo heterozygous missense variants in the ALF homology domain
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    AFF4 (chromosome 5q31.1) encodes the scaffold subunit of the super elongation
    complex. Every CHOPS allele is a missense change within a highly conserved
    14-amino-acid stretch of the ALF homology domain (approximately residues
    251-263), which carries the SIAH1 degron. p.Arg258Trp is recurrent and accounted
    for 55% of cases in the largest published series; p.Pro253Arg, p.Pro253Leu,
    p.Thr254Ala, p.Thr254Ser, p.Ala255Thr, p.Ala255Val, p.Met260Thr and p.Met260Val
    are also reported. The mechanism is gain of function through escape from
    proteasomal degradation, not haploinsufficiency - no truncating allele has been
    implicated, and the restriction of pathogenic variation to this one small domain
    is what makes targeted AFF4 sequencing a viable diagnostic route.
  gene_term:
    preferred_term: AFF4
    term:
      id: hgnc:17869
      label: AFF4
  evidence:
  - reference: PMID:25730767
    reference_title: "Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally linking the super elongation complex and cohesin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we discovered missense mutations in AFF4, a core component of the SEC, in three unrelated probands with a new syndrome that phenotypically overlaps Cornelia de Lange syndrome (CdLS) that we have named CHOPS syndrome"
    explanation: >-
      Establishes AFF4 as the causative gene and names the disorder.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p. R258W mutation represents the most common recurrent mutation, and this mutation accounted for 55% of CHOPS syndrome cases."
    explanation: >-
      Quantifies the recurrent allele's contribution.
  - reference: PMID:40904637
    reference_title: "Identification of a novel de novo AFF4 variant (c.778A>G) associated with CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses identified a de novo heterozygous c.778A>G (p.Met260Val) variant in AFF4 in the proband, absent in parents and little sister"
    explanation: >-
      Independent replication in an unrelated family, extending the allelic
      spectrum with trio confirmation of de novo status.
  - reference: PMID:37815186
    reference_title: "The Biological Significance of AFF4: Promoting Transcription Elongation, Osteogenic Differentiation and Tumor Progression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As a member of the AF4/FMR2 (AFF) family, AFF4 is a scaffold protein in the superelongation complex (SEC)."
    explanation: >-
      Establishes the normal molecular role of the gene product.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Described as extremely rare; no incidence or prevalence rate has been
    published, so no numeric rate is asserted here. The largest series describes
    eleven individuals and subsequent reports have been single cases. Ascertainment
    is likely incomplete because affected children are frequently referred first as
    suspected Cornelia de Lange syndrome.
  evidence:
  - reference: PMID:40904637
    reference_title: "Identification of a novel de novo AFF4 variant (c.778A>G) associated with CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHOPS (cognitive impairment, coarse facies, heart defects, obesity, pulmonary involvement, short stature, and skeletal dysplasia) syndrome is an extremely rare disorder with multiple congenital anomalies caused by missense variants in the ALF transcription elongation factor 4 gene (AFF4)."
    explanation: >-
      Characterises the disorder as extremely rare.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we provide clinical descriptions of an additional eight individuals with CHOPS syndrome, as well as neurocognitive analysis of three individuals."
    explanation: >-
      Establishes the size of the largest published cohort, which is the basis for
      the case-count claim.

diagnosis:
- name: Molecular Genetic Testing for a Heterozygous AFF4 Variant
  description: >-
    Diagnosis rests on identifying a heterozygous pathogenic AFF4 variant in an
    individual with suggestive clinical findings. Because pathogenic variation is
    confined to a 14-amino-acid stretch of one domain, targeted AFF4 sequencing is a
    practical alternative to exome sequencing once the gestalt is recognised - two of
    eight newly diagnosed individuals in the largest series were found this way.
  diagnosis_term:
    preferred_term: molecular genetic testing for AFF4
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Positive in affected individuals
  evidence:
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of AFF4-related CHOPS syndrome is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in AFF4 identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In fact, two out of eight of our newly identified patients were found to have AFF4 mutations by targeted AFF4 mutational analysis rather than exome sequencing."
    explanation: >-
      Shows targeted single-gene testing is a viable route once the phenotype is
      recognised clinically.
- name: Clinical Differentiation from Cornelia de Lange Syndrome
  description: >-
    CHOPS syndrome is most often mistaken for CdLS. The discriminating features are
    obesity (CdLS is growth-restricted in weight as well as height), pulmonary
    involvement, skeletal findings, and the coarse full round face that emerges with
    age - as against the shared synophrys, arched eyebrows, long eyelashes and
    upturned nose seen in both.
  presence: Discriminating clinical assessment
  evidence:
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obesity, pulmonary involvement, skeletal findings, and distinct craniofacial features are the most notable features distinguishing CHOPS syndrome from CdLS."
    explanation: >-
      Names the four discriminating feature classes.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulmonary issues are not typically observed in CdLS and the pulmonary involvement for children with CHOPS syndrome can be significant with chronic lung disease present in the majority of patients"
    explanation: >-
      Elaborates the pulmonary discriminator specifically.


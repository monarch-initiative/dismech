name: CHOPS Syndrome
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- CHOPS
- AFF4-related CHOPS syndrome
- cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
  - short stature - skeletal dysplasia syndrome
description: >-
  CHOPS syndrome is an ultra-rare autosomal dominant multiple congenital anomaly /
  intellectual disability disorder caused by de novo missense variants in AFF4, the
  scaffold subunit of the super elongation complex (SEC). The acronym, coined in the
  founding report, records the constellation of Cognitive impairment and Coarse
  facies, Heart defects, Obesity, Pulmonary involvement, and Short stature with
  Skeletal dysplasia. Every pathogenic variant reported to date falls in a highly
  conserved 14-amino-acid stretch of the AFF4 ALF homology domain, which carries the
  degron recognised by the SIAH1 ubiquitin E3 ligase. The variants do not abolish
  AFF4 function; they make the protein resistant to proteasomal clearance, so
  chromatin-associated AFF4 accumulates and SEC-dependent transcription is
  dysregulated - a gain-of-function mechanism. Because the SEC physically engages
  cohesin and RNA polymerase II, CHOPS syndrome shares a transcriptional-elongation
  and enhancer-attenuation pathology with Cornelia de Lange syndrome (CdLS), which
  is why affected children are frequently referred first as suspected CdLS. Obesity
  driven by food-seeking behaviour, chronic lung disease, and skeletal involvement
  are the features that most reliably separate CHOPS syndrome from CdLS.

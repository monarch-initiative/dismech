- name: Developmental and Educational Support
  description: >-
    Early intervention, special education and behavioural support for the
    mild-to-moderate intellectual disability and the disruptive/food-seeking
    behavioural profile. There is no disease-modifying therapy for CHOPS syndrome;
    management is entirely supportive and organ-directed.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Developmental and educational support; feeding therapy; gastrostomy tube placement as needed; nutritional management for obesity"
    explanation: >-
      GeneReviews management recommendation.
- name: Nutritional Management of Obesity
  description: >-
    Dietary management directed at the obesity, which is driven by impaired satiety
    and food-seeking behaviour rather than by a metabolic defect; families commonly
    need to restrict access to food.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gastrostomy tube placement as needed; nutritional management for obesity; standard treatments for chronic lung disease and sleep apnea"
    explanation: >-
      GeneReviews recommends nutritional management specifically for the obesity.
  target_mechanisms:
  - target: Food-Seeking Behaviour and Impaired Satiety
    treatment_effect: MODULATES
    description: >-
      Environmental food restriction manages the consequences of impaired satiety;
      it does not correct the underlying behaviour.
- name: Feeding Therapy and Gastrostomy Tube Placement
  description: >-
    Feeding therapy with gastrostomy placement where oral intake is unsafe or
    inadequate; six of eleven individuals in the largest series required a G-tube.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy tube placement
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  evidence:
  - reference: PMID:41712746
    reference_title: "AFF4-Related CHOPS Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental and educational support; feeding therapy; gastrostomy tube placement as needed"
    explanation: >-
      GeneReviews management recommendation.
  - reference: PMID:31058441
    reference_title: "Clinical and molecular spectrum of CHOPS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six individuals (Case-2, 3, 6, 7, 9, 10) required G-tube insertion."
    explanation: >-
      Quantifies how frequently gastrostomy is actually needed.
- name: Management of Chronic Lung Disease and Sleep Apnea
  description: >-
    Standard respiratory management, with tracheostomy where laryngomalacia or
    subglottic stenosis compromises the airway; three of eleven individuals in the
    largest series were tracheostomised. Because the chronic lung disease has no

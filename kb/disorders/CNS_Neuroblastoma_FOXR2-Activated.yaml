name: CNS Neuroblastoma, FOXR2-Activated
creation_date: '2026-10-30T17:00:00Z'
description: >-
  CNS neuroblastoma, FOXR2-activated is an embryonal tumour of the cerebral
  hemispheres, recognised as a tumour type in the 2021 fifth edition of the
  World Health Organization classification of central nervous system tumours.
  It is not a central nervous system form of neuroblastoma, despite the name:
  it is one of four entities carved out of the discarded category of central
  nervous system primitive neuroectodermal tumour by DNA methylation
  profiling, and it accounted for 44 of 323 (14 per cent) of tumours carrying
  that former label.

  The entity is defined by activation of FOXR2, a forkhead transcription
  factor on the X chromosome whose expression in healthy tissue is restricted
  to the testis. The activating events are structural rearrangements upstream
  of the gene, within roughly 150 kb of it, which leave the coding sequence
  untouched and instead bring FOXR2 under the control of promoters and
  enhancers of genes that are active in the tissue. Because the coding region
  is intact and no chimeric protein need result, these events can be missed
  by routine testing, and the diagnosis rests on demonstrating FOXR2
  expression or a matching methylation profile rather than on finding a
  mutation.

  Clinically it is a tumour of young children, median age around five years,
  almost always supratentorial, presenting with raised intracranial pressure
  and seizures. Nearly every tumour carries gain of chromosome 1q. Outcomes
  are good by the standards of the category it came from: five-year
  progression-free and overall survival of 63 and 85 per cent in the largest
  cohort, where most patients had craniospinal irradiation and chemotherapy.
  Late relapses occur, the latest reported at 5.9 years.
categories:
- Pediatric Cancer
- Brain Cancer
parents:
- CNS embryonal tumour
synonyms:
- CNS NB-FOXR2
- CNS neuroblastoma with FOXR2 activation
notes: >-
  This is not neuroblastoma of the central nervous system, and the name is
  the reason the entry is in this series. Neuroblastoma (MONDO:0005072) is a
  tumour of the peripheral sympathetic nervous system arising from neural
  crest-derived sympathoadrenal precursors. This is a supratentorial
  embryonal brain tumour defined by activation of a transcription factor
  that peripheral neuroblastoma does not depend on. The Neuroblastoma
  entry's scope note points here.

  FOXR2-expressing peripheral neuroblastoma is a different thing again, and
  is deliberately not covered here. About 9 per cent of neuroblastomas
  express FOXR2 with low MYCN mRNA, and that group has an unfavourable
  outcome; it is a subset of peripheral neuroblastoma, not a central nervous
  system tumour, and belongs in the Neuroblastoma entry if anywhere.

  FOXR2 overexpression is not by itself diagnostic, and neither is 1q gain.
  Both occur in other central nervous system tumours: in one series 1q gain
  was found in 70.6 per cent of high-grade gliomas that overexpressed FOXR2,
  so the combination is not specific to this entity. What distinguishes it is
  the methylation class, which is why the World Health Organization criteria
  accept a matching methylation profile as an alternative to demonstrating
  FOXR2 activation.

  No cell of origin is marked and no somatic lesion is recorded as a
  genetic_context on a pathophysiology node. The activating rearrangements
  are somatic, but they are not a single recurrent lesion, and no cell of
  origin is established for this tumour.
disease_term:
  preferred_term: CNS neuroblastoma with FOXR2 activation
  term:
    id: MONDO:0859597
    label: cns neuroblastoma with FOXR2 activation
pathophysiology:
- name: Structural Rearrangement Upstream of FOXR2
  description: >-
    Somatic structural variants clustering within roughly 150 kb upstream of
    FOXR2 on Xp11.21: interchromosomal translocations, tandem duplications,
    inversions, deletions, a mitochondrial DNA insertion creating a novel
    promoter, and truncated LINE-1 retrotransposition. They are varied in
    kind and consistent in position. Crucially they spare the coding region,
    so there need be no chimeric protein and no fusion transcript, and
    routine testing can miss them.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FOXR2
    term:
      id: hgnc:30469
      label: FOXR2
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  notes: >-
    GAIN_OF_FUNCTION rather than INCREASED because the change is qualitative.
    FOXR2 is not a brain transcription factor running faster: it is not
    expressed in brain at all, and the rearrangement puts a normally silent
    testis-restricted factor under active control in a tissue that never
    expresses it.
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide sequencing revealed complex inter- and intrachromosomal re-arrangements converging on forkhead box R2 (FOXR2) in 6/8 samples with available data, leading to increased FOXR2 gene expression levels in CNS NB-FOXR2 tumors compared with other CNS tumor entities"
    explanation: >-
      The study that defined the entity, showing varied rearrangements
      converging on FOXR2 and raising its expression above other brain
      tumours. Six of eight samples with sequencing data, so the denominator
      is small.
  - reference: PMID:41978643
    reference_title: "FOXR2-activated CNS neuroblastoma: Characterized by variable structural disruption of the FOXR2 regulatory region, recurrent copy number alterations, and elevated FOXR2 expression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this variability, all breakpoints appear to be consistently located within approximately 150 kb upstream of FOXR2, a regulatory zone that is vulnerable to genomic disruptions leading to FOXR2 activation."
    explanation: >-
      The positional consistency that makes a varied set of rearrangements
      one mechanism: the breakpoints cluster in a regulatory zone upstream of
      the gene. Drawn from a small case series combined with published cases.
  - reference: PMID:41978643
    reference_title: "FOXR2-activated CNS neuroblastoma: Characterized by variable structural disruption of the FOXR2 regulatory region, recurrent copy number alterations, and elevated FOXR2 expression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, these structural alterations do not affect the coding region of FOXR2 and may not result in RNA fusion transcripts or chimeric proteins. Instead, FOXR2 overexpression may occur through mechanisms such as promoter hijacking, which require direct assessment of gene expression."
    explanation: >-
      Why the lesion is easy to miss and why diagnosis is made on expression
      rather than on sequence: the coding region is intact and a fusion
      transcript need not be produced.
  downstream:
  - target: Aberrant FOXR2 Expression Outside the Testis
    causal_link_type: DIRECT
    description: >-
      The rearrangements bring FOXR2 under the control of promoters and
      enhancers of genes active in the tissue, so a normally silent gene is
      expressed.
- name: Aberrant FOXR2 Expression Outside the Testis
  description: >-
    FOXR2 is a forkhead transcription factor on the X chromosome whose
    expression in normal postnatal human tissue is restricted to the testis.
    In this tumour it is expressed in brain. The parallel the literature
    draws is with cancer-testis antigen genes, which sit on the X chromosome,
    are normally confined to the testis, and escape silencing through
    hypomethylation; promoter hypomethylation is described as the predominant
    regulatory mechanism, with structural variation the other route.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:35802025
    reference_title: "FOXR2 Is an Epigenetically Regulated Pan-Cancer Oncogene That Activates ETS Transcriptional Circuits."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to its widespread activation across cancers, FOXR2 expression is absent in nearly all normal postnatal human tissues."
    explanation: >-
      Establishes that expression anywhere but the testis is abnormal, which
      is what makes expression itself the diagnostic readout here. The
      analysis is of normal autopsy samples across tissues.
  - reference: PMID:35802025
    reference_title: "FOXR2 Is an Epigenetically Regulated Pan-Cancer Oncogene That Activates ETS Transcriptional Circuits."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "This observation suggests that SVs result in enhancer hijacking to promote expression of full-length FOXR2."
    explanation: >-
      Names the mechanism connecting the structural variants to expression.
      The authors frame it as a suggestion from the position of the
      breakpoints relative to enhancer and promoter marks, not as a
      demonstrated causal chain.
  downstream:
  - target: Embryonal Tumour with Neuroblastic Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      FOXR2 expression is the defining event, but the steps from it to the
      tumour are not established in this entity.
- name: Chromosome 1q Gain
  description: >-
    Gain of chromosome arm 1q is present in nearly every tumour, 43 of 44 in
    the defining series and 94 to 100 per cent in later cohorts, alongside
    frequent 16q loss and 17q gain. It has been reported to converge on
    suppression of p53 signalling through MDM4 overexpression. It is not
    specific: 1q gain was found in 70.6 per cent of high-grade gliomas
    overexpressing FOXR2, so neither 1q gain nor FOXR2 overexpression
    identifies this entity on its own.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain of chromosome arm 1q was characteristic for the CNS NB-FOXR2 entity (43/44, 98 %; p < 0.001)"
    explanation: >-
      The frequency of 1q gain in the defining cohort, and its statistical
      association with this entity against the other groups in the same
      analysis.
  - reference: PMID:40237561
    reference_title: "FOXR2 activation is not exclusive of CNS neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosome arm 1q gain (1q+), a characteristic molecular alteration of CNS NB-FOXR2, was seen in 70.6% (12/17) of HGGs with FOXR2 overexpression tested, demonstrating that the combination of 1q+ and FOXR2 overexpression is not specific to CNS NB-FOXR2."
    explanation: >-
      The bound on the previous item, and the reason this entry does not
      treat 1q gain plus FOXR2 expression as diagnostic. Seventeen gliomas
      tested, so a small denominator for a specificity claim.
  downstream:
  - target: Embryonal Tumour with Neuroblastic Differentiation
    causal_link_type: UNKNOWN
    description: >-
      Near-universal in this tumour and reported to suppress p53 signalling
      through MDM4, but no cited source shows it causes the tumour, and it
      occurs in other FOXR2-overexpressing brain tumours as well.
- name: Embryonal Tumour with Neuroblastic Differentiation
  description: >-
    The tumour that results is an embryonal neoplasm showing foci of
    neuroblastic or neuronal differentiation, which is what the World Health
    Organization's essential diagnostic criteria require alongside FOXR2
    activation or a matching methylation profile. Morphology alone does not
    make the diagnosis.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:36918978
    reference_title: "CNS neuroblastoma, FOXR2-activated and its mimics: a relevant panel approach for work-up and accurate diagnosis of this rare neoplasm."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The essential diagnostic criteria of the WHO classification defines NB-FOXR2 as an embryonal tumor having foci of neuroblastic or neuronal differentiation and a FOXR2 activation or a DNA-methylation profile aligned with this diagnosis."
    explanation: >-
      The diagnostic definition, restating the World Health Organization
      criteria rather than deriving them. Both the morphological and the
      molecular arm are required.
  - reference: PMID:36918978
    reference_title: "CNS neuroblastoma, FOXR2-activated and its mimics: a relevant panel approach for work-up and accurate diagnosis of this rare neoplasm."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In accordance with the WHO Classification, our work evidenced that a diagnosis of NB-FOXR2 based on morphology alone is currently not possible."
    explanation: >-
      This group's own finding, from cases referred to a national network on
      histological suspicion, that morphology cannot make the diagnosis.
  downstream:
  - target: Supratentorial Hemispheric Mass
    causal_link_type: DIRECT
    description: >-
      The tumour grows as a large supratentorial mass, almost always in the
      cerebral hemispheres.
- name: Supratentorial Hemispheric Mass
  description: >-
    A large supratentorial mass, usually superficial, with prominent cysts
    and necrosis and little surrounding oedema on imaging. Tumour location
    was supratentorial in all 87 cases with available information in the
    largest cohort. The mass produces the presenting features below.
  biological_scale: ORGANISM
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:34077956
    reference_title: "Therapeutic implications of improved molecular diagnostics for rare CNS embryonal tumor entities: results of an international, retrospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at diagnosis was 5.0 years (range 1.0-20.0 years), and sex ratio was nearly balanced with 56/102 females (55%) (Figure 2B, C). Tumor location was supratentorial in all 87 cases with available information (Figure 2D)."
    explanation: >-
      Age, sex and location in the largest assembled cohort. Location was
      supratentorial in every case with the information recorded, though that
      was 87 of 102.
  - reference: PMID:33270865
    reference_title: "Detailed Clinical and Histopathological Description of 8 Cases of Molecularly Defined CNS Neuroblastomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI revealed large supratentorial masses in superficial location with prominent cysts and necrosis, but little edema."
    explanation: >-
      The imaging appearance. The same sentence notes that diffusion and
      enhancement characteristics were variable, so the appearance is
      suggestive rather than diagnostic.
  downstream:
  - target: Central Nervous System Neoplasm
    causal_link_type: DIRECT
    description: The mass is what imaging shows and what is resected.
  - target: Vomiting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Raised intracranial pressure from a large hemispheric mass.
  - target: Seizure
    causal_link_type: DIRECT
    description: A cortical mass is epileptogenic.

genetic:
- name: FOXR2
  association: FOXR2 activation by upstream structural rearrangement
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  gene_term:
    preferred_term: FOXR2
    term:
      id: hgnc:30469
      label: FOXR2
  notes: >-
    The defining somatic event, and an unusual one: the activating
    rearrangements lie upstream of the gene and leave its coding sequence
    intact, so there is no variant in the protein to describe. Reported
    partners and events include JMJD1C, LOC550643 and JPX fusions, deletions
    reaching upstream of the gene, a mitochondrial DNA insertion forming a
    novel promoter, and truncated LINE-1 retrotransposition. No
    gene-disease validity assertion is recorded: these are somatic events and
    ClinGen has not curated the pair.
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since FOXR2 is not expressed in other CNS tumor types (Figure 5C) or normal brain tissues, these events are suggestive of FOXR2 activation facilitated by promoters of active genes (Figure S5F), thus instigating oncogenic activity (Rahrmann et al., 2013)."
    explanation: >-
      The argument linking the rearrangements to oncogenic activation, which
      the authors state as suggestive rather than demonstrated. The absence
      of FOXR2 from other brain tumours and normal brain is what makes the
      inference reasonable.
diagnosis:
- name: DNA Methylation Profiling
  description: >-
    Methylation profiling is what separated this entity from the other
    tumours formerly called central nervous system primitive neuroectodermal
    tumour, and the World Health Organization criteria accept a matching
    methylation profile as an alternative to demonstrating FOXR2 activation.
    It matters because the activating rearrangements are structurally varied,
    lie outside the coding region, and may produce no fusion transcript, so
    routine sequencing can miss them.
  diagnosis_term:
    preferred_term: DNA methylation profiling
  notes: >-
    No diagnosis_term is bound. A search of NCIT through the OLS4 API on 30
    Oct 2026 for DNA methylation profiling returned no clinical action term
    under NCIT:C25218 Clinical Intervention or Procedure for this assay, and
    binding a generic sequencing or laboratory term would lose the thing that
    matters, which is that the classifier is methylation-based.
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "From the remaining fraction of CNS-PNETs, we identify four new CNS tumor entities, each associated with a recurrent genetic alteration and distinct histopathological and clinical features."
    explanation: >-
      The result that created this entity and three others out of a single
      former category, by methylation profiling of 323 tumours. It is the
      basis for treating the methylation class as definitional.
  - reference: PMID:41978643
    reference_title: "FOXR2-activated CNS neuroblastoma: Characterized by variable structural disruption of the FOXR2 regulatory region, recurrent copy number alterations, and elevated FOXR2 expression."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accurate identification of such abnormalities on the DNA level requires comprehensive genomic profiling techniques, such as OGM, SV calling from whole genome sequencing, or long-read sequencing."
    explanation: >-
      Why the alternative to methylation profiling is demanding: finding the
      rearrangements on DNA needs optical genome mapping, structural-variant
      calling from whole genome sequencing, or long-read sequencing, none of
      them routine.
differential_diagnoses:
- name: Neuroblastoma
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  description: >-
    Shares the word neuroblastoma and nothing structural. Neuroblastoma is a
    peripheral sympathetic nervous system tumour of neural crest origin,
    arising in the adrenal gland or sympathetic chain. This is a
    supratentorial embryonal brain tumour. The two are confused in naming and
    in ontologies rather than at the bedside, where the site settles it
    immediately. A further source of confusion is that about 9 per cent of
    peripheral neuroblastomas express FOXR2; that group is a subset of
    peripheral neuroblastoma with an unfavourable outcome, not this entity.
  distinguishing_features:
  - A supratentorial intracranial site rather than adrenal or paraspinal
  - FOXR2 activation by upstream structural rearrangement, which peripheral neuroblastoma is not defined by
  - A distinct DNA methylation class, which is what separated this entity from the tumours it was grouped with
  - Near-universal 1q gain, where peripheral neuroblastoma is characterised by MYCN amplification and segmental changes at other loci
  evidence:
  - reference: PMID:34110923
    reference_title: "FOXR2 Stabilizes MYCN Protein and Identifies Non-MYCN-Amplified Neuroblastoma Patients With Unfavorable Outcome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three combined neuroblastoma data sets, 9% of tumors show expression of FOXR2 but have low levels of MYCN mRNA."
    explanation: >-
      The fact that makes this differential worth stating: FOXR2 expression
      occurs in peripheral neuroblastoma too, in about 9 per cent of tumours,
      so FOXR2 expression alone does not mean this entity. The analysis
      pools three expression data sets, 90 of 1025 cases.
- name: High-Grade Glioma with FOXR2 Overexpression
  description: >-
    The differential that FOXR2 testing does not settle. High-grade gliomas
    can overexpress FOXR2, and 1q gain was present in 70.6 per cent of those
    tested, so the combination that characterises this entity is not unique
    to it. Structural rearrangement is described as the preferred activation
    mechanism in cerebral tumours including both. The methylation class is
    what separates them.
  distinguishing_features:
  - A CNS NB-FOXR2 methylation class, rather than a glioma class
  - Embryonal morphology with neuroblastic or neuronal differentiation rather than glial morphology
  - Neither FOXR2 overexpression nor 1q gain separates them, alone or together
  evidence:
  - reference: PMID:40237561
    reference_title: "FOXR2 activation is not exclusive of CNS neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosome arm 1q gain (1q+), a characteristic molecular alteration of CNS NB-FOXR2, was seen in 70.6% (12/17) of HGGs with FOXR2 overexpression tested, demonstrating that the combination of 1q+ and FOXR2 overexpression is not specific to CNS NB-FOXR2."
    explanation: >-
      The authors' own statement that the combination is not specific, with
      the figure behind it. Seventeen gliomas tested, a small denominator.
treatments:
- name: Craniospinal Irradiation with Chemotherapy
  description: >-
    The best-documented approach is upfront craniospinal irradiation with
    chemotherapy. In the largest cohort, 35 of 42 progression-free survivors
    had received it, five-year progression-free and overall survival were 63
    and 85 per cent, and the authors attribute the favourable outcome to the
    use of craniospinal irradiation, noting a higher recurrence rate in
    patients who were not irradiated or were irradiated locally. They propose
    that a standard-risk craniospinal irradiation regimen be evaluated
    prospectively, which has not yet been done. Late relapses occur, the
    latest at 5.9 years, so follow-up has to be long.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Supratentorial Hemispheric Mass
    description: >-
      Craniospinal irradiation treats the primary mass and the neuraxis. The
      link records the target, not a proven benefit; the evidence is
      retrospective.
  evidence:
  - reference: PMID:34077956
    reference_title: "Therapeutic implications of improved molecular diagnostics for rare CNS embryonal tumor entities: results of an international, retrospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Best treatment results were achieved for CNS NB-FOXR2 patients (5-year PFS: 63% ± 7%, OS: 85% ± 5%, n = 63), with 35/42 progression-free survivors after upfront craniospinal irradiation (CSI) and chemotherapy."
    explanation: >-
      The survival figures and the treatment most survivors received. A
      retrospective assembled cohort rather than a trial, so the association
      between craniospinal irradiation and outcome is not randomised.
  - reference: PMID:34077956
    reference_title: "Therapeutic implications of improved molecular diagnostics for rare CNS embryonal tumor entities: results of an international, retrospective study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the favorable survival for patients with CNS NB-FOXR2 is clearly confirmed in our series, our data show a higher rate of recurrences in nonirradiated and locally irradiated patients."
    explanation: >-
      The comparison that supports craniospinal rather than local
      irradiation. It is a within-cohort comparison between non-randomised
      treatment groups, so selection by disease extent cannot be excluded,
      which is why this is graded INDIRECT.
  - reference: PMID:34077956
    reference_title: "Therapeutic implications of improved molecular diagnostics for rare CNS embryonal tumor entities: results of an international, retrospective study."
    supports: SUPPORT
    directness: DIRECT

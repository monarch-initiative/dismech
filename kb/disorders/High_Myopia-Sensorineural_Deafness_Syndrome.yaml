- discussion_id: slitrk6_vestibular_human_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Slitrk6-knockout mice lose innervation of the posterior crista and have reduced vertical
    vestibulo-ocular reflex gain, yet vestibular testing in SLITRK6-deficient patients has been
    reported as normal in most ears. Is vertical semicircular canal function spared in
    patients, or has it not been tested?
  rationale: >-
    The reported human vestibular data are vestibular evoked myogenic potentials, which assess
    otolith organs, and an archival summary that vestibular testing was normal. The mouse
    deficit concerns the posterior crista, a semicircular canal organ, and the vertical
    vestibulo-ocular reflex. The human and mouse findings may therefore not measure the same
    end organ, and the apparent mismatch could be a testing gap rather than a species
    difference.
  attaches_to:
  - pathophysiology#Reduced Cochlear Innervation and Spiral Ganglion Neuron Loss
  - animal_models#Mouse
  posed_by: dismech curation
  posed_date: "2026-11-11T22:30:00Z"
  evidence:
  - reference: PMID:19936227
    reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the vestibule, the innervation to the posterior crista was often lost, reduced, or sometimes misguided."
    explanation: The vestibular innervation defect in the knockout.
  - reference: PMID:21298075
    reference_title: "Impaired auditory-vestibular functions and behavioral abnormalities of Slitrk6-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A vestibulo-ocular reflex (VOR) test showed decreased vertical (head movement-induced) VOR gains and normal horizontal VOR."
    explanation: The functional vestibular deficit in the knockout is confined to the vertical reflex.
  - reference: PMID:23946138
    reference_title: "A homozygous SLITRK6 nonsense mutation is associated with progressive auditory neuropathy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular evoked myogenic potentials were normal in three ears and absent in one."
    explanation: The human vestibular data come from otolith-based testing in four ears.
  - reference: PMID:25590127
    reference_title: "Deafness and Myopia Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In individuals with a molecularly confirmed diagnosis reported to date, hearing loss was progressive and severity ranged from moderate to profound. Vestibular testing was normal."
    explanation: The archival summary reports normal vestibular testing without naming the tests.
  proposed_experiments:
  - experiment_id: slitrk6_vertical_canal_testing
    name: Semicircular canal testing in SLITRK6-deficient patients
    description: >-
      Video head impulse testing of all six semicircular canals, including the posterior
      canals, together with caloric testing, in molecularly confirmed patients of different
      ages.
    supporting_outcome:
    - >-
      Reduced posterior or vertical canal gain in patients would show that the mouse vestibular
      phenotype is conserved and was missed by otolith-based testing.
    refuting_outcome:
    - >-
      Normal gain in every canal would confirm a genuine species difference in the vestibular
      consequences of SLITRK6 loss.
- discussion_id: slitrk6_axial_elongation_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does loss of SLITRK6 increase axial eye length, and does the delayed
    retinal synaptogenesis seen in knockout mice contribute to it?
  rationale: >-
    The only ocular data are the increased axial length on MRI and a delay in retinal synapse
    formation in knockout mice. No study has tested whether the retinal synaptic delay drives
    eye growth, whether SLITRK6 acts in retina, sclera or elsewhere, or whether patients have a
    retinal synaptic or electrophysiological abnormality.
  attaches_to:
  - pathophysiology#Axial Eye Elongation
  - pathophysiology#Delayed Retinal Synaptogenesis
  posed_by: dismech curation
  posed_date: "2026-11-11T22:30:00Z"
  evidence:
  - reference: PMID:23543054
    reference_title: "SLITRK6 mutations cause myopia and deafness in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological investigation of WT and Slitrk6-deficient mouse retinas in postnatal development indicated a delay in synaptogenesis in Slitrk6-deficient animals."
    explanation: The retinal finding whose relationship to eye growth is untested.
notes: >-
  The GeneReviews chapter on this syndrome (PMID:25590127) has been retired; it is cited here
  only for statements that the primary reports also support. The condition was first described
  in 1968 in an Amish family, under a title naming cochlear deafness, myopia and intellectual
  impairment (PMID:5660029, no abstract available). The molecularly confirmed Old Order Amish
  patients described in 2014 had no neurological findings outside the auditory and visual
  systems on clinical examination (PMID:23946138), so intellectual impairment is not recorded as
  a feature. One affected Pakistani sibling also had glaucoma and a unilateral Duane retraction
  syndrome (PMID:33187236); as single observations these are not recorded as phenotypes.
  Orphanet lists the disorder as ORPHA:363396, which is not cached in this repository. GO has
  no molecular-function annotation for SLITRK6 in human or mouse, so the SLITRK6 node carries no
  molecular-function term.

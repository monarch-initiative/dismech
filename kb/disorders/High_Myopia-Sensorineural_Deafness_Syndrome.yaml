      explanation: Homozygosity for the founder allele in all nine affected Amish subjects.
  - name: c.696delG (p.Trp232CysfsTer10)
    description: Homozygous frameshift in exon 2 in a Moroccan family with deafness and myopia.
    gene:
      preferred_term: SLITRK6
      term:
        id: hgnc:23503
        label: SLITRK6
    evidence:

      evidence_source: HUMAN_CLINICAL
      snippet: "The analysis of the two exons of SLITRK6 gene in a Moroccan family allowed us to identify a novel single deleterious mutation c.696delG, p.Trp232Cysfs*10 at homozygous state in the exon 2 of the SLITRK6, a gene reported to cause deafness and myopia in various populations."
      explanation: The Moroccan frameshift allele.
  - name: c.120_121insT (p.Asp41Ter)
    description: >-
      Homozygous nonsense variant segregating in a consanguineous Pakistani family (family 7)
      with severe-to-profound hearing loss and myopia; it truncates about 95% of the protein.
    gene:
      preferred_term: SLITRK6
      term:
        id: hgnc:23503

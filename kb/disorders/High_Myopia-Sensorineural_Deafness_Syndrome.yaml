pathophysiology:
- name: SLITRK6 Biallelic Loss of Function
  description: >-
    Biallelic truncating SLITRK6 variants (nonsense or frameshift) remove most or all of the
    protein. Reported alleles include p.Arg181Ter, p.Ser297Ter and p.Gln414Ter in the founding
    families, p.Trp232CysfsTer10 in a Moroccan family and p.Asp41Ter in a Pakistani family. No
    missense allele has an established role, so the disease mechanism is taken to be loss of
    function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLITRK6
    term:
      id: hgnc:23503
      label: SLITRK6
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of SLITRK6 at the Cell Surface
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23543054
    reference_title: "SLITRK6 mutations cause myopia and deafness in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our molecular investigation in 3 families led to the identification of 3 homozygous nonsense mutations (p.R181X, p.S297X, and p.Q414X) in SLIT and NTRK-like family, member 6 (SLITRK6), a leucine-rich repeat domain transmembrane protein."
    explanation: The founding report identified three homozygous nonsense alleles in three families.
  - reference: PMID:33187236
    reference_title: "Genetic Spectrum of Syndromic and Non-Syndromic Hearing Loss in Pakistani Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The effect of the induced stop-codon at amino acid position 41 out of 841 amino acids encoding SLITRK6 would truncate 95% of the protein and likely be targeted by nonsense-mediated mRNA decay (NMD)"
    explanation: >-
      The p.Asp41Ter allele is predicted to remove almost the whole protein. Nonsense-mediated
      decay was predicted, not measured.
  - reference: PMID:33187236
    reference_title: "Genetic Spectrum of Syndromic and Non-Syndromic Hearing Loss in Pakistani Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Interestingly, all the previously identified variants are also either nonsense or frameshift variants, suggesting loss-of-function as an underlying mechanism."
    explanation: The authors' reading of the allelic series as of 2020 supports loss of function as the mechanism.
- name: Loss of SLITRK6 at the Cell Surface
  description: >-
    The truncated SLITRK6 proteins encoded by the founding nonsense alleles fail to reach the
    cell surface when expressed in cultured cells, so no functional SLITRK6 is expected at the
    plasma membrane of inner-ear and retinal cells. Slitrk6 is expressed in the developing
    cochlea, otic epithelium and retina. How the absence of SLITRK6 is transduced into each
    downstream defect is not known.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: SLITRK6 localization to the cell surface
    term:
      id: GO:0034394
      label: protein localization to cell surface
    modifier: DECREASED
  downstream:
  - target: Reduced Inner Ear Neurotrophin-Ntrk Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in Slitrk6-knockout mouse cochlea; the steps between SLITRK6 loss and reduced
      neurotrophin and Ntrk receptor expression are not known.
  - target: Outer Hair Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from patient physiology (absent otoacoustic emissions with a large, prolonged
      cochlear microphonic). The cellular route from SLITRK6 loss to outer hair cell
      dysfunction has not been studied.
  - target: Delayed Retinal Synaptogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Observed histologically in postnatal Slitrk6-deficient mouse retina.
  - target: Axial Eye Elongation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Measured by MRI in Slitrk6-deficient mice. Whether it follows from the retinal synapse
      delay or from another SLITRK6 function is unknown.
  evidence:
  - reference: PMID:23543054
    reference_title: "SLITRK6 mutations cause myopia and deafness in humans and mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All 3 mutant SLITRK6 proteins displayed defective cell surface localization."
    explanation: The three human truncating alleles were tested for surface localization in cultured cells.
  - reference: PMID:19936227
    reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Among 6 Slitrk family genes in mammals, Slitrk6 has a unique expression pattern, with strong expression in the sensory epithelia of the inner ear."
    explanation: Places Slitrk6 in the inner-ear sensory epithelia, where its loss acts.
  - reference: PMID:14643680
    reference_title: "Slitrk6 expression profile in the mouse embryo and its relationship to that of Nlrr3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the developing mouse embryo, Slitrk6 expression was detected in the otic cyst, lateral trunk epidermis and its underlying mesenchymal tissue, limb bud, maxillary process, pharyngeal arches, cochlea, retina, tongue, tooth primordium, central nervous system (CNS), and the visceral organ primordia including of the lung, gastrointestinal tract (particularly in the enteric neurons) and pancreas."
    explanation: >-
      Embryonic Slitrk6 expression includes the otic cyst, cochlea and retina, the tissues
      affected in the syndrome, among many others.
- name: Reduced Inner Ear Neurotrophin-Ntrk Signaling
  description: >-
    The Slitrk6-deficient mouse inner ear has mildly but significantly reduced Bdnf and Ntf3
    expression and lower total and phosphorylated Ntrk receptor levels in the cochlea. Because
    both neurotrophins are required for the innervation and survival of inner-ear sensory
    neurons, this reduction is the proposed link between SLITRK6 loss and the innervation
    defect. It has been shown in mice only.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling in the cochlea
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
    modifier: DECREASED
  locations:

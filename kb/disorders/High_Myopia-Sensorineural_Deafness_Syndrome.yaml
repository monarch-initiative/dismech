- name: Outer Hair Cell Dysfunction
  description: >-
    Distortion product otoacoustic emissions are absent in SLITRK6-deficient patients, while the
    cochlear microphonic is enlarged and prolonged in young patients and lost in the oldest. The
    authors attribute this cochlear component to outer hair cell disease, in addition to the
    neural component. The cellular mechanism is unknown; the organ of Corti is normally organized
    in knockout mice.
  biological_scale: CELLULAR
  cell_types:

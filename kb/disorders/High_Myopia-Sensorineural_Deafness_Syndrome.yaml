    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fewer and partly misrouted afferent fibers would be expected to weaken synchronous auditory
      nerve firing; the knockout mouse shows a reduced first auditory brainstem response wave,
      but the connection has not been tested directly.
  evidence:

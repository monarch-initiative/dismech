    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous SLITRK6 c.1240C>T (p.Gln414Ter) nonsense mutations are associated with high myopia, cochlear dysfunction attributed to outer hair cell disease, and progressive auditory neuropathy."

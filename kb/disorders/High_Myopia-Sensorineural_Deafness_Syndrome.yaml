name: High Myopia-Sensorineural Deafness Syndrome
category: Mendelian
creation_date: "2026-11-11T21:47:18Z"
synonyms:
- deafness and myopia
- deafness and myopia syndrome
- DFNMYP
description: >-
  High myopia-sensorineural deafness syndrome (deafness and myopia syndrome, DFNMYP) is an
  autosomal recessive disorder caused by biallelic loss-of-function variants in SLITRK6, which
  encodes a leucine-rich-repeat transmembrane protein of the SLIT and NTRK-like family. Affected
  individuals have bilateral congenital or prelingual hearing loss, moderate to profound and
  progressive, together with high myopia recognized in infancy or early childhood. In Old Order
  Amish patients homozygous for p.Gln414Ter the hearing loss behaved as an auditory neuropathy
  spectrum disorder with outer hair cell involvement: otoacoustic emissions were absent and
  auditory brainstem responses dyssynchronous. All reported disease alleles are nonsense or
  frameshift variants.

  Slitrk6-deficient mice show reduced cochlear innervation with loss of spiral and vestibular
  ganglion neurons, lower inner-ear neurotrophin and Ntrk receptor expression, a mid-frequency
  hearing loss with a reduced first auditory brainstem response wave, delayed retinal
  synaptogenesis and increased axial eye length. How loss of SLITRK6 lengthens the eye, and why
  the mice have vestibular deficits that most tested patients lack, remain open questions.

diagnosis:
- name: SLITRK6 molecular genetic testing
  description: >-
    Identification of biallelic pathogenic SLITRK6 variants confirms the diagnosis. The Moroccan
    family was diagnosed by sequencing the two SLITRK6 exons and the Pakistani family by exome
    sequencing combined with linkage mapping.
  evidence:
  - reference: PMID:25590127
    reference_title: "Deafness and Myopia Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis is established in a proband by identification of biallelic pathogenic variants in SLITRK6 on molecular genetic testing."
    explanation: The diagnostic criterion.
  - reference: PMID:33187236
    reference_title: "Genetic Spectrum of Syndromic and Non-Syndromic Hearing Loss in Pakistani Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combined exome sequencing, bioinformatics analysis, and gene mapping approach for 21 consanguineous Pakistani families revealed 13 pathogenic or likely pathogenic variants in the genes GJB2, MYO7A, FGF3, CDC14A, SLITRK6, CDH23, and MYO15A, with an overall resolve rate of 61.9%."
    explanation: Exome sequencing with mapping identified the SLITRK6 family among hearing-loss families.
- name: Physiological auditory testing for auditory neuropathy
  description: >-
    Otoacoustic emissions, cochlear microphonic, middle ear muscle reflexes and auditory
    brainstem responses together identify the auditory neuropathy spectrum disorder with outer
    hair cell involvement seen in SLITRK6 deficiency, which pure-tone audiometry alone does not
    distinguish from other sensorineural loss. Vestibular testing has been normal in most ears
    tested.
  evidence:
  - reference: PMID:23946138
    reference_title: "A homozygous SLITRK6 nonsense mutation is associated with progressive auditory neuropathy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous nonsense mutations of human SLITRK6 (c.1240C>T) are associated with an auditory neuropathy spectrum disorder (ANSD) characterized by absent MEMRs and OAEs, large and prolonged CMs, dys-synchronized ABRs, and pure tone HL that progresses with age"
    explanation: The combination of physiological findings that characterizes the auditory phenotype.
  - reference: PMID:23946138
    reference_title: "A homozygous SLITRK6 nonsense mutation is associated with progressive auditory neuropathy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular evoked myogenic potentials were normal in three ears and absent in one."
    explanation: Vestibular testing in the Amish cohort.

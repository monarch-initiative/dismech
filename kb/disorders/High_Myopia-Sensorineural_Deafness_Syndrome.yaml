- name: Reduced Cochlear Innervation and Spiral Ganglion Neuron Loss
  description: >-
    Slitrk6-knockout mice have markedly reduced cochlear innervation, including fewer type II
    spiral fibers reaching the outer hair cell rows, with loss of spiral and vestibular ganglion
    neurons and lost, reduced or misguided innervation of the posterior crista. Knockout cochlear
    sensory epithelia support less neurite outgrowth of spiral ganglion neurons. No patient inner
    ear has been examined histologically.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:

- name: Axial Eye Elongation
  description: >-
    Slitrk6-deficient mice have longer eyes than wild-type mice on high-resolution MRI, the
    structural basis of axial myopia. This is taken as the counterpart of the high myopia in
    patients; the mechanism by which SLITRK6 loss increases axial length is not known.

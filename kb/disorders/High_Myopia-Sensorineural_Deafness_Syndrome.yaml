- name: Dyssynchronous Auditory Nerve Activity
  description: >-
    Patients homozygous for p.Gln414Ter have an auditory neuropathy spectrum disorder:
    auditory brainstem responses are dyssynchronous, with no reproducible waves I, III or V at
    high intensities, and middle ear muscle reflexes are lost with age. The knockout mouse shows
    a smaller first auditory brainstem response wave. The authors attribute the limited benefit
    of amplification to this neural component.
  biological_scale: TISSUE

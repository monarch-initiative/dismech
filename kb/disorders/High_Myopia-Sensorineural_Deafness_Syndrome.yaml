      reference_title: "Genetic Spectrum of Syndromic and Non-Syndromic Hearing Loss in Pakistani Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While the c.231G>A, p.(Trp77*) variant in GJB2 and the c.1258A>T, p.(Lys420*) variant in MYO7A were previously described as pathogenic, the nonsense variant c.120_121insT, p.(Asp41*) in SLITRK6, segregating in family 7, was novel."
      explanation: Segregation of the SLITRK6 nonsense allele in family 7.

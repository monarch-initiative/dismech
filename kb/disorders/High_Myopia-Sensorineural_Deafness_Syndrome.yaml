    evidence_source: HUMAN_CLINICAL
    snippet: "Although the preservation of OAEs and CMs has been considered evidence of normal OHCs, an especially large CM that persists for several milliseconds after a transient click stimulus suggest OHC dysfunction in SLITRK6-associated and other forms of ANSD."
    explanation: The physiological argument for outer hair cell involvement.
- name: Delayed Retinal Synaptogenesis
  description: >-
    Postnatal Slitrk6-deficient mouse retinas show delayed synapse formation on histology. This
    is the only retinal cellular phenotype reported. Its relationship to the axial elongation
    of the eye, and whether any retinal synaptic defect persists in patients, has not been
    studied.
  biological_scale: CELLULAR

differential_diagnoses:
- name: Stickler syndrome type 1
  disease_term:
    preferred_term: Stickler syndrome type 1
    term:
      id: MONDO:0007160
      label: Stickler syndrome type 1
  description: >-
    Stickler syndrome combines myopia, often high, with sensorineural hearing loss. It is an
    autosomal dominant connective tissue disorder with a characteristic vitreous phenotype,
    very frequent retinal detachment, and orofacial and articular manifestations, none of which
    is part of the SLITRK6 syndrome.
  distinguishing_features:
  - Autosomal dominant inheritance against autosomal recessive SLITRK6 deficiency.
  - Vitreous anomaly and very frequent retinal detachment in Stickler syndrome.
  - Orofacial (cleft palate) and articular manifestations in Stickler syndrome.
  evidence:
  - reference: ORPHA:828
    reference_title: Stickler syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0011003 | High myopia | Frequent (79-30%)"
    explanation: High myopia is frequent in Stickler syndrome.
  - reference: ORPHA:828
    reference_title: Stickler syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000407 | Sensorineural hearing impairment | Frequent (79-30%)"
    explanation: Sensorineural hearing impairment is frequent in Stickler syndrome.
  - reference: ORPHA:828
    reference_title: Stickler syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000541 | Retinal detachment | Very frequent (99-80%)"
    explanation: Retinal detachment is a distinguishing ocular feature.
- name: Donnai-Barrow syndrome
  disease_term:
    preferred_term: Donnai-Barrow syndrome
    term:
      id: MONDO:0009104
      label: Donnai-Barrow syndrome
  description: >-
    LRP2-related Donnai-Barrow (facio-oculo-acoustico-renal) syndrome is also autosomal
    recessive and pairs sensorineural deafness with high myopia and other ocular anomalies, but
    adds facial dysmorphism, proteinuria, epilepsy and intellectual disability.
  distinguishing_features:
  - Proteinuria in Donnai-Barrow syndrome.
  - Facial dysmorphism, epilepsy and intellectual disability, absent in SLITRK6 deficiency.
  evidence:
  - reference: PMID:37810913
    reference_title: "Behavioral Phenotype, Electroclinical Features, and Treatment Options in Twins with Lrp2 Candidate Variants (Donnay-Barrow/Foar Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "LRP2 is implicated in an autosomal recessive disorder characterized by dimorphisms, ocular anomalies, sensorineural deafness, proteinuria, epilepsy, and intellectual disability: a clinical condition called Donnai-Barrow syndrome (DBS) or facio-oculo-acoustico-renal (FOAR) syndrome."
    explanation: The deafness-plus-ocular phenotype shared with SLITRK6 deficiency, and the renal and neurological features that separate them.
  - reference: PMID:38635876
    reference_title: "Insights into Myopia from Mouse Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several other syndromes characterized by high myopia have guided mouse studies, including Donnai-Barrow syndrome, which is associated with mutations in lipoprotein receptor–related protein 2 (Lrp2) or megalin; Knobloch syndrome, which is linked with variants of collagen XVIII; and SLITRK6-associated syndrome."
    explanation: Donnai-Barrow syndrome is grouped with the SLITRK6 syndrome among monogenic high-myopia syndromes.
- name: Knobloch syndrome 1
  disease_term:
    preferred_term: Knobloch syndrome 1
    term:
      id: MONDO:0800167
      label: Knobloch syndrome 1
  description: >-
    An autosomal recessive COL18A1 disorder with early high myopia. It is distinguished by
    vitreoretinal degeneration with retinal detachment, macular abnormalities and occipital
    encephalocele; hearing loss is not among its defining features.
  distinguishing_features:
  - Vitreoretinal degeneration with retinal detachment.
  - Occipital encephalocele or other occipital scalp or skull defects.
  evidence:
  - reference: PMID:10942434
    reference_title: "Collagen XVIII, containing an endogenous inhibitor of angiogenesis and tumor growth, plays a critical role in the maintenance of retinal structure and in neural tube closure (Knobloch syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Knobloch syndrome (KS) is an autosomal recessive disorder defined by the occurrence of high myopia, vitreoretinal degeneration with retinal detachment, macular abnormalities and occipital encephalocele."
    explanation: The defining features that separate Knobloch syndrome from SLITRK6 deficiency.
animal_models:
- name: Slitrk6 knockout mouse
  species: Mouse
  genotype: Slitrk6 homozygous targeted knockout (Slitrk6-/-)
  publication: PMID:19936227
  description: >-
    Slitrk6-knockout mice have reduced cochlear innervation, loss of spiral and vestibular
    ganglion neurons, lower inner-ear neurotrophin and Ntrk receptor expression, a mid-frequency
    (8-16 kHz) hearing loss with a reduced first auditory brainstem response wave, a reduced
    auditory startle, decreased vertical vestibulo-ocular reflex gain, delayed retinal
    synaptogenesis and increased axial eye length.
  genes:
  - preferred_term: Slitrk6
    term:
      id: MGI:2443198
      label: Slitrk6
  notes: Mouse Slitrk6 is the ortholog of human SLITRK6 (hgnc:23503).
  modeled_mechanisms:
  - target: Reduced Cochlear Innervation and Spiral Ganglion Neuron Loss
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: The innervation and neuronal loss phenotype is observed directly in the knockout inner ear.
    limitations: >-
      No patient inner ear has been examined, so whether patients have the same innervation
      defect is inferred from the mouse.
    readouts:
    - name: Cochlear innervation
      target: Reduced Cochlear Innervation and Spiral Ganglion Neuron Loss
      direction: DECREASED
      interpretation: Histological measure of the innervation defect.
      evidence:
      - reference: PMID:19936227
        reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Slitrk6-deficient mice showed pronounced reduction in the cochlear innervation."
        explanation: The innervation readout.
    evidence:
    - reference: PMID:19936227
      reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results suggest that Slitrk6 promotes innervation and survival of inner ear sensory neurons by regulating the expression of trophic and/or tropic factors including neurotrophins from sensory epithelia."
      explanation: The authors' model of how Slitrk6 loss produces the innervation defect.
  - target: Reduced Inner Ear Neurotrophin-Ntrk Signaling
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    description: Neurotrophin and Ntrk receptor expression were measured in knockout inner ear tissue.
    limitations: >-
      Expression levels are a proxy for signaling activity at the cellular level, and inner-ear
      neurotrophin signaling cannot be measured in patients.
    readouts:
    - name: Bdnf and Ntf3 expression in the inner ear
      target: Reduced Inner Ear Neurotrophin-Ntrk Signaling
      direction: DECREASED
      interpretation: A mild but significant decrease.
      evidence:
      - reference: PMID:19936227
        reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Indeed the Slitrk6-deficient inner ear showed a mild but significant decrease in the expression of Bdnf and Ntf3, both of which are essential for the innervation and survival of sensory neurons."
        explanation: The neurotrophin expression readout.
    evidence:
    - reference: PMID:19936227
      reference_title: "Disorganized innervation and neuronal loss in the inner ear of Slitrk6-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, the expression of Ntrk receptors, including their phosphorylated forms was decreased in Slitrk6-knockout cochlea."
      explanation: Receptor expression and phosphorylation are reduced in the same model.
  - target: Dyssynchronous Auditory Nerve Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout has a reduced first auditory brainstem response wave and a reduced auditory
      startle, a milder counterpart of the dyssynchronous responses in patients.
    limitations: >-
      The mouse hearing loss is confined to mid frequencies (8-16 kHz), whereas patients
      progress to severe-to-profound loss with no reproducible brainstem waves; progression with
      age was not reported in the mouse.
    readouts:
    - name: Amplitude of the first auditory brainstem response wave
      target: Dyssynchronous Auditory Nerve Activity
      direction: DECREASED
      interpretation: Reduced summed auditory nerve output.
      evidence:
      - reference: PMID:21298075
        reference_title: "Impaired auditory-vestibular functions and behavioral abnormalities of Slitrk6-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Compared to wild-type mice, the auditory brainstem response (ABR) of Slitrk6-KO mice indicated a mid-frequency range (8-16 kHz) hearing loss and reduction of the first ABR wave."
        explanation: The brainstem response readout.
    evidence:
    - reference: PMID:21298075
      reference_title: "Impaired auditory-vestibular functions and behavioral abnormalities of Slitrk6-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that the Slitrk6-KO mouse can serve as a model of hereditary sensorineural deafness."
      explanation: The authors propose the knockout as a model of the deafness.
    - reference: PMID:23543054
      reference_title: "SLITRK6 mutations cause myopia and deafness in humans and mice."

treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying, pharmacological, gene, or cell therapy exists for RIN2
    syndrome and no clinical trial has been conducted. Management is symptomatic
    and multidisciplinary: orthopaedic bracing or surgery for progressive
    scoliosis, physiotherapy for joint hypermobility, dental/periodontal care for
    gingival overgrowth, hearing support, airway clearance for bronchiectasis, and
    hormone replacement for hypergonadotropic hypogonadism.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care


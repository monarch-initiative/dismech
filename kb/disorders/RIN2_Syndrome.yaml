      snippet: "These findings confirm that RIN2 defects are associated with a distinct genodermatosis and underscore the involvement of RIN2 and its associated pathways in the pathogenesis of connective tissue disorders."
      explanation: Classifies RIN2 syndrome as a genodermatosis and connective tissue disorder.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Heritable connective-tissue and musculoskeletal disorder with joint
      hypermobility, progressive scoliosis, and dermal collagen/microfibril
      abnormalities.

name: RIN2 Syndrome
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
synonyms:
- MACS syndrome
- macrocephaly, alopecia, cutis laxa, and scoliosis syndrome
- macrocephaly-alopecia-cutis laxa-scoliosis syndrome
- RIN2 deficiency
- tall forehead-sparse hair-skin hyperextensibility-scoliosis syndrome
description: >-
  RIN2 syndrome (formerly MACS syndrome: macrocephaly, alopecia, cutis laxa, and
  scoliosis) is an ultra-rare autosomal recessive connective-tissue disorder
  caused by biallelic loss-of-function variants in RIN2, which encodes Ras and
  Rab interactor 2, a Rab5-interacting regulator of early endocytic membrane
  trafficking. Defective RIN2-dependent trafficking impairs fibroblast
  secretory-pathway ultrastructure, dermal fibulin-5 and microfibril deposition,
  and collagen fibril organization, producing soft redundant and hyperextensible
  skin, progressive facial coarsening, gingival overgrowth, irregular dentition,
  sparse scalp hair, joint hypermobility, and progressive scoliosis, with
  variable visceral and neurologic manifestations.
notes: >-
  First described as MACS syndrome by Basel-Vanagaite et al. (2009); as
  additional families were reported the phenotype broadened beyond the original
  acronym and the condition was renamed RIN2 syndrome. No GeneReviews chapter
  exists for the disease or for the RIN2 gene in the NCBI Bookshelf index. The
  course is chronic and progressive (facial coarsening and scoliosis worsen with
  age) but non-lethal, with survival into adulthood; no disease-modifying
  therapy exists and management is supportive and multidisciplinary. Fewer than
  15 patients from consanguineous families have been reported.

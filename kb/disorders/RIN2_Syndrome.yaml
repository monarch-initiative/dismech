    snippet: "only nine patients from four independent families reported to date"
    explanation: Establishes the ultra-rare case count across the reported literature prior to the 10th case.
  - reference: PMID:30769224
    reference_title: "Leukoencephalopathy in RIN2 syndrome: Novel mutation and expansion of clinical spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we reported the eleventh patient of RIN2 syndrome in a 4 yr-old boy, from Tehran, Iran as the youngest reported patient so far."
    explanation: Updates the cumulative published cohort to 11 affected individuals by 2020.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by identifying biallelic (homozygous or compound
    heterozygous) loss-of-function RIN2 variants, typically by whole-exome or
    targeted gene sequencing.
  diagnosis_term:
    preferred_term: Whole-exome or targeted RIN2 sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Homozygous or compound heterozygous loss-of-function variants in RIN2.
  evidence:
  - reference: PMID:30769224
    reference_title: "Leukoencephalopathy in RIN2 syndrome: Novel mutation and expansion of clinical spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing revealed a novel frameshift homozygous variant"
    explanation: Exome sequencing established the molecular diagnosis in a patient.
  - reference: PMID:31521835
    reference_title: RIN2 and BBS7 variants as cause of a coincidental syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing analyses of the individual with multiple phenotypes revealed homozygosity for novel pathogenic variants"
    explanation: WES resolved biallelic RIN2 (and BBS7) variants in a consanguineous family.
- name: Skin biopsy electron microscopy
  description: >-
    Ultrastructural examination of a skin biopsy is a supporting test, showing
    abnormal collagen fibril morphology and dilated endoplasmic reticulum/Golgi
    in dermal fibroblasts.
  diagnosis_term:
    preferred_term: Electron microscopy of skin biopsy
    term:
      id: NCIT:C16854
      label: Electron Microscopy
  results: Abnormal dermal collagen fibril morphology and dilated endoplasmic reticulum and Golgi cisternae in skin fibroblasts.
  evidence:
  - reference: PMID:20424861
    reference_title: "The RIN2 syndrome: a new autosomal recessive connective tissue disorder caused by deficiency of Ras and Rab interactor 2 (RIN2)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural studies of the skin revealed important abnormalities in the collagen fibril morphology"
    explanation: Skin ultrastructure is the supporting diagnostic finding.
- name: Metabolic and glycosylation laboratory screening
  description: >-
    Biochemical and glycosylation screening (such as serum transferrin
    isoelectric focusing and metabolic profiling) distinguishes RIN2 syndrome
    from clinically overlapping metabolic cutis laxa syndromes (ATP6V0A2-CDG
    and other CDG, PYCR1, ALDH18A1/P5CS, ATP7A, TALDO1, GORAB).
  diagnosis_term:
    preferred_term: Metabolic laboratory screening
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Normal glycosylation and metabolic screening, helping exclude metabolic cutis laxa syndromes prior to or alongside sequencing.
  evidence:
  - reference: PMID:28409271
    reference_title: Unique presentation of cutis laxa with Leigh-like syndrome due to ECHS1 deficiency.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "macrocephaly, alopecia, cutis laxa, and scoliosis (MACS) syndrome, due to Ras and Rab interactor 2 (RIN2) mutations"
    explanation: Places MACS/RIN2 syndrome within the cutis-laxa differential.
  - reference: PMID:21431621
    reference_title: Metabolic cutis laxa syndromes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In metabolic cutis laxa syndromes the clinical and laboratory features might partially overlap, however there are some distinct, discriminative features"
    explanation: Supports using discriminative metabolic/laboratory features to separate metabolic cutis laxa from RIN2 syndrome.

differential_diagnoses:
- name: Ehlers-Danlos syndrome, dermatosparaxis type
  disease_term:
    preferred_term: Ehlers-Danlos syndrome, dermatosparaxis type
    term:
      id: MONDO:0009161
      label: Ehlers-Danlos syndrome, dermatosparaxis type
  description: >-
    Autosomal recessive Ehlers-Danlos subtype caused by ADAMTS2 deficiency that
    shares redundant, sagging facial and body skin, joint hypermobility, and
    orofacial features with RIN2 syndrome.
  distinguishing_features:
  - Extreme skin fragility with severe bruising and hieroglyphic collagen fibrils on electron microscopy (ADAMTS2) distinguishes dermatosparaxis EDS from RIN2 deficiency.
  evidence:
  - reference: PMID:27277385
    reference_title: "RIN2 syndrome: Expanding the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with RIN2 syndrome present phenotypic overlap with other conditions, including EDS (especially the dermatosparaxis and kyphoscoliosis subtypes)."
    explanation: Explicitly identifies dermatosparaxis-type EDS as a key clinical differential diagnosis.
- name: Ehlers-Danlos syndrome, kyphoscoliotic type 1
  disease_term:
    preferred_term: Ehlers-Danlos syndrome, kyphoscoliotic type 1
    term:
      id: MONDO:0016002
      label: Ehlers-Danlos syndrome, kyphoscoliotic type 1
  description: >-
    Autosomal recessive Ehlers-Danlos subtype (PLOD1) overlapping RIN2 syndrome
    through severe progressive scoliosis, joint hyperlaxity, and skin
    hyperextensibility.
  distinguishing_features:
  - Congenital muscular hypotonia, scleral fragility, abnormal urinary lysyl-pyridinoline/hydroxylysyl-pyridinoline ratio, and PLOD1 variants distinguish kyphoscoliotic EDS from RIN2 syndrome.
  evidence:
  - reference: PMID:27277385
    reference_title: "RIN2 syndrome: Expanding the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with RIN2 syndrome present phenotypic overlap with other conditions, including EDS (especially the dermatosparaxis and kyphoscoliosis subtypes)."
    explanation: Explicitly identifies kyphoscoliotic-type EDS as a key clinical differential diagnosis.

treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying, pharmacological, gene, or cell therapy exists for RIN2
    syndrome and no clinical trial has been conducted. Management is symptomatic
    and multidisciplinary: orthopaedic bracing or surgery for progressive
    scoliosis, physiotherapy for joint hypermobility, dental/periodontal care for
    gingival overgrowth, hearing support, airway clearance for bronchiectasis, and
    hormone replacement for hypergonadotropic hypogonadism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  - preferred_term: Joint hypermobility
    term:
      id: HP:0001382
      label: Joint hypermobility
  - preferred_term: Gingival overgrowth
    term:
      id: HP:0000212
      label: Gingival overgrowth
  - preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism


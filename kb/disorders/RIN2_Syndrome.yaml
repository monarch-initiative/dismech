    explanation: Orphanet epidemiology record assigning RIN2 syndrome to the <1 / 1,000,000 point-prevalence class.
- population: Worldwide (reported cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Fewer than 15 patients from consanguineous families have been reported in the literature.
  evidence:
  - reference: PMID:27277385
    reference_title: "RIN2 syndrome: Expanding the clinical phenotype."
    supports: SUPPORT
    directness: DIRECT

    - reference: PMID:27277385
      reference_title: "RIN2 syndrome: Expanding the clinical phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biallelic defects in the RIN2 gene, encoding the Ras and Rab interactor 2 protein, are associated with a rare autosomal recessive connective tissue disorder, with only nine patients from four independent families reported to date."
      explanation: Places RIN2 syndrome among heritable connective tissue disorders.

genetic:
- name: RIN2
  gene_term:
    preferred_term: RIN2
    term:
      id: hgnc:18750
      label: RIN2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_7427a25e-68a1-4e1b-b951-f1a1d7b1e52b-2023-12-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_7427a25e-68a1-4e1b-b951-f1a1d7b1e52b-2023-12-04T170000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RIN2 | HGNC:18750 | RIN2 syndrome | MONDO:0013115 | AR | Definitive | SOP9 | Lysosomal Diseases Gene Curation Expert Panel"
      explanation: ClinGen classifies the RIN2-RIN2 syndrome relationship as Definitive (autosomal recessive).
  notes: >-
    Biallelic loss-of-function variants in RIN2 (Ras and Rab interactor 2) cause
    RIN2 syndrome; reported variants are frameshift/truncating and act through
    nonsense-mediated decay. RIN2 is a Rab5-interacting protein that regulates
    early endocytic membrane trafficking; it carries a VPS9 domain that confers
    Rab5 guanyl-nucleotide exchange factor activity, so it acts as both a Rab5
    GEF and effector. The cited abstracts describe the trafficking role ("interacts
    with Rab5"/"regulation of Rab5-mediated early endocytosis"); the GEF activity
    bound at the pathophysiology node is supported by the VPS9 domain rather than
    by those quoted sentences. ClinGen classifies the RIN2-RIN2 syndrome
    relationship as Definitive (autosomal recessive, Lysosomal Diseases GCEP).
  evidence:
  - reference: PMID:19631308
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frameshift mutation in RIN2 was found to segregate with the disease phenotype in a large consanguineous kindred"
    explanation: Establishes RIN2 as the causative gene, segregating with disease.
  - reference: PMID:20424861
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.1914_1915delGC mutation introduces a frameshift and creates a premature termination codon, leading to nonsense-mediated mRNA decay."
    explanation: Documents a truncating RIN2 variant acting through nonsense-mediated decay (loss of function).

pathophysiology:
- name: RIN2 Loss of Function
  description: >-
    Biallelic truncating RIN2 variants undergo nonsense-mediated decay, abolishing
    or markedly reducing RIN2, a ubiquitously expressed Rab5-interacting effector.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: RIN2
    term:
      id: hgnc:18750
      label: RIN2
  molecular_functions:
  - preferred_term: RIN2 Rab5 guanyl-nucleotide exchange factor activity
    modifier: DECREASED
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  downstream:
  - target: Dysregulated Rab5-Dependent Endosomal Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19631308
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation identified results in decreased expression of RIN2, a ubiquitously expressed protein that interacts with Rab5 and is involved in the regulation of endocytic trafficking."
      explanation: Links reduced RIN2 directly to impaired Rab5-dependent endocytic trafficking.
  evidence:
  - reference: PMID:30769224
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic mutations in this gene cause cell trafficking dysfunction"
    explanation: Attributes the disease to RIN2-dependent cell trafficking dysfunction.
- name: Dysregulated Rab5-Dependent Endosomal Trafficking
  description: >-
    RIN2 regulates Rab5-mediated early endocytosis; its loss dysregulates early
    endosomal membrane trafficking in fibroblasts.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endocytosis
    modifier: DECREASED
    term:
      id: GO:0006897
      label: endocytosis
  downstream:
  - target: Fibroblast Secretory Pathway Dysfunction
  - target: Fibulin-5 Deficiency and Dermal Microfibril Paucity
  evidence:
  - reference: PMID:20424861
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "RIN2 encodes the Ras and Rab interactor 2, involved in the regulation of Rab5-mediated early endocytosis."
    explanation: Identifies the Rab5-mediated early-endocytosis process RIN2 regulates.
- name: Fibroblast Secretory Pathway Dysfunction
  description: >-
    Patient dermal fibroblasts show a dilated endoplasmic reticulum and an
    abnormal Golgi apparatus, indicating disturbed biosynthetic/secretory
    trafficking of extracellular-matrix components.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Abnormal Dermal Connective Tissue Matrix
  evidence:
  - reference: PMID:20424861
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "fibroblasts exhibited a dilated endoplasmic reticulum and an abnormal Golgi apparatus with rarefied and dilated cisternae"
    explanation: Ultrastructural evidence of secretory-pathway disturbance in patient fibroblasts.
- name: Fibulin-5 Deficiency and Dermal Microfibril Paucity
  description: >-
    RIN2 deficiency is associated with paucity of dermal microfibrils and
    deficiency of fibulin-5, elastic-fiber assembly components, in patient skin.
  biological_scale: TISSUE
  downstream:
  - target: Abnormal Dermal Connective Tissue Matrix
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17035250
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "fibulin-5 is necessary for elastic fiber formation by facilitating the deposition of elastin onto a microfibrillar scaffold via direct molecular interactions"
      explanation: >-
        Establishes (in recessive cutis laxa caused by fibulin-5 mutation) that
        fibulin-5 is required for elastic-fiber assembly, from which the RIN2-driven
        fibulin-5/microfibril loss producing abnormal dermal matrix follows.
  evidence:
  - reference: PMID:19631308
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "RIN2 deficiency was found to be associated with paucity of dermal microfibrils and deficiency of fibulin-5, which may underlie the abnormal skin phenotype displayed by the patients."
    explanation: Ties RIN2 deficiency to the microfibril/fibulin-5 loss underlying the skin phenotype.
- name: Abnormal Dermal Connective Tissue Matrix
  description: >-
    Disordered trafficking and depletion of elastic-fiber components disrupt
    dermal extracellular-matrix organization, with abnormal collagen fibril
    morphology, producing the soft, redundant, hyperextensible skin.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Cutis laxa
  - target: Hyperextensible skin
  evidence:
  - reference: PMID:20424861
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural studies of the skin revealed important abnormalities in the collagen fibril morphology"
    explanation: Documents the abnormal dermal matrix ultrastructure behind the skin findings.


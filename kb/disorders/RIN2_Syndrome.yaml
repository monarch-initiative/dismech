name: RIN2 Syndrome
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
synonyms:
- MACS syndrome
- macrocephaly, alopecia, cutis laxa, and scoliosis syndrome
- RIN2 deficiency
notes: >-
  Ultra-rare autosomal recessive connective-tissue disorder caused by biallelic
  loss-of-function variants in RIN2. First described as MACS syndrome
  (macrocephaly, alopecia, cutis laxa, and scoliosis) by Basel-Vanagaite et al.
  (2009); as additional families were reported the phenotype broadened beyond the
  original acronym and the condition was renamed RIN2 syndrome. No GeneReviews
  chapter exists for the disease or for the RIN2 gene as of the committed
  Bookshelf index (checked with just check-genereviews --online). The course is
  chronic and progressive (facial coarsening and scoliosis worsen with age) but
  non-lethal, with survival into adulthood and generally preserved cognition; no
  disease-modifying therapy exists and management is supportive and
  multidisciplinary. Fewer than ~15 patients from a handful of consanguineous
  families have been reported.

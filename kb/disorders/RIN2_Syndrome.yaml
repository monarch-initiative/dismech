genetic:
- name: RIN2
  gene_term:
    preferred_term: RIN2
    term:
      id: hgnc:18750
      label: RIN2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_7427a25e-68a1-4e1b-b951-f1a1d7b1e52b-2023-12-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_7427a25e-68a1-4e1b-b951-f1a1d7b1e52b-2023-12-04T170000.000Z
      reference_title: RIN2 / RIN2 syndrome (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RIN2 | HGNC:18750 | RIN2 syndrome | MONDO:0013115 | AR | Definitive | SOP9 | Lysosomal Diseases Gene Curation Expert Panel"
      explanation: ClinGen classifies the RIN2-RIN2 syndrome relationship as Definitive (autosomal recessive).
  notes: >-
    Biallelic loss-of-function variants in RIN2 (Ras and Rab interactor 2) cause
    RIN2 syndrome; reported variants are frameshift/truncating and act through
    nonsense-mediated decay. RIN2 is a Rab5-interacting protein that regulates
    early endocytic membrane trafficking; it carries a VPS9 domain that confers
    Rab5 guanyl-nucleotide exchange factor activity, so it acts as both a Rab5
    GEF and effector. The cited abstracts describe the trafficking role ("interacts
    with Rab5"/"regulation of Rab5-mediated early endocytosis"); the GEF activity
    bound at the pathophysiology node is supported by the VPS9 domain rather than
    by those quoted sentences. ClinGen classifies the RIN2-RIN2 syndrome
    relationship as Definitive (autosomal recessive, Lysosomal Diseases GCEP).
  evidence:
  - reference: PMID:19631308
    reference_title: "RIN2 deficiency results in macrocephaly, alopecia, cutis laxa, and scoliosis: MACS syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frameshift mutation in RIN2 was found to segregate with the disease phenotype in a large consanguineous kindred"
    explanation: Establishes RIN2 as the causative gene, segregating with disease.
  - reference: PMID:20424861
    reference_title: "The RIN2 syndrome: a new autosomal recessive connective tissue disorder caused by deficiency of Ras and Rab interactor 2 (RIN2)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.1914_1915delGC mutation introduces a frameshift and creates a premature termination codon, leading to nonsense-mediated mRNA decay."
    explanation: Documents a truncating RIN2 variant acting through nonsense-mediated decay (loss of function).


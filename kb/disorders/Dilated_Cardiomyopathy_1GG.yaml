diagnosis:
- name: Molecular genetic testing of SDHA
  description: >-
    Sequencing SDHA is the definitive test and, in a family from the founder population
    with a neonatal dilated cardiomyopathy, targeted testing for the c.1664G>A allele is
    the direct route. Because the same genotype occurs in patients with Leigh syndrome,
    a positive result establishes biallelic SDHA deficiency but does not by itself
    assign the patient to this disease rather than to mitochondrial complex II
    deficiency, nuclear type 1; that assignment rests on the clinical distribution.
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present the association of a mutation in the SDHA gene with recessive neonatal isolated DCM in 15 patients of two large consanguineous Bedouin families."
    explanation: Establishes SDHA genotyping as the test that identifies affected individuals.
- name: Respiratory-chain enzymology on cardiac tissue
  description: >-
    Measuring succinate dehydrogenase activity establishes the biochemical diagnosis,
    but the tissue chosen determines whether the defect is seen. Cardiac muscle shows the
    severe deficit; skeletal muscle and lymphoblastoid cells retain substantial activity,
    so a near-normal result in those tissues does not exclude the disorder.
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cardiomyopathy is presumably caused by the significant tissue-specific reduction in SDH enzymatic activity in the heart muscle, whereas substantial activity is retained in the skeletal muscle and lymphoblastoid cells."
    explanation: >-
      The basis for the tissue-choice caveat that makes this a diagnostic pitfall.
      Graded IN_VITRO as an enzyme assay on tissue samples.

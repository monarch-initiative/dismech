    explanation: The patient count and the founder-population context behind this record.
pathophysiology:
- name: SDHA p.Gly555Glu Homozygosity
  description: >-
    Homozygosity for SDHA c.1664G>A, which substitutes a small uncharged glycine at
    position 555 of the flavoprotein subunit with glutamic acid. The residue lies in the
    region through which the flavoprotein contacts the iron-sulfur subunit, and the
    substitution introduces a charged side chain into that interface. This is a
    missense, interface-destabilising allele rather than a null: residual enzyme activity
    is measurable in every tissue examined, which is why the functional impact is
    recorded as partial rather than complete loss of function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12794685
    reference_title: "Homozygous Gly555Glu mutation in the nuclear-encoded 70 kDa flavoprotein gene causes instability of the respiratory chain complex II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c1664G-->A transition detected, predicted the substitution of the small uncharged glycine at position 555 by glutamic acid."
    explanation: Defines the allele at nucleotide and protein level, which is what this node is.
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present the association of a mutation in the SDHA gene with recessive neonatal isolated DCM in 15 patients of two large consanguineous Bedouin families."
    explanation: Establishes that this allele, in the homozygous state, is the cause of the cardiac phenotype curated here.
- name: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
  description: >-
    The molecular consequence of the substitution, and the step at which the published
    biochemistry is most direct. In the proband studied by immunochemistry, the amount
    of flavoprotein and of the iron-containing subunit were both reduced, and the
    assembled 130 kDa holoenzyme was reduced further still. A loss of assembled complex
    that exceeds the loss of its individual subunits is the signature of an interaction
    that has become labile rather than of a subunit that is absent, which is the basis
    for placing residue 555 in the interacting domain.

    An independent human cell system reaches the same conclusion by a different route.
    A clonal SDHA-knockout line into which SDHA missense variants are reintroduced
    singly, and in which succinate dehydrogenase activity is then measured directly,
    includes p.Gly555Glu in its panel; the variant scores at the low end of enzymatic
    activity and the authors attribute its effect to disruption of SDHA-SDHB binding.
    That per-variant result is a full-text derivation and is recorded as such in this
    entry's notes, not as a verified quotation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex II assembly
    modifier: DECREASED
    term:
      id: GO:0034553
      label: mitochondrial respiratory chain complex II assembly
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12794685
    reference_title: "Homozygous Gly555Glu mutation in the nuclear-encoded 70 kDa flavoprotein gene causes instability of the respiratory chain complex II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this proband, CRM for flavoprotein as well as iron-containing protein (Ip) was decreased, CRM for the entire complex II (130 kDa) being reduced even more."
    explanation: >-
      The measurement this node rests on - assembled holoenzyme lost disproportionately
      relative to its subunits. Graded IN_VITRO because it is an immunochemical
      quantification performed on patient material outside the organism, not a clinical
      observation.
  - reference: PMID:12794685
    reference_title: "Homozygous Gly555Glu mutation in the nuclear-encoded 70 kDa flavoprotein gene causes instability of the respiratory chain complex II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This observation prompts speculation of a labile interaction between Ip and Fp polypeptides and of a key role of the amino acid at position 555 in the interacting domain."
    explanation: >-
      The authors' interpretation of that measurement, which is the mechanism this node
      asserts. Note the hedging in the source: it is offered as speculation prompted by
      the immunochemistry, and this entry does not state it more strongly than the source
      does.
  - reference: PMID:7550341
    reference_title: "Mutation of a nuclear succinate dehydrogenase gene results in mitochondrial respiratory chain deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were homozygous for an Arg554Trp substitution in the Fp subunit."
    explanation: >-
      Independent evidence that the immediately adjacent residue is also disease-relevant
      when substituted, supporting the claim that this part of the flavoprotein is a
      functionally critical domain. Cited for the domain only - these patients had Leigh
      syndrome, not this disorder.
  - reference: PMID:33162331
    reference_title: "The genetic basis of isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the missense variants that do occur tend to induce substitutions at highly conserved residues in regions of the proteins that are critical for binding to other subunits or substrates"
    explanation: >-
      Places this allele in the general pattern the compendium reports for complex II
      missense variants, which is exactly the interface-disruption mechanism this node
      describes. Graded OTHER because it is a literature compendium rather than primary
      data.
- name: Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
  description: >-
    The node that distinguishes this disease from every other SDHA phenotype, and the
    one nothing published explains. The same homozygous allele, present in every cell,
    produces a severe deficit of succinate dehydrogenase activity in cardiac muscle
    while substantial activity persists in skeletal muscle and in lymphoblastoid cells.
    The measured residual activities - roughly 15-21% of control in heart against
    50-56% in skeletal muscle and 60-63% in lymphoblastoid cells - are a full-text
    derivation recorded in this entry's notes; the cached abstract states the pattern
    qualitatively.

    Every explanation available for tissue-restricted respiratory-chain disease
    elsewhere is unavailable here. There is no heteroplasmy to invoke, because all four
    complex II subunits and both relevant assembly factors are nuclear-encoded and
    therefore present at the same dose in every tissue. The reporting authors sequenced
    SDHB, SDHD and SDHAF1 and found no modifier allele. What remains is a
    tissue-dependent difference in how much residual complex II a cell can tolerate, or
    in how efficiently the destabilised interface is assembled or degraded in cardiac
    mitochondria, and neither has been tested.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: succinate dehydrogenase activity
    modifier: DECREASED
    term:
      id: GO:0000104
      label: succinate dehydrogenase activity
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  downstream:
  - target: Cardiomyocyte Bioenergetic Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cardiomyopathy is presumably caused by the significant tissue-specific reduction in SDH enzymatic activity in the heart muscle, whereas substantial activity is retained in the skeletal muscle and lymphoblastoid cells."
    explanation: >-
      The tissue-restriction claim this node makes, in the source's own words, including
      its own hedge ("presumably"). Graded IN_VITRO because the statement reports enzyme
      activities assayed in tissue and cell samples, which is what the sentence is about,
      even though the paper as a whole is a clinical genetics report.
- name: Cardiomyocyte Bioenergetic Failure
  description: >-
    Loss of complex II activity in the cardiomyocyte interrupts two coupled pathways at
    once, which is the specific consequence of the lesion sitting in this enzyme rather
    than in any other respiratory-chain complex. Succinate is no longer efficiently
    oxidised to fumarate, so tricarboxylic acid cycle flux is impaired; and the electrons
    that oxidation would have delivered no longer reach ubiquinone, so that entry point
    into the electron transport chain is lost. The result is a chronic shortfall in
    oxidative ATP supply in a tissue with continuous, non-negotiable contractile demand
    and little capacity to reduce it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    modifier: DECREASED
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
  - preferred_term: "mitochondrial electron transport, succinate to ubiquinone"
    modifier: DECREASED
    term:
      id: GO:0006121
      label: "mitochondrial electron transport, succinate to ubiquinone"
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Left Ventricular Dilatation and Systolic Dysfunction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33162331
    reference_title: "The genetic basis of isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it oxidises succinate to fumarate in the tricarboxylic acid cycle and the electrons are used to reduce FAD to FADH2, ultimately reducing ubiquinone to ubiquinol in the respiratory chain"
    explanation: >-
      Establishes the dual pathway membership that makes a single complex II lesion block
      both the TCA cycle and electron transport, which is the claim this node makes.
      Graded OTHER because it is a review statement of established biochemistry.
  - reference: PMID:11692162
    reference_title: "Phenotypic dichotomy in mitochondrial complex II genetic disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Complex II oxidizes succinate to fumarate in the Krebs cycle and is involved in the mitochondrial electron transport chain."
    explanation: >-
      Independent statement of the same coupling from a second review. Graded OTHER for
      the same reason.
- name: Left Ventricular Dilatation and Systolic Dysfunction
  description: >-
    The structural and functional cardiac phenotype: chamber dilatation with impaired
    contraction, the defining morphology of dilated cardiomyopathy, arising here from a
    metabolic rather than a sarcomeric insult. In this cohort it is present from the
    neonatal period or the first months of life, and in one patient it was detected
    before birth.
  biological_scale: TISSUE
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Congestive Heart Failure and Death in Infancy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most frequent form is dilated cardiomyopathy (DCM), which is characterized by dilatation of the left or both ventricles and impaired systolic function"
    explanation: >-
      Defines the structural phenotype this node asserts. The sentence is the paper's
      general definition of DCM rather than a measurement in this cohort, and is used
      only for the definition.
- name: Congestive Heart Failure and Death in Infancy
  description: >-
    The clinical endpoint. Presentation is with heart failure or cardiogenic shock in
    the neonatal period or the first months of life, and the majority of the reported
    cohort died of cardiac causes in infancy. Survivors reported exercise intolerance
    but had normal neuromuscular function and psychomotor development, which is the
    observation that makes this an isolated cardiomyopathy rather than a mitochondrial
    syndrome with a cardiac component.
  biological_scale: ORGANISM
  downstream: []
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition, unfortunately, is marked by high mortality, with two-thirds succumbing to cardiac failure."
    explanation: >-
      The cohort's own mortality and its mode, which is what this node asserts. Replaces
      an earlier revision's use of the paper's general framing sentence about DCM.

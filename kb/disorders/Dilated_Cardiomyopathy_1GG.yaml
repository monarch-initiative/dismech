notes: >-
  Entity resolution. `MONDO:0013339` is bound here with the label "dilated
  cardiomyopathy 1GG" as recorded in `cache/mondo/terms.csv`. Its single MONDO parent
  is MONDO:0700335 (familial isolated dilated cardiomyopathy) and it carries
  `RO:0004003 hgnc:10680 ! SDHA`; both were verified with OAK on 2026-08-01 during
  curation of `kb/disorders/SDHA-Related_Neurodegeneration_With_Ataxia_And_Optic_Atrophy.yaml`
  and are recorded in that entry's notes. That same OAK query
  (`runoak relationships --direction down -p RO:0004003 HGNC:10680`) returned exactly
  four SDHA disease terms and no others: MONDO:0013339 this entry (OMIM:613642),
  MONDO:0013602 pheochromocytoma/paraganglioma syndrome 5 (OMIM:614165), MONDO:0031006
  neurodegeneration with ataxia and late-onset optic atrophy (OMIM:619259) and
  MONDO:0100294 mitochondrial complex II deficiency nuclear type 1 (OMIM:252011). The
  other three are curated below as differentials, mirroring the reciprocal differential
  that the NDAXOA entry already carries for this term. Those results are reused rather
  than re-derived.

  Named Entity Confusion preflight. The named risk for SDHA is not a different gene but
  a different SDHA disease, and it applies here more sharply than anywhere else in the
  gene's phenotype set, because the allele this entry is built on is shared with the
  disease next door. Every clinical source used here was checked for which phenotype its
  patients had, not merely for which gene was named. PMID:20551992 is the only source
  cited for the cardiac phenotype of this entity. PMID:12794685 and PMID:16798039 are
  cited only for what they establish about the p.Gly555Glu allele - its molecular
  consequence and its phenotypic range - and never as evidence for a DCM1GG phenotype;
  both of their probands had non-cardiac disease and belong to MONDO:0100294.
  PMID:37064335 is used only for the treatment landscape of complex II deficiency as a
  whole; its two probands carry different SDHA genotypes and one has Leigh syndrome, so
  it contributes nothing to this entity's phenotype. PMID:7550341 is cited for the
  conserved Fp domain and for the first demonstration that a nuclear gene defect causes
  respiratory-chain disease; its patients had Leigh syndrome and a different substitution
  (Arg554Trp). Specifically excluded as off-entity: PMID:42325549 (SDHA downregulation as
  a candidate target in acquired ischemic heart disease) and PMID:41647802 (an SDHA
  variant of uncertain significance reported incidentally in MYBPC3-related hypertrophic
  cardiomyopathy) are not this disorder and are not cited anywhere in this entry.

  Provenance limits on statements not taken from a cached abstract. Three facts used in
  the prose of this entry are full-text derivations and are not snippet-verified.
  (i) No longer applies. `references_cache/PMID_20551992.md` was initially cached
  abstract-only, and an earlier revision of this entry scoped every snippet from it to the
  abstract's qualitative statements. Re-fetching it with `just fetch-reference` on
  2026-08-31 returned `content_type: full_text_html`, so the residual activity figures,
  the LVNC count, the normal neurological findings and the unaffected homozygous father
  are all quoted directly from the cache and verified. The one figure not carried over is
  the lymphoblastoid residual activity range, which is in the paper's tables rather than
  its running text; the entry quotes the cardiac and skeletal-muscle figures the text
  states (15-18% and 50-60%) and does not assert the third. Per-patient tabulated details
  that appear only in Table 1 - the individual counts for respiratory distress, mitral
  valve insufficiency and exercise intolerance - remain outside the cached text and are
  deliberately not curated as phenotypes.
  (ii) That the 2020 compendium tabulates seventeen homozygous p.(Gly555Glu) cases, of
  which fifteen are the Bedouin families, and that it describes the Leigh-SDHA
  association as blurred by cardiomyopathy reports, were read from the full text of
  PMC7758838 on 2026-08-31; `references_cache/PMID_33162331.md` is abstract-only and
  reports only the whole-complex-II totals (61 patients, 32 variants across four genes).
  (iii) That the HAP1 SDHA-knockout variant panel includes p.Gly555Glu, with a low
  measured activity score and an authors' interpretation that the substitution disrupts
  SDHA-SDHB binding, was read from the full text of PMC11611653 on 2026-08-31;
  `references_cache/PMID_39321216.md` is abstract-only and names no individual variant,
  so snippets from it are scoped to its aggregate design and results, exactly as the
  NDAXOA entry scopes the same reference.

  GeneReviews. No GeneReviews chapter exists for this entity or for SDHA. Searched
  2026-08-31: PubMed `SDHA[Book] OR SDHA[Title] AND GeneReviews[Book]` and
  `complex II deficiency GeneReviews[Book]` both returned zero records, while the same
  `[Book]` field returned PMID:20301715 (Hereditary Paraganglioma-Pheochromocytoma
  Syndromes) on an adjacent query, which confirms the field was resolving rather than
  silently failing. The generic `Dilated Cardiomyopathy Overview` chapter
  (PMID:20301486), cited by fourteen sibling DCM entries, was read and not used: its
  cached content is a purpose statement with no finding attributable to this entity, and
  quoting it would produce a title-like snippet rather than evidence.

  Coverage overlap that this entry does not resolve.
  `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml` already cites
  PMID:20551992 under a `Cardiomyopathy` phenotype node, so the fifteen Bedouin patients
  are currently claimed by MONDO:0100294 as well as by the MONDO:0013339 term OMIM
  assigns them. That file was read and deliberately not modified: deciding whether the
  cardiac cohort should be withdrawn from the complex II deficiency entry is a change to
  a curated entry that belongs in its own pull request, not a side effect of adding this
  one. The overlap is real and is recorded here rather than papered over.

  Ontology and module decisions taken deliberately. No `conforms_to` declaration is
  made on any pathophysiology node. Conformance to
  `cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling` was considered and
  declined because that module node expects cardiac fibroblast activation, extracellular
  matrix deposition and cardiomyocyte apoptosis, none of which has been reported in
  patients with this disorder - the fibrotic remodelling seen in the Sdhaf4 mouse curated
  below is a mouse of a different gene and is recorded as a limitation there; conformance to
  `cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult` was declined
  because that node expects abnormal sarcomere organization, which is likewise not
  reported here. Declaring conformance without the expected content would assert
  mechanism this entry cannot support. An earlier revision of this note said that left
  ventricular noncompaction, listed among the clinical features of this concept in MedGen,
  was not stated in the founding report. That was wrong: eight of the fifteen patients were
  diagnosed with LVNC, and it is now curated as a FREQUENT phenotype bound to HP:0030682.
  (HP:0031689 is not a member of the PhenotypeTerm enum cache and is not used.) A ClinGen gene-disease validity row would be a
  strong nosology citation here, but `just clingen-refresh` currently fails with a
  sha256 mismatch against the snapshot pinned in `data/clingen/MANIFEST.yaml`
  (2026-08-13), so no `CGGV:` reference could be generated for this entry without
  bumping that pin and rebuilding unrelated cache files.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygosity for a single SDHA missense allele, in two consanguineous kindreds from
    the same founder population. Heterozygous parents are unaffected, but so was one
    homozygote: the father of one patient carried two copies of the allele with a normal
    cardiac assessment, so inheritance is autosomal recessive with incomplete penetrance
    rather than fully penetrant recessive. The detail is curated on the genetic record.
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present the association of a mutation in the SDHA gene with recessive neonatal isolated DCM in 15 patients of two large consanguineous Bedouin families."
    explanation: States the recessive inheritance and the consanguineous pedigree structure that establishes it.

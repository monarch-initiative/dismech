experimental_models:
- name: HAP1 SDHA-knockout cell line with single-variant reintroduction
  experimental_model_type: CELL_LINE
  description: >-
    A clonal human SDHA-knockout line into which individual SDHA missense variants are
    reintroduced by site-specific recombination, after which succinate dehydrogenase
    activity and SDHA protein abundance are measured for each variant. It is the only
    published system in which this disorder's allele has been assayed in isolation in a
    human genetic background. The panel includes p.Gly555Glu, which scores at the low end
    of enzymatic activity, and the authors attribute its effect to disruption of
    SDHA-SDHB binding - a full-text derivation recorded in this entry's notes rather than
    a verified quotation, because the cached reference is abstract-only and names no
    individual variant.
  publication: PMID:39321216
  modeled_mechanisms:
  - target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The system measures the enzymatic consequence of the single allele on a null
      background, isolating the variant's effect from genetic modifiers and from the
      patient's tissue context. It agrees with the independent immunochemical evidence
      from patient material that the lesion is at the SDHA-SDHB interface.
    limitations: >-
      The study was designed to classify cancer-associated variants, not to model a
      cardiomyopathy, and HAP1 is a near-haploid chronic myelogenous leukaemia derivative
      rather than a cardiomyocyte - so it cannot address the tissue restriction that
      defines this disease, which is its central mechanistic question. The assay measures
      variant function on a knockout background at non-native expression, not the
      biology of a homozygous germline allele in myocardium. The authors themselves note
      that activity-score similarity between p.Gly555Glu and an unrelated cancer variant
      may reflect artefacts of this model system.
    evidence:
    - reference: PMID:39321216
      reference_title: "A Novel Human SDHA-Knockout Cell Line Model for the Functional Analysis of Clinically Relevant SDHA Variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SDHA variants were introduced into a clonal SDHA-knockout cell line via Bxb1-mediated recombination. SDH activity and SDHA abundance were determined for each variant"
      explanation: >-
        Describes the system and the measurement, which is what makes it informative for
        the interface node. Scoped to the abstract's account of the assay design; the
        inclusion of p.Gly555Glu in the panel is a full-text derivation and is not
        claimed by this snippet.
    - reference: PMID:39321216
      reference_title: "A Novel Human SDHA-Knockout Cell Line Model for the Functional Analysis of Clinically Relevant SDHA Variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In total, we characterized 72 variants, developed criteria for obtaining functional evidence, and demonstrated the potential of this evidence for clinical variant interpretation."
      explanation: >-
        The scale of the panel, which is the aggregate statement that can be quoted from
        the cached abstract in support of this variant having been assayed among them.
animal_models:
- name: Sdhaf4 conditional-null mouse
  species: Mouse
  genotype: Sdhaf4 fl/fl; Ckmm-Cre (muscle-directed) and Sdhaf4 fl/fl; Mer-CreMer (tamoxifen-inducible, cardiomyocyte-specific)
  background: Conditional knockout of the complex II assembly factor Sdhaf4
  category: GENETIC
  description: >-
    The closest published in vivo model of the process this disease destroys, though not
    of its gene. Conditional deletion of Sdhaf4, the assembly factor that brings SDHA
    together with SDHB, suppresses complex II assembly in the heart and produces
    progressive dilated cardiomyopathy and lethal heart failure, with no mutant surviving
    beyond twelve weeks. Two independent Cre drivers give the same result, one
    muscle-directed and one tamoxifen-inducible and cardiomyocyte-specific, which
    establishes the phenotype as cardiomyocyte-autonomous rather than an artefact of one
    deletion strategy.

    Its relevance to this entry is specific and mechanistic rather than generic: loss of
    Sdhaf4 attenuates the SDHA-SDHB interaction and leads to subunit degradation, which is
    the same interface failure that the p.Gly555Glu substitution produces by a different
    route. The authors make the connection themselves, citing the human G555E
    cardiomyopathy report as the reason to expect complex II assembly to matter for
    cardiac homeostasis.
  publication: PMID:35803927
  genes:
  - preferred_term: SDHAF4
    term:
      id: hgnc:20957
      label: SDHAF4
  notes: >-
    `genes:` records SDHAF4, the gene this model actually deletes, not SDHA, the gene of
    the disease it informs. That follows the convention in the rest of the KB - the
    ADGRG1 polymicrogyria entry carries a Col3a1-null mouse under `genes: Col3a1`, and
    Adams-Oliver Syndrome carries a conditional Rac1 deletion under `genes: RAC1` - and
    it keeps the field consistent with the `limitations` on the links below, which say
    the lesion is in a different gene. The connection to SDHA is the mechanism links
    themselves, not the gene binding.
  modeled_mechanisms:
  - target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the molecular lesion at the level of the SDHA-SDHB interaction
      and its consequence, subunit degradation and loss of assembled complex II, which is
      what the human immunochemistry shows. It reaches that state by removing the
      assembly factor rather than by destabilising the interface from within the
      flavoprotein.
    limitations: >-
      The lesion is in a different gene. Sdhaf4 is an assembly factor, not a structural
      subunit, and the model is a conditional null rather than a hypomorphic missense
      allele, so residual complex II is likely lower and the failure mode is absence of
      assembly rather than instability of an assembled interface. Nothing in the model
      speaks to whether a p.Gly555Glu holoenzyme behaves the same way once assembled.
    readouts:
    - name: Coimmunoprecipitation of SDHB with SDHA from cardiac left ventricle
      target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
      direction: DECREASED
      interpretation: >-
        Reduced recovery of SDHB with SDHA indicates that the interaction between the
        flavoprotein and the iron-sulfur subunit is weakened, which is the molecular event
        this node asserts.
      evidence:
      - reference: PMID:35803927
        reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Immunoprecipitation assays using cardiac muscle tissues showed that abrogation of Sdhaf4 attenuated the interaction between SDHA and SDHB"
        explanation: Reports the coimmunoprecipitation measurement behind this readout.
    evidence:
    - reference: PMID:35803927
      reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiac loss of Sdhaf4 suppresses complex II assembly and results in subunit degradation and complex II deficiency in fetal mice."
      explanation: >-
        Establishes that the model produces the assembly failure and subunit loss that
        make it informative for this node.
    - reference: PMID:35803927
      reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A G555E mutation in the SDHA gene has been reported to cause DCM10, thereby indicating that the normal function of complex II is required to maintain cardiac homeostasis."
      explanation: >-
        The model's authors cite this entity's own allele as the human precedent for their
        premise, which is the explicit link between the model and this disease. The
        trailing digits are a superscript reference marker in the source text and are
        quoted as they appear.
  - target: Left Ventricular Dilatation and Systolic Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cardiac complex II assembly failure produces the same structural and functional
      cardiac endpoint as the human disease: ventricular chamber dilation with reduced
      fractional shortening and impaired contraction, progressing to lethal heart failure.
    limitations: >-
      The timing and the tissue distribution are both engineered rather than emergent. The
      human disease presents in the neonatal period and its cardiac restriction is
      unexplained, whereas in the mouse the restriction is imposed by the Cre driver, so
      the model cannot address the tissue-selectivity question that defines this disorder.
      Mouse disease also develops over weeks in the postnatal animal rather than in
      utero or in the first months, and the mutant hearts show hypertrophic and fibrotic
      remodelling with collagen deposition that has not been reported in patients with
      this disorder.
    readouts:
    - name: Left ventricular fractional shortening by echocardiography
      target: Left Ventricular Dilatation and Systolic Dysfunction
      direction: DECREASED
      interpretation: >-
        Reduced fractional shortening is the functional correlate of the systolic
        dysfunction this node asserts.
      evidence:
      - reference: PMID:35803927
        reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a significant decrease in left ventricular fractional shortening (FS%) and deregulated cardiac contraction were detected in the mutants, indicating that the loss of Sdhaf4 impairs heart function"
        explanation: Reports the echocardiographic measurement behind this readout.
    - name: Ventricular chamber dilation on gross morphology and histology
      target: Left Ventricular Dilatation and Systolic Dysfunction
      direction: INCREASED
      interpretation: >-
        Progressive chamber dilation is the structural correlate of the dilated phenotype
        this node asserts.
      evidence:
      - reference: PMID:35803927
        reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dilation of the ventricular chambers was observed at later stages, suggesting that the loss of Sdhaf4 in muscle results in progressive cardiac remodeling and DCM"
        explanation: Reports the morphological observation behind this readout.
    evidence:
    - reference: PMID:35803927
      reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "thereby causing progressive dilated cardiomyopathy and lethal heart failure in animals"
      explanation: >-
        States the cardiac endpoint that makes this model informative for the human
        structural phenotype.
  - target: Cardiomyocyte Bioenergetic Failure
    relationship: RESCUES
    fidelity: LOW
    description: >-
      The model's rescue arms are the only in vivo evidence that the cardiac phenotype of
      complex II assembly failure is metabolically tractable: replacing the missing
      downstream metabolite with fumarate, or blocking the mitochondrial fission that the
      energetic deficit provokes, partially restores cardiac function and prolongs
      survival. This is recorded because it is the closest thing to a therapeutic lead
      this disease has, not because it has been tried in patients.
    limitations: >-
      Fidelity is recorded as LOW because the rescue was performed in an assembly-factor
      knockout, not in an SDHA missense model, and never in a patient. Whether fumarate
      supplementation would benefit a p.Gly555Glu heart is untested, and the rescue is
      explicitly partial in the mouse. No treatment is curated in this entry on the
      strength of it.
    readouts:
    - name: Cardiac function and lifespan after fumarate supplementation or fission inhibition
      target: Cardiomyocyte Bioenergetic Failure
      direction: RESTORED
      interpretation: >-
        Partial functional recovery on metabolite replacement indicates that the
        bioenergetic deficit is a driver of the cardiac phenotype rather than a bystander.
      evidence:
      - reference: PMID:35803927
        reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Targeting mitochondria via supplementation with fumarate or inhibiting mitochondrial fission improves mitochondrial dynamics, partially restores cardiac function and prolongs the lifespan of mutant mice."
        explanation: Reports the rescue result behind this readout, including its own "partially" qualifier.
    evidence:
    - reference: PMID:35803927
      reference_title: "Cardiac disruption of SDHAF4-mediated mitochondrial complex II assembly promotes dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings reveal a vital role for complex II assembly in the development of dilated cardiomyopathy and provide additional insights into therapeutic interventions for heart diseases."
      explanation: >-
        The authors' own summary of why the rescue matters for complex II-driven dilated
        cardiomyopathy.
differential_diagnoses:
- name: Mitochondrial complex II deficiency, nuclear type 1
  disease_term:
    preferred_term: mitochondrial complex II deficiency, nuclear type 1
    term:
      id: MONDO:0100294
      label: mitochondrial complex II deficiency, nuclear type 1
  description: >-
    The primary differential and the genuinely hard one, curated separately in
    `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`. It is not a
    mimicking disease but the other phenotypic outcome of the same lesion, and unlike the
    boundary with NDAXOA it cannot be drawn by zygosity: both are biallelic, and the
    p.Gly555Glu allele this entry is built on has itself been reported homozygous in a
    lethal infantile presentation and in Leigh syndrome. The discriminator is which organ
    failed, and nothing published explains why it differs.
  distinguishing_features:
  - Neurological involvement is the discriminator. MC2DN1 presents with Leigh syndrome, leukodystrophy, developmental regression or seizures; the DCM1GG cohort had psychomotor development appropriate for age and no seizures.
  - Zygosity does not separate them. Both are recessive and biallelic, and the same homozygous p.Gly555Glu genotype has been published in both phenotypes.
  - Where cardiomyopathy occurs in MC2DN1 it is accompanied by other organ involvement, such as the reported patient with cardiomyopathy and leukodystrophy; in DCM1GG the cardiac disease is isolated.
  - "The tissue distribution of the enzyme deficit differs in kind: in DCM1GG the deficiency is severe in myocardium and partial elsewhere, whereas isolated complex II deficiency in MC2DN1 is characteristically demonstrable in skeletal muscle or fibroblasts."
  notes: >-
    This differential is also a coverage overlap rather than only a clinical contrast.
    The MC2DN1 entry already cites PMID:20551992, the founding report of this entity,
    under a `Cardiomyopathy` phenotype node. That file was read and deliberately not
    modified here; the overlap is recorded in this entry's top-level notes.
  evidence:
  - reference: PMID:22972948
    reference_title: "Recessive germline SDHA and SDHB mutations causing leukodystrophy and isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the first patient presented with cardiomyopathy and leukodystrophy due to compound heterozygous p.Thr508Ile and p.Ser509Leu SDHA mutations"
    explanation: >-
      Documents the combination that marks the other side of this boundary - cardiac
      disease accompanied by white-matter disease, in a patient with different SDHA
      alleles - against which this entry's isolated cardiac phenotype is defined.
  - reference: PMID:16798039
    reference_title: "Phenotypic variability of mitochondrial disease caused by a nuclear mutation in complex II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation has previously been reported in a lethal-infantile presentation of complex II deficiency."
    explanation: >-
      Establishes that the allele underlying this entry has also produced non-cardiac
      disease, which is why the genotype cannot serve as the discriminator between these
      two entities.
- name: SDHA-related neurodegeneration with ataxia and late-onset optic atrophy
  disease_term:
    preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
    term:
      id: MONDO:0031006
      label: neurodegeneration with ataxia and late-onset optic atrophy
  description: >-
    The dominant SDHA phenotype, curated in
    `kb/disorders/SDHA-Related_Neurodegeneration_With_Ataxia_And_Optic_Atrophy.yaml`,
    which already carries this disorder as a reciprocal differential. It is a relevant
    differential in exactly one situation: an infant with cardiomyopathy and an SDHA
    variant, because cardiomyopathy was the presenting and lethal feature in the
    paediatric carriers of one NDAXOA pedigree. The statements below are written to agree
    with that entry's.
  distinguishing_features:
  - Zygosity separates these two. DCM1GG is recessive and homozygous; NDAXOA arises from a single heterozygous missense allele, so a parent is either affected or the variant is de novo.
  - DCM1GG is cardiac-predominant without the optic atrophy that defines NDAXOA, so a family history of visual loss argues for NDAXOA.
  - The NDAXOA pedigree with childhood cardiomyopathy also contained an adult with optic atrophy carrying the same allele; DCM1GG families have reported no ophthalmological or neurological disease.
  - MONDO keeps the two as separate terms with separate OMIM anchors, MONDO:0013339/OMIM:613642 and MONDO:0031006/OMIM:619259, both mapped to SDHA.
  notes: >-
    These distinguishing features are the reciprocal of those recorded in the NDAXOA
    entry's differential for MONDO:0013339 and are deliberately consistent with them
    rather than independently derived. That entry states that the distinction rests on
    zygosity and on whether neurological or ophthalmological features later appear in the
    family, which the founding report of this entity supports: its patients are
    homozygous, and their neuromuscular function and psychomotor development were normal.
- name: Pheochromocytoma/paraganglioma syndrome 5
  disease_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 5
    term:
      id: MONDO:0013602
      label: pheochromocytoma/paraganglioma syndrome 5
  description: >-
    The fourth SDHA disease term, and the one that dominates an SDHA literature search
    while having no clinical overlap with this entity. It is included because the shared
    gene means a DCM1GG genotype result will be read by clinicians against a tumour
    surveillance background, not because the two present alike.
  distinguishing_features:
  - PGL5 arises from single heterozygous germline alleles acting as tumour-suppressor first hits and requires a somatic second hit in the tumour; DCM1GG is a constitutive biallelic enzymatic deficit with no second hit.
  - "The mechanisms diverge at succinate: in PGL5 its accumulation acts as an oncometabolite driving pseudohypoxia and epigenetic remodelling, whereas the pathogenic consequence curated here is bioenergetic failure in myocardium."
  - No tumour has been reported in the DCM1GG kindreds and no paraganglioma family has reported neonatal dilated cardiomyopathy.
  evidence:
  - reference: PMID:11692162
    reference_title: "Phenotypic dichotomy in mitochondrial complex II genetic disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While mutations in SDHA display a phenotype resembling other mitochondrial and Krebs cycle gene defects, those in SDHB, SDHC and SDHD cause hereditary paraganglioma."
    explanation: >-
      States the dichotomy this differential rests on, and specifically places SDHA on
      the mitochondrial-disease side of it. Graded OTHER because it is a review.
  - reference: PMID:33162331
    reference_title: "The genetic basis of isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "either susceptibility to cancer in the case of single, heterozygous germline variants, or a mitochondrial disease presentation, almost exclusively due to bi-allelic recessive variants"
    explanation: >-
      Ties the two clinical outcomes of complex II defects to zygosity, which is the
      feature that separates this entity from the tumour syndrome.
discussions:
- discussion_id: dcm1gg_cardiac_tissue_restriction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the succinate dehydrogenase deficit severe in myocardium and only partial in
    skeletal muscle and lymphoblastoid cells, when every subunit and assembly factor of
    complex II is nuclear-encoded and the causal allele is homozygous in every cell?
  attaches_to:
  - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
  - disease#Dilated Cardiomyopathy 1GG
  rationale: >-
    This is the entity's defining unexplained fact, and the reporting authors raise it
    themselves rather than leaving it to a reader. The usual explanation for
    tissue-restricted respiratory-chain disease is heteroplasmy, and it is unavailable
    here: complex II is the only respiratory-chain complex encoded entirely in the
    nuclear genome, so gene dosage is identical in every tissue. The obvious alternative,
    a modifier in another complex II gene, was tested and excluded - SDHB, SDHD and
    SDHAF1 were sequenced and carried nothing. What remains untested is whether cardiac
    mitochondria assemble or degrade the destabilised holoenzyme differently, or whether
    the myocardium simply has the lowest tolerance for a given residual activity because
    of its continuous contractile demand. The question is not academic: it is the reason
    this disease is separable from mitochondrial complex II deficiency, nuclear type 1
    at all, and answering it would determine whether the boundary between those two
    entities is mechanistic or merely descriptive.
  proposed_experiments:
  - experiment_id: dcm1gg_tissue_assembly_comparison
    name: Comparative complex II assembly and turnover across cardiac and skeletal muscle mitochondria
    description: >-
      Measure assembled complex II holoenzyme abundance, subunit steady-state levels and
      subunit turnover rate in cardiac versus skeletal muscle mitochondria carrying the
      homozygous p.Gly555Glu allele, to test whether the tissue difference lies in
      assembly efficiency or in degradation of the destabilised complex rather than in
      downstream tolerance.
    would_support:
    - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
    supporting_outcome:
    - >-
        Assembled holoenzyme is disproportionately reduced in cardiac mitochondria relative
        to skeletal muscle at equal subunit expression, locating the tissue difference at
        assembly or turnover.
    would_refute:
    - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
    refuting_outcome:
    - >-
        Assembly and turnover are equivalent between the two tissues, which would move the
        explanation downstream to differential tolerance of a shared enzymatic deficit and
        leave this node's framing as a tissue-level assembly phenomenon unsupported.
- discussion_id: dcm1gg_one_genotype_three_phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does one homozygous SDHA genotype, p.Gly555Glu, produce isolated neonatal dilated
    cardiomyopathy in two Bedouin kindreds, a lethal infantile multisystem presentation in
    one proband, and a relatively mild Leigh syndrome in another?
  attaches_to:
  - genetic#SDHA
  - pathophysiology#SDHA p.Gly555Glu Homozygosity
  rationale: >-
    Marked phenotypic heterogeneity is expected of heteroplasmic mitochondrial DNA
    mutations and is unusual for a nuclear allele, and the source that reports the Leigh
    presentation says exactly that. It also closes off the most obvious explanation:
    enzyme activities and enzyme stability were comparable between the patients with
    different phenotypes, so the divergence is not a matter of one patient having less
    residual complex II than another. That leaves unidentified genetic background,
    environmental or perinatal factors, or stochastic developmental effects, none of which
    has been investigated. This gap is the reason this entry cannot claim that its
    genotype is diagnostic of its phenotype, and it bears directly on the differential
    with mitochondrial complex II deficiency, nuclear type 1.
- discussion_id: dcm1gg_no_animal_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    No in vivo model carries SDHA p.Gly555Glu, and the one cardiac complex II model that
    exists disables an assembly factor in a tissue chosen by the experimenter. What model
    would let the tissue selectivity of this disease be studied rather than assumed?
  attaches_to:
  - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
  - disease#Dilated Cardiomyopathy 1GG
  rationale: >-
    No model of this disorder's allele exists, but the gap is narrower than "no model",
    and the distinction matters. A conditional cardiac knockout of Sdhaf4, the assembly
    factor that brings SDHA together with SDHB, is curated in this entry's animal models:
    it reproduces the SDHA-SDHB interface failure, the loss of assembled complex II, and
    progressive lethal dilated cardiomyopathy, and it is the model in which fumarate
    rescue was demonstrated. What it does not and cannot provide is the two things
    peculiar to this disease. It carries a null allele of a different gene rather than a
    hypomorphic missense substitution in the flavoprotein, so it cannot test whether an
    assembled but destabilised holoenzyme behaves the same way; and its cardiac
    restriction is imposed by the Cre driver rather than arising on its own, so it cannot
    address why a homozygous allele present in every cell disables the heart alone.

    Searches run on 2026-08-31 for Sdha knockout, knock-in, conditional-deletion and
    heterozygous mouse models, for Drosophila SdhA models, and for Caenorhabditis elegans
    complex II mutants returned no SDHA-subunit model of cardiomyopathy; the well-known
    nematode complex II mutant mev-1 is a cytochrome b (SDHC) allele, not an SDHA one, and
    the recently modelled SDHD H50R is a different subunit again. Beyond the Sdhaf4 mouse,
    the published functional work on this entity's allele is confined to patient material
    and to a human knockout cell line, both curated in this entry. Scarcity of models is a
    recognised field-wide obstacle for complex II disease rather than a gap peculiar to
    this disorder. The consequence here is specific: the tissue-restriction question above
    cannot be settled in patient tissue alone, because the cardiac samples that would be
    needed come only from autopsy.
  proposed_experiments:
  - experiment_id: dcm1gg_sdha_g555e_knockin_mouse
    name: Knock-in mouse carrying the orthologous Sdha Gly555Glu substitution
    description: >-
      Generate a homozygous knock-in of the residue-equivalent substitution and compare
      succinate dehydrogenase activity, assembled complex II abundance and contractile
      function across heart, skeletal muscle and brain, to test whether the tissue
      restriction reproduces outside the human founder background.
    would_support:
    - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
    supporting_outcome:
    - >-
        Homozygous animals show a cardiac-predominant enzyme deficit and dilated
        cardiomyopathy with preserved neurological function, reproducing the human tissue
        distribution.
    would_refute:
    - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
    refuting_outcome:
    - >-
        Homozygous animals show a uniform enzyme deficit across tissues, or an
        encephalopathic rather than cardiac phenotype, indicating that the tissue
        restriction depends on human-specific or founder-background factors rather than on
        the allele.
  evidence:
  - reference: PMID:23174333
    reference_title: "The role of complex II in disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Further progress in understanding the role of complex II in disease, and in the development of new therapeutic approaches, is now being hampered by the lack of relevant cell and animal models."
    explanation: >-
      Published confirmation that the absence of models is a recognised, field-wide
      obstacle for complex II disease rather than an artefact of this entry's searching.
      Graded OTHER because it is a review.
- discussion_id: dcm1gg_riboflavin_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Complex II is the only respiratory-chain complex with a flavin cofactor, and
    riboflavin has been given to patients with complex II deficiency. Has it ever been
    tried in the cardiac-restricted form, and would it be expected to help an allele whose
    defect is a destabilised subunit interface rather than impaired flavinylation?
  attaches_to:
  - treatments#Heart Failure Supportive Care
  - pathophysiology#Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
  rationale: >-
    No treatment is curated for the enzyme defect in this entry because none is supported
    for it, and this discussion records why rather than leaving the omission unexplained.
    The evidence that exists is about complex II deficiency as a biochemical class, is
    weak, and points in both directions: a systematic review of riboflavin across
    inherited metabolic diseases classifies its effect in complex II deficiency as
    uncertain by an explicit threshold, meaning fewer than three-quarters of patients
    responded, while individual reports describe mild improvement on mitochondrial
    cocktails that include riboflavin. None of that evidence comes from a patient with
    this disorder. There is also a mechanistic reason for caution specific to this allele:
    the defect here is a destabilised interface between the flavoprotein and the
    iron-sulfur subunit, not a failure to acquire the flavin cofactor, so cofactor
    supplementation does not have an obvious target. Curating riboflavin as a treatment of
    this disease would assert an indication the literature does not support.
  evidence:
  - reference: PMID:42046426
    reference_title: "Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The effect was uncertain in complex I and II deficiency, ethylmalonic encephalopathy, FAD synthase deficiency, glutaric aciduria type 1, L2 hydroxyglutaric aciduria, and MADD type 2."
    explanation: >-
      The systematic review's verdict for the biochemical class this disorder belongs to.
      Graded HUMAN_CLINICAL because the review synthesises reported patient outcomes.
  - reference: PMID:42046426
    reference_title: "Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RF therapy was considered \"effective\" in an IMD if more than 75% of patients showed a positive response, \"uncertain\" in case of a positive response in fewer than 75% of patients"
    explanation: >-
      Defines what the "uncertain" verdict means, so the finding above is not read as a
      stronger or weaker claim than it is.
  - reference: PMID:37064335
    reference_title: "Two Patients Diagnosed as Succinate Dehydrogenase Deficiency: Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some reported patients showed clinical improvement following riboflavin therapy"
    explanation: >-
      The countervailing observation, stated as a review of reported cases within a case
      report. Cited for the treatment landscape of complex II deficiency; neither of this
      report's patients has this disorder.

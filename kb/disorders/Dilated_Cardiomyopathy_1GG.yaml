name: Dilated Cardiomyopathy 1GG
category: Mendelian
creation_date: "2026-08-31T11:20:00Z"
synonyms:
- CMD1GG
- cardiomyopathy, dilated, 1GG
- dilated cardiomyopathy type 1GG
- SDHA familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in SDHA
description: >-
  Dilated cardiomyopathy 1GG is the cardiac-restricted phenotype of biallelic SDHA
  deficiency: a recessive, neonatal-onset dilated cardiomyopathy in which the heart
  fails while the nervous system and skeletal muscle are clinically spared. SDHA
  encodes the flavoprotein (Fp) catalytic subunit of mitochondrial complex II
  (succinate:ubiquinone oxidoreductase), the only respiratory-chain complex encoded
  entirely in the nuclear genome and the only one that belongs simultaneously to the
  tricarboxylic acid cycle and the electron transport chain.

  The entity rests almost entirely on one report: fifteen patients from two large
  consanguineous Bedouin families, all homozygous for the same SDHA missense allele,
  presenting with dilated cardiomyopathy in the neonatal period or the first months
  of life. What makes this a disease worth curating separately is not a distinct
  lesion but a distinct distribution of one. The residual succinate dehydrogenase
  activity in these patients is severely reduced in cardiac muscle while substantial
  activity is retained in skeletal muscle and in lymphoblastoid cells - and the
  clinical picture follows the enzymology rather than the genotype, with psychomotor
  development appropriate for age and no seizures.

  That tissue restriction is also the entity's unexplained fact, and the reporting
  authors say so themselves. Every subunit of the complex II holoenzyme is
  nuclear-encoded, so there is no heteroplasmy to invoke; SDHB, SDHD and SDHAF1 were
  sequenced and carried no modifier. The mechanism of the allele itself is better
  understood than its tissue selectivity: the substituted residue sits in the domain
  through which the flavoprotein contacts the iron-sulfur subunit, and the assembled
  130 kDa holoenzyme is lost to a greater degree than either individual subunit, which
  identifies the defect as a destabilised subunit interface rather than a null allele.

  The same homozygous allele has twice been published with non-cardiac phenotypes -
  a lethal infantile presentation and a relatively mild Leigh syndrome - with
  comparable enzyme activities and stability between patients. So the boundary between
  this disease and mitochondrial complex II deficiency, nuclear type 1 is not drawn by
  the variant, the zygosity, or the biochemistry. It is drawn by which organ failed,
  and nothing published explains why.
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      The defining and effectively the only morbidity is cardiac: neonatal dilated
      cardiomyopathy progressing to congestive heart failure and death, with
      psychomotor development appropriate for age and no seizures in the reported
      cohort. A NEUROLOGIC assignment is deliberately not made, because the absence
      of neurological involvement is precisely what separates this entity from the
      other recessive SDHA phenotype.
    evidence:
    - reference: PMID:20551992
      reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we present the association of a mutation in the SDHA gene with recessive neonatal isolated DCM in 15 patients of two large consanguineous Bedouin families."
      explanation: The founding report characterises the entity as an isolated dilated cardiomyopathy, which is the basis for a cardiovascular-only chapter assignment.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      A nuclear-encoded oxidative-phosphorylation disorder. The mutated gene is
      nuclear but the failing organelle and the failing chemistry are mitochondrial.
  icimd_category:
  - classification_value: complex_ii_subunits_and_assembly_factors
    notes: >-
      ICIMD category 7, nuclear-encoded disorders of oxidative phosphorylation,
      subgroup complex II subunit and assembly-factor defects. SDHA encodes the
      catalytic flavoprotein subunit. As with the other SDHA entities, ICIMD does not
      separate this cardiac-restricted phenotype from the Leigh/leukodystrophy
      phenotype; both fall in the same ICIMD cell, which is why the MONDO-level split
      carries the distinction instead.

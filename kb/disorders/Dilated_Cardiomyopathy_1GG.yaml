genetic:
- name: SDHA
  notes: >-
    The only gene implicated in this disorder. All fifteen reported patients are
    homozygous for the same missense allele, c.1664G>A p.(Gly555Glu), inherited within
    two consanguineous kindreds from one founder population. The allele is not private
    to this phenotype: the same homozygous genotype has been reported in a lethal
    infantile presentation and in a relatively mild Leigh syndrome, which is why the
    genotype cannot be used to assign a patient to this disease rather than to
    mitochondrial complex II deficiency, nuclear type 1.

    Penetrance is incomplete, and the exception was found inside the reported kindred
    rather than inferred. The father of one patient proved to be homozygous for the same
    allele while being clinically unaffected, with a normal physical assessment,
    electrocardiogram and echocardiogram. His complex II enzymatic activity in
    lymphoblastoid cells was reduced by 42%, closer to the patients than to the
    heterozygous mother or to controls. So neither the genotype nor the measurable enzyme
    deficit in an accessible tissue is sufficient for disease, and the counselling
    consequence is direct: a homozygous result in an asymptomatic relative does not
    predict cardiomyopathy.
  gene_term:
    preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  evidence:
  - reference: PMID:20551992
    reference_title: "Familial neonatal isolated cardiomyopathy caused by a mutation in the flavoprotein subunit of succinate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present the association of a mutation in the SDHA gene with recessive neonatal isolated DCM in 15 patients of two large consanguineous Bedouin families."
    explanation: The gene-disease association this record asserts.

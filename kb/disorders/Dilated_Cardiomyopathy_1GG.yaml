  notes: >-
    Respiratory-chain enzymology on cardiac tissue is the assay that demonstrates the
    lesion in this disorder, and it is the only tissue in which the deficit is severe.
    Assays on skeletal muscle or on cultured blood-derived cells retain substantial
    activity and can therefore be misleadingly close to normal.

- name: Perifollicular Inflammation
  biological_scale: TISSUE
  description: Activated T cells, mast-cell degranulation and fibroblast activation were described around follicles in a small progressive-pattern biopsy series. Larger biopsy data associate inflammation with a lower observed minoxidil response. These cross-sectional findings do not determine whether inflammation precedes, follows or independently modifies miniaturization.
  evidence:
  - reference: PMID:1390168
    reference_title: 'Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Immunohistochemically, control biopsies were devoid of follicular inflammation (n = 3), while transitional regions consistently showed the presence of activated T-cell infiltrates about the lower portions of follicular infundibula.
    explanation: Activated T-cell infiltration was observed in transitional scalp from three men and one woman, with three controls; it is not a universal AGA finding.
  - reference: PMID:8496421
    reference_title: Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In MPAA with no significant inflammation, regrowth occurred in 77% of cases, versus 55% in cases with significant inflammation.
    explanation: In a 44-person treatment subset, observed regrowth was 77% without versus 55% with significant inflammation; this is not a randomized inflammatory intervention.

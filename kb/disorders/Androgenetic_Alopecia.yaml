- name: Regional 5-Alpha-Reductase Abundance
  biological_scale: MOLECULAR
  description: The paired follicle study found higher type 1 and type 2 5-alpha-reductase levels in frontal than occipital samples from women and men. Higher occipital aromatase and sex-related differences were also reported. These are regional measurements in selected participants, not evidence that all unaffected follicles lack androgen metabolism.

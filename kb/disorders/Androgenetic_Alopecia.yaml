- name: K14-Ptgs2 transgenic mouse (skin-targeted prostaglandin overproduction)
  species: Mouse
  genotype: K14-Ptgs2 transgenic
  publication: PMID:22440736
  description: >-
    A mouse expressing prostaglandin-endoperoxide synthase 2 under the keratin
    14 promoter, which raises skin prostaglandin D2 and develops alopecia,
    follicular miniaturization and sebaceous gland hyperplasia. It models the
    prostaglandin arm in isolation: there is no androgen drive, no
    susceptibility genetics and no scalp pattern, so it speaks to what
    prostaglandin D2 can do to a follicle, not to how the human disease
    arises.
  modeled_mechanisms:
  - target: Prostaglandin D2 Elevation in Bald Scalp
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Raises skin prostaglandin D2 genetically, the manipulation of this node.
    limitations: >-
      Overexpression of the upstream synthase rather than of PTGDS itself, and
      supraphysiological; it does not model the elevation's cause in men.
    evidence:
    - reference: PMID:22440736
      reference_title: "Prostaglandin D2 inhibits hair growth and is elevated in bald scalp of men with androgenetic alopecia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we find that a transgenic mouse, K14-Ptgs2, which targets prostaglandin-endoperoxide synthase 2 expression to the skin, demonstrates elevated levels of PGD(2) in the skin and develops alopecia, follicular miniaturization, and sebaceous gland hyperplasia, which are all hallmarks of human AGA."
      explanation: The genetic perturbation and its consequence.
  - target: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Produces follicular miniaturization and alopecia downstream of
      prostaglandin D2 alone.
    limitations: >-
      Mouse pelage follicles cycle synchronously and lack the regional androgen
      program of the human scalp; the miniaturization is prostaglandin-driven
      rather than androgen-driven, and no patterned scalp loss occurs.
    evidence:
    - reference: PMID:22440736
      reference_title: "Prostaglandin D2 inhibits hair growth and is elevated in bald scalp of men with androgenetic alopecia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we find that a transgenic mouse, K14-Ptgs2, which targets prostaglandin-endoperoxide synthase 2 expression to the skin, demonstrates elevated levels of PGD(2) in the skin and develops alopecia, follicular miniaturization, and sebaceous gland hyperplasia, which are all hallmarks of human AGA."
      explanation: The miniaturization phenotype in the model.
  evidence:
  - reference: PMID:22440736
    reference_title: "Prostaglandin D2 inhibits hair growth and is elevated in bald scalp of men with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results define PGD(2) as an inhibitor of hair growth in AGA and suggest the PGD(2)-GPR44 pathway as a potential target for treatment."
    explanation: The conclusion drawn from the model together with the human and explant data.

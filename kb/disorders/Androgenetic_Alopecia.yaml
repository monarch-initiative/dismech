- name: Topical finasteride
  description: A formulation-specific 24-week trial randomized 458 men aged 18–40 with mild-to-moderate vertex hair loss to topical finasteride 0.25% spray, placebo or oral finasteride 1 mg. Topical treatment improved target-area hair count versus placebo; the protocol-defined primary analysis included only 250 men with valid baseline and on-treatment photographs, although post hoc sensitivity analyses supported the direction of benefit. Numerical similarity to oral treatment does not establish efficacy equivalence. Plasma exposure was substantially lower with topical treatment, but serum DHT still fell and systemic adverse effects remain possible. Low sexual-event counts and short follow-up do not establish superior long-term safety. Evidence for this specific spray should not be generalized to every compounded formulation or to women.

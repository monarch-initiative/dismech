- name: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
  biological_scale: TISSUE
  description: >-
    The histological hallmark. Terminal follicles convert to vellus-like
    follicles producing short, fine, often depigmented hairs, leaving behind
    fibrous streamers (stelae) below the shrunken bulb; horizontal sections
    show fewer terminal and more vellus hairs and a terminal-to-vellus ratio
    that falls from about 7:1 in normal scalp to below 4:1. Miniaturization is
    probably an abrupt, large-step event rather than a slow arithmetic of
    shortening cycles, because it can reverse within a single cycle on
    finasteride, and it is proposed to follow directly from a reduction in
    dermal papilla cell number and therefore papilla size. Follicular ostia are
    retained, so the process is non-scarring and, early, reversible.

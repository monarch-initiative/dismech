discussions:
- discussion_id: aga_fphl_androgen_dependence
  prompt: Is female pattern hair loss androgen-dependent at all, and if so through the same dermal papilla mechanism as the male disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Female pattern hair loss
  - pathophysiology#Dihydrotestosterone-Androgen Receptor Signaling
  rationale: Androgen-related tissue differences and clinical responses do not establish identical mechanisms across all female-pattern populations. Most affected women have normal circulating androgens. The negative 1-mg finasteride trial in postmenopausal women is dose- and population-specific. A 2025 randomized spironolactone add-on pilot now exists, but primary hair-count differences were not significant and the study was small. Larger trials with prespecified endocrine and tissue strata are needed to identify who benefits and whether response is mediated by the same dermal-papilla pathways as in male-pattern disease.
  evidence:
  - reference: PMID:12573818
    reference_title: Androgens and alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In contrast to its beneficial effects in men, finasteride did not improve hair growth in postmenopausal women with FPHL.
    explanation: The null result applies to the tested postmenopausal population and regimen.
  - *id011
  proposed_experiments:
  - experiment_id: aga_fphl_antiandrogen_rct
    name: Confirmatory stratified antiandrogen trial in female-pattern hair loss
    description: A larger trial could use prespecified androgen-status and tissue-expression strata, standardized background therapy and blinded hair-density outcomes to test heterogeneity of response. This would extend, rather than precede, the small 2025 placebo-controlled adjunct trial.
- discussion_id: aga_mouse_model_mismatch
  prompt: Do mouse models of hair growth inhibition, including mice treated with dihydrotestosterone and mice overexpressing prostaglandin synthase, model androgenetic alopecia, or only individual mediators of it?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Follicular Miniaturization
  - animal_models#K14-Ptgs2 mouse with altered skin prostanoids
  - animal_models#Topical PGD2 challenge in prostaglandin-receptor knockout mice
  rationale: The cited mouse interventions isolate selected mechanisms rather than reproduce human polygenic scalp-pattern disease. K14-Ptgs2 alters multiple prostanoids; topical PGD2 requires Gpr44 for hair-length inhibition but does not induce early catagen; injected IL6 is a separate cycle perturbation. Human follicle culture uses terminal face/brow hair, and the stem/progenitor paper demonstrates functional reconstitution with mouse cells, not rescue of patient scalp stem cells. Transfer between systems must preserve these distinctions.
  evidence:
  - *id008
  - *id009
  - *id010
  proposed_experiments:
  - experiment_id: aga_humanized_scalp_xenograft
    name: Human balding and non-balding scalp xenografts on immunodeficient mice under controlled androgen
    description: Graft paired frontal and occipital scalp from the same donors onto immunodeficient mice, castrated or supplemented with dihydrotestosterone, and follow terminal-to-vellus ratio and progenitor markers over successive cycles, so that the regional human program is studied in vivo without relying on mouse follicles.
- discussion_id: aga_microinflammation_cause_or_consequence
  prompt: Is perifollicular microinflammation and fibrosis a cause of follicular miniaturization, a cofactor that accelerates it, or a consequence of it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Perifollicular Inflammation
  - pathophysiology#Perifollicular Fibrosis
  rationale: Small and selected biopsy studies show inflammation and sheath remodeling associated with AGA, but do not establish temporal direction or a treatment-responsive causal pathway. In one 44-person minoxidil subset, regrowth was observed in 55% with significant inflammation versus 77% without, not a halving. Scarring fibrosing alopecia in a pattern distribution is an important differential diagnosis rather than proof that all nonscarring AGA inevitably progresses to follicular destruction.
  evidence:
  - reference: PMID:12213548
    reference_title: Molecular mechanisms of androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Since the clinical success rate of treatment of AGA with modulators of androgen metabolism or hair growth promoters is limited, sustained microscopic follicular inflammation with connective tissue remodeling, eventually resulting in permanent hair loss, is considered a possible cofactor in the complex etiology of AGA.
    explanation: The current status, a possible cofactor, is the gap.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:1390168
    reference_title: 'Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The data suggest that progressive fibrosis of the perifollicular sheath occurs in lesions of pattern alopecia, and may begin with T-cell infiltration of follicular stem cell epithelium.
    explanation: The causal proposal, framed as may, from the histological study.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: aga_serial_biopsy_inflammation
    name: Serial biopsies of transitional scalp with follicle-level tracking of infiltrate and terminal-to-vellus status
    description: Biopsy the same transitional zone at intervals, mapping individual follicular units, to test whether T-cell infiltration and sheath thickening precede the drop in terminal-to-vellus ratio in the same unit or follow it, and whether follicles that miniaturize without infiltrate exist.
- discussion_id: aga_risk_allele_function
  prompt: What does the AR/EDA2R risk haplotype, or any of the several hundred autosomal risk alleles, actually do to the scalp follicle?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Polygenic Susceptibility
  rationale: Susceptibility signals nominate AR/EDA2R and many autosomal candidates, but the cited association and expression studies do not establish most allele-specific mechanisms. Absence of statistical AR-by-20p11 interaction is not proof of biochemical androgen independence. The 2017 eQTL overlap uses LD-based coincidence in healthy occipital follicles, not formal causal colocalization; pathway enrichments are candidate interpretations. Polygenic scores distinguish selected phenotypic categories but have not established prospective clinical decision benefit across populations.
  evidence:
  - reference: PMID:18849994
    reference_title: Susceptibility variants for male-pattern baldness on chromosome 20p11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No interaction was detected with the X-chromosomal androgen receptor locus, suggesting that the 20p11 locus has a role in a yet-to-be-identified androgen-independent pathway.
    explanation: A major locus whose pathway is explicitly unidentified.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15902657
    reference_title: Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The investigation of a large number of genetic variants covering the AR locus suggests that a polyglycine-encoding GGN repeat in exon 1 is a plausible candidate for conferring the functional effect.
    explanation: The functional variant at the strongest locus remains a candidate.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: aga_ar_locus_allelic_expression
    name: Allele-specific expression and chromatin accessibility of AR and EDA2R in scalp dermal papilla from risk-haplotype carriers
    description: In dermal papilla cells from frontal and occipital scalp of carriers and non-carriers, measure allele-specific AR and EDA2R expression, map accessible regulatory elements across the linkage block, and edit candidate variants in immortalized balding dermal papilla lines to test which changes receptor level and androgen-induced DKK1, TGFB1 and IL6 output.
- discussion_id: aga_sult1a1_minoxidil_response
  prompt: Does follicular SULT1A1 sulfotransferase activity predict the response to topical minoxidil, and could it be used to select patients or to rescue non-responders?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Topical minoxidil
  rationale: Follicular sulfotransferase activity is a candidate minoxidil-response biomarker. A 2015 study prospectively assayed 15 participants before topical treatment and reported 100% sensitivity and 71% specificity against a later photographic response classification. Its combined 70-person calculation gave a 95.9% negative predictive value assuming a 40% response prevalence. This is not universal test accuracy, an allele-specific loss-of-function result or evidence that assay-guided prescribing improves outcomes. Broader external validation and prospective clinical utility remain unresolved.
  evidence:
  - reference: url:https://prtimes.jp/a/?f=d59603-106-d6c9c40ba4f09ed7d1658c32d4f991e5.pdf
    reference_title: https://prtimes.jp/a/?f=d59603-106-d6c9c40ba4f09ed7d1658c32d4f991e5.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A total of 15 patients (eight male, seven female) were included in our analysis of minoxidil response testing.
    explanation: The small prospective study updates the previous incorrect claim that no prospective validation existed.
  - reference: url:https://prtimes.jp/a/?f=d59603-106-d6c9c40ba4f09ed7d1658c32d4f991e5.pdf
    reference_title: https://prtimes.jp/a/?f=d59603-106-d6c9c40ba4f09ed7d1658c32d4f991e5.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: sensitivity of 100% and a speciﬁcity of 71% (Student’s t-test p < 0.005).
    explanation: Performance is estimated in the small prospective subset; no clinical-utility trial follows.
  proposed_experiments:
  - experiment_id: aga_sult1a1_stratified_minoxidil_trial
    name: External validation and clinical-utility trial of follicular sulfotransferase testing
    description: Use an independent cohort and prespecified threshold to test calibration across populations, then compare assay-guided care with usual care. Genotype effects should be measured separately rather than inferred from enzymatic activity.
differential_diagnoses:
- name: Telogen effluvium
  description: Diffuse shedding without patterned miniaturization, often with a precipitant three months earlier. Distinguished by a positive pull test across the whole scalp, absence of hair-diameter variability, and a normal terminal-to-vellus ratio on biopsy. The two commonly coexist in women.
- name: Alopecia areata
  description: Autoimmune, non-scarring, and typically patchy, with exclamation-mark hairs, black dots and yellow dots on trichoscopy and a peribulbar lymphocytic infiltrate rather than miniaturization. A diffuse variant can mimic the female pattern.
- name: Frontal fibrosing alopecia and lichen planopilaris
  description: Scarring alopecias in which follicular ostia are lost. Frontal fibrosing alopecia recedes the frontal hairline band-like with loss of eyebrows, and a pattern-distributed fibrosing variant of lichen planopilaris is the main scarring mimic of the female pattern; both need biopsy when suspected.
- name: Traction alopecia and trichotillomania
  description: Mechanical causes with a distribution that follows hairstyle or hand, and with broken hairs of varying length in trichotillomania.
- name: Hyperandrogenic disorders in women
  description: Polycystic ovary syndrome, androgen-secreting tumours and adrenal disorders can produce a male-type pattern with hirsutism, acne and menstrual disturbance; these signs, not the hair loss itself, prompt endocrine testing.

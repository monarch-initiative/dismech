    reference_title: Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The diagnosis of MPAA was confirmed by finding decreased terminal hairs and increased stelae and vellus hairs.
    explanation: Horizontal biopsy sections show fewer terminal hairs and more vellus hairs and stelae in a selected male-pattern series.

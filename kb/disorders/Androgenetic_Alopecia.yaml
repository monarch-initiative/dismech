- name: Dutasteride
  description: Dutasteride inhibits type 1 and type 2 5-alpha-reductase. A 416-man, 24-week dose-ranging trial showed increasing hair counts with dose; superiority over finasteride involved dutasteride 2.5 mg versus finasteride 5 mg, not a 0.5-versus-1-mg comparison. The S3 guideline considers 0.5 mg daily as an off-label second-line option after ineffective finasteride treatment. Sexual and reproductive precautions require counseling. The 2025 EMA review did not establish a causal link between dutasteride and suicidal ideation; a warning was added as a class precaution, which should not be described as the same proven drug-specific finding as for finasteride.

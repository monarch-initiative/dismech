  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11007651/
    reference_title: 'Oral Minoxidil vs Topical Minoxidil for Male Androgenetic Alopecia: A Randomized Clinical Trial - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In this double-blind, placebo-controlled randomized clinical trial including 90 men with androgenetic alopecia, daily oral minoxidil, 5 mg, was well tolerated and did not demonstrate superiority over topical minoxidil, 5%, in men with androgenetic alopecia after 24 weeks of treatment.
    explanation: The randomized comparison does not establish equivalence or long-term safety.
  - reference: url:https://www.newswise.com/pdf_docs/173213268899494_jamadermatology_akiska_2024_cs_240009_1732051708.84641%20%281%29.pdf

  species: Mouse
  publication: PMID:21881585
  description: Recombinant human IL6 injected into the mouse hypodermis during anagen caused early catagen. This is a cytokine perturbation of the hair cycle, distinct from the human follicle organ-culture proliferation experiment and from chronic androgenetic alopecia.

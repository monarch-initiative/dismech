- name: Local Dihydrotestosterone Production
  biological_scale: MOLECULAR
  description: 5-alpha-reductases convert testosterone to the more potent androgen dihydrotestosterone within the follicular environment. Dermal papilla metabolism is implicated, while type 2 enzyme is also described in outer root sheath tissue. Human endocrine observations and DHT-lowering treatment support an important role in male-pattern disease. Normal circulating androgen concentrations can coexist with local susceptibility; this does not imply every patient has the same steroid profile.
  evidence:
  - reference: PMID:12213548
    reference_title: Molecular mechanisms of androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Conversion of testosterone to DHT within the dermal papilla plays a central role, while androgen-regulated factors deriving from dermal papilla cells are believed to influence growth of other components of the hair follicle.
    explanation: The review places local conversion in the follicular androgen mechanism; it is not a direct flux measurement in every follicular compartment.
  - reference: PMID:12573818
    reference_title: Androgens and alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Observations in both eunuchs, who have low levels of testicular androgens, and males with genetic 5alpha-reductase (5alphaR) deficiency, who have low levels of dihydrotestosterone (DHT), implicate DHT as a key androgen in the pathogenesis of MPHL in men.
    explanation: Human endocrine observations support the importance of DHT in male-pattern hair loss without establishing a universal female mechanism.

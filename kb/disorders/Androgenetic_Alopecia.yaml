      explanation: States the step from the metabolite to the receptor.
- name: Dihydrotestosterone-Androgen Receptor Signalling in Dermal Papilla Cells
  biological_scale: CELLULAR
  description: >-
    The dermal papilla, not the follicular epithelium, is the androgen target.
    Androgen receptor is confined to dermal papilla cells, and in co-culture
    testosterone changes the growth of outer root sheath keratinocytes only
    when dermal papilla cells from an androgen-responsive site are present,
    without cell contact, so the receptor's effect on the epithelium must be
    relayed by secreted factors. In balding scalp dermal papilla cells
    transfected to restore androgen receptor, androgen suppresses keratinocyte
    growth by about half; in beard dermal papilla the same receptor drives
    growth, which is the paradox of androgens on human hair and the reason
    this node is about the responding cell rather than the hormone. The
    receptor blocker RU 58841 abolishes the inhibitory effect in macaque
    co-culture, and antiandrogens are the basis of treatment in women.

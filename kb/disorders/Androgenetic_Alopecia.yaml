- name: Spironolactone for female-pattern hair loss
  description: Spironolactone is an off-label option in selected women, with pregnancy avoidance and assessment of renal function, potassium and blood-pressure risks. The older uncontrolled series combining spironolactone and cyproterone groups reported regrowth in 44% and stability in 44%, without proving efficacy against natural history. A 2025 pilot randomized 48 healthy premenopausal women to spironolactone 100 mg or placebo, both with topical 3% minoxidil for 24 weeks. The primary total and terminal hair-count differences were not statistically significant; a dichotomized photographic improvement endpoint favored spironolactone. Menstrual irregularity occurred in 9 of 24 assigned spironolactone and led to two withdrawals. These small adjunct data do not establish benefit in all female-pattern populations.

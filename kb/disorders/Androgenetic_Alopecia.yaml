- name: Prostaglandin D2 Elevation in Bald Scalp
  biological_scale: MOLECULAR
  description: >-
    Prostaglandin D2 synthase mRNA and protein, and prostaglandin D2 itself,
    are elevated in bald compared with haired scalp of the same men.
    Prostaglandin D2 inhibits hair growth in explanted human follicles and on
    mouse skin through the GPR44 (DP2/CRTH2) receptor and not through PTGDR,

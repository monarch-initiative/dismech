- name: Perifollicular Fibrosis
  biological_scale: TISSUE
  description: Perifollicular sheath thickening and fibrosis can accompany AGA. Connective-tissue remodeling is a proposed modifier of follicular function, with unresolved causal direction. Follicular dropout in fibrosing alopecia in a pattern distribution represents a scarring differential diagnosis and is not established as the inevitable endpoint of nonscarring AGA.
  evidence:
  - reference: PMID:1390168

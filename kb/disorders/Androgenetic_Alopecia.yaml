- name: Dihydrotestosterone-Androgen Receptor Signaling
  biological_scale: MOLECULAR
  description: Androgen-responsive dermal papilla cells can relay growth-inhibitory signals to follicular keratinocytes. Human coculture evidence includes an AR-transfected preparation that restored responsiveness lost during culture; macaque coculture shows antagonist-sensitive inhibition. These experiments support a paracrine route while leaving its quantitative contribution in patients unresolved. Androgens stimulate growth at other body sites, so signaling consequences depend on follicular context.
  evidence:
  - reference: PMID:12397096
    reference_title: 'Androgen-inducible TGF-beta1 from balding dermal papilla cells inhibits epithelial cell growth: a clue to understand paradoxical effects of androgen on human hair growth.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In this modified coculture, androgen significantly suppressed the growth of KCs by approximately 50%, indicating that overexpression of AR can restore the responsiveness of the DPCs to androgen in vivo.
    explanation: Androgen inhibition required AR-transfected human dermal papilla cells in this assay; native cultured cells initially lacked a significant response.
  - reference: PMID:8977424
    reference_title: Inhibition of hair growth by testosterone in the presence of dermal papilla cells from the frontal bald scalp of the postpubertal stumptailed macaque.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Furthermore, RU 58841, an androgen receptor blocker, antagonized this testosterone-elicited inhibition.
    explanation: An AR blocker antagonized testosterone-dependent inhibition in macaque dermal-papilla/outer-root-sheath coculture.

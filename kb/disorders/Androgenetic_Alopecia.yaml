experimental_models:
- name: Macaque dermal-papilla and outer-root-sheath coculture
  experimental_model_type: CO_CULTURE
  cell_source: Dermal papilla and outer-root-sheath cells from adult frontal/occipital and juvenile frontal macaque scalp
  description: Testosterone inhibited outer-root-sheath cell proliferation only with adult bald-frontal dermal papilla cells in the cited coculture. The androgen-receptor blocker RU 58841 antagonized inhibition. This model tests site- and age-dependent paracrine response; it does not prove absence of receptors in every unaffected human follicle.
  evidence:
  - &id012
    reference: PMID:8977424
    reference_title: Inhibition of hair growth by testosterone in the presence of dermal papilla cells from the frontal bald scalp of the postpubertal stumptailed macaque.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Testosterone-induced inhibition of outer root sheath cell proliferation occurred only in coculture with dermal papilla cells derived from the bald scalps of adult macaques but not with dermal papilla cells from the hairy occipital scalps of adult macaques or the prebald frontal scalps of juvenile macaques.
    explanation: Regional and age-specific response was tested in macaque cell coculture, not inferred from intact-animal hair weight.
  - reference: PMID:8977424
    reference_title: Inhibition of hair growth by testosterone in the presence of dermal papilla cells from the frontal bald scalp of the postpubertal stumptailed macaque.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Furthermore, RU 58841, an androgen receptor blocker, antagonized this testosterone-elicited inhibition.
    explanation: Antagonism supports receptor involvement within the cell preparation.
  modeled_mechanisms:
  - target: Dihydrotestosterone-Androgen Receptor Signaling
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Testosterone and an AR blocker probe androgen-dependent epithelial inhibition mediated by dermal papilla cells.
    limitations: The applied androgen is testosterone; DHT flux and the entire human clinical mechanism are not directly measured.
    evidence:
    - *id012
- name: AR-transfected human dermal-papilla and keratinocyte coculture
  experimental_model_type: CO_CULTURE
  cell_source: Cultured balding-derived human dermal papilla cells with keratinocytes
  description: Native cultured dermal papilla cells initially showed no significant androgen-dependent inhibition. AR transfection restored the response, with increased TGF-beta1 secretion and antibody-sensitive keratinocyte growth suppression. The engineered receptor context limits extrapolation to untreated patient follicles.
  evidence:
  - reference: PMID:12397096
    reference_title: 'Androgen-inducible TGF-beta1 from balding dermal papilla cells inhibits epithelial cell growth: a clue to understand paradoxical effects of androgen on human hair growth.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In this modified coculture, androgen significantly suppressed the growth of KCs by approximately 50%, indicating that overexpression of AR can restore the responsiveness of the DPCs to androgen in vivo.
    explanation: The growth effect occurs in the receptor-transfected preparation.
  - *id013
  modeled_mechanisms:
  - target: Increased TGF-Beta1 Secretion
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Androgen exposure tests secreted TGF-beta1 in the modified coculture.
    limitations: AR overexpression restores culture responsiveness and may alter quantitative signaling.
    evidence:
    - *id013
  - target: Reduced Follicular Keratinocyte Proliferation
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Neutralizing TGF-beta1 reverses the coculture growth inhibition.
    limitations: Keratinocyte population growth is not direct measurement of chronic patient miniaturization.
    evidence:
    - reference: PMID:12397096
      reference_title: 'Androgen-inducible TGF-beta1 from balding dermal papilla cells inhibits epithelial cell growth: a clue to understand paradoxical effects of androgen on human hair growth.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Moreover, the neutralizing anti-TGF-beta1 antibody reversed the androgen-elicited growth inhibition of KCs in a dose-dependent manner.
      explanation: Neutralization supports a TGF-beta1-dependent component.
- name: Human dermal-papilla Wnt and differentiation coculture
  experimental_model_type: CO_CULTURE
  cell_source: Human dermal papilla cells and follicular stem-cell preparations
  description: Androgen exposure altered beta-catenin/GSK3beta readouts in dermal papilla cells and reduced their ability to induce hair keratin expression in cocultured follicular cells. Wnt activation rescued that differentiation readout. The signaling measurement is in dermal papilla, and the experiment does not directly measure the marker-defined progenitor deficits in paired patient scalp.
  evidence:
  - *id014
  - *id015
  modeled_mechanisms:
  - target: Reduced Canonical Wnt Signaling in Dermal Papilla Cells
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Androgen treatment alters the measured pathway state.
    limitations: Assay-specific signaling and differentiation readouts; no patient lineage tracing.
    evidence:
    - *id014
  - target: Impaired Follicular Epithelial Differentiation
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Hair keratin induction is used as a differentiation readout.
    limitations: Rescue in culture does not establish the complete human disease route.
    evidence:
    - *id015
- name: Human terminal follicle organ culture exposed to PGD2
  experimental_model_type: OTHER
  cell_source: Terminal anagen follicles from face/brow-lift tissue of adult women and men
  description: PGD2 and 15-dPGJ2 inhibited elongation in terminal follicle cultures from at least three donors per compound. The samples were not established miniaturized AGA scalp follicles. Human GPR44 involvement was inferred from agonist-potency correlation; receptor necessity was tested separately in mice. No clinical regrowth or human stem-cell rescue was demonstrated.
  evidence:
  - *id016
  - reference: PMID:22440736
    reference_title: Prostaglandin D2 inhibits hair growth and is elevated in bald scalp of men with androgenetic alopecia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: For hair-lengthening experiments, discarded tissue from face lifts, which contain terminal hair, was used.
    explanation: The follicle source is terminal hair from discarded face-lift tissue.
  modeled_mechanisms:
  - target: PGD2-Associated Hair Growth Inhibition
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Exogenous prostaglandin exposure reduces cultured hair elongation.
    limitations: Donor site, exposure concentration and short culture interval limit disease-level inference.
    evidence:
    - *id016
review_notes: Full review separates clinical association, experimental perturbation and unresolved human mediation. It corrects the PGD2/catagen and progenitor-function claims, regional receptor localization, GWAS variance denominators, cross-sectional severity terminology, trial endpoints, updated care and regulatory safety information. All new reference files were generated with just fetch-reference; no cache text was authored. Independent bounded source audits covered PGD2/stem cells, four genetics papers and care integration.

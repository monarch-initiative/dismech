  species: Macaca arctoides
  genotype: Wild type; naturally occurring frontal balding
  publication: PMID:7962310
  description: Adult stump-tailed macaques of both sexes can develop frontal follicular regression. In a six-month study, 11 animals received oral finasteride 1 mg/kg/day and 10 received vehicle. Treated animals had greater frontal hair-weight gain than controls and increased follicle length relative to their own baseline. These observations support androgen-sensitive follicular growth in a primate model, not equivalence to the human genetic architecture, pattern or clinical dosing.

discussions:
- discussion_id: aga_fphl_androgen_dependence
  prompt: >-
    Is female pattern hair loss androgen-dependent at all, and if so through
    the same dermal papilla mechanism as the male disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Female pattern hair loss
  - pathophysiology#Dihydrotestosterone-Androgen Receptor Signalling in Dermal Papilla Cells
  rationale: >-
    The male mechanism is proven three ways: genetics at the androgen receptor,
    the absence of baldness without dihydrotestosterone, and regrowth on
    5-alpha-reductase inhibition. None of the three holds for women. Most
    women with the pattern have normal androgen levels; female frontal
    follicles carry less receptor and far less 5-alpha-reductase and more
    aromatase than male ones; finasteride failed in postmenopausal women in a
    controlled trial, which led its investigators to call the two conditions
    distinct entities with disparate pathophysiologies; and the response to
    oral antiandrogens rests on an uncontrolled series whose authors ask for a
    placebo-controlled study. The entry therefore carries the female pattern
    as a subtype of the same disease on clinical and histological grounds
    (identical miniaturization, overlapping genetics) while leaving open
    whether the androgen arm of the pathograph applies to it, and if not what
    replaces it.
  evidence:
  - reference: PMID:15787815
    reference_title: "Treatment of female pattern hair loss with oral antiandrogens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has not been conclusively established that female pattern hair loss (FPHL) is either due to androgens or responsive to oral antiandrogen therapy."
    explanation: The gap stated by the group that treats it.
  - reference: PMID:21605090
    reference_title: "Role of genetics and sex steroid hormones in male androgenetic alopecia and female pattern hair loss: an update of what we now know."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The role of sex steroid hormones in female pattern hair loss (FPHL) is less known."
    explanation: The same gap in a review of the genetics and endocrinology.
  - reference: PMID:12573818
    reference_title: "Androgens and alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathological evaluation of scalp biopsies confirmed that finasteride treatment produced no benefit on scalp hair in these women."
    explanation: The histological negative that anchors the doubt.
  proposed_experiments:
  - experiment_id: aga_fphl_antiandrogen_rct
    name: Placebo-controlled trial of spironolactone in biopsy-confirmed female pattern hair loss with stratification by androgen and 5-alpha-reductase content of frontal follicles
    description: >-
      Randomise women with biopsy-confirmed miniaturization to spironolactone
      or placebo for 12 months with standardized photography and follicle
      counts, and measure androgen receptor and 5-alpha-reductase in the
      baseline biopsy, so that response can be tested against the tissue
      androgen machinery rather than against serum hormones, which the
      uncontrolled series already showed do not predict it.
- discussion_id: aga_mouse_model_mismatch
  prompt: >-
    Do mouse models of hair growth inhibition, including dihydrotestosterone-
    treated and prostaglandin-overexpressing mice, model androgenetic alopecia,
    or only individual mediators of it?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
  - animal_models#Mouse
  rationale: >-
    Mice do not develop pattern baldness. Their pelage follicles cycle
    synchronously in waves, carry no regional androgen program equivalent to
    the frontal-versus-occipital difference in human scalp, and respond to
    androgen differently, so every mouse model is an induced perturbation of
    one mediator (systemic dihydrotestosterone, skin prostaglandin, injected
    interleukin-6) rather than a model of the disease. The K14-Ptgs2 mouse
    produces alopecia, miniaturization and sebaceous hyperplasia, which are
    hallmarks of the human histology, but through a prostaglandin drive that
    is downstream and to one side of the androgen mechanism, and the
    interleukin-6 experiment shows premature catagen in a follicle that was
    never androgen-exposed. What can be transferred from mice is the
    sufficiency of a mediator to shorten anagen or shrink a follicle; what
    cannot is the initiation, the patterning, or the decades-long course.
    Human dermal papilla co-culture, scalp explants and the stump-tailed
    macaque carry the mechanism claims in this entry for that reason.
  evidence:
  - reference: PMID:22440736
    reference_title: "Prostaglandin D2 inhibits hair growth and is elevated in bald scalp of men with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we find that a transgenic mouse, K14-Ptgs2, which targets prostaglandin-endoperoxide synthase 2 expression to the skin, demonstrates elevated levels of PGD(2) in the skin and develops alopecia, follicular miniaturization, and sebaceous gland hyperplasia, which are all hallmarks of human AGA."
    explanation: >-
      The best mouse recapitulation of the histology, and note what it
      recapitulates: hallmarks, through a single mediator, without androgen.
  - reference: PMID:21881585
    reference_title: "Dihydrotestosterone-inducible IL-6 inhibits elongation of human hair shafts by suppressing matrix cell proliferation and promotes regression of hair follicles in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, rhIL-6 injection into the hypodermis of mice during anagen caused premature onset of catagen."
    explanation: A mediator-sufficiency experiment in mouse, informative for one step and silent on the disease.
  proposed_experiments:
  - experiment_id: aga_humanized_scalp_xenograft
    name: Human balding and non-balding scalp xenografts on immunodeficient mice under controlled androgen
    description: >-
      Graft paired frontal and occipital scalp from the same donors onto
      immunodeficient mice, castrated or supplemented with dihydrotestosterone,
      and follow terminal-to-vellus ratio and progenitor markers over
      successive cycles, so that the regional human program is studied in vivo
      without relying on mouse follicles.
- discussion_id: aga_microinflammation_cause_or_consequence
  prompt: >-
    Is perifollicular microinflammation and fibrosis a cause of follicular
    miniaturization, a cofactor that accelerates it, or a consequence of it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Perifollicular Microinflammation and Fibrosis
  rationale: >-
    The infiltrate is real, it sits around the bulge where the stem cells
    live, it is absent from control scalp, it is present in the female pattern,
    and its presence halves the regrowth rate on minoxidil. But the studies are
    cross-sectional histology: nobody has shown that the inflammation precedes
    miniaturization in a given follicle, that treating it slows the disease, or
    what recruits the cells. The mechanistic reviews call it a possible
    cofactor and leave it there. The question matters because it decides
    whether anti-inflammatory treatment has a place, and because the
    cicatricial end of the female spectrum suggests the process can become
    self-sustaining.
  evidence:
  - reference: PMID:12213548
    reference_title: "Molecular mechanisms of androgenetic alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the clinical success rate of treatment of AGA with modulators of androgen metabolism or hair growth promoters is limited, sustained microscopic follicular inflammation with connective tissue remodeling, eventually resulting in permanent hair loss, is considered a possible cofactor in the complex etiology of AGA."
    explanation: The current status, a possible cofactor, is the gap.
  - reference: PMID:1390168
    reference_title: "Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data suggest that progressive fibrosis of the perifollicular sheath occurs in lesions of pattern alopecia, and may begin with T-cell infiltration of follicular stem cell epithelium."
    explanation: The causal proposal, framed as may, from the histological study.
  proposed_experiments:
  - experiment_id: aga_serial_biopsy_inflammation
    name: Serial biopsies of transitional scalp with follicle-level tracking of infiltrate and terminal-to-vellus status
    description: >-
      Biopsy the same transitional zone at intervals, mapping individual
      follicular units, to test whether T-cell infiltration and sheath
      thickening precede the drop in terminal-to-vellus ratio in the same unit
      or follow it, and whether follicles that miniaturize without infiltrate
      exist.
- discussion_id: aga_risk_allele_function
  prompt: >-
    What does the AR/EDA2R risk haplotype, or any of the several hundred
    autosomal risk alleles, actually do to the scalp follicle?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Polygenic Susceptibility at the AR/EDA2R Locus and Autosomal Risk Loci
  rationale: >-
    The genetics is mature and the biology behind it is not. No functional
    variant has been identified at the strongest locus twenty years after its
    discovery: the candidates are a polyglycine repeat in AR and a
    non-synonymous EDA2R variant, the two genes are in one linkage block, and
    population and expression data point in different directions. The 20p11
    locus acts without interaction with AR and so must work through something
    other than androgen sensitivity, but through what is unknown. The
    inference the entry makes, that risk alleles raise androgen receptor
    expression in balding scalp, is a proposal in the original association
    paper and has not been shown at the level of a variant. Until it is, the
    first edge of the pathograph rests on association plus a plausible
    mechanism.
  evidence:
  - reference: PMID:18849994
    reference_title: "Susceptibility variants for male-pattern baldness on chromosome 20p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No interaction was detected with the X-chromosomal androgen receptor locus, suggesting that the 20p11 locus has a role in a yet-to-be-identified androgen-independent pathway."
    explanation: A major locus whose pathway is explicitly unidentified.
  - reference: PMID:15902657
    reference_title: "Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The investigation of a large number of genetic variants covering the AR locus suggests that a polyglycine-encoding GGN repeat in exon 1 is a plausible candidate for conferring the functional effect."
    explanation: The functional variant at the strongest locus remains a candidate.
  proposed_experiments:
  - experiment_id: aga_ar_locus_allelic_expression
    name: Allele-specific expression and chromatin accessibility of AR and EDA2R in scalp dermal papilla from risk-haplotype carriers
    description: >-
      In dermal papilla cells from frontal and occipital scalp of carriers and
      non-carriers, measure allele-specific AR and EDA2R expression, map
      accessible regulatory elements across the linkage block, and edit
      candidate variants in immortalized balding dermal papilla lines to test
      which changes receptor level and androgen-induced DKK1, TGFB1 and IL6
      output.
differential_diagnoses:
- name: Telogen effluvium
  description: >-
    Diffuse shedding without patterned miniaturization, often with a
    precipitant three months earlier. Distinguished by a positive pull test
    across the whole scalp, absence of hair-diameter variability, and a normal
    terminal-to-vellus ratio on biopsy. The two commonly coexist in women.
- name: Alopecia areata
  description: >-
    Autoimmune, non-scarring, and typically patchy, with exclamation-mark
    hairs, black dots and yellow dots on trichoscopy and a peribulbar
    lymphocytic infiltrate rather than miniaturization. A diffuse variant can
    mimic the female pattern.
- name: Frontal fibrosing alopecia and lichen planopilaris
  description: >-
    Scarring alopecias in which follicular ostia are lost. Frontal fibrosing
    alopecia recedes the frontal hairline band-like with loss of eyebrows,
    and a pattern-distributed fibrosing variant of lichen planopilaris is the
    main scarring mimic of the female pattern; both need biopsy when
    suspected.
- name: Traction alopecia and trichotillomania
  description: >-
    Mechanical causes with a distribution that follows hairstyle or hand, and
    with broken hairs of varying length in trichotillomania.
- name: Hyperandrogenic disorders in women
  description: >-
    Polycystic ovary syndrome, androgen-secreting tumours and adrenal
    disorders can produce a male-type pattern with hirsutism, acne and
    menstrual disturbance; these signs, not the hair loss itself, prompt
    endocrine testing.

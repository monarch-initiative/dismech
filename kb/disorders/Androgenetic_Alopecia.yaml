    explanation: The listed cardiovascular and renal precautions inform individualized prescribing.
- name: Finasteride
  description: Oral finasteride 1 mg daily inhibits type 2 5-alpha-reductase and is an established option for adult men with mild-to-moderate male-pattern hair loss. In two trials with 1,553 men during year one, target-area differences versus placebo were 107 hairs at one year and 138 at two years; these are between-group differences, not simple gains from baseline. Response may require 6–12 months and ongoing therapy. Counsel about sexual adverse effects and reduced PSA values. The 2025 EMA review confirms suicidal ideation as an adverse effect of finasteride tablets of unknown frequency and advises men taking 1 mg for hair loss to stop and seek advice if mood changes occur. Pregnancy exposure is contraindicated. The negative 1-mg postmenopausal-women trial does not exclude every female dose or subgroup.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: finasteride
      term:
        id: CHEBI:5062
        label: finasteride
  target_mechanisms:
  - target: Local Dihydrotestosterone Production
    treatment_effect: INHIBITS
    description: Blocks type 2 5-alpha-reductase, the enzyme of this node, lowering scalp dihydrotestosterone.
    evidence:
    - reference: PMID:9777765
      reference_title: Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Finasteride, an inhibitor of type II 5alpha-reductase, decreases serum and scalp DHT by inhibiting conversion of testosterone to DHT.
      explanation: The drug acts on exactly the conversion this node describes.
  - target: Follicular Miniaturization
    treatment_effect: INHIBITS
    description: Reduced androgen drive is associated with clinical regrowth and a histologic trend toward less miniaturization; this does not establish restoration of every proposed cellular mechanism.
    evidence:
    - reference: PMID:12573818
      reference_title: Androgens and alopecia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Controlled clinical trials with finasteride demonstrated improvements in scalp hair growth in treated men associated with reductions in scalp DHT content, and a trend towards reversal of scalp hair miniaturization was evident by histopathologic evaluation of scalp biopsies.
      explanation: The review reports a histological trend toward reversal of miniaturization, not uniform restoration of every follicle.
  evidence:
  - reference: PMID:9777765
    reference_title: Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In men with male pattern hair loss, finasteride 1 mg/d slowed the progression of hair loss and increased hair growth in clinical trials over 2 years.
    explanation: The pivotal trial conclusion.
  - reference: PMID:9777765
    reference_title: Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinically significant increases in hair count (baseline = 876 hairs), measured in a 1-inch diameter circular area (5.1 cm2) of balding vertex scalp, were observed with finasteride treatment (107 and 138 hairs vs placebo at 1 and 2 years, respectively; P < .001).
    explanation: The magnitude of the effect on hair counts.
  - reference: PMID:12573818
    reference_title: Androgens and alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast to its beneficial effects in men, finasteride did not improve hair growth in postmenopausal women with FPHL.
    explanation: The 1-mg postmenopausal trial limits generalization of efficacy to that population; it does not refute efficacy in men.

    snippet: Contraindications for the use of LDOM Ongoing other drug therapy with significant oral minoxidil interaction 38 (86.4) 1 History of pericardial effusion/tamponade 36 (81.8) 1 History of pericarditis 32 (72.7) 1 Congestive heart failure 34 (79.1) 2 History of pulmonary hypertension associated with mitral stenosis 33 (76.7) 2 Pheochromocytoma 32 (74.4) 3 Patients who are pregnant or breastfeeding 42 (95.5) 1

- name: Wnt/Beta-Catenin Inhibition and Impaired Progenitor Conversion in Follicular Epithelium
  biological_scale: CELLULAR
  description: >-
    The follicular epithelium receives a growth-inhibitory rather than a
    growth-promoting signal. Dickkopf-1 from the papilla antagonizes canonical
    Wnt signalling and induces apoptosis of outer root sheath keratinocytes;
    androgen-treated dermal papilla cells from patients show reduced
    beta-catenin and activated GSK-3beta and lose the ability to induce hair
    keratin expression in follicle stem cells, which Wnt activation restores.
    The consequence in patients is specific: bald scalp retains its
    KRT15-high bulge stem cells but has lost the CD200-rich and CD34-positive
    progenitor populations that arise from them, so the defect is in
    conversion of stem cell to progenitor rather than in the stem cell itself.
    That is why the follicle is miniaturized rather than destroyed, and why the
    disease is in principle reversible.

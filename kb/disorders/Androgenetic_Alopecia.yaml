    term:
      id: UBERON:0000412
      label: dermal papilla
  evidence:
  - reference: PMID:12213548
    reference_title: "Molecular mechanisms of androgenetic alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Conversion of testosterone to DHT within the dermal papilla plays a central role, while androgen-regulated factors deriving from dermal papilla cells are believed to influence growth of other components of the hair follicle."
    explanation: A mechanistic review placing the conversion in the dermal papilla and upstream of the paracrine output.
  - reference: PMID:12573818
    reference_title: "Androgens and alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Observations in both eunuchs, who have low levels of testicular androgens, and males with genetic 5alpha-reductase (5alphaR) deficiency, who have low levels of dihydrotestosterone (DHT), implicate DHT as a key androgen in the pathogenesis of MPHL in men."
    explanation: The natural experiments that make dihydrotestosterone necessary rather than merely associated.
  - reference: PMID:11231320
    reference_title: "Polymorphism of the androgen receptor gene is associated with male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A balding scalp is characterized by high levels of the potent androgen dihydrotestosterone and increased expression of the androgen receptor gene."
    explanation: Elevated dihydrotestosterone in the target tissue.
  - reference: PMID:16382666
    reference_title: "Role of androgen in mesenchymal epithelial interactions in human hair follicle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These DPC show strong expression of androgen receptors, and the expression of type II 5alpha reductase is restricted to beard and frontal scalp DPC."
    explanation: Type 2 5-alpha-reductase is a property of frontal scalp dermal papilla specifically.

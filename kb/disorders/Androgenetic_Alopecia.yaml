mappings:
  mondo_mappings:
  - term:
      id: MONDO:0007184
      label: alopecia, androgenetic, 1
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: 'MONDO:0007184 is the OMIM locus term for androgenetic alopecia 1 (AGA1), the form of common baldness attributed to the androgen-receptor / EDA2R locus on Xq11-q12. It is not a distinct clinical disease: AGA1 is the X-linked susceptibility component of the same patterned, androgen-dependent hair loss that this entry curates, and the AR/EDA2R locus is the strongest single signal in every genome-wide study of the trait (PMID:15902657, PMID:18385763, PMID:28349362). This entry is therefore broader than the locus term, since it also carries the 20p11 signal and the several hundred autosomal loci, so the mapping is recorded as narrowMatch rather than exactMatch. The stub keyed on MONDO:0007184 is retired by this entry.'

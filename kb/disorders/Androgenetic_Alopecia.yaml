- name: Platelet-rich plasma injection
  description: Autologous platelet-rich plasma scalp injection has shown improved hair-density outcomes in pooled trials, but preparation, activation, injection schedule and outcomes differ. The cited meta-analysis reports a standardized mean difference of 0.51 versus placebo; this is not an absolute hair count. The 2018 S3 guideline could not recommend for or against PRP because of limited evidence and absent standardization, while a 2025 Canadian Delphi panel recommends it. These are different evidence dates and consensus processes. Patient growth-factor mediation and an optimal maintenance schedule remain unresolved.

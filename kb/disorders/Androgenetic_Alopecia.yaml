    snippet: "Androgenetic alopecia (AGA), also known as common baldness, is characterized by a marked decrease in hair follicle size, which could be related to the loss of hair follicle stem or progenitor cells."
    explanation: Follicle size reduction as the defining feature, with the cellular hypothesis that the upstream node tests.
  downstream:
  - target: Patterned non-scarring scalp hair loss
    causal_link_type: DIRECT
    description: >-
      Miniaturized follicles in the susceptible regions produce the visible
      thinning and, with time, baldness.
  - target: Frontotemporal hairline recession and vertex thinning
    causal_link_type: DIRECT
    description: The male distribution of the miniaturized follicles.
  - target: Diffuse central scalp thinning with preserved frontal hairline
    causal_link_type: DIRECT
    description: The female distribution of the miniaturized follicles.
  - target: Fine, short vellus-like scalp hairs
    causal_link_type: DIRECT
    description: The hair a miniaturized follicle produces.
  - target: Hair diameter variability on trichoscopy
    causal_link_type: DIRECT
    description: >-
      Follicles miniaturize asynchronously, so shafts of different calibre sit
      side by side; the sign is miniaturization seen from above.
- name: Perifollicular Microinflammation and Fibrosis
  biological_scale: TISSUE
  description: >-
    In transitional and balding zones the follicular adventitial sheath
    thickens, mast cells degranulate and fibroblasts activate within it, and
    activated T cells infiltrate around the lower infundibulum and the bulge,
    the stem cell niche, with class II antigen induction on adventitial venules.
    A perifollicular lymphohistiocytic infiltrate and fibrosis are also seen in
    women with the female pattern, and in a subset progress to follicular
    drop-out and permanent loss. The finding matters clinically: patients with
    significant inflammation on biopsy regrow less on minoxidil (55 versus 77
    percent). Whether the microinflammation is a cause, a cofactor or a
    consequence of miniaturization is unresolved and is recorded as a
    discussion.
  cell_types:
  - preferred_term: activated T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: perifollicular mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: adventitial sheath fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: hair follicle bulge
    term:
      id: UBERON:0005975
      label: hair follicle bulge
  biological_processes:
  - preferred_term: perifollicular inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: perifollicular sheath fibrosis
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:1390168
    reference_title: "Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemically, control biopsies were devoid of follicular inflammation (n = 3), while transitional regions consistently showed the presence of activated T-cell infiltrates about the lower portions of follicular infundibula."
    explanation: The T-cell infiltrate at the transitional zone, absent in controls.
  - reference: PMID:1390168
    reference_title: "Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding was associated with mast cell degranulation and fibroblast activation within the fibrous sheaths."
    explanation: The mast-cell and fibroblast components of the sheath change.
  - reference: PMID:16382668
    reference_title: "Female pattern hair loss and its relationship to permanent/cicatricial alopecia: a new perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of a perifollicular lymphohistiocytic infiltrate and fibrosis is seen without follicular drop-out in biopsies of women with FPHL and with a notable follicular drop-out in a cicatricial form of this condition (heretofore called cicatricial pattern hair loss) as well as in fibrosing alopecia in a pattern distribution, currently classified as a subset of lichen planopilaris."
    explanation: The same inflammation and fibrosis in the female pattern, and the subset in which it becomes permanent.
  - reference: PMID:8496421
    reference_title: "Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In MPAA with no significant inflammation, regrowth occurred in 77% of cases, versus 55% in cases with significant inflammation."
    explanation: The prognostic weight of inflammation for treatment response.
  - reference: PMID:12213548
    reference_title: "Molecular mechanisms of androgenetic alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the clinical success rate of treatment of AGA with modulators of androgen metabolism or hair growth promoters is limited, sustained microscopic follicular inflammation with connective tissue remodeling, eventually resulting in permanent hair loss, is considered a possible cofactor in the complex etiology of AGA."
    explanation: The status of inflammation as a possible cofactor, which is the claim this node makes and no more.
  downstream:
  - target: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Injury to bulge stem cell epithelium and thickening of the adventitial
      sheath are proposed to impair cycling and add to hair loss; the causal
      direction is proposed, not shown.
    evidence:
    - reference: PMID:1390168
      reference_title: "Characterization of inflammatory infiltrates in male pattern alopecia: implications for pathogenesis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Injury to follicular stem cell epithelium and/or thickening of adventitial sheaths may impair normal pilar cycling and result in hair loss."
      explanation: The authors' proposal of the causal step, indirect because it is inference from histology.
phenotypes:
- name: Patterned non-scarring scalp hair loss
  category: Dermatologic
  description: >-
    The disease itself as a finding: progressive thinning of scalp hair in a
    reproducible pattern, with follicular openings preserved, beginning after
    puberty and advancing at a variable rate over decades. Obligate, since it
    is the definition.
  phenotype_term:
    preferred_term: Androgenetic (patterned) alopecia
    term:
      id: HP:0001596
      label: Alopecia
  frequency: OBLIGATE
  evidence:
  - reference: PMID:12213548
    reference_title: "Molecular mechanisms of androgenetic alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Androgenetic alopecia (AGA) is hereditary and androgen-dependent, progressive thinning of the scalp hair that follows a defined pattern."
    explanation: The defining description; obligate because it is the definition.
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Androgenetic alopecia (AGA), also known as pattern hair loss, is the most common cause of non-scarring alopecia."
    explanation: Non-scarring, and the most common cause of it.
- name: Frontotemporal hairline recession and vertex thinning
  category: Dermatologic
  subtype: Male pattern hair loss
  description: >-
    The male pattern: bitemporal recession of the frontal hairline and a
    thinning vertex that enlarge and merge, graded on the Hamilton-Norwood
    scale toward a retained occipital and parietal horseshoe. About one man
    in eight has a predominantly frontal variant.
  phenotype_term:
    preferred_term: Frontotemporal hairline recession
    term:
      id: HP:0002292
      label: Frontal balding
  evidence:
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Typically, hair thinning in the frontotemporal areas, the recession of the frontotemporal hairline and hair loss in the vertex area occur in male androgenetic alopecia (MAGA)."
    explanation: The male distribution.
  - reference: PMID:30573740
    reference_title: "Dissection of genetic variation and evidence for pleiotropy in male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The balding process is highly patterned, suggesting that MPB progression is induced by some ageing-associated program: from initial frontotemporal hairline recession to a more severe occipital horseshoe stage1."
    explanation: The progression from recession to the horseshoe stage.
  - reference: PMID:9865198
    reference_title: "Prevalence of male pattern hair loss in 18-49 year old men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve percent of the men were classified as having predominantly frontal baldness (type A variants)."
    explanation: Frequency of the frontal-predominant variant in a community sample.
- name: Diffuse central scalp thinning with preserved frontal hairline
  category: Dermatologic
  subtype: Female pattern hair loss
  description: >-
    The female pattern: widening of the central part and diffuse thinning over
    the crown, frontal and parietal scalp with the frontal hairline kept, graded
    on the Ludwig scale. A male-type pattern occurs exceptionally in women.
  phenotype_term:
    preferred_term: Diffuse central scalp thinning (Ludwig pattern)
    term:
      id: HP:0002209
      label: Sparse scalp hair
  evidence:
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In female androgenetic alopecia (FAGA), hair thinning occurs over the frontal and parietal areas of the scalp (Ludwig type)"
    explanation: The female distribution.
  - reference: PMID:921894
    reference_title: "Classification of the types of androgenetic alopecia (common baldness) occurring in the female sex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exceptionally observed male type of androgenetic alopecia can be classified according to Hamilton or to the modification of this classification proposed by Ebling & Rook."
    explanation: The male-type pattern is the exception in women, so the Ludwig pattern is the rule.
- name: Fine, short vellus-like scalp hairs
  category: Dermatologic
  description: >-
    The product of a miniaturized follicle: short, fine, often less pigmented
    hairs replacing terminal hairs in the affected regions. Seen on trichoscopy
    as vellus hairs in about two thirds of patients and on biopsy as a reduced
    terminal-to-vellus ratio.
  phenotype_term:
    preferred_term: Vellus-like miniaturized scalp hair
    term:
      id: HP:0002213
      label: Fine hair
  frequency: FREQUENT
  evidence:
  - reference: PMID:11511857
    reference_title: "Possible mechanisms of miniaturization during androgenetic alopecia or pattern hair loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In androgenetic alopecia, or pattern hair loss, follicles undergo miniaturization, shrinking from terminal to vellus-like hairs."
    explanation: The terminal-to-vellus conversion that produces the fine hair.
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common features identified using trichoscopy included hair diameter variability (94.07% of patients), vellus hairs (66.45%) and the peripilar sign (43.27%)."
    explanation: Vellus hairs in 66.45% of patients across 34 studies, which places the frequency in the FREQUENT band.
- name: Hair diameter variability on trichoscopy
  category: Dermatologic
  description: >-
    Shafts of visibly different calibre side by side, conventionally more than
    20 percent of hairs differing, because follicles miniaturize
    asynchronously. The most consistent trichoscopic sign, present in about 94
    percent of patients, and the sign that makes trichoscopy the confirmatory
    test in women, where the clinical picture is less specific. Accompanied
    by the peripilar sign in about 43 percent. No HPO term describes this
    dermoscopic finding, so it is left unbound.
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common features identified using trichoscopy included hair diameter variability (94.07% of patients), vellus hairs (66.45%) and the peripilar sign (43.27%)."
    explanation: Pooled frequencies, 94.07% for diameter variability, in the VERY_FREQUENT band.
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the majority of male androgenetic alopecia cases, a patient's history and clinical evaluation may be sufficient to establish the diagnosis, while for women, they should be supplemented with trichoscopy."
    explanation: Why the sign matters more in the female pattern.
- name: Insulin resistance and metabolic syndrome association
  category: Metabolic
  description: >-
    A population-level association rather than a feature of the follicle
    disease: men with pattern hair loss have higher odds of metabolic syndrome
    and more of its components, with low HDL cholesterol the strongest single
    component in a Taiwanese community survey; early-onset patients of either
    sex show metabolic syndrome, carotid plaques, and higher insulin and
    aldosterone than controls in a Spanish case-control study; and a
    meta-analysis of 31 studies finds higher insulin resistance and fasting
    insulin and, in men, hypertension. Causality in either direction is not
    established, and shared androgen or genetic factors are the usual
    explanation offered. The association is the reason a metabolic screen is
    sometimes suggested in early-onset disease.
  phenotype_term:
    preferred_term: Insulin resistance (associated)
    term:
      id: HP:0000855
      label: Insulin resistance
  evidence:
  - reference: PMID:41606541
    reference_title: "Risk factors for androgenetic alopecia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A paternal family history of AGA (OR 2.22, 95% CI 1.59–3.10), insulin resistance (standardized mean difference [SMD] 0.40, 95% CI 0.27–0.53), and high fasting insulin levels (SMD 0.48, 95% CI 0.18–0.78) were also identified as factors that increased the risk of the presence of AGA."
    explanation: Pooled insulin resistance and fasting insulin differences.
  - reference: PMID:20426781
    reference_title: "Association of androgenetic alopecia with metabolic syndrome in men: a community-based survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A statistically significant association was found between AGA and the presence of metabolic syndrome [odds ratio (OR) 1.67, 95% confidence interval (CI) 1.01-2.74] as well as between AGA and the number of fulfilled metabolic syndrome components (OR 1.21, 95% CI 1.03-1.42) after controlling for age, family history of AGA and smoking status."
    explanation: The community-based association with metabolic syndrome, adjusted for confounders.
  - reference: PMID:20619491
    reference_title: "Androgenetic alopecia and cardiovascular risk factors in men and women: a comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic syndrome was diagnosed in 60% of male patients with AGA (odds ratio [OR] = 10.5, 95% confidence interval [CI] 3.3-32.5), 48.6% of female patients with AGA (OR = 10.73, 95% CI 2.7-41.2), 12.5% of male control subjects, and 8.1% of female control subjects (P < .0001)."
    explanation: The early-onset case-control finding in both sexes.
  - reference: PMID:41606541
    reference_title: "Risk factors for androgenetic alopecia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertension in men showed a significant correlation with AGA (OR 1.60, 95% CI 1.26–2.04)."
    explanation: The hypertension component of the same association in men.
- name: Hair-loss-related psychosocial distress
  category: Psychiatric
  description: >-
    Distress, body-image concern, anxiety and lowered self-esteem are reported
    in a subset, particularly younger, care-seeking patients, and improving
    hair coverage measurably improves psychosocial perceptions in trial
    populations. The population evidence is deliberately recorded on both
    sides: in an unselected birth cohort of 892 Finnish men examined at 46,
    neither the presence nor the severity of pattern hair loss was associated
    with depression, anxiety, quality of life or self-esteem, so visible
    baldness is not the same as psychiatric morbidity and the distress is
    concentrated in those who present for care. Bound to Anxiety as the
    closest HPO term for the distress reported; no term for hair-loss-specific
    distress exists.
  phenotype_term:
    preferred_term: Hair-loss-related psychosocial distress
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:41606541
    reference_title: "Risk factors for androgenetic alopecia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The appearance of hair loss can impose a significant psychological burden on patients, leading to anxiety, low self-esteem, and severe impairment of personal life and social interaction [2]."
    explanation: The burden as summarized in the introduction of the risk-factor meta-analysis.
  - reference: PMID:12196747
    reference_title: "A randomized clinical trial of 5% topical minoxidil versus 2% topical minoxidil and placebo in the treatment of androgenetic alopecia in men."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, data from a patient questionnaire on quality of life, global benefit, hair growth, and hair styling demonstrated that 5% topical minoxidil helped improve patients' psychosocial perceptions of hair loss."
    explanation: >-
      Treatment improved psychosocial perceptions in a trial population, which
      implies the perceptions were impaired; indirect because it is a
      treatment-response inference.
  - reference: PMID:39192534
    reference_title: "Association between psychosocial distress, sexual disorders, self-esteem and quality of life with male androgenetic alopecia: a population-based study with men at age 46."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant association between the presence of AGA or its severity with depression, anxiety, quality of life, self-esteem or sexual symptoms."
    explanation: >-
      An unselected population cohort finds no association, recorded as REFUTE
      of a general claim that the disease carries psychiatric morbidity; the
      distress is a feature of care-seeking subsets, not of the disease at
      population level.
histopathology:
- name: Reduced terminal-to-vellus hair ratio with fibrous streamers
  description: >-
    On horizontal sections of a 4 mm punch biopsy the diagnosis rests on a
    reduced terminal-to-vellus ratio (about 1.7 to 1 in affected men against
    roughly 7 to 1 in normal scalp; 4 to 1 or below is the threshold used in
    women), increased vellus follicles and fibrous streamers (stelae) marking
    the former depth of miniaturized follicles, often with a raised telogen
    fraction. Horizontal sectioning is required for the counts and is
    diagnostic in about two thirds of cases; the number of follicular
    structures per square millimetre predicts regrowth on minoxidil.
  evidence:
  - reference: PMID:8496421
    reference_title: "Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average horizontal section contained 22 terminal and 13 vellus hairs, a 1.7:1 ratio."
    explanation: The measured terminal-to-vellus ratio in affected men.
  - reference: PMID:8496421
    reference_title: "Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Changes compatible with MPAA were found in most vertical and horizontal sections, but horizontal sections were required for follicular counts and showed terminal:vellus hair ratios diagnostic of MPAA in 67% of cases."
    explanation: Diagnostic yield of horizontal sectioning.
  - reference: PMID:15787815
    reference_title: "Treatment of female pattern hair loss with oral antiandrogens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "80 women aged between 12 and 79 years, with FPHL and biopsy-confirmed hair follicle miniaturization"
    explanation: Biopsy-confirmed miniaturization was the entry criterion in the female series; the source's bracketed threshold (terminal to vellus ratio of 4 to 1 or below) cannot be quoted through the validator's bracket stripping and is described in the prose only.
diagnosis:
- name: Clinical pattern recognition with trichoscopy
  description: >-
    The diagnosis is clinical: a compatible pattern of non-scarring thinning
    with preserved follicular openings, gradual onset, and usually a family
    history. History and examination suffice in most men; in women trichoscopy
    should be added, looking for hair-diameter variability, vellus hairs and
    the peripilar sign, and a horizontal-section scalp biopsy is reserved for
    uncertainty. Laboratory testing is selective, aimed at excluding thyroid
    disease, iron deficiency or, in women with hyperandrogenic features, an
    endocrine disorder, and there is no diagnostic test for the disease itself.
    Genetic testing has no validated diagnostic role.
  evidence:
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We concluded that hair diameter variability, vellus hairs and the peripilar sign represented valuable indicators for the diagnosis of androgenetic alopecia."
    explanation: The trichoscopic criteria from a systematic review of 34 studies.
  - reference: PMID:10882953
    reference_title: "Current understanding of androgenetic alopecia. Part II: clinical aspects and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Only exceptionally laboratory tests or scalp biopsies are needed to confirm the diagnosis."
    explanation: The place of tests and biopsy in diagnosis.
genetic:
- name: Polygenic susceptibility with several hundred common loci
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Genome-wide meta-analyses have moved from two loci (AR/EDA2R and 20p11) to
    six further loci in 2012, twelve by 2013, 63 by 2017 explaining about 39
    percent of variance, more than 250 in UK Biobank in 2017 and 624
    near-independent loci in 2018, of which 26 X-chromosome loci explain 11.6
    percent of SNP heritability. Risk alleles are common, small-effect and
    mostly regulatory; a genotype score from eight loci gives a six-fold risk
    difference between quartiles, and a polygenic predictor discriminates
    severe loss from none with an AUC of 0.78. No ClinVar-style pathogenic
    variant, carrier state or founder allele applies. Named candidate genes at
    autosomal loci include WNT10A (2q35), FGF5, IRF4, DKK2, HDAC9 (7p21.1,
    where TWIST1 is the expression-supported candidate), SSPN (12p12.1) and a
    MAPT-region haplotype at 17q21.31 shared with Parkinson disease.
  evidence:
  - reference: PMID:30573740
    reference_title: "Dissection of genetic variation and evidence for pleiotropy in male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detect 624 near-independent genome-wide loci, contributing SNP-heritability of 0.25 (SE = 0.01), of which 26 X-chromosome loci explain 11.6%."
    explanation: The current count of loci and the share carried by the X chromosome.
  - reference: PMID:22693459
    reference_title: "Six novel susceptibility Loci for early-onset androgenetic alopecia and their unexpected association with common diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals in the highest risk quartile of a genotype score had an approximately six-fold increased risk of early-onset AGA [odds ratio (OR) = 5.78, p = 1.4×10⁻⁸⁸]."
    explanation: The effect of aggregate polygenic risk from the first eight loci.
  - reference: PMID:22693459
    reference_title: "Six novel susceptibility Loci for early-onset androgenetic alopecia and their unexpected association with common diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, we identified a risk allele at 17q21.31 that was recently associated with Parkinson's disease (PD) at a genome-wide significant level."
    explanation: The shared 17q21.31 haplotype behind the reported pleiotropy.
  - reference: PMID:28196072
    reference_title: "Genetic prediction of male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By splitting the cohort into a discovery sample of 40,000 and target sample of 12,000, we developed a prediction algorithm based entirely on common genetic variants that discriminated (AUC = 0.78, sensitivity = 0.74, specificity = 0.69, PPV = 59%, NPV = 82%) those with no hair loss from those with severe hair loss."
    explanation: The polygenic predictor and its accuracy.
  - reference: PMID:27060448
    reference_title: "Differential Expression between Human Dermal Papilla Cells from Balding and Non-Balding Scalps Reveals New Candidate Genes for Androgenetic Alopecia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further, our data suggest TWIST1 (twist family basic helix-loop-helix transcription factor 1) and SSPN (sarcospan) to be the functionally relevant AGA genes at the 7p21.1 and 12p12.1 risk loci, respectively."
    explanation: Expression-based candidate gene assignment at two autosomal loci.
- name: AR
  gene_term:
    preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The androgen receptor gene at Xq12, the first and strongest susceptibility
    locus. Common variants across the locus, including the StuI restriction
    site (rs6152) present in 98 percent of young bald men against 77 percent of
    non-bald men and shorter CAG/GGC repeat haplotypes, mark a functional
    variant that has not been identified; a polyglycine GGN repeat in exon 1 is
    the leading candidate. The etiological fraction for early-onset disease is
    0.46. In a Sardinian isolate the signal conditions onto the neighbouring
    EDA2R, whereas balding dermal papilla expression favours AR, so the locus is
    recorded as AR/EDA2R throughout. Because the gene is X-linked the
    predisposition passes through the maternal line, which is the kernel of
    truth in the folk observation about maternal grandfathers.
  evidence:
  - reference: PMID:15902657
    reference_title: "Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The investigation of a large number of genetic variants covering the AR locus suggests that a polyglycine-encoding GGN repeat in exon 1 is a plausible candidate for conferring the functional effect."
    explanation: The candidate functional variant at the locus.
  - reference: PMID:11231320
    reference_title: "Polymorphism of the androgen receptor gene is associated with male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The androgen receptor gene StuI restriction site was found in all but one (98.1%) of the 54 young bald men (p = 0.0005) and in 92.3% of older balding men (p = 0.000004) but in only 76.6% of nonbald men."
    explanation: The original association at the AR locus.
  - reference: PMID:18385763
    reference_title: "EDA2R is associated with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that the non-synonymous SNP rs1385699 on EDA2R gave the best result (P=3.9e(-19)) whereas rs6152 on the AR gene is less significant (P=4.17e(-12))."
    explanation: >-
      The competing assignment of the X-linked signal to EDA2R, recorded here
      so that the AR entry does not overstate its case.
- name: EDA2R
  gene_term:
    preferred_term: EDA2R
    term:
      id: hgnc:17756
      label: EDA2R
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Ectodysplasin A2 receptor, 8 kb from the best X-chromosome marker in the
    Sardinian genome-wide study and carrying a non-synonymous variant
    (rs1385699) whose association survives conditioning on AR. Listed
    alongside AR rather than instead of it: the two genes sit in one linkage
    block, the balding-papilla expression data favour AR, and the functional
    gene at the locus is not settled.
  evidence:
  - reference: PMID:18385763
    reference_title: "EDA2R is associated with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, we found that rs1352015 located 8 kb from the EDA2R gene showed the best result (P=7.77e(-7))."
    explanation: The lead marker near EDA2R in the genome-wide X-chromosome scan.
  - reference: PMID:27060448
    reference_title: "Differential Expression between Human Dermal Papilla Cells from Balding and Non-Balding Scalps Reveals New Candidate Genes for Androgenetic Alopecia."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We found evidence for AR but not EDA2R as the candidate gene at the AGA risk locus on chromosome X."
    explanation: >-
      Expression in balding papilla cells does not support EDA2R as the
      functional gene; recorded as REFUTE of the functional-gene claim, not of
      the association.
- name: 20p11.22 locus (PAX1/FOXA2 region)
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The second major locus, found independently by two 2008 genome-wide
    studies (rs1160312, rs2180439), replicated in several cohorts and acting
    without interaction with the AR locus, which implies an androgen-independent
    pathway. The interval contains PAX1 and FOXA2 and the abstracts cited do not
    assign the signal to a gene, so no gene_term is bound; PAX1 is the
    commonly named candidate.
  evidence:
  - reference: PMID:18849991
    reference_title: "Male-pattern baldness susceptibility locus at 20p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted a genome-wide association study for androgenic alopecia in 1,125 men and identified a newly associated locus at chromosome 20p11.22, confirmed in three independent cohorts (n = 1,650; OR = 1.60, P = 1.1 x 10(-14) for rs1160312)."
    explanation: Discovery and replication of the locus.
  - reference: PMID:18849994
    reference_title: "Susceptibility variants for male-pattern baldness on chromosome 20p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We then investigated the 30 best SNPs in an independent replication sample and found highly significant association for five SNPs on chromosome 20p11 (rs2180439 combined P = 2.7 x 10(-15))."
    explanation: The simultaneous independent discovery.
- name: WNT10A
  gene_term:
    preferred_term: WNT10A
    term:
      id: hgnc:13829
      label: WNT10A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    An intronic variant (rs7349332) at 2q35 was the strongest of four loci
    confirmed in 2013, with expression in human follicle tissue supporting a
    functional role. It ties the genetics to the Wnt arm of the mechanism, in
    which the androgen-driven papilla suppresses Wnt signalling to the
    epithelium.
  evidence:
  - reference: PMID:23358095
    reference_title: "Androgenetic alopecia: identification of four genetic risk loci and evidence for the contribution of WNT signaling to its etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression studies in human hair follicle tissue suggest that WNT10A has a functional role in AGA etiology."
    explanation: The expression evidence that the locus acts through WNT10A.
environmental:
- name: Tobacco smoking
  description: >-
    Smoking is associated with both the presence and the progression of
    pattern hair loss in a meta-analysis of observational studies, and the
    proposed routes are microvascular injury to the papilla, genotoxic damage,
    protease imbalance, pro-oxidant induction of perifollicular
    microinflammation and fibrosis, and a relative hypo-oestrogenic state. All
    of this is observational and mechanistically inferred; it is curated as an
    exacerbating factor acting on the inflammatory arm, not as a cause.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Perifollicular Microinflammation and Fibrosis
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pro-oxidant effects of smoke are proposed to release pro-inflammatory
      cytokines and drive follicular microinflammation and fibrosis; the
      mechanism is proposed from general smoke biology rather than shown in
      scalp.
    evidence:
    - reference: PMID:12673073
      reference_title: "Association between smoking and hair loss: another opportunity for health education against smoking?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "pro-oxidant effects of smoking leading to the release of pro-inflammatory cytokines resulting in follicular micro-inflammation and fibrosis"
      explanation: The proposed route from smoke to the perifollicular inflammatory node; a review's mechanistic proposal, hence indirect.
  evidence:
  - reference: PMID:41606541
    reference_title: "Risk factors for androgenetic alopecia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family history (presence: odds ratio [OR] 2.72, 95% confidence interval [CI] 1.85–3.99; progression: OR 4.24, 95% CI 2.77–6.49) and smoking (presence: OR 1.46, 95% CI 1.06–2.01; progression: OR 1.60, 95% CI 1.29–1.99) were significantly associated with both presence and progression of AGA."
    explanation: Pooled odds ratios for smoking and presence and progression, alongside family history for scale.
  - reference: PMID:12673073
    reference_title: "Association between smoking and hair loss: another opportunity for health education against smoking?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Smoke-induced premature skin ageing has attracted the attention of the medical community, while only recently an observational study has indicated a significant relationship between smoking and baldness."
    explanation: The observational nature of the association as the review itself states it.
treatments:
- name: Minoxidil (topical; low-dose oral off-label)
  description: >-
    Topical minoxidil 2 to 5 percent is approved for either sex; 5 percent
    solution gave 45 percent more regrowth than 2 percent at 48 weeks in men
    and improved psychosocial perceptions, at the cost of more irritation. It
    acts on the hair cycle rather than on androgen metabolism, shortening
    telogen and prolonging anagen, and its follicular target is not settled;
    the sulphated metabolite opens KATP channels and stimulates vascular
    endothelial growth factor and prostaglandin synthesis in vitro. Response
    requires continuous use and is preceded by transient shedding. Low-dose oral
    minoxidil (about 0.25 to 5 mg daily) is used off-label where topical
    therapy is not tolerated; across 17 studies it was effective and well
    tolerated in healthy patients, with hypertrichosis, oedema and
    cardiovascular effects the concerns needing screening.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: minoxidil
      term:
        id: CHEBI:6942
        label: minoxidil
  target_mechanisms:
  - target: Anagen Shortening and Premature Catagen Entry
    treatment_effect: INHIBITS
    description: >-
      Shortens telogen, pushes resting follicles into anagen and prolongs
      anagen, opposing the cycle re-proportioning of the disease without
      touching the androgen arm upstream.
    evidence:
    - reference: PMID:14996087
      reference_title: "Minoxidil: mechanisms of action on hair growth."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In animal studies, topical minoxidil shortens telogen, causing premature entry of resting hair follicles into anagen, and it probably has a similar action in humans."
      explanation: The hair-cycle action that places the drug on this node.
    - reference: PMID:14996087
      reference_title: "Minoxidil: mechanisms of action on hair growth."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Minoxidil may also cause prolongation of anagen and increases hair follicle size."
      explanation: Anagen prolongation, the direct opposite of the node.
  evidence:
  - reference: PMID:12196747
    reference_title: "A randomized clinical trial of 5% topical minoxidil versus 2% topical minoxidil and placebo in the treatment of androgenetic alopecia in men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In men with AGA, 5% topical minoxidil was clearly superior to 2% topical minoxidil and placebo in increasing hair regrowth, and the magnitude of its effect was marked (45% more hair regrowth than 2% topical minoxidil at week 48)."
    explanation: The randomized trial establishing efficacy and the dose effect.
  - reference: PMID:32622136
    reference_title: "Oral minoxidil treatment for hair loss: A review of efficacy and safety."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral minoxidil was found to be an effective and well-tolerated treatment alternative for healthy patients having difficulty with topical formulations."
    explanation: The off-label oral route, from a review of 17 studies and 634 patients.
  - reference: PMID:14996087
    reference_title: "Minoxidil: mechanisms of action on hair growth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is some evidence that the stimulatory effect of minoxidil on hair growth is also due to the opening of potassium channels by minoxidil sulphate, but this idea has been difficult to prove and to date there has been no clear demonstration that KATP channels are expressed in the hair follicle."
    explanation: The unsettled molecular target, recorded so the mechanism is not overstated.
- name: Finasteride
  description: >-
    Oral finasteride 1 mg daily, a competitive inhibitor of type 2
    5-alpha-reductase, lowers serum and scalp dihydrotestosterone and in two
    one-year trials of 1,553 men slowed hair loss and increased hair counts by
    107 hairs at one year and 138 at two against placebo, with progressive loss
    on placebo. Histology shows a trend to reversal of miniaturization. It is
    the therapy that proves the mechanism. It is approved for men only; it did
    not help postmenopausal women with the female pattern in a controlled
    trial, and it is contraindicated in pregnancy. Sexual adverse effects
    occur in a small minority and persistent sexual and mood symptoms are the
    subject of regulatory warnings.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: finasteride
      term:
        id: CHEBI:5062
        label: finasteride
  target_mechanisms:
  - target: Conversion of Testosterone to Dihydrotestosterone in the Dermal Papilla
    treatment_effect: INHIBITS
    description: >-
      Blocks type 2 5-alpha-reductase, the enzyme of this node, lowering scalp
      dihydrotestosterone.
    evidence:
    - reference: PMID:9777765
      reference_title: "Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Finasteride, an inhibitor of type II 5alpha-reductase, decreases serum and scalp DHT by inhibiting conversion of testosterone to DHT."
      explanation: The drug acts on exactly the conversion this node describes.
  - target: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
    treatment_effect: RESTORES
    description: >-
      Removing the androgen drive lets miniaturized follicles enlarge again,
      seen as reversal of miniaturization on biopsy and as regrowth within a
      cycle.
    evidence:
    - reference: PMID:12573818
      reference_title: "Androgens and alopecia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Controlled clinical trials with finasteride demonstrated improvements in scalp hair growth in treated men associated with reductions in scalp DHT content, and a trend towards reversal of scalp hair miniaturization was evident by histopathologic evaluation of scalp biopsies."
      explanation: Histological reversal of the node's tissue change under treatment.
  evidence:
  - reference: PMID:9777765
    reference_title: "Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In men with male pattern hair loss, finasteride 1 mg/d slowed the progression of hair loss and increased hair growth in clinical trials over 2 years."
    explanation: The pivotal trial conclusion.
  - reference: PMID:9777765
    reference_title: "Finasteride in the treatment of men with androgenetic alopecia. Finasteride Male Pattern Hair Loss Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically significant increases in hair count (baseline = 876 hairs), measured in a 1-inch diameter circular area (5.1 cm2) of balding vertex scalp, were observed with finasteride treatment (107 and 138 hairs vs placebo at 1 and 2 years, respectively; P < .001)."
    explanation: The magnitude of the effect on hair counts.
  - reference: PMID:12573818
    reference_title: "Androgens and alopecia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to its beneficial effects in men, finasteride did not improve hair growth in postmenopausal women with FPHL."
    explanation: >-
      Recorded as REFUTE of efficacy in the female pattern: the drug's failure
      in postmenopausal women is the main evidence that the female subtype may
      not share the androgen mechanism.
- name: Dutasteride
  description: >-
    Oral dutasteride inhibits both type 1 and type 2 5-alpha-reductase. In a
    randomized placebo-controlled trial of 416 men it increased target-area
    hair counts dose-dependently and at 2.5 mg was superior to finasteride 5 mg
    at 12 and 24 weeks, with scalp and serum dihydrotestosterone falling in
    step. Approved for pattern hair loss in Japan and South Korea and used
    off-label elsewhere at 0.5 mg; the adverse-effect profile is that of
    finasteride with the same concern about sexual and mood effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dutasteride
      term:
        id: CHEBI:521033
        label: dutasteride
  target_mechanisms:
  - target: Conversion of Testosterone to Dihydrotestosterone in the Dermal Papilla
    treatment_effect: INHIBITS
    description: >-
      Dual inhibition of type 1 and type 2 5-alpha-reductase, lowering scalp
      dihydrotestosterone further than type-2-selective inhibition.
    evidence:
    - reference: PMID:17110217
      reference_title: "The importance of dual 5alpha-reductase inhibition in the treatment of male pattern hair loss: results of a randomized placebo-controlled study of dutasteride versus finasteride."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Scalp and serum dihydrotestosterone levels decreased, and testosterone levels increased, in a dose-dependent fashion with dutasteride."
      explanation: The pharmacodynamic effect on the node's product.
  evidence:
  - reference: PMID:17110217
    reference_title: "The importance of dual 5alpha-reductase inhibition in the treatment of male pattern hair loss: results of a randomized placebo-controlled study of dutasteride versus finasteride."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dutasteride increased target area hair count versus placebo in a dose-dependent fashion and dutasteride 2.5 mg was superior to finasteride at 12 and 24 weeks."
    explanation: The randomized comparison against placebo and finasteride.
- name: Oral antiandrogens in women (spironolactone, cyproterone acetate)
  description: >-
    Spironolactone 200 mg daily or cyproterone acetate is used off-label in
    women with the female pattern. In an open before-after series of 80 women
    with biopsy-confirmed miniaturization, 44 percent regrew, 44 percent were
    stable and 12 percent continued to lose over at least a year, with no
    difference between the two drugs and no prediction of response by serum
    hormones, ferritin, age or menopausal status. There is no
    placebo-controlled trial, and the authors themselves note that whether the
    female pattern is androgen-driven at all is not established. Reliable
    contraception is required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
  target_mechanisms:
  - target: Dihydrotestosterone-Androgen Receptor Signalling in Dermal Papilla Cells
    treatment_effect: INHIBITS
    description: >-
      Androgen receptor antagonism, the pharmacological rationale for using
      these drugs; the evidence that the node is active in the female pattern
      is weaker than in men.
    evidence:
    - reference: PMID:15787815
      reference_title: "Treatment of female pattern hair loss with oral antiandrogens."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eighty-eight percent of women receiving oral antiandrogens could expect to see no progression of their FPHL or improvement."
      explanation: >-
        Response to receptor antagonism is indirect support that the receptor
        node is active; uncontrolled, so it cannot separate treatment effect
        from natural history.
  evidence:
  - reference: PMID:15787815
    reference_title: "Treatment of female pattern hair loss with oral antiandrogens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-five (44%) women had hair regrowth, 35 (44%) had no clear change in hair density before and after treatment, and 10 (12%) experienced continuing hair loss during the treatment period."
    explanation: The response distribution in the series.
  - reference: PMID:15787815
    reference_title: "Treatment of female pattern hair loss with oral antiandrogens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A placebo-controlled study is required to compare this outcome to the natural history of FPHL."
    explanation: The evidence gap stated by the authors, kept beside the efficacy claim.
- name: Low-level laser therapy (photobiomodulation)
  description: >-
    Home-use laser combs and helmets cleared as devices. In four randomized,
    sham-controlled, double-blind trials of 269 men and women, 26 weeks of
    treatment three times a week increased terminal hair density by about 18
    to 26 hairs per square centimetre over sham, with no serious adverse
    events. The effect is modest, the mechanism in the follicle is not
    established, and the link into the pathograph is therefore recorded as
    modulation of the miniaturization node rather than as a specific action.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: low-level laser (photobiomodulation) therapy
    term:
      id: NCIT:C21063
      label: Photobiomodulation Therapy
  target_mechanisms:
  - target: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
    treatment_effect: MODULATES
    description: >-
      Increases terminal hair density, which is the clinical inverse of
      miniaturization; how light acts on the follicle is not known.
    evidence:
    - reference: PMID:24474647
      reference_title: "Efficacy and safety of a low-level laser device in the treatment of male and female pattern hair loss: a multicenter, randomized, sham device-controlled, double-blind study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To determine whether treatment with a low-level laser device, the US FDA-cleared HairMax Lasercomb®, increases terminal hair density in both men and women with pattern hair loss."
      explanation: The endpoint tested is terminal hair density, the readout of this node.
  evidence:
  - reference: PMID:24474647
    reference_title: "Efficacy and safety of a low-level laser device in the treatment of male and female pattern hair loss: a multicenter, randomized, sham device-controlled, double-blind study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Randomized, sham device-controlled, double-blind clinical trials were conducted at multiple institutional and private practices."
    explanation: The design of the trials supporting the device.
- name: Platelet-rich plasma injection
  description: >-
    Autologous platelet-rich plasma injected into the scalp, usually three
    monthly sessions with maintenance every three to six months. A
    meta-analysis finds a moderate standardized mean difference in hair density
    of about 0.5 against placebo, but preparation, dosing and endpoints vary
    between studies and at least one double-blind split-scalp trial found no
    advantage over placebo. The evidence is weaker than for minoxidil,
    finasteride or the laser trials, and the proposed mechanism, growth-factor
    stimulation of follicular proliferation, is not demonstrated in patients.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: autologous platelet-rich plasma therapy
    term:
      id: NCIT:C177738
      label: Therapeutic Autologous Platelet-rich Plasma
  target_mechanisms:
  - target: Progressive Follicular Miniaturization with Dermal Papilla Shrinkage
    treatment_effect: MODULATES
    description: >-
      Reported to increase hair density; the follicular mechanism is proposed,
      not shown, so the effect is recorded as modulation.
    evidence:
    - reference: PMID:30882509
      reference_title: "Platelet-Rich Plasma as a Treatment for Androgenetic Alopecia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Platelet-rich plasma (PRP) treatment may encourage hair growth by promoting cellular maturation, differentiation, and proliferation."
      explanation: The proposed mechanism, stated as "may" by the meta-analysis itself; indirect.
  evidence:
  - reference: PMID:30882509
    reference_title: "Platelet-Rich Plasma as a Treatment for Androgenetic Alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall SMD in hair density was 0.58 (95% confidence interval [CI]: 0.35-0.80) and 0.51 (95% CI: 0.23-0.80, p < .0004) in favor of PRP treatment when compared with baseline and placebo treatment, respectively."
    explanation: The pooled effect size against baseline and placebo.
- name: Hair transplantation (follicular unit transplantation or extraction)
  description: >-
    Surgical redistribution of follicular units from the androgen-insensitive
    occipital and parietal donor scalp to the balding recipient area, either
    by strip harvest with stereomicroscopic dissection or by follicular unit
    extraction through 1 mm punches, which avoids a linear donor scar. It is
    the only durable structural treatment and works because transplanted
    follicles keep the androgen response of their donor site. Donor supply is
    finite, so it is reserved for stable, sufficiently advanced disease, and
    medical treatment continues to protect the non-transplanted hair.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: hair transplantation
    term:
      id: NCIT:C219973
      label: Hair-Bearing Skin Graft Transplantation
  target_mechanisms:
  - target: Regional Androgen Sensitivity of Frontal and Vertex Scalp Follicles
    treatment_effect: BYPASSES
    description: >-
      Does not change any follicle's androgen sensitivity; it moves follicles
      that lack it into the region where the sensitive ones have miniaturized,
      bypassing the node rather than acting on it.
    evidence:
    - reference: PMID:12174065
      reference_title: "Follicular unit extraction: minimally invasive surgery for hair transplantation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The purpose of this paper is to introduce Follicular Unit Extraction (The FOX Procedure), in which individual follicular units are removed directly from the donor region through very small punch excisions, and to describe a test (The FOX Test) that determines which patients are candidates for this procedure."
      explanation: >-
        Describes the relocation of follicular units from the donor region;
        the donor-site persistence of androgen insensitivity is the premise of
        the procedure rather than a finding of this paper, hence indirect.
  evidence:
  - reference: PMID:16039422
    reference_title: "Follicular unit transplantation: 2005."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The recognition that the follicular unit is a discrete, anatomic and physiologic entity, and that preserving it through stereomicroscopic dissection is the best way to ensure the naturalness of the restoration, has brought hair transplantation into the twenty-first century."
    explanation: The follicular unit principle behind modern transplantation.
  - reference: PMID:16039422
    reference_title: "Follicular unit transplantation: 2005."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The essence of providing the best care for patients rests on proper patient selection, establishing realistic expectations, and using nonsurgical management for young persons who are just starting to thin."
    explanation: Patient selection and the place of medical therapy first.
  - reference: PMID:12174065
    reference_title: "Follicular unit extraction: minimally invasive surgery for hair transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FUE is a minimally invasive approach to hair transplantation that obviates the need for a linear donor incision."
    explanation: The extraction alternative to strip harvest.
animal_models:
- name: Stump-tailed macaque spontaneous androgen-dependent frontal balding
  species: Macaca arctoides
  genotype: Wild type; naturally occurring
  publication: PMID:8977424
  description: >-
    The one animal in which pattern baldness arises spontaneously in a form
    close to the human disease. Frontal scalp follicles regress after puberty
    as serum testosterone and dihydrotestosterone rise, in both sexes; the
    inhibitory effect of testosterone on epithelial proliferation appears only
    with dermal papilla cells from the bald frontal scalp of adults and not
    with cells from hairy occipital scalp or from prebald juveniles, and is
    blocked by the androgen receptor antagonist RU 58841. Six months of oral
    finasteride lowered serum dihydrotestosterone by 60 to 70 percent and
    increased frontal hair weight and follicle length, and topical RU 58841
    regrew frontal hair. It carried much of the preclinical work on
    5-alpha-reductase inhibitors and antiandrogens.
  modeled_mechanisms:
  - target: Regional Androgen Sensitivity of Frontal and Vertex Scalp Follicles
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the frontal-versus-occipital and adult-versus-juvenile
      dependence of the dermal papilla's androgen response.
    limitations: >-
      A non-human primate with a synchronized post-pubertal onset and balding
      in both sexes; the human genetic susceptibility is not represented, and
      cost, ethics and access limit use.
    readouts:
    - name: Testosterone-induced inhibition of outer root sheath cell proliferation in co-culture with frontal bald-scalp dermal papilla cells
      target: Regional Androgen Sensitivity of Frontal and Vertex Scalp Follicles
      direction: INCREASED
      interpretation: >-
        Inhibition occurs only with dermal papilla cells from adult bald
        frontal scalp, reproducing the regional and age dependence of the node.
      evidence:
      - reference: PMID:8977424
        reference_title: "Inhibition of hair growth by testosterone in the presence of dermal papilla cells from the frontal bald scalp of the postpubertal stumptailed macaque."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Testosterone-induced inhibition of outer root sheath cell proliferation occurred only in coculture with dermal papilla cells derived from the bald scalps of adult macaques but not with dermal papilla cells from the hairy occipital scalps of adult macaques or the prebald frontal scalps of juvenile macaques."
        explanation: The measurement that establishes the regional and age dependence in this model.
    evidence:
    - reference: PMID:8977424
      reference_title: "Inhibition of hair growth by testosterone in the presence of dermal papilla cells from the frontal bald scalp of the postpubertal stumptailed macaque."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hair-follicle regression in the bald scalps of stumptailed macaques develops after puberty, which corresponds to an elevation of serum testosterone and dihydrotestosterone."
      explanation: The androgen-timed, region-specific balding that makes the model informative for this node.

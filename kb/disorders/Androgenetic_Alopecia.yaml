    inhibitors are established in balding dermal papilla cells: transforming
    growth factor beta-1, induced by androgen and neutralized by antibody to
    reverse the growth inhibition of co-cultured keratinocytes; dickkopf-1,
    among the most upregulated genes within hours of dihydrotestosterone,
    secreted, and elevated in bald over haired scalp; and interleukin-6,
    induced within hours, secreted, and acting on receptor-bearing matrix
    keratinocytes. Balding dermal papilla cells also under-express
    vasculature-related genes. In beard dermal papilla the same androgen
    induces growth factors including insulin-like growth factor 1, so the
    identity of the secreted factors, not the hormone, sets the direction of

- name: Hair transplantation (follicular unit transplantation or extraction)
  description: Follicular-unit transplantation or extraction redistributes donor hair to affected scalp and can improve coverage in appropriately selected patients. Adequate donor supply, realistic expectations and stable or medically controlled disease are important. Extraction avoids a linear donor incision but is not scar-free, and transplanted coverage does not prevent progression of native susceptible hair. The S3 guideline considers surgery in suitable men and women; combination medical therapy may help preserve non-transplanted hair.

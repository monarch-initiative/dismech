description: Androgenetic alopecia is a common, polygenic disorder of progressive patterned scalp-hair thinning associated with follicular miniaturization. Male-pattern hair loss commonly affects frontotemporal and vertex scalp; female-pattern hair loss commonly causes central thinning with variable frontal accentuation. These distributions overlap between sexes. Local androgen signaling has strong support in male-pattern disease, while the contribution of androgens to female-pattern disease varies and remains incompletely resolved. Clinical severity, rate of change and psychosocial impact differ substantially between individuals.
notes: 'Scope: male- and female-pattern presentations overlap clinically, and this entry does not assume identical androgen dependence in all women. Polygenic susceptibility is not Mendelian maternal inheritance. Clinical metabolic and anxiety associations are retained without invented causal edges. Trichoscopic diameter variation and the peripilar sign remain unbound because no sufficiently specific HPO term was identified; their heterogeneous study percentages are not disease-level frequency bands.

  Evidence review consumed the actual matching Falcon report, all original cached abstracts, available full scientific bodies and source-specific independent audits. Primary experimental compartments, denominators and endpoint definitions take precedence over the report''s mechanistic extrapolations. The StatPearls chapter NBK430924 was mined for diagnosis, differentials, prognosis and care; its erroneous potassium-channel-blocker wording and categorical comorbidity claims were not adopted. No applicable GeneReviews chapter was found for this common polygenic disorder.

  The generated URL references retain their cache titles. They provide full bodies for the diagnostic S1 guideline (DOI 10.1111/j.1365-2133.2010.10011.x), treatment S3 guideline (PMID 29178529), low-dose oral minoxidil Delphi statement (PMID 39565602), oral-versus-topical minoxidil trial (PMID 38598226), Goren sulfotransferase study (DOI 10.1111/dth.12164), StatPearls chapter (PMID 28613674), and the 2025 EMA finasteride/dutasteride safety review. Canonical abstract-only duplicates are not needed to support their full-body claims. Some older mechanism studies remain abstract-limited despite sanctioned regeneration, and their unreported assay detail is not inferred.

  No conserved module conformance is asserted for regional androgen-dependent follicular miniaturization. The cultured senescence finding does not by itself establish the organismal aging module. Distinct scarring alopecias are differential diagnoses, not inevitable AGA progression.

  ClinicalTrials.gov APIv2 status and planned enrollment were checked on 2026-09-21 for all seven listed registrations. None had posted results; registered aims do not establish efficacy.'
inheritance:
- name: Polygenic Inheritance
  description: A polygenic, sex-limited, age-dependent trait rather than a Mendelian disease. Twin studies put the heritability of male pattern baldness near 0.8, pedigree heritability in UK Biobank is 0.62, and several hundred genome-wide significant loci are known. The classic observation that baldness follows the maternal line reflects the strongest single signal, which lies at the androgen receptor / EDA2R locus on the X chromosome and is therefore inherited from the mother; but the X-linked locus accounts for only a minority of the heritable variance and the 20p11 locus and hundreds of autosomal loci are inherited from either parent, so the mode of inheritance is recorded as polygenic, not X-linked.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:30573740
    reference_title: Dissection of genetic variation and evidence for pleiotropy in male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we show that MPB is strongly heritable and polygenic, with pedigree-heritability of 0.62 (SE = 0.03) estimated from close relatives, and SNP-heritability of 0.39 (SE = 0.01) from conventionally-unrelated males.
    explanation: The largest single-cohort analysis states the polygenic architecture directly and quantifies heritability from relatives and from SNPs.
  - reference: PMID:30573740
    reference_title: Dissection of genetic variation and evidence for pleiotropy in male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Early twin studies estimated the narrow-sense heritability (h2) on a scale of liability to be 0.817 (95%CI: 0.77–0.85).'
    explanation: The twin heritability of about 0.8 that the description cites, quoted from the introduction of the same paper because the original twin study (Nyholt 2003, PMID:14675213) has no abstract in PubMed.
  - reference: PMID:15902657
    reference_title: Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The X-chromosomal location of AR stresses the importance of the maternal line in the inheritance of AGA.
    explanation: 'Gives the reason for the classic maternal-line observation without making the trait X-linked: the strongest locus is on the X chromosome.'
  - reference: PMID:28349362
    reference_title: 'Androgenetic alopecia: a review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A number of genes determine the predisposition for androgenetic alopecia in a polygenic fashion.
    explanation: A systematic review's summary statement of the polygenic mode.
has_subtypes:
- name: Male pattern hair loss
  display_name: Male pattern hair loss (Hamilton-Norwood pattern)
  subtype_term:
    preferred_term: Male pattern baldness
    term:
      id: MONDO:0800201
      label: baldness, male pattern
  description: Frontotemporal recession and vertex thinning commonly occur in men and are graded with the Hamilton-Norwood scale. The androgen mechanism and evidence for 5-alpha-reductase inhibition are strongest in this presentation. Pattern labels describe distribution rather than excluding a similar pattern in another sex.
  evidence:
  - reference: PMID:1188424
    reference_title: 'Male pattern baldness: classification and incidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This report establishes such a classification, and reports its use in determining the incidence of male pattern baldness at various ages in 1,000 white adult male subjects.
    explanation: The Norwood classification and its incidence survey.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Typically, hair thinning in the frontotemporal areas, the recession of the frontotemporal hairline and hair loss in the vertex area occur in male androgenetic alopecia (MAGA).
    explanation: States the distribution that defines the male pattern.
    quote_role: REVIEW_SYNTHESIS
- name: Female pattern hair loss
  display_name: Female pattern hair loss (Ludwig / Sinclair pattern)
  description: Central and crown thinning with widening of the part commonly occurs in women, including Ludwig-type diffuse thinning, frontal accentuation and less often Hamilton-type recession. The frontal hairline is often preserved but this is not universal. Most affected women have normal circulating androgen concentrations. The degree of androgen dependence is heterogeneous; a null 1-mg finasteride trial in postmenopausal women does not settle all doses or populations, and a small placebo-controlled spironolactone add-on trial is now available.
  evidence:
  - reference: PMID:921894
    reference_title: Classification of the types of androgenetic alopecia (common baldness) occurring in the female sex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To facilitate an early diagnosis (desirable in view of the therapeutic possibilities by means of antiandrogens) a classification of the stages of the common form (female type) of androgenetic alopecia in women is presented.
    explanation: The Ludwig classification that defines the female pattern.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16382668
    reference_title: 'Female pattern hair loss and its relationship to permanent/cicatricial alopecia: a new perspective.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Female pattern hair loss (FPHL) is a common hair disorder of the central scalp.
    explanation: Locates the female pattern on the central scalp.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:11231244
    reference_title: Incidence of female androgenetic alopecia (female pattern alopecia).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Female androgenetic alopecia is quite common beginning in the late 20s and reaching its peak after 50 years of age.
    explanation: Age distribution from a survey of 1,006 Caucasian women.
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Polygenic Susceptibility
  biological_scale: MOLECULAR
  description: Common variants at the AR/EDA2R region and many autosomal loci are associated with male-pattern hair loss. The largest cited study analyzes self-reported severity in European men, and its conditional analysis ultimately retains 622 association signals. Candidate-gene mapping and pathway enrichment do not establish the molecular action of each allele, and male cohorts do not establish an identical architecture for female-pattern hair loss. The AR locus motivates an androgen-response hypothesis; other susceptibility routes remain unresolved.
  evidence:
  - reference: PMID:28272467
    reference_title: Meta-analysis identifies novel risk loci and yields systematic insights into the biology of male-pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The 63 loci explain ∼39% of the phenotypic variance in MPB and highlight several plausible candidate genes (FGF5, IRF4, DKK2) and pathways (melatonin signalling, adipogenesis) that are likely to be implicated in the key-pathophysiological features of MPB and may represent promising targets for the development of novel therapeutic options.
    explanation: The European early-onset case-control meta-analysis identifies susceptibility loci; its reported variance is a binary regression estimate, not universal penetrance.
  - reference: PMID:30573740
    reference_title: Dissection of genetic variation and evidence for pleiotropy in male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Ultimately, the net product was 622 loci: 598 autosomal and 24 on the X-chromosome'
    explanation: The final conditional signal set is statistical and does not identify 622 experimentally established causal genes.

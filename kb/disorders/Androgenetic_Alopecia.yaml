- name: Anagen Shortening and Premature Catagen Entry
  biological_scale: TISSUE
  description: >-
    The hair cycle of an affected follicle is re-proportioned: anagen shortens
    with each cycle, catagen arrives early, and telogen and the empty kenogen
    interval between shedding and regrowth lengthen, so a growing proportion
    of follicles are resting or empty at any moment and the hair that does
    grow has less time to lengthen. Interleukin-6 and prostaglandin D2 both
    promote regression directly. Minoxidil acts here, shortening telogen and
    prolonging anagen, which is how a drug with no effect on androgen
    metabolism regrows hair.

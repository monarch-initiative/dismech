- name: Microneedling adjunct to topical minoxidil
  description: Scalp microneedling is used as an adjunct to topical therapy. A 12-week pilot randomized 100 men to weekly 1.5-mm microneedling plus 5% minoxidil or minoxidil alone; 94 were analyzed, with all six early dropouts in the minoxidil-only arm. Hair-count gains were 91.4 versus 22.2 per cm², but patient-reported improvement was unblinded and long-term durability was not established. The study did not measure patient Wnt activation or stem-cell conversion. Later consensus recommendations exist, so it is not accurately described as a single unreplicated intervention.

- name: Regional Androgen Receptor Abundance
  biological_scale: MOLECULAR
  description: Frontal follicles contained more androgen receptor than occipital follicles in a small paired study, with lower frontal abundance in women than men. Cultured dermal papilla cells from balding scalp also had higher receptor binding capacity than non-balding cells. These observations support regional sensitivity but do not prove a universal explanation of sex-specific patterns. Receptor localization is preparation-dependent; the evidence does not justify excluding androgen receptors from all follicular epithelium.
  evidence:
  - reference: PMID:9284093
    reference_title: Different levels of 5alpha-reductase type I and II, aromatase, and androgen receptor in hair follicles of women and men with androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Findings revealed that both women and men have higher levels of receptors and 5alpha-reductase type I and II in frontal hair follices than in occipital follicles, whereas higher levels of aromatase were found in their occipital follicles.
    explanation: Paired frontal/occipital follicle measurements in 12 women and 12 men establish regional abundance differences, not receptor absence elsewhere.
  - reference: PMID:9496234
    reference_title: Balding hair follicle dermal papilla cells contain higher levels of androgen receptors than those from non-balding scalp.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Balding cells contained significantly (P < 0.01) greater levels of androgen receptors (Bmax = 0.06 +/- 0.01 fmol/10(4) cells (mean +/- S.E.M.)) than those from non-balding scalp (0.04 +/- 0.001).
    explanation: Cultured dermal papilla cells retain androgen binding at both sites, with greater binding capacity in balding-derived cells.

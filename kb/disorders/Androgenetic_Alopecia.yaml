- name: Low-level laser therapy (photobiomodulation)
  description: Specific low-level laser devices can increase terminal hair density. Four sham-controlled trials randomized 269 adults, with 225 having at least one post-randomization efficacy assessment. At 26 weeks, the pooled adjusted between-group difference was 15.27 hairs/cm²; reported 18–26-hair gains were within active-treatment groups, not the difference versus sham. Participants were predominantly Caucasian, and long-term durability and the optimal device regimen remain uncertain. The S3 guideline suggests LLLT as ancillary care using devices with trial-supported energy settings.

phenotypes:
- name: Patterned non-scarring scalp hair loss
  category: Dermatologic
  description: Progressive patterned thinning or loss of terminal scalp hair with preserved follicular openings. This is the defining clinical finding. Onset is usually after puberty, and the course varies between individuals; rapid diffuse shedding or loss of ostia warrants assessment for another or coexisting disorder.
  phenotype_term:
    preferred_term: Androgenetic (patterned) alopecia
    term:
      id: HP:0001596
      label: Alopecia
  frequency: OBLIGATE
  evidence:
  - reference: PMID:12213548
    reference_title: Molecular mechanisms of androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Androgenetic alopecia (AGA) is hereditary and androgen-dependent, progressive thinning of the scalp hair that follows a defined pattern.
    explanation: The defining description; obligate because it is the definition.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Androgenetic alopecia (AGA), also known as pattern hair loss, is the most common cause of non-scarring alopecia.
    explanation: Non-scarring, and the most common cause of it.
    quote_role: REVIEW_SYNTHESIS
- name: Frontotemporal hairline recession and vertex thinning
  category: Dermatologic
  subtype: Male pattern hair loss
  description: Frontotemporal recession and vertex thinning may enlarge and merge in a Hamilton-Norwood distribution. In a US community survey, the predominantly frontal variant was reported in 12% of all examined men, not 12% of AGA cases. The pattern is common in male presentations but is not exclusive to men.
  phenotype_term:
    preferred_term: Frontotemporal hairline recession
    term:
      id: HP:0002292
      label: Frontal balding
  evidence:
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Typically, hair thinning in the frontotemporal areas, the recession of the frontotemporal hairline and hair loss in the vertex area occur in male androgenetic alopecia (MAGA).
    explanation: The male distribution.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30573740
    reference_title: Dissection of genetic variation and evidence for pleiotropy in male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The balding process is highly patterned, suggesting that MPB progression is induced by some ageing-associated program: from initial frontotemporal hairline recession to a more severe occipital horseshoe stage1.'
    explanation: The progression from recession to the horseshoe stage.
    quote_role: PRIMARY_RESULT
  - reference: PMID:9865198
    reference_title: Prevalence of male pattern hair loss in 18-49 year old men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Twelve percent of the men were classified as having predominantly frontal baldness (type A variants).
    explanation: Frequency of the frontal-predominant variant in a community sample.
    quote_role: PRIMARY_RESULT
- name: Diffuse central scalp thinning with preserved frontal hairline
  category: Dermatologic
  subtype: Female pattern hair loss
  description: Widening of the central part and thinning over the crown characterize the Ludwig-type presentation, often with preservation of the frontal hairline. Female-pattern disease also includes frontal accentuation and less often a Hamilton-type pattern, so this finding is not obligatory in every affected woman.
  phenotype_term:
    preferred_term: Diffuse central scalp thinning (Ludwig pattern)
    term:
      id: HP:0002209
      label: Sparse scalp hair
  evidence:
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In female androgenetic alopecia (FAGA), hair thinning occurs over the frontal and parietal areas of the scalp (Ludwig type)
    explanation: The female distribution.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:921894
    reference_title: Classification of the types of androgenetic alopecia (common baldness) occurring in the female sex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The exceptionally observed male type of androgenetic alopecia can be classified according to Hamilton or to the modification of this classification proposed by Ebling & Rook.
    explanation: The male-type pattern is the exception in women, so the Ludwig pattern is the rule.
    quote_role: PRIMARY_RESULT
- name: Fine, short vellus-like scalp hairs
  category: Dermatologic
  description: Fine, short, vellus-like hairs arise in affected scalp as follicles miniaturize. A trichoscopy review reports a pooled vellus-hair frequency of 66.45% from 13 studies with 775 assessed patients, with heterogeneous detection methods. This is a study summary rather than a universal disease frequency, and vellus hairs also occur in normal scalp and other alopecias.
  phenotype_term:
    preferred_term: Vellus-like miniaturized scalp hair
    term:
      id: HP:0002213
      label: Fine hair
  evidence:
  - reference: PMID:11511857
    reference_title: Possible mechanisms of miniaturization during androgenetic alopecia or pattern hair loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In androgenetic alopecia, or pattern hair loss, follicles undergo miniaturization, shrinking from terminal to vellus-like hairs.
    explanation: The terminal-to-vellus conversion that produces the fine hair.
    quote_role: PRIMARY_RESULT
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common features identified using trichoscopy included hair diameter variability (94.07% of patients), vellus hairs (66.45%) and the peripilar sign (43.27%).
    explanation: Vellus hairs in 66.45% of patients across 34 studies, which places the frequency in the FREQUENT band.
    quote_role: REVIEW_SYNTHESIS
- name: Hair diameter variability on trichoscopy
  category: Dermatologic
  description: Variation in shaft caliber is a useful trichoscopic clue to mixed terminal and miniaturized follicles. A 34-study review reports diameter variability in 94.07% of assessed AGA samples, but study thresholds, scalp areas, magnification and case/control selection differed. Some studies used greater than 20% variation in men or greater than 10% in women; no single threshold is established for every setting. No sufficiently specific HPO term was identified for this dermoscopic sign.
  evidence:
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common features identified using trichoscopy included hair diameter variability (94.07% of patients), vellus hairs (66.45%) and the peripilar sign (43.27%).
    explanation: Pooled frequencies, 94.07% for diameter variability, in the VERY_FREQUENT band.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the majority of male androgenetic alopecia cases, a patient's history and clinical evaluation may be sufficient to establish the diagnosis, while for women, they should be supplemented with trichoscopy.
    explanation: Why the sign matters more in the female pattern.
    quote_role: REVIEW_SYNTHESIS
- name: Peripilar sign on trichoscopy
  category: Dermatologic
  description: A brown perifollicular halo is associated with superficial perifollicular inflammation. A trichoscopy review summarizes its presence in 43.27% across 24 studies, with substantial variation in detection and heterogeneous controls. It is neither obligatory nor an individually definitive inflammatory or diagnostic test. No sufficiently specific HPO term was identified for this dermoscopic sign.
  evidence:
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common features identified using trichoscopy included hair diameter variability (94.07% of patients), vellus hairs (66.45%) and the peripilar sign (43.27%).
    explanation: Pooled frequency of 43.27%, in the FREQUENT band.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The peripilar sign was more common in men (63.67%) than women (42.53%) (Table 1). The analysis showed that the calculated specificity was the highest among all the features (96.06%).
    explanation: The sex difference and the specificity that makes the sign diagnostically useful.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A conspicuous brown halo, also known as the peripilar sign, indicates perifollicular inflammation
    explanation: What the sign is and what it is taken to reflect, tying it to the microinflammation node.
    quote_role: REVIEW_SYNTHESIS
- name: Insulin resistance (associated)
  category: Metabolic
  description: Observational studies report higher insulin resistance and fasting insulin in some AGA populations. The 2026 meta-analysis pools cross-sectional or case-control associations, not longitudinal incident disease. Metabolic-syndrome associations in a Taiwanese survey and a selected Spanish early-onset case-control series vary by ascertainment. These findings do not prove that AGA causes insulin resistance or establish universal metabolic screening solely because of hair loss.
  phenotype_term:
    preferred_term: Insulin resistance (associated)
    term:
      id: HP:0000855
      label: Insulin resistance
  evidence:
  - reference: PMID:41606541
    reference_title: 'Risk factors for androgenetic alopecia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A paternal family history of AGA (OR 2.22, 95% CI 1.59–3.10), insulin resistance (standardized mean difference [SMD] 0.40, 95% CI 0.27–0.53), and high fasting insulin levels (SMD 0.48, 95% CI 0.18–0.78) were also identified as factors that increased the risk of the presence of AGA.
    explanation: Pooled insulin resistance and fasting insulin differences.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20426781
    reference_title: 'Association of androgenetic alopecia with metabolic syndrome in men: a community-based survey.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A statistically significant association was found between AGA and the presence of metabolic syndrome [odds ratio (OR) 1.67, 95% confidence interval (CI) 1.01-2.74] as well as between AGA and the number of fulfilled metabolic syndrome components (OR 1.21, 95% CI 1.03-1.42) after controlling for age, family history of AGA and smoking status.
    explanation: The community-based association with metabolic syndrome, adjusted for confounders.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20619491
    reference_title: 'Androgenetic alopecia and cardiovascular risk factors in men and women: a comparative study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Metabolic syndrome was diagnosed in 60% of male patients with AGA (odds ratio [OR] = 10.5, 95% confidence interval [CI] 3.3-32.5), 48.6% of female patients with AGA (OR = 10.73, 95% CI 2.7-41.2), 12.5% of male control subjects, and 8.1% of female control subjects (P < .0001).
    explanation: The early-onset case-control finding in both sexes.
    quote_role: PRIMARY_RESULT
- name: Anxiety associated with hair loss
  category: Psychiatric
  description: Anxiety, body-image concerns and distress can accompany hair loss in some patients. However, among 892 examined men aged approximately 46 in the Oulu-area Northern Finland birth-cohort follow-up, AGA presence and severity were not significantly associated with measured anxiety or other psychosocial outcomes. This age- and sex-specific null finding does not exclude distress in individuals or other populations and does not prove that distress occurs only in care-seeking patients.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:41606541
    reference_title: 'Risk factors for androgenetic alopecia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The appearance of hair loss can impose a significant psychological burden on patients, leading to anxiety, low self-esteem, and severe impairment of personal life and social interaction [2].
    explanation: The introduction summarizes reported human psychosocial burden rather than a newly measured outcome in this meta-analysis.
    quote_role: BACKGROUND
  - reference: PMID:12196747
    reference_title: A randomized clinical trial of 5% topical minoxidil versus 2% topical minoxidil and placebo in the treatment of androgenetic alopecia in men.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Additionally, data from a patient questionnaire on quality of life, global benefit, hair growth, and hair styling demonstrated that 5% topical minoxidil helped improve patients' psychosocial perceptions of hair loss.
    explanation: Treatment improved psychosocial perceptions in a trial population, which implies the perceptions were impaired; indirect because it is a treatment-response inference.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39192534
    reference_title: 'Association between psychosocial distress, sexual disorders, self-esteem and quality of life with male androgenetic alopecia: a population-based study with men at age 46.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no significant association between the presence of AGA or its severity with depression, anxiety, quality of life, self-esteem or sexual symptoms.
    explanation: The selected birth-cohort follow-up did not find an association at this age; this qualifies generalization rather than refuting distress in every patient.
    quote_role: PRIMARY_RESULT
histopathology:
- name: Reduced terminal-to-vellus hair ratio with fibrous streamers
  description: Horizontal sections permit terminal and vellus follicle counts and show miniaturization with increased fibrous streamers. In a series of 106 male-pattern cases and 22 controls, the affected-sample average terminal-to-vellus ratio was 1.7:1, and horizontal counts met the study diagnostic ratio in 67% of cases. These are study-specific observations, not universal diagnostic sensitivity. The diagnostic S1 guideline recommends considering both horizontal and vertical sections when biopsy is required, particularly to distinguish scarring or diffuse inflammatory disorders.
  evidence:
  - reference: PMID:8496421
    reference_title: Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The average horizontal section contained 22 terminal and 13 vellus hairs, a 1.7:1 ratio.
    explanation: The measured terminal-to-vellus ratio in affected men.
    quote_role: PRIMARY_RESULT
  - reference: PMID:8496421
    reference_title: Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Changes compatible with MPAA were found in most vertical and horizontal sections, but horizontal sections were required for follicular counts and showed terminal:vellus hair ratios diagnostic of MPAA in 67% of cases.
    explanation: Diagnostic yield of horizontal sectioning.
    quote_role: PRIMARY_RESULT
  - reference: PMID:15787815
    reference_title: Treatment of female pattern hair loss with oral antiandrogens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 80 women aged between 12 and 79 years, with FPHL and biopsy-confirmed hair follicle miniaturization
    explanation: Biopsy-confirmed miniaturization was the entry criterion in the female series; the source's bracketed threshold (terminal to vellus ratio of 4 to 1 or below) cannot be quoted through the validator's bracket stripping and is described in the prose only.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Clinical pattern recognition with trichoscopy
  description: Diagnosis is usually clinical, based on gradual patterned nonscarring thinning and examination of the scalp. A negative family history does not exclude it. Trichoscopy can support the diagnosis and distinguish other alopecias, but heterogeneous research estimates do not establish a universal diagnostic cutoff. Follicular ostial loss, marked inflammation, rapid shedding or atypical distribution prompt assessment for an alternative or coexisting condition.
  evidence:
  - reference: PMID:38610726
    reference_title: 'Trichoscopy of Androgenetic Alopecia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We concluded that hair diameter variability, vellus hairs and the peripilar sign represented valuable indicators for the diagnosis of androgenetic alopecia.
    explanation: The trichoscopic criteria from a systematic review of 34 studies.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:10882953
    reference_title: 'Current understanding of androgenetic alopecia. Part II: clinical aspects and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only exceptionally laboratory tests or scalp biopsies are needed to confirm the diagnosis.
    explanation: The place of tests and biopsy in diagnosis.
    quote_role: REVIEW_SYNTHESIS
- name: Selective laboratory and endocrine evaluation
  description: Testing is guided by history and examination rather than a routine hormonal panel for every patient. Ferritin or thyroid evaluation may be appropriate with diffuse shedding or relevant symptoms. Women with hirsutism, acne, menstrual disturbance or other androgen-excess features may need endocrine assessment; unusually early onset warrants pediatric or endocrine evaluation.
  evidence:
  - reference: url:https://bhns.org.uk/ccs_files/web_data/Resources/Guidelines/european%20S1%20AGA%20guidelien.pdf
    reference_title: https://bhns.org.uk/ccs_files/web_data/Resources/Guidelines/european%20S1%20AGA%20guidelien.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Measurement of ferritin level or thyroid-stimulating hormone may be considered depending on the individual history, espe- cially in diffuse efﬂuvium.
    explanation: The S1 document provides expert diagnostic guidance rather than a validated screening algorithm.
- name: Scalp biopsy when the diagnosis is uncertain
  description: Biopsy is reserved for diagnostic uncertainty, particularly diffuse alopecia areata or suspected scarring alopecia. Horizontal sections quantify follicular populations; vertical sections provide complementary inflammatory and scarring information. Cohort-specific terminal-to-vellus ratios are interpreted with the clinical pattern rather than used as a universal stand-alone test.
  evidence:
  - reference: PMID:10882953
    reference_title: 'Current understanding of androgenetic alopecia. Part II: clinical aspects and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Only exceptionally laboratory tests or scalp biopsies are needed to confirm the diagnosis.
    explanation: The clinical review reserves laboratory investigations and biopsy for selected diagnostic circumstances.
  - reference: PMID:8496421
    reference_title: Diagnostic and predictive value of horizontal sections of scalp biopsy specimens in male pattern androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Changes compatible with MPAA were found in most vertical and horizontal sections, but horizontal sections were required for follicular counts and showed terminal:vellus hair ratios diagnostic of MPAA in 67% of cases.
    explanation: Horizontal follicle counts were useful in this selected biopsy series, without establishing population-level sensitivity.
genetic:
- name: Polygenic susceptibility with several hundred common loci
  relationship_type: SUSCEPTIBILITY
  notes: European male cohorts identify many common susceptibility signals. The 2017 eight-cohort early-onset meta-analysis included 10,846 cases and 11,672 controls and identified 63 loci; its approximately 39% value is binary case/control regression R-squared, not universal liability heritability. The 2018 UK Biobank analysis used self-reported severity in 205,327 European men aged 40–73. COJO selected 624 signals, with 622 retained after further X-chromosome LD pruning. The selected X variants explained 0.029 of phenotype-score variance, or 11.6% of the selected-SNP total 0.252, not 11.6% of all phenotypic variance. Cohorts and locus definitions overlap across reports and counts must not be added. Candidate-gene and pathway nominations do not establish causal mediation or clinical utility of polygenic testing. The 2017 52,874-man White British prediction study used an internal 40,000-person discovery subset and a 12,874-person target subset; its AUC 0.78 contrasts no-loss and severe-loss extremes, with the threshold selected in that same target set. It is not external prospective prediction, and predictive values depend on the selected comparison. The earlier eight-locus score OR
    5.78 comes from an independent extreme case-control comparison, not absolute lifetime risk.
  evidence:
  - reference: PMID:30573740
    reference_title: Dissection of genetic variation and evidence for pleiotropy in male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We detect 624 near-independent genome-wide loci, contributing SNP-heritability of 0.25 (SE = 0.01), of which 26 X-chromosome loci explain 11.6%.
    explanation: The abstract reports the initial 624 COJO signals; the full body removes two residual-LD X signals, and 11.6% uses selected-SNP variance as denominator.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22693459
    reference_title: Six novel susceptibility Loci for early-onset androgenetic alopecia and their unexpected association with common diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals in the highest risk quartile of a genotype score had an approximately six-fold increased risk of early-onset AGA [odds ratio (OR) = 5.78, p = 1.4×10⁻⁸⁸].
    explanation: The top-versus-bottom quartile odds ratio is from an extreme case-control validation sample, not sixfold absolute population risk.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22693459
    reference_title: Six novel susceptibility Loci for early-onset androgenetic alopecia and their unexpected association with common diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unexpectedly, we identified a risk allele at 17q21.31 that was recently associated with Parkinson's disease (PD) at a genome-wide significant level.
    explanation: The shared 17q21.31 haplotype behind the reported pleiotropy.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28196072
    reference_title: Genetic prediction of male pattern baldness.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: By splitting the cohort into a discovery sample of 40,000 and target sample of 12,000, we developed a prediction algorithm based entirely on common genetic variants that discriminated (AUC = 0.78, sensitivity = 0.74, specificity = 0.69, PPV = 59%, NPV = 82%) those with no hair loss from those with severe hair loss.
    explanation: Internal holdout discrimination of severity extremes does not establish external prospective clinical utility; the abstract rounds the target sample size.
    quote_role: PRIMARY_RESULT
  - reference: PMID:27060448
    reference_title: Differential Expression between Human Dermal Papilla Cells from Balding and Non-Balding Scalps Reveals New Candidate Genes for Androgenetic Alopecia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Further, our data suggest TWIST1 (twist family basic helix-loop-helix transcription factor 1) and SSPN (sarcospan) to be the functionally relevant AGA genes at the 7p21.1 and 12p12.1 risk loci, respectively.
    explanation: Expression-based candidate gene assignment at two autosomal loci.
    quote_role: PRIMARY_RESULT
- name: AR
  gene_term:
    preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: The AR/EDA2R interval is a strong common-variant susceptibility region. AR marker and repeat associations in early-onset male cohorts, including the study-specific etiological fraction of 0.46, do not establish a single causal repeat or pathogenic Mendelian allele. Regulatory effects on receptor abundance are plausible but not demonstrated for every risk haplotype. The X-linked signal does not make the entire polygenic disorder maternally inherited; autosomal susceptibility is substantial.
  evidence:
  - reference: PMID:15902657
    reference_title: Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The investigation of a large number of genetic variants covering the AR locus suggests that a polyglycine-encoding GGN repeat in exon 1 is a plausible candidate for conferring the functional effect.
    explanation: The candidate functional variant at the locus.
    quote_role: PRIMARY_RESULT
  - reference: PMID:11231320
    reference_title: Polymorphism of the androgen receptor gene is associated with male pattern baldness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The androgen receptor gene StuI restriction site was found in all but one (98.1%) of the 54 young bald men (p = 0.0005) and in 92.3% of older balding men (p = 0.000004) but in only 76.6% of nonbald men.
    explanation: The original association at the AR locus.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:18385763
    reference_title: EDA2R is associated with androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that the non-synonymous SNP rs1385699 on EDA2R gave the best result (P=3.9e(-19)) whereas rs6152 on the AR gene is less significant (P=4.17e(-12)).
    explanation: The competing assignment of the X-linked signal to EDA2R, recorded here so that the AR entry does not overstate its case.
    quote_role: PRIMARY_RESULT
- name: EDA2R
  gene_term:
    preferred_term: EDA2R
    term:
      id: hgnc:17756
      label: EDA2R
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: A Sardinian association study identified a nonsynonymous EDA2R variant whose statistical association persisted after conditioning on AR. This supports a susceptibility signal, not proof that EDA2R is the sole functional gene. Cultured dermal-papilla expression studies favor AR as a candidate in that preparation; expression differences and linkage disequilibrium do not settle allele-specific causality.
  evidence:
  - reference: PMID:18385763
    reference_title: EDA2R is associated with androgenetic alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In particular, we found that rs1352015 located 8 kb from the EDA2R gene showed the best result (P=7.77e(-7)).
    explanation: The lead marker near EDA2R in the genome-wide X-chromosome scan.
    quote_role: PRIMARY_RESULT
  - reference: PMID:27060448
    reference_title: Differential Expression between Human Dermal Papilla Cells from Balding and Non-Balding Scalps Reveals New Candidate Genes for Androgenetic Alopecia.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: We found evidence for AR but not EDA2R as the candidate gene at the AGA risk locus on chromosome X.
    explanation: Expression in balding papilla cells does not support EDA2R as the functional gene; recorded as REFUTE of the functional-gene claim, not of the association.
    quote_role: PRIMARY_RESULT
- name: 20p11.22 locus (PAX1/FOXA2 region)
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: Independent 2008 studies associated the intergenic 20p11 region with male-pattern hair loss. PAX1 and FOXA2 are nearby candidates, not genes established by the association alone. Lack of detected statistical interaction with the AR locus does not prove an androgen-independent biochemical route.
  evidence:
  - reference: PMID:18849991
    reference_title: Male-pattern baldness susceptibility locus at 20p11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conducted a genome-wide association study for androgenic alopecia in 1,125 men and identified a newly associated locus at chromosome 20p11.22, confirmed in three independent cohorts (n = 1,650; OR = 1.60, P = 1.1 x 10(-14) for rs1160312).
    explanation: Discovery and replication of the locus.
    quote_role: PRIMARY_RESULT
  - reference: PMID:18849994
    reference_title: Susceptibility variants for male-pattern baldness on chromosome 20p11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We then investigated the 30 best SNPs in an independent replication sample and found highly significant association for five SNPs on chromosome 20p11 (rs2180439 combined P = 2.7 x 10(-15)).
    explanation: The simultaneous independent discovery.
    quote_role: PRIMARY_RESULT
- name: WNT10A
  gene_term:
    preferred_term: WNT10A
    term:
      id: hgnc:13829
      label: WNT10A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: The intronic rs7349332 association and follicular expression make WNT10A a candidate at 2q35. These data do not establish that the risk allele causes the androgen-induced dermal-papilla Wnt changes measured in separate culture experiments. This common-variant susceptibility association is distinct from pathogenic WNT10A alleles causing ectodermal dysplasia.
  evidence:
  - reference: PMID:23358095
    reference_title: 'Androgenetic alopecia: identification of four genetic risk loci and evidence for the contribution of WNT signaling to its etiology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Expression studies in human hair follicle tissue suggest that WNT10A has a functional role in AGA etiology.
    explanation: The expression evidence that the locus acts through WNT10A.
    quote_role: PRIMARY_RESULT
environmental:
- name: Tobacco smoking
  description: Smoking is associated with AGA presence and with greater cross-sectional severity in observational studies. In the 2026 review, the endpoint labeled progression compared moderate/severe with mild disease; no cohort studies established longitudinal worsening. Proposed oxidative or inflammatory mechanisms remain untested in the cited scalp evidence, and the association does not demonstrate that smoking cessation reverses AGA.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Perifollicular Inflammation
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Pro-oxidant effects of smoke are proposed to release pro-inflammatory cytokines and drive follicular microinflammation and fibrosis; the mechanism is proposed from general smoke biology rather than shown in scalp.
    evidence:
    - reference: PMID:12673073
      reference_title: 'Association between smoking and hair loss: another opportunity for health education against smoking?'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: pro-oxidant effects of smoking leading to the release of pro-inflammatory cytokines resulting in follicular micro-inflammation and fibrosis
      explanation: The proposed route from smoke to the perifollicular inflammatory node; a review's mechanistic proposal, hence indirect.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:41606541
    reference_title: 'Risk factors for androgenetic alopecia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Family history (presence: odds ratio [OR] 2.72, 95% confidence interval [CI] 1.85–3.99; progression: OR 4.24, 95% CI 2.77–6.49) and smoking (presence: OR 1.46, 95% CI 1.06–2.01; progression: OR 1.60, 95% CI 1.29–1.99) were significantly associated with both presence and progression of AGA.'
    explanation: The reported progression odds ratio refers to cross-sectional severity categories; it is not a longitudinal progression rate.
  - reference: PMID:12673073
    reference_title: 'Association between smoking and hair loss: another opportunity for health education against smoking?'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Smoke-induced premature skin ageing has attracted the attention of the medical community, while only recently an observational study has indicated a significant relationship between smoking and baldness.
    explanation: The observational nature of the association as the review itself states it.
treatments:
- name: Topical minoxidil
  description: Topical minoxidil is an established treatment for adult male- and female-pattern hair loss. The S3 guideline recommends 2–5% solution or 5% foam twice daily in men, and 2% solution twice daily or 5% foam once daily in women. Assess response after about six months and continue effective therapy to maintain benefit. Temporary early shedding, irritation, contact allergy and unwanted hair growth should be discussed; the guideline advises pausing treatment during pregnancy and lactation. The follicular mechanism remains incompletely defined.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: minoxidil
      term:
        id: CHEBI:6942
        label: minoxidil
  target_mechanisms:
  - target: Shortened Anagen
    treatment_effect: INHIBITS
    description: Animal hair-cycle studies support earlier anagen entry and possible anagen prolongation. The exact human mechanism and the fraction of benefit attributable to this effect remain uncertain.
    evidence:
    - reference: PMID:14996087
      reference_title: 'Minoxidil: mechanisms of action on hair growth.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: In animal studies, topical minoxidil shortens telogen, causing premature entry of resting hair follicles into anagen, and it probably has a similar action in humans.
      explanation: The review explicitly distinguishes demonstrated animal cycle changes from proposed human similarity.
    - reference: PMID:14996087
      reference_title: 'Minoxidil: mechanisms of action on hair growth.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: Minoxidil may also cause prolongation of anagen and increases hair follicle size.
      explanation: Anagen prolongation is a proposed contributor in the mechanism review.
  evidence:
  - reference: PMID:12196747
    reference_title: A randomized clinical trial of 5% topical minoxidil versus 2% topical minoxidil and placebo in the treatment of androgenetic alopecia in men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In men with AGA, 5% topical minoxidil was clearly superior to 2% topical minoxidil and placebo in increasing hair regrowth, and the magnitude of its effect was marked (45% more hair regrowth than 2% topical minoxidil at week 48).
    explanation: The randomized male trial supports 5% topical efficacy; its relative gain does not apply to all preparations or populations.
  - reference: url:https://generolon.com/img/articles/Evidence-based-guideline-for-the-treatment-of-AGA-in-women-and-in-men.pdf
    reference_title: https://generolon.com/img/articles/Evidence-based-guideline-for-the-treatment-of-AGA-in-women-and-in-men.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The response to treatment should be assessed at 6 months. If successful, treatment needs to be continued to maintain efﬁcacy.
    explanation: Guideline monitoring and continuation advice.
  - reference: url:https://generolon.com/img/articles/Evidence-based-guideline-for-the-treatment-of-AGA-in-women-and-in-men.pdf
    reference_title: https://generolon.com/img/articles/Evidence-based-guideline-for-the-treatment-of-AGA-in-women-and-in-men.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It is recommended to pause topical minoxidil use during pregnancy and lactation, due to lack of data during this period.
    explanation: Pregnancy and lactation guidance is precautionary because of limited data.
- name: Low-dose oral minoxidil
  description: Oral minoxidil is used off-label for hair loss when topical treatment is unsuitable or insufficient. In a 24-week double-dummy trial of 90 selected men, 5 mg daily was not superior to 5% topical minoxidil twice daily for the primary absolute hair-density outcomes; this superiority trial does not establish equivalence. Hypertrichosis and headache were more frequent orally, and men with cardiac or renal disease were excluded. A 43-expert Delphi statement provides prescribing guidance, including cardiovascular and renal precautions and avoidance during pregnancy or breastfeeding; it is not proof of comparative safety. Regimen choice and monitoring require individual assessment.
  therapeutic_modality: SMALL_MOLECULE

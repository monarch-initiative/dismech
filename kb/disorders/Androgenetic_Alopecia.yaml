- name: Follicular Miniaturization
  biological_scale: TISSUE
  description: Affected scalp contains smaller follicles producing finer, shorter shafts, with fewer terminal hairs and increased vellus-like hairs and fibrous streamers. Miniaturization is a tissue hallmark of nonscarring AGA. A reduction in dermal-papilla cell number has been proposed as a mediator, but is not established by the cited conceptual paper. Perifollicular fibrosis and distinct scarring alopecias must not be treated as inevitable progression of this process.
  evidence:

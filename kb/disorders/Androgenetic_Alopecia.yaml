description: >-
  Androgenetic alopecia is the common, heritable, androgen-dependent form of
  scalp hair loss: patterned, non-scarring, and progressive. It is the most
  frequent hair disorder in either sex, affecting roughly half of men by the
  fifth decade and most European men by late life, and a substantial minority
  of women, in whom it is usually called female pattern hair loss.

  The mechanism runs from inherited susceptibility to a regional response of the
  hair follicle. Follicles of the frontal and vertex scalp in genetically
  predisposed people carry more androgen receptor and more type 2
  5-alpha-reductase than occipital follicles, so the dermal papilla of those
  follicles converts testosterone to dihydrotestosterone locally and responds to
  it. Dihydrotestosterone acting through the androgen receptor changes what the
  dermal papilla secretes: transforming growth factor beta-1, dickkopf-1 and
  interleukin-6 rise, canonical Wnt/beta-catenin signalling to the follicular
  epithelium falls, and follicular keratinocytes stop proliferating or die.
  Prostaglandin D2 is elevated in bald scalp and independently inhibits hair
  growth. Each hair cycle then shortens its anagen phase and enters catagen
  early, telogen and the empty kenogen interval lengthen, the dermal papilla
  loses cells, and the follicle miniaturizes from a terminal to a vellus-like
  unit. The follicular stem cell pool is retained while the progenitor
  compartment that would regenerate a terminal hair is depleted, which is why
  the process is in principle reversible and why treatment works better early.
  Perifollicular microinflammation and fibrosis accompany the miniaturization in
  a subset and predict a poorer response to treatment.

  Clinically the disease is a pattern. Men recede at the frontotemporal hairline
  and thin at the vertex, progressing along the Hamilton-Norwood scale toward a
  retained occipital and parietal horseshoe of hair. Women thin diffusely over
  the crown and central scalp with a preserved frontal hairline, graded on the
  Ludwig or Sinclair scales. Trichoscopy shows hair-diameter variability,
  vellus hairs and the peripilar sign; a horizontal scalp biopsy shows a reduced
  terminal-to-vellus ratio. The entry is organised around the male disease,
  where the androgen mechanism is proven by genetics, by the absence of baldness
  in men who cannot make dihydrotestosterone, and by the response to
  5-alpha-reductase inhibition; the female pattern is carried as a subtype whose
  androgen dependence is recorded as an open question rather than assumed.
notes: >-
  Scope and lump/split. This entry curates androgenetic alopecia as one disease
  with two sex-patterned presentations. Male pattern hair loss is a subtype bound
  to MONDO:0800201; female pattern hair loss is a subtype left unbound because
  MONDO has no term for it (searched for "female pattern hair loss" and "female
  androgenetic alopecia"; the closest terms are the parent MONDO:0005339 and the
  male-pattern term). The OMIM locus term MONDO:0007184 (AGA1, the AR/EDA2R
  locus) is mapped as a narrowMatch rather than curated as a separate disease,
  because the locus is a susceptibility component of this disease and not a
  distinct clinical entity.

  Module conformance. None declared. The modules that mention hair follicles
  (neural_crest_melanocyte_deficiency, desmosomal_adhesion_failure,
  eda_edar_nfkb_ectodermal_appendage, cellular_senescence) describe developmental
  or adhesion mechanisms that are not the androgen-driven miniaturization
  curated here; cellular_senescence was considered for the balding dermal
  papilla senescence node but that finding is an in vitro observation on
  cultured cells and was not judged strong enough to assert conformance to a
  module built for organismal aging. mtor_androgen_deprivation_resistance is a
  prostate cancer module and is not a target.

  Provenance. Built from the Edison Falcon deep-research report
  research/Androgenetic_Alopecia-deep-research-falcon.md (16/16 references
  resolved, 14/14 terms resolved; preflight-dr returned SKIP because MONDO
  records no causal gene for the term, and disease identity was checked by
  hand). The report cites recent reviews by DOI and author-year key; the DOIs
  used here (10.3390/ijms25052542, 10.1186/s12889-026-26258-y,
  10.1136/bmjopen-2021-049855, 10.3390/jcm13071962) were resolved to PMIDs
  through the PMC ID converter and quoted from the cached abstracts. The
  report's suggested ontology bindings were checked and several were wrong and
  are not used: HP:0011364 is "White hair" not "Thinning hair", HP:0002286 is
  "Fair hair" not "Premature baldness", CL:0002551 is "fibroblast of dermis"
  not the dermal papilla cell, and its NCIT drug codes (C62024, C1265, C47491)
  name unrelated agents. Primary mechanism, genetics and trial papers were
  found through PubMed and are cited by PMID. Hamilton 1951 (PMID:14819896) and
  Nyholt 2003 (PMID:14675213) have no abstract in PubMed and are not quoted; the
  twin heritability estimate is taken from the Yap 2018 full text instead.
  DHT-treated mouse models exist but no primary report was cached, so they are
  described only in the model-mismatch discussion.
inheritance:
- name: Polygenic Inheritance
  description: >-
    A polygenic, sex-limited, age-dependent trait rather than a Mendelian
    disease. Twin studies put the heritability of male pattern baldness near
    0.8, pedigree heritability in UK Biobank is 0.62, and several hundred
    genome-wide significant loci are known. The classic observation that
    baldness follows the maternal line reflects the strongest single signal,
    which lies at the androgen receptor / EDA2R locus on the X chromosome and is
    therefore inherited from the mother; but the X-linked locus accounts for
    only a minority of the heritable variance and the 20p11 locus and hundreds of
    autosomal loci are inherited from either parent, so the mode of inheritance
    is recorded as polygenic, not X-linked.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:30573740
    reference_title: "Dissection of genetic variation and evidence for pleiotropy in male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that MPB is strongly heritable and polygenic, with pedigree-heritability of 0.62 (SE = 0.03) estimated from close relatives, and SNP-heritability of 0.39 (SE = 0.01) from conventionally-unrelated males."
    explanation: >-
      The largest single-cohort analysis states the polygenic architecture
      directly and quantifies heritability from relatives and from SNPs.
  - reference: PMID:30573740
    reference_title: "Dissection of genetic variation and evidence for pleiotropy in male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early twin studies estimated the narrow-sense heritability (h2) on a scale of liability to be 0.817 (95%CI: 0.77–0.85)."
    explanation: >-
      The twin heritability of about 0.8 that the description cites, quoted from
      the introduction of the same paper because the original twin study
      (Nyholt 2003, PMID:14675213) has no abstract in PubMed.
  - reference: PMID:15902657
    reference_title: "Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-chromosomal location of AR stresses the importance of the maternal line in the inheritance of AGA."
    explanation: >-
      Gives the reason for the classic maternal-line observation without
      making the trait X-linked: the strongest locus is on the X chromosome.
  - reference: PMID:28349362
    reference_title: "Androgenetic alopecia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A number of genes determine the predisposition for androgenetic alopecia in a polygenic fashion."
    explanation: A systematic review's summary statement of the polygenic mode.
has_subtypes:
- name: Male pattern hair loss
  display_name: Male pattern hair loss (Hamilton-Norwood pattern)
  subtype_term:
    preferred_term: Male pattern baldness
    term:
      id: MONDO:0800201
      label: baldness, male pattern
  description: >-
    The male presentation: bitemporal recession of the frontal hairline and
    thinning of the vertex, coalescing over years into a retained occipital and
    parietal rim. Graded on the Hamilton scale as revised by Norwood in 1,000
    white men, which also showed that the incidence keeps rising with age. This
    is the presentation in which the androgen mechanism is established and in
    which finasteride and dutasteride are proven.
  evidence:
  - reference: PMID:1188424
    reference_title: "Male pattern baldness: classification and incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report establishes such a classification, and reports its use in determining the incidence of male pattern baldness at various ages in 1,000 white adult male subjects."
    explanation: The Norwood classification and its incidence survey.
  - reference: PMID:38610726
    reference_title: "Trichoscopy of Androgenetic Alopecia: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Typically, hair thinning in the frontotemporal areas, the recession of the frontotemporal hairline and hair loss in the vertex area occur in male androgenetic alopecia (MAGA)."
    explanation: States the distribution that defines the male pattern.
- name: Female pattern hair loss
  display_name: Female pattern hair loss (Ludwig / Sinclair pattern)
  description: >-
    The female presentation: diffuse thinning over the crown and central
    scalp with widening of the central part and a preserved frontal hairline,
    graded on the Ludwig scale (1977) or the five-point Sinclair scale. It is
    common, rising through adult life and peaking after fifty. No MONDO term
    exists for female pattern hair loss, so this subtype is deliberately left
    without a subtype_term rather than being bound to the male-pattern term or
    to the parent disease. Its androgen dependence is not established:
    finasteride did not help postmenopausal women in a controlled trial, the
    response to oral antiandrogens has been shown only in uncontrolled series,
    and women with the pattern usually have normal androgen levels. That
    uncertainty is recorded as a knowledge gap rather than resolved here.
  evidence:
  - reference: PMID:921894
    reference_title: "Classification of the types of androgenetic alopecia (common baldness) occurring in the female sex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To facilitate an early diagnosis (desirable in view of the therapeutic possibilities by means of antiandrogens) a classification of the stages of the common form (female type) of androgenetic alopecia in women is presented."
    explanation: The Ludwig classification that defines the female pattern.
  - reference: PMID:921894
    reference_title: "Classification of the types of androgenetic alopecia (common baldness) occurring in the female sex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is still considered infrequent, for it differs, in its clinical picture and in the sequence of events leading to it, from common baldness in men."
    explanation: >-
      Ludwig's own statement that the female presentation differs from the
      male one in picture and sequence, which is why it is a subtype.
  - reference: PMID:16382668
    reference_title: "Female pattern hair loss and its relationship to permanent/cicatricial alopecia: a new perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Female pattern hair loss (FPHL) is a common hair disorder of the central scalp."
    explanation: Locates the female pattern on the central scalp.
  - reference: PMID:11231244
    reference_title: "Incidence of female androgenetic alopecia (female pattern alopecia)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Female androgenetic alopecia is quite common beginning in the late 20s and reaching its peak after 50 years of age."
    explanation: Age distribution from a survey of 1,006 Caucasian women.
  - reference: PMID:12573818
    reference_title: "Androgens and alopecia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These findings suggest that MPHL and FPHL are distinct clinical entities, with disparate pathophysiologies."
    explanation: >-
      The reason the female pattern is a subtype with its own open question
      about mechanism rather than a mirror of the male disease.
pathophysiology:
- name: Polygenic Susceptibility at the AR/EDA2R Locus and Autosomal Risk Loci
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is inherited susceptibility, not a mutation. The
    strongest signal in every study is the androgen receptor / EDA2R region at
    Xq11-q12, where common variants including a polyglycine GGN repeat in AR
    exon 1 carry an etiological fraction near half of early-onset disease; a
    non-synonymous EDA2R variant gives the best single-marker result in a
    Sardinian isolate and the AR association there appears to ride on linkage
    disequilibrium, while expression in balding dermal papilla cells points
    back to AR as the functional gene. A second major locus at 20p11.22 acts
    independently of AR, and genome-wide meta-analyses have since added WNT10A,
    FGF5, IRF4, DKK2, TWIST1 and several hundred further loci, most of them
    regulatory and each of small effect. What any risk allele does to the
    follicle is not known; the one thing the genetics does say is that the
    predisposition is expressed in the scalp follicle's own androgen response.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  - preferred_term: EDA2R
    term:
      id: hgnc:17756
      label: EDA2R
  - preferred_term: WNT10A
    term:
      id: hgnc:13829
      label: WNT10A
  - preferred_term: FGF5
    term:
      id: hgnc:3683
      label: FGF5
  - preferred_term: TWIST1
    term:
      id: hgnc:12428
      label: TWIST1
  evidence:
  - reference: PMID:15902657
    reference_title: "Genetic variation in the human androgen receptor gene is the major determinant of common early-onset androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that genetic variability in the androgen receptor gene (AR) is the cardinal prerequisite for the development of early-onset AGA, with an etiological fraction of 0.46."
    explanation: The AR locus as the cardinal genetic requirement, with its etiological fraction.
  - reference: PMID:18385763
    reference_title: "EDA2R is associated with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further statistical analysis carried out by conditioning each gene to the presence of the other showed that the association with EDA2R is independent while the association with AR seems to be the result of linkage disequilibrium."
    explanation: >-
      The conditional analysis that keeps EDA2R in the locus name: in this
      cohort the signal tracks EDA2R rather than AR.
  - reference: PMID:18849991
    reference_title: "Male-pattern baldness susceptibility locus at 20p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The one man in seven who harbors risk alleles at both 20p11.22 and AR (encoding the androgen receptor) has a sevenfold-increased odds of androgenic alopecia (OR = 7.12, P = 3.7 x 10(-15))."
    explanation: The second major locus and the joint effect of carrying both.
  - reference: PMID:18849994
    reference_title: "Susceptibility variants for male-pattern baldness on chromosome 20p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No interaction was detected with the X-chromosomal androgen receptor locus, suggesting that the 20p11 locus has a role in a yet-to-be-identified androgen-independent pathway."
    explanation: >-
      The 20p11 signal is independent of AR, so the susceptibility is not a
      single androgen-receptor pathway.
  - reference: PMID:28272467
    reference_title: "Meta-analysis identifies novel risk loci and yields systematic insights into the biology of male-pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 63 loci explain ∼39% of the phenotypic variance in MPB and highlight several plausible candidate genes (FGF5, IRF4, DKK2) and pathways (melatonin signalling, adipogenesis) that are likely to be implicated in the key-pathophysiological features of MPB and may represent promising targets for the development of novel therapeutic options."
    explanation: The autosomal loci and candidate genes from the 2017 meta-analysis.
  - reference: PMID:23358095
    reference_title: "Androgenetic alopecia: identification of four genetic risk loci and evidence for the contribution of WNT signaling to its etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The strongest association signal was obtained for rs7349332 (P=3.55 × 10(-15)) on chr2q35, which is located intronically in WNT10A."
    explanation: The WNT10A locus, which ties the genetics to the Wnt arm of the mechanism.
  - reference: PMID:27060448
    reference_title: "Differential Expression between Human Dermal Papilla Cells from Balding and Non-Balding Scalps Reveals New Candidate Genes for Androgenetic Alopecia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found evidence for AR but not EDA2R as the candidate gene at the AGA risk locus on chromosome X."
    explanation: >-
      Expression in balding dermal papilla cells favours AR as the functional
      gene at the X-linked locus, the counterweight to the Sardinian
      conditional analysis; the locus is named for both because the question
      is open.
  - reference: PMID:28196072
    reference_title: "Genetic prediction of male pattern baldness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified over 250 independent genetic loci associated with severe hair loss (P<5x10-8)."
    explanation: The scale of the polygenic architecture in UK Biobank.
  downstream:
  - target: Regional Androgen Sensitivity of Frontal and Vertex Scalp Follicles
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The predisposition is expressed as a heightened androgen response of the
      scalp follicle. How risk alleles produce it is not demonstrated; the best
      supported inference is that functional variation at or near AR raises
      receptor expression in the balding scalp.
    evidence:
    - reference: PMID:11231320
      reference_title: "Polymorphism of the androgen receptor gene is associated with male pattern baldness."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Functional mutation in or near the androgen receptor gene may explain the reported high levels of expression of this gene in the balding scalp."
      explanation: >-
        Proposes the link from the genetic association to receptor expression in
        the target tissue; it is an inference from association data, hence
        INDIRECT.
- name: Regional Androgen Sensitivity of Frontal and Vertex Scalp Follicles
  biological_scale: CELLULAR
  description: >-
    The disease is patterned because the follicle's androgen machinery is
    patterned. Frontal and vertex follicles of affected men and women carry
    more androgen receptor and more type 1 and type 2 5-alpha-reductase than
    their own occipital follicles, which instead carry more aromatase;
    cultured dermal papilla cells from balding scalp bind more androgen than
    those from non-balding scalp; and dermal papilla cells from occipital
    scalp show little androgen receptor at all. This is the cellular fact that
    makes occipital hair spare itself, makes transplanted occipital follicles
    keep growing in a bald frontal recipient site, and gives the female
    presentation its milder course, since female frontal follicles carry about
    40 percent less receptor and several-fold less 5-alpha-reductase than male
    ones.
  cell_types:
  - preferred_term: scalp hair follicle dermal papilla cell
    term:
      id: CL:2000083
      label: hair follicle dermal papilla cell of scalp
  locations:
  - preferred_term: frontal and vertex scalp
    term:
      id: UBERON:0000403
      label: scalp
  - preferred_term: hair follicle dermal papilla
    term:
      id: UBERON:0000412
      label: dermal papilla
  biological_processes:
  - preferred_term: androgen receptor signaling pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:9284093
    reference_title: "Different levels of 5alpha-reductase type I and II, aromatase, and androgen receptor in hair follicles of women and men with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings revealed that both women and men have higher levels of receptors and 5alpha-reductase type I and II in frontal hair follices than in occipital follicles, whereas higher levels of aromatase were found in their occipital follicles."
    explanation: >-
      The frontal-versus-occipital difference in receptor and enzyme content
      that underlies the pattern. Quoted verbatim including the source's
      spelling of "follices".
  - reference: PMID:9284093
    reference_title: "Different levels of 5alpha-reductase type I and II, aromatase, and androgen receptor in hair follicles of women and men with androgenetic alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Androgen receptor content in female frontal hair follicles was approximately 40% lower than in male frontal hair follicle."
    explanation: The sex difference in receptor content that the subtype description relies on.
  - reference: PMID:9496234
    reference_title: "Balding hair follicle dermal papilla cells contain higher levels of androgen receptors than those from non-balding scalp."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Balding cells contained significantly (P < 0.01) greater levels of androgen receptors (Bmax = 0.06 +/- 0.01 fmol/10(4) cells (mean +/- S.E.M.)) than those from non-balding scalp (0.04 +/- 0.001)."
    explanation: Receptor content measured in cultured dermal papilla cells from balding versus non-balding scalp.
  - reference: PMID:7748741
    reference_title: "Interaction between dermal papilla cells and follicular epithelial cells in vitro: effect of androgen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Androgen receptors were detected in the dermal papilla cells of beard and axillary hair follicles, but not in those of occipital scalp hair follicles."
    explanation: >-
      The occipital dermal papilla is essentially androgen-blind, which is the
      cellular basis of occipital sparing. Beard follicles show the receptor is
      not itself the problem: the same receptor drives growth there.
  downstream:
  - target: Conversion of Testosterone to Dihydrotestosterone in the Dermal Papilla
    causal_link_type: DIRECT
    description: >-
      The enriched 5-alpha-reductase of susceptible follicles converts
      circulating testosterone to dihydrotestosterone locally.
- name: Conversion of Testosterone to Dihydrotestosterone in the Dermal Papilla
  biological_scale: MOLECULAR
  description: >-
    Testosterone is reduced to the more potent dihydrotestosterone by
    5-alpha-reductase within the follicle, type 2 being the isoform expressed
    in frontal scalp dermal papilla. The balding scalp carries high levels of
    dihydrotestosterone. The requirement is proven at both ends: men with
    inherited 5-alpha-reductase deficiency, and eunuchs, do not bald, and
    blocking the enzyme with finasteride lowers scalp dihydrotestosterone and
    regrows hair. Circulating androgen is not the variable; men with pattern
    hair loss have normal serum testosterone, and the disease is a property of
    local conversion and local sensitivity.
  molecular_functions:
  - preferred_term: 5-alpha-reductase activity (SRD5A2, SRD5A1)
    term:
      id: GO:0003865
      label: 3-oxo-5-alpha-steroid 4-dehydrogenase activity
    modifier: INCREASED
  biological_processes:

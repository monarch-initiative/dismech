    quote_role: PRIMARY_RESULT
    snippet: This finding was associated with mast cell degranulation and fibroblast activation within the fibrous sheaths.
    explanation: Mast-cell degranulation and fibroblast activation accompany sheath changes; temporal causation was not tested.

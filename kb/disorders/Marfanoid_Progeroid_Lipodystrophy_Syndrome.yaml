- name: Loss of Furin Cleavage and Asprosin Deficiency
  biological_scale: MOLECULAR
  description: >-
    The first node of the arm unique to MFLS. Furin cleavage of profibrillin-1
    normally releases a 140-residue C-terminal peptide — asprosin — encoded by the
    final two FBN1 exons. Every MFLS variant clusters around that cleavage site,
    so the truncated allele cannot yield asprosin. Crucially, circulating asprosin
    falls further than the 50% a heterozygous null would predict, because the
    expressed truncated profibrillin also suppresses secretion of asprosin from
    the wild-type allele. This node is the mechanistic hinge of the entry: it is
    where MFLS departs from classic Marfan syndrome, whose alleles are degraded by
    NMD and therefore leave asprosin production largely intact.

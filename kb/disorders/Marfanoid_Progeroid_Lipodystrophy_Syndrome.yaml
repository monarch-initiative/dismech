    snippet: "we describe the generation of a rabbit MPL model with C-terminal truncation of fibrillin-1 using a CRISPR/Cas9 system"
    explanation: Establishes the existence, species, and construction of the model.
  modeled_mechanisms:
  - target: Microfibril and Extracellular Matrix Assembly Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous rabbits reproduce the connective-tissue, ocular, and aortic
      features of the marfanoid arm.
    limitations: >-
      The engineered truncation is not one of the specific human MFLS alleles, and
      rabbit connective-tissue involvement is reported qualitatively rather than
      against a quantitative microfibril-assembly assay.
    evidence:
    - reference: PMID:29666143
      reference_title: "Truncated C-terminus of fibrillin-1 induces Marfanoid-progeroid-lipodystrophy (MPL) syndrome in rabbit."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "this novel rabbit model mimics the histopathological changes and functional defects of MPL syndrome, and could become a valuable model for studies of pathogenesis and drug screening for MPL syndrome"
      explanation: The authors' own assessment of the model's validity for this entity.
  - target: Congenital Generalized Lipodystrophy and Extreme Leanness
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Lipodystrophy and growth retardation appear in the heterozygous rabbits and
      had not been reported in prior FBN1 animal models.
    limitations: >-
      Dysglycemia accompanies the rabbit lipodystrophy, which does not match the
      human MFLS metabolic phenotype of low fasting insulin with preserved
      euglycemia and insulin sensitivity; the metabolic arm is therefore only
      partially reproduced.
    evidence:
    - reference: PMID:29666143
      reference_title: "Truncated C-terminus of fibrillin-1 induces Marfanoid-progeroid-lipodystrophy (MPL) syndrome in rabbit."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, skin symptoms, lipodystrophy, growth retardation and dysglycemia were also seen in these FBN1 Het rabbits, and have not been reported in other animal models."
      explanation: Documents the lipodystrophy phenotype, and the accompanying dysglycemia that limits fidelity.
- name: Fbn1(NPS/+) mouse (CRISPR/Cas9 exon 65 skip)
  species: Mouse
  genotype: Fbn1 heterozygous 10-bp deletion at the exon-65/intron-65 border (asprosin-ablating)
  publication: PMID:29106398
  description: >-
    A mouse engineered to carry the identical molecular event documented in a human
    MFLS patient — a heterozygous deletion causing exon 65 skipping and frameshift
    ablation of the asprosin coding region.
  evidence:
  - reference: PMID:29106398
    reference_title: "Asprosin is a centrally acting orexigenic hormone."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We introduced a small heterozygous deletion (10 bp) encompassing the exon-65/intron-65 border"
    explanation: Establishes the exact engineered allele defining this model.
  modeled_mechanisms:
  - target: Loss of Furin Cleavage and Asprosin Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces the human asprosin deficit, including the
      greater-than-heterozygous reduction attributed to a dominant-negative effect.
    limitations: >-
      Rodent adipose and hypothalamic physiology differ from human, and the model
      addresses the asprosin arm only — it is not informative about the
      microfibril/aortic arm.
    readouts:
    - name: Plasma asprosin concentration
      target: Loss of Furin Cleavage and Asprosin Deficiency
      direction: DECREASED
      interpretation: >-
        Confirms that the engineered human-equivalent allele lowers circulating
        asprosin below the heterozygous prediction, as in patients.
      evidence:
      - reference: PMID:29106398
        reference_title: "Asprosin is a centrally acting orexigenic hormone."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found asprosin concentrations lower than 50% in these mice despite heterozygosity"
        explanation: Reports the measured plasma asprosin deficit in the model.
    evidence:
    - reference: PMID:29106398
      reference_title: "Asprosin is a centrally acting orexigenic hormone."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "which harbor an identical molecular event documented in a known individual with NPS"
      explanation: The allele was designed to match a real patient variant, supporting the model's relevance.
  - target: Reduced Central Orexigenic Drive
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces human hypophagia and demonstrates the underlying AgRP
      neuron hypoactivity, which is rescued by recombinant asprosin.
    limitations: >-
      AgRP neuron electrophysiology cannot be measured in patients, so the central
      mechanism remains inferred rather than demonstrated in humans.
    readouts:
    - name: AgRP neuron firing frequency and resting membrane potential
      target: Reduced Central Orexigenic Drive
      direction: DECREASED
      interpretation: >-
        Establishes hypothalamic AgRP hypoactivity as the central lesion of
        asprosin deficiency.
      evidence:
      - reference: PMID:29106398
        reference_title: "Asprosin is a centrally acting orexigenic hormone."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found that AgRP+ neuron activity was significantly lower in Fbn1NPS/+ mice compared with WT littermates, demonstrated by decreased firing frequency and resting membrane potential"
        explanation: Direct electrophysiological measurement of the readout.
    - name: Daily food intake after recombinant asprosin
      target: Reduced Central Orexigenic Drive
      direction: RESTORED
      interpretation: >-
        Rescue by a single dose establishes that the hypophagia is caused by
        asprosin deficiency rather than by an indirect effect of mutant
        fibrillin-1.
      evidence:
      - reference: PMID:29106398
        reference_title: "Asprosin is a centrally acting orexigenic hormone."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A single subcutaneous dose of recombinant asprosin was sufficient to completely rescue the hypophagia of Fbn1NPS/+ mice, demonstrating that NPS-associated hypophagia is due to a deficiency of plasma asprosin and not due to some indirect effect of mutated fibrillin-1"
        explanation: Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:29106398
      reference_title: "Asprosin is a centrally acting orexigenic hormone."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Like humans with NPS2, Fbn1NPS/+ mice display extreme leanness compared with sex-matched WT littermates"
      explanation: The model reproduces the human leanness phenotype, supporting its relevance to this node.
treatments:
- name: Multidisciplinary supportive and surveillance care
  description: >-
    There is no disease-modifying therapy. Management is supportive and follows the
    components of the phenotype: cardiovascular surveillance for aortic root
    dilation as for any fibrillinopathy, ophthalmological management of ectopia
    lentis and myopia, and nutritional support for the very low body weight. No
    MFLS-specific treatment trial has been performed, and these recommendations are
    extrapolated from the constituent phenotypes rather than tested in this entity.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No publication reports a treatment OUTCOME in MFLS, so nothing here is
    evidenced as effective in this entity. The evidence items below are the
    FBN1-Related Marfan Syndrome GeneReviews recommendations that this entry is
    explicitly extrapolating from, cited so the extrapolation is auditable rather
    than unattributed. They are marked PARTIAL for that reason.

    GeneReviews "Agents/circumstances to avoid" for FBN1-related Marfan syndrome
    includes fluoroquinolone antibiotics, which may exacerbate the predisposition
    for aneurysm and dissection, alongside contact/competitive sports and
    isometric exercise. Whether that caution transfers to MFLS is untested, but
    given the documented aortic root dilation it is recorded here rather than
    omitted.
  evidence:
  - reference: PMID:20301510
    reference_title: "FBN1-Related Marfan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive management by a multidisciplinary team including a clinical geneticist, cardiologist, ophthalmologist, orthopedist, and cardiothoracic surgeon is strongly recommended."
    explanation: >-
      The GeneReviews multidisciplinary-care recommendation this entry
      extrapolates from. PARTIAL because it is a recommendation for classic
      FBN1-related Marfan syndrome, not for MFLS, and has never been evaluated in
      MFLS.
  - reference: PMID:20301510
    reference_title: "FBN1-Related Marfan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography annually when aortic dimensions are small and the rate of aortic dilatation is slow"
    explanation: >-
      The aortic surveillance schedule this entry extrapolates from. PARTIAL for
      the same reason: it is the classic Marfan schedule, and no MFLS-specific
      surveillance interval has been studied.
  - reference: PMID:20301510
    reference_title: "FBN1-Related Marfan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "fluoroquinolone antibiotics, which may exacerbate the predisposition for aneurysm and dissection"
    explanation: >-
      The GeneReviews agents-to-avoid caution, recorded because MFLS patients have
      documented aortic root dilation. PARTIAL: transferability to MFLS is
      untested.
- name: Beta-blocker or angiotensin receptor blocker aortic protection
  description: >-
    Pharmacologic reduction of hemodynamic stress on the aortic wall — the
    therapy that the aortic surveillance in the entry above exists to trigger.
    In FBN1-related Marfan syndrome, beta-blockers or angiotensin receptor
    blockers are routinely prescribed once aortic root dilation is progressive,
    and GeneReviews recommends initiating therapy at diagnosis at any age.

    This is recorded because MFLS patients have documented aortic root dilation
    and the entry already carries three Marfan-derived surveillance
    recommendations; carrying the surveillance while omitting the therapy it
    triggers would be internally inconsistent. It is NOT evidence that the
    therapy works in MFLS. No MFLS patient has been reported on either drug
    class, no aortic outcome has been measured in this entity, and the published
    series is roughly eight to nine patients — so the extrapolation is from
    shared FBN1 aortopathy biology, not from data. All evidence here is therefore
    PARTIAL, exactly as for the other GeneReviews-derived items.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: angiotensin receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Progressive Aortic Root Dilation
    treatment_effect: INHIBITS
    description: >-
      Both drug classes act on the hemodynamic load borne by the weakened aortic
      wall rather than on the upstream fibrillin-1 or TGF-beta lesion, so the
      target is the dilation node itself, not the microfibril or TGF-beta node.
      (ARBs are additionally proposed to attenuate TGF-beta signaling in Marfan
      aortopathy, but that mechanism is contested in the Marfan literature and
      has never been examined in MFLS, so it is not asserted here.)
    evidence:
    - reference: PMID:20301510
      reference_title: "FBN1-Related Marfan Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Medications that reduce hemodynamic stress on the aortic wall, such as beta-blockers or angiotensin receptor blockers (ARBs), are routinely prescribed."
      explanation: >-
        States the mechanism by which the drug classes act on the aortic wall.
        PARTIAL because it is a classic FBN1-related Marfan syndrome
        recommendation with no MFLS-specific evidence.
  notes: >-
    GeneReviews cautions that some antihypertensive classes — calcium channel
    blockers and ACE inhibitors — lack direct evidence for efficacy or safety in
    Marfan syndrome, so they are deliberately not listed as therapeutic agents
    here.
  evidence:
  - reference: PMID:20301510
    reference_title: "FBN1-Related Marfan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy is generally initiated at the time of diagnosis with Marfan syndrome at any age or upon appreciation of progressive aortic root dilatation even in the absence of a definitive diagnosis."
    explanation: >-
      Gives the timing of initiation this entry extrapolates from. PARTIAL: it is
      the classic Marfan trigger, and no MFLS-specific threshold has been studied.
- name: Genetic counseling
  description: >-
    MFLS is autosomal dominant, and every reported case with parental testing
    arose de novo, so recurrence risk to the parents of a proband is low. An
    affected individual, however, has a 50% transmission risk to each child —
    ordinary Mendelian arithmetic for a heterozygous autosomal dominant variant,
    which transfers from FBN1-related Marfan syndrome to MFLS without needing
    MFLS-specific data because it follows from the mode of inheritance rather
    than from the phenotype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    This is the one GeneReviews-derived item where the extrapolation is not
    clinical: the 50% figure is a consequence of autosomal dominant inheritance,
    which this entry independently curates and evidences, not of any
    Marfan-specific observation. It is still marked PARTIAL because the quoted
    sentence names Marfan syndrome rather than MFLS.
  evidence:
  - reference: PMID:20301510
    reference_title: "FBN1-Related Marfan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with Marfan syndrome has a 50% chance of inheriting the pathogenic variant and the disorder"
    explanation: >-
      The transmission risk for a heterozygous autosomal dominant FBN1 variant.
      PARTIAL because the sentence is written for Marfan syndrome, though the
      arithmetic follows from the inheritance mode this entry curates.
- name: Surgical correction of entropion
  description: >-
    One proband underwent surgery to correct bilateral eyelid entropion at 16
    months because of severe corneal epithelial damage. This is the only surgical
    intervention with a reported indication and outcome in an MFLS patient.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because she had severe corneal epithelial damage, she underwent surgery to correct bilateral entropion at Kawasaki Medical School Hospital at the age of 1 year 4 months."
    explanation: A single reported case; the indication and timing are documented, the long-term outcome is not.
- name: Recombinant asprosin replacement (investigational, preclinical only)
  description: >-
    Asprosin replacement is the mechanistically obvious therapy for the metabolic
    arm and fully rescues hypophagia and AgRP neuron activity in the mouse model.
    It has NOT been tested in humans and there is no clinical program; it is
    recorded here as a preclinical concept, not a recommendation. Replacement would
    in any case address only the asprosin arm and would not be expected to affect
    the microfibril/aortic arm.

    No therapeutic_agent is bound: asprosin is a 140-residue peptide hormone
    described in 2016 and has no CHEBI entry and no NCIT clinical-agent term, so
    per the guidance the slot is left empty rather than filled with a wrong or
    over-broad term.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of Furin Cleavage and Asprosin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous recombinant asprosin substitutes for the cleavage product that the
      truncated profibrillin cannot release.
    evidence:
    - reference: PMID:29106398
      reference_title: "Asprosin is a centrally acting orexigenic hormone."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "this is phenocopied by mice carrying similar mutations and can be fully rescued by asprosin"
      explanation: Establishes rescue of the asprosin-deficiency phenotype by exogenous asprosin in the model.
  evidence:
  - reference: PMID:29106398
    reference_title: "Asprosin is a centrally acting orexigenic hormone."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "A single subcutaneous dose of recombinant asprosin was sufficient to completely rescue the hypophagia of Fbn1NPS/+ mice"
    explanation: >-
      Supports the preclinical rationale only; there is no human evidence, hence
      PARTIAL and MODEL_ORGANISM.
discussions:
- discussion_id: mfls_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Stable Truncated Profibrillin-1 with an Altered C-Terminus
  prompt: >-
    Do the widely used FBN1 mouse models of Marfan syndrome say anything at all
    about MFLS, given that they were built on a mechanism (haploinsufficiency or
    dominant-negative missense) that MFLS does not use?
  rationale: >-
    The published FBN1 knockout and dominant-negative mouse models were designed
    around classic Marfan biology and, by the explicit statement of the group that
    built the rabbit model, cannot recapitulate the MFLS genotype-phenotype
    relationship, because they do not produce a stable NMD-escaping C-terminally
    truncated profibrillin. The models that ARE informative for MFLS are the
    purpose-built asprosin-ablating Fbn1(NPS/+) mouse and the CRISPR rabbit. This
    matters for interpretation: metabolic findings from Marfan mouse models — for
    example that male Marfan mice are predisposed to high-fat-diet obesity,
    diabetes, and fatty liver — point in the opposite direction from the human MFLS
    metabolic phenotype and should not be transferred to this entity.
  proposed_experiments:
  - experiment_id: exp_mfls_allele_knockin
    name: Knock-in of a specific human MFLS allele into mouse and rabbit
    description: >-
      Generate models carrying an exact reported human MFLS variant (e.g.
      c.8226+1G>A or p.Arg2726Glufs*9) rather than an engineered truncation, and
      compare microfibril assembly, aortic dimensions, adipose mass, plasma
      asprosin, and glucose/insulin handling against both wild-type and a classic
      Marfan allele in the same background.
  evidence:
  - reference: PMID:29666143
    reference_title: "Truncated C-terminus of fibrillin-1 induces Marfanoid-progeroid-lipodystrophy (MPL) syndrome in rabbit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these mice cannot recapitulate the genotype/phenotype relationship of Marfanoid-progeroid-lipodystrophy (MPL) syndrome, which is caused by a mutation in the C-terminus of fibrillin-1, the penultimate exon of the FBN1 gene"
    explanation: The explicit statement that existing FBN1 mouse models do not model this entity.
  - reference: PMID:35759435
    reference_title: "Male Marfan mice are predisposed to high-fat diet-induced obesity, diabetes, and fatty liver."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the data demonstrate that male mice of both the MFS models are susceptible to HFD-induced obesity and diabetes"
    explanation: >-
      Illustrates that the metabolic phenotype of classic Marfan mouse models runs
      opposite to the human MFLS phenotype, reinforcing the mismatch.
- discussion_id: mfls_lipodystrophy_mechanism_split
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Congenital Generalized Lipodystrophy and Extreme Leanness
  prompt: >-
    How much of the congenital lipodystrophy is caused by hypophagia secondary to
    asprosin deficiency, and how much by a cell-autonomous failure of adipocyte
    differentiation in a fibrillin-1-deficient extracellular-matrix niche?
  rationale: >-
    Three routes are on the table and the literature has not separated them. The
    hypophagia route is well evidenced in patients and rescued in the mouse. A
    cell-autonomous adipogenic route rests on expression dynamics (fibrillin-1
    rises as mesenchymal stem cells enter adipogenesis and declines as adipocytes
    mature) and on the conservation of the affected FBN1 region; the authors who
    proposed it state explicitly that a differentiation failure still needs to be
    shown experimentally. A third route proposed in review is purely mechanical —
    that deficient microfibrils change the mechanical properties of the adipose
    matrix, making it non-permissive for adipocyte expansion, independently of
    both appetite and TGF-beta. The distinction is therapeutically consequential:
    if hypophagia dominates, asprosin replacement or caloric support could restore
    adipose mass, whereas a cell-autonomous or matrix-mechanical block would not
    respond.
  proposed_experiments:
  - experiment_id: exp_mfls_adipogenesis_ipsc
    name: Patient-derived iPSC or preadipocyte adipogenic differentiation assay
    description: >-
      Differentiate MFLS patient-derived mesenchymal stem cells or preadipocytes to
      adipocytes in vitro, where caloric intake is not a variable, and compare lipid
      accumulation and adipogenic marker induction against isogenic corrected
      controls and against classic Marfan (NMD-degraded allele) cells.
  - experiment_id: exp_mfls_pairfeed_repletion
    name: Pair-feeding and asprosin-repletion in the Fbn1(NPS/+) mouse
    description: >-
      Determine what fraction of the fat-mass deficit is recovered by matching
      caloric intake to wild-type littermates, or by chronic asprosin repletion,
      versus what fraction persists — the residual being attributable to a
      cell-autonomous or matrix-mechanical adipogenic defect.
  evidence:
  - reference: PMID:27386756
    reference_title: "Expression of FBN1 during adipogenesis: Relevance to the lipodystrophy phenotype in Marfan syndrome and related conditions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "may fail to differentiate adipocytes and/or to accumulate adipocyte lipids, although this still needs to be shown experimentally"
    explanation: The authors themselves flag the adipogenic mechanism as unproven, which is the gap.
  - reference: PMID:32279186
    reference_title: "Fibrillin-1 and fibrillin-1-derived asprosin in adipose tissue function and metabolic disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increased TGF-β signaling, altered mechanical properties and impaired adipogenesis are potential causes of adipose tissue dysfunction, mediated through deficient microfibrils."
    explanation: >-
      Lists the competing candidate causes of adipose dysfunction as unresolved
      possibilities, including the matrix-mechanical route.
- discussion_id: mfls_aortic_dissection_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Aortic Root Dilation
  prompt: >-
    Is the lifetime risk of aortic dissection in MFLS the same as, lower than, or
    higher than in classic Marfan syndrome?
  rationale: >-
    Aortic root dilation is documented in MFLS and this entry conforms to the
    aortopathy module's dilation node, but no dissection has been reported, and at
    least one molecularly confirmed patient had a normal aortic root through nine
    years of follow-up. With fewer than a few dozen molecularly confirmed patients,
    most reported in childhood or early adulthood, absence of reported dissection
    carries almost no information. Because the allelic mechanism differs from
    classic Marfan syndrome (NMD-escaping neomorphic protein rather than
    haploinsufficiency), the aortic risk cannot simply be assumed equal, in either
    direction. This is why the entry deliberately does not conform to the module's
    dissection node.
  proposed_experiments:
  - experiment_id: exp_mfls_aortic_registry
    name: International MFLS registry with prospective aortic imaging
    description: >-
      Assemble all molecularly confirmed 3'-FBN1 truncation patients into a
      registry with standardized serial aortic root z-score imaging, and compare
      dilation trajectories against age- and sex-matched classic Marfan cohorts.
  evidence:
  - reference: PMID:26860060
    reference_title: "Marfanoid-progeroid-lipodystrophy syndrome: a newly recognized fibrillinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review six previous reports between 2000 and 2014 of seven unrelated patients"
    explanation: The tiny denominator is what makes the aortic natural history unknown.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showing stable mild mitral regurgitation without dilation of the aortic root"
    explanation: A molecularly confirmed patient with no aortic involvement, showing the variability that the registry would have to resolve.
notes: >-
  Nomenclature is unusually tangled for this entity and matters when searching the
  literature. The same disorder appears as marfanoid-progeroid-lipodystrophy
  syndrome (MPL/MPLS, the name proposed in the 2016 review), Marfan lipodystrophy
  syndrome (MFLS, the OMIM 616914 title), progeroid and marfanoid
  aspect-lipodystrophy syndrome (the MONDO/Orphanet label), marfanoid-progeroid
  syndrome (proposed in 2013), and — throughout the asprosin literature — simply
  "neonatal progeroid syndrome (NPS)". That last usage is a genuine hazard: NPS is
  also the name of Wiedemann-Rautenstrauch syndrome, a distinct disorder, and the
  asprosin papers cite OMIM:264090 (Wiedemann-Rautenstrauch) alongside
  OMIM:616914. Every piece of evidence in this entry drawn from a paper that says
  "NPS" was checked to be about patients with 3' FBN1 truncating variants
  specifically.

  Exon numbering is a second trap. The earlier case reports and the 2016 naming
  review put the causal frameshifts in "exon 64", the penultimate exon; the
  asprosin papers and the 2023 Japanese case report, using NM_000138.5, describe
  the same region as exons 65-66 with the splice variants in intron 65. Both refer
  to the same 71 bp of 3'-terminal coding sequence. This entry describes the
  region positionally and quotes each source in its own convention.

  "Generalized" versus "partial" lipodystrophy is a genuine and unresolved split
  in the sources, and this entry takes a side. The original case reports describe
  "pronounced generalized lipodystrophy" (PMID:20979188) and "severe congenital
  lipodystrophy" (PMID:24039054), and the entry follows them in binding
  HP:0009059 Congenital generalized lipodystrophy. But the asprosin papers
  consistently say partial: PMID:27087445 describes NPS as "congenital, partial
  lipodystrophy, predominantly affecting the face and extremities", and
  PMID:29106398's phrase "maintenance of insulin sensitivity despite partial
  lipodystrophy" is quoted verbatim as evidence in this entry — for the insulin
  claim, not the distribution claim. The generalized reading was chosen because
  the entity-defining clinical reports use it and because whole-body measures
  (BMI 12.6, body fat 9.4%) are not consistent with a purely regional deficit;
  a curator who disagrees should note that HP:0009064 Generalized lipodystrophy
  and the parent HP:0009125 Lipodystrophy are both available as hedges.

  A third point of care: "progeroid" here describes facial appearance, not
  systemic accelerated aging. Both the group that discovered asprosin and the 2023
  case report state plainly that the appearance of premature aging is a
  consequence of low subcutaneous fat. The entry therefore does not conform to any
  accelerated-aging or senescence module, and no premature-aging phenotype
  (premature greying, scleroderma-like skin, hypogonadism) is curated, because
  these were explicitly looked for and absent in the index patient.

  Frequency bands are asserted for exactly two phenotypes — congenital
  generalized lipodystrophy and the progeroid facial appearance — because the
  2016 defining review states both were present in all seven of its patients,
  which is a real count with a real denominator. Every other phenotype here
  deliberately carries NO `frequency:`. The published series is roughly seven to
  nine molecularly confirmed patients; most reports do not state which
  investigations were performed, so a feature seen in one report has an unknown
  denominator rather than a small one, and features requiring a specific test
  (echocardiography, cranial CT, slit-lamp examination) are systematically
  under-ascertained. Per docs/frequency-evidence-guidelines.md, omitting the band
  is correct here rather than converting "reported once" into an enum value the
  arithmetic does not support.

  No GeneReviews chapter exists for MFLS itself — PubMed searches for "marfanoid
  progeroid lipodystrophy GeneReviews", "Marfan lipodystrophy syndrome
  GeneReviews", and "lipodystrophy GeneReviews[TI]" all returned nothing. The
  FBN1-Related Marfan Syndrome chapter (PMID:20301510) is recorded in the
  top-level references as the nearest expert-curated baseline; it covers the
  differential rather than this entity, so its Clinical Characteristics were NOT
  used as a phenotype baseline for MFLS.
references:
- reference: PMID:20301510
  title: "FBN1-Related Marfan Syndrome."
  tags:
  - GeneReviews

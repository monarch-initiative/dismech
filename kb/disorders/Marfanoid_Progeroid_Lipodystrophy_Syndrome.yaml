      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "are therefore predicted to escape mRNA nonsense-mediated decay (NMD), leading to expression of a mutant, truncated profibrillin protein"
      explanation: States the NMD-escape-to-truncated-protein step that this edge asserts.
- name: Stable Truncated Profibrillin-1 with an Altered C-Terminus
  biological_scale: MOLECULAR
  description: >-
    The neomorphic gene product. Profibrillin-1 is a 2,871-residue proprotein
    normally cleaved at its C-terminus by furin to yield mature fibrillin-1 plus a
    140-residue C-terminal peptide. The MFLS variants cluster around that cleavage
    site and truncate the protein just before or within it, leaving an extremely
    charged terminal motif. That the mutant allele is expressed rather than
    degraded is not merely predicted: in one proband, cycloheximide treatment of
    lymphoblastoid cells failed to change the abundance of the exon-skipped
    transcript, experimentally confirming NMD escape in patient material. The
    resulting protein is the shared origin of both disease arms — it is
    incorporated into (and perturbs) the microfibrillar matrix, and it destroys
    the furin cleavage event that would have released asprosin.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  molecular_functions:
  - preferred_term: microfibril binding
    modifier: ABNORMAL
    term:
      id: GO:0050436
      label: microfibril binding
  evidence:
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Profibrillin is translated as a 2,871-amino-acid long proprotein, which is cleaved at the C terminus by the protease furin"
    explanation: Establishes the normal furin processing step that the truncated protein disrupts.
  - reference: PMID:21594992
    reference_title: "Further evidence for a marfanoid syndrome with neonatal progeroid features and severe generalized lipodystrophy due to frameshift mutations near the 3' end of the FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations result in a truncated protein with an extremely charged C-terminus, containing two positive and four negative charges in the last eight amino acids."
    explanation: Characterizes the shared charged C-terminal motif of the truncated product.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we conclude that the c.8226+5G>A variant in the FBN1 gene led to the skipping of exon 65, causing a frameshift, and that this mutant transcript escaped NMD"
    explanation: >-
      Experimental confirmation in patient-derived cells that the mutant
      transcript is retained rather than degraded — the assumption on which the
      whole neomorphic-protein model rests.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHX treatment did not alter the patterns of the chromatogram in the proband, which suggests that the mutant RNA was not the target of NMD"
    explanation: The specific cycloheximide experiment behind that conclusion.
  downstream:
  - target: Microfibril and Extracellular Matrix Assembly Defect
    causal_link_type: DIRECT
    description: >-
      The microfibril/TGF-beta arm shared with classic Marfan syndrome. The
      truncated protein with its altered charged terminus perturbs fibrillin-1
      aggregation and microfibril assembly.
    evidence:
    - reference: PMID:31774634
      reference_title: "Genetic and molecular mechanism for distinct clinical phenotypes conveyed by allelic truncating mutations implicated in FBN1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the single MPLS mutation p.Glu2759Cysfs*9 appears to perturb proper FBN1 protein aggregation"
      explanation: Connects the truncated MPLS protein directly to defective fibrillin-1 aggregation.
  - target: Loss of Furin Cleavage and Asprosin Deficiency
    causal_link_type: DIRECT
    description: >-
      The asprosin/adipose-metabolic arm unique to this entity. Truncation at or
      around the furin site ablates release of the C-terminal cleavage product.
    evidence:
    - reference: PMID:27087445
      reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "clustered around the cleavage site, resulting in heterozygous ablation of the C-terminal cleavage product (asprosin)"
      explanation: Connects the truncating variants directly to loss of the asprosin cleavage product.
- name: Microfibril and Extracellular Matrix Assembly Defect
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Wall ECM or Contractile Apparatus Defect"
  biological_scale: CELLULAR
  description: >-
    The first node of the arm shared with classic Marfan syndrome. Fibrillin-1 is
    the principal structural component of extracellular microfibrils, and its
    charged, truncated form perturbs proper protein aggregation and hence
    incorporation into the microfibrillar matrix, with knock-on effects on the
    strength and elasticity of connective tissue. This node conforms to the
    aortopathy module's primary-lesion node because the underlying defect is the
    same fibrillin-1 microfibril lesion; what differs from Marfan syndrome is the
    allelic mechanism producing it.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

    explanation: Direct in vitro evidence that the MPLS allele specifically perturbs fibrillin-1 aggregation.
  - reference: PMID:21594992
    reference_title: "Further evidence for a marfanoid syndrome with neonatal progeroid features and severe generalized lipodystrophy due to frameshift mutations near the 3' end of the FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This most likely has a profound impact on protein–protein interactions, which are very important in the extracellular matrix."
    explanation: Attributes the extracellular-matrix consequence to the altered charged C-terminus.
  - reference: PMID:29666143
    reference_title: "Truncated C-terminus of fibrillin-1 induces Marfanoid-progeroid-lipodystrophy (MPL) syndrome in rabbit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FBN1 heterozygous (FBN1 Het) rabbits faithfully recapitulated the phenotypes of MFS, including muscle wasting and impaired connective tissue, ocular syndrome and aortic dilation."
    explanation: A rabbit model carrying an engineered C-terminal truncation reproduces impaired connective tissue in vivo.
  downstream:
  - target: Congenital Generalized Lipodystrophy and Extreme Leanness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The candidate congenital arm. Fibrillin-1 is a principal component of the
      adipose extracellular-matrix niche, and deficient microfibrils are proposed
      to impair adipogenesis both directly and by altering the mechanical
      properties of that niche. This edge, not the postnatal hypophagia edge, is
      what could account for lipodystrophy being present AT BIRTH. It is drawn
      because the entry should not assert a postnatal mechanism as the sole cause
      of a congenital finding — but it is unproven, and the
      mfls_lipodystrophy_mechanism_split discussion records exactly how unproven.
    evidence:
    - reference: PMID:32279186
      reference_title: "Fibrillin-1 and fibrillin-1-derived asprosin in adipose tissue function and metabolic disorders."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Increased TGF-β signaling, altered mechanical properties and impaired adipogenesis are potential causes of adipose tissue dysfunction, mediated through deficient microfibrils."
      explanation: >-
        Names impaired adipogenesis and altered mechanical properties, mediated
        through deficient microfibrils, as candidate causes of adipose
        dysfunction. PARTIAL because the source explicitly calls them potential.
    - reference: PMID:27386756
      reference_title: "Expression of FBN1 during adipogenesis: Relevance to the lipodystrophy phenotype in Marfan syndrome and related conditions."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "may fail to differentiate adipocytes and/or to accumulate adipocyte lipids, although this still needs to be shown experimentally"
      explanation: >-
        The proposed adipogenic route, flagged by its own authors as not yet
        demonstrated, hence PARTIAL.
  - target: Dysregulated TGF-beta Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deficient microfibrils are associated with increased TGF-beta signaling.
      The textbook intermediate — failure of the microfibrillar network to
      sequester latent TGF-beta complexes — is established for fibrillin-1
      biology generally but has not been measured in MFLS tissue, which is why
      this edge is INDIRECT rather than DIRECT.
    evidence:
    - reference: PMID:32279186
      reference_title: "Fibrillin-1 and fibrillin-1-derived asprosin in adipose tissue function and metabolic disorders."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Increased TGF-β signaling, altered mechanical properties and impaired adipogenesis are potential causes of adipose tissue dysfunction, mediated through deficient microfibrils."
      explanation: >-
        Links increased TGF-beta signaling to deficient microfibrils, but hedged
        ("potential causes") and stated for adipose rather than aortic tissue,
        hence PARTIAL.
- name: Dysregulated TGF-beta Signaling
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  biological_scale: MOLECULAR
  description: >-
    Fibrillin-1 microfibrils sequester latent TGF-beta complexes in the matrix, so
    a defective microfibrillar network raises TGF-beta bioavailability and
    downstream SMAD2 phosphorylation. Both a classic Marfan allele and an MFLS
    allele upregulate SMAD2 phosphorylation in vitro, which is why this node is
    shared with the aortopathy module rather than being MFLS-specific; the causal
    reasoning for MFLS in the primary literature is that TGF-beta signaling is
    altered by, rather than untouched by, the neomorphic truncated protein.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway

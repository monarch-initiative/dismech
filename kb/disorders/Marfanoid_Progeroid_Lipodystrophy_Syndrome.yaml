diagnosis:
- name: Molecular confirmation of a 3' FBN1 truncating variant
  description: >-
    Diagnosis rests on identifying a heterozygous truncating FBN1 variant within
    the short 3'-terminal segment (the penultimate exon, its donor site, or the
    final intron) in an individual with congenital generalized lipodystrophy, a
    progeroid facial appearance, and marfanoid features. Variant position is
    diagnostically decisive: an FBN1 truncating variant located further 5' is
    subject to nonsense-mediated decay and predicts classic Marfan syndrome, not
    MFLS. Note that phenotype alone is not sufficient — the Marfan systemic score
    was only 5 in one molecularly confirmed proband.
  evidence:
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all have truncating mutations within a 71-bp segment at the 3′ end of the FBN1 coding region, displaying tight genotype-phenotype correlation"
    explanation: The tight genotype-phenotype correlation is what makes variant position diagnostic.
  - reference: PMID:26860060
    reference_title: "Marfanoid-progeroid-lipodystrophy syndrome: a newly recognized fibrillinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that this previously unknown genotype/phenotype relationship constitutes a new fibrillinopathy"
    explanation: Establishes the genotype-phenotype relationship as the basis for recognizing the entity.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the clinical symptoms were consistent with previous cases and the genetic mutation was confirmed, we believe that this case can be definitively diagnosed as a case of MFLS."
    explanation: Illustrates that definitive diagnosis rests on clinical features plus molecular confirmation.
differential_diagnoses:
- name: Wiedemann-Rautenstrauch (neonatal progeroid) syndrome
  description: >-
    MFLS patients were repeatedly diagnosed at birth as having neonatal progeroid
    syndrome / Wiedemann-Rautenstrauch syndrome, and the syndrome is still often
    reported under the "NPS" label in the asprosin literature. The distinguishing
    features are the later emergence of marfanoid and ocular signs, and the 3' FBN1
    genotype.
  evidence:
  - reference: PMID:24613577
    reference_title: "Neonatal progeroid variant of Marfan syndrome with congenital lipodystrophy results from mutations at the 3' end of FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 16-year-old girl with neonatal progeroid features and congenital lipodystrophy who was considered at birth as a possible variant of Wiedemann-Rautenstrauch syndrome."
    explanation: Documents the initial misdiagnosis that makes this the leading differential.
  - reference: PMID:20979188
    reference_title: "Marfan syndrome with neonatal progeroid syndrome-like lipodystrophy associated with a novel frameshift mutation at the 3' terminus of the FBN1-gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition also known as Wiedemann-Rautenstrauch syndrome is a rare disorder characterized by accelerated aging and lipodystrophy from birth, poor postnatal weight gain, and characteristic facial features."
    explanation: Describes the overlapping presentation.
- name: Classic Marfan syndrome
  description: >-
    Classic FBN1-related Marfan syndrome shares the skeletal, ocular, and aortic
    features but lacks congenital generalized lipodystrophy and the progeroid
    facial appearance. The separating variable is FBN1 variant position and its NMD
    consequence. See the Marfan_Syndrome entry.
  evidence:
  - reference: PMID:31774634
    reference_title: "Genetic and molecular mechanism for distinct clinical phenotypes conveyed by allelic truncating mutations implicated in FBN1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allelic truncating mutations of FBN1 could cause either classical Marfan syndrome (MFS) or a more complicated phenotype associated with Marfanoid-progeroid-lipodystrophy syndrome (MPLS)."
    explanation: States the allelic relationship between the two entities directly.
- name: Other congenital generalized lipodystrophies
  description: >-
    Berardinelli-Seip congenital lipodystrophy (AGPAT2, BSCL2) and other
    generalized lipodystrophies present with near-absent adipose tissue but are
    characteristically complicated by severe insulin resistance,
    hypertriglyceridemia, hepatic steatosis, and diabetes — precisely the
    complications absent in MFLS. Sequencing of the classic lipodystrophy and
    progeria genes was negative in the index MFLS patient.
  evidence:
  - reference: PMID:20979188
    reference_title: "Marfan syndrome with neonatal progeroid syndrome-like lipodystrophy associated with a novel frameshift mutation at the 3' terminus of the FBN1-gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not find a mutation in genes known to be associated with congenital lipodystrophy (APGAT2, BSCL2, CAV1, PTRF-CAVIN, PPARG, LMNB2) or with Hutchinson-Gilford progeria (ZMPSTE24, LMNA/C)."
    explanation: Documents exclusion of the other congenital lipodystrophy and progeria genes.
animal_models:
- name: FBN1 C-terminal truncation rabbit (CRISPR/Cas9)
  species: Rabbit
  genotype: FBN1 heterozygous C-terminal truncation
  publication: PMID:29666143
  description: >-
    A CRISPR/Cas9 rabbit engineered with a C-terminal fibrillin-1 truncation,
    generated specifically because existing FBN1 knockout and dominant-negative
    mouse models do not reproduce the MFLS genotype-phenotype relationship.
  evidence:
  - reference: PMID:29666143
    reference_title: "Truncated C-terminus of fibrillin-1 induces Marfanoid-progeroid-lipodystrophy (MPL) syndrome in rabbit."
    supports: SUPPORT

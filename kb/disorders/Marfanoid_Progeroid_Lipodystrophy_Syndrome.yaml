pathophysiology:
- name: FBN1 3' Truncating Variant Escaping Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A heterozygous frameshift or splice-site variant in the
    penultimate FBN1 exon, its donor site, or the final intron places the
    premature termination codon 3' of the last 50 nucleotides of the penultimate
    exon. This is the canonical position at which the exon-junction-complex rule
    that triggers nonsense-mediated mRNA decay no longer applies, so the mutant
    transcript is spared. This is the single molecular difference that separates
    MFLS from the many Marfan-causing FBN1 premature-termination alleles, which
    are degraded by NMD and therefore act by haploinsufficiency.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  genetic_context:
    gene:
      preferred_term: FBN1
      term:
        id: hgnc:3603
        label: FBN1
    allele_type: frameshift or splice-site truncating variant at the FBN1 3' terminus
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Plasma asprosin in affected individuals falls further than heterozygosity
      alone predicts, and overexpression of the truncated protein in wild-type
      cells suppresses asprosin secretion — direct evidence of a dominant-negative
      effect on the wild-type allele rather than simple haploinsufficiency.
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant FBN1 transcript
    modifier: DECREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  evidence:
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All seven mutations occur 3′ to the last 50 nt of the penultimate exon and are therefore predicted to escape mRNA nonsense-mediated decay (NMD), leading to expression of a mutant, truncated profibrillin protein"
    explanation: States the NMD-escape rule and its consequence for all seven original probands.
  - reference: PMID:31774634
    reference_title: "Genetic and molecular mechanism for distinct clinical phenotypes conveyed by allelic truncating mutations implicated in FBN1."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We further predict that the MPLS truncating mutation, and others previously reported, is prone to escape the nonsense-mediated decay (NMD), while MFS mutations are predicted to be subjected to NMD."
    explanation: Explicitly contrasts NMD escape in MPLS with NMD susceptibility in classic Marfan syndrome.
  - reference: PMID:21594993
    reference_title: "Progeroid facial features and lipodystrophy associated with a novel splice site mutation in the final intron of the FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This phenotype which is different from that of classical Marfan syndrome could be caused by a truncated FBN1 protein which could escape nonsense-mediated RNA decay."
    explanation: The earliest statement of the NMD-escape hypothesis, from the final-intron splice-site proband.
  downstream:
  - target: Stable Truncated Profibrillin-1 with an Altered C-Terminus
    causal_link_type: DIRECT
    description: >-
      Escape from NMD permits translation of a stable, C-terminally truncated
      profibrillin-1 protein.
    evidence:

- name: Reduced Hepatic Glucose Release with Preserved Insulin Sensitivity
  biological_scale: ORGANISM
  description: >-
    Asprosin is recruited to the liver, where it activates a G-protein-cAMP-PKA
    pathway and drives hepatic glucose release; loss of function lowers glucose and
    insulin secondary to reduced hepatic glucose production. This is the node that
    explains the single most counterintuitive feature of MFLS: unlike generalized
    lipodystrophies in general — which characteristically cause severe insulin
    resistance, hypertriglyceridemia, hepatic steatosis, and diabetes — MFLS
    patients have low fasting insulin and remain euglycemic and insulin-sensitive
    despite near-absent adipose tissue.

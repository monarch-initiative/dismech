- name: Congenital Generalized Lipodystrophy and Extreme Leanness
  biological_scale: TISSUE
  description: >-
    The convergent clinical endpoint of the asprosin arm. Adipose tissue is
    profoundly reduced from birth, giving both the generalized lipodystrophy and
    the sunken, aged facial appearance that earned the syndrome its "progeroid"
    label. Two mechanisms plausibly converge here and are not fully separated in
    the literature: the reduced orexigenic drive above, and a direct role for
    fibrillin-1 in the adipose extracellular-matrix niche during adipogenesis.
    Fibrillin-1 is expressed as mesenchymal stem cells enter adipogenesis and
    declines as adipocytes mature, and the region of FBN1 affected in
    FBN1-associated lipodystrophy is highly conserved — but the proposal that low
    fibrillin-1 causes a failure to differentiate adipocytes is explicitly flagged
    by its authors as not yet demonstrated experimentally, and is framed for
    reduced fibrillin-1 rather than for the stable dysfunctional protein MFLS
    actually produces.

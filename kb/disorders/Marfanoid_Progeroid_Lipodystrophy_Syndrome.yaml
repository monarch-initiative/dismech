    reference_title: "Genetic and molecular mechanism for distinct clinical phenotypes conveyed by allelic truncating mutations implicated in FBN1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both mutations appear to upregulate SMAD2 phosphorylation in vitro."
    explanation: Direct in vitro measurement of increased TGF-beta-SMAD2 signaling for the MPLS allele.
  - reference: PMID:24039054
    reference_title: "Severe congenital lipodystrophy and a progeroid appearance: Mutation in the penultimate exon of FBN1 causing a recognizable phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "this new progeroid syndrome represents a neomorphic phenotype caused by truncated transcripts with an extremely charged protein motif that escapes from nonsense-mediated mRNA decay, altering FBN1-TGF beta signaling"
    explanation: >-
      Supports altered FBN1-TGF-beta signaling as the proposed mechanism, but is an

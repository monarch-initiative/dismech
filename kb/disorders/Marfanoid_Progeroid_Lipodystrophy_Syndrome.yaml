inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported cases are heterozygous for an FBN1 variant. De novo origin is
    documented in the probands where parental samples were reported (including
    the two in the asprosin discovery paper, the 2011 exon-64 frameshift case,
    and the 2023 Japanese trio); parental testing is not reported for every
    published case, so "invariably de novo" is an inference from the reported
    subset rather than an established fact. No multiplex family has been
    reported.
  evidence:
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome and Sanger sequencing identified de novo, heterozygous 3′ truncating mutations in FBN1 in both patients"
    explanation: Confirms heterozygous, de novo FBN1 truncating variants as the molecular basis.
  - reference: PMID:21594992
    reference_title: "Further evidence for a marfanoid syndrome with neonatal progeroid features and severe generalized lipodystrophy due to frameshift mutations near the 3' end of the FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "novel heterozygous, de novo, c.8156_8175del, p.Lys2719ThrfsX12, frameshift mutation in exon 64 of his FBN1 gene"
    explanation: A second independent proband with a heterozygous de novo frameshift in the penultimate exon.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than a few dozen molecularly confirmed individuals have been reported.
    The 2016 review that named the entity collected seven unrelated patients from
    six reports published between 2000 and 2014; the 2023 Japanese case report
    counted eight previously reported cases, and scattered single-case reports
    have accrued since, including the first Chinese proband in 2019.
  evidence:
  - reference: PMID:26860060
    reference_title: "Marfanoid-progeroid-lipodystrophy syndrome: a newly recognized fibrillinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review six previous reports between 2000 and 2014 of seven unrelated patients with mutations in the FBN1 gene affecting function."
    explanation: Establishes the very small size of the reported case series at the time the entity was named.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, eight cases of MFLS associated with heterozygous variants near the 3’ terminus of the FBN1 gene have been reported"
    explanation: An independent later count of the total published case series.
progression:
- phase: Prenatal and neonatal
  age_range: Fetal life to birth
  notes: >-
    Fetal growth restriction and preterm birth are common, and both the
    generalized lipodystrophy and the progeroid facial appearance are present
    from birth.
  evidence:
  - reference: PMID:20979188
    reference_title: "Marfan syndrome with neonatal progeroid syndrome-like lipodystrophy associated with a novel frameshift mutation at the 3' terminus of the FBN1-gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a 25-year-old woman with pronounced generalized lipodystrophy and a progeroid aspect since birth"
    explanation: Documents the congenital onset of both defining features.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MFLS is characterized by clinical features including fetal growth retardation, birth before 40 weeks, generalized lack of subcutaneous fat, hyperextensible joints, long fingers, and severe myopia"
    explanation: Summarizes the prenatal/perinatal onset features of the syndrome.
- phase: Infancy and childhood
  age_range: Infancy through childhood
  notes: >-
    A characteristic dissociation emerges between accelerated linear growth and
    poor weight gain, so tall stature and the marfanoid habitus develop while body
    weight stays very low.
  evidence:
  - reference: PMID:24039054
    reference_title: "Severe congenital lipodystrophy and a progeroid appearance: Mutation in the penultimate exon of FBN1 causing a recognizable phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the cardinal features of these patients include (1) congenital lipodystrophy, (2) premature birth with an accelerated linear growth disproportionate to the weight gain, and (3) a progeroid appearance with distinct facial features"
    explanation: Defines the cardinal natural-history triad including the characteristic growth dissociation.
- phase: Adolescence and adulthood
  age_range: Second decade onward
  notes: >-
    Ocular and aortic manifestations of the marfanoid arm typically declare
    themselves later; lens subluxation was the finding that prompted FBN1 testing
    in one proband at age 16.
  evidence:
  - reference: PMID:21594992
    reference_title: "Further evidence for a marfanoid syndrome with neonatal progeroid features and severe generalized lipodystrophy due to frameshift mutations near the 3' end of the FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He subsequently was diagnosed with bilateral lens subluxations at the age of 16 years which prompted analysis of the FBN1 gene."
    explanation: Illustrates the delayed emergence of the ocular marfanoid features relative to the neonatal lipodystrophy.
genetic:
- name: FBN1
  association: >-
    Heterozygous, de novo truncating (frameshift or splice-site) variants confined
    to a short segment at the extreme 3' end of the FBN1 coding region — the
    penultimate exon, its splice donor site, and the final intron.
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: Positive
  gene_term:
    preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  notes: >-
    The pathogenic mechanism is not haploinsufficiency. Because the variants lie
    3' of the last 50 nucleotides of the penultimate exon, the mutant transcript
    escapes nonsense-mediated decay and a stable truncated profibrillin-1 is
    expressed; this is captured structurally as functional_impact_category
    DOMINANT_NEGATIVE on the initiating pathophysiology node. Reported alleles
    include c.8155_8156del, c.8156_8175del (p.Lys2719Thrfs*12), c.8175_8182del8
    (p.Arg2726Glufs*9), the splice variants c.8226+1G>A, c.8226+1G>T and
    c.8226+5G>A, and p.Glu2759Cysfs*9.

    Exon numbering differs between reports and is a recurring source of
    confusion. The earlier case reports and the 2016 naming review place the
    frameshifts in "exon 64", described as the penultimate exon; the asprosin
    papers and the 2023 Japanese case report, using NM_000138.5, place the same
    region at exons 65-66 with the splice variants in intron 65. The stable
    description is positional: the penultimate exon and the final intron, i.e.
    the last 71 bp of coding sequence.

    ClinGen's Gene-Disease Validity curation for FBN1 covers Marfan syndrome
    (MONDO:0007947, Definitive) and does not separately assert MFLS, so no ClinGen
    assertion is cited here.
  evidence:
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all have truncating mutations within a 71-bp segment at the 3′ end of the FBN1 coding region, displaying tight genotype-phenotype correlation"
    explanation: Establishes the tight clustering of causal variants in a 71-bp 3' segment of FBN1.
  - reference: PMID:26860060
    reference_title: "Marfanoid-progeroid-lipodystrophy syndrome: a newly recognized fibrillinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations occurred in exon 64 of the FBN1 gene."
    explanation: The naming review confirms a single shared exon across the original seven patients (numbered exon 64 in that report's convention).
  - reference: PMID:27087445
    reference_title: "Asprosin, a Fasting-Induced Glucogenic Protein Hormone."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We tested this concept by overexpressing the truncated, mutant version of profibrillin in WT cells and found that this interfered with the ability of those cells to secrete asprosin into the media"
    explanation: Direct in vitro support for the dominant-negative functional impact assigned to this gene-disease relationship.
  - reference: PMID:24613577
    reference_title: "Neonatal progeroid variant of Marfan syndrome with congenital lipodystrophy results from mutations at the 3' end of FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo donor splice-site mutation (c.8226+1G>A) was identified in FBN1."
    explanation: Documents the splice-donor class of causal allele alongside the frameshift class.
  - reference: PMID:37845262
    reference_title: "A case of Marfanoid-progeroid-lipodystrophy syndrome: experimental proof of skipping exons and escaping nonsense-mediated decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, five cases had exonic insertion or deletion variants causing a frameshift in exon 65 or 66 of FBN1. The other three cases had intronic single-nucleotide substitutions"

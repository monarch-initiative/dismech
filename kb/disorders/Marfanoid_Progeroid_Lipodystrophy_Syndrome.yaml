- name: Reduced Central Orexigenic Drive
  biological_scale: CELLULAR
  description: >-
    Circulating asprosin crosses the blood-brain barrier and directly activates
    orexigenic AgRP-positive arcuate neurons through a cAMP-dependent pathway,
    which in turn inhibits anorexigenic POMC neurons via GABA. Asprosin-deficient
    patients are hypophagic, consuming fewer calories than matched peers, and the
    corresponding mouse model shows both hypophagia and AgRP neuron hypoactivity
    that is rescued by recombinant asprosin. Hypophagia, rather than adipocyte
    failure alone, is therefore a substantive contributor to the leanness of MFLS.

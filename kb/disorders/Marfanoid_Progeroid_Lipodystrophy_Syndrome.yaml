name: Marfanoid-Progeroid-Lipodystrophy Syndrome
creation_date: "2026-08-17T09:00:00Z"
category: Mendelian
parents:
- Progeroid syndrome
- Hereditary disorder of connective tissue
- Congenital lipodystrophy
synonyms:
- MFLS
- MPLS
- MPL syndrome
- Marfan lipodystrophy syndrome
- Marfanoid-progeroid syndrome
- Progeroid and marfanoid aspect-lipodystrophy syndrome
- Neonatal progeroid variant of Marfan syndrome
description: >-
  Marfanoid-progeroid-lipodystrophy syndrome (MFLS) is an ultra-rare, usually de
  novo autosomal dominant fibrillinopathy caused by heterozygous truncating FBN1
  variants clustered in a short segment at the extreme 3' end of the coding
  region — the penultimate exon, its splice donor site, and the final intron. It
  combines partial manifestations of Marfan syndrome — marfanoid habitus,
  arachnodactyly, ectopia lentis, severe myopia, aortic root dilation, dural
  ectasia — with two features that classic Marfan syndrome does not have:
  congenital generalized lipodystrophy present from birth, and a progeroid facial
  appearance of neonatal onset.

  What distinguishes MFLS from classic Marfan syndrome is mechanistic, not merely
  a matter of severity. Most Marfan-causing FBN1 premature termination alleles
  are degraded by nonsense-mediated mRNA decay and act through haploinsufficiency
  of the microfibrillar matrix. The MFLS alleles lie 3' of the last 50
  nucleotides of the penultimate exon, escape nonsense-mediated decay, and are
  therefore translated into a stable truncated profibrillin-1. That truncated
  protein does two things at once. Through the microfibril / TGF-beta arm shared
  with Marfan syndrome it perturbs fibrillin-1 assembly and increases
  TGF-beta-SMAD2 signaling, producing the marfanoid, ocular, and aortic features.
  Through an arm unique to this entity it disrupts the furin cleavage site at the
  profibrillin C-terminus and so ablates production of asprosin, the
  140-amino-acid C-terminal cleavage product that circulates as a fasting-induced
  glucogenic and orexigenic hormone. Asprosin deficiency explains the metabolic
  phenotype that separates MFLS from every other lipodystrophy: hypophagia,
  extreme leanness, low fasting insulin, and preserved insulin sensitivity and
  euglycemia, rather than the insulin resistance and diabetes typical of
  generalized lipodystrophies.

  This entry is deliberately kept separate from the Marfan_Syndrome entry, which
  models the classic FBN1 microfibril/TGF-beta disease; the shared arm is
  expressed here as conformance to the aortopathy_tgfbeta_dysregulation module
  rather than by duplicating that entry. Note also that the "progeroid" label is
  descriptive of facial appearance: affected individuals have not been shown to
  undergo accelerated systemic aging, and MFLS is not a laminopathy.

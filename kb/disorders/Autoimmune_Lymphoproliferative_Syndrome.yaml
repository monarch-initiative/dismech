name: Autoimmune Lymphoproliferative Syndrome
creation_date: '2026-08-19T12:00:00Z'
category: Mendelian
description: >
  Autoimmune lymphoproliferative syndrome (ALPS) is an inborn error of immunity in
  which lymphocytes fail to undergo Fas-mediated apoptosis. Because the FAS death
  receptor pathway is what normally removes activated and autoreactive lymphocytes
  once an immune response has resolved, a defect in it produces the syndrome's
  defining triad: chronic non-malignant lymphoproliferation (lymphadenopathy and
  splenomegaly), autoimmunity directed mainly at blood cells, and an expanded
  population of alpha-beta double-negative (CD3+ CD4- CD8-) T cells that has no normal
  clearance route. Lymphoma risk is raised lifelong.

  ALPS is classified by genotype rather than by organ or clinical course. Germline
  heterozygous FAS variants account for most cases (ALPS-FAS); somatic FAS variants
  confined to the double-negative T-cell compartment (ALPS-sFAS) explain a substantial
  further share and are the reason the disease long looked non-Mendelian; FASLG and
  CASP10 defects are rare; and a residual group with the phenotype but no identified
  lesion is designated ALPS-U.

  This root entry carries only what holds for ALPS as a whole — the genotype-based
  classification axis, the shared apoptosis-defect mechanism, and the shared
  consequences. The FAS-specific detail, including diagnostics and management, is not
  re-derived here: see `FAS-related_Autoimmune_Lymphoproliferative_Syndrome.yaml`.
  `CTLA4_Haploinsufficiency.yaml` and `CD27-related_lymphoproliferative_and_immune_disorder.yaml`
  cover ALPS-like disorders that reach a similar phenotype by other routes.
disease_term:
  preferred_term: autoimmune lymphoproliferative syndrome
  term:
    id: MONDO:0017979
    label: autoimmune lymphoproliferative syndrome
synonyms:
- ALPS
- Canale-Smith syndrome
categories:
- Inborn Error of Immunity
- Immune Dysregulation
- Lymphoproliferative Disorder
parents:
- Primary Immunodeficiency
- Autoimmune Disorder
- Lymphoproliferative Disorder

classifications:
  iuis_category:
    classification_value: immune dysregulation
    notes: >-
      IUIS phenotypic classification, diseases of immune dysregulation — the group that
      contains ALPS and the ALPS-like disorders. Matches the classification already
      recorded on `FAS-related_Autoimmune_Lymphoproliferative_Syndrome.yaml`.

inheritance:
- name: Autosomal dominant (germline FAS, incomplete penetrance)
  description: >-
    Most ALPS is caused by a heterozygous germline FAS variant acting through a
    dominant-negative mechanism on the trimeric death receptor. Penetrance is markedly
    incomplete: healthy relatives frequently carry the same variant, which is why a
    second, somatic hit in the double-negative T-cell compartment is thought to be
    required for overt disease in many families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29911256
    reference_title: >-
      The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand
      Functions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ALPS-FAS was the first description of a monogenic cause of autoimmunity, but its non-Mendelian expression remained elusive until the description of somatic and germline mutations in ALPS patients."
    explanation: >-
      States the non-Mendelian behaviour of ALPS-FAS explicitly and attributes its
      resolution to the recognition of combined somatic and germline variants.

has_subtypes:
- name: ALPS-FAS
  display_name: ALPS-FAS (germline FAS defect)
  classification: genetic
  description: >-
    The commonest form, caused by germline FAS variants impairing Fas-mediated
    apoptosis. Historically ALPS type Ia. Fully curated in
    `FAS-related_Autoimmune_Lymphoproliferative_Syndrome.yaml`.
  subtype_term:
    preferred_term: FAS-related autoimmune lymphoproliferative immune disorder
    term:
      id: MONDO:1060194
      label: FAS-related autoimmune lymphoproliferative immune disorder
  genes:
  - preferred_term: FAS
    term:
      id: hgnc:11920
      label: FAS
- name: ALPS-sFAS
  display_name: ALPS-sFAS (somatic FAS defect)
  classification: genetic
  description: >-
    Caused by somatic FAS variants restricted to the double-negative T-cell
    compartment rather than present in the germline. Clinically indistinguishable from
    ALPS-FAS but not transmitted, and missed by germline-only sequencing of unsorted
    blood. No separate MONDO term is bound here: MONDO does not currently carve the
    somatic form out from FAS-related ALPS.
  genes:
  - preferred_term: FAS
    term:
      id: hgnc:11920
      label: FAS
- name: ALPS-FASLG
  display_name: ALPS-FASLG (FAS ligand defect)
  classification: genetic
  description: >-
    Rare, and usually biallelic. Homozygous FASLG variants abolish FasL cytotoxicity
    and produce early-onset severe ALPS; heterozygous variants impair FasL function
    biochemically but generally do not produce the ALPS biomarker profile, so
    heterozygous loss of function is better tolerated for FASLG than for FAS.
  genes:
  - preferred_term: FASLG
    term:
      id: hgnc:11936
      label: FASLG
  evidence:
  - reference: PMID:36621650
    reference_title: >-
      Revisiting autoimmune lymphoproliferative syndrome caused by Fas ligand mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous FASLG variants abrogated cytotoxicity and resulted in early-onset severe ALPS with elevated DNT, raised vitamin B12, and usually no soluble FasL."
    explanation: >-
      Establishes the zygosity asymmetry that defines this subtype: homozygous FASLG
      abrogates cytotoxicity and causes severe early-onset ALPS.
  - reference: PMID:36621650
    reference_title: >-
      Revisiting autoimmune lymphoproliferative syndrome caused by Fas ligand mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous loss-of-function mutations are better tolerated for FASLG than for FAS, which may explain the low frequency of ALPS-FASLG."
    explanation: >-
      The authors' own conclusion explaining why ALPS-FASLG is rare, and a caution
      against calling heterozygous FASLG variants causal.
- name: ALPS-CASP10
  display_name: ALPS-CASP10 (caspase-10 defect)
  classification: genetic
  description: >-
    Rare autosomal dominant form with incomplete penetrance caused by CASP10 variants
    acting downstream of the Fas receptor, historically ALPS type IIa. Presents with
    the same double-negative T-cell expansion, autoimmune cytopenias and chronic
    lymphadenopathy as ALPS-FAS.
  subtype_term:
    preferred_term: autoimmune lymphoproliferative syndrome type 2A
    term:
      id: MONDO:0011383
      label: autoimmune lymphoproliferative syndrome type 2A
- name: ALPS-U
  display_name: ALPS-U (undetermined genetic defect)
  classification: genetic
  description: >-
    Patients meeting the diagnostic criteria for ALPS, including the required
    double-negative T-cell expansion and defective in-vitro apoptosis, in whom no
    causative lesion in the Fas pathway has been identified. Retained as an explicit
    category by the revised classification rather than treated as undiagnosed disease.

pathophysiology:
- name: Defective Fas-Mediated Lymphocyte Apoptosis
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion in every genetically defined form of ALPS is loss of function
    somewhere in the FAS death receptor pathway — the receptor itself (FAS), its ligand
    (FASLG), or the downstream initiator caspase (CASP10). Engagement of Fas by FasL
    normally assembles a death-inducing signalling complex and triggers extrinsic
    apoptosis; in ALPS that signal fails. Most germline FAS variants act in a
    dominant-negative fashion, which is why heterozygosity suffices for FAS while
    FASLG generally requires biallelic loss.
  genes:
  - preferred_term: FAS
    term:
      id: hgnc:11920
      label: FAS
    modifier: LOSS_OF_FUNCTION
  - preferred_term: FASLG
    term:
      id: hgnc:11936
      label: FASLG
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: extrinsic apoptotic signaling pathway via death domain receptors
    term:
      id: GO:0008625
      label: extrinsic apoptotic signaling pathway via death domain receptors
    modifier: DECREASED
  evidence:
  - reference: PMID:36621650
    reference_title: >-
      Revisiting autoimmune lymphoproliferative syndrome caused by Fas ligand mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function FAS or FASLG mutations cause autoimmune-lymphoproliferative syndrome (ALPS) characterized by expanded double-negative T cells (DNT) and elevated serum biomarkers."
    explanation: >-
      States the causal lesion (loss of function in FAS or FASLG) and names the
      resulting cellular hallmark in the same sentence.
  - reference: PMID:29911256
    reference_title: >-
      The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand
      Functions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic etiology of the ALPS was described in 1995 by the discovery of the FAS gene mutations."
    explanation: >-
      Anchors FAS as the founding genetic aetiology of the syndrome.
  downstream:
  - target: Failure of Lymphocyte Homeostasis and Accumulation of Autoreactive Cells
    causal_link_type: DIRECT
    description: >-
      Fas-mediated apoptosis is the mechanism that contracts an activated lymphocyte
      pool once antigen is cleared and deletes autoreactive clones in the periphery.
      Losing it leaves both populations in place.
    evidence:
    - reference: PMID:29911256
      reference_title: >-
        The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand
        Functions.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The related apoptosis defect accounts for the accumulation of autoreactive lymphocytes as well as for specific clinical and biological features that distinguish the ALPS-FAS from other monogenic defects of this apoptosis pathway, such as FADD and CASPASE 8 deficiencies."
      explanation: >-
        Directly attributes the accumulation of autoreactive lymphocytes to the
        apoptosis defect.

- name: Failure of Lymphocyte Homeostasis and Accumulation of Autoreactive Cells
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Lymphocytes that should have been deleted persist. Two consequences follow and
    together define the syndrome. First, the surviving pool includes autoreactive
    clones, producing autoimmunity that is directed predominantly at blood cells rather
    than at solid organs. Second, a normally rare population of alpha-beta T cells that
    have lost both CD4 and CD8 expands markedly, because Fas-mediated deletion is
    precisely the route by which these cells are normally removed. That expansion is
    the diagnostic hallmark of ALPS rather than an incidental finding.
  biological_processes:
  - preferred_term: lymphocyte homeostasis
    term:
      id: GO:0002260
      label: lymphocyte homeostasis
    modifier: LOSS_OF_FUNCTION
  - preferred_term: activation-induced cell death of T cells
    term:
      id: GO:0006924
      label: activation-induced cell death of T cells
    modifier: DECREASED
  evidence:
  - reference: PMID:29911256
    reference_title: >-
      The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand
      Functions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autoimmune lymphoproliferative syndrome (ALPS) is a non-malignant and non-infectious uncontrolled proliferation of lymphocytes accompanied by autoimmune cytopenia."
    explanation: >-
      Characterises ALPS as uncontrolled, non-malignant, non-infectious lymphocyte
      proliferation accompanied by autoimmune cytopenia — the two arms of this node.
  - reference: PMID:36621650
    reference_title: >-
      Revisiting autoimmune lymphoproliferative syndrome caused by Fas ligand mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function FAS or FASLG mutations cause autoimmune-lymphoproliferative syndrome (ALPS) characterized by expanded double-negative T cells (DNT) and elevated serum biomarkers."
    explanation: >-
      Names expanded double-negative T cells as the characteristic cellular consequence.
  downstream:
  - target: Chronic Lymphoproliferation, Autoimmune Cytopenias and Lymphoma Risk
    causal_link_type: DIRECT
    description: >-
      The accumulated lymphocyte mass presents clinically as chronic lymphadenopathy and
      splenomegaly, the autoreactive fraction as multilineage cytopenias, and the
      undeleted long-lived B-cell pool as a lifelong excess risk of lymphoma.
    evidence:
    - reference: PMID:20538792
      reference_title: >-
        Revised diagnostic criteria and classification for the autoimmune
        lymphoproliferative syndrome (ALPS): report from the 2009 NIH International
        Workshop.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autoimmune lymphoproliferative syndrome (ALPS) is a human genetic disorder of lymphocyte apoptosis resulting in an accumulation of lymphocytes and childhood onset chronic lymphadenopathy, splenomegaly, multilineage cytopenias, and an increased risk of B-cell lymphoma."
      explanation: >-
        Lists the clinical consequences of the apoptosis defect as a single causal
        statement, including the raised lymphoma risk.

- name: Chronic Lymphoproliferation, Autoimmune Cytopenias and Lymphoma Risk
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical syndrome. Lymphadenopathy and splenomegaly are chronic, non-malignant
    and non-infectious, which is what distinguishes ALPS from the lymphoma and infection
    it mimics; the cytopenias are immune-mediated and multilineage; and the lymphoma
    risk persists for life, so resolution of childhood lymphoproliferation does not end
    surveillance.
  evidence:
  - reference: PMID:20538792
    reference_title: >-
      Revised diagnostic criteria and classification for the autoimmune
      lymphoproliferative syndrome (ALPS): report from the 2009 NIH International
      Workshop.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune lymphoproliferative syndrome (ALPS) is a human genetic disorder of lymphocyte apoptosis resulting in an accumulation of lymphocytes and childhood onset chronic lymphadenopathy, splenomegaly, multilineage cytopenias, and an increased risk of B-cell lymphoma."
    explanation: >-
      The definitional statement of the clinical phenotype from the criteria paper.


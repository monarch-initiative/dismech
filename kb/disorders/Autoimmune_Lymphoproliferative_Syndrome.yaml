diagnosis:
- name: Alpha-Beta Double-Negative T Cell Quantification
  description: >-
    Flow-cytometric measurement of circulating CD3+ TCR-alpha/beta+ CD4- CD8- T cells.
    An expanded double-negative T-cell population in the presence of chronic
    non-malignant lymphoproliferation is the required cellular criterion for ALPS, and
    the same compartment is where somatic FAS variants are found — so sorting it before
    sequencing is what makes ALPS-sFAS detectable.
  evidence:
  - reference: PMID:36621650
    reference_title: >-
      Revisiting autoimmune lymphoproliferative syndrome caused by Fas ligand mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function FAS or FASLG mutations cause autoimmune-lymphoproliferative syndrome (ALPS) characterized by expanded double-negative T cells (DNT) and elevated serum biomarkers."
    explanation: >-
      Names expanded double-negative T cells and elevated serum biomarkers as the
      characteristic diagnostic profile of ALPS.

discussions:
- discussion_id: alps_scope_after_2009_reclassification
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Defective Fas-Mediated Lymphocyte Apoptosis"
  prompt: >-
    Which ALPS-like disorders belong inside the ALPS concept, and which are separate
    diseases that merely share its phenotype?
  rationale: >-
    The 2009 NIH revision narrowed ALPS to defects of the Fas apoptosis pathway and
    moved several conditions that had carried ALPS type numbers out of the syndrome —
    caspase-8 deficiency (historically ALPS type IIb) and RAS-associated autoimmune
    leukoproliferative disease (historically ALPS type IV) are the clearest cases,
    PRKCD-related type 3 disease is a third, and CTLA4 haploinsufficiency and CD27
    deficiency reach an ALPS-like phenotype without a Fas-pathway lesion at all. MONDO
    still carries several of these as descendants of
    `MONDO:0017979`, so the ontology and the clinical classification disagree. This
    entry follows the narrow Fas-pathway definition and binds only Fas-pathway subtypes,
    but the boundary is a curation decision rather than a settled fact, and it
    determines whether the KB's ALPS-like entries should be members here or siblings.
  evidence:
  - reference: PMID:29911256
    reference_title: >-
      The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand
      Functions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The related apoptosis defect accounts for the accumulation of autoreactive lymphocytes as well as for specific clinical and biological features that distinguish the ALPS-FAS from other monogenic defects of this apoptosis pathway, such as FADD and CASPASE 8 deficiencies."
    explanation: >-
      Explicitly distinguishes ALPS-FAS from other monogenic defects of the same
      apoptosis pathway, which is the distinction the scope question turns on.

notes: >
  Scope. A thin root over an already-curated subtree.
  `FAS-related_Autoimmune_Lymphoproliferative_Syndrome.yaml` holds the FAS-specific
  pathophysiology, diagnostics and treatment in depth; this entry binds MONDO:0017979
  and carries the genotype classification axis and the shared apoptosis-defect chain
  once. No treatment section is curated here on purpose — management (sirolimus,
  mycophenolate, the avoidance of splenectomy) is subtype- and severity-driven and is
  already curated on the FAS entry.

  Subtype term binding. ALPS-FAS and ALPS-CASP10 are bound to MONDO terms whose causal
  gene was verified against the MONDO record (`RO:0004003` HGNC:11920 FAS and HGNC:1500
  CASP10 respectively). ALPS-sFAS and ALPS-U are deliberately left unbound: MONDO does
  not separate the somatic form from FAS-related ALPS, and ALPS-U is by definition a
  residual category. ALPS-FASLG is likewise unbound — no MONDO term was found that
  specifically denotes the FASLG form.

  Deliberately excluded. Caspase-8 deficiency (MONDO:0011804, historically ALPS type
  IIb) and RAS-associated autoimmune leukoproliferative disease (MONDO:0013767,
  historically ALPS type IV, NRAS/KRAS) are MONDO descendants of ALPS but were moved out
  of the syndrome by the 2009 reclassification and are not curated as subtypes here.
  CTLA4 haploinsufficiency (MONDO:0014493) is likewise a MONDO descendant but is an
  ALPS-like disorder of a different mechanism and already has its own entry. The
  remaining two MONDO descendants, type 3 ALPS (MONDO:8000023) and its PRKCD-caused form
  (MONDO:8000024), are also excluded: PRKCD deficiency is conventionally an ALPS-like
  disorder rather than one of the 2009 NIH Fas-pathway subtypes. The exclusion list is
  therefore complete against MONDO's current descendants of MONDO:0017979. See the
  `alps_scope_after_2009_reclassification` discussion.

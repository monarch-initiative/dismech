- name: Altered Apoptosome Activation
  role: central_effector
  description: >-
    Cytochrome c activates the apoptosome and downstream caspases. Biochemical studies of mature-protein
    G41S, Y48H and A51V report enhanced apoptosome activation. Thr20Ile instead reduces caspase-3/7
    activity in engineered MEG-01 cells and lysates. This downstream readout does not directly establish
    defective apoptosome assembly for Thr20Ile. The effect on platelet production is still a hypothesis.
  biological_scale: MOLECULAR
  genes:

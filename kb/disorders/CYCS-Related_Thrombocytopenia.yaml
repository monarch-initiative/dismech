- name: Dysregulated Megakaryocyte Platelet Release
  role: central_effector
  description: >-
    In the G41S Cargeeg family, extravascular marrow contains platelet-like structures lacking the
    normal marginal microtubule coil. Premature release outside marrow vessels is proposed to reduce
    effective circulating platelet output. Patient-derived megakaryocytes can nevertheless form proplatelets
    normally in culture, implicating marrow context. These observations are not a proven universal
    mechanism for every CYCS allele.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: megakaryocyte

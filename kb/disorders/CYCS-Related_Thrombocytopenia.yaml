    explanation: The caspase readout is reduced.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The effects of the variant p.(Thr20Ile) on markers of blood cell differentiation were studied
      in MEG‐01 p.(Thr20Ile) knock‐in clones. The variant did not affect: (1) adhesion, shape and
      size assessed by regular light microscope inspection; (2) ploidy and CD41 and CD61 cell surface
      antigen expression assessed by flow cytometry (Figures S2 and S3). Out of the analysed surface
      markers, only CD9 expression was increased by 40% in SC1 (p = 0.003) and by 31% in SC3 (p =
      0.022) MEG‐01 p.(Thr20Ile) knock‐in clones compared to wt (Figure S3). The platelet immunophenotype
      of patient IV‐2 was normal (data not shown).
    explanation: >-
      The full results distinguish increased CD9 from unchanged differentiation and morphology readouts;
      the patient platelet immunophenotype was normal.

      circulation in the Cargeeg family.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cycs_marrow_release_model
phenotypes:
- name: Thrombocytopenia
  category: Hematologic
  description: >-
    Persistent isolated thrombocytopenia is usually mild to moderate, but severe reduction also occurs.
    Platelet size and morphology are generally preserved. Bleeding tendency varies and is often mild.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:38815995
    reference_title: 'Thrombocytopenia 4 (THC4): Six novel families with mutations of the cytochrome c gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild-to-moderate thrombocytopenia, normal platelet size, and function, low risk of bleeding,
      and no additional clinical phenotypes associated with reduced platelet count.
    explanation: >-
      The 2024 six-family series supports the typical mild-to-moderate, largely nonsyndromic phenotype;
      this is not a claim that every CYCS family has normal platelet function.
  - reference: PMID:35126455
    reference_title: >-
      A Novel Heterozygous Pathogenic Variation in CYCS Gene Cause Autosomal Dominant Non-Syndromic
      Thrombocytopenia 4 in a Large Chinese Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The platelet counts of the patients were varied, ranging from 38 to 110 × 109/L (reference
      range: 150-450 x 109/L).
    explanation: A three-generation CYCS family documents reduced platelet counts in affected individuals.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite severe thrombocytopenia, bleeding episodes have rarely been reported.
    explanation: >-
      The Thr20Ile daughter demonstrates that severe thrombocytopenia can coexist with limited bleeding.

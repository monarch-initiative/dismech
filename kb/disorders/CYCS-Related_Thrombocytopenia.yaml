- name: Altered Cytochrome c Conformation
  role: central_effector
  description: >-
    Pathogenic cytochrome c substitutions alter local stability and conformational dynamics without
    necessarily disrupting the overall fold. Human G41S, Y48H and A51V show greater conformational
    flexibility associated with enhanced apoptosome activation. G41S does not produce the same mobility
    change in the mouse protein. Mature-protein G41S, Y48H and A51V correspond to initiator-inclusive
    Gly42Ser, Tyr49His and Ala52Val.
  biological_scale: MOLECULAR
  gene:
    preferred_term: CYCS
    term:
      id: hgnc:19986
      label: CYCS
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33480393
    reference_title: >-
      Altered structure and dynamics of pathogenic cytochrome c variants correlate with increased
      apoptotic activity.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Molecular dynamics simulations of these variants, and two non-naturally occurring variants
      (G41A, G41T), indicate that increased apoptosome activation correlates with the increased overall
      flexibility of cytochrome c, particularly movement of the Ω loops.
    explanation: >-
      Molecular dynamics supports a structure-activity association; induced-fit binding to Apaf-1
      remains an interpretation.
  - reference: PMID:31557440
    reference_title: >-
      Naturally Occurring A51V Variant of Human Cytochrome c Destabilizes the Native State and Enhances
      Peroxidase Activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A 1.82 Å structure of the A51V variant shows only minor changes in tertiary structure relative
      to the wild-type (WT) protein.
    explanation: Crystallography supports a local perturbation rather than gross unfolding.
  - reference: PMID:38472487
    reference_title: >-
      Altered conformational dynamics contribute to species-specific effects of cytochrome c mutations
      on caspase activation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The G41S mutation increases main chain RSMD in human but not mouse cytochrome c (Fig. 2 B and
      D).
    explanation: >-
      The primary molecular-dynamics comparison demonstrates species-dependent structural effects;
      the source spells the metric RSMD in this sentence.
  downstream:
  - target: Altered Apoptosome Activation
    description: >-
      Greater conformational flexibility correlates with enhanced apoptosome activation for the tested
      mature-protein G41S, Y48H and A51V variants. This proposed relation does not imply a universal
      direction for other alleles.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - cycs_caspase_platelet_model
  - target: Enhanced Cytochrome c Peroxidase Activity
    description: >-
      Several tested substitutions also increase purified-protein peroxidase activity, but this effect
      does not track native-state flexibility in the same way as apoptosome activation.
    causal_link_type: UNKNOWN

mechanistic_hypotheses:
- hypothesis_group_id: cycs_caspase_platelet_model
  hypothesis_label: Variant-dependent caspase dysregulation impairs platelet biogenesis
  status: EMERGING
  description: >-
    Altered apoptosome/caspase regulation may disrupt platelet production. Both increased and decreased
    readouts have been observed; the causal bridge remains unresolved.
- hypothesis_group_id: cycs_marrow_release_model
  hypothesis_label: Premature extravascular platelet release
  status: EMERGING
  description: >-
    Cargeeg-family marrow observations support premature release outside vessels as a cause of low
    circulating platelets; applicability to other alleles is uncertain.
discussions:
- discussion_id: cycs_variant_and_model_dependence
  kind: KNOWLEDGE_GAP
  prompt: How do opposite caspase and respiratory responses converge on thrombocytopenia?
  attaches_to:
  - pathophysiology#Altered Apoptosome Activation
  - pathophysiology#Altered Respiratory Electron Transfer
  - pathophysiology#Enhanced Cytochrome c Peroxidase Activity
  rationale: >-
    Thr20Ile megakaryoblasts differ from the older G41S/Y48H cell models. Variant identity, species,
    cell lineage and stimulation conditions may all matter. Purified-protein peroxidase enhancement
    is not sufficient evidence of a platelet-production mechanism. No universal respiratory-loss
    or apoptosis-gain pathway is established.
  evidence:
  - reference: PMID:33480393
    reference_title: >-
      Altered structure and dynamics of pathogenic cytochrome c variants correlate with increased
      apoptotic activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The role of cytochrome c in platelet formation, and the molecular mechanism underlying the
      association of cytochrome c mutations with thrombocytopenia remains unknown, although a gain-of-function
      is most likely.
    explanation: The earlier mechanistic study explicitly identifies the unresolved disease link.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, the variant abates caspase activation, contrasting with previously known effects
      of other CYCS variants.
    explanation: The subsequent Thr20Ile data challenge a universal gain-of-apoptosis account.
  - reference: PMID:31557440
    reference_title: >-
      Naturally Occurring A51V Variant of Human Cytochrome c Destabilizes the Native State and Enhances
      Peroxidase Activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Recent in vivo studies indicate that the enhanced peroxidase activity of the THC4-linked Cytc
      variants is unlikely the cause of THC4.
    explanation: >-
      The introduction summarizes prior in-vivo studies; the current paper did not perform a new
      animal experiment. BACKGROUND distinguishes this evidence from its own biochemical results.
    quote_role: BACKGROUND
- discussion_id: cycs_proplatelet_context
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is proplatelet formation preserved in one patient-derived culture study but defective in
    preliminary registry observations?
  attaches_to:
  - pathophysiology#Dysregulated Megakaryocyte Platelet Release
  rationale: >-
    The Cargeeg study found normal proplatelet formation in culture. NCT07026578 describes preliminary
    progenitor cultures with preserved megakaryocyte maturation but defective proplatelets, and reduced
    cytochrome c with resistance to induced apoptosis in patient platelets. These registry observations
    are not posted trial results or a peer-reviewed replication. Variant and culture differences
    remain unresolved.
  evidence:
  - reference: clinicaltrials:NCT07026578
    reference_title: >-
      Unravelling the Role of Apoptosis in Platelets Biogenesis Through the Study of the CYCS Mut-associated
      Thrombocytopenia THC4
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Hematopoietic progenitors from 3 patients were differentiated in megakaryocytes. Maturation
      and differentiation were comparable between THC4 and healthy controls. Instead, their capability
      to form proplatelets was profoundly defective.
    explanation: >-
      Preliminary sponsor observations differ from the Cargeeg cultures; the registry does not establish
      why.
  - reference: clinicaltrials:NCT07026578
    reference_title: >-
      Unravelling the Role of Apoptosis in Platelets Biogenesis Through the Study of the CYCS Mut-associated
      Thrombocytopenia THC4
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, the expression of cytC was found reduced in platelets of all analyzed patients.
      Platelets showed no signs of early death. Instead, when stimulated with ABT-737, they showed
      inability to undergo apoptosis, suggesting that CYCS mutations confer resistance to apoptosis.
    explanation: Preliminary ex-vivo platelet data, not a therapeutic ABT-737 trial.

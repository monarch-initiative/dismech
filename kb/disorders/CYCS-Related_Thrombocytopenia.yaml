name: CYCS-Related Thrombocytopenia
category: Mendelian
creation_date: '2026-07-06T01:49:38Z'
synonyms:
- Thrombocytopenia 4
- THC4
- CYCS thrombocytopenia
- Autosomal dominant non-syndromic thrombocytopenia 4
- Autosomal isolated thrombocytopenia with normal platelet size
description: >-
  CYCS-related thrombocytopenia (thrombocytopenia 4, THC4) is an autosomal dominant inherited platelet
  disorder caused by heterozygous CYCS variants, including missense substitutions and an in-frame
  deletion. Most reported families have isolated mild-to-moderate thrombocytopenia with normal platelet
  size and little bleeding, although severe platelet-count reduction and neonatal intracranial hemorrhage
  have been reported. Cytochrome c participates in mitochondrial electron transfer and apoptosome
  activation. Functional effects differ by variant and experimental system: several variants reduce
  respiration or enhance apoptosis, whereas Thr20Ile increases respiration and reduces caspase activation
  in engineered megakaryoblasts. How these effects disrupt platelet production remains incompletely
  resolved.
classifications:
  icimd_category:
  - classification_value: cytochrome_c
    notes: >-
      CYCS encodes the soluble electron carrier cytochrome c rather than a cytochrome c oxidase structural
      subunit or assembly factor. The clinical entity is thrombocytopenia 4 (MONDO:0012775; OMIM:612004),
      distinct from mitochondrial Complex IV deficiency.

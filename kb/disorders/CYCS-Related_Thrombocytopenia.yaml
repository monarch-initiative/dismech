    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27479822
    reference_title: >-
      Whole exome sequencing identifies genetic variants in inherited thrombocytopenia with secondary
      qualitative function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All results following platelet function testing and WES were reported back to the referring
      hematology consultants to aid in genetic counselling and disease management.
    explanation: >-
      A broader inherited-thrombocytopenia cohort supports using molecular findings for counseling;
      it is not a CYCS-specific treatment trial.
- name: Clinical observation for limited bleeding
  description: >-
    Published Thr20Ile cases were followed without thrombocytopenia-directed medication when bleeding
    was limited. This is case-based management evidence, not a universal recommendation or a validated
    surveillance schedule.
  evidence:
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no pathology in white blood count, and no other bleeding episodes. Thus, the proband
      was without medication.
    explanation: The proband was observed without medication despite persistent thrombocytopenia.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She was followed from 2012 to 2021 without requiring any medication.
    explanation: >-
      The affected daughter initially required no medication; later treatment addressed concurrent
      autoimmune disease.
notes: >-
  CYCS encodes cytochrome c, a soluble respiratory electron carrier with apoptotic functions; THC4
  should not be conflated with cytochrome c oxidase assembly deficiency. Clinical reports generally
  describe a nonsyndromic platelet disorder. Concurrent hemophilia, autoimmune disease or infection
  in individual families does not establish these as CYCS manifestations. Tolerance of aspirin and
  clopidogrel after stroke in one reported carrier is not evidence that antiplatelet drugs treat
  THC4 or are uniformly safe in it.
diagnosis:
- name: Blood count and platelet morphology
  description: >-
    Persistent isolated thrombocytopenia with generally normal platelet size and morphology, especially
    with affected relatives, supports an inherited platelet disorder. Normal morphology does not
    exclude CYCS-related disease.
  evidence:
  - reference: PMID:41455048
    reference_title: >-
      CYCS-related thrombocytopenia in three Japanese families with a novel variant in one family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients showed no or mild bleeding tendency, with preserved platelet size and morphology,
      and without other abnormalities in blood cell lineages.
    explanation: The Japanese series describes the characteristic hematologic findings.
- name: CYCS sequencing and familial segregation
  description: >-
    A congenital thrombocytopenia panel or exome sequencing can identify a CYCS variant; segregation
    and variant-level evidence inform interpretation. Familial disease can be misdiagnosed as immune
    thrombocytopenia.
  evidence:
  - reference: PMID:41455048
    reference_title: >-
      CYCS-related thrombocytopenia in three Japanese families with a novel variant in one family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing should be considered in unexplained familial thrombocytopenia.
    explanation: The clinical series supports molecular testing in this setting.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His condition was initially misdiagnosed as idiopathic thrombocytopenic purpura.
    explanation: >-
      The full case description documents initial misclassification before recognition of familial
      thrombocytopenia.

    reference_title: >-
      Megakaryocytes from CYCS mutation-associated thrombocytopenia release platelets by both proplatelet-dependent
      and -independent processes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      platelet-like structures within the extravascular bone marrow space have the dimensions of
      platelets but lack the marginal microtubule coil, suggesting abnormal proplatelet-independent
      platelet release.
    explanation: >-
      Marrow observations support abnormal extravascular platelet-like release in the Cargeeg family.
  - reference: PMID:27861742
    reference_title: >-
      Megakaryocytes from CYCS mutation-associated thrombocytopenia release platelets by both proplatelet-dependent
      and -independent processes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the low platelet phenotype in Thrombocytopenia Cargeeg subjects is caused by premature release
      of platelets into non-vascular regions of the bone marrow.
    explanation: >-
      The source proposes this mechanism specifically for the studied family, while the intracellular
      link remains unresolved.
  downstream:
  - target: Thrombocytopenia
    description: >-

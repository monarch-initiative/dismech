clinical_trials:
- name: NCT07026578
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Observational mechanistic study of cytochrome c abundance, apoptosis and platelet biogenesis
    in THC4. The registry describes preliminary patient-cell observations, not therapeutic efficacy
    results.
  notes: >-
    The registry status was last verified in April 2025 and last updated in June 2025. The estimated
    June 2026 completion date is not evidence of actual completion. No results are posted in the
    cached registry record.
  evidence:
  - reference: clinicaltrials:NCT07026578
    reference_title: >-
      Unravelling the Role of Apoptosis in Platelets Biogenesis Through the Study of the CYCS Mut-associated
      Thrombocytopenia THC4
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since thrombocytopenia is the only phenotypic manifestation of CYCS mutations, the investigators
      believe that THC4 represents a unique model for deciphering the role of Cytc and apoptosis
      in megakaryopoiesis and platelet biogenesis.

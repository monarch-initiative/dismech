    affected family member. Lys101del reduces cytochrome c abundance in a yeast model. These observations
    do not establish universal CYCS haploinsufficiency.
  biological_scale: MOLECULAR
  gene:
    preferred_term: CYCS
    term:
      id: hgnc:19986
      label: CYCS
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of CYCS was decreased in: (A) SC1 and SC3 MEG-01 p.(Thr20Ile) knock-in clones compared
      to wt
    explanation: Two engineered megakaryoblast clones had reduced cytochrome c abundance.
  - reference: PMID:39191490
    reference_title: >-
      A novel thrombocytopenia-4-causing CYCS gene variant decreases caspase activity: Three-generation
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and was also reduced to 43% (p < 0.002) in platelets from thrombocytopenic patient IV-2 compared
      to healthy controls (Figure 3B).
    explanation: >-
      Patient IV-2 had reduced cytochrome c expression relative to healthy controls; this single-patient
      measurement is not a cohort-wide biomarker validation.
  - reference: PMID:30051457
    reference_title: >-
      A novel CYCS mutation in the α-helix of the CYCS C-terminal domain causes non-syndromic thrombocytopenia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using the yeast model system, we clearly demonstrated that this one amino acid deletion (in-frame)
      resulted in significantly reduced cytochrome c protein expression and functional defects in
      the mitochondrial respiratory chain, indicating that the loss of function of cytochrome c underlies
      thrombocytopenia.
    explanation: >-
      The Lys101del yeast system supports reduced abundance and respiratory function, without proving
      a uniform effect across alleles.
- name: Altered Respiratory Electron Transfer
  role: central_effector
  description: >-
    Cytochrome c transfers electrons in the mitochondrial respiratory chain. G41S/Y48H models and
    Lys101del yeast show reduced respiratory function; by contrast, a Thr20Ile knock-in MEG-01 clone
    shows increased basal and maximal respiration. Cellular oxygen consumption measures the integrated
    respiratory phenotype and does not isolate the electron-transfer rate of each mutant protein.
    Respiratory abnormalities have not been established as a sufficient cause of thrombocytopenia.
  biological_scale: CELLULAR
  genes:

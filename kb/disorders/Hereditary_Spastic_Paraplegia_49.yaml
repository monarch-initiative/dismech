genetic:
- name: TECPR2
  notes: >-
    TECPR2 encodes a tectonin beta-propeller repeat-containing ATG8-binding protein.
    Missense variants make up nearly half of the disease-associated alleles and cluster in
    the N- and C-terminal beta-propeller regions, and classifying them by ACMG criteria is
    explicitly noted as difficult - several previously published candidate missense
    variants have since been reclassified as of uncertain significance.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TECPR2
    term:
      id: hgnc:19957
      label: TECPR2
  evidence:
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The discovered TECPR2 mutation implicates autophagy, a central intracellular mechanism, in spastic paraparesis."
    explanation: Original identification of TECPR2 as the causal gene.
  - reference: PMID:33847017
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite constituting nearly half of disease-associated TECPR2 variants, classifying missense variants as (likely) pathogenic according to ACMG criteria remains challenging."
    explanation: Documents the variant-interpretation difficulty central to diagnosing this disorder.
  - reference: PMID:38436550
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we reviewed previously published candidate TECPR2 missense variants to clarify clinical outcomes and variant classification using current approved guidelines, classifying a number of published variants as of uncertain significance"
    explanation: >-
      Confirms that previously reported missense variants have been downgraded to VUS,
      which bears directly on how the literature's genotype claims should be read.
  variants:
  - name: c.3416delT
    description: >-
      The founder frameshift allele identified homozygously in Jewish Bukharian families in
      the original 2012 description.
    evidence:
    - reference: PMID:26542466
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TECPR2 was first described as a disease causing gene when the c.3416delT frameshift mutation was found in five Jewish Bukharian patients with similar features."
      explanation: Names the founder allele and its population of origin.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    More than 30 individuals identified as of the GeneReviews chapter. The disorder was
    initially thought to be confined to Jewish Bukharian families, and the discovery of
    unrelated non-Bukharian patients suggests it is underdiagnosed rather than genuinely
    that restricted.
  evidence:
  - reference: PMID:36137062
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, more than 30 individuals with TECPR2-HSAN with ID have been identified."
    explanation: GeneReviews case count.
  - reference: PMID:26542466
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The discovery of additional mutations in non-Bukharian patients implies that this disease might be more common than previously appreciated"
    explanation: Supports underdiagnosis rather than true restriction to one population.
  - reference: PMID:35130874
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present case reports the first instance of HSP49 detected in China."
    explanation: >-
      Extends the reported geographic range well beyond the founder population, consistent
      with underdiagnosis outside the populations where the disorder was first described.
- population: Ashkenazi Jewish
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 645.2
  notes: >-
    Estimated pathogenic-variant carrier frequency of 1 in 155 in the Ashkenazi Jewish
    population, against 1 in 1221 in the general population. Note this is an estimate
    derived from variant data, not an observed carrier screen, and 1/155 is a
    strikingly high figure for a disorder with only ~30 reported patients - which is
    itself an argument that the condition is underdiagnosed or that some counted alleles
    are less penetrant than assumed.
  evidence:
  - reference: PMID:33847017
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We estimate a pathogenic variant carrier frequency of 1/1221 in the general and 1/155 in the Jewish Ashkenazi populations."
    explanation: Source of both carrier-frequency estimates.
- population: General population
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 81.9
  notes: Estimated pathogenic-variant carrier frequency of 1 in 1221 in the general population.
  evidence:
  - reference: PMID:33847017
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We estimate a pathogenic variant carrier frequency of 1/1221 in the general and 1/155 in the Jewish Ashkenazi populations."
    explanation: Source of the general-population carrier-frequency estimate.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying treatment. Management is supportive and explicitly aimed

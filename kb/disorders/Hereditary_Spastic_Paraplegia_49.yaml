inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic TECPR2 variants. The founder allele c.3416delT was identified homozygously in
    Jewish Bukharian families; subsequent patients from unrelated non-Bukharian families
    carry other alleles, so the disorder is not restricted to that population.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36137062
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TECPR2-HSAN with ID is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the inheritance pattern.
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified one homozygous variant shared among all affected individuals and absent in controls: a 1 bp frameshift TECPR2 deletion leading to a premature stop codon and predicting significant degradation of the protein."
    explanation: The original homozygous founder allele establishing recessive inheritance.
pathophysiology:
- name: TECPR2 Loss of Function
  description: >-
    Biallelic TECPR2 variants reduce or abolish the protein. The founder allele is a 1 bp
    frameshift deletion producing a premature stop codon and predicted protein degradation.
    Missense variants make up nearly half of the disease-associated alleles and cluster in
    the N- and C-terminal beta-propeller repeat regions, which is also why classifying them
    under ACMG criteria is difficult.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TECPR2
    term:
      id: hgnc:19957
      label: TECPR2
  downstream:
  - target: Destabilised COPII Coat and ER Exit Site Failure
    causal_link_type: DIRECT
  - target: Impaired Autophagosome Formation and Cargo Delivery
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 1 bp frameshift TECPR2 deletion leading to a premature stop codon and predicting significant degradation of the protein"
    explanation: Establishes the founder allele as a predicted null.
  - reference: PMID:33847017
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants in TECPR2 are predominantly located in the N- and C-terminal regions containing beta-propeller repeats."
    explanation: Maps the missense allele spectrum onto the beta-propeller domains.
- name: Destabilised COPII Coat and ER Exit Site Failure
  description: >-
    TECPR2 binds trafficking components including the COPII coat protein SEC24D and is
    required to stabilise SEC24D protein levels and maintain functional endoplasmic
    reticulum exit sites. This is not an inference from cell lines alone - TECPR2-deficient
    patient cells show altered SEC24D abundance and reduced ER export efficiency. The
    dependence runs through lipidated LC3C, which is what makes TECPR2 a scaffold joining
    the early secretory pathway to autophagy rather than a component of either alone.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - preferred_term: COPII-coated vesicle budding
    modifier: DECREASED
    term:
      id: GO:0090114
      label: COPII-coated vesicle budding
  cellular_components:
  - preferred_term: endoplasmic reticulum exit site
    term:
      id: GO:0070971
      label: endoplasmic reticulum exit site
  downstream:
  - target: Impaired Autophagosome Formation and Cargo Delivery
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TECPR2 is required for stabilization of SEC24D protein levels, maintenance of functional ER exit sites (ERES), and efficient ER export in a manner dependent on binding to lipidated LC3C."
    explanation: Defines the COPII/ERES arm of TECPR2 function and its LC3C dependence.
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TECPR2-deficient HSP patient cells display alterations in SEC24D abundance and ER export efficiency."
    explanation: Confirms the defect in patient-derived cells, not only in knockdown models.
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these results reveal that TECPR2 functions as molecular scaffold linking early secretion pathway and autophagy"
    explanation: States the scaffold role that couples this node to the autophagy node.
- name: Impaired Autophagosome Formation and Cargo Delivery
  description: >-
    TECPR2 is an ATG8-binding positive regulator of autophagy. Patient fibroblasts show
    reduced SQSTM1/p62 and MAP1LC3B, with a more pronounced fall in the lipidated LC3-II
    form, and attenuated delivery of both LC3B and p62 to the lysosome where they are
    normally degraded. siRNA knockdown reproduces the same changes. Note the direction:
    p62 falls rather than accumulating, which is not the pattern of a simple block in
    autophagosome-lysosome fusion and is consistent instead with a defect upstream, at
    autophagosome formation.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  - preferred_term: autophagosome assembly
    modifier: DECREASED
    term:
      id: GO:0000045
      label: autophagosome assembly
  cellular_components:
  - preferred_term: autophagosome
    term:
      id: GO:0005776
      label: autophagosome
  downstream:
  - target: Sensory and Autonomic Neuron Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Corticospinal Axonopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "found that both protein levels were decreased and that there was a more pronounced decrease in the lipidated form of LC3 (LC3II)"
    explanation: The primary cellular autophagy phenotype in patient fibroblasts.
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "siRNA knockdown of TECPR2 showed similar changes, consistent with aberrant autophagy."
    explanation: Knockdown reproduces the patient-cell phenotype, supporting causality.
  - reference: PMID:23439247
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an attenuated delivery of both LC3B and the cargo-recruiting protein SQSTM1/p62 to the lysosome where they are subject to degradation"
    explanation: Specifies the delivery defect underlying the reduced autophagic flux.
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TECPR2 and LC3C are required for autophagosome formation, possibly through maintaining functional ERES."
    explanation: >-
      Links the autophagy defect mechanistically back to the ER exit site node rather than
      leaving the two as parallel observations.
- name: Sensory and Autonomic Neuron Degeneration
  description: >-
    The dominant clinical burden. Sensory neuropathy with lower-limb hypo- or areflexia and
    ataxic gait combines with autonomic failure - central hypoventilation and apnea,
    gastrointestinal dysmotility, dysphagia and gastroesophageal reflux with recurrent
    aspiration. This is why the disorder is now classified as a hereditary
    sensory-autonomic neuropathy rather than as a spastic paraplegia, and why apnea and
    asphyxia are the leading causes of death.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  evidence:
  - reference: PMID:36137062
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurologic manifestations (muscular hypotonia, sensory neuropathy with lower-limb hypo- or areflexia and ataxic gait), and autonomic dysfunction (including central hypoventilation and apnea, gastrointestinal dysmotility, dysphagia, and gastroesophageal reflux disease with recurrent aspiration)"
    explanation: GeneReviews definition of the sensory and autonomic core of the phenotype.
  - reference: PMID:26542466
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the main disabling feature of this unique disorder is autonomic-sensory neuropathy accompanied by chronic respiratory disease and paroxysmal autonomic events"
    explanation: Identifies autonomic-sensory neuropathy, not spasticity, as the main disabling feature.
  - reference: PMID:26542466
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that the disease should therefore be classified as a new subtype of hereditary sensory-autonomic neuropathy."
    explanation: The explicit reclassification proposal that the current disease name reflects.
- name: Corticospinal Axonopathy
  description: >-
    The feature the SPG49 name was built on. Hereditary spastic paraplegias are defined by
    axonopathy of the corticospinal motor neurons, and spasticity does evolve in patients.
    It is curated here as a real but secondary component: the largest phenotyping cohort
    does not list spasticity among the core manifestations, and the canine TECPR2 model's
    spinal cord lesions spare the motor pathways that most human HSPs involve.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary spastic paraplegias (HSPs) are a diverse group of neurodegenerative diseases that are characterized by axonopathy of the corticospinal motor neurons."
    explanation: Defines the corticospinal lesion that the HSP classification asserts.
  - reference: PMID:26542466
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition to intellectual disability and evolving spasticity the main disabling feature of this unique disorder is autonomic-sensory neuropathy"
    explanation: >-
      Graded PARTIAL deliberately. It confirms spasticity is real and evolving, while
      subordinating it to the autonomic-sensory neuropathy - which is exactly the
      secondary status this node claims.

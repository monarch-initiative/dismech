- name: TECPR2 Exon 8 Skipping Antisense Oligonucleotide (investigational)
  description: >-
    A preclinical, genotype-specific splice-modulation strategy - not an approved therapy.
    The c.1319delT (p.Leu440Argfs*19) frameshift creates a premature stop codon in exon 8.
    Because exon 8 encodes an unstructured 111-amino-acid region and is 333 nucleotides
    long, skipping it restores an in-frame TECPR2 retaining 1,300 of 1,411 residues. The
    lead candidate ASO-005-02 reached ~27 nM potency in patient fibroblasts, and the
    rescued protein kept the punctate neuronal distribution of full-length TECPR2 in
    iPSC-derived neurons - a surrogate for function, not a functional assay. A single 20 mg
    intrathecal dose in cynomolgus monkeys was tolerated with broad CNS distribution and
    detectable exon-8 skipping.

    Two limits are worth stating plainly. First, eligibility is narrow: the strategy only
    helps patients carrying an exon 8 mutation, which the authors estimate at up to a few
    hundred patients worldwide. Second, the chemistry recorded here (2'-O-methyl bases,
    phosphorothioate linkages) is what the source states for the initial 25-mer screening
    set; the optimized lead's final chemistry is not specified in the abstract or the
    quoted text, so treat the chemistry annotation as provisional.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: TECPR2
      term:
        id: hgnc:19957
        label: TECPR2
    target_transcript: TECPR2 mRNA
    target_exon: exon 8
    conjugation: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: TECPR2 Loss of Function
    description: >-
      Removes the premature termination codon by skipping the exon that contains it,
      restoring expression of a shortened but in-frame TECPR2 protein.
    evidence:
    - reference: PMID:35860385
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TECPR2 exon 8 skipping restored in-frame expression of a TECPR2 protein variant (TECPR2ΔEx8) containing 1,300 of 1,411 amino acids."
      explanation: Establishes that the ASO restores in-frame protein expression from the mutant allele.
  evidence:
  - reference: PMID:35860385
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Optimization of ASO sequences generated a lead candidate (ASO-005-02) with ∼27 nM potency in patient-derived fibroblasts."
    explanation: Quantifies lead-candidate potency in patient-derived cells.
  - reference: PMID:35860385
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we used iPSC-derived neurons to analyze the neuronal localization of TECPR2ΔEx8 and showed that this form of TECPR2 retains the distinct, punctate neuronal expression pattern of full-length TECPR2"
    explanation: >-
      Graded PARTIAL - correct subcellular localization is a surrogate for function, not a
      demonstration that the truncated protein performs TECPR2's autophagy or ER-export role.
  - reference: PMID:35860385
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ASO-005-02 had an acceptable tolerability profile in vivo following a single 20-mg intrathecal dose in cynomolgus monkeys, showing some transient non-adverse behavioral effects with no correlating histopathology"
    explanation: Non-human primate tolerability and CNS delivery data supporting further development.
  - reference: PMID:35860385
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "there are currently no available disease-modifying therapies for this disease"
    explanation: >-
      Confirms the investigational status - this ASO is preclinical, and nothing
      disease-modifying is currently available to patients.
animal_models:
- name: Tecpr2 CRISPR-Cas9 knockout mouse
  species: Mouse
  genotype: tecpr2-/- CRISPR-Cas9 knockout
  publication: PMID:33218264
  description: >-
    An engineered null model, complementing the naturally occurring canine missense model.
    It develops age-dependent neuroaxonal dystrophy concentrated in the gracile and cuneate
    nuclei of the medulla oblongata and the dorsal white matter column of the spinal cord,
    with autophagosome accumulation tracking the neurodegeneration.
  genes:
  - preferred_term: TECPR2
    term:
      id: hgnc:19957
      label: TECPR2
  modeled_mechanisms:
  - target: Impaired Autophagosome Formation and Cargo Delivery
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Autophagosome accumulation in affected CNS regions, interpreted by the authors as
      compromised targeting of autophagosomes to the lysosome.
    limitations: >-
      The direction of the autophagy defect differs from the original patient-fibroblast
      report, which found decreased LC3-II and p62 rather than accumulation. Accumulation
      points to a downstream delivery or fusion block; depletion points to a defect at
      formation. The mouse cannot by itself settle which applies in human disease, and the
      two readings are not reconcilable as stated.
    readouts:
    - name: Autophagosome accumulation in medulla oblongata and dorsal spinal tracts
      target: Impaired Autophagosome Formation and Cargo Delivery
      direction: INCREASED
      interpretation: Regional autophagosome accumulation co-localizing with neuroaxonal dystrophy.
      evidence:
      - reference: PMID:33218264
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Age-dependent correlation with accumulation of autophagosomes suggests compromised targeting to lysosome."
        explanation: The measurement and the authors' interpretation of it.
    evidence:
    - reference: PMID:33218264
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our findings establish the tecpr2 knockout mouse as a potential model for SPG49 and ascribe a new role to TECPR2 in macroautophagy/autophagy-related neurodegenerative disorders"
      explanation: The authors' claim that the model is informative for TECPR2-dependent autophagy.
  - target: Sensory and Autonomic Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Degeneration is concentrated in the gracile and cuneate nuclei and dorsal columns -
      the sensory relay pathways - matching the sensory limb of the human disorder, and in
      the medulla, the site relevant to respiratory control.
    limitations: >-
      The report describes behavioural pathologies and regional neurodegeneration but does
      not demonstrate the central hypoventilation or apnea that kill human patients. That
      medullary involvement is anatomically suggestive of a respiratory phenotype is an
      inference, not a measurement made here.
    evidence:
    - reference: PMID:33218264
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "manifested predominantly as neuroaxonal dystrophy in the gracile (GrN) and cuneate nuclei (CuN) of the medulla oblongata in the brainstem and dorsal white matter column of the spinal cord"
      explanation: >-
        Localizes the degeneration to sensory relay and medullary structures; graded PARTIAL
        because no respiratory or autonomic function was measured.
  evidence:
  - reference: PMID:33218264
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report the generation of a novel CRISPR-Cas9 tecpr2 knockout (tecpr2-/-) mouse that exhibits behavioral pathologies observed in SPG49 patients"
    explanation: Establishes the model and its claimed behavioural correspondence to patients.
- name: Spanish Water Dog TECPR2 neuroaxonal dystrophy
  species: Dog
  genotype: TECPR2 c.4009C>T (p.R1337W) homozygous
  publication: PMID:26555167
  description: >-
    A naturally occurring, not engineered, juvenile-onset neuroaxonal dystrophy in Spanish
    Water Dogs, mapped to a homozygous TECPR2 missense variant at a highly conserved
    residue with autosomal recessive segregation. Histopathology shows spheroid formation
    in cerebral, cerebellar and brainstem grey matter and in the sensory pathways of the
    spinal cord, without iron accumulation, and the spheroids contain packed
    double-membraned vesicles identified as autophagosomes.
  genes:
  - preferred_term: TECPR2
    term:
      id: hgnc:19957
      label: TECPR2
  modeled_mechanisms:
  - target: Impaired Autophagosome Formation and Cargo Delivery
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the tissue-level correlate that human patient fibroblast studies cannot:
      autophagosome accumulation within axonal spheroids in an intact nervous system.
    limitations: >-
      A missense allele, not a null, so residual TECPR2 function is likely and the severity
      is not calibrated against human genotypes. The autophagosome identification is
      immunohistochemical and ultrastructural rather than a flux measurement, so it shows
      accumulation without establishing where in the pathway the block sits.
    readouts:
    - name: Autophagosome content of axonal spheroids
      target: Impaired Autophagosome Formation and Cargo Delivery
      direction: INCREASED
      interpretation: >-
        Accumulated double-membraned vesicles within spheroids, consistent with disturbed
        autophagic turnover in vivo.
      evidence:
      - reference: PMID:26555167
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ultrastructurally spheroids contained predominantly closely packed vesicles with a double-layered membrane, which were characterized as autophagosomes using immunohistochemistry."
        explanation: The ultrastructural and immunohistochemical basis for the readout.
    evidence:
    - reference: PMID:26555167
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunohistochemistry and the ultrastructural findings further support the assumption, that TECPR2 regulates autophagosome accumulation in the autophagic pathways."
      explanation: Supports the model as informative for TECPR2-dependent autophagy in vivo.
  - target: Sensory and Autonomic Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The canine lesions involve the sensory pathways of the spinal cord, matching the
      sensory limb of the human disorder.
    limitations: >-
      The published comparison notes the canine lesions spare the motor pathways that most
      human HSPs involve, and no autonomic phenotype - hypoventilation, apnea, GI
      dysmotility - is reported for the dogs. So the model covers the sensory limb of the
      human disease but not the autonomic one, which is the limb that drives human
      mortality.
    evidence:
    - reference: PMID:26555167
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Histopathology demonstrated spheroid formation accentuated in the grey matter of the cerebral hemispheres, the cerebellum, the brain stem and in the sensory pathways of the spinal cord."
      explanation: >-
        Documents sensory pathway involvement, graded PARTIAL because the autonomic
        features of the human disease are not among the reported canine findings.
  - target: Corticospinal Axonopathy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The canine disease does not reproduce the corticospinal motor involvement that the
      HSP classification of the human disorder asserts.
    limitations: >-
      The authors state directly that the canine lesions differ from most human HSPs in
      sparing the motor pathways. Note this cuts both ways as evidence: read as a model
      limitation it is a species difference, but read alongside the human cohort data
      showing spasticity is not a core manifestation, it is a point of agreement that the
      corticospinal component of this disorder is weaker than its SPG49 name implies.
    evidence:
    - reference: PMID:26555167
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to the canine NAD, the spinal cord lesions in most types of human HSP involve the sensory and the motor pathways."
      explanation: Explicit statement that the canine lesions do not involve the motor pathways.
  evidence:
  - reference: PMID:26555167
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a perfectly associated, single, non-synonymous coding variant in the canine tectonin beta-propeller repeat-containing protein 2 (TECPR2) gene affecting a highly conserved region was detected (c.4009C>T or p.R1337W)"
    explanation: Establishes the causal TECPR2 variant underlying the canine model.
  - reference: PMID:26555167
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This canine NAD form displays etiologic parallels to an inherited TECPR2 associated type of human hereditary spastic paraparesis (HSP)."
    explanation: The authors' own statement of the model's relevance to the human disorder.
discussions:
- discussion_id: tecpr2_autophagy_direction_conflict
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does TECPR2 loss block autophagosome formation or autophagosome clearance? The
    published readouts point in opposite directions, and the answer determines what a
    therapeutic readout should even measure.
  attaches_to:
  - pathophysiology#Impaired Autophagosome Formation and Cargo Delivery
  rationale: >-
    The original patient-fibroblast study found reduced LC3-II and reduced SQSTM1/p62 with
    attenuated delivery of both to the lysosome - a pattern consistent with a defect at
    autophagosome formation, since a pure clearance block would make p62 accumulate.
    Every in vivo model reports the opposite: autophagosomes pile up in axonal spheroids
    in the Spanish Water Dog and in the medulla and dorsal columns of the Tecpr2 knockout
    mouse, and the mouse authors read this as compromised targeting to the lysosome. The
    mechanistic work adds a third strand, placing TECPR2 at ER exit sites where it would
    act upstream at formation. These are not obviously reconcilable. Possible explanations
    include a cell-type difference between fibroblasts and neurons, a difference between
    an early formation defect and a late accumulation of stalled structures over years of
    neuronal life, or an artefact of measuring steady-state levels rather than flux. The
    practical consequence is concrete: an ASO or other therapy would need a validated
    autophagy readout, and it is currently unclear whether increased or decreased LC3-II
    should count as rescue.
  evidence:
  - reference: PMID:23176824
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "found that both protein levels were decreased and that there was a more pronounced decrease in the lipidated form of LC3 (LC3II)"
    explanation: The patient-fibroblast finding - decreased, not accumulated, autophagy markers.
  - reference: PMID:33218264
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Age-dependent correlation with accumulation of autophagosomes suggests compromised targeting to lysosome."
    explanation: >-
      Graded REFUTE against the formation-defect reading - the mouse shows accumulation and
      the authors interpret it as a clearance defect, the opposite direction.
  - reference: PMID:26431026
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TECPR2 and LC3C are required for autophagosome formation, possibly through maintaining functional ERES."
    explanation: Independent mechanistic support for a defect at formation rather than clearance.
- discussion_id: tecpr2_disease_name_mismatch
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should MONDO:0014016 continue to be labelled a hereditary spastic paraplegia when the
    accumulated phenotype data identify sensory-autonomic neuropathy with intellectual
    disability as the dominant burden and do not list spasticity among core manifestations?
  attaches_to:
  - pathophysiology#Corticospinal Axonopathy
  - phenotypes#Spastic Paraplegia
  rationale: >-
    This is a nomenclature problem with clinical consequences, not a filing dispute. The
    SPG49 name came from a single five-patient founder family in 2012. Three independent
    lines of evidence since then point the other way: the authors of the second patient
    series proposed reclassification as a hereditary sensory-autonomic neuropathy;
    the largest phenotyping cohort's core manifestation list omits spasticity;
    and the canine TECPR2 model's spinal lesions spare the motor pathways. A clinician
    searching under a spastic paraplegia label may not think to monitor for central
    hypoventilation, and apnea is a leading cause of death here. What is genuinely
    unresolved is whether the corticospinal involvement is a real but minor component or
    an artefact of the founder cohort's particular presentation - answering that needs
    prospective natural history data with systematic pyramidal examination, which the
    largest cohort explicitly sets up but does not yet provide.
  evidence:
  - reference: PMID:26542466
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that the disease should therefore be classified as a new subtype of hereditary sensory-autonomic neuropathy."
    explanation: The explicit reclassification proposal from the second patient series.
  - reference: PMID:33847017
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This sets the stage for future prospective natural history studies."
    explanation: >-
      The largest cohort identifies prospective natural history data as the missing piece,
      which is what would settle the weight of the corticospinal component.

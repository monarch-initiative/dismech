name: Hereditary Spastic Paraplegia 49
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- SPG49
- TECPR2-related hereditary sensory and autonomic neuropathy with intellectual disability
- TECPR2-HSAN with ID
- Neuropathy, hereditary sensory and autonomic, type IX, with developmental delay
- HSAN9
- TECPR2 hereditary spastic paraplegia
- Autosomal recessive spastic paraplegia 49
description: >-
  Biallelic TECPR2 variants cause an autosomal recessive neurodevelopmental and
  neurodegenerative disorder first described in five Jewish Bukharian individuals in 2012
  and named spastic paraplegia 49 (SPG49). TECPR2 is a tectonin beta-propeller protein
  that binds ATG8-family proteins and scaffolds the early secretory pathway to autophagy:
  it stabilises the COPII coat protein SEC24D, maintains functional endoplasmic reticulum
  exit sites, and is required with LC3C for autophagosome formation. Loss of TECPR2 gives
  patient fibroblasts reduced LC3B and SQSTM1/p62 with attenuated delivery to the
  lysosome, placing the disease among the congenital disorders of autophagy.

  The name is a historical artefact and is the main thing to understand about this entry.
  As more non-Bukharian patients were found, the dominant clinical burden turned out to be
  sensory and autonomic neuropathy with intellectual disability - central hypoventilation
  and apnea, gastroesophageal reflux with recurrent aspiration, dysmotility, dysphagia,
  areflexia and ataxic gait - rather than corticospinal spasticity. The largest cohort
  (17 new plus 11 published individuals) lists developmental delay/intellectual
  disability, muscular hypotonia, ataxia, hyporeflexia, respiratory infections and
  central/nocturnal hypopnea as the core manifestations, and spasticity is not among them.
  The field and GeneReviews now use "TECPR2-related hereditary sensory and autonomic
  neuropathy with intellectual disability"; MONDO:0014016 still carries the HSP label.
  This entry is bound to that MONDO term because that is the concept being curated, but a
  reader should not expect a pure spastic paraplegia phenotype.

  Apnea and asphyxia are the two most common causes of death, which is what makes the
  respiratory and autonomic features the management priority rather than the gait.

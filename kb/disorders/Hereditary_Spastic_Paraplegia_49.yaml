- name: Avoidance of Respiratory Depressants
  description: >-
    Drugs that cause decreased consciousness, hypopnea or CO2 retention - benzodiazepines
    and antihistamines are the named examples - are to be avoided, or used only at low
    doses with close monitoring. This follows directly from central hypoventilation being a
    core feature and apnea a leading cause of death.

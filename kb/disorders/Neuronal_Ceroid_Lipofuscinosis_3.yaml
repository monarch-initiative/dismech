- name: Experimental TRPML1 agonist lysosomal-storage rescue
  description: >
    Pharmacological activation of the lysosomal calcium channel TRPML1
    (MCOLN1) partially reverses the CLN3 lysosomal storage phenotype in a
    human CLN3-knockout retinal pigment epithelial cell model, reducing
    storage of globotriaosylceramide and mitochondrial ATP synthase subunit c.
    The rescue is incomplete — bis(monoacylglycero)phosphate levels were not
    restored — and this is an in vitro proof-of-concept only, with no human
    data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: CLN3 endolysosomal membrane dysfunction
    treatment_effect: INHIBITS
    description: >-
      TRPML1 activation reduces the lysosomal storage burden that defines the
      CLN3 endolysosomal storage phenotype.
  evidence:
  - reference: PMID:39080379
    reference_title: "TRPML1 activation ameliorates lysosomal phenotypes in CLN3 deficient retinal pigment epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Activation of TRPML1 reduced lysosomal storage of Gb3 and SubC"
    explanation: >
      In a human CLN3-knockout RPE cell model, TRPML1 activation reduced
      lysosomal storage of the classic CLN3 storage materials, supporting
      TRPML1 as an emerging investigational therapeutic target.

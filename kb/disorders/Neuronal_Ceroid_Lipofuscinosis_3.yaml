biochemical:
- name: Mitochondrial ATP synthase subunit c storage
  presence: INCREASED
  context: >
    The characteristic storage material in CLN3 disease is subunit c of
    mitochondrial ATP synthase (SubC), which accumulates in lysosomes alongside
    other lipids. This lysosomal SubC storage is recapitulated in a human
    CLN3-knockout retinal pigment epithelial cell model.
  evidence:
  - reference: PMID:39080379
    reference_title: "TRPML1 activation ameliorates lysosomal phenotypes in CLN3 deficient retinal pigment epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      show lysosomal storage of mitochondrial ATPase subunit C (SubC),
      globotriaosylceramide (Gb3), and glycerophosphodiesters
    explanation: >
      A human CLN3-knockout RPE cell model shows lysosomal storage of
      mitochondrial ATP synthase subunit c, the classic NCL storage material.
  - reference: PMID:33137890
    reference_title: "Current Insights in Elucidation of Possible Molecular Mechanisms of the Juvenile Form of Batten Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      one of the subunits of this enzyme (namely, C) accumulates in lysosomal
      inclusions, which is one of the distinctive signs of Batten disease
    explanation: >
      This CLN3/JNCL review identifies lysosomal accumulation of ATP synthase
      subunit c as a distinctive hallmark of Batten disease in patients,
      corroborating the cell-model finding.
- name: Vacuolated lymphocytes on peripheral blood film
  presence: PRESENT
  context: >
    Cytoplasmic vacuolation of circulating lymphocytes, visible by light
    microscopy on a routine peripheral blood film, is the classic and most
    accessible bedside screening marker for CLN3 disease. It is relatively
    specific to CLN3 among the neuronal ceroid lipofuscinoses and is
    accompanied by fingerprint lysosomal inclusions on ultrastructural study.
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vacuolated lymphocytes and lysosomal (fingerprint) inclusions on blood
      film
    explanation: >
      This detailed CLN3 patient study records vacuolated lymphocytes with
      fingerprint lysosomal inclusions on blood film as a diagnostic finding.
  - reference: PMID:33137890
    reference_title: "Current Insights in Elucidation of Possible Molecular Mechanisms of the Juvenile Form of Batten Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "lymphocyte vacuoles in blood by light microscopy"
    explanation: >
      This CLN3/JNCL review confirms light-microscopic detection of lymphocyte
      vacuoles in blood as an accessible diagnostic step.
pathophysiology:
- name: CLN3 endolysosomal membrane dysfunction
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >
    CLN3 dysfunction perturbs endolysosomal membrane biology, lysosomal cargo
    handling, and cholesterol trafficking. The resulting lysosomal storage
    phenotype includes fingerprint inclusions in patient material and
    cholesterol accumulation in late endosome/lysosome fractions, contributing
    to progressive retinal and neuronal degeneration.

progression:
- phase: Early visual onset
  age_range: 4 to 10 years
  notes: >
    Classic juvenile CLN3 typically starts with rapidly progressive visual loss
    from retinal degeneration. A meta-analysis screening nine natural-history
    studies (423 patients) puts the weighted mean age at onset of vision loss,
    pooled from four of those studies, at 6.1 (± 1.6) years (N = 254) —
    significantly younger than all other core symptoms in the pooled timeline
    (PMID:41501856).
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation is typically in early childhood with vision loss at 4 to 10 years of age"
    explanation: >
      This CLN3 ocular phenotype paper summarizes the usual first clinical
      phase of juvenile CLN3 disease.
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From four studies, we calculated a weighted mean of 6.1 ± 1.6 years (N= 254), which was a significantly younger age than all other symptoms"
    explanation: >
      Data pooled from four of the screened natural-history studies (N = 254)
      confirm vision loss as the earliest and most tightly clustered core
      symptom onset in classic CLN3 disease.
- phase: Cognitive and behavioral decline
  age_range: 7 to 10 years
  notes: >
    Cognitive and behavioral dysfunction usually follows the visual decline,
    with anxiety, mood disturbance, and other atypical behaviors becoming
    clinically important. A pooled meta-analysis places the weighted mean age
    at onset of behavioural change at 8.5 (± 3.9) years (N = 194) and of
    cognitive decline at 9.3 (± 3.1) years (N = 219), consistent with this
    phase window (PMID:41501856).
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "behavioral and cognitive dysfunction at 7 to 10 years of age"
    explanation: >
      This supports the timing of neurobehavioral decline after visual onset.
  - reference: PMID:37113550
    reference_title: "Etiology of anxious and fearful behavior in juvenile neuronal ceroid lipofuscinosis (CLN3 disease)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "behavioral symptoms like mood disturbances and anxiety are common."
    explanation: >
      This review supports behavioral symptoms as part of the CLN3 disease
      trajectory.
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "behavioural changes (8.5 ± 3.9,N= 194)"
    explanation: >
      Pooled natural-history data quantify the weighted mean age at onset of
      behavioural change, supporting the timing of this phase.
- phase: Motor decline and seizures
  age_range: 10 to 18 years
  notes: >
    Motor deterioration and seizures follow in later childhood. A pooled
    meta-analysis places the weighted mean age at onset of seizures at 10.2
    (± 3.0) years (N = 243) and of motor decline at 11.0 (± 3.8) years
    (N = 108) (PMID:41501856).
  evidence:
  - reference: PMID:31926949
    reference_title: "Juvenile Batten Disease (CLN3): Detailed Ocular Phenotype, Novel Observations, Delayed Diagnosis, Masquerades, and Prospects for Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive motor decline and seizures at 10 to 13 years of age, eventually leading to premature death in the second or third decade of life."
    explanation: >
      This supports the onset of the motor-decline and seizure phase at 10 to 13
      years in classic juvenile CLN3 disease. The mortality it describes is
      carried by the subsequent late multisystem decline phase.
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which revealed an average age of onset for seizures of 10.2 ± 3.0 (N= 243) years"
    explanation: >
      Pooled natural-history data quantify the weighted mean age at onset of
      seizures, supporting the timing of this phase.
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "motor decline (11.0 ± 3.8,N= 108)"
    explanation: >
      Pooled natural-history data quantify the weighted mean age at onset of
      motor decline, supporting the timing of this phase.
- phase: Late multisystem decline and mortality
  age_range: 18 years through the third decade
  notes: >
    Cardiac conduction abnormalities, loss of independent walking, and
    enteral-feeding dependence cluster in the late second and third decade,
    shortly before death. These pooled weighted mean ages at onset are: 17.8
    (± 4.4) years (N = 45) for cardiac manifestations, 19.5 (± 3.2) years
    (N = 70) for loss of independent walking, 22.0 (± 1.6) years (N = 35) for
    feeding difficulties requiring enteral feeding, and 22.4 (± 4.4) years
    (N = 95) for death. Cardiac manifestations and loss of independent walking
    occur at similar ages, but earlier than feeding difficulties and death,
    which occur together around 22 years. Life expectancy is reported as twenty
    to thirty years with a range of 20-39 years, so this phase is not bounded by
    the 22.4-year weighted mean age at death. These are weighted means pooled
    across heterogeneous studies, not a single prospective cohort: nine studies
    were screened into the meta-analysis, but each symptom's weighted mean
    derives from only one to four of them, and per-symptom N ranges from 35 to
    254 across the full 13-symptom timeline,
    so confidence is uneven, and the late milestones here (cardiac N = 45,
    enteral feeding N = 35) rest on especially small subsets. Ages are age at
    reported onset, so they inherit ascertainment and diagnostic-delay bias
    from the source cohorts (see PMID:31926949 on delayed diagnosis and
    ophthalmic masquerades).
  evidence:
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiac manifestations (17.8 ± 4.4,N= 45), loss of independent walking (19.5 ± 3.2,N= 70), feeding difficulties requiring enteral feeding tube (22.0 ± 1.6,N= 35), and death (22.4 ± 4.4,N= 95)"
    explanation: >
      Pooled natural-history data define the late-stage milestone sequence and
      weighted mean age at death in CLN3 disease. Each figure derives from a
      small subset of the nine screened studies: cardiac manifestations two
      (N = 45), loss of independent walking three (N = 70), feeding
      difficulties one (N = 35), and death two (N = 95).
  - reference: PMID:41501856
    reference_title: "A timeline of symptom onset and disease progression in CLN3 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The life expectancy of people with classic CLN3 disease is twenty to thirty years"
    explanation: >
      Reported life expectancy extends through the third decade, supporting the
      upper bound of this phase beyond the 22.4-year weighted mean age at death.

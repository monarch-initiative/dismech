discussions:
- discussion_id: gap_cln3_standardized_natural_history_data
  prompt: >-
    Despite two decades of CLN3 natural-history research, why does a clear,
    globally standardised timeline of symptom onset and progression remain
    poorly defined, and what would resolve it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Late multisystem decline and mortality
  rationale: >-
    The pooled 13-symptom timeline in PMID:41501856 is the largest available
    natural-history summary for CLN3 disease, but it is a retrospective
    meta-analysis across nine heterogeneous studies with per-symptom N ranging
    from 35 to 254 (not a single prospective cohort), and ages are age at
    reported (not biological) onset. The four interventional trials already
    recorded on this entry (NCT03770572, NCT01399047, NCT05174039,
    NCT04637282) need exactly this kind of quantified natural-history timeline
    for external comparators and endpoint selection, which is why the
    remaining lack of standardised, prospective, longitudinal data collection
    is a live gap rather than a purely historical one.

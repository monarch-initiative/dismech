notes: >-
  PMID:41501856 pooled nine CLN3 natural-history studies (423 patients, ages
  4-39 years) to derive weighted mean ages at onset for 13 core symptoms via a
  literature-review meta-analysis, not a single prospective cohort. Nine
  studies were screened in, but each symptom's weighted mean derives from only
  one to four of them, so a per-symptom figure is never backed by all nine.
  Per-symptom N ranges widely (35 to 254), so confidence is uneven; the
  latest milestones (cardiac manifestations N = 45, enteral feeding N = 35)
  rest on especially small subsets. Reported ages are age at *reported* onset,
  inheriting ascertainment and diagnostic-delay bias from the source cohorts —
  consistent with this entry's existing PMID:31926949 evidence on delayed
  diagnosis and ophthalmic masquerades — so these figures are best read as
  "age at clinical recognition" rather than biological onset. Sleep
  disturbance carries a weighted SD (±6.1) wider than the mean-to-mean spacing
  of most of the timeline and was reported by only one of the nine studies, so
  its position in the sequence should not be over-read; the same single-study
  caveat applies to Parkinsonian gait and to feeding difficulties.

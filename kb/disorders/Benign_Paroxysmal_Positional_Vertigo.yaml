    snippet: >-
      migraine (OR = 4.40; 95% CI, 2.67-7.25; P < 0.00001)
    explanation: >-
      Pooled odds ratio for migraine in two observational studies.
- name: Elevated total cholesterol
  description: >-
    Three studies in the cited meta-analysis found a higher mean total cholesterol level in BPPV cases than
    controls. This continuous mean difference is not comparable to the odds ratios for migraine or osteoporosis

  description: >-
    Canal occlusion is reserved for selected patients with intractable, disabling BPPV despite appropriate
    maneuvers. Plugging greatly reduces cupular responsiveness but can cause postoperative imbalance or hearing
    loss. Confirmation of the affected canal and assessment of hearing and vestibular function are important
    before surgery.

disease_term:
  preferred_term: benign paroxysmal positional vertigo
  term:
    id: MONDO:8000018
    label: benign paroxysmal positional vertigo
synonyms:
- BPPV
- benign paroxysmal position vertigo
- positional vertigo
description: >-
  Benign paroxysmal positional vertigo (BPPV) is a common peripheral vestibular disorder caused by inappropriate
  stimulation of a semicircular canal by displaced otoconial debris. Gravity-driven movement of free particles
  (canalithiasis) explains most cases. Cupular loading and canalith entrapment are proposed explanations for
  some persistent positional responses; nystagmus direction alone does not distinguish them. Abnormal canal
  signals produce positional vertigo and nystagmus, often with nausea or residual imbalance. Most cases are
  idiopathic, while trauma and other inner-ear disorders can precede secondary BPPV. Canal-specific repositioning
  is effective for many patients, but spontaneous remission, persistent symptoms and recurrence all occur.
  Familial and common-variant associations indicate susceptibility without establishing one Mendelian cause
  of typical BPPV.
has_subtypes:
- name: Posterior Canal
  display_name: Posterior semicircular canal BPPV
  description: >-
    The most common canal variant, estimated at 80–90% in the cited review. Posterior canalithiasis typically
    produces transient torsional upbeating nystagmus after a brief latency on Dix-Hallpike testing. A persistent
    torsional upbeating response is clinically classified as posterior cupulolithiasis, although adherence
    is inferred rather than directly visualized.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The posterior canal variant is by far the most common (80–90%)18 because it
      is the most gravity‐dependent part of the vestibular labyrinth.
    explanation: >-
      States both the frequency of the posterior canal variant and the anatomical
      reason for it, which is what makes this a subtype rather than a separate
      disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:40105844
    reference_title: "Treatment Maneuvers in Cupulolithiasis of the Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      positional nystagmus beating torsionally with the upper pole of the eye to the lower ear and vertically
      upward (to the forehead) and lasting longer than 1 minute
    explanation: >-
      Operational inclusion criterion for the clinically defined posterior cupulolithiasis trial.
- name: Horizontal Canal
  display_name: Horizontal (lateral) semicircular canal BPPV
  description: >-
    Horizontal or lateral canal BPPV is evaluated with the supine roll test. Geotropic and apogeotropic direction-changing
    nystagmus distinguish clinical patterns. Apogeotropic nystagmus can arise from periampullary canalithiasis,
    proposed cupulolithiasis or reversible canalith jam and does not establish adhesion to the cupula.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The geotropic variant (the fast phase of nystagmus towards the ground) is
      believed to be caused by canalithiasis.
    explanation: >-
      Review explanation of the geotropic horizontal-canal pattern.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36998555
    reference_title: "Cupulolithiasis: A Critical Reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Apogeotropic nystagmus in the horizontal canal form is often attributed to cupulolithiasis; however,
      periampullary canalithiasis explains self-limited nystagmus, and reversible canalith jam explains prolonged
      apogeotropic nystagmus.
    explanation: >-
      Critical reappraisal describes alternative mechanisms for the same nystagmus direction.
    quote_role: REVIEW_SYNTHESIS
- name: Anterior Canal
  display_name: Anterior (superior) semicircular canal BPPV
  description: >-
    A rare anterior or superior canal variant producing predominantly downbeat positional nystagmus, sometimes
    with a small torsional component, during Dix-Hallpike or straight head-hanging testing. Downbeat nystagmus
    also occurs in central disease; a peripheral diagnosis requires careful clinical correlation.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a positive Dix‐Hallpike exam of the superior canal BPPV, the torsional
      component remains the same as for the posterior canal of the undermost ear
      with the main differentiating element being a down‐beating vertical
      component.
    explanation: >-
      Gives the sign that separates anterior-canal from posterior-canal BPPV on
      the same diagnostic manoeuvre.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Although AC-BPV may appear as downbeat nystagmus without a visible torsional component, its rarity should
      lower the threshold for seeking a central cause.
    explanation: >-
      The differential cannot be decided from downbeat direction alone.
    quote_role: REVIEW_SYNTHESIS
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Recurrent vertigo and residual imbalance can restrict daily activities and contribute to falls, especially
    in older adults. Delayed recognition prolongs symptoms and unnecessary investigations; the burden varies
    with recurrence, mobility and comorbid illness.
  evidence:
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      While BPV is self-limiting in many cases, unresolved BPV can limit daily activities and contribute to
      the risk of falls in elderly patients
    explanation: >-
      Supports functional and fall-related burden without asserting that BPPV causes stroke or dementia.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Otoconial Degeneration
  description: >-
    Age-related loss of otoconial mass and structural integrity is a proposed susceptibility process. These
    changes also occur outside BPPV; degeneration is not established as the initiating lesion in every patient.
  role: predisposing
  biological_scale: TISSUE

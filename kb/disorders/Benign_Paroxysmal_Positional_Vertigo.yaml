      serum vitamin D level (MD = -2.12; 95% CI, -3.85 to -0.38; P = 0.02)
    explanation: >-
      Reports the pooled difference in serum vitamin D between patients with BPPV
      and controls.
- name: Osteoporosis
  description: >-
    Osteoporosis was associated with BPPV occurrence in eight studies in the cited meta-analysis (pooled odds
    ratio 2.49), with substantial heterogeneity. Shared mineral-metabolism biology is a proposed explanation,
    not a demonstrated effect on a specific otoconial process.
  effect: Associated with BPPV occurrence; disease mechanism is unresolved
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:

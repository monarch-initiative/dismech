        disorders, such as benign paroxysmal positional vertigo (BPPV)
      explanation: >-
        The source explicitly qualifies the disease link as suspected.
      quote_role: REVIEW_SYNTHESIS
- name: Utricular Otoconial Detachment
  description: >-
    Dislodgement of otoconia, sometimes together with linking fibrils and otolithic membrane matrix, supplies
    mobile debris. The initiating cause is often unknown; aging-related change, trauma or another inner-ear
    disorder may contribute. Utricular origin is supported by the morphology of surgically recovered particles
    rather than direct observation of their detachment.
  role: trigger
  biological_scale: TISSUE
  locations: *id001
  evidence:
  - reference: PMID:27726156
    reference_title: Otoconia and otolithic membrane fragments within the posterior semicircular canal in benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The presence of whole otoconia within the particulate matter in our samples associated with attached
      and detached interconnecting fibrils suggests that fragments of the otolithic membrane with attached
      otoconia may become dislodged and displaced into the semicircular canal.
    explanation: >-
      Inference from two surgically refractory cases, not a direct observation of detachment.
  downstream:
  - target: Otoconial Debris Entry into a Semicircular Canal
    causal_link_type: DIRECT

- name: Vitamin D and Calcium Supplementation
  description: >-
    A multicentre trial randomized 1,050 successfully repositioned patients to a vitamin D assessment-and-supplementation
    strategy or observation. Intervention participants with serum vitamin D below 20 ng/mL received vitamin
    D 400 IU and calcium carbonate 500 mg twice daily for one year. Event rates were 0.83 versus 1.10 recurrences
    per person-year; the proportion of patients who relapsed was 37.8% versus 46.7%. The reported NNT of 3.70
    is based on the event-rate difference, not the patient-level relapse proportion. The trial did not isolate
    vitamin D from calcium or use a placebo control.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: vitamin D and calcium supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:

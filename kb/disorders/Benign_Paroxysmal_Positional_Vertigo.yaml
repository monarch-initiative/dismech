- name: Cupulolithiasis
  description: >-
    In this model, otoconial material adheres to the cupula and changes its effective density, producing gravity
    sensitivity and a relatively persistent positional response. Persistent adhesion in living patients has
    not been directly established; periampullary free particles and canalith jam can produce overlapping signs.
  role: mechanism
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      In the cupulolithiasis model, the particulate matter becomes adherent to the cupula itself. This cupular
      loading renders the system sensitive to gravitational forces
    explanation: >-
      Defines the proposed loading mechanism.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36998555
    reference_title: "Cupulolithiasis: A Critical Reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Evidence that otoconia adhere strongly or persistently to the cupula is lacking.
    explanation: >-
      Limits the certainty of persistent adhesion as the cause in a particular patient.
    quote_role: REVIEW_SYNTHESIS
  notes: >-

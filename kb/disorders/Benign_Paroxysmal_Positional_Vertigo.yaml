    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic nystagmus features include latency of onset, limited
      duration, torsional and upbeat directionality, reversibility, and
      fatigability.
    explanation: >-
      Enumerates the features that make this a positional, mechanically driven
      nystagmus rather than a general one.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT

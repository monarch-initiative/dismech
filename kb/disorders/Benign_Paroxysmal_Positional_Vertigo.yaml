    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      osteoporosis (OR = 2.49; 95% CI, 1.39-4.46; P = 0.002)
    explanation: >-
      Gives the pooled odds ratio for osteoporosis as a risk factor for BPPV

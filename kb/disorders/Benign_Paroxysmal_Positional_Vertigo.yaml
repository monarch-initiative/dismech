- name: Canalith Jam
  description: >-
    A particle mass becomes trapped at a canal narrowing or ampullary neck. Fixed obstruction can maintain
    abnormal cupular pressure and prolonged nystagmus. A mobile, reversible jam is a proposed cause of apogeotropic
    positional responses and treatment resistance that can resemble cupulolithiasis.
  role: mechanism
  biological_scale: TISSUE
  evidence:
  - reference: PMID:36998555
    reference_title: "Cupulolithiasis: A Critical Reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Canalith jam occurs when particles become entrapped at narrowings or bends in the canal or at the ampullary
      neck
    explanation: >-
      Descriptive synthesis of a proposed entrapment mechanism.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36998555
    reference_title: "Cupulolithiasis: A Critical Reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      These reversible jams result in a different clinical presentation than a fixed jam. The mobile plug can
      act as a check ball valve in the canal and cause an apogeotropic DCPN and vertigo symptoms identical
      to that usually ascribed to cupulolithiasis.
    explanation: >-
      Explains why clinical pattern alone cannot identify cupular adhesion.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Abnormal Cupular Deflection
    causal_link_type: DIRECT

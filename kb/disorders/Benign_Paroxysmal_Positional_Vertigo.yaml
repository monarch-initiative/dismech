phenotypes:
- name: Paroxysmal positional vertigo
  category: Neurological
  description: >-
    Brief recurrent vertigo triggered by changes in head position relative to gravity, such as lying back or
    rolling in bed. Canalithiasis attacks usually last less than a minute; persistent variants last longer.
    Some patients, especially older adults, describe nonspecific dizziness or falls rather than rotatory vertigo.
  phenotype_term:
    preferred_term: Paroxysmal positional vertigo
    term:
      id: HP:0010532
      label: Paroxysmal vertigo
    temporality: RECURRENT
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These vertigo spells usually last less than 20 seconds (longer for the
      horizontal canal) but may be accompanied by a lingering, nonspecific
      imbalance, so patients often overestimate the length of the attacks.
    explanation: >-
      Gives both the duration of the defining phenotype and the reason reported
      durations are longer than measured ones.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Not all patients with BPV will report rotatory vertigo and may instead report dizziness, light-headedness
      or falls
    explanation: >-
      Supports the variable subjective presentation.
    quote_role: REVIEW_SYNTHESIS
- name: Positional nystagmus
  category: Neurological
  description: >-
    Positionally elicited nystagmus with direction and timing dependent on the involved canal and mechanism.
    Typical posterior canalithiasis produces transient torsional upbeating nystagmus; persistent responses
    occur in other variants. Subjective BPPV describes compatible positional vertigo without observable nystagmus.
  phenotype_term:
    preferred_term: Positional nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:

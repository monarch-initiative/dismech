- name: Head-shaking for persistent posterior-canal BPPV
  description: >-
    A 2025 sham-controlled trial of 159 patients meeting clinical posterior-cupulolithiasis criteria found
    resolution of vertigo and nystagmus by the next day in 37.7% after head-shaking versus 13.2% after sham.
    Immediate efficacy was not significantly different, and mastoid oscillation did not significantly outperform
    sham. Long-term benefit was not measured. Clinical classification does not directly demonstrate particles
    adhering to the cupula.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:40105844
    reference_title: "Treatment Maneuvers in Cupulolithiasis of the Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the intention-to-treat analysis, 20 patients in the head-shaking group (37.7%), 14 in the mastoid
      oscillation group (26.4%), and 7 in the control group (13.2%) showed the resolution of vertigo and nystagmus
      the following day
    explanation: >-
      Direct next-day outcome; it is not evidence for long-term recurrence prevention.
  - reference: PMID:40105844
    reference_title: "Treatment Maneuvers in Cupulolithiasis of the Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      There were no significant differences in the therapeutic efficacy between the head shaking and mastoid
      oscillation groups (P = .21; α = .0167) or between the mastoid oscillation and sham groups (P = .09;
      α = .0167)
    explanation: >-
      Limits the evidence for the alternative oscillation procedure.
  - reference: PMID:40105844
    reference_title: "Treatment Maneuvers in Cupulolithiasis of the Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Trial."
    supports: SUPPORT

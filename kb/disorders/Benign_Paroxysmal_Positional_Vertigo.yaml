    explanation: >-
      Reports the pooled mean difference in total cholesterol between patients
      with BPPV and controls.
treatments:
- name: Canalith Repositioning Maneuver
  description: >-
    Canalith repositioning, usually an Epley or modified particle repositioning maneuver, is recommended for
    posterior canal BPPV. It moves canaliths toward the utricle. Repeat treatment may be needed, and successful
    treatment does not eliminate future recurrence. Mobility and cervical limitations affect maneuver selection.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: canalith repositioning maneuver
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, a Cochrane review of 11 relevant studies representing 745
      participants, concluded that the Epley maneuver and its modifications are
      safe and effective.
    explanation: >-
      Establishes efficacy and safety at the level of a systematic review rather
      than a single series.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      treat, or refer to a clinician who can treat, patients with posterior canal BPPV with a canalith repositioning
      procedure
    explanation: >-
      Strong guideline recommendation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The update group made a strong recommendation against postprocedural postural restrictions after canalith
      repositioning procedure for posterior canal BPPV.
    explanation: >-
      Supports avoiding unnecessary post-treatment restrictions.
    quote_role: REVIEW_SYNTHESIS
  target_mechanisms:
  - target: Canalithiasis
    treatment_effect: INHIBITS
    description: >-
      Relocates particles from the posterior canal to the utricle, removing the free-particle stimulus.
    evidence:

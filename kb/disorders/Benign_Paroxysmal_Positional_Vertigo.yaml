  evidence:
  - reference: PMID:28066316
    reference_title: "Age-Related Vestibular Loss: Current Understanding and Future Research Directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The otoconia contained in the utricle and saccule have also been shown to undergo morphological changes
      and degeneration during a human’s lifespan as observed in postmortem analyses
    explanation: >-
      Human aging evidence, not a BPPV-specific degeneration measurement.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Utricular Otoconial Detachment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Degeneration may weaken otoconial attachment; the causal transition in individual patients remains inferred.
    evidence:
    - reference: PMID:28066316
      reference_title: "Age-Related Vestibular Loss: Current Understanding and Future Research Directions."
      supports: SUPPORT

    reference_title: Vitamin D supplementation in preventing the recurrence of benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Notably, vitamin D supplementation alone led to a marked reduction in the occurrence of BPPV recurrence
      events over a year when compared to placebo.
    explanation: >-
      Repeated-event benefit in the same small trial; the analysis treated recurrences from one patient as

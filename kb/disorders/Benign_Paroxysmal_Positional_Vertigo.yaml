      quote_role: REVIEW_SYNTHESIS
- name: Otoconial Debris Entry into a Semicircular Canal
  description: >-
    Displaced material reaches the canal lumen, most commonly the gravity-dependent posterior canal. Its nonampullary
    opening communicates with the utricle; the cupula partitions the canal-side ampulla from the utricular

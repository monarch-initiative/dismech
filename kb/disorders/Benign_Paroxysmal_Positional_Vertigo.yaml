    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies have found the Semont maneuver to be efficacious, safe, and
      advantageous compared to a sham‐control.
    explanation: >-
      Sham-controlled comparison is what distinguishes this from an uncontrolled
      manoeuvre series.
    quote_role: REVIEW_SYNTHESIS
  target_mechanisms:
  - target: Canalithiasis
    treatment_effect: INHIBITS

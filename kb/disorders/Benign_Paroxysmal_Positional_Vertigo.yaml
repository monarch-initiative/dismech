environmental:
- name: Head trauma
  description: >-
    Head trauma is a recognized antecedent of secondary BPPV and may mechanically dislodge otoconia. A meta-analysis
    found an association based on two trauma studies, with substantial heterogeneity; this does not exclude
    other routes to BPPV in younger people.
  effect: Increases risk of otoconial detachment and therefore of BPPV
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      head trauma (OR = 3.42; 95% CI, 1.21-9.70; P = 0.02)
    explanation: >-
      Two head-trauma studies contributed to this estimate within a 19-study meta-analysis; the pooled association
      is not a measured detachment mechanism.
  - reference: PMID:21808648
    reference_title: >-
      Benign Paroxysmal Positional Vertigo (BPPV): History, Pathophysiology,
      Office Treatment and Future Directions.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In younger individuals it is the commonest cause of vertigo following head
      injury.
    explanation: >-
      Review identifies BPPV as a common vestibular consequence of head injury in younger individuals.
    quote_role: REVIEW_SYNTHESIS
  influences_mechanisms:
  - target: Utricular Otoconial Detachment
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Trauma acts at the initiating node, detaching otoconia mechanically rather
      than through degeneration of the otolithic membrane.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Secondary causes of BPPV refer to identifiable causes of otoconial
        dislodgement. These include otologic and nonotologic surgery, head
        trauma, or any means by which a sufficient mechanical force reaches the
        inner ear.
      explanation: >-
        States explicitly that trauma acts by dislodging otoconia, which is the
        node this link targets.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Mechanical head injury is described without an exposure-term binding; a disease or injury term should not
    substitute for an exposure concept.
- name: Vitamin D deficiency
  description: >-
    Lower serum 25-hydroxyvitamin D is associated with BPPV in observational studies. Trials of supplementation
    in deficient or insufficient patients support recurrence prevention, but dose, population and outcome definitions
    vary. The mechanism connecting serum vitamin D to otoconial stability remains unresolved.
  effect: Associated with BPPV occurrence; disease mechanism is unresolved
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:

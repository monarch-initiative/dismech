- name: Semont-plus maneuver
  description: >-
    An extended Semont maneuver tested in posterior canalithiasis. In a per-protocol analysis of 195 of 214
    randomized patients, an initial clinician treatment followed by nine home maneuvers daily shortened mean
    time to sustained symptom resolution to 2.0 versus 3.3 days with Epley. Single clinician-maneuver success
    did not differ significantly. Results concern this supervised-plus-home protocol, with patient-reported
    outcomes and uncertain home execution.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:37358870

progression:
- phase: Onset
  notes: >-
    Peak onset in the fifth and sixth decades, with a female predominance of two
    or three to one that is not seen in younger patients or in those whose
    disease follows trauma - a pattern consistent with the degenerative route
    dominating in later life and the traumatic route in earlier life.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the disorders disproportionately affect women at a ratio of 2 or 3 to 1,
      although the disparity between the sexes is not observed in younger
      patients or those with a traumatic etiology
    explanation: >-
      Documents both the sex ratio and the two groups in which it disappears,
      which is the substance of this phase.
    quote_role: REVIEW_SYNTHESIS
- phase: Course and recurrence
  notes: >-
    Untreated episodes may remit spontaneously, but can persist for days, weeks,
    months or years, and recurrence after successful repositioning is common.
    Persistent or atypical nystagmus that does not respond to repositioning
    should prompt reconsideration of a central cause.
  evidence:

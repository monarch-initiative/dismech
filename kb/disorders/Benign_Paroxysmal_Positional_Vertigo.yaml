- name: Migraine
  description: >-
    Migraine and BPPV were associated in two studies in the cited meta-analysis (pooled odds ratio 4.40). Migraine
    can coexist with BPPV as well as mimic its symptoms; the epidemiological association does not establish
    a causal vestibular pathway or rank migraine against unlike measures of other risk factors.
  effect: Associated with BPPV occurrence; disease mechanism is unresolved
  evidence:

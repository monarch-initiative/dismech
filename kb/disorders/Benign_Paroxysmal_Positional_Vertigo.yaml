- name: Canalithiasis
  description: >-
    Free particles move under gravity within a canal when head position changes. Their displacement produces
    a transient hydrodynamic stimulus. The usual delayed, crescendo-decrescendo response ends as particles
    settle; brief fatigue is compatible with particle dispersion.
  role: mechanism
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The aberrant signal results when gravity pulls the particles through the endolymph canal creating a plunger‐like
      effect which in turn causes ipsidirectional cupular displacement
    explanation: >-
      Biomechanical explanation of free-particle stimulation.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Abnormal Cupular Deflection

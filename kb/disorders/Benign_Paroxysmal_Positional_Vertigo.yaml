inheritance:
- name: Multifactorial with familial aggregation
  description: >-
    Familial aggregation occurs in a subset of BPPV. A case-control survey found that BPPV patients were five
    times as likely as dizzy controls to report relatives with BPPV; it did not distinguish inherited from
    shared environmental effects. Family sequencing and common-variant association studies have identified
    candidate susceptibility alleles, but these findings do not define a single Mendelian inheritance pattern
    or a routine diagnostic genetic test for typical BPPV.
  evidence:
  - reference: PMID:9870618
    reference_title: The familial incidence of benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients in our group with BPPV were 5 times as likely to have relatives
      with BPPV compared to the dizzy control group (chi2=5.95, DF=1, p=0.015).
    explanation: >-
      Reports the familial aggregation result with its statistic and its control
      group.
  - reference: PMID:9870618
    reference_title: The familial incidence of benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is nothing in our data that would distinguish between a hereditary or
      environmental influence in the development of the disease, however.
    explanation: >-
      The authors' own stated limitation, quoted so that this entry does not
      present familial clustering as evidence of heritability.
diagnosis:
- name: Dix-Hallpike maneuver
  description: >-
    Posterior canal BPPV is diagnosed when a compatible positional history and Dix-Hallpike testing provoke
    torsional upbeating nystagmus. Test both sides as appropriate and adapt positioning for mobility limitations.
    A nonspecific positive positional response alone is insufficient.
  evidence:
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      diagnose posterior semicircular canal BPPV when vertigo associated with torsional, upbeating nystagmus
      is provoked by the Dix-Hallpike maneuver
    explanation: >-
      Guideline specifies the diagnostic response, not merely any induced dizziness.
    quote_role: REVIEW_SYNTHESIS
- name: Supine roll test
  description: >-
    Also called the Pagnini-McClure manoeuvre. Used when the history fits BPPV
    but Dix-Hallpike shows horizontal nystagmus or none. Unlike Dix-Hallpike it
    stimulates both horizontal canals at once, so the affected side is inferred
    by comparing nystagmus intensity and direction between the two head turns.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the Dix‐Hallpike maneuver, which isolates one posterior canal during
      testing, the supine roll test provokes both horizontal canals
      simultaneously.
    explanation: >-
      Explains why side determination differs between the two tests, which is the
      practical point of this entry.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      perform, or refer to a clinician who can perform, a supine roll test to assess for lateral semicircular
      canal BPPV if the patient has a history compatible with BPPV and the Dix-Hallpike test exhibits horizontal
      or no nystagmus
    explanation: >-
      Defines when to examine the horizontal canals.
    quote_role: REVIEW_SYNTHESIS
- name: Selective imaging and evaluation of persistent symptoms
  description: >-
    Imaging and additional vestibular testing are not routine when BPPV criteria are met without atypical signs.
    Persistent symptoms, neurological findings or a nystagmus pattern inconsistent with a canal warrant evaluation
    for another or concurrent disorder.
  evidence:
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The update group made recommendations against (1) radiographic imaging for a patient who meets diagnostic
      criteria for BPPV in the absence of additional signs and/or symptoms inconsistent with BPPV that warrant
      imaging
    explanation: >-
      The guideline recommends against imaging under these conditions.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:28248609
    reference_title: "Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      evaluate, or refer to a clinician who can evaluate, patients with persistent symptoms for unresolved
      BPPV and/or underlying peripheral vestibular or central nervous system disorders
    explanation: >-
      Supports investigation of persistent symptoms rather than assuming all treatment failures are canalithiasis.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: Meniere disease
  description: >-
    Spontaneous vertigo lasting minutes to hours with fluctuating aural symptoms favors Meniere disease. It
    can coexist with BPPV; hearing changes should prompt assessment for a comorbid inner-ear disorder.
  evidence:
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Unlike BPV, fluctuating aural symptoms including tinnitus, low-frequency hearing loss and fullness are
      present in Meniere’s disease
    explanation: >-
      Differential auditory findings.
    quote_role: REVIEW_SYNTHESIS
- name: Vestibular migraine
  description: >-
    Vestibular migraine may cause positional vertigo and nystagmus and can coexist with BPPV. Persistent low-velocity
    or poorly canal-specific responses and accompanying migraine features support this differential; positional
    provocation alone does not exclude it.
  evidence:
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Although vertigo in vestibular migraine (VM) is typically spontaneous, positional vertigo can be a presenting
      symptom.
    explanation: >-
      Corrects the assumption that positional provocation distinguishes BPPV from migraine.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with VM may experience migraine features such as headache, photophobia, phonophobia or visual
      aura during episodes of vertigo
    explanation: >-
      Clinical features to evaluate alongside nystagmus.
    quote_role: REVIEW_SYNTHESIS
- name: Central positional vertigo
  description: >-
    Central lesions may produce either persistent or paroxysmal positional nystagmus. Pure vertical or atypical
    canal-plane responses, neurological signs, new headache or failure of repeated appropriate maneuvers increase
    concern. Absence of latency or fatigability alone is not decisive because peripheral variants overlap.
  evidence:
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Typically, CPN has little or no latency. It can be persistent, making it difficult to separate from cupulolithiasis,
      or paroxysmal similar to canalithiasis
    explanation: >-
      Explains overlap that prevents a one-sign diagnostic rule.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Failure to respond to multiple repositioning manoeuvres should prompt investigation for a central origin.
    explanation: >-
      Supports reassessing refractory positional symptoms.
    quote_role: REVIEW_SYNTHESIS
- name: Semicircular canal dehiscence syndrome
  description: >-
    Sound- or pressure-induced vertigo time-locked to the stimulus, bone-conduction hyperacusis or autophony,
    and characteristic audiovestibular findings favor superior canal dehiscence syndrome. Diagnosis combines
    symptoms, a physiological third-window sign and high-resolution CT evidence; a radiographic dehiscence
    alone is insufficient.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Other causes of episodic vertigo should also be ruled out, including Meniere's disease, migraine, and
      semicircular canal dehiscence.
    explanation: >-
      Review identifies dehiscence as a relevant differential; detailed audiovestibular assessment distinguishes
      it.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:33522990
    reference_title: "Superior semicircular canal dehiscence syndrome: Diagnostic criteria consensus document of the committee for the classification of vestibular disorders of the Bárány Society."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      patients diagnosed with SCDS must also have symptoms and physiological tests that are both consistent
      with the pathophysiology of a 'third mobile window' syndrome and not better accounted for by another
      vestibular disease or disorder.
    explanation: >-
      Consensus diagnostic scope; imaging alone does not establish the syndrome.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:33522990
    reference_title: "Superior semicircular canal dehiscence syndrome: Diagnostic criteria consensus document of the committee for the classification of vestibular disorders of the Bárány Society."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Symptoms can include hearing one’s voice loudly or distorted in the affected ear (auto-phony), abnormal
      perception of one’s own internal body sounds
    explanation: >-
      Specific auditory clues to the differential.
    quote_role: REVIEW_SYNTHESIS
- name: Orthostatic hypotension
  description: >-
    Dizziness on arising rather than changes in head orientation relative to gravity suggests an orthostatic
    cause; supine and standing blood pressure help distinguish it.
  evidence:
  - reference: PMID:31193795
    reference_title: "Benign positional vertigo, its diagnosis, treatment and mimics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Orthostatic hypotension can present as episodic vertigo or dizziness in some patients however symptoms
      only occur upon arising from a lying or sitting position and are not due to changes in head position
      relative to gravity
    explanation: >-
      Distinguishes posture-related hemodynamic symptoms from canal positional stimulation.
    quote_role: REVIEW_SYNTHESIS
discussions:
- discussion_id: bppv_cupulolithiasis_adherence
  kind: KNOWLEDGE_GAP
  prompt: >-
    How can persistent cupular adhesion be distinguished from periampullary free particles or canalith jam
    in a living patient?
  rationale: >-
    Apogeotropic or persistent nystagmus and resistance to maneuvers can occur under more than one mechanical
    model. Treatment response in clinically defined cupulolithiasis trials does not directly visualize attachment.
    Better particle imaging or validated physiological discriminators are needed.
  attaches_to:
  - pathophysiology#Cupulolithiasis
  - pathophysiology#Canalith Jam
  evidence:
  - reference: PMID:36998555
    reference_title: "Cupulolithiasis: A Critical Reappraisal."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Treatment-resistant cases can be explained by entrapment of particles in the canals or ampullae, but
      persistent adherence to the cupula remains theoretical.
    explanation: >-
      Summarizes the unresolved distinction.
    quote_role: REVIEW_SYNTHESIS
- discussion_id: bppv_genetic_to_mechanical_link
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do familial and common-variant susceptibility signals affect the otoconial or neuronal processes underlying
    recurrent BPPV?
  rationale: >-
    PCDHGA10-associated human tissue aggregates and normal mouse expression do not demonstrate mutant-driven
    otoconial detachment. The GWAS has no inner-ear expression dataset or independent replication cohort, and
    the OTOP1-region target remains uncertain. These associations are not clinical genetic-test validation.
  evidence:
  - reference: PMID:33956893
    reference_title: Identification of a genetic variant underlying familial cases of recurrent benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Further studies are also needed to confirm the biological consequences of the potential candidate variants
    explanation: >-
      The family study explicitly leaves causal consequences to follow-up.
  - reference: PMID:34620984
    reference_title: A genome-wide meta-analysis uncovers six sequence variants conferring risk of vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      One clear limitation of this study is the absence of an inner ear tissue to study the RNA expression
      of the genes associated with vertigo.
    explanation: >-
      Limits mechanistic attribution from GWAS signals.
- discussion_id: bppv_recurrence_transcriptomics
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do peripheral-blood expression signals predict recurrent BPPV independently of diabetes and blood-cell
    composition?
  rationale: >-
    A 2024 computational study prioritized ATP6V0C, SLC25A39, GRN and DPM2 and tested blood expression in only
    12 patients, three per recurrence/diabetes subgroup. This is exploratory omics evidence, not proof of inner-ear
    inflammation, established biomarkers or validated treatment targets.
  evidence:
  - reference: PMID:39170394
    reference_title: Transcriptomic analysis reveals cross-talk genes between type 2 diabetes and recurrent benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The patients were divided into four groups: non-recurrent BPPV without T2DM (n = 3), recurrent BPPV without
      T2DM (n = 3), non-recurrent BPPV with T2DM (n = 3), and recurrent BPPV with T2DM (n = 3).
    explanation: >-
      Small peripheral-blood validation sample.
  - reference: PMID:39170394
    reference_title: Transcriptomic analysis reveals cross-talk genes between type 2 diabetes and recurrent benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Lastly, we obtained gene expression profiles from peripheral blood, which may not accurately reflect
      the pathological state of the inner ear.
    explanation: >-
      The authors identify the tissue-transfer limitation.
notes: >-
  Canalithiasis is the predominant mechanical explanation for BPPV. Clinical cupulolithiasis labels and genetic
  or metabolic susceptibility associations should be distinguished from directly observed particle attachment
  or a proven molecular mechanism. Typical diagnosis is clinical; there is no established genetic or blood
  biomarker that replaces positional examination.
histopathology:
- name: Otoconia and otolithic matrix within posterior canal debris
  description: >-
    Scanning electron microscopy in two surgically refractory BPPV cases showed intact and degenerating otoconia,
    some embedded in gel-like matrix and connected by filaments. The particles were approximately 2–8 micrometres
    long. This selected surgical material supports a utricular source but does not establish identical composition
    in all routine cases.
  context: Posterior canal tissue removed during occlusion for refractory disease
  evidence:
  - reference: PMID:27726156
    reference_title: Otoconia and otolithic membrane fragments within the posterior semicircular canal in benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Intact and degenerating otoconia with and without linking filaments were found attached to amorphous
      particulate matter.
    explanation: >-
      Direct ultrastructural observation in two patients.
  - reference: PMID:27726156
    reference_title: Otoconia and otolithic membrane fragments within the posterior semicircular canal in benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      It could very well be that the composition of the particulate matter in ‘intractable” BPPV is somehow
      different from that in the “run of the mill” type.
    explanation: >-
      Authors explicitly limit generalization from their refractory surgical cases.
- name: PCDHGA10-immunoreactive intracellular aggregates in familial BPPV tissue
  description: >-
    The candidate-gene study illustrated large intracellular PCDHGA10 aggregates in vestibular-ganglion tissue
    carrying the rs113784532 variant, with no comparable large cytosolic aggregates in the illustrated young
    non-BPPV control. This limited tissue observation does not establish that aggregation causes otoconial
    detachment, or that it is a general feature of BPPV.
  context: Human inner-ear tissue examined in the familial PCDHGA10 candidate study
  evidence:
  - reference: PMID:33956893
    reference_title: Identification of a genetic variant underlying familial cases of recurrent benign paroxysmal positional vertigo.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      PCDHGA10 with the rs113784532 mutation formed large intracellular aggregates in BPPV samples even at
      young ages (Fig 3D). In contrast, wildtype PCDHGA10 protein showed no such aggregates in the cytosol
      of non-BPPV samples (Fig 3C).
    explanation: >-
      Human immunostaining observation within a candidate-association study, not an established disease-wide
      lesion.

name: Benign Paroxysmal Positional Vertigo
creation_date: "2026-09-01T13:40:15Z"
category: Complex
parents:
- Peripheral Vestibular Disorder
- Disorder of Vestibular Function
disease_term:
  preferred_term: benign paroxysmal positional vertigo
  term:
    id: MONDO:8000018
    label: benign paroxysmal positional vertigo
synonyms:
- BPPV
- benign paroxysmal position vertigo
- positional vertigo
description: >-
  Benign paroxysmal positional vertigo (BPPV) is the commonest peripheral
  vestibular end-organ disorder and the single commonest cause of vertigo. Its
  mechanism is biomechanical rather than molecular: calcium carbonate crystals
  (otoconia), normally embedded in the otolithic membrane of the utricular
  macula, degenerate and detach, migrate through the non-ampullated end of a
  semicircular canal, and there render the canal inappropriately responsive to
  gravity. Free-floating debris in the canal lumen (canalithiasis) drags
  endolymph and deflects the cupula when the head moves; debris adherent to the
  cupula itself (cupulolithiasis) makes the cupula a gravity sensor that stays
  deflected. Either way the affected canal reports an angular velocity that the
  head is not experiencing, and the resulting mismatch against vision and
  proprioception is perceived as spinning while the vestibulo-ocular reflex
  drives a characteristic positional nystagmus. Because the defect is the
  position of a particle rather than the state of a tissue, BPPV is one of the
  few disorders whose definitive treatment is a mechanical manoeuvre: canalith
  repositioning returns the debris to the utricle and abolishes the signal.
  "Benign" denotes only the absence of a progressive central lesion; recurrence
  is common and the falls risk in older adults is substantial.
has_subtypes:
- name: Posterior Canal
  display_name: Posterior semicircular canal BPPV
  description: >-
    By far the commonest variant (80-90% of cases), because the posterior canal
    is the most gravity-dependent part of the vestibular labyrinth, so debris
    leaving the utricle tends to settle there. Diagnosed by the Dix-Hallpike
    manoeuvre, which provokes torsional upbeating nystagmus after a latency of
    2-5 seconds.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The posterior canal variant is by far the most common (80–90%)18 because it
      is the most gravity‐dependent part of the vestibular labyrinth.
    explanation: >-
      States both the frequency of the posterior canal variant and the anatomical
      reason for it, which is what makes this a subtype rather than a separate
      disease.
- name: Horizontal Canal
  display_name: Horizontal (lateral) semicircular canal BPPV
  description: >-
    Second commonest variant. Diagnosed by the supine roll (Pagnini-McClure)
    test rather than Dix-Hallpike. Geotropic nystagmus (fast phase toward the
    ground) is attributed to canalithiasis; apogeotropic nystagmus to
    cupulolithiasis of the horizontal canal.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The geotropic variant (the fast phase of nystagmus towards the ground) is
      believed to be caused by canalithiasis.
    explanation: >-
      Ties the horizontal-canal nystagmus direction to which of the two
      mechanism nodes is operating, which is why the variant is worth
      distinguishing.
- name: Anterior Canal
  display_name: Anterior (superior) semicircular canal BPPV
  description: >-
    Rare (roughly 3% of cases), because the orientation of the superior canal
    lets debris return to the utricle under ordinary head movement. Shares the
    Dix-Hallpike test with the posterior canal but is distinguished by a
    down-beating vertical nystagmus component.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a positive Dix‐Hallpike exam of the superior canal BPPV, the torsional
      component remains the same as for the posterior canal of the undermost ear
      with the main differentiating element being a down‐beating vertical
      component.
    explanation: >-
      Gives the sign that separates anterior-canal from posterior-canal BPPV on
      the same diagnostic manoeuvre.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The disease itself is self-limiting and not life-threatening, which is what
    "benign" refers to. The burden is downstream of the falls risk and of the
    health-care utilisation a recurrent, easily misdiagnosed vertigo generates,
    and it falls disproportionately on older adults in whom a fall is a
    fracture.
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with BPPV are more susceptible to ischemic stroke, dementia, and
      fractures, severely reducing quality of life of patients.
    explanation: >-
      States the downstream morbidity and quality-of-life impact that this burden
      assessment rests on.
pathophysiology:
- name: Otoconial Degeneration and Detachment from the Utricular Macula
  description: >-
    The initiating lesion is loss of otoconia from the otolithic membrane of the
    utricle. Otoconia fracture, fragment and lose mass with age, and the same
    detachment can be produced abruptly by head trauma, ear surgery, or inner-ear
    disease that degrades the gelatinous substrate anchoring them. Most cases are
    idiopathic and are attributed to degeneration of the macula. This node is
    where the mechanism starts: everything downstream is a consequence of
    particles being in the wrong compartment.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: macula of the utricle
    term:
      id: UBERON:0002214
      label: macula of utricle of membranous labyrinth
  - preferred_term: otoconia
    term:
      id: UBERON:0002280
      label: otolith
  evidence:
  - reference: PMID:28066316
    reference_title: >-
      Age-Related Vestibular Loss: Current Understanding and Future Research
      Directions.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The otoconia contained in the utricle and saccule have also been shown to
      undergo morphological changes and degeneration during a human’s lifespan
      as observed in postmortem analyses
    explanation: >-
      Documents otoconial degeneration in human temporal bones, which is the
      claim this node makes. This quote replaces an earlier one spanning "both
      animals and humans", which could not carry a single evidence_source.
  - reference: PMID:28066316
    reference_title: >-
      Age-Related Vestibular Loss: Current Understanding and Future Research
      Directions.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is suspected that these changes in otoconia are involved in the
      development of peripheral vestibular disorders, such as benign paroxysmal
      positional vertigo (BPPV)
    explanation: >-
      Links otoconial degeneration to BPPV specifically. Marked INDIRECT because
      the authors state it as a suspected rather than demonstrated causal link.
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most cases of BPPV are idiopathic in origin and probably result from
      degeneration of the macula.
    explanation: >-
      Establishes macular degeneration as the default aetiology, so this node is
      the trigger for the majority of cases rather than a special case.
  downstream:
  - target: Otoconial Debris Entry into a Semicircular Canal
    causal_link_type: DIRECT
    description: >-
      Detached otoconia are free within the endolymph of the vestibule and can
      then be carried into a canal by ordinary head movement.
- name: Otoconial Debris Entry into a Semicircular Canal
  description: >-
    Detached otoconia can only enter or leave a semicircular canal through its
    non-ampullated end, because the cupula partitions the ampulla. The posterior
    canal receives the great majority of debris because it is the most
    gravity-dependent part of the labyrinth; the horizontal and anterior canals
    account for the remainder. Scanning electron microscopy of canal contents
    surgically removed from patients with intractable disease shows free-floating
    otoconia still carrying linking filaments and gelatinous matrix, which is the
    direct evidence that the particles are of utricular origin.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: semicircular canal
    term:
      id: UBERON:0001840
      label: semicircular canal
  - preferred_term: posterior semicircular canal
    term:
      id: UBERON:0001842
      label: posterior semicircular canal
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only place for debris to enter or exit the canals is through their
      nonampullated ends.
    explanation: >-
      States the anatomical constraint that makes canal entry a discrete
      mechanistic step rather than free diffusion.
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scanning electron micrographs of posterior semicircular canal contents
      extracted from patients with intractable BPPV show free‐floating otoconia
      with linking filaments attached to what appears to be a gelatinous matrix
    explanation: >-
      Direct human structural evidence that the material inside the canal is
      displaced utricular otoconia, confirming the identity of the particle
      rather than inferring it from the clinical picture.
  downstream:
  - target: Canalithiasis
    causal_link_type: DIRECT
    description: >-
      Debris that remains free within the canal lumen produces the canalithiasis
      mechanism.
  - target: Cupulolithiasis
    causal_link_type: DIRECT
    description: >-
      Debris that becomes adherent to the cupula produces the cupulolithiasis
      mechanism instead.
- name: Canalithiasis
  description: >-
    Free-floating particles within the canal lumen are pulled through the
    endolymph by gravity when the head changes position. Acting as a plunger,
    they drag endolymph and displace the cupula in the same direction. Because
    the particles must first overcome inertia and then settle, the resulting
    signal has a latency of a few seconds, builds and decays, lasts under a
    minute, and fatigues on repeated testing as the particles disperse. This is
    the predominant subtype.
  role: mechanism
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aberrant signal results when gravity pulls the particles through the
      endolymph canal creating a plunger‐like effect which in turn causes
      ipsidirectional cupular displacement
    explanation: >-
      States the biomechanical coupling this node asserts: particle motion drives
      endolymph, which deflects the cupula.
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicopathological research indicates that canalithiasis is the
      predominant subtype.
    explanation: >-
      Supports treating canalithiasis rather than cupulolithiasis as the usual
      route through this part of the graph.
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With repeated testing, the nystagmus should fatigue due to the dispersion
      of the canaliths which reduces their mass effect.
    explanation: >-
      Fatigability is a prediction that follows specifically from a free particle
      mass, so it discriminates this node from cupulolithiasis.
  downstream:
  - target: Aberrant Cupular Deflection and False Angular Velocity Signal
    causal_link_type: DIRECT
    description: >-
      Endolymph movement generated by the migrating particle mass deflects the
      cupula.
- name: Cupulolithiasis
  description: >-
    Otoconial debris adheres to the cupula rather than floating free. The loaded
    cupula becomes denser than the surrounding endolymph and therefore
    gravity-sensitive, so it stays deflected for as long as the head is held in
    the provoking position. The clinical signature is the mirror image of
    canalithiasis: no latency, duration beyond 60 seconds, and little or no
    fatigability. It has been suggested to represent the more chronic form of the
    disease.
  role: mechanism
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the cupulolithiasis model, the particulate matter becomes adherent to
      the cupula itself. This cupular loading renders the system sensitive to
      gravitational forces, and the resulting alterations in cupular deflection
      lead to pathological perceptions of motion.
    explanation: >-
      States the full claim of this node: adherence, the resulting gravity
      sensitivity, and the perceptual consequence.
  notes: >-
    No UBERON term for the ampullary cupula was found when this entry was
    curated (searching "cupula" returns apex of cochlea and cupular organ, and
    neither is the structure meant), so the cupula is described in prose rather
    than bound. Do not substitute UBERON:0009716.
  downstream:
  - target: Aberrant Cupular Deflection and False Angular Velocity Signal
    causal_link_type: DIRECT
    description: >-
      The loaded cupula is held deflected by gravity for the duration of the
      provoking head position.
- name: Aberrant Cupular Deflection and False Angular Velocity Signal
  description: >-
    However it is produced, cupular deflection is the physiological common path.
    Deflection bends the stereocilia of the vestibular hair cells embedded in the
    crista, modulating their transduction current and hence the firing rate of
    the primary vestibular afferents. The canal therefore reports an angular
    velocity that the head is not undergoing. This is the point at which a
    mechanical fault becomes a neural signal, and it is the node every effective
    treatment is ultimately trying to silence.
  role: mechanism
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: vestibular hair cell
    term:
      id: CL:0000609
      label: vestibular hair cell
  locations:
  - preferred_term: crista ampullaris
    term:
      id: UBERON:0004721
      label: crista ampullaris
  - preferred_term: vestibular ganglion
    term:
      id: UBERON:0002824
      label: vestibular ganglion
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the case of BPPV, aberrant signals from semicircular canals create an
      illusion of motion which results in vertigo.
    explanation: >-
      States that the canal output itself is the aberrant quantity, which is the
      claim of this node.
  downstream:
  - target: Vestibulo-Ocular Reflex Driven Positional Nystagmus
    causal_link_type: DIRECT
    description: >-
      The false canal signal is passed to the extraocular motor nuclei through
      the normal three-neuron vestibulo-ocular reflex arc.
  - target: Vestibular-Visual-Somatosensory Mismatch
    causal_link_type: DIRECT
    description: >-
      The same false signal is compared against unchanged visual and
      proprioceptive input in the vestibular nuclei.
- name: Vestibulo-Ocular Reflex Driven Positional Nystagmus
  description: >-
    The vestibulo-ocular reflex is intact and behaving correctly; it is simply
    being fed a false input. Because each canal is yoked to a specific pair of
    extraocular muscles, the plane of the nystagmus identifies which canal holds
    the debris. Posterior canal stimulation activates the ipsilateral inferior
    oblique and contralateral superior rectus, producing torsional upbeating
    nystagmus; the horizontal canal produces horizontal nystagmus; the anterior
    canal adds a down-beating component. Nystagmus reverses when the head is
    returned upright, because the particle moves back down the canal.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activation of the ipsilateral inferior oblique and contralateral superior
      rectus during the Dix‐Hallpike leads to a torsional nystagmus (the top pole
      of the eye beats towards the lowermost ear) along with an up‐beating
      component.
    explanation: >-
      Traces the specific reflex pathway from the stimulated canal to the
      observed eye movement, which is what makes nystagmus direction a readout of
      canal identity.
  downstream:
  - target: Positional nystagmus
    causal_link_type: DIRECT
    description: >-
      The reflex output is the clinically observed positional nystagmus.
- name: Vestibular-Visual-Somatosensory Mismatch
  description: >-
    The vestibular nuclei receive a canal signal reporting rotation while vision
    and proprioception report a stationary head. The brain resolves the conflict
    in favour of the vestibular input, so the patient perceives self or
    environment as spinning. The same conflict drives the autonomic response
    through vestibulo-autonomic projections, which is why nausea and vomiting
    accompany severe attacks. Perception ceases when the particle stops moving,
    which is why episodes are brief.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vertigo is defined as the subjective perception of rotational or
      translational movement in the absence of an external stimulus.
    explanation: >-
      Defines the perceptual outcome as motion perceived without a corresponding
      stimulus, which is the mismatch this node describes.
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms are provoked by positional changes of the head with respect to
      gravity and can range in severity from mild dizziness to debilitating
      episodes that may induce nausea or vomiting, and significantly hinder daily
      functioning.
    explanation: >-
      Connects the positional provocation to the autonomic accompaniments
      attributed to this node.
  downstream:
  - target: Paroxysmal positional vertigo
    causal_link_type: DIRECT
    description: >-
      The unresolved sensory conflict is experienced as an illusion of spinning.
  - target: Nausea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Vestibulo-autonomic projections from the vestibular nuclei mediate the
      autonomic response; the intermediate brainstem relays are omitted here.
  - target: Gait imbalance
    causal_link_type: DIRECT
    description: >-
      Conflicting postural input degrades balance during and shortly after
      attacks.
phenotypes:
- name: Paroxysmal positional vertigo
  category: Neurological
  description: >-
    Brief, recurrent episodes of illusory spinning provoked by a change of head
    position relative to gravity - lying back, rolling over in bed, bending
    forward, looking up. Individual spells usually last well under a minute,
    though patients commonly overestimate their duration because a non-specific
    imbalance lingers afterwards.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Paroxysmal positional vertigo
    term:
      id: HP:0010532
      label: Paroxysmal vertigo
    temporality: RECURRENT
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These vertigo spells usually last less than 20 seconds (longer for the
      horizontal canal) but may be accompanied by a lingering, nonspecific
      imbalance, so patients often overestimate the length of the attacks.
    explanation: >-
      Gives both the duration of the defining phenotype and the reason reported
      durations are longer than measured ones.
- name: Positional nystagmus
  category: Neurological
  description: >-
    Involuntary rhythmic eye movement elicited by the provoking head position,
    whose plane and direction identify the affected canal. In posterior canal
    disease it is torsional and upbeating, appears after a 2-5 second latency,
    rises and falls within a minute, and fatigues on repetition.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Positional nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
    temporality: TRANSIENT
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic nystagmus features include latency of onset, limited
      duration, torsional and upbeat directionality, reversibility, and
      fatigability.
    explanation: >-
      Enumerates the features that make this a positional, mechanically driven
      nystagmus rather than a general one.
  notes: >-
    Bound to the general HP term for nystagmus because HPO has no term for
    positional nystagmus as such; the positional qualifier is carried in
    preferred_term and in the description. HP:0000666 (Horizontal nystagmus) and
    HP:0010545 (Downbeat nystagmus) describe individual canal variants and are
    narrower than the phenotype as a whole.
- name: Nausea
  category: Gastrointestinal
  description: >-
    Autonomic accompaniment of severe attacks, driven by the same sensory
    conflict rather than by any gastrointestinal disease.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Nausea
    term:
      id: HP:0002018
      label: Nausea
    temporality: TRANSIENT
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      can range in severity from mild dizziness to debilitating episodes that may
      induce nausea or vomiting
    explanation: >-
      Places nausea and vomiting at the severe end of the same disease spectrum.
- name: Gait imbalance
  category: Neurological
  description: >-
    Unsteadiness between and after attacks. Clinically the most consequential
    phenotype in older adults, because it is the route by which a self-limiting
    vestibular disorder produces fractures.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Gait imbalance
    term:
      id: HP:0002141
      label: Gait imbalance
  evidence:
  - reference: PMID:21808648
    reference_title: >-
      Benign Paroxysmal Positional Vertigo (BPPV): History, Pathophysiology,
      Office Treatment and Future Directions.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is likely to be a cause of falls and other morbidity in the elderly.
    explanation: >-
      Supports the clinical significance of imbalance in this disease. Marked
      INDIRECT because the author states falls causation as likely rather than
      established, and speaks of falls rather than of gait imbalance directly.
environmental:
- name: Head trauma
  description: >-
    Mechanical force reaching the inner ear can shear otoconia from the utricular
    macula abruptly, rather than through the gradual degeneration that accounts
    for idiopathic disease. Post-traumatic BPPV is well recognised clinically and
    is the commonest cause of vertigo after head injury in younger people, in
    whom the age-related degenerative route is not yet available.
  effect: Increases risk of otoconial detachment and therefore of BPPV
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      head trauma (OR = 3.42; 95% CI, 1.21-9.70; P = 0.02)
    explanation: >-
      Quantifies the association between head trauma and BPPV occurrence from a
      meta-analysis of 19 observational studies.
  - reference: PMID:21808648
    reference_title: >-
      Benign Paroxysmal Positional Vertigo (BPPV): History, Pathophysiology,
      Office Treatment and Future Directions.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In younger individuals it is the commonest cause of vertigo following head
      injury.
    explanation: >-
      Supports head injury as a distinct, clinically dominant route into the
      disease in the age group where degeneration is not the explanation.
  influences_mechanisms:
  - target: Otoconial Degeneration and Detachment from the Utricular Macula
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Trauma acts at the initiating node, detaching otoconia mechanically rather
      than through degeneration of the otolithic membrane.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Secondary causes of BPPV refer to identifiable causes of otoconial
        dislodgement. These include otologic and nonotologic surgery, head
        trauma, or any means by which a sufficient mechanical force reaches the
        inner ear.
      explanation: >-
        States explicitly that trauma acts by dislodging otoconia, which is the
        node this link targets.
  notes: >-
    No ECTO term was bound. ECTO models chemical, dietary and infectious
    exposures; a mechanical head injury is not represented there, and the
    plausible-looking NCIT head-trauma concepts are disease and injury terms
    rather than exposure terms, so binding one would misuse the slot.
- name: Vitamin D deficiency
  description: >-
    Low serum 25-hydroxyvitamin D is consistently associated with BPPV and, more
    importantly, correcting it reduces recurrence in a randomised trial, which is
    a stronger claim than association because it is interventional. The presumed
    mechanism is that vitamin D and calcium status governs the integrity of the
    calcium carbonate otoconia themselves, so deficiency makes detachment more
    likely.
  effect: Increases risk of BPPV occurrence and recurrence
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum vitamin D level (MD = -2.12; 95% CI, -3.85 to -0.38; P = 0.02)
    explanation: >-
      Reports the pooled difference in serum vitamin D between patients with BPPV
      and controls.
  influences_mechanisms:
  - target: Otoconial Degeneration and Detachment from the Utricular Macula
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vitamin D and calcium status is proposed to act on otoconial integrity. The
      link is marked indirect because the biochemical step between serum vitamin
      D and otoconial stability has not been demonstrated in humans; the
      supporting evidence is the recurrence-prevention trial rather than a
      mechanistic study.
    evidence:
    - reference: PMID:32759193
      reference_title: >-
        Prevention of benign paroxysmal positional vertigo with vitamin D
        supplementation: A randomized trial.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Supplementation of vitamin D and calcium may be considered in patients
        with frequent attacks of BPPV, especially when serum vitamin D is
        subnormal.
      explanation: >-
        Therapeutic response is cited as validation of the mechanism it targets,
        which is an inference step rather than a direct observation of otoconial
        integrity, hence INDIRECT.
- name: Osteoporosis
  description: >-
    Reduced bone mineral density is associated with BPPV at roughly two and a
    half times the odds. Because otoconia are calcium carbonate biominerals laid
    down on a protein matrix, the association is usually read as shared calcium
    and bone-turnover biology rather than as a mechanical effect of bone on the
    labyrinth.
  effect: Increases risk of BPPV occurrence
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      osteoporosis (OR = 2.49; 95% CI, 1.39-4.46; P = 0.002)
    explanation: >-
      Gives the pooled odds ratio for osteoporosis as a risk factor for BPPV
      occurrence.
  review_notes: >-
    No influences_mechanisms link is asserted for osteoporosis. The cited
    meta-analysis and both BPPV reviews used in this entry establish the
    epidemiological association, but none of them states which mechanistic step
    osteoporosis acts on, so naming a target would put a claim in the pathograph
    that no source in hand supports.
- name: Migraine
  description: >-
    The largest single risk factor in the meta-analysis of BPPV occurrence,
    ahead of head trauma and osteoporosis. This is a different claim from
    vestibular migraine as a differential diagnosis, which this entry also
    records: the two can coexist, and migraine raises the odds of developing
    BPPV rather than merely imitating it. Proposed links run through shared
    susceptibility in vestibular function, ion channel activity or central
    vestibular processing, but none of these is established.
  effect: Increases risk of BPPV occurrence
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      migraine (OR = 4.40; 95% CI, 2.67-7.25; P < 0.00001)
    explanation: >-
      Gives the pooled odds ratio for migraine, the largest effect size in the
      meta-analysis's risk factor table.
  review_notes: >-
    No influences_mechanisms link is asserted, following the same abstention as
    the Osteoporosis entry. The meta-analysis establishes the association and
    does not identify which mechanistic step migraine acts on; the mechanisms
    discussed in the literature are candidate explanations rather than findings,
    so naming a target node would put an unsupported claim in the pathograph.
- name: Elevated total cholesterol
  description: >-
    A modest but statistically significant association in the same
    meta-analysis. Recorded for completeness of that risk factor table rather
    than because a mechanism is known - and it is the weakest of the factors
    that reached significance, so it should be read as an association awaiting
    explanation rather than as a modifiable target.
  effect: Increases risk of BPPV occurrence
  evidence:
  - reference: PMID:32655479
    reference_title: >-
      Risk Factors for the Occurrence of Benign Paroxysmal Positional Vertigo:
      A Systematic Review and Meta-Analysis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      total cholesterol level (MD = 0.32; 95% CI, 0.02-0.62; P = 0.03)
    explanation: >-
      Reports the pooled mean difference in total cholesterol between patients
      with BPPV and controls.
  review_notes: >-
    No influences_mechanisms link, for the same reason as Migraine and
    Osteoporosis: the source establishes an association without naming a
    mechanistic step. Included deliberately rather than omitted, so that the
    entry covers every factor that reached significance in the cited table.
treatments:
- name: Canalith Repositioning Maneuver
  description: >-
    The Epley canalith repositioning procedure and its simplified successor, the
    particle repositioning manoeuvre, use a sequence of head positions to walk
    the debris around the posterior canal and out through the common crus into
    the utricle, where it no longer generates a signal. This is the mainstay
    treatment and is unusual in that it addresses the mechanism itself rather
    than the symptom.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: canalith repositioning maneuver
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, a Cochrane review of 11 relevant studies representing 745
      participants, concluded that the Epley maneuver and its modifications are
      safe and effective.
    explanation: >-
      Establishes efficacy and safety at the level of a systematic review rather
      than a single series.
  target_mechanisms:
  - target: Canalithiasis
    treatment_effect: BYPASSES
    description: >-
      The manoeuvre does not alter otoconial biology; it relocates the particles
      out of the canal so that the canalithiasis mechanism has no substrate. That
      is why it works immediately and why it does not prevent recurrence.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CRP aims to return the canaliths, under the influence of gravity, from
        the posterior semicircular canal back into the utricle.
      explanation: >-
        States the mechanical target of the treatment, which is exactly the node
        this link points at.
  notes: >-
    Bound to Physical Therapy because NCIT has no term for a canalith
    repositioning or vestibular repositioning manoeuvre; the specificity is
    carried in preferred_term. A search of NCIT for "vestibular rehabilitation"
    returned no term at all.
- name: Semont Liberatory Maneuver
  description: >-
    A rapid change of body position, originally designed on the cupulolithiasis
    model to fling adherent debris off the cupula, though it also repositions
    free canaliths. Reported response rates of 70-90%. Its speed and range of
    movement make it difficult in elderly, obese or infirm patients, which is the
    practical reason repositioning manoeuvres are usually preferred.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: liberatory (Semont) maneuver
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies have found the Semont maneuver to be efficacious, safe, and
      advantageous compared to a sham‐control.
    explanation: >-
      Sham-controlled comparison is what distinguishes this from an uncontrolled
      manoeuvre series.
  target_mechanisms:
  - target: Cupulolithiasis
    treatment_effect: BYPASSES
    description: >-
      Designed to detach cupula-adherent otoconia, removing the load that makes
      the cupula gravity-sensitive.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Based on the theory of cupulolithiasis, the maneuver aimed to free
        adherent debris from the cupula with the proposed slingshot effect from
        the rapid change in head position.
      explanation: >-
        States the intended mechanistic target explicitly, and marks it as the
        design rationale rather than a demonstrated action.
- name: Barbecue Roll Maneuver
  description: >-
    Repositioning manoeuvre for the horizontal canal variant, rotating head and
    body in 90 degree increments through a full turn to walk geotropic canaliths
    back to the utricle. Used when the supine roll test shows geotropic
    horizontal nystagmus.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: barbecue roll repositioning maneuver
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When horizontal geotropic nystagmus is encountered, a maneuver known as the
      barbecue roll or barrel roll can be used to reposition the canalith in the
      plane of the horizontal canal.
    explanation: >-
      Ties this manoeuvre to the horizontal canal variant specifically.
  target_mechanisms:
  - target: Canalithiasis
    treatment_effect: BYPASSES
    description: >-
      Repositions free-floating debris out of the horizontal canal.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        can be used to reposition the canalith in the plane of the horizontal
        canal
      explanation: >-
        Names particle repositioning as the action, which is the mechanism node
        targeted.
- name: Vitamin D and Calcium Supplementation
  description: >-
    Secondary prevention after successful repositioning, for patients whose serum
    vitamin D is below 20 ng/mL. In a multicentre randomised trial, vitamin D 400
    IU plus calcium carbonate 500 mg twice daily for a year reduced the annual
    recurrence rate, with a number needed to treat of about four. This is the
    only intervention here shown to change the recurrence rate rather than
    terminate an attack.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: vitamin D and calcium supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: cholecalciferol (vitamin D3)
      term:
        id: CHEBI:28940
        label: calciol
    - preferred_term: calcium carbonate
      term:
        id: CHEBI:3311
        label: calcium carbonate
  evidence:
  - reference: PMID:32759193
    reference_title: >-
      Prevention of benign paroxysmal positional vertigo with vitamin D
      supplementation: A randomized trial.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The intervention group showed a reduction in the ARR (0.83 [95% confidence
      interval (CI), 0.74-0.92] vs 1.10 [95% CI, 1.00-1.19] recurrences per 1
      person-year) with an incidence rate ratio of 0.76 (95% CI, 0.66-0.87, p <
      0.001)
    explanation: >-
      Reports the primary outcome of the randomised trial that supports this
      treatment.
  target_mechanisms:
  - target: Otoconial Degeneration and Detachment from the Utricular Macula
    treatment_effect: MODULATES
    description: >-
      Supplementation is presumed to act on otoconial integrity at the initiating
      node, which is why it changes recurrence rather than aborting an attack.
      The mechanism is inferred from the trial result, not demonstrated
      histologically.
    evidence:
    - reference: PMID:32759193
      reference_title: >-
        Prevention of benign paroxysmal positional vertigo with vitamin D
        supplementation: A randomized trial.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The proportion of patients with recurrence was also lower in the
        intervention than in the observation group (37.8 vs 46.7%, p = 0.005).
      explanation: >-
        A reduction in recurrence is consistent with action at the detachment
        node, but the trial measures recurrence, not otoconial state, so the
        mechanistic attribution is an inference.
  notes: >-
    The trial abstract carries its own formal grade, stating that it provides
    Class III evidence. dismech has no slot for a source-assigned evidence grade,
    so it is recorded here rather than lost.
- name: Semicircular Canal Occlusion
  description: >-
    Surgical plugging of the posterior semicircular canal, reserved for
    intractable disease or severe frequent recurrence after repositioning has
    failed. It abolishes the canal's ability to transduce endolymph movement
    altogether, which is why it is definitive and why it is a last resort.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: semicircular canal occlusion
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For a small subset of patients with intractable BPPV, canal occlusion can
      be considered.
    explanation: >-
      Places canal occlusion as the option for treatment-refractory disease,
      which is how this treatment is scoped here.
  target_mechanisms:
  - target: Aberrant Cupular Deflection and False Angular Velocity Signal
    treatment_effect: INHIBITS
    description: >-
      Occlusion prevents endolymph flow in the treated canal, so cupular
      deflection can no longer be produced by particle movement regardless of how
      much debris is present.
    evidence:
    - reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Options for operative intervention are available for intractable cases or
        patients with severe and frequent recurrences.
      explanation: >-
        Supports the clinical role of surgery. Marked INDIRECT because the quoted
        sentence establishes the indication rather than the hydrodynamic
        mechanism attributed to it.
prevalence:
- population: European general population
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2400.0
  notes: >-
    Lifetime prevalence 2.4% from a European cross-sectional study, as reported
    in the cited review.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One European cross‐sectional study estimated the lifetime prevalence of
      BPPV to be 2.4%
    explanation: >-
      Gives the lifetime prevalence figure and the study design it came from.
- population: General population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 10.7
  rate_high: 64.0
  notes: >-
    Reported incidence range 10.7 to 64 cases per 100,000 per year. No single
    point estimate is recorded because the source gives only the range.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      data from subsequent research reported the incidence to be 10.7 to 64 cases
      per 100,000 per year
    explanation: >-
      Source of the incidence range recorded here.
- population: Patients presenting with vertigo
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Proportion of vertigo presentations ultimately diagnosed as BPPV. This is a
    clinic denominator rather than a population one and is not comparable with
    the population rates above. PrevalenceMeasureEnum has no value for a
    proportion-of-cases figure, so measure_type is UNKNOWN rather than
    PERIOD_PREVALENCE, which would assert a population denominator this number
    does not have.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with vertiginous symptoms will ultimately be diagnosed with BPPV
      in 17% to 42% of cases, making BPPV the most frequent cause of vertigo.
    explanation: >-
      Supports BPPV as the leading cause of vertigo within a clinical
      denominator.
progression:
- phase: Onset
  notes: >-
    Peak onset in the fifth and sixth decades, with a female predominance of two
    or three to one that is not seen in younger patients or in those whose
    disease follows trauma - a pattern consistent with the degenerative route
    dominating in later life and the traumatic route in earlier life.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the disorders disproportionately affect women at a ratio of 2 or 3 to 1,
      although the disparity between the sexes is not observed in younger
      patients or those with a traumatic etiology
    explanation: >-
      Documents both the sex ratio and the two groups in which it disappears,
      which is the substance of this phase.
- phase: Course and recurrence
  notes: >-
    Untreated episodes may remit spontaneously, but can persist for days, weeks,
    months or years, and recurrence after successful repositioning is common.
    Persistent or atypical nystagmus that does not respond to repositioning
    should prompt reconsideration of a central cause.
  evidence:
  - reference: PMID:21808648
    reference_title: >-
      Benign Paroxysmal Positional Vertigo (BPPV): History, Pathophysiology,
      Office Treatment and Future Directions.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPPV symptoms can resolve spontaneously but can last for days, weeks,
      months, and years.
    explanation: >-
      States the range of untreated course recorded in this phase.
  - reference: PMID:21808648
    reference_title: >-
      Benign Paroxysmal Positional Vertigo (BPPV): History, Pathophysiology,
      Office Treatment and Future Directions.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unusual patterns of nystagmus and nonrepsonse to treatment may suggest
      central pathology.
    explanation: >-
      Supports the red-flag clause. The typographical error in the word
      "nonrepsonse" is present in the source abstract and is preserved so that
      the quote remains an exact substring.
inheritance:
- name: Multifactorial with familial aggregation
  description: >-
    BPPV is multifactorial rather than Mendelian and no causal gene is
    established. A case-control family survey found relatives of affected
    patients five times more likely to have BPPV than relatives of dizzy
    controls, which the authors were explicit could reflect shared environment
    rather than heredity. This entry therefore records familial aggregation as an
    observed pattern, not as an inheritance mode, and binds no HPO
    mode-of-inheritance term.
  evidence:
  - reference: PMID:9870618
    reference_title: The familial incidence of benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients in our group with BPPV were 5 times as likely to have relatives
      with BPPV compared to the dizzy control group (chi2=5.95, DF=1, p=0.015).
    explanation: >-
      Reports the familial aggregation result with its statistic and its control
      group.
  - reference: PMID:9870618
    reference_title: The familial incidence of benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is nothing in our data that would distinguish between a hereditary or
      environmental influence in the development of the disease, however.
    explanation: >-
      The authors' own stated limitation, quoted so that this entry does not
      present familial clustering as evidence of heritability.
diagnosis:
- name: Dix-Hallpike maneuver
  description: >-
    The definitive positional test for posterior and anterior canal BPPV. The
    seated patient's head is turned 45 degrees toward the tested side to align
    that posterior canal vertically, then the patient is laid supine with the
    tested ear down. A positive test in a compatible history is diagnostic; no
    imaging or ancillary vestibular testing is normally required.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When performed in the office, the sensitivity and specificity are 79% to
      82% and 71% to 75%, respectively.
    explanation: >-
      Gives the operating characteristics of the test, which is what makes a
      positive result diagnostic rather than merely suggestive.
- name: Supine roll test
  description: >-
    Also called the Pagnini-McClure manoeuvre. Used when the history fits BPPV
    but Dix-Hallpike shows horizontal nystagmus or none. Unlike Dix-Hallpike it
    stimulates both horizontal canals at once, so the affected side is inferred
    by comparing nystagmus intensity and direction between the two head turns.
  evidence:
  - reference: PMID:30828628
    reference_title: Benign paroxysmal positional vertigo.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the Dix‐Hallpike maneuver, which isolates one posterior canal during
      testing, the supine roll test provokes both horizontal canals
      simultaneously.
    explanation: >-
      Explains why side determination differs between the two tests, which is the
      practical point of this entry.
differential_diagnoses:
- name: Meniere disease
  description: >-
    Episodic vertigo, but lasting minutes to hours rather than seconds, and
    accompanied by fluctuating hearing loss and tinnitus, which BPPV does not
    produce.
- name: Vestibular migraine
  description: >-
    Migraine is a risk factor for BPPV as well as a mimic of it, so the two can
    coexist; the discriminator is positional provocation with a positive
    Dix-Hallpike.
- name: Central positional vertigo
  description: >-
    Positional vertigo from a cerebellar or brainstem lesion. Suggested by
    nystagmus that does not fit a canal plane, lacks latency and fatigability, or
    fails to respond to repositioning.
- name: Semicircular canal dehiscence syndrome
  description: >-
    Vertigo provoked by sound or pressure rather than by head position, with
    autophony and a low-frequency conductive pattern on audiometry.
discussions:
- discussion_id: bppv_cupulolithiasis_adherence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do detached otoconia enter one canal rather than another in a given
    patient, and why does debris become adherent to the cupula in some people
    while remaining free-floating in others?
  rationale: >-
    The distinction between canalithiasis and cupulolithiasis determines the
    nystagmus pattern, the choice of manoeuvre and probably the chronicity of the
    disease, yet the strongest statement available is that cupulolithiasis has
    been suggested to be the more chronic form. Nothing in the literature
    reviewed for this entry explains what makes debris adhere. This is a gap in
    the mechanism, not merely in its description.
  attaches_to:
  - pathophysiology#Cupulolithiasis
notes: >-
  Curated from a Perplexity deep-research report, used strictly as a lead. The
  report's citation list resolved to web pages (Mayo Clinic, Cleveland Clinic,
  StatPearls, NORD) rather than to identifiers, so every claim kept here was
  re-anchored to a PMID fetched into references_cache and quoted from the fetched
  text. Ontology CURIEs proposed by the report were not reused: several were
  wrong (calcium carbonate given as CHEBI:3310 rather than CHEBI:3311, MONDO
  written as MONDO:0008000018, and Dizziness given the identifier that belongs to
  Vertigo), so every binding here was resolved independently through OAK.
review_notes: >-
  Two deliberate abstentions. The ampullary cupula is central to the mechanism
  but has no UBERON term, so it is described rather than bound. Head trauma has
  no ECTO exposure term, so that environmental entry carries no exposure_term;
  the NCIT head-trauma concepts are injury terms rather than exposure terms and
  were rejected rather than forced into the slot.

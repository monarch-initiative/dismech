    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The intervention group showed a reduction in the ARR (0.83 [95% confidence
      interval (CI), 0.74-0.92] vs 1.10 [95% CI, 1.00-1.19] recurrences per 1
      person-year) with an incidence rate ratio of 0.76 (95% CI, 0.66-0.87, p <
      0.001)
    explanation: >-
      Reports the primary outcome of the randomised trial that supports this

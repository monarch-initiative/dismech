clinical_trials:
- name: NCT04578470
  phase: PHASE_II
  status: UNKNOWN
  description: >-
    Vitamin D replacement versus placebo in older patients with idiopathic BPPV and low vitamin D. The published
    study enrolled 53 participants: 39 were randomized and 14 vitamin D-replete participants entered an observational
    comparison group. The randomized trial reported fewer recurrent episodes; its later falls analysis did
    not establish fall prevention.
  notes: >-
    ClinicalTrials.gov checked 2026-09-30: status UNKNOWN, phase 2, estimated enrollment 60, last posted update
    2020-10-09. These stale registry fields differ from the completed published cohort; the 53 published participants
    were not all randomized.
  evidence:
  - reference: clinicaltrials:NCT04578470
    reference_title: A Double Blinded Randomized Control Trial (RCT) to Evaluate the Effectiveness of Vitamin D Treatment in Lowering the Recurrence Rate of Benign Paroxysmal Positional Vertigo (BPPV) in Older Patients
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      there is a strong impetus for this study to lower the recurrence of BPPV in this vulnerable older population.
    explanation: >-
      Registry rationale identifies the older-patient recurrence question; it is not trial efficacy evidence.
  - reference: PMID:39194424
    reference_title: "Randomized Controlled Trial Assessing Vitamin D's Role in Reducing BPPV Recurrence in Older Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Results showed an 87% reduction in recurrence rates of BPPV in the treatment group (Group A), with 0.75
      fewer clinical episodes per 1 person-year as compared to placebo (Group B).
    explanation: >-
      Thirty-nine randomized participants with low vitamin D; the additional replete observation group was
      not randomized.
- name: NCT05853328
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Randomized comparison of Semont-plus and Epley for posterior-canal canalithiasis. Of 214 randomized patients,
    195 were analyzed per protocol. An initial clinician maneuver was followed by repeated home treatment;
    recovery time favored Semont-plus, whereas single-maneuver success did not significantly differ.
  notes: >-
    ClinicalTrials.gov checked 2026-09-30: COMPLETED, phase not applicable, actual enrollment 214; last posted
    update 2023-05-12. Registration was retrospective. The published analysis count of 195 differs from enrollment.
  evidence:
  - reference: clinicaltrials:NCT05853328
    reference_title: "Benign Peripheral Paroxysmal Positional Vertigo (BPPV): Comparison of the Epley Maneuver With the So-called SémontPLUS Liberation Maneuver"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Objective of this prospective randomized treatment trial is to compare the effectiveness of the SemontPLUS
      (SM+) with the Epley maneuver (EM) for the therapy of posterior canal benign paroxysmal positional vertigo
      canalolithiasis (pcBPPV).
    explanation: >-
      Registry identifies the population and comparison.
  - reference: PMID:37358870
    reference_title: "The Semont-Plus Maneuver or the Epley Maneuver in Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For the secondary end point (effect of a single maneuver), no significant difference was detected (67
      of 98 [68.4%] vs 61 of 97 [62.9%]; P = .42; α = .05).
    explanation: >-
      Prevents generalizing the home-course advantage to a single maneuver.
  - reference: PMID:37358870
    reference_title: "The Semont-Plus Maneuver or the Epley Maneuver in Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In this prospective randomized clinical trial, we found that in pcBPPV canalolithiasis, the SM-plus is
      more effective than the EM in terms of days until recovery
    explanation: >-
      Recovery-time advantage in the clinician-plus-repeated-home protocol; the separate single-maneuver comparison
      was not significant.
- name: KCT0004756
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    Korean registry program testing head-shaking and mastoid oscillation against sham for clinically defined
    persistent positional nystagmus variants. A published posterior-canal trial randomized 159 adults and found
    greater next-day resolution with head-shaking than sham; immediate efficacy and long-term recurrence prevention
    were not established.
  notes: >-
    WHO ICTRP cache refreshed 2020-02-24 reports Recruiting and target enrollment 375 across posterior, anterior
    and persistent geotropic presentations. That dated record does not establish current recruitment. The 2025
    publication reports the completed 159-patient posterior-canal study, not completion of every registered
    subgroup.
  evidence:
  - reference: ICTRP:KCT0004756
    reference_title: "Efficacy of head-shaking and mastoid oscillation maneuvers for treating cupulolithiasis of semicircular canals: Prospective Randomized Controlled Trials"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Procedure/Surgery : 1. head shaking : head shaking for 15seconds with frequency of 3 Hz
    explanation: >-
      Registered head-shaking intervention; publication establishes the actual posterior-canal result.
  - reference: PMID:40105844
    reference_title: "Treatment Maneuvers in Cupulolithiasis of the Posterior Canal Benign Paroxysmal Positional Vertigo: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the intention-to-treat analysis, 20 patients in the head-shaking group (37.7%), 14 in the mastoid
      oscillation group (26.4%), and 7 in the control group (13.2%) showed the resolution of vertigo and nystagmus
      the following day
    explanation: >-
      Direct next-day outcome; it is not evidence for long-term recurrence prevention.

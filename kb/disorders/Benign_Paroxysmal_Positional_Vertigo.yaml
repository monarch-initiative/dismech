      reference_title: Benign paroxysmal positional vertigo.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CRP aims to return the canaliths, under the influence of gravity, from
        the posterior semicircular canal back into the utricle.
      explanation: >-
        States the mechanical target of the treatment, which is exactly the node
        this link points at.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    The intervention is represented by Physical Therapy with a more specific preferred term. Postprocedural
    head-position restrictions are not routinely recommended after posterior-canal repositioning.
- name: Semont Liberatory Maneuver
  description: >-
    Semont is an alternative repositioning maneuver for posterior canal BPPV. Its original rationale was liberation
    of adherent debris, but it also moves free canaliths; therapeutic benefit does not prove cupular adhesion.
    Rapid body movements may be difficult for patients with limited mobility.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

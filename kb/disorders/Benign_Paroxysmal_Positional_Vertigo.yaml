      explanation: >-
        Inference from two surgically refractory cases, not a direct observation of detachment.
  - target: Cupulolithiasis
    causal_link_type: DIRECT
    description: >-
      Within the cupular-loading model, detached utricular material may adhere on the utricular face without
      first traversing the canal lumen.
    evidence:
    - reference: PMID:36998555
      reference_title: "Cupulolithiasis: A Critical Reappraisal."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: >-
        The utricular side of all three ampullae open widely into the utricular sac (Figure 3). As a result,
        there is no plunger effect on the utricular side and, importantly, the cupula on that side is constantly
        exposed to any detached otoconia in the sac.
      explanation: >-
        Anatomy permits a proposed utricular-face loading route; exposure to particles does not establish persistent

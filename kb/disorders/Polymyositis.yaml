  category: Neuromuscular
  frequency: VERY_FREQUENT
  description: "Hypotonia is reported as a very frequent (80-99%) manifestation of polymyositis in the Orphanet clinical phenotype dataset."
  phenotype_term:
    preferred_term: "Hypotonia"
    term:
      id: HP:0001252
      label: "Hypotonia"
  evidence:
  - reference: ORPHA:732
    reference_title: Polymyositis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0001252 | Hypotonia | Very frequent (99-80%)"
    explanation: "Orphanet records hypotonia as a very frequent (80-99%) phenotype of polymyositis."
  notes: >-
    Frequency band inherited from the ORPHA:732 bulk phenotype import and not
    corroborated by any clinical source. Hypotonia at VERY_FREQUENT is clinically
    surprising for an adult-onset inflammatory myopathy, where the cardinal finding is
    proximal weakness rather than reduced muscle tone; read this as Orphanet's coding
    choice rather than as an independently evidenced band, and re-check it against a
    clinical cohort before relying on it (dismech#6968, item 4).

- accession: geo:GSE125977
  title: MicroRNA and mRNA profiling in the idiopathic inflammatory myopathies
  description: 'Objectives: The idiopathic inflammatory myopathies (IIMs) are heterogeneous autoimmune conditions of skeletal muscle inflammation and weakness. MicroRNAs (miRNAs) are short, non-coding RNA which regulate gene expression of target mRNAs. The aim of this study was to profile miRNA and mRNA in IIM and identify miRNA-mRNA relationships which may be relevant to disease. Materials and methods: mRNA and miRNA in whole blood samples from 7 polymyositis (PM), 7 dermatomyositis (DM), 5 inclusion body myositis (IBM) and 5 non-myositis controls was profiled using next generation RNA sequencing. Gene ontology and pathway analyses were performed using GOseq and Ingenuity Pathway Analysis.'

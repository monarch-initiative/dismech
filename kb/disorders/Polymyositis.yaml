name: Polymyositis
creation_date: '2025-12-19T01:12:52Z'
category: Autoimmune
parents:
- Autoimmune Disease
- Inflammatory Myopathy
disease_term:
  preferred_term: Polymyositis
  term:
    id: MONDO:0019127
    label: polymyositis
description: >-
  An idiopathic inflammatory myopathy characterized by symmetric proximal muscle
  weakness without the skin manifestations of dermatomyositis. CD8+ T cell-mediated
  attack on muscle fibers is the primary pathogenic mechanism.
pathophysiology:
- name: CD8+ T Cell-Mediated Cytotoxicity
  description: >-
    Clonally expanded CD8+ cytotoxic T cells infiltrate muscle fibers and
    directly attack myocytes expressing MHC class I. Perforin and granzyme
    release leads to muscle fiber necrosis.
  cell_types:
  - preferred_term: CD8+ T Cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: Skeletal Muscle Cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: T Cell Cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  evidence:
  - reference: PMID:31257434
    reference_title: "A new in vitro model of polymyositis reveals CD8+ T cell invasion into muscle cells and its cytotoxic role."
    supports: SUPPORT
    snippet: "The hallmark histopathology of PM is the presence of CD8+ T cells in the non-necrotic muscle cells."
    explanation: Demonstrates that CD8+ T cell invasion into muscle fibers is the defining pathological feature of polymyositis.
  - reference: PMID:31257434
    reference_title: "A new in vitro model of polymyositis reveals CD8+ T cell invasion into muscle cells and its cytotoxic role."
    supports: SUPPORT
    snippet: "CD8+ T cells invade into muscle cells and contribute to muscle injury in PM."
    explanation: Confirms the direct cytotoxic role of CD8+ T cells in causing muscle fiber damage through invasion and attack.
  downstream:
  - target: Apoptosis of Muscle Fibers
    causal_link_type: DIRECT
    description: >-
      Cytotoxic T cells kill neighbouring fibers by an apoptotic route running in
      parallel with the partial-invasion route.
    evidence:
    - reference: PMID:32936839
      reference_title: "Apoptosis in idiopathic inflammatory myopathies with partial invasion; a role for CD8+ cytotoxic T cells?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The findings confirm that apoptosis occurs in idiopathic inflammatory myopathies and support that it is mediated by CD8+ cytotoxic T- cells, acting in parallel to the process of partial invasion."
      explanation: Attributes the apoptotic fiber death directly to CD8+ cytotoxic T cells.
  - target: Necroptosis and DAMP Release
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fiber death in myositis includes a necroptotic component, but what couples the
      cytotoxic infiltrate to necroptosis induction has not been identified.
    evidence:
    - reference: PMID:37483632
      reference_title: "Muscle fiber necroptosis in pathophysiology of idiopathic inflammatory myopathies and its potential as target of novel treatment strategy."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: 'Muscle fiber death, which has been formerly postulated as "necrosis", is a key histological feature of all subtypes of IIMs, however, its detailed mechanisms and contribution to the pathophysiology remained to be elucidated.'
      explanation: >-
        Supports fiber death as a core feature while stating explicitly that its
        mechanism is unresolved, which is why this edge is typed indirect with unknown
        intermediates rather than direct.
- name: Aberrant MHC Class I Expression
  description: >-
    Muscle fibers, which normally do not express MHC class I, show aberrant
    upregulation making them targets for CD8+ T cell recognition and attack.
  biological_processes:
  - preferred_term: MHC Class I Antigen Presentation
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  evidence:
  - reference: PMID:15934115
    reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
    supports: SUPPORT
    snippet: "Up-regulation of class I MHC in skeletal muscle fibers was an early and consistent feature of human inflammatory myopathies."
    explanation: Demonstrates that MHC class I upregulation is a hallmark feature of polymyositis pathogenesis.
  - reference: PMID:15934115
    reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
    supports: SUPPORT
    snippet: "Class I MHC staining in muscle fibers of myositis patients showed both cell surface and a reticular pattern of internal reactivity."
    explanation: Shows that aberrant MHC I expression occurs both on the sarcolemma and within the endoplasmic reticulum of muscle fibers.
  downstream:
  - target: CD8+ T Cell-Mediated Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      Sarcolemmal class I MHC is the ligand that turns an otherwise
      immunologically inconspicuous fiber into a target for antigen-specific CD8+
      T cells.
    evidence:
    - reference: PMID:31257434
      reference_title: "A new in vitro model of polymyositis reveals CD8+ T cell invasion into muscle cells and its cytotoxic role."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Analysis of the in vitro model of PM with confocal microscopy demonstrated the invasion of OT-I CD8+ T cells into H2KbOVA-myotubes."
      explanation: >-
        Myotubes engineered to present a model antigen on class I MHC are invaded by
        antigen-specific CD8+ T cells, supporting the MHC-I-to-cytotoxicity step in a
        reconstituted system. The antigen driving the human response is unknown, so
        this is PARTIAL rather than full support.
  - target: ER Stress and Unfolded Protein Response
    causal_link_type: DIRECT
    description: >-
      Class I MHC overexpression is itself sufficient to trigger the UPR in muscle,
      giving the entry its non-immune arm of fiber damage.
    evidence:
    - reference: PMID:15934115
      reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ectopic expression of wild-type mouse class I MHC (H-2K(b)) but not degradable glycosylation mutants of H-2K(b) induced ER stress response in C(2)C(12) skeletal muscle cells."
      explanation: >-
        Forced class I MHC expression induces the ER stress response in muscle cells,
        which establishes the direction of this edge rather than mere co-occurrence in
        biopsies.
- name: Myositis-Specific Autoantibodies
  description: >-
    Anti-synthetase antibodies (anti-Jo-1, anti-PL-7, anti-PL-12) define
    antisynthetase syndrome with myositis, ILD, and arthritis. Anti-SRP
    antibodies associate with necrotizing myopathy.
  biological_processes:
  - preferred_term: Immunoglobulin Production
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:23568993
    reference_title: "[Myositis-specific autoantibodies]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anti-Jo-1, anti-PL-7, anti-PL-12, anti-EJ, anti-KS, anti-OJ, anti-Ha, and anti-Zo antibodies target aminoacyl tRNA synthetases, and represent anti-synthetase syndrome."
    explanation: Sources the antisynthetase-antibody group named in this node.
  - reference: PMID:23568993
    reference_title: "[Myositis-specific autoantibodies]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "anti-SRP and anti-3-hydroxy-3-methylglutaryl-coenzyme A (anti-HMG-CoA) antibodies have been found in patients with necrotizing myopathy"
    explanation: Sources the anti-SRP / necrotizing-myopathy association named in this node.
  notes: >-
    Deliberately carries no `downstream` edges. Both antibody groups named here now
    define separate disease entities — antisynthetase syndrome and immune-mediated
    necrotizing myopathy, each curated in its own entry and listed under
    `differential_diagnoses` — rather than serologic subsets of polymyositis, and the
    pathogenic role of the antibodies themselves is unresolved. See the
    `pm_msa_pathogenic_role` and `pm_nosological_status` discussions.
- name: Pro-inflammatory Cytokine Production
  description: >-
    IL-1, TNF-alpha, and IFN-gamma produced by infiltrating immune cells
    perpetuate muscle inflammation and contribute to muscle weakness
    independent of direct fiber destruction.
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:9655472
    reference_title: "Induction of primary immune responses by allogeneic human myoblasts: dissection of the cell types required for proliferation, IFNgamma secretion and cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment of myoblasts with TNFalpha or IFNgamma led to the expression of a range of immunostimulatory molecules including MHC class I and II, and CD95 (Fas), but not B7 family molecules."
    explanation: >-
      Human muscle cells respond to TNF-alpha and IFN-gamma by becoming
      immunostimulatory, which is the mechanism this node asserts.
  downstream:
  - target: Aberrant MHC Class I Expression
    causal_link_type: DIRECT
    description: >-
      Feed-forward amplification: cytokines released by the infiltrate drive the class
      I MHC upregulation that recruits further cytotoxic attack, closing a loop with
      the CD8+ arm.
    evidence:
    - reference: PMID:9655472
      reference_title: "Induction of primary immune responses by allogeneic human myoblasts: dissection of the cell types required for proliferation, IFNgamma secretion and cytotoxicity."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Treatment of myoblasts with TNFalpha or IFNgamma led to the expression of a range of immunostimulatory molecules including MHC class I and II"
      explanation: >-
        TNF-alpha or IFN-gamma alone is sufficient to induce class I MHC on human
        myoblasts. The experiment used allogeneic myoblast cultures rather than
        myositis muscle, so the loop is inferred, not observed in patients.
- name: ER Stress and Unfolded Protein Response
  description: >-
    Overexpression of MHC class I in muscle fibers triggers endoplasmic reticulum
    stress and activation of the unfolded protein response (UPR). This includes
    upregulation of GRP78/BiP and NF-kappaB pathway activation, contributing to
    muscle fiber dysfunction independent of immune-mediated damage.
  biological_processes:
  - preferred_term: Endoplasmic Reticulum Stress Response
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:15934115
    reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
    supports: SUPPORT
    snippet: "The pathways of endoplasmic reticulum (ER) stress response, the unfolded protein response (glucose-regulated protein 78 pathway), and the ER overload response (NF-kappaB pathway) were significantly activated in muscle tissue of human myositis patients and in the mouse model."
    explanation: Demonstrates that ER stress pathways are activated in polymyositis muscle tissue as a consequence of MHC I overexpression.
  - reference: PMID:15934115
    reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
    supports: SUPPORT
    snippet: "These results indicate that the ER stress response may be a major nonimmune mechanism responsible for skeletal muscle damage and dysfunction in autoimmune myositis."
    explanation: Identifies ER stress as a non-immune mechanism contributing to muscle pathology, explaining why inflammation doesn't always correlate with disease severity.
  downstream:
  - target: Proximal muscle weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The non-immune route from class I MHC overexpression to weakness, invoked to
      explain why the degree of inflammation does not track disease severity.
    evidence:
    - reference: PMID:15934115
      reference_title: "Activation of the endoplasmic reticulum stress response in autoimmune myositis: potential role in muscle fiber damage and dysfunction."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "These results indicate that the ER stress response may be a major nonimmune mechanism responsible for skeletal muscle damage and dysfunction in autoimmune myositis."
      explanation: >-
        The authors' interpretive conclusion, drawn from combined human-biopsy and
        transgenic-mouse data; the steps between UPR activation and clinical weakness
        are not identified, hence the indirect typing and PARTIAL support.
- name: Necroptosis and DAMP Release
  description: >-
    Muscle fibers undergo necroptosis, a form of regulated cell death, releasing
    damage-associated molecular patterns (DAMPs) including HMGB1. This amplifies
    inflammation and contributes to persistent muscle weakness even after initial
    immune attack.
  biological_processes:
  - preferred_term: Necroptotic Process
    term:
      id: GO:0070266
      label: necroptotic process
  evidence:
  - reference: PMID:37483632
    reference_title: "Muscle fiber necroptosis in pathophysiology of idiopathic inflammatory myopathies and its potential as target of novel treatment strategy."
    supports: SUPPORT
    snippet: "Recent studies have revealed that muscle fibers of IIMs undergo necroptosis, a newly recognized form of regulated cell death, and promote muscle inflammation and dysfunction through releasing inflammatory mediators such as damage-associated molecular patterns (DAMPs)."
    explanation: Establishes necroptosis as a key mechanism of muscle fiber death in polymyositis that perpetuates inflammation.
  - reference: PMID:37483632
    reference_title: "Muscle fiber necroptosis in pathophysiology of idiopathic inflammatory myopathies and its potential as target of novel treatment strategy."
    supports: SUPPORT
    snippet: "The research on murine model of polymyositis, a subtype of IIM, revealed that the inhibition of necroptosis or HMGB1, one of major DAMPs released from muscle fibers undergoing necroptosis, ameliorated muscle inflammation and recovered muscle weakness."
    explanation: Demonstrates that blocking necroptosis or DAMP signaling improves both inflammation and muscle function, highlighting therapeutic potential.
  downstream:
  - target: Pro-inflammatory Cytokine Production
    causal_link_type: DIRECT
    description: >-
      DAMPs released from necroptotic fibers — HMGB1 chief among them — drive the
      inflammatory mediator output that sustains the lesion.
    evidence:
    - reference: PMID:37483632
      reference_title: "Muscle fiber necroptosis in pathophysiology of idiopathic inflammatory myopathies and its potential as target of novel treatment strategy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "muscle fibers of IIMs undergo necroptosis, a newly recognized form of regulated cell death, and promote muscle inflammation and dysfunction through releasing inflammatory mediators such as damage-associated molecular patterns (DAMPs)"
      explanation: States the necroptosis-to-inflammation step that this edge encodes.
  - target: Proximal muscle weakness
    causal_link_type: DIRECT
    description: >-
      The arm that accounts for weakness persisting after inflammation has been
      suppressed; blocking necroptosis or HMGB1 restores strength in the murine
      polymyositis model.
    evidence:
    - reference: PMID:37483632
      reference_title: "Muscle fiber necroptosis in pathophysiology of idiopathic inflammatory myopathies and its potential as target of novel treatment strategy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The research on murine model of polymyositis, a subtype of IIM, revealed that the inhibition of necroptosis or HMGB1, one of major DAMPs released from muscle fibers undergoing necroptosis, ameliorated muscle inflammation and recovered muscle weakness."
      explanation: >-
        Loss-of-function rescue in a mouse polymyositis model gives this edge its
        causal direction. It has not been demonstrated in human muscle.
- name: Apoptosis of Muscle Fibers
  description: >-
    Apoptotic cell death occurs in muscle fibers surrounding those undergoing
    partial invasion by CD8+ T cells. Fibers with apoptotic nuclei are surrounded
    by CD8+ T cells, granzyme B-positive cells, and macrophages, suggesting
    cytotoxic T cell-mediated apoptosis occurs in parallel to direct invasion.
  biological_processes:
  - preferred_term: Apoptotic Process
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:32936839
    reference_title: "Apoptosis in idiopathic inflammatory myopathies with partial invasion; a role for CD8+ cytotoxic T cells?"
    supports: SUPPORT
    snippet: "Apoptotic myonuclei were found in muscle with partial invasion, but not in the invaded fibres. Fibres with TUNEL positive nuclei were surrounded by CD8+ T-cells, granzyme B+ cells and macrophages, but lacked FAS receptor expression."
    explanation: Shows that apoptosis occurs in polymyositis muscle fibers adjacent to those with CD8+ T cell invasion, mediated by cytotoxic mechanisms.
  - reference: PMID:32936839
    reference_title: "Apoptosis in idiopathic inflammatory myopathies with partial invasion; a role for CD8+ cytotoxic T cells?"
    supports: SUPPORT
    snippet: "The findings confirm that apoptosis occurs in idiopathic inflammatory myopathies and support that it is mediated by CD8+ cytotoxic T- cells, acting in parallel to the process of partial invasion."
    explanation: Establishes that CD8+ T cell-mediated apoptosis is a distinct pathway of muscle damage occurring alongside direct fiber invasion.

treatments:
- name: Corticosteroids
  description: >-
    First-line therapy; high-dose initially with gradual taper. Used empirically
    rather than on the strength of randomized evidence, and the adverse-effect burden
    is itself the reason a steroid-sparing agent is usually added early.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  evidence:
  - reference: PMID:29669460
    reference_title: "Current diagnosis and treatment of polymyositis and dermatomyositis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "glucocorticoids are used empirically as the first-line treatment despite their various adverse effects"
    explanation: >-
      Supports first-line status while being explicit that the basis is empirical
      practice rather than trial evidence.
- name: Methotrexate
  description: >-
    Most commonly used steroid-sparing agent. Added to reduce cumulative
    glucocorticoid exposure rather than on demonstrated independent efficacy in adult
    polymyositis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  evidence:
  - reference: PMID:29669460
    reference_title: "Current diagnosis and treatment of polymyositis and dermatomyositis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Concomitant treatment with steroid-sparing immunosuppressive agents, including methotrexate, azathioprine, calcineurin inhibitors, mycophenolate mofetil, and cyclophosphamide, reduces successfully initial glucocorticoid doses for the remission induction, the relapse risk during glucocorticoid tapering, and adverse effects of glucocorticoids."
    explanation: Supports the steroid-sparing rationale for methotrexate in PM/DM.
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For methotrexate, there may be little or no improvement in adults with DM or PM in function"
    explanation: >-
      Cochrane's very-low-certainty finding qualifies the steroid-sparing rationale:
      the single 27-participant adult RCT showed no functional benefit.
- name: Azathioprine
  description: >-
    Alternative steroid-sparing immunosuppressant for maintenance. The only randomized
    placebo comparison is a 16-participant study from which no reliable conclusion can
    be drawn.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  evidence:
  - reference: PMID:29669460
    reference_title: "Current diagnosis and treatment of polymyositis and dermatomyositis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Concomitant treatment with steroid-sparing immunosuppressive agents, including methotrexate, azathioprine, calcineurin inhibitors, mycophenolate mofetil, and cyclophosphamide, reduces successfully initial glucocorticoid doses"
    explanation: Supports azathioprine's steroid-sparing role in PM/DM management.
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "For azathioprine versus placebo, one study showed little or no effect of azathioprine on improvement in muscle strength, but the evidence was very uncertain"
    explanation: >-
      Records that the randomized evidence base for azathioprine in IIM is a single
      very-low-certainty trial, so the steroid-sparing rationale is not trial-confirmed.
- name: IVIG
  description: >-
    Intravenous immunoglobulin for refractory disease or when immunosuppression is
    contraindicated. Randomized evidence supports it in refractory dermatomyositis;
    the polymyositis-specific data are explicitly judged unreliable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  evidence:
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravenous immunoglobulin (IVIg), compared to placebo, probably improves disability and muscle strength in participants with refractory IIM"
    explanation: >-
      Moderate-certainty meta-analytic support across refractory idiopathic
      inflammatory myopathy pooled (3 RCTs, 136 participants).
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our review shows improvement in disability, muscle strength and skin symptoms following IVIg in people with refractory DM (for PM, these data are not reliable; other subtypes have not been investigated in RCTs)."
    explanation: >-
      The benefit is established for refractory dermatomyositis. The review states
      outright that the polymyositis data are not reliable, so this must not be read as
      trial-proven for the disease curated here.
differential_diagnoses:
- name: Sporadic Inclusion Body Myositis
  disease_term:
    preferred_term: Sporadic Inclusion Body Myositis
    term:
      id: MONDO:0007827
      label: inclusion body myositis
  description: >-
    The most consequential misdiagnosis. In the follow-up study that established
    polymyositis as overdiagnosed, most patients still carrying a PM label at
    re-evaluation had turned out to have sporadic inclusion body myositis.
  distinguishing_features:
  - >-
    Asymmetric weakness with early, disproportionate involvement of finger flexors and
    quadriceps, rather than symmetric proximal weakness.
  - >-
    Slowly progressive over years, and characteristically refractory to
    corticosteroids and immunosuppression.
  - >-
    Muscle biopsy shows rimmed vacuoles and protein aggregates in addition to the
    endomysial CD8+ infiltrate that polymyositis shares.
  evidence:
  - reference: PMID:12913190
    reference_title: "Polymyositis: an overdiagnosed entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At follow-up evaluation, five of the nine patients with PM had typical s-IBM features."
    explanation: >-
      Five of the nine patients diagnosed with polymyositis were reclassified as s-IBM
      on follow-up, which is why IBM heads this list.
- name: Dermatomyositis
  disease_term:
    preferred_term: Dermatomyositis
    term:
      id: MONDO:0016367
      label: dermatomyositis
  description: >-
    The sibling inflammatory myopathy from which polymyositis was historically
    separated by skin findings alone under the 1975 Bohan and Peter criteria; the two
    are now distinguished on immunopathology as well.
  distinguishing_features:
  - >-
    Characteristic cutaneous disease (heliotrope rash, Gottron papules), which
    polymyositis lacks by definition.
  - >-
    Perivascular CD4+ T-cell and complement-associated infiltrate with perifascicular
    atrophy, versus the endomysial CD8+ infiltrate surrounding and invading
    non-necrotic fibers in polymyositis.
  evidence:
  - reference: PMID:41068877
    reference_title: "Recent advances in immunological mechanisms and murine disease models of idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "polymyositis, which is characterized by CD8 T-cell infiltration around muscle fibers, and dermatomyositis, which is characterized by CD4 T-cell infiltration with complement infiltration around blood vessels, along with distinctive skin symptoms, have been traditionally distinguished"
    explanation: Sources the immunopathological contrast used to separate the two entries.
- name: Immune-Mediated Necrotizing Myopathy
  disease_term:
    preferred_term: Immune-Mediated Necrotizing Myopathy
    term:
      id: MONDO:0016098
      label: immune-mediated necrotizing myopathy
  description: >-
    A seropositive necrotizing myopathy that accounts for a substantial share of cases
    historically labelled polymyositis. No dismech entry exists for it yet.
  distinguishing_features:
  - >-
    Anti-SRP or anti-HMG-CoA reductase antibodies, the latter often statin-associated.
  - >-
    Biopsy shows myocyte necrosis and regeneration with sparse inflammatory infiltrate,
    rather than the endomysial CD8+ invasion of non-necrotic fibers.
  evidence:
  - reference: PMID:23568993
    reference_title: "[Myositis-specific autoantibodies]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "anti-SRP and anti-3-hydroxy-3-methylglutaryl-coenzyme A (anti-HMG-CoA) antibodies have been found in patients with necrotizing myopathy"
    explanation: Sources the serological signature that separates IMNM from polymyositis.
  notes: >-
    Curating an Immune-Mediated Necrotizing Myopathy entry would let the anti-SRP
    content in this entry's `Myositis-Specific Autoantibodies` node be moved to where
    it belongs.
- name: Antisynthetase Syndrome
  disease_term:
    preferred_term: Antisynthetase Syndrome
    term:
      id: MONDO:0019344
      label: antisynthetase syndrome
  description: >-
    The clinicoserological entity defined by anti-aminoacyl-tRNA-synthetase
    antibodies. Several features curated on this entry — pulmonary fibrosis, arthritis,
    the anti-Jo-1 biochemical marker — are attributed in their own notes to
    antisynthetase syndrome rather than to polymyositis proper.
  distinguishing_features:
  - >-
    Anti-Jo-1 or another anti-synthetase antibody, with interstitial lung disease,
    arthritis, fever, Raynaud phenomenon and mechanic's hands accompanying the myositis.
  - >-
    Interstitial lung disease is more prevalent and more severe than in polymyositis or
    dermatomyositis, and often dominates the course.
  evidence:
  - reference: PMID:23568993
    reference_title: "[Myositis-specific autoantibodies]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anti-synthetase syndrome is characterized by myositis, interstitial lung disease, arthritis, fever, Raynaud's phenomenon, and mechanic's hands."
    explanation: Sources the syndrome definition used to separate these features from polymyositis.
discussions:
- discussion_id: pm_nosological_status
  prompt: >-
    Is polymyositis a distinct disease entity, or a residual label for idiopathic
    inflammatory myopathy that has not yet been resolved into antisynthetase syndrome,
    immune-mediated necrotizing myopathy, or inclusion body myositis?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#CD8+ T Cell-Mediated Cytotoxicity
  - pathophysiology#Myositis-Specific Autoantibodies
  rationale: >-
    This entry models polymyositis as a standalone entity with a CD8+/MHC-I mechanism.
    That mechanism is real and is what defines PM histologically, but the *scope* of
    the label is contested: a follow-up study of 165 myositis patients could reclassify
    most PM diagnoses, and contemporary classifications carve antisynthetase syndrome,
    immune-mediated necrotizing myopathy and overlap myositis out of the same
    population. The unresolved question determines what belongs in this entry — in
    particular whether the antisynthetase content (pulmonary fibrosis, arthritis,
    anti-Jo-1, and the `Myositis-Specific Autoantibodies` node) should move to
    Antisynthetase_Syndrome, and whether an Immune-Mediated Necrotizing Myopathy entry
    is needed to receive the anti-SRP content.
  evidence:
  - reference: PMID:12913190
    reference_title: "Polymyositis: an overdiagnosed entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polymyositis is an overdiagnosed entity."
    explanation: The primary source for the claim that the label is applied far more often than it applies.
  - reference: PMID:41068877
    reference_title: "Recent advances in immunological mechanisms and murine disease models of idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recent classifications based on autoantibodies and gene expression have proposed new categories, such as antisynthetase syndrome, clinical amyopathic dermatomyositis, immune-mediated necrotizing myopathy, and inclusion body myositis, resulting in the concept of IIM as a spectrum of diseases including these subtypes"
    explanation: Documents the reclassification of the IIM space into which polymyositis is being subdivided.
  - reference: PMID:39132766
    reference_title: "Current efforts and historical perspectives on classification of idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "there is a need to revise the criteria with regard to the addition of new myositis-specific autoantibodies, newly defined subgroups (especially antisynthetase syndrome, immune medicated necrotizing myopathy and overlap myositis)"
    explanation: >-
      Shows the question is live rather than settled — the 2017 EULAR/ACR criteria are
      themselves under revision on exactly this point.
  notes: >-
    Raised as item 3 of dismech#6968, which asks explicitly whether this entry should
    stay as-is with a scoping note, gain a discussion, or be repositioned relative to
    its sibling IIM entries. This discussion records the uncertainty; the repositioning
    decision is left to a maintainer. Related to dismech#306 (lumping/splitting).
- discussion_id: pm_treatment_evidence_base
  prompt: >-
    Does any immunosuppressive or immunomodulatory therapy have reliable randomized
    evidence of benefit in polymyositis specifically, as opposed to in dermatomyositis
    or in idiopathic inflammatory myopathy pooled?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Corticosteroids
  - treatments#Methotrexate
  - treatments#Azathioprine
  - treatments#IVIG
  rationale: >-
    All four treatments curated here are standard of care, and none rests on
    polymyositis-specific randomized evidence. Glucocorticoids are used empirically;
    the Cochrane review finds the azathioprine and methotrexate trials
    very-low-certainty; and while IVIg has moderate-certainty benefit in refractory
    IIM pooled and in refractory dermatomyositis, the review states that the
    polymyositis data are not reliable. This is not merely a citation gap — it is
    plausibly downstream of `pm_nosological_status`, since trials enrolling "PM" have
    been enrolling a mixed population.
  evidence:
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the other agents, the small number of trials of immunosuppressive and immunomodulatory therapies is inadequate to decide whether these agents are beneficial in IIM (excluding IBM)."
    explanation: The review's own summary of the size of this gap.
  - reference: PMID:40787733
    reference_title: "Non-targeted immunosuppressive and immunomodulatory therapies for idiopathic inflammatory myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of bias in all but one study was high or unclear."
    explanation: Characterizes the quality of the 16 trials that do exist.
- discussion_id: pm_msa_pathogenic_role
  prompt: >-
    Are myositis-specific autoantibodies pathogenic drivers of muscle injury, or
    diagnostic markers of an immune response to regenerating muscle?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Myositis-Specific Autoantibodies
  rationale: >-
    This is why the `Myositis-Specific Autoantibodies` node carries no `downstream`
    edges. The antibodies are well established as classifiers, but no route from
    antibody to fiber injury has been demonstrated, and the leading alternative — that
    the autoantigens are simply overexpressed in regenerating fibers — would make the
    antibodies a consequence of muscle damage rather than a cause. Drawing a causal
    edge either way would assert more than the literature supports.
  evidence:
  - reference: PMID:23568993
    reference_title: "[Myositis-specific autoantibodies]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although the pathogenic role of MSAs remains unknown, recent studies have shown that myositis autoantigens are expressed at high levels in regenerating muscle fibers, which may initiate or amplify autoimmune responses in idiopathic inflammatory myopathies."
    explanation: States both the gap and the leading alternative interpretation in one sentence.

    modifier: DECREASED
  evidence:
  - reference: PMID:39013459
    reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trithorax-related H3K4 methyltransferases, KMT2C and KMT2D, are critical epigenetic modifiers. Haploinsufficiency of KMT2C was only recently recognized as a cause of neurodevelopmental disorder (NDD)"
    explanation: States the enzyme identity and the haploinsufficiency mechanism this node asserts.
  - reference: PMID:39013459
    reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we generated a moderate strength disorder-specific KMT2C DNA methylation (DNAm) signature and demonstrate its utility in classifying non-truncating variants."
    explanation: >-
      The episignature result. It is the reason this node is curated as a separate
      molecular lesion rather than folded into the EHMT1 node, and the authors'
      own grading of it as moderate strength is why the node claims a reduced
      enzyme dose and not a quantified H3K4 deficit in patient brain.
  downstream:
  - target: Intellectual disability
    description: >
      Developmental delay and intellectual disability are the core features of
      the KMT2C-related disorder in the largest published series.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39013459
      reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Based on 81 individuals with pathogenic/likely pathogenic variants, we demonstrate that the KMT2C-related NDD is characterized by developmental delay, intellectual disability, behavioral and psychiatric problems, hypotonia, seizures, short stature, and other comorbidities."
      explanation: Names intellectual disability among the defining features of the KMT2C-related disorder.
  - target: Global developmental delay
    description: >
      Developmental delay is reported alongside intellectual disability in the
      same series.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Childhood hypotonia
    description: >
      Hypotonia is one of the comorbidities the KMT2C series reports.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    description: >
      Seizures are reported in the KMT2C series and are independently described
      in a later three-patient series, one of whom presented with epilepsy.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  notes: >-
    Deliberately not given a `downstream` edge to the NMDAR or REST/NRSF nodes.
    Both of those are EHMT1-specific results - patient-derived neuronal networks
    and EHMT1-deficient mice for the first, EHMT1-dependent miRNA derepression
    for the second - and no published work places KMT2C on either. Drawing such
    an edge would assert a shared effector pathway the sources do not support, so
    this node reaches the shared phenotypes directly and the causal links are
    typed INDIRECT_UNKNOWN_INTERMEDIATES to record that the intervening steps
    are not curated.
- name: NMDAR-mediated neuronal network dysfunction
  description: >
    In EHMT1-deficient human cortical neurons, reduced H3K9me2 at the GRIN1
    promoter leads to upregulation of NMDA receptor subunit 1 (NMDAR1/GluN1),
    driving aberrant neuronal network activity with reduced burst rate, longer
    burst duration, and increased temporal irregularity. Pharmacological
    inhibition of NMDARs rescues the network phenotype, establishing a direct
    mechanistic link between EHMT1 deficiency and NMDAR hyperfunction that
    provides a potential basis for targeted therapeutic approaches.
  cell_types:
  - preferred_term: excitatory cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DYSREGULATED
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Intellectual disability
    description: >
      Disrupted neuronal network dynamics and synaptic plasticity underlie
      the cognitive impairment.
  - target: Severe speech and language impairment
    description: >
      The same network and plasticity disruption underlies the language
      deficit, which in this syndrome is disproportionate to the cognitive
      one.
  - target: Seizures
    description: >
      Imbalanced excitatory neurotransmission through NMDAR hyperfunction
      contributes to epileptogenesis.
  evidence:
  - reference: DOI:10.1038/s41467-019-12947-3
    reference_title: "Neuronal network dysfunction in a model for Kleefstra syndrome mediated by enhanced NMDAR signaling"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neuronal networks of patient-derived cells exhibit network bursting with a reduced rate, longer duration, and increased temporal irregularity compared to control networks"
    explanation: >
      iPSC-derived excitatory cortical neuron networks from KS patients show
      characteristic network dysfunction that is rescued by NMDAR antagonism.
  - reference: DOI:10.1038/s41467-019-12947-3
    reference_title: "Neuronal network dysfunction in a model for Kleefstra syndrome mediated by enhanced NMDAR signaling"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we rescue the KS patient-derived neuronal network phenotypes by pharmacological inhibition of NMDARs"
    explanation: >
      Pharmacological rescue with NMDAR antagonists demonstrates that NMDAR
      hyperfunction is a key driver of network dysfunction in KS.
  - reference: DOI:10.1038/s41467-019-12947-3
    reference_title: "Neuronal network dysfunction in a model for Kleefstra syndrome mediated by enhanced NMDAR signaling"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice EHMT1 deficiency leads to similar neuronal network impairments with increased NMDAR function"
    explanation: >
      EHMT1-deficient mice recapitulate the neuronal network impairment with
      increased NMDAR function seen in patient-derived human neurons,
      providing cross-species corroboration of the NMDAR-hyperfunction mechanism.
- name: REST/NRSF dysregulation via miRNA derepression
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  description: >
    EHMT1 deficiency leads to derepression of multiple miRNAs that target the
    neuronal transcriptional repressor REST/NRSF. EHMT1 normally maintains
    H3K9me2 marks at miRNA transcription start sites, keeping them silenced.
    When EHMT1 is haploinsufficient, these miRNAs are upregulated, reducing
    REST protein levels and prematurely de-repressing neuronal gene programs.
    This disrupts the timing of neurodevelopment and contributes to the
    aberrant neuronal differentiation seen in Kleefstra syndrome.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: ABNORMAL
  evidence:
  - reference: DOI:10.1038/s41398-022-02199-z
    reference_title: "NRSF/REST lies at the intersection between epigenetic regulation, miRNA-mediated gene control and neurodevelopmental pathways associated with Intellectual disability (ID) and Schizophrenia"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced EHMT1 activity decreases NRSF/REST protein leading to abnormal neuronal gene expression and progression of neurodevelopment in human iPSC"
    explanation: >
      Human iPSC model shows EHMT1 deficiency reduces REST protein via
      miRNA-mediated mechanisms, causing premature neuronal gene activation.
  - reference: DOI:10.1038/s41398-022-02199-z
    reference_title: "NRSF/REST lies at the intersection between epigenetic regulation, miRNA-mediated gene control and neurodevelopmental pathways associated with Intellectual disability (ID) and Schizophrenia"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EHMT1 regulates NRSF/REST indirectly via repression of miRNA and leads to aberrant neuronal gene regulation and neurodevelopment timing"
    explanation: >
      Establishes the indirect EHMT1-miRNA-REST pathway as a mechanism for
      altered neurodevelopmental timing in Kleefstra syndrome.
  - reference: DOI:10.1038/s41398-022-02199-z
    reference_title: "NRSF/REST lies at the intersection between epigenetic regulation, miRNA-mediated gene control and neurodevelopmental pathways associated with Intellectual disability (ID) and Schizophrenia"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of a NRSF/REST mRNA that lacks the miRNA-binding sites restores neuronal gene regulation to EHMT1 deficient cells"
    explanation: >
      A rescue experiment expressing a miRNA-insensitive REST mRNA restores
      normal neuronal gene regulation in EHMT1-deficient cells, confirming the
      miRNA-REST axis as the causal effector of the epigenetic defect.

      label: chromatin organization
    modifier: DYSREGULATED
  downstream:
  - target: NMDAR-mediated neuronal network dysfunction
    description: >
      Reduced H3K9me2 at the GRIN1 promoter leads to upregulation of NMDA
      receptor subunit 1 and aberrant neuronal network activity.
  - target: REST/NRSF dysregulation via miRNA derepression
    description: >
      EHMT1 deficiency derepresses miRNAs that target REST/NRSF, reducing
      REST protein and prematurely activating neuronal gene programs.
  evidence:
  - reference: PMID:16826528
    reference_title: "Loss-of-function mutations in euchromatin histone methyl transferase 1 (EHMT1) cause the 9q34 subtelomeric deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haploinsufficiency for EHMT1 is causative for 9q subtelomeric deletion syndrome"
    explanation: >
      Original identification of EHMT1 loss-of-function mutations as the cause
      of the 9q34 subtelomeric deletion syndrome (now Kleefstra syndrome).
  - reference: DOI:10.1038/s41467-019-12947-3
    reference_title: "Neuronal network dysfunction in a model for Kleefstra syndrome mediated by enhanced NMDAR signaling"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these changes are mediated by upregulation of NMDA receptor (NMDAR) subunit 1 correlating with reduced deposition of the repressive H3K9me2 mark, the catalytic product of EHMT1, at the GRIN1 promoter"
    explanation: >
      iPSC-derived cortical neurons from KS patients show reduced H3K9me2 at
      the GRIN1 promoter, directly linking EHMT1 haploinsufficiency to
      specific gene derepression.
- name: KMT2C haploinsufficiency and reduced H3K4 methylation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  description: >
    KMT2C (MLL3) is a trithorax-related histone H3 lysine 4 methyltransferase.
    Heterozygous protein-truncating variants, and rare missense variants in its
    functional domains, reduce the dose of the enzyme; haploinsufficiency is the
    proposed mechanism. This is the opposite chromatin arm from EHMT1: EHMT1
    writes the repressive H3K9me1/me2 mark, KMT2C writes the permissive H3K4
    mark, and the two genes therefore reach a shared neurodevelopmental
    transcriptional phenotype from opposite directions rather than through one
    pathway. The strongest evidence that this is a real and separable molecular
    lesion is a disorder-specific DNA methylation episignature that classifies
    KMT2C variants and separates this disorder from EHMT1-related Kleefstra
    syndrome 1.
  genes:
  - preferred_term: KMT2C
    term:
      id: hgnc:13726
      label: KMT2C
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

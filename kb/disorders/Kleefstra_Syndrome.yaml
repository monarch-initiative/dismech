- name: KMT2C loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: Kleefstra syndrome 2
  gene_term:
    preferred_term: KMT2C
    term:
      id: hgnc:13726
      label: KMT2C
  features: >
    Heterozygous loss-of-function mutations in KMT2C (MLL3), encoding a histone
    H3 lysine 4 methyltransferase, cause Kleefstra syndrome 2 (MONDO:0054701).
    Phenotypically overlaps with Kleefstra syndrome 1 but involves a distinct
    chromatin-modifying gene on a different chromosome.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:39013459
    reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained 98 individuals with rare KMT2C variants, including 75 with protein-truncating variants (PTVs). Notably, ∼15% of KMT2C PTVs were inherited."
    explanation: >-
      The cohort's size and its inherited-versus-de-novo split. Recorded as evidence
      rather than as a `case_fractions` entry, because that slot carries the share of a
      disease's cases attributable to a gene and this is the share of one gene's
      truncating variants that were inherited - a different quantity.
  - reference: PMID:39013459
    reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on 81 individuals with pathogenic/likely pathogenic variants, we demonstrate that the KMT2C-related NDD is characterized by developmental delay, intellectual disability, behavioral and psychiatric problems, hypotonia, seizures, short stature, and other comorbidities."
    explanation: The largest published KMT2C series, defining the phenotype of the disorder this subtype row names.
  - reference: PMID:39013459
    reference_title: "Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from Kleefstra and Kabuki syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, we define the clinical features, molecular spectrum, and DNAm signature of the KMT2C-related NDD and demonstrate they are distinct from Kleefstra and Kabuki syndromes highlighting the need to rename this condition."
    explanation: The authors' explicit call to rename the condition, which is the nosological disagreement this record documents.
  - reference: PMID:41914216
    reference_title: "Novel Variants in KMT2C Further Support a Neurodevelopmental Disorder Distinct From Kleefstra and Kabuki Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, only the most typical affected individuals can be described by clinical examination, and identifying non‐specific and/or mildly affected individuals is only possible after a genetic examination and determination of the causal gene variant. On the other hand, KMT2C‐related Kleefstra syndrome 2 is not clinically recognizable, and the so far‐described patients were diagnosed through a genotype‐first approach"
    explanation: >-
      A later series that both affirms the distinctness and continues to use the
      Kleefstra syndrome 2 label, which is why the concept is retained here rather
      than removed.
  - reference: CGGV:assertion_e1dcdd6c-30e0-4d06-8df5-f120b1b02477-2022-03-02T170000.000Z
    reference_title: "KMT2C / syndromic intellectual disability (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KMT2C | HGNC:13726 | syndromic intellectual disability | MONDO:0000508 | AD | Definitive"
    explanation: >-
      ClinGen's only KMT2C gene-disease validity assertion. It is definitive, but it
      is recorded against syndromic intellectual disability rather than against
      Kleefstra syndrome 2, which is the point of the note on this record.
  notes: >
    KMT2C is recorded by OMIM and MONDO as the causal gene of Kleefstra syndrome 2
    (MONDO:0054701), and that relationship is what this record binds. Two caveats
    belong with it.

    First, the disease concept itself is contested. The largest published series
    (98 ascertained individuals, 81 with pathogenic or likely pathogenic variants)
    shows the KMT2C-related neurodevelopmental disorder is clinically and
    epigenetically distinct from EHMT1-related Kleefstra syndrome 1 - separable by
    facial gestalt scoring and by a disorder-specific DNA methylation signature -
    and its authors explicitly call for the condition to be renamed. A 2026 series
    of three further patients reaches the same conclusion about distinctness while
    still using the Kleefstra syndrome 2 label. This entry keeps the subtype row
    because MONDO:0054701 is the identifier the ecosystem keys on, but a reader
    should not infer that KMT2C and EHMT1 produce one clinical entity.

    Second, ClinGen does not carry an assertion for this pair. Its only KMT2C
    gene-disease validity row - checked against the ClinGen gene-validity download
    retrieved 2026-09-19 - is KMT2C against syndromic intellectual disability
    (MONDO:0000508, Definitive, autosomal dominant). That is a strong statement
    about the gene and a silence about the Kleefstra syndrome 2 label, which is
    consistent with the renaming argument above.

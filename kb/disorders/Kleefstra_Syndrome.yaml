    reports that this disorder is clinically and epigenetically distinct from
    EHMT1-related Kleefstra syndrome 1 and from KMT2D-related Kabuki syndrome,
    and its authors call for the condition to be renamed. It is retained here
    as a subtype row because MONDO:0054701 is the term the wider ecosystem
    still keys on; see the KMT2C `genetic:` record for the nosological
    argument and the evidence behind it.

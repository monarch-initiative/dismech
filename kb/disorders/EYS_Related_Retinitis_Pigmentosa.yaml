    preferred_term: EYS
    modifier: ABSENT
    term:
      id: hgnc:21555
      label: EYS
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573

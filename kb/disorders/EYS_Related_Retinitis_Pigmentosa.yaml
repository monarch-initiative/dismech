    explanation: >-
      In silico domain prediction from the assembled coding sequence, defining the
      EYS protein as an extracellular multidomain protein with EGF-like and LamG
      scaffolding domains.
  - reference: PMID:18836446
    reference_title: "EYS, encoding an ortholog of Drosophila spacemaker, is mutated in autosomal recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Information about the established function of insect orthologs suggests that EYS may possess similar functions in maintaining the integrity of the photoreceptor cells in human retina"
    explanation: >-
      A hedged inference from insect ortholog function ("may possess similar
      functions"), not a direct human observation; it motivates but does not
      establish the photoreceptor-maintenance role in human retina.
  - reference: PMID:18836446
    reference_title: "EYS, encoding an ortholog of Drosophila spacemaker, is mutated in autosomal recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-PCR analysis of cDNAs from a variety of normal tissues and cell lines using cDNA specific primers within RP25 (Supplementary Table 1 online) amplified the expected-size product only from the retina and from a photoreceptor-like cell line, Y79"
    explanation: >-
      Expression assay on tissue cDNA panels and a cultured photoreceptor-like cell
      line demonstrating retina-restricted EYS expression, explaining why loss of
      EYS function is restricted to photoreceptors.
  downstream:
  - target: Ciliary Structural Disruption
    description: >-
      Loss of EYS disrupts the structural integrity of the connecting cilium
      and periciliary space, leading to ciliary structural disruption.
    causal_link_type: DIRECT

- name: Ciliary Structural Disruption
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >-
    EYS localizes near the connecting cilium/transition zone of photoreceptors and to
    the ciliary axoneme, shown by immunostaining in zebrafish and primate retina and
    in ciliated human Y79 photoreceptor-like cells. The connecting cilium is the
    narrow bridge linking the photoreceptor inner segment (biosynthetic compartment)
    to the outer segment (disc-containing phototransduction compartment); it is
    functionally equivalent to the transition zone of primary cilia. In zebrafish,
    loss of EYS disrupts the ciliary pocket of cone photoreceptors and mislocalizes
    outer segment proteins, indicating a requirement for EYS in maintaining this
    compartment and in delivering outer segment components; the corresponding
    localization and transport claims for human photoreceptors are inferred from
    these non-human vertebrate and cell-line data rather than directly demonstrated.
    On this basis EYS is treated as a photoreceptor-restricted ciliopathy gene. In
    Drosophila, the ortholog spam/eyes shut maintains the physical separation between
    rhabdomeric photoreceptors in the open rhabdom; without it, photoreceptors
    collapse together.
  cellular_components:
  - preferred_term: connecting cilium
    term:
      id: GO:0035869
      label: ciliary transition zone
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:

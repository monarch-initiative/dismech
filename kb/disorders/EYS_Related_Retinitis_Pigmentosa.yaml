name: EYS-Related Retinitis Pigmentosa
creation_date: "2026-06-30T00:00:00Z"
category: Mendelian
description: >-
  EYS-related retinitis pigmentosa (RP25) is an autosomal recessive inherited retinal
  dystrophy caused by biallelic pathogenic variants in EYS (eyes shut homolog, also
  known as EGFL11/SPAM), the largest eye-specific gene in the human genome, spanning
  over 2 Mb on chromosome 6q12 and encoding a predicted 3,145–3,165 amino acid
  extracellular protein. EYS is an ortholog of Drosophila eyes shut (eys/spacemaker),
  a protein essential for maintaining the open rhabdom architecture of photoreceptors.
  The EYS protein contains multiple EGF-like domains and C-terminal laminin G (LamG)
  domains. In the vertebrate retinas in which it has been examined — zebrafish and
  primate — EYS localizes near the connecting cilium/transition zone and the
  photoreceptor ciliary axoneme, where it is thought to help maintain the integrity
  of the ciliary compartment and outer segment. Loss of EYS function disrupts
  photoreceptor ciliary architecture, leading to progressive rod photoreceptor
  degeneration followed by secondary cone loss, producing the classic retinitis
  pigmentosa triad of nyctalopia, peripheral visual field constriction, and eventual
  severe visual impairment. EYS is one of the most frequently mutated genes in
  autosomal recessive RP: EYS mutations were reported in at least 12% of a French
  cohort of sporadic and autosomal recessive RP cases and in 18% of a Japanese arRP
  cohort. Reported variant types include nonsense substitutions, frameshift and large
  intragenic deletions, and splice-site changes; truncating variants are predicted to
  undergo nonsense-mediated decay, while missense and splice variants of uncertain
  consequence have also been reported. No approved disease-modifying therapy exists;
  gene augmentation approaches are under development.
disease_term:
  preferred_term: retinitis pigmentosa 25
  term:

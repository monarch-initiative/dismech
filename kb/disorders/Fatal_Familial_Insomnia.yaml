- name: Regionally Selective PrP-Sc Accumulation in Gray Matter
  biological_scale: TISSUE
  description: >-
    Protease-resistant PrP accumulates in gray matter but not white matter or
    peripheral organs, and its distribution is broader than the histological lesions:
    lesions appear only where a critical amount of the abnormal protein has
    accumulated. The kinetics are region-specific - the mediodorsal thalamic nucleus
    and brainstem carry comparable amounts regardless of disease duration, whereas
    neocortical accumulation rises with duration, so the process spreads over time.
  locations:

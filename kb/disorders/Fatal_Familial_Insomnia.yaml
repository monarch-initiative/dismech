diagnosis:
- name: PRNP sequencing with codon-129 phasing
  description: >-
    Diagnosis is established by identifying the heterozygous PRNP c.532G>A (D178N)
    pathogenic variant. Because the same substitution causes familial CJD when carried
    in cis with 129V, the codon-129 allele on the mutant chromosome must be
    determined - genotyping codon 129 without phasing is insufficient. Chromosomal
    microarray, karyotype, and repeat-expansion testing have no role.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "proband with suggestive findings and a heterozygous PRNP pathogenic variant"
    explanation: GeneReviews diagnostic criterion for genetic prion disease including FFI.
  - reference: PMID:1439789
    reference_title: "Fatal familial insomnia and familial Creutzfeldt-Jakob disease: disease phenotype determined by a DNA polymorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "segregated with FFI in all 15 affected members of five kindreds whereas the"
    explanation: Justifies why codon-129 phasing is diagnostically necessary rather than optional.
- name: Polysomnography
  description: >-
    Polysomnography measures the defining physiological lesion directly: loss of sleep
    spindles and K-complexes, drastic reduction in total sleep time, loss of cyclic
    sleep organization, and eventual abolition of NREM sleep with residual REM without
    atonia. It is the most informative ancillary test in FFI.
  diagnosis_term:
    preferred_term: polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  evidence:

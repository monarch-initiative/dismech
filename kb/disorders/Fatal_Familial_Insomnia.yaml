    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "50% chance of inheriting the variant"
    explanation: GeneReviews states the autosomal dominant 50% transmission risk for genetic prion disease.
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "asymptomatic because of reduced penetrance"
    explanation: GeneReviews documents reduced penetrance in some PRNP variant carriers.
  - reference: PMID:37626863
    reference_title: "Genetic Variants Associated with the Age of Onset Identified by Whole-Exome Sequencing in Fatal Familial Insomnia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disease with a wide variability in age of onset"
    explanation: Documents the wide variability in age at onset within FFI (D178N-129M).

has_subtypes:
- name: 129MM
  display_name: FFI, codon-129 methionine homozygote (short course)
  description: >-
    Patients homozygous for methionine at codon 129 (i.e. 129M on both the mutant and
    the wild-type allele) run a short clinical course of roughly 9 months and present
    with the classic insomnia/oneiric/dysautonomic picture.
  evidence:
  - reference: PMID:9669701
    reference_title: "Clinical features of fatal familial insomnia: phenotypic variability in relation to a polymorphism at codon 129 of the prion protein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "oneiric episodes, insomnia and dysautonomia at onset, whereas heterozygotes"
    explanation: Homozygotes at codon 129 present with prominent oneiric episodes, insomnia, and dysautonomia.
- name: 129MV
  display_name: FFI, codon-129 methionine/valine heterozygote (prolonged course)
  description: >-
    Patients heterozygous methionine/valine at codon 129 run a markedly prolonged
    course (mean about 31 months), present more often with ataxia and dysarthria, lose
    sphincter control earlier, may have generalized seizures, and show more extensive
    cortical involvement on FDG-PET and at autopsy.
  evidence:
  - reference: PMID:9669701
    reference_title: "Clinical features of fatal familial insomnia: phenotypic variability in relation to a polymorphism at codon 129 of the prion protein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed ataxia and dysarthria at onset, earlier sphincter loss and epileptic"
    explanation: Defines the distinct presenting features of the codon-129 heterozygous subtype.


  description: >-
    CSF 14-3-3, a classic surrogate marker of rapid neuronal injury in
    Creutzfeldt-Jakob disease, is frequently negative in FFI. Positivity concentrates
    in genetic CJD with C-terminal PRNP mutations (after amino acid 188) and is
    specifically not characteristic of P102L GSS or D178N FFI, so a negative result
    has no exclusionary value here.
  diagnosis_term:
    preferred_term: cerebrospinal fluid analysis
    term:
      id: NCIT:C173272
      label: CSF Analysis
  evidence:
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF 14-3-3 showed high positivity rates, particularly in gCJD patients with a point mutation in the C-terminal (after aa 188), but not in P102L and D178N cases."
    explanation: Establishes that CSF 14-3-3 is not a reliable positive marker in D178N FFI.
- name: Brain MRI (low yield in D178N FFI)
  description: >-
    The sporadic-CJD MRI signature - cortical ribboning on DWI, caudate/putamen
    hyperintensity, and pulvinar/posterior-thalamic signal - is informative across
    most genetic prion subtypes but specifically not in FFI. Only 25.5% of D178N
    cases showed any such abnormality, versus 92.3% of P102L cases and a 66.0%
    overall rate, and all three individual MRI abnormalities were low in D178N. A
    normal or nonspecific MRI is therefore the expected finding in FFI.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI scanning is helpful for most types of gPrD with positivity rates similar to sCJD, except for D178N FFI"
    explanation: States explicitly that MRI is the exception - unhelpful - in D178N FFI.
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only 25.5% (12/47) of D178N cases showed such an abnormality"
    explanation: Quantifies the low MRI positivity rate in D178N FFI.
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three MRI abnormalities in D178N FFI patients were clearly low"
    explanation: All three sporadic-CJD MRI abnormalities are individually low-yield in FFI.
- name: EEG (periodic sharp wave complexes essentially absent)
  description: >-
    The periodic sharp wave complexes that support a diagnosis of sporadic
    Creutzfeldt-Jakob disease are effectively absent in FFI: only 1 of 48 D178N cases
    showed PSWCs, against 48.5% of E200K genetic CJD cases. EEG in FFI is instead
    useful for spectral analysis of sleep architecture (see polysomnography), not for
    the classic periodic pattern.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one out of 48 cases of D178N FFI showed PSWCs on the EEG"
    explanation: Quantifies the near-absence of the classic CJD periodic EEG pattern in FFI.

progression:
- notes: >-
    Onset is typically in the sixth decade (GeneReviews gives 50-60 years for genetic
    prion disease broadly), though reported FFI onsets span roughly 19 to 68 years. The
    course is continuously progressive and death follows within months to about three
    years. Duration is bimodal by the codon-129 genotype of the non-mutant allele:
    about 9 months in methionine homozygotes versus about 31 months in
    methionine/valine heterozygotes. In national surveillance data, FFI and GSS
    patients tend to present earlier than point-mutation genetic CJD patients.
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ranges from 50 to 60 years"
    explanation: GeneReviews typical age at onset for genetic prion disease including FFI.
  - reference: PMID:9669701
    reference_title: "Clinical features of fatal familial insomnia: phenotypic variability in relation to a polymorphism at codon 129 of the prion protein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients ran either a short (9.1 +/- 1.1 months) or a prolonged (30.8 +/-"
    explanation: Quantifies the bimodal disease duration by codon-129 genotype.
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "insomnia (FFI) cases usually displayed clinical symptoms earlier than genetic"
    explanation: National surveillance data on relative age at onset of FFI versus genetic CJD.

treatments:
- name: Multidisciplinary supportive and palliative care
  description: >-
    No disease-modifying therapy exists. Management is supportive: sleep-symptom
    management, autonomic and cardiac monitoring, nutrition and swallowing assessment,
    fall prevention, physical/occupational/speech therapy, psychiatric and caregiver
    support, advance care planning, and palliative care. Sedatives may reduce distress
    but do not restore sleep architecture, and polypharmacy can worsen confusion,
    falls, and respiratory risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

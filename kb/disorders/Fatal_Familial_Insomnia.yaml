clinical_trials:
- name: NCT06153966
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    PrProfile - a Phase 1/2a first-in-human study of intrathecal ION717, an antisense
    oligonucleotide that lowers PrP by degrading PRNP mRNA, in patients with prion
    disease. PrP lowering acts upstream of conformational conversion and is therefore
    mechanistically applicable to FFI.
  evidence:
  - reference: clinicaltrials:NCT06153966
    reference_title: "A Phase 1/2a Study to Evaluate the Safety, Tolerability, Pharmacokinetics and Pharmacodynamics of Intrathecally Administered ION717 in Patients With Prion Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the safety, tolerability, pharmacokinetics and pharmacodynamics of intrathecal (IT) delivery of ION717."
    explanation: The active PrP-lowering ASO programme relevant to genetic prion disease including FFI.

discussions:
- discussion_id: gap_ffi_thalamic_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the mediodorsal thalamic nucleus so selectively vulnerable in FFI, sustaining
    severe neuronal loss at only moderate PrP-Sc burden, when protease-resistant PrP is
    distributed far more widely across gray matter?
  rationale: >-
    Regional PrPres quantification shows accumulation is broader than the lesions, and
    that the mediodorsal nucleus is damaged at PrPres levels that leave other regions
    intact. Neither the 19 kDa strain conformation nor codon-129 phase explains why this
    particular nucleus is the primary target, so the cell-intrinsic determinant of
    thalamic vulnerability is unknown.
  attaches_to:
  - pathophysiology#Preferential Thalamic Neuronal Loss and Astrogliosis
  proposed_experiments:
  - experiment_id: exp_ffi_thalamic_vulnerability_spatial_omics
    name: Spatially resolved comparison of vulnerable versus resistant thalamic nuclei
    description: >-
      Perform cell-type-resolved spatial transcriptomics and proteomics on FFI autopsy
      thalamus, comparing the mediodorsal and anteroventral nuclei against thalamic
      nuclei that remain histologically intact in the same brains. Test whether
      baseline PRNP expression level, proteostatic capacity (chaperone and
      ubiquitin-proteasome components), or metabolic reserve tracks with regional
      vulnerability after adjusting for local PrPres burden.
  - experiment_id: exp_ffi_prelesional_knockin_mouse_thalamus
    name: Pre-lesional single-nucleus profiling of D178N-129M knock-in thalamus
    description: >-
      Profile thalamic nuclei of D178N-129M knock-in mice at time points before
      histological lesions or EEG change appear, to separate primary cell-intrinsic
      vulnerability from secondary injury response. A vulnerability signature present
      pre-lesionally and restricted to the mediodorsal nucleus would support a
      cell-intrinsic determinant.
- discussion_id: gap_ffi_prevention_window
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can PrP-lowering therapy started inside the 13-21 month pre-symptomatic window
    prevent or delay clinical FFI, and what surrogate endpoint could demonstrate that?
  rationale: >-
    Serial FDG-PET places the start of measurable thalamic neurodegeneration 13-21
    months before onset, implying that intervention must be pre-symptomatic. But the
    preventive doxycycline study had to compare against a historical dataset precisely
    because no validated surrogate endpoint exists, and that gap now blocks efficient
    trials of the mechanistically stronger PrP-lowering agents.
  attaches_to:
  - pathophysiology#Template-Directed Conversion of PrP-C to FFI-Type PrP-Sc
  proposed_experiments:
  - experiment_id: exp_ffi_presymptomatic_surrogate_qualification
    name: Qualification of a composite pre-symptomatic FFI progression surrogate
    description: >-
      Follow a prospective cohort of D178N carriers with paired thalamic FDG-PET,
      quantitative spindle-density polysomnography, and plasma neurofilament light,
      anchored to observed clinical conversion. Test whether any single measure or
      composite changes monotonically across the 13-21 month pre-symptomatic window
      with enough effect size to power a prevention trial shorter than the 10-year
      historical-control design.
  - experiment_id: exp_ffi_presymptomatic_prnp_aso_biomarker_trial
    name: Biomarker-endpoint PRNP-lowering ASO trial in pre-symptomatic carriers
    description: >-
      Test intrathecal PRNP-lowering antisense oligonucleotide in pre-symptomatic D178N
      carriers using thalamic metabolic decline (with CSF PrP reduction as the
      target-engagement measure) as the primary endpoint rather than clinical
      conversion, pairing it with the genotype-concealing consent design that the
      doxycycline study showed to be acceptable to these families.
- discussion_id: gap_ffi_sfi_strain_identity
  kind: KNOWLEDGE_GAP
  prompt: >-
    If sporadic fatal insomnia is clinically and histopathologically near-identical to
    FFI and carries the same 19 kDa type-2 PrP-Sc, why does it lack the glycoform skew
    characteristic of FFI, and does that difference mean a distinct prion strain?
  rationale: >-
    Sporadic fatal insomnia patients are codon-129 methionine homozygotes without D178N,
    yet reproduce the FFI phenotype - implying the 19 kDa conformer, not the mutation,
    specifies the disease. The reproducible absence of unglycosylated-isoform
    underrepresentation is an unexplained molecular discrepancy that bears directly on
    whether glycosylation pattern is part of strain identity or a consequence of the
    mutant substrate.
  attaches_to:
  - pathophysiology#Template-Directed Conversion of PrP-C to FFI-Type PrP-Sc
  proposed_experiments:
  - experiment_id: exp_ffi_sfi_serial_transmission_strain_comparison
    name: Serial transmission comparison of FFI versus sporadic fatal insomnia isolates
    description: >-
      Inoculate humanized 129MM PrP transgenic mice with FFI and sporadic-fatal-insomnia
      brain isolates and compare incubation period, lesion profile, PrPres fragment
      size, and glycoform ratio across serial passages. Convergence of the glycoform
      ratio on serial passage would indicate the skew is substrate-determined rather
      than an intrinsic strain property.
  - experiment_id: exp_ffi_glycoform_substrate_dependence_pmca
    name: Cell-free conversion test of glycoform-skew substrate dependence
    description: >-
      Use protein misfolding cyclic amplification with mutant D178N-129M versus
      wild-type 129M PrP-C substrate, seeded with the same FFI-derived template, and
      measure whether the underrepresentation of the unglycosylated isoform requires the
      mutant substrate.

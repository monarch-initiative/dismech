mechanistic_hypotheses:
- hypothesis_group_id: native_state_destabilization
  hypothesis_label: Native-State Thermodynamic Destabilization of PrP-C
  status: DEPRECATED
  description: >-
    The historical model that familial PRNP substitutions cause disease by lowering the
    thermodynamic (and kinetic) stability of the folded C-terminal domain of PrP-C, so
    that the native alpha-helical fold more readily slips into a beta-sheet-rich,
    conversion-competent conformer. It is intuitive and still widely repeated, but it was
    tested directly and does not hold: measured stabilities of the familial-mutant
    proteins do not correlate with disease phenotype, and PrP-C folding is too fast and
    too cooperative to expose a folding-intermediate route to PrP-Sc. Recorded here as a
    DEPRECATED hypothesis rather than silently deleted, because an earlier revision of
    this entry asserted it as the mechanism of the "Acquisition of a Conversion-Prone
    PrP-C State" node, and the intuition is likely to be reintroduced by a future curator
    unless the refuting evidence stays attached to the claim it refutes.
  evidence:
  - reference: PMID:9813003
    reference_title: "Familial mutations and the thermodynamic stability of the recombinant human prion protein."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "some hereditary forms of prion disease cannot be rationalized using the concept of mutation-induced thermodynamic destabilization of the cellular prion protein"
    explanation: >-
      The paper set out to test this exact hypothesis for the FFI (M129/D178N), GSS
      (P102L) and familial CJD (E200K) variants and concluded against it. D178N could not
      even be assayed because it aggregated; P102L was indistinguishable from wild-type
      and E200K only very slightly destabilized.
  - reference: PMID:10079068
    reference_title: "Influence of amino acid substitutions related to inherited human prion diseases on the thermodynamic stability of the cellular prion protein."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "These data suggest that destabilization of PrPC is neither a general mechanism underlying the formation of PrPSc nor the basis of disease phenotypes in inherited human TSEs."
    explanation: >-
      Independent replication across all eight disease-associated substitutions in the
      structured C-terminal domain: five destabilize it and three do not, and the
      stabilities do not track disease phenotype.
  - reference: PMID:10360358
    reference_title: "Extremely rapid folding of the C-terminal domain of the prion protein without kinetic intermediates."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "propagation of the abnormal, oligomeric prion protein PrP(Sc), which is supposed to be the causative agent of transmissible spongiform encephalopathies, is unlikely to follow a mechanism where kinetic folding intermediates of PrP(C) are a source of PrP(Sc) subunits"
    explanation: >-
      Refutes the kinetic half of the hypothesis specifically. Stopped-flow folding of the
      structured domain has a half-life of about 170 microseconds with no detectable
      intermediates, so a populated folding intermediate is not available as the PrP-Sc
      precursor. Species/construct caveat: measured on murine mPrP(121-231) carrying an
      engineered F175W fluorescence reporter - not human PrP and not the D178N-129M
      haplotype - so the argument is a cross-species extrapolation resting on the
      conservation of the C-terminal globular fold between mouse and human PrP. The
      authors show the reporter variant has "the same overall structure and stability as
      wild-type mPrP(121-231)", which addresses the construct but not the species step.
  notes: >-
    Deprecating this hypothesis does not resolve the mechanism - it only removes a wrong
    answer. How the D178N-129M haplotype actually confers conversion propensity, and why
    the same substitution with 129V yields familial CJD instead, remains open; see the
    strain-identity knowledge-gap discussion on this entry.

pathophysiology:
- name: PRNP D178N-129M Germline Allele
  biological_scale: MOLECULAR
  description: >-
    A heterozygous PRNP p.Asp178Asn allele, carried in cis with methionine at codon
    129, is present from conception in every cell. The cis-phase is part of the lesion:
    the same amino-acid substitution with valine at codon 129 produces a different
    disease (familial CJD), so the pathogenic unit is the haplotype, not the codon-178
    change alone.
  genes:
  - preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  downstream:
  - target: Acquisition of a Conversion-Prone PrP-C State
  evidence:
  - reference: PMID:1439789
    reference_title: "Fatal familial insomnia and familial Creutzfeldt-Jakob disease: disease phenotype determined by a DNA polymorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Met129, Asn178 allele segregated with FFI in all 15 affected members of five kindreds whereas the Val129, Asn178 allele segregated with the familial CJD subtype in all 15 affected members of six kindreds."
    explanation: Names the specific pathogenic haplotype that segregates with FFI.
- name: Acquisition of a Conversion-Prone PrP-C State
  biological_scale: MOLECULAR
  description: >-
    The D178N substitution, in cis with 129M, renders PrP-C prone to adopting the
    misfolded, self-templating conformer that seeds propagation. Recombinant human PrP
    carrying the FFI M129/D178N haplotype is markedly aggregation-prone: unlike the
    GSS (P102L) and familial CJD (E200K) variants, which are recovered soluble, the
    D178N protein partitions into inclusion bodies. This is a gain of toxic
    conformation, not a loss of PrP function.
  notes: >-
    Curation note on what this node deliberately does NOT claim. An earlier revision
    asserted that D178N lowers the "thermodynamic and kinetic barrier" separating the
    native alpha-helical fold from beta-sheet-rich conformers. That wording was removed:
    it states as mechanism a hypothesis the primary literature has tested and rejected.
    The refuting evidence is recorded at disease level as the DEPRECATED
    `native_state_destabilization` hypothesis (PMID:9813003, PMID:10079068,
    PMID:10360358) rather than here, so the refutation stays attached to the claim it
    refutes. This node is therefore scoped to the conversion and aggregation propensity
    that is actually observed; the mechanism by which the D178N-129M haplotype confers
    it remains open - see the strain-identity knowledge-gap discussion.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  downstream:
  - target: Template-Directed Conversion of PrP-C to FFI-Type PrP-Sc
  evidence:
  - reference: PMID:9813003
    reference_title: "Familial mutations and the thermodynamic stability of the recombinant human prion protein."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "whereas the D178N variant aggregated into inclusion bodies"
    explanation: >-
      Recombinant human PrP(90-231) carrying the FFI M129/D178N haplotype partitions into
      inclusion bodies, where the P102L and E200K variants are recovered soluble from the
      same expression system - so aggregation propensity distinguishes this haplotype
      from the other familial variants. Tagged PARTIAL rather than SUPPORT deliberately:
      inclusion-body formation in E. coli is an aggregation observation and a common
      expression artifact, not a clean proxy for self-templating conversion propensity in
      vivo, and the authors draw no such inference themselves - they report it only as
      the reason D178N could not be assayed.
- name: Template-Directed Conversion of PrP-C to FFI-Type PrP-Sc
  biological_scale: MOLECULAR
  description: >-
    The autocatalytic core of the disease: a misfolded PrP molecule recruits and
    refolds native PrP-C, so that the conformation itself acts as the replicating
    template. In FFI the resulting protease-resistant core is a 19 kDa (type 2)
    fragment with marked underrepresentation of the unglycosylated glycoform - a
    molecular signature distinct from the 21 kDa fragment of sporadic and other
    inherited prion diseases. Inoculation of FFI brain extract into chimeric
    human-mouse PrP transgenic mice reproduces the 19 kDa fragment, establishing that
    conformation, not sequence, carries the strain information.
  biological_processes:
  - preferred_term: protein homooligomerization
    term:
      id: GO:0051260
      label: protein homooligomerization
    modifier: INCREASED
  - preferred_term: protein refolding

- name: Preferential Thalamic Neuronal Loss and Astrogliosis
  biological_scale: TISSUE
  description: >-
    The defining lesion: marked neuronal depletion and astrocytic gliosis concentrated
    in the mediodorsal and anteroventral thalamic nuclei, with inferior olivary
    hypertrophy and only limited cortical spongiosis. The mediodorsal nucleus appears
    intrinsically more vulnerable - it sustains severe neuronal loss at relatively
    moderate PrP-Sc burden - which is why FFI is a thalamic disease rather than a
    diffuse encephalopathy.

- name: Pre-symptomatic thalamic hypometabolism in mutation carriers
  description: >-
    Serial FDG-PET and polysomnography in asymptomatic D178N carriers were normal 21 to
    63 months before onset, but selective thalamic hypometabolism with impaired spindle
    formation appeared about 13 months before clinical presentation - placing the start
    of measurable neurodegeneration in a narrow 13-21 month pre-symptomatic window.
    This defines the therapeutic window for any preventive intervention.

    reference_title: "Pre-symptomatic diagnosis in fatal familial insomnia: serial neurophysiological and 18FDG-PET studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FFI begins in the thalamus between 13 and 21 months before the clinical"

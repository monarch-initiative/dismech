      id: hgnc:9449
      label: PRNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Causal gene. FFI is caused by the heterozygous germline missense variant PRNP
    c.532G>A (p.Asp178Asn, historically D178N), which eliminates a Tth111 I
    restriction site. The lesion is a toxic conformational gain of function, not
    haploinsufficiency: the encoded PrP is not non-functional but conformationally
    unfaithful.

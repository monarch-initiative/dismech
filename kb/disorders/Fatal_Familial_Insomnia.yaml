- name: Collapse of Thalamocortical Sleep Oscillation
  biological_scale: ORGANISM
  description: >-
    Destruction of thalamic relay and reticular circuitry abolishes the thalamocortical
    oscillations that generate sleep spindles, K-complexes, and slow-wave sleep. The
    result is not ordinary insomnia but a failure to build sleep: spindles and
    K-complexes disappear early, NREM sleep is eventually abolished, and only brief
    residual REM periods without atonia persist, intruding into wakefulness as enacted
    dreams. FFI is the clinical experiment that implicated the thalamus as necessary
    for sleep generation.
  biological_processes:
  - preferred_term: circadian sleep/wake cycle
    term:
      id: GO:0042745
      label: circadian sleep/wake cycle
    modifier: DECREASED
  - preferred_term: regulation of circadian sleep/wake cycle

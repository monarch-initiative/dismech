biochemical:
- name: Protease-resistant PrP (PrP-Sc) type 2, 19 kDa
  notes: >-
    The FFI molecular signature on Western blot of brain tissue: a protease-resistant
    PrP core of relative molecular mass 19 kDa (type 2), with marked
    underrepresentation of the unglycosylated glycoform relative to the di- and
    monoglycosylated forms. This distinguishes FFI both from other prion diseases
    (21 kDa, type 1) and from sporadic fatal insomnia (19 kDa but without the
    glycoform skew). It is a post-mortem or biopsy brain-tissue finding, not a
    clinically accessible fluid biomarker.
  presence: INCREASED
  specificity: HIGH
  evidence:
  - reference: PMID:10371520
    reference_title: "A subtype of sporadic prion disease mimicking fatal familial insomnia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the relative molecular mass of 19 kDa, corresponding to the so-called type 2,"
    explanation: Defines the 19 kDa type-2 PrP-Sc that identifies FFI.
  - reference: PMID:1346338
    reference_title: "Fatal familial insomnia, a prion disease with a mutation at codon 178 of the prion protein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protease-resistant PrP was found in both patients with fatal familial"
    explanation: Original demonstration of protease-resistant PrP in FFI brain.
- name: CSF total tau
  notes: >-
    Elevated CSF total tau (threshold >1400 pg/mL in the Chinese national
    surveillance series) is found in more than half of FFI cases. It is notable as
    the one widely available CSF marker that is usually informative in FFI, in
    contrast to 14-3-3 and RT-QuIC, which both underperform in D178N. It is a marker
    of neuronal injury rather than a prion-specific test, so it supports but does not
    establish the diagnosis.
  presence: INCREASED
  specificity: LOW
  evidence:
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased CSF tau was found in more than half of FFI and T188K gCJD cases"
    explanation: Quantifies elevated CSF total tau in the majority of FFI cases.

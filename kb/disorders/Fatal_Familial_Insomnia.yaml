- name: Doxycycline (preventive, investigational)
  description: >-
    Doxycycline was selected for pre-symptomatic prevention on the basis of preclinical
    anti-prion activity, good blood-brain-barrier penetration, and a known safety
    profile. In the preventive study, 10 D178N carriers over 42 years old received
    100 mg/day and 15 non-carriers received placebo under a genotype-concealing design,
    with incidence compared against a historical dataset over 10 years. The published
    material establishes feasibility and design, not proven prevention.

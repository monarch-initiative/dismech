  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    The common PRNP M129V polymorphism is not merely a severity modifier here but a
    disease-determining second genetic component. D178N in cis with 129M segregates
    with FFI; the same D178N in cis with 129V segregates with a familial CJD subtype.
    Separately, the codon-129 genotype of the non-mutant allele (MM vs MV) governs
    disease duration and the breadth of cortical involvement. Laboratories must
    therefore phase codon 129, not merely genotype it.

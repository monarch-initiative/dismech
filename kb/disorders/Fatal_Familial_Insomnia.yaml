    snippet: "genetic prion disease is available."
    explanation: GeneReviews confirms no treatment of the underlying cause is available.
- name: Close periodic surveillance
  description: >-
    Because progression is very rapid, GeneReviews recommends review by the
    multidisciplinary team approximately every 14 days to reassess symptomatic needs.

- name: CSF RT-QuIC (low sensitivity in D178N FFI)
  description: >-
    Real-time quaking-induced conversion is the modern seeding assay for prion
    disease, but it performs worst in FFI of all the common genetic prion subtypes.
    In the Chinese national surveillance series the D178N group had the lowest
    RT-QuIC positivity rate of any subtype at 15.8%, against 63.6% for P102L GSS and
    a 32.3% overall rate. Clinically decisive point: a negative CSF RT-QuIC does NOT
    exclude FFI, and PRNP sequencing remains the diagnostic test.

    Curation note on the comparator: the source is internally inconsistent about which
    GSS allele carries the 63.6% rate - its abstract says P105L, its results and
    discussion sections say P102L. P102L is used here because it matches the body text
    and the quoted snippet. Do not "correct" this against the abstract.
  diagnosis_term:
    preferred_term: cerebrospinal fluid analysis
    term:
      id: NCIT:C173272
      label: CSF Analysis
  evidence:
  - reference: PMID:34487324
    reference_title: "Genetic Prion Disease: Insight from the Features and Experience of China National Surveillance for Creutzfeldt-Jakob Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest RT-QuIC positivity rate (63.6%) was in the P102L group and lowest (15.8%) in the D178N group"
    explanation: Quantifies the low RT-QuIC sensitivity in D178N FFI relative to other genetic prion subtypes.

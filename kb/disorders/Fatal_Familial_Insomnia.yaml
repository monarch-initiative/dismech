name: Fatal Familial Insomnia
creation_date: "2026-07-29T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: fatal familial insomnia
  term:
    id: MONDO:0010808
    label: fatal familial insomnia
synonyms:
- FFI
- familial fatal insomnia
- genetic fatal insomnia
references:
- reference: PMID:20301407
  title: "Genetic Prion Disease"
  tags:
  - GeneReviews
description: >-
  Fatal familial insomnia (FFI) is a very rare, invariably fatal autosomal dominant
  genetic prion disease caused by the PRNP c.532G>A (p.Asp178Asn, D178N) variant in
  cis with methionine at the codon-129 polymorphism. It is one of the three classic
  inherited prion phenotypes, alongside Gerstmann-Straussler-Scheinker syndrome and
  genetic Creutzfeldt-Jakob disease. The clinical signature is progressive,
  polysomnographically demonstrable disintegration of sleep - loss of spindles and
  K-complexes, then abolition of NREM sleep, with enacted dreams (oneiric stupor)
  intruding on wakefulness - together with sympathetic autonomic overactivity and
  motor signs (myoclonus, ataxia, dysarthria, dysphagia, pyramidal signs), advancing
  to an akinetic, mute, dysautonomic state and death typically within months to about
  three years. The neuropathological hallmark is severe, preferential degeneration of
  the anteroventral and mediodorsal thalamic nuclei with astrogliosis and inferior
  olivary involvement, and comparatively little spongiform change. FFI is notable for
  two things beyond its rarity: it is the disease that established that a single
  pathogenic PRNP mutation can specify two different diseases depending on a common
  polymorphism in cis (129M gives FFI, 129V gives familial CJD), and its molecular
  signature - a 19 kDa type-2 protease-resistant PrP fragment - behaves as a distinct
  transmissible prion strain.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    FFI is inherited in an autosomal dominant manner; each child of a heterozygous
    carrier has a 50% chance of inheriting the variant. Penetrance is high and
    age-dependent but not absolute - GeneReviews notes carriers who remain asymptomatic
    because of reduced penetrance. Age at onset is strikingly variable (reported onsets
    span roughly 19 to 68 years within the single D178N-129M molecular subtype), and
    disease duration is co-determined by the codon-129 genotype of the non-mutant
    allele.
  evidence:

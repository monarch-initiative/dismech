- name: Genetic counseling and predictive testing
  description: >-
    Autosomal dominant risk counseling with a 50% transmission risk, predictive-testing
    protocols for at-risk adults that respect the right not to know, and reproductive
    options including preimplantation genetic testing. GeneReviews considers predictive
    testing of asymptomatic minors inappropriate for this adult-onset condition. The
    ethical weight of the right not to know is unusually prominent in FFI: the
    preventive doxycycline study was designed around participants' refusal to learn
    their own genotype, enrolling carriers and non-carriers together under a
    genotype-concealing scheme.

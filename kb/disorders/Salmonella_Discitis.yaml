name: Salmonella Discitis
creation_date: "2026-11-26T02:05:31Z"
description: >-
  Salmonella discitis is a rare focal infection of the intervertebral disc and
  adjacent vertebral endplates (spondylodiscitis) caused by Salmonella enterica,
  either nontyphoidal serovars or the enteric-fever serovars Typhi and
  Paratyphi. The disc is usually seeded during Salmonella bacteremia, sometimes
  weeks after an enteric illness, or by contiguous spread from an infected
  aortic aneurysm. It presents as subacute back pain, often with fever and
  elevated C-reactive protein but usually without gastrointestinal symptoms,
  and its clinical and radiological picture closely resembles tuberculous
  spondylitis, so diagnosis depends on blood or tissue culture.
category: Infectious Disease
disease_term:
  preferred_term: salmonella discitis
  term:
    id: MONDO:8000004
    label: salmonella discitis
parents:
- Infectious discitis
- Salmonellosis
synonyms:
- salmonella discitis
- Salmonella spondylodiscitis
- Salmonella spondylodiskitis
infectious_agent:
- name: Salmonella enterica
  description: >-
    Salmonella enterica serovars cause the disease. Case series and reports
    include nontyphoidal serovars (Enteritidis, Typhimurium, group C
    serovars, Java, Montevideo and others) and the typhoidal serovars Typhi
    and Paratyphi.
  infectious_agent_term:
    preferred_term: Salmonella enterica
    term:
      id: NCBITaxon:28901
      label: Salmonella enterica
  evidence:
  - reference: PMID:20938384
    reference_title: "Salmonella spondylodiscitis in the immunocompetent: our experience with eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Salmonella typhi was cultured in 4 and S. Paratyphi in 5 patients.
    explanation: >-
      In an 11-patient spondylodiscitis series the typhoidal serovars Typhi
      and Paratyphi were the cultured organisms.
  - reference: PMID:36553297
    reference_title: A Systematic Review of the Diagnosis and Treatment of Non-Typhoid Salmonella Spondylodiscitis in Immunocompetent Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      All infections were monomicrobial, and 11 different serotypes of
      non-typhoid Salmonella were identified.
    explanation: >-
      A systematic review of pediatric cases identifies many nontyphoidal
      serovars as causes of the same disease.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Foodborne enteric acquisition with hematogenous spinal seeding
  description: >-
    Salmonella is acquired by ingestion, usually of contaminated food, and
    reaches the spine through the bloodstream; a minority of cases arise by
    contiguous spread from an infected aorta.
  evidence:
  - reference: PMID:37680214
    reference_title: Vertebral discitis caused by Salmonella enterica serovar Montevideo infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our case is of a 38-year-old immunocompetent male without significant
      risk factors presented with biopsy proven Salmonella vertebral discitis
      due to exposure to contaminated and undercooked poultry.
    explanation: >-
      Case report attributing biopsy-proven Salmonella discitis to foodborne
      exposure.
pathophysiology:
- name: Host Susceptibility to Invasive Salmonella
  role: predisposition
  biological_scale: ORGANISM
  description: >-
    Haemoglobinopathy (including sickle cell disease), diabetes and
    immunosuppression are the host states most often described in Salmonella
    discitis and osteomyelitis, although many reported patients are
    immunocompetent.
  downstream:
  - target: Invasive Salmonella Bacteremia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      These host states favour invasive, bloodstream Salmonella infection
      rather than self-limited gastroenteritis.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Vertebral discitis and osteomyelitis are rare complications, most often
      described in patients with diabetes, haemoglobinopathy, or
      immunosuppression.
    explanation: >-
      States the host risk groups in which Salmonella vertebral discitis is
      most often reported.
  - reference: PMID:42861322
    reference_title: "Invasive Non-typhoidal Salmonella Infections in Adults: Clinical Features, Focal Disease, and Antimicrobial Resistance in a Turkish Tertiary-Care Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Underlying comorbidities were present in 8 patients (88.9%), most
      commonly hypertension, diabetes mellitus, autoimmune diseases, and HIV
      infection.
    explanation: >-
      In an adult invasive nontyphoidal Salmonella series that included
      spondylodiscitis, nearly all patients had an underlying comorbidity.
- name: Enteric Salmonella Infection
  role: trigger
  biological_scale: TISSUE
  description: >-
    Ingested Salmonella enterica infects the intestine, producing
    gastroenteritis or enteric fever, from which a minority of infections
    become invasive.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  downstream:
  - target: Invasive Salmonella Bacteremia
    causal_link_type: DIRECT
    description: Intestinal infection is the portal of entry for bloodstream invasion.
  - target: Diarrhea
    causal_link_type: DIRECT
    description: >-
      Intestinal infection causes diarrhoea, which has often resolved or never
      been noticed by the time the spinal infection presents.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Non-typhoidal Salmonella infection usually causes self-limiting
      gastroenteritis, but a minority of cases are complicated by bacteraemia
      and extraintestinal focal infection.
    explanation: >-
      Places enteric infection upstream of bacteremia and focal
      extraintestinal disease.
- name: Invasive Salmonella Bacteremia
  biological_scale: ORGANISM
  description: >-
    Salmonella enterica enters the bloodstream after enteric infection; the
    bacteremia may be clinically quiet or follow travel-associated diarrhoea
    or enteric fever.
  downstream:
  - target: Hematogenous Discovertebral Seeding
    causal_link_type: DIRECT
    description: >-
      Circulating Salmonella seeds the disc-endplate complex.
  - target: Bacteremia
    causal_link_type: DIRECT
    description: Bloodstream infection is detected as positive blood cultures.
  - target: Infected Aortic Aneurysm Formation
    causal_link_type: DIRECT
    description: >-
      Salmonella bacteremia can also seed the aortic wall, producing an
      infected native aortic aneurysm.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Non-typhoidal Salmonella infection usually causes self-limiting
      gastroenteritis, but a minority of cases are complicated by bacteraemia
      and extraintestinal focal infection.
    explanation: >-
      Places bacteremia as the step between enteric infection and focal
      extraintestinal disease.
- name: Hematogenous Discovertebral Seeding
  biological_scale: TISSUE
  description: >-
    Bloodstream Salmonella lodges in the intervertebral disc and adjacent
    vertebral endplates, most often at lumbar levels.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  downstream:
  - target: Salmonella Disc-Endplate Infection
    causal_link_type: DIRECT
    description: Seeded organisms establish infection in the disc-endplate niche.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This case illustrates that Salmonella Java can seed the spine without
      classical immunocompromising risk factors and that the diagnosis is
      often delayed when persistent back pain is initially attributed to
      travel-associated gastroenteritis.
    explanation: >-
      Case of spinal seeding after documented Salmonella bacteraemia.
- name: Infected Aortic Aneurysm Formation
  biological_scale: TISSUE
  description: >-
    Salmonella infection of the aortic wall produces an infected (mycotic)
    native aortic aneurysm, which can coexist with spondylodiscitis of the
    adjacent vertebrae.
  locations:
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  downstream:
  - target: Contiguous Aorto-Vertebral Spread
    causal_link_type: DIRECT
    description: >-
      Infection spreads from the aortic wall to the adjacent vertebral bodies
      and disc.
  - target: Infected Aortic Aneurysm
    causal_link_type: DIRECT
    description: The aortic lesion is the clinical aneurysm.
  evidence:
  - reference: PMID:15662331
    reference_title: Salmonella spondylodiscitis in patients without sickle cell disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two patients with coexisting aortic mycotic aneurysms had immediate
      aneurysm resection.
    explanation: >-
      Two of eight patients in a Salmonella spondylodiscitis series had a
      coexisting mycotic aortic aneurysm.
- name: Contiguous Aorto-Vertebral Spread
  biological_scale: TISSUE
  description: >-
    An infected aorta can spread infection directly into the adjacent lumbar
    vertebrae and psoas muscle.
  downstream:
  - target: Salmonella Disc-Endplate Infection
    causal_link_type: DIRECT
    description: >-
      Direct extension from the aortic wall infects the neighbouring
      discovertebral unit.
  evidence:
  - reference: PMID:18463907
    reference_title: Salmonella spondylodiscitis associated with a mycotic abdominal aortic aneurysm and paravertebral abscess.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A rare but increasing number of patients present with Salmonellosis
      spondylodiscitis resulting from contiguous spread of infection from the
      adjacent abdominal aorta.
    explanation: >-
      States contiguous spread from the aorta as a route to Salmonella
      spondylodiscitis.
- name: Salmonella Disc-Endplate Infection
  biological_scale: TISSUE
  description: >-
    Salmonella proliferates in the disc and adjacent vertebral endplates,
    producing local inflammation, disc-space change and vertebral bone
    destruction. The tempo is often subacute, and the imaging appearance
    overlaps with tuberculous spondylitis.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: bony vertebral centrum
    term:
      id: UBERON:0001075
      label: bony vertebral centrum
  downstream:
  - target: Vertebral Body Destruction
    causal_link_type: DIRECT
    description: Local infection erodes the vertebral bodies on either side of the disc.
  - target: Back Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Discovertebral infection causes focal spinal pain.
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Focal infection produces a systemic febrile response.
  - target: Elevated C-reactive protein
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Focal infection drives a systemic acute-phase response.
  evidence:
  - reference: PMID:15662331
    reference_title: Salmonella spondylodiscitis in patients without sickle cell disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Back pain (100%), fever (75%), and elevated C-reactive protein levels
      (100%) were common, but gastrointestinal symptoms were not (0%).
    explanation: >-
      The clinical features of the established spinal infection in an
      eight-patient series.
  - reference: PMID:20938384
    reference_title: "Salmonella spondylodiscitis in the immunocompetent: our experience with eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Salmonella and tuberculous spondylitis must be differentiated as they
      both have similar epidemiological and clinicoradiologic presentations.
    explanation: >-
      Records the clinicoradiological overlap with tuberculous spondylitis.
- name: Vertebral Body Destruction
  biological_scale: TISSUE
  description: >-
    Destruction of the vertebral bodies can progress to collapse and spinal
    instability and allows infection to extend into adjacent soft tissue.
  locations:
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  downstream:
  - target: Epidural and Paravertebral Extension
    causal_link_type: DIRECT
    description: >-
      Infection extends from the destroyed vertebrae into the epidural space,
      prevertebral tissue and psoas muscle.
  - target: Vertebral Collapse
    causal_link_type: DIRECT
    description: Bone loss leads to vertebral collapse.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CT angiography performed several weeks later showed mid-thoracic
      vertebral destruction and disc space change.
    explanation: >-
      Imaging of a Salmonella discitis case showing vertebral destruction and
      disc-space change.
  - reference: PMID:43013364
    reference_title: "Multidrug-resistant (MDR) Salmonella Typhi spondylodiscitis with vertebral collapse: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Imaging showed spondylodiscitis with vertebral collapse, initially
      suspected as tuberculosis or metastasis.
    explanation: >-
      A Salmonella Typhi spondylodiscitis case that progressed to vertebral
      collapse.
- name: Epidural and Paravertebral Extension
  biological_scale: TISSUE
  description: >-
    Infection spreads contiguously into the epidural space and paraspinal
    muscles, forming epidural and psoas abscesses that can compress the
    spinal cord.
  locations:
  - preferred_term: vertebral canal
    term:
      id: UBERON:0006692
      label: vertebral canal
  downstream:
  - target: Spinal Epidural Abscess
    causal_link_type: DIRECT
    description: Epidural extension forms an abscess.
  - target: Psoas Abscess
    causal_link_type: DIRECT
    description: Paravertebral extension forms a psoas abscess.
  - target: Paraplegia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Epidural abscess compressing the spinal cord can produce progressive
      paraplegia.
  evidence:
  - reference: PMID:25608980
    reference_title: "Osteomyelitis, discitis, epidural and psoas abscess secondary to Salmonella enterica in a man with diabetes mellitus and newly diagnosed α-thalassaemia trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Investigations for relapsing and remitting fever found vertebral
      osteomyelitis, discitis and epidural and psoas abscess secondary to
      Salmonella enterica.
    explanation: >-
      A case in which Salmonella discitis was accompanied by epidural and
      psoas abscesses.
- name: Salmonella Peptidoglycan Cross-Linking (Beta-Lactam Target)
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  description: >-
    Salmonella enterica cross-links its peptidoglycan cell wall with
    penicillin-binding protein transpeptidases, the target of the
    third-generation cephalosporins used first-line for Salmonella
    spondylodiscitis.
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  downstream:
  - target: Salmonella Disc-Endplate Infection
    causal_link_type: DIRECT
    description: >-
      Intact cell-wall synthesis is needed for the bacterial growth that
      sustains the focal infection.
  evidence:
  - reference: PMID:22203377
    reference_title: "From the regulation of peptidoglycan synthesis to bacterial growth and morphology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Peptidoglycan synthesis requires glycosyltransferases (GTases) to
      polymerize the glycan chains and DD-transpeptidases (DD-TPases) to
      crosslink the peptides
    explanation: >-
      Establishes DD-transpeptidase (penicillin-binding protein) cross-linking
      as an essential step in bacterial peptidoglycan synthesis.

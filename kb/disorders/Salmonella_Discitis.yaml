- name: Paraplegia
  phenotype_term:
    preferred_term: Paraplegia
    term:
      id: HP:0010550
      label: Paraplegia
  description: >-
    Progressive paraplegia is a rare neurological complication when an
    epidural abscess compresses the thoracic cord.
  evidence:
  - reference: PMID:16859227
    reference_title: "An uncommon cause of paraplegia: Salmonella spondylodiskitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The aim of this study was to present a case of progressive paraplegia
      caused by Salmonella spondylodiskitis and epidural abscess after
      endoscopic cholecystectomy.
    explanation: Case of progressive paraplegia from Salmonella spondylodiskitis with epidural abscess.
- name: Infected Aortic Aneurysm
  phenotype_term:
    preferred_term: Infected (mycotic) aortic aneurysm
    term:
      id: HP:0004942
      label: Aortic aneurysm
  description: >-
    An infected native aortic aneurysm coexists with some cases and carries
    a risk of rupture.
  evidence:
  - reference: PMID:22759472
    reference_title: Emergency treatment of a salmonella-infected abdominal aortic aneurysm associated with spondylodiscitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A 69-year-old male with an history of hypertension, presented with a
      ruptured AAA infected by nontyphoidal Salmonella (type H), associated
      with spondylodiscitis.
    explanation: Ruptured Salmonella-infected aortic aneurysm with spondylodiscitis.
  - reference: PMID:9709878
    reference_title: "Vertebral osteomyelitis due to salmonellae: report of two cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infected abdominal aortic aneurysms (IAAAs) were seen exclusively in
      the older age group (50 years of age or older), and all deaths occurred
      in these patients.
    explanation: Concomitant infected aortic aneurysm is confined to older patients and drives mortality.
  - reference: PMID:42562227
    reference_title: "Global Bacterial Spectrum, Diagnostic Culture Yield, and Microbiology-Related Mortality Risk in Infective Native Aortic Aneurysm: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most frequent concurrent foci were gastroenteritis (12.0%),
      spondylodiscitis (11.7%), urinary tract infection (8.6%), endocarditis
      (7.0%), and pneumonia (6.8%).
    explanation: >-
      In infective native aortic aneurysm, whose leading pathogen is
      Salmonella, spondylodiscitis is one of the most frequent concurrent foci.
progression:
- phase: Enteric or bacteremic phase
  notes: >-
    Enteric fever, travel-associated diarrhoea or clinically silent
    Salmonella bacteremia precedes spinal infection; prodromal
    gastrointestinal symptoms are usually absent by the time back pain is
    investigated.
  evidence:
  - reference: PMID:20938384
    reference_title: "Salmonella spondylodiscitis in the immunocompetent: our experience with eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Five (50%) patients had a documented history of typhoid fever.
    explanation: Half the patients had a prior typhoid fever episode.
- phase: Established spondylodiscitis
  notes: >-
    Subacute back pain with or without fever; the diagnosis is often delayed
    and the infection initially mistaken for tuberculosis.
  evidence:
  - reference: PMID:27381996
    reference_title: Salmonella spondylodiscitis of the thoracic vertebrae mimicking spine tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It commonly presents with non-specific chronic back pain and can occur
      with no gastrointestinal manifestation.
    explanation: Describes the subacute presentation of the established spinal infection.
- phase: Complicated spondylodiscitis
  notes: >-
    Epidural or psoas abscess, vertebral collapse or instability,
    neurological deficit, or a coexisting infected aortic aneurysm may
    require surgery.
  evidence:
  - reference: PMID:15662331
    reference_title: Salmonella spondylodiscitis in patients without sickle cell disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three others responded favorably to appropriate antibiotics, and three
      required subsequent surgical reconstruction because of neurologic
      impairment or osseous instability.
    explanation: Neurologic impairment and instability required surgery in three of eight patients.
  - reference: PMID:9709878
    reference_title: "Vertebral osteomyelitis due to salmonellae: report of two cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The overall cure rate was 61%, and the relapse rate was 9%.
    explanation: Cure and relapse rates across 44 reviewed cases.
diagnosis:
- name: Blood or spinal tissue culture
  description: >-
    Isolation of Salmonella from blood or from CT-guided or open spinal
    biopsy establishes the diagnosis and separates it from tuberculous
    spondylitis, which it closely mimics.
  evidence:
  - reference: PMID:27381996
    reference_title: Salmonella spondylodiscitis of the thoracic vertebrae mimicking spine tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Culture studies remain the key to establishing a definitive diagnosis
      and subsequently successful treatment.
    explanation: Culture is the definitive diagnostic test.
- name: Widal serology
  description: >-
    In typhoidal disease without a culture isolate, high Widal titres with a
    suggestive history and imaging have been used as supporting evidence.
  evidence:
  - reference: PMID:20938384
    reference_title: "Salmonella spondylodiscitis in the immunocompetent: our experience with eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, when this is not apparent the Widal test, in the setting of a
      suggestive history and radiograph, may be used as a diagnosis tool.
    explanation: Supports Widal serology as an adjunct when culture is negative.
- name: Spinal MRI and FDG-PET/CT
  description: >-
    MRI shows discitis, vertebral osteomyelitis and soft-tissue extension;
    FDG-PET/CT can show synchronous spinal and aortic infection.
  evidence:
  - reference: PMID:42291979
    reference_title: "Seeding the Spine: Salmonella Java Discitis and Osteomyelitis After Traveller's Bacteraemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Recurrent or unresolved symptoms after a confirmed Salmonella
      bacteraemia warrant early spinal MRI.
    explanation: Recommends spinal MRI after Salmonella bacteraemia with persistent symptoms.
  - reference: PMID:41530883
    reference_title: "Thoracic infective native aortic aneurysm and T9-T10 spondylodiscitis complicating recurrent Salmonella enterica bacteremia in a 95-year-old: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fludeoxyglucose F18 positron-emission tomography/computed tomography
      confirmed intense focal uptake of the distal thoracic aortic wall and
      synchronous uptake at T9-T10 consistent with an infected aortic
      aneurysm and spondylodiscitis.
    explanation: FDG-PET/CT identified concurrent aortic and spinal infection.
treatments:
- name: Third-Generation Cephalosporin Therapy
  description: >-
    Prolonged antibiotic therapy, usually starting with intravenous
    ceftriaxone or another third-generation cephalosporin and stepping down
    to an oral agent such as cotrimoxazole, amoxicillin or a fluoroquinolone
    according to susceptibility, is the mainstay of treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Salmonella Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: Ceftriaxone inhibits penicillin-binding protein cross-linking.
  - target: Salmonella Disc-Endplate Infection
    treatment_effect: INHIBITS
    description: Active antibiotics clear the discovertebral infection.
  evidence:
  - reference: PMID:34987856
    reference_title: "Spondylodiscitis due to Salmonella Typhi: a series of four cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All four cases were treated successfully with variable duration of
      ceftriaxone followed by cotrimoxazole.
    explanation: Ceftriaxone with oral step-down cured four Salmonella Typhi cases.
  - reference: PMID:36553297
    reference_title: A Systematic Review of the Diagnosis and Treatment of Non-Typhoid Salmonella Spondylodiscitis in Immunocompetent Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primarily, third-generation cephalosporin was administered, and
      antibiotic treatment was given for an average of 9.6 weeks.
    explanation: Third-generation cephalosporins for about ten weeks were the usual pediatric regimen.
  - reference: PMID:33942967
    reference_title: "Salmonella Osteomyelitis in Adults: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Third-generation cephalosporins were most commonly utilized, and
      antibiotic treatment was administered for an average of 11.3 weeks
    explanation: >-
      In adult Salmonella osteomyelitis, in which the vertebrae were among
      the commonest sites, third-generation cephalosporins were the usual
      agents.
- name: Spinal Surgical Debridement and Stabilization
  description: >-
    Debridement, abscess drainage, decompression and instrumented fusion are
    used for unrelenting pain, osseous instability, neurological deficit or
    large abscesses.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Epidural and Paravertebral Extension
    treatment_effect: INHIBITS
    description: Drainage and debridement remove abscess and infected tissue.
  - target: Vertebral Body Destruction
    treatment_effect: INHIBITS
    description: Instrumented fusion stabilizes the destroyed segment.
  evidence:
  - reference: PMID:20938384
    reference_title: "Salmonella spondylodiscitis in the immunocompetent: our experience with eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Five patients were managed with antibiotics only, 1 with surgical
      debridement and uninstrumented fusion and 4 with single-stage
      debridement, anterior fusion, and posterior instrumentation.
    explanation: Surgical debridement and fusion were used in half the patients.
- name: Infected Aortic Aneurysm Repair
  description: >-
    When an infected aortic aneurysm coexists, aneurysm resection with graft
    replacement, or endovascular repair in patients unfit for open surgery,
    is combined with prolonged antibiotics.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Infected Aortic Aneurysm Formation
    treatment_effect: INHIBITS
    description: Resection removes the infected aortic source.
  evidence:
  - reference: PMID:15662331
    reference_title: Salmonella spondylodiscitis in patients without sickle cell disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Operative interventions are necessary only for patients with coexisting
      aneurysms or ongoing osseous instability.
    explanation: Coexisting aneurysm is an indication for surgery.
  - reference: PMID:22759472
    reference_title: Emergency treatment of a salmonella-infected abdominal aortic aneurysm associated with spondylodiscitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combined antimicrobial therapy and one-stage surgical treatment can be
      associated with good outcome.
    explanation: Combined antibiotics and aortic surgery gave a good outcome.
notes: >-
  The literature consists of case reports, small case series and one
  systematic review of pediatric nontyphoidal cases; there is no cohort
  large enough to give incidence or reliable frequencies, so phenotype
  frequencies come from series of eight to twenty-one patients. Sickle cell
  disease is the classic predisposition for Salmonella osteomyelitis in
  general, but the spondylodiscitis series retrieved here are mostly in
  patients without it, so it is recorded as one of several host risk
  states rather than as a defining feature.
review_notes: >-
  Deliberately lumped. Nontyphoidal Salmonella serovars and the typhoidal
  serovars Typhi and Paratyphi are kept in one entry because the retrieved
  case series describe the same spinal syndrome, diagnostic workup and
  cephalosporin-based treatment for both; PubMed searches for Salmonella
  spondylodiscitis, discitis and vertebral osteomyelitis found no source
  documenting a serovar-specific difference in presentation or therapy for
  the spinal infection itself.

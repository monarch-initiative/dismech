name: RAD51C-Related Cancer Predisposition
category: Mendelian
creation_date: "2026-11-12T23:20:00Z"
synonyms:
- RAD51C-related cancer predisposition
description: >-
  An autosomal dominant hereditary cancer predisposition caused by heterozygous germline
  loss-of-function variants in RAD51C, a RAD51 paralog that acts in the BCDX2 and CX3 subcomplexes
  to load RAD51 onto single-stranded DNA and to protect stalled replication forks. The risk
  profile is markedly asymmetric and that asymmetry is the clinically important fact: tubo-ovarian
  carcinoma carries a relative risk of 7.55 and a cumulative risk to age 80 of 11%, while breast
  cancer carries a relative risk of about 2 and is weighted toward oestrogen-receptor-negative and
  triple-negative disease. ClinGen re-curated the pair as Definitive for this combined entity in
  2024, having previously classified it Definitive for familial ovarian cancer and Disputed for
  hereditary breast carcinoma. Tumours arise by a somatic second hit on the wild-type allele,
  which can be a mutation, a deletion, or promoter hypermethylation; the resulting
  homologous-recombination deficiency is the therapeutic target of PARP inhibitors. This entry covers the monoallelic predisposition only; biallelic RAD51C causes
  Fanconi anemia complementation group O, which ClinGen curates separately and rates only Limited.
disease_term:
  preferred_term: RAD51C-related cancer predisposition
  term:
    id: MONDO:0700273
    label: RAD51C-related cancer predisposition
parents:
- Hereditary neoplastic syndrome
notes: >-
  Entry scope. ClinGen's Hereditary Cancer GCEP split autosomal recessive Fanconi anemia
  complementation group O (MONDO:0013248) into its own curation on the grounds of phenotypic
  variability and a different inheritance pattern, and this curation covers autosomal dominant
  RAD51C-related cancer predisposition including familial ovarian cancer, triple-negative breast
  cancer and oestrogen-receptor-negative breast cancer. This entry follows that split. The
  biallelic Fanconi phenotype is recorded only as a differential diagnosis, and note that ClinGen
  rates RAD51C for FANCO as Limited rather than Definitive, on three variants in two families -
  so the recessive arm is a weaker gene-disease claim than the dominant one, not merely a
  different one. Fanconi anemia is curated in dismech as Fanconi_Anemia.
  Two things this entry deliberately does not assert. First, a cell of origin for the breast
  tumours: the fallopian-tube fimbrial secretory cell is well established for the tubo-ovarian
  tumours and is bound on the second-hit node, but no breast cell of origin is established in the
  sources used here, so none is bound and the second-hit node carries one cell type rather than a
  guessed pair. Second, a TP53 requirement in humans: the mouse data show Trp53 co-loss is
  effectively required for mammary tumours, and the human STIC precursor carries a TP53 mutation,
  but whether TP53 loss is necessary in human RAD51C carriers is not settled by either, so it is
  curated as a contributing node rather than an obligate step.
  No GeneReviews chapter exists for RAD51C. Searched cache/bookshelf/genereviews.csv (index
  snapshot 2026-09-10, 958 chapters) for RAD51C and for "cancer predisposition"; the index carries
  CHEK2-Related Cancer Predisposition, ATM-Related Cancer Predisposition and CDKN2A Cancer
  Predisposition but no RAD51C chapter, and `just check-genereviews` reports NO_CHAPTER.
  No ontology identifier in this entry was taken from the deep-research report. That report's own
  term validation reported 14 of 30 checked labels mismatched, several of them naming unrelated
  concepts - it offered CHEBI:63631 for olaparib (that term is topiramate), NCIT:C51686 for
  salpingo-oophorectomy (Esophageal Biopsy), NCIT:C78844 for rucaparib (Ficlatuzumab),
  NCIT:C97660 for niraparib (Abemaciclib), MONDO:0011705 for Fanconi anemia complementation group
  O (lymphangioleiomyomatosis), UBERON:0000996 for the oviduct infundibulum (vagina) and
  UBERON:0002367 for peritoneum (prostate gland) - and `just preflight-dr` separately found it
  writing HGNC:9820 beside the symbol RAD51, which is RAD51C's identifier and not RAD51's. Every
  term here was resolved against the committed term caches instead.
  The ClinGen cache files committed here are stamped from a current ClinGen export (2026-11-12)
  rather than the release pinned in data/clingen/MANIFEST.yaml (2026-10-04), because
  `just fetch-reference` downloads and parses the current export; the pin had already drifted
  before this branch.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous germline loss-of-function allele confers the predisposition, with
    incomplete penetrance. One functional allele maintains homologous recombination, so
    tumorigenesis requires a somatic second hit. Biallelic RAD51C is a different disease with
    recessive inheritance.
  evidence:
  - reference: CGGV:assertion_31cb27be-dd32-4bb7-86bd-43c4b1eabaf5-2024-08-29T170000.000Z
    reference_title: RAD51C / RAD51C-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, RAD51C is definitively associated with autosomal dominant RAD51C-related cancer predisposition."
    explanation: ClinGen states the mode of inheritance for this MONDO entity.
prevalence:
- population: Population controls in a pooled ovarian cancer case-control analysis
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 110.0
  rate_denominator: POPULATION
  notes: >-
    Carrier frequency, not disease prevalence: 0.11% of population controls carry a RAD51C
    mutation, against 0.63% of ovarian cancer patients in the same analysis. The band reports the
    magnitude of the carrier frequency the measure_type names, which at roughly 1 in 900 is above
    1 in 1,000. The disease is far rarer than the carrier frequency because penetrance is
    incomplete, and no population estimate of disease occurrence is recorded because none of the
    sources cached for this entry reports one. The 1-in-913 figure in PMID:38986768 is a carrier
    frequency among breast cancer cases rather than in the population, and so is not the basis of
    this record.
  evidence:
  - reference: PMID:32359370
    reference_title: "BRIP1, RAD51C, and RAD51D mutations are associated with high susceptibility to ovarian cancer: mutation prevalence and precise risk estimates based on a pooled analysis of ~30,000 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The prevalence of RAD51C mutations was significantly higher in OC patients (0.63%) than in population controls (0.11%)"
    explanation: Gives the population-control carrier frequency this record reports, together with the case frequency it is contrasted against.

genetic:
- name: RAD51C
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RAD51C
    term:
      id: hgnc:9820
      label: RAD51C
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic alleles are nonsense, frameshift, splice-site and disruptive missense variants.
    Saturation genome editing has produced a functional map covering more than 99.5% of possible
    coding single-nucleotide alterations, classifying 3,094 variants as disruptive, which
    addresses the variant-of-uncertain-significance problem that otherwise dominates a
    moderate-penetrance gene. ClinGen separately classifies RAD51C for Fanconi anemia
    complementation group O (MONDO:0013248) as Limited; that tier is not recorded here because it
    concerns a different disease.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_31cb27be-dd32-4bb7-86bd-43c4b1eabaf5-2024-08-29T170000.000Z
    evidence:
    - reference: CGGV:assertion_31cb27be-dd32-4bb7-86bd-43c4b1eabaf5-2024-08-29T170000.000Z
      reference_title: RAD51C / RAD51C-related cancer predisposition (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RAD51C | HGNC:9820 | RAD51C-related cancer predisposition | MONDO:0700273 | AD | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classification for this MONDO entity.
  evidence:
  - reference: CGGV:assertion_31cb27be-dd32-4bb7-86bd-43c4b1eabaf5-2024-08-29T170000.000Z
    reference_title: RAD51C / RAD51C-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This gene-disease pair was originally evaluated as definitive for familial ovarian cancer on 04/12/2017 and as disputed for hereditary breast carcinoma on 05/10/2017 by the Breast/Ovarian Cancer GCEP."
    explanation: The curation history that explains why the breast association is the weaker half of this entity and was once Disputed.
  - reference: PMID:20400964

    explanation: The functional map that makes variant interpretation tractable for this gene, with its own concordance claim.
pathophysiology:
- name: Germline RAD51C Loss of Function
  description: >-
    A heterozygous germline loss-of-function variant halves functional RAD51C in every cell. One
    functional allele maintains homologous recombination, so this state is not itself oncogenic;
    it is the constitutional first hit.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  evidence:
  - reference: PMID:20400964
    reference_title: Germline mutations in breast and ovarian cancer pedigrees establish RAD51C as a human cancer susceptibility gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "six monoallelic pathogenic mutations in RAD51C that confer an increased risk for breast and ovarian cancer"
    explanation: Establishes the monoallelic germline state as the predisposing lesion.
  gene:
    preferred_term: RAD51C
    term:
      id: hgnc:9820
      label: RAD51C
  molecular_functions:
  - preferred_term: RAD51C assembly into the BCDX2 and CX3 RAD51-paralog subcomplexes
    term:
      id: GO:0046982
      label: protein heterodimerization activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: RAD51C
      term:
        id: hgnc:9820
        label: RAD51C
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    description: Heterozygous loss-of-function allele carried constitutionally; the first hit.
  downstream:
  - target: Somatic Second-Hit Inactivation Including Promoter Hypermethylation
    description: >-
      The wild-type allele is lost somatically in the cell that transforms, by mutation, deletion
      or epigenetic silencing.
    causal_link_type: DIRECT
- name: Somatic Second-Hit Inactivation Including Promoter Hypermethylation
  description: >-
    Loss of the remaining wild-type RAD51C allele in a susceptible cell. The route that makes this
    gene distinctive is epigenetic: somatic promoter hypermethylation silences RAD51C and
    phenocopies germline loss, is strongly associated with mutational signature 3, and in a
    phase-3 ovarian-cancer trial identified 25 of 519 high-grade serous tumours that were
    homologous-recombination deficient and derived progression-free survival benefit from
    olaparib. The cell of origin for the tubo-ovarian tumours is the fallopian-tube fimbrial
    secretory epithelial cell, which acquires a TP53 mutation and forms a serous tubal
    intraepithelial carcinoma before seeding the ovary and peritoneum.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  evidence:
  - reference: PMID:28825726
    reference_title: A mutational signature reveals alterations underlying deficient homologous recombination repair in breast cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "epigenetic silencing of RAD51C and BRCA1 by promoter methylation is strongly associated with signature 3"
    explanation: Links RAD51C promoter methylation to the signature-3 mutational pattern, which is what makes the epigenetic route a phenocopy of germline loss.
  - reference: PMID:38956560
    reference_title: Human peritoneal fluid exerts ovulation- and nonovulation-sourced oncogenic activities on transforming fallopian tube epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Secretory cells in the fallopian tube fimbria epithelium (FTE) are regarded as the main cells of origin of ovarian high-grade serous carcinoma (HGSC)"
    explanation: States the cell of origin bound on this node; the sentence is this paper's framing of established tubal-origin work rather than its own result.
  genetic_context:
    gene:
      preferred_term: RAD51C
      term:
        id: hgnc:9820
        label: RAD51C
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic loss of the wild-type allele by mutation, deletion or promoter hypermethylation in
      the transforming clone.
  cell_types:
  - preferred_term: fallopian tube secretory epithelial cell
    term:
      id: CL:4030006
      label: fallopian tube secretory epithelial cell
  locations:
  - preferred_term: fimbria of fallopian tube
    term:
      id: UBERON:8410010
      label: fimbria of fallopian tube
  downstream:
  - target: Failure of BCDX2-Mediated RAD51 Loading and Fork Protection
    description: >-
      Complete loss of RAD51C in the clone removes its function in the RAD51-paralog subcomplexes.
    causal_link_type: DIRECT
- name: Failure of BCDX2-Mediated RAD51 Loading and Fork Protection
  description: >-
    RAD51C acts in two RAD51-paralog subcomplexes, BCDX2 with RAD51B, RAD51D and XRCC2, and CX3
    with XRCC3. BCDX2 loads RAD51 onto single-stranded DNA and stabilizes the nucleoprotein
    filament, including on short single-stranded stretches and reversed replication forks, so
    RAD51C loss abolishes both homologous-recombination repair and the protection of stalled
    forks. Cancer-associated missense variants reduce RAD51 foci and leave forks unprotected,
    which is why fork protection is a second, separable consequence rather than a restatement of
    the repair defect.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: MOLECULAR_ACTIVITY_EFFECT
  conforms_to: "dna_repair_synthetic_lethality#HRR or FA/BRCA Repair Deficiency"
  evidence:
  - reference: PMID:39268578
    reference_title: Mechanism of BCDX2-mediated RAD51 nucleation on short ssDNA stretches and fork DNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "have emerged as essential tumour suppressors, forming two subcomplexes, BCDX2 and CX3"
    explanation: Establishes the two subcomplexes RAD51C acts in; quoted from the paper's framing of the paralog field.
  - reference: PMID:36562461
    reference_title: Functional analysis of germline RAD51C missense variants highlight the role of RAD51C in replication fork protection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "the role of RAD51C in DNA replication is emerging when replication forks are transiently or irreversibly stalled"
    explanation: Supports fork protection as a consequence separable from double-strand-break repair, which is why this node names both.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  protein_complexes:
  - preferred_term: BCDX2 RAD51 paralog complex
  downstream:
  - target: Homologous Recombination Deficiency and Signature 3 Genomic Instability
    description: >-
      Error-prone repair substitutes for homologous recombination and the tumour acquires the
      signature-3 mutational pattern.
    causal_link_type: DIRECT
- name: Homologous Recombination Deficiency and Signature 3 Genomic Instability
  description: >-
    Compensatory error-prone repair produces genomic instability with mutational signature 3, the
    so-called BRCAness phenotype. This is simultaneously the oncogenic driver and the therapeutic
    vulnerability.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  node_class: GENOME_INSTABILITY
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  downstream:
  - target: TP53 Loss and Checkpoint Escape
    description: >-
      Genomically unstable cells survive and proliferate only once the p53 damage checkpoint is
      removed. In mouse mammary tissue Trp53 co-loss is effectively required for tumours, and the
      human tubal precursor lesion carries a TP53 mutation.
    causal_link_type: DIRECT
  - target: PARP-Inhibitor Sensitivity
    description: >-
      The repair deficiency leaves the tumour dependent on routes that PARP inhibition blocks.
    causal_link_type: DIRECT
- name: TP53 Loss and Checkpoint Escape
  description: >-
    Removal of the p53 damage checkpoint permits survival of the genomically unstable clone.
    Epidermal and mammary Rad51c deletion produces mammary carcinoma in 63% of female mice only
    when combined with Trp53 inactivation, and shortens latency from 11 to 6 months; Rad51c loss
    alone is insufficient. Whether TP53 loss is strictly necessary in human RAD51C carriers is not
    settled by the mouse data or by the TP53-mutant status of the tubal precursor, so this is
    curated as a contributing node and not an obligate step.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:26820992
    reference_title: Rad51c- and Trp53-double-mutant mouse model reveals common features of homologous recombination-deficient breast cancers.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "deletion of Rad51c invariably requires inactivation of the Trp53 tumor suppressor (TP53 in humans) to produce mammary carcinomas in 63% of female mice"
    explanation: The mouse result behind this node; it is a statement about the mouse, which is why the node is provisional for humans.
  downstream:
  - target: Clonal Expansion and Tumor Initiation
    description: Checkpoint escape permits outgrowth of the repair-deficient clone.
    causal_link_type: DIRECT
- name: Clonal Expansion and Tumor Initiation
  description: >-
    Outgrowth as high-grade serous tubo-ovarian carcinoma from the fimbrial precursor, or as
    oestrogen-receptor-negative or triple-negative breast carcinoma. The asymmetry between these
    two is large: tubo-ovarian relative risk is 7.55 and breast relative risk about 2.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  downstream:
  - target: Ovarian carcinoma
    description: High-grade serous tubo-ovarian carcinoma, the dominant manifestation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32107557
      reference_title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Pathogenic variants in both RAD51C and RAD51D were associated with TOC (RAD51C: relative risk [RR] = 7.55, 95% confidence interval [CI] = 5.60 to 10.19"
      explanation: The segregation-analysis relative risk for tubo-ovarian cancer across 6,178 families.
  - target: Breast carcinoma
    description: >-
      Breast carcinoma at roughly twofold relative risk, weighted toward
      oestrogen-receptor-negative and triple-negative disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32107557
      reference_title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The estimated BC relative risk was 1.99 (95% CI = 1.39 to 2.85"
      explanation: The breast relative risk behind this edge, which previously carried no evidence at all.
- name: PARP-Inhibitor Sensitivity
  description: >-
    Homologous-recombination deficiency makes the tumour synthetically lethal to PARP inhibition.
    Platinum sensitivity is deliberately not claimed here: it is mechanistically expected and
    platinum is standard care in the associated cancers, but no source cached for this entry
    reports a platinum result in RAD51C-deficient disease specifically, and the node is named for
    what the evidence covers. The strongest RAD51C-specific clinical evidence is
    from promoter-methylated high-grade serous ovarian cancer in the phase-3 PAOLA-1 trial rather
    than from germline carriers, which matters when the result is read as support for treating a
    germline carrier.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "dna_repair_synthetic_lethality#PARP and Platinum Synthetic Lethality"
  evidence:
  - reference: PMID:40513287
    reference_title: Predictive value of BRCA1/RAD51C methylation in HGSOC - An ancillary study of the PAOLA-1/ENGOT-ov25 phase 3 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A significant PFS1 benefit independently of methylation ratios was observed in patients with methylated tumors with bev-ola maintenance compared to bev alone"
    explanation: The phase-3 ancillary result behind this node; it concerns promoter-methylated tumours rather than germline carriers, which the node description says explicitly.
phenotypes:
- name: Ovarian carcinoma
  category: Neoplastic
  description: >-
    High-grade serous tubo-ovarian carcinoma is the dominant manifestation, at a relative risk of
    7.55 and a cumulative risk to age 80 of 11%. A separate meta-analysis of about 29,400 ovarian
    cancer cases against gnomAD controls gives an odds ratio of 5.59, so the two independent
    estimates agree on a high-risk gene. The tubo-ovarian relative risk rises with age to about 60
    and then declines.
  phenotype_term:
    preferred_term: high-grade serous tubo-ovarian carcinoma
    term:
      id: HP:0025318
      label: Ovarian carcinoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:32107557
    reference_title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The estimated cumulative risks of developing TOC to age 80 years were 11% (95% CI = 6% to 21%) for RAD51C"
    explanation: The absolute cumulative tubo-ovarian risk, which is what drives the prevention recommendation.
  - reference: PMID:32359370
    reference_title: "BRIP1, RAD51C, and RAD51D mutations are associated with high susceptibility to ovarian cancer: mutation prevalence and precise risk estimates based on a pooled analysis of ~30,000 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The prevalence of RAD51C mutations was significantly higher in OC patients (0.63%) than in population controls (0.11%)"
    explanation: An independent pooled analysis showing RAD51C enrichment in ovarian cancer cases over population controls.
- name: Breast carcinoma
  category: Neoplastic
  description: >-
    Breast cancer risk is moderate: a relative risk of 1.99 and a cumulative risk to age 80 of
    21% in the segregation analysis, with the association stronger for
    oestrogen-receptor-negative and triple-negative disease than for breast cancer overall. ClinGen once classified the RAD51C
    breast association as Disputed, before the 2024 re-curation lumped it into this entity, so the
    difference in strength between this and the ovarian association is a historical fact about the
    evidence and not only a difference in effect size.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:32107557
    reference_title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The estimated BC relative risk was 1.99 (95% CI = 1.39 to 2.85"
    explanation: The segregation-analysis breast relative risk, which the description previously stated without evidence.
  - reference: PMID:32107557
    reference_title: Ovarian and Breast Cancer Risks Associated With Pathogenic Variants in RAD51C and RAD51D.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The estimated cumulative risks of developing BC to 80 years were 21% (95% CI = 15% to 29%) for RAD51C"
    explanation: The absolute breast risk to age 80, which the description also stated without evidence, and the basis for the OCCASIONAL band.
  - reference: PMID:33471991
    reference_title: "Breast Cancer Risk Genes - Association Analysis in More than 113,000 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "for protein-truncating variants in BARD1, BRCA1, BRCA2, PALB2, RAD51C, and RAD51D, odds ratios were higher for ER-negative disease than for ER-positive disease"
    explanation: Source of the oestrogen-receptor-negative weighting, measured against ER-positive disease in the same study.
  - reference: PMID:38986768
    reference_title: Population-based germline breast cancer gene association studies and meta-analysis to inform wider mainstream testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "frequency of PVs were low for RAD51C (OR 1.53, 95% CI 1.29-2.04; 1 in 913)"
    explanation: A population-based estimate of the breast association, lower than the segregation-analysis estimate, which is why the entry describes it as moderate rather than giving one figure.
diagnosis:
- name: Germline molecular diagnosis
  description: >-
    Identification of a heterozygous pathogenic or likely pathogenic germline RAD51C variant on a
    hereditary breast and ovarian cancer panel. Variant interpretation is better supported for this
    gene than for most moderate-penetrance genes because saturation genome editing has produced a
    functional map covering more than 99.5% of possible coding single-nucleotide alterations.
  evidence:
  - reference: PMID:39299233
    reference_title: High-resolution functional mapping of RAD51C by saturation genome editing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we functionally assess 9,188 unique variants, including >99.5% of all possible coding sequence single-nucleotide alterations"
    explanation: The scale of the functional map available for interpreting RAD51C variants of uncertain significance.
- name: Tumour homologous-recombination deficiency and RAD51C methylation testing
  description: >-
    In high-grade serous ovarian cancer, RAD51C promoter methylation identifies
    homologous-recombination-deficient tumours that are not germline carriers. In the PAOLA-1
    ancillary study 25 of 519 tumours were RAD51C-methylated. This is a somatic test on the
    tumour, not a germline test, and it predicts PARP-inhibitor benefit.
  evidence:
  - reference: PMID:40513287
    reference_title: Predictive value of BRCA1/RAD51C methylation in HGSOC - An ancillary study of the PAOLA-1/ENGOT-ov25 phase 3 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A significant PFS1 benefit independently of methylation ratios was observed in patients with methylated tumors with bev-ola maintenance compared to bev alone"
    explanation: Establishes the predictive value of the methylation test for PARP-inhibitor benefit.
treatments:
- name: Risk-reducing salpingo-oophorectomy
  description: >-
    The principal ovarian-cancer prevention for carriers, offered around menopause. It is the
    intervention the 11% cumulative tubo-ovarian risk justifies, and the reason this gene is
    managed differently from genes whose ovarian risk is lower. The 2025 ACMG clinical practice
    resource places RAD51C among the moderate-penetrance ovarian cancer predisposition genes for
    which carriers undergo the procedure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: risk-reducing salpingo-oophorectomy
    term:
      id: NCIT:C15323
      label: Salpingo-Oophorectomy
  target_mechanisms:
  - target: Ovarian carcinoma
    description: >-
      Removes the fallopian tube and ovary, including the fimbrial epithelium that is the cell of
      origin; prevention rather than treatment.
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RAD51C, RAD51D, and BRIP1 heterozygotes should be offered risk-reducing salpingo-oophorectomy close to the age of menopause"
    explanation: The ACMG recommendation itself, including the age at which it applies.
- name: Enhanced breast surveillance
  description: >-
    Breast surveillance intensified according to a personalized risk estimate rather than offered
    uniformly, which is what a moderate breast relative risk of 1.99 supports. The ACMG resource
    frames it as may be indicated according to personalized risk, so this row records a
    risk-stratified option and not a standing recommendation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: risk-stratified enhanced breast surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Breast carcinoma
    description: >-
      Earlier detection of the breast manifestation; no effect on the underlying repair defect.
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For RAD51C and RAD51D heterozygotes, enhanced breast surveillance may be indicated according to their personalized risk estimate"
    explanation: The recommendation this row records, including the hedge that makes it risk-stratified rather than universal.
- name: PARP-inhibitor therapy
  description: >-
    Olaparib in homologous-recombination-deficient high-grade serous ovarian cancer. The
    RAD51C-specific phase-3 evidence is in promoter-methylated tumours rather than germline
    carriers; extending it to a germline carrier is a mechanistic inference, which the entry
    states rather than hides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: olaparib
      term:
        id: NCIT:C71721
        label: Olaparib
  target_mechanisms:
  - target: PARP-Inhibitor Sensitivity
    treatment_effect: INHIBITS
    description: PARP inhibition exploits the homologous-recombination deficiency.
  evidence:
  - reference: PMID:40513287
    reference_title: Predictive value of BRCA1/RAD51C methylation in HGSOC - An ancillary study of the PAOLA-1/ENGOT-ov25 phase 3 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A significant PFS1 benefit independently of methylation ratios was observed in patients with methylated tumors with bev-ola maintenance compared to bev alone"
    explanation: The phase-3 ancillary result supporting PARP inhibition in RAD51C-deficient high-grade serous ovarian cancer.
- name: Genetic counseling and cascade testing
  description: >-
    Counselling has to carry the asymmetry: a high tubo-ovarian risk warranting risk-reducing
    surgery, and a moderate breast risk whose point estimate differs between segregation analysis
    and population-based series. The recessive implication for two carrier partners is Fanconi
    anemia complementation group O, a weaker gene-disease claim than the dominant one.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "underscoring the importance of discussing these potential updates between clinicians and individuals during testing"
    explanation: The resource's statement that variant reclassification and its consequences for cascade testing are themselves a counselling obligation.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "VUS in RAD51C, RAD51D and BRIP1 should not be used to guide clinical management or for predictive genetic testing for family members"
    explanation: The limit on cascade testing this row names, stated for these genes specifically.
  - reference: PMID:41070818
    reference_title: "Management of individuals with heterozygous germline pathogenic variants in RAD51C, RAD51D, and BRIP1: A clinical practice resource of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RAD51C, RAD51D, and BRIP1 heterozygotes should be offered risk-reducing salpingo-oophorectomy close to the age of menopause"
    explanation: The surgical offer counselling has to convey; it is cited here for the content of the discussion, and on the risk-reducing surgery row for the recommendation itself.
differential_diagnoses:
- name: Fanconi anemia complementation group O
  description: >-
    The biallelic RAD51C disease, defined by a homozygous missense variant in a consanguineous
    family with severe congenital abnormalities, loss of RAD51 focus formation and
    hypersensitivity to mitomycin C. ClinGen curates it separately and rates it only Limited, on
    three variants in two families, so it is both a different disease and a weaker gene-disease
    claim than the dominant predisposition. Curated in dismech as Fanconi_Anemia.
  evidence:
  - reference: PMID:20400963
    reference_title: Mutation of the RAD51C gene in a Fanconi anemia-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We have identified a homozygous missense mutation in the RAD51C gene in a consanguineous family with multiple severe congenital abnormalities characteristic of FA."
    explanation: The founding report of the biallelic disease, which is what makes it a separate entity from this entry's monoallelic predisposition.
  - reference: CGGV:assertion_ea7ea36f-955c-4478-b5f6-12ff0a0dbf0b-2023-12-20T180000.000Z
    reference_title: RAD51C / Fanconi anemia complementation group O (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is limited evidence to support this gene-disease relationship. More evidence is needed to support the role of RAD51C in FANCO."
    explanation: ClinGen's own tier for the recessive arm, which is why this entry does not treat it as an equally established counterpart.
- name: Hereditary breast and ovarian cancer syndrome (BRCA1, BRCA2)
  description: >-
    The higher-penetrance syndromes with which RAD51C shares the homologous-recombination
    mechanism, the tubal cell of origin and the therapeutic vulnerability, and from which it is
    distinguished by a much lower breast risk. Curated in dismech as
    Hereditary_Breast_and_Ovarian_Cancer_Syndrome.
- name: Somatic RAD51C promoter hypermethylation without a germline variant
  description: >-
    An important non-hereditary mimic at the level of tumour biology rather than of clinical
    presentation: a high-grade serous ovarian cancer can be RAD51C-deficient and
    PARP-inhibitor-responsive through promoter methylation alone, with no germline variant and no
    familial risk to relatives. Confusing the two would lead to cascade testing of an unaffected
    family.
  evidence:
  - reference: PMID:28825726
    reference_title: A mutational signature reveals alterations underlying deficient homologous recombination repair in breast cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "epigenetic silencing of RAD51C and BRCA1 by promoter methylation is strongly associated with signature 3"
    explanation: Establishes that the epigenetic route produces the same homologous-recombination-deficient signature without a germline lesion.
animal_models:
- name: Rad51c Trp53 double-mutant mouse
  species: Mouse
  genotype: Conditional Rad51c deletion with Trp53 inactivation
  publication: PMID:26820992
  description: >-
    Conditional epidermal and mammary Rad51c deletion produces mammary carcinoma in 63% of female
    mice only when combined with Trp53 inactivation, shortening latency from 11 to 6 months, and
    recapitulating the histopathology and genomic instability of human
    homologous-recombination-deficient breast cancer. Rad51c loss alone is insufficient.
  modeled_mechanisms:
  - target: TP53 Loss and Checkpoint Escape
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Demonstrates that checkpoint loss is required alongside the repair defect for tumours to
      form in this tissue.
    limitations: >-
      The requirement is demonstrated in the mouse mammary gland, and the entry's dominant
      manifestation in humans is tubo-ovarian rather than mammary. Whether TP53 loss is strictly
      necessary in human RAD51C carriers does not follow from the mouse, and the model uses
      conditional somatic deletion rather than the constitutional heterozygous state of a human
      carrier.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        A mouse mammary requirement is evidence about mouse mammary tumorigenesis; the human
        entity's leading tumour arises in the fallopian tube fimbria, which this model does not
        address.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's genotype is conditional biallelic somatic deletion in a target tissue; the
        human genotype is constitutional heterozygosity with a stochastic somatic second hit, so
        the model supplies the second hit by design rather than observing it.
    evidence:
    - reference: PMID:26820992
      reference_title: Rad51c- and Trp53-double-mutant mouse model reveals common features of homologous recombination-deficient breast cancers.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "deletion of Rad51c invariably requires inactivation of the Trp53 tumor suppressor (TP53 in humans) to produce mammary carcinomas in 63% of female mice"
      explanation: The result establishing the Trp53 requirement in this model.
  genes:
  - preferred_term: Rad51c
    term:
      id: MGI:2150020
      label: Rad51c

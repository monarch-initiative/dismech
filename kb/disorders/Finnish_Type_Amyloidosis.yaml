name: Finnish Type Amyloidosis
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Hereditary gelsolin amyloidosis (AGel amyloidosis, familial amyloidosis of Finnish
  type, OMIM 105120) is an autosomal dominant systemic amyloidosis caused by variants
  in GSN. It is the only human disease known to be caused by a gelsolin gene defect.

  Its mechanism is unlike the other hereditary systemic amyloidoses, and that is what
  makes it worth curating separately from them. In ATTR the precursor tetramer
  dissociates and the intact monomer misfolds. Here the variant protein is not itself
  the amyloid: the D187N/D187Y substitutions abolish a calcium-binding site in gelsolin
  domain 2, letting that domain unfold, and an unfolded domain 2 exposes a site that
  furin cleaves as the protein transits the Golgi. A second, extracellular cleavage
  then releases the 8 and 5 kDa fragments that actually deposit. The amyloidogenic
  species is therefore manufactured by two host proteases in two compartments, from a
  protein whose own fold was only made cleavable - not misfolded into fibrils directly.

  Clinically it is a triad: lattice corneal dystrophy, slowly progressive bilateral
  facial palsy, and cutis laxa, with sensory peripheral neuropathy and renal
  involvement following. Onset is typically in adulthood and the course is slow but
  relentless. Originally described in Finland, it is now reported worldwide and is
  thought to remain underdiagnosed.
disease_term:
  preferred_term: Finnish type amyloidosis
  term:
    id: MONDO:0007097
    label: Finnish type amyloidosis
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  description: >-
    Autosomal dominant with complete penetrance. Heterozygotes are affected; the disease arises from a
    gain of proteolytic susceptibility in the variant allele's product rather than
    from loss of gelsolin function, which is why one variant allele suffices.
  evidence:
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary gelsolin amyloidosis (HGA) is an autosomally dominantly inherited
      form of systemic amyloidosis"
    explanation: States the inheritance pattern and systemic character of the disease.

pathophysiology:
- name: GSN Domain 2 Calcium-Binding Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. D187N or D187Y substitutions compromise calcium binding in
    gelsolin domain 2. The variant does not directly destabilise the whole protein into
    an aggregation-prone state; it removes the calcium coordination that holds domain 2
    folded, so the domain begins to sample unfolded conformations.
  molecular_functions:
  - preferred_term: actin filament severing activity
    term:
      id: GO:0003789
      label: actin filament severing activity
  downstream:
  - target: Domain 2 Unfolding and Exposure of a Cryptic Furin Site
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "autosomal dominant D187N or D187Y mutations compromise Ca(2+) binding in
      domain 2 of gelsolin, allowing domain 2 to sample unfolded conformations"
    explanation: >-
      Establishes the precise molecular defect - loss of calcium binding in domain 2 -
      and its immediate structural consequence.
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is the first and so-far only known disorder caused by a gelsolin gene
      defect, namely a G654A or G654T mutation."
    explanation: Gives the causal variants at nucleotide level and the uniqueness of the gene-disease pair.

- name: Domain 2 Unfolding and Exposure of a Cryptic Furin Site
  biological_scale: MOLECULAR
  description: >-
    An unfolded domain 2 exposes a site that furin cleaves while the protein is passing
    through the Golgi on its way to secretion. This is the step that converts a folding
    defect into a proteolysis problem, and it is compartment-specific: the wild-type
    protein traverses the same pathway untouched.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  downstream:
  - target: Two-Step Proteolysis Releasing 8 and 5 kDa Amyloidogenic Fragments
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When domain 2 is unfolded, gelsolin is subject to aberrant furin
      endoproteolysis as it passes through the Golgi on its way to the extracellular space."
    explanation: >-
      Establishes the intracellular protease, the compartment, and the conditional nature
      of the cleavage.

- name: Two-Step Proteolysis Releasing 8 and 5 kDa Amyloidogenic Fragments
  biological_scale: MOLECULAR
  description: >-
    The furin cut yields a C-terminal 68 kDa fragment (C68), which is then cut again
    outside the cell - probably by a matrix metalloprotease - to give the 8 and 5 kDa
    fragments that are the actual amyloid precursor. Two proteases, two compartments,
    and only the final products are amyloidogenic. This node is what the entry
    substitutes for the amyloidogenesis module's generic precursor node.
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  biological_processes:
  - preferred_term: proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  downstream:
  - target: Systemic AGel Amyloid Deposition
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting C-terminal 68 kDa fragment (C68) is susceptible to
      extracellular endoproteolytic events, possibly mediated by a matrix metalloprotease,
      affording 8 and 5 kDa amyloidogenic fragments of gelsolin."
    explanation: >-
      Establishes the second, extracellular cleavage and identifies the fragments that
      form the amyloid. Note the authors hedge the responsible protease ("possibly"),
      which is preserved in the description.

- name: Systemic AGel Amyloid Deposition
  biological_scale: TISSUE
  description: >-
    The fragments deposit as AGel amyloid systemically, with a striking tissue
    preference for cornea, cranial and peripheral nerves, and skin. Why those tissues
    rather than the heart, which dominates ATTR and AL, is not explained by the
    mechanism above.
  conforms_to: "amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition"
  downstream:
  - target: Corneal, Cranial Nerve and Dermal Dysfunction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These amyloidogenic fragments deposit systemically, causing a variety of
      symptoms including corneal lattice dystrophy and neurodegeneration."
    explanation: Links the fragments to systemic deposition and to the two cardinal manifestations.
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gelsolin gene defect causes expression of variant gelsolin, followed by
      systemic deposition of gelsolin amyloid (AGel) in HGA patients"
    explanation: Independent statement of systemic AGel deposition as the pathological process.

- name: Corneal, Cranial Nerve and Dermal Dysfunction
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint, dominated by the diagnostic triad. Cranial nerve involvement
    is progressive and measurable: in a series of 29 patients undergoing facial
    corrective surgery, facial paralysis was studied electroneurophysiologically, and
    the disease is characterised by progressive bilateral facial paralysis rather than
    a static deficit.
  conforms_to: "amyloidogenesis#Organ Dysfunction"
  evidence:
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic triad includes corneal lattice dystrophy (type 2), progressive
      bilateral facial paralysis, and cutis laxa."
    explanation: Establishes the three cardinal features that define the clinical syndrome.

phenotypes:
- category: Ophthalmological
  name: Lattice Corneal Dystrophy
  description: >-
    Lattice corneal dystrophy type 2, from amyloid deposition in the cornea. Usually the
    earliest manifestation and often the finding that prompts diagnosis.
  phenotype_term:
    preferred_term: Lattice corneal dystrophy
    term:
      id: HP:0001149
      label: Lattice corneal dystrophy
  evidence:
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic triad includes corneal lattice dystrophy (type 2), progressive
      bilateral facial paralysis, and cutis laxa."
    explanation: Names corneal lattice dystrophy as one of the three defining features.

- category: Neurological
  name: Progressive Bilateral Facial Palsy
  description: >-
    Bilateral facial paralysis that progresses over time, reflecting cranial nerve
    amyloid deposition. Severe enough in some patients to warrant facial corrective
    surgery.
  phenotype_term:
    preferred_term: Facial palsy
    term:
      id: HP:0010628
      label: Facial palsy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic triad includes corneal lattice dystrophy (type 2), progressive
      bilateral facial paralysis, and cutis laxa."
    explanation: Establishes progressive bilateral facial paralysis as a defining feature.

- category: Neurological
  name: Multiple Cranial Neuropathy
  description: >-
    Cranial nerve involvement extends well beyond the facial nerve. In a series of 29
    patients, all had dysfunction of both the facial (VII) and trigeminal (V) nerves,
    two-thirds had oculomotor (III) and hypoglossal (XII) involvement, and half had
    vestibulocochlear (VIII) involvement - a distribution the authors describe as more
    widespread than previously recognised, correlating with age and with severity of
    facial paralysis.

    No frequency band is assigned despite those proportions being quoted, because that
    cohort was assembled from patients undergoing facial corrective surgery: it is
    selected for severe facial involvement, so its cranial-nerve proportions cannot be
    read as disease-wide frequencies.
  phenotype_term:
    preferred_term: Abnormal cranial nerve physiology
    term:
      id: HP:0031910
      label: Abnormal cranial nerve physiology
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All showed dysfunction of facial (VII) and trigeminal (V) nerves, two-thirds
      of oculomotor (III) and hypoglossal (XII) nerves, and half of vestibulocochlear
      (acoustic) (VIII) nerve."
    explanation: >-
      Documents the specific cranial nerves involved and their relative frequencies within
      this surgical cohort.
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial nerve involvement in GA is more widespread than previously described,
      and correlates with age, severity of facial paralysis, and electromyographic findings."
    explanation: >-
      Establishes that the cranial neuropathy is progressive and broader than the facial
      palsy that defines the triad.

- category: Dermatological
  name: Cutis Laxa
  description: >-
    Loose, sagging skin from dermal amyloid deposition, completing the diagnostic triad.
  phenotype_term:
    preferred_term: Cutis laxa
    term:
      id: HP:0000973
      label: Cutis laxa
  evidence:
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized mainly by cranial and sensory peripheral neuropathy, corneal
      lattice dystrophy, and cutis laxa"
    explanation: Lists cutis laxa among the main characteristics of the disease.

- category: Neurological
  name: Sensory Peripheral Neuropathy
  description: >-
    Sensory peripheral neuropathy accompanying the cranial neuropathy, part of the
    systemic neurological involvement.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized mainly by cranial and sensory peripheral neuropathy, corneal
      lattice dystrophy, and cutis laxa"
    explanation: Establishes sensory peripheral neuropathy as a main characteristic.
- category: Ophthalmological
  name: Decreased Corneal Reflex
  description: >-
    Severely decreased corneal sensitivity with a greatly reduced or absent corneal
    reflex. This is a two-hit finding rather than a simple neuropathy: trigeminal
    amyloid deposition removes the afferent sensation, and corneal amyloid deposition
    degrades the surface that would be stimulated. It compounds the corneal dystrophy,
    because an insensate cornea does not report the erosions it is accumulating.
  phenotype_term:
    preferred_term: Decreased corneal reflex
    term:
      id: HP:0008000
      label: Decreased corneal reflex
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severely decreased corneal sensitivity and a greatly reduced or absent corneal
      reflex"
    explanation: States the corneal sensory deficit and the depressed reflex directly.
- category: Neurological
  name: Bulbar Dysfunction
  description: >-
    Glossopharyngeal and hypoglossal involvement appearing with disease progression,
    giving tongue atrophy and fasciculations, dysarthria and drooling. Clinically this
    is the cranial neuropathy extending caudally, and it carries the disease's main
    mortality risk after renal failure - aspiration pneumonia.
  phenotype_term:
    preferred_term: Bulbar palsy
    term:
      id: HP:0001283
      label: Bulbar palsy
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "involvement of the glossopharyngeal and hypoglossal nerves is often seen,
      resulting in tongue atrophy and fasciculations, dysarthria, and drooling"
    explanation: Names the affected nerves and the resulting bulbar signs.
- category: Neurological
  name: Autonomic Dysfunction with Orthostatic Hypotension
  description: >-
    Autonomic dysfunction from amyloid deposition in the autonomic nervous system,
    presenting most often as orthostatic hypotension. The same review notes that
    vascular amyloid is also likely to reduce arterial compliance, so the blood-pressure
    dysregulation has a vascular contribution alongside the neural one.
  phenotype_term:
    preferred_term: Orthostatic hypotension
    term:
      id: HP:0001278
      label: Orthostatic hypotension
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "amyloid deposition in the autonomic nervous system causes autonomic
      dysfunction, which often presents as orthostatic hypotension"
    explanation: Attributes the autonomic phenotype to amyloid deposition and names its
      usual presentation.
- category: Renal
  name: Proteinuria
  description: >-
    Proteinuria in the later stages, indicating glomerular amyloid deposition.
    Heterozygotes and homozygotes differ qualitatively rather than only in timing here:
    homozygotes develop severe nephrotic syndrome and progress to end-stage renal
    failure. Nephrotic syndrome is also named as a leading cause of death in this
    disease, which is what makes the renal arm more than an incidental finding.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the later stages of the disease, proteinuria is often observed, indicating
      amyloid deposition in the glomeruli of the kidneys"
    explanation: Establishes proteinuria and localises the deposition to the glomerulus.
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients homozygous for the amyloidogenic mutation of gelsolin develop a
      severe nephrotic syndrome and, ultimately, end stage renal failure"
    explanation: Gives the homozygous renal course, which is qualitatively worse rather
      than merely earlier.
- category: Cardiovascular
  name: Cardiac Conduction Abnormality
  description: >-
    Cardiac involvement including conduction abnormalities, reported as an occasional
    rather than a defining feature. Worth recording precisely because it is the
    exception: the cardiac deposition that dominates ATTR and AL amyloidosis is a
    minor finding here, and that contrast is part of what the tissue-tropism knowledge
    gap is asking about.
  phenotype_term:
    preferred_term: Cardiac conduction abnormality
    term:
      id: HP:0031546
      label: Cardiac conduction abnormality
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac involvement, including conduction abnormalities, is also sometimes
      seen"
    explanation: Records cardiac conduction involvement and its intermittent character.

genetic:
- name: GSN
  gene_term:
    preferred_term: GSN
    term:
      id: hgnc:4620
      label: GSN
  relationship_type: CAUSATIVE
  association: >-
    A single copy of the mutant allele is reported to give complete penetrance.
    Heterozygous GSN variants at codon 187 - G654A giving D187N, and G654T giving D187Y -
    cause hereditary gelsolin amyloidosis. Gelsolin is a principal actin-modulating
    protein with roles in axonal transport, myelination, neurite outgrowth and
    neuroprotection, which raises the question of how much of the phenotype is amyloid
    deposition and how much is loss of normal gelsolin function. Three independent lines
    of evidence answer it in favour of gain of toxic function, and the entry curates the
    deposition mechanism accordingly rather than leaving the question open. Gelsolin
    knockout mice develop and live normally, with only a mild bleeding-time and cell-motility
    phenotype attributed to functional redundancy. Human D187N homozygotes have earlier and
    more severe disease - a dose effect on the toxic species, and a qualitative one in the
    kidney, where they develop severe nephrotic syndrome and end-stage renal failure - but
    no symptoms attributable to loss of function. And there is no reported sporadic or wild-type gelsolin
    amyloidosis, so the mutation, not the shortfall of normal protein, is what is required.
    The residual uncertainty is narrower than "which mechanism": it is whether local
    gelsolin dysfunction modulates severity in the affected tissues, not whether it causes
    the disease.
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FAF appears to be caused by a gain-of-toxic function associated with gelsolin
      fragment amyloidogenesis"
    explanation: >-
      States the gain-of-toxic-function conclusion directly, which is why this entry does
      not curate a competing loss-of-function model.
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "gelsolin knockout mice exhibit a normal development and lifespan, exhibiting
      only a mild prolonged bleeding time phenotype and abnormally slowly migrating
      neutrophils and fibroblasts"
    explanation: >-
      The knockout evidence against a loss-of-function contribution: removing gelsolin
      entirely does not reproduce the disease.
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is the first and so-far only known disorder caused by a gelsolin gene
      defect, namely a G654A or G654T mutation."
    explanation: Establishes the causal gene-disease relationship and the specific variants.
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One copy of the mutant allele appears to result in complete penetrance of FAF."
    explanation: >-
      Establishes complete penetrance in heterozygotes, which is why the entry does not
      hedge the genotype-phenotype relationship.
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Gelsolin is a principal actin-modulating protein, implicated in multiple
      biological processes, also in the nervous system, e.g. axonal transport, myelination,
      neurite outgrowth, and neuroprotection."
    explanation: >-
      Curated as PARTIAL because it establishes gelsolin's normal neural functions without
      demonstrating that their loss contributes to this disease - the open question noted
      in the association text.

animal_models:
- name: D187N transgenic gelsolin mouse (muscle-specific promoter)
  species: Mouse
  genotype: Transgenic human D187N gelsolin, muscle-specific promoter driving synthesis and secretion
  publication: PMID:22360545
  description: >-
    The model that established the proteolytic cascade in vivo. A muscle-specific promoter
    drives synthesis and secretion of human D187N gelsolin, and the animals develop
    aging-associated extracellular amyloid deposition. It reproduces the full mechanistic
    spine curated here - G2 misfolding in the Golgi, furin cleavage to C68, and the
    subsequent step to the 8 and 5 kDa fragments - which is what makes it the stated
    platform for testing agents that prevent either misfolding or cleavage.
  modeled_mechanisms:
  - target: Two-Step Proteolysis Releasing 8 and 5 kDa Amyloidogenic Fragments
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces both endoproteolytic steps in the correct compartments, which is
      the specific claim this entry's central node makes.
    limitations: >-
      The transgene is driven by a muscle-specific promoter, so the tissue distribution of
      synthesis is imposed by the construct rather than discovered. That is precisely why
      the model cannot by itself settle the human cornea-nerve-skin tropism question, even
      though it produces the local-synthesis observation that frames it.
    evidence:
    - reference: PMID:22360545
      reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mouse model of D187N FAF faithfully recapitulates G2 misfolding in the
        Golgi and the aberrant endoproteolytic cascade"
      explanation: States the recapitulation claim for the proteolytic cascade node directly.
  - target: Systemic AGel Amyloid Deposition
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Extracellular amyloid deposition occurs and is aging-associated as in human disease,
      but only in transgene-expressing tissue, and the mice additionally develop an
      inclusion-body-myositis-like intracellular gelsolin deposition not established in
      patients.
    limitations: >-
      Deposition is confined to tissues synthesising the transgene, so the model does not
      reproduce the human cornea-nerve-skin distribution. The intracellular
      inclusion-body-myositis phenotype is a divergence from human disease of unknown
      significance - the review states it is not yet clear whether patients show it.
    readouts:
    - name: Extracellular amyloid deposition in transgene-expressing tissue
      target: Systemic AGel Amyloid Deposition
      direction: INCREASED
      interpretation: >-
        Age-dependent extracellular deposition, the structural correlate of the human
        deposition node.
      evidence:
      - reference: PMID:22360545
        reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mouse model exhibits the aging-associated extracellular amyloid
          deposition of human FAF"
        explanation: Reports the deposition measurement behind this readout.
    evidence:
    - reference: PMID:22360545
      reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "amyloidogenesis is observed only in tissues synthesizing human D187N
        gelsolin, despite the presence of the 68 kDa cleavage product circulating in the
        blood, suggesting that local synthesis is required for amyloid fragment formation
        and/or deposition"
      explanation: >-
        Curated as PARTIAL because it grounds the deposition claim while simultaneously
        showing the distribution differs from human disease.

diagnosis:
- name: Molecular Genetic Testing of GSN
  description: >-
    Sequencing of GSN codon 187. Because the corneal finding usually precedes the
    neurological and dermal features by years, and because the disease is now recognised
    well outside Finland, a lattice corneal dystrophy without an obvious cause is
    reasonable grounds to test.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HGA, originally reported from Finland and now increasingly from other
      countries in Europe, North and South America, and Asia, may still be underdiagnosed
      worldwide."
    explanation: >-
      Supports testing outside the original founder population, since geographic
      assumptions are a known source of missed diagnosis here.

treatments:
- name: Symptomatic and Surgical Management
  description: >-
    No disease-modifying therapy exists. Management is symptomatic - ophthalmic care for
    the corneal disease, and facial corrective surgery for the paralysis, which a
    published series of 29 patients underwent. The cited review is explicit that correct
    diagnosis matters even absent specific therapy, because adequate symptomatic
    treatment substantially improves quality of life. No target_mechanisms link is
    asserted: nothing available acts on any node of the mechanism above.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23931809
    reference_title: "Hereditary gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In HGA, specific therapy is not yet available but correct diagnosis enables
      adequate symptomatic treatment which decisively improves the quality of life in these
      patients."
    explanation: Establishes both the absence of specific therapy and the value of symptomatic care.

- name: Genetic Counseling
  description: >-
    Autosomal dominant counselling with a 50% transmission risk. Relevant across a wide
    and widening geographic range, not only in the Finnish founder population.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

differential_diagnoses:
- name: Hereditary transthyretin amyloidosis (ATTRv)
  description: >-
    The other classic hereditary systemic amyloidosis, and the only current member of the
    KB's Hereditary_Systemic_Amyloidoses grouping. Both are autosomal dominant systemic
    amyloidoses with peripheral neuropathy, but the amyloidogenic mechanism differs
    fundamentally - ATTR proceeds by tetramer dissociation and misfolding of the intact
    monomer, whereas AGel requires two proteolytic cleavages to manufacture its precursor.
    The therapeutic consequence is a relocation of the stabilisation target, not its
    abolition. A tafamidis-style kinetic stabiliser cannot act on the deposited AGel
    species, because that species is an 8 kDa fragment that does not exist until after the
    protein has been cut. It can act one step earlier: the founding review proposes exactly
    this, a pharmacologic chaperone or kinetic stabiliser binding full-length D187N plasma
    gelsolin in the secretory pathway to hold G2 folded and so prevent the aberrant furin
    cleavage that starts the cascade, and cites the transthyretin programme as the
    precedent. So the two diseases share a drug strategy while differing in where in the
    pathway it has to be applied.
  distinguishing_features:
  - AGel presents with the corneal lattice dystrophy / facial palsy / cutis laxa triad; ATTRv does not
  - ATTRv commonly involves the heart; cardiac involvement is not a cardinal AGel feature
  - >-
    In ATTRv the stabilisation target and the depositing species are the same protein; in
    AGel they are not, so a stabiliser must act on the uncleaved precursor upstream of
    furin rather than on the fragment that deposits
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting C-terminal 68 kDa fragment (C68) is susceptible to
      extracellular endoproteolytic events, possibly mediated by a matrix metalloprotease,
      affording 8 and 5 kDa amyloidogenic fragments of gelsolin."
    explanation: >-
      Establishes that the AGel precursor is a proteolytic fragment, which is the basis of
      the mechanistic distinction from ATTR drawn above.
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it may be possible to thermodynamically and/or kinetically stabilize the
      second domain of D187N/Y plasma gelsolin in the cellular secretory pathway employing
      a pharmacologic chaperone or a more specialized kinetic stabilizer"
    explanation: >-
      Establishes that the kinetic-stabiliser strategy does have an AGel analogue, applied
      to the uncleaved precursor. Curated explicitly because the naive reading of the
      fragment mechanism - that precursor stabilisation cannot apply at all - is what this
      sentence rules out.

- name: Other causes of lattice corneal dystrophy
  description: >-
    Lattice corneal dystrophy is usually a localised corneal disease from TGFBI variants,
    with no systemic component. Type 2 lattice dystrophy is the AGel form, and treating it
    as an isolated corneal problem is how a systemic amyloidosis gets missed for years.
  distinguishing_features:
  - AGel lattice dystrophy is type 2 and is accompanied, sooner or later, by facial palsy and cutis laxa
  - A family history of adult-onset facial weakness should prompt GSN testing rather than corneal-only workup
  evidence:
  - reference: PMID:26422119
    reference_title: "Progressive cranial nerve involvement and grading of facial paralysis in gelsolin amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic triad includes corneal lattice dystrophy (type 2), progressive
      bilateral facial paralysis, and cutis laxa."
    explanation: Identifies the corneal phenotype specifically as type 2 within a systemic triad.

discussions:
- discussion_id: gap_agel_tissue_tropism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Systemic AGel Amyloid Deposition
  prompt: >-
    Why does AGel amyloid deposit preferentially in cornea, cranial nerves and skin, when
    the amyloidogenic fragments are generated from a plasma protein and released into the
    circulation?
  rationale: >-
    The disease is defined by a cornea-nerve-skin triad, while the heart, the dominant
    target in both ATTR and AL, is not a cardinal feature - and the precursor is a plasma
    protein whose fragments enter the circulation, so systemic availability alone predicts
    the wrong distribution. There is one leading hypothesis rather than a blank: the D187N
    transgenic mouse deposits amyloid only in tissues that themselves synthesise the mutant
    gelsolin, despite circulating C68 being present throughout, which argues that local
    synthesis rather than circulating precursor governs where deposition happens. What is
    open is whether that generalises to human tissue distribution, since muscle is the
    major source of plasma gelsolin while cornea and cranial nerve are not obviously so.
    Competing explanations remain live: local availability of the second, extracellular
    protease (MT1-MMP and possibly others), tissue-specific extracellular matrix components
    that nucleate these particular fragments, or slow clearance in poorly vascularised
    tissue such as cornea. Which is right matters therapeutically, because a treatment
    aimed at the circulating fragment and one aimed at local synthesis or deposition are
    different drugs.
  evidence:
  - reference: PMID:22360545
    reference_title: "Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies for therapeutic intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "amyloidogenesis is observed only in tissues synthesizing human D187N
      gelsolin, despite the presence of the 68 kDa cleavage product circulating in the
      blood, suggesting that local synthesis is required for amyloid fragment formation
      and/or deposition"
    explanation: >-
      The local-synthesis hypothesis, and the reason this gap is a question about
      generalisation to humans rather than an absence of any candidate mechanism.
  proposed_experiments:
  - experiment_id: exp_agel_protease_tissue_survey
    name: Map local gelsolin synthesis and second-step protease activity against the disease distribution
    description: >-
      Two things need separating. First, quantify local GSN synthesis in cornea, peripheral
      nerve, skin and myocardium in human tissue, to test whether the mouse local-synthesis
      finding accounts for the human triad - the mouse used a muscle-specific promoter, so
      its tissue distribution was imposed by the construct rather than discovered. Second,
      map MT1-MMP activity, and that of other C68-cleaving proteases, across the same
      tissues. The review names MT1-MMP as the second-step protease at least in HT1080
      cells while noting other extracellular proteases may contribute, so a survey has to
      be broader than MT1-MMP alone. If either measure tracks the disease distribution and
      the other does not, tropism is localised to that step.

notes: >-
  No GeneReviews chapter exists for this disease or for GSN. Verified by search: both
  "GSN GeneReviews[All Fields]" and "gelsolin amyloidosis GeneReviews[All Fields]" return
  zero results.

  No frequency bands are assigned to any phenotype, and the founding review supplies the
  general licence: because of the rarity of the disease, "the frequency with which each of
  the described symptoms present is unknown". Two further reasons apply to specific
  phenotypes. The three triad features are described as defining rather than as counted
  proportions. And the largest series cited here is 29 patients selected for having
  undergone facial corrective surgery - an ascertainment that would inflate any
  facial-palsy frequency derived from it, which is why the cohort proportions quoted in
  the Multiple Cranial Neuropathy description are not converted into a band.

  Natural history and mortality, recorded here rather than as evidence because the entry
  has no structured home for it: the primary causes of death reported are nephrotic
  syndrome, aspiration pneumonia from bulbar muscle dysfunction, and cerebral hemorrhage
  attributed to cerebral angiopathy (PMID:22360545). All three are downstream of
  phenotypes curated above, which is the substance behind the description's "slow but
  relentless". The same source notes that no conclusive epidemiological study of mortality
  exists, so the excess over age-matched controls is described as slight and unquantified.

  Grouping context: kb/groupings/Hereditary_Systemic_Amyloidoses.yaml names this disease
  as an intended future member ("AGel/Finnish-type gelsolin amyloidosis (GSN;
  MONDO:0007097)"), currently listing only ATTRv. Adding it to that grouping's members is
  a natural follow-up but is deliberately left to a separate change, so this PR adds an
  entry rather than also editing a grouping it does not otherwise touch.

  Deep-research provenance caveat: the claude_code report for this disease resolved 36/36
  references with confabulation_rate 0.0, but the relevance pass flagged PMID:33375500 as
  off topic and it is cited three times in the report body. It is "Standoff Distance in
  Ultrasonic Pulsating Water Jet" - a genuinely unrelated paper. It is not cited in this
  entry, and its presence is a reason to treat that report's citation list with care
  rather than as a vetted bibliography.


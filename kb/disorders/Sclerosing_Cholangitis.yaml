genetic:
- name: DCDC2
  gene_term:
    preferred_term: DCDC2
    term:
      id: hgnc:18141
      label: DCDC2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Isolated neonatal sclerosing cholangitis
  association: >-
    Biallelic DCDC2 variants cause isolated neonatal sclerosing cholangitis
    (MONDO:0018816). DCDC2 is expressed in the primary cilium of cuboidal
    cholangiocytes; affected patients lose both the protein and the cilium, so
    the subtype is classified as a liver-based ciliopathy. Two independent
    series reported different allele classes with the same ciliary phenotype:
    protein-truncating variants in a series seen at King's College Hospital,
    and biallelic missense variants or an in-frame deletion in the doublecortin
    domains in a second, independent series. Only the King's College
    attribution is sourced - PMID:27469900's full text states it - and no
    geography is asserted for the other series.
  case_fractions:
  - population: >-
      Neonatal sclerosing cholangitis patients with available DNA at a single
      UK paediatric liver centre, selected for parental consanguinity at the
      exome-sequencing stage
    case_fraction_percent: 29.2
    cohort_size: 24
    notes: >-
      7 of 24 patients (6 of 19 families); the percentage is that ratio
      expressed as a percentage, and the raw counts are in the quoted snippet.
      The exome-sequenced subgroup was chosen for consanguinity, so this share
      is not a population estimate for neonatal sclerosing cholangitis at
      large.
    evidence:
    - reference: PMID:27469900
      reference_title: "Mutations in DCDC2 (doublecortin domain containing protein 2) in neonatal sclerosing cholangitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among 24 NSC patients with available DNA, 7 had mutations in DCDC2 (6
        of 19 families).
      explanation: Gives the numerator, denominator and family counts behind this share.
  evidence:
  - reference: PMID:27469900
    reference_title: "Mutations in DCDC2 (doublecortin domain containing protein 2) in neonatal sclerosing cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients had homozygous changes (2 frameshift, 2 stop codon) and 2
      patients had compound heterozygous changes (2 frameshift, 1 stop codon).
      All mutations were therefore predicted to be protein truncating
    explanation: >-
      Records the allele class found in this cohort, the contrast that makes
      the second series' missense alleles worth stating separately.
  - reference: PMID:27319779
    reference_title: "DCDC2 Mutations Cause Neonatal Sclerosing Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic missense mutations or in-frame deletion in DCDC2
      in four affected children.
    explanation: >-
      An independent series establishing biallelic DCDC2 variants as causal,
      with a different allele class from the UK cohort.
  - reference: PMID:27319779
    reference_title: "DCDC2 Mutations Cause Neonatal Sclerosing Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This data expands the molecular spectrum of NSC, that can be considered
      as a ciliopathy and also expands the clinical spectrum of the DCDC2
      mutations, previously reported in dyslexia, deafness, and nephronophtisis.
    explanation: >-
      Notes that DCDC2 is pleiotropic - the same gene is reported in dyslexia,
      deafness and nephronophthisis - so a DCDC2 finding is not by itself
      specific to this subtype.
- name: CLDN1
  gene_term:
    preferred_term: CLDN1
    term:
      id: hgnc:2032
      label: CLDN1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Neonatal ichthyosis-sclerosing cholangitis syndrome
  association: >-
    Biallelic CLDN1 loss of function causes neonatal ichthyosis-sclerosing
    cholangitis syndrome (MONDO:0011874), also reported as ILVASC. Claudin-1 is
    a tight-junction protein, and its absence from both liver and skin accounts
    for the paired cholangiopathy and ichthyosis. The recurrent missense allele
    p.Arg81His is a founder variant in Jews of Moroccan descent.
  notes: >-
    The 3q27-q28 assignment quoted below is the linkage interval the founding
    study had previously mapped, which is how claudin-1 was reached as a
    positional candidate; it is recorded here as that study states it and is
    not a separate locus claim.
  evidence:
  - reference: PMID:15521008
    reference_title: "Claudin-1 gene mutations in neonatal sclerosing cholangitis associated with ichthyosis: a tight junction disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously assigned a syndrome associating ichthyosis and neonatal
      sclerosing cholangitis (NISCH syndrome) to chromosome 3q27-q28.
    explanation: >-
      Records the mapped interval that identified claudin-1 as the positional
      candidate gene for this subtype.
  - reference: PMID:37814412
    reference_title: "CLDN1 Arg81His founder variant causes ichthyosis, leukocyte vacuoles, alopecia, and sclerosing cholangitis (ILVASC) syndrome in Moroccan Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      show through haplotype analysis in the vicinity of the CLDN1 gene, that
      this variant represents a founder variant in Jews of Moroccan descent
      with an estimated carrier frequency of 1:220
    explanation: >-
      Sources the founder status and carrier frequency of the recurrent
      p.Arg81His allele.
  - reference: PMID:37814412
    reference_title: "CLDN1 Arg81His founder variant causes ichthyosis, leukocyte vacuoles, alopecia, and sclerosing cholangitis (ILVASC) syndrome in Moroccan Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most ILVASC cases described to date were attributed to
      homozygous truncating variants in CLDN1, a single missense variant CLDN1
      p.Arg81His, associated with isolated skin ichthyosis phenotype, has been
      recently reported in a family of Moroccan Jewish descent.
    explanation: >-
      Establishes truncating variants as the usual allele class and the
      missense founder allele as the exception, supporting the two allele
      classes recorded in the pathophysiology node's genetic context.

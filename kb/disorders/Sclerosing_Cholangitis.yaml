    modifier: DECREASED
  downstream:
  - target: Bile Duct Fibrostenosis
    description: >-
      Cilium-deficient cholangiocytes develop a cholangiopathy with irregular
      dilatation and strictures of intrahepatic and extrahepatic bile ducts.
  evidence:
  - reference: PMID:27469900
    reference_title: "Mutations in DCDC2 (doublecortin domain containing protein 2) in neonatal sclerosing cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four of 13 patients were homozygous and two were compound heterozygous
      for mutations in the doublecortin domain containing 2 gene (DCDC2), which
      encodes DCDC2 protein and is expressed in cholangiocyte cilia.
    explanation: >-
      Establishes biallelic DCDC2 variants in neonatal sclerosing cholangitis
      and the ciliary localization of the protein in cholangiocytes.
  - reference: PMID:27469900
    reference_title: "Mutations in DCDC2 (doublecortin domain containing protein 2) in neonatal sclerosing cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      transmission electron microscopy found that cholangiocytes lacked primary
      cilia (n=5)
    explanation: >-
      Ultrastructural confirmation that the cilium itself, not only the DCDC2
      protein, is absent in patient cholangiocytes.
  - reference: PMID:27469900
    reference_title: "Mutations in DCDC2 (doublecortin domain containing protein 2) in neonatal sclerosing cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiological features included irregular dilatation and strictures in
      intrahepatic or extrahepatic bile ducts, consistent with a cholangiopathy.
    explanation: >-
      Supports the downstream edge from cilium loss to the stricturing
      bile-duct phenotype this entry models as Bile Duct Fibrostenosis.
  - reference: PMID:27319779
    reference_title: "DCDC2 Mutations Cause Neonatal Sclerosing Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cholangiocytes, DCDC2 protein is normally located in the cytoplasm and
      cilia, whereas in patients the mutated protein is accumulated in the
      cytoplasm, absent from cilia, and associated with ciliogenesis defect.
    explanation: >-
      An independent series links DCDC2 variants to a ciliogenesis defect,
      supporting the decreased cilium-assembly annotation on this node.
- name: Cholangiocyte Tight-Junction Failure
  description: >-
    In the syndromic neonatal form, biallelic CLDN1 variants remove claudin-1
    from both liver and skin. Claudins are components of tight junctions, which
    in the liver separate bile flow from plasma, and the founding study
    proposes that lack of claudin-1 raises paracellular permeability between
    epithelial cells and that the bile-duct injury follows from its absence in
    cholangiocytes. That mechanism is the authors' proposal and is carried here
    with the same hedge. Claudin-1 is absent from skin as well as liver in
    affected patients, and this subtype is the one distinguished clinically by
    ichthyosis.
  biological_scale: CELLULAR
  subtypes:
  - Neonatal ichthyosis-sclerosing cholangitis syndrome
  genes:
  - preferred_term: CLDN1
    term:
      id: hgnc:2032
      label: CLDN1
  genetic_context:
    gene:
      preferred_term: CLDN1
      term:
        id: hgnc:2032
        label: CLDN1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic CLDN1 loss of function. `HOMOZYGOUS` is recorded here, unlike
      on the DCDC2 node above, because it is the state the sources report:
      PMID:37814412 states that most ILVASC cases described to date were
      attributed to homozygous truncating variants, and the founding report
      described a 2-bp deletion in exon 1 in inbred kindred, producing a
      premature stop codon and complete absence of claudin-1 protein. The
      later founder missense allele p.Arg81His segregates in North African
      Jewish families; the cited record does not state its zygosity, so the
      slot carries the modal reported state rather than a claim about every
      described case.
  cell_types:
  - preferred_term: Cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  cellular_components:
  - preferred_term: cholangiocyte tight junction
    term:
      id: GO:0005923
      label: bicellular tight junction
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  downstream:
  - target: Bile Duct Inflammation
    description: >-
      Loss of claudin-1 from cholangiocyte tight junctions is proposed to
      increase paracellular permeability and so to produce the bile-duct injury
      of this subtype.
  evidence:
  - reference: PMID:15521008
    reference_title: "Claudin-1 gene mutations in neonatal sclerosing cholangitis associated with ichthyosis: a tight junction disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We described in 4 patients, of 2 inbred kindred of Moroccan origin, a
      2-bp deletion (200-201 TT) in exon 1 of the claudin-1 gene arising in a
      premature stop codon and resulting in total absence of claudin-1 protein
      in the liver and skin.
    explanation: >-
      The founding report of CLDN1 loss of function in this subtype, showing
      absence of the protein in both affected organs.
  - reference: PMID:15521008
    reference_title: "Claudin-1 gene mutations in neonatal sclerosing cholangitis associated with ichthyosis: a tight junction disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lack of claudin-1 in NISCH syndrome may lead to increased paracellular
      permeability between epithelial cells. Bile duct injury may be related to
      the absence of claudin-1 expression in cholangiocytes.
    explanation: >-
      The authors' proposed mechanism linking claudin-1 loss to bile-duct
      injury. It is stated as a proposal ("may"), and this node's description
      carries it with the same hedge.

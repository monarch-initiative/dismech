review_notes: >-
  Scope of the dismech#12205 genetics pass. Only the two Mendelian neonatal
  subtypes of this umbrella entry are curated with a causal gene, because they
  are the subtypes MONDO records one for (MONDO:0018816 / DCDC2 and
  MONDO:0011874 / CLDN1). No susceptibility locus for primary sclerosing
  cholangitis is curated in this entry. That was left out of scope for this
  pass rather than investigated and rejected, and this note makes no claim
  about what PSC's genetic architecture is.

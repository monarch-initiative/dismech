  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    Syndromic neonatal form with sclerosing cholangitis and ichthyosis, caused
    by biallelic loss of function of the tight-junction protein claudin-1
    (CLDN1). Also reported under the name ichthyosis, leukocyte vacuoles,
    alopecia and sclerosing cholangitis (ILVASC).
  evidence:
  - reference: PMID:37814412
    reference_title: "CLDN1 Arg81His founder variant causes ichthyosis, leukocyte vacuoles, alopecia, and sclerosing cholangitis (ILVASC) syndrome in Moroccan Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal ichthyosis and sclerosing cholangitis syndrome (NISCH), also
      known as ichthyosis, leukocyte vacuoles, alopecia, and sclerosing
      cholangitis (ILVASC), is an extremely rare disease of autosomal recessive
      inheritance, resulting from loss of function of the tight junction protein
      claudin-1.
    explanation: >-
      States the inheritance mode and the causal gene product for this subtype,
      and records the ILVASC name under which the same entity is reported.
- name: Isolated neonatal sclerosing cholangitis
  subtype_term:
    preferred_term: isolated neonatal sclerosing cholangitis
    term:

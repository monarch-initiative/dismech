- accession: geo:GSE239283
  title: Il-17 Signaling in Primary Sclerosing Cholangitis Patient-Derived Organoids
  description: The pathogenesis of primary sclerosing cholangitis (PSC) is unclear, although studies implicate IL-17A as an inflammatory mediator in this disease. However, a direct assessment of IL-17 signaling in PSC cholangiocytes is lacking. Cholangiocytes obtained from PSC and non-PSC patients by endoscopic retrograde cholangiography (ERC) were cultured as extrahepatic cholangiocyte organoids (ECO). The ECO were treated with vehicle or IL-17A and assessed by NanoString analysis, single cell RNA sequencing (scRNA-seq), and whole genome sequencing (WGS). The secretome was assessed by Olink analysis.

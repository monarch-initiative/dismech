datasets:
- accession: geo:GSE177044
  title: Large-scale whole blood RNA-Seq identifies transcriptional differences between primary sclerosing cholangitis and ulcerative colitis
  description: 'Background: Patients suffering from primary sclerosing cholangitis (PSC) often also have ulcerative colitis (UC). Cross-disease genetic and microbiome studies across PSC und UC patients indicated that UC in PSC is a separate disease entity from primary UC, but expression studies for PSC are lacking. In this study, we performed a molecular comparison of whole blood expression levels in PSC only, PSC patients with additional UC diagnosis (PSC/UC), and UC, using a large collection of whole blood transcriptome data. Methods: We conducted whole blood RNA-Seq experiments for 495 UC patients, 220 PSC patients (of whom 177 have also a UC diagnosis), and 320 healthy controls from Germany and Norway.'
  organism:

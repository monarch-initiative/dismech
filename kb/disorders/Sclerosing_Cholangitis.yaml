    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, bile acids act as signaling molecules, regulating metabolism
      and immune responses through receptors such as FXR and TGR5.
      Dysregulation of these pathways may promote cholestasis, inflammation,
      and fibrosis.
    explanation: >-
      Supports bile-acid signaling dysregulation as a contributor to
      cholestasis, inflammation, and fibrosis.
  - reference: DOI:10.3390/cells13191650
    reference_title: 'Bile Acids-Based Therapies for Primary Sclerosing Cholangitis:
      Current Landscape and Future Developments'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have revealed that these cells undergo a downregulation of
      GPBAR1 (TGR5), a bile acid receptor involved in bicarbonate secretion and
      immune regulation.
    explanation: >-
      Supports cholangiocyte bile-acid receptor dysregulation in PSC.
- name: Cholangiocyte Primary Cilium Loss
  description: >-
    In the isolated neonatal form, biallelic DCDC2 variants abolish DCDC2
    protein, which is normally expressed in cholangiocyte cilia. Affected bile
    ducts lose not only the protein but the cilium itself, absent on both
    immunostaining for acetylated alpha-tubulin and transmission electron
    microscopy. What the cilium contributes to cholangiocyte function is not
    established by the sources cited here, so this node records the structural
    loss and the cholangiopathy that accompanies it rather than an intervening
    functional step. This is a monogenic route into cholangiopathy, distinct
    from the immune- and microbiome-driven mechanisms modeled for primary
    sclerosing cholangitis above.
  biological_scale: CELLULAR
  subtypes:
  - Isolated neonatal sclerosing cholangitis
  genes:
  - preferred_term: DCDC2
    term:
      id: hgnc:18141
      label: DCDC2
  genetic_context:
    gene:
      preferred_term: DCDC2
      term:
        id: hgnc:18141
        label: DCDC2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous DCDC2 variants. No `zygosity` is
      recorded: the slot is single-valued and has no biallelic value, and this
      node's own cited quote reports four homozygous and two compound
      heterozygous patients, so naming either one would contradict the
      evidence. The series seen at King's College Hospital found only
      protein-truncating alleles; a second, independent series reported
      biallelic missense variants and an in-frame deletion in the doublecortin
      domains, where the protein is mislocalized to the cytoplasm and absent
      from cilia rather than undetectable. Neither series' geography is
      asserted here: PMID:27319779's cached record carries no affiliation.
  cell_types:
  - preferred_term: Cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte

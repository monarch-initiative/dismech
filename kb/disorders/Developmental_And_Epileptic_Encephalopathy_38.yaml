genetic:
- name: ARV1
  gene_term:
    preferred_term: ARV1
    term:
      id: hgnc:29561
      label: ARV1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    ARV1 (ACAT-related enzyme 2 required for viability 1; MIM 611647) is the
    only gene implicated in DEE38 (MIM 617020). Reported biallelic alleles span
    homozygous missense (p.Gly189Arg), in-frame deletions (p.Lys59_Asn98del from
    the c.294+1G>A splice variant; p.Leu185del), a splice variant deleting the
    C-terminus (c.674-2A>T), and compound-heterozygous truncating variants
    (p.Ser122Glnfs*7 / p.Trp163*; p.Phe144Argfs*5). A rough genotype-phenotype
    trend has been proposed: truncating/null-predominant genotypes cluster with
    the most severe, early-lethal encephalopathy, whereas missense alleles can
    give a milder ataxia-with-elevated-AFP presentation. ARV1 was originally
    identified as a candidate disease gene by whole-exome sequencing of
    prescreened multiplex consanguineous families.
  evidence:
  - reference: PMID:27270415
    reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data support ARV1 deficiency as a cause of autosomal recessive epileptic encephalopathy."
    explanation: >-
      The gene-disease association statement establishing ARV1 as causative.
  - reference: PMID:25558065
    reference_title: Accelerating novel candidate gene discovery in neurogenetic disorders via whole-exome sequencing of prescreened multiplex consanguineous families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prescreening step led to the identification of 69 recessive genes not previously associated with disease, of which 33 are here described (SPDL1, TUBA3E, INO80, NID1, TSEN15, DMBX1, CLHC1, C12orf4, WDR93, ST7, MATN4, SEC24D, PCDHB4, PTPN23, TAF6, TBCK, FAM177A1, KIAA1109, MTSS1L, XIRP1, KCTD3, CHAF1B, ARV1, ISCA2, PTRH2, GEMIN4, MYOCD, PDPR, DPH1, NUP107, TMEM92, EPB41L4A, and FAM120AOS)."
    explanation: >-
      The original whole-exome discovery of ARV1 as a recessive neurogenetic
      disease gene.
  - reference: PMID:35227294
    reference_title: "Dilated cardiomyopathy is a part of the ARV1-associated phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, three different homozygous ARV1 and two compound heterozygous mutations in humans have been reported in 15 children"
    explanation: >-
      Summarizes the allelic and cohort landscape underlying the variant notes.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DEE38 is ultra-rare. Only small numbers of patients had been reported as of
    the most recent reviews (about 16 patients tabulated in 2022 and roughly 28
    reported cases cited in a 2025 case report); no population prevalence has
    been estimated. These are dated lower bounds rather than current totals.
  evidence:
  - reference: PMID:35227294
    reference_title: "Dilated cardiomyopathy is a part of the ARV1-associated phenotype: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, three different homozygous ARV1 and two compound heterozygous mutations in humans have been reported in 15 children"
    explanation: >-
      A literature count consistent with an ultra-rare disorder; kept as a count
      rather than converted to a population rate.
progression:
- phase: Onset
  notes: >-
    Onset is in early infancy. Visual inattention, hypotonia and developmental
    concern are frequently noted in the first months, with seizures typically
    beginning between roughly 2 and 8 months of life.
  evidence:
  - reference: PMID:34017911
    reference_title: Migrating Focal Seizures and Myoclonic Status in ARV1-Related Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since their first months of life, both girls exhibited severe axial hypotonia, visual inattention, dyskinetic movements, severe developmental delay, and slow background EEG activity. Intractable nonmotor seizures started in both at the eighth month of life"
    explanation: >-
      Documents the early-infantile onset of hypotonia and developmental
      concern with seizure onset in the first year.
- phase: Untreated course and mortality
  notes: >-
    The course is severe and often lethal in childhood, particularly for
    truncating/splice genotypes; several reported children died in the first
    years of life, commonly from aspiration and respiratory infection during
    intercurrent illness.
  evidence:
  - reference: PMID:34017911
    reference_title: Migrating Focal Seizures and Myoclonic Status in ARV1-Related Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both sisters died prematurely during respiratory infections."
    explanation: >-
      Documents premature death from respiratory infection in the severe
      phenotype.
  - reference: PMID:32165008
    reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He deteriorated with increasing seizures and died at age 15 months as result of aspiration pneumonia."
    explanation: >-
      A worked example of early death from aspiration pneumonia.
diagnosis:
- name: Whole exome sequencing
  description: >-
    Diagnosis rests on identifying biallelic ARV1 variants by exome (or genome)
    sequencing. Because ARV1 was a novel gene and variants can be missense of
    uncertain significance, functional support is often sought.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32165008
    reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were discovered through whole exome sequencing and alternate splicing was validated on the cDNA level."
    explanation: >-
      Establishes exome sequencing as the diagnostic route, with cDNA
      validation of splice effects.
- name: Flow cytometry for GPI-anchored proteins
  description: >-
    Reduced surface expression of GPI-anchored proteins on neutrophils (CD16,
    CD66b, FLAER) or fibroblasts (CD59, CD87) is a functional signature shared
    with the inherited GPI-deficiency disorders and supports pathogenicity of an
    ARV1 variant.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flow cytometric analysis on patient fibroblasts showed a decrease in GPI-anchored proteins on the cell surface, supporting a lower residual activity of the mutant ARV1 as compared to the wildtype."
    explanation: >-
      Establishes the GPI-anchored-protein flow cytometry assay as functional
      diagnostic support.
treatments:
- name: Antiseizure medication (symptomatic)
  description: >-
    Management is symptomatic. Multiple antiseizure medicines are trialed
    (valproate, phenobarbital, levetiracetam, vigabatrin, topiramate,
    benzodiazepines and others), but the epilepsy is characteristically
    pharmacoresistant and benefit is typically limited or transient. No
    disease-modifying or ARV1-specific pharmacotherapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals showed psychomotor delay, hypotonia, early onset refractory seizures followed by regression and specific neuroimaging features."
    explanation: >-
      Establishes the refractory nature of the seizures that symptomatic
      antiseizure therapy targets with limited success.
- name: Ketogenic diet
  description: >-
    A ketogenic diet produced a documented but temporary reduction in seizure
    frequency in a pair of sisters before efficacy was lost with disease
    progression. It is an option within general refractory-DEE management rather
    than an ARV1-specific therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_phenotypes:
  - preferred_term: Refractory epilepsy
    term:
      id: HP:0020174
      label: Refractory drug response
  evidence:
  - reference: PMID:34017911
    reference_title: Migrating Focal Seizures and Myoclonic Status in ARV1-Related Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the second year of life, continuous epileptiform EEG activity of extremely high amplitude appeared in association with myoclonic status, leading to severely impaired alertness and responsiveness."
    explanation: >-
      Sourced from the same two-sister report in which a ketogenic diet gave a
      transient benefit; the quote characterizes the refractory course the diet
      was used against.
- name: ARV1 gene replacement (preclinical)
  description: >-
    Lentiviral transduction of wild-type ARV1 cDNA into patient fibroblasts
    rescued the cell-surface GPI-anchored-protein deficiency, demonstrating
    cellular reversibility of the core molecular defect and providing a rationale
    for gene-replacement therapy. This remains a cell-based proof of concept with
    no in vivo or clinical data.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Reduced Cell-Surface GPI-Anchored Protein Expression
    treatment_effect: RESTORES
    description: >-
      Re-expressing wild-type ARV1 restores GPI-anchored protein levels on the
      cell surface in patient fibroblasts.
  evidence:
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A rescue assay through the transduction of lentivirus expressing wild type ARV1 cDNA effectively rescued these alterations."
    explanation: >-
      The cell-based gene-replacement proof of concept that this preclinical
      treatment node records.
- name: Genetic counseling
  description: >-
    Because DEE38 is autosomal recessive, genetic counseling of families
    (including recurrence-risk and carrier-testing discussion) is part of care.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained seven new patients from six unrelated families harboring biallelic variants in ARV1, including five novel variants."
    explanation: >-
      Establishes the biallelic recessive genotype that makes recurrence-risk
      counseling relevant.
animal_models:
- name: Neuronal Arv1 conditional knockout mouse
  species: Mouse
  genotype: Neuron-specific Arv1 deletion
  category: Genetic
  description: >-
    Mice with a neuronal deletion of Arv1 recapitulate the human phenotype,
    exhibiting seizures and a severe adult survival defect, supporting a
    neuron-autonomous requirement for ARV1.
  publication: PMID:27270415
  genes:
  - preferred_term: Arv1
    term:
      id: hgnc:29561
      label: ARV1
  modeled_mechanisms:
  - target: Neuronal Dysfunction and Epileptic Encephalopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Neuron-specific loss of Arv1 reproduces the seizure phenotype and a severe
      survival defect, isolating a neuronal requirement for ARV1.
    limitations: >-
      A conditional neuronal knockout models complete loss rather than the
      hypomorphic residual activity of many human missense/splice alleles, and
      the non-neural features of the human disorder (visual, cardiac, systemic)
      are not addressed by a neuron-restricted deletion.
    evidence:
    - reference: PMID:27270415
      reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice with a neuronal deletion of Arv1 recapitulated the human phenotype, exhibiting seizures and a severe survival defect in adulthood."
      explanation: >-
        Supports treating the neuronal Arv1 knockout as informative for the
        encephalopathy node.
  evidence:
  - reference: PMID:27270415
    reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with a neuronal deletion of Arv1 recapitulated the human phenotype, exhibiting seizures and a severe survival defect in adulthood."
    explanation: >-
      Establishes the mouse model and its phenotypic recapitulation of the human
      disease.
experimental_models:
- name: Yeast arv1-null complementation assay
  description: >-
    Saccharomyces cerevisiae lacking ARV1 has GPI-anchor-synthesis and
    growth/temperature defects that can be rescued by human ARV1, and this
    complementation system is used to grade the functional impact of human ARV1
    alleles. The p.Gly189Arg allele only partially rescues the yeast defect;
    the p.Lys59_Asn98del deletion fails to rescue at restrictive temperature.
  experimental_model_type: OTHER
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:27270415
  modeled_mechanisms:
  - target: Impaired GPI Anchor Biosynthesis
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Yeast complementation grades how well each human ARV1 allele supports
      GPI-anchor synthesis, providing the functional read on allele severity.
    limitations: >-
      Yeast Arv1 also acts in sterol/sphingolipid homeostasis, so a rescue
      readout in yeast does not by itself resolve which ARV1 function is
      disease-decisive in human neurons.
    evidence:
    - reference: PMID:27270415
      reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The p.(Gly189Arg) variant partially rescued the temperature-dependent growth defect in arv1Δ yeast, while p.(Lys59-Asn98del) completely failed to rescue at restrictive temperature."
      explanation: >-
        Demonstrates the assay grading allele function, the readout this model
        provides.
  evidence:
  - reference: PMID:26460143
    reference_title: Complementation analysis reveals a potential role of human ARV1 in GPI anchor biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of human ARV1 could rescue the phenotypes associated with GPI anchor synthesis defect in the yeast arv1Δ mutant."
    explanation: >-
      Establishes that human ARV1 complements the yeast GPI defect, validating
      the assay for grading human alleles.
discussions:
- discussion_id: gap_gpi_versus_lipid_driver
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neuronal injury in ARV1 deficiency driven mainly by the GPI-anchor
    biosynthesis defect, by disruption of ARV1's ancestral sterol/sphingolipid
    trafficking role, or by both acting together?
  attaches_to:
  - "pathophysiology#Impaired GPI Anchor Biosynthesis"
  - "pathophysiology#Neuronal Dysfunction and Epileptic Encephalopathy"
  rationale: >-
    Yeast Arv1 has documented roles in both GPI-anchor flow and sterol/sphingolipid
    homeostasis, and human ARV1 conserves both. The strongest direct human
    evidence points at the GPI-anchoring branch: patient cells show reduced
    surface GPI-anchored proteins, the 2025 reconstitution work places ARV1 in
    the GPI-GnT complex, and a patient allele impaired GPI-anchored Gas1
    maturation without affecting sphingolipid synthesis. But whether residual
    lipid dyshomeostasis contributes independently to neuronal injury is not
    resolved, and the branch point is stated as open in the literature.
  proposed_experiments:
  - experiment_id: exp_neuronal_gpi_vs_lipid_dissection
    name: Dissecting GPI versus lipid contributions in ARV1-null neurons
    description: >-
      In ARV1-null human iPSC-derived neurons, separately restore GPI-anchoring
      (e.g. by re-expressing an ARV1 mutant competent for GPI-GnT support but
      not lipid handling, or vice versa) and measure rescue of neuronal
      excitability, survival and GPI-anchored protein levels, to attribute the
      neuronal phenotype to each function.
  evidence:
  - reference: PMID:32462292
    reference_title: A defect in GPI synthesis as a suggested mechanism for the role of ARV1 in intellectual disability and seizures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complementation tests in yeast showed that the ARV1 p.Gly189Arg mutation leads to deficient maturation of Gas1, a GPI-anchored protein, but does not affect sphingolipid synthesis"
    explanation: >-
      Evidence that at least one patient allele separates the GPI defect from the
      sphingolipid role, which is the crux of this open question.
- discussion_id: gap_excitation_inhibition_route
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does reduced surface expression of GPI-anchored proteins
    produce neuronal hyperexcitability and seizures in the developing brain?
  attaches_to:
  - "pathophysiology#Reduced Cell-Surface GPI-Anchored Protein Expression"
  - "pathophysiology#Neuronal Dysfunction and Epileptic Encephalopathy"
  rationale: >-
    The link from the measured cellular defect to seizures is drawn by analogy to
    other inherited GPI-deficiency disorders that share the clinical and imaging
    picture, and to a proposed role for ER stress from immature GPI-anchored
    proteins. No excitation-inhibition measurement exists in ARV1 deficiency, so
    the entry deliberately does not conform to the
    epilepsy_excitation_inhibition_imbalance module: doing so would assert a
    mechanism that has not been measured here.
  proposed_experiments:
  - experiment_id: exp_arv1_neuronal_excitability
    name: Excitation-inhibition measurement in ARV1-deficient neural models
    description: >-
      Use multi-electrode array or patch-clamp recordings in ARV1-null iPSC
      neuronal networks (and the neuronal Arv1 knockout mouse) to test whether a
      measurable excitation-inhibition imbalance underlies the seizures, and
      whether it tracks with loss of specific GPI-anchored synaptic/adhesion
      proteins.
  evidence:
  - reference: PMID:34017911
    reference_title: Migrating Focal Seizures and Myoclonic Status in ARV1-Related Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this severe syndrome can be assigned to the group of inherited GPI deficiency disorders, with which it shares remarkably similar clinical and neuroimaging features"
    explanation: >-
      The analogy-based reasoning that stands in for a demonstrated
      excitation-inhibition route, which is what this gap flags.
notes: >-
  Scope note on identity. MONDO:0014868 (developmental and epileptic
  encephalopathy, 38; OMIM 617020) is the ARV1-related autosomal recessive DEE.
  It is distinct from the ALG13-related X-linked DEE (a separate MONDO/OMIM
  entity), which the numbering can invite confusion with; every primary source
  cited here concerns ARV1.

  Deliberate non-conformances. This entry does not declare conformance to the
  epilepsy_excitation_inhibition_imbalance module (no E-I measurement exists in
  ARV1 deficiency; see gap_excitation_inhibition_route) nor to the
  congenital_disorder_of_glycosylation module, which models N-linked
  glycoprotein hypoglycosylation rather than the GPI-anchor lesion central to
  DEE38. DEE38 belongs mechanistically with the inherited GPI-deficiency
  disorders; adding it to the Disorders_of_GPI_Anchor_Biosynthesis grouping is a
  reasonable follow-up once reviewers agree on the membership call.

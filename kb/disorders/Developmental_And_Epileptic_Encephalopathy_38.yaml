name: Developmental And Epileptic Encephalopathy 38
creation_date: "2026-09-02T13:30:00Z"
description: >-
  DEE38 (EIEE38) is an autosomal recessive developmental and epileptic
  encephalopathy caused by biallelic loss-of-function variants in ARV1, a
  multi-pass endoplasmic-reticulum transmembrane protein. ARV1 was first
  characterized in yeast as a sterol/lipid homeostasis factor, but its
  disease-relevant human role is as a facilitating component of the GPI
  N-acetylglucosaminyltransferase (GPI-GnT) complex that initiates
  glycosylphosphatidylinositol (GPI) anchor biosynthesis; loss of ARV1
  therefore reduces cell-surface expression of GPI-anchored proteins, placing
  DEE38 among the inherited GPI-deficiency disorders. Affected infants present
  in the first months of life with early-onset refractory seizures (including
  epilepsy of infancy with migrating focal seizures), profound global
  developmental delay with regression, axial hypotonia, cortical visual
  impairment, and progressive cerebral and cerebellar atrophy. A missense
  allelic subset shows a somewhat milder, ataxia-and-elevated-AFP presentation,
  and dilated cardiomyopathy has been reported in a minority. There is no
  disease-modifying therapy; the untreated course is frequently lethal in
  childhood, usually from aspiration and respiratory infection.
category: Mendelian
parents:
- Genetic Developmental and Epileptic Encephalopathy
synonyms:
- DEE38
- EIEE38
- early infantile epileptic encephalopathy 38
- ARV1 early infantile epileptic encephalopathy
- ARV1 deficiency
- ARV1-related encephalopathy
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 38
  term:

    label: developmental and epileptic encephalopathy, 38
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    DEE38 is autosomal recessive: affected individuals carry biallelic ARV1
    variants (homozygous in consanguineous families, or compound heterozygous).
    Reported alleles include missense (p.Gly189Arg), in-frame deletions
    (p.Lys59_Asn98del, p.Leu185del), splice variants (c.294+1G>A, c.674-2A>T)
    and truncating/frameshift variants (p.Ser122Glnfs*7, p.Trp163*,
    p.Phe144Argfs*5).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32165008
    reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe seven patients from two unrelated families with biallelic splice mutations in ARV1."
    explanation: >-
      Documents biallelic causation across two unrelated families, consistent
      with recessive inheritance.
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained seven new patients from six unrelated families harboring biallelic variants in ARV1, including five novel variants."
    explanation: >-
      Independent confirmation of biallelic recessive causation and of allelic
      heterogeneity.
pathophysiology:
- name: Biallelic ARV1 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    ARV1 is a ubiquitously expressed ~271-residue multi-pass ER transmembrane
    protein with an N-terminal conserved ARV1 homology domain carrying a
    putative zinc-binding motif. Biallelic variants reduce or abolish functional
    ARV1: truncating and frameshift alleles trigger nonsense-mediated decay,
    splice variants reduce transcript and protein and delete conserved domains,
    and missense/in-frame-deletion alleles fail (or only partially rescue) the
    temperature-sensitive growth defect of arv1-null yeast. Neither the
    p.Lys59_Asn98del nor the previously reported p.Gly189Arg allele produced
    detectable protein in mammalian cells.
  genes:
  - preferred_term: ARV1
    term:
      id: hgnc:29561
      label: ARV1
  downstream:
  - target: Impaired GPI Anchor Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Loss of ARV1 removes a facilitating component of the GPI-GnT complex that
      initiates GPI-anchor assembly.
    evidence:
    - reference: PMID:40378954
      reference_title: ARV1 is a component of the enzyme initiating glycosylphosphatidylinositol biosynthesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ARV1 acts as a component of the enzyme initiating GPI biosynthesis, GPI N-acetylglucosaminyltransferase (GPI-GnT) complex"
      explanation: >-
        Establishes the direct biochemical link from ARV1 to the GPI-initiating
        enzyme whose activity is lost when ARV1 is lost.
  evidence:
  - reference: PMID:27270415
    reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to wild type human ARV1, neither variant expressed detectable levels of protein in mammalian cells."
    explanation: >-
      Directly demonstrates loss of ARV1 protein for the disease-associated
      variants, grounding the loss-of-function trigger.
  - reference: PMID:35227294
    reference_title: "Dilated cardiomyopathy is a part of the ARV1-associated phenotype: a case report."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The human ARV1 encodes a ubiquitously expressed 271-amino-acid protein containing the N-terminal ARV1 homology domain (AHD), which also includes a putative zinc-binding motif and the first of six predicted transmembrane domains"
    explanation: >-
      Source for the protein architecture (length, AHD, zinc-binding motif,
      transmembrane topology) described in this node.
- name: Impaired GPI Anchor Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    The disease-relevant consequence of ARV1 loss is impaired initiation of GPI
    anchor biosynthesis. ARV1 associates with PIGQ within the GPI-GnT complex
    and promotes efficient recruitment of the phosphatidylinositol substrate;
    an ARV1 mutant unable to associate with PIGQ loses the ability to enhance
    GPI-GnT activity. In a complementation assay the human p.Gly189Arg allele
    caused deficient maturation of the GPI-anchored protein Gas1 without
    affecting sphingolipid synthesis, isolating the GPI-anchoring defect as the
    mechanistically decisive lesion. Whether ARV1's ancestral sterol/sphingolipid
    trafficking role contributes independently to neuronal injury is unresolved
    (see gap_gpi_versus_lipid_driver).
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: phosphatidylinositol N-acetylglucosaminyltransferase activity
    term:
      id: GO:0017176
      label: phosphatidylinositol N-acetylglucosaminyltransferase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Cell-Surface GPI-Anchored Protein Expression
    causal_link_type: DIRECT
    description: >-
      Failure of GPI-anchor assembly reduces the amount of mature GPI available
      to anchor client proteins at the cell surface.
    evidence:
    - reference: PMID:32165008
      reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the loss of ARV1 protein, causing a significant decrease in membrane bound"
      explanation: >-
        Links the ARV1 defect to reduced membrane-bound GPI-anchored proteins,
        the next node.
  evidence:
  - reference: PMID:40378954
    reference_title: ARV1 is a component of the enzyme initiating glycosylphosphatidylinositol biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ARV1 associates with PIGQ, a GPI-GnT component, and ARV1 mutants defective in this association lose their ability to enhance GPI-GnT activity, showing that association with PIGQ is critical for ARV1's function."
    explanation: >-
      Establishes the molecular mechanism by which ARV1 supports GPI-GnT
      activity and how its loss impairs the pathway.
  - reference: PMID:32462292
    reference_title: A defect in GPI synthesis as a suggested mechanism for the role of ARV1 in intellectual disability and seizures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complementation tests in yeast showed that the ARV1 p.Gly189Arg mutation leads to deficient maturation of Gas1, a GPI-anchored protein, but does not affect sphingolipid synthesis"
    explanation: >-
      Isolates the GPI-anchoring defect from the sphingolipid role for a
      patient allele, supporting GPI biosynthesis as the decisive lesion.
- name: Reduced Cell-Surface GPI-Anchored Protein Expression
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Patient neutrophils and fibroblasts show significantly reduced surface
    expression of multiple GPI-anchored proteins (CD16 with ~5% residual
    expression, CD66b, CD55/CD59, and reduced FLAER binding in neutrophils;
    CD59 and CD87/uPAR in fibroblasts). This cellular readout is what assigns
    ARV1 deficiency to the inherited GPI-deficiency disorders and is corrected
    by lentiviral re-expression of wild-type ARV1, establishing it as the
    reversible core molecular defect.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Neuronal Dysfunction and Epileptic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of GPI-anchored signaling and adhesion proteins on developing
      neuronal membranes is the proposed route to the encephalopathy, by analogy
      to other inherited GPI-deficiency disorders that share the clinical and
      neuroimaging picture. The intervening steps are not demonstrated in human
      neural tissue.
    evidence:
    - reference: PMID:34017911
      reference_title: Migrating Focal Seizures and Myoclonic Status in ARV1-Related Encephalopathy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "this severe syndrome can be assigned to the group of inherited GPI deficiency disorders, with which it shares remarkably similar clinical and neuroimaging features"
      explanation: >-
        Classified INDIRECT: supports the analogy to inherited GPI-deficiency
        disorders as the basis for the neuronal consequence, without
        demonstrating the intervening neuronal steps.
  evidence:
  - reference: PMID:32165008
    reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The splice variants resulted in decreased ARV1 expression and significant decreases in GPI-anchored protein on the membranes of neutrophils and fibroblasts, indicating that the loss of ARV1 results in impaired GPI-anchor synthesis."
    explanation: >-
      Direct measurement of reduced surface GPI-anchored proteins in patient
      cells.
  - reference: PMID:34296759
    reference_title: "Epileptic encephalopathy caused by ARV1 deficiency: Refinement of the genotype-phenotype spectrum and functional impact on GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flow cytometric analysis on patient fibroblasts showed a decrease in GPI-anchored proteins on the cell surface, supporting a lower residual activity of the mutant ARV1 as compared to the wildtype. A rescue assay through the transduction of lentivirus expressing wild type ARV1 cDNA effectively rescued these alterations."
    explanation: >-
      Independent confirmation of the surface deficit and its correction by
      wild-type ARV1, establishing reversibility of the core defect.
- name: Neuronal Dysfunction and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is an early-infantile developmental and epileptic
    encephalopathy with drug-refractory seizures, profound developmental delay
    with regression, and progressive cerebral and cerebellar atrophy. A neuronal
    conditional knockout of Arv1 in mice recapitulates the seizure phenotype and
    a severe adult survival defect, supporting a neuron-autonomous requirement
    for ARV1. This entry does not declare conformance to the
    epilepsy_excitation_inhibition_imbalance module: no excitation-inhibition
    measurement exists in ARV1 deficiency and asserting that mechanism would
    substitute a plausible route for an evidenced one (see
    gap_excitation_inhibition_route).
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:27270415
    reference_title: Neuronal deficiency of ARV1 causes an autosomal recessive epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with a neuronal deletion of Arv1 recapitulated the human phenotype, exhibiting seizures and a severe survival defect in adulthood."
    explanation: >-
      Demonstrates that neuron-specific loss of Arv1 is sufficient for the
      seizure phenotype, supporting neuronal dysfunction as the disease endpoint.
  - reference: PMID:32165008
    reference_title: Homozygous splice-variants in human ARV1 cause GPI-anchor synthesis deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients presented with early onset epilepsy, global developmental delays, profound hypotonia, delayed speech development, cortical visual impairment, and severe generalized cerebral and cerebellar atrophy."
    explanation: >-
      Characterizes the clinical endpoint syndrome across a multi-patient
      series.

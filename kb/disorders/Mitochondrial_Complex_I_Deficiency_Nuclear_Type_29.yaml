name: Mitochondrial Complex I Deficiency, Nuclear Type 29
creation_date: "2026-11-27T14:32:39Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 29 (MC1DN29) is the autosomal
  recessive complex I deficiency caused by biallelic variants in TMEM126B, an
  inner mitochondrial membrane protein of the mitochondrial complex I
  intermediate assembly (MCIA) complex, which builds the ND2 module of the
  membrane arm. Without functional TMEM126B the matrix arm is made but cannot be
  joined to the membrane arm, assembled complex I falls, and muscle shows an
  isolated complex I deficiency with mitochondrial proliferation. The usual
  presentation is a pure mitochondrial myopathy beginning in childhood or
  adolescence: exercise intolerance, exercise-induced myalgia, nausea and raised
  lactate, sometimes progressing to proximal leg weakness. Other presentations
  are an infantile multisystem disease with hypertrophic cardiomyopathy, renal
  tubular acidosis and chronic renal failure, a Leigh-like syndrome with
  brainstem lesions, and adult kidney failure from tubulointerstitial nephritis.
  Two recurrent alleles, p.Gly212Val and c.401delA, are founder mutations in
  European families.
category: Mendelian
parents:
- Mitochondrial Complex I Deficiency
synonyms:
- MC1DN29
- TMEM126B-related complex I deficiency

discussions:
- discussion_id: mc1dn29_tissue_specific_expression_of_defect
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does TMEM126B deficiency usually spare everything but skeletal muscle, and
    what makes a minority of patients develop kidney, heart or brainstem disease?
  attaches_to:
  - "pathophysiology#Isolated Complex I Deficiency"
  - "pathophysiology#Renal Tubulointerstitial Injury"
  rationale: >-
    Fibroblasts of a p.Gly212Val homozygote assemble complex I normally while his
    muscle does not, so the defect is tissue-dependent, and most patients have a
    pure myopathy with normal development. Yet one infant had renal failure and
    cardiomyopathy, one child a Leigh-like syndrome and several adults kidney
    disease. Genotype does not obviously explain the difference: p.Gly212Val
    occurs in both the myopathic and the renal patients.
  proposed_experiments:
  - experiment_id: exp_mc1dn29_tissue_panel
    name: Compare complex I assembly across tissues and genotypes
    description: >-
      Measure assembled complex I and MCIA complex stability in muscle,
      fibroblasts and kidney-derived cells from patients with myopathic and renal
      presentations, to find what sets the tissue threshold for TMEM126B loss.
notes: >-
  No GeneReviews chapter covers this disorder. Phenotypes come from the two 2016
  cohorts (PMID:27374774, full text cached; PMID:27374773, abstract only), the
  Leigh-like case (PMID:36482121) and the 2025 kidney reports (PMID:40970474,
  PMID:41278337).

  The synonym TMEM126B-related complex I deficiency is the term used in the 2025
  kidney failure report.

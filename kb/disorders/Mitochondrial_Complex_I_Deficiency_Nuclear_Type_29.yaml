  description: >-
    Patients are homozygous for p.Gly212Val or compound heterozygous, and the
    variants segregated with disease where relatives were tested; in the adult
    with kidney failure the two variants were shown to be in trans.
  evidence:
  - reference: PMID:27374774
    reference_title: "Biallelic Mutations in TMEM126B Cause Severe Complex I Deficiency with a Variable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Where familial samples were available from parents and unaffected siblings,
      these variants were found to segregate with a clinically affected status.
    explanation: >-
      Recessive segregation in the 2016 cohort.
  - reference: PMID:27374773
    reference_title: "Mutations in Complex I Assembly Factor TMEM126B Result in Muscle Weakness and Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing and targeted exome sequencing revealed compound-heterozygous
      mutations in TMEM126B, encoding a complex I assembly factor.
    explanation: >-
      Compound heterozygosity in a second, independent cohort.
pathophysiology:
- name: Biallelic TMEM126B Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The alleles are the missense p.Gly212Val, in a predicted transmembrane helix,
    and truncating or splice-site variants (c.401delA, c.241del, c.82-2A>G,
    c.290dupT). TMEM126B is not a subunit of mature complex I but an assembly
    factor of the MCIA complex, described as anchoring assembly intermediates in
    the inner membrane; that membrane-anchoring role is the molecular function
    bound here. Its precise biochemical activity has not been defined.
    Complementation with wild-type TMEM126B restores complex I in patient cells.
  genes:
  - preferred_term: TMEM126B
    term:
      id: hgnc:30883
      label: TMEM126B
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function; homozygous p.Gly212Val fibroblasts can assemble complex I
      normally while muscle cannot, so that allele is hypomorphic in a
      tissue-dependent way.
  molecular_functions:
  - preferred_term: TMEM126B anchoring of complex I assembly intermediates to the inner membrane
    modifier: DECREASED
    term:
      id: GO:0043495
      label: protein-membrane adaptor activity
  evidence:
  - reference: PMID:40970474
    reference_title: "Biallelic TMEM126B Variants as a Novel Cause of Kidney Failure-Implications for Mitochondrial Genetic Testing in Nephrology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      TMEM126B (OMIM 615533) encodes an inner mitochondrial membrane protein,
      anchoring assembly intermediates for complex I biogenesis
    explanation: >-
      The membrane-anchoring role on which the molecular function binding rests.
  - reference: PMID:27374773
    reference_title: "Mutations in Complex I Assembly Factor TMEM126B Result in Muscle Weakness and Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lentiviral complementation with the wild-type cDNA restored the complex I
      deficiency, demonstrating the pathogenic nature of these mutations.
    explanation: >-
      Complementation establishing causality.
  - reference: PMID:27374774
    reference_title: "Biallelic Mutations in TMEM126B Cause Severe Complex I Deficiency with a Variable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, these data support common ancestors and the c.401delA
      (p.Asn134Ilefs∗2) and c.635G>T (p.Gly212Val) variants as founder mutations.
    explanation: >-
      The two recurrent founder alleles.
  - reference: PMID:36482121
    reference_title: "Novel biallelic mutations in TMEM126B cause splicing defects and lead to Leigh-like syndrome with severe complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified a novel intronic mutation (c.82-2 A > G) and a novel
      exonic insertion mutation (c.290dupT) in TMEM126B from a Chinese patient with
      clinical manifestations of LLS
    explanation: >-
      Splice-altering alleles in a further patient.
  downstream:
  - target: MCIA Complex Failure and Stalled Membrane-Arm Assembly
    causal_link_type: DIRECT
- name: MCIA Complex Failure and Stalled Membrane-Arm Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    TMEM126B co-migrates with the assembly factors NDUFAF1 (CIA30), ECSIT and
    ACAD9 in the MCIA complex, which is required to build the ND2 module of the
    membrane arm; each MCIA component is needed for complex I assembly. In
    patient fibroblasts, subcomplexes containing the matrix-arm subunit NDUFS3
    accumulate because the matrix module cannot be added to the membrane arm, and
    complexome analysis places the block in assembly of the membrane module.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  evidence:
  - reference: PMID:22982022
    reference_title: "Complexome profiling identifies TMEM126B as a component of the mitochondrial complex I assembly complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TMEM126B was found to comigrate with known assembly factors of mitochondrial
      complex I, namely CIA30, Ecsit, and Acad9.
    explanation: >-
      Identification of TMEM126B as an MCIA component.
  - reference: PMID:22982022
    reference_title: "Complexome profiling identifies TMEM126B as a component of the mitochondrial complex I assembly complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we demonstrate that TMEM126B is required for assembly of
      complex I.
    explanation: >-
      TMEM126B is needed for assembly.
  - reference: PMID:32320651
    reference_title: "Dissecting the Roles of Mitochondrial Complex I Intermediate Assembly Complex Factors in the Biogenesis of Complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mitochondrial complex I intermediate assembly (MCIA) complex, containing
      assembly factors NDUFAF1, ECSIT, ACAD9, and TMEM126B, is required for
      building the intermediate ND2-module.
    explanation: >-
      The assembly step the MCIA complex serves.
  - reference: PMID:27374774
    reference_title: "Biallelic Mutations in TMEM126B Cause Severe Complex I Deficiency with a Variable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The accumulation of subcomplexes containing NDUFS3 in subjects 2 and 3
      indicates that the matrix module containing NDUFS3 is made but is unable to
      be added to the membrane arm.
    explanation: >-
      The assembly block in patient fibroblasts.
  - reference: PMID:27374773
    reference_title: "Mutations in Complex I Assembly Factor TMEM126B Result in Muscle Weakness and Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further complexome analysis of one subject indicated that the complex I
      assembly defect occurred during assembly of its membrane module.
    explanation: >-
      Membrane-module assembly defect in another patient.
  downstream:

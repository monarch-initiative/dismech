genetic:
- name: TMEM126B
  gene_term:
    preferred_term: TMEM126B
    term:
      id: hgnc:30883
      label: TMEM126B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    TMEM126B is at 11q14.1. ClinGen classifies TMEM126B as Definitive for
    mitochondrial disease (MONDO:0044970, autosomal recessive); that record is for
    a lumped term and is not copied into gene_disease_validity. CAUSATIVE rests on
    more than ten patients from independent families in several countries, with
    segregation and complementation.

    Alleles: p.Gly212Val (homozygous, or in trans with a truncating allele) and
    c.401delA (p.Asn134Ilefs*2) are founder alleles shared by Belgian, Polish and
    American families; c.241del (p.Thr81Glnfs*24) was found with p.Gly212Val in
    the adult with kidney failure, and c.82-2A>G with c.290dupT, both causing exon
    skipping, in the Chinese child with a Leigh-like syndrome. Not to be confused
    with TMEM126A, the gene of recessive optic atrophy OPA7.
  evidence:
  - reference: PMID:27374774
    reference_title: "Biallelic Mutations in TMEM126B Cause Severe Complex I Deficiency with a Variable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the clinical, biochemical, and molecular findings in six
      cases of mitochondrial disease from four unrelated families affected by
      biallelic
    explanation: >-
      Four families in the first cohort.
  - reference: PMID:27374773
    reference_title: "Mutations in Complex I Assembly Factor TMEM126B Result in Muscle Weakness and Isolated Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing and targeted exome sequencing revealed compound-heterozygous
      mutations in TMEM126B, encoding a complex I assembly factor.
    explanation: >-
      An independent cohort published at the same time.
  - reference: PMID:41278337
    reference_title: "Diagnostic Yield of Whole-Genome Sequencing in Patients With Kidney Failure of Undetermined Etiology at Age 50 Years or Younger."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND

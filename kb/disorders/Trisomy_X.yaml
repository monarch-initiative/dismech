genetic:
- name: 47,XXX karyotype (extra X chromosome)
  association: Causal
  notes: An additional X chromosome in a female (copy-number gain), most often from meiotic nondisjunction,
    with postzygotic nondisjunction in ~20% of cases; mosaic 46,XX/47,XXX also occurs. Risk rises with
    maternal age. No coordinate slot exists in the schema; the whole-chromosome gain is recorded here
    in prose.
  evidence:
  - reference: PMID:20459843
    reference_title: A review of trisomy X (47,XXX).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Trisomy X most commonly occurs as a result of nondisjunction during meiosis
    explanation: Identifies the causal extra X and its meiotic-nondisjunction origin.
diagnosis:
- name: Peripheral Blood Karyotype Analysis
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  description: Standard postnatal cytogenetic karyotype analysis of peripheral blood lymphocytes to detect
    a non-mosaic 47,XXX or mosaic 46,XX/47,XXX chromosomal complement.
  presence: 47,XXX
  results: Demonstration of three X chromosomes (47,XXX) or sex-chromosome mosaicism confirms the diagnosis.
  notes: Confirmed by karyotype. Often identified prenatally; postnatal indications include developmental
    delay/hypotonia, learning disabilities, behavioral difficulties, or premature ovarian failure.
  evidence:
  - reference: PMID:20459843
    reference_title: A review of trisomy X (47,XXX).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Differential diagnosis prior to definitive karyotype results includes fragile X, tetrasomy
      X, pentasomy X, and Turner syndrome mosaicism.
    explanation: Establishes karyotype analysis as the definitive diagnostic test for trisomy X.
  - reference: PMID:24502039
    reference_title: 'Genotype- phenotype correlation in trisomy X: a retrospective study of a selected
      group of 36 patients and review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We analyzed retrospectively the genotype - phenotype correlations for a selected group of
      36 patients diagnosed with trisomy X (homogeneous or mosaic) by cytogenetic methods (X chromatin
      and karyotype).
    explanation: Confirms cytogenetic (karyotype) diagnosis of homogeneous or mosaic trisomy X.
- name: Prenatal Cytogenetic Testing (Amniocentesis or Chorionic Villus Sampling)
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  description: Prenatal cytogenetic testing performed via amniocentesis or chorionic villus sampling,
    frequently prompted by advanced maternal age or prenatal screening.
  presence: 47,XXX in fetal amniocytes or chorionic villi
  results: Identification of a fetal 47,XXX karyotype enables early developmental surveillance and counseling.
  evidence:
  - reference: PMID:20459843
    reference_title: A review of trisomy X (47,XXX).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis during the prenatal period by amniocentesis or chorionic villi sampling is common.
    explanation: Supports prenatal cytogenetic diagnosis by amniocentesis or chorionic villus sampling.

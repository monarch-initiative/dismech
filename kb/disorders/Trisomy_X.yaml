genetic:
- name: 47,XXX karyotype (extra X chromosome)
  association: Causal
  notes: >-
    An additional X chromosome in a female (copy-number gain), most often from
    meiotic nondisjunction, with postzygotic nondisjunction in ~20% of cases;
    mosaic 46,XX/47,XXX also occurs. Risk rises with maternal age. No coordinate
    slot exists in the schema; the whole-chromosome gain is recorded here in prose.
  evidence:
  - reference: PMID:20459843
    reference_title: "A review of trisomy X (47,XXX)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trisomy X most commonly occurs as a result of nondisjunction during meiosis"
    explanation: Identifies the causal extra X and its meiotic-nondisjunction origin.
diagnosis:
- name: Karyotype Analysis
  presence: 47,XXX
  notes: >-
    Confirmed by karyotype. Often identified prenatally; postnatal indications
    include developmental delay/hypotonia, learning disabilities, behavioral
    difficulties, or premature ovarian failure.
  evidence:
  - reference: PMID:24502039
    reference_title: "Genotype- phenotype correlation in trisomy X: a retrospective study of a selected group of 36 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed retrospectively the genotype - phenotype correlations for a selected group of 36 patients diagnosed with trisomy X (homogeneous or mosaic) by cytogenetic methods (X chromatin and karyotype)."
    explanation: Confirms cytogenetic (karyotype) diagnosis of trisomy X.

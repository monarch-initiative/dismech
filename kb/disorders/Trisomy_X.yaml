pathophysiology:
- name: Additional X Chromosome (47,XXX)
  biological_scale: MOLECULAR
  description: >-
    Presence of an extra X chromosome in a female, most commonly from meiotic
    nondisjunction (postzygotic nondisjunction in ~20% of cases); risk rises with
    advanced maternal age.
  evidence:
  - reference: PMID:20459843
    reference_title: "A review of trisomy X (47,XXX)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trisomy X most commonly occurs as a result of nondisjunction during meiosis"
    explanation: Identifies meiotic nondisjunction as the usual origin of the extra X.
  downstream:
  - target: X-Inactivation Escape / Gene Dosage Imbalance
    causal_link_type: DIRECT
    description: The extra X increases dosage of genes that escape X-inactivation.
- name: X-Inactivation Escape / Gene Dosage Imbalance
  biological_scale: MOLECULAR
  description: >-
    Although the extra X is largely inactivated, genes that escape X-inactivation
    are present in three doses. The trisomy X phenotype is hypothesized to result
    from overexpression of these escape genes, though genotype-phenotype
    relationships remain undefined. This is the female counterpart of the X-dosage
    mechanism in Klinefelter syndrome (47,XXY).
  evidence:
  - reference: PMID:20459843
    reference_title: "A review of trisomy X (47,XXX)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype in trisomy X is hypothesized to result from overexpression of genes that escape X-inactivation"
    explanation: States the escape-gene overexpression hypothesis for the phenotype.
  downstream:
  - target: Neurodevelopmental Vulnerability
    causal_link_type: DIRECT
  - target: Premature Ovarian Insufficiency
    causal_link_type: DIRECT
- name: Neurodevelopmental Vulnerability
  biological_scale: ORGANISM
  description: >-
    Higher rates of motor and speech delay, cognitive deficits and learning
    disabilities, and psychological difficulties (attention deficits, anxiety,
    depression) than in the general population.
  evidence:
  - reference: PMID:20459843
    reference_title: "A review of trisomy X (47,XXX)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with trisomy X have higher rates of motor and speech delays, with an increased risk of cognitive deficits and learning disabilities in the school-age years."
    explanation: Documents the neurodevelopmental profile of trisomy X.
  downstream:
  - target: Delayed Speech and Language Development
    causal_link_type: DIRECT
  - target: Learning Disability
    causal_link_type: DIRECT
- name: Premature Ovarian Insufficiency
  biological_scale: ORGANISM
  description: Ovarian dysgenesis/insufficiency can manifest post-pubertally as secondary amenorrhea or early menopause.
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  evidence:
  - reference: PMID:24502039
    reference_title: "Genotype- phenotype correlation in trisomy X: a retrospective study of a selected group of 36 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "growth retardation associated with dysmorphic facial (upslanted palpebral fissure, epichantus, thin lips) and postpubertal, signs of ovarian dysgenesis"
    explanation: Documents post-pubertal signs of ovarian dysgenesis in trisomy X.

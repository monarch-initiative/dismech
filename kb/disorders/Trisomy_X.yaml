name: Trisomy X
creation_date: '2026-08-22T00:00:00Z'
description: Trisomy X (47,XXX; triple X syndrome) is a sex-chromosome aneuploidy caused by an extra X
  chromosome in females, most often from meiotic nondisjunction. It is the most common female chromosomal
  abnormality (~1 in 1,000 female births) but is under-diagnosed, as many affected females are mildly
  affected or asymptomatic. The phenotype — hypothesized to result from overexpression of genes that escape
  X-inactivation — is variable and commonly includes tall stature, epicanthal folds, hypotonia, and clinodactyly,
  with higher rates of motor and speech delay, learning disabilities, and psychological/behavioral difficulties.
  Seizures, renal and genitourinary anomalies, and premature ovarian insufficiency can also occur.
category: Genetic
synonyms:
- 47,XXX
- triple X syndrome
- triplo-X syndrome
- XXX syndrome

pathophysiology:
- name: Cauda equina nerve root compression
  description: >-
    A space-occupying lesion within the lumbar spinal canal compresses the lumbosacral roots. A large lumbar disc herniation is the commonest cause; other causes include stenosis, tumor, hematoma, trauma, infection and iatrogenic lesions.

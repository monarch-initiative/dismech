name: Cauda Equina Syndrome
creation_date: "2026-07-10T00:00:00Z"
description: >-
  Cauda equina syndrome is a neurosurgical emergency caused by compression of
  the lumbosacral nerve roots of the cauda equina below the conus medullaris.
  Compression, most often from a large central lumbar disc herniation, produces
  a characteristic constellation of low back pain, bilateral sciatica, saddle
  (perineal) sensory loss, bladder and bowel dysfunction, sexual dysfunction,
  and lower-limb motor and reflex deficits. Because sustained compression causes
  irreversible nerve root injury, urgent surgical decompression is required to
  preserve neurological function.
category: Complex
disease_term:
  preferred_term: cauda equina syndrome
  term:
    id: MONDO:0005693
    label: cauda equina syndrome
parents:

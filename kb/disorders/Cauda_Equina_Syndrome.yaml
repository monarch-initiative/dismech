    term:
      id: GO:0002931
      label: response to ischemia
  evidence:
  - reference: PMID:3188319
    reference_title: Urodynamic evaluation of patients with spinal stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compression of the spinal cord or nerve roots may lead to structural
      neuronal damage, neuronal ischemia or edema, and axonal transport block.
    explanation: Supports the ischemic/edematous injury mechanism at the nerve roots produced by compression.
  downstream:
  - target: Lumbosacral polyradiculopathy
    description: >-
      Ischemic and demyelinating injury to multiple lumbosacral nerve roots
      produces a lower motor neuron polyradiculopathy affecting sensory, motor,
      and autonomic fibers.
- name: Lumbosacral polyradiculopathy
  description: >-
    Injury to the sensory, motor, and autonomic fibers of multiple lumbosacral
    nerve roots produces the clinical syndrome: saddle anesthesia, bladder and
    bowel dysfunction, sexual dysfunction, lower-limb weakness, and reduced or
    absent lower-limb reflexes.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cauda equina
    term:
      id: UBERON:0012337

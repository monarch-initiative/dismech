name: Cauda Equina Syndrome
creation_date: "2026-07-10T00:00:00Z"
description: >-
  Cauda equina syndrome is a clinical syndrome of sacral nerve-root dysfunction, typically involving bladder or bowel function, saddle sensation or sexual function. Back or leg pain and lower-limb weakness may accompany it but are not required. This entry focuses on compressive CES, most commonly caused by a large lumbar disc herniation. Suspected compression requires urgent imaging and specialist assessment; confirmed compressive CES is treated by decompression. Recovery is variable, and established urinary retention does not imply that further treatment is futile. Noncompressive presentations require assessment for other neurological, urological and functional causes.
category: Complex

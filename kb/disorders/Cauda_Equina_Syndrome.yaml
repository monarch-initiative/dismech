  evidence:
  - reference: PMID:23230403
    reference_title: Does patient history and physical examination predict MRI proven cauda equina syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms included back/low back pain, bilateral sciatica, bladder
      retention, bladder incontinence, frequent urination, decreased urinary
      sensation, and bowel incontinence; signs included saddle numbness and
      reduced anal tone.
    explanation: Enumerates the multi-root sensory, motor, and autonomic clinical features of the lumbosacral polyradiculopathy.
  downstream:
  - target: Urinary retention
    description: >-
      Compression of the sacral parasympathetic autonomic fibers disrupts
      detrusor function, causing urinary retention with overflow incontinence.
  - target: Saddle anesthesia
    description: >-
      Involvement of the sacral sensory roots produces perineal and perianal
      ("saddle") sensory loss.

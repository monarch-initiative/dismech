  - classification_value: NEUROLOGIC
has_subtypes:
- name: CESI
  display_name: Incomplete cauda equina syndrome (CESI)
  description: >-
    Incomplete CES: altered urinary sensation or difficulty voiding with
    retained executive bladder control. CESI is the earlier, less severe pole of
    the most commonly used two-stage classification and carries a more favorable
    prognosis than CESR. In Todd's operational definition (Todd NV, An algorithm
    for suspected cauda equina syndrome, Ann R Coll Surg Engl 2009;91:358-9,
    PMID:19416598), CESI is present when there is subjective and/or objective
    neurological loss - impaired bladder, urethral, or rectal sensation, and/or
    objective genital/peri-anal (S3-S5) sensory disturbance and/or reduced anal
    tone - provided the bladder is still functioning normally.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two-stage system of incomplete CES (CESI) versus CES with retention
      (CESR) is the most commonly used classification, and has prognostic value
    explanation: Defines CESI as the incomplete pole of the standard prognostic two-stage CES classification.
- name: CESR
  display_name: Cauda equina syndrome with retention (CESR)
  description: >-
    CES with retention: painless urinary retention with overflow incontinence
    and loss of executive bladder control. CESR is the more severe pole of the
    two-stage classification and is associated with a worse prognosis, often
    described as the "point of no return." Todd (PMID:19416598) frames the
    transition to complete CES as the point at which the bladder becomes
    paralysed, producing painless retention of urine with overflow incontinence;
    he argues CESI should be decompressed urgently before this transition
    because outcomes at CESI are generally favourable whereas outcomes after
    bladder paralysis are less favourable.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two-stage system of incomplete CES (CESI) versus CES with retention
      (CESR) is the most commonly used classification, and has prognostic value
    explanation: Defines CESR as the retention pole of the standard prognostic two-stage CES classification.
pathophysiology:
- name: Cauda equina nerve root compression
  description: >-
    Space-occupying compression within the lumbar spinal canal mechanically
    compresses the lumbosacral nerve roots of the cauda equina. The most common
    cause is a large central (midline) lumbar intervertebral disc herniation;
    other causes include tumor, epidural abscess, epidural hematoma, trauma or
    fracture, and severe lumbar spinal stenosis.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cauda equina
    term:
      id: UBERON:0012337
      label: cauda equina
  - preferred_term: vertebral canal
    term:
      id: UBERON:0006692
      label: vertebral canal
  evidence:
  - reference: PMID:32059184
    reference_title: What is the incidence of cauda equina syndrome? A systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cauda equina syndrome (CES) is a surgical emergency requiring timely
      operative intervention to prevent symptom progression.
    explanation: Establishes CES as a surgical emergency driven by compression requiring timely decompression.
  - reference: PMID:34581849
    reference_title: "Outcomes of cauda equina syndrome due to lumbar disc herniation after surgical management and the factors affecting it: a systematic review and meta-analysis of 22 studies with 852 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Outcomes of cauda equina syndrome due to lumbar disc herniation
    explanation: Supports lumbar disc herniation as a recognized (and the most commonly studied surgical) cause of the compressive syndrome.
  downstream:
  - target: Nerve root ischemia and demyelination
    description: >-
      Mechanical compression of the nerve roots reduces microvascular perfusion
      and venous outflow, producing nerve root ischemia and demyelination.
    evidence:
    - reference: PMID:3188319
      reference_title: Urodynamic evaluation of patients with spinal stenosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Compression of the spinal cord or nerve roots may lead to structural
        neuronal damage, neuronal ischemia or edema, and axonal transport block.
      explanation: Directly links nerve root compression to ischemia, edema, and axonal transport block.
- name: Nerve root ischemia and demyelination
  description: >-
    Compression of the cauda equina nerve roots impairs their microcirculation
    and axoplasmic transport, causing intraneural edema, ischemia, and
    demyelination. Sustained compression leads to axonal injury and irreversible
    nerve root damage, which is why timely decompression is critical.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

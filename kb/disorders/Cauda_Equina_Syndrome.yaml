differential_diagnoses:
- name: Conus medullaris syndrome
  description: >-
    Conus lesions affect the terminal spinal cord and adjacent roots, producing overlapping sacral symptoms and potentially mixed upper- and lower-motor-neuron signs. Motor and sensory deficits are often symmetric. MRI localizes the lesion; examination alone may not separate conus and cauda equina syndromes.
  distinguishing_features:
  - Lesion involving the terminal spinal cord rather than only roots below it.
  - Mixed upper- and lower-motor-neuron signs may be present.
  - MRI is needed to establish the anatomic level; clinical features overlap.
  evidence:
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conus medullaris syndrome results from damage at the T12-L2 level, while
      cauda equina syndrome arises from nerve root compression below the conus
    explanation: Establishes the anatomic-level distinction that separates conus medullaris syndrome from CES.
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologies affecting the conus medullaris and cauda equina can present
      with overlapping clinical symptoms, making an accurate diagnosis essential
    explanation: Supports the clinical overlap that makes conus medullaris syndrome the principal differential of CES.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10943478/
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinical examination alone may not be sufficient to label a compressive spinal lesion as CMS or CES, and MRI imaging is usually needed to identify the correct level for appropriate diagnosis.
    explanation: >-
      Avoids treating symmetry or sphincter timing as an absolute discriminator.
- name: Guillain-Barre syndrome
  disease_term:
    preferred_term: Guillain-Barre syndrome
    term:
      id: MONDO:0016218
      label: Guillain-Barre syndrome
  description: >-
    An acute autoimmune polyradiculoneuropathy can mimic compressive CES with weakness, reduced reflexes and sensory or autonomic involvement. Symmetric ascending weakness and root enhancement without a compressive lesion favor GBS. Acute inflammatory demyelinating polyradiculoneuropathy is a common GBS subtype, not a synonym for every GBS case.
  distinguishing_features:
  - Autoimmune polyradiculoneuropathy without a concordant compressive lesion.
  - Typically symmetric ascending weakness with hyporeflexia.
  - Root thickening and enhancement can occur; imaging is interpreted with the clinical course.
  evidence:
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Guillain-Barré syndrome, neurosarcoidosis, and MOGAD may cause nerve root
      thickening and enhancement
    explanation: Identifies Guillain-Barre syndrome as an inflammatory cauda equina mimic producing nerve-root enhancement without compression.
- name: Scan-negative suspected CES and noncompressive radiculopathy
  description: >-
    Many patients investigated for CES have no concordant cauda equina compression on MRI. This finding prompts assessment for other neurological, urological, pain-related or functional explanations; the absence of a single bedside sign does not establish a benign cause.
  distinguishing_features:
  - No concordant cauda equina compression on appropriately reviewed MRI.
  - Clinical symptoms overlap; absent saddle sensory loss or retention alone cannot exclude compressive CES before imaging.
  evidence:
  - reference: PMID:23230403
    reference_title: Does patient history and physical examination predict MRI proven cauda equina syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      many MRI scans obtained from patients presenting with signs and/or
      symptoms of CES do not reveal concordant pathology
    explanation: >-
      Many suspected presentations have negative imaging. The quote does not identify their individual causes or justify attributing urinary symptoms to pain without evaluation.
treatments:
- name: Emergency surgical decompression
  description: >-
    Surgical decompression is the main treatment for MRI-confirmed compressive CES. WFNS consensus recommends surgery within 48 hours, preferably within 24 hours. Historical pooled studies associate earlier surgery with better outcomes, but a prospective UK cohort found no adjusted association between symptom-to-surgery time and bladder or disability outcomes. Most patients in that cohort underwent prompt surgery after referral, so it cannot establish that delaying treatment is safe. Retention at presentation does not preclude postoperative improvement.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cauda equina nerve root compression
    treatment_effect: INHIBITS
    description: Surgical decompression removes the compressive lesion, relieving pressure on the cauda equina nerve roots.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10943478/
      reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations - PMC"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The goal of surgery is decompression of the neural structures.
      explanation: >-
        Directly supports the intervention acting on mechanical root compression rather than merely an association with surgical timing.
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant advantage to treating patients within 48 hours
      versus more than 48 hours after the onset of cauda equina syndrome.
    explanation: Supports the timing benefit of surgical decompression in CES.
  - reference: PMID:34581849
    reference_title: "Outcomes of cauda equina syndrome due to lumbar disc herniation after surgical management and the factors affecting it: a systematic review and meta-analysis of 22 studies with 852 cases."
    supports: SUPPORT

  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cauda equina syndrome (CES) is a rare but important condition whose commonest cause is massive lumbar disc herniation compressing the roots of the cauda equina in the lower lumbar spinal canal
    explanation: >-
      The full classification review explicitly identifies the common compressive lesion.
  - reference: PMID:36426378
    reference_title: "Presentation, management, and outcomes of cauda equina syndrome up to one year after surgery, using clinician and participant reporting: A multi-centre prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      All included participants had significant cauda equina compression with at least 50% canal stenosis due to degenerative disc disease on review by local investigators.
    explanation: >-
      Documents the compressive lesion in the prospective cohort; the inclusion threshold is not a universal diagnostic cutoff.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10943478/
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      other etiologies include trauma, neoplasia, infection, vascular pathology, hematoma, and iatrogenic
    explanation: >-
      The WFNS review describes etiologies beyond degenerative disc compression. These causes do not imply a single treatment for all noncompressive root disorders.
  downstream:
  - target: Nerve root microvascular compromise
    causal_link_type: DIRECT
    description: >-
      Compression produces this response in experimental nerve-root models; application to human CES is provisional.
    evidence:
    - reference: PMID:2795321
      reference_title: Effects of experimental graded compression on blood flow in spinal nerve roots. A vital microscopic study on the porcine cauda equina.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: >-
        The study showed that the average minimum pressure in the inflated balloon required to stop the flow in the arterioles was 127 mm Hg (SD = 18, n = 11), in the capillaries 40 mm Hg (SD = 6, n = 12), and in the venules 30 mm Hg (SD = 10, n = 12).
      explanation: >-
        The pig model directly demonstrates pressure-dependent interruption of root microcirculation. These experimental thresholds are not established human CES thresholds.
  - target: Intraneural edema
    causal_link_type: DIRECT
    description: >-
      Compression produces this response in experimental nerve-root models; application to human CES is provisional.
    evidence:
    - reference: PMID:2546258
      reference_title: "Edema formation in spinal nerve roots induced by experimental, graded compression. An experimental study on the pig cauda equina with special reference to differences in effects between rapid and slow onset of compression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: >-
        Edema formation in spinal nerve roots of the pig cauda equina was studied following experimental compression at various pressure levels, durations, and rates of onset, using a fluorescence microscopic technique.
      explanation: >-
        Direct observation in a porcine compression model supports intraneural edema as a candidate contributor in human compressive CES.
  - target: Nerve root conduction impairment
    causal_link_type: DIRECT
    description: >-
      Compression produces this response in experimental nerve-root models; application to human CES is provisional.
    evidence:
    - reference: PMID:2052989
      reference_title: "Effects of acute, graded compression on spinal nerve root function and structure. An experimental study of the pig cauda equina."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: >-
        At an acute pressure threshold of 50-75 mm Hg, changes in both afferent and efferent conduction are induced.
      explanation: >-
        Porcine electrophysiology establishes compression-related conduction changes; the pressure threshold should not be applied to patients.

differential_diagnoses:
- name: Conus medullaris syndrome
  description: >-
    Injury to the conus medullaris (spinal cord termination, ~T12-L2) rather
    than the nerve roots below it. It overlaps clinically with CES but tends to
    produce earlier, more symmetric bladder and bowel dysfunction and mixed
    upper- and lower-motor-neuron signs, whereas CES is a pure lower-motor-neuron
    root syndrome that is often asymmetric.
  distinguishing_features:
  - Lesion at the T12-L2 conus level rather than nerve-root compression below the conus.
  - Mixed upper- and lower-motor-neuron signs, versus the pure lower-motor-neuron pattern of CES.
  - Earlier and more symmetric bladder/bowel involvement than typical CES.
  evidence:
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conus medullaris syndrome results from damage at the T12-L2 level, while
      cauda equina syndrome arises from nerve root compression below the conus
    explanation: Establishes the anatomic-level distinction that separates conus medullaris syndrome from CES.
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologies affecting the conus medullaris and cauda equina can present
      with overlapping clinical symptoms, making an accurate diagnosis essential
    explanation: Supports the clinical overlap that makes conus medullaris syndrome the principal differential of CES.
- name: Guillain-Barre syndrome
  disease_term:
    preferred_term: Guillain-Barre syndrome
    term:
      id: MONDO:0016218
      label: Guillain-Barre syndrome
  description: >-
    Acute inflammatory demyelinating polyradiculoneuropathy that can mimic CES
    with ascending weakness, areflexia, and nerve-root involvement, but arises
    from autoimmune inflammation rather than a compressive lesion; MRI shows
    nerve-root thickening and enhancement rather than a compressive mass.
  distinguishing_features:
  - Autoimmune polyradiculoneuropathy without a compressive lesion on MRI.
  - Nerve-root thickening and enhancement rather than mechanical compression.
  - Typically ascending and symmetric, often with antecedent infection and albuminocytologic dissociation in CSF.
  evidence:
  - reference: PMID:41137982
    reference_title: Pathology of the conus medullaris and cauda equina. Beyond the usual suspects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Guillain-Barré syndrome, neurosarcoidosis, and MOGAD may cause nerve root
      thickening and enhancement
    explanation: Identifies Guillain-Barre syndrome as an inflammatory cauda equina mimic producing nerve-root enhancement without compression.
- name: Mechanical low back pain and lumbar radiculopathy without CES
  description: >-
    Most patients presenting with back pain, sciatica, or difficulty voiding do
    not have true CES: a large fraction of those scanned for suspected CES have
    no concordant compressive pathology, and voiding difficulty in lumbar
    degenerative disease is frequently due to pain rather than cauda equina
    compression.
  distinguishing_features:
  - No concordant compressive pathology on MRI.
  - Absence of the saddle anesthesia, painless retention, and reduced anal tone that mark true CES.
  evidence:
  - reference: PMID:23230403
    reference_title: Does patient history and physical examination predict MRI proven cauda equina syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      many MRI scans obtained from patients presenting with signs and/or
      symptoms of CES do not reveal concordant pathology
    explanation: Supports that most suspected-CES presentations lack a compressive lesion and are radiologic CES-negative mimics.
treatments:
- name: Emergency surgical decompression
  description: >-
    Urgent surgical decompression (e.g., discectomy or laminectomy) to relieve
    compression of the cauda equina is the definitive treatment; decompression
    within 48 hours of symptom onset is associated with better neurological
    recovery.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  target_mechanisms:
  - target: Cauda equina nerve root compression
    treatment_effect: INHIBITS
    description: Surgical decompression removes the compressive lesion, relieving pressure on the cauda equina nerve roots.
    evidence:
    - reference: PMID:10851100
      reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There was a significant advantage to treating patients within 48 hours
        versus more than 48 hours after the onset of cauda equina syndrome.
      explanation: Meta-analysis supports earlier decompression (within 48 hours) improving outcomes.
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant advantage to treating patients within 48 hours
      versus more than 48 hours after the onset of cauda equina syndrome.
    explanation: Supports the timing benefit of surgical decompression in CES.
  - reference: PMID:34581849
    reference_title: "Outcomes of cauda equina syndrome due to lumbar disc herniation after surgical management and the factors affecting it: a systematic review and meta-analysis of 22 studies with 852 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was associated with a favourable outcome in terms of bladder function
    explanation: Meta-analysis supports that decompression within 48 hours yields more favourable bladder outcomes.
discussions:
- discussion_id: disc_ces_decompression_timing
  prompt: >-
    What is the optimal timing of surgical decompression in cauda equina
    syndrome, and does decompression beyond the widely cited 48-hour window
    still yield meaningful neurological recovery?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Emergency surgical decompression
  rationale: >-
    The 48-hour threshold is the most commonly cited surgical target, but the
    supporting evidence is retrospective and discordant: some meta-analyses find
    a clear advantage to decompression within 48 hours while finding no
    additional benefit to operating within 24 hours, and meaningful recovery is
    still reported after 48 hours. No randomized trial has established the
    optimal window, which has major clinical and medicolegal implications.
    Todd's algorithm paper (PMID:19416598) frames the specific unresolved
    question after bladder paralysis (CESR): some hold there is no benefit to
    prompt decompression once CESR has developed, while others posit a "window
    of opportunity" extending to 24 or possibly 48 hours after CESR onset,
    leading Todd to advocate a precautionary approach of urgent decompression
    given the scientific uncertainty.
  proposed_experiments:
  - experiment_id: exp_ces_timing_prospective_registry
    name: Prospective multicenter CES timing-outcome registry
    description: >-
      Enroll suspected-CES patients prospectively with standardized recording of
      symptom-onset time, CESI/CESR stage at presentation, time to
      decompression, and validated bladder/bowel/sexual/motor outcomes at fixed
      follow-up, powered to model outcome as a continuous function of delay
      rather than a dichotomized 48-hour cut.
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The timing of surgical decompression for cauda equina syndrome is
      controversial.
    explanation: Directly documents that the optimal timing of decompression remains an unresolved controversy.
  posed_date: "2026-07-10T00:00:00Z"
- discussion_id: disc_ces_cesr_reversibility
  prompt: >-
    Is the CESI-to-CESR transition a true "point of no return," and how reliably
    does the incomplete-versus-retention classification predict recovery after
    decompression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#CESR
  rationale: >-
    The two-stage CESI/CESR system is the most widely used classification and
    carries prognostic weight, but the details of the dichotomy and whether
    established retention is genuinely irreversible remain debated, leaving the
    prognostic boundary between the stages poorly quantified.
  evidence:

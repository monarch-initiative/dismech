- name: Individualized bowel management
  description: >-
    Persistent lower-motor-neuron bowel dysfunction requires a regular bowel-care program, tailored to stool consistency, emptying and continence. Manual evacuation and selected laxatives or suppositories were used in the chronic CES cohort; refractory patients may be assessed for transanal irrigation.

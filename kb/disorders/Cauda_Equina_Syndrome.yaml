- name: Transanal irrigation for refractory bowel dysfunction
  description: >-
    Transanal irrigation is a specialist bowel-management option when conventional care is insufficient. A small uncontrolled CES study found improvement over ten weeks. Two participants withdrew because of practical difficulties; minor cramping, leakage and catheter displacement occurred. These data support an option for selected patients, not a cure or proven comparative superiority.

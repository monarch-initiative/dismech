environmental:
- name: Obesity and elevated body mass index
  description: >-
    Increased body mass index is a risk factor for cauda equina syndrome:
    patients who develop CES after a lumbar disc prolapse have significantly
    higher BMI than matched elective-discectomy patients, with roughly 3.7-fold
    higher odds of CES in the overweight and obese than in ideal-weight
    individuals.
  presence: Positive
  evidence:
  - reference: PMID:23109638
    reference_title: Is cauda equina syndrome linked with obesity?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increasing BMI and weight were strongly associated with an increased risk
      of CES
    explanation: Case-control study identifies increasing BMI as a risk factor for CES.
  - reference: PMID:23109638
    reference_title: Is cauda equina syndrome linked with obesity?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increasing BMI is associated with CES
    explanation: The study concludes that increasing BMI is associated with cauda equina syndrome.

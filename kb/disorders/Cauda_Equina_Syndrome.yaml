  description: >-
    A case-control study comparing 40 patients undergoing discectomy for CES with 92 elective lumbar-discectomy patients found higher BMI in the CES group. Overweight and obesity were associated with 3.7-fold higher odds than ideal weight; this association does not establish causation.

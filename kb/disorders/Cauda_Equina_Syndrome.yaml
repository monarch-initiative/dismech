discussions:
- discussion_id: disc_ces_decompression_timing
  prompt: >-
    What is the optimal timing of surgical decompression in cauda equina
    syndrome, and does decompression beyond the widely cited 48-hour window
    still yield meaningful neurological recovery?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Emergency surgical decompression
  rationale: >-
    Historical pooled studies associate surgery within 48 hours with better recovery, while a prospective UK cohort of confirmed degenerative-disc CES found no adjusted timing association. Severity influenced the timing of care, symptom-onset measurements differed between participants and clinicians, and most operations followed referral promptly. The remaining question is the causal effect of delay within specific presentations, not whether the observational result licenses waiting.
  proposed_experiments:
  - experiment_id: exp_ces_timing_prospective_registry
    name: Prospective multicenter CES timing-outcome registry
    description: >-
      Enroll suspected-CES patients prospectively with standardized recording of
      symptom-onset time, CESI/CESR stage at presentation, time to
      decompression, and validated bladder/bowel/sexual/motor outcomes at fixed
      follow-up, powered to model outcome as a continuous function of delay
      rather than a dichotomized 48-hour cut.
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The timing of surgical decompression for cauda equina syndrome is
      controversial.
    explanation: Directly documents that the optimal timing of decompression remains an unresolved controversy.
  - *id001
  - *id002
  posed_date: "2026-07-10T00:00:00Z"
- discussion_id: disc_ces_cesr_reversibility
  prompt: >-
    Is the CESI-to-CESR transition a true "point of no return," and how reliably
    does the incomplete-versus-retention classification predict recovery after
    decompression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - stages#CESR
  rationale: >-
    The two-stage CESI/CESR system is the most widely used classification and
    carries prognostic weight, but the details of the dichotomy and whether
    established retention is genuinely irreversible remain debated, leaving the
    prognostic boundary between the stages poorly quantified.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      has prognostic value although the details of this continue to be debated
    explanation: Confirms the prognostic classification is accepted but its details remain an open question.
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      there can be preservation of some useful perineal and genital/sexual sensation, and preservation of bowel function, and delay in decompression may result in loss of these
    explanation: >-
      Retention does not establish complete loss of function or justify withholding decompression.
  - *id003
  posed_date: "2026-07-10T00:00:00Z"
- discussion_id: disc_ces_clinical_prediction
  prompt: >-
    Which clinical features, alone or combined, can reliably identify patients
    with MRI-proven cauda equina syndrome and safely triage who needs emergent
    imaging?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Emergency MRI of the lumbosacral spine
  rationale: >-
    Symptoms and examination findings alone have limited diagnostic discrimination. Low residual bladder volume can occur with confirmed compression. Safer triage strategies remain a research question; this uncertainty must not be used to withhold urgent MRI when CES is suspected.
  evidence:
  - reference: PMID:23230403
    reference_title: Does patient history and physical examination predict MRI proven cauda equina syndrome?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is low evidence that individual symptoms or signs from the patient
      history or clinical examination, respectively, can be used to diagnose CES
    explanation: Establishes that current clinical features are insufficient to diagnose CES, defining the triage knowledge gap.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10943478/
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We therefore recommend that bladder scan/PVR does not dictate the decision to get an early MRI scan.
    explanation: >-
      Limits how bladder-scan results can guide triage.
  posed_date: "2026-07-10T00:00:00Z"
stages:
- name: CESS
  description: >-
    Suspected CES is a pre-CES assessment category: bilateral leg symptoms or a known large disc herniation without established bladder, bowel, genital or perineal CES symptoms.
  notes: >-
    Clinical severity categories from the comprehensive classification assembled by Lavy et al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In both, there are as yet no CES symptoms or signs, but the potential for them to occur is present.
    explanation: >-
      The classification review defines this clinical severity category.
- name: CESE
  description: >-
    Early, symptom-only CES includes reduced perineal sensation with preserved bladder function, or an altered micturition pattern before loss of executive bladder control.
  notes: >-
    Clinical severity categories from the comprehensive classification assembled by Lavy et al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Todd has suggested a category of early CES (CESE) where there is reduced perineal sensation but normal bladder function, or a change in micturition pattern with normal perineal sensation
    explanation: >-
      The classification review defines this clinical severity category.
- name: CESI
  description: >-
    Incomplete CES includes neurogenic urinary difficulties while voluntary executive bladder control and the ability to void are retained. Altered perineal sensation is common but not mandatory.
  notes: >-
    Clinical severity categories from the comprehensive classification assembled by Lavy et al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They define CESI as CES where there are urinary difficulties of neurogenic origin such as altered urinary sensation, loss of desire to void, poor stream or the need to strain, but there is still executive control of bladder function and voiding is possible even if difficult.
    explanation: >-
      The classification review defines this clinical severity category.
- name: CESR
  description: >-
    CES with retention involves loss of executive bladder control and painless urinary retention with overflow. It has a less favorable prognosis than incomplete CES, but useful residual functions and recovery potential may remain.
  notes: >-
    Clinical severity categories from the comprehensive classification assembled by Lavy et al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CESR occurs when the bladder is no longer under executive control and there is painless retention of urine with overflow.
    explanation: >-
      The classification review defines this clinical severity category.
- name: CESC
  description: >-
    Complete CES involves an insensate bladder with overflow incontinence, absent perineal, perianal or sexual sensation and absent anal tone. This is more severe than retention alone.
  notes: >-
    Clinical severity categories from the comprehensive classification assembled by Lavy et al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
  evidence:
  - reference: PMID:34862914
    reference_title: Cauda equina syndrome-a practical guide to definition and classification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Insensate bladder with overflow incontinence, no perineal perianal or sexual sensation, no anal tone
    explanation: >-
      The classification review defines this clinical severity category.

differential_diagnoses:
- name: Other nuclear-encoded mitochondrial complex IV deficiencies
  description: >
    Mutations in other nuclear genes encoding Complex IV structural subunits or
    assembly factors also cause isolated cytochrome c oxidase deficiency and
    neurodevelopmental mitochondrial disease and require molecular genetic
    testing to distinguish from PET117 deficiency.
  disease_term:
    preferred_term: mitochondrial complex IV deficiency, nuclear-type
    term:
      id: MONDO:0033885
      label: mitochondrial complex IV deficiency, nuclear-type
  distinguishing_features:
  - Biallelic pathogenic variants in PET117 on molecular genetic testing rather than other nuclear COX subunit or assembly factor genes
  evidence:
  - reference: PMID:28386624
    reference_title: "Mutated PET117 causes complex IV deficiency and is associated with neurodevelopmental regression and medulla oblongata lesions."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Many different mutations have been found in the genes encoding subunits of the enzyme complexes of the oxidative phosphorylation system. In addition, mutations in genes encoding proteins involved in the assembly of these complexes are known to cause mitochondrial disorders."
    explanation: Places PET117 within the differential diagnosis of nuclear-encoded oxidative phosphorylation subunit and assembly-factor disorders.

genetic:
- name: KIF2A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: KIF2A
    term:
      id: hgnc:6318
      label: KIF2A
  notes: >-
    KIF2A encodes a kinesin-13 microtubule depolymerase. Disease variants are
    heterozygous missense changes in the motor domain, with hotspots at Ser317
    and His321. Heterozygous KIF2A variants reported in epilepsy or autism
    without cortical malformation are outside this entry.
  evidence:
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the discovery of multiple pathogenic missense mutations in
      TUBG1, DYNC1H1 and KIF2A, as well as a single germline mosaic mutation in
      KIF5C, in subjects with MCD.
    explanation: >-
      Founding report of pathogenic KIF2A missense variants in malformations of
      cortical development.
  - reference: PMID:27747449
    reference_title: Recurrent KIF2A mutations are responsible for classic lissencephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of mutations only in the residues Ser317 and His321
      suggests these are hotspots for de novo mutations.
    explanation: >-
      Establishes the recurrent hotspot residues.
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rather than a direct involvement in microtubule-based motility, KIF2A
      functions by driving the ATP-dependent depolymerization of microtubules19.
    explanation: >-
      States the molecular function of the gene product.

epidemiology:
- name: Rarity
  description: >-
    Very rare. Roughly ten cases had been reported worldwide by 2023, and no
    population prevalence estimate exists.
  evidence:
  - reference: PMID:37331001
    reference_title: "Mutations obstructing ATP's emplacement in KIF2A nucleotide-binding pocket causes parenchymal malformations, motor developmental delay, with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

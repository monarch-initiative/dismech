    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: microtubule depolymerization
    term:
      id: GO:0007019
      label: microtubule depolymerization
    modifier: DECREASED
  evidence:
  - reference: PMID:31919497
    reference_title: Conditional switching of KIF2A mutation provides new insights into cortical malformation pathogeny.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We further demonstrate that the observed cellular phenotypes are likely to
      be linked to deficiency in the microtubule depolymerizing function of
      KIF2A.
    explanation: >-
      In a patient-variant knock-in mouse, the cellular defects are attributed
      to loss of depolymerase function.
  - reference: PMID:12887924
    reference_title: Kinesin superfamily protein 2A (KIF2A) functions in suppression of collateral branch extension.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In kif2a(-/-) growth cones, microtubule-depolymerizing activity decreased.
    explanation: >-
      Null-allele evidence that KIF2A is required for microtubule
      depolymerization in neurons; indirect because the human disease alleles
      are missense rather than null.
  downstream:
  - target: Defective Neuronal Migration and Positioning
    description: >-
      Migrating neurons need dynamic microtubules to polarize and move.
  - target: Progenitor Ciliogenesis and Cell-Cycle Coupling Defect
    description: >-
      Cilium disassembly and spindle function in dividing progenitors depend on
      microtubule depolymerization.
  - target: Increased Neuronal Apoptosis
    description: >-
      Expression of the mutant protein increases apoptosis in the developing
      cortex.

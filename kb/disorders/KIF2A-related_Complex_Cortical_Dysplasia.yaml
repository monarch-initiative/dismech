pathophysiology:
- name: KIF2A Motor-Domain Nucleotide-Pocket Disruption
  role: TRIGGER
  biological_scale: MOLECULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    Pathogenic missense variants alter residues in or next to the
    nucleotide-binding pocket of the central KIF2A motor domain (recurrently
    Ser317 and His321, also Gly318, Thr320, Ser433 and Gly440). The altered
    motor domain is expected to bind or hydrolyse ATP poorly. Recombinant mutant
    motor domains are poorly soluble, consistent with misfolding, and mutant
    proteins mislocalize in cells. Because both alleles are expressed and KIF2A
    acts as a dimer, the original report considered the data consistent with a
    dominant-negative effect.
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Only heterozygous missense alleles in the motor domain are associated with
      CDCBM3. The dominant-negative call follows the authors' stated
      interpretation ("consistent with a dominant-negative effect") and has not
      been demonstrated directly, for example by mixing mutant and wild-type
      dimers.
  genes:
  - preferred_term: KIF2A
    term:
      id: hgnc:6318
      label: KIF2A
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  - preferred_term: microtubule binding
    term:
      id: GO:0008017
      label: microtubule binding
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      both conserved residues p.S317 and p.H321 are located around the
      nucleotide binding pocket, suggesting that the ability of KIF2A mutants to
      bind and/or hydrolyse ATP is likely to be impaired.
    explanation: >-
      Structural mapping places the founding variants at the nucleotide-binding
      pocket and predicts impaired ATP binding or hydrolysis.
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data imply that the mutations lead to substantially reduced
      solubility as a result of misfolding, and therefore at a minimum result in
      a reduced yield of functional protein.
    explanation: >-
      Recombinant mutant motor domains are poorly soluble, indicating misfolding.
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      In view of the fact that both KIF2A alleles are expressed in patient
      fibroblasts (Supplementary Fig. 4b) and that the KIF2A molecule functions
      as a dimer22, our in vitro and in vivo data are consistent with a
      dominant-negative effect of these mutations.
    explanation: >-
      Basis for the dominant-negative functional-impact call, which the authors
      present as an interpretation rather than a direct measurement.
  - reference: PMID:27747449
    reference_title: Recurrent KIF2A mutations are responsible for classic lissencephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Located in the motor domain of the KIF2A protein, the Ser317 and His321
      alterations are expected to disrupt binding or hydrolysis of ATP and
      consequently the MT depolymerizing activity.
    explanation: >-
      Links the recurrent hotspot residues to loss of ATP handling and of
      depolymerase activity.
  - reference: PMID:27896282
    reference_title: "A patient with lissencephaly, developmental delay, and infantile spasms, due to de novo heterozygous mutation of KIF2A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The KIF2A p.Thr320Ile mutant protein exhibited abnormal solubility, and
      KIF2A p.Thr320Ile overexpression in cultured cells led to the formation of
      aberrant microtubule networks.
    explanation: >-
      An independent ATP-domain variant shows the same insolubility and alters
      cellular microtubule organization.
  - reference: PMID:33506645
    reference_title: "Variants in KIF2A cause broad clinical presentation; the computational structural analysis of a novel variant in a patient with a cortical dysplasia, complex, with other brain malformations 3."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The computational structural analysis showed the p.433 forms the pocket
      with NBD.
    explanation: >-
      Extends the nucleotide-pocket mechanism to a variant outside the core
      nucleotide-binding domain sequence.
  downstream:
  - target: Impaired Microtubule Depolymerization
    description: >-
      A motor domain that cannot bind or hydrolyse ATP cannot drive the
      ATP-dependent depolymerization of microtubule ends.
- name: Impaired Microtubule Depolymerization
  biological_scale: CELLULAR
  description: >-
    Loss of KIF2A depolymerase activity leaves microtubule ends less dynamic.
    In knock-in mice carrying the patient His321Asp variant, the cellular
    phenotypes are attributed to deficient microtubule-depolymerizing function,
    and Kif2a-null growth cones show reduced depolymerizing activity with
    abnormally behaving microtubules at the cell edge.
  cell_types:

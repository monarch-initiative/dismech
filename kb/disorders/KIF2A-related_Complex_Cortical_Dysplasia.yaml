- name: Progenitor Ciliogenesis and Cell-Cycle Coupling Defect
  biological_scale: CELLULAR
  description: >-
    In cortical progenitors, disease variants reduce proliferation and alter the
    regulation of primary cilium assembly and disassembly across the cell cycle.
    The authors propose that uncoupling ciliogenesis from cell-cycle progression
    contributes to the brain malformation, and the reduced progenitor output is
    a plausible contributor to microcephaly. This node rests on electroporation
    of patient variants; conditional Kif2a knockout in mouse did not impair
    embryonic neurogenesis, an inconsistency recorded as an open discussion.

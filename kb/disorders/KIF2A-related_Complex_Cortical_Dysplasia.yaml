name: KIF2A-related Complex Cortical Dysplasia
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: complex cortical dysplasia with other brain malformations 3
  term:
    id: MONDO:0014170
    label: complex cortical dysplasia with other brain malformations 3
synonyms:
- CDCBM3
- KIF2A-related cortical malformation
- KIF2A complex cortical dysplasia with other brain malformations
- complex cortical dysplasia with other brain malformations type 3
description: >-
  KIF2A-related complex cortical dysplasia (CDCBM3) is a rare autosomal dominant
  malformation of cortical development caused by heterozygous, typically de novo
  missense variants in KIF2A, which encodes a kinesin-13 family member. Unlike
  most kinesins, KIF2A does not transport cargo: it uses ATP to depolymerize
  microtubule ends. Pathogenic variants cluster in and around the
  nucleotide-binding pocket of the motor domain, with recurrent hotspots at
  Ser317 and His321, and are expected to disrupt ATP binding or hydrolysis and
  therefore the microtubule-depolymerizing activity. The typical picture is
  classic posterior-predominant lissencephaly (agyria/pachygyria), closely
  resembling LIS1/PAFAH1B1 lissencephaly, combined with congenital or postnatal
  microcephaly, early-onset epilepsy including infantile spasms, and severe
  motor and cognitive impairment. Milder presentations with intellectual
  disability or developmental delay have been reported for variants just outside
  the core nucleotide-binding residues. In model systems the variants disturb
  several microtubule-dependent steps of corticogenesis: the multipolar-to-bipolar
  transition and positioning of projection neurons, interneuron migration,
  progenitor proliferation coupled to ciliogenesis, and neuronal survival.
parents:
- congenital nervous system disorder
- hereditary neurological disease
- neuronal migration disorder

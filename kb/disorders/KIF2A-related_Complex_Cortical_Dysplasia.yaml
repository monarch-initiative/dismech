discussions:
- discussion_id: gap_kif2a_progenitor_versus_null
  prompt: >-
    Do KIF2A disease variants impair cortical progenitor proliferation, given
    that conditional loss of Kif2a in mouse does not?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progenitor Ciliogenesis and Cell-Cycle Coupling Defect
  rationale: >-
    In utero electroporation of patient variants reduces progenitor
    proliferation and alters ciliogenesis, but conditional inactivation of Kif2a
    in cortical progenitors leaves embryonic neurogenesis intact and instead
    causes postnatal neuronal maturation failure and degeneration. If the
    missense variants act dominant-negatively, they could impair progenitors in a
    way that removing the protein does not; alternatively the electroporation
    result may reflect overexpression. The answer decides whether microcephaly
    in this disease comes mainly from reduced progenitor output or from neuronal
    loss.
  evidence:
  - reference: PMID:29077851
    reference_title: Ciliogenesis and cell cycle alterations contribute to KIF2A-related malformations of cortical development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using cellular and in utero electroporation approaches, we show here that
      KIF2A disease-causing variants disrupts projection neuron positioning and
      interneuron migration, as well as progenitors proliferation.
    explanation: Variant electroporation reduces progenitor proliferation.
  - reference: PMID:36343267
    reference_title: KIF2A deficiency causes early-onset neurodegeneration.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that KIF2A is dispensable for embryogenic neurogenesis but
      critical in postnatal stages for maturation, connectivity, and maintenance
      of neurons.
    explanation: >-
      Conditional loss of Kif2a does not impair embryonic neurogenesis, which
      argues against a simple loss-of-function route to reduced progenitor
      output.

    modifier: DECREASED
  evidence:
  - reference: PMID:29077851
    reference_title: Ciliogenesis and cell cycle alterations contribute to KIF2A-related malformations of cortical development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using cellular and in utero electroporation approaches, we show here that
      KIF2A disease-causing variants disrupts projection neuron positioning and
      interneuron migration, as well as progenitors proliferation.
    explanation: >-
      In utero electroporation of patient variants disrupts both radial

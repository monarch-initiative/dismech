  biological_scale: CELLULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule-Based Neuronal Motility Failure
  description: >-
    Disease variants disrupt the positioning of radially migrating projection
    neurons and the tangential migration of interneurons. In the knock-in mouse,
    newborn neurons fail to make the normal multipolar-to-bipolar transition,
    the step that precedes locomotion through the cortical plate.
  cell_types:

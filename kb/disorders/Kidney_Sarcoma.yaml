genetic:
- name: SS18
  subtype: Renal Synovial Sarcoma
  gene_term:
    preferred_term: SS18
    term:
      id: hgnc:11340
      label: SS18
  association: Somatic SS18::SSX1/2 translocation
  relationship_type: SOMATIC_DRIVER
  notes: >-
    The defining lesion of renal synovial sarcoma, present in all reported
    cases of the largest contemporary series. The SS18::SSX fusion protein
    misdirects the BAF (SWI/SNF) chromatin-remodelling complex, degrading the
    canonical cBAF complex and driving a fusion-specific transcriptional
    programme. SS18-SSX immunohistochemistry is concordant with FISH and is a
    usable diagnostic surrogate.
  evidence:
  - reference: PMID:36591871
    reference_title: "SS18-SSX Expression in a Contemporary Cohort of Primary Renal Synovial Sarcoma: A Multi-Institutional Experience of Fourteen Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SS18-SSX IHC was positive in all 14 tumors (diffuse, n = 10; multifocal, n
      = 2; focal, n = 2). All the tumors harbored SS18::SSX1/2 gene
      rearrangement.
    explanation: >-
      Establishes the SS18::SSX1/2 rearrangement as universal in this cohort of
      renal synovial sarcoma and validates SS18-SSX immunohistochemistry as a
      surrogate.
- name: SSX1
  subtype: Renal Synovial Sarcoma
  gene_term:
    preferred_term: SSX1
    term:
      id: hgnc:11335
      label: SSX1
  association: Somatic fusion partner in SS18::SSX1 translocation
  relationship_type: SOMATIC_DRIVER
  notes: >-
    The X-linked partner gene of the defining translocation; SS18::SSX1 and
    SS18::SSX2 are the two recurrent fusions, and the multi-institutional renal
    series did not distinguish which partner predominates in the kidney.
  evidence:
  - reference: PMID:36591871
    reference_title: "SS18-SSX Expression in a Contemporary Cohort of Primary Renal Synovial Sarcoma: A Multi-Institutional Experience of Fourteen Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the tumors harbored SS18::SSX1/2 gene rearrangement.
    explanation: >-
      Names SSX1/2 as the fusion partner in every tumour of the renal synovial
      sarcoma cohort.
- name: EWSR1
  subtype: Renal Ewing Sarcoma
  gene_term:
    preferred_term: EWSR1
    term:
      id: hgnc:3508
      label: EWSR1
  association: Somatic EWSR1::FLI1 (or related ETS-family) translocation
  relationship_type: SOMATIC_DRIVER
  notes: >-
    The defining rearrangement of the Ewing sarcoma family of tumours, shared by

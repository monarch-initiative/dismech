    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While this malignant process may share histologic and molecular features
      with its bone and soft tissue counterparts, primary renal ESFT
      presentations seem to be more aggressive and have worse outcomes.
    explanation: >-
      States that renal Ewing sarcoma shares the molecular features of the Ewing
      family - the EWSR1 rearrangement - while behaving more aggressively.
      PARTIAL because the quoted sentence asserts shared molecular features
      without naming the fusion partner.
- name: FLI1
  subtype: Renal Ewing Sarcoma
  gene_term:
    preferred_term: FLI1

has_subtypes:
- name: Renal LMS
  display_name: Renal Leiomyosarcoma
  description: >-
    The commonest primary renal sarcoma, arising from the smooth muscle of the
    intrarenal blood vessels, the renal capsule, or the renal pelvic wall. Mean
    age at presentation is 50-60 years with a female preponderance. Genomically
    complex rather than fusion-driven, with recurrent loss of TP53, RB1 and ATRX
    pathway function; high rate of local recurrence and haematogenous metastasis.
  subtype_term:
    preferred_term: Kidney Leiomyosarcoma
    term:
      id: NCIT:C6183
      label: Kidney Leiomyosarcoma
  evidence:
  - reference: PMID:32491531
    reference_title: Renal Leiomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal leiomyosarcoma (LMS) is a rare and aggressive mesenchymal tumor that
      usually arises from the smooth muscle cells of the intrarenal blood vessels
      or the renal pelvis.
    explanation: >-
      Establishes the cell of origin and mesenchymal character of the commonest
      renal sarcoma subtype.
- name: Renal Liposarcoma
  display_name: Renal Liposarcoma
  description: >-
    Adipocytic sarcoma arising from the fat of the renal sinus, capsule or
    perinephric tissue. Its principal diagnostic difficulty is radiological: a
    fat-containing renal mass is far more often a benign angiomyolipoma, and
    well-differentiated renal liposarcoma can be indistinguishable on imaging
    alone. Well-differentiated and dedifferentiated forms carry the 12q13-15
    amplicon containing MDM2 and CDK4, which is the diagnostic discriminator from
    benign lipomatous lesions.
  subtype_term:
    preferred_term: Kidney Liposarcoma
    term:
      id: NCIT:C6185
      label: Kidney Liposarcoma
  evidence:
  - reference: PMID:38312755
    reference_title: Primary renal liposarcoma simulating angiomyolipoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In extremely rare instances, the tumor can arise directly from the fat in
      the epicenter of the kidney, disguised as an angiomyolipoma.
    explanation: >-
      Supports both the adipocytic renal origin of this subtype and the
      angiomyolipoma mimicry that makes it a diagnostic problem.
- name: Renal Angiosarcoma
  display_name: Renal Angiosarcoma
  description: >-
    Endothelial-derived sarcoma of the renal vasculature. The rarest of the
    common subtypes and by a wide margin the most lethal - in the Japanese
    national registry it carried a hazard ratio for death of 12.65 and a 3-year
    survival of 19.0%. Frequently presents with spontaneous haemorrhage into or
    around the tumour, and with direct extension into the renal vein and
    perirenal fat.
  subtype_term:
    preferred_term: Kidney Angiosarcoma
    term:
      id: NCIT:C159205
      label: Kidney Angiosarcoma
  evidence:
  - reference: PMID:41777120
    reference_title: "Clinical Characteristics and Prognostic Factors of Renal Sarcoma: A Japanese National Cancer Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      histologic subtype (angiosarcoma: HR, 12.65; p < 0.001), and distant
      disease (HR, 6.32; p < 0.001) were significant independent prognostic
      factors
    explanation: >-
      Quantifies angiosarcoma histology as an independent adverse prognostic
      factor within renal sarcoma.
- name: Renal Synovial Sarcoma
  display_name: Renal Synovial Sarcoma
  description: >-
    A translocation-driven sarcoma defined by the SS18::SSX1/2 fusion, accounting
    for under 1% of renal sarcomas. Unlike the other subtypes it has a single
    defining genetic lesion, detectable by SS18-SSX immunohistochemistry as a
    surrogate for FISH. Spindle-cell, round-cell and epithelioid morphologies all
    occur, and the round-cell pattern is a recognised mimic of other small
    round-blue-cell renal tumours.
  subtype_term:
    preferred_term: Kidney Synovial Sarcoma
    term:
      id: NCIT:C157737
      label: Kidney Synovial Sarcoma
  evidence:
  - reference: PMID:36591871
    reference_title: "SS18-SSX Expression in a Contemporary Cohort of Primary Renal Synovial Sarcoma: A Multi-Institutional Experience of Fourteen Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary renal synovial sarcoma is a rare aggressive mesenchymal neoplasm of
      the kidney that accounts for less than 1% of renal sarcomas.
    explanation: >-
      Establishes renal synovial sarcoma as a distinct, rare mesenchymal subtype
      within renal sarcoma.
- name: Renal RMS
  display_name: Renal Rhabdomyosarcoma
  description: >-
    Skeletal-muscle-differentiated sarcoma of the kidney, extremely rare in
    adults, where it behaves far more aggressively than the paediatric disease.
    Most reported adult cases are embryonal. Because rhabdomyoblastic
    differentiation is not a normal constituent of the kidney, this subtype is
    considered to arise from primitive mesenchyme with divergent myogenic
    differentiation rather than from a resident myocyte population.
  subtype_term:
    preferred_term: Kidney Rhabdomyosarcoma
    term:
      id: NCIT:C159206
      label: Kidney Rhabdomyosarcoma
  evidence:
  - reference: PMID:37753457
    reference_title: "Unique manifestation of primary renal rhabdomyosarcoma in patient with autosomal polycystic kidneys: Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary embryonal rhabdomyosarcomas of the kidney are extremely rare,
      especially in adults.
    explanation: >-
      Supports the rarity of this subtype and its predominantly embryonal
      histology in adults.
- name: Renal Ewing Sarcoma
  display_name: Renal Ewing Sarcoma / Primitive Neuroectodermal Tumour
  description: >-
    A small round blue cell sarcoma of the Ewing family arising primarily in the
    kidney, driven by an EWSR1::FLI1 or related ETS-family fusion. It is the one
    subtype for which there is direct evidence that the renal site changes
    behaviour rather than merely relocating a familiar tumour: in a pooled
    analysis of 362 reported cases, metastases were present at diagnosis in 53%
    of renal Ewing sarcoma against 20-25% for the Ewing family overall, and nodal
    disease in 24% against 3.2% for primary skeletal Ewing sarcoma. It presents
    at a much younger age than the other renal sarcomas - adolescents and young
    adults rather than the sixth decade - and is treated on Ewing-family
    multimodal protocols rather than as a renal tumour.
  subtype_term:
    preferred_term: Kidney Ewing Sarcoma
    term:
      id: NCIT:C159208
      label: Kidney Ewing Sarcoma
  evidence:
  - reference: PMID:32282650
    reference_title: Primary Renal Ewing Sarcoma in Children and Young Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, while the general ESFT population has reported rates of metastasis
      at diagnosis of 20% to 25%, this rate in the renal ESFT population was 53%
      with a rate of 59% in adolescent and young-adult patients (11 to 24 y).
    explanation: >-
      Quantifies the excess metastatic burden at diagnosis specific to the renal
      site, the observation on which this subtype's description rests.
pathophysiology:
- name: Malignant Transformation of Renal Mesenchyme
  biological_scale: CELLULAR
  description: >-
    Kidney sarcomas arise by malignant transformation of the non-epithelial
    compartments of the kidney - the smooth muscle of the intrarenal arteries,
    veins and renal pelvic wall; the fibrous capsule and perinephric connective
    tissue; the adipose tissue of the renal sinus; and the vascular endothelium.
    This is the definitional node of the entry and the point at which it diverges
    from every renal cell carcinoma: there is no tubular epithelial precursor and
    no epithelial differentiation programme, so the transformed cell retains a
    mesenchymal phenotype from the outset. Which mesenchymal lineage transforms
    determines the histological subtype, and the transforming lesions differ
    completely between lineages - complex chromosomal loss in leiomyosarcoma and
    angiosarcoma, the 12q13-15 MDM2/CDK4 amplicon in liposarcoma, and the single
    SS18::SSX fusion in synovial sarcoma.
  notes: >-
    curation_scope_rationale: This entry is a root Disease with histological
    `has_subtypes` rather than a `kb/groupings/` union, which was seriously
    considered. Two things decided it. First, the members do share a real
    pathograph, not merely a name: mesenchymal (non-epithelial) origin, silent
    retroperitoneal expansion to large size, renal vein and vena cava invasion
    with early haematogenous spread, and the absence of any epithelial target for
    RCC-directed systemic therapy. That chain is more specific than the generic
    cancer hallmarks and it holds across the subtypes. Second, a Grouping's
    `members[].member` must resolve to an existing entry, and the only candidates
    in the knowledge base (Leiomyosarcoma, Liposarcoma, Angiosarcoma,
    Synovial_Sarcoma) are pan-site histology entries whose extent is not renal;
    listing them as members of "Kidney Sarcoma" would mis-state their scope. This
    is the point of difference from Paranasal_Sinus_Carcinoma, which took the
    Grouping route on very similar anatomic-plus-clinical grounds but already had
    site-specific member entries (Paranasal_Sinus_Squamous_Cell_Carcinoma,
    Ethmoid_Sinus_Adenocarcinoma, Sinonasal_Undifferentiated_Carcinoma) to unite.
    The direct in-KB precedent for the shape adopted here is
    Sarcoma_Of_Cervix_Uteri - a site-specific sarcoma umbrella with equally
    divergent subtype drivers (DICER1 in ERMS, complex karyotype in
    leiomyosarcoma) curated as one Disease with `has_subtypes`. The divergence of
    drivers is handled where it belongs, in per-subtype `genetic:` blocks keyed by
    `subtype:`, not by blending it into shared pathophysiology nodes. If
    site-specific member Disease entries are curated later, revisiting this as a
    Grouping is a reasonable follow-up.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leiomyosarcoma (AAIR 0.14 cases/1 million) and malignant rhabdoid tumors
      (0.06 cases/1 million) were most common.
    explanation: >-
      Source for the histiotype-specific incidence rates within the overall
      renal-sarcoma incidence.
- population: Adults, share of renal malignancy
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Two markedly different figures circulate and this entry records both rather
    than picking one. Case-report and narrative-review literature states about 1%
    of renal tumours (some series 1-3%); the largest registry study puts it at
    0.25% of renal malignancies. The registry figure should be preferred for the
    denominator of all renal malignancy - the higher figures are plausibly
    inflated by referral and publication bias toward large, surgically dramatic
    tumours in the case-report literature.
  evidence:
  - reference: PMID:38693188
    reference_title: "Epidemiology, treatment and outcomes of primary renal sarcomas in adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accounting for 0.25% of renal malignancies, renal sarcomas include 43
      histiotypes
    explanation: >-

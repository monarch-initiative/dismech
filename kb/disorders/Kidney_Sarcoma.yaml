discussions:
- discussion_id: renal_sarcoma_radiotherapy_discordance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Radiation Therapy
  prompt: >-
    Is radiotherapy genuinely active in primary renal sarcoma, or is the registry
    survival association an artefact of selecting fitter patients with resectable
    disease?
  rationale: >-
    The literature consistently describes renal sarcoma as radioresistant, yet
    the Japanese national registry found radiation therapy independently
    associated with improved survival (HR 0.39, p = 0.010) on multivariable
    analysis. Registry analyses cannot adjust for performance status, resection
    completeness, or the clinical reasoning that led to radiotherapy being
    offered, so the two observations are not necessarily in conflict - but the
    discordance is unresolved and matters, because it is the difference between
    a treatment with no role and one that is being under-used in a disease with
    almost no systemic options.
- discussion_id: renal_site_molecular_correlate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Subtype-Specific Driver Lesion Acquisition
  prompt: >-
    Does arising in the kidney change the biology of a given sarcoma histology,
    or is renal site purely an anatomical accident with no molecular correlate?
  rationale: >-
    Everything modeled in this entry as shared across subtypes is anatomical and
    clinical - retroperitoneal silent growth, renal venous invasion, absence of
    an epithelial therapeutic target - and nothing is established as shared at
    the molecular level. There is one partial answer, and it points toward the
    site mattering: renal Ewing sarcoma is metastatic at diagnosis in 53% of
    pooled reported cases against 20-25% for the Ewing family overall, and has
    nodal disease in 24% against 3.2% for skeletal primaries, despite carrying
    the same defining fusion. Whether that reflects a genuine microenvironmental
    effect, the vascular anatomy of the kidney, or simply later detection in a
    silent compartment is unresolved - and the equivalent comparison has never
    been made for the commoner subtypes. No study has compared the genomes of
    renal leiomyosarcoma or renal angiosarcoma with their much commoner
    counterparts at other sites. If the site has no molecular correlate, the case
    for a site-based entry rests entirely on the clinical pathograph; if it does,
    the shared node set should grow. This is the empirical question underlying
    the lump-versus-split decision recorded on the first pathophysiology node.
- discussion_id: renal_vs_sts_guideline_mismatch
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Absence of Epithelial Therapeutic Target
  - treatments#Adjuvant Chemotherapy
  prompt: >-
    Does managing primary renal sarcoma under renal cancer guidelines rather than
    soft-tissue sarcoma guidelines cost survival, and by how much?
  rationale: >-
    The largest registry series found that renal sarcomas behave as soft-tissue
    sarcomas but are treated according to renal cancer guidelines. If the two
    frameworks agreed on management the observation would be of no consequence,
    but they do not: soft-tissue sarcoma practice routes patients to a sarcoma
    reference centre, selects the cytotoxic regimen by histiotype, and considers
    neoadjuvant therapy for large high-grade tumours, none of which follows from
    a renal cancer pathway. No study has compared outcomes between patients
    managed under the two frameworks, and because the disease is too rare for a
    randomised trial the answer would have to come from a registry analysis
    stratified by whether care was delivered at a sarcoma centre. Until then the
    size of the gap between how these tumours behave and how they are treated is
    unmeasured.
- discussion_id: no_renal_sarcoma_molecular_dataset
  kind: KNOWLEDGE_GAP
  attaches_to:
  - datasets#
  - pathophysiology#Subtype-Specific Driver Lesion Acquisition
  prompt: >-
    Is there any public molecular dataset of primary renal sarcoma, and if not,
    what is the smallest cohort that would settle whether the renal site has a
    molecular signature?
  rationale: >-
    This entry carries one `datasets:` record, and what is missing around it is
    the finding. A GEO sweep for renal sarcoma and its named subtypes returns
    exactly one series profiling a tumour this entry covers - a single
    BCOR-CCNB3 undifferentiated sarcoma of the kidney. Everything else that
    scores highly on name match profiles clear cell sarcoma of the kidney or
    rhabdoid tumour of the kidney, both explicitly excluded here, and the
    remainder mention the search terms only incidentally. There is no molecular
    dataset at all for renal leiomyosarcoma, the commonest histiotype, nor for
    renal angiosarcoma, the most lethal. At an incidence of 0.53 cases per
    million person-years spread across 43 histiotypes, no single institution
    accumulates enough tissue to profile, so the gap is structural rather than
    accidental. It is also the reason the site-versus-molecular-correlate
    question above cannot currently be answered: the comparison needs renal and
    non-renal cases of the same histiotype sequenced together, and that cohort
    would have to be assembled prospectively across a sarcoma consortium. Any
    accession added here in future must be checked for relevance rather than
    accepted because it resolves; searching a causal gene or relaxing the disease
    name in this space returns Wilms tumour, clear cell sarcoma of the kidney and
    sarcomatoid renal cell carcinoma, none of which is this disease.

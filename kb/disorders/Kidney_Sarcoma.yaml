treatments:
- name: Radical Nephrectomy with Complete Surgical Excision
  description: >-
    The only intervention that reliably alters outcome. Radical nephrectomy with
    en-bloc resection of involved perinephric tissue and negative margins is the
    standard of care; where a renal vein or vena caval tumour thrombus is
    present, thrombectomy is performed with it, and a Mayo grade IV thrombus
    reaching the right atrium may require cardiopulmonary bypass with hypothermic
    circulatory arrest. Incomplete excision is followed by a high rate of local
    recurrence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Radical Nephrectomy
    term:
      id: NCIT:C51778
      label: Radical Nephrectomy
  target_mechanisms:
  - target: Silent Retroperitoneal Expansion
    description: >-
      Removes the primary mass and its retroperitoneal extensions before further
      local progression.
  evidence:
  - reference: PMID:42050503
    reference_title: "Anesthetic management of primary renal sarcoma with Mayo IV tumor thrombus using moderate hypothermic circulatory arrest and antegrade cerebral perfusion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They progress rapidly and are resistant to radiotherapy and chemotherapy.
      Currently, surgery is the only effective treatment.
    explanation: >-
      States that surgery is the only effective treatment for primary renal
      sarcoma, which is the basis of this entry.
  - reference: PMID:36045013
    reference_title: "Renal Sarcoma: A Population-Based Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Performance of nephrectomy also trended towards independently improving OS
      (HR 0.23, 95% CI 0.05-1.09).
    explanation: >-
      Population-level support for a survival benefit from nephrectomy. PARTIAL
      because the confidence interval crosses 1 and the authors describe it as a
      trend rather than a significant independent effect.
- name: Adjuvant Chemotherapy
  description: >-
    Soft-tissue-sarcoma-directed cytotoxic chemotherapy is given adjuvantly or
    for metastatic disease, but renal sarcomas are described as chemoresistant and
    no regimen has established survival benefit in this setting. Regimen choice
    follows the histological subtype rather than the renal site, which is the
    practical expression of the driver heterogeneity modeled above.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:36591871
    reference_title: "SS18-SSX Expression in a Contemporary Cohort of Primary Renal Synovial Sarcoma: A Multi-Institutional Experience of Fourteen Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adjuvant chemotherapy was administered in 11/12 patients.
    explanation: >-
      Documents adjuvant chemotherapy as near-universal practice in renal
      synovial sarcoma. PARTIAL because the series reports use, not efficacy.
  - reference: PMID:42050503
    reference_title: "Anesthetic management of primary renal sarcoma with Mayo IV tumor thrombus using moderate hypothermic circulatory arrest and antegrade cerebral perfusion: a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They progress rapidly and are resistant to radiotherapy and chemotherapy.
    explanation: >-
      Refutes the expectation of chemotherapy benefit, and is recorded here so
      the limited efficacy is explicit rather than implied by omission.
- name: Radiation Therapy
  description: >-
    Renal sarcomas are generally described as radioresistant, and radiotherapy is
    not standard. The Japanese national registry nonetheless found radiation
    associated with improved survival on multivariable analysis, which is
    discordant with the prevailing description and is reported here as an open
    question rather than a recommendation - the registry cannot adjust for the
    selection of fitter patients with resectable disease into radiotherapy.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:41777120
    reference_title: "Clinical Characteristics and Prognostic Factors of Renal Sarcoma: A Japanese National Cancer Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical resection (HR, 0.41; p = 0.004) and radiation therapy (HR, 0.39; p
      = 0.010) were associated with improved survival.
    explanation: >-
      Reports a survival association for radiation therapy in a national registry
      cohort, the observation this entry flags as discordant with the standard
      description of radioresistance.
  - reference: PMID:42050503
    reference_title: "Anesthetic management of primary renal sarcoma with Mayo IV tumor thrombus using moderate hypothermic circulatory arrest and antegrade cerebral perfusion: a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They progress rapidly and are resistant to radiotherapy and chemotherapy.
    explanation: >-
      The opposing view, stating radioresistance. Retained alongside the registry
      finding because the discordance is real and unresolved.
prevalence:
- population: United States adults, SEER and NCDB 2004-2016
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.053
  notes: >-
    Average annual age-adjusted incidence of 0.53 cases per million person-years,
    normalised here to 0.053 per 100,000. The rate was flat across the study
    period. Leiomyosarcoma was the commonest histiotype at 0.14 per million and
    malignant rhabdoid tumour second at 0.06 per million. The prevalence_class
    band is applied to an incidence rate here because the Orphanet bands have no
    incidence equivalent; read it as an order-of-magnitude tag, not a prevalence
    claim.
  evidence:

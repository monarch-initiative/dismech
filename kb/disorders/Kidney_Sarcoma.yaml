    reference_title: Renal Leiomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal leiomyosarcoma (LMS) is a rare and aggressive mesenchymal tumor that
      usually arises from the smooth muscle cells of the intrarenal blood vessels
      or the renal pelvis.
    explanation: >-
      Names the mesenchymal compartments of the kidney - intrarenal vascular
      smooth muscle and renal pelvis - as the site of origin, which is the claim
      this node makes.
  downstream:
  - target: Subtype-Specific Driver Lesion Acquisition
    causal_link_type: DIRECT
    description: >-
      The transformed mesenchymal lineage determines which driver lesion class is
      acquired and therefore which histological subtype results.
- name: Subtype-Specific Driver Lesion Acquisition
  biological_scale: MOLECULAR
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    The genetic route to malignancy is not shared across the subtypes, and this
    node exists to say so explicitly rather than to assert a common driver. Two
    genetic architectures are represented. The majority of renal sarcomas -
    leiomyosarcoma, angiosarcoma and dedifferentiated liposarcoma - are
    genomically complex: they carry aneuploid, structurally rearranged genomes
    produced by loss of tumour-suppressor and genome-maintenance function (TP53,
    RB1, ATRX) rather than by a single positive driver, which is the chromosomal
    instability arm of the genome-instability hallmark. A minority - renal
    synovial sarcoma - is instead fusion-driven, defined by a single SS18::SSX1/2
    translocation on a near-diploid background, and does not conform to the
    mutator phenotype at all. Well-differentiated liposarcoma sits between the two
    with a focal, recurrent amplicon (12q13-15, containing MDM2 and CDK4). This
    heterogeneity is not an annotation artefact: national registry data show
    histological subtype to be the single strongest predictor of survival within
    renal sarcoma, with 3-year survival ranging from 19.0% for angiosarcoma to
    94.4% for clear cell sarcoma of the kidney, and the largest combined
    SEER/NCDB series counts 43 distinct histiotypes under the renal-sarcoma
    heading with differing sensitivity to systemic therapy. The practical
    corollary, and the reason this node is modeled as divergence rather than as a
    shared driver, is that treatment selection follows the histology and not the
    organ.
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:41777120
    reference_title: "Clinical Characteristics and Prognostic Factors of Renal Sarcoma: A Japanese National Cancer Registry Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic subtype is the most critical prognostic factor for renal sarcoma
      in Japan's aging population, with dramatic survival differences: clear cell
      sarcoma (94.4% 3-year survival) versus angiosarcoma (19.0%).
    explanation: >-
      Directly supports the claim that the subtypes are biologically distinct
      rather than variants of one process, quantified as a survival difference of
      75 percentage points at 3 years.
  - reference: PMID:38693188
    reference_title: "Epidemiology, treatment and outcomes of primary renal sarcomas in adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      renal sarcomas include 43 histiotypes with distinct epidemiology, clinical
      presentation, outcomes and sensitivity to systemic therapy, thereby
      reflecting soft-tissue sarcoma behavior
    explanation: >-
      The largest combined SEER/NCDB series states the driver and behavioural
      heterogeneity this node models, and locates renal sarcoma's behaviour with
      soft-tissue sarcoma rather than with renal cancer.
  - reference: PMID:36591871
    reference_title: "SS18-SSX Expression in a Contemporary Cohort of Primary Renal Synovial Sarcoma: A Multi-Institutional Experience of Fourteen Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the tumors harbored SS18::SSX1/2 gene rearrangement.
    explanation: >-
      Supports the fusion-driven arm of this node - renal synovial sarcoma is
      uniformly defined by a single translocation - and so supports the claim
      that driver architecture differs between subtypes. PARTIAL because it
      speaks only to the synovial subtype, not to the complex-karyotype majority.
  downstream:
  - target: Silent Retroperitoneal Expansion
    causal_link_type: DIRECT
    description: >-
      Unchecked proliferation of the transformed mesenchymal clone produces the
      expanding retroperitoneal mass.
- name: Silent Retroperitoneal Expansion
  biological_scale: TISSUE
  description: >-
    The kidney sits in a distensible retroperitoneal compartment, and a
    mesenchymal tumour growing within the renal capsule, sinus or perinephric
    tissue displaces structures rather than obstructing them. There is no early
    symptom analogous to the obstructive or bleeding presentation of tumours in a
    lumen, so the tumour is typically large at diagnosis - reported primary renal
    sarcomas are commonly 6-12 cm or greater - and produces only the non-specific
    triad of flank pain, haematuria (when the mass reaches the collecting system)
    and a palpable mass. This delay is the mechanism by which stage at diagnosis,
    itself the dominant prognostic variable, is set: in the SEER cohort stage III
    disease carried a hazard ratio for death of 4.93 against stage I, and median
    survival fell from 105 months to 8 months.
  evidence:
  - reference: PMID:36045013
    reference_title: "Renal Sarcoma: A Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median survival was 105 months (interquartile range [IQR], 29 - not
      reached) for stage I disease, 46 months (IQR 14-118 months) for stage II
      disease, 8 months (IQR 3-28 months) for stage III disease
    explanation: >-
      Quantifies the consequence of the delayed presentation modeled here: stage
      at diagnosis separates median survival by more than an order of magnitude.
  - reference: PMID:34102790
    reference_title: Primary Renal Leiomyosarcoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CT scan revealed an enhancing, heterogeneous, 6×7×9 cm right renal mass.
    explanation: >-
      A representative incidentally detected renal leiomyosarcoma already 9 cm at
      diagnosis, illustrating the large size reached before detection. PARTIAL
      because a single case documents the pattern without establishing its
      frequency.
  - reference: PMID:38693188
    reference_title: "Epidemiology, treatment and outcomes of primary renal sarcomas in adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presented with advanced local extent (T3 33.3%; T4 14.2%) or
      distant metastases (29.1%) and commonly underwent surgical resection
      (81.6%).
    explanation: >-
      Quantifies the late presentation this node models at population scale:
      nearly half of adult renal sarcomas are T3 or T4 and almost a third are
      already metastatic when first diagnosed.
  downstream:
  - target: Vascular Invasion and Haematogenous Dissemination
    causal_link_type: DIRECT
    description: >-
      Continued local growth brings the tumour into contact with, and then
      through, the renal venous system.
- name: Vascular Invasion and Haematogenous Dissemination
  biological_scale: TISSUE
  conforms_to: "invasion_and_metastasis#Local Invasion and Intravasation"
  description: >-
    Renal sarcomas invade locally through the perirenal fat and into the renal
    vein, and from there into the inferior vena cava, occasionally as a tumour
    thrombus reaching the right atrium. Because the subtypes originate in or
    adjacent to the renal vasculature, intravasation is anatomically immediate
    rather than a late acquired capability, and dissemination is predominantly
    haematogenous rather than lymphatic - the liver, lung, bone and brain are the
    usual destinations. Note that the epithelial-mesenchymal transition step of
    the invasion-and-metastasis module is deliberately not claimed here: these
    cells are mesenchymal from the outset and never undergo a phenotype switch to
    acquire motility.
  biological_processes:
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:32491531
    reference_title: Renal Leiomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal LMS frequently metastasizes to distant body organs via hematogenous
      spread and carries an overall poor prognosis.
    explanation: >-
      Directly supports haematogenous rather than lymphatic dissemination as the
      dominant metastatic route.
  - reference: PMID:30061122
    reference_title: Primary renal angiosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Final pathology was pT2b with extension of the mass into the renal vein and
      perirenal adipose tissue.
    explanation: >-
      Documents the renal vein and perirenal fat invasion that this node models,
      in the angiosarcoma subtype.
  - reference: PMID:42050503
    reference_title: "Anesthetic management of primary renal sarcoma with Mayo IV tumor thrombus using moderate hypothermic circulatory arrest and antegrade cerebral perfusion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 49-year-old man was admitted with a left kidney mass and inferior vena
      cava (IVC) tumor thrombus extending into the right atrium (Mayo grade IV).
    explanation: >-
      Documents the extreme of the venous-invasion phenotype modeled here - a
      tumour thrombus propagating from the renal vein through the vena cava to
      the right atrium.
  downstream:
  - target: Absence of Epithelial Therapeutic Target
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Once disease is disseminated, treatment depends on systemic options, and
      the mesenchymal phenotype determines that none of the renal-cell-carcinoma
      options apply.
- name: Absence of Epithelial Therapeutic Target
  biological_scale: ORGANISM
  description: >-
    The therapeutic consequence of the mesenchymal origin. The entire modern
    systemic framework for kidney cancer - VEGF-pathway tyrosine kinase
    inhibition, mTOR inhibition, and PD-1/CTLA-4 checkpoint blockade - was built
    on clear cell renal cell carcinoma biology (VHL loss, hypoxia-inducible
    factor stabilisation, a high-neoantigen immunogenic epithelial tumour) and
    none of it has a target in a renal sarcoma. Conventional soft-tissue sarcoma
    chemotherapy and radiotherapy are correspondingly of limited benefit, so
    complete surgical excision with negative margins is the only intervention
    that reliably alters outcome, and local recurrence after incomplete resection
    is common. This node is the mechanistic reason that kidney sarcoma carries a
    worse prognosis than renal cell carcinoma of equivalent stage, and it is why
    distinguishing the two at diagnosis matters clinically rather than only
    taxonomically.
  evidence:
  - reference: PMID:42050503
    reference_title: "Anesthetic management of primary renal sarcoma with Mayo IV tumor thrombus using moderate hypothermic circulatory arrest and antegrade cerebral perfusion: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They progress rapidly and are resistant to radiotherapy and chemotherapy.
      Currently, surgery is the only effective treatment.
    explanation: >-
      Directly supports the therapeutic corollary of this node - resistance to
      both radiotherapy and chemotherapy, leaving surgery as the only effective
      treatment.
  - reference: PMID:32491531
    reference_title: Renal Leiomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a high tendency for local recurrence; hence, complete surgical
      excision is recommended.
    explanation: >-
      Supports complete surgical excision as the management principle and local
      recurrence as the failure mode when it is not achieved.
  - reference: PMID:38693188
    reference_title: "Epidemiology, treatment and outcomes of primary renal sarcomas in adult patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal sarcoma treatment patterns follow recommendations by renal cancer
      guidelines with surgical resection as the cornerstone of therapy.
    explanation: >-
      Confirms surgical resection as the cornerstone of therapy, and documents
      that practice is guided by renal cancer guidelines even though the tumours
      behave as soft-tissue sarcomas - the mismatch this node explains.
- name: Diagnostic Confusion with Sarcomatoid Renal Cell Carcinoma
  biological_scale: TISSUE
  description: >-
    A distinct pathological node rather than a clinical aside, because the two
    entities converge morphologically from opposite directions. A renal sarcoma
    is a mesenchymal tumour that has always been mesenchymal; sarcomatoid renal
    cell carcinoma is an epithelial carcinoma that has undergone
    dedifferentiation to a spindle-cell morphology. On haematoxylin and eosin
    alone a high-grade spindle-cell renal mass is compatible with either, and the
    distinction rests on demonstrating epithelial differentiation - cytokeratin
    and EMA expression, or a recognisable carcinomatous component - which is
    present in sarcomatoid renal cell carcinoma and absent in a true sarcoma. The
    distinction is not academic: sarcomatoid renal cell carcinoma remains a
    carcinoma for therapeutic purposes and retains access to checkpoint-inhibitor
    combinations, whereas a renal sarcoma does not. Sarcomatoid renal cell
    carcinoma is also far commoner, so it is the default diagnosis a spindle-cell
    renal mass must be argued out of.
  evidence:
  - reference: PMID:32491531
    reference_title: Renal Leiomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the prognosis for a renal sarcoma is particularly poor,
      differentiation from sarcomatoid renal cell carcinoma is necessary.
    explanation: >-
      States the differential-diagnostic requirement this node models and the
      prognostic reason it matters.
  - reference: PMID:26902877
    reference_title: Comparison of oncologic outcomes between sarcomatoid and clear cell renal cell carcinoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sRCC was associated with a 3.2 higher risk of CSM compared with ccRCC
    explanation: >-
      Characterises the entity a renal sarcoma must be distinguished from -
      sarcomatoid renal cell carcinoma is itself an aggressive epithelial tumour,
      which is why morphology alone cannot separate them on clinical grounds.
      PARTIAL because the paper compares sarcomatoid to clear cell renal cell
      carcinoma and does not address primary renal sarcoma.

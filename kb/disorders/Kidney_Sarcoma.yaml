name: Kidney Sarcoma
creation_date: "2026-08-28T00:00:00Z"
description: >-
  Kidney sarcoma is a rare group of primary malignant mesenchymal neoplasms of
  the kidney, accounting for roughly 1-3% of adult renal malignancy. Unlike the
  renal cell carcinomas, which arise from tubular epithelium, these tumours arise
  from the non-epithelial compartments of the organ - the smooth muscle of the
  intrarenal vessels and renal pelvic wall, the renal capsule and perinephric
  connective tissue, the sinus fat, and the vascular endothelium. That
  mesenchymal origin is the entry's organising claim, and everything downstream
  of it follows: no epithelial differentiation means none of the VEGF- and
  mTOR-directed systemic framework built for renal cell carcinoma applies, and
  the tumours are correspondingly resistant to radiotherapy and conventional
  chemotherapy, leaving complete surgical resection as the only treatment that
  reliably changes outcome. Growing in the retroperitoneum, they distend rather
  than obstruct and so reach a large size before producing the non-specific triad
  of flank pain, haematuria and a palpable mass; renal vein and inferior vena
  cava invasion with early haematogenous dissemination is characteristic, and
  survival is markedly worse than for renal cell carcinoma of comparable stage.

  The category is broad: the largest registry series counts 43 histiotypes under
  the renal-sarcoma heading. This entry models the six that account for most
  reported disease - leiomyosarcoma (the commonest), liposarcoma, angiosarcoma
  (the most lethal), synovial sarcoma, rhabdomyosarcoma, and Ewing sarcoma - as
  `has_subtypes`, rather than as a `kb/groupings/` union. See
  `curation_scope_rationale` in the notes on the first pathophysiology node for
  why; briefly, the members share a genuine anatomic-and-clinical pathograph but
  not a driver, and the pan-site histology entries already in the knowledge base
  (Leiomyosarcoma, Liposarcoma, Angiosarcoma, Synovial_Sarcoma) are not scoped to
  the kidney, so a Grouping over them would mis-state their extent.

  Explicitly excluded: sarcomatoid renal cell carcinoma (an epithelial carcinoma
  with mesenchymal-appearing dedifferentiation, which is the principal
  differential and must be excluded by keratin/epithelial-marker
  immunohistochemistry before a primary renal sarcoma is diagnosed), Wilms
  tumour/nephroblastoma, and the paediatric renal tumours clear cell sarcoma of
  the kidney and rhabdoid tumour of the kidney, which have their own entries.
categories:
- Genitourinary Cancer
- Sarcoma
parents:
- kidney cancer
- sarcoma

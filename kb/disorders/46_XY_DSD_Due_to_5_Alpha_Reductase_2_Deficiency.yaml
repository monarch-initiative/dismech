notes: >-
  Management is individualized and should involve an experienced
  multidisciplinary DSD team. Sex-of-rearing decisions, gonadal management,
  genital surgery, fertility goals, gender identity, and timing of intervention
  require patient- and family-centered counseling. Evidence for androgen
  therapy and gonadal procedures is based largely on small observational series
  and must be interpreted accordingly.

    reference_title: Integrative and Analytical Review of the 5-Alpha-Reductase Type 2 Deficiency Worldwide.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5α-RD2 is a membrane-bound enzyme that catalyzes the irreversible conversion of testosterone into dihydrotestosterone using NADPH as cofactor."
    explanation: The review states the enzymatic reaction catalyzed by 5-alpha-reductase type 2.
  downstream:
  - target: Impaired Testosterone to Dihydrotestosterone Conversion
    causal_link_type: DIRECT
    description: >-

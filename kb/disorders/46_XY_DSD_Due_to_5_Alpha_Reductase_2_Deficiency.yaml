      explanation: Functional evidence in the review supports loss or severe reduction of enzyme activity.
- name: Reduced 5-Alpha-Reductase Type 2 Activity
  biological_scale: MOLECULAR
  description: >-
    Reduced 5-alpha-reductase type 2 activity impairs the NADPH-dependent
    conversion of testosterone to dihydrotestosterone.
  biological_processes:
  - preferred_term: androgen biosynthetic process
    term:

- name: Pubertal Testosterone Exposure
  biological_scale: ORGANISM
  description: >-
    During and after puberty, increased 5-alpha-reductase type 1 activity can
    convert testosterone to DHT despite the persistent type 2 defect. This
    alternative route can increase peripheral androgen-receptor signaling and
    contribute to pubertal virilization.
  biological_processes:
  - preferred_term: androgen receptor signaling pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:36216557
    reference_title: Longitudinal clinical course in patients with 5α-reductase type 2 deficiency treated with testosterone and dihydrotestosterone during infancy and puberty.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During and after puberty, T replacement therapy promoted penile enlargement possibly because of increased conversion of T to DHT via increased 5α-reductase type 1 activity even in patients in whom it was ineffective during infancy."
    explanation: The longitudinal series directly supports increased type 1 conversion as an alternative route for testosterone effects during and after puberty.
  downstream:
  - target: Pubertal Virilization
    causal_link_type: DIRECT
    description: >-
      Testosterone exposure at puberty contributes to virilization despite
      reduced DHT synthesis.
    evidence:
    - reference: PMID:32346305
      reference_title: Integrative and Analytical Review of the 5-Alpha-Reductase Type 2 Deficiency Worldwide.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "presenting with a wide range of genital ambiguity at birth and pronounced virilization at puberty."
      explanation: The review links the neonatal undervirilization phenotype with pronounced pubertal virilization.
- name: Pubertal Virilization
  biological_scale: ORGANISM
  description: >-
    Pubertal androgen exposure may produce deepening of the voice, phallic
    enlargement, increased muscle mass, and other virilizing changes.
  evidence:
  - reference: PMID:32346305
    reference_title: Integrative and Analytical Review of the 5-Alpha-Reductase Type 2 Deficiency Worldwide.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, affected individuals presented virilization (clinical and psychological) at puberty"
    explanation: The worldwide review describes pubertal virilization as a typical presentation.
  - reference: PMID:28690896
    reference_title: Late Diagnosis of 5-α-Reductase Type 2 Deficiency in an Adolescent Girl with Primary Amenorrhoea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "virilisation at puberty, including deepening of the vocal tone, phallus enlargement, scrotal hyperpigmentation and increased muscle mass."
    explanation: The case report directly supports the specific physical changes listed for pubertal virilization.
  downstream:
  - target: Pubertal virilization
    causal_link_type: DIRECT
    description: Pubertal androgen exposure produces the reported virilization phenotype.
    evidence:
    - reference: PMID:32346305
      reference_title: Integrative and Analytical Review of the 5-Alpha-Reductase Type 2 Deficiency Worldwide.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "pronounced virilization at puberty."
      explanation: The worldwide review supports pubertal virilization as a characteristic feature.
  - target: Abnormality of the voice
    causal_link_type: DIRECT
    description: Pubertal virilization can include deepening of the voice.
    evidence:
    - reference: PMID:28690896
      reference_title: Late Diagnosis of 5-α-Reductase Type 2 Deficiency in an Adolescent Girl with Primary Amenorrhoea.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "virilisation at puberty, including deepening of the vocal tone"
      explanation: The case report documents vocal deepening as part of pubertal virilization.

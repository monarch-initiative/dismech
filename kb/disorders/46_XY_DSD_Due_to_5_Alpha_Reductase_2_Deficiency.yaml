treatments:
- name: Testosterone or Dihydrotestosterone Therapy for Penile Enlargement
  description: >-
    Testosterone or transdermal dihydrotestosterone may be used for penile
    enlargement in affected individuals with micropenis. Small longitudinal
    series support DHT during infancy and testosterone during or after puberty;
    response varies, and post-pubertal DHT requires attention to prostate growth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: hormone therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
    therapeutic_agent:
    - preferred_term: dihydrotestosterone
      term:
        id: CHEBI:16330
        label: 17beta-hydroxy-5alpha-androstan-3-one
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_phenotypes:
  - preferred_term: Micropenis
    term:
      id: HP:0000054
      label: Micropenis
  target_mechanisms:
  - target: Impaired Testosterone to Dihydrotestosterone Conversion
    treatment_effect: BYPASSES
    description: >-
      DHT supplies the deficient downstream androgen directly, while pubertal
      testosterone can support penile growth through alternative conversion and
      preserved androgen-receptor signaling.
    evidence:
    - reference: PMID:36216557
      reference_title: Longitudinal clinical course in patients with 5α-reductase type 2 deficiency treated with testosterone and dihydrotestosterone during infancy and puberty.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "During and after puberty, T replacement therapy promoted penile enlargement possibly because of increased conversion of T to DHT via increased 5α-reductase type 1 activity even in patients in whom it was ineffective during infancy."
      explanation: The longitudinal series directly supports alternative type 1 conversion as a pubertal bypass of deficient type 2 conversion.
  evidence:
  - reference: PMID:36216557
    reference_title: Longitudinal clinical course in patients with 5α-reductase type 2 deficiency treated with testosterone and dihydrotestosterone during infancy and puberty.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T replacement therapy during infancy increased the stretched penile length (SPL) in three of the patients but was ineffective in one patient. DHT was administered to the three patients after T replacement therapy and further increased the SPL."
    explanation: A four-patient longitudinal series supports penile growth with variable testosterone response and additional response to DHT.
  - reference: PMID:31178538
    reference_title: Effects of pre- and post-pubertal dihydrotestosterone treatment on penile length in 5α-reductase type 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For prepubertal micropenis, DHT was transdermally applied to the four patients at the ages of 4-11 year, increasing a median of stretched penile lengths (SPLs) from 2.6 cm (-2.5 SD) to 4.4 cm (-0.2 SD)."
    explanation: The case series quantifies prepubertal penile growth after transdermal DHT.
  - reference: PMID:31178538
    reference_title: Effects of pre- and post-pubertal dihydrotestosterone treatment on penile length in 5α-reductase type 2 deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the retarded penile growth and a risk of prostate overgrowth may complicate the post-pubertal management with DHT for 5αRD2 males."
    explanation: The same small series supplies the post-pubertal efficacy and prostate-growth caveat.
- name: Gonadectomy
  description: >-
    One case report proposed early gonadectomy or testis descent after finding
    Ki67-positive germ cells in excised testes. This limited evidence does not
    establish a general gonadectomy recommendation; decisions require
    individualized multidisciplinary counseling and the patient's goals.
  therapeutic_modality: SURGERY
  treatment_term:

diagnosis:
- name: Morning ACTH and cortisol measurement
  description: >-
    Low or undetectable cortisol together with low plasma ACTH, measured in the
    morning or during spontaneous hypoglycemia, with normal results for the
    other anterior pituitary axes.
  evidence:
  - reference: PMID:27535729
    reference_title: "Neonatal isolated ACTH deficiency (IAD): a potentially life-threatening but treatable cause of neonatal cholestasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other hormone levels (luteinising hormone, follicle stimulating hormone, growth hormone, insulin-like growth factor 1, testosterone, thyroid-stimulating hormone, T4, T3) were within normal limits."
    explanation: Other pituitary axes are normal in a TBX19-confirmed case, establishing the isolated deficiency.
- name: ACTH and CRH stimulation testing
  description: >-
    Cortisol fails to rise after a single ACTH injection but can rise after
    repeated ACTH injections, while CRH elicits no response, localizing the
    defect to the corticotroph.
  evidence:
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients did not show a cortisol response to acute injection of ACTH (Table 1), but in two cases (patients 2 and 3), repeated ACTH injection was found to significantly increase cortisol, indicating that adrenal function may be restored upon multiple challenges with ACTH."
    explanation: Characteristic response pattern to ACTH testing.
- name: Maternal serum estriol on prenatal screening
  description: >-
    An isolated low maternal unconjugated estriol on the triple-marker screen,
    with normal fetal ultrasound and after exclusion of steroid sulfatase
    deficiency and Smith-Lemli-Opitz syndrome, reflects deficient fetal adrenal
    steroidogenesis and has been reported as a prenatal clue in a TPIT-mutant
    pregnancy.
  notes: >-
    Bound to the Part code for the analyte rather than a quantitative or
    [Multiple of the median] variant, since this entry's claim is a
    qualitatively low value rather than a specific number or MoM threshold.
    No panel code exists for unconjugated estriol alone (unlike AFP); the
    triple-marker screen panel this analyte is part of is not bound here
    since the claim is specifically about the estriol component, isolated
    from the other two markers.

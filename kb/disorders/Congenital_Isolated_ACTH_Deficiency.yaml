genetic:
- name: TBX19
  gene_term:
    preferred_term: TBX19
    term:
      id: hgnc:11596
      label: TBX19
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TBX19 (formerly TPIT) lies on chromosome 1q24.2 and its main transcript
    (NM_005149.3) has eight exons. TBX19 variants are found in about two thirds
    of neonatal-onset complete isolated ACTH deficiency and have not been found
    in partial or later-onset forms. No ClinGen gene-disease validity record for
    TBX19 is present in the repository's ClinGen cache.
  case_fractions:

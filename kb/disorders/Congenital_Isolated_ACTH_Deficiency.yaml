    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of pituitary/adrenal function in IAD patients with TPIT mutations (Table 1) showed decreased/undetectable baseline plasma levels of ACTH and cortisol."
    explanation: Patients with TPIT mutations have low or undetectable cortisol together with low ACTH.
  downstream:

references:
- reference: ORPHA:199296
  title: Congenital isolated ACTH deficiency
datasets: []
notes: >-
  Scope. MONDO:0008720 (OMIM 201400, ORPHA:199296) names congenital isolated
  ACTH deficiency generally; Orphanet and OMIM attach a single causal gene,
  TBX19, and this entry describes the TBX19 neonatal-onset form. About one
  third of neonatal-onset complete IAD, and all reported partial or late-onset
  childhood IAD, carry no TBX19 variant. Differential diagnoses with their own
  genes are POMC deficiency and PCSK1 (prohormone convertase 1) deficiency, in
  which ACTH deficiency is accompanied by early-onset obesity; both are covered
  as gene subtypes of Obesity_Due_to_MC4R_Pathway_Disruption rather than here.
  ACTH deficiency within combined pituitary hormone deficiency is a separate
  disorder, as is DAVID syndrome (heterozygous NFKB2 variants, ACTH deficiency
  with common variable immunodeficiency), curated as a subtype of
  Common_Variable_Immunodeficiency. Familial glucocorticoid deficiency differs
  by its high ACTH and hyperpigmentation. MONDO lists combined pituitary hormone deficiencies, genetic form
  (MONDO:0013099) and isolated congenital hypogonadotropic hypogonadism
  (MONDO:0016553) as the parents of MONDO:0008720; neither describes an
  isolated corticotroph defect, so the free-text parents here are adrenal
  insufficiency and hypopituitarism. Orphanet notes that partial growth hormone
  deficiency is sometimes associated. Single case reports describe mild facial
  dysmorphism, tall stature, low bone mineral density or Chiari type 1
  malformation in TBX19 patients; these associations are not established and
  are not curated as phenotypes. No prevalence estimate has been published.
  No GeneReviews chapter covers this disorder (Bookshelf index snapshot
  2026-09-10 and a live PubMed title search).

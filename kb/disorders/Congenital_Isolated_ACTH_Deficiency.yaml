name: Congenital Isolated ACTH Deficiency
creation_date: "2026-10-15T01:35:55Z"
category: Mendelian
disease_term:
  preferred_term: congenital isolated adrenocorticotropic hormone deficiency
  term:
    id: MONDO:0008720
    label: congenital isolated adrenocorticotropic hormone deficiency
parents:
- Adrenal Insufficiency
- Hypopituitarism
synonyms:
- congenital isolated adrenocorticotropic hormone deficiency
- isolated ACTH deficiency
- isolated adrenocorticotropic hormone deficiency
- ACTH deficiency, isolated
- IAD
- TBX19 deficiency
- TPIT deficiency
description: >-
  Congenital isolated ACTH deficiency is an autosomal recessive form of
  secondary (central) adrenal insufficiency in which the anterior pituitary
  fails to produce adrenocorticotropin (ACTH) while every other pituitary
  hormone axis is preserved and pituitary imaging is normal. This entry is
  scoped to the neonatal-onset form caused by biallelic loss-of-function
  variants in TBX19 (TPIT), a T-box transcription factor expressed only in the
  pituitary pro-opiomelanocortin (POMC) lineages. Without TBX19, corticotroph
  precursors form but cannot complete terminal differentiation or express
  POMC, so ACTH is absent, the adrenal cortex is understimulated and becomes
  hypoplastic, and cortisol is deficient from birth. Affected neonates present
  with severe hypoglycemia, often with seizures, prolonged cholestatic jaundice,
  and a high risk of sudden neonatal death; an earlier sibling's unexplained
  neonatal death is a common feature of the family history. Mineralocorticoid
  secretion is preserved, so hyperkalemia is not a feature. Lifelong
  glucocorticoid replacement with hydrocortisone, with stress dosing, reverses
  the metabolic and hepatic features, and early treatment allows normal growth
  and development.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for TBX19
    loss-of-function variants, and their parents are unaffected heterozygous
    carriers. Consanguinity is frequent in reported families.
  evidence:
  - reference: PMID:15613420
    reference_title: "Congenital isolated adrenocorticotropin deficiency: an underestimated cause of neonatal death, explained by TPIT gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients appeared to be homozygous or compound heterozygous for TPIT mutations, and their unaffected parents are heterozygous carriers, confirming a recessive mode of transmission."
    explanation: Biallelic variants in patients with heterozygous unaffected parents establish autosomal recessive transmission.
  - reference: PMID:22170728
    reference_title: Phenotypic homogeneity and genotypic variability in a large series of congenital isolated ACTH-deficiency patients with TPIT gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients are homozygous or compound heterozygous for TPIT mutations, and their parents are healthy heterozygous carriers."
    explanation: The largest reported series confirms recessive inheritance with healthy heterozygous carriers.
pathophysiology:
- name: TBX19 Biallelic Loss of Function
  description: >-
    Biallelic germline TBX19 variants abolish the function of the T-box
    transcription factor TPIT. Reported alleles include nonsense and frameshift
    variants that trigger nonsense-mediated mRNA decay, splice-site and exonic
    synonymous variants that cause missplicing, multi-exon deletions, and
    missense variants within the T-box that abolish DNA binding or disrupt
    protein-protein interactions with PITX1 and coactivators.
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous loss-of-function TBX19 alleles.
  genes:
  - preferred_term: TBX19
    term:
      id: hgnc:11596
      label: TBX19
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:22170728
    reference_title: Phenotypic homogeneity and genotypic variability in a large series of congenital isolated ACTH-deficiency patients with TPIT gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TPIT mutations lead to loss of function by different mechanisms, such as non-sense-mediated mRNA decay, abnormal mRNA splicing, loss of TPIT DNA binding or protein-protein interaction defects."
    explanation: Summarizes the loss-of-function mechanisms of the patient alleles.
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The S128F and I171T mutations were found to be completely devoid of activity in transfected cells (Fig. 3C,E) and to have no in vitro DNA-binding activity (Fig. 3D,F)."
    explanation: Transfection and gel-shift assays show patient missense alleles lose transcriptional and DNA-binding activity.
  - reference: PMID:17652218
    reference_title: "The TPIT gene mutation M86R associated with isolated adrenocorticotropin deficiency interferes with protein: protein interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the M86 residue is located within the T-box DNA-binding domain, it did not affect monomer DNA-binding activity per se, but it impaired DNA binding with other DNA-bound proteins, including itself (homodimers) and pituitary homeobox 1 (Pitx1)."
    explanation: A missense allele can cause loss of function by disrupting cooperative binding with PITX1 rather than monomer DNA binding.
  - reference: PMID:34564059
    reference_title: Missplicing due to a synonymous, T96= exonic substitution in the T-box transcription factor TBX19 resulting in isolated ACTH deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The effect of this was assessed by an in vitro splicing assay, which revealed aberrant splicing of exon 2 giving rise to a mutant mRNA transcript whereas the WT vector spliced exon 2 normally."
    explanation: A synonymous exonic variant causes loss of function through missplicing, widening the allelic spectrum.
  downstream:
  - target: Loss of TPIT-PITX1 Activation of POMC Transcription
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39776042
      reference_title: Functional study of three cases with novel TBX19 variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A functional study showed that the variants in our study result in a significant suppression of POMC transcriptional activity compared to wild-type TBX19."
      explanation: Patient TBX19 variants directly reduce POMC promoter activity in reporter assays.
- name: Loss of TPIT-PITX1 Activation of POMC Transcription
  description: >-
    In pituitary POMC-lineage cells TPIT binds a POMC regulatory element next to
    the homeoprotein PITX1, and the two factors cooperate to activate POMC
    transcription. TPIT is not expressed in hypothalamic POMC neurons or in
    other tissues, so its loss removes POMC expression specifically from the
    pituitary while sparing extra-pituitary POMC.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: corticotroph
    term:
      id: CL:0002309
      label: corticotroph
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:11290323
    reference_title: "A pituitary cell-restricted T box factor, Tpit, activates POMC transcription in cooperation with Pitx homeoproteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In pituitary cells, Tpit activation of POMC gene transcription requires cooperation with Pitx1, the two factors binding to contiguous sites within the same regulatory element."
    explanation: Establishes that TPIT activates POMC transcription together with PITX1.
  - reference: PMID:11290323
    reference_title: "A pituitary cell-restricted T box factor, Tpit, activates POMC transcription in cooperation with Pitx homeoproteins."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identified Tpit, a novel T box factor only present in the two pituitary POMC-expressing lineages, the corticotrophs and melanotrophs, and apparently in no other tissue, including hypothalamic POMC neurons."
    explanation: The restricted expression of TPIT explains why the deficiency is confined to pituitary POMC.
  - reference: PMID:39776042
    reference_title: Functional study of three cases with novel TBX19 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TBX19 and PITX1 cooperated, resulting in a strong synergistic activation effect on POMC transcriptional expression."
    explanation: Confirms the TBX19-PITX1 synergy on the POMC promoter with the human protein.
  downstream:
  - target: Arrested Corticotroph Terminal Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12651888
      reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Tpit-deficient mice revealed that pituitary POMC cells do not reach terminal differentiation (POMC expression) but that precursors of POMC cells still form in absence of this factor (Pulichino et al. 2003)."
      explanation: Terminal differentiation of the POMC lineage is defined by and depends on TPIT-driven POMC expression.
- name: Arrested Corticotroph Terminal Differentiation
  description: >-
    TPIT is required for late differentiation of the POMC lineage but not for
    lineage commitment. In its absence, presumptive corticotrophs are present at
    about normal abundance and express early markers such as NeuroD1, but they
    do not reach terminal differentiation, so the anterior pituitary is left with
    very few ACTH-producing cells. In the mouse intermediate lobe, cells destined
    to be melanotrophs instead become gonadotrophs; the human intermediate lobe
    regresses during fetal life, so this fate switch has no clear human
    counterpart.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: corticotroph
    term:
      id: CL:0002309
      label: corticotroph
  biological_processes:
  - preferred_term: corticotropin hormone secreting cell differentiation
    term:
      id: GO:0060128
      label: corticotropin hormone secreting cell differentiation
    modifier: DECREASED
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  evidence:
  - reference: PMID:12651892
    reference_title: Tpit determines alternate fates during pituitary cell differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tpit is a positive regulator for late POMC cell differentiation and POMC expression, but it is not essential for lineage commitment."
    explanation: Tpit knockout mice show that TPIT acts at the terminal step of POMC-lineage differentiation.
  - reference: PMID:12651892
    reference_title: Tpit determines alternate fates during pituitary cell differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "showing that the presumptive corticotroph cells are present (at about normal abundance) but are not able to reach terminal differentiation (POMC expression)."
    explanation: Corticotroph precursors persist but cannot complete differentiation without TPIT.
  - reference: PMID:12651892
    reference_title: Tpit determines alternate fates during pituitary cell differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of the Tpit gene results in almost complete loss of POMC-expressing cells in this tissue, which now has a large number of gonadotrophs and a few clusters of Pit-1-independent thyrotrophs."
    explanation: In the mouse intermediate lobe, loss of TPIT also redirects precursors to the gonadotroph fate.
  downstream:
  - target: Pituitary ACTH Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12651888
      reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Because Tpit mutant mice have very few remaining POMC (ACTH)-positive pituitary cells (Pulichino et al. 2003), we measured plasma ACTH levels in these mice."
      explanation: The near absence of POMC-positive cells is the basis for the low circulating ACTH measured in Tpit-null mice.
- name: Pituitary ACTH Deficiency
  description: >-
    Plasma ACTH is low or undetectable and CRH does not raise it. Other anterior
    pituitary hormones (GH, TSH, gonadotropins, prolactin) are produced normally
    and the pituitary is structurally normal, which separates this disorder from
    combined pituitary hormone deficiencies. Autopsy of an affected neonate
    showed a pituitary of normal morphology lacking ACTH immunoreactivity.
  biological_scale: ORGANISM
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  evidence:
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous (−/−) mutant mice have very low, albeit detectable, plasma ACTH levels, whereas wild-type (+/+) and heterozygous (+/−) mice have similar normal levels (Fig. 1A)."
    explanation: Tpit-null mice reproduce the ACTH deficiency.
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, acute or repeated treatment with CRH never elicited a response (Table 1, patients 2, 3, 5 and 6)."
    explanation: Absent response to CRH in patients localizes the defect to the pituitary corticotroph.
  - reference: PMID:22170728
    reference_title: Phenotypic homogeneity and genotypic variability in a large series of congenital isolated ACTH-deficiency patients with TPIT gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital isolated ACTH deficiency (IAD) is a rare disease characterized by low plasma ACTH and cortisol levels and preservation of all other pituitary hormones."
    explanation: Defines the isolated character of the pituitary deficiency.
  downstream:
  - target: Glucocorticoid Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12651888
      reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Pituitary ACTH is the major stimulus for production of adrenal glucocorticoids and this action constitutes an important part of the hypothalamo-pituitary-adrenal axis."
      explanation: Loss of the main trophic stimulus of glucocorticoid production leads directly to glucocorticoid deficiency.
  - target: Adrenal Cortex Hypoplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12651888
      reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results are clearly in support of a role of POMC-derived peptides in maintenance of adrenal tissue."
      explanation: Adrenal hypoplasia in ACTH-deficient Tpit-null mice shows the trophic dependence of the adrenal cortex on pituitary POMC peptides.
  - target: Decreased circulating ACTH concentration
    causal_link_type: DIRECT
- name: Adrenal Cortex Hypoplasia
  description: >-
    Chronic lack of ACTH trophic drive leaves the adrenal cortex hypoplastic,
    with the greatest loss in the glucocorticoid-producing zona fasciculata.
    The adrenals can still respond partially to repeated ACTH injections, showing
    that the gland is understimulated rather than intrinsically defective.
  biological_scale: TISSUE
  locations:
  - preferred_term: zona fasciculata of adrenal gland
    term:
      id: UBERON:0002054
      label: zona fasciculata of adrenal gland
  evidence:
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, adrenal glands were found to be hypoplastic, with the most significant loss at the level of the glucocorticoid-producing fasciculata layer (Fig. 1C)."
    explanation: Tpit-null mice show adrenal hypoplasia centered on the zona fasciculata.
  - reference: PMID:12651888
    reference_title: Human and mouse TPIT gene mutations cause early onset pituitary ACTH deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients did not show a cortisol response to acute injection of ACTH (Table 1), but in two cases (patients 2 and 3), repeated ACTH injection was found to significantly increase cortisol, indicating that adrenal function may be restored upon multiple challenges with ACTH."
    explanation: The adrenal defect in patients is secondary and partly reversible with repeated ACTH.
  downstream:
  - target: Glucocorticoid Deficiency
    causal_link_type: DIRECT
  - target: Adrenal hypoplasia
    causal_link_type: DIRECT
- name: Glucocorticoid Deficiency
  description: >-
    Cortisol is low or undetectable from birth. Glucocorticoid deficiency
    removes cortisol support of fasting glucose production and of hepatic and
    vascular function; this is the proximal cause of the neonatal hypoglycemia,
    the prolonged cholestatic jaundice and the risk of fatal adrenal crisis.
    Deficient fetal adrenal steroidogenesis can also lower maternal serum
    estriol during pregnancy.
  biological_scale: ORGANISM
  biological_processes:

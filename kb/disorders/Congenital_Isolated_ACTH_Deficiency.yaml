    evidence_source: MODEL_ORGANISM
    snippet: "The impact of low plasma ACTH on adrenal function was next assessed, and we observed undetectable plasma corticosterone in homozygous mutant, but not in wild-type or heterozygous mice (Fig. 1B)."
    explanation: Tpit-null mice have absent glucocorticoid production.
  - reference: PMID:12651888

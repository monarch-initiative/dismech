- name: Distributive Shock and Multi-Organ Dysfunction
  description: >-
    Refractory hypotension with tissue hypoperfusion, together with direct
    cytokine-mediated injury and coagulation activation, produces the multisystem
    failure that defines the syndrome: acute kidney injury, hepatic dysfunction,
    thrombocytopenia and disseminated intravascular coagulation, rhabdomyolysis, acute
    respiratory distress, and encephalopathy.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:

  description: >-
    Superantigen-producing Staphylococcus aureus strains cause staphylococcal toxic
    shock syndrome. The organism frequently colonizes rather than overtly infects the
    portal of entry, and blood cultures are often negative.
  evidence:
  - reference: PMID:38247655

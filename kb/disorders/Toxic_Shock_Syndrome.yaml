animal_models:
- name: Rabbit superantigen challenge model
  species: Rabbit
  genotype: Wild type
  description: >-
    The rabbit is the standard experimental model for TSS because its sensitivity to
    staphylococcal and streptococcal superantigens is comparable to that of humans,
    unlike wild-type mice whose MHC class II binds these toxins poorly. Challenge with
    TSST-1 and structure-guided mutants was used to dissect which binding interface
    drives toxicity.
  publication: PMID:22069685
  evidence:
  - reference: PMID:22069685
    reference_title: "Staphylococcal superantigen (TSST-1) mutant analysis reveals that t cell activation is required for biological effects in the rabbit including the cytokine storm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Staphylococcal superantigens (sAgs), such as toxic shock syndrome toxin 1
      (TSST-1), induce massive cytokine production, which may result in toxic shock
      syndrome (TSS) and sepsis.
    explanation: >-
      Establishes that the superantigen challenge this model administers reproduces the
      massive cytokine production underlying toxic shock syndrome, which is what makes
      the model informative for the disease.
  modeled_mechanisms:
  - target: Massive Polyclonal T Cell Activation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Comparison of a TSST-1 mutant with reduced MHC binding against one with abolished
      T cell receptor binding isolates the T cell activation step and shows it is
      required for the toxic phenotype.
    limitations: >-
      The model delivers purified toxin by direct challenge rather than reproducing
      toxin elaboration by a colonizing organism, and does not capture the human
      menstrual or wound microenvironment in which superantigen is naturally produced.
      Co-treatment with lipopolysaccharide is used to elicit the full inflammatory
      response.
    readouts:
    - name: Lymphocyte proliferation and IL-2 gene expression after in vivo toxin challenge
      target: Massive Polyclonal T Cell Activation
      direction: INCREASED
      interpretation: >-
        Read as the T cell activation output of superantigen challenge; abolished when
        the T cell receptor binding site is mutated.
      evidence:
      - reference: PMID:22069685
        reference_title: "Staphylococcal superantigen (TSST-1) mutant analysis reveals that t cell activation is required for biological effects in the rabbit including the cytokine storm."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          T cell activation has been assessed by lymphocyte proliferation and IL-2 gene
          expression after in vivo challenge with TSST-1 and the mutant antigens
        explanation: >-
          States the specific readouts used to measure T cell activation in this model.
    evidence:
    - reference: PMID:22069685
      reference_title: "Staphylococcal superantigen (TSST-1) mutant analysis reveals that t cell activation is required for biological effects in the rabbit including the cytokine storm."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our experimental model of choice is the rabbit because it is comparable to
        humans in its sensitivity to sAg.
      explanation: >-
        Justifies the rabbit as informative for human superantigen biology on the basis
        of comparable superantigen sensitivity.
discussions:
- discussion_id: ivig_mortality_benefit_tss
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does adjunctive intravenous immunoglobulin reduce mortality in streptococcal toxic
    shock syndrome?
  attaches_to:
  - pathophysiology#Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
  rationale: >-
    The mechanistic rationale is strong and specific: pooled donor immunoglobulin should
    neutralize circulating superantigen and so interrupt the MHC class II/TCR bridging
    step this entry models as the initiating molecular event. The clinical evidence does
    not settle the question. A systematic review and meta-analysis restricted to
    clindamycin-treated streptococcal TSS reported mortality falling from 33.7% to 15.7%
    with consistency across one randomized and four non-randomized studies, whereas a
    Japanese nationwide observational study of 481 patients with invasive group A
    streptococcal infection found no effect on in-hospital mortality after adjustment or
    after propensity-score matching. The two are not straightforwardly comparable: the
    positive estimate is conditioned on concurrent clindamycin and confined to
    streptococcal TSS, while the null result covers invasive group A streptococcal
    infection broadly, and its own authors caution against extrapolating to
    streptococcal TSS. Disease rarity makes an adequately powered randomized trial
    difficult. The treatment entry therefore carries both a SUPPORT and a REFUTE
    evidence item rather than a single adjudicated verdict.
  evidence:
  - reference: PMID:37586661
    reference_title: "Effectiveness of intravenous immunoglobulin therapy for invasive group A Streptococcus infection: A Japanese nationwide observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, these overall findings should not be extrapolated to streptococcal toxic
      shock syndrome as the effect of IVIG therapy in this condition remains uncertain.
    explanation: >-
      The null-result authors themselves state that the effect in streptococcal TSS
      remains uncertain, which is the open question recorded here.

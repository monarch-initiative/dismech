    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A repetitive cycle of cell stimulation and cytokine release results in a cytokine
      avalanche that causes tissue damage, disseminated intravascular coagulation, and
      organ dysfunction.
    explanation: >-
      Describes the self-amplifying cytokine cascade and links it to the tissue damage,

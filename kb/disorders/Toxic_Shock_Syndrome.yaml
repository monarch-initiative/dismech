definitions:
- name: CDC clinical case definition for toxic shock syndrome
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The US Centers for Disease Control and Prevention case definition for staphylococcal
    TSS requires fever, a diffuse macular erythroderma, desquamation one to two weeks
    after rash onset, hypotension, and involvement of at least three organ systems from
    the gastrointestinal, muscular, mucous-membrane, renal, hepatic, hematologic and
    central nervous system categories. Because desquamation appears only during
    convalescence, a confirmed case is often only assignable retrospectively, which
    limits the definition's usefulness at the bedside.
  evidence:
  - reference: PMID:31151811
    reference_title: "Menstrual toxic shock syndrome: case report and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was confirmed by fulfilment of the clinical criteria outlined by
      the US Centers for Disease Control and Prevention (CDC; fever, rash,
      desquamation, hypotension, and multi-system involvement)
    explanation: >-
      Enumerates the five CDC clinical criteria that constitute this case definition.
  - reference: PMID:31151811
    reference_title: "Menstrual toxic shock syndrome: case report and systematic review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the CDC criteria have appreciable limitations in everyday clinical practice.
    explanation: >-
      Supports the recorded caveat that the case definition, designed for surveillance,
      performs imperfectly as a bedside diagnostic instrument.
diagnosis:
- name: Culture of the suspected focus and sterile sites
  description: >-
    Blood, wound, and mucosal-site cultures are obtained. In streptococcal TSS
    Streptococcus pyogenes is frequently recovered from a normally sterile site, which
    is required for a confirmed case; in staphylococcal TSS blood cultures are often
    negative because the organism remains at a colonized surface while the toxin acts
    systemically.

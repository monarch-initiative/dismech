      burst. Marked PARTIAL because this is a murine macrophage system addressing one
      cellular contributor rather than the systemic human cytokine storm.
- name: Endothelial Injury and Capillary Leak
  description: >-
    Cytokine-driven endothelial activation, compounded by direct superantigen action on
    endothelial cells, causes upregulation of adhesion molecules, loss of monolayer
    barrier function, plasma extravasation into the interstitium, hypoalbuminemia and
    loss of effective intravascular volume.
  biological_scale: TISSUE
  downstream:
  - target: Distributive Shock and Multi-Organ Dysfunction
    description: >-
      Capillary leak plus cytokine-mediated vasodilation produces refractory
      hypotension.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in a massive release of proinflammatory cytokines, with clinical
        signs, such as capillary leakage, arterial hypotension, organ failure, and
        coagulation activation, usually being reported in this setting
      explanation: >-
        Reports capillary leakage together with arterial hypotension and organ failure,
        supporting the progression from leak to shock this edge encodes.

genetic:
- name: HLA-DRB1
  association: >-
    HLA class II genotype is the best-characterized human genetic modifier of TSS
    susceptibility. It does not cause disease directly; it sets the magnitude of the
    anti-TSST-1 antibody response, and therefore whether a host can neutralize the
    superantigen on exposure. HLA-DRB1*03:01 is positively associated with anti-TSST-1
    antibody levels, whereas HLA-DRB1*01:01 is negatively associated.
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:37731490
    reference_title: "Toxin exposure and HLA alleles determine serum antibody binding to toxic shock syndrome toxin 1 (TSST-1) of Staphylococcus aureus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the anti-TSST-1 antibody levels were strongly associated with HLA class
      II gene loci.
    explanation: >-
      Genome-wide association analysis in 976 population-based participants showing HLA
      class II loci govern the anti-TSST-1 antibody response that determines
      susceptibility.
- name: HLA-DQB1
  association: >-
    HLA-DQB1*02:01 is positively and HLA-DQB1*05:01 negatively associated with
    anti-TSST-1 antibody levels, acting with HLA-DRB1 as a susceptibility modifier
    through the humoral antitoxin response rather than through any direct disease
    mechanism.
  gene_term:

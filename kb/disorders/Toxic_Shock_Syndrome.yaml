name: Toxic Shock Syndrome
creation_date: '2026-08-11T00:00:00Z'
description: >-
  Toxic shock syndrome (TSS) is an acute, life-threatening, toxin-mediated multisystem
  illness caused by superantigen-producing strains of Staphylococcus aureus or
  Streptococcus pyogenes. Superantigen exotoxins bind major histocompatibility complex
  class II molecules outside the conventional peptide-binding groove and simultaneously
  engage the variable beta chain of the T cell receptor, bypassing antigen processing
  and driving polyclonal activation of a large fraction of the T cell repertoire. The
  resulting cytokine storm produces capillary leak, refractory hypotension, and
  multi-organ dysfunction, with the characteristic diffuse erythroderma and late
  palmoplantar desquamation.
category: Infectious Disease
disease_term:
  preferred_term: toxic shock syndrome
  term:
    id: MONDO:0001881
    label: toxic shock syndrome
parents:
- Bacterial infection
references:
- reference: PMID:38247655
  title: "Toxic Shock Syndrome: A Literature Review."
- reference: PMID:19393958
  title: "Gram-positive toxic shock syndromes."
has_subtypes:
- name: Staphylococcal TSS
  display_name: Staphylococcal toxic shock syndrome
  description: >-
    Toxic shock syndrome caused by Staphylococcus aureus superantigens, classically
    toxic shock syndrome toxin-1 (TSST-1) and the staphylococcal enterotoxins. It is
    subdivided clinically into menstrual TSS, historically linked to high-absorbency
    tampon use, and non-menstrual TSS arising from surgical wounds, burns, nasal
    packing, or postpartum infection. Case fatality is substantially lower than in the
    streptococcal form.
  subtype_term:
    preferred_term: staphylococcal toxic-shock syndrome
    term:
      id: MONDO:0020545
      label: staphylococcal toxic-shock syndrome
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Staphylococcal TSS can be menstrual or nonmenstrual.
    explanation: >-
      Supports the staphylococcal subtype and its menstrual/non-menstrual clinical
      division.
- name: Streptococcal TSS
  display_name: Streptococcal toxic shock syndrome
  description: >-
    Toxic shock syndrome caused by Streptococcus pyogenes superantigens, principally
    the streptococcal pyrogenic exotoxins and streptococcal superantigen A. It arises
    in the setting of a severe invasive group A streptococcal infection, most often a
    necrotizing soft tissue infection, and carries markedly higher mortality than
    staphylococcal TSS.
  subtype_term:
    preferred_term: streptococcal toxic-shock syndrome
    term:
      id: MONDO:0020544
      label: streptococcal toxic-shock syndrome
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcal TSS is linked to a severe group A streptococcal infection and,
      most frequently, to a necrotizing soft tissue infection.
    explanation: >-
      Supports the streptococcal subtype definition and its characteristic association
      with invasive necrotizing soft tissue infection.

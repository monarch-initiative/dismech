treatments:
- name: Source control
  description: >-
    Immediate removal of the inciting focus: withdrawal of a retained tampon, nasal
    packing or other foreign body, and emergent surgical debridement of infected or
    necrotic soft tissue in streptococcal disease. Source control removes the site of
    ongoing toxin elaboration and is repeatedly identified as one of the principal
    modifiable determinants of survival.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Superantigen Exotoxin Production
    description: >-
      Removing the colonized device or debriding necrotic tissue eliminates the niche in
      which superantigen is being produced.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        source control and eradication of toxin production
      explanation: >-
        Pairs source control directly with eradication of toxin production, the
        mechanism node this treatment targets.
  evidence:

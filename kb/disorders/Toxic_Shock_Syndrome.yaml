      label: Streptococcus pyogenes
  description: >-
    Group A Streptococcus causes streptococcal toxic shock syndrome, typically in the
    setting of documented invasive infection such as necrotizing fasciitis, where the
    organism is frequently recovered from a normally sterile site.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

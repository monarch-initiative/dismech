notes: >-
  Curated with the claude_code deep research provider. Two corrections were made to the
  provider's report during verification. It proposed HP:0031013 for strawberry tongue;
  that identifier is Ankylosis, and HP:0031042 was substituted after OAK lookup. It also
  reported that no MONDO identifier could be confirmed for TSS; MONDO:0001881 was found
  directly by OAK, with MONDO:0020545 and MONDO:0020544 for the staphylococcal and
  streptococcal subtypes. Every PMID cited by the report and used here was independently
  checked against PubMed and matched its stated topic. Phenotype evidence was repointed
  after review (PR #8321): several findings had initially been supported by a scope
  statement from the PMID:38247655 abstract, which asserts only that the review covers
  clinical presentation and so supports no individual phenotype. Those are now cited to
  enumerating sentences -- the Todd index case series in PMID:38247655 and PMID:32461307,
  the menstrual-TSS series in PMID:38247655, and the STSS case-ascertainment criteria in
  PMID:36456018. The muscular criterion was rewritten: "Severe Myalgia" and "Elevated
  Creatine Kinase" were merged into a single evidence-backed "Myositis" phenotype,
  because no source in the reference set states either myalgia or a creatine kinase
  threshold in TSS, while the STSS criteria name myositis explicitly. The `muscular`
  category remains among the organ systems enumerated in the `definitions` block, but
  that block names the category without stating its content, so severe myalgia and the
  creatine kinase threshold are recorded nowhere in this entry -- a deliberate gap
  rather than an oversight, and a target for a source that states them. No `frequency`
  band is asserted anywhere in this entry. Fever, rash,
  hypotension and desquamation are required criteria of the case definition, so their
  near-universal rate among confirmed cases is an ascertainment artifact rather than a
  measured frequency; per the frequency-evidence guidelines the band is omitted rather
  than justified circularly, and `diagnostic: true` carries the criterion status instead.

    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Toxic shock syndrome (TSS) is an acute, multi-system, toxin-mediated illness,
      often resulting in multi-organ failure.
    explanation: >-
      Supports multi-organ failure as the terminal manifestation of the toxin-mediated
      cascade.
- name: Bacterial Ribosomal Translation (Clindamycin/Linezolid Target)
  description: >-
    Both causative organisms depend on 70S-ribosome translation. Clindamycin (a
    lincosamide) and linezolid (an oxazolidinone) bind the 50S subunit and arrest
    bacterial protein synthesis. In TSS this target is pursued not primarily for
    bacterial killing, which the beta-lactam provides, but because the superantigens
    are themselves translated products.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source control,
      and administration on antimicrobial agents including drugs capable of suppressing
      toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Identifies clindamycin and linezolid, both ribosome-targeting protein synthesis
      inhibitors, as the specific agents used in TSS therapy.
- name: Suppression of Superantigen Synthesis by Protein-Synthesis Inhibitors
  description: >-
    Because TSST-1 and the streptococcal pyrogenic exotoxins are secreted proteins, a
    ribosome-targeting antibiotic suppresses their production independently of
    bacterial killing. This anti-toxin rationale is why clindamycin is added to a
    bactericidal beta-lactam in TSS rather than used as a substitute for it, and it is
    the mechanistic basis for the observed mortality association with adjunctive
    clindamycin in streptococcal disease.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Suppression of Toxin and Exoprotein Synthesis"
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source control,
      and administration on antimicrobial agents including drugs capable of suppressing
      toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Explicitly frames clindamycin and linezolid as agents capable of suppressing
      toxin production, which is the step this node represents.
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection, immediate
      resuscitation, source control and eradication of toxin production, bactericidal
      antibiotic treatment, and protein synthesis inhibiting antibiotic administration.
    explanation: >-
      Separates eradication of toxin production and protein-synthesis-inhibiting
      therapy from bactericidal therapy, matching the distinction between this node and
      the peptidoglycan cross-linking node.
- name: Ribosomal Target Resistance in Group A Streptococcus
  description: >-
    The anti-toxin rationale for adjunctive clindamycin is contingent on the organism
    remaining susceptible to it. Ribosomal-target resistance, principally erm-mediated
    rRNA methylation, is rising sharply in invasive group A Streptococcus: isolates
    non-susceptible to macrolides and clindamycin went from 12.7% to 33.1% over a
    decade of US surveillance. This is a direct and growing threat to the
    toxin-suppression step above, and is why susceptibility testing now gates the
    adjunct.
  biological_scale: MOLECULAR
  role: adaptive_escape
  conforms_to: "bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance"
  biological_processes:
  - preferred_term: response to antibiotic
    modifier: INCREASED
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:40193120
    reference_title: "Invasive Group A Streptococcal Infections in 10 US States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among tested isolates, those nonsusceptible to macrolides and clindamycin
      increased from 12.7% in 2013 to 33.1% in 2022.
    explanation: >-
      Population-based surveillance quantifying the rise in clindamycin
      non-susceptibility among invasive group A streptococcal isolates, the resistance
      step this node represents.
- name: Bacterial Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    Both Staphylococcus aureus and Streptococcus pyogenes build the peptidoglycan cell
    wall by penicillin-binding protein transpeptidase cross-linking. Beta-lactam
    acylation of the PBP active site halts cross-linking and is bactericidal. This is
    the target of the antistaphylococcal penicillin or cefazolin used for
    methicillin-susceptible staphylococcal TSS and of the penicillin used for
    streptococcal TSS; methicillin-resistant strains express an altered PBP and require
    vancomycin or linezolid instead.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection, immediate

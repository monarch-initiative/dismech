pathophysiology:
- name: Absent or Low Neutralizing Antitoxin Antibody
  description: >-
    Most adults acquire neutralizing antibody to TSST-1 through subclinical
    colonization. Individuals who lack such antibody at the time of toxin exposure are
    unable to neutralize the superantigen, and this deficit is the principal recognized
    host susceptibility determinant for staphylococcal TSS. Antibody levels are
    strongly determined by both the degree of colonization-driven toxin exposure and
    HLA class II genotype.
  biological_scale: ORGANISM
  role: susceptibility_factor
  downstream:
  - target: Superantigen Exotoxin Production
    description: >-
      Without neutralizing antitoxin, secreted superantigen reaches its host receptors
      and initiates the disease cascade.
    evidence:
    - reference: PMID:6491377
      reference_title: "Antibody responses to toxic-shock-syndrome (TSS) toxin by patients with TSS and by healthy staphylococcal carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The data suggest that absence of antibodies to the TSS toxin may be a
        predisposing factor in the development of clinical disease.
      explanation: >-
        Supports the predisposing direction of this edge: lacking antitoxin is what
        permits secreted superantigen to produce clinical disease.
  biological_processes:
  - preferred_term: humoral immune response
    modifier: DECREASED
    term:
      id: GO:0006959
      label: humoral immune response
  evidence:
  - reference: PMID:6491377
    reference_title: "Antibody responses to toxic-shock-syndrome (TSS) toxin by patients with TSS and by healthy staphylococcal carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data suggest that absence of antibodies to the TSS toxin may be a
      predisposing factor in the development of clinical disease.
    explanation: >-
      Case-control serology showing antitoxin levels are significantly lower in women
      with TSS than in controls, supporting absent antibody as a predisposing host
      factor.
  - reference: PMID:37731490
    reference_title: "Toxin exposure and HLA alleles determine serum antibody binding to toxic shock syndrome toxin 1 (TSST-1) of Staphylococcus aureus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A well-known risk factor is the lack of neutralizing antibodies.
    explanation: >-
      Population-based study confirming lack of neutralizing antibody as the recognized
      risk factor this node represents.
  - reference: PMID:20036064
    reference_title: "Toxic shock syndrome toxin-1 (TSST-1) antibody levels in Japanese children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children are at risk of developing staphylococcal toxic shock syndrome when their
      immune system is immature and they have no protective circulating anti-TSS
      antibodies.
    explanation: >-
      Age-stratified serology showing risk tracks the absence of circulating antitoxin,
      with maternally derived antibody protecting infants under six months and a
      susceptibility trough once it wanes. Direct support for antibody absence, rather
      than any intrinsic property of the toxin, being the permissive host state.
- name: Superantigen Exotoxin Production
  description: >-
    Toxigenic strains secrete superantigen exotoxins at the colonized or infected site.
    In staphylococcal disease the principal toxins are toxic shock syndrome toxin-1
    (TSST-1) and the staphylococcal enterotoxins; in streptococcal disease they are the
    streptococcal pyrogenic exotoxins A, B and C together with streptococcal
    superantigen A.
  biological_scale: MOLECULAR
  downstream:
  - target: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
    description: >-
      Secreted superantigen reaches host antigen-presenting cells and T cells at the
      site and systemically.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Superantigenic exotoxins are able to induce unconventional activation of T
        cells by antigen-presenting cells (APCs).
      explanation: >-
        States that the secreted exotoxins act by engaging antigen-presenting cells and
        T cells, which is the transition this edge encodes.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: ABNORMAL
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main described superantigenic exotoxins are toxic shock syndrome toxin-1
      (TSST-1) and enterotoxins for Staphylococcus aureus and Streptococcal pyrogenic
      exotoxins (SpE) A, B, and C and streptococcal superantigen A (SsA) for
      Streptococcus pyogenes.
    explanation: >-
      Enumerates the specific superantigen exotoxins produced by each causative
      organism, which is the content of this node.
- name: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
  description: >-
    The superantigen binds MHC class II on antigen-presenting cells outside the
    conventional peptide-binding groove and simultaneously engages the variable beta
    domain of the T cell receptor. This bridges the two cells without antigen
    processing or MHC restriction, so activation is determined by Vbeta usage rather
    than antigen specificity.
  biological_scale: MOLECULAR
  downstream:
  - target: Massive Polyclonal T Cell Activation
    description: >-
      Cross-linking delivers an activating signal to every T cell carrying a responsive
      Vbeta element.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TSS results from the ability of bacterial toxins to act as superantigens,
        stimulating immune-cell expansion and rampant cytokine expression in a manner
        that bypasses normal MHC-restricted antigen processing.
      explanation: >-
        Links the non-MHC-restricted binding mode directly to immune-cell expansion,
        which is the step this edge encodes.

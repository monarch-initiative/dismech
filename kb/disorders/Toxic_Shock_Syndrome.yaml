    explanation: >-
      Lists source control and eradication of toxin production as core components of
      emergency TSS management.
- name: Bactericidal beta-lactam antibiotic therapy
  description: >-
    A bactericidal agent directed at the causative organism: penicillin for group A
    Streptococcus, and an antistaphylococcal penicillin or cefazolin for
    methicillin-susceptible Staphylococcus aureus. Vancomycin or linezolid replaces the

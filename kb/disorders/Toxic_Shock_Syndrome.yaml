- name: Massive Polyclonal T Cell Activation
  description: >-
    Because activation is Vbeta-restricted rather than antigen-specific, a very large
    fraction of the circulating T cell repertoire is activated simultaneously, orders
    of magnitude more than in a conventional antigen-driven response. Mutational
    analysis in rabbits establishes that this T cell activation step is required for
    the downstream toxicity, not merely a correlate of it.
  biological_scale: CELLULAR
  downstream:
  - target: Systemic Cytokine Storm
    description: >-
      Activated T cells and accessory monocytes/macrophages release proinflammatory
      cytokines.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A repetitive cycle of cell stimulation and cytokine release results in a
        cytokine avalanche that causes tissue damage, disseminated intravascular
        coagulation, and organ dysfunction.
      explanation: >-
        Describes activated-cell stimulation feeding forward into the cytokine
        avalanche, which is the transition this edge encodes.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacterial superantigenic exotoxins induces unconventional polyclonal lymphocyte
      activation, which leads to rapid shock, multiple organ failure syndrome, and
      death.
    explanation: >-
      Directly supports unconventional polyclonal lymphocyte activation as the step
      linking superantigen exposure to shock and organ failure.
  - reference: PMID:22069685
    reference_title: "Staphylococcal superantigen (TSST-1) mutant analysis reveals that t cell activation is required for biological effects in the rabbit including the cytokine storm."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that the mutant G31R induced all the biological effects of the
      wild type sAg, while the mutant with non-functional TCR binding did not retain
      any of the toxic effects, proving the pivotal role of T cells in this system.
    explanation: >-
      Rabbit TSST-1 mutant analysis showing that abolishing T cell receptor binding
      abolishes toxicity, establishing T cell activation as required rather than
      incidental. Model organism evidence, complementing the human clinical support.
- name: Systemic Cytokine Storm
  description: >-
    Simultaneous activation of T cells and antigen-presenting cells produces an
    overwhelming, self-amplifying release of proinflammatory cytokines including TNF,
    IL-1beta, IL-2 and IFN-gamma. This mediator burst, rather than bacterial invasion
    itself, produces the systemic illness; in staphylococcal TSS the organism is
    frequently confined to a colonized mucosal or wound surface.
  biological_scale: ORGANISM
  downstream:
  - target: Endothelial Injury and Capillary Leak
    description: >-
      Circulating cytokines act on vascular endothelium to increase permeability.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in a massive release of proinflammatory cytokines, with clinical
        signs, such as capillary leakage, arterial hypotension, organ failure, and
        coagulation activation, usually being reported in this setting
      explanation: >-
        Places capillary leakage downstream of the proinflammatory cytokine release,
        which is the transition this edge encodes.
  - target: Distributive Shock and Multi-Organ Dysfunction
    description: >-
      Cytokine-driven tissue damage and coagulation activation contribute directly to
      organ dysfunction.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bacterial superantigenic exotoxins induces unconventional polyclonal lymphocyte
        activation, which leads to rapid shock, multiple organ failure syndrome, and
        death.
      explanation: >-
        Connects the superantigen-driven activation cascade to rapid shock and multiple
        organ failure, the endpoint this edge reaches.

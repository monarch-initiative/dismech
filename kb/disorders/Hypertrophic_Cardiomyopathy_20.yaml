genetic:
- name: NEXN Missense Variants (Limited Gene-Disease Validity for HCM)
  gene_term:
    preferred_term: NEXN
    term:
      id: hgnc:29557
      label: NEXN
  association: Reported pathogenic variants with Limited gene-disease validity
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >-
    Two heterozygous missense variants, c.391C>G (p.Q131E) in exon 5 and
    c.835C>T (p.R279C) in exon 8, identified by candidate-gene screening of 121
    HCM probands who were negative for the eight commonly mutated myofilament
    genes. Both affect highly conserved residues, segregated with HCM within
    their families, and were absent from 384 control chromosomes.

    The strength of the NEXN-HCM relationship is contested. ClinGen's Hereditary
    Cardiovascular Disease Gene Curation Expert Panel classified it as Limited
    (SOP9, 2023-03-23). A 2019 systematic ClinGen-framework reappraisal of HCM
    panel genes found that 22 of 33 curated HCM genes had limited or no evidence
    of disease causation; NEXN was not among the eight definitive genes. Most
    decisively, a 2025 multicentre burden analysis of 60 NEXN carriers found
    significant enrichment of NEXN truncating variants in DCM/NDLVC but no
    association with HCM. NEXN's well-supported cardiomyopathy association is
    with dilated cardiomyopathy (ClinGen: Strong).
  case_fractions:
  - population: >-
      French multicentre cardiomyopathy / sudden cardiac death gene-panel series
      (9516 index patients; HCM probands)
    case_fraction_percent: 0.14
    notes: >-
      Share of HCM index cases carrying a single putative pathogenic NEXN
      variant. The same study reports 0.33% for dilated cardiomyopathy and
      states that causality could not be established for the HCM cases.
    evidence:
    - reference: PMID:38059363
      reference_title: "NEXN Gene in Cardiomyopathies and Sudden Cardiac Deaths: Prevalence, Phenotypic Expression, and Prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        21 presented with dilated cardiomyopathy (prevalence, 0.33%), and 3
        presented with hypertrophic cardiomyopathy (prevalence, 0.14%)
      explanation: >-
        Quantifies the share of HCM index cases carrying a putative pathogenic
        NEXN variant in a 9516-patient sequencing series.
  evidence:
  - reference: PMID:20970104
    reference_title: "Mutations in NEXN, a Z-disc gene, are associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened NEXN in 121 unrelated HCM patients who did not carry any
      mutation in eight genes commonly mutated in myofilament disease.
    explanation: >-
      Describes the ascertainment: a sarcomere-gene-negative HCM cohort screened
      for NEXN, which is the entire clinical basis for the CMH20 designation.
  - reference: PMID:20970104
    reference_title: "Mutations in NEXN, a Z-disc gene, are associated with hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, the mutations in NEXN that we describe here may further expand
      the knowledge of Z-disc genes in the pathogenesis of HCM.
    explanation: >-
      The originating study's own conclusion is hedged ("may further expand"),
      consistent with the later Limited classification.
  - reference: CGGV:assertion_9456bdef-7708-45b2-a698-c897167d7f5b-2023-03-23T160000.000Z
    reference_title: "NEXN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NEXN | HGNC:29557 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel
      classifies the NEXN-hypertrophic cardiomyopathy gene-disease relationship
      as Limited, directly supporting the qualified framing of this entry.
  - reference: PMID:40680702
    reference_title: "Genetic and Phenotypic Characterization of Nexilin (NEXN)-Related Cardiomyopathy: Results From a Multicentric Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a significant enrichment of NEXN-truncating variants (tvs) was found in
      the DCM/NDLVC cohort (0.39% vs 0.09% in gnomAD NFE; P = 0.0001), whereas
      no association was observed with HCM
    explanation: >-
      The largest NEXN carrier cohort to date found no burden association
      between rare NEXN variants and HCM, directly arguing against a causal
      NEXN-HCM relationship while confirming the DCM/NDLVC association.
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3,
      MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3); 3 had moderate evidence
      ( CSRP3, TNNC1, and JPH2; 33%); and 22 (66%) had limited (n=16) or no
      evidence (n=6).
    explanation: >-
      Systematic ClinGen-framework reappraisal of HCM panel genes; NEXN is not
      among the definitive or moderate genes listed. PARTIAL because the cached
      abstract does not name NEXN explicitly — the NEXN-specific Limited
      classification is carried by the CGGV assertion above and by
      PMID:39132495 below.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 11 genes that retained their original classification: 1 no
      evidence ( TNNC2), 6 limited ( KLF10, NEXN, OBSCN, PDLIM3, RYR2, TTN ), 1
      moderate (JPH2), and 3 definitive evidence (CACNA1C, FLNC, PRKAG2).
    explanation: >-
      The ClinGen expert panel's published HCM gene reappraisal names NEXN
      explicitly among the genes retaining a Limited classification — the
      NEXN-specific, peer-reviewed counterpart of the CGGV assertion row.
- name: NEXN Dilated Cardiomyopathy Association (Differential Context)
  gene_term:
    preferred_term: NEXN
    term:
      id: hgnc:29557
      label: NEXN
  association: Distinct, better-supported NEXN cardiomyopathy phenotype
  relationship_type: CAUSATIVE
  features: >-
    Recorded here only to keep the two NEXN cardiomyopathy entities separate and
    to guard against named-entity confusion in downstream curation. NEXN
    truncating variants are robustly associated with dilated / nondilated left
    ventricular cardiomyopathy (CMD1CC; ClinGen Strong), a phenotype
    characterized by mild left ventricular dilatation, mildly reduced ejection
    fraction, frequent myocardial fibrosis, and malignant ventricular
    arrhythmias. Literature about that phenotype must not be used as evidence
    for CMH20.
  evidence:
  - reference: PMID:40680702
    reference_title: "Genetic and Phenotypic Characterization of Nexilin (NEXN)-Related Cardiomyopathy: Results From a Multicentric Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NEXNtvs were significantly associated with DCM/NDLVC, characterized by
      mild cardiac abnormalities, infrequent heart failure, common fibrosis, and
      arrhythmias.
    explanation: >-
      Establishes DCM/NDLVC — not HCM — as the NEXN phenotype supported by
      burden and cohort data.
  - reference: PMID:38059363
    reference_title: "NEXN Gene in Cardiomyopathies and Sudden Cardiac Deaths: Prevalence, Phenotypic Expression, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Putative pathogenic NEXN variants were mainly associated with dilated
      cardiomyopathy; in these individuals, the prognosis appeared to be
      relatively good.
    explanation: >-
      Independent cohort confirming that the dominant NEXN cardiomyopathy
      phenotype is dilated rather than hypertrophic.

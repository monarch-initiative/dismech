- name: Cardiac Z-Disc Destabilization Under Mechanical Load
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The Z-disc is the mechanical integration site that anchors myofilaments and
    transmits contractile force between adjacent sarcomeres. Nexilin was
    identified as a Z-disc protein whose specific role is to protect the Z-disc
    from the forces generated within the sarcomere; loss-of-function models show
    that Z-disc damage in nexilin-deficient muscle is aggravated by increasing
    mechanical strain. The inferred consequence of impaired nexilin-actin
    anchorage is therefore progressive Z-disc destabilization under contractile
    load. IMPORTANT CAVEAT: the direct experimental evidence for this step comes
    from nexilin-deficient zebrafish and from human DILATED cardiomyopathy
    carriers, not from the HCM families — in those models Z-disc failure
    produced a dilated, not hypertrophic, phenotype. The step is retained as
    HYPOTHETICAL for CMH20 because no HCM-specific model system has been
    reported.

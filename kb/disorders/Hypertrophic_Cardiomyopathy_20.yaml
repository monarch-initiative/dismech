prevalence:
- population: Hypertrophic cardiomyopathy probands in a 9516-patient sequencing cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence exists for CMH20 and arguably none can while the
    gene-disease relationship is Limited - an entity that should not be
    diagnostically reported cannot be counted. What is measurable is how often
    NEXN variants turn up among sequenced HCM probands: 3 of the 29 unrelated
    single-variant probands in a 9516-patient cardiomyopathy cohort had
    hypertrophic cardiomyopathy, a 0.14% prevalence within that HCM
    denominator. That figure counts variant carriage, not established causation
    - the same paper states a causal link could not be established - so it is
    recorded as NOT_YET_DOCUMENTED with the number in notes rather than as a
    rate.
  evidence:
  - reference: PMID:38059363
    reference_title: "NEXN Gene in Cardiomyopathies and Sudden Cardiac Deaths: Prevalence, Phenotypic Expression, and Prognosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      21 presented with dilated cardiomyopathy (prevalence, 0.33%), and 3
      presented with hypertrophic cardiomyopathy (prevalence, 0.14%).
    explanation: >-
      Gives the carriage frequency within an HCM denominator, and simultaneously
      shows the asymmetry that governs this entry - NEXN variants were found
      more than twice as often in dilated as in hypertrophic cardiomyopathy.
      PARTIAL because carriage is not causation and the authors say so.

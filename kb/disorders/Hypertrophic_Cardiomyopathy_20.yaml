phenotypes:
- category: Cardiovascular
  name: Hypertrophic Cardiomyopathy
  description: >-
    The defining clinical phenotype: left ventricular hypertrophy not explained
    by abnormal loading conditions. Reported in two families carrying NEXN
    missense variants in the original CMH20 report, and in three of 29 NEXN
    variant-carrying probands in a large French cardiomyopathy sequencing series
    — though in the latter the authors state a causal link could not be
    established. Frequency is deliberately omitted: the number of reported
    carriers is too small, and the gene-disease validity too uncertain, to
    support a frequency band.
  phenotype_term:

      Cellular transfection studies showed that the two mutations resulted in
      local accumulations of nexilin and that the expressed fragment of
      actin-binding domain containing p.Q131E completely lost the ability to
      bind F-actin in C2C12 cells.
    explanation: >-
      Direct in vitro demonstration that the p.Q131E variant abolishes F-actin
      binding by the nexilin actin-binding domain, establishing the proposed
      molecular lesion.
  - reference: PMID:20970104
    reference_title: "Mutations in NEXN, a Z-disc gene, are associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coimmunoprecipitation assay indicated that the p.Q131E mutation decreased
      the binding of full-length NEXN to α-actin and abolished the interaction
      between the fragment of actin-binding domain and α-actin.
    explanation: >-
      Independent biochemical confirmation that the variant disrupts the
      nexilin-actin interaction in the context of the full-length protein.
  downstream:
  - target: Cardiac Z-Disc Destabilization Under Mechanical Load

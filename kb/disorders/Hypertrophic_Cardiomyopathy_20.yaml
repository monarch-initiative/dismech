    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two missense mutations, c.391C>G (p.Q131E) and c.835C>T (p.R279C), were
      identified in exons 5 and 8 of NEXN, respectively, in two probands.
    explanation: >-
      Identifies the two HCM probands in whom NEXN missense variants were found,
      in a cohort screened specifically for HCM.
  - reference: PMID:38059363
    reference_title: "NEXN Gene in Cardiomyopathies and Sudden Cardiac Deaths: Prevalence, Phenotypic Expression, and Prognosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also detected NEXN variants in patients with hypertrophic
      cardiomyopathy and sudden infant death syndrome/idiopathic ventricular
      fibrillation, although a causal link could not be established.

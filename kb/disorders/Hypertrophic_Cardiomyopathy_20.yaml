    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nexilin, encoded by NEXN, is a cardiac Z-disc protein recently identified
      as a crucial protein that functions to protect cardiac Z-discs from forces
      generated within the sarcomere.
    explanation: >-
      Establishes the load-bearing, Z-disc-protective role of nexilin that the
      proposed mechanism depends on.
  - reference: PMID:19881492
    reference_title: "Nexilin mutations destabilize cardiac Z-disks and lead to dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Increasing mechanical strain aggravated Z-disk damage in
      nexilin-deficient skeletal muscle, implying a unique role of nexilin in
      protecting Z-disks from mechanical trauma.
    explanation: >-
      Supports load-dependent Z-disc failure as the consequence of nexilin loss,
      but only PARTIAL for CMH20 — this study characterizes nexilin loss in
      zebrafish and in human DILATED cardiomyopathy, and the resulting phenotype
      was dilated rather than hypertrophic.
  downstream:
  - target: Cardiomyocyte Hypertrophy, Sarcomeric Disarray, and Myocardial Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The steps linking Z-disc destabilization to a hypertrophic (as opposed to
      dilated) remodeling response have not been established for NEXN; no
      HCM-recapitulating NEXN model system has been reported.
- name: Cardiomyocyte Hypertrophy, Sarcomeric Disarray, and Myocardial Fibrosis
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    The tissue-level endpoint that defines the hypertrophic phenotype:
    cardiomyocyte hypertrophy with myofibrillar/sarcomeric disarray and
    increased interstitial myocardial fibrosis, producing ventricular wall
    thickening that is not explained by loading conditions. This node describes
    the shared HCM remodeling endpoint rather than a NEXN-specific finding — no
    NEXN-specific myocardial histopathology has been reported in the CMH20
    families, so the node is marked HYPOTHETICAL for this entry.

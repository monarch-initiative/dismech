pathophysiology:
- name: NEXN Missense Variants Impair Nexilin F-Actin Binding
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Nexilin (NEXN) is an F-actin-binding protein of the cardiac Z-disc, not a
    component of the thick or thin filament. The two HCM-reported missense
    variants lie in or adjacent to the actin-binding domain: in transfected
    C2C12 cells they caused abnormal local accumulation of nexilin, and the
    actin-binding-domain fragment carrying p.Q131E lost F-actin binding
    entirely, with coimmunoprecipitation showing reduced binding of full-length
    NEXN to alpha-actin. The proposed proximal lesion is therefore failure of
    the nexilin-actin anchorage that couples thin filaments to the Z-disc,
    rather than an alteration of cross-bridge cycling. Confidence is
    PROVISIONAL: the functional data are robust in vitro but derive from the
    same single report that proposed the gene-disease association, which has
    since been classified Limited by ClinGen.
  genes:
  - preferred_term: NEXN
    term:
      id: hgnc:29557
      label: NEXN
  molecular_functions:
  - preferred_term: actin binding
    term:
      id: GO:0003779
      label: actin binding
    modifier: DECREASED

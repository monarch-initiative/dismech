    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The clinically consequential fact about NEXN is a reporting rule, not a
    testing indication. ClinGen classifies NEXN-hypertrophic cardiomyopathy as
    Limited, and its Hereditary Cardiovascular Disease Gene Curation Expert
    Panel places limited, no-evidence and disputed genes together in the
    "uncertain significance" tier, stating that genes with disputed evidence are
    not appropriate for diagnostic reporting - including their variants of
    uncertain significance. A NEXN variant found on a cardiomyopathy panel
    therefore should not be reported as the cause of a patient's hypertrophic
    cardiomyopathy, should not be used to direct predictive cascade testing in
    relatives, and does not discharge the family from clinical surveillance.
    Panel testing itself remains indicated - to find a variant in a gene that
    does carry adequate validity.
  results: >-
    A NEXN variant is an uncertain-significance finding at gene level, not a
    molecular diagnosis. Interpret the panel as though NEXN had not been on it.
  evidence:
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genes of uncertain significance are those with classifications of limited,
      no evidence or disputed.
    explanation: >-
      Places the Limited classification NEXN carries into the
      uncertain-significance tier, which is what governs how a NEXN variant may
      be reported.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nine (29%) genes were downgraded to disputed, further discouraging
      clinical reporting of variants in these genes.
    explanation: >-
      Documents the reappraisal that moved a substantial fraction of previously
      accepted HCM genes out of clinical reportability, which is the context in
      which NEXN's Limited status should be read.
  notes: >-
    The reporting caveat previously lived only in the genetic counseling
    treatment, inferred from a generic Ingles-2019 quote. It is stated here
    instead, in the section that governs test interpretation, and sourced
    directly from the ClinGen expert-panel reappraisal that classifies NEXN.
treatments:
- name: Genetic Counseling and Cascade Family Screening
  description: >-
    Genetic counseling for probands and at-risk relatives. For NEXN specifically,
    counseling must convey that the NEXN-HCM gene-disease relationship is
    classified Limited by ClinGen, so a NEXN variant found in an HCM patient
    generally should not be used for predictive cascade testing or to release
    genotype-negative relatives from clinical surveillance. Clinical (imaging/ECG)
    family screening remains indicated regardless of NEXN genotype.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association. Systematically curated HCM genes are essential to guide
      appropriate reporting of variants and ensure the best possible outcomes
      for HCM families.
    explanation: >-
      Directly motivates the counseling caveat: variants in HCM genes with
      limited evidence should not drive family management decisions.
- name: Standard Hypertrophic Cardiomyopathy Management
  description: >-
    No NEXN-specific therapy exists. Management follows standard nonsyndromic HCM
    care: symptom-directed pharmacotherapy, arrhythmia surveillance, sudden-death
    risk stratification with implantable cardioverter-defibrillator placement
    where indicated, and septal reduction therapy for drug-refractory obstruction.
    Consult the umbrella `Hypertrophic Cardiomyopathy` entry and current HCM
    guidelines for details; this entry deliberately does not restate them.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    Retermed during review. This entry previously carried NCIT:C15986
    Pharmacotherapy, which is wrong for the scope of the description - it spans
    pharmacotherapy, device implantation and septal reduction, so a
    pharmacotherapy action term named only one third of it. The broader
    NCIT:C49236 Therapeutic Procedure is used instead of narrowing the
    description, because narrowing would misrepresent what this entry is doing:
    it is a deliberate single pointer to umbrella management, not a curated
    treatment. No therapeutic_agent is given for the same reason - naming
    specific drugs here would imply NEXN-specific evidence for them, and there
    is none. Not evidenced with a NEXN-specific citation because none exists.
discussions:
- discussion_id: nexn-hcm-gene-disease-validity
  prompt: >-
    Is NEXN a genuine hypertrophic cardiomyopathy gene at all, or is CMH20 an
    artifact of a single underpowered 2010 candidate-gene study?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#NEXN Missense Variants Impair Nexilin F-Actin Binding"
  - "genetic#NEXN Missense Variants (Limited Gene-Disease Validity for HCM)"
  rationale: >-
    MONDO:0013477 / OMIM 613876 exist as a numbered HCM series entry, but the
    evidence base has moved against them. ClinGen classifies NEXN-HCM as Limited
    (2023), and the 2025 multicentre burden study of 60 NEXN carriers found no
    HCM association while confirming enrichment in DCM/NDLVC. If the association
    is spurious, this entry should eventually be marked disputed rather than
    fleshed out with borrowed sarcomeric-HCM mechanism, and NEXN variants should
    not be reported as causal in HCM diagnostic testing.
  evidence:
  - reference: CGGV:assertion_9456bdef-7708-45b2-a698-c897167d7f5b-2023-03-23T160000.000Z
    reference_title: "NEXN / hypertrophic cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NEXN | HGNC:29557 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited"
    explanation: >-
      ClinGen expert-panel classification establishing that the relationship is
      only Limited.
  - reference: PMID:40680702
    reference_title: "Genetic and Phenotypic Characterization of Nexilin (NEXN)-Related Cardiomyopathy: Results From a Multicentric Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas no association was observed with HCM
    explanation: >-
      Burden testing in the largest NEXN cohort to date found no HCM
      association, sharpening the controversy.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6 limited ( KLF10, NEXN, OBSCN, PDLIM3, RYR2, TTN )
    explanation: >-
      ClinGen's published HCM reappraisal retained NEXN at Limited, confirming
      that the controversy is unresolved rather than settled in NEXN's favour.
  proposed_experiments:
  - experiment_id: nexn-hcm-reclassification
    name: ClinGen NEXN-HCM Gene-Disease Validity Re-Curation
    description: >-
      Re-run a ClinGen gene-disease validity curation for NEXN-HCM incorporating
      post-2023 evidence (notably the 2025 multicentre burden analysis) to
      determine whether the classification should move from Limited to Disputed
      or Refuted, and propose a corresponding MONDO/OMIM status annotation.
  - experiment_id: nexn-hcm-case-level-reassessment
    name: Reassessment of the Original CMH20 Variants
    description: >-
      Reassess the two original CMH20 variants (p.Q131E, p.R279C) against
      current population databases (gnomAD v4) and ClinVar, and attempt
      independent replication of segregation in additional sarcomere-negative
      HCM families.
- discussion_id: nexn-hcm-no-model-system
  prompt: >-
    Why does nexilin loss of function produce a dilated phenotype in every
    reported model system, while the two human CMH20 missense variants were
    reported with a hypertrophic phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Cardiac Z-Disc Destabilization Under Mechanical Load"
  - "pathophysiology#Cardiomyocyte Hypertrophy, Sarcomeric Disarray, and Myocardial Fibrosis"
  rationale: >-
    Every published nexilin model — zebrafish knockdown, mouse knockout — yields
    dilated cardiomyopathy with endomyocardial/endocardial fibroelastosis, and
    human NEXN truncating variants segregate with DCM/NDLVC. No animal or
    iPSC-cardiomyocyte model recapitulating a NEXN-driven hypertrophic phenotype
    has been reported. The mechanistic chain from Z-disc destabilization to
    hypertrophic (rather than dilated) remodeling is therefore entirely
    unmodelled, which is why the downstream nodes in this entry carry
    mechanism_confidence HYPOTHETICAL and an
    INDIRECT_UNKNOWN_INTERMEDIATES causal edge.
  evidence:
  - reference: PMID:19881492
    reference_title: "Nexilin mutations destabilize cardiac Z-disks and lead to dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of nexilin in zebrafish led to perturbed Z-disk stability and heart
      failure.
    explanation: >-
      The canonical nexilin model system produces heart failure in a dilated
      context, not hypertrophy — the mismatch this discussion records.
  proposed_experiments:
  - experiment_id: nexn-q131e-knockin-phenotyping
    name: NEXN Missense Knock-In iPSC-Cardiomyocyte Phenotyping
    description: >-
      Generate NEXN p.Q131E and p.R279C knock-in human iPSC-derived
      cardiomyocytes and engineered heart tissue, and assay sarcomere
      organization, Z-disc integrity, contractile force, and hypertrophic gene
      program induction under mechanical load, to test whether these specific
      missense alleles produce a hypertrophic rather than dilated cellular
      phenotype.
- discussion_id: nexn-hcm-phenotype-detail-gap
  prompt: >-
    What is the actual clinical phenotype of NEXN-associated HCM — age of onset,
    hypertrophy pattern and severity, outflow obstruction, arrhythmia burden,
    and sudden-death risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "phenotype#Hypertrophic Cardiomyopathy"
  - "phenotype#Myocardial Sarcomeric Disarray"
  - "phenotype#Myocardial Fibrosis"
  rationale: >-
    The published clinical description of CMH20 amounts to two families in the
    2010 report plus three probands in a French series whose causality was
    explicitly not established. No cohort has reported age at onset, hypertrophy
    distribution, late gadolinium enhancement, outflow gradients, or arrhythmic
    outcomes specific to NEXN HCM carriers. Consequently no phenotype in this
    entry carries a `frequency:` band, and the disarray/fibrosis phenotypes are
    inferred from the HCM disease definition rather than observed in carriers.
  evidence:
  - reference: PMID:38059363
    reference_title: "NEXN Gene in Cardiomyopathies and Sudden Cardiac Deaths: Prevalence, Phenotypic Expression, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Few clinical data are available on NEXN mutation carriers, and the gene's
      involvement in cardiomyopathies or sudden death has not been fully
      established.
    explanation: >-
      Explicit statement of the clinical data gap for NEXN carriers.
  proposed_experiments:
  - experiment_id: nexn-hcm-deep-phenotyping-registry
    name: International NEXN HCM Deep-Phenotyping Registry
    description: >-
      Assemble an international registry of HCM probands carrying rare NEXN
      variants with standardized deep phenotyping (echocardiography, cardiac
      MRI with late gadolinium enhancement, ambulatory ECG, family segregation)
      to determine whether a distinguishable NEXN HCM phenotype exists at all.
datasets:
notes: >-
  GeneReviews baseline: PMID:20301725 is tagged in `references` but is
  deliberately not mined for an evidence item. Its PubMed record is the
  six-point purpose statement of the Nonsyndromic Hypertrophic Cardiomyopathy
  Overview, with no Clinical Characteristics, Diagnosis, Management or Genetic
  Counseling narrative to quote, and there is no NEXN-specific GeneReviews
  chapter. The tag records that the parent-disease overview was checked, not
  that content was drawn from it.

  Phenotype scoping, and a deliberate asymmetry: this entry curates myocardial
  sarcomeric disarray and fibrosis, which are inferred from the hypertrophic
  cardiomyopathy disease definition rather than observed in NEXN carriers, while
  omitting atrial fibrillation, reduced ejection fraction and sudden cardiac
  death, which do appear in the NEXN literature. That looks inconsistent and is
  intentional. The tissue phenotypes are definitional for the entity this MONDO
  term names, so their absence would mislead. The clinical phenotypes, in the one
  cohort that reports them (PMID:38059363), belong to the DILATED cardiomyopathy
  subgroup rather than to the three hypertrophic probands - the median ejection
  fraction of 37.5% is explicitly "for patients with dilated cardiomyopathy", and
  the arrhythmic events and sudden infant deaths are reported without attribution
  to the HCM carriers and with the authors stating that a causal link could not
  be established. Importing them would move a DCM observation onto an HCM entity,
  which is precisely the confusion the DISPUTED framing in this entry exists to
  prevent. If a cohort ever reports these phenotypes in NEXN HCM carriers
  specifically, they should be added.

  Module conformance placement: the `cardiomyopathy_maladaptive_remodeling#Primary
  Cardiomyocyte Insult` anchor sits on `Cardiac Z-Disc Destabilization Under
  Mechanical Load`, not on the upstream `NEXN Missense Variants Impair Nexilin
  F-Actin Binding` node, and the choice is deliberate rather than incidental. The
  module node describes a cell-level insult to cardiomyocyte contractile function
  and expects GO:0045214 sarcomere organization (ABNORMAL) and GO:0006936 muscle
  contraction (ABNORMAL) alongside CL:0000746 cardiac muscle cell. The Z-disc node
  carries exactly that annotation set and is CELLULAR in scale; the variant node is
  MOLECULAR and describes loss of nexilin-actin binding, one level finer than the
  module models. Asserting the two module processes on the variant node instead
  would duplicate the Z-disc node's claim at a scale where this entry has no
  separate evidence for it. The disorder therefore enters the module one step
  downstream of its own trigger, which is the expected shape when a disorder
  atomizes a composite module node.

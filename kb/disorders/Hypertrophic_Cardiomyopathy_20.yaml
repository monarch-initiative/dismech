name: Hypertrophic Cardiomyopathy 20
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH20
- NEXN hypertrophic cardiomyopathy
- hypertrophic cardiomyopathy type 20
- cardiomyopathy, familial hypertrophic, 20
description: >-
  Hypertrophic cardiomyopathy 20 (CMH20; OMIM 613876) is the NEXN-attributed
  member of the numbered familial hypertrophic cardiomyopathy (HCM) series.
  NEXN encodes nexilin, an F-actin-binding protein of the cardiac Z-disc — the
  mechanical anchoring structure at the boundary of adjacent sarcomeres — rather
  than a thick- or thin-filament contractile protein, so the proposed mechanism
  is Z-disc/actin-anchorage failure under sarcomeric load rather than the
  altered actin-myosin cross-bridge kinetics of classic sarcomeric HCM.

  The designation rests on a single 2010 candidate-gene study (Wang et al.,
  PMID:20970104) that found two missense variants (p.Q131E, p.R279C) segregating
  in two HCM families, absent from 384 control chromosomes, with loss of F-actin
  binding in vitro. Subsequent systematic reappraisal has NOT confirmed this
  association: ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert
  Panel classifies the NEXN-HCM gene-disease relationship as **Limited**
  (2023-03-23, SOP9), and the largest NEXN carrier cohort assembled to date
  found significant enrichment of NEXN truncating variants in dilated/nondilated
  left ventricular cardiomyopathy but **no association with HCM**
  (PMID:40680702). NEXN's well-supported cardiomyopathy association is with
  dilated cardiomyopathy (CMD1CC; ClinGen Strong).

  This entry is therefore curated as a *contested* disease entity: the
  mechanistic chain below is recorded as provisional/hypothetical, and the
  unresolved gene-disease validity is captured explicitly in `discussions`. Do
  not read this entry as asserting a confirmed NEXN-HCM causal mechanism.
category: Mendelian
parents:

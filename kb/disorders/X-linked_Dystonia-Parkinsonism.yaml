mechanistic_hypotheses:
- hypothesis_group_id: taf1_dysregulation_to_neostriatal_loss
  hypothesis_label: TAF1 dysregulation as a route to selective neostriatal neuronal loss
  status: EMERGING
  description: >
    Reduced TAF1 expression is present in patient caudate and is a reproducible
    SVA-dependent molecular phenotype, but the retained review explicitly says
    its role in XDP pathogenesis is undefined. The hypothesis therefore records
    the historically central TAF1 route while leaving its intermediates and its
    contribution relative to repeat-RNA/R-loop toxicity unresolved.
  evidence:
  - reference: PMID:38835911
    reference_title: "Factors influencing reduced penetrance and variable expressivity in X-linked dystonia-parkinsonism."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The reduction in the TAF1 expression and the retention of a part of intron 32 in some TAF1 transcripts are currently considered relevant cellular/molecular XDP phenotypes, but their role in XDP pathogenesis is not defined and warrants further investigation."
    explanation: Supports retaining TAF1 dysregulation as an emerging mechanistic hypothesis while explicitly preserving uncertainty about its pathogenic role.
- hypothesis_group_id: neostriatal_loss_to_movement_disorder
  hypothesis_label: Neostriatal neuronal loss as a driver of dystonia and parkinsonism
  status: EMERGING
  description: >
    Clinicopathologic evidence establishes progressive neostriatal neuronal
    loss alongside the evolving dystonia-parkinsonism syndrome. A review
    proposes XDP as a model for studying how striatal neurodegeneration leads
    to dystonia, but neither that route nor the route to parkinsonism has been
    experimentally resolved. The associated edges are therefore partial,
    indirect, and explicitly hypothesis-scoped.
  evidence:
  - reference: PMID:28672841
    reference_title: "Clinicopathological Phenotype and Genetics of X-Linked Dystonia-Parkinsonism (XDP; DYT3; Lubag)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "XDP may be used as a human disease model to elucidate the pathomechanisms by which striatal neurodegeneration leads to dystonia symptoms."
    explanation: Supports the proposed disease model while explicitly signaling that its intervening mechanism remains to be elucidated.
- hypothesis_group_id: repeat_rna_r_loop_neurodegeneration
  hypothesis_label: SVA repeat-RNA and R-loop route to neostriatal neurodegeneration
  status: EMERGING
  description: >
    XDP striatal organoids support a route in which SVA-derived hexamer RNA
    drives R-loop formation and neuronal injury: SVA deletion ameliorates
    neurodegenerative readouts, and antisense knockdown of the repeat RNA
    rescues apoptosis. Whether this model fully explains selective,
    progressive neuronal loss in the human neostriatum is not yet established.
  evidence:
  - reference: PMID:40540399
    reference_title: "A hexamer tandem repeat RNA embedded within an SVA retrotransposon drives R-loop formation and neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phenotypic and transcriptomic analysis of XDP and isogenic SVA-deleted striatal organoids reveal that the SVA insertion drives hallmarks of neurodegeneration, including transcriptional dysregulation, decreased neuronal activity, and apoptosis, which are ameliorated by SVA deletion."
    explanation: Isogenic deletion provides rescue evidence for the SVA-to-neurodegenerative-readout route in human striatal organoids.
- hypothesis_group_id: g4_transcriptional_interference
  hypothesis_label: G-quadruplex-mediated transcriptional interference at the XDP SVA
  status: EMERGING
  description: >
    The G-rich (CCCTCT)n hexameric repeat within the XDP SVA folds into stable
    G-quadruplex (G4) structures that interfere with TAF1 transcription.
    Pharmacologic stabilization of these G4s reduces TAF1 transcripts while
    destabilization (unfolding) increases TAF1 transcripts, implicating G4
    formation as a major cause of aberrant TAF1 expression and a candidate
    therapeutic target.
  evidence:
  - reference: PMID:39287133
    reference_title: "G-quadruplexes in an SVA retrotransposon cause aberrant TAF1 gene expression in X-linked dystonia parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data indicate that G4 formation in the XDP SVA is a major cause of aberrant TAF1 expression"
    explanation: Establishes G-quadruplex formation in the XDP SVA as a major driver of aberrant TAF1 expression.
  - reference: PMID:39287133
    reference_title: "G-quadruplexes in an SVA retrotransposon cause aberrant TAF1 gene expression in X-linked dystonia parkinsonism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "stabilisation of the XDP SVA G4s reduces TAF1 transcripts downstream and around the SVA, and increases upstream transcripts, while destabilisation using the G4 unfolder PhpC increases TAF1 transcripts"
    explanation: Demonstrates bidirectional pharmacologic modulation of TAF1 transcription by G4 ligands, supporting G4s as a causal and druggable mechanism.
- hypothesis_group_id: sva_epigenetic_repression
  hypothesis_label: ZNF91-dependent mini-heterochromatin constrains the XDP SVA
  status: EMERGING
  description: >
    An innate epigenetic defense system mediated by the KRAB zinc-finger
    protein ZNF91 deposits H3K9me3 and DNA methylation over SVA elements,
    forming mini-heterochromatin domains that attenuate the cis-regulatory
    impact of the XDP SVA. Loss of this local heterochromatin worsens the XDP
    molecular phenotype, increasing TAF1 intron retention and reducing TAF1
    expression.
  evidence:
  - reference: PMID:38834915
    reference_title: "Mini-heterochromatin domains constrain the cis-regulatory impact of SVA transposons in human brain development and disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the KRAB zinc finger protein ZNF91 establishes H3K9me3 and DNA methylation over SVAs"
    explanation: Identifies ZNF91-mediated heterochromatin as the epigenetic control system over SVA elements.
  - reference: PMID:38834915
    reference_title: "Mini-heterochromatin domains constrain the cis-regulatory impact of SVA transposons in human brain development and disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "removal of local heterochromatin severely aggravates the XDP molecular phenotype, resulting in increased TAF1 intron retention and reduced expression"
    explanation: Shows that loss of SVA heterochromatin worsens TAF1 intron retention and reduces expression, linking epigenetic repression to the XDP molecular phenotype.

experimental_models:
- name: XDP iPSC-derived neuronal lineages with CRISPR SVA excision
  description: >
    Patient-derived pluripotent stem cells differentiated along multiple
    neuronal lineages were used to resolve the SVA-associated TAF1
    transcriptional signature. CRISPR/Cas9 excision of the SVA provides a
    within-genotype rescue, making this the strongest causal model of the
    insertion-to-transcription step. It does not model the decades-long
    clinical neurodegenerative course.

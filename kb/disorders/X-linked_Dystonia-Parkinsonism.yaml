- name: Neostriatal neuronal loss
  role: consequence
  biological_scale: CELLULAR
  description: >
    The major neuropathology of XDP is progressive neuronal loss in the
    neostriatum (caudate nucleus and putamen). Post-mortem studies show a
    marked loss of striatal neuropeptide Y-positive cells and nerve fibres,
    while patient-derived striatal-neuron models identify medium spiny
    neurons as a strongly affected population. These observations do not
    establish that the post-mortem NPY-positive cells are medium spiny
    neurons, so the node is named at the supported pan-neostriatal level.

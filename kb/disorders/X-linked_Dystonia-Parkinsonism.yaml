review_notes: >-
  The 2026 REVIEW reconciled the older GeneReviews course summary with newer
  cohort-level review evidence, which shows a predominantly focal-dystonia-first
  presentation and a smaller parkinsonism-first subgroup. It also separated
  established SVA-to-TAF1 rescue evidence from the emerging repeat-RNA/R-loop
  neurodegeneration model, removed an unsupported apoptosis ontology assertion,
  and modeled the human TAF1-to-neostriatal-loss bridge only as an emerging,
  indirect hypothesis whose pathogenic role remains explicitly undefined.
  Monarch D2P suggestions were used as an audit worklist only. Aspiration
  pneumonia, cervical dystonia, and blepharospasm were added where exact local
  claim-level evidence was available; conditional craniocervical-subgroup
  percentages were not promoted to whole-disease frequencies. Frequent falls,
  hand tremor, laryngeal stridor, myoclonus, and protruding tongue were not added
  because the local cache set did not provide exact claim-level evidence for
  them. No causal arrows were invented merely to increase phenotype
  connectivity. The available research synthesis did not
  provide a sufficiently evidenced disorder-specific differential-diagnosis
  algorithm, so that section remains absent rather than speculative.

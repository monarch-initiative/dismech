      reference_title: "Proteomic analysis of X-linked dystonia parkinsonism disease striatal neurons reveals altered RNA metabolism and splicing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we carried out a proteomic analysis of human XDP patient-derived neural stem cells (NSCs) and MSNs derived from induced pluripotent stem cells."
      explanation: Establishes the paired human neural-lineage model used for the molecular profiling.
- name: Patient-derived fibroblast and neural-progenitor G-quadruplex model
  description: >
    Patient fibroblasts and neural progenitor cells were used to demonstrate
    folded G-quadruplexes within the XDP SVA in chromatin and to test
    pharmacologic stabilization and unfolding. The system directly measures
    the proposed G4-to-TAF1 transcription mechanism, not clinical efficacy or
    neuronal survival.
  experimental_model_type: OTHER
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:39287133
  modeled_mechanisms:
  - target: TAF1 transcriptional dysregulation
    description: Perturbs G4 stability and measures the direction of TAF1 transcript changes around the SVA.
    evidence:
    - reference: PMID:39287133
      reference_title: "G-quadruplexes in an SVA retrotransposon cause aberrant TAF1 gene expression in X-linked dystonia parkinsonism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "stabilisation of the XDP SVA G4s reduces TAF1 transcripts downstream and around the SVA, and increases upstream transcripts, while destabilisation using the G4 unfolder PhpC increases TAF1 transcripts"
      explanation: Bidirectional perturbation links G4 stability to the transcriptional readout.
- name: Human neural-progenitor SVA mini-heterochromatin model
  description: >
    Human neural progenitor cells were used to perturb ZNF91-dependent local
    heterochromatin over SVA elements. Removing that chromatin constraint
    worsened intron retention and reduced TAF1 expression, showing that this
    response mitigates rather than causes the XDP molecular phenotype. The
    model does not establish how the protective response behaves in adult
    striatal tissue.
  experimental_model_type: OTHER
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  publication: PMID:38834915
  modeled_mechanisms:
  - target: TAF1 transcriptional dysregulation
    description: Tests how loss of local SVA heterochromatin changes TAF1 intron retention and expression.
    evidence:
    - reference: PMID:38834915
      reference_title: "Mini-heterochromatin domains constrain the cis-regulatory impact of SVA transposons in human brain development and disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "removal of local heterochromatin severely aggravates the XDP molecular phenotype, resulting in increased TAF1 intron retention and reduced expression"
      explanation: Directly establishes the direction and molecular readout of the chromatin perturbation.
- name: Isogenic XDP striatal organoid repeat-RNA model
  description: >
    Patient-derived striatal organoids and isogenic SVA-deleted controls were
    used to test a repeat-RNA mechanism. SVA deletion ameliorated reduced
    neuronal activity and apoptosis, while antisense knockdown of the
    hexamer-containing RNA rescued apoptosis. The model supports a causal
    cellular route but does not reproduce the decades-long human course.
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:40540399
  modeled_mechanisms:
  - target: Hexamer-repeat RNA and R-loop formation
    description: Measures repeat-RNA abundance and R-loop formation during striatal-organoid maturation.
    evidence:
    - reference: PMID:40540399
      reference_title: "A hexamer tandem repeat RNA embedded within an SVA retrotransposon drives R-loop formation and neurodegeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We identify an (AGAGGG)n hexamer-containing RNA in the XDP-causing SVA that increases expression during organoid maturation and drives R-loop formation in organoids and brain tissue."
      explanation: Establishes the molecular readout modeled by the organoid system.
  - target: Neostriatal neuronal loss
    description: Uses neuronal activity and apoptosis as model readouts of striatal neuronal injury, with rescue by SVA deletion and repeat-RNA knockdown.
    evidence:
    - reference: PMID:40540399
      reference_title: "A hexamer tandem repeat RNA embedded within an SVA retrotransposon drives R-loop formation and neurodegeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Phenotypic and transcriptomic analysis of XDP and isogenic SVA-deleted striatal organoids reveal that the SVA insertion drives hallmarks of neurodegeneration, including transcriptional dysregulation, decreased neuronal activity, and apoptosis, which are ameliorated by SVA deletion."
      explanation: Isogenic rescue supports the organoid neuronal-injury phenotype while remaining an in-vitro model of human neuronal loss.


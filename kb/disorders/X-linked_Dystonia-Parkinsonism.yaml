progression:
- phase: Onset and course
  notes: >
    Median age at onset in genetically confirmed patients is about 40 years,
    with a reported range of 20 to 67 years. More than 80% initially present
    with focal dystonia, which usually generalizes within five years;
    parkinsonism is the first manifestation in a minority (14%). Dystonia and
    parkinsonism increasingly overlap, and parkinsonism may predominate among
    patients who survive the combined phase. Aspiration pneumonia, starvation,
    and suicide contribute to shortened survival.
  evidence:
  - reference: PMID:38835911
    reference_title: "Factors influencing reduced penetrance and variable expressivity in X-linked dystonia-parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In genetically tested patients, in whom the presence of disease-causing variants has been confirmed, the median age at onset (AAO) of XDP is 40 years ... However, the AAO spectrum is very broad (from 20 to 67 years) and penetrance increases with age"
    explanation: A recent review gives the genetically confirmed cohort's median and range of onset.
  - reference: PMID:38835911
    reference_title: "Factors influencing reduced penetrance and variable expressivity in X-linked dystonia-parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority (>80 %) of patients present initially with focal dystonia that usually generalizes within five years after onset (dystonic phase) ... Nevertheless, in 14 % of patients, parkinsonism signs are the first disease manifestation ... With time, dystonia and parkinsonism increasingly overlap (combined dystonia-parkinsonism phase), and in patients surviving this disease stage the predominant clinical picture is parkinsonism (parkinsonian phase)"
    explanation: Calibrates the usual dystonia-first course while preserving the documented parkinsonism-first minority.
  - reference: PMID:38835911
    reference_title: "Factors influencing reduced penetrance and variable expressivity in X-linked dystonia-parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XDP patients have a shortened lifespan due to dystonia-related conditions (aspiration pneumonia or starvation) or suicide"
    explanation: Identifies major contributors to shortened survival without inferring an exact prognosis.


datasets:
- accession: geo:GSE296628
  title: Brown remodeling of white adipose tissue protects against abdominal aortic aneurysm via a novel batokine FSTL1
  description: Abdominal aortic aneurysm (AAA) is a life-threatening vascular disease without effective medical therapies. Emerging evidences have suggested a crosstalk between adipose tissue and vascular cells and brown adipose tissue is beneficial for cardiovascular health. Nevertheless, whether brown remodeling of white adipose tissue would protect against AAA remains unclear. Here we showed that patients with AAA had a decreased browning level of adipose tissue and induction of adipose tissue browning significantly reduced AAA incidence and attenuated AAA development in mice.

name: Abdominal Aortic Aneurysm
creation_date: "2026-07-11T11:57:18Z"
description: >-
  Abdominal aortic aneurysm (AAA) is a localized dilatation of the infrarenal
  aorta and a common degenerative vascular disease of older adults. It is
  multifactorial, with smoking, male sex, older age, and a positive family
  history as the principal risk factors. The aneurysmal wall is characterized by
  chronic transmural inflammation, matrix metalloproteinase (MMP)-driven
  proteolysis of elastin and fibrillar collagen, medial vascular smooth muscle
  cell depletion, and progressive thinning and weakening of the media and
  adventitia. Aneurysms are typically asymptomatic and enlarge silently; when
  wall stress exceeds wall strength the aneurysm ruptures, causing
  life-threatening haemorrhage with very high mortality. Management centers on
  ultrasound surveillance of small aneurysms, cardiovascular risk-factor
  modification, and elective open or endovascular repair once the aneurysm
  reaches a threshold diameter or rupture risk. This entry models common
  degenerative AAA; infected, inflammatory/IgG4-related, syndromic, and other
  uncommon aneurysm etiologies have distinct mechanisms and are not treated as
  subtypes of common AAA here.
category: Complex

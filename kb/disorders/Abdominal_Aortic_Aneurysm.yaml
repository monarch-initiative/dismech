environmental:
- name: Tobacco smoking exposure
  presence: Positive
  description: >-
    Cigarette smoking is the strongest established modifiable risk factor for
    common AAA and acts across inflammatory, proteolytic, and smooth-muscle-cell
    injury pathways.
  effect: Increases lifetime AAA risk.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:29945457
    reference_title: "The Association of Biomarkers of Inflammation and Extracellular Matrix Degradation With the Risk of Abdominal Aortic Aneurysm: The ARIC Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smoking is the strongest risk factor for AAA, increasing AAA lifetime
      risk by 5-fold compared with never smokers.
    explanation: A disease-specific prospective cohort report identifies smoking as the strongest AAA risk factor and quantifies lifetime risk.

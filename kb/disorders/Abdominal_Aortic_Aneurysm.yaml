  description: >-
    Gamma-aminobutyric acid (GABA) is an investigational agent shown in a rat
    AAA model and network-pharmacology analysis to reduce MMP-2/MMP-9-mediated
    extracellular matrix degradation via inhibition of GABA-A-receptor-dependent
    PI3K/AKT signaling, delaying aneurysm progression. Preclinical only; no
    established human role.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

biochemical:
- name: Circulating soluble glycoprotein VI
  context: >-
    Soluble GPVI is an investigational platelet-activation biomarker. In two
    human AAA cohorts it predicted AAA diagnosis and associated with aneurysm
    growth more strongly than D-dimer; it is not an established stand-alone
    clinical diagnostic or treatment-selection test.
  readouts:
  - target: Platelet-rich intraluminal thrombus
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: Higher soluble GPVI reflects platelet activity in AAA-associated thrombus and predicts aneurysm growth.
    evidence:
    - reference: PMID:38900973
      reference_title: "Soluble glycoprotein VI predicts abdominal aortic aneurysm growth rate and is a novel therapeutic target."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Examination of a specific indicator of platelet activity, soluble GPVI
        (sGPVI), in 2 independent cohorts of patients with AAAs is highly
        predictive of an AAA diagnosis and associates more strongly with
        aneurysm growth rate than D-dimer in humans.
      explanation: Two human cohorts support soluble GPVI as a platelet-linked diagnostic and growth-associated biomarker.
  evidence:
  - reference: PMID:38900973
    reference_title: "Soluble glycoprotein VI predicts abdominal aortic aneurysm growth rate and is a novel therapeutic target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the levels of sGPVI in humans can predict a diagnosis of AAA and AAA
      growth rate
    explanation: Human cohort evidence supports the investigational biomarker claim without asserting clinical validation.
inheritance:
- name: Multifactorial polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Common degenerative AAA has substantial heritability but no single Mendelian
    inheritance pattern. Risk reflects many common variants together with major
    environmental and demographic factors, particularly smoking, age, and sex.
  evidence:
  - reference: PMID:37845353
    reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abdominal aortic aneurysm (AAA) is a common disease with substantial
      heritability. In this study, we performed a genome-wide association
      meta-analysis from 14 discovery cohorts and uncovered 141 independent
      associations, including 97 previously unreported loci.
    explanation: A large multi-cohort GWAS establishes substantial heritability and a highly polygenic risk architecture.

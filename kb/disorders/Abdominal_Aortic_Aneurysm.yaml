    snippet: >-
      GABA reduced the expression and activity of MMP2 and MMP9, thereby
      effectively inhibiting ECM degradation and delaying the progression of
      AAA.
    explanation: In a rat AAA model, GABA reduced MMP-2/MMP-9 activity and ECM degradation, delaying aneurysm progression.
  - reference: PMID:42410225
    reference_title: "Exploring the potential mechanism of GABA in the treatment of abdominal aortic aneurysm through network pharmacology and experimental validation."
    supports: SUPPORT

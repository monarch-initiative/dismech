    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elective repair of AAA with open surgery or endovascular aortic repair
      (EVAR) should be considered to prevent AAA rupture
    explanation: EVAR is a standard, less invasive alternative to open repair for AAA.
- name: Monoclonal-antibody PCSK9 inhibition for AAA prevention (investigational)
  description: >-
    PCSK9 inhibition is a genetically prioritized but unproven AAA-prevention
    strategy. Human genetic analyses associate higher predicted PCSK9 with
    increased incident AAA risk, and Pcsk9 loss of function reduced aneurysm
    growth in a mouse model; no AAA-specific clinical efficacy is established.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: PCSK9 inhibitor
      term:
        id: NCIT:C190797
        label: PCSK9 Inhibitor
  target_mechanisms:
  - target: PCSK9 and atherogenic-lipoprotein susceptibility axis
    treatment_effect: INHIBITS
    description: >-
      PCSK9 inhibition is proposed to reduce the PCSK9/non-HDL-lipid
      susceptibility signal implicated by human genetics.
    evidence:
    - reference: PMID:37845353
      reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: >-
        human genetic evidence has overwhelmingly suggested that LDL-C
        reduction is likely to reduce AAA risk.
      explanation: >-
        Human genetic evidence supports inhibition of this susceptibility axis,
        but not clinical efficacy against AAA.
  evidence:
  - reference: PMID:37845353
    reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      human genetic evidence has overwhelmingly suggested that LDL-C reduction
      is likely to reduce AAA risk.
    explanation: >-
      Human genetic evidence supports prevention as a hypothesis, but does not
      demonstrate clinical benefit from a PCSK9 inhibitor in people with AAA.
  - reference: PMID:37845353
    reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      our Pcsk9 null mouse model demonstrated reduced AAA growth following
      elastase infusion
    explanation: >-
      Pcsk9 loss of function reduced experimental aneurysm growth in mice, an
      indirect preclinical result that does not establish drug efficacy in human
      AAA.
- name: Metformin for small-AAA growth suppression (investigational)
  description: >-
    Metformin has observational and genetic-epidemiology signals suggesting
    possible protection, but it is not an established AAA therapy. A small,
    under-recruited randomized placebo-controlled trial in non-diabetic people
    found no difference in aneurysm growth; larger trials are needed before any
    efficacy claim is warranted.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the AAA ruptures, causing life-threatening intra-abdominal haemorrhage
    explanation: Rupture with life-threatening haemorrhage is the feared complication of AAA.
- category: Clinical

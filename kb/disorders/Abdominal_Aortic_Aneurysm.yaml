    reference_title: "Accuracy of presenting symptoms, physical examination, and imaging for diagnosis of ruptured abdominal aortic aneurysm: Systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pooled sensitivities of abdominal pain, back pain, and syncope for rAAA
      were 61.7%, 53.6%, and 27.8%, respectively (low certainty).
    explanation: Meta-analysis identifies abdominal pain as a common, though insensitive, presentation of ruptured AAA.

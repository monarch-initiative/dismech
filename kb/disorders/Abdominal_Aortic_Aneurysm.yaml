- accession: geo:GSE329070
  title: TCF7L2 Promotes Abdominal Aortic Aneurysm through Smooth Muscle Cell-Mediated Extracellular Matrix Remodeling [RNA-seq]
  description: Abdominal aortic aneurysm (AAA) lacks effective pharmacological therapies. Here, we investigate transcription factor 7-like 2 (TCF7L2), a genetic locus associated with both thoracic and abdominal aortic aneurysms, to elucidate its role in AAA pathogenesis. Integrating summary-data-based Mendelian randomization (SMR) with single-cell RNA sequencing (scRNA-seq) of human and mouse aortas, we identify TCF7L2 as a gene enriched in vascular smooth muscle cells (VSMCs) and causally linked to AAA development.

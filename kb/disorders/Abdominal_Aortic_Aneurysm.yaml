  description: >-
    Catastrophic rupture of the aneurysmal aorta producing life-threatening
    retroperitoneal or intra-abdominal haemorrhage; the principal cause of death
    in AAA.
  phenotype_term:
    preferred_term: Aortic rupture
    term:
      id: HP:0031649

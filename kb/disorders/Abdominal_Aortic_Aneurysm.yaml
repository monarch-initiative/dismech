      term:
        id: CHEBI:6801
        label: metformin
  evidence:
  - reference: PMID:40311839
    reference_title: "Editor's Choice - Metformin to Inhibit Progression of Abdominal Aortic Aneurysm: A Randomised, Placebo Controlled Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No difference in AAA growth between the metformin and placebo groups was
      observed.
    explanation: The randomized MetAAA trial did not demonstrate the proposed small-AAA growth-suppression effect.
  - reference: PMID:40311839
    reference_title: "Editor's Choice - Metformin to Inhibit Progression of Abdominal Aortic Aneurysm: A Randomised, Placebo Controlled Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering the lack of power of the study, larger randomised controlled
      trials with longer follow up are required to detect smaller treatment
      effects.
    explanation: The negative proof-of-concept trial was underpowered, so a smaller effect remains unresolved rather than disproven.
  - reference: PMID:42487515
    reference_title: "Evidence of a Protective Effect of Metformin on Abdominal Aortic Aneurysm Risk: Insights From an Observational Study and Mendelian Randomisation Analysis Using Putative Metformin Targets."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found evidence of a protective association between self-reported
      metformin treatment and reduced AAA risk in the observational analysis, OR
      0.49 (95% CI: 0.41-0.59, p = 1.5 × 10-14).
    explanation: Observational human data support a protective association for incident AAA but do not establish efficacy against growth of an existing aneurysm.
  - reference: PMID:42487515
    reference_title: "Evidence of a Protective Effect of Metformin on Abdominal Aortic Aneurysm Risk: Insights From an Observational Study and Mendelian Randomisation Analysis Using Putative Metformin Targets."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      MR results support this finding, with an estimated decrease in AAA risk of
      43%, OR = 0.57 (95% CI: 0.38-0.88, p = 0.010) per one standard deviation
      (sd) decrease in HbA1c via metformin gene targets, equivalent to the effect
      of a prescribed dose of metformin.
    explanation: Mendelian randomization provides indirect causal support for reduced incident AAA risk, not direct trial evidence of growth suppression.

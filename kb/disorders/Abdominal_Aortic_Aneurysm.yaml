pathophysiology:
- name: PCSK9 and atherogenic-lipoprotein susceptibility axis
  biological_scale: MOLECULAR
  description: >-
    Human genetic analyses implicate non-HDL cholesterol and genetically
    predicted circulating PCSK9 in susceptibility to developing AAA. This is a
    risk axis rather than proof that PCSK9 determines the growth or rupture of
    an established aneurysm.
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  biological_processes:
  - preferred_term: cholesterol metabolic process
    modifier: INCREASED
    term:
      id: GO:0008203
      label: cholesterol metabolic process
  evidence:
  - reference: PMID:37845353
    reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      this was supported by evidence of significant colocalization between
      PCSK9 protein quantitative trait loci (pQTL) and AAA GWAS at the PCSK9
      locus
    explanation: >-
      Mendelian-randomization and colocalization analyses support a PCSK9-linked
      susceptibility mechanism for incident AAA, without establishing an effect
      on growth or rupture of an existing aneurysm.
  downstream:
  - target: Progressive aortic dilatation
    description: >-
      In an elastase mouse model, Pcsk9 loss of function blunted experimental
      AAA growth, linking this susceptibility axis to dilatation in that model;
      this does not establish an effect on established human AAA.
    evidence:
    - reference: PMID:37845353
      reference_title: "Genome-wide association meta-analysis identifies risk loci for abdominal aortic aneurysm and highlights PCSK9 as a therapeutic target."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        our Pcsk9 null mouse model demonstrated reduced AAA growth following
        elastase infusion
      explanation: Mouse loss-of-function evidence supports this edge preclinically, but not as an established human progression mechanism.
- name: Aortic wall inflammatory cell infiltration
  biological_scale: TISSUE
  description: >-
    Chronic transmural inflammation of the aortic wall, with infiltration of
    macrophages and lymphocytes, is an early and sustained feature of AAA. The
    inflammatory infiltrate drives local production of proteolytic enzymes and
    pro-inflammatory cytokines (e.g., IL-6) that promote extracellular matrix
    breakdown and aneurysm progression.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:37799778
    reference_title: "The contribution of matrix metalloproteinases and their inhibitors to the development, progression, and rupture of abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathological observations advocate inflammatory cell infiltration
      alongside adverse extracellular matrix degradation as key contributing
      factors to the formation of human atherosclerotic AAAs.
    explanation: Human pathology observations identify inflammatory cell infiltration as a key contributor to AAA formation.
  - reference: PMID:29945457
    reference_title: "The Association of Biomarkers of Inflammation and Extracellular Matrix Degradation With the Risk of Abdominal Aortic Aneurysm: The ARIC Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      blood concentrations of MMP-9 and IL-6 measured in middle age predicted
      the risk of AAA during 24 years of follow-up.
    explanation: >-
      In the ARIC cohort, circulating IL-6 prospectively predicted future AAA.
      This supports an association with the inflammatory axis but does not by
      itself establish that IL-6 is an upstream causal driver in the aortic wall.
  downstream:
  - target: Matrix metalloproteinase-mediated aortic wall proteolysis
    description: Infiltrating macrophages secrete proteolytic enzymes that degrade the aortic extracellular matrix.
- name: Matrix metalloproteinase-mediated aortic wall proteolysis
  biological_scale: MOLECULAR
  description: >-
    Macrophage- and smooth muscle cell-derived matrix metalloproteinases
    (notably MMP-2 and MMP-9) are the predominant proteinases in the AAA wall.
    A shift in the balance between MMPs and their tissue inhibitors (TIMPs)
    toward net proteolysis drives destruction of the load-bearing matrix. MMP-9
    is elevated in the circulation of patients who later develop AAA.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  evidence:
  - reference: PMID:37799778
    reference_title: "The contribution of matrix metalloproteinases and their inhibitors to the development, progression, and rupture of abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      macrophage production of proteolytic enzymes is deemed responsible for the
      damaging loss of ECM proteins, especially elastin and fibrillar collagens,
      which characterise AAA progression and rupture.
    explanation: Identifies macrophage-derived proteolytic enzymes as responsible for the matrix loss that characterizes AAA progression and rupture.
  - reference: PMID:29945457
    reference_title: "The Association of Biomarkers of Inflammation and Extracellular Matrix Degradation With the Risk of Abdominal Aortic Aneurysm: The ARIC Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher concentrations of MMP-9 and IL-6 were associated with future risk
      of clinically diagnosed AAA
    explanation: >-
      Circulating MMP-9 prospectively associated with future AAA in a human
      cohort. This is consistent with, but does not directly demonstrate,
      MMP-9-mediated proteolysis within the aneurysmal wall.
  downstream:
  - target: Elastin and collagen extracellular matrix degradation
    description: MMP activity degrades the elastin and fibrillar collagen that provide aortic wall strength.
- name: Elastin and collagen extracellular matrix degradation
  biological_scale: TISSUE
  description: >-
    Proteolytic loss of medial elastic lamellae and fibrillar collagen removes
    the principal load-bearing components of the aortic wall. Elastin
    fragmentation reduces recoil and compliance, while collagen degradation
    ultimately compromises tensile strength and predisposes to rupture.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: collagen catabolic process
    modifier: INCREASED
    term:
      id: GO:0030574
      label: collagen catabolic process
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AAA results from changes in the aortic wall structure, including thinning
      of the media and adventitia due to the loss of vascular smooth muscle
      cells and degradation of the extracellular matrix.
    explanation: The definitive AAA review attributes AAA to extracellular matrix degradation and wall thinning.
  downstream:
  - target: Progressive aortic dilatation
    description: Loss of load-bearing elastin and collagen weakens the wall and permits progressive dilatation.
  - target: Medial smooth muscle cell depletion and wall thinning
    description: Extracellular-matrix degradation is one proposed inducer of medial VSMC apoptosis in AAA.
    evidence:
    - reference: PMID:37799778
      reference_title: "The contribution of matrix metalloproteinases and their inhibitors to the development, progression, and rupture of abdominal aortic aneurysms."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Multiple factors have been proposed to induce VSMC apoptosis including
        oxidised lipoproteins, cytokines, and increased reactive oxygen species
        (41), alongside extracellular matrix degradation (42) and mechanical
        stress (43).
      explanation: A disease-specific narrative review identifies extracellular-matrix degradation as a proposed, rather than established, inducer of VSMC apoptosis.
- name: Medial smooth muscle cell depletion and wall thinning
  biological_scale: CELLULAR
  description: >-
    Apoptosis and loss of medial vascular smooth muscle cells, the cells that
    synthesize and maintain the aortic matrix, thins the media and adventitia
    and impairs the wall's capacity to repair ongoing matrix injury.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      thinning of the media and adventitia due to the loss of vascular smooth
      muscle cells
    explanation: Loss of vascular smooth muscle cells and medial/adventitial thinning is a core structural change in AAA.
  downstream:
  - target: Progressive aortic dilatation
    description: A weakened, thinned wall permits progressive aneurysmal dilatation.
- name: Platelet-rich intraluminal thrombus
  biological_scale: TISSUE
  description: >-
    A non-occlusive intraluminal thrombus commonly forms within the dilated
    aneurysm sac. Human thrombus transcriptomics shows enrichment of
    platelet-associated transcripts and GPVI, while circulating soluble GPVI
    associates with aneurysm diagnosis and growth. The thrombus is therefore a
    biologically active compartment rather than merely an imaging bystander,
    although its net mechanical and inflammatory effects remain context dependent.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  evidence:
  - reference: PMID:38900973
    reference_title: "Soluble glycoprotein VI predicts abdominal aortic aneurysm growth rate and is a novel therapeutic target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A common feature in patients with abdominal aortic aneurysms (AAAs) is the
      formation of a nonocclusive intraluminal thrombus (ILT) in regions of
      aortic dilation.
    explanation: Human AAA tissue commonly contains a non-occlusive intraluminal thrombus.
  - reference: PMID:38900973
    reference_title: "Soluble glycoprotein VI predicts abdominal aortic aneurysm growth rate and is a novel therapeutic target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using RNA sequencing, we identified that the platelet-associated
      transcripts are significantly enriched in the ILT compared with the
      adjacent aneurysm wall and healthy control aortas.
    explanation: RNA sequencing of excised human tissue identifies platelet enrichment within AAA thrombus.
  downstream:
  - target: Progressive aortic dilatation
    description: Platelet/GPVI activity within the ILT contributes to aneurysm progression in experimental models.
    evidence:
    - reference: PMID:38900973
      reference_title: "Soluble glycoprotein VI predicts abdominal aortic aneurysm growth rate and is a novel therapeutic target."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        intervention with the anti-GPVI antibody (JAQ1) in mice with established
        aneurysms blunted the progression of AAA in 2 independent mouse models.
      explanation: Anti-GPVI intervention supports a platelet-linked contribution to progression in mice, but does not directly establish the direction or magnitude of ILT feedback in humans.
- name: Progressive aortic dilatation
  biological_scale: TISSUE
  description: >-
    Cumulative loss of wall strength allows progressive dilatation of the
    infrarenal aorta. Enlargement raises mechanical wall stress and is the main
    clinically used marker of rupture risk.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:29945457
    reference_title: "The Association of Biomarkers of Inflammation and Extracellular Matrix Degradation With the Risk of Abdominal Aortic Aneurysm: The ARIC Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abdominal aortic aneurysm (AAA) is characterized by progressive and
      irreversible dilatation of the aortic wall
    explanation: Describes progressive, irreversible aortic-wall dilatation as the defining disease course.
  downstream:
  - target: Abdominal aortic aneurysm
    description: Progressive infrarenal aortic dilatation produces the defining aneurysm phenotype.
  - target: Platelet-rich intraluminal thrombus
    description: Dilated aneurysm regions commonly develop non-occlusive intraluminal thrombus.
  - target: Aortic wall rupture
    description: Increasing aneurysm diameter raises the risk of wall rupture.
  - target: Pulsatile abdominal mass
    description: A sufficiently enlarged aneurysm may be palpable as a pulsatile abdominal mass.
- name: Aortic wall rupture
  biological_scale: TISSUE
  description: >-
    Rupture occurs when arterial-pressure-driven wall stress exceeds the
    residual strength of the thinned, matrix-depleted aneurysm wall, producing
    life-threatening intra-abdominal or retroperitoneal haemorrhage.
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mechanical stress of the blood pressure acting on the wall exceeds
      the wall strength, the AAA ruptures, causing life-threatening
      intra-abdominal haemorrhage - the mortality for patients with ruptured AAA
      is 65-85%.
    explanation: Describes the biomechanical basis of AAA rupture and its high mortality.
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although AAAs of any size can rupture, the risk of rupture increases with
      diameter.
    explanation: Aneurysm diameter is the principal determinant of rupture risk, underpinning diameter-based repair thresholds.
  downstream:
  - target: Aortic rupture
    description: Structural failure of the aneurysm wall manifests clinically as aortic rupture.
  - target: Abdominal pain
    description: Ruptured AAA commonly presents with abdominal pain.
  - target: Back pain
    description: Ruptured AAA commonly presents with back pain.
  - target: Syncope
    description: Acute blood loss from ruptured AAA may present with syncope.
  - target: Hypotension
    description: Ruptured AAA may produce hypotension from internal haemorrhage.

diagnosis:
- name: Abdominal ultrasonography and CT angiography
  description: >-
    AAA is defined as an infrarenal aortic diameter of at least 3 cm. Abdominal
    ultrasonography is the primary screening and surveillance modality; computed
    tomography angiography provides detailed anatomic assessment for planning
    repair. Most intact aneurysms are asymptomatic and detected incidentally or
    through population screening of older men.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Infrarenal aortic diameter >=3 cm on imaging establishes the diagnosis; larger diameter indicates higher rupture risk.
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in settings where screening programmes with ultrasonography are not
      implemented, most cases are diagnosed incidentally.
    explanation: Ultrasonography screening and incidental detection are the principal routes to AAA diagnosis.
  - reference: PMID:27871502
    reference_title: "Screening for abdominal aortic aneurysm in asymptomatic adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "evidence showed significant reductions in AAA-related mortality and AAA rupture rate up to 13 to 15 years of follow-up with 42% reduction"
    explanation: >-
      USPSTF systematic evidence review of population trials shows one-time
      ultrasound screening significantly reduces AAA-related mortality and
      rupture, the basis for recommending screening in older men who have smoked.
treatments:
- name: Ultrasound surveillance of small aneurysms
  description: >-
    Small, asymptomatic aneurysms below the repair threshold are monitored with
    serial abdominal ultrasonography, with repair considered as diameter or
    growth rate increases rupture risk.
  treatment_term:
    preferred_term: diagnostic ultrasound
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:38307694
    reference_title: "Editor's Choice -- European Society for Vascular Surgery (ESVS) 2024 Clinical Practice Guidelines on the Management of Abdominal Aorto-Iliac Artery Aneurysms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management of patients with small abdominal aortic aneurysm (AAA),
      including surveillance, cardiovascular risk reduction, and indication for
      repair
    explanation: The current ESVS guideline explicitly covers surveillance as part of small-AAA management.
  - reference: PMID:29268916
    reference_title: "The Society for Vascular Surgery practice guidelines on the care of patients with an abdominal aortic aneurysm."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recommended surveillance imaging at 12-month intervals for patients with
      an AAA of 4.0 to 4.9 cm in diameter.
    explanation: The SVS practice guideline gives a concrete annual surveillance interval for 4.0-4.9-cm AAA.
- name: Cardiovascular risk-factor modification and smoking cessation
  description: >-
    Smoking cessation and control of cardiovascular risk factors are central to
    conservative management, given that smoking is the strongest modifiable risk
    factor for developing AAA.
  treatment_term:
    preferred_term: tobacco cessation counseling
    term:
      id: NCIT:C101244
      label: Tobacco Cessation Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:29945457
    reference_title: "The Association of Biomarkers of Inflammation and Extracellular Matrix Degradation With the Risk of Abdominal Aortic Aneurysm: The ARIC Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While smoking prevention and cessation are the most effective strategies
      in AAA prevention, the effect of smoking on AAA lasts for at least 10
      years after smoking cessation.
    explanation: The prospective AAA cohort report explicitly identifies prevention and cessation as the most effective smoking-focused strategies.
- name: Open surgical repair
  description: >-
    Elective open surgical repair replaces the aneurysmal aortic segment with a
    prosthetic graft to prevent rupture; considered once the aneurysm reaches a
    threshold diameter or rupture risk.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:

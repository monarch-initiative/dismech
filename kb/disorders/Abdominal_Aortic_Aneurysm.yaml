  description:  A large research cohort of Geisinger Abdominal Aortic Aneurysm (AAA) patients was created by enrolling and consenting patients of the Geisinger Department of Vascular Surgery. Consented patients provide blood, serum and DNA samples for research and authorize use of data in their medical record for research. They also complete a data questionnaire that asks information about family history of AAA and other vascular diseases, as well as information on known or suspected AAA risk factors, including smoking history, body mass index, hypertension, type 2 diabetes, and atherosclerotic disease.

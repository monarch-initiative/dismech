diagnosis:
- name: Abdominal ultrasonography and CT angiography
  description: >-
    AAA is defined as an infrarenal aortic diameter of at least 3 cm. Abdominal
    ultrasonography is the primary screening and surveillance modality; computed
    tomography angiography provides detailed anatomic assessment for planning
    repair. Most intact aneurysms are asymptomatic and detected incidentally or
    through population screening of older men.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: Infrarenal aortic diameter >=3 cm on imaging establishes the diagnosis; larger diameter indicates higher rupture risk.
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in settings where screening programmes with ultrasonography are not
      implemented, most cases are diagnosed incidentally.
    explanation: Ultrasonography screening and incidental detection are the principal routes to AAA diagnosis.
treatments:
- name: Ultrasound surveillance of small aneurysms
  description: >-
    Small, asymptomatic aneurysms below the repair threshold are monitored with
    serial abdominal ultrasonography, with repair considered as diameter or
    growth rate increases rupture risk.
- name: Cardiovascular risk-factor modification and smoking cessation
  description: >-
    Smoking cessation and control of cardiovascular risk factors are central to
    conservative management, given that smoking is the strongest modifiable risk
    factor for AAA presence, growth, and rupture.
  treatment_term:
    preferred_term: tobacco cessation counseling
    term:
      id: MAXO:0000081
      label: tobacco cessation counseling
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      smoking, male sex and a positive family history are the most important
      risk factors
    explanation: Smoking is the leading modifiable risk factor, motivating smoking cessation as a management priority.
- name: Open surgical repair
  description: >-
    Elective open surgical repair replaces the aneurysmal aortic segment with a
    prosthetic graft to prevent rupture; considered once the aneurysm reaches a
    threshold diameter or rupture risk.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elective repair of AAA with open surgery or endovascular aortic repair
      (EVAR) should be considered to prevent AAA rupture
    explanation: Elective open surgical repair is a standard intervention to prevent AAA rupture.
- name: Endovascular aneurysm repair (EVAR)
  description: >-
    Endovascular aneurysm repair excludes the aneurysm sac from arterial
    pressure by deploying a stent graft via the femoral arteries; a less
    invasive alternative to open repair for anatomically suitable aneurysms.
  treatment_term:
    preferred_term: Endovascular Aneurysm Repair
    term:
      id: NCIT:C157839
      label: Endovascular Aneurysm Repair
  evidence:
  - reference: PMID:30337540
    reference_title: "Abdominal aortic aneurysms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elective repair of AAA with open surgery or endovascular aortic repair
      (EVAR) should be considered to prevent AAA rupture
    explanation: EVAR is a standard, less invasive alternative to open repair for AAA.
- name: GABA (investigational)
  description: >-
    Gamma-aminobutyric acid (GABA) is an investigational agent shown in a rat
    AAA model and network-pharmacology analysis to reduce MMP-2/MMP-9-mediated
    extracellular matrix degradation via inhibition of GABA-A-receptor-dependent
    PI3K/AKT signaling, delaying aneurysm progression. Preclinical only; no
    established human role.
  target_mechanisms:
  - target: Matrix metalloproteinase-mediated aortic wall proteolysis
    treatment_effect: INHIBITS
    description: >-
      GABA suppressed MMP-2/MMP-9 activity and extracellular matrix degradation
      in the aneurysmal aortic wall in a rat model, acting through
      GABA-A-receptor-dependent PI3K/AKT signaling.
  evidence:
  - reference: PMID:42410225
    reference_title: "Exploring the potential mechanism of GABA in the treatment of abdominal aortic aneurysm through network pharmacology and experimental validation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GABA reduced the expression and activity of MMP2 and MMP9, thereby
      effectively inhibiting ECM degradation and delaying the progression of
      AAA.
    explanation: In a rat AAA model, GABA reduced MMP-2/MMP-9 activity and ECM degradation, delaying aneurysm progression.
  - reference: PMID:42410225
    reference_title: "Exploring the potential mechanism of GABA in the treatment of abdominal aortic aneurysm through network pharmacology and experimental validation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      KEGG analysis showed that the PI3K/AKT signaling pathway was the key
      pathway through which GABA exerted its therapeutic effects.
    explanation: Network-pharmacology (in silico) analysis implicated PI3K/AKT signaling as the key pathway of GABA action in AAA.

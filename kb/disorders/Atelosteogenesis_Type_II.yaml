notes: >-
  AOII is curated as SLC26A2-related atelosteogenesis, not as an FLNB disorder.
  Its usual perinatal lethality is not absolute. Residual sulfate-transport
  activity contributes to the ACG1B-AOII-DTD-rMED severity continuum, but
  published families and functional testing show that genotype alone does not
  perfectly predict the named clinical subtype. The Slc26a2-null
  UPR-FGFR3/FGFR-inhibitor work is preclinical and is therefore represented as
  a provisional mechanism and animal-model finding rather than a treatment.
review_notes: >-
  Full re-review completed against the pinned Orphadata 2025-12-09 snapshot and
  literature caches. ClinicalTrials.gov API exact-condition searches for
  "Atelosteogenesis type II" and AOII returned no disease-specific studies on
  2026-07-20; seven broad full-text matches were unrelated studies and were
  excluded. No AOII-specific public molecular dataset was identified, so both
  clinical_trials and datasets are intentionally empty. Orphanet frequency
  bands are retained as curated categorical assertions and are not converted
  into unsupported exact percentages.

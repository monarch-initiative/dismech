diagnosis:
- name: Prenatal Fetal Ultrasonography
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  description: >-
    Detailed fetal ultrasonography can identify severe limb shortening,
    abnormal thumb/toe position, vertebral coronal clefts, cervical kyphosis,
    metaphyseal/epiphyseal abnormalities, and abnormal pelvic ossification.
    These findings raise suspicion for AOII but overlap other lethal skeletal
    dysplasias and require molecular confirmation when possible.
  results: >-
    A compatible fetal skeletal pattern supports prenatal suspicion; it does
    not by itself distinguish SLC26A2-AOII from every FLNB- or
    SLC26A2-spectrum differential.
  evidence:
  - reference: PMID:1279661
    reference_title: "Atelosteogenesis type II: sonographic and radiological correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The feasibility of diagnosing the following morphological features by prenatal ultrasonography is demonstrated: coronal clefts of the vertebral bodies, metaphyseal and epiphyseal abnormalities, spinal deviations such as cervical kyphosis and a horizontal sacrum, additional ossification centres in the pelvis, and preaxial deviation of the thumbs and toes.
    explanation: >-
      This directly documents the fetal sonographic pattern used to recognize AOII.
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrasound examination early in pregnancy is a reasonable complement or alternative to molecular genetic prenatal testing.
    explanation: >-
      GeneReviews supports early-pregnancy ultrasound as an adjunct or
      alternative when familial molecular prenatal testing is being considered.
- name: Clinical, Skeletal-Radiographic, and Histopathologic Evaluation
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  description: >-
    Examination and a complete skeletal radiographic survey define the limb,
    vertebral, pelvic, and hand/foot pattern. Cartilage histopathology can
    support classification, especially after perinatal death, but neither
    imaging nor histology replaces molecular testing because AO subtypes and
    other lethal skeletal dysplasias overlap.
  results: >-
    Characteristic clinical, radiologic, and histopathologic findings establish
    the phenotypic diagnosis and direct SLC26A2 testing.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SLC26A2-related atelosteogenesis is established in a proband with characteristic clinical, radiologic, and histopathologic features and biallelic pathogenic variants in SLC26A2 identified by molecular genetic testing.
    explanation: >-
      GeneReviews defines the integrated phenotypic, radiologic,
      histopathologic, and molecular framework.
  - reference: PMID:9133349
    reference_title: "Atelosteogenesis syndromes: a review, with comments on their pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atelosteogenesis type II shows distinctive chondro-osseous histopathology with a major disturbance in cartilage matrix macromolecules.
    explanation: >-
      The review supports the diagnostic value of the distinctive cartilage
      lesion while documenting overlap across atelosteogenesis syndromes.
- name: Molecular SLC26A2 Testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequence and copy-number analysis of SLC26A2, either directly or within a
    skeletal-dysplasia panel/exome/genome workflow, should identify two
    pathogenic variants in trans. Molecular confirmation distinguishes AOII
    from FLNB-related AOI/AOIII and places the result within the broader
    SLC26A2 spectrum.
  results: >-
    Biallelic pathogenic SLC26A2 variants in a fetus or infant with the
    compatible phenotype establish SLC26A2-related atelosteogenesis; phenotype
    and radiology remain necessary for subtype assignment.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SLC26A2-related atelosteogenesis is established in a proband with characteristic clinical, radiologic, and histopathologic features and biallelic pathogenic variants in SLC26A2 identified by molecular genetic testing.
    explanation: >-
      This directly supports biallelic SLC26A2 molecular confirmation.
treatments:
- name: Individualized Perinatal Airway and Respiratory Support
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: airway management
  description: >-
    Delivery planning should anticipate a small thorax, pulmonary hypoplasia,
    laryngeal stenosis, and tracheobronchomalacia. Immediate airway assessment
    and respiratory stabilization may be offered when consistent with the
    infant's anatomy, clinical status, prognosis, and family goals. The evidence
    does not establish a disease-modifying benefit or a uniform ventilation
    strategy.
  target_phenotypes:
  - preferred_term: Pulmonary hypoplasia
    term:
      id: HP:0002089
      label: Pulmonary hypoplasia
  - preferred_term: Tracheobronchomalacia
    term:
      id: HP:0002786
      label: Tracheobronchomalacia
  - preferred_term: Laryngeal stenosis
    term:
      id: HP:0001602
      label: Laryngeal stenosis
  evidence:
  - reference: PMID:3799721
    reference_title: "de la Chapelle dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal death occurred in all cases and may be attributed to a consistent triad of respiratory tract malformations: laryngeal stenosis, tracheobronchomalacia, and pulmonary hypoplasia.
    explanation: >-
      The airway and pulmonary triad establishes the anatomic problems that
      perinatal respiratory planning must address.
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no specific treatment currently available, and the aim of therapy (supportive versus palliative) will depend on clinical status and respiratory prognosis of the individual patient.
    explanation: >-
      GeneReviews supports individualizing active support according to clinical
      status and respiratory prognosis.
- name: Palliative and Comfort-Focused Care
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: palliative care
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  description: >-
    Because respiratory disease is usually lethal and no specific treatment is
    available, comfort-focused care is an appropriate option after transparent
    multidisciplinary counseling. The choice between supportive and palliative
    goals should be individualized and revisited if the observed course differs
    from the usual prognosis.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no specific treatment currently available, and the aim of therapy (supportive versus palliative) will depend on clinical status and respiratory prognosis of the individual patient.
    explanation: >-
      GeneReviews directly supports palliative as well as supportive goals and
      explicitly ties the decision to the individual respiratory prognosis.
- name: Genetic Counseling and Reproductive Testing Options
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Counsel parents about autosomal-recessive inheritance, the 25% recurrence
    risk when both are carriers, carrier testing for relatives, and prenatal or
    preimplantation testing once both familial variants are known. Early fetal
    ultrasound is complementary but does not eliminate molecular uncertainty.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk relatives and prenatal and preimplantation genetic testing for a pregnancy at increased risk are possible if both pathogenic variants in the family are known.
    explanation: >-
      GeneReviews directly supports carrier, prenatal, and preimplantation
      testing after familial variants are defined.
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an SLC26A2 pathogenic variant, each sib of a proband with SLC26A2-related atelosteogenesis has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      This provides the recurrence-risk basis for family counseling.
differential_diagnoses:
- name: Atelosteogenesis Type I
  disease_term:
    preferred_term: atelosteogenesis type I
    term:
      id: MONDO:0007167
      label: atelosteogenesis type I
  description: >-
    AOI overlaps AOII in lethal short-limbed skeletal dysplasia, vertebral
    abnormalities, and perinatal respiratory compromise. AOI belongs to the
    monoallelic FLNB spectrum, whereas AOII requires biallelic SLC26A2 variants
    and a sulfate-transport/cartilage-matrix defect.
  distinguishing_features:
  - Heterozygous FLNB missense variants, usually de novo, support AOI; biallelic SLC26A2 variants support AOII.
  - AOI/AOIII prominently feature joint dislocations and disharmonious skeletal maturation; AOII classically combines hitchhiker thumbs, cleft palate, and SLC26A2-spectrum histopathology.
  - Dominant versus recessive inheritance changes recurrence counseling.
  evidence:
  - reference: PMID:16752402
    reference_title: Mutations in two regions of FLNB result in atelosteogenesis I and III.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AOI and AOIII are autosomal dominant lethal skeletal dysplasias characterized by overlapping clinical findings that include vertebral abnormalities, disharmonious skeletal maturation, hypoplastic long bones, and joint dislocations.
    explanation: >-
      This defines the dominant FLNB AOI/AOIII spectrum and its major overlapping
      skeletal findings.
  - reference: PMID:8571951
    reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report that AOII patients also have DTDST mutations, which lead to defective uptake of inorganic sulfate and insufficient sulfation of macromolecules by patient mesenchymal cells in vitro.
    explanation: >-
      The AOII genetic and biochemical basis separates it from FLNB-AOI.
- name: Atelosteogenesis Type III
  disease_term:
    preferred_term: atelosteogenesis type III
    term:
      id: MONDO:0007168
      label: atelosteogenesis type III
  description: >-
    AOIII overlaps AOI and AOII in severe limb, vertebral, joint, and airway
    disease, but it is a monoallelic FLNB disorder and can show substantially
    longer survival and vertical transmission. Molecular testing is the most
    reliable boundary when morphology overlaps.
  distinguishing_features:
  - Heterozygous FLNB variants support AOIII; biallelic SLC26A2 variants support AOII.
  - Documented adult survival and vertical transmission establish that AOIII is not uniformly perinatal lethal.
  - AOIII belongs to the dominant FLNB/Larsen spectrum rather than the recessive SLC26A2 sulfation spectrum.
  evidence:
  - reference: PMID:16752402
    reference_title: Mutations in two regions of FLNB result in atelosteogenesis I and III.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the gene encoding filamin B (FLNB) cause a spectrum of osteochondrodysplasias, including atelosteogenesis type I (AOI) and atelosteogenesis type III (AOIII).
    explanation: >-
      This directly assigns AOIII to the FLNB spectrum.
  - reference: PMID:10076882
    reference_title: "Atelosteogenesis type III: long term survival, prenatal diagnosis, and evidence for dominant transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first documentation of survival to adulthood of an individual with this disorder, of prenatal diagnostic assessment of an affected individual, and of vertical transmission suggestive of autosomal dominant inheritance.
    explanation: >-
      Adult survival and vertical transmission help distinguish the AOIII
      spectrum while confirming dominant inheritance.
- name: Achondrogenesis Type IB
  description: >-
    ACG1B and AOII are both lethal autosomal-recessive SLC26A2
    chondrodysplasias. ACG1B generally lies at the more severe end of the
    continuum and is more often associated with two alleles having minimal
    transport function, but overlap and imperfect genotype-phenotype prediction
    require integrated radiologic and pathologic classification.
  distinguishing_features:
  - ACG1B is generally more severe than AOII within the same SLC26A2 continuum.
  - Two near-null alleles favor ACG1B, whereas AOII often retains more transporter function; this is a tendency, not an absolute rule.
  - Radiographic and histopathologic severity should accompany genotype when assigning the subtype.
  evidence:
  - reference: PMID:8571951
    reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with our recent observation that a third even more severe chondrodysplasia, achondrogenesis type IB, is also caused by mutations in DTDST, these results demonstrate a phenotypic series of three chondrodysplasias of increasing severity caused by lesions in a single sulfate-transporter gene.
    explanation: >-
      The discovery study places ACG1B above AOII in severity within the same
      gene-defined series.
  - reference: PMID:11448940
    reference_title: "Mutations in the diastrophic dysplasia sulfate transporter (DTDST) gene: correlation between sulfate transport activity and chondrodysplasia phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, in the X.laevis oocyte expression system, the correlation between residual transport function and the severity of phenotype was not absolute, suggesting that factors in addition to the intrinsic sulfate transport properties of the DTDST protein may influence the phenotype in individuals with DTDST mutations.
    explanation: >-
      Functional testing supports the severity trend while preventing an
      overconfident genotype-only distinction.
- name: Diastrophic Dysplasia
  disease_term:
    preferred_term: diastrophic dysplasia
    term:
      id: MONDO:0009107
      label: diastrophic dysplasia
  description: >-
    Diastrophic dysplasia shares biallelic SLC26A2 variants, hitchhiker thumbs,
    clubfoot, cleft palate, and abnormal cartilage sulfation with AOII, but is
    usually much less severe and compatible with survival. Intermediate
    phenotypes reinforce that this is a continuum rather than a perfectly sharp
    molecular boundary.
  distinguishing_features:
  - Survival with chronic skeletal morbidity favors diastrophic dysplasia over classic perinatal-lethal AOII.
  - AOII has more profound micromelia, thoracic restriction, pulmonary hypoplasia, and airway malacia.
  - Genotype contributes to severity but does not replace clinicoradiologic classification.
  evidence:
  - reference: PMID:8571951
    reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atelosteogenesis type II (AO II) is a neonatally lethal chondrodysplasia whose clinical and histological characteristics resemble those of another chondrodysplasia, the much less severe diastrophic dysplasia (DTD).
    explanation: >-
      This directly describes the shared pathology and large severity difference.
  - reference: PMID:21077202
    reference_title: "Genotype-phenotype correlation in DTDST dysplasias: Atelosteogenesis type II and diastrophic dysplasia variant in one family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis suggests that, while the DTDST family of disorders contains at least seven different conditions, mutations in the DTDST gene, in fact, appear to cause a phenotypic continuum. Furthermore, DTDST genotype alone is an imperfect predictor of clinical severity along this continuum.
    explanation: >-
      A family spanning AOII and a diastrophic phenotype supports a continuous,
      overlapping boundary.

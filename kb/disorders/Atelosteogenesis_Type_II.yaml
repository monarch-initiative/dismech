- name: Thoracic and Airway Cartilage Insufficiency
  description: >-
    Small thoracic dimensions restrict fetal lung growth, while abnormal
    laryngeal, tracheal, and bronchial cartilage produces stenosis and dynamic
    airway collapse. Together these lesions explain the usual perinatal
    respiratory lethality.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:3799721
    reference_title: "de la Chapelle dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal death occurred in all cases and may be attributed to a consistent triad of respiratory tract malformations: laryngeal stenosis, tracheobronchomalacia, and pulmonary hypoplasia.
    explanation: >-
      The case series directly identifies the lethal respiratory-tract triad.
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC26A2-related atelosteogenesis is usually lethal at birth or shortly thereafter due to pulmonary hypoplasia and tracheobronchomalacia.
    explanation: >-
      GeneReviews confirms pulmonary and airway cartilage disease as the usual
      cause of early death.

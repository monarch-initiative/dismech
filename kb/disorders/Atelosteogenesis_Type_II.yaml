- name: Collagen Retention, ATF6-UPR, and FGFR3 Overactivation
  description: >-
    In Slc26a2-null mouse chondrocytes, impaired type II/type IX collagen
    secretion causes intracellular collagen retention, preferential ATF6
    unfolded-protein-response activation, and excessive FGFR3 signaling. This
    is a provisional preclinical branch and is not yet established as a human
    AOII biomarker or treatment target.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:30685387
    reference_title: Suppressing UPR-dependent overactivation of FGFR3 signaling ameliorates SLC26A2-deficient chondrodysplasias.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, slc26a2-/- chondrocytes are defective for collagen secretion, exhibiting intracellular retention and compromised extracellular deposition of ColII and ColIX. As a consequence, the ATF6 arm of the unfolded protein response (UPR) is preferentially triggered to overactivate FGFR3 signaling by inducing excessive FGFR3 in slc26a2-/- chondrocytes.
    explanation: >-
      The knockout study directly supports the full preclinical cellular branch.
  downstream:
  - target: Abnormal Cartilage Matrix and Endochondral Ossification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Excess FGFR3 signaling
    - Altered cartilage growth and chondrocyte proliferation-apoptosis balance
    evidence:
    - reference: PMID:30685387
      reference_title: Suppressing UPR-dependent overactivation of FGFR3 signaling ameliorates SLC26A2-deficient chondrodysplasias.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Consistently, suppressing FGFR3 signaling by blocking either FGFR3 or phosphorylation of the downstream effector favors the recovery of slc26a2-/- cartilage cultures from impaired growth and unbalanced cell proliferation and apoptosis.
      explanation: >-
        Rescue of knockout cartilage growth supports a causal link from the
        signaling branch to cartilage-growth failure.
genetic:
- name: SLC26A2 Pathogenic Variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SLC26A2
    term:
      id: hgnc:10994
      label: SLC26A2
  notes: >-
    Biallelic SLC26A2 pathogenic variants are causative and place AOII on the
    SLC26A2 chondrodysplasia continuum. Residual transport activity contributes
    to severity, but genotype alone is an imperfect predictor and a single
    variant should not be used to force an AOII-versus-ACG1B-versus-DTD label.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SLC26A2-related atelosteogenesis is established in a proband with characteristic clinical, radiologic, and histopathologic features and biallelic pathogenic variants in SLC26A2 identified by molecular genetic testing.
    explanation: >-
      This directly supports biallelic SLC26A2 variants as the molecular basis of disease.
  - reference: PMID:8571951
    reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that AOII patients also have DTDST mutations, which lead to defective uptake of inorganic sulfate and insufficient sulfation of macromolecules by patient mesenchymal cells in vitro.
    explanation: >-
      This supports DTDST (SLC26A2) mutations as causative in AOII.
  - reference: ORPHA:56304
    reference_title: Atelosteogenesis type II
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLC26A2 | solute carrier family 26 member 2 | hgnc:10994 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet independently asserts disease-causing germline SLC26A2 variants.
  - reference: PMID:21077202
    reference_title: "Genotype-phenotype correlation in DTDST dysplasias: Atelosteogenesis type II and diastrophic dysplasia variant in one family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis suggests that, while the DTDST family of disorders contains at least seven different conditions, mutations in the DTDST gene, in fact, appear to cause a phenotypic continuum. Furthermore, DTDST genotype alone is an imperfect predictor of clinical severity along this continuum.
    explanation: >-
      The family study supports a continuum model and cautions against
      deterministic genotype-only subtype assignment.

definitions:
- name: Orphanet atelosteogenesis type II definition
  definition_type: OTHER
  description: >-
    A rare lethal perinatal bone dysplasia with limb shortening, a normal-sized
    skull with cleft palate, hitchhiker thumbs, distinctive facial and
    radiographic skeletal findings, and a DTDST/SLC26A2 molecular basis.
  evidence:
  - reference: ORPHA:56304
    reference_title: Atelosteogenesis type II
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare, lethal perinatal bone dysplasia characterized by limb shortening, normal sized skull with cleft palate, hitchhiker thumbs, distinctive facial dysmorphism and radiographic skeletal features, caused by mutations in the diastrophic dysplasia sulfate transporter gene.
    explanation: >-
      The structured Orphanet definition fixes the clinical and molecular scope
      of this record.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Atelosteogenesis Type II is inherited in an autosomal recessive pattern with
    biallelic pathogenic variants in SLC26A2.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC26A2-related atelosteogenesis is inherited in an autosomal recessive manner.
    explanation: >-
      This directly supports autosomal recessive inheritance for Atelosteogenesis Type II.
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an SLC26A2 pathogenic variant, each sib of a proband with SLC26A2-related atelosteogenesis has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      This supports the expected Mendelian recurrence risk for an autosomal recessive disorder.
  - reference: ORPHA:56304
    reference_title: Atelosteogenesis type II
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Autosomal recessive
    explanation: >-
      The pinned Orphanet record independently records autosomal-recessive
      inheritance.

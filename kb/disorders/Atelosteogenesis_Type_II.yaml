name: Atelosteogenesis Type II
creation_date: '2026-03-04T07:56:34Z'
category: Mendelian
description: >-
  Atelosteogenesis type II (AOII) is an autosomal-recessive SLC26A2-related
  chondrodysplasia caused by defective sulfate transport and cartilage-matrix
  sulfation. It is characterized by severe limb shortening, hitchhiker thumbs,
  cleft palate, abnormal vertebral and long-bone ossification, and a small
  thorax. Pulmonary hypoplasia and tracheobronchomalacia make the disorder
  usually lethal at birth or shortly thereafter, although longer survival has
  been reported. AOII is distinct from the monoallelic FLNB disorders
  atelosteogenesis types I and III and occupies the severe middle of the
  SLC26A2 spectrum between achondrogenesis type IB and diastrophic dysplasia.

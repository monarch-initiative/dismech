progression:
- phase: Congenital skeletal dysplasia with prenatal detectability
  age_range: Fetal period to birth
  notes: >-
    The malformations are congenital and may be recognized by fetal imaging;
    prenatal detection is not modeled as a separate post-conception disease
    onset.
  evidence:
  - reference: PMID:1279661
    reference_title: "Atelosteogenesis type II: sonographic and radiological correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case diagnosed at 21 weeks of gestation in which antenatal sonographic and post-mortem radiological findings were correlated.
    explanation: >-
      This directly establishes prenatal detectability of the congenital
      skeletal phenotype.
- phase: Usually lethal perinatal respiratory course
  age_range: Birth or shortly thereafter
  notes: >-
    Thoracic restriction, pulmonary hypoplasia, and airway cartilage weakness
    usually cause death at birth or soon afterward.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC26A2-related atelosteogenesis is usually lethal at birth or shortly thereafter due to pulmonary hypoplasia and tracheobronchomalacia.
    explanation: >-
      GeneReviews directly supports the typical perinatal respiratory course.
- phase: Exceptional longer survival
  age_range: Beyond the neonatal period
  notes: >-
    AOII forms a continuum with diastrophic dysplasia, and rare individuals
    survive longer than the usual perinatal course; prognosis therefore should
    be individualized rather than treated as uniformly lethal.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it exists in a continuous phenotypic spectrum with SLC26A2-related diastrophic dysplasia, and long-term survivors have been reported.
    explanation: >-
      This supports an explicitly non-absolute lethality statement.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    AOII is a severe congenital skeletal dysplasia with profound limb and axial
    abnormalities, airway instability, pulmonary hypoplasia, and a high risk of
    death at birth or shortly thereafter. Rare longer survival does not remove
    the intensive respiratory and supportive-care burden.
  evidence:
  - reference: PMID:20301493
    reference_title: "SLC26A2-Related Atelosteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC26A2-related atelosteogenesis is usually lethal at birth or shortly thereafter due to pulmonary hypoplasia and tracheobronchomalacia.
    explanation: >-
      The typical lethality and respiratory mechanism justify a high
      disease-level burden classification.
pathophysiology:
- name: Loss of SLC26A2 Sulfate Transport in Chondrocytes
  description: >-
    Biallelic pathogenic SLC26A2 variants reduce sulfate import into
    chondrocytes. This is the initiating molecular defect shared across the
    SLC26A2 chondrodysplasia spectrum.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: SLC26A2
    term:
      id: hgnc:10994
      label: SLC26A2
  molecular_functions:
  - preferred_term: sulfate transmembrane transporter activity
    term:
      id: GO:0015116
      label: sulfate transmembrane transporter activity
  biological_processes:
  - preferred_term: sulfate transmembrane transport
    term:
      id: GO:1902358
      label: sulfate transmembrane transport
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:11448940
    reference_title: "Mutations in the diastrophic dysplasia sulfate transporter (DTDST) gene: correlation between sulfate transport activity and chondrodysplasia phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The diastrophic dysplasia sulfate transporter (DTDST) gene encodes a transmembrane protein that transports sulfate into chondrocytes to maintain adequate sulfation of proteoglycans.
    explanation: >-
      Functional expression work defines the transporter activity and its
      cartilage substrate context.
  - reference: PMID:8571951
    reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that AOII patients also have DTDST mutations, which lead to defective uptake of inorganic sulfate and insufficient sulfation of macromolecules by patient mesenchymal cells in vitro.
    explanation: >-
      Patient-derived cells directly connect AOII variants with impaired sulfate
      uptake.
  downstream:
  - target: Proteoglycan and Cartilage-Matrix Undersulfation
    causal_link_type: DIRECT
    description: >-
      Reduced cellular sulfate uptake limits sulfation of cartilage
      proteoglycans and other matrix macromolecules.
    evidence:
    - reference: PMID:8571951
      reference_title: "Atelosteogenesis type II is caused by mutations in the diastrophic dysplasia sulfate-transporter gene (DTDST): evidence for a phenotypic series involving three chondrodysplasias."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we report that AOII patients also have DTDST mutations, which lead to defective uptake of inorganic sulfate and insufficient sulfation of macromolecules by patient mesenchymal cells in vitro.
      explanation: >-
        The same patient-cell experiment establishes both source and target of
        this edge.
  - target: Collagen Retention, ATF6-UPR, and FGFR3 Overactivation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Defective collagen secretion and intracellular type II/type IX collagen retention
    - Preferential ATF6 unfolded-protein-response activation
    description: >-
      A Slc26a2-null mouse study identifies a parallel cellular-stress branch;
      this branch is preclinical rather than an established patient biomarker.
    evidence:
    - reference: PMID:30685387
      reference_title: Suppressing UPR-dependent overactivation of FGFR3 signaling ameliorates SLC26A2-deficient chondrodysplasias.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, slc26a2-/- chondrocytes are defective for collagen secretion, exhibiting intracellular retention and compromised extracellular deposition of ColII and ColIX. As a consequence, the ATF6 arm of the unfolded protein response (UPR) is preferentially triggered to overactivate FGFR3 signaling by inducing excessive FGFR3 in slc26a2-/- chondrocytes.
      explanation: >-
        The knockout study specifies the intervening collagen-retention and UPR
        events linking transporter loss to FGFR3 overactivation.

      label: SCN8A
  downstream:
  - target: Increased Nav1.6 Sodium Current
    causal_link_type: DIRECT
    description: >-
      The gain-of-function variant increases Nav1.6 sodium current.
- name: Increased Nav1.6 Sodium Current
  description: >-
    Gain-of-function variants increase the Nav1.6 sodium current, typically
    through an increased persistent (non-inactivating) current and impaired
    channel inactivation. This node captures the single concept of the enhanced
    sodium conductance and conforms to the shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"

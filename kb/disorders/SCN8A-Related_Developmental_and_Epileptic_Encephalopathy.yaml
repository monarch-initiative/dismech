pathophysiology:
- name: SCN8A Gain-of-Function Variant (Nav1.6)
  description: >-
    A de novo gain-of-function variant in SCN8A alters the voltage-gated sodium
    channel Nav1.6. This node captures the single concept of the initiating
    channel lesion.
  role: trigger
  gene:
    preferred_term: SCN8A
    term:
      id: hgnc:10596
      label: SCN8A
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: INCREASED
  downstream:
  - target: Increased Nav1.6 Sodium Current
    causal_link_type: DIRECT
    description: >-
      The gain-of-function variant increases Nav1.6 sodium current.
- name: Increased Nav1.6 Sodium Current
  description: >-
    Gain-of-function variants increase the Nav1.6 sodium current, typically
    through an increased persistent (non-inactivating) current and impaired
    channel inactivation. This node captures the single concept of the enhanced
    sodium conductance and conforms to the shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Sodium ion transmembrane transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:22365152
    reference_title: "De novo pathogenic SCN8A mutation identified by whole-genome sequencing of a family quartet affected by infantile epileptic encephalopathy and SUDEP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a dramatic increase in persistent sodium current, incomplete channel inactivation"
    explanation: >-
      Biophysical analysis of the first SCN8A-DEE mutation showed a large
      increase in persistent sodium current and impaired inactivation
      (gain of function).
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Increased sodium current raises neuronal excitability and repetitive
      firing.
  - target: Movement Disorder (Dystonia)
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Nav1.6 is expressed well beyond the seizure-generating cortex, and the
      dystonia seen in SCN8A-DEE is attributed to the same gain-of-function
      current acting in motor circuits; the specific intervening circuit
      mechanism is not established.
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ataxia accompanies the epilepsy phenotype and is attributed to the same
      channel gain of function outside the seizure network, through
      intermediates that have not been resolved.
  - target: Choreoathetosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Choreoathetosis is part of the same movement-disorder cluster attributed
      to the gain-of-function Nav1.6 current, with unresolved intermediates.
- name: Neuronal Hyperexcitability
  description: >-
    The increased sodium current makes neurons hyperexcitable and prone to
    repetitive, hypersynchronous firing. This node captures the single concept
    of network hyperexcitability and conforms to the shared epilepsy final
    common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Seizures and Developmental Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Neuronal hyperexcitability generates seizures and drives the
      encephalopathy.
  - target: Focal Seizures
    causal_link_type: DIRECT
    description: >-
      Hypersynchronous firing in a cortical region produces the focal-onset
      seizures that typically begin in infancy.
  - target: Epileptic Spasms
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A subset of patients express the same hyperexcitability as epileptic
      spasms, an age-dependent seizure semiology whose circuit basis is not
      resolved.
- name: Seizures and Developmental Encephalopathy
  description: >-
    The clinical result is early-onset, multiple-type, typically drug-resistant
    seizures with developmental impairment, movement disorders, and elevated
    SUDEP risk. This node captures the single concept of the
    seizure/encephalopathy endpoint and conforms to the shared epilepsy final
    common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Epileptic Encephalopathy
    causal_link_type: DIRECT
    description: >-
      The combination of early-onset, multiple-type, drug-resistant seizures
      with developmental impairment is the developmental and epileptic
      encephalopathy itself.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe developmental delay accompanies the pharmacoresistant epilepsy;
      how much is driven by ongoing seizure activity versus the channel lesion
      acting directly on development is unresolved.

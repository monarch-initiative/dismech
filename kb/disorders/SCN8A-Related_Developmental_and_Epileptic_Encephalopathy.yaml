discussions:
- discussion_id: scn8a-early-precision-treatment-window
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Increased Nav1.6 Sodium Current"
  - "pathophysiology#Seizures and Developmental Encephalopathy"
  prompt: >-
    Because SCN8A-DEE is a gain-of-function disorder that preferentially responds
    to (often high-dose) sodium-channel blockers, does earlier genetic diagnosis
    and prompt initiation of the mechanistically matched drug improve seizure
    control and developmental outcome compared with later or empiric treatment?
  rationale: >-
    Sodium-channel blockers are the rational first choice given the mechanism,
    and supratherapeutic dosing is often needed, but whether earlier targeted
    treatment changes the developmental trajectory (versus only seizure counts)
    is not established.
  evidence:
  - reference: PMID:31904124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "better seizure control with sodium channel blockers, usually at supratherapeutic"
    explanation: >-
      Establishes the mechanism-matched drug class, motivating a test of early
      targeted treatment on outcome.
  proposed_experiments:
  - experiment_id: scn8a-early-treatment-outcome
    name: Early targeted-treatment outcome study
    description: >-
      Compare seizure and neurodevelopmental outcomes in SCN8A-DEE by time from
      onset to genetically-guided sodium-channel-blocker initiation, ideally in
      a prospective cohort with standardized dosing.
    readouts:
    - name: Developmental and seizure outcome versus time-to-targeted-treatment
      target: "pathophysiology#Seizures and Developmental Encephalopathy"
    would_support:
    - "pathophysiology#Increased Nav1.6 Sodium Current"
- discussion_id: scn8a-gof-vs-lof-classification
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#SCN8A Gain-of-Function Variant (Nav1.6)"
  prompt: >-
    SCN8A gain-of-function variants cause severe DEE, whereas loss-of-function
    variants cause milder phenotypes (intellectual disability or absence
    epilepsy) - with opposite implications for sodium-channel-blocker use. Can
    the functional direction of a novel SCN8A variant be predicted quickly and
    reliably enough to guide treatment?
  rationale: >-
    As with SCN2A, misclassifying a variant's functional direction can select a
    harmful drug; a rapid, validated gain/loss classification for SCN8A would
    directly inform therapy but is not yet routine.
  proposed_experiments:
  - experiment_id: scn8a-functional-classification
    name: SCN8A functional-direction classifier
    description: >-
      Benchmark high-throughput electrophysiology and computational predictors
      against clinical phenotype and drug response for a large SCN8A variant set
      to build a rapid gain/loss classifier.
    readouts:
    - name: Predicted gain/loss versus phenotype and drug response
      target: "pathophysiology#SCN8A Gain-of-Function Variant (Nav1.6)"
    would_support:
    - "pathophysiology#SCN8A Gain-of-Function Variant (Nav1.6)"
- discussion_id: scn8a-sudep-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Seizures and Developmental Encephalopathy"
  prompt: >-
    SCN8A-DEE carries an elevated risk of sudden unexpected death in epilepsy
    (SUDEP). Is this driven by Nav1.6 gain-of-function activity in brainstem
    autonomic and/or cardiac circuits, and could mechanism-matched treatment or
    monitoring mitigate the risk?
  rationale: >-
    SCN8A was first identified in a family affected by epileptic encephalopathy
    and SUDEP, and Nav1.6 is expressed in autonomic and cardiac tissue, but the
    specific circuit basis of the elevated SUDEP risk and whether it is
    modifiable are open questions.
  proposed_experiments:
  - experiment_id: scn8a-sudep-circuit
    name: SCN8A SUDEP circuit study
    description: >-
      Use SCN8A gain-of-function models with combined cardiorespiratory and
      neural monitoring to test whether brainstem/cardiac Nav1.6 gain of function
      drives fatal autonomic events, and whether sodium-channel blockade reduces
      them.
    readouts:
    - name: Cardiorespiratory events with SCN8A gain of function and blockade
      target: "pathophysiology#Seizures and Developmental Encephalopathy"
    would_support:
    - "pathophysiology#Increased Nav1.6 Sodium Current"

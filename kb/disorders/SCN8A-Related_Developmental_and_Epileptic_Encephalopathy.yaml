  evidence:
  - reference: PMID:22365152
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a dramatic increase in persistent sodium current, incomplete channel inactivation"
    explanation: >-
      Biophysical analysis of the first SCN8A-DEE mutation showed a large
      increase in persistent sodium current and impaired inactivation
      (gain of function).
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Increased sodium current raises neuronal excitability and repetitive

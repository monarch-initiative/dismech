    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the vast majority of SCN8A-DEEs occur de novo"
    explanation: >-
      Most SCN8A-DEE cases arise from de novo variants.
treatments:
- name: High-Dose Sodium-Channel-Blocking Antiseizure Medication
  description: >-
    Because the mechanism is gain-of-function, sodium-channel blockers - often at
    higher-than-usual doses (e.g., phenytoin, oxcarbazepine, lacosamide) - are
    frequently the most effective therapy, directly countering the increased
    Nav1.6 current.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Increased Nav1.6 Sodium Current
    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockers reduce the gain-of-function Nav1.6 current.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
  evidence:
  - reference: PMID:31904124
    reference_title: "Phenotypic and genetic spectrum of SCN8A-related disorders, treatment options, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "better seizure control with sodium channel blockers, usually at supratherapeutic"
    explanation: >-
      Across SCN8A epilepsy subgroups, sodium-channel blockers - often at
      supratherapeutic doses - gave better seizure control, consistent with the
      gain-of-function mechanism.
  - reference: PMID:27559564
    reference_title: "SCN8A-Related Epilepsy and/or Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several studies suggest a favorable response to sodium channel blockers in the SCN8A-related epilepsy phenotypes"
    explanation: >-
      GeneReviews endorses sodium-channel blockers as the targeted therapy
      across SCN8A epilepsy phenotypes.

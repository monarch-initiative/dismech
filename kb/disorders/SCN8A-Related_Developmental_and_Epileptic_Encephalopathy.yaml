- name: Seizures and Developmental Encephalopathy
  description: >-
    The clinical result is early-onset, multiple-type, typically drug-resistant
    seizures with developmental impairment, movement disorders, and elevated
    SUDEP risk. This node captures the single concept of the
    seizure/encephalopathy endpoint and conforms to the shared epilepsy final
    common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"

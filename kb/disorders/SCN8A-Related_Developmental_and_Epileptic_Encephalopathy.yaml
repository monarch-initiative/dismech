name: SCN8A-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-18T00:00:00Z"
category: Genetic
description: >-
  SCN8A-related developmental and epileptic encephalopathy (DEE13) is caused by
  de novo variants in SCN8A, which encodes the voltage-gated sodium channel
  Nav1.6. Most disease-causing variants are gain-of-function, increasing Nav1.6
  sodium current (through enhanced persistent current and impaired
  inactivation) and driving neuronal hyperexcitability. Seizures usually begin
  in infancy (often around four months), are of multiple types and typically
  drug-resistant, and are accompanied by developmental impairment, movement
  disorders, and an elevated risk of sudden unexpected death in epilepsy
  (SUDEP). Because the mechanism is gain-of-function, high-dose drugs that block
  sodium channels are often the most effective therapy. Rarer loss-of-function
  SCN8A variants instead produce milder phenotypes (intellectual disability or
  absence epilepsy) and are not the focus of this developmental and epileptic
  encephalopathy entry.

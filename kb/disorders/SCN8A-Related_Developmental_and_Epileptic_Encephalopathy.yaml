genetic:
- name: SCN8A
  gene_term:
    preferred_term: SCN8A
    term:
      id: hgnc:10596
      label: SCN8A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SCN8A encodes the voltage-gated sodium channel Nav1.6. DEE-causing variants
    are usually de novo gain-of-function missense changes; rarer
    loss-of-function variants instead cause milder phenotypes (intellectual
    disability or absence epilepsy).

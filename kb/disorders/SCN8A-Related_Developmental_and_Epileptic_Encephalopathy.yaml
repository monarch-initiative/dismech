- name: Neuronal Hyperexcitability
  description: >-
    The increased sodium current makes neurons hyperexcitable and prone to
    repetitive, hypersynchronous firing. This node captures the single concept
    of network hyperexcitability and conforms to the shared epilepsy final
    common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Seizures and Developmental Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Neuronal hyperexcitability generates seizures and drives the

- name: Distal nephron ENaC sodium reabsorption failure
  description: >-
    In principal cells of the aldosterone-sensitive distal nephron and
    collecting duct, ENaC provides the rate-limiting apical step of sodium
    reabsorption. Without it aldosterone cannot drive sodium reabsorption,
    producing end-organ mineralocorticoid resistance and urinary salt wasting.
    Adult nephron-specific alphaENaC deletion in mice reproduces the syndrome,
    which no other transporter compensates except under a high-sodium,
    low-potassium diet.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  locations:
  - preferred_term: collecting duct
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  biological_processes:
  - preferred_term: renal sodium ion absorption
    modifier: DECREASED
    term:
      id: GO:0070294
      label: renal sodium ion absorption
  evidence:
  - reference: PMID:26701978
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated adult inducible nephron-specific αENaC-knockout mice (Scnn1a(Pax8/LC1)) that exhibit hyperkalemia and body weight loss when kept on a regular-salt diet, thus mimicking PHA-1."
    explanation: Renal alphaENaC deletion alone reproduces the salt-losing, hyperkalemic syndrome.
  - reference: PMID:26701978
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, lack of ENaC-mediated sodium transport along the nephron cannot be compensated for by other sodium channels and/or transporters, only by a high-sodium and reduced-potassium diet."
    explanation: Other nephron transporters do not compensate for absent alphaENaC.
  downstream:
  - target: Renal salt wasting
    causal_link_type: DIRECT
  - target: Extracellular volume depletion
    causal_link_type: DIRECT
  - target: Impaired distal potassium and hydrogen ion secretion
    causal_link_type: DIRECT
- name: Impaired distal potassium and hydrogen ion secretion
  description: >-
    Loss of electrogenic sodium entry through ENaC removes the lumen-negative
    driving force for potassium and hydrogen ion secretion in the distal
    nephron, so potassium and acid are retained.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: kidney collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  biological_processes:
  - preferred_term: renal potassium excretion
    modifier: DECREASED
    term:
      id: GO:0036359
      label: renal potassium excretion
  evidence:

- name: Airway epithelial sodium absorption failure
  description: >-
    Airway ENaC absorbs sodium and liquid from the airway surface. Patients
    with systemic PHA1 have no airway sodium absorption, more than twice the
    normal airway surface liquid volume, and recurrent chest congestion,
    cough and wheeze in early childhood. In alphaENaC-null mice airway sodium
    transport is abolished and neonates die from retained lung liquid, but a
    preterm SCNN1A-homozygous infant breathed normally after birth (see
    discussions).

  notes: >-
    Reported alleles are mostly truncating: frameshifts (c.203_204delTC,
    recurrent in Gulf families; c.587_588insC), nonsense, splice-site variants
    and whole-gene deletions. Missense alleles (p.Ser243Pro, p.Phe226Cys,
    p.Gly327Cys, p.Ser562Pro) reduce rather than abolish channel activity, and
    the first three gave mild or transient disease.
  evidence:

name: Pseudohypoaldosteronism Type IB1 Autosomal Recessive
category: Mendelian
creation_date: "2026-11-01T07:35:18Z"
synonyms:
- PHA1B1
- SCNN1A-related systemic pseudohypoaldosteronism type 1
- Autosomal recessive pseudohypoaldosteronism type 1B1
description: >-
  Pseudohypoaldosteronism type IB1 (PHA1B1) is the SCNN1A-related form of
  autosomal recessive, systemic (multi-organ) pseudohypoaldosteronism type 1,
  and the most frequently genotyped of the three ENaC subunit forms. Biallelic
  loss-of-function variants in SCNN1A, which encodes the alpha subunit of the
  amiloride-sensitive epithelial sodium channel (ENaC), remove the subunit the
  channel cannot function without. Failure of ENaC-mediated sodium reabsorption
  in the aldosterone-sensitive distal nephron causes renal salt wasting, volume
  depletion and failure of potassium and hydrogen ion secretion, so affected
  infants present in the first weeks of life with vomiting, poor feeding,
  dehydration, hyperkalemia and metabolic acidosis despite high renin and
  aldosterone. ENaC loss in the colon and sweat glands adds extra-renal salt
  loss, and loss in the airway leaves excess airway surface liquid with
  recurrent chest symptoms. Truncating alleles cause a lifelong course;
  missense alleles that leave partial channel activity can cause a mild or
  transient one. Treatment is lifelong sodium chloride with potassium control.
  The SCNN1B (PHA1B2) and SCNN1G (PHA1B3) forms share the mechanism and are
  separate MONDO concepts.
disease_term:
  preferred_term: pseudohypoaldosteronism, type IB1, autosomal recessive
  term:
    id: MONDO:0009917
    label: pseudohypoaldosteronism, type IB1, autosomal recessive
parents:
- Pseudohypoaldosteronism type 1
- Autosomal recessive disease
notes: >-
  The Orphanet record cited here (ORPHA:171876, generalized
  pseudohypoaldosteronism type 1) covers all three ENaC subunit genes, so its
  phenotype frequencies describe systemic PHA1 as a whole rather than the
  SCNN1A form alone. The airway surface liquid study cited for the respiratory
  phenotype (PMID:10403853) reports ENaC subunit mutations without restricting
  itself to SCNN1A. No GeneReviews chapter covers this disorder or systemic
  PHA1, so case reports, case series, a systematic review of pulmonary cases
  and Orphanet form the phenotype baseline.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) SCNN1A variants. Most
    reported families are consanguineous and parents are usually
    asymptomatic, although carriers of the p.Ser562Pro allele had raised sweat
    sodium and chloride with no clinical or hormonal abnormality.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23416952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All parents were asymptomatic heterozygous carriers of the respective mutations, confirming the autosomal recessive mode of inheritance."
    explanation: Asymptomatic heterozygous parents of seven SCNN1A-homozygous children confirm recessive inheritance.
  - reference: PMID:18547339
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In heterozygote carriers, sweat sodium and chloride concentrations were increased without additional hormonal or clinical phenotypes."
    explanation: Carriers of one SCNN1A S562P allele show only a subclinical sweat electrolyte change.
prevalence:
- population: United Kingdom
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  notes: >-
    Orphanet birth-prevalence class 1-9 / 1,000,000 for generalized PHA1 across
    all ENaC subunit genes. No SCNN1A-specific figure is available.
  evidence:
  - reference: ORPHA:171876
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1-9 / 1 000 000 | United Kingdom | Prevalence at birth | PMID:24616761"
    explanation: Orphanet epidemiology row for generalized PHA1.
- population: Published PHA1B cases with respiratory symptoms and an identified variant
  measure_type: CASES_IN_LITERATURE
  notes: >-
    In a systematic review of PHA1B cases with respiratory symptoms, 36 of 47
    patients with an identified variant carried it in SCNN1A. This is the share
    of SCNN1A among genotyped cases, not a population rate.
  evidence:
  - reference: PMID:39419738
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In 36/47 patients the underlying pathogenic variant was identified in SCNN1A gene."
    explanation: SCNN1A is the predominant gene among genotyped PHA1B cases in a systematic review.
  - reference: PMID:15853823
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the PHA-causing mutations appear in the alphaENaC gene located on chromosome 12 rather than in the beta and gammaENaC genes located tandemly on chromosome 16."
    explanation: Alpha subunit variants account for most multisystem PHA cases.
  - reference: PMID:34258491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a total of 8 mutations in 13 families as follows: 6 mutations in SCNN1A, 1 in SCNN1B, and 1 in SCNN1G."
    explanation: In a Gulf PHA1B series most mutations were in SCNN1A.
progression:
- phase: Neonatal salt-wasting presentation
  age_range: First weeks of life
  notes: >-
    Presentation is typically within the first two weeks of life with vomiting,
    poor feeding, weight loss and dehydration, accompanied by hyponatremia,
    hyperkalemia and metabolic acidosis.
  evidence:
  - reference: ORPHA:171876
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Presentation is in the first few weeks of life with severe dehydration, vomiting and failure to thrive in association with hyponatremia, hyperkalemia and metabolic acidosis as well as elevated aldosterone and renin levels."
    explanation: Orphanet describes neonatal onset of the salt-wasting presentation.
  - reference: PMID:33690157
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children were presented within the first 2 weeks of life with life-threatening, severe hyperkalaemia and hyponatraemia."
    explanation: In a series of SCNN1A and SCNN1G patients, all presented within two weeks of birth.
  - reference: PMID:31018202
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ages at presentation were postnatal days 9, 10, and 5."
    explanation: Presentation in the first ten days of life in a series including two SCNN1A patients.
- phase: Chronic course with recurrent salt-losing crises
  age_range: Infancy to adulthood
  notes: >-
    With truncating alleles the systemic form does not remit and salt-losing
    crises recur. Mortality and post-arrest neurological injury are substantial
    in case series, but survival into adulthood with a successful pregnancy has
    been reported.
  evidence:
  - reference: ORPHA:171876
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No remission is reported and patients suffer from recurrent life-threatening episodes of salt loss."
    explanation: Orphanet describes a non-remitting course with recurrent crises.
  - reference: PMID:33690157
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three children died (25%) and two (16%) had severe neurological impairment post-cardiac arrest secondary to hyperkalaemia."
    explanation: High mortality and post-arrest morbidity in a series of SCNN1A and SCNN1G patients.
  - reference: PMID:33690157
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One affected female had a successful pregnancy at the age of 28 years."
    explanation: Survival to adulthood with a successful pregnancy is possible.
- phase: Mild or transient course with partial-function missense alleles
  age_range: Neonatal period to early childhood
  notes: >-
    Some SCNN1A missense alleles leave partial channel activity and give a mild
    or transient course, with variable expressivity and incomplete penetrance
    within families.
  evidence:
  - reference: PMID:21653223
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient improved rapidly under treatment, and dietary salt supplementation could be stopped after 6 mo."
    explanation: A homozygous SCNN1A missense allele produced a transient neonatal course in a preterm infant.
  - reference: PMID:37134141
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present 12 patients from four different families with a mild and transient autosomal recessive PHA1 due to a novel homozygous missense mutation in the SCNN1A gene."
    explanation: A homozygous SCNN1A missense allele causes mild, transient disease across four families.

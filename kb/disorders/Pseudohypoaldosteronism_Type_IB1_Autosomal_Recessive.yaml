    snippet: "Systemic pseudohypoaldosteronism type 1 (PHA-1) is a severe salt-losing syndrome caused by loss-of-function mutations of the amiloride-sensitive epithelial sodium channel (ENaC) and characterized by neonatal life-threatening hypovolemia and hyperkalemia."
    explanation: Background statement from a mouse study describing the human hypovolemic salt-losing syndrome.

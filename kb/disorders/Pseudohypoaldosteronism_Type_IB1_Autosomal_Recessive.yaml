    snippet: "SCNN1A | sodium channel epithelial 1 subunit alpha | hgnc:10599 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet lists germline loss-of-function SCNN1A variants as disease-causing.
  - reference: PMID:23416952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amplification of the SCNN1A gene and sequencing of all 13 coding exons unraveled mutations in all of our patients."
    explanation: SCNN1A mutations were found in all seven children with systemic PHA1 studied.
  - reference: PMID:34258491
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "c.203_204 delTC, p.I68Tfs*76 (a known mutation) in 8 patients of 5 families; and whole SCNN1A gene deletion (novel) in 2 patients of 2 families."
    explanation: A recurrent SCNN1A frameshift and whole-gene deletions in Gulf PHA1B families.
  - reference: PMID:18547339
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, the novel mutation S562P is causing systemic PHA1 in the homozygous state."
    explanation: A homozygous SCNN1A missense variant causes systemic PHA1.
pathophysiology:
- name: Biallelic SCNN1A loss of function
  description: >-
    Biallelic SCNN1A variants remove or impair the ENaC alpha subunit. In
    heterologous expression the beta and gamma subunits cannot produce an
    amiloride-sensitive current without alpha, which may explain why SCNN1A is
    the gene most often affected. Missense alleles such as p.Phe226Cys reduce
    channel activity and expression only partly, matching their milder course.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SCNN1A
    term:
      id: hgnc:10599
      label: SCNN1A
  molecular_functions:
  - preferred_term: epithelial sodium channel activity
    modifier: DECREASED
    term:
      id: GO:0005272
      label: sodium channel activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:8589714
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations are homozygous in affected subjects, co-segregate with the disease, and introduce frameshift, premature termination or missense mutations that result in loss of channel activity."
    explanation: Recessive PHA1 alleles in the alpha and beta subunits abolish channel activity.
  - reference: PMID:23416952
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The α subunit is essential for ENaC function and mutations truncating the pore-forming part of the protein leading to systemic PHA1."
    explanation: Truncation of the pore-forming alpha subunit causes systemic PHA1.
  - reference: PMID:37134141
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In functional studies in X. laevis oocytes, p.Phe226Cys caused a significant reduction of ENaC activity (83% reduction), reduced the number of active ENαC mutant channels, and reduced the basal open probability compared with wt."
    explanation: A mild-phenotype SCNN1A missense allele leaves partial channel activity in oocytes.

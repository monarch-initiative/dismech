    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of affected offspring of consanguineous union reveals mutations in either the alpha or beta subunits of the amiloride-sensitive epithelial sodium channel in five kindreds."
    explanation: First identification of alpha subunit (SCNN1A) mutations in recessive PHA1.
  - reference: PMID:8824886
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease locus mapped to chromosome 16p12.2-13.11 in six families and to 12p13.1-pter in the other five families."
    explanation: Homozygosity mapping placed one PHA1 locus at 12p13, where SCNN1A lies.
  - reference: ORPHA:171876
    supports: SUPPORT

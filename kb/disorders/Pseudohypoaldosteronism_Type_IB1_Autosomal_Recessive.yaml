    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pseudohypoaldosteronism (PHA) is a rare heterogeneous syndrome of mineralocorticoid resistance causing insufficient potassium and hydrogen secretion."
    explanation: Mineralocorticoid resistance in PHA causes insufficient potassium and hydrogen secretion.
  downstream:
  - target: Hyperkalemia
    causal_link_type: DIRECT
  - target: Metabolic acidosis
    causal_link_type: DIRECT
- name: Extracellular volume depletion
  description: >-
    Renal, colonic and sweat sodium loss depletes the extracellular fluid
    compartment, causing hyponatremic dehydration, hypovolemia and, in severe
    crises, hypotension and shock.
  biological_scale: ORGANISM
  biological_processes:

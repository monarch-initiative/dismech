      caused by PLCE1 gene mutations.
    explanation: An independent literature count of similar size.
mechanistic_hypotheses:
- hypothesis_group_id: plce1_podocyte_developmental_arrest
  hypothesis_label: PLCE1 Loss / Podocyte Developmental Arrest Model
  status: CANONICAL
  description: >-
    Loss of PLCepsilon1 in podocytes disrupts signalling that podocytes need to
    mature, glomerular development arrests, and the immature glomeruli present
    as diffuse mesangial sclerosis with a leaky filtration barrier. Which
    signalling branch carries the developmental effect is not established (see
    discussion plce1_signalling_branch_responsible).
  evidence:
  - reference: PMID:17086182
    reference_title: Positional cloning uncovers mutations in PLCE1 responsible for a nephrotic syndrome variant that may be reversible.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found PLCepsilon1 expression in developing and mature glomerular
      podocytes and showed that DMS represents an arrest of normal glomerular
      development
    explanation: The founding study's reading of the lesion as developmental arrest.
  - reference: PMID:18270750
    reference_title: "NPHS3: new clues for understanding idiopathic nephrotic syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NPHS3 is caused by a developmental rather than structural podocyte
      dysfunction and is a major cause of diffuse mesangial sclerosis.
    explanation: A review restating the developmental model.
- hypothesis_group_id: plce1_hemodynamic_second_hit
  hypothesis_label: PLCE1 Deficiency as Susceptibility to a Hemodynamic Second Hit
  status: EMERGING
  description: >-
    PLCE1 deficiency may not suffice on its own; a second stressor such as
    hypertension or hyperfiltration may be needed for podocyte loss and
    sclerosis. Supported in mice, where Plce1-deficient glomeruli are normal at
    baseline but sclerose after induced hypertension. Untested in patients.
  evidence:
  - reference: PMID:32223311
    reference_title: Hypertension induces glomerulosclerosis in phospholipase C-ε1 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data demonstrate that Plce1 deficiency in mice predisposes to
      glomerular damage secondary to hypertensive insults.
    explanation: The mouse study proposing the second-hit model.
pathophysiology:
- name: Biallelic PLCE1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous PLCE1 variants, mostly truncating
    (nonsense, frameshift, splice) with a minority of missense changes, remove
    functional PLCepsilon1 from podocytes. ClinGen records loss of function as
    the mechanism.

- name: Loss of PLCepsilon1 Phosphoinositide Hydrolysis
  biological_scale: MOLECULAR
  description: >-
    PLCepsilon1 hydrolyses PIP2 to diacylglycerol and IP3. In podocytes this
    activity is recruited to ARP3-rich lamellipodia by advillin after EGF
    stimulation; without that recruitment EGF-induced DAG generation fails.
    Direct measurement of DAG in PLCE1-null podocytes is not reported in the
    cited abstracts, so the decrease is inferred from the advillin work.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte

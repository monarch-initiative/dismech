discussions:
- discussion_id: plce1_incomplete_penetrance
  prompt: >-
    Why do some individuals homozygous for a familial PLCE1 truncating variant
    stay healthy, and what second factor converts PLCE1 deficiency into
    disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#PLCE1
  - pathophysiology#Biallelic PLCE1 Loss of Function
  - pathophysiology#Hypertensive Glomerular Stress
  - mechanistic_hypotheses#plce1_hemodynamic_second_hit
  rationale: >-
    Nonpenetrance is documented in at least four families: an asymptomatic
    homozygous father in a Pakistani kindred carrying a frameshift in exon 3,
    and three unaffected unrelated homozygotes in a French-led worldwide
    cohort. This is unusual for a recessive podocytopathy and has two
    consequences. Mechanistically, it means PLCE1 loss is necessary but not
    sufficient, so the canonical developmental-arrest model is incomplete.
    Clinically, a negative family history or a healthy homozygous sibling cannot
    be used to dismiss a variant, and recurrence counselling has to allow for
    reduced penetrance. Candidate modifiers have been screened without result
    (16 other PLC genes, BRAF, IQGAP1 and NPHS1 in the 2010 cohort). The mouse
    data offer one concrete candidate, a hemodynamic second hit, but no human
    study has compared blood pressure, nephron endowment or birth weight between
    affected and unaffected homozygotes.
  proposed_experiments:
  - experiment_id: exp_plce1_nonpenetrant_homozygote_comparison
    name: Affected versus unaffected PLCE1 homozygote comparison
    description: >-
      Assemble the published and registry families with discordant
      homozygotes. Compare genome sequences for second-site variants in SRNS
      and podocyte genes, and compare blood pressure history, birth weight and
      kidney size as proxies for the hemodynamic second hit. A clear modifier
      would support a two-locus model; a blood-pressure difference would
      support the mouse-derived model.
    would_support:
    - mechanistic_hypotheses#plce1_hemodynamic_second_hit
  evidence:
  - reference: PMID:19037252
    reference_title: Mutations in phospholipase C epsilon 1 are not sufficient to cause diffuse mesangial sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude this nonpenetrance may be due to compensatory mutations at a
      second locus and that mutation within PLCE1 is not always sufficient to
      cause diffuse mesangial sclerosis.
    explanation: The first nonpenetrant homozygote and the two-locus proposal.
  - reference: PMID:20591883
    reference_title: Mutational analysis of the PLCE1 gene in steroid resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, three unaffected and unrelated individuals were also found to
      carry the homozygous mutations identified in their respective families.
    explanation: Replication in three further families.
  - reference: PMID:20591883
    reference_title: Mutational analysis of the PLCE1 gene in steroid resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although additional variants in 19 candidate genes (16 other PLC genes,
      BRAF,IQGAP1 and NPHS1) were not identified
    explanation: The candidate-modifier screen was negative.
  - reference: PMID:32223311
    reference_title: Hypertension induces glomerulosclerosis in phospholipase C-ε1 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      other family members with the same mutation were asymptomatic, suggesting
      additional stressor are required to cause the full phenotype
    explanation: The mouse study is framed around this human observation.
- discussion_id: plce1_mouse_baseline_mismatch
  prompt: >-
    Why do global Plce1-deficient mice have normal glomeruli at baseline when
    biallelic loss in humans causes infantile nephrotic syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Arrested Glomerular Development
  rationale: >-
    The mouse model exists and reproduces the human lesion only under an
    experimental second hit, so its fidelity to the spontaneous human disease
    is the open question rather than the absence of a model. Three readings fit
    the data. Mice may have more redundancy in podocyte phosphoinositide or
    Rho-GTPase signalling. Human glomerulogenesis may depend more on PLCepsilon1
    during a developmental window the mouse passes through differently. Or the
    mouse resembles the nonpenetrant human homozygotes, in which case the
    mismatch and the penetrance gap are one problem. The zebrafish morphant does
    show edema, but morpholino phenotypes in this field often fail to reproduce
    in stable mutants. ClinGen counts the mouse data as supportive experimental
    evidence despite the normal baseline.
  proposed_experiments:
  - experiment_id: exp_plce1_human_kidney_organoid
    name: PLCE1-null human kidney organoids
    description: >-
      Generate isogenic PLCE1-null and patient-allele iPSC lines, differentiate
      to kidney organoids, and score podocyte maturation markers, foot-process
      formation and glomerular size against isogenic controls. A defect in
      human organoids with no defect in mouse would localise the mismatch to
      species biology rather than to a missing in vivo stressor.
  evidence:
  - reference: PMID:32223311
    reference_title: Hypertension induces glomerulosclerosis in phospholipase C-ε1 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      global Plce1-deficient mice have histologically normal glomeruli and no
      albuminuria at baseline
    explanation: The baseline negative result.
  - reference: CGGV:assertion_cf5e85df-45a3-48dc-8b8d-27228d620412-2022-04-10T143000.000Z
    reference_title: "PLCE1 / nephrotic syndrome, type 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Interestingly, PLCE1 knockout mice exhibited normal kidney structure and
      function
    explanation: ClinGen's reading of the same data.
- discussion_id: plce1_immunosuppression_response
  prompt: >-
    Is PLCE1-related nephrotic syndrome genuinely more responsive to
    glucocorticoids or calcineurin inhibitors than other monogenic SRNS, and
    should a trial of therapy be offered?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Calcineurin Inhibitor Trial
  - treatments#Glucocorticoids
  - phenotypes#Steroid-Resistant Nephrotic Syndrome
  rationale: >-
    The founding report described two treated patients who remitted, and the
    disease was presented as the first molecular cause of nephrotic syndrome
    that may resolve after therapy; a ciclosporin responder was reported soon
    after. These are a few cases, reported by the discovering group, without a
    denominator of treated non-responders. Other series point the other way: a
    genetically confirmed PLCE1 infant in a 20-year UK series did not remit,
    and current guidance advises avoiding ineffective steroids and generally
    withholding calcineurin inhibitors once genetic SRNS is confirmed, while
    leaving the decision to the individual case. Calcineurin inhibitors also
    have an antiproteinuric effect on podocytes independent of immunity, which
    could explain a response without implying immune pathogenesis. The
    question decides whether a PLCE1 result should end or start an
    immunosuppression trial, and no study has been powered to answer it.
  proposed_experiments:
  - experiment_id: exp_plce1_treatment_registry
    name: Registry analysis of immunosuppression response in PLCE1 SRNS
    description: >-
      Query international SRNS registries for every genetically confirmed
      PLCE1 patient exposed to steroids or calcineurin inhibitors, record
      complete, partial or no remission against matched NPHS2 and WT1 patients,
      and test whether the remission rate differs. Stratify by variant class and
      histology.
  evidence:
  - reference: PMID:17086182
    reference_title: Positional cloning uncovers mutations in PLCE1 responsible for a nephrotic syndrome variant that may be reversible.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, two other affected individuals responded to therapy, making this
      the first report of a molecular cause of nephrotic syndrome that may
      resolve after therapy.
    explanation: The founding claim of treatment response.
  - reference: PMID:24902943
    reference_title: Clinico-pathological correlations of congenital and infantile nephrotic syndrome over twenty years.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nine of whom had an identifiable genetic basis (seven NPHS1, one PLCE1 and
      one ITGA3) with none of these nine children achieving remission
    explanation: A PLCE1 infant who did not remit.
  - reference: PMID:18270750
    reference_title: "NPHS3: new clues for understanding idiopathic nephrotic syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therapy response in NPHS3 is documented and could open insights into
      direct genomic and nongenomic effects of glucocorticoids on podocytes.
    explanation: Proposes a podocyte-direct rather than immune mechanism for response.
- discussion_id: plce1_dms_fsgs_spectrum
  prompt: >-
    What determines whether a PLCE1 patient shows diffuse mesangial sclerosis or
    focal segmental glomerulosclerosis, given that variant class does not
    predict it and the reported DMS:FSGS ratio has shifted across cohorts?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - phenotypes#Diffuse Mesangial Sclerosis
  - phenotypes#Focal Segmental Glomerulosclerosis
  rationale: >-
    Early reports tied PLCE1 almost entirely to diffuse mesangial sclerosis,
    with FSGS as a rarer, later-onset variant seen in one missense family. The
    discovering cohort found PLCE1 in a third of DMS cases but only 8% of
    NPHS2-negative FSGS, and no genotype correlation: truncating and missense
    alleles gave either histology and similar outcomes. A 2025 literature
    review of biopsied patients instead found FSGS in 16 of 28, which is the
    opposite skew. Several things could reconcile this: the two lesions may be a
    time course, DMS in the youngest kidneys and FSGS where disease declares
    later; biopsy timing and the shift from DMS-ascertained to SRNS-ascertained
    cohorts may select different lesions; or a modifier may set the histology as
    it seems to set penetrance. Because histology does not change management, the
    question is mechanistic rather than clinical, but it bears on whether DMS is
    specifically the developmental-arrest lesion the canonical model names.
  evidence:
  - reference: PMID:20591883
    reference_title: Mutational analysis of the PLCE1 gene in steroid resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No clear genotype-phenotype correlation was observed, with either
      truncating or missense mutations detected in both DMS and FSGS, and
      leading to a similar renal evolution.
    explanation: Variant class does not set histology.
  - reference: PMID:40462432
    reference_title: "[PLCE1 mutation-induced end-stage renal disease presenting with massive proteinuria: a family analysis and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: renal pathology predominantly showed focal segmental glomerulosclerosis (57%, 16/28)
    explanation: The later review's FSGS-predominant skew, opposite to early reports.
  - reference: PMID:18065803
    reference_title: Mutations in PLCE1 are a major cause of isolated diffuse mesangial sclerosis (IDMS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PLCE1 mutation is the most common cause of IDMS in this cohort.
    explanation: The early DMS-centred view.
notes: >-
  The GeneReviews chapter for this disease, Genetic Steroid-Resistant Nephrotic
  Syndrome Overview (PMID:34436835), is Overview-format: its cached PubMed
  abstract is a statement of purpose with no clinical characteristics, so it is
  not usable as a phenotype baseline. Management claims are quoted from its full
  text (NBK573219). The phenotype and mechanism baselines come from the founding
  positional-cloning study (PMID:17086182), the IDMS and SRNS cohorts, the
  podocyte functional studies, and a 2025 literature review. Common PLCE1
  polymorphisms are GWAS risk loci for oesophageal and gastric cancer; that is a
  separate phenotype and is deliberately not modelled here.

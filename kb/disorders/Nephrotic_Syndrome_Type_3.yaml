  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence is published. ClinGen's 2022 curation scored at
    least 46 variants in 56 probands from six publications, and a 2025
    literature review assembled 45 patients. Reported families come mostly from
    consanguineous populations.

animal_models:
- name: Global Plce1-deficient mouse
  species: Mouse
  genotype: Plce1 global deficiency
  publication: PMID:32223311
  description: >-
    Normal glomeruli and no albuminuria at baseline; induced hypertension
    (angiotensin II, DOCA-salt with uninephrectomy, or norepinephrine) produces
    albuminuria, mesangial expansion, podocyte loss and sclerosis beyond
    wild-type littermates.
  modeled_mechanisms:
  - target: Arrested Glomerular Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: No spontaneous infantile disease at baseline.
    limitations: >-
      Global deficiency without a stressor gives normal glomeruli, so the model
      does not reproduce the human developmental lesion; species differences in
      podocyte signalling redundancy are a likely factor but untested.
    evidence:
    - reference: PMID:32223311
      reference_title: Hypertension induces glomerulosclerosis in phospholipase C-ε1 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        global Plce1-deficient mice have histologically normal glomeruli and no
        albuminuria at baseline
      explanation: The negative baseline result.
  - target: Progressive Glomerulosclerosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Sclerosis appears only after a hypertensive second hit.
    limitations: The second hit is experimental; the human disease does not require induced hypertension.
    evidence:
    - reference: PMID:32223311
      reference_title: Hypertension induces glomerulosclerosis in phospholipase C-ε1 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This caused a fivefold increase in albuminuria in Plce1-deficient mice
        and a significant increase in the number of sclerotic glomeruli.
      explanation: A non-angiotensin-II hypertension model (DOCA-salt or norepinephrine) also induced sclerosis, showing the driver is hemodynamic rather than ANG II itself.

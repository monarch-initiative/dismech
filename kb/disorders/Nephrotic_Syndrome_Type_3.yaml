    Ciclosporin has induced remission in isolated PLCE1 patients, and the
    founding report described therapy-responsive cases; the IDMS study
    suggested PLCE1 status could select patients for a trial. GeneReviews
    notes that withholding calcineurin inhibitors in genetic SRNS is
    recommended but should be decided individually. Evidence is a handful of
    cases.

name: Nephrotic Syndrome Type 3
creation_date: "2026-11-09T01:30:00Z"
category: Mendelian
description: >-
  Autosomal recessive podocytopathy caused by biallelic loss-of-function
  variants in PLCE1, which encodes phospholipase C epsilon 1 (PLCepsilon1), a
  phosphoinositide-specific phospholipase expressed in developing and mature
  glomerular podocytes. Nephrotic syndrome usually begins in infancy or early
  childhood, is usually steroid resistant, and progresses to kidney failure.
  Diffuse mesangial sclerosis, read as an arrest of normal glomerular
  development, is the characteristic lesion; focal segmental
  glomerulosclerosis is seen in a share of cases. Unlike most monogenic
  steroid-resistant nephrotic syndromes, a few patients have remitted on
  glucocorticoids or ciclosporin, and asymptomatic relatives homozygous for the
  familial variant are documented. ClinGen rates PLCE1 Definitive.

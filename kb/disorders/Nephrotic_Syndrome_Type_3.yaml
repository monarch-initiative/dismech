    reference_title: "PLCE1 / nephrotic syndrome, type 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At least 46 variants (frameshift, nonsense, splice, missense) have been
      reported in 56 probands in 6 publications
    explanation: ClinGen's case count is the best available size of the published patient set.
  - reference: PMID:40462432
    reference_title: "[PLCE1 mutation-induced end-stage renal disease presenting with massive proteinuria: a family analysis and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

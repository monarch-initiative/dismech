    reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      prevented recruitment of PLCE1 to the ARP3-rich lamellipodia, blocked
      EGF-induced generation of diacylglycerol (DAG) by PLCE1
    explanation: >-
      Shows that EGF-induced DAG in podocytes is PLCE1-dependent; the
      perturbation is advillin knockdown, hence INDIRECT for PLCE1 loss itself.
  downstream:

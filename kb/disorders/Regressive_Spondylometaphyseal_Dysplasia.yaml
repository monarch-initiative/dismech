      explanation: Homozygous p.Arg512Trp in both affected individuals.
  - name: p.Leu456Val
    description: Homozygous c.1366C>G (p.Leu456Val); causes the skeletal dysplasia without Pelger-Huet anomaly, uncoupling the two branches.
    evidence:
    - reference: PMID:32827848
      reference_title: "A homozygous variant in the Lamin B receptor gene LBR results in a non-lethal skeletal dysplasia without Pelger-Huët anomaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous LBR missense mutation (NM_002296.4: c.1366C > G, p.(Leu456Val)) in two adult sisters with a Lamin B receptor-related disorder associated with a skeletal dysplasia milder than Greenberg Dysplasia."
      explanation: Homozygous p.Leu456Val causes non-lethal skeletal dysplasia without Pelger-Huet anomaly.
  notes: >-
    Autosomal recessive; biallelic hypomorphic missense alleles, or one hypomorphic
    and one null allele, give the regressive SMD phenotype, whereas two null or
    catalytically dead reductase-domain alleles cause lethal Greenberg dysplasia and
    a single loss-of-function allele gives isolated Pelger-Huet anomaly.

animal_models:
- name: Lbr ichthyosis (ic) null mouse
  species: Mouse
  genotype: Lbr ichthyosis (ic/ic), spontaneous null allele
  publication: PMID:12490533
  description: >-
    Spontaneous Lbr-null (ichthyosis) mice reproduce the Pelger-Huet-like
    hyposegmented neutrophils, confirming LBR as the molecular basis of the human
    anomaly, but their other features (alopecia, syndactyly, hydrocephalus) differ
    from the human regressive skeletal dysplasia, so the mouse models the
    neutrophil branch rather than the skeletal one.
  modeled_mechanisms:
  - target: Failed Neutrophil Nuclear Lobulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The ichthyosis mouse reproduces the Pelger-Huet-like neutrophil nuclear phenotype.
    limitations: >-
      The mouse is a complete null modelling the structural (neutrophil) branch; it
      does not reproduce the human regressive skeletal dysplasia and instead shows
      alopecia, syndactyly and hydrocephalus.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The Lbr-null mouse does not develop the regressive spondylometaphyseal
        dysplasia; its extra-haematological features (alopecia, syndactyly,
        hydrocephalus) are not part of the human disease, so the model captures the
        neutrophil phenotype only.
    evidence:
    - reference: PMID:12490533
      reference_title: "Mutations at the mouse ichthyosis locus are within the lamin B receptor gene: a single gene model for human Pelger-Huët anomaly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "present with a blood phenotype similar to PHA"
      explanation: The Lbr-null mouse reproduces the Pelger-Huet-like neutrophil phenotype.
treatments:
- name: Orthopedic Management
  description: >-
    Supportive orthopedic care for short stature and limb bowing, including
    growth monitoring and, for persistent bowing, guided growth or osteotomy.
    No disease-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
- name: Physical Therapy
  description: Physiotherapy to support mobility and joint function.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Genetic Counseling
  description: >-
    Recurrence risk is 25% per pregnancy for carrier couples (50% in pseudodominant
    families); examination of parental blood smears for Pelger-Huet anomaly can aid
    counseling and prenatal work-up.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Exome or genome sequencing (or a skeletal-dysplasia gene panel including LBR)
    identifies the biallelic LBR variants; copy-number analysis is worthwhile
    because a whole-gene LBR deletion has been reported as a second allele.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30448303
    reference_title: Lamin B receptor-related disorder is associated with a spectrum of skeletal dysplasia phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed trio exome sequencing (ES) on two patients with atypical variants of skeletal dysplasia and their unaffected parents"
    explanation: Trio exome sequencing identified the causal LBR variants.
- name: Peripheral Blood Smear
  description: >-
    A peripheral blood smear showing hyposegmented "pince-nez" Pelger-Huet
    neutrophils in the patient and in carrier parents is a cheap pointer to LBR; a
    normal smear does not exclude the disease.
  evidence:
  - reference: PMID:22338047
    reference_title: Understanding and recognizing the Pelger-Huët anomaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHA is caused by a decreased amount of the lamin B receptor (LBR)."
    explanation: The Pelger-Huet neutrophil finding points to reduced LBR.
- name: Sterol Analysis
  description: >-
    Gas chromatography-mass spectrometry of plasma or cultured fibroblasts detects
    the accumulated cholesta-8,14-dien-3-beta-ol intermediate, confirming the sterol
    C14-reductase deficiency.
  evidence:
  - reference: PMID:23824842
    reference_title: "Pelger-huet anomaly and a mild skeletal phenotype secondary to mutations in LBR."

name: LBR-Related Regressive Spondylometaphyseal Dysplasia
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- regressive spondylometaphyseal dysplasia
- LBR-related regressive spondylometaphyseal dysplasia
- LBR-R-SMD
- anadysplasia-like, spontaneously remitting spondylometaphyseal dysplasia
- Pelger-Huet anomaly with mild skeletal anomalies
description: >-
  Regressive spondylometaphyseal dysplasia is a rare autosomal recessive skeletal
  dysplasia caused by biallelic (homozygous or compound heterozygous) hypomorphic
  variants in LBR, which encodes the lamin B receptor, a dual-function inner
  nuclear membrane protein with 3-beta-hydroxysterol Delta14-reductase (sterol
  C14-reductase) activity and a structural role tethering heterochromatin to the
  nuclear lamina. It sits at the mild, survivable end of the LBR allelic spectrum,
  between heterozygous Pelger-Huet anomaly (a benign neutrophil finding) and the
  homozygous lethal Greenberg/HEM dysplasia. Affected individuals present
  prenatally or in infancy with short stature, rhizomelic limb shortening and
  bowed long bones; the spondylometaphyseal radiographic changes characteristically
  improve spontaneously over childhood, which gives the disorder its name. A
  hyposegmented Pelger-Huet neutrophil pattern is usual but not invariant.
  Fewer than about 15 individuals and fetuses have been reported.

  Reduced sterol C14-reductase activity leaves accumulated cholesta-8,14-dien-3-beta-ol
  and impairs cell-autonomous cholesterol biosynthesis, which is inferred to disturb
  endochondral ossification in the growth plate; partial residual activity and
  paralogue (TM7SF2/DHCR14) redundancy are thought to underlie the radiographic
  regression. In parallel, a reduced dose of the structural LBR protein causes the
  failure of neutrophil nuclear lobulation seen as the Pelger-Huet anomaly. The
  relative weight of the enzymatic and structural roles remains debated, because
  Lbr-null mice show the neutrophil phenotype without a tissue sterol defect.
disease_term:
  preferred_term: regressive spondylometaphyseal dysplasia
  term:
    id: MONDO:0018663
    label: regressive spondylometaphyseal dysplasia
parents:
- Spondylometaphyseal Dysplasia
- Skeletal Dysplasia
- Genetic Disease
notes: >-
  MONDO:0018663 cross-references OMIM 618019, whose current label is "Rhizomelic
  skeletal dysplasia with or without Pelger-Huet anomaly" (SKPHA/PHASK). The
  mechanism below is partly inferred: the sterol C14-reductase deficiency and the
  Pelger-Huet neutrophil branch are established, but the step from impaired growth-plate
  cholesterol supply to disturbed endochondral ossification, and the mechanism of
  radiographic regression, are not directly demonstrated in patients. ClinGen
  (Skeletal Disorders GCEP, 2023) rates LBR for this disease Moderate (AR). The
  gene's other phenotypes - Greenberg dysplasia, Pelger-Huet anomaly, Reynolds
  syndrome - are curated separately.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) hypomorphic LBR variants.
    Heterozygous carriers commonly show the Pelger-Huet neutrophil anomaly alone,
    so carrier status behaves co-dominantly at the haematological level while the
    skeletal dysplasia is recessive. Pseudodominant transmission has been reported
    in consanguineous and multiply-affected families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34467646
    reference_title: "Antenatal diagnostic dilemma in a pseudodominant pedigree with lamin-B receptor (LBR)-related regressive spondylometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of LBR revealed homozygous c.1534C>T (p.Arg512Trp) in exon 12 in both affected individuals."
    explanation: Affected individuals carry biallelic (homozygous) LBR variants, consistent with recessive inheritance.
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that the healthy mother of the fetus showed hypolobulated nuclei in 60% of her granulocytes confirms that classic Pelger-Huët anomaly represents the heterozygous state of 3beta-hydroxysterol delta(14)-reductase deficiency."
    explanation: Heterozygotes show only the Pelger-Huet anomaly, confirming the skeletal disorder is recessive.
pathophysiology:
- name: LBR Sterol C14-Reductase Deficiency
  description: >-
    Biallelic hypomorphic LBR variants reduce 3-beta-hydroxysterol Delta14-reductase
    (sterol C14-reductase) activity. Missense substitutions in the sterol-reductase
    domain lower substrate affinity, while truncating alleles destabilise the protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LBR
    term:
      id: hgnc:6518
      label: LBR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: 3-beta-hydroxysterol Delta14-reductase activity
    modifier: DECREASED
    term:
      id: GO:0050613
      label: Delta14-sterol reductase activity
  downstream:
  - target: Accumulation of Cholesta-8,14-dien-3-beta-ol and Impaired Cholesterol Biosynthesis
    causal_link_type: DIRECT
  - target: Failed Neutrophil Nuclear Lobulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27336722
    reference_title: "The Lamin B receptor is essential for cholesterol synthesis and perturbed by disease-causing mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "point mutations in the sterol reductase domain perturb enzymatic activity by reducing the affinity"
    explanation: Disease missense variants reduce the enzyme's catalytic activity.
  - reference: PMID:32827848
    reference_title: "A homozygous variant in the Lamin B receptor gene LBR results in a non-lethal skeletal dysplasia without Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrate the effect of this variant on sterol C14-reductase activity"
    explanation: A patient variant was shown to impair sterol C14-reductase activity.
- name: Accumulation of Cholesta-8,14-dien-3-beta-ol and Impaired Cholesterol Biosynthesis
  description: >-
    Reduced sterol C14-reductase activity blocks the Delta14 step of cholesterol
    biosynthesis, leaving the intermediate cholesta-8,14-dien-3-beta-ol to accumulate
    and reducing cell-autonomous cholesterol synthesis.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cholesterol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  downstream:
  - target: Disturbed Endochondral Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27336722
    reference_title: "The Lamin B receptor is essential for cholesterol synthesis and perturbed by disease-causing mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human LBR is essential for cholesterol synthesis"
    explanation: LBR activity is required for cholesterol biosynthesis.
  - reference: PMID:30448303
    reference_title: Lamin B receptor-related disorder is associated with a spectrum of skeletal dysplasia phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased level of cholesta-8,14-dien-3beta-ol to 2.9% of total sterols"
    explanation: Patient sterol analysis showed accumulation of the cholesta-8,14-dien-3-beta-ol intermediate.
  - reference: PMID:23824842
    reference_title: "Pelger-huet anomaly and a mild skeletal phenotype secondary to mutations in LBR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sterol analysis found trace amounts of cholesta-8,14-dien-3beta-ol, which is normally undetected in healthy individuals."
    explanation: The accumulated Delta14 sterol intermediate was detectable in the first reported patient.
- name: Disturbed Endochondral Ossification
  description: >-
    Impaired cholesterol supply in growth-plate chondrocytes is inferred to disturb
    endochondral ossification, producing the short, bowed long bones and
    spondylometaphyseal changes. Residual enzyme activity and paralogue redundancy
    are thought to permit the later spontaneous radiographic regression.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  downstream:
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Rhizomelic limb shortening
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Bowing of the long bones
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Spondylometaphyseal dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30448303
    reference_title: Lamin B receptor-related disorder is associated with a spectrum of skeletal dysplasia phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "phenotypic spectrum of LBR-associated disorders"
    explanation: The LBR sterol-reductase deficiency produces a spectrum of skeletal dysplasia; the growth-plate step is inferred.
  - reference: PMID:25348816
    reference_title: "An anadysplasia-like, spontaneously remitting spondylometaphyseal dysplasia secondary to lamin B receptor (LBR) gene mutations: further definition of the phenotypic heterogeneity of LBR-bone dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygosity or compound heterozygosity of mutations in LBR can result in a mild, spontaneously regressing bone dysplasia"
    explanation: Biallelic LBR variants cause the regressing skeletal dysplasia.
  - reference: PMID:17403717
    reference_title: "HEM dysplasia and ichthyosis are likely laminopathies and not due to 3beta-hydroxysterol Delta14-reductase deficiency."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "HEM dysplasia and ichthyosis are laminopathies rather than inborn errors of cholesterol synthesis"
    explanation: >-
      Mouse genetics argue the LBR skeletal phenotype is a structural (laminopathy)
      defect rather than a consequence of the sterol-reductase deficiency, a
      counter-argument to the inferred sterol-to-ossification edge.
- name: Failed Neutrophil Nuclear Lobulation
  description: >-
    Independently of the sterol branch, a reduced dose of the structural LBR
    protein at the nuclear envelope causes failure of neutrophil nuclear lobulation,
    seen as the hyposegmented Pelger-Huet neutrophil nuclei. The two branches can be
    uncoupled - some alleles give skeletal disease without Pelger-Huet anomaly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: ABNORMAL
    term:
      id: GO:0006998
      label: nuclear envelope organization
  downstream:
  - target: Hyposegmentation of neutrophil nuclei
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22338047
    reference_title: Understanding and recognizing the Pelger-Huët anomaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHA is caused by a decreased amount of the lamin B receptor (LBR)."
    explanation: The Pelger-Huet anomaly results from reduced LBR protein dosage.
  - reference: PMID:21326950
    reference_title: Dosage effect of zero to three functional LBR-genes in vivo and in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data demonstrate that there is a highly significant gene-dosage effect between the gene copy number and the nuclear segmentation index of neutrophils."
    explanation: Neutrophil nuclear segmentation scales with functional LBR gene dosage.

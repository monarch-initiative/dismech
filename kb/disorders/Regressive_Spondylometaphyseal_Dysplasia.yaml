  variants:
  - name: p.Arg512Trp
    description: Homozygous c.1534C>T (p.Arg512Trp); reported in a pseudodominant pedigree with fetal-onset disease and associated with Pelger-Huet anomaly.
    evidence:
    - reference: PMID:34467646
      reference_title: "Antenatal diagnostic dilemma in a pseudodominant pedigree with lamin-B receptor (LBR)-related regressive spondylometaphyseal dysplasia."

        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A complete F1 embryonic lethality for gbh-1(ko), gbh-1(G247Vfs6), and gbh-1(G283R) worms at a 1 mM concentration of γ-butyrobetaine"
        explanation: Reports the exposure result underlying the toxicity hypothesis.
    evidence:
    - reference: PMID:41022783

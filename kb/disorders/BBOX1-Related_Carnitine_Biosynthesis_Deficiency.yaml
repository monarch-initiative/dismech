    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed two compound heterozygous variants in BBOX1: NM_003986.3:c.176A>G (p.Asp59Gly) paternally inherited, and NM_003986.3:c.675delA (p.Gly227Valfs*6) maternally inherited"
    explanation: Biparental inheritance of two different BBOX1 alleles in an affected proband establishes a recessive mechanism.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Three patients from two unrelated families constitute the entire reported
    cohort of molecularly and biochemically confirmed BBOX1 deficiency as of the
    2025 first report. No population estimate exists. One earlier individual with a
    homozygous 11p14.2 deletion removing BBOX1 was described biochemically but
    without the gamma-butyrobetaine measurements that define the disorder.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 3 probands from two unrelated families with rare BBOX1 variants, L-carnitine deficiency, and elevated levels of plasma γ-BB"
    explanation: Establishes the size of the reported cohort.
pathophysiology:
- name: BBOX1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic BBOX1 variants reduce or abolish the activity of gamma-butyrobetaine
    hydroxylase, the cytosolic dimeric dioxygenase that catalyses the terminal
    hydroxylation converting gamma-butyrobetaine to L-carnitine. Two missense
    alleles (p.Asp59Gly, p.Gly263Arg) and one frameshift allele
    (p.Gly227Valfs*6, predicted to remove 40% of the C-terminus) have been
    reported.
  gene:
    preferred_term: BBOX1
    term:
      id: hgnc:964
      label: BBOX1
  molecular_functions:
  - preferred_term: gamma-butyrobetaine dioxygenase activity
    term:
      id: GO:0008336
      label: gamma-butyrobetaine dioxygenase activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:

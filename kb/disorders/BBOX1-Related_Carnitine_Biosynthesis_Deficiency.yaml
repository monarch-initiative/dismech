animal_models:
- name: gbh-1 null C. elegans
  species: Caenorhabditis elegans
  genotype: gbh-1(ko), full deletion of the BBOX1-orthologue coding sequence
  genes:
  - preferred_term: BBOX1
    term:
      id: hgnc:964
      label: BBOX1
  description: >-
    CRISPR/Cas9 knockout of gbh-1, the C. elegans orthologue of BBOX1 (33%
    sequence identity, with the residues altered in the patients invariant across
    species). The strain has no L-carnitine, more than 50-fold elevated
    gamma-butyrobetaine and an absent acylcarnitine spectrum, and shows
    nutrition-dependent embryonic lethality that is fully rescued by exogenous
    L-carnitine. Its value is that the worm's exogenous carnitine supply can be
    controlled - an E. coli caiA mutant that cannot make carnitine was used to
    remove it - which is the manipulation that separates the biosynthetic defect
    from dietary compensation. Its limits are the obvious ones: an invertebrate,
    a null rather than a patient allele, and an embryonic-lethality readout that
    has no counterpart in the human phenotype.
  publication: PMID:41022783
  modeled_mechanisms:
  - target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete loss of the orthologous enzyme reproduces the selective terminal
      block: no L-carnitine, accumulated gamma-butyrobetaine, unchanged upstream
      precursors.
    limitations: >-
      Invertebrate system with a null allele; the corresponding human patients are
      hypomorphic compound heterozygotes or homozygotes for a missense allele, and
      no human tissue measurement of the biosynthetic block exists.
    readouts:
    - name: L-carnitine level by HPLC-MS
      target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
      direction: ABOLISHED
      interpretation: >-
        Undetectable L-carnitine is the direct product-side readout of the terminal
        block.
      evidence:
      - reference: PMID:41022783
        reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "L-carnitine is undetectable in gbh-1(ko), gbh-1(G247Vfs*6), and gbh-1(G283R) strains, indicating a disruption in its biosynthesis."
        explanation: Reports the measured loss of product in the null and functionally null strains.
    - name: Gamma-butyrobetaine level by HPLC-MS
      target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
      direction: INCREASED
      interpretation: >-
        Substrate accumulation above 50-fold is the substrate-side readout of the
        same block.
      evidence:
      - reference: PMID:41022783
        reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The gbh-1(ko), gbh-1(G247Vfs*6), and gbh-1(G283R) strains exhibited profound accumulation of γ-BB, with levels more than 50-fold above those seen in wild-type N2 nematodes"
        explanation: Quantifies substrate accumulation in the model.
    evidence:
    - reference: PMID:41022783
      reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we observed a lethal embryonic phenotype for the gbh-1 loss-of-function strains, which was rescued upon L-carnitine supplementation"
      explanation: The carnitine rescue is what makes the model informative for the biosynthetic block rather than for gene loss in general.
  - target: Carnitine Transport Inhibition by Gamma-Butyrobetaine
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Exogenous gamma-butyrobetaine exposure is used as a direct perturbation to
      ask whether the accumulated substrate is harmful independently of the
      carnitine deficit; millimolar exposure was lethal to the null and
      functionally null strains on carnitine-replete bacteria.
    limitations: >-
      A millimolar external exposure is far above the low-micromolar plasma
      elevations seen in patients, the readout is embryonic viability rather than
      carnitine uptake, and the proposed transporter-competition step was not
      measured.
    readouts:
    - name: Embryonic hatch rate under gamma-butyrobetaine exposure
      target: Carnitine Transport Inhibition by Gamma-Butyrobetaine
      direction: DECREASED
      interpretation: >-
        Loss of viability on carnitine-replete food is the observation that

      NM_003986.3:c.176A>G (p.Asp59Gly) and NM_003986.3:c.675delA
      (p.Gly227Valfs*6); the family 2 proband is homozygous for
      NM_003986.3:c.787G>A (p.Gly263Arg).
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gamma-butyrobetaine hydroxylase (BBOX1) catalyses the last step of carnitine biosynthesis, converting γ-butyrobetaine (γ-BB) into L-carnitine."
    explanation: Establishes the enzymatic step that BBOX1 catalyses and therefore what is lost.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frameshift variant NM_003986.3:c.675delA (p.Gly227Valfs*6) (family 1) leads to a premature stop codon and is predicted to code for a truncated protein of 231 amino acids (40% of the C-terminus sequence removed)."
    explanation: Characterises the frameshift allele as a predicted loss-of-function change.
  downstream:
  - target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Loss of gamma-butyrobetaine hydroxylase activity removes the only enzyme
      that converts gamma-butyrobetaine to L-carnitine, so the biosynthetic
      pathway terminates one step short of its product.
- name: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    Endogenous L-carnitine synthesis proceeds in four enzymatic steps from
    6-N-trimethyllysine and takes place mainly in liver, brain and kidney. With
    BBOX1 inactive the pathway is blocked at the final step: metabolites upstream
    of gamma-butyrobetaine are essentially unchanged while the immediate substrate
    accumulates and the product is not made. This selective, single-step blockade
    is what the C. elegans metabolomics demonstrates directly.
  biological_processes:
  - preferred_term: carnitine biosynthetic process
    term:
      id: GO:0045329
      label: carnitine biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endogenous synthesis of L-carnitine occurs mainly in the liver, brain, and kidneys in a four-step enzymatic pathway, with 6-N-trimethyllysine (TML) as the initial substrate."
    explanation: Locates the blocked pathway anatomically and defines its step structure.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the absence of significant changes in other metabolites confirms that the loss of GBH-1 selectively impacts the L-carnitine biosynthesis pathway"
    explanation: Worm metabolomics shows the lesion is confined to this pathway rather than perturbing metabolism broadly.
  downstream:
  - target: Gamma-Butyrobetaine Accumulation
    causal_link_type: DIRECT
    description: >-
      The unconverted substrate of the blocked reaction accumulates in plasma and
      urine.
  - target: Systemic L-Carnitine Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of the endogenous synthetic contribution to carnitine homeostasis
      lowers circulating free and total carnitine.
- name: Gamma-Butyrobetaine Accumulation
  biological_scale: ORGANISM
  description: >-
    Plasma and urinary gamma-butyrobetaine rise well above the reference interval
    and, unlike the carnitine deficit, are not corrected by L-carnitine
    supplementation - indicating that carnitine biosynthesis in this disorder is
    not subject to end-product feedback control. The accumulated substrate is the
    disorder's specific diagnostic marker, distinguishing it both from carnitine
    transporter defects and from TMLHE deficiency at the first step of the same
    pathway.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of L-carnitine biosynthesis intermediates revealed elevated γ-BB levels in plasma and urine"
    explanation: Documents the accumulation of the blocked reaction's substrate in a patient.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the degree of γ-BB accumulation in the plasma remained unchanged upon L-carnitine supplementation. This finding suggests that there is no end product-controlled L-carnitine synthesis in BBOX1 deficiency"
    explanation: Establishes that the substrate accumulation persists on treatment and is not feedback-regulated.
  downstream:
  - target: Carnitine Transport Inhibition by Gamma-Butyrobetaine
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - gamma_butyrobetaine_toxicity
    description: >-
      Proposed independent contribution of the accumulated substrate, by chemical
      toxicity or by competition with carnitine for cellular uptake. Curated as a
      hypothesis arm because the mechanism is explicitly presumptive and the
      supporting lethality data are from C. elegans.
- name: Carnitine Transport Inhibition by Gamma-Butyrobetaine
  biological_scale: CELLULAR
  description: >-
    Hypothesised second pathogenic arm in which accumulated gamma-butyrobetaine is
    itself harmful rather than merely a marker of the block. In C. elegans,
    exposure of gbh-1 loss-of-function strains to millimolar gamma-butyrobetaine
    caused complete embryonic lethality even on carnitine-producing bacteria, which
    is the observation the toxicity proposal rests on. The suggested mechanism -
    competitive inhibition of the carnitine transporter, which would deepen the
    intracellular carnitine deficit - has not been demonstrated directly in either
    system.
  biological_processes:
  - preferred_term: carnitine transmembrane transport
    term:
      id: GO:1902603
      label: carnitine transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure to 1 mM γ-BB resulted in total embryonic lethality in the gbh-1(ko), gbh-1(G247Vfs*6), and gbh-1(G283R) mutants"
    explanation: Provides the experimental basis for treating accumulated gamma-butyrobetaine as independently harmful.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Presumed mechanisms of toxicity could be chemical or by competitive inhibition of the carnitine transporter, which would further aggravate the intracellular carnitine deficiency."
    explanation: States the proposed transport-competition mechanism, which the authors label presumed rather than demonstrated.
  downstream:
  - target: Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - gamma_butyrobetaine_toxicity
    description: >-
      If gamma-butyrobetaine competes with carnitine for cellular uptake, the
      intracellular carnitine available to the shuttle falls further than
      circulating levels alone would predict.
- name: Systemic L-Carnitine Deficiency
  biological_scale: ORGANISM
  description: >-
    Free and total L-carnitine are persistently low in serum and dried blood spots.
    Critically, the renal fractional excretion of carnitine is normal, so the
    deficiency is one of failed production rather than of renal wasting; this was
    used clinically to exclude SLC22A5 transporter deficiency in the index
    patients. Loss of the biosynthetic arm alone is sufficient to lower circulating
    carnitine because dietary intake and tubular reabsorption do not fully
    compensate in these individuals.
  biological_processes:
  - preferred_term: carnitine metabolic process
    term:
      id: GO:0009437
      label: carnitine metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "L-carnitine transporter and fatty acid oxidation-related L-carnitine deficiency were ruled out by normal renal excretion fraction of L-carnitine"
    explanation: Establishes that the carnitine deficit is biosynthetic rather than a transporter or renal-wasting defect.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical genetic workup showed persistently low free carnitine levels both on dried bloodspots and in serum, in the presence of normal renal L-carnitine fractional excretion"
    explanation: Documents the same biochemical signature independently in the second family.
  downstream:
  - target: Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
    causal_link_type: DIRECT
    description: >-
      Carnitine is the obligate carrier for the mitochondrial import of long-chain
      fatty acids, so a systemic carnitine deficit limits shuttle flux.
- name: Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
  biological_scale: CELLULAR
  description: >-
    With less carnitine available, the carnitine shuttle carries fewer activated
    long-chain fatty acids across the inner mitochondrial membrane and
    beta-oxidation flux falls. The C. elegans model makes this consequence
    concrete: acylcarnitine species from C2 to C20 are undetectable in the null and
    functionally null strains. Note that the human patients were not shown to have
    a cellular fatty-acid-oxidation defect - patient 1 had a normal acylcarnitine
    profile in palmitate-loaded fibroblasts - so the human arm of this step is an
    inference from carnitine's known role rather than a direct measurement.
  biological_processes:
  - preferred_term: carnitine shuttle
    term:
      id: GO:0006853
      label: carnitine shuttle
    modifier: DECREASED
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "L-carnitine is essential for transporting long-chain fatty acids into the mitochondria for β-oxidation, which is essential for cardiac and skeletal muscle energy metabolism and hepatic ketogenesis during fasting periods."
    explanation: States carnitine's obligate role in mitochondrial long-chain fatty acid import, from which reduced shuttle flux under carnitine deficiency follows.
  - reference: PMID:11802770
    reference_title: "Carnitine biosynthesis in mammals."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Carnitine is indispensable for energy metabolism, since it enables activated fatty acids to enter the mitochondria, where they are broken down via beta-oxidation."
    explanation: Independent review support for the carnitine-dependence of mitochondrial fatty acid oxidation.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The acylcarnitine spectrum is markedly absent in gbh-1(ko), gbh-1(G247Vfs*6), and gbh-1(G283R) worms, as reflected by non-detectable levels across these mutants."
    explanation: Demonstrates loss of the acylcarnitine pool, the direct biochemical evidence that shuttle substrate handling collapses.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "by demonstration of a normal acylcarnitine profile in cultured fibroblasts incubated with palmitic acid and L-carnitine"
    explanation: Patient fibroblasts loaded with palmitate showed no fatty-acid-oxidation defect, arguing against a cell-autonomous beta-oxidation block in the human disease.
  downstream:
  - target: Skeletal Muscle Energy Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Skeletal muscle depends on fatty acid oxidation for sustained energy supply,
      so reduced shuttle flux presents as exercise intolerance, fatigability and
      weakness.
- name: Skeletal Muscle Energy Deficit
  biological_scale: TISSUE
  description: >-
    Muscle weakness, exercise intolerance and fatigability were present in all
    three reported patients and are the most consistent clinical feature of the
    disorder. In patient 1 the weakness was trunk- and proximal-predominant and
    accompanied by muscle wasting, ptosis and swallowing difficulty; muscle biopsy
    showed type 1 fibre predominance with normal mitochondrial morphology,
    respiratory chain enzyme activity and Gomori trichrome staining, so no
    structural myopathy or storage disease was demonstrated.
  cell_types:

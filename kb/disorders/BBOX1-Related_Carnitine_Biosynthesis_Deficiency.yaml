biochemical:
- name: Plasma free and total L-carnitine
  presence: DECREASED
  context: >-
    Persistently low free and total L-carnitine in serum and dried blood spots is
    the finding that brings these patients to metabolic attention. On its own it is
    not discriminating - it is shared with SLC22A5 transporter deficiency and with
    secondary carnitine depletion - so it must be paired with a normal renal
    fractional excretion and an elevated gamma-butyrobetaine to point at BBOX1.
  biomarker_term:
    preferred_term: carnitine
    term:
      id: CHEBI:17126
      label: carnitine
  readouts:
  - target: Systemic L-Carnitine Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low circulating free carnitine is the direct circulating readout of the
      systemic carnitine deficit.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical genetic workup revealed persistently low levels of serum free carnitine."
    explanation: Documents the low circulating carnitine that defines the biochemical phenotype.
- name: Plasma and urinary gamma-butyrobetaine
  presence: INCREASED
  context: >-
    Elevated gamma-butyrobetaine, the substrate of the blocked reaction, is the
    disorder-specific marker. Reported plasma values in the two patients measured
    before supplementation were 5.50 and 13.20 umol/L against a 0.3-1.4 umol/L
    reference interval, and the elevation persisted during L-carnitine treatment.
    It is measured in specialised laboratories rather than on a routine
    acylcarnitine panel, which is why the diagnosis is easy to miss.
  biomarker_term:
    preferred_term: gamma-butyrobetaine
    term:
      id: CHEBI:16244
      label: 4-(trimethylammonio)butanoate
  readouts:
  - target: Gamma-Butyrobetaine Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Plasma and urinary gamma-butyrobetaine directly report accumulation of the
      unconverted substrate upstream of the enzymatic block.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showing elevation of γ-BB in plasma (Table 1) and urine (data not shown) while plasma L-carnitine levels were within the normal range"
    explanation: Shows that gamma-butyrobetaine stays elevated even when supplementation has normalised carnitine, making it the more robust marker.
- name: Renal fractional excretion of carnitine
  presence: NORMAL
  context: >-
    A normal fractional excretion of carnitine (below 5%) is the discriminating
    negative finding. It excludes SLC22A5/OCTN2 transporter deficiency, in which
    carnitine is wasted in the urine, and so redirects the workup from transport to
    biosynthesis. All three reported patients had values between 0.7 and 2.9%.
  biomarker_term:
    preferred_term: carnitine
    term:
      id: CHEBI:17126
      label: carnitine
  readouts:
  - target: Systemic L-Carnitine Deficiency
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A normal value establishes that the carnitine deficit is not caused by renal
      wasting, which is what makes a biosynthetic defect the remaining explanation.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT

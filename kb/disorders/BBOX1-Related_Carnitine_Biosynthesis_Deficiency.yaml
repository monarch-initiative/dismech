name: BBOX1-Related Carnitine Biosynthesis Deficiency
creation_date: "2026-08-31T00:00:00Z"
category: Mendelian
description: >-
  BBOX1-related L-carnitine biosynthesis deficiency is a very recently delineated
  autosomal recessive inborn error of the endogenous carnitine synthesis pathway.
  BBOX1 encodes gamma-butyrobetaine hydroxylase, the cytosolic dioxygenase that
  catalyses the fourth and final step of L-carnitine biosynthesis, converting
  gamma-butyrobetaine into L-carnitine. Biallelic BBOX1 variants block that final
  step, producing the characteristic biochemical pair of low plasma free and total
  L-carnitine together with markedly elevated plasma and urinary gamma-butyrobetaine,
  in the presence of a normal renal fractional excretion of carnitine - the feature
  that separates this disorder from SLC22A5-related systemic primary carnitine
  deficiency, where carnitine is lost through the kidney. Because carnitine is
  required for the carnitine shuttle that carries long-chain fatty acids into the
  mitochondrion, the resulting phenotype in the three reported patients is dominated
  by myopathic features (muscle weakness, exercise intolerance, fatigability), with
  neurodevelopmental (motor and speech delay, learning difficulty, autism) and
  late-onset psychiatric (psychosis, anxiety) manifestations also reported. Oral
  L-carnitine normalises circulating carnitine and improved muscle weakness and
  fatigability in the one patient in whom the response was documented, but does not
  lower gamma-butyrobetaine.

  Two caveats are curated explicitly rather than smoothed over. First, the
  genotype-phenotype relationship is not settled: an earlier patient homozygous for
  a 221 kb 11p14.2 deletion removing BBOX1 entirely had only a borderline-low free
  carnitine and none of the classic carnitine-deficiency manifestations, and
  homozygous predicted-truncating BBOX1 alleles are present in gnomAD. Second, the
  causal support for the disease mechanism rests substantially on a C. elegans
  gbh-1 model, in which the worm allele modelling one of the two patient variants
  (p.Asp59Gly) behaved like wild type.
synonyms:
- Gamma-butyrobetaine hydroxylase deficiency
- BBOX1 deficiency
- BBOX1-related L-carnitine biosynthesis deficiency
- Gamma-butyrobetaine dioxygenase deficiency
parents:
- Fatty Acid Oxidation Disorder
- Inborn Error of Metabolism
inheritance:
- name: Autosomal recessive
  description: >-
    Autosomal recessive inheritance. Two affected siblings in family 1 carry the
    same compound heterozygous pair, one variant inherited from each unaffected
    parent; the proband in family 2 is homozygous for a third variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

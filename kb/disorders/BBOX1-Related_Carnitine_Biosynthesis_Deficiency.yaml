discussions:
- discussion_id: bbox1_genotype_phenotype_penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does biallelic loss of BBOX1 reliably cause clinical disease, or is the
    myopathic and neuropsychiatric phenotype dependent on modifiers, dietary
    carnitine intake, or ascertainment?
  attaches_to:
  - pathophysiology#BBOX1 Loss of Function
  - pathophysiology#Systemic L-Carnitine Deficiency
  rationale: >-
    Three lines of evidence pull against a simple fully-penetrant model. An
    individual homozygous for a 221 kb 11p14.2 deletion removing BBOX1 outright had
    only a borderline-low free carnitine, a normal acylcarnitine-to-free-carnitine
    ratio and none of the classic carnitine-deficiency manifestations, and the
    authors of that report concluded that dietary intake and renal reabsorption
    suffice for carnitine homeostasis. Homozygous predicted-truncating BBOX1
    alleles are present in gnomAD. And the family 1 patients are compound
    heterozygous for an allele that retains function in the orthologous worm assay.
    Since the biosynthetic arm is only one of three inputs to carnitine
    homeostasis, dietary carnitine intake is a plausible modifier that no reported
    case controls for. Resolving this matters for whether BBOX1 should be added to
    metabolic gene panels and for how a homozygous truncating variant found
    incidentally should be reported.
  evidence:
  - reference: PMID:24986124
    reference_title: "The effect of homozygous deletion of the BBOX1 and Fibin genes on carnitine level and acyl carnitine profile."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition results in mildly decreased free carnitine level, but not in clinical manifestations characteristic of carnitine deficiency disorders, suggesting that dietary carnitine intake and renal reabsorption are sufficient to carnitine homeostasis."
    explanation: A complete BBOX1 deletion produced no classic carnitine-deficiency phenotype, arguing against obligate clinical consequence.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have been found in homozygous individuals in the population database gnomAD, posing the question of whether these individuals may have milder phenotypes, possibly due to modifier effects"
    explanation: The authors themselves raise unaffected or mildly affected homozygous truncating carriers as an open question.
- discussion_id: bbox1_neuropsychiatric_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the neurodevelopmental and psychiatric features mechanistically caused by
    BBOX1 deficiency, and if so through what route - brain carnitine depletion,
    gamma-butyrobetaine toxicity, or neither?
  attaches_to:
  - phenotypes#Autism Spectrum Disorder
  - phenotypes#Psychosis
  - pathophysiology#Gamma-Butyrobetaine Accumulation
  rationale: >-
    The report singles out neurodevelopmental and psychiatric manifestations as
    specific to BBOX1 deficiency, in contrast to the myopathic features it shares
    with SLC22A5 disease. But no mechanistic route is curated here because none has
    been demonstrated: the supporting arguments offered are an association of BBOX1
    polymorphisms with schizophrenia susceptibility and downregulation of BBOX1 in
    a mouse schizophrenia model, neither of which establishes that carnitine
    depletion or substrate accumulation in the brain produces these features. The
    cohort is three patients from two families with heterogeneous presentations -
    autism and learning difficulty in one, psychosis in another, anxiety in two -
    which is not enough to separate a causal effect from coincidence. TMLHE
    deficiency at the first step of the same pathway carries a comparable and
    similarly unresolved autism association, so this is a pathway-level question
    rather than a BBOX1-specific one.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "additional neurodevelopmental and psychiatric manifestations seem to be specifically related to BBOX1 deficiency"
    explanation: States the attribution claim in the hedged form that makes it a knowledge gap rather than a curated mechanism.
- discussion_id: bbox1_worm_model_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can the C. elegans gbh-1 model support causal claims about human BBOX1
    disease when the worm equivalent of the patients' compound-heterozygous
    genotype is phenotypically normal?
  attaches_to:
  - animal_models#gbh-1 patient-allele knock-in C. elegans
  - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
  rationale: >-
    The worm model carries most of the causal weight in this first report: it is
    where the biosynthetic block, the substrate accumulation and the carnitine
    rescue are demonstrated. Yet the strain modelling p.Asp59Gly behaves as wild
    type on every assay, and the trans-heterozygote reproducing the family 1
    genotype shows no lethality even under starvation, so the model does not
    reproduce the disease state of the two most fully characterised patients. The
    human data are also partly discordant with a downstream fatty-acid-oxidation
    block: patient 1's palmitate-loaded fibroblasts had a normal acylcarnitine
    profile, whereas the worm strains lose the acylcarnitine pool entirely. This is
    a mismatch of translational validity rather than an absence of evidence - the
    experiments were done, and they do not line up - so it is curated as
    HUMAN_MODEL_MISMATCH. Resolving it needs a mammalian model or a human
    tissue-level measurement of carnitine-dependent fatty acid oxidation.
  proposed_experiments:
  - experiment_id: exp_bbox1_muscle_fao_flux
    name: Human muscle carnitine and fatty-acid-oxidation flux in a BBOX1 patient
    description: >-
      Measure muscle total and free carnitine plus long-chain fatty acid oxidation
      flux in a biopsy from a molecularly confirmed patient sampled before starting
      or after a supervised washout of L-carnitine, against matched controls. This
      is the measurement that would put the human arm of the shuttle step on direct
      evidence rather than on inference from carnitine's known role, and it would
      also address the discordance with the normal fibroblast acylcarnitine
      profile, since fibroblasts are not the tissue in which the phenotype
      manifests.
    would_support:
    - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
    supporting_outcome:
    - >-
      Reduced muscle carnitine content with reduced long-chain fatty acid oxidation
      flux relative to controls, correcting on resupplementation, would establish
      the shuttle step in human tissue.
    would_refute:
    - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
    refuting_outcome:
    - >-
      Normal muscle carnitine content and normal oxidation flux despite low plasma
      carnitine would locate the myopathy outside the carnitine shuttle and force a
      different account of the muscle phenotype.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, gbh-1(D72G) mutants displayed wild-type embryonic viability under all conditions tested"
    explanation: The patient-derived allele carried by both family 1 siblings is functionally silent in the model, which is the mismatch.
notes: >-
  MONDO anchor: none. As of the 2025 first report there is no MONDO class and no
  OMIM phenotype entry for BBOX1-related carnitine biosynthesis deficiency - OMIM
  603312 is the BBOX1 gene record (a star entry), not a phenotype. The entry is
  therefore left without a top-level disease_term rather than being anchored to a
  neighbouring class that would misstate it: MONDO:0017716 "disorder of carnitine
  cycle and carnitine transport" is a sibling concept, not a parent, because this
  is a biosynthetic defect rather than a cycle or transport defect, and
  MONDO:0008919 "systemic primary carnitine deficiency disease" is the SLC22A5
  transporter disorder this entry is explicitly distinguished from. A MONDO new
  term request has been drafted on issue #5565 for a curator to forward upstream;
  this entry should be repointed once a class exists. See the decision-rule
  discussion on issue #3881 and the anchor backlog in issue #3691.

  Nosology: this is the second curated defect of endogenous carnitine
  biosynthesis, alongside TMLHE deficiency at the first step of the same four-step
  pathway. The two are biochemically complementary - TMLHE deficiency reduces the
  HTML/TML ratio, BBOX1 deficiency raises gamma-butyrobetaine - and neither is
  detected by a routine acylcarnitine panel. It is kept separate from
  Primary_Carnitine_Deficiency (SLC22A5) because the lesion, the biochemical
  signature and the discriminating test (renal fractional carnitine excretion) all
  differ, even though both present with low circulating carnitine and myopathy.

  Curated from IEMbase metabolic work package WP-010, row 4.1.06.01. A previous
  audit of that package deferred this row pending confirmation that a citable
  human clinical case exists; PMID:41022783 is that confirmation.

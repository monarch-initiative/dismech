    evidence_source: HUMAN_CLINICAL
    snippet: "he developed fine motor coordination delay, swallowing difficulty with frequent choking, bilateral ptosis, as well as exercise intolerance, intermittent muscle soreness, and generalized muscle weakness affecting mainly his trunk and proximal muscles"
    explanation: Documents the myopathic presentation in the index patient.
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathic, neurodevelopmental, and late-onset psychiatric manifestations are clinical hallmarks in our patients."
    explanation: Summarises the myopathic component as a defining feature across the cohort.
mechanistic_hypotheses:
- hypothesis_group_id: gamma_butyrobetaine_toxicity
  hypothesis_label: Gamma-butyrobetaine is independently toxic, not merely a marker
  status: EMERGING
  description: >-
    Under this model the accumulated substrate contributes to disease in its own
    right, in parallel with the carnitine deficit, plausibly by competing with
    carnitine for cellular uptake and so deepening the intracellular deficiency.
    The evidence is a C. elegans exposure experiment in which millimolar
    gamma-butyrobetaine killed gbh-1 null and functionally null embryos even on
    carnitine-producing bacteria, plus the clinical observation that
    gamma-butyrobetaine stays elevated on L-carnitine treatment. It is curated as
    EMERGING rather than canonical because the transporter-competition step is
    labelled presumed by the authors, the lethality data are invertebrate, and no
    human outcome has been shown to track gamma-butyrobetaine level. It matters
    therapeutically: if true, normalising carnitine alone would leave part of the
    disease untreated.
  evidence:
  - reference: PMID:41022783
    reference_title: "Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Translating results from the nematode model to human disease further allows the assumption that both L-carnitine deficiency and accumulation of γ-BB play an independent but synergistic role in the pathogenesis of human BBOX1 deficiency."
    explanation: States the two-arm hypothesis and, in the authors' own hedging, its status as an assumption carried over from the worm.

- name: Selective serotonin reuptake inhibitor therapy
  description: >-
    SSRIs such as sertraline remain a mainstay of PPD pharmacotherapy,
    particularly outside the acute severe presentations studied in the
    neuroactive-steroid trials. They act on monoaminergic rather than
    neurosteroid-GABAergic mechanisms and have a slower onset, and are therefore
    not linked to a pathophysiology node in this entry.
  therapeutic_modality: SMALL_MOLECULE

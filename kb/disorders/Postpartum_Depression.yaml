  - reference: PMID:34190962
    reference_title: "Effect of Zuranolone vs Placebo in Postpartum Depression: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Zuranolone demonstrated significant day 15 HAMD-17 score improvements from

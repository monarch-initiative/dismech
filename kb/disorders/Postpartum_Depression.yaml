mechanistic_hypotheses:
- hypothesis_group_id: neurosteroid_withdrawal_model
  hypothesis_label: Neurosteroid (allopregnanolone) withdrawal and GABA-A receptor plasticity failure
  status: CANONICAL
  description: >-
    The dominant model holds that PPD is triggered by the precipitous fall in
    progesterone-derived neurosteroids at parturition, acting on GABA-A
    receptors whose subunit composition has been remodeled across pregnancy.
    Women who fail to re-adapt receptor stoichiometry to the new neurosteroid
    milieu experience a loss of inhibitory tone and depressive symptoms. The
    model is supported by an experimental human hormone-withdrawal paradigm, by
    a genetic mouse model of failed GABA-A delta-subunit regulation, and — most
    persuasively — by the efficacy of two neuroactive-steroid GABA-A positive
    allosteric modulators developed directly from it.
  evidence:
  - reference: PMID:10831472
    reference_title: Effects of gonadal steroids in women with a history of postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data provide direct evidence in support of the involvement of the
      reproductive hormones estrogen and progesterone in the development of
      postpartum depression in a subgroup of women
    explanation: >-
      Experimental simulation of pregnancy-level steroids followed by blinded
      withdrawal provides the direct human causal test underpinning the
      withdrawal model.
  - reference: PMID:28619476
    reference_title: "Brexanolone (SAGE-547 injection) in post-partum depression: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-partum depression is a serious mood disorder in women that might be
      triggered by peripartum fluctuations in reproductive hormones.
    explanation: >-
      States the hormonal-fluctuation trigger hypothesis that motivated
      allopregnanolone replacement as a therapeutic strategy.
- hypothesis_group_id: hpa_axis_crh_model
  hypothesis_label: Placental CRH-driven HPA axis dysregulation
  status: ALTERNATIVE
  description: >-
    A complementary model attributes PPD risk to dysregulation of the
    hypothalamic-pituitary-adrenal axis. Placental corticotropin-releasing
    hormone rises exponentially across gestation and suppresses hypothalamic
    CRH; its abrupt withdrawal after delivery leaves a transiently hyporesponsive
    axis. Accelerated mid-gestation pCRH trajectories predict postpartum
    depressive symptoms independently of prenatal mood, and notably without
    parallel cortisol or ACTH signals, suggesting a placental rather than
    adrenal locus.
  evidence:
  - reference: PMID:19188538
    reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone in human pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth curve analyses indicated that the trajectories of pCRH in women
      with PPD symptoms are significantly accelerated from 23 to 26 weeks' GA.
    explanation: >-
      Longitudinal cohort evidence that a placental CRH trajectory, not a
      cortisol/ACTH signal, marks women who develop postpartum depressive
      symptoms.
pathophysiology:
- name: Gestational Neurosteroid Surge
  biological_scale: ORGANISM
  description: >-
    Across pregnancy, placental and ovarian steroidogenesis raises circulating
    progesterone and its 5-alpha-reduced neurosteroid metabolite allopregnanolone
    to supraphysiologic levels. This is the rising limb, and it is a normal
    feature of every pregnancy — it is pathogenic only as the setup for the fall
    that follows, by remodeling GABA-A receptors to a high-neurosteroid
    environment that will not persist.
  biological_processes:
  - preferred_term: steroid biosynthetic process
    term:
      id: GO:0006694
      label: steroid biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:18667149
    reference_title: "GABA(A)R plasticity during pregnancy: relevance to postpartum depression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The large increase in progesterone-derived neurosteroids during pregnancy
      and their precipitous decline at parturition may have considerable effects
      on GABA(A)Rs during pregnancy and postpartum.
    explanation: >-
      Establishes the gestational rise in progesterone-derived neurosteroids as
      the first limb of the surge-and-withdrawal cycle.
  downstream:
  - target: Precipitous Postpartum Neurosteroid Withdrawal
    causal_link_type: DIRECT
    hypothesis_groups:
    - neurosteroid_withdrawal_model
    description: >-
      Delivery of the placenta removes the source that sustained the surge,
      converting the rising limb into the steepest neurosteroid fall in normal
      human physiology.
  - target: Failure of GABA-A Receptor Subunit Plasticity
    causal_link_type: DIRECT
    hypothesis_groups:
    - neurosteroid_withdrawal_model
    description: >-
      Sustained high neurosteroid exposure across gestation is the stimulus that
      drives homeostatic remodeling of GABA-A receptor subunit composition.
- name: Precipitous Postpartum Neurosteroid Withdrawal
  biological_scale: ORGANISM
  description: >-
    Delivery of the placenta removes the dominant source of progesterone-derived
    neurosteroid within hours, producing the steepest neurosteroid withdrawal in
    normal human physiology. The withdrawal itself is universal; what
    distinguishes women who develop PPD is differential sensitivity to it,
    established experimentally by inducing and then withdrawing pregnancy-level
    estradiol and progesterone under double-blind conditions.
  biological_processes:
  - preferred_term: steroid biosynthetic process
    term:
      id: GO:0006694
      label: steroid biosynthetic process
    modifier: DECREASED
  - preferred_term: response to progesterone
    term:
      id: GO:0032570
      label: response to progesterone
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10831472
    reference_title: Effects of gonadal steroids in women with a history of postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of the eight women with a history of postpartum depression (62.5%)
      and none of the eight women in the comparison group developed significant
      mood symptoms during the withdrawal period.
    explanation: >-
      Blinded withdrawal of simulated pregnancy-level steroids reproduced mood
      symptoms only in women with a PPD history, isolating steroid withdrawal
      as the proximate trigger.
  - reference: PMID:10831472
    reference_title: Effects of gonadal steroids in women with a history of postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they suggest that women with a history of postpartum depression are
      differentially sensitive to mood-destabilizing effects of gonadal steroids
    explanation: >-
      Establishes differential steroid sensitivity, rather than an abnormal
      hormone concentration, as the susceptibility trait.
  downstream:
  - target: Failure of GABA-A Receptor Subunit Plasticity
    causal_link_type: DIRECT
    hypothesis_groups:
    - neurosteroid_withdrawal_model
    description: >-
      The fall in neurosteroid is what exposes any failure to re-adapt receptor
      stoichiometry: a receptor population tuned to the gestational milieu
      becomes mismatched the moment that milieu disappears.
  - target: Estrogen-Sensitive Epigenetic Reprogramming in Susceptible Women
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Estrogen-receptor-mediated transcriptional and DNA methylation changes in hippocampus.
    description: >-
      The same perinatal steroid excursion drives estrogen-responsive epigenetic
      reprogramming, which appears altered in women who go on to develop PPD.
- name: Failure of GABA-A Receptor Subunit Plasticity
  biological_scale: CELLULAR
  description: >-
    GABA-A receptors normally adapt to the pregnancy neurosteroid environment by
    downregulating delta and gamma2 subunits, then rebounding immediately
    postpartum as neurosteroid levels fall. Delta-subunit-containing
    extrasynaptic receptors mediate tonic inhibition and are the principal
    neurosteroid-sensitive population, while gamma2-containing synaptic
    receptors mediate phasic inhibition. Mice genetically unable to perform the
    delta-subunit adaptation develop depression-like and abnormal maternal
    behavior, identifying failed receptor plasticity — rather than the hormone
    change itself — as the pathogenic step.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  - preferred_term: hippocampal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  biological_processes:
  - preferred_term: regulation of postsynaptic membrane neurotransmitter receptor levels
    term:
      id: GO:0099072
      label: regulation of postsynaptic membrane neurotransmitter receptor levels
    modifier: ABNORMAL
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:18667149
    reference_title: "GABA(A)R plasticity during pregnancy: relevance to postpartum depression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show a significant decrease in tonic and phasic inhibitions in
      pregnant mice, mediated by a downregulation of GABA(A)R delta and gamma2
      subunits, respectively, which rebounds immediately postpartum.
    explanation: >-
      Demonstrates the physiological receptor-remodeling program across
      pregnancy and its postpartum rebound in a mouse model.
  - reference: PMID:18667149
    reference_title: "GABA(A)R plasticity during pregnancy: relevance to postpartum depression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice which do not exhibit GABA(A)R delta subunit regulation throughout
      pregnancy (Gabrd(+/-) and Gabrd(-/-)) exhibit depression-like and abnormal
      maternal behaviors, resulting in reduced pup survival.
    explanation: >-
      Genetic loss of delta-subunit plasticity is sufficient to produce a
      PPD-like behavioral phenotype, supporting causality of the plasticity
      failure.
  downstream:
  - target: Loss of GABAergic Inhibitory Tone
    causal_link_type: DIRECT
    hypothesis_groups:
    - neurosteroid_withdrawal_model
    description: >-
      Mismatched receptor subunit composition leaves inhibitory signaling
      inadequate for the abruptly neurosteroid-depleted postpartum brain.
- name: Loss of GABAergic Inhibitory Tone
  biological_scale: CELLULAR
  description: >-
    The net consequence of neurosteroid withdrawal against a maladapted receptor
    population is reduced tonic and phasic GABAergic inhibition in
    limbic circuits regulating mood and maternal behavior. This node is the
    convergent target of both approved mechanism-matched drugs, which restore
    positive allosteric modulation at synaptic and extrasynaptic GABA-A
    receptors. Its therapeutic reversibility is the strongest evidence that the
    node is causal rather than correlative.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: inhibitory postsynaptic potential
    term:
      id: GO:0060080
      label: inhibitory postsynaptic potential
    modifier: DECREASED
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:18667149
    reference_title: "GABA(A)R plasticity during pregnancy: relevance to postpartum depression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These abnormal postpartum behaviors were ameliorated in Gabrd(+/-) mice by
      a GABA(A)R delta-subunit-selective agonist, THIP.
    explanation: >-
      Pharmacological restoration of delta-subunit-mediated tonic inhibition
      rescues the PPD-like phenotype, establishing loss of inhibitory tone as
      the proximate and reversible lesion.
  - reference: PMID:30177236
    reference_title: "Brexanolone injection in post-partum depression: two multicentre, double-blind, randomised, placebo-controlled, phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed brexanolone injection (formerly SAGE-547 injection), a
      positive allosteric modulator of γ-aminobutyric-acid type A (GABAA)
      receptors, for the treatment of moderate to severe post-partum depression.
    explanation: >-
      Human phase 3 program built on restoring GABA-A positive allosteric
      modulation, translating the inhibitory-tone node into therapy.
  downstream:
  - target: Postpartum Major Depressive Episode
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - neurosteroid_withdrawal_model
    intermediate_mechanisms:
    - Limbic and corticolimbic circuit dysfunction consequent to reduced inhibitory tone.
    description: >-
      Reduced inhibitory control in mood-regulating circuits manifests as the
      depressive syndrome; restoring GABA-A modulation reverses it within days.
- name: Placental CRH Elevation
  biological_scale: ORGANISM
  description: >-
    The placenta secretes corticotropin-releasing hormone in exponentially
    rising quantities across gestation. Unlike hypothalamic CRH, placental CRH
    is upregulated rather than suppressed by cortisol, creating a feed-forward
    loop. Women whose mid-gestation pCRH rises fastest are at elevated risk of
    postpartum depressive symptoms — an association that holds after adjusting
    for prenatal depressive symptoms.
  biological_processes:
  - preferred_term: cellular response to corticotropin-releasing hormone stimulus
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: INCREASED
  evidence:
  - reference: PMID:19188538
    reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone in human pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth curve analyses indicated that the trajectories of pCRH in women
      with PPD symptoms are significantly accelerated from 23 to 26 weeks' GA.
    explanation: >-
      Identifies an accelerated mid-gestation pCRH trajectory, rather than a
      single elevated value, as the risk-marking feature.
  - reference: PMID:19188538
    reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone in human pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 25 weeks' GA, pCRH was a strong predictor of PPD symptoms
    explanation: >-
      Prospective cohort finding that mid-gestation placental CRH predicts
      postpartum depressive symptoms.
  downstream:
  - target: Postpartum HPA Axis Hyporesponsiveness
    causal_link_type: DIRECT
    hypothesis_groups:
    - hpa_axis_crh_model
    description: >-
      Sustained placental CRH suppresses maternal hypothalamic CRH output; its
      abrupt removal at delivery leaves the axis transiently unable to respond.
- name: Postpartum HPA Axis Hyporesponsiveness
  biological_scale: ORGANISM
  description: >-
    Placental delivery abruptly removes the dominant CRH source, leaving a
    transiently hyporesponsive hypothalamic-pituitary-adrenal axis while
    suppressed hypothalamic CRH output recovers. Notably the risk signal in
    human data attaches to placental CRH and is not mirrored by cortisol or
    ACTH, which constrains this arm to a placental rather than adrenal locus.
  biological_processes:
  - preferred_term: cellular response to corticotropin-releasing hormone stimulus
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:19188538
    reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone in human pregnancy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No significant associations were found for cortisol and ACTH.
    explanation: >-
      Constrains the mechanism to a placental CRH signal rather than generalized
      adrenal HPA overactivity, and limits how far the HPA model can be extended.
  downstream:
  - target: Postpartum Major Depressive Episode
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - hpa_axis_crh_model
    description: >-
      The intermediates linking an accelerated pCRH trajectory to depressive
      symptom onset are not established in humans; the association is
      predictive rather than mechanistically resolved.
- name: Estrogen-Sensitive Epigenetic Reprogramming in Susceptible Women
  biological_scale: MOLECULAR
  description: >-
    Susceptibility to PPD appears to reside partly in how a woman's genome
    responds epigenetically to the perinatal estrogen excursion, rather than in
    the size of the excursion itself. Antenatal blood DNA methylation at
    estrogen-responsive loci — identified by cross-referencing human prospective
    profiles with hippocampal methylation changes induced by 17-beta-estradiol
    in mice — discriminates women who will develop PPD, with HP1BP3 and TTC9B
    as the two replicated biomarker loci. This provides a molecular correlate
    for the differential steroid sensitivity demonstrated experimentally.
  cell_types:
  - preferred_term: hippocampal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  biological_processes:
  - preferred_term: cellular response to estrogen stimulus
    term:
      id: GO:0071391
      label: cellular response to estrogen stimulus
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23689534
    reference_title: Antenatal prediction of postpartum depression with blood DNA methylation biomarkers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA methylation associated with PPD risk correlated significantly with
      E2-induced DNA methylation change, suggesting an enhanced sensitivity to
      estrogen-based DNA methylation reprogramming exists in those at risk for
      PPD
    explanation: >-
      Cross-species design linking altered estrogen-driven epigenetic
      reprogramming to PPD risk, giving a molecular basis for differential
      hormone sensitivity.
  - reference: PMID:23689534
    reference_title: Antenatal prediction of postpartum depression with blood DNA methylation biomarkers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two biomarker loci at the HP1BP3 and TTC9B genes that
      predicted PPD with an area under the receiver operator characteristic
      (ROC) curve (area under the curve (AUC)) of 0.87 in antenatally euthymic
      women
    explanation: >-
      Identifies the specific replicated loci and quantifies antenatal
      predictive performance in euthymic women.
  downstream:
  - target: Postpartum Major Depressive Episode
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epigenetic sensitivity is a susceptibility modifier; the pathway from
      methylation state to symptom onset is not resolved.
- name: Postpartum Major Depressive Episode
  biological_scale: ORGANISM
  description: >-
    The convergent clinical endpoint: a major depressive episode with peripartum
    onset, comprising depressed mood, anhedonia, sleep and appetite disturbance,
    impaired concentration, anxiety, and in severe cases suicidal ideation.
    Beyond the mother, the episode disrupts maternal-infant bonding and is
    associated with adverse infant cognitive and behavioral outcomes. Rapid
    reversibility with neuroactive-steroid therapy — meaningful separation from
    placebo by day 3 — distinguishes the syndrome pharmacodynamically from
    non-puerperal major depression treated with monoaminergic agents.
  biological_processes:
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:34190962
    reference_title: "Effect of Zuranolone vs Placebo in Postpartum Depression: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postpartum depression (PPD) is one of the most common medical
      complications during and after pregnancy, negatively affecting both mother
      and child.
    explanation: >-
      Frames the clinical endpoint and its two-generation impact.
  - reference: PMID:34190962
    reference_title: "Effect of Zuranolone vs Placebo in Postpartum Depression: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sustained differences in HAMD-17 scores favoring zuranolone were observed
      from day 3
    explanation: >-
      Documents onset of benefit by day 3, the rapid pharmacodynamic signature
      of neurosteroid replacement in this syndrome.
phenotypes:
- category: Clinical

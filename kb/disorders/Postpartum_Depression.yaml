name: Postpartum Depression
creation_date: '2026-08-02T12:00:00Z'
category: Psychiatric
synonyms:
- postnatal depression
- PPD
- depressive episode with postpartum onset
- major depressive episode with peripartum onset
description: >-
  Postpartum depression (PPD) is a major depressive episode with onset during
  pregnancy or in the weeks to months following delivery. It is the most common
  medical complication of childbirth, affecting roughly one in eight women in
  high-income settings and substantially more in low- and middle-income
  countries, and it carries consequences for the mother, the mother-infant
  relationship, and infant cognitive and behavioral development. PPD is
  distinguished from other major depressive episodes by a reproductive-endocrine
  trigger: the supraphysiologic gonadal steroid levels of late pregnancy fall
  precipitously at parturition, and in a susceptible subgroup of women this
  withdrawal of progesterone-derived neurosteroids — chiefly allopregnanolone,
  a positive allosteric modulator of GABA-A receptors — precipitates depression.
  This mechanism is unusually well validated for a psychiatric disorder, because
  it has been tested experimentally by hormone withdrawal in humans, modeled
  genetically in mice, and exploited therapeutically: brexanolone and zuranolone,
  both neuroactive-steroid GABA-A positive allosteric modulators, were developed
  directly from it. Zuranolone, taken orally for 14 days, is the surviving
  mechanism-matched treatment; brexanolone, the intravenous forerunner that
  proved the principle, was withdrawn from the market in April 2025 for
  commercial rather than efficacy reasons. Hypothalamic-pituitary-adrenal axis
  dysregulation, inflammatory signaling, and heritable differences in
  estrogen-driven epigenetic reprogramming contribute additional risk.

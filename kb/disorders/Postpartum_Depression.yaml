environmental:
- name: Prior history of postpartum depression
  description: >-
    A previous postpartum depressive episode is among the strongest predictors
    of recurrence and identifies the hormone-sensitive subgroup that responds to
    experimental steroid withdrawal with mood symptoms.
  evidence:
  - reference: PMID:10831472
    reference_title: Effects of gonadal steroids in women with a history of postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five of the eight women with a history of postpartum depression (62.5%)
      and none of the eight women in the comparison group developed significant
      mood symptoms during the withdrawal period.
    explanation: >-
      Prior PPD history marks differential steroid sensitivity, which is the
      trait conferring risk on re-exposure.
- name: Low- and middle-income country setting
  description: >-
    Perinatal depression prevalence is significantly higher in low- and
    middle-income countries than in high-income countries, reflecting
    socioeconomic stressors, reduced social support, and limited access to
    perinatal mental health services.
  evidence:
  - reference: PMID:28531848
    reference_title: A systematic review and meta-regression of the prevalence and incidence of perinatal depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      prevalence was significantly higher in women from low and middle income
      countries compared to women from high income countries (OR 1.8, 95% CI
      1.4-2.2)
    explanation: >-
      Meta-regression quantifying the income-setting gradient in perinatal
      depression prevalence.
treatments:
- name: Brexanolone
  description: >-
    Brexanolone is an intravenous formulation of allopregnanolone, the
    progesterone-derived neurosteroid whose postpartum withdrawal is the
    proposed trigger of PPD. Administered as a single 60-hour continuous
    infusion, it acts as a positive allosteric modulator of synaptic and
    extrasynaptic GABA-A receptors, directly replacing the withdrawn endogenous
    modulator. It was the first drug approved specifically for postpartum
    depression (FDA 2019) and remains the archetypal mechanism-matched therapy
    in this entry — the trial evidence below is what established the
    neurosteroid-replacement principle that zuranolone now delivers orally.

    WITHDRAWN FROM MARKET: brexanolone is no longer commercially available.
    Sage Therapeutics notified FDA that the product was no longer marketed and
    requested withdrawal; FDA withdrew approval of NDA 211371 as of
    2025-04-14. The 60-hour monitored intravenous infusion, the REMS
    requirement arising from a boxed warning for excessive sedation and sudden
    loss of consciousness, and the drug's cost are the widely cited practical
    reasons the product did not survive commercially. It is retained in this
    entry because its trial data remain the primary human evidence for the
    causal role of the inhibitory-tone node, not because it is a current
    treatment option.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: brexanolone
      term:
        id: CHEBI:50169
        label: brexanolone
  target_mechanisms:
  - target: Loss of GABAergic Inhibitory Tone
    treatment_effect: RESTORES
    description: >-
      Intravenous allopregnanolone restores positive allosteric modulation at
      synaptic and extrasynaptic GABA-A receptors, replacing the neurosteroid
      tone lost at parturition.
  evidence:
  - reference: PMID:28619476
    reference_title: "Brexanolone (SAGE-547 injection) in post-partum depression: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 60 h, mean reduction in HAM-D total score from baseline was 21·0 points
      (SE 2·9) in the brexanolone group compared with 8·8 points (SE 2·8) in the
      placebo group
    explanation: >-
      Phase 2 randomised placebo-controlled trial establishing efficacy of
      allopregnanolone replacement in severe PPD.
  - reference: PMID:30177236
    reference_title: "Brexanolone injection in post-partum depression: two multicentre, double-blind, randomised, placebo-controlled, phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In study 1, at 60 h, the least-squares (LS) mean reduction in HAM-D total
      score from baseline was 19·5 points (SE 1·2) in the BRX60 group and 17·7
      points (1·2) in the BRX90 group compared with 14·0 points (1·1) in the
      placebo group
    explanation: >-
      Two phase 3 trials confirming benefit over placebo across moderate and
      severe PPD, supporting the mechanism-matched treatment rationale.
  - reference: url:https://www.govinfo.gov/content/pkg/FR-2025-03-14/html/2025-04101.htm
    reference_title: "Sage Therapeutics, Inc.; Withdrawal of Approval of a New Drug Application for ZULRESSO (Brexanolone) Solution, 100 Milligrams/20 Milliliters"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, approval of NDA 211371, and all amendments and supplements
      thereto, is hereby withdrawn as of April 14, 2025.
    explanation: >-
      Federal Register notice (FDA, Docket FDA-2024-N-5852) recording formal
      withdrawal of brexanolone's marketing approval. Regulatory status, not a
      study result, hence evidence_source OTHER.
  - reference: url:https://www.govinfo.gov/content/pkg/FR-2025-03-14/html/2025-04101.htm
    reference_title: "Sage Therapeutics, Inc.; Withdrawal of Approval of a New Drug Application for ZULRESSO (Brexanolone) Solution, 100 Milligrams/20 Milliliters"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sage notified the Agency in writing that the drug product was no longer
      marketed and requested that the approval of the application be withdrawn.
    explanation: >-
      Establishes that withdrawal was a commercial decision by the sponsor, not
      an efficacy or safety revocation by FDA — the distinction matters for
      interpreting the trial evidence above, which stands unaffected.
- name: Zuranolone
  description: >-
    Zuranolone is an orally bioavailable neuroactive steroid and positive
    allosteric modulator of synaptic and extrasynaptic GABA-A receptors, given
    as a once-daily 14-day course. It applies the same neurosteroid-replacement
    logic as brexanolone without requiring a 60-hour monitored intravenous
    infusion, and separates from placebo by day 3.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

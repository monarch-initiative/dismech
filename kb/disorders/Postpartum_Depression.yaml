- name: Geographic and socioeconomic variation
  description: >-
    PPD prevalence varies several-fold by region and national income level, with
    the lowest rates in developed and high-income countries and the highest in
    Southern Africa. Study size and country development level are the dominant
    sources of between-study heterogeneity, and measurement method matters:
    symptom scales yield significantly higher estimates than diagnostic
    instruments.
  evidence:
  - reference: PMID:34671011
    reference_title: Mapping global prevalence of depression among postpartum women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

diagnosis:
- name: Perinatal depression screening
  description: >-
    PPD is diagnosed clinically against DSM-5 major depressive episode criteria
    with the peripartum-onset specifier; there is no PPD-specific diagnostic
    algorithm. Case detection therefore rests on screening instruments — the
    Edinburgh Postnatal Depression Scale, a 10-item perinatal-specific
    self-report measure that also captures anxiety items, and the PHQ-9, both
    validated in this population. Screening policy diverges internationally:
    US bodies recommend universal formal screening, whereas UK NICE guidance
    favours the two Whooley questions with EPDS as an adjunct rather than
    universal scale-based screening.
  diagnosis_term:
    preferred_term: perinatal depression screening and diagnostic assessment
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:19188538
    reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone in human pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms of PPD were assessed at a mean (SD) of 8.7 (2.94) weeks after
      delivery with the Edinburgh Postnatal Depression Scale.
    explanation: >-
      Documents use of the EPDS as the standard instrument for ascertaining
      postpartum depressive symptoms in research cohorts.
  - reference: PMID:34190962
    reference_title: "Effect of Zuranolone vs Placebo in Postpartum Depression: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with PPD (major depressive episode beginning third trimester or ≤4 weeks
      postdelivery), and baseline 17-item Hamilton Rating Scale for Depression
      (HAMD-17) score of 26 or higher
    explanation: >-
      Shows the operational case definition used in registrational trials: a
      major depressive episode with third-trimester or early-postpartum onset,
      severity-graded by HAMD-17.
discussions:
- discussion_id: ppd_hormone_concentration_null_findings
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Precipitous Postpartum Neurosteroid Withdrawal
  prompt: >-
    If PPD is caused by perinatal reproductive hormone change, why do many
    studies fail to find any difference in hormone concentrations between women
    who develop PPD and those who do not?
  rationale: >-
    The withdrawal model is not a claim about hormone levels but about
    differential sensitivity to a hormone change that all postpartum women
    experience. Correlational studies comparing absolute concentrations are
    therefore underpowered to detect the mechanism by construction, and their
    null results have repeatedly been misread as refuting the model. Resolving
    this requires sensitivity-stratified rather than concentration-stratified
    designs — the logic of the experimental withdrawal paradigm and of the
    estrogen-responsive methylation biomarker work.
  evidence:
  - reference: PMID:25263255
    reference_title: The role of reproductive hormones in postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although a number of human and nonhuman animal studies support the role of
      reproductive hormones in PPD, several studies have failed to detect an
      association between hormone concentrations and PPD.
    explanation: >-
      States the discrepancy directly: mechanistic support coexists with null
      concentration-association findings.
  - reference: PMID:25263255
    reference_title: The role of reproductive hormones in postpartum depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reproductive hormones influence virtually every biological system
      implicated in PPD, and a subgroup of women seem to be particularly
      sensitive to the effects of perinatal changes in hormone levels.
    explanation: >-
      Articulates the hormone-sensitive-subgroup resolution that reconciles the
      positive mechanistic and null correlational literatures.
- discussion_id: ppd_gabrd_mouse_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of GABA-A Receptor Subunit Plasticity
  prompt: >-
    Does the Gabrd mouse model's failed GABA-A delta-subunit plasticity
    correspond to a demonstrable receptor-remodeling defect in women with
    postpartum depression?
  rationale: >-
    The subunit-plasticity step is the mechanistic core of the canonical model,
    yet the direct evidence for it is entirely murine: delta and gamma2
    downregulation across pregnancy with postpartum rebound, and a depression-like
    phenotype in Gabrd heterozygotes and nulls. Human support is indirect,
    inferred from the therapeutic efficacy of GABA-A positive allosteric
    modulators, which would also be expected if the receptor population were
    normal and only the ligand were withdrawn. Distinguishing failed receptor
    plasticity from simple ligand withdrawal matters because it determines
    whether PPD susceptibility is a receptor trait or a steroid-metabolism trait,
    and hence whether prophylaxis should target receptor adaptation or
    neurosteroid maintenance.
  proposed_experiments:
  - experiment_id: exp_ppd_human_gabaa_subunit_trajectory
    name: Human GABA-A delta/gamma2 subunit trajectory across pregnancy and postpartum
    description: >-
      Quantify GABA-A delta- and gamma2-subunit expression or availability across
      late pregnancy and the early postpartum in women with and without
      postpartum depression, using PET ligands sensitive to receptor subtype
      availability and, where obtainable, postmortem or biopsy tissue. The mouse
      model predicts downregulation across pregnancy with immediate postpartum
      rebound; failure of that rebound in affected women would establish the
      plasticity step in humans.
  - experiment_id: exp_ppd_gabrd_variant_treatment_response
    name: GABRD variant stratification of neuroactive-steroid treatment response
    description: >-
      Test whether GABRD variants stratify response to brexanolone or zuranolone
      in the completed phase 2/3 trial cohorts. If failed delta-subunit
      plasticity is the human lesion, GABRD genotype should modify the magnitude
      of response to delta-subunit-active neuroactive steroids; if the lesion is
      purely ligand withdrawal, it should not.
  evidence:
  - reference: PMID:18667149
    reference_title: "GABA(A)R plasticity during pregnancy: relevance to postpartum depression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We suggest that Gabrd(+/-) and Gabrd(-/-) mice constitute a mouse model of
      postpartum depression that may be useful for evaluating potential
      therapeutic interventions.
    explanation: >-
      The authors present the plasticity-failure evidence explicitly as a mouse
      model, leaving human correspondence to be established.
notes: >-
  Curated in response to the obstetric coverage gap documented in
  monarch-initiative/dismech#7837, which identified postpartum depression as the
  most tractable missing obstetric entry: an existing MONDO anchor, a
  well-defined mechanism, and two approved mechanism-matched drugs.

  Terminology note: HP:0100602 (Preeclampsia) and several other pregnancy-related
  HPO terms sit outside the HP:0000118 phenotypic-abnormality root used by the
  PhenotypeTerm enum, as documented in #7837. This entry is unaffected because
  its phenotypes are general depressive-symptom terms that sit under Behavioral
  abnormality; the peripartum context is carried by the disease term rather than
  by phenotype qualifiers.

  The GABA-A receptor subunit-plasticity step is supported by mouse genetics
  rather than human tissue data; this is recorded as a HUMAN_MODEL_MISMATCH
  discussion rather than left implicit, since it is the one link in the
  canonical chain without direct human evidence.

  Deep research: a `claude_code` provider run was performed via
  `just research-disorder claude_code Postpartum_Depression`
  (research/Postpartum_Depression-deep-research-claude_code.md; 22 web searches,
  58 citations, 298 s). It corroborated the neurosteroid-withdrawal chain and
  the HPA/placental-CRH arm as curated, and surfaced one material correction:
  brexanolone had been withdrawn from the market, which this entry had not
  reflected. That lead was verified independently against the Federal Register
  notice before being curated, per the rule that DR outputs are leads rather
  than ground truth. Findings from the run NOT yet curated, and left as future
  work rather than added without verification: the postpartum inflammatory arm
  (IL-6/hs-CRP as predictors, kynurenine-pathway and NLRP3 activation), the
  limbic-prefrontal imaging signature (notably blunted rather than hyperreactive
  amygdala response, reported as distinguishing PPD from non-perinatal MDD), and
  oxytocin-signaling involvement.

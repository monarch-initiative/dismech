    snippet: >-
      Postpartum depression (PPD) is a common perinatal complication with
      adverse maternal and infant outcomes.
    explanation: >-
      Confirms the depressive syndrome as the defining clinical presentation
      of the disorder.
- category: Clinical
  name: Anhedonia

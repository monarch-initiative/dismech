name: Hypomyelinating Leukodystrophy 9
creation_date: "2026-10-28T00:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 9 (HLD9) is an autosomal recessive
  hypomyelinating leukodystrophy caused by biallelic variants in RARS1, which
  encodes cytoplasmic arginyl-tRNA synthetase (ArgRS), the enzyme that charges
  tRNA-Arg and a subunit of the multi-tRNA synthetase complex (MSC). The
  classic presentation resembles Pelizaeus-Merzbacher disease, with onset in
  the first year, nystagmus, spasticity and developmental delay on a background
  of diffuse supratentorial hypomyelination. A multinational series of 20
  patients widened the spectrum to three overlapping grades: a severe form with
  onset in the first three months, usually refractory epilepsy and early brain
  atrophy (a developmental and epileptic encephalopathy, sometimes with a
  simplified gyral pattern and microcephaly); an intermediate form that is the
  classic hypomyelinating picture; and a mild form with later onset and
  preserved independent walking, including one patient with transient
  nystagmus and clumsiness at age 3 whose cognitive concerns and progressive
  leg spasticity began only in the fourth and fifth decades. Genotype tracks severity: the recurrent c.5A>G
  p.(Asp2Gly) allele gives mild or intermediate disease, whereas truncating,
  start-loss and active-site variants give severe disease. Fibroblasts from
  patients show reduced ArgRS protein, reduced MSC and reduced ArgRS activity,
  and some alleles act through selective loss of the long, MSC-anchoring ArgRS
  isoform. A homozygous start-loss allele, c.2T>C, recurs in Iranian families.
  No disease-modifying treatment is reported.

      explanation: The authors' stated prediction linking the two observations.
- name: Impaired Oligodendroglial Differentiation
  description: >-
    Failure of oligodendroglial cells to complete morphological
    differentiation. Stable FBD-102b clones carrying ArgRS p.Ser456Leu did not
    form the myelin web-like structures that parental cells formed after
    differentiation was induced. This is the only direct evidence for an
    oligodendrocyte-lineage defect in HLD9, and it comes from one variant in a
    mouse cell line. Whether hypomyelination is primarily oligodendroglial or
    secondary to neuronal dysfunction is an open question.
  biological_scale: CELLULAR
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"

pathophysiology:
- name: Biallelic RARS1 Variants
  description: >-
    Biallelic germline variants in RARS1 (missense, start-codon loss,
    frameshift and splice variants) reduce the function of cytoplasmic
    arginyl-tRNA synthetase. The variants act through different proximate
    routes, so this node branches: some destabilize the protein, some impair
    catalysis directly, some abolish or reduce translation of the long isoform,
    and one missense allele (p.Ser456Leu) causes the protein to aggregate in
    lysosomes in cell models.
  biological_scale: MOLECULAR
  role: trigger
  genetic_context:
    gene:
      preferred_term: RARS1
      term:
        id: hgnc:9870
        label: RARS1
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: arginine-tRNA ligase activity
    term:
      id: GO:0004814
      label: arginine-tRNA ligase activity
    modifier: DECREASED
  evidence:

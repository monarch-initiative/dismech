- name: Neuronal Involvement in Severe Disease
  description: >-
    Severely affected patients resemble early-onset grey matter disorders more
    than primary leukodystrophies, with refractory epilepsy and early cerebral
    atrophy, which Mendes et al. read as signs of neuronal involvement. Whether
    this reflects primary neuronal dysfunction, and whether the hypomyelination
    in these patients is secondary to it, is unresolved. Five of the 20 patients
    in the multinational series had died at 21-42 months, all with onset before
    3 months.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, patients with the severe phenotype resemble early‐onset grey matter disorders rather than primary leukodystrophies: they have severe epilepsy and early‐onset (severe) cerebral atrophy, both hallmarks of neuronal disorders."
    explanation: The clinical basis for proposing neuronal involvement in severe disease.
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of reporting five patients, all with disease onset before the age of 3 months, were deceased (aged 21–42 months)."
    explanation: Early childhood deaths occurred only in the severe, early-onset group.
  downstream:
  - target: Seizure
    description: >-
      Inferred: epilepsy is one of the two signs Mendes et al. cite as a
      hallmark of neuronal disease.
  - target: Epileptic Encephalopathy
    description: Inferred, as for seizures.
  - target: Cerebral Atrophy
    description: >-
      Inferred: early cerebral atrophy is the other sign cited as a hallmark of
      neuronal disease, and it tracked with severe presentation.
    evidence:
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nine patients demonstrated some degree of early brain atrophy; this corresponded with severe clinical presentation."
      explanation: Early atrophy is concentrated in the severe group.
  - target: Cerebellar Atrophy
    description: Inferred; seen in one severely affected patient.
  - target: Absent Speech
    description: >-
      Inferred: absent speech was more common in patients with epilepsy, the
      group proposed to have neuronal involvement.
    evidence:
    - reference: PMID:37186453
      reference_title: RARS1-related developmental and epileptic encephalopathy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared to patients without epilepsy, those with RARS1‐related epilepsy were more likely to have microcephaly, cerebral atrophy, and speech absence, but less likely to be able to walk independently"
      explanation: Association between the epileptic (severe) form and absent speech.
  - target: Intellectual Disability
    description: Inferred; not tested in HLD9.
  - target: Feeding Difficulties
    description: >-
      Inferred: feeding difficulties were recorded in the severe group of the
      20-patient series and not in the intermediate or mild groups.
  - target: Infantile Spasms
    description: Inferred; one severely affected patient presented with spasms.
- name: Disordered Cortical Development
  description: >-
    Abnormal development of the cerebral cortex in the severe form, shown as
    microcephaly with a simplified gyral pattern (a malformation of cortical
    development). Wan et al. found that 13 of 29 published patients had a
    developmental and epileptic encephalopathy together with malformation of
    cortical development.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:37186453
    reference_title: RARS1-related developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides its effects on the white matter, this mutation also influences cortical development."
    explanation: Authors' conclusion that RARS1 variants affect cortical development.
  - reference: PMID:37186453
    reference_title: RARS1-related developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 29 patients, intellectual disability, developmental delay, and hypomyelination were the common symptoms, while 13 of them exhibited DEE and malformations of cortical development."
    explanation: Pooled count of patients with malformation of cortical development.
  downstream:
  - target: Simplified Gyral Pattern
    description: The simplified gyral pattern is the imaging form of the cortical malformation.
  - target: Microcephaly
    description: >-
      Inferred: Wan et al. link microcephaly with a simplified gyral pattern to
      impaired neurogenesis, citing general literature rather than RARS1 data.

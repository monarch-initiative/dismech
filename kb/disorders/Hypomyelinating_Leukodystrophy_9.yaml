- name: Deficient CNS Myelin Deposition
  description: >-
    Permanent deficit of myelin in the central nervous system
    (hypomyelination), seen on MRI as T2-hyperintense supratentorial white
    matter with corresponding T1 hypointensity. Even the youngest patients
    showed deficient myelination. Mildly affected patients can have relatively
    preserved myelination.

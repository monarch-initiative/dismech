  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ArgRS activity was significantly decreased in fibroblasts of P1, P3, and P5 compared to controls (Fig. 3A). P5, with a severe phenotype, had the lowest enzyme activity of the three patients."
    explanation: Measured reduction of ArgRS activity in patient fibroblasts.
  downstream:
  - target: Impaired Protein Synthesis Capacity
    description: >-
      Less charged tRNA-Arg limits protein synthesis. The supporting experiment
      is indirect: patient fibroblasts proliferated poorly when arginine was
      limited, which the authors read as inefficient protein synthesis.
    evidence:
    - reference: PMID:28905880
      reference_title: Mutations in RARS cause a hypomyelination disorder akin to Pelizaeus-Merzbacher disease.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts cultured in medium with limited arginine at 30 °C and 40 °C, showed a significant decrease in fibroblast proliferation (P<0.001) compared to control cells, suggestive of inefficiency of protein synthesis in the patient cells."
      explanation: >-
        Reduced proliferation under arginine limitation is the readout; protein
        synthesis itself was not measured.
- name: Impaired Protein Synthesis Capacity
  description: >-
    Reduced capacity for cytoplasmic protein synthesis. This has been shown
    only indirectly, in patient fibroblasts, and has not been measured in
    oligodendrocytes or neurons. Mendes et al. also raise, as a hypothesis, that
    defective ArgRS might impair arginylation-dependent protein degradation in
    addition to protein synthesis.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cytoplasmic translation
    term:
      id: GO:0002181
      label: cytoplasmic translation
    modifier: DECREASED
  cell_types:

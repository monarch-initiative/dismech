    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in RARS1, encoding the cytoplasmic tRNA synthetase for arginine (ArgRS), cause a hypomyelinating leukodystrophy."
    explanation: Establishes biallelic RARS1 variants as the cause of the disease.
  - reference: PMID:24777941
    reference_title: Mutations in RARS cause hypomyelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RARS encodes the cytoplasmic arginyl-tRNA synthetase, an enzyme essential for RNA translation."
    explanation: Identifies the gene product and its role in translation.
  downstream:
  - target: Reduced ArgRS Protein Stability
    causal_link_type: DIRECT
    description: >-
      Several missense alleles (p.Asp2Val, p.Arg461His, p.Arg512Gln) lower the
      steady-state level of ArgRS by speeding its degradation.
    evidence:
    - reference: PMID:37186453
      reference_title: RARS1-related developmental and epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All the mutated ArgRS proteins degraded at a significantly higher rate compared with the wild‐type protein (Figure 4), indicating that these mutations decrease ArgRS stability."
      explanation: >-
        Cycloheximide-chase experiment in transfected 293T cells showing that
        the variants cause faster ArgRS degradation.
  - target: Reduced Translation of the Long ArgRS Isoform
    causal_link_type: DIRECT
    description: >-
      Start-codon variants and the c.5A>G allele reduce or abolish translation
      of the long ArgRS isoform, leaving mainly the short isoform.
    evidence:
    - reference: PMID:33515434
      reference_title: Distinct pathogenic mechanisms of various RARS1 mutations in Pelizaeus-Merzbacher-like disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The nucleotide substitution c.5A>G reduced translation of hArgRS mRNA, and an upstream open reading frame contributed to the suppressed translation of the downstream main ORF."
      explanation: Shows the most common variant acts by reducing translation of the long-isoform reading frame.
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "For example, in several families the start codon was affected, resulting in (almost) absent translation of the long isoform (as demonstrated in P4, Fig. 3)."
      explanation: >-
        Western blot of patient fibroblasts showing loss of the long isoform
        with a start-codon variant.
  - target: Reduced Arginyl-tRNA Aminoacylation
    causal_link_type: DIRECT
    description: >-
      Active-site and C-terminal truncating variants impair the structure and
      catalytic function of ArgRS.
    evidence:
    - reference: PMID:33515434
      reference_title: Distinct pathogenic mechanisms of various RARS1 mutations in Pelizaeus-Merzbacher-like disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we showed the detrimental effects of R512Q substitution and ΔC mutations on the structure and function of hArgRS, while the most frequent mutation c.5A>G, p.D2G acted in a different manner without impairing hArgRS activity."
      explanation: >-
        Biochemical study separating variants that impair catalysis (R512Q,
        C-terminal truncation) from c.5A>G, which does not.
  - target: Mutant ArgRS Lysosomal Aggregation
    causal_link_type: DIRECT
    description: >-
      The p.Ser456Leu missense variant makes ArgRS form aggregates that
      localize to lysosomes when expressed in cultured cells.
    evidence:
    - reference: PMID:31737794
      reference_title: Hypomyelinating leukodystrophy-associated mutation of RARS leads it to the lysosome, inhibiting oligodendroglial morphological differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Herein we show that HLD9-associated missense mutation of Ser456-to-Leu (S456L) localizes RARS proteins as aggregates into the lysosome but not into the endoplasmic reticulum (ER) and the Golgi body."
      explanation: Directly shows the variant causing lysosomal aggregation of ArgRS.
- name: Reduced ArgRS Protein Stability
  description: >-
    Mutant ArgRS is less stable and is present at lower levels. In patient
    fibroblasts studied by Nafisinia et al., RARS protein was reduced by about
    80%. In transfected cells, the p.Asp2Val, p.Arg461His and p.Arg512Gln
    variants lowered ArgRS protein without lowering its mRNA.
  biological_scale: MOLECULAR
  gene_products:
  - preferred_term: arginine--tRNA ligase, cytoplasmic
  evidence:
  - reference: PMID:37186453
    reference_title: RARS1-related developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ArgRS protein expression and stability were substantially reduced in the two newly identified patients."
    explanation: Reduced ArgRS protein expression and stability for both patients' variants.
  - reference: PMID:28905880
    reference_title: Mutations in RARS cause a hypomyelination disorder akin to Pelizaeus-Merzbacher disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein levels of RARS and the multi-tRNA synthetase complex into which it assembles were found to be significantly reduced by 80 and 90% by western blotting and Blue native-PAGE respectively using patient fibroblast extracts."
    explanation: Reduced RARS protein in patient fibroblasts.
  downstream:
  - target: Reduced Multi-tRNA Synthetase Complex
    description: >-
      Inferred: with less ArgRS available, less of it assembles into the MSC.
      The source measured both reductions in the same fibroblasts but did not
      test the causal order.
  - target: Reduced Arginyl-tRNA Aminoacylation
    description: >-
      Inferred: less enzyme protein means less charging capacity. Wan et al.
      state this link as an interpretation, not a measurement.
- name: Reduced Translation of the Long ArgRS Isoform
  description: >-
    ArgRS is made as a long isoform, which carries a 72-residue N-terminal
    extension and is incorporated into the multi-tRNA synthetase complex, and a
    short isoform that stays free in the cytosol. Start-codon variants and
    c.5A>G reduce the long isoform. Patient P4 in Mendes et al., with a
    start-codon variant, had mainly the short isoform and normal ArgRS activity
    in fibroblasts, yet severe disease.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ArgRS activity was significantly reduced in three patients with intermediate and severe phenotypes; in a fourth patient with intermediate to severe presentation, we measured normal ArgRS activity, but found translation mainly of the short instead of the long ArgRS isoform."
    explanation: >-
      The fourth patient separates loss of the long isoform from loss of
      catalytic activity.
  downstream:
  - target: Reduced Multi-tRNA Synthetase Complex
    description: Only the long isoform enters the MSC, so losing it reduces MSC-bound ArgRS.
    evidence:
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "As a consequence, normal ArgRS activity in vitro does not necessarily reflect aminoacylation in vivo, for which the long isoform is needed to form the multisynthetase complex."
      explanation: >-
        States that the long isoform is needed to form the MSC; the link to
        reduced MSC in this patient is the authors' interpretation.
- name: Reduced Multi-tRNA Synthetase Complex
  description: >-
    The amount of assembled multi-tRNA synthetase complex is reduced. In
    patient fibroblasts it was reduced by about 90% on Blue native-PAGE.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: aminoacyl-tRNA synthetase multienzyme complex
    term:
      id: GO:0017101
      label: aminoacyl-tRNA synthetase multienzyme complex
    modifier: DECREASED
  evidence:
  - reference: PMID:28905880
    reference_title: Mutations in RARS cause a hypomyelination disorder akin to Pelizaeus-Merzbacher disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein levels of RARS and the multi-tRNA synthetase complex into which it assembles were found to be significantly reduced by 80 and 90% by western blotting and Blue native-PAGE respectively using patient fibroblast extracts."
    explanation: Reduced MSC in patient fibroblasts.
  downstream:
  - target: Impaired Protein Synthesis Capacity
    description: >-
      Inferred: the MSC delivers charged tRNAs for translation, and its loss is
      expected to reduce translation capacity. Wolf et al. describe the MSC as
      a key player in myelination, without testing this step.
- name: Reduced Arginyl-tRNA Aminoacylation
  description: >-
    Reduced charging of tRNA-Arg with arginine. ArgRS activity was
    significantly reduced in fibroblasts from three of four patients tested,
    lowest in the most severely affected one; the fourth had normal activity
    (see the long-isoform node).
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: arginyl-tRNA aminoacylation
    term:
      id: GO:0006420

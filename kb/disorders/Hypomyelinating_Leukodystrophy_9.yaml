    involvement in single patients.
- name: Hypomyelination with Brainstem and Spinal Cord Involvement and Leg Spasticity (DARS1)
  description: >-
    DARS1-related hypomyelination; spinal cord involvement, typical of DARS1
    disease, has been reported in one RARS1 patient.
- name: Pelizaeus-Merzbacher Disease (PLP1)
  description: >-
    The prototypic X-linked hypomyelinating leukodystrophy, which the classic
    HLD9 presentation resembles.
- name: Pelizaeus-Merzbacher-Like Disease (GJC2)
  description: Autosomal recessive PMD-like hypomyelination caused by GJC2 variants.
- name: RARS2-Related Pontocerebellar Hypoplasia Type 6
  description: >-
    Caused by the mitochondrial arginyl-tRNA synthetase gene RARS2, not RARS1;
    the gene names are easily confused.

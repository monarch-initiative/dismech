genetic:
- name: RARS1
  gene_term:
    preferred_term: RARS1
    term:
      id: hgnc:9870
      label: RARS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    RARS1 (previously RARS) encodes cytoplasmic arginyl-tRNA synthetase. One
    transcript gives a long isoform, which enters the multi-tRNA synthetase
    complex, and a short cytosolic isoform translated from an alternative start
    codon. The 2024 review tallied 66 alleles in 33 patients: 37 missense, 14
    start loss, 7 splicing and 7 frameshift. No ClinGen gene-disease validity
    record for RARS1 is cached, so none is recorded.
  evidence:
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent RARS1 variant, c.5A>G, led to mild or intermediate phenotypes, whereas truncating variants and variants affecting amino acids close to the ArgRS active centre led to severe phenotypes."
    explanation: Genotype-phenotype relationship across the 20-patient series.
  - reference: PMID:38618971
    reference_title: "RARS1-related hypomyelinating leukodystrophy-9 (HLD-9) in two distinct Iranian families: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 66 variants in these 33 patients, missense was the major type with a frequency of 37, followed by start loss ... splicing ... and frameshift"
    explanation: Variant-class distribution across published patients.
  variants:
  - name: RARS1 c.5A>G p.(Asp2Gly)
    description: >-
      The most frequent variant (7 of 20 patients in the multinational series).
      It alters the N-terminal extension found only in the long isoform and
      reduces translation of the long isoform without impairing catalytic
      activity. Homozygotes have mild disease and compound heterozygotes mild or
      intermediate disease; no carrier has had the severe early-infantile form.
    evidence:
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant was identified in seven of the 20 patients (one homozygous, six compound heterozygous)"
      explanation: Recurrence of c.5A>G in the series.
    - reference: PMID:33515434
      reference_title: Distinct pathogenic mechanisms of various RARS1 mutations in Pelizaeus-Merzbacher-like disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The nucleotide substitution c.5A>G reduced translation of hArgRS mRNA, and an upstream open reading frame contributed to the suppressed translation of the downstream main ORF."
      explanation: Mechanism of this variant.
  - name: RARS1 c.2T>C p.(Met1?)
    description: >-
      Start-loss variant found homozygous in several Iranian families,
      including two consanguineous Bakhtiari families and six cases of an
      Iranian leukodystrophy cohort, where the authors suggest a possible
      founder effect. Homozygotes have severe disease.
    evidence:
    - reference: PMID:40594583
      reference_title: Overview of genetic variants in a cohort of Iranian patients with leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In brief, the current study shows high prevalence of a certain RARS1 variant among Iranian patients with leukodystrophy, possibly due a founder effect."
      explanation: Recurrence of c.2T>C in an Iranian cohort and the founder-effect suggestion.
    - reference: PMID:30791064
      reference_title: "Hypomyelinating Leukodystrophy with Spinal Cord Involvement Caused by a Novel Variant in RARS: Report of Two Unrelated Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing (WES) in both patients identified a homozygous (c.2T > C) variant in exon one of RARS gene, encoding cytoplasmic arginyl-tRNA synthetase."
      explanation: First report of the homozygous c.2T>C variant.
  - name: RARS1 p.Arg512Gln and p.Arg512Trp
    description: >-
      Missense changes at Arg512, close to the active centre, in three
      unrelated families, all with severe disease. p.Arg512Gln impairs ArgRS
      structure and function and lowers its stability.
    evidence:
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Arginine at position 512, located close to the active center (Fig. 3), was affected in three unrelated families, all presenting with severe disease."
      explanation: Genotype-phenotype data for Arg512.
  - name: RARS1 c.1367C>T p.(Ser456Leu)
    description: >-
      Catalytic-domain missense variant, compound heterozygous with a de novo
      frameshift in a patient reported by Nafisinia et al. In cell models the
      mutant protein aggregates in lysosomes and blocks oligodendroglial
      differentiation.
    evidence:
    - reference: PMID:28905880
      reference_title: Mutations in RARS cause a hypomyelination disorder akin to Pelizaeus-Merzbacher disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequent screening of a PMD cohort without a genetic diagnosis identified an unrelated individual with novel compound heterozygous variants including a missense variant c. ... p.(Ser456Leu) and a de novo deletion c. ... p.(Tyr616Leufs*6)."
      explanation: Identifies the variant and its partner allele.
    - reference: PMID:31737794
      reference_title: Hypomyelinating leukodystrophy-associated mutation of RARS leads it to the lysosome, inhibiting oligodendroglial morphological differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Herein we show that HLD9-associated missense mutation of Ser456-to-Leu (S456L) localizes RARS proteins as aggregates into the lysosome but not into the endoplasmic reticulum (ER) and the Golgi body."
      explanation: Cell-model consequence of the variant.
  - name: RARS1 c.5A>T p.(Asp2Val) and c.1382G>A p.(Arg461His)
    description: >-
      Variants reported by Wan et al.; with p.Arg512Gln they lowered ArgRS
      protein levels and stability in transfected cells. A homozygous p.Asp2Val
      patient had a severe developmental and epileptic encephalopathy, unlike
      carriers of p.Asp2Gly at the same residue.
    evidence:
    - reference: PMID:37186453
      reference_title: RARS1-related developmental and epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, the variants c.5A>T (p.Asp2Val), c.1382G>A (p.Arg461His), and c.1535G>A (p.Arg512Gln) are pathogenic and affect the expression of ArgRS by reducing the protein stability."
      explanation: Functional data on these variants.
experimental_models:
- name: FBD-102b oligodendroglial cells expressing RARS1 S456L
  experimental_model_type: CELL_LINE
  description: >-
    Mouse oligodendroglial FBD-102b cells (and COS-7 cells) transfected with
    GFP-tagged human ArgRS carrying p.Ser456Leu, including stable clones
    induced to differentiate.
  publication: PMID:31737794
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Mutant ArgRS Lysosomal Aggregation
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Reproduces lysosomal aggregation of the mutant protein in an oligodendroglial line.
    limitations: >-
      Overexpression of a tagged mutant on a wild-type background in a mouse
      cell line; it does not model biallelic loss of endogenous ArgRS, and
      aggregation has not been shown in patient cells.
    evidence:
    - reference: PMID:31737794
      reference_title: Hypomyelinating leukodystrophy-associated mutation of RARS leads it to the lysosome, inhibiting oligodendroglial morphological differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Similar localization of mutant RARS proteins in the lysosome was observed in oligodendroglial FBD-102b cells"
      explanation: Establishes the model as informative for the aggregation node.
  - target: Impaired Oligodendroglial Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Stable mutant clones fail to form myelin web-like structures on differentiation.
    limitations: >-
      Morphological differentiation of a cell line is a proxy for myelination;
      no myelin was formed or measured, and only one variant was tested.
    readouts:
    - name: Myelin web-like structure formation on differentiation
      target: Impaired Oligodendroglial Differentiation
      direction: DECREASED
      interpretation: Cellular correlate of the differentiation block.
      evidence:
      - reference: PMID:31737794
        reference_title: Hypomyelinating leukodystrophy-associated mutation of RARS leads it to the lysosome, inhibiting oligodendroglial morphological differentiation.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "As expected, cells harboring mutant constructs failed to exhibit differentiated phenotypes with myelin web-like structures along oligodendroglial cell-like processes whereas parental cells exhibited them"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:31737794
      reference_title: Hypomyelinating leukodystrophy-associated mutation of RARS leads it to the lysosome, inhibiting oligodendroglial morphological differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cells harboring the S456L mutant constructs fail to exhibit phenotypes with myelin web-like structures following differentiation in FBD-102b cells, as part of the mammalian oligodendroglial cell model, whereas parental cells exhibit them."
      explanation: Establishes the model as informative for the differentiation node.
- name: Patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured fibroblasts from patients, used to measure RARS protein, MSC
    assembly, ArgRS activity, isoform expression and growth under arginine
    limitation.
  publication: PMID:28905880
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Reduced Multi-tRNA Synthetase Complex
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: RARS protein and MSC measured directly in patient cells.
    limitations: Fibroblasts are not neural cells and do not myelinate.
    evidence:
    - reference: PMID:28905880
      reference_title: Mutations in RARS cause a hypomyelination disorder akin to Pelizaeus-Merzbacher disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Protein levels of RARS and the multi-tRNA synthetase complex into which it assembles were found to be significantly reduced by 80 and 90% by western blotting and Blue native-PAGE respectively using patient fibroblast extracts."
      explanation: Direct measurement in patient fibroblasts.
  - target: Reduced Arginyl-tRNA Aminoacylation
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: ArgRS activity measured by stable-isotope LC-MS/MS in fibroblasts of four patients.
    limitations: >-
      In vitro activity may not reflect MSC-dependent aminoacylation in vivo;
      a patient with severe disease had normal fibroblast activity.
    evidence:
    - reference: PMID:31814314
      reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ArgRS activity was significantly decreased in fibroblasts of P1, P3, and P5 compared to controls (Fig. 3A). P5, with a severe phenotype, had the lowest enzyme activity of the three patients."
      explanation: Activity measured in patient fibroblasts.

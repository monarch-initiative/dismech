    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts cultured in medium with limited arginine at 30 °C and 40 °C, showed a significant decrease in fibroblast proliferation (P<0.001) compared to control cells, suggestive of inefficiency of protein synthesis in the patient cells."
    explanation: >-
      The only direct cellular test of translation capacity in HLD9, and it is
      a proliferation readout in fibroblasts.
  downstream:
  - target: Impaired Oligodendroglial Differentiation
    description: >-
      Inferred, not tested: reduced translation capacity is proposed to limit
      the large protein output needed for oligodendrocyte maturation and myelin
      synthesis. No study has measured translation or differentiation in
      RARS1-deficient oligodendrocytes.
    evidence:
    - reference: PMID:38618971
      reference_title: "RARS1-related hypomyelinating leukodystrophy-9 (HLD-9) in two distinct Iranian families: Case report and literature review."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "The pathogenic variants in the RARS1 gene (MIM#107820), like the majority of these genes, lead to a lack of myelin structural protein synthesis."
      explanation: >-
        Introduction of a case report stating the proposed link between RARS1
        variants and deficient myelin protein synthesis, citing other work
        rather than showing it.
  - target: Neuronal Involvement in Severe Disease
    description: >-
      Inferred: Mendes et al. ask whether more severely reduced ArgRS activity
      also affects neurons. The link from reduced protein synthesis to neuronal
      dysfunction is a hypothesis, not a measurement.
  - target: Disordered Cortical Development
    description: >-
      Inferred: Wan et al. propose that RARS1 deficiency affects cortical
      development as well as white matter. The mechanism linking it to reduced
      translation has not been studied.
- name: Mutant ArgRS Lysosomal Aggregation
  description: >-
    GFP-tagged ArgRS carrying p.Ser456Leu, overexpressed in COS-7 cells and in
    the mouse oligodendroglial cell line FBD-102b, formed aggregates that
    co-localized with the lysosomal marker LAMP1 in about a quarter of cells,
    whereas wild-type protein was cytoplasmic. This has not been shown in
    patient cells.

diagnosis:
- name: Brain MRI Pattern Recognition
  description: >-
    MRI shows the hypomyelination pattern (supratentorial white matter T2
    hyperintensity with T1 hypointensity); severe cases add early cerebral
    atrophy and sometimes a simplified gyral pattern. MRI pattern recognition
    led to the original gene discovery.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  markers: diffuse supratentorial white matter T2 hyperintensity with T1 hypointensity
  evidence:
  - reference: PMID:24777941
    reference_title: Mutations in RARS cause hypomyelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using magnetic resonance imaging (MRI) pattern recognition and whole exome sequencing, we could ascertain compound heterozygous mutations in RARS in 4 patients with hypomyelination."
    explanation: MRI pattern recognition followed by exome sequencing established the diagnosis.
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Throughout the cohort, T2‐weighted images demonstrated supratentorial white matter hyperintensity with corresponding T1 hypointensity, in keeping with myelin deficit."
    explanation: The characteristic MRI finding.
- name: RARS1 Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by finding biallelic RARS1 variants by exome
    sequencing or a leukodystrophy gene panel that includes RARS1. Wan et al.
    recommend testing RARS1 in an infant with seizures and MRI suggesting
    hypomyelinating leukodystrophy.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  markers: biallelic RARS1 pathogenic variants
  evidence:
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RARS1 variants were identified locally by clinical next generation sequencing techniques (either WES or WES with a filter for leukodystrophy genes, which included RARS1, a known disease gene)"
    explanation: Exome sequencing, with or without a leukodystrophy gene filter, identified the variants.
  - reference: PMID:37186453
    reference_title: RARS1-related developmental and epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When a child experiences seizures during infancy and HLD is suspected based on MRI, it is necessary to consider testing for the RARS1 gene as the patient may develop DEE in the future."
    explanation: Clinical indication for RARS1 testing.
- name: ArgRS Activity and Isoform Analysis in Fibroblasts
  description: >-
    Research-level functional testing: ArgRS aminoacylation activity in
    cultured fibroblasts measured by LC-MS/MS, and western blot for the long
    and short isoforms. Normal activity does not exclude disease, because
    start-loss alleles can leave active short isoform. No NCIT term for an
    enzyme activity assay was found (OLS searches "enzyme activity assay" and
    "enzyme assay" in NCIT returned only ELISA-unit and immunoassay terms), so
    diagnosis_term is omitted.
  evidence:
  - reference: PMID:31814314
    reference_title: "RARS1-related hypomyelinating leukodystrophy: Expanding the spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a consequence, normal ArgRS activity in vitro does not necessarily reflect aminoacylation in vivo, for which the long isoform is needed to form the multisynthetase complex."
    explanation: The limitation of fibroblast activity testing.
discussions:
- discussion_id: hld9_primary_cell_type
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Oligodendroglial Differentiation
  - pathophysiology#Neuronal Involvement in Severe Disease
  prompt: >-
    Is the hypomyelination of HLD9 caused by a primary defect in
    oligodendrocytes, or is it secondary to neuronal dysfunction, and does the
    degree of ArgRS loss decide which cells are affected?
  rationale: >-
    Mendes et al. pose these questions explicitly. The only oligodendrocyte
    evidence is one overexpressed variant in a mouse cell line, while severe
    patients look like grey matter disorders. No study has measured ArgRS
    function, translation or differentiation in RARS1-deficient
    oligodendrocytes or neurons.
- discussion_id: hld9_no_in_vivo_model
  kind: KNOWLEDGE_GAP
  attaches_to:
  - experimental_models#
  prompt: >-
    Is there a peer-reviewed animal model of RARS1-related hypomyelination?
  rationale: >-
    The mechanistic data come from patient fibroblasts, transfected cell lines
    and recombinant protein. No peer-reviewed animal or human iPSC-derived
    model of HLD9 hypomyelination was found by the deep-research run.
- discussion_id: hld9_no_disease_modifying_treatment
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: Is there any disease-modifying treatment for HLD9?
  rationale: >-
    Only symptomatic seizure treatment is reported, and it usually fails.
    Mendes et al. write that the disease pathways need to be understood before
    treatment approaches can be designed.
notes: >-
  The entry name follows the dismech convention of the other
  Hypomyelinating_Leukodystrophy entries; the MONDO label "leukodystrophy,
  hypomyelinating, 9" is used in disease_term and kept as a synonym. No
  GeneReviews chapter names this disease (just check-genereviews --online,
  snapshot 2026-09-10).

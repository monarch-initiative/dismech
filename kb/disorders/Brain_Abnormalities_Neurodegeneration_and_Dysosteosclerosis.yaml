        progressive leukoencephalopathy.

- name: Osteoclast Deficiency and Impaired Bone Resorption
  biological_scale: CELLULAR
  description: >
    Osteoclasts differentiate from the CSF1R-dependent monocyte/macrophage
    lineage, and CSF1-CSF1R signalling is required for their generation and
    survival. Reduced CSF1R signalling therefore reduces osteoclastic bone
    resorption, so bone formed during modelling is not removed. The result is
    increased bone mineral density with failure of metaphyseal remodelling -
    the mechanistic basis of the sclerosing bone dysplasia. In the Csf1rko rat,
    transfer of wild-type bone marrow restores osteoclasts and eliminates the
    osteopetrosis, demonstrating that the bone phenotype is cell-autonomous to
    the marrow-derived lineage.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
    modifier: DECREASED
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: DECREASED
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: DECREASED
  - preferred_term: bone remodeling
    term:
      id: GO:0046849
      label: bone remodeling
    modifier: DECREASED
  evidence:
  - reference: PMID:33749994
    reference_title: "Further expanding the mutational spectrum of brain abnormalities, neurodegeneration, and dysosteosclerosis: A rare disorder with neurologic regression and skeletal features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colony stimulating factor 1 receptor (CSF1R, MIM# 164770) encodes a tyrosine-kinase receptor playing an important role in development of osteoclasts and microglia."
    explanation: >
      States the osteoclast-development role of CSF1R that makes osteoclast
      failure the expected consequence of biallelic loss of function.
  - reference: PMID:34081701
    reference_title: "CSF1R-dependent macrophages control postnatal somatic growth and organ maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WT BM transfer restored osteoclasts, eliminated osteopetrosis, restored bone marrow cellularity and architecture and reversed granulocytosis and B cell deficiency."
    explanation: >
      Rescue experiment in the Csf1rko rat establishes that osteoclast
      deficiency is the proximate cause of the osteopetrotic bone phenotype and
      that it is intrinsic to bone-marrow-derived cells.
  downstream:
  - target: Sclerosing Skeletal Dysplasia of the Dysosteosclerosis-Pyle Spectrum
    causal_link_type: DIRECT
    description: >
      Failure of osteoclastic resorption yields the increased bone density and
      abnormal metaphyseal modelling that define the skeletal phenotype.
    evidence:
    - reference: PMID:30982609
      reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results characterized a unique human skeletal phenotype caused by CSF1R deficiency and implied that bi-allelic CSF1R mutations cause a spectrum of neurological and skeletal disorders, probably depending on the residual CSF1R function."
      explanation: >
        Attributes the human skeletal phenotype directly to CSF1R deficiency
        and grades it by residual receptor function.

- name: Sclerosing Skeletal Dysplasia of the Dysosteosclerosis-Pyle Spectrum
  biological_scale: ORGANISM
  description: >
    The skeletal component of BANDDOS spans a spectrum: at the sclerotic end,
    osteopetrosis and dysosteosclerosis with generalised increased bone
    density; at the modelling-defect end, Pyle-disease-like metaphyseal
    widening with Erlenmeyer flask deformity of the long bones. Skeletal
    involvement is present in most but not all cases, is variable even between
    siblings carrying the same genotype, and may be entirely absent in
    individuals with hypomorphic missense alleles ("incomplete BANDDOS").
  biological_processes:

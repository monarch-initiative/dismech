genetic:
- name: CSF1R
  gene_term:
    preferred_term: CSF1R
    term:
      id: hgnc:2433
      label: CSF1R
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >
      BANDDOS is caused by biallelic CSF1R variants. Most reported patients are
      homozygous and born to consanguineous parents; heterozygous relatives are
      typically asymptomatic, at least until the age at which CSF1R-ALSP would
      declare itself.
    evidence:
    - reference: PMID:22934315
      reference_title: "CSF1R-Related Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Early-onset CSF1R-related disorder is typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner"
      explanation: >
        GeneReviews states the autosomal recessive inheritance of the
        early-onset, biallelic form of CSF1R-related disorder.
    - reference: PMID:37349768
      reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most cases (n = 17/19) were born of consanguineous parents and carried homozygous mutations (n = 17/19), whereas only two were compound heterozygotes born of unrelated parents."
      explanation: >
        Documents the homozygous/consanguineous genetic architecture of the
        reported BANDDOS cohort.
    - reference: PMID:32464672
      reference_title: "A Novel Hypomorphic CSF1R Gene Mutation in the Biallelic State Leading to Fatal Childhood Neurodegeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterozygous family members, including both parents, were asymptomatic, with the eldest being 68 years of age."
      explanation: >
        Demonstrates that carriers of a single hypomorphic CSF1R allele can
        remain asymptomatic into old age, consistent with recessive
        inheritance for this phenotype.
  notes: >
    Reported BANDDOS variants cluster in or disrupt the tyrosine kinase domain
    (amino acids 582-910). Splice, nonsense, and deep-intronic variants
    predominate; two of the originally described alleles were deep intronic and
    caused abnormal inclusion of intron sequence in the mRNA. No variant has
    yet been reported to occur in both BANDDOS and CSF1R-ALSP.
  evidence:
  - reference: PMID:30982609
    reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report seven affected individuals from three unrelated families who had bi-allelic CSF1R mutations. In addition to early-onset HDLS-like neurological disorders, they had brain malformations and skeletal dysplasia compatible to dysosteosclerosis (DOS) or Pyle disease."
    explanation: >
      The defining report establishing biallelic CSF1R variants as the cause of
      the combined brain malformation and skeletal dysplasia phenotype.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 11 CSF1R mutations, including splicing (n = 3), missense (n = 3), nonsense (n = 2), and intronic (n = 2) variants and one inframe deletion."
    explanation: >
      Summarises the mutational spectrum reported in BANDDOS.
  - reference: PMID:30982609
    reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of them were deep intronic mutations resulting in abnormal inclusion of intron sequences in the mRNA."
    explanation: >
      Documents the deep-intronic splice-disrupting mechanism, which is
      important because such variants are missed by exome-only analysis.
  - reference: PMID:33749994
    reference_title: "Further expanding the mutational spectrum of brain abnormalities, neurodegeneration, and dysosteosclerosis: A rare disorder with neurologic regression and skeletal features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this clinical report, we describe three siblings with variable skeletal findings along with neurological symptoms ranging from mild to severe in whom exome sequencing revealed a novel homozygous splice site variant in canonical splice donor site of intron 21 adjacent to an exon, which encoding part of kinase domain of CSF1R along with a review of the literature."
    explanation: >
      An independent family expanding the splice-variant spectrum and
      demonstrating intrafamilial phenotypic variability.
  - reference: PMID:37431483
    reference_title: "Homozygous mutation in CSF1R causes brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous variant was identified in the gene CSF1R, c.2498C>T; p.T833M in exon 19, in the index patient and the fetus."
    explanation: >
      An independent consanguineous family homozygous for the p.T833M kinase-domain
      variant, in which the variant was also detected prenatally in a fetus.
  - reference: PMID:37431483
    reference_title: "Homozygous mutation in CSF1R causes brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS)."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The variant is located within the functionally essential PTK domain of the receptor. However, no structural damage was introduced by this substitution."
    explanation: >
      In silico analysis places p.T833M in the protein tyrosine kinase domain
      without predicted structural disruption - consistent with the independent
      in vitro finding that the same allele is hypomorphic (normal protein
      level, impaired autophosphorylation) rather than null.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The extent of skeletal involvement may depend on CSF1R gene dosage with marked osteosclerosis reported in patients carrying two amorphic"
    explanation: >
      Supports the dose-dependent genotype-phenotype model in which residual
      CSF1R activity, not the variant class alone, grades skeletal severity.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    BANDDOS segregates as an autosomal recessive trait; the parents of an
    affected individual are presumed heterozygous carriers and each sib has a
    25% recurrence risk.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial CSF1R pathogenic variants."
    explanation: >
      GeneReviews states the recurrence risk that follows from autosomal
      recessive inheritance of biallelic CSF1R disease.

animal_models:
- name: Csf1r knockout rat (Csf1rko)
  species: Rat
  genotype: Csf1r homozygous knockout
  publication: PMID:33450391
  description: >
    Homozygous Csf1r knockout rats lack essentially all tissue macrophage
    populations including microglia, develop osteopetrosis, and fail to thrive
    postnatally. The model reproduces the myeloid and skeletal arms of human
    biallelic CSF1R disease, and wild-type bone marrow transfer at weaning
    rescues the phenotype - but the brain phenotype is much milder than in
    humans, which is a substantive translational caveat.
  modeled_mechanisms:
  - target: Microglial Deficiency in the Developing Brain
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Csf1rko rats lose the entire microglial transcriptomic signature across
      every brain region examined.
    limitations: >
      The rat models the cellular deficiency faithfully but not its human
      developmental consequences (see the FAILS_TO_RECAPITULATE link below).
    readouts:
    - name: Microglial marker gene expression across brain regions
      target: Microglial Deficiency in the Developing Brain
      direction: DECREASED
      interpretation: >
        Transcriptomic confirmation that the microglial population is absent
        throughout the Csf1rko brain.
      evidence:
      - reference: PMID:33450391
        reference_title: "Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for understanding microglial function in brain development and the impacts of human CSF1R mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "RNA-seq profiling revealed a set of 105 microglial markers depleted in all brain regions of the Csf1rko rats."
        explanation: >
          Quantifies the depletion of the microglial signature in every brain
          region of the knockout.
    evidence:
    - reference: PMID:33450391
      reference_title: "Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for understanding microglial function in brain development and the impacts of human CSF1R mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA-seq profiling revealed a set of 105 microglial markers depleted in all brain regions of the Csf1rko rats."
      explanation: >
        Establishes the model as informative for the microglial-deficiency
        node.
  - target: Disrupted Brain Development and Structural Malformation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      Unlike humans with biallelic CSF1R variants, Csf1rko rats do not develop
      the congenital brain malformations (callosal agenesis, Dandy-Walker
      complex, cortical malformation) that define BANDDOS; brain development is
      largely normal without microglia.
    limitations: >
      Species differences in the developmental role of microglia mean the rat
      cannot be used to model, or to test therapies against, the congenital
      malformation arm of BANDDOS. The authors go further and conclude that
      CSF1R haploinsufficiency alone is unlikely to cause leukoencephalopathy,
      which is at odds with the human monoallelic disorder.
    readouts:
    - name: Region-specific neuronal and glial transcript clusters
      target: Disrupted Brain Development and Structural Malformation
      direction: UNCHANGED
      interpretation: >
        Absence of microglia leaves neuronal, oligodendrocyte, and astrocyte
        expression programmes essentially intact in the rat.
      evidence:
      - reference: PMID:33450391
        reference_title: "Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for understanding microglial function in brain development and the impacts of human CSF1R mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Other than the microglial signature, Csf1rko had no effect on any neuronal or region-specific transcript cluster."
        explanation: >
          A negative result: no detectable effect of microglial loss on
          neuronal or regional gene expression in the rat brain.
    evidence:
    - reference: PMID:33450391
      reference_title: "Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for understanding microglial function in brain development and the impacts of human CSF1R mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that most brain developmental processes occur normally in the absence of microglia and that CSF1R haploinsufficiency is unlikely to cause leukoencephalopathy."
      explanation: >
        The authors' own conclusion that brain development proceeds normally
        without microglia in the rat, which directly contradicts the human
        BANDDOS malformation phenotype and substantiates the failure to
        recapitulate.
  - target: Osteoclast Deficiency and Impaired Bone Resorption
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Csf1rko rats develop osteopetrosis that is reversed by wild-type bone
      marrow transfer, establishing the osteoclast-deficiency mechanism.
    limitations: >
      The rat osteopetrosis is more severe than the dysosteosclerosis-Pyle
      spectrum seen in humans, consistent with the human alleles being
      hypomorphic rather than null.
    readouts:
    - name: Osteoclast restoration and reversal of osteopetrosis after bone marrow transfer
      target: Osteoclast Deficiency and Impaired Bone Resorption
      direction: RESTORED
      interpretation: >
        Restoring CSF1R-competent marrow-derived cells restores osteoclasts and
        eliminates the sclerotic bone phenotype.
      evidence:
      - reference: PMID:34081701
        reference_title: "CSF1R-dependent macrophages control postnatal somatic growth and organ maturation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "WT BM transfer restored osteoclasts, eliminated osteopetrosis, restored bone marrow cellularity and architecture and reversed granulocytosis and B cell deficiency."
        explanation: >
          Rescue readout showing osteoclast restoration and resolution of
          osteopetrosis.
    evidence:
    - reference: PMID:34081701
      reference_title: "CSF1R-dependent macrophages control postnatal somatic growth and organ maturation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutation of the Csf1r locus (Csf1rko) in mice, rats and humans leads to multiple postnatal developmental abnormalities."
      explanation: >
        Establishes the rat Csf1rko as the cross-species model of homozygous
        CSF1R mutation, the same lesion as in BANDDOS.
  evidence:
  - reference: PMID:39869647
    reference_title: "Wild-type bone marrow cells repopulate tissue resident macrophages and reverse the impacts of homozygous CSF1R mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies provide a model for the pathology and treatment of CSF1R mutations in humans and the innate immune deficiency associated with prematurity."
    explanation: >
      The authors position the Csf1rko rat explicitly as a model for human
      CSF1R-mutation pathology and its treatment.

- name: Csf1r-null mouse
  species: Mouse
  genotype: Csf1r homozygous null (Csf1r-/-)
  publication: PMID:34145972
  description: >
    The Csf1r-null mouse is the original and most extensively characterised
    CSF1R-deficiency system, and is the model the human BANDDOS phenotype was
    first compared against. It loses most tissue macrophages and osteoclasts and
    is osteopetrotic. Its central caveat for BANDDOS is severity and background
    dependence: the human phenotype is milder and more variable than the mouse
    null, which is the observation that led to the inference that at least one
    BANDDOS allele is always hypomorphic.
  modeled_mechanisms:
  - target: Osteoclast Deficiency and Impaired Bone Resorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Csf1r-null mice show the loss of osteoclasts and of bone remodelling that
      underlies the human skeletal phenotype.
    limitations: >
      The complete null is more severe than any reported human genotype, and
      phenotypic differences between Csf1-null and Csf1r-null mice are only
      revealed on defined inbred backgrounds, so strain background is a
      confounder when reading severity across studies.
    evidence:
    - reference: PMID:34145972
      reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Studies in homozygous Csf1r- and Csf1- null mice have shown that the CSF-1/CSF-1R pathway regulates the differentiation and maintenance of most tissue macrophages and osteoclasts, contributing to the development and remodeling of bones and soft tissues"
      explanation: >
        Establishes the mouse null as the system in which the macrophage and
        osteoclast requirement for CSF1R signalling was demonstrated.
  evidence:
  - reference: PMID:30982609
    reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with Csf1r-null mice, the skeletal and neural phenotypes of the affected individuals appeared milder and variable, suggesting that at least one of the mutations in each affected individual is hypomorphic."
    explanation: >
      The explicit human-versus-Csf1r-null comparison that both establishes the
      model's relevance and bounds its fidelity.
  notes: >
    Cited via the dedicated review of Csf1r-deficiency models rather than a
    single primary mouse paper, because the relevant claim (what the mouse null
    does and does not capture about human CSF1R disease) is a synthesis across
    that literature.

- name: csf1rDM zebrafish (csf1ra/csf1rb double mutant)
  species: Zebrafish
  genotype: csf1ra; csf1rb double mutant (csf1rDM)
  publication: PMID:30982608
  description: >
    Zebrafish lacking Csf1r function have brains devoid of microglia and
    reduced levels of the upper-layer neuronal transcription factor CUX1,
    paralleling the reduction of CUX1-positive neurons seen in human biallelic
    CSF1R brain tissue.
  modeled_mechanisms:
  - target: Microglial Deficiency in the Developing Brain
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      csf1rDM brains lack microglia, reproducing the defining cellular lesion.
    limitations: >
      Zebrafish brain architecture lacks a corpus callosum and the mammalian
      six-layered cortex, so the model cannot address the specific human
      malformations; the shared readout is the CUX1 reduction, not the
      malformation itself.
    readouts:
    - name: Brain CUX1 level
      target: Microglial Deficiency in the Developing Brain
      direction: DECREASED
      interpretation: >
        Reduced CUX1 in the microglia-less fish brain, matched by reduced
        CUX1-positive neurons in human biallelic CSF1R brain, identifies a
        conserved microglia-dependent neuronal readout.
      evidence:
      - reference: PMID:30982608
        reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We analyzed a zebrafish model (csf1rDM) lacking Csf1r function and found that their brains also lacked microglia and had reduced levels of CUX1, a neuronal transcription factor."
        explanation: >
          Reports both the microglial absence and the CUX1 reduction in the
          zebrafish model.
    evidence:
    - reference: PMID:30982608
      reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CUX1+ neurons were also reduced in sections of homozygous CSF1R mutant human brain, identifying an evolutionarily conserved role for CSF1R signaling in production or maintenance of CUX1+ neurons."
      explanation: >
        The cross-species concordance of the CUX1 readout is what makes the
        fish informative for the human microglial-deficiency node.

treatments:
- name: Multidisciplinary Supportive and Rehabilitative Care
  description: >
    There is no disease-modifying therapy of proven benefit in BANDDOS. Care is
    multidisciplinary and symptom-directed, spanning neurology,
    neuropsychological rehabilitation, physical, occupational and
    speech-language therapy, nutritional and swallowing support, and family
    support with genetic counselling. GeneReviews additionally advises caution
    with sedatives, antipsychotics, and other agents that reduce alertness in
    individuals who have gait problems and cognitive decline, because of fall
    risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Multidisciplinary care by specialists in neurology, psychotherapy, neuropsychological rehabilitation, physical therapy, occupational therapy, speech-language therapy, social services for family support, and genetic counseling."
    explanation: >
      GeneReviews sets out the multidisciplinary supportive management standard
      for CSF1R-related disorder, which includes the early-onset biallelic
      form.
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For individuals with gait problems and cognitive decline, sedatives, antipsychotics, and other medications that may decrease alertness and increase the risk of falling should be used cautiously."
    explanation: >
      GeneReviews Agents/Circumstances to Avoid guidance, recorded here as a
      drug-safety caution attached to supportive management.

- name: Allogeneic Hematopoietic Stem Cell Transplantation (investigational in BANDDOS)
  description: >
    HSCT replaces the CSF1R-deficient myeloid compartment with donor-derived
    cells and has become a disease-modifying option in adult-onset CSF1R-ALSP.
    It has NOT been demonstrated to benefit BANDDOS: the rationale is
    extrapolation from the shared genetic and neuropathological basis of the
    two disorders. Preclinical support comes from the Csf1rko rat, where
    wild-type bone marrow transfer restores tissue macrophages, eliminates
    osteopetrosis, and permits normal growth and long-term survival - although
    in that model the brain was the one organ where donor-derived
    microglia-like cells did not fully match resident microglia, and
    congenital malformations already present at birth would not be expected to
    reverse.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Microglial Deficiency in the Developing Brain
    treatment_effect: RESTORES
    description: >
      Donor-derived myeloid cells engraft the CNS and are intended to
      reconstitute the missing CSF1R-competent brain macrophage population.
    evidence:
    - reference: PMID:34081701
      reference_title: "CSF1R-dependent macrophages control postnatal somatic growth and organ maturation."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Transfer of WT bone marrow (BM) cells at weaning without conditioning repopulated resident macrophages in all organs, including microglia in the brain, and reversed the mutant phenotypes enabling long term survival and fertility."
      explanation: >
        Model-organism evidence that marrow transfer repopulates brain
        microglia and reverses the mutant phenotype; classified PARTIAL because
        this is a rat rescue experiment, not evidence of benefit in human
        BANDDOS.
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, both disorders are on the same continuum, albeit they differ in the severity of CSF1R mutations' consequences and phenotypes. This opens windows of opportunity for applying already available therapy in CSF1R-ALSP in BANDDOS."
    explanation: >
      The review proposes translating CSF1R-ALSP therapy to BANDDOS on the
      basis of shared pathomechanism; this is an argument for a trial, not
      evidence of efficacy, hence PARTIAL.
  - reference: PMID:39869647
    reference_title: "Wild-type bone marrow cells repopulate tissue resident macrophages and reverse the impacts of homozygous CSF1R mutation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The exception was the brain, where BM-derived microglia-like cells had a distinct expression profile compared to resident microglia."
    explanation: >
      Tempers the rescue rationale: donor-derived brain macrophages are not
      transcriptionally equivalent to resident microglia, so CNS correction may
      be incomplete.
  notes: >
    No published series reports HSCT outcomes in genetically confirmed BANDDOS.
    Any use is investigational and should be undertaken in a research setting.

- name: iPSC-Derived Microglia Replacement (preclinical)
  description: >
    A research-stage strategy that goes further than HSCT: transplanting human
    iPSC-derived microglial progenitors directly, rather than relying on
    marrow-derived cells to engraft the CNS. In a xenotolerant Csf1r-FIRE-enhancer
    mouse that develops nearly all the hallmark ALSP pathologies, transplanted
    iPSC-derived microglia restored a homeostatic microglial signature and
    prevented axonal spheroids, white matter abnormality, reactive astrocytosis,
    and brain calcification; CRISPR-corrected patient-derived microglia even
    reversed pre-existing spheroid, astrogliosis, and calcification pathology.
    This is preclinical and was done in an ALSP model, not a BANDDOS model, and
    it addresses the degenerative arm only - the congenital malformations of
    BANDDOS are established before birth.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: cellular therapy
    term:
      id: NCIT:C70601
      label: Cellular Therapy
  target_mechanisms:
  - target: Progressive White Matter Degeneration with Axonal Spheroids
    treatment_effect: INHIBITS
    description: >
      Restoring a CSF1R-competent microglial population prevents, and in
      established disease partially reverses, the white-matter degeneration,
      spheroids, gliosis, and calcification.
    evidence:
    - reference: PMID:38897209
      reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of human induced pluripotent stem cell (iPSC)-derived microglial (iMG) progenitors restores a homeostatic microglial signature and prevents the development of axonal spheroids, white matter abnormalities, reactive astrocytosis, and brain calcifications"
      explanation: >
        Direct evidence that microglial replacement prevents the degenerative
        white-matter pathology; PARTIAL because the model is an ALSP
        (heterozygous-equivalent) mouse, not a biallelic BANDDOS system.
  evidence:
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, transplantation of CRISPR-corrected ALSP-patient-derived iMG reverses pre-existing spheroids, astrogliosis, and calcification pathologies."
    explanation: >
      Shows reversal of established pathology, which is what would be required
      in an already-symptomatic patient; still preclinical and in an ALSP model.
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "our results demonstrate the utility of FIRE mice to model ALSP and provide compelling evidence that iMG transplantation could offer a promising new therapeutic strategy for ALSP and perhaps other microglia-associated neurological disorders"
    explanation: >
      The authors themselves extend the claim only as far as "perhaps other
      microglia-associated neurological disorders"; no BANDDOS-specific claim
      is made or asserted here.
  notes: >
    Preclinical only. No microglia-replacement trial exists in any CSF1R
    disorder, let alone in BANDDOS.

- name: Antiseizure Pharmacotherapy
  description: >
    Seizures occur in roughly half of patients and may be therapy-resistant,
    requiring standard antiseizure medication chosen for the seizure type.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38934054
    reference_title: "Leukoencephalopathy with calcifications, developmental brain abnormalities and skeletal dysplasia due to homozygosity for a hypomorphic CSF1R variant: A report of three siblings."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with developmental delay, therapy-resistant epilepsy, dysmorphic features, and skeletal abnormalities."
    explanation: >
      Documents that epilepsy in BANDDOS is a clinical management problem and
      is frequently refractory; classified PARTIAL because it establishes the
      indication rather than the efficacy of any specific agent.

- name: Genetic Counseling
  description: >
    Because BANDDOS is autosomal recessive and most families are consanguineous,
    counselling covers the 25% sib recurrence risk, carrier testing of
    relatives, and the availability of prenatal and preimplantation genetic
    testing once the familial variants are known.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the CSF1R pathogenic variant(s) have been identified in an affected family member, predictive testing for at-risk relatives and prenatal and preimplantation genetic testing for CSF1R-related disorder are possible."
    explanation: >
      GeneReviews establishes the availability of predictive, prenatal, and
      preimplantation testing once the familial variants are known.

diagnosis:
- name: Molecular Confirmation of Biallelic CSF1R Variants
  description: >
    The diagnosis is established by identifying biallelic pathogenic CSF1R
    variants in a proband with suggestive clinical and radiological findings.
    Because two of the originally described BANDDOS alleles were deep intronic
    and acted by abnormal intron inclusion, an exome-only strategy can miss the
    second allele; genome sequencing or targeted intronic analysis should be
    considered when only one variant is found in a phenotypically convincing
    case. Parental segregation should be confirmed.
  presence: Biallelic (homozygous or compound heterozygous) pathogenic CSF1R variants
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CSF1R-related disorder is established in a proband with suggestive findings and a heterozygous CSF1R pathogenic variant or biallelic CSF1R pathogenic variants identified by molecular genetic testing."
    explanation: >
      GeneReviews states the diagnostic criterion; the biallelic branch is the
      one that defines BANDDOS.
  - reference: PMID:30982609
    reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of them were deep intronic mutations resulting in abnormal inclusion of intron sequences in the mRNA."
    explanation: >
      Justifies the caveat that exome-only testing can miss a BANDDOS allele,
      since deep intronic variants are a recognised mechanism in this disorder.
  - reference: PMID:37431483
    reference_title: "Homozygous mutation in CSF1R causes brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted gene sequencing was performed on the genomic DNA samples of the deceased patient and a fetus along with ten healthy members of his family to identify the disease-causing mutation."
    explanation: >
      Illustrates the targeted-sequencing-plus-family-segregation approach used
      to establish the diagnosis in practice, including prenatal testing.

- name: Brain MRI
  description: >
    Brain MRI defines the white-matter abnormality (universal in BANDDOS) and
    the congenital malformations - callosal agenesis or hypogenesis,
    ventriculomegaly and colpocephaly, Dandy-Walker complex, and cortical
    abnormalities. It is the study that most clearly separates BANDDOS from
    adult-onset CSF1R-ALSP, in which congenital malformation is absent.
  presence: Abnormal in all reported cases
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain abnormalities were present in all cases (n = 19) on neuroimaging, including white matter changes (n = 19/19)"
    explanation: >
      Establishes neuroimaging as abnormal in 100% of reported cases, making it
      the highest-yield diagnostic study.

- name: Non-contrast Head CT for Intracranial Calcification
  description: >
    CT is more sensitive than MRI for the dystrophic periventricular and
    brainstem calcifications, which are present in most patients, are already
    present at birth, and share the stepping-stone appearance described in
    CSF1R-ALSP.
  presence: Calcification detected in most patients
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "calcifications (in 83% of BANDDOS vs. 75% with CSF1R-ALSP cases)"
    explanation: >
      Quantifies the diagnostic yield of looking for intracranial calcification
      in suspected BANDDOS.

- name: Skeletal Survey
  description: >
    Radiographic skeletal survey identifies the sclerosing bone dysplasia -
    increased bone density, craniofacial and vertebral sclerosis, and
    metaphyseal modelling abnormalities spanning the dysosteosclerosis to Pyle
    disease spectrum. A normal survey does not exclude the diagnosis, since
    about a quarter of reported patients had no skeletal involvement.
  presence: Abnormal in about three quarters of patients
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal abnormalities were observed in 76% of cases of BANDDOS."
    explanation: >
      Quantifies the diagnostic yield of skeletal survey and, by complement,
      the fraction of patients in whom it is normal.
  - reference: PMID:33749994
    reference_title: "Further expanding the mutational spectrum of brain abnormalities, neurodegeneration, and dysosteosclerosis: A rare disorder with neurologic regression and skeletal features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Described skeletal findings of the disease are highly variable ranging from absence of a skeletal phenotype and milder Pyle disease-like to osteopetrosis and DOS."
    explanation: >
      Supports the caveat that a normal skeletal survey does not exclude
      BANDDOS.

differential_diagnoses:
- name: CSF1R-related adult-onset leukoencephalopathy with axonal spheroids and pigmented glia (CSF1R-ALSP)
  description: >
    The monoallelic, autosomal dominant CSF1R disorder. It shares the
    leukoencephalopathy, calcifications, axonal spheroids, gliosis, and
    microglial deficiency, but presents in the fourth to sixth decade and lacks
    congenital brain malformation, skeletal dysplasia, and dysmorphic features.
  distinguishing_features:
  - Age at onset - adult (4th-6th decade) in CSF1R-ALSP versus perinatal or infantile in BANDDOS
  - Congenital brain malformations (callosal agenesis, Dandy-Walker complex, cortical malformation) occur in BANDDOS only
  - Sclerosing skeletal dysplasia and dysmorphic features occur in BANDDOS only
  - Biallelic CSF1R genotype in BANDDOS versus heterozygous in CSF1R-ALSP
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal deformities and dysmorphic features have not been reported in CSF1R-ALSP."
    explanation: >
      Names the skeletal and dysmorphic features as the discriminators absent
      from the adult-onset monoallelic disorder.
  - reference: PMID:38934054
    reference_title: "Leukoencephalopathy with calcifications, developmental brain abnormalities and skeletal dysplasia due to homozygosity for a hypomorphic CSF1R variant: A report of three siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary neurological decline occurs with a progressive leukoencephalopathy, in line with early onset ALSP."
    explanation: >
      Emphasises that the degenerative phase of BANDDOS is radiologically and
      clinically ALSP-like, which is precisely why the two must be
      distinguished genetically.

- name: Dysosteosclerosis due to SLC29A3 or TNFRSF11A variants
  description: >
    Dysosteosclerosis is genetically heterogeneous; biallelic SLC29A3 and
    TNFRSF11A variants cause radiologically similar sclerosing bone dysplasia
    without the CSF1R brain phenotype.
  distinguishing_features:
  - Absence of leukoencephalopathy and intracranial calcification
  - Absence of congenital brain malformation
  - Different causal gene (SLC29A3 or TNFRSF11A) on molecular testing
  evidence:
  - reference: PMID:33837634
    reference_title: "Resolution of sclerotic lesions of dysosteosclerosis due to biallelic SLC29A3 variant in a Turkish girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a genetically heterogeneous disorder caused by biallelic mutations in the SLC29A3, TNFRSF11A, TCIRG1, and CSF1R genes."
    explanation: >
      States the genetic heterogeneity of dysosteosclerosis directly: CSF1R is
      only one of at least four causal genes, so the radiological diagnosis
      does not settle the molecular one.
  - reference: PMID:33402699
    reference_title: "Expanding the phenotypic spectrum of TNFRSF11A-associated dysosteosclerosis: a case with intracranial extramedullary hematopoiesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNFRSF11A has been known as the causal gene for osteopetrosis, autosomal recessive 7, and is recently reported to cause DOS in three cases, which show a complex genotype-phenotype relationship."
    explanation: >
      Documents TNFRSF11A as an established non-CSF1R cause of
      dysosteosclerosis, confirming it as a genuine molecular differential.

- name: Nasu-Hakola disease (polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy, TREM2/TYROBP)
  description: >
    The most instructive mimic: another autosomal recessive microglial-signalling
    disorder that, like BANDDOS, combines a leukoencephalopathy with bone
    lesions. TREM2 and TYROBP (DAP12) act in the same microglial signalling
    network as CSF1R, which is why the two disorders converge phenotypically.
  distinguishing_features:
  - Bone lesions are polycystic and lytic (with pathological fractures), not sclerosing
  - Onset of the osseous stage in the third decade and dementia in the fourth, versus perinatal or infantile onset in most BANDDOS
  - Frontal lobe syndrome dominates the neurological presentation
  - Congenital brain malformation is not a feature
  - Biallelic TREM2 or TYROBP variants rather than biallelic CSF1R
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy (PLOSL) is characterized by fractures (resulting from radiologically demonstrable polycystic osseous lesions), frontal lobe syndrome, and progressive presenile dementia beginning in the fourth decade."
    explanation: >
      GeneReviews description establishing the lytic/polycystic bone phenotype
      and the fourth-decade dementia that distinguish PLOSL from BANDDOS.
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in TYROBP or TREM2 confirms the diagnosis since radiographic and clinical features may be inconclusive."
    explanation: >
      Confirms that molecular testing is what separates the two, and names the
      alternative causal genes.

discussions:
- discussion_id: banddos_rodent_brain_development_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Brain Development and Structural Malformation
  - animal_models#Csf1r knockout rat (Csf1rko)
  prompt: >
    Why do humans with biallelic CSF1R loss of function develop severe
    congenital brain malformations while Csf1r knockout rats, which lack
    microglia just as completely, undergo essentially normal brain development?
  rationale: >
    The rat Csf1rko removes the entire microglial population - the same
    cellular lesion documented at autopsy in BANDDOS - yet diffusion imaging
    and region-wise RNA-seq show only small fibre-tract reductions and no
    neuronal or regional transcriptomic change, and the authors conclude that
    most brain developmental processes occur normally without microglia. Human
    biallelic CSF1R brains instead show callosal agenesis, Dandy-Walker
    complex, heterotopia, and non-decussating pyramidal tracts. The same paper
    concludes that CSF1R haploinsufficiency is unlikely to cause
    leukoencephalopathy, which is directly at odds with the established human
    monoallelic CSF1R-ALSP disorder. Either microglia have human-specific
    developmental roles (the CUX1-positive upper-layer neuron route proposed
    from the zebrafish and human tissue work is one candidate), or the human
    phenotype depends on something other than microglial absence per se. Until
    this is resolved, rodent rescue data cannot be read as predicting that
    restoring myeloid cells will correct the malformation arm of BANDDOS.
  evidence:
  - reference: PMID:33450391
    reference_title: "Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for understanding microglial function in brain development and the impacts of human CSF1R mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that most brain developmental processes occur normally in the absence of microglia and that CSF1R haploinsufficiency is unlikely to cause leukoencephalopathy."
    explanation: >
      The rat conclusion that brain development proceeds normally without
      microglia is the model side of the mismatch.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem examination showed multiple brain anomalies, including an absence of corpus callosum, reduced volume of white matter, Dandy-Walker malformation, colpocephaly, numerous periventricular and brainstem calcifications, and heterotopia, abnormal gyration of hippocampi, and non-decussation of small pyramidal tracts"
    explanation: >
      The human side of the mismatch: a microglia-deficient human brain shows
      severe congenital malformation that the rodent model does not reproduce.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Here we review the genetics, penetrance, and histopathological features of these diseases and discuss to what extent the animal models of Csf1r deficiency currently available provide systems in which to study the underlying mechanisms involved."
    explanation: >
      The dedicated review of Csf1r-deficiency models frames the adequacy of
      available animal systems as an open question, which is exactly what this
      mismatch records.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain developmental deficits, e.g. callosal agenesis/hypogenesis, seem to follow a similar pattern, being present in all individuals carrying amorphic mutations and absent in those carrying bi-allelic hypomorphic mutations."
    explanation: >
      Offers a competing, allele-dose explanation for the discrepancy: the
      developmental malformations track residual CSF1R activity rather than
      microglial absence alone, which the rodent null cannot test.
  proposed_experiments:
  - experiment_id: exp_banddos_human_organoid_cux1_requirement
    name: Human cerebral organoid or xenotransplant model with biallelic CSF1R loss
    description: >
      Compare corpus callosum-relevant projection neuron specification
      (CUX1-positive upper-layer neurons) in human iPSC-derived cortical
      systems with and without CSF1R-competent microglia, using patient-derived
      biallelic CSF1R lines, to test whether the developmental requirement is
      human-specific.
  - experiment_id: exp_banddos_microglial_colonisation_timing
    name: Developmental staging of the rodent versus human microglial requirement
    description: >
      Determine whether the discrepancy reflects the timing of microglial
      colonisation relative to commissural axon guidance, by comparing
      microglial colonisation windows and callosal pathfinding in rat, zebrafish,
      and human fetal tissue.

- discussion_id: banddos_hsct_efficacy_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation (investigational in BANDDOS)
  prompt: >
    Does hematopoietic stem cell transplantation modify the course of BANDDOS,
    and is there a therapeutic window before the degenerative phase begins?
  rationale: >
    HSCT is now offered in CSF1R-ALSP, and the review literature explicitly
    proposes translating it to BANDDOS on the basis of a shared pathomechanism.
    But no outcome data exist in genetically confirmed BANDDOS. Two features of
    BANDDOS complicate the extrapolation: the congenital malformations are
    already established at birth and cannot plausibly be reversed by any
    myeloid replacement, and in the Csf1rko rat the brain was the one organ
    where donor-derived cells did not transcriptionally match resident
    microglia. A meaningful trial would therefore have to specify which arm of
    the disease it expects to modify.
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This opens windows of opportunity for applying already available therapy in CSF1R-ALSP in BANDDOS."
    explanation: >
      The review proposes translating CSF1R-ALSP therapy to BANDDOS, framing
      the gap as an untested opportunity rather than established practice.
  - reference: PMID:39869647
    reference_title: "Wild-type bone marrow cells repopulate tissue resident macrophages and reverse the impacts of homozygous CSF1R mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The exception was the brain, where BM-derived microglia-like cells had a distinct expression profile compared to resident microglia."
    explanation: >
      Identifies the specific reason CNS correction by marrow transfer may be
      incomplete, which is part of what makes the gap substantive.
  proposed_experiments:
  - experiment_id: exp_banddos_registry_hsct_arm
    name: International BANDDOS natural history registry with prospective HSCT arm
    description: >
      Pool the very small worldwide case population into a registry capturing
      genotype, residual CSF1R function, serial MRI, and neurodevelopmental
      outcome, and follow any transplanted patients prospectively against
      untransplanted controls, with the degenerative (not developmental) arm as
      the pre-specified endpoint.

- discussion_id: banddos_spared_peripheral_immunity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic CSF1R Loss of Function
  prompt: >
    Why does profound CSF1R deficiency spare peripheral immune function in
    BANDDOS patients?
  rationale: >
    CSF1R is the master regulator of the mononuclear phagocyte system, and the
    Csf1rko rat has a broad myeloid deficit with granulocytosis, B cell
    deficiency, and failure to thrive. Yet detailed immunological workup of a
    BANDDOS family found normal blood markers, monocytes, dendritic cell
    subsets, and T cell proliferation, and no clinical immunodeficiency has
    been reported. Whether this reflects the hypomorphic nature of human
    alleles, redundancy with CSF2/IL-34 signalling in the periphery, or simply
    incomplete phenotyping across the small case population is unresolved, and
    it matters for how aggressively transplant conditioning would be justified.
  evidence:
  - reference: PMID:38934054
    reference_title: "Leukoencephalopathy with calcifications, developmental brain abnormalities and skeletal dysplasia due to homozygosity for a hypomorphic CSF1R variant: A report of three siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the role of CSF1R signaling in myeloid development, immune deficiency is absent."
    explanation: >
      States the unexplained observation directly: myeloid-lineage receptor
      loss without clinical immunodeficiency.
  - reference: PMID:38934054
    reference_title: "Leukoencephalopathy with calcifications, developmental brain abnormalities and skeletal dysplasia due to homozygosity for a hypomorphic CSF1R variant: A report of three siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood markers, monocytes, dendritic cell subsets, and T-cell proliferation capacity were normal."
    explanation: >
      Provides the measured immunological workup showing normal peripheral
      immune parameters in BANDDOS patients.
  proposed_experiments:
  - experiment_id: exp_banddos_systematic_immunophenotyping
    name: Systematic immunophenotyping across the BANDDOS case population
    description: >
      Apply uniform deep immunophenotyping (tissue-resident macrophage
      compartments, monocyte subsets, circulating CSF1 concentration) across
      reported BANDDOS patients and their heterozygous relatives, correlated
      with allele-specific residual CSF1R signalling measured in vitro.

notes: >
  BANDDOS is best understood as the severe, early-onset end of a single
  CSF1R-related disorder continuum rather than as a separate disease: the 2024
  terminology proposal recommends replacing the ALSP/BANDDOS split with
  early-onset (<18 years) and late-onset (>=18 years) CSF1R-related disorder,
  precisely because compound heterozygous patients can present with an
  ALSP-like clinical picture on a BANDDOS-like genotype. This entry is curated
  under the BANDDOS label because MONDO:0032772 and MIM 618476 are still
  defined that way, but curators should expect the nosology to move. Note also
  that despite the central role of CSF1R in myeloid development, clinical
  immunodeficiency has not been observed in BANDDOS.

name: Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- BANDDOS
- Early-onset CSF1R-related disorder
- Biallelic CSF1R-related brain malformation and osteopetrosis
disease_term:
  preferred_term: Brain abnormalities, neurodegeneration, and dysosteosclerosis
  term:
    id: MONDO:0032772
    label: brain abnormalities, neurodegeneration, and dysosteosclerosis
parents:
  - CSF1R-related disorder
  - leukodystrophy
  - sclerosing bone dysplasia
description: >
  Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS,
  MIM 618476) is an exceedingly rare autosomal recessive disorder caused by
  biallelic loss-of-function variants in CSF1R, the gene encoding the
  colony-stimulating factor 1 receptor. CSF1R is the master regulator of the
  mononuclear phagocyte lineage, and the two CSF1R-dependent tissue-resident
  populations that fail in BANDDOS - brain microglia and bone osteoclasts -
  account for the two halves of the disease name. Severe reduction or loss of
  CSF1R signalling during fetal life leaves the developing brain deficient in
  microglia, producing congenital structural malformations (agenesis of the
  corpus callosum, Dandy-Walker complex, ventriculomegaly, cortical
  abnormalities) that are not seen in the adult-onset, monoallelic form of
  CSF1R disease. Brain abnormality of some kind is present in every reported
  case, though the individual malformations vary in frequency. Superimposed on
  this developmental lesion is a progressive
  leukoencephalopathy with white-matter degeneration, axonal spheroids,
  gliosis, and dystrophic intracranial calcification that is
  neuropathologically continuous with CSF1R-ALSP. In bone, deficient
  osteoclastic resorption produces a sclerosing bone dysplasia spanning the
  dysosteosclerosis - Pyle disease spectrum. Onset is usually perinatal or in
  infancy, with developmental delay, seizures, spasticity, dysarthria,
  dysphagia, and progressive cognitive decline - about half of reported
  patients first became symptomatic perinatally or in infancy; some with
  hypomorphic alleles present only in later childhood or adulthood, and
  skeletal involvement may be absent. BANDDOS and CSF1R-ALSP are now regarded
  as the early- and late-onset ends of a single CSF1R-related disorder
  continuum whose severity tracks residual CSF1R function.


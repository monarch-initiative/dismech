- name: Progressive Neurological Decline
  biological_scale: ORGANISM
  description: >
    The clinical convergence point of the developmental and degenerative arms.
    Most patients present perinatally or in infancy with hypotonia,
    developmental delay, and seizures, then follow a course of cognitive
    regression, speech deterioration, spasticity and rigidity with pyramidal
    signs, and dysphagia. A minority with hypomorphic alleles are normal or
    near-normal through childhood and decline in the second or third decade, an
    ALSP-like trajectory. In the end stage, patients become bedridden with loss
    of speech and voluntary movement; several reported patients died in infancy
    or childhood.
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological symptoms included speech disturbances (n = 13/15), cognitive decline (n = 12/14), spasticity/rigidity (n = 12/15), hyperactive tendon reflex (n = 11/14), pathological reflexes (n = 8/11), seizures (n = 9/16), dysphagia (n = 9/12), developmental delay (n = 7/14), infantile hypotonia (n = 3/11), and optic nerve atrophy (n = 2/7)."
    explanation: >
      Enumerates the neurological manifestations and their frequencies across
      the reviewed BANDDOS cohort.
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals eventually become bedridden with spasticity, rigidity, and loss of the ability to walk."
    explanation: >
      GeneReviews describes the end-stage trajectory shared across the
      CSF1R-related disorder spectrum.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients died in infancy, two in childhood, and one case at unspecified age."
    explanation: >
      Documents the mortality observed in the reviewed BANDDOS cohort.


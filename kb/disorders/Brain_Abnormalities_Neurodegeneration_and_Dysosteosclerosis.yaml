prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Nineteen patients had been reported worldwide as of the 2023 systematic
    review; further isolated families have been described since.
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 19 patients with BANDDOS (literature search according to the PRISMA 2020 guidelines: n = 16, our material: n = 3)."
    explanation: >
      The largest systematic review to date enumerates the total number of
      published BANDDOS cases, establishing the disorder as ultra-rare.

pathophysiology:
- name: Biallelic CSF1R Loss of Function
  biological_scale: MOLECULAR
  description: >
    CSF1R encodes a transmembrane receptor tyrosine kinase activated by two
    ligands, CSF1 and IL-34. In BANDDOS both alleles carry pathogenic variants -
    most often splice, nonsense, or deep-intronic changes that disrupt the
    tyrosine kinase domain or trigger nonsense-mediated decay, less often
    hypomorphic missense changes that leave the protein expressed but unable to
    autophosphorylate on ligand binding. Because complete CSF1R nullity is
    lethal or far more severe than what is observed clinically, at least one
    allele in each reported individual is thought to retain partial function,
    and the residual level of CSF1R signalling grades disease severity across
    the CSF1R-related disorder continuum.
  molecular_functions:
  - preferred_term: macrophage colony-stimulating factor receptor activity
    term:
      id: GO:0005011
      label: macrophage colony-stimulating factor receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: DECREASED
  - preferred_term: CSF1R autophosphorylation on ligand binding
    term:
      id: GO:0046777
      label: protein autophosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations disrupted the tyrosine kinase domain or resulted in nonsense-mediated mRNA decay."
    explanation: >
      Across all 11 BANDDOS-associated CSF1R variants reviewed, the molecular
      consequence converges on loss of tyrosine kinase function or loss of the
      transcript, establishing loss of function as the molecular lesion.
  - reference: PMID:32464672
    reference_title: "A Novel Hypomorphic CSF1R Gene Mutation in the Biallelic State Leading to Fatal Childhood Neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Total CSF1R protein expression levels were normal as compared with wild-type allele, but CSF1 ligand dependent autophosphorylation was consistent with a hypomorphic allele."
    explanation: >
      Functional assay of the p.T833M allele shows normal receptor abundance
      but impaired ligand-dependent autophosphorylation, directly demonstrating
      the signalling defect in a hypomorphic BANDDOS allele.
  - reference: PMID:30982609
    reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with Csf1r-null mice, the skeletal and neural phenotypes of the affected individuals appeared milder and variable, suggesting that at least one of the mutations in each affected individual is hypomorphic."
    explanation: >
      Supports the dose-dependent model: complete nullity is not what is seen
      clinically, and residual CSF1R activity from a hypomorphic allele sets
      the severity.
  downstream:
  - target: Microglial Deficiency in the Developing Brain
    causal_link_type: DIRECT
    description: >
      Microglia depend on CSF1R for their proliferation, differentiation, and
      survival, so loss of receptor signalling depletes the brain of its
      resident macrophage population.
    evidence:
    - reference: PMID:37349768
      reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both microglia of the central nervous system and osteoclasts stem from the monocyte phagocytic system, and their differentiation process depends on CSF1R."
      explanation: >
        States the dependence of microglial differentiation on CSF1R that makes
        this causal edge direct.
  - target: Osteoclast Deficiency and Impaired Bone Resorption
    causal_link_type: DIRECT
    description: >
      Osteoclasts arise from the same CSF1R-dependent monocyte/macrophage
      lineage, so the same receptor lesion compromises osteoclastogenesis.
    evidence:
    - reference: PMID:30982609
      reference_title: "Bi-allelic CSF1R Mutations Cause Skeletal Dysplasia of Dysosteosclerosis-Pyle Disease Spectrum and Degenerative Encephalopathy with Brain Malformation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Colony stimulating factor 1 receptor (CSF1R) plays key roles in regulating development and function of the monocyte/macrophage lineage, including microglia and osteoclasts."
      explanation: >
        Establishes osteoclasts as a CSF1R-dependent lineage, grounding the
        causal edge from receptor loss of function to osteoclast failure.

- name: Microglial Deficiency in the Developing Brain
  biological_scale: CELLULAR
  description: >
    Loss of CSF1R signalling prevents the establishment and expansion of the
    microglial population, so the fetal and postnatal brain develops with few
    or no microglia. Post-mortem examination of a homozygous splice-variant
    case showed almost complete absence of microglia, with only rare abnormal
    perivascular cells remaining. This is a primary microgliopathy: the
    initiating cellular lesion is loss of the brain's resident macrophage,
    not a primary defect of neurons or oligodendrocytes.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
    modifier: DECREASED
  - preferred_term: central nervous system macrophage
    term:
      id: CL:0000878
      label: central nervous system macrophage
    modifier: DECREASED
  biological_processes:
  - preferred_term: microglial cell proliferation
    term:
      id: GO:0061518
      label: microglial cell proliferation
    modifier: DECREASED
  - preferred_term: macrophage differentiation
    term:
      id: GO:0030225
      label: macrophage differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:30982608
    reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-mortem examination of an individual with a homozygous splice mutation (c.1754-1G>C) demonstrated several structural brain anomalies, including agenesis of corpus callosum. Immunostaining demonstrated almost complete absence of microglia within this brain, suggesting that it developed in the absence of microglia."
    explanation: >
      Direct human neuropathological demonstration that a biallelic CSF1R brain
      is essentially devoid of microglia, and that development proceeded in
      their absence.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single brain autopsy evidenced multiple brain anomalies, absence of corpus callosum, absence of microglia, severe white matter atrophy with axonal spheroids, gliosis, and numerous dystrophic calcifications."
    explanation: >
      Independent review confirms absence of microglia as the defining
      histological finding alongside the structural and degenerative changes.
  - reference: PMID:30982608
    reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We analyzed a zebrafish model (csf1rDM) lacking Csf1r function and found that their brains also lacked microglia and had reduced levels of CUX1, a neuronal transcription factor."
    explanation: >
      A vertebrate model lacking Csf1r function reproduces the microglial
      deficiency, supporting conservation of the cellular mechanism.
  downstream:
  - target: Disrupted Brain Development and Structural Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      In the absence of microglia the developing brain fails to form normal
      commissural, ventricular, and posterior-fossa structures. One proposed
      intermediate is a reduction in CUX1-positive upper-layer neurons, many of
      which project callosal axons.
    evidence:
    - reference: PMID:30982608
      reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Since a large fraction of CUX1+ neurons project callosal axons, we speculate that microglia deficiency may contribute to agenesis of the corpus callosum via reduction in CUX1+ neurons."
      explanation: >
        The authors explicitly frame the microglia-to-callosal-agenesis link as
        a speculative mechanism via CUX1+ neuron loss, so the edge is supported
        only partially and its intermediates remain unproven.
    - reference: PMID:30982608
      reference_title: "Homozygous Mutations in CSF1R Cause a Pediatric-Onset Leukoencephalopathy and Can Result in Congenital Absence of Microglia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results suggest that CSF1R is required for human brain development"
      explanation: >
        Supports the general claim that CSF1R (and hence microglia) is required
        for normal human brain development. The quote is deliberately trimmed
        to the human clause; the rest of the sentence concerns the zebrafish
        model and is cited separately as MODEL_ORGANISM evidence.
  - target: Progressive White Matter Degeneration with Axonal Spheroids
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The same microglial deficiency that disrupts development also leaves the
      white matter without its resident phagocyte, producing the progressive
      leukoencephalopathy that is neuropathologically indistinguishable from
      CSF1R-ALSP.
    evidence:
    - reference: PMID:37349768
      reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Likewise, histological evaluation evidenced a deficiency of microglia in the brain parenchyma, atrophic white matter with axonal spheroids, gliosis, and dystrophic calcifications in BANDDOS and CSF1R-ALSP"
      explanation: >
        Directly couples parenchymal microglial deficiency with the white
        matter degeneration, spheroids, gliosis, and calcification seen in both
        CSF1R disorders.

- name: Disrupted Brain Development and Structural Malformation
  biological_scale: TISSUE
  description: >
    The developmental arm of BANDDOS. Some brain abnormality is present in
    every reported case; the individual congenital malformations vary in
    frequency and include agenesis or hypoplasia of the
    corpus callosum, ventriculomegaly and colpocephaly, Dandy-Walker complex
    and large cisterna magna, cortical malformations, heterotopia, abnormal
    hippocampal gyration, and non-decussation of pyramidal tracts. These
    congenital malformations are the feature that most cleanly separates
    BANDDOS from adult-onset CSF1R-ALSP, in which they are not seen.
  cell_types:
  - preferred_term: CUX1-positive upper-layer cortical projection neuron
    term:
      id: CL:0000540
      label: neuron
    modifier: DECREASED
  biological_processes:
  - preferred_term: corpus callosum development
    term:
      id: GO:0022038
      label: corpus callosum development
    modifier: DECREASED
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain abnormalities included white matter changes (n = 19/19), calcifications (n = 15/18), agenesis of corpus callosum (n = 12/16), ventriculomegaly (n = 13/19), Dandy-Walker complex (n = 7/19), and cortical abnormalities (n = 4/10)."
    explanation: >
      Quantifies the spectrum and frequency of congenital brain abnormalities
      across the reviewed BANDDOS cohort.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to CSF1R-ALSP, cases with BANDDOS also displayed other congenital brain anomalies, including Dandy-Walker malformation, ventriculomegaly, and cortical abnormalities."
    explanation: >
      Establishes congenital brain malformation as the discriminating feature
      of BANDDOS relative to the adult-onset monoallelic disorder.
  - reference: PMID:28383543
    reference_title: "Autozygosity reveals recessive mutations and novel mechanisms in dominant genes: implications in variant interpretation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed phenotypes for these recessive variants were novel (e.g., FBN2-related myopathy and CSF1R-related brain malformation and osteopetrosis), typical (e.g., ACTG2-related visceral myopathy), or an apparently healthy state (e.g., PDE11A), consistent with the corresponding mouse knockout phenotypes."
    explanation: >
      The first report of the recessive CSF1R phenotype names brain
      malformation and osteopetrosis as the novel biallelic presentation.
  downstream:
  - target: Progressive Neurological Decline
    causal_link_type: DIRECT
    description: >
      Congenital brain malformation underlies the developmental delay,
      early-onset epilepsy, and baseline neurological deficit on which later
      degeneration is superimposed.
    evidence:
    - reference: PMID:38934054
      reference_title: "Leukoencephalopathy with calcifications, developmental brain abnormalities and skeletal dysplasia due to homozygosity for a hypomorphic CSF1R variant: A report of three siblings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "BANDDOS presents with variable dysmorphic features, skeletal dysplasia, developmental delay, and epilepsy with on neuro-imaging developmental brain anomalies, multifocal white matter abnormalities, and calcifications."
      explanation: >
        Links the developmental brain anomalies to the developmental delay and
        epilepsy that constitute the initial clinical disease.

- name: Progressive White Matter Degeneration with Axonal Spheroids
  biological_scale: TISSUE
  description: >
    The degenerative arm of BANDDOS, superimposed on the developmental lesion.
    White matter changes are present in 100% of reported cases. Histology shows
    prominent white matter atrophy with axonal spheroids, gliosis, and numerous
    dystrophic calcifications concentrated in periventricular white matter -
    the same picture as CSF1R-ALSP but more severe. On MRI the leukoencephalopathy
    is progressive and takes on the appearance of ALSP at the time of secondary
    neurological decline.

    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological evaluation evidenced severe microglia deficiency with only rare spotting of abnormal microglia around the blood vessels, prominent white matter atrophy with axonal spheroids, gliosis, and numerous dystrophic calcifications predominantly in the periventricular white matter"
    explanation: >
      The single published BANDDOS brain autopsy documents white matter

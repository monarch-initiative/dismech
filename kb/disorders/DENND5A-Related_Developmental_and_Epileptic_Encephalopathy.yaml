  downstream:
  - target: Shortened Period of Neurogenesis
    causal_link_type: DIRECT
    description: >-
      Fewer progenitors, entering the pool later and leaving it earlier, means neurogenesis
      runs out sooner.

- name: Shortened Period of Neurogenesis
  biological_scale: TISSUE
  description: >-
    The developmental endpoint of the progenitor arithmetic. Neurogenesis in the developing
    cortex is bounded by how long a progenitor pool of sufficient size persists; when the
    pool is depleted early, the window closes early and fewer neurons, of fewer lineages,
    are produced.
  biological_processes:

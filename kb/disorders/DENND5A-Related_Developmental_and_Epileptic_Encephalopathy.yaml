      neural progenitors"
    explanation: >-
      The authors' own placement of spindle misalignment as the causal step.
  downstream:
  - target: Loss of Symmetric Proliferative Division
    causal_link_type: DIRECT
    description: >-
      Spindle angle sets the division plane, and hence whether both daughters retain apical
      contact.

- name: Loss of Symmetric Proliferative Division
  biological_scale: CELLULAR
  description: >-
    An oblique cleavage plane means only one daughter keeps contact with the apical
    ventricular surface and inherits the apical determinants MUPP1 and PALS1. The other is
    displaced basally and receives less of the stem-cell-niche signal, so it is biased
    toward commitment. The division that should have produced two progenitors produces one
    progenitor and one committed cell.
  cell_types:
  - preferred_term: apical radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: symmetric cell division
    term:
      id: GO:0098725
      label: symmetric cell division
    modifier: DECREASED
  - preferred_term: asymmetric cell division
    term:
      id: GO:0008356
      label: asymmetric cell division
    modifier: INCREASED
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicating that DENND5A KO results in increased levels of oblique asymmetric
      cell divisions and the ability for apical progenitors to self-renew is severely
      compromised"
    explanation: >-
      States the division-mode shift and its consequence for self-renewal.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells lacking DENND5A orient away from the proliferative apical domain
      surrounding the ventricles, biasing daughter cells towards a more fate-committed
      state"
    explanation: >-
      Connects loss of apical contact to the fate bias in the daughter cells.
  downstream:
  - target: Premature Neuronal Differentiation and Cell Cycle Exit
    causal_link_type: DIRECT
    description: >-
      The committed daughter differentiates instead of dividing again.
  - target: Neural Progenitor Pool Depletion
    causal_link_type: DIRECT
    description: >-
      Each non-self-renewing division removes a progenitor from the pool.

- name: Premature Neuronal Differentiation and Cell Cycle Exit
  biological_scale: CELLULAR
  description: >-
    Knockout progenitors do not merely divide differently, they are inherently more likely
    to leave the cycle. One day after passaging into progenitor maintenance medium -
    conditions meant to keep them undifferentiated - 47.29 percent of knockout cells had
    developed neuronal processes against 10.67 percent of wild-type. The same shift is
    present in the adult mouse: knock-in animals have a higher proportion of NeuN-positive
    post-mitotic neurons in the subventricular zone. This is a propensity of the cells
    themselves, which is why it is curated as its own node with an input from the division
    defect rather than only as its consequence.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neuron differentiation
    term:

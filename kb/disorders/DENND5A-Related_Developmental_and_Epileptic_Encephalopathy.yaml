    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the spindle angle among cells dividing within WT (M = 57.1°, Mdn = 65.4°, SD
      = 25.9) and KO (M = 26.0°, Mdn = 20.1°, SD = 19.0) rosettes differed significantly"
    explanation: >-
      The quantitative spindle-angle measurement in human iPSC-derived neural rosettes.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."

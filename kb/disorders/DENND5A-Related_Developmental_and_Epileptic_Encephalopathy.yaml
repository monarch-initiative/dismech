- name: Neurotrophin Receptor Upregulation and Enhanced Downstream Signaling
  biological_scale: CELLULAR
  description: >-
    In the founding study, knocking DENND5A down altered neuronal development, and the
    change appeared to be mediated by an increase in neurotrophin receptors and hence in
    downstream signaling. This is a knockdown-derived account from 2016 and has not been
    reproduced in the patient-derived systems used in the 2024 cohort study, so it is
    curated as a parallel arm reaching the same developmental endpoint rather than as a
    step in the spindle chain.
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling pathway
    term:

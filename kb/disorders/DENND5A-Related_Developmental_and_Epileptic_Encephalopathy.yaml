name: DENND5A-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T09:30:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 49
- DEE49
- EIEE49
- Epileptic encephalopathy, early infantile, 49
- DENND5A deficiency
description: >-
  DENND5A-related developmental and epileptic encephalopathy (DEE49) is an autosomal
  recessive disorder caused by biallelic loss-of-function variants in DENND5A, a
  DENN-domain protein that is both a candidate Rab guanine nucleotide exchange factor and
  a binding partner of the Crumbs apical polarity proteins MUPP1 and PALS1. The mechanism
  is developmental rather than primarily electrical: without DENND5A, apical neural
  progenitors misorient their mitotic spindles away from the ventricular surface, divide
  asymmetrically instead of symmetrically, and prematurely exit the cell cycle to
  differentiate into neurons. The progenitor pool is depleted before neurogenesis is
  complete, producing primary microcephaly, ventriculomegaly, cortical malformation and
  corpus callosum dysgenesis; the mispositioned, prematurely born neurons form aberrant
  connections and seizures follow. Cerebral calcifications and coarse facial features
  were part of the original clinical description.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 49
  term:
    id: MONDO:0015002
    label: developmental and epileptic encephalopathy, 49
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic - homozygous in consanguineous families or compound heterozygous. In the
    24-person cohort, 14 individuals were homozygous and 10 compound heterozygous. No
    point mutation was found homozygous in gnomAD, which is the population-genetic
    argument that two damaged alleles are not tolerated.
  evidence:
  - reference: PMID:27866705
    reference_title: "Epileptic Encephalopathy Caused by Mutations in the Guanine Nucleotide Exchange Factor DENND5A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified an epileptic encephalopathy additionally featuring
      cerebral calcifications and coarse facial features caused by recessive
      loss-of-function mutations in DENND5A"
    explanation: >-
      The founding gene-disease report, establishing recessive loss of function.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the DENND5A point mutations in the cohort were found in the
      homozygous state among 140,000 individuals on gnomAD, a database that removes
      individuals affected by severe pediatric disease, indicating that biallelic
      pathogenic variants are likely incompatible with normal development"
    explanation: >-
      Population-genetic support for the recessive model and for the severity of the
      biallelic state.

pathophysiology:

- name: Biallelic DENND5A Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Thirty unique variants have been reported across 22 families,
    spread over the whole protein rather than clustering in one domain: nine in the DENN
    domain, two in RUN1, six in PLAT, four in RUN2 and four in the linkers, plus copy
    number and splice-site variants. That distribution is itself mechanistically
    informative - it is what a loss-of-function disorder looks like, as opposed to the
    domain-restricted clustering seen in gain-of-function DEEs.
  genes:
  - preferred_term: DENND5A
    term:
      id: hgnc:19344
      label: DENND5A
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty unique DENND5A variants were identified across the 14 homozygous and
      10 compound heterozygous individuals"
    explanation: >-
      Establishes the size and allelic architecture of the reported variant spectrum.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coding variants span the length of the protein including nine in the
      DENN domain, two in the RUN1 domain, six in the PLAT domain, four in the RUN2
      domain, and four in predicted linker regions between the folded modules"
    explanation: >-
      Documents that variants are distributed across the protein rather than clustered,
      consistent with loss of function.
  downstream:
  - target: Reduced DENND5A Protein
    causal_link_type: DIRECT
    description: >-
      Every patient-derived cell line examined shows less DENND5A protein, whatever the
      variant class.

- name: Reduced DENND5A Protein
  biological_scale: MOLECULAR
  description: >-
    The convergent proximal consequence. Cells from five cohort members - three
    iPSC-derived neural progenitor lines and two immortalized lymphoblast lines, spanning
    frameshift, nonsense and missense variants - all show reduced DENND5A protein. The
    reduction is post-transcriptional: patient mRNA levels do not differ significantly
    from controls, so the protein is lost after it is made rather than because the
    transcript is absent. This node is curated separately from the variants above because
    the protein and transcript measurements come apart, and it is the protein measurement
    that carries the loss-of-function claim.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All patient-derived cells exhibit a reduction in DENND5A protein
      (Supplementary Fig. 2a, b), supporting that disease phenotypes are a result of
      protein loss of function"
    explanation: >-
      The direct measurement establishing protein loss of function across variant classes.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A rather poor correlation between DENND5A mRNA and protein levels was
      observed as DENND5A mRNA expression from patient-derived cells did not differ
      significantly from controls"
    explanation: >-
      Locates the defect after transcription, which is why the protein and transcript
      claims are curated as separate measurements.
  downstream:
  - target: Loss of DENND5A-MUPP1/PALS1 Association at the Apical Membrane
    causal_link_type: DIRECT
    description: >-
      Less protein means less of the polarity-complex interaction that follows.
  - target: Impaired Rab-Directed Membrane Trafficking
    causal_link_type: DIRECT
    description: >-
      The second, parallel arm - the DENN domain's own predicted enzymatic function.

- name: Loss of DENND5A-MUPP1/PALS1 Association at the Apical Membrane
  biological_scale: MOLECULAR
  description: >-
    DENND5A binds MUPP1 and PALS1, two components of the Crumbs apical polarity complex
    that is required for symmetric division of neural progenitors. The interaction is
    conformation-dependent: full-length DENND5A binds these partners only weakly, because
    the binding region makes intramolecular contacts with the DENN domain, and a
    conformational change is needed to expose it. Losing DENND5A therefore removes a
    conformationally gated link into the apical polarity machinery, which is the point at
    which this trafficking protein becomes a developmental one.
  protein_complexes:
  - preferred_term: Crumbs apical polarity complex (MUPP1-PALS1)
  biological_processes:
  - preferred_term: establishment or maintenance of cell polarity
    term:
      id: GO:0007163
      label: establishment or maintenance of cell polarity
    modifier: DECREASED
  cellular_components:
  - preferred_term: apical plasma membrane
    term:
      id: GO:0016324
      label: apical plasma membrane
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mass spectrometry of purified proteins revealed members of the Crb polarity
      complex, MUPP1, and PALS1, as major DENND5A binding partners"
    explanation: >-
      Identifies the polarity-complex partners by unbiased proteomics.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This suggests a conformational change in DENND5A is necessary to expose the
      binding site for MUPP1/PALS1. In fact, full-length DENND5A has limited interaction
      with these proteins"
    explanation: >-
      Establishes that the interaction is gated by DENND5A's conformation, which is what
      the R710H variant later exploits.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that DENND5A interacts with Pals1/MUPP1, components of the
      Crumbs apical polarity complex required for symmetrical division of neural
      progenitor cells"
    explanation: >-
      Links the interaction to the specific cellular process the disorder disrupts.
  downstream:
  - target: Mitotic Spindle Misorientation in Apical Neural Progenitors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How the polarity-complex interaction is transduced to the spindle is not
      established. DENND5A is not required to deliver MUPP1/PALS1 to the apical membrane -
      those proteins still localize apically in knockout rosettes - so the route from
      interaction to spindle angle runs through some other, unidentified step.

- name: Impaired Rab-Directed Membrane Trafficking
  biological_scale: MOLECULAR
  description: >-
    The second, older mechanistic thread, and the one the gene is named for. DENND5A
    carries a DENN domain, the module that confers guanine nucleotide exchange factor
    activity toward Rab GTPases, and two RUN domains through which it binds active Rab6
    and sorting nexin 1. Structural modeling qualifies this: the predicted Rab enzymatic
    site may be occluded by the DENN-RUN1/PLAT interaction in the closed conformation,
    while Rab6 binding to RUN1 needs no conformational change - so the two functions are
    predicted to require different conformations of the same protein. This node is kept
    separate from the polarity arm rather than merged into it, because no source available
    to this entry shows that trafficking loss is what causes the spindle defect.
  molecular_functions:
  - preferred_term: guanyl-nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
  biological_processes:

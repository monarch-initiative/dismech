- name: Compensatory Ventriculomegaly
  biological_scale: TISSUE
  description: >-
    Ventricular enlargement is present in 15 of 24 individuals and is reproduced in the
    knock-in mouse by 7T MRI. The 2024 study reads it as compensatory - space vacated by
    the reduced neuronal volume - rather than as an independent obstructive or resorptive
    process. That reading is an interpretation offered by the source, not a measurement,
    and is recorded as such.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reduced volume of neurons likely leads to compensatory ventriculomegaly"
    explanation: >-
      The compensatory interpretation, hedged by the source with "likely" and preserved
      here as such.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo 7T MRI scans revealed that DENND5A KI mice have significantly
      enlarged lateral ventricles (MWT = 4.8 mm3, MKI = 6.6 mm3, SDWT = 1.3, SDKI = 2.4,
      two-tailed Mann-Whitney U, Z = −2.117, p = 0.034), consistent with ventriculomegaly"
    explanation: >-
      Quantitative in vivo reproduction of the ventriculomegaly in the mouse model.

- name: Aberrant Positioning and Connectivity of Prematurely Born Neurons
  biological_scale: TISSUE
  description: >-
    Neurons born too early and displaced from the ventricular surface end up in the wrong
    laminar position and, where they escape apoptosis, form synaptic contacts they should
    not have. This is the proposed bridge from the developmental defect to the epilepsy,
    and it is the least directly evidenced step in the chain: it is asserted in the
    authors' disease model, not measured. The edge into seizure generation is marked
    accordingly.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "improperly positioned prematurely-born neurons that do not undergo apoptosis
      and form aberrant synaptic contacts results in seizures that can further adversely
      affect development"
    explanation: >-
      Curated PARTIAL: this is the proposed disease model, stated in the discussion, not a
      measurement of synaptic connectivity in patient or model tissue.
  downstream:
  - target: Seizure Generation and Developmental and Epileptic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No source available to this entry measures excitation-inhibition balance, network
      synchrony or intrinsic excitability in DENND5A-deficient neurons. The step from
      aberrant connectivity to seizures is therefore inferential.

- name: Seizure Generation and Developmental and Epileptic Encephalopathy
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Recurrent, usually drug-resistant seizures in 21 of 24 individuals, with focal to
    bilateral tonic-clonic the most common type. Seizures then act back on development, the
    defining feature of a developmental and epileptic encephalopathy. Conformance attaches
    at the module's Recurrent Unprovoked Seizures node - the clinical endpoint - and not at
    the upstream excitation-inhibition or hyperexcitability nodes, because no ion-channel or
    synaptic measurement exists for this disorder to support those. The developmental
    encephalopathy here has an independent origin in the neurogenesis defect and is not
    solely seizure-driven.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypes observed in more than 50% of individuals with biallelic
      DENND5A variants were seizures (21/24), microcephaly (16/24), ventriculomegaly
      (15/24), hypertonia (14/24), cerebral hypoplasia (13/24), and hyperreflexia (13/24)"
    explanation: >-
      Quantifies seizures as the most frequent feature of the cohort.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental and epileptic encephalopathies (DEEs) feature altered brain
      development, developmental delay and seizures, with seizures exacerbating
      developmental delay"
    explanation: >-
      States the DEE construct - seizures acting back on development - that this endpoint
      instantiates.
  notes: >-
    Three of the 24 individuals had no seizures at all, so the seizure phenotype is not
    obligate even though the disorder is classified as a DEE. Those individuals also had
    milder neurological findings, which is consistent with the variant-class severity
    gradient recorded in the genetic section.

mechanistic_hypotheses:
- hypothesis_group_id: apical_polarity_spindle_orientation_model
  status: CANONICAL
  description: >-
    Loss of DENND5A removes a conformationally gated link to the MUPP1/PALS1 apical
    polarity complex, apical progenitors misorient their mitotic spindles, symmetric
    proliferative division is lost, the progenitor pool is depleted early, and neurogenesis
    is cut short - producing microcephaly and cortical malformation, with seizures arising
    from the mispositioned neurons. This is the account with quantitative support in human
    iPSC-derived cells and corroboration in mouse and zebrafish.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study provides a mechanism for DENND5A-related DEE that may be
      generalizable to other developmental conditions and provides variant-specific
      clinical information for physicians and families"
    explanation: >-
      The authors' framing of this as the mechanism for the disorder.

- hypothesis_group_id: rab_trafficking_neurotrophin_model
  status: ALTERNATIVE
  description: >-
    Loss of DENND5A's Rab-directed trafficking function raises neurotrophin receptor
    abundance and hence downstream signaling, and it is that signaling change that alters
    neuronal development. This was the founding account and it remains the one predicted by
    the protein's domain architecture, but it rests on knockdown experiments and has not
    been re-examined in the patient-derived neural progenitor and rosette systems that
    established the polarity mechanism. The two accounts are not mutually exclusive - a
    single protein with two conformations may serve both - and the trafficking arm is
    retained here rather than retired.
  evidence:
  - reference: PMID:27866705
    reference_title: "Epileptic Encephalopathy Caused by Mutations in the Guanine Nucleotide Exchange Factor DENND5A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, these changes appear to result from upregulation of
      neurotrophin receptors, leading to enhanced downstream signaling"
    explanation: >-
      The founding mechanistic proposal, in the source's own hedged wording.


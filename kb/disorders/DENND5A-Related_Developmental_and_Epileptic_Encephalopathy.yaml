discussions:

- discussion_id: controversy_r710h_gain_of_interaction_versus_loss_of_function
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced DENND5A Protein
  - pathophysiology#Loss of DENND5A-MUPP1/PALS1 Association at the Apical Membrane
  prompt: >-
    If the disorder is caused by loss of DENND5A function, how does a recurrent variant
    that INCREASES binding to the polarity complex cause it?
  rationale: >-
    The two findings sit in direct tension and the entry does not smooth them. Every
    patient-derived cell line shows reduced DENND5A protein, and the population genetics
    support a recessive loss-of-function model. Yet R710H, a recurrent cohort variant, lies
    in the DENN-RUN1 linker where it is predicted to break a salt bridge holding the closed
    conformation, and introducing it experimentally increases binding to MUPP1 and PALS1.
    A protein locked open would engage the polarity complex more, not less. Three readings
    are available and none is excluded. The variant may be destabilizing in cells, so that
    reduced abundance overrides increased per-molecule affinity - the R710H individual in
    the cohort is compound heterozygous, which would matter here. Or the closed
    conformation may be functionally required - if DENND5A must cycle between a Rab-binding
    RUN1-exposed state and a polarity-binding open state, then constitutive opening is a
    loss of function even though it looks like a gain of binding. Or the polarity
    interaction may not be the arm through which R710H acts at all. Which reading is right
    determines whether R710H should be curated as a distinct mechanistic class within DEE49.
  proposed_experiments:
  - experiment_id: exp_r710h_abundance_and_spindle_angle
    name: R710H knock-in iPSC rosettes with matched abundance measurement
    description: >-
      Introduce R710H as a knock-in into wild-type human iPSCs and measure both DENND5A
      protein abundance and mitotic spindle angle in the resulting rosettes, against
      wild-type and full knockout. If R710H reduces abundance and misorients spindles, it is
      a loss-of-function allele whose binding gain is irrelevant in cells. If abundance is
      preserved and spindles are still misoriented, the closed conformation is functionally
      required and constitutive opening is itself the lesion.

- discussion_id: gap_route_from_polarity_complex_to_spindle_angle
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of DENND5A-MUPP1/PALS1 Association at the Apical Membrane
  - pathophysiology#Mitotic Spindle Misorientation in Apical Neural Progenitors
  prompt: >-
    By what molecular route does losing the DENND5A-MUPP1/PALS1 interaction change the
    orientation of the mitotic spindle?
  rationale: >-
    This is the entry's central unexplained step, and the obvious explanation has been
    tested and excluded. If DENND5A were required to deliver the polarity proteins to the
    apical membrane, their mislocalization would explain the spindle defect - but PALS1
    localizes apically in knockout rosettes just as it does in wild-type, and the authors
    state directly that DENND5A is not involved in that trafficking. Something else
    therefore connects the interaction to spindle positioning: an effect on the astral
    microtubule capture machinery, on centrosome anchoring, on the local apical actin
    cortex, or an entirely separate DENND5A function. Without this step the disease model
    holds together descriptively but not mechanistically, and the edge is curated
    INDIRECT_UNKNOWN_INTERMEDIATES for exactly that reason.
  proposed_experiments:
  - experiment_id: exp_spindle_anchoring_machinery_in_dennd5a_ko
    name: Astral microtubule and cortical anchoring machinery in DENND5A knockout rosettes
    description: >-
      Image the LGN-NuMA-dynein cortical anchoring complex and astral microtubule contacts
      at the apical cortex of dividing wild-type and DENND5A knockout rosette progenitors,
      and test whether DENND5A or MUPP1/PALS1 co-localizes with or is required for that
      complex. A defect in cortical anchoring would supply the missing step; its absence
      would redirect the search toward centrosome positioning.

- discussion_id: gap_evidence_for_the_seizure_step
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Positioning and Connectivity of Prematurely Born Neurons
  - pathophysiology#Seizure Generation and Developmental and Epileptic Encephalopathy
  prompt: >-
    What actually makes DENND5A-deficient brain seize?
  rationale: >-
    The disorder is classified as a developmental and epileptic encephalopathy, and the
    developmental half is well evidenced down to quantitative spindle angles. The epileptic
    half is not. The proposed route - prematurely born neurons sitting in the wrong place
    and forming aberrant synaptic contacts - appears in the authors' disease model and is
    curated PARTIAL here because no measurement supports it: no source available to this
    entry reports excitation-inhibition balance, network synchrony, intrinsic excitability
    or synaptic physiology in DENND5A-deficient neurons. The mouse contributes threshold
    data only, and no spontaneous seizures. This is why this entry conforms to the epilepsy
    module at the clinical Recurrent Unprovoked Seizures endpoint rather than at the
    excitation-inhibition or hyperexcitability nodes: attaching upstream would let the
    module supply a mechanistic claim the evidence does not make. The authors themselves
    note that identifying whether excitatory or inhibitory neurons are disproportionately
    affected would help clinicians choose an antiseizure medication, which makes this gap
    clinically live rather than merely descriptive.
  proposed_experiments:
  - experiment_id: exp_excitatory_inhibitory_balance_in_dennd5a_deficient_cortex
    name: Excitatory and inhibitory neuron census and network physiology in DENND5A knockout
    description: >-
      Quantify excitatory and inhibitory neuron subpopulations across cortical layers in
      DENND5A knock-in mouse cortex at several developmental timepoints, and record network
      activity from DENND5A knockout human iPSC-derived neuronal cultures on multielectrode
      arrays. This tests whether the premature differentiation is subtype-biased and whether
      the resulting network is intrinsically hyperexcitable, which would convert the
      entry's inferential seizure step into a measured one.

- discussion_id: gap_which_progenitor_stage_is_primarily_affected
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mitotic Spindle Misorientation in Apical Neural Progenitors
  prompt: >-
    Is the defect primarily in neuroepithelial cells or in apical radial glia?
  rationale: >-
    The two progenitor stages differ in junctional composition - neuroepithelial cells have
    tight junctions, radial glia rely on adherens junctions - and MUPP1 is reported to
    preferentially stabilize adherens junctions over tight junctions. The authors take that
    asymmetry to predict a radial-glia-specific defect, but the prediction has not been
    tested: the rosette assay does not resolve the two stages, and the mouse data come from
    the adult subventricular zone rather than the embryonic ventricular zone. Which stage is
    affected sets the developmental window and hence what a hypothetical intervention would
    have to reach.
  proposed_experiments:
  - experiment_id: exp_stage_resolved_spindle_angles_in_vivo
    name: Stage-resolved spindle angle measurement in the embryonic mouse ventricular zone
    description: >-
      Measure mitotic spindle angles of dividing apical progenitors in the DENND5A knock-in
      mouse ventricular zone across the neuroepithelial-to-radial-glia transition, with
      stage markers, and quantify progenitor and post-mitotic proportions at each timepoint.
      This is the experiment the authors themselves propose, and it would establish both the
      affected stage and whether the in vivo spindle defect matches the rosette measurement.

- discussion_id: mismatch_adult_svz_as_proxy_for_embryonic_neurogenesis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Neuronal Differentiation and Cell Cycle Exit
  - pathophysiology#Shortened Period of Neurogenesis
  prompt: >-
    Does increased neuronal differentiation in the adult mouse subventricular zone speak to
    a defect in human embryonic cortical neurogenesis?
  rationale: >-
    The in vivo evidence for premature differentiation comes from the adult subventricular
    zone, while the disease model is about embryonic cortical neurogenesis. These are
    different niches with different progenitors, different output lineages and different
    regulatory logic; adult SVZ neurogenesis produces olfactory bulb interneurons in mouse
    and is of contested extent in adult humans at all. The authors chose the niche because
    it retains GFAP-positive radial-glia-like stem cells, which is a reasonable analogy, but
    an analogy is what it is. Compounding this, the mouse fails to reproduce the
    microcephaly that the embryonic defect is supposed to cause - relative brain size was
    lower but not significantly so. The human iPSC rosette and progenitor data carry the
    developmental claim; the mouse SVZ result corroborates it in an adjacent system and
    should not be read as confirming it in the relevant one.
  proposed_experiments:
  - experiment_id: exp_embryonic_vz_differentiation_timecourse
    name: Embryonic ventricular zone progenitor and neuron census across neurogenesis
    description: >-
      Quantify progenitor and post-mitotic neuron proportions in the DENND5A knock-in mouse
      embryonic ventricular and subventricular zones across the full neurogenic period, and
      compare the trajectory to wild-type. If the premature-differentiation shift is present
      embryonically and cortically, the adult SVZ result becomes corroboration rather than
      the primary in vivo evidence; if it is absent, the mouse does not model the human
      developmental mechanism and the microcephaly failure is explained.

notes: >-
  Scope: this entry curates DEE49, the autosomal recessive disorder caused by biallelic
  DENND5A variants. Heterozygous DENND5A loss-of-function variants are separately reported
  to predispose to familial cutaneous melanoma through an SNX1-related trafficking deficit;
  that is a different disorder with a different mode of inheritance and is not modeled here.
  Evidence base. Two primary sources: the 2016 founding report (PMID:27866705, abstract
  only in the reference cache) and the 2024 Nature Communications cohort and mechanism study
  (PMID:39174524, full text). All snippets are quoted from those cached records. The
  quantitative figures in the pathophysiology descriptions - spindle angles, cell counts,
  differentiation percentages - come from the 2024 full text; where a figure appears in a
  description rather than in a snippet it is because the source sentence carrying it also
  carries statistical notation that does not quote cleanly.
  A third reference proposed by the deep-research report, PMID:27431290 (Anazi et al. 2017),
  was fetched and then not used: it is a broad intellectual-disability genomics paper whose
  retrievable abstract does not mention DENND5A, so it cannot support any DENND5A-specific
  claim quoted from it. The report also cites PMID:38352438, the medRxiv preprint of the
  same 2024 study; the published version is cited instead.
  Hypotonia is deliberately not curated. It appears in the research report from the OMIM
  clinical synopsis rather than from either primary source, and neither cached paper states
  it in a form that could be quoted. The cohort's own motor findings - 8 of 24 walking
  independently, 11 of 24 able to grasp - are curated instead, since those are counted in
  the source. If a future curator adds hypotonia it should come with a primary citation, not
  from the synopsis.
  Ontology terms proposed by the deep-research report and rejected after checking against
  OAK: GO:0051654 was proposed for spindle localization but is "establishment of
  mitochondrion localization"; CL:0002608 was proposed for radial glial cell but is
  "hippocampal neuron"; CL:0000060 was proposed for neural progenitor cell but is
  "odontoblast". The correct terms used here are GO:0000132, CL:0000681 and CL:0011020.
  The Crumbs complex is left unbound: GO:0035003 subapical complex is defined for
  invertebrate epithelia and there is no vertebrate Crumbs complex term, so the protein
  complex carries a free-text preferred_term only.

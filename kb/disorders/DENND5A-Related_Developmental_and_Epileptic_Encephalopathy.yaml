genetic:
- name: DENND5A
  gene_term:
    preferred_term: DENND5A
    term:
      id: hgnc:19344
      label: DENND5A
  relationship_type: CAUSATIVE
  association: >-
    Biallelic loss-of-function variants in DENND5A cause DEE49. Thirty unique variants are
    reported across 22 families - 25 coding, 2 copy number and 3 splice-site - distributed
    across all folded domains. Variant class is itself a severity modifier: biallelic
    frameshift or nonsense variants produce significantly more neurological abnormality
    than biallelic missense variants.
  evidence:
  - reference: PMID:27866705
    reference_title: "Epileptic Encephalopathy Caused by Mutations in the Guanine Nucleotide Exchange Factor DENND5A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by recessive loss-of-function mutations in DENND5A"
    explanation: >-
      The gene-disease assertion.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found that variant type influences neurological phenotype severity, with more
      abnormalities in individuals with biallelic frameshift or nonsense variants (M = 7.6,
      SD = 2.3) compared to those with biallelic missense variants (M = 2.8, SD = 1.6, p =
      0.0004)"
    explanation: >-
      Quantifies variant class as a severity modifier, with the statistic.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, those with biallelic missense variants in DENND5A (M = 7.4, SD =
      3.7) had significantly higher motor scores compared to those with a combination of
      missense, frameshift, nonsense, intronic, or copy number variants (M = 2.9, SD = 3.0,
      Kruskal-Wallis H = 7.02, p = 0.03"
    explanation: >-
      The parallel gradient in motor outcome across the same variant classes.
  notes: >-
    The recurrent missense variant R710H is the one place where a simple loss-of-function
    reading is insufficient. R710H sits in the DENN-RUN1 linker and is predicted to break a
    salt bridge to D598 that holds the closed conformation; experimentally it INCREASES
    binding to MUPP1 and PALS1 rather than abolishing it. The gain-of-interaction and the
    loss-of-protein findings are recorded here without being reconciled, because no source
    available to this entry does so - see the corresponding discussion.
    The deep-research report used to build this entry attributes PMID:27866705 to "Suri et
    al. 2016" and PMID:39174524 to "Rodrigues et al."; the actual first authors are Han and
    Banks respectively. The PMIDs themselves are correct and are what this entry cites.

diagnosis:
- name: Brain Magnetic Resonance Imaging
  description: >-
    Neuroimaging is how these patients reach genetic testing rather than how the diagnosis
    is made. The imaging phenotype is distinctive enough to prompt a specific search -
    occipital-predominant pachygyria with striatal and periventricular calcifications,
    ventriculomegaly, corpus callosum agenesis or hypoplasia, basal ganglia and
    diencephalic-mesencephalic junction dysplasia - but not specific enough to settle it,
    since the same constellation raises OCLN-related disease, the tubulinopathies,
    LIS1-related lissencephaly and congenital infection.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These imaging studies highlight the heterogenous neuroanatomical
      manifestations of biallelic DENND5A variants, but certain features including volume
      loss, ventriculomegaly, and hypoplasia of the corpus callosum appear more frequently"
    explanation: >-
      States both what imaging reliably shows and that it is heterogeneous - the reason it
      narrows the differential without closing it.
  notes: >-
    CT is an acceptable substitute where MRI is unavailable and was the modality in at least
    one cohort member, but it is not separately curated: NCIT's CT terms describe the
    procedure without the neuro qualifier that would make the entry more informative than
    this one.

- name: Exome or Genome Sequencing
  description: >-
    The diagnosis is molecular. There is no biochemical marker and the neuroimaging
    phenotype, while characteristic, overlaps enough with OCLN-related disease, the
    tubulinopathies, LIS1-related lissencephaly and congenital infection that imaging alone
    does not settle it.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a selective involvement of the cortex added to the presence of
      periventricular calcifications, a common association that brings cytomegalovirus-
      induced brain malformations into the differential but aligns with pseudo-TORCH
      syndrome diagnostic criteria in the absence of congenital infection"
    explanation: >-
      Documents the imaging differential that makes molecular confirmation necessary rather
      than confirmatory.

differential_diagnoses:
- name: Pseudo-TORCH syndrome and OCLN-related band-like calcification
  disease_term:
    preferred_term: pseudo-TORCH syndrome
    term:
      id: MONDO:0009626
      label: pseudo-TORCH syndrome
  description: >-
    The closest mechanistic mimic, and not by coincidence. OCLN encodes the tight-junction
    protein occludin, and recessive OCLN variants cause a DEE through a defect in the same
    process this disorder disrupts - neural progenitor symmetric cell division, there via
    impaired mitotic spindle formation and centrosome misalignment. The imaging converges
    too: cortical migration abnormalities plus calcifications.
  distinguishing_features:
  - >-
    Polymicrogyria is a key feature of OCLN variants and is not seen in the DENND5A cohort,
    which shows occipital pachygyria instead.
  - >-
    Severe basal ganglia dysplasia and diencephalic-mesencephalic junction dysplasia are
    reported in DENND5A and were not reported with OCLN.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cortical migration abnormalities and calcifications are observed in cases with
      recessive variants in the tight junction protein-encoding OCLN gene, but severe basal
      ganglia or diencephalic and mesencephalic dysplasias were not reported and
      polymicrogyria, a key feature of OCLN mutations, is not observed in our study"
    explanation: >-
      States both the overlap and the two features that separate them.

- name: Congenital cytomegalovirus infection
  disease_term:
    preferred_term: fetal cytomegalovirus syndrome
    term:
      id: MONDO:0017409
      label: fetal cytomegalovirus syndrome
  description: >-
    The differential a clinician actually faces first. Periventricular calcifications with
    selective cortical involvement is a classic congenital-infection pattern, and the
    DENND5A imaging phenotype reproduces it closely enough that the paper names the
    confusion explicitly.
  distinguishing_features:
  - >-
    Absence of congenital infection on serology or PCR. The same constellation then aligns
    with pseudo-TORCH diagnostic criteria - which is to say, with a genetic rather than an
    infectious cause.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a selective involvement of the cortex added to the presence of
      periventricular calcifications, a common association that brings cytomegalovirus-
      induced brain malformations into the differential but aligns with pseudo-TORCH
      syndrome diagnostic criteria in the absence of congenital infection"
    explanation: >-
      Names congenital CMV as the differential the imaging raises, and the finding that
      resolves it.

- name: LIS1-related lissencephaly
  description: >-
    LIS1 encodes a neuronal migration protein and produces a posterior gradient of
    lissencephaly - the same posterior-predominant direction as the DENND5A pachygyria,
    which is what makes it a live differential rather than a distant one.
  distinguishing_features:
  - >-
    Calcifications are absent in LIS1-related lissencephaly and present in DENND5A.
  - >-
    Corpus callosum size in LIS1 varies in both directions, including thicker than normal;
    in the DENND5A cohort it was normal, thin or absent with no case of increased volume.
    The directionality of the callosal finding, not merely its presence, is the
    discriminator.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in LIS1, encoding a protein involved in neuronal migration, results
      most frequently in a posterior gradient of lissencephaly, without calcifications, and
      variable degrees of corpus callosum size including thin, normal, and thicker than
      normal tracts"
    explanation: >-
      Gives both distinguishing features - the absent calcifications and the bidirectional
      callosal variation.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, corpus callosum volumes were either normal, thin, or absent with
      no cases of increased volume in our cohort"
    explanation: >-
      The DENND5A side of the callosal contrast.
  notes: >-
    No disease_term is bound. MONDO has no single term for LIS1-related lissencephaly as a
    class - the relevant concepts are gene- and syndrome-specific (Miller-Dieker, isolated
    lissencephaly sequence) and the source speaks of "variants in LIS1" generally, so
    binding any one of them would narrow the claim beyond what is written.

- name: Tubulinopathies
  description: >-
    Tubulin gene variants produce overlapping cortical malformation phenotypes and belong in
    the same imaging differential.
  distinguishing_features:
  - >-
    The tubulinopathies show a classic dysgyria pattern that the DENND5A cohort lacks.
  - >-
    The tubulinopathies are not associated with calcifications, which are present in
    DENND5A.
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in tubulin genes also result in overlapping phenotypes47, but our
      cases lack the classic dysgyria pattern and instead are observed in the context of
      occipital pachygyria and differ in that our cases are associated with calcifications"
    explanation: >-
      States the overlap and both discriminating features.
  notes: >-
    No disease_term is bound: "tubulinopathies" names a gene-family grouping (TUBA1A, TUBB2B,
    TUBB3 and others) rather than one MONDO concept, and the source refers to the class.

treatments:
- name: Antiseizure Medication
  description: >-
    Management is symptomatic. No agent has disease-specific efficacy evidence, seizures
    are generally drug-resistant, and the cohort record includes agents that worsened
    seizures as well as agents that helped - phenytoin and lamotrigine each worsened
    seizures in one individual. Levetiracetam and sodium valproate were the most commonly
    reported agents achieving control.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were generally drug-resistant, but control was achieved in 6 cases
      with variable antiepileptic treatment. Anti-seizure medications variably helped, did
      not affect, or worsened seizures"
    explanation: >-
      Curated PARTIAL: it records a mixed and often unsuccessful response, not an effective
      treatment. The explicit inclusion of worsening is why this cannot be read as support
      for antiseizure medication as such.
  notes: >-
    The mechanism gives no obvious therapeutic handle. The rate-limiting defect - spindle
    misorientation in apical progenitors - occurs during prenatal neurogenesis and is
    complete before the disorder presents, so a treatment aimed at the mechanism would have
    to act on a window that has closed by the time of diagnosis. This is a structural
    limitation of the disorder, not a gap in the drug literature.

- name: Genetic Counseling
  description: >-
    Autosomal recessive with a 25 percent recurrence risk per pregnancy for carrier
    couples. Consanguinity was a feature of the founding families, which is the standard
    context for identifying biallelic rare-variant disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For families in which one parent is aware they are a carrier of a pathogenic
      DENND5A variant, genetic counselors can recommend the other parent undergo genetic
      testing. When both parents are carriers, in vitro fertilization with preimplantation
      genetic diagnosis can be offered"
    explanation: >-
      Names genetic counselors, carrier testing of the second parent, and IVF with
      preimplantation genetic diagnosis - the reproductive options this treatment entry
      asserts. This replaces an earlier quote that was the paper's generic closing sentence
      about being clinically informative, which did not state any of it.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of DENND5A VUSs does not necessarily equate to a devastating
      prognosis; 13% (3 cases) of our small cohort did not meet criteria for DEE or
      experience seizures at the time of data collection"
    explanation: >-
      Curated PARTIAL because it qualifies rather than supports: the counseling message is
      not uniformly severe. This is the same 3 of 24 recorded on the seizure endpoint node,
      and it is the counseling-relevant reading of that number.

animal_models:
- name: DENND5A knock-in mouse
  species: Mouse
  genotype: homozygous DENND5A knock-in (no full-length protein expressed)
  publication: PMID:39174524
  description: >-
    A knock-in line in which full-length DENND5A protein is not expressed. Used for
    structural neuroimaging, adult subventricular zone histology and chemically provoked
    seizure susceptibility.
  modeled_mechanisms:
  - target: Compensatory Ventriculomegaly
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Ventricular volume was measured in adults; the model does not report the
      developmental time course by which the enlargement arises, so it corroborates the
      endpoint rather than the compensatory interpretation placed on it.
    description: >-
      In vivo 7T MRI reproduces the human ventriculomegaly.
    readouts:
    - name: Lateral ventricle volume
      target: Compensatory Ventriculomegaly
      direction: INCREASED
      interpretation: >-
        Significantly enlarged lateral ventricles in knock-in mice.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "DENND5A KI mice have significantly enlarged lateral ventricles (MWT = 4.8
          mm3, MKI = 6.6 mm3, SDWT = 1.3, SDKI = 2.4, two-tailed Mann-Whitney U, Z =
          −2.117, p = 0.034)"
        explanation: >-
          The quantitative volumetric measurement.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo 7T MRI scans revealed that DENND5A KI mice have significantly
        enlarged lateral ventricles"
      explanation: >-
        Supports treating the mouse as informative for the human ventriculomegaly.
  - target: Premature Neuronal Differentiation and Cell Cycle Exit
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Measured in the adult subventricular zone, not the embryonic ventricular zone where
      the disorder's neurogenesis defect is proposed to occur. Adult SVZ neurogenesis is a
      different process from cortical neurogenesis, so this is a corroborating observation
      in an analogous niche rather than a direct test of the developmental claim.
    description: >-
      A higher proportion of post-mitotic neurons in the adult neurogenic niche.
    readouts:
    - name: NeuN-positive post-mitotic neurons in the subventricular zone
      target: Premature Neuronal Differentiation and Cell Cycle Exit
      direction: INCREASED
      interpretation: >-
        Knock-in mice have proportionally more post-mitotic neurons, consistent with
        progenitors exiting the cycle.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "KI mice have a significantly higher percentage of post-mitotic neurons
          expressing NeuN compared to WT mice"
        explanation: >-
          The histological measurement behind this readout.
    - name: GFAP-positive stem-like cells in the subventricular zone
      target: Premature Neuronal Differentiation and Cell Cycle Exit
      direction: UNCHANGED
      interpretation: >-
        A real negative result, retained rather than dropped. The expected reciprocal fall
        in the GFAP-positive stem-like population was present in the mean but did not reach
        significance, so the stem-cell-depletion half of the model is not demonstrated in
        this assay even though the neuronal half is.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "While there is also a reduction in the mean proportion of GFAP-positive
          cells in the SVZ of the KI mice, it did not reach significance"
        explanation: >-
          The non-significant measurement, stated directly by the source.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we used our DENND5A KI mice to examine the adult subventricular zone (SVZ),
        a region that normally retains GFAP-positive RG-like neural stem cells"
      explanation: >-
        Establishes what niche was examined and why it was chosen as an analogue.
  - target: Seizure Generation and Developmental and Epileptic Encephalopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mice do not have spontaneous seizures. What is measured is a lowered threshold to
      a chemoconvulsant, 4-aminopyridine, which is a susceptibility phenotype and not
      epilepsy. The human disorder is defined by recurrent unprovoked seizures, so this is
      the weakest correspondence in the model.
    description: >-
      Increased chemoconvulsant seizure susceptibility without spontaneous seizures.
    readouts:
    - name: Latency to seizure after 4-aminopyridine
      target: Seizure Generation and Developmental and Epileptic Encephalopathy
      direction: DECREASED
      interpretation: >-
        Knock-in mice seize sooner after 4-AP than wild-type, indicating a lowered seizure
        threshold.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "they show increased seizure susceptibility compared to WT when
          administered the potassium channel blocker 4-aminopyridine (MWT = 23.60, MKI =
          11.67, SDWT = 2.97, SDKI = 7.20, two-tailed t(9) = 3.445, p = 0.007"
        explanation: >-
          The latency measurement behind this readout.
    - name: Spontaneous seizures
      target: Seizure Generation and Developmental and Epileptic Encephalopathy
      direction: UNCHANGED
      interpretation: >-
        A real negative result. No spontaneous seizures were observed, which is why the
        relationship is PARTIALLY_RECAPITULATES rather than RECAPITULATES.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "while spontaneous seizures were not observed in the KI mice, they show
          increased seizure susceptibility compared to WT"
        explanation: >-
          The source's own statement that the spontaneous phenotype is absent.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Finally, while spontaneous seizures were not observed in the KI mice, they
        show increased seizure susceptibility compared to WT"
      explanation: >-
        Curated PARTIAL because the model captures threshold, not the recurrent unprovoked
        seizures that define the human disorder.
  - target: Reduced Brain Volume and Cortical Malformation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      Relative brain size was lower in mean and median but the difference did not reach
      statistical significance, with high variability. The authors note the same
      variability in human occipitofrontal circumference, so the failure may reflect the
      trait's variance rather than an absent phenotype - but as measured, the mouse does not
      demonstrate reduced brain size, and this entry does not report it as though it did.
    description: >-
      The microcephaly phenotype is not statistically reproduced in the mouse.
    readouts:
    - name: Relative brain size
      target: Reduced Brain Volume and Cortical Malformation
      direction: UNCHANGED
      interpretation: >-
        Lower in mean and median but not significantly so.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "KI mice also have a lower mean and median relative brain sizes, but like
          the human cohort in which occipitofrontal circumference percentiles varied
          considerably, a high degree of variability was observed in the mice and the
          difference did not reach statistical significance"
        explanation: >-
          Curated REFUTE for this specific readout: the measurement does not support a
          reduced brain size in this model, and the source says so directly.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "a high degree of variability was observed in the mice and the difference did
        not reach statistical significance"
      explanation: >-
        The negative result that requires this link to be curated as
        FAILS_TO_RECAPITULATE.

- name: dennd5a F0 CRISPR knockout zebrafish
  species: Zebrafish
  genotype: biallelic dennd5a CRISPR/Cas9 F0 knockout (crispant)
  publication: PMID:39174524
  description: >-
    F0 crispants carrying biallelic dennd5a mutations, phenotyped morphologically at 5 days
    post fertilization. The value of this model is that it reproduces the two structural
    findings - small head, large ventricle - in a second species and at a whole-organism
    developmental scale.
  modeled_mechanisms:
  - target: Reduced Brain Volume and Cortical Malformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      F0 crispants are genetic mosaics, so the penetrance of the biallelic state varies
      between and within animals. Head size in a larval zebrafish is a coarse proxy for
      human microcephaly, and the zebrafish brain has no cortex, so the cortical
      malformation component of this node cannot be modeled here at all.
    description: >-
      Reduced head size and enlarged ventricle in the knockout larvae.
    readouts:
    - name: Head size
      target: Reduced Brain Volume and Cortical Malformation
      direction: DECREASED
      interpretation: >-
        Reduced head size in F0 knockouts, the cross-species correlate of microcephaly.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "F0 KOs show structural and behavioral perturbations consistent with
          DENND5A-related DEE including reduced head size and increased ventricle size"
        explanation: >-
          The morphological measurements behind this readout.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Biallelic mutations in dennd5a were introduced into zebrafish larvae using
        CRISPR/Cas9 (F0 KOs)"
      explanation: >-
        Establishes the model as a biallelic knockout matching the human genotype.

experimental_models:
- name: DENND5A knockout human iPSC-derived neural rosettes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Neural rosettes formed from wild-type and CRISPR/Cas9 DENND5A knockout human iPSCs. A
    rosette is a polarized in vitro model of early neural development with a central
    F-actin-rich lumen standing in for the ventricular surface, which is what makes the
    mitotic spindle angle measurable at all. This is the system that produced the
    disorder's central quantitative finding.
  publication: PMID:39174524
  modeled_mechanisms:
  - target: Mitotic Spindle Misorientation in Apical Neural Progenitors
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Human but not patient-derived: the knockout is engineered, so the model tests the
      consequence of absent DENND5A rather than of any particular patient allele. The
      spindle-angle measurement also required excluding cells whose chromatin was
      abnormally condensed - a class over-represented in the knockouts - so the reported
      angle distribution is drawn from the subset of knockout divisions that looked
      normal enough to measure.
    description: >-
      Direct quantification of mitotic spindle angle relative to the apical surface.
    readouts:
    - name: Mitotic spindle angle relative to the apical surface
      target: Mitotic Spindle Misorientation in Apical Neural Progenitors
      direction: DECREASED
      interpretation: >-
        Knockout progenitors divide at a much shallower angle to the apical surface than
        wild-type, and most fall below the 45 degree line that separates symmetric from
        oblique division.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the spindle angle among cells dividing within WT (M = 57.1°, Mdn = 65.4°,
          SD = 25.9) and KO (M = 26.0°, Mdn = 20.1°, SD = 19.0) rosettes differed
          significantly"
        explanation: >-
          The quantitative angle measurement.
    - name: Apical localization of PALS1
      target: Mitotic Spindle Misorientation in Apical Neural Progenitors
      direction: UNCHANGED
      interpretation: >-
        A real negative result that constrains the mechanism. PALS1 still reaches the apical
        membrane without DENND5A, so DENND5A is not required to traffic the polarity complex
        there - which is why the edge from the interaction node to this one is curated with
        unknown intermediates rather than as a direct trafficking failure.
      evidence:
      - reference: PMID:39174524
        reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "PALS1 localized apically in both WT and KO rosettes (Supplementary Fig.
          5f), suggesting DENND5A is not involved in trafficking MUPP1/PALS1 to the apical
          membrane"
        explanation: >-
          The negative localization result, stated directly by the source.
    evidence:
    - reference: PMID:39174524
      reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We performed a neural rosette formation assay, a polarized in vitro model of
        early neural development, to examine for potential alterations in the symmetry of
        cell division following loss of DENND5A"
      explanation: >-
        Establishes the model and what it was used to measure.

- name: DENND5A knockout human iPSC-derived neural progenitor cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Neural progenitors differentiated from wild-type and DENND5A knockout human iPSCs,
    validated as SOX1, SOX2 and Nestin positive. Used for proliferation counts and for the
    premature differentiation assay.
  publication: PMID:39174524
  modeled_mechanisms:
  - target: Neural Progenitor Pool Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Part of the day-one difference is attributed by the authors to increased apoptosis in
      knockout cells after plating rather than to slower division, so the proliferation
      deficit and a survival deficit are not fully separated in this assay.
    description: >-
      Knockout progenitors fail to expand.
    readouts:
    - name: Neural progenitor cell number over 72 hours
      target: Neural Progenitor Pool Depletion
      direction: DECREASED
      interpretation: >-
        Wild-type progenitors expand while knockouts stay nearly flat, with the gap widening
        from 48 to 72 hours.
      evidence:

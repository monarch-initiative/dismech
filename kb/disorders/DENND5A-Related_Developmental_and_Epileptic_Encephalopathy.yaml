    detail that distinguishes this from the LIS1 tubulinopathy differential.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cortical malformations, particularly with pachygyria involving the occipital

      label: vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: retrograde transport, endosome to Golgi
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
  evidence:
  - reference: PMID:27866705
    reference_title: "Epileptic Encephalopathy Caused by Mutations in the Guanine Nucleotide Exchange Factor DENND5A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DENND5A contains a DENN domain, an evolutionarily ancient enzymatic module
      conferring guanine nucleotide exchange factor (GEF) activity to multiple proteins
      serving as GEFs for Rabs, which are key regulators of membrane trafficking"
    explanation: >-
      Establishes the DENN domain's expected enzymatic role in membrane trafficking.
  - reference: PMID:39174524
    reference_title: "Loss of symmetric cell division of apical neural progenitors drives DENND5A-related developmental and epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "we aligned the co-crystal structure of DENND1B and Rab35 with the predicted
      DENND5A structure and found that the predicted Rab enzymatic site in DENND5A may be
      occluded by interactions between the DENN and RUN1 (RPIP8, UNC-14 and NESCA)/PLAT
      (Polycystin-1, Lipoxygenase, Alpha-Toxin) domains"
    explanation: >-
      Curated PARTIAL: a structural prediction that qualifies the GEF assignment rather
      than a measurement of exchange activity. No source available to this entry reports
      DENND5A GEF activity assayed directly against a Rab substrate.
  downstream:
  - target: Neurotrophin Receptor Upregulation and Enhanced Downstream Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockdown raises neurotrophin receptor levels, but by what trafficking step is not

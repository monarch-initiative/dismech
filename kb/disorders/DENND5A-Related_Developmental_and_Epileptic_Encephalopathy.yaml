- name: Reduced Brain Volume and Cortical Malformation
  biological_scale: TISSUE
  description: >-
    The structural phenotype: microcephaly, reduced white matter volume, pachygyria with
    an occipital predominance, basal ganglia and diencephalic-mesencephalic junction dysplasia,
    corpus callosum agenesis or hypoplasia, and striatal and periventricular calcifications.

- name: Mitotic Spindle Misorientation in Apical Neural Progenitors
  biological_scale: CELLULAR
  description: >-
    The rate-limiting cellular defect. In human iPSC-derived neural rosettes - a polarized
    in vitro model of early neural development - the angle between the cleavage plane and
    the apical surface collapses when DENND5A is absent. Wild-type progenitors divide with
    a mean spindle angle of 57.1 degrees, close to the plane that gives both daughters
    equal access to the apical surface; knockout progenitors divide at 26.0 degrees, and
    an overwhelming majority fall below 45 degrees.
  cell_types:
  - preferred_term: apical radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: establishment of mitotic spindle orientation
    term:

- name: Neural Progenitor Pool Depletion
  biological_scale: CELLULAR
  description: >-
    The two upstream defects - fewer self-renewing divisions and more cells leaving the
    cycle - both subtract from the same pool, and the pool is measurably smaller. Equal
    numbers of wild-type and knockout progenitors plated together diverge within two days:
    1008 wild-type cells per well against 614 knockout, and by 72 hours 1685 against 683.
    Wild-type numbers climb while knockout numbers stay nearly flat.
  cell_types:
  - preferred_term: neural progenitor cell

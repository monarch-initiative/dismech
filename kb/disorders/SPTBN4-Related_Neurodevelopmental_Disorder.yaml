    two confident nodes, and marked HYPOTHETICAL because the currently best
    controlled experiment - a tissue-specific conditional knockout with
    knockout-validated antibody controls - argues against the myogenic arm. The
    practical consequence is diagnostic: a muscle biopsy showing type 1 fibre
    atrophy in a hypotonic infant should not be read as excluding SPTBN4
    disease, nor as establishing a primary myopathy within it. The 2025
    review's framing is quoted below rather than paraphrased because it is a
    reversal of the disorder's original description. Note that neither
    the founding report nor the follow-up cohort had access to a
    beta-IV-spectrin-null muscle as an antibody control, which is the specific
    methodological gap the conditional-knockout study fills.

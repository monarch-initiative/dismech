- name: Residual-Function Alleles and the Mild End of the Spectrum
  biological_scale: MOLECULAR
  description: >-
    Not every SPTBN4 genotype produces the profound phenotype. Two siblings
    with a homozygous splice-site variant causing in-frame skipping of exon 19
    had muscular hypotonia, myopathic facies with ptosis and axonal neuropathy
    but no seizures, no feeding or respiratory difficulty and, in the index
    case, normal cognition and mainstream schooling. The proposed explanation
    is residual protein activity from an in-frame product rather than complete
    loss of function. A second, independent observation points the same way:
    of the patients carrying missense rather than truncating alleles, several
    had milder symptoms or later onset, and the more severely affected missense
    carriers had their variants in the calponin-homology, variable-region or
    pleckstrin-homology domains rather than in the spectrin-repeat rod.
  genes:
  - preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  mechanism_confidence: PROVISIONAL
  notes: >-
    The residual-activity model is an inference, not a measurement: no assay of
    residual beta-IV-spectrin function has been performed on any of the milder
    genotypes, and the 2021 cohort report explicitly states that the reported
    variants are dispersed across the gene with no clear genotype-phenotype
    correlation. The two published assertions of an allele-severity gradient
    therefore sit against a third assertion that no gradient exists. This entry
    records the gradient as provisional and does not use it for prognostic
    claims. A separate observation from the natural-history review complicates
    it further: two aberrant-splicing variants are known, and the milder of the
    two families had complete skipping of one exon while the more severely
    affected family had a partial 48 bp in-frame deletion within an exon, which
    is the opposite of what a simple "more in-frame product, milder disease"
    model predicts.
  evidence:
  - reference: PMID:31857255
    reference_title: "A novel homozygous splice-site mutation in the SPTBN4 gene causes axonal neuropathy without intellectual disability."

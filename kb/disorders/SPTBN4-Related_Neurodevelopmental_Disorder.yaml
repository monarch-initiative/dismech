- name: Failure of Voltage-Gated Sodium Channel Clustering at the AIS and Node
  biological_scale: CELLULAR
  description: >-
    Saltatory conduction depends on sodium channels being present at very high
    density over the short bare stretch of axolemma at each node, and action
    potential initiation depends on the same arrangement at the axon initial
    segment. Without beta-IV spectrin, neither ankyrinG nor the sodium channels
    are correctly clustered at these sites. In human disease this was shown
    directly: nerve biopsy from an affected individual had reduced nodal
    sodium channels. The failure is partial rather than absolute, and the
    reason is a specific compensation - ankyrinR together with beta-I spectrin
    can substitute at nodes and cluster some sodium channels when the
    ankyrinG/beta-IV-spectrin pair is gone.

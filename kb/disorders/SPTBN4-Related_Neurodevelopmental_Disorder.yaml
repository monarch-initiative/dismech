  notes: >-
    There is a real tension in this node that the entry does not smooth over.
    The sodium-channel arm predicts REDUCED excitability, and that is what was
    measured in the dentate gyrus in vivo. The KCNQ2 arm predicts INCREASED
    excitability, and that is what was measured at the diaphragm neuromuscular
    junction and in peripheral axons, and what the epileptiform EEGs in
    patients suggest. Both are true of the same mutant animals. The resolution
    is presumably compartmental - which channel's loss dominates depends on the
    axonal domain, the fibre type and the developmental stage - but no study
    has tested that directly, and it is recorded as an open question rather
    than asserted. This is also why the entry does NOT declare conformance to
    `epilepsy_excitation_inhibition_imbalance`: the direction of the
    excitability shift is not uniform across the nervous system in this
    disorder.

    explanation: Documents the non-specific and inconsistent imaging findings, which is why no structural lesion is proposed as the cause of the cognitive phenotype.
- name: Contested Skeletal Muscle Involvement
  biological_scale: TISSUE
  description: >-
    Whether SPTBN4 disease includes a primary myopathy is unresolved, and the
    two positions are held by competent groups using different methods. The
    myogenic case: the founding report described congenital myopathy with
    incomplete congenital fibre-type disproportion, showed beta-IV-spectrin
    immunostaining at the sarcolemma of normal human and mouse muscle and its
    absence in patient and quivering muscle, and found complete absence of type
    1 fibres in quivering mouse muscle; a follow-up cohort again found no
    beta-IV-spectrin staining in patient muscle and type 1 fibre hypotrophy
    without frank fibre-type disproportion, and hypothesised a direct effect on
    sarcolemmal stability and on depolarisation along the myofibre and its
    T-tubular system. The neurogenic case: a muscle-specific conditional
    knockout showed that beta-4 spectrin does not contribute to muscle
    function, and that the protein is not present in muscle at all - which
    would make the sarcolemmal immunostaining a cross-reaction and the muscle
    pathology entirely secondary to denervation. The 2025 natural-history
    review sides with the neurogenic reading.

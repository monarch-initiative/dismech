- name: Impaired Action Potential Initiation and Saltatory Conduction
  biological_scale: CELLULAR
  description: >-
    The convergence point of the structural and the channel-clustering arms.
    With fewer sodium channels at a structurally disorganised AIS and node, the
    threshold for spike initiation rises, conduction along myelinated fibres
    slows, and high-frequency firing becomes unreliable. Both features have
    been measured: in the auditory brainstem, beta-4-spectrin-null mice show an
    elevated action-potential threshold, increased failures during
    high-frequency trains, and slowed central conduction; in the hippocampus,
    beta-IV-spectrin mutants show an impaired input-output relationship and
    reduced network excitability that a computational model reproduces from
    sodium-channel loss alone.

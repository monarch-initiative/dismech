- name: Central Auditory Conduction Failure
  biological_scale: TISSUE
  description: >-
    Hearing loss in this disorder is a neuropathy, not a cochlear disease. The
    quivering mouse, which is the natural model of the human condition, is deaf
    with normal cochlear morphology and normal cochlear potentials but abnormal
    transmission through the brainstem auditory nuclei - deafness "central in
    origin". The same pattern was documented in a patient: otoacoustic
    emissions present, but brainstem evoked response audiometry showing only
    wave I, localising the block to cochlear nerve conduction. Mechanistically
    the auditory pathway is the most demanding client of the nodal scaffold
    because it encodes at submillisecond precision, and beta-4-spectrin-null
    mice fail specifically at the heminode adjacent to the nerve terminal, with
    slowed central conduction and absent startle responses despite normal
    cochlear function.

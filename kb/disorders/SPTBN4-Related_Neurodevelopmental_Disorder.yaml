- name: SPTBN4
  association: Bi-allelic loss-of-function variants; predominantly homozygous truncating alleles in consanguineous families
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  notes: >-
    Nomenclature and identifiers. HGNC:14896 is SPTBN4, spectrin beta,
    non-erythrocytic 4, at 19q13.13. The gene identity and the gene-disease
    edge were both taken from OAK rather than from memory: `runoak -i
    sqlite:obo:mondo relationships -p RO:0004003 MONDO:0060496` returns
    HGNC:14896 SPTBN4, and `runoak -i sqlite:obo:hgnc search "l^SPTBN4"`
    returns hgnc:14896. Note the repo convention that HGNC CURIEs are written
    lowercase in YAML. The mouse orthologue appears in the older literature as
    Spnb4 and the protein as beta-spectrin 4 or beta4-spectrin; the founding
    localisation paper places the human gene at 19q13.13 and the mouse gene on
    chromosome 7.

    Reference transcript. Clinical variants are reported against NM_020971
    (versions .2 and .3 both appear in the literature). Representative alleles,
    each traceable to a cited publication: c.1597C>T p.(Gln533Ter) homozygous,
    the founding Kurdish case; c.3375_3393del p.(Asp1126Thrfs*39),
    c.1247del p.(Leu417Tyrfs*5), c.737G>C p.(Arg246Pro), c.1149dup
    p.(Asn384Glnfs*17) and a maternal deletion of exons 6-11, from the 2021
    cohort; c.1665+2T>C, c.1217T>C p.(Leu406Pro), c.2535_2554del
    p.(Gly846Alafs*13) and the novel c.2265G>A p.(Trp755Ter), from the four
    Saudi families; and c.508A>T p.(Lys170Ter) from the 2026 lethal sibling
    pair. Two aberrant-splicing alleles have been characterised at the RNA
    level, c.1665+2T>C (48 bp skipped within exon 12) and c.3949-1G>A.

    Copy-number matters for diagnosis. At least one reported patient carries a
    multi-exon deletion in trans to a point variant, so a single heterozygous
    SPTBN4 variant in a compatible phenotype should prompt a search for a
    second, structural allele.

    Not asserted, deliberately. No gnomAD constraint metric (pLI, o/e LoF,
    missense Z), no allele frequency, no ClinVar classification counts and no
    ClinGen gene-disease-validity classification are recorded anywhere in this
    entry. None was available from a cached source in this checkout, and
    populating them from memory is exactly the failure mode the repository's
    evidence rules exist to prevent. No founder allele, modifier locus,
    methylation episignature or somatic mechanism has been established.

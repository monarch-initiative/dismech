    This node is the reason the entry does NOT declare conformance to the
    `sensorineural_hair_cell_loss` module. That module's central effector is
    hair cell mechanotransduction failure and death, and the evidence here
    points the opposite way: cochlear function is preserved in both the mouse
    and the reported patients, and the lesion is in the first-order auditory
    neuron and its central projection. Curating this as hair-cell disease would
    be a category error, and would also mislead about management, since
    auditory neuropathy responds poorly to conventional amplification.
    HP:0000407 Sensorineural hearing impairment is nonetheless the phenotype
    term used, because HPO has no "auditory neuropathy" term - searches for
    both `l~auditory neuropathy` and a free-text `auditory neuropathy` against
    `sqlite:obo:hp` returned nothing on 2026-08-01 - and HP:0004463 Absent
    brainstem auditory responses is bound alongside it to carry the
    neuropathic character.

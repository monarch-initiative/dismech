- name: Cortical Network Dysfunction and Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    The cognitive and language phenotype is the least mechanistically resolved
    part of the disorder and also its most severe. The axon initial segment is
    where a cortical pyramidal neuron decides whether to fire; beta-IV spectrin
    is one of the two proteins that build it; and beta-IV-spectrin mutant mice
    have measurably reduced network excitability in vivo. Beyond that the chain
    is inference. Most affected individuals have severe to profound
    developmental delay and intellectual disability with absent or
    single-word speech, and neuroimaging is normal in a substantial minority -
    8 of 22 patients with available MRI in the pooled review - so there is no
    gross structural lesion to which the cognitive phenotype can be attributed.
    Where MRI is abnormal the findings are non-specific: vermian atrophy,
    diffuse T2 hyperintensity, enlarged CSF spaces, cerebral atrophy and white
    matter change.

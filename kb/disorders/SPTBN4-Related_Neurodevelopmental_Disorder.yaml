- name: Axonal Hyperexcitability and Epileptiform Discharge
  biological_scale: CELLULAR
  description: >-
    Loss of nodal KCNQ2/3 removes the slow potassium brake on repetitive
    firing, and the result in mice is spontaneous and evoked neuromyotonic and
    myokymic discharge originating in myelinated axons distal to the nerve
    terminal. The human counterpart is the striking, and initially
    counterintuitive, finding that patients can have abundant to nearly
    continuous epileptiform discharges on EEG - in one case documented over 72
    hours and in another over 24-hour video EEG - with no clinical seizure ever
    observed. This dissociation between electrographic and clinical epilepsy is
    a distinctive feature of the disorder and is the reason EEG is worth
    performing even in a child with no history of fits.

  mechanism_confidence: PROVISIONAL
  notes: >-
    Marked PROVISIONAL rather than ESTABLISHED for a specific reason: the
    causal link from KCNQ2 declustering to hyperexcitability is established in
    mouse peripheral axons, and the epileptiform EEG is established in
    patients, but nothing connects the two directly in human tissue. The mouse
    readout is neuromyotonia and myokymia at the neuromuscular junction, which
    is a peripheral phenomenon, whereas the patient readout is a cortical EEG.
    Whether the patients' discharges arise by the same KCNQ2-declustering
    mechanism, or instead from the cortical AIS pathology, is untested.

    Seizure frequency is genuinely inconsistent across sources and is not
    averaged here. GeneReviews states that half of affected individuals develop
    seizures; the 2021 cohort report says more than half develop seizures or
    have a pathological EEG; the 2025 natural-history review of 38 patients
    puts seizures at 21%; and the HPO annotation set for OMIM:617519 records
    HP:0001250 Seizure with the frequency modifier "Very rare", sourced to OMIM
    (retrieved 2026-08-01). These four sources cannot all be right. The
    discrepancy is recorded as a knowledge-gap discussion.

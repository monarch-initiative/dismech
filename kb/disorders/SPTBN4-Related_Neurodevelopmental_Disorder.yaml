- name: Failure of the Reciprocal AnkyrinG-beta-IV Spectrin Scaffold
  biological_scale: MOLECULAR
  description: >-
    AnkyrinG and beta-IV spectrin are not arranged in series but in a
    reciprocal pair. AnkyrinG recruits beta-IV spectrin to the AIS and to nodes
    through a specific domain in the spectrin, and beta-IV spectrin in turn
    retains ankyrinG there; deleting either one delocalises the other. That
    reciprocity is why an SPTBN4 lesion is not merely the loss of one
    scaffolding activity but the collapse of the adaptor hub through which
    every clustered channel and adhesion molecule is anchored. Two of the
    routes by which patient alleles break this hub were demonstrated directly:
    failure to localise to the AIS, and loss of phosphoinositide binding by the
    pleckstrin homology domain, which is the membrane-facing half of the
    linkage.

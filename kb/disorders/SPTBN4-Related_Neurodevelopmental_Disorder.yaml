    explanation: RNA-level confirmation that a splice-site allele produces an aberrant transcript, which is the evidence standard this entry treats as sufficient for a splicing claim.
  - reference: PMID:42068471
    reference_title: "Severe SPTBN4-Related Neurodevelopmental Disorder: Case Report of Two Siblings with Lethal Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole genome sequencing (WGS) revealed a novel homozygous nonsense c.508 A > T p. (Lys170*) variant in the SPTBN4 gene in the younger sibling"
    explanation: A recent novel truncating allele, and an illustration that reclassification of a VUS after sibling testing can convert a presumed diagnosis into an actionable one.
phenotypes:
- name: Congenital and generalized hypotonia
  category: Neurologic
  diagnostic: true
  description: >-
    Hypotonia present at birth is the entry point to the diagnosis and the
    first-named feature in the disease label. It is generalized rather than
    axial-predominant, and it does not remit; GeneReviews notes that it may
    transition to hypertonia over time in some individuals, and spasticity was
    recorded in two of the ten Saudi patients.
  phenotype_term:
    preferred_term: Generalized hypotonia
    term:
      id: HP:0001290
      label: Generalized hypotonia
  notes: >-
    HPO annotation for OMIM:617519 records HP:0001290 Generalized hypotonia at
    5/5 and HP:0001319 Neonatal hypotonia at 5/5, both sourced to PMID:33772159
    (retrieved 2026-08-01). No FrequencyEnum band is asserted; see the
    entry-level notes.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals typically have congenital hypotonia that may transition to hypertonia."
    explanation: The GeneReviews characterisation of the tone abnormality, including its evolution, which is not captured by the single HPO term.
  - reference: PMID:29861105
    reference_title: "βIV Spectrinopathies Cause Profound Intellectual Disability, Congenital Hypotonia, and Motor Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a severe neurological syndrome that includes congenital hypotonia, intellectual disability, and motor axonal and auditory neuropathy"
    explanation: Names congenital hypotonia as one of the three defining components of the syndrome.
- name: Severe to profound intellectual disability
  category: Neurologic
  diagnostic: true
  description: >-
    Intellectual disability is severe to profound in the great majority of
    affected individuals and is, with hypotonia, the feature that separates
    this disorder from an isolated hereditary neuropathy. The important
    exception is the sibling pair with a splice-site allele in whom cognition
    was normal, which is why the disorder must be considered in an infant with
    axonal neuropathy even when development appears cognitively appropriate.
  phenotype_term:
    preferred_term: Severe intellectual disability
    term:
      id: HP:0010864
      label: Severe intellectual disability
  notes: >-
    HPO annotation for OMIM:617519 records HP:0010864 Severe intellectual
    disability at 5/5, sourced to PMID:33772159 (retrieved 2026-08-01). The
    2018 cohort title uses "profound" (HP:0002187) and GeneReviews uses
    "severe-to-profound"; HP:0010864 is bound rather than HP:0002187 because it
    is the term the HPO annotation set actually carries for this OMIM entity,
    and because the two are sibling severity grades rather than
    parent-and-child, so choosing the more severe one on the strength of a
    paper title would overstate the annotation.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SPTBN4 disorder is typically characterized by severe-to-profound developmental delay and/or intellectual disability, although two individuals in one family had a milder phenotype, including one individual with normal cognitive development."
    explanation: States both the typical severity and the documented exception, which is the whole content of this phenotype's description.
- name: Absent or severely limited speech
  category: Neurologic
  description: >-
    Speech is absent or restricted to single words in nearly every reported
    individual. It is not separable from the global developmental delay, but it
    is recorded separately because it is the feature families notice and
    because it is one of the few domains in which supportive intervention
    (augmentative and alternative communication) has a defined role.
  phenotype_term:
    preferred_term: Absent speech
    term:
      id: HP:0001344
      label: Absent speech
  notes: >-
    HPO annotation for OMIM:617519 records HP:0001344 Absent speech at 5/5,
    sourced to PMID:33772159 (retrieved 2026-08-01).
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with the key features of NEDHND; severe muscular hypotonia, dysphagia, absent speech, gross motor, and mental retardation."
    explanation: Absent speech is listed among the key features present in all patients of this cohort.
- name: Delayed gross motor development
  category: Neurologic
  description: >-
    Gross motor development is severely delayed from the outset. Most affected
    individuals never achieve head control, and most never sit, stand or walk.
    Where motor skills are gained they are not subsequently lost, which
    distinguishes the disorder from a progressive degenerative process.
  phenotype_term:
    preferred_term: Delayed gross motor development
    term:
      id: HP:0002194
      label: Delayed gross motor development
  notes: >-
    HPO annotation for OMIM:617519 records HP:0002194 Delayed gross motor
    development at 5/5 and HP:0002421 Poor head control at 6/6, sourced to
    PMID:33772159 and PMID:28540413 (retrieved 2026-08-01).
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals rarely achieve head control. Most are unable to sit, stand, or walk."
    explanation: Quantifies the motor ceiling that defines the disorder's functional impact.
- name: Poor head control
  category: Neurologic
  description: >-
    Failure of antigravity neck control is the single most consistent physical
    sign, present in every individual in whom it has been assessed, and is a
    direct consequence of combined axial hypotonia and neurogenic weakness.
  phenotype_term:
    preferred_term: Poor head control
    term:
      id: HP:0002421
      label: Poor head control
  notes: >-
    HPO annotation for OMIM:617519 records HP:0002421 at 6/6, sourced to
    PMID:33772159 and PMID:28540413 (retrieved 2026-08-01). The cached abstract
    of neither source names head control, so no evidence item is attached
    rather than a snippet that does not support the claim.
- name: Peripheral axonal neuropathy
  category: Neurologic
  diagnostic: true
  description: >-
    A motor-predominant axonal neuropathy with areflexia is the feature that
    points specifically at SPTBN4 rather than at a generic
    hypotonia-plus-delay syndrome. It is axonal, not demyelinating: motor and
    sensory conduction velocities are normal while motor amplitudes are low.
    Crucially, it is not detectable in every patient - neurophysiology was
    entirely normal in some - so a normal study does not exclude the diagnosis.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  notes: >-
    HPO annotation for OMIM:617519 records HP:0003477 Peripheral axonal
    neuropathy at 2/6 and HP:0007002 Motor axonal neuropathy at 1/1, while
    HP:0007108 Demyelinating peripheral neuropathy is recorded at 0/5, all
    sourced to PMID:33772159 and PMID:28540413 (retrieved 2026-08-01). The low
    numerator for the axonal term reflects how few patients had
    electrophysiology, not how many had neuropathy.
  evidence:
  - reference: PMID:29861105
    reference_title: "βIV Spectrinopathies Cause Profound Intellectual Disability, Congenital Hypotonia, and Motor Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cause a severe neurological syndrome that includes congenital hypotonia, intellectual disability, and motor axonal and auditory neuropathy"
    explanation: Establishes motor axonal neuropathy as a defining component of the syndrome.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies showed normal sensory and motor conduction velocities, with low-amplitude motor responses."
    explanation: The electrophysiological pattern that defines the neuropathy as axonal rather than demyelinating.
- name: Areflexia
  category: Neurologic
  description: >-
    Absent deep tendon reflexes accompany the motor axonal neuropathy and are
    the bedside sign most likely to redirect a hypotonic infant's differential
    from central hypotonia towards a neuropathy. Brisk reflexes have
    nonetheless been recorded in individual patients, so areflexia is usual but
    not obligatory.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  notes: >-
    HPO annotation for OMIM:617519 records HP:0001284 Areflexia at 5/6, sourced
    to PMID:33772159 and PMID:28540413 (retrieved 2026-08-01). One patient in
    the 2021 cohort had brisk reflexes without clonus, which is the basis for
    the qualification in the description and is full-text rather than abstract
    content.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Axonal motor neuropathy leads to hyporeflexia/areflexia and weakness"
    explanation: Attributes the reflex loss directly to the axonal neuropathy, which is the causal claim this phenotype makes.
- name: Generalized amyotrophy
  category: Neurologic
  description: >-
    Generalized and distal muscle wasting develops as a consequence of chronic
    denervation, and is the visible counterpart of the EMG denervation
    signature. It is recorded here as a neurogenic rather than a myopathic
    phenotype, consistent with the conditional-knockout evidence that beta-IV
    spectrin is not expressed in skeletal muscle.
  phenotype_term:
    preferred_term: Generalized amyotrophy
    term:
      id: HP:0003700
      label: Generalized amyotrophy
  notes: >-
    HPO annotation for OMIM:617519 records HP:0003700 Generalized amyotrophy at
    5/6 and HP:0003693 Distal amyotrophy at 4/5, sourced to PMID:33772159 and
    PMID:28540413 (retrieved 2026-08-01). Note that the 2021 cohort's own table
    labels HP:0009055 as "Generalized muscle atrophy"; the canonical HPO label
    for HP:0009055 verified with OAK on 2026-08-01 is "Generalized limb muscle
    atrophy", so the broader HP:0003700 used by the HPO annotation set is bound
    here instead.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMG showed signs of acute and chronic denervation such as fibrillation potentials and positive sharp waves"
    explanation: The denervation evidence that makes the wasting neurogenic rather than myopathic.
- name: Sensorineural hearing impairment (auditory neuropathy)
  category: Otologic
  description: >-
    Hearing loss in this disorder is an auditory neuropathy: outer hair cell
    function is preserved (otoacoustic emissions present) while brainstem
    auditory conduction fails. It is a minority feature despite being named in
    the disease label - present in roughly a fifth to two fifths of reported
    individuals depending on the series and on whether it was formally tested.
    Its neuropathic character matters practically, because auditory neuropathy
    responds poorly to conventional amplification.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    HPO annotation for OMIM:617519 records HP:0000407 Sensorineural hearing
    impairment at 2/5, sourced to PMID:33772159 (retrieved 2026-08-01); the
    2025 natural-history review of 38 patients reports deafness in 21%. Both
    figures are far below what the disease name implies. In the 2021 cohort
    three of five patients were recorded as clinically unaffected without
    formal audiology, so the true figure is likely between the two. HPO has no
    term for auditory neuropathy - searches of `sqlite:obo:hp` for both
    `l~auditory neuropathy` and free-text `auditory neuropathy` returned
    nothing on 2026-08-01 - so the sensorineural term is bound and the
    neuropathic character is carried by the separate absent-brainstem-response
    phenotype below.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, scoliosis, deafness, and seizure are still present in some of the affected individuals (25%, 21%, and 21%, respectively)."
    explanation: The largest available denominator for hearing loss in this disorder, and the source of the statement that deafness is a minority feature.
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cortical visual impairment and auditory neuropathy have also been reported."
    explanation: GeneReviews classifies the hearing loss specifically as auditory neuropathy rather than as cochlear deafness.
- name: Absent brainstem auditory evoked responses
  category: Otologic
  description: >-
    Absent or grossly abnormal auditory brainstem responses with preserved
    otoacoustic emissions is the electrophysiological signature of auditory
    neuropathy and is the objective test that establishes the site of the
    lesion. It is feasible in infants in whom behavioural audiometry is not.
  phenotype_term:
    preferred_term: Absent brainstem auditory responses
    term:
      id: HP:0004463
      label: Absent brainstem auditory responses
  notes: >-
    HPO annotation for OMIM:617519 records HP:0004463 at 1/2, sourced to
    PMID:33772159 (retrieved 2026-08-01). The denominator of 2 reflects how few
    patients were tested.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otoacoustic emissions were present. In brainstem evoked response audiometry (BERA) only wave 1 from the inner ear could be recorded pointing to a defect at the level of cochlear nerve conduction."
    explanation: The paired result - preserved emissions with absent central waves - that defines the deficit as auditory neuropathy rather than cochlear hearing loss.
- name: Feeding difficulties and dysphagia
  category: Gastrointestinal
  description: >-
    Bulbar weakness produces poor suck from the newborn period, then dysphagia,
    gastro-oesophageal reflux and failure to thrive. Most affected individuals
    eventually require gastrostomy feeding. This is the phenotype that drives
    the disorder's dominant complication, aspiration pneumonia, and is
    therefore the single most actionable feature in management.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  notes: >-
    HPO annotation for OMIM:617519 records HP:0011968 Feeding difficulties at
    6/6, HP:0002033 Poor suck at 6/6, HP:0002015 Dysphagia at 5/5,
    HP:0002020 Gastroesophageal reflux at 3/3 and HP:0011471 Gastrostomy tube
    feeding in infancy at 4/5, sourced to PMID:33772159 and PMID:28540413
    (retrieved 2026-08-01). The 2025 review reports gastrointestinal problems
    in 15 patients (54%). The review does not state the denominator for that
    percentage; 15/54% back-calculates to about 28, not the 38 patients
    tabulated overall, so the fraction is a curator inference.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dysphagia, and gastrostomy tube feeding during infancy were reported in 15 patients (54%)"
    explanation: Quantifies the gastrointestinal burden across the pooled published cohort.
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most affected individuals require tube feeding for nutrition."
    explanation: The GeneReviews statement of the usual outcome, which is the basis for anticipatory gastrostomy planning.
- name: Recurrent aspiration and respiratory insufficiency
  category: Respiratory
  description: >-
    Recurrent aspiration pneumonia follows directly from bulbar weakness and a
    weak cough, and progresses in some individuals to restrictive lung disease
    requiring tracheostomy and home ventilation. It is the usual cause of death
    in this disorder.
  phenotype_term:
    preferred_term: Recurrent infections due to aspiration
    term:
      id: HP:0004891
      label: Recurrent infections due to aspiration
  notes: >-
    HPO annotation for OMIM:617519 records HP:0004891 Recurrent infections due
    to aspiration at 5/5, sourced to PMID:33772159 (retrieved 2026-08-01). The
    2025 review reports respiratory difficulties in 17 patients (61%), of whom
    10 had recurrent pneumonia, 2 progressed to restrictive lung disease and 2
    died of respiratory failure.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory difficulties were seen in 17 patients (61%)."
    explanation: Quantifies the respiratory burden in the pooled cohort.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the 17 patients died at age of 14 months and 3 years due to respiratory failure."
    explanation: Establishes respiratory failure as the mode of death in this disorder.
- name: Seizures
  category: Neurologic
  description: >-
    Clinical seizures occur in a substantial minority and are refractory to
    medication in some. They coexist with a distinct and probably more common
    finding, an abundantly epileptiform EEG in a child who has never had a
    clinical fit. Reported seizure frequency varies more than fourfold across
    sources and no single figure is asserted here.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    The four sources disagree. GeneReviews: half of affected individuals
    develop seizures. The 2021 cohort report: more than half develop seizures
    or have a pathological EEG - a compound endpoint, not the same claim. The
    2025 natural-history review of 38 patients: seizures in 21%. The HPO
    annotation set for OMIM:617519 (retrieved 2026-08-01): HP:0001250 with
    frequency modifier "Very rare", sourced to OMIM. No FrequencyEnum band is
    asserted, and the discrepancy is recorded as an explicit knowledge-gap
    discussion rather than averaged away.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Half of affected individuals develop seizures."
    explanation: The GeneReviews estimate, one of the four mutually inconsistent figures recorded in the notes.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is highlighted with neuropathy, muscle weakness, and infrequent appearance of seizures in the affected individuals."
    explanation: >-
      Marked PARTIAL because it directly contradicts the GeneReviews estimate
      quoted above. Both are retained so the disagreement is visible in the
      data rather than resolved by curator preference.
- name: Epileptiform EEG without clinical seizures
  category: Neurologic
  description: >-
    Abundant to nearly continuous epileptiform discharges recorded on
    prolonged EEG in individuals who have never had an observed clinical
    seizure. In one patient this was documented on 72-hour EEG and in another
    on 24-hour video EEG with explicit parental confirmation that no fits had
    ever occurred. It is modelled as a distinct phenotype from clinical
    seizures because it has different management implications and because it
    is the human observation that most directly reflects the nodal KCNQ2
    clustering failure.
  phenotype_term:
    preferred_term: Interictal epileptiform activity
    term:
      id: HP:0011182
      label: Interictal epileptiform activity
  notes: >-
    HP:0011182 is bound rather than its parent HP:0002353 EEG abnormality
    because its HPO definition ("Interictal epileptiform activity refers to
    such activity that occurs in the absence of a clinical or subclinical
    seizure") names exactly the finding described here; ancestry confirmed with
    `runoak -i sqlite:obo:hp ancestors -p i HP:0011182`, which lists
    HP:0002353. The HPO annotation set for OMIM:617519 records only the parent,
    HP:0002353 EEG abnormality, at 2/2, sourced to PMID:33772159 (retrieved
    2026-08-01); since no FrequencyEnum band is asserted anywhere in this entry
    that parent-level count is recorded here rather than driving the binding.
    Whether such discharges
    warrant antiseizure treatment in a child with no clinical events is not
    addressed anywhere in the literature and is not asserted here.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though two of our patients did not exhibit clinically manifest seizures, their EEGs showed highly pathologic epileptiform discharges."
    explanation: States both halves of this phenotype in a single sentence - absence of clinically manifest seizures together with the presence of highly pathologic epileptiform discharges on EEG.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-two-hour EEG showed abundant to nearly continuous centro-parietal sharp/spike/poly-spike wave discharges during sleep without clinical correlation to manifest seizures."
    explanation: The 72-hour recording in Patient 3, which is the source of the "abundant to nearly continuous" characterisation used in the description.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No clinical seizures were observed in a 24-h video EEG recording. The parents had never observed any type of fits or seizures."
    explanation: The second patient, and the source of the explicit parental confirmation that no fits had ever occurred.
- name: Horizontal nystagmus
  category: Ophthalmologic
  description: >-
    Horizontal nystagmus is the commonest eye movement abnormality reported and
    sits within a broader ocular phenotype that ranges from nystagmus and
    cortical visual impairment to blindness from optic atrophy.
  phenotype_term:
    preferred_term: Horizontal nystagmus
    term:
      id: HP:0000666
      label: Horizontal nystagmus
  notes: >-
    HPO annotation for OMIM:617519 records HP:0000666 Horizontal nystagmus at
    2/5, sourced to PMID:33772159 (retrieved 2026-08-01). The 2025 review
    reports ocular abnormalities of any kind in 43% of patients.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional symptoms comprised horizontal nystagmus, epileptiform discharges in EEG without manifest seizures, and choreoathetosis."
    explanation: Names horizontal nystagmus among the features that expanded the recognised phenotype.
- name: Cerebral visual impairment
  category: Ophthalmologic
  description: >-
    Cortical (cerebral) visual impairment is recorded in the OMIM phenotype
    description and in GeneReviews. Optic atrophy has been reported separately
    in at least one severely affected individual, so visual loss in this
    disorder can be pre-geniculate, post-geniculate or both.
  phenotype_term:
    preferred_term: Cerebral visual impairment
    term:
      id: HP:0100704
      label: Cerebral visual impairment
  notes: >-
    HPO annotation for OMIM:617519 records HP:0100704 Cerebral visual
    impairment sourced to OMIM:617519 itself, with no frequency (retrieved
    2026-08-01). GeneReviews recommends ophthalmology review every one to two
    years in those with optic atrophy, which implies optic atrophy is expected
    to occur but does not quantify it.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cortical visual impairment and auditory neuropathy have also been reported."
    explanation: The GeneReviews statement recording cortical visual impairment as part of the phenotype.
- name: Myopathic facies
  category: Craniofacial
  description: >-
    A mask-like face with weak facial musculature, tented upper lip and often a
    high arched palate is present in essentially every reported individual and
    is a useful gestalt cue. It reflects facial and bulbar neurogenic weakness
    rather than a dysmorphic syndrome.
  phenotype_term:
    preferred_term: Myopathic facies
    term:
      id: HP:0002058
      label: Myopathic facies
  notes: >-
    HPO annotation for OMIM:617519 records HP:0002058 Myopathic facies at 6/6
    and HP:0000218 High palate at 5/6, sourced to PMID:33772159 and
    PMID:28540413 (retrieved 2026-08-01). The term label says "myopathic" but
    on the current mechanistic reading the weakness is neurogenic; the HPO
    label is retained unchanged because it is the canonical term.
  evidence:
  - reference: PMID:31857255
    reference_title: "A novel homozygous splice-site mutation in the SPTBN4 gene causes axonal neuropathy without intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that muscular hypotonia, myopathic facies with ptosis and axonal neuropathy can be the core clinical features in the SPTBN4 disorder"
    explanation: Places myopathic facies among the minimal core features, present even at the mild end of the spectrum.
- name: Type 1 muscle fiber atrophy
  category: Musculoskeletal
  description: >-
    Muscle biopsy, where performed, most often shows selective atrophy or
    hypotrophy of type 1 (slow) fibres, sometimes described as incomplete
    congenital fibre-type disproportion. Whether this is a primary myopathic
    change or the consequence of chronic denervation is contested; see the
    "Contested Skeletal Muscle Involvement" pathophysiology node.
  phenotype_term:
    preferred_term: Type 1 muscle fiber atrophy
    term:
      id: HP:0011807
      label: Type 1 muscle fiber atrophy
  notes: >-
    HPO annotation for OMIM:617519 records HP:0011807 Type 1 muscle fiber
    atrophy at 3/3 and HP:0003554 Type 2 muscle fiber atrophy at 1/2, sourced
    to PMID:33772159 and PMID:28540413 (retrieved 2026-08-01). Muscle biopsy
    was performed in only 8 of the 38 patients in the pooled review (21.1%), so
    these denominators describe who was biopsied, not who has the finding.
  evidence:
  - reference: PMID:28540413
    reference_title: "A recessive mutation in beta-IV-spectrin (SPTBN4) associates with congenital myopathy, neuropathy, and central deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the human phenotype of βIV-spectrin deficiency included a myopathy with incomplete congenital fiber-type disproportion"
    explanation: The original description of the muscle finding, which is the claim later disputed on mechanistic grounds.
- name: Scoliosis
  category: Musculoskeletal
  description: >-
    Scoliosis develops secondary to axial hypotonia and immobility rather than
    as a primary skeletal feature, and accumulates with age.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  notes: >-
    HPO annotation for OMIM:617519 records HP:0002650 Scoliosis at 3/6, sourced
    to PMID:33772159 and PMID:28540413 (retrieved 2026-08-01); the 2025 review
    reports 25%.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, scoliosis, deafness, and seizure are still present in some of the affected individuals (25%, 21%, and 21%, respectively)."
    explanation: The pooled-cohort frequency for scoliosis alongside deafness and seizures.
- name: Choreoathetosis
  category: Neurologic
  description: >-
    Choreoathetoid movements of the arms, sometimes with intermittent dystonia,
    were described in one patient and expanded the recognised phenotype to
    include a hyperkinetic movement disorder. It is uncommon and its
    relationship to the nodal mechanism is unexplained.
  phenotype_term:
    preferred_term: Choreoathetosis
    term:
      id: HP:0001266
      label: Choreoathetosis
  notes: >-
    HPO annotation for OMIM:617519 records HP:0001266 Choreoathetosis at 1/5,
    sourced to PMID:33772159 (retrieved 2026-08-01).
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variably present features of areflexia, axonal motor neuropathy, nystagmus, epileptiform activity in EEG without clinical correlation, and a movement disorders with choreoathetosis."
    explanation: The authors' own statement that choreoathetosis is a variably present addition to the phenotype.
- name: Ataxia
  category: Neurologic
  description: >-
    Ataxia is the most surprising feature in the phenotypic spectrum, because
    it is cardinal in the quivering mouse yet was absent from every human
    report until two siblings in one Saudi family were described. Its rarity in
    humans, set against its prominence in the mouse, is one of the clearest
    human-model mismatches in this disorder.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  notes: >-
    Not present in the HPO annotation set for OMIM:617519 as retrieved on
    2026-08-01. Curated from the 2025 natural-history review, in which ataxia
    was present in 2 of 10 patients, both in family 1, and had never previously
    been reported in the disorder. The same family also had cerebellar vermian
    atrophy on MRI.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ataxia was never reported in any NEDHND patients; however, two patients in our cohort suffered from ataxia"
    explanation: Documents both the novelty of ataxia in this disorder and its rarity, which is the basis for the human-model mismatch recorded below.
- name: Cerebellar vermis atrophy
  category: Neurologic
  description: >-
    Vermian atrophy is one of the non-specific MRI abnormalities reported, and
    is the imaging correlate of the ataxia described in the one affected
    family. Neuroimaging is normal in a substantial minority of patients
    overall, so a normal MRI does not argue against the diagnosis.
  phenotype_term:
    preferred_term: Cerebellar vermis atrophy
    term:
      id: HP:0006855
      label: Cerebellar vermis atrophy
  notes: >-
    Not present in the HPO annotation set for OMIM:617519 as retrieved on
    2026-08-01. Curated from the 2025 natural-history review, which found
    abnormal MRI in 14 of 22 patients with imaging available and lists vermian
    atrophy first among the abnormalities.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such abnormalities included vermian atrophy, diffuse T2-hyperintensity, mildly enlarged CSF spaces, cerebral atrophy, and white matter abnormalities."
    explanation: Names vermian atrophy among the reported structural findings.
histopathology:
- name: Type 1 fiber hypotrophy without frank fiber-type disproportion
  description: >-
    ATPase pH 4.3 staining in patient muscle shows selective reduction of type
    1 fibre diameter relative to type 2, quantified by minimal Feret diameter,
    without the complete fibre-type disproportion classically defined for
    congenital myopathies. The founding case was described as having incomplete
    congenital fibre-type disproportion, and the corresponding quivering mouse
    muscle showed complete absence of type 1 fibres.
  diagnostic: false
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATPase pH 4.3 staining and IHC with an antibody directed against myosin heavy chain slow (MHC neonatal, NCL-MHCn, Novocastra, 1:20) revealed a reduction of type 1 fiber diameters but no manifest fiber-type disproportion"
    explanation: The precise histological finding, including the explicit negative for frank fibre-type disproportion.
  notes: >-
    Recorded as a finding, not as a mechanism. Whether this appearance is
    primary or denervation-driven is the subject of the "Contested Skeletal
    Muscle Involvement" pathophysiology node. Muscle biopsy was performed in
    only 8 of 38 reported patients.
- name: Neurogenic changes with atrophic fascicles and angulated fibers
  description: >-
    In other patients the biopsy is unambiguously neurogenic: atrophic
    fascicles, small angulated fibres of both types next to fibres of preserved
    diameter, and fibre grouping. The coexistence of this picture with the
    type 1 hypotrophy picture in different patients from the same cohort is the
    empirical basis of the myopathy-versus-neuropathy debate.
  diagnostic: false
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "H&E/Gömöri-trichrome staining of a muscle biopsy sample from Patient 5 showed clear signs of neurogenic changes with atrophic fascicles, dark fibers (type 1) as well as brighter fibers (type 2) small and angulated fibers next to populations of muscle fibers with preserved diameter and groups of small fibers"
    explanation: The neurogenic biopsy pattern, which is what the current mechanistic reading predicts should be the universal finding.
- name: Absent beta-IV-spectrin immunostaining in patient muscle
  description: >-
    Immunohistochemistry with an anti-beta-IV-spectrin antibody shows no signal
    in patient muscle where age-matched control muscle stains, while a
    pan-beta-spectrin antibody stains the sarcolemma normally in both. This was
    the original evidence that beta-IV spectrin is a sarcolemmal protein whose
    loss could cause myopathy directly.
  diagnostic: false
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "IHC with an antibody directed against the non-erythrocytic βIV-spectrin subtype 4 (sc-368195, H-85, Santa-Cruz, 1:100) showed no staining in Patient 3, while staining was preserved in age-matched control muscle."
    explanation: >-
      Marked PARTIAL rather than SUPPORT. The observation is real, but a
      subsequent muscle-specific conditional knockout reported that beta-4
      spectrin is not present in muscle at all (PMID:38441922), which implies
      the control-muscle signal these antibodies detect may not be beta-IV
      spectrin. Neither study included a knockout-muscle antibody control at
      the time the human staining was performed.
diagnosis:
- name: Exome or genome sequencing with bi-allelic SPTBN4 variant interpretation
  description: >-
    Diagnosis is molecular. In a hypotonic infant with global developmental
    delay, exome or genome sequencing identifying bi-allelic SPTBN4 variants
    against transcript NM_020971 establishes the diagnosis. Three
    interpretation points follow from the published series. First, parental
    testing is required to confirm the variants are in trans, since
    heterozygotes are unaffected. Second, if only one variant is found, look
    for a structural second allele: a multi-exon deletion has been reported in
    trans to a point variant. Third, splice-site variants of uncertain effect
    should be resolved at RNA level where patient material allows, as has been
    done for two SPTBN4 alleles.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of SPTBN4 disorder is established in a proband with congenital hypotonia and biallelic pathogenic (or likely pathogenic) variants in SPTBN4 identified by molecular genetic testing."
    explanation: The formal diagnostic criterion from GeneReviews.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for large genomic SPTBN4 rearrangements should improve molecular diagnostic rates for this population, in particular for patients where only a single variant that affects function has been identified."
    explanation: Supports the specific recommendation to pursue copy-number analysis when only one sequence variant is found.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it seems rational that SPTBN4 genetic testing should also be considered in patients with early-onset hypotonia, motor developmental delay, and intellectual disability, especially in the presence of axonal neuropathy, deafness, or pathological discharge patterns on the EEG"
    explanation: Defines the clinical trigger for testing, including the three features that raise the pre-test probability.
- name: Neurophysiology (nerve conduction studies and EMG)
  description: >-
    Nerve conduction studies and EMG establish the axonal, motor-predominant
    character of the neuropathy: low-amplitude motor responses with preserved
    conduction velocities, plus fibrillation potentials, positive sharp waves
    and enlarged motor unit potentials. The important caveat is that
    neurophysiology can be entirely normal in affected individuals, so it
    supports but does not gate the diagnosis.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies showed normal sensory and motor conduction velocities, with low-amplitude motor responses."
    explanation: The characteristic axonal pattern that neurophysiology is performed to detect.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiology revealed signs of obvious neuropathy only in Patient 5."
    explanation: >-
      Marked PARTIAL because it qualifies the test's sensitivity: only one of
      five patients in this cohort had an unambiguously neuropathic study, so a
      normal result does not exclude the diagnosis.
- name: Auditory brainstem response with otoacoustic emissions
  description: >-
    Because the hearing loss is an auditory neuropathy, the pairing of tests
    matters more than either alone: otoacoustic emissions test the cochlea and
    auditory brainstem responses test the nerve and brainstem pathway.
    Preserved emissions with absent or wave-I-only brainstem responses
    localises the lesion and predicts poor benefit from simple amplification.
    This is feasible in infants who cannot cooperate with behavioural
    audiometry.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otoacoustic emissions were present. In brainstem evoked response audiometry (BERA) only wave 1 from the inner ear could be recorded pointing to a defect at the level of cochlear nerve conduction."
    explanation: The worked example of the paired testing strategy and its interpretation in this disorder.
- name: Prolonged EEG
  description: >-
    Prolonged or overnight EEG is worth performing even without a history of
    clinical seizures, because abundant epileptiform discharge has been
    documented in patients whose parents had never observed a fit. Its
    therapeutic implications are undefined, but it changes the interpretation
    of paroxysmal events and of developmental plateauing.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-two-hour EEG showed abundant to nearly continuous centro-parietal sharp/spike/poly-spike wave discharges during sleep without clinical correlation to manifest seizures."
    explanation: Demonstrates that the epileptiform abnormality is only detectable on prolonged recording and is sleep-activated.
  notes: >-
    The 2025 natural-history review found EEG data available for only 12 of 38
    patients, of whom 5 were abnormal. That denominator is small and
    ascertainment-biased towards patients with clinical events, which is one
    reason the reported seizure frequency varies so widely across sources.
differential_diagnoses:
- name: Spinal muscular atrophy type 1
  disease_term:
    preferred_term: spinal muscular atrophy, type 1
    term:
      id: MONDO:0009669
      label: spinal muscular atrophy, type 1
  description: >-
    The dominant clinical mimic and the diagnosis SPTBN4 patients are actually
    tested for first. A floppy infant with profound weakness, areflexia, poor
    suck, tongue involvement, respiratory compromise and denervation on EMG is
    SMA type 1 until proven otherwise, and both the 2021 cohort and the 2026
    sibling report describe SMA testing being sent and returning negative
    before SPTBN4 was found. The distinction is now urgent rather than
    academic: approved disease-modifying therapy exists for SMA and none
    exists for SPTBN4 disease, so misdiagnosis in either direction has direct
    consequences. (No reference cached for this entry states the SMA treatment
    landscape; the claim is general clinical background, not a sourced
    assertion.)
  distinguishing_features:
  - SMN1 testing (deletion/dosage) resolves the question directly and should precede or accompany exome sequencing in any floppy infant.
  - Cognition is typically normal in SMA type 1 but severely impaired in most SPTBN4 disease, so intellectual disability argues for SPTBN4.
  - Auditory neuropathy and an epileptiform EEG are not features of SMA and, when present, point strongly to SPTBN4.
  - Nystagmus, choreoathetosis and cerebral visual impairment occur in SPTBN4 disease and not in SMA.
  - Muscle biopsy in SMA shows large-group fascicular atrophy with hypertrophic type 1 fibres; SPTBN4 biopsies more often show type 1 hypotrophy or patchy neurogenic change.
  notes: >-
    MONDO:0009669 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:11117` returns it as an SMN1 disease
    with the label "spinal muscular atrophy, type 1"); SMN1 is hgnc:11117, also
    verified. The existing dismech entry `kb/disorders/Spinal_Muscular_Atrophy.yaml`
    is bound to the broader MONDO:0001516, not to this type-specific term, so
    the two are not the same entity and no content was copied.
  evidence:
  - reference: PMID:42068471
    reference_title: "Severe SPTBN4-Related Neurodevelopmental Disorder: Case Report of Two Siblings with Lethal Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients exhibited severe failure to thrive, hypotonia, dysphagia, and global developmental delay, initially suggesting spinal muscular atrophy (SMA)."
    explanation: Documents that SMA was the working diagnosis in a real SPTBN4 family, which is why this differential is listed first.
- name: KCNQ2 developmental and epileptic encephalopathy
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 7
    term:
      id: MONDO:0013387
      label: developmental and epileptic encephalopathy, 7
  description: >-
    A mechanistic rather than a clinical differential, and the closest thing
    this disorder has to a pathway relative. KCNQ2 encodes the channel subunit
    that beta-IV spectrin positions at the node; SPTBN4 disease produces nodes
    with no detectable KCNQ2. The 2021 cohort report proposed exactly this
    overlap when explaining the epileptiform EEGs. The two disorders converge
    on absent nodal M-current from opposite directions - one by losing the
    channel, the other by losing the scaffold that places it.
  distinguishing_features:
  - KCNQ2-DEE is a de novo dominant channelopathy; SPTBN4 disease is autosomal recessive, so unaffected consanguineous parents favour SPTBN4.
  - Seizures dominate the KCNQ2-DEE presentation from the neonatal period, whereas in SPTBN4 disease hypotonia and weakness dominate and the epileptiform activity is frequently subclinical.
  - Peripheral axonal neuropathy, areflexia and auditory neuropathy are features of SPTBN4 disease and not of KCNQ2-DEE.
  - Sodium-channel blockers are a rational therapy in KCNQ2 gain-of-function disease; no analogous targeted option exists for SPTBN4 disease.
  notes: >-
    MONDO:0013387 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:6296` returns MONDO:0013387
    "developmental and epileptic encephalopathy, 7" and MONDO:0007365
    "seizures, benign familial neonatal, 1"); KCNQ2 is hgnc:6296, also
    verified. MONDO:0013387 matches the disease_term already bound in
    `kb/disorders/KCNQ2_Developmental_and_Epileptic_Encephalopathy.yaml`, and
    MONDO:0007365 appears in `kb/disorders/Benign_Neonatal_Seizures.yaml` only
    as a `has_subtypes` subtype_term - that file's own disease_term is
    MONDO:0016027 `benign neonatal seizures`. No content was copied from
    either.
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As βIV-spectrin plays a role in the clustering of KCNQ2 subunit-containing potassium channels, there could be some degree of overlap of clinical symptoms with early-infantile epileptic encephalopathy type 7 and with benign familial neonatal seizures type 1."
    explanation: The authors' own proposal of this mechanistic overlap, which is the reason the differential is curated.
- name: ANK3-related intellectual disability-hypotonia-spasticity-sleep disorder syndrome
  disease_term:
    preferred_term: intellectual disability-hypotonia-spasticity-sleep disorder syndrome
    term:
      id: MONDO:0014210
      label: intellectual disability-hypotonia-spasticity-sleep disorder syndrome
  description: >-
    The other half of the scaffold. AnkyrinG and beta-IV spectrin stabilise
    each other reciprocally at the axon initial segment and node, so losing
    either delocalises the other, and the recessive ANK3 syndrome accordingly
    pairs intellectual disability with hypotonia. Curating the pair makes the
    point that the AIS/nodal scaffold is a disease module rather than a set of
    unrelated genes.
  distinguishing_features:
  - Spasticity and a prominent sleep disorder characterise the ANK3 syndrome and are not core features of SPTBN4 disease.
  - Motor axonal neuropathy with areflexia and auditory neuropathy are characteristic of SPTBN4 disease and are not the ANK3 phenotype.
  - ANK3 also has a separate dominant neurodevelopmental/psychiatric association, so the inheritance pattern must be established before the phenotype is interpreted.
  - The two are distinguished definitively by the causal gene, not clinically.
  notes: >-
    MONDO:0014210 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:494` returns it as the only ANK3
    disease term); ANK3 is hgnc:494, also verified. There is no ANK3 entry in
    kb/disorders/ at the time of curation, so no cross-entry consistency check
    was possible. No evidence item is attached: the contrast is a reasoned
    mechanistic cross-reference rather than a quotable finding.
- name: SPTAN1-related developmental and epileptic encephalopathy 5
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 5
    term:
      id: MONDO:0013277
      label: developmental and epileptic encephalopathy, 5
  description: >-
    The alpha-spectrin partner. Alpha-II spectrin, encoded by SPTAN1, is the
    obligate alpha-subunit that pairs with beta-spectrins to form the axonal
    tetramer, and it forms the periodic AIS cytoskeleton alongside beta-IV
    spectrin. Its dominant variants cause a severe epileptic encephalopathy
    with hypomyelination, and heterozygous loss of function has more recently
    been linked to a distal myopathy with neurogenic features - a phenotypic
    convergence with SPTBN4 that is not coincidental.
  distinguishing_features:
  - SPTAN1-DEE is autosomal dominant, usually de novo, with in-frame dominant-negative variants; SPTBN4 disease is recessive loss of function.
  - Infantile spasms with hypsarrhythmia and progressive brain atrophy with hypomyelination characterise SPTAN1-DEE; SPTBN4 imaging is normal in a substantial minority and shows only non-specific change when abnormal.
  - Auditory neuropathy and areflexic motor axonal neuropathy point to SPTBN4 rather than SPTAN1.
  notes: >-
    MONDO:0013277 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:11273` returns four SPTAN1 disease
    terms, of which MONDO:0013277 "developmental and epileptic encephalopathy,
    5" is the classic one; the others are MONDO:0957813, MONDO:0957815 and
    MONDO:0957875); SPTAN1 is hgnc:11273, also verified. Note that the
    SPTAN1/SPTBN4 myopathy paper found in the literature search
    (PMID:40842327) returned no abstract text when fetched, so the myopathy
    convergence mentioned in this description is stated in the description only
    and is not supported by a snippet.
  evidence:
  - reference: PMID:36697767
    reference_title: "Spectrins: molecular organizers and targets of neurological disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic variants in SPTAN1, SPTBN1, SPTBN2 and SPTBN4, four of the six genes encoding neuronal spectrins, cause neurological disorders."
    explanation: Establishes the neuronal spectrinopathies as a coherent gene family whose members must be distinguished from one another.
- name: SPTBN1-related developmental delay, impaired speech, and behavioral abnormalities
  disease_term:
    preferred_term: developmental delay, impaired speech, and behavioral abnormalities
    term:
      id: MONDO:0859178
      label: developmental delay, impaired speech, and behavioral abnormalities
  description: >-
    The beta-II spectrin sibling disorder. Beta-II spectrin is the general
    axonal beta-subunit, present along the axon shaft rather than concentrated
    at excitable domains, and its dominant variants cause developmental delay
    with impaired speech and behavioural abnormalities. Together with SPTBN2
    ataxia and SPTBN5 disease it illustrates why beta-spectrin paralogues, all
    building the same lattice, produce non-overlapping diseases: they differ in
    where in the neuron they are deployed.
  distinguishing_features:
  - SPTBN1 disease is autosomal dominant; SPTBN4 disease is recessive.
  - Autism and behavioural abnormality dominate the SPTBN1 phenotype; profound motor disability, areflexia and neuropathy dominate SPTBN4.
  - Congenital hypotonia with feeding and respiratory failure is not the SPTBN1 presentation.
  notes: >-
    MONDO:0859178 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:11275` returns it as the only SPTBN1
    disease term); SPTBN1 is hgnc:11275, also verified. Sibling
    beta-spectrin disorders that were looked up but NOT curated as separate
    differentials, to avoid padding: SPTBN2 spinocerebellar ataxia type 5
    (MONDO:0010848) and autosomal recessive spinocerebellar ataxia 14
    (MONDO:0014159), both verified against hgnc:11276. They are cerebellar
    ataxias with no hypotonia-neuropathy-deafness overlap.
  evidence:
  - reference: PMID:36697767
    reference_title: "Spectrins: molecular organizers and targets of neurological disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite their structural similarity and shared role as molecular organizers at the cell membrane, spectrins vary in expression, subcellular localization and specialization in neurons, and this variation partly underlies non-overlapping disease presentations across spectrinopathies."
    explanation: States the principle that separates the spectrinopathies from one another, which is the substance of this differential.
- name: Congenital fiber-type disproportion myopathy
  disease_term:
    preferred_term: congenital fiber-type disproportion myopathy
    term:
      id: MONDO:0009711
      label: congenital fiber-type disproportion myopathy
  description: >-
    The differential that the muscle biopsy creates. A hypotonic infant whose
    biopsy shows small type 1 fibres will be labelled congenital fibre-type
    disproportion, and the first SPTBN4 patient was described in exactly those
    terms. Because the current mechanistic reading holds that the muscle
    pathology in SPTBN4 disease is neurogenic, this is a differential that
    exists because of a shared histological appearance rather than a shared
    mechanism.
  distinguishing_features:
  - Congenital fibre-type disproportion is genetically heterogeneous (ACTA1, TPM3, RYR1, SELENON and others) and is a histological label, not a single disease.
  - Areflexia, denervation on EMG and auditory neuropathy point away from a primary congenital myopathy and towards SPTBN4.
  - Severe intellectual disability is not a feature of the classical congenital myopathies and is present in most SPTBN4 patients.
  - In SPTBN4 disease the fibre-type disproportion is characteristically incomplete or absent, with type 1 hypotrophy only.
  notes: >-
    MONDO:0009711 was verified with OAK; note that a second, obsolete term
    (MONDO:0000865 "obsolete congenital fiber-type disproportion") also matches
    the search string and was deliberately not used. No evidence item is
    attached; the contrast is a reasoned histological comparison rather than a
    quoted finding.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists. Management follows the components of
    the phenotype: developmental, educational and communication support;
    physiotherapy and orthotics for weakness, contractures and scoliosis; and
    surveillance for the complications that determine survival.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "standard treatment for developmental delay / intellectual disability, epilepsy, cortical vision impairment, constipation, and spasticity / joint contractures"
    explanation: The GeneReviews management recommendation, which is explicitly standard supportive care rather than anything disorder-specific.
- name: Nutritional management (feeding therapy and gastrostomy)
  description: >-
    Feeding therapy and, when aspiration risk or growth failure persists,
    gastrostomy placement. Anticipating this rather than reacting to a
    pneumonia is part of the practical core of care in this disorder, because
    dysphagia and recurrent aspiration are what precipitate the respiratory
    failure that is the usual cause of death.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: enteral nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "feeding therapy and consideration of gastrostomy tube placement for persistent feeding difficulties and/or concern about aspiration"
    explanation: The GeneReviews recommendation for the feeding and aspiration problem.
- name: Ventilatory support
  description: >-
    Non-invasive or invasive ventilatory support for respiratory distress, with
    tracheostomy in the most affected. This is the intervention that most
    directly changes survival, since neuromuscular respiratory failure is the
    usual cause of death.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: ventilatory support
    term:
      id: NCIT:C15322
      label: Respiratory Therapy
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ventilator support (e.g., BiPAP) for respiratory distress"
    explanation: The GeneReviews recommendation for the complication that drives mortality.
- name: Hearing support with amplification
  description: >-
    Hearing aids are recommended for those with hearing loss, but the
    neuropathic character of the deficit tempers the expectation: in auditory
    neuropathy the cochlea works and the nerve does not, so amplification
    addresses the wrong part of the pathway. The paired otoacoustic-emission
    and brainstem-response testing that should precede a decision about
    amplification is a diagnostic action and is curated separately under
    diagnosis ("Auditory brainstem response with otoacoustic emissions");
    this entry covers only the amplification/hearing-support intervention.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: DEVICE
  notes: >-
    The caveat about amplification in auditory neuropathy is a mechanistic
    inference from this entry's own "Central Auditory Conduction Failure" node,
    not a recommendation found in any SPTBN4 source, and is deliberately
    written into the description rather than attached to a snippet.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing aids may be helpful for those with hearing loss"
    explanation: The only published management statement about hearing in this disorder.
- name: Surveillance
  description: >-
    Structured surveillance is the one place where GeneReviews gives
    disorder-specific guidance: neurological and developmental review, growth
    and nutrition, constipation and joint mobility at each visit; ophthalmology
    every one to two years in those with optic atrophy; audiology as
    clinically indicated; and a sleep study every one to two years, which is
    the item most easily overlooked and most directly relevant to
    neuromuscular respiratory failure.
  action_category: SCREENING
  treatment_term:
    preferred_term: structured surveillance schedule
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ophthalmology evaluation every one to two years in those with optic atrophy; audiology evaluation as clinically indicated; sleep study every one to two years"
    explanation: The published surveillance schedule for this disorder.
- name: Genetic counselling and reproductive options
  description: >-
    Autosomal recessive recurrence-risk counselling with a 25% risk to each
    subsequent pregnancy, carrier testing for the specific familial alleles
    once identified, and prenatal or preimplantation testing. This carries
    unusual weight in this disorder because the reported population is heavily
    consanguineous and because the disorder is severe, untreatable and often
    lethal in early childhood; the 2025 Saudi natural-history study frames its
    entire rationale around enabling preimplantation and carrier-screening
    programmes.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: The quantitative recurrence risk that the counselling recommendation rests on.
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the SPTBN4 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives, prenatal testing for a pregnancy at increased risk, and preimplantation genetic testing are possible."
    explanation: States the reproductive options available once the familial alleles are known.
animal_models:
- species: Mus musculus
  genotype: quivering (qv) allelic series - spontaneous Sptbn4 (Spnb4) loss-of-function alleles including qv3J and qv4J
  category: Spontaneous loss-of-function allelic series
  description: >-
    The quivering mouse is the reason this gene was ever connected to human
    disease. It arose spontaneously in 1953 and produces progressive ataxia
    with hindlimb paralysis, deafness and tremor; when the founding human case
    was described, the resemblance to quivering is what prompted the authors to
    examine muscle in both. The allelic series is unusually informative because
    the alleles truncate the protein at different points: qv3J removes the
    C-terminal specific and pleckstrin homology domains, qv4J additionally
    removes the ankyrinG-binding domain and abolishes detectable protein, and
    the two produce graded severity with central nodes affected before
    peripheral ones. The series is what established the separability of the
    mechanical (nodal undercoat) and electrical (channel clustering) arms of
    beta-IV spectrin function.

    Fidelity is good but not complete, and the mismatches run in both
    directions. Ataxia and tremor are cardinal in the mouse and were absent
    from every human report until 2025, when two siblings in one Saudi family
    were found to have ataxia. Conversely, intellectual disability - the most
    severe feature in humans - has no straightforward murine readout and the
    mouse cognitive phenotype has not been characterised. Muscle fibre-type
    findings differ too - the quivering mouse showed complete type 2 fibre
    uniformity, whereas human biopsies show only incomplete type 1 hypotrophy.
  genes:
  - preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  associated_phenotypes:
  - Progressive ataxia with hindlimb paralysis
  - Tremor
  - Central (non-cochlear) deafness with abnormal brainstem auditory transmission
  - Broadened nodes of Ranvier with vesicle-filled membrane protrusions
  - Reduced nodal and AIS sodium channel immunoreactivity
  - Absent nodal KCNQ2 aggregates with neuromyotonic and myokymic discharge
  evidence:
  - reference: PMID:11528393
    reference_title: "Mutant beta-spectrin 4 causes auditory and motor neuropathies in quivering mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The autosomal recessive mouse mutation quivering (qv), which arose spontaneously in 1953, produces progressive ataxia with hind limb paralysis, deafness and tremor."
    explanation: Defines the quivering phenotype, three of whose four components map onto the human disorder.
  - reference: PMID:11528393
    reference_title: "Mutant beta-spectrin 4 causes auditory and motor neuropathies in quivering mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report that quivering mice carry loss-of-function mutations in the mouse beta-spectrin 4 gene (Spnb4) that cause alterations in ion channel localization in myelinated nerves; this provides a rationale for the auditory and motor neuropathies of these mice."
    explanation: Establishes the gene identity of the quivering locus and the ion-channel-localisation mechanism, seventeen years before the human disorder was described.
  - reference: PMID:15317849
    reference_title: "BetaIV spectrins are essential for membrane stability and the molecular organization of nodes of Ranvier."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that quivering mutations disrupt betaIV spectrin retention and stability at nodes and that distinct protein domains regulate nodal structural integrity and molecular organization."
    explanation: Establishes the domain-resolved, allele-graded structure of the model that makes the series informative about human truncating variants.
  - reference: PMID:28540413
    reference_title: "A recessive mutation in beta-IV-spectrin (SPTBN4) associates with congenital myopathy, neuropathy, and central deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical symptoms of the patient largely corresponded to those described for the quivering mouse, a loss-of-function animal model."
    explanation: The explicit human-to-mouse phenotype correspondence that drove the original gene discovery.
- species: Mus musculus
  genotype: Sptbn4 gene-trap null (Sptbn4geo) and betaIVSigma1-specific knockout
  category: Targeted knockout
  description: >-
    Engineered nulls complement the spontaneous series. A gene-trap null was
    the basis for the demonstration that beta-IV spectrin and ankyrin-G stabilise
    each other reciprocally and that both are required for nodal sodium-channel
    clustering; the same line was later used to show the auditory heminode
    defect and the loss of presynaptic spike fidelity. A separate,
    isoform-specific knockout removing only betaIVSigma1 showed that the
    actin-binding isoform is the one that builds the nodal undercoat. A third
    strand of work used timed re-expression of beta-IV spectrin in vivo to show
    that nodal reorganisation and functional recovery in the CNS are possible
    only within a critical developmental window - the closest thing to a
    therapeutic proof of concept that exists for this disorder.

    The re-expression experiment is the reason this entry treats the disorder
    as potentially tractable rather than as fixed at birth. Two caveats
    prevent that being read as a therapeutic claim. First, re-expression in the
    mouse was achieved genetically at chosen developmental time points, not by
    any deliverable agent, and no gene-therapy or ASO approach to SPTBN4 has
    been reported. Second, the critical window closed in the CNS, which is
    where the most disabling component of the human phenotype - intellectual
    disability - resides, so the arm of the disease most in need of treatment
    is the arm the mouse says is hardest to rescue.
  genes:
  - preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  associated_phenotypes:
  - Tremor and hindlimb contraction
  - Loss of ankyrinG and sodium channel clustering at AIS and nodes
  - Disappearance of the nodal membrane undercoat with widened nodes
  - Elevated action potential threshold and high-frequency transmission failure in auditory brainstem
  - Absent startle response with normal cochlear function
  evidence:
  - reference: PMID:11807096
    reference_title: "[Beta]IV-spectrin regulates sodium channel clustering through ankyrin-G at axon initial segments and nodes of Ranvier."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have generated mice carrying a null mutation in the betaIV-spectrin gene using gene trapping in embryonic stem cells."
    explanation: Identifies the gene-trap null line that underpins most of the mechanistic work cited in this entry.
  - reference: PMID:11807096
    reference_title: "[Beta]IV-spectrin regulates sodium channel clustering through ankyrin-G at axon initial segments and nodes of Ranvier."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for the mutation exhibit tremors and contraction of hindlimbs."
    explanation: The organismal phenotype of the engineered null, matching the spontaneous quivering alleles.
  - reference: PMID:29907663
    reference_title: "Reorganization of Destabilized Nodes of Ranvier in βIV Spectrin Mutants Uncovers Critical Timelines for Nodal Restoration and Prevention of Motor Paresis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the PNS, restoration of nodes occurs within 1 month regardless of the time of βIV spectrin re-expression. In contrast, the CNS nodal reorganization and functional restoration occurs within a critical time window; after that, nodal reorganization diminishes, leading to less efficient motor recovery."
    explanation: >-
      The single most therapeutically relevant animal result in this
      literature: the lesion is reversible by restoring the protein, but only
      inside a developmental window in the CNS.
  - reference: PMID:29907663
    reference_title: "Reorganization of Destabilized Nodes of Ranvier in βIV Spectrin Mutants Uncovers Critical Timelines for Nodal Restoration and Prevention of Motor Paresis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of murine βIV spectrin allows the initial nodal organization, but causes gradual nodal destabilization."
    explanation: Establishes that the defect is one of maintenance rather than of initial assembly, which is what makes post-natal restoration conceivable at all.
discussions:
- discussion_id: sptbn4-seizure-frequency-conflict
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of individuals with SPTBN4 disease actually have clinical
    seizures, given that the four available sources give figures spanning
    "very rare" to "more than half"?
  rationale: >-
    This is not a rounding disagreement. GeneReviews states that half of
    affected individuals develop seizures. The 2021 cohort report says more
    than half develop seizures or have a pathological EEG, which is a different
    and broader endpoint. The 2025 systematic review of 38 patients puts
    seizures at 21%. The HPO annotation set for OMIM:617519 carries HP:0001250
    with the frequency modifier "Very rare", sourced to OMIM. The likely
    explanation is that the compound endpoint (seizures OR epileptiform EEG)
    has been propagated as if it were the seizure rate, compounded by
    ascertainment - EEG was performed in only 12 of 38 patients, and prolonged
    recording in fewer still, so the epileptiform abnormality is
    systematically under-detected while clinical seizures are not. Until this
    is resolved, a clinician cannot give a family a defensible seizure risk,
    and the entry deliberately asserts no FrequencyEnum band for either the
    seizure or the EEG phenotype.
  attaches_to:
  - "pathophysiology#Axonal Hyperexcitability and Epileptiform Discharge"
  proposed_experiments:
  - experiment_id: sptbn4-prospective-eeg-cohort
    name: Prospective prolonged-EEG phenotyping of a molecularly defined cohort
    description: >-
      Perform 24- to 72-hour EEG including sleep in every molecularly confirmed
      SPTBN4 patient in a multicentre registry, irrespective of seizure
      history, and report clinical seizures and epileptiform abnormality as two
      separate denominators rather than a compound endpoint.
- discussion_id: sptbn4-myopathy-neurogenic-or-myogenic
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the muscle pathology in SPTBN4 disease a primary myopathy, or is it
    entirely secondary to denervation?
  rationale: >-
    The disorder was first described as a congenital myopathy on the strength
    of fibre-type disproportion plus sarcolemmal beta-IV-spectrin
    immunostaining that was present in controls and absent in patient muscle,
    and a second cohort replicated the immunostaining result and proposed a
    direct effect on sarcolemmal stability and myofibre depolarisation. A
    muscle-specific conditional knockout then reported that beta-4 spectrin is
    not present in muscle at all and that the myopathy must be neurogenic. The
    disagreement is methodologically tractable rather than philosophical: the
    human immunohistochemistry was performed without a beta-IV-spectrin-null
    muscle as an antibody specificity control, and the conditional knockout
    was performed in mouse rather than human muscle. It matters because it
    determines whether a normal or myopathic muscle biopsy carries any
    diagnostic weight, and whether muscle is a legitimate therapeutic target.
  attaches_to:
  - "pathophysiology#Contested Skeletal Muscle Involvement"
  - "histopathology#Absent beta-IV-spectrin immunostaining in patient muscle"
  proposed_experiments:
  - experiment_id: sptbn4-muscle-antibody-specificity
    name: Antibody specificity control on beta-IV-spectrin-null muscle
    description: >-
      Re-run the sarcolemmal immunohistochemistry using the same antibodies on
      muscle from a beta-IV-spectrin-null mouse alongside human control and
      patient muscle, to establish whether the sarcolemmal signal reported in
      controls is beta-IV spectrin or a cross-reacting epitope.
  - experiment_id: sptbn4-human-muscle-transcriptomics
    name: SPTBN4 expression in human skeletal muscle by RNA-seq and proteomics
    description: >-
      Quantify SPTBN4 transcript and beta-IV spectrin peptide abundance in
      human skeletal muscle and at the human neuromuscular junction, since the
      conditional-knockout evidence is murine and human expression has been
      asserted on both sides of the argument.
- discussion_id: sptbn4-excitability-direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of beta-IV spectrin raise or lower neuronal excitability, given
    that its two clustered channel clients push in opposite directions?
  rationale: >-
    Losing nodal and AIS sodium channels should make neurons harder to fire,
    and that is what was measured in the dentate gyrus in vivo and at the
    auditory presynaptic terminal, where action-potential threshold rose.
    Losing nodal KCNQ2/KCNQ3 should make axons fire spontaneously, and that is
    what was measured at the diaphragm neuromuscular junction and what the
    patients' near-continuous epileptiform discharges suggest. Both effects
    occur in the same mutant animals. The unresolved question is what
    determines which dominates - axonal compartment, fibre type, developmental
    stage, or the specific truncation - and the answer would have direct
    therapeutic implications, since a KCNQ opener and a sodium-channel enhancer
    are opposite interventions. It is recorded as a knowledge gap rather than
    resolved in favour of either arm.
  attaches_to:
  - "pathophysiology#Impaired Action Potential Initiation and Saltatory Conduction"
  - "pathophysiology#Failure of KCNQ2 and KCNQ3 Potassium Channel Clustering"
  proposed_experiments:
  - experiment_id: sptbn4-compartment-resolved-excitability
    name: Compartment-resolved excitability mapping in beta-IV spectrin nulls
    description: >-
      Record simultaneously from soma, axon initial segment and node in the
      same neurons of beta-IV-spectrin-null mice across development, to
      determine where and when the sodium-channel and KCNQ2 arms dominate.
- discussion_id: sptbn4-no-human-cns-tissue
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any available model or human material support the cortical mechanism
    proposed for the intellectual disability, which is the disorder's most
    disabling feature?
  rationale: >-
    This is a model-fidelity problem rather than an absence of evidence, which
    is why it is recorded as HUMAN_MODEL_MISMATCH. Substantial in vivo evidence
    exists, but none of it addresses the human cognitive phenotype. No
    post-mortem CNS tissue, no brain biopsy and no patient-derived iPSC
    neuronal model from an SPTBN4 individual has been reported; the human
    tissue evidence in this disorder consists of nerve biopsy, muscle biopsy
    and fibroblasts. The mouse models reproduce ataxia, tremor, deafness and
    motor paresis, all of which are minor or absent components of the human
    phenotype, while intellectual disability - present in nearly every patient
    - has no characterised murine counterpart. The specific mismatch runs both
    ways: the mouse is ataxic and the humans generally are not, and the humans
    are profoundly intellectually disabled and the mouse has not been tested.
    Every cortical mechanistic claim in this entry is therefore extrapolated
    from rodent hippocampal and brainstem recordings, and the competing
    explanation - that the developmental delay is substantially secondary to
    motor, communicative and sensory deprivation plus recurrent hypoxia - has
    never been excluded.
  attaches_to:
  - "pathophysiology#Cortical Network Dysfunction and Impaired Neurodevelopment"
  proposed_experiments:
  - experiment_id: sptbn4-ipsc-cortical-neurons
    name: Patient iPSC-derived cortical neurons and AIS morphometry
    description: >-
      Derive cortical neurons from SPTBN4 patients and controls and measure AIS
      length and position, ankyrinG and Nav/KCNQ2 clustering, and intrinsic
      excitability, in the cell type the cognitive phenotype implicates.
  - experiment_id: sptbn4-mouse-cognitive-phenotyping
    name: Cognitive phenotyping of beta-IV spectrin mutant mice
    description: >-
      Run learning, memory and social-behaviour batteries on the existing
      quivering and gene-trap lines, controlling for their motor and auditory
      impairment, to establish whether a cognitive phenotype exists in the
      model at all.
  - experiment_id: sptbn4-neuropathology-registry
    name: Neuropathological examination through a patient registry
    description: >-
      Establish consent for post-mortem CNS examination within a rare-disease
      registry, since mortality in early childhood is unfortunately common in
      this disorder and no neuropathology has ever been reported.
- discussion_id: sptbn4-deafness-in-the-disease-name
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should the OMIM/MONDO label for this disorder continue to name deafness as
    a cardinal feature when it is present in a minority of patients?
  rationale: >-
    Both counted series put hearing impairment well below half - 2/5 in the HPO
    annotation set for OMIM:617519 and 21% in the 38-patient review - while
    hypotonia, developmental delay, absent speech and poor head control
    approach 100%. The name derives from the founding single-case report, in
    which central deafness was one of three presenting features and was the
    observation that connected the patient to the quivering mouse. The
    practical harm is real: a clinician using the disease name as a
    phenotype checklist will under-consider SPTBN4 in the much larger group of
    hypotonic, areflexic infants with normal hearing. Recorded here rather than
    acted on, because renaming is an OMIM/MONDO decision and outside the scope
    of a dismech entry; the correct dismech response is the explicit caveat in
    the entry-level notes and in the hearing-impairment phenotype.
  attaches_to:
  - "phenotypes#Sensorineural hearing impairment (auditory neuropathy)"
- discussion_id: sptbn4-late-onset-outliers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the two reported individuals with SPTBN4 variants whose disease
    onset was at 48 and 60 years of age?
  rationale: >-
    A congenital-onset neurodevelopmental disorder with two cases of
    mid-to-late-adult onset is either two different diseases or a
    misattribution. The 2025 systematic review records the observation in a
    single clause with no clinical, molecular or ascertainment detail, and the
    primary source is not identifiable from the review text alone. The
    possibilities are distinguishable and consequential: these could be
    genuinely hypomorphic alleles defining an adult-onset SPTBN4 neuropathy;
    they could be individuals ascertained through a neuropathy cohort in whom
    an SPTBN4 variant is incidental; or the ages could be errors of
    transcription in the review's supplementary table. Until this is resolved,
    the entry treats congenital-to-early-childhood onset as the disorder's
    natural history and flags the outliers rather than widening the onset
    range.
  attaches_to:
  - "pathophysiology#Residual-Function Alleles and the Mild End of the Spectrum"
  proposed_experiments:
  - experiment_id: sptbn4-late-onset-source-tracing
    name: Trace and re-phenotype the reported late-onset individuals
    description: >-
      Identify the primary publications behind the two late-onset entries in
      the pooled review, obtain their genotypes and phenotypes, and determine
      whether they represent a distinct adult-onset SPTBN4 phenotype or an
      artefact of pooling.

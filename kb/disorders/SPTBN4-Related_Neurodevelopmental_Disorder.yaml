    phenotype touches the KCNQ2 phenotypes. KCNQ2 loss of function causes both
    developmental and epileptic encephalopathy 7 (MONDO:0013387) and benign
    familial neonatal seizures 1 (MONDO:0007365), both verified with OAK and
    both already curated in this knowledge base; a disorder that fails to
    cluster the same channel is expected to share features with them, and the
    2021 cohort report makes exactly that argument. Retigabine is discussed in
    this entry only as an experimental probe in mice: it has never been tested
    in SPTBN4 disease, it was withdrawn from clinical use for retinal and skin
    pigmentation, and it is therefore NOT curated as a treatment.

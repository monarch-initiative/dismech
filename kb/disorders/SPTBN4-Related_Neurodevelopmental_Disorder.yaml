name: SPTBN4-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
  term:
    id: MONDO:0060496
    label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
description: >-
  Neurodevelopmental disorder with hypotonia, neuropathy, and deafness (NEDHND)
  is an autosomal recessive disorder caused by bi-allelic variants in SPTBN4,
  the gene encoding beta-IV spectrin. It is a disease of one subcellular
  structure: the submembranous actin-spectrin scaffold that builds the axon
  initial segment and the node of Ranvier. Beta-IV spectrin is the beta-subunit
  of that scaffold, binding actin at one end and ankyrin-G at the other, and it
  is required both to hold the nodal membrane undercoat together and to
  concentrate the voltage-gated ion channels that make an axon excitable. When
  it is lost, sodium-channel and KCNQ2/KCNQ3 potassium-channel clusters fail,
  action-potential initiation and saltatory conduction degrade, and long
  myelinated motor and auditory axons - the fibres most dependent on that
  scaffold - degenerate. The clinical result is congenital hypotonia with
  profound global developmental delay, absent or severely limited speech, a
  motor axonal neuropathy with areflexia and secondary muscle wasting, feeding
  and respiratory failure from bulbar weakness, and, in a minority, auditory
  neuropathy, seizures or a paradoxically epileptiform EEG without clinical
  seizures. Two features of the entity deserve emphasis at the outset. First,
  the disease name overstates deafness: the largest series to date counted
  deafness in 21% of patients and the HPO annotation set for OMIM:617519
  records sensorineural hearing impairment at 2/5, although the founding 2018
  report named auditory neuropathy as part of the syndrome it described.
  Second, the "myopathy" reported
  in the earliest descriptions is now contested - a muscle-specific
  beta-IV-spectrin knockout showed the protein is not present in skeletal
  muscle at all, implying the muscle pathology is neurogenic. The published
  experience remains small; the most recent systematic review counted 38
  reported individuals worldwide.
parents:
- Neurodevelopmental Disorder
- Autosomal recessive disease
synonyms:
- NEDHND
- SPTBN4 disorder
- beta-IV spectrinopathy
- betaIV spectrin deficiency
- neurodevelopmental disorder with hypotonia, neuropathy, and deafness
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Every organ system affected in this disorder is affected through the
      nervous system. The cardinal features - congenital hypotonia, profound
      developmental delay and intellectual disability, absent speech, motor
      axonal neuropathy with areflexia, auditory neuropathy, seizures and
      epileptiform EEG - are all neurological. The gastrointestinal and
      respiratory morbidity (dysphagia, aspiration, ventilatory failure) is
      bulbar and neuromuscular rather than primary organ disease. The muscle
      involvement, historically reported as a congenital myopathy, is now
      argued to be neurogenic (PMID:38441922), which strengthens rather than
      weakens the single NEUROLOGIC assignment. Cardiomyopathy has been
      reported in two individuals and is not the disorder's centre of gravity.
    evidence:
    - reference: PMID:33772159
      reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variants in SPTBN4 disrupt the cytoskeletal machinery that controls proper localization of ion channels and the function of axonal domains, thereby generating severe neurological dysfunction."
      explanation: The authors characterise the whole disorder as neurological dysfunction arising from an axonal cytoskeletal lesion, which is the basis for the NEUROLOGIC chapter assignment.
notes: >-
  Entity verification, done before any content was written. `runoak -i
  sqlite:obo:mondo info MONDO:0060496 -O obo` returns xref OMIM:617519,
  MEDGEN:1382171, GARD:0027987, UMLS:C4479603, synonym NEDHND, and
  `is_a: MONDO:0100500 (Mendelian neurodevelopmental disorder)`. `runoak -i
  sqlite:obo:mondo relationships -p RO:0004003 MONDO:0060496` returns exactly
  one gene, `HGNC:14896 SPTBN4`. `runoak -i sqlite:obo:hgnc search "l^SPTBN4"`
  confirms hgnc:14896 as the symbol SPTBN4. All three anchors - gene, OMIM
  number and MONDO label - agree with the dominant gene in every source used
  below, so the NEC gate passes.

  Named-entity risks specific to this gene, checked rather than assumed. (1)
  SPTBN4 sits in a five-member beta-spectrin family (SPTBN1, SPTBN2, SPTBN4,
  SPTBN5, plus SPTB) whose members each cause distinct neurological disease;
  a PubMed sweep on 2026-08-01 for `SPTBN4[TIAB] OR "betaIV spectrin"[TIAB] OR
  "beta-IV-spectrin"[TIAB]` returned 100+ records of which a substantial
  minority were about SPTBN1/SPTBN2/SPTBN5 or about cardiac and endothelial
  beta-IV spectrin biology. Every sibling-gene paper encountered was excluded
  from the evidence base and the sibling disorders were instead curated
  explicitly as differentials with OAK-verified MONDO terms. (2) A large
  contemporary literature uses beta-IV spectrin as a *cardiac* and *tumour
  angiogenesis* scaffold (CaMKII-beta-IV-spectrin-STAT3 axis, VEGFR2
  signalling, cardiac fibroblasts). Those papers are real SPTBN4 papers but
  they are not about this disease, and none is cited as evidence for a human
  neurological claim here. (3) The mouse gene has historically been called
  Spnb4 and the protein beta4-spectrin or beta-spectrin 4; the quivering (qv)
  mouse literature uses those names exclusively. Those papers ARE about this
  gene and are cited as model-organism evidence, with the naming stated
  explicitly so a reader does not mistake them for a different locus.

  Two OMIM/MONDO neighbours were checked and deliberately NOT curated as
  subtypes: `runoak -i sqlite:obo:mondo relationships --direction down
  HGNC:14896` returns MONDO:0060496 as the only SPTBN4 disease term, so unlike
  several other spectrinopathies this gene carries a single MONDO entity and
  the milder "axonal neuropathy without intellectual disability" presentation
  (PMID:31857255) belongs inside it rather than beside it.

  Disease-name caveat, recorded because it changes how the entry should be
  read. The MONDO/OMIM label names deafness as one of three cardinal features,
  but no cohort supports that weighting. The HPO annotation set for OMIM:617519
  (retrieved 2026-08-01 from https://ontology.jax.org/api/network/annotation/
  OMIM:617519) records HP:0000407 Sensorineural hearing impairment at 2/5,
  sourced to PMID:33772159; the 2025 natural-history review counted deafness in
  21% of patients. Hypotonia and neuropathy are near-universal; deafness is
  not. The name is a historical artefact of the founding single-case report
  (PMID:28540413), in which "central deafness" was one of the three presenting
  features and provided the link to the quivering mouse.

  Frequency bands are deliberately omitted from every phenotype in this entry.
  The HPO annotation set for OMIM:617519 draws on exactly two publications
  (PMID:33772159 and PMID:28540413) with denominators of 1 to 6, so a single
  reclassified individual moves most features across a FrequencyEnum boundary.
  Where a larger denominator exists it comes from the 2025 natural-history
  review, whose own percentages rest on inconsistent denominators (38 patients
  overall, but its gastrointestinal and respiratory percentages imply a
  denominator of about 28 - 15/54% and 17/61% both back-calculate to 28, a
  curator inference; the review does not state that denominator - and fewer
  still for imaging and biopsy). Each phenotype's `notes:` therefore carries
  the exact counts and their source instead of a band. Per
  docs/frequency-evidence-guidelines.md, omitting the band is preferred to
  manufacturing justification for one.

  Structured-source evidence was unavailable in this checkout: `data/orphadata/`
  and `data/clingen/` contain only `MANIFEST.yaml` with no downloaded payload,
  and `grep -ril SPTBN4 references_cache/` returns only PMID caches. No
  Orphanet prevalence class and no ClinGen gene-disease-validity classification
  could therefore be quoted. Per the scope rules the manifests were not
  touched. This is recorded as a gap, not as a claim that no such record
  exists.

  Reference-cache limits. Four references are cached with full text -
  PMID:33772159 (`content_type: full_text_xml`) and PMID:40781329,
  PMID:33986717 and PMID:35393465 (`content_type: full_text_pdf`); every other
  reference is cached abstract-only. Facts drawn from the body of a PDF-derived cache are quoted
  only where the extracted text is free of line-break hyphenation, and
  everything else is recorded in `notes:` rather than dressed up as a snippet.
  PMID:40842327 (De Winter et al., J Physiol 2025, "Loss-of-function variants
  in SPTAN1 and SPTBN4 cause early-onset hereditary myopathy") and
  PMID:30602540 (a commentary) were both fetched on 2026-08-01 and returned no
  abstract text at all, so neither can be quoted and neither is cited as
  evidence anywhere in this entry, despite the first being directly on topic.
  Their empty cache files were removed rather than committed.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging SPTBN4 alleles. Homozygous genotypes
    dominate the reported literature, reflecting ascertainment through
    consanguineous families in the Middle East, Iran, Afghanistan and Kurdish
    populations; compound heterozygotes are a small minority. Heterozygous
    carriers, including the parents in every reported family, are not described
    as affected, and no dominant or de novo SPTBN4 mechanism has been
    established for this phenotype.

    Penetrance is left unset rather than asserted. No apparently healthy
    bi-allelic individual has been reported, but neither has any systematic
    population-database interrogation of SPTBN4 genotypes been published, so
    complete penetrance would be an inference from ascertainment rather than
    an observation. Two counts from the 2025 natural-history review bear on the
    recessive model and are recorded here rather than as separate claims - 31
    different pathogenic variants across 38 patients, and compound
    heterozygosity in only 4 of them. The same review reports two de novo
    variants in individuals ascertained through ADHD/autism cohorts rather than
    through NEDHND, which is a different and much weaker genotype-phenotype
    assertion; those cases are not treated here as evidence for a dominant
    mechanism in this disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopmental disorder with hypotonia, neuropathy, and deafness (NEDHND, OMIM #617519) is an autosomal recessive disease caused by homozygous or compound heterozygous variants in SPTBN4 coding for type 4 βIV-spectrin, a non-erythrocytic member of the β-spectrin family."
    explanation: States the mode of inheritance, the OMIM entity number this MONDO term xrefs, and the two admissible bi-allelic genotype configurations.
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SPTBN4 disorder is inherited in an autosomal recessive manner."
    explanation: Independent confirmation from the GeneReviews chapter, which is the source clinical laboratories and counsellors use.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals reported to date are homozygous."
    explanation: Supports the statement that homozygous genotypes, rather than compound heterozygosity, dominate the reported series.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate of any kind has been
    published for NEDHND, and no ORPHA code with an epidemiology table was
    available in this checkout, so there is no source to band and
    `NOT_YET_DOCUMENTED` is used rather than a qualitative `ULTRA_RARE` tier.
    `rate_per_100000` is deliberately omitted rather than set to 0.0: no rate
    has been estimated, and a numeric zero would be read downstream as an
    assertion that the disorder does not occur. The only quantity that can be
    sourced is a
    case tally: the 2025 systematic natural-history review counted 38 reported
    individuals worldwide, including its own 10 Saudi patients, across all
    publications to that date. Ascertainment is heavily consanguinity-driven -
    17 of the 38 were Arab, of whom 13 were Saudi - so the reported ethnic
    distribution reflects which health systems run autozygosity-guided exome
    sequencing, and must not be read as a population restriction.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there are only 38 patients (including our 10 cases) reported to carry deleterious variants of SPTBN4"
    explanation: Establishes the total published case count for this disorder at the time of curation, which is the only quantitative occurrence figure available.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arabs harbor significantly higher number of patients (n = 17) and 13 of them being Saudis."
    explanation: Documents the consanguinity-driven ascertainment skew that makes the reported ethnic distribution uninformative about true population frequency.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The typical course is profound and lifelong. Most affected individuals
    never achieve head control and cannot sit, stand or walk; speech is absent
    or limited to single words; tube feeding is usually required; and
    respiratory failure from neuromuscular and bulbar weakness is the usual
    cause of death. Two of seventeen patients with respiratory involvement in
    the 2025 review died at 14 months and 3 years of respiratory failure, and a
    2026 report describes two siblings who died at 18 months and 31 months.
    Management is entirely supportive. Burden is assigned HIGH rather than
    VARIABLE despite the existence of a mild end (PMID:31857255), because the
    mild presentations are a small minority of a small literature.
  evidence:
  - reference: PMID:32672909
    reference_title: "SPTBN4 Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals rarely achieve head control. Most are unable to sit, stand, or walk."
    explanation: GeneReviews summary of typical functional outcome, which is the basis for a HIGH burden assignment.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the 17 patients died at age of 14 months and 3 years due to respiratory failure."
    explanation: Documents mortality from the disorder's dominant complication, respiratory failure secondary to neuromuscular and bulbar weakness.
progression:
- phase: Onset
  age_range: Birth to early childhood
  notes: >-
    Presentation is congenital or neonatal in most reported individuals -
    hypotonia noted at birth, poor suck and feeding difficulty in the newborn
    period. The HPO annotation set for OMIM:617519 records HP:0003623 Neonatal
    onset at 4/6 and HP:0003577 Congenital onset at 2/5 (retrieved 2026-08-01).
    The 2025 natural-history review found that of 29 patients with onset data,
    presentation was most often at birth.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the age at presentation was mostly at birth (n = 15)"
    explanation: Establishes birth as the modal age of presentation across the pooled published cohort.
- phase: Course
  age_range: Childhood onward
  notes: >-
    The published course is static or slowly progressive rather than
    relentlessly degenerative: developmental milestones are not lost, but they
    are largely not gained either. Two individuals in the pooled review had
    disease onset only at 48 and 60 years of age, which is difficult to
    reconcile with a congenital-onset neurodevelopmental disorder and is
    flagged as a knowledge gap rather than smoothed into the natural history.
    The clinically important trajectory is the secondary one: progressive
    bulbar weakness leads to dysphagia, aspiration and recurrent pneumonia, and
    thence to restrictive lung disease, tracheostomy and death. Scoliosis and
    joint contractures accumulate with immobility.
  evidence:
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "only two cases have late disease onset at the ages of 48 and 60 years old"
    explanation: >-
      Marked PARTIAL because the observation is quoted for what it is - an
      unexplained outlier within the pooled review - rather than as support for
      a late-onset form of this disorder. The review gives no clinical or
      molecular detail for these two individuals.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory difficulties were seen in 17 patients (61%)."
    explanation: Quantifies the respiratory morbidity that drives the disorder's late course and mortality.
pathophysiology:
- name: Bi-allelic Loss-of-Function SPTBN4 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to SPTBN4 at 19q13.13, reported
    against transcript NM_020971. The reported allelic spectrum is dominated by
    truncating variants - nonsense, frameshift, splice-site and at least one
    multi-exon deletion - with a minority of missense changes. Missense alleles
    cluster in the spectrin-repeat rod, which is the segment that polymerises
    the scaffold, and the founding functional study showed that most tested
    patient alleles behave as loss of function in neurons rather than as
    subtler hypomorphs. There is no clean genotype-phenotype correlation: the
    variants are dispersed across the whole gene, and the one clearly milder
    published family carries an in-frame splice consequence rather than a
    distinct class of allele.
  genes:
  - preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  mechanism_confidence: ESTABLISHED
  notes: >-
    Two quantitative statements about the allelic spectrum come from different
    counting exercises and are recorded here rather than reconciled. The 2021
    report counted 15 pathogenic variants in total (10 truncating, 4 missense,
    1 splice-site, 1 multi-exon deletion - the arithmetic in the source sums to
    16 because the multi-exon deletion is also listed separately). The 2025
    natural-history review counted 31 different pathogenic variants across 38
    patients and reported that more than 70% of them sit in spectrin-repeat
    domains. These are different literature cut-offs, not a contradiction.
  evidence:
  - reference: PMID:29861105
    reference_title: "βIV Spectrinopathies Cause Profound Intellectual Disability, Congenital Hypotonia, and Motor Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report bi-allelic pathogenic SPTBN4 variants (three homozygous and two compound heterozygous) that cause a severe neurological syndrome that includes congenital hypotonia, intellectual disability, and motor axonal and auditory neuropathy"
    explanation: The founding cohort report establishing bi-allelic SPTBN4 variants as the cause of the syndrome curated here.
  - reference: PMID:29861105
    reference_title: "βIV Spectrinopathies Cause Profound Intellectual Disability, Congenital Hypotonia, and Motor Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We introduced these variants into βIV spectrin, expressed these in neurons, and found that 5/7 were loss-of-function variants disrupting AIS localization or abolishing phosphoinositide binding."
    explanation: >-
      Functional testing of the patient alleles themselves, showing that they
      act by loss of function through two specific molecular routes - failure
      of AIS targeting and loss of phosphoinositide (PH-domain) binding.
  - reference: PMID:40781329
    reference_title: "Natural history of SPTBN4-related neurodevelopmental disorder with hypotonia, neuropathy, and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "more than 70% of SPTBN4 variants are located in spectrin repeat domains"
    explanation: Localises the bulk of the reported allelic spectrum to the spectrin-repeat rod, the segment that builds the scaffold.
  - reference: PMID:33772159
    reference_title: "Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first description of a multi-exon deletion in the SPTBN4 gene and it shows that larger SPTBN4 deletions may account for a part of SPTBN4-related disorder."
    explanation: Documents copy-number loss as part of the allelic spectrum, which is the reason sequencing alone can miss a second allele.
  downstream:
  - target: Loss of beta-IV Spectrin from the Axon Initial Segment and Nodal Membrane Skeleton
    description: >-
      Truncating and most missense alleles remove functional beta-IV spectrin
      from the axonal membrane skeleton, either by abolishing the protein or by
      preventing its targeting to the AIS.
  - target: Residual-Function Alleles and the Mild End of the Spectrum
    description: >-
      A parallel, allele-specific arm. In-frame consequences that preserve part
      of the protein are the proposed explanation for the one published family
      with axonal neuropathy but normal cognition.
- name: Loss of beta-IV Spectrin from the Axon Initial Segment and Nodal Membrane Skeleton
  biological_scale: MOLECULAR
  description: >-
    Beta-IV spectrin is the neuron-specific beta-subunit of the submembranous
    spectrin scaffold, restricted almost entirely to the axon initial segment
    and the nodes of Ranvier of myelinated neurons. The axonal scaffold it
    belongs to is a periodic lattice: actin rings spaced roughly 180 to 190 nm
    apart along the axon, bridged by spectrin tetramers of that same length,
    with sodium channels distributed in register with the lattice. Beta-IV
    spectrin is what links that lattice to the membrane at excitable domains.
    Its longest isoform, beta-IV-Sigma1, is the only one carrying an
    actin-binding domain and also carries 17 spectrin repeats, the ERQES
    specific domain and a pleckstrin homology domain; a shorter,
    N-terminally-truncated isoform, Sigma6, is expressed at much higher levels
    and carries the sodium-channel-clustering activity. The isoform structure
    matters clinically, because truncating variants at different positions
    remove different subsets of isoforms.
  genes:
  - preferred_term: SPTBN4
    term:
      id: hgnc:14896
      label: SPTBN4
  protein_complexes:
  - preferred_term: beta-IV spectrin-containing membrane skeleton
    modifier: DECREASED
    term:
      id: GO:0008091
      label: spectrin
  cellular_components:
  - preferred_term: axon initial segment
    term:
      id: GO:0043194
      label: axon initial segment
  - preferred_term: node of Ranvier
    term:
      id: GO:0033268
      label: node of Ranvier
  - preferred_term: spectrin-associated cytoskeleton
    term:
      id: GO:0014731
      label: spectrin-associated cytoskeleton
  molecular_functions:
  - preferred_term: actin binding
    modifier: DECREASED
    term:
      id: GO:0003779
      label: actin binding
  - preferred_term: structural constituent of cytoskeleton
    modifier: DECREASED
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  - preferred_term: phosphoinositide binding via the pleckstrin homology domain
    modifier: DECREASED
    term:
      id: GO:0035091
      label: phosphatidylinositol binding
  cell_types:
  - preferred_term: myelinated neuron
    term:
      id: CL:0000540
      label: neuron
  mechanism_confidence: ESTABLISHED
  notes: >-
    Two independent patient-material demonstrations that the protein is
    actually lost, from different tissues and different laboratories: Western
    blot showing absence of the full-length isoform in muscle and of a 72 kDa
    isoform in fibroblasts (PMID:28540413), and immunohistochemistry showing no
    beta-IV-spectrin signal in patient muscle where control muscle stained
    (PMID:33772159). Both were performed on muscle, which is precisely the
    tissue whose beta-IV spectrin expression was later disputed
    (PMID:38441922); see the "Contested Skeletal Muscle Involvement" node. The
    protein-loss claim for neurons rests on the founding functional study's
    neuronal expression experiments rather than on patient neural tissue, since
    no post-mortem CNS material from an affected individual has been reported.

    Isoform nomenclature is a live source of confusion and is stated
    explicitly. The original description names four alternatively spliced
    isoforms Sigma1 to Sigma4 and reports the longest as a 250 kD band;
    subsequent work adds Sigma6 as the dominant short isoform; and the first
    clinical report describes the full-length isoform as 288 kDa. These are the
    same gene product family described with different antibodies, species and
    conventions, and the discrepancy in stated molecular weight is not resolved
    in the literature. It is recorded rather than averaged.
  evidence:
  - reference: PMID:11086001
    reference_title: "betaIV spectrin, a new spectrin localized at axon initial segments and nodes of ranvier in the central and peripheral nervous system."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In brain, betaIV spectrin is enriched in myelinated neurons, where it colocalizes with ankyrin(G) 480/270-kD at axon initial segments and nodes of Ranvier."
    explanation: Establishes the subcellular localisation that defines this disorder - beta-IV spectrin is an AIS and nodal protein of myelinated neurons.
  - reference: PMID:11086001
    reference_title: "betaIV spectrin, a new spectrin localized at axon initial segments and nodes of ranvier in the central and peripheral nervous system."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The longest isoform (betaIVSigma1 spectrin) includes an actin-binding domain, followed by 17 spectrin repeats, a specific domain in which the amino acid sequence ERQES is repeated four times, several putative SH3-binding sites and a pleckstrin homology domain."
    explanation: Defines the domain architecture whose loss the patient alleles cause, including the PH domain whose phosphoinositide binding several patient variants abolish.
  - reference: PMID:23239625
    reference_title: "Actin, spectrin, and associated proteins form a periodic cytoskeletal structure in axons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Actin formed ringlike structures that wrapped around the circumference of axons and were evenly spaced along axonal shafts with a periodicity of ~180 to 190 nanometers."
    explanation: Establishes the periodic actin-spectrin lattice architecture of the axon, the structure that beta-IV spectrin builds at excitable domains.
  - reference: PMID:23239625
    reference_title: "Actin, spectrin, and associated proteins form a periodic cytoskeletal structure in axons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sodium channels in axons were distributed in a periodic pattern coordinated with the underlying actin-spectrin-based cytoskeleton."
    explanation: Directly links the spectrin lattice geometry to sodium-channel placement, which is the mechanistic bridge from a cytoskeletal lesion to a channel-clustering failure.
  - reference: PMID:17197442
    reference_title: "Specific role of the truncated betaIV-spectrin Sigma6 in sodium channel clustering at axon initial segments and nodes of ranvier."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "betaIV-Spectrin, an essential component of the membrane skeleton at these sites, has an N-terminal-truncated isoform, Sigma6, which is expressed at much higher levels than the full-length isoform Sigma1."
    explanation: Establishes the isoform structure that determines which functions a given truncating variant removes.
  - reference: PMID:28540413
    reference_title: "A recessive mutation in beta-IV-spectrin (SPTBN4) associates with congenital myopathy, neuropathy, and central deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot confirmed the absence of the full-length 288 kDa isoform in muscle and of a specific 72 kDa isoform in fibroblasts."
    explanation: Patient-material demonstration that a nonsense allele abolishes the protein rather than merely altering it.

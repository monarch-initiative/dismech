- name: Loss of the Dense Nodal Membrane Undercoat
  biological_scale: CELLULAR
  description: >-
    Beneath the nodal axolemma sits an electron-dense submembranous coat that
    is thought to be what physically holds the channel cluster in place.
    Beta-IV-Sigma1 spectrin, the actin-binding isoform, is an essential
    component of that coat, and removing it alone makes the coat disappear,
    widens the node, and fills it with organelle-laden membrane dilations. The
    structural failure is separable from the channel-clustering failure: mice
    retaining only the short Sigma6 isoform still show waving and swelling of
    the AIS and nodal membrane while recovering much of their sodium-channel
    clustering, and mice lacking only Sigma6 do the reverse. So the disorder
    has two mechanistically distinct arms - a mechanical one and an electrical
    one - and a given truncating allele may load them unequally.

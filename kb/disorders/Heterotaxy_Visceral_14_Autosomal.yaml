discussions:
- discussion_id: ciroz_molecular_step_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is CIROZ's molecular step in the left-right organizer, and how does it
    relate to the other module proteins (DAND5, PKD1L1, MMP21, CIROP)?
  attaches_to:
  - pathophysiology#Loss of CIROZ in the Left-Right Organizer
  rationale: >-
    CIROZ is essential for situs in humans and mice and is a secreted ZP-N-domain
    member of the LRO module, but the defining study (PMID:39753129) states that
    "the exact role played by CIROZ in the mouse and human LRO remains to be
    addressed" and that its functional relationship to the other module proteins
    "remains to be explored". By homology to ZP2, which is cleaved by ovastacin,
    CIROZ may itself require proteolytic processing, possibly by the module
    metallopeptidases MMP21 or CIROP, but this is untested. The node therefore
    records only the loss of a module factor, not a specified signalling step.
  proposed_experiments:
  - experiment_id: ciroz_lro_function_assays
    name: LRO function assays in Ciroz-null embryos
    description: >-
      In Ciroz-null mouse embryos, test whether cilia motility, cilia-driven
      leftward flow, or LRO cell/tissue morphology are affected, to localise
      CIROZ's step relative to flow generation and flow sensing.
  - experiment_id: ciroz_protease_substrate
    name: CIROZ proteolytic-processing test
    description: >-
      Test whether CIROZ is a substrate of the zinc-dependent metallopeptidases
      MMP21 and/or CIROP (as ZP2 is cleaved by ovastacin), to determine whether
      module metallopeptidases process CIROZ to switch its activity.
- discussion_id: ciroz_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is CIROZ essential for left-right patterning in humans and mice but
    dispensable in zebrafish and Xenopus, and which model faithfully reproduces
    the human mechanism?
  attaches_to:
  - pathophysiology#Failure of Left-Right Axis Determination
  rationale: >-
    Model evidence exists but diverges by species: the mouse knockout develops
    situs anomalies, yet zebrafish and Xenopus knockouts show no laterality
    defect, and the gene is absent or pseudogenized in some vertebrates that
    retain a cilia-motile left-right organizer. The non-mammalian models
    therefore cannot be assumed to represent the human CIROZ mechanism, and only
    the mouse currently stands as a faithful model.
  proposed_experiments:
  - experiment_id: ciroz_patient_allele_mouse
    name: Patient-allele knock-in mouse
    description: >-
      Generate mice carrying reported patient CIROZ inactivating alleles and
      assess situs, cardiac looping and congenital heart defects to test
      genotype-phenotype correlation in the faithful mammalian model.

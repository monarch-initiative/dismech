name: Visceral Heterotaxy 14
creation_date: "2026-10-24T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: heterotaxy, visceral, 14, autosomal
  term:
    id: MONDO:0976135
    label: heterotaxy, visceral, 14, autosomal
synonyms:
- HTX14
- CIROZ-related heterotaxy
- CIROZ visceral heterotaxy
- C1orf127-related heterotaxy
description: >-
  Visceral heterotaxy 14 (HTX14) is an autosomal recessive laterality disorder
  caused by bi-allelic inactivating variants in CIROZ (previously C1orf127).
  CIROZ encodes a secreted protein with a signal peptide and three zona
  pellucida N (ZP-N) domains that autonomously homooligomerizes and is
  specifically expressed in the embryonic left-right organizer (LRO). It
  belongs to a conserved genetic module (with DAND5, PKD1L1, MMP21 and CIROP)
  that evolved in vertebrates whose LRO carries motile cilia; its downstream
  molecular step within that module is not yet established. Loss of CIROZ
  function disrupts breaking of embryonic bilateral symmetry, producing
  heterotaxy (situs ambiguus) with congenital heart defects. The human
  phenotype is reproduced by the mouse knockout, which develops situs anomalies,
  but notably not by zebrafish or Xenopus knockouts, in which CIROZ is
  dispensable for left-right patterning.
parents:
- Visceral heterotaxy
- Congenital Disorder

notes: >-
  No GeneReviews chapter exists for CIROZ/heterotaxy 14 (PubMed
  genereviews[book] search returned no result on 2026-10-24). CIROZ (formerly
  C1orf127) is a recently described gene: the disease-defining cohort is 16
  individuals from 10 families (PMID:39753129, 2025), later independently
  confirmed by a 5,497-exome congenital-heart-disease analysis (W. Dong et al.,
  cited within PMID:39753129). The specific visceral phenotypes and the
  incomplete-penetrance observation are drawn from the full text of PMID:39753129
  (now cached as full text); splenic status is not separately reported for the
  CIROZ cohort. Hypoplastic left heart syndrome is captured through its component
  term HP:0004383 (Hypoplastic left ventricle), as HPO has no single term for the
  full syndrome. PMID:39753129 reports its CHD frequency inconsistently: the
  cohort description gives 11/16 with severe CHD and 5/16 with heterotaxy but no
  CHD, whereas a later cross-gene comparison sentence instead states that 5/16
  CIROZ individuals presented with CHD; a separate sentence notes almost 40 per
  cent were born without CHD. This entry treats CHD as frequent (the 11/16 cohort
  description, consistent with the ~40 per cent without-CHD figure) and does not
  commit to the discrepant 5/16-with-CHD number. The causal gene CIROZ is wired
  into the pathograph but carries no molecular_functions term because its
  molecular activity in the LRO is genuinely unknown (see the KNOWLEDGE_GAP
  discussion); it is therefore grandfathered in the gene-activity-grounding
  baseline rather than bound to an invented function. The gene term is bound
  by CURIE hgnc:26730; the pinned HGNC OBO build still labels this C1orf127, so
  term.label carries that label while preferred_term carries the current symbol
  CIROZ. No ClinGen gene-disease validity assertion is yet available, so none is
  recorded. Treatments and diagnosis are heterotaxy-generic, not CIROZ-specific,
  as stated in each explanation.

pathophysiology:
- name: Biallelic CIROZ Loss of Function
  description: >-
    Bi-allelic inactivating CIROZ variants abolish or truncate a secreted
    protein whose N-terminal half comprises three zona pellucida N (ZP-N)
    domains that mediate autonomous homooligomerization into dimers, trimers
    and higher-order multimers. Reported genotypes are homozygous or compound
    heterozygous nonsense, frameshift or signal-peptide alleles consistent with
    loss of secreted CIROZ oligomer function.
  biological_scale: MOLECULAR
  genetic_context:

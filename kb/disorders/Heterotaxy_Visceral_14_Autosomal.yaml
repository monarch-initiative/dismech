- name: Pneumococcal vaccination and infection prophylaxis
  description: >-
    Conjugate pneumococcal vaccination and infection prophylaxis address the
    high bacteremia risk associated with the splenic abnormalities of heterotaxy.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: conjugate pneumococcal vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:20730421
    reference_title: >-
      Heterotaxy syndrome: defining contemporary disease trends.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No cases of pneumococcal sepsis occurred after the introduction of the
      conjugated pneumococcal vaccination to the pediatric vaccination schedule
    explanation: >-
      Heterotaxy-generic, NOT CIROZ-specific, and of uncertain applicability to
      this cohort: splenic status is not reported for the CIROZ individuals, but
      pneumococcal vaccination is protective in heterotaxy with splenic anomalies.
notes: >-
  CIROZ (formerly C1orf127) was established as a human heterotaxy gene in a 2025
  cohort of 16 affected individuals from 10 families (PMID:39753129), supported
  by 5 additional bi-allelic families from a 5,497-exome congenital heart
  disease cohort cited therein; no dedicated GeneReviews chapter or ClinGen
  gene-disease validity assertion yet exists. Splenic status is not separately
  reported for the CIROZ cohort. Hypoplastic left heart syndrome is bound to
  HP:0004383 (Hypoplastic left ventricle), as HPO has no single term for the
  full syndrome. PMID:39753129 reports its CHD frequency inconsistently: the
  cohort description gives 11/16 with severe CHD and 5/16 with heterotaxy
  without CHD, whereas a later cross-gene comparison sentence states 5/16 with
  CHD alongside a separate statement that almost 40 percent were born without
  CHD; this entry follows the 11/16 cohort description (consistent with ~40
  percent without CHD). At the molecular level, recombinant human CIROZ and its
  three N-terminal ZP-N domains autonomously homooligomerize in vitro
  (GO:0042802, identical protein binding), whereas CIROZ's downstream partner
  or signaling step within the left-right organizer module remains unresolved
  (recorded in the KNOWLEDGE_GAP discussion). In the pinned HGNC OBO build,
  hgnc:26730 carries the former symbol C1orf127 as term.label while
  preferred_term carries CIROZ. Treatments and diagnostic modalities reflect
  general heterotaxy management rather than CIROZ-specific clinical trials.

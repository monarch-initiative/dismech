- name: Loss of CIROZ in the Left-Right Organizer
  description: >-
    CIROZ is a secreted protein expressed specifically in ciliated pit cells of
    the left-right organizer and is a member of the conserved LRO module (with
    DAND5, PKD1L1, MMP21 and CIROP); it is essential for normal situs in humans
    and mice. Its precise downstream molecular step within that module is not
    established: the defining study states that the exact role of CIROZ in the
    LRO, and its functional relationship to the other module proteins, remain
    to be determined. This node therefore records the loss of an LRO-restricted
    module factor, not a specified signalling step (see the attached knowledge
    gap).

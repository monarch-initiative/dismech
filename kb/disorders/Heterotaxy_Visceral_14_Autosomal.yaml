  description: >-
    Trio-based whole-exome or whole-genome sequencing is the confirmatory route
    given the locus heterogeneity of heterotaxy; CIROZ should be included on
    heterotaxy/laterality gene panels. Current NGS leaves most cases unsolved,
    which is the diagnostic gap CIROZ discovery helps narrow.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42630107
    reference_title: >-
      Genetics in Heterotaxy: A Case Series and Literature Review on DNAH9, PKD1L1, MMP21, and GDF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      next-generation sequencing (NGS) currently identifies disease-causing
      variants in only 20%-30% of HTX cases
    explanation: >-
      Heterotaxy-generic, NOT CIROZ-specific: documents the low molecular
      diagnostic yield that motivates broad sequencing and panel inclusion of new
      genes such as CIROZ.

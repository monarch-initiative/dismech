discussions:
- discussion_id: ciroz_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is CIROZ essential for left-right patterning in humans and mice but
    dispensable in zebrafish and Xenopus, and which model faithfully reproduces
    the human mechanism?
  attaches_to:
  - pathophysiology#Failure of Left-Right Axis Determination
  rationale: >-
    Model evidence exists but diverges by species: the mouse knockout develops
    situs anomalies, yet zebrafish and Xenopus knockouts show no laterality
    defect, and the gene is absent or pseudogenized in some vertebrates that
    retain a cilia-motile left-right organizer. The non-mammalian models
    therefore cannot be assumed to represent the human CIROZ mechanism, and only
    the mouse currently stands as a faithful model.
  proposed_experiments:
  - experiment_id: ciroz_patient_allele_mouse
    name: Patient-allele knock-in mouse
    description: >-
      Generate mice carrying reported patient CIROZ inactivating alleles and
      assess situs, cardiac looping and congenital heart defects to test
      genotype-phenotype correlation in the faithful mammalian model.
notes: >-
  No GeneReviews chapter exists for CIROZ/heterotaxy 14 (PubMed
  genereviews[book] search returned no result on 2026-10-24). CIROZ (formerly
  C1orf127) is a recently described gene: the disease-defining cohort is 16
  individuals from 10 families (PMID:39753129, 2025), later independently
  confirmed by a 5,497-exome congenital-heart-disease analysis (W. Dong et al.,
  cited within PMID:39753129). The specific visceral phenotypes and the
  incomplete-penetrance observation are drawn from the full text of PMID:39753129
  (now cached as full text); splenic status is not separately reported for the
  CIROZ cohort, and HLHS is captured only under the generic congenital heart
  defect phenotype because no exact single HPO term for the syndrome was
  available. The gene term is bound
  by CURIE hgnc:26730; the pinned HGNC OBO build still labels this C1orf127, so
  term.label carries that label while preferred_term carries the current symbol
  CIROZ. No ClinGen gene-disease validity assertion is yet available, so none is
  recorded.

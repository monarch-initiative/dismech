discussions:
- discussion_id: ciroz_molecular_step_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is CIROZ's molecular step in the left-right organizer, and how does it
    relate to the other module proteins (DAND5, PKD1L1, MMP21, CIROP)?
  attaches_to:
  - pathophysiology#Loss of CIROZ in the Left-Right Organizer
  rationale: >-
    CIROZ is essential for situs in humans and mice and is a secreted ZP-N-domain
    member of the LRO module, but the defining study (PMID:39753129) states that
    "the exact role played by CIROZ in the mouse and human LRO remains to be
    addressed" and that its functional relationship to the other module proteins
    "remains to be explored". By homology to ZP2, which is cleaved by ovastacin,
    CIROZ may itself require proteolytic processing, possibly by the module
    metallopeptidases MMP21 or CIROP, but this is untested. The node therefore
    records only the loss of a module factor, not a specified signalling step.
  evidence:
  - reference: PMID:39753129
    reference_title: >-
      CIROZ is dispensable in ancestral vertebrates but essential for left-right
      patterning in humans.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While our investigations of CIROZ in ancestral vertebrates spanning
      species of fish and amphibians argue that this gene is undergoing
      obsolescence, the exact role played by CIROZ in the mouse and human LRO
      remains to be addressed.
    explanation: >-
      Directly states that CIROZ's mechanistic step within the mammalian LRO
      module has not yet been resolved.
  proposed_experiments:
  - experiment_id: ciroz_lro_function_assays
    name: LRO function assays in Ciroz-null embryos
    description: >-
      In Ciroz-null mouse embryos, test whether cilia motility, cilia-driven
      leftward flow, or LRO cell/tissue morphology are affected, to localise
      CIROZ's step relative to flow generation and flow sensing.
  - experiment_id: ciroz_protease_substrate
    name: CIROZ proteolytic-processing test
    description: >-
      Test whether CIROZ is a substrate of the zinc-dependent metallopeptidases
      MMP21 and/or CIROP (as ZP2 is cleaved by ovastacin), to determine whether
      module metallopeptidases process CIROZ to switch its activity.
- discussion_id: ciroz_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is CIROZ essential for left-right patterning in humans and mice but
    dispensable in zebrafish and Xenopus, and which model faithfully reproduces
    the human mechanism?
  attaches_to:
  - pathophysiology#Failure of Left-Right Axis Determination
  rationale: >-
    Model evidence exists but diverges by species: the mouse knockout develops
    situs anomalies, yet zebrafish and Xenopus knockouts show no laterality
    defect, and the gene is absent or pseudogenized in some vertebrates that
    retain a cilia-motile left-right organizer. The non-mammalian models
    therefore cannot be assumed to represent the human CIROZ mechanism, and only
    the mouse currently stands as a faithful model.
  evidence:
  - reference: PMID:39753129
    reference_title: >-
      CIROZ is dispensable in ancestral vertebrates but essential for left-right
      patterning in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While the knockout of Ciroz in mice also leads to situs anomalies, we
      unexpectedly find that its targeted inactivation in zebrafish and Xenopus
      does not lead to observable LR anomalies.
    explanation: >-
      Documents the sharp cross-species divergence between mammals (human and
      mouse) and non-mammalian vertebrates (zebrafish and Xenopus).
  proposed_experiments:
  - experiment_id: ciroz_patient_allele_mouse
    experiment_design: TARGETED_PERTURBATION
    name: Patient-allele knock-in mouse
    description: >-
      Generate mice carrying reported patient CIROZ inactivating alleles and
      assess situs, cardiac looping and congenital heart defects to test
      genotype-phenotype correlation in the faithful mammalian model.
diagnosis:
- name: Cardiac and visceral situs imaging
  description: >-
    Fetal and postnatal echocardiography with abdominal ultrasound define cardiac
    and visceral situs; an interrupted inferior vena cava on echocardiography is a
    recognised flag that should prompt screening for intestinal malrotation.
  diagnosis_term:
    preferred_term: echocardiography and abdominal situs imaging
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:20730421
    reference_title: >-
      Heterotaxy syndrome: defining contemporary disease trends.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the finding of interrupted IVC on echocardiography should prompt screening
      for intestinal malrotation, even in the absence of additional structural
      heart disease
    explanation: >-
      Heterotaxy-generic, NOT CIROZ-specific: echocardiographic findings guide
      situs assessment and prompt malrotation screening in heterotaxy.
- name: Genetic testing (exome/genome sequencing)
  description: >-
    Trio-based whole-exome or whole-genome sequencing is the confirmatory route
    given the locus heterogeneity of heterotaxy; CIROZ should be included on
    heterotaxy/laterality gene panels. Current NGS leaves most cases unsolved,
    which is the diagnostic gap CIROZ discovery helps narrow.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42630107
    reference_title: >-
      Genetics in Heterotaxy: A Case Series and Literature Review on DNAH9, PKD1L1, MMP21, and GDF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      next-generation sequencing (NGS) currently identifies disease-causing
      variants in only 20%-30% of HTX cases
    explanation: >-
      Heterotaxy-generic, NOT CIROZ-specific: documents the low molecular
      diagnostic yield that motivates broad sequencing and panel inclusion of new
      genes such as CIROZ.

  - reference: clinicaltrials:NCT03347344
    reference_title: "Multicenter, Randomized, Double Blind, Placebo Controlled Clinical Trial With Riluzole in Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATRIL is a multi-centric, double-blind randomized, two-arm controlled
      study. 42 SpinoCerebellar Ataxia type 2 (SCA2) patients, both gender, at
      least 18 years of age will be included.
    explanation: Establishes the trial design and SCA2-specific population.
  - reference: PMID:35063116
    reference_title: >-
      Riluzole in patients with spinocerebellar ataxia type 2 (ATRIL): a
      randomised, double-blind, placebo-controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This trial is registered at ClinicalTrials.gov (NCT03347344) and has been
      completed.
    explanation: >-
      Makes the COMPLETED status verifiable from a cached source. The cached
      registry summary omits phase and status fields, so those were confirmed
      separately against the ClinicalTrials.gov API (PHASE3 / COMPLETED for this
      trial, PHASE1 / ACTIVE_NOT_RECRUITING for NCT06672445) rather than

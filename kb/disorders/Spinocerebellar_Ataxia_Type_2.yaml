diagnosis:
- name: ATXN2 CAG repeat expansion testing
  presence: Positive
  description: >-
    Diagnosis rests on molecular genetic testing for an expanded CAG repeat in
    ATXN2. GeneReviews sets the affected threshold at 33 or more repeats, which
    is also the enrolment threshold used by the ARO-ATXN2 trial. Note this sits
    below the 35-repeat lower bound STRchive gives for the pathogenic band, and
    within STRchive's 31-34 intermediate range - the discrepancy is real and is
    recorded in the genetic block rather than smoothed over.
  evidence:
  - reference: PMID:20301452
    reference_title: Spinocerebellar Ataxia Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA2 rests on the use of molecular genetic testing to
      detect an abnormal CAG trinucleotide repeat expansion in ATXN2. Affected
      individuals have alleles with 33 or more CAG trinucleotide repeats.
    explanation: >-
      GeneReviews states both the confirmatory test and the numeric diagnostic
      threshold.
- name: Prenatal and presymptomatic molecular testing
  description: >-
    Once the family's expansion has been characterised, prenatal testing is
    available for a pregnancy at increased risk. Offspring of an affected
    individual have a 50% risk, and the repeat may expand on transmission,
    particularly from the father - so the inherited allele is not necessarily
    the parental one.
  evidence:
  - reference: PMID:20301452
    reference_title: Spinocerebellar Ataxia Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Offspring of an affected individual have a 50% chance of inheriting the
      causative CAG trinucleotide repeat expansion. The repeat may expand
      significantly, especially when transmitted by the father.
    explanation: >-
      Gives the recurrence risk and the paternal expansion bias that makes
      counselling non-trivial.
clinical_trials:
- name: NCT06672445
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    ARO-ATXN2, an RNA-interference therapeutic lowering ATXN2 expression. This
    is the clinical realisation of the preclinical ATXN2-lowering rationale
    curated on the trigger node. Note ARO-ATXN2 is an RNAi/siRNA platform, not
    an antisense oligonucleotide, and is deliberately not conflated with the
    ASO treatment entry.
  evidence:
  - reference: clinicaltrials:NCT06672445
    reference_title: "A Phase 1 Placebo-Controlled Dose Escalating Study to Evaluate the Safety, Tolerability, Pharmacokinetics, and Pharmacodynamics of ARO-ATXN2 in Adult Subjects With Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult participants with spinocerebellar ataxia type 2 (SCA2) who carry
      ≥33 cytosine, adenine, guanine (CAG) repeats in the ATXN2 gene, and who
      have met all protocol eligibility criteria will be randomized to receive
      a single dose of ARO-ATXN2 or placebo
    explanation: >-
      Confirms the trial targets ATXN2 lowering in SCA2 and gives its 33-repeat
      enrolment threshold.
- name: NCT03347344
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ATRIL, the SCA2-specific riluzole trial. Completed and negative; the result
    is curated as a REFUTE evidence item on the riluzole treatment.

name: Spinocerebellar Ataxia Type 2
creation_date: "2026-08-23T15:30:00Z"
category: Mendelian
synonyms:
- SCA2
- Spinocerebellar ataxia 2
- Spinocerebellar atrophy 2
- OPCA2
- Wadia-Swami syndrome
- Spinocerebellar ataxia with slow eye movements
description: >-
  Spinocerebellar ataxia type 2 (SCA2) is an autosomal dominant, adult-onset
  neurodegenerative disease caused by expansion of a translated CAG repeat in
  exon 1 of ATXN2 (12q24.1), producing a polyglutamine-expanded ataxin-2
  protein. It accounts for roughly 13% of autosomal dominant cerebellar ataxia
  type I and is distinguished clinically from its closest relatives, SCA1 and
  SCA3, by markedly slowed saccades and by severe olivopontocerebellar atrophy
  on imaging and at autopsy. Two features separate SCA2 from the other
  polyglutamine diseases at the mechanistic level. First, the pathological
  aggregates are cytoplasmic rather than intranuclear, and neither nuclear
  localization nor inclusion-body formation is required for pathogenesis.
  Second, normal ataxin-2 is an RNA-binding and translational regulator that
  assembles into stress granules and P-bodies, so the disease-relevant loss of
  function is translational rather than transcriptional. Downstream, mutant
  ataxin-2 sensitizes the type 1 inositol trisphosphate receptor and
  destabilizes Purkinje cell calcium handling; Purkinje cell firing frequency
  falls weeks before any cell is lost, which is the rationale for the
  ATXN2-lowering oligonucleotide programmes now in trial. A separate,
  non-overlapping claim concerns intermediate-length ATXN2 alleles, which are an
  established risk factor for amyotrophic lateral sclerosis and act through
  modification of TDP-43 toxicity rather than through the polyglutamine
  aggregation route described above. No disease-modifying therapy is approved;
  riluzole was tested in an SCA2-specific randomised trial and was negative.

animal_models:
- name: Pcp2-ATXN2 Q127 transgenic mouse
  species: Mouse
  genotype: Pcp2-ATXN2[Q127] transgenic, Purkinje-cell-restricted
  publication: PMID:23087021
  description: >-
    A Purkinje-cell-targeted full-length ATXN2 transgenic that establishes the
    temporal ordering on which the therapeutic rationale depends: firing
    frequency falls before motor signs, and both precede cell loss.
  modeled_mechanisms:
  - target: Purkinje Cell Firing Frequency Decline
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Firing frequency declines from 6 weeks, motor performance from 8 weeks,
      and Purkinje cell number is preserved until after 12 weeks.
    limitations: >-
      Expression is driven by a Purkinje-cell-specific promoter, so the model
      cannot speak to the brainstem, spinal cord or peripheral involvement that
      is part of the human disease, and Q127 exceeds the repeat length of most
      patients.
    readouts:
    - name: Purkinje cell spontaneous firing frequency
      target: Purkinje Cell Firing Frequency Decline
      direction: DECREASED
      interpretation: >-
        The electrophysiological lesion, detectable before any structural loss.
      evidence:
      - reference: PMID:23087021
        reference_title: >-
          Changes in Purkinje cell firing and gene expression precede behavioral
          pathology in a mouse model of SCA2.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Decreases in the PC firing frequency first showed at 6 weeks and
          paralleled deterioration of motor performance with progression of
          disease.
        explanation: Direct measurement of the firing decline and its timing.
    evidence:
    - reference: PMID:23087021
      reference_title: >-
        Changes in Purkinje cell firing and gene expression precede behavioral
        pathology in a mouse model of SCA2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results emphasize that in this model of SCA2, physiological and
        behavioral phenotypes precede morphological changes by several weeks
      explanation: >-
        The ordering claim that makes this model informative for a treatable
        pre-degenerative window.
- name: BAC-Q72 SCA2 mouse
  species: Mouse
  genotype: BAC transgenic carrying full-length human ATXN2 with expanded CAG (BAC-Q72)
  publication: PMID:25902068
  description: >-
    Expresses the full-length human ATXN2 gene under its own regulatory
    machinery, so expression is not restricted to one cell type. The
    wild-type-repeat BAC-Q22 line is the matched control and is
    indistinguishable from wild type, which is a genuine internal negative
    control for repeat length rather than for transgenesis.
  modeled_mechanisms:
  - target: Loss of Ataxin-2 RNA-Binding and Translational Regulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-

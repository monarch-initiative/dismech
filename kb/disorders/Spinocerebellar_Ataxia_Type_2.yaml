mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010065
      label: spinocerebellar degeneration with slow eye movements
    mapping_predicate: skos:closeMatch
    notes: >-
      MONDO lists MONDO:0010065 (spinocerebellar degeneration with slow eye
      movements, SDSEM, Wadia-Swami syndrome) as a descendant of SCA2, but the
      term carries no definition and an editor note reading "check this". Its
      OMIM xref (OMIM:271322) sits in the recessive series while SCA2 is
      OMIM:183090 and dominant. The concept is therefore recorded here as a
      close match rather than curated as a has_subtypes entry, which would
      assert an identity the source ontology itself flags as unresolved. Per
      the MONDO-coverage rule, skos:closeMatch deliberately does not retire the
      concept from the curation queue - which is the right outcome here.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA2 is inherited in an autosomal dominant manner with essentially full
    penetrance above approximately 35 CAG repeats. Alleles of 33-34 repeats show
    reduced penetrance and later onset. The repeat is intergenerationally
    unstable, producing anticipation, and CAA, CGG and CGC interruptions within
    the tract stabilise it in transmission.
  evidence:
  - reference: PMID:18418684
    reference_title: "Spinocerebellar ataxia type 2 (SCA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease cause lies in the polyglutamine domain of the protein
      ataxin-2, which can expand in families over successive generations
      resulting in earlier onset age and faster progression.
    explanation: >-
      Establishes intergenerational instability of the ATXN2 polyglutamine tract
      and the resulting anticipation.
  - reference: STRCHIVE:SCA2_ATXN2
    reference_title: "ATXN2 — Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interruptions observed include CAA, CGG, CGC, which appear to stabilize the allele in transmission"
    explanation: >-
      STRchive records the stabilising repeat interruptions, which modify
      transmission instability independently of pure glutamine count.
- name: Autosomal recessive (rare)
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A rare recessive presentation is recorded, in which homozygosity for alleles
    in the intermediate range (reported for 31 repeats) produces disease that
    single alleles of the same length would not. This is curated as a distinct
    inheritance mode rather than folded into the dominant block, because it
    changes what a given allele length predicts for a given individual.
  evidence:
  - reference: STRCHIVE:SCA2_ATXN2
    reference_title: "ATXN2 — Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Homozygous 31 repeat alleles may lead to recessive disease"
    explanation: >-
      STRchive records a recessive route to SCA2 through homozygous
      intermediate-length alleles; its inheritance field is correspondingly
      "AD (Autosomal dominant), AR (Autosomal recessive)".
genetic:
- name: ATXN2
  gene_term:
    preferred_term: ATXN2
    term:
      id: hgnc:10555
      label: ATXN2
  association: >-
    Translated CAG repeat expansion in exon 1 of ATXN2 encoding an elongated
    polyglutamine tract in ataxin-2. The normal allele range is 14-30 repeats,
    31-34 is intermediate, and 35-500 is pathogenic. Normal alleles carry CAA
    interruptions; pathogenic alleles are typically pure CAG.
  evidence:
  - reference: PMID:8896555
    reference_title: >-
      Moderate expansion of a normally biallelic trinucleotide repeat in
      spinocerebellar ataxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCA2 patients, the repeat was perfect and expanded to 36-52 repeats.
      The most common disease allele contained (CAG)37, one of the shortest
      expansions seen in a CAG expansion syndrome.
    explanation: >-
      The identifying paper reports both the expansion range and the loss of
      CAA interruptions ("perfect" repeat) that distinguishes disease alleles.
  - reference: PMID:8896555
    reference_title: >-
      Moderate expansion of a normally biallelic trinucleotide repeat in
      spinocerebellar ataxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using this contig, we identified a CAG trinucleotide repeat with CAA
      interruptions that was expanded in patients with SCA2.
    explanation: Localises the expansion to ATXN2 and records the CAA interruption structure.
  - reference: STRCHIVE:SCA2_ATXN2
    reference_title: "ATXN2 — Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Pathogenic | 35 | 500 |"
    explanation: >-
      STRchive gives the pathogenic ATXN2 CAG repeat range (35-500 copies) as a
      structured, snippet-validatable source for a threshold that would
      otherwise be uncited prose.
  - reference: STRCHIVE:SCA2_ATXN2
    reference_title: "ATXN2 — Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Benign | 14 | 30 |"
    explanation: STRchive gives the benign ATXN2 CAG repeat range.
  - reference: STRCHIVE:SCA2_ATXN2
    reference_title: "ATXN2 — Spinocerebellar Ataxia Type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Intermediate | 31 | 34 |"
    explanation: >-
      STRchive's intermediate band. Note this does not coincide with the 27-33
      band Elden et al. report for ALS risk; the two numbers come from
      different sources and are curated separately rather than reconciled.
  notes: >-
    Repeat-length thresholds in SCA2 are source-dependent and must not be
    silently harmonised. STRchive gives intermediate = 31-34; Elden et al.
    (PMID:20740007) report ALS association for 27-33 glutamines; the ARO-ATXN2
    trial enrols at 33 or more repeats. Each number is attributed to its source
    where it is used.
pathophysiology:
- name: Expanded Translated CAG Repeat in ATXN2
  conforms_to: "polyglutamine_expansion_proteotoxicity#Translated CAG / Polyglutamine Repeat Expansion"
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a CAG repeat in exon 1 of ATXN2 expanded beyond the
    pathogenic threshold of approximately 35 copies, within the translated
    reading frame, so the tract is expressed as an elongated polyglutamine
    domain in ataxin-2. Normal alleles are 14-30 copies and carry CAA
    interruptions; pathogenic alleles are typically pure CAG, and loss of the
    interruption is itself part of the lesion rather than an incidental detail.
    Repeat length is inversely correlated with age of onset.
  genes:
  - preferred_term: ATXN2
    term:
      id: hgnc:10555
      label: ATXN2
  genetic_context:
    allele_type: trinucleotide repeat expansion
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Germline expansion of the exon 1 CAG tract beyond ~35 copies. The
      consequence is a toxic gain of function of the expanded protein, with a
      concurrent partial loss of ataxin-2's normal translational-regulatory
      function.
  evidence:
  - reference: PMID:8896555
    reference_title: >-
      Moderate expansion of a normally biallelic trinucleotide repeat in
      spinocerebellar ataxia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCA2 patients, the repeat was perfect and expanded to 36-52 repeats.
    explanation: >-
      Establishes the expanded, uninterrupted CAG tract in ATXN2 as the
      initiating molecular lesion.
  downstream:
  - target: Cytoplasmic PolyQ-Ataxin-2 Misfolding and Microaggregation
    causal_link_type: DIRECT
    description: >-
      The elongated polyglutamine domain drives misfolding and aggregation of
      ataxin-2.
  - target: Loss of Ataxin-2 RNA-Binding and Translational Regulation
    causal_link_type: DIRECT
    description: >-
      The same expansion impairs ataxin-2's normal selective mRNA-binding
      function, so toxic gain and partial loss of function arise from one lesion.
- name: Cytoplasmic PolyQ-Ataxin-2 Misfolding and Microaggregation
  conforms_to: "polyglutamine_expansion_proteotoxicity#Misfolded Polyglutamine Protein Aggregation"
  biological_scale: MOLECULAR
  description: >-
    PolyQ-expanded ataxin-2 misfolds and forms microaggregates. This is the node
    at which SCA2 departs from the polyglutamine stereotype set by Huntington
    disease and SCA3: in SCA2 brains the aggregates are cytoplasmic, not
    nuclear, and transgenic ataxin-2[Q58] remains cytoplasmic without detectable
    ubiquitination while still producing progressive Purkinje cell loss. Neither
    nuclear localization nor inclusion-body formation is necessary for
    pathogenesis. Curators extending this entry should not "correct" it toward
    the nuclear-inclusion pattern; the cytoplasmic localization is the
    experimentally supported claim and is what differentiates SCA2 within the
    Polyglutamine Disorders grouping.
  genes:
  - preferred_term: ATXN2
    term:
      id: hgnc:10555
      label: ATXN2
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:10973246
    reference_title: >-
      Nuclear localization or inclusion body formation of ataxin-2 are not
      necessary for SCA2 pathogenesis in mouse or human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCA2 brains, we found cytoplasmic, but not nuclear, microaggregates.
    explanation: >-
      Direct human neuropathological evidence that SCA2 aggregation is
      cytoplasmic, unlike the intranuclear inclusions of other polyQ diseases.
  - reference: PMID:10973246
    reference_title: >-
      Nuclear localization or inclusion body formation of ataxin-2 are not
      necessary for SCA2 pathogenesis in mouse or human.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice expressing ataxin-2 with Q58 showed progressive functional deficits
      accompanied by loss of the Purkinje cell dendritic arbor and finally loss
      of Purkinje cells.
    explanation: >-
      A cytoplasmic, non-ubiquitinated polyQ-ataxin-2 species is sufficient to
      produce progressive dendritic-arbor loss and Purkinje cell death, so
      nuclear inclusion formation is not required for the degenerative
      phenotype.
  downstream:
  - target: Purkinje Cell Calcium Dysregulation via InsP3R1 Sensitization
    causal_link_type: DIRECT
    description: >-
      Mutant ataxin-2 associates with and sensitizes the type 1 inositol
      trisphosphate receptor.
- name: Loss of Ataxin-2 RNA-Binding and Translational Regulation
  biological_scale: MOLECULAR
  description: >-
    Normal ataxin-2 is an RNA-binding translational regulator: it interacts with
    the DEAD/H-box helicase DDX6 and with poly(A)-binding protein, and its
    concentration governs assembly of stress granules and P-bodies. PolyQ
    expansion impairs selective mRNA binding - shown directly for RGS8 mRNA,
    whose protein product attenuates mGluR1 signalling. This node is curated as
    a disease-specific translational lesion rather than as conformance to the
    module's "Transcriptional Dysregulation" node, because ataxin-2 is an RNA
    and translation regulator, not a transcription factor; asserting
    transcriptional conformance here would import a claim from the HD/SCA17
    pattern that SCA2's own evidence does not make.
  genes:
  - preferred_term: ATXN2
    term:
      id: hgnc:10555
      label: ATXN2
  molecular_functions:
  - preferred_term: mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of translation
    term:
      id: GO:0006417
      label: regulation of translation
    modifier: DECREASED
  evidence:
  - reference: PMID:17392519
    reference_title: >-
      Ataxin-2 interacts with the DEAD/H-box RNA helicase DDX6 and interferes
      with P-bodies and stress granules.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We discovered that altered ataxin-2 levels interfere with the assembly of
      stress granules and cellular P-body structures.
    explanation: >-
      Establishes ataxin-2's normal role in RNA-triage compartment assembly,
      the function lost on expansion.
  - reference: PMID:25902068
    reference_title: >-
      Ataxin-2 regulates RGS8 translation in a new BAC-SCA2 transgenic mouse
      model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using RNA immunoprecipitation we showed that ATXN2 interacted selectively
      with RGS8 mRNA. This interaction was impaired when ATXN2 harbored an
      expanded polyglutamine.
    explanation: >-
      Direct demonstration that polyQ expansion impairs a specific, identified
      mRNA-binding function of ataxin-2, linking the translational lesion to
      mGluR1 signalling.
  downstream:
  - target: Purkinje Cell Calcium Dysregulation via InsP3R1 Sensitization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced RGS8 removes attenuation of mGluR1 signalling, converging on the
      same hyperexcitable mGluR1-ITPR1 axis.
- name: Purkinje Cell Calcium Dysregulation via InsP3R1 Sensitization
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Cell Calcium and Proteostasis Dysregulation"
  biological_scale: CELLULAR
  description: >-
    Mutant ataxin-2 binds the cytosolic C-terminal region of the type 1 inositol
    1,4,5-trisphosphate receptor and increases its sensitivity to activation,
    producing exaggerated calcium release in Purkinje cells and increased
    vulnerability to glutamate. The pharmacological arm of this claim is
    unusually strong for a mechanism node: the ryanodine-receptor inhibitor and
    calcium stabilizer dantrolene both attenuates glutamate-induced death in
    culture and reduces Purkinje cell loss in the SCA2-58Q mouse.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: DYSREGULATED
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:19625506
    reference_title: >-
      Deranged calcium signaling and neurodegeneration in spinocerebellar ataxia
      type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Association with Atx2-58Q increased the sensitivity of InsP(3)R1 to
      activation by InsP(3) in planar lipid bilayer reconstitution experiments.
    explanation: >-
      Identifies the direct molecular interaction by which mutant ataxin-2
      destabilizes Purkinje cell calcium handling.
  - reference: PMID:19625506
    reference_title: >-
      Deranged calcium signaling and neurodegeneration in spinocerebellar ataxia
      type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Glutamate-induced cell death of 58Q PC cultures was attenuated by
      dantrolene, a clinically relevant RyanR inhibitor and Ca(2+) stabilizer.
    explanation: >-
      Pharmacological rescue supports the calcium lesion as causal rather than
      merely correlated with degeneration.
  downstream:
  - target: Purkinje Cell Firing Frequency Decline
    causal_link_type: DIRECT
    description: >-
      Disturbed calcium handling degrades the intrinsic pacemaking that sets
      Purkinje cell output.
- name: Purkinje Cell Firing Frequency Decline
  biological_scale: CELLULAR
  description: >-
    Purkinje cells lose intrinsic firing frequency well before they are lost.
    In the ATXN2-Q127 mouse, firing frequency falls from 6 weeks and tracks
    motor deterioration, while Purkinje cell number is preserved until after 12
    weeks. This ordering is the mechanistic rationale for ATXN2-lowering
    therapy: the treatable lesion is an electrophysiological one that precedes
    irreversible cell loss, and ASO treatment restores firing even when started
    after motor onset.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:23087021
    reference_title: >-
      Changes in Purkinje cell firing and gene expression precede behavioral
      pathology in a mouse model of SCA2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although motor performance began to deteriorate at 8 weeks of age,
      reductions in PC number were not seen until after 12 weeks. Decreases in
      the PC firing frequency first showed at 6 weeks and paralleled
      deterioration of motor performance with progression of disease.
    explanation: >-
      Establishes the temporal ordering: firing decline precedes both motor
      signs and Purkinje cell loss.
  downstream:
  - target: Olivopontocerebellar Neurodegeneration
    causal_link_type: DIRECT
    description: >-
      Sustained Purkinje dysfunction proceeds to frank neuronal loss across the
      olivopontocerebellar system.
- name: Olivopontocerebellar Neurodegeneration
  conforms_to: "polyglutamine_expansion_proteotoxicity#Selective Neuronal Dysfunction and Loss"
  biological_scale: TISSUE
  description: >-
    SCA2 produces early and severe degeneration of the olivopontocerebellar
    system - cerebellar cortex, pontine nuclei and inferior olives - extending
    with progression to substantia nigra, striatum, pallidum and eventually
    neocortex, while the dentate nucleus is consistently spared. This
    distribution is broader than the purely cerebellar SCAs and overlaps
    regions affected in Huntington disease, and it accounts for the parkinsonian
    and cognitive features that appear later in the course.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  evidence:
  - reference: PMID:10090679
    reference_title: >-
      Spinocerebellar ataxia type 2 (SCA2) - neuropathological findings in
      eleven Cuban patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The degeneration of the olivopontocerebellar regions as in classical
      olivopontocerebellar atrophy occurred early and severely in SCA2.
    explanation: >-
      Quantitative autopsy series establishing the olivopontocerebellar
      distribution and its early, severe onset.
  - reference: PMID:10090679
    reference_title: >-
      Spinocerebellar ataxia type 2 (SCA2) - neuropathological findings in
      eleven Cuban patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuropathological progression soon included neuronal loss in the
      substantia nigra, striatum, pallidum and later even the neocortex, while
      the dentate nucleus was consistently spared.
    explanation: >-
      Records both the extracerebellar spread and the consistently spared
      dentate nucleus, which distinguishes SCA2 from SCA3.
  downstream:
  - target: Repeat-Length-Dependent Onset and Progressive Ataxia
    causal_link_type: DIRECT
    description: >-
      Progressive loss of cerebellar and brainstem neurons produces the clinical
      syndrome.
- name: Repeat-Length-Dependent Onset and Progressive Ataxia
  conforms_to: "mismatch_repair_driven_repeat_instability#Repeat-Length-Dependent Onset, Progression, and Anticipation"
  biological_scale: ORGANISM
  description: >-
    Age of onset is inversely correlated with repeat length, and intergenerational
    instability produces anticipation. Progression is not linear: in a prospective
    cohort, SARA scores advanced 0.35 points per year before 10 years of disease
    duration and 2.45 points per year after it, which matters directly for trial
    design because disease duration, not baseline severity, sets the expected rate.
  evidence:
  - reference: PMID:29370806
    reference_title: >-
      The progression rate of spinocerebellar ataxia type 2 changes with stage
      of disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Then an acceleration was detected after 10 years of disease duration: SARA
      scores progressed 0.35 before and 2.45 points/year after this deadline
      (p = 0.013).
    explanation: >-
      Quantifies stage-dependent, non-linear progression in a prospective SCA2
      cohort.
  - reference: PMID:29370806
    reference_title: >-
      The progression rate of spinocerebellar ataxia type 2 changes with stage
      of disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age at onset, mutation severity, and presence of amyotrophy, parkinsonism,
      dystonic manifestations and cognitive decline at baseline did not influence
      the rate of disease progression.
    explanation: >-
      A negative result worth preserving: baseline clinical features do not
      predict progression rate, so disease duration is the operative variable.
- name: Intermediate-Length ATXN2 Allele as an ALS Risk Modifier
  biological_scale: MOLECULAR
  description: >-
    This node is deliberately kept off the main SCA2 chain. Intermediate-length
    ATXN2 polyglutamine expansions are an established risk factor for
    amyotrophic lateral sclerosis, acting by modifying TDP-43 toxicity rather
    than through the cytoplasmic polyQ aggregation route that drives SCA2
    itself. It is a susceptibility claim about a different disease, not a step
    in SCA2 pathogenesis, and is curated here because the same locus carries
    both. Reported length bands differ by source and are not reconciled: Elden
    et al. report 27-33 glutamines for ALS association, while STRchive's
    intermediate band is 31-34. Note the boundary is not absolute - FTLD-ALS with
    TDP-43 pathology has been described in a family carrying a full ataxin-2
    expansion - so full-expansion carriers should not be described as
    categorically free of motor neuron disease.
  genes:
  - preferred_term: ATXN2
    term:
      id: hgnc:10555
      label: ATXN2
  evidence:
  - reference: PMID:20740007
    reference_title: >-
      Ataxin-2 intermediate-length polyglutamine expansions are associated with
      increased risk for ALS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that intermediate-length polyQ expansions (27-33 glutamines) in ATXN2 were significantly associated with ALS. These data establish ATXN2 as a relatively common ALS susceptibility gene."
    explanation: >-
      The landmark association study establishing intermediate ATXN2 alleles as
      an ALS susceptibility factor, with the length band as the authors report it.
  - reference: PMID:28405022
    reference_title: >-
      Therapeutic reduction of ataxin-2 extends lifespan and reduces pathology
      in TDP-43 mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The decrease in ataxin-2 reduced aggregation of TDP-43, markedly increased
      survival and improved motor function.
    explanation: >-
      Supports the mechanism of the ALS arm as ataxin-2 dose-dependent
      modification of TDP-43 toxicity, distinct from SCA2's own polyQ cascade.
  notes: >-
    Do not add SCA2 to a TDP-43 proteinopathy grouping on the strength of this
    modifier relationship. Ataxin-2 modifies TDP-43 toxicity; SCA2 is not itself
    curated as a TDP-43 proteinopathy.
phenotypes:
- category: Neurological
  name: Progressive Cerebellar Ataxia
  description: >-
    Progressive gait, limb and truncal incoordination is the defining feature and
    the basis of SARA-based staging.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:18418684
    reference_title: "Spinocerebellar ataxia type 2 (SCA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinocerebellar ataxia type 2 (SCA2) is an autosomal dominantly inherited,
      neurodegenerative disease. It can manifest either with a cerebellar
      syndrome or as Parkinson's syndrome, while later stages involve mainly
      brainstem, spinal cord and thalamus.
    explanation: Establishes the cerebellar syndrome as a core presenting phenotype.
- category: Neurological
  name: Slowed Saccades
  description: >-
    Slowing of saccadic eye movements is the single most discriminating clinical
    sign of SCA2. It was present in all SCA2 patients in a genotype-phenotype
    series, against 56% of SCA1 and 30% of SCA3, and it frequently precedes
    ataxia.
  phenotype_term:
    preferred_term: Slow saccadic eye movements
    term:

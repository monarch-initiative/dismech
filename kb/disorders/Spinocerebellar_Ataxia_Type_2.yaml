treatments:
- name: Riluzole
  description: >-
    Tested specifically in SCA2 in the randomised, double-blind,
    placebo-controlled ATRIL trial and found not to be effective. Curated as a
    refuted treatment claim rather than omitted, because the negative result is
    what a curator or clinician needs to know about a drug with positive
    reports in mixed-aetiology ataxia cohorts.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:35063116
    reference_title: >-
      Riluzole in patients with spinocerebellar ataxia type 2 (ATRIL): a
      randomised, double-blind, placebo-controlled trial.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint, SARA score improvement of at least 1 point after 12
      months, was observed in seven patients (32%) in the treated group versus
      nine patients (39%) in the placebo group
    explanation: >-
      The SCA2-specific randomised trial did not meet its primary endpoint;
      numerically fewer treated than placebo patients improved.
- name: ATXN2-Lowering Antisense Oligonucleotide (investigational)
  description: >-
    Reducing ATXN2 expression addresses the initiating lesion rather than a
    downstream consequence. In two SCA2 mouse models the lead oligonucleotide
    ASO7 delayed phenotype onset and restored Purkinje cell firing frequency
    even when started more than 12 weeks after motor onset, which is the
    strongest available argument that the electrophysiological lesion is
    reversible. This is preclinical; no ASO is approved for SCA2.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: ATXN2
      term:
        id: hgnc:10555
        label: ATXN2
    target_transcript: ATXN2 mRNA
  target_mechanisms:
  - target: Expanded Translated CAG Repeat in ATXN2
    treatment_effect: INHIBITS
    description: >-
      Lowers expression of the mutant transcript at the initiating node,
      upstream of aggregation and calcium dysregulation.
    evidence:
    - reference: PMID:28405024
      reference_title: Antisense oligonucleotide therapy for spinocerebellar ataxia type 2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The most promising oligonucleotide, ASO7, downregulated ATXN2 mRNA and
        protein, which resulted in delayed onset of the SCA2 phenotype.
      explanation: >-
        Establishes that lowering ATXN2 at the initiating node delays the
        downstream phenotype.
  evidence:
  - reference: PMID:28405024
    reference_title: Antisense oligonucleotide therapy for spinocerebellar ataxia type 2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, the firing frequency of Purkinje cells returned to normal even
      when treatment was initiated more than 12 weeks after the onset of the
      motor phenotype in BAC-Q72 mice.
    explanation: >-
      Supports reversibility of the Purkinje firing lesion after symptom onset,
      the central preclinical rationale for ATXN2 lowering.

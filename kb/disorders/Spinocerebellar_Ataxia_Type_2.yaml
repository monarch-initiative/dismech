discussions:
- discussion_id: gap_sca2_somatic_repeat_expansion
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Repeat-Length-Dependent Onset and Progressive Ataxia
  prompt: >-
    Does ongoing somatic CAG expansion in post-mitotic neurons drive SCA2
    progression, as it does in Huntington disease and SCA3?
  rationale: >-
    This entry deliberately does NOT declare conformance to
    mismatch_repair_driven_repeat_instability#Somatic Repeat Expansion in
    Post-Mitotic Cells, although SCA2 is a CAG-repeat disease and the module's
    other conformers do. The reason is evidential, not conceptual. The best
    available support is Bettencourt et al., which pools Huntington disease with
    multiple polyglutamine SCAs and finds DNA-repair variants modifying age at
    onset across the pooled set; it does not isolate SCA2, and no study
    measuring somatic ATXN2 CAG mosaicism in human SCA2 tissue was identified.
    Conformance is therefore withheld rather than asserted from analogy, which
    keeps the module's flagship conformers - all of which have direct
    measurements - honest. Conformance to the threshold and
    repeat-length-dependence nodes IS declared, because those are directly
    evidenced.
  evidence:
  - reference: PMID:27044000
    reference_title: >-
      DNA repair pathways underlie a common genetic mechanism modifying onset in
      polyglutamine diseases.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent genome-wide association study (GWAS) in HD found association
      between age at onset and genetic variants in DNA repair pathways, and we
      therefore tested whether the modifying effects of variants in DNA repair
      genes have wider effects in the polyglutamine diseases.
    explanation: >-
      Shows the DNA-repair modifier signal is established across pooled
      polyglutamine diseases, which is suggestive for SCA2 but does not isolate
      it - the precise reason this is a gap rather than a curated edge.
  proposed_experiments:
  - experiment_id: exp_sca2_somatic_mosaicism_autopsy
    name: Somatic ATXN2 CAG mosaicism in SCA2 post-mortem cerebellum
    description: >-
      Small-pool PCR or long-read sequencing of the ATXN2 repeat across
      cerebellar cortex, pontine nuclei, inferior olive and a mitotic control
      tissue from SCA2 autopsy cases, testing whether expansion size increases
      in the vulnerable post-mitotic populations relative to blood.
- discussion_id: open_sca2_aggregate_toxicity_direction
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Cytoplasmic PolyQ-Ataxin-2 Misfolding and Microaggregation
  prompt: >-
    Are the cytoplasmic ataxin-2 microaggregates themselves toxic, or an inert or
    protective sequestration of more toxic soluble oligomers?
  rationale: >-
    The aggregation node is curated as part of the causal chain because the
    aggregates track the distribution of degeneration, but the direction of that
    relationship is not settled. Evidence exists that smaller soluble oligomers
    are the more toxic species and that inclusions act as reservoirs. The node's
    downstream edge is therefore best read as "accompanies and marks" rather
    than as a demonstrated toxic mechanism at the level of the inclusion itself.
notes: >-
  Curation provenance: a Perplexity deep-research report was generated for this
  entry (research/Spinocerebellar_Ataxia_Type_2-deep-research-perplexity.md) and
  passed the NEC preflight against MONDO:0008458 (ATXN2 mentioned 117 times, no
  rival gene). It was used as a lead-generation aid only - no snippet, PMID or
  ontology term in this entry is taken from the report's prose. Two of the
  report's own sources are MalaCards pages for DIFFERENT diseases
  ("spinocerebellar ataxia x-linked 2" and "spinocerebellar ataxia 8"), so any
  claim traced to those sources was discarded; this is a source-level named
  entity confusion that a report-level preflight PASS does not catch.

  A second search hazard worth recording for future curators: the token "Sca2"
  is also the name of a Rickettsia rickettsii surface autotransporter, so a bare
  SCA2 literature search returns cell-biology papers on bacterial actin motility
  that have nothing to do with this disease.

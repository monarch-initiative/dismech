datasets:
- accession: geo:GSE205867
  title: transcriptional profiling of neutrophils in Behcet's Disease (BD).
  description: Behçet’s Disease (BD) is a chronic and systemic vasculitis with unknown etiology. Although BD is considered a condition linking both autoimmunity and autoinflammation, aberrant innate immunity has emerged in its significant pathogenetic role, among which neutrophils directly drive inflammation in BD. To investigate neutrophil aberrance in BD, we performed bulk RNA-sequencing on isolated peripheral neutrophils from 10 pairs of BD and sex- and age-matched healthy control (HCs).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 20
  publication: PMID:36243348
  notes: Identified by GEO DataSets index search for Behcet's Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: massive:MSV000089312
  title: The Behcet's disease risk variant HLA-B51/ ERAP1-Hap10 alters human CD8 T cell immunity
  description: 'The ERAP1 haplotype Hap10 encodes for a variant allotype of the ER-resident peptide-trimming aminopeptidase ERAP1 with low enzymatic activity resembling functional KO. This haplotype recessively confers the highest risk for Behcet''s diseases (BD) currently known, but only in carriers of HLA-B*51, the classical risk factor for the disease. The mechanistic implications and biological consequences of this epistatic relationship are unknown. Here, we aimed to determine its biological relevance and functional impact, including its effect on the HLA-class I peptidome.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Behcet's Disease"). Retrieved 2026-08-02.

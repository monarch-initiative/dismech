    term:
      id: MONDO:0012349
      label: spondylocostal dysostosis 3, autosomal recessive
  description: >-
    SCDO3 (OMIM:609813) is caused by biallelic pathogenic variants in LFNG
    (LUNATIC FRINGE), a glycosyltransferase that modifies Notch receptors and is
    required for correct oscillation of the segmentation clock. The reported
    vertebral phenotype is severe. GeneReviews notes that neurologic problems
    are a management consideration specifically in LFNG-related SCDO.
  genes:
  - preferred_term: LFNG
    term:
      id: hgnc:6560
      label: LFNG
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:16385447
    reference_title: Mutation of the LUNATIC FRINGE gene in humans causes spondylocostal dysostosis with a severe vertebral phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we have used a candidate-gene approach to identify a mutation in a third Notch pathway gene, LUNATIC FRINGE (LFNG), in a family with autosomal recessive SCD.
    explanation: >-
      Original identification of LFNG as the third autosomal recessive SCDO
      gene, defining the SCDO3 subtype.
  - reference: PMID:20301771
    reference_title: "Spondylocostal Dysostosis, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Standard treatment of neurologic problems associated with LFNG-related SCDO.
    explanation: >-
      GeneReviews singles out LFNG-related SCDO as the form with neurologic
      problems requiring management.
- name: SCDO4
  display_name: SCDO4 (HES7-related)
  subtype_term:
    preferred_term: spondylocostal dysostosis 4, autosomal recessive
    term:
      id: MONDO:0013366
      label: spondylocostal dysostosis 4, autosomal recessive
  description: >-
    SCDO4 (OMIM:613686) is caused by biallelic pathogenic variants in HES7, the
    Notch-driven transcriptional repressor that generates the oscillation of the
    segmentation clock itself. HES7-related disease is distinguished from the
    other SCDO subtypes by co-occurring laterality defects (dextrocardia with
    situs inversus) and neural tube malformations, consistent with an additional
    role outside somitogenesis.
  genes:
  - preferred_term: HES7
    term:
      id: hgnc:15977
      label: HES7
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:23897666
    reference_title: Mutation of HES7 in a large extended family with spondylocostal dysostosis and dextrocardia with situs inversus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that both individuals were homozygous for the same mutation in HES7, and that this mutation caused a significant reduction of HES7 protein function; HES7 mutation causes SCD4.
    explanation: >-
      Explicitly assigns HES7 to the SCDO4 subtype and demonstrates loss of HES7
      function in affected individuals.
  - reference: PMID:23897666
    reference_title: Mutation of HES7 in a large extended family with spondylocostal dysostosis and dextrocardia with situs inversus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In conclusion, it appears that mutation of HES7 is uniquely associated with defects in vertebral, heart and neural tube formation, and this observation will help provide a discriminatory diagnostic guide in patients with SCD, as well as inform molecular genetic testing.
    explanation: >-
      Supports the laterality and neural tube findings as the features that
      differentiate SCDO4 from the other subtypes.
- name: SCDO5
  display_name: SCDO5 (TBX6-related)
  subtype_term:
    preferred_term: spondylocostal dysostosis 5
    term:
      id: MONDO:0007389
      label: spondylocostal dysostosis 5
  description: >-
    SCDO5 (OMIM:122600) is caused by pathogenic variants in TBX6, the
    T-box transcription factor that patterns the presomitic mesoderm at the
    determination wavefront. Unlike SCDO1-SCDO4, SCDO5 was first described with
    autosomal dominant transmission (a stoploss variant acting by
    haploinsufficiency), although GeneReviews also lists TBX6 among the genes in
    which biallelic variants confirm autosomal recessive SCDO. Compound TBX6
    null-plus-hypomorphic dosage insufficiency is modeled separately in the
    TBX6-Associated_Congenital_Scoliosis entry. MONDO carries
    "spondylothoracic dysostosis" as an EXACT synonym on this TBX6 term, which
    is the specific mis-resolution hazard described in issue #4957 — the STD
    entity is MESP2-related (SCDO2), not TBX6-related.
  genes:
  - preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  inheritance:
  - name: Autosomal Dominant
    description: >-
      The originally described SCDO5 family showed autosomal dominant
      transmission of a TBX6 stoploss variant acting by haploinsufficiency.
      GeneReviews treats this as the exception rather than the rule, noting it
      was reported in a single three-generation family.
    evidence:
    - reference: PMID:23335591
      reference_title: Autosomal dominant spondylocostal dysostosis is caused by mutation in TBX6.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This is the first identification of the genetic cause of an autosomal dominant form of SCD, and also demonstrates the potential of exome sequencing to identify genetic causes of dominant diseases even in small families with few affected individuals.
      explanation: >-
        Original report establishing autosomal dominant transmission for
        TBX6-related SCDO.
  - name: Autosomal Recessive
    description: >-
      TBX6 is also listed among the genes in which biallelic pathogenic variants
      cause autosomal recessive SCDO, so SCDO5 is not exclusively dominant. This
      block records the recessive mode alongside the dominant one rather than
      leaving it in the subtype description, where it is not queryable.
    evidence:
    - reference: PMID:20301771
      reference_title: "Spondylocostal Dysostosis, Autosomal Recessive."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: SCDO caused by biallelic pathogenic variants in DLL3, HES7, LFNG, MESP2, RIPPLY2, or TBX6 is inherited in an autosomal recessive manner.
      explanation: >-
        GeneReviews names TBX6 among the genes whose biallelic variants produce
        autosomal recessive SCDO, which is the basis for recording a recessive
        mode on the TBX6-anchored SCDO5 subtype.
  evidence:
  - reference: PMID:23335591
    reference_title: Autosomal dominant spondylocostal dysostosis is caused by mutation in TBX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we have used exome capture and next-generation sequencing to identify a stoploss mutation in TBX6 that segregates with disease in two generations of one family.
    explanation: >-
      Original identification of TBX6 as an SCDO gene, defining the SCDO5
      subtype.
  - reference: PMID:23335591
    reference_title: Autosomal dominant spondylocostal dysostosis is caused by mutation in TBX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is the first identification of the genetic cause of an autosomal dominant form of SCD, and also demonstrates the potential of exome sequencing to identify genetic causes of dominant diseases even in small families with few affected individuals.
    explanation: >-
      Supports the autosomal dominant inheritance that distinguishes SCDO5 from
      the recessive SCDO1-SCDO4 subtypes.
- name: SCDO6
  display_name: SCDO6 (RIPPLY2-related)
  subtype_term:
    preferred_term: spondylocostal dysostosis 6, autosomal recessive
    term:
      id: MONDO:0014694
      label: spondylocostal dysostosis 6, autosomal recessive
  description: >-
    SCDO6 (OMIM:616566) is caused by biallelic pathogenic variants in RIPPLY2,
    which acts with MESP2 to establish somite rostrocaudal polarity. Reported
    individuals have cervical- and thoracic-predominant vertebral body
    malformations with limited rib involvement, and myelopathy from congenital
    cervical spine malformation is a recognized complication.
  genes:
  - preferred_term: RIPPLY2
    term:
      id: hgnc:21390
      label: RIPPLY2
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:25343988
    reference_title: Compound heterozygous mutations in RIPPLY2 associated with vertebral segmentation defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that compound heterozygous mutations in RIPPLY2 are associated with SDV, a new gene for this condition.
    explanation: >-
      Report that first associated compound heterozygous RIPPLY2 variants with
      segmentation defects of the vertebrae, the basis of the SCDO6 subtype.
      This is the paper's own concluding sentence, which names RIPPLY2
      explicitly; it replaces a generic SDV-background sentence that never
      mentioned the gene and so could not license the association claim.
  - reference: PMID:33410135
    reference_title: Congenital cervical spine malformation due to bi-allelic RIPPLY2 variants in spondylocostal dysostosis type 6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients had multiple vertebral body malformations in the cervical and thoracic region, small or absent rib involvement, myelopathies, and common clinical features of SCDO6 including scoliosis, mild facial asymmetry, spinal spasticity and hemivertebrae.
    explanation: >-
      Confirms biallelic RIPPLY2 variants as the SCDO6 lesion and describes the
      cervical-predominant vertebral phenotype with myelopathy.
inheritance:
- name: Autosomal Recessive
  description: >-
    SCDO is most commonly inherited in an autosomal recessive manner, caused by
    biallelic pathogenic variants in segmentation-clock / Notch-pathway genes.
  evidence:
  - reference: PMID:20301771
    reference_title: "Spondylocostal Dysostosis, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of biallelic pathogenic variants in DLL3, HES7, LFNG, MESP2, RIPPLY2, or TBX6 can confirm the diagnosis of autosomal recessive SCDO.
    explanation: >-
      GeneReviews establishes autosomal recessive inheritance and the
      causative Notch-pathway gene panel for SCDO.

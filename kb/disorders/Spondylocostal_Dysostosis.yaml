- name: SCDO1
  display_name: SCDO1 (DLL3-related)
  subtype_term:
    preferred_term: spondylocostal dysostosis 1, autosomal recessive
    term:
      id: MONDO:0020692
      label: spondylocostal dysostosis 1, autosomal recessive
  description: >-
    SCDO1 (OMIM:277300) is caused by biallelic pathogenic variants in DLL3,
    which encodes a Notch ligand acting in the presomitic-mesoderm segmentation
    clock. It was the first molecularly solved form of SCDO and produces a
    consistent, distinctive pattern of abnormal vertebral segmentation
    affecting the entire spine. Note that MONDO carries "spondylothoracic
    dysostosis" as a RELATED synonym on this DLL3 term; that synonym is a
    named-entity-confusion hazard, because the classic symmetric
    "crab-like-rib" STD entity is MESP2-related (see the SCDO2 subtype).
  genes:
  - preferred_term: DLL3
    term:
      id: hgnc:2909
      label: DLL3
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:10742114
    reference_title: "Mutations in the human delta homologue, DLL3, cause axial skeletal defects in spondylocostal dysostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we have cloned and sequenced human DLL3 to evaluate it as a candidate gene for SD and identified mutations in three autosomal recessive SD families.
    explanation: >-
      Establishes biallelic DLL3 variants as a cause of autosomal recessive
      spondylocostal dysostosis, the lesion that defines the SCDO1 subtype.
  - reference: PMID:16385447
    reference_title: Mutation of the LUNATIC FRINGE gene in humans causes spondylocostal dysostosis with a severe vertebral phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, we had identified two genes that cause a subset of autosomal recessive forms of this disease: DLL3 (SCD1) and MESP2 (SCD2)."
    explanation: >-
      Anchors the numbered subtype nomenclature, assigning DLL3 to SCDO1 and
      MESP2 to SCDO2.
- name: SCDO2
  display_name: SCDO2 (MESP2-related; includes spondylothoracic dysostosis / Puerto Rican Jarcho-Levin)
  subtype_term:
    preferred_term: spondylocostal dysostosis 2, autosomal recessive
    term:
      id: MONDO:0012097
      label: spondylocostal dysostosis 2, autosomal recessive
  description: >-
    SCDO2 (OMIM:608681) is caused by biallelic pathogenic variants in MESP2, a
    bHLH transcription factor that translates segmentation-clock oscillations
    into somite-boundary and rostrocaudal-polarity specification. This is the
    subtype that carries the spondylothoracic dysostosis (STD) / classic Puerto
    Rican "Jarcho-Levin syndrome" phenotype — symmetric, posteriorly fused
    "crab-like" ribs with a shortened trunk and early-childhood respiratory
    compromise — attributable to a MESP2 E103X founder mutation. Recording that
    identity here is the dismech-side mitigation for the ontology gap in
    issue #4957: MONDO has no distinct STD class, and the string
    "spondylothoracic dysostosis" appears as a synonym on the DLL3 (SCDO1) and
    TBX6 (SCDO5) terms rather than on this MESP2 term.
  genes:
  - preferred_term: MESP2
    term:
      id: hgnc:29659
      label: MESP2
  geography:
  - Puerto Rico
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:15122512
    reference_title: Mutated MESP2 causes spondylocostal dysostosis in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using a genomewide scanning strategy in one consanguineous family with two affected children, we demonstrated linkage to 15q21.3-15q26.1 and furthermore identified a 4-bp duplication mutation in the human MESP2 gene that codes for a basic helix-loop-helix transcription factor.
    explanation: >-
      Original identification of biallelic MESP2 variants as a cause of
      spondylocostal dysostosis, defining the SCDO2 subtype.
  - reference: PMID:18485326
    reference_title: Mutations in the MESP2 gene cause spondylothoracic dysostosis/Jarcho-Levin syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Spondylothoracic dysostosis (STD), also known as Jarcho-Levin syndrome (JLS), is an autosomal-recessive disorder characterized by abnormal vertebral segmentation and defects affecting spine formation, with complete bilateral fusion of the ribs at the costovertebral junction producing a "crab-like" configuration of the thorax.
    explanation: >-
      Defines the symmetric "crab-like"-rib STD/Jarcho-Levin phenotype that this
      subtype carries, distinguishing it from the chaotic, asymmetric
      malsegmentation of the other SCDO subtypes.
  - reference: PMID:18485326
    reference_title: Mutations in the MESP2 gene cause spondylothoracic dysostosis/Jarcho-Levin syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings suggest a founder-effect mutation in the MESP2 gene as a major cause of the classical Puerto Rican form of STD/JLS.
    explanation: >-
      Grounds the STD/Jarcho-Levin eponym on MESP2 (i.e., SCDO2) rather than on
      the DLL3 or TBX6 terms that carry the STD synonym in MONDO, and supports
      the Puerto Rican geography annotation.
- name: SCDO3
  display_name: SCDO3 (LFNG-related)
  subtype_term:

name: Menke-Hennekam Syndrome
creation_date: "2026-09-25T10:34:21Z"
category: Mendelian
disease_term:
  preferred_term: Menke-Hennekam syndrome
  term:
    id: MONDO:0020774
    label: Menke-Hennekam syndrome
synonyms:
- MKHK
- Menke-Hennekam syndrome 1
- Menke-Hennekam syndrome 2
- MKHK1
- MKHK2
description: >-
  Menke-Hennekam syndrome (MKHK) is a rare autosomal dominant neurodevelopmental
  disorder caused by heterozygous, usually de novo, missense and in-frame indel
  variants in a short C-terminal stretch of the paralogous lysine
  acetyltransferases CBP (CREBBP; MKHK1) and p300 (EP300; MKHK2), encoded by the
  last part of exon 30 and the beginning of exon 31. The variants cluster around
  the zinc-binding residues of the ZZ and TAZ2 zinc-finger domains and in the
  first alpha helix of the fourth intrinsically disordered linker (ID4). Although
  the same two genes cause Rubinstein-Taybi syndrome (RSTS) through null alleles
  or catalytic-domain variants, MKHK is clinically distinct: affected individuals
  have developmental delay and intellectual disability of variable degree,
  autistic behavior, short stature, microcephaly, feeding problems, hearing and
  visual impairment, recurrent upper airway infections and a facial gestalt that
  is not that of RSTS, and they lack the broad thumbs and halluces of RSTS. Clinical
  and blood DNA methylation data support at least three domain-specific subtypes
  (MKHK-ZZ, MKHK-TAZ2 and MKHK-ID4) that cut across the gene-based MKHK1/MKHK2
  split. The molecular mechanism is unresolved; the variants are not considered
  simple loss-of-function alleles, and altered zinc-finger-mediated protein
  interaction and gain of CBP/p300 acetyltransferase activity are the leading,
  still unproven, hypotheses.
parents:
- Autosomal dominant syndromic intellectual disability
has_subtypes:
- name: MKHK1
  display_name: Menke-Hennekam syndrome 1 (CREBBP)
  description: >-
    MKHK caused by a heterozygous variant in the MKHK region of CREBBP (CBP
    residues 1,705-1,875). This is the larger gene group; 71 of 82 individuals in
    the largest cohort carried a CREBBP variant.

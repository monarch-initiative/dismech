mechanistic_hypotheses:
- hypothesis_group_id: altered_zinc_finger_interaction
  hypothesis_label: Altered zinc-finger-mediated protein interaction
  status: EMERGING
  description: >-
    MKHK variants misfold the ZZ or TAZ2 zinc fingers and change which
    transcription factors or histone tails CBP/p300 engage, altering co-activator
    output without removing the protein. Proposed from variant position and
    structural modeling; not tested with patient variants.
  evidence:
  - reference: PMID:27311832
    reference_title: CREBBP mutations in individuals without Rubinstein-Taybi syndrome phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No functional studies have (yet) been performed, but we hypothesize that the mutations disturb protein-protein interactions by altering zinc finger function."
    explanation: Original statement of the interaction hypothesis.
- hypothesis_group_id: hat_gain_of_function
  hypothesis_label: Gain of CBP/p300 acetyltransferase function
  status: EMERGING
  description: >-
    MKHK variants, particularly in ID4 and TAZ2, relieve the restraint these
    regions place on the HAT domain or alter its substrate specificity, giving a
    gain of function that opposes the loss of function in RSTS. Supported
    indirectly by facial resemblance to 16p13.3 duplication, by opposite
    methylation direction to RSTS, and by structural studies of p300
    autoinhibition; the cohort authors state that functional studies are needed
    to confirm it.
  evidence:
  - reference: PMID:29460469
    reference_title: Further delineation of an entity caused by CREBBP and EP300 mutations but not resembling Rubinstein-Taybi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3D face shape demonstrated resemblance to individuals with a duplication of 16p13.3 (the region that includes CREBBP), possibly indicating a gain of function."
    explanation: Phenotypic argument for a gain-of-function mechanism.
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These focus on functional impact of the presently reported variants in ZZ, TAZ2, and ID4 that are needed to confirm our hypothesis that variants in ID4 result in a gain of function."
    explanation: The cohort authors state the gain-of-function hypothesis and that it is not yet confirmed.

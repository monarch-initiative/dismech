diagnosis:
- name: Exome or genome sequencing
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Diagnosis is molecular. The phenotype is not specific enough for clinical
    recognition in most cases, and nearly all reported individuals were
    diagnosed by exome sequencing or an intellectual-disability panel; rapid trio
    genome sequencing has made a neonatal diagnosis. Prenatal signs are
    nonspecific, so prenatal diagnosis also depends on sequencing.
  evidence:
  - reference: PMID:29460469
    reference_title: Further delineation of an entity caused by CREBBP and EP300 mutations but not resembling Rubinstein-Taybi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants were detected by exome sequencing using a panel for intellectual disability in all but one individual"
    explanation: Almost all diagnoses in the 2018 cohort came from exome sequencing.
  - reference: PMID:37353886
    reference_title: Diagnosis of Menke-Hennekam syndrome by prenatal whole exome sequencing and review of prenatal signs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the prenatal diagnosis of Menke-Hennekam syndrome is only possible by molecular investigation."
    explanation: Prenatal diagnosis requires sequencing because prenatal signs are nonspecific.
  - reference: PMID:42251442
    reference_title: "From weeks to hours: rapid whole-genome sequencing reduces diagnostic odyssey in Menke-Hennekam syndrome-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this case, rWGS facilitated a neonatal diagnosis of MKHK-ID4 and enabled early multidisciplinary intervention during a critical neurodevelopmental window."
    explanation: Single case of neonatal diagnosis by rapid genome sequencing.

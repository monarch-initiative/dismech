      id: MONDO:0020769
      label: Menke-Hennekam syndrome 2
  evidence:
  - reference: PMID:29460469
    reference_title: Further delineation of an entity caused by CREBBP and EP300 mutations but not resembling Rubinstein-Taybi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on another 11 patients with variants in this region of CREBBP (between bp 5,128 and 5,614) and two with variants in the homologous region of EP300."
    explanation: First report extending the phenotype to variants in the homologous region of EP300.
  - reference: PMID:40421630
    reference_title: A Novel EP300 Variant in an African American Girl With Global Developmental Delay and Leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic germline missense and in-frame indel variants in exons 30 or 31 of the EP300 gene are associated with Menke-Hennekam syndrome-2 (MKHK2)."
    explanation: States the variant class and exon location defining the EP300 form.
- name: MKHK-ZZ
  display_name: MKHK, ZZ zinc-finger domain subtype
  description: >-
    Variants in the ZZ zinc-finger domain of CBP or p300 (CBP residues
    1,705-1,745; p300 1,668-1,708). Intellectual disability is typically mild, and
    the subtype is marked by overweight, hypermetropia, dental anomalies (mostly
    missing teeth) and hormonal problems. A mild blood DNA methylation profile was
    found in nine of ten tested individuals. This is a domain-defined subtype
    without its own MONDO class; it contains both CREBBP and EP300 variants.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate existence of at least three MKHK subtypes, which are domain specific (MKHK-ZZ, MKHK-TAZ2, and MKHK-ID4) rather than gene specific (CREBBP/EP300)."
    explanation: Defines the domain-specific subtypes from clinical and methylation data in 82 individuals.
- name: MKHK-TAZ2
  display_name: MKHK, TAZ2 zinc-finger domain subtype
  description: >-
    Variants in the TAZ2 zinc-finger domain (CBP residues 1,772-1,840; p300
    1,735-1,803). Intellectual disability is more often moderate to severe, and
    hearing impairment, cryptorchidism, muscle hypertrophy/hypertonia,
    contractures and clubfeet are frequent. A mild methylation profile was found in
    14 of 20 tested individuals with CBP TAZ2 variants. Domain-defined subtype
    without its own MONDO class.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characteristics frequently seen in individuals with the MKHK-TAZ2 methylation profile were hearing impairment, dental anomalies, cryptorchidism, muscle hypertrophy/hypertonia, contractures, and anomalies of the extremities (mostly clubfeet)."
    explanation: Lists the features characterizing the TAZ2 subtype.
- name: MKHK-ID4
  display_name: MKHK, ID4 linker helix subtype
  description: >-
    Variants in the first alpha helix of the fourth intrinsically disordered linker
    (CBP residues 1,852-1,875; p300 1,810-1,833), including the recurrent CREBBP
    c.5602C>T p.(Arg1868Trp). This is the largest subtype, with a recognizable
    face (prominent forehead, short upslanted palpebral fissures,
    ptosis/blepharophimosis, depressed nasal bridge, short nose, anteverted nares,
    short columella, long philtrum) and a robust diagnostic blood episignature
    (21 of 21 tested). Domain-defined subtype without its own MONDO class.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Domain-specific methylation profiles were discerned for the ZZ domain in CBP/p300 (found in nine out of 10 tested individuals) and TAZ2 domain in CBP (in 14 out of 20), while a domain-specific diagnostic episignature was refined for the ID4 domain in CBP/p300 (in 21 out of 21)."
    explanation: Gives the per-subtype methylation findings, with only ID4 reaching a diagnostic episignature.
  - reference: PMID:29460469
    reference_title: Further delineation of an entity caused by CREBBP and EP300 mutations but not resembling Rubinstein-Taybi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with variants between bp 5,595 and 5,614 of CREBBP show a specific phenotype (ptosis, telecanthi, short and upslanted palpebral fissures, depressed nasal ridge, short nose, anteverted nares, short columella, and long philtrum)."
    explanation: >-
      The earlier cohort already identified the variant stretch that corresponds
      to the ID4 helix as carrying a specific facial phenotype.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous variant causes the disorder. Nearly all reported
    variants arose de novo; one vertically transmitted case (an affected parent)
    and one sibship with a shared de novo deletion, attributed to parental
    germline mosaicism, have been reported.
  evidence:
  - reference: PMID:42611959
    reference_title: "Distinct Clinical Presentations of Menke-Hennekam Syndrome: Insights From CREBBP and EP300 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Menke-Hennekam syndrome types 1 and 2 (MKHK1 and MKHK2) are autosomal dominant neurodevelopmental disorders"
    explanation: States autosomal dominant inheritance for both gene forms.
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Directed Sanger sequencing of CREBBP had been performed because of the suspicion of a mild form of RSTS in individual C.T.10, because of clinical suspicion of MKHK in C.I.22 and C.I.33, and because of an affected parent in C.T.22."
    explanation: >-
      Records an individual tested because a parent was affected, the one
      instance of vertical transmission in the cohort.
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants were reported de novo, with paternity having been confirmed, suggesting the occurrence of germline mosaicism in MKHK-ID4."
    explanation: >-
      Three siblings shared an apparently de novo in-frame deletion, which the
      authors attribute to parental germline mosaicism; relevant to recurrence
      risk.
pathophysiology:
- name: MKHK-Region Missense or In-Frame Variant in CBP/p300
  description: >-
    A heterozygous missense or in-frame indel variant alters one residue or a few
    residues in the C-terminal MKHK region of CBP or p300 (ZZ domain, TAZ2 domain,
    or the first helix of ID4). Unlike RSTS alleles, these variants are predicted
    to produce a full-length protein. Most cluster around the zinc-coordinating
    residues of the two zinc fingers or around ID4 residues predicted to
    hydrogen-bond with the HAT domain.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: CREBBP
    term:
      id: hgnc:2348
      label: CREBBP
  - preferred_term: EP300
    term:
      id: hgnc:3373
      label: EP300
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  notes: >-
    functional_impact_category is left unset: no functional study of a patient
    variant has established whether these alleles act as gain-of-function,
    dominant-negative or neomorphic alleles. A small number of truncating variants
    in the last exon of CREBBP and EP300 have also been reported with an MKHK-like
    phenotype, so the variant class is not exclusively missense or in-frame.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most variants clustered closely around the zinc-binding residues of two zinc-finger domains (ZZ and TAZ2) and within the first α helix of the fourth intrinsically disordered linker (ID4) of CBP/p300."
    explanation: Localizes the causal variants in 82 individuals to the zinc-binding residues and the ID4 helix.
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that produce a null allele or disrupt the catalytic domain of either protein cause Rubinstein-Taybi syndrome (RSTS), while pathogenic missense and in-frame indel variants in parts of exons 30 and 31 cause phenotypes recently described as Menke-Hennekam syndrome (MKHK)."
    explanation: Distinguishes the MKHK variant class from the null and catalytic-domain alleles of RSTS.
  - reference: PMID:34652060
    reference_title: The novel and recurrent variants in exon 31 of CREBBP in Japanese patients with Menke-Hennekam syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study revealed that one frameshift and three nonsense variants of CREBBP cause MKHK1, and inferred that the nonsense variants of the last exon could further help in the elucidation of the etiology of MKHK1."
    explanation: >-
      Reports truncating last-exon CREBBP variants with an MKHK1 phenotype, which
      qualifies the missense/in-frame description of the variant class.
  downstream:
  - target: Disrupted ZZ/TAZ2 Zinc-Finger Fold and ID4 Interface
    causal_link_type: DIRECT
    description: >-
      Substitutions at or next to zinc-coordinating residues are expected to
      destabilize the zinc-finger fold; ID4 substitutions are predicted to disturb
      hydrogen bonds with the HAT domain. This is a structural prediction, not a
      measured effect.
    evidence:
    - reference: PMID:38553851
      reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variants in these domains were thus hypothesized to affect the coordinating properties of the two zinc-finger domains of CBP/p300 by affecting their proper folding."
      explanation: States the folding hypothesis for zinc-finger variants; it is a hypothesis from variant position, not a functional result.
- name: Disrupted ZZ/TAZ2 Zinc-Finger Fold and ID4 Interface
  description: >-
    The ZZ and TAZ2 zinc fingers are protein-interaction modules: the p300 ZZ
    domain reads the histone H3 tail and steers HAT activity toward H3K27 and
    H3K18, and TAZ2 binds the transactivation domains of many transcription
    factors (p53, beta-catenin, STAT1, adenovirus E1A) and also restrains the
    adjacent HAT domain. The first ID4 helix is predicted to contact the HAT
    domain. MKHK variants are proposed to perturb these folds and interfaces.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL

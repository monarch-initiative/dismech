    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had a de novo missense mutation in the last part of exon 30 or beginning of exon 31 of CREBBP, between base pairs 5,128 and 5,614 (codons 1,710 and 1,872)."
    explanation: >-
      The founding series defines the CREBBP form by de novo missense variants
      confined to the end of exon 30 and start of exon 31.
- name: MKHK2
  display_name: Menke-Hennekam syndrome 2 (EP300)
  description: >-
    MKHK caused by a heterozygous variant in the homologous region of EP300 (p300
    residues 1,668-1,833). It is less common than MKHK1, and in the domain-based
    classification EP300 variants fall into the same ZZ, TAZ2 and ID4 subtypes as
    CREBBP variants.

discussions:
- discussion_id: mkhk_variant_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do MKHK variants act by altering zinc-finger-mediated partner binding, by
    increasing or redirecting CBP/p300 acetyltransferase activity, or by
    different mechanisms in the ZZ, TAZ2 and ID4 subtypes?
  attaches_to:
  - pathophysiology#Disrupted ZZ/TAZ2 Zinc-Finger Fold and ID4 Interface
  - pathophysiology#Dysregulated CBP/p300 Acetyltransferase Activity
  - mechanistic_hypotheses#altered_zinc_finger_interaction
  - mechanistic_hypotheses#hat_gain_of_function
  rationale: >-
    No functional study of patient variants has been published. The two
    hypotheses rest on variant position, structural modeling, facial similarity
    to 16p13.3 duplication, methylation direction, and biochemistry of cancer
    mutations or engineered deletions. The subtype-specific phenotypes and
    methylation profiles suggest the mechanism may differ by domain, and
    truncating last-exon variants with an MKHK-like phenotype further complicate
    a single explanation.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These focus on functional impact of the presently reported variants in ZZ, TAZ2, and ID4 that are needed to confirm our hypothesis that variants in ID4 result in a gain of function."
    explanation: The cohort authors state the functional studies are still needed.
- discussion_id: mkhk_unexplained_phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which mechanisms produce the clinical features of MKHK - intellectual
    disability, autistic behavior, short stature, microcephaly, feeding problems,
    hearing and visual impairment, recurrent infections, the facial gestalt, the
    ZZ-subtype overweight and the TAZ2/ID4 muscle hypertrophy, contractures and
    clubfeet?
  attaches_to:
  - phenotypes#
  - pathophysiology#Dysregulated Neurodevelopmental Transcriptional Program
  rationale: >-
    The published literature on MKHK is clinical delineation (case reports and
    cohorts) plus blood and iPSC methylation profiling. No study connects a
    molecular or cellular change to any specific clinical feature, and no animal
    or cellular model of an MKHK variant has been reported in the sources cited
    here. Apart from the structural brain anomalies, the phenotypes are
    therefore left without an upstream mechanism node. The subtype-specific
    features (overweight and hypermetropia in MKHK-ZZ; muscle hypertrophy,
    contractures and clubfeet in MKHK-TAZ2 and MKHK-ID4) suggest domain-specific
    downstream pathways.
  evidence:
  - reference: PMID:38553851
    reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypes including intellectual disability of varying degree and distinct physical features were defined for each of the regions."
    explanation: Phenotypes differ by variant region, but the paper defines them clinically without a mechanism for any single feature.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020774
      label: Menke-Hennekam syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The entry and the MONDO grouping class denote the same entity; its two
      children MONDO:0020763 and MONDO:0020769 are the has_subtypes MKHK1 and
      MKHK2.
notes: >-
  OMIM splits the disorder by gene (MKHK1, OMIM:618332; MKHK2, OMIM:618333), and
  MONDO follows that split beneath MONDO:0020774. The domain-based subtypes
  (MKHK-ZZ, MKHK-TAZ2, MKHK-ID4) are recorded as additional has_subtypes without
  ontology terms because no MONDO or OMIM class exists for them. The cohort
  authors note that the three domain groups could be regarded as separate
  syndromes. One reported MKHK2 individual also developed T-cell acute
  lymphoblastic leukemia (PMID:40421630); whether germline MKHK variants
  predispose to cancer is unknown, and it is not curated as a phenotype.
  No GeneReviews or StatPearls chapter covers the disorder (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search), so the phenotype
  baseline is the three Menke/Hennekam cohort papers (PMID:27311832,
  PMID:29460469, PMID:38553851).

differential_diagnoses:
- name: Rubinstein-Taybi syndrome
  disease_term:
    preferred_term: Rubinstein-Taybi syndrome
    term:
      id: MONDO:0019188
      label: Rubinstein-Taybi syndrome
  description: >-
    Allelic disorder caused by null alleles or catalytic-domain variants of
    CREBBP (RSTS1) or EP300 (RSTS2), curated in this knowledge base as
    Rubinstein-Taybi_Syndrome. Both conditions share developmental delay, short
    stature and microcephaly, and some MKHK individuals were first suspected of
    mild RSTS.
  distinguishing_features:
  - MKHK variants are missense or in-frame changes in the ZZ/TAZ2/ID4 region, not null alleles.
  - Individuals with MKHK lack the broad thumbs and halluces and the combined facial signs of RSTS.
  - The MKHK-ID4 episignature shows mean hypermethylation, unlike the RSTS1 and RSTS2 episignatures.
  evidence:
  - reference: PMID:27311832
    reference_title: CREBBP mutations in individuals without Rubinstein-Taybi syndrome phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combined facial signs typical for Rubinstein-Taybi syndrome were absent, none had broad thumbs, and three had only somewhat broad halluces."
    explanation: Absence of the RSTS face and broad thumbs distinguishes MKHK.
  - reference: PMID:30892814
    reference_title: Genotype-phenotype specificity in Menke-Hennekam syndrome caused by missense variants in exon 30 or 31 of CREBBP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose to call this disorder \"Menke-Hennekam syndrome\" to establish it as a clinical entity distinct from RTS"
    explanation: The naming paper establishes MKHK as distinct from RSTS.
- name: Chromosome 16p13.3 duplication syndrome
  disease_term:
    preferred_term: chromosome 16p13.3 duplication syndrome
    term:
      id: MONDO:0013273
      label: chromosome 16p13.3 duplication syndrome
  description: >-
    Duplication of the region containing CREBBP. Three-dimensional face-shape
    analysis found MKHK faces resemble those of individuals with this
    duplication, which is the basis of the gain-of-function hypothesis.
  distinguishing_features:
  - A copy-number gain detectable by chromosomal microarray, rather than a sequence variant in the MKHK region.
  evidence:
  - reference: PMID:29460469
    reference_title: Further delineation of an entity caused by CREBBP and EP300 mutations but not resembling Rubinstein-Taybi syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3D face shape demonstrated resemblance to individuals with a duplication of 16p13.3 (the region that includes CREBBP), possibly indicating a gain of function."
    explanation: Documents the phenotypic overlap with 16p13.3 duplication.

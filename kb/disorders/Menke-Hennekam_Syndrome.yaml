genetic:
- name: CREBBP
  gene_term:
    preferred_term: CREBBP
    term:
      id: hgnc:2348
      label: CREBBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MKHK1
  association: >-
    Heterozygous missense and in-frame indel variants in the ZZ, TAZ2 and ID4
    region of CBP (residues 1,705-1,875; end of exon 30 and start of exon 31)
    cause MKHK1. Null alleles and catalytic-domain variants of the same gene cause
    RSTS1 instead. The recurrent c.5602C>T p.(Arg1868Trp) in ID4 is the most
    frequently reported variant.
  case_fractions:
  - population: International MKHK cohort (Haghshenas et al. 2024)
    case_fraction_percent: 86.6
    cohort_size: 82
    notes: Derived from 71 of 82 individuals carrying a CREBBP variant.
    evidence:
    - reference: PMID:38553851
      reference_title: Menke-Hennekam syndrome; delineation of domain-specific subtypes with distinct clinical and DNA methylation profiles.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Seventy-one individuals had a variant in CREBBP, and 11 individuals had variants in EP300."
      explanation: Gene split in the largest MKHK cohort.
  evidence:
  - reference: PMID:27311832
    reference_title: CREBBP mutations in individuals without Rubinstein-Taybi syndrome phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using exome sequencing, and by using Sanger in one patient, CREBBP mutations were detected in 11 patients who did not, or only in a very limited manner, resemble Rubinstein-Taybi syndrome."
    explanation: Gene discovery for the CREBBP form.
  - reference: PMID:30892814
    reference_title: Genotype-phenotype specificity in Menke-Hennekam syndrome caused by missense variants in exon 30 or 31 of CREBBP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report three further patients with de novo exon 31 CREBBP missense variants."
    explanation: Independent confirmation of de novo exon 31 CREBBP missense variants.

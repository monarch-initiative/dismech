progression:
- phase: Childhood or adult onset with hepatosplenomegaly, transaminitis, and dyslipidemia
  age_range: Childhood to adulthood
  notes: >-
    Unlike infantile-onset Wolman disease, residual LAL activity in CESD delays
    presentation until childhood or adulthood, typically manifesting with
    unexplained aminotransferase elevation, hepatosplenomegaly, and
    hypercholesterolemia.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with childhood/adult-onset LAL-D typically present with otherwise unexplained transaminitis, organomegaly (splenomegaly and/or hepatomegaly), and liver fibrosis that can progress to cirrhosis and liver failure."
    explanation: Summarizes the characteristic childhood-to-adult presentation of CESD.
- phase: Progressive hepatic fibrosis and cirrhosis
  notes: >-
    Persistent lysosomal neutral-lipid storage in hepatocytes and hepatic
    macrophages drives chronic liver injury that can progress to bridging
    fibrosis, micronodular cirrhosis, portal hypertension, and liver failure.
  evidence:
  - reference: PMID:39770929
    reference_title: "Practical Recommendations for the Diagnosis and Management of Lysosomal Acid Lipase Deficiency with a Focus on Wolman Disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "later-onset form can be diagnosed in childhood or adulthood and is characterized by chronic liver injury and/or lipid profile alterations"
    explanation: Confirms chronic progressive liver injury across childhood and adult-onset disease.

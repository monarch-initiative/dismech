name: Cholesteryl Ester Storage Disease
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Cholesteryl ester storage disease (CESD) is the milder, later-onset form of lysosomal acid
  lipase (LAL) deficiency, an autosomal recessive lysosomal storage disorder caused by
  biallelic LIPA variants with residual enzyme activity. Because LAL is the sole lysosomal
  enzyme that hydrolyzes neutral lipids, its deficiency causes lysosomal accumulation of
  cholesteryl esters and triglycerides in hepatocytes and macrophages, producing
  hepatomegaly, microvesicular steatosis with progressive hepatic fibrosis, and atherogenic
  dyslipidemia; the severe infantile form is Wolman disease.
synonyms:
- CESD
- cholesterol ester storage disease
- LAL deficiency, partial
- LIPA deficiency, partial
- cholesterol ester hydrolase deficiency, partial
- lysosomal acid lipase deficiency, partial
- lysosomal acid lipase deficiency, late-onset
category: Mendelian
disease_term:
  preferred_term: cholesteryl ester storage disease
  term:
    id: MONDO:0019149
    label: cholesteryl ester storage disease
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Cholesteryl ester storage disease is an inherited disorder of lysosomal
      neutral-lipid metabolism with hypercholesterolemia and mixed
      dyslipidemia caused by partial lysosomal acid lipase deficiency.
    evidence:
    - reference: PMID:26225414
      reference_title: Lysosomal Acid Lipase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The phenotypic spectrum of lysosomal acid lipase deficiency (LAL-D) ranges from an infantile-onset form (previously known as Wolman disease) to childhood/adult-onset forms (previously known as cholesterol ester storage disease [CESD])."
      explanation: Identifies CESD as the childhood/adult-onset form of inherited lysosomal acid lipase deficiency.
  - classification_value: GASTROINTESTINAL
    notes: >-
      Chronic hepatic cholesteryl ester and triglyceride storage causes
      hepatomegaly, microvesicular steatosis, transaminitis, and progressive
      hepatic fibrosis or cirrhosis.
    evidence:
    - reference: PMID:26225414
      reference_title: Lysosomal Acid Lipase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Individuals with childhood/adult-onset LAL-D typically present with otherwise unexplained transaminitis, organomegaly (splenomegaly and/or hepatomegaly), and liver fibrosis that can progress to cirrhosis and liver failure."
      explanation: Documents chronic hepatobiliary injury, fibrosis, and cirrhosis as cardinal clinical manifestations of CESD.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive monogenic disorder caused by biallelic pathogenic
      variants in LIPA.
    evidence:
    - reference: PMID:39650963
      reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lysosomal acid lipase deficiency (LAL-D) is an autosomal recessive genetic disease arising from mutations in the lipase A, lysosomal acid type (LIPA) gene"
      explanation: Confirms CESD/LAL-D as a monogenic autosomal recessive disorder of LIPA.
  icimd_category:
  - classification_value: complex_molecule_degradation_other
    notes: >-
      ICIMD category 20 ("Disorders of complex molecule degradation", the
      classical lysosomal storage disorders), group "Other disorders of complex
      molecule degradation" covering lysosomal acid lipase deficiency.
    evidence:
    - reference: PMID:30866656
      reference_title: Lysosomal Acid Lipase in Lipid Metabolism and Beyond.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In humans, loss-of-function mutations of LIPA cause rare lysosomal disorders, Wolman disease and cholesteryl ester storage disease, in which LAL enzyme-replacement therapy has shown significant benefits in a phase 3 clinical trial."
      explanation: Places cholesteryl ester storage disease among lysosomal complex-lipid degradation disorders caused by LIPA loss-of-function variants.

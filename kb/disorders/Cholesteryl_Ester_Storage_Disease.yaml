      label: Cirrhosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with childhood/adult-onset LAL-D typically present with otherwise unexplained transaminitis, organomegaly (splenomegaly and/or hepatomegaly), and liver fibrosis that can progress to cirrhosis and liver failure."
    explanation: Directly states that hepatic fibrosis in childhood and adult-onset LAL deficiency progresses to cirrhosis and liver failure.
  - reference: PMID:39770929
    reference_title: "Practical Recommendations for the Diagnosis and Management of Lysosomal Acid Lipase Deficiency with a Focus on Wolman Disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "later-onset form can be diagnosed in childhood or adulthood and is characterized by chronic liver injury and/or lipid profile alterations"
    explanation: Supports chronic progressive liver injury in later-onset LAL deficiency.
- name: Esophageal varix
  description: >-
    Esophageal varices secondary to portal hypertension in patients with
    advanced hepatic fibrosis or cirrhosis, warranting endoscopic surveillance
    and standard variceal management.
  phenotype_term:
    preferred_term: Esophageal varix
    term:
      id: HP:0002040
      label: Esophageal varix
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, lipid-lowering medications for hyperlipidemia; standard treatment for cardiovascular disease, malabsorption/malnutrition, esophageal varices, and anemia/thrombocytopenia."
    explanation: Identifies esophageal varices as a recognized clinical complication requiring management and endoscopic surveillance in childhood and adult-onset disease.
- name: Thrombocytopenia
  description: >-
    Reduced platelet count complicating splenomegaly and progressive chronic
    liver disease in childhood and adult-onset LAL deficiency.
  notes: >-
    Affected individuals with thrombocytopenia should avoid nonsteroidal
    anti-inflammatory drugs because of heightened bleeding risk.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, lipid-lowering medications for hyperlipidemia; standard treatment for cardiovascular disease, malabsorption/malnutrition, esophageal varices, and anemia/thrombocytopenia."
    explanation: Documents thrombocytopenia among recognized clinical complications of childhood and adult-onset LAL deficiency.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Those with thrombocytopenia should avoid use of nonsteroidal anti-inflammatory drugs."
    explanation: Records the clinical precaution to avoid NSAIDs in LAL-deficient patients with thrombocytopenia.
- name: Atherosclerosis
  description: >-
    Atherosclerotic cardiovascular disease driven by chronic atherogenic
    hypercholesterolemia and impaired LAL-mediated cholesteryl ester hydrolysis
    in vascular wall foam cells.
  phenotype_term:
    preferred_term: Atherosclerosis
    term:
      id: HP:0002621
      label: Atherosclerosis
  evidence:
  - reference: PMID:36204319
    reference_title: "Lysosomal acid lipase deficiency: A rare inherited dyslipidemia but potential ubiquitous factor in the development of atherosclerosis and fatty liver disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "It has also been proposed that the low expression and activity of LAL in arterial smooth muscle cells (SMCs) that occurs inherently in nature is a likely determinant of the propensity of SMCs to form the majority of foam cells in atherosclerotic plaque."
    explanation: Connects deficient LAL activity and cellular cholesteryl ester retention to atherosclerotic plaque formation.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, lipid-lowering medications for hyperlipidemia; standard treatment for cardiovascular disease, malabsorption/malnutrition, esophageal varices, and anemia/thrombocytopenia."
    explanation: Confirms cardiovascular disease as a recognized clinical complication in childhood and adult-onset LAL deficiency.
biochemical:
- name: Atherogenic dyslipidemia
  presence: INCREASED
  context: >-
    Elevated LDL cholesterol with reduced HDL cholesterol accompanies elevated
    aminotransferases in LAL deficiency / CESD.
  evidence:
  - reference: PMID:37028992
    reference_title: "Recent insights into lysosomal acid lipase deficiency."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "LAL-D must be considered in patients with dyslipidemia and elevated aminotransferase concentrations of unknown etiology"
    explanation: The dyslipidemia + transaminase elevation pattern is the characteristic biochemical signature.
genetic:
- name: LIPA pathogenic variants
  gene_term:
    preferred_term: LIPA
    term:
      id: hgnc:6617
      label: LIPA
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic LIPA variants with residual LAL activity cause CESD; a homozygous LIPA mutation
    was identified in a reported CESD patient.
  evidence:
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation of the LIPA gene was identified"
    explanation: Confirms biallelic LIPA variants as the molecular cause of CESD.
diagnosis:
- name: Lysosomal acid lipase enzyme activity assay (dried blood spot or leukocytes)
  description: >-
    Deficient lysosomal acid lipase (LAL) enzymatic activity measured in dried
    blood spots or peripheral blood leukocytes establishes the biochemical
    diagnosis of LAL deficiency / CESD.
  presence: Deficient
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAL activity can be demonstrated by LAL dried blood spot (DBS) testing"
    explanation: LAL DBS testing is the primary biochemical screening and diagnostic assay for CESD.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAL-D is established in a proband with suggestive findings and biallelic pathogenic variants in LIPA identified by molecular genetic testing and/or deficient lysosomal acid lipase (LAL) enzyme activity in peripheral blood leukocytes or dried blood spots."
    explanation: Confirms deficient LAL enzymatic activity in peripheral blood leukocytes or dried blood spots as a primary diagnostic criterion.
- name: LIPA molecular genetic testing
  description: >-
    Identification of biallelic pathogenic variants in LIPA by molecular
    genetic sequencing confirms the diagnosis and enables carrier and at-risk
    sibling testing.
  presence: Positive
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAL-D is established in a proband with suggestive findings and biallelic pathogenic variants in LIPA identified by molecular genetic testing and/or deficient lysosomal acid lipase (LAL) enzyme activity in peripheral blood leukocytes or dried blood spots."
    explanation: Establishes identification of biallelic LIPA pathogenic variants as confirmatory molecular diagnosis.
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation of the LIPA gene was identified"
    explanation: Demonstrates confirmatory LIPA molecular diagnosis in a clinical CESD case.
- name: Periodic hepatic, lipid, hematologic, and endoscopic surveillance
  description: >-
    Longitudinal monitoring in childhood and adult-onset disease includes liver
    aminotransferases every 6 to 12 months, complete blood count and fasting
    lipid panels every 6 months in children and every 6 to 12 months in adults,
    clinical assessment for hepatomegaly and cirrhosis at each visit, upper
    endoscopy every 3 years in severe liver disease, and abdominal imaging in
    advanced cirrhosis.
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "measure liver enzymes every six to 12 months or as clinically indicated based on disease severity; assess for hepatomegaly, hepatic fibrosis, and cirrhosis at every visit, as indicated by clinical/biochemical parameters; monitor anti-drug antibody (ADA) concentration as clinically indicated for those on enzyme replacement therapy; obtain a complete blood count and fasting lipid levels every six months in children and every six to 12 months (or as clinically indicated based on disease severity) in adults; upper endoscopy every three years in those with severe liver disease"
    explanation: Summarizes the standard biochemical, hematologic, and endoscopic surveillance schedule for childhood and adult-onset LAL deficiency.
differential_diagnoses:
- name: Wolman disease
  description: >-
    Wolman disease is the severe infantile form of LAL deficiency (same LIPA gene) with
    essentially absent LAL activity and rapidly progressive failure-to-thrive in the first
    year; CESD has residual activity and a later, latent course.
  disease_term:
    preferred_term: Wolman disease
    term:
      id: MONDO:0019148
      label: Wolman disease
  evidence:
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wolman disease usually manifests with rapidly progressive symptoms within the first year of life, while CESD is a latent condition, with significant features appearing later in life"
    explanation: Age of onset and residual LAL activity distinguish CESD from the severe allelic Wolman disease.
treatments:
- name: Sebelipase Alfa (Enzyme Replacement Therapy)
  description: >-
    Recombinant human lysosomal acid lipase (sebelipase alfa), administered
    intravenously (1 mg/kg every other week in childhood/adult-onset disease),
    is the approved disease-modifying therapy that restores lysosomal neutral-lipid
    hydrolysis, improves dyslipidemia and transaminases, and stabilizes hepatic
    fibrosis.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement or supplementation therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: sebelipase alfa
      term:
        id: NCIT:C152312
        label: Sebelipase Alfa
  target_mechanisms:
  - target: Lysosomal Acid Lipase Deficiency
    treatment_effect: ACTIVATES
    description: >-
      Intravenous recombinant human LAL replaces the deficient lysosomal
      neutral-lipid hydrolase activity.
  - target: Lysosomal Cholesteryl Ester and Triglyceride Accumulation
    treatment_effect: INHIBITS
    description: >-
      Restored lysosomal acid lipase clears stored cholesteryl esters and
      triglycerides from hepatocyte and macrophage lysosomes.
  evidence:
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 2015, sebelipase alfa has been authorised for the treatment of LAL-D in the European Union, changing the course of this disease"
    explanation: Sebelipase alfa is the approved enzyme replacement therapy for CESD.
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, intravenous administration of sebelipase alfa (1 mg/kg body weight every other week) is recommended; some centers also recommend dietary modification."
    explanation: Documents standard every-other-week sebelipase alfa dosing in childhood and adult-onset LAL deficiency (CESD).
- name: Lipid-Lowering Pharmacotherapy
  description: >-
    Adjunctive lipid-lowering medications (such as statins or ezetimibe) are
    used to manage persistent hypercholesterolemia and atherogenic dyslipidemia
    in childhood and adult-onset disease, although enzyme replacement therapy
    can reduce the need for lipid-lowering agents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Dysregulated Hepatic Cholesterol Synthesis and Lipoprotein Metabolism
    treatment_effect: INHIBITS
    description: >-
      Lipid-lowering agents suppress compensatory hepatic cholesterol synthesis
      and enhance LDL clearance to lower circulating atherogenic cholesterol.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, lipid-lowering medications for hyperlipidemia; standard treatment for cardiovascular disease, malabsorption/malnutrition, esophageal varices, and anemia/thrombocytopenia."
    explanation: Supports adjunctive lipid-lowering pharmacotherapy for hyperlipidemia in childhood and adult-onset LAL-D.
- name: Low-Lipid Dietary Modification
  description: >-
    Dietary fat and cholesterol restriction is used adjunctively at specialized
    metabolic centers to limit exogenous cholesteryl ester and triglyceride
    delivery to lysosomes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Lysosomal Cholesteryl Ester and Triglyceride Accumulation
    treatment_effect: INHIBITS
    description: >-
      Dietary lipid modification reduces substrate load entering hepatocyte and
      macrophage lysosomes.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, intravenous administration of sebelipase alfa (1 mg/kg body weight every other week) is recommended; some centers also recommend dietary modification."
    explanation: Documents adjunctive dietary modification alongside enzyme replacement therapy in childhood and adult-onset CESD.
- name: Liver Transplantation
  description: >-
    Orthotopic liver transplantation is performed in adult-onset CESD patients
    who progress to decompensated cirrhosis or end-stage liver failure, although
    extrahepatic macrophage LAL deficiency persists and allograft lipid
    recurrence can occur.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Hepatic Fibrogenesis
    treatment_effect: INHIBITS
    description: >-
      Replaces the cirrhotic liver in end-stage hepatic failure, though bone
      marrow-derived macrophage LAL deficiency remains uncorrected without ERT.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Liver transplantation has been performed in individuals with adult-onset disease, especially in those with progressive liver fibrosis or cirrhosis, although there is a risk of recurrence of liver disease and it is not considered curative."
    explanation: Documents liver transplantation for progressive fibrosis or cirrhosis in adult-onset CESD and notes recurrence risk.
- name: Genetic Counseling
  description: >-
    Autosomal recessive genetic counseling, carrier testing for at-risk
    relatives, sibling enzyme/molecular screening for early treatment
    initiation, and prenatal or preimplantation genetic testing once familial
    LIPA variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the LIPA pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: Supports genetic counseling, carrier testing, and reproductive genetic testing in families with known LIPA variants.
animal_models:
- name: Lipa-/- knockout mouse
  species: Mus musculus
  genotype: Lipa-/-
  background: Knockout mouse lacking lysosomal acid lipase (Lipa, murine ortholog of human LIPA)
  description: >-
    Homozygous Lipa-/- knockout mice recapitulate visceral cholesteryl ester
    and triglyceride accumulation, hepatosplenomegaly, serum transaminase
    elevation, hepatic inflammation and fibrosis, and shortened survival, all
    of which are normalized by liver-directed AAVrh74.LP1.LIPA gene transfer.
  publication: PMID:39489913
  evidence:
  - reference: PMID:39489913
    reference_title: "Liver-directed AAV gene therapy normalizes disease symptoms and provides cross-correction in a model of lysosomal acid lipase deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment at both early (1-2 days) and late (8-week) timepoints with rscAAVrh74.LP1.LIPA, a liver-directed AAV gene therapy, normalized many disease measures in Lipa-/- mice when measured at 24 weeks of age, including hepatosplenomegaly, serum transaminase activity, organ triglyceride and cholesterol levels, and biomarkers of liver inflammation and fibrosis."
    explanation: Demonstrates that Lipa-/- mice model hepatic and systemic neutral-lipid accumulation, hepatosplenomegaly, transaminase elevation, and hepatic inflammation/fibrosis, and respond to liver-directed LIPA gene therapy.
  modeled_mechanisms:
  - target: Lysosomal Cholesteryl Ester and Triglyceride Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Lipa-/- mice accumulate triglycerides and cholesteryl esters across
      liver, spleen, and extrahepatic tissues.
    evidence:
    - reference: PMID:39489913
      reference_title: "Liver-directed AAV gene therapy normalizes disease symptoms and provides cross-correction in a model of lysosomal acid lipase deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treatment at both early (1-2 days) and late (8-week) timepoints with rscAAVrh74.LP1.LIPA, a liver-directed AAV gene therapy, normalized many disease measures in Lipa-/- mice when measured at 24 weeks of age, including hepatosplenomegaly, serum transaminase activity, organ triglyceride and cholesterol levels, and biomarkers of liver inflammation and fibrosis."
      explanation: Confirms multi-organ triglyceride and cholesterol accumulation in Lipa-/- mice that is reversed by hepatic LIPA expression.
  - target: Hepatic Fibrogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Lipa-/- mice develop elevated biomarkers of liver inflammation and
      fibrosis alongside serum transaminase elevation.
    evidence:
    - reference: PMID:39489913
      reference_title: "Liver-directed AAV gene therapy normalizes disease symptoms and provides cross-correction in a model of lysosomal acid lipase deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treatment at both early (1-2 days) and late (8-week) timepoints with rscAAVrh74.LP1.LIPA, a liver-directed AAV gene therapy, normalized many disease measures in Lipa-/- mice when measured at 24 weeks of age, including hepatosplenomegaly, serum transaminase activity, organ triglyceride and cholesterol levels, and biomarkers of liver inflammation and fibrosis."
      explanation: Shows that Lipa-/- mice model progressive liver inflammation and fibrosis downstream of LAL deficiency.

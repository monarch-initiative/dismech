    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, intravenous administration of sebelipase alfa (1 mg/kg body weight every other week) is recommended; some centers also recommend dietary modification."
    explanation: Documents standard every-other-week sebelipase alfa dosing in childhood and adult-onset LAL deficiency (CESD).
- name: Lipid-Lowering Pharmacotherapy
  description: >-
    Adjunctive lipid-lowering medications (such as statins or ezetimibe) are
    used to manage persistent hypercholesterolemia and atherogenic dyslipidemia
    in childhood and adult-onset disease, although enzyme replacement therapy
    can reduce the need for lipid-lowering agents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Intracellular Free-Sterol Release and Atherogenic Dyslipidemia
    treatment_effect: INHIBITS
    description: >-
      Lipid-lowering agents reduce circulating atherogenic LDL cholesterol
      concentrations in patients with hyperlipidemia.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, lipid-lowering medications for hyperlipidemia; standard treatment for cardiovascular disease, malabsorption/malnutrition, esophageal varices, and anemia/thrombocytopenia."
    explanation: Supports adjunctive lipid-lowering pharmacotherapy for hyperlipidemia in childhood and adult-onset LAL-D.
- name: Low-Lipid Dietary Modification
  description: >-
    Dietary fat and cholesterol restriction is used adjunctively at specialized
    metabolic centers to limit exogenous cholesteryl ester and triglyceride
    delivery to lysosomes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Lysosomal Cholesteryl Ester and Triglyceride Accumulation
    treatment_effect: INHIBITS
    description: >-
      Dietary lipid modification reduces substrate load entering hepatocyte and
      macrophage lysosomes.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For childhood/adult-onset disease, intravenous administration of sebelipase alfa (1 mg/kg body weight every other week) is recommended; some centers also recommend dietary modification."
    explanation: Documents adjunctive dietary modification alongside enzyme replacement therapy in childhood and adult-onset CESD.
- name: Liver Transplantation
  description: >-
    Orthotopic liver transplantation is performed in adult-onset CESD patients
    who progress to decompensated cirrhosis or end-stage liver failure, although
    extrahepatic macrophage LAL deficiency persists and allograft lipid
    recurrence can occur.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Chronic Hepatocellular Injury and Hepatic Fibrogenesis
    treatment_effect: INHIBITS
    description: >-
      Replaces the cirrhotic liver in end-stage hepatic failure, though bone
      marrow-derived macrophage LAL deficiency remains uncorrected without ERT.
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Liver transplantation has been performed in individuals with adult-onset disease, especially in those with progressive liver fibrosis or cirrhosis, although there is a risk of recurrence of liver disease and it is not considered curative."
    explanation: Documents liver transplantation for progressive fibrosis or cirrhosis in adult-onset CESD and notes recurrence risk.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    HSCT, sometimes combined with enzyme replacement therapy, has been used in
    severe LAL deficiency to supply donor-derived enzyme-competent macrophages.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Lysosomal Acid Lipase Deficiency
    treatment_effect: ACTIVATES
    description: >-
      Donor-derived hematopoietic and Kupffer cells provide functional
      lysosomal acid lipase activity.
  evidence:
  - reference: PMID:37028992
    reference_title: "Recent insights into lysosomal acid lipase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzyme replacement therapy, sometimes in combination with hematopoietic stem cell transplantation (HSCT), is currently the only therapy for LAL-D"
    explanation: HSCT is used adjunctively in LAL deficiency management.
- name: Genetic Counseling
  description: >-
    Autosomal recessive genetic counseling, carrier testing for at-risk
    relatives, sibling enzyme/molecular screening for early treatment
    initiation, and prenatal or preimplantation genetic testing once familial
    LIPA variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26225414
    reference_title: Lysosomal Acid Lipase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the LIPA pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: Supports genetic counseling, carrier testing, and reproductive genetic testing in families with known LIPA variants.

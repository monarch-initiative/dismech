treatments:
- name: Sebelipase Alfa (Enzyme Replacement Therapy)
  description: >-
    Recombinant human lysosomal acid lipase (sebelipase alfa), administered
    intravenously (1 mg/kg every other week in childhood/adult-onset disease),
    is the approved disease-modifying therapy that restores lysosomal neutral-lipid
    hydrolysis, improves dyslipidemia and transaminases, and stabilizes hepatic
    fibrosis.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement or supplementation therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: sebelipase alfa
      term:
        id: NCIT:C152312
        label: Sebelipase Alfa
  target_mechanisms:
  - target: Lysosomal Acid Lipase Deficiency
    treatment_effect: ACTIVATES
    description: >-
      Intravenous recombinant human LAL replaces the deficient lysosomal
      neutral-lipid hydrolase activity.
  - target: Lysosomal Cholesteryl Ester and Triglyceride Accumulation
    treatment_effect: INHIBITS
    description: >-
      Restored lysosomal acid lipase clears stored cholesteryl esters and
      triglycerides from hepatocyte and macrophage lysosomes.
  evidence:
  - reference: PMID:39650963
    reference_title: "Lysosomal Acid Lipase Deficiency: A Report of Two Cases and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 2015, sebelipase alfa has been authorised for the treatment of LAL-D in the European Union, changing the course of this disease"
    explanation: Sebelipase alfa is the approved enzyme replacement therapy for CESD.

    explanation: Records the reported cyclin M-SALL1 interaction.
- name: Al Kaissi syndrome
  disease_term:
    preferred_term: Al Kaissi syndrome
    term:
      id: MONDO:0044324
      label: Al Kaissi syndrome
  description: >-
    Biallelic CDK10 loss of function, which removes the kinase partner of cyclin M, causes an autosomal recessive disorder with growth retardation, spine malformations, facial dysmorphism and developmental delay. The two syndromes differ substantially, which suggests that CDK10 and cyclin M also act outside their shared kinase complex.
  distinguishing_features:
  - Autosomal recessive, affecting both sexes, rather than X-linked dominant in females
  - Developmental delay and spine malformation are defining, while the anogenital and renal malformations that define STAR syndrome are not
  evidence:
  - reference: PMID:28886341
    reference_title: CDK10 Mutations in Humans and Mice Cause Severe Growth Retardation, Spine Malformations, and Developmental Delays.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Using homozygosity mapping, array CGH, and exome sequencing, we uncovered bi-allelic loss-of-function CDK10 mutations segregating with this disease."
    explanation: Defines the CDK10 disorder.
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The significant differences between the STAR and the Al Kaissi syndromes suggest that CDK10 and/or cyclin M exert more functions than those exerted by the CDK10/CycM protein kinase."
    explanation: Contrasts the two partner-gene disorders.
- name: VACTERL association

- name: CDK10/Cyclin M Kinase Deficiency
  biological_scale: MOLECULAR
  description: >-
    CDK10 and cyclin M form a heterodimeric protein kinase. With cyclin M lost or truncated, CDK10/cyclin M kinase activity is deficient. Its known substrates include ETS2, whose proteasomal degradation it promotes, and the RhoA-associated kinase PKN2.
  genes:
  - preferred_term: CDK10
    term:
      id: hgnc:1770
      label: CDK10
  - preferred_term: CCNQ
    term:
      id: hgnc:28434
      label: CCNQ
  molecular_functions:
  - preferred_term: CDK10/cyclin M protein kinase activity
    modifier: DECREASED
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
  evidence:
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since the majority of the other allelic variants consist of large deletions or splice site mutations likely to prevent cyclin M expression, it can be concluded that the CDK10/CycM protein kinase is deficient in STAR syndrome."
    explanation: The review argues from the allelic spectrum that the kinase is deficient in patients.
  downstream:
  - target: ETS2 Protein Accumulation
    causal_link_type: DIRECT
    description: Loss of CDK10/cyclin M phosphorylation of ETS2 reduces its proteasomal degradation.
    evidence:
    - reference: PMID:24218572
      reference_title: CDK10/cyclin M is a protein kinase that controls ETS2 degradation and is deficient in STAR syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "CDK10/cyclin M phosphorylates ETS2 in vitro, and in cells it positively controls ETS2 degradation by the proteasome."
      explanation: Shows the kinase promotes ETS2 degradation in cells.
    - reference: PMID:24218572
      reference_title: CDK10/cyclin M is a protein kinase that controls ETS2 degradation and is deficient in STAR syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "ETS2 protein levels are increased in cells derived from a STAR patient, and this increase is attributable to decreased cyclin M levels."
      explanation: Patient-derived cells show raised ETS2 attributed to cyclin M deficiency.
  - target: PKN2 Hypophosphorylation and RhoA Destabilization
    causal_link_type: DIRECT
    description: CDK10/cyclin M phosphorylates PKN2 in its RhoA-binding domain; loss of the kinase destabilizes RhoA and the actin network in cultured cells.
    evidence:
    - reference: PMID:27104747
      reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Furthermore, we demonstrate that deficiencies in CDK10/CycM or PKN2, or expression of a non-phosphorylatable version of PKN2, destabilize both the RhoA protein and the actin network architecture."
      explanation: Knockdown of CDK10/cyclin M in cultured cells destabilizes RhoA and the actin network.
- name: ETS2 Protein Accumulation
  biological_scale: MOLECULAR
  description: >-
    ETS2 protein is raised in STAR patient-derived cells. Some craniofacial and skeletal features have been proposed to reflect excess ETS2, because Ets2 transgenic mice have cranial and skeletal defects; this has not been tested in STAR syndrome.
  genes:
  - preferred_term: ETS2
    term:
      id: hgnc:3489
      label: ETS2
  evidence:
  - reference: PMID:24218572
    reference_title: CDK10/cyclin M is a protein kinase that controls ETS2 degradation and is deficient in STAR syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "ETS2 protein levels are increased in cells derived from a STAR patient, and this increase is attributable to decreased cyclin M levels."
    explanation: Direct measurement in patient-derived cells.
  downstream:
  - target: Telecanthus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ets2_excess_craniofacial
    description: Proposed only; excess ETS2 could contribute to craniofacial features, by analogy with Ets2 transgenic mice.
    evidence:
    - reference: PMID:32762766
      reference_title: Cyclin-dependent kinases and rare developmental disorders.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "Interestingly, some morphologic features of STAR syndrome patients might be caused by abnormally high ETS2 levels, which, in Ets2 transgenic mice, cause a number of cranial and skeletal defects"
      explanation: The review raises the hypothesis without testing it in STAR patients or models.
- name: PKN2 Hypophosphorylation and RhoA Destabilization
  biological_scale: CELLULAR
  description: >-
    CDK10/cyclin M binds PKN2 and phosphorylates threonines 121 and 124 in its RhoA-binding domain. In cultured cells, loss of CDK10/cyclin M or PKN2 destabilizes RhoA and disorganizes the actin network.
  genes:
  - preferred_term: PKN2
    term:
      id: hgnc:9406
      label: PKN2
  biological_processes:
  - preferred_term: actin network organization
    modifier: DECREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:27104747
    reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "We discovered that CDK10/Cyclin M binds and phosphorylates PKN2 on threonines 121 and 124, within PKN2's core RhoA-binding domain."
    explanation: Identifies PKN2 as the CDK10/cyclin M substrate on this axis.
  downstream:
  - target: Increased Primary Cilium Assembly and Elongation
    causal_link_type: DIRECT
    description: Reduced RhoA signalling releases the actin-based restraint on ciliogenesis; restoring RhoA reverses the effect of CDK10/cyclin M knockdown.
    evidence:
    - reference: PMID:27104747
      reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Importantly, we established that ectopic expression of RhoA is sufficient to override the induction of ciliogenesis resulting from CDK10/CycM knockdown, indicating that RhoA regulation is critical for CDK10/CycM's negative effect on ciliogenesis."
      explanation: A rescue experiment places RhoA between CDK10/cyclin M loss and increased ciliogenesis.
- name: Increased Primary Cilium Assembly and Elongation
  biological_scale: CELLULAR
  description: >-
    CDK10/cyclin M deficiency promotes assembly and elongation of primary cilia in cultured cells, and kidney tissue from a STAR patient shows abnormally elongated cilia. STAR syndrome has therefore been proposed to be a ciliopathy; whether altered cilia cause the renal, retinal and digital anomalies is not established.
  biological_processes:
  - preferred_term: primary cilium assembly and elongation
    modifier: INCREASED
    term:
      id: GO:1905515
      label: non-motile cilium assembly
  evidence:
  - reference: PMID:27104747
    reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Here, we report that deficiency of CDK10/Cyclin M promotes assembly and elongation of primary cilia."
    explanation: Knockdown in cultured cells increases primary cilium assembly and length.
  downstream:
  - target: Dilated renal tubules with elongated cilia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Abnormal elongated cilia are seen alongside dilated renal tubules in patient kidney; a causal link between the two is inferred, not shown.
    evidence:
    - reference: PMID:27104747
      reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: "Finally, we show that kidney sections from a STAR patient display dilated renal tubules and abnormal, elongated cilia."
      explanation: Patient tissue shows both the cilium abnormality and the tubular change.
  - target: Renal hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - star_ciliopathy
    description: Proposed only; renal anomalies are typical of ciliopathies, and STAR syndrome shares them.
    evidence:
    - reference: PMID:32762766
      reference_title: Cyclin-dependent kinases and rare developmental disorders.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The fact that STAR syndrome presents features that are frequently observed in ciliopathies, such as renal, retinal and digital anomalies, prompted the exploration of a putative role of CDK10/CycM in ciliogenesis."
      explanation: The ciliopathy reading rests on phenotypic resemblance plus the cellular data.
  - target: Retinal dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - star_ciliopathy
    description: Proposed only; retinal anomalies are typical of ciliopathies, and STAR syndrome shares them.
    evidence:

discussions:
- discussion_id: gap_star_cdk10_dependence
  prompt: Which STAR syndrome malformations arise from loss of CDK10/cyclin M kinase activity, and which from kinase-independent functions of cyclin M?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Cyclin M is the activating partner of CDK10, yet biallelic CDK10 loss (Al Kaissi syndrome) and heterozygous CCNQ loss (STAR syndrome) produce different syndromes. The ETS2 and ciliogenesis findings come from knockdown in cultured cells and one patient kidney; no developmental model of CCNQ deficiency is described in the cited literature, so neither branch has been tied to a specific malformation.
  attaches_to:
  - pathophysiology#CDK10/Cyclin M Kinase Deficiency
  - pathophysiology#Increased Primary Cilium Assembly and Elongation
  - pathophysiology#ETS2 Protein Accumulation
  evidence:
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The significant differences between the STAR and the Al Kaissi syndromes suggest that CDK10 and/or cyclin M exert more functions than those exerted by the CDK10/CycM protein kinase."
    explanation: States the discrepancy that defines the gap.
notes: >-
  No GeneReviews chapter covers STAR syndrome or CCNQ (Bookshelf index and live PubMed search via just check-genereviews --online). Most phenotype frequencies are taken from the Orphanet annotation of ORPHA:140952; features reported in only one or two families carry no frequency.

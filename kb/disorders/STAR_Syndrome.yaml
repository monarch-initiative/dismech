animal_models:
- name: Cdk10 conditional-knockout mouse
  species: Mouse
  genotype: Cdk10 homozygous knockout
  publication: PMID:28886341
  description: >-
    Knockout of Cdk10, the kinase partner of cyclin M, models loss of the CDK10/cyclin M complex rather than heterozygous CCNQ loss. Homozygous mice die after birth with growth retardation, skeletal defects and kidney and lung abnormalities, and their embryonic fibroblasts grow longer primary cilia. No Ccnq-deficient mouse is described in the cited literature.
  evidence:
  - reference: PMID:28886341
    reference_title: CDK10 Mutations in Humans and Mice Cause Severe Growth Retardation, Spine Malformations, and Developmental Delays.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Homozygous Cdk10-knockout mice died postnatally with severe growth retardation, skeletal defects, and kidney and lung abnormalities, symptoms that partly resemble the disease's effect in humans."
    explanation: Describes the whole-animal phenotype of CDK10 loss.
  modeled_mechanisms:
  - target: Increased Primary Cilium Assembly and Elongation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Cdk10-knockout embryonic fibroblasts reproduce the longer primary cilia seen with CDK10/cyclin M knockdown in human cells.
    limitations: >-
      The model removes CDK10 in both alleles of an autosomal gene, not one copy of X-linked CCNQ, so it lacks the X-inactivation mosaicism of affected females and models the related Al Kaissi syndrome more closely than STAR syndrome.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cyclin M itself is intact in this model; any CDK10-independent function of cyclin M, and the female mosaic state produced by X-inactivation, are outside it.
    evidence:
    - reference: PMID:28886341
      reference_title: CDK10 Mutations in Humans and Mice Cause Severe Growth Retardation, Spine Malformations, and Developmental Delays.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Fibroblasts derived from affected individuals and Cdk10-knockout mouse embryonic fibroblasts (MEFs) proliferated normally; however, Cdk10-knockout MEFs developed longer cilia."
      explanation: Cellular cilium phenotype of the knockout.

inheritance:
- name: X-linked dominant inheritance with presumed male lethality
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    Heterozygous females are affected. No affected male has been reported, which is interpreted as male lethality. Most variants arise de novo; familial transmission has been reported in a few mother-daughter pairs, and a mildly affected or asymptomatic mosaic mother has been reported, so gonadal mosaicism is possible. Severity varies within families.
  evidence:
  - reference: PMID:18297069
    reference_title: "Mutations in the cyclin family member FAM58A cause an X-linked dominant disorder characterized by syndactyly, telecanthus and anogenital and renal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "we found causative mutations in FAM58A on Xq28 in all affected individuals, suggesting an X-linked dominant inheritance pattern for this recognizable syndrome"
    explanation: The gene-discovery study infers X-linked dominant inheritance from FAM58A (CCNQ) variants in all affected girls.
  - reference: ORPHA:140952
    reference_title: Syndactyly-telecanthus-anogenital and renal malformations syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "- X-linked dominant"
    explanation: Orphanet records X-linked dominant inheritance for the disorder.
  - reference: PMID:35128153
    reference_title: "Multimodal imaging of retinal findings in syndactyly, telecanthus, anogenital, and renal malformations (STAR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This developmental disorder, associated with male lethality, results from mutations in the family with sequence similarity 58, member A (FAM58A) gene on chromosome Xq28"
    explanation: States the association with male lethality in the introduction of a case report.
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "All mutations or deletions appear to be sporadic except for the four mother-daughter pairs identified so far"
    explanation: Review summary that most cases are sporadic, with a few familial mother-daughter transmissions.
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In one of these pairs, maternal mosaicism with a minor toe syndactily phenotype was detected, which indicates that gonadal mosaicism is possible"
    explanation: Parental mosaicism reported in one family is relevant to recurrence counselling.
  - reference: PMID:28322501
    reference_title: "Multigenerational pedigree with STAR syndrome: A novel FAM58A variant and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The proband's mother and maternal half-sister had similar clinical histories, but had variability in phenotypic severity."
    explanation: A three-generation pedigree shows familial transmission with variable expressivity among heterozygous females.
genetic:
- name: CCNQ
  gene_term:
    preferred_term: CCNQ
    term:
      id: hgnc:28434
      label: CCNQ
  association: >-
    Defining gene; heterozygous loss-of-function variants and deletions cause STAR syndrome, and ClinGen rates the X-linked relationship Moderate, so relationship_type is left unset rather than recorded as CAUSATIVE (Definitive or Strong).
  variant_origin: GERMLINE
  notes: >-
    CCNQ was named FAM58A when the disease gene was identified. Reported alleles include intragenic and larger Xq28 deletions, splice-site variants, a nonsense variant in the last exon (p.Trp217Ter) and frameshifts, including one that extends the protein. Larger deletions remove neighbouring genes as well, and a 130 kb deletion was found in the only reported lethal case, which also had cleft lip and palate, omphalocele and cerebral malformations; the extra features of such cases may reflect loss of the flanking genes. ClinGen excluded the deletion cases that remove additional genes from its gene-level curation.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_23aca7cf-8896-4a9d-a40b-94b6c8f18398-2024-07-19T160000.000Z
    evidence:
    - reference: CGGV:assertion_23aca7cf-8896-4a9d-a40b-94b6c8f18398-2024-07-19T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CCNQ | HGNC:28434 | syndactyly-telecanthus-anogenital and renal malformations syndrome | MONDO:0010408 | XL | Moderate"
      explanation: ClinGen Syndromic Disorders GCEP classifies CCNQ for this disease as Moderate, X-linked.
  evidence:
  - reference: PMID:18297069
    reference_title: "Mutations in the cyclin family member FAM58A cause an X-linked dominant disorder characterized by syndactyly, telecanthus and anogenital and renal malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Using array CGH, qPCR and sequence analysis, we found causative mutations in FAM58A on Xq28 in all affected individuals"
    explanation: Identifies FAM58A (CCNQ) variants in every affected individual of the founding series.
  - reference: PMID:28322501
    reference_title: "Multigenerational pedigree with STAR syndrome: A novel FAM58A variant and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Clinical whole exome sequencing revealed a novel pathogenic nonsense variant, c.651G>A (p.Trp217X; NM_152274), in FAM58A in the proband, mother, and maternal half-sister."
    explanation: A nonsense variant segregates with disease in three affected females of one family.
  - reference: PMID:36284407
    reference_title: "The identification of a novel CCNQ gene tail extension variant contributing to syndactyly, telecanthus and anogenital and renal malformations syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A novel heterozygous variant c.502_518delinsA (p.Val168SerfsTer173) in CCNQ gene was identified in the twins and their asymptomatic mosaic mother."
    explanation: A frameshift that extends the protein, found in affected twin sisters and a mosaic mother.
  - reference: PMID:29088509
    reference_title: "STAR syndrome plus: The first description of a female patient with the lethal form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we describe a female patient with STAR syndrome and a 130 kb deletion at Xq28, including the FAM58A gene. She presented with cleft lip palate, omphalocele, and cerebral malformations not previously considered part of the phenotypic spectrum of this syndrome."
    explanation: A larger Xq28 deletion including FAM58A gave an expanded, lethal phenotype.
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since most of these additional features, including those seen in the lethal case, are associated to large deletions that extend beyond the FAM58A locus, the loss of neighboring genes is suspected to contribute to these expanded phenotypes"
    explanation: Supports treating the expanded features of large-deletion cases as possibly due to neighbouring genes.
pathophysiology:
- name: CCNQ Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous loss-of-function variants or deletions remove or truncate cyclin M. Truncated cyclin M proteins encoded by STAR alleles fail to bind CDK10, and a protein expressed from the last-exon nonsense allele is partly degraded by the proteasome.
  genes:
  - preferred_term: CCNQ
    term:
      id: hgnc:28434
      label: CCNQ
  molecular_functions:
  - preferred_term: cyclin M activation of CDK10
    modifier: DECREASED
    term:
      id: GO:0061575
      label: cyclin-dependent protein serine/threonine kinase activator activity
  evidence:
  - reference: PMID:28322501
    reference_title: "Multigenerational pedigree with STAR syndrome: A novel FAM58A variant and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "STAR syndrome is a rare X-linked dominant disorder characterized by toe Syndactyly, Telecanthus, Anogenital malformations, and Renal malformations, and is caused by loss-of-function variants in FAM58A."
    explanation: States loss of function as the genetic mechanism.
  - reference: PMID:24218572
    reference_title: CDK10/cyclin M is a protein kinase that controls ETS2 degradation and is deficient in STAR syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Here we demonstrate that CDK10 is a cyclin-dependent kinase by identifying cyclin M as an activating cyclin."
    explanation: Establishes cyclin M as the activating cyclin of CDK10, the molecular function the variants remove.
  downstream:
  - target: CDK10/Cyclin M Kinase Deficiency
    causal_link_type: DIRECT
    description: Without functional cyclin M, CDK10 is not activated.
    evidence:
    - reference: PMID:24218572
      reference_title: CDK10/cyclin M is a protein kinase that controls ETS2 degradation and is deficient in STAR syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "We show that STAR syndrome-associated cyclin M mutants are unable to interact with CDK10."
      explanation: STAR mutant cyclin M cannot form the CDK10 complex.
    - reference: PMID:34369103
      reference_title: Functional characterization of CDK10 and cyclin M truncated variants causing severe developmental disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Our results point to a total loss of CDK10/CycM activity in the Al Kaissi patient and a partial loss in the STAR patients."
      explanation: The truncated cyclin M expressed from a last-exon STAR allele only partially activates CDK10.

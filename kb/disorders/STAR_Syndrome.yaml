name: STAR Syndrome
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  STAR syndrome is an ultra-rare X-linked dominant developmental disorder named for its cardinal features: toe syndactyly, telecanthus, and anogenital and renal malformations. It is caused by heterozygous loss-of-function variants or deletions of CCNQ (formerly FAM58A) on Xq28, which encodes cyclin M, the activating cyclin of the protein kinase CDK10. Only females have been reported, consistent with male lethality, and X-inactivation is completely or almost completely skewed in the carriers tested. Growth retardation, broad nasal tip, ear anomalies, renal agenesis or hypoplasia, anal atresia or stenosis, clitoromegaly, and variable cardiac, ocular, spinal and hearing involvement complete the picture. Patient cells and kidney tissue point to deficient CDK10/cyclin M kinase activity, with raised ETS2 protein and abnormally elongated primary cilia; whether the malformations arise through these routes is not established.

      reference_title: Cyclin-dependent kinases and rare developmental disorders.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The fact that STAR syndrome presents features that are frequently observed in ciliopathies, such as renal, retinal and digital anomalies, prompted the exploration of a putative role of CDK10/CycM in ciliogenesis."
      explanation: The ciliopathy reading rests on phenotypic resemblance plus the cellular data.
- name: Selective Disadvantage of Cells Expressing the Mutant X Chromosome
  biological_scale: CELLULAR
  description: >-
    In heterozygous females, X-inactivation is completely or almost completely skewed whenever it has been studied, suggesting that cells with the mutant X active are selected against during development. ClinGen notes that severity depends on the degree of X-inactivation.
  biological_processes:
  - preferred_term: X-chromosome inactivation
    term:
      id: GO:0009048
      label: dosage compensation by inactivation of X chromosome
  evidence:
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Total or close-to-total X-inactivation skewing was observed whenever it was investigated, thus suggesting that cells carrying the mutation on the active X chromosome present a growth disadvantage during development."
    explanation: Summarizes X-inactivation studies in STAR carriers.
  - reference: CGGV:assertion_23aca7cf-8896-4a9d-a40b-94b6c8f18398-2024-07-19T160000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severity of disease is also highly variable and dependent upon the level of X-inactivation."
    explanation: ClinGen's evidence summary ties variable severity to X-inactivation.
mechanistic_hypotheses:
- hypothesis_group_id: star_ciliopathy
  hypothesis_label: STAR syndrome as a ciliopathy driven by excess primary ciliogenesis
  status: EMERGING
  description: >-
    Loss of CDK10/cyclin M increases primary cilium assembly and length through the PKN2-RhoA-actin axis in cultured cells, and patient kidney shows elongated cilia with dilated tubules. The renal, retinal and digital anomalies are proposed to follow from this, by analogy with other ciliopathies. No developmental model of STAR syndrome has tested the link.
  evidence:
  - reference: PMID:27104747
    reference_title: STAR syndrome-associated CDK10/Cyclin M regulates actin network architecture and ciliogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Altogether, these results reveal CDK10/CycM as a key regulator of actin dynamics and a suppressor of ciliogenesis through phosphorylation of PKN2 and promotion of RhoA signaling."
    explanation: Cellular basis of the hypothesis.
- hypothesis_group_id: ets2_excess_craniofacial
  hypothesis_label: Excess ETS2 contributes to craniofacial and skeletal features
  status: EMERGING
  description: >-
    Patient cells have raised ETS2, and Ets2 transgenic mice have cranial and skeletal defects, so excess ETS2 may contribute to the craniofacial features of STAR syndrome. This is an analogy that has not been tested.
  evidence:
  - reference: PMID:32762766
    reference_title: Cyclin-dependent kinases and rare developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Interestingly, some morphologic features of STAR syndrome patients might be caused by abnormally high ETS2 levels, which, in Ets2 transgenic mice, cause a number of cranial and skeletal defects"
    explanation: States the hypothesis.

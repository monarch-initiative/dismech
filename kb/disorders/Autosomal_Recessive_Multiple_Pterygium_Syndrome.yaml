- name: MYH3-related contractures, pterygia, and variable skeletal fusions syndrome
  disease_term:
    preferred_term: contractures, pterygia, and variable skeletal fusions syndrome
    term:
      id: MONDO:0020937
      label: contractures, pterygia, and variable skeletal fusions syndrome
  description: >-
    MYH3 variants produce webbing, contractures, and scoliosis that
    overlap Escobar-type MPS closely enough to be diagnosed as it clinically.
    In the primary case series, 2 of the 7 molecularly solved children carried
    MYH3 rather than CHRNG variants, so MYH3 is the main genetic alternative to
    exclude when a clinical Escobar phenotype is sequenced.
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the reported phenotype also included webbing, contractures and scoliosis"
    explanation: >-
      Establishes the clinical overlap that makes MYH3-related disease a
      differential for Escobar-type MPS.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple pterygium syndrome (MPS) is a genetically heterogeneous rare form of arthrogryposis multiplex congenita characterized by joint contractures and webbing or pterygia, as well as distinctive facial features related to diminished fetal movement."
    explanation: >-
      The case-series background directly classifies MPS as an arthrogryposis
      multiplex congenita form.
- name: Joint contracture
  category: Musculoskeletal
  description: >-
    Fixed congenital limitation of joint motion is common and may involve limbs,
    digits, shoulders, elbows, hips, knees, ankles, or other joints.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  frequency: OBLIGATE
  evidence:
  - reference: PMID:24472885
    reference_title: "Nonlethal multiple pterygium syndrome: Escobar syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a form of arthrogryposis multiplex congenita characterized by excessive webbing (pterygia), congenital contractures (arthrogryposis), and scoliosis."
    explanation: >-
      Congenital contractures are listed as a central diagnostic feature of
      nonlethal Escobar syndrome.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe 12 individuals with variable pterygia, mild to severe flexion contractures of several joints and spine anomalies."
    explanation: >-
      Supports the OBLIGATE band as the derived count 12/12 (100%): every
      individual in the series had flexion contractures, though severity ranged
      from mild to severe. As with pterygia, contractures are part of the
      arthrogryposis case definition, so ascertainment contributes to the band.
- name: Scoliosis
  category: Musculoskeletal
  description: >-
    Developmental spinal curvature is common, may begin early, and can require
    bracing, casting, or growth-friendly instrumentation in severe cases.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  notes: >-
    `frequency` is deliberately omitted. The 11/12 figure in the primary series
    cannot be used as a disease-level band because that cohort was ascertained
    as "12 patients presenting with MPS and scoliosis" — scoliosis was an entry
    criterion, so its apparent frequency is circular. The same paper cites a
    published range of 32-93% across other cohorts, which straddles the FREQUENT
    and VERY_FREQUENT bands and so does not resolve to a single value.
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Scoliosis was present in all but our youngest patient."
    explanation: >-
      Scoliosis was nearly universal in this pediatric MPS series, but the series
      selected for it; see this phenotype's notes on why no frequency band is
      asserted.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Other authors have reported prevalence rates of scoliosis in patients with multiple pterygium syndrome between 32% and 93%"
    explanation: >-
      Independent cohorts put scoliosis frequency anywhere from 32% to 93%. The
      spread crosses a band boundary, which is why this entry records the range
      rather than committing to a FrequencyEnum value.

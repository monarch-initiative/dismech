histopathology:
- name: Neuromuscular junction abnormalities on muscle biopsy
  description: >-
    CHRNG-related nonlethal MPS can show postnatal neuromuscular junction
    abnormalities on muscle biopsy, consistent with the fetal acetylcholine
    receptor mechanism.
  notes: >-
    Not flagged `diagnostic`. The cited cohort establishes only that these
    changes were observed in patient biopsies; it does not report sensitivity,
    specificity, or any discriminating comparison against other arthrogryposis
    causes. The whole-body muscle MRI pattern, by contrast, is explicitly framed
    as distinguishing, and is curated under `diagnosis`.
  evidence:

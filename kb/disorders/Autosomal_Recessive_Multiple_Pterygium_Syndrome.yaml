notes: >-
  Falcon research found broader MPS genetic heterogeneity, including lethal
  CHRND-related presentations and recessive MYH3 Escobar-like phenotypes. This
  page stays focused on MONDO:0009926, the nonlethal autosomal recessive
  multiple pterygium syndrome / Escobar syndrome class. The MYH3 overlap is now
  curated structurally under `differential_diagnoses`; the lethal CHRND arm
  remains out of scope for this entry.

  No `prevalence` is recorded, and this is a deliberate omission rather than an
  oversight. Orphanet has no epidemiology section for ORPHA:2990 (see the cached
  structured record), and the deep-research sweep likewise retrieved no
  population estimate for the nonlethal Escobar variant; the one quantitative
  figure available in that sweep, "incidence <1/100000", describes *lethal* MPS
  and so cannot be transferred here. A rate will be added if a source specific to
  this entity appears.

  Frequency bands are derived counts from the 12-child series in PMID:34440395
  and are recorded per phenotype with their numerators. Two caveats apply to all
  of them: the cohort is small, and it was ascertained as MPS *with scoliosis*,
  which inflates spine-related findings in particular. Scoliosis therefore
  carries no band at all — see that phenotype's notes.

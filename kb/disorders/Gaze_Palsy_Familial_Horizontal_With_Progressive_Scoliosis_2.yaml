- category: Psychiatric / Behavioral
  name: Atypical behavior
  frequency: FREQUENT
  description: >-
    Behavioral abnormalities including poor eye contact, stereotypic repetitive hand-wringing
    movements, and self-injurious or autistic-like behaviors, reported in 3/5 (60%) evaluated
    patients.
  phenotype_term:
    preferred_term: Atypical behavior
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the patient presented in this report, altogether 8 patients with biallelic DCC pathogenic variants have been reported in the medical literature. The hallmarks of this syndrome are the horizontal gaze palsy (N = 8/8, 100%) and typical radiological features including a midline cleft in the brainstem, agenesis of corpus callosum, and absence of cerebral commissures present in all patients whose brain MRI result was available (N = 7/7, 100%). Common presenting features were global developmental delay, intellectual disability (N = 5/8, 63%), scoliosis (N = 7/8, 88%), short stature (N = 3/5, 60%), and behavioral problems (N = 3/5, 60%)."
    explanation: Reports behavioral problems in 3/5 (60%) evaluated patients.
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had poor eye contact and stereotypic repetitive wringing hand movements, but no mirror movements were noted. Her gait was broad based and ataxic."
    explanation: Describes stereotypic repetitive hand-wringing and poor eye contact in an affected patient.

- category: Neurological
  name: Mirror movements
  frequency: OCCASIONAL
  description: >-
    Involuntary contralateral mirror movements of the hands and upper limbs due to reduced
    corticospinal tract decussation at the medullary pyramids, observed in a subset of
    affected individuals.
  phenotype_term:
    preferred_term: Mirror movements
    term:
      id: HP:0001335
      label: Bimanual synkinesia
  evidence:
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with DSBS may also present with MMs, which are associated with the reduced midline crossing of descending CST projections at the pyramidal decussation [Jamuar, et al., 2017]."
    explanation: Confirms that patients with developmental split-brain syndrome (HGPPS2) may present with congenital mirror movements.

- category: Neurological
  name: Ataxia
  frequency: OCCASIONAL
  description: >-
    Broad-based ataxic gait reflecting impaired cerebellar-midbrain connectivity and absence
    of superior cerebellar peduncle decussation.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had poor eye contact and stereotypic repetitive wringing hand movements, but no mirror movements were noted. Her gait was broad based and ataxic."
    explanation: Documents a broad-based ataxic gait on neurological examination.
genetic:
- name: DCC
  association: Causal Biallelic Loss-of-Function Variants
  gene_term:
    preferred_term: DCC
    term:
      id: hgnc:2701
      label: DCC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Homozygous loss-of-function variants in DCC (18q21.2), including frameshift deletions
    and duplications (c.16delG / p.Val6Serfs*26, c.788_794delTTTCTGG / p.Val263Alafs*36,
    c.2399dupA / p.Asn800Lysfs*11), multi-exon tandem duplication of exons 13-15
    (p.Ser788Tyrfs*4), and missense variant (c.1997G>A / p.Gly666Asp), cause complete loss
    of netrin-1 receptor signaling and pan-neuraxis commissural agenesis.
  evidence:
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals were found to possess biallelic loss-of-function mutations in the gene encoding the axon-guidance receptor 'deleted in colorectal carcinoma' (DCC), which has been implicated in congenital mirror movements when it is mutated in the heterozygous state but whose biallelic loss-of-function human phenotype has not been reported."
    explanation: Identifies biallelic loss-of-function mutations in DCC as the genetic cause of developmental split-brain syndrome / HGPPS2.
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, including the case reported here, three different homozygous pathogenic frameshift variants, one homozygous missense variant, and an intragenic duplication in the DCC gene have been reported in 8 patients with the HGPPS2 syndrome."
    explanation: Summarizes the allelic spectrum of pathogenic biallelic DCC variants across all 8 reported HGPPS2 patients.
  variants:
  - name: NM_005215.4:c.16delG (p.Val6Serfs*26)
    description: >-
      Homozygous 1-bp deletion in exon 1 of DCC disrupting the signal peptide and first
      immunoglobulin repeat, acting as a functional null allele in two siblings with
      pan-commissural agenesis and lethal neonatal/infantile complications.
    gene:
      preferred_term: DCC
      term:
        id: hgnc:2701
        label: DCC
    type: frameshift_variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exon 1 is the first coding exon and contains the signal peptide, required for correct orientational insertion into the membrane, and part of the first of DCC’s four immunoglobulin repeats, which adopt a horseshoe configuration critical for netrin-mediated guidance12. Disruption of these features strongly predicts that this mutation represents a functional null."
      explanation: Demonstrates that the exon 1 frameshift deletion disrupts the signal peptide and immunoglobulin domain, producing a functional null allele.
  - name: NM_005215.4:c.788_794delTTTCTGG (p.Val263Alafs*36)
    description: >-
      Homozygous 7-bp deletion in exon 4 encoding the third immunoglobulin repeat of DCC,
      resulting in frameshift and premature termination 36 amino acids downstream.
    gene:
      preferred_term: DCC
      term:
        id: hgnc:2701
        label: DCC
    type: frameshift_variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Targeted sequencing of DCC in the proband of Family 2 revealed a homozygous 7 bp deletion in exon 4 (c.788_794delTTTCTGG) (Fig. 2e). Both parents were carriers."
      explanation: Identifies the homozygous c.788_794delTTTCTGG variant in exon 4 of DCC.
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is at amino acid position 263 (of 1447) in the third immunoglobulin repeat, resulting in frameshift and premature termination 36 amino acids downstream (p.Val263Alafs*36)."
      explanation: Details the protein consequence p.Val263Alafs*36 in the third immunoglobulin repeat.
  - name: NM_005215.4:c.2399dupA (p.Asn800Lysfs*11)
    description: >-
      Homozygous 1-bp duplication in exon 16 of DCC identified in three affected siblings
      from a consanguineous Pakistani family with HGPPS2 and intellectual disability.
    gene:
      preferred_term: DCC
      term:
        id: hgnc:2701
        label: DCC
    type: frameshift_variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33141514
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A hypothesis-free, unbiased exome data analysis detected an insertion of nucleotide A (c.2399dupA) in exon 16 of the DCC gene. The insertion is predicted to cause frameshift p.(Asn800Lysfs*11)."
      explanation: Documents the homozygous c.2399dupA (p.Asn800Lysfs*11) variant in exon 16 of DCC.
  - name: NM_005215.4:c.(?_1912)_(2359_?)dup (p.Ser788Tyrfs*4)
    description: >-
      Homozygous intragenic tandem duplication encompassing exons 13-15 of DCC resulting
      in a predicted frameshift p.(Ser788Tyrfs*4).
    gene:
      preferred_term: DCC
      term:
        id: hgnc:2701
        label: DCC
    type: tandem_duplication
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38585553
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing revealed a homozygous apparently tandem duplication in the DCC (NM_005215.4):c.(?_1912)_(2359_?)dup, p.(Ser788Tyrfs*4); she has four copies of exons 13–15."
      explanation: Identifies the homozygous intragenic tandem duplication of exons 13-15 in DCC.
diagnosis:
- name: Brain Magnetic Resonance Imaging (MRI) and Diffusion Tractography
  description: >-
    Structural brain MRI and diffusion tensor tractography demonstrate the pathognomonic
    combination of complete agenesis of the corpus callosum, absence of the anterior and
    hippocampal commissures, widely spaced lateral ventricles (racing car sign), longitudinal
    Probst bundles, and a deep midline cleft throughout the brainstem with a split pons,
    butterfly-shaped medulla oblongata, and absence of the superior cerebellar peduncle
    decussation (loss of the midbrain red dot sign on color fractional anisotropy maps).
  results: >-
    Agenesis of the corpus callosum, anterior commissure, and hippocampal commissure
    together with a split pons and butterfly-shaped medulla oblongata distinguishes HGPPS2
    from ROBO3-related HGPPS1 (which has intact forebrain commissures).
  diagnosis_term:
    preferred_term: magnetic resonance imaging of brain
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In posterior fossa, pons was split in midline, and medulla oblongata showed a butterfly shape because of large midline cleft throughout the brainstem (Fig. 3). In supratentorial space, total agenesis of corpus callosum and other commissural tracts was evident. Widely spaced lateral ventricles, often called as racing car sign, could be seen."
    explanation: Describes the diagnostic supratentorial and infratentorial brain MRI hallmarks of HGPPS2.
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Color FA maps from our DCC(−/−) patient showed a similar failure of SCPs to decussate, as evidenced by absence of the typical midbrain “red dot” sign16 (Fig. 3c). In the pons, our patient had small middle cerebellar peduncles and also lacked evidence of transverse pontine fibers (Fig. 3c), like patients with HGPPS."
    explanation: Demonstrates diagnostic utility of diffusion tensor color fractional anisotropy maps showing absence of the midbrain decussation sign and transverse pontine fibers.

- name: Molecular Genetic Testing of DCC (Sequencing and Copy-Number Analysis)
  description: >-
    Exome or genome sequencing combined with copy-number variant (del/dup) analysis of DCC
    identifies biallelic pathogenic sequence variants or intragenic exon-level duplications
    and deletions.
  results: >-
    Detection of homozygous or compound heterozygous pathogenic variants (including
    intragenic CNVs) in DCC confirms the diagnosis of HGPPS2 and enables carrier testing
    and prenatal diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The analysis of duplications and deletions in the DCC should be included in the routine genetic diagnostic evaluation of patients with suspected HGPPS2."
    explanation: Recommends routine inclusion of DCC deletion/duplication analysis alongside sequence analysis in diagnostic evaluation.
treatments:
- name: Scoliosis Surgical Correction
  description: >-
    Spinal instrumentation and surgical fusion for severe progressive thoracic and
    thoracolumbar scoliosis in childhood or adolescence to correct spinal deformity and
    preserve truncal balance and pulmonary function.
  treatment_term:
    preferred_term: scoliosis surgical correction
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had a medical history of progressive scoliosis; at the age of 9 years, she had a thoracal scoliosis with a Cobb angle of 62° and a thoracolumbar scoliosis with a Cobb angle of 67°, which was operated. A month after the operation, she had a residual thoracal scoliosis with a Cobb angle of 15° and a thoracolumbar scoliosis with a Cobb angle of 13° (Fig. 1)."
    explanation: Documents substantial Cobb angle reduction following surgical correction of severe thoracic and thoracolumbar scoliosis in an HGPPS2 patient.

- name: Physical Therapy and Neurodevelopmental Rehabilitation
  description: >-
    Multidisciplinary physical rehabilitation and supportive developmental therapy to
    support gross motor milestone acquisition, gait stability, and management of axial
    musculoskeletal deformity.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:38516134
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further evaluation of the natural neurodevelopmental trajectories of HGPPS patients with pathogenic variants and their benefits from physical rehabilitation is needed in the future for precise genetic counseling and clinical management."
    explanation: Supports the role of physical rehabilitation in the clinical management of HGPPS spectrum disorders.

- name: Genetic Counseling
  description: >-
    Genetic counseling for affected families regarding the 25% autosomal recessive
    recurrence risk, potential mild/incomplete penetrance phenotypes (isolated mirror
    movements or callosal agenesis) in heterozygous carriers, and options for prenatal or
    preimplantation genetic testing.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Securing a diagnosis provides crucial information to the family for recurrence risk and allows the possibility to offer prenatal and preimplantation genetic diagnosis."
    explanation: Highlights the importance of genetic counseling for recurrence risk assessment and reproductive options in families with HGPPS2.
differential_diagnoses:
- name: Horizontal gaze palsy with progressive scoliosis 1 (ROBO3-related HGPPS1)
  description: >-
    Autosomal recessive disorder caused by biallelic pathogenic variants in ROBO3 (OMIM
    607313) that shares congenital horizontal gaze palsy, progressive childhood scoliosis,
    and a split pons with butterfly-shaped medulla oblongata. Unlike DCC-related HGPPS2,
    patients with ROBO3-related HGPPS1 have normal intelligence and intact forebrain
    commissures (normal corpus callosum, anterior commissure, and hippocampal commissure).
  distinguishing_features:
  - Intact corpus callosum, anterior commissure, and hippocampal commissures on brain MRI
  - Normal intellectual development without global neurodevelopmental delay
  - Biallelic pathogenic variants in ROBO3 rather than DCC
  disease_term:
    preferred_term: gaze palsy, familial horizontal, with progressive scoliosis 1
    term:
      id: MONDO:0020790
      label: gaze palsy, familial horizontal, with progressive scoliosis 1
  evidence:
  - reference: PMID:38516134
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HGPPS2 (OMIM1#617542) is caused by mutations of the DCC gene and distinguished from HGPPS1 by impaired intellectual development, global developmental delay, agenesis of the corpus callosum, and absence of the anterior and hippocampal commissures."
    explanation: Directly contrasts DCC-related HGPPS2 and ROBO3-related HGPPS1 by forebrain commissural agenesis and intellectual disability.
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Differential genetic diagnoses for DCC-MMs include NTN1 and RAD51 (MIM# 179617) [Depienne, et al., 2012; Méneret, et al., 2014a; Méneret, et al., 2017); for DCC-iACC include CDK5RAP2 (MIM# 608201, although only one family has been described to date [Jouan, et al., 2016)); and for DSBS include ROBO3 (note: individuals with HGPPS1 do not suffer from intellectual disability and have normal forebrain commissures, consistent with the predominant role of ROBO3 in the developing hindbrain and spinal cord)"
    explanation: Identifies ROBO3-related HGPPS1 as the primary differential diagnosis for developmental split-brain syndrome (HGPPS2).
  - reference: PMID:15105459
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients affected with HGPPS, we identified mutations in the ROBO3 gene, which shares homology with roundabout genes important in axon guidance in developing Drosophila, zebrafish, and mouse. Like its murine homolog Rig1/Robo3, but unlike other Robo proteins, ROBO3 is required for hindbrain axon midline crossing."
    explanation: Establishes ROBO3 mutations as the cause of hindbrain-restricted crossing defects in HGPPS1.

- name: Mirror Movements 1 and/or Agenesis of the Corpus Callosum (Monoallelic DCC Spectrum)
  description: >-
    Autosomal dominant disorder with incomplete penetrance caused by heterozygous
    loss-of-function or missense variants in DCC, presenting with isolated congenital mirror
    movements of the upper limbs, isolated partial or complete agenesis of the corpus
    callosum, or both, without horizontal gaze palsy, brainstem clefting, or progressive
    scoliosis.
  distinguishing_features:
  - Autosomal dominant (monoallelic) inheritance with incomplete penetrance
  - Absence of horizontal gaze palsy, progressive scoliosis, and midline brainstem cleft
  - Normal or near-normal neurodevelopment compared with biallelic HGPPS2
  disease_term:
    preferred_term: mirror movements 1 and/or agenesis of the corpus callosum
    term:
      id: MONDO:0100515
      label: mirror movements 1 and/or agenesis of the corpus callosum
  evidence:
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Monoallelic, missense, and predicted loss-of-function DCC mutations cause congenital mirror movements, isolated agenesis of the corpus callosum (ACC), or both. Biallelic, predicted loss-of-function DCC mutations cause developmental split brain syndrome (DSBS)."
    explanation: Distinguishes the monoallelic DCC phenotype (mirror movements and/or isolated callosal agenesis) from biallelic developmental split-brain syndrome (HGPPS2).

    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "MR brain imaging revealed a number of abnormalities in the affected individuals (Supplementary Table 1, Fig. 1, Supplementary Fig. 1), including ACC and absence of the anterior (AC) and hippocampal commissures (HC)."
    explanation: Confirms complete absence of the corpus callosum, anterior commissure, and hippocampal commissure on brain MRI.
  downstream:
  - target: Longitudinal Probst Bundle Misrouting
    description: >-
      Callosal axons that fail to cross the interhemispheric fissure are diverted
      ipsilaterally into longitudinal Probst bundles along the lateral ventricles.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "DCC(−/−) reconstructions did reveal characteristic, longitudinally misguided Probst bundles along the lateral ventricles (Supplementary Fig. 7b), a classic finding in some individuals with agenesis of the corpus callosum14."
      explanation: Demonstrates that uncrossed callosal fibers form longitudinal Probst bundles along the lateral ventricles.
  - target: Agenesis of corpus callosum
    description: >-
      Failure of callosal commissural axons to cross the telencephalic midline directly
      manifests clinically and radiologically as complete agenesis of the corpus callosum.
    evidence:
    - reference: PMID:38585553
      reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "In supratentorial space, total agenesis of corpus callosum and other commissural tracts was evident. Widely spaced lateral ventricles, often called as racing car sign, could be seen."
      explanation: Directly links forebrain commissural tract agenesis to the radiological phenotype of corpus callosum agenesis.


  description: >-
    Caused by homozygous or compound heterozygous loss-of-function variants in DCC;
    heterozygous carriers are either asymptomatic or may exhibit isolated congenital
    mirror movements or isolated agenesis of the corpus callosum with incomplete penetrance.
  evidence:
  - reference: PMID:38585553
    reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Horizontal gaze palsy with progressive scoliosis-2 (HGPPS2, MIM 617542) with impaired intellectual development aka developmental split-brain syndrome is an ultra-rare congenital disorder caused by pathogenic biallelic variants in the deleted in colorectal cancer (DCC) gene."
    explanation: Confirms autosomal recessive inheritance via biallelic pathogenic DCC variants.
  - reference: PMID:38585553
    reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "HGPPS2 phenotype caused by biallelic DCC variants appears to be fully penetrant and shows a similar clinical presentation including developmental delay, intellectual disability, neuromuscular scoliosis, horizontal gaze palsy, agenesis of corpus callosum, and the absence of cerebral commissures."
    explanation: Establishes complete penetrance of the full HGPPS2 syndrome in individuals with biallelic DCC loss-of-function variants.
  - reference: PMID:33141514
    reference_title: "A novel homozygous frameshift mutation in the DCC gene in a Pakistani family with autosomal recessive horizontal gaze palsy with progressive scoliosis-2 with impaired intellectual development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sanger Sequencing confirmed the presence of the novel homozygous mutation in all three patients; the parents were heterozygous carriers of the mutation, in accordance with an autosomal recessive inheritance pattern."
    explanation: Demonstrates autosomal recessive cosegregation in a multiplex consanguineous family.

- Developmental split-brain syndrome
- DSBS
description: >-
  Gaze palsy, familial horizontal, with progressive scoliosis, 2 (HGPPS2), also known
  as developmental split-brain syndrome (DSBS), is an ultra-rare autosomal recessive
  neurodevelopmental axon-guidance disorder caused by biallelic loss-of-function variants
  in the DCC gene encoding the netrin-1 receptor deleted in colorectal carcinoma. Unlike
  ROBO3-related HGPPS1, where midline crossing defects are restricted to the hindbrain and
  spinal cord, biallelic DCC deficiency disrupts commissural axon guidance across the entire
  central nervous system neuraxis. Hallmarks include congenital absence of conjugate horizontal
  eye movements, progressive childhood-onset neuromuscular scoliosis, global developmental
  delay, intellectual disability, complete agenesis of the corpus callosum with absence of
  anterior and hippocampal commissures, and a characteristic midline brainstem cleft with a
  split pons and butterfly-shaped medulla oblongata.
classifications:
  harrisons_chapter:

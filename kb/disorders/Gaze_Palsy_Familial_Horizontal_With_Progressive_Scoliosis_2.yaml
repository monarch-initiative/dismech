      reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The pathogenesis of progressive scoliosis in the disorder might arise from defective spinal commissural interneurons or paraspinal muscle activation imbalance"
      explanation: Links defective spinal commissural interneurons to paraspinal muscle activation imbalance in the hypothesized pathogenesis of scoliosis.


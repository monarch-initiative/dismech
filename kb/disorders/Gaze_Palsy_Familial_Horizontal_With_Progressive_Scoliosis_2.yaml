mechanistic_hypotheses:
- hypothesis_group_id: scoliosis_spinal_interneuron_hypothesis
  hypothesis_label: Defective Spinal Commissural Interneuron Circuitry and Paraspinal Muscle Imbalance Driving Progressive Scoliosis
  status: EMERGING
  description: >-
    Progressive childhood and adolescent scoliosis in HGPPS2 is hypothesized to result
    from defective midline crossing of spinal cord commissural interneurons (which coordinate
    left-right axial locomotor and postural motor networks in animal models of Netrin-1/DCC
    deficiency), leading to chronic paraspinal muscle activation imbalance during spinal growth.
  evidence:
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "We speculate that scoliosis may pertain to unbalanced paraspinal muscle activity due to defective spinal interneuron circuits (required for coordination of left-right locomotory patterns), since these circuits have been shown to be disrupted in Netrin-1 and DCC-deficient mice29,30."
    explanation: Explicitly frames the link between defective spinal interneuron circuits, unbalanced paraspinal muscle activity, and progressive scoliosis as a mechanistic hypothesis supported by mouse knockout studies.
  - reference: PMID:38585553
    reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The pathogenesis of progressive scoliosis in the disorder might arise from defective spinal commissural interneurons or paraspinal muscle activation imbalance"
    explanation: Summarizes the proposed neurogenic mechanism linking spinal commissural interneuron defects and paraspinal muscle activation imbalance to progressive scoliosis.
pathophysiology:
- name: Loss of DCC Netrin-1 Receptor Function
  description: >-
    Biallelic exon-skipping deletion, frameshift, intragenic duplication, or loss-of-function
    missense variants in DCC abolish or severely impair the deleted in colorectal carcinoma
    (DCC) transmembrane receptor protein. DCC normally binds extracellular netrin-1 (NTN1)
    and forms a molecular complex with ROBO3 to silence Slit-mediated repulsion and transduce
    attractive and long-range guidance cues required for developing commissural axons to
    approach and cross the anatomical midline of the central nervous system.
  mechanism_confidence: ESTABLISHED

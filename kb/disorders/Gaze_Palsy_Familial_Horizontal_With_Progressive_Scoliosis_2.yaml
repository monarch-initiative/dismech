      label: DCC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Homozygous loss-of-function variants in DCC (18q21.2), including a 7682 bp deletion
    removing the 3' end of exon 1 and causing complete exon 1 skipping (chr18:49867185-49874867del,
    predicted p.Pro11Thrfs*15), frameshift deletions and duplications (c.788_794delTTTCTGG /
    p.Val263Alafs*36 and c.2399dupA / p.Asn800Lysfs*11), a multi-exon tandem duplication of
    exons 13-15 (c.(?_1912)_(2359_?)dup / p.Ser788Tyrfs*4), and a homozygous missense variant
    in the third fibronectin type III repeat (c.2071C>A / p.Gln691Lys), cause loss of
    netrin-1 receptor signaling and pan-neuraxis commissural agenesis.
  evidence:
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Affected individuals were found to possess biallelic loss-of-function mutations in the gene encoding the axon-guidance receptor 'deleted in colorectal carcinoma' (DCC), which has been implicated in congenital mirror movements when it is mutated in the heterozygous state but whose biallelic loss-of-function human phenotype has not been reported."
    explanation: Identifies biallelic loss-of-function mutations in DCC as the genetic cause of developmental split-brain syndrome / HGPPS2.
  - reference: PMID:38585553
    reference_title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

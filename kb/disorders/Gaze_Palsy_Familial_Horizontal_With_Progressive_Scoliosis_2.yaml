references:
- reference: PMID:28250456
  title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
  findings:
  - statement: Biallelic loss-of-function mutations in DCC cause developmental split-brain syndrome (HGPPS2) with pan-neuraxis loss of commissural tracts.
    supporting_text: "Structural MRI and diffusion tractography demonstrated broad disorganization of white-matter tracts throughout the human central nervous system (CNS), including loss of all commissural tracts at multiple levels of the neuraxis. Affected individuals were found to possess biallelic loss-of-function mutations in the gene encoding the axon-guidance receptor 'deleted in colorectal carcinoma' (DCC), which has been implicated in congenital mirror movements when it is mutated in the heterozygous state but whose biallelic loss-of-function human phenotype has not been reported."
  - statement: Affected individuals exhibit complete agenesis of the corpus callosum, anterior commissure, and hippocampal commissure along with brainstem hypoplasia and a deep midline brainstem cleft.
    supporting_text: "MR brain imaging revealed a number of abnormalities in the affected individuals (Supplementary Table 1, Fig. 1, Supplementary Fig. 1), including ACC and absence of the anterior (AC) and hippocampal commissures (HC). Pons and midbrain structures were hypoplastic, and there was a large midline cleft throughout the extent of the brainstem contributing to a butterfly shaped medulla (Supplementary Table 1, Supplementary Fig. 1b–g)."
  - statement: Family 1 carries a homozygous 7682 bp deletion removing the 3' end of exon 1 of DCC, causing exon 1 skipping and a functional null allele; Family 2 carries homozygous c.788_794delTTTCTGG (p.Val263Alafs*36); Family 3 carries homozygous c.2071C>A (p.Gln691Lys).
    supporting_text: "A series of PCR probes (Supplementary Fig. 4b) was used to localize the precise breakpoint (Supplementary Fig. 4c), revealing a 7682 bp deletion (Fig. 2d). This deletion removed the 3′ end of exon 1, containing 61 bp of DCC coding sequence (NM_005215.3) and 7.6 kb of intronic sequence (Fig. 2d). RT-PCR from patient lymphoblasts demonstrated that this deletion causes exon 1 to be skipped entirely (Supplementary Fig. 5a–c)."
- reference: PMID:38585553
  title: "Report of a Novel Homozygous Intragenic DCC Duplication and a Review of Literature of Developmental Split-Brain Syndrome aka Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development Syndrome."
  findings:
  - statement: Eight patients with biallelic DCC variants have been reported worldwide, with obligate horizontal gaze palsy (8/8) and midline brainstem cleft, agenesis of the corpus callosum, and absence of cerebral commissures (7/7 imaged).
    supporting_text: "Including the patient presented in this report, altogether 8 patients with biallelic DCC pathogenic variants have been reported in the medical literature. The hallmarks of this syndrome are the horizontal gaze palsy (N = 8/8, 100%) and typical radiological features including a midline cleft in the brainstem, agenesis of corpus callosum, and absence of cerebral commissures present in all patients whose brain MRI result was available (N = 7/7, 100%). Common presenting features were global developmental delay, intellectual disability (N = 5/8, 63%), scoliosis (N = 7/8, 88%), short stature (N = 3/5, 60%), and behavioral problems (N = 3/5, 60%)."
  - statement: A novel homozygous intragenic tandem duplication of exons 13-15 in DCC, c.(?_1912)_(2359_?)dup p.(Ser788Tyrfs*4), causes HGPPS2, underscoring the need for copy-number analysis in diagnostic testing.
    supporting_text: "Exome sequencing revealed a homozygous apparently tandem duplication in the DCC (NM_005215.4):c.(?_1912)_(2359_?)dup, p.(Ser788Tyrfs*4); she has four copies of exons 13–15."
- reference: PMID:29068161
  title: "DCC mutation update: Congenital mirror movements, isolated agenesis of the corpus callosum, and developmental split brain syndrome."
  findings:
  - statement: Monoallelic DCC mutations cause congenital mirror movements and/or isolated agenesis of the corpus callosum with incomplete penetrance, whereas biallelic DCC mutations cause developmental split-brain syndrome (HGPPS2).
    supporting_text: "Monoallelic, missense, and predicted loss-of-function DCC mutations cause congenital mirror movements, isolated agenesis of the corpus callosum (ACC), or both. Biallelic, predicted loss-of-function DCC mutations cause developmental split brain syndrome (DSBS)."
  - statement: Horizontal gaze palsy and hindbrain malformation in DSBS reflect disruption of the superior cerebellar peduncle decussation and the internuclear commissural tract linking the abducens and oculomotor nuclei.
    supporting_text: "These appear to include the decussation of the superior cerebellar peduncles (also referred to as the commissure of Wernekinck) that connects the cerebellum to the midbrain, and the commissural tract linking the lateral abducens and medial occulomotor nerves, required for conjugate horizontal eye movement"
- reference: PMID:33141514
  title: "A novel homozygous frameshift mutation in the DCC gene in a Pakistani family with autosomal recessive horizontal gaze palsy with progressive scoliosis-2 with impaired intellectual development."
  findings:
  - statement: A homozygous frameshift insertion c.2399dupA p.(Asn800Lysfs*11) in exon 16 of DCC cosegregated with autosomal recessive HGPPS2 in three siblings from a consanguineous Pakistani family.
    supporting_text: "A hypothesis-free, unbiased exome data analysis detected an insertion of nucleotide A (c.2399dupA) in exon 16 of the DCC gene. The insertion is predicted to cause frameshift p.(Asn800Lysfs*11)."
- reference: PMID:38516134
  title: "Novel variants and phenotypes of ROBO3 gene associated with horizontal gaze palsy with progressive scoliosis."
  findings:
  - statement: DCC-related HGPPS2 is clinically and radiologically distinguished from ROBO3-related HGPPS1 by impaired intellectual development, global developmental delay, agenesis of the corpus callosum, and absence of the anterior and hippocampal commissures.
    supporting_text: "HGPPS2 (OMIM1#617542) is caused by mutations of the DCC gene and distinguished from HGPPS1 by impaired intellectual development, global developmental delay, agenesis of the corpus callosum, and absence of the anterior and hippocampal commissures."
- reference: PMID:15105459
  title: "Mutations in a human ROBO gene disrupt hindbrain axon pathway crossing and morphogenesis."
  findings:
  - statement: Biallelic mutations in ROBO3 cause HGPPS1 by selectively disrupting hindbrain and spinal cord axon midline crossing while sparing forebrain commissures.
    supporting_text: "In patients affected with HGPPS, we identified mutations in the ROBO3 gene, which shares homology with roundabout genes important in axon guidance in developing Drosophila, zebrafish, and mouse. Like its murine homolog Rig1/Robo3, but unlike other Robo proteins, ROBO3 is required for hindbrain axon midline crossing."
notes: >-
  Curated for issue #14107 (MONDO:0054602, OMIM:617542). HGPPS2 (developmental split-brain
  syndrome) is caused by biallelic loss-of-function variants in DCC and represents the severe
  recessive end of the DCC-related midline axon guidance spectrum, whereas heterozygous DCC
  variants cause autosomal dominant mirror movements 1 and/or agenesis of the corpus callosum
  (MONDO:0100515).

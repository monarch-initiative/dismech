    evidence_source: HUMAN_CLINICAL
    snippet: "Horizontal Gaze Palsy with Progressive Scoliosis-2 with Impaired Intellectual Development (HGPPS2) is a rare congenital disorder characterized by absence of conjugate horizontal eye movements, and progressive scoliosis developing in childhood and adolescence."
    explanation: Confirms congenital disorder onset with childhood/adolescent progression of scoliosis.
pathophysiology:
- name: Loss of DCC Netrin-1 Receptor Function
  description: >-
    Biallelic truncating, frameshift, intragenic duplication, or loss-of-function missense
    variants in DCC abolish functional deleted in colorectal carcinoma (DCC) transmembrane
    receptor protein. DCC normally binds extracellular netrin-1 (NTN1) and forms a molecular
    complex with ROBO3 to silence Slit-mediated repulsion and transduce attractive and
    long-range guidance cues required for developing commissural axons to approach and cross
    the anatomical midline of the central nervous system.
  genes:
  - preferred_term: DCC
    term:
      id: hgnc:2701
      label: DCC
  molecular_functions:
  - preferred_term: netrin receptor activity
    term:
      id: GO:0005042
      label: netrin receptor activity
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:0000117
      label: CNS neuron (sensu Vertebrata)
  biological_processes:
  - preferred_term: netrin-activated signaling pathway
    term:
      id: GO:0038007
      label: netrin-activated signaling pathway
  - preferred_term: commissural neuron axon guidance
    term:
      id: GO:0071679
      label: commissural neuron axon guidance
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals were found to possess biallelic loss-of-function mutations in the gene encoding the axon-guidance receptor 'deleted in colorectal carcinoma' (DCC), which has been implicated in congenital mirror movements when it is mutated in the heterozygous state but whose biallelic loss-of-function human phenotype has not been reported."
    explanation: Establishes biallelic loss-of-function variants in the axon-guidance receptor gene DCC as the primary molecular defect.
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DCC is required for the transduction of NTN1-induced attractive and long-range repulsive signaling in the coordinated outgrowth and guidance of commissural axons that cross the anatomical midline of the body"
    explanation: Details the role of DCC in transducing netrin-1 signaling to guide midline-crossing commissural axons.
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Instead, Robo3 forms a direct molecular complex with DCC that silences repulsion from Slits33 (allowing developing neurons to approach) and enhances attraction to Netrins33,34."
    explanation: Explains how DCC and ROBO3 interact molecularly to coordinate midline axon attraction and repulsion silencing.
  downstream:
  - target: Pan-Neuraxis Commissural Axon Midline Crossing Failure
    description: >-
      Absence of DCC-mediated netrin-1 attraction prevents pioneering commissural axons
      from crossing the midline across the forebrain, midbrain, hindbrain, and spinal cord.
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Combined with data from animal models, these findings show that DCC is a master regulator of midline crossing and development of white-matter projections throughout the human CNS."
      explanation: Demonstrates that loss of DCC directly disrupts midline crossing across the entire human CNS.

- name: Pan-Neuraxis Commissural Axon Midline Crossing Failure
  description: >-
    Without functional DCC signaling, commissural axons fail to cross the anatomical midline
    at multiple levels of the central nervous system neuraxis. This results in complete loss
    of major forebrain commissures as well as failure of decussation of midbrain and hindbrain
    fiber tracts, accompanied by broad disorganization of central nervous system white-matter
    architecture.
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:0000117
      label: CNS neuron (sensu Vertebrata)
  biological_processes:
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
  - preferred_term: central nervous system projection neuron axonogenesis
    term:
      id: GO:0021952
      label: central nervous system projection neuron axonogenesis
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Structural MRI and diffusion tractography demonstrated broad disorganization of white-matter tracts throughout the human central nervous system (CNS), including loss of all commissural tracts at multiple levels of the neuraxis."
    explanation: Diffusion tractography and structural MRI confirm pan-neuraxis loss of commissural tracts.
  downstream:
  - target: Forebrain Commissural Agenesis and Probst Bundle Misrouting
    description: >-
      Failure of pioneering cingulate and neocortical commissural axons to cross the
      telencephalic midline prevents formation of the corpus callosum, anterior commissure,
      and hippocampal commissure, diverting uncrossed fibers into longitudinal Probst bundles.
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The forebrain crossing deficits observed in our patients are reminiscent of abnormalities previously reported in mouse knockout models of Netrin-1 or DCC deficiency, which are also acallosal19–21. This is thought to be due to failure of DCC signaling in pioneering commissural axons from the cingulate and neocortex22,23."
      explanation: Connects DCC signaling failure in pioneering cortical axons to forebrain commissural agenesis.
  - target: Hindbrain and Midbrain Decussation Failure and Brainstem Clefting
    description: >-
      Failure of transverse pontine fibers, superior cerebellar peduncles, and internuclear
      oculomotor tracts to cross the brainstem midline produces a deep midline brainstem
      cleft and disrupts conjugate horizontal eye movement circuitry.
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals with DCC(−/−) mutations have brainstem flattening/midline clefting and eye movement abnormalities similar to those seen in HGPPS5,14, reflecting shared brainstem crossing defects disrupting pathways controlling conjugate gaze."
      explanation: Links brainstem midline crossing failure to brainstem clefting and conjugate horizontal gaze palsy.
  - target: Spinal Commissural Interneuron Circuit Disruption and Paraspinal Imbalance
    description: >-
      Defective midline crossing of spinal commissural interneurons and descending pathways
      impairs bilateral coordination of paraspinal muscle activity during axial growth.
    evidence:
    - reference: PMID:28250456
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We speculate that scoliosis may pertain to unbalanced paraspinal muscle activity due to defective spinal interneuron circuits (required for coordination of left-right locomotory patterns), since these circuits have been shown to be disrupted in Netrin-1 and DCC-deficient mice29,30."
      explanation: Links commissural axon crossing failure in spinal interneuron networks to paraspinal muscle imbalance and scoliosis.

- name: Forebrain Commissural Agenesis and Probst Bundle Misrouting
  description: >-
    Complete absence of the corpus callosum, anterior commissure, and hippocampal commissure
    eliminates direct interhemispheric cortical transfer. Uncrossed callosal axons form
    longitudinally misguided Probst bundles running parallel to widely spaced lateral
    ventricles (the radiological racing car sign), while associated non-commissural forebrain
    white-matter disorganization impairs cognitive and neurodevelopmental maturation.
  biological_processes:
  - preferred_term: corpus callosum development
    term:
      id: GO:0022038
      label: corpus callosum development
  - preferred_term: forebrain morphogenesis
    term:
      id: GO:0048853
      label: forebrain morphogenesis
  locations:
  - preferred_term: corpus callosum
    term:
      id: UBERON:0002336
      label: corpus callosum
  - preferred_term: anterior commissure
    term:
      id: UBERON:0000935
      label: anterior commissure
  evidence:
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR brain imaging revealed a number of abnormalities in the affected individuals (Supplementary Table 1, Fig. 1, Supplementary Fig. 1), including ACC and absence of the anterior (AC) and hippocampal commissures (HC)."
    explanation: Confirms complete absence of the corpus callosum, anterior commissure, and hippocampal commissure on brain MRI.
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DCC(−/−) reconstructions did reveal characteristic, longitudinally misguided Probst bundles along the lateral ventricles (Supplementary Fig. 7b), a classic finding in some individuals with agenesis of the corpus callosum14."
    explanation: Demonstrates that uncrossed callosal fibers form longitudinal Probst bundles along the lateral ventricles.
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patients’ cognitive deficits may at least partially be attributable to non-commissural forebrain white matter abnormalities as well."
    explanation: Connects forebrain white-matter tract abnormalities to intellectual disability and neurodevelopmental delay.

- name: Hindbrain and Midbrain Decussation Failure and Brainstem Clefting
  description: >-
    Absence of crossing fibers in the decussation of the superior cerebellar peduncles
    (commissure of Wernekinck), absence of transverse pontine fibers, and loss of the
    internuclear commissural pathway connecting the abducens nucleus (CN VI) to the
    contralateral oculomotor nucleus (CN III) via the medial longitudinal fasciculus result
    in hypoplastic pons and midbrain structures, a split pons, a butterfly-shaped medulla
    oblongata, and complete loss of conjugate horizontal eye movements. Reduced midline
    crossing of descending corticospinal tract fibers at the pyramidal decussation can also
    produce congenital mirror movements in a subset of patients.
  biological_processes:
  - preferred_term: hindbrain development
    term:
      id: GO:0030902
      label: hindbrain development
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  - preferred_term: medulla oblongata
    term:
      id: UBERON:0001896
      label: medulla oblongata
  - preferred_term: medial oculomotor nucleus
    term:
      id: UBERON:0002975
      label: medial oculomotor nucleus
  evidence:
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pons and midbrain structures were hypoplastic, and there was a large midline cleft throughout the extent of the brainstem contributing to a butterfly shaped medulla (Supplementary Table 1, Supplementary Fig. 1b–g)."
    explanation: Describes the characteristic brainstem hypoplasia, midline cleft, and butterfly-shaped medulla.
  - reference: PMID:28250456
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Color FA maps from our DCC(−/−) patient showed a similar failure of SCPs to decussate, as evidenced by absence of the typical midbrain “red dot” sign16 (Fig. 3c). In the pons, our patient had small middle cerebellar peduncles and also lacked evidence of transverse pontine fibers (Fig. 3c), like patients with HGPPS."
    explanation: Tractography shows absence of superior cerebellar peduncle decussation and transverse pontine fibers.
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These appear to include the decussation of the superior cerebellar peduncles (also referred to as the commissure of Wernekinck) that connects the cerebellum to the midbrain, and the commissural tract linking the lateral abducens and medial occulomotor nerves, required for conjugate horizontal eye movement"
    explanation: Identifies the specific internuclear abducens-to-oculomotor commissural tract disruption underlying conjugate horizontal gaze palsy.
  - reference: PMID:29068161
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with DSBS may also present with MMs, which are associated with the reduced midline crossing of descending CST projections at the pyramidal decussation"
    explanation: Explains how reduced corticospinal tract decussation in the lower medulla leads to mirror movements.

- name: Spinal Commissural Interneuron Circuit Disruption and Paraspinal Imbalance
  description: >-
    Defective midline crossing of spinal cord commissural interneurons disrupts central
    pattern generator networks and bilateral proprioceptive/motor coordination of paraspinal
    musculature, driving severe progressive thoracic and thoracolumbar scoliosis during
    childhood and adolescence.
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of progressive scoliosis in the disorder might arise from defective spinal commissural interneurons or paraspinal muscle activation imbalance"
    explanation: Summarizes the neurogenic mechanism linking spinal commissural interneuron defects and paraspinal muscle imbalance to progressive scoliosis.
phenotypes:
- category: Ophthalmologic
  name: Horizontal gaze palsy
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Congenital complete absence of conjugate horizontal eye movements (saccades, smooth
    pursuit, and horizontal optokinetic nystagmus) with preserved vertical conjugate gaze
    and pupillary reflexes, present in 8/8 (100%) reported patients.
  phenotype_term:
    preferred_term: Horizontal gaze palsy
    term:
      id: HP:0000549
      label: Abnormal conjugate eye movement
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the patient presented in this report, altogether 8 patients with biallelic DCC pathogenic variants have been reported in the medical literature. The hallmarks of this syndrome are the horizontal gaze palsy (N = 8/8, 100%) and typical radiological features including a midline cleft in the brainstem, agenesis of corpus callosum, and absence of cerebral commissures present in all patients whose brain MRI result was available (N = 7/7, 100%). Common presenting features were global developmental delay, intellectual disability (N = 5/8, 63%), scoliosis (N = 7/8, 88%), short stature (N = 3/5, 60%), and behavioral problems (N = 3/5, 60%)."
    explanation: Establishes horizontal gaze palsy as an obligate hallmark present in 8/8 (100%) patients.
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her vertical eye movements were full and conjugated, but she lacked all horizontal eye movements, even horizontal optokinetic nystagmus. Her direct and consensual pupillary reflexes were normal. Cycloplegic refraction showed mild hyperopia."
    explanation: Illustrates complete absence of horizontal eye movements with preserved vertical conjugate gaze.

- category: Neurological
  name: Agenesis of corpus callosum
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Complete absence of the corpus callosum accompanied by absence of the anterior and
    hippocampal commissures, longitudinal Probst bundles, and widely spaced lateral
    ventricles (racing car sign), present in 7/7 (100%) patients evaluated by brain MRI.
  phenotype_term:
    preferred_term: Agenesis of corpus callosum
    term:
      id: HP:0001274
      label: Agenesis of corpus callosum
  evidence:
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the patient presented in this report, altogether 8 patients with biallelic DCC pathogenic variants have been reported in the medical literature. The hallmarks of this syndrome are the horizontal gaze palsy (N = 8/8, 100%) and typical radiological features including a midline cleft in the brainstem, agenesis of corpus callosum, and absence of cerebral commissures present in all patients whose brain MRI result was available (N = 7/7, 100%). Common presenting features were global developmental delay, intellectual disability (N = 5/8, 63%), scoliosis (N = 7/8, 88%), short stature (N = 3/5, 60%), and behavioral problems (N = 3/5, 60%)."
    explanation: Confirms agenesis of the corpus callosum and absence of cerebral commissures in 7/7 (100%) imaged patients.
  - reference: PMID:38585553
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In posterior fossa, pons was split in midline, and medulla oblongata showed a butterfly shape because of large midline cleft throughout the brainstem (Fig. 3). In supratentorial space, total agenesis of corpus callosum and other commissural tracts was evident. Widely spaced lateral ventricles, often called as racing car sign, could be seen."
    explanation: Details the characteristic supratentorial MRI appearance of total callosal agenesis and widely spaced lateral ventricles.


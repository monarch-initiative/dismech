      functional null allele in two siblings from Family 1.
    gene:
      preferred_term: DCC
      term:
        id: hgnc:2701
        label: DCC
    type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "A series of PCR probes (Supplementary Fig. 4b) was used to localize the precise breakpoint (Supplementary Fig. 4c), revealing a 7682 bp deletion (Fig. 2d). This deletion removed the 3′ end of exon 1, containing 61 bp of DCC coding sequence (NM_005215.3) and 7.6 kb of intronic sequence (Fig. 2d). RT-PCR from patient lymphoblasts demonstrated that this deletion causes exon 1 to be skipped entirely (Supplementary Fig. 5a–c)."
      explanation: Characterizes the homozygous 7682 bp deletion removing the 3' end of exon 1 and demonstrates complete exon 1 skipping in patient lymphoblasts.
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Exon 1 is the first coding exon and contains the signal peptide, required for correct orientational insertion into the membrane, and part of the first of DCC’s four immunoglobulin repeats, which adopt a horseshoe configuration critical for netrin-mediated guidance12. Disruption of these features strongly predicts that this mutation represents a functional null."
      explanation: Demonstrates that loss of exon 1 disrupts the signal peptide and first immunoglobulin domain, producing a functional null allele.
  - name: NM_005215.3:c.788_794delTTTCTGG (p.Val263Alafs*36)
    description: >-

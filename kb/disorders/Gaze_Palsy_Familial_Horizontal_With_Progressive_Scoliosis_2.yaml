- name: Defective Spinal Commissural Interneuron Circuitry
  description: >-
    Defective midline crossing of spinal cord commissural interneurons disrupts local spinal
    central pattern generator networks that coordinate left-right axial motor and
    proprioceptive signaling.
  mechanism_confidence: HYPOTHETICAL
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "We speculate that scoliosis may pertain to unbalanced paraspinal muscle activity due to defective spinal interneuron circuits (required for coordination of left-right locomotory patterns), since these circuits have been shown to be disrupted in Netrin-1 and DCC-deficient mice29,30."
    explanation: Proposes defective spinal commissural interneuron circuitry (demonstrated in Netrin-1 and DCC-deficient mice) as the upstream spinal mechanism in HGPPS2.
  downstream:
  - target: Paraspinal Muscle Activation Imbalance
    description: >-
      Impaired bilateral coordination across spinal commissural interneuron circuits is
      hypothesized to cause asymmetric paraspinal muscle tone and activation.
    hypothesis_groups:

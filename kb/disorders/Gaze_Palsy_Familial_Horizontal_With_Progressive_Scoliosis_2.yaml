notes: >-
  Curated for issue #14107 (MONDO:0054602, OMIM:617542). HGPPS2 (developmental split-brain
  syndrome) is caused by biallelic loss-of-function variants in DCC and represents the severe
  recessive end of the DCC-related midline axon guidance spectrum, whereas heterozygous DCC
  variants cause autosomal dominant mirror movements 1 and/or agenesis of the corpus callosum
  (MONDO:0100515).

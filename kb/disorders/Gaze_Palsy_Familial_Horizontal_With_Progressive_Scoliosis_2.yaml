  evidence:
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Affected individuals were found to possess biallelic loss-of-function mutations in the gene encoding the axon-guidance receptor 'deleted in colorectal carcinoma' (DCC), which has been implicated in congenital mirror movements when it is mutated in the heterozygous state but whose biallelic loss-of-function human phenotype has not been reported."
    explanation: Establishes biallelic loss-of-function variants in the axon-guidance receptor gene DCC as the primary molecular defect.
  - reference: PMID:29068161
    reference_title: "DCC mutation update: Congenital mirror movements, isolated agenesis of the corpus callosum, and developmental split brain syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "DCC is required for the transduction of NTN1-induced attractive and long-range repulsive signaling in the coordinated outgrowth and guidance of commissural axons that cross the anatomical midline of the body"
    explanation: Details the role of DCC in transducing netrin-1 signaling to guide midline-crossing commissural axons.
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Instead, Robo3 forms a direct molecular complex with DCC that silences repulsion from Slits33 (allowing developing neurons to approach) and enhances attraction to Netrins33,34."
    explanation: Explains how DCC and ROBO3 interact molecularly in animal models to coordinate midline axon attraction and repulsion silencing.
  downstream:
  - target: Pan-Neuraxis Commissural Axon Midline Crossing Failure
    description: >-
      Absence of DCC-mediated netrin-1 attraction prevents pioneering commissural axons
      from crossing the midline across the forebrain, midbrain, hindbrain, and spinal cord.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Combined with data from animal models, these findings show that DCC is a master regulator of midline crossing and development of white-matter projections throughout the human CNS."
      explanation: Demonstrates that loss of DCC directly disrupts midline crossing across the entire human CNS.

- name: Pan-Neuraxis Commissural Axon Midline Crossing Failure
  description: >-
    Without functional DCC signaling, commissural axons fail to cross the anatomical midline
    at multiple levels of the central nervous system neuraxis, accompanied by broad
    disorganization of central nervous system white-matter architecture.
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:0000117
      label: CNS neuron (sensu Vertebrata)
  biological_processes:
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
  - preferred_term: central nervous system projection neuron axonogenesis
    term:
      id: GO:0021952
      label: central nervous system projection neuron axonogenesis
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:28250456
    reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Structural MRI and diffusion tractography demonstrated broad disorganization of white-matter tracts throughout the human central nervous system (CNS), including loss of all commissural tracts at multiple levels of the neuraxis."
    explanation: Diffusion tractography and structural MRI confirm pan-neuraxis loss of commissural tracts.
  downstream:
  - target: Forebrain Commissural Tract Agenesis
    description: >-
      Failure of pioneering cingulate and neocortical commissural axons to cross the
      telencephalic midline prevents formation of the corpus callosum, anterior commissure,
      and hippocampal commissure.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "The forebrain crossing deficits observed in our patients are reminiscent of abnormalities previously reported in mouse knockout models of Netrin-1 or DCC deficiency, which are also acallosal19–21. This is thought to be due to failure of DCC signaling in pioneering commissural axons from the cingulate and neocortex22,23."
      explanation: Connects DCC signaling failure in pioneering cortical axons to forebrain commissural agenesis based on conserved mouse and human phenotypes.
  - target: Non-Commissural Forebrain White-Matter Disorganization
    description: >-
      Pan-neuraxis DCC loss also disrupts organization of non-commissural forebrain
      white-matter projection tracts.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Our patients’ cognitive deficits may at least partially be attributable to non-commissural forebrain white matter abnormalities as well."
      explanation: Documents non-commissural forebrain white-matter abnormalities alongside commissural agenesis.
  - target: Abducens-to-Oculomotor Internuclear Crossing Failure
    description: >-
      Failure of internuclear commissural axons linking the abducens nucleus and contralateral
      oculomotor nucleus to cross the brainstem midline.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Individuals with DCC(−/−) mutations have brainstem flattening/midline clefting and eye movement abnormalities similar to those seen in HGPPS5,14, reflecting shared brainstem crossing defects disrupting pathways controlling conjugate gaze."
      explanation: Links brainstem midline crossing failure to disruption of pathways controlling conjugate horizontal gaze.
  - target: Midline Brainstem Clefting and Pontomedullary Hypoplasia
    description: >-
      Absence of crossing transverse pontine and medullary decussating fibers produces
      pontine and midbrain hypoplasia and a deep midline cleft across the brainstem.
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Pons and midbrain structures were hypoplastic, and there was a large midline cleft throughout the extent of the brainstem contributing to a butterfly shaped medulla (Supplementary Table 1, Supplementary Fig. 1b–g)."
      explanation: Demonstrates that midline crossing failure across the brainstem produces pontomedullary hypoplasia and a deep midline cleft.
  - target: Superior Cerebellar Peduncle Decussation Failure
    description: >-
      Failure of cerebellar efferent axons in the superior cerebellar peduncles to cross
      at the midbrain decussation (commissure of Wernekinck).
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Color FA maps from our DCC(−/−) patient showed a similar failure of SCPs to decussate, as evidenced by absence of the typical midbrain “red dot” sign16 (Fig. 3c). In the pons, our patient had small middle cerebellar peduncles and also lacked evidence of transverse pontine fibers (Fig. 3c), like patients with HGPPS."
      explanation: Diffusion tractography confirms failure of superior cerebellar peduncle decussation in the midbrain.
  - target: Corticospinal Tract Pyramidal Decussation Deficit
    description: >-
      Reduced midline crossing of descending corticospinal tract axons at the medullary
      pyramidal decussation.
    evidence:
    - reference: PMID:29068161
      reference_title: "DCC mutation update: Congenital mirror movements, isolated agenesis of the corpus callosum, and developmental split brain syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Individuals with DSBS may also present with MMs, which are associated with the reduced midline crossing of descending CST projections at the pyramidal decussation"
      explanation: Connects pan-neuraxis midline crossing failure to reduced corticospinal tract decussation at the medullary pyramids.
  - target: Defective Spinal Commissural Interneuron Circuitry
    description: >-
      Midline crossing failure extends to spinal cord commissural interneurons required
      for bilateral axial motor coordination.
    hypothesis_groups:
    - scoliosis_spinal_interneuron_hypothesis
    evidence:
    - reference: PMID:28250456
      reference_title: "Biallelic mutations in human DCC cause developmental split-brain syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "We speculate that scoliosis may pertain to unbalanced paraspinal muscle activity due to defective spinal interneuron circuits (required for coordination of left-right locomotory patterns), since these circuits have been shown to be disrupted in Netrin-1 and DCC-deficient mice29,30."
      explanation: Links DCC deficiency to defective spinal commissural interneuron circuits based on mouse knockout models.

- name: Forebrain Commissural Tract Agenesis
  description: >-
    Complete developmental absence of the major telencephalic and diencephalic commissures,
    including the corpus callosum, anterior commissure, and hippocampal commissure,
    eliminating direct interhemispheric commissural connectivity.
  mechanism_confidence: ESTABLISHED
  biological_processes:

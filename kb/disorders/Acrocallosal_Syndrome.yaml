genetic:
- name: Biallelic KIF7 Variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KIF7
    term:
      id: hgnc:30497
      label: KIF7
  notes: >-
    Biallelic pathogenic variants in KIF7 (15q26.1) cause the autosomal
    recessive form modeled here. Truncating and splice-disrupting alleles are
    well established; biallelic missense substitutions have also been reported,
    but individual missense findings require variant-level interpretation.
    Allelic KIF7 disease spans the more severe hydrolethalus syndrome 2 and
    Joubert-spectrum presentations. Rare de novo GLI3-related acrocallosal
    phenocopies are handled as a differential, not as a second causal gene in
    this KIF7-scoped entry.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report mutations in KIF7 in individuals with hydrolethalus and
      acrocallosal syndromes, two multiple malformation disorders with
      overlapping features that include polydactyly, brain abnormalities and
      cleft palate
    explanation: >-
      Original report identifying KIF7 as the causative gene for both ACLS and
      the allelic hydrolethalus syndrome.
  - reference: PMID:23125460
    reference_title: "Novel KIF7 mutations extend the phenotypic spectrum of acrocallosal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven mutations were identified at the KIF7 locus in these five cases, six
      of which are novel
    explanation: >-
      Mutation series confirming KIF7 as the recurrent disease locus and
      expanding the allelic spectrum of ACLS.
  - reference: PMID:26648833
    reference_title: "Novel KIF7 Mutation in a Tunisian Boy with Acrocallosal Syndrome: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the KIF7 gene, encoding a molecule within the Sonic hedgehog
      (SHH) pathway, have been identified as causative for ACLS but also for the
      fatal hydrolethalus syndrome and some cases of Joubert syndrome
    explanation: >-
      Confirms KIF7 causation of ACLS and the allelic relationship with
      hydrolethalus and Joubert syndromes.
  - reference: PMID:26174511
    reference_title: "Novel KIF7 missense substitutions in two patients presenting with multiple malformations and features of acrocallosal syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two children who both had two missense mutations in the Kinesin
      Family Member 7 (KIF7) gene.
    explanation: >-
      Supports only that biallelic missense substitutions have been reported;
      the paper itself was tentative and does not establish every reported
      missense allele as pathogenic.
diagnosis:
- name: Clinical and Molecular Diagnosis
  description: >-
    Acrocallosal syndrome is suspected from the combination of corpus callosum
    agenesis/hypoplasia, craniofacial dysmorphism (macrocephaly, prominent
    forehead, hypertelorism), and polydactyly, and is confirmed by
    identification of biallelic KIF7 pathogenic variants. Because expressivity
    is variable, KIF7 testing is warranted in patients with suggestive
    craniofacial features even when polydactyly or callosal anomalies are
    absent. If targeted KIF7 testing is negative, a broader ciliopathy/
    polydactyly panel or exome analysis can evaluate phenocopies involving
    CPLANE1/C5orf42, GLI3, SHH, and other developmental-pathway genes.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:23125460
    reference_title: "Novel KIF7 mutations extend the phenotypic spectrum of acrocallosal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIF7 should be tested in less typical patients in whom craniofacial
      features are suggestive of ACLS
    explanation: >-
      Defines the molecular diagnostic recommendation for ACLS, including in
      atypical presentations.
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis in our cohort of patients with craniofacial appearance
      fitting into the ACLS clinical spectrum and variable additional
      ciliopathy features revealed (likely) pathogenic variants not only in
      KIF7, but also secondly in C5orf42
    explanation: >-
      Demonstrates locus heterogeneity in ACLS-like presentations and supports
      broader sequencing when KIF7 testing is unrevealing.
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in one patient we found a heterozygous de novo frameshift
      variant in SHH, the most common cause of non-chromosomal holoprosencephaly
      (HPE)
    explanation: >-
      Supports inclusion of SHH-related phenocopies in a broader negative-KIF7
      diagnostic workup.
- name: Prenatal Ultrasound Assessment
  description: >-
    In an at-risk pregnancy, second-trimester ultrasound can identify
    polydactyly and major central-nervous-system malformations, but variable
    expressivity means a normal scan does not exclude KIF7-related disease.
  diagnosis_term:
    preferred_term: clinical imaging procedure
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:24949054
    reference_title: "The acrocallosal syndrome in a neonate with further widening of phenotypic expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polydactyly, and central nervous system malformations can be detected by
      ultrasonography in the second trimester, but due to variability of
      presentation, prenatal diagnosis may not always be possible.
    explanation: >-
      Supports both the detectable prenatal features and the limitation of
      ultrasound caused by variable presentation.
differential_diagnoses:
- name: KIF7-Related Hydrolethalus Syndrome 2
  disease_term:
    preferred_term: hydrolethalus syndrome 2
    term:
      id: MONDO:0013585
      label: hydrolethalus syndrome 2
  description: >-
    Hydrolethalus syndrome 2 is the KIF7-related, severe fetal/lethal end of the
    allelic spectrum and shares polydactyly, brain abnormalities, and cleft
    palate with ACLS. Hydrolethalus syndrome is genetically heterogeneous, so
    this statement does not assign every hydrolethalus presentation to KIF7.
  distinguishing_features:
  - Fetal or perinatal lethality and more severe multisystem malformations favor hydrolethalus syndrome 2 over ACLS.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hydrolethalus and acrocallosal syndromes, two multiple malformation
      disorders with overlapping features that include polydactyly, brain
      abnormalities and cleft palate
    explanation: >-
      Establishes hydrolethalus syndrome as the allelic, phenotypically
      overlapping disorder distinguishing the severe end of the KIF7 spectrum.
- name: Joubert Syndrome
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  description: >-
    Joubert syndrome shares the molar tooth sign and is caused in a subset of
    cases by KIF7 mutations; distinguished by the predominance of the
    cerebellar/brainstem malformation and characteristic abnormal eye movements
    and breathing dysregulation.
  distinguishing_features:
  - A predominant molar-tooth imaging phenotype with oculomotor apraxia or breathing dysregulation favors a Joubert-spectrum diagnosis over classic ACLS.
  evidence:
  - reference: PMID:26648833
    reference_title: "Novel KIF7 Mutation in a Tunisian Boy with Acrocallosal Syndrome: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      have been identified as causative for ACLS but also for the fatal
      hydrolethalus syndrome and some cases of Joubert syndrome
    explanation: >-
      Documents the KIF7 allelic overlap between ACLS and Joubert syndrome,
      relevant to differential diagnosis.
  - reference: PMID:26349186
    reference_title: "Molar tooth sign and acrocallosal syndrome--a report on a Polish family and review of KIF7 syndromology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They present with features like molar tooth sign and hyperventilation
      that are not very typical in ACLS, but do occur in other ciliopathies
    explanation: >-
      Supports the molar-tooth and breathing-regulation distinction from
      classic ACLS.
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      none of the KIF7 patients but all the C5orf42 patients in our cohort
      presented with ocular motor apraxia, which is commonly associated with
      the MTS in JBTS patients
    explanation: >-
      Supports oculomotor apraxia as a discriminator in ACLS-like versus
      Joubert-spectrum presentations while preserving gene-specific context.
- name: CPLANE1-Related Joubert Syndrome 17
  disease_term:
    preferred_term: Joubert syndrome 17
    term:
      id: MONDO:0013824
      label: Joubert syndrome 17
  description: >-
    Biallelic CPLANE1/C5orf42-related Joubert syndrome 17 can closely resemble
    ACLS through macrocephaly, hypertelorism, polydactyly, developmental
    impairment, and a molar tooth/vermis phenotype.
  distinguishing_features:
  - Near-constant molar tooth sign or vermis hypoplasia and ocular motor apraxia favor CPLANE1-related Joubert syndrome 17.
  - Corpus-callosum abnormality is more prominent across the KIF7-positive spectrum.
  evidence:
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C5orf42 (likely) pathogenic variants are nearly invariably associated to
      the MTS/vermis hypoplasia and less often to corpus callosum abnormalities,
      while it is the opposite for KIF7.
    explanation: >-
      Establishes the overlapping phenotype and the clinical discriminators of
      CPLANE1/C5orf42-related disease.
- name: GLI3-Related Greig-Acrocallosal Spectrum
  disease_term:
    preferred_term: Greig cephalopolysyndactyly syndrome
    term:
      id: MONDO:0008287
      label: Greig cephalopolysyndactyly syndrome
  description: >-
    Rare de novo GLI3 variants have produced an acrocallosal phenotype, and
    GLI3 disorders such as Greig cephalopolysyndactyly overlap through
    macrocephaly, hypertelorism, and polysyndactyly. This is modeled as a
    dominant phenocopy rather than broadening the focal KIF7 entry.
  distinguishing_features:
  - A heterozygous or de novo GLI3 variant supports a dominant GLI3-spectrum diagnosis rather than autosomal recessive KIF7-related ACLS.
  evidence:
  - reference: PMID:23633388
    reference_title: "A de novo GLI3 mutation in a patient with acrocallosal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data confirm that mutations in GLI3 are a cause of the acrocallosal
      phenotype.
    explanation: >-
      Supports the explicit GLI3 phenocopy boundary and its placement in the
      differential rather than the focal KIF7 genetic model.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    Management is symptom-directed and multidisciplinary. Early physical,
    occupational, developmental, and communication support addresses hypotonia
    and developmental disability; seizures are treated with standard
    antiseizure therapy when present. Available evidence is case-report and
    clinical-review level rather than ACLS-specific comparative trials.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:22696705
    reference_title: "Acrocallosal syndrome in a young hypertensive male."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment includes physical therapy in infancy which may assist in the
      development of motor skills and muscle tone.
    explanation: Supports early physical therapy for hypotonia and motor delay.
  - reference: PMID:22696705
    reference_title: "Acrocallosal syndrome in a young hypertensive male."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiepileptic therapy for seizure disorder and antihypertensives for
      renoparenchymal hypertension are to be given.
    explanation: Supports symptom-directed antiseizure treatment when seizures occur.
  - reference: PMID:29910499
    reference_title: "Anaesthetising an infant with acrocallosal syndrome: An unusual case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At present, the child is referred to a neurodevelopment specialist, for
      neurodevelopment assessment and occupational therapist for infant
      stimulation program.
    explanation: >-
      A genetically confirmed case documents specialist developmental follow-up
      and occupational-therapy referral.
- name: Surgical Correction of Polydactyly and Malformations
  description: >-
    Individually indicated surgery may remove functionally limiting extra
    digits, release syndactyly, or repair orofacial and other structural
    malformations. These procedures treat local manifestations rather than the
    underlying ciliary signaling defect.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Postaxial hand polydactyly
    term:
      id: HP:0001162
      label: Postaxial hand polydactyly
  - preferred_term: Preaxial foot polydactyly
    term:
      id: HP:0001841
      label: Preaxial foot polydactyly
  - preferred_term: Cutaneous syndactyly
    term:
      id: HP:0012725
      label: Cutaneous syndactyly
  - preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:22696705
    reference_title: "Acrocallosal syndrome in a young hypertensive male."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery to remove extra fingers and toes and release fused fingers may
      improve movement and grasp, may assist in walking and the comfort of
      footwear.
    explanation: >-
      Supports symptom-directed surgery for polydactyly and syndactyly while
      making no disease-modifying claim.
  - reference: PMID:29910499
    reference_title: "Anaesthetising an infant with acrocallosal syndrome: An unusual case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She underwent Nissen fundoplication at 4 months of age, cleft lip repair
      at 6 months age and cleft palate repair at 18 months of age using the same
      technique.
    explanation: >-
      A KIF7-confirmed case documents actual surgical repair of associated
      structural manifestations, including cleft palate.
- name: Genetic Counseling
  description: >-
    When biallelic KIF7 disease is confirmed, parents should be counseled about
    autosomal recessive inheritance and a 25% recurrence risk in each pregnancy.
    Prenatal ultrasound can detect polydactyly and major CNS malformations but
    cannot exclude disease because presentation is variable. This recurrence
    statement does not apply to a rare de novo GLI3 phenocopy.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24949054
    reference_title: "The acrocallosal syndrome in a neonate with further widening of phenotypic expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the mode of inheritance of ACLS is autosomal recessive, the risk of
      recurrence is 25%. Genetic counselling is of prime importance
    explanation: >-
      Directly supports recurrence-risk counseling for the autosomal recessive
      KIF7 form.
  - reference: PMID:24949054
    reference_title: "The acrocallosal syndrome in a neonate with further widening of phenotypic expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polydactyly, and central nervous system malformations can be detected by
      ultrasonography in the second trimester, but due to variability of
      presentation, prenatal diagnosis may not always be possible.
    explanation: Supports balanced counseling about prenatal ultrasound capabilities and limits.

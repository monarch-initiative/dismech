inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Acrocallosal syndrome is inherited in an autosomal recessive manner and is
    caused by biallelic (homozygous or compound heterozygous) pathogenic KIF7
    variants. Truncating and splice-disrupting alleles are well established;
    biallelic missense substitutions have also been reported with broader,
    sometimes atypical phenotypes, so the allelic spectrum should not be
    described as exclusively loss of function.
  evidence:
  - reference: PMID:26648833
    reference_title: "Novel KIF7 Mutation in a Tunisian Boy with Acrocallosal Syndrome: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acrocallosal syndrome (ACLS) is a rare autosomal recessive disorder
      characterized by agenesis of the corpus callosum, facial dysmorphism,
      postaxial polydactyly of the hands as well as preaxial polydactyly of the
      feet, and developmental delay
    explanation: >-
      Establishes the autosomal recessive inheritance and the cardinal
      malformation tetrad of ACLS.
  - reference: PMID:23125460
    reference_title: "Novel KIF7 mutations extend the phenotypic spectrum of acrocallosal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the first four compound heterozygous cases
    explanation: >-
      Documents compound heterozygous KIF7 genotypes, consistent with recessive
      inheritance.
  - reference: PMID:26174511
    reference_title: "Novel KIF7 missense substitutions in two patients presenting with multiple malformations and features of acrocallosal syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two children who both had two missense mutations in the Kinesin
      Family Member 7 (KIF7) gene.
    explanation: >-
      Documents biallelic missense substitutions and prevents over-restricting
      the allelic spectrum to truncating loss-of-function variants.

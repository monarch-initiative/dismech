        guidepost cells required to guide the callosal axons through the
        midline.
      explanation: >-
        The Kif7-null model directly connects signaling disruption with the
        cortical-boundary and guidepost-cell defect.
  - target: Cerebellar and CNS Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Developmentally mis-dosed GLI signaling is consistent with the
      cerebellar and broader CNS malformation spectrum, but the intervening
      tissue-specific sequence has not been resolved.
    evidence:
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        we show deregulation of most GLI transcription factor targets and
        impaired GLI3 processing in tissues from individuals with KIF7

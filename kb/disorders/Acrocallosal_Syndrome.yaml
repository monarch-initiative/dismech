- name: Cortical Midline Guidepost-Cell Mispatterning
  description: >-
    In the Kif7-null model, cortical septum-boundary patterning is abnormal and
    guidepost cells required for callosal axons to cross the midline are
    redistributed. This provides an experimentally resolved route to callosal
    agenesis; its detailed cellular sequence remains model-organism evidence.

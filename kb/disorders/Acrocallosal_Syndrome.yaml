  downstream:
  - target: Dysregulated GLI3 Repressor and FGF8 Signaling
    causal_link_type: DIRECT
    description: >-
      KIF7 depletion impairs GLI3 processing, reduces GLI3 repressor activity,
      overactivates SHH target genes, and increases FGF8 signaling.
    evidence:
    - reference: PMID:30445565
      reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In both humans and mice, KIF7 depletion leads to abnormal GLI3
        processing and over-activation of SHH target genes.
      explanation: >-
        Directly links KIF7 depletion to the altered GLI output represented by
        the downstream signaling node.
    - reference: PMID:30445565
      reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        increased FGF8 signaling is responsible in part for CC defects
        associated to KIF7 depletion
      explanation: >-
        Completes the edge-level evidence for the FGF8 component of the
        downstream signaling node.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KIF7, the human ortholog of Drosophila Costal2, is a key component of the
      Hedgehog signaling pathway
    explanation: >-
      Identifies KIF7 as a core Hedgehog pathway component (Costal2 ortholog),
      establishing the molecular basis of the ACLS mechanism.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show deregulation of most GLI transcription factor targets and impaired
      GLI3 processing in tissues from individuals with KIF7 mutations
    explanation: >-
      Demonstrates the downstream molecular consequence of KIF7 loss in patient
      tissues: deregulated GLI targets and impaired GLI3 processing.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data show the role of KIF7 in human primary cilia, especially in the
      Hedgehog pathway through the regulation of GLI targets, and expand the
      clinical spectrum of ciliopathies
    explanation: >-
      Places ACLS within the primary-cilium Hedgehog-signaling ciliopathy
      spectrum, supporting conformance to the ciliopathy module Hedgehog node.
  - reference: PMID:34705483
    reference_title: "Hedgehog-induced ciliary trafficking of kinesin-4 motor KIF7 requires intraflagellar transport but not KIF7's microtubule binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vertebrates, Hedgehog signaling requires the primary cilium, and KIF7
      and Gli transcription factors accumulate at the cilium tip in response to
      Hedgehog activation
    explanation: >-
      Cell-based evidence that KIF7 is a cilium-tip Hedgehog regulator whose
      ciliary accumulation is coupled to pathway activation.
  - reference: PMID:34705483
    reference_title: "Hedgehog-induced ciliary trafficking of kinesin-4 motor KIF7 requires intraflagellar transport but not KIF7's microtubule binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that the immotile behavior of KIF7 is required to prevent ciliary
      localization of Gli transcription factors in the absence of Hedgehog
      signaling
    explanation: >-
      Mechanistic detail that KIF7 restrains GLI in the unstimulated state,
      explaining how loss of function deregulates GLI output.
- name: Dysregulated GLI3 Repressor and FGF8 Signaling
  description: >-
    KIF7 depletion lowers GLI3-repressor signaling and overactivates SHH target
    genes. In the Kif7-null model, restoring GLI3-repressor activity rescues the
    modeled ACLS features, while increased FGF8 signaling contributes
    specifically to anterior corpus-callosum defects.
  biological_processes:
  - preferred_term: Smoothened Signaling Pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DYSREGULATED
  - preferred_term: Fibroblast Growth Factor Receptor Signaling Pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:30445565
    reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      decreased GLI3R signaling is fully responsible for the ACLS features in
      these mice, as all phenotypes are rescued by increasing GLI3R activity.
    explanation: >-
      Genetic rescue in the mouse model places reduced GLI3-repressor activity
      downstream of Kif7 depletion.
  - reference: PMID:30445565
    reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      increased FGF8 signaling is responsible in part for CC defects associated
      to KIF7 depletion, as modulating FGF8 signaling rescued CC formation
      anteriorly in Kif7-/- mice.
    explanation: >-
      Functional rescue supports increased FGF8 signaling as a partial mediator
      of the modeled callosal defect.
  downstream:
  - target: Cortical Midline Guidepost-Cell Mispatterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cortical septum-boundary patterning defects
    description: >-
      Altered GLI3-repressor and FGF8 signaling disrupts cortical septum-boundary
      patterning and the distribution of guidepost cells at the callosal
      midline.
    evidence:
    - reference: PMID:30445565
      reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CC agenesis in these mice is associated with specific patterning defects

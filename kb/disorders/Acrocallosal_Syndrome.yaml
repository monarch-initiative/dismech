prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A historical case report and literature summary identified only 37
    previously described cases worldwide. This is a historical literature-case
    count for the clinically defined phenotype across genetic etiologies, not a
    KIF7-specific or denominator-based population estimate, and the current
    total is expected to be higher.
  evidence:
  - reference: PMID:22696705
    reference_title: "Acrocallosal syndrome in a young hypertensive male."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since Schinzel’s original description, only 37 cases of acrocallosal
      syndrome have been described worldwide.
    explanation: >-
      Supports a historical worldwide cases-in-literature classification while
      avoiding conversion of the count into an epidemiologic rate.
progression:
- phase: Congenital onset
  age_range: Antenatal to neonatal
  notes: >-
    The structural brain, craniofacial, and limb anomalies arise prenatally and
    are present at birth, although the full neurodevelopmental phenotype becomes
    apparent during follow-up.
  evidence:
  - reference: PMID:24949054
    reference_title: "The acrocallosal syndrome in a neonate with further widening of phenotypic expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An Indian neonate presented on day 1 of life (youngest in the literature
      to be reported) with combination of abnormalities consistent with the
      acrocallosal syndrome and some additional findings.
    explanation: A neonatal case directly establishes congenital presentation.
- phase: Neurodevelopmental course
  age_range: Childhood to adulthood
  notes: >-
    Developmental impairment is usually substantial but varies across the
    KIF7-associated spectrum. Long-term observations include persistent
    craniofacial dysmorphism and severe intellectual disability in many
    KIF7-positive individuals, while milder adult cognitive outcomes have been
    reported for some alleles.
  evidence:
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, long-term follow-up revealed that patients with pathogenic KIF7
      variants had more severe and persistent facial dysmorphism and in general
      more severe ID, while in patients with (likely) pathogenic C5orf42
      variants, facial dysmorphism became less prominent over time and they
      could catch up and reach a level of mild to moderate ID despite initial
      severe DD.
    explanation: >-
      Long-term comparative follow-up documents persistence and variability in
      the KIF7-associated neurodevelopmental course.
  - reference: PMID:29321670
    reference_title: "Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related ciliopathies through Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, patient 3 with homozygosity of the KIF7 splice site
      pathogenic variant at position −3 could also catch up with only mild
      cognitive deficits in adulthood
    explanation: >-
      Directly supports a milder adult cognitive outcome for one KIF7 splice
      variant while avoiding a broad genotype-phenotype rule.
pathophysiology:
- name: KIF7 Cilium-Tip Dysfunction and Impaired Hedgehog Signal Transduction
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  description: >-
    KIF7, the human ortholog of Drosophila Costal2, is an immotile kinesin-4
    protein that localizes to the tip of the primary cilium, where it organizes
    the cilium-tip compartment and regulates the GLI transcription factors of
    the Hedgehog pathway. In the absence of Hedgehog ligand KIF7 promotes
    processing of GLI3 into its transcriptional repressor form; upon pathway
    activation KIF7 and GLI accumulate at the cilium tip. Pathogenic KIF7
    dysfunction deregulates GLI target genes and impairs GLI3 processing,
    disrupting the tightly dosed Hedgehog output required for midline brain,
    limb, and craniofacial patterning.

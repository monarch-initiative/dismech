diagnosis:
- name: Functional sodium-transport testing (sweat chloride and nasal potential difference)
  presence: Abnormal sweat chloride concentration and/or abnormal nasal potential difference
  description: >-
    Sodium transport is assessed both in the sweat glands (pilocarpine-iontophoresis
    sweat chloride, the standard cystic fibrosis test) and in the airway epithelium
    (nasal potential difference). In BESC1 either can be normal or abnormal, so the pair
    characterizes the ENaC functional defect rather than confirming the diagnosis: an
    abnormally high basal nasal PD suggests a Liddle-like gain of function while a high
    sweat chloride with low basal PD resembles the PHA-I loss-of-function pattern.
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal sweat chloride concentration or nasal potential difference measurement"
    explanation: Names the two functional sodium-transport tests (sweat chloride and nasal potential difference) used to assess these patients.
- name: Exclusion of two CFTR mutations
  presence: Absence of two pathogenic CFTR mutations on genomic screening
  description: >-
    Diagnosis requires excluding classic cystic fibrosis: complete CFTR screening must
    not identify two pathogenic mutations, distinguishing BESC1 from CF, while a single
    heterozygous CFTR variant may still cooperate in trans with the ENaC variant.
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "55 patients with idiopathic bronchiectasis and without two mutations in the coding regions of CFTR"
    explanation: The cohort was ascertained from patients without two pathogenic CFTR mutations, making exclusion of two CFTR mutations a defining diagnostic criterion for this non-classic-CF entity.
treatments:
- name: Airway Clearance Therapy
  description: >-
    Chest physiotherapy and airway clearance techniques to mobilize retained secretions,
    the mainstay of bronchiectasis management regardless of etiology.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: airway clearance / respiratory therapy
    term:
      id: NCIT:C15322
      label: Respiratory Therapy
  target_mechanisms:
  - target: Impaired Mucociliary Clearance
    treatment_effect: BYPASSES
    description: >-
      Mechanical airway clearance physically mobilizes retained, adherent mucus, working
      around the failed mucociliary escalator rather than restoring ciliary transport.
- name: Inhaled Hypertonic Saline
  description: >-
    Nebulized hypertonic saline osmotically rehydrates the airway surface liquid and
    improves mucus clearance, directly countering the ENaC-driven surface dehydration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

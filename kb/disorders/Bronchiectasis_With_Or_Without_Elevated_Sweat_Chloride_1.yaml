  publication: PMID:15077107
  description: >-
    Transgenic mouse overexpressing the ENaC beta subunit specifically in the airway
    epithelium, which raises airway Na+ absorption and produces a spontaneous cystic
    fibrosis-like lung disease. It is the model on which the ENaC gain-of-function
    airway-surface-liquid-depletion mechanism proposed for BESC1 is based.
  modeled_mechanisms:
  - target: Airway Surface Liquid Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Raised airway Na+ absorption depletes airway surface liquid volume and concentrates
      mucus, reproducing the tissue-level lesion of this node.
    limitations: >-
      This is a supraphysiological, airway-specific overexpression of wild-type beta-ENaC,
      not a knock-in of any BESC1 SCNN1B missense variant, so it models the downstream
      consequence of excess ENaC activity rather than the specific human alleles or their
      heterozygous, incompletely penetrant, often CFTR-trans-heterozygous genetic context.
      This overexpression-versus-variant gap is precisely why the entry's ENaC
      gain-of-function hypothesis is only EMERGING.
    readouts:
    - name: Airway surface liquid volume and mucus concentration
      target: Airway Surface Liquid Depletion
      direction: DECREASED
      interpretation: ASL volume depletion with increased mucus concentration in vivo.
      evidence:
      - reference: PMID:15077107
        reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "increased airway Na(+) absorption in vivo caused airway surface liquid (ASL) volume depletion, increased mucus concentration, delayed mucus transport and mucus adhesion to airway surfaces"
        explanation: Reports the ASL volume depletion and increased mucus concentration measured in this model.
    evidence:
    - reference: PMID:15077107
      reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated mice with airway-specific overexpression of epithelial Na(+) channels (ENaC)"
      explanation: Establishes the airway-specific ENaC-overexpression mouse as the model informative for this ASL-depletion node.
  - target: Impaired Mucociliary Clearance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Delayed mucus transport and mucus adhesion to airway surfaces recapitulate impaired
      mucociliary clearance.
    limitations: >-
      Same caveat: airway-specific overexpression of wild-type beta-ENaC, not a knock-in of
      a BESC1 variant, so the clearance defect is driven by supraphysiological channel
      expression rather than the human missense alleles.
    readouts:
    - name: Mucus transport rate
      target: Impaired Mucociliary Clearance
      direction: DECREASED
      interpretation: Delayed mucus transport and adhesion, the functional correlate of impaired clearance.
      evidence:
      - reference: PMID:15077107
        reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "increased airway Na(+) absorption in vivo caused airway surface liquid (ASL) volume depletion, increased mucus concentration, delayed mucus transport and mucus adhesion to airway surfaces"
        explanation: Reports the delayed mucus transport and mucus adhesion measured in this model.
    evidence:
    - reference: PMID:15077107
      reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Defective mucus transport caused a severe spontaneous lung disease sharing features with cystic fibrosis, including mucus obstruction, goblet cell metaplasia, neutrophilic inflammation and poor bacterial clearance"
      explanation: Defective mucus transport in the model is the impaired-clearance correlate driving downstream disease.
  - target: Chronic Airway Infection
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Poor bacterial clearance and mucus obstruction predispose to persistent airway
      infection in the model.
    limitations: >-
      Same caveat: an overexpression model, not a knock-in of a BESC1 SCNN1B variant; the
      mouse also shows CF-like features beyond what is documented in the small human ENaC
      cohorts, so translational fidelity to human BESC1 infection is uncertain.
    readouts:
    - name: Airway bacterial clearance
      target: Chronic Airway Infection
      direction: DECREASED
      interpretation: Poor bacterial clearance corresponds to the chronic-infection node.
      evidence:
      - reference: PMID:15077107
        reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Defective mucus transport caused a severe spontaneous lung disease sharing features with cystic fibrosis, including mucus obstruction, goblet cell metaplasia, neutrophilic inflammation and poor bacterial clearance"
        explanation: Poor bacterial clearance measured in the model grounds the chronic-airway-infection readout.
    evidence:
    - reference: PMID:15077107
      reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Defective mucus transport caused a severe spontaneous lung disease sharing features with cystic fibrosis, including mucus obstruction, goblet cell metaplasia, neutrophilic inflammation and poor bacterial clearance"
      explanation: Establishes the model as informative for the chronic-infection node via its poor bacterial clearance.

    explanation: The reported ENaC beta-subunit variants were found in the heterozygous state, consistent with dominant/susceptibility rather than recessive inheritance.
genetic:
- name: SCNN1B
  gene_term:
    preferred_term: SCNN1B
    term:
      id: hgnc:10600
      label: SCNN1B
  association: ENaC beta-subunit variant conferring susceptibility to cystic fibrosis-like bronchiectasis
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    SCNN1B encodes the beta subunit of the epithelial sodium channel (ENaC). Variants
    reported in BESC1 are heterozygous and are proposed to dysregulate ENaC toward
    increased sodium-channel activity (gain of function), the opposite of the ENaC
    loss-of-function seen in pseudohypoaldosteronism type 1 and distinct from the CFTR
    loss underlying cystic fibrosis. Variant-level functional characterization is
    incomplete; several were identified in trans with a CFTR mutation or variant.
  evidence:
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two non-classic CF patients without CFTR mutations who have novel deleterious mutations in the beta-subunits of SCNN1 in the absence of overt renal disease."
    explanation: Establishes SCNN1B beta-subunit variants as the genetic basis of this CF-like syndrome in patients lacking CFTR mutations and renal disease.
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defects in the epithelial Na(+) channel (SCNN1) have been associated with phenotypes dominated by renal disease"
    explanation: Contrasts BESC1 with the renal-dominant ENaC disorders, supporting the note that BESC1 lacks overt renal disease.
mechanistic_hypotheses:
- hypothesis_group_id: enac_gain_of_function_asl_depletion_model
  hypothesis_label: ENaC Gain-of-Function Airway Surface Liquid Depletion Model
  status: EMERGING
  description: >-
    BESC1 is proposed to arise from SCNN1B variants that increase epithelial sodium
    channel activity in airway epithelium. Excess sodium (and osmotically obligated
    water) absorption depletes airway surface liquid, mirroring the CFTR-independent
    mechanism demonstrated in beta-ENaC-overexpressing mice, which develop cystic
    fibrosis-like lung disease. Direct functional proof that individual BESC1 SCNN1B
    variants are gain-of-function in human airway epithelium remains limited, and some
    carriers also harbor a CFTR variant, so the model is best regarded as emerging.
  evidence:
  - reference: PMID:15077107
    reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated mice with airway-specific overexpression of epithelial Na(+) channels (ENaC)"
    explanation: The beta-ENaC-overexpressing mouse is the model system on which the ENaC gain-of-function airway mechanism proposed for BESC1 is based.
pathophysiology:
- name: ENaC Channel Hyperactivity
  description: >-
    SCNN1B variants dysregulate the epithelial sodium channel toward increased,
    constitutive amiloride-sensitive sodium-channel activity in airway epithelium,
    escaping normal down-regulation. This qualitative gain of function is the proposed
    initiating molecular lesion of BESC1, in contrast to the CFTR chloride-channel loss
    of cystic fibrosis.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  molecular_functions:
  - preferred_term: amiloride-sensitive sodium channel (ENaC) activity
    modifier: GAIN_OF_FUNCTION
    term:

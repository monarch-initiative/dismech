name: Bronchiectasis With Or Without Elevated Sweat Chloride 1
creation_date: "2026-09-02T00:00:00Z"
category: Genetic
description: >-
  Bronchiectasis with or without elevated sweat chloride 1 (BESC1, OMIM 211400) is a
  rare cystic fibrosis-like airway disease associated with germline variants in SCNN1B,
  which encodes the beta subunit of the epithelial sodium channel (ENaC). It is
  mechanistically distinct from cystic fibrosis: rather than loss of the CFTR chloride
  channel, BESC1 is attributed to dysregulated, putatively gain-of-function ENaC activity
  that increases airway epithelial sodium and fluid absorption. The resulting airway
  surface liquid depletion impairs mucociliary clearance and produces mucus obstruction,
  chronic airway infection, neutrophilic inflammation, and bronchiectasis in the absence
  of two disease-causing CFTR mutations. Affected individuals may have a normal, borderline,
  or elevated sweat chloride and lack the overt renal disease seen in other ENaC disorders
  (Liddle syndrome, pseudohypoaldosteronism type 1). Reported variants are heterozygous and
  behave as susceptibility alleles, sometimes in trans with a CFTR mutation or variant, so
  penetrance is incomplete.

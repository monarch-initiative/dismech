prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Very few cases have been reported. The association was first described in two
    non-classic cystic fibrosis patients without CFTR mutations who carried SCNN1B
    beta-subunit variants; subsequent case series identified additional ENaC variants
    in small idiopathic-bronchiectasis cohorts.
  evidence:
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two non-classic CF patients without CFTR mutations who have novel deleterious mutations in the beta-subunits of SCNN1 in the absence of overt renal disease."
    explanation: Original report documents only two patients, supporting the ultra-rare, literature-count occurrence of this entity.
inheritance:
- name: Susceptibility allele (heterozygous)
  inheritance_term:
    preferred_term: Heterozygous susceptibility allele
  description: >-
    Reported SCNN1B (ENaC beta) variants are heterozygous and behave as incompletely
    penetrant susceptibility alleles, sometimes in trans with a CFTR mutation or
    variant, rather than as classic dominant or recessive Mendelian cystic fibrosis
    alleles. No HPO mode-of-inheritance term cleanly represents a heterozygous
    susceptibility allele, so the descriptor is left ontology-unbound rather than
    asserting autosomal dominant transmission, which the heterozygous-susceptibility
    data do not support.
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "five different amino-acid changes (p.Ser82Cys, p.Pro369Thr, p.Asn288Ser in ENaCbeta ; and p.Gly183Ser, p.Glu197Lys in ENaCgamma) in heterozygous state in 8 patients"
    explanation: The reported ENaC beta/gamma variants were each found in the heterozygous state in 8 patients, consistent with heterozygous susceptibility rather than dominant or recessive Mendelian transmission.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    A subset of patients present as ENaCbeta/CFTR trans-heterozygotes: a heterozygous
    SCNN1B (ENaC beta) variant together with a heterozygous CFTR mutation or variant as
    the second locus, an interaction of susceptibility factors consistent with digenic
    or multigenic transmission rather than a single-locus mode.
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "especially in patients who are trans-heterozygotes for ENaCbeta/CFTR mutations or variants"
    explanation: Fajac et al. conclude that ENaC-related bronchiectasis arises especially in ENaCbeta/CFTR trans-heterozygotes, the two-locus (digenic) mode captured by this block.
genetic:
- name: SCNN1B
  gene_term:
    preferred_term: SCNN1B
    term:
      id: hgnc:10600
      label: SCNN1B
  association: ENaC beta-subunit variant conferring susceptibility to cystic fibrosis-like bronchiectasis
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    SCNN1B encodes the beta subunit of the epithelial sodium channel (ENaC). Variants
    reported in BESC1 are heterozygous and are proposed to dysregulate ENaC toward
    increased sodium-channel activity (gain of function), the opposite of the ENaC
    loss-of-function seen in pseudohypoaldosteronism type 1 and distinct from the CFTR
    loss underlying cystic fibrosis. Variant-level functional characterization is
    incomplete; several were identified in trans with a CFTR mutation or variant.
    No variant-specific SCNN1B electrophysiology (e.g. dedicated oocyte/patch-clamp
    studies of individual BESC1 alleles) is cited here because none was verifiable
    from the fetched reference caches, and deep-research providers were unavailable
    in this curation environment; such claims are deliberately not asserted rather
    than sourced to an unverified citation.
  evidence:
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two non-classic CF patients without CFTR mutations who have novel deleterious mutations in the beta-subunits of SCNN1 in the absence of overt renal disease."
    explanation: Establishes SCNN1B beta-subunit variants as the genetic basis of this CF-like syndrome in patients lacking CFTR mutations and renal disease.
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defects in the epithelial Na(+) channel (SCNN1) have been associated with phenotypes dominated by renal disease"
    explanation: Contrasts BESC1 with the renal-dominant ENaC disorders, supporting the note that BESC1 lacks overt renal disease.
- name: CFTR
  gene_term:
    preferred_term: CFTR
    term:
      id: hgnc:1884
      label: CFTR
  association: Heterozygous CFTR mutation or variant cooperating in trans with an ENaC (SCNN1B) variant
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  notes: >-
    CFTR is not the primary BESC1 locus, but a single heterozygous CFTR mutation or
    variant (e.g. p.F508del, IVS8-5T) was carried in trans by a subset of ENaCbeta-variant
    patients, and Fajac et al. propose this ENaCbeta/CFTR trans-heterozygosity as a
    cooperating, digenic contribution to the airway disease. This is the second locus of
    the digenic Inheritance block, not an independent cystic fibrosis diagnosis (no patient
    carried two pathogenic CFTR mutations).
  evidence:
  - reference: PMID:18507830
    reference_title: "Could a defective epithelial sodium channel lead to bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Ser82Cys amino-acid change was found in 3 unrelated patients who were also heterozygous for a CFTR mutation or variant"
    explanation: Documents the heterozygous CFTR mutation or variant carried in trans with the ENaC beta variant, the cooperating second locus.
mechanistic_hypotheses:
- hypothesis_group_id: enac_gain_of_function_asl_depletion_model
  hypothesis_label: ENaC Gain-of-Function Airway Surface Liquid Depletion Model
  status: EMERGING
  description: >-
    BESC1 is proposed to arise from SCNN1B variants that increase epithelial sodium
    channel activity in airway epithelium. Excess sodium (and osmotically obligated
    water) absorption depletes airway surface liquid, mirroring the CFTR-independent
    mechanism demonstrated in beta-ENaC-overexpressing mice, which develop cystic
    fibrosis-like lung disease. Direct functional proof that individual BESC1 SCNN1B
    variants are gain-of-function in human airway epithelium remains limited, and some
    carriers also harbor a CFTR variant, so the model is best regarded as emerging.
  evidence:
  - reference: PMID:15077107
    reference_title: "Increased airway epithelial Na+ absorption produces cystic fibrosis-like lung disease in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated mice with airway-specific overexpression of epithelial Na(+) channels (ENaC)"
    explanation: The beta-ENaC-overexpressing mouse is the model system on which the ENaC gain-of-function airway mechanism proposed for BESC1 is based.
pathophysiology:
- name: ENaC Channel Hyperactivity
  description: >-
    SCNN1B variants dysregulate the epithelial sodium channel toward increased,
    constitutive amiloride-sensitive sodium-channel activity in airway epithelium,
    escaping normal down-regulation. This qualitative gain of function is the proposed
    initiating molecular lesion of BESC1, in contrast to the CFTR chloride-channel loss
    of cystic fibrosis.

    therapeutic_agent:
    - preferred_term: hypertonic saline
      term:
        id: CHEBI:26710
        label: sodium chloride
  target_mechanisms:
  - target: Airway Surface Liquid Depletion
    treatment_effect: RESTORES
    description: >-
      Osmotically active inhaled hypertonic saline draws water onto the airway surface,
      rehydrating the depleted airway surface liquid layer that the ENaC-driven excess
      sodium absorption removes.
- name: Antibiotic Therapy
  description: >-
    Antibiotics targeting acute exacerbations and chronic endobronchial infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

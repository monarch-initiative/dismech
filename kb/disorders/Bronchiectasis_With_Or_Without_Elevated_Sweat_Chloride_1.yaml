prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Very few cases have been reported. The association was first described in two
    non-classic cystic fibrosis patients without CFTR mutations who carried SCNN1B
    beta-subunit variants; subsequent case series identified additional ENaC variants
    in small idiopathic-bronchiectasis cohorts.
  evidence:
  - reference: PMID:16207733
    reference_title: "Mutations in the beta-subunit of the epithelial Na+ channel in patients with a cystic fibrosis-like syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two non-classic CF patients without CFTR mutations who have novel deleterious mutations in the beta-subunits of SCNN1 in the absence of overt renal disease."
    explanation: Original report documents only two patients, supporting the ultra-rare, literature-count occurrence of this entity.

      term:
        id: NCIT:C258
        label: Antibiotic
  target_mechanisms:
  - target: Chronic Airway Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotics suppress the persistent endobronchial bacterial infection that drives
      the self-perpetuating infection-inflammation injury cycle.

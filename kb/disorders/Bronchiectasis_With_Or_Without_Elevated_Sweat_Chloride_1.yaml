    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two non-classic CF patients without CFTR mutations who have novel deleterious mutations in the beta-subunits of SCNN1 in the absence of overt renal disease."
    explanation: Localizes the molecular lesion to the SCNN1 beta subunit (ENaC), the channel whose activity is dysregulated in this node.
  downstream:

- name: Hepatic Bile Acid Synthetic Enzyme Deficiency
  description: >
    Each inborn bile acid synthesis disorder converges on loss of enzymatic
    flux through the hepatocyte pathway converting cholesterol to the conjugated
    primary bile acids cholic acid and chenodeoxycholic acid (HSD3B7, AKR1D1,
    CYP7B1, CYP27A1, AMACR) or through the terminal amidation step (BAAT,
    SLC27A5). The hepatocyte pathway block is the cellular lesion from which
    both bile acid pool depletion and toxic intermediate accumulation follow.
  biological_scale: CELLULAR
  conforms_to: "cholestatic_liver_injury#Impaired Bile Formation and Secretion"

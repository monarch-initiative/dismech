name: Frias syndrome
creation_date: "2026-05-10T16:46:45Z"
category: Mendelian
synonyms:
- 14q22-q23 microdeletion syndrome
- 14q22q23 microdeletion syndrome
- 14q22-q23 contiguous gene deletion syndrome
- Del(14)(q22q23)
- monosomy 14q22-q23
description: >-
  Frias syndrome is a rare 14q22-q23 contiguous-gene deletion syndrome. The
  core presentation centers on congenital eye, pituitary, and hand/foot
  anomalies, with variable facial, neurodevelopmental, cranial, and digestive
  involvement. Current evidence supports dosage loss of developmental
  regulators in the interval, especially BMP4, OTX2, and neighboring SIX-family
  genes, rather than a single uniform sequence-variant mechanism.
disease_term:
  preferred_term: Frias syndrome
  term:
    id: MONDO:0012324
    label: Frias syndrome
parents:
- hereditary disease
- chromosomal disorder
notes: >-
  Orphanet merged ORPHA:2055 (growth deficiency-brachydactyly-dysmorphism
  syndrome) into ORPHA:264200 (14q22q23 microdeletion syndrome), so the
  Orphanet HPO frequency tiers curated below derive from a small number of
  reported families and interstitial 14q22-q23 deletions of differing genomic
  extent rather than a large uniform cohort. Orphanet's coarse endocrine bucket
  HP:0000864 (Abnormality of the hypothalamus-pituitary axis) is represented
  here by its specific curated endocrine findings, anterior pituitary
  hypoplasia (HP:0010627) and diabetes insipidus (HP:0000873).
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:34408948
      reference_title: Anophthalmia, Global Developmental Delay, and Severe Dysphagia in a Young Girl With 14q22q23 Microdeletion Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        14q22q23 microdeletion syndrome, also called Frias syndrome, is an
        extremely rare partial deletion of the long arm of chromosome 14
        characterized by the anomalies of the pituitary gland, eyes, and
        hand/foot.
      explanation: Establishes Frias syndrome as a congenital chromosomal contiguous-gene deletion disorder.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: ORPHA:264200
      reference_title: "14q22q23 microdeletion syndrome"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "14q22q23 microdeletion syndrome is a rare partial deletion of the long arm of chromosome 14 characterized by ocular anomalies (anopthalmia/microphthalmia, ptosis, hypertelorism, exophthalmos), pituitary anomalies (pituitary hypoplasia/aplasia with growth hormone deficiency and growth retardation) and hand/foot anomalies (polydactyly, short digits, pes cavus)."
      explanation: Supports endocrine classification based on congenital pituitary hypoplasia or aplasia and growth hormone deficiency.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:34408948
      reference_title: Anophthalmia, Global Developmental Delay, and Severe Dysphagia in a Young Girl With 14q22q23 Microdeletion Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intellectual disability and facial dysmorphism are other common
        manifestations.
      explanation: Supports neurologic classification encompassing ocular, brain malformation, and neurodevelopmental manifestations.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  evidence:
  - reference: ORPHA:264200
    reference_title: "14q22q23 microdeletion syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| <1 / 1 000 000 | Worldwide | Point prevalence | PMID:24311462 |"
    explanation: Orphanet records a worldwide point prevalence below 1 per 1,000,000 for 14q22q23 microdeletion (Frias) syndrome.
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  evidence:
  - reference: PMID:34408948
    reference_title: Anophthalmia, Global Developmental Delay, and Severe Dysphagia in a Young Girl With 14q22q23 Microdeletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are only a few cases reported with Frias syndrome in the literature,
      and there are multiple variations present, which are not well recognized
      due to different set of genes involved.
    explanation: Confirms ultra-rare occurrence with only a small number of published cases worldwide.
inheritance:
- name: Familial autosomal dominant transmission
  description: >-
    Familial transmission has been reported for a 14q22.1-q22.3 deletion shared
    by an affected mother and two daughters, consistent with autosomal dominant
    transmission of the deletion in that pedigree.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24311462
    reference_title: Haploinsufficiency of BMP4 gene may be the underlying cause of Frías syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed array-CGH, which identified an identical interstitial deletion
      of chromosome 14q22.1-q22.3 in the mother and two daughters.
    explanation: >-
      This directly supports familial transmission of the same 14q22 deletion
      across an affected mother and daughters.
- name: De novo occurrence
  description: >-
    De novo 14q22q23 microdeletions also occur, so recurrence counseling depends
    on parental testing and family history.
  evidence:
  - reference: PMID:29299063
    reference_title: Haploinsufficiency of BMP4 and OTX2 in the Foetus with an abnormal facial profile detected in the first trimester of pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, this is the earliest detection of this
      microdeletion (occurred de novo), the first case detected by MLPA and
      confirmed by microarray.
    explanation: >-
      This prenatal case report explicitly documents a de novo 14q22q23
      microdeletion confirmed by molecular testing.

- name: Epidermal Barrier and Follicular Dysfunction
  biological_scale: CELLULAR
  description: >-
    The cutaneous phenotype is cell-autonomous to keratinocyte clones expressing the
    mutant allele, which are the clones that both lack cholesterol and accumulate the
    upstream sterols. The epidermis is a tissue in which the distal cholesterol pathway
    is not redundant, since barrier lipids must be synthesized locally.
  biological_processes:
  - preferred_term: epidermis development
    modifier: ABNORMAL
    term:
      id: GO:0008544
      label: epidermis development
  downstream:
  - target: Blaschkolinear Cutaneous Phenotype
    causal_link_type: DIRECT
    description: Clone-restricted keratinocyte dysfunction appears as the patterned cutaneous phenotype.
- name: Male Hemizygous Lethality
  biological_scale: ORGANISM
  description: >-
    A male carrying a null EBP allele on his single X has no enzyme-competent tissue
    and is typically lost in early gestation. The rule is not absolute, and the two
    documented escape routes are informative about the mechanism: post-zygotic
    mosaicism (or a supernumerary X) restores a competent clone population, while a
    hypomorphic allele leaves residual isomerase activity in every cell.
  evidence:
  - reference: PMID:24700572
    reference_title: "A novel EBP c.224T>A mutation supports the existence of a male-specific disorder independent of CDPX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the Emopamil-binding protein (EBP) gene cause X-linked dominant
      chondrodysplasia punctata 2 (CDPX2), a disorder in which at least 95% of liveborn
      individuals are female and male intrauterine lethality is assumed.
    explanation: >-
      States the male lethality and the resulting sex ratio among live births.
  - reference: PMID:24700572
    reference_title: "A novel EBP c.224T>A mutation supports the existence of a male-specific disorder independent of CDPX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alternatively, affected males may exhibit a distinct phenotype if they are
      hemizygous for a hypomorphic allele of EBP.
    explanation: >-
      Identifies residual enzyme activity as the second route by which a hemizygous
      male survives, and notes that the resulting phenotype is not CDPX2.

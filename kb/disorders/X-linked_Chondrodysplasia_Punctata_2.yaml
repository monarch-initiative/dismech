animal_models:
- name: Tattered (Td) mouse
  species: Mouse
  genotype: Ebp missense substitution, X-linked semi-dominant (Td), heterozygous females
  publication: PMID:10391218
  description: >-
    A spontaneous X-linked semi-dominant mouse mutation that was independently mapped to
    Ebp, giving a naturally occurring orthologue of CDPX2 in which the mosaic logic of
    the disease is directly visible: heterozygous females develop hairless hyperkeratotic
    patches that read out as coat striping in the adult, and hemizygous males die
    prenatally.
  modeled_mechanisms:
  - target: X-Inactivation Mosaicism
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The striped coat of the heterozygous female is the mouse equivalent of Blaschko
      lines - a directly observable map of which clones inactivated which X - and
      prenatal death of the hemizygous male reproduces the human male lethality.
    limitations: >-
      Mouse coat striping follows the mouse pattern of clonal skin development, so the
      geometry is not the same as human Blaschko lines even though the underlying
      mosaicism is; and the mouse allele is a single missense substitution, so the model
      speaks to that allele class rather than to nulls.
    readouts:
    - name: Hairless hyperkeratotic skin patches producing adult coat striping
      target: X-Inactivation Mosaicism
      direction: ALTERED
      interpretation: >-
        A visible clonal map of mutant-expressing versus wild-type-expressing skin in the
        heterozygous female.
      evidence:
      - reference: PMID:10391218
        reference_title: "Mutations in a delta 8-delta 7 sterol isomerase in the tattered mouse and X-linked dominant chondrodysplasia punctata. jderry@immunex.com."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Heterozygous females are small and at 4-5 days of age develop patches of
          hyperkeratotic skin where no hair grows, resulting in a striping of the coat in
          adults.
        explanation: Reports the patterned skin phenotype and its progression to coat striping.
    evidence:
    - reference: PMID:10391218
      reference_title: "Mutations in a delta 8-delta 7 sterol isomerase in the tattered mouse and X-linked dominant chondrodysplasia punctata. jderry@immunex.com."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tattered (Td) is an X-linked, semi-dominant mouse mutation associated with prenatal male lethality."
      explanation: >-
        The X-linked semi-dominant inheritance with prenatal male lethality is the same
        genetic architecture as human CDPX2.
  - target: EBP Sterol-Delta8-Isomerase Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Td is an Ebp allele, so the model carries the same molecular lesion as the human
      disease rather than a phenocopy.
    limitations: >-
      A single amino-acid substitution rather than a null; residual activity is not
      characterized in the cited report.
    evidence:
    - reference: PMID:10391218
      reference_title: "Mutations in a delta 8-delta 7 sterol isomerase in the tattered mouse and X-linked dominant chondrodysplasia punctata. jderry@immunex.com."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We have now identified the defect in Td mice as a single amino acid substitution
        in the delta8-delta7 sterol isomerase emopamil binding protein (Ebp; encoded by
        Ebp in mouse) and identified alterations in human EBP in seven unrelated CDPX2
        patients.
      explanation: Establishes that the mouse mutation is in the orthologue of the human disease gene.
differential_diagnoses:
- name: CHILD syndrome
  disease_term:
    preferred_term: CHILD syndrome
    term:
      id: MONDO:0010621
      label: CHILD syndrome
  description: >-
    The nearest mechanistic neighbour: also X-linked, also male-lethal, also a mosaic
    disorder of the post-squalene cholesterol pathway, and also placed in ISDS group 23.
    NSDHL acts one step upstream of EBP. The two are separated clinically by lesion
    geometry rather than by pathway.
  distinguishing_features:
  - CHILD syndrome lesions are strictly lateralized with a sharp body-midline boundary; CDPX2 lesions are bilateral, asymmetric, and follow Blaschko lines
  - CDPX2 carries elevated 8(9)-cholestenol and 8-dehydrocholesterol; NSDHL-related CHILD syndrome carries a methylsterol pattern instead
  - CHILD syndrome has ipsilateral limb reduction defects; CDPX2 has asymmetric rhizomelic shortening without true reduction defects
- name: Rhizomelic chondrodysplasia punctata type 1
  disease_term:
    preferred_term: rhizomelic chondrodysplasia punctata type 1
    term:
      id: MONDO:0008972
      label: rhizomelic chondrodysplasia punctata type 1
  description: >-
    The other major cause of a stippled, rhizomelic newborn skeleton, and the principal
    radiographic differential. It is autosomal recessive and peroxisomal rather than
    X-linked and sterol-pathway, and every cell is uniformly affected.
  distinguishing_features:
  - RCDP1 limb shortening is symmetric; CDPX2 shortening is characteristically asymmetric
  - RCDP1 has profound developmental impairment and seizures; CDPX2 intellect is usually normal
  - RCDP1 is confirmed by erythrocyte plasmalogen deficiency with raised phytanic acid; CDPX2 by the 8(9)-cholestenol / 8-dehydrocholesterol sterol profile
  - RCDP1 affects both sexes equally; at least 95% of live-born CDPX2 patients are female
- name: Brachytelephalangic chondrodysplasia punctata (CDPX1) and its phenocopies
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 1
    term:
      id: MONDO:0010555
      label: X-linked chondrodysplasia punctata 1
  description: >-
    The X-linked recessive CDP, affecting males, with nasomaxillary hypoplasia and
    distal phalangeal shortening rather than ichthyosis and rhizomelia. Its
    vitamin-K-related phenocopies (maternal warfarin exposure, maternal autoimmune
    disease) share the same radiographic pattern and must be excluded in a stippled
    newborn before either genetic diagnosis is made.
  distinguishing_features:
  - CDPX1 affects males; CDPX2 live births are overwhelmingly female
  - CDPX1 has brachytelephalangy and nasal hypoplasia without ichthyosis, alopecia, or cataract
  - CDPX1 has a normal sterol profile
discussions:
- discussion_id: hypomorphic_male_entity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Male Hemizygous Lethality
  - genetic#EBP
  prompt: >-
    Is the phenotype of a male hemizygous for a hypomorphic EBP allele a mild variant of
    CDPX2, or a separate X-linked recessive disorder that happens to share the gene?
  rationale: >-
    Two distinct routes let a male with an EBP variant survive, and they predict
    different phenotypes. A mosaic male, or one with a null allele plus a supernumerary
    X, has enzyme-competent clones and presents like a female CDPX2 patient. A male
    hemizygous for a hypomorphic allele has no competent clones anywhere but retains
    partial activity in all of them, and the reported phenotype - digital abnormalities,
    intellectual disability, and short stature, without the ichthyosis and stippling of
    CDPX2 - does not look like CDPX2 at all. Whether that is a nosologically separate
    entity or the low-activity end of one continuum is unsettled, and it matters for
    this entry's boundaries: the ISDS nosology lists only one EBP row, and MONDO carries
    only MONDO:0020603, so a decision either way would change what this entry covers.
    dismech currently treats it as within scope and flags the question here rather than
    creating a second entry on one report.
  evidence:
  - reference: PMID:24700572
    reference_title: "A novel EBP c.224T>A mutation supports the existence of a male-specific disorder independent of CDPX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The molecular and biochemical evidence convincingly supports the pathogenicity and
      association of the p.I75N mutation with this newly described phenotype.
    explanation: >-
      The authors argue for a distinct male entity on the strength of one family with
      biochemical confirmation - enough to raise the question, not to settle it.
- discussion_id: sterol_to_stippling_route
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of 8(9)-Cholestenol and 8-Dehydrocholesterol
  - pathophysiology#Cellular Cholesterol Deficiency
  prompt: >-
    Which arm of the dual lesion - cholesterol starvation or accumulation of the
    upstream sterols - actually produces the punctate cartilage calcification, and by
    what route?
  rationale: >-
    The enzymology of CDPX2 is settled and the sterol profile is diagnostic, but the
    step from either sterol abnormality to abnormal calcification of cartilage is not.
    The gene-discovery paper put it no more strongly than that the results "suggest a
    role for sterols in bone development", and that remains the state of the argument.
    The question is answerable in principle, because CHILD syndrome supplies a
    precedent: there, a topical trial separating cholesterol replacement from
    suppression of precursor flux showed that neither arm alone accounted for the skin
    phenotype. No equivalent dissection has been done for the CDPX2 skeleton, and the
    two mechanism edges in this entry are annotated as having unknown intermediates for
    that reason.
  evidence:
  - reference: PMID:10391219
    reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that defects in sterol-delta8-isomerase cause CDPX2 and
      suggest a role for sterols in bone development.
    explanation: >-
      The authors' own hedged phrasing marks the gap between the established enzyme
      defect and the skeletal phenotype.
notes: >-
  Curated as a distinct dismech entry rather than folded into a lumped
  chondrodysplasia-punctata entry, because the ISDS 2023 nosology lists it as its own
  row (NOS 23-0020) with its own gene and inheritance, and because the mosaic logic that
  drives its phenotype has no counterpart in the autosomal recessive members of the same
  group. The hypomorphic-allele male phenotype is kept inside this entry and flagged as
  an open question rather than split off, since a single reported family is not a basis
  for a second entry. A member of the Chondrodysplasia_Punctata grouping.

name: X-linked Chondrodysplasia Punctata 2
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  X-linked dominant chondrodysplasia punctata type 2 (CDPX2, Conradi-Hunermann-Happle
  syndrome) is caused by heterozygous loss-of-function variants in EBP, which encodes
  the 3-beta-hydroxysteroid-delta8,delta7-isomerase (emopamil-binding protein) that
  isomerizes the double bond one step below lanosterol in post-squalene cholesterol
  biosynthesis. As in the other distal-cholesterol-pathway disorders the lesion is
  dual: cells lose the pathway end product and simultaneously accumulate the
  immediately upstream intermediates, 8(9)-cholestenol and 8-dehydrocholesterol, whose
  elevation in plasma, skin scale, or cultured cells is the biochemical signature of
  the disease. What makes CDPX2 mechanistically distinctive within its ISDS nosology
  group is not the enzymology but the fact that the phenotype is a *mosaic* readout of
  it. EBP is X-linked, so a heterozygous female is a functional mosaic of
  enzyme-competent and enzyme-deficient clones, and the disease is written onto the
  body in that clonal geometry - blaschkolinear ichthyotic scaling in the newborn that
  later resolves into linear follicular atrophoderma and scarring alopecia along the
  same lines, asymmetric rather than symmetric rhizomelic shortening, sectorial rather
  than whole-lens cataract, and side-to-side differences in epiphyseal stippling. The
  same mosaicism explains the disorder's unusual epidemiology at both extremes: at
  least 95% of live-born affected individuals are female because hemizygous males are
  usually lost in early gestation, while the affected males who do survive do so by
  being mosaic themselves (post-zygotic variants or a 47,XXY karyotype) or by carrying
  a hypomorphic allele that leaves residual isomerase activity. Because clone
  proportions vary between individuals and between body regions, the severity range is
  correspondingly enormous - from fetal demise with multiple malformations to obligate
  carrier mothers whose only finding is a strand of atrophic scalp skin, recognized
  only after a severely affected daughter is born.
synonyms:
- CDPX2
- Conradi-Hunermann-Happle syndrome
- Conradi-Hunermann syndrome
- X-linked dominant chondrodysplasia punctata
- EBP-related X-linked chondrodysplasia punctata
- EBP-CDPX

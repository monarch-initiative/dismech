  notes: >-
    EBP encodes 3-beta-hydroxysteroid-delta8,delta7-isomerase (emopamil-binding
    protein), mapped to Xp11.22-p11.23. Pathogenic variants span missense, nonsense,
    frameshift, and splice classes; the missense alleles have been shown to be
    functionally deficient by complementation in an isomerase-deficient yeast strain
    rather than inferred from prediction alone.

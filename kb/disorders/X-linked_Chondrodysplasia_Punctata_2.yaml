progression:
- phase: Neonatal period - scaling skin and stippled skeleton
  notes: >-
    The disorder is most recognizable at birth, when both of its diagnostic findings
    are present simultaneously: patterned ichthyotic scaling and radiographic
    epiphyseal stippling. Both are transient, which is why a diagnosis missed in the
    newborn period becomes markedly harder later.
  evidence:
  - reference: PMID:33147667
    reference_title: "Conradi-Hünermann-Happle syndrome: report of a novel heterozygous mutation on the emopamil-binding protein gene, c.333delC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we report a full-term newborn that presented at birth with scattered
      blaschkolinear bands of adherent scales and scalp erosions in a spiral
      distribution.
    explanation: >-
      Documents the newborn cutaneous presentation and its blaschkolinear geometry.
- phase: Infancy and childhood - scaling resolves into follicular atrophoderma
  notes: >-
    The ichthyotic scaling of the newborn gives way to linear and whorled atrophic
    patches centred on hair follicles, with coarse hair and scarring alopecia in the
    same distribution. The skin findings change character but keep the same clonal
    geometry, because the underlying mosaic is fixed.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      linear or blotchy scaling ichthyosis in the newborn; later appearance of linear
      or whorled atrophic patches involving hair follicles (follicular atrophoderma);
      coarse hair with scarring alopecia; and cataracts.
    explanation: >-
      States the sequence from newborn scaling to follicular atrophoderma and scarring
      alopecia.
- phase: Childhood to adulthood - orthopedic course
  notes: >-
    Epiphyseal stippling resolves as the epiphyses ossify, but the asymmetric limb
    shortening it accompanied does not, and scoliosis becomes the dominant orthopedic
    problem. Surveillance is therefore orthopedic and ophthalmologic rather than
    dermatologic in later life.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthopedic evaluations to monitor kyphoscoliosis, joint problems, linear growth,
      and any leg length discrepancy per orthopedist
    explanation: >-
      The recommended surveillance identifies kyphoscoliosis and leg-length discrepancy
      as the persisting skeletal problems.
- phase: Whole-lifespan severity range
  notes: >-
    CDPX2 has no single natural history. The same gene, and sometimes the same variant
    within one family, produces outcomes from fetal demise to an adult with no
    recognizable abnormality, because the phenotype is a function of the mosaic
    proportion rather than of the allele alone.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings in EBP-related X-linked chondrodysplasia punctata (EBP-CDPX) range
      from fetal demise with multiple malformations and severe growth deficiency to
      much milder manifestations, including females with no recognizable physical
      abnormalities.
    explanation: >-
      States the full severity range directly.
pathophysiology:
- name: EBP Sterol-Delta8-Isomerase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function variants in EBP abolish or reduce
    3-beta-hydroxysteroid-delta8,delta7-isomerase activity, the step that moves the
    sterol double bond from position 8 to position 7 in the conversion of lanosterol to
    cholesterol. The enzymatic assignment was made in the reverse of the usual
    direction: the sterol profile of patients was characterized first and pointed at
    the isomerase, and the candidate gene was then found mutated in every proband
    tested.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: EBP
      term:
        id: hgnc:3133
        label: EBP
    description: >-
      Heterozygous germline (or, in the surviving affected male, post-zygotic mosaic)
      loss-of-function variants. Missense alleles were shown to be functionally
      deficient by complementation in an isomerase-deficient yeast strain. Zygosity is
      recorded as heterozygous because that is the state in the affected female who
      constitutes at least 95% of live births; a hemizygous male with a null allele is
      generally not viable.
  molecular_functions:
  - preferred_term: sterol delta8-delta7 isomerase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000247
      label: C-8 sterol isomerase activity
  biological_processes:
  - preferred_term: cholesterol biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  evidence:
  - reference: PMID:10391219
    reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using SSCP analysis and sequencing of genomic DNA, we found EBP mutations in all probands."
    explanation: >-
      Establishes EBP variants as the cause in the biochemically defined patient
      cohort.
  - reference: PMID:10391219
    reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirmed the functional significance of two missense alleles by expressing
      them in a sterol-delta8-isomerase-deficient yeast strain.
    explanation: >-
      A complementation assay in an isomerase-deficient yeast strain establishes that
      the patient missense alleles are functionally deficient, not merely associated.
  downstream:
  - target: Accumulation of 8(9)-Cholestenol and 8-Dehydrocholesterol
    description: >-
      Blocking the isomerase backs up flux immediately above the block, so the two
      substrate sterols accumulate in plasma and tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10391219
      reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This pattern of accumulated cholesterol intermediates suggested a deficiency of
        3beta-hydroxysteroid-delta8,delta7-isomerase (sterol-delta8-isomerase), which
        catalyses an intermediate step in the conversion of lanosterol to cholesterol.
      explanation: >-
        Explicitly links the accumulated intermediates to the position of the enzymatic
        block.
  - target: Cellular Cholesterol Deficiency
    description: >-
      The same block starves the cell of the pathway end product. Both arms of the
      lesion operate together, which is the general pattern of the post-squalene
      cholesterol-synthesis disorders.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20929975
      reference_title: "Malformation syndromes caused by disorders of cholesterol synthesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Generally, inborn errors of cholesterol synthesis lead to both a deficiency of
        cholesterol and increased levels of potentially bioactive or toxic precursor
        sterols.
      explanation: >-
        States the dual lesion that applies to this class of disorders, of which CDPX2
        is one of the reviewed members.
- name: Accumulation of 8(9)-Cholestenol and 8-Dehydrocholesterol
  biological_scale: MOLECULAR
  description: >-
    The two sterols immediately upstream of the isomerase accumulate. Their elevation
    is both the diagnostic marker of the disease and, in the shared model for this
    disorder class, a potentially bioactive or toxic insult in its own right rather
    than an inert by-product. Because the accumulation occurs only in
    mutant-expressing clones, it is a cell-autonomous signal that tracks the mosaic.
  evidence:
  - reference: PMID:10391219
    reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found increased 8(9)-cholestenol and 8-dehydrocholesterol in tissue samples
      from seven female probands with CDPX2 (ref. 4).
    explanation: >-
      Documents the accumulated sterols in patient tissue.
  downstream:
  - target: Abnormal Cartilage Calcification and Endochondral Ossification
    description: >-
      Sterol-pathway disruption in growth-plate and epiphyseal cartilage produces the
      punctate calcification that names the disorder family.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10391219
      reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results indicate that defects in sterol-delta8-isomerase cause CDPX2 and
        suggest a role for sterols in bone development.
      explanation: >-
        The authors themselves frame the connection between the enzyme defect and bone
        development as a suggestion, which is why this edge is annotated as having
        unknown intermediates.
  - target: Epidermal Barrier and Follicular Dysfunction
    description: >-
      Keratinocytes depend on the distal cholesterol pathway for barrier lipid
      synthesis, and the mutant-expressing clones show the ichthyotic and follicular
      phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cellular Cholesterol Deficiency
  biological_scale: CELLULAR
  description: >-
    Beyond its structural membrane role, cholesterol is required for the covalent
    modification and signalling competence of hedgehog proteins, so a block in its
    synthesis has a developmental-patterning consequence that is separate from any
    toxicity of the accumulating intermediates. This is the shared explanatory route
    from a lipid-synthesis enzymopathy to a malformation syndrome across the
    post-squalene disorders.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:20929975
    reference_title: "Malformation syndromes caused by disorders of cholesterol synthesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cholesterol is also essential for the proper maturation and signaling of hedgehog
      proteins, and thus cholesterol is critical for embryonic development.
    explanation: >-
      States the hedgehog-dependence of cholesterol that connects this enzyme class to
      malformation phenotypes.
  downstream:
  - target: Abnormal Cartilage Calcification and Endochondral Ossification
    description: >-
      Hedgehog signalling governs growth-plate chondrocyte proliferation and
      differentiation, so its impairment is a plausible route from the enzyme block to
      the skeletal phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: X-Inactivation Mosaicism
  biological_scale: ORGANISM
  description: >-
    EBP is on Xp11.22-p11.23, so random X inactivation makes a heterozygous female a
    functional mosaic of enzyme-competent and enzyme-deficient clones. This node is
    what converts a uniform enzymopathy into the disorder's signature patterned,
    asymmetric phenotype, and it is also what accounts for the severity range and for
    the survival of the rare affected male. It is the mechanistic feature that most
    sharply distinguishes CDPX2 from the autosomal recessive members of the same
    skeletal nosology group, where every cell carries the same deficiency.
  biological_processes:
  - preferred_term: random X inactivation
    term:
      id: GO:0060816
      label: random inactivation of X chromosome
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Females who inherit an EBP pathogenic variant will be heterozygotes and have a
      highly variable clinical phenotype.
    explanation: >-
      Records the variability among heterozygotes that the mosaic model explains.
  - reference: PMID:24700572
    reference_title: "A novel EBP c.224T>A mutation supports the existence of a male-specific disorder independent of CDPX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These males exhibit a phenotype similar to CDPX2 due to either somatic mosaicism
      or a 47, XXY karyotype in association with a null EBP allele.
    explanation: >-
      Affected males with a null allele survive only when they are themselves mosaic,
      which is direct evidence that mosaicism rather than allele identity governs
      viability.
  downstream:
  - target: Blaschkolinear Cutaneous Phenotype
    description: >-
      Clones of mutant-expressing keratinocytes follow the embryonic migration paths of
      the epidermis, so their dysfunction is written on the skin as Blaschko lines.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33147667
      reference_title: "Conradi-Hünermann-Happle syndrome: report of a novel heterozygous mutation on the emopamil-binding protein gene, c.333delC."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Herein, we report a full-term newborn that presented at birth with scattered
        blaschkolinear bands of adherent scales and scalp erosions in a spiral
        distribution.
      explanation: >-
        The blaschkolinear and spiral distribution of the lesions is the visible
        expression of the clonal mosaic.
  - target: Asymmetric Skeletal Involvement
    description: >-
      Because the mosaic is not bilaterally symmetric, limb shortening and epiphyseal
      stippling differ between the two sides - a pattern that separates CDPX2 from the
      symmetric rhizomelic CDPs.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10391219
      reference_title: "Mutations in the gene encoding 3 beta-hydroxysteroid-delta 8, delta 7-isomerase cause X-linked dominant Conradi-Hünermann syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additionally, CDPX2 patients may have asymmetric rhizomesomelia, sectorial
        cataracts, patchy alopecia, ichthyosis and atrophoderma.
      explanation: >-
        The asymmetry of the limb shortening, the sectorial rather than total cataract,
        and the patchiness of the alopecia are all mosaic readouts listed together.
  - target: Male Hemizygous Lethality
    description: >-
      A non-mosaic hemizygous male has no enzyme-competent clones anywhere, and is
      usually lost in early gestation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21634086
      reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        EBP-CDPX is inherited in an X-linked manner with typical (but not absolute)
        early gestational male lethality.
      explanation: >-
        States the male lethality and, in the parenthesis, that it is not absolute -
        the escape routes being mosaicism and hypomorphic alleles.
- name: Abnormal Cartilage Calcification and Endochondral Ossification
  biological_scale: TISSUE
  description: >-
    Growth-plate and epiphyseal cartilage calcifies abnormally, producing punctate foci
    of calcification in the epiphyses of long bones, the vertebrae, the trachea, and
    the costal ends. The stippling is transient - it disappears as the epiphyses
    ossify - but the disordered endochondral growth it accompanies leaves permanent
    shortening and spinal deformity.
  cell_types:

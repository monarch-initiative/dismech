- Hereditary Skin Disorder
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An X-linked Mendelian disorder whose entire clinical logic - male lethality, the
      mosaic distribution of lesions, the severity range between relatives carrying the
      same allele - is genetic rather than organ-system based.
  - classification_value: DERMATOLOGY
    notes: >-
      The newborn presentation is cutaneous, and the linear ichthyosis, follicular
      atrophoderma, and scarring alopecia are the findings that persist and that most
      often bring an adult carrier to attention.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism: an enzymatic block in post-squalene
      cholesterol biosynthesis, confirmed by the plasma or tissue sterol profile.
  icimd_category:
  - classification_value: sterol_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of sterol
      metabolism" under category "Disorders of lipid metabolism". EBP is the
      sterol-delta8-isomerase of the distal cholesterol pathway, placing CDPX2 with
      CHILD syndrome, Smith-Lemli-Opitz syndrome, and the other post-squalene defects
      rather than with the peroxisomal members of its skeletal nosology group.
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0020 "CDP, X-linked dominant, EBP-related (Conradi-Hunermann type; CDPX2)"
      (MIM 302960). Carried forward from the 2019 revision (Mortier et al.,
      PMID:31633310), where the group was numbered 21. Exactly one group is assigned:
      the nosology lists each entity once, and CDPX2's sterol-pathway biology - shared
      with CHILD syndrome and Greenberg dysplasia, which sit in the same group, but
      also with Smith-Lemli-Opitz syndrome, which is not a nosology entity at all - is
      handled by the table's cross-references, not by dual membership.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The dismech entry and the MONDO class denote the same entity: EBP-related
      X-linked dominant chondrodysplasia punctata. The entry additionally discusses
      the hypomorphic-allele male phenotype, which some authors argue is a distinct
      X-linked recessive entity; that is recorded as a discussion rather than folded
      into the mapping.

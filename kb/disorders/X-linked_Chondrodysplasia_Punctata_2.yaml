      id: GO:0051216
      label: cartilage development
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      chondrodysplasia punctata (stippling of the epiphyses of the long bones,
      vertebrae, trachea, and distal ends of the ribs)
    explanation: >-
      Enumerates the sites of punctate calcification, which is wider than the epiphyses
      alone.
  downstream:
  - target: Epiphyseal Stippling
    causal_link_type: DIRECT
    description: Punctate calcification in cartilage is the defining radiographic finding.
  - target: Coronal Cleft Vertebrae
    causal_link_type: DIRECT
    description: Vertebral cartilage involvement produces coronal clefting of the vertebral bodies.
  - target: Scoliosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Asymmetric vertebral growth following disordered endochondral ossification.
    description: >-
      Spinal deformity develops out of the disordered and asymmetric vertebral growth
      and is the orthopedic problem that persists after the stippling resolves.
  - target: Short Stature
    causal_link_type: DIRECT
    description: Disordered endochondral growth limits linear growth.
- name: Asymmetric Skeletal Involvement
  biological_scale: ORGANISM
  description: >-
    Rhizomelic (proximal) limb shortening in CDPX2 is characteristically unequal
    between the two sides, giving leg-length discrepancy as well as short stature. The
    asymmetry is not incidental - it is the skeletal expression of the same clonal
    mosaic that patterns the skin.
  evidence:
  - reference: PMID:21634086
    reference_title: "EBP-Related X-Linked Chondrodysplasia Punctata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often asymmetric rhizomelic shortening of limbs"
    explanation: >-
      States that the rhizomelic shortening is characteristically asymmetric.
  downstream:
  - target: Rhizomelic Limb Shortening
    causal_link_type: DIRECT
    description: Proximal limb segments are disproportionately short.
  - target: Asymmetric Growth
    causal_link_type: DIRECT
    description: The unequal involvement of the two sides produces measurable asymmetry and leg-length discrepancy.

discussions:
- discussion_id: gap_bladder_urobiome_intravesical_immunotherapy_response
  prompt: >-
    Does the urinary microbiome (urobiome) causally modulate response to
    intravesical BCG immunotherapy, or does the reported responder versus
    non-responder difference in urinary bacterial composition simply track
    tumor burden, repeated instrumentation, and antibiotic history? Bladder
    cancer is the one urological cancer whose standard immunotherapy is
    instilled directly into a colonized compartment, yet this entry models
    immune resistance entirely as a tumor-intrinsic, PD-L1-mediated process
    with no microbial input.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adaptive Immune Resistance and PD-L1-Mediated Immune Evasion
  - treatments#Intravesical Therapy
  rationale: >-
    Roughly 30-50% of patients fail intravesical BCG, and this entry currently
    offers no mechanism for that failure beyond the checkpoint axis it shares
    with systemic immunotherapy. A candidate local mechanism exists: 16S
    profiling of catheterized urine distinguishes BCG responders from
    non-responders, with two Bifidobacterium species enriched among responders
    and associated with longer recurrence-free survival. That observation is
    correlative, resting on a post-treatment comparison of 39 BCG responders
    against 19 non-responders within a single 58-patient bladder cancer cohort
    (the study's 87 participants include 29 benign-prostatic-hyperplasia
    controls), and its direction of causation
    is unestablished - a urobiome difference could shape the mucosal immune
    response to instilled BCG, or could be a downstream marker of tumor burden,
    repeated instrumentation, or antibiotic exposure. The cross-disease review
    that prompted this discussion frames the same problem at field level: local
    and systemic communities are proposed to act by different routes, with
    gut-derived metabolites enhancing systemic immunotherapy while the local
    urobiome may interfere with intravesical treatment, and the primary barrier
    to resolving either is a lack of methodological standardization that
    generates observational inconsistency and blocks causal inference. Curating
    a urobiome node upstream of intravesical treatment failure would therefore
    over-assert what is known; recording the gap keeps the candidate mechanism
    visible without committing the pathograph to it.
  proposed_experiments:
  - experiment_id: exp_bladder_urobiome_bcg_response_prospective
    name: Prospective multicenter urobiome-stratified BCG response cohort with harmonized sampling
    description: >-
      Enrol BCG-naive intermediate- and high-risk non-muscle-invasive bladder
      cancer patients across multiple centers under a prespecified, harmonized
      collection protocol (catheterized specimen, documented antibiotic washout,
      negative urine culture) and profile the urobiome by shotgun metagenomics
      plus urinary metabolomics before induction, during maintenance, and at
      recurrence. Model recurrence-free survival on baseline community features
      while adjusting for tumor burden, prior instrumentation, and antibiotic
      exposure, and test whether any baseline feature predicts response
      out-of-sample in a held-out center.
    experiment_type:
      preferred_term: prospective multicenter observational cohort study
    readouts:
    - name: Baseline urobiome feature predicting BCG failure
      target: pathophysiology#Adaptive Immune Resistance and PD-L1-Mediated Immune Evasion
      description: >-
        Out-of-sample discrimination of BCG non-response by a prespecified
        baseline urinary community or metabolite feature, after adjustment for
        tumor burden, instrumentation, and antibiotic exposure.
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: untargeted urinary metabolomics
    - name: Bladder mucosal immune infiltrate after BCG
      target: pathophysiology#Adaptive Immune Resistance and PD-L1-Mediated Immune Evasion
      description: >-
        Density and phenotype of the mucosal T cell and myeloid infiltrate in
        post-BCG biopsies, compared between urobiome strata, to test whether a
        community difference is accompanied by a local immune difference.
      assays:
      - preferred_term: multiplex immunofluorescence
    decision_criterion: >-
      A urobiome input to intravesical treatment failure is supported if a
      prespecified baseline feature predicts non-response in a held-out center
      under a harmonized protocol AND that feature tracks with a measurable
      difference in the mucosal immune infiltrate. It is not supported if the
      association collapses after adjustment for tumor burden, instrumentation,
      and antibiotic exposure, or fails to replicate across centers - the
      outcome the standardization critique predicts.
    would_support:
    - pathophysiology#Adaptive Immune Resistance and PD-L1-Mediated Immune Evasion
  evidence:
  - reference: PMID:39456941
    reference_title: "Differential Urinary Microbiome and Its Metabolic Footprint in Bladder Cancer Patients Following BCG Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intravesical bacillus Calmette-Guérin (BCG) therapy is the preferred
      treatment for intermediate to high-risk non-muscle-invasive bladder cancer
      (BCa), although resistance occurs in 30-50% of cases.
    explanation: >-
      Quantifies the unexplained treatment-failure fraction that motivates
      looking for a local microbial contribution to intravesical therapy
      response.
  - reference: PMID:39456941
    reference_title: "Differential Urinary Microbiome and Its Metabolic Footprint in Bladder Cancer Patients Following BCG Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Responders to BCG had differing microbial compositions and higher
      quinolone synthesis than non-responders, with two Bifidobacterium species
      being prevalent among responders, associated with prolonged
      recurrence-free survival.
    explanation: >-
      The correlative human observation that makes a urobiome contribution
      plausible. It is an association in a single cohort with no interventional
      arm, which is precisely what leaves the causal question open.
  - reference: PMID:42426614
    reference_title: "Microbiota-mediated modulation of the tumor microenvironment in urological cancers: crosstalk between gut and intratumoral microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Furthermore, systemic and local communities may interact, wherein
      gut-derived metabolites can enhance systemic immunotherapy, while the
      local urobiome may interfere with intravesical treatment efficacy.
    explanation: >-
      Review-level synthesis distinguishing the local (urobiome/intravesical)
      route from the systemic (gut/checkpoint-inhibitor) route, which is why
      this gap is recorded separately from the checkpoint-response gap curated
      on the metastatic renal cell carcinoma entry.
  - reference: PMID:42426614
    reference_title: "Microbiota-mediated modulation of the tumor microenvironment in urological cancers: crosstalk between gut and intratumoral microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A primary challenge is the lack of methodological standardization, which
      generates observational inconsistencies and complicates causal inference.
    explanation: >-
      States the methodological barrier that keeps this gap open, and is the
      reason the proposed experiment is specified around a harmonized
      multicenter protocol rather than another single-center cohort.
  notes: >-
    Recorded from monarch-initiative/dismech#6383. The two PMID:42426614 items
    carry `evidence_source: OTHER` because that publication is a narrative
    review making a field-level synthesis claim rather than reporting primary
    data; monarch-initiative/dismech#8184 tracks the open policy question on how
    review articles should be classified.

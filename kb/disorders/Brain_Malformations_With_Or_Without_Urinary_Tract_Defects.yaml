notes: >-
  Also known as NFIA-related disorder and, historically, chromosome 1p32-p31
  deletion syndrome (OMIM 613735). NFIA haploinsufficiency is the single common
  genetic lesion; contiguous-gene deletions, NFIA-disrupting translocations and
  intragenic loss-of-function variants all converge on it. A GeneReviews chapter
  exists (PMID:31194316, "NFIA-Related Disorder") and is tagged as the phenotype
  baseline.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    NFIA-related disorder is an autosomal dominant condition; most causative
    variants arise de novo (approximately 75%-80%), with rare transmission from
    an affected parent. Each child of an affected individual has a 50% chance of
    inheriting the causative genetic alteration.
  evidence:
  - reference: PMID:31194316
    reference_title: "NFIA-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NFIA-related disorder is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the autosomal dominant mode of inheritance.
  - reference: PMID:31194316
    reference_title: "NFIA-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The proportion of NFIA-related disorder caused by de novo variants is approximately 75%-80%."
    explanation: GeneReviews quantifies the high proportion of de novo variants.
  - reference: PMID:31194316
    reference_title: "NFIA-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Each child of an individual with NFIA-related disorder has a 50% chance of inheriting the causative genetic alteration."
    explanation: GeneReviews states the 50% transmission risk expected for an autosomal dominant condition.

genetic:
- name: NFIA
  gene_term:
    preferred_term: NFIA
    term:
      id: hgnc:7784
      label: NFIA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NFIA (nuclear factor I/A) encodes a nuclear factor I family transcription
    factor on 1p31.3. The disorder results from NFIA haploinsufficiency
    (loss of function), reached by any of three lesion classes: a heterozygous
    intragenic pathogenic variant (nonsense, frameshift, or defective missense),
    a 1p31.3 deletion removing part or all of NFIA, or a balanced
    translocation/rearrangement with a 1p31.3 breakpoint that disrupts NFIA.
    NFIA is the gene whose loss reproduces the shared phenotype across these
    architectures. Recurrent missense alleles (p.Lys125Glu, p.Thr395Met) have
    been shown by cross-species rescue assays to be loss-of-function.
  evidence:
  - reference: PMID:17530927
    reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the only common genetic defect is NFIA haploinsufficiency"
    explanation: >-
      The founding five-patient study established NFIA haploinsufficiency as the
      single genetic defect shared across translocation and deletion cases.
  - reference: PMID:28941020
    reference_title: "Loss-of-function variants in NFIA provide further support that NFIA is a critical gene in 1p32-p31 deletion syndrome: A four patient series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe four patients with loss-of-function variants in the NFIA gene identified through WES."
    explanation: >-
      Intragenic loss-of-function variants reproduce the phenotype, supporting a
      haploinsufficiency (loss-of-function) mechanism.
  - reference: PMID:31194316
    reference_title: "NFIA-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a heterozygous intragenic NFIA pathogenic variant; a heterozygous deletion of the 1p31.3 region that includes part or all of NFIA with surrounding genes intact; or a chromosome translocation/other rearrangement with a 1p31.3 breakpoint that disrupts NFIA"
    explanation: GeneReviews enumerates the three lesion classes that cause NFIA haploinsufficiency.
  - reference: PMID:33973697
    reference_title: "Recurrent NFIA K125E substitution represents a loss-of-function allele: Sensitive in vitro and in vivo assays for nontruncating alleles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we document two unrelated patients with typical phenotypic features of the NFIA-related disorder who shared a missense variant p.Lys125Glu (K125E) in the NFIA gene."
    explanation: >-
      Documents that an intragenic missense variant produces the typical
      NFIA-related disorder phenotype, supporting the defective-missense lesion class.
  - reference: PMID:35018717
    reference_title: The p.Thr395Met missense variant of NFIA found in a patient with intellectual disability is a defective variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Impairment of the commissural neurons in nfia-/- zebrafish embryos could be restored by the expression of wild-type human NFIA protein, but not of mutant human protein harboring the p.Thr395Met substitution, indicating that this variant affects the function of NFIA protein."
    explanation: >-
      Zebrafish rescue shows the p.Thr395Met missense allele is functionally
      defective, supporting loss of function as the missense mechanism.


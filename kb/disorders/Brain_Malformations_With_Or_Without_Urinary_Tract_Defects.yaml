pathophysiology:
- name: NFIA Haploinsufficiency
  description: >-
    A single functional copy of NFIA is insufficient for normal development.
    Loss of one allele arises through 1p31.3 deletion, NFIA-disrupting
    translocation, or intragenic loss-of-function variant.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: NFIA
    term:
      id: hgnc:7784
      label: NFIA
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  downstream:
  - target: Reduced NFIA-Dependent Transcriptional Regulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17530927
      reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the only common genetic defect is NFIA haploinsufficiency"
      explanation: Haploinsufficiency reduces the dose of the NFIA transcription factor.
  evidence:
  - reference: PMID:17530927
    reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the only common genetic defect is NFIA haploinsufficiency"
    explanation: Establishes NFIA haploinsufficiency as the initiating lesion.

- name: Reduced NFIA-Dependent Transcriptional Regulation
  description: >-
    NFIA is a sequence-specific DNA-binding transcription factor of the nuclear
    factor I family; its MH1 domain binds a nucleotide consensus in target
    promoters and the CTF_NFI domain regulates transcription. A reduced dose
    lowers NFIA-dependent transcriptional output at target genes governing CNS
    and urinary-tract development.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  downstream:
  - target: Impaired Neurogenesis-to-Gliogenesis Transition
    causal_link_type: DIRECT
  - target: Disrupted Ureteric and Metanephric Development
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36553517
    reference_title: "Phenotypic Spectrum of NFIA Haploinsufficiency: Two Additional Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The MH1 domain binds to a nucleotide consensus sequence within the promoter region of several genes, whereas the CTF_NFI domain activates basal transcription factors at transcription start sites by displacing repressive histones from target genes and interacting with other coactivator proteins"
    explanation: Describes NFIA's biochemical transcription-factor function whose dose is reduced.
  - reference: PMID:35018717
    reference_title: The p.Thr395Met missense variant of NFIA found in a patient with intellectual disability is a defective variant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Nuclear factor one A (NFIA) is a transcription factor that regulates the development of the central nervous system."
    explanation: Identifies NFIA as a CNS-developmental transcription factor (background framing in the cited paper).

- name: Impaired Neurogenesis-to-Gliogenesis Transition
  description: >-
    NFIA is necessary and sufficient to initiate gliogenesis in ventricular-zone
    progenitors and to maintain inhibition of neurogenesis; reduced NFIA impairs
    the switch from neurogenesis to gliogenesis and the migration/differentiation
    of astrocyte precursors that build CNS midline and ependymal structures. The
    causal links from this cellular defect to the corpus callosum and
    cerebrospinal fluid phenotypes are inferred from model-organism data
    (spinal-cord gliogenesis and Nfia-knockout callosal agenesis); direct human
    midline-glia evidence is limited.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: glial cell differentiation
    modifier: DECREASED
    term:
      id: GO:0010001
      label: glial cell differentiation
  - preferred_term: astrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0048708
      label: astrocyte differentiation
  downstream:
  - target: Defective Corpus Callosum Development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired Cerebrospinal Fluid Homeostasis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17178400
    reference_title: The transcription factor NFIA controls the onset of gliogenesis in the developing spinal cord.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NFIA is both necessary and sufficient for GLAST induction in the VZ."
    explanation: >-
      NFIA is required to initiate gliogenesis in ventricular-zone progenitors in
      the developing spinal cord.
  - reference: PMID:17178400
    reference_title: The transcription factor NFIA controls the onset of gliogenesis in the developing spinal cord.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At later stages, NFIA promotes migration and differentiation of astrocyte precursors, a function that is antagonized in oligodendrocyte precursors by Olig2."
    explanation: NFIA drives astrocyte precursor migration and differentiation.

- name: Defective Corpus Callosum Development
  description: >-
    NFI-dependent programs of glial differentiation, axon outgrowth and midline
    guidance are required to build the corpus callosum and other commissures;
    their disruption yields a thin, hypoplastic, or absent corpus callosum.
    Nfia-null mice and nfia-null zebrafish show callosal agenesis and loss of
    commissural axons, respectively.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: corpus callosum development
    modifier: ABNORMAL
    term:
      id: GO:0022038
      label: corpus callosum development
  - preferred_term: axon guidance
    modifier: ABNORMAL
    term:
      id: GO:0007411
      label: axon guidance
  downstream:
  - target: Agenesis of the corpus callosum
    causal_link_type: DIRECT
  - target: Hypoplasia of the corpus callosum
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35018717
    reference_title: The p.Thr395Met missense variant of NFIA found in a patient with intellectual disability is a defective variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "nfia-/- zebrafish initially showed a loss of commissural axons in the brain"
    explanation: Loss of nfia impairs commissural (midline-crossing) axons in a model organism.
  - reference: PMID:36553517
    reference_title: "Phenotypic Spectrum of NFIA Haploinsufficiency: Two Additional Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nfia knock-out mice show hydrocephalus and agenesis of the corpus callosum"
    explanation: Nfia loss causes agenesis of the corpus callosum in mice (recounted in a literature review).

- name: Impaired Cerebrospinal Fluid Homeostasis
  description: >-
    Reduced NFIA disrupts cerebrospinal fluid homeostasis, producing
    hydrocephalus and ventriculomegaly; hydrocephalus is a consistent finding in
    Nfia-knockout mice.
  biological_scale: ORGANISM
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
  - target: Ventriculomegaly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36553517
    reference_title: "Phenotypic Spectrum of NFIA Haploinsufficiency: Two Additional Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nfia knock-out mice show hydrocephalus and agenesis of the corpus callosum"
    explanation: Nfia loss produces hydrocephalus in mice (recounted in a literature review), modelling the CSF phenotype.
  - reference: PMID:17530927
    reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five individuals exhibit similar CNS malformations consisting of a thin, hypoplastic, or absent corpus callosum, and hydrocephalus or ventriculomegaly."
    explanation: Hydrocephalus or ventriculomegaly was present in all founding patients.

- name: Disrupted Ureteric and Metanephric Development
  description: >-
    Nfia is expressed in the developing ureter and metanephric mesenchyme and is
    required in a dosage-sensitive manner for ureteral and renal development; its
    loss produces abnormalities of the ureteropelvic and ureterovesical junctions
    with vesicoureteral reflux and secondary hydronephrosis. Urinary involvement
    is incompletely penetrant, hence "with or without" urinary tract defects.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: ureteric bud development
    modifier: ABNORMAL
    term:
      id: GO:0001657
      label: ureteric bud development
  - preferred_term: metanephros development
    modifier: ABNORMAL
    term:
      id: GO:0001656
      label: metanephros development
  downstream:
  - target: Vesicoureteral reflux
    causal_link_type: DIRECT
  - target: Hydronephrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17530927
    reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nfia is expressed in the developing ureter and metanephric mesenchyme, and Nfia(+/-) and Nfia(-/-) mice exhibit abnormalities of the ureteropelvic and ureterovesical junctions, as well as bifid and megaureter."
    explanation: Establishes the dosage-sensitive ureteric/metanephric mechanism of the urinary defects.
  - reference: PMID:17530927
    reference_title: "NFIA haploinsufficiency is associated with a CNS malformation syndrome and urinary tract defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nfia is also required in a dosage-sensitive manner for ureteral and renal development"
    explanation: Demonstrates the dosage sensitivity that makes haploinsufficiency sufficient for urinary defects.


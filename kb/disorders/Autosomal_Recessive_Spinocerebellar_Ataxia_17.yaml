diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: exome/panel sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    SCAR17 is diagnosed by exome or gene-panel sequencing identifying biallelic
    CWF19L1 variants, together with MRI showing cerebellar hypoplasia and/or
    progressive atrophy.
  evidence:
  - reference: PMID:27016154
    reference_title: "Exome sequencing reveals a novel CWF19L1 mutation associated with intellectual disability and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by a combination of linkage analysis and Whole Exome Sequencing"
    explanation: >-
      Affected individuals are identified by exome sequencing of CWF19L1.

genetic:
- name: CWF19L1
  gene_term:
    preferred_term: CWF19L1
    term:
      id: hgnc:25613
      label: CWF19L1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic CWF19L1 variants cause SCAR17. Reported alleles include splice-site
    (c.964+1G>A), frameshift (c.467delC, p.P156Hfs*33), nonsense (p.K316*) and
    damaging missense (p.D13H, p.Asp132Gly) variants, all consistent with loss of
    function. The disorder is rare (a few dozen cases). ClinGen's Cerebellar
    Ataxia Gene Curation Expert Panel classifies CWF19L1 as Definitive, but for
    the broader class "autosomal recessive cerebellar ataxia" (MONDO:0015244;
    CGGV:assertion_6ebc1a4b-1a41-40df-832f-904cd4bb88f9-2025-05-14T160000.000Z),
    not for the SCAR17 term (MONDO:0014503) specifically, so it is not recorded
    here as a gene_disease_validity assertion on this entry; the relationship
    rests on multiple unrelated biallelic families plus a zebrafish model.
  variants:
  - name: c.964+1G>A
    description: >-
      Homozygous invariant +1 splice-donor variant in intron 9 causing exon
      skipping and protein loss; the founding allele in a consanguineous Turkish
      family.
    evidence:
    - reference: PMID:25361784
      reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron 9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene."
      explanation: Reports the founding homozygous splice variant.
  - name: p.D13H / p.K316*
    description: >-
      Compound-heterozygous missense (c.37G>C, p.D13H) and nonsense
      (c.946A>T, p.K316*) variants in a non-consanguineous Dutch patient.
    evidence:
    - reference: PMID:26197978
      reference_title: "Pathogenic CWF19L1 variants as a novel cause of autosomal recessive cerebellar ataxia and atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing of a girl with ARCA from non-consanguineous Dutch parents revealed two pathogenic variants c.37G>C; p.D13H and c.946A>T; p.K316* in CWF19L1, a gene with an unknown function, recently reported to cause ARCA in a Turkish family."
      explanation: Reports the compound-heterozygous variants confirming the gene.
  - name: c.467delC (p.P156Hfs*33)
    description: >-
      Homozygous frameshift variant with absent protein in patient lymphoblastoid
      cell lines.
    evidence:
    - reference: PMID:27016154
      reference_title: "Exome sequencing reveals a novel CWF19L1 mutation associated with intellectual disability and cerebellar atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous frameshift mutation in CWF19L1 (c.467delC; p.(P156Hfs*33)) by a combination of linkage analysis and Whole Exome Sequencing in a consanguineous Turkish family with a 9-year-old boy affected by early onset cerebellar ataxia and mild ID."
      explanation: Reports a homozygous frameshift allele.
  - name: p.Asp132Gly
    description: >-
      Homozygous missense variant (c.395A>G) in two sisters with late-onset
      cerebellar ataxia and epilepsy, widening the reported onset age.
    evidence:
    - reference: PMID:33012273
      reference_title: "A Novel Variant in CWF19L1 Gene in a Family with Late-Onset Autosomal Recessive Cerebellar Ataxia 17."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WES revealed a homozygous missense variant in CWF19-like protein 1; CWF19L1 gene c.395A>G; p.(Asp132Gly) (RefSeq NM_018294.4)."
      explanation: Reports a novel homozygous missense allele in a late-onset family.
  evidence:
  - reference: PMID:26197978
    reference_title: "Pathogenic CWF19L1 variants as a novel cause of autosomal recessive cerebellar ataxia and atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data confirm CWF19L1 as a novel but rare gene causing ARCA."
    explanation: >-
      Independent confirmation of CWF19L1 as the causative gene.

notes: >-
  SCAR17 is a rare autosomal recessive early-onset cerebellar ataxia; the
  expanded spectrum (PMID:36453471) includes developmental and epileptic
  encephalopathy with intellectual disability in childhood followed by
  progressive ataxia and extrapyramidal movement disorders in adolescence, and
  later-onset cases with epilepsy have since been reported (PMID:33012273).
  CWF19L1 is named for its homology to the Cwf19/CDC5L-complex spliceosome
  protein, but its specific molecular function is unknown, so no GO molecular
  function is bound. In the current KB, SCAR17 is also named as a differential
  diagnosis in Autosomal_Recessive_Spinocerebellar_Ataxia_15.yaml; a cross-link
  update to that entry is left to a separate change.


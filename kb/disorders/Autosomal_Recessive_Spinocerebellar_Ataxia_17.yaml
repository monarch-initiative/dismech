name: Autosomal Recessive Spinocerebellar Ataxia 17
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
synonyms:
- SCAR17
- CWF19L1-related cerebellar ataxia
- CWF19L1-related disorder
disease_term:
  preferred_term: autosomal recessive spinocerebellar ataxia 17
  term:
    id: MONDO:0014503
    label: autosomal recessive spinocerebellar ataxia 17
parents:
- Autosomal recessive cerebellar ataxia

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CWF19L1 variants cause the disorder: affected individuals are
    homozygous (consanguineous families) or compound heterozygous, with
    unaffected heterozygous parents.
  evidence:
  - reference: PMID:26197978
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing showed that the c.37G>C variant was inherited from the father and the c.946A>T variant from the mother."
    explanation: >-
      Biallelic inheritance of two CWF19L1 variants from each unaffected parent
      establishes autosomal recessive inheritance.

pathophysiology:
- name: CWF19L1 Loss of Function
  description: >-
    Biallelic loss-of-function variants in CWF19L1 (splice-site, frameshift, and
    nonsense alleles, as well as damaging missense alleles) abolish or reduce the
    protein. The normal biological function of the evolutionarily highly
    conserved CWF19L1 protein is unknown; its name reflects homology to the
    yeast Cwf19 spliceosome-associated protein (complexed with cdc5), but a
    specific molecular function has not been established, so none is asserted
    here.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CWF19L1
    term:
      id: hgnc:25613
      label: CWF19L1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Cerebellar Developmental Failure and Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25361784
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Morpholino-mediated knockdown in a zebrafish model demonstrates that loss of the evolutionarily highly conserved CWF19L1, whose normal biological function is unknown, alters cerebellar morphology and causes movement abnormalities."
      explanation: >-
        A zebrafish model links CWF19L1 loss to abnormal cerebellar morphology
        and movement, supporting the edge from gene loss to the cerebellar
        phenotype.
  evidence:
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron 9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene."
    explanation: >-
      Identifies a homozygous CWF19L1 splice variant as the cause in the index
      family.
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation causes exon skipping, reduction in messenger RNA levels, and protein loss in cell lines of affected individuals."
    explanation: >-
      Demonstrates the variant is loss-of-function at the mRNA and protein level
      in patient cell lines.

- name: Cerebellar Developmental Failure and Degeneration
  description: >-
    The cerebellum is both maldeveloped (vermis and hemispheric hypoplasia) and
    progressively degenerates (cerebellar atrophy on serial imaging), the
    structural basis of the ataxia.
  biological_scale: TISSUE
  downstream:
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27016154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial MRI showed mildly progressive cerebellar atrophy."
    explanation: >-
      Documents progressive cerebellar atrophy as the degenerative component.
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI demonstrated hypoplasia in the vermis and cerebellar hemispheres"
    explanation: >-
      Documents the cerebellar developmental (hypoplastic) component.

phenotypes:
- name: Cerebellar ataxia
  category: Neurologic
  description: >-
    Early-onset, often congenital, truncal and extremity cerebellar ataxia;
    nonprogressive in the index family and progressive in later-reported cases.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are affected with hypotonia, developmental delay, mental retardation, and nonprogressive truncal and extremity ataxia"
    explanation: >-
      Describes the ataxia in affected individuals.

- name: Cerebellar atrophy
  category: Imaging
  description: >-
    Mildly progressive cerebellar atrophy on serial MRI.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  evidence:
  - reference: PMID:27016154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial MRI showed mildly progressive cerebellar atrophy."
    explanation: >-
      Reports progressive cerebellar atrophy.

- name: Cerebellar vermis hypoplasia
  category: Imaging
  description: >-
    Hypoplasia of the cerebellar vermis and hemispheres.
  phenotype_term:
    preferred_term: Cerebellar vermis hypoplasia
    term:
      id: HP:0001320
      label: Cerebellar vermis hypoplasia
  evidence:
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI demonstrated hypoplasia in the vermis and cerebellar hemispheres"
    explanation: >-
      Reports cerebellar vermis and hemispheric hypoplasia.

- name: Intellectual disability
  category: Neurologic
  description: >-
    Intellectual disability, ranging from mild to more severe, accompanies the
    ataxia.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:27016154
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 9-year-old boy affected by early onset cerebellar ataxia and mild ID"
    explanation: >-
      Reports intellectual disability with the ataxia.

- name: Global developmental delay
  category: Neurologic
  description: >-
    Global developmental delay, from mild to profound, is part of the spectrum.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:36453471
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum was broad, including mild to profound global developmental delay"
    explanation: >-
      Reports global developmental delay across the cohort.

- name: Hypotonia
  category: Neurologic
  description: >-
    Hypotonia reported in affected individuals.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:25361784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are affected with hypotonia, developmental delay, mental retardation, and nonprogressive truncal and extremity ataxia"
    explanation: >-
      Reports hypotonia in affected individuals.

- name: Seizures
  category: Neurologic
  description: >-
    Early-onset epilepsy, sometimes treatment-resistant, in a subset of patients
    (part of the expanded phenotypic spectrum).
  phenotype_term:
    preferred_term: Seizures
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:36453471
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "childhood-onset ataxia and cerebellar atrophy; and early-onset epilepsy"
    explanation: >-
      Reports early-onset epilepsy as part of the phenotypic spectrum.

genetic:
- name: CWF19L1
  gene_term:
    preferred_term: CWF19L1
    term:
      id: hgnc:25613
      label: CWF19L1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic CWF19L1 variants cause SCAR17. Reported alleles include splice-site
    (c.964+1G>A), frameshift (c.467delC, p.P156Hfs*33), nonsense (p.K316*) and
    damaging missense (p.D13H) variants, all consistent with loss of function.
    The disorder is rare (a few dozen cases). No ClinGen gene-disease validity
    assertion is recorded for this entity; the relationship rests on multiple
    unrelated biallelic families plus a zebrafish model.
  variants:
  - name: c.964+1G>A
    description: >-
      Homozygous invariant +1 splice-donor variant in intron 9 causing exon
      skipping and protein loss; the founding allele in a consanguineous Turkish
      family.
    evidence:
    - reference: PMID:25361784
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron 9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene."
      explanation: Reports the founding homozygous splice variant.
  - name: p.D13H / p.K316*
    description: >-
      Compound-heterozygous missense (c.37G>C, p.D13H) and nonsense
      (c.946A>T, p.K316*) variants in a non-consanguineous Dutch patient.
    evidence:
    - reference: PMID:26197978
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing of a girl with ARCA from non-consanguineous Dutch parents revealed two pathogenic variants c.37G>C; p.D13H and c.946A>T; p.K316* in CWF19L1, a gene with an unknown function, recently reported to cause ARCA in a Turkish family."
      explanation: Reports the compound-heterozygous variants confirming the gene.
  - name: c.467delC (p.P156Hfs*33)
    description: >-
      Homozygous frameshift variant with absent protein in patient lymphoblastoid
      cell lines.
    evidence:
    - reference: PMID:27016154
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous frameshift mutation in CWF19L1 (c.467delC; p.(P156Hfs*33)) by a combination of linkage analysis and Whole Exome Sequencing in a consanguineous Turkish family with a 9-year-old boy affected by early onset cerebellar ataxia and mild ID."
      explanation: Reports a homozygous frameshift allele.
  evidence:
  - reference: PMID:26197978
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data confirm CWF19L1 as a novel but rare gene causing ARCA."
    explanation: >-
      Independent confirmation of CWF19L1 as the causative gene.

notes: >-
  SCAR17 is a rare autosomal recessive early-onset cerebellar ataxia; the
  expanded spectrum (PMID:36453471) includes developmental and epileptic
  encephalopathy with intellectual disability in childhood followed by
  progressive ataxia and extrapyramidal movement disorders in adolescence.
  CWF19L1 is named for its homology to the Cwf19/CDC5L-complex spliceosome
  protein, but its specific molecular function is unknown, so no GO molecular
  function is bound. In the current KB, SCAR17 is also named as a differential
  diagnosis in Autosomal_Recessive_Spinocerebellar_Ataxia_15.yaml; a cross-link
  update to that entry is left to a separate change.

references:
- reference: PMID:25361784
  title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."

      label: Ataxia
  evidence:
  - reference: PMID:25361784
    reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are affected with hypotonia, developmental delay, mental retardation, and nonprogressive truncal and extremity ataxia"
    explanation: >-
      Describes the ataxia in affected individuals.


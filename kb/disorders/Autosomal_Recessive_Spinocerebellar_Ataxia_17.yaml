notes: >-
  SCAR17 is a rare autosomal recessive early-onset cerebellar ataxia; the
  expanded spectrum (PMID:36453471) includes developmental and epileptic
  encephalopathy with intellectual disability in childhood followed by
  progressive ataxia and extrapyramidal movement disorders in adolescence, and
  later-onset cases with epilepsy have since been reported (PMID:33012273).
  CWF19L1 is named for its homology to the Cwf19/CDC5L-complex spliceosome
  protein, but its specific molecular function in humans is unverified, so no
  GO molecular function, biological process, or subcellular localization is
  bound on the CWF19L1 Loss of Function node. Seizures, extrapyramidal movement
  disorder, and developmental regression are intentionally left without causal
  incoming edges from cerebellar nodes because PMID:33012273 postulates
  widespread neuraxis involvement beyond the cerebellum whose mechanism remains
  uncharacterized. In the current KB, SCAR17 is also named as a differential
  diagnosis in Autosomal_Recessive_Spinocerebellar_Ataxia_15.yaml; a cross-link
  update to that entry is left to a separate change.


name: Autosomal Recessive Spinocerebellar Ataxia 17
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
synonyms:
- SCAR17
- CWF19L1-related cerebellar ataxia
- CWF19L1-related disorder
disease_term:
  preferred_term: autosomal recessive spinocerebellar ataxia 17
  term:
    id: MONDO:0014503
    label: autosomal recessive spinocerebellar ataxia 17
parents:
- Autosomal recessive cerebellar ataxia

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CWF19L1 variants cause the disorder: affected individuals are
    homozygous (consanguineous families) or compound heterozygous, with
    unaffected heterozygous parents.
  evidence:
  - reference: PMID:26197978
    reference_title: "Pathogenic CWF19L1 variants as a novel cause of autosomal recessive cerebellar ataxia and atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing showed that the c.37G>C variant was inherited from the father and the c.946A>T variant from the mother."
    explanation: >-
      Biallelic inheritance of two CWF19L1 variants from each unaffected parent
      establishes autosomal recessive inheritance.

pathophysiology:
- name: CWF19L1 Loss of Function
  description: >-
    Biallelic loss-of-function variants in CWF19L1 (splice-site, frameshift, and
    nonsense alleles, as well as damaging missense alleles) abolish or reduce the
    protein. The normal biological function of the evolutionarily highly
    conserved CWF19L1 protein is unknown; its name reflects homology to the
    yeast Cwf19 spliceosome-associated protein (complexed with cdc5), but a
    specific molecular function has not been established, so none is asserted
    here.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CWF19L1
    term:
      id: hgnc:25613
      label: CWF19L1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Cerebellar Hypoplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25361784
      reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Morpholino-mediated knockdown in a zebrafish model demonstrates that loss of the evolutionarily highly conserved CWF19L1, whose normal biological function is unknown, alters cerebellar morphology and causes movement abnormalities."
      explanation: >-
        A zebrafish model links CWF19L1 loss to abnormal cerebellar morphology,
        supporting the edge from gene loss to maldevelopment of the cerebellum.
  - target: Progressive Cerebellar Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25361784
    reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron 9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene."
    explanation: >-
      Identifies a homozygous CWF19L1 splice variant as the cause in the index
      family.
  - reference: PMID:25361784
    reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation causes exon skipping, reduction in messenger RNA levels, and protein loss in cell lines of affected individuals."
    explanation: >-
      Demonstrates the variant is loss-of-function at the mRNA and protein level
      in patient cell lines.

- name: Cerebellar Hypoplasia
  description: >-
    The cerebellum is maldeveloped, with hypoplasia of the vermis and
    hemispheres on MRI — the developmental component of the disorder.
  biological_scale: TISSUE
  downstream:
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
  - target: Cerebellar vermis hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25361784
    reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI demonstrated hypoplasia in the vermis and cerebellar hemispheres"
    explanation: >-
      Documents the cerebellar developmental (hypoplastic) component.

- name: Progressive Cerebellar Degeneration
  description: >-
    Beyond the developmental hypoplasia, the cerebellum progressively atrophies
    on serial imaging — the degenerative component of the disorder.
  biological_scale: TISSUE
  downstream:
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
  - target: Cerebellar atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27016154
    reference_title: "Exome sequencing reveals a novel CWF19L1 mutation associated with intellectual disability and cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial MRI showed mildly progressive cerebellar atrophy."
    explanation: >-
      Documents progressive cerebellar atrophy as the degenerative component.


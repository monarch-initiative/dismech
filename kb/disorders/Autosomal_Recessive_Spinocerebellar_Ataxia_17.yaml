treatments:
- name: Supportive Multidisciplinary Care for Ataxia and Neurodevelopmental Deficits
  description: >-
    Because no disease-modifying therapy currently exists for CWF19L1-related
    spinocerebellar ataxia, clinical management is supportive and focuses on
    neurological rehabilitation, developmental support for intellectual
    disability, and symptom management across childhood and adolescence.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25361784
    reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are currently no therapies for ataxia; therefore, determining new
      pathways or targets for therapy are important.
    explanation: >-
      Confirms that no targeted curative therapy is available for CWF19L1
      recessive ataxia, necessitating supportive care.
- name: Anticonvulsant Therapy for CWF19L1-Related Epilepsy
  description: >-
    Anticonvulsant pharmacotherapy is attempted for epileptic seizures in
    CWF19L1-related disorder, though childhood-onset developmental and
    epileptic encephalopathy presentations frequently exhibit
    treatment-resistant seizures and specific regimen efficacy is not
    established.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Seizures
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:36453471
    reference_title: "Expansion of the phenotypic and molecular spectrum of CWF19L1-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, we describe that CWF19L1-related disorder presents with
      developmental and epileptic encephalopathy with treatment-resistant
      seizures and intellectual disability in childhood followed by progressive
      ataxia and other extrapyramidal movement disorders in adolescence.
    explanation: >-
      Characterizes the childhood-onset seizures in CWF19L1-related disorder as
      frequently treatment-resistant.

genetic:
- name: CWF19L1
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CWF19L1
    term:
      id: hgnc:25613
      label: CWF19L1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic CWF19L1 variants cause SCAR17. Reported alleles include splice-site
    (c.964+1G>A), frameshift (c.467delC, p.P156Hfs*33), nonsense (p.K316*) and
    damaging missense (p.D13H, p.Asp132Gly) variants, all consistent with loss of
    function. The disorder is rare (a few dozen cases). ClinGen's Cerebellar
    Ataxia Gene Curation Expert Panel classifies CWF19L1 as Definitive, but for
    the broader class "autosomal recessive cerebellar ataxia" (MONDO:0015244;
    CGGV:assertion_6ebc1a4b-1a41-40df-832f-904cd4bb88f9-2025-05-14T160000.000Z),
    not for the SCAR17 term (MONDO:0014503) specifically, so it is not recorded
    here as a gene_disease_validity assertion on this entry; the relationship
    rests on multiple unrelated biallelic families plus a zebrafish model.
  variants:
  - name: c.964+1G>A
    description: >-
      Homozygous invariant +1 splice-donor variant in intron 9 causing exon
      skipping and protein loss; the founding allele in a consanguineous Turkish
      family.
    evidence:
    - reference: PMID:25361784
      reference_title: "Homozygous splice mutation in CWF19L1 in a Turkish family with recessive ataxia syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron 9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene."
      explanation: Reports the founding homozygous splice variant.
  - name: p.D13H / p.K316*
    description: >-
      Compound-heterozygous missense (c.37G>C, p.D13H) and nonsense
      (c.946A>T, p.K316*) variants in a non-consanguineous Dutch patient.
    evidence:
    - reference: PMID:26197978
      reference_title: "Pathogenic CWF19L1 variants as a novel cause of autosomal recessive cerebellar ataxia and atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing of a girl with ARCA from non-consanguineous Dutch parents revealed two pathogenic variants c.37G>C; p.D13H and c.946A>T; p.K316* in CWF19L1, a gene with an unknown function, recently reported to cause ARCA in a Turkish family."
      explanation: Reports the compound-heterozygous variants confirming the gene.
  - name: c.467delC (p.P156Hfs*33)
    description: >-
      Homozygous frameshift variant with absent protein in patient lymphoblastoid
      cell lines.
    evidence:
    - reference: PMID:27016154

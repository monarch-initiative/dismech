discussions:
- discussion_id: kat8_valproate_mechanism_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does valproate work in KAT8-related epilepsy by restoring histone acetylation, or
    simply as a broad-spectrum anticonvulsant? Nobody has measured the mark in a treated
    patient.
  attaches_to:
  - treatments#Valproate for Epilepsy
  - pathophysiology#Loss of Nucleosomal H4K16 Acetylation
  rationale: >-
    The reasoning is attractive: KAT8 writes an acetylation mark, valproate inhibits the
    deacetylases that erase acetylation marks, and both treated individuals responded. But
    two patients cannot distinguish a mechanism-directed effect from valproate simply
    working as it does in many epilepsies, and the founding authors themselves phrase it as
    "may ameliorate". The question is answerable with existing technology - measure H4K16ac
    in patient-derived cells or accessible tissue before and after treatment, or compare
    response rates against a non-HDAC-inhibiting anticonvulsant in a larger cohort. It
    matters beyond this disorder: if the logic holds, HDAC inhibition becomes a rational
    strategy across the writer chromatinopathies, and if it does not, a plausible-sounding
    rationale is steering drug choice on no evidence.
  evidence:
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate is a known deacetylase inhibitor and promotes histone acetylation (42), so it may ameliorate potential acetylation deficiency result"
    explanation: The hypothesis as stated by its authors, in explicitly conditional terms.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate was effective for treating epilepsy in at least 2 of the individuals."
    explanation: >-
      The entire clinical evidence base - two individuals - which is why this is a gap
      rather than an established mechanism.
- discussion_id: kat8_dual_inheritance
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do monoallelic de novo and biallelic KAT8 variants produce the same syndrome, and
    do the two forms differ in severity or in which domains are affected?
  attaches_to:
  - inheritance#Autosomal recessive
  - pathophysiology#KAT8 Loss of Function
  rationale: >-
    KAT8 is highly intolerant of loss-of-function change, which fits dominant disease from
    a single de novo allele. Yet a homozygous missense variant segregates recessively in a
    consanguineous family, and the founding study had already flagged one individual whose
    variants behaved differently from the de novo cases. The most economical explanation is
    a dose-and-severity gradient - severe alleles causing dominant disease, milder
    hypomorphic alleles needing two copies - which would predict that the recessive alleles
    retain more residual acetyltransferase activity than the dominant ones. That is
    directly testable with the same nucleosomal H4K16 acetylation assay the founding study
    already used on the de novo variants, and has not been done for the recessive allele.
  evidence:
  - reference: PMID:41347281
    reference_title: "The Genetic Basis of Neurological Disorders: Missense and Nonsense Variants in Three Pakistani Families With Syndromic Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reports, for the first time, an autosomal recessive inheritance pattern for a KAT8-related disorder, providing new insights into its genetic architecture."
    explanation: Establishes that both inheritance modes occur at this locus.
  - reference: PMID:41347281
    reference_title: "The Genetic Basis of Neurological Disorders: Missense and Nonsense Variants in Three Pakistani Families With Syndromic Intellectual Disability."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "The functional consequences of the ADGRG1 and KAT8 missense variants were revealed as deleterious using bioinformatic prediction tools."
    explanation: >-
      Graded PARTIAL and COMPUTATIONAL - the recessive allele's effect was assessed by
      in-silico prediction, not by the enzymatic assay that would settle the
      residual-activity question.

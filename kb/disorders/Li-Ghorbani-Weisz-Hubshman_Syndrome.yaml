  description: >-
    A conditional rather than constitutive knockout, using the Emx1-Cre driver to delete
    Kat8 in the cerebrocortical lineage. The design is what makes it interpretable: H4K16ac
    is lost in the cerebrocortical neuroepithelium and hippocampal primordium but retained
    in the ganglionic eminences, so the resulting hypoplasia can be attributed to KAT8 in
    that lineage.

genetic:
- name: KAT8
  notes: >-
    KAT8 encodes lysine acetyltransferase 8, the MYST-family enzyme responsible for H4K16
    acetylation, orthologous to Drosophila Mof (males absent on the first). The protein has
    a chromobarrel domain and an acetyltransferase core containing a KAT8/Mof-specific
    region absent from other MYST members plus the MYST domain. Constraint metrics place it
    as moderately intolerant of missense change and highly intolerant of loss of function.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KAT8
    term:
      id: hgnc:17933
      label: KAT8
  evidence:
  - reference: PMID:31794431
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study uncovers a critical role of KAT8 in cerebral and NSPC development, identifies 9 individuals with KAT8 variants, and links deficient H4K16 acylation directly to intellectual disability, epilepsy, and other developmental anomalies."
    explanation: The founding gene-disease association.
  - reference: PMID:31794431
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "It is predicted to be moderately intol-\nerant of missense change (misZ [Z  score of missense variation \nintolerance] score of 3.66)"
    explanation: >-
      Population constraint metrics supporting pathogenicity of missense change. Graded
      COMPUTATIONAL because these are in-silico population-genetic predictions.
  - reference: PMID:36553572
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "substantially strengthen the confirmation of genes with limited evidence in the medical literature (ADARB1, AP2M1, BCKDK, BCORL1, CARS2, FBXO38, GABRB1, KAT8, PRKD1, RAB11B, RUSC2, ZNF142)"
    explanation: >-
      Independent routine-diagnostics evidence strengthening the KAT8 gene-disease
      association, from a cohort of nearly 10,000 analyses.
  variants:
  - name: c.649A>C (p.Met217Leu)
    description: >-
      Homozygous missense variant segregating with LIGOWS in a consanguineous Pakistani
      family, the basis of the first autosomal recessive report for this locus.
    evidence:
    - reference: PMID:41347281
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In Family-2 with LIGOWS, a novel homozygous missense variant ((NM_182958.4): c.649A > C; (NP_892003.2): p.Met217Leu) was found in KAT8."
      explanation: Identifies the recessive allele and the family it segregates in.

treatments:
- name: Valproate for Epilepsy
  description: >-
    Valproate is used for the epilepsy, and there is a mechanistic argument for preferring
    it here rather than treating the choice as arbitrary: valproate inhibits histone
    deacetylases and so promotes histone acetylation, which could partly offset the
    acetylation deficit created by impaired KAT8. Both of the two individuals with epilepsy
    treated with valproate responded.

    The strength of this should not be overstated. Two responders is an observation, not a
    trial, there is no report of the acetylation mark being measured before and after
    treatment in a patient, and valproate is a broad-spectrum anticonvulsant that would be
    expected to help many epilepsies regardless of mechanism. The mechanistic rationale
    makes it a reasonable first choice and a testable hypothesis, not established
    mechanism-directed therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Loss of Nucleosomal H4K16 Acetylation
    description: >-
      Proposed, not demonstrated. Inhibiting histone deacetylases would raise histone
      acetylation globally and might partially compensate for the lost KAT8 activity.
    evidence:
    - reference: PMID:31794431
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Valproate is a known deacetylase inhibitor and promotes histone acetylation (42), so it may ameliorate potential acetylation deficiency result"
      explanation: >-
        Graded PARTIAL because the authors state this as a possible mechanism ("may
        ameliorate"), with no measurement of the acetylation mark in treated patients.
  evidence:
  - reference: PMID:31794431
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Valproate was effective for treating epilepsy in at least 2 of the individuals."
    explanation: The clinical observation of response, in two individuals.
animal_models:
- name: Emx1-Cre cerebrum-specific Kat8 conditional knockout mouse
  species: Mouse
  genotype: Kat8 conditional knockout, Emx1-Cre driver (cerebrum-specific)
  publication: PMID:31794431
  description: >-
    A conditional rather than constitutive knockout, using the Emx1-Cre driver to delete
    Kat8 in the cerebrocortical lineage. The design is what makes it interpretable: H4K16ac
    is lost in the cerebrocortical neuroepithelium and hippocampal primordium but retained
    in the ganglionic eminences, so the resulting hypoplasia can be attributed to KAT8 in
    that lineage.
  genes:
  - preferred_term: KAT8
    term:
      id: hgnc:17933
      label: KAT8
  modeled_mechanisms:
  - target: Cerebral Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces cerebral hypoplasia of the neocortex and hippocampus, the structural
      correlate of the intellectual disability and brain MRI anomalies in patients.
    limitations: >-
      A complete conditional knockout, whereas most patients are heterozygous for de novo
      missense variants affecting the chromobarrel or catalytic domain. The mouse therefore
      models total loss of KAT8 in a lineage rather than the partial, allele-specific
      impairment patients carry, and the human MRI findings are described only as
      consistent with, not equivalent to, the murine hypoplasia.
    readouts:
    - name: Neocortical and hippocampal size
      target: Cerebral Hypoplasia
      direction: DECREASED
      interpretation: Structural hypoplasia of the two regions where H4K16ac is normally highest.
      evidence:
      - reference: PMID:31794431
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cerebrum-specific knockout mice displayed cerebral hypoplasia in the neocortex and hippocampus"
        explanation: The structural measurement behind this readout.
    evidence:
    - reference: PMID:31794431
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "uncovers an essential role of mouse Kat8 in cerebral development,"
      explanation: >-
        Supports treating the model as informative for cerebral development. Quoted from
        the sentence about mouse Kat8 specifically, rather than the summary sentence that
        also covers the human subjects.
  - target: Impaired Neural Stem and Progenitor Cell Expansion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant NSPCs form poor neurospheres, giving a quantitative cellular assay for the
      progenitor defect.
    limitations: >-
      Neurosphere formation is an ex vivo proxy for progenitor self-renewal, and no
      equivalent measurement exists in patient-derived cells, so the correspondence to
      human disease is by inference.
    readouts:
    - name: Neurosphere formation
      target: Impaired Neural Stem and Progenitor Cell Expansion
      direction: DECREASED
      interpretation: Reduced self-renewal capacity of Kat8-null neural stem and progenitor cells.
      evidence:

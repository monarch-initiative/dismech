    explanation: >-
      Distinguishes the de novo variants in eight of nine individuals from the differently
      transmitted variants in the ninth.
- name: Autosomal recessive
  description: >-
    A separate, biallelic form. A consanguineous Pakistani family segregated a homozygous
    KAT8 missense variant with the disorder, which the reporting authors identify as the
    first autosomal recessive inheritance pattern described for a KAT8-related disorder.
    The founding study had already anticipated a dual-inheritance locus, comparing KAT8 to
    genes such as EMC1 where both monoallelic and biallelic variants cause developmental
    disease.

name: Li-Ghorbani-Weisz-Hubshman Syndrome
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- LIGOWS
- KAT8-related neurodevelopmental disorder
- KAT8 deficiency
- MOF-related syndromic intellectual disability
description: >-
  Li-Ghorbani-Weisz-Hubshman syndrome is a neurodevelopmental disorder caused by variants
  in KAT8, the lysine acetyltransferase responsible for acetylating histone H4 at lysine 16
  (H4K16). It belongs to the chromatinopathies - disorders of the chromatin-modifying
  machinery - and sits beside the KAT6A and KAT6B syndromes within the MYST family, from
  which KAT8 is distinguished by its site specificity for H4K16 rather than H3K23.

  The defining feature is that KAT8 is not a general acetyltransferase whose loss is
  tolerable: H4K16ac is high in the developing neocortex and hippocampus, and
  cerebrum-specific Kat8 knockout mice show cerebral hypoplasia with faulty proliferation,
  premature and aberrant neurogenesis, and massive apoptosis of the cerebrocortical
  neuroepithelium. Neural stem and progenitor cells from those mice fail to form
  neurospheres, and pharmacological KAT8 inhibition abolishes neurosphere formation from
  wild-type cortex - so the requirement is acute rather than developmental history alone.

  Nine individuals with KAT8 variants were reported in the founding 2020 study, with global
  developmental delay, intellectual disability, epilepsy, language delay in every case,
  variable facial dysmorphism, and cardiac anomalies in four. The variants cluster in the
  chromobarrel and acetyltransferase domains and impair nucleosomal H4K16 acetylation.
  Eight arose de novo; the ninth individual carried variants transmitted differently,
  and a subsequent Pakistani family established a clearly autosomal recessive form - so
  this is a dual-inheritance locus, not a purely dominant de novo one.

  There is a mechanism-directed treatment lead worth noting. Valproate is a histone
  deacetylase inhibitor, and the founding study's authors reasoned it might offset the
  acetylation deficit; both of the two individuals with epilepsy treated with valproate
  responded. That is two patients, not a trial.

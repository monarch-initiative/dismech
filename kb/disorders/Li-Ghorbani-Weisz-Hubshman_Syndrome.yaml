pathophysiology:
- name: KAT8 Loss of Function
  description: >-
    Pathogenic KAT8 variants alter either the chromobarrel domain or the acetyltransferase
    core. The acetyltransferase domain comprises a KAT8/Mof-specific region absent from
    other MYST family members plus the MYST domain itself. Of the characterised missense
    variants, three alter the chromobarrel domain and four the acetyltransferase domain, so
    the disease can arise either by disrupting catalysis directly or by disrupting the
    reader module that positions the enzyme. KAT8 is highly intolerant of loss-of-function
    change and moderately intolerant of missense change.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KAT8
    term:
      id: hgnc:17933
      label: KAT8
  molecular_functions:
  - preferred_term: histone H4K16 acetyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0046972
      label: histone H4K16 acetyltransferase activity
  downstream:
  - target: Loss of Nucleosomal H4K16 Acetylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants altered chromobarrel and catalytic domains of KAT8, thereby impairing nucleosomal H4K16 acetylation."
    explanation: Maps the patient variants onto the two functional domains and states the biochemical consequence.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the missense variants, 3 alter the chromobarrel domain, and 4 change the acetyltransferase domain."
    explanation: Quantifies the split between reader-module and catalytic-domain variants.
- name: Loss of Nucleosomal H4K16 Acetylation
  description: >-
    H4K16 acetylation is an evolutionarily conserved mark, and KAT8 is the major enzyme
    that writes it in mammals. Its level is high in the neocortex and hippocampus of the
    adult brain, at P5, and in the cerebrocortical neuroepithelium at E12.5 - the
    distribution that first implicated KAT8 in cerebral development. In Emx1-Cre
    conditional knockout mice the mark disappears from the cerebrocortical neuroepithelium
    and hippocampal primordium while being retained in the ganglionic eminences, which is
    what makes the resulting phenotype attributable to KAT8 in that specific lineage rather
    than to a global effect.

    KAT8 works through two distinct complexes - MSL and NSL - and the disease may reflect
    disruption of both. Variants in KANSL1, which encodes the NSL1 subunit, cause
    Koolen-de Vries syndrome, and MSL3 variants cause an X-linked developmental disorder.
    Individuals with KAT8 variants show epilepsy and other features absent in MSL3 disease,
    which argues KAT8 is not simply acting through one complex.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone H4K16 acetyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0046972
      label: histone H4K16 acetyltransferase activity
  downstream:
  - target: Impaired Neural Stem and Progenitor Cell Expansion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "H4K16ac disappeared in the cerebrocortical neuroepithelium and hippocampal primordium at E12.5, but not the in the medial or lateral ganglionic eminence"
    explanation: >-
      Demonstrates lineage-restricted loss of the mark, which is what attributes the
      downstream phenotype to KAT8 in the cerebrocortical lineage.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the H4K16ac level was high in the neocortex and hippocampus of the adult brain, as well as in these areas at P5 and in the cerebrocortical neuro  epithelium at E12.5"
    explanation: Establishes the developmental expression pattern that implicates KAT8 in cerebral development.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "that KAT8 may act through both MSL and NSL complexes"
    explanation: >-
      Graded PARTIAL - the authors' own conclusion, which they state as a suggestion, that
      KAT8 acts through both complexes. It rests on a phenotypic contrast with MSL3-related
      disease rather than a direct assay.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSL3 cooperates with MSL1 and MSL2 in KAT8 activation"
    explanation: >-
      Establishes that KAT8 activity depends on partner subunits, which is the basis for
      the claim that complex composition matters to disease.
  - reference: PMID:31267707
    reference_title: "The non-specific lethal (NSL) complex at the crossroads of transcriptional control and cellular homeostasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Highlighting their importance, mutations or deregulation of NSL complex members has been reported in both human neurodevelopmental disorders and cancer."
    explanation: >-
      Independent support for the NSL half of the dual-complex claim: disrupting other
      members of the same complex also produces neurodevelopmental disease, which is the
      pattern this node's KANSL1 and MSL3 comparison relies on. Graded OTHER as an expert
      review rather than a study reporting its own data.
  notes: >-
    Bound to the specific acetyltransferase activity rather than to a broad chromatin
    process, and placed in molecular_functions accordingly. A parent term such as chromatin
    organization would invert the biology if given a DECREASED modifier: H4K16 acetylation
    opposes chromatin compaction, so losing it makes chromatin more compact, not less
    organised.

    This node shares GO:0046972 with the upstream KAT8 Loss of Function node and is
    separated from it by the modifier, not by the term. That is deliberate, because GO
    offers nothing else to separate them with. The process-level term for the mark,
    GO:0043984 histone H4-K16 acetylation, is obsolete, and the obsoletion comment is
    explicit about why: "This term was obsoleted because it represents a molecular
    function." Its regulation terms (GO:2000618, GO:2000619, GO:2000620) are obsolete for
    the same reason. GO has therefore ruled that this concept is a molecular function, so
    there is no live biological-process term to move the mark to.

    The modifier carries the distinction instead, and it is the distinction this repository
    already draws. The enzyme node is qualitative - missense substitutions impede the
    acetyltransferase activity itself, so LOSS_OF_FUNCTION. This node is quantitative - the
    mark is depleted from a lineage, a normally regulated activity running below its normal
    level, so DECREASED, which is also PATO-bound and stays queryable.

    Separately: the source text quotes "neuro  epithelium" with an internal double space, a
    line-break artefact of the cached full text. The snippet preserves it because snippets
    must be exact substrings.
- name: Impaired Neural Stem and Progenitor Cell Expansion
  description: >-
    Loss of H4K16ac impairs neural stem and progenitor cell development. Mutant NSPCs form
    poor neurospheres, and - importantly - pharmacological KAT8 inhibition abolishes
    neurosphere formation from wild-type cortex. That second result matters because it
    separates an acute requirement for KAT8 activity from the accumulated consequences of
    a developmental knockout. The inhibitor experiment was designed as a comparison: MG149
    targets both KAT5 and KAT8 while NU9056 is KAT5-specific, so the difference between
    them isolates the KAT8 contribution.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  downstream:
  - target: Aberrant Neurogenesis and Neuroepithelial Apoptosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant NSPCs formed poor neurospheres, and pharmacological KAT8 inhibition abolished neurosphere formation."
    explanation: Both the genetic and the pharmacological demonstrations of impaired NSPC expansion.
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The former targets both KAT5 and KAT8 (34), whereas NU9056 is specific to KAT5 (35). The difference between these 2 inhibitors would allow us to compare their impact and deduce the effect of KAT8 inhibition on neurospheres."
    explanation: >-
      The comparative inhibitor design that isolates the KAT8-specific contribution, since
      no KAT8-selective inhibitor was available at the time.
- name: Aberrant Neurogenesis and Neuroepithelial Apoptosis
  description: >-
    The mutant cerebrocortical neuroepithelium shows faulty proliferation, premature and
    aberrant neurogenesis, and massive apoptosis. The combination - progenitors both
    differentiating too early and dying - depletes the progenitor pool from two directions
    at once, which is why the structural consequence is hypoplasia rather than a subtler
    patterning defect.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: neurogenesis
    modifier: DYSREGULATED
    term:
      id: GO:0022008
      label: neurogenesis
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Cerebral Hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31794431
    reference_title: "Lysine acetyltransferase 8 is involved in cerebral development and syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant cerebrocortical neuroepithelia exhibited faulty proliferation, aberrant neurogenesis, massive apoptosis, and scant H4K16 propionylation."
    explanation: The primary cellular phenotype of the conditional knockout.
- name: Cerebral Hypoplasia
  description: >-
    Cerebral hypoplasia of the neocortex and hippocampus in the conditional knockout,

name: Syphilis
creation_date: "2026-08-08T05:00:00Z"
category: Infectious Disease
description: >-
  Syphilis is a chronic, multistage systemic infection caused by the spirochete
  Treponema pallidum subspecies pallidum, transmitted sexually or vertically
  from mother to fetus. Untreated it evolves through primary (chancre),
  secondary (disseminated mucocutaneous), latent, and tertiary (gummatous and
  cardiovascular) stages over years to decades, and can involve virtually any
  organ system - the basis of its historical epithet "the great imitator".
  Neurological, ocular, and otic involvement can occur at any stage, not only
  late disease. The central pathophysiological theme is stealth: the organism
  presents an outer membrane almost devoid of surface-exposed
  pathogen-associated molecular patterns and lacking lipopolysaccharide, and
  varies the few surface epitopes it does display by TprK gene conversion, so
  that intense local immune infiltration never achieves sterilizing clearance.
  It is the venereal member of the treponematoses, alongside the endemic
  non-venereal diseases yaws, bejel, and pinta, which are caused by distinct
  T. pallidum subspecies and are separate disease entities.
synonyms:
- lues
- lues venerea
- Treponema pallidum infection
disease_term:
  preferred_term: syphilis
  term:
    id: MONDO:0005976
    label: syphilis
parents:
- Bacterial Infection
- Sexually transmitted infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:34292926
      reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Penicillin G, administered parenterally, is the preferred drug for treating patients in all stages of syphilis."
      explanation: >-
        Syphilis is a bacterial infection managed with antimicrobial therapy,
        placing it in Harrison's Infectious Diseases Part.
stages:
- name: Primary syphilis
  description: >-
    A chancre at the inoculation site 10-90 days after exposure, healing
    spontaneously in 3-6 weeks. Resolution marks progression to the next stage,
    not cure.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary syphilis classically presents as a single painless ulcer or chancre at the site of infection but can also present with multiple, atypical, or painful lesions"
    explanation: Defines the primary stage by its characteristic lesion.
- name: Secondary syphilis
  description: >-
    Disseminated disease weeks to months after the chancre, with generalized
    mucocutaneous eruption, condylomata lata, lymphadenopathy, and visceral
    involvement. May overlap a healing chancre.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary syphilis manifestations can include skin rash, mucocutaneous lesions, and lymphadenopathy."
    explanation: Defines the secondary stage by its manifestation set.
- name: Early latent syphilis
  description: >-
    Asymptomatic infection acquired within the preceding year. Distinguished
    from late latent because it remains infectious, carries a risk of
    mucocutaneous relapse, and is treated with a single benzathine penicillin
    dose rather than three.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Latent syphilis acquired within the preceding year is referred to as early latent syphilis"
    explanation: Gives the defining time boundary of early latent syphilis.
- name: Late latent syphilis or latent syphilis of unknown duration
  description: >-
    Asymptomatic infection of at least one year's duration, or of unknown
    duration. Requires three weekly doses of benzathine penicillin.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all other cases of latent syphilis are classified as late latent syphilis or latent syphilis of unknown duration"
    explanation: Gives the definition by exclusion from early latent disease.
- name: Tertiary syphilis
  description: >-
    Late destructive disease - gummatous, cardiovascular, or late neurological
    - occurring years to decades after infection in a minority of untreated
    people. Structural damage does not reverse with microbiological cure.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late neurologic manifestations (e.g., tabes dorsalis and general paresis) occur 10 to >30 years after infection."
    explanation: >-
      Places the late manifestations decades after infection, defining the
      tertiary stage temporally.
- name: Congenital syphilis
  description: >-
    Vertically acquired infection, divided into early (presenting under two
    years, with hepatosplenomegaly, rhinitis, rash, and pseudoparalysis) and
    late (the Hutchinson stigmata, which are permanent developmental scarring
    rather than active infection).
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hepatosplenomegaly, rhinitis, skin rash, or pseudoparalysis of an extremity"
    explanation: Enumerates the early congenital manifestation set.
progression:
- phase: Incubation period
  incubation_days: 10-90
  notes: >-
    The chancre appears 10-90 days after exposure, with a median of about three
    weeks. Not separately evidenced here; the window is stated in the
    deep-research report and is standard, but no cached source quotes it.
- phase: Early neurological involvement
  notes: >-
    Meningovascular manifestations - cranial nerve dysfunction, meningitis,
    stroke - usually appear within the first months to few years of infection,
    not in late disease.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early neurologic clinical manifestations or syphilitic meningitis (e.g., cranial nerve dysfunction, meningitis, meningovascular syphilis, stroke, and acute altered mental status) are usually present within the first few months or years of infection."
    explanation: Gives the timing of early neurological involvement.
- phase: Late neurological involvement
  notes: >-
    Parenchymal neurosyphilis - tabes dorsalis and general paresis - occurs 10
    to more than 30 years after infection.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late neurologic manifestations (e.g., tabes dorsalis and general paresis) occur 10 to >30 years after infection."
    explanation: Gives the decades-long latency to parenchymal neurosyphilis.
prevalence:
- population: >-
    United States, 16 jurisdictions with complete reporting of clinical
    manifestations, 2019
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    41,187 reported syphilis cases. Among them, neurologic manifestations were
    reported in 1.1%, ocular in 1.1%, otic in 0.4%, and any of the three in
    2.0%. These are proportions of reported cases in passive surveillance, not
    population rates, and are likely underestimates.
  evidence:
  - reference: PMID:35819903
    reference_title: "Reported Neurologic, Ocular, and Otic Manifestations Among Syphilis Cases-16 States, 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical manifestations were infrequently reported overall: neurologic (n = 445, 1.1%), ocular (n = 461, 1.1%), otic (n = 166, 0.4%), any (n = 807, 2.0%)"
    explanation: >-
      Gives the surveillance denominator and the per-manifestation proportions.
infectious_agent:
- name: Treponema pallidum subsp. pallidum
  description: >-
    A thin, tightly coiled, motile spirochete that cannot be continuously
    cultured by conventional means; nearly all experimental work uses the
    rabbit model. It is the venereal treponeme, distinct from the subspecies
    causing yaws, bejel, and pinta.
  infectious_agent_term:
    preferred_term: Treponema pallidum subsp. pallidum
    term:
      id: NCBITaxon:161
      label: Treponema pallidum subsp. pallidum
  evidence:
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "fragile outer membrane lacks lipopolysaccharide (LPS), the highly proinflammatory glycolipid found in Gram-negative bacteria"
    explanation: >-
      This review of T. pallidum biology characterizes the organism and its
      distinctive LPS-free outer membrane. Evidence source is OTHER because the
      citation is a review article rather than a primary study.
transmission:
- name: Sexual transmission by direct lesion contact
  description: >-
    Transmission occurs through direct contact with an infectious mucocutaneous
    lesion - chancre, mucous patch, or condyloma latum - during vaginal, anal,
    or oral sex. Early (primary, secondary, early-latent) syphilis is the
    period of greatest infectiousness.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary syphilis classically presents as a single painless ulcer or chancre at the site of infection"
    explanation: >-
      The chancre arising at the site of infection establishes direct lesional
      contact as the route of transmission.
- name: Vertical transplacental transmission
  description: >-
    T. pallidum crosses the placenta during maternal spirochetemia, producing
    congenital syphilis. Transmission can occur at any point in pregnancy or at
    delivery, and risk tracks the maternal stage - highest in primary and
    secondary syphilis, when spirochete burden is greatest, and lower in the
    latent phases.
  evidence:
  - reference: PMID:40977496
    reference_title: "Syphilis in pregnancy: A practical guide for prenatal care providers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vertical transmission can occur at any point during pregnancy or delivery, with the highest risk observed during primary and secondary stages of infection compared to latent phases."
    explanation: >-
      Directly states both the timing and the maternal-stage dependence of
      vertical transmission.
pathophysiology:
- name: Treponemal Mucosal Inoculation and Local Replication
  biological_scale: TISSUE
  description: >-
    T. pallidum penetrates intact mucous membranes or abraded skin at the site
    of sexual contact and replicates locally. This is the trigger event of the
    pathograph.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Early Hematogenous and Lymphatic Dissemination
    description: Local replication seeds the bloodstream and regional lymphatics.
    causal_link_type: DIRECT
  - target: Obliterative Endarteritis
    description: >-
      Local treponemal presence provokes the endarteritis that produces the
      indurated chancre.
    causal_link_type: DIRECT
  - target: Th1 Cellular Immune Response and Partial Clearance
    description: >-
      Local antigen is taken up and presented, initiating the cellular immune
      response.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The paucity of surface-exposed pathogen-associated molecular patterns (PAMPs) enables the bacterium to undergo repeated bouts of dissemination that are poorly detected by innate immunity"
    explanation: >-
      Establishes that the organism disseminates from the inoculation site
      while evading innate detection.
- name: Early Hematogenous and Lymphatic Dissemination
  biological_scale: ORGANISM
  description: >-
    Spirochetemia is established within days to weeks and precedes the
    appearance of the primary chancre. This early, clinically silent
    dissemination explains why disseminated secondary disease, neuroinvasion,
    and congenital transmission can all follow an unnoticed primary lesion.
  downstream:
  - target: Immune-Privileged Sanctuary Site Invasion
    description: Circulating treponemes cross the blood-brain, blood-ocular, and placental barriers.
    causal_link_type: DIRECT
  - target: Secondary Disseminated Mucocutaneous Disease
    description: Widespread hematogenous seeding produces the generalized secondary eruption.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "enables the bacterium to undergo repeated bouts of dissemination that are poorly detected by innate immunity and also explains the lack of systemic inflammatory symptoms characteristic of the disease"
    explanation: >-
      Supports repeated poorly-detected dissemination as a defining feature of
      the organism's behaviour in the host.
- name: Stealth Outer Membrane and PAMP Paucity
  biological_scale: MOLECULAR
  role: immune_evasion
  description: >-
    The treponemal outer membrane carries very few surface-exposed integral
    membrane proteins and, unlike other Gram-negative bacteria, contains no
    lipopolysaccharide. The resulting paucity of pathogen-associated molecular
    patterns denies innate immunity its usual trigger, which is why systemic
    inflammatory symptoms are muted despite ongoing spirochetemia.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  downstream:
  - target: Latency and Persistent Infection
    description: >-
      Failure of innate recognition permits persistence after the clinical
      manifestations of early disease resolve.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "fragile outer membrane lacks lipopolysaccharide (LPS), the highly proinflammatory glycolipid found in Gram-negative bacteria"
    explanation: >-
      Directly supports the absence of LPS, the central molecular basis of the
      innate-recognition failure this node represents.
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The paucity of surface-exposed pathogen-associated molecular patterns (PAMPs) enables the bacterium to undergo repeated bouts of dissemination that are poorly detected by innate immunity and also explains the lack of systemic inflammatory symptoms characteristic of the disease"
    explanation: >-
      Links the low PAMP density to both poor innate detection and the muted
      systemic inflammatory phenotype.
- name: TprK Antigenic Variation
  biological_scale: MOLECULAR
  role: immune_evasion
  description: >-
    The tprK gene carries seven discrete variable (V) regions that are the
    focus of the anti-TprK antibody response. New V region sequences are
    generated by segmental gene conversion from donor sites elsewhere in the
    genome, so the few surface epitopes that are exposed change continuously
    during infection and outrun the maturing humoral response.
  biological_processes:
  - preferred_term: antigenic variation
    term:
      id: GO:0020033
      label: antigenic variation
    modifier: INCREASED
  downstream:
  - target: Latency and Persistent Infection
    description: >-
      Continuous epitope turnover prevents antibody-mediated clearance and
      permits long-term persistence.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15186410
    reference_title: "Gene conversion: a mechanism for generation of heterogeneity in the tprK gene of Treponema pallidum during infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We describe the sequence anatomy of the seven V regions of tprK and the identification of putative donor sites for new V region sequences, and we propose a model for generation of new V regions by segmental gene conversion."
    explanation: >-
      Establishes segmental gene conversion as the mechanism generating TprK
      variable-region diversity. Evidence source is OTHER because this is
      molecular genetics of the pathogen rather than a human, animal, or
      cell-culture phenotype study.
  - reference: PMID:15186410
    reference_title: "Gene conversion: a mechanism for generation of heterogeneity in the tprK gene of Treponema pallidum during infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The TprK V regions are the focus of anti-TprK antibodies arising during infection."
    explanation: >-
      Establishes that the varying V regions are the target of the host
      antibody response, which is what makes their variation immune evasion.
- name: Th1 Cellular Immune Response and Partial Clearance
  biological_scale: CELLULAR
  description: >-
    Dendritic cells present treponemal antigen to CD4-positive T cells, driving
    a Th1-polarized response with interferon-gamma-mediated macrophage
    activation and phagocytosis. This response clears organisms from
    mucocutaneous lesions - which is why the chancre and the secondary eruption
    resolve without treatment - but does not eradicate infection.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
    modifier: INCREASED
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  downstream:
  - target: Latency and Persistent Infection
    description: >-
      Partial containment without eradication converts active disease into
      clinically silent latent infection.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40708500
    reference_title: "Syphilis Pathogenesis: Host Immune Response vs Pathogen Immune Evasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This translational update describes the host innate and adaptive immune responses in syphilis and the sophisticated mechanisms employed by T. pallidum to avoid immune clearance."
    explanation: >-
      Anchors the host innate and adaptive response that this node represents,
      alongside the evasion that prevents it achieving clearance. Evidence
      source is OTHER because the citation is a translational review.
  - reference: PMID:27721440
    reference_title: "Treponema pallidum, the syphilis spirochete: making a living as a stealth pathogen."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The paucity of surface-exposed pathogen-associated molecular patterns (PAMPs) enables the bacterium to undergo repeated bouts of dissemination that are poorly detected by innate immunity"
    explanation: >-
      PARTIAL because the quoted text supports the failure of clearance rather
      than the specific Th1 cellular architecture.
- name: Obliterative Endarteritis
  biological_scale: TISSUE
  description: >-
    Lymphoplasmacytic infiltration of small and medium vessel walls with
    intimal proliferation narrows and obliterates the lumen, producing ischemic
    tissue injury. This single vascular lesion is the shared histological
    substrate of the primary chancre, the gumma, and tertiary aortitis, which
    is why one mechanism explains lesions in otherwise unrelated organs.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Syphilitic Aortitis
    description: >-
      Endarteritis of the aortic vasa vasorum produces ischemic medial injury.
    causal_link_type: DIRECT
  - target: Meningovascular Neurosyphilis
    description: Endarteritis of cerebral vessels produces stroke syndromes.
    causal_link_type: DIRECT
  - target: Genital ulcers
    description: >-
      Ischemic injury from local endarteritis produces the indurated, clean-based
      chancre.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27982548
    reference_title: "Syphilitic aortitis and its complications in the modern era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presumably, Treponema pallidum invades the aortic wall and the inflammatory response progresses towards obliterative endarteritis and necrosis of the muscular and elastic fibers in the aortic media."
    explanation: >-
      Identifies obliterative endarteritis as the vascular lesion through which
      treponemal invasion damages tissue.
- name: Immune-Privileged Sanctuary Site Invasion
  biological_scale: ORGANISM
  description: >-
    T. pallidum crosses the blood-brain, blood-ocular, and placental barriers.
    Because this can happen during the earliest spirochetemia, neurosyphilis,
    ocular syphilis, and otosyphilis are not confined to late disease but may
    present at any stage - a reframing of the classical teaching that
    materially changes when clinicians should evaluate for them.
  downstream:
  - target: Meningovascular Neurosyphilis
    description: Early CNS invasion establishes the substrate for meningovascular disease.
    causal_link_type: DIRECT
  - target: Parenchymal Neurosyphilis
    description: >-
      Persistence in the CNS compartment permits the late parenchymal
      syndromes.
    causal_link_type: DIRECT
  - target: Transplacental Fetal Dissemination
    description: Placental crossing seeds the fetus.
    causal_link_type: DIRECT
  - target: Uveitis
    description: Invasion across the blood-ocular barrier produces ocular syphilis.
    causal_link_type: DIRECT
  - target: Sensorineural hearing impairment
    description: Invasion of the inner ear produces otosyphilis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40708500
    reference_title: "Syphilis Pathogenesis: Host Immune Response vs Pathogen Immune Evasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogen's ability to evade the immune system by using virulence factor-based strategies and invading immune-privileged sites enables persistent infection in the untreated host."
    explanation: >-
      Directly supports the mechanism this node asserts - invasion of
      immune-privileged sites as the basis of persistent infection. Evidence
      source is OTHER because the citation is a translational review.
  - reference: PMID:35819903
    reference_title: "Reported Neurologic, Ocular, and Otic Manifestations Among Syphilis Cases-16 States, 2019."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Syphilis can cause neurologic, ocular, or otic manifestations, possibly resulting in permanent disability or death."
    explanation: >-
      PARTIAL: establishes the manifestation set that sanctuary-site invasion
      produces, rather than the invasion mechanism itself.
- name: Secondary Disseminated Mucocutaneous Disease
  biological_scale: ORGANISM
  description: >-
    Widespread hematogenous spread produces the generalized maculopapular
    eruption (classically involving palms and soles), condylomata lata, mucous
    patches, generalized lymphadenopathy, and visceral involvement including
    syphilitic hepatitis and immune-complex glomerulonephritis.
  downstream:
  - target: Latency and Persistent Infection
    description: >-
      Secondary manifestations resolve as immune containment develops, and the
      infection becomes clinically silent.
    causal_link_type: DIRECT
  - target: Maculopapular exanthema
    description: Haematogenous seeding of the skin produces the generalized eruption.
    causal_link_type: DIRECT
  - target: Condylomata lata
    description: >-
      Treponemal proliferation in warm intertriginous mucocutaneous sites
      produces highly infectious moist plaques.
    causal_link_type: DIRECT
  - target: Lymphadenopathy
    description: Systemic dissemination produces generalized lymphadenopathy.
    causal_link_type: DIRECT
  - target: Alopecia
    description: Follicular involvement produces patchy moth-eaten alopecia.
    causal_link_type: DIRECT
  - target: Hepatitis
    description: Visceral seeding of the liver produces syphilitic hepatitis.
    causal_link_type: DIRECT
  - target: Glomerulonephritis
    description: Immune-complex deposition in the glomerulus produces nephritis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Penicillin G, administered parenterally, is the preferred drug for treating patients in all stages of syphilis."
    explanation: >-
      PARTIAL: the CDC guideline frames syphilis as a staged disease treated by
      stage; the specific secondary-stage lesion set is carried by the
      individual phenotype entries and their own evidence.
- name: Latency and Persistent Infection
  biological_scale: ORGANISM
  description: >-
    Partial host containment suppresses clinically detectable disease without
    eradicating the organism. Latent infection is divided into early (under one
    year) and late (one year or longer, or unknown duration); early latency
    carries a risk of symptomatic mucocutaneous relapse. A minority of
    untreated people eventually progress to tertiary disease.
  downstream:
  - target: Gummatous Delayed-Type Hypersensitivity Response
    description: >-
      Long-term persistence in a sensitized host permits the delayed
      hypersensitivity granuloma of tertiary disease.
    causal_link_type: DIRECT
  - target: Syphilitic Aortitis
    description: >-
      Decades of low-grade treponemal presence in the aortic vasa vasorum
      produce tertiary cardiovascular disease.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients who have reactive treponemal tests will have reactive tests for the remainder of their lives, regardless of adequate treatment or disease activity."
    explanation: >-
      The lifelong persistence of treponemal antibody reflects the durable
      host-pathogen relationship this node represents and underlies the
      serofast state.
- name: Gummatous Delayed-Type Hypersensitivity Response
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  description: >-
    The gumma is a granulomatous lesion of tertiary syphilis in which
    macrophages undergo epithelioid transformation and fuse into Langhans-type
    multinucleated giant cells, palisading with lymphocytes and plasma cells
    around a zone of central necrosis, in skin, bone, or viscera. Treponemes
    are characteristically scant and difficult to demonstrate within gumma
    tissue, indicating that the lesion is predominantly an immune-mediated
    delayed-type hypersensitivity response rather than direct microbial
    cytopathology.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: syncytium formation by cell-cell fusion
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
    modifier: INCREASED
  downstream:
  - target: Cutaneous granuloma
    description: >-
      Organized granulomatous inflammation in the dermis forms the cutaneous
      gumma.
    causal_link_type: DIRECT
  - target: Skin ulcer
    description: >-
      Central necrosis and breakdown of the gumma produces a destructive,
      scarring ulcer.
    causal_link_type: DIRECT
  notes: >-
    No cited source in this entry describes gumma histology directly; the
    epithelioid and giant-cell content of this node is asserted from the
    module pattern and general pathology rather than from a verified quote,
    and is deliberately left unevidenced rather than propped up by an
    unrelated aortitis citation.
- name: Syphilitic Aortitis
  biological_scale: TISSUE
  description: >-
    Chronic treponemal presence in the vasa vasorum of the ascending aorta
    drives obliterative endarteritis of those nutrient vessels, producing
    ischemic destruction of the elastic and muscular fibers of the aortic
    media. The weakened wall dilates, giving aortic aneurysm, aortic
    regurgitation, aortic root dilation, and coronary ostial stenosis.
  downstream:
  - target: Thoracic aortic aneurysm
    description: Medial destruction weakens the wall and permits aneurysmal dilation.
    causal_link_type: DIRECT
  - target: Aortic regurgitation
    description: Aortic root dilation renders the valve incompetent.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27982548
    reference_title: "Syphilitic aortitis and its complications in the modern era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consequent weakening of the aortic wall can lead to severe complications, represented by aortic aneurysm, aortic valvular insufficiency, aortic root dilation and coronary ostial stenosis."
    explanation: >-
      Directly enumerates the cardiovascular consequences of medial destruction
      that this node produces.
- name: Meningovascular Neurosyphilis
  biological_scale: TISSUE
  description: >-
    The early neurological pattern: endarteritis of cerebral and meningeal
    vessels producing syphilitic meningitis, cranial nerve dysfunction, and
    ischemic stroke, typically within the first months to few years of
    infection. Its mechanism is vascular, which is why it shares a lesion with
    the chancre and with aortitis.
  downstream:
  - target: Ischemic stroke
    description: Cerebral endarteritis causes ischemic infarction.
    causal_link_type: DIRECT
  - target: Meningitis
    description: Meningeal vascular and inflammatory involvement produces syphilitic meningitis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early neurologic clinical manifestations or syphilitic meningitis (e.g., cranial nerve dysfunction, meningitis, meningovascular syphilis, stroke, and acute altered mental status) are usually present within the first few months or years of infection."
    explanation: >-
      Directly enumerates the early meningovascular manifestations and their
      timing, distinguishing them from the late parenchymal syndromes.
- name: Parenchymal Neurosyphilis
  biological_scale: TISSUE
  description: >-
    The late neurological pattern, occurring 10 to more than 30 years after
    infection: direct neuronal and glial injury rather than vascular
    occlusion, producing general paresis (cortical atrophy and gliosis) and
    tabes dorsalis (degeneration of the dorsal columns and dorsal root
    ganglia). HIV coinfection is associated with an accelerated and more
    severe course.
  downstream:
  - target: Dementia
    description: Parenchymal cortical injury produces the dementia of general paresis.
    causal_link_type: DIRECT
  - target: Sensory ataxia
    description: >-
      Dorsal column and dorsal root ganglion degeneration produces the sensory
      ataxia of tabes dorsalis.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late neurologic manifestations (e.g., tabes dorsalis and general paresis) occur 10 to >30 years after infection."
    explanation: >-
      Identifies tabes dorsalis and general paresis as the late parenchymal
      manifestations and separates them in time from the early meningovascular
      ones.
  - reference: PMID:25890619
    reference_title: "Neurosyphilis and the impact of HIV infection."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This review of the clinical presentation, diagnostic laboratory findings, treatment and management of neurosyphilis discusses the impact of HIV and the specific challenges it brings"
    explanation: >-
      PARTIAL: supports the HIV-modified course of neurosyphilis; the review
      abstract does not itself separate parenchymal from meningovascular
      disease.
- name: Transplacental Fetal Dissemination
  biological_scale: ORGANISM
  description: >-
    Maternal spirochetemia seeds the fetus across the placenta, producing a
    disease process analogous to disseminated secondary syphilis in the fetus.
    Transmission can occur at any point in pregnancy or at delivery, and the
    risk is greatest when the mother is in the primary or secondary stage.
    Untreated fetal infection causes stillbirth, hydrops, and the early
    congenital syndrome; the classical Hutchinson stigmata are late, permanent
    developmental scarring rather than active infection.
  downstream:
  - target: Rhinitis
    description: Mucosal infection of the neonatal nasal passages produces syphilitic snuffles.
    causal_link_type: DIRECT
  - target: Hepatosplenomegaly
    description: Disseminated fetal infection involves the liver and spleen.
    causal_link_type: DIRECT
  - target: Periostitis
    description: Treponemal infection of growing bone produces periostitis and osteochondritis.
    causal_link_type: DIRECT
  - target: Keratitis
    description: Late congenital interstitial keratitis is one component of the Hutchinson triad.
    causal_link_type: DIRECT
  - target: Abnormal dental morphology
    description: Enamel and dentine maldevelopment produces Hutchinson incisors.
    causal_link_type: DIRECT
  - target: Sensorineural hearing impairment
    description: Eighth nerve involvement produces the deafness of the Hutchinson triad.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40977496
    reference_title: "Syphilis in pregnancy: A practical guide for prenatal care providers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vertical transmission can occur at any point during pregnancy or delivery, with the highest risk observed during primary and secondary stages of infection compared to latent phases."
    explanation: >-
      Establishes the timing and maternal-stage dependence of transplacental
      transmission.
  - reference: PMID:22670010
    reference_title: "Clinical aspects of congenital syphilis with Hutchinson's triad."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the main aspects is observed with the triad of Hutchinson, characterised by the presence of interstitial keratitis, eighth nerve deafness and Hutchinson's teeth."
    explanation: >-
      Documents the late congenital stigmata that result from transplacental
      fetal infection.
- name: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    T. pallidum maintains its peptidoglycan cell wall by penicillin-binding
    protein transpeptidase cross-linking. Beta-lactam acylation of the PBP
    active site halts cross-linking and is treponemicidal. Remarkably, no
    clinically significant penicillin resistance has ever been documented in
    T. pallidum, which is why a single intramuscular dose still cures early
    syphilis after eight decades of use.
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penicillin G, administered parenterally, is the preferred drug for treating patients in all stages of syphilis."
    explanation: >-
      The continued first-line status of parenteral penicillin at every stage
      reflects the undiminished efficacy of this drug target.
- name: Treponemal Ribosomal Translation (Macrolide and Tetracycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    Treponemal protein synthesis on the bacterial ribosome is the target of the
    second-line agents used when penicillin cannot be given - doxycycline
    acting on the 30S subunit, and historically azithromycin acting on the 50S
    subunit.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  downstream:
  - target: 23S rRNA Macrolide Resistance
    description: >-
      Point mutation in the macrolide binding site on this target abolishes
      azithromycin efficacy.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18192791
    reference_title: "Azithromycin resistance in Treponema pallidum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This mutation confers resistance by precluding macrolide binding to the bacterial 50S ribosomal subunit, of which 23S rRNA is a structural component."
    explanation: >-
      Identifies the treponemal ribosome as the macrolide target. Evidence
      source is OTHER because the citation is a review.
- name: 23S rRNA Macrolide Resistance
  biological_scale: MOLECULAR
  role: resistance_mechanism
  conforms_to: "bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance"
  description: >-
    An A-to-G point mutation at position 2058 of the 23S rRNA gene (and the
    related A2059G change) abolishes macrolide binding to the 50S subunit.
    First recognised in azithromycin treatment failures in San Francisco in
    2002, these mutations have since become prevalent in many regions, and are
    the reason azithromycin is no longer recommended where resistance
    prevalence is unknown or high. This distinguishes syphilis from the endemic
    treponematoses, where azithromycin remains a mainstay of mass treatment.
  evidence:
  - reference: PMID:18192791
    reference_title: "Azithromycin resistance in Treponema pallidum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Azithromycin treatment failures in syphilis were first noted in San Francisco in 2002 and result from an A-->G mutation at position 2058 of the 23S rRNA gene"
    explanation: >-
      Directly identifies the A2058G 23S rRNA mutation as the cause of
      azithromycin treatment failure in syphilis.

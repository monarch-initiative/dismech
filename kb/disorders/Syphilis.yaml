name: Syphilis
creation_date: "2026-08-08T05:00:00Z"
category: Infectious Disease
description: >-
  Syphilis is a chronic, multistage systemic infection caused by the spirochete
  Treponema pallidum subspecies pallidum, transmitted sexually or vertically
  from mother to fetus. It progresses through primary (chancre), secondary
  (disseminated mucocutaneous), latent, and tertiary (gummatous, cardiovascular,
  neurological) stages, with neurological and ocular involvement possible at any
  stage. It is the venereal member of the treponematoses, alongside the endemic
  non-venereal diseases yaws, bejel, and pinta.
disease_term:
  preferred_term: syphilis
  term:
    id: MONDO:0005976
    label: syphilis
parents:
- Bacterial Infection
- Sexually transmitted infection
pathophysiology:
- name: Treponemal Inoculation and Local Replication
  description: >-
    T. pallidum penetrates intact mucosa or abraded skin at the site of contact
    and replicates locally, producing the primary chancre.
phenotypes:
- category: Dermatological
  name: Genital ulcers
  description: >-
    The primary lesion of syphilis is a painless, indurated anogenital ulcer
    (chancre) appearing at the inoculation site.
  phenotype_term:
    preferred_term: Genital ulcers
    term:
      id: HP:0003249
      label: Genital ulcers

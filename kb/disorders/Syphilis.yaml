  name: Hepatosplenomegaly
  description: >-
    Hepatosplenomegaly reflects disseminated fetal infection and is one of the
    commonest findings of early congenital syphilis.
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hepatosplenomegaly, rhinitis, skin rash, or pseudoparalysis of an extremity"
    explanation: >-
      Names hepatosplenomegaly among the clinical findings of early congenital
      syphilis.
- category: Skeletal
  name: Periostitis
  description: >-
    Periostitis and osteochondritis of the long bones produce the pain that
    causes pseudoparalysis of an extremity (Parrot pseudoparalysis) in early
    congenital syphilis.
  phenotype_term:
    preferred_term: Periostitis
    term:
      id: HP:0040165
      label: Periostitis
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "hepatosplenomegaly, rhinitis, skin rash, or pseudoparalysis of an extremity"
    explanation: >-
      PARTIAL: names pseudoparalysis, the clinical consequence of the
      periostitis and osteochondritis this phenotype represents, rather than
      the bone lesion itself.
diagnosis:
- name: Nontreponemal serology (RPR/VDRL)
  description: >-
    Nontreponemal tests detect non-specific anticardiolipin antibodies produced
    in response to host tissue damage. They are quantitative, so titers track
    treatment response, but can be falsely negative very early or through the
    prozone phenomenon at very high titers, and falsely positive in pregnancy,
    autoimmune disease, and other infections.
  diagnosis_term:
    preferred_term: nontreponemal serologic testing
    term:
      id: NCIT:C74716
      label: Rapid Plasma Reagin Measurement
  results: >-
    A quantitative titer used both for diagnosis and for monitoring; a
    four-fold or greater decline indicates adequate treatment response.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients who have reactive treponemal tests will have reactive tests for the remainder of their lives, regardless of adequate treatment or disease activity."
    explanation: >-
      Explains why the quantitative nontreponemal test, not the treponemal
      test, is the instrument for monitoring treatment response.
- name: Treponemal serology and the reverse sequence algorithm
  description: >-
    Treponemal tests (TP-PA, FTA-ABS, and automated EIA/CIA immunoassays) are
    specific for anti-T. pallidum antibody but usually remain reactive for
    life, so they cannot by themselves distinguish active from previously
    treated infection. Automated laboratories increasingly screen with a
    treponemal immunoassay first (the reverse sequence algorithm), reflexing to
    a quantitative RPR and, when the two are discordant, to a second treponemal
    test as tiebreaker.
  diagnosis_term:
    preferred_term: treponemal serologic testing
    term:
      id: NCIT:C132388
      label: Treponema pallidum Antibody Measurement
  results: >-
    Lifelong reactivity in most patients; interpretation requires pairing with
    a quantitative nontreponemal titer.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treponemal Tests and Reverse Sequence Algorithm The majority of patients who have reactive treponemal tests will have reactive tests for the remainder of their lives, regardless of adequate treatment or disease activity."
    explanation: >-
      Directly supports both the reverse sequence algorithm and the lifelong
      reactivity that limits treponemal test interpretation.
- name: Direct detection by PCR of lesion material
  description: >-
    PCR on swabs of a chancre or other mucocutaneous lesion detects treponemal
    DNA during the early window when serology may still be non-reactive, and
    has largely supplanted darkfield microscopy where it is available.
    Reference laboratories can also genotype 23S rRNA for the A2058G/A2059G
    macrolide resistance mutations.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Detection of T. pallidum DNA from lesion exudate; a negative result does
    not exclude syphilis.
  evidence:
  - reference: PMID:18192791
    reference_title: "Azithromycin resistance in Treponema pallidum."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Azithromycin treatment failures in syphilis were first noted in San Francisco in 2002 and result from an A-->G mutation at position 2058 of the 23S rRNA gene"
    explanation: >-
      PARTIAL: supports the molecular resistance target that pathogen
      genotyping detects, rather than the diagnostic performance of lesion PCR.
- name: Cerebrospinal fluid examination for neurosyphilis
  description: >-
    CSF examination (CSF-VDRL, cell count, protein) is the test that governs
    management of suspected neurosyphilis, since a diagnosis of neurosyphilis
    changes therapy from intramuscular benzathine penicillin to 10-14 days of
    intravenous aqueous crystalline penicillin. CSF-VDRL is highly specific but
    insensitive, so a negative result in a patient with neurologic signs does
    not exclude the diagnosis.
  diagnosis_term:
    preferred_term: cerebrospinal fluid examination by lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  results: >-
    A reactive CSF-VDRL in an uncontaminated specimen is diagnostic; a negative
    result does not exclude neurosyphilis.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For a person with neurologic signs or symptoms, a reactive CSF-VDRL (in the absence of blood contamination) is considered diagnostic of neurosyphilis."
    explanation: >-
      Establishes the reactive CSF-VDRL as diagnostic of neurosyphilis.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF-VDRL is highly specific but insensitive"
    explanation: >-
      Establishes the insensitivity that makes a negative CSF-VDRL
      non-exclusionary.
differential_diagnoses:
- name: Genital herpes
  description: >-
    HSV is the commonest cause of genital ulceration. Herpetic ulcers are
    typically multiple, painful, and vesicular at onset, whereas the syphilitic
    chancre is classically solitary, painless, and indurated.
- name: Chancroid
  description: >-
    Haemophilus ducreyi produces a painful, non-indurated genital ulcer with a
    ragged undermined edge and suppurative lymphadenitis, contrasting with the
    clean-based, indurated, painless chancre.
- name: Pityriasis rosea
  description: >-
    Shares the truncal papulosquamous eruption of secondary syphilis but spares
    the palms and soles, whose involvement is the key discriminator.
- name: Sarcoidosis
  description: >-
    Another cause of granulomatous lesions that can mimic gummas and produce
    uveitis; distinguished by serology and histology.
treatments:
- name: Parenteral penicillin G, stage-dependent regimen
  description: >-
    Parenteral penicillin G is the treatment of choice at every stage.
    Benzathine penicillin G 2.4 million units IM as a single dose treats
    primary, secondary, and early-latent syphilis; the same dose weekly for
    three weeks treats late-latent, unknown-duration, and non-neurological
    tertiary disease; and aqueous crystalline penicillin G IV for 10-14 days is
    required for neurosyphilis, ocular syphilis, and otosyphilis. Neither oral
    penicillin preparations nor benzathine-procaine combinations are adequate
    therapy at any stage. Tertiary structural damage already established -
    aortic aneurysm, tabetic deficits, gummatous scarring - does not reverse
    with microbiological cure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: penicillin G benzathine
      term:
        id: NCIT:C47657
        label: Penicillin G Benzathine
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: >-
      Beta-lactam acylation of penicillin-binding proteins halts peptidoglycan
      cross-linking and is treponemicidal.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penicillin G, administered parenterally, is the preferred drug for treating patients in all stages of syphilis."
    explanation: >-
      Directly supports parenteral penicillin G as first-line therapy at every
      stage of syphilis.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combinations of benzathine penicillin, procaine penicillin, and oral penicillin preparations are not considered appropriate for syphilis treatment."
    explanation: >-
      Supports the negative recommendation in this description against oral and
      combination penicillin preparations.
- name: Doxycycline for penicillin-allergic non-pregnant patients
  description: >-
    Doxycycline 100 mg orally twice daily for 14 days (longer for late-stage
    disease) is the principal alternative for non-pregnant, penicillin-allergic
    patients with non-neurological syphilis. It is not an option in pregnancy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Treponemal Ribosomal Translation (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the 30S ribosomal subunit and arrests treponemal
      protein synthesis.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only acceptable alternatives for treating late latent syphilis or syphilis of unknown duration are doxycycline (100 mg orally 2 times/day) or tetracycline (500 mg orally 4 times/day), each for 28 days."
    explanation: >-
      Gives the doxycycline regimen and its status as an acceptable alternative
      in late latent disease.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No proven alternatives to penicillin are available for treatment of syphilis during pregnancy."
    explanation: >-
      Establishes the pregnancy boundary of doxycycline's role.
- name: Penicillin desensitization in pregnancy
  description: >-
    Because no alternative to penicillin is proven for syphilis in pregnancy,
    and because untreated maternal infection causes congenital syphilis, a
    pregnant patient reporting penicillin allergy should be desensitized and
    then treated with penicillin rather than given a substitute agent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: penicillin desensitization
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pregnant women with syphilis at any stage who report penicillin allergy should be desensitized and treated with penicillin"
    explanation: >-
      Directly supports desensitization rather than substitution in pregnancy.
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No proven alternatives to penicillin are available for treatment of syphilis during pregnancy."
    explanation: >-
      Establishes the absence of an acceptable alternative that makes
      desensitization necessary.
- name: Azithromycin, no longer recommended where resistance is prevalent
  description: >-
    Azithromycin was historically used as a single-dose oral alternative but is
    compromised by 23S rRNA A2058G/A2059G resistance, now prevalent in many
    regions. It is not recommended where resistance prevalence is unknown or
    high. This is the sharpest treatment contrast with the endemic
    treponematoses, where single-dose azithromycin underpins mass drug
    administration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Treponemal Ribosomal Translation (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the 50S ribosomal subunit and arrests treponemal
      protein synthesis - but only in strains lacking the A2058G/A2059G 23S
      rRNA mutation, which abolishes macrolide binding.
  evidence:
  - reference: PMID:18192791
    reference_title: "Azithromycin resistance in Treponema pallidum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although the recommended treatment for syphilis is penicillin, azithromycin has been used as an alternative."
    explanation: >-
      Establishes azithromycin's status as an alternative agent whose use is
      constrained by resistance.
  - reference: PMID:18192791
    reference_title: "Azithromycin resistance in Treponema pallidum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We discuss azithromycin-related treatment failures and resistance in Treponema pallidum, and propose ways to meet the resulting clinical and public health challenges."
    explanation: >-
      Documents azithromycin treatment failure and resistance as the reason for
      its restricted role.
- name: Anticipatory counselling for the Jarisch-Herxheimer reaction
  description: >-
    The Jarisch-Herxheimer reaction is an acute febrile reaction with headache
    and myalgia occurring within the first 24 hours of any effective syphilis
    therapy. It is a reaction to treatment, not penicillin allergy, and
    mistaking it for allergy risks withholding the only curative drug. In a
    prospective secondary analysis of a randomized trial of benzathine
    penicillin G for early syphilis, symptoms occurred in 23.7% of
    participants, with median onset about 5 hours and median duration about 13
    hours. Management is supportive; patients should be counselled before
    treatment.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: pre-treatment counselling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Jarisch-Herxheimer reaction is an acute febrile reaction frequently accompanied by headache, myalgia, and fever that can occur within the first 24 hours after the initiation of any syphilis therapy; it is a reaction to treatment and not an allergic reaction to penicillin."
    explanation: >-
      Defines the reaction and states explicitly that it is not penicillin
      allergy, the clinically consequential distinction.
  - reference: PMID:39946129
    reference_title: "Jarisch-Herxheimer Reaction After Benzathine Penicillin G Treatment in Adults With Early Syphilis: Secondary Analysis of a Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One or more JHR symptoms occurred in 59 participants (23.7%) treated for early syphilis, with a median symptom onset at 4.9 hours (IQR, 3.0-9.2 hours) and a median duration of 12.8 hours (IQR, 5.0-24.0 hours)."
    explanation: >-
      Provides the prospective incidence, onset, and duration figures quoted in
      this entry.
  - reference: PMID:39946129
    reference_title: "Jarisch-Herxheimer Reaction After Benzathine Penicillin G Treatment in Adults With Early Syphilis: Secondary Analysis of a Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of the Jarisch-Herxheimer reaction (JHR) after penicillin treatment for early syphilis is reported to range from 8% to 56%."
    explanation: >-
      Documents the wide range of previously reported incidence estimates that
      this trial was designed to resolve.
- name: Doxycycline post-exposure prophylaxis (doxy-PEP)
  description: >-
    Doxycycline 200 mg taken within 72 hours of condomless sex reduces incident
    syphilis and chlamydia by more than 70% in randomized trials. CDC recommends
    it for men who have sex with men and transgender women with a bacterial STI
    in the preceding 12 months. It acts upstream of the inoculation step rather
    than treating established infection, so it is prevention rather than
    therapy.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: post-exposure chemoprophylaxis
    term:
      id: NCIT:C15843
      label: Preventive Intervention
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Treponemal Ribosomal Translation (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline arrests treponemal protein synthesis, eliminating the
      organism before infection is established.
  evidence:
  - reference: PMID:38833414
    reference_title: "CDC Clinical Guidelines on the Use of Doxycycline Postexposure Prophylaxis for Bacterial Sexually Transmitted Infection Prevention, United States, 2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three large randomized controlled trials, 200 mg of doxycycline taken within 72 hours after sex has been shown to reduce syphilis and chlamydia infections by >70% and gonococcal infections by approximately 50%."
    explanation: >-
      Gives the dose, the 72-hour window, and the randomized-trial effect size
      for syphilis prevention.
- name: Aortic aneurysm repair and valve replacement
  description: >-
    Advanced cardiovascular syphilis with a hemodynamically significant
    aneurysm or aortic regurgitation requires surgical repair or valve
    replacement; antimicrobial cure does not reverse established structural
    damage.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:27982548
    reference_title: "Syphilitic aortitis and its complications in the modern era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The consequent weakening of the aortic wall can lead to severe complications, represented by aortic aneurysm, aortic valvular insufficiency, aortic root dilation and coronary ostial stenosis."
    explanation: >-
      Establishes the structural complications that constitute the surgical
      indication.
histopathology:
- name: Obliterative endarteritis with plasma cell infiltrate
  description: >-
    The characteristic microscopic lesion across every stage is a
    lymphoplasmacytic vasculitis of small vessels with endothelial swelling and
    concentric intimal proliferation narrowing the lumen. A plasma-cell-rich
    infiltrate is the histological signature that suggests syphilis in an
    otherwise nonspecific biopsy.
  finding_term:
    preferred_term: obliterative endarteritis with plasma cell infiltrate
    term:
      id: NCIT:C35984
      label: Lymphoplasmacytic Infiltrate
  evidence:
  - reference: PMID:27982548
    reference_title: "Syphilitic aortitis and its complications in the modern era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the inflammatory response progresses towards obliterative endarteritis and necrosis of the muscular and elastic fibers in the aortic media"
    explanation: >-
      Describes the obliterative endarteritis and consequent medial necrosis
      that define the lesion.
  - reference: PMID:16224168
    reference_title: "A case of primary syphilis in the rectum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histologic evaluation of biopsy revealed obliterative endarteritis with heavy plasma cell infiltration"
    explanation: >-
      Documents the same obliterative endarteritis with a plasma-cell-rich
      infiltrate in a primary lesion, supporting this as the lesion shared
      across stages rather than an aortitis-specific finding.
environmental:
- name: HIV coinfection
  description: >-
    HIV and syphilis are bidirectionally associated. Syphilis infection
    increases subsequent HIV acquisition roughly two- to three-fold in
    high-risk populations, and HIV coinfection is associated with accelerated,
    more severe neurosyphilis.
  effect: >-
    Raises the risk of acquiring HIV and, once coinfected, accelerates
    progression of neurological disease.
  influences_mechanisms:
  - target: Parenchymal Neurosyphilis
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      HIV coinfection is associated with an accelerated and more severe
      neurosyphilis course, plausibly through impaired CD4-positive
      T-cell-mediated containment.
    evidence:
    - reference: PMID:25890619
      reference_title: "Neurosyphilis and the impact of HIV infection."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "This review of the clinical presentation, diagnostic laboratory findings, treatment and management of neurosyphilis discusses the impact of HIV and the specific challenges it brings"
      explanation: >-
        PARTIAL: establishes that HIV modifies the course and management of
        neurosyphilis without quantifying the effect.
  evidence:
  - reference: PMID:33219164
    reference_title: "Effect of syphilis infection on HIV acquisition: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIV incidence showed a two-time increase after syphilis exposure, compared with a control group"
    explanation: >-
      Quantifies the increase in HIV acquisition following syphilis infection
      in a meta-analysis of 65,232 participants.
  - reference: PMID:25890619
    reference_title: "Neurosyphilis and the impact of HIV infection."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "discusses the impact of HIV and the specific challenges it brings"
    explanation: >-
      PARTIAL: establishes that HIV modifies neurosyphilis management without
      quantifying the effect.
- name: Absent or late prenatal care
  description: >-
    Lack of, or late presentation to, prenatal care is the dominant modifiable
    risk factor for congenital syphilis, because it removes the screening and
    treatment opportunity that would otherwise prevent transmission.
  effect: >-
    Removes the screening and treatment window, converting a preventable
    maternal infection into congenital disease.
  influences_mechanisms:
  - target: Transplacental Fetal Dissemination
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Absent or late prenatal care removes the screening-and-treatment window
      that would otherwise interrupt maternal-fetal transmission. The effect is
      indirect: lack of care does not itself drive transmission, it removes the
      intervention that prevents it.
    evidence:
    - reference: PMID:40977496
      reference_title: "Syphilis in pregnancy: A practical guide for prenatal care providers."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "As early diagnosis and treatment are highly effective in reducing transmission, syphilis screening should begin at the first prenatal visit."
      explanation: >-
        PARTIAL: establishes the first prenatal visit as the intervention point
        whose absence permits transmission, without quantifying the risk of
        absent care.
  evidence:
  - reference: PMID:40977496
    reference_title: "Syphilis in pregnancy: A practical guide for prenatal care providers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As early diagnosis and treatment are highly effective in reducing transmission, syphilis screening should begin at the first prenatal visit."
    explanation: >-
      Establishes the first prenatal visit as the point at which screening and
      treatment interrupt transmission, which is what absent or late prenatal
      care removes. PARTIAL because the source states the effectiveness of early
      screening rather than quantifying the risk conferred by its absence.
discussions:
- discussion_id: syphilis_host_genetic_determinants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are there host genetic determinants of syphilis susceptibility, clinical
    stage progression, or the serofast state?
  rationale: >-
    No validated host susceptibility locus for syphilis exists, in contrast to
    well-established examples in other infections such as CCR5-delta32 for HIV.
    Reported correlations between HLA-DR+CD8+ T cell subsets and
    recurrence/reinfection/serofast status in HIV-syphilis coinfected cohorts
    are suggestive but uncontrolled and unreplicated. Because the serofast
    state drives repeat treatment and repeat lumbar puncture decisions in
    practice, a genuine host determinant would change management.
  attaches_to:
  - pathophysiology#Latency and Persistent Infection
  proposed_experiments:
  - experiment_id: exp_syphilis_host_gwas
    name: Host genome-wide association study of syphilis outcome
    description: >-
      A GWAS in a well-phenotyped cohort stratified by stage at diagnosis and
      by serological response after adequate therapy, with HIV status modelled
      explicitly as a covariate rather than a confounder.
- discussion_id: syphilis_lesion_single_cell_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the host transcriptional response within syphilitic lesions at
    single-cell or spatial resolution?
  rationale: >-
    Mechanistic work on syphilis has been overwhelmingly pathogen-side
    (outer-membrane protein structural modelling, TprK deep sequencing). No
    single-cell or spatial transcriptomic dataset of chancre, secondary rash,
    or gumma tissue was identified. This leaves the central claim of this
    entry's pathograph - that a Th1 response clears organisms from
    mucocutaneous lesions without eradicating infection - inferred rather than
    directly observed in human tissue.
  attaches_to:
  - pathophysiology#Th1 Cellular Immune Response and Partial Clearance
  proposed_experiments:
  - experiment_id: exp_syphilis_spatial_transcriptomics
    name: Spatial transcriptomics of staged syphilitic lesions
    description: >-
      Spatial transcriptomic and single-cell profiling of paired chancre,
      secondary-rash, and gumma biopsies to test whether the predicted Th1 and
      macrophage-activation programme is present and how it differs between the
      clearing early lesions and the persistent tertiary granuloma.
notes: >-
  GeneReviews is not applicable: syphilis is an acquired infectious disease, and
  a PubMed search for a GeneReviews chapter returned no results. Inheritance is
  deliberately not modelled - congenital syphilis is vertical transmission of an
  infection, not a Mendelian inheritance pattern, so no HP mode-of-inheritance
  term is bound.

  Scope: this entry covers venereal syphilis (Treponema pallidum subsp.
  pallidum). The endemic treponematoses yaws, bejel, and pinta are caused by
  distinct subspecies, are separate MONDO entities, and are curated as separate
  dismech entries. The four entries together would support a Treponematoses
  grouping, which does not yet exist.

  Deliberately not asserted for want of a verified citation: the 15-40% figure for
  progression to tertiary disease in untreated people; stage-specific
  transplacental transmission probabilities; and US congenital syphilis
  surveillance counts. Each is described in the deep-research report but was
  sourced there to web pages rather than to citable abstracts, and each needs a
  dedicated reference before it is curated as evidence.

  Deep-research caveat: the claude_code report proposed MONDO:0005097 as the
  disease term for syphilis. That CURIE is squamous cell lung carcinoma. The
  correct term, MONDO:0005976, was resolved with OAK. The report also emitted a
  malformed NCBITaxon identifier ("NCBITaxon:160rest"); the correct taxon for
  the venereal subspecies is NCBITaxon:161.

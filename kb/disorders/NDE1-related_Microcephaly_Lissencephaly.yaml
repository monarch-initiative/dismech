differential_diagnoses:
- name: Autosomal Recessive Primary Microcephaly
  description: >-
    Primary microcephaly (MCPH, such as STIL-related microcephaly) presents with
    congenital microcephaly, and severe cases with thalamic fusion may initially
    prompt STIL testing; however, NDE1-related disease is distinguished by more
    extreme brain volume reduction (<10% of expected size), cortical
    dyslamination/lissencephaly, and ventriculomegaly or hydranencephaly-like
    features.
  distinguishing_features:
  - More extreme brain size reduction (<10% expected cortical volume) with cortical dyslamination and microlissencephaly in NDE1 deficiency
  - Biallelic pathogenic variants in NDE1 rather than STIL or other MCPH genes
  disease_term:
    preferred_term: autosomal recessive primary microcephaly
    term:
      id: MONDO:0016660
      label: autosomal recessive primary microcephaly
  evidence:
  - reference: PMID:30637988
    reference_title: "Phenotypic spectrum of NDE1-related disorders: from microlissencephaly to microhydranencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the fused thalami, the STIL gene was targeted initially but
      showed negative results.
    explanation: >-
      Illustrates clinical overlap with primary microcephaly (STIL/MCPH7) in the
      diagnostic workup of NDE1-related disorder.
- name: LIS1-Related Classical Lissencephaly
  description: >-
    Classical lissencephaly due to PAFAH1B1 (LIS1) mutation shares
    dynein-pathway neuronal migration impairment and agyria/pachygyria, whereas
    NDE1 deficiency additionally arrests neural progenitor cell-cycle
    progression at multiple stages, causing extreme congenital microcephaly
    alongside lissencephaly (microlissencephaly).
  distinguishing_features:
  - Extreme congenital microcephaly from radial-glial progenitor depletion in addition to cortical migration defects
  - Autosomal recessive NDE1 loss-of-function variants rather than heterozygous PAFAH1B1 (LIS1) variants
  disease_term:
    preferred_term: lissencephaly due to LIS1 mutation
    term:
      id: MONDO:0011830
      label: lissencephaly due to LIS1 mutation
  evidence:
  - reference: PMID:21529751
    reference_title: "Human mutations in NDE1 cause extreme microcephaly with lissencephaly [corrected]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Genes disrupted in human microcephaly (meaning "small brain") define key
      regulators of neural progenitor proliferation and cell-fate specification.
      In comparison, genes mutated in human lissencephaly (lissos means smooth
      and cephalos means brain) highlight critical regulators of neuronal
      migration.
    explanation: >-
      Contrasts isolated lissencephaly (neuronal migration disorders) with the
      combined microcephaly-lissencephaly phenotype of NDE1 mutation.
  - reference: PMID:37940657
    reference_title: Nde1 promotes Lis1-mediated activation of dynein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The assembly of dynein with dynactin and a cargo adaptor in an active
      transport complex is facilitated by Lis1 and Nde1/Ndel1.
    explanation: >-
      Explains the shared dynein-pathway mechanism linking LIS1-related
      lissencephaly and NDE1-related microlissencephaly.
- name: Miller-Dieker Lissencephaly Syndrome
  description: >-
    Miller-Dieker syndrome is a severe 17p13.3 contiguous-gene deletion form of
    classical lissencephaly with developmental delay and intractable epilepsy; it
    is distinguished from NDE1-related microlissencephaly by characteristic
    craniofacial dysmorphism, 17p13.3 deletion involving PAFAH1B1/YWHAE, and
    absence of the extreme NDE1-type microcephaly.
  distinguishing_features:
  - Caused by 17p13.3 contiguous gene deletion rather than biallelic 16p13.11 NDE1 variants
  - Predominant classical agyria without the extreme (<10% expected brain volume) microcephaly characteristic of NDE1 loss
  disease_term:
    preferred_term: Miller-Dieker lissencephaly syndrome
    term:
      id: MONDO:0009532
      label: Miller-Dieker lissencephaly syndrome
  evidence:
  - reference: PMID:28111201
    reference_title: Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Classical lissencephaly is a genetic neurological disorder associated with
      mental retardation and intractable epilepsy, and Miller-Dieker syndrome
      (MDS) is the most severe form of the disease.
    explanation: >-
      Describes Miller-Dieker syndrome as the severe classical lissencephaly
      comparator in cortical malformation modeling.

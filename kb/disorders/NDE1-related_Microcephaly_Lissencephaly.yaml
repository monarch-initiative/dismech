      disrupted by NDE1 loss.
  - reference: PMID:37940657
    reference_title: Nde1 promotes Lis1-mediated activation of dynein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Before the initiation of motility, the association of dynactin with dynein
      triggers the dissociation of Nde1 from dynein by competing against Nde1
      binding to the dynein intermediate chain.
    explanation: >-
      Confirms that NDE1 directly binds the dynein intermediate chain before
      dynactin-mediated displacement.

    families have been reported.
  evidence:
  - reference: ORPHA:79155
    reference_title: "Hydroxykynureninuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | ORPHANET"
    explanation: Orphanet epidemiology table.
pathophysiology:
- name: Kynureninase Deficiency
  description: >-
    Biallelic KYNU variants lower the activity of kynureninase, the pyridoxal
    5'-phosphate-dependent hydrolase that cleaves 3-hydroxykynurenine to
    3-hydroxyanthranilic acid (and kynurenine to anthranilic acid) in the
    kynurenine branch of tryptophan catabolism. The confirmed p.Thr198Ala
    allele is hypomorphic rather than null.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KYNU
    term:
      id: hgnc:6469
      label: KYNU
  molecular_functions:
  - preferred_term: kynureninase activity
    modifier: DECREASED
    term:
      id: GO:0030429
      label: kynureninase activity
  biological_processes:
  - preferred_term: L-tryptophan catabolic process
    modifier: DECREASED
    term:
      id: GO:0006569
      label: L-tryptophan catabolic process
  downstream:
  - target: Upstream Kynurenine Pathway Metabolite Accumulation
    causal_link_type: DIRECT
    description: Substrates immediately upstream of the reduced enzymatic step
      accumulate and spill into urine.
    evidence:
    - reference: PMID:17334708
      reference_title: "Xanthurenic aciduria due to a mutation in KYNU encoding kynureninase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Massive urinary excretion of xanthurenic acid, 3-hydroxykynurenine
        and kynurenine, known as xanthurenic aciduria or hydroxykynureninuria, in
        a young Somali boy suggested kynureninase deficiency."
      explanation: The excretion of the kynureninase substrates is the
        biochemical consequence that pointed to kynureninase deficiency, later
        confirmed by finding a homozygous KYNU variant.
  - target: Reduced Tryptophan-Derived NAD+ Synthesis
    causal_link_type: DIRECT
    description: Kynureninase is a step of the de novo route from tryptophan
      to NAD+, so lowering its activity lowers flux to NAD+.
  evidence:
  - reference: PMID:17334708
    reference_title: "Xanthurenic aciduria due to a mutation in KYNU encoding kynureninase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report linking xanthurenic aciduria to a mutation
      in the gene encoding kynureninase."
    explanation: Establishes KYNU, encoding kynureninase, as the causal gene.
  - reference: ORPHA:79155
    reference_title: "Hydroxykynureninuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KYNU | kynureninase | hgnc:6469 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet records loss-of-function germline KYNU variants as
      disease-causing.
  - reference: PMID:36465553
    reference_title: "Bypassing evolutionary dead ends and switching the rate-limiting step of a human immunotherapeutic enzyme."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the human enzyme (HsKYNase) has very low activity for kynurenine
      and shows no therapeutic effect"
    explanation: Enzymology of wild-type human kynureninase showing that
      kynurenine is a poor substrate, consistent with 3-hydroxykynurenine being
      the physiological substrate whose cleavage is lost in this disorder.
  - reference: PMID:35658075
    reference_title: "Leveraging intrinsic flexibility to engineer enhanced enzyme catalytic activity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the amino acid substitutions in BF-HsKYNase allosterically affect
      the flexibility of the pyridoxal-5′-phosphate (PLP) binding pocket,
      thereby impacting the rate of chemistry"
    explanation: Structural enzymology of human kynureninase showing that
      catalysis depends on its pyridoxal 5'-phosphate binding pocket, the
      cofactor dependence that motivates pyridoxine supplementation.
- name: Upstream Kynurenine Pathway Metabolite Accumulation
  description: >-
    3-Hydroxykynurenine and kynurenine, the substrates of kynureninase,
    accumulate and are excreted in large amounts in urine. Accumulated
    3-hydroxykynurenine is diverted through transamination to xanthurenic acid.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: 3-hydroxy-L-kynurenine
    modifier: INCREASED
    term:
      id: CHEBI:17380
      label: 3-hydroxy-L-kynurenine
  - preferred_term: L-kynurenine
    modifier: INCREASED
    term:
      id: CHEBI:16946
      label: L-kynurenine
  downstream:
  - target: Xanthurenic Acid Overproduction
    causal_link_type: DIRECT
    description: Excess 3-hydroxykynurenine is transaminated to xanthurenic acid,
      the side product that gives the disorder its alternative name.
  - target: Elevated urinary 3-hydroxykynurenine level
    causal_link_type: DIRECT
  - target: Elevated urine kynurenine level
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17334708
    reference_title: "Xanthurenic aciduria due to a mutation in KYNU encoding kynureninase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Massive urinary excretion of xanthurenic acid, 3-hydroxykynurenine
      and kynurenine, known as xanthurenic aciduria or hydroxykynureninuria, in
      a young Somali boy suggested kynureninase deficiency."
    explanation: Documents accumulation and urinary loss of both kynureninase
      substrates in a genetically confirmed patient.
- name: Xanthurenic Acid Overproduction
  description: >-
    Xanthurenic acid, formed from accumulated 3-hydroxykynurenine, rises in
    plasma and is excreted in urine; urinary xanthurenic acid is the readily
    measured diagnostic marker of kynureninase deficiency.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: xanthurenic acid
    modifier: INCREASED
    term:
      id: CHEBI:10072
      label: xanthurenic acid
  downstream:
  - target: Elevated urinary xanthurenic acid level
    causal_link_type: DIRECT
  evidence:
  - reference: ORPHA:79155
    reference_title: "Hydroxykynureninuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by massive urinary excretion of xanthurenic acid
      (XA), 3-hydroxykynurenine and kynurenine and increased XA concentration in
      plasma"
    explanation: Orphanet defines the disorder by xanthurenic acid excess in
      urine and plasma.
  - reference: PMID:31923704
    reference_title: "Biallelic variants in KYNU cause a multisystemic syndrome with hand hyperphalangism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present unrelated patients identified with biallelic variants in
      KYNU leading to kynureninase deficiency and xanthurenic aciduria"
    explanation: Patients with the allelic KYNU malformation disorder also show
      xanthurenic aciduria, supporting it as a consistent consequence of the
      enzyme defect across the KYNU spectrum.
- name: Reduced Tryptophan-Derived NAD+ Synthesis
  description: >-
    Kynureninase sits on the de novo pathway that makes NAD+ from tryptophan,
    so its deficiency reduces tryptophan-derived NAD+ supply. Severe KYNU loss
    of function lowers circulating NAD in the allelic malformation disorder.
    For hydroxykynureninuria this node is a hypothesis: the pellagra-like
    stomatitis and skin findings reported in severe historical cases fit a
    postnatal niacin-equivalent shortfall, but none of the sources cited here
    reports an NAD+ measurement in those cases, and the molecularly confirmed
    hypomorphic homozygotes had no signs of niacin deficiency.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: de novo NAD+ biosynthesis from L-tryptophan
    modifier: DECREASED
    term:
      id: GO:0034354
      label: "'de novo' NAD+ biosynthetic process from L-tryptophan"
  downstream:
  - target: Stomatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred from the pellagra-like presentation; stomatitis is a
      classic mucosal sign of niacin deficiency. No source measures NAD+ in an
      affected individual with stomatitis.
  - target: Dry skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Inferred from the pellagra-like presentation; dry, rough skin
      is a cutaneous sign of niacin deficiency. No source measures NAD+ in an
      affected individual with this finding.
  evidence:
  - reference: PMID:28792876
    reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nicotinamide adenine dinucleotide (NAD) is synthesized de novo
      from tryptophan through the kynurenine pathway. The patients had reduced
      levels of circulating NAD."
    explanation: Patients with severe KYNU or HAAO loss of function had reduced
      circulating NAD. These patients have the allelic malformation disorder,
      so the finding supports the node only by extrapolation to this
      presentation.
  - reference: PMID:17334708
    reference_title: "Xanthurenic aciduria due to a mutation in KYNU encoding kynureninase."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, neither of the two boys has symptoms of niacin
      deficiency."
    explanation: The only molecularly confirmed hydroxykynureninuria patients,
      homozygous for a hypomorphic allele, showed no clinical niacin
      deficiency, so a clinically relevant NAD+ shortfall is not a constant
      feature of this disorder.

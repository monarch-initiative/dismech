- name: Encephalopathy
  category: Neurological
  description: >-
    Encephalopathy is the feature named in the MONDO label. The Orphanet record
    is internally inconsistent about its course: its definition mentions
    progressive encephalopathy with muscular hypotonia in severe cases, while
    its phenotype table marks progressive encephalopathy as excluded.
    Orphanet annotates encephalopathy as obligate, but the abstract on the
    only molecularly confirmed siblings describes no neurological disease, so
    no frequency is recorded here.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: ORPHA:79155
    reference_title: "Hydroxykynureninuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0001298 | Encephalopathy | Obligate (100%)"
    explanation: Orphanet annotates encephalopathy for this disorder.
  - reference: ORPHA:79155

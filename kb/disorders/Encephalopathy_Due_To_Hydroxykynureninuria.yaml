    supports: SUPPORT
    evidence_source: OTHER
    snippet: "to more severe cases with manifestions which include intellectual
      disability, cerebellar ataxia, pellagra, progressive encephalopathy with
      muscular hypotonia"
    explanation: Orphanet definition places encephalopathy in the severe end of
      a variable spectrum.

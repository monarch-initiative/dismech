name: Encephalopathy Due To Hydroxykynureninuria
creation_date: "2026-10-30T18:00:00Z"
category: Mendelian
synonyms:
- Hydroxykynureninuria
- Kynureninase deficiency
- Xanthurenic aciduria
description: >-
  An autosomal recessive inborn error of tryptophan metabolism caused by
  biallelic KYNU variants that reduce kynureninase activity. The enzymatic
  block in the kynurenine pathway causes massive urinary excretion of
  xanthurenic acid, 3-hydroxykynurenine and kynurenine, with raised plasma
  xanthurenic acid. The clinical picture of the historically reported cases is
  highly variable: some individuals are asymptomatic or have only jaundice and
  vomiting with normal later development, while others have intellectual
  disability, developmental delay, cerebellar ataxia, pellagra-like
  mucocutaneous signs, encephalopathy with hypotonia, stereotypies or
  congenital deafness. The only molecularly confirmed family carries a
  homozygous KYNU missense allele (p.Thr198Ala) and has no congenital
  malformations, distinguishing this metabolic presentation from the allelic
  multiple-malformation disorder caused by more severe KYNU loss of function.
disease_term:
  preferred_term: encephalopathy due to hydroxykynureninuria
  term:
    id: MONDO:0009372
    label: encephalopathy due to hydroxykynureninuria
parents:
- Inborn disorder of tryptophan metabolism
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:

      label: Autosomal recessive inheritance
  evidence:
  - reference: ORPHA:79155
    reference_title: "Hydroxykynureninuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet records autosomal recessive inheritance for hydroxykynureninuria.
  - reference: PMID:17334708
    reference_title: "Xanthurenic aciduria due to a mutation in KYNU encoding kynureninase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of KYNU encoding kynureninase of the index case
      revealed homozygosity for a c.593 A > G substitution leading to a
      threonine-to-alanine (T198A) shift. A younger brother was found to have a
      similar excretion pattern and the same genotype."
    explanation: Two affected brothers are homozygous for the same KYNU allele,
      the genotype pattern expected of a recessive disorder.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000

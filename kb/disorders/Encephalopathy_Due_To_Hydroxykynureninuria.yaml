notes: >-
  Allelic with vertebral, cardiac, renal, and limb defects syndrome 2
  (MONDO:0060555, OMIM 617661), which is curated as the VCRL2 subtype of
  Congenital_Vertebral-Cardiac-Renal_Anomalies_Syndrome. Both are KYNU
  (kynureninase) deficiency and share xanthurenic aciduria, but MONDO and OMIM
  keep them as separate diseases: this entry covers the metabolically
  ascertained presentation without congenital malformations (OMIM 236800),
  while VCRL2 is the congenital NAD deficiency malformation disorder caused by
  more severe loss of function. In MONDO neither term subsumes the other:
  this one sits under inborn disorder of tryptophan metabolism (MONDO:0017350)
  and VCRL2 under congenital vertebral-cardiac-renal anomalies syndrome
  (MONDO:0020831). Orphanet also keeps hydroxykynureninuria (ORPHA:79155) as
  its own disorder. Hydroxykynureninuria has been reported in only a handful
  of families since 1964, one of them molecularly confirmed. The p.Thr198Ala allele in the only molecularly
  confirmed hydroxykynureninuria family retains substantial residual function
  in published assays: about 64% of wild-type enzyme activity in the in vitro
  assay of PMID:28792876 (as reported in the full texts of PMID:31923704 and
  PMID:33942433), and 74% of wild-type NAD in the yeast complementation assay
  of PMID:33942433, which used it as a disease-negative control. This residual
  function is the proposed explanation for the difference. The pre-molecular case reports (Komrower 1964 and 1967, Reddi
  1978, Jothi 1982; PMID:14169454, PMID:6015911, PMID:649181, PMID:7152601)
  have no PubMed abstract to quote, so their clinical detail enters this entry
  only through the Orphanet record. No GeneReviews chapter covers
  hydroxykynureninuria; the GeneReviews chapter Congenital NAD Deficiency
  Disorder covers KYNU only as a cause of the allelic malformation disorder and
  is therefore not used as this entry's phenotype baseline.
review_notes: >-
  Lump/split: kept as a Disease entry separate from the VCRL2 subtype of
  Congenital_Vertebral-Cardiac-Renal_Anomalies_Syndrome. The two share the KYNU
  enzyme block, and the openscientist report frames them as one spectrum, but
  the molecularly confirmed hydroxykynureninuria allele is hypomorphic and its
  carriers have no malformations, so the VCRL entry's causal chain (embryonic
  NAD deficiency leading to vertebral, cardiac, renal and limb defects) does
  not describe this presentation, and a subtype row there would assert
  malformations these patients do not have. No encephalopathy-specific
  mechanism has been established; the neurological phenotype rests on
  pre-molecular case reports ascertained partly through screening of children
  with intellectual disability. A future single KYNU deficiency entry covering
  both presentations would be a defensible alternative and would need the VCRL
  entry restructured.

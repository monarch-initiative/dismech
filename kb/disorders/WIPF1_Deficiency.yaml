  description: >-
    Loss of WASP leaves leukocytes unable to remodel their actin cytoskeleton:
    the patient's cells show defective T-cell proliferation and chemotaxis and
    impaired natural killer cell function, the same actin-dependent defects seen
    in classic Wiskott-Aldrich syndrome.

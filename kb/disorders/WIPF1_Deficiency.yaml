animal_models:
- name: WIP knockout mouse
  species: Mouse
  genotype: Wip-/- (Wipf1-null)
  description: >-
    WIP-knockout mice show the same post-transcriptional WASP loss seen in the
    patient: WASP protein, but not mRNA, is severely reduced and is restored by
    reintroducing WIP. The mice also develop lymphopenia, splenomegaly and
    inflammatory disease including colitis and interstitial pneumonitis,
    recapitulating the patient phenotype.
  modeled_mechanisms:
  - target: WASP Degradation and Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Wip-null T cells lose WASP protein while keeping WASP mRNA, as in the patient.
    limitations: >-
      The mouse models the molecular WASP-stabilization defect; it is not used
      here for the full clinical WAS phenotype.
    evidence:
    - reference: PMID:17213309
      reference_title: "WIP is a chaperone for Wiskott-Aldrich syndrome protein (WASP)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "WASP levels, but not mRNA levels, were severely diminished in T cells from WIP(-/-) mice and were increased by introduction of WIP in these cells."
      explanation: The knockout reproduces the patient's post-transcriptional WASP deficiency.
  evidence:
  - reference: PMID:17213309
    reference_title: "WIP is a chaperone for Wiskott-Aldrich syndrome protein (WASP)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WASP levels, but not mRNA levels, were severely diminished in T cells from WIP(-/-) mice and were increased by introduction of WIP in these cells."
    explanation: Establishes the WIP-knockout mouse as the mechanistic model.
notes: >-
  WIPF1 deficiency rests on three probands across three publications (Lanzi
  et al. 2012, PMID:22231303, plus PMID:27742395 and PMID:28903942), so no
  phenotype frequencies are given. The abstracts of the two later reports are
  not retrievable, so their specific alleles are not written as variant rows
  and their patient details are cited through the ClinGen evidence summary
  rather than quoted directly. No GeneReviews chapter covers it.

  The WASP-degradation mechanism rests on the WIP-knockout mouse and in-vitro
  work (de la Fuente et al., 2007); the patient data confirm the undetectable
  WASP with normal WAS mRNA and the rescue by WIP reintroduction.

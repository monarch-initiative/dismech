name: WIPF1 Deficiency
creation_date: "2026-11-06T15:05:00Z"
category: Mendelian
synonyms:
- Wiskott-Aldrich syndrome 2
- WAS2
- WIP deficiency
- WASP-interacting protein deficiency
- autosomal recessive Wiskott-Aldrich syndrome
description: >-
  WIPF1 deficiency (Wiskott-Aldrich syndrome 2) is an autosomal recessive
  immunodeficiency caused by biallelic loss of the WASP-interacting protein
  (WIP), encoded by WIPF1. WIP's main job is to bind and stabilize the
  Wiskott-Aldrich syndrome protein (WASP) and protect it from degradation, so
  when WIP is absent WASP is destroyed even though the WAS gene and its mRNA are
  normal. The result is a clinical picture of Wiskott-Aldrich syndrome arising
  from a gene other than WAS.

  Three probands from three publications are included in ClinGen's curation
  (the index case of Lanzi et al. 2012 plus two later reports), each homozygous
  for a WIPF1 nonsense variant. Patients present in infancy with recurrent
  infections, bloody diarrhoea, thrombocytopenia (with normal platelet volume,
  unlike the microthrombocytopenia of classic WAS), eczema and pneumonitis,
  CD8-predominant T-cell lymphopenia, defective T-cell proliferation and
  chemotaxis, and impaired natural killer cell function, with undetectable WASP
  despite a normal WAS sequence and mRNA. ClinGen's SCID-CID panel rates the
  gene-disease relationship Definitive. Because WASP loss is downstream of WIP,
  the actin-cytoskeleton defects that define WAS recur here, and allogeneic
  haematopoietic cell transplantation is the treatment, as in classic WAS.

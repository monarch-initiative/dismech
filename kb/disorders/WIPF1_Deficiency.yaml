    As in classic Wiskott-Aldrich syndrome, allogeneic haematopoietic cell
    transplantation is the definitive treatment. The index patient underwent
    unrelated cord blood transplantation in infancy.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: WIP Loss of Function
    treatment_effect: BYPASSES
    description: Donor haematopoietic cells carry functional WIPF1, bypassing the lesion in the blood compartment.

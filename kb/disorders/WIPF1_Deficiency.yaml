pathophysiology:
- name: WIP Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A homozygous WIPF1 nonsense variant (c.1301C>G, S434X) abolishes the
    WASP-interacting protein. WIP's principal role is to bind WASP and keep it
    stable.
  genes:
  - preferred_term: WIPF1
    term:
      id: hgnc:12736
      label: WIPF1
  molecular_functions:
  - preferred_term: actin binding
    modifier: DECREASED
    term:
      id: GO:0003779
      label: actin binding
  evidence:
  - reference: PMID:22231303
    reference_title: "A novel primary human immunodeficiency due to deficiency in the WASP-interacting protein WIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous c.1301C>G stop codon mutation was found in the WIPF1 gene, which encodes WIP."
    explanation: The homozygous nonsense variant abolishes WIP.
  downstream:
  - target: WASP Degradation and Deficiency
    causal_link_type: DIRECT
    description: Without WIP to stabilize it, WASP is degraded.
    evidence:
    - reference: PMID:22231303
      reference_title: "A novel primary human immunodeficiency due to deficiency in the WASP-interacting protein WIP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings indicate that the absence of WIP in the patient’s T cells resulted in WASP instability and degradation."
      explanation: Directly links WIP absence to WASP degradation in the patient.
- name: WASP Degradation and Deficiency
  biological_scale: MOLECULAR
  description: >-
    WASP is undetectable despite a normal WAS sequence and mRNA, because WIP
    normally shields WASP from degradation by calpain and the proteasome.
    Reintroducing WIP into the patient's T cells restores WASP, confirming the
    mechanism.
  genes:
  - preferred_term: WAS
    term:
      id: hgnc:12731
      label: WAS
  evidence:
  - reference: PMID:22231303
    reference_title: "A novel primary human immunodeficiency due to deficiency in the WASP-interacting protein WIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cells from this patient had undetectable WAS protein (WASP), but normal WAS sequence and messenger RNA levels."
    explanation: WASP is absent although WAS itself is normal, the hallmark of WIP deficiency.
  - reference: PMID:22231303
    reference_title: "A novel primary human immunodeficiency due to deficiency in the WASP-interacting protein WIP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Introduction of WIP into the patient's T cells restored WASP expression."
    explanation: Restoring WIP rescues WASP, establishing WIP loss as the cause of WASP deficiency.
  - reference: PMID:17213309
    reference_title: "WIP is a chaperone for Wiskott-Aldrich syndrome protein (WASP)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WASP levels, but not mRNA levels, were severely diminished in T cells from WIP(-/-) mice and were increased by introduction of WIP in these cells."
    explanation: WIP-knockout mice show the same post-transcriptional WASP loss and WIP rescue.
  - reference: PMID:17213309
    reference_title: "WIP is a chaperone for Wiskott-Aldrich syndrome protein (WASP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The WASP binding domain of WIP was shown to protect WASP from degradation by calpain in vitro."
    explanation: Mechanism by which WIP stabilizes WASP, lost when WIP is absent.
  downstream:
  - target: Defective Actin Cytoskeleton Remodeling in Leukocytes
    causal_link_type: DIRECT
    description: WASP is the actin-nucleation-promoting factor whose loss disables cytoskeletal remodeling.
- name: Defective Actin Cytoskeleton Remodeling in Leukocytes
